# =============================================================================
# SCAFFOLD.yaml — Continuing Disclosure & Investor Reporting
# Municipal bond issuer finance office. §1.0–§1.7.
# Difficulty target: beyond Expert (§0.4 Expert band, saturated).
# =============================================================================

scenario: |
  2586. Continuing Disclosure & Investor Reporting (municipal bond issuer finance office):
  undertaking inventory across outstanding issues with required annual filing content and
  deadlines, audited financial statement and operating data preparation for each undertaking,
  material event determination and filing within the ten-business-day window, filing submission
  to the central repository with confirmation and correction procedures, failure-to-file
  disclosure in future official statements and remediation policies, bank loan and direct
  placement disclosure practices, rating change and defeasance event handling, dissemination
  agent engagement and calendar monitoring

domain_name: continuing-disclosure-investor-reporting
api_prefix: /disclosure

complexity_profile:
  difficulty_level: beyond_expert
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  # Four layers, per §0.3's 2-4 limit. The calendar sweep is the ops-run checkpoint that
  # drives most of the cascading_side_effects and derived_field_reconciliation work, but it is
  # accounted for under those two layers rather than declared as a fifth.

  entity_topology: flat
  # flat: every entity is addressed at its own top-level collection under /disclosure and
  # linked by explicit FK body fields (issue_id, undertaking_id, cycle_id, material_event_id,
  # supersedes_filing_id). No entity id is nested in another entity's URL path except for
  # action sub-paths on the entity itself (e.g. /filings/{id}/submit). Filing is
  # self-referential (supersedes_filing_id / superseded_by_filing_id) and polymorphic in
  # subject (cycle_id XOR material_event_id XOR direct_placement_id).

  state_machine_shape: cyclic
  # Filing: DRAFT→SUBMITTED→REJECTED→SUBMITTED (resubmission loop) plus CONFIRMED→SUPERSEDED.
  # AnnualReportCycle: DRAFTING→READY_TO_FILE→DRAFTING (content reopen loop) and
  #   FILING_IN_PROGRESS→READY_TO_FILE (repository rejection loop).
  # MaterialEventNotice: branching fork DETERMINATION_PENDING→{MATERIAL, NOT_MATERIAL}
  #   with disjoint side-effect sets per branch.
  # Undertaking: two independent state dimensions on one row — `status`
  #   (ACTIVE↔SUSPENDED→TERMINATED) and `compliance_posture`
  #   (COMPLIANT↔WATCH↔IMPAIRED↔DELINQUENT), each advanced by different triggers.
  # OfficialStatement: COMPLIANCE_REVIEW→COMPLIANCE_REVIEW re-review self-loop.

  relationship_patterns:
    - one_to_many          # Undertaking → ContentRequirement / AnnualReportCycle
    - self_referential     # Filing.supersedes_filing_id → Filing.id (correction chain);
                           # DisseminationEngagement.superseded_by_engagement_id
    - polymorphic          # Filing subject: cycle_id | material_event_id | direct_placement_id
    - cross_aggregate      # FailureToFileEvent spans Undertaking + AnnualReportCycle +
                           # MaterialEventNotice + Filing; OfficialStatement reaches across
                           # every BondIssue sharing an issuer_program_code

  role_model: segregation_of_duties
  # The DisclosureOfficer user that attested a CycleContentItem may not assemble that cycle;
  # the ComplianceReviewer user that reviewed an OfficialStatement may not post it.
  # DisseminationAgent is the only role that may touch the repository submission surface.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: BondIssue
    parent: null
    common_fields: true
    fields:
      - name: issuer_program_code
        type: string
        source: input
        description: >-
          Issuer credit-program grouping code. Defines the scope of the
          official-statement failure-to-file lookback: an OfficialStatement scans
          FailureToFileEvents belonging to Undertakings of every BondIssue sharing
          this exact code.
        constraints: "1..32 chars, uppercase alphanumerics and hyphen"
      - name: series_designation
        type: string
        source: input
        description: "Series label, e.g. '2026A'. Unique within issuer_program_code."
        constraints: "1..16 chars; (issuer_program_code, series_designation) unique"
      - name: security_type
        type: enum
        source: input
        description: "Security pledge class of the issue."
        constraints: "one of GENERAL_OBLIGATION | REVENUE | SPECIAL_ASSESSMENT"
      - name: dated_date
        type: string
        source: input
        description: "Dated date of the issue."
        constraints: "ISO 8601 calendar date (YYYY-MM-DD)"
      - name: final_maturity_date
        type: string
        source: input
        description: "Final stated maturity; drives the MATURED sweep transition."
        constraints: "ISO 8601 calendar date; must be strictly after dated_date"
      - name: original_par_amount_cents
        type: integer
        source: input
        description: "Original par amount in cents."
        constraints: ">= 1"
      - name: outstanding_par_amount_cents
        type: integer
        source: system
        description: >-
          Currently outstanding par in cents. Initialized to
          original_par_amount_cents; set to 0 when the issue reaches DEFEASED or
          MATURED.
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the issue."
        default: OUTSTANDING
        constraints: "one of OUTSTANDING | DEFEASED | MATURED"
      - name: current_rating
        type: string
        source: system
        description: "Most recently recorded rating symbol; null until a rating action is recorded."
        default: null
      - name: current_rating_agency
        type: enum
        source: system
        description: "Agency of current_rating; null until a rating action is recorded."
        default: null
        constraints: "one of MOODYS | SP | FITCH | KBRA, or null"
      - name: defeasance_type
        type: enum
        source: system
        description: "Set by the defease action; null while OUTSTANDING."
        default: null
        constraints: "one of LEGAL | ECONOMIC, or null"
      - name: escrow_deposit_cents
        type: integer
        source: system
        description: "Escrow amount recorded by the defease action."
        default: 0
      - name: defeased_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the issue reached DEFEASED."
        default: null
      - name: open_material_event_count
        type: integer
        source: computed
        description: >-
          COUNT(MaterialEventNotice WHERE issue_id == this.id AND status IN
          {DETERMINATION_PENDING, MATERIAL, FILING_IN_PROGRESS}). Recomputed on every
          MaterialEventNotice status change.
        default: 0

  - name: Undertaking
    parent: null
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: >-
          FK -> BondIssue.id; at most one Undertaking per BondIssue, enforced by
          ERR_UNDERTAKING_ALREADY_EXISTS.
      - name: fiscal_year_end_month_day
        type: string
        source: input
        description: "Fiscal year end as MM-DD, e.g. '06-30'."
        constraints: "matches ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: filing_window_days
        type: integer
        source: input
        description: "Calendar days after a reporting period end by which the annual report is due."
        default: 210
        constraints: "1..365"
      - name: timeliness_basis
        type: enum
        source: input
        description: >-
          Selects which variant of calculations.cycle_timeliness_assessment applies to
          every AnnualReportCycle of this Undertaking.
        default: SUBMISSION_BASIS
        constraints: "one of SUBMISSION_BASIS | CONFIRMATION_BASIS"
      - name: status
        type: enum
        source: system
        description: "State dimension 1 (engagement lifecycle of the undertaking itself)."
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | TERMINATED"
      - name: suspended_reason
        type: string
        source: input
        description: "Reason captured by the suspend action; cleared to null on reinstate."
        default: null
      - name: termination_cause
        type: enum
        source: system
        description: "Why the undertaking terminated; null while not TERMINATED."
        default: null
        constraints: "one of DEFEASANCE | MATURITY, or null"
      - name: compliance_posture
        type: enum
        source: computed
        description: >-
          State dimension 2, derived by calculations.undertaking_disclosure_risk_score
          step 6. Advances independently of `status`.
        default: COMPLIANT
        constraints: "one of COMPLIANT | WATCH | IMPAIRED | DELINQUENT"
      - name: disclosure_risk_score
        type: number
        source: computed
        description: "Output of calculations.undertaking_disclosure_risk_score step 3; 2 decimals."
        default: 0.00
      - name: remediation_tier
        type: enum
        source: computed
        description: >-
          Output of calculations.undertaking_disclosure_risk_score step 4. The PERSISTED
          value is the multiplier input to the NEXT recomputation (pinned evaluation order).
        default: TIER_0
        constraints: "one of TIER_0 | TIER_1 | TIER_2 | TIER_3"
      - name: late_filing_count
        type: integer
        source: computed
        description: >-
          COUNT(FailureToFileEvent WHERE undertaking_id == this.id AND kind IN
          {ANNUAL_REPORT_LATE, ANNUAL_REPORT_MISSED}), all statuses included. See
          calculations.undertaking_delinquency_counters.
        default: 0
      - name: missed_event_count
        type: integer
        source: computed
        description: >-
          COUNT(FailureToFileEvent WHERE undertaking_id == this.id AND kind ==
          MATERIAL_EVENT_MISSED), all statuses included.
        default: 0
      - name: delinquent_cycle_count
        type: integer
        source: computed
        description: >-
          COUNT(AnnualReportCycle WHERE undertaking_id == this.id AND status == DELINQUENT).
        default: 0
      - name: open_obligation_count
        type: integer
        source: computed
        description: >-
          Conserved quantity of calculations.undertaking_open_obligation_count. Recomputed
          on every AnnualReportCycle and MaterialEventNotice status change.
        default: 0
      - name: content_weight_bp_total
        type: integer
        source: computed
        description: >-
          SUM(ContentRequirement.weight_bp WHERE undertaking_id == this.id). Must equal
          10000 at AnnualReportCycle creation.
        default: 0

  - name: ContentRequirement
    parent: null
    common_fields: false
    # Immutable configuration row: no update endpoint, no version field. A cycle snapshots
    # weight_bp at creation time so later requirement additions never retro-reweight an
    # open cycle.
    fields:
      - name: undertaking_id
        type: string
        source: input
        description: "FK -> Undertaking.id; the undertaking whose annual filing content this row specifies."
      - name: kind
        type: enum
        source: input
        description: "Category of required annual filing content."
        constraints: >-
          one of AUDITED_FINANCIALS | OPERATING_DATA_TABLE | BUDGET_SUMMARY |
          DEBT_SERVICE_SCHEDULE | ENTERPRISE_STATISTICS
      - name: label
        type: string
        source: input
        description: "Human label used in the annual report table of contents."
        constraints: "1..120 chars"
      - name: weight_bp
        type: integer
        source: input
        description: "Share of the cycle completeness score, in basis points."
        constraints: "1..10000"
      - name: waivable
        type: boolean
        source: input
        description: "Whether a ComplianceReviewer may waive this item on a cycle."
        default: false
      - name: requires_audit_opinion
        type: boolean
        source: computed
        description: "true if and only if kind == AUDITED_FINANCIALS. Input value, if supplied, is ignored."

  - name: AnnualReportCycle
    parent: null
    common_fields: true
    fields:
      - name: undertaking_id
        type: string
        source: input
        description: "FK -> Undertaking.id; the undertaking this reporting cycle discharges."
      - name: fiscal_year_label
        type: string
        source: input
        description: "Label of the reporting period, e.g. 'FY2026'."
        constraints: "1..16 chars"
      - name: period_start_date
        type: string
        source: input
        description: "Inclusive start of the reporting period. Interval is half-open [start, end)."
        constraints: "ISO 8601 calendar date"
      - name: period_end_date
        type: string
        source: input
        description: >-
          Exclusive end of the reporting period AND the fiscal-year-end date used as the
          due-date base. Interval is half-open [start, end), so a cycle starting exactly on
          another cycle's period_end_date does NOT overlap it.
        constraints: "ISO 8601 calendar date; strictly after period_start_date"
      - name: due_date
        type: string
        source: computed
        description: "Output of calculations.annual_report_due_date."
      - name: status
        type: enum
        source: system
        description: "Reporting-cycle lifecycle."
        default: DRAFTING
        constraints: >-
          one of DRAFTING | READY_TO_FILE | FILING_IN_PROGRESS | FILED_TIMELY |
          FILED_LATE | DELINQUENT | WITHDRAWN | CLOSED_NOT_REQUIRED
      - name: completeness_score_pct
        type: number
        source: computed
        description: >-
          Output of calculations.content_preparation_completeness_score; recomputed on every
          CycleContentItem status or audit_opinion_type change.
        default: 0.00
      - name: assembled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DisclosureOfficer that assembled the cycle; null before assembly."
        default: null
      - name: assembled_at
        type: datetime
        source: system
        description: "Logical-clock instant of assembly."
        default: null
      - name: filed_filing_id
        type: string
        source: system
        description: >-
          FK -> Filing.id; the CONFIRMED filing that discharged this cycle. Repointed to the
          correcting filing when a superseding correction is confirmed.
        default: null
      - name: timeliness_basis_applied
        type: enum
        source: system
        description: >-
          Which variant of calculations.cycle_timeliness_assessment was applied when this
          cycle reached FILED_TIMELY or FILED_LATE.
        default: null
        constraints: "one of SUBMISSION_BASIS | CONFIRMATION_BASIS, or null"
      - name: filed_at
        type: datetime
        source: system
        description: "The basis instant that decided timeliness (submitted_at or repository_confirmed_at)."
        default: null
      - name: days_late
        type: integer
        source: computed
        description: >-
          max(0, calendar days from due_date to the date part of filed_at). 0 while unfiled
          and for FILED_TIMELY.
        default: 0
      - name: withdrawal_reason
        type: string
        source: input
        description: "Reason recorded by the withdraw action."
        default: null

  - name: CycleContentItem
    parent: null
    common_fields: true
    # Created only as a cascade side effect of AnnualReportCycle creation — never by a
    # direct POST. Discovered exclusively through the reverse-reachability GETs.
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AnnualReportCycle.id; the cycle this content item belongs to."
      - name: content_requirement_id
        type: string
        source: input
        description: "FK -> ContentRequirement.id; the requirement this item discharges."
      - name: status
        type: enum
        source: system
        description: "Preparation state of this piece of annual filing content."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED | DRAFT | READY | WAIVED | VOID"
      - name: weight_bp_snapshot
        type: integer
        source: system
        description: >-
          ContentRequirement.weight_bp copied at cycle-creation time. Later requirement rows
          never change an existing item's weight.
      - name: audit_opinion_type
        type: enum
        source: input
        description: "Opinion carried by the attached financial statements; null until supplied."
        default: null
        constraints: "one of UNMODIFIED | QUALIFIED | UNAUDITED_INTERIM, or null"
      - name: data_as_of_date
        type: string
        source: input
        description: "As-of date of the operating data or financial statements."
        default: null
        constraints: "ISO 8601 calendar date, or null"
      - name: source_document_ref
        type: string
        source: input
        description: "Opaque reference to the prepared document."
        default: null
      - name: attested_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the DisclosureOfficer that attested this item. Reset to null on
          reopen. Segregation of duties compares this against the assembling user.
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock instant of attestation."
        default: null
      - name: waiver_reason
        type: string
        source: input
        description: "Reason recorded by the waive action."
        default: null
      - name: readiness_factor
        type: number
        source: computed
        description: >-
          READY -> 1.0, WAIVED -> 1.0, DRAFT -> 0.5, NOT_STARTED -> 0.0, VOID -> excluded
          from the score input set entirely.
        default: 0.0

  - name: MaterialEventNotice
    parent: null
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> BondIssue.id; the issue the event concerns."
      - name: event_type
        type: enum
        source: input
        description: "Listed event category."
        constraints: >-
          one of PRINCIPAL_PAYMENT_DELINQUENCY | RATING_CHANGE | DEFEASANCE | BOND_CALL |
          UNSCHEDULED_DRAW_ON_RESERVE | TRUSTEE_SUBSTITUTION |
          FINANCIAL_OBLIGATION_INCURRENCE | MERGER_OR_SALE
      - name: per_se_material
        type: boolean
        source: computed
        description: >-
          true if and only if event_type is in
          calculations.material_event_filing_deadline constant PER_SE_MATERIAL_EVENT_TYPES.
          Per-se events still pass through DETERMINATION_PENDING, but they can only be
          determined MATERIAL: a NOT_MATERIAL determination on a per-se event is refused
          with ERR_PER_SE_EVENT_IS_MATERIAL.
      - name: occurrence_date
        type: string
        source: input
        description: "Date the event occurred; base date of the ten-business-day window."
        constraints: "ISO 8601 calendar date"
      - name: filing_deadline_date
        type: string
        source: computed
        description: "Output of calculations.material_event_filing_deadline."
      - name: status
        type: enum
        source: system
        description: "Determination-then-filing lifecycle."
        default: DETERMINATION_PENDING
        constraints: >-
          one of DETERMINATION_PENDING | MATERIAL | NOT_MATERIAL | FILING_IN_PROGRESS |
          FILED_TIMELY | FILED_LATE | MISSED | VOID
      - name: determination_note
        type: string
        source: input
        description: "Rationale recorded by the determine action."
        default: null
      - name: determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceReviewer that determined materiality."
        default: null
      - name: determined_at
        type: datetime
        source: system
        description: "Logical-clock instant of determination; auto-stamped for per-se events."
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that opened the notice."
      - name: rating_agency
        type: enum
        source: system
        description: "Set only by the rating-actions endpoint."
        default: null
        constraints: "one of MOODYS | SP | FITCH | KBRA, or null"
      - name: prior_rating
        type: string
        source: system
        description: "Rating symbol before the action; set only by the rating-actions endpoint."
        default: null
      - name: new_rating
        type: string
        source: system
        description: "Rating symbol after the action; set only by the rating-actions endpoint."
        default: null
      - name: financial_obligation_ref
        type: string
        source: input
        description: >-
          FK -> DirectPlacement.id; set when the notice discloses an incurred financial
          obligation. Null for all other event types.
        default: null
      - name: filed_filing_id
        type: string
        source: system
        description: "FK -> Filing.id; the CONFIRMED filing that discharged this notice."
        default: null
      - name: days_late
        type: integer
        source: computed
        description: >-
          max(0, calendar days from filing_deadline_date to the date part of
          Filing.submitted_at). 0 for FILED_TIMELY.
        default: 0

  - name: Filing
    parent: null
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> BondIssue.id; the issue whose disclosure this filing carries."
      - name: filing_type
        type: enum
        source: input
        description: "Which disclosure document this filing submits to the central repository."
        constraints: >-
          one of ANNUAL_REPORT | MATERIAL_EVENT_NOTICE | FAILURE_TO_FILE_NOTICE |
          VOLUNTARY_FINANCIAL_OBLIGATION
      - name: cycle_id
        type: string
        source: input
        description: >-
          FK -> AnnualReportCycle.id; required for filing_type ANNUAL_REPORT and
          FAILURE_TO_FILE_NOTICE, must be null otherwise.
        default: null
      - name: material_event_id
        type: string
        source: input
        description: >-
          FK -> MaterialEventNotice.id; required for filing_type MATERIAL_EVENT_NOTICE, must
          be null otherwise.
        default: null
      - name: direct_placement_id
        type: string
        source: input
        description: >-
          FK -> DirectPlacement.id; required for filing_type
          VOLUNTARY_FINANCIAL_OBLIGATION, must be null otherwise.
        default: null
      - name: supersedes_filing_id
        type: string
        source: input
        description: >-
          FK -> Filing.id; set on a correcting filing. Target must be CONFIRMED and carry the
          identical (filing_type, cycle_id, material_event_id, direct_placement_id) subject
          tuple.
        default: null
      - name: superseded_by_filing_id
        type: string
        source: system
        description: >-
          FK -> Filing.id; back-pointer stamped on the superseded filing when its correction
          is confirmed.
        default: null
      - name: correction_reason
        type: string
        source: input
        description: >-
          Required when supersedes_filing_id is present, and required again on every
          resubmit after a repository rejection.
        default: null
      - name: status
        type: enum
        source: system
        description: "Repository submission lifecycle."
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | CONFIRMED | REJECTED | SUPERSEDED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit or resubmit."
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID (a DisseminationEngagement id) of the submitting agent."
        default: null
      - name: submitting_engagement_id
        type: string
        source: system
        description: >-
          FK -> DisseminationEngagement.id; the engagement through which the submission was
          made, resolved from X-User-ID at submit time.
        default: null
      - name: repository_receipt_id
        type: string
        source: input
        description: "Central-repository confirmation receipt id recorded by the confirm action."
        default: null
      - name: repository_confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the repository confirmation was recorded."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded by the reject action; cleared to null on resubmit."
        default: null
      - name: submission_attempt_count
        type: integer
        source: computed
        description: >-
          Incremented by 1 on every submit and resubmit. Submission is refused once it would
          exceed MAX_SUBMISSION_ATTEMPTS = 3.
        default: 0

  - name: FailureToFileEvent
    parent: null
    common_fields: true
    # Created only as a cascade side effect (late confirmation, delinquency sweep, missed
    # event sweep) — never by a direct POST.
    fields:
      - name: undertaking_id
        type: string
        source: input
        description: "FK -> Undertaking.id; the undertaking whose obligation was missed or late."
      - name: cycle_id
        type: string
        source: input
        description: >-
          FK -> AnnualReportCycle.id; set for kinds ANNUAL_REPORT_LATE and
          ANNUAL_REPORT_MISSED, null for MATERIAL_EVENT_MISSED.
        default: null
      - name: material_event_id
        type: string
        source: input
        description: >-
          FK -> MaterialEventNotice.id; set for kind MATERIAL_EVENT_MISSED, null otherwise.
        default: null
      - name: kind
        type: enum
        source: system
        description: "Which continuing-disclosure obligation failed."
        constraints: "one of ANNUAL_REPORT_LATE | ANNUAL_REPORT_MISSED | MATERIAL_EVENT_MISSED"
      - name: occurred_at
        type: string
        source: system
        description: >-
          The missed deadline date itself (AnnualReportCycle.due_date, or
          MaterialEventNotice.filing_deadline_date). This is the date the official-statement
          five-year lookback window measures against.
      - name: days_late
        type: integer
        source: computed
        description: >-
          For ANNUAL_REPORT_LATE, the discharging cycle's days_late. For the MISSED kinds,
          calendar days from occurred_at to the sweep's clock date at creation time.
        default: 0
      - name: severity
        type: enum
        source: computed
        description: >-
          MAJOR when kind IN {ANNUAL_REPORT_MISSED, MATERIAL_EVENT_MISSED} OR days_late >= 30;
          MINOR otherwise. Recomputed whenever days_late changes.
        default: MINOR
        constraints: "one of MINOR | MAJOR"
      - name: status
        type: enum
        source: system
        description: "Remediation lifecycle."
        default: OPEN
        constraints: "one of OPEN | REMEDIATION_PENDING | REMEDIATED"
      - name: remediation_filing_id
        type: string
        source: input
        description: >-
          FK -> Filing.id; the CONFIRMED filing offered as remediation. Must reference the
          same subject (cycle_id or material_event_id) as this event.
        default: null
      - name: remediation_note
        type: string
        source: input
        description: "Note recorded by the remediate action."
        default: null
      - name: remediated_at
        type: datetime
        source: system
        description: >-
          Logical-clock instant of remediation. The REMEDIATED_EXCLUDED lookback variant
          compares the date part of this field against OfficialStatement.dated_date.
        default: null
      - name: disclosed_in_official_statement_ids
        type: array
        source: system
        description: >-
          Ids of every OfficialStatement that has been POSTED while listing this event in its
          disclosed_event_ids. Appended in OfficialStatement created_at ASC order.
        default: []

  - name: DirectPlacement
    parent: null
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: >-
          FK -> BondIssue.id; the outstanding issue against whose par the placement's
          materiality ratio is measured, and whose review-window capacity it occupies.
      - name: lender_name
        type: string
        source: input
        description: "Bank or direct purchaser name."
        constraints: "1..120 chars"
      - name: principal_amount_cents
        type: integer
        source: input
        description: "Committed principal of the bank loan or direct placement, in cents."
        constraints: ">= 1"
      - name: execution_date
        type: string
        source: input
        description: "Date the loan or placement was executed."
        constraints: "ISO 8601 calendar date"
      - name: review_window_start_date
        type: string
        source: input
        description: >-
          Inclusive start of the finance office's disclosure-review occupancy on the issue.
          The window is a CLOSED interval [start, end] — two windows that merely touch on a
          single day do overlap.
        constraints: "ISO 8601 calendar date"
      - name: review_window_end_date
        type: string
        source: input
        description: "Inclusive end of the review occupancy."
        constraints: "ISO 8601 calendar date; >= review_window_start_date"
      - name: disclosure_practice
        type: enum
        source: input
        description: "The office's declared disclosure practice for this obligation."
        constraints: "one of MANDATORY_MATERIAL_EVENT | VOLUNTARY | NOT_DISCLOSED"
      - name: materiality_ratio_bp
        type: integer
        source: computed
        description: >-
          round_half_up(principal_amount_cents * 10000 / issue.outstanding_par_amount_cents)
          evaluated at creation time against the issue's then-current outstanding par.
      - name: status
        type: enum
        source: system
        description: "Disclosure-practice lifecycle."
        default: RECEIVED
        constraints: "one of RECEIVED | DISCLOSURE_REQUIRED | DISCLOSED | DISCLOSURE_WAIVED"
      - name: linked_notice_id
        type: string
        source: system
        description: >-
          FK -> MaterialEventNotice.id; the FINANCIAL_OBLIGATION_INCURRENCE notice cascaded
          when the placement was classified DISCLOSURE_REQUIRED.
        default: null
      - name: waiver_reason
        type: string
        source: input
        description: "Reason recorded when classification results in DISCLOSURE_WAIVED."
        default: null

  - name: OfficialStatement
    parent: null
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: >-
          FK -> BondIssue.id; the NEW issue being offered. The lookback scope is every
          BondIssue sharing this issue's issuer_program_code.
      - name: dated_date
        type: string
        source: input
        description: >-
          Dated date of the official statement; the right edge of the five-year
          failure-to-file lookback window.
        constraints: "ISO 8601 calendar date"
      - name: lookback_policy
        type: enum
        source: input
        description: >-
          Selects which variant of calculations.official_statement_disclosure_lookback
          applies to this official statement.
        default: STRICT_FIVE_YEAR
        constraints: "one of STRICT_FIVE_YEAR | REMEDIATED_EXCLUDED"
      - name: status
        type: enum
        source: system
        description: "Drafting and compliance-clearance lifecycle."
        default: DRAFT
        constraints: "one of DRAFT | COMPLIANCE_REVIEW | POSTED"
      - name: disclosed_event_ids
        type: array
        source: input
        description: >-
          FailureToFileEvent ids the drafter claims are disclosed in the document. Replaced
          wholesale on every compliance-review call.
        default: []
      - name: required_disclosure_event_ids
        type: array
        source: computed
        description: >-
          Output of calculations.official_statement_disclosure_lookback, sorted by
          FailureToFileEvent.occurred_at ASC then created_at ASC.
        default: []
      - name: required_disclosure_event_count
        type: integer
        source: computed
        description: "Length of required_disclosure_event_ids."
        default: 0
      - name: disclosure_adequacy
        type: enum
        source: computed
        description: >-
          UNKNOWN before any compliance review; ADEQUATE when every id in
          required_disclosure_event_ids appears in disclosed_event_ids; INCOMPLETE otherwise.
        default: UNKNOWN
        constraints: "one of UNKNOWN | ADEQUATE | INCOMPLETE"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the ComplianceReviewer of the most recent compliance-review call.
          Segregation of duties forbids this same user from posting.
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent compliance review."
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceReviewer that posted the official statement."
        default: null
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant of posting."
        default: null

  - name: DisseminationEngagement
    parent: null
    common_fields: true
    fields:
      - name: undertaking_id
        type: string
        source: input
        description: >-
          FK -> Undertaking.id; the undertaking whose filing calendar this agent monitors.
      - name: agent_name
        type: string
        source: input
        description: "Dissemination agent firm name."
        constraints: "1..120 chars"
      - name: effective_date
        type: string
        source: input
        description: >-
          First date of the engagement term. Also the baseline for calendar-monitoring
          acknowledgement when last_calendar_ack_date is null.
        constraints: "ISO 8601 calendar date"
      - name: expiration_date
        type: string
        source: input
        description: "Last date of the engagement term."
        constraints: "ISO 8601 calendar date; >= effective_date"
      - name: retainer_cents
        type: integer
        source: input
        description: "Annual retainer in cents; first input of calculations.dissemination_agent_invoice."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle; only an ACTIVE engagement may submit to the repository."
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | TERMINATED"
      - name: last_calendar_ack_date
        type: string
        source: input
        description: "Date through which the agent has acknowledged monitoring the filing calendar."
        default: null
      - name: monitoring_lapse_days
        type: integer
        source: computed
        description: >-
          calendar days from COALESCE(last_calendar_ack_date, effective_date) to the logical
          clock date, floored at 0. Recomputed on every calendar sweep and acknowledgement.
        default: 0
      - name: billable_filing_count
        type: integer
        source: computed
        description: >-
          Conserved quantity of calculations.dissemination_agent_invoice:
          COUNT(Filing WHERE submitting_engagement_id == this.id AND status == CONFIRMED).
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "Output of calculations.dissemination_agent_invoice."
        default: 0
      - name: superseded_by_engagement_id
        type: string
        source: system
        description: >-
          FK -> DisseminationEngagement.id; stamped on the prior engagement when a newer
          engagement for the same undertaking supersedes it.
        default: null
      - name: termination_reason
        type: enum
        source: system
        description: "Why the engagement terminated."
        default: null
        constraints: >-
          one of SUPERSEDED | UNDERTAKING_TERMINATED | ISSUER_TERMINATED, or null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# Two entries carry an extra `state_field:` key because Undertaking has TWO
# independent state dimensions on the same row. Grounds references for those two
# machines take the form state_machines.Undertaking.<state_field>.<FROM>_to_<TO>.
# All other machines use state_machines.<Entity>.<FROM>_to_<TO>.

state_machines:

  - entity: BondIssue
    state_field: status
    initial_state: OUTSTANDING
    terminal_states: [DEFEASED, MATURED]
    transitions:
      - from: OUTSTANDING
        to: DEFEASED
        trigger: "POST /disclosure/bond-issues/{id}/defease"
        actor: FinanceDirector
        preconditions:
          - "issue.status == OUTSTANDING"
          - "escrow_deposit_cents >= outstanding_par_amount_cents when defeasance_type == LEGAL (ERR_ESCROW_INSUFFICIENT)"
          - "escrow_deposit_cents >= 1 when defeasance_type == ECONOMIC (ERR_ESCROW_INSUFFICIENT)"
        side_effects:
          - "sets defeasance_type, escrow_deposit_cents, defeased_at = logical clock now"
          - "sets outstanding_par_amount_cents = 0"
          - "CASCADE HOP 1 (caused by this issue reaching DEFEASED): the Undertaking whose issue_id == this.id, if status IN {ACTIVE, SUSPENDED}, transitions to TERMINATED with termination_cause = DEFEASANCE"
          - "voids every MaterialEventNotice of this issue whose status IN {DETERMINATION_PENDING, MATERIAL} -> VOID, in created_at ASC order"
          - "AFTER the void pass, creates one MaterialEventNotice { event_type: DEFEASANCE, occurrence_date: the request's occurrence_date, status: DETERMINATION_PENDING, per_se_material: true, filing_deadline_date from calculations.material_event_filing_deadline, created_by_user_id: X-User-ID }"
          - "recomputes BondIssue.open_material_event_count"
          - "increments BondIssue.version by 1"
        note: >-
          The newly minted DEFEASANCE notice is created after the void pass so it is never
          voided by its own trigger.
      - from: OUTSTANDING
        to: MATURED
        trigger: "POST /disclosure/calendar-sweeps step 1 (system)"
        actor: system
        preconditions:
          - "issue.status == OUTSTANDING"
          - "issue.final_maturity_date < date part of logical clock now"
        side_effects:
          - "sets outstanding_par_amount_cents = 0"
          - "CASCADE HOP 1: the Undertaking whose issue_id == this.id, if status IN {ACTIVE, SUSPENDED}, transitions to TERMINATED with termination_cause = MATURITY"
          - "voids every MaterialEventNotice of this issue whose status IN {DETERMINATION_PENDING, MATERIAL} -> VOID, in created_at ASC order; unlike defeasance, maturity mints NO new notice"
          - "recomputes BondIssue.open_material_event_count"
          - "increments BondIssue.version by 1"

  - entity: Undertaking
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /disclosure/undertakings/{id}/suspend"
        actor: FinanceDirector
        preconditions:
          - "undertaking.status == ACTIVE"
        side_effects:
          - "sets suspended_reason from the request body"
          - "leaves compliance_posture, disclosure_risk_score and remediation_tier untouched (independent dimension)"
          - "increments Undertaking.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /disclosure/undertakings/{id}/reinstate"
        actor: FinanceDirector
        preconditions:
          - "undertaking.status == SUSPENDED"
        side_effects:
          - "sets suspended_reason = null"
          - "leaves compliance_posture untouched"
          - "increments Undertaking.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade hop 1 of BondIssue OUTSTANDING->DEFEASED or OUTSTANDING->MATURED (system)"
        actor: system
        preconditions:
          - "the undertaking's BondIssue reached DEFEASED or MATURED in this same request"
        side_effects:
          - "sets termination_cause = DEFEASANCE or MATURITY"
          - "CASCADE HOP 2 (caused by this undertaking reaching TERMINATED): every AnnualReportCycle with undertaking_id == this.id and status IN {DRAFTING, READY_TO_FILE, DELINQUENT} transitions to CLOSED_NOT_REQUIRED, processed in AnnualReportCycle.created_at ASC order"
          - "CASCADE HOP 2b (caused by this undertaking reaching TERMINATED): every DisseminationEngagement with undertaking_id == this.id and status IN {ACTIVE, SUSPENDED} transitions to TERMINATED with termination_reason = UNDERTAKING_TERMINATED"
          - "recomputes open_obligation_count and delinquent_cycle_count"
          - "increments Undertaking.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "cascade hop 1 of BondIssue OUTSTANDING->DEFEASED or OUTSTANDING->MATURED (system)"
        actor: system
        preconditions:
          - "the undertaking's BondIssue reached DEFEASED or MATURED in this same request"
        side_effects:
          - "identical to the ACTIVE->TERMINATED side-effect set, including cascade hops 2 and 2b"
          - "increments Undertaking.version by 1"

  - entity: Undertaking
    state_field: compliance_posture
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system, on any recompute trigger)"
        actor: system
        preconditions:
          - "delinquent_cycle_count == 0"
          - "25.00 <= disclosure_risk_score < 50.00"
        side_effects:
          - "persists disclosure_risk_score and remediation_tier from the same recompute pass"
          - "recomputes calculations.dissemination_agent_invoice for the undertaking's ACTIVE DisseminationEngagement (posture is an input)"
          - "increments Undertaking.version by 1"
      - from: WATCH
        to: IMPAIRED
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count == 0"
          - "disclosure_risk_score >= 50.00"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice — the IMPAIRED surcharge branch now applies"
          - "recomputes disclosure_adequacy on every OfficialStatement in status COMPLIANCE_REVIEW whose issue shares the issuer_program_code of this undertaking's issue"
          - "increments Undertaking.version by 1"
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count >= 1"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice — the DELINQUENT surcharge branch applies"
          - "increments Undertaking.version by 1"
        note: >-
          DELINQUENT dominates the score bands: any delinquent cycle forces DELINQUENT
          regardless of disclosure_risk_score.
      - from: WATCH
        to: DELINQUENT
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count >= 1"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice"
          - "increments Undertaking.version by 1"
      - from: IMPAIRED
        to: DELINQUENT
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count >= 1"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice"
          - "increments Undertaking.version by 1"
      - from: DELINQUENT
        to: IMPAIRED
        trigger: >-
          calculations.undertaking_disclosure_risk_score step 6 (system), after
          delinquent_cycle_count falls to 0 — e.g. the delinquent cycle is assembled
          (DELINQUENT->READY_TO_FILE) or closed by a defeasance cascade
        actor: system
        preconditions:
          - "delinquent_cycle_count == 0"
          - "disclosure_risk_score >= 50.00"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice"
          - "increments Undertaking.version by 1"
        note: >-
          Recovery is possible on the posture dimension because delinquent_cycle_count is a
          live COUNT, while late_filing_count and missed_event_count are monotonic.
      - from: DELINQUENT
        to: WATCH
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count == 0"
          - "25.00 <= disclosure_risk_score < 50.00"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice"
          - "increments Undertaking.version by 1"
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "calculations.undertaking_disclosure_risk_score step 6 (system)"
        actor: system
        preconditions:
          - "delinquent_cycle_count == 0"
          - "disclosure_risk_score < 25.00"
        side_effects:
          - "recomputes calculations.dissemination_agent_invoice"
          - "increments Undertaking.version by 1"

  - entity: AnnualReportCycle
    state_field: status
    initial_state: DRAFTING
    terminal_states: [FILED_TIMELY, FILED_LATE, WITHDRAWN, CLOSED_NOT_REQUIRED]
    transitions:
      - from: DRAFTING
        to: READY_TO_FILE
        trigger: "POST /disclosure/annual-report-cycles/{id}/assemble"
        actor: DisclosureOfficer
        preconditions:
          - "cycle.status IN {DRAFTING, DELINQUENT}"
          - "undertaking.status == ACTIVE (ERR_UNDERTAKING_NOT_ACTIVE)"
          - "COUNT(CycleContentItem WHERE cycle_id == cycle.id AND status IN {NOT_STARTED, DRAFT}) == 0 (ERR_CONTENT_NOT_READY)"
          - "COUNT(CycleContentItem WHERE cycle_id == cycle.id AND status == READY) >= 1 (ERR_NO_FILEABLE_CONTENT)"
          - "X-User-ID != every CycleContentItem.attested_by_user_id of this cycle (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets assembled_by_user_id = X-User-ID and assembled_at = logical clock now"
          - "recomputes completeness_score_pct via calculations.content_preparation_completeness_score"
          - "increments AnnualReportCycle.version by 1"
      - from: DELINQUENT
        to: READY_TO_FILE
        trigger: "POST /disclosure/annual-report-cycles/{id}/assemble"
        actor: DisclosureOfficer
        preconditions:
          - "identical to the DRAFTING->READY_TO_FILE precondition set"
        side_effects:
          - "sets assembled_by_user_id and assembled_at; recomputes completeness_score_pct"
          - "CASCADE (caused by leaving DELINQUENT): undertaking.delinquent_cycle_count recomputed, then calculations.undertaking_disclosure_risk_score reruns, which may move compliance_posture off DELINQUENT"
          - "increments AnnualReportCycle.version by 1"
        note: >-
          The FailureToFileEvent already minted by the delinquency sweep is NOT withdrawn —
          leaving DELINQUENT clears the live count, not the recorded failure.
      - from: READY_TO_FILE
        to: DRAFTING
        trigger: "cascade of POST /disclosure/cycle-content-items/{id}/reopen (system)"
        actor: system
        preconditions:
          - "the reopened item's cycle_id == this cycle and cycle.status == READY_TO_FILE"
        side_effects:
          - "sets assembled_by_user_id = null and assembled_at = null"
          - "recomputes completeness_score_pct"
          - "increments AnnualReportCycle.version by 1"
      - from: READY_TO_FILE
        to: FILING_IN_PROGRESS
        trigger: "cascade of POST /disclosure/filings/{id}/submit where filing.cycle_id == this cycle and filing.filing_type == ANNUAL_REPORT (system)"
        actor: system
        preconditions:
          - "cycle.status == READY_TO_FILE"
        side_effects:
          - "recomputes undertaking.open_obligation_count (FILING_IN_PROGRESS remains an open obligation)"
          - "increments AnnualReportCycle.version by 1"
      - from: FILING_IN_PROGRESS
        to: READY_TO_FILE
        trigger: "cascade of POST /disclosure/filings/{id}/reject (system)"
        actor: system
        preconditions:
          - "the rejected filing's cycle_id == this cycle"
        side_effects:
          - "increments AnnualReportCycle.version by 1"
        note: "Compensating transition: a repository rejection returns the cycle to the fileable state without minting a failure."
      - from: FILING_IN_PROGRESS
        to: FILED_TIMELY
        trigger: "cascade of POST /disclosure/filings/{id}/confirm (system)"
        actor: system
        preconditions:
          - "calculations.cycle_timeliness_assessment, under the variant selected by undertaking.timeliness_basis, evaluates basis_date <= cycle.due_date"
        side_effects:
          - "sets filed_filing_id = the confirmed filing id, timeliness_basis_applied = undertaking.timeliness_basis, filed_at = the basis instant, days_late = 0"
          - "recomputes undertaking.open_obligation_count"
          - "CASCADE (caused by this cycle reaching a FILED_* state): every FailureToFileEvent with cycle_id == this cycle and status == OPEN transitions to REMEDIATION_PENDING"
          - "increments AnnualReportCycle.version by 1"
      - from: FILING_IN_PROGRESS
        to: FILED_LATE
        trigger: "cascade of POST /disclosure/filings/{id}/confirm (system)"
        actor: system
        preconditions:
          - "calculations.cycle_timeliness_assessment, under the variant selected by undertaking.timeliness_basis, evaluates basis_date > cycle.due_date"
        side_effects:
          - "sets filed_filing_id, timeliness_basis_applied, filed_at = the basis instant, days_late = calendar days from due_date to date part of filed_at"
          - "CASCADE HOP 2 (caused by this cycle reaching FILED_LATE): if no FailureToFileEvent exists with cycle_id == this cycle, one is created { kind: ANNUAL_REPORT_LATE, occurred_at: cycle.due_date, days_late: cycle.days_late, status: OPEN }; if one already exists (minted earlier by the delinquency sweep) its kind is left unchanged, its days_late is refreshed and its status moves OPEN -> REMEDIATION_PENDING"
          - "CASCADE HOP 3 (caused by the FailureToFileEvent write): undertaking.late_filing_count recomputed, then calculations.undertaking_disclosure_risk_score reruns, writing disclosure_risk_score, remediation_tier and compliance_posture"
          - "CASCADE HOP 4 (caused by the posture/count write): calculations.dissemination_agent_invoice reruns for the undertaking's ACTIVE DisseminationEngagement"
          - "CASCADE HOP 3b (caused by the new FailureToFileEvent): every OfficialStatement in status COMPLIANCE_REVIEW whose issue shares the issuer_program_code recomputes required_disclosure_event_ids and disclosure_adequacy"
          - "recomputes undertaking.open_obligation_count"
          - "increments AnnualReportCycle.version by 1"
      - from: DRAFTING
        to: DELINQUENT
        trigger: "POST /disclosure/calendar-sweeps step 2 (system)"
        actor: system
        preconditions:
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} (ERR_CYCLE_NOT_EDITABLE)"
          - "cycle.due_date < date part of logical clock now"
        side_effects:
          - "creates FailureToFileEvent { kind: ANNUAL_REPORT_MISSED, occurred_at: cycle.due_date, days_late: calendar days from due_date to clock date, status: OPEN, severity: MAJOR }"
          - "CASCADE (caused by the DELINQUENT write): undertaking.delinquent_cycle_count recomputed, then calculations.undertaking_disclosure_risk_score reruns -> compliance_posture becomes DELINQUENT"
          - "recomputes undertaking.open_obligation_count"
          - "increments AnnualReportCycle.version by 1"
      - from: READY_TO_FILE
        to: DELINQUENT
        trigger: "POST /disclosure/calendar-sweeps step 2 (system)"
        actor: system
        preconditions:
          - "identical to the DRAFTING->DELINQUENT precondition set"
        side_effects:
          - "identical to the DRAFTING->DELINQUENT side-effect set"
          - "increments AnnualReportCycle.version by 1"
      - from: DRAFTING
        to: WITHDRAWN
        trigger: "POST /disclosure/annual-report-cycles/{id}/withdraw"
        actor: DisclosureOfficer
        preconditions:
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} (ERR_CYCLE_NOT_EDITABLE)"
          - "no Filing exists with cycle_id == this cycle and status IN {SUBMITTED, CONFIRMED} (ERR_CYCLE_HAS_LIVE_FILING)"
        side_effects:
          - "sets withdrawal_reason"
          - "CASCADE: every CycleContentItem of this cycle with status IN {NOT_STARTED, DRAFT, READY, WAIVED} -> VOID, in created_at ASC order"
          - "recomputes completeness_score_pct (empty input set -> 0.00)"
          - "recomputes undertaking.open_obligation_count — this is the compensating half of calculations.undertaking_open_obligation_count"
          - "increments AnnualReportCycle.version by 1"
      - from: READY_TO_FILE
        to: WITHDRAWN
        trigger: "POST /disclosure/annual-report-cycles/{id}/withdraw"
        actor: DisclosureOfficer
        preconditions:
          - "identical to the DRAFTING->WITHDRAWN precondition set"
        side_effects:
          - "identical to the DRAFTING->WITHDRAWN side-effect set"
          - "increments AnnualReportCycle.version by 1"
      - from: DRAFTING
        to: CLOSED_NOT_REQUIRED
        trigger: "cascade hop 2 of Undertaking ACTIVE|SUSPENDED -> TERMINATED (system)"
        actor: system
        preconditions:
          - "the owning undertaking reached TERMINATED in this same request"
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT}"
        side_effects:
          - "CASCADE HOP 3 (caused by this cycle reaching CLOSED_NOT_REQUIRED): every CycleContentItem of this cycle with status IN {NOT_STARTED, DRAFT, READY, WAIVED} -> VOID, in created_at ASC order"
          - "recomputes completeness_score_pct (empty input set -> 0.00)"
          - "increments AnnualReportCycle.version by 1"
      - from: READY_TO_FILE
        to: CLOSED_NOT_REQUIRED
        trigger: "cascade hop 2 of Undertaking ACTIVE|SUSPENDED -> TERMINATED (system)"
        actor: system
        preconditions:
          - "identical to the DRAFTING->CLOSED_NOT_REQUIRED precondition set"
        side_effects:
          - "identical to the DRAFTING->CLOSED_NOT_REQUIRED side-effect set, including cascade hop 3"
          - "increments AnnualReportCycle.version by 1"
      - from: DELINQUENT
        to: CLOSED_NOT_REQUIRED
        trigger: "cascade hop 2 of Undertaking ACTIVE|SUSPENDED -> TERMINATED (system)"
        actor: system
        preconditions:
          - "identical to the DRAFTING->CLOSED_NOT_REQUIRED precondition set"
        side_effects:
          - "identical to the DRAFTING->CLOSED_NOT_REQUIRED side-effect set, including cascade hop 3"
          - "recomputes undertaking.delinquent_cycle_count and reruns calculations.undertaking_disclosure_risk_score"
          - "increments AnnualReportCycle.version by 1"

  - entity: CycleContentItem
    state_field: status
    initial_state: NOT_STARTED
    terminal_states: [VOID]
    transitions:
      - from: NOT_STARTED
        to: DRAFT
        trigger: "PATCH /disclosure/cycle-content-items/{id}"
        actor: DisclosureOfficer
        preconditions:
          - "item.status IN {NOT_STARTED, DRAFT}"
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} (ERR_CYCLE_NOT_EDITABLE)"
          - "at least one of audit_opinion_type, data_as_of_date, source_document_ref is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "writes the supplied fields; sets readiness_factor = 0.5"
          - "recomputes cycle.completeness_score_pct"
          - "increments CycleContentItem.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /disclosure/cycle-content-items/{id}"
        actor: DisclosureOfficer
        preconditions:
          - "identical to the NOT_STARTED->DRAFT precondition set"
        side_effects:
          - "overwrites only the supplied fields; readiness_factor stays 0.5"
          - "recomputes cycle.completeness_score_pct (the audit-opinion multiplier may change)"
          - "increments CycleContentItem.version by 1"
      - from: DRAFT
        to: READY
        trigger: "POST /disclosure/cycle-content-items/{id}/attest"
        actor: DisclosureOfficer
        preconditions:
          - "item.status == DRAFT"
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} (ERR_CYCLE_NOT_EDITABLE)"
          - "if requirement.requires_audit_opinion then item.audit_opinion_type IS NOT NULL (ERR_AUDIT_OPINION_REQUIRED)"
          - "item.data_as_of_date IS NOT NULL (ERR_CONTENT_DATA_AS_OF_REQUIRED)"
        side_effects:
          - "sets attested_by_user_id = X-User-ID, attested_at = logical clock now, readiness_factor = 1.0"
          - "recomputes cycle.completeness_score_pct"
          - "increments CycleContentItem.version by 1"
      - from: READY
        to: DRAFT
        trigger: "POST /disclosure/cycle-content-items/{id}/reopen"
        actor: DisclosureOfficer
        preconditions:
          - "item.status == READY"
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} — a cycle already FILING_IN_PROGRESS or terminal cannot be reopened (ERR_CYCLE_NOT_EDITABLE)"
        side_effects:
          - "sets attested_by_user_id = null, attested_at = null, readiness_factor = 0.5"
          - "CASCADE: if cycle.status == READY_TO_FILE it transitions back to DRAFTING (cyclic)"
          - "recomputes cycle.completeness_score_pct"
          - "increments CycleContentItem.version by 1"
      - from: NOT_STARTED
        to: WAIVED
        trigger: "POST /disclosure/cycle-content-items/{id}/waive"
        actor: ComplianceReviewer
        preconditions:
          - "item.status IN {NOT_STARTED, DRAFT}"
          - "cycle.status IN {DRAFTING, READY_TO_FILE, DELINQUENT} (ERR_CYCLE_NOT_EDITABLE)"
          - "requirement.waivable == true (ERR_REQUIREMENT_NOT_WAIVABLE)"
        side_effects:
          - "sets waiver_reason, readiness_factor = 1.0"
          - "recomputes cycle.completeness_score_pct — a WAIVED item still contributes its full weight"
          - "increments CycleContentItem.version by 1"
      - from: DRAFT
        to: WAIVED
        trigger: "POST /disclosure/cycle-content-items/{id}/waive"
        actor: ComplianceReviewer
        preconditions:
          - "identical to the NOT_STARTED->WAIVED precondition set"
        side_effects:
          - "identical to the NOT_STARTED->WAIVED side-effect set"
          - "increments CycleContentItem.version by 1"
      - from: NOT_STARTED
        to: VOID
        trigger: "cascade hop 3 of AnnualReportCycle -> WITHDRAWN or -> CLOSED_NOT_REQUIRED (system)"
        actor: system
        preconditions:
          - "the owning cycle reached WITHDRAWN or CLOSED_NOT_REQUIRED in this same request"
        side_effects:
          - "sets readiness_factor = 0.0; the item leaves the completeness score input set entirely"
          - "increments CycleContentItem.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "cascade hop 3 of AnnualReportCycle -> WITHDRAWN or -> CLOSED_NOT_REQUIRED (system)"
        actor: system
        preconditions:
          - "the owning cycle reached WITHDRAWN or CLOSED_NOT_REQUIRED in this same request"
        side_effects:
          - "sets readiness_factor = 0.0"
          - "increments CycleContentItem.version by 1"
      - from: READY
        to: VOID
        trigger: "cascade hop 3 of AnnualReportCycle -> WITHDRAWN or -> CLOSED_NOT_REQUIRED (system)"
        actor: system
        preconditions:
          - "the owning cycle reached WITHDRAWN or CLOSED_NOT_REQUIRED in this same request"
        side_effects:
          - "sets readiness_factor = 0.0; attested_by_user_id is preserved for audit"
          - "increments CycleContentItem.version by 1"
      - from: WAIVED
        to: VOID
        trigger: "cascade hop 3 of AnnualReportCycle -> WITHDRAWN or -> CLOSED_NOT_REQUIRED (system)"
        actor: system
        preconditions:
          - "the owning cycle reached WITHDRAWN or CLOSED_NOT_REQUIRED in this same request"
        side_effects:
          - "sets readiness_factor = 0.0"
          - "increments CycleContentItem.version by 1"

  - entity: MaterialEventNotice
    state_field: status
    initial_state: DETERMINATION_PENDING
    terminal_states: [NOT_MATERIAL, FILED_TIMELY, FILED_LATE, MISSED, VOID]
    transitions:
      - from: DETERMINATION_PENDING
        to: MATERIAL
        trigger: "POST /disclosure/material-event-notices/{id}/determine with determination = MATERIAL"
        actor: ComplianceReviewer
        preconditions:
          - "notice.status == DETERMINATION_PENDING"
        side_effects:
          - "sets determination_note, determined_by_user_id = X-User-ID, determined_at = logical clock now"
          - "recomputes issue.open_material_event_count (MATERIAL is still open)"
          - "recomputes undertaking.open_obligation_count"
          - "increments MaterialEventNotice.version by 1"
        note: "MATERIAL branch: the notice becomes fileable and keeps consuming an open obligation slot."
      - from: DETERMINATION_PENDING
        to: NOT_MATERIAL
        trigger: "POST /disclosure/material-event-notices/{id}/determine with determination = NOT_MATERIAL"
        actor: ComplianceReviewer
        preconditions:
          - "notice.status == DETERMINATION_PENDING"
          - "notice.per_se_material == false — a per-se listed event (PRINCIPAL_PAYMENT_DELINQUENCY, RATING_CHANGE, DEFEASANCE, BOND_CALL) can never be determined immaterial (ERR_PER_SE_EVENT_IS_MATERIAL)"
        side_effects:
          - "sets determination_note, determined_by_user_id, determined_at"
          - "recomputes issue.open_material_event_count — the notice leaves the open set"
          - "recomputes undertaking.open_obligation_count — the notice leaves the obligation set"
          - "the notice becomes unfileable: any later Filing referencing it is refused with ERR_FILING_SUBJECT_MISMATCH"
          - "no filing_deadline_date enforcement ever applies to it again; the calendar sweep skips it"
          - "increments MaterialEventNotice.version by 1"
        note: >-
          NOT_MATERIAL branch: disjoint side-effect set from the MATERIAL branch — it releases
          the obligation instead of arming the ten-business-day filing window.
      - from: MATERIAL
        to: FILING_IN_PROGRESS
        trigger: "cascade of POST /disclosure/filings/{id}/submit where filing.material_event_id == this notice (system)"
        actor: system
        preconditions:
          - "notice.status == MATERIAL"
        side_effects:
          - "increments MaterialEventNotice.version by 1"
      - from: FILING_IN_PROGRESS
        to: FILED_TIMELY
        trigger: "cascade of POST /disclosure/filings/{id}/confirm (system)"
        actor: system
        preconditions:
          - "date part of filing.submitted_at <= notice.filing_deadline_date — the material-event clock is ALWAYS submission-based, never confirmation-based"
        side_effects:
          - "sets filed_filing_id = the confirmed filing id, days_late = 0"
          - "recomputes issue.open_material_event_count and undertaking.open_obligation_count"
          - "if the notice's financial_obligation_ref is set, the referenced DirectPlacement transitions DISCLOSURE_REQUIRED -> DISCLOSED"
          - "increments MaterialEventNotice.version by 1"
      - from: FILING_IN_PROGRESS
        to: FILED_LATE
        trigger: "cascade of POST /disclosure/filings/{id}/confirm (system)"
        actor: system
        preconditions:
          - "date part of filing.submitted_at > notice.filing_deadline_date"
        side_effects:
          - "sets filed_filing_id, days_late = calendar days from filing_deadline_date to date part of filing.submitted_at"
          - "recomputes issue.open_material_event_count and undertaking.open_obligation_count"
          - "if financial_obligation_ref is set, the referenced DirectPlacement transitions DISCLOSURE_REQUIRED -> DISCLOSED"
          - "increments MaterialEventNotice.version by 1"
        note: >-
          A late material-event filing does NOT mint a FailureToFileEvent — only the sweep's
          MISSED transition does. This asymmetry with AnnualReportCycle is deliberate.
      - from: FILING_IN_PROGRESS
        to: MATERIAL
        trigger: "cascade of POST /disclosure/filings/{id}/reject (system)"
        actor: system
        preconditions:
          - "the rejected filing's material_event_id == this notice"
        side_effects:
          - "increments MaterialEventNotice.version by 1"
        note: "Compensating transition: rejection re-arms the notice for a corrected submission."
      - from: MATERIAL
        to: MISSED
        trigger: "POST /disclosure/calendar-sweeps step 3 (system)"
        actor: system
        preconditions:
          - "notice.status == MATERIAL"
          - "notice.filing_deadline_date < date part of logical clock now"
        side_effects:
          - "sets days_late = calendar days from filing_deadline_date to clock date"
          - "creates FailureToFileEvent { kind: MATERIAL_EVENT_MISSED, material_event_id: this notice, cycle_id: null, occurred_at: notice.filing_deadline_date, status: OPEN, severity: MAJOR }"
          - "CASCADE (caused by the FailureToFileEvent write): undertaking.missed_event_count recomputed, then calculations.undertaking_disclosure_risk_score reruns"
          - "recomputes issue.open_material_event_count and undertaking.open_obligation_count"
          - "increments MaterialEventNotice.version by 1"
      - from: DETERMINATION_PENDING
        to: VOID
        trigger: "cascade of BondIssue OUTSTANDING->DEFEASED / OUTSTANDING->MATURED (system)"
        actor: system
        preconditions:
          - "the notice's BondIssue reached DEFEASED or MATURED in this same request"
          - "the notice was not created by this same defeasance transition (the DEFEASANCE notice minted after the void pass is exempt)"
        side_effects:
          - "recomputes issue.open_material_event_count and undertaking.open_obligation_count"
          - "increments MaterialEventNotice.version by 1"
      - from: MATERIAL
        to: VOID
        trigger: "cascade of BondIssue OUTSTANDING->DEFEASED / OUTSTANDING->MATURED (system)"
        actor: system
        preconditions:
          - "the notice's BondIssue reached DEFEASED or MATURED in this same request"
        side_effects:
          - "recomputes issue.open_material_event_count and undertaking.open_obligation_count"
          - "increments MaterialEventNotice.version by 1"

  - entity: Filing
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /disclosure/filings/{id}/submit"
        actor: DisseminationAgent
        preconditions:
          - "filing.status == DRAFT"
          - "X-User-ID resolves to a DisseminationEngagement whose undertaking_id == the undertaking of filing.issue_id (ERR_AGENT_NOT_ENGAGED)"
          - "that engagement.status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "filing.submission_attempt_count + 1 <= MAX_SUBMISSION_ATTEMPTS = 3 (ERR_SUBMISSION_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "sets submitted_at = logical clock now, submitted_by_user_id = X-User-ID, submitting_engagement_id = the resolved engagement id, submission_attempt_count += 1"
          - "CASCADE: if filing_type == ANNUAL_REPORT the referenced cycle transitions READY_TO_FILE -> FILING_IN_PROGRESS"
          - "CASCADE: if filing_type == MATERIAL_EVENT_NOTICE the referenced notice transitions MATERIAL -> FILING_IN_PROGRESS"
          - "increments Filing.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /disclosure/filings/{id}/confirm"
        actor: DisseminationAgent
        preconditions:
          - "filing.status == SUBMITTED"
          - "X-User-ID == filing.submitting_engagement_id (ERR_AGENT_NOT_ENGAGED)"
          - "repository_receipt_id is unique across all Filings (ERR_RECEIPT_ID_DUPLICATE)"
        side_effects:
          - "sets repository_receipt_id and repository_confirmed_at = logical clock now"
          - "CASCADE HOP 1: the subject transitions — cycle FILING_IN_PROGRESS -> FILED_TIMELY|FILED_LATE per calculations.cycle_timeliness_assessment, or notice FILING_IN_PROGRESS -> FILED_TIMELY|FILED_LATE per submission-date comparison, or DirectPlacement DISCLOSURE_REQUIRED -> DISCLOSED for filing_type VOLUNTARY_FINANCIAL_OBLIGATION"
          - "CASCADE: if supersedes_filing_id is set, that target Filing transitions CONFIRMED -> SUPERSEDED and its superseded_by_filing_id is stamped with this filing id; the subject's filed_filing_id is repointed to this filing"
          - "recomputes submitting_engagement.billable_filing_count then calculations.dissemination_agent_invoice"
          - "increments Filing.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disclosure/filings/{id}/reject"
        actor: DisseminationAgent
        preconditions:
          - "filing.status == SUBMITTED"
          - "X-User-ID == filing.submitting_engagement_id (ERR_AGENT_NOT_ENGAGED)"
        side_effects:
          - "sets rejection_reason"
          - "CASCADE: cycle FILING_IN_PROGRESS -> READY_TO_FILE, or notice FILING_IN_PROGRESS -> MATERIAL"
          - "billable_filing_count is NOT incremented — a rejected submission is not billable"
          - "increments Filing.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /disclosure/filings/{id}/resubmit"
        actor: DisseminationAgent
        preconditions:
          - "filing.status == REJECTED"
          - "X-User-ID resolves to a DisseminationEngagement for the filing's undertaking (ERR_AGENT_NOT_ENGAGED)"
          - "that engagement.status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "filing.submission_attempt_count + 1 <= MAX_SUBMISSION_ATTEMPTS = 3 (ERR_SUBMISSION_ATTEMPTS_EXHAUSTED)"
          - >-
            correction_reason present in the request body — it is a declared REQUIRED input of
            /resubmit, so its absence is caught by §1.4 priority 5 as ERR_INVALID_REQUEST.
            ERR_CORRECTION_REASON_REQUIRED is reserved for priority 33's draft-creation check on
            a correcting Filing that carries supersedes_filing_id.
        side_effects:
          - "sets rejection_reason = null, correction_reason from the body, submitted_at = logical clock now, submission_attempt_count += 1, submitting_engagement_id = the resolved engagement id"
          - "CASCADE: cycle READY_TO_FILE -> FILING_IN_PROGRESS, or notice MATERIAL -> FILING_IN_PROGRESS"
          - "increments Filing.version by 1"
        note: >-
          Cyclic edge: DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED. Timeliness is judged on
          the LATEST submitted_at, so a rejection loop can convert a timely filing into a
          late one.
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "cascade of POST /disclosure/filings/{id}/confirm on a correcting filing whose supersedes_filing_id == this filing (system)"
        actor: system
        preconditions:
          - "filing.status == CONFIRMED"
          - "the correcting filing carries the identical subject tuple (filing_type, cycle_id, material_event_id, direct_placement_id)"
        side_effects:
          - "sets superseded_by_filing_id = the correcting filing id"
          - "recomputes submitting_engagement.billable_filing_count — this filing leaves the CONFIRMED set as the correction enters it, so the count is unchanged and calculations.dissemination_agent_invoice returns the same total (no double billing)"
          - "increments Filing.version by 1"

  - entity: FailureToFileEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [REMEDIATED]
    transitions:
      - from: OPEN
        to: REMEDIATION_PENDING
        trigger: "cascade of AnnualReportCycle FILING_IN_PROGRESS -> FILED_TIMELY|FILED_LATE (system)"
        actor: system
        preconditions:
          - "event.cycle_id == the cycle that reached a FILED_* status in this same request"
          - "event.status == OPEN"
        side_effects:
          - "refreshes days_late from the cycle and recomputes severity"
          - "increments FailureToFileEvent.version by 1"
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /disclosure/failure-to-file-events/{id}/remediate"
        actor: DisclosureOfficer
        preconditions:
          - "event.status IN {OPEN, REMEDIATION_PENDING}"
          - "the Filing referenced by remediation_filing_id has status == CONFIRMED (ERR_REMEDIATION_FILING_INVALID)"
          - >-
            that filing's subject matches this event, per §1.4 priority 31's two arms: when
            event.cycle_id is not null the filing must carry filing.cycle_id == event.cycle_id;
            when event.cycle_id is null (a material-event failure, whose notice is terminally
            MISSED and can therefore never itself be filed) it is enough that the filing's subject
            belongs to the SAME undertaking as the event — any CONFIRMED filing of that
            undertaking, including a later annual report or another event notice, is acceptable
            remediation evidence (ERR_REMEDIATION_FILING_INVALID)
        side_effects:
          - "sets remediation_filing_id, remediation_note, remediated_at = logical clock now"
          - "CASCADE: every OfficialStatement in status COMPLIANCE_REVIEW whose issue shares the issuer_program_code recomputes required_disclosure_event_ids and disclosure_adequacy — under the REMEDIATED_EXCLUDED variant this event may drop out of the required set"
          - "increments FailureToFileEvent.version by 1"
      - from: REMEDIATION_PENDING
        to: REMEDIATED
        trigger: "POST /disclosure/failure-to-file-events/{id}/remediate"
        actor: DisclosureOfficer
        preconditions:
          - "identical to the OPEN->REMEDIATED precondition set"
        side_effects:
          - "identical to the OPEN->REMEDIATED side-effect set"
          - "increments FailureToFileEvent.version by 1"

  - entity: DirectPlacement
    state_field: status
    initial_state: RECEIVED
    terminal_states: [DISCLOSED, DISCLOSURE_WAIVED]
    transitions:
      - from: RECEIVED
        to: DISCLOSURE_REQUIRED
        trigger: "POST /disclosure/direct-placements/{id}/classify"
        actor: ComplianceReviewer
        preconditions:
          - "placement.status == RECEIVED"
          - "placement.materiality_ratio_bp >= MATERIAL_OBLIGATION_THRESHOLD_BP = 500 OR placement.disclosure_practice == MANDATORY_MATERIAL_EVENT"
        side_effects:
          - "CASCADE HOP 1: creates MaterialEventNotice { issue_id: placement.issue_id, event_type: FINANCIAL_OBLIGATION_INCURRENCE, occurrence_date: placement.execution_date, financial_obligation_ref: placement.id, status: DETERMINATION_PENDING, per_se_material: false } and stores its id in linked_notice_id"
          - "CASCADE HOP 2 (caused by the notice write): issue.open_material_event_count and undertaking.open_obligation_count recomputed"
          - "increments DirectPlacement.version by 1"
      - from: RECEIVED
        to: DISCLOSURE_WAIVED
        trigger: "POST /disclosure/direct-placements/{id}/classify"
        actor: ComplianceReviewer
        preconditions:
          - "placement.status == RECEIVED"
          - "placement.materiality_ratio_bp < 500 AND placement.disclosure_practice != MANDATORY_MATERIAL_EVENT"
          - "waiver_reason present in the request body (ERR_WAIVER_REASON_REQUIRED)"
        side_effects:
          - "sets waiver_reason; linked_notice_id stays null and NO MaterialEventNotice is created"
          - "increments DirectPlacement.version by 1"
        note: >-
          Branch fork on the same trigger with disjoint side-effect sets, decided by the
          >= 500 bp boundary.
      - from: DISCLOSURE_REQUIRED
        to: DISCLOSED
        trigger: "cascade of POST /disclosure/filings/{id}/confirm (system)"
        actor: system
        preconditions:
          - "the confirmed filing has filing_type == VOLUNTARY_FINANCIAL_OBLIGATION and direct_placement_id == this placement, OR filing_type == MATERIAL_EVENT_NOTICE and material_event_id == this placement's linked_notice_id"
        side_effects:
          - "increments DirectPlacement.version by 1"

  - entity: OfficialStatement
    state_field: status
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: COMPLIANCE_REVIEW
        trigger: "POST /disclosure/official-statements/{id}/compliance-review"
        actor: ComplianceReviewer
        preconditions:
          - "os.status IN {DRAFT, COMPLIANCE_REVIEW}"
          - "os.issue.status == OUTSTANDING (ERR_ISSUE_NOT_OUTSTANDING)"
        side_effects:
          - "replaces disclosed_event_ids with the request body value"
          - "runs calculations.official_statement_disclosure_lookback under the variant selected by os.lookback_policy, writing required_disclosure_event_ids, required_disclosure_event_count and disclosure_adequacy"
          - "sets reviewed_by_user_id = X-User-ID and reviewed_at = logical clock now"
          - "increments OfficialStatement.version by 1"
      - from: COMPLIANCE_REVIEW
        to: COMPLIANCE_REVIEW
        trigger: "POST /disclosure/official-statements/{id}/compliance-review"
        actor: ComplianceReviewer
        preconditions:
          - "identical to the DRAFT->COMPLIANCE_REVIEW precondition set"
        side_effects:
          - "identical to the DRAFT->COMPLIANCE_REVIEW side-effect set; reviewed_by_user_id is overwritten with the re-reviewing user"
          - "increments OfficialStatement.version by 1"
        note: >-
          Self-loop: the drafter widens disclosed_event_ids and asks for another review until
          disclosure_adequacy == ADEQUATE.
      - from: COMPLIANCE_REVIEW
        to: POSTED
        trigger: "POST /disclosure/official-statements/{id}/post"
        actor: ComplianceReviewer
        preconditions:
          - "os.status == COMPLIANCE_REVIEW"
          - "calculations.official_statement_disclosure_lookback re-run at post time yields disclosure_adequacy == ADEQUATE (ERR_DISCLOSURE_INADEQUATE)"
          - "X-User-ID != os.reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets posted_by_user_id = X-User-ID and posted_at = logical clock now"
          - "CASCADE: appends this OfficialStatement id to disclosed_in_official_statement_ids on every FailureToFileEvent listed in required_disclosure_event_ids, in required_disclosure_event_ids order"
          - "increments OfficialStatement.version by 1"

  - entity: DisseminationEngagement
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /disclosure/calendar-sweeps step 4 (system)"
        actor: system
        preconditions:
          - "engagement.status == ACTIVE"
          - "monitoring_lapse_days > MONITORING_ACK_MAX_GAP_DAYS = 45"
        side_effects:
          - "refreshes monitoring_lapse_days"
          - "the engagement can no longer submit or resubmit filings (ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "increments DisseminationEngagement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar"
        actor: DisseminationAgent
        preconditions:
          - "engagement.status == SUSPENDED"
          - "X-User-ID == engagement.id (ERR_AGENT_NOT_ENGAGED)"
          - "last_calendar_ack_date >= engagement.effective_date and <= date part of logical clock now (ERR_ACK_DATE_OUT_OF_RANGE)"
        side_effects:
          - "sets last_calendar_ack_date from the request body and refreshes monitoring_lapse_days"
          - "increments DisseminationEngagement.version by 1"
        note: "Cyclic edge ACTIVE -> SUSPENDED -> ACTIVE driven by calendar monitoring."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar"
        actor: DisseminationAgent
        preconditions:
          - "identical to the SUSPENDED->ACTIVE precondition set except engagement.status == ACTIVE"
        side_effects:
          - "sets last_calendar_ack_date and refreshes monitoring_lapse_days"
          - "increments DisseminationEngagement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /disclosure/dissemination-engagements/{id}/terminate"
        actor: FinanceDirector
        preconditions:
          - "engagement.status IN {ACTIVE, SUSPENDED}"
          - "no Filing exists with submitting_engagement_id == this engagement and status == SUBMITTED (ERR_ENGAGEMENT_HAS_LIVE_FILING)"
        side_effects:
          - "sets termination_reason = ISSUER_TERMINATED"
          - "freezes invoice_total_cents at its current value — no later recompute touches a TERMINATED engagement"
          - "increments DisseminationEngagement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /disclosure/dissemination-engagements/{id}/terminate"
        actor: FinanceDirector
        preconditions:
          - "identical to the ACTIVE->TERMINATED precondition set"
        side_effects:
          - "identical to the ACTIVE->TERMINATED side-effect set"
          - "increments DisseminationEngagement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade of POST /disclosure/dissemination-engagements (a newer engagement supersedes this one) (system)"
        actor: system
        preconditions:
          - "engagement.status IN {ACTIVE, SUSPENDED}"
          - "a new DisseminationEngagement for the same undertaking_id was accepted in this same request"
        side_effects:
          - "sets termination_reason = SUPERSEDED and superseded_by_engagement_id = the new engagement id"
          - "freezes invoice_total_cents"
          - "increments DisseminationEngagement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade hop 2b of Undertaking -> TERMINATED (system)"
        actor: system
        preconditions:
          - "the owning undertaking reached TERMINATED in this same request"
        side_effects:
          - "sets termination_reason = UNDERTAKING_TERMINATED"
          - "freezes invoice_total_cents"
          - "increments DisseminationEngagement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "cascade hop 2b of Undertaking -> TERMINATED (system)"
        actor: system
        preconditions:
          - "the owning undertaking reached TERMINATED in this same request"
        side_effects:
          - "sets termination_reason = UNDERTAKING_TERMINATED; freezes invoice_total_cents"
          - "increments DisseminationEngagement.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
# write-write conflict mechanism)
# =============================================================================

concurrency_rules:
  - rule_id: filing-create-stale-issue
    parent_entity: BondIssue
    write_endpoint: "POST /disclosure/filings"
    occ_field: "expected_issue_version"
    description: |
      Creating a Filing against a BondIssue whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has already opened
      a correcting filing for the same subject — a correction legitimately supersedes the
      prior CONFIRMED filing under the Filing CONFIRMED->SUPERSEDED transition, so the
      creation itself is valid product semantics; what is stale is the creating client's view
      of the issue's disclosure record.
    error_id: ERR_ISSUE_VERSION_STALE
    http_status: 412

  - rule_id: rating-action-stale-issue
    parent_entity: BondIssue
    write_endpoint: "POST /disclosure/bond-issues/{id}/rating-actions"
    occ_field: "expected_issue_version"
    description: |
      Recording a rating action against a BondIssue whose version has advanced since the
      client last observed it is rejected. A rating action legitimately overwrites
      current_rating / current_rating_agency, so a second recording is valid on its own
      terms; OCC forces the writer to have observed the rating the new action supersedes.
    error_id: ERR_ISSUE_VERSION_STALE
    http_status: 412

  - rule_id: engagement-create-stale-undertaking
    parent_entity: Undertaking
    write_endpoint: "POST /disclosure/dissemination-engagements"
    occ_field: "expected_undertaking_version"
    description: |
      Creating a DisseminationEngagement against an Undertaking whose version has advanced
      since the client last observed it is rejected. A new engagement legitimately supersedes
      the prior one (prior engagement -> TERMINATED with termination_reason SUPERSEDED), so
      the creation would otherwise succeed; OCC forces the writer to have observed the
      engagement it is about to displace.
    error_id: ERR_UNDERTAKING_VERSION_STALE
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: business_day_calendar
    trigger: >-
      Helper invoked by calculations.annual_report_due_date and
      calculations.material_event_filing_deadline. Never exposed on its own.
    algorithm: interval_merge
    formula: |
      is_business_day(d):
        return (weekday(d) NOT IN WEEKEND_DAYS) AND (d NOT IN MARKET_HOLIDAYS)

      add_business_days(base_date, n):
        # base_date itself is NEVER counted, whether or not it is a business day.
        d = base_date
        counted = 0
        while counted < n:
          d = d + 1 calendar day
          if is_business_day(d): counted = counted + 1
        return d          # the n-th business day strictly after base_date

      roll_forward_to_business_day(d):
        while NOT is_business_day(d): d = d + 1 calendar day
        return d          # returns d unchanged when d is already a business day
    input_set: >-
      Pure function of the two constants below plus its arguments. It reads no entity rows, so
      it is unaffected by entity state.
    constants:
      WEEKEND_DAYS: [SATURDAY, SUNDAY]
      MARKET_HOLIDAYS:
        - "2026-07-03"
        - "2026-09-07"
        - "2026-10-12"
        - "2026-11-11"
        - "2026-11-26"
        - "2026-12-25"
        - "2027-01-01"
        - "2027-01-18"
        - "2027-02-15"
        - "2027-05-31"
        - "2027-07-05"
        - "2027-09-06"
        - "2027-11-25"
        - "2027-12-24"
    precision: "whole calendar dates; no time component"

  - name: annual_report_due_date
    trigger: "AnnualReportCycle creation (POST /disclosure/annual-report-cycles); writes cycle.due_date"
    algorithm: threshold
    formula: |
      raw_due = cycle.period_end_date + undertaking.filing_window_days CALENDAR days
      due_date = roll_forward_to_business_day(raw_due)
    input_set: >-
      Reads exactly two fields: the cycle's own period_end_date and the owning Undertaking's
      filing_window_days as of cycle-creation time. A later change to filing_window_days does
      NOT re-derive an existing cycle's due_date.
    constants:
      DEFAULT_FILING_WINDOW_DAYS: 210
    precision: "calendar date; the roll is always FORWARD, never backward"

  - name: material_event_filing_deadline
    trigger: >-
      MaterialEventNotice creation (POST /disclosure/material-event-notices, the
      rating-actions endpoint, the defeasance cascade, and the direct-placement classify
      cascade); writes notice.filing_deadline_date and notice.per_se_material
    algorithm: threshold
    formula: |
      per_se_material = notice.event_type IN PER_SE_MATERIAL_EVENT_TYPES
      filing_deadline_date = add_business_days(notice.occurrence_date,
                                              MATERIAL_EVENT_WINDOW_BUSINESS_DAYS)

      # Timeliness comparison used by the notice FILED_TIMELY / FILED_LATE branch:
      #   timely  <=>  date_part(filing.submitted_at) <= filing_deadline_date
      # The comparison is <= (inclusive): a submission ON the deadline date is TIMELY.
    input_set: >-
      occurrence_date and event_type of the notice only. The window is measured from the
      occurrence date, NOT from the determination date, so a slow determination consumes the
      same ten business days.
    constants:
      MATERIAL_EVENT_WINDOW_BUSINESS_DAYS: 10
      PER_SE_MATERIAL_EVENT_TYPES:
        - PRINCIPAL_PAYMENT_DELINQUENCY
        - RATING_CHANGE
        - DEFEASANCE
        - BOND_CALL
    precision: "calendar date; business-day stepping per calculations.business_day_calendar"

  - name: cycle_timeliness_assessment
    trigger: >-
      Cascade of POST /disclosure/filings/{id}/confirm for a filing whose filing_type ==
      ANNUAL_REPORT; decides the cycle's FILED_TIMELY vs FILED_LATE branch and writes
      cycle.filed_at, cycle.days_late and cycle.timeliness_basis_applied
    algorithm: chronological
    formula: |
      variant = undertaking.timeliness_basis          # persisted per undertaking
      basis_instant = (variant == SUBMISSION_BASIS)
                        ? filing.submitted_at         # latest submit/resubmit instant
                        : filing.repository_confirmed_at
      basis_date = date_part(basis_instant)
      timely   = basis_date <= cycle.due_date         # inclusive boundary
      days_late = timely ? 0 : (basis_date - cycle.due_date) in whole calendar days
      cycle.filed_at = basis_instant
      cycle.timeliness_basis_applied = variant
    input_set: >-
      Exactly one Filing — the one being confirmed — plus the cycle's due_date. Earlier
      REJECTED submissions of the same filing are ignored: submitted_at always holds the
      latest submission instant.
    constants: {}
    precision: "whole calendar days; date comparison in UTC"
    variants:
      - name: SUBMISSION_BASIS
        when: "undertaking.timeliness_basis == SUBMISSION_BASIS (the default)"
        difference: >-
          Measures the moment the agent handed the document to the repository. A document
          submitted on the due date is TIMELY even if the repository confirms it days later.
      - name: CONFIRMATION_BASIS
        when: "undertaking.timeliness_basis == CONFIRMATION_BASIS"
        difference: >-
          Measures the moment the repository confirmed receipt. For the identical filing —
          same submitted_at, same repository_confirmed_at — this variant can yield FILED_LATE
          where SUBMISSION_BASIS yields FILED_TIMELY, and therefore mints a
          FailureToFileEvent, bumps late_filing_count, and reruns the risk score, none of
          which the other variant does.

  - name: official_statement_disclosure_lookback
    trigger: >-
      POST /disclosure/official-statements/{id}/compliance-review, plus every recompute
      cascade listed on the FailureToFileEvent and FILED_LATE transitions; writes
      required_disclosure_event_ids, required_disclosure_event_count and disclosure_adequacy
    algorithm: aggregation
    formula: |
      window_start = os.dated_date MINUS LOOKBACK_YEARS calendar years
                     (same month and day; 02-29 maps to 02-28 in a non-leap year)
      scope_program = BondIssue[os.issue_id].issuer_program_code

      candidates = every FailureToFileEvent E such that
          Undertaking[E.undertaking_id].issue_id IN
              { B.id : B IN BondIssue AND B.issuer_program_code == scope_program }
        AND E.occurred_at >= window_start        # inclusive left edge
        AND E.occurred_at <  os.dated_date       # exclusive right edge

      if os.lookback_policy == STRICT_FIVE_YEAR:
          required = candidates
      else:   # REMEDIATED_EXCLUDED
          required = [ E in candidates
                       WHERE NOT (E.status == REMEDIATED
                                  AND date_part(E.remediated_at) < os.dated_date) ]

      required_disclosure_event_ids = required sorted by (E.occurred_at ASC, E.created_at ASC)
      required_disclosure_event_count = length(required_disclosure_event_ids)
      disclosure_adequacy =
          set(required_disclosure_event_ids) SUBSET-OF set(os.disclosed_event_ids)
            ? ADEQUATE : INCOMPLETE
      # Ids in disclosed_event_ids that are not in the required set are ignored, not errors.
    input_set: >-
      All FailureToFileEvents in every status (OPEN, REMEDIATION_PENDING, REMEDIATED) whose
      undertaking hangs off a BondIssue sharing the official statement's issuer_program_code,
      including the official statement's own issue. Interval is [dated_date - 5 years,
      dated_date): an event that occurred exactly five years before the dated date IS in
      scope; one that occurred on the dated date is NOT.
    constants:
      LOOKBACK_YEARS: 5
    precision: "calendar dates; ordering ties broken by created_at ASC (never by id)"
    variants:
      - name: STRICT_FIVE_YEAR
        when: "os.lookback_policy == STRICT_FIVE_YEAR (the default)"
        difference: >-
          Every in-window failure must be described in the document, even ones already cured.
          Produces the larger required set.
      - name: REMEDIATED_EXCLUDED
        when: "os.lookback_policy == REMEDIATED_EXCLUDED"
        difference: >-
          Failures whose status is REMEDIATED with remediated_at strictly before the dated
          date drop out. For the identical failure population this yields a smaller
          required_disclosure_event_count and can flip disclosure_adequacy from INCOMPLETE to
          ADEQUATE, which in turn decides whether the POST transition is permitted at all.

  - name: content_preparation_completeness_score
    trigger: >-
      Every CycleContentItem write (PATCH, attest, reopen, waive, VOID cascade) and every
      AnnualReportCycle assemble / withdraw / CLOSED_NOT_REQUIRED transition; writes
      cycle.completeness_score_pct
    algorithm: weighted_scoring
    formula: |
      items = [ I in CycleContentItem WHERE I.cycle_id == cycle.id AND I.status != VOID ]

      readiness_factor(I) = 1.0  if I.status IN {READY, WAIVED}
                            0.5  if I.status == DRAFT
                            0.0  if I.status == NOT_STARTED

      opinion_multiplier(I) =
          1.0   if ContentRequirement[I.content_requirement_id].requires_audit_opinion == false
          1.0   if I.audit_opinion_type == UNMODIFIED
          0.8   if I.audit_opinion_type == QUALIFIED
          0.5   if I.audit_opinion_type == UNAUDITED_INTERIM
          0.0   if requires_audit_opinion == true AND I.audit_opinion_type IS NULL

      # STEP 1 — round EACH item's contribution to 4 decimal places, round_half_up:
      contribution(I) = round_half_up( I.weight_bp_snapshot / 10000
                                       * readiness_factor(I)
                                       * opinion_multiplier(I), 4 )
      # STEP 2 — sum the ALREADY-ROUNDED contributions exactly (no re-rounding):
      raw = SUM( contribution(I) for I in items )
      # STEP 3 — scale to percent and round once more to 2 decimal places, round_half_up:
      completeness_score_pct = round_half_up( raw * 100, 2 )
      # If items is empty (every item VOID, or the cycle has no items) the sum is 0 and
      # completeness_score_pct = 0.00.
    input_set: >-
      Every CycleContentItem of the cycle whose status is not VOID. WAIVED items stay in the
      input set and contribute their full weight; VOID items are removed entirely, so voiding
      cannot raise the score.
    constants:
      SCORE_ITEM_DECIMALS: 4
      SCORE_PCT_DECIMALS: 2
    precision: >-
      round_half_up at 4 decimals PER ITEM FIRST, then sum, then round_half_up at 2 decimals.
      The alternative order — sum the unrounded contributions and round once — is explicitly
      REJECTED: for weight_bp_snapshot [3333, 3333, 3333, 1] with the three 3333-weight items
      in DRAFT and no audit-opinion penalty, the pinned order yields 50.01 while the rejected
      order yields 50.00.

  - name: undertaking_disclosure_risk_score
    trigger: >-
      Any write to undertaking.late_filing_count, missed_event_count or
      delinquent_cycle_count — i.e. FailureToFileEvent creation, AnnualReportCycle
      DELINQUENT entry/exit, MaterialEventNotice MISSED, and the CLOSED_NOT_REQUIRED cascade;
      writes disclosure_risk_score, remediation_tier and compliance_posture
    algorithm: constraint_propagation
    formula: |
      # Inputs, all read AFTER the count recompute that triggered this pass:
      L = undertaking.late_filing_count
      M = undertaking.missed_event_count
      D = undertaking.delinquent_cycle_count
      T_prev = undertaking.remediation_tier      # the PERSISTED value, before this pass

      # STEP 1 — additive base:
      base = LATE_WEIGHT * L + MISSED_WEIGHT * M + DELINQUENT_WEIGHT * D
      # STEP 2 — escalate using the tier persisted from the PREVIOUS pass (never the tier
      #          this pass is about to derive):
      raw = round_half_up( base * TIER_MULTIPLIER[T_prev], 2 )
      # STEP 3 — ceiling:
      disclosure_risk_score = min( SCORE_CEILING, raw )
      # STEP 4 — derive the new tier from the score just written (>= boundaries):
      remediation_tier = TIER_3 if disclosure_risk_score >= 75.00
                         TIER_2 if disclosure_risk_score >= 50.00
                         TIER_1 if disclosure_risk_score >= 25.00
                         TIER_0 otherwise
      # STEP 5 — persist both fields. The pass runs EXACTLY ONCE; it is NOT iterated to a
      #          fixed point, so remediation_tier and disclosure_risk_score may disagree by
      #          one escalation step until the next trigger.
      # STEP 6 — posture, where any delinquent cycle dominates the score bands:
      compliance_posture = DELINQUENT if D >= 1
                           IMPAIRED   if disclosure_risk_score >= 50.00
                           WATCH      if disclosure_risk_score >= 25.00
                           COMPLIANT  otherwise
    input_set: >-
      The three monotone-or-live counters on the undertaking plus its own previously persisted
      remediation_tier. No other entity is read, and the pass never reads a tier it derived
      in the same request.
    constants:
      LATE_WEIGHT: 12
      MISSED_WEIGHT: 20
      DELINQUENT_WEIGHT: 15
      SCORE_CEILING: 100.00
      TIER_MULTIPLIER: { TIER_0: 1.00, TIER_1: 1.10, TIER_2: 1.25, TIER_3: 1.40 }
    precision: >-
      2 decimal places, round_half_up, applied to the product in STEP 2 before the ceiling in
      STEP 3. Worked chain from a fresh undertaking, three successive MATERIAL_EVENT_MISSED
      failures: M=1 -> base 20, prev TIER_0, score 20.00, tier TIER_0; M=2 -> base 40, prev
      TIER_0, score 40.00, tier TIER_1; M=3 -> base 60, prev TIER_1, score 66.00, tier
      TIER_2. Reading the freshly derived tier instead of the persisted one would give 75.00 /
      TIER_3 on the third pass — that reading is REJECTED.

  - name: dissemination_agent_invoice
    trigger: >-
      Filing SUBMITTED->CONFIRMED and CONFIRMED->SUPERSEDED cascades (billable_filing_count
      changes) and every compliance_posture write; writes
      DisseminationEngagement.billable_filing_count and invoice_total_cents. Skipped entirely
      for engagements in status TERMINATED (their invoice_total_cents is frozen).
    algorithm: tiered_pricing
    formula: |
      # INPUT 1 — the conserved filing count:
      F = COUNT( Filing WHERE submitting_engagement_id == engagement.id
                          AND status == CONFIRMED )
      # A filing that has moved to SUPERSEDED is no longer CONFIRMED, so a correction that
      # replaces it leaves F unchanged.

      # INPUT 2 — MARGINAL tier allocation over F (never an average rate):
      t1 = min(F, 4)                                    ; f1 = t1 * TIER1_RATE_CENTS
      t2 = min(max(F - 4, 0), 5)                         ; f2 = t2 * TIER2_RATE_CENTS
      t3 = max(F - 9, 0)                                 ; f3 = t3 * TIER3_RATE_CENTS
      filing_fees = f1 + f2 + f3

      subtotal = engagement.retainer_cents + filing_fees

      # INPUT 3 — conditional surcharge on the undertaking's posture, computed on the
      # subtotal BEFORE any cap, then itself capped:
      surcharge = (undertaking.compliance_posture IN {IMPAIRED, DELINQUENT})
                    ? min( round_half_up(subtotal * SURCHARGE_RATE, 0), MAX_SURCHARGE_CENTS )
                    : 0

      # Nested cap-then-floor, in this exact order:
      capped = min( subtotal + surcharge, ANNUAL_FEE_CAP_CENTS )
      invoice_total_cents = max( capped, MIN_ANNUAL_FEE_CENTS )
      billable_filing_count = F
    input_set: >-
      Filings whose submitting_engagement_id is this engagement and whose status is exactly
      CONFIRMED — DRAFT, SUBMITTED, REJECTED and SUPERSEDED filings are all excluded — plus
      the engagement's retainer_cents and the owning Undertaking's compliance_posture.
    constants:
      TIER1_RATE_CENTS: 45000      # filings 1..4
      TIER2_RATE_CENTS: 32500      # filings 5..9
      TIER3_RATE_CENTS: 25000      # filings 10 and beyond
      SURCHARGE_RATE: 0.15
      MAX_SURCHARGE_CENTS: 150000
      ANNUAL_FEE_CAP_CENTS: 1200000
      MIN_ANNUAL_FEE_CENTS: 300000
    precision: >-
      integer cents throughout; the only rounding is round_half_up to 0 decimals on the
      surcharge. Worked example: F=6, retainer 250000, posture IMPAIRED -> filing_fees
      4*45000 + 2*32500 = 245000, subtotal 495000, surcharge min(74250, 150000) = 74250,
      capped min(569250, 1200000) = 569250, invoice_total_cents max(569250, 300000) = 569250.
      Worked floor example: F=1, retainer 250000, posture COMPLIANT -> subtotal 295000,
      surcharge 0, capped 295000, invoice_total_cents 300000 (the floor binds).

  - name: undertaking_open_obligation_count
    trigger: >-
      Every AnnualReportCycle status write and every MaterialEventNotice status write; writes
      undertaking.open_obligation_count
    algorithm: aggregation
    formula: |
      open_obligation_count =
          COUNT( AnnualReportCycle C
                 WHERE C.undertaking_id == undertaking.id
                   AND C.status IN {DRAFTING, READY_TO_FILE, FILING_IN_PROGRESS, DELINQUENT} )
        + COUNT( MaterialEventNotice N
                 WHERE N.issue_id == undertaking.issue_id
                   AND N.status IN {DETERMINATION_PENDING, MATERIAL, FILING_IN_PROGRESS} )
    input_set: >-
      Source A: AnnualReportCycle rows of this undertaking with status in the four open
      statuses listed — FILED_TIMELY, FILED_LATE, WITHDRAWN and CLOSED_NOT_REQUIRED are
      excluded. Source B: MaterialEventNotice rows of this undertaking's single BondIssue with
      status in the three open statuses listed — NOT_MATERIAL, FILED_TIMELY, FILED_LATE,
      MISSED and VOID are excluded. Full recompute on every trigger; never incremented in
      place.
    constants: {}
    precision: >-
      exact integer. This is the conserved quantity of the create-cycle / withdraw-cycle
      compensating pair: withdrawing a cycle created moments earlier MUST return
      open_obligation_count to its pre-create value.

  - name: direct_placement_materiality_ratio
    trigger: "DirectPlacement creation (POST /disclosure/direct-placements); writes materiality_ratio_bp"
    algorithm: threshold
    formula: |
      materiality_ratio_bp = round_half_up(
          placement.principal_amount_cents * 10000
          / BondIssue[placement.issue_id].outstanding_par_amount_cents , 0 )

      # Classification boundary, applied later by the classify action (>= is inclusive):
      #   materiality_ratio_bp >= MATERIAL_OBLIGATION_THRESHOLD_BP  -> DISCLOSURE_REQUIRED
      #   otherwise, and practice != MANDATORY_MATERIAL_EVENT       -> DISCLOSURE_WAIVED
    input_set: >-
      The placement's own principal_amount_cents and the issue's outstanding_par_amount_cents
      AS OF CREATION TIME. Frozen thereafter: a later defeasance that zeroes outstanding par
      never re-derives this ratio (and creation against a non-OUTSTANDING issue is refused
      before the division can happen).
    constants:
      MATERIAL_OBLIGATION_THRESHOLD_BP: 500
    precision: >-
      integer basis points, round_half_up. Boundary worked example: principal 5_000_000 cents
      against outstanding par 100_000_000 cents -> exactly 500 bp -> DISCLOSURE_REQUIRED;
      principal 4_990_000 cents -> 499 bp -> DISCLOSURE_WAIVED.

  - name: undertaking_delinquency_counters
    trigger: >-
      FailureToFileEvent creation, AnnualReportCycle status writes, MaterialEventNotice status
      writes, and ContentRequirement creation. Runs BEFORE
      calculations.undertaking_disclosure_risk_score in the same request and writes
      undertaking.late_filing_count, missed_event_count, delinquent_cycle_count and
      content_weight_bp_total.
    algorithm: aggregation
    formula: |
      late_filing_count =
          COUNT( FailureToFileEvent F WHERE F.undertaking_id == u.id
                                        AND F.kind IN {ANNUAL_REPORT_LATE,
                                                       ANNUAL_REPORT_MISSED} )
      missed_event_count =
          COUNT( FailureToFileEvent F WHERE F.undertaking_id == u.id
                                        AND F.kind == MATERIAL_EVENT_MISSED )
      delinquent_cycle_count =
          COUNT( AnnualReportCycle C WHERE C.undertaking_id == u.id
                                       AND C.status == DELINQUENT )
      content_weight_bp_total =
          SUM( R.weight_bp for R in ContentRequirement WHERE R.undertaking_id == u.id )
    input_set: >-
      late_filing_count and missed_event_count are MONOTONE: they count failure-event rows by
      kind and remediating an event does NOT decrement them (the historical failure still has
      to be disclosed). delinquent_cycle_count is LIVE: a cycle leaving DELINQUENT for
      FILED_LATE decrements it, which is what lets compliance_posture recover from DELINQUENT.
    constants: {}
    precision: "exact integers"

  - name: failure_severity_and_days_late
    trigger: >-
      FailureToFileEvent creation (cascade of a FILED_LATE cycle, a MISSED notice, or a
      calendar sweep) and MaterialEventNotice FILED_LATE / MISSED entry; writes
      FailureToFileEvent.days_late, FailureToFileEvent.severity and
      MaterialEventNotice.days_late
    algorithm: threshold
    formula: |
      # MaterialEventNotice.days_late — whole calendar days past the ten-business-day window:
      notice.days_late = max(0, date_part(reference_instant) - notice.filing_deadline_date)
        where reference_instant = filing.submitted_at when the notice reached FILED_LATE,
              and the sweep instant when the notice reached MISSED.

      # FailureToFileEvent.days_late is copied from the originating obligation:
      failure.days_late = (failure.kind == ANNUAL_REPORT_LATE)
                            ? cycle.days_late
                            : max(0, date_part(clock.current_utc) - failure.occurred_at)
      failure.severity = MAJOR if failure.kind IN {ANNUAL_REPORT_MISSED,
                                                  MATERIAL_EVENT_MISSED}
                                  OR failure.days_late >= MAJOR_DAYS_LATE
                         MINOR otherwise
    input_set: >-
      Exactly one originating row — the cycle for ANNUAL_REPORT_LATE, the notice for
      MATERIAL_EVENT_MISSED, the cycle's own due_date for ANNUAL_REPORT_MISSED. Frozen at
      creation: later remediation never rewrites days_late or severity.
    constants:
      MAJOR_DAYS_LATE: 30
    precision: >-
      whole calendar days, floor at 0. Boundary for an ANNUAL_REPORT_LATE event: days_late
      29 -> MINOR, 30 -> MAJOR. Both MISSED kinds are MAJOR regardless of days_late.

  - name: engagement_monitoring_lapse
    trigger: >-
      POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar and every calendar
      sweep step 4; writes DisseminationEngagement.monitoring_lapse_days and drives the
      ACTIVE -> SUSPENDED monitoring transition
    algorithm: threshold
    formula: |
      base_date = engagement.last_calendar_ack_date
                  IF NULL THEN engagement.effective_date
      monitoring_lapse_days = max(0, date_part(clock.current_utc) - base_date)
      # Sweep step 4 suspends the engagement when:
      #   monitoring_lapse_days > MONITORING_ACK_MAX_GAP_DAYS
      # so a lapse of exactly MONITORING_ACK_MAX_GAP_DAYS is still compliant.
    input_set: >-
      The engagement's own last_calendar_ack_date (falling back to effective_date) and the
      logical clock. Computed for engagements in status ACTIVE and SUSPENDED; frozen for
      TERMINATED.
    constants:
      MONITORING_ACK_MAX_GAP_DAYS: 45
    precision: >-
      whole calendar days, floor at 0. Boundary: 45 days -> stays ACTIVE; 46 days -> SUSPENDED.

  - name: derived_flag_bookkeeping
    trigger: >-
      ContentRequirement creation; Filing submit / resubmit; MaterialEventNotice status writes;
      writes ContentRequirement.requires_audit_opinion, Filing.submission_attempt_count and
      BondIssue.open_material_event_count
    algorithm: aggregation
    formula: |
      # 1. Audit-opinion requirement is a pure function of the requirement's kind:
      requires_audit_opinion = requirement.kind IN AUDIT_OPINION_KINDS

      # 2. Submission attempts, incremented before the priority-35 ceiling is applied:
      submission_attempt_count = COUNT of successful submit + resubmit calls on this filing

      # 3. Open material events on the issue, full recompute:
      open_material_event_count =
          COUNT( MaterialEventNotice N WHERE N.issue_id == issue.id
                   AND N.status IN {DETERMINATION_PENDING, MATERIAL, FILING_IN_PROGRESS} )
    input_set: >-
      Source for (1) is the requirement row alone. Source for (2) is the filing's own accepted
      submission calls — a rejected repository response does NOT add an attempt, only the
      resubmit that follows it does. Source for (3) is every notice of the issue in an open
      status; NOT_MATERIAL, FILED_TIMELY, FILED_LATE, MISSED and VOID notices are excluded.
    constants:
      AUDIT_OPINION_KINDS: [AUDITED_FINANCIALS]
    precision: "exact integers / boolean"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST rule that fails is the ONLY error returned)
# =============================================================================

validations:

  - priority: 1
    category: auth
    check: >-
      X-User-Role header is present and its value is one of the four roles declared in §1.7;
      X-User-ID header is present and non-empty.
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: >-
      The value of X-User-Role appears in the called endpoint's roles list in §1.5.
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: >-
      Every {id} path segment resolves to a stored row of the endpoint's own entity, validated
      left-to-right. Emits the entity-specific not-found error (ERR_ISSUE_NOT_FOUND,
      ERR_UNDERTAKING_NOT_FOUND, ERR_REQUIREMENT_NOT_FOUND, ERR_CYCLE_NOT_FOUND,
      ERR_CONTENT_ITEM_NOT_FOUND, ERR_EVENT_NOTICE_NOT_FOUND, ERR_FILING_NOT_FOUND,
      ERR_FAILURE_EVENT_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_OFFICIAL_STATEMENT_NOT_FOUND,
      ERR_ENGAGEMENT_NOT_FOUND).
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with an {id} path parameter"

  - priority: 4
    category: existence
    check: >-
      Every FK-bearing field in the request body resolves to a stored row, validated in the
      field order declared by the endpoint's input list. Emits the same entity-specific
      not-found errors as priority 3. Applies to issue_id, undertaking_id,
      content_requirement_id, cycle_id, material_event_id, direct_placement_id,
      submitting_engagement_id, supersedes_filing_id and every id inside disclosed_event_ids.
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints carrying a FK field"

  - priority: 5
    category: business_constraint
    check: >-
      Request shape is well-formed: every required input present; enums within their declared
      value sets; integers non-negative where declared; dates ISO-8601; period_start_date <
      period_end_date; weight_bp in 1..10000; retainer_cents >= 0; disclosed_event_ids a
      (possibly empty) array of distinct ids.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 6
    category: business_referential
    check: >-
      When the acting role is DisseminationAgent, X-User-ID must equal the id of a
      DisseminationEngagement row (identity is entity_backed) AND that engagement must be the
      one the request belongs to:
      (a) POST /disclosure/filings/{id}/submit — the engagement's undertaking_id must equal the
          undertaking that owns the filing's subject (its cycle's undertaking, or the
          undertaking of the issue named by the notice / placement);
      (b) POST /disclosure/filings/{id}/confirm, /reject, /resubmit — X-User-ID must equal
          filing.submitting_engagement_id exactly, so only the agent that submitted may carry
          the repository's response back;
      (c) POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar — X-User-ID must
          equal the {id} path segment.
      Checked regardless of the engagement's own status, so a terminated agent gets
      ERR_AGENT_NOT_ENGAGED rather than leaking another engagement's data.
    error_id: ERR_AGENT_NOT_ENGAGED
    http_status: 403
    applies_to: >-
      POST /disclosure/filings/{id}/submit, /confirm, /reject, /resubmit;
      POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar
    error_note: "distinct from priority 2 — the role IS permitted, the identity is wrong"

  - priority: 7
    category: state
    check: >-
      Optimistic concurrency: for every endpoint declaring an expected_<parent>_version input,
      the supplied integer must equal the parent's current version field. See §1.2.1 for the
      three concurrency rules. Evaluated BEFORE any state precondition so that a caller acting
      on stale data always learns that fact first.
    error_id: ERR_ISSUE_VERSION_STALE | ERR_UNDERTAKING_VERSION_STALE
    http_status: 412
    applies_to: >-
      POST /disclosure/filings; POST /disclosure/bond-issues/{id}/rating-actions;
      POST /disclosure/dissemination-engagements

  - priority: 8
    category: state
    check: >-
      The target row's own status permits the requested transition per §1.2 (for example a
      filing must be DRAFT to submit, SUBMITTED to confirm or reject, REJECTED to resubmit; a
      cycle must be READY_TO_FILE to be picked up by a filing; a content item must not be
      VOID to be patched; a notice must be DETERMINATION_PENDING to be determined; an official
      statement must be COMPLIANCE_REVIEW to be posted). This rule inspects the status field
      ONLY — never a derived field such as disclosure_adequacy, which is priority 32's job, so
      posting a COMPLIANCE_REVIEW statement whose disclosure is inadequate reaches priority 32.
      This is the highest-priority business check and therefore wins every priority-conflict
      pairing with the rules below.
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints and every PATCH"

  - priority: 9
    category: state
    check: >-
      Cross-entity gate: the BondIssue that owns the target row must be in status OUTSTANDING.
      Blocks cycle creation, notice creation, placement creation, filing creation and official
      statement compliance-review under a DEFEASED or MATURED issue.
    error_id: ERR_ISSUE_NOT_OUTSTANDING
    http_status: 409
    applies_to: >-
      POST /disclosure/undertakings; POST /disclosure/annual-report-cycles;
      POST /disclosure/material-event-notices; POST /disclosure/direct-placements;
      POST /disclosure/filings; POST /disclosure/official-statements/{id}/compliance-review

  - priority: 10
    category: state
    check: >-
      Cross-entity gate: the Undertaking that owns the target row must be in status ACTIVE.
      A SUSPENDED or TERMINATED undertaking accepts no new cycles, no content-item writes, no
      assemble and no new engagements.
    error_id: ERR_UNDERTAKING_NOT_ACTIVE
    http_status: 409
    applies_to: >-
      POST /disclosure/annual-report-cycles; PATCH /disclosure/cycle-content-items/{id};
      POST /disclosure/cycle-content-items/{id}/attest; .../reopen; .../waive;
      POST /disclosure/annual-report-cycles/{id}/assemble;
      POST /disclosure/dissemination-engagements

  - priority: 11
    category: business_referential
    check: >-
      Cross-entity gate: the DisseminationEngagement acting on this request — resolved from
      X-User-ID for filing actions, or named by the {id} path segment for engagement actions —
      must be in status ACTIVE. A SUSPENDED engagement may still acknowledge the calendar (that
      is its cure path) and may still be terminated by the FinanceDirector, but it may not
      submit, resubmit, confirm or reject; a TERMINATED engagement may do none of these, and its
      terminate / acknowledge-calendar attempts are caught one rung earlier at priority 8.
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: >-
      POST /disclosure/filings/{id}/submit; POST /disclosure/filings/{id}/resubmit;
      POST /disclosure/filings/{id}/confirm; POST /disclosure/filings/{id}/reject
    error_note: >-
      Deliberately ranked BELOW priority 8 so that confirming-an-already-CONFIRMED filing
      through a terminated engagement returns ERR_INVALID_STATE_TRANSITION, not
      ERR_ENGAGEMENT_NOT_ACTIVE.

  - priority: 12
    category: business_safety
    check: >-
      Segregation of duties — preparation vs assembly: the X-User-ID assembling an
      AnnualReportCycle must not equal the attested_by_user_id of ANY non-VOID
      CycleContentItem of that cycle.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disclosure/annual-report-cycles/{id}/assemble"

  - priority: 13
    category: business_safety
    check: >-
      Segregation of duties — review vs publication: the X-User-ID posting an OfficialStatement
      must not equal its reviewed_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disclosure/official-statements/{id}/post"

  - priority: 14
    category: business_constraint
    check: >-
      Uniqueness — at most one Undertaking per issue_id. A second undertaking on the same issue
      is refused even when the first is already TERMINATED, because the terminated row still
      owns the historical failure events the lookback must find.
    error_id: ERR_UNDERTAKING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /disclosure/undertakings"

  - priority: 15
    category: business_constraint
    check: >-
      Uniqueness — one ContentRequirement per (undertaking_id, kind).
    error_id: ERR_DUPLICATE_REQUIREMENT
    http_status: 409
    applies_to: "POST /disclosure/content-requirements"

  - priority: 16
    category: business_temporal
    check: >-
      Reporting-period overlap on the same undertaking. Periods are HALF-OPEN
      [period_start_date, period_end_date): a new cycle is refused when
      new.period_start_date < existing.period_end_date AND
      existing.period_start_date < new.period_end_date, considering only existing cycles whose
      status is NOT in {WITHDRAWN, CLOSED_NOT_REQUIRED}. Exact adjacency
      (new.period_start_date == existing.period_end_date) is ALLOWED.
    error_id: ERR_REPORTING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /disclosure/annual-report-cycles"

  - priority: 17
    category: business_constraint
    check: >-
      The owning undertaking must have at least one ContentRequirement row before a cycle can
      be created; an undertaking with zero requirements has nothing to snapshot. This check runs
      BEFORE the weight-closure check at priority 18 (a cascading pair): the empty set trivially
      fails closure too, so evaluating closure first would make this error unreachable.
    error_id: ERR_NO_CONTENT_REQUIREMENTS
    http_status: 409
    applies_to: "POST /disclosure/annual-report-cycles"

  - priority: 18
    category: business_constraint
    check: >-
      Content-weight closure at cycle creation: over a requirement set already established as
      non-empty by priority 17, the sum of weight_bp over the owning undertaking's
      ContentRequirement rows must equal exactly 10000. Snapshotting a set that sums to anything
      else would make completeness_score_pct uninterpretable.
    error_id: ERR_CONTENT_WEIGHTS_UNBALANCED
    http_status: 422
    applies_to: "POST /disclosure/annual-report-cycles"

  - priority: 19
    category: business_constraint
    check: >-
      Duplicate material-event notice: no other MaterialEventNotice on the same issue_id may
      share the same event_type AND occurrence_date while its status is NOT in
      {NOT_MATERIAL, VOID}.
    error_id: ERR_DUPLICATE_EVENT_NOTICE
    http_status: 409
    applies_to: >-
      POST /disclosure/material-event-notices;
      POST /disclosure/bond-issues/{id}/rating-actions
    error_note: >-
      Ranked ABOVE the occurrence-date temporal checks at priorities 20 and 21, so a
      re-submitted stale duplicate returns ERR_DUPLICATE_EVENT_NOTICE.

  - priority: 20
    category: business_temporal
    check: >-
      occurrence_date must not lie more than EVENT_BACKDATE_MAX_DAYS = 30 calendar days before
      the logical clock's current date. Backdating further would mint a notice whose
      ten-business-day window already closed at creation.
    error_id: ERR_OCCURRENCE_DATE_STALE
    http_status: 422
    applies_to: >-
      POST /disclosure/material-event-notices;
      POST /disclosure/bond-issues/{id}/rating-actions

  - priority: 21
    category: business_temporal
    check: "occurrence_date must not be after the logical clock's current date."
    error_id: ERR_OCCURRENCE_DATE_IN_FUTURE
    http_status: 422
    applies_to: >-
      POST /disclosure/material-event-notices;
      POST /disclosure/bond-issues/{id}/rating-actions

  - priority: 22
    category: business_temporal
    check: >-
      DirectPlacement review-window overlap capacity on the same issue_id. Windows are CLOSED
      intervals [review_window_start_date, review_window_end_date] — touching endpoints DO
      overlap. At
      most MAX_CONCURRENT_PLACEMENT_REVIEWS = 2 placements whose status is NOT DISCLOSED may
      cover any single calendar date. The check is aggregate: each existing placement is
      individually legal; the third overlapping one is refused.
    error_id: ERR_PLACEMENT_REVIEW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /disclosure/direct-placements"

  - priority: 23
    category: business_constraint
    check: >-
      review_window_start_date <= review_window_end_date, and principal_amount_cents >= 1.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /disclosure/direct-placements"

  - priority: 24
    category: business_safety
    check: >-
      Attestation readiness, checked in this order: (a) source_document_ref and data_as_of_date
      are both non-null -> ERR_CONTENT_DATA_AS_OF_REQUIRED; (b) if the item's ContentRequirement
      has requires_audit_opinion == true, audit_opinion_type is non-null ->
      ERR_AUDIT_OPINION_REQUIRED. Attesting an item with a missing audited opinion would let
      unaudited numbers reach the repository.
    error_id: ERR_CONTENT_DATA_AS_OF_REQUIRED | ERR_AUDIT_OPINION_REQUIRED
    http_status: 409
    applies_to: "POST /disclosure/cycle-content-items/{id}/attest"

  - priority: 25
    category: business_safety
    check: >-
      Assembly readiness: every non-VOID CycleContentItem of the cycle must be in status READY
      or WAIVED. Any NOT_STARTED or DRAFT item blocks assembly.
    error_id: ERR_CONTENT_NOT_READY
    http_status: 409
    applies_to: "POST /disclosure/annual-report-cycles/{id}/assemble"

  - priority: 26
    category: business_safety
    check: >-
      Fileable-content floor at assembly: at least one non-VOID CycleContentItem of the cycle
      must be in status READY. A cycle whose every item is WAIVED scores
      completeness_score_pct = 100.00 yet carries no document, so it must be routed to
      CLOSED_NOT_REQUIRED instead of assembled. This is the boundary case the readiness check
      at priority 25 cannot see.
    error_id: ERR_NO_FILEABLE_CONTENT
    http_status: 409
    applies_to: "POST /disclosure/annual-report-cycles/{id}/assemble"

  - priority: 27
    category: business_referential
    check: >-
      Waivability: a CycleContentItem may be waived only when its ContentRequirement has
      waivable == true.
    error_id: ERR_REQUIREMENT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /disclosure/cycle-content-items/{id}/waive"

  - priority: 28
    category: business_referential
    check: >-
      Filing subject exclusivity and type agreement: exactly one of cycle_id,
      material_event_id, direct_placement_id is present, and it agrees with filing_type
      (ANNUAL_REPORT -> cycle_id; FAILURE_TO_FILE_NOTICE -> cycle_id;
      MATERIAL_EVENT_NOTICE -> material_event_id;
      VOLUNTARY_FINANCIAL_OBLIGATION -> direct_placement_id). The referenced subject must
      additionally be in its fileable state: cycle READY_TO_FILE (for ANNUAL_REPORT) or
      DELINQUENT (for FAILURE_TO_FILE_NOTICE), notice MATERIAL, placement
      DISCLOSURE_REQUIRED. issue_id must equal the subject's own owning issue.
      EXCEPTION for corrections: when supersedes_filing_id is present the fileable-state test is
      replaced by a discharged-state test — the subject must be cycle FILED_TIMELY|FILED_LATE,
      notice FILED_TIMELY|FILED_LATE, or placement DISCLOSED. A correction re-files a document
      the repository already holds, so its subject is by definition already discharged.
    error_id: ERR_FILING_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /disclosure/filings"

  - priority: 29
    category: business_referential
    check: >-
      Subject exclusivity: no other Filing may already carry the identical (filing_type,
      cycle_id, material_event_id, direct_placement_id) subject tuple in status DRAFT,
      SUBMITTED or CONFIRMED, unless the new filing supplies supersedes_filing_id naming that
      exact CONFIRMED filing. A DELINQUENT cycle may therefore carry both a
      FAILURE_TO_FILE_NOTICE filing and, once assembled, an ANNUAL_REPORT filing.
    error_id: ERR_SUBJECT_ALREADY_FILED
    http_status: 409
    applies_to: "POST /disclosure/filings"

  - priority: 30
    category: business_referential
    check: >-
      Supersede target validity: when supersedes_filing_id is present, the target filing must
      be status CONFIRMED, must reference the same subject id, and must not already be
      superseded (its superseded_by_filing_id must be null).
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 409
    applies_to: "POST /disclosure/filings"

  - priority: 31
    category: business_referential
    check: >-
      Remediation evidence: a FailureToFileEvent may be remediated only when
      remediation_filing_id names a Filing in status CONFIRMED whose subject belongs to the
      same undertaking as the failure event. Two arms, per the event's own subject: a
      cycle-bearing failure (event.cycle_id not null) demands filing.cycle_id ==
      event.cycle_id, because the delinquent annual report is exactly what must still be
      filed; a material-event failure (event.cycle_id null) accepts any CONFIRMED filing of
      the same undertaking, because its notice is terminally MISSED and can never be filed.
    error_id: ERR_REMEDIATION_FILING_INVALID
    http_status: 409
    applies_to: "POST /disclosure/failure-to-file-events/{id}/remediate"

  - priority: 32
    category: business_safety
    check: >-
      Official-statement disclosure adequacy: posting is refused unless
      calculations.official_statement_disclosure_lookback yields disclosure_adequacy ==
      ADEQUATE as recomputed at post time, so a failure event minted between review and
      posting blocks the posting.
    error_id: ERR_DISCLOSURE_INADEQUATE
    http_status: 409
    applies_to: "POST /disclosure/official-statements/{id}/post"

  - priority: 33
    category: business_constraint
    check: >-
      Repository confirmation payload: repository_receipt_id must be unique across all Filing
      rows (ERR_RECEIPT_ID_DUPLICATE, 409). A correcting filing — one carrying
      supersedes_filing_id — must also carry a non-empty correction_reason
      (ERR_CORRECTION_REASON_REQUIRED, 422), checked at draft creation.
    error_id: ERR_RECEIPT_ID_DUPLICATE | ERR_CORRECTION_REASON_REQUIRED
    http_status: 409
    applies_to: >-
      POST /disclosure/filings/{id}/confirm; POST /disclosure/filings

  - priority: 34
    category: business_fiscal
    check: >-
      Defeasance escrow sufficiency: escrow_deposit_cents must be >=
      outstanding_par_amount_cents of the issue being defeased. Fiscal checks run last.
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 409
    applies_to: "POST /disclosure/bond-issues/{id}/defease"

  - priority: 35
    category: business_constraint
    check: >-
      Submission-attempt ceiling: a Filing may be submitted or resubmitted at most
      MAX_SUBMISSION_ATTEMPTS = 3 times in total. The fourth attempt is refused and the filing
      stays REJECTED.
    error_id: ERR_SUBMISSION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: >-
      POST /disclosure/filings/{id}/submit; POST /disclosure/filings/{id}/resubmit

  - priority: 36
    category: business_constraint
    check: >-
      Pagination bounds on every list endpoint: limit is an integer in 1..100 (default 10, per
      response_envelope.pagination_defaults), offset is an integer >= 0 (default 0).
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 37
    category: business_referential
    check: >-
      A cycle may not be withdrawn while a Filing referencing it sits in status SUBMITTED or
      CONFIRMED — the repository already has the document, so withdrawal would drop an
      obligation the market can see.
    error_id: ERR_CYCLE_HAS_LIVE_FILING
    http_status: 409
    applies_to: "POST /disclosure/annual-report-cycles/{id}/withdraw"

  - priority: 38
    category: business_referential
    check: >-
      An engagement may not be terminated while a Filing it submitted sits in status SUBMITTED —
      only the submitting agent may carry the repository's response back, so terminating first
      would strand the filing.
    error_id: ERR_ENGAGEMENT_HAS_LIVE_FILING
    http_status: 409
    applies_to: "POST /disclosure/dissemination-engagements/{id}/terminate"

  - priority: 39
    category: business_constraint
    check: >-
      Editable-cycle gate for content preparation: the item's owning AnnualReportCycle must be
      in status DRAFTING, READY_TO_FILE or DELINQUENT — a delinquent cycle must remain editable so
      it can be cured and reassembled. A cycle that is FILING_IN_PROGRESS or terminal accepts no
      PATCH, attest, reopen or waive.
    error_id: ERR_CYCLE_NOT_EDITABLE
    http_status: 409
    applies_to: >-
      PATCH /disclosure/cycle-content-items/{id};
      POST /disclosure/cycle-content-items/{id}/attest; .../reopen; .../waive

  - priority: 40
    category: business_constraint
    check: >-
      Branch-specific required fields: the waived branch of placement classification requires a
      non-empty waiver_reason; a per-se listed event cannot be determined NOT_MATERIAL.
    error_id: ERR_WAIVER_REASON_REQUIRED | ERR_PER_SE_EVENT_IS_MATERIAL
    http_status: 422
    applies_to: >-
      POST /disclosure/direct-placements/{id}/classify;
      POST /disclosure/material-event-notices/{id}/determine

# =============================================================================
# §1.5 API Endpoint Table
#      All business paths are prefixed /disclosure. Every list endpoint accepts
#      limit? (1..100, default 10) and offset? (>= 0, default 0) and returns rows
#      ordered created_at ASC, id ASC.
# =============================================================================

endpoints:

  # ---------------------------------------------------------------------------
  # Test-driving surface (/_ namespace)
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock, which every deadline, window and sweep rule reads
      instead of wall-clock time. The clock's startup default is exactly 2026-08-01T00:00:00Z;
      before any call to this endpoint the clock reads that instant and MUST NOT fall back to
      real wall-clock time. Setting the clock does not by itself run any sweep — deadline
      consequences materialise only when POST /disclosure/calendar-sweeps is invoked.
    roles: [FinanceDirector]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "logical clock set to current_utc; no entity row is written"

  # ---------------------------------------------------------------------------
  # BondIssue
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/bond-issues"
    description: "Registers an outstanding bond issue in the issuer's disclosure inventory."
    roles: [FinanceDirector]
    code: 201
    input:
      - issuer_program_code
      - series_designation
      - security_type
      - dated_date
      - final_maturity_date
      - original_par_amount_cents
    output: BondIssue
    side_effects:
      - "status = OUTSTANDING; version = 1"
      - "outstanding_par_amount_cents initialized to original_par_amount_cents"
      - "open_material_event_count = 0 via calculations.derived_flag_bookkeeping"

  - method: GET
    path: "/disclosure/bond-issues/{id}"
    description: "Reads one bond issue, including its current version for OCC callers."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: BondIssue
    side_effects: []

  - method: GET
    path: "/disclosure/bond-issues"
    description: >-
      Lists bond issues, optionally narrowed to one credit program (the scope the
      official-statement five-year lookback walks) or one status.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["issuer_program_code?", "status?", "limit?", "offset?"]
    output: BondIssue[]
    side_effects: []

  - method: POST
    path: "/disclosure/bond-issues/{id}/defease"
    description: >-
      Records a legal or economic defeasance of the issue. Escrow must fully fund outstanding
      par (§1.4 priority 34). Fires the four-hop termination cascade declared on BondIssue
      OUTSTANDING -> DEFEASED and mints a DEFEASANCE material-event notice.
    roles: [FinanceDirector]
    code: 200
    input: [defeasance_type, escrow_deposit_cents, occurrence_date]
    output: BondIssue
    side_effects:
      - "status = DEFEASED; outstanding_par_amount_cents = 0; defeased_at = clock"
      - "increments BondIssue.version by 1"
      - "cascade hop 1: the issue's Undertaking -> TERMINATED, termination_cause = DEFEASANCE"
      - "cascade hop 2: every non-terminal AnnualReportCycle -> CLOSED_NOT_REQUIRED"
      - "cascade hop 2b: every non-TERMINATED DisseminationEngagement -> TERMINATED, termination_reason = UNDERTAKING_TERMINATED"
      - "cascade hop 3: every non-VOID CycleContentItem of those cycles -> VOID"
      - "every DETERMINATION_PENDING or MATERIAL notice on the issue -> VOID"
      - "creates one MaterialEventNotice (event_type = DEFEASANCE, status = DETERMINATION_PENDING) whose filing_deadline_date comes from calculations.material_event_filing_deadline; this notice is exempt from the VOID cascade above"
      - "recomputes calculations.undertaking_open_obligation_count, calculations.undertaking_delinquency_counters, calculations.undertaking_disclosure_risk_score, calculations.content_preparation_completeness_score, calculations.derived_flag_bookkeeping"

  - method: POST
    path: "/disclosure/bond-issues/{id}/rating-actions"
    description: >-
      Records a rating agency action on the issue. A RATING_CHANGE is a per-se listed event, so
      the action creates a MaterialEventNotice with a ten-business-day deadline in one call.
      OCC-guarded on the issue (see §1.2.1 rating-action-stale-issue).
    roles: [FinanceDirector]
    code: 201
    input: [rating_agency, prior_rating, new_rating, occurrence_date, expected_issue_version]
    output: MaterialEventNotice
    side_effects:
      - "creates MaterialEventNotice with event_type = RATING_CHANGE, per_se_material = true, status = DETERMINATION_PENDING, rating_agency / prior_rating / new_rating stamped from the payload"
      - "sets filing_deadline_date via calculations.material_event_filing_deadline"
      - "updates BondIssue.current_rating and current_rating_agency to new_rating / rating_agency"
      - "increments BondIssue.version by 1"
      - "recomputes calculations.derived_flag_bookkeeping (open_material_event_count) and calculations.undertaking_open_obligation_count"

  # ---------------------------------------------------------------------------
  # Undertaking
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/undertakings"
    description: >-
      Opens the continuing-disclosure undertaking for an outstanding issue, fixing its fiscal
      year end, its annual filing window and — decisively — which timeliness variant
      calculations.cycle_timeliness_assessment will apply to every cycle it ever owns.
    roles: [FinanceDirector]
    code: 201
    input: [issue_id, fiscal_year_end_month_day, "filing_window_days?", "timeliness_basis?"]
    output: Undertaking
    side_effects:
      - "status = ACTIVE; compliance_posture = COMPLIANT; remediation_tier = TIER_0; disclosure_risk_score = 0.00; version = 1"
      - "filing_window_days defaults to 210; timeliness_basis defaults to SUBMISSION_BASIS"
      - "all four counters (late_filing_count, missed_event_count, delinquent_cycle_count, open_obligation_count) initialized to 0; content_weight_bp_total = 0"

  - method: GET
    path: "/disclosure/undertakings/{id}"
    description: >-
      Reads one undertaking with its live risk score, remediation tier, compliance posture and
      version for OCC callers.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: Undertaking
    side_effects: []

  - method: GET
    path: "/disclosure/undertakings"
    description: "Lists undertakings; reverse-reachability for Undertaking.issue_id."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["issue_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: Undertaking[]
    side_effects: []

  - method: POST
    path: "/disclosure/undertakings/{id}/suspend"
    description: >-
      Suspends the undertaking (e.g. pending a legal opinion). Blocks new cycles, all content
      preparation and all new engagements while suspended; existing filings continue.
    roles: [FinanceDirector]
    code: 200
    input: [suspended_reason]
    output: Undertaking
    side_effects:
      - "status = SUSPENDED; suspended_reason stamped"
      - "increments Undertaking.version by 1"
      - "compliance_posture, disclosure_risk_score and all counters are left untouched — the two state dimensions move independently"

  - method: POST
    path: "/disclosure/undertakings/{id}/reinstate"
    description: "Returns a suspended undertaking to ACTIVE and clears suspended_reason."
    roles: [FinanceDirector]
    code: 200
    input: []
    output: Undertaking
    side_effects:
      - "status = ACTIVE; suspended_reason = null"
      - "increments Undertaking.version by 1"

  # ---------------------------------------------------------------------------
  # ContentRequirement (immutable config; common_fields: false)
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/content-requirements"
    description: >-
      Declares one required item of annual filing content for an undertaking, with the basis
      points of the annual report it represents. The set must sum to exactly 10000 before any
      cycle can be created (§1.4 priority 18). Immutable once created — there is no PATCH and
      no version field.
    roles: [DisclosureOfficer]
    code: 201
    input: [undertaking_id, kind, label, weight_bp, "waivable?"]
    output: ContentRequirement
    side_effects:
      - "waivable defaults to false"
      - "requires_audit_opinion computed as (kind == AUDITED_FINANCIALS) via calculations.derived_flag_bookkeeping; any supplied value is ignored"
      - "recomputes Undertaking.content_weight_bp_total via calculations.undertaking_delinquency_counters"

  - method: GET
    path: "/disclosure/content-requirements/{id}"
    description: "Reads one content requirement."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: ContentRequirement
    side_effects: []

  - method: GET
    path: "/disclosure/content-requirements"
    description: >-
      Lists content requirements; reverse-reachability for ContentRequirement.undertaking_id.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["undertaking_id?", "kind?", "limit?", "offset?"]
    output: ContentRequirement[]
    side_effects: []

  # ---------------------------------------------------------------------------
  # AnnualReportCycle
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/annual-report-cycles"
    description: >-
      Opens the reporting cycle for one fiscal period and snapshots the undertaking's content
      requirements into working items. The due date is derived once, at creation, from the
      undertaking's filing_window_days rolled forward to a business day.
    roles: [DisclosureOfficer]
    code: 201
    input: [undertaking_id, fiscal_year_label, period_start_date, period_end_date]
    output: AnnualReportCycle
    side_effects:
      - "status = DRAFTING; version = 1"
      - "due_date set via calculations.annual_report_due_date"
      - "creates one CycleContentItem per ContentRequirement of the undertaking, each status = NOT_STARTED, weight_bp_snapshot copied from the requirement's weight_bp; these rows are discoverable only via GET /disclosure/cycle-content-items?cycle_id="
      - "completeness_score_pct recomputed via calculations.content_preparation_completeness_score (0.00 at creation)"
      - "increments Undertaking.open_obligation_count via calculations.undertaking_open_obligation_count"

  - method: GET
    path: "/disclosure/annual-report-cycles/{id}"
    description: >-
      Reads one reporting cycle with its due date, completeness score, timeliness verdict and
      days_late.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: AnnualReportCycle
    side_effects: []

  - method: GET
    path: "/disclosure/annual-report-cycles"
    description: >-
      Lists reporting cycles; reverse-reachability for AnnualReportCycle.undertaking_id and
      AnnualReportCycle.filed_filing_id.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["undertaking_id?", "filed_filing_id?", "status?", "fiscal_year_label?", "limit?", "offset?"]
    output: AnnualReportCycle[]
    side_effects: []

  - method: POST
    path: "/disclosure/annual-report-cycles/{id}/assemble"
    description: >-
      Declares the annual report assembled and ready for the dissemination agent. Requires
      every non-VOID item READY or WAIVED and at least one item READY (§1.4 priorities 25–26),
      and enforces preparer/assembler segregation of duties (§1.4 priority 12). Usable from
      DRAFTING and from DELINQUENT, which is how a late cycle becomes fileable.
    roles: [DisclosureOfficer]
    code: 200
    input: []
    output: AnnualReportCycle
    side_effects:
      - "status = READY_TO_FILE; assembled_by_user_id = X-User-ID; assembled_at = clock"
      - "increments AnnualReportCycle.version by 1"
      - "recomputes completeness_score_pct via calculations.content_preparation_completeness_score"
      - "when the prior status was DELINQUENT, decrements Undertaking.delinquent_cycle_count via calculations.undertaking_delinquency_counters and re-runs calculations.undertaking_disclosure_risk_score, which can move compliance_posture off DELINQUENT"

  - method: POST
    path: "/disclosure/annual-report-cycles/{id}/withdraw"
    description: >-
      Withdraws a cycle opened in error. The compensating operation for cycle creation: it
      voids every content item and must restore Undertaking.open_obligation_count to its
      pre-creation value.
    roles: [DisclosureOfficer]
    code: 200
    input: [withdrawal_reason]
    output: AnnualReportCycle
    side_effects:
      - "status = WITHDRAWN; withdrawal_reason stamped"
      - "increments AnnualReportCycle.version by 1"
      - "cascade: every non-VOID CycleContentItem of this cycle -> VOID"
      - "recomputes completeness_score_pct (falls to 0.00 — every item is VOID and therefore out of the input set)"
      - "recomputes calculations.undertaking_open_obligation_count, restoring the pre-creation value"

  # ---------------------------------------------------------------------------
  # CycleContentItem (cascade-created only; no POST)
  # ---------------------------------------------------------------------------

  - method: GET
    path: "/disclosure/cycle-content-items/{id}"
    description: "Reads one working content item with its readiness factor and attestation stamp."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: CycleContentItem
    side_effects: []

  - method: GET
    path: "/disclosure/cycle-content-items"
    description: >-
      Lists working content items; reverse-reachability for CycleContentItem.cycle_id and
      CycleContentItem.content_requirement_id. This is the ONLY discovery channel for these
      cascade-created rows.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["cycle_id?", "content_requirement_id?", "status?", "limit?", "offset?"]
    output: CycleContentItem[]
    side_effects: []

  - method: PATCH
    path: "/disclosure/cycle-content-items/{id}"
    description: >-
      Records preparation progress on one content item — audit opinion type, as-of date, source
      document reference. Moves NOT_STARTED -> DRAFT on the first write and DRAFT -> DRAFT
      thereafter, so partial preparation is a self-loop, not an error.
    roles: [DisclosureOfficer]
    code: 200
    input: ["audit_opinion_type?", "data_as_of_date?", "source_document_ref?"]
    output: CycleContentItem
    side_effects:
      - "status = DRAFT (from NOT_STARTED or DRAFT); supplied fields overwritten, omitted fields left untouched"
      - "increments CycleContentItem.version by 1"
      - "readiness_factor recomputed to 0.5 and the cycle's completeness_score_pct recomputed via calculations.content_preparation_completeness_score"

  - method: POST
    path: "/disclosure/cycle-content-items/{id}/attest"
    description: >-
      Attests that this content item is complete and accurate. Refused when the audited-opinion
      requirement is unmet (§1.4 priority 24). The attesting X-User-ID is recorded and later
      bars that same user from assembling the cycle.
    roles: [DisclosureOfficer]
    code: 200
    input: []
    output: CycleContentItem
    side_effects:
      - "status = READY; attested_by_user_id = X-User-ID; attested_at = clock"
      - "increments CycleContentItem.version by 1"
      - "readiness_factor = 1.0; cycle completeness_score_pct recomputed"

  - method: POST
    path: "/disclosure/cycle-content-items/{id}/reopen"
    description: >-
      Reopens an attested item because the underlying data changed. Clears the attestation and,
      when the owning cycle had already reached READY_TO_FILE, drags it back to DRAFTING — the
      cyclic edge that makes assembly non-monotone.
    roles: [DisclosureOfficer]
    code: 200
    input: []
    output: CycleContentItem
    side_effects:
      - "status = DRAFT; attested_by_user_id = null; attested_at = null"
      - "increments CycleContentItem.version by 1"
      - "readiness_factor = 0.5; cycle completeness_score_pct recomputed"
      - "cascade: if the owning cycle is READY_TO_FILE it returns to DRAFTING and assembled_by_user_id / assembled_at are cleared"

  - method: POST
    path: "/disclosure/cycle-content-items/{id}/waive"
    description: >-
      Waives a content item that this undertaking is not obliged to provide. Permitted only
      when the underlying ContentRequirement is waivable (§1.4 priority 27). A waived item
      contributes its FULL weight to completeness, which is exactly why a cycle whose every
      item is waived scores 100.00 yet cannot be assembled.
    roles: [ComplianceReviewer]
    code: 200
    input: [waiver_reason]
    output: CycleContentItem
    side_effects:
      - "status = WAIVED; waiver_reason stamped"
      - "increments CycleContentItem.version by 1"
      - "readiness_factor = 1.0; cycle completeness_score_pct recomputed"

  # ---------------------------------------------------------------------------
  # MaterialEventNotice
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/material-event-notices"
    description: >-
      Opens a listed-event notice with its ten-business-day filing deadline measured from the
      occurrence date. Per-se material event types are flagged at creation but still pass
      through determination, so the ten-day clock runs while the determination is pending.
    roles: [DisclosureOfficer]
    code: 201
    input: [issue_id, event_type, occurrence_date, "financial_obligation_ref?"]
    output: MaterialEventNotice
    side_effects:
      - "status = DETERMINATION_PENDING; created_by_user_id = X-User-ID; version = 1"
      - "per_se_material and filing_deadline_date set via calculations.material_event_filing_deadline"
      - "recomputes BondIssue.open_material_event_count via calculations.derived_flag_bookkeeping and Undertaking.open_obligation_count via calculations.undertaking_open_obligation_count"

  - method: GET
    path: "/disclosure/material-event-notices/{id}"
    description: "Reads one listed-event notice with its deadline, determination and days_late."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: MaterialEventNotice
    side_effects: []

  - method: GET
    path: "/disclosure/material-event-notices"
    description: >-
      Lists listed-event notices; reverse-reachability for MaterialEventNotice.issue_id,
      MaterialEventNotice.financial_obligation_ref and MaterialEventNotice.filed_filing_id.
      Also the only discovery channel for notices minted by the defeasance, rating-action and
      placement-classification cascades.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["issue_id?", "financial_obligation_ref?", "filed_filing_id?", "status?", "event_type?", "limit?", "offset?"]
    output: MaterialEventNotice[]
    side_effects: []

  - method: POST
    path: "/disclosure/material-event-notices/{id}/determine"
    description: >-
      Records the materiality determination. The two outcomes have disjoint side effects: a
      MATERIAL determination leaves an open obligation that the ten-day window can still
      strand, while NOT_MATERIAL closes the notice terminally and releases the obligation
      without ever creating a filing.
    roles: [ComplianceReviewer]
    code: 200
    input: [determination, "determination_note?"]
    output: MaterialEventNotice
    side_effects:
      - "status = MATERIAL or NOT_MATERIAL according to determination; determined_by_user_id = X-User-ID; determined_at = clock; determination_note stamped"
      - "increments MaterialEventNotice.version by 1"
      - "on MATERIAL: the notice stays in the open set, so BondIssue.open_material_event_count and Undertaking.open_obligation_count are unchanged and the notice remains sweepable to MISSED"
      - "on NOT_MATERIAL: the notice leaves the open set, decrementing BondIssue.open_material_event_count and Undertaking.open_obligation_count, and it can never be swept to MISSED"

  # ---------------------------------------------------------------------------
  # Filing
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/filings"
    description: >-
      Drafts a submission package for exactly one subject — an assembled annual report, a
      material listed-event notice, a failure-to-file notice on a delinquent cycle, or a
      voluntary financial-obligation disclosure. OCC-guarded on the parent BondIssue (see
      §1.2.1 filing-create-stale-issue) because a defeasance landing between read and write
      voids the whole subject. Supply supersedes_filing_id to draft a correction of an already
      confirmed filing.
    roles: [DisclosureOfficer]
    code: 201
    input:
      - issue_id
      - filing_type
      - expected_issue_version
      - cycle_id?
      - material_event_id?
      - direct_placement_id?
      - supersedes_filing_id?
      - correction_reason?
    output: Filing
    side_effects:
      - "status = DRAFT; submission_attempt_count = 0; version = 1"
      - "increments BondIssue.version by 1"
      - "no subject state changes yet — the subject moves only when the draft is submitted"

  - method: GET
    path: "/disclosure/filings/{id}"
    description: >-
      Reads one filing with its submission instant, repository confirmation instant, receipt id,
      attempt count and supersede linkage.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: Filing
    side_effects: []

  - method: GET
    path: "/disclosure/filings"
    description: >-
      Lists filings; reverse-reachability for Filing.issue_id, cycle_id, material_event_id,
      direct_placement_id, supersedes_filing_id, superseded_by_filing_id and
      submitting_engagement_id.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input:
      - issue_id?
      - cycle_id?
      - material_event_id?
      - direct_placement_id?
      - supersedes_filing_id?
      - superseded_by_filing_id?
      - submitting_engagement_id?
      - filing_type?
      - status?
      - limit?
      - offset?
    output: Filing[]
    side_effects: []

  - method: POST
    path: "/disclosure/filings/{id}/submit"
    description: >-
      The dissemination agent hands the draft to the central repository. Stamps submitted_at
      from the logical clock — the instant SUBMISSION_BASIS timeliness measures — and moves the
      subject into its in-progress state. Bounded by MAX_SUBMISSION_ATTEMPTS = 3 (§1.4
      priority 35).
    roles: [DisseminationAgent]
    code: 200
    input: []
    output: Filing
    side_effects:
      - "status = SUBMITTED; submitted_at = clock; submitted_by_user_id = X-User-ID; submitting_engagement_id resolved from X-User-ID"
      - "increments Filing.version by 1; increments submission_attempt_count via calculations.derived_flag_bookkeeping"
      - "cascade: subject AnnualReportCycle READY_TO_FILE -> FILING_IN_PROGRESS, or subject MaterialEventNotice MATERIAL -> FILING_IN_PROGRESS"
      - "correcting filings (supersedes_filing_id set) leave the subject's status untouched — the subject is already discharged"

  - method: POST
    path: "/disclosure/filings/{id}/resubmit"
    description: >-
      Resubmits a filing the repository rejected, after the correction described by
      rejection_reason was made. Overwrites submitted_at with the new instant, so the earlier
      rejected attempt never counts for timeliness — the reason a rejection cycle can push a
      previously timely filing past its deadline.
    roles: [DisseminationAgent]
    code: 200
    input: [correction_reason]
    output: Filing
    side_effects:
      - "status = SUBMITTED; submitted_at = clock (overwriting the prior value); rejection_reason = null"
      - "increments Filing.version by 1; increments submission_attempt_count via calculations.derived_flag_bookkeeping"
      - "cascade: subject AnnualReportCycle READY_TO_FILE -> FILING_IN_PROGRESS, or subject MaterialEventNotice MATERIAL -> FILING_IN_PROGRESS"

  - method: POST
    path: "/disclosure/filings/{id}/reject"
    description: >-
      Records a rejection returned by the central repository, sending the subject back to its
      pre-submission state so it can be corrected and resubmitted.
    roles: [DisseminationAgent]
    code: 200
    input: [rejection_reason]
    output: Filing
    side_effects:
      - "status = REJECTED; rejection_reason stamped"
      - "increments Filing.version by 1"
      - "cascade: subject AnnualReportCycle FILING_IN_PROGRESS -> READY_TO_FILE, or subject MaterialEventNotice FILING_IN_PROGRESS -> MATERIAL"

  - method: POST
    path: "/disclosure/filings/{id}/confirm"
    description: >-
      Records the central repository's confirmation, with its receipt id. This is the single
      most consequential call in the domain: it runs the timeliness variant, discharges or
      strands the subject, can mint a FailureToFileEvent, re-scores the undertaking, re-invoices
      the agent, supersedes any corrected predecessor, and can flip a pending official
      statement's disclosure adequacy.
    roles: [DisseminationAgent]
    code: 200
    input: [repository_receipt_id]
    output: Filing
    side_effects:
      - "status = CONFIRMED; repository_confirmed_at = clock; repository_receipt_id stamped"
      - "increments Filing.version by 1"
      - "cascade hop 1 (ANNUAL_REPORT): runs calculations.cycle_timeliness_assessment, moving the cycle FILING_IN_PROGRESS -> FILED_TIMELY or -> FILED_LATE and writing filed_at, days_late, timeliness_basis_applied and filed_filing_id"
      - "cascade hop 1 (MATERIAL_EVENT_NOTICE): the notice moves FILING_IN_PROGRESS -> FILED_TIMELY when date_part(submitted_at) <= filing_deadline_date, else -> FILED_LATE with days_late from calculations.failure_severity_and_days_late; filed_filing_id stamped"
      - "cascade hop 1 (VOLUNTARY_FINANCIAL_OBLIGATION): the placement moves DISCLOSURE_REQUIRED -> DISCLOSED"
      - "cascade hop 1 is SKIPPED entirely for a correcting filing (supersedes_filing_id set): the timeliness branch does not re-run, the subject's status, filed_at, days_late and timeliness_basis_applied are unchanged, and no new FailureToFileEvent is minted"
      - "cascade hop 2 (only when hop 1 produced FILED_LATE): creates a FailureToFileEvent with kind ANNUAL_REPORT_LATE or MATERIAL_EVENT_MISSED, occurred_at = the missed deadline date, status = OPEN, and days_late / severity from calculations.failure_severity_and_days_late"
      - "cascade hop 3: recomputes calculations.undertaking_delinquency_counters, then calculations.undertaking_disclosure_risk_score, which may move compliance_posture"
      - "cascade hop 4: recomputes calculations.dissemination_agent_invoice for the submitting engagement — billable_filing_count and invoice_total_cents, the latter sensitive to the posture written in hop 3"
      - "cascade hop 5: any OfficialStatement in status COMPLIANCE_REVIEW whose issue shares the failure event's issuer_program_code has calculations.official_statement_disclosure_lookback re-run, which can flip disclosure_adequacy to INCOMPLETE"
      - "supersede: when supersedes_filing_id is set, the target filing moves CONFIRMED -> SUPERSEDED, its superseded_by_filing_id is stamped, the subject's filed_filing_id is repointed to this filing, and the engagement's billable_filing_count is left unchanged because the target is no longer CONFIRMED"
      - "recomputes calculations.undertaking_open_obligation_count and calculations.derived_flag_bookkeeping"

  # ---------------------------------------------------------------------------
  # FailureToFileEvent (cascade-created only; no POST)
  # ---------------------------------------------------------------------------

  - method: GET
    path: "/disclosure/failure-to-file-events/{id}"
    description: >-
      Reads one failure-to-file event with its kind, occurred_at, days_late, severity,
      remediation state and the official statements that have disclosed it.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: FailureToFileEvent
    side_effects: []

  - method: GET
    path: "/disclosure/failure-to-file-events"
    description: >-
      Lists failure-to-file events; reverse-reachability for FailureToFileEvent.undertaking_id,
      cycle_id, material_event_id and remediation_filing_id. The only discovery channel for
      these cascade-created rows, and the list a drafter walks to populate an official
      statement's disclosed_event_ids.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["undertaking_id?", "cycle_id?", "material_event_id?", "remediation_filing_id?", "kind?", "status?", "severity?", "limit?", "offset?"]
    output: FailureToFileEvent[]
    side_effects: []

  - method: POST
    path: "/disclosure/failure-to-file-events/{id}/remediate"
    description: >-
      Closes a failure-to-file event against a CONFIRMED filing offered as evidence (§1.4
      priority 31) and records the remediation policy note. Remediation does NOT erase the
      history: late_filing_count and missed_event_count are monotone, so the undertaking's risk
      score does not fall, and the event still appears in a STRICT_FIVE_YEAR lookback.
    roles: [DisclosureOfficer]
    code: 200
    input: [remediation_filing_id, remediation_note]
    output: FailureToFileEvent
    side_effects:
      - "status = REMEDIATED; remediated_at = clock; remediation_filing_id and remediation_note stamped"
      - "increments FailureToFileEvent.version by 1"
      - "no change to Undertaking.late_filing_count, missed_event_count, disclosure_risk_score or remediation_tier"
      - "any OfficialStatement in status COMPLIANCE_REVIEW with lookback_policy = REMEDIATED_EXCLUDED and a dated_date after remediated_at has calculations.official_statement_disclosure_lookback re-run, which can shrink required_disclosure_event_count and flip disclosure_adequacy to ADEQUATE"

  # ---------------------------------------------------------------------------
  # DirectPlacement
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/direct-placements"
    description: >-
      Records a bank loan or direct placement incurred against the issue, with the review window
      during which the finance office assesses whether it is a material financial obligation.
      The materiality ratio is frozen against outstanding par at creation. Review capacity on
      the issue is aggregate, not per-placement (§1.4 priority 22).
    roles: [DisclosureOfficer]
    code: 201
    input:
      - issue_id
      - lender_name
      - principal_amount_cents
      - execution_date
      - review_window_start_date
      - review_window_end_date
      - disclosure_practice
    output: DirectPlacement
    side_effects:
      - "status = RECEIVED; version = 1"
      - "materiality_ratio_bp set via calculations.direct_placement_materiality_ratio"

  - method: GET
    path: "/disclosure/direct-placements/{id}"
    description: "Reads one direct placement with its frozen materiality ratio and linked notice."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: DirectPlacement
    side_effects: []

  - method: GET
    path: "/disclosure/direct-placements"
    description: >-
      Lists direct placements; reverse-reachability for DirectPlacement.issue_id and
      DirectPlacement.linked_notice_id.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["issue_id?", "linked_notice_id?", "status?", "disclosure_practice?", "limit?", "offset?"]
    output: DirectPlacement[]
    side_effects: []

  - method: POST
    path: "/disclosure/direct-placements/{id}/classify"
    description: >-
      Classifies the placement against the 500 bp materiality boundary and the issuer's stated
      disclosure practice. A DISCLOSURE_REQUIRED outcome mints a FINANCIAL_OBLIGATION_INCURRENCE
      notice with its own ten-business-day deadline; a waived outcome does not, and requires a
      waiver_reason.
    roles: [ComplianceReviewer]
    code: 200
    input: ["waiver_reason?"]
    output: DirectPlacement
    side_effects:
      - "status = DISCLOSURE_REQUIRED when materiality_ratio_bp >= 500 OR disclosure_practice == MANDATORY_MATERIAL_EVENT; otherwise DISCLOSURE_WAIVED with waiver_reason stamped"
      - "increments DirectPlacement.version by 1"
      - "on DISCLOSURE_REQUIRED: creates a MaterialEventNotice (event_type = FINANCIAL_OBLIGATION_INCURRENCE, status = DETERMINATION_PENDING, occurrence_date = the placement's execution_date, financial_obligation_ref = this placement) via calculations.material_event_filing_deadline, stamps linked_notice_id, and recomputes BondIssue.open_material_event_count and Undertaking.open_obligation_count"
      - "on DISCLOSURE_WAIVED: no notice is created and no counter moves — the terminal waived branch has strictly disjoint side effects"

  # ---------------------------------------------------------------------------
  # OfficialStatement
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/official-statements"
    description: >-
      Drafts the official statement for a new issue and declares which lookback policy governs
      its failure-to-file disclosure. disclosed_event_ids is the drafter's assertion of what the
      document actually says; adequacy is judged against it at review and again at posting.
    roles: [DisclosureOfficer]
    code: 201
    input: [issue_id, dated_date, "lookback_policy?", "disclosed_event_ids?"]
    output: OfficialStatement
    side_effects:
      - "status = DRAFT; version = 1"
      - "lookback_policy defaults to STRICT_FIVE_YEAR; disclosed_event_ids defaults to []"
      - "disclosure_adequacy = UNKNOWN; required_disclosure_event_ids = []; required_disclosure_event_count = 0 — the lookback does not run until compliance review"

  - method: GET
    path: "/disclosure/official-statements/{id}"
    description: >-
      Reads one official statement with its computed required-disclosure set, count and adequacy
      verdict.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: []

  - method: GET
    path: "/disclosure/official-statements"
    description: "Lists official statements; reverse-reachability for OfficialStatement.issue_id."
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["issue_id?", "status?", "lookback_policy?", "limit?", "offset?"]
    output: OfficialStatement[]
    side_effects: []

  - method: POST
    path: "/disclosure/official-statements/{id}/compliance-review"
    description: >-
      Runs the five-year failure-to-file lookback across every issue in the same credit program
      and records the adequacy verdict. Repeatable as a self-loop: the reviewer amends
      disclosed_event_ids or switches lookback_policy and re-reviews until adequacy is ADEQUATE.
    roles: [ComplianceReviewer]
    code: 200
    input: ["disclosed_event_ids?", "lookback_policy?"]
    output: OfficialStatement
    side_effects:
      - "status = COMPLIANCE_REVIEW (from DRAFT, or self-loop from COMPLIANCE_REVIEW)"
      - "supplied disclosed_event_ids / lookback_policy overwrite the stored values; omitted keys leave them untouched"
      - "runs calculations.official_statement_disclosure_lookback, writing required_disclosure_event_ids, required_disclosure_event_count and disclosure_adequacy"
      - "reviewed_by_user_id = X-User-ID (overwritten on every self-loop); reviewed_at = clock"
      - "increments OfficialStatement.version by 1"
      - "stamps this statement's id into disclosed_in_official_statement_ids of every FailureToFileEvent in required_disclosure_event_ids that also appears in disclosed_event_ids"

  - method: POST
    path: "/disclosure/official-statements/{id}/post"
    description: >-
      Posts the official statement. The lookback is re-run at post time, so a failure event
      minted between review and posting blocks the post (§1.4 priority 32), and the reviewer may
      not also be the poster (§1.4 priority 13).
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: OfficialStatement
    side_effects:
      - "re-runs calculations.official_statement_disclosure_lookback before the transition"
      - "status = POSTED; posted_by_user_id = X-User-ID; posted_at = clock"
      - "increments OfficialStatement.version by 1"

  # ---------------------------------------------------------------------------
  # DisseminationEngagement
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/dissemination-engagements"
    description: >-
      Engages a dissemination agent for the undertaking's filing calendar. Creating a newer
      engagement supersedes the incumbent rather than colliding with it. OCC-guarded on the
      parent Undertaking (see §1.2.1 engagement-create-stale-undertaking): a suspension or
      termination landing between read and write must not be overwritten. The engagement's id is
      the DisseminationAgent role's X-User-ID.
    roles: [FinanceDirector]
    code: 201
    input:
      - undertaking_id
      - agent_name
      - effective_date
      - expiration_date
      - retainer_cents
      - expected_undertaking_version
      - last_calendar_ack_date?
    output: DisseminationEngagement
    side_effects:
      - "status = ACTIVE; billable_filing_count = 0; version = 1"
      - "invoice_total_cents set via calculations.dissemination_agent_invoice (the MIN_ANNUAL_FEE_CENTS floor applies immediately)"
      - "monitoring_lapse_days set via calculations.engagement_monitoring_lapse"
      - "increments Undertaking.version by 1"
      - "cascade: any other non-TERMINATED engagement on the same undertaking -> TERMINATED with termination_reason = SUPERSEDED and superseded_by_engagement_id pointing at this new row; its invoice_total_cents freezes at its final value"

  - method: GET
    path: "/disclosure/dissemination-engagements/{id}"
    description: >-
      Reads one engagement with its monitoring lapse, billable filing count and current invoice
      total.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: []
    output: DisseminationEngagement
    side_effects: []

  - method: GET
    path: "/disclosure/dissemination-engagements"
    description: >-
      Lists engagements; reverse-reachability for DisseminationEngagement.undertaking_id and
      DisseminationEngagement.superseded_by_engagement_id.
    roles: [FinanceDirector, DisclosureOfficer, ComplianceReviewer, DisseminationAgent]
    code: 200
    input: ["undertaking_id?", "superseded_by_engagement_id?", "status?", "limit?", "offset?"]
    output: DisseminationEngagement[]
    side_effects: []

  - method: POST
    path: "/disclosure/dissemination-engagements/{id}/acknowledge-calendar"
    description: >-
      The agent acknowledges monitoring the filing calendar through last_calendar_ack_date. From
      ACTIVE this is a self-loop that resets the lapse clock; from SUSPENDED it is the cure that
      restores the engagement to ACTIVE and re-enables submissions.
    roles: [DisseminationAgent]
    code: 200
    input: [last_calendar_ack_date]
    output: DisseminationEngagement
    side_effects:
      - "last_calendar_ack_date stamped; monitoring_lapse_days recomputed via calculations.engagement_monitoring_lapse"
      - "status = ACTIVE (self-loop from ACTIVE, or cure from SUSPENDED)"
      - "increments DisseminationEngagement.version by 1"

  - method: POST
    path: "/disclosure/dissemination-engagements/{id}/terminate"
    description: >-
      Terminates the engagement at the issuer's direction, freezing its invoice total. In-flight
      filings the agent already submitted remain resolvable only through the state machine's own
      precondition ladder — see §1.4 priorities 8 and 11.
    roles: [FinanceDirector]
    code: 200
    input: []
    output: DisseminationEngagement
    side_effects:
      - "status = TERMINATED; termination_reason = ISSUER_TERMINATED"
      - "increments DisseminationEngagement.version by 1"
      - "invoice_total_cents frozen — calculations.dissemination_agent_invoice is never re-run for a TERMINATED engagement"

  # ---------------------------------------------------------------------------
  # Calendar sweep (ops-run checkpoint)
  # ---------------------------------------------------------------------------

  - method: POST
    path: "/disclosure/calendar-sweeps"
    description: >-
      The dated ops run that turns elapsed time into consequences. Steps execute in the pinned
      order 1..5 and each step iterates its candidate rows created_at ASC, id ASC. Step 1 —
      every OUTSTANDING BondIssue whose final_maturity_date < clock date moves to MATURED with
      the full termination cascade. Step 2 — every AnnualReportCycle in DRAFTING or
      READY_TO_FILE whose due_date < clock date moves to DELINQUENT. Step 3 — every
      MaterialEventNotice in MATERIAL whose filing_deadline_date < clock date moves to MISSED
      and mints a MATERIAL_EVENT_MISSED FailureToFileEvent. Step 4 — every ACTIVE
      DisseminationEngagement whose monitoring_lapse_days > 45 moves to SUSPENDED. Step 5 —
      calculations.undertaking_delinquency_counters, then
      calculations.undertaking_disclosure_risk_score, then
      calculations.dissemination_agent_invoice run once per touched undertaking. Ordering is
      load-bearing: an issue matured in step 1 has already closed its cycles, so step 2 cannot
      also mark them delinquent.
    roles: [FinanceDirector]
    code: 200
    input: []
    output:
      swept_at: datetime
      matured_issue_count: integer
      delinquent_cycle_count: integer
      missed_event_count: integer
      suspended_engagement_count: integer
      failure_event_created_count: integer
    side_effects:
      - "step 1: BondIssue OUTSTANDING -> MATURED (outstanding_par_amount_cents = 0), with the same hop 1/2/2b/3 termination cascade as defeasance and termination_cause = MATURITY"
      - "step 2: AnnualReportCycle DRAFTING|READY_TO_FILE -> DELINQUENT (assembled_by_user_id and assembled_at cleared)"
      - "step 3: MaterialEventNotice MATERIAL -> MISSED, plus one FailureToFileEvent per missed notice (kind = MATERIAL_EVENT_MISSED, occurred_at = the notice's filing_deadline_date, severity = MAJOR)"
      - "step 4: DisseminationEngagement ACTIVE -> SUSPENDED once monitoring_lapse_days exceeds 45"
      - "step 5: recomputes calculations.undertaking_delinquency_counters, calculations.undertaking_disclosure_risk_score, calculations.undertaking_open_obligation_count, calculations.dissemination_agent_invoice and calculations.derived_flag_bookkeeping for every undertaking touched by steps 1–4"
      - "idempotent for a fixed clock: a second sweep at the same clock instant finds no candidates and returns all five counts as 0"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- authentication / authorization -----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing, not one of the four declared roles, or X-User-ID missing/empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles in §1.5"
  - id: ERR_AGENT_NOT_ENGAGED
    http: 403
    condition: >-
      acting as DisseminationAgent with an X-User-ID that is not the engagement this request
      belongs to — not the submitting engagement of the filing, not the undertaking's engagement
      at submit time, or not the {id} path segment on acknowledge-calendar
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: >-
      the assembling user attested one of the cycle's own content items, or the posting user is
      the official statement's reviewed_by_user_id

  # --- existence ---------------------------------------------------------------
  - id: ERR_ISSUE_NOT_FOUND
    http: 404
    condition: "path {id} or body issue_id does not resolve to a BondIssue"
  - id: ERR_UNDERTAKING_NOT_FOUND
    http: 404
    condition: "path {id} or body undertaking_id does not resolve to an Undertaking"
  - id: ERR_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "path {id} or body content_requirement_id does not resolve to a ContentRequirement"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "path {id} or body cycle_id does not resolve to an AnnualReportCycle"
  - id: ERR_CONTENT_ITEM_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a CycleContentItem"
  - id: ERR_EVENT_NOTICE_NOT_FOUND
    http: 404
    condition: "path {id} or body material_event_id does not resolve to a MaterialEventNotice"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: >-
      path {id}, body supersedes_filing_id, or body remediation_filing_id does not resolve to a
      Filing
  - id: ERR_FAILURE_EVENT_NOT_FOUND
    http: 404
    condition: >-
      path {id} does not resolve to a FailureToFileEvent, or an id inside disclosed_event_ids
      does not resolve to one
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "path {id} or body direct_placement_id does not resolve to a DirectPlacement"
  - id: ERR_OFFICIAL_STATEMENT_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to an OfficialStatement"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a DisseminationEngagement"

  # --- request shape -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: >-
      a required input is absent, an enum value is outside its declared set, an integer is
      negative where forbidden, a date is not ISO-8601, period_start_date >= period_end_date,
      review_window_start_date > review_window_end_date, weight_bp outside 1..10000, or
      disclosed_event_ids contains duplicates
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100, or offset negative, on any list endpoint"

  # --- optimistic concurrency (§1.2.1) ----------------------------------------
  - id: ERR_ISSUE_VERSION_STALE
    http: 412
    condition: >-
      expected_issue_version does not equal BondIssue.version on POST /disclosure/filings or
      POST /disclosure/bond-issues/{id}/rating-actions
  - id: ERR_UNDERTAKING_VERSION_STALE
    http: 412
    condition: >-
      expected_undertaking_version does not equal Undertaking.version on
      POST /disclosure/dissemination-engagements

  # --- state -------------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: >-
      the target row's own status has no edge in §1.2 for the requested trigger — submitting a
      filing that is not DRAFT, confirming or rejecting one that is not SUBMITTED, resubmitting
      one that is not REJECTED, determining a notice that is not DETERMINATION_PENDING,
      classifying a placement that is not RECEIVED, assembling a cycle that is not DRAFTING or
      DELINQUENT, withdrawing a cycle that is not DRAFTING or READY_TO_FILE, posting an official
      statement that is not COMPLIANCE_REVIEW, reinstating an undertaking that is not SUSPENDED,
      remediating a failure event that is already REMEDIATED, or acting on any terminal row
  - id: ERR_ISSUE_NOT_OUTSTANDING
    http: 409
    condition: "the owning BondIssue is DEFEASED or MATURED"
  - id: ERR_UNDERTAKING_NOT_ACTIVE
    http: 409
    condition: "the owning Undertaking is SUSPENDED or TERMINATED"
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: >-
      the acting DisseminationEngagement is SUSPENDED or TERMINATED on submit, resubmit, confirm
      or reject, or is already TERMINATED on terminate
  - id: ERR_CYCLE_NOT_EDITABLE
    http: 409
    condition: >-
      content preparation attempted on an item whose cycle is FILING_IN_PROGRESS or terminal
  - id: ERR_CYCLE_HAS_LIVE_FILING
    http: 409
    condition: "withdraw attempted while a Filing on that cycle is SUBMITTED or CONFIRMED"
  - id: ERR_ENGAGEMENT_HAS_LIVE_FILING
    http: 409
    condition: "terminate attempted while a Filing that engagement submitted is still SUBMITTED"

  # --- uniqueness / duplication ------------------------------------------------
  - id: ERR_UNDERTAKING_ALREADY_EXISTS
    http: 409
    condition: "a second Undertaking on the same issue_id, in any status"
  - id: ERR_DUPLICATE_REQUIREMENT
    http: 409
    condition: "a second ContentRequirement with the same (undertaking_id, kind)"
  - id: ERR_DUPLICATE_EVENT_NOTICE
    http: 409
    condition: >-
      another MaterialEventNotice on the same issue_id shares the same (event_type,
      occurrence_date) and its status is not NOT_MATERIAL or VOID
  - id: ERR_SUBJECT_ALREADY_FILED
    http: 409
    condition: >-
      another Filing already carries the identical (filing_type, cycle_id, material_event_id,
      direct_placement_id) subject tuple in DRAFT, SUBMITTED or CONFIRMED, without a matching
      supersedes_filing_id
  - id: ERR_RECEIPT_ID_DUPLICATE
    http: 409
    condition: "repository_receipt_id already recorded on another Filing"

  # --- content / assembly ------------------------------------------------------
  - id: ERR_NO_CONTENT_REQUIREMENTS
    http: 409
    condition: "cycle creation on an undertaking with zero ContentRequirement rows"
  - id: ERR_CONTENT_WEIGHTS_UNBALANCED
    http: 422
    condition: "the undertaking's ContentRequirement weight_bp values do not sum to exactly 10000"
  - id: ERR_CONTENT_NOT_READY
    http: 409
    condition: "assemble attempted while some non-VOID item is NOT_STARTED or DRAFT"
  - id: ERR_NO_FILEABLE_CONTENT
    http: 409
    condition: >-
      assemble attempted on a cycle whose every non-VOID item is WAIVED — completeness reads
      100.00 but there is no document to file
  - id: ERR_CONTENT_DATA_AS_OF_REQUIRED
    http: 409
    condition: "attest attempted with source_document_ref or data_as_of_date still null"
  - id: ERR_AUDIT_OPINION_REQUIRED
    http: 409
    condition: >-
      attest attempted on an item whose ContentRequirement has requires_audit_opinion == true
      while audit_opinion_type is null
  - id: ERR_REQUIREMENT_NOT_WAIVABLE
    http: 409
    condition: "waive attempted on an item whose ContentRequirement has waivable == false"
  - id: ERR_WAIVER_REASON_REQUIRED
    http: 422
    condition: "the waived branch of placement classification was reached without a waiver_reason"

  # --- temporal ----------------------------------------------------------------
  - id: ERR_REPORTING_PERIOD_OVERLAP
    http: 409
    condition: >-
      the requested [period_start_date, period_end_date) half-open interval overlaps a
      non-WITHDRAWN, non-CLOSED_NOT_REQUIRED cycle of the same undertaking; exact adjacency is
      allowed
  - id: ERR_OCCURRENCE_DATE_STALE
    http: 422
    condition: "occurrence_date is more than 30 calendar days before the logical clock's date"
  - id: ERR_OCCURRENCE_DATE_IN_FUTURE
    http: 422
    condition: "occurrence_date is after the logical clock's date"
  - id: ERR_PLACEMENT_REVIEW_CAPACITY_EXCEEDED
    http: 409
    condition: >-
      a third not-yet-DISCLOSED DirectPlacement on the same issue would cover a calendar date
      already covered by two others; windows are closed intervals, so touching endpoints count
  - id: ERR_ACK_DATE_OUT_OF_RANGE
    http: 422
    condition: >-
      last_calendar_ack_date is before engagement.effective_date or after the logical clock's
      date

  # --- filing referential ------------------------------------------------------
  - id: ERR_FILING_SUBJECT_MISMATCH
    http: 422
    condition: >-
      the filing's subject fields do not match its filing_type, more than one subject field is
      present, issue_id disagrees with the subject's owning issue, the subject is not in its
      fileable state (cycle READY_TO_FILE / DELINQUENT, notice MATERIAL, placement
      DISCLOSURE_REQUIRED), or — for a correcting filing — the subject is not in a discharged
      state (cycle or notice FILED_TIMELY / FILED_LATE, placement DISCLOSED)
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 409
    condition: >-
      supersedes_filing_id names a filing that is not CONFIRMED, carries a different subject
      tuple, or is already superseded
  - id: ERR_CORRECTION_REASON_REQUIRED
    http: 422
    condition: "supersedes_filing_id supplied without a correction_reason"
  - id: ERR_SUBMISSION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a fourth submit/resubmit on the same filing"
  - id: ERR_REMEDIATION_FILING_INVALID
    http: 409
    condition: >-
      remediation_filing_id names a filing that is not CONFIRMED or whose subject belongs to a
      different undertaking than the failure event

  # --- disclosure / determination ---------------------------------------------
  - id: ERR_DISCLOSURE_INADEQUATE
    http: 409
    condition: >-
      the lookback re-run at post time finds a required FailureToFileEvent absent from
      disclosed_event_ids
  - id: ERR_PER_SE_EVENT_IS_MATERIAL
    http: 422
    condition: >-
      a NOT_MATERIAL determination attempted on a notice whose per_se_material is true

  # --- fiscal ------------------------------------------------------------------
  - id: ERR_ESCROW_INSUFFICIENT
    http: 409
    condition: "escrow_deposit_cents is less than the issue's outstanding_par_amount_cents"

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
# Two same-user prohibitions are enforced beyond the role gate, both keyed on
# X-User-ID (§1.4 priorities 12 and 13):
#   (1) preparation vs assembly — the user that attested any content item of a
#       cycle may not assemble that cycle;
#   (2) review vs publication — the user that reviewed an official statement may
#       not post it.
# Both are same-role prohibitions, so no role hierarchy can satisfy them; every
# test that exercises them must supply two distinct X-User-ID values for the same
# X-User-Role.

roles:

  - name: FinanceDirector
    description: >-
      The issuer's finance office principal. Owns the debt inventory and the undertaking
      register, signs off on defeasance and rating actions, engages and terminates dissemination
      agents, and runs the dated calendar sweep. Cannot prepare or attest content, cannot
      determine materiality, and cannot submit to the repository.
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosure/bond-issues"
      - "POST /disclosure/bond-issues/{id}/defease"
      - "POST /disclosure/bond-issues/{id}/rating-actions"
      - "POST /disclosure/undertakings"
      - "POST /disclosure/undertakings/{id}/suspend"
      - "POST /disclosure/undertakings/{id}/reinstate"
      - "POST /disclosure/dissemination-engagements"
      - "POST /disclosure/dissemination-engagements/{id}/terminate"
      - "POST /disclosure/calendar-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET single-resource and GET list endpoint under /disclosure"

  - name: DisclosureOfficer
    description: >-
      The preparer. Declares the undertaking's required content, opens and withdraws reporting
      cycles, prepares and attests content items, opens listed-event notices and direct
      placements, drafts filings and official statements, and closes failure-to-file events with
      remediation evidence. Cannot determine materiality, cannot waive content, cannot review or
      post an official statement, and cannot submit to the repository.
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosure/content-requirements"
      - "POST /disclosure/annual-report-cycles"
      - "POST /disclosure/annual-report-cycles/{id}/assemble"
      - "POST /disclosure/annual-report-cycles/{id}/withdraw"
      - "PATCH /disclosure/cycle-content-items/{id}"
      - "POST /disclosure/cycle-content-items/{id}/attest"
      - "POST /disclosure/cycle-content-items/{id}/reopen"
      - "POST /disclosure/material-event-notices"
      - "POST /disclosure/filings"
      - "POST /disclosure/failure-to-file-events/{id}/remediate"
      - "POST /disclosure/direct-placements"
      - "POST /disclosure/official-statements"
    shared_operations:
      - "every GET single-resource and GET list endpoint under /disclosure"

  - name: ComplianceReviewer
    description: >-
      The independent compliance function. Judges materiality of listed events, waives content
      the undertaking is not obliged to provide, classifies direct placements against the
      materiality boundary, and runs and posts the official-statement failure-to-file review.
      Cannot open or prepare anything, and cannot submit to the repository.
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosure/cycle-content-items/{id}/waive"
      - "POST /disclosure/material-event-notices/{id}/determine"
      - "POST /disclosure/direct-placements/{id}/classify"
      - "POST /disclosure/official-statements/{id}/compliance-review"
      - "POST /disclosure/official-statements/{id}/post"
    shared_operations:
      - "every GET single-resource and GET list endpoint under /disclosure"

  - name: DisseminationAgent
    description: >-
      The engaged dissemination agent. The ONLY role that may touch the central repository:
      submits, resubmits, and carries the repository's confirmation or rejection back. Also
      acknowledges the filing calendar it is engaged to monitor. X-User-ID is the id of the
      DisseminationEngagement row, which is how §1.4 priority 6 decides whether this agent is
      engaged for the resource in hand.
    identity: "entity_backed:DisseminationEngagement"
    exclusive_operations:
      - "POST /disclosure/filings/{id}/submit"
      - "POST /disclosure/filings/{id}/resubmit"
      - "POST /disclosure/filings/{id}/confirm"
      - "POST /disclosure/filings/{id}/reject"
      - "POST /disclosure/dissemination-engagements/{id}/acknowledge-calendar"
    shared_operations:
      - "every GET single-resource and GET list endpoint under /disclosure"
