  - section: rbac
    instances:

      - name: only_the_named_role_may_act_and_every_other_role_is_unauthorized
        claim_type: exclusive_operations
        grounds:
          - validations.priority_2
          - roles
          - endpoints.POST_parcels_parcel_id_pre_event_value
          - endpoints.POST_mitigation_projects_project_id_approve
        distinguishing_aspect: |
          Four write endpoints each name exactly one role, and the roles are not nested: a
          ProgramAdministrator - the most powerful actor in the program - cannot set a pre-event value
          or file a monitoring finding, while a StaffAppraiser cannot approve the project that its own
          appraisal depends on. Every refusal is ERR_UNAUTHORIZED at priority 2, so it outranks the
          state and business checks the same call would otherwise trip.
        test_recipe:
          setup:
            - "One SUBMITTED MitigationProject with a validated BCA and one parcel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
