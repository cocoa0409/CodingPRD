      - name: recurring_grant_closed_adjacency_collides
        grounds:
          - calculations.recurring_grant_window_overlap
          - validations[priority=16]
          - entities.GrantRecommendation.fields.effective_from_quarter
          - endpoints.POST /daf/grants/{grantId}/schedule
        distinguishing_aspect: |
          CLOSED interval semantics (opposite adjacency rule) on the (account,charity) resource:
          scheduling a RECURRING grant [5,7] collides with an already-SCHEDULED RECURRING grant
          [3,5] because they share boundary quarter 5 (f1<=t2 AND f2<=t1), returning
          ERR_RECURRING_GRANT_OVERLAP — touching boundaries DO collide, unlike nav_period_overlap.
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE DonorAccount funded 1000000 cash; one SCHEDULED RECURRING grant [3,5] of 100000 cents to the charity; a second APPROVED RECURRING grant [5,7] of 100000 cents to the same charity awaiting schedule."
