scenario: |
  Ambient Clinical Documentation Capture & Physician Attestation (Nuance DAX): patient consent to ambient recording with room signage and opt-out handling, audio capture and speaker separation in multi-party encounters, draft note generation mapped into the encounter's note template and discrete fields, physician review, editing and attestation before the note enters the legal record, quality assurance sampling and specialty-specific model tuning, integration with orders, diagnoses and billing code suggestions that require clinician confirmation, audio retention and deletion policies with protected health information safeguards, adoption measurement on documentation time and after-hours charting

domain_name: ambient-clinical-documentation
api_prefix: /ambient-clinical-documentation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; unique across all patients"
        constraints: "required; unique"
      - name: full_name
        type: string
        source: input
        description: "Patient full legal name"
        constraints: "required; non-empty"
      - name: default_ambient_opt_in
        type: boolean
        source: input
        description: "Patient-level default preference for ambient recording; informational only, every encounter still requires an explicit AmbientConsent"
        default: true

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier; unique"
        constraints: "required; unique"
      - name: full_name
        type: string
        source: input
        description: "Physician full name"
        constraints: "required; non-empty"
      - name: specialty_code
        type: string
        source: input
        description: "Primary specialty code used for template and QA routing (e.g. CARD, FM, ORTHO)"
        constraints: "required; non-empty"
      - name: status
        type: enum
        source: system
        description: "Employment/credentialing status; SUSPENDED physicians cannot attest"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: QAAuditor
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Unique auditor employee code"
        constraints: "required; unique"
      - name: full_name
        type: string
        source: input
        description: "Auditor full name"
        constraints: "required; non-empty"
      - name: specialty_codes
        type: array
        source: input
        description: "Specialty codes this auditor is certified to score; assign rejects a mismatch"
        constraints: "required; array of non-empty strings"
      - name: status
        type: enum
        source: system
        description: "Auditor status; INACTIVE auditors cannot be assigned"
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"

  - name: NoteTemplate
    parent: null
    common_fields: true
    fields:
      - name: specialty_code
        type: string
        source: input
        description: "Specialty this template serves"
        constraints: "required; non-empty"
      - name: template_version
        type: string
        source: input
        description: "Human version label of the template (e.g. '1.0'); uniqueness scoped per specialty_code"
        constraints: "required; unique together with specialty_code"
      - name: field_specs
        type: array
        source: input
        description: "Ordered array of {key, importance, required} objects; importance in CRITICAL|MAJOR|MINOR; drives NoteField rows and completeness scoring"
        constraints: "required; at least one spec; key unique within template"
      - name: completeness_multiplier
        type: number
        source: input
        description: "Specialty-tuned multiplier applied to missing-field penalties in note_completeness_score"
        default: 1.0
        constraints: "> 0 and <= 3.0"
      - name: low_confidence_threshold
        type: integer
        source: input
        description: "Attested notes whose completeness_at_attestation is strictly below this threshold auto-queue a LOW_CONFIDENCE QASample"
        default: 90
        constraints: "0..100"
      - name: active
        type: boolean
        source: input
        description: "Only active templates may back new NoteDrafts"
        default: true

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient seen"
        constraints: "required"
      - name: physician_id
        type: string
        source: input
        description: "FK -> Physician.id; the attending physician; must equal X-User-ID of the creating Physician"
        constraints: "required"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Scheduled start (ISO8601 UTC); informational"
        constraints: "optional"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the encounter was started"
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the encounter was completed or cancelled"
      - name: encounter_status
        type: enum
        source: system
        description: "Lifecycle dimension 1: SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"
        default: SCHEDULED
      - name: audio_status
        type: enum
        source: system
        description: "Lifecycle dimension 2 (parallel): NOT_RECORDING | RECORDING_ACTIVE | AUDIO_STOPPED; RECORDING_ACTIVE while any capture is RECORDING or PAUSED"
        default: NOT_RECORDING
      - name: documentation_status
        type: enum
        source: system
        description: "Lifecycle dimension 3 (parallel): NOT_STARTED | DRAFTING | IN_REVIEW | ATTESTED | AMENDED; mirrors the active NoteDraft status"
        default: NOT_STARTED
      - name: cancel_reason
        type: string
        source: input
        description: "Optional cancellation reason"

  - name: AmbientConsent
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; consent scope"
        constraints: "required"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must equal the encounter's patient_id"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "GRANTED | OPTED_OUT | REVOKED | EXPIRED"
        default: GRANTED
      - name: signage_posted
        type: boolean
        source: input
        description: "Whether room signage disclosing ambient recording was posted; must be true to grant"
        constraints: "required"
      - name: captured_via
        type: enum
        source: input
        description: "How consent was captured: ROOM_SIGNAGE | VERBAL | PORTAL"
        constraints: "required"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock grant timestamp"
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of opt-out / revocation / expiry"
      - name: end_reason
        type: enum
        source: system
        description: "OPT_OUT | REVOKE | EXPIRE; null while GRANTED"
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason supplied on revoke/opt-out"
        constraints: "optional"

  - name: AudioCapture
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "RECORDING | PAUSED | CAPTURED | TRANSCRIBED | PURGED | RETENTION_EXPIRED"
        default: RECORDING
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock start"
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock stop time"
      - name: planned_retention_days
        type: integer
        source: input
        description: "Requested retention window in days"
        constraints: "required; 1..3650"
      - name: retention_days_effective
        type: integer
        source: computed
        description: "Effective retention: planned_retention_days, clamped to min(planned, 30) when the encounter's consent leaves GRANTED while the capture is CAPTURED/TRANSCRIBED"
      - name: legal_hold
        type: boolean
        source: system
        description: "Compliance legal hold; blocks purge and retention expiry"
        default: false
      - name: recorded_seconds
        type: integer
        source: computed
        description: "Sum of RECORDING intervals only (paused time excluded); finalized at stop"
        default: 0
      - name: purge_reason
        type: enum
        source: system
        description: "OPT_OUT | REVOKE | CANCEL | MANUAL | RETENTION; null until purged"

  - name: SpeakerSegment
    parent: AudioCapture
    common_fields: true
    fields:
      - name: audio_capture_id
        type: string
        source: input
        description: "FK -> AudioCapture.id"
        constraints: "required"
      - name: start_offset_ms
        type: integer
        source: input
        description: "Half-open interval start within the capture, milliseconds"
        constraints: "required; >= 0"
      - name: end_offset_ms
        type: integer
        source: input
        description: "Half-open interval end; must be strictly greater than start_offset_ms"
        constraints: "required; > start_offset_ms"
      - name: speaker_role
        type: enum
        source: input
        description: "PHYSICIAN | PATIENT | CAREGIVER | OTHER"
        constraints: "required"
      - name: base_confidence
        type: number
        source: input
        description: "Diarization confidence 0..1 with at most 4 decimals"
        constraints: "required; 0..1"
      - name: reassignment_count
        type: integer
        source: system
        description: "Number of speaker reassignments applied"
        default: 0
      - name: effective_confidence
        type: number
        source: computed
        description: "round_half_up(base_confidence * 0.9^reassignment_count, 4 decimals)"

  - name: NoteDraft
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id"
        constraints: "required"
      - name: template_id
        type: string
        source: input
        description: "FK -> NoteTemplate.id; must be active at creation"
        constraints: "required"
      - name: author_physician_id
        type: string
        source: system
        description: "FK -> Physician.id; set to the encounter's physician_id; only the author may edit/submit/attest/amend/appeal"
      - name: status
        type: enum
        source: system
        description: "DRAFT | IN_REVIEW | EDITED | ATTESTED | AMENDED | VOID"
        default: DRAFT
      - name: completeness_score
        type: integer
        source: computed
        description: "note_completeness_score output, recomputed on every field mutation; 0..100"
        default: 0
      - name: billing_provisional_cents
        type: integer
        source: computed
        description: "billing_suggestion_totals provisional variant over SUGGESTED+MODIFIED+CONFIRMED billing suggestions"
        default: 0
      - name: billing_final_cents
        type: integer
        source: computed
        description: "billing_suggestion_totals final variant over CONFIRMED billing suggestions only"
        default: 0
      - name: regeneration_count
        type: integer
        source: system
        description: "Number of regenerate cycles"
        default: 0
      - name: amendment_count
        type: integer
        source: system
        description: "Number of amend cycles"
        default: 0
      - name: phi_review_required
        type: boolean
        source: system
        description: "Set true when consent is opted-out/revoked while this draft is ATTESTED; the legal record is preserved but flagged"
        default: false
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock time of latest attestation"

  - name: NoteField
    parent: NoteDraft
    common_fields: true
    fields:
      - name: note_draft_id
        type: string
        source: system
        description: "FK -> NoteDraft.id"
      - name: field_key
        type: string
        source: system
        description: "Key from the template's field_specs"
      - name: field_value
        type: string
        source: input
        description: "Current text content; null means unfilled"
      - name: importance
        type: enum
        source: system
        description: "CRITICAL | MAJOR | MINOR; copied from field_specs at draft creation"
      - name: required
        type: boolean
        source: system
        description: "Copied from field_specs at draft creation"
      - name: source
        type: enum
        source: system
        description: "SYSTEM (empty seed) | AUDIO (regenerate pull) | MANUAL (physician edit)"
        default: SYSTEM
      - name: validated
        type: boolean
        source: system
        description: "true once a physician has touched or the value survived a consent event; false for unreviewed AUDIO content and after consent invalidation"
        default: false

  - name: Attestation
    parent: NoteDraft
    common_fields: false
    fields:
      - name: note_draft_id
        type: string
        source: system
        description: "FK -> NoteDraft.id"
      - name: physician_id
        type: string
        source: system
        description: "FK -> Physician.id; the attesting physician (always the draft author)"
      - name: attestation_type
        type: enum
        source: system
        description: "INITIAL for the first attestation; AMENDMENT for every re-attestation after an amend cycle"
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock attestation timestamp"
      - name: completeness_at_attestation
        type: integer
        source: system
        description: "Snapshot of completeness_score at attestation; drives LOW_CONFIDENCE QA sampling"

  - name: CodeSuggestion
    parent: NoteDraft
    common_fields: true
    fields:
      - name: note_draft_id
        type: string
        source: system
        description: "FK -> NoteDraft.id"
      - name: code_type
        type: enum
        source: input
        description: "DIAGNOSIS | ORDER | BILLING"
        constraints: "required"
      - name: code_value
        type: string
        source: input
        description: "Code identifier; must match ^[A-Z][0-9A-Z.]{2,15}$"
        constraints: "required"
      - name: confidence
        type: number
        source: input
        description: "Model confidence 0..1 (4 decimals max); used by the provisional billing variant"
        constraints: "required; 0..1"
      - name: quantity
        type: integer
        source: input
        description: "Units; BILLING only, default 1"
        default: 1
        constraints: ">= 1"
      - name: unit_fee_cents
        type: integer
        source: input
        description: "Fee per unit in cents; BILLING only"
        constraints: "required when code_type == BILLING; >= 0"
      - name: adjustment_pct
        type: number
        source: input
        description: "Fee adjustment multiplier (e.g. 1.10); BILLING only"
        default: 1.0
        constraints: "> 0 and <= 5.0"
      - name: status
        type: enum
        source: system
        description: "SUGGESTED | MODIFIED | CONFIRMED | REJECTED | EXPIRED"
        default: SUGGESTED
      - name: rank
        type: integer
        source: system
        description: "1-based rank within the draft: confidence DESC, tie-break created_at ASC"
      - name: line_total_cents
        type: integer
        source: computed
        description: "round_half_up(unit_fee_cents * quantity * adjustment_pct); 0 for non-BILLING"
        default: 0
      - name: confirmed_by
        type: string
        source: system
        description: "Physician id of the confirming clinician (audit field; X-User-ID of the confirm call)"

  - name: QASample
    parent: NoteDraft
    common_fields: true
    fields:
      - name: note_draft_id
        type: string
        source: system
        description: "FK -> NoteDraft.id"
      - name: auditor_id
        type: string
        source: system
        description: "FK -> QAAuditor.id; null until assigned"
      - name: status
        type: enum
        source: system
        description: "QUEUED | ASSIGNED | SCORED | APPEALED | RESCORED | CLOSED"
        default: QUEUED
      - name: sampling_reason
        type: enum
        source: system
        description: "LOW_CONFIDENCE (auto at attestation) | MANUAL (queued by auditor/compliance)"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creator for MANUAL samples; the string 'system' for auto-sampled; the creator may never score the sample (segregation of duties)"
      - name: accuracy_score
        type: integer
        source: input
        description: "0..100 auditor sub-score"
      - name: completeness_score
        type: integer
        source: input
        description: "0..100 auditor sub-score"
      - name: timeliness_score
        type: integer
        source: input
        description: "0..100 auditor sub-score"
      - name: composite_score
        type: integer
        source: computed
        description: "qa_composite_score output; base weights 0.5/0.3/0.2, appeal (rescore) weights 0.7/0.2/0.1"
      - name: appeal_count
        type: integer
        source: system
        description: "Number of appeals; max 2"
        default: 0
      - name: last_scorer_id
        type: string
        source: system
        description: "X-User-ID of the most recent scorer; the rescorer must differ"

  - name: DocumentationMetric
    parent: Physician
    common_fields: true
    fields:
      - name: physician_id
        type: string
        source: system
        description: "FK -> Physician.id"
      - name: period_start
        type: datetime
        source: system
        description: "First day of the calendar month (00:00:00Z) containing the activity"
      - name: period_end
        type: datetime
        source: system
        description: "First day of the following month (exclusive bound)"
      - name: notes_attested
        type: integer
        source: computed
        description: "Live counter: +1 on attest, -1 on amend; invariant: equals the number of the physician's currently-ATTESTED drafts attested in this period"
        default: 0
      - name: provisional_minutes
        type: integer
        source: computed
        description: "documentation_time provisional variant; 0 until recompute runs"
        default: 0
      - name: final_minutes
        type: integer
        source: computed
        description: "documentation_time final variant (excludes paused intervals); 0 until recompute runs"
        default: 0
      - name: after_hours_minutes
        type: integer
        source: computed
        description: "Minutes of documentation spans falling in [18:00,24:00) or [00:00,07:00) UTC; 0 until recompute runs"
        default: 0
      - name: status
        type: enum
        source: system
        description: "PROVISIONAL | FINAL; FINAL rows are immutable to recompute"
        default: PROVISIONAL
      - name: finalized_at
        type: datetime
        source: system
        description: "When finalize=true was applied"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Encounter
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: >
      Three parallel dimensions on one row: encounter_status (SCHEDULED|IN_PROGRESS|COMPLETED|CANCELLED),
      audio_status (NOT_RECORDING|RECORDING_ACTIVE|AUDIO_STOPPED), documentation_status
      (NOT_STARTED|DRAFTING|IN_REVIEW|ATTESTED|AMENDED). The transitions below govern encounter_status;
      audio_status and documentation_status are advanced purely by side effects of AudioCapture and
      NoteDraft transitions, independently of encounter_status (attestation is allowed after COMPLETED
      to support after-hours charting).
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /ambient-clinical-documentation/encounters/{id}/start"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
        side_effects:
          - "started_at := logical clock now"
          - "increments Encounter.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /ambient-clinical-documentation/encounters/{id}/complete"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
          - "no AudioCapture of this encounter is in status RECORDING or PAUSED"
        side_effects:
          - "ended_at := logical clock now"
          - "audio_status := AUDIO_STOPPED if any capture exists"
          - "increments Encounter.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ambient-clinical-documentation/encounters/{id}/cancel"
        actor: Physician | ComplianceOfficer
        preconditions: []
        side_effects:
          - "ended_at := logical clock now"
          - "cancel_reason := request payload value"
          - "consent cascade: this encounter's GRANTED AmbientConsent -> EXPIRED (end_reason EXPIRE)"
          - "consent-expiry cascade link 2: captures of this encounter in RECORDING or PAUSED -> PURGED (purge_reason CANCEL)"
          - "increments Encounter.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /ambient-clinical-documentation/encounters/{id}/cancel"
        actor: Physician | ComplianceOfficer
        preconditions: []
        side_effects:
          - "ended_at := logical clock now"
          - "cancel_reason := request payload value"
          - "consent cascade: GRANTED AmbientConsent -> EXPIRED (end_reason EXPIRE)"
          - "consent-expiry cascade link 2: captures in RECORDING or PAUSED -> PURGED (purge_reason CANCEL)"
          - "increments Encounter.version by 1"

  - entity: AmbientConsent
    initial_state: GRANTED
    terminal_states: [OPTED_OUT, REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: OPTED_OUT
        trigger: "POST /ambient-clinical-documentation/consents/{id}/opt-out"
        actor: Patient
        preconditions:
          - "X-User-ID == consent.patient_id"
        side_effects:
          - "ended_at := now; end_reason := OPT_OUT; revocation_reason := payload.reason"
          - "cascade link 1: captures of the encounter in RECORDING or PAUSED -> PURGED (purge_reason OPT_OUT); captures in CAPTURED or TRANSCRIBED get retention_days_effective := min(planned_retention_days, 30)"
          - "cascade link 2: every NoteField of this encounter's drafts with source == AUDIO -> field_value := null, validated := false (source stays AUDIO)"
          - "cascade link 3: drafts of this encounter in IN_REVIEW or EDITED -> DRAFT with completeness_score recomputed; drafts in ATTESTED -> phi_review_required := true (status unchanged; the attested legal record is immutable)"
          - "encounter.audio_status := NOT_RECORDING if all captures terminal"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /ambient-clinical-documentation/consents/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "ended_at := now; end_reason := REVOKE; revocation_reason := payload.reason"
          - "same cascade links 1-3 as OPTED_OUT (purge_reason REVOKE)"
      - from: GRANTED
        to: EXPIRED
        trigger: "system: encounter cancellation cascade, or POST /_maintenance/run-retention-sweep for consents on CANCELLED encounters still GRANTED"
        actor: system
        preconditions:
          - "owning encounter.encounter_status == CANCELLED"
        side_effects:
          - "ended_at := now; end_reason := EXPIRE"
          - "cascade link 2: captures in RECORDING or PAUSED -> PURGED (purge_reason CANCEL)"

  - entity: AudioCapture
    initial_state: RECORDING
    terminal_states: [PURGED, RETENTION_EXPIRED]
    transitions:
      - from: RECORDING
        to: PAUSED
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/pause"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
        side_effects:
          - "pause interval opens at logical clock now (recorded_seconds accrual suspends)"
      - from: PAUSED
        to: RECORDING
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/resume"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
        side_effects:
          - "pause interval closes; the pause/resume pair leaves recorded_seconds unchanged (compensating invariant)"
      - from: RECORDING
        to: CAPTURED
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/stop"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
        side_effects:
          - "ended_at := now"
          - "recorded_seconds := sum of RECORDING intervals between started_at and ended_at (paused time excluded)"
          - "encounter.audio_status := AUDIO_STOPPED"
      - from: PAUSED
        to: CAPTURED
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/stop"
        actor: Physician
        preconditions:
          - "X-User-ID == encounter.physician_id"
        side_effects:
          - "ended_at := now"
          - "recorded_seconds := sum of RECORDING intervals only"
          - "encounter.audio_status := AUDIO_STOPPED"
      - from: CAPTURED
        to: TRANSCRIBED
        trigger: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
        actor: system
        preconditions:
          - "the encounter has a GRANTED AmbientConsent"
        side_effects:
          - "transcript becomes available for regenerate"
      - from: CAPTURED
        to: PURGED
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/purge"
        actor: ComplianceOfficer
        preconditions:
          - "legal_hold == false"
        side_effects:
          - "purge_reason := MANUAL"
          - "segments of this capture are no longer returned by list endpoints"
      - from: TRANSCRIBED
        to: PURGED
        trigger: "POST /ambient-clinical-documentation/audio-captures/{id}/purge"
        actor: ComplianceOfficer
        preconditions:
          - "legal_hold == false"
        side_effects:
          - "purge_reason := MANUAL"
      - from: RECORDING
        to: PURGED
        trigger: "cascade: consent opt-out/revoke, or encounter cancel"
        actor: system
        preconditions: []
        side_effects:
          - "purge_reason := OPT_OUT | REVOKE | CANCEL per trigger"
      - from: PAUSED
        to: PURGED
        trigger: "cascade: consent opt-out/revoke, or encounter cancel"
        actor: system
        preconditions: []
        side_effects:
          - "purge_reason := OPT_OUT | REVOKE | CANCEL per trigger"
      - from: TRANSCRIBED
        to: RETENTION_EXPIRED
        trigger: "system: POST /ambient-clinical-documentation/_maintenance/run-retention-sweep"
        actor: system
        preconditions:
          - "now >= ended_at + retention_days_effective days (boundary: exactly equal is eligible)"
          - "legal_hold == false"
        side_effects:
          - "purge_reason := RETENTION"

  - entity: NoteDraft
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/submit-review"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
        side_effects:
          - "encounter.documentation_status := IN_REVIEW"
      - from: EDITED
        to: IN_REVIEW
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/submit-review"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
        side_effects:
          - "encounter.documentation_status := IN_REVIEW"
      - from: AMENDED
        to: IN_REVIEW
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/submit-review"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
        side_effects:
          - "encounter.documentation_status := IN_REVIEW"
      - from: IN_REVIEW
        to: EDITED
        trigger: "PATCH /ambient-clinical-documentation/note-drafts/{id}"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "expected_note_draft_version == draft.version (OCC)"
        side_effects:
          - "edited fields: field_value set, source := MANUAL, validated := true"
          - "completeness_score recomputed"
          - "increments NoteDraft.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /ambient-clinical-documentation/note-drafts/{id}"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "expected_note_draft_version == draft.version (OCC)"
        side_effects:
          - "edited fields: field_value set, source := MANUAL, validated := true"
          - "completeness_score recomputed"
          - "increments NoteDraft.version by 1"
      - from: EDITED
        to: EDITED
        trigger: "PATCH /ambient-clinical-documentation/note-drafts/{id}"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "expected_note_draft_version == draft.version (OCC)"
        side_effects:
          - "edited fields updated, source := MANUAL, validated := true"
          - "completeness_score recomputed"
          - "increments NoteDraft.version by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "PATCH /ambient-clinical-documentation/note-drafts/{id}"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "expected_note_draft_version == draft.version (OCC)"
        side_effects:
          - "edited fields updated, source := MANUAL, validated := true"
          - "completeness_score recomputed"
          - "increments NoteDraft.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/regenerate"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "the encounter has a GRANTED AmbientConsent"
          - "at least one capture of the encounter is TRANSCRIBED"
        side_effects:
          - "every NoteField with source != MANUAL is refilled from the transcript (field_value := 'drafted:' + field_key, source := AUDIO, validated := false); MANUAL fields are preserved"
          - "regeneration_count += 1"
          - "completeness_score recomputed"
          - "encounter.documentation_status := DRAFTING"
          - "increments NoteDraft.version by 1"
      - from: IN_REVIEW
        to: ATTESTED
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/attest"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "the author Physician.status == ACTIVE"
          - "the encounter has a GRANTED AmbientConsent"
          - "no QASample of this draft is in status ASSIGNED (QA hold)"
          - "completeness_score >= 80"
        side_effects:
          - "creates Attestation (attestation_type INITIAL if amendment_count == 0 else AMENDMENT; completeness_at_attestation snapshot)"
          - "attested_at := now"
          - "encounter.documentation_status := ATTESTED"
          - "every CodeSuggestion of this draft in SUGGESTED or MODIFIED -> EXPIRED"
          - "billing_provisional_cents and billing_final_cents recomputed (EXPIRED suggestions drop out of both variants)"
          - "DocumentationMetric for (author, month of attested_at): auto-create PROVISIONAL row if absent, notes_attested += 1"
          - "if completeness_at_attestation < template.low_confidence_threshold: auto-create QASample (QUEUED, sampling_reason LOW_CONFIDENCE, created_by_user_id 'system')"
      - from: ATTESTED
        to: AMENDED
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/amend"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
        side_effects:
          - "amendment_count += 1"
          - "encounter.documentation_status := AMENDED"
          - "DocumentationMetric for the attestation period: notes_attested -= 1 (compensating the earlier +1)"
      - from: DRAFT
        to: VOID
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/void, or superseded by POST /encounters/{id}/note-drafts"
        actor: Physician | ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "encounter.documentation_status := NOT_STARTED if no other non-terminal draft exists"
      - from: EDITED
        to: VOID
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/void, or superseded"
        actor: Physician | ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "encounter.documentation_status := NOT_STARTED if no other non-terminal draft exists"
      - from: IN_REVIEW
        to: VOID
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/void, or superseded"
        actor: Physician | ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "encounter.documentation_status := NOT_STARTED if no other non-terminal draft exists"
      - from: AMENDED
        to: VOID
        trigger: "POST /ambient-clinical-documentation/note-drafts/{id}/void, or superseded"
        actor: Physician | ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "encounter.documentation_status := NOT_STARTED if no other non-terminal draft exists"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "cascade: consent opt-out/revoke invalidates AUDIO-sourced content"
        actor: system
        preconditions: []
        side_effects:
          - "AUDIO NoteFields nulled and invalidated; completeness_score recomputed"
      - from: EDITED
        to: DRAFT
        trigger: "cascade: consent opt-out/revoke invalidates AUDIO-sourced content"
        actor: system
        preconditions: []
        side_effects:
          - "AUDIO NoteFields nulled and invalidated; completeness_score recomputed"

  - entity: CodeSuggestion
    initial_state: SUGGESTED
    terminal_states: [CONFIRMED, REJECTED, EXPIRED]
    transitions:
      - from: SUGGESTED
        to: CONFIRMED
        trigger: "POST /ambient-clinical-documentation/code-suggestions/{id}/confirm"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "owning NoteDraft.status != ATTESTED"
          - "billing cap: confirming a BILLING suggestion keeps sum(line_total_cents over CONFIRMED billing suggestions of the draft) + this line_total_cents <= 10000000"
        side_effects:
          - "confirmed_by := X-User-ID"
          - "billing_provisional_cents and billing_final_cents recomputed on the draft"
      - from: MODIFIED
        to: CONFIRMED
        trigger: "POST /ambient-clinical-documentation/code-suggestions/{id}/confirm"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "owning NoteDraft.status != ATTESTED"
          - "billing cap check as above"
        side_effects:
          - "confirmed_by := X-User-ID"
          - "billing totals recomputed"
      - from: SUGGESTED
        to: REJECTED
        trigger: "POST /ambient-clinical-documentation/code-suggestions/{id}/reject"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "owning NoteDraft.status != ATTESTED"
        side_effects:
          - "billing totals recomputed"
      - from: MODIFIED
        to: REJECTED
        trigger: "POST /ambient-clinical-documentation/code-suggestions/{id}/reject"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "owning NoteDraft.status != ATTESTED"
        side_effects:
          - "billing totals recomputed"
      - from: SUGGESTED
        to: MODIFIED
        trigger: "POST /ambient-clinical-documentation/code-suggestions/{id}/modify"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "owning NoteDraft.status != ATTESTED"
        side_effects:
          - "code_value and/or quantity replaced; line_total_cents recomputed; billing totals recomputed"
      - from: SUGGESTED
        to: EXPIRED
        trigger: "system: owning draft attested without confirmation"
        actor: system
        preconditions: []
        side_effects:
          - "drops out of both billing variants"
      - from: MODIFIED
        to: EXPIRED
        trigger: "system: owning draft attested without confirmation"
        actor: system
        preconditions: []
        side_effects:
          - "drops out of both billing variants"

  - entity: QASample
    initial_state: QUEUED
    terminal_states: [CLOSED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/assign"
        actor: QAAuditor | ComplianceOfficer
        preconditions:
          - "target auditor.status == ACTIVE"
          - "target auditor.specialty_codes contains the specialty_code of the draft's template"
        side_effects:
          - "auditor_id := payload auditor_id"
      - from: ASSIGNED
        to: SCORED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/score"
        actor: QAAuditor
        preconditions:
          - "X-User-ID == sample.auditor_id"
          - "X-User-ID != sample.created_by_user_id (segregation of duties)"
        side_effects:
          - "composite_score := qa_composite_score with base weights"
          - "last_scorer_id := X-User-ID"
      - from: SCORED
        to: APPEALED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/appeal"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "appeal_count < 2"
        side_effects:
          - "appeal_count += 1"
      - from: RESCORED
        to: APPEALED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/appeal"
        actor: Physician
        preconditions:
          - "X-User-ID == draft.author_physician_id"
          - "appeal_count < 2"
        side_effects:
          - "appeal_count += 1"
      - from: APPEALED
        to: RESCORED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/rescore"
        actor: QAAuditor
        preconditions:
          - "X-User-ID != sample.last_scorer_id (a different auditor must rescore)"
          - "X-User-ID != sample.created_by_user_id"
        side_effects:
          - "composite_score := qa_composite_score with appeal weights (accuracy 0.7 / completeness 0.2 / timeliness 0.1)"
          - "last_scorer_id := X-User-ID"
      - from: SCORED
        to: CLOSED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/close"
        actor: QAAuditor | ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: RESCORED
        to: CLOSED
        trigger: "POST /ambient-clinical-documentation/qa-samples/{id}/close"
        actor: QAAuditor | ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: DocumentationMetric
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /ambient-clinical-documentation/physicians/{id}/documentation-metrics/recompute with finalize: true"
        actor: Physician | ComplianceOfficer | PlatformAdmin
        preconditions:
          - "a metric row exists for (physician, month of payload period_start) or is created by this call"
        side_effects:
          - "documentation_time variants recomputed for the period"
          - "finalized_at := now"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: note-draft-edit-stale-version
    parent_entity: NoteDraft
    write_endpoint: "PATCH /ambient-clinical-documentation/note-drafts/{id}"
    occ_field: "expected_note_draft_version"
    description: |
      Editing a NoteDraft with an expected_note_draft_version lower than the
      draft's current version is rejected: another write (a physician edit, a
      regenerate, or a consent-driven cascade that recomputed completeness) has
      advanced the version since the client last observed it, so the client's
      base content is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: note-draft-create-stale-encounter
    parent_entity: Encounter
    write_endpoint: "POST /ambient-clinical-documentation/encounters/{id}/note-drafts"
    occ_field: "expected_encounter_version"
    description: |
      Creating a NoteDraft against an Encounter whose version has advanced
      since the client last observed it is rejected. Draft creation supersedes
      (voids) any existing non-terminal draft, so a stale view of the encounter
      means the client cannot know which draft it would supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: note_completeness_score
    trigger: "NoteDraft creation; every PATCH field update; regenerate; consent-invalidation cascade"
    algorithm: weighted_scoring
    formula: |
      penalties: CRITICAL = 25, MAJOR = 10, MINOR = 5 (per missing required field)
      missing = required NoteFields whose field_value is null or empty string
      raw = 100 - round_half_up(sum(penalty(f) * template.completeness_multiplier for f in missing))
      if any missing field has importance == CRITICAL: raw = min(raw, 49)
      score = clamp(raw, 0, 100)
    input_set: "NoteFields of the draft with required == true; template completeness_multiplier"
    constants:
      PENALTY_CRITICAL: 25
      PENALTY_MAJOR: 10
      PENALTY_MINOR: 5
      CRITICAL_CAP: 49
      ATTEST_MINIMUM: 80
    precision: "integer 0..100; the penalty sum is round_half_up before subtraction"
    variants:
      - name: specialty_weighted
        when: "template.completeness_multiplier != 1.0"
        difference: "penalties scale by the multiplier, so the same missing-field set yields a different score per specialty template (specialty-specific model tuning)"

  - name: billing_suggestion_totals
    trigger: "CodeSuggestion create/confirm/reject/modify; draft attestation"
    algorithm: aggregation
    formula: |
      line(s) = round_half_up(s.unit_fee_cents * s.quantity * s.adjustment_pct)   # per-line FIRST, then sum
      billing_final_cents       = sum(line(s) for s in draft.suggestions where s.code_type == BILLING and s.status == CONFIRMED)
      billing_provisional_cents = sum(round_half_up(line(s) * s.confidence) for s in draft.suggestions
                                      where s.code_type == BILLING and s.status in {SUGGESTED, MODIFIED, CONFIRMED})
    input_set: "CodeSuggestions of the draft with code_type == BILLING; status filter differs per variant"
    constants:
      BILLING_CAP_CENTS: 10000000
      MAX_ACTIVE_SUGGESTIONS: 8
    precision: "integer cents; rounding order is pinned: round each line first, then sum (sum-then-round is the rejected alternative)"
    variants:
      - name: provisional
        when: "note not yet attested / unconfirmed suggestions present"
        difference: "includes SUGGESTED and MODIFIED lines confidence-weighted (line rounded first, then multiplied by confidence, then rounded again)"
      - name: final
        when: "legal-record totals after attestation"
        difference: "CONFIRMED lines only, unweighted; EXPIRED and REJECTED excluded"

  - name: documentation_time
    trigger: "POST /physicians/{id}/documentation-metrics/recompute (and finalize)"
    algorithm: aggregation
    formula: |
      period = [month_start(period_start), next_month_start) of the logical clock calendar
      spans   = (encounter.started_at, attestation.attested_at) for each Attestation of type INITIAL or AMENDMENT
                whose physician is the subject and whose attested_at falls in the period
      provisional_minutes = sum(ceil_seconds_to_minutes(attested_at - started_at) for each span)   # wall clock
      paused(s)           = total PAUSED interval minutes of the span's encounter captures
      final_minutes       = sum(span_minutes - paused(span))                                        # excludes pauses
      after_hours_minutes = sum over spans of minutes of [started_at, attested_at) falling in
                            [18:00:00Z, 24:00:00Z) or [00:00:00Z, 07:00:00Z), minus paused minutes inside those windows
    input_set: "Attestations of the physician in the period; their encounters; the encounters' AudioCaptures (PAUSED intervals)"
    constants:
      AFTER_HOURS_START: "18:00:00Z"
      AFTER_HOURS_END: "07:00:00Z"
    precision: "integer minutes, truncation of sub-minute remainders per span before summing"
    variants:
      - name: provisional
        when: "wall-clock adoption measurement"
        difference: "raw attested_at - started_at; pauses NOT excluded"
      - name: final
        when: "effort-adjusted measurement"
        difference: "paused recording intervals subtracted; identical input spans, different result"

  - name: qa_composite_score
    trigger: "QASample score (base weights) and rescore (appeal weights)"
    algorithm: weighted_scoring
    formula: |
      base:   composite = round_half_up(0.5*accuracy_score + 0.3*completeness_score + 0.2*timeliness_score)
      appeal: composite = round_half_up(0.7*accuracy_score + 0.2*completeness_score + 0.1*timeliness_score)
    input_set: "the three sub-scores on the QASample"
    constants:
      W_BASE_ACC: 0.5
      W_BASE_COMP: 0.3
      W_BASE_TIME: 0.2
      W_APPEAL_ACC: 0.7
      W_APPEAL_COMP: 0.2
      W_APPEAL_TIME: 0.1
    precision: "integer 0..100, round_half_up"
    variants:
      - name: appeal
        when: "rescore after appeal"
        difference: "accuracy weight rises to 0.7; identical sub-scores yield a different composite"

  - name: speaker_effective_confidence
    trigger: "SpeakerSegment creation and every reassign-speaker"
    algorithm: decay_function
    formula: |
      effective_confidence = round_half_up(base_confidence * 0.9^reassignment_count, 4)
    input_set: "the segment's base_confidence and reassignment_count"
    constants:
      REASSIGNMENT_DECAY: 0.9
    precision: "4 decimal places, round_half_up"

  - name: retention_eligibility
    trigger: "POST /_maintenance/run-retention-sweep"
    algorithm: threshold
    formula: |
      retention_days_effective = planned_retention_days, or min(planned_retention_days, 30) if consent left GRANTED post-capture
      eligible = (now >= ended_at + retention_days_effective days) and (legal_hold == false) and (status == TRANSCRIBED)
      boundary: exactly ended_at + retention_days_effective days IS eligible (>=)
    input_set: "AudioCaptures in status TRANSCRIBED"
    constants:
      REVOKED_RETENTION_CAP_DAYS: 30
    precision: "whole days added to the ended_at instant; comparison at second precision"

  - name: suggestion_ranking
    trigger: "CodeSuggestion batch creation"
    algorithm: chronological
    formula: |
      rank = 1-based position of the suggestion within the draft ordered by confidence DESC, tie-break created_at ASC
    input_set: "all non-terminal suggestions of the draft (SUGGESTED, MODIFIED, CONFIRMED)"
    constants: {}
    precision: "integer ranks, dense from 1"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint AND entity_backed ownership holds (Patient acts on own consent; Physician acts on own encounters/drafts; QAAuditor scores only samples assigned to them)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "Request shape and referential payload validity: required fields present, enums in-domain (speaker_role, code_type, captured_via), code_value matches ^[A-Z][0-9A-Z.]{2,15}$, field_updates keys exist in the draft's template field_specs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "speaker_role must be one of PHYSICIAN|PATIENT|CAREGIVER|OTHER"
    error_id: ERR_SPEAKER_ROLE_INVALID
    http_status: 400
    applies_to: ["POST /ambient-clinical-documentation/audio-captures/{id}/segments", "POST /ambient-clinical-documentation/segments/{id}/reassign-speaker"]
  - priority: 4
    category: business_referential
    check: "field_updates reference only field_keys declared in the draft's template field_specs"
    error_id: ERR_TEMPLATE_FIELD_MISMATCH
    http_status: 422
    applies_to: ["PATCH /ambient-clinical-documentation/note-drafts/{id}"]
  - priority: 4
    category: business_referential
    check: "every code_value in a suggestion batch matches ^[A-Z][0-9A-Z.]{2,15}$"
    error_id: ERR_CODE_VALUE_MALFORMED
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/note-drafts/{id}/code-suggestions", "POST /ambient-clinical-documentation/code-suggestions/{id}/modify"]
  - priority: 5
    category: business_safety
    check: "Audio capture start requires a GRANTED AmbientConsent on the encounter (PHI safeguard)"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/audio-captures"]
  - priority: 5
    category: business_safety
    check: "Note draft create / regenerate / attest and transcription require the encounter's consent in GRANTED"
    error_id: ERR_CONSENT_NOT_ACTIVE
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/note-drafts", "POST /ambient-clinical-documentation/note-drafts/{id}/regenerate", "POST /ambient-clinical-documentation/note-drafts/{id}/attest", "POST /ambient-clinical-documentation/_audio/simulate-transcription"]
  - priority: 5
    category: business_safety
    check: "legal_hold == false required for purge and for retention sweep expiry"
    error_id: ERR_LEGAL_HOLD_ACTIVE
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/audio-captures/{id}/purge"]
  - priority: 5
    category: business_safety
    check: "attesting physician's status must be ACTIVE (credentialing safety)"
    error_id: ERR_PHYSICIAN_NOT_ACTIVE
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/note-drafts/{id}/attest"]
  - priority: 6
    category: state
    check: "Entity is in a from-state of the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Encounter is IN_PROGRESS for audio capture start and segment append"
    error_id: ERR_ENCOUNTER_NOT_IN_PROGRESS
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/audio-captures", "POST /ambient-clinical-documentation/audio-captures/{id}/segments"]
  - priority: 6
    category: state
    check: "NoteDraft is editable (DRAFT|EDITED|IN_REVIEW|AMENDED); ATTESTED and VOID reject PATCH"
    error_id: ERR_NOTE_LOCKED
    http_status: 409
    applies_to: ["PATCH /ambient-clinical-documentation/note-drafts/{id}"]
  - priority: 6
    category: state
    check: "Code suggestion transitions rejected once the owning draft is ATTESTED or VOID"
    error_id: ERR_CODE_SUGGESTION_LOCKED
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/code-suggestions/{id}/confirm", "POST /ambient-clinical-documentation/code-suggestions/{id}/reject", "POST /ambient-clinical-documentation/code-suggestions/{id}/modify"]
  - priority: 6
    category: state
    check: "attest rejected while any QASample of the draft is ASSIGNED (QA hold)"
    error_id: ERR_QA_HOLD_ACTIVE
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/note-drafts/{id}/attest"]
  - priority: 6
    category: state
    check: "recompute on a FINAL DocumentationMetric row is rejected"
    error_id: ERR_METRIC_PERIOD_CLOSED
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/physicians/{id}/documentation-metrics/recompute"]
  - priority: 7
    category: business_constraint
    check: "signage_posted must be true to grant consent (room signage requirement)"
    error_id: ERR_SIGNAGE_NOT_POSTED
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/consents"]
  - priority: 7
    category: business_constraint
    check: "at most one GRANTED AmbientConsent per encounter"
    error_id: ERR_DUPLICATE_CONSENT
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/consents"]
  - priority: 7
    category: business_constraint
    check: "no other capture of the encounter may be in RECORDING or PAUSED when starting a new capture"
    error_id: ERR_CAPTURE_ACTIVE_EXISTS
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/audio-captures"]
  - priority: 7
    category: business_constraint
    check: "template must be active at draft creation"
    error_id: ERR_TEMPLATE_INACTIVE
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/note-drafts"]
  - priority: 7
    category: business_constraint
    check: "at least one TRANSCRIBED capture exists for draft creation and regenerate"
    error_id: ERR_NO_TRANSCRIBED_AUDIO
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/note-drafts", "POST /ambient-clinical-documentation/note-drafts/{id}/regenerate"]
  - priority: 7
    category: business_constraint
    check: "completeness_score >= 80 required for attestation"
    error_id: ERR_NOTE_INCOMPLETE
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/note-drafts/{id}/attest"]
  - priority: 7
    category: business_constraint
    check: "active suggestions (SUGGESTED|MODIFIED) after the batch must not exceed 8"
    error_id: ERR_CODE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/note-drafts/{id}/code-suggestions"]
  - priority: 7
    category: business_constraint
    check: "appeal rejected when appeal_count >= 2"
    error_id: ERR_QA_MAX_APPEALS
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/qa-samples/{id}/appeal"]
  - priority: 7
    category: business_constraint
    check: "segregation of duties: sample creator may not score/rescore it; rescorer must differ from last_scorer_id"
    error_id: ERR_QA_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: ["POST /ambient-clinical-documentation/qa-samples/{id}/score", "POST /ambient-clinical-documentation/qa-samples/{id}/rescore"]
  - priority: 7
    category: business_constraint
    check: "assigned auditor's specialty_codes must contain the draft template's specialty_code"
    error_id: ERR_AUDITOR_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/qa-samples/{id}/assign"]
  - priority: 8
    category: business_temporal
    check: "a new capture may start only >= 60 seconds after the most recent stopped capture's ended_at on the same encounter (buffer gap; boundary: exactly 60s is allowed)"
    error_id: ERR_CAPTURE_GAP_VIOLATION
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/encounters/{id}/audio-captures"]
  - priority: 8
    category: business_temporal
    check: "SpeakerSegment half-open intervals [start_offset_ms, end_offset_ms) within one capture must be pairwise disjoint; adjacency (start == other end) is allowed, a 1ms overlap is rejected; end must be > start"
    error_id: ERR_SEGMENT_OVERLAP
    http_status: 409
    applies_to: ["POST /ambient-clinical-documentation/audio-captures/{id}/segments"]
  - priority: 9
    category: business_fiscal
    check: "confirming a BILLING suggestion must keep the draft's confirmed billing total <= 10000000 cents"
    error_id: ERR_BILLING_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /ambient-clinical-documentation/code-suggestions/{id}/confirm"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/ambient-clinical-documentation/patients"
