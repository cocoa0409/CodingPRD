            - "trigger call 7: HTTP 422 with data.error_id == 'ERR_ORDER_TYPE_NOT_PERMITTED' (RETAIL order into an INSTITUTIONAL period)"
            - "trigger call 8: HTTP 422 with data.error_id == 'ERR_ORDER_TYPE_NOT_PERMITTED' (MEMBER order against a SELLING_GROUP seat)"
            - "OrderPeriod.${op_inst_id}.orders_received_count is 0, so no refused order was persisted"

      - name: only_one_enhancement_may_be_committed_per_deal
