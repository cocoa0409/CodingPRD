# ============================================================================
# §1.9 Scaffold Corner Design — breadth probe
# Task 2725 — Nurse Triage Call Center & Symptom Protocol Routing
#
# Section names and claim_type values come verbatim from
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; anything it already asserts appears here as an
# `excluded_because:` stub naming the exact §1.8 instance.
#
# Logical clock default on a fresh server: 2026-08-01T00:00:00Z (a Saturday).
# 2026-08-03 is a Monday. The practice office window used throughout is
# 13:00-22:00 UTC, so 2026-08-03T14:30:00Z is in-hours.
#
# Error-catalog coverage map (§1.6 -> the instance that triggers it):
#   ERR_UNAUTHENTICATED ................ missing_or_malformed_auth_headers_return_unauthenticated
#   ERR_UNAUTHORIZED ................... write_endpoints_outside_their_declared_role_set_are_rejected
#   ERR_INVALID_REQUEST ................ create_practice_without_required_fields_and_with_a_bad_enum_is_rejected
#   ERR_PRACTICE_NOT_FOUND ............. unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_NURSE_NOT_FOUND ................ unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_PATIENT_NOT_FOUND .............. unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_PROTOCOL_NOT_FOUND ............. unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_TRIAGE_CALL_NOT_FOUND .......... unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_ASSESSMENT_NOT_FOUND ........... unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_DISPOSITION_NOT_FOUND .......... unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_CALLBACK_TASK_NOT_FOUND ........ unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_WARM_TRANSFER_NOT_FOUND ........ unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_COVERAGE_WINDOW_NOT_FOUND ...... unknown_ids_return_the_aggregate_specific_not_found_error
#   ERR_NOT_ASSIGNED_NURSE ............. a_nurse_who_is_not_the_assigned_nurse_cannot_assess_or_complete_the_call
#   ERR_PRACTICE_SCOPE_VIOLATION ....... practice_liaison_cannot_read_another_practices_compliance_summary
#   ERR_PRACTICE_SUSPENDED ............. suspending_a_practice_blocks_new_intake_and_new_patients
#   ERR_CALL_INVALID_STATE ............. consent_before_patient_match_and_a_second_consent_are_both_invalid_state
#   ERR_ASSESSMENT_SUPERSEDED .......... disposition_on_a_superseded_assessment_is_rejected
#   ERR_DISPOSITION_INVALID_STATE ...... override_of_an_already_overridden_disposition_is_rejected
#   ERR_CALLBACK_INVALID_STATE ......... verify_before_reached_and_attempt_after_verified_are_both_invalid_state
#   ERR_TRANSFER_INVALID_STATE ......... warm_transfer_confirmation_and_handoff_enforce_confidence_and_order
#   ERR_COVERAGE_WINDOW_INVALID_STATE .. activating_an_already_active_coverage_window_is_rejected
#   ERR_STALE_CALL_VERSION ............. stale_expected_call_version_on_disposition_create_returns_412
#   ERR_NURSE_NOT_LICENSED_IN_STATE .... §1.8 disposition_licensure_priority_24_beats_assessment_mismatch_priority_34_rejected
#   ERR_MINOR_REQUIRES_GUARDIAN_CONSENT  minor_consent_requires_a_guardian_and_succeeds_once_supplied
#   ERR_CONSENT_RECORDING_REQUIRED ..... recording_reference_is_required_only_when_the_practice_demands_it
#   ERR_OVERRIDE_DOCUMENTATION_REQUIRED  disposition_create_rejects_an_undocumented_escalation_then_a_deescalation
#   ERR_DEESCALATION_REQUIRES_CHARGE_NURSE  disposition_create_rejects_an_undocumented_escalation_then_a_deescalation
#   ERR_EMERGENCY_DEESCALATION_FORBIDDEN  override_of_an_emergency_recommendation_cannot_be_softened
#   ERR_OVERRIDE_STEP_LIMIT ............ override_beyond_one_ordinal_step_is_rejected
#   ERR_SEGREGATION_OF_DUTIES .......... the_advising_nurse_can_neither_verify_nor_override_their_own_disposition
#   ERR_WARM_TRANSFER_INCOMPLETE ....... §1.8 call_completion_is_gated_on_a_separate_warm_transfer_aggregate_reaching_handoff_complete
#   ERR_PATIENT_PRACTICE_MISMATCH ...... patient_match_requires_mrn_or_eighty_percent_confidence_and_the_right_practice
#   ERR_ASSESSMENT_CALL_MISMATCH ....... disposition_built_on_another_calls_assessment_is_rejected
#   ERR_CALLBACK_NOT_RESOLVED .......... audit_record_rejects_an_open_callback_a_backdated_outcome_and_a_duplicate
#   ERR_NO_ACTIVE_COVERAGE ............. §1.8 after_hours_intake_is_gated_on_a_third_partys_coverage_window_being_active
#   ERR_CALLBACK_PAST_DUE .............. high_risk_callback_verified_after_its_due_time_is_rejected
#   ERR_REOPEN_WINDOW_EXPIRED .......... reopen_after_seventy_two_hours_is_rejected
#   ERR_OUTCOME_PREDATES_DISPOSITION ... audit_record_rejects_an_open_callback_a_backdated_outcome_and_a_duplicate
#   ERR_SHIFT_OVERLAP .................. §1.8 nurse_shift_half_open_overlap_rejects_a_one_minute_straddle_but_allows_exact_adjacency
#   ERR_COVERAGE_WINDOW_CONFLICT ....... §1.8 coverage_window_thirty_minute_buffer_accepts_an_exact_gap_and_rejects_twenty_nine_minutes_on_both_sides
#   ERR_PROTOCOL_INACTIVE .............. retired_and_age_ineligible_protocols_are_both_rejected_at_assessment
#   ERR_PROTOCOL_AGE_INELIGIBLE ........ retired_and_age_ineligible_protocols_are_both_rejected_at_assessment
#   ERR_MATCH_CONFIDENCE_TOO_LOW ....... patient_match_requires_mrn_or_eighty_percent_confidence_and_the_right_practice
#   ERR_INVALID_LOCATION ............... warm_transfer_creation_rejects_bad_geography_and_a_state_mismatch
#   ERR_LOCATION_STATE_MISMATCH ........ warm_transfer_creation_rejects_bad_geography_and_a_state_mismatch
#   ERR_WARM_TRANSFER_NOT_INDICATED .... warm_transfer_on_a_non_emergency_call_is_not_indicated
#   ERR_WARM_TRANSFER_ALREADY_OPEN ..... warm_transfer_creation_rejects_bad_geography_and_a_state_mismatch
#   ERR_OUTCOME_ALREADY_RECORDED ....... audit_record_rejects_an_open_callback_a_backdated_outcome_and_a_duplicate
#   ERR_LOCATION_CONFIDENCE_TOO_LOW .... warm_transfer_confirmation_and_handoff_enforce_confidence_and_order
#   ERR_NURSE_AT_CAPACITY .............. preferred_nurse_already_at_max_concurrent_calls_is_rejected
#   ERR_NO_LICENSED_NURSE_AVAILABLE .... §1.8 empty_licensed_candidate_set_cannot_assign_and_only_moves_the_deferral_counter
#   ERR_PRACTICE_COMPLIANCE_HOLD ....... a_practice_under_compliance_review_cannot_activate_a_new_coverage_window
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: create_practice_applies_every_declared_default_and_system_field
        claim_type: Defaults
        grounds:
          - entities.Practice.fields.weekend_is_after_hours
          - entities.Practice.fields.consent_recording_required
          - entities.Practice.fields.variance_review_threshold
          - entities.Practice.fields.status
          - entities.Practice.fields.compliance_posture
          - endpoints[POST /practices]
        distinguishing_aspect: "A POST carrying only the four required fields must come back with weekend_is_after_hours true, consent_recording_required false, variance_review_threshold 2, status ACTIVE, compliance_posture NORMAL and all five counters at 0 — every default declared in §1.1 and nothing invented."
        test_recipe:
          setup:
            - "Empty database; the logical clock is left at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /practices"
              payload: { name: "Bare Minimum Clinic", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id, created_at: $.data.created_at, version: $.data.version }
          assert:
            - "the trigger response HTTP status is 201"
            - "Practice.${practice_id}.weekend_is_after_hours == true"
            - "Practice.${practice_id}.consent_recording_required == false"
            - "Practice.${practice_id}.variance_review_threshold == 2"
            - "Practice.${practice_id}.status == ACTIVE"
            - "Practice.${practice_id}.compliance_posture == NORMAL"
            - "Practice.${practice_id}.open_callback_count == 0"
            - "Practice.${practice_id}.open_variance_count == 0"
            - "Practice.${practice_id}.escalated_callback_count == 0"
            - "Practice.${practice_id}.billed_advice_minutes_total == 0"
            - "Practice.${practice_id}.advice_fee_accrued_cents == 0"
            - "${version} == 1"
            - "${created_at} is a non-empty ISO 8601 string generated by the server"

      - name: patient_creation_is_scoped_to_its_parent_practice_and_reads_back_unchanged
        claim_type: Parent Relationships
        grounds:
          - entities.Patient.fields.practice_id
          - entities.Patient.fields.pregnancy_status
          - endpoints[POST /practices/{id}/patients]
          - endpoints[GET /patients/{id}]
        distinguishing_aspect: "A patient created under one practice carries that practice_id, defaults pregnancy_status to NOT_APPLICABLE when omitted, and GET /patients/{id} returns the stored row field for field — while a patient id from another practice is invisible to the first practice's filtered list."
        test_recipe:
          setup:
            - "Two practices exist; one patient is created under each."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_a_id: $.data.id }
            - call: "POST /practices"
              payload: { name: "Southside Pediatrics", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 3000 }
              as: PlatformAdmin
              captures: { practice_b_id: $.data.id }
            - call: "POST /practices/${practice_b_id}/patients"
              payload: { full_name: "Other Practice Patient", dob: "1980-01-01", sex: "MALE", phone: "+14155559999", mrn: "MRN-9999" }
              as: PlatformAdmin
              captures: { patient_b_id: $.data.id }
          trigger:
            - call: "POST /practices/${practice_a_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0001" }
              as: IntakeAgent
              captures: { patient_a_id: $.data.id }
            - call: "GET /patients/${patient_a_id}"
              as: IntakeAgent
              captures: { read_back_name: $.data.full_name, read_back_practice: $.data.practice_id, read_back_pregnancy: $.data.pregnancy_status }
            - call: "GET /practices/${practice_a_id}/patients?mrn=MRN-9999"
              as: IntakeAgent
              captures: { foreign_total: $.total_count }
          assert:
            - "${read_back_name} == Dana Reyes"
            - "${read_back_practice} == ${practice_a_id}"
            - "${read_back_pregnancy} == NOT_APPLICABLE"
            - "Patient.${patient_a_id}.dob == 1990-03-15"
            - "Patient.${patient_a_id}.mrn == MRN-0001"
            - "Patient.${patient_b_id}.practice_id == ${practice_b_id}"
            - "${foreign_total} == 0"

      - name: symptom_protocol_listing_reports_total_count_and_has_more_across_pages
        claim_type: Listing
        grounds:
          - endpoints[GET /symptom-protocols]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three ACTIVE protocols on file, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and limit=2&offset=2 returns the last row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Three protocols created in a known order; no other data."
          setup_api_calls:
            - call: "POST /symptom-protocols"
              payload: { code: "PROTO_A", title: "Protocol Alpha", base_severity: 20, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_a_id: $.data.id }
            - call: "POST /symptom-protocols"
              payload: { code: "PROTO_B", title: "Protocol Bravo", base_severity: 40, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_b_id: $.data.id }
            - call: "POST /symptom-protocols"
              payload: { code: "PROTO_C", title: "Protocol Charlie", base_severity: 60, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_c_id: $.data.id }
          trigger:
            - call: "GET /symptom-protocols?limit=2&offset=0"
              as: PlatformAdmin
              captures: { page_one_total: $.total_count, page_one_has_more: $.has_more, page_one_first_id: "$.data[0].id" }
            - call: "GET /symptom-protocols?limit=2&offset=2"
              as: PlatformAdmin
              captures: { page_two_total: $.total_count, page_two_has_more: $.has_more }
            - call: "GET /symptom-protocols?code=PROTO_B"
              as: PlatformAdmin
              captures: { filtered_total: $.total_count, filtered_first_id: "$.data[0].id" }
          assert:
            - "${page_one_total} == 3"
            - "${page_one_has_more} == true"
            - "${page_one_first_id} == ${protocol_a_id}"
            - "${page_two_total} == 3"
            - "${page_two_has_more} == false"
            - "${filtered_total} == 1"
            - "${filtered_first_id} == ${protocol_b_id}"
            - "SymptomProtocol.${protocol_c_id}.infant_modifier_points == 20"
            - "SymptomProtocol.${protocol_c_id}.status == ACTIVE"

      - name: unknown_ids_return_the_aggregate_specific_not_found_error
        claim_type: Not Found
        grounds:
          - errors[ERR_PRACTICE_NOT_FOUND]
          - errors[ERR_NURSE_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_PROTOCOL_NOT_FOUND]
          - errors[ERR_TRIAGE_CALL_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_DISPOSITION_NOT_FOUND]
          - errors[ERR_CALLBACK_TASK_NOT_FOUND]
          - errors[ERR_WARM_TRANSFER_NOT_FOUND]
          - errors[ERR_COVERAGE_WINDOW_NOT_FOUND]
        distinguishing_aspect: "Each aggregate root answers a syntactically valid but unknown UUID with its OWN 404 error_id rather than a generic one, so a client can tell which reference in a chain was wrong."
        test_recipe:
          setup:
            - "Empty database — no entity of any kind has been created."
          setup_api_calls: []
          trigger:
            - call: "GET /practices/00000000-0000-0000-0000-000000000001"
              as: PlatformAdmin
              expect_error: ERR_PRACTICE_NOT_FOUND
              expect_status: 404
            - call: "GET /nurses/00000000-0000-0000-0000-000000000002"
              as: PlatformAdmin
              expect_error: ERR_NURSE_NOT_FOUND
              expect_status: 404
            - call: "GET /patients/00000000-0000-0000-0000-000000000003"
              as: IntakeAgent
              expect_error: ERR_PATIENT_NOT_FOUND
              expect_status: 404
            - call: "GET /symptom-protocols/00000000-0000-0000-0000-000000000004"
              as: TriageNurse
              expect_error: ERR_PROTOCOL_NOT_FOUND
              expect_status: 404
            - call: "GET /triage-calls/00000000-0000-0000-0000-000000000005"
              as: IntakeAgent
              expect_error: ERR_TRIAGE_CALL_NOT_FOUND
              expect_status: 404
            - call: "GET /protocol-assessments/00000000-0000-0000-0000-000000000006"
              as: TriageNurse
              expect_error: ERR_ASSESSMENT_NOT_FOUND
              expect_status: 404
            - call: "GET /dispositions/00000000-0000-0000-0000-000000000007"
              as: ComplianceAuditor
              expect_error: ERR_DISPOSITION_NOT_FOUND
              expect_status: 404
            - call: "GET /callback-tasks/00000000-0000-0000-0000-000000000008"
              as: ChargeNurse
              expect_error: ERR_CALLBACK_TASK_NOT_FOUND
              expect_status: 404
            - call: "GET /warm-transfers/00000000-0000-0000-0000-000000000009"
              as: TriageNurse
              expect_error: ERR_WARM_TRANSFER_NOT_FOUND
              expect_status: 404
            - call: "GET /coverage-windows/00000000-0000-0000-0000-00000000000a"
              as: PracticeLiaison
              expect_error: ERR_COVERAGE_WINDOW_NOT_FOUND
              expect_status: 404
          assert:
            - "each of the ten trigger responses has HTTP status 404"
            - "each response body is the error envelope with response_type error and the error_id named in its trigger"
            - "no entity is created by any of the ten calls"

      - name: create_practice_without_required_fields_and_with_a_bad_enum_is_rejected
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /practices]
          - endpoints[PATCH /practices/{id}/status]
          - entities.Practice.fields.status
        distinguishing_aspect: "Omitting per_minute_rate_millicents on create and sending status PAUSED on the status patch both answer ERR_INVALID_REQUEST at 400, proving required-field presence and enum membership are checked before any persistence happens."
        test_recipe:
          setup:
            - "One valid practice exists so the PATCH has a real target."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
          trigger:
            - call: "POST /practices"
              payload: { name: "No Rate Clinic", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00" }
              as: PlatformAdmin
              expect_error: ERR_INVALID_REQUEST
              expect_status: 400
            - call: "PATCH /practices/${practice_id}/status"
              payload: { status: "PAUSED" }
              as: PlatformAdmin
              expect_error: ERR_INVALID_REQUEST
              expect_status: 400
          assert:
            - "both trigger responses carry error_id ERR_INVALID_REQUEST with HTTP status 400"
            - "Practice.${practice_id}.status == ACTIVE"
            - "Practice.${practice_id}.version == 1"
            - "GET /practices/${practice_id} still returns per_minute_rate_millicents == 4225"

      - name: nurse_license_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.NurseLicense
          - entities.NurseLicense.fields.status
          - endpoints[POST /nurses/{id}/licenses]
          - endpoints[GET /nurses/{id}/licenses]
        distinguishing_aspect: "NurseLicense is declared with common_fields false, so its create response and its list rows expose id and created_at but no version and no updated_at, and §1.5 offers no PATCH or DELETE for it — the licence record is an append-only fact."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z; one nurse with two licences in different states."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: PlatformAdmin
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /nurses/${nurse_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
              captures: { license_ca_id: $.data.id, license_created_at: $.data.created_at }
            - call: "POST /nurses/${nurse_id}/licenses"
              payload: { state_code: "NV", license_number: "NV-22222", expires_on: "2026-07-31" }
              as: PlatformAdmin
              captures: { license_nv_id: $.data.id }
            - call: "GET /nurses/${nurse_id}/licenses?state_code=CA"
              as: PlatformAdmin
              captures: { ca_total: $.total_count, ca_first_status: "$.data[0].status" }
          assert:
            - "NurseLicense.${license_ca_id}.status == ACTIVE"
            - "NurseLicense.${license_nv_id}.status == EXPIRED"
            - "${ca_total} == 1"
            - "${ca_first_status} == ACTIVE"
            - "${license_created_at} is a non-empty ISO 8601 string"
            - "the NurseLicense create response contains no version field and no updated_at field"
            - "§1.5 declares no PATCH or DELETE endpoint whose path ends in /licenses/{id}"

      - name: nurse_defaults_and_computed_counters_start_at_their_declared_values
        claim_type: Computed Fields
        grounds:
          - entities.Nurse.fields.max_concurrent_calls
          - entities.Nurse.fields.high_risk_cap
          - entities.Nurse.fields.active_call_load
          - entities.Nurse.fields.pending_high_risk_count
          - entities.Nurse.fields.intake_eligibility
        distinguishing_aspect: "A nurse created with only full_name and seniority_level starts at active_call_load 0, pending_high_risk_count 0 and intake_eligibility ON_ROTATION — the three computed fields are server-owned and are never read from the request."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: PlatformAdmin
              captures: { nurse_id: $.data.id, load: $.data.active_call_load, eligibility: $.data.intake_eligibility }
          assert:
            - "the trigger response HTTP status is 201"
            - "${load} == 0"
            - "${eligibility} == ON_ROTATION"
            - "Nurse.${nurse_id}.pending_high_risk_count == 0"
            - "Nurse.${nurse_id}.seniority_level == 3"
            - "Nurse.${nurse_id}.version == 1"

      - name: assessment_computed_acuity_fields_are_server_derived
        claim_type: Computed Fields
        grounds:
          - entities.ProtocolAssessment.fields.acuity_score
          - calculations.assessment_acuity_score
        excluded_because:
          difficulty_instance: acuity_provisional_stated_age_vs_confirmed_dob_crosses_emergency_band
          rationale: "That §1.8 instance already asserts age_years_used, age_modifier_points, red_flag_points and acuity_score for both variants of the same underlying facts."

  # ==========================================================================
  - section: state_machines
    instances:

      - name: every_aggregate_root_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - entities.TriageCall.fields.status
          - entities.CoverageWindow.fields.status
          - entities.NurseShift.fields.status
          - entities.SymptomProtocol.fields.status
        distinguishing_aspect: "A freshly created TriageCall is INTAKE, CoverageWindow is DRAFT with a null suspend_reason, a future NurseShift is SCHEDULED and a protocol is ACTIVE — none of them can be created directly into a later state."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z (Monday, in-hours) so the call needs no coverage window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: PlatformAdmin
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat" }
              as: IntakeAgent
              captures: { call_id: $.data.id, call_status: $.data.status }
            - call: "POST /coverage-windows"
