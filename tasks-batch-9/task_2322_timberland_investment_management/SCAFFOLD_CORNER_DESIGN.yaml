      - name: underwriting_case_revision_loop_is_bounded
        claim_type: cyclic
        grounds:
          - "state_machines.UnderwritingCase.SUBMITTED_to_REVISION_REQUESTED"
          - "state_machines.UnderwritingCase.REVISION_REQUESTED_to_SUBMITTED"
        excluded_because:
          difficulty_instance: non_linear_state_machine / underwriting_revision_loop_terminates_at_two_rounds
          rationale: "That instance drives the SUBMITTED <-> REVISION_REQUESTED loop twice and asserts the third REQUEST_REVISION fails with ERR_REVISION_LIMIT_REACHED at revision_count 2."
      - name: property_status_and_appraisal_dimensions_are_independent
        claim_type: parallel
        grounds:
          - "state_machines.Property.status"
          - "state_machines.Property.appraisal_status"
        excluded_because:
          difficulty_instance: non_linear_state_machine / property_acquisition_and_appraisal_dimensions_advance_independently
          rationale: "That instance drives the status dimension to APPROVED_FOR_BID and the appraisal dimension to STALE on the same property and asserts both plus the untouched posture and harvest_plan_status dimensions."
      - name: audit_status_is_derived_from_its_findings
        claim_type: compound
        grounds:
          - "state_machines.CertificationAudit.CAR_REVIEW_to_FINDINGS_ISSUED"
          - "state_machines.CertificationAudit.CAR_REVIEW_to_CLOSED_CONFORMING"
        excluded_because:
          difficulty_instance: non_linear_state_machine / audit_findings_car_review_cycle_then_closes_conforming
          rationale: "That instance re-derives the parent audit state from its child finding twice — REJECT_CAR pushes CAR_REVIEW back to FINDINGS_ISSUED, VERIFY_CLOSE then permits CLOSED_CONFORMING."
      - name: hazard_loss_cascades_down_to_blocks_and_the_fund
        claim_type: cascade_down
        grounds:
          - "calculations.hazard_loss_reallocation"
          - "state_machines.HarvestBlock.RESERVED_to_VOIDED"
        excluded_because:
          difficulty_instance: transitive_cascade / hazard_event_cascades_stand_block_property_and_fund
          rationale: "That instance asserts the full four-level chain: stand tons, block VOIDED at planned_tons 0.00, Property.harvest_plan_status REPLAN_REQUIRED and Fund.replan_property_count."
      - name: suspension_reverts_committed_blocks_on_another_entity
        claim_type: cross_entity
        grounds:
          - "state_machines.HarvestBlock.COMMITTED_to_RESERVED"
          - "calculations.certification_posture_derivation"
        excluded_because:
          difficulty_instance: transitive_cascade / certification_suspension_cascades_committed_blocks_back_to_reserved
          rationale: "That instance raises the second MAJOR finding and asserts the COMMITTED block reverts to RESERVED with committed_tons 0.00 and reserved_tons 1000.00."
      - name: cancelled_block_reverses_its_own_reservation
        claim_type: compensation
        grounds:
          - "state_machines.HarvestBlock.RESERVED_to_CANCELLED"
          - "entities.Stand.fields.available_tons"
        excluded_because:
          difficulty_instance: compensating_invariant / harvest_block_cancel_restores_available_tons_exactly
          rationale: "That instance cancels a 1000.00-ton reservation and asserts available_tons returns to exactly 4647.12 with no drift and no cash movement."
  - section: calculations
    instances:
