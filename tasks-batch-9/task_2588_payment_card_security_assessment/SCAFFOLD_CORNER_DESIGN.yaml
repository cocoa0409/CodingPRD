            - "Engagement.${eng_1_id}.status is still SCOPING and scope_locked == false"
            - "The PATCH attempt returns HTTP 403 with ${err_not_lead_patch} == ERR_NOT_ENGAGEMENT_LEAD; approved_budget_amount is still 200000.00, so the budget ceiling was never re-evaluated"
