  - rule_id: transitive_cascade
    instances:

      - name: deliver_run_cascade_depth5_to_credit_hold_quote_void_and_order_hold
        grounds:
          - state_machines.DeliveryRun.DISPATCHED_to_DELIVERED
          - state_machines.SalesOrder.STAGED_to_DELIVERED
          - state_machines.SalesOrder.UNBILLED_to_INVOICED
          - state_machines.Customer.ACTIVE_to_CREDIT_HOLD
          - state_machines.SalesOrder.PENDING_ALLOCATION_to_HELD
          - calculations.customer_credit_posture
        distinguishing_aspect: |
          A five-link chain rooted at the DELIVER transition, each link caused by
          the previous one: run DELIVERED -> order DELIVERED -> order INVOICED at
          the delivery-day index (27008 cents) -> customer open_balance 27008
          against a 27000 limit so available_credit becomes -8 -> customer
          CREDIT_HOLD -> that customer's ISSUED quote is VOIDED and their other
          PENDING_ALLOCATION order moves to HELD.
