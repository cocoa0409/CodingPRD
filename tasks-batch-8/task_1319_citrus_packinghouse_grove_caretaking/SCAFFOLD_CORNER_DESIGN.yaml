# =============================================================================
# §1.9 Scaffold Corner Design — Citrus Packinghouse & Grove Caretaking
# Breadth probe: enumerative coverage of every testable claim in SCAFFOLD.yaml
# §1.1-§1.7 beyond the nine Difficulty Rules (§1.8). Sections and claim_type
# values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: grower_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Grower]
        distinguishing_aspect: "A fresh grower starts ACTIVE with zeroed computed ledgers, server-minted id, created_at/updated_at, version 1."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E1", display_name: "Entity Groves" }, as: PackinghouseAdmin, captures: { e_g: "$.data.id" } }
          assert:
            - "201; Grower.${e_g}.status == ACTIVE, advance_outstanding_cents == 0, caretaking_balance_cents == 0"
            - "id is a bare UUID (no type prefix); created_at == 2026-08-01T00:00:00.000Z; version == 1"
            - "GET /packinghouse/growers/${e_g} returns the same field values"

      - name: grower_create_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.Grower.fields.grower_code, "errors[ERR_DUPLICATE_ENTITY]"]
        distinguishing_aspect: "grower_code uniqueness is global; the second create with the same code fails."
        test_recipe:
          setup: ["Grower GR-E2 exists"]
          setup_api_calls:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E2", display_name: "First" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E2", display_name: "Second" }, as: PackinghouseAdmin, captures: { e2_err: "$.data.error_id" } }
          assert:
            - "${e2_err} == ERR_DUPLICATE_ENTITY (409)"

      - name: grower_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Grower.fields.display_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting display_name (required, no default) is a 400; grower_code alone is insufficient."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E3" }, as: PackinghouseAdmin, captures: { e3_err: "$.data.error_id" } }
          assert:
            - "${e3_err} == ERR_INVALID_REQUEST (400); no Grower persisted"

      - name: grove_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent grove id yields the 404 envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "GET /packinghouse/groves/00000000-0000-0000-0000-000000000000", payload: {}, as: PackinghouseAdmin, captures: { e4_err: "$.data.error_id" } }
          assert:
            - "${e4_err} == ERR_NOT_FOUND (404); envelope response_type == error"

      - name: grove_invalid_variety_rejected
        claim_type: type_constraints
        grounds: [entities.Grove.fields.variety, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "variety is a closed enum; NAVEL is not a member."
        test_recipe:
          setup: ["Grower exists"]
          setup_api_calls:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E5", display_name: "Enum Groves" }, as: PackinghouseAdmin, captures: { e5_g: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e5_g}", block_code: "B1", variety: NAVEL, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e5_err: "$.data.error_id" } }
          assert:
            - "${e5_err} == ERR_INVALID_REQUEST (400)"

      - name: grove_block_code_unique_per_grower_only
        claim_type: type_constraints
        grounds: [entities.Grove.fields.block_code, "errors[ERR_DUPLICATE_ENTITY]"]
        distinguishing_aspect: "block_code uniqueness is scoped to the owning grower: same code under the same grower fails, but a different grower may reuse it (tenant-scoped uniqueness)."
        test_recipe:
          setup: ["Growers A and B exist; A already has grove block B1"]
          setup_api_calls:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E6A", display_name: "A" }, as: PackinghouseAdmin, captures: { e6_ga: "$.data.id" } }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E6B", display_name: "B" }, as: PackinghouseAdmin, captures: { e6_gb: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e6_ga}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e6_ga}", block_code: "B1", variety: VALENCIA, acreage: 20, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e6_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e6_gb}", block_code: "B1", variety: VALENCIA, acreage: 20, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e6_g2: "$.data.id" } }
          assert:
            - "Same grower + same block_code: ${e6_err} == ERR_DUPLICATE_ENTITY (409)"
            - "Different grower + same block_code: 201, Grove.${e6_g2} created"

      - name: maturity_test_computed_fields_and_unknown_input_rejected
        claim_type: computed_fields
        grounds: [entities.MaturityTest.fields.ratio, entities.MaturityTest.fields.result, entities.MaturityTest.fields.expires_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ratio, result, expires_at are server-computed; a client-supplied ratio field is an unknown input and fails 400, while a clean create derives all three from inputs."
        test_recipe:
          setup: ["Grower + HAMLIN grove exist"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E7", display_name: "Computed Groves" }, as: PackinghouseAdmin, captures: { e7_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e7_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e7_gr: "$.data.id", e7_gr_v: "$.data.version" } }
          trigger:
            - { call: "POST /packinghouse/groves/${e7_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, ratio: 99.9, expected_grove_version: "${e7_gr_v}" }, as: QualityInspector, as_user_id: "qi_e7", captures: { e7_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/groves/${e7_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${e7_gr_v}" }, as: QualityInspector, as_user_id: "qi_e7", captures: { e7_t: "$.data.id" } }
          assert:
            - "Payload containing computed field 'ratio': ${e7_err} == ERR_INVALID_REQUEST"
            - "Clean create: MaturityTest.${e7_t}.ratio == 9.0, result == PASS, status == CURRENT, expires_at == 2026-08-05T10:00:00Z"

      - name: delivery_net_boxes_computed_and_tare_boundary
        claim_type: computed_fields
        grounds: [entities.Delivery.fields.net_boxes, entities.Delivery.fields.tare_boxes, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "net_boxes = gross - tare is computed; tare == gross (net 0) violates the > 0 net floor and is rejected at the boundary."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity, pool OPEN wk 2026-07-27, crew + assignment IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E8", display_name: "Tare Groves" }, as: PackinghouseAdmin, captures: { e8_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e8_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e8_gr: "$.data.id", e8_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${e8_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${e8_gr_v}" }, as: QualityInspector, as_user_id: "qi_e8" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-E8", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { e8_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${e8_c}", grove_id: "${e8_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { e8_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${e8_a}/start", payload: {}, as: FieldSupervisor }
          trigger:
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${e8_gr}", assignment_id: "${e8_a}", gross_boxes: 80, tare_boxes: 5 }, as: FieldSupervisor, captures: { e8_d: "$.data.id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${e8_gr}", assignment_id: "${e8_a}", gross_boxes: 10, tare_boxes: 10 }, as: FieldSupervisor, captures: { e8_err: "$.data.error_id" } }
          assert:
            - "Delivery.${e8_d}.net_boxes == 75 (computed); variety == HAMLIN copied from grove; processing RECEIVED / regulatory CLEAR; pool_id set"
            - "tare == gross (net 0): ${e8_err} == ERR_INVALID_REQUEST"

      - name: pool_duplicate_variety_week_rejected
        claim_type: type_constraints
        grounds: [entities.Pool.fields.week_start, "errors[ERR_DUPLICATE_ENTITY]"]
        distinguishing_aspect: "(variety, week_start) is unique; the same variety in a different week is allowed."
        test_recipe:
          setup: ["Pool HAMLIN wk 2026-07-27 exists"]
          setup_api_calls:
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { e9_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-08-03" }, as: PoolAccountant, captures: { e9_p2: "$.data.id" } }
          assert:
            - "Duplicate (variety, week): ${e9_err} == ERR_DUPLICATE_ENTITY"
            - "Same variety next week: 201 (Pool.${e9_p2} created)"

      - name: channel_market_type_coherence
        claim_type: type_constraints
        grounds: [entities.AllocationChannel.fields.destination_market, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "channel_type constrains destination_market: JUICE requires NONE, DOMESTIC_FRESH requires DOMESTIC, EXPORT requires a real market."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "BAD-1", channel_type: JUICE, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["JUICE"] }, as: PackinghouseAdmin, captures: { e10_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "OK-1", channel_type: EXPORT, destination_market: KOREA, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 10, price_cents_per_box: 800, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { e10_ch: "$.data.id" } }
          assert:
            - "JUICE with market JAPAN: ${e10_err} == ERR_INVALID_REQUEST"
            - "EXPORT with KOREA: 201; AllocationChannel.${e10_ch}.remaining_boxes == 10 initially"

      - name: export_lot_pool_id_and_availability_computed
        claim_type: computed_fields
        grounds: [entities.ExportLot.fields.pool_id, entities.AllocationChannel.fields.remaining_boxes]
        distinguishing_aspect: "ExportLot.pool_id is resolved from the channel's (variety, week); lot creation reserves boxes so a second oversized lot sees the reduced availability."
        test_recipe:
          setup:
            - "Posted fixture: HAMLIN pool wk 2026-07-27; JP EXPORT channel 25@900 [FANCY] holding 25 allocated boxes from a POSTED sort run; JUICE channel present"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E11", display_name: "Lot Computed Groves" }, as: PackinghouseAdmin, captures: { e11_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e11_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { e11_gr: "$.data.id", e11_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${e11_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${e11_gr_v}" }, as: QualityInspector, as_user_id: "qi_e11" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { e11_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JP-E11", channel_type: EXPORT, destination_market: JAPAN, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 25, price_cents_per_box: 900, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { e11_jp: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-E11", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-E11", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { e11_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${e11_c}", grove_id: "${e11_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { e11_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${e11_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${e11_gr}", assignment_id: "${e11_a}", gross_boxes: 40, tare_boxes: 0 }, as: FieldSupervisor, captures: { e11_d: "$.data.id", e11_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${e11_d}", fancy_boxes: 40, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${e11_d_v}" }, as: LineOperator, as_user_id: "op_e11", captures: { e11_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${e11_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_e11" }
            - { call: "POST /packinghouse/sort-runs/${e11_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_e11" }
          trigger:
            - { call: "POST /packinghouse/export-lots", payload: { destination_market: JAPAN, variety: HAMLIN, grade: FANCY, boxes: 20, source_channel_id: "${e11_jp}", source_grove_id: "${e11_gr}", cold_treatment_hours: 30 }, as: ComplianceOfficer, as_user_id: "co_e11", captures: { e11_lot: "$.data.id" } }
            - { call: "POST /packinghouse/export-lots", payload: { destination_market: JAPAN, variety: HAMLIN, grade: FANCY, boxes: 6, source_channel_id: "${e11_jp}", source_grove_id: "${e11_gr}" }, as: ComplianceOfficer, as_user_id: "co_e11", captures: { e11_err: "$.data.error_id" } }
          assert:
            - "ExportLot.${e11_lot}.pool_id == ${e11_p} (resolved from channel variety+week); status BUILDING; cold_treatment_hours defaulted to 0 when omitted on the second call"
            - "Second lot for 6 boxes with only 5 available: ${e11_err} == ERR_CHANNEL_CAPACITY_EXCEEDED"

      - name: entity_create_system_fields_rejected
        claim_type: system_fields
        grounds: [entities.Grower, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "id, created_at, updated_at, version are server-owned; supplying them in a create payload is a 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
          trigger:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E12", display_name: "X", id: "11111111-1111-1111-1111-111111111111" }, as: PackinghouseAdmin, captures: { e12_err: "$.data.error_id" } }
          assert:
            - "${e12_err} == ERR_INVALID_REQUEST"

      - name: caretaking_order_defaults_and_nullable_fields
        claim_type: defaults
        grounds: [entities.CaretakingServiceOrder.fields.chemical_cost_cents, entities.CaretakingServiceOrder.fields.invoice_id, entities.CaretakingServiceOrder.fields.line_amount_cents]
        distinguishing_aspect: "chemical_cost_cents defaults to 0; invoice_id and line_amount_cents are null until completion/invoicing; status starts REQUESTED."
        test_recipe:
          setup: ["Grower with enrolled grove exists"]
          setup_api_calls:
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-E13", display_name: "Defaults Groves" }, as: PackinghouseAdmin, captures: { e13_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${e13_g}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { e13_gr: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${e13_gr}", service_type: PRUNE, service_date: "2026-08-01", acres_treated: 5 }, as: FieldSupervisor, captures: { e13_o: "$.data.id" } }
          assert:
            - "CaretakingServiceOrder.${e13_o}: status == REQUESTED, chemical_cost_cents == 0, invoice_id == null, line_amount_cents == null, rate_tier == SMALL (computed at creation from grove acreage)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: assignment_start_happy_path_and_window_gate
        claim_type: valid_transition
        grounds: [state_machines.HarvestAssignment.SCHEDULED_to_IN_PROGRESS, "errors[ERR_ASSIGNMENT_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "Start inside [window_start, window_end) succeeds; start before window_start fails with the temporal error even though all other gates pass."
        test_recipe:
          setup:
            - "Grower, HAMLIN grove with CURRENT PASS maturity, crew 400; assignment window [2026-08-03T06:00,2026-08-03T18:00)"
            - "Clock parked at 2026-08-01T00:00:00Z (before the window)"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-SM1", display_name: "Window Groves" }, as: PackinghouseAdmin, captures: { sm1_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${sm1_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { sm1_gr: "$.data.id", sm1_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${sm1_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${sm1_gr_v}" }, as: QualityInspector, as_user_id: "qi_sm1" }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-SM1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { sm1_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${sm1_c}", grove_id: "${sm1_gr}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T18:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { sm1_a: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments/${sm1_a}/start", payload: {}, as: FieldSupervisor, captures: { sm1_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/harvest-assignments/${sm1_a}/start", payload: {}, as: FieldSupervisor }
          assert:
            - "Before window: ${sm1_err} == ERR_ASSIGNMENT_WINDOW_NOT_OPEN"
            - "At window_start exactly (inclusive): start succeeds, status == IN_PROGRESS"

      - name: assignment_complete_actual_boxes_bounds
        claim_type: precondition_enforcement
        grounds: [state_machines.HarvestAssignment.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "actual_boxes bounded by [1, ceil(planned*1.25)]: 0 rejected, 125 accepted for planned 100, 126 rejected."
        test_recipe:
