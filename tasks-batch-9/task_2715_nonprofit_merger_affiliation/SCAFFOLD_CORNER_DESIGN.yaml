              as: PlatformAdmin
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "Harbor Trade Pathways", service_category: "WORKFORCE_TRAINING", county_code: "CO-505", annual_expense_cents: 6000000, clients_served: 120 }
              as: PlatformAdmin
