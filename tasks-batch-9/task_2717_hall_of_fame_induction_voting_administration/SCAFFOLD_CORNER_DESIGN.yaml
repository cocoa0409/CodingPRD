              as_user_id: "admin-1"
              captures: { bloc_id: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector One", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e1: "$.data.id" }
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /candidates"
              payload: { full_name: "Late Player", category: "PLAYER", retirement_year: 2020, career_seasons: 12, career_metric_value: 2500, is_deceased: true, death_year: 2025 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand1: "$.data.id" }
            - call: "POST /induction-cycles"
              payload: { cycle_year: 2026, sport_code: "BASEBALL", max_inductees: 5, travel_budget_cents: 1000000, escort_pool_size: 2 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cyc: "$.data.id" }
            - call: "POST /induction-cycles/${cyc}/open-nominations"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /candidacies"
              payload: { cycle_id: "${cyc}", candidate_id: "${cand1}", nominated_by_elector_id: "${e1}", pathway: "POSTHUMOUS" }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { c1: "$.data.id", efy: "$.data.eligible_from_year" }
          assert:
            - "HTTP 201"
