            - call: "POST /gfco/applicants"
              payload: { legal_name: "Southbank Snacks Inc", contact_email: "qa@southbank.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_s: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_n}", supplier_id: "${sup_id}", name: "Rice Bran Sub-Component", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_n}"
              captures: { ing_sub: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_n}", supplier_id: "${sup_id}", name: "Rice Blend Compound", risk_class: "GF_PROCESSED", parent_ingredient_id: "${ing_sub}" }
              as: ApplicantContact
              as_user_id: "${app_n}"
              captures: { ing_compound: $.data.id, compound_parent: $.data.parent_ingredient_id }
          trigger:
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_s}", supplier_id: "${sup_id}", name: "Borrowed Blend", risk_class: "GF_PROCESSED", parent_ingredient_id: "${ing_sub}" }
              as: ApplicantContact
              as_user_id: "${app_s}"
          assert:
            - "response.status == 422"
            - "response.error.code == \"ERR_INGREDIENT_GRAPH_CYCLE\""
            - "${compound_parent} == ${ing_sub}"
            - "Ingredient.${ing_compound}.status == \"DRAFT\""
            - "GET /gfco/ingredients with applicant_id=${app_s} returns total_count == 0"
            - "GET /gfco/ingredients with parent_ingredient_id=${ing_sub} returns total_count == 1"

