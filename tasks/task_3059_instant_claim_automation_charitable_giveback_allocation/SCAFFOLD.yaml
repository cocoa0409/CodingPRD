    path: "/cohorts"
    description: "Create a giveback cohort for a year"
    roles: [PlatformAdmin]
    code: 201
    input: [cohort_year, cause_id]
    output: Cohort
    side_effects: ["status=OPEN; aggregates initialized to 0"]
  - method: GET
    path: "/causes/{id}/cohorts"
