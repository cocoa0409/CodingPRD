        grounds:
          - state_machines.GrantRecommendation.COMPLIANCE_REVIEW_to_APPROVED
          - state_machines.Grantee.IN_REVIEW_to_CLEARED
          - errors[ERR_GRANTEE_NOT_CLEARED]
