      - name: case_dimensions_cycle_through_extension_pending_and_back_to_active
        claim_type: cyclic
        grounds:
          - state_machines.HomeboundCase.ACTIVE_to_EXTENSION_PENDING
          - state_machines.HomeboundCase.EXTENSION_PENDING_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_extension_cycle_returns_to_active_while_funding_dimension_stays_accruing
          rationale: "The named §1.8 instance walks ACTIVE -> EXTENSION_PENDING -> ACTIVE twice and asserts the funding dimension never leaves ACCRUING."

      - name: extension_info_requested_loop_is_bounded_by_the_resubmit_limit
        claim_type: cyclic
        grounds:
          - state_machines.ExtensionRequest.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ExtensionRequest.INFO_REQUESTED_to_UNDER_REVIEW
          - errors[ERR_EXTENSION_RESUBMIT_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / extension_info_requested_cycle_caps_resubmit_count_at_two
          rationale: "The named §1.8 instance drives the INFO_REQUESTED loop to its third resubmission and asserts ERR_EXTENSION_RESUBMIT_LIMIT."

      - name: voiding_a_delivered_session_keeps_the_ledger_in_sync_by_appending_a_reversal
        claim_type: ledger_sync
        grounds:
          - calculations.attendance_code_assignment
          - entities.AttendanceLedgerEntry.fields.reversal_of_entry_id
        excluded_because:
          difficulty_instance: compensating_invariant / void_writes_a_reversal_row_that_returns_the_ledger_sum_to_zero_without_deleting_history
          rationale: "The named §1.8 instance asserts the HB_REVERSAL row, its reversal_of_entry_id link and the restored ledger sum."

      - name: releasing_a_support_row_compensates_the_primary_allocation
        claim_type: compensation
        grounds:
          - calculations.assignment_minute_allocation
          - calculations.teacher_committed_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / support_assignment_release_returns_every_minute_to_the_primary_row_and_zeroes_the_teacher
          rationale: "The named §1.8 instance asserts the exact conservation of weekly_entitled_minutes across the release."

      - name: void_side_effects_reach_four_entities_in_one_request
        claim_type: cross_entity
        grounds:
          - endpoints[POST /hhi/sessions/{id}/void].side_effects
          - calculations.service_gap_minutes
          - calculations.transition_ack_counters
        excluded_because:
          difficulty_instance: transitive_cascade / void_cascades_ledger_reversal_to_funding_hold_to_plan_and_pacing_regression
          rationale: "The named §1.8 instance follows the ledger -> funding -> plan -> pacing chain from a single void."

      - name: virtual_only_clearance_cascades_only_to_the_in_home_sessions
        claim_type: conditional_cascade
        grounds:
          - endpoints[POST /hhi/safety-reviews/{id}/finalize].side_effects
          - state_machines.HomeVisitSafetyReview.DRAFT_to_FINALIZED
        excluded_because:
          difficulty_instance: transitive_cascade / virtual_only_clearance_cascades_mode_entitlement_allocation_teachers_and_cancels_in_home_sessions
          rationale: "The named §1.8 instance asserts the mode switch, re-resolved entitlement, re-allocation and the selective cancellation of IN_HOME sessions only."

      - name: pacing_acknowledgements_bubble_up_into_the_plan_status
        claim_type: bubble_up
        grounds:
          - calculations.transition_ack_counters
          - state_machines.TransitionPlan.CLASSROOM_COORD_PENDING_to_READY
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_ready_derived_from_all_pacing_acks_then_completion_gated_on_return_date
          rationale: "The named §1.8 instance asserts the child acknowledgements driving the parent plan to READY and back."

  - section: calculations
