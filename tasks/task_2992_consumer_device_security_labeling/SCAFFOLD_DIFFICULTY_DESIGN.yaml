              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_pub_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_pub_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_pub_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_pub_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Self-attested score 80.80 meets the tier minimum." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /labeling/label-grants"
              payload: { product_id: "${prod_speaker_id}", assessment_id: "${asmt_pub_id}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { grant_pub_id: $.data.id }
            - call: "POST /labeling/label-grants/${grant_pub_id}/registry-entry"
