            - "Invoice.${inv}.total_cents == 1931"
            - "Invoice.${inv}.amount_due_cents == 1931"

      - name: dispatch_spill_fixed_point_evaluation_order_mode_c
        grounds:
          - calculations.run_committed_minutes
          - state_machines.RouteRun.PLANNED_to_DISPATCHED
          - state_machines.RouteStop.SCHEDULED_to_SPILLED
          - validations[priority=53]
        distinguishing_aspect: |
          Mode (c): committed_minutes_final decides which stop spills, and spilling changes the set
          of stops that committed_minutes_final is computed over, so the value is only well defined
          because the scaffold pins the loop - recompute, spill the greatest-sequence SCHEDULED stop,
          recompute again. On a 70-minute run holding three 6-minute stops the loop runs exactly
          once, ending at committed_minutes_final 65 with two stops still scheduled.
        test_recipe:
          setup:
            - "Three SUBMITTED VAN_ROUTE requests for the same ZONE_N account, each with one CHEF_KNIFE ROUTINE_HONE item worth 6 service minutes."
            - "One PLANNED RouteRun on 2026-05-01 with service_minute_budget 70 and stop_cap 8, holding all three stops at sequences 1, 2 and 3 with non-overlapping windows."
            - "committed_minutes_provisional is 60, which is within the 70-minute budget."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
