# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1206_trade_secret_confidentiality_program
# §1.8 Test Targeting Index: 9 rules x instances (22 instances total)
# All chains replay from empty DB against SCAFFOLD.yaml §1.5 only.
# Default logical clock is 2026-05-01T00:00:00Z; initial current_policy_version "v1".
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: asset_score_operational_vs_documentary
        grounds:
          - calculations.reasonable_measures_score
          - entities.SecretAsset.fields.score_operational
          - entities.SecretAsset.fields.score_documentary
          - entities.SecretAsset.fields.protection_posture
        distinguishing_aspect: |
          Same four measure rows on a SecretAsset yield two different scores:
          operational counts the IMPLEMENTED PHYSICAL measure at 0.6x (64.0)
          while documentary counts it at 0 (55.0); protection_posture follows
          ONLY the operational variant (ADEQUATE). Entity domain: SecretAsset.
        test_recipe:
          setup:
            - "REGISTERED asset with TECHNICAL+CONTRACTUAL+POLICY measures VERIFIED and a PHYSICAL measure IMPLEMENTED (not verified)"
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Firmware signing process", description: "HSM key ceremony", classification: "RESTRICTED", owner_department: "ENG", exposure_estimate_cents: 500000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "HSM access control", evidence_uri: "s3://ev/hsm.pdf" }
              as: SecurityOfficer
              captures: { m_tech: $.data.id }
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "Vendor NDAs", evidence_uri: "s3://ev/nda.pdf" }
              as: SecurityOfficer
              captures: { m_con: $.data.id }
            - call: "POST /api/measures/${m_con}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_con}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "POLICY", title: "TS handling policy", evidence_uri: "s3://ev/pol.pdf" }
              as: SecurityOfficer
              captures: { m_pol: $.data.id }
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "PHYSICAL", title: "Badge-controlled lab", evidence_uri: "s3://ev/lab.pdf" }
              as: SecurityOfficer
              captures: { m_phy: $.data.id }
            - call: "POST /api/measures/${m_phy}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
          trigger:
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
        assert:
          - "SecretAsset.${a_id}.score_operational == 64 (25 + 20 + 10 + 15*0.6)"
          - "SecretAsset.${a_id}.score_documentary == 55 (25 + 20 + 10 + 0)"
          - "SecretAsset.${a_id}.protection_posture == ADEQUATE (operational 64 in [40,70))"
          - "score_operational != score_documentary for identical measure rows"

      - name: counterparty_exposure_trailing_vs_lifetime
        grounds:
          - calculations.counterparty_exposure_index
          - entities.Counterparty.fields.exposure_index_trailing
          - entities.Counterparty.fields.exposure_index_lifetime
          - entities.Counterparty.fields.risk_tier
        distinguishing_aspect: |
          Same counterparty history (one ESCALATED obligation at 2026-05-20, one
          EXECUTED disclosure at 2026-06-01): at clock 2027-07-01 both events are
          outside the trailing 365-day window, so exposure_index_trailing == 0
          while exposure_index_lifetime == 30; risk_tier follows ONLY the
          trailing variant (LOW). Entity domain: Counterparty.
        test_recipe:
          setup:
            - "Counterparty with ACTIVE NDA; one obligation escalated at 2026-05-20; one disclosure executed at 2026-06-01; clock then moved to 2027-07-01"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Acme Parts Ltd", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t1", governing_law: "DE", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z", survival_months: 12, classification_ceiling: "RESTRICTED" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_USE", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: IPCounsel
            - call: "POST /api/program/sweep"
              as: IPCounsel
            - call: "POST /api/obligations/${ob_id}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Sensor calibration table", description: "lookup tables", classification: "CONFIDENTIAL", owner_department: "ENG", exposure_estimate_cents: 100000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "Encryption at rest", evidence_uri: "s3://ev/enc.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "Confidentiality clauses", evidence_uri: "s3://ev/cl.pdf" }
              as: SecurityOfficer
              captures: { m2: $.data.id }
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/employees"
              payload: { full_name: "Dana Engineer", email: "dana@x.com", department: "ENG", role_title: "Engineer", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Joint eval", marking_protocol: "STAMPED_CONFIDENTIAL", planned_disclosure_date: "2026-06-15T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "APPROVED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "EXECUTED", marking_evidence_uri: "s3://ev/marked.pdf", marking_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
              as: IPCounsel
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: IPCounsel
            - call: "GET /api/counterparties/${cp_id}"
              as: IPCounsel
        assert:
          - "Counterparty.${cp_id}.exposure_index_trailing == 0 (both events older than 365 days; ESCALATED obligation is not OVERDUE-now)"
          - "Counterparty.${cp_id}.exposure_index_lifetime == 30 (25 escalated + 5 executed)"
          - "Counterparty.${cp_id}.risk_tier == LOW (trailing < 30)"

      - name: disclosure_risk_provisional_vs_final
        grounds:
          - calculations.disclosure_risk_score
          - entities.DisclosureRequest.fields.risk_score_provisional
          - entities.DisclosureRequest.fields.risk_score_final
          - state_machines.DisclosureRequest.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Same DisclosureRequest data yields risk_score_provisional == 70 at
          SUBMITTED (no tier multiplier) and risk_score_final == 92.5 at APPROVED
          (CROWN_JEWEL 90 x MEDIUM 1.25 - ENCRYPTED 20, clamped to [0,100]);
          92.5 >= 80 forces the SeniorCounsel endorsement branch. Entity domain:
          DisclosureRequest.
        test_recipe:
          setup:
            - "Counterparty driven to MEDIUM (two escalated obligations = trailing 50); CROWN_JEWEL asset with posture ADEQUATE (45); ACTIVE NDA with CROWN_JEWEL ceiling; disclosure with ENCRYPTED_DELIVERY protocol UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Beta Dynamics", counterparty_type: "PARTNER" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t2", governing_law: "CA", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-12-31T00:00:00Z", survival_months: 24, classification_ceiling: "CROWN_JEWEL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_DISCLOSURE", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob1: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_USE", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: IPCounsel
            - call: "POST /api/program/sweep"
              as: IPCounsel
            - call: "POST /api/obligations/${ob1}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/obligations/${ob2}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Training-data recipe", description: "model pipeline", classification: "CROWN_JEWEL", owner_department: "AI", exposure_estimate_cents: 9000000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "Enclave", evidence_uri: "s3://ev/enc.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "MSA clauses", evidence_uri: "s3://ev/msa.pdf" }
              as: SecurityOfficer
              captures: { m2: $.data.id }
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/employees"
              payload: { full_name: "Eli Researcher", email: "eli@x.com", department: "AI", role_title: "Researcher", access_clearance: "PRIVILEGED", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Co-development", marking_protocol: "ENCRYPTED_DELIVERY", planned_disclosure_date: "2026-06-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "APPROVED" }
              as: IPCounsel
              as_user_id: "counsel_1"
              captures: { err_first: $.data.error_id }
            - call: "POST /api/disclosures/${d_id}/endorse"
              as: SeniorCounsel
              as_user_id: "senior_1"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "APPROVED" }
              as: IPCounsel
              as_user_id: "counsel_1"
        assert:
          - "DisclosureRequest.${d_id}.risk_score_provisional == 70 (90 - 20, no tier multiplier)"
          - "first APPROVED attempt failed with err_first == ERR_ENDORSEMENT_REQUIRED (92.5 >= 80, not yet endorsed)"
          - "after endorse, DisclosureRequest.${d_id}.status == APPROVED"
          - "DisclosureRequest.${d_id}.risk_score_final == 92.5 (90 x 1.25 - 20)"
          - "risk_score_provisional != risk_score_final for identical request data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: disclosure_risk_tier_multiplier_clamp_branch
        grounds:
          - calculations.disclosure_risk_score
          - calculations.counterparty_exposure_index
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — CLASS_BASE x
          TIER_MULT - MARKING_CREDIT inside a clamp, plus a routing branch:
          HIGH-tier counterparty (exactly 60 = two ESCALATED + one OVERDUE-now)
          with CROWN_JEWEL asset and ORAL_WITH_FOLLOWUP protocol gives
          clamp(90 x 1.5 - 0, 0, 100) == 100 >= 95, so APPROVED is forbidden
          with ERR_DISCLOSURE_RISK_TOO_HIGH even though posture is ADEQUATE.
        test_recipe:
          setup:
            - "Counterparty at trailing index exactly 60 (HIGH); CROWN_JEWEL asset with posture ADEQUATE (45); ACTIVE NDA CROWN_JEWEL ceiling; disclosure with ORAL_WITH_FOLLOWUP protocol UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Gamma Sourcing", counterparty_type: "CONSULTANT" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t3", governing_law: "NY", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-12-31T00:00:00Z", survival_months: 12, classification_ceiling: "CROWN_JEWEL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_DISCLOSURE", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob1: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_USE", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob2: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "AUDIT_RIGHT", due_at: "2026-05-10T00:00:00Z" }
              as: IPCounsel
              captures: { ob3: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: IPCounsel
            - call: "POST /api/program/sweep"
              as: IPCounsel
            - call: "POST /api/obligations/${ob1}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/obligations/${ob2}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Diffusion weights delta", description: "checkpoint diff", classification: "CROWN_JEWEL", owner_department: "AI", exposure_estimate_cents: 4000000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "Vault storage", evidence_uri: "s3://ev/v.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "CONTRACTUAL", title: "Consultant NDA", evidence_uri: "s3://ev/c.pdf" }
              as: SecurityOfficer
              captures: { m2: $.data.id }
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/employees"
              payload: { full_name: "Fay Scientist", email: "fay@x.com", department: "AI", role_title: "Scientist", access_clearance: "PRIVILEGED", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Audit support", marking_protocol: "ORAL_WITH_FOLLOWUP", planned_disclosure_date: "2026-06-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/endorse"
              as: SeniorCounsel
              as_user_id: "senior_1"
          trigger:
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "APPROVED" }
              as: IPCounsel
              as_user_id: "counsel_1"
              captures: { err_final: $.data.error_id }
            - call: "GET /api/disclosures/${d_id}"
              as: IPCounsel
        assert:
          - "Counterparty.${cp_id}.exposure_index_trailing == 60 (25 + 25 + 10) and risk_tier == HIGH (>= 60 boundary inclusive)"
          - "err_final == ERR_DISCLOSURE_RISK_TOO_HIGH (clamp(90 x 1.5 - 0, 0, 100) == 100 >= 95)"
          - "DisclosureRequest.${d_id}.status == UNDER_REVIEW (approval forbidden despite ADEQUATE posture and endorsement)"

      - name: demand_letter_per_line_rounding
        grounds:
          - calculations.demand_letter_damages
          - entities.DemandLetter.fields.damages_estimate_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — round each claim line to integer
          cents THEN sum. With exposure_estimate_cents 10001 and all three claim
          types: round(3000.30)+round(2000.20)+round(1500.15) = 3000+2000+1500
          = 6500; the alternative sum-then-round would yield 6501.
        test_recipe:
          setup:
            - "Departed employee (involuntary) with ESCALATED forensic review; asset with exposure_estimate_cents == 10001; demand letter with three claim lines"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Gail Departing", email: "gail@x.com", department: "SALES", role_title: "AE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "NOTICE", departure_type: "INVOLUNTARY" }
              as: HRPartner
            - call: "GET /api/forensic-reviews"
              payload: { employee_id: "${emp_id}" }
              as: IPCounsel
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /api/forensic-reviews/${rev_id}/state"
              payload: { to_status: "IMAGING" }
              as: SecurityOfficer
            - call: "POST /api/evidence-items"
              payload: { review_id: "${rev_id}", source: "FORENSIC_IMAGE", sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", byte_size: 1024 }
              as: SecurityOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /api/forensic-reviews/${rev_id}/state"
              payload: { to_status: "FINDINGS_DRAFTED" }
              as: SecurityOfficer
            - call: "PATCH /api/forensic-reviews/${rev_id}"
              payload: { exfil_indicator_count: 2, findings_notes: "USB copies detected" }
              as: SecurityOfficer
            - call: "POST /api/forensic-reviews/${rev_id}/state"
              payload: { to_status: "COUNSEL_REVIEW" }
              as: IPCounsel
            - call: "POST /api/forensic-reviews/${rev_id}/state"
              payload: { to_status: "ESCALATED" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Pricing playbook", description: "discount authority matrix", classification: "CONFIDENTIAL", owner_department: "SALES", exposure_estimate_cents: 10001 }
              as: IPCounsel
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /api/demand-letters"
              payload: { forensic_review_id: "${rev_id}", claim_lines: [ { asset_id: "${a_id}", claim_type: "CEASE_AND_DESIST" }, { asset_id: "${a_id}", claim_type: "RETURN_OF_PROPERTY" }, { asset_id: "${a_id}", claim_type: "PRESERVATION" } ], response_deadline_days: 14 }
              as: IPCounsel
              as_user_id: "counsel_1"
              captures: { letter_id: $.data.id }
        assert:
          - "DemandLetter.${letter_id}.damages_estimate_cents == 6500 (per-line rounding: 3000 + 2000 + 1500)"
          - "DemandLetter.${letter_id}.damages_estimate_cents != 6501 (sum-then-round alternative rejected)"
          - "DemandLetter.${letter_id}.status == DRAFTED and employee_id == ${emp_id}"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nda_breach_allegation_cycle
        grounds:
          - state_machines.NdaAgreement.ACTIVE_to_BREACH_ALLEGED
          - state_machines.NdaAgreement.BREACH_ALLEGED_to_ACTIVE
        distinguishing_aspect: |
          Cycle on NdaAgreement: ACTIVE -> BREACH_ALLEGED -> ACTIVE returns the
          NDA to service with obligations untouched (counts unchanged) while
          version advances monotonically — a linear machine could not express
          the unfounded-allegation path.
        test_recipe:
          setup:
            - "ACTIVE NDA with one PENDING obligation"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Delta Logistics", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t4", governing_law: "WA", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "CONFIDENTIAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id, nda_v0: $.data.version }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_DISCLOSURE" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
              captures: { nda_v_pre: $.data.version }
          trigger:
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "BREACH_ALLEGED" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
              captures: { nda_v_end: $.data.version }
        assert:
          - "NdaAgreement.${nda_id}.status == ACTIVE after the allegation loop"
          - "NdaAgreement.${nda_id}.obligations_open_count == 1 (loop does not disturb obligations)"
          - "nda_v_end == nda_v_pre + 2 (exactly the two loop transitions bump version)"

      - name: disclosure_return_revision_cycle
        grounds:
          - state_machines.DisclosureRequest.UNDER_REVIEW_to_RETURNED
          - state_machines.DisclosureRequest.RETURNED_to_DRAFT
          - entities.DisclosureRequest.fields.pinned_asset_version
          - entities.DisclosureRequest.fields.senior_endorsed
        distinguishing_aspect: |
          Cycle on DisclosureRequest: DRAFT -> SUBMITTED -> UNDER_REVIEW ->
          RETURNED -> DRAFT -> SUBMITTED; the RETURNED -> DRAFT leg resets
          pinned versions and senior_endorsed, and the second SUBMITTED re-pins
          fresh versions — revision-round semantics, not a pipeline.
        test_recipe:
          setup:
            - "REGISTERED asset, ACTIVE NDA, Employee requester; disclosure endorsed once, returned, then resubmitted"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Epsilon Media", counterparty_type: "CUSTOMER" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t5", governing_law: "TX", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "RESTRICTED" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "Churn model features", description: "feature store", classification: "CONFIDENTIAL", owner_department: "DATA", exposure_estimate_cents: 250000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/employees"
              payload: { full_name: "Hank Analyst", email: "hank@x.com", department: "DATA", role_title: "Analyst", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Case study", marking_protocol: "STAMPED_CONFIDENTIAL", planned_disclosure_date: "2026-07-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/disclosures/${d_id}/endorse"
              as: SeniorCounsel
              as_user_id: "senior_1"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "RETURNED" }
              as: IPCounsel
          trigger:
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "DRAFT" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /api/disclosures/${d_id}"
              as: IPCounsel
              captures: { d_draft: $.data.senior_endorsed }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /api/disclosures/${d_id}"
              as: IPCounsel
        assert:
          - "DisclosureRequest.${d_id}.status == SUBMITTED after the revision loop"
          - "d_draft == false (RETURNED -> DRAFT reset the endorsement)"
          - "DisclosureRequest.${d_id}.pinned_asset_version == SecretAsset.${a_id}.version (re-pinned on second SUBMITTED)"
          - "DisclosureRequest.${d_id}.risk_score_provisional == 20 (30 - 10) recomputed on resubmission"

      - name: grant_suspend_restore_cycle
        grounds:
          - state_machines.AccessGrant.PROVISIONED_to_SUSPENDED
          - state_machines.AccessGrant.SUSPENDED_to_PROVISIONED
          - entities.SecretAsset.fields.active_grant_count
        distinguishing_aspect: |
          Cycle on AccessGrant: PROVISIONED -> SUSPENDED -> PROVISIONED during an
          incident; SUSPENDED remains inside the active set, so the asset's
          active_grant_count never leaves 1 across the loop.
        test_recipe:
          setup:
            - "ACTIVE employee with completed BASIC_TS and signed ack; REGISTERED CONFIDENTIAL asset; grant approved and provisioned"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Ivy Ops", email: "ivy@x.com", department: "OPS", role_title: "Operator", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "GET /api/training-assignments"
              payload: { employee_id: "${emp_id}", module: "BASIC_TS" }
              as: HRPartner
              captures: { tr_id: "$.data[0].id" }
            - call: "POST /api/training-assignments/${tr_id}/state"
              payload: { to_status: "COMPLETED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/assets"
              payload: { title: "Line-stoppage playbook", description: "plant ops", classification: "CONFIDENTIAL", owner_department: "OPS", exposure_estimate_cents: 80000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/grants"
              payload: { employee_id: "${emp_id}", asset_id: "${a_id}", justification: "On-call duty", expires_at: "2026-12-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { g_id: $.data.id }
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "APPROVED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "PROVISIONED" }
              as: SecurityOfficer
          trigger:
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "SUSPENDED" }
              as: SecurityOfficer
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { cnt_susp: $.data.active_grant_count }
            - call: "POST /api/grants/${g_id}/state"
              payload: { to_status: "PROVISIONED" }
              as: SecurityOfficer
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
        assert:
          - "AccessGrant.${g_id}.status == PROVISIONED after the suspend/restore loop"
          - "cnt_susp == 1 (SUSPENDED still counts as active)"
          - "SecretAsset.${a_id}.active_grant_count == 1 (loop conserves the count)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (3 instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_critical_finding_lapses_measure_returns_disclosure
        grounds:
          - state_machines.CleanDeskAudit.SCHEDULED_to_CONDUCTED
          - state_machines.ReasonableMeasure.VERIFIED_to_LAPSED
          - calculations.reasonable_measures_score
          - state_machines.DisclosureRequest.UNDER_REVIEW_to_RETURNED
        distinguishing_aspect: |
          Depth-3 chain from a single CONDUCT trigger: audit CONDUCTED with
          critical_findings=1 lapses the linked PHYSICAL measure (link 1);
          that lapse recomputes the asset score 50 -> 35 and drops
          protection_posture to DEFICIENT (link 2); the DEFICIENT posture then
          auto-RETURNs the asset's UNDER_REVIEW disclosure (link 3). Each link
          is caused by the previous link, not by the audit call directly.
        test_recipe:
          setup:
            - "Asset with TECHNICAL(25)+POLICY(10)+PHYSICAL(15) all VERIFIED (score 50, ADEQUATE); ACTIVE NDA; disclosure UNDER_REVIEW on the asset"
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Annealing schedule", description: "furnace recipe", classification: "RESTRICTED", owner_department: "MFG", exposure_estimate_cents: 700000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "SCADA lockdown", evidence_uri: "s3://ev/scada.pdf" }
              as: SecurityOfficer
              captures: { m_tech: $.data.id }
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_tech}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "POLICY", title: "Floor policy", evidence_uri: "s3://ev/pol.pdf" }
              as: SecurityOfficer
              captures: { m_pol: $.data.id }
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_pol}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "PHYSICAL", title: "Cage locks", evidence_uri: "s3://ev/cage.pdf" }
              as: SecurityOfficer
              captures: { m_phy: $.data.id }
            - call: "POST /api/measures/${m_phy}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m_phy}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/counterparties"
              payload: { legal_name: "Zeta Furnaces", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t6", governing_law: "OH", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 6, classification_ceiling: "CROWN_JEWEL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "POST /api/employees"
              payload: { full_name: "Kara Plant", email: "kara@x.com", department: "MFG", role_title: "Lead", access_clearance: "ELEVATED", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "POST /api/disclosures"
              payload: { asset_id: "${a_id}", nda_id: "${nda_id}", purpose: "Maintenance support", marking_protocol: "STAMPED_CONFIDENTIAL", planned_disclosure_date: "2026-07-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/disclosures/${d_id}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: IPCounsel
            - call: "POST /api/clean-desk-audits"
              payload: { department: "MFG", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: SecurityOfficer
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /api/clean-desk-audits/${aud_id}/state"
              payload: { to_status: "CONDUCTED", findings_count: 3, critical_findings: 1, linked_measure_ids: ["${m_phy}"] }
              as: SecurityOfficer
            - call: "GET /api/measures/${m_phy}"
              as: IPCounsel
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
            - call: "GET /api/disclosures/${d_id}"
              as: IPCounsel
        assert:
          - "ReasonableMeasure.${m_phy}.status == LAPSED (link 1: audit conduct)"
          - "SecretAsset.${a_id}.score_operational == 35 (25 + 10 + 0) (link 2: recompute)"
          - "SecretAsset.${a_id}.protection_posture == DEFICIENT (35 < 40)"
          - "DisclosureRequest.${d_id}.status == RETURNED (link 3: posture cascade)"
          - "ReasonableMeasure.${m_tech}.status == VERIFIED and ${m_pol}.status == VERIFIED (unlinked measures untouched)"

      - name: policy_publish_supersedes_and_reissues_acks
        grounds:
          - state_machines.Acknowledgment.SIGNED_to_SUPERSEDED
          - state_machines.Acknowledgment.PENDING_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-2 chain from POST /api/program/policy/publish: the publish
          supersedes the employee's SIGNED v1 acknowledgment (link 1); the
          supersede then causes creation of a fresh PENDING v2 acknowledgment
          for every PREBOARDING/ACTIVE/NOTICE employee (link 2). Different
          trigger from the audit cascade.
        test_recipe:
          setup:
            - "One ACTIVE employee with a SIGNED v1 acknowledgment"
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Liam Hires", email: "liam@x.com", department: "HR", role_title: "Coordinator", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_v1: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_v1}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
          trigger:
            - call: "POST /api/program/policy/publish"
              payload: { new_version: "v2" }
              as: IPCounsel
              captures: { pub: $.data }
            - call: "GET /api/acknowledgments/${ack_v1}"
              as: HRPartner
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_v2: "$.data[0].id" }
        assert:
          - "publish response superseded_count == 1 and reissued_count == 1"
          - "Acknowledgment.${ack_v1}.status == SUPERSEDED (link 1)"
          - "Acknowledgment.${ack_v2}.policy_version == v2 and status == PENDING (link 2: reissue)"
          - "Employee.${emp_id}.status == ACTIVE (publish does not deactivate; gate applies only at transition)"

      - name: counterparty_bar_terminates_nda_anchors_obligation
        grounds:
          - state_machines.Counterparty.ACTIVE_to_BARRED
          - state_machines.NdaAgreement.ACTIVE_to_TERMINATED
          - calculations.return_obligation_anchor
        distinguishing_aspect: |
          Depth-3 chain from the BAR trigger: counterparty BARRED terminates its
          ACTIVE NDA (link 1); the termination anchors the PENDING
          RETURN_OR_DESTROY obligation's due_at to terminated_at + 30 days
          (link 2) and rejects the UNDER_REVIEW disclosure riding on that NDA
          (link 2'). With the clock pinned at 2026-06-15, due_at becomes the
          literal 2026-07-15T00:00:00Z.
        test_recipe:
          setup:
            - "Counterparty ACTIVE with ACTIVE NDA carrying a PENDING RETURN_OR_DESTROY obligation (due_at null) and an UNDER_REVIEW disclosure; clock at 2026-06-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Theta Recycling", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t7", governing_law: "IL", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z", survival_months: 12, classification_ceiling: "RESTRICTED" }
              as: IPCounsel
