        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["proposal-accept-stale-component"]
          - validations[priority=9]
          - errors[ERR_STALE_COMPONENT_VERSION]
          - endpoints["POST /design-system/contribution-proposals/{id}/accept"]
        distinguishing_aspect: |
          The OCC field guards a read-modify-write window that no state check can see: the
          proposal is genuinely READY_FOR_ACCEPTANCE with complete evidence and a fresh pinned
          token set, and the only thing wrong is that a dependency edge was added to the target
          component after the lead read its version. That must answer ERR_STALE_COMPONENT_VERSION
          at 412 (not 409, not 422), leave the proposal in READY_FOR_ACCEPTANCE, and the retry
          with the re-read version must then succeed - proving the version is a real precondition
          and not a stored constant.
