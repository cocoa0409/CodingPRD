          setup:
            - "Department 'Meat 41' at default config; GRD80 (GROUND) exists; GrindRun GR1 was SCHEDULED and then ABORTED with a reason, holding no inputs."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:00:00Z", scheduled_end_at: "2026-08-06T07:00:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr1_id: $.data.id }
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "ABORT", abort_reason: "grinder pulled for scheduled maintenance" }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "START" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_start: $.data.error_id }
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "ABORT", abort_reason: "second attempt" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_abort: $.data.error_id }
          assert:
            - "${err_start} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "${err_abort} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "GrindRun.${gr1_id}.status == ABORTED with abort_reason == 'grinder pulled for scheduled maintenance' (not overwritten) and started_by_user_id unset"

      - name: case_failure_escalate_before_window_elapses_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CaseFailure.OPEN_to_ESCALATED
          - calculations.case_posture_derivation.constants.ESCALATION_MINUTES
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "ESCALATE requires clock >= opened_at + 240 minutes inclusive: at opened_at + 239 minutes it returns ERR_INVALID_STATE_TRANSITION (409), and at exactly opened_at + 240 minutes it succeeds and stamps escalated_at while the department stays SALES_HALTED."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Two out-of-spec readings (4.5 then 4.6 C) on CASE-A opened CaseFailure CF1 at 2026-08-05T08:00:00Z; posture is SALES_HALTED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "GET /meat-ops/case-failures"
              payload: { department_id: "${dept_id}", status: "OPEN" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cf1_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T11:59:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/case-failures/${cf1_id}/transitions"
              payload: { action: "ESCALATE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/case-failures/${cf1_id}/transitions"
              payload: { action: "ESCALATE" }
              as: MeatManager
              as_user_id: "mgr-01"
          assert:
            - "CaseFailure.${cf1_id}.opened_at == 2026-08-05T08:00:00Z"
            - "${err_early} == ERR_INVALID_STATE_TRANSITION with HTTP 409 at 11:59Z (239 minutes elapsed)"
            - "CaseFailure.${cf1_id}.status == OPEN and escalated_at unset after the refusal"
            - "At 12:00Z the ESCALATE returns 200: CaseFailure.${cf1_id}.status == ESCALATED with escalated_at == 2026-08-05T12:00:00Z"
            - "Department.${dept_id}.case_posture == SALES_HALTED and open_case_failure_count == 1 (ESCALATED still counts as open)"

      - name: case_failure_reopen_cycle_rehalts_the_department
        claim_type: cyclic
        grounds:
          - state_machines.CaseFailure.OPEN_to_CONTAINED
          - state_machines.CaseFailure.CONTAINED_to_OPEN
          - entities.CaseFailure.fields.reopen_count
          - entities.CaseFailure.fields.peak_reading_c
          - calculations.case_posture_derivation
        distinguishing_aspect: "The CONTAINED -> OPEN edge is driven by a new out-of-spec reading on the same case_code, not by an operator action: reopen_count goes 0 -> 1, peak_reading_c refreshes from 4.6 to 5.1, and the department returns from SALES_RESTRICTED to SALES_HALTED with open_case_failure_count 1 and contained_case_failure_count 0."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Readings 4.5 then 4.6 C on CASE-A opened CaseFailure CF1 (peak 4.6); the cutter then CONTAINed it, so posture is SALES_RESTRICTED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "GET /meat-ops/case-failures"
              payload: { department_id: "${dept_id}", status: "OPEN" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cf1_id: "$.data[0].id" }
            - call: "POST /meat-ops/case-failures/${cf1_id}/transitions"
              payload: { action: "CONTAIN", containment_note: "product transferred to backup case; unit iced down" }
              as: MeatCutter
              as_user_id: "cutter-01"
          trigger:
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 5.1 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_reopen: $.data.id }
          assert:
            - "Before the trigger: CaseFailure.${cf1_id}.status == CONTAINED, reopen_count == 0, peak_reading_c == 4.6, Department.${dept_id}.case_posture == SALES_RESTRICTED with contained_case_failure_count == 1"
            - "TemperatureLog.${tlog_reopen}.out_of_spec == true and consecutive_index == 2 (capped at CONSECUTIVE_FAILURE_THRESHOLD)"
            - "CaseFailure.${cf1_id}.status == OPEN with reopen_count == 1 and peak_reading_c == 5.1"
            - "No second CaseFailure row is created: GET /meat-ops/case-failures filtered by department_id ${dept_id} returns total_count == 1"
            - "Department.${dept_id}.case_posture == SALES_HALTED with open_case_failure_count == 1 and contained_case_failure_count == 0"

