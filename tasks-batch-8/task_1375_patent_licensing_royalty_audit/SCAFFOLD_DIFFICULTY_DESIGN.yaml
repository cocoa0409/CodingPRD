            - "captured l_bal == 11000 and captured ag_cum == 220000 (100000 + 120000)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_triggers_milestone_fee_accrual
        grounds:
          - state_machines.RoyaltyReport.VALIDATED_to_ACCEPTED
          - state_machines.Milestone.PENDING_to_ACHIEVED
          - calculations.milestone_trigger_check
        distinguishing_aspect: |
          Depth-3 chain triggered by report acceptance: accept mutates
          LicenseAgreement.cumulative_accepted_base_cents (hop 1); the crossed
          threshold flips Milestone PENDING -> ACHIEVED (hop 2, caused by hop 1);
          achievement accrues fee_cents to Licensee.outstanding_balance_cents
          (hop 3, caused by hop 2). Balance = 10000 + 7500 + 25000 = 42500.
        test_recipe:
          setup:
            - "AG ACTIVE 500 bp min 0; CUMULATIVE_SALES milestone threshold 300000 fee 25000"
            - "R1 net 200000 accepted (cumulative 200000, still PENDING)"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Chain Co", tax_id: "TAX-CH-1", contact_email: "ch@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-70700-F1"
                title: "Chain"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/milestones"
              payload: { agreement_id: "${ag_id}", name: "Sales 300k", trigger_type: CUMULATIVE_SALES, threshold_cents: 300000, fee_cents: 25000 }
              as: LicensingAnalyst
              captures: { ms_id: $.data.id }
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-01-01T00:00:00Z"
                period_end: "2026-01-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 20, gross_sales_cents: 200000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-02-01T00:00:00Z"
                period_end: "2026-02-28T00:00:00Z"
                lines: [ { product_label: "B", units_sold: 15, gross_sales_cents: 150000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r2_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports/${r2_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: LicensingAnalyst
              captures: { ag_cum: $.data.cumulative_accepted_base_cents }
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l_bal: $.data.outstanding_balance_cents }
          assert:
            - "captured ag_cum == 350000 (hop 1: cumulative crossed the 300000 threshold)"
            - "Milestone ${ms_id}.status == ACHIEVED (hop 2, caused by hop 1's cumulative update)"
            - "captured l_bal == 42500 (hop 3: 10000 + 7500 royalties + 25000 milestone fee)"
      - name: mfl_activation_credit_chain
        grounds:
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
          - calculations.mfl_adjustment_calculation
          - entities.Licensee.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-2 chain triggered by a DIFFERENT transition (lifecycle ACTIVATE,
          not report acceptance): activation mutates the other agreement's MFL
          fields (hop 1: last_mfl_credit_cents/mfl_adjusted_rate_bp); the credit
          then mutates Licensee.credit_balance_cents (hop 2, caused by hop 1).
        test_recipe:
          setup:
            - "L1/M1 ACTIVE patent US-80800-G1 at 500 bp, MFL RETROACTIVE lookback 4, one accepted report final 50000"
            - "L2/N DRAFT same patent at 400 bp"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Old Co", tax_id: "TAX-OLD-1", contact_email: "o@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Cheap Co", tax_id: "TAX-CHP-1", contact_email: "cheap@x.test" }
              as: LicensingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-80800-G1"
                title: "M1"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                mfl_clause: true
                mfl_mode: RETROACTIVE
                mfl_lookback_quarters: 4
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { m1_id: $.data.id }
            - call: "POST /licensing/license-agreements/${m1_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${m1_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 100, gross_sales_cents: 1000000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l2_id}"
                patent_reference: "US-80800-G1"
                title: "N"
                royalty_base_definition: NET_SALES
                base_rate_bp: 400
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Bob", share_bp: 10000 } ]
                effective_date: "2026-06-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /licensing/license-agreements/${n_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "GET /licensing/license-agreements/${m1_id}"
              as: LicensingAnalyst
              captures: { m1_rate: $.data.mfl_adjusted_rate_bp, m1_credit: $.data.last_mfl_credit_cents }
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l1_credit: $.data.credit_balance_cents }
          assert:
            - "captured m1_credit == 10000 (hop 1: 50000 - recomputed 40000 at the new 400 bp rate)"
            - "captured m1_rate == 400 (hop 1: point-forward re-rate)"
            - "captured l1_credit == 10000 (hop 2: licensee credit mutated as a consequence of hop 1)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_constraint_on_report_create
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Category pair {state, business_constraint}: one create violates both
          ERR_AGREEMENT_NOT_ACTIVE (agreement TERMINATED) and
          ERR_REPORT_PERIOD_OVERLAP (period collides with an ACCEPTED report);
          priority 7 state beats priority 10 constraint.
        test_recipe:
          setup:
            - "AG with ACCEPTED report over [2026-02-01, 2026-02-28]; agreement then TERMINATED; licensee stays ACTIVE"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Prio Co", tax_id: "TAX-PR-1", contact_email: "pr@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-90900-H1"
