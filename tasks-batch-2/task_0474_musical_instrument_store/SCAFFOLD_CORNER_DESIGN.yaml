  # ===========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_unit_forbidden
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Customer calling POST /units -> ERR_FORBIDDEN (403); only SalesAssociate/StoreManager may add stock."
        test_recipe:
          setup: ["A Customer C exists to act as."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Rb1", email: "crb1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { model_name: "Rb1 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-RB1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN"

      - name: sales_associate_cannot_approve_financing_forbidden
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]", state_machines.FinancingApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "A SalesAssociate calling financing approve -> ERR_FORBIDDEN (403); approval is StoreManager-exclusive."
        test_recipe:
          setup: ["Customer C (score 740), FinancingApplication F SUBMITTED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Rb2", email: "crb2@x.com", credit_score: 740 }
