          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/pay-starter-kit"
            payload: { amount_cents: 11129, payment_reference: "KIT-PAY-A" }
            as: PlatformAdmin
          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/approve"
            payload: {}
            as: ComplianceOfficer
            captures: { cons_a_id: "$.data.id" }
          - call: "POST /direct-selling/product-orders"
            payload: { consultant_id: "${cons_a_id}", order_type: "PERSONAL_INVENTORY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${serum_id}", quantity: 30 } ] }
            as: PlatformAdmin
            captures: { o1_id: "$.data.id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/pay"
            payload: { amount_cents: 69900, payment_reference: "PAY-O1_ID" }
            as: PlatformAdmin
          trigger:
          - call: "POST /direct-selling/qualification-periods/${p8_id}/lock"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { v_lock: "$.data.version", s_lock: "$.data.status" }
          - call: "POST /direct-selling/commission-runs"
            payload: { qualification_period_id: "${p8_id}", expected_qualification_period_version: "${v_lock}" }
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { e_notclosed: "$.data.error_id" }
          - call: "POST /direct-selling/qualification-periods/${p8_id}/close"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { v_close: "$.data.version" }
          - call: "POST /direct-selling/commission-runs"
            payload: { qualification_period_id: "${p8_id}", expected_qualification_period_version: "${v_lock}" }
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { e_stale: "$.data.error_id" }
          - call: "POST /direct-selling/commission-runs"
            payload: { qualification_period_id: "${p8_id}", expected_qualification_period_version: "${v_close}" }
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { run_id: "$.data.id", run_period: "$.data.period_code" }
          - call: "GET /direct-selling/qualification-periods/${p8_id}"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { v_after: "$.data.version" }
          assert:
            - "s_lock == LOCKED and v_lock == v_close - 1: the close transition is itself a write and bumps the period version, which is what makes an analyst's cached version stale"
            - "e_notclosed == ERR_PERIOD_NOT_CLOSED with HTTP 409 while the period is only LOCKED, even though the version supplied was correct at that moment"
            - "e_stale == ERR_STALE_PERIOD_VERSION with HTTP 412 when the pre-close version is replayed against a now-CLOSED period: the state check passes and only the version check fails"
            - "the same call with v_close succeeds, returning run_period == 2026-08 denormalized from the period"
            - "v_after == v_close + 1: creating the run increments the period version again, so a second analyst holding v_close is now stale in turn"

      - name: drafting_a_disclosure_consumes_the_run_version_it_quoted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stale-run-version-on-disclosure-draft]", "complexity_profile.complexity_layers.optimistic_concurrency", "state_machines.IncomeDisclosureStatement.transitions"]
        distinguishing_aspect: "Creating a disclosure increments the run version as a side effect, so an identical replay is refused even though nothing about the run changed."
        test_recipe:
          setup:
            - "Mini fixture with a PAID run over one 99-point consultant (paid_total_cents 0, one CARRIED_FORWARD statement)."
            - "This exercises concurrency_rules entry stale-run-version-on-disclosure-draft, whose occ_field is expected_commission_run_version and whose write_endpoint is POST /direct-selling/income-disclosure-statements."
