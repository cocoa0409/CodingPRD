              captures: { w_alt_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_alt_id}", reach_code: "A_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { a_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_alt_id}", reach_code: "A_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9500, downstream_reach_id: "${a_out_id}" }
              as: TmdlAnalyst
              captures: { a_mid_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_alt_id}", assessment_code: "TMDL-N-ALT", loading_capacity_lbs_yr: 50000.00, margin_of_safety_pct: 0.0750, background_load_lbs_yr: 4321.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_alt_id: $.data.id, t_alt_ver: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_alt_id}", reach_id: "${a_mid_id}", source_name: "Point One", source_type: "POINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { alt_p1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_alt_id}", reach_id: "${a_mid_id}", source_name: "Point Two", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { alt_p2_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_alt_id}", reach_id: "${a_mid_id}", source_name: "Point Three", source_type: "POINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { alt_p3_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_alt_id}", reach_id: "${a_mid_id}", source_name: "Alt Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 40000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { alt_n1_id: $.data.id }
          trigger:
            - call: "POST /tmdl-assessments/${t_alt_id}/allocation-runs"
              payload: { run_label: "RUN-ALT-1", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_alt_ver}" }
              as: TmdlAnalyst
              captures: { alt_run_id: $.data.id }
          assert:
            - "AllocationRun.${alt_run_id}.margin_of_safety_lbs_yr == 3750.00"
            - "AllocationRun.${alt_run_id}.effective_background_lbs_yr == 4321.00"
            - "AllocationRun.${alt_run_id}.allocable_load_lbs_yr == 41929.00"
            - "AllocationRun.${alt_run_id}.point_pool_lbs_yr == 23899.53"
            - "AllocationRun.${alt_run_id}.nonpoint_pool_lbs_yr == 15933.02"
            - "SourceAssessment.${alt_p1_id}.allocated_load_lbs_yr == 3983.26"
            - "SourceAssessment.${alt_p2_id}.allocated_load_lbs_yr == 7966.51"
            - "SourceAssessment.${alt_p3_id}.allocated_load_lbs_yr == 11949.77"
            - "SourceAssessment.${alt_n1_id}.allocated_load_lbs_yr == 15933.02"
            - "AllocationRun.${alt_run_id}.wla_total_lbs_yr == 23899.54"
            - "AllocationRun.${alt_run_id}.wla_total_lbs_yr != 23899.53"
            - "AllocationRun.${alt_run_id}.la_total_lbs_yr == 15933.02"
            - "AllocationRun.${alt_run_id}.reserve_allocation_lbs_yr == 2096.44"
            - "AllocationRun.${alt_run_id}.included_source_count == 4"
            - "3750.00 + 4321.00 + 23899.54 + 15933.02 + 2096.44 == 50000.00 (load conservation holds exactly)"
            - "Watershed.${w_alt_id}.reserve_pool_lbs == 2096.44"

  - rule_id: non_linear_state_machine
    instances:
      - name: tmdl_public_comment_revision_loop_twice_then_approval_only_from_public_comment
        grounds:
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_REVISION
          - state_machines.TmdlAssessment.REVISION_to_PUBLIC_COMMENT
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_APPROVED
          - entities.TmdlAssessment.fields.revision_round
          - validations[priority=11]
        distinguishing_aspect: |
          This is the CYCLIC shape: PUBLIC_COMMENT -> REVISION -> PUBLIC_COMMENT can be
          traversed repeatedly and revision_round counts exactly the PUBLIC_COMMENT ->
          REVISION edges (2 after two loops), while the exit edge to APPROVED exists ONLY
          from PUBLIC_COMMENT, so the same target_status=APPROVED payload that succeeds from
          PUBLIC_COMMENT is rejected with ERR_INVALID_STATE from REVISION.
        test_recipe:
          setup:
            - "Watershed SCR with reaches R_OUT / R_MID / R_UP as in the base topology."
            - "TmdlAssessment TMDL-P-2026 in DRAFT with revision_round 0 and the four standard sources, plus one ACTIVE PRO_RATA_BY_EXISTING_LOAD allocation run so that approval is not blocked by ERR_WLA_NOT_ALLOCATED."
            - "The assessment is walked DRAFT -> PUBLIC_COMMENT -> REVISION -> PUBLIC_COMMENT -> REVISION, so it sits in REVISION with revision_round 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Pasture", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.3000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-PROVISIONAL", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "REVISION", reason: "First comment period produced substantive objections." }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "REVISION", reason: "Second comment period produced further objections." }
              as: TmdlAnalyst
          trigger:
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
          assert:
            - "trigger call 1 responds 409 with data.error_id == ERR_INVALID_STATE because APPROVED is not reachable from REVISION"
            - "after trigger call 1, TmdlAssessment.${t_id}.status == REVISION and TmdlAssessment.${t_id}.approved_at is null"
            - "trigger call 2 responds 200 and TmdlAssessment.${t_id}.status == PUBLIC_COMMENT"
            - "after trigger call 2, TmdlAssessment.${t_id}.revision_round == 2 (unchanged: the counter advances only on PUBLIC_COMMENT -> REVISION)"
            - "trigger call 3 responds 200 and TmdlAssessment.${t_id}.status == APPROVED"
            - "TmdlAssessment.${t_id}.approved_at == 2026-06-15T00:00:00Z"
            - "Watershed.${w_id}.program_status == ACTIVE"
            - "Watershed.${w_id}.trading_enabled == true"

