            - "rider.version is still 2: the rejected replay produced no write at all."

      - name: ticketing_dimension_advances_while_clearance_stays_unassessed
        claim_type: parallel_dimensions
        grounds:
          - "complexity_profile.state_machine_shape: parallel."
          - "§1.2 declares three independent Engagement dimensions; TICKETING_UNSET -> TIERS_DRAFT is triggered by POST /engagements/{id}/price-tiers and requires lifecycle_status IN {DRAFT, CONFIRMED}."
          - "§1.5 POST /engagements/{id}/price-tiers explicitly does NOT increment Engagement.version."
        distinguishing_aspect: >-
          The only instance that asserts a legal COMBINATION of dimension values
          - (DRAFT, UNASSESSED, TIERS_DRAFT) - and pins the negative half of the
          independence claim: advancing ticketing must not touch lifecycle,
          clearance, risk figures or the engagement's version counter.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' exist; a DRAFT PRESENTED engagement (2026-10-11 performance) exists at version 1 with financial_clearance UNASSESSED and ticketing_status TICKETING_UNSET."
