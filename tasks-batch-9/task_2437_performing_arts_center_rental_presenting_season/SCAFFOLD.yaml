      - "GET /engagements"
      - "GET /engagements/{id}/fee-negotiations"
      - "GET /engagements/{id}/labor-calls"
      - "GET /engagements/{id}/price-tiers"
      - "GET /price-tiers/{id}"
      - "GET /price-tiers/{id}/ticket-sales"
      - "GET /engagements/{id}/settlements"
