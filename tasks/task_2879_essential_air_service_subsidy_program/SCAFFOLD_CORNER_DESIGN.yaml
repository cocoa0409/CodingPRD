              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/service-periods"
              payload: { agreement_id: "${agr_id}", period_month: "2026-08" }
              as: ProgramAdmin
              captures: { per1_id: $.data.id }
            - call: "POST /eas/service-periods/${per1_id}/report"
              payload: { scheduled_departures: 100, completed_departures: 100, cancelled_carrier_departures: 0, cancelled_weather_departures: 0, seats_offered: 1900, passengers_enplaned: 700 }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/service-periods/${per1_id}/certify"
              payload: { certification_note: "half cent case" }
              as: ProgramAdmin
              captures: { pay1_id: $.data.id }
          assert:
            - "EligibilityDetermination.${det1_id}.avg_daily_enplanements == 16.99 (6200/365 == 16.9863 rounded half up)"
            - "Proposal.${p1_id}.projected_annual_passengers == 8892 and subsidy_per_passenger_usd == 134.95 (1200000.06/8892 == 134.9527...)"
            - "ServiceAgreement.${agr_id}.annual_subsidy_usd == 1200000.06 and total_committed_usd == round(1200000.06 * 12 / 12, 2) == 1200000.06"
            - "SubsidyPayment.${pay1_id}.monthly_entitlement_usd == 100000.01, not 100000.00 — 1200000.06/12 is exactly 100000.005 and the rounding mode is round_half_up"
            - "SubsidyPayment.${pay1_id}.per_departure_rate_usd == round(100000.01 / 100, 2) == 1000.00"
            - "SubsidyPayment.${pay1_id}.gross_subsidy_usd == round(1000.00 * 100, 2) == 100000.00 and net_payment_usd == 100000.00, i.e. one cent below the entitlement because the rate was rounded before multiplication"
            - "Every money field is serialised with exactly 2 decimal places and every factor field with exactly 4"

      - name: selection_composite_from_weighted_components
        claim_type: weighted_scoring
        grounds:
          - calculations.carrier_selection_ranking
          - calculations.carrier_selection_ranking.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / selection_score_composed_from_prerounded_clamped_components
          rationale: "That instance already pins subsidy_points, service_points and preference_points and the 0.40/0.35/0.25 weighted composite for two candidates, including the pre-round-then-weight ordering and the min(1.0) service clamp."
      - name: payment_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.subsidy_payment_amount.variants
          - endpoints.GET_/eas/service-periods/{id}/payment-preview
        excluded_because:
          difficulty_instance: dual_variant_calc / payment_variant_divergence_on_identical_period_data
          rationale: "That instance already computes both variants over one period and asserts the net figures and the divergence_usd delta reported by the preview endpoint."
      - name: completion_factor_variant_selection_follows_the_basis
        claim_type: variant_selection
        grounds:
          - calculations.carrier_completion_factor.variants
          - entities.PerformanceReview.fields.basis
        excluded_because:
          difficulty_instance: dual_variant_calc / completion_factor_basis_flips_carrier_tier
          rationale: "That instance already runs STRICT and ADJUSTED reviews over the same period set and asserts that the declared basis alone selects the variant and flips the tier and the enforcement action."
      - name: obligation_running_total_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.agreement_obligation_ledger
          - invariants.program_obligation_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reversal_restores_the_obligation_identity
          rationale: "That instance already checks the ledger after a disbursement and again after the reversal, including the premium that is deliberately tracked outside the conserved identity."
      - name: renegotiation_propagates_through_cap_and_floor
        claim_type: constraint_propagation
        grounds:
          - calculations.renegotiated_annual_subsidy
        excluded_because:
          difficulty_instance: combinatorial_formula / fuel_passthrough_nested_cap_then_floor
          rationale: "That instance already drives the fuel pass-through chain through the 80 percent factor, the +15 percent cap and the -5 percent floor and asserts the resulting ceiling."
      - name: departure_counts_replayed_in_report_order
        claim_type: chronological
        grounds:
          - calculations.departure_count_reconciliation
          - invariants.departure_count_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / period_amendment_preserves_the_departure_identity
          rationale: "That instance already replays a report followed by an amendment and asserts the subtract-then-add cumulative counters and the conservation identity after each step."

