      - name: index_precision_depends_on_the_rounding_mode
        claim_type: precision
        grounds:
          - calculations.calculate_balance_chain
          - entities.LoadPlan.fields.rounding_mode
        excluded_because:
          difficulty_instance: combinatorial_formula / index_rounding_order_per_line_vs_sum
          rationale: "That §1.8 instance builds two plans that differ only in rounding_mode and shows PER_LINE_THEN_SUM and SUM_THEN_ROUND landing on different index and %MAC figures from identical rows."

      - name: allowed_payload_waterfall_reports_each_binding_limit_in_turn
        claim_type: waterfall_allocation
        grounds:
          - calculations.calculate_allowed_payload
          - entities.Flight.fields.limiting_factor
          - entities.Flight.fields.allowed_payload_kg
        distinguishing_aspect: |
          Three flights on the same airframe make three different candidates
          bind, so the fixed precedence PERFORMANCE, MTOW, MZFW, MLW, MAX_TAXI
          is exercised rather than assumed: standard fuel at 22 C DRY gives
          20180.00 / MZFW; ramp fuel 14000 gives 16960.00 / MLW because the
          landing candidate 66360 - 42550 - 6850 falls below MZFW; and 30 C on
          a WET runway gives 13020.00 / PERFORMANCE from PLTOW 65120.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) and [30,45) bands, STD-2026, clock 2026-08-15T06:00:00Z; three non-overlapping flights on AC1/R1 at 10:00-12:30, 13:20-15:00 and 15:50-17:30."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
