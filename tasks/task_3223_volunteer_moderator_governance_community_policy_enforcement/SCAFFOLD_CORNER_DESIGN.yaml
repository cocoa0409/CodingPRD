          - validations[priority=2]
          - endpoints.POST_/api/communities/{id}/content-reports
        distinguishing_aspect: "Anonymous has a role entry in §1.7 but holds only read operations, so a write on a moderator-only route reports 403 ERR_FORBIDDEN_ROLE rather than 401."
        test_recipe:
