              as: ClubAdmin
              captures: { dn1: $.data.id }
            - call: "POST /club/donation-requests"
              payload: { school_id: "${s14}", teacher_id: "${t14}", title_id: "${dn1}", qty_requested: 5 }
              as: Teacher
              as_user_id: "${t14}"
              captures: { dr1: $.data.id }
            - call: "POST /club/schools"
              payload: { name: "S15", address: "15 Chestnut Ave", low_income_program: false }
              as: ClubAdmin
              captures: { s15: $.data.id }
            - call: "POST /club/schools/${s15}/enroll-program"
              payload: { enrolled_on: "2026-08-15" }
              as: ClubAdmin
            - call: "POST /club/teachers"
              payload: { school_id: "${s15}", full_name: "T Fifteen", email: "t15@x.com", grade_band: "K_2" }
              as: ClubAdmin
              captures: { t15: $.data.id }
          trigger:
