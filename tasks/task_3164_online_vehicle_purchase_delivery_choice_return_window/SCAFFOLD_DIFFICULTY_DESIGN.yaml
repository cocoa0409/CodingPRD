      - call: POST /vehicle-hub/vehicles/${can_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${can_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${can_cust}
        captures:
          can_ord: $.data.id
      - call: POST /vehicle-hub/orders/${can_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${can_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${can_ord}/structure
        payload:
          financing_id: ${can_pq}
