            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 5, count_female: 5, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
            - call: "POST /api/colonies/${col_id}/transition"
