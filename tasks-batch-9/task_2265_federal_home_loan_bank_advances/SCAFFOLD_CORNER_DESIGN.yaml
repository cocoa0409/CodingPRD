          setup: ["Harbor Savings tier 1, ACTIVE, BLANKET_LIEN, one ELIGIBLE SF_MORTGAGE (lendable 15,600,000); advance O of 950,000 net with fund_stock_from_advance true is approved by credit-officer-1."]
