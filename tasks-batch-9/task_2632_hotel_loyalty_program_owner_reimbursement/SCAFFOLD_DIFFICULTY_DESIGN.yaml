              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 5 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "bnd2@example.com", full_name: "Petra Solberg", enrollment_date: "2026-06-01" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 100000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id, cash_due: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-29", checkout_date: "2026-10-01", expected_hotel_version: "${h_v}" }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_nights: $.data.nights }
            - call: "POST /loyalty/redemptions/${r_id}/confirm"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: ProgramAdministrator
              captures: { est: $.data.estimated_reimbursement_cents }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${h_id}", period_month: "2026-09" }
              as: ProgramAdministrator
              captures: { b_sep: $.data.id }
          trigger:
            - call: "POST /loyalty/reimbursement-batches/${b_sep}/release"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-release-06"
              captures: { err_sep: $.data.error_id }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${h_id}", period_month: "2026-10" }
              as: ProgramAdministrator
              captures: { b_oct: $.data.id }
            - call: "POST /loyalty/reimbursement-batches/${b_oct}/release"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-release-06"
              captures: { oct_gross: $.data.gross_reimbursement_cents }
          assert:
            - "first release: response code 422 and ${err_sep} == ERR_BATCH_NO_ELIGIBLE_ITEMS, even though both occupied nights (2026-09-29 and 2026-09-30) fall inside September"
            - "ReimbursementBatch.${b_sep}.status is still OPEN with item_count 0 and net_payable_cents 0 - a rejected release does not advance or zero the batch"
            - "Redemption.${r_id}.reimbursement_status is still ACCRUED with batch_id null after the failed release"
            - "third call: response code 200, ReimbursementBatch.${b_oct}.status == RELEASED and item_count == 1"
            - "the captured ${r_nights} was 2 and ${est} was 60000: occupancy is exactly 0.95, which meets the >= compression boundary, so the rate is the full 30000 ADR and not round_half_up(30000 * 0.75) == 22500"
            - "${oct_gross} == 60000, delinquency_surcharge_cents == 0 and net_payable_cents == 60000 (fee_offset_base 0)"
            - "Redemption.${r_id}.settled_reimbursement_cents == 60000 and batch_id == ${b_oct}"
            - "the captured ${cash_due} was 110000 (100000 / 1000 * 1250 * (1 - 0.12)) and Member.${m_id}.point_balance == 20000 (100000 - 80000)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complaint_escalation_blocked_because_the_related_delivery_was_honoured_meanwhile
        grounds:
          - validations.priority_52_ERR_DELIVERY_NOT_DENIED
          - state_machines.MemberComplaint.RESOLVED_UPHELD_to_ESCALATED
          - state_machines.EliteBenefitDelivery.DENIED_to_ESCALATED
          - state_machines.EliteBenefitDelivery.ESCALATED_to_DELIVERED
          - calculations.benefit_cost_recovery
          - entities.MemberComplaint.fields.related_delivery_id
        distinguishing_aspect: |
          Entity pair MemberComplaint -> EliteBenefitDelivery: whether a complaint may leave
          RESOLVED_UPHELD depends entirely on a second entity's status, and the two complaints in this
          instance are identical in every field except which delivery they point at. The successful
          arm also drags the delivery through DENIED -> ESCALATED -> DELIVERED, proving the dependency
          is bidirectional rather than a read-only guard.
        test_recipe:
          setup:
            - "One ACTIVE property with trailing_12m_adr_cents 30000, program_fee_pct 0.03 and a qualifying, elite-counting TRANSIENT rate plan."
            - "Stay A: 10 nights, 2026-05-01 to 2026-05-11, room_revenue_cents 300000, posted while the member was BASE - it lifts the member to SILVER and synthesizes no obligations."
            - "Stay B: created after Stay A posted so tier_at_checkin is SILVER: 3 nights, 2026-06-01 to 2026-06-04, room_revenue_cents 60000; its single UPGRADE obligation is DELIVERED by the property."
            - "Stay C: also created at SILVER: 2 nights, 2026-06-10 to 2026-06-12, room_revenue_cents 40000; its single UPGRADE obligation is DENIED by the property."
            - "Complaint 1 (BENEFIT_DENIAL, related_delivery_id = Stay B's delivery) and Complaint 2 (BENEFIT_DENIAL, related_delivery_id = Stay C's delivery), both driven to RESOLVED_UPHELD."
