            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP", sections: [{ strand: "S", item_count: 1, dok_min: 1, dok_max: 4 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-blueprints/${bp}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id }
          trigger:
            - call: "POST /api/validity-dossiers"
              payload: { program_id: "${prog}", form_id: "${f}", dossier_kind: "TECHNICAL_MANUAL", content_md: "too short" }
              as: Psychometrician
