# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Background Actor & Extras Casting. 9 rules x >=2 instances = 19 instances.
# All chains replay from empty DB; clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: voucher_estimate_vs_final_divergence
        grounds:
          - calculations.voucher_gross_final
          - calculations.voucher_gross_estimate
          - entities.Voucher.fields.gross_total_cents
        distinguishing_aspect: |
          Same voucher, same events: the forward-looking estimate (scheduled wrap,
          assumed timely 30m meal, PENDING bumps included) yields 15313 cents while the
          chronological final variant (actual replay, APPROVED bumps only) yields 10938 —
          the two variants diverge on the same entity data; this instance sits in the
          Voucher/pay domain.
        test_recipe:
          setup:
            - "Production ACTIVE; NONUNION actor ELIGIBLE; call (union_slots 0, nonunion_slots 1, nonunion_rate_cents 10000, duration 600m, call 2026-08-10T07:00:00Z) SHOOTING"
            - "Booking CONFIRMED; CHECK_IN 07:00; timely meal 12:00-12:30; WRAP_OUT 16:00; voucher DRAFT exists; PENDING bump of 2500 on the voucher"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film X", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "Nu One", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 3", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T12:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_IN", occurred_at: "2026-08-10T12:30:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bk}" }, as: CastingAssociate, captures: { vc: "$.data[0].id" } }
            - { call: "POST /central-casting/bump-adjustments", payload: { voucher_id: "${vc}", category: "WARDROBE_OWN", amount_cents: 2500 }, as: CastingAssociate, as_user_id: "assoc-1" }
          trigger:
            - { call: "GET /central-casting/vouchers/${vc}/estimate", payload: {}, as: CastingAssociate, captures: { est: $.data.estimated_gross_cents } }
            - { call: "POST /central-casting/vouchers/${vc}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1", captures: { fin: $.data.gross_total_cents, fin_bumps: $.data.bumps_total_cents, fin_net: $.data.net_work_minutes } }
          assert:
            - "estimate $.data.estimated_gross_cents == 15313  (base 10000 + ot1 2813 on scheduled 570 net minutes + PENDING bump 2500)"
            - "issued Voucher.${vc}.gross_total_cents == 10938  (base 10000 + ot1 938 on actual 510 net minutes; PENDING bump excluded)"
            - "Voucher.${vc}.bumps_total_cents == 0"
            - "Voucher.${vc}.net_work_minutes == 510"
            - "${est} != ${fin}"
      - name: union_ratio_projected_vs_actual_divergence
        grounds:
          - calculations.union_ratio_projected
          - calculations.union_ratio_actual
          - entities.CastingCall.fields.projected_compliant
          - entities.CastingCall.fields.actual_compliant
        distinguishing_aspect: |
          Different entity domain from the voucher instance (CastingCall compliance):
          lock-time projected_compliant (inclusion set OFFERED|CONFIRMED|CHECKED_IN|WRAPPED)
          stays frozen true, while wrap-time actual_compliant (set CHECKED_IN|WRAPPED)
          computes false after a no-show — same roster, two valid inclusion sets,
          production compliance_index drops to 85.
        test_recipe:
          setup:
            - "Production ACTIVE; SAG_AFTRA actor ELIGIBLE; call (union_slots 1, nonunion_slots 0) LOCKED with projected_compliant true"
            - "Call SHOOTING on 2026-08-10; the confirmed union booking is marked NO_SHOW at 08:05; replacement case expired"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film Y", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U One", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 4", union_slots: 1, nonunion_slots: 0, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector, captures: { lock_pc: $.data.projected_compliant } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:05:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/mark-no-show", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/replacement-cases", payload: { casting_call_id: "${cc}" }, as: CastingAssociate, captures: { rc: "$.data[0].id" } }
            - { call: "POST /central-casting/replacement-cases/${rc}/expire", payload: {}, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/casting-calls/${cc}/wrap", payload: {}, as: CastingAssociate, captures: { ac: $.data.actual_compliant, auc: $.data.actual_union_checkins, pc: $.data.projected_compliant } }
            - { call: "GET /central-casting/productions/${prod}", payload: {}, as: CastingDirector, captures: { cix: $.data.compliance_index } }
          assert:
            - "CastingCall.${cc}.projected_compliant == true   (frozen lock-time verdict)"
            - "CastingCall.${cc}.actual_compliant == false     (wrap-time verdict on CHECKED_IN|WRAPPED)"
            - "CastingCall.${cc}.actual_union_checkins == 0"
            - "Production.${prod}.compliance_index == 85       (100 - 15 noncompliant wrap penalty)"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_overtime_branch_by_union_status
        grounds:
          - calculations.voucher_gross_final
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: identical event timelines
          (net 601 minutes, equal 9600-cent day rates) pay a SAG_AFTRA booking 13240
          (tier1 capped at 120m, tier2 from 600m) but a NONUNION booking 13230
          (tier1 cap 240m, tier2 from 720m) — the union-status branch changes tier
          boundaries and the result.
        test_recipe:
          setup:
            - "Production ACTIVE; one SAG_AFTRA and one NONUNION actor ELIGIBLE; call (union_slots 1, nonunion_slots 1, both rates 9600, duration 720) SHOOTING on 2026-08-10"
            - "Both bookings CONFIRMED, CHECK_IN 07:00, timely meal 12:00-12:30, WRAP_OUT 17:31 (net 601)"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film T", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U Tier", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { actU: $.data.id } }
            - { call: "POST /central-casting/actors/${actU}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Tier", union_status: "NONUNION" }, as: AgencyAdmin, captures: { actN: $.data.id } }
            - { call: "POST /central-casting/actors/${actN}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 720, location: "Lot 5", union_slots: 1, nonunion_slots: 1, union_rate_cents: 9600, nonunion_rate_cents: 9600 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actU}" }, as: CastingAssociate, captures: { bkU: $.data.id } }
            - { call: "POST /central-casting/bookings/${bkU}/accept", payload: {}, as: BackgroundActor, as_user_id: "${actU}" }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actN}" }, as: CastingAssociate, captures: { bkN: $.data.id } }
            - { call: "POST /central-casting/bookings/${bkN}/accept", payload: {}, as: BackgroundActor, as_user_id: "${actN}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bkU}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/bookings/${bkN}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkU}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T12:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkU}", event_type: "MEAL_IN", occurred_at: "2026-08-10T12:30:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkN}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T12:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkN}", event_type: "MEAL_IN", occurred_at: "2026-08-10T12:30:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:31:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bkU}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/bookings/${bkN}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bkU}" }, as: CastingAssociate, captures: { vcU: "$.data[0].id" } }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bkN}" }, as: CastingAssociate, captures: { vcN: "$.data[0].id" } }
          trigger:
            - { call: "POST /central-casting/vouchers/${vcU}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1", captures: { gU: $.data.gross_total_cents, t1U: $.data.ot_tier1_minutes, t2U: $.data.ot_tier2_minutes, netU: $.data.net_work_minutes } }
            - { call: "POST /central-casting/vouchers/${vcN}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1", captures: { gN: $.data.gross_total_cents, t1N: $.data.ot_tier1_minutes, t2N: $.data.ot_tier2_minutes, netN: $.data.net_work_minutes } }
          assert:
            - "Voucher.${vcU}.net_work_minutes == 601 and Voucher.${vcN}.net_work_minutes == 601 (identical inputs)"
            - "Voucher.${vcU}.ot_tier1_minutes == 120 and Voucher.${vcU}.ot_tier2_minutes == 1"
            - "Voucher.${vcN}.ot_tier1_minutes == 121 and Voucher.${vcN}.ot_tier2_minutes == 0"
            - "Voucher.${vcU}.gross_total_cents == 13240  (9600 + 3600 + 40)"
            - "Voucher.${vcN}.gross_total_cents == 13230  (9600 + 3630)"
      - name: per_component_rounding_then_sum
        grounds:
          - calculations.voucher_gross_final
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: at nonunion rate 10005 (hourly
          1250.625), net 504 with one penalty yields per-component halves
          750.375->750 and 625.3125->625 summing to 11380, whereas sum-then-round
          yields 11381; the scaffold pins per-component-then-sum and the test must
          observe exactly 11380.
        test_recipe:
          setup:
            - "Production ACTIVE; NONUNION actor ELIGIBLE; call (union_slots 0, nonunion_slots 1, nonunion_rate_cents 10005) SHOOTING"
            - "Booking CONFIRMED; CHECK_IN 07:00; LATE meal 13:01-13:21 (361 elapsed minutes -> penalty, not deducted); WRAP_OUT 15:24 (net 504)"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film R", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Round", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 480, location: "Lot 6", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10005, nonunion_rate_cents: 10005 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T13:01:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_IN", occurred_at: "2026-08-10T13:21:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:24:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bk}" }, as: CastingAssociate, captures: { vc: "$.data[0].id" } }
          trigger:
            - { call: "POST /central-casting/vouchers/${vc}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1", captures: { g: $.data.gross_total_cents, base: $.data.base_wages_cents, ot: $.data.ot_wages_cents, mp: $.data.meal_penalty_cents, mpc: $.data.meal_penalty_count, net: $.data.net_work_minutes } }
          assert:
            - "Voucher.${vc}.net_work_minutes == 504 (late meal NOT deducted)"
            - "Voucher.${vc}.meal_penalty_count == 1"
            - "Voucher.${vc}.base_wages_cents == 10005"
            - "Voucher.${vc}.ot_wages_cents == 750    (750.375 rounded per-component)"
            - "Voucher.${vc}.meal_penalty_cents == 625  (625.3125 rounded per-violation)"
            - "Voucher.${vc}.gross_total_cents == 11380  (per-component sum; sum-then-round 11381 is WRONG)"
      - name: meal_timeliness_evaluation_order
        grounds:
          - calculations.net_work_minutes
          - calculations.voucher_gross_final
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          timeliness is judged on gross elapsed (exactly 360m is timely, <=) and only
          timely meals deduct. Two bookings 1 minute apart at meal-out (13:00 vs 13:01)
          diverge to net 480 / penalty 0 / gross 10000 vs net 510 / penalty 1 /
          gross 11563; judging timeliness on net or deducting penalty meals would
          produce different numbers.
        test_recipe:
          setup:
            - "Production ACTIVE; two NONUNION actors ELIGIBLE; call (union_slots 0, nonunion_slots 2, nonunion_rate_cents 10000, duration 600) SHOOTING"
            - "Both CONFIRMED; CHECK_IN 07:00; actor A meal 13:00-13:30 (exactly 360m -> timely); actor B meal 13:01-13:31 (361m -> penalty); both WRAP_OUT 15:30"
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film M", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Timely", union_status: "NONUNION" }, as: AgencyAdmin, captures: { actA: $.data.id } }
            - { call: "POST /central-casting/actors/${actA}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Late", union_status: "NONUNION" }, as: AgencyAdmin, captures: { actB: $.data.id } }
            - { call: "POST /central-casting/actors/${actB}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 7", union_slots: 0, nonunion_slots: 2, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actA}" }, as: CastingAssociate, captures: { bkA: $.data.id } }
            - { call: "POST /central-casting/bookings/${bkA}/accept", payload: {}, as: BackgroundActor, as_user_id: "${actA}" }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${actB}" }, as: CastingAssociate, captures: { bkB: $.data.id } }
            - { call: "POST /central-casting/bookings/${bkB}/accept", payload: {}, as: BackgroundActor, as_user_id: "${actB}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bkA}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/bookings/${bkB}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkA}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T13:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkA}", event_type: "MEAL_IN", occurred_at: "2026-08-10T13:30:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkB}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T13:01:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bkB}", event_type: "MEAL_IN", occurred_at: "2026-08-10T13:31:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bkA}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/bookings/${bkB}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bkA}" }, as: CastingAssociate, captures: { vcA: "$.data[0].id" } }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bkB}" }, as: CastingAssociate, captures: { vcB: "$.data[0].id" } }
          trigger:
