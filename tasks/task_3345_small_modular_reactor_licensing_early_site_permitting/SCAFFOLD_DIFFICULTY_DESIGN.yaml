scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: epz_deterministic_vs_dose_based_divergence
        grounds:
          - calculations.epz_radius_determination
          - entities.DesignCertification.fields.epz_radius_deterministic_miles
          - entities.DesignCertification.fields.epz_radius_dose_based_miles
          - entities.DesignCertification.fields.epz_radius_selected_miles
        distinguishing_aspect: |
          Two valid EPZ sizing interpretations on the same DesignCertification: deterministic (10.0*source_term_fraction)
          vs dose-based (max(0.5, 2*sqrt(site_boundary_miles) + 5*(1-source_term_fraction))) produce different radii
          for identical design inputs; the COL freeze uses max of both capped at 10.
        test_recipe:
          setup:
            - "DCA with source_term_fraction=0.20, site_boundary_miles=4.0"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-001", reactor_model: "SMR-160", target_power_mwt: 500, plant_net_capacity_mw: 160, source_term_fraction: 0.20, site_boundary_miles: 4.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
          trigger:
            - call: "GET /licensing/dcas/${dca_id}"
              payload: {}
              as: DcaApplicant
          assert:
            - "DesignCertification.${dca_id}.epz_radius_deterministic_miles == 2.00"
            - "DesignCertification.${dca_id}.epz_radius_dose_based_miles == 4.00"
            - "DesignCertification.${dca_id}.epz_radius_selected_miles == 4.00"
            - "deterministic (2.00) != dose_based (4.00): variants diverge"
      - name: qualification_variant_status_plus_defects
        grounds:
          - calculations.qualification_variant_selection
          - entities.VendorQualification.fields.qualified_variant
        distinguishing_aspect: |
          Vendor qualification derivation is dual-variant over a different entity domain than EPZ: variant = f(status, defects_found)
          with threshold 3, so CONDITIONALLY_QUALIFIED with defects_found=2 yields CONDITIONALLY_QUALIFIED but the same status with
          defects_found=3 yields UNQUALIFIED — different from the EPZ entity domain.
        test_recipe:
          setup:
            - "Vendor V with one CONDITIONALLY_QUALIFIED qualification having defects_found=3"
          setup_api_calls:
            - call: "POST /licensing/vendors"
              payload: { name: "Acme Nuclear", capability_scope: "pressure vessels" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-10-01T00:00:00Z", defects_found: 3 }
              as: VendorAuditor
              captures: { qual_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/complete-audit"
              payload: {}
              as: VendorAuditor
          trigger:
            - call: "GET /licensing/vendor-qualifications"
              payload: { vendor_id: "${vendor_id}" }
              as: VendorAuditor
          assert:
            - "VendorQualification.${qual_id}.status == CONDITIONALLY_QUALIFIED"
            - "VendorQualification.${qual_id}.qualified_variant == UNQUALIFIED (defects 3 >= threshold 3 overrides status)"
            - "Vendor.${vendor_id}.qualified == false"
  - rule_id: combinatorial_formula
    instances:
      - name: escalation_waterfall_multi_input_nested_min
        grounds:
          - calculations.escalation_reallocation
          - entities.SubscriptionCommitment.fields.allocated_overrun_usd
          - entities.DesignCertification.fields.funding_gap_usd
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — overrun_usd, committed_mw, total_committed_mw, withdrawal_reserve_usd
          combine via floor(pro-rata), nested min(pro_rata, capacity), and a funding_gap branch when capacity binds.
        test_recipe:
          setup:
            - "DCA with plant_net_capacity_mw=100; CostShareAgreement total_cost_usd=1000, gov_contribution_usd=200 (participant_share=800)"
            - "Two EXECUTED subscriptions: A committed 60 MW (created first), B committed 40 MW"
            - "DCA certified so both LOCK: A cost_share_total=480, B cost_share_total=320"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-100", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
              payload: { dca_id: "${dca_id}", total_cost_usd: 1000, gov_contribution_usd: 200 }
              as: DoeProgram
              captures: { csa_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/enter-safety-review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/advance-phase"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-10-01T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/workforce-pipelines"
              payload: { cohort_code: "C-1", required_operators: 1 }
              as: WorkforceCoordinator
              captures: { pipe_id: $.data.id }
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/start-training"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/licenses"
              payload: { candidate_name: "Op One" }
              as: WorkforceCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/operator-licenses/${lic_id}/license"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/advance"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "util-a", committed_mw: 60, price_per_mwh_usd: 55.0 }
              as: UtilityParticipant
              as_user_id: "util-a"
              captures: { sub_a: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_a}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "util-a"
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "util-b", committed_mw: 40, price_per_mwh_usd: 55.0 }
              as: UtilityParticipant
              as_user_id: "util-b"
              captures: { sub_b: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_b}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "util-b"
            - call: "POST /licensing/dcas/${dca_id}/certify"
              payload: {}
              as: NrcReviewer
          trigger:
            - call: "POST /licensing/cost-share-agreements/${csa_id}/escalate"
              payload: { overrun_usd: 100 }
              as: DoeProgram
          assert:
            - "SubscriptionCommitment.${sub_a}.allocated_overrun_usd == 60 (floor(100*60/100)=60)"
            - "SubscriptionCommitment.${sub_b}.allocated_overrun_usd == 40 (floor(100*40/100)=40)"
            - "DesignCertification.${dca_id}.funding_gap_usd == 0 (capacities 480 and 320 absorb fully)"
            - "CostShareAgreement.${csa_id}.allocated_to_participants_usd == 900 (800 base + 100 overrun)"
      - name: withdrawal_penalty_tiered_rounding_order
        grounds:
          - calculations.withdrawal_penalty
          - entities.SubscriptionCommitment.fields.offload_penalty_usd
        distinguishing_aspect: |
          Mode (b/c distinct from escalation's mode (a)): tiered-rate selection on days-since-execution with floor rounding —
          tier boundaries (0/30/180 days) pick a rate applied to withdrawal_reserve_usd; evaluation order (tier select, then
          multiply, then floor) is pinned. Different formula structure from the escalation waterfall.
        test_recipe:
          setup:
            - "DCA certified; one LOCKED subscription util-a committed 100 MW (sole subscriber, full pool)"
            - "CostShareAgreement total 2000, gov 0 -> participant_share 2000; sub cost_share_total=2000, reserve=2000"
            - "execute at 2026-09-01; withdraw at 2026-10-16 (45 days -> tier 30..180 rate 0.10; penalty = floor(2000*0.10) = 200)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DoeProgram
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-200", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
              payload: { dca_id: "${dca_id}", total_cost_usd: 2000, gov_contribution_usd: 0 }
              as: DoeProgram
              captures: { csa_id: $.data.id, csa_version: $.data.version }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/enter-safety-review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/advance-phase"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-01T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/workforce-pipelines"
              payload: { cohort_code: "C-1", required_operators: 1 }
              as: WorkforceCoordinator
              captures: { pipe_id: $.data.id }
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/start-training"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/licenses"
              payload: { candidate_name: "Op One" }
              as: WorkforceCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/operator-licenses/${lic_id}/license"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/advance"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "util-a", committed_mw: 100, price_per_mwh_usd: 55.0 }
              as: UtilityParticipant
              as_user_id: "util-a"
              captures: { sub_id: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_id}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "util-a"
            - call: "POST /licensing/dcas/${dca_id}/certify"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: DoeProgram
            - call: "POST /licensing/cost-share-agreements/${csa_id}/escalate"
              payload: { overrun_usd: 1 }
              as: DoeProgram
              captures: { csa_version_now: $.data.version }
          trigger:
            - call: "POST /licensing/subscriptions/${sub_id}/withdraw"
              payload: { expected_cost_share_agreement_version: "${csa_version_now}" }
              as: UtilityParticipant
              as_user_id: "util-a"
          assert:
            - "SubscriptionCommitment.${sub_id}.status == WITHDRAWN"
            - "45 days since EXECUTE -> tier 30<=d<180 rate 0.10; floor(2000*0.10) = 200"
            - "SubscriptionCommitment.${sub_id}.offload_penalty_usd == 200"
  - rule_id: non_linear_state_machine
    instances:
      - name: rai_reopen_cycle_regresses_sar
        grounds:
          - state_machines.RAI
          - state_machines.SafetyAnalysisReport.READY_FOR_PHASE_ADVANCE_to_UNDER_REVIEW
        distinguishing_aspect: |
          RAI has a cycle RESPONSE_SUBMITTED -> REOPENED -> RESPONSE_SUBMITTED; the REOPENED transition cascades a regression
          on a different entity (SAR flips back READY_FOR_PHASE_ADVANCE -> UNDER_REVIEW), making the cycle cross-entity.
        test_recipe:
          setup:
            - "DCA in SAFETY_REVIEW; SAR section CH03 in READY_FOR_PHASE_ADVANCE after an RAI was responded and accepted, then a second RAI responded"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-300", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q1", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai_id: $.data.id }
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A1" }
              as: DcaApplicant
            - call: "POST /licensing/rais/${rai_id}/reopen"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A1b" }
              as: DcaApplicant
            - call: "POST /licensing/rais/${rai_id}/accept"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q2", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai2_id: $.data.id }
            - call: "POST /licensing/rais/${rai2_id}/respond"
              payload: { response_text: "A2" }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/rais/${rai2_id}/reopen"
              payload: {}
              as: NrcReviewer
          assert:
            - "RAI.${rai2_id}.status == REOPENED"
            - "SafetyAnalysisReport.${sar_id}.status == UNDER_REVIEW (regressed from READY_FOR_PHASE_ADVANCE)"
            - "cycle: RAI has now passed through RESPONSE_SUBMITTED twice"
      - name: hearing_contention_regresses_permit_then_recovers
        grounds:
          - state_machines.PublicHearing
          - state_machines.SitePermit.HEARINGS_to_ENVIRONMENTAL_REVIEW
        distinguishing_aspect: |
          PublicHearing has a CONTENDED -> SCHEDULED loop, and the contention cascades a SitePermit regression
          HEARINGS -> ENVIRONMENTAL_REVIEW on a different entity than the RAI/SAR pair.
        test_recipe:
          setup:
            - "ESP permit in HEARINGS with one SCHEDULED hearing in the future"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DoeProgram
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-301", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/site-permits"
              payload: { permit_type: "ESP", dca_id: "${dca_id}", site_name: "River Bend" }
              as: SitePermitApplicant
              captures: { permit_id: $.data.id }
            - call: "POST /licensing/site-permits/${permit_id}/submit"
              payload: {}
              as: SitePermitApplicant
            - call: "POST /licensing/site-permits/${permit_id}/advance-to-hearings"
              payload: {}
              as: SitePermitApplicant
            - call: "POST /licensing/site-permits/${permit_id}/hearings"
              payload: { scheduled_at: "2026-10-01T00:00:00Z", location: "Town Hall" }
              as: SitePermitApplicant
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /licensing/public-hearings/${hearing_id}/contend"
              payload: {}
              as: PublicIntervenor
          assert:
            - "PublicHearing.${hearing_id}.status == CONTENDED"
            - "SitePermit.${permit_id}.status == ENVIRONMENTAL_REVIEW (regressed from HEARINGS)"
  - rule_id: transitive_cascade
    instances:
      - name: rai_reopen_three_hop_cascade
        grounds:
          - state_machines.RAI.RESPONSE_SUBMITTED_to_REOPENED
          - state_machines.SafetyAnalysisReport.READY_FOR_PHASE_ADVANCE_to_UNDER_REVIEW
        distinguishing_aspect: |
          Depth-3 chain from POST /rais/{id}/reopen: RAI -> REOPENED mutates SAR (READY->UNDER_REVIEW), which mutates
          DCA (version bump and blocks advance-phase); each hop caused by the previous, not the original call.
        test_recipe:
          setup:
            - "DCA in SAFETY_REVIEW, SAR CH03 READY_FOR_PHASE_ADVANCE, RAI RESPONSE_SUBMITTED"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-400", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/enter-safety-review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai_id: $.data.id }
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A" }
              as: DcaApplicant
            - call: "POST /licensing/rais/${rai_id}/accept"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q2", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai2_id: $.data.id }
            - call: "POST /licensing/rais/${rai2_id}/respond"
              payload: { response_text: "A2" }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/rais/${rai2_id}/reopen"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/advance-phase"
              payload: {}
              as: NrcReviewer
              captures: { advance_err: $.data.error_id }
          assert:
            - "RAI.${rai2_id}.status == REOPENED (hop 1)"
            - "SafetyAnalysisReport.${sar_id}.status == UNDER_REVIEW (hop 2, caused by hop 1)"
            - "advance-phase rejected with ERR_INVALID_STATE (hop 3, caused by hop 2 blocking the phase gate)"
      - name: vendor_disqualify_rejects_lots_two_hop
        grounds:
          - state_machines.VendorQualification.CONDITIONALLY_QUALIFIED_to_DISQUALIFIED
          - state_machines.ComponentLot
        distinguishing_aspect: |
          Depth-2 chain from disqualify: VendorQualification -> DISQUALIFIED flips Vendor.qualified to false (hop 1),
          which itself transitions each PROCURED ComponentLot of that vendor to REJECTED (hop 2). Different trigger from RAI reopen.
        test_recipe:
          setup:
            - "Vendor with CONDITIONALLY_QUALIFIED qualification (defects 1); one ADEQUATE test program; one PROCURED lot from this vendor"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-401", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-01T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/vendors"
              payload: { name: "Beta Castings", capability_scope: "valves" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-09-15T00:00:00Z", defects_found: 1 }
              as: VendorAuditor
              captures: { qual_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/complete-audit"
              payload: {}
              as: VendorAuditor
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/upgrade"
              payload: {}
              as: VendorAuditor
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "${tp_id}", component_type: "valve", quantity: 4 }
              as: SupplyChainManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/disqualify"
              payload: {}
              as: VendorAuditor
          assert:
            - "VendorQualification.${qual_id}.status == DISQUALIFIED (hop 0)"
            - "Vendor.${vendor_id}.qualified == false (hop 1)"
            - "ComponentLot.${lot_id}.status == REJECTED (hop 2, caused by hop 1)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_vs_business_safety_on_lot_create
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair (existence, business_safety): creating a ComponentLot with a nonexistent program_id AND an
          unqualified vendor must return ERR_NOT_FOUND (priority 4), not ERR_PROCUREMENT_GATE (priority 8) — existence beats safety.
        test_recipe:
          setup:
            - "Vendor with no qualifications (qualified == false); a program_id that does not exist"
          setup_api_calls:
            - call: "POST /licensing/vendors"
              payload: { name: "Gamma Forge", capability_scope: "piping" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "00000000-0000-0000-0000-000000000000", component_type: "pipe", quantity: 2 }
              as: SupplyChainManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (existence priority 4 beats business_safety priority 8)"
            - "err != ERR_PROCUREMENT_GATE"
      - name: auth_vs_business_referential_on_rai_create
        grounds:
          - validations[priority=2]
          - validations[priority=13]
        distinguishing_aspect: |
          Different error-category pair (auth, business_referential): a DcaApplicant (wrong role) creating an RAI against a
          nonexistent section must get ERR_UNAUTHORIZED (priority 2), never ERR_SAR_SECTION_UNKNOWN (priority 13).
        test_recipe:
          setup:
            - "DCA exists with one SAR section CH03"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-501", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH99", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (auth priority 2 beats referential priority 13)"
            - "error_id != ERR_SAR_SECTION_UNKNOWN"
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_gate_boundary_exactly_available
        grounds:
          - validations[priority=14]
          - entities.DesignCertification.fields.available_mw
        distinguishing_aspect: |
          Numeric threshold boundary on subscription capacity: committed_mw == available_mw must be ACCEPTED (<=),
          while available_mw+1 is rejected with ERR_CAPACITY_EXCEEDED — exact >=-style boundary on the capacity metric.
        test_recipe:
          setup:
            - "DCA plant_net_capacity_mw=100, no subscriptions yet (available_mw == 100)"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-600", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "u-exact", committed_mw: 100, price_per_mwh_usd: 50.0 }
              as: UtilityParticipant
              as_user_id: "u-exact"
              captures: { sub_ok: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "u-over", committed_mw: 1, price_per_mwh_usd: 50.0 }
              as: UtilityParticipant
              as_user_id: "u-over"
              captures: { sub_over: $.data.id }
          trigger:
            - call: "POST /licensing/subscriptions/${sub_ok}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "u-exact"
            - call: "POST /licensing/subscriptions/${sub_over}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "u-over"
              captures: { err_over: $.data.error_id }
          assert:
            - "SubscriptionCommitment.${sub_ok}.status == EXECUTED (boundary 100<=100 accepted)"
            - "second execute: err_over == ERR_CAPACITY_EXCEEDED (1 > remaining 0)"
      - name: zero_hearings_grant_blocked_empty_set
        grounds:
          - state_machines.SitePermit.HEARINGS_to_GRANTED
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (hearing count): HEARINGS -> GRANTED requires at least one
          PublicHearing with status HELD; zero hearings (empty set) blocks grant even though no hearing is in a bad state.
        test_recipe:
          setup:
            - "ESP permit advanced to HEARINGS with no hearings scheduled"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-601", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/site-permits"
              payload: { permit_type: "ESP", dca_id: "${dca_id}", site_name: "Dry Fork" }
              as: SitePermitApplicant
              captures: { permit_id: $.data.id }
            - call: "POST /licensing/site-permits/${permit_id}/submit"
              payload: {}
              as: SitePermitApplicant
            - call: "POST /licensing/site-permits/${permit_id}/advance-to-hearings"
              payload: {}
              as: SitePermitApplicant
          trigger:
            - call: "POST /licensing/site-permits/${permit_id}/grant"
              payload: {}
              as: SitePermitApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (grant blocked: hearing set is empty — zero-count boundary)"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_procurement_depends_on_program_and_vendor
        grounds:
          - validations[priority=8]
          - state_machines.TestProgram.IN_PROGRESS_to_ADEQUATE
        distinguishing_aspect: |
          ComponentLot creation (entity A) is gated on TestProgram.status == ADEQUATE (entity B) AND Vendor.qualified (entity C) —
          cross-entity pair ComponentLot -> TestProgram/Vendor; procurement fails until both foreign states align.
        test_recipe:
          setup:
            - "Fully-qualified vendor; test program IN_PROGRESS with 0 of 1 required tests"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-700", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/vendors"
              payload: { name: "Delta Steel", capability_scope: "reactor modules" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-09-10T00:00:00Z", defects_found: 0 }
              as: VendorAuditor
              captures: { qual_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/complete-audit"
              payload: {}
              as: VendorAuditor
          trigger:
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "${tp_id}", component_type: "module", quantity: 1 }
              as: SupplyChainManager
              captures: { err1: $.data.error_id }
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-20T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "${tp_id}", component_type: "module", quantity: 1 }
              as: SupplyChainManager
              captures: { lot_id: $.data.id }
          assert:
            - "first create: err1 == ERR_PROCUREMENT_GATE (program not ADEQUATE)"
            - "after PASS -> program ADEQUATE: second create succeeds, ComponentLot.${lot_id}.status == PROCURED"
      - name: col_creation_depends_on_dca_certified
        grounds:
          - validations[priority=18]
          - state_machines.DesignCertification
        distinguishing_aspect: |
          SitePermit of type COL (entity A) requires DesignCertification.status == CERTIFIED (entity B) — a different entity
          pair (SitePermit -> DesignCertification) than the lot -> program/vendor pair.
        test_recipe:
          setup:
            - "DCA in SUBMITTED status (not CERTIFIED)"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-701", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
          trigger:
            - call: "POST /licensing/site-permits"
              payload: { permit_type: "COL", dca_id: "${dca_id}", site_name: "Early Site" }
              as: SitePermitApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DCA_NOT_CERTIFIED (COL gated on DCA CERTIFIED)"
  - rule_id: resource_temporal_overlap
    instances:
      - name: vendor_audit_overlap_plus_minus_14_days
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics: buffer-zone overlap — a new VendorQualification audit_date within +/-14 days of an existing
          non-superseded audit for the same vendor is rejected; adjacency at exactly 14 days is allowed (strict inequality).
        test_recipe:
          setup:
            - "Vendor with one AUDIT_SCHEDULED qualification at 2026-10-01"
          setup_api_calls:
            - call: "POST /licensing/vendors"
              payload: { name: "Epsilon Pumps", capability_scope: "pumps" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-10-01T00:00:00Z", defects_found: 0 }
              as: VendorAuditor
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-10-10T00:00:00Z", defects_found: 0 }
              as: VendorAuditor
              captures: { err: $.data.error_id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-10-16T00:00:00Z", defects_found: 0 }
              as: VendorAuditor
              captures: { q2: $.data.id }
          assert:
            - "audit at +9 days: err == ERR_AUDIT_OVERLAP"
            - "audit at +15 days: succeeds (q2 created) — but q1 was superseded by the failed attempt? No: failed creates do not supersede; q2 creation supersedes q1"
            - "VendorQualification.${q1}.status == SUPERSEDED after q2 creation"
      - name: hearing_scheduling_requires_future_instant
        grounds:
          - validations[priority=10]
        distinguishing_aspect: |
          Different interval semantics: point-in-future constraint (not buffer overlap) — hearing scheduled_at must be
          strictly greater than the logical clock; equal-to-now is rejected, distinct from the vendor +/-14-day buffer rule.
        test_recipe:
          setup:
            - "ESP permit in HEARINGS; clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DoeProgram
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-702", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/site-permits"
              payload: { permit_type: "ESP", dca_id: "${dca_id}", site_name: "Stone Creek" }
              as: SitePermitApplicant
              captures: { permit_id: $.data.id }
            - call: "POST /licensing/site-permits/${permit_id}/submit"
              payload: {}
              as: SitePermitApplicant
            - call: "POST /licensing/site-permits/${permit_id}/advance-to-hearings"
              payload: {}
              as: SitePermitApplicant
          trigger:
            - call: "POST /licensing/site-permits/${permit_id}/hearings"
              payload: { scheduled_at: "2026-09-01T00:00:00Z", location: "Library" }
              as: SitePermitApplicant
              captures: { err: $.data.error_id }
            - call: "POST /licensing/site-permits/${permit_id}/hearings"
              payload: { scheduled_at: "2026-09-01T00:00:01Z", location: "Library" }
              as: SitePermitApplicant
              captures: { hearing_id: $.data.id }
          assert:
            - "scheduled_at == now: err == ERR_HEARING_IN_PAST (strict >)"
            - "scheduled_at == now+1s: succeeds"
  - rule_id: compensating_invariant
    instances:
      - name: subscription_execute_withdraw_conserves_available_mw
        grounds:
          - entities.DesignCertification.fields.available_mw
          - state_machines.SubscriptionCommitment
        distinguishing_aspect: |
          Conserved quantity: MW capacity. execute(N) followed by withdraw on the same subscription must leave
          DCA.available_mw == plant_net_capacity_mw (the MW pool returns to its pre-execute value).
        test_recipe:
          setup:
            - "DCA plant_net_capacity_mw=100; CostShareAgreement exists; one EXECUTED subscription of 30 MW"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-800", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
              payload: { dca_id: "${dca_id}", total_cost_usd: 500, gov_contribution_usd: 100 }
              as: DoeProgram
              captures: { csa_id: $.data.id, csa_v: $.data.version }
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "u1", committed_mw: 30, price_per_mwh_usd: 50.0 }
              as: UtilityParticipant
              as_user_id: "u1"
              captures: { sub_id: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_id}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "u1"
          trigger:
            - call: "GET /licensing/dcas/${dca_id}"
              payload: {}
              as: DcaApplicant
              captures: { avail_mid: $.data.available_mw }
            - call: "POST /licensing/subscriptions/${sub_id}/withdraw"
              payload: { expected_cost_share_agreement_version: "${csa_v}" }
              as: UtilityParticipant
              as_user_id: "u1"
            - call: "GET /licensing/dcas/${dca_id}"
              payload: {}
              as: DcaApplicant
              captures: { avail_end: $.data.available_mw }
          assert:
            - "after execute: available_mw == 70"
            - "after withdraw (compensating action): available_mw == 100 (invariant restored)"
            - "subscribed_mw == 0"
      - name: escalation_with_offramp_conserves_dollar_allocation
        grounds:
          - calculations.cost_share_conservation
          - calculations.escalation_reallocation
        distinguishing_aspect: |
          Different conserved quantity: dollars. escalation_reallocation paired with the forced off-ramp of an EXECUTED
          participant whose reserve is exhausted must leave sum(cost_share_total + allocated_overrun) over ALL subscriptions
          == participant_share_usd + total_allocated_overrun - funding_gap_usd (conservation with the gap term, per the pinned formula).
        test_recipe:
          setup:
            - "Certified DCA with two LOCKED subscriptions A (60MW, share 480) and B (40MW, share 320); participant_share 800"
            - "Escalate overrun 1000 (> combined headroom) forcing funding_gap accounting"
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-801", reactor_model: "SMR-160", target_power_mwt: 300, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
              payload: { dca_id: "${dca_id}", total_cost_usd: 1000, gov_contribution_usd: 200 }
              as: DoeProgram
              captures: { csa_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/enter-safety-review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/advance-phase"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-01T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/workforce-pipelines"
              payload: { cohort_code: "C-1", required_operators: 1 }
              as: WorkforceCoordinator
              captures: { pipe_id: $.data.id }
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/start-training"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/licenses"
              payload: { candidate_name: "Op One" }
              as: WorkforceCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/operator-licenses/${lic_id}/license"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/advance"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "util-a", committed_mw: 60, price_per_mwh_usd: 55.0 }
              as: UtilityParticipant
              as_user_id: "util-a"
              captures: { sub_a: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_a}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "util-a"
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "util-b", committed_mw: 40, price_per_mwh_usd: 55.0 }
              as: UtilityParticipant
              as_user_id: "util-b"
              captures: { sub_b: $.data.id }
            - call: "POST /licensing/subscriptions/${sub_b}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "util-b"
            - call: "POST /licensing/dcas/${dca_id}/certify"
              payload: {}
              as: NrcReviewer
          trigger:
            - call: "POST /licensing/cost-share-agreements/${csa_id}/escalate"
              payload: { overrun_usd: 1000 }
              as: DoeProgram
            - call: "GET /licensing/dcas/${dca_id}"
              payload: {}
              as: DcaApplicant
              captures: { gap: $.data.funding_gap_usd }
          assert:
            - "pro-rata: A floor(1000*60/100)=600 > reserve 480 -> A allocated 480, gap += 120"
            - "B floor(1000*40/100)=400 > reserve 320 -> B allocated 320, gap += 80"
            - "DesignCertification.${dca_id}.funding_gap_usd == 200"
            - "conservation: sum(cost_share_total+allocated_overrun) = (480+480)+(320+320) = 1600 == participant_share(800) + overrun_allocated(800); gap(200) is the unallocatable remainder of 1000"
