# ===========================================================================
  - section: calculations
    instances:

      - name: option_eligibility_flips_at_exactly_three_charges_and_void_restores_one
        claim_type: Correct Result
        grounds:
          - calculations.MajorLeagueOptionEligibilityCalculation
          - calculations.MajorLeagueOptionEligibilityCalculation.constants.OPTION_ELIGIBILITY_THRESHOLD
          - calculations.MajorLeagueOptionEligibilityCalculation.variants.VOIDED_OPTION_RESTORES_CHARGE
        distinguishing_aspect: "A player with minor_league_option_years_used 1 reaches charges 2 after one option decision and stays OPTION_AVAILABLE, reaches charges 3 after a second and becomes NO_OPTION_REMAINING, and drops back to charges 2 with OPTION_AVAILABLE after a void."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex and one pitcher with minor_league_option_years_used 1, a cleared medical path and an invitation with a report date after the void-decision cutoff."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Option Odds", idp_number: "IDP-61001", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/program-profile"
              payload: { player_id: "${pl}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/camp-invitations"
              payload: { player_id: "${pl}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph: $.data.id }
            - call: "POST /camp-ops/physicals/${ph}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
          trigger:
            - call: "POST /camp-ops/players/${pl}/roster-record/decide"
              payload: { decision_type: "OPTION_ASSIGN" }
              as: RosterManager
            - call: "GET /camp-ops/players/${pl}/roster-records"
              payload: {}
              as: RosterManager
              captures: { rr: $.data.0.id, after_one: $.data.0.option_eligibility, used_one: $.data.0.option_decisions_used }
            - call: "POST /camp-ops/players/${pl}/roster-record/decide"
              payload: { decision_type: "OPTION_ASSIGN" }
              as: RosterManager
              captures: { after_two: $.data.option_eligibility, used_two: $.data.option_decisions_used }
            - call: "POST /camp-ops/players/${pl}/roster-record/finalize-decision"
              payload: {}
              as: RosterManager
              as_user_id: "rm-authorizer"
            - call: "POST /camp-ops/players/${pl}/roster-record/void-decision"
              payload: {}
              as: RosterManager
              as_user_id: "rm-authorizer"
              captures: { after_void: $.data.option_eligibility, used_void: $.data.option_decisions_used }
          assert:
            - "after one OPTION_ASSIGN: charges 1 + min(0,2) == 1, so option_eligibility == OPTION_AVAILABLE"
            - "after two OPTION_ASSIGNs: option_decisions_used == 1, charges 1 + min(1,2) == 2, still OPTION_AVAILABLE"
            - "after finalize: option_decisions_used increments and waivers_required is recomputed from the credit rule"
            - "after void: option_decisions_used decrements by one and option_eligibility is recomputed under the VOIDED_OPTION_RESTORES_CHARGE variant"
            - "the void also resets roster_decision_status to DECISION_VOIDED and current_roster_status to NRI"

      - name: report_date_variants_put_pitchers_and_position_players_seven_days_apart
        claim_type: Variant Divergence
        grounds:
          - calculations.SpringReportDateCalculation.variants.PITCHER_CATCHER_REPORT
          - calculations.SpringReportDateCalculation.variants.POSITION_PLAYER_REPORT
