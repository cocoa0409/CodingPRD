  # =========================================================================
  # Section: cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: occ_alliance_pick_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules
        distinguishing_aspect: "Pick with stale expected_round_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "AllianceSelectionRound r1 OPEN at version=3; captain holds stale version=2"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CC1", event_name: "CC1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/alliance-selection-rounds/${r1}/pick", payload: { team_id: "${t9}", expected_round_version: "${stale_rv} - 1" }, as: TeamLead, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: clock_set_drives_screening_expiry
        claim_type: scheduled_actions
        grounds:
          - calculations.screening_expiry
        distinguishing_aspect: "Setting the clock past a CLEARED person's expires_at flips them to EXPIRED."
        test_recipe:
          setup:
            - "Person p1 CLEARED with expires_at=2026-06-30"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CC2", event_name: "CC2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: EventDirector }
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { st: $.data.screening_status } }
          assert:
            - "st == EXPIRED"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_transition
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After team confirm, GET team and GET event both reflect the change in the same response cycle."
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN; Team t1 in ROSTER_SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "CM1", event_name: "CM1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/confirm", payload: {}, as: RegistrationOfficer, captures: { new_status: $.data.registration_status } }
          assert:
            - "new_status == CONFIRMED"
