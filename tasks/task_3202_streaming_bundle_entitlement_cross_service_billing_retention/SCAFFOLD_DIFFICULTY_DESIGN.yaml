  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: migration_confirm_exactly_at_period_end_rejected
        grounds:
          - validations[priority=12]
          - errors[ERR_MIGRATION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Metric: temporal window boundary on the migration confirm endpoint.
          now == period_end exactly (2026-10-01T00:00:00Z) is REJECTED (the
          rule is now < period_end), while one second earlier succeeds —
          pinning the open-boundary semantics.
        test_recipe:
          setup:
            - "PLATFORM subscriber, ACTIVE DPLUS_ADS standalone created 2026-09-01 (period_end 2026-10-01T00:00:00Z); DUO_PREMIUM bundle; migration quoted 2026-09-06; clock set to EXACTLY 2026-10-01T00:00:00Z before confirm"
