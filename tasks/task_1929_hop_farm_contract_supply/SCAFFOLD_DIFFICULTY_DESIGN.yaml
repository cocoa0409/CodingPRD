  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_confirm_requires_contract_active
        grounds:
          - state_machines.Allocation.PROJECTED_to_CONFIRMED
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Contract -> Allocation: confirming an allocation while its
          contract is SUSPENDED is rejected with ERR_CONTRACT_NOT_ACTIVE, even
          though the allocation itself is PROJECTED (a valid from-state).
          Distinct pair from BrewerySample -> SpotSale.
        test_recipe:
          setup:
            - "ACTIVE contract vol 736 CASCADE 2026-2028; run 2026 creates a PROJECTED allocation (allocated 0, no inventory); contract then suspended"
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /api/contracts/${c_id}/suspend", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /api/allocations/${a_id}/confirm", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/allocations/${a_id}", payload: {}, as: ContractManager, captures: { a_st: $.data.status } }
          assert:
            - "captured err == ERR_CONTRACT_NOT_ACTIVE"
            - "captured a_st == PROJECTED (failed confirm leaves the allocation untouched)"

      - name: spot_confirm_requires_selected_sample
        grounds:
          - state_machines.SpotSale.DRAFT_to_CONFIRMED
          - errors[ERR_SAMPLE_NOT_SELECTED]
        distinguishing_aspect: |
          Entity pair BrewerySample -> SpotSale: confirming a spot sale for
          (lot, buyer) whose only sample was REJECTED fails with
          ERR_SAMPLE_NOT_SELECTED. Distinct pair from Contract -> Allocation.
        test_recipe:
          setup:
            - "Pellet lot qty 736 RESERVED by a DRAFT spot sale to CraftBrew; the only sample for (lot, CraftBrew) is REJECTED"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/spot-sales", payload: { pellet_lot_id: "${pellet_id}", buyer_name: "CraftBrew", price_cents_per_lb: 650, buyer_credit_limit_cents: 1000000 }, as: ContractManager, captures: { sale_id: $.data.id } }
            - { call: "POST /api/samples", payload: { pellet_lot_id: "${pellet_id}", brewery_name: "CraftBrew" }, as: ContractManager, captures: { samp_id: $.data.id } }
            - { call: "POST /api/samples/${samp_id}/decide", payload: { outcome: "REJECTED" }, as: ContractManager }
          trigger:
            - { call: "POST /api/spot-sales/${sale_id}/confirm", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/spot-sales/${sale_id}", payload: {}, as: ContractManager, captures: { s_st: $.data.status } }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: ContractManager, captures: { l_st: $.data.inventory_status } }
          assert:
            - "captured err == ERR_SAMPLE_NOT_SELECTED (REJECTED does not satisfy the gate)"
            - "captured s_st == DRAFT and l_st == RESERVED (no side effects fired)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: field_season_slot_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_FIELD_SEASON_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: discrete season slots — a field admits exactly one
          non-CANCELLED plan per integer crop_year. Resource entity: Field.
          Distinct semantics and resource from the kiln's continuous buffered
          windows.
        test_recipe:
          setup:
            - "Field F1 has a DRAFT CASCADE plan for crop_year 2026"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CITRA", planned_acreage: 10 }, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2027, variety: "CITRA", planned_acreage: 10 }, as: FarmManager, captures: { p2: $.data.id } }
          assert:
            - "captured err == ERR_FIELD_SEASON_CONFLICT (same field, same crop_year slot)"
            - "the 2027 plan succeeds (adjacent discrete season slot is free): captured p2 is a non-null id"

      - name: kiln_window_buffer_overlap
        grounds:
          - validations[priority=9]
          - calculations.kiln_window_conflict
          - errors[ERR_KILN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: continuous half-open windows with a symmetric
          30-minute buffer — a 20-minute gap is rejected, an exactly-30-minute
          gap is allowed. Resource entity: Kiln. Distinct semantics and resource
          from the field's discrete season slots.
        test_recipe:
          setup:
            - "Kiln K1; lot A IN_KILN with window 2026-08-20T08:00-12:00Z; lot B HARVESTED"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_b: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:20:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager, captures: { b_st: $.data.status } }
          assert:
            - "captured err == ERR_KILN_WINDOW_OVERLAP (20-minute gap < 30-minute buffer)"
            - "captured b_st == IN_KILN (exactly-30-minute gap satisfies the buffer; half-open adjacency plus buffer is allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: allocation_confirm_cancel_restores_inventory
        grounds:
          - state_machines.Allocation.PROJECTED_to_CONFIRMED
          - state_machines.Allocation.transitions
          - state_machines.PelletLot.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: physical pellet inventory — sum of qty_lbs over
          PelletLots with inventory_status == AVAILABLE. Confirm (reserve) then
          cancel (release) returns it to 1656, exactly its pre-confirm value.
          Distinct quantity from contractual allocation lbs.
        test_recipe:
          setup:
            - "Pellet lots p1 qty 920 and p2 qty 736, both AVAILABLE CASCADE; ACTIVE contract vol 2000; run 2026 -> allocation allocated 1656 shortfall 344"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3750 }, as: FarmManager, captures: { lot1: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot1}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot1}/finish-drying", payload: { dried_lbs: 1000 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot1}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot2: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot2}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot2}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot2}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot1}"], storage_room: "R1" }, as: FarmManager, captures: { pl1: $.data.id } }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot2}"], storage_room: "R1" }, as: FarmManager, captures: { pl2: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 2000, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/allocations/${a_id}/confirm", payload: {}, as: ContractManager, captures: { reserved: $.data.reserved_lot_ids } }
            - { call: "GET /api/pellet-lots?inventory_status=AVAILABLE", payload: {}, as: ContractManager, captures: { avail_mid: $.meta } }
            - { call: "POST /api/allocations/${a_id}/cancel", payload: {}, as: ContractManager }
            - { call: "GET /api/pellet-lots/${pl1}", payload: {}, as: FarmManager, captures: { p1_st: $.data.inventory_status } }
            - { call: "GET /api/pellet-lots/${pl2}", payload: {}, as: FarmManager, captures: { p2_st: $.data.inventory_status } }
          assert:
            - "captured reserved contains both ${pl1} and ${pl2} (920 + 736 = 1656 <= 2000 FIFO)"
            - "after confirm: sum of qty_lbs over AVAILABLE PelletLots == 0 (both RESERVED)"
            - "captured p1_st == AVAILABLE and p2_st == AVAILABLE after cancel"
            - "invariant: available inventory lbs before confirm (1656) == after cancel (920 + 736 = 1656); no drift from the reserve/release round-trip"

      - name: prorata_allocation_conserves_volume
        grounds:
          - calculations.pro_rata_allocation
        distinguishing_aspect: |
          Conserved quantity: contractual volume — for every contract,
          allocated_lbs + shortfall_lbs == annual_volume_lbs, and
          sum(allocated) == min(available, contracted_total). With available
          3000 < contracted 4000: [750 + 250 == 1000] and [2250 + 750 == 3000].
          Distinct quantity from physical inventory lbs.
        test_recipe:
          setup:
