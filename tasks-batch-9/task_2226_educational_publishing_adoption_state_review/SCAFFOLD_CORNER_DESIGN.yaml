          - errors[ERR_TITLE_NOT_RELEASED]
          - validations[priority=24]
        distinguishing_aspect: |
          Quoting a district order against a DRAFT title returns ERR_TITLE_NOT_RELEASED (409), not a
          404, because the title exists but has never been released.
        test_recipe:
          setup:
            - "State NE is OPEN_TERRITORY and title NE-M-3 was created but never released, so its status is DRAFT"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "NE", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0 }
              as: PlatformAdmin
              captures: { st_ne_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000012701", subject: "MATH", grade_low: 3, grade_high: 3, copyright_year: 2026, content_tags: ["NUMBER_SENSE"], page_count: 270, signature_page_capacity: 384, list_price_cents: 8600 }
              as: PublisherEditor
