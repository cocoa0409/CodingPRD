  - rule_id: resource_temporal_overlap
    instances:

      - name: stage_buffered_abutment_conflict
        grounds:
          - calculations.stage_interval_conflict
          - validations[priority=50]
          - errors.ERR_STAGE_SLOT_CONFLICT
          - entities.Stage.fields.changeover_buffer_minutes
        distinguishing_aspect: |
          Resource: a Stage's set-time line. Interval semantics: half-open [start, end) inflated
          symmetrically by changeover_buffer_minutes, so exact abutment IS a collision and a gap of
          exactly the buffer is NOT. The probes are ordered so that each verdict is attributable to
          exactly one occupant, and the last probe collides with a DRAFT offer only — proving DRAFT
          offers occupy the stage line even though they are not bookings.
        test_recipe:
          setup:
            - "Harbor Lights fixture, tier max_slots 5, flagship stage Aurora Main with changeover_buffer_minutes 30, daily_program_minutes_cap 900 and daily_curfew_minute 1380."
            - "One accepted booking for a draw-72 ELECTRONIC act occupying 2026-12-05 19:00-20:30 at billing_position 1."
            - "Four 90-minute probe offers for four different draw-20 acts in four different genres, at billing positions 2 to 5, each guaranteed 500000 (exactly its own ceiling)."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
