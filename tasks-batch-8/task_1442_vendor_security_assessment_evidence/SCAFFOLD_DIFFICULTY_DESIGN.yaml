              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/exceptions"
              payload: { source: "EVIDENCE", severity: "MEDIUM", description: "f1", evidence_artifact_id: "${e_id}" }
              as: RiskAnalyst
              captures: { x1_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/exceptions"
              payload: { source: "EVIDENCE", severity: "LOW", description: "f2", evidence_artifact_id: "${e_id}" }
              as: RiskAnalyst
              captures: { x2_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/remediation-plans"
              payload: { exception_ids: ["${x1_id}", "${x2_id}"], tasks: [ {task_key: "t1", description: "fix", due_at: "2026-09-01T00:00:00Z", owner: "vendor"} ] }
              as: RiskAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/remediation-plans/${p_id}/accept"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/remediation-plans/${p_id}/progress"
              payload: { completed_task_keys: ["t1"] }
              as: VendorContact
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/remediation-plans/${p_id}/verify"
              payload: { reject: true }
              as: RiskAnalyst
          assert:
            - "before accept: open_exception_count == 2"
            - "after accept (OPEN->IN_REMEDIATION x2): open_exception_count == 2 (conserved through accept)"
            - "after verify-reject: ExceptionFinding.${x1_id}.status == OPEN AND ExceptionFinding.${x2_id}.status == OPEN"
            - "after verify-reject: open_exception_count == 2 (forward accept + compensating reject leaves quantity unchanged)"

      - name: reassessment_due_conserved_under_escalate_dismiss_pair
        grounds:
          - entities.Vendor.fields.next_reassessment_due
          - calculations.escalation_pull_forward
          - state_machines.MonitoringAlert.ACKNOWLEDGED_to_ESCALATED
        distinguishing_aspect: |
          Conserved quantity = monotonicity of Vendor.next_reassessment_due
          under alert churn: escalation pulls the date only earlier (min
          semantics, never later); dismissing a different alert does not move
          it at all. Invariant: due_after_escalate <= due_before_escalate, and
          due is identical before/after a dismiss.
