          assert:
            - "reading 1 (stocked, nothing dispensed): ${s1_clinic} == ${clinic_id}, ${s1_status} == ACTIVE, ${s1_stockouts} == 0, ${s1_recv} == 5, ${s1_hand} == 5, ${s1_resv} == 0, ${s1_disp} == 0, ${s1_rest} == 0, ${s1_dest} == 0, ${s1_acct} == 5, ${s1_gross} == 0, ${s1_ref} == 0, ${s1_fee} == 0, ${s1_net} == 0 -- all fourteen declared fields are present"
            - "reading 2 (reserved): ${s2_resv} == 1 but ${s2_hand} == 5 and ${s2_disp} == 0, so ${s2_acct} == 5 -- reserving moves nothing, reserved is a subset of on hand and not an addend"
            - "${s2_gross} == 0: a verified-but-undelivered encounter is not billed"
            - "${enc_resp} == 10300 (allowed 20600, deductible 0, coinsurance 0.5)"
            - "reading 3 (delivered): ${s3_hand} == 4, ${s3_resv} == 0, ${s3_disp} == 1, ${s3_rest} == 0, ${s3_acct} == 4 + 1 - 0 == 5 == ${s1_recv} -- INVARIANT U holds across the dispense"
            - "reading 3 cash: ${s3_gross} == 10300, ${s3_ref} == 0, ${s3_net} == 10300"
            - "${ret_refund} == 9348 and ${ret_fee} == 952 for a POOR_FIT restock of a 10300-cent charge"
            - "reading 4 (restocked): ${s4_hand} == 5 AND ${s4_disp} == 1 AND ${s4_rest} == 1, so ${s4_acct} == 5 + 1 - 1 == 5 == ${s4_recv} -- the restocked unit is counted twice and netted once, which is the only arrangement that reconciles"
            - "${s4_dest} == 0 and ${s4_resv} == 0"
            - "reading 4 cash: ${s4_gross} == 10300 (a refund does not erase the gross charge), ${s4_ref} == 9348, ${s4_fee} == 952 and ${s4_net} == 10300 - 9348 == 952 == ${s4_fee} -- INVARIANT C holds once every billed encounter has been returned and inspected"
            - "${s4_status} == ACTIVE and ${s4_stockouts} == 0 throughout: 5 on hand never crosses par_min 2"

      - name: corner_conditional_fitting_allowed_only_after_device_acceptance
        claim_type: Conditional action
        grounds:
          - endpoints[POST /dme/encounters/{id}/fitting-records]
