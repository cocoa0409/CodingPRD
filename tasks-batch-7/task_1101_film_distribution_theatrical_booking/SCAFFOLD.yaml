    roles: [Booker]
    code: 200
    input: []
    output: BookingAgreement
    side_effects: ["deal_status → IN_PLAY; creates HoldoverDecision decision=RELEASE"]

  # --- DCPShipment ---
  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/dcp-shipments"
    description: "Create and dispatch a DCP shipment"
    roles: [Booker]
    code: 201
    input: [content_format, tracking_number]
    output: DCPShipment
    side_effects: ["status=IN_TRANSIT, shipped_at stamped; BookingAgreement.print_status → DCP_SHIPPED"]

  - method: GET
    path: "/distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}"
    description: "Read DCPShipment"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: []
    output: DCPShipment
    side_effects: []

  - method: GET
    path: "/distributors/{did}/booking-agreements/{id}/dcp-shipments"
    description: "List DCPShipments for agreement"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "booking_agreement_id?"]
    output: "DCPShipment[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_delivered"
    description: "Mark shipment delivered"
    roles: [Exhibitor]
    code: 200
    input: []
    output: DCPShipment
    side_effects: ["status → DELIVERED; BookingAgreement.print_status → DCP_DELIVERED"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_returned"
    description: "Mark shipment returned"
    roles: [Booker]
    code: 200
    input: []
    output: DCPShipment
    side_effects: ["status → RETURNED; BookingAgreement.print_status → PRINT_RETURNED"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_lost"
    description: "Mark shipment lost; resets print_status for re-shipment"
    roles: [Booker]
    code: 200
    input: []
    output: DCPShipment
    side_effects: ["status → LOST; print_status → DCP_QUEUED"]

  # --- KDMKey ---
  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/kdm-keys"
    description: "Issue a KDM"
    roles: [Booker]
