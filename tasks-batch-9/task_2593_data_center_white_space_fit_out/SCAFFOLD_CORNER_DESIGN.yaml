          setup: "Hall CX73 driven to COMMISSIONING by the canonical build (2 PDUs commissioned, 2 busways ENERGIZED, zone CA-1 at PASS, CU-1 IN_SERVICE, rack R-1-1 POWERED on two feeds). Then three packages are opened in this order: L4, L1, L2 — each proving a current hall view via expected_hall_version. L4's script is approved while no lower level exists yet."
