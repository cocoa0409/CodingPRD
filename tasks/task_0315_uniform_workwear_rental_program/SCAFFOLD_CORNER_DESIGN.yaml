        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reconcile-stale-visit]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_stale_version_on_reconcile
          rationale: "The OCC stale-version reconcile path (ERR_STALE_VISIT_VERSION on a mismatched expected_service_visit_version) is exercised within the named §1.8 priority instance; the positive OCC-success path is covered by the dual-variant reconcile chains."

      - name: occ_version_increments_on_every_visit_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reconcile-stale-visit]
          - state_machines.ServiceVisit.SCHEDULED_to_PICKED_UP
          - state_machines.ServiceVisit.PICKED_UP_to_DELIVERED
        distinguishing_aspect: "ServiceVisit.version increments by exactly 1 on each of pickup and deliver, so a version captured before pickup is stale at reconcile and a fresh capture after deliver succeeds (412 vs 200)."
        test_recipe:
          setup: ["A visit delivered; version observed after deliver."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "OccCo", service_day: "MON", shortage_grace_units: 5 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
