          rationale: "The named §1.8 instance asserts funded_total_cents, disbursed_total_cents and funding_balance_cents after the create, after the funding update and after the reversal that removes the source, with no drift."

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:

      - name: every_cascaded_money_field_is_already_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.lot_handling_fee
          - calculations.statement_net_payable
        distinguishing_aspect: |
          The declared model is `immediate`, so no read in this fixture is
          allowed to lag: the finalize response itself carries the lot's minted
          money rather than nulls to be filled in later, the very next read of
          the parent submission already shows the rolled-up totals and the bumped
          version, the offer's redemption counter is already consumed, and the
          statement issued immediately afterwards computes off those fresh values
          without any intervening refresh call. A single fixture with no waits,
          no retries and no second read of the same resource.
