              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "LABS", outcome: "DEFER" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_OPEN_FAILED_CHECK"
            - "SurgicalCase.${case_id}.clearance_status == PENDING_CLEARANCE"

  # ===========================================================================
  # Stubs — corners already exercised by §1.8 difficulty instances.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: block_release_cascade_stub
        claim_type: Cascade down
        grounds: [state_machines.SurgeonBlock.CONFIRMED_to_RELEASED]
        excluded_because:
          difficulty_instance: block_release_cascades_to_case_implant_supply_depth3
          rationale: "The depth-3 block-release cascade (force-cancel case, release implant, free supply) is fully asserted by the named §1.8 instance."
      - name: case_parallel_dimension_stub
        claim_type: parallel
        grounds: [state_machines.SurgicalCase.ON_HOLD_to_PENDING_CLEARANCE]
        excluded_because:
          difficulty_instance: case_parallel_dimensions_evolve_independently
          rationale: "Independent evolution of clearance_status vs case_status is asserted by the named §1.8 instance."

  - section: calculations
    instances:
      - name: estimated_vs_actual_dual_variant_stub
        claim_type: Variant Divergence
        grounds: [calculations.estimated_case_cost, calculations.actual_case_cost]
        excluded_because:
          difficulty_instance: estimated_vs_actual_case_cost_diverge
          rationale: "Variant divergence (estimate vs actual case cost) is asserted by the named §1.8 instance."
      - name: asc_payment_grouping_stub
        claim_type: Correct Result
        grounds: [calculations.asc_payment_grouping]
        excluded_because:
          difficulty_instance: asc_payment_grouping_pinned_evaluation_order
          rationale: "Device offset + multi-proc reduction ordering is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: or_turnover_overlap_stub
        claim_type: Temporal validation
        grounds:
          - "validations[priority=12]"
        excluded_because:
          difficulty_instance: or_overlap_with_turnover_buffer
          rationale: "OR turnover-buffer overlap rejection is asserted by the named §1.8 instance."
      - name: anesthesia_overlap_stub
        claim_type: Temporal validation
        grounds:
          - "validations[priority=13]"
        excluded_because:
          difficulty_instance: anesthesia_overlap_no_buffer_strict
          rationale: "Anesthesia no-buffer overlap rejection is asserted by the named §1.8 instance."
      - name: block_capacity_boundary_stub
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=18]"
        excluded_because:
          difficulty_instance: block_capacity_exact_fill_allowed_one_over_rejected
          rationale: "Block-minute capacity boundary (exact fill allowed, one over rejected) is asserted by the named §1.8 instance."
