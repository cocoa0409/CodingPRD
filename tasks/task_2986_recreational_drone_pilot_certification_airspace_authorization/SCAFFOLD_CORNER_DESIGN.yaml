      - name: every_collection_endpoint_answers_its_declared_filters
        claim_type: listing
        grounds:
          - endpoints.GET_/drone-ops/pilots
          - endpoints.GET_/drone-ops/knowledge-tests
          - endpoints.GET_/drone-ops/aircraft
          - endpoints.GET_/drone-ops/remote-id-modules
          - endpoints.GET_/drone-ops/airspace-zones
          - endpoints.GET_/drone-ops/airspace-authorizations
          - endpoints.GET_/drone-ops/waivers
          - endpoints.GET_/drone-ops/safety-cases
          - endpoints.GET_/drone-ops/insurance-policies
        distinguishing_aspect: |
          A breadth probe over the nine collection endpoints whose filters no other instance
          exercises, each queried with every declared query parameter at once against a fixture
          holding exactly one matching row. The point is that each declared filter name is
          honoured and that filters combine as AND rather than OR: the same collections are then
          queried with one deliberately wrong facet and must come back empty. It also pins the
          pagination defaults on requests that omit limit and offset entirely.
