# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not already covered by §1.8.
# Taxonomy follows references/claim-extraction-guide.md (sections == section: ,
# per-section rows == claim_type:).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Project
          - endpoints
        distinguishing_aspect: "POST /projects with all required fields -> 201; response carries id, status DRAFT, contract_value_cents 0, scope_locked false, version 1."
        test_recipe:
          setup: ["A homeowner exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Cre Ate", email: "c_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "New", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Project.${p_id}.status == DRAFT"
            - "Project.${p_id}.contract_value_cents == 0"
            - "Project.${p_id}.scope_locked == false"
            - "Project.${p_id}.version == 1"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Project
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /projects/{random-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB except auth role."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_project_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Project.fields.budget_cap_cents
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /projects omitting budget_cap_cents -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A homeowner exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Miss Ing", email: "m_i1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "NoBudget", bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_project_min_rating_default_applied
        claim_type: Defaults
        grounds:
          - entities.Project.fields.min_rating
        distinguishing_aspect: "Omitting min_rating -> default 0 applied on the created project."
        test_recipe:
          setup: ["A homeowner exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Def Ault", email: "d_a1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "DefRating", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
          assert:
            - "Project.${p_id}.min_rating == 0"

      - name: scope_line_item_estimated_total_computed
        claim_type: Computed Fields
        grounds:
          - entities.ScopeLineItem.fields.estimated_total_cents
          - calculations.project_estimate
        distinguishing_aspect: "estimated_total_cents = round_half_up(quantity * estimated_unit_cost_cents) computed by server; client cannot override."
        test_recipe:
          setup: ["A DRAFT project exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Comp Field", email: "cf_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "CompProj", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Tile", quantity: 50, unit: "SQFT", estimated_unit_cost_cents: 333 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s_id: "$.data.id", est: "$.data.estimated_total_cents" }
          assert:
            - "ScopeLineItem.${s_id}.estimated_total_cents == 16650 (round_half_up(50 * 333))"

      - name: create_contractor_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Contractor.fields.qualification_status
        distinguishing_aspect: "id/created_at/version system-generated; qualification_status defaults PENDING regardless of any client-supplied value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contractors"
              payload: { legal_name: "Sys Co", trade: "PLUMBING", license_number: "SY", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id", qs: "$.data.qualification_status", v: "$.data.version" }
          assert:
            - "Contractor.${c_id}.qualification_status == PENDING"
            - "Contractor.${c_id}.version == 1"

      - name: create_scope_line_item_invalid_enum_unit_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ScopeLineItem.fields.unit
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "unit not in {SQFT,UNIT,HOUR,LUMP} -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A DRAFT project exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Enum Bad", email: "eb_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "EnumProj", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Bad", quantity: 1, unit: "TONNE", estimated_unit_cost_cents: 100 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Project
          - response_envelope
        distinguishing_aspect: "GET /projects?limit=1 returns array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two projects exist for one homeowner."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Page Er", email: "pg_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "P1", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "P2", budget_cap_cents: 500000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "GET /projects?homeowner_id=${ho_id}&limit=1&offset=0"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          assert:
            - "response_type == array; total_count == 2; has_more == true; data length == 1"

      - name: parent_relationship_scope_item_wrong_project_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ScopeLineItem.fields.project_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /projects/{nonexistent}/scope-line-items -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["A homeowner exists (acts as owner of a real project not used here)."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Par Ent", email: "pa_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
          trigger:
            - call: "POST /projects/00000000-0000-4000-8000-000000000001/scope-line-items"
              payload: { description: "X", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 100 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: qualify_contractor_pending_to_qualified
        claim_type: Valid Transition
        grounds:
          - state_machines.Contractor.PENDING_to_QUALIFIED
        distinguishing_aspect: "POST /contractors/{id}/qualify on a PENDING contractor with valid license/insurance -> QUALIFIED."
        test_recipe:
          setup: ["A PENDING contractor with future license and >= MIN_INSURANCE_CENTS."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Qual Co", trade: "GENERAL", license_number: "QC", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
              captures: { qs: "$.data.qualification_status" }
          assert:
            - "Contractor.${c_id}.qualification_status == QUALIFIED"

      - name: qualify_contractor_insurance_too_low_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Contractor.PENDING_to_QUALIFIED
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Qualifying a contractor with insurance_coverage_cents below MIN_INSURANCE_CENTS (1000000) is rejected; contractor stays PENDING."
        test_recipe:
          setup: ["A PENDING contractor with insurance 500000 (< 1000000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "LowIns Co", trade: "GENERAL", license_number: "LI", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 500000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "qualification rejected; Contractor.${c_id}.qualification_status == PENDING"

      - name: contractor_starts_in_pending_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Contractor
          - entities.Contractor.fields.qualification_status
        distinguishing_aspect: "A newly created Contractor begins in qualification_status PENDING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contractors"
              payload: { legal_name: "Init Co", trade: "HVAC", license_number: "IN", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id", qs: "$.data.qualification_status" }
          assert:
            - "Contractor.${c_id}.qualification_status == PENDING"

      - name: revoke_from_qualified_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Contractor
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /contractors/{id}/revoke on a QUALIFIED (not SUSPENDED) contractor -> ERR_INVALID_STATE; revoke is only defined from SUSPENDED."
        test_recipe:
          setup: ["A QUALIFIED contractor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Rev Co", trade: "GENERAL", license_number: "RV", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /contractors/${c_id}/revoke"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"
            - "Contractor.${c_id}.qualification_status == QUALIFIED"

      - name: revoked_contractor_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Contractor.SUSPENDED_to_REVOKED
        distinguishing_aspect: "From REVOKED (terminal), qualify is not possible -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REVOKED contractor (PENDING -> QUALIFIED -> SUSPENDED -> REVOKED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Term Co", trade: "GENERAL", license_number: "TM", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors/${c_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors/${c_id}/revoke"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"
            - "Contractor.${c_id}.qualification_status == REVOKED"

      - name: award_cascade_rejects_sibling_bids
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Project.OPEN_FOR_BIDS_to_AWARDED
          - state_machines.Bid.SUBMITTED_to_REJECTED
        distinguishing_aspect: "On award, every other SUBMITTED bid on the project transitions to REJECTED (cascade-down side effect)."
        test_recipe:
          setup: ["Project OPEN_FOR_BIDS with two SUBMITTED bids; one is awarded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Cas Cade", email: "cc_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /contractors"
              payload: { legal_name: "Win Co", trade: "GENERAL", license_number: "WN", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c1_id: "$.data.id" }
            - call: "POST /contractors/${c1_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Lose Co", trade: "GENERAL", license_number: "LS", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c2_id: "$.data.id" }
            - call: "POST /contractors/${c2_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "CasProj", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Whole", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 600000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Done", release_pct: 1.0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_ver_open: "$.data.version" }
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${c1_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { b_win: "$.data.id" }
            - call: "POST /bids/${b_win}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 500000 }
              as: Contractor
              as_user_id: "${c1_id}"
            - call: "POST /bids/${b_win}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${c1_id}"
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${c2_id}", duration_days: 40 }
              as: Contractor
              as_user_id: "${c2_id}"
              captures: { b_lose: "$.data.id" }
            - call: "POST /bids/${b_lose}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 550000 }
              as: Contractor
              as_user_id: "${c2_id}"
            - call: "POST /bids/${b_lose}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${c2_id}"
          trigger:
            - call: "POST /projects/${p_id}/award"
              payload: { bid_id: "${b_win}", expected_project_version: "${p_ver_open}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          assert:
            - "Bid.${b_win}.status == AWARDED"
            - "Bid.${b_lose}.status == REJECTED"
            - "Project.${p_id}.scope_locked == true"
            - "Project.${p_id}.contract_value_cents == 500000"

      - name: withdraw_then_award_withdrawn_bid_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After a bid is WITHDRAWN, awarding it -> ERR_INVALID_STATE (award only from SUBMITTED)."
        test_recipe:
          setup: ["Project OPEN_FOR_BIDS with one SUBMITTED bid that is then withdrawn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "With Draw", email: "wd_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /contractors"
              payload: { legal_name: "WD Co", trade: "GENERAL", license_number: "WD", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "WDProj", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: "$.data.id" }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Whole", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 600000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Done", release_pct: 1.0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_ver_open: "$.data.version" }
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${c_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${c_id}"
              captures: { bid_id: "$.data.id" }
            - call: "POST /bids/${bid_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 500000 }
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /bids/${bid_id}/withdraw"
              payload: {}
              as: Contractor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /projects/${p_id}/award"
              payload: { bid_id: "${bid_id}", expected_project_version: "${p_ver_open}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"
            - "Bid.${bid_id}.status == WITHDRAWN"

      - name: project_complete_bubbles_escrow_closed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Project.IN_PROGRESS_to_COMPLETED
          - entities.Escrow.fields.status
        distinguishing_aspect: "Completing a project (all milestones PAID, retainage released) sets Escrow.status CLOSED."
        test_recipe:
          setup: ["Project IN_PROGRESS with a single milestone (release_pct 1.0, final) drawn and PAID, retainage 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Comp Lete", email: "cl_e1@x.com" }
              as: Anonymous
              captures: { ho_id: "$.data.id" }
            - call: "POST /contractors"
              payload: { legal_name: "CL Co", trade: "GENERAL", license_number: "CL", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: "$.data.id" }
