  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sweep_threshold_strict_greater_boundary
        grounds:
          - calculations.investable_cash_sweep
          - validations[priority=15]
          - errors[ERR_NOTHING_TO_SWEEP]
        distinguishing_aspect: |
          On POST /sweeps, cash exactly == invest_threshold_cents (200000) yields swept=0 and is rejected
          ERR_NOTHING_TO_SWEEP (strict '>' boundary, not '>='). This is the threshold-crossing metric on
          the sweep endpoint, distinct from instance #2's zero-count metric on the contributions endpoint.
        test_recipe:
          setup:
            - "ACTIVE account, cash_balance_cents exactly 200000 (== invest_threshold_cents) from a posted INDIVIDUAL contribution of 200000."
          setup_api_calls:
