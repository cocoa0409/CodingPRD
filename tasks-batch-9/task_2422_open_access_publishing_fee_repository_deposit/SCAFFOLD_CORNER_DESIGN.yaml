            - "RepositoryDeposit.${e3_dep_id}.status == INGESTED"

      - name: corner_sub_resource_lists_are_scoped_to_their_parent
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /authors/{id}/grants]
          - endpoints[GET /funders/{id}/grants]
        distinguishing_aspect: |
          Three grants span two funders and two PIs. GET /authors/{id}/grants returns only the
          two grants whose pi_author_id is that author, and GET /funders/{id}/grants returns
          only the two grants of that funder — the intersecting grant appears in both lists and
          the unrelated grant in neither, so neither list is the unfiltered table.
        test_recipe:
          setup:
            - "authors A and B; funders F1 and F2"
            - "grant 1 = F1/A, grant 2 = F2/A, grant 3 = F1/B"
          setup_api_calls:
