      - name: worker_hours_conserved_under_assign_release
        grounds:
          - entities.Worker.fields.scheduled_hours_current_week
          - entities.LaborShift.fields.headcount_assigned
          - state_machines.ShiftAssignment
        distinguishing_aspect: |
          Conserved quantity: labor hours — INVARIANT: worker.scheduled_hours_current_week ==
          Σ hours of {ASSIGNED, CONFIRMED} assignments in the clock's ISO week, and
          shift.headcount_assigned == count of those assignments. Assign (+8h, headcount 1)
          then release returns both counters to their exact baselines (0.00 / 0).
        test_recipe:
          setup:
            - "Worker W1 (PACK_CREW); shift 2026-08-05 07:00-15:00 PUBLISHED; clock 2026-08-03 (same ISO week)"
          setup_api_calls:
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/workers", payload: { full_name: "W One", certifications: ["PACK_CREW"], hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { w1: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-05", role_type: "PACK_CREW", start_at: "2026-08-05T07:00:00Z", end_at: "2026-08-05T15:00:00Z", headcount_required: 2, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh: "$.data.id" } }
            - { call: "POST /farm/labor-shifts/${sh}/publish", as: LaborPlanner, captures: { sh_v: "$.data.version" } }
          trigger:
            - { call: "POST /farm/labor-shifts/${sh}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${sh_v}" }, as: LaborPlanner, captures: { asg: "$.data.id" } }
            - { call: "GET /farm/workers/${w1}", as: LaborPlanner, captures: { hrs_mid: "$.data.scheduled_hours_current_week" } }
            - { call: "GET /farm/labor-shifts/${sh}", as: LaborPlanner, captures: { hc_mid: "$.data.headcount_assigned" } }
            - { call: "POST /farm/labor-shifts/${sh}/assignments/${asg}/release", as: LaborPlanner }
            - { call: "GET /farm/workers/${w1}", as: LaborPlanner, captures: { hrs_end: "$.data.scheduled_hours_current_week" } }
            - { call: "GET /farm/labor-shifts/${sh}", as: LaborPlanner, captures: { hc_end: "$.data.headcount_assigned" } }
          assert:
            - "after assign: scheduled_hours_current_week == 8.00 and headcount_assigned == 1"
            - "after release (compensating action): scheduled_hours_current_week == 0.00 and headcount_assigned == 0 — exact restoration"
            - "ShiftAssignment.${asg}.assignment_status == RELEASED"
