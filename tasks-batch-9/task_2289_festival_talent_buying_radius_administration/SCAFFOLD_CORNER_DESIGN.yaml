      - name: draw_penalty_rounds_half_up_and_both_variants_agree_without_reports
        claim_type: precision
        grounds:
          - calculations.artist_radius_risk_score
          - endpoints[GET /festival-ops/artists/{id}/radius-risk]
          - entities.Artist.fields.draw_score
        distinguishing_aspect: |
          DRAW_PENALTY_WEIGHT * (100 - draw_score) is the only rounded term in the score:
          0.20 * 13 = 2.6 must round half-up to 3 (truncation would give 2) while
          0.20 * 60 = 12.0 needs no rounding at all. With no reports and no violations
          both variants collapse onto the penalty alone, which is what makes the rounding
          visible in isolation - and a penalty of 12 is still far below
          RISK_BLOCK_THRESHOLD, so neither artist is blocked.
        test_recipe:
          setup:
            - "Two roster rows with no competing-performance history: draw_score 87 and draw_score 40."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Cassia Vale Touring Inc", performing_name: "Cassia Vale", primary_genre: "POP", agency: "Meridian Talent", draw_score: 87, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_hi: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Bramble Line LLC", performing_name: "Bramble Line", primary_genre: "FOLK", agency: "Meridian Talent", draw_score: 40, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_lo: "$.data.id" }
          trigger:
            - call: "GET /festival-ops/artists/${artist_hi}/radius-risk"
              payload: { variant: "STRICT" }
              as: BusinessAffairs
            - call: "GET /festival-ops/artists/${artist_hi}/radius-risk"
              payload: { variant: "ADJUDICATED" }
              as: BusinessAffairs
            - call: "GET /festival-ops/artists/${artist_lo}/radius-risk"
              as: BusinessAffairs
            - call: "GET /festival-ops/artists/${artist_lo}"
              as: TalentBuyer
          assert:
            - "first call: draw_penalty == 3 and risk_score == 3 and blocked == false"
            - "second call: draw_penalty == 3 and risk_score == 3 (both variants equal with an empty history)"
            - "third call: variant == \"STRICT\" by default, draw_penalty == 12, risk_score == 12, blocked == false"
            - "third call: reported_conflict_count == 0 and radius_breach_count == 0"
            - "fourth call: data.strict_risk_score == 12 and data.adjudicated_risk_score == 12"

