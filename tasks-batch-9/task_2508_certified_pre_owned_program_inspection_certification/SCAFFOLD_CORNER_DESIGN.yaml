      - name: template_publish_without_critical_item_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines[ChecklistTemplate].transitions[DRAFT->PUBLISHED].preconditions
          - validations[priority=35]
          - errors[ERR_TEMPLATE_NOT_PUBLISHABLE]
        distinguishing_aspect: |
          Both publish preconditions are separately enforced: an empty template fails on
          point_count >= 1 and a template holding only a MAJOR point fails on
          critical_item_count >= 1, each with ERR_TEMPLATE_NOT_PUBLISHABLE at 422 rather than the
          409 state family, because the template really is DRAFT. Adding one CRITICAL point makes
          the same call succeed.
        test_recipe:
          setup:
            - "One empty DRAFT template."
          setup_api_calls:
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
