            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { kt1: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${kt1}/grade"
              payload: { raw_score: 80 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Night Owl", serial_number: "SN-XWVR-01", takeoff_weight_g: 249, max_altitude_ft: 700 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pv: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 500, operation_description: "Night thermal inspection of a fenced substation with lighting on the airframe.", expected_pilot_version: "${pv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wid: $.data.id }
            - call: "POST /drone-ops/waivers/${wid}/safety-cases"
              payload: { mitigation_summary: "Anti-collision strobe visible for 3 statute miles; site is fenced and unlit to the public.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Lost-link hover then descend vertically inside the fence line." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { scid: $.data.id }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/currency-review"
              payload: {}
              as: ComplianceOfficer
              captures: { lapsed: $.data.status }
          trigger:
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-05-03T00:00:00Z" }
