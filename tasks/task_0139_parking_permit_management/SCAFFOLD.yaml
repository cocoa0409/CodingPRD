    path: "/parking/validations"
    description: "Merchant issues a parking validation"
    roles: [Merchant]
    code: 201
    input: [garage_id, merchant_id, discount_kind, discount_value, expires_at_utc]
    output: Validation
    side_effects: ["rejects when merchant budget is 0"]
  - method: GET
    path: "/parking/validations/{id}"
    description: "Read a validation"
    roles: [FacilityAdmin, Merchant, Motorist]
    code: 200
    input: []
    output: Validation
    side_effects: []
  - method: GET
    path: "/parking/garages/{id}/validations"
    description: "List validations redeemable at a garage (reverse-reachability for Validation.garage_id)"
    roles: [FacilityAdmin, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Validation[]
    side_effects: []

  # ---- AccessSession (gated access) ----
  - method: POST
    path: "/parking/sessions"
    description: "Gate entry: open an AccessSession; server selects a space and classifies PERMIT vs TRANSIENT"
    roles: [FacilityAdmin]
    code: 201
    input: [garage_id, plate, entry_at_utc, "permit_id?"]
    output: AccessSession
    side_effects: ["selects an AVAILABLE+unoccupied Space per selector policy", "sets session_kind", "sets Space.is_occupied true", "recompute Garage.occupied_count +1"]
  - method: GET
    path: "/parking/sessions/{id}"
    description: "Read an access session (includes gross/net charge after exit)"
    roles: [FacilityAdmin, EnforcementOfficer, Motorist]
    code: 200
    input: []
    output: AccessSession
    side_effects: []
  - method: POST
    path: "/parking/sessions/{id}/exit"
    description: "Gate exit: close the session, compute charges and apply validation"
    roles: [FacilityAdmin]
    code: 200
    input: [exit_at_utc, "validation_id?"]
    output: AccessSession
    side_effects: ["computes gross/net", "frees the space", "redeems validation + debits merchant budget", "increments AccessSession.version by 1"]
  - method: POST
    path: "/parking/sessions/{id}/void"
    description: "Void an OPEN session (gate error correction)"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: AccessSession
    side_effects: ["sets VOIDED", "frees the space", "increments AccessSession.version by 1"]
  - method: GET
    path: "/parking/spaces/{id}/sessions"
    description: "List sessions that referenced a space (reverse-reachability for AccessSession.space_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccessSession[]
    side_effects: []
  - method: GET
    path: "/parking/permits/{id}/sessions"
    description: "List sessions admitted under a permit (reverse-reachability for AccessSession.permit_id)"
    roles: [FacilityAdmin, EnforcementOfficer, Motorist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccessSession[]
    side_effects: []
  - method: GET
    path: "/parking/validations/{id}/sessions"
    description: "List sessions that redeemed a validation (reverse-reachability for AccessSession.validation_id)"
    roles: [FacilityAdmin, Merchant]
    code: 200
    input: ["limit?", "offset?"]
    output: AccessSession[]
    side_effects: []

  # ---- LPR / PlateRead (enforcement) ----
  - method: POST
    path: "/parking/plate-reads"
    description: "Submit an LPR camera read; server evaluates enforcement outcome and matched permit"
    roles: [EnforcementOfficer]
    code: 201
    input: [garage_id, plate, zone_id, read_at_utc]
    output: PlateRead
    side_effects: ["computes enforcement_outcome and matched_permit_id per §1.3 lpr_enforcement"]
  - method: GET
    path: "/parking/plate-reads/{id}"
    description: "Read an LPR read result"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: PlateRead
    side_effects: []
  - method: GET
    path: "/parking/garages/{id}/plate-reads"
    description: "List plate reads for a garage (reverse-reachability for PlateRead.garage_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["enforcement_outcome?", "limit?", "offset?"]
    output: PlateRead[]
    side_effects: []
  - method: GET
    path: "/parking/zones/{id}/plate-reads"
    description: "List plate reads observed in a zone (reverse-reachability for PlateRead.zone_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlateRead[]
    side_effects: []
  - method: GET
    path: "/parking/permits/{id}/plate-reads"
    description: "List plate reads matched to a permit (reverse-reachability for PlateRead.matched_permit_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlateRead[]
    side_effects: []

  # ---- Citation + Appeal ----
  - method: POST
    path: "/parking/citations"
    description: "Issue a citation from a violation plate read; computes escalated fine"
    roles: [EnforcementOfficer]
    code: 201
    input: [garage_id, plate, plate_read_id, violation_code, base_fine_cents]
    output: Citation
    side_effects: ["computes amount_due_cents + prior_citation_count", "resolves motorist_id from plate", "recompute Motorist.outstanding_balance_cents"]
  - method: GET
    path: "/parking/citations/{id}"
    description: "Read a citation"
    roles: [FacilityAdmin, EnforcementOfficer, Motorist]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: POST
    path: "/parking/citations/{id}/pay"
    description: "Motorist pays a citation (OCC on citation version)"
    roles: [Motorist]
    code: 200
    input: [expected_citation_version]
    output: Citation
    side_effects: ["sets PAID", "recompute Motorist.outstanding_balance_cents", "increments Citation.version by 1"]
  - method: GET
    path: "/parking/citations/{id}/appeals"
    description: "List appeals for a citation (reverse-reachability for Appeal.citation_id)"
    roles: [FacilityAdmin, EnforcementOfficer, Motorist]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/parking/plate-reads/{id}/citations"
    description: "List citations issued from a plate read (reverse-reachability for Citation.plate_read_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: POST
    path: "/parking/appeals"
    description: "Motorist submits an appeal against an ISSUED citation"
    roles: [Motorist]
    code: 201
    input: [citation_id, motorist_id, reason]
    output: Appeal
    side_effects: []
  - method: GET
    path: "/parking/appeals/{id}"
    description: "Read an appeal"
    roles: [FacilityAdmin, EnforcementOfficer, Motorist]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/parking/motorists/{id}/appeals"
    description: "List a motorist's appeals (reverse-reachability for Appeal.motorist_id)"
    roles: [FacilityAdmin, Motorist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/parking/appeals/{id}/decide"
    description: "Enforcement officer decides an appeal; cascades the citation and motorist balance"
    roles: [EnforcementOfficer]
    code: 200
    input: [decision]
    output: Appeal
    side_effects: ["UPHELD -> citation DISMISSED -> balance down; DISMISSED -> citation UPHELD", "increments Appeal.version by 1"]

  # ---- test-driving clock ----
  - method: POST
    path: "/parking/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's notion of current UTC for expiry/redemption checks"
    roles: [FacilityAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["fixes clock now used by permit expiry, validation expiry, and LPR evaluation"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting Motorist/Merchant is not the owner of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, malformed body, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state that permits the requested transition"
  - id: ERR_ZONE_TYPE_FORBIDDEN
    http: 409
    condition: "permit activation in a non-permit zone, or transient session in a permit-only zone"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violation (zone code, space label, motorist email, duplicate WAITING waitlist entry)"
  - id: ERR_VALIDATION_NOT_REDEEMABLE
    http: 409
    condition: "validation expired, already redeemed, or for a different garage at session exit"
  - id: ERR_EVENT_WINDOW_OVERLAP
    http: 409
    condition: "PUBLISHED event window overlaps another PUBLISHED window for the same garage, or window_end_utc <= window_start_utc"
  - id: ERR_SPACE_OCCUPIED
    http: 409
    condition: "no AVAILABLE + unoccupied space remains in an eligible zone at entry"
  - id: ERR_GATE_CLOSED
    http: 409
    condition: "garage gate_mode is CLOSED, or PERMIT_ONLY and the plate has no valid ACTIVE permit"
  - id: ERR_ZONE_AT_CAPACITY
    http: 409
    condition: "Zone.permits_active_count would reach or exceed permit_capacity on activation/promotion"
  - id: ERR_MERCHANT_BUDGET_EXHAUSTED
    http: 409
    condition: "merchant has 0 remaining validation_budget_cents when issuing a validation"
  - id: ERR_INVALID_TIME_RANGE
    http: 409
    condition: "exit_at_utc not strictly after entry_at_utc"
  - id: ERR_STALE_ZONE_VERSION
    http: 412
    condition: "expected_zone_version (activate) or expected_citation_version (pay) does not match current parent version"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of bounds (limit < 1 or > 100, offset < 0)"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: FacilityAdmin
    description: "Owns garage inventory, zones, spaces, rate plans, event pricing, permit lifecycle, gate sessions, and waitlist promotion."
    identity: "opaque"
    exclusive_operations:
      - "POST /parking/garages, PATCH /parking/garages/{id}"
      - "POST /parking/zones, POST /parking/spaces, POST /parking/rate-plans"
      - "POST /parking/event-pricing, POST /parking/event-pricing/{id}/publish"
      - "POST /parking/permits/{id}/activate, .../reject, .../revoke, .../expire-check"
      - "POST /parking/zones/{id}/promote-waitlist"
      - "POST /parking/merchants"
      - "POST /parking/sessions, .../exit, .../void"
      - "POST /parking/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all entities"
      - "POST /parking/motorists (shared with Motorist)"
  - name: Motorist
    description: "Permit holder. Requests permits, joins/cancels waitlists, submits and owns appeals, pays own citations."
    identity: "entity_backed:Motorist"
    exclusive_operations:
      - "POST /parking/permits (request)"
      - "POST /parking/zones/{id}/waitlist, POST /parking/waitlist-entries/{id}/cancel"
      - "POST /parking/appeals"
      - "POST /parking/citations/{id}/pay"
    shared_operations:
      - "POST /parking/motorists (self-register, shared with FacilityAdmin)"
      - "GET own permits/waitlist-entries/appeals/citations/sessions"
  - name: Merchant
    description: "Issues parking validations against its own budget; owns its Validation rows."
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /parking/validations"
    shared_operations:
      - "GET own validations, garage validations, validation sessions"
      - "GET garage/zone/rate-plan reads"
  - name: EnforcementOfficer
    description: "Operates LPR enforcement, issues citations, and decides appeals."
    identity: "opaque"
    exclusive_operations:
      - "POST /parking/plate-reads"
      - "POST /parking/citations"
      - "POST /parking/appeals/{id}/decide"
    shared_operations:
      - "GET plate-reads, citations, appeals, sessions, permits, zones, spaces"
