      - name: val_stale_notice_version_reported_before_notice_not_negotiable
        claim_type: priority_ordering
        grounds:
          - validations[priority=31]
          - validations[priority=72]
          - errors[ERR_STALE_NOTICE_VERSION]
          - errors[ERR_NOTICE_NOT_NEGOTIABLE]
        distinguishing_aspect: |
          A settlement create can violate the priority-31 optimistic-concurrency guard and the
          priority-72 negotiable-status guard at once. The stale version must win (412
          ERR_STALE_NOTICE_VERSION); supplying the current version then surfaces
          ERR_NOTICE_NOT_NEGOTIABLE; and only after ESCALATE with the refreshed version does the
          create succeed. Because EVALUATE and ESCALATE each bump the notice version, the version
          captured at create time is necessarily stale by two.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED; product SKU-ORD has annual_units 1000 and no components."
            - "A notice served 2026-07-01 with earliest_violation_date 2026-05-01 sits in UNDER_EVALUATION; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-ORD", product_name: "Ordering Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 1000, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id, nv_stale: $.data.version }
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          trigger:
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 200000, expected_notice_version: "${nv_stale}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_current: $.data.version }
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 200000, expected_notice_version: "${nv_current}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_final: $.data.version }
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 200000, expected_notice_version: "${nv_final}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_1: $.data.id }
          assert:
            - "first trigger call: HTTP 412 with error_id ERR_STALE_NOTICE_VERSION (priority 31 beats priority 72 even though the notice is also non-negotiable)"
            - "third trigger call: HTTP 409 with error_id ERR_NOTICE_NOT_NEGOTIABLE (status UNDER_EVALUATION)"
            - "no Settlement row exists before the sixth trigger call: GET /settlements?notice_id=${notice_1} returns total_count == 0"
            - "sixth trigger call: HTTP 201 and Settlement.${stl_1}.status == PROPOSED with round_count == 0 and proposed_by_user_id == rc_1"
            - "Settlement.${stl_1}.violation_days == 92 (2026-05-01 to the 2026-08-01 clock), base_penalty_cents == 500000 (min(250000 x 92, 500 x 1000)), mitigation_factor == 1.0000, adjusted_penalty_cents == 500000"
            - "Settlement.${stl_1}.fee_cap_cents == 500000, allowed_fees_cents == 200000, state_share_cents == 375000, noticing_party_share_cents == 125000, total_settlement_cents == 700000"

      - name: val_settlement_round_ceiling_counts_counter_and_revise
        claim_type: aggregate_validation
        grounds:
          - validations[priority=82]
          - errors[ERR_SETTLEMENT_ROUND_LIMIT]
          - entities.Settlement.fields.round_count
        distinguishing_aspect: |
          Both COUNTER and REVISE consume a round, so the ceiling is reached by an alternating
          sequence (COUNTER, REVISE, COUNTER) and the fourth move is refused with
          ERR_SETTLEMENT_ROUND_LIMIT. A counter-only counter would let the parties alternate forever.
          At exactly MAX_SETTLEMENT_ROUNDS the notice becomes eligible for LITIGATE, which is how the
          ceiling is meant to be escaped.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED; product SKU-ROUNDS has annual_units 1000 and no components."
            - "A notice served 2026-07-01 with earliest_violation_date 2026-05-01 has been escalated to SETTLEMENT_NEGOTIATION and carries a PROPOSED settlement with round_count 0; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-ROUNDS", product_name: "Rounds Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 1000, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id }
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_1: $.data.version }
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 200000, expected_notice_version: "${nv_1}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_1: $.data.id }
          trigger:
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "COUNTER" }
              as: RegulatoryCounsel
              as_user_id: "rc_2"
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "REVISE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "COUNTER" }
              as: RegulatoryCounsel
              as_user_id: "rc_2"
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "REVISE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "LITIGATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "trigger calls one to three: HTTP 200 with Settlement.${stl_1}.status COUNTERED, PROPOSED, COUNTERED and round_count 1, 2, 3 respectively"
            - "fourth trigger call: HTTP 409 with error_id ERR_SETTLEMENT_ROUND_LIMIT - REVISE is counted by the same ceiling as COUNTER - and status is still COUNTERED with round_count 3"
            - "Settlement.${stl_1}.violation_days == 92 and adjusted_penalty_cents == 500000 throughout: COUNTER and REVISE never recompute the frozen exposure window"
            - "fifth trigger call: HTTP 200 and NoticeOfViolation.${notice_1}.status == LITIGATION with Settlement.${stl_1}.status == VOID"

      - name: val_settlement_create_with_zero_violation_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=92]
          - errors[ERR_NO_VIOLATION_WINDOW]
          - calculations.settlement_money
        distinguishing_aspect: |
          violation_days is floor((clock now at create - earliest_violation_date) / 86400) and must be
          strictly positive, so a notice whose earliest_violation_date equals the create-time clock is
          refused with ERR_NO_VIOLATION_WINDOW even though the notice itself was legal (its
          earliest_violation_date is not after served_at, so the priority-63 rule passed). Advancing
          the clock by one day makes the identical create succeed with violation_days 1, which proves
          the window is measured against the clock and not against served_at.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED; product SKU-ZERO has annual_units 4000 and no components."
            - "A notice with served_at and earliest_violation_date both 2026-08-01T00:00:00Z has been escalated to SETTLEMENT_NEGOTIATION at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
