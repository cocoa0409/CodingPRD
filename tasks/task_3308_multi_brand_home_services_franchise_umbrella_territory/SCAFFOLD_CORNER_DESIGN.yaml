  - section: rbac
    instances:

      - name: compliance_auditor_cannot_drive_the_logical_clock
        claim_type: role_exclusive_operation_denied
        grounds:
          - roles[name=ComplianceAuditor].exclusive_operations
          - roles[name=FranchiseAdmin].exclusive_operations
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "ComplianceAuditor holds no exclusive operations at all, so even the clock control named in FranchiseAdmin's exclusive list is denied with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
