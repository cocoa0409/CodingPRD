          - errors[ERR_REQUIRED_TEST_MISSING]
          - endpoints[POST /bus-units/{id}/waive-nonconformance]
        distinguishing_aspect: |
          Two buses on the same order reach NONCONFORMING by different routes and the waiver branches on
          the failed test's TYPE, not on the fact of failure: unit A (all three required tests PASSED, an
          extra JOINT_STRENGTH test FAILED) is waivable and its failed test is VOIDED, while unit B (BRAKE
          FAILED) is not. The pair also separates priorities 37 and 38 on certify: unit A reports
          ERR_OPEN_TEST_FAILURE because nothing required is missing, unit B reports ERR_REQUIRED_TEST_MISSING
