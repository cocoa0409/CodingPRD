# =============================================================================
# PRD Benchmark Seed Tables — Carpet & Upholstery Cleaning (Expert tier)
# =============================================================================

scenario: |
  Carpet & Upholstery Cleaning: room/area & soiling assessment, service type
  (steam/dry) & pricing, add-on (stain/pet/protectant), truck-mount/job
  scheduling, dry-time & re-clean guarantee, recurring plan, move-furniture
  option, per-job billing

domain_name: carpet-upholstery-cleaning
api_prefix: /
# Flat peer-entity surface: collections are /customers, /crews, /cleaning-jobs,
# /service-catalogs, /recurring-plans, /invoices, /guarantee-claims — no single
# shared non-empty prefix, so api_prefix is the root.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation        # quoted (forward) price vs settled (chronological) price
    - cascading_side_effects          # job cancel/reschedule cascades to slot, invoice, wallet
    - rate_threshold_triggers         # soiling-tier surcharge breakpoints, recurring-cadence discount tiers
    - optimistic_concurrency          # OCC on Crew.version for slot booking; on Invoice.version for payment

  entity_topology: hybrid
  # CleaningJob is a small tree (job -> room assessments / add-ons), but Crew,
  # ServiceCatalog, RecurringPlan, Invoice/Payment, GuaranteeClaim, and
  # WalletLedgerEntry are peer entities joined by foreign keys.

  state_machine_shape: parallel
  # CleaningJob carries TWO independent state axes: lifecycle_status (booking
  # workflow) and billing_status (invoice/settlement). GuaranteeClaim adds a
  # branching fork-join. ScheduledSlot revolves a cyclic reschedule loop.

  relationship_patterns:
    - one_to_many        # CleaningJob -> RoomAssessment, CleaningJob -> AddOn, Invoice -> Payment
    - cross_aggregate    # CleaningJob references Crew, RecurringPlan, ServiceCatalog
    - self_referential   # CleaningJob.origin_job_id points to the job a re-clean re-does

  role_model: peer_roles
  # Customer owns own jobs; Dispatcher owns scheduling/crew; ServiceManager owns
  # catalog/guarantee adjudication; Billing owns invoices/payments.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; never used in business decisions" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Customers (ERR_EMAIL_TAKEN)" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Account credit balance in integer cents = sum of WalletLedgerEntry.delta_cents for this customer; starts 0; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; new customers start ACTIVE", default: "ACTIVE", constraints: "ACTIVE, SUSPENDED" }

  - name: ServiceCatalog
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: service_type, type: enum, source: input, description: "STEAM | DRY; unique across all ServiceCatalogs (ERR_SERVICE_TYPE_TAKEN)", constraints: "STEAM, DRY" }
      - { name: base_rate_cents_per_sqft, type: integer, source: input, description: "Base price per square foot in integer cents (>= 1)" }
      - { name: stain_addon_cents, type: integer, source: input, description: "Flat price for a STAIN add-on in cents (>= 0)" }
      - { name: pet_addon_cents, type: integer, source: input, description: "Flat price for a PET add-on in cents (>= 0)" }
      - { name: protectant_cents_per_sqft, type: integer, source: input, description: "Per-sqft price for a PROTECTANT add-on in cents (>= 0)" }
      - { name: move_furniture_flat_cents, type: integer, source: input, description: "Flat surcharge applied once per job when move_furniture is requested (>= 0)" }
      - { name: dry_time_minutes, type: integer, source: input, description: "Guaranteed dry-time ceiling for this service type in minutes (>= 1); STEAM is longer than DRY in practice" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: crew_name, type: string, source: input, description: "Crew / truck-mount unit label" }
      - { name: supported_service_type, type: enum, source: input, description: "STEAM | DRY — the single service type this truck-mount rig can perform", constraints: "STEAM, DRY" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Minimum gap required AFTER one slot before the next slot may begin on this crew (>= 0)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE; new crews start AVAILABLE", default: "AVAILABLE", constraints: "AVAILABLE, OUT_OF_SERVICE" }

  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer this plan belongs to" }
      - { name: cadence, type: enum, source: input, description: "MONTHLY | QUARTERLY | SEMIANNUAL — visit frequency tier driving the recurring discount", constraints: "MONTHLY, QUARTERLY, SEMIANNUAL" }
      - { name: completed_visit_count, type: integer, source: computed, description: "Count of CleaningJob rows for this plan whose lifecycle_status == COMPLETED; starts 0", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED; new plans start ACTIVE, pause endpoint sets PAUSED", default: "ACTIVE", constraints: "ACTIVE, PAUSED" }

  - name: CleaningJob
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who the job is for" }
      - { name: service_catalog_id, type: string, source: input, description: "FK -> ServiceCatalog.id; pins service_type and all rates for this job" }
      - { name: recurring_plan_id, type: string, source: input, description: "FK -> RecurringPlan.id; null for one-off jobs; when set, recurring discount applies", default: null }
      - { name: origin_job_id, type: string, source: system, description: "FK -> CleaningJob.id; set only on a re-clean job created from a granted GuaranteeClaim, else null", default: null }
      - { name: move_furniture, type: boolean, source: input, description: "Whether the move-furniture option is requested", default: false }
      - { name: total_sqft, type: integer, source: computed, description: "Sum of RoomAssessment.area_sqft across this job's rooms; starts 0", default: 0 }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Forward-looking quote computed at QUOTED entry from current rooms/add-ons; frozen on BOOKED" }
      - { name: settled_price_cents, type: integer, source: computed, description: "Chronological settled price computed at invoice issuance from the room/add-on snapshot; may diverge from quoted_price_cents", default: null }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | QUOTED | BOOKED | IN_PROGRESS | COMPLETED | CANCELLED — booking-workflow axis", default: "DRAFT", constraints: "DRAFT, QUOTED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED | PAID — independent settlement axis", default: "UNBILLED", constraints: "UNBILLED, INVOICED, PAID" }
      - { name: completed_at_minute, type: integer, source: input, description: "Logical completion clock in integer minutes from epoch-zero, supplied on the complete call; null until COMPLETED; anchors the guarantee window", default: null }
      - { name: scheduled_slot_id, type: string, source: system, description: "FK -> ScheduledSlot.id; set when the job is BOOKED onto a crew slot, else null", default: null }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when the job is invoiced, else null", default: null }

  - name: RoomAssessment
    parent: CleaningJob
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cleaning_job_id, type: string, source: system, description: "FK -> CleaningJob.id; parent job" }
      - { name: area_label, type: string, source: input, description: "Room/area name, e.g. 'Living Room', 'Sofa'" }
      - { name: area_sqft, type: integer, source: input, description: "Measured cleanable area in whole square feet (>= 1)" }
      - { name: soiling_level, type: enum, source: input, description: "LIGHT | MODERATE | HEAVY — soiling assessment driving the soiling surcharge tier", constraints: "LIGHT, MODERATE, HEAVY" }

  - name: AddOn
    parent: CleaningJob
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cleaning_job_id, type: string, source: system, description: "FK -> CleaningJob.id; parent job" }
      - { name: addon_type, type: enum, source: input, description: "STAIN | PET | PROTECTANT — at most one row per type per job (ERR_DUPLICATE_ADDON)", constraints: "STAIN, PET, PROTECTANT" }
      - { name: line_price_cents, type: integer, source: computed, description: "Priced from the job's ServiceCatalog at add-on creation: STAIN=stain_addon_cents, PET=pet_addon_cents, PROTECTANT=protectant_cents_per_sqft * job.total_sqft" }

  - name: ScheduledSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the truck-mount crew occupying this interval" }
      - { name: cleaning_job_id, type: string, source: system, description: "FK -> CleaningJob.id; the job this slot was booked for" }
      - { name: start_minute, type: integer, source: input, description: "Slot start as integer minutes from epoch-zero (>= 0)" }
      - { name: end_minute, type: integer, source: input, description: "Slot end as integer minutes from epoch-zero; must be > start_minute" }
      - { name: status, type: enum, source: system, description: "RESERVED | RELEASED; new slots start RESERVED", default: "RESERVED", constraints: "RESERVED, RELEASED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cleaning_job_id, type: string, source: input, description: "FK -> CleaningJob.id; the job being billed (one invoice per job)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Invoice face amount = job.settled_price_cents at issuance (>= 0)" }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Customer wallet credit consumed at issuance = min(customer.wallet_credit_cents, amount_due_cents)", default: 0 }
      - { name: net_payable_cents, type: integer, source: computed, description: "amount_due_cents - wallet_applied_cents (>= 0)" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for APPLIED payments on this invoice; starts 0", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | VOID; new invoices start OPEN", default: "OPEN", constraints: "OPEN, SETTLED, VOID" }

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; the invoice being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in integer cents (>= 1)" }
      - { name: method, type: enum, source: input, description: "CARD | CASH | CHECK", constraints: "CARD, CASH, CHECK" }
      - { name: status, type: enum, source: system, description: "APPLIED; payments are immutable once recorded (no reversal action in this version)", default: "APPLIED", constraints: "APPLIED" }

  - name: GuaranteeClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cleaning_job_id, type: string, source: input, description: "FK -> CleaningJob.id; the completed job the customer is unhappy with" }
      - { name: reason, type: string, source: input, description: "Customer-stated reason for the re-clean request" }
      - { name: filed_at_minute, type: integer, source: input, description: "Time the claim is filed, in integer minutes from epoch-zero (>= 0); used for the guarantee-window check" }
      - { name: reclean_job_id, type: string, source: system, description: "FK -> CleaningJob.id; the re-clean job created when this claim is GRANTED, else null", default: null }
      - { name: status, type: enum, source: system, description: "FILED | GRANTED | DENIED; new claims start FILED", default: "FILED", constraints: "FILED, GRANTED, DENIED" }

  - name: WalletLedgerEntry
    parent: Customer
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; the wallet owner" }
      - { name: delta_cents, type: integer, source: system, description: "Signed change to wallet_credit_cents; positive on credit grant, negative on consumption" }
      - { name: reason, type: enum, source: system, description: "GUARANTEE_CREDIT | INVOICE_APPLIED | INVOICE_REFUND — what produced this entry", constraints: "GUARANTEE_CREDIT, INVOICE_APPLIED, INVOICE_REFUND" }
      - { name: cleaning_job_id, type: string, source: system, description: "FK -> CleaningJob.id; the job that produced this ledger movement", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- CleaningJob lifecycle axis (one of two parallel axes) ----
  - entity: CleaningJob
    field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /cleaning-jobs/{id}/quote"
        actor: Customer
        preconditions:
          - "Job has >= 1 RoomAssessment (ERR_NO_ROOMS)"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "Compute total_sqft = sum(RoomAssessment.area_sqft)"
          - "Compute quoted_price_cents via quoted_price calculation and freeze it"

      - from: QUOTED
        to: BOOKED
        trigger: "POST /cleaning-jobs/{id}/book"
        actor: Dispatcher
        preconditions:
          - "Request supplies crew_id, start_minute, end_minute and expected_crew_version"
          - "Referenced Crew.status == AVAILABLE (ERR_CREW_UNAVAILABLE)"
          - "Crew.supported_service_type == job's ServiceCatalog.service_type (ERR_SERVICE_TYPE_MISMATCH)"
          - "No RESERVED ScheduledSlot on the crew overlaps [start_minute, end_minute) inclusive of turnaround_buffer_minutes (ERR_SLOT_OVERLAP)"
          - "expected_crew_version matches Crew.version (ERR_STALE_CREW_VERSION)"
        side_effects:
          - "Create ScheduledSlot{crew_id, cleaning_job_id, start_minute, end_minute, status=RESERVED}"
          - "Set job.scheduled_slot_id to the new slot id"
          - "Increment Crew.version by 1"

      - from: BOOKED
        to: IN_PROGRESS
        trigger: "POST /cleaning-jobs/{id}/start"
        actor: Dispatcher
        preconditions:
          - "job.scheduled_slot_id references a RESERVED ScheduledSlot (ERR_SLOT_NOT_RESERVED)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cleaning-jobs/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "Request supplies completed_at_minute (>= 0)"
        side_effects:
          - "Set job.completed_at_minute from the request"
          - "Release the job's ScheduledSlot (status RESERVED -> RELEASED)"
          - "If recurring_plan_id set and plan ACTIVE, plan.completed_visit_count increments by 1 (bubble-up recompute)"

      - from: [QUOTED, BOOKED]
        to: CANCELLED
        trigger: "POST /cleaning-jobs/{id}/cancel"
        actor: Customer
        preconditions:
          - "billing_status == UNBILLED (ERR_JOB_ALREADY_BILLED)"
        side_effects:
          - "If a RESERVED ScheduledSlot is attached, release it (RESERVED -> RELEASED) and clear scheduled_slot_id — this slot release is itself the first hop of the reschedule/cancel cascade"
        note: "DRAFT jobs cancel too but have no slot to release; see separate DRAFT->CANCELLED row"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cleaning-jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  # ---- CleaningJob billing axis (parallel, independent of lifecycle axis) ----
  - entity: CleaningJob
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [PAID]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /cleaning-jobs/{id}/invoice"
        actor: Billing
        preconditions:
          - "lifecycle_status == COMPLETED (ERR_JOB_NOT_COMPLETED)"
          - "No existing OPEN/SETTLED Invoice for this job (ERR_JOB_ALREADY_BILLED)"
        side_effects:
          - "Compute settled_price_cents via settled_price calculation (chronological add-on replay)"
          - "Create Invoice{cleaning_job_id, amount_due_cents=settled_price_cents}"
          - "Apply wallet: wallet_applied_cents = min(customer.wallet_credit_cents, amount_due_cents); write WalletLedgerEntry{delta_cents = -wallet_applied_cents, reason=INVOICE_APPLIED} (cascade hop: invoice issuance -> wallet debit)"
          - "Set net_payable_cents = amount_due_cents - wallet_applied_cents"
          - "Set job.invoice_id and billing_status=INVOICED"

      - from: INVOICED
        to: PAID
        trigger: "system (Invoice reaches SETTLED via payment)"
        actor: system
        preconditions:
          - "The job's Invoice.status == SETTLED"
        side_effects: []

  # ---- ScheduledSlot (cyclic via job reschedule) ----
  - entity: ScheduledSlot
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /cleaning-jobs/{id}/reschedule, job cancel, or job completion"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "On reschedule: a new RESERVED ScheduledSlot is created on the (possibly different) crew and job.scheduled_slot_id is repointed — the old slot's RELEASE is hop 1, the new slot's RESERVE is hop 2 of the reschedule cascade"
        note: "Cycle: a BOOKED job can release one slot and reserve another any number of times before it starts."

  # ---- GuaranteeClaim (branching fork-join: GRANTED vs DENIED diverge) ----
  - entity: GuaranteeClaim
    field: status
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /guarantee-claims/{id}/grant"
        actor: ServiceManager
        preconditions:
          - "Referenced CleaningJob.lifecycle_status == COMPLETED (ERR_JOB_NOT_COMPLETED)"
          - "filed_at_minute - origin.completed_at_minute <= origin_catalog.dry_time_minutes * GUARANTEE_WINDOW_FACTOR, inclusive (ERR_GUARANTEE_WINDOW_EXPIRED)"
        side_effects:
          - "Create a re-clean CleaningJob{customer_id, service_catalog_id, recurring_plan_id copied from origin, origin_job_id=origin job id, lifecycle_status=DRAFT}"
          - "Copy each origin RoomAssessment onto the re-clean job (cascade hop: grant -> reclean job -> room copy)"
          - "Grant a wallet goodwill credit: write WalletLedgerEntry{delta_cents=+GUARANTEE_GOODWILL_CENTS, reason=GUARANTEE_CREDIT} (cascade hop: grant -> wallet credit)"
          - "Set claim.reclean_job_id to the new job id"

      - from: FILED
        to: DENIED
        trigger: "POST /guarantee-claims/{id}/deny"
        actor: ServiceManager
        preconditions: []
        side_effects:
          - "No re-clean job; no wallet credit (the DENIED branch's side-effect set is deliberately empty — divergent from GRANTED)"

  # ---- Invoice (settlement) ----
  - entity: Invoice
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "system (cumulative APPLIED payments >= net_payable_cents)"
        actor: system
        preconditions:
          - "sum(APPLIED Payment.amount_cents) >= net_payable_cents"
        side_effects:
          - "Set the job's billing_status = PAID (cross-axis cascade)"

      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Billing
        preconditions:
          - "amount_paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS)"
        side_effects:
          - "Refund any wallet that was applied: write WalletLedgerEntry{delta_cents=+wallet_applied_cents, reason=INVOICE_REFUND} when wallet_applied_cents > 0"
          - "Reset job.billing_status = UNBILLED and clear job.invoice_id (compensation: invoice void undoes invoice issuance)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: book-slot-stale-crew
    parent_entity: Crew
    write_endpoint: "POST /cleaning-jobs/{id}/book"
    occ_field: "expected_crew_version"
    description: |
      Booking a job onto a Crew whose version has advanced since the client
      last observed it is rejected with a stale-version error. A prior booking
      on the same crew legitimately reserved an overlapping window and bumped
      Crew.version; a booking still carrying the older version is operating on
      a stale view of the crew's slot map and must be refused.
    error_id: ERR_STALE_CREW_VERSION
    http_status: 412

  - rule_id: pay-invoice-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /invoices/{id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Recording a Payment against an Invoice whose version has advanced since
      the client last observed it is rejected with a stale-version error. The
      invoice may already have been voided or settled by an earlier write that
      bumped Invoice.version; a payment carrying the older version reflects a
      stale view of the invoice and must be refused.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quoted_price
    trigger: "CleaningJob DRAFT -> QUOTED (POST /cleaning-jobs/{id}/quote)"
    algorithm: forward_looking
    formula: |
      # Forward-looking quote: prices EVERY room currently attached plus EVERY
      # add-on currently attached, regardless of any future edits. Evaluation
      # order is PINNED to make fee references well-defined:
      #   step 1  per-room base, summed:
      #             room_base_cents(r) = round_half_up(
      #                 catalog.base_rate_cents_per_sqft * r.area_sqft
      #                 * SOIL_MULT[r.soiling_level] )
      #             rooms_subtotal = sum over rooms of room_base_cents(r)
      #   step 2  add-on subtotal (each add-on's frozen line_price_cents):
      #             addons_subtotal = sum over add-ons of line_price_cents
      #   step 3  move-furniture flat surcharge (once per job, not per room):
      #             furn = catalog.move_furniture_flat_cents if job.move_furniture else 0
      #   step 4  pre-discount = rooms_subtotal + addons_subtotal + furn
      #   step 5  recurring discount keyed on the cadence TIER of the plan
      #           (null plan => 0%); discount applies to pre-discount:
      #             disc_pct = RECUR_DISCOUNT_PCT[plan.cadence] if recurring_plan_id else 0
      #             discount_cents = round_half_up(pre_discount * disc_pct)
      #   step 6  quoted_price_cents = pre_discount - discount_cents
      # Rounding order is PINNED: round each room line FIRST (step 1), then sum;
      # the discount is computed on the summed pre-discount and rounded ONCE.
    input_set: "All RoomAssessment rows and all AddOn rows attached to the job at quote time; soiling tier per room"
    constants:
      SOIL_MULT: { LIGHT: 1.0, MODERATE: 1.25, HEAVY: 1.6 }
      RECUR_DISCOUNT_PCT: { MONTHLY: 0.15, QUARTERLY: 0.10, SEMIANNUAL: 0.05 }
    precision: "integer cents; round_half_up at each pinned rounding step"
    variants:
      - name: forward_quote
        when: "at QUOTED entry"
        difference: "Prices the current room/add-on set as a projection; frozen into quoted_price_cents and never recomputed."

  - name: settled_price
    trigger: "CleaningJob billing UNBILLED -> INVOICED (POST /cleaning-jobs/{id}/invoice)"
    algorithm: chronological
    formula: |
      # Chronological settle: re-prices the job by replaying its rooms and
      # add-ons in created_at ASC order at INVOICE time, applying the
      # HEAVY-soiling escalation surcharge that the forward quote does NOT:
      # any job whose count of HEAVY rooms (processed chronologically) reaches
      # HEAVY_ESCALATION_COUNT incurs a one-time escalation surcharge, because
      # heavy soiling found across many rooms means extra solution/passes that
      # the quote optimistically omitted.
      #   step 1  recompute rooms_subtotal exactly as quoted_price step 1
      #           (same SOIL_MULT, same per-room round-then-sum), BUT iterate
      #           rooms in created_at ASC (tie-break created_at ASC, then it is
      #           already unique) and count heavy_rooms as you go.
      #   step 2  addons_subtotal = sum of AddOn.line_price_cents (created_at ASC)
      #   step 3  furn = catalog.move_furniture_flat_cents if job.move_furniture else 0
      #   step 4  escalation = HEAVY_ESCALATION_CENTS if heavy_rooms >= HEAVY_ESCALATION_COUNT else 0
      #   step 5  pre_discount = rooms_subtotal + addons_subtotal + furn + escalation
      #   step 6  same recurring discount as quoted_price step 5
      #             disc_pct = RECUR_DISCOUNT_PCT[plan.cadence] if recurring_plan_id else 0
      #             discount_cents = round_half_up(pre_discount * disc_pct)
      #   step 7  settled_price_cents = pre_discount - discount_cents
      # Divergence from quoted_price: the escalation surcharge in step 4 (the
      # quote never adds it), so a job with >= HEAVY_ESCALATION_COUNT heavy
      # rooms settles HIGHER than it quoted.
    input_set: "RoomAssessment and AddOn rows replayed in created_at ASC order; heavy-room running count"
    constants:
      SOIL_MULT: { LIGHT: 1.0, MODERATE: 1.25, HEAVY: 1.6 }
      RECUR_DISCOUNT_PCT: { MONTHLY: 0.15, QUARTERLY: 0.10, SEMIANNUAL: 0.05 }
      HEAVY_ESCALATION_COUNT: 3
      HEAVY_ESCALATION_CENTS: 4000
    precision: "integer cents; round_half_up at each pinned rounding step"
    variants:
      - name: chronological_settle
        when: "at invoice issuance"
        difference: "Adds the HEAVY_ESCALATION surcharge keyed on heavy-room count, producing a value that diverges from the forward quote on heavily soiled jobs."

  - name: addon_line_price
    trigger: "AddOn creation (POST /cleaning-jobs/{id}/add-ons)"
    algorithm: aggregation
    formula: |
      # Combinatorial price selection with >= 3 inputs and a conditional branch
      # on add-on type; PROTECTANT is area-scaled, the others are flat.
      if addon_type == STAIN:        line_price_cents = catalog.stain_addon_cents
      elif addon_type == PET:        line_price_cents = catalog.pet_addon_cents
      elif addon_type == PROTECTANT: line_price_cents = round_half_up(
                                        catalog.protectant_cents_per_sqft * job.total_sqft )
      # PROTECTANT references job.total_sqft, so a PROTECTANT add-on created
      # BEFORE any room (total_sqft == 0) prices to 0 — a boundary the quote
      # does not retroactively fix.
    input_set: "The job's ServiceCatalog rates and the job's current total_sqft"
    constants: {}
    precision: "integer cents; round_half_up"

  - name: invoice_wallet_application
    trigger: "Invoice issuance (CleaningJob billing UNBILLED -> INVOICED)"
    algorithm: waterfall_allocation
    formula: |
      # Apply the customer's wallet credit against the invoice face amount,
      # capped so neither the wallet nor the net payable goes negative.
      wallet_applied_cents = min(customer.wallet_credit_cents, amount_due_cents)
      net_payable_cents    = amount_due_cents - wallet_applied_cents
      # Conserved-quantity invariant (see compensating_invariant rule): the
      # WalletLedgerEntry written here debits exactly wallet_applied_cents, so
      # customer.wallet_credit_cents (= sum of all delta_cents) drops by exactly
      # that amount and never below 0.
    input_set: "customer.wallet_credit_cents and invoice.amount_due_cents at issuance"
    constants: {}
    precision: "integer cents (exact)"

  - name: wallet_credit_balance
    trigger: "Any WalletLedgerEntry write (guarantee grant, invoice apply, invoice void refund)"
    algorithm: aggregation
    formula: |
      wallet_credit_cents = sum(delta_cents for all WalletLedgerEntry of this customer)
      # Invariant pinned: this sum is ALWAYS >= 0. INVOICE_APPLIED debits are
      # capped by invoice_wallet_application at <= current balance, so the sum
      # cannot be driven negative.
    input_set: "All WalletLedgerEntry rows for the customer, no status filter (append-only ledger)"
    constants: {}
    precision: "integer cents (exact)"

  - name: guarantee_window_eligibility
    trigger: "GuaranteeClaim FILED -> GRANTED (POST /guarantee-claims/{id}/grant)"
    algorithm: threshold
    formula: |
      # The re-clean guarantee window is derived from the origin job's service
      # dry-time, doubled, expressed in minutes. The origin completion minute is
      # job.completed_at_minute (set at completion). Eligibility:
      #   window_minutes = origin_catalog.dry_time_minutes * GUARANTEE_WINDOW_FACTOR
      #   eligible iff (claim.filed_at_minute - origin.completed_at_minute) <= window_minutes
      # GRANTED also grants a flat goodwill wallet credit of GUARANTEE_GOODWILL_CENTS.
      # Boundary is inclusive: filed exactly AT window_minutes after completion is eligible.
    input_set: "origin CleaningJob.completed_at_minute and its ServiceCatalog.dry_time_minutes; claim.filed_at_minute"
    constants:
      GUARANTEE_WINDOW_FACTOR: 2
      GUARANTEE_GOODWILL_CENTS: 2000
    precision: "integer minutes (exact); inclusive boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (jobId, then nested addonId/roomId; claimId; invoiceId)"
    error_id: "ERR_JOB_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_ADDON_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_CATALOG_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body resource ids"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers within stated bounds (area_sqft>=1, amount_cents>=1, end_minute>start_minute)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: state
    check: "Acting Customer (X-User-ID) owns the CleaningJob / RecurringPlan being mutated"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-role mutations on jobs, rooms, add-ons, plans"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: "ERR_JOB_NOT_DRAFT / ERR_JOB_NOT_QUOTED / ERR_JOB_NOT_BOOKED / ERR_JOB_NOT_IN_PROGRESS / ERR_JOB_NOT_COMPLETED / ERR_CLAIM_NOT_FILED / ERR_INVOICE_NOT_OPEN / ERR_SLOT_NOT_RESERVED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "Cannot quote a job with zero rooms"
    error_id: ERR_NO_ROOMS
    http_status: 409
    applies_to: "POST /cleaning-jobs/{id}/quote"

  - priority: 8
    category: business_referential
    check: "Booked crew's supported_service_type equals the job's catalog service_type"
    error_id: ERR_SERVICE_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /cleaning-jobs/{id}/book, POST /cleaning-jobs/{id}/reschedule"

  - priority: 9
    category: state
    check: "Booked crew.status == AVAILABLE"
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /cleaning-jobs/{id}/book, POST /cleaning-jobs/{id}/reschedule"

  - priority: 10
    category: business_temporal
    check: "Requested [start_minute, end_minute) must not overlap any RESERVED slot on the crew once each existing slot is expanded by turnaround_buffer_minutes at its tail; adjacency exactly at the buffer boundary is allowed"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /cleaning-jobs/{id}/book, POST /cleaning-jobs/{id}/reschedule"

  - priority: 11
    category: business_safety
    check: "Guarantee re-clean filed within the dry-time-derived guarantee window: filed_at_minute - origin completion minute <= GUARANTEE_WINDOW_MINUTES"
    error_id: ERR_GUARANTEE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /guarantee-claims/{id}/grant"

  - priority: 12
    category: business_constraint
    check: "At most one AddOn per addon_type per job"
    error_id: ERR_DUPLICATE_ADDON
    http_status: 409
    applies_to: "POST /cleaning-jobs/{id}/add-ons"

  - priority: 13
    category: business_fiscal
    check: "A Payment may not exceed the invoice's remaining net balance: amount_cents <= net_payable_cents - amount_paid_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 402
    applies_to: "POST /invoices/{id}/payments"

  - priority: 14
    category: business_fiscal
    check: "An invoice with at least one APPLIED payment cannot be voided"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /invoices/{id}/void"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_crew_version / expected_invoice_version must match the live parent version"
    error_id: "ERR_STALE_CREW_VERSION / ERR_STALE_INVOICE_VERSION"
    http_status: 412
    applies_to: "POST /cleaning-jobs/{id}/book, POST /invoices/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [Customer, ServiceManager]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["status=ACTIVE, wallet_credit_cents=0"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (wallet_credit_cents reflects ledger sum)"
    roles: [Customer, ServiceManager, Billing, Dispatcher]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer account"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> SUSPENDED"]

  - method: GET
    path: "/customers/{id}/wallet-ledger"
    description: "List WalletLedgerEntry rows for a customer (reverse-reachability for WalletLedgerEntry.customer_id)"
    roles: [Customer, ServiceManager, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "WalletLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}/recurring-plans"
    description: "List RecurringPlans for a customer (reverse-reachability for RecurringPlan.customer_id)"
    roles: [Customer, ServiceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecurringPlan[]"
    side_effects: []

  # ---- ServiceCatalog ----
  - method: POST
    path: "/service-catalogs"
    description: "Create a service catalog entry pinning rates for a service type"
    roles: [ServiceManager]
    code: 201
    input: [service_type, base_rate_cents_per_sqft, stain_addon_cents, pet_addon_cents, protectant_cents_per_sqft, move_furniture_flat_cents, dry_time_minutes]
    output: ServiceCatalog
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/service-catalogs/{id}"
    description: "Get a service catalog entry"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: []
    output: ServiceCatalog
    side_effects: []

  - method: GET
    path: "/service-catalogs"
    description: "List service catalogs"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: ["service_type?", "limit?", "offset?"]
    output: "ServiceCatalog[]"
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create a truck-mount crew"
    roles: [Dispatcher]
    code: 201
    input: [crew_name, supported_service_type, turnaround_buffer_minutes]
    output: Crew
    side_effects: ["status=AVAILABLE, version=1"]

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew (version exposed for OCC)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: POST
    path: "/crews/{id}/out-of-service"
    description: "Mark a crew out of service"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Crew
    side_effects: ["status -> OUT_OF_SERVICE, version += 1"]

  - method: GET
    path: "/crews/{id}/scheduled-slots"
    description: "List slots on a crew (reverse-reachability for ScheduledSlot.crew_id)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ScheduledSlot[]"
    side_effects: []

  # ---- RecurringPlan ----
  - method: POST
    path: "/recurring-plans"
    description: "Create a recurring plan for a customer"
    roles: [Customer, ServiceManager]
    code: 201
    input: [customer_id, cadence]
    output: RecurringPlan
    side_effects: ["status=ACTIVE, completed_visit_count=0"]

  - method: GET
    path: "/recurring-plans/{id}"
    description: "Get a recurring plan (completed_visit_count reflects completed jobs)"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []

  - method: POST
    path: "/recurring-plans/{id}/pause"
    description: "Pause a recurring plan"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["status -> PAUSED"]

  # ---- CleaningJob ----
  - method: POST
    path: "/cleaning-jobs"
    description: "Create a draft cleaning job"
    roles: [Customer, ServiceManager]
    code: 201
    input: [customer_id, service_catalog_id, "recurring_plan_id?", "move_furniture?"]
    output: CleaningJob
    side_effects: ["lifecycle_status=DRAFT, billing_status=UNBILLED, total_sqft=0"]

  - method: GET
    path: "/cleaning-jobs/{id}"
    description: "Get a cleaning job (both status axes, quoted/settled prices)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: []
    output: CleaningJob
    side_effects: []

  - method: GET
    path: "/cleaning-jobs"
    description: "List cleaning jobs, filterable by FK (reverse-reachability for CleaningJob.customer_id, .service_catalog_id, .recurring_plan_id, .origin_job_id, .scheduled_slot_id, .invoice_id)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: ["customer_id?", "service_catalog_id?", "recurring_plan_id?", "origin_job_id?", "scheduled_slot_id?", "invoice_id?", "lifecycle_status?", "limit?", "offset?"]
    output: "CleaningJob[]"
    side_effects: []

  - method: POST
    path: "/cleaning-jobs/{id}/rooms"
    description: "Add a room/area assessment to a draft job"
    roles: [Customer, ServiceManager]
    code: 201
    input: [area_label, area_sqft, soiling_level]
    output: RoomAssessment
    side_effects: ["job.total_sqft recomputed = sum of room area_sqft (only while job is DRAFT)"]

  - method: GET
    path: "/cleaning-jobs/{id}/rooms"
    description: "List room assessments for a job (reverse-reachability for RoomAssessment.cleaning_job_id)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoomAssessment[]"
    side_effects: []

  - method: POST
    path: "/cleaning-jobs/{id}/add-ons"
    description: "Add a stain/pet/protectant add-on to a draft job"
    roles: [Customer, ServiceManager]
    code: 201
    input: [addon_type]
    output: AddOn
    side_effects: ["line_price_cents computed via addon_line_price from job catalog and total_sqft (only while job is DRAFT)"]

  - method: GET
    path: "/cleaning-jobs/{id}/add-ons"
    description: "List add-ons for a job (reverse-reachability for AddOn.cleaning_job_id)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "AddOn[]"
    side_effects: []

  - method: GET
    path: "/cleaning-jobs/{id}/scheduled-slots"
    description: "List slots booked for a job (reverse-reachability for ScheduledSlot.cleaning_job_id)"
    roles: [Customer, ServiceManager, Dispatcher, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScheduledSlot[]"
    side_effects: []

  - method: GET
    path: "/cleaning-jobs/{id}/wallet-ledger"
    description: "List wallet ledger entries produced by a job (reverse-reachability for WalletLedgerEntry.cleaning_job_id)"
    roles: [Customer, ServiceManager, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "WalletLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/cleaning-jobs/{id}/quote"
    description: "Quote a draft job (freeze quoted_price_cents)"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["total_sqft frozen, quoted_price_cents computed and frozen, lifecycle_status -> QUOTED"]

  - method: POST
    path: "/cleaning-jobs/{id}/book"
    description: "Book a quoted job onto a crew slot (OCC on crew)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: [crew_id, start_minute, end_minute, expected_crew_version]
    output: CleaningJob
    side_effects: ["create RESERVED ScheduledSlot, set scheduled_slot_id, lifecycle_status -> BOOKED, Crew.version += 1"]

  - method: POST
    path: "/cleaning-jobs/{id}/reschedule"
    description: "Release the current slot and reserve a new one (OCC on the NEW crew)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: [crew_id, start_minute, end_minute, expected_crew_version]
    output: CleaningJob
    side_effects: ["old slot RESERVED -> RELEASED, new RESERVED ScheduledSlot created, scheduled_slot_id repointed, new Crew.version += 1"]

  - method: POST
    path: "/cleaning-jobs/{id}/start"
    description: "Start a booked job"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["lifecycle_status -> IN_PROGRESS"]

  - method: POST
    path: "/cleaning-jobs/{id}/complete"
    description: "Complete an in-progress job (supply logical completion clock)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: [completed_at_minute]
    output: CleaningJob
    side_effects: ["lifecycle_status -> COMPLETED, completed_at_minute set, slot RELEASED, recurring plan completed_visit_count += 1 if applicable"]

  - method: POST
    path: "/cleaning-jobs/{id}/cancel"
    description: "Cancel a job (DRAFT/QUOTED/BOOKED)"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: CleaningJob
    side_effects: ["lifecycle_status -> CANCELLED, any RESERVED slot RELEASED and scheduled_slot_id cleared"]

  # ---- Invoice / Payment (per-job billing) ----
  - method: POST
    path: "/cleaning-jobs/{id}/invoice"
    description: "Issue the per-job invoice (compute settled price, apply wallet)"
    roles: [Billing, ServiceManager]
    code: 201
    input: []
    output: Invoice
    side_effects: ["settled_price_cents computed, Invoice created, wallet applied (WalletLedgerEntry INVOICE_APPLIED), job.billing_status -> INVOICED, job.invoice_id set"]

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Customer, ServiceManager, Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/cleaning-jobs/{id}/invoices"
    description: "List invoices for a job (reverse-reachability for Invoice.cleaning_job_id)"
    roles: [Customer, ServiceManager, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record a payment against an invoice (OCC on invoice)"
    roles: [Billing, ServiceManager]
    code: 201
    input: [amount_cents, method, expected_invoice_version]
    output: Payment
    side_effects: ["Payment APPLIED, invoice.amount_paid_cents recomputed, Invoice.version += 1, if cumulative APPLIED >= net_payable_cents then Invoice -> SETTLED and job.billing_status -> PAID"]

  - method: GET
    path: "/invoices/{id}/payments"
    description: "List payments for an invoice (reverse-reachability for Payment.invoice_id)"
    roles: [Customer, ServiceManager, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an unpaid invoice (refund applied wallet)"
    roles: [Billing, ServiceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice -> VOID, wallet refund WalletLedgerEntry INVOICE_REFUND if any was applied, job.billing_status -> UNBILLED, job.invoice_id cleared, Invoice.version += 1"]

  # ---- GuaranteeClaim (re-clean guarantee) ----
  - method: POST
    path: "/guarantee-claims"
    description: "File a re-clean guarantee claim against a completed job"
    roles: [Customer, ServiceManager]
    code: 201
    input: [cleaning_job_id, reason, filed_at_minute]
    output: GuaranteeClaim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/guarantee-claims/{id}"
    description: "Get a guarantee claim"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []

  - method: GET
    path: "/cleaning-jobs/{id}/guarantee-claims"
    description: "List guarantee claims for a job (reverse-reachability for GuaranteeClaim.cleaning_job_id)"
    roles: [Customer, ServiceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: GET
    path: "/guarantee-claims"
    description: "List guarantee claims, filterable by FK (reverse-reachability for GuaranteeClaim.cleaning_job_id and .reclean_job_id)"
    roles: [Customer, ServiceManager]
    code: 200
    input: ["cleaning_job_id?", "reclean_job_id?", "status?", "limit?", "offset?"]
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: POST
    path: "/guarantee-claims/{id}/grant"
    description: "Grant a claim: create a re-clean draft job, copy rooms, grant goodwill wallet credit"
    roles: [ServiceManager]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status -> GRANTED, re-clean CleaningJob created (origin_job_id set), rooms copied, WalletLedgerEntry GUARANTEE_CREDIT written, reclean_job_id set"]

  - method: POST
    path: "/guarantee-claims/{id}/deny"
    description: "Deny a claim (no re-clean, no credit)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status -> DENIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Customer is not the owner of the job/plan being mutated" }

  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_CATALOG_NOT_FOUND, http: 404, condition: "ServiceCatalog id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Crew id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "RecurringPlan id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "CleaningJob id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "RoomAssessment id does not exist" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "AddOn id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "GuaranteeClaim id does not exist" }

  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, or out-of-bounds integer (area_sqft<1, amount_cents<1, end_minute<=start_minute, negative rates)" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Customer email already used by another customer" }
  - { id: ERR_SERVICE_TYPE_TAKEN, http: 409, condition: "A ServiceCatalog already exists for this service_type" }

  # --- state ---
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Operation requires Customer.status == ACTIVE" }
  - { id: ERR_JOB_NOT_DRAFT, http: 409, condition: "Operation requires job lifecycle_status == DRAFT (add rooms/add-ons)" }
  - { id: ERR_JOB_NOT_QUOTED, http: 409, condition: "Operation requires job lifecycle_status == QUOTED (book)" }
  - { id: ERR_JOB_NOT_BOOKED, http: 409, condition: "Operation requires job lifecycle_status == BOOKED (start, reschedule)" }
  - { id: ERR_JOB_NOT_IN_PROGRESS, http: 409, condition: "Operation requires job lifecycle_status == IN_PROGRESS (complete)" }
  - { id: ERR_JOB_NOT_COMPLETED, http: 409, condition: "Operation requires job lifecycle_status == COMPLETED (invoice, guarantee grant)" }
  - { id: ERR_JOB_ALREADY_BILLED, http: 409, condition: "Job is already INVOICED/PAID, or cancel attempted after billing started" }
  - { id: ERR_SLOT_NOT_RESERVED, http: 409, condition: "Job's scheduled slot is not RESERVED when starting" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "Grant/deny requires claim.status == FILED" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Void/payment requires invoice.status == OPEN" }

  # --- business referential / safety / temporal ---
  - { id: ERR_NO_ROOMS, http: 409, condition: "Quoting a job with zero RoomAssessment rows" }
  - { id: ERR_SERVICE_TYPE_MISMATCH, http: 409, condition: "Crew supported_service_type != job catalog service_type" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Crew.status != AVAILABLE at booking" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Requested interval collides with a RESERVED slot once expanded by turnaround_buffer_minutes" }
  - { id: ERR_GUARANTEE_WINDOW_EXPIRED, http: 409, condition: "Claim filed after the dry-time-derived guarantee window closed" }
  - { id: ERR_DUPLICATE_ADDON, http: 409, condition: "An AddOn of this addon_type already exists on the job" }

  # --- fiscal ---
  - { id: ERR_OVERPAYMENT, http: 402, condition: "Payment exceeds invoice net remaining balance" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Voiding an invoice that has at least one APPLIED payment" }

  # --- concurrency (OCC) ---
  - { id: ERR_STALE_CREW_VERSION, http: 412, condition: "expected_crew_version != live Crew.version at booking/reschedule" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version != live Invoice.version at payment" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer; owns their own jobs, rooms, add-ons, recurring plans, and files guarantee claims"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /customers — self-register (also ServiceManager)"
      - "POST /cleaning-jobs — create own job"
      - "POST /cleaning-jobs/{id}/rooms — add room to own draft job"
      - "POST /cleaning-jobs/{id}/add-ons — add add-on to own draft job"
      - "POST /cleaning-jobs/{id}/quote — quote own job"
      - "POST /cleaning-jobs/{id}/cancel — cancel own job"
      - "POST /recurring-plans — create own plan"
      - "POST /recurring-plans/{id}/pause — pause own plan"
      - "POST /guarantee-claims — file claim on own job"
      - "GET endpoints on own/visible resources"

  - name: Dispatcher
    description: "Schedules truck-mount crews and drives the booking/job execution lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /crews — create crew"
      - "POST /crews/{id}/out-of-service — retire crew"
      - "POST /cleaning-jobs/{id}/start — start job"
      - "POST /cleaning-jobs/{id}/complete — complete job"
    shared_operations:
      - "POST /cleaning-jobs/{id}/book — book onto crew (also ServiceManager)"
      - "POST /cleaning-jobs/{id}/reschedule — reschedule (also ServiceManager)"
      - "GET scheduling/job/crew reads"

  - name: ServiceManager
    description: "Operations manager; owns catalog and guarantee adjudication, and may act across the workflow"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-catalogs — create catalog"
      - "POST /customers/{id}/suspend — suspend customer"
      - "POST /guarantee-claims/{id}/grant — grant re-clean"
      - "POST /guarantee-claims/{id}/deny — deny re-clean"
    shared_operations:
      - "Superset operator: may perform Customer, Dispatcher, and Billing mutations on any resource"

  - name: Billing
    description: "Handles per-job invoicing and payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{id}/void — void invoice"
    shared_operations:
      - "POST /cleaning-jobs/{id}/invoice — issue invoice (also ServiceManager)"
      - "POST /invoices/{id}/payments — record payment (also ServiceManager)"
      - "GET invoice/payment reads"
