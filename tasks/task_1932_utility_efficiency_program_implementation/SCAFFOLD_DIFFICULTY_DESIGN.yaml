              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins2_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 800, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead2_id: $.data.id, lead2_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead2_id}/distribute"
              payload: { expected_lead_version: "${lead2_v0}" }
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/inspections/${ins2_id}/record"
              payload: { outcome: "FAIL", score_bps: 1000, failure_reasons: ["STILL_BAD"] }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "Project ${proj_id}.status == REMEDIATION (link 1)"
            - "Contractor.qa_score_bps recomputed from rolling window of [1000, 1000] = 1000"
            - "If qa_score_bps (1000) < QA_SUSPENSION_THRESHOLD_BPS: Contractor.status == SUSPENDED (link 2)"
            - "Lead ${lead2_id}.status == EXPIRED due to contractor suspension cascade (link 3)"
            - "Lead ${lead2_id}.assigned_contractor_id == null"

      - name: certification_revoke_cascades_to_suspension
        grounds:
          - state_machines.Certification.ACTIVE_to_REVOKED
          - state_machines.Contractor.APPROVED_to_SUSPENDED
          - state_machines.Lead.OFFERED_to_EXPIRED
        distinguishing_aspect: |
          Depth-2 cascade triggered by Certification revoke: Certification -> REVOKED
          decrements Contractor.active_certification_count (link 1) -> when count reaches
          0, Contractor auto-suspends (link 2) -> OFFERED leads cascade to EXPIRED (link 3,
          so depth 3 in effect). Different originating trigger from the inspection-fail
          cascade (manual revoke vs inspection record).
        test_recipe:
          setup:
            - "Contractor APPROVED with exactly one ACTIVE HVAC certification"
            - "One lead OFFERED to contractor"
          setup_api_calls:
            - call: "POST /efficiency/programs"
              payload: { code: "P-REV", name: "Revoke", sector: "RESIDENTIAL", budget_cents: 100000, avoided_kwh_target: 1000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
