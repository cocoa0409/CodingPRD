      - name: sod_preparer_cannot_approve_transfer
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_SOD_APPROVER_IS_PREPARER]", "state_machines.MissionTransfer"]
        distinguishing_aspect: "Transfer SoD: the StoreManager presenting the preparer's user id is rejected; a different manager approves, then the FinanceClerk disburses — full DRAFT -> APPROVED -> DISBURSED happy path verified after the SoD denial."
        test_recipe:
          setup: ["cycle closed (net 0); DRAFT transfer prepared by fin-1 (50/50 split)"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { cv: $.data.version }
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${cv}", allocations: [ { program: "JOB_TRAINING", pct: 50.000 }, { program: "GENERAL_FUND", pct: 50.000 } ] }
              as: FinanceClerk
              as_user_id: "fin-1"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/mission-transfers/${t1}/approve"
              as: StoreManager
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/mission-transfers/${t1}/approve"
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /api/mission-transfers/${t1}/disburse"
              as: FinanceClerk
              as_user_id: "fin-1"
          assert:
