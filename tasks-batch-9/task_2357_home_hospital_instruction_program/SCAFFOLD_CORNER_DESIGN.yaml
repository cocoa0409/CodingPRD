      - name: sped_compensatory_balance_uses_floor_weeks_and_grows_while_suspended
        claim_type: constants_applied
        grounds:
          - calculations.sped_compensatory_minutes
          - endpoints[POST /hhi/sped-service-logs/{id}/record-delivery].side_effects
          - state_machines.SpedServiceLog.CONTINUED_to_SUSPENDED_PENDING_IEP
        distinguishing_aspect: |
          weeks_elapsed is floor((clock_date - service_start_date).days / WEEK_DAYS), so 6 days after
          service start the owed balance is still 0 even with zero delivery, at 21 days it is
          60 * 3 - 90 == 90, and a suspension that freezes delivered_cumulative_minutes at 90 lets the
          balance grow to 60 * 4 - 90 == 150 by day 28.
        test_recipe:
          setup:
            - "Case ACTIVE / ACCRUING on 2026-09-07 for an IEP student with iep_service_minutes_weekly 300 (sped floor 180 < adjusted 390, so weekly_entitled_minutes is 390)."
            - "One SpedServiceLog of service_type SPEECH with required_weekly_minutes 60 in CONTINUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
