          rationale: "That instance already asserts Circuit.covered_conductor_miles and hardened_fraction moving 0.0 -> 4.0 / 0.0000 -> 0.3429 on record-completion and back again on WITHDRAW, which is the full computed-field claim for this field plus its compensation."

      - name: psps_event_derived_score_fields
        claim_type: Computed Fields
        excluded_because:
          difficulty_instance: net_benefit_pre_event_vs_post_event_window
          rationale: "Every computed score on PSPSEvent — duration_hours, customer_impact_score, crc_mitigation_credit, adjusted_customer_impact_score, ignition_risk_avoided_score and net_benefit_ratio — is asserted there under both benefit variants with pre-computed literals."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_state_machine_lands_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Circuit
          - state_machines.MitigationProject
          - state_machines.NotificationBatch
          - state_machines.CommunityResourceCenter
          - state_machines.WildfirePlanFiling
        distinguishing_aspect: "Five of the nine machines are entered by a plain POST, and each must land on its own declared initial_state — ENERGIZED, DRAFT, PENDING, STANDBY and DRAFT respectively — with the fork/counter fields that guard later transitions initialised to their zero values."
        test_recipe:
          setup:
            - "The F-CHAIN, its five customers, ALPHA's R5 FORECAST index and a SCOPED event EV-1 so a notification batch can be created."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
          trigger:
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-INIT", circuit_id: "${charlie_id}", program_type: "COVERED_CONDUCTOR", plan_year: 2026, planned_miles: 1.0, unit_cost_per_mile_cents: 1000000 }
              as: GridPlanner
              captures: { mp_init_id: $.data.id }
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "ADVANCE_24H", scheduled_send_at: "2026-08-14T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_init_id: $.data.id }
            - call: "POST /community-resource-centers"
              payload: { resource_center_code: "CRC-INIT", district_code: "D-NORTH", site_capacity: 100 }
              as: CommunityLiaison
              captures: { crc_init_id: $.data.id }
            - call: "POST /plan-filings"
              payload: { filing_code: "WMP-INIT", plan_year: 2026 }
              as: GridPlanner
              captures: { filing_init_id: $.data.id }
          assert:
            - "Circuit.${charlie_id}.energization_state == ENERGIZED (initial_state of the Circuit machine)"
            - "MitigationProject.${mp_init_id}.status == DRAFT with completed_miles == 0.0 and review_round == 0"
            - "NotificationBatch.${batch_init_id}.status == PENDING with dispatched_at null, target_count 0, delivered_count 0, unreachable_count 0"
            - "CommunityResourceCenter.${crc_init_id}.status == STANDBY with accessibility_certified false, psps_event_id null, activated_at null, activation_order null, last_served_all_clear_at null"
            - "WildfirePlanFiling.${filing_init_id}.status == DRAFT with safety_review_state PENDING, fiscal_review_state PENDING and deficiency_round_count 0"

      - name: event_scope_exclude_reverts_the_staged_circuit_and_rescores_the_event
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EventScope.transitions[CONFIRMED->EXCLUDED]
          - endpoints.POST_/event-scopes/{id}/exclude
        distinguishing_aspect: "Excluding CHARLIE's scope row fires four side effects in one request: exclusion_justification is stored, ignition_risk_term drops to 0.00, CHARLIE reverts DE_ENERGIZATION_PENDING -> ENERGIZED, and the event's ignition_risk_avoided_score drops by exactly CHARLIE's old term (15.48 -> 11.18) with confirmed_scope_count 3 -> 2 and excluded_scope_count 0 -> 1."
        test_recipe:
          setup:
            - "EV-1 SCOPED over ALPHA/BRAVO/CHARLIE with per-scope terms 6.02 / 5.16 / 4.30 and event score 15.48."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - call: "GET /circuits/${charlie_id}/event-scopes"
              payload: {}
              as: TransmissionEngineer
              captures: { charlie_scope_id: "$.data[0].id" }
          trigger:
            - call: "POST /event-scopes/${charlie_scope_id}/exclude"
              payload: { exclusion_justification: "distribution automation isolates the ignition-prone tap" }
              as: TransmissionEngineer
          assert:
            - "the response status is 200"
            - "EventScope.${charlie_scope_id}.scope_status == EXCLUDED, ignition_risk_term == 0.00 and exclusion_justification is the submitted string"
            - "Circuit.${charlie_id}.energization_state == ENERGIZED"
            - "Circuit.${alpha_id}.energization_state == DE_ENERGIZATION_PENDING and Circuit.${bravo_id}.energization_state == DE_ENERGIZATION_PENDING"
            - "PSPSEvent.${ev1_id}.confirmed_scope_count == 2 and excluded_scope_count == 1"
            - "PSPSEvent.${ev1_id}.ignition_risk_avoided_score == 11.18 (6.02 + 5.16)"
            - "PSPSEvent.${ev1_id}.impacted_customer_count == 4 and scope_status is still SCOPED"

      - name: event_scope_exclude_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.EventScope
          - errors[ERR_SCOPE_ALREADY_EXCLUDED]
        distinguishing_aspect: "EXCLUDED is terminal for EventScope, so a repeated exclude is ERR_SCOPE_ALREADY_EXCLUDED (409) and must not double-subtract the ignition_risk_term from the parent event."
        test_recipe:
          setup:
            - "EV-1 SCOPED and CHARLIE's scope row already EXCLUDED, leaving the event score at 11.18."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - call: "GET /circuits/${charlie_id}/event-scopes"
              payload: {}
              as: TransmissionEngineer
              captures: { charlie_scope_id: "$.data[0].id" }
            - call: "POST /event-scopes/${charlie_scope_id}/exclude"
              payload: { exclusion_justification: "first exclusion" }
              as: TransmissionEngineer
          trigger:
            - call: "POST /event-scopes/${charlie_scope_id}/exclude"
              payload: { exclusion_justification: "second exclusion" }
              as: TransmissionEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_SCOPE_ALREADY_EXCLUDED"
            - "EventScope.${charlie_scope_id}.exclusion_justification is still \"first exclusion\""
            - "PSPSEvent.${ev1_id}.ignition_risk_avoided_score is still 11.18 and excluded_scope_count is still 1"

      - name: notification_batch_dispatch_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.NotificationBatch
          - errors[ERR_BATCH_ALREADY_DISPATCHED]
        distinguishing_aspect: "Both NotificationBatch exit states are terminal, so re-dispatching a FAILED_PARTIAL batch is ERR_BATCH_ALREADY_DISPATCHED (409) and must not append a second set of five NotificationRecords."
        test_recipe:
          setup:
            - "EV-1's ADVANCE_48H batch already dispatched at 2026-08-13T18:00:00Z, landing FAILED_PARTIAL because ACC-A3 is unreachable."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - *k_batch_adv
            - *k_clock_0813
            - *k_disp_adv
          trigger:
            - call: "POST /notification-batches/${batch_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_BATCH_ALREADY_DISPATCHED"
            - "NotificationBatch.${batch_adv_id}.status == FAILED_PARTIAL with target_count 5, delivered_count 4, unreachable_count 1"
            - "GET /notification-records?notification_batch_id=${batch_adv_id} still returns total_count 5"
            - "PSPSEvent.${ev1_id}.notification_status is still ADVANCE_SENT"

      - name: notification_status_advances_to_its_terminal_restoration_sent
        claim_type: Valid Transition
        grounds:
          - state_machines.PSPSEvent.dimension.notification_status
          - calculations.notification_lead_time
        distinguishing_aspect: "The notification dimension walks NOT_STARTED -> ADVANCE_SENT -> IMMINENT_SENT -> ACTIVATION_SENT -> RESTORATION_SENT through four dispatches, and RESTORATION_SENT is terminal — the ACTIVATION and RESTORATION stages carry a 0-minute minimum, so a dispatch at exactly forecast_onset_at (lead 0) is legal where an IMMINENT_1H dispatch there would not be."
        test_recipe:
          setup:
            - "EV-1 SCOPED with ADVANCE_48H and IMMINENT_1H already dispatched, the clock at 2026-08-15T17:00:00Z."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - *k_batch_adv
            - *k_clock_0813
            - *k_disp_adv
            - *k_arm
            - *k_batch_imm
            - *k_clock_0815_17
            - *k_disp_imm
          trigger:
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "ACTIVATION", scheduled_send_at: "2026-08-15T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_act_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T18:00:00Z" }
              as: CommunityLiaison
            - call: "POST /notification-batches/${batch_act_id}/dispatch"
              payload: {}
              as: CommunityLiaison
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "RESTORATION", scheduled_send_at: "2026-08-15T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_rest_id: $.data.id }
            - call: "POST /notification-batches/${batch_rest_id}/dispatch"
              payload: {}
              as: CommunityLiaison
          assert:
            - "after the ADVANCE_48H dispatch PSPSEvent.${ev1_id}.notification_status was ADVANCE_SENT"
            - "after the IMMINENT_1H dispatch it was IMMINENT_SENT"
            - "after the ACTIVATION dispatch it is ACTIVATION_SENT"
            - "after the RESTORATION dispatch it is RESTORATION_SENT"
            - "NotificationBatch.${batch_act_id}.lead_time_minutes == 0 and NotificationBatch.${batch_rest_id}.lead_time_minutes == 0"
            - "both batches land FAILED_PARTIAL (ACC-A3 stays unreachable) yet the notification_status map still advances"
            - "GET /psps-events/${ev1_id}/notification-batches returns total_count 4"

      - name: closed_event_rejects_every_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PSPSEvent.terminal_states
          - errors[ERR_EVENT_TERMINAL]
