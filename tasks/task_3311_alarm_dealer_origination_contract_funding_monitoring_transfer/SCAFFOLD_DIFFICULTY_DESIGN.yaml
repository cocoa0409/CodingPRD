            - call: "POST /alarm-funding/dealer-packages/${p7_id}/contracts"
              payload: { customer_id: "${c10_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "80 Ash St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75005", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-2" }
