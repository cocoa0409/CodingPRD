# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2434_equestrian_show_management_point_recording
# Nine rule_id blocks x 2 instances = 18 instances.
# Every numeric assert below was computed by executing the §1.3 formula.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: class_duration_projected_all_entered_vs_confirmed_only
        grounds:
          - calculations.class_duration_estimate
          - calculations.class_duration_estimate.variants.projected_all_entered
          - calculations.class_duration_estimate.variants.confirmed_only
          - entities.ShowClass.fields.estimated_minutes
          - entities.ShowClass.fields.confirmed_entry_count
          - entities.RingSlot.fields.duration_minutes
          - state_machines.ClassEntry.ENTERED_to_CONFIRMED
        distinguishing_aspect: |
          The scheduling domain's duration estimate is computed twice over identical
          stored rows with two different ClassEntry status filters — projected_all_entered
          admits {ENTERED, CONFIRMED} while confirmed_only admits {CONFIRMED} — and the
          two variants return 29 and 25 minutes for the same four class entries, a
          4-minute drift the projection endpoint reports explicitly.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default."
            - "One APPROVED show (prize pool 750000 cents, stall capacity 40, stall fee 7500, entry close 2026-09-01T00:00:00Z)."
            - "Ring A with turnover_buffer_minutes 10 and footing_condition_score 100."
            - "One JUMPER division with jumpoff_enabled true and division_share_bp 3333."
            - "Class 101 at jump_height_cm 120, entry_fee_cents 25000, class_share_bp 1669, OPEN."
            - "One rider with four horses, four Entry rows (requested_stall_count 0) and four ClassEntry rows on class 101."
            - "Exactly two of those Entry rows are both ACCEPTED and PAID, so exactly two ClassEntry rows are CONFIRMED and two remain ENTERED."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/rings"
              payload: { name: "Ring A", surface_type: "SAND_FIBER", footing_condition_score: 100, turnover_buffer_minutes: 10, warmup_capacity_horses: 12 }
              as: ShowSecretary
              captures: { ring_a_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
              as: FederationOfficer
            - call: "POST /classes/${class_id}/open"
              payload: {}
              as: ShowSecretary
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2001", name: "Comet", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2002", name: "Dahlia", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse2_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2003", name: "Ember", owner_name: "Ada Rider", coggins_drawn_on: "2026-03-01T00:00:00Z" }
              as: FederationOfficer
