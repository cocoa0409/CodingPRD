        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.CctvInspection
        distinguishing_aspect: |
          Pair: state (p4, ERR_INVALID_STATE) vs business_safety (p5,
          ERR_SOD_VIOLATION). A certify call on an inspection that is still in
          CODING by a QaReviewer who IS the coder violates only p5? No — the
          inspection is not in QA_REVIEW (p4 fails) AND actor==coder (p5
          would fail if state passed). p4 wins: ERR_INVALID_STATE must be
          returned, proving state precedes safety.
