# =============================================================================
# PRD Benchmark Scaffold — SCAFFOLD.yaml
# Task: task_3073_merchant_acquiring_program_closed_loop_network_economics
# Domain: American-Express-style closed-loop card network (issuer == acquirer ==
#         network). Merchant acceptance, discount-rate setting, card-member spend
#         insight offers, chargeback handling, settlement timing + reserves,
#         premium-card value funding, acceptance complaint resolution.
#
# Contains §1.0–§1.7 only. §1.8 (difficulty design) and §1.9 (corner design)
# live in their sibling files — they MUST NOT appear here.
# =============================================================================

scenario: |
  Merchant Acquiring Program & Closed-Loop Network Economics (American Express): merchant acceptance through a direct closed-loop relationship or a simplified program administered by third-party acquirers, discount rate setting by merchant industry and volume with negotiated large-merchant pricing, merchant coverage expansion targeting acceptance gaps identified by declined card attempts, card member spend data used for merchant offers with privacy constraints, dispute and chargeback handling where the network is both issuer and acquirer, merchant funding timing and reserve requirements for high-risk categories, premium card fee-based value proposition funding rewards and lounge access, merchant suppression and acceptance complaint resolution

domain_name: merchant-acquiring-closed-loop-network
api_prefix: /network

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Configuration (created first, referenced by almost everything) --------
  - name: IndustryCategory
    parent: null
    common_fields: true
    fields:
      - name: industry_code
        type: string
        source: input
        description: "Unique industry classification code (e.g. MCC-5812)"
        constraints: "unique across IndustryCategory; immutable after create"
      - name: industry_name
        type: string
        source: input
        description: "Human-readable industry label"
      - name: risk_tier
        type: enum
        source: input
        description: "LOW | MEDIUM | HIGH — drives settlement timing and reserve policy"
        constraints: "enum {LOW, MEDIUM, HIGH}"
      - name: base_discount_rate_bps
        type: integer
        source: input
        description: "Baseline merchant discount rate in basis points before volume turning"
        constraints: ">= 0"
      - name: high_risk_flag
        type: boolean
        source: input
        description: "true when the category is statutorily high-risk for chargebacks"
        default: false

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: industry_category_id
        type: string
        source: input
        description: "FK -> IndustryCategory.id; merchant's primary industry"
      - name: merchant_name
        type: string
        source: input
        description: "Legal merchant name"
        constraints: "unique across Merchant"
      - name: region_code
        type: string
        source: input
        description: "Coarse acceptance region the outlet trades in (used to match acceptance gaps)"
      - name: acquisition_channel
        type: enum
        source: input
        description: "DIRECT | THIRD_PARTY — DIRECT is the closed-loop relationship, THIRD_PARTY is the simplified program administered by a third-party acquirer"
        constraints: "enum {DIRECT, THIRD_PARTY}"
      - name: channel_partner
        type: string
        source: input
        description: "Third-party acquirer name; non-null only when acquisition_channel == THIRD_PARTY"
        default: null
      - name: volume_tier
        type: enum
        source: computed
        description: "ACTIVITY | FIXED | LOW; ACTIVITY while billed_volume_mtd_cents < VOLUME_THRESHOLD_CENTS, FIXED once it reaches the threshold, LOW when the negotiated_rate_bps is below the industry base"
        constraints: "enum {ACTIVITY, FIXED, LOW}"
      - name: acceptance_status
        type: enum
        source: system
        description: "PROSPECT → ACCEPTED → ACTIVE → DORMANT / SUPPRESSED"
        constraints: "enum {PROSPECT, ACCEPTED, ACTIVE, DORMANT, SUPPRESSED}"
      - name: applied_discount_rate_bps
        type: integer
        source: computed
        description: "Effective merchant discount rate in basis points; recomputed on every metric change"
        default: 0
      - name: billed_volume_mtd_cents
        type: integer
        source: computed
        description: "Month-to-date billed volume; sum of post_refund_volume_cents of POSTED Settlements for this merchant in the current month"
        default: 0
      - name: rolling_90d_billed_volume_cents
        type: integer
        source: computed
        description: "Trailing 90-day billed network volume, PROVISIONAL variant — includes CAPTURED, IN_FUNDING and SETTLED settlements; used for merchant-facing coverage projections"
        default: 0
      - name: rolling_90d_settled_volume_cents
        type: integer
        source: computed
        description: "Trailing 90-day billed network volume, FINAL variant — SETTLED settlements only; drives the high-risk reserve floor"
        default: 0
      - name: last_batch_discount_fee_cents
        type: integer
        source: computed
        description: "Discount fee for the most recently finalized funding batch; computed sum-then-round over the whole batch, so it diverges from the sum of per-settlement rounded discounts"
        default: 0
      - name: negotiated_rate_bps
        type: integer
        source: input
        description: "Negotiated large-merchant discount rate in basis points; non-null only for LOW-tier merchants whose negotiated rate sits below the industry base"
        default: null
      - name: reserve_required_cents
        type: integer
        source: computed
        description: "Required security reserve; high-risk categories hold at least a floor percentage of rolling volume"
        default: 0
      - name: reserve_held_cents
        type: integer
        source: computed
        description: "Reserve actually withheld to date; ratchets up as each funding batch sweeps the shortfall and never decreases except on settlement reversal"
        default: 0
      - name: status_version
        type: integer
        source: system
        description: "Acceptance-status generation counter; incremented by each acceptance-status → ACTIVE transition and by each acceptance_status change"
        default: 0

  # --- Ticketing / coverage expansion ---------------------------------------
  - name: DeclinedAttempt
    parent: null
    common_fields: false
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant at which the card was presented and declined"
      - name: card_product
        type: enum
        source: input
        description: "Card product presented at the terminal"
        constraints: "enum {GREEN, GOLD, PLATINUM, CENTURION}"
      - name: attempted_amount_cents
        type: integer
        source: input
        description: "Amount of the declined transaction"
        constraints: "> 0"
      - name: decline_reason
        type: enum
        source: input
        description: "Reason code returned by the authorization engine"
        constraints: "enum {MERCHANT_NOT_ACCEPTED, INSUFFICIENT_CREDIT, FRAUD_SUSPECT, EXPIRED_CARD}"
      - name: occurred_at
        type: datetime
        source: input
        description: "Instant the decline was recorded (ISO 8601 UTC, three fractional digits)"

  - name: AcceptanceGap
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Geographic coverage region (coarse region code, not a street address)"
      - name: industry_category_id
        type: string
        source: input
        description: "FK -> IndustryCategory.id; industry whose acceptance coverage is being measured"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the measurement window"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the measurement window"
      - name: window_days
        type: integer
        source: input
        description: "Declared rollup period in days"
        constraints: "enum {30, 60, 90} — 30-day windows merge when 1-day-overlapping, 60-day windows merge when edge-adjacent"
      - name: decline_count
        type: integer
        source: computed
        description: "Count of MERCHANT_NOT_ACCEPTED DeclinedAttempts in [window_start, window_end) for this region + industry"
        default: 0
      - name: declined_volume_cents
        type: integer
        source: computed
        description: "Sum of attempted_amount_cents of counted declines"
        default: 0
      - name: qualified_status
        type: enum
        source: computed
        description: "PROSPECTING when decline_count >= ACCEPTANCE_GAP_DECLINE_MIN; BELOW_THRESHOLD when 1..min-1; DORMANT when 0"
        constraints: "enum {PROSPECTING, BELOW_THRESHOLD, DORMANT}"
      - name: sweep_index
        type: integer
        source: computed
        description: "ID of the latest rollup sweep_index_stamp that recalculated this gap; 0 until first sweep"
        default: 0

  - name: SweepIndexStamp
    parent: null
    common_fields: false
    fields:
      - name: sweep_index
        type: integer
        source: input
        description: "Monotone sweep generation number"
        constraints: "unique; supplied explicitly so two sweeps with different indexes are reproducible"
      - name: rolled_at
        type: datetime
        source: input
        description: "Instant this sweep generation was stamped"

  # --- Spend-insight offers --------------------------------------------------
  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant funding the offer"
      - name: audience_segment
        type: enum
        source: input
        description: "Target spend segment"
        constraints: "enum {HIGH_SPEND, MEDIUM_SPEND, LOW_SPEND, ALL_CARDMEMBERS}"
      - name: min_segment_spend_cents
        type: integer
        source: input
        description: "Minimum trailing-lowest-month spend a member must exceed to be in the audience"
        constraints: ">= 0"
      - name: reward_bps
        type: integer
        source: input
        description: "Reward rate in basis points paid to the participating member"
        constraints: ">= 0"
      - name: privacy_state
        type: enum
        source: system
        description: "DRAFT → PRIVACY_REVIEW → MERCHANT_CONSENT → LIVE / TERMINATED; no member-spend data may be shared before MERCHANT_CONSENT"
        constraints: "enum {DRAFT, PRIVACY_REVIEW, MERCHANT_CONSENT, LIVE, TERMINATED}"
      - name: audience_size
        type: integer
        source: computed
        description: "Count of CardMembers whose trailing spend qualifies for the segment at proposal time"
        default: 0
      - name: aggregated_spend_cents
        type: integer
        source: computed
        description: "Sum of qualifying spend across the audience; the ONLY spend figure exposed to the merchant (privacy-constrained rollup)"
        default: 0
      - name: accepted_count
        type: integer
        source: computed
        description: "Number of members who accepted the offer"
        default: 0
      - name: live_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the offer's live window; supplied at consent"
        default: null
      - name: live_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the offer's live window; supplied at consent"
        default: null

  # --- Card member ----------------------------------------------------------
  - name: CardMember
    parent: null
    common_fields: true
    fields:
      - name: member_name
        type: string
        source: input
        description: "Card member name — personal data, never shared with merchants"
      - name: card_product
        type: enum
        source: input
        description: "Card product held"
        constraints: "enum {GREEN, GOLD, PLATINUM, CENTURION}"
      - name: annual_fee_cents
        type: integer
        source: computed
        description: "Annual membership fee set from the card product at registration"
        default: 0
      - name: trailing_lowest_month_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Lowest calendar-month spend over the member's trailing 3 months; updated by POST /cardmembers/{id}/set-monthly-spend"
      - name: reward_points_balance
        type: integer
        source: computed
        description: "Accumulated membership reward points funded by the fee pool"
        default: 0
      - name: lounge_access_tier
        type: enum
        source: computed
        description: "NONE | STANDARD | UNLIMITED — derived from the card product and the member's trailing spend"
        constraints: "enum {NONE, STANDARD, UNLIMITED}"
      - name: member_status
        type: enum
        source: system
        description: "PENDING → ACTIVE → DELINQUENT / CLOSED"
        constraints: "enum {PENDING, ACTIVE, DELINQUENT, CLOSED}"

  - name: OfferAcceptance
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer being accepted"
      - name: cardmember_id
        type: string
        source: input
        description: "FK -> CardMember.id; the member accepting the offer"
      - name: trigger_amount_cents
        type: integer
        source: computed
        description: "Qualifying spend that triggered the payout; pinned at approval from the member's trailing spend at that instant"
        default: 0
      - name: reward_amount_cents
        type: integer
        source: computed
        description: "approved-backing = round_half_up(trigger_amount_cents * offer.reward_bps / 10000); reversed-backing = round_half_up(trigger_amount_cents * offer_provisional_reward_bps / 10000) where offer_provisional_reward_bps = floor(reward_bps / 2)"
        default: 0
      - name: acceptance_status
        type: enum
        source: system
        description: "PENDING → APPROVED → PAID / REVERSED"
        constraints: "enum {PENDING, APPROVED, PAID, REVERSED}"

  # --- Funds pool ------------------------------------------------------------
  - name: OfferRedemptionPool
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer whose redemptions draw on this pool"
      - name: funder
        type: enum
        source: input
        description: "Who funds the reward"
        constraints: "enum {MERCHANT, NETWORK}"
      - name: initial_funded_cents
        type: integer
        source: input
        description: "Opening funded amount"
        constraints: ">= 0"
      - name: balance_cents
        type: integer
        source: input
        description: "Current funded balance; replayed from initial_funded_cents plus top-ups minus approved and paid redemptions"
        constraints: ">= 0"
      - name: topup_total_cents
        type: integer
        source: computed
        description: "Sum of all top-up contributions applied to this pool"
        default: 0
      - name: consumed_total_cents
        type: integer
        source: computed
        description: "Sum of reward_amount_cents of this pool's APPROVED and PAID OfferAcceptances; the load-bearing funded quantity"
        default: 0

  # --- Premium value ---------------------------------------------------------
  - name: AnnualFeeStatement
    parent: null
    common_fields: true
    fields:
      - name: cardmember_id
        type: string
        source: input
        description: "FK -> CardMember.id; the member billed"
      - name: statement_year
        type: integer
        source: input
        description: "Membership year billed"
        constraints: ">= 2026"
      - name: principal_fee_cents
        type: integer
        source: input
        description: "Principal membership fee before per-authorised-user fees"
        constraints: ">= 0"
      - name: authorised_user_count
        type: integer
        source: input
        description: "Number of additional authorised users on the account"
        constraints: ">= 0"
      - name: per_user_fee_cents
        type: integer
        source: input
        description: "Per-authorised-user fee in cents"
        constraints: ">= 0"
      - name: gross_fee_assessed_cents
        type: integer
        source: computed
        description: "principal_fee_cents + authorised_user_count * per_user_fee_cents — assessed on the statement, so a disbursement cannot mint fee funding"
        default: 0
      - name: value_fund_allocation_cents
        type: integer
        source: computed
        description: "Portion of the gross fee routed into the network value fund (rewards + lounge) by the configured allocation split"
        default: 0
      - name: statement_status
        type: enum
        source: system
        description: "DRAFT → ASSESSED → DISBURSED / VOIDED"
        constraints: "enum {DRAFT, ASSESSED, DISBURSED, VOIDED}"

  - name: ValueFundLedgerEntry
    parent: null
    common_fields: true
    fields:
      - name: source_statement_id
        type: string
        source: input
        description: "FK -> AnnualFeeStatement.id; the statement that funded this entry"
      - name: entry_kind
        type: enum
        source: input
        description: "FEE_ALLOCATION when the share comes from an assessed statement; FEE_ALLOCATION_REVERSAL on a voided statement; LOUNGE_PASS_GRANT on a granted pass"
        constraints: "enum {FEE_ALLOCATION, FEE_ALLOCATION_REVERSAL, LOUNGE_PASS_GRANT}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount; positive for FEE_ALLOCATION, negative for FEE_ALLOCATION_REVERSAL, zero for LOUNGE_PASS_GRANT"
        default: 0
      - name: created_seq
        type: integer
        source: system
        description: "Monotone creation counter used as the deterministic replay order tie-break (never id)"
        default: 0

  # --- Settlement / funding --------------------------------------------------
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant being funded"
      - name: settlement_cycle
        type: integer
        source: input
        description: "Cycle identifier, monotone integer assigned by the caller to keep cycles reproducible"
        constraints: "integer >= 1; unique per merchant"
      - name: gross_volume_cents
        type: integer
        source: input
        description: "Gross captured volume in the cycle"
        constraints: ">= 0"
      - name: refund_volume_cents
        type: integer
        source: input
        description: "Refunds applied in the cycle"
        constraints: ">= 0"
      - name: post_refund_volume_cents
        type: integer
        source: computed
        description: "gross_volume_cents - refund_volume_cents"
        default: 0
      - name: discount_fee_cents
        type: integer
        source: computed
        description: "Forward-looking variant: round_half_up(gross_volume_cents * applied_discount_rate_bps / 10000). Chronological variant discounts only net volume."
        default: 0
      - name: net_funding_cents
        type: integer
        source: computed
        description: "PROVISIONAL: post_refund_volume_cents - discount_fee_cents; FINAL: post_refund_volume_cents - final_discount_fee_cents - final_reserve_withholding_cents"
        default: 0
      - name: final_discount_fee_cents
        type: integer
        source: computed
        description: "Sealed at finalization; chronological discount computed at the rate current on finalized_at_batch_seq"
        default: 0
      - name: final_reserve_withholding_cents
        type: integer
        source: computed
        description: "Sealed at finalization; reserve withheld only for HIGH risk_tier categories"
        default: 0
      - name: funding_batch_seq
        type: integer
        source: system
        description: "Funding batch number assigned at creation; the ONLY batch_order value permitted in arithmetic (created_at is forbidden in arithmetic because creation and settlement may straddle a day)"
      - name: finalized_at_batch_seq
        type: integer
        source: computed
        description: "funding_batch_seq of the batch whose finalize call sealed this settlement's final fields"
        default: 0
      - name: settlement_status
        type: enum
        source: system
        description: "CAPTURED → IN_FUNDING → SETTLED / REVERSED"
        constraints: "enum {CAPTURED, IN_FUNDING, SETTLED, REVERSED}"

  # --- Disputes --------------------------------------------------------------
  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: cardmember_id
        type: string
        source: input
        description: "FK -> CardMember.id; member disputing the charge"
      - name: final_merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant charged back at resolution (may equal or differ from original_merchant_id)"
      - name: original_merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant that originally processed the transaction"
      - name: amount_cents
        type: integer
        source: input
        description: "Disputed amount"
        constraints: "> 0"
      - name: dispute_status
        type: enum
        source: system
        description: "OPEN → MERCHANT_RESPONDED / AUTO_ACCEPTED → WON / LOST / WITHDRAWN"
        constraints: "enum {OPEN, MERCHANT_RESPONDED, AUTO_ACCEPTED, WON, LOST, WITHDRAWN}"
      - name: representment_stage
        type: enum
        source: system
        description: "Separate representment axis: NONE → FIRST_ROUND → CLOSED — the network is both issuer and acquirer so a LOST first round may be re-represented"
        constraints: "enum {NONE, FIRST_ROUND, CLOSED}"
      - name: network_settled_cents
        type: integer
        source: computed
        description: "Closed-loop invariant accumulator; MUST return to 0 when a round is opened and closed on the same merchant"
        default: 0
      - name: chargeback_count_reserved
        type: integer
        source: computed
        description: "Chargebacks attributed to original_merchant_id; reseated to final_merchant_id when resolution moves the liability"
        default: 0
      - name: priority
        type: enum
        source: system
        description: "HIGH when amount_cents >= 50000 else STANDARD — set at creation and immutable"
        constraints: "enum {HIGH, STANDARD}"

  # --- Acceptance risk -------------------------------------------------------
  - name: AcceptanceComplaint
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant complained about"
      - name: cardmember_id
        type: string
        source: input
        description: "FK -> CardMember.id; complainant"
      - name: complaint_type
        type: enum
        source: input
        description: "Category of acceptance complaint"
        constraints: "enum {MERCHANT_NOT_ACCEPTED, STAFF_ATTITUDE, TERMINAL_TECHNICAL, PRICING_SURCHARGE}"
      - name: complaint_status
        type: enum
        source: system
        description: "FILED → UNDER_REVIEW → UPHELD / DISMISSED"
        constraints: "enum {FILED, UNDER_REVIEW, UPHELD, DISMISSED}"

  - name: MerchantRiskState
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant whose rolling risk this row tracks (exactly one row per merchant)"
      - name: rolling_chargeback_count
        type: integer
        source: computed
        description: "Rolling chargeback count attributed to this merchant; the count of Disputes whose chargeback_count_reserved == 1 and whose merchant_of_record_id == merchant_id, where merchant_of_record_id == final_merchant_id when dispute_status == WON else original_merchant_id"
        default: 0
      - name: rolling_dispute_amount_cents
        type: integer
        source: computed
        description: "Rolling dispute amount attributed to this merchant"
        default: 0
      - name: unresolved_chargeback_count
        type: integer
        source: computed
        description: "Open + responded disputes attributed to this merchant; drives suppression eligibility"
        default: 0
      - name: suppression_flag
        type: boolean
        source: computed
        description: "true when the merchant has crossed the unresolved-chargeback-count ceiling (UNRESOLVED_CB_CEILING) or the unfavourable chargeback ratio; suppression is the network-side exit of the cyclic acceptance machine"
        default: false

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- M1: Merchant acceptance (CYCLIC — DORMANT → PROSPECT → ACCEPTED → ACTIVE → DORMANT) ---
  - entity: Merchant
    initial_state: PROSPECT
    terminal_states: [SUPPRESSED]
    transitions:
      - from: PROSPECT
        to: ACCEPTED
        trigger: "POST /network/merchants/{merchant_id}/accept"
        actor: NetworkAcquirer
        preconditions:
          - "merchant.acceptance_status == PROSPECT"
          - "merchant.acquisition_channel == DIRECT implies MerchantRiskState.suppression_flag == false"
          - "merchant.acquisition_channel == THIRD_PARTY implies merchant.channel_partner is non-null"
        side_effects:
          - "merchant.acceptance_status → ACCEPTED"
          - "merchant.applied_discount_rate_bps = resolve_discount_rate(volume_tier=merchant.volume_tier, currency='USD')"
          - "merchant.status_version = merchant.status_version + 1 — advances once per acceptance-status activation generation"
          - "merchant.version += 1"
        note: "Every acceptance-status activation (PROSPECT→ACCEPTED here and ACCEPTED→ACTIVE) increments status_version by exactly 1; PROSPECT→ACCEPTED is the transition that first lifts the merchant off status_version 0."

      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /network/merchants/{merchant_id}/activate"
        actor: NetworkAcquirer
        preconditions:
          - "merchant.acceptance_status == ACCEPTED"
          - "MerchantRiskState.suppression_flag == false"
        side_effects:
          - "merchant.acceptance_status → ACTIVE"
          - "merchant.status_version = merchant.status_version + 1 — advances by exactly 1 on every acceptance-status activation (PROSPECT→ACCEPTED and ACCEPTED→ACTIVE)"
          - "merchant.version += 1"

      - from: ACTIVE
        to: DORMANT
        trigger: "POST /network/merchants/{merchant_id}/mark-dormant"
        actor: NetworkAcquirer
        preconditions:
          - "merchant.acceptance_status == ACTIVE"
        side_effects:
          - "merchant.acceptance_status → DORMANT"
          - "merchant.version += 1"

      - from: DORMANT
        to: PROSPECT
        trigger: "system (automatic when a MERCHANT_NOT_ACCEPTED DeclinedAttempt is recorded for this merchant and an open AcceptanceGap window covers its region + industry)"
        actor: system
        preconditions:
          - "merchant.acceptance_status == DORMANT"
          - "an AcceptanceGap row exists for the merchant's region and industry with qualified_status == PROSPECTING"
          - "the latest sweep generation SweepIndexStamp.sweep_index == merchant.status_version"
        side_effects:
          - "merchant.acceptance_status → PROSPECT"
          - "the 'declined card attempts' acceptance-gap engine reports this merchant as newly uncovered"
          - "merchant.version += 1"
        note: "CYCLE CLOSE. If no sweep generation matches the merchant's status_version, the outlet stays DORMANT and the declined attempt only increments the gap counters."

      - from: PROSPECT
        to: SUPPRESSED
        trigger: "POST /network/merchants/{merchant_id}/suppress"
        actor: NetworkCompliance
        preconditions:
          - "merchant.acceptance_status == PROSPECT"
          - "reached via POST /network/merchants/{merchant_id}/suppress (risk-ceiling gated, validation priority 7) or via DELETE /network/merchants/{merchant_id} (operator archive, state precondition only)"
        side_effects:
          - "merchant.acceptance_status → SUPPRESSED (terminal)"
          - "all Offer rows for this merchant with privacy_state in {DRAFT, PRIVACY_REVIEW, MERCHANT_CONSENT, LIVE} → TERMINATED"
          - "merchant.version += 1"

      - from: ACCEPTED
        to: SUPPRESSED
        trigger: "POST /network/merchants/{merchant_id}/suppress"
        actor: NetworkCompliance
        preconditions:
          - "merchant.acceptance_status == ACCEPTED"
          - "reached via POST /network/merchants/{merchant_id}/suppress (risk-ceiling gated, validation priority 7) or via DELETE /network/merchants/{merchant_id} (operator archive, state precondition only)"
        side_effects:
          - "merchant.acceptance_status → SUPPRESSED (terminal)"
          - "all Offer rows for this merchant with privacy_state in {DRAFT, PRIVACY_REVIEW, MERCHANT_CONSENT, LIVE} → TERMINATED"
          - "merchant.version += 1"

      - from: ACTIVE
        to: SUPPRESSED
        trigger: "POST /network/merchants/{merchant_id}/suppress"
        actor: NetworkCompliance
        preconditions:
          - "merchant.acceptance_status == ACTIVE"
          - "reached via POST /network/merchants/{merchant_id}/suppress (risk-ceiling gated, validation priority 7) or via DELETE /network/merchants/{merchant_id} (operator archive, state precondition only)"
        side_effects:
          - "merchant.acceptance_status → SUPPRESSED (terminal)"
          - "all Offer rows for this merchant with privacy_state in {DRAFT, PRIVACY_REVIEW, MERCHANT_CONSENT, LIVE} → TERMINATED"
          - "all CAPTURED and IN_FUNDING Settlements for this merchant → REVERSED"
          - "merchant.version += 1"

  # --- M2: Settlement funding (TEMPORAL — batch-ordering justified) ----------
  - entity: Settlement
    initial_state: CAPTURED
    terminal_states: [REVERSED]
    transitions:
      - from: CAPTURED
        to: IN_FUNDING
        trigger: "POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"
        actor: NetworkSettlementOps
        preconditions:
          - "settlement.settlement_status == CAPTURED"
          - "settlement.funding_batch_seq == batch_seq"
          - "the merchant's acceptance_status == ACTIVE — funding is released only to a live merchant"
        side_effects:
          - "settlement.settlement_status → IN_FUNDING"
          - "settlement.final_discount_fee_cents = round_half_up(settlement.gross_volume_cents * historical_discount_rate(merchant, batch_seq) / 10000)"
          - "settlement.final_reserve_withholding_cents = 0 unless the merchant's IndustryCategory.risk_tier == HIGH, in which case reserve_withholding(merchant)"
          - "settlement.finalized_at_batch_seq = batch_seq"
          - "settlement.net_funding_cents = post_refund_volume_cents - final_discount_fee_cents - final_reserve_withholding_cents"
          - "merchant.rolling_90d_billed_volume_cents += settlement.post_refund_volume_cents"
          - "merchant.reserve_required_cents = reserve_required(merchant)"
          - "settlement.version += 1; merchant.version += 1"

      - from: IN_FUNDING
        to: SETTLED
        trigger: "system (automatic when a later batch's finalize call finds a strictly smaller funding_batch_seq already IN_FUNDING for this merchant)"
        actor: system
        preconditions:
          - "exists a Settlement s2 for the same merchant with s2.funding_batch_seq < this.funding_batch_seq and s2.settlement_status == IN_FUNDING"
        side_effects:
          - "settlement.settlement_status → SETTLED"
          - "merchant.billed_volume_mtd_cents += settlement.post_refund_volume_cents"
          - "merchant.volume_tier = derive_volume_tier(merchant)"
          - "merchant.applied_discount_rate_bps = resolve_discount_rate(volume_tier=merchant.volume_tier, currency='USD')"
          - "settlement.version += 1; merchant.version += 1"
        note: "Ordering is pinned explicitly: finalize iterates settlements ORDER BY funding_batch_seq ASC; a settlement is promoted only by the finalize of a STRICTLY later batch_ordinal, so a merchant's finalize order reproduces its chronological settlement order and no two settlements in the same batch can promote one another."

      - from: CAPTURED
        to: REVERSED
        trigger: "POST /network/merchants/{merchant_id}/suppress while the settlement is CAPTURED"
        actor: NetworkCompliance
        preconditions:
          - "settlement.settlement_status == CAPTURED"
        side_effects:
          - "settlement.settlement_status → REVERSED (terminal)"
          - "settlement.final_discount_fee_cents = 0; settlement.final_reserve_withholding_cents = 0; settlement.net_funding_cents = 0"
          - "settlement.version += 1"

      - from: IN_FUNDING
        to: REVERSED
        trigger: "POST /network/merchants/{merchant_id}/suppress while the settlement is IN_FUNDING"
        actor: NetworkCompliance
        preconditions:
          - "settlement.settlement_status == IN_FUNDING"
        side_effects:
          - "settlement.settlement_status → REVERSED (terminal)"
          - "settlement.final_discount_fee_cents = 0; settlement.final_reserve_withholding_cents = 0; settlement.net_funding_cents = 0"
          - "settlement.version += 1"

      - from: SETTLED
        to: IN_FUNDING
        trigger: "POST /network/settlements/{settlement_id}/posting-reversal"
        actor: NetworkSettlementOps
        preconditions:
          - "settlement.settlement_status == SETTLED"
        side_effects:
          - "settlement.settlement_status → IN_FUNDING"
          - "merchant.billed_volume_mtd_cents -= settlement.post_refund_volume_cents"
          - "merchant.volume_tier = derive_volume_tier(merchant); merchant.applied_discount_rate_bps = resolve_discount_rate(volume_tier=merchant.volume_tier, currency='USD')"
          - "settlement.version += 1; merchant.version += 1"

      - from: REVERSED
        to: CAPTURED
        trigger: "POST /network/settlements/{settlement_id}/reinstate"
        actor: NetworkSettlementOps
        preconditions:
          - "settlement.settlement_status == REVERSED"
        side_effects:
          - "settlement.settlement_status → CAPTURED"
          - "settlement.final_discount_fee_cents = 0; settlement.final_reserve_withholding_cents = 0; settlement.net_funding_cents = 0"
          - "settlement.version += 1"

  # --- M3: Dispute resolution (BRANCHING + state-dependent side effects) -----
  - entity: Dispute
    initial_state: OPEN
    terminal_states: [WON, LOST, WITHDRAWN]
    transitions:
      - from: OPEN
        to: MERCHANT_RESPONDED
        trigger: "POST /network/disputes/{dispute_id}/respond"
        actor: Merchant
        preconditions:
          - "dispute.dispute_status == OPEN"
          - "X-User-ID == dispute.original_merchant_id"
          - "dispute.amount_cents >= 50000"
        side_effects:
          - "dispute.dispute_status → MERCHANT_RESPONDED"
          - "dispute.version += 1"

      - from: OPEN
        to: AUTO_ACCEPTED
        trigger: "system (automatic when the resolution clock reaches the response deadline)"
        actor: system
        preconditions:
          - "dispute.dispute_status == OPEN"
          - "current logical clock >= dispute.occurred_at + RESPONSE_WINDOW_DAYS"
        side_effects:
          - "dispute.dispute_status → AUTO_ACCEPTED"
          - "dispute.version += 1"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /network/disputes/{dispute_id}/withdraw"
        actor: CardMember
        preconditions:
          - "dispute.dispute_status == OPEN"
          - "X-User-ID == dispute.cardmember_id"
        side_effects:
          - "dispute.dispute_status → WITHDRAWN (terminal)"
          - "no liability transfer; no risk accrual"
          - "dispute.version += 1"

      - from: MERCHANT_RESPONDED
        to: WON
        trigger: "POST /network/disputes/{dispute_id}/resolve"
        actor: NetworkDisputeOps
        preconditions:
          - "dispute.dispute_status == MERCHANT_RESPONDED"
          - "the linked provision is adjudicated in the merchant's favour"
        side_effects:
          - "dispute.dispute_status → WON (terminal)"
          - "liability transferred from original_merchant_id to final_merchant_id"
          - "acquirer_liability(original_merchant_id).rolling_chargeback_count -= 1; acquirer_liability(final_merchant_id).rolling_chargeback_count += 1"
          - "MerchantRiskState[original_merchant_id].rolling_chargeback_count -= 1; MerchantRiskState[final_merchant_id].rolling_chargeback_count += 1; both rolling_dispute_amount_cents move by dispute.amount_cents"
          - "MerchantRiskState[original_merchant_id].unresolved_chargeback_count -= 1 (the dispute is no longer open)"
          - "if adjudication moves the charge to a CARDMEMBER apology credit: CardMember.reward_points_balance += floor(dispute.amount_cents / 100)"
          - "dispute.network_settled_cents -= dispute.amount_cents; dispute.version += 1"

      - from: MERCHANT_RESPONDED
        to: LOST
        trigger: "POST /network/disputes/{dispute_id}/resolve"
        actor: NetworkDisputeOps
        preconditions:
          - "dispute.dispute_status == MERCHANT_RESPONDED"
          - "the linked provision is adjudicated against the merchant"
        side_effects:
          - "dispute.dispute_status → LOST (terminal)"
          - "if dispute.representment_stage == NONE: dispute.representment_stage → FIRST_ROUND and the network (as both issuer and acquirer) opens a re-presentment round against the merchant"
          - "if dispute.representment_stage == FIRST_ROUND: dispute.representment_stage → CLOSED"
          - "MerchantRiskState[final_merchant_id].rolling_chargeback_count += 1; MerchantRiskState[final_merchant_id].unresolved_chargeback_count -= 1"
          - "dispute.network_settled_cents -= dispute.amount_cents; dispute.version += 1"

      - from: AUTO_ACCEPTED
        to: LOST
        trigger: "POST /network/disputes/{dispute_id}/resolve"
        actor: NetworkDisputeOps
        preconditions:
          - "dispute.dispute_status == AUTO_ACCEPTED"
        side_effects:
          - "dispute.dispute_status → LOST (terminal)"
          - "if dispute.representment_stage == NONE: dispute.representment_stage → FIRST_ROUND"
          - "MerchantRiskState[final_merchant_id].rolling_chargeback_count += 1; MerchantRiskState[final_merchant_id].unresolved_chargeback_count -= 1"
          - "dispute.network_settled_cents -= dispute.amount_cents; dispute.version += 1"
        note: "The 'reopen round' hop of the LOST cascade: a first-round loss opens a round, a second-round loss closes it."

  # --- M4: Offer privacy (CYCLIC — MERCHANT_CONSENT → PRIVACY_REVIEW) --------
  - entity: Offer
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PRIVACY_REVIEW
        trigger: "POST /network/offers/{offer_id}/submit-review"
        actor: NetworkDataSteward
        preconditions:
          - "offer.privacy_state == DRAFT"
        side_effects:
          - "offer.privacy_state → PRIVACY_REVIEW"
          - "offer.audience_size = audience_size(offer); offer.aggregated_spend_cents = aggregated_spend(offer)"
          - "offer.version += 1"

      - from: PRIVACY_REVIEW
        to: MERCHANT_CONSENT
        trigger: "POST /network/offers/{offer_id}/request-consent"
        actor: NetworkDataSteward
        preconditions:
          - "offer.privacy_state == PRIVACY_REVIEW"
          - "offer.audience_size >= OFFER_AUDIENCE_MIN"
        side_effects:
          - "offer.privacy_state → MERCHANT_CONSENT"
          - "offer.version += 1"

      - from: MERCHANT_CONSENT
        to: LIVE
        trigger: "POST /network/offers/{offer_id}/consent"
        actor: Merchant
        preconditions:
          - "offer.privacy_state == MERCHANT_CONSENT"
          - "X-User-ID == offer.merchant_id"
          - "the funding Merchant's acceptance_status == ACTIVE — a merchant that is not live on the network cannot launch a spend-insight offer"
          - "when expected_offer_version is supplied it equals offer.version (else ERR_STALE_VERSION)"
          - "the requested live window [live_start_utc, live_end_utc) leaves at least one day of clearance from every existing live window funded by the same merchant"
        side_effects:
          - "offer.privacy_state → LIVE"
          - "offer.live_start_utc and offer.live_end_utc recorded from the request"
          - "offer.version += 1"

      - from: PRIVACY_REVIEW
        to: DRAFT
        trigger: "POST /network/offers/{offer_id}/return-to-draft"
        actor: NetworkDataSteward
        preconditions:
          - "offer.privacy_state == PRIVACY_REVIEW"
          - "no member-spend data has been shared with the merchant"
        side_effects:
          - "offer.privacy_state → DRAFT"
          - "offer.audience_size = 0; offer.aggregated_spend_cents = 0"
          - "offer.version += 1"

      - from: LIVE
        to: MERCHANT_CONSENT
        trigger: "POST /network/offers/{offer_id}/suspend"
        actor: NetworkDataSteward
        preconditions:
          - "offer.privacy_state == LIVE"
        side_effects:
          - "offer.privacy_state → MERCHANT_CONSENT"
          - "pending OfferAcceptances remain PENDING but no new acceptance may be recorded"
          - "offer.version += 1"

  # --- M5: Card member status (LINEAR) --------------------------------------
  - entity: CardMember
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /network/cardmembers/{cardmember_id}/activate"
        actor: NetworkIssuer
        preconditions:
          - "cardmember.member_status == PENDING"
        side_effects:
          - "cardmember.member_status → ACTIVE"
          - "cardmember.reward_points_balance += membership_reward_points(cardmember)"
          - "cardmember.lounge_access_tier = lounge_access_tier(cardmember)"
          - "cardmember.version += 1"

      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /network/cardmembers/{cardmember_id}/mark-delinquent"
        actor: NetworkIssuer
        preconditions:
          - "cardmember.member_status == ACTIVE"
        side_effects:
          - "cardmember.member_status → DELINQUENT"
          - "cardmember.lounge_access_tier → NONE while DELINQUENT"
          - "cardmember.version += 1"

      - from: DELINQUENT
        to: CLOSED
        trigger: "POST /network/cardmembers/{cardmember_id}/close"
        actor: NetworkIssuer
        preconditions:
          - "cardmember.member_status == DELINQUENT"
        side_effects:
          - "cardmember.member_status → CLOSED (terminal)"
          - "cardmember.version += 1"

  # --- M6: Acceptance complaint (LINEAR with revert) -------------------------
  - entity: AcceptanceComplaint
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /network/complaints/{complaint_id}/take-up"
        actor: NetworkService
        preconditions:
          - "complaint.complaint_status == FILED"
        side_effects:
          - "complaint.complaint_status → UNDER_REVIEW"
          - "complaint.version += 1"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /network/complaints/{complaint_id}/uphold"
        actor: NetworkService
        preconditions:
          - "complaint.complaint_status == UNDER_REVIEW"
        side_effects:
          - "complaint.complaint_status → UPHELD (terminal)"
          - "the merchant's acceptance record is flagged; the complaint opens an AcceptanceGap row keyed on the merchant's region and IndustryCategory with window_width=30"
          - "complaint.version += 1"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /network/complaints/{complaint_id}/dismiss"
        actor: NetworkService
        preconditions:
          - "complaint.complaint_status == UNDER_REVIEW"
        side_effects:
          - "complaint.complaint_status → DISMISSED (terminal)"
          - "complaint.version += 1"

      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /network/complaints/{complaint_id}/reopen"
        actor: NetworkService
        preconditions:
          - "complaint.complaint_status == UNDER_REVIEW"
        side_effects:
          - "complaint.complaint_status → FILED"
          - "complaint.version += 1"

  # --- M7: Annual fee statement / premium value funding (LINEAR) ------------
  - entity: AnnualFeeStatement
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "POST /network/annual-fee-statements/{statement_id}/assess"
        actor: NetworkIssuer
        preconditions:
          - "statement.statement_status == DRAFT"
        side_effects:
          - "statement.statement_status → ASSESSED"
          - "statement.gross_fee_assessed_cents = principal_fee_cents + authorised_user_count * per_user_fee_cents"
          - "statement.value_fund_allocation_cents = round_half_up(gross_fee_assessed_cents * VALUE_FUND_SHARE_BPS / 10000) (the ASSESSED variant)"
          - "statement.version += 1"

      - from: ASSESSED
        to: DISBURSED
        trigger: "POST /network/annual-fee-statements/{statement_id}/disburse"
        actor: NetworkIssuer
        preconditions:
          - "statement.statement_status == ASSESSED"
        side_effects:
          - "statement.statement_status → DISBURSED"
          - "a ValueFundLedgerEntry of kind FEE_ALLOCATION is written and the value fund increases"
          - "the member's reward_points_balance is funded from the value fund"
          - "statement.version += 1"

      - from: ASSESSED
        to: VOIDED
        trigger: "POST /network/annual-fee-statements/{statement_id}/void"
        actor: NetworkIssuer
        preconditions:
          - "statement.statement_status == ASSESSED"
        side_effects:
          - "statement.statement_status → VOIDED (terminal)"
          - "a ValueFundLedgerEntry of kind FEE_ALLOCATION_REVERSAL of equal magnitude is written and the value fund decreases"
          - "statement.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (TRUE races only — resolved by OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: reaccept-from-dormant-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /network/merchants/{merchant_id}/accept"
    occ_field: "expected_merchant_version"
    description: |
      Re-accepting a Merchant that has cycled DORMANT → PROSPECT is rejected when
      the client's observed version of the merchant is stale. This captures the
      case where another writer has already driven the outlet forward through the
      acceptance machine (legitimately superseding the prior acceptance state
      under the cyclic machine) and the current writer's view of the merchant is
      therefore out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: offer-launch-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /network/offers/{offer_id}/consent"
    occ_field: "expected_offer_version"
    description: |
      Merchant consenting to an Offer whose privacy_state has advanced since the
      merchant last observed it is rejected on the stale version. This captures
      the case where the data steward has already moved the offer's privacy state
      (which legitimately supersedes the merchant's view under the privacy
      machine) and the merchant is consenting against a superseded offer.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 pair #1: merchant discount rate on Merchant --------------------
  - name: merchant_discount_rate
    trigger: "POST /network/merchants/{merchant_id}/activate, POST /network/merchants/{merchant_id}/accept, and every Settlement finalize for the merchant"
    algorithm: tiered_pricing
    formula: |
      # Variant PROVISIONAL (the quoted rate): computed at create / accept and
      # recomputed on every metric or state change.
      if merchant.volume_tier == ACTIVITY:
        provisional_rate_bps = industry.base_discount_rate_bps
      else if merchant.volume_tier == FIXED:
        provisional_rate_bps = round_half_up(industry.base_discount_rate_bps * 0.75)
      else:  # LOW (negotiated large-merchant pricing below the industry base)
        provisional_rate_bps = merchant.negotiated_rate_bps
      applied_discount_rate_bps = provisional_rate_bps

      # Variant FINAL (the billed rate): sealed at Settlement finalize; the
      # trailing volume is recomputed against the actual settled volume and the
      # final rate is the volume-weighted average across the negotiated tiers.
      final_rate_bps = round_half_up(
          sum(rate_bps_for_tier(t) * volume_cents_in_tier(t) for t in tiers)
          / total_volume_cents)
    input_set: "Merchant rows with acceptance_status IN {ACCEPTED, ACTIVE}; IndustryCategory.risk_tier unused here; tiers ordered ACTIVITY < FIXED < LOW by cumulative monthly volume"
    constants:
      VOLUME_THRESHOLD_CENTS: 5000000
    precision: "basis points are integers; round_half_up at the single documented point; no intermediate rounding"
    variants:
      - name: provisional_rate
        when: "quoted at merchant create / accept; recomputed on every metric or state change"
        difference: "Uses the merchant's current volume tier bucket rate directly (base, 75% of base, or the negotiated rate)."
      - name: final_rate
        when: "sealed at Settlement finalize for the settlement month"
        difference: "Recomputes trailing volume against actually-settled volume and returns the volume-weighted average across the negotiated tiers, so it diverges from the provisional rate whenever settled volume crosses a tier boundary."

  # --- Rule 1 pair #2 + Rule 2(a): premium value proposition funding on AnnualFeeStatement ---
  - name: premium_value_funding
    trigger: "POST /network/annual-fee-statements/{statement_id}/disburse (assessed) and POST /network/annual-fee-statements/{statement_id}/void"
    algorithm: waterfall_allocation
    formula: |
      # Variant ASSESSED (premium fee-based value proposition funding):
      # the gross fee is a single assessed quantity; the value fund is a share of it.
      gross_fee_assessed_cents = principal_fee_cents + authorised_user_count * per_user_fee_cents
      value_fund_allocation_cents = round_half_up(gross_fee_assessed_cents * VALUE_FUND_SHARE_BPS / 10000)

      # Variant DISBURSED (rewards + lounge funding) — allocates the PER-AUTHORISED-USER
      # portion only and ignores the principal fee, because the value fund treats the
      # principal fee as retained network revenue.
      value_fund_allocation_cents = authorised_user_count * round_half_up(per_user_fee_cents * VALUE_FUND_SHARE_BPS / 10000)

      # Funded quantity: the sum over ASSESSED statements only.
      ValueFundLedgerEntry allocations exist only for statements whose
      statement_status == ASSESSED; a VOIDED statement carries a
      FEE_ALLOCATION_REVERSAL entry of equal magnitude.
    input_set: "AnnualFeeStatement rows for the current statement_year; no archived year; rows in DRAFT contribute nothing"
    constants:
      VALUE_FUND_SHARE_BPS: 4000
      LOUNGE_PASS_COST_CENTS: 3500
    precision: "integer cents; round_half_up at the single documented point"
    variants:
      - name: assessed_allocation
        when: "statement is assessed, before disbursement"
        difference: "Share applies to the full gross fee including the principal fee."
      - name: disbursed_allocation
        when: "fee is disbursed into the value fund"
        difference: "Share applies only to the per-authorised-user fee portion; the principal fee is not shared, so the two variants differ by exactly round_half_up(principal_fee_cents * VALUE_FUND_SHARE_BPS / 10000)."

  # --- Rule 2(b): nested rounding order pinned on Settlement ----------------
  - name: settlement_discount_rounding
    trigger: "POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mandatory): round ONCE at the batch level, after
      # summing every settled settlement in the batch. The forbidden alternative
      # is to round the discount per settlement and then sum; the two differ by
      # up to (n_lines - 1) fractional cents per batch.
      gross_in_batch_cents = sum(s.gross_volume_cents for s in batch)
      net_in_batch_cents   = sum(s.post_refund_volume_cents for s in batch)
      batch_discount_fee_cents = round_half_up(
          gross_in_batch_cents * resolve_discount_rate(merchant.volume_tier, currency='USD') / 10000)

      # Stored on the merchant as last_batch_discount_fee_cents. Per-batch value,
      # NOT the sum of per-line rounding:
      merchant.last_batch_discount_fee_cents != sum(round_half_up(s.gross_volume_cents * rate_bps / 10000) for s in batch)
    input_set: "Settlements in the batch whose settlement_status is CAPTURED or IN_FUNDING; REVERSED and SETTLED excluded; ordered by funding_batch_seq ASC"
    constants:
      EPSILON_CENTS: 1
    precision: "integer cents; exactly one round_half_up per batch (sum-then-round)"
    variants:
      - name: sum_then_round
        when: "the mandated order"
        difference: "One rounding per batch on the batch total."
      - name: round_then_sum
        when: "the forbidden order, listed to make the divergence testable"
        difference: "Rounds each settlement's discount to whole cents first, then sums; drifts from the mandated result by up to (n_lines - 1) cents."

  # --- Rule 2(c): circular-looking dependency pinned on Dispute -------------
  - name: dispute_outcome_points
    trigger: "POST /network/disputes/{dispute_id}/resolve"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED (the circular-looking part):
      #   step 1: dispute_resolution_points = round_half_up(dispute.amount_cents / 100)
      #           evaluated with the id supplied in the resolve request
      #   step 2: liability_shift_cents = dispute.amount_cents if the dispute is
      #           adjudicated against the original merchant, else 0
      #   step 3: net_points = dispute_resolution_points - round_half_up(liability_shift_cents / 100)
      #           (the discount nails to the amount resolved, exactly like a total
      #            computed before its own discount)
      #   step 4: CardMember.reward_points_balance += max(0, net_points)
      dispute_resolution_points = round_half_up(final_amount_cents / 100)
      merchant_share_points = round_half_up(final_amount_cents * MERCHANT_SHARE_BPS / 10000) if against_merchant else 0
      net_points = dispute_resolution_points - merchant_share_points
      # PINNED ORDER (the circular-looking part): round the gross resolution first,
      # then subtract the rounded merchant share. Rounding the net
      # (round_half_up(final_amount_cents * (10000 - MERCHANT_SHARE_BPS) / 10000))
      # is the forbidden order and drifts by one point for amounts like 60050.
    input_set: "Disputes in MERCHANT_RESPONDED or AUTO_ACCEPTED; OPEN disputes excluded; ties broken by created_at ASC"
    constants:
      POINTS_PER_DOLLAR: 1
      MERCHANT_SHARE_BPS: 4000
      MIN_POINTS_FLOOR: 0
    precision: "integer points; round_half_up per step; step order is fixed as written"

  # --- Rule 8(a): 90-day trailing billed volume (PROVISIONAL vs FINAL) ------
  - name: trailing_90d_billed_volume
    trigger: "any Settlement state change for the merchant"
    algorithm: forward_looking
    formula: |
      window_end   = current logical clock (server default 2026-09-01T00:00:00Z)
      window_start = window_end - 90 days   # inclusive start, exclusive end
      # Variant PROVISIONAL (merchant-facing): includes captured charges that have
      # not yet settled, so projection over-states coverage.
      provisional_90d_cents = sum(s.post_refund_volume_cents
          for s in Settlements
          where s.merchant_id == merchant.id
            and s.settlement_status IN {CAPTURED, IN_FUNDING, SETTLED}
            and window_start <= s.created_at < window_end)
      # Variant FINAL (reconciliation): settled volume only.
      final_90d_cents = sum(s.post_refund_volume_cents
          for s in Settlements
          where s.merchant_id == merchant.id
            and s.settlement_status == SETTLED
            and window_start <= s.created_at < window_end)
      merchant.rolling_90d_billed_volume_cents = provisional_90d_cents
      merchant.rolling_90d_settled_volume_cents = final_90d_cents
    input_set: "Settlements for the merchant; REVERSED excluded from both variants; boundary is inclusive-start / exclusive-end on s.created_at"
    constants:
      WINDOW_DAYS: 90
    precision: "integer cents"
    variants:
      - name: provisional
        when: "merchant-facing coverage projection"
        difference: "Includes CAPTURED and IN_FUNDING settlements that have not yet settled."
      - name: final
        when: "risk and reserve reconciliation"
        difference: "Includes only SETTLED settlements; diverges from provisional by the pending captured volume."

  # --- Rule 3(b): funding batch order (explicit evaluation order) ------------
  - name: funding_batch_order
    trigger: "POST /network/merchants/{merchant_id}/settlements (assigns batch_seq) and POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"
    algorithm: chronological
    formula: |
      # The funding batch number is a monotone counter assigned at settlement
      # capture time. batch_order = funding_batch_seq ALWAYS, never created_at:
      # created_at is forbidden in arithmetic because capture and settlement of
      # adjacent batches may straddle a day boundary, which would reorder them.
      settlement.funding_batch_seq = merchant.next_funding_batch_seq()  # increments by 1
      finalize iterates settlements ORDER BY funding_batch_seq ASC
    input_set: "Settlements for one merchant in the batch; REVERSED excluded"
    constants:
      BATCH_SEQ_START: 1
    precision: "integer sequence numbers; no time arithmetic"

  # --- Rule 6(a): merchant acceptance coverage gap --------------------------
  - name: acceptance_gap_window
    trigger: "POST /network/acceptance-gaps/rollup and POST /network/complaints/{complaint_id}/uphold"
    algorithm: interval_merge
    formula: |
      counted = [d for d in DeclinedAttempt
                 if d.decline_reason == MERCHANT_NOT_ACCEPTED
                 and Merchant[d.merchant_id].region_code == gap.region_code
                 and Merchant[d.merchant_id].industry_category_id == gap.industry_category_id
                 and gap.window_start <= d.occurred_at < gap.window_end]
      gap.decline_count        = count(counted)
      gap.declined_volume_cents= sum(d.attempted_amount_cents for d in counted)
      gap.declined_volume_cents_floor = gap.decline_count * MIN_DECLINED_CENTS
      gap.declined_volume_cents        = max(gap.declined_volume_cents, gap.declined_volume_cents_floor)
      if gap.decline_count >= ACCEPTANCE_GAP_DECLINE_MIN:  # >= not >
        gap.qualified_status = PROSPECTING
      else if gap.decline_count >= 1:
        gap.qualified_status = BELOW_THRESHOLD
      else:
        gap.qualified_status = DORMANT
    input_set: "DeclinedAttempt rows in [window_start, window_end) with decline_reason == MERCHANT_NOT_ACCEPTED; other reasons excluded"
    constants:
      ACCEPTANCE_GAP_DECLINE_MIN: 3
      MIN_DECLINED_CENTS: 50
    precision: "integer counts and cents; boundary is >= for the PROSPECTING tier"

  # --- Rule 6(b): high-risk merchant reserve ---------------------------------
  - name: merchant_reserve
    trigger: "POST /network/merchants/{merchant_id}/activate and every Settlement finalize"
    algorithm: threshold
    formula: |
      if industry.risk_tier == HIGH:
        reserve_required_cents = max(
            round_half_up(merchant.rolling_90d_settled_volume_cents * RESERVE_FLOOR_BPS / 10000),
            merchant.reserve_required_cents)          # ratchet: never decreases
      else:
        reserve_required_cents = 0                     # LOW and MEDIUM categories hold no reserve
    input_set: "Merchants whose IndustryCategory.risk_tier == HIGH; LOW and MEDIUM excluded (zero reserve)"
    constants:
      RESERVE_FLOOR_BPS: 500
    precision: "integer cents; round_half_up; the ratchet makes the result order-sensitive"

  # --- Rule 6(b) boundary source: reserve sweep at the ceiling ---------------
  - name: reserve_sweep
    trigger: "POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize when the reserve is below its floor"
    algorithm: threshold
    formula: |
      shortfall_cents = merchant.reserve_required_cents - merchant.reserve_held_cents
      if shortfall_cents > 0:
        withheld = min(shortfall_cents, settlement.post_refund_volume_cents - final_discount_fee_cents)
        merchant.reserve_held_cents += withheld
    input_set: "Settlement rows of a HIGH risk_tier merchant in the batch"
    constants:
      SWEEP_AT_ZERO: 0   # withholding applies strictly while shortfall_cents > 0
    precision: "integer cents"

  # --- Offer audience aggregation (Computation-determinism exemplar) ---------
  - name: offer_audience_aggregation
    trigger: "POST /network/offers/{offer_id}/submit-review"
    algorithm: aggregation
    formula: |
      qualifying = [m for m in CardMember
                    if m.member_status == ACTIVE
                    and m.trailing_lowest_month_spend_cents >= offer.min_segment_spend_cents]
      # The audience is a set: audience_size and the spend sum are order-invariant.
      # Any ordering used for reporting pins (trailing_lowest_month_spend_cents DESC,
      # created_at ASC) — never id.
      qualifying.sort(key=lambda m: (-m.trailing_lowest_month_spend_cents, m.created_at))
      offer.audience_size = len(qualifying)
      offer.aggregated_spend_cents = sum(m.trailing_lowest_month_spend_cents for m in qualifying)
      # privacy: only the aggregated rollup is exposed to the merchant; a single-member
      # audience (audience_size == 1) is never exposed as an individual spend figure.
    input_set: "CardMember rows with member_status == ACTIVE; PENDING, DELINQUENT and CLOSED excluded; trailing_lowest_month_spend_cents determines the segment"
    constants:
      AUDIENCE_QUORUM: 1
    precision: "integer cents"

  # --- Offer acceptance payout (compensation source) ------------------------
  - name: offer_acceptance_payout
    trigger: "POST /network/offers/{offer_id}/accept and POST /network/offer-acceptances/{acceptance_id}/reverse"
    algorithm: waterfall_allocation
    formula: |
      trigger_amount_cents = cardmember.trailing_lowest_month_spend_cents
      reward_amount_cents  = round_half_up(trigger_amount_cents * offer.reward_bps / 10000)

      # REVERSAL variant: the compensation must restore the exact funded quantity,
      # so it reverses the CURRENT approved backing — not a re-derived figure:
      reward_amount_cents  = acceptance.trigger_amount_cents * offer_provisional_reward_bps / 10000
      where offer_provisional_reward_bps = floor(offer.reward_bps / 2)

      # The funded quantity is OfferRedemptionPool.consumed_total_cents; an APPROVE
      # increases it by the approved backing and a REVERSE decreases it by the
      # reversed backing, so a matched approve/reverse pair restores the balance.
      # An accept alone (PENDING, not yet approved) moves no pool money.
    input_set: "OfferAcceptances whose acceptance_status is APPROVED or PAID (the approve/reverse pair); PENDING acceptances contribute nothing to the pool; REVERSED excluded"
    constants:
      PROVISIONAL_DIVISOR: 2
    precision: "integer cents; round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is a declared role and X-User-ID is present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for the operation per §1.7; for entity-backed roles (Merchant, CardMember) the acting X-User-ID must equal the owning foreign key of the addressed resource (Merchant.id for merchant-owned rows, CardMember.id for member-owned rows)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /network/merchants/{merchant_id}/suppress, POST /network/disputes/{dispute_id}/respond, POST /network/offers/{offer_id}/consent"

  - priority: 3
    category: existence
    check: "referenced merchant, offer, statement, settlement, dispute and complaint exist; path ids validated left-to-right before body ids"
    error_id: ERR_MERCHANT_NOT_FOUND
    http_status: 404
    applies_to: "all /network/merchants/* endpoints"

  - priority: 3
    category: existence
    check: "referenced Offer, AnnualFeeStatement, Settlement, Dispute and AcceptanceComplaint exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /network/offers/*, /network/annual-fee-statements/*, /network/settlements/*, /network/disputes/*, /network/complaints/* endpoints"

  - priority: 4
    category: business_referential
    check: "Redirecting a Dispute adjudicated against the original merchant onto a final merchant leaves the charging merchant with no registered MerchantRiskState row"
    error_id: ERR_NO_RISK_STATE
    http_status: 409
    applies_to: "POST /network/disputes/{dispute_id}/resolve"

  - priority: 5
    category: business_fiscal
    check: "Consuming a funded OfferRedemptionPool that does not exist, or whose balance cannot cover the redemption"
    error_id: ERR_POOL_INSUFFICIENT_RESERVE
    http_status: 402
    applies_to: "POST /network/offers/{offer_id}/accept"

  - priority: 6
    category: business_constraint
    check: "Offer privacy: no member-spend data may be shared before MERCHANT_CONSENT; audience must meet the privacy quorum"
    error_id: ERR_PRIVACY_VIOLATION
    http_status: 403
    applies_to: "POST /network/offers/{offer_id}/request-consent, POST /network/offers/{offer_id}/consent"

  - priority: 7
    category: business_constraint
    check: "Merchant acceptance risk ceiling: unresolved open chargeback count above the ceiling (UNRESOLVED_CB_CEILING) or the chargeback ratio above its ceiling"
    error_id: ERR_MERCHANT_RISK_SUPPRESSED
    http_status: 409
    applies_to: "POST /network/merchants/{merchant_id}/activate, POST /network/merchants/{merchant_id}/suppress, POST /network/merchants/{merchant_id}/settlements"

  - priority: 8
    category: state
    check: "the target resource is in the state required for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_fiscal
    check: "Settlement finalize requires a strictly ascending funding batch sequence per merchant; finalizing a batch at or below an already-finalized seq"
    error_id: ERR_BATCH_SEQ_NOT_MONOTONE
    http_status: 409
    applies_to: "POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"

  - priority: 10
    category: business_temporal
    check: "A Complaint uphold may not enroll a merchant whose acceptance_status is already PROSPECT"
    error_id: ERR_COMPLAINT_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /network/complaints/{complaint_id}/uphold"

  - priority: 11
    category: business_temporal
    check: "Offer live windows for the same merchant must leave at least one day of clearance; an overlap or sub-one-day gap"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 409
    applies_to: "POST /network/offers/{offer_id}/consent"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) -------------------------------------------------
  - method: POST
    path: "/network/_clock/set_current_utc"
    description: "Set the logical clock. Server default is 2026-09-01T00:00:00Z; before any call the clock reads exactly that default and never falls back to wall-clock time."
    roles: [NetworkIssuer]
    code: 200
    input: [current_utc]
    output: "{ wall_clock_utc: datetime }"
    side_effects: ["logical clock advances; response-dispute and window-deadline rules re-evaluate against the new instant"]

  # --- Industry categories --------------------------------------------------
  - method: POST
    path: "/network/industry-categories"
    description: "Create an IndustryCategory"
    roles: [NetworkAcquirer]
    code: 201
    input: [industry_code, industry_name, risk_tier, base_discount_rate_bps, "high_risk_flag?"]
    output: IndustryCategory
    side_effects: []

  - method: GET
    path: "/network/industry-categories/{industry_category_id}"
    description: "Get an IndustryCategory"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: IndustryCategory
    side_effects: []

  - method: GET
    path: "/network/industry-categories"
    description: "List IndustryCategories"
    roles: [NetworkAcquirer]
    code: 200
    input: ["limit?", "offset?"]
    output: IndustryCategory[]
    side_effects: []

  # --- Sweep index (test-driving) -------------------------------------------
  - method: POST
    path: "/network/_sweep-index/stamp"
    description: "Stamp the next rollup sweep generation. The supplied sweep_index is the value recorded; a DORMANT merchant is re-enrolled only when its status_version equals the supplied sweep_index."
    roles: [NetworkAcquirer]
    code: 200
    input: [sweep_index, rolled_at]
    output: SweepIndexStamp
    side_effects: ["registers the sweep generation; the acceptance-gap engine may re-enter DORMANT merchants whose status_version matches"]

  - method: GET
    path: "/network/sweep-index-stamps"
    description: "List sweep generation stamps"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: SweepIndexStamp[]
    side_effects: []

  # --- Merchants ------------------------------------------------------------
  - method: POST
    path: "/network/merchants"
    description: "Create a Merchant (starts PROSPECT)"
    roles: [NetworkAcquirer]
    code: 201
    input: [industry_category_id, merchant_name, region_code, acquisition_channel, "channel_partner?", "negotiated_rate_bps?"]
    output: Merchant
    side_effects:
      - "acceptance_status=PROSPECT, volume_tier=ACTIVITY, applied_discount_rate_bps=resolve_discount_rate(ACTIVITY)"
      - "applied_discount_rate_bps = the negotiated rate when negotiated_rate_bps is supplied, else the ACTIVITY-tier rate"
      - "status_version=0, billed_volume_mtd_cents=0, rolling_90d_billed_volume_cents=0, reserve_required_cents=0"
      - "a MerchantRiskState row is created for the merchant with rolling_chargeback_count=0"

  - method: GET
    path: "/network/merchants/{merchant_id}"
    description: "Get a Merchant"
    roles: [NetworkAcquirer, NetworkCompliance, Merchant]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: GET
    path: "/network/merchants"
    description: "List merchants, optionally filtered by acceptance_status or industry"
    roles: [NetworkAcquirer, NetworkCompliance]
    code: 200
    input: ["acceptance_status?", "industry_category_id?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []

  - method: POST
    path: "/network/merchants/{merchant_id}/accept"
    description: "Accept a merchant into the program (PROSPECT → ACCEPTED); OCC-checked — expected_merchant_version is required when the caller asserts OCC"
    roles: [NetworkAcquirer]
    code: 200
    input: [expected_merchant_version, "negotiated_rate_bps?"]
    output: Merchant
    side_effects:
      - "acceptance_status → ACCEPTED"
      - "applied_discount_rate_bps = resolve_discount_rate(volume_tier, currency='USD')"
      - "increments Merchant.version by 1"

  - method: POST
    path: "/network/merchants/{merchant_id}/activate"
    description: "Activate an accepted merchant (ACCEPTED → ACTIVE)"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: Merchant
    side_effects:
      - "acceptance_status → ACTIVE"
      - "status_version increments by 1 at every acceptance-status activation"
      - "reserve_required_cents = reserve_required(merchant)"
      - "increments Merchant.version by 1"

  - method: POST
    path: "/network/merchants/{merchant_id}/mark-dormant"
    description: "Mark an active merchant dormant (ACTIVE → DORMANT)"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: Merchant
    side_effects: ["acceptance_status → DORMANT", "increments Merchant.version by 1"]

  - method: POST
    path: "/network/merchants/{merchant_id}/suppress"
    description: "Suppress a merchant (PROSPECT/ACTIVE → SUPPRESSED, terminal)"
    roles: [NetworkCompliance]
    code: 200
    input: []
    output: Merchant
    side_effects:
      - "acceptance_status → SUPPRESSED (terminal)"
      - "all Offer rows for this merchant → TERMINATED"
      - "CAPTURED and IN_FUNDING Settlements for this merchant → REVERSED"
      - "increments Merchant.version by 1"

  - method: DELETE
    path: "/network/merchants/{merchant_id}"
    description: "Archive a merchant: move it to the terminal SUPPRESSED state (operator soft delete). The row stays readable and no risk ceiling is required."
    roles: [NetworkCompliance]
    code: 200
    input: []
    output: Merchant
    side_effects:
      - "acceptance_status → SUPPRESSED (terminal); the merchant row stays readable via GET"
      - "all Offer rows for this merchant with privacy_state in {DRAFT, PRIVACY_REVIEW, MERCHANT_CONSENT, LIVE} → TERMINATED"
      - "CAPTURED and IN_FUNDING Settlements for this merchant → REVERSED"
      - "increments Merchant.version by 1"

  - method: POST
    path: "/network/merchants/{merchant_id}/declined-attempts"
    description: "Record a declined card attempt at a merchant"
    roles: [NetworkAcquirer]
    code: 201
    input: [card_product, attempted_amount_cents, decline_reason, occurred_at]
    output: DeclinedAttempt
    side_effects:
      - "if decline_reason == MERCHANT_NOT_ACCEPTED and the merchant is DORMANT, re-enrolls the merchant as PROSPECT when an open AcceptanceGap window exists for its region and industry and the current sweep generation matches the merchant's status_version"
      - "increments the merchant's AcceptanceGap counters via the acceptance-gap engine"

  - method: GET
    path: "/network/merchants/{merchant_id}/declined-attempts"
    description: "List declined attempts for a merchant"
    roles: [NetworkAcquirer]
    code: 200
    input: ["limit?", "offset?"]
    output: DeclinedAttempt[]
    side_effects: []

  - method: GET
    path: "/network/merchants/{merchant_id}/acceptance-gaps"
    description: "List acceptance gaps for a merchant"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: AcceptanceGap[]
    side_effects: []

  # --- Acceptance gaps ------------------------------------------------------
  - method: POST
    path: "/network/acceptance-gaps/rollup"
    description: "Roll up acceptance gaps for a region + industry over a window"
    roles: [NetworkAcquirer]
    code: 200
    input: [region_code, industry_category_id, window_start, window_end, window_days]
    output: AcceptanceGap
    side_effects:
      - "recomputes decline_count and declined_volume_cents"
      - "applies the interval-merge rule: a 30-day window merges into an existing window when it overlaps by at least 1 day (window_start < existing.window_end and window_end > existing.window_start), while a 60-day window merges when edge-adjacent (window_start == existing.window_end)"
      - "requalifies matching DORMANT merchants as PROSPECT"

  - method: GET
    path: "/network/acceptance-gaps"
    description: "List acceptance gaps, filterable by region or industry"
    roles: [NetworkAcquirer]
    code: 200
    input: ["region_code?", "industry_category_id?", "qualified_status?", "limit?", "offset?"]
    output: AcceptanceGap[]
    side_effects: []

  - method: GET
    path: "/network/acceptance-gaps/{gap_id}"
    description: "Get one acceptance gap"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: AcceptanceGap
    side_effects: []

  # --- Offers ---------------------------------------------------------------
  - method: POST
    path: "/network/offers"
    description: "Create an Offer (starts DRAFT)"
    roles: [NetworkDataSteward]
    code: 201
    input: [merchant_id, audience_segment, min_segment_spend_cents, reward_bps]
    output: Offer
    side_effects: ["privacy_state=DRAFT, audience_size=0, aggregated_spend_cents=0"]

  - method: GET
    path: "/network/offers/{offer_id}"
    description: "Get an Offer"
    roles: [NetworkDataSteward, Merchant]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/network/offers"
    description: "List offers"
    roles: [NetworkDataSteward]
    code: 200
    input: ["merchant_id?", "privacy_state?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/network/offers/{offer_id}/submit-review"
    description: "Submit an offer for privacy review (DRAFT → PRIVACY_REVIEW)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "privacy_state → PRIVACY_REVIEW"
      - "audience_size and aggregated_spend_cents recomputed by the offer-audience aggregation"

  - method: POST
    path: "/network/offers/{offer_id}/request-consent"
    description: "Request merchant consent (PRIVACY_REVIEW → MERCHANT_CONSENT)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: Offer
    side_effects: ["privacy_state → MERCHANT_CONSENT"]

  - method: POST
    path: "/network/offers/{offer_id}/consent"
    description: "Merchant consents to the offer (MERCHANT_CONSENT → LIVE); OCC-checked — expected_offer_version is required when the caller asserts OCC, optional for a bare transition probe"
    roles: [Merchant]
    code: 200
    input: ["expected_offer_version?", "live_start_utc?", "live_end_utc?"]
    output: Offer
    side_effects:
      - "privacy_state → LIVE"
      - "increments Offer.version by 1"

  - method: POST
    path: "/network/offers/{offer_id}/return-to-draft"
    description: "Return an offer to draft (PRIVACY_REVIEW → DRAFT)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: Offer
    side_effects: ["privacy_state → DRAFT", "audience_size=0, aggregated_spend_cents=0"]

  - method: POST
    path: "/network/offers/{offer_id}/suspend"
    description: "Suspend a live offer (LIVE → MERCHANT_CONSENT)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: Offer
    side_effects: ["privacy_state → MERCHANT_CONSENT"]

  - method: POST
    path: "/network/offers/{offer_id}/accept"
    description: "Card member accepts a live offer"
    roles: [CardMember]
    code: 201
    input: [cardmember_id, trigger_amount_cents]
    output: OfferAcceptance
    side_effects:
      - "acceptance_status=PENDING, reward_amount_cents = approved backing"
      - "offer.accepted_count += 1"
      - "no pool movement yet; OfferRedemptionPool.consumed_total_cents moves only when the redemption is approved"

  - method: GET
    path: "/network/offers/{offer_id}/acceptances"
    description: "List acceptances for an offer"
    roles: [NetworkDataSteward, Merchant]
    code: 200
    input: []
    output: OfferAcceptance[]
    side_effects: []

  # --- Offer acceptances ----------------------------------------------------
  - method: GET
    path: "/network/offer-acceptances/{acceptance_id}"
    description: "Get an offer acceptance"
    roles: [NetworkDataSteward, CardMember]
    code: 200
    input: []
    output: OfferAcceptance
    side_effects: []

  - method: GET
    path: "/network/offer-acceptances"
    description: "List offer acceptances, filterable by member or offer"
    roles: [NetworkDataSteward, CardMember]
    code: 200
    input: ["cardmember_id?", "offer_id?", "acceptance_status?", "limit?", "offset?"]
    output: OfferAcceptance[]
    side_effects: []

  - method: POST
    path: "/network/offer-acceptances/{acceptance_id}/approve"
    description: "Approve a pending redemption (PENDING → APPROVED)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: OfferAcceptance
    side_effects:
      - "acceptance_status → APPROVED"
      - "the offer's OfferRedemptionPool.consumed_total_cents += reward_amount_cents; pool.balance_cents -= reward_amount_cents"

  - method: POST
    path: "/network/offer-acceptances/{acceptance_id}/pay"
    description: "Pay an approved redemption (APPROVED → PAID)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: OfferAcceptance
    side_effects: ["acceptance_status → PAID"]

  - method: POST
    path: "/network/offer-acceptances/{acceptance_id}/reverse"
    description: "Reverse an approved or paid redemption (→ REVERSED)"
    roles: [NetworkDataSteward]
    code: 200
    input: []
    output: OfferAcceptance
    side_effects:
      - "acceptance_status → REVERSED"
      - "the offer's OfferRedemptionPool.consumed_total_cents -= reversed backing; pool.balance_cents += reversed backing"

  # --- Offer redemption pools -----------------------------------------------
  - method: POST
    path: "/network/offers/{offer_id}/redemption-pool"
    description: "Create the funded redemption pool for an offer"
    roles: [NetworkDataSteward]
    code: 201
    input: [funder, initial_funded_cents]
    output: OfferRedemptionPool
    side_effects: ["balance_cents=initial_funded_cents, topup_total_cents=0, consumed_total_cents=0"]

  - method: POST
    path: "/network/offers/{offer_id}/redemption-pool/topup"
    description: "Top up the funded redemption pool"
    roles: [NetworkDataSteward]
    code: 200
    input: [amount_cents]
    output: OfferRedemptionPool
    side_effects: ["balance_cents += amount_cents; topup_total_cents += amount_cents"]

  - method: GET
    path: "/network/offers/{offer_id}/redemption-pool"
    description: "Get the redemption pool for an offer (1:1 — returns an array of length 0 or 1)"
    roles: [NetworkDataSteward, Merchant]
    code: 200
    input: []
    output: OfferRedemptionPool[]
    side_effects: []

  # --- Card members ---------------------------------------------------------
  - method: POST
    path: "/network/cardmembers"
    description: "Register a CardMember (starts PENDING)"
    roles: [NetworkIssuer]
    code: 201
    input: [member_name, card_product]
    output: CardMember
    side_effects:
      - "member_status=PENDING, annual_fee_cents from card product"
      - "reward_points_balance=0, lounge_access_tier=NONE"

  - method: GET
    path: "/network/cardmembers/{cardmember_id}"
    description: "Get a CardMember (personal data — restricted to the issuer)"
    roles: [NetworkIssuer, CardMember]
    code: 200
    input: []
    output: CardMember
    side_effects: []

  - method: GET
    path: "/network/cardmembers"
    description: "List card members (restricted — issuer only)"
    roles: [NetworkIssuer]
    code: 200
    input: ["member_status?", "limit?", "offset?"]
    output: CardMember[]
    side_effects: []

  - method: POST
    path: "/network/cardmembers/{cardmember_id}/activate"
    description: "Activate a card member (PENDING → ACTIVE)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: CardMember
    side_effects:
      - "member_status → ACTIVE"
      - "reward_points_balance += membership_reward_points(member)"
      - "lounge_access_tier = lounge_access_tier(member)"

  - method: POST
    path: "/network/cardmembers/{cardmember_id}/set-monthly-spend"
    description: "Set the member's trailing lowest calendar-month spend"
    roles: [NetworkIssuer]
    code: 200
    input: [trailing_lowest_month_spend_cents]
    output: CardMember
    side_effects:
      - "trailing_lowest_month_spend_cents updated"
      - "lounge_access_tier recomputed"

  - method: POST
    path: "/network/cardmembers/{cardmember_id}/grant-lounge-access"
    description: "Grant a lounge pass to the member"
    roles: [NetworkIssuer]
    code: 200
    input: [pass_count]
    output: CardMember
    side_effects:
      - "a LOUNGE_PASS_GRANT ValueFundLedgerEntry is written"
      - "lounge_access_tier recomputed"

  - method: POST
    path: "/network/cardmembers/{cardmember_id}/mark-delinquent"
    description: "Mark a member delinquent (ACTIVE → DELINQUENT)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: CardMember
    side_effects: ["member_status → DELINQUENT", "lounge_access_tier → NONE"]

  - method: POST
    path: "/network/cardmembers/{cardmember_id}/close"
    description: "Close a delinquent member (DELINQUENT → CLOSED)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: CardMember
    side_effects: ["member_status → CLOSED (terminal)"]

  # --- Annual fee statements / value fund -----------------------------------
  - method: POST
    path: "/network/annual-fee-statements"
    description: "Create an annual fee statement (starts DRAFT)"
    roles: [NetworkIssuer]
    code: 201
    input: [cardmember_id, statement_year, principal_fee_cents, authorised_user_count, per_user_fee_cents]
    output: AnnualFeeStatement
    side_effects: ["statement_status=DRAFT, gross_fee_assessed_cents=0, value_fund_allocation_cents=0"]

  - method: GET
    path: "/network/annual-fee-statements/{statement_id}"
    description: "Get an annual fee statement"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: AnnualFeeStatement
    side_effects: []

  - method: GET
    path: "/network/annual-fee-statements"
    description: "List annual fee statements, filterable by member"
    roles: [NetworkIssuer]
    code: 200
    input: ["cardmember_id?", "statement_status?", "limit?", "offset?"]
    output: AnnualFeeStatement[]
    side_effects: []

  - method: POST
    path: "/network/annual-fee-statements/{statement_id}/assess"
    description: "Assess the premium fee (DRAFT → ASSESSED)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: AnnualFeeStatement
    side_effects:
      - "statement_status → ASSESSED"
      - "gross_fee_assessed_cents = principal_fee_cents + authorised_user_count * per_user_fee_cents"
      - "value_fund_allocation_cents = assessed allocation"

  - method: POST
    path: "/network/annual-fee-statements/{statement_id}/disburse"
    description: "Disburse the value-fund share (ASSESSED → DISBURSED)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: AnnualFeeStatement
    side_effects:
      - "statement_status → DISBURSED"
      - "a FEE_ALLOCATION ValueFundLedgerEntry is written and the value fund increases"
      - "reward_points_balance on the member's account is funded by the value fund"

  - method: POST
    path: "/network/annual-fee-statements/{statement_id}/void"
    description: "Void an assessed statement (ASSESSED → VOIDED)"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: AnnualFeeStatement
    side_effects:
      - "statement_status → VOIDED (terminal)"
      - "a FEE_ALLOCATION_REVERSAL ValueFundLedgerEntry of equal magnitude is written and the value fund decreases"

  - method: GET
    path: "/network/value-fund/ledger"
    description: "List value-fund ledger entries in deterministic (created_seq) order"
    roles: [NetworkIssuer]
    code: 200
    input: ["source_statement_id?", "entry_kind?", "limit?", "offset?"]
    output: ValueFundLedgerEntry[]
    side_effects: []

  # --- Settlements / funding ------------------------------------------------
  - method: POST
    path: "/network/merchants/{merchant_id}/settlements"
    description: "Capture a settlement for a merchant; assigns the next funding batch sequence"
    roles: [NetworkSettlementOps]
    code: 201
    input: [settlement_cycle, gross_volume_cents, refund_volume_cents]
    output: Settlement
    side_effects:
      - "settlement_status=CAPTURED"
      - "post_refund_volume_cents = gross_volume_cents - refund_volume_cents"
      - "discount_fee_cents = round_half_up(gross_volume_cents * applied_discount_rate_bps / 10000)"
      - "net_funding_cents = post_refund_volume_cents - discount_fee_cents (provisional)"
      - "funding_batch_seq = merchant.next_funding_batch_seq()"

  - method: GET
    path: "/network/merchants/{merchant_id}/settlements"
    description: "List settlements for a merchant"
    roles: [NetworkSettlementOps, Merchant]
    code: 200
    input: ["settlement_status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/network/settlements/{settlement_id}"
    description: "Get a settlement"
    roles: [NetworkSettlementOps, Merchant]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"
    description: "Finalize a funding batch: seals final discount/reserve and releases funding"
    roles: [NetworkSettlementOps]
    code: 200
    input: []
    output: Merchant
    side_effects:
      - "settlements in the batch with funding_batch_seq == batch_seq → IN_FUNDING, final fields sealed"
      - "a strictly smaller funding_batch_seq already IN_FUNDING is promoted to SETTLED"
      - "merchant.rolling_90d_billed_volume_cents (provisional) and rolling_90d_settled_volume_cents (final) recomputed by the trailing-volume rule"
      - "merchant.last_batch_discount_fee_cents = round_half_up(sum(gross_volume_cents in this batch) * applied_discount_rate_bps / 10000) — sum-then-round over the batch"
      - "merchant.reserve_required_cents = reserve_required(merchant) (ratchet on the final rolling volume)"
      - "increments every affected Settlement.version and Merchant.version by 1"

  - method: POST
    path: "/network/settlements/{settlement_id}/posting-reversal"
    description: "Reverse a settled posting (SETTLED → IN_FUNDING)"
    roles: [NetworkSettlementOps]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement_status → IN_FUNDING"
      - "merchant.billed_volume_mtd_cents -= post_refund_volume_cents; merchant.volume_tier and applied_discount_rate_bps recomputed"

  - method: POST
    path: "/network/settlements/{settlement_id}/reinstate"
    description: "Reinstate a reversed settlement (REVERSED → CAPTURED)"
    roles: [NetworkSettlementOps]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement_status → CAPTURED", "final fields cleared"]

  # --- Disputes -------------------------------------------------------------
  - method: POST
    path: "/network/disputes"
    description: "Open a dispute (starts OPEN); priority derived from amount"
    roles: [CardMember]
    code: 201
    input: [cardmember_id, original_merchant_id, final_merchant_id, amount_cents]
    output: Dispute
    side_effects:
      - "dispute_status=OPEN, representment_stage=NONE"
      - "priority=HIGH when amount_cents >= 50000 else STANDARD"
      - "MerchantRiskState[original_merchant_id].unresolved_chargeback_count += 1"

  - method: GET
    path: "/network/disputes/{dispute_id}"
    description: "Get a dispute"
    roles: [NetworkDisputeOps, CardMember, Merchant]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/network/disputes"
    description: "List disputes, filterable by original merchant, final merchant or card member"
    roles: [NetworkDisputeOps, Merchant]
    code: 200
    input: ["merchant_id?", "original_merchant_id?", "final_merchant_id?", "cardmember_id?", "dispute_status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/network/disputes/{dispute_id}/respond"
    description: "Merchant responds to a dispute (OPEN → MERCHANT_RESPONDED)"
    roles: [Merchant]
    code: 200
    input: []
    output: Dispute
    side_effects: ["dispute_status → MERCHANT_RESPONDED"]

  - method: POST
    path: "/network/disputes/{dispute_id}/resolve"
    description: "Network adjudicates a responded or auto-accepted dispute"
    roles: [NetworkDisputeOps]
    code: 200
    input: [outcome]
    output: Dispute
    side_effects:
      - "dispute_status → WON or LOST"
      - "on WON: acquirer liability and MerchantRiskState chargeback counts move from original_merchant_id to final_merchant_id"
      - "on LOST with representment_stage NONE: representment_stage → FIRST_ROUND; with FIRST_ROUND: → CLOSED"
      - "network_settled_cents -= amount_cents"
      - "CardMember.reward_points_balance may increase by dispute_outcome_points"

  - method: POST
    path: "/network/disputes/{dispute_id}/withdraw"
    description: "Card member withdraws an open dispute (OPEN → WITHDRAWN)"
    roles: [CardMember]
    code: 200
    input: []
    output: Dispute
    side_effects: ["dispute_status → WITHDRAWN (terminal)", "no liability transfer"]

  # --- Acceptance complaints ------------------------------------------------
  - method: POST
    path: "/network/complaints"
    description: "File an acceptance complaint (starts FILED)"
    roles: [CardMember, NetworkService]
    code: 201
    input: [merchant_id, cardmember_id, complaint_type]
    output: AcceptanceComplaint
    side_effects: ["complaint_status=FILED"]

  - method: GET
    path: "/network/complaints/{complaint_id}"
    description: "Get an acceptance complaint"
    roles: [NetworkService]
    code: 200
    input: []
    output: AcceptanceComplaint
    side_effects: []

  - method: GET
    path: "/network/complaints"
    description: "List acceptance complaints, filterable by merchant or card member"
    roles: [NetworkService]
    code: 200
    input: ["merchant_id?", "cardmember_id?", "complaint_status?", "limit?", "offset?"]
    output: AcceptanceComplaint[]
    side_effects: []

  - method: POST
    path: "/network/complaints/{complaint_id}/take-up"
    description: "Take a complaint under review (FILED → UNDER_REVIEW)"
    roles: [NetworkService]
    code: 200
    input: []
    output: AcceptanceComplaint
    side_effects: ["complaint_status → UNDER_REVIEW"]

  - method: POST
    path: "/network/complaints/{complaint_id}/uphold"
    description: "Uphold a complaint (UNDER_REVIEW → UPHELD)"
    roles: [NetworkService]
    code: 200
    input: []
    output: AcceptanceComplaint
    side_effects:
      - "complaint_status → UPHELD (terminal)"
      - "opens a merchant validation gap through the acceptance-gap engine: a new AcceptanceGap row for the merchant's region + IndustryCategory with window_width=30, and the covered DORMANT merchant re-enters as PROSPECT"
      - "rejected with ERR_COMPLAINT_ALREADY_ENROLLED when the merchant is already PROSPECT"

  - method: POST
    path: "/network/complaints/{complaint_id}/dismiss"
    description: "Dismiss a complaint (UNDER_REVIEW → DISMISSED)"
    roles: [NetworkService]
    code: 200
    input: []
    output: AcceptanceComplaint
    side_effects: ["complaint_status → DISMISSED (terminal)"]

  - method: POST
    path: "/network/complaints/{complaint_id}/reopen"
    description: "Reopen a complaint (UNDER_REVIEW → FILED)"
    roles: [NetworkService]
    code: 200
    input: []
    output: AcceptanceComplaint
    side_effects: ["complaint_status → FILED"]

  # --- Merchant risk state --------------------------------------------------
  # --- Reverse-reachability collection reads --------------------------------
  - method: GET
    path: "/network/declined-attempts"
    description: "List declined card attempts, filterable by merchant"
    roles: [NetworkAcquirer]
    code: 200
    input: ["merchant_id?", "decline_reason?", "limit?", "offset?"]
    output: DeclinedAttempt[]
    side_effects: []

  - method: GET
    path: "/network/settlements"
    description: "List settlements, filterable by merchant"
    roles: [NetworkSettlementOps, Merchant]
    code: 200
    input: ["merchant_id?", "settlement_status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/network/declined-attempts/{declined_attempt_id}"
    description: "Get one declined card attempt"
    roles: [NetworkAcquirer]
    code: 200
    input: []
    output: DeclinedAttempt
    side_effects: []

  - method: GET
    path: "/network/redemption-pools/{pool_id}"
    description: "Get one offer redemption pool"
    roles: [NetworkDataSteward, Merchant]
    code: 200
    input: []
    output: OfferRedemptionPool
    side_effects: []

  - method: GET
    path: "/network/merchant-risk-states/{risk_state_id}"
    description: "Get one merchant risk-state row"
    roles: [NetworkCompliance, NetworkAcquirer]
    code: 200
    input: []
    output: MerchantRiskState
    side_effects: []

  - method: GET
    path: "/network/value-fund-ledger-entries/{entry_id}"
    description: "Get one value-fund ledger entry"
    roles: [NetworkIssuer]
    code: 200
    input: []
    output: ValueFundLedgerEntry
    side_effects: []

  - method: GET
    path: "/network/merchant-risk-states"
    description: "List merchant risk-state rows, filterable by merchant"
    roles: [NetworkCompliance, NetworkAcquirer]
    code: 200
    input: ["merchant_id?", "suppression_flag?", "limit?", "offset?"]
    output: MerchantRiskState[]
    side_effects: []

  - method: GET
    path: "/network/redemption-pools"
    description: "List offer redemption pools, filterable by offer"
    roles: [NetworkDataSteward, Merchant]
    code: 200
    input: ["offer_id?", "funder?", "limit?", "offset?"]
    output: OfferRedemptionPool[]
    side_effects: []

  - method: GET
    path: "/network/value-fund-ledger-entries"
    description: "List value-fund ledger entries, filterable by source statement"
    roles: [NetworkIssuer]
    code: 200
    input: ["source_statement_id?", "entry_kind?", "limit?", "offset?"]
    output: ValueFundLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/network/merchants/{merchant_id}/risk-state"
    description: "Get the rolling risk state for a merchant (1:1 — returns an array of length 0 or 1)"
    roles: [NetworkCompliance, NetworkAcquirer]
    code: 200
    input: []
    output: MerchantRiskState[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role absent/unknown or X-User-ID missing for an entity-backed role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "The acting role is not permitted for the operation (e.g. a Merchant responding to a dispute it did not originate, or a NetworkService submitting a merchant penalty)"

  - id: ERR_RESPOND_AMOUNT_TOO_LOW
    http: 403
    condition: "Merchant dispute response attempted on a dispute whose amount_cents is below the response minimum"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced offer, statement, settlement, dispute, complaint or acceptance does not exist"

  - id: ERR_MERCHANT_NOT_FOUND
    http: 404
    condition: "Referenced merchant does not exist"

  - id: ERR_NO_RISK_STATE
    http: 409
    condition: "Resolution redirects dispute liability onto a merchant with no MerchantRiskState row"

  - id: ERR_POOL_INSUFFICIENT_RESERVE
    http: 402
    condition: "Offer acceptance would consume a redemption pool that does not exist or whose balance cannot cover the approved backing"

  - id: ERR_PRIVACY_VIOLATION
    http: 403
    condition: "Member-spend data would be shared before MERCHANT_CONSENT, or the audience size is below the privacy quorum"

  - id: ERR_MERCHANT_RISK_SUPPRESSED
    http: 409
    condition: "Merchant has crossed the unresolved chargeback-count ceiling or the chargeback-ratio ceiling"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in the state required for the requested transition"

  - id: ERR_SUPPRESS_ALREADY_TERMINAL
    http: 409
    condition: "Suppression attempted on a merchant already in the terminal SUPPRESSED state"

  - id: ERR_BATCH_SEQ_NOT_MONOTONE
    http: 409
    condition: "Funding batch finalize requested at a batch sequence at or below the highest already-finalized sequence for the merchant"

  - id: ERR_COMPLAINT_ALREADY_ENROLLED
    http: 409
    condition: "Complaint uphold attempted against a merchant already enrolled as PROSPECT"

  - id: ERR_TEMPORAL_OVERLAP
    http: 409
    condition: "A requested live window comes within the one-day clearance buffer of an existing live window funded by the same merchant"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "Occ optimistic-concurrency version supplied in the request is stale versus the parent's current version"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, unknown field, missing required field, or an enum/range constraint violation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAcquirer
    description: "Network acquiring/program operator: onboards merchants, sets discount rates, records declined attempts, runs acceptance-gap rollups and sweep generations"
    identity: opaque
    exclusive_operations:
      - "POST /network/industry-categories"
      - "POST /network/merchants"
      - "POST /network/merchants/{merchant_id}/accept"
      - "POST /network/merchants/{merchant_id}/activate"
      - "POST /network/merchants/{merchant_id}/mark-dormant"
      - "POST /network/merchants/{merchant_id}/declined-attempts"
      - "POST /network/acceptance-gaps/rollup"
      - "POST /network/_sweep-index/stamp"
    shared_operations:
      - "GET /network/merchants"
      - "GET /network/merchants/{merchant_id}"
      - "GET /network/merchants/{merchant_id}/risk-state"
      - "GET /network/merchant-risk-states"
      - "GET /network/merchants/{merchant_id}/settlements"

  - name: NetworkSettlementOps
    description: "Funding and settlement operator: captures settlements, finalizes funding batches, reverses postings, reinstates settlements"
    identity: opaque
    exclusive_operations:
      - "POST /network/merchants/{merchant_id}/settlements"
      - "POST /network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize"
      - "POST /network/settlements/{settlement_id}/posting-reversal"
      - "POST /network/settlements/{settlement_id}/reinstate"
    shared_operations:
      - "GET /network/settlements/{settlement_id}"
      - "GET /network/settlements"
      - "GET /network/merchants/{merchant_id}/settlements"

  - name: NetworkCompliance
    description: "Risk and compliance officer: suppresses merchants and reads rolling risk state; distinct from the operator who onboards them"
    identity: opaque
    exclusive_operations:
      - "POST /network/merchants/{merchant_id}/suppress"
    shared_operations:
      - "GET /network/merchants"
      - "GET /network/merchants/{merchant_id}"
      - "GET /network/merchants/{merchant_id}/risk-state"
      - "GET /network/merchant-risk-states"

  - name: NetworkDataSteward
    description: "Spend-insight data steward: authors offers, governs the privacy state machine, administers redemption pools and payouts"
    identity: opaque
    exclusive_operations:
      - "POST /network/offers"
      - "POST /network/offers/{offer_id}/submit-review"
      - "POST /network/offers/{offer_id}/request-consent"
      - "POST /network/offers/{offer_id}/return-to-draft"
      - "POST /network/offers/{offer_id}/suspend"
      - "POST /network/offers/{offer_id}/redemption-pool"
      - "POST /network/offers/{offer_id}/redemption-pool/topup"
      - "POST /network/offer-acceptances/{acceptance_id}/approve"
      - "POST /network/offer-acceptances/{acceptance_id}/pay"
      - "POST /network/offer-acceptances/{acceptance_id}/reverse"
    shared_operations:
      - "GET /network/offers"
      - "GET /network/offers/{offer_id}"
      - "GET /network/offers/{offer_id}/acceptances"
      - "GET /network/offer-acceptances"
      - "GET /network/offer-acceptances/{acceptance_id}"
      - "GET /network/offers/{offer_id}/redemption-pool"
      - "GET /network/redemption-pools"

  - name: NetworkDisputeOps
    description: "Closed-loop dispute operator: adjudicates disputes where the network holds both the issuer and the acquirer role"
    identity: opaque
    exclusive_operations:
      - "POST /network/disputes/{dispute_id}/resolve"
    shared_operations:
      - "GET /network/disputes"
      - "GET /network/disputes/{dispute_id}"

  - name: NetworkService
    description: "Acceptance service desk: files, takes up, upholds, dismisses and reopens acceptance complaints"
    identity: opaque
    exclusive_operations:
      - "POST /network/complaints/{complaint_id}/take-up"
      - "POST /network/complaints/{complaint_id}/uphold"
      - "POST /network/complaints/{complaint_id}/dismiss"
      - "POST /network/complaints/{complaint_id}/reopen"
      - "GET /network/complaints"
      - "GET /network/complaints/{complaint_id}"
    shared_operations:
      - "POST /network/complaints"

  - name: NetworkIssuer
    description: "Card-issuing side: registers members, sets spend figures, assesses premium fees, funds the value ledger, and owns the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /network/cardmembers"
      - "POST /network/cardmembers/{cardmember_id}/activate"
      - "POST /network/cardmembers/{cardmember_id}/set-monthly-spend"
      - "POST /network/cardmembers/{cardmember_id}/grant-lounge-access"
      - "POST /network/cardmembers/{cardmember_id}/mark-delinquent"
      - "POST /network/cardmembers/{cardmember_id}/close"
