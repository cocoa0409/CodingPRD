              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
          trigger:
            - call: "POST /dtc/state-permits/${p_tx_id}/revoke"
              payload: { revocation_reason: "License revoked by the state board" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "stage 1 does not compensate: after the revoke Order.${o_id}.compliance_status == \"SUSPENDED_PERMIT\", excise_reversed_cents == 0 and GET /dtc/volume-ledger-entries?order_id=${o_id} still returns exactly one row (+4.500)"
            - "stage 1 leaves the money accrued: Winery.${w_id}.excise_accrued_cents == 211 and excise_reversed_cents == 0"
            - "stage 2 rejects, because the only permit for TX is now REVOKED: Order.${o_id}.compliance_status == \"REJECTED\" and rejection_error_id == \"ERR_PERMIT_MISSING_FOR_STATE\" (priority 60, not 62)"
            - "stage 2 compensates the money: Order.${o_id}.excise_reversed_cents == 211 and Order.${o_id}.sales_tax_reversed_cents == 2284"
            - "the winery invariant holds: Winery.${w_id}.excise_accrued_cents == 211 and Winery.${w_id}.excise_reversed_cents == 211, so accrued - reversed == 0 with the gross accrual still visible"
            - "stage 2 compensates the liters: GET /dtc/volume-ledger-entries?order_id=${o_id} returns exactly two rows summing to 0.000, the second being RETURN_CREDIT -4.500"
            - "GET /dtc/consumers/${c_id}/volume-summary?state_code=TX reports rolling liters 0.000, and Consumer.${c_id}.return_credit_count == 0 \u2014 a rejection is not a carrier return"
            - "no drift: Order.${o_id}.total_cents is still 30185 and Order.${o_id}.excise_tax_cents is still 211 \u2014 reversal is recorded in the reversal fields, never by editing the charge"
