scaffold_corner_design:
  - section: entities
    instances:
      - name: unit_creation_returns_201_with_server_minted_uuid
        claim_type: creation
        grounds:
          - entities.Unit
          - entities.Unit.fields.id
          - entities.Unit.fields.oversight_level
        distinguishing_aspect: |
          A successfully created Unit carries a server-minted UUID id (no type prefix), a version of
          1 and an oversight_level derived from the parent chain, none of which the client supplied.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { new_unit: "$.data.id", new_v: "$.data.version", new_oversight: "$.data.oversight_level" }
          assert:
            - "response status is 201"
            - "Unit.${new_unit}.id matches the UUID pattern ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            - "Unit.${new_unit}.version == 1"
            - "Unit.${new_unit}.unit_type == CORPS and canteen_pool_size == 4"

      - name: campaign_missing_required_goal_cents_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Campaign.fields.goal_cents
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Omitting the required goal_cents input yields ERR_INVALID_REQUEST at 400 and persists no
          Campaign row, while supplying it succeeds — so the required-field check is enforced rather
          than defaulted.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campaigns"
              payload: { name: "Incomplete Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z" }
              as: PlatformAdmin
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with http status 400"
            - "no Campaign row exists after the rejected create"

      - name: campaign_creation_defaults_status_to_planning
        claim_type: defaults
        grounds:
          - entities.Campaign.fields.status
          - state_machines.Campaign.initial_state
          - entities.Campaign.fields.total_raised_cents
        distinguishing_aspect: |
          A Campaign created without status, labor_budget_cents or total_raised_cents receives the
          declared defaults PLANNING, 0 and 0 rather than null.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { camp: "$.data.id", camp_status: "$.data.status", camp_budget: "$.data.labor_budget_cents", camp_total: "$.data.total_raised_cents" }
          assert:
            - "Campaign.${camp}.status == PLANNING"
            - "Campaign.${camp}.labor_budget_cents == 0"
            - "Campaign.${camp}.total_raised_cents == 0"
            - "Campaign.${camp}.active_location_count == 0"

      - name: campaign_status_input_ignored_on_create
        claim_type: system_fields
        grounds:
          - entities.Campaign.fields.status
          - entities.Campaign.fields.total_raised_cents
          - state_machines.Campaign.PLANNING_to_ACTIVE
        distinguishing_aspect: |
          A client-supplied status of ACTIVE and a client-supplied total_raised_cents of 999999 are
          both ignored on create: the row still starts PLANNING with total 0, so system and computed
          fields cannot be seeded through the create payload.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campaigns"
              payload: { name: "Seeded Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, status: "ACTIVE", total_raised_cents: 999999 }
              as: PlatformAdmin
              captures: { camp2: "$.data.id", camp2_status: "$.data.status", camp2_total: "$.data.total_raised_cents" }
          assert:
            - "Campaign.${camp2}.status == PLANNING, not ACTIVE"
            - "Campaign.${camp2}.total_raised_cents == 0, not 999999"
            - "the response echoes the server-assigned values, not the submitted ones"

      - name: kettle_location_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          A GET against a syntactically valid but non-existent kettle location UUID returns
          ERR_RESOURCE_NOT_FOUND at 404 rather than an empty object or a 500.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/kettle-locations/2f8c1a44-9b30-4d61-8f0a-77c1d5e0a9b3"
              as: KettleCoordinator
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND with http status 404"
            - "response_type == error"

      - name: host_site_listing_supports_filter_and_pagination
        claim_type: listing
        grounds:
          - endpoints.GET /api/host-sites
          - response_envelope.pagination_fields
          - entities.HostSite.fields.permission_status
        distinguishing_aspect: |
          The host site list honours limit=1 over two matching rows, returning exactly one element
          with total_count 2 and has_more true, and the permission_status filter narrows the set.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one campaign with two host sites, one APPROVED and one PENDING"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_a: "$.data.id", host_a_v: "$.data.version" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Riverside Pharmacy", store_number: "208", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_b: "$.data.id" }
            - call: "POST /api/host-sites/${host_a}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_a_v}" }
              as: KettleCoordinator
          trigger:
            - call: "GET /api/host-sites"
              payload: { campaign_id: "${campaign_id}", limit: 1, offset: 0 }
              as: KettleCoordinator
              captures: { first_id: "$.data[0].id", total: "$.meta.total_count", more: "$.meta.has_more" }
            - call: "GET /api/host-sites"
              payload: { campaign_id: "${campaign_id}", permission_status: "APPROVED", limit: 10, offset: 0 }
              as: KettleCoordinator
              captures: { approved_total: "$.meta.total_count" }
          assert:
            - "the limit=1 page contains exactly 1 element and meta.total_count == 2"
            - "meta.has_more == true for the limit=1 page"
            - "the permission_status=APPROVED filter returns meta.total_count == 1"
            - "response_type == array for both calls"

      - name: bell_ringer_invalid_ringer_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.BellRinger.fields.ringer_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A ringer_type outside {VOLUNTEER, PAID_SEASONAL} is rejected with ERR_INVALID_REQUEST at
          400 and creates no BellRinger row, while the two declared enum members are accepted.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one CORPS unit"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
          trigger:
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Ada Kim", email: "ada.kim@example.org", ringer_type: "CONTRACTOR", corps_id: "${unit_id}", date_of_birth: "1991-03-14T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with http status 400"
            - "no BellRinger row exists with email ada.kim@example.org"

      - name: host_site_create_with_unknown_campaign_returns_reference_not_found
        claim_type: parent_relationships
        grounds:
          - entities.HostSite.fields.campaign_id
          - validations[priority=8]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: |
          A host site whose campaign_id names no existing Campaign is rejected with
          ERR_REFERENCE_NOT_FOUND at 404, proving the foreign key is resolved rather than stored
          blindly.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-11-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/host-sites"
              payload: { campaign_id: "3c9b7e21-5d44-4a08-9f13-0b6a2e8d7c55", retailer_name: "Ghost Market", store_number: "001", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 1 }
              as: KettleCoordinator
              captures: { err_ref: "$.data.error_id" }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND with http status 404"
            - "no HostSite row exists with retailer_name Ghost Market"

  - section: state_machines
    instances:
      - name: campaign_activate_without_approved_host_site_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.PLANNING_to_ACTIVE
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=10]
        distinguishing_aspect: |
          Activating a PLANNING campaign that has no APPROVED host site is rejected with
          ERR_INVALID_STATE_TRANSITION and leaves the campaign PLANNING, proving the guarded
          precondition rather than a bare state check.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one PLANNING campaign and one PENDING host site"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { camp: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${camp}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id" }
          trigger:
            - call: "POST /api/campaigns/${camp}/activate"
              payload: { expected_campaign_version: "${camp_v}" }
              as: TerritorialCommander
              captures: { err_guard: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with http status 409"
            - "Campaign.${camp}.status == PLANNING after the rejected activation"

      - name: campaign_activate_requires_ends_on_after_logical_clock
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.PLANNING_to_ACTIVE
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          A second precondition on the same transition fails independently: with an APPROVED host
          site present but ends_on already in the past relative to the logical clock, activation is
          still rejected, isolating the clock guard from the host-site guard.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one PLANNING campaign whose ends_on is 2026-10-01T00:00:00Z, with one APPROVED host site"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campaigns"
              payload: { name: "Expired Window Campaign", season_year: 2026, starts_on: "2026-09-01T00:00:00Z", ends_on: "2026-10-01T00:00:00Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { camp: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${camp}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-09-01T00:00:00Z", permission_ends_on: "2026-10-01T00:00:00Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
          trigger:
            - call: "POST /api/campaigns/${camp}/activate"
              payload: { expected_campaign_version: "${camp_v}" }
              as: TerritorialCommander
              captures: { err_clock: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with http status 409"
            - "Campaign.${camp}.status == PLANNING despite the APPROVED host site"

      - name: shift_create_rejected_when_screening_not_cleared
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - state_machines.BellRinger.screening_status_NOT_STARTED_to_PENDING
          - errors[ERR_SCREENING_NOT_CLEARED]
        distinguishing_aspect: |
          A shift for a ringer whose screening_status is NOT_STARTED is rejected with
          ERR_SCREENING_NOT_CLEARED even though the location is ACTIVE and the ringer is ACTIVE, so
          the screening dimension gates scheduling independently of engagement.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with an ACTIVE kettle location and a NOT_STARTED, ACTIVE ringer"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Ada Kim", email: "ada.kim@example.org", ringer_type: "VOLUNTEER", corps_id: "${unit_id}", date_of_birth: "1991-03-14T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
              captures: { ringer_id: "$.data.id" }
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { lv1: "$.data.version" }
          trigger:
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${ringer_id}", starts_at: "2026-11-20T09:00:00Z", ends_at: "2026-11-20T17:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${lv1}" }
              as: VolunteerCoordinator
              captures: { err_screen: "$.data.error_id" }
          assert:
            - "response error_id == ERR_SCREENING_NOT_CLEARED with http status 409"
            - "BellRinger.${ringer_id}.screening_status == NOT_STARTED"
            - "no Shift row exists for the ringer"

      - name: shift_complete_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Shift.CHECKED_IN_to_COMPLETED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Completing a shift that is still SCHEDULED (never checked in) is rejected with
          ERR_INVALID_STATE_TRANSITION, so CHECKED_IN is a genuine intermediate state and not an
          alias for SCHEDULED.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one SCHEDULED shift"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Priya Raman", email: "priya.raman@example.org", ringer_type: "VOLUNTEER", corps_id: "${unit_id}", date_of_birth: "1985-09-30T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
              captures: { ringer_id: "$.data.id" }
            - call: "POST /api/bell-ringers/${ringer_id}/screenings"
              payload: { vendor: "SafeGuard Screening", package_level: "STANDARD" }
              as: VolunteerCoordinator
            - call: "POST /api/bell-ringers/${ringer_id}/screenings/complete"
              payload: { result: "CLEAR", completed_at: "2026-11-10T00:00:00Z" }
              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { lv1: "$.data.version" }
            - call: "POST /api/shifts"
