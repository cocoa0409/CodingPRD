        excluded_because:
          difficulty_instance: admission_capture_adequacy_retrospective_vs_prospective_divergence
          rationale: "That §1.8 instance reads the capture-summary endpoint and asserts both adequacy variants plus the yield terms against pre-computed literals."

  - section: errors
    instances:
      - name: unauthenticated_read_is_rejected_with_401
        claim_type: Violation → Error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A read with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED from priority 1, ahead of the 403 role check and ahead of the 404 existence check — even though the unit id in the path does exist."
        test_recipe:
          setup:
            - "One MonitoringUnit exists."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Err Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /neurodiagnostics/units/${unit_id}"
              payload: {}
              as: none
          assert:
            - "HTTP status 401 and error_id == ERR_UNAUTHENTICATED"
            - "no ERR_ROLE_NOT_PERMITTED and no ERR_UNIT_NOT_FOUND is returned"

      - name: unknown_study_id_on_read_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations.priority_4
          - errors.ERR_STUDY_NOT_FOUND
          - endpoints.GET_/neurodiagnostics/studies/{id}
