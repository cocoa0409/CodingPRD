scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: retention_destruction_purpose_limited_vs_schedule_only_divergence
        grounds:
          - calculations.effective_retention_and_destruction
          - entities.BiometricAsset.fields.retention_basis
          - entities.BiometricAsset.fields.destruction_due_at
          - entities.BiometricPolicy.fields.destruction_trigger
          - state_machines.BiometricAsset.CLASSIFIED_to_ACTIVE
        distinguishing_aspect: |
          This dual-variant lives on the BiometricAsset retention domain: two assets under the
          identical PURPOSE_SATISFIED_OR_MAX policy, identical collection_started_at and identical
          purpose_satisfied_at resolve to different destruction_due_at instants (2026-08-27 vs
          2026-09-14) purely because one carries retention_basis PURPOSE_LIMITED and the other
          SCHEDULE_ONLY.
        test_recipe:
          setup:
            - "One ComplianceProgram with a single Jurisdiction IL (retention_max_days 1095, notice_lead_days 14)."
            - "One BiometricPolicy v1.0 in PUBLISHED status with retention_days 30 and destruction_trigger PURPOSE_SATISFIED_OR_MAX, scoped to IL."
            - "One PUBLISHED NoticePacket for (IL, EMPLOYEE) covering locales en and es."
            - "Two BiometricAsset rows, both ACTIVE with collection_started_at 2026-08-15T00:00:00.000Z, one with retention_basis PURPOSE_LIMITED and one with retention_basis SCHEDULE_ONLY; neither has purpose_satisfied_at set yet, so both currently show destruction_due_at 2026-09-14T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "PURPOSE_SATISFIED_OR_MAX", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "PURPOSE_LIMITED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_pl_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "ACCESS_CONTROL", modality: "HAND_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "door-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_so_id: $.data.id }
            - call: "POST /biometric-assets/${asset_pl_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_so_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /biometric-assets/${asset_pl_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_so_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          trigger:
            - call: "PATCH /biometric-assets/${asset_pl_id}"
              payload: { purpose_satisfied_at: "2026-08-20T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "PATCH /biometric-assets/${asset_so_id}"
              payload: { purpose_satisfied_at: "2026-08-20T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "BiometricAsset.${asset_pl_id}.collection_started_at == 2026-08-15T00:00:00.000Z"
            - "BiometricAsset.${asset_pl_id}.destruction_due_at == 2026-08-27T00:00:00.000Z"
            - "BiometricAsset.${asset_so_id}.destruction_due_at == 2026-09-14T00:00:00.000Z"
            - "BiometricAsset.${asset_pl_id}.destruction_due_at != BiometricAsset.${asset_so_id}.destruction_due_at"
            - "BiometricAsset.${asset_pl_id}.pinned_policy_id == ${pol1_id} and BiometricAsset.${asset_so_id}.pinned_policy_id == ${pol1_id}"

      - name: pra_exposure_stacked_vs_subject_capped_divergence
        grounds:
          - calculations.pra_exposure_estimate
          - entities.ExposureAssessment.fields.variant
          - entities.ExposureAssessment.fields.base_cents
          - entities.ExposureAssessment.fields.exposure_cents
          - concurrency_rules[exposure-assessment-create-stale-jurisdiction]
        distinguishing_aspect: |
          This dual-variant lives on the ExposureAssessment litigation-exposure domain — a different
          entity and a different metric from the retention dual-variant — where the same three
          ConsentRecord violation rows price at 875000 cents under PER_VIOLATION_STACKED and 500000
          cents under PER_SUBJECT_CAPPED because the 300000-cent per-subject ceiling clips subject
          EMP-0001's 600000-cent stacked base.
        test_recipe:
          setup:
            - "One ComplianceProgram (exposure_ceiling_cents 1093750) with Jurisdiction IL: FULL private right of action, STATUTORY_PER_VIOLATION, per_violation_negligent_cents 100000, per_violation_reckless_cents 500000, cure_period_days 0, statutory_cap_cents null."
            - "One PUBLISHED BiometricPolicy scoped to IL and one PUBLISHED NoticePacket for (IL, EMPLOYEE); one in-house BiometricAsset in ACTIVE status."
            - "DataSubject EMP-0001 holds one REVOKED ConsentRecord (with only a REQUESTED auto accommodation, so it scores as a reckless unit) plus one fresh SOLICITED record; DataSubject EMP-0002 holds one SOLICITED record. The asset therefore has consent_gap_count 2, which arms the 1.25 notice-gap multiplier."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0002", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s2_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en", written_release_acknowledged: true, signature_ref: "sig-emp1-r1" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "GRANTED" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "REVOKED", revocation_reason: "employee withdrew consent" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c2_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s2_id}", asset_id: "${asset_id}", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c3_id: $.data.id }
            - call: "GET /jurisdictions/${il_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { il_v1: $.data.version }
          trigger:
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_VIOLATION_STACKED", expected_jurisdiction_version: "${il_v1}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { ea_stacked_id: $.data.id }
            - call: "GET /jurisdictions/${il_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { il_v2: $.data.version }
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_SUBJECT_CAPPED", expected_jurisdiction_version: "${il_v2}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { ea_capped_id: $.data.id }
          assert:
            - "ExposureAssessment.${ea_stacked_id}.negligent_unit_count == 2 and ExposureAssessment.${ea_stacked_id}.reckless_unit_count == 1"
            - "ExposureAssessment.${ea_stacked_id}.base_cents == 700000"
            - "ExposureAssessment.${ea_stacked_id}.notice_gap_multiplier == 1.25 and ExposureAssessment.${ea_stacked_id}.cure_credit_pct == 0.00"
            - "ExposureAssessment.${ea_stacked_id}.exposure_cents == 875000"
            - "ExposureAssessment.${ea_capped_id}.base_cents == 400000"
            - "ExposureAssessment.${ea_capped_id}.exposure_cents == 500000"
            - "ExposureAssessment.${ea_stacked_id}.exposure_cents - ExposureAssessment.${ea_capped_id}.exposure_cents == 375000"

  - rule_id: combinatorial_formula
    instances:
      - name: contract_score_rounds_per_clause_then_sums_yielding_85_51
        grounds:
          - calculations.vendor_contract_compliance_score
          - entities.VendorContract.fields.compliance_score
          - entities.Vendor.fields.attestation_status
          - endpoints["POST /vendors/{vendor_id}/attestations"]
        distinguishing_aspect: |
          This is §0.5 mode (b) — nested rounding where the order changes the cents: at attestation
          factor 0.855 the four clause products round to 29.93 + 21.38 + 25.65 + 8.55 = 85.51,
          whereas summing the raw products first and rounding once yields 85.50; the scaffold pins
          per-clause rounding, so 85.51 is the only correct answer.
        test_recipe:
          setup:
            - "One ComplianceProgram and one Vendor ClockPoint Systems with sells_biometric_data false, subprocessor_count 0, subprocessor_disclosure_complete true, deletion_sla_days 15, attestation_status NOT_REQUESTED."
            - "One DRAFT VendorContract for that vendor with all three clauses true and deletion_deadline_days 30 (so all four weighted clauses earn), whose compliance_score currently reads 71.51 at the NOT_REQUESTED factor 0.715."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
          trigger:
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "Vendor.${v1_id}.attestation_status == REQUESTED"
            - "Vendor.${v1_id}.risk_score == 30"
            - "VendorContract.${k1_id}.compliance_score == 85.51"
            - "VendorContract.${k1_id}.compliance_score != 85.50"
            - "VendorContract.${k1_id}.status == DRAFT"

      - name: incident_cost_pins_surcharge_on_gross_and_floors_the_credit
        grounds:
          - calculations.incident_notification_deadline_and_cost
          - entities.IncidentCase.fields.gross_notice_cents
          - entities.IncidentCase.fields.regulator_surcharge_cents
          - entities.IncidentCase.fields.vendor_indemnity_credit_cents
          - entities.IncidentCase.fields.net_incident_cost_cents
          - state_machines.IncidentCase.PENDING_to_ASSESSED
        distinguishing_aspect: |
          This is §0.5 mode (c) — a circular-looking dependency resolved by a pinned evaluation
          order: the surcharge is keyed on the PRE-credit gross while the credit ceiling is half of
          the PRE-surcharge gross and is TRUNCATED, so gross 49125 yields credit 24562 and net
          24563; keying the credit on gross+surcharge or rounding 24562.5 half-up instead of
          flooring it yields 24563/24562 and a different net.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy scoped to IL and a PUBLISHED (IL, EMPLOYEE) notice."
            - "Vendor GateKeeper Bio with sells_biometric_data true, subprocessor_count 4, deletion_sla_days 30, subprocessor_disclosure_complete true, attestation_status RECEIVED (risk_score 70), holding one EXECUTED VendorContract with compliance_score 82.50 and indemnity_cap_cents 5000000."
            - "One ACTIVE BiometricAsset with modality FINGERPRINT operated by that vendor; the logical clock reads 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "GateKeeper Bio", sells_biometric_data: true, subprocessor_count: 4, deletion_sla_days: 30, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v2_id: $.data.id }
            - call: "POST /vendors/${v2_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendors/${v2_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v2_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k2_id: $.data.id }
            - call: "POST /vendor-contracts/${k2_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /vendor-contracts/${k2_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY", vendor_id: "${v2_id}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /incidents"
              payload: { program_id: "${prog_id}", affected_asset_ids: ["${asset_id}"], exposure_vector: "MISCONFIGURED_EXPORT", description: "Template export bucket left world-readable for six hours.", exposed_subject_count: 45, translation_locale_count: 2 }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/notification-transitions"
              payload: { to_status: "ASSESSED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "IncidentCase.${inc_id}.discovered_at == 2026-09-01T00:00:00.000Z"
            - "IncidentCase.${inc_id}.heightened_tier == TIER_2"
            - "IncidentCase.${inc_id}.notification_due_at == 2026-10-16T00:00:00.000Z"
            - "IncidentCase.${inc_id}.gross_notice_cents == 49125"
            - "IncidentCase.${inc_id}.regulator_surcharge_cents == 0"
            - "IncidentCase.${inc_id}.vendor_indemnity_credit_cents == 24562"
            - "IncidentCase.${inc_id}.net_incident_cost_cents == 24563"
            - "IncidentCase.${inc_id}.notification_status == ASSESSED and IncidentCase.${inc_id}.containment_status == DETECTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: policy_review_kickback_cycle_increments_revision_count_and_restamps_submitter
        grounds:
          - state_machines.BiometricPolicy.DRAFT_to_IN_REVIEW
          - state_machines.BiometricPolicy.IN_REVIEW_to_DRAFT
          - state_machines.BiometricPolicy.IN_REVIEW_to_PUBLISHED
          - entities.BiometricPolicy.fields.revision_count
          - entities.BiometricPolicy.fields.submitted_by_user_id
        distinguishing_aspect: |
          BiometricPolicy is non-linear by virtue of the IN_REVIEW -> DRAFT cycle edge: the same row
          traverses DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> PUBLISHED, ending with
          revision_count 1 and submitted_by_user_id re-stamped to the second submitter po-2, which
          a forward-only pipeline could never produce.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and one DRAFT BiometricPolicy v1.0 (retention_days 30 <= IL retention_max_days 1095, release_language_included true because IL requires a written release)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "PURPOSE_SATISFIED_OR_MAX", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
          trigger:
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "DRAFT" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-2"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
          assert:
            - "BiometricPolicy.${pol1_id}.revision_count == 1"
            - "BiometricPolicy.${pol1_id}.submitted_by_user_id == po-2"
            - "BiometricPolicy.${pol1_id}.published_by_user_id == ca-1"
            - "BiometricPolicy.${pol1_id}.status == PUBLISHED"
            - "BiometricPolicy.${pol1_id}.published_at == 2026-08-01T00:00:00.000Z"

      - name: incident_containment_and_notification_dimensions_advance_independently
        grounds:
          - state_machines.IncidentCase.DETECTED_to_CONTAINED
          - state_machines.IncidentCase.PENDING_to_ASSESSED
          - state_machines.IncidentCase.CONTAINED_to_REMEDIATED
          - entities.IncidentCase.fields.containment_status
          - entities.IncidentCase.fields.notification_status
          - errors[ERR_NOTIFICATION_OUTSTANDING]
        distinguishing_aspect: |
          IncidentCase is non-linear by virtue of two parallel state dimensions on one row:
          containment_status advances DETECTED -> CONTAINED while notification_status is still
          PENDING, and notification_status advances PENDING -> ASSESSED without touching
          containment_status, yet the join edge CONTAINED -> REMEDIATED is refused with
          ERR_NOTIFICATION_OUTSTANDING until the notification dimension is resolved. This is a
          different entity from the BiometricPolicy cycle instance.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy, a PUBLISHED (IL, EMPLOYEE) notice and one in-house BiometricAsset in ACTIVE status."
            - "One IncidentCase in containment_status DETECTED and notification_status PENDING, discovered at 2026-09-01T00:00:00.000Z, exposed_subject_count 12, translation_locale_count 0."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /incidents"
              payload: { program_id: "${prog_id}", affected_asset_ids: ["${asset_id}"], exposure_vector: "INSIDER_MISUSE", description: "Contractor exported hand-geometry templates to personal storage.", exposed_subject_count: 12, translation_locale_count: 0 }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/containment-transitions"
              payload: { to_status: "CONTAINED", containment_note: "Export path revoked and credentials rotated." }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /incidents/${inc_id}/notification-transitions"
              payload: { to_status: "ASSESSED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /incidents/${inc_id}/containment-transitions"
              payload: { to_status: "REMEDIATED", containment_note: "Rebuilt the export pipeline." }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "The first trigger call returns 200 with IncidentCase.${inc_id}.containment_status == CONTAINED while IncidentCase.${inc_id}.notification_status is still PENDING"
            - "The second trigger call returns 200 with IncidentCase.${inc_id}.notification_status == ASSESSED and IncidentCase.${inc_id}.containment_status unchanged at CONTAINED"
            - "IncidentCase.${inc_id}.heightened_tier == TIER_2 and IncidentCase.${inc_id}.notification_due_at == 2026-10-16T00:00:00.000Z"
            - "IncidentCase.${inc_id}.gross_notice_cents == 5100 and IncidentCase.${inc_id}.regulator_surcharge_cents == 0 and IncidentCase.${inc_id}.net_incident_cost_cents == 5100"
            - "The third trigger call returns 409 with error_id ERR_NOTIFICATION_OUTSTANDING and IncidentCase.${inc_id}.containment_status remains CONTAINED"

  - rule_id: transitive_cascade
    instances:
      - name: contract_termination_gates_asset_expires_consent_spawns_accommodation_restricts_program
        grounds:
          - state_machines.VendorContract.EXECUTED_to_TERMINATED
          - state_machines.BiometricAsset.ACTIVE_to_GATED
          - state_machines.ConsentRecord.GRANTED_to_EXPIRED
          - entities.AlternativeAccommodation.fields.origin
          - calculations.program_posture
        distinguishing_aspect: |
          CASCADE A is the vendor-exit chain and runs five hops deep: TERMINATED contract (hop 1)
          -> ACTIVE asset GATED (hop 2, because its operator lost its contract) -> GRANTED consent
          EXPIRED (hop 3, because the collection point was gated) -> AUTO_CONSENT_EXPIRY
          accommodation created (hop 4, because the employee lost a lawful basis) -> program posture
          RESTRICTED (hop 5, because a gated asset and a consent gap now exist). Each link is caused
          by the immediately preceding one; assets and consents are processed in created_at ASC.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy v1.0 (retention_days 30) and a PUBLISHED (IL, EMPLOYEE) notice published at 2026-08-01T00:00:00.000Z, so consent_eligible_from is 2026-08-15T00:00:00.000Z."
            - "Vendor ClockPoint Systems with attestation_status RECEIVED (risk_score 20) holding one EXECUTED VendorContract with compliance_score 100.00 and deletion_deadline_days 30."
            - "One vendor-operated BiometricAsset (TIMEKEEPING/FINGERPRINT/EMPLOYEE) in ACTIVE status with collection_started_at 2026-08-15T00:00:00.000Z, and one DataSubject EMP-0001 holding a GRANTED ConsentRecord on it; program posture is OPEN and gated_asset_count is 0."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 30, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY", vendor_id: "${v1_id}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en", written_release_acknowledged: true, signature_ref: "sig-emp1-r1" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "GRANTED" }
              as: HRAdministrator
              as_user_id: "hr-1"
          trigger:
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "TERMINATED" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "hop 1: VendorContract.${k1_id}.status == TERMINATED, terminated_at == 2026-08-15T00:00:00.000Z, deletion_deadline_at == 2026-09-14T00:00:00.000Z"
            - "hop 2: BiometricAsset.${asset_id}.status == GATED and its collection_started_at is unchanged at 2026-08-15T00:00:00.000Z"
            - "hop 3: ConsentRecord.${c1_id}.status == EXPIRED and BiometricAsset.${asset_id}.enrolled_subject_count == 0"
            - "hop 4: GET /accommodations?data_subject_id=${s1_id} returns exactly one row with origin == AUTO_CONSENT_EXPIRY, status == REQUESTED, created_from_consent_id == ${c1_id}, method == MANUAL_TIMESHEET and sla_due_at == 2026-08-20T00:00:00.000Z"
            - "hop 5: ComplianceProgram.${prog_id}.posture == RESTRICTED with gated_asset_count == 1, consent_gap_count == 1 and open_deletion_obligation_count == 1"

      - name: policy_publication_supersedes_resolicits_consents_then_gates_and_repins_assets
        grounds:
          - state_machines.BiometricPolicy.IN_REVIEW_to_PUBLISHED
          - state_machines.BiometricPolicy.PUBLISHED_to_SUPERSEDED
          - state_machines.ConsentRecord.GRANTED_to_RESOLICIT_REQUIRED
          - entities.BiometricAsset.fields.pinned_policy_id
          - calculations.effective_retention_and_destruction
        distinguishing_aspect: |
          CASCADE B is the re-publication chain — a different root endpoint, a different root entity
          and a different terminal effect from CASCADE A — running four hops: v2.0 PUBLISHED
          supersedes v1.0 (hop 1) -> consents pinned to v1.0 go GRANTED -> RESOLICIT_REQUIRED
          (hop 2) -> assets pinned to v1.0 go ACTIVE -> GATED and repin to v2.0 (hop 3) -> posture
          becomes RESTRICTED (hop 4). The ordering constraint is observable: hop 2 must complete for
          every consent before any asset repins, otherwise a consent would be re-pinned to v2.0 and
          escape re-solicitation.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy v1.0 (retention_days 30, FIXED_SCHEDULE) and a PUBLISHED (IL, EMPLOYEE) notice."
            - "One in-house BiometricAsset in ACTIVE status pinned to v1.0 with collection_started_at 2026-08-15T00:00:00.000Z and destruction_due_at 2026-09-14T00:00:00.000Z, and one DataSubject EMP-0001 with a GRANTED ConsentRecord pinned to v1.0; program posture OPEN."
            - "A second BiometricPolicy v2.0 with retention_days 60 sitting in IN_REVIEW, submitted by po-1 and scoped to IL."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
