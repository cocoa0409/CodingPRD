          - validations[priority=26]
          - errors[ERR_NO_ORDER_LINES]
        distinguishing_aspect: "The preview shares order_line_pricing with submit yet writes nothing: on an empty order it is the same ERR_NO_ORDER_LINES 422 as submit, and on a lined order it returns the full money breakdown while the order stays DRAFT with total_cents, priced_at and tier_code_applied still null and version unmoved — the identical figures only become persisted state at submit."
