              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/day-plans/${day_id}/close-day"
              payload: { season_final: false }
              as: MountainOpsDirector
          assert:
            - "Triggers 1 and 2: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED', and the day plan stays 'DRAFT' with the season still 'PRESEASON'."
            - "Trigger 3: HTTP 200 - posture 'PUBLISHED_PARTIAL', published_at stamped, and the season moves PRESEASON -> OPERATING on its first publish."
            - "Trigger 4: HTTP 200 - the LiftOpsManager posts wind_speed_mph 18.0 and wet_bulb_f 21.0 successfully; posture stays 'PUBLISHED_PARTIAL' because 18.0 is below the 60.0 hold threshold."
            - "Trigger 5: HTTP 200 - the director posts over it with wind_speed_mph 12.0 and wet_bulb_f 20.0."
            - "Triggers 6 and 7: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'."
            - "Trigger 8: wind_speed_mph == 12.0 and wet_bulb_f == 20.0 - the two refused weather posts left no trace, so the refusal precedes the field write."
            - "Triggers 9 and 10: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - the LiftOpsManager who could post weather to this exact day plan cannot close it."
            - "Trigger 11: HTTP 200 - posture 'DAY_CLOSED', the STANDBY lift moves to 'CLOSED', and the READY area is untouched because only OPEN and PATROL_HOLD areas are swept."

