          The production dimension is non-linear in two distinct ways at once: SLOTTED -> PLANNED is
          a true backward edge that must give the committed-minutes ledger back, and IN_LINE ->
          IN_LINE is a self-loop taken an implementation-defined number of times before the same
          trigger finally leaves for LINE_COMPLETE. A forward-only reading either refuses the
          release or treats the second advance as an illegal repeat.
        test_recipe:
