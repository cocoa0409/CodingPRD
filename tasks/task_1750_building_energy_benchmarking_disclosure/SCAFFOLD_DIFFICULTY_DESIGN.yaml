            - { call: "POST /v1/buildings/${bF}/tenant-units", payload: { unit_label: "F2", floor_area_sqft: 14995, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { uf2: $.data.id } }
            - { call: "POST /v1/buildings/${bF}/tenant-units", payload: { unit_label: "F3", floor_area_sqft: 5005, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${uf1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cgf1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cgf1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${uf1}" }
            - { call: "POST /v1/tenant-units/${uf2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cgf2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cgf2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${uf2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${bF}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { repF: $.data.id } }
          trigger:
            - { call: "POST /v1/benchmark-reports/${repP}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { stP: $.data.status, compP: $.data.data_completeness_pct } }
            - { call: "POST /v1/benchmark-reports/${repF}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { errF: "$.data.error_id" } }
            - { call: "GET /v1/benchmark-reports/${repF}", as: ComplianceOfficer, captures: { compF: $.data.data_completeness_pct, stF: $.data.status } }
          assert:
            - "bP: data_completeness_pct == 90.00 and submit succeeds (status == SUBMITTED) — >= is inclusive"
            - "bF: submit fails with errF == ERR_DATA_COMPLETENESS_BELOW_THRESHOLD (422) and the report stays DRAFT with data_completeness_pct == 89.99 (44995/50000)"

      - name: floor_area_exactly_at_coverage_threshold
        grounds:
          - calculations.coverage_determination
          - entities.ReportingCycle.fields.covered_floor_area_threshold_sqft
          - errors[ERR_BUILDING_NOT_COVERED]
        distinguishing_aspect: |
          Boundary on a different metric (integer sqft) reached via a different
          endpoint (buildings list with covered_in_cycle_id + report create):
          25000 sqft is covered (>= inclusive) while 24999 is not, and a covered
          property-type mismatch (INDUSTRIAL 60000) is excluded independently.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (threshold 25000, covered types exclude INDUSTRIAL)"
            - "bE 25000 sqft OFFICE; bU 24999 sqft OFFICE; bI 60000 sqft INDUSTRIAL"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner M", contact_email: "om@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "16 Main St", gross_floor_area_sqft: 25000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { bE: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "17 Main St", gross_floor_area_sqft: 24999, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { bU: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "18 Main St", gross_floor_area_sqft: 60000, property_type: "INDUSTRIAL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { bI: $.data.id } }
          trigger:
            - { call: "GET /v1/buildings", payload: { covered_in_cycle_id: "${c27}" }, as: ComplianceOfficer, captures: { first_id: "$.data[0].id" } }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${bU}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${bI}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err2: "$.data.error_id" } }
          assert:
            - "covered list contains exactly one building and it is ${bE} (25000 >= 25000 inclusive)"
            - "report create for 24999-sqft building fails: err == ERR_BUILDING_NOT_COVERED (422)"
            - "report create for the INDUSTRIAL building fails the same way: err2 == ERR_BUILDING_NOT_COVERED (property-type arm of coverage)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_creation_requires_cycle_open
        grounds:
          - state_machines.ReportingCycle
          - validations[priority=8]
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair BenchmarkReport x ReportingCycle: a report cannot be
          created while its cycle is SCHEDULED; the same call succeeds unchanged
          once the cycle transitions to OPEN.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 in SCHEDULED (never opened); building b1 50000 sqft OFFICE (covered)"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner N2", contact_email: "on2@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/buildings", payload: { address: "19 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep: $.data.id, st: $.data.status } }
          assert:
            - "while cycle SCHEDULED: err == ERR_CYCLE_NOT_OPEN (409)"
            - "after the cycle transitions to OPEN: identical call returns 201 with status == DRAFT"

      - name: signoff_requires_report_submitted
        grounds:
          - state_machines.VerificationRecord.PENDING_to_SIGNED_OFF
          - state_machines.BenchmarkReport.SUBMITTED_to_FLAGGED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Entity pair VerificationRecord x BenchmarkReport (different pair from
          report-x-cycle): the PENDING record's own state never changes, but
          sign-off is gated on the REPORT being SUBMITTED — an officer anomaly
          drops the report to FLAGGED and sign-off fails; once the report is
          resubmitted, the same record signs off.
        test_recipe:
          setup:
            - "Owner o1; verifier v1; cycle c27 OPEN (standard constants); building b1 50000 sqft OFFICE; units+consents at 90.00 completeness"
            - "Report rep1 SUBMITTED; verification record vr1 PENDING (assigned to v1)"
            - "Officer raises MANUAL_REVIEW anomaly -> rep1 FLAGGED, vr1 still PENDING"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner O", contact_email: "oo@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier O", license_number: "LIC-O" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "20 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { vr1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/anomaly-flags", payload: { detail: "Audit hold on reported consumption" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { af1: $.data.id } }
          trigger:
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/anomaly-flags/${af1}/resolve", payload: { resolution_note: "Consumption confirmed against utility feed" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}", captures: { vr_st: $.data.status } }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { rep_st: $.data.status } }
          assert:
            - "while report FLAGGED: sign-off fails with err == ERR_INVALID_STATE_TRANSITION even though VerificationRecord.${vr1} is still PENDING"
            - "after resolve + resubmit: the same vr1 signs off (vr_st == SIGNED_OFF) and report becomes VERIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: consent_windows_closed_interval_overlap
        grounds:
          - state_machines.ConsentGrant.REQUESTED_to_GRANTED
          - errors[ERR_CONSENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          CLOSED date-interval semantics on TenantUnit: the existing GRANTED
          window [2027-01-01, 2027-12-31] shares the single date 2027-12-31 with
          the candidate [2027-12-31, 2028-06-30], which IS an overlap; the
          adjacent window starting 2028-01-01 is accepted.
        test_recipe:
          setup:
            - "Owner o1; building b1; unit u1 with a GRANTED consent covering [2027-01-01, 2027-12-31]"
            - "Second consent request cg2 exists in REQUESTED"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner P", contact_email: "op@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "21 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
          trigger:
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-12-31", valid_to: "2028-06-30" }, as: TenantRep, as_user_id: "${u1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/consent-grants/${cg2}/deny", payload: {}, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg3: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg3}/grant", payload: { valid_from: "2028-01-01", valid_to: "2028-12-31" }, as: TenantRep, as_user_id: "${u1}", captures: { st3: $.data.status } }
          assert:
            - "sharing the boundary date is an overlap under closed semantics: err == ERR_CONSENT_WINDOW_OVERLAP (409) for [2027-12-31, 2028-06-30] vs [2027-01-01, 2027-12-31]"
            - "adjacent-after window [2028-01-01, 2028-12-31] is accepted: st3 == GRANTED"

      - name: usage_periods_half_open_adjacency
        grounds:
          - errors[ERR_USAGE_PERIOD_OVERLAP]
          - entities.UsageRecord.fields.period_start
          - entities.UsageRecord.fields.period_end
        distinguishing_aspect: |
          HALF-OPEN datetime-interval semantics on UtilityAccount (different
          resource and different geometry from consent windows): a record
          starting exactly at the existing record's period_end shares no time
          and is accepted, while one overlapping by interior days is rejected.
        test_recipe:
          setup:
            - "Owner o1; building b1; ELECTRICITY account acc1; record R1 [2027-01-01T00:00:00Z, 2027-02-01T00:00:00Z) of 100000 kWh ACTIVE"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner Q", contact_email: "oq@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "22 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/utility-accounts", payload: { account_number: "E-1", commodity: "ELECTRICITY" }, as: BuildingOwner, as_user_id: "${o1}", captures: { acc1: $.data.id } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-02-01T00:00:00Z", consumption_value: 100000 }, as: UtilityAgent, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-02-01T00:00:00Z", period_end: "2027-03-01T00:00:00Z", consumption_value: 50000 }, as: UtilityAgent, captures: { r2: $.data.id, r2_kbtu: $.data.kbtu } }
            - { call: "POST /v1/utility-accounts/${acc1}/usage-records", payload: { period_start: "2027-01-15T00:00:00Z", period_end: "2027-02-15T00:00:00Z", consumption_value: 1000 }, as: UtilityAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "back-to-back is NOT an overlap under half-open semantics: R2 created (kbtu 170600)"
            - "interior overlap is rejected: err == ERR_USAGE_PERIOD_OVERLAP (409)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: consent_grant_revoke_restores_consented_area
        grounds:
          - state_machines.ConsentGrant
          - calculations.data_completeness_ratio
        distinguishing_aspect: |
          Conserved quantity: consented floor area (via report
          data_completeness_pct). The forward action (grant u2) paired with its
          compensating action (revoke u2) returns the DRAFT report's
          completeness to exactly its pre-grant value 60.00 with no drift.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (standard constants); building b1 50000 sqft with units 20000/15000/5000 (common 10000)"
            - "Report rep1 DRAFT created BEFORE any consent -> completeness 20.00"
            - "u1 consent granted -> completeness 60.00"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner R", contact_email: "or@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
