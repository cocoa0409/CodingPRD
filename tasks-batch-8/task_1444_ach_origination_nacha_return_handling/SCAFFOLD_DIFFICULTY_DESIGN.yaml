          assert:
            - "Third re-presentment rejected: err == ERR_REPRESENTMENT_EXHAUSTED (http 422)"
            - "AchEntry.${x_id}.representment_count == 2 after the two cycles"
            - "AchEntry.${x_id}.status == CLOSED after close"
            - "ReturnCases of ${x_id}: dispositions == [REPRESENTED, REPRESENTED, FINAL] in creation order"

      - name: originator_watch_suspend_reinstate_cycle
        grounds:
          - state_machines.Originator.ACTIVE_to_WATCH
          - state_machines.Originator.WATCH_to_SUSPENDED
          - state_machines.Originator.SUSPENDED_to_WATCH
          - state_machines.Originator.WATCH_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on Originator (different entity than AchEntry):
          ACTIVE -> WATCH -> SUSPENDED -> WATCH -> ACTIVE via four successive
          risk-case resolutions; REINSTATE is status-dependent (SUSPENDED lands
          on WATCH, WATCH lands on ACTIVE) — a sibling-state-dependent target.
        test_recipe:
          setup:
            - "Originator approved ACTIVE (limit 5000000, discount 0)"
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Eta Partners", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 5000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc1: "$.data.id" }
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc2: "$.data.id" }
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc3: "$.data.id" }
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc4: "$.data.id" }
          trigger:
            - call: "POST /ach/risk-cases/${rc1}/resolve"
              payload: { action: "WATCH" }
              as: OdfiRiskOfficer
            - call: "POST /ach/risk-cases/${rc2}/resolve"
              payload: { action: "SUSPEND" }
              as: OdfiRiskOfficer
            - call: "POST /ach/risk-cases/${rc3}/resolve"
              payload: { action: "REINSTATE" }
              as: OdfiRiskOfficer
            - call: "POST /ach/risk-cases/${rc4}/resolve"
              payload: { action: "REINSTATE" }
              as: OdfiRiskOfficer
          assert:
            - "After rc1: Originator.${org_id}.status == WATCH"
            - "After rc2: Originator.${org_id}.status == SUSPENDED"
            - "After rc3 (REINSTATE from SUSPENDED): Originator.${org_id}.status == WATCH"
            - "After rc4 (REINSTATE from WATCH): Originator.${org_id}.status == ACTIVE"
            - "All four RiskCases: status == RESOLVED with resolution_action recorded"

      - name: risk_case_branching_divergent_side_effects
        grounds:
          - state_machines.RiskCase.OPEN_to_RESOLVED
          - state_machines.Originator.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Branching fork on RiskCase: resolving with SUSPEND mutates the
          originator and cascades to files/entries, while resolving a sibling
          case with DISMISS leaves every other entity untouched — divergent
          side-effect sets per branch on the same transition.
        test_recipe:
          setup:
            - "Originator A ACTIVE with a WAREHOUSED file (1 DEBIT entry 100000); Originator B ACTIVE with a WAREHOUSED file (1 DEBIT entry 100000)"
            - "Each originator has one OPEN MANUAL RiskCase"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Theta A", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { oa_id: "$.data.id", oa_v: "$.data.version" }
            - call: "PATCH /ach/originators/${oa_id}"
              payload: { expected_originator_version: "${oa_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/originators"
              payload: { legal_name: "Theta B", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { ob_id: "$.data.id", ob_v: "$.data.version" }
            - call: "PATCH /ach/originators/${ob_id}"
              payload: { expected_originator_version: "${ob_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${oa_id}"
              captures: { fa_id: "$.data.id", fa_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fa_id}/entries"
              payload:
                expected_file_version: "${fa_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "ta-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${oa_id}"
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${ob_id}"
              captures: { fb_id: "$.data.id", fb_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fb_id}/entries"
              payload:
                expected_file_version: "${fb_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "tb-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${ob_id}"
            - call: "POST /ach/originators/${oa_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rca: "$.data.id" }
            - call: "POST /ach/originators/${ob_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rcb: "$.data.id" }
          trigger:
            - call: "POST /ach/risk-cases/${rca}/resolve"
              payload: { action: "SUSPEND" }
              as: OdfiRiskOfficer
            - call: "POST /ach/risk-cases/${rcb}/resolve"
              payload: { action: "DISMISS" }
              as: OdfiRiskOfficer
          assert:
            - "Originator.${oa_id}.status == SUSPENDED (SUSPEND branch)"
            - "AchFile.${fa_id}.status == REJECTED (cascade on the SUSPEND branch)"
            - "Originator.${ob_id}.status == ACTIVE (DISMISS branch: no originator mutation)"
            - "AchFile.${fb_id}.status == WAREHOUSED (DISMISS branch: no cascade)"
            - "RiskCase.${rca}.resolution_action == SUSPEND and RiskCase.${rcb}.resolution_action == DISMISS; both RESOLVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: suspension_cascade_file_reject_entry_cancel
        grounds:
          - state_machines.Originator.ACTIVE_to_SUSPENDED
          - state_machines.AchFile.WAREHOUSED_to_REJECTED
          - state_machines.AchEntry.WAREHOUSED_to_CANCELLED
          - entities.Originator.fields.outstanding_exposure_debit_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by risk-case resolution: resolve(SUSPEND)
          mutates Originator (link 1); the Originator suspension itself rejects
          WAREHOUSED AchFiles (link 2); each file rejection itself cancels its
          WAREHOUSED AchEntries (link 3). Exposure recompute is a consequence
          of link 3, not the original trigger.
        test_recipe:
          setup:
            - "Originator ACTIVE, limit 10000000; WAREHOUSED file with 2 DEBIT entries of 1000000 each (outstanding debit exposure 2000000)"
            - "One OPEN MANUAL RiskCase for the originator"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Iota Inc", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
