      - name: lien_amend_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[lien-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Lien: after a successful amend bumps the version, replaying the amend with the previously observed version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Case LIEN_FILED, lien 100000 FILED at version 1; first amend to 90000 succeeds (version 2)"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-OC-2", full_name: "Occ Lien", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 90000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/liens/${l_id}/amend", payload: { new_amount_cents: 80000, expected_lien_version: "${l_v}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (captured err), HTTP 412"
            - "Lien.${l_id}.lien_amount_cents still == 90000 and amended_count == 1"

      - name: settlement_create_stale_case_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[settlement-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on TplCase: a settlement create carrying the case version observed before lien filing (which bumped the case version) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Case LIEN_FILED (lien 100000); client holds the stale case version captured right after notify-attorney"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-OC-3", full_name: "Occ Case", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2026-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
            - { call: "POST /recovery/cases/${c_id}/notify-attorney", as: RecoverySpecialist, as_user_id: spec_1, captures: { c_v_stale: $.data.version } }
            - { call: "POST /recovery/cases/${c_id}/expense-claims", payload: { service_date: "2026-01-10", paid_amount_cents: 100000, claim_reference: "CL-1" }, as: RecoverySpecialist, as_user_id: spec_1 }
            - { call: "POST /recovery/cases/${c_id}/liens", as: RecoverySpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /recovery/cases/${c_id}/settlements", payload: { gross_amount_cents: 500000, attorney_fee_pct: 0.20, litigation_costs_cents: 50000, offered_by: "INSURER", expected_case_version: "${c_v_stale}" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (captured err), HTTP 412"
            - "GET /recovery/settlements?case_id=${c_id} returns an empty list"

      - name: version_increments_on_each_mutation
        claim_type: version_increment
        grounds: [entities.TplCase]
        distinguishing_aspect: "TplCase.version starts at 1 on create and increments by exactly 1 per mutation: notify-attorney -> 2; expense-claim cascade (total_paid_claims_cents recompute) -> 3."
        test_recipe:
          setup: ["Case created"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-VI-1", full_name: "Ver Inc", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
