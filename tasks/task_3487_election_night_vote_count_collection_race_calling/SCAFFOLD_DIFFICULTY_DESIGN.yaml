# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3487_election_night_vote_count_collection_race_calling
# Nine Difficulty Rules x 2 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and ships a verbatim-transcribable structured test_recipe.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: outstanding_estimate_historical_vs_survey_diverge
        grounds:
          - calculations.outstanding_vote_estimate
          - entities.Contest.fields.outstanding_estimate
          - entities.County.fields.survey_turnout_estimate
          - endpoints.GET_/contests/{id}/tabulation
        distinguishing_aspect: "On identical reported data the historical variant (precinct-share scaled) and the survey variant (survey turnout minus reported votes) yield different per-county estimates — Alameda 5000 vs 1000 — and the contest consumes max() of the two per county."
        test_recipe:
          setup:
            - "Clock at 2026-10-15T00:00:00Z; GENERAL event for 2026-11-03 with counties Alameda (10 precincts, expected 10000, survey 8000) and Contra Costa (5 precincts, expected 4000, no survey), contest US Senator linked to both counties, two candidates, feed StateWire CA; posture advanced CANDIDATES_LOCKED then LIVE at 2026-11-03T13:00:00Z."
            - "One ACCEPTED feed report on Alameda: precincts_reporting 5, Wanda 4000 / Tom 3000 (reported_total 7000, deviation_ratio 0.3 <= 0.40 so it lands RECEIVED)."
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ElectionOpsAdmin
            - &ev
              call: "POST /election-events"
              payload: { event_name: "2026 General Election", event_date: "2026-11-03", event_type: "GENERAL", total_stringer_hour_budget: 400, stringer_selection_mode: "CAREER" }
              as: ElectionOpsAdmin
              captures: { ev: $.data.id }
            - &cty_a
              call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06001", county_name: "Alameda", state_code: "CA", expected_precincts: 10, expected_vote_total: 10000, survey_turnout_estimate: 8000, historical_dem_share: 0.60 }
              as: ElectionOpsAdmin
              captures: { cty_a: $.data.id }
            - &cty_b
              call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06013", county_name: "Contra Costa", state_code: "CA", expected_precincts: 5, expected_vote_total: 4000 }
              as: ElectionOpsAdmin
              captures: { cty_b: $.data.id }
            - &cst
              call: "POST /election-events/${ev}/contests"
              payload: { office_name: "US Senator", state_code: "CA", contest_type: "FEDERAL_SENATE", seats: 1 }
              as: ElectionOpsAdmin
              captures: { cst: $.data.id }
            - &lnk_a
              call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_a}" }
              as: ElectionOpsAdmin
            - &lnk_b
              call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_b}" }
              as: ElectionOpsAdmin
            - &cand_w
              call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Wanda Wynn", party: "DEM" }
              as: ElectionOpsAdmin
              captures: { cand_w: $.data.id }
            - &cand_t
              call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Tom Traylor", party: "REP" }
              as: ElectionOpsAdmin
              captures: { cand_t: $.data.id }
            - &feed
              call: "POST /election-events/${ev}/feed-sources"
              payload: { feed_name: "StateWire CA", state_codes: ["CA"], priority_tier: "PRIMARY" }
              as: ElectionOpsAdmin
            - &lock
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "CANDIDATES_LOCKED" }
              as: ElectionOpsAdmin
            - &eday
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-03T13:00:00Z" }
              as: ElectionOpsAdmin
            - &live
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "LIVE" }
              as: ElectionOpsAdmin
            - &cv
              call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv: $.data.version }
            - &rep_a1
              call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 4000 }, { candidate_id: "${cand_t}", votes: 3000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a1: $.data.id }
            - &acc_a1
              call: "POST /vote-reports/${rep_a1}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - &tab_posture
              call: "POST /election-events/${ev}/posture-transitions"
              payload: { target_posture: "TABULATION" }
              as: ElectionOpsAdmin
          trigger:
            - call: "GET /contests/${cst}/tabulation"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
          assert:
            - "response.data.outstanding_estimate == 9000"
            - "response.data.outstanding_detail entry for county ${cty_a}: historical_est == 5000 and survey_est == 1000 and outstanding_est == 5000 (max of the two variants)"
            - "response.data.outstanding_detail entry for county ${cty_b}: historical_est == 4000 and survey_est == 4000 (survey null falls back to historical) and outstanding_est == 4000"
            - "VoteReport.${rep_a1}.status == ACCEPTED and reported_total == 7000 and deviation_ratio == 0.3"

      - name: reliability_career_vs_recent_form_diverge
        grounds:
          - calculations.stringer_reliability_score
          - entities.Stringer.fields.reliability_career
          - entities.Stringer.fields.reliability_recent_form
          - state_machines.StringerAssignment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: "A NO_SHOW in an event dated 2024-11-05 (more than 365 days before the evaluated 2026-11-03 event) still dents CAREER (100 - 25 = 75) but ages out of RECENT_FORM (100) — same stringer, same history rows, two variants, two scores."
        test_recipe:
          setup:
            - "Stringer Sally has one assignment in the 2024-11-05 event marked NO_SHOW after its window passed, and one plain assignment in the 2026-11-03 event."
            - "Evaluation context for GET /stringers/{id} is the stringer's greatest assignment event_date (2026-11-03), so RECENT_FORM counts only events dated after 2025-11-03."
          setup_api_calls:
            - *clock0
            - &ev_old
              call: "POST /election-events"
              payload: { event_name: "2024 General Election", event_date: "2024-11-05", event_type: "GENERAL", total_stringer_hour_budget: 100 }
              as: ElectionOpsAdmin
              captures: { ev_old: $.data.id }
            - &cty_old
              call: "POST /election-events/${ev_old}/counties"
              payload: { county_fips: "01001", county_name: "Autauga", state_code: "AL", expected_precincts: 4, expected_vote_total: 2000 }
              as: ElectionOpsAdmin
              captures: { cty_old: $.data.id }
            - &str_s
              call: "POST /stringers"
              payload: { stringer_name: "Sally Stringer", home_state: "CA" }
              as: StringerCoordinator
              captures: { str_s: $.data.id }
            - &asg_old
              call: "POST /election-events/${ev_old}/assignments"
              payload: { county_id: "${cty_old}", window_start: "2024-11-05T08:00:00Z", window_end: "2024-11-05T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg_old: $.data.id }
            - &clock_old_end
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2024-11-06T00:00:00Z" }
              as: ElectionOpsAdmin
            - &noshow_old
              call: "POST /assignments/${asg_old}/status-actions"
              payload: { action: "NO_SHOW" }
              as: StringerCoordinator
            - *ev
            - *cty_a
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
          trigger:
            - call: "GET /stringers/${str_s}"
              payload: {}
              as: StringerCoordinator
          assert:
            - "Stringer.${str_s}.no_show_count == 1"
            - "Stringer.${str_s}.reliability_career == 75"
            - "Stringer.${str_s}.reliability_recent_form == 100"

  - rule_id: combinatorial_formula
    instances:
      - name: call_certainty_multi_input_rank_gate
        grounds:
          - calculations.call_certainty_evaluation
          - calculations.tabulation_rollup
          - state_machines.RaceCall.PROPOSED_to_PUBLISHED
          - endpoints.POST_/calls/{id}/decisions
        distinguishing_aspect: "Mode (a): the publish gate is a >=3-input non-linear rule — per-candidate ranked totals, the per-county max() of two outstanding-estimate variants, and a strict-inequality branch per trailing candidate — not a single threshold."
        test_recipe:
          setup:
            - "Standard universe (Alameda 10p/10000/survey 8000, Contra Costa 5p/4000) with a third candidate Ivy Irwin (IND); posture LIVE at 2026-11-03T13:00:00Z."
            - "ACCEPTED feed reports: Alameda p8 W5000/T2500/I500 (total 8000, deviation 0.2 passes); Contra Costa p4 W2000/T1000/I300 (total 3300, deviation 0.175 passes)."
            - "Rollup: W 7000, T 3500, I 800; outstanding = max(2000,0) + 800 = 2800."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cty_b
            - *cst
            - *lnk_a
            - *lnk_b
            - *cand_w
            - *cand_t
            - call: "POST /contests/${cst}/candidates"
              payload: { candidate_name: "Ivy Irwin", party: "IND" }
              as: ElectionOpsAdmin
              captures: { cand_i: $.data.id }
            - *feed
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 8, candidate_votes: [{ candidate_id: "${cand_w}", votes: 5000 }, { candidate_id: "${cand_t}", votes: 2500 }, { candidate_id: "${cand_i}", votes: 500 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a2: $.data.id }
            - call: "POST /vote-reports/${rep_a2}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv2: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 4, candidate_votes: [{ candidate_id: "${cand_w}", votes: 2000 }, { candidate_id: "${cand_t}", votes: 1000 }, { candidate_id: "${cand_i}", votes: 300 }], expected_contest_version: "${cv2}" }
              as: FeedOperator
              captures: { rep_b2: $.data.id }
            - call: "POST /vote-reports/${rep_b2}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - *tab_posture
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv3: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv3}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call1: $.data.id }
          trigger:
            - call: "POST /calls/${call1}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
          assert:
            - "RaceCall.${call1}.status == PUBLISHED (7000 > 3500 + 2800 and 7000 > 800 + 2800 both hold)"
            - "Contest.${cst}.call_status == CALLED and called_candidate_id == ${cand_w}"
            - "Contest.${cst}.margin_pct == 0.309735 (3500/11300, 6dp round_half_up)"
            - "Contest.${cst}.outstanding_estimate == 2800 and total_votes == 11300"
            - "RaceCall.${call1}.proposed_by == \"analyst-nina\" and published_by == \"chief-ray\""

      - name: invoice_per_line_rounding_differs_from_sum_rounding
        grounds:
          - calculations.media_invoice_total
          - entities.ResultDelivery.fields.fee_cents
          - entities.MediaInvoice.fields.total_fee_cents
          - endpoints.POST_/media-customers/{id}/invoices
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — each delivery rounds round_half_up(999 * 0.35) = 350 at creation and the invoice sums stored integers (3 x 350 = 1050), never round(2997 * 0.35) = 1049 at the end."
        test_recipe:
          setup:
            - "Standard universe plus county Solano (3 precincts, expected 3000) linked to the contest; posture LIVE; BASIC customer WireLite licensed for CA."
            - "Three accepted feed reports: Alameda p5 W4000/T3000 (RECEIVED), Contra Costa p2 W1000/T800 (deviation 0.55 -> FLAGGED, clerk override ACCEPT), Solano p3 W1500/T1200 (RECEIVED)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cty_b
            - &cty_e
              call: "POST /election-events/${ev}/counties"
              payload: { county_fips: "06095", county_name: "Solano", state_code: "CA", expected_precincts: 3, expected_vote_total: 3000 }
              as: ElectionOpsAdmin
              captures: { cty_e: $.data.id }
            - *cst
            - *lnk_a
            - *lnk_b
            - call: "POST /contests/${cst}/county-links"
              payload: { county_id: "${cty_e}" }
              as: ElectionOpsAdmin
            - *cand_w
            - *cand_t
            - *feed
            - &cust_basic
              call: "POST /media-customers"
              payload: { customer_name: "WireLite", license_tier: "BASIC", licensed_states: ["CA"] }
              as: ElectionOpsAdmin
              captures: { cust_basic: $.data.id }
            - *lock
            - *eday
            - *live
            - *cv
            - *rep_a1
            - *acc_a1
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv_b: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 2, candidate_votes: [{ candidate_id: "${cand_w}", votes: 1000 }, { candidate_id: "${cand_t}", votes: 800 }], expected_contest_version: "${cv_b}" }
              as: FeedOperator
              captures: { rep_b1: $.data.id }
            - call: "POST /vote-reports/${rep_b1}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv_e: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_e}", source: "FEED", precincts_reporting: 3, candidate_votes: [{ candidate_id: "${cand_w}", votes: 1500 }, { candidate_id: "${cand_t}", votes: 1200 }], expected_contest_version: "${cv_e}" }
              as: FeedOperator
              captures: { rep_e1: $.data.id }
            - call: "POST /vote-reports/${rep_e1}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
          trigger:
            - call: "POST /media-customers/${cust_basic}/invoices"
              payload: { period: "2026-11" }
              as: ElectionOpsAdmin
              captures: { inv: $.data.id }
          assert:
            - "MediaInvoice.${inv}.delivery_count == 3"
            - "MediaInvoice.${inv}.total_fee_cents == 1050 (3 x round_half_up(999 x 0.35) = 3 x 350; the sum-then-round alternative 1049 is forbidden)"
            - "each of the 3 VOTE_UPDATE ResultDelivery rows for ${cust_basic} has fee_cents == 350"

  - rule_id: non_linear_state_machine
    instances:
      - name: contest_call_dimension_cycles_while_tabulation_dimension_holds
        grounds:
          - state_machines.Contest.call_status_UNCALLED_to_CALLED
          - state_machines.Contest.call_status_CALLED_to_UNCALLED
          - state_machines.RaceCall.PUBLISHED_to_RETRACTED
        distinguishing_aspect: "Contest carries two independent state dimensions: call_status cycles UNCALLED -> CALLED -> UNCALLED -> CALLED across publish/retract/re-propose/re-publish while tabulation_status stays COMPLETE the whole time."
        test_recipe:
          setup:
            - "Standard universe, contest linked to Alameda only for this run; posture TABULATION; Alameda fully reported p10 W6000/T4000 (deviation 0, swing 0) and ACCEPTED, so the contest is COMPLETE with outstanding_estimate 0 and W is callable (6000 > 4000 + 0)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cst
            - *lnk_a
            - *cand_w
            - *cand_t
            - *feed
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 6000 }, { candidate_id: "${cand_t}", votes: 4000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_full: $.data.id }
            - call: "POST /vote-reports/${rep_full}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - *tab_posture
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_p1: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_p1}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call_a: $.data.id }
            - call: "POST /calls/${call_a}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
            - call: "POST /calls/${call_a}/decisions"
              payload: { action: "RETRACT", reason: "desk reversal on corrected estimate" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
          trigger:
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_p2: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_p2}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call_b: $.data.id }
            - call: "POST /calls/${call_b}/decisions"
              payload: { action: "PUBLISH" }
              as: DecisionDeskChief
              as_user_id: "chief-ray"
          assert:
            - "RaceCall.${call_a}.status == RETRACTED"
            - "RaceCall.${call_b}.status == PUBLISHED (the UNCALLED -> CALLED cycle is re-traversable)"
            - "Contest.${cst}.call_status == CALLED and called_candidate_id == ${cand_w}"
            - "Contest.${cst}.tabulation_status == COMPLETE (the call dimension cycled without touching the tabulation dimension)"

      - name: assignment_redeploy_cycle_releases_and_reactivates
        grounds:
          - state_machines.StringerAssignment.SCHEDULED_to_ACTIVE
          - state_machines.StringerAssignment.ACTIVE_to_RELEASED
          - state_machines.StringerAssignment.RELEASED_to_ACTIVE
        distinguishing_aspect: "StringerAssignment loops ACTIVE -> RELEASED -> ACTIVE via coordinator redeploy — a cycle on a different entity than the Contest call cycle."
        test_recipe:
          setup:
            - "Event created, Alameda registered, stringer Sally assigned to Alameda with window 2026-11-03T08:00:00Z..2026-11-03T20:00:00Z; posture LIVE at 2026-11-03T13:00:00Z (inside the window)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *str_s
            - *cst
            - *lnk_a
            - *cand_w
            - *cand_t
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg: $.data.id }
            - *lock
            - *eday
            - *live
            - call: "POST /assignments/${asg}/check-in"
              payload: {}
              as: Stringer
              as_user_id: "${str_s}"
            - call: "POST /assignments/${asg}/status-actions"
              payload: { action: "RELEASE" }
              as: StringerCoordinator
          trigger:
            - call: "POST /assignments/${asg}/status-actions"
              payload: { action: "REDEPLOY" }
              as: StringerCoordinator
          assert:
            - "StringerAssignment.${asg}.status == ACTIVE after the SCHEDULED -> ACTIVE -> RELEASED -> ACTIVE loop"
            - "StringerAssignment.${asg}.auto_selected == false"
            - "Stringer.${str_s}.reliability_career == 100 and no_show_count == 0 (release/redeploy carry no penalty)"

  - rule_id: transitive_cascade
    instances:
      - name: recount_overturn_retracts_call_and_stales_deliveries
        grounds:
          - state_machines.RecountCase.ACTIVE_to_RESOLVED_OVERTURNED
          - state_machines.RaceCall.PUBLISHED_to_RETRACTED
          - state_machines.Contest.call_status_CALLED_to_UNCALLED
          - state_machines.ElectionEvent.CERTIFICATION_to_TABULATION
          - entities.ResultDelivery.fields.status
        distinguishing_aspect: "Depth-3 chain from a single RESOLVE trigger: recount resolution mutates the RaceCall (hop 1), the call's retraction mutates the Contest call dimension (hop 2), and the contest flip mutates ResultDelivery rows and mints compensating CALL_CREDIT rows (hop 3) — each hop caused by the previous one, and the event posture itself had already cycled CERTIFICATION -> TABULATION at activation."
        test_recipe:
          setup:
            - "Standard universe; PREMIUM customer Metro News licensed for CA registered before any delivery fires."
            - "Alameda p10 W5025/T4975 (10000) and Contra Costa p5 W2010/T1990 (4000) both ACCEPTED: contest COMPLETE, totals W 7035 / T 6965, margin_pct 0.005, outstanding 0."
            - "Call on Wanda proposed by analyst-nina and published by chief-ray (7035 > 6965 + 0); event advanced to CERTIFICATION; recount filed (margin at threshold) and ACTIVATEd, which auto-reopens the event to TABULATION and the contest to REPORTING."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cty_b
            - *cst
            - *lnk_a
            - *lnk_b
            - *cand_w
            - *cand_t
            - *feed
            - &cust_prem
              call: "POST /media-customers"
              payload: { customer_name: "Metro News", license_tier: "PREMIUM", licensed_states: ["CA"] }
              as: ElectionOpsAdmin
              captures: { cust_prem: $.data.id }
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 5025 }, { candidate_id: "${cand_t}", votes: 4975 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
            - call: "POST /vote-reports/${rep_a}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv_b: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
