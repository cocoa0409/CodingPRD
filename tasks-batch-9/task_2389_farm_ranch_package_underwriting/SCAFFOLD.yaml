    output: FarmPolicy
    side_effects: ["moves every RESERVED CatReservation of the policy to COMMITTED and bumps each pool version by 1", "sets bound_at and bound_by_user_id", "no premium figure changes on bind", "increments FarmPolicy.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FARM_POLICY_NOT_FOUND, ERR_STALE_POLICY_VERSION, ERR_POLICY_NOT_RATED, ERR_POLICY_TERMINAL, ERR_COMPLIANCE_SUSPENDED, ERR_CRITICAL_REC_OVERDUE, ERR_AGENT_NOT_ACTIVE, ERR_WC_COORDINATION_UNVERIFIED, ERR_WC_PROOF_MISSING, ERR_QUOTE_EXPIRED, ERR_WC_PROOF_EXPIRED, ERR_POOL_FROZEN, ERR_CAT_CAPACITY_EXCEEDED, ERR_AGENT_AUTHORITY_EXCEEDED]

