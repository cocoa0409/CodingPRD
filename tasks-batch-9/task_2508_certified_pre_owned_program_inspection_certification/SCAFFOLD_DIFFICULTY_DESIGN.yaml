  - rule_id: cross_entity_state_dependency
    instances:
      - name: inspection_blocked_by_retired_template
        grounds:
          - state_machines.ChecklistTemplate.PUBLISHED_to_RETIRED
          - validations[priority=8]
          - errors.ERR_TEMPLATE_NOT_PUBLISHED
          - entities.ChecklistTemplate.fields.effective_from
        distinguishing_aspect: |
          Publishing a second template retires the first as a side effect, and the inspection endpoint
          then depends on the state of an entity it merely references: the same POST body that would
          have succeeded a moment earlier now fails with ERR_TEMPLATE_NOT_PUBLISHED, while the same
          request naming the new template succeeds. The already-created inspection keeps pointing at
          the retired template, which is the asymmetry being pinned.
        test_recipe:
          setup:
            - "Template MPI-172 (effective_from 2026-01-01) is published and used for a first inspection on vehicle V1."
            - "Template MPI-200 (effective_from 2026-02-01) is then published, retiring MPI-172."
            - "Two more eligible vehicles V2 and V3 exist; the technician's slots are 4 hours apart."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Template Motors", franchise_code: "FR-9801", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
