      - name: error_cross_aggregate_and_welder_qualification_family_at_completion
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_PART_NOT_IN_JOB]
          - errors[ERR_WELD_NOT_IN_JOB]
          - errors[ERR_QUALIFICATION_WPS_MISMATCH]
          - errors[ERR_THICKNESS_OUTSIDE_QUALIFICATION]
          - errors[ERR_INVALID_WELD_STATE]
          - errors[ERR_NDE_INCOMPLETE]
          - validations[priority=64]
          - validations[priority=70]
          - validations[priority=80]
        distinguishing_aspect: "Rows that exist and are individually valid are still refused when they belong to the wrong aggregate: a part of job B cannot be welded into job A's map and a joint of job B cannot be charged under job A's furnace batch. The same run then walks the welder-side qualification gates, which read the welder's own record rather than the procedure's, and finishes by proving a fully welded job still cannot be pressurised before examination."
        test_recipe:
          setup:
            - "ACTIVE certificate CA-U-8930 governs jobs J-2885-C46 (job A) and J-2885-C47 (job B), both at FAB_PLANNING with SHELL and HEAD sheets APPROVED at rt_extent_declared SPOT, so governing_joint_efficiency is 0.85 and Category A joints are not restricted to BUTT."
            - "Heat H-6700 (SA-516-70, PLATE, 4000.00 lb) is ACCEPTED; part SH-0A is issued to job A and part SH-0B to job B."
            - "QUALIFIED procedures WPS-150 and WPS-151 both span 0.1875 to 3.0000 in with pwht_required false. Welder W-90 is qualified on WPS-150 to 1.5000 in, W-91 on WPS-150 to 0.5000 in, and W-92 on WPS-151 to 1.5000 in."
            - "Job A carries joints W-201 and W-202, both Category A BUTT at 0.7500 in on WPS-150; job B carries joint W-301."
