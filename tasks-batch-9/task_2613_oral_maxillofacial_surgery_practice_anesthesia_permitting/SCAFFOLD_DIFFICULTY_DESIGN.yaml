              payload: {}
              as: QualityReviewer
              as_user_id: "${rev_id}"
          assert:
            - "setup: AdverseEvent.${ev_id}.reporting_deadline_at == 2026-09-14T09:00:00Z and late_report == false and Practice.${prac_id}.open_adverse_event_count == 1"
            - "after trigger[0]: AdverseEvent.${ev_id}.status == UNDER_MORBIDITY_REVIEW and reviewer_staff_id == ${rev_id}"
            - "after trigger[1]: AdverseEvent.${ev_id}.status == REVIEW_SIGNED_OFF, corrective_action_required == true, regulator_notified == false"
            - "trigger[2] fails with HTTP 409 ERR_REGULATOR_NOTIFICATION_REQUIRED (validation priority 73 join condition) and AdverseEvent.${ev_id}.status is still REVIEW_SIGNED_OFF"
            - "after trigger[3]: AdverseEvent.${ev_id}.regulator_notified == true and status is STILL REVIEW_SIGNED_OFF (the notification track never advances the review status)"
            - "after trigger[4]: AdverseEvent.${ev_id}.status == CLOSED and Practice.${prac_id}.open_adverse_event_count == 0"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_inspection_five_hop_suspension_cascade
        grounds:
          - state_machines.AnesthesiaPermit.ACTIVE_to_SUSPENDED
          - state_machines.SurgicalCase.CONFIRMED_to_BLOCK_HELD
          - state_machines.ImplantReservation.HELD_to_RELEASED
          - calculations.consignment_liability
          - entities.Practice.fields.consignment_committed_cents
          - entities.ImplantLot.fields.quantity_reserved
        cascade_depth: 5
        distinguishing_aspect: |
          Trigger: recording a critical deficiency on a re-inspection. Chain, each hop caused only
          by the hop above it:
            hop 1  the FAILED_CRITICAL outcome drives AnesthesiaPermit ACTIVE -> SUSPENDED, so
                   Practice.sedation_privilege_state becomes SUSPENDED
            hop 2  because the privilege left PERMITTED, the CONFIRMED MODERATE_SEDATION case
                   reverts to scheduling_status BLOCK_HELD with clearance_status DEFERRED
            hop 3  because that case left the confirmed roster, its HELD ImplantReservation is
                   RELEASED, which re-prices the row (restocking fee applied, credit zeroed)
            hop 4  because the reservation left HELD, its parent ImplantLot returns the reserved
                   units and bumps its own version
            hop 5  because the reservation liability changed, Practice.consignment_committed_cents
                   is recomputed down to 0
          No hop can be reached without the previous one: nothing here is triggered directly.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z -> 2026-09-12T10:00:00Z (inspection) -> 2026-09-14T12:00:00Z (day-of) -> 2026-09-15T10:00:00Z (re-inspection)"
            - "practice with recovery_bay_count 2, turnover_buffer_minutes 15, consignment_credit_limit_cents 500000"
            - "ACTIVE MODERATE_SEDATION permit (four drills, first inspection 0/0/0 -> score 100)"
            - "MODERATE_SEDATION IMPLANT case 2026-09-14T13:00Z-14:00Z, CONFIRMED and CLEARED"
            - "consignment lot unit_cost_cents 30000, quantity_on_hand 5; reservation of 2 units HELD (subtotal 60000, credit 12000, liability 48000)"
            - "a second inspection scheduled while the permit is ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
