            - { call: "POST /guideline-rules", payload: { rule_code: "1.4.1", title: "Physical harm", category: "SAFETY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_safety_id: "$.data.id" } }
