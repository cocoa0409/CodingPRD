              payload: { depot_id: "${d_id}", charger_id: "${c1_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-05-10T11:15:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 50, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHARGER_TIME_CONFLICT (HTTP 409)"

      - name: vehicle_closed_interval_conflict
        grounds:
          - calculations.vehicle_slot_geometry
          - validations[priority=9]
          - errors[ERR_VEHICLE_TIME_CONFLICT]
        distinguishing_aspect: "Vehicle resource, CLOSED intervals with NO buffer: existing [10:00,11:00) and new [11:00,12:00) on a DIFFERENT charger share the instant 11:00 and collide (touching endpoints count), whereas the charger's half-open rule would not — distinct interval semantics."
        test_recipe:
          setup:
            - "Depot D; Chargers CA/CB; Vehicle VA. Existing session E on CA, vehicle VA, [10:00,11:00) power 50."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
