      - name: route_hazard_score_exactly_at_publish_ceiling_publishes
        grounds:
          - calculations.route_hazard_score
          - validations.priority_50.ERR_ROUTE_HAZARD_SCORE_EXCEEDED
          - state_machines.WalkingRoute.DRAFT_to_PUBLISHED
          - errors.ERR_ROUTE_HAZARD_SCORE_EXCEEDED
        distinguishing_aspect: |
          A different metric (hazard_score) on a different endpoint (publish). A single
          unmitigated 625 ft RAIL_CROSSING scores 4.00 * 625 / 100 = 25.00, exactly the
          HAZARD_SCORE_PUBLISH_CEILING, and the <= comparison must publish it; a 700 ft
          segment scores 28.00 and must be rejected with ERR_ROUTE_HAZARD_SCORE_EXCEEDED
          (422). Both routes belong to the same school under different route_codes, so
          no supersede interaction can mask the outcome.
        test_recipe:
          setup:
            - "School 2026-08-24 -> 2027-06-11 with no guard posts, so coverage_posture stays OPEN and a published route is never placed on ADVISORY_HOLD."
            - "Route A: one unmitigated RAIL_CROSSING segment of 625 ft -> hazard_score 25.00."
            - "Route B: one unmitigated RAIL_CROSSING segment of 700 ft -> hazard_score 28.00."
            - "Neither route cites an intersection, so the warrant and ownership gates cannot fire."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/walking-routes"
              payload: { school_id: "${school_id}", route_code: "RT-RAIL-A", route_name: "Rail crossing approach A", segments: [ { segment_order: 1, hazard_type: "RAIL_CROSSING", length_ft: 625, mitigated: false, intersection_id: null } ] }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { route_a_id: $.data.id }
            - call: "POST /srts/walking-routes"
              payload: { school_id: "${school_id}", route_code: "RT-RAIL-B", route_name: "Rail crossing approach B", segments: [ { segment_order: 1, hazard_type: "RAIL_CROSSING", length_ft: 700, mitigated: false, intersection_id: null } ] }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { route_b_id: $.data.id }
          trigger:
            - call: "POST /srts/walking-routes/${route_a_id}/publish"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /srts/walking-routes/${route_b_id}/publish"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
          assert:
            - "WalkingRoute.${route_a_id}.hazard_score == 25.00"
            - "first trigger call returns 200 and WalkingRoute.${route_a_id}.status == PUBLISHED with published_at == 2026-08-01T00:00:00Z"
            - "WalkingRoute.${route_b_id}.hazard_score == 28.00"
            - "second trigger call returns error id ERR_ROUTE_HAZARD_SCORE_EXCEEDED with HTTP status 422"
            - "WalkingRoute.${route_b_id}.status == DRAFT with published_at == null"

      - name: substitute_certification_expiring_on_absence_date_is_still_eligible
        grounds:
          - calculations.substitute_selector
          - state_machines.AbsenceReport.DISPATCH_PENDING_to_OFFER_OUT
          - state_machines.AbsenceReport.DISPATCH_PENDING_to_UNCOVERED_GAP
          - entities.Guard.fields.certification_expires_on
        distinguishing_aspect: |
          A third metric on a third endpoint: an inclusive date boundary inside the
          selector's eligibility filter rather than a numeric threshold. Sam's
          certification expires exactly on the 2026-09-16 absence date and must remain
          eligible; Nia's expires 2026-09-15 and must be filtered out. Off-by-one in
          either direction is unambiguous — a strict > comparison empties the pool and
