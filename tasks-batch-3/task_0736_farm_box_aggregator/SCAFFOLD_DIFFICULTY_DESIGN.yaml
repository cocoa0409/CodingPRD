          - entities.Order.fields.delivery_slot_start
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: "PickupHub interval semantics = half-open [slot_start, slot_end) aggregate capacity: with slot_capacity=1, a second DELIVERY order whose window [10:30,11:30) overlaps the first order's booked [10:00,11:00) pushes the overlap count to 2 > 1 and is rejected; an adjacent [11:00,12:00) window (end==start) would NOT overlap."
