              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc2: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v3: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 3, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v3}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles/${cyc2}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v4: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 3, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v4}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc3: $.data.id }
            - call: "GET /molding-cycles?production_order_id=${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molds?product_model_id=${pm}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the first two cycles return 201 on arms 1 and 2, drawing MLD-CVN-1 and MLD-CVN-2 — all three moulds start at cycles_since_service 0, so the mold_code ASC tie-break fixes the order of selection"
            - "the third cycle fails 409 ERR_ORDER_OVERBUILD: two single-cavity cycles already account for 2 units and the ceiling is floor(ordered_qty 2 * 1.20) == floor(2.4) == 2, so the third would make 3"
            - "the ceiling is FLOORED, not rounded: 2.4 gives 2, and an ordered_qty of 3 would give floor(3.6) == 3 rather than 4 — the factor buys no extra unit at these sizes"
            - "no lower rung can explain the refusal: arm 3 of OV-CVN is empty so rung 62 is satisfied, MLD-CVN-3 is AVAILABLE at cycles_since_service 0 and free over the span so rung 70 is satisfied, and CB-CVN has 3 slots against 2 intersecting cycles so rung 71 is satisfied"
            - "aborting ${cyc2} returns 200 with status ABORTED and abort_reason OPERATOR_ABORT, and releases MLD-CVN-2 back to AVAILABLE with cycles_since_service still 0 because no part was produced"
