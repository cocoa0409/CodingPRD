      - name: parcels_list_pagination_envelope
        claim_type: computed_read
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /parcels returns response_type array with pagination fields limit/offset/total_count/has_more and default limit 10."
        test_recipe:
          setup: ["One account and one parcel."]
          setup_api_calls:
