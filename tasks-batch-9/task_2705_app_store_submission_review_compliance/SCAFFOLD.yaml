      - "DRAFT | REJECTED -> SUBMITTED, clearing rejection_note"
      - "EXTERNAL_PAYMENT_LINK requires the account's ACTIVE DISTRIBUTION_CERT to carry the EXTERNAL_PAYMENT_LINK entitlement (ERR_EXTERNAL_LINK_NOT_PERMITTED)"
      - "Blocked by both FROZEN and RESTRICTED postures"

  - method: POST
    path: /commerce-items/{id}/review
    description: "Platform commerce-rule review of an item."
    roles: [PlatformReviewer]
    input: [outcome, "rejection_note?"]
    output: CommerceItem
    success_code: 200
    side_effects:
      - "APPROVE -> APPROVED and recomputes commission_rate_applied / commission_cents from the stored gross"
      - "REJECT -> REJECTED and requires a non-empty rejection_note"
      - "A build cannot be approved while any commerce item of its app is still SUBMITTED (validations priority 75)"

  - method: POST
    path: /commerce-items/{id}/report-revenue
    description: "Report gross proceeds for one settlement period (once per item)."
    roles: [PublisherAdmin]
    input: [reported_gross_cents, period_label]
    output: CommerceItem
    success_code: 200
    side_effects:
      - "Requires status == APPROVED and a distributed app; refused with ERR_REVENUE_ALREADY_REPORTED on a second report"
      - "Recomputes commission_rate_applied and commission_cents (per-line round_half_up BEFORE summation)"
      - "Appends period_label to PublisherAccount.settlement_finalized_periods when it is not already present"

  # --- ImpactAssessment (created only by the guideline publication cascade) -----
  - method: GET
    path: /impact-assessments
    description: "List guideline-change impact assessments."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, Auditor]
    input: ["app_record_id?", "guideline_rule_id?", "status?", "limit?", "offset?"]
    output: ImpactAssessment[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /impact-assessments/{id}
    description: "Read one impact assessment with its severity and remediation deadline."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, Auditor]
    input: []
    output: ImpactAssessment
    success_code: 200
    side_effects: []

  - method: POST
    path: /impact-assessments/{id}/assess
    description: "Work an impact assessment: start it, require remediation, accept no change, or mark it remediated."
    roles: [ComplianceOfficer]
    input: [action, "note?"]
    output: ImpactAssessment
    success_code: 200
    side_effects:
      - "action START -> IN_ASSESSMENT and recomputes impact_severity with the current exposure_factor"
      - "action REQUIRE_REMEDIATION -> REMEDIATION_REQUIRED (branch A: posture stays RESTRICTED and the deadline clock runs)"
      - "action ACCEPT_NO_CHANGE -> ACCEPTED_NO_CHANGE (branch B: STALE mappings restored to PASSED, index recomputed, posture may return to OPEN); ceiling-gated"
      - "action MARK_REMEDIATED -> REMEDIATED from REMEDIATION_REQUIRED or OVERDUE; the only publisher action permitted while the app is FROZEN"

  # --- Logical clock (test-driving endpoint) ------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock. MANDATORY DEFAULT: before any call to this endpoint the clock reads 2026-08-01T00:00:00Z. Time never advances on its own; every ISO 8601 instant in the system is compared against this value."
    roles: [PlatformPolicyAdmin, PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, Auditor]
    input: [current_utc]
    output: "{ current_utc: string, credentials_warned_count: integer, credentials_expired_count: integer, accounts_expired_count: integer, assessments_overdue_count: integer, postures_frozen_count: integer, rollouts_paused_count: integer }"
    success_code: 200
    side_effects:
      - "Rejects a non-monotonic value (current_utc < the stored clock) with ERR_CLOCK_NOT_MONOTONIC"
      - "Sweeps, in this pinned order: (1) SigningCredential ACTIVE -> EXPIRING_SOON -> EXPIRED, (2) PublisherAccount ACTIVE -> EXPIRED, (3) ImpactAssessment REMEDIATION_REQUIRED -> OVERDUE (strictly past the deadline), (4) AppRecord.compliance_posture recompute, (5) PHASE_ACTIVE rollouts of newly FROZEN apps -> PAUSED, (6) standing and expedite-credit rolling windows"
      - "Every entity touched by the sweep has its version incremented by 1"

# =============================================================================
# §1.6 Error Catalog (81 codes). Every code referenced by §1.2 preconditions,
# §1.2.1 concurrency rules, §1.3 formulas and §1.4 validations appears here.
# =============================================================================
errors:

  # --- 400 / 403 auth and tenancy ---------------------------------------------
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, condition: "X-User-Role absent or not one of the seven §1.7 roles, X-User-ID absent, or X-Publisher-Account-Id absent for an entity_backed role", applies_to: "all endpoints" }
  - { id: ERR_ROLE_NOT_PERMITTED, http_status: 403, condition: "X-User-Role is not in the endpoint's authorized roles list", applies_to: "all endpoints" }
  - { id: ERR_CROSS_ACCOUNT_ACCESS_DENIED, http_status: 403, condition: "An entity_backed role addressed an entity that resolves to a different PublisherAccount than X-Publisher-Account-Id", applies_to: "all endpoints with a path id or an entity-reference body field" }
  - { id: ERR_PROGRAM_MEMBERSHIP_EXPIRED, http_status: 403, condition: "PublisherAccount.program_status == EXPIRED on a create or release-advancing endpoint", applies_to: "validations priority 45 endpoint list, POST /signing-credentials/{id}/activate" }
  - { id: ERR_ACCOUNT_SUSPENDED, http_status: 403, condition: "PublisherAccount.program_status IN {SUSPENDED, TERMINATED} on a create or release-advancing endpoint", applies_to: "validations priority 45 endpoint list" }

  # --- 404 existence family ----------------------------------------------------
  - { id: ERR_PUBLISHER_ACCOUNT_NOT_FOUND, http_status: 404, condition: "publisher_account_id does not resolve", applies_to: "/publisher-accounts/{id}/*, POST /signing-credentials, POST /app-records" }
  - { id: ERR_SIGNING_CREDENTIAL_NOT_FOUND, http_status: 404, condition: "signing_credential_id or linked_cert_id does not resolve", applies_to: "/signing-credentials/{id}/*, POST /submissions, POST /submissions/{id}/return-to-draft" }
  - { id: ERR_APP_RECORD_NOT_FOUND, http_status: 404, condition: "app_record_id does not resolve", applies_to: "/app-records/{id}/*, POST /submissions, POST /feature-mappings, POST /rollout-plans, POST /commerce-items" }
  - { id: ERR_GUIDELINE_RULE_NOT_FOUND, http_status: 404, condition: "guideline_rule_id or supersedes_rule_id does not resolve", applies_to: "/guideline-rules/{id}/*, POST /feature-mappings, POST /guideline-rules" }
  - { id: ERR_FEATURE_MAPPING_NOT_FOUND, http_status: 404, condition: "The feature mapping id does not resolve", applies_to: "/feature-mappings/{id}/*" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http_status: 404, condition: "submission_id does not resolve", applies_to: "/submissions/{id}/*, POST /metadata-locales, POST /behavior-findings, POST /appeal-requests, POST /expedite-requests, POST /rollout-plans" }
  - { id: ERR_METADATA_LOCALE_NOT_FOUND, http_status: 404, condition: "The metadata locale id does not resolve", applies_to: "GET /metadata-locales/{id}" }
  - { id: ERR_BEHAVIOR_FINDING_NOT_FOUND, http_status: 404, condition: "The behavior finding id does not resolve", applies_to: "/behavior-findings/{id}/*" }
  - { id: ERR_REJECTION_REASON_NOT_FOUND, http_status: 404, condition: "A rejection reason id does not resolve, including any element of cited_rejection_reason_ids or overturned_rejection_reason_ids", applies_to: "/rejection-reasons/{id}/*, POST /appeal-requests, POST /appeal-requests/{id}/decide" }
  - { id: ERR_APPEAL_REQUEST_NOT_FOUND, http_status: 404, condition: "The appeal request id does not resolve", applies_to: "/appeal-requests/{id}/*" }
  - { id: ERR_EXPEDITE_REQUEST_NOT_FOUND, http_status: 404, condition: "The expedite request id does not resolve, including expedite_request_id at queue entry", applies_to: "/expedite-requests/{id}/*, POST /submissions/{id}/queue" }
  - { id: ERR_REVIEW_CAPACITY_WINDOW_NOT_FOUND, http_status: 404, condition: "The review capacity window id does not resolve", applies_to: "/review-capacity-windows/{id}/*" }
  - { id: ERR_ROLLOUT_PLAN_NOT_FOUND, http_status: 404, condition: "The rollout plan id does not resolve", applies_to: "/rollout-plans/{id}/*" }
  - { id: ERR_COMMERCE_ITEM_NOT_FOUND, http_status: 404, condition: "The commerce item id does not resolve", applies_to: "/commerce-items/{id}/*" }
  - { id: ERR_IMPACT_ASSESSMENT_NOT_FOUND, http_status: 404, condition: "The impact assessment id does not resolve", applies_to: "/impact-assessments/{id}/*" }

  # --- 422 schema / 412 concurrency -------------------------------------------
  - { id: ERR_VALIDATION, http_status: 422, condition: "Missing required field, wrong type, unknown enum member, out-of-range number, malformed ISO 8601 instant, unknown field, bad pagination bounds, or a body-shape rule such as a non-zero price on an EXTERNAL_PAYMENT_LINK item, an empty rejection_reasons array, a non-subset overturned_rejection_reason_ids, a profile without linked_cert_id, or not_after <= not_before", applies_to: "all endpoints with a body or query parameters" }
  - { id: ERR_STALE_APP_RECORD_VERSION, http_status: 412, condition: "expected_app_record_version != AppRecord.version", applies_to: "POST /submissions, POST /rollout-plans" }
  - { id: ERR_STALE_PUBLISHER_ACCOUNT_VERSION, http_status: 412, condition: "expected_publisher_account_version != PublisherAccount.version", applies_to: "POST /signing-credentials, POST /publisher-accounts/{id}/membership-renewal" }

  # --- 409 state family (one code per state machine) ---------------------------
  - { id: ERR_INVALID_SUBMISSION_STATE, http_status: 409, condition: "The requested transition is not declared for Submission.state, e.g. queueing a DRAFT build, claiming a build that is not WAITING_FOR_REVIEW, withdrawing an IN_REVIEW build, appealing a METADATA_REJECTED build, or granting an expedite for a queued build", applies_to: "every /submissions/{id}/* transition, POST /appeal-requests, POST /expedite-requests/{id}/decide, POST /rejection-reasons/{id}/response" }
  - { id: ERR_INVALID_LISTING_STATE, http_status: 409, condition: "listing_action is not declared for the current AppRecord.listing_state", applies_to: "PATCH /app-records/{id}/listing" }
  - { id: ERR_INVALID_DISTRIBUTION_STATE, http_status: 409, condition: "A cascade would drive AppRecord.distribution_state along an undeclared edge", applies_to: "POST /rollout-plans/{id}/start, /advance, /hold, /rollback" }
  - { id: ERR_INVALID_CREDENTIAL_STATE, http_status: 409, condition: "The credential transition is not declared for its status, e.g. activating an EXPIRED credential or compromising a REVOKED one", applies_to: "POST /signing-credentials/{id}/activate, /report-compromise, /revoke" }
  - { id: ERR_INVALID_ROLLOUT_STATE, http_status: 409, condition: "The rollout transition is not declared for RolloutPlan.state, e.g. advancing a PAUSED plan, resuming a PHASE_ACTIVE plan, or starting a COMPLETED plan", applies_to: "POST /rollout-plans/{id}/start, /advance, /hold, /rollback" }
  - { id: ERR_INVALID_GUIDELINE_STATE, http_status: 409, condition: "Publishing a rule whose status is not DRAFT", applies_to: "POST /guideline-rules/{id}/publish" }
  - { id: ERR_INVALID_MAPPING_STATE, http_status: 409, condition: "The self-review or waiver transition is not declared for FeatureMapping.self_review_status, e.g. PASS from NOT_STARTED or waiving a PASSED mapping", applies_to: "POST /feature-mappings/{id}/self-review, POST /feature-mappings/{id}/waive" }
  - { id: ERR_INVALID_IMPACT_STATE, http_status: 409, condition: "The assess action is not declared for ImpactAssessment.status, e.g. MARK_REMEDIATED from OPEN or any action on a terminal row", applies_to: "POST /impact-assessments/{id}/assess" }
  - { id: ERR_INVALID_APPEAL_STATE, http_status: 409, condition: "The appeal transition is not declared for AppealRequest.state, e.g. deciding a SUBMITTED appeal that never entered BOARD_REVIEW, or withdrawing one already under board review", applies_to: "POST /appeal-requests/{id}/board-review, /decide, /withdraw, POST /submissions/{id}/return-to-draft" }
  - { id: ERR_INVALID_EXPEDITE_STATE, http_status: 409, condition: "Deciding a request that is not REQUESTED, or citing an expedite_request_id whose state is not GRANTED or whose submission_id differs", applies_to: "POST /expedite-requests/{id}/decide, POST /submissions/{id}/queue" }
  - { id: ERR_INVALID_COMMERCE_ITEM_STATE, http_status: 409, condition: "The commerce transition is not declared for CommerceItem.status, or a build approval was attempted while an item of its app is still SUBMITTED", applies_to: "POST /commerce-items/{id}/submit, /review, /report-revenue, POST /submissions/{id}/decision" }
  - { id: ERR_INVALID_FINDING_STATE, http_status: 409, condition: "The triage action is not declared for BehaviorFinding.status, e.g. disputing a RECONCILED finding", applies_to: "POST /behavior-findings/{id}/triage" }
  - { id: ERR_REVIEW_WINDOW_CLOSED, http_status: 409, condition: "The assigned ReviewCapacityWindow has status CLOSED or the clock is outside its half-open interval (clock_now >= ends_at)", applies_to: "POST /submissions/{id}/queue, /claim, /decision, POST /review-capacity-windows/{id}/close" }

  # --- 409 posture gate and segregation of duties ------------------------------
  - { id: ERR_APP_COMPLIANCE_FROZEN, http_status: 409, condition: "AppRecord.compliance_posture == FROZEN on any gated endpoint (validations priority 40), the remediation exemptions excluded", applies_to: "validations priority 40 endpoint list" }
  - { id: ERR_APP_COMPLIANCE_RESTRICTED, http_status: 409, condition: "AppRecord.compliance_posture == RESTRICTED on a release-advancing endpoint", applies_to: "POST /submissions/{id}/queue, POST /rollout-plans, /start, /advance, /hold action=RESUME, POST /commerce-items/{id}/submit, POST /expedite-requests" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 409, condition: "The acting X-User-ID coincides with the identity recorded on the artifact being judged, or a decision was attempted by someone other than the claiming reviewer", applies_to: "POST /submissions/{id}/decision, POST /appeal-requests/{id}/board-review, /decide, POST /expedite-requests/{id}/decide, POST /feature-mappings/{id}/waive, POST /commerce-items/{id}/review" }

  # --- 409 business_safety -----------------------------------------------------
  - { id: ERR_CRITICAL_FINDING_UNRESOLVED, http_status: 409, condition: "A BehaviorFinding of the submission with severity == CRITICAL is still OPEN or DISPUTED", applies_to: "POST /submissions/{id}/queue, POST /submissions/{id}/decision, POST /rollout-plans/{id}/start, /advance" }
  - { id: ERR_PRIVACY_DISCLOSURE_INACCURATE, http_status: 409, condition: "The authoritative disclosure_accuracy_score variant is below DISCLOSURE_PASS_THRESHOLD (0.9500 inclusive)", applies_to: "POST /submissions/{id}/queue (provisional), POST /submissions/{id}/decision outcome=APPROVE (final)" }
  - { id: ERR_AGE_RATING_UNDERSTATED, http_status: 409, condition: "attested_age_rating < derived_age_rating", applies_to: "POST /submissions/{id}/queue, POST /submissions/{id}/decision" }
  - { id: ERR_TRACKING_CONSENT_PROMPT_MISSING, http_status: 409, condition: "A declared_privacy_items element has used_for_tracking == true while tracking_consent_prompt_present == false", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_DISCLOSURE_STILL_MISSING, http_status: 409, condition: "A RECONCILE triage was attempted while declared_privacy_items contains no tuple matching all four observed attributes of the finding", applies_to: "POST /behavior-findings/{id}/triage action=RECONCILE" }

  # --- 409 business_referential (signing material and coverage) ----------------
  - { id: ERR_SIGNING_CREDENTIAL_INVALID, http_status: 409, condition: "The cited credential is not a PROVISIONING_PROFILE, or its status is not ACTIVE or EXPIRING_SOON (PENDING_ACTIVATION, EXPIRED, REVOKED, COMPROMISED)", applies_to: "POST /submissions, POST /submissions/{id}/queue, /claim, /return-to-draft" }
  - { id: ERR_CREDENTIAL_PLATFORM_MISMATCH, http_status: 409, condition: "SigningCredential.platform != AppRecord.platform, or a provisioning profile's platform differs from its linked certificate", applies_to: "POST /submissions, POST /submissions/{id}/queue, POST /signing-credentials" }
  - { id: ERR_CREDENTIAL_NOT_YET_VALID, http_status: 409, condition: "not_before > clock_now (equality passes)", applies_to: "POST /signing-credentials/{id}/activate, POST /submissions/{id}/queue" }
  - { id: ERR_LINKED_CERT_NOT_ACTIVE, http_status: 409, condition: "A PROVISIONING_PROFILE's linked_cert_id credential is not ACTIVE or EXPIRING_SOON", applies_to: "POST /signing-credentials/{id}/activate, POST /submissions/{id}/queue" }
  - { id: ERR_KEY_CUSTODY_NOT_PERMITTED, http_status: 409, condition: "A DISTRIBUTION_CERT declares key_custody == LOCAL_KEYCHAIN", applies_to: "POST /signing-credentials, POST /signing-credentials/{id}/activate" }
  - { id: ERR_CREDENTIAL_IN_USE, http_status: 409, condition: "A revoke was attempted while a Submission signed with this credential is WAITING_FOR_REVIEW or IN_REVIEW", applies_to: "POST /signing-credentials/{id}/revoke" }
  - { id: ERR_CREDENTIAL_EXPIRES_BEFORE_DEADLINE, http_status: 409, condition: "SigningCredential.not_after <= the effective_review_deadline_at computed at queue entry (strict comparison)", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_GUIDELINE_MAPPING_INCOMPLETE, http_status: 409, condition: "An EFFECTIVE rule with requires_feature_mapping == true has no mapping for the app, or a mapping of an EFFECTIVE rule is not PASSED or WAIVED_BY_PLATFORM (including the empty mapping set)", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_GUIDELINE_RULE_NOT_EFFECTIVE, http_status: 409, condition: "A cited or superseded guideline rule is not in status EFFECTIVE", applies_to: "POST /submissions/{id}/decision, POST /guideline-rules/{id}/publish, POST /feature-mappings/{id}/self-review" }
  - { id: ERR_RULE_NOT_YET_EFFECTIVE, http_status: 409, condition: "GuidelineRule.effective_from > clock_now at publication", applies_to: "POST /guideline-rules/{id}/publish" }
  - { id: ERR_REMEDIATION_INCOMPLETE, http_status: 409, condition: "An ImpactAssessment of the app is still OPEN, IN_ASSESSMENT, REMEDIATION_REQUIRED or OVERDUE, or a MARK_REMEDIATED was attempted while an affected feature mapping is not PASSED or WAIVED_BY_PLATFORM", applies_to: "POST /submissions/{id}/queue, POST /rollout-plans, /start, /advance, POST /impact-assessments/{id}/assess" }
  - { id: ERR_METADATA_INCOMPLETE, http_status: 409, condition: "The submission owns no MetadataLocale, or none with is_primary == true", applies_to: "POST /submissions/{id}/queue, PATCH /app-records/{id}/listing listing_action=COMPLETE_METADATA" }
  - { id: ERR_DUPLICATE_PRIMARY_LOCALE, http_status: 409, condition: "A second MetadataLocale with is_primary == true was created for the same submission, or (submission_id, locale) already exists", applies_to: "POST /metadata-locales" }
  - { id: ERR_SCREENSHOT_SET_INCOMPLETE, http_status: 409, condition: "A MetadataLocale has screenshot_counts[c] < MIN_SCREENSHOTS_PER_CLASS for some c in required_device_classes", applies_to: "POST /submissions/{id}/queue, PATCH /app-records/{id}/listing listing_action=COMPLETE_METADATA" }
  - { id: ERR_REJECTION_RESPONSE_REQUIRED, http_status: 409, condition: "A RejectionReason of the submission still has disposition == PENDING", applies_to: "POST /submissions/{id}/return-to-draft" }
  - { id: ERR_REJECTION_NOT_CONTESTED, http_status: 409, condition: "A cited rejection reason belongs to another submission, or its disposition is not CONTESTED, or its appeal_disposition is already UPHELD or OVERTURNED", applies_to: "POST /appeal-requests" }

  # --- 409 business_constraint -------------------------------------------------
  - { id: ERR_PRE_REVIEW_NOT_PASSED, http_status: 409, condition: "Submission.pre_review_passed == false at queue entry (never checked, checked with blocking reasons, or voided by a later content mutation)", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_PRE_REVIEW_STALE, http_status: 409, condition: "clock_now - pre_review_checked_at > PRE_REVIEW_FRESHNESS_HOURS (72h; equality passes)", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_DUPLICATE_BUILD_NUMBER, http_status: 409, condition: "build_number is not strictly greater than every existing build_number of the app outside state DEVELOPER_WITHDRAWN", applies_to: "POST /submissions" }
  - { id: ERR_REVIEW_POOL_OVERSUBSCRIBED, http_status: 409, condition: "Aggregate capacity_slots over intersecting OPEN windows of the same (platform, reviewer_pool_code) would exceed POOL_MAX_CONCURRENT_SLOTS; adjacency never counts as intersection", applies_to: "POST /review-capacity-windows" }
  - { id: ERR_ROLLOUT_WINDOW_CONFLICT, http_status: 409, condition: "The new plan's closed interval touches or overlaps a SCHEDULED / PHASE_ACTIVE / PAUSED plan of the same app, or starts before terminated_at + ROLLBACK_COOLDOWN_HOURS of a ROLLED_BACK plan that halted distribution", applies_to: "POST /rollout-plans, POST /rollout-plans/{id}/start" }
  - { id: ERR_ROLLOUT_MODE_MISMATCH, http_status: 409, condition: "RolloutPlan.mode != Submission.release_mode, or the submission's release_mode is MANUAL", applies_to: "POST /rollout-plans" }
  - { id: ERR_PHASE_SEQUENCE_INVALID, http_status: 409, condition: "to_phase_index != phase_index + 1, or to_phase_index > PHASE_COUNT - 1", applies_to: "POST /rollout-plans/{id}/advance" }
  - { id: ERR_APP_NOT_DISTRIBUTED, http_status: 409, condition: "AppRecord.distribution_state is NOT_DISTRIBUTED or ROLLED_BACK where a live distribution is required", applies_to: "POST /rollout-plans/{id}/rollback, POST /commerce-items/{id}/report-revenue, PATCH /app-records/{id}/listing listing_action=LIST" }
  - { id: ERR_WAIVER_NOT_PERMITTED, http_status: 409, condition: "A waiver was attempted on a SAFETY-category guideline mapping, or a DISMISS triage was attempted on a CRITICAL finding", applies_to: "POST /feature-mappings/{id}/waive, POST /behavior-findings/{id}/triage" }
  - { id: ERR_EVIDENCE_REQUIRED, http_status: 409, condition: "A self-review PASS without evidence_ref, a waiver without a 20+ character waiver_reason, or a DISPUTE/DISMISS triage without justification", applies_to: "POST /feature-mappings/{id}/self-review, /waive, POST /behavior-findings/{id}/triage" }
  - { id: ERR_IMPACT_TOO_SEVERE, http_status: 409, condition: "ACCEPT_NO_CHANGE was attempted with impact_severity > ACCEPT_NO_CHANGE_SEVERITY_CEILING (6.00 inclusive) or on a SAFETY-category rule", applies_to: "POST /impact-assessments/{id}/assess action=ACCEPT_NO_CHANGE" }
  - { id: ERR_EXTERNAL_LINK_NOT_PERMITTED, http_status: 409, condition: "An EXTERNAL_PAYMENT_LINK item declares entitlement_class == DIGITAL_CONTENT, or is submitted while no ACTIVE DISTRIBUTION_CERT of the account carries the EXTERNAL_PAYMENT_LINK entitlement", applies_to: "POST /commerce-items, POST /commerce-items/{id}/submit" }

  # --- 409 business_temporal ---------------------------------------------------
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 409, condition: "clock_now > Submission.rejected_at + APPEAL_WINDOW_DAYS * 24h (equality still inside the window)", applies_to: "POST /appeal-requests" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http_status: 409, condition: "An AppealRequest of the same submission is already SUBMITTED or BOARD_REVIEW", applies_to: "POST /appeal-requests" }
  - { id: ERR_PHASE_DWELL_NOT_MET, http_status: 409, condition: "clock_now < phase_entered_at + MIN_PHASE_DWELL_HOURS (equality passes); a RESUME restarts the dwell", applies_to: "POST /rollout-plans/{id}/advance" }
  - { id: ERR_ROLLOUT_NOT_DUE, http_status: 409, condition: "clock_now < RolloutPlan.scheduled_start_at (equality passes)", applies_to: "POST /rollout-plans/{id}/start" }
  - { id: ERR_NO_REVIEW_CAPACITY, http_status: 409, condition: "The queue-entry eligibility filter of calculations.review_capacity_allocation yields the empty candidate set", applies_to: "POST /submissions/{id}/queue" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http_status: 409, condition: "current_utc is earlier than the stored logical clock", applies_to: "POST /_clock/set_current_utc" }

  # --- 409 business_fiscal -----------------------------------------------------
  - { id: ERR_EXPEDITE_QUOTA_EXHAUSTED, http_status: 409, condition: "PublisherAccount.expedite_credits_remaining == 0 at grant time (EXPEDITE_CREDITS_PER_WINDOW per rolling 365 days)", applies_to: "POST /expedite-requests/{id}/decide outcome=GRANT" }
  - { id: ERR_STANDING_TOO_LOW, http_status: 409, condition: "PublisherAccount.standing_score_rolling_365 < EXPEDITE_STANDING_FLOOR (60.00 inclusive)", applies_to: "POST /expedite-requests, POST /expedite-requests/{id}/decide" }
  - { id: ERR_REVENUE_ALREADY_REPORTED, http_status: 409, condition: "CommerceItem.reported_period_label is already set, or period_label is already in PublisherAccount.settlement_finalized_periods", applies_to: "POST /commerce-items/{id}/report-revenue" }

# =============================================================================
# §1.7 RBAC Permission Matrix (7 roles, segregation of duties)
# Publisher-side duties are split three ways and no publisher role may perform
# another's step; on the platform side the operator who decided a review may
# never decide its appeal. `identity` is mandatory: entity_backed roles carry
# X-Publisher-Account-Id and are tenancy-scoped at validations priority 20;
# opaque roles carry only X-User-ID and skip tenancy entirely.
# =============================================================================
roles:

  - name: PublisherAdmin
    description: "Owns the account, its signing material and its commerce catalog. Cannot submit builds, cannot self-review compliance and cannot drive releases."
    identity: entity_backed:PublisherAccount
    exclusive_operations:
      - "POST /publisher-accounts/{id}/membership-renewal"
      - "POST /signing-credentials"
      - "POST /signing-credentials/{id}/activate"
      - "POST /signing-credentials/{id}/revoke"
      - "POST /app-records"
      - "POST /commerce-items"
      - "POST /commerce-items/{id}/submit"
      - "POST /commerce-items/{id}/report-revenue"
    shared_operations:
      - "POST /signing-credentials/{id}/report-compromise (with PlatformPolicyAdmin)"
      - "PATCH /app-records/{id}/listing (with PlatformPolicyAdmin, which may only DELIST)"
      - "POST /_clock/set_current_utc (with every role)"
      - "All GET endpoints of its own account (with the other publisher roles and Auditor)"

  - name: ReleaseManager
    description: "Owns build submission, store metadata and the staged rollout. Cannot self-review guideline mappings, cannot answer rejection reasons and cannot file appeals."
    identity: entity_backed:PublisherAccount
    exclusive_operations:
      - "POST /submissions"
      - "POST /submissions/{id}/queue"
      - "POST /submissions/{id}/withdraw"
      - "POST /submissions/{id}/return-to-draft"
      - "POST /metadata-locales"
      - "POST /rollout-plans"
      - "POST /rollout-plans/{id}/start"
      - "POST /rollout-plans/{id}/advance"
    shared_operations:
      - "PUT /submissions/{id}/age-rating (with ComplianceOfficer)"
      - "POST /expedite-requests (with ComplianceOfficer)"
      - "POST /rollout-plans/{id}/hold (with PlatformPolicyAdmin)"
      - "POST /rollout-plans/{id}/rollback (with PlatformPolicyAdmin)"
      - "POST /_clock/set_current_utc (with every role)"
      - "All GET endpoints of its own account"

  - name: ComplianceOfficer
    description: "Owns guideline mapping, pre-submission self-review, the privacy declaration, rejection responses, appeals and impact remediation. Cannot create builds, cannot queue them and cannot start a rollout."
    identity: entity_backed:PublisherAccount
    exclusive_operations:
      - "POST /feature-mappings"
      - "POST /feature-mappings/{id}/self-review"
      - "POST /submissions/{id}/pre-review-check"
      - "PUT /submissions/{id}/privacy-declaration"
      - "POST /rejection-reasons/{id}/response"
      - "POST /appeal-requests"
      - "POST /appeal-requests/{id}/withdraw"
      - "POST /impact-assessments/{id}/assess"
    shared_operations:
      - "PUT /submissions/{id}/age-rating (with ReleaseManager)"
      - "POST /expedite-requests (with ReleaseManager)"
      - "POST /behavior-findings/{id}/triage (with PlatformPolicyAdmin; only action=DISPUTE is available to this role)"
      - "POST /_clock/set_current_utc (with every role)"
      - "All GET endpoints of its own account"

  - name: PlatformReviewer
    description: "Reviews queued builds and commerce items. May never judge an appeal of its own decision, and may never decide a build it did not claim."
    identity: opaque
    exclusive_operations:
      - "POST /submissions/{id}/claim"
      - "POST /submissions/{id}/decision"
      - "POST /commerce-items/{id}/review"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "Cross-account GET endpoints for submissions, app records, mappings, findings, rejection reasons, credentials and capacity windows (with the other platform roles and Auditor)"

  - name: PlatformAppealBoard
    description: "Hears appeals and rules on expedited review quota. Structurally separated from the reviewer who produced the decision under appeal."
    identity: opaque
    exclusive_operations:
      - "POST /appeal-requests/{id}/board-review"
      - "POST /appeal-requests/{id}/decide"
      - "POST /expedite-requests/{id}/decide"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "Cross-account GET endpoints for appeals, expedite requests, submissions, rejection reasons, app records and publisher standing (with the other platform roles and Auditor)"

  - name: PlatformPolicyAdmin
    description: "Owns the guideline corpus, the scanner findings, reviewer capacity, account enforcement and platform-side emergency controls."
    identity: opaque
    exclusive_operations:
      - "POST /publisher-accounts"
      - "POST /publisher-accounts/{id}/enforcement"
      - "POST /guideline-rules"
      - "POST /guideline-rules/{id}/publish"
      - "POST /feature-mappings/{id}/waive"
      - "POST /behavior-findings"
      - "POST /review-capacity-windows"
      - "POST /review-capacity-windows/{id}/close"
    shared_operations:
      - "POST /behavior-findings/{id}/triage (with ComplianceOfficer; actions RECONCILE and DISMISS are exclusive to this role)"
      - "POST /signing-credentials/{id}/report-compromise (with PublisherAdmin)"
      - "PATCH /app-records/{id}/listing (with PublisherAdmin; restricted to listing_action=DELIST)"
      - "POST /rollout-plans/{id}/hold (with ReleaseManager)"
      - "POST /rollout-plans/{id}/rollback (with ReleaseManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "All cross-account GET endpoints"

  - name: Auditor
    description: "Read-only oversight across every account. Holds no mutating permission whatsoever, including the remediation endpoints."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "Every GET endpoint in §1.5 across all accounts, including GET /publisher-accounts/{id}/standing, GET /app-records/{id}/compliance-summary and GET /app-records/{id}/commerce-settlement"
      - "POST /_clock/set_current_utc (with every role)"
