            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: PORT_STATE_CONTROL, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: PSC_OFFICER, indicator_organism_concentration: 12.0, tss_mg_per_l: 10.0, findings: ["BWMS-13"] }
