          trigger:
            - call: "POST /builders-risk/loss-payments/${pay2}/void"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
              captures: { pay2_status: $.data.status }
          assert:
            - "ind_cr == 53230557 and paid_1 == 39333234 with reserve_1 == 13897323 after P1"
            - "eroded_2 == 39897233 after P2, matching sum(CoveragePart.eroded_cents) = 39333234 + 0 + 563999"
            - "pay2_status == VOIDED and the row is retained: GET /builders-risk/loss-payments?claim_id=${cr} returns 2 rows, one ISSUED and one VOIDED"
            - "after the void: CoveragePart.${cp_soft}.eroded_cents == 0 and available_cents == 300000000 - exactly the pre-payment values"
            - "after the void: CoveragePart.${cp_mos}.eroded_cents == 39333234 and available_cents == 960666766 - the untouched part is NOT reset"
            - "after the void: CoveragePart.${cp_it}.eroded_cents == 0 and available_cents == 200000000"
            - "after the void: BuildersRiskPolicy.${pl1}.eroded_total_cents == 39333234 == Claim.${cr}.paid_cents, and outstanding_reserve_cents is back to 13897323"
            - "Claim.${cr}.total_incurred_cents == 53230557 at every checkpoint - before P1, after P1, after P2 and after the void"
            - "Claim.${cr}.payment_status == PARTIALLY_PAID before and after the void and adjustment_status stays ADJUSTED - the void does not reset the claim, only the one payment"
            - "available_cents + eroded_cents == sublimit_cents holds for all three parts at every checkpoint"
