              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ADMIN
          trigger:
            - call: "POST /api/v1/production-batches/${batch_exp_id}/start-production"
              payload: {}
              as: PRODUCTION_SUPERVISOR
              captures: { err_result: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_REQUIRED (validation expired: completed ~2026-08-01 + 30 days = ~2026-08-31, now 2026-09-15 > valid_until)"

      - name: audit_recency_window_365_days
        grounds:
          - calculations.supplier_risk_rating
          - validations[priority=17]
        distinguishing_aspect: |
          Interval semantics: audit must be within a 365-day lookback window from the
          current timestamp. An audit dated 366 days ago is rejected as too old, while
          one at exactly 365 days ago is accepted. This is a trailing-window check
          (not a fixed interval), distinct from the validation-expiry point-in-window
          semantics.
        test_recipe:
          setup:
            - "Two PENDING_AUDIT Suppliers exist."
