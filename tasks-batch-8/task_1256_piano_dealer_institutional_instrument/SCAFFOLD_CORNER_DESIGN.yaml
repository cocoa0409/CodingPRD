  # ==================================================================
  # Section: validations (violation -> error, one per uncovered rule)
  # ==================================================================
  - section: validations
    instances:
      - name: order_with_offered_appraisal_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TRADE_IN_NOT_ACCEPTED]"]
        distinguishing_aspect: "Referential rule: an appraisal still in OFFERED (not ACCEPTED) cannot back an order — ERR_TRADE_IN_NOT_ACCEPTED."
        test_recipe:
          setup: ["Customer; appraisal evaluated to OFFERED but never accepted; AVAILABLE instrument 500000"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
