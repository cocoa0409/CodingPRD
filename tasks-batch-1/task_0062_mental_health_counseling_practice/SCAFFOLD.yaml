scenario: "Mental Health Counseling Practice Management: therapist license/supervision hours, CPT 90791/90834 billing, insurance In-Network, sliding fee scale, crisis assessment, safety plan, Telehealth cross-state"
domain_name: mental-health-counseling-practice
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (Therapist, Patient, Appointment, Claim,
  # CrisisAssessment, etc.). No deep URL nesting; child discovery via filtered-list GETs.

  state_machine_shape: branching
  # Appointment forks RENDERED -> {CLAIMED, WRITTEN_OFF}; Claim has a revert loop
  # (DENIED -> RESUBMITTED -> ADJUDICATED). CrisisAssessment branches on risk band.

  relationship_patterns:
    - one_to_many        # Therapist 1:N StateLicense, Patient 1:N InsurancePolicy
    - flat_foreign_key   # Appointment references Therapist + Patient by FK
    - cross_aggregate    # Claim references Appointment + InsurancePolicy across aggregates

  role_model: peer_roles
  # ClinicalDirector (compliance/licensure authority), Therapist (acts on own
  # appointments/notes), Biller (claims/billing), FrontDesk (scheduling/patients).
  # No single role is a strict superset; ownership checks apply to Therapist.

  consistency_model: immediate
  # All cascades (claim adjudication -> ledger, appointment render -> supervision
  # accrual, crisis high-risk -> appointment hold) settle atomically in one request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: clinician legal name
      - name: home_state_code
        type: string
        source: input
        description: >-
          two-letter state where the clinician's practice is physically based; optional
          informational field, not used in any gate (licensure is governed by StateLicense rows)
        constraints: USPS two-letter code, uppercase when provided
        default: null
      - name: credential_status
        type: enum
        source: computed
        description: >-
          lifecycle of the clinician's right to render billable services; derived
          and advanced by the credentialing state machine
        constraints: one of {ASSOCIATE, SUPERVISED_PRACTICE, INDEPENDENT, SUSPENDED}
        default: ASSOCIATE
      - name: requires_supervision
        type: boolean
        source: computed
        description: >-
          true while credential_status IN {ASSOCIATE, SUPERVISED_PRACTICE};
          false once INDEPENDENT. Gates whether rendered sessions need a co-signed note.
        default: true
      - name: verified_direct_hours
        type: number
        source: computed
        description: >-
          sum over this therapist's Appointments in status COMPLETED whose ClinicalNote
          is CO_SIGNED of (duration_minutes / 60), 2 dp. Verified supervision-hours variant.
        default: 0
      - name: projected_direct_hours
        type: number
        source: computed
        description: >-
          sum over this therapist's Appointments in status IN {SCHEDULED, RENDERED, COMPLETED}
          of (duration_minutes / 60), 2 dp. Forward-looking supervision-hours variant.
        default: 0
      - name: verified_supervision_hours
        type: number
        source: computed
        description: >-
          sum of SupervisionLog.hours for this therapist whose log status == ACCEPTED, 2 dp
        default: 0
      - name: supervisor_id
        type: string
        source: input
        description: >-
          FK -> Therapist.id; nullable; the INDEPENDENT clinician who supervises this
          ASSOCIATE/SUPERVISED_PRACTICE clinician and co-signs their notes
        constraints: must reference a Therapist whose credential_status == INDEPENDENT when set
        default: null

  - name: StateLicense
    parent: null
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the clinician this license belongs to
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the licensing jurisdiction
        constraints: uppercase two-letter
      - name: license_number
        type: string
        source: input
        description: board-issued license identifier
      - name: status
        type: enum
        source: computed
        description: license lifecycle; advanced by the StateLicense state machine
        constraints: one of {ACTIVE, EXPIRED, REVOKED}
        default: ACTIVE
      - name: expires_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the license lapses
      - name: telehealth_authorized
        type: boolean
        source: input
        description: >-
          whether this state license permits telehealth delivery to patients
          physically located in this state_code
        default: true

  - name: SupervisionLog
    parent: null
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the supervisee whose hours this log records
      - name: supervisor_id
        type: string
        source: input
        description: FK -> Therapist.id; the INDEPENDENT clinician providing supervision
      - name: hours
        type: number
        source: input
        description: supervision hours recorded by this session, 2 dp
        constraints: "> 0"
      - name: logged_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the supervision occurred
      - name: status
        type: enum
        source: computed
        description: review lifecycle of this supervision record
        constraints: one of {SUBMITTED, ACCEPTED, REJECTED}
        default: SUBMITTED

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: patient legal name
      - name: location_state_code
        type: string
        source: input
        description: >-
          two-letter USPS code of the state where the patient is physically located
          during sessions; governs telehealth cross-state licensure checks
        constraints: uppercase two-letter
      - name: annual_household_income
        type: number
        source: input
        description: gross annual household income in whole dollars, used for sliding fee scale
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: number of persons in the patient's household, used for FPL computation
        constraints: ">= 1"
      - name: fpl_percent
        type: number
        source: computed
        description: >-
          annual_household_income as a percentage of the federal poverty line for
          household_size, 2 dp; FPL = FPL_BASE + FPL_PER_ADDL * (household_size - 1)
        default: 0
      - name: sliding_fee_multiplier
        type: number
        source: computed
        description: >-
          banded multiplier applied to standard CPT rates for self-pay sessions; derived
          from fpl_percent per the sliding_fee_scale calculation
        default: 1.00
      - name: status
        type: enum
        source: computed
        description: patient record lifecycle
        constraints: one of {ACTIVE, ON_CLINICAL_HOLD, DISCHARGED}
        default: ACTIVE

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient this coverage belongs to
      - name: contract_id
        type: string
        source: input
        description: FK -> PayerContract.id; the payer contract governing rates and network status
      - name: cost_share_model
        type: enum
        source: input
        description: how patient responsibility is computed for in-network claims
        constraints: one of {COPAY, COINSURANCE}
      - name: copay_cents
        type: integer
        source: input
        description: fixed per-session patient copay in cents; used when cost_share_model == COPAY
        default: 0
        constraints: ">= 0"
      - name: coinsurance_rate
        type: number
        source: input
        description: patient coinsurance fraction (0..1); used when cost_share_model == COINSURANCE
        default: 0
        constraints: 0 <= value <= 1
      - name: deductible_total_cents
        type: integer
        source: input
        description: annual plan deductible in cents
        default: 0
        constraints: ">= 0"
      - name: deductible_met_cents
        type: integer
        source: computed
        description: >-
          cumulative cents applied to this policy's deductible by ADJUDICATED claims;
          monotonically non-decreasing until reset
        default: 0

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: insurance payer name
      - name: in_network
        type: boolean
        source: input
        description: >-
          whether the practice holds an in-network agreement with this payer; out-of-network
          claims are billed at standard CPT rate with no allowed-amount cap
      - name: contracted_rate_90791_cents
        type: integer
        source: input
        description: in-network contracted allowed amount for CPT 90791 in cents
        constraints: ">= 0"
      - name: contracted_rate_90834_cents
        type: integer
        source: input
        description: in-network contracted allowed amount for CPT 90834 in cents
        constraints: ">= 0"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the rendering clinician
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient seen
      - name: cpt_code
        type: enum
        source: input
        description: billing procedure code for the session
        constraints: one of {"90791", "90834"}
      - name: modality
        type: enum
        source: input
        description: delivery modality
        constraints: one of {IN_PERSON, TELEHEALTH}
      - name: start_at
        type: datetime
        source: input
        description: ISO 8601 UTC session start instant
      - name: duration_minutes
        type: integer
        source: input
        description: session length in minutes
        constraints: "90791 must be 60; 90834 must be 45"
      - name: status
        type: enum
        source: computed
        description: appointment lifecycle; advanced by the Appointment state machine
        constraints: one of {SCHEDULED, RENDERED, COMPLETED, CLAIMED, WRITTEN_OFF, CANCELLED}
        default: SCHEDULED
      - name: payment_path
        type: enum
        source: input
        description: how the session is paid for
        constraints: one of {INSURANCE, SELF_PAY}
      - name: insurance_policy_id
        type: string
        source: input
        description: >-
          FK -> InsurancePolicy.id; nullable; required when payment_path == INSURANCE,
          must be null when payment_path == SELF_PAY
        default: null
      - name: patient_charge_cents
        type: integer
        source: computed
        description: >-
          for SELF_PAY: standard CPT rate * Patient.sliding_fee_multiplier, in cents,
          stamped at RENDERED. For INSURANCE: copied from the resulting Claim.patient_responsibility_cents
          at CLAIMED. 0 until rendered.
        default: 0

  - name: ClinicalNote
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the session this note documents
      - name: narrative
        type: string
        source: input
        description: progress-note text
      - name: status
        type: enum
        source: computed
        description: documentation lifecycle; advanced by the ClinicalNote state machine
        constraints: one of {DRAFT, SIGNED, CO_SIGNED}
        default: DRAFT
      - name: signed_by_id
        type: string
        source: system
        description: FK -> Therapist.id; nullable; the rendering clinician who signed
        default: null
      - name: cosigned_by_id
        type: string
        source: system
        description: FK -> Therapist.id; nullable; the supervisor who co-signed
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the rendered session being billed
      - name: insurance_policy_id
        type: string
        source: computed
        description: FK -> InsurancePolicy.id; copied from the appointment at creation
      - name: cpt_code
        type: enum
        source: computed
        description: copied from the appointment
        constraints: one of {"90791", "90834"}
      - name: billed_charge_cents
        type: integer
        source: computed
        description: standard CPT rate in cents, stamped at claim creation
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: >-
          min(billed_charge_cents, contracted rate for the CPT) when payer in_network;
          equals billed_charge_cents when out-of-network. Stamped at ADJUDICATED.
        default: 0
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: cents of allowed_amount applied to the policy deductible at ADJUDICATED
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: patient portion of allowed_amount per cost_share_model, stamped at ADJUDICATED
        default: 0
      - name: payer_paid_cents
        type: integer
        source: computed
        description: >-
          insurer portion = allowed_amount_cents - patient_responsibility_cents,
          stamped at ADJUDICATED
        default: 0
      - name: status
        type: enum
        source: computed
        description: claim lifecycle; advanced by the Claim state machine
        constraints: one of {SUBMITTED, ADJUDICATED, DENIED, RESUBMITTED, VOID}
        default: SUBMITTED

  - name: CrisisAssessment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient being assessed
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the assessing clinician
      - name: ideation_score
        type: integer
        source: input
        description: suicidal-ideation severity 0..3
        constraints: 0 <= value <= 3
      - name: plan_score
        type: integer
        source: input
        description: presence/specificity of plan 0..3
        constraints: 0 <= value <= 3
      - name: means_access_score
        type: integer
        source: input
        description: access to lethal means 0..3
        constraints: 0 <= value <= 3
      - name: prior_attempts_score
        type: integer
        source: input
        description: prior-attempt history 0..3
        constraints: 0 <= value <= 3
      - name: risk_score
        type: number
        source: computed
        description: weighted 0..100 risk score, 2 dp; see crisis_risk_score calculation
        default: 0
      - name: risk_band
        type: enum
        source: computed
        description: banded risk derived from risk_score
        constraints: one of {LOW, MODERATE, HIGH}
        default: LOW
      - name: status
        type: enum
        source: computed
        description: assessment lifecycle; advanced by the CrisisAssessment state machine
        constraints: one of {OPEN, RESOLVED}
        default: OPEN

  - name: SafetyPlan
    parent: null
    common_fields: true
    fields:
      - name: crisis_assessment_id
        type: string
        source: input
        description: FK -> CrisisAssessment.id; the HIGH-risk assessment this plan addresses
      - name: warning_signs
        type: string
        source: input
        description: documented personal warning signs
      - name: coping_strategies
        type: string
        source: input
        description: documented internal coping strategies
      - name: emergency_contacts
        type: array
        source: input
        description: list of crisis-line / emergency contacts
        constraints: non-empty array

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: Therapist
    initial_state: ASSOCIATE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ASSOCIATE
        to: SUPERVISED_PRACTICE
        trigger: "POST /therapists/{id}/promote"
        actor: ClinicalDirector
        preconditions:
          - "Therapist.verified_direct_hours >= ASSOCIATE_TO_SUPERVISED_HOURS (1500)"
          - "request expected_therapist_version matches Therapist.version"
        side_effects:
          - "Therapist.requires_supervision stays true"
          - "increments Therapist.version by 1"
        note: >-
          A supervisor_id is NOT required to promote — it governs note co-signing while
          requires_supervision is true, not credential advancement. This also lets the first
          INDEPENDENT clinician be bootstrapped without a pre-existing INDEPENDENT supervisor.
      - from: SUPERVISED_PRACTICE
        to: INDEPENDENT
        trigger: "POST /therapists/{id}/promote"
        actor: ClinicalDirector
        preconditions:
          - "Therapist.verified_direct_hours >= INDEPENDENT_HOURS (3000)"
          - "Therapist.verified_supervision_hours >= verified_direct_hours / SUPERVISION_RATIO (20)"
          - "Therapist has at least one StateLicense in status ACTIVE"
          - "request expected_therapist_version matches Therapist.version"
        side_effects:
          - "Therapist.requires_supervision set false"
          - "increments Therapist.version by 1"
      - from: ASSOCIATE
        to: SUSPENDED
        trigger: "POST /therapists/{id}/suspend"
        actor: ClinicalDirector
        preconditions:
          - "request expected_therapist_version matches Therapist.version"
        side_effects:
          - "all this therapist's Appointments in status SCHEDULED transition to CANCELLED (cascade)"
          - "increments Therapist.version by 1"
      - from: SUPERVISED_PRACTICE
        to: SUSPENDED
        trigger: "POST /therapists/{id}/suspend"
        actor: ClinicalDirector
        preconditions:
          - "request expected_therapist_version matches Therapist.version"
        side_effects:
          - "all this therapist's Appointments in status SCHEDULED transition to CANCELLED (cascade)"
          - "increments Therapist.version by 1"
      - from: INDEPENDENT
        to: SUSPENDED
        trigger: "POST /therapists/{id}/suspend"
        actor: ClinicalDirector
        preconditions:
          - "request expected_therapist_version matches Therapist.version"
        side_effects:
          - "all this therapist's Appointments in status SCHEDULED transition to CANCELLED (cascade)"
          - "increments Therapist.version by 1"

  - entity: StateLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advances past expires_on (evaluated on read of license-gated operations)"
        actor: system
        preconditions:
          - "current_utc >= StateLicense.expires_on"
        side_effects:
          - "license no longer satisfies licensure preconditions for new Appointments"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /state-licenses/{id}/revoke"
        actor: ClinicalDirector
        preconditions: []
        side_effects:
          - "license no longer satisfies licensure preconditions for new Appointments"

  - entity: SupervisionLog
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /supervision-logs/{id}/accept"
        actor: ClinicalDirector
        preconditions:
          - "the log's supervisor_id references an INDEPENDENT therapist"
        side_effects:
          - "Therapist.verified_supervision_hours recomputed for the supervisee (cascade)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /supervision-logs/{id}/reject"
        actor: ClinicalDirector
        preconditions: []
        side_effects: []

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [WRITTEN_OFF, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RENDERED
        trigger: "POST /appointments/{id}/render"
        actor: Therapist
        preconditions:
          - "Appointment.start_at <= current_utc"
          - "rendering Therapist.credential_status != SUSPENDED"
          - "the Therapist holds a StateLicense in status ACTIVE for Patient.location_state_code"
          - "if modality == TELEHEALTH that StateLicense.telehealth_authorized == true"
          - "Patient.status != ON_CLINICAL_HOLD"
        side_effects:
          - "for SELF_PAY: stamp Appointment.patient_charge_cents = self_pay_charge calculation"
          - "Therapist.projected_direct_hours recomputed (cascade)"
      - from: RENDERED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Therapist
        preconditions:
          - "a ClinicalNote exists for this appointment in status SIGNED or CO_SIGNED"
          - "if rendering Therapist.requires_supervision == true the note must be CO_SIGNED"
        side_effects:
          - "Therapist.verified_direct_hours recomputed for the rendering therapist (cascade)"
      - from: COMPLETED
        to: CLAIMED
        trigger: "POST /claims (INSURANCE path) — claim creation marks the appointment CLAIMED"
        actor: Biller
        preconditions:
          - "Appointment.payment_path == INSURANCE"
          - "no existing Claim references this appointment in status other than VOID"
        side_effects:
          - "a Claim is created in status SUBMITTED for this appointment (cascade)"
      - from: COMPLETED
        to: WRITTEN_OFF
        trigger: "POST /appointments/{id}/write-off"
        actor: Biller
        preconditions:
          - "Appointment.payment_path == SELF_PAY"
        side_effects:
          - "Appointment.patient_charge_cents set to 0"
        note: >-
          branch divergence: from COMPLETED a session forks to CLAIMED (insurance billing,
          spawns a Claim) or WRITTEN_OFF (self-pay charity write-off, zeroes the charge).
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel OR cascade from Therapist suspend"
        actor: FrontDesk
        preconditions: []
        side_effects: []

  - entity: ClinicalNote
    initial_state: DRAFT
    terminal_states: [CO_SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /clinical-notes/{id}/sign"
        actor: Therapist
        preconditions:
          - "acting Therapist.id == the rendering Therapist of the linked Appointment"
        side_effects:
          - "ClinicalNote.signed_by_id set to acting therapist id"
      - from: SIGNED
        to: CO_SIGNED
        trigger: "POST /clinical-notes/{id}/cosign"
        actor: Therapist
        preconditions:
          - "acting Therapist.id == the rendering therapist's supervisor_id"
          - "acting Therapist.credential_status == INDEPENDENT"
        side_effects:
          - "ClinicalNote.cosigned_by_id set to acting therapist id"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: Biller
        preconditions:
          - "request expected_claim_version matches Claim.version"
        side_effects:
          - "stamp allowed_amount_cents, deductible_applied_cents, patient_responsibility_cents, payer_paid_cents via insurance_responsibility calculation"
          - "InsurancePolicy.deductible_met_cents increased by deductible_applied_cents (cascade)"
          - "linked Appointment.patient_charge_cents set to patient_responsibility_cents (cascade)"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: Biller
        preconditions:
          - "request expected_claim_version matches Claim.version"
        side_effects:
          - "increments Claim.version by 1"
      - from: DENIED
        to: RESUBMITTED
        trigger: "POST /claims/{id}/resubmit"
        actor: Biller
        preconditions:
          - "request expected_claim_version matches Claim.version"
        side_effects:
          - "increments Claim.version by 1"
        note: "revert loop: a DENIED claim cycles back via RESUBMITTED to ADJUDICATED."
      - from: RESUBMITTED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: Biller
        preconditions:
          - "request expected_claim_version matches Claim.version"
        side_effects:
          - "stamp allowed_amount_cents, deductible_applied_cents, patient_responsibility_cents, payer_paid_cents via insurance_responsibility calculation"
          - "InsurancePolicy.deductible_met_cents increased by deductible_applied_cents (cascade)"
          - "linked Appointment.patient_charge_cents set to patient_responsibility_cents (cascade)"
          - "increments Claim.version by 1"
      - from: ADJUDICATED
        to: VOID
        trigger: "POST /claims/{id}/void"
        actor: Biller
        preconditions:
          - "request expected_claim_version matches Claim.version"
        side_effects:
          - "InsurancePolicy.deductible_met_cents decreased by this claim's deductible_applied_cents (compensating reversal cascade)"
          - "linked Appointment.patient_charge_cents reset to 0 and Appointment status reverted COMPLETED (cascade)"
          - "increments Claim.version by 1"
        note: "compensating action — voiding an adjudicated claim must restore deductible_met_cents to its pre-adjudication value."

  - entity: CrisisAssessment
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /crisis-assessments (creation, system stamps risk_score/risk_band)"
        actor: Therapist
        preconditions:
          - "Patient exists and Patient.status != DISCHARGED"
        side_effects:
          - "stamp risk_score and risk_band via crisis_risk_score calculation"
          - "if risk_band == HIGH then Patient.status set to ON_CLINICAL_HOLD (cascade)"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /crisis-assessments/{id}/resolve"
        actor: Therapist
        preconditions:
          - "if CrisisAssessment.risk_band == HIGH a SafetyPlan must exist for this assessment"
        side_effects:
          - "if no other OPEN CrisisAssessment exists for the patient, Patient.status reverts to ACTIVE (cascade)"
        note: >-
          cross-entity guard — a HIGH-risk assessment cannot be resolved until a SafetyPlan
          is attached; resolution lifts the patient's clinical hold.

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
# No true CREATE-with-supersede races exist in this domain: every write-write
# conflict that looks like a race (a second claim on the same appointment, a
# second suspend/promote on the same therapist) is fully covered by a state
# precondition or a uniqueness rule (ERR_CLAIM_ALREADY_EXISTS, ERR_INVALID_STATE)
# that a strictly-sequential second request observes and is rejected by — so per
# §1.2.1's serial-observability filter none qualify as concurrency_rules.
#
# OCC version matching is still used as a defensive guard on the claim-lifecycle
# and therapist-credential mutations (validation priority 18, ERR_STALE_VERSION,
# 412): the write endpoints take expected_<parent>_version and bump the parent's
# version on success, so a client carrying a stale version is rejected. This is a
# deterministic validation, not a wall-clock race.
concurrency_rules: []

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: sliding_fee_scale
    trigger: "computed on Patient create and on PATCH /patients/{id}/financials; read on appointment render for SELF_PAY"
    algorithm: tiered_pricing
    formula: |
      fpl = FPL_BASE + FPL_PER_ADDL * (household_size - 1)
      fpl_percent = round(annual_household_income / fpl * 100, 2)
      # banded multiplier — band boundaries are inclusive on the upper edge (<=)
      if fpl_percent <= 150: sliding_fee_multiplier = 0.20
      elif fpl_percent <= 200: sliding_fee_multiplier = 0.40
      elif fpl_percent <= 250: sliding_fee_multiplier = 0.60
      elif fpl_percent <= 300: sliding_fee_multiplier = 0.80
      else: sliding_fee_multiplier = 1.00
    input_set: "single Patient's annual_household_income + household_size"
    constants:
      FPL_BASE: 15060
      FPL_PER_ADDL: 5380
    precision: "fpl_percent 2 dp round_half_up; multiplier exact band value"
    variants: []

  - name: self_pay_charge
    trigger: "Appointment SCHEDULED -> RENDERED for payment_path == SELF_PAY"
    algorithm: tiered_pricing
    formula: |
      std = STD_RATE_CENTS[cpt_code]   # 90791 -> 22000, 90834 -> 15000
      patient_charge_cents = round(std * Patient.sliding_fee_multiplier)
      # round_half_up to nearest cent (integer cents)
    input_set: "the rendered Appointment's cpt_code + the patient's sliding_fee_multiplier"
    constants:
      STD_RATE_90791_CENTS: 22000
      STD_RATE_90834_CENTS: 15000
    precision: "integer cents, round_half_up"
    variants: []

  - name: insurance_responsibility
    trigger: "Claim SUBMITTED/RESUBMITTED -> ADJUDICATED"
    algorithm: waterfall_allocation
    formula: |
      std = STD_RATE_CENTS[cpt_code]
      billed = std
      if PayerContract.in_network:
        contracted = CONTRACTED_RATE_CENTS[cpt_code]   # from PayerContract
        allowed = min(billed, contracted)
      else:
        allowed = billed
      # deductible-first waterfall, THEN cost-share on the remainder
      remaining_deductible = max(0, InsurancePolicy.deductible_total_cents - InsurancePolicy.deductible_met_cents)
      deductible_applied = min(allowed, remaining_deductible)
      after_deductible = allowed - deductible_applied
      if cost_share_model == COPAY:
        cost_share = min(copay_cents, after_deductible)
      else: # COINSURANCE
        cost_share = round(after_deductible * coinsurance_rate)   # round_half_up to cents
      patient_responsibility = deductible_applied + cost_share
      payer_paid = allowed - patient_responsibility
    input_set: >-
      one Claim's cpt_code, its PayerContract network status + contracted rate,
      and the InsurancePolicy's deductible_total_cents, current deductible_met_cents,
      cost_share_model, copay_cents, coinsurance_rate
    constants:
      STD_RATE_90791_CENTS: 22000
      STD_RATE_90834_CENTS: 15000
    precision: "integer cents; coinsurance product round_half_up to nearest cent"
    variants:
      - name: in_network_allowed_cap
        when: "PayerContract.in_network == true"
        difference: "allowed = min(billed, contracted_rate); patient/payer split is over the capped allowed amount"
      - name: out_of_network_uncapped
        when: "PayerContract.in_network == false"
        difference: "allowed = billed (no contracted cap); patient responsibility is computed on the full billed charge"

  - name: supervision_direct_hours
    trigger: "recomputed on Appointment RENDERED (projected) and COMPLETED+CO_SIGNED (verified); read at Therapist promotion"
    algorithm: aggregation
    formula: |
      # VERIFIED variant
      verified_direct_hours = round(
        sum(a.duration_minutes for a in Appointments
            where a.therapist_id == T.id
              and a.status == COMPLETED
              and note(a).status == CO_SIGNED) / 60.0, 2)
      # PROJECTED variant
      projected_direct_hours = round(
        sum(a.duration_minutes for a in Appointments
            where a.therapist_id == T.id
              and a.status in {SCHEDULED, RENDERED, COMPLETED}) / 60.0, 2)
    input_set: "one Therapist's Appointments filtered by status (and note co-sign for verified)"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "2 dp, round_half_up"
    variants:
      - name: verified
        when: "credential-promotion eligibility and audit"
        difference: "counts only COMPLETED appointments whose ClinicalNote is CO_SIGNED"
      - name: projected
        when: "caseload forecasting / supervisor dashboard"
        difference: "counts SCHEDULED + RENDERED + COMPLETED regardless of note co-sign status"

  - name: crisis_risk_score
    trigger: "CrisisAssessment creation"
    algorithm: weighted_scoring
    formula: |
      raw = W_IDEATION*ideation_score + W_PLAN*plan_score
          + W_MEANS*means_access_score + W_PRIOR*prior_attempts_score
      risk_score = round(raw / 3.0 * 100, 2)   # each factor is 0..3; normalize to 0..100
      # band boundaries: HIGH at score >= 70 (inclusive), MODERATE at >= 40, else LOW
      if risk_score >= 70: risk_band = HIGH
      elif risk_score >= 40: risk_band = MODERATE
      else: risk_band = LOW
    input_set: "one CrisisAssessment's four factor scores"
    constants:
      W_IDEATION: 0.30
      W_PLAN: 0.30
      W_MEANS: 0.25
      W_PRIOR: 0.15
      HIGH_THRESHOLD: 70
      MODERATE_THRESHOLD: 40
    precision: "risk_score 2 dp round_half_up"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: >-
      ownership — when a Therapist acts on an Appointment/ClinicalNote, X-User-ID
      must equal the rendering Therapist.id (or supervisor_id for cosign)
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /appointments/{id}/render, /complete; POST /clinical-notes/{id}/sign, /cosign"

  - priority: 4
    category: existence
    check: "all path ids and required FK references resolve to existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: >-
      required-field / type / enum-membership / range validation of the request body
      (e.g. ideation_score in 0..3, cpt_code in {90791,90834}, household_size >= 1)
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: business_constraint
    check: >-
      duration_minutes must match the cpt_code (90791 -> 60, 90834 -> 45) on appointment create
    error_id: ERR_CPT_DURATION_MISMATCH
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 7
    category: business_constraint
    check: >-
      payment_path coherence on appointment create — INSURANCE requires a non-null
      insurance_policy_id whose patient_id == the appointment's patient_id; SELF_PAY
      requires insurance_policy_id to be null
    error_id: ERR_PAYMENT_PATH_INVALID
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: >-
      crisis safety gate — a CrisisAssessment with risk_band == HIGH cannot be resolved
      until a SafetyPlan exists for it
    error_id: ERR_SAFETY_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /crisis-assessments/{id}/resolve"

  - priority: 10
    category: business_safety
    check: >-
      clinical-hold gate — an Appointment cannot be rendered while its Patient.status
      == ON_CLINICAL_HOLD
    error_id: ERR_PATIENT_ON_HOLD
    http_status: 409
    applies_to: "POST /appointments/{id}/render"

  - priority: 11
    category: business_referential
    check: >-
      licensure gate — at render, the rendering Therapist must hold a StateLicense in
      status ACTIVE whose state_code == Patient.location_state_code
    error_id: ERR_NO_ACTIVE_LICENSE_IN_STATE
    http_status: 409
    applies_to: "POST /appointments/{id}/render"

  - priority: 12
    category: business_referential
    check: >-
      telehealth cross-state gate — at render, when modality == TELEHEALTH the matching
      StateLicense for Patient.location_state_code must have telehealth_authorized == true
    error_id: ERR_TELEHEALTH_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /appointments/{id}/render"

  - priority: 13
    category: business_referential
    check: >-
      supervision gate — completing an appointment rendered by a Therapist whose
      requires_supervision == true demands the ClinicalNote be CO_SIGNED (not merely SIGNED)
    error_id: ERR_COSIGN_REQUIRED
    http_status: 409
    applies_to: "POST /appointments/{id}/complete"

  - priority: 14
    category: business_constraint
    check: >-
      promotion eligibility — verified_direct_hours and verified_supervision_hours must
      meet the threshold for the requested credential step
    error_id: ERR_PROMOTION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /therapists/{id}/promote"

  - priority: 15
    category: business_temporal
    check: >-
      appointment overlap — a new Appointment for a Therapist whose [start_at,
      start_at+duration_minutes) interval overlaps an existing non-terminal Appointment
      for the same Therapist is rejected (half-open intervals; adjacency allowed)
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 16
    category: business_temporal
    check: >-
      patient overlap — a new Appointment whose [start_at, start_at+duration_minutes]
      CLOSED interval touches or overlaps an existing non-terminal Appointment for the
      same Patient is rejected (closed intervals; back-to-back adjacency is also rejected)
    error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 17
    category: business_constraint
    check: >-
      one-live-claim — a Claim cannot be created for an Appointment that already has a
      Claim in any status other than VOID
    error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /claims"

  - priority: 18
    category: business_constraint
    check: "optimistic-concurrency version match on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims; /claims/{id}/adjudicate, /deny, /resubmit, /void; /therapists/{id}/promote, /suspend"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:

  # ---- Therapist ----
  - method: POST
    path: "/therapists"
    description: "register a clinician (starts ASSOCIATE)"
    roles: [ClinicalDirector]
    code: 201
    input: [full_name, "home_state_code?", "supervisor_id?"]
    output: Therapist
    side_effects: ["Therapist created in credential_status ASSOCIATE, requires_supervision true"]
  - method: GET
    path: "/therapists/{id}"
    description: "fetch a therapist with computed credential + hour fields"
    roles: [ClinicalDirector, Therapist, Biller, FrontDesk]
    code: 200
    input: []
    output: Therapist
    side_effects: []
  - method: GET
    path: "/therapists"
    description: "list therapists; filter by supervisor_id for supervisee discovery"
    roles: [ClinicalDirector, Therapist, Biller, FrontDesk]
    code: 200
    input: ["supervisor_id?", "limit?", "offset?"]
    output: Therapist[]
    side_effects: []
  - method: POST
    path: "/therapists/{id}/promote"
    description: "advance credential_status one step (ASSOCIATE->SUPERVISED_PRACTICE->INDEPENDENT)"
    roles: [ClinicalDirector]
    code: 200
    input: [expected_therapist_version]
    output: Therapist
    side_effects: ["credential_status advances", "requires_supervision recomputed", "increments Therapist.version by 1"]
  - method: POST
    path: "/therapists/{id}/suspend"
    description: "suspend a clinician; cascades cancellation of their scheduled appointments"
    roles: [ClinicalDirector]
    code: 200
    input: [expected_therapist_version]
    output: Therapist
    side_effects: ["credential_status -> SUSPENDED", "this therapist's SCHEDULED Appointments -> CANCELLED (cascade)", "increments Therapist.version by 1"]

  # ---- StateLicense ----
  - method: POST
    path: "/state-licenses"
    description: "issue a state license to a therapist"
    roles: [ClinicalDirector]
    code: 201
    input: [therapist_id, state_code, license_number, expires_on, "telehealth_authorized?"]
    output: StateLicense
    side_effects: ["StateLicense created in status ACTIVE"]
  - method: GET
    path: "/state-licenses/{id}"
    description: "fetch a state license"
    roles: [ClinicalDirector, Therapist, Biller, FrontDesk]
    code: 200
    input: []
    output: StateLicense
    side_effects: []
  - method: GET
    path: "/state-licenses"
    description: "list licenses; filter by therapist_id (FK reverse-reachability for StateLicense.therapist_id)"
    roles: [ClinicalDirector, Therapist, Biller, FrontDesk]
    code: 200
    input: ["therapist_id?", "state_code?", "limit?", "offset?"]
    output: StateLicense[]
    side_effects: []
  - method: POST
    path: "/state-licenses/{id}/revoke"
    description: "revoke a license"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: StateLicense
    side_effects: ["StateLicense.status -> REVOKED"]

  # ---- SupervisionLog ----
  - method: POST
    path: "/supervision-logs"
    description: "record a supervision session (starts SUBMITTED)"
    roles: [ClinicalDirector, Therapist]
    code: 201
    input: [therapist_id, supervisor_id, hours, logged_on]
    output: SupervisionLog
    side_effects: ["SupervisionLog created in status SUBMITTED"]
  - method: GET
    path: "/supervision-logs/{id}"
    description: "fetch a supervision log"
    roles: [ClinicalDirector, Therapist]
    code: 200
    input: []
    output: SupervisionLog
    side_effects: []
  - method: GET
    path: "/supervision-logs"
    description: "list supervision logs; filter by therapist_id or supervisor_id (FK reverse-reachability)"
    roles: [ClinicalDirector, Therapist]
    code: 200
    input: ["therapist_id?", "supervisor_id?", "limit?", "offset?"]
    output: SupervisionLog[]
    side_effects: []
  - method: POST
    path: "/supervision-logs/{id}/accept"
    description: "accept a supervision log; recomputes supervisee verified_supervision_hours"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: SupervisionLog
    side_effects: ["status -> ACCEPTED", "supervisee Therapist.verified_supervision_hours recomputed (cascade)"]
  - method: POST
    path: "/supervision-logs/{id}/reject"
    description: "reject a supervision log"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: SupervisionLog
    side_effects: ["status -> REJECTED"]

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "register a patient; computes fpl_percent + sliding_fee_multiplier"
    roles: [FrontDesk, ClinicalDirector]
    code: 201
    input: [full_name, location_state_code, annual_household_income, household_size]
    output: Patient
    side_effects: ["sliding_fee_scale computed -> fpl_percent, sliding_fee_multiplier"]
  - method: GET
    path: "/patients/{id}"
    description: "fetch a patient"
    roles: [FrontDesk, ClinicalDirector, Therapist, Biller]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "list patients"
    roles: [FrontDesk, ClinicalDirector, Therapist, Biller]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: PATCH
    path: "/patients/{id}/financials"
    description: "update income/household; recomputes sliding fee scale"
    roles: [FrontDesk, ClinicalDirector]
    code: 200
    input: [annual_household_income, household_size]
    output: Patient
    side_effects: ["sliding_fee_scale recomputed"]

  # ---- InsurancePolicy ----
  - method: POST
    path: "/insurance-policies"
    description: "attach an insurance policy to a patient"
    roles: [FrontDesk, ClinicalDirector, Biller]
    code: 201
    input: [patient_id, contract_id, cost_share_model, "copay_cents?", "coinsurance_rate?", "deductible_total_cents?"]
    output: InsurancePolicy
    side_effects: ["InsurancePolicy created with deductible_met_cents 0"]
  - method: GET
    path: "/insurance-policies/{id}"
    description: "fetch an insurance policy"
    roles: [FrontDesk, ClinicalDirector, Biller]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "list policies; filter by patient_id (FK reverse-reachability for InsurancePolicy.patient_id)"
    roles: [FrontDesk, ClinicalDirector, Biller]
    code: 200
    input: ["patient_id?", "contract_id?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  # ---- PayerContract ----
  - method: POST
    path: "/payer-contracts"
    description: "create a payer contract (network status + contracted CPT rates)"
    roles: [ClinicalDirector, Biller]
    code: 201
    input: [payer_name, in_network, contracted_rate_90791_cents, contracted_rate_90834_cents]
    output: PayerContract
    side_effects: ["PayerContract created"]
  - method: GET
    path: "/payer-contracts/{id}"
    description: "fetch a payer contract"
    roles: [ClinicalDirector, Biller, FrontDesk]
    code: 200
    input: []
    output: PayerContract
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "schedule a session; runs CPT/duration, payment-path, and overlap checks"
    roles: [FrontDesk, Therapist, ClinicalDirector]
    code: 201
    input: [therapist_id, patient_id, cpt_code, modality, start_at, duration_minutes, payment_path, "insurance_policy_id?"]
    output: Appointment
    side_effects: ["Appointment created in status SCHEDULED"]
  - method: GET
    path: "/appointments/{id}"
    description: "fetch an appointment"
    roles: [FrontDesk, Therapist, ClinicalDirector, Biller]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "list appointments; filter by therapist_id, patient_id, or insurance_policy_id (FK reverse-reachability)"
    roles: [FrontDesk, Therapist, ClinicalDirector, Biller]
    code: 200
    input: ["therapist_id?", "patient_id?", "insurance_policy_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/render"
    description: "mark a session rendered; enforces licensure + telehealth + hold gates"
    roles: [Therapist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> RENDERED", "SELF_PAY: patient_charge_cents stamped via self_pay_charge", "Therapist.projected_direct_hours recomputed (cascade)"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "complete a rendered session; enforces note + cosign gates"
    roles: [Therapist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> COMPLETED", "Therapist.verified_direct_hours recomputed (cascade)"]
  - method: POST
    path: "/appointments/{id}/write-off"
    description: "charity write-off a completed self-pay session"
    roles: [Biller]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> WRITTEN_OFF", "patient_charge_cents set to 0"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "cancel a scheduled session"
    roles: [FrontDesk, ClinicalDirector]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED"]

  # ---- ClinicalNote ----
  - method: POST
    path: "/clinical-notes"
    description: "create a draft progress note for an appointment"
    roles: [Therapist]
    code: 201
    input: [appointment_id, narrative]
    output: ClinicalNote
    side_effects: ["ClinicalNote created in status DRAFT"]
  - method: GET
    path: "/clinical-notes/{id}"
    description: "fetch a clinical note"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: []
    output: ClinicalNote
    side_effects: []
  - method: GET
    path: "/clinical-notes"
    description: "list clinical notes; filter by appointment_id, signed_by_id, or cosigned_by_id (FK reverse-reachability)"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: ["appointment_id?", "signed_by_id?", "cosigned_by_id?", "status?", "limit?", "offset?"]
    output: ClinicalNote[]
    side_effects: []
  - method: POST
    path: "/clinical-notes/{id}/sign"
    description: "rendering therapist signs the note"
    roles: [Therapist]
    code: 200
    input: []
    output: ClinicalNote
    side_effects: ["status -> SIGNED", "signed_by_id stamped"]
  - method: POST
    path: "/clinical-notes/{id}/cosign"
    description: "supervisor co-signs a signed note"
    roles: [Therapist]
    code: 200
    input: []
    output: ClinicalNote
    side_effects: ["status -> CO_SIGNED", "cosigned_by_id stamped"]

  # ---- Claim ----
  - method: POST
    path: "/claims"
    description: "open an insurance claim for a completed insurance appointment; OCC on appointment"
    roles: [Biller]
    code: 201
    input: [appointment_id, expected_appointment_version]
    output: Claim
    side_effects: ["Claim created SUBMITTED", "Appointment COMPLETED -> CLAIMED (cascade)", "increments Appointment.version by 1"]
  - method: GET
    path: "/claims/{id}"
    description: "fetch a claim with adjudication ledger fields"
    roles: [Biller, ClinicalDirector]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "list claims; filter by appointment_id or insurance_policy_id (FK reverse-reachability)"
    roles: [Biller, ClinicalDirector]
    code: 200
    input: ["appointment_id?", "insurance_policy_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/adjudicate"
    description: "adjudicate a claim; runs insurance_responsibility, applies deductible, syncs charge"
    roles: [Biller]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status -> ADJUDICATED", "ledger fields stamped", "InsurancePolicy.deductible_met_cents += deductible_applied_cents (cascade)", "Appointment.patient_charge_cents synced (cascade)", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/deny"
    description: "deny a submitted/resubmitted claim"
    roles: [Biller]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status -> DENIED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/resubmit"
    description: "resubmit a denied claim back into adjudication queue"
    roles: [Biller]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status -> RESUBMITTED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/void"
    description: "void an adjudicated claim; compensating reversal of deductible + charge"
    roles: [Biller]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status -> VOID", "InsurancePolicy.deductible_met_cents -= deductible_applied_cents (compensating cascade)", "Appointment reverts to COMPLETED, patient_charge_cents reset to 0 (cascade)", "increments Claim.version by 1"]

  # ---- CrisisAssessment ----
  - method: POST
    path: "/crisis-assessments"
    description: "record a crisis assessment; computes risk score/band; HIGH places patient on clinical hold"
    roles: [Therapist, ClinicalDirector]
    code: 201
    input: [patient_id, therapist_id, ideation_score, plan_score, means_access_score, prior_attempts_score]
    output: CrisisAssessment
    side_effects: ["risk_score/risk_band stamped via crisis_risk_score", "HIGH -> Patient.status ON_CLINICAL_HOLD (cascade)"]
  - method: GET
    path: "/crisis-assessments/{id}"
    description: "fetch a crisis assessment"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: []
    output: CrisisAssessment
    side_effects: []
  - method: GET
    path: "/crisis-assessments"
    description: "list crisis assessments; filter by patient_id or therapist_id (FK reverse-reachability)"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: ["patient_id?", "therapist_id?", "status?", "limit?", "offset?"]
    output: CrisisAssessment[]
    side_effects: []
  - method: POST
    path: "/crisis-assessments/{id}/resolve"
    description: "resolve a crisis assessment; HIGH requires a SafetyPlan; lifts clinical hold"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: []
    output: CrisisAssessment
    side_effects: ["status -> RESOLVED", "if no other OPEN assessment for the patient, Patient.status -> ACTIVE (cascade)"]

  # ---- SafetyPlan ----
  - method: POST
    path: "/safety-plans"
    description: "attach a safety plan to a HIGH-risk crisis assessment"
    roles: [Therapist, ClinicalDirector]
    code: 201
    input: [crisis_assessment_id, warning_signs, coping_strategies, emergency_contacts]
    output: SafetyPlan
    side_effects: ["SafetyPlan created"]
  - method: GET
    path: "/safety-plans/{id}"
    description: "fetch a safety plan"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []
  - method: GET
    path: "/safety-plans"
    description: "list safety plans; filter by crisis_assessment_id (FK reverse-reachability)"
    roles: [Therapist, ClinicalDirector]
    code: 200
    input: ["crisis_assessment_id?", "limit?", "offset?"]
    output: SafetyPlan[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the server's current UTC clock"
    roles: [ClinicalDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set; license expiry + render time gates evaluated against it"]

  # ---- Test-driving hour injection ----
  - method: POST
    path: "/_inject/therapist_hours"
    description: >-
      test-driving endpoint: directly set a therapist's verified_direct_hours and
      verified_supervision_hours. Promotion thresholds (1500 / 3000 direct hours)
      are not reachable by rendering thousands of appointments in a test, so this
      injects the accrued totals that the supervision_direct_hours calculation would
      otherwise produce, letting promotion-gate tests run from a small fixture.
    roles: [ClinicalDirector]
    code: 200
    input: [therapist_id, verified_direct_hours, verified_supervision_hours]
    output: Therapist
    side_effects: ["Therapist.verified_direct_hours and verified_supervision_hours set to the injected values"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting therapist is not the owner/supervisor required for this action"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource (path id or FK) does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, enum/range violation"
  - id: ERR_CPT_DURATION_MISMATCH
    http: 422
    condition: "duration_minutes does not match the CPT code (90791->60, 90834->45)"
  - id: ERR_PAYMENT_PATH_INVALID
    http: 422
    condition: "INSURANCE without a matching insurance_policy_id, or SELF_PAY with one"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_SAFETY_PLAN_REQUIRED
    http: 409
    condition: "resolving a HIGH-risk crisis assessment with no SafetyPlan attached"
  - id: ERR_PATIENT_ON_HOLD
    http: 409
    condition: "rendering an appointment whose patient is ON_CLINICAL_HOLD"
  - id: ERR_NO_ACTIVE_LICENSE_IN_STATE
    http: 409
    condition: "rendering therapist has no ACTIVE StateLicense for the patient's location state"
  - id: ERR_TELEHEALTH_NOT_AUTHORIZED
    http: 409
    condition: "telehealth render but the matching state license is not telehealth_authorized"
  - id: ERR_COSIGN_REQUIRED
    http: 409
    condition: "completing a supervised therapist's appointment with a note that is only SIGNED"
  - id: ERR_PROMOTION_NOT_ELIGIBLE
    http: 409
    condition: "promotion requested but verified hours / supervision ratio / license threshold not met"
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "therapist half-open interval overlaps an existing non-terminal appointment"
  - id: ERR_PATIENT_DOUBLE_BOOKED
    http: 409
    condition: "patient closed interval touches or overlaps an existing non-terminal appointment"
  - id: ERR_CLAIM_ALREADY_EXISTS
    http: 409
    condition: "appointment already has a non-VOID claim"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the current parent version (OCC)"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ClinicalDirector
    description: "credentialing + compliance authority; licenses, promotions, suspensions, supervision review"
    identity: opaque
    exclusive_operations:
      - "POST /therapists, /therapists/{id}/promote, /therapists/{id}/suspend"
      - "POST /state-licenses, /state-licenses/{id}/revoke"
      - "POST /supervision-logs/{id}/accept, /reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /supervision-logs (with Therapist)"
      - "POST /patients, PATCH /patients/{id}/financials (with FrontDesk)"
      - "POST /insurance-policies, /payer-contracts (with Biller/FrontDesk)"
      - "POST /appointments, /appointments/{id}/cancel (with FrontDesk)"
      - "POST /crisis-assessments, /crisis-assessments/{id}/resolve, /safety-plans (with Therapist)"
      - "all GET reads"

  - name: Therapist
    description: "clinician; renders/completes own appointments, writes/signs/cosigns notes, runs crisis assessments"
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /appointments/{id}/render, /appointments/{id}/complete"
      - "POST /clinical-notes, /clinical-notes/{id}/sign, /clinical-notes/{id}/cosign"
    shared_operations:
      - "POST /appointments (with FrontDesk/ClinicalDirector)"
      - "POST /supervision-logs (with ClinicalDirector)"
      - "POST /crisis-assessments, /crisis-assessments/{id}/resolve, /safety-plans (with ClinicalDirector)"
      - "GET reads on therapists, licenses, supervision-logs, patients, appointments, notes, crisis, safety-plans"

  - name: Biller
    description: "billing/revenue-cycle; manages claims and write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /claims, /claims/{id}/adjudicate, /deny, /resubmit, /void"
      - "POST /appointments/{id}/write-off"
    shared_operations:
      - "POST /insurance-policies, /payer-contracts (with ClinicalDirector/FrontDesk)"
      - "GET reads on therapists, licenses, patients, policies, contracts, appointments, claims"

  - name: FrontDesk
    description: "scheduling + intake; manages patients, policies, and appointment scheduling"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /patients, PATCH /patients/{id}/financials (with ClinicalDirector)"
      - "POST /insurance-policies (with Biller/ClinicalDirector)"
      - "POST /appointments, /appointments/{id}/cancel (with Therapist/ClinicalDirector)"
      - "GET reads on therapists, patients, policies, appointments"
