    code: 201
    input: [sales_order_line_id, request_reason, requested_units, "is_exchange?", "replacement_product_id?", expected_line_version]
    output: ReturnRequest
    side_effects:
      - "Create ReturnRequest with status REQUESTED"
      - "SalesOrderLine.status → RETURN_REQUESTED"
      - "increments SalesOrderLine.version by 1"

  - method: GET
    path: "/impact-program/return-requests"
    description: "List return requests with filtering"
    roles: [CustomerService, ImpactAuditor, ProvisioningPartner]
    code: 200
    input: ["sales_order_line_id?", "donation_liability_id?", "status?", "is_exchange?", "limit?", "offset?"]
    output: "ReturnRequest[]"
    side_effects: []

  - method: GET
    path: "/impact-program/return-requests/{return_id}"
    description: "Get one return request"
    roles: [CustomerService, ImpactAuditor, ProvisioningPartner]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  - method: POST
    path: "/impact-program/return-requests/{return_id}/approve"
    description: "Approve a return request, including post-window defect claims"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "status → APPROVED and SalesOrderLine.status → RETURN_APPROVED"

  - method: POST
    path: "/impact-program/return-requests/{return_id}/reject"
    description: "Reject a return request, returning the line to OPEN"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "status → REJECTED and SalesOrderLine.status → OPEN"

  - method: POST
    path: "/impact-program/return-requests/{return_id}/credit"
    description: "Credit a refund or ship a replacement; the donation obligation is never reversed"
    roles: [CustomerService]
    code: 200
    input: ["replacement_product_id?"]
    output: ReturnRequest
    side_effects:
      - "refund_amount_cents computed by calculations.return_refund_amount, or 0 for an exchange"
      - "liability_delta_units stays 0 and DonationLiability.final_liability_units is unchanged"
      - "SalesOrderLine.status → RETURNED_CREDITED or EXCHANGED_REPLACED"
      - "SalesOrder.refunded_cents and returned_units recomputed"

  - method: GET
    path: "/impact-program/liabilities"
    description: "List donation liability rows with filtering"
