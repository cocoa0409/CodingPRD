              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
            - call: "POST /change-orders/${co_id}/approve"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /change-orders/${co_id}/rescind"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          assert:
            - "ChangeOrder.${co_id}.status == RESCINDED with approved_by_user_id == null and applied_at == null"
            - "CONSERVED: UnitOrder.${unit_id}.change_order_total_cents == 0, exactly its pre-approval value"
            - "CONSERVED: ApparatusProgram.${prog_id}.committed_cents == 68276000, exactly its pre-approval value, with no rounding drift"
            - "CONSERVED: UnitOrder.${unit_id}.rear_axle_load_kg == 10110, front_axle_load_kg == 5810, gross_weight_kg == 15920 and weight_status == WITHIN_LIMITS again"
            - "UnitOrder.${unit_id}.open_change_order_count == 0 (RESCINDED is not an open status)"
            - "NOT COMPENSATED: UnitOrder.${unit_id}.certification_status remains NOT_SUBMITTED and CertificationTest.${test_id}.status remains INVALIDATED with invalidated_reason WEIGHT_STATUS_CHANGE"
            - "NOT COMPENSATED: UnitOrder.${unit_id}.build_status remains IN_PRODUCTION and InspectionTrip.${trip_final_id}.status remains CANCELLED"
            - "UnitOrder.${unit_id}.price_cents == 68276000 — never touched by approve or rescind"
            - "a second rescind on ${co_id} is rejected 409 ERR_INVALID_CHANGE_ORDER_STATE, so the compensation cannot be double-applied"

      - name: reservation_release_conserves_slot_count_and_frees_bay_capacity
        grounds:
          - state_machines.ChassisReservation.CONFIRMED_to_RELEASED
          - calculations.slot_line_utilization
          - calculations.bay_concurrent_load
          - entities.UnitOrder.fields.long_lead_status
        distinguishing_aspect: |
          available_slot_count is a conserved quantity: reserve then release returns
          the line to total_slot_count exactly, and CASCADE C's hop 3 makes the
          compensation visible in a second resource pool — the cancelled
          PRE_CONSTRUCTION trip hands its committee_size back to the bay, so a trip
          previously rejected for capacity is admitted afterwards.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE, one RELEASED specification, one PUMPER UnitOrder at build_status SPEC_LOCKED"
            - "one SupplierSlotLine with total_slot_count 1, one CONFIRMED ChassisReservation linked to the unit (long_lead_status CONFIRMED)"
            - "one PlantBay with max_concurrent_visitors 10 holding one SCHEDULED PRE_CONSTRUCTION trip of committee_size 8"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Conservation program", agency_name: "Millbrook Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", unit_order_id: "${unit_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_id: $.data.id }
            - call: "POST /chassis-reservations/${res_id}/confirm"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /plant-bays"
              payload: { name: "Bay D", max_concurrent_visitors: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", committee_size: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_pre_id: $.data.id }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "MID_CONSTRUCTION", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", committee_size: 5 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /chassis-reservations/${res_id}/release"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "MID_CONSTRUCTION", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", committee_size: 5 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_retry_id: $.data.id }
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_v_after: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", unit_order_id: "${unit_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v_after}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res2_id: $.data.id }
          assert:
            - "before the release the size-5 MID_CONSTRUCTION trip is rejected 409 ERR_BAY_CAPACITY_EXCEEDED: 8 + 5 == 13 > 10 over intersecting closed windows"
            - "ChassisReservation.${res_id}.status == RELEASED after the trigger"
            - "CONSERVED: SupplierSlotLine.${line_id}.reserved_slot_count == 0 and available_slot_count == 1 == total_slot_count — release exactly undoes reserve"
            - "CASCADE C hop 2: UnitOrder.${unit_id}.chassis_reservation_id == null and long_lead_status == AT_RISK, with build_status still SPEC_LOCKED"
            - "CASCADE C hop 3: InspectionTrip.${trip_pre_id}.status == CANCELLED, returning its 8 visitors to the bay pool"
            - "the re-attempted size-5 MID_CONSTRUCTION trip is now ADMITTED (201) because the freed capacity leaves occupied == 0 over that window"
            - "the released window 2026-09-01 .. 2026-09-15 is immediately re-bookable: the new reservation ${res2_id} is admitted with no ERR_SLOT_WINDOW_CONFLICT, because a RELEASED window imposes no changeover buffer"
            - "after re-reservation SupplierSlotLine.${line_id}.reserved_slot_count == 1 and available_slot_count == 0, and UnitOrder.${unit_id}.long_lead_status is back to RESERVED"
            - "ApparatusProgram.${prog_id}.committed_cents == 68276000 throughout — slot movements never touch the fiscal ledger"
