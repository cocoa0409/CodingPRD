              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 20.00, sampling_allowed: true }
              as: DepartmentManager
              captures: { item_id: $.data.id, item_v1: $.data.version }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SPOILAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_spoilage: $.data.id }
            - call: "POST /fresh/shrink-events/${shrink_spoilage}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "u-mgr-1"
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SAMPLING", quantity_units: 4 }
