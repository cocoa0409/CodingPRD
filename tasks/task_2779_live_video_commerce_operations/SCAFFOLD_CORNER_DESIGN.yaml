            - "After the abandon: both lines are RELEASED with released_reason == CART_ABANDONED, FlashOffer.${oA2}.status == ACTIVE with remaining_qty == 1, Show.${sh1}.abandoned_cart_count == 1"
            - "Viewer 2's add succeeds and drives FlashOffer.${oA2} back to EXHAUSTED with remaining_qty == 0, held_qty == 1"
            - "Recovery returns 200; CartItem.${itA} stays RELEASED (its offer is EXHAUSTED, so it fails the eligibility predicate) while CartItem.${itB}.state == HELD"
            - "CartItem.${itB} is re-locked at effective_unit_price_cents == 3600, line_gross_cents == 3600, line_tax_cents == 315 — strictly higher than the 3420 it held before abandonment"
