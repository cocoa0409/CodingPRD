  - rule_id: resource_temporal_overlap
    instances:
      - name: agent_rest_buffer_closed_boundary_on_ot_extension
        grounds:
          - validations.priority_110
          - entities.LaborAgreement.fields.min_rest_hours
          - entities.ScheduleShift.fields.end_at
          - calculations.overtime_cost_tiered
          - errors.ERR_MIN_REST_VIOLATION
        distinguishing_aspect: |
          OT does not create a new shift, it stretches end_at, so the rest buffer between
          consecutive days is what constrains it. Extending Monday's 08:00-16:00 shift by 5.0
          hours lands end_at at 21:00, exactly 11.0 hours before Tuesday's 08:00 start, and
          equality passes -- the acceptance succeeds for 18000 cents. A further 0.5 hours would
          leave 10.5 hours and is refused, with the cycle's OT spend frozen at 18000. An
          implementation using a strict `>` on the rest gap rejects the first acceptance; one that
          compares only same-day windows accepts both.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE with min_rest_hours 11 and max_weekly_hours 45; cycle W37-BUF at REQUIREMENTS_LOCKED with ot_budget_cents 1000000; FG-A with the 2026-09-07 grid."
            - "Agent E-001 (2400 cents/hour) with PUBLISHED 08:00-16:00 shifts on 2026-09-07 and 2026-09-08 (15.00 committed hours)."
            - "Two OFFERED OT_OFFERs on the Monday shift: 5.0 hours and 0.5 hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
            - call: "POST /labor-agreements"
              payload: { code: "LA-CORE", min_rest_hours: 11, max_weekly_hours: 45, max_consecutive_days: 6, vto_min_notice_hours: 12, preference_honor_floor_pct: 0.50, ot_premium_multiplier: 1.00 }
