              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 24.0, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
          trigger:
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { disposition: "REWORK", rewind_to: "STRANDED", reason: "eccentric wall, first attempt" }
              as: QualityEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 24.0, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { disposition: "REWORK", rewind_to: "STRANDED", reason: "eccentric wall, second attempt" }
              as: QualityEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 24.0, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { disposition: "REWORK", rewind_to: "STRANDED", reason: "eccentric wall, third attempt" }
              as: QualityEngineer
              captures: { e_limit: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { disposition: "SCRAPPED", reason: "three failed rework attempts" }
              as: QualityEngineer
          assert:
            - "each EXTRUSION step computes concentricity_pct == 80.00 = round_half_up(100 * 24.0 / 30.0, 2) < 85, so quality_state lands \"NONCONFORMING\" every time"
            - "after the first REWORK: rework_count == 1, quality_state == \"PENDING\", process_state == \"STRANDED\", measurements cleared"
            - "after the second REWORK: rework_count == 2 and the lot is workable once more"
            - "${e_limit} == \"ERR_REWORK_LIMIT_EXCEEDED\" with HTTP 422: the guard is rework_count < REWORK_LIMIT 2, so the third rework is refused and rework_count stays 2"
            - "the refused rework leaves quality_state at \"NONCONFORMING\" and process_state at \"EXTRUDED\" - the lot is stuck, which is the point of the rule"
            - "the SCRAPPED disposition succeeds: process_state == \"SCRAP_CLOSED\", quality_state == \"SCRAPPED\""
            - "the ledger moves exactly once: RodPurchaseLot.${rod_id}.committed_lbs == 0.00, scrapped_lbs == 99.00, remaining_lbs == 19901.00, and 100 * 99.00 / 20000.00 == 0.50 <= 10.0 so status stays \"RECEIVED\""

