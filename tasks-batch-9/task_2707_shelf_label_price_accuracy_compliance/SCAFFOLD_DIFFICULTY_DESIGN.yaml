        grounds:
          - state_machines.ScannerAudit.SCANNING_to_CLOSED
          - calculations.audit_failure_action_type
          - calculations.associate_accountability_score
          - state_machines.Associate.CERTIFIED_to_SUSPENDED
          - state_machines.LabelTask.placement_status=PLACED_to_placement_status=UNPLACED
          - state_machines.LabelTask.print_status=PRINTED_to_print_status=REPRINT_REQUIRED
          - calculations.store_compliance_posture
        distinguishing_aspect: |
          Sideways-then-downward punitive chain of depth 5 fired by ONE close: ScannerAudit FAIL ->
          AccountabilityAction (hop 1, action_type chosen by the waterfall selector) -> Associate
          score/status (hops 2-3) -> that associate's PLACED LabelTasks revert on BOTH axes (hop 4)
          -> Store backlog and posture (hop 5). It is the opposite direction from the completion
          cascade above — this one pushes work back INTO the backlog rather than out of it — and its
          middle hop is conditional on a threshold, so the selector's choice of SUSPENSION versus
          COACHING decides whether hops 3-5 run at all.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with scanner_error_rate_threshold_pct 25.0, default_rate_variant GROSS_MISMATCH, accountability_variant OCCURRENCE_WEIGHTED."
            - "Aisle A01 has assigned_associate_id == la1, so the FAIL close has a candidate."
            - "la1 already carries ONE manually issued WRITTEN_WARNING (weight 15), so accountability_score is 85 and the waterfall selects SUSPENSION rather than COACHING."
            - "la1 owns one printed-and-placed LabelTask; the file therefore sits at PARTIALLY_EXECUTED."
            - "The audit holds 4 scan lines with exactly one +150c overcharge, so the rate lands exactly on the threshold."
