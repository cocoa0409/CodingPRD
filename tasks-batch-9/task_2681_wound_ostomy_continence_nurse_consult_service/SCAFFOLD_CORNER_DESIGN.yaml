      - name: restricted_posture_flag_rejects_approval_without_director_override
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=58]
          - errors[ERR_UNIT_POSTURE_RESTRICTED]
          - entities.SupportSurfaceOrder.fields.requires_director_override
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
        distinguishing_aspect: "Nothing about the order changes: its legality is revoked from the outside when a SECOND HAPI case pushes the Unit's survey_posture ladder to RESTRICTED and hop 5 of the validate cascade back-stamps requires_director_override on every still-REQUESTED order. The same approve call that would have succeeded before the second validation now demands an explicit override."
