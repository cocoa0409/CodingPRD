              as_user_id: "${cf_id}"
              captures: { term_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${term_err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "FuelRedemption.${cr_id}.authorization_status == \"VOIDED\" and settlement_status == \"NOT_APPLICABLE\""
            - "FuelRedemption.${cr_id}.gallons_dispensed == null and dispensed_at == null and discount_amount_cents == 0"
            - "Member.${cm_id}.available_points == 300"

      - name: revoked_household_link_cannot_be_reactivated
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.HouseholdLink.ACTIVE_to_REVOKED
          - validations[priority=46]
        distinguishing_aspect: "REVOKED is the only terminal HouseholdLink state and it has no back-edge, in deliberate contrast to SUSPENDED: activating a revoked link answers 409 ERR_INVALID_STATE_TRANSITION and the household's linked_member_count stays 0."
        test_recipe:
          setup:
            - "Banner CORE with household HH-CORE-1, member CM and an ACTIVE PRIMARY link that has been revoked; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_member
            - *cx_household
            - &cx_link
              call: "POST /household-links"
              payload: { household_id: "${chh_id}", member_id: "${cm_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              captures: { cl_id: $.data.id }
            - &cx_link_activate
              call: "POST /household-links/${cl_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - call: "POST /household-links/${cl_id}/revoke"
              payload: {}
              as: LoyaltyAnalyst
          trigger:
            - call: "POST /household-links/${cl_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { revoked_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${revoked_err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "HouseholdLink.${cl_id}.status == \"REVOKED\" and revoked_at == \"2026-08-01T00:00:00Z\""
            - "Household.${chh_id}.linked_member_count == 0 and aggregate_available_points == 0"

      - name: dispute_denial_from_investigating_skips_the_adjustment_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.PointDispute.INVESTIGATING_to_RESOLVED_DENIED
          - endpoints.POST_/point-disputes/{id}/deny
          - entities.PointDispute.fields.resolved_at
        distinguishing_aspect: "The dispute machine branches at INVESTIGATING: denying straight from INVESTIGATING reaches RESOLVED_DENIED without ever visiting ADJUSTMENT_PROPOSED, so proposed_points_delta, authority_tier and applied_ledger_entry_id all stay null and no ADJUSTMENT ledger row is written."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1 and two ACTIVE-linked members; CM holds 300 points and has transferred 100 points to the second member, which produced a TRANSFER_OUT ledger row."
            - "A FILED dispute over that TRANSFER_OUT row has been moved to INVESTIGATING; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - &cx_member2
