  # =====================================================================
  - section: validations
    instances:
      - name: duplicate_booking_same_golfer_same_slot
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_BOOKING]"]
        distinguishing_aspect: "Golfer with an existing CONFIRMED booking on a FOURSOME slot books the same slot again -> 409 ERR_DUPLICATE_BOOKING."
        test_recipe:
          setup: ["FOURSOME slot; GA already CONFIRMED. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "DupCrs", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
