            - call: "POST /charge-events"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", charge_kind: "DAMAGE", severity: "MINOR" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { amt3: $.data.amount_cents }
            - call: "GET /asset-units/${asset_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { status3: $.data.status, strikes3: $.data.damage_strikes }
