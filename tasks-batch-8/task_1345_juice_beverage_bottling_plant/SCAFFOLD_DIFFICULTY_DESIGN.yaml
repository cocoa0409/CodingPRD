      - name: formula_label_review_cycle_version_bumps
        grounds:
          - state_machines.Formula.APPROVED_to_LABEL_REVIEW
          - state_machines.Formula.LABEL_REVIEW_to_REVISION_REQUIRED
          - entities.Formula.fields.label_version
        distinguishing_aspect: |
          Cyclic machine on Formula: DRAFT -> LABEL_REVIEW -> REVISION_REQUIRED
          -> LABEL_REVIEW -> APPROVED -> LABEL_REVIEW -> APPROVED, with
          label_version incrementing only on approval (0 -> 1 -> 2) while
          rejections leave it untouched.
        test_recipe:
          setup:
            - "ACTIVE customer; formula in DRAFT (label_version 0, version 1)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "CycleLabels", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
