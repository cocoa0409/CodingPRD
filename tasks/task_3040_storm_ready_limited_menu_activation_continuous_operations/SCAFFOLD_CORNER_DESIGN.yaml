# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3040_storm_ready_limited_menu_activation_continuous_operations
#
# Breadth probe over §1.1–§1.7 claims not exercised by §1.8. Corners that
# §1.8 already covers appear as `excluded_because:` stubs with no test_recipe.
# All fixtures use the logical clock at 2026-09-10T08:00:00Z unless stated.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: storm_event_create_returns_declared_fields_and_watch_defaults
        claim_type: Creation
        grounds:
          - entities.StormEvent
          - endpoints.POST_/storm-events
        distinguishing_aspect: "Creating a storm with only a name returns 201 with status WATCH, warning_count 0, version 1, watch_started_at == the logical clock, and system-minted id/created_at/updated_at — no client-supplied status."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
          assert:
            - "response status is 201 and response_type is object"
            - "StormEvent.${se}.status == WATCH and warning_count == 0 and version == 1"
            - "StormEvent.${se}.watch_started_at == 2026-09-10T08:00:00.000Z"
            - "activated_at and closed_at are null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: unit_create_applies_defaults_and_full_menu
        claim_type: Defaults
        grounds:
          - entities.Unit
          - endpoints.POST_/ops/storm-events/{stormEventId}/units
        distinguishing_aspect: "A unit created without lodging_fund_cents defaults the fund to 0, menu_tier FULL, all four resource axes UP, cash_only_flag false, and last_shift_change_at null."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S exists."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
          trigger:
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          assert:
            - "Unit.${u}.menu_tier == FULL and cash_only_flag == false"
            - "Unit.${u}.lodging_fund_cents == 0 (default applied)"
            - "Unit.${u}.resource_status == {power: UP, water: UP, gas: UP, payment_network: UP}"
            - "Unit.${u}.last_shift_change_at == null and hours_since_shift_change == 0"
            - "Unit.${u}.storm_event_id == ${se}"

      - name: unit_get_refreshes_shift_clock_from_logical_time
        claim_type: Computed Fields
        grounds:
          - entities.Unit.fields.hours_since_shift_change
          - calculations.shift_change_clock
        distinguishing_aspect: "With no crew event ever stamping the unit, GET /ops/units/{id} lazily reports hours_since_shift_change as whole hours elapsed since unit creation; a client-supplied hours_since_shift_change on creation is ignored."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S, unit U created. Clock advanced to 2026-09-10T14:30:00Z (6h30m later)."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:30:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "GET /ops/units/${u}"
              as: UnitManager
              captures: { hs: $.data.hours_since_shift_change, ls: $.data.last_shift_change_at }
          assert:
            - "Unit.${u}.hours_since_shift_change == 6 (floor of 6.5 hours since creation)"
            - "Unit.${u}.last_shift_change_at == null (no stamp — the lazy read does not stamp)"

      - name: checklist_item_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ChecklistItem
        distinguishing_aspect: "ChecklistItem declares common_fields: false — its response carries id and created_at but no version and no updated_at, and no PATCH/PUT endpoint exists for it."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S, unit U, checklist run R in IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "POWER_RESTORED", result: "PASS" }
              as: UnitManager
              captures: { item: $.data.id }
          assert:
            - "the item response carries id, created_at, checklist_run_id, key, result"
            - "the item response carries no version field and no updated_at field"
            - "ChecklistItem.${item}.checklist_run_id == ${run}"

      - name: relief_pledge_get_returns_computed_fields_after_confirm
        claim_type: Retrieval
        grounds:
          - entities.ReliefPledge
          - endpoints.POST_/ops/units/{unitId}/relief-pledges/{pledgeId}/confirm
        distinguishing_aspect: "A confirmed pledge round-trips every computed field: shortfall_meals, overage_meals, shortfall_penalty_cents, reimbursement_cents; final_reimbursement_cents stays null until run-report."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S, unit U power DOWN. ReliefOrg R ACTIVE. Pledge of 10 meals for 2026-09-10 confirmed with served_count 8."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/relief-orgs"
              payload: { name: "Red Shield Relief", contact_email: "ops@redshield.example" }
              as: ReliefCoordinator
              captures: { org: $.data.id }
            - call: "POST /ops/units/${u}/relief-pledges"
              payload: { relief_org_id: "${org}", meal_count: 10, service_date: "2026-09-10" }
              as: ReliefCoordinator
              captures: { pledge: $.data.id }
            - call: "POST /ops/units/${u}/relief-pledges/${pledge}/confirm"
              payload: { served_count: 8 }
              as: ReliefCoordinator
          trigger:
            - call: "GET /ops/units/${u}/relief-pledges"
              payload: {}
              as: ReliefCoordinator
              captures: { p: "$.data[0].id", net: "$.data[0].reimbursement_cents", fin: "$.data[0].final_reimbursement_cents" }
          assert:
            - "ReliefPledge.${pledge}.shortfall_meals == 2 and overage_meals == 0"
            - "ReliefPledge.${pledge}.shortfall_penalty_cents == 200"
            - "gross 10*250 = 2500 (tier 1, bonus 0), liability 2500-200 = 2300, tax floor(2300*800/10800) = 170 -> reimbursement_cents == 2130"
            - "ReliefPledge.${pledge}.final_reimbursement_cents == null"

      - name: system_fields_id_and_version_are_server_controlled
        claim_type: System Fields
        grounds:
          - entities.StormEvent
        distinguishing_aspect: "A create body containing id/version keys cannot override system-minted values: the server ignores or rejects client-supplied system fields and always returns its own id and version 1."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta", id: "00000000-0000-0000-0000-000000000000", version: 99 }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
          assert:
            - "StormEvent.${se}.id != \"00000000-0000-0000-0000-000000000000\" (client id ignored)"
            - "StormEvent.${se}.version == 1 (client version ignored)"

      - name: crew_member_invalid_role_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CrewMember.fields.role
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "role outside the enum {GRILL_OP, SERVER, SHIFT_LEAD} is a 422 ERR_VALIDATION, not a 409 — enum membership is a body-shape check at priority 4."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S, unit U."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "MANAGER", home_unit_id: "${u}", is_jump_team: false }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION with http 422"
            - "GET /crew-members returns total_count == 0"

      - name: unit_creation_requires_parent_storm
        claim_type: Parent Relationships
        grounds:
          - entities.Unit.parent
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /ops/storm-events/{id}/units with a non-existent storm id returns 404 ERR_NOT_FOUND — nested creation validates the parent first (priority 3 existence)."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/storm-events/00000000-0000-0000-0000-000000000000/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND with http 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: storm_cancel_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StormEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel is declared only from WATCH and WARNING; an ACTIVE storm rejects cancel with ERR_INVALID_STATE and stays ACTIVE with version unchanged by the failed call."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm activated to ACTIVE (version 2)."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
          trigger:
            - call: "POST /ops/storm-events/${se}/cancel"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE with http 409"
            - "StormEvent.${se}.status == ACTIVE and version == 2 (failed transition mutates nothing)"

      - name: closed_storm_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.StormEvent
        distinguishing_aspect: "From CLOSED every action endpoint (escalate, deescalate, activate, close, cancel) returns ERR_INVALID_STATE — terminal lockdown covers all five triggers."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm with one unit, never storm-affected: activate -> deescalate (RECOVERY, no checklists) -> close (unit already FULL). Version 4."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { se_v3: $.data.version }
            - call: "POST /ops/storm-events/${se}/close"
              payload: { expected_storm_event_version: "${se_v3}" }
              as: CommandCenterAdmin
              captures: { se_v4: $.data.version }
          trigger:
            - call: "POST /ops/storm-events/${se}/escalate"
              payload: { expected_storm_event_version: "${se_v4}" }
              as: CommandCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE with http 409"
            - "StormEvent.${se}.status == CLOSED and version == 4"

      - name: cash_drop_second_record_succeeds_but_blocked_when_not_cash_only
        claim_type: Valid Transition
        grounds:
          - endpoints.POST_/ops/units/{unitId}/cash-drops
          - errors[ERR_NOT_CASH_ONLY]
        distinguishing_aspect: "Cash drops are repeatable while cash_only_flag holds (append-only CashDrop log), and restoring the payment network flips cash_only_flag to false so the very next drop is rejected ERR_NOT_CASH_ONLY."
        test_recipe:
          setup: ["Clock at 2026-09-10T08:00:00Z. Storm S, unit U with payment DOWN (cash_only true). One drop of 5000 recorded."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "DOWN" }
              as: UnitManager
            - call: "POST /ops/units/${u}/cash-drops"
              payload: { amount_cents: 5000, shift_lead_note: "drawer skim 1" }
              as: UnitManager
              captures: { d1: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
          trigger:
            - call: "POST /ops/units/${u}/cash-drops"
              payload: { amount_cents: 2500, shift_lead_note: "drawer skim 2" }
              as: UnitManager
              captures: { err: $.data.error_id }
          assert:
            - "the first drop succeeded and CashDrop.${d1}.recorded_at == 2026-09-10T08:00:00.000Z"
            - "trigger fails with error_id == ERR_NOT_CASH_ONLY (payment network restored)"
            - "GET /ops/units/${u}/cash-drops returns total_count == 1"

      - name: checklist_rework_loop_replaces_fail_item_and_resubmits
        claim_type: cyclic
        grounds:
          - state_machines.ChecklistRun.REJECTED_to_IN_PROGRESS
          - state_machines.ChecklistRun.SUBMITTED_to_REJECTED
        distinguishing_aspect: "The REJECTED -> IN_PROGRESS rework loop reopens item entry: a FAIL item replaced by a PASS re-post lets the resubmitted run be approved, and the run's history (submitted_by/reviewed_by of the first round) is overwritten by the second round."
        test_recipe:
          setup: ["Clock 2026-09-10T09:00:00Z; storm ACTIVE; unit U power outage then all-clear at 10:00. Run opened; four PASS + one FAIL (GAS_LEAK_CHECK with note); submit at 11:00 by um-1; rejected by cc-9; rework."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "POWER_RESTORED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "WATER_POTABLE", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "FAIL", note: "odor at manifold" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "FOOD_DISCARD_LOGGED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "CASH_DRAWER_COUNTED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T11:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              as_user_id: "um-1"
              captures: { err0: $.data.error_id }
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/rework"
              payload: {}
              as: UnitManager
              captures: { st1: $.data.status }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "PASS", note: "re-tested clear" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              as_user_id: "um-1"
              captures: { st2: $.data.status }
            - call: "POST /ops/units/${u}/checklists/${run}/approve"
              payload: {}
              as: CommandCenterAdmin
              as_user_id: "cc-9"
              captures: { st3: $.data.status }
          assert:
            - "the first submit failed with ERR_CHECKLIST_INCOMPLETE (FAIL item present)"
            - "after rework ChecklistRun.${run}.status == IN_PROGRESS"
            - "re-posting GAS_LEAK_CHECK as PASS replaced the FAIL item (item count per key stays 1)"
            - "second submit succeeds: status == SUBMITTED"
            - "approval succeeds: status == APPROVED and Unit.${u}.menu_tier == FULL"

      - name: allocation_dispatch_from_reserved_and_redeploy_from_returned
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AssetAllocation
          - state_machines.Asset
        excluded_because:
          difficulty_instance: compensating_invariant / asset_return_redeploy_identity_conservation
          rationale: "The full RESERVED -> DEPLOYED -> RETURNED -> DEPLOYED cycle including Asset status echoes is asserted in the named §1.8 instance."

      - name: menu_activation_supersede_ends_previous_activation
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MenuActivation.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "Activating a new tier while one is ACTIVE supersedes the old activation atomically: old ends with ended_at == the new activation's activated_at, and exactly one ACTIVE activation exists afterwards."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U gas DOWN (TIER3) with an ACTIVE TIER3 activation. Second report flips water DOWN too while gas stays DOWN — menu_tier becomes TIER2_NO_WATER."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER3_NO_GAS" }
              as: UnitManager
              captures: { ma1: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "DOWN", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
          trigger:
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER2_NO_WATER" }
              as: UnitManager
