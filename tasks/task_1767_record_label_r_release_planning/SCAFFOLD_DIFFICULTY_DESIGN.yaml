  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_start_requires_funded_contract
        grounds:
          - state_machines.RecordingProject.PLANNED_to_RECORDING
          - validations[priority=19]
          - errors[ERR_CONTRACT_NOT_FUNDED]
        distinguishing_aspect: |
          Entity pair RecordingProject -> Contract: a project on an ACTIVE but
          advance-PENDING contract cannot start (ERR_CONTRACT_NOT_FUNDED); the
          same start succeeds after FinanceController disburses the advance.
        test_recipe:
          setup:
            - "Label defaults; memo advance 100000 executed (Contract ACTIVE, advance_status PENDING); project created"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label X1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist X1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 100000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-X1", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/contracts/${contract_id}/disburse-advance", payload: {}, as: FinanceController }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager, captures: { proj_status: $.data.status } }
          assert:
            - "First start: error_id == ERR_CONTRACT_NOT_FUNDED; project remains PLANNED"
            - "After disburse: Contract.${contract_id}.advance_status == FUNDED and RecoupmentAccount.advance_balance_cents == 100000"
            - "Second start: RecordingProject.${proj_id}.status == RECORDING"

      - name: campaign_activate_requires_release_scheduled
        grounds:
          - state_machines.PromoCampaign.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair PromoCampaign -> Release (different from Project ->
          Contract): activating a campaign whose release is still PLANNED fails;
          after the release is SCHEDULED the same activation succeeds.
        test_recipe:
          setup:
            - "Label defaults; funded contract (advance 0); SINGLE release PLANNED (assembled and locked but never scheduled); campaign DRAFT"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label X2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist X2", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-X2", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TX2", duration_seconds: 200, isrc: "USRC10000071" }, as: AnRManager, captures: { trk_id: $.data.id } }
