      - { name: estimated_payoff_cents, type: integer, source: input, default: 0, description: "Estimated lien payoff at quote (provisional variant input)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "APPRAISED | ACCEPTED | TITLED | REJECTED", constraints: "set by TradeIn state machine" }
