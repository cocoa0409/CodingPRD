              as_user_id: "${fam_id}"
              captures: { s2_id: $.data.id }
          assert:
            - "booking with the stale package version: err == ERR_STALE_VERSION (HTTP 412) — no session created, remaining_calls unchanged"
            - "booking with the refetched version: TroubleshootingSession.${s2_id}.status == SCHEDULED"
            - "SupportPackage.${pkg_id}.remaining_calls == 1 after both successful bookings (3 - 2)"

      - name: follow_up_window_boundary_and_state
        claim_type: scheduled_actions
        grounds:
        - "calculations.refund_eligibility"
        - "errors[ERR_FOLLOW_UP_WINDOW_CLOSED]"
        - "state_machines.ClientCase.COMPLETED_to_ACTIVE_SUPPORT"
        - "errors[ERR_CASE_INVALID_STATE]"
        distinguishing_aspect: "The follow-up window is completed_at + 180 days inclusive: purchase at 2027-02-12 fails ERR_FOLLOW_UP_WINDOW_CLOSED, at exactly 2027-02-11T00:00:00Z succeeds, and a second FOLLOW_UP while the case is back in ACTIVE_SUPPORT fails ERR_CASE_INVALID_STATE."
        test_recipe:
          setup: ["case completed at 2026-08-15T00:00:00Z (completed_at); child INFANT; window end = 2027-02-11T00:00:00Z"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-241", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/complete"
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-12T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "FOLLOW_UP", starts_on: "2027-02-12" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err_late: $.data.error_id }
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-11T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "FOLLOW_UP", starts_on: "2027-02-11" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { fu_id: $.data.id, fu_net: $.data.net_price_cents }
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "FOLLOW_UP", starts_on: "2027-02-11" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err_again: $.data.error_id }
          assert:
            - "one day past the window: err_late == ERR_FOLLOW_UP_WINDOW_CLOSED (422)"
            - "at exactly completed_at + 180 days: purchase succeeds; SupportPackage.${fu_id}.net_price_cents == 25415 (INFANT repeat pricing: 29900 - 4485)"
            - "ClientCase.${case_id}.status == ACTIVE_SUPPORT after the successful follow-up"
            - "second FOLLOW_UP while ACTIVE_SUPPORT: err_again == ERR_CASE_INVALID_STATE (409)"

      - name: enrollment_closed_at_start_date
        claim_type: scheduled_actions
        grounds:
        - "validations[priority=7]"
        - "errors[ERR_ENROLLMENT_CLOSED]"
        distinguishing_aspect: "Enrollment closes at 00:00:00Z on the course's starts_on date: the day before succeeds, the start date itself fails with ERR_ENROLLMENT_CLOSED."
        test_recipe:
          setup: ["GroupCourse starts_on 2026-08-20 capacity 5; two GROUP_COURSE cases; clock 2026-08-19"]
