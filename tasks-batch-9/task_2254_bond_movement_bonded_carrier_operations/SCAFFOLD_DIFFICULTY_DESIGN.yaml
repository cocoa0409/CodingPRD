              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 30.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-200" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b2: $.data.id }
