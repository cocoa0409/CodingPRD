# =============================================================================
# Task 1255: Banking Access & Safe Account Enrollment — §1.9 Corner Design
# Breadth coverage of every §1.1–§1.7 testable claim not already covered by
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml). Clock default: 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: account_standard_creation_defaults
        claim_type: creation
        grounds: [entities.AccountStandard, state_machines.AccountStandard]
        distinguishing_aspect: "POST creates a DRAFT standard with system-managed id, version 1, and created_at read from the logical clock default 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id, std_status: $.data.status, std_v: $.data.version, std_created: $.data.created_at } }
          assert:
            - "response status == DRAFT (initial state), version == 1"
            - "created_at == 2026-05-01T00:00:00Z (logical clock, not wall clock)"
            - "id is a server-minted UUID"

      - name: participant_docs_complete_computed
        claim_type: computed_fields
        grounds: [entities.Participant.fields.docs_complete, calculations.participant_pipeline]
        distinguishing_aspect: "docs_complete is computed: false while identity doc is SUBMITTED, flips to true only when an identity doc AND PROOF_OF_ADDRESS are both VERIFIED via the documents PATCH."
        test_recipe:
          setup: ["participant registered with identity doc SUBMITTED and POA VERIFIED -> docs_complete false"]
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "SUBMITTED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id, dc0: $.data.docs_complete } }
          trigger:
            - { call: "PATCH /api/participants/${p_id}/documents", payload: { id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { dc1: $.data.docs_complete, stage1: $.data.pipeline_stage } }
          assert:
            - "before PATCH: docs_complete == false (identity doc only SUBMITTED)"
            - "after PATCH: docs_complete == true and pipeline_stage == DOCS_READY (recomputed on the same response — immediate consistency)"

      - name: checkpoint_pair_created_on_opened
        claim_type: system_fields
        grounds: [entities.RetentionCheckpoint, calculations.checkpoint_schedule, state_machines.AccountApplication.SUBMITTED_to_OPENED]
        distinguishing_aspect: "Approving an application creates exactly two checkpoints with due_date = opened_at + 183d (M6, 2026-10-31) and +365d (M12, 2027-05-01), each with window_end = due + 30d."
        test_recipe:
          setup: ["CERTIFIED institution; documented participant; referral DOCS_COMPLETE; application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
            - { call: "POST /api/referrals/${ref_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${ref_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /api/account-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "GET /api/retention-checkpoints?application_id=${app_id}", payload: {}, as: CoalitionAdmin }
          assert:
            - "Exactly 2 checkpoints exist for the application: kinds {M6, M12}, both status PENDING"
            - "M6 due_date == 2026-10-31 and window_end == 2026-11-30 (opened 2026-05-01 + 183d / +30d window)"
            - "M12 due_date == 2027-05-01 and window_end == 2027-05-31"

      - name: participant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a non-existent participant UUID returns the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404, response_type == error"

      - name: grant_ledger_fields_zeroed_on_create
        claim_type: defaults
        grounds: [entities.FundingGrant, calculations.grant_ledger]
        distinguishing_aspect: "A new grant starts DRAFT with reserved_cents 0, disbursed_cents 0, available_cents == total_cents."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id, g_status: $.data.status, g_avail: $.data.available_cents } }
          assert:
            - "status == DRAFT, reserved_cents == 0, disbursed_cents == 0, available_cents == 500000"

      - name: referral_campaign_link_validation
        claim_type: parent_relationships
        grounds: [entities.Referral.fields.campaign_id, entities.Referral.fields.created_via, "errors[ERR_VALIDATION]", "errors[ERR_NOT_FOUND]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "created_via=CAMPAIGN requires campaign_id (400 when absent, 404 when non-existent, 409 when the campaign is CLOSED); created_via=NAVIGATOR rejects a supplied campaign_id."
        test_recipe:
          setup:
            - "participant P exists; campaign C created and immediately CLOSED"
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/outreach-campaigns", payload: { name: "Spring", zip_cluster: "90001", window_start: "2026-06-01", window_end: "2026-08-01", budget_cents: 50000, per_conversion_cents: 1000 }, as: CoalitionAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/outreach-campaigns/${c_id}/close", payload: {}, as: CoalitionAdmin }
          trigger:
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "CAMPAIGN" }, as: CoalitionAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "CAMPAIGN", campaign_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: CoalitionAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "CAMPAIGN", campaign_id: "${c_id}" }, as: CoalitionAdmin, captures: { err3: $.data.error_id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR", campaign_id: "${c_id}" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { err4: $.data.error_id } }
          assert:
            - "missing campaign_id with created_via=CAMPAIGN -> ERR_VALIDATION (400)"
            - "non-existent campaign_id -> ERR_NOT_FOUND (404)"
            - "CLOSED campaign -> ERR_INVALID_STATE (409)"
            - "NAVIGATOR referral carrying a campaign_id -> ERR_VALIDATION (400)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: book_from_docs_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Referral.DOCS_COMPLETE_to_BOOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "book on a DOCS_PENDING referral is an invalid-from transition; no seat is consumed."
        test_recipe:
          setup: ["CERTIFIED institution with SCHEDULED event; referral still DOCS_PENDING (participant docs incomplete)"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T09:00:00Z", ends_at: "2026-05-10T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
          trigger:
            - { call: "POST /api/referrals/${ref_id}/book", payload: { event_id: "${ev_id}" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { err: $.data.error_id } }
          assert:
            - "book fails with error_id == ERR_INVALID_STATE (referral DOCS_PENDING, not DOCS_COMPLETE)"
            - "AccountOpeningEvent.${ev_id}.booked_count remains 0"

      - name: cancel_cancelled_event_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AccountOpeningEvent.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same event is rejected and no further referral side effects fire."
        test_recipe:
          setup: ["CERTIFIED institution; event created then cancelled once"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-opening-events", payload: { institution_id: "${inst_id}", venue_code: "BR-1", starts_at: "2026-05-10T09:00:00Z", ends_at: "2026-05-10T13:00:00Z", capacity: 2, alt_id_accepted: true }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /api/account-opening-events/${ev_id}/cancel", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}" }
          trigger:
            - { call: "POST /api/account-opening-events/${ev_id}/cancel", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "second cancel fails with error_id == ERR_INVALID_STATE (terminal CANCELLED)"

      - name: referral_initial_state_docs_pending
        claim_type: initial_state
        grounds: [state_machines.Referral]
        distinguishing_aspect: "A new referral starts DOCS_PENDING with booked_event_id null and pipeline impact REFERRED on the participant."
        test_recipe:
          setup: ["participant exists"]
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id, ref_status: $.data.status } }
          assert:
            - "Referral.${ref_id}.status == DOCS_PENDING and booked_event_id == null"
            - "GET /api/participants/${p_id} shows pipeline_stage == REFERRED"

      - name: report_rejected_resubmit_recomputes_claim
        claim_type: valid_transition
        grounds: [state_machines.PartnerReport.REJECTED_to_SUBMITTED, calculations.claim_computation]
        distinguishing_aspect: "The REJECTED -> SUBMITTED rework loop recomputes the claim against current data: a second account opened between reject and resubmit raises claim_total_cents from 4963 to 9926."
        test_recipe:
          setup:
            - "CERTIFIED institution; account A1 OPENED; grant ACTIVE total 500000; report submitted then REJECTED (reservation released)"
            - "account A2 OPENED after the rejection"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p1}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r1: $.data.id } }
            - { call: "POST /api/referrals/${r1}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p1}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r1}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a1: $.data.id } }
            - { call: "POST /api/account-applications/${a1}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g_v: $.data.version } }
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-01-01", period_end: "2026-05-31", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /api/partner-reports/${rep_id}/submit", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/partner-reports/${rep_id}/review", payload: { outcome: "REJECT" }, as: CoalitionAdmin }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r2: $.data.id } }
            - { call: "POST /api/referrals/${r2}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p2}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r2}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a2: $.data.id } }
            - { call: "POST /api/account-applications/${a2}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
          trigger:
            - { call: "POST /api/partner-reports/${rep_id}/submit", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { claim2: $.data.claim_total_cents, st2: $.data.status } }
          assert:
            - "Resubmit succeeds: status REJECTED -> SUBMITTED (rework loop)"
            - "claim_total_cents == 9926 on resubmit (recomputed: two OPENED accounts x 4963), not the stale 4963 snapshot"
            - "grant.reserved_cents == 9926 after resubmit"

      - name: reinstated_application_can_open
        claim_type: valid_transition
        grounds: [state_machines.AccountApplication.DECLINED_CHEX_to_REINSTATED, state_machines.AccountApplication.REINSTATED_to_OPENED]
        distinguishing_aspect: "After the barrier case resolves (single-round accept), the REINSTATED application can be approved and spawns its checkpoint pair exactly once."
        test_recipe:
          setup: ["CERTIFIED institution; flagged participant; application DECLINED_CHEX; barrier case RESOLVED via propose+accept"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
