          assert:
            - "${sealed_status} == SEALED"
            - "${util_before} == 62.50"
            - "${lock_before} == GLUTEN"
            - "${tot} == 620267"
            - "${lot_status} == QUARANTINED"
            - "${lot_on_hand} == 50000"
            - "${lot_reserved} == 0"
            - "Lot.${lot_id}.quantity_consumed_lb == 0"
            - "OrderLine.${line_id}.allocation_status == UNALLOCATED"
            - "OrderLine.${line_id}.lot_id == null"
            - "Order.${order_id}.fulfillment_status == NEW"
            - "Order.${order_id}.pricing_status == PROVISIONAL"
            - "Order.${order_id}.total_cents == 620267"
            - "RouteStop.${stop_id}.status == CANCELLED"
            - "RouteStop.${stop_id}.sequence_no == 0"
            - "DeliveryRoute.${route_id}.status == PLANNING"
            - "DeliveryRoute.${route_id}.stop_count == 0"
            - "DeliveryRoute.${route_id}.planned_load_lb == 0"
            - "DeliveryRoute.${route_id}.utilization_pct == 0.00"
            - "DeliveryRoute.${route_id}.allergen_class_lock == NONE"
            - "WarehouseZone.${zone_glu_id}.on_hand_lb == 50000"

