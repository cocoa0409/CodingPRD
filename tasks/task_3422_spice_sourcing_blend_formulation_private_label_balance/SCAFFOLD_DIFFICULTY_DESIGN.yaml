            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Konya", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 5.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { m2: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Konya", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 5.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { m3: $.data.id } }
            - { call: "POST /spice/lots/${m1}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m1}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m1}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m1}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${m2}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m2}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m2}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m2}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${m3}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m3}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m3}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${m3}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/formulas", payload: { product_code: "CUMIN-PURE", name: "Pure Cumin", brand_type: BRANDED, target_flavor_units: 100.0, flavor_tolerance_pct: 2.0, max_moisture_pct: 10.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: CUMIN, target_proportion_pct: 100.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 0.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
