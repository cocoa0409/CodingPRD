# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3231_trading_card_licensing_print_runs_redemption_fulfillment
#
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# of §0.5. Nine rule_id blocks, two instances each — 18 instances total.
#
# Shared fixture anchors are defined once in Group A and aliased by name in
# later groups; every anchor's first use in an instance is where its captures
# bind, and each instance aliases anchors in the order they appear below.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: print_run_projection_authority_vs_directive_variant
        grounds:
          - calculations.print_run_projection
          - calculations.print_run_projection.variants
          - entities.PrintRunDecision.fields.authority
        distinguishing_aspect: "Two different authority arguments to the same decision produce two different frozen quantities for one identical card set: the observed-activity variant reads channel reservations while the directive variant ignores them, so declared_quantity 1500 is accepted under BRAND_DIRECTIVE and rejected under MARKET_DEMAND on the same set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active through 2029. Product line PL configured 20 boxes/case x 10 packs/box x 10 cards/pack and 50 cases printed."
            - "Card set S approved at tier BASE with print_run_quantity 500, announced true, so print_run_status is UNDECIDED."
            - "Channel reservations on PL: 10 cases HOBBY and 15 cases MASS, giving an observed base of 250 cards before the tier floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &x_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - &x_act_lic
              call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - &x_line
              call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { line_id: $.data.id, line_v1: $.data.version }
            - &x_set
              call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { set_id: $.data.id, set_v0: $.data.version }
            - &x_submit
              call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - &x_approve
              call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { set_v1: $.data.version }
            - &x_alloc_h
              call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { alloc_h_id: $.data.id }
            - &x_alloc_m
              call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "MASS", quantity_allocated: 15, effective_price_cents: 50000 }
              as: DistributionManager
              captures: { alloc_m_id: $.data.id }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "MARKET_DEMAND", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 1500, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { dec_observed_id: $.data.id }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 1500, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { dec_directive_id: $.data.id }
          trigger:
            - call: "POST /api/print-run-decisions/${dec_observed_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
            - call: "POST /api/print-run-decisions/${dec_directive_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
          assert:
            - "POST /api/print-run-decisions/${dec_observed_id} reports final_quantity == 1000, NOT 1500"
            - "the observed-variant approval returns 422 with error_id == ERR_INVALID_REQUEST"
            - "the directive-variant approval returns 200 and PrintRunDecision.${dec_directive_id}.final_quantity == 1500"
            - "CardSet.${set_id}.print_run_quantity == 1500 after the directive freeze, and the two decisions differ by exactly 500 cards for identical channel reservations"

      - name: quality_floor_variant_flips_the_same_decision_by_review_state
        grounds:
          - calculations.print_run_quality_floor
          - calculations.print_run_quality_floor.variants
          - calculations.print_run_projection
        distinguishing_aspect: "The presence or absence of one APPROVED quality claim flips the frozen quantity for identical reservation and multiplier inputs — the verifiable floor lifts 1000 to 1500, while crediting that same claim drops the next freeze back to 1000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Same license, line, set and 10+15 case channel reservations as the previous instance, so the authority-only projection is 1000."
            - "One MINOR quality claim on S with affected_quantity 100000, approved; REORDER_HIT_RATE 0.005 makes the threshold 500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - *x_alloc_h
            - *x_alloc_m
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 100000, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_floor_id: $.data.id }
            - call: "POST /api/quality-claims/${qc_floor_id}/open-review"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${qc_floor_id}/approve"
              payload: {}
              as: QualityAnalyst
          trigger:
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set_id}", authority: "MARKET_DEMAND", proposed_against_line_version: "${line_v1}", demand_multiplier: 1.0, declared_quantity: 1000, announced: false, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { dec_floor_id: $.data.id }
            - call: "POST /api/print-run-decisions/${dec_floor_id}/approve"
              payload: { expected_card_set_version: "${set_v1}", expected_product_line_version: "${line_v1}" }
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "PrintRunDecision.${dec_floor_id}.final_quantity == 1500 — the 500-card verifiable floor raises the 1000-card authority projection"
            - "the declared_quantity of 1000 is rejected with status 422 and error_id == ERR_INVALID_REQUEST"
            - "after POST /api/quality-claims/${qc_floor_id}/credit sets the claim to CREDITED, a fresh MARKET_DEMAND decision with the same inputs reports final_quantity == 1000"
            - "the two freezes differ by exactly 500 cards and the only state change between them is one claim moving APPROVED -> CREDITED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tier_snap_aggregate_pins_per_set_before_sum
        grounds:
          - calculations.tier_snap_aggregate
          - calculations.print_run_projection
          - entities.ProductLine.fields.allocated_cards
        distinguishing_aspect: "Mode (b) nested rounding: snapping each set against its OWN tier multiple before summing gives a different line total than snapping the summed quantity once, so the evaluation order is pinned per-set-then-sum and the counter-example 4500 vs 4000 is directly observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, product line PL configured 20 x 10 x 10 = 2000 cards per case."
            - "Three BASE sets under PL, approved, each with print_run_quantity 1234 so each snaps to 1500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Inserts", set_tier: "BASE", announced: true, serial_numbered: true, autograph_planned_count: 0, print_run_quantity: 1234 }
              as: ProductManager
              captures: { set2_id: $.data.id, set2_v0: $.data.version }
            - call: "POST /api/card-sets/${set2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set2_id}/approve"
              payload: { expected_card_set_version: "${set2_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Parallels", set_tier: "BASE", announced: true, serial_numbered: true, autograph_planned_count: 0, print_run_quantity: 1234 }
              as: ProductManager
              captures: { set3_id: $.data.id, set3_v0: $.data.version }
            - call: "POST /api/card-sets/${set3_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set3_id}/approve"
              payload: { expected_card_set_version: "${set3_v0}" }
              as: ProductManager
          trigger:
            - call: "GET /api/product-lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_snapped_cards: $.data.allocated_cards }
          assert:
            - "ProductLine.${line_id}.allocated_cards == 4500 — per-set ceiling then sum, NOT the 4000 that a single ceiling over sum(1234 x 3) would give"
            - "the three contributing per-set values are each 1500, so 1500 + 1500 + 1500 == 4500"
            - "ProductLine.${line_id}.sets_per_case == 2000"
            - "an INSERT-tier set at 1234 under the same line contributes 1300, so mixing tiers under one line does not use one shared multiple"

      - name: substition_ratio_and_allowance_follow_the_value_tier
        grounds:
          - calculations.redemption_substitution_ratio
          - calculations.redemption_substitution_ratio.variants
          - calculations.redemption_deadline
        distinguishing_aspect: "Mode (c) circular-looking dependency with a pinned evaluation order: the allowance is computed from the tier-selected ratio applied to the scratch value, and the tier is itself selected by that same scratch value — so ratio selection must be evaluated before the multiply, and the deadline is written at creation while the allowance is booked at settle."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved."
            - "Two redemptions on S: R1 with estimated_value_cents 150000 and R2 with 400000. Both opened 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-7001", signer_name: "Ken Griffey Jr", estimated_value_cents: 150000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red_low_id: $.data.id }
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-7002", signer_name: "Ken Griffey Jr", estimated_value_cents: 400000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red_high_id: $.data.id }
          trigger:
            - call: "GET /api/redemptions/${red_low_id}"
              payload: {}
              as: RedemptionFulfilmentAnalyst
              captures: { low_deadline_days: $.data.deadline_days }
            - call: "GET /api/redemptions/${red_high_id}"
              payload: {}
              as: RedemptionFulfilmentAnalyst
              captures: { high_deadline_days: $.data.deadline_days }
          assert:
            - "Redemption.${red_low_id}.deadline_days == 365 and Redemption.${red_high_id}.deadline_days == 730"
            - "the low tier books an allowance of exactly 150000 — floor(1.00 x 150000)"
            - "the high tier books an allowance of exactly 500000 — floor(1.25 x 400000)"
            - "Redemption.${red_high_id}.estimated_value_cents is still 400000, so the allowance is a derived booking and never overwrites the scratch value"
            - "a third redemption at exactly 250000 takes the HIGH tier, and 500000 is still correct only because the tier is selected before the multiply"

  # ===========================================================================
  # Group C — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: license_suspension_and_reactivation_cycles_back_to_active
        grounds:
          - "state_machines.License.ACTIVE_to_SUSPENDED"
          - "state_machines.License.SUSPENDED_to_ACTIVE"
          - "state_machines.ProductLine.PLANNING_to_READY_FOR_APPROVAL"
        distinguishing_aspect: "A true cycle on its own entity: the License leaves ACTIVE and later re-enters the identical ACTIVE state through SUSPENDED, so a machine modelled as a one-way DRAFT-to-EXPIRED ladder cannot express the return edge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active with rights_version 1. One line L1 under it READY_FOR_APPROVAL with one approved BASE set S1 of 500 cards and print_run_status UNDECIDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - &n_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
              captures: { lic_v1: $.data.version }
            - &n_line
              call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - &n_set
              call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { set_id: $.data.id, set_v0: $.data.version }
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /api/licenses/${lic_id}/suspend"
              payload: {}
              as: LicensingManager
              captures: { lic_v2: $.data.version, lic_rv2: $.data.rights_version }
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
          assert:
            - "the suspend call returns 200 with License.${lic_id}.status == SUSPENDED and rights_version == ${lic_rv2}, which is 2"
            - "the reactivate call returns 200 and License.${lic_id}.status == ACTIVE again — the same state the cycle started from"
            - "License.${lic_id}.rights_version == 3 after the reactivation, so the round trip advanced the pinned-rights counter twice"
            - "License.${lic_id}.version > ${lic_v2} and License.${lic_id}.version > ${lic_v1}"
            - "CardSet.${set_id}.status is still APPROVED and its print_run_status is still UNDECIDED, because the reactivation does not re-advance the dependant product line out of PLANNING"

      - name: card_set_revision_loop_returns_to_under_review_for_a_second_approval
        grounds:
          - "state_machines.CardSet.UNDER_REVIEW_to_DRAFT"
          - "state_machines.CardSet.UNDER_REVIEW_to_APPROVED"
          - calculations.license_set_counts
        distinguishing_aspect: "A revision loop across two entities rather than one: the CardSet cycles APPROVED -> DRAFT -> UNDER_REVIEW -> APPROVED while the License's approved_set_count cycles 1 -> 0 -> 1 with it, a different shape from the License's own single-entity cycle."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line L1 READY_FOR_APPROVAL, set S1 in UNDER_REVIEW holding one APPROVED artwork and one SUPERSEDED artwork from an earlier revision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *n_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *n_line
            - *n_set
            - &n_art_old
              call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-000", approver_id: "${lic_id}", submitted_on: "2026-08-10T00:00:00Z" }
              as: ProductManager
              captures: { art_old_id: $.data.id }
            - call: "POST /api/artwork-approvals/${art_old_id}/decide"
              payload: { decision: "REJECT", decided_on: "2026-08-12T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
            - &n_art_new
              call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-20T00:00:00Z" }
              as: ProductManager
              captures: { art_new_id: $.data.id }
            - call: "POST /api/artwork-approvals/${art_new_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-25T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { set_v1: $.data.version }
          trigger:
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v1}" }
              as: ProductManager
              captures: { set_v2: $.data.version }
            - call: "POST /api/card-sets/${set_id}/return-to-draft"
              payload: {}
              as: ProductManager
              captures: { set_v3: $.data.version }
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { set_v4: $.data.version }
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v4}" }
              as: ProductManager
          assert:
            - "the first approval returns 200 with CardSet.${set_id}.status == APPROVED and License.${lic_id}.approved_set_count == 1"
            - "return-to-draft returns 200 with CardSet.${set_id}.status == DRAFT and License.${lic_id}.approved_set_count == 0"
            - "the second submit returns 200 with CardSet.${set_id}.status == UNDER_REVIEW, reached with the SAME approved artwork still on file and no new artwork submitted"
            - "the second approval returns 200 with CardSet.${set_id}.status == APPROVED and License.${lic_id}.approved_set_count == 1 again"
            - "ArtworkApproval.${art_old_id}.status == REJECTED and ArtworkApproval.${art_new_id}.status == APPROVED throughout, so the loop re-enters UNDER_REVIEW without touching the artwork chain"

  # ===========================================================================
  # Group D — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: license_suspension_clears_approved_sets_through_the_artwork_chain
        grounds:
          - "state_machines.License.ACTIVE_to_SUSPENDED"
          - "state_machines.ArtworkApproval.SUBMITTED_to_EXPIRED"
          - "state_machines.CardSet.UNDER_REVIEW_to_DRAFT"
        distinguishing_aspect: "Depth-3 chain where the original action touches only ProductLine rows: the line's own PLANNING transition parks its sets at print_run_status UNDECIDED, that change makes the artwork window unreachable so the artwork expires on the next clock tick, and the expiry is what returns the set to DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active. Line L1 PLANNING holding two sets: S1 under review with one SUBMITTED artwork, S2 still in DRAFT with one SUBMITTED artwork whose submitted_on of 2026-09-05 sits one day short of L's 10-day window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - &y_line1
              call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { line1_id: $.data.id }
            - &y_set1
              call: "POST /api/card-sets"
              payload: { product_line_id: "${line1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { set1_id: $.data.id, set1_v0: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line1_id}", set_name: "Flagship Chrome", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 1000 }
              as: ProductManager
              captures: { set2_id: $.data.id }
            - call: "POST /api/card-sets/${set1_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-09-05T00:00:00Z" }
              as: ProductManager
              captures: { art1_id: $.data.id }
            - call: "POST /api/card-sets/${set2_id}/artwork-approvals"
              payload: { artwork_code: "ART-CHROME-001", approver_id: "${lic_id}", submitted_on: "2026-09-05T00:00:00Z" }
              as: ProductManager
              captures: { art2_id: $.data.id }
            - call: "POST /api/card-sets/${set1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/product-lines/${line1_id}/ready-for-approval"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /api/licenses/${lic_id}/suspend"
              payload: {}
              as: LicensingManager
          assert:
            - "License.${lic_id}.status == SUSPENDED"
            - "ProductLine.${line1_id}.status == PLANNING and CardSet.${set1_id}.print_run_status == UNDECIDED and CardSet.${set2_id}.print_run_status == UNDECIDED"
            - "the same suspension request also expires the SUBMITTED artwork: ArtworkApproval.${art1_id}.status == EXPIRED and ArtworkApproval.${art2_id}.status == EXPIRED"
            - "CardSet.${set1_id}.status == DRAFT — the expiry hop, not the suspension hop, is what reverted the set"
            - "CardSet.${set2_id}.status == DRAFT from its pre-existing state, so the pair is no longer separable by set status alone"

      - name: product_line_pack_out_closes_fulfilled_redemptions_on_its_sets
        grounds:
          - "state_machines.ProductLine.IN_PRODUCTION_to_PACKED_OUT"
          - "state_machines.Redemption.ISSUED_to_FULFILLED"
          - "state_machines.CardSet.IN_PRODUCTION_to_PACKED_OUT"
        distinguishing_aspect: "Depth-2 chain originating from a different transition than the suspension instance: the line's pack-out only writes Redemption rows, and it is the fulfilled redemption's own PACKED_OUT reachability that turns CLOSED, with the set's outstanding counter both raised by the signing completion and lowered by the close."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-12T00:00:00Z. License L active. Line L1 (BASE, 20 x 10 x 10, 50 cases) with set S1 approved, autograph_planned_count 200, autograph_secured_count 200 from session G. One redemption on S1, issued, then fulfilled by G's completion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - &z_line1
              call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { line1_id: $.data.id }
            - &z_set1
              call: "POST /api/card-sets"
              payload: { product_line_id: "${line1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 200, print_run_quantity: 500 }
              as: ProductManager
              captures: { set1_id: $.data.id, set1_v0: $.data.version }
            - call: "POST /api/card-sets/${set1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set1_id}/approve"
              payload: { expected_card_set_version: "${set1_v0}" }
              as: ProductManager
              captures: { set1_v1: $.data.version }
            - &z_ready
              call: "POST /api/product-lines/${line1_id}/ready-for-approval"
              payload: {}
              as: ProductManager
              captures: { line_v_snap: $.data.version }
            - &z_decision
              call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${set1_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v_snap}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { dec1_id: $.data.id }
            - call: "POST /api/print-run-decisions/${dec1_id}/approve"
              payload: { expected_card_set_version: "${set1_v1}", expected_product_line_version: "${line_v_snap}" }
              as: ProductionPlanner
              captures: { set1_v2: $.data.version }
            - &z_session
              call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${set1_id}", player_id: "kgj", quantity_delivered: 200 }] }
              as: SigningCoordinator
              captures: { sess1_id: $.data.id }
            - call: "POST /api/signing-sessions/${sess1_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
            - call: "POST /api/signing-sessions/${sess1_id}/ship-stock"
              payload: {}
              as: SigningCoordinator
            - call: "POST /api/card-sets/${set1_id}/redemptions"
              payload: { redemption_code: "RDM-9001", signer_name: "Ken Griffey Jr", estimated_value_cents: 400000, opened_on: "2026-10-12T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red1_id: $.data.id }
            - call: "POST /api/signing-sessions/${sess1_id}/complete"
              payload: { signer_attendance: "ATTENDED" }
              as: AuthenticationOfficer
            - call: "POST /api/card-sets/${set1_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/product-lines/${line1_id}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/card-sets/${set1_id}/pack-out"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/product-lines/${line1_id}/pack-out"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductLine.${line1_id}.status == PACKED_OUT"
            - "Redemption.${red1_id}.status == CLOSED"
            - "CardSet.${set1_id}.autograph_redemptions_outstanding == 0"
            - "the redemption was FULFILLED before the trigger, so the line-level pack-out is the hop that closed it, not the set-level pack-out which had already run"

  # ===========================================================================
  # Group E — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: out_of_force_license_beats_missing_resource_on_line_activation
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_LICENSE_NOT_IN_FORCE
        distinguishing_aspect: "The state-versus-existence pair: a request that is both out-of-term and names a nonexistent line id resolves to the Priority-2 licensing error, not Priority-4 ERR_PRODUCT_LINE_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2027-06-01T00:00:00Z. License L active with term_ends_on 2026-12-31, so its term has passed. No product line exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &w_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2026-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "Late Flagship", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2027-07-01T00:00:00Z" }
              as: ProductManager
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "the response status is 403 and error_id == ERR_LICENSE_NOT_IN_FORCE"
            - "error_id != ERR_INVALID_REQUEST and error_id != ERR_PRODUCT_LINE_NOT_FOUND"
            - "error_id != ERR_APPROVAL_WINDOW_CLOSED, so the Priority-9 temporal row does not pre-empt the Priority-2 authority row"

      - name: breached_title_window_beats_absent_pack_configuration_on_set_approval
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors.ERR_LICENSE_TERM_WINDOW_BREACH
        distinguishing_aspect: "The other error-category pair: window-versus-state. A set with no PUBLISHED pack configuration AND a genuinely breached licensor title window returns the Priority-3 window breach, not the Priority-7 ERR_PACK_CONFIG_MISSING."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active (2026-01-01 to 2029-12-31), line L1 READY_FOR_APPROVAL, set S1 approved. S1 has no pack configuration at all. The license is then suspended and reactivated, advancing rights_version to 2 while S1 still pins 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - call: "POST /api/licenses/${lic_id}/suspend"
              payload: {}
              as: LicensingManager
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
          trigger:
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_LICENSE_TERM_WINDOW_BREACH"
            - "error_id != ERR_PACK_CONFIG_MISSING"
            - "error_id != ERR_RIGHTS_VERSION_MISMATCH, because the title window is checked before the pinned-rights row"
            - "CardSet.${set_id}.status is still DRAFT"

  # ===========================================================================
  # Group F — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: config_serial_thirty_is_legal_and_thirty_one_is_not
        grounds:
          - "state_machines.PackConfiguration.PROPOSED_to_PUBLISHED"
          - validations[priority=15]
          - entities.PackConfiguration.fields.config_serial
        distinguishing_aspect: "Inclusive integer bound on the config ladder: serial 30 fails only the ORDERING half of the rule while serial 31 fails the RANGE half, so the two produce different error ids and a strict `< 30` bound is detectable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S approved at BASE with print_run_quantity 500 and announced true. Three proposed pack configurations on S: serial 1, serial 30 and serial 31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/pack-configurations"
              payload: { card_set_id: "${set_id}", config_serial: 1, base_packs: 10, insert_packs: 0, premium_packs: 0 }
              as: ProductManager
              captures: { pc1_id: $.data.id }
            - call: "POST /api/pack-configurations"
              payload: { card_set_id: "${set_id}", config_serial: 30, base_packs: 10, insert_packs: 0, premium_packs: 0 }
              as: ProductManager
              captures: { pc30_id: $.data.id }
            - call: "POST /api/pack-configurations"
              payload: { card_set_id: "${set_id}", config_serial: 31, base_packs: 10, insert_packs: 0, premium_packs: 0 }
              as: ProductManager
              captures: { pc31_id: $.data.id }
          trigger:
            - call: "POST /api/pack-configurations/${pc1_id}/publish"
              payload: {}
              as: ProductManager
            - call: "POST /api/pack-configurations/${pc30_id}/publish"
              payload: {}
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the serial-1 publish returns 200 with PackConfiguration.${pc1_id}.status == PUBLISHED and odd_value == 500"
            - "the serial-30 publish returns 409 with error_id == ERR_CONFIG_LADDER_VIOLATION — serial 30 is INSIDE the 1..30 range and fails only the ordering half"
            - "POST /api/pack-configurations/${pc31_id}/publish returns 422 with error_id == ERR_CONFIG_SERIAL_OUT_OF_RANGE, a different error id from the serial-30 case"
            - "so 30 is an accepted value and 31 is the first rejected value; a strict `< 30` bound would collapse both onto the out-of-range error"

      - name: claim_backdate_window_opens_at_thirty_days_not_twenty_nine
        grounds:
          - "state_machines.QualityClaim.FILED_to_UNDER_REVIEW"
          - validations[priority=8]
          - calculations.print_run_projection
        distinguishing_aspect: "Strictly-greater boundary on a date window with a different endpoint from the config-serial bound: a claim filed exactly 30 days back is refused and one filed 29 days back is admitted, so an inclusive `>=` implementation wrongly admits the 30-day claim."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active, line PL, set S approved. Two claims on S: C_A filed_on 2026-08-13 (exactly 30 days back) and C_B filed_on 2026-08-14 (29 days back)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 10, filed_on: "2026-08-13T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_a_id: $.data.id }
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 10, filed_on: "2026-08-14T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_b_id: $.data.id }
          trigger:
            - call: "POST /api/quality-claims/${qc_a_id}/open-review"
              payload: {}
              as: QualityAnalyst
              captures: { error_id: $.data.error_id }
            - call: "POST /api/quality-claims/${qc_b_id}/open-review"
              payload: {}
              as: QualityAnalyst
          assert:
            - "the 30-day claim returns 422 with error_id == ERR_CLAIM_BACKDATE_EXCEEDED and QualityClaim.${qc_a_id}.status stays FILED"
            - "the 29-day claim returns 200 with QualityClaim.${qc_b_id}.status == UNDER_REVIEW"
            - "CardSet.${set_id}.quality_claim_count == 2, since the recompute follows the set rather than the claim's review state"

  # ===========================================================================
  # Group G — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: card_set_submission_requires_the_parent_line_ready_for_approval
        grounds:
          - "state_machines.CardSet.DRAFT_to_UNDER_REVIEW"
          - "state_machines.ProductLine.PLANNING_to_READY_FOR_APPROVAL"
          - validations[priority=7]
        distinguishing_aspect: "The CardSet->ProductLine pair gates this transition: a set holding a perfectly APPROVED artwork is still refused while its own parent line sits in PLANNING, and no CardSet-local field can reveal that."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL left in PLANNING, set S holding one APPROVED artwork."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-20T00:00:00Z" }
              as: ProductManager
              captures: { art_id: $.data.id }
            - call: "POST /api/artwork-approvals/${art_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-25T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PRODUCT_LINE_NOT_READY"
            - "CardSet.${set_id}.status == DRAFT"
            - "after POST /api/product-lines/${line_id}/ready-for-approval returns 200 with status READY_FOR_APPROVAL, the same submit returns 200 and CardSet.${set_id}.status == UNDER_REVIEW"

      - name: card_production_start_requires_a_locked_print_run
        grounds:
          - "state_machines.CardSet.APPROVED_to_IN_PRODUCTION"
          - "state_machines.PrintRunDecision.PROPOSED_to_APPROVED"
          - validations[priority=7]
        distinguishing_aspect: "The CardSet->PrintRunDecision pair gates this transition: the set's own status is already APPROVED and only a sibling decision row's status separates success from ERR_PRINT_RUN_NOT_LOCKED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL in READY_FOR_APPROVAL, set S approved with print_run_quantity 0 and announced true, and one PROPOSED BRAND_DIRECTIVE decision that has not been approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 0 }
              as: ProductManager
              captures: { setz_id: $.data.id, setz_v0: $.data.version }
            - call: "POST /api/card-sets/${setz_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${setz_id}/approve"
              payload: { expected_card_set_version: "${setz_v0}" }
              as: ProductManager
              captures: { setz_v1: $.data.version }
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
              captures: { line_v_pub: $.data.version }
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${setz_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${line_v_pub}", demand_multiplier: 1.0, declared_quantity: 400, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { decz_id: $.data.id }
          trigger:
            - call: "POST /api/card-sets/${setz_id}/start-production"
              payload: {}
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PRINT_RUN_NOT_LOCKED"
            - "CardSet.${setz_id}.print_run_status == UNDECIDED"
            - "after POST /api/print-run-decisions/${decz_id}/approve returns 200, the same start-production returns 200 and CardSet.${setz_id}.status == IN_PRODUCTION"
            - "PrintRunDecision.${decz_id}.final_quantity == 400"

  # ===========================================================================
  # Group H — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: two_signing_sessions_for_one_signer_on_the_same_day_collide
        grounds:
          - "state_machines.SigningSession.SCHEDULED_to_STOCK_PREPARED"
          - validations[priority=14]
          - errors.ERR_SIGNER_DOUBLE_BOOKED
        distinguishing_aspect: "Adjacency is closed at both ends on a half-open day window: two bookings on the SAME calendar day collide even though neither contains the other's instant start, and cancelling the first releases the second."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved with autograph_planned_count 200. Signer G is booked twice: session A on 2026-10-05T00:00:00Z and session B on 2026-10-05T12:00:00Z, both still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${set_id}", player_id: "kgj", quantity_delivered: 100 }] }
              as: SigningCoordinator
              captures: { sess_a_id: $.data.id }
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T12:00:00Z", allocation_lines: [{ card_set_id: "${set_id}", player_id: "kgj", quantity_delivered: 50 }] }
              as: SigningCoordinator
              captures: { sess_b_id: $.data.id }
          trigger:
            - call: "POST /api/signing-sessions/${sess_a_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
            - call: "POST /api/signing-sessions/${sess_b_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "session A's prepare-stock returns 200 and SigningSession.${sess_a_id}.status == STOCK_PREPARED"
            - "session B's prepare-stock returns 409 with error_id == ERR_SIGNER_DOUBLE_BOOKED and SigningSession.${sess_b_id}.status stays SCHEDULED"
            - "after POST /api/signing-sessions/${sess_a_id}/cancel returns 200, session B's prepare-stock returns 200"
            - "SigningSession.${sess_a_id}.ship_date == 2026-09-26T00:00:00Z and SigningSession.${sess_b_id}.ship_date == 2026-09-26T00:00:00Z, so ship_date alone does not distinguish the pair"

      - name: two_hobby_allocations_for_one_line_cannot_both_be_utf
        grounds:
          - "state_machines.DistributionAllocation.RESERVED_to_UTF"
          - errors.ERR_CHANNEL_ALREADY_UTF
          - entities.DistributionAllocation
        distinguishing_aspect: "The overlap scope is the (product_line_id, channel) pair over allocations ALREADY in UTF rather than a time interval: a second hobby allocation is refused though it is a different row, while a mass allocation on the same line is unrestricted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active, line PL with cases_printed 50, three RESERVED allocations: 10 HOBBY, 5 HOBBY, and 15 MASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - *x_lic
            - *x_act_lic
            - *x_line
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { al_h1_id: $.data.id }
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 5, effective_price_cents: 66000 }
              as: DistributionManager
              captures: { al_h2_id: $.data.id }
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "MASS", quantity_allocated: 15, effective_price_cents: 50000 }
              as: DistributionManager
              captures: { al_m_id: $.data.id }
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
              captures: { line_h_pub: $.data.version }
            - call: "POST /api/card-sets"
