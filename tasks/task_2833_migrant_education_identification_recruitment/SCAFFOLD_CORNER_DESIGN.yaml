            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Diego Salas", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_b_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v1: $.data.version }
          trigger:
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_1_id: $.data.id, asg_1_status: $.data.status }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v2: $.data.version, slots_after_1: $.data.assigned_primary_slots_used }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_b_id}", area_id: "${area_id}", coverage_role: "BACKUP", starts_on: "2026-06-01", ends_on: "2026-08-31", expected_area_version: "${area_v2}" }
              as: StateProgramAdmin
              captures: { asg_2_id: $.data.id, asg_2_status: $.data.status }
          assert:
            - "first create: HTTP 201, RecruiterAssignment.${asg_1_id}.status == PLANNED, coverage_role == PRIMARY - the interval 2026-05-01..2026-10-31 contains the peak season 2026-06-01..2026-09-30, so ERR_PEAK_SEASON_NOT_COVERED does not fire"
            - "after the first create AgriculturalArea.${area_id}.assigned_primary_slots_used == 1 and Recruiter.${rec_a_id}.active_assignment_count == 1"
            - "second create: HTTP 201, RecruiterAssignment.${asg_2_id}.status == PLANNED, coverage_role == BACKUP - accepted despite covering only part of the peak season, because rule 3 applies to PRIMARY only"
            - "second create: no ERR_RECRUITER_ASSIGNMENT_OVERLAP, because the pairwise rule is per recruiter and ${rec_b_id} has no other interval"
            - "second create: no ERR_AREA_COVERAGE_CAPACITY_EXCEEDED, because the buffered peak occupancy is 1 + 1 == 2 which is <= recruiter_capacity 3"
            - "after the second create AgriculturalArea.${area_id}.assigned_primary_slots_used is still 1 - the BACKUP row is not a PRIMARY slot"
            - "after the second create Recruiter.${rec_b_id}.active_assignment_count == 1 and Recruiter.${rec_a_id}.active_assignment_count is still 1"

      - name: corner_coe_create_on_a_move_with_work_type_none_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority 10 ERR_MOVE_NOT_QUALIFYING]
          - entities.QualifyingMove.fields.work_type
          - endpoints[POST /mep/coes]
          - endpoints[POST /mep/qualifying-moves/{move_id}/adjudicate]
        distinguishing_aspect: "The qualifying gate is keyed on work_type IN {AGRICULTURAL, FISHING} and guards two different triggers: adjudicating a work_type NONE move to VERIFIED returns 422 ERR_MOVE_NOT_QUALIFYING, and so does creating a certificate against it, while the same calls on an AGRICULTURAL move succeed."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, one ENROLLED Student"
            - "one RECORDED move with work_type NONE and one RECORDED move with work_type AGRICULTURAL"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-10", work_type: "NONE", worker_relationship: "PARENT", purpose: "ACCOMPANY_WORKER", distance_miles: 800.00 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_none_id: $.data.id, none_status: $.data.status }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_ok_id: $.data.id }
          trigger:
            - call: "POST /mep/qualifying-moves/${move_none_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_none_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_ok_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_ok_id: $.data.id, coe_ok_status: $.data.status }
          assert:
            - "the move creation itself succeeded: QualifyingMove.${move_none_id}.work_type == NONE and status == RECORDED - work_type NONE is a legal stored value"
            - "adjudicate to VERIFIED: HTTP 422 with data.error_id == ERR_MOVE_NOT_QUALIFYING"
            - "after that refusal QualifyingMove.${move_none_id}.status is still RECORDED and adjudicated_on is still null"
            - "certificate create against ${move_none_id}: HTTP 422 with data.error_id == ERR_MOVE_NOT_QUALIFYING"
            - "GET /mep/coes filtered by move_id ${move_none_id} returns 0 rows"
            - "certificate create against ${move_ok_id}: HTTP 201 with status == DRAFT - the same call shape passes once work_type is AGRICULTURAL"

      - name: corner_future_dated_move_is_refused_while_todays_date_is_accepted
        claim_type: Temporal validation
        grounds:
          - validations[priority 17 ERR_MOVE_DATE_IN_FUTURE]
          - entities.QualifyingMove.fields.move_date
          - endpoints[POST /mep/qualifying-moves]
          - endpoints[POST /mep/_clock/set_current_utc]
        distinguishing_aspect: "The temporal guard compares move_date against the logical clock's current date, not against a wall clock: with the clock at 2026-08-01 a move dated 2026-08-02 is refused with 422 ERR_MOVE_DATE_IN_FUTURE, a move dated exactly 2026-08-01 is accepted, and after advancing the clock to 2026-09-01 the previously-refused 2026-08-02 date is accepted."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, one ENROLLED Student"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-08-02", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-08-01", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_today_id: $.data.id, today_status: $.data.status }
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "OR", to_state_code: "WA", move_date: "2026-08-02", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 260.00 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_later_id: $.data.id, later_status: $.data.status }
          assert:
            - "first create: HTTP 422 with data.error_id == ERR_MOVE_DATE_IN_FUTURE, and GET /mep/qualifying-moves filtered by student_id ${stu_id} returns 0 rows at that point"
            - "second create: HTTP 201 with QualifyingMove.${move_today_id}.move_date == 2026-08-01 and status == RECORDED - the comparison is strict, today is not the future"
            - "third create: HTTP 201 with QualifyingMove.${move_later_id}.move_date == 2026-08-02 and status == RECORDED - the identical payload that was refused is now in the past"
            - "QualifyingMove.${move_later_id}.created_at == 2026-09-01T00:00:00Z, confirming the logical clock drove both the guard and the timestamp"

      - name: corner_qc_hold_exempt_flag_removes_a_certificate_from_the_pool
        claim_type: Conditional validation
        grounds:
          - entities.CertificateOfEligibility.fields.qc_hold_exempt
          - calculations.qc_sample_selection
          - validations[priority 30 ERR_NO_QC_CANDIDATES]
          - endpoints[POST /mep/qc-selections]
        distinguishing_aspect: "The candidate predicate is conditional on a per-row flag: with only an exempt SUBMITTED certificate on file the whole selection request is refused with 409 ERR_NO_QC_CANDIDATES and nothing is written, and adding one non-exempt SUBMITTED certificate makes the identical call return candidate_count 1 and select it."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, two ENROLLED Students each with a VERIFIED AGRICULTURAL move and a supporting INITIAL interview"
            - "student A's certificate submitted with qc_hold_exempt true; student B's certificate created but NOT yet submitted"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
