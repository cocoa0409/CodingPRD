              payload: { circular_reference: "CIRC-2026-3068-13", expected_offering_version: "${off_v0}" }
              as: ComplianceOfficer
            - call: "POST /api/subscriptions"
              payload: { offering_id: "${offering_id}", investor_id: "${inv_w}", requested_shares: 20000 }
              as: Investor
              as_user_id: "${inv_w}"
              captures: { sub_w: $.data.id }
            - call: "POST /api/subscriptions"
