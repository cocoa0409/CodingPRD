        distinguishing_aspect: "The deliberate G6-before-G7 ordering is observable: a stale expected_box_item_version against an item that already carries a live buy-out returns ERR_STALE_BOX_ITEM_VERSION (412), NOT ERR_BUYOUT_ALREADY_EXISTS (409)."
        test_recipe:
