  # ==========================================================================
  # §1.9 breadth walk, section 8 of 9: the four declared complexity layers of
  # §1.0. optimistic_concurrency gets one instance per §1.2.1 concurrency_rules
  # entry, each driven through its own declared write_endpoint and occ_field -
  # the escape one is also the only reachable path to ERR_STALE_ESCAPE_VERSION,
  # which closes the last untriggered error id in §1.6. version_pinning_on_approval
  # gets a dedicated instance because nothing else pins the frozen
  # pinned_claim_snapshot against a mutated live claim library.
  # cascading_side_effects and dual_variant_calculation are already walked
  # end to end by §1.8 instances and are excluded with a citation.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_asset_version_is_a_412_while_the_refreshed_value_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules[version-create-stale-asset]
          - errors[ERR_STALE_ASSET_VERSION]
          - validations[priority=21]
          - endpoints[POST /artwork-assets/{id}/versions]
          - endpoints[GET /artwork-assets/{id}]
          - endpoints[GET /artwork-versions]
          - entities.ArtworkAsset.fields.version_counter
          - entities.ArtworkVersion.fields.version_no
          - entities.ArtworkVersion.fields.supersedes_version_id
        distinguishing_aspect: |
          The first §1.2.1 concurrency rule, walked in full: stale expected value ->
          412, refreshed expected value -> 201, and the guard re-arms after every
          successful write. The subtle part is that the OCC field names the PARENT
          asset's version, not the version row being created, so the very act of
          creating v2 invalidates the client's own read - hence the third create
          replaying ${asset_v2} must be a 412 too. Two failure modes are caught: an
          implementation that compares against ArtworkAsset.version_counter (also 1
          at the time of the first attempt, so it would wrongly accept it) and one
          that treats the OCC value as advisory and still writes the row, which the
          total_count == 1 check on GET /artwork-versions exposes.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; brief SKU-1001 APPROVED."
            - "One US CARTON asset created, so ArtworkAsset.version == 1 and version_counter == 0 at that moment; asset_v1 captures that 1."
            - "One version v1 already created against ${asset_v1}, which bumped the asset to version 2 and version_counter 1, so ${asset_v1} is now stale."
            - "No PATCH or other asset-touching write happens in between, so every change to ArtworkAsset.version in this test comes from a version create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
