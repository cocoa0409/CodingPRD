            - call: "POST /api/hoa-associations/${hoa11}/form"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${ph11}"
              as: DeveloperOperator
              captures: { lot11a: $.data.0.id, lot11b: $.data.1.id, lot11c: $.data.2.id }
            - call: "POST /api/lots/${lot11a}/reserve"
              payload: { agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot11a}", agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
              captures: { cl11a: $.data.id }
            - call: "POST /api/lot-closings/${cl11a}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "POST /api/lots/${lot11b}/reserve"
              payload: { agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot11b}", agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
              captures: { cl11b: $.data.id }
            - call: "POST /api/lot-closings/${cl11b}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "POST /api/lots/${lot11c}/reserve"
              payload: { agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot11c}", agreement_id: "${ag11}" }
              as: BuilderRep
              as_user_id: "${bldr11}"
              captures: { cl11c: $.data.id }
          trigger:
            - call: "POST /api/hoa-associations/${hoa11}/evaluate-control"
              payload: {}
              as: DeveloperOperator
              captures: { err11: $.data.error_id }
            - call: "POST /api/lot-closings/${cl11c}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "GET /api/hoa-associations/${hoa11}"
              as: DeveloperOperator
              captures: { hoa11_status: $.data.status }
          assert:
            - "at 2/4 closed (50%): captured err11 == ERR_CONTROL_THRESHOLD_NOT_MET (below the inclusive threshold)"
            - "after the third finalize (3/4 = exactly 75.00%): captured hoa11_status == TRANSITIONING (integer cross-multiplication 3*10000 >= 4*7500 holds at equality)"

      - name: contingency_terminate_at_exact_deadline
        grounds:
          - state_machines.Parcel.CONTINGENCY_ACTIVE_to_TERMINATED
          - validations[priority=8]
          - entities.Parcel.fields.contingency_end_date
          - entities.Parcel.fields.earnest_money_refunded
        distinguishing_aspect: |
          A datetime metric on a different endpoint from the HOA percentage boundary:
          with the clock exactly equal to contingency_end_date the terminate call still
          succeeds (inclusive deadline, deposit refunded); one second later the clock
          set itself auto-terminates the parcel with the deposit forfeited, and the
          explicit terminate is rejected with ERR_PARCEL_INVALID_STATE.
        test_recipe:
          setup:
            - "Parcel A in CONTINGENCY_ACTIVE with contingency_end_date 2026-09-01T00:00:00Z"
            - "Parcel B in CONTINGENCY_ACTIVE with the same contingency_end_date"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "PA", county: "Travis", earnest_money_cents: 700000 }
              as: DeveloperOperator
              captures: { pa12: $.data.id }
            - call: "POST /api/parcels/${pa12}/open-contingency"
              payload: { contingency_end_date: "2026-09-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels"
              payload: { parcel_name: "PB", county: "Travis", earnest_money_cents: 700000 }
              as: DeveloperOperator
              captures: { pb12: $.data.id }
            - call: "POST /api/parcels/${pb12}/open-contingency"
              payload: { contingency_end_date: "2026-09-01T00:00:00Z" }
              as: DeveloperOperator
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${pa12}/terminate-contingency"
              payload: {}
              as: DeveloperOperator
              captures: { pa_status: $.data.status, pa_refund: $.data.earnest_money_refunded }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: DeveloperOperator
            - call: "GET /api/parcels/${pb12}"
              as: DeveloperOperator
              captures: { pb_status: $.data.status, pb_refund: $.data.earnest_money_refunded }
            - call: "POST /api/parcels/${pb12}/terminate-contingency"
              payload: {}
              as: DeveloperOperator
              captures: { err12: $.data.error_id }
          assert:
            - "at clock == contingency_end_date exactly: captured pa_status == TERMINATED and pa_refund == true (inclusive deadline)"
            - "at clock == end + 1s: captured pb_status == TERMINATED and pb_refund == false (auto-expiry forfeits the deposit — no explicit terminate was sent for B)"
            - "captured err12 == ERR_PARCEL_INVALID_STATE (explicit terminate after auto-expiry is rejected)"

