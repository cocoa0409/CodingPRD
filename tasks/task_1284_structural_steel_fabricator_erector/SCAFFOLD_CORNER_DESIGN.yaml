  # ---------------------------------------------------------------------------
  # From Table 3 (Calculations)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: pct_input_set_filtering_covered_by_difficulty
        claim_type: input_set_filtering
        grounds: ["calculations.piece_percent_complete"]
        excluded_because:
          difficulty_instance: dual_variant_calc / percent_complete_weight_vs_count_basis
          rationale: "The WEIGHT job asserts 0.7000 with 100/200-lb pieces left DETAILED — numerator restricted to ERECTED, denominator includes all pieces; asserted there."

      - name: previously_billed_excludes_submitted
        claim_type: input_set_filtering
        grounds: ["calculations.net_progress_billing", "entities.ProgressBilling.fields.net_due_cents"]
        distinguishing_aspect: "Billing #2 created while billing #1 is merely SUBMITTED subtracts nothing: net_due recomputes to the same 4750000, proving prior-billings input set is {APPROVED, PAID} only."
        test_recipe:
          setup:
            - "Job CB2 with pieces 500/500 lbs, the first ERECTED (pct 0.5000); billing #1 created and submitted but not approved"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job CB2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jb2: $.data.id } }
            - { call: "POST /jobs/${jb2}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jb2}", drawing_number: "D-1" }, as: DETAILER, captures: { db2: $.data.id } }
            - { call: "POST /shop-drawings/${db2}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${db2}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jb2}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jb2}", seq_number: 1 }, as: FOREMAN, captures: { sb2: $.data.id } }
            - { call: "POST /erection-sequences/${sb2}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jb2}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mb2: $.data.id } }
            - { call: "POST /mill-orders/${mb2}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jb2}", piece_mark: "P1", weight_lbs: 500, drawing_id: "${db2}", sequence_id: "${sb2}" }, as: FOREMAN, captures: { pb2: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jb2}", piece_mark: "P2", weight_lbs: 500, drawing_id: "${db2}", sequence_id: "${sb2}" }, as: FOREMAN }
            - { call: "POST /pieces/${pb2}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jb2}", kind: "FINAL_PIECE", piece_id: "${pb2}" }, as: QC_INSPECTOR, captures: { ib2: $.data.id } }
            - { call: "POST /inspections/${ib2}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jb2}", load_number: "L-1", laydown_slot: "Y-CB2", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lb2: $.data.id } }
            - { call: "POST /shipping-loads/${lb2}/lines", payload: { piece_id: "${pb2}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lb2}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pb2}/erect", as: FOREMAN }
            - { call: "GET /jobs/${jb2}", as: FABRICATOR_ADMIN, captures: { jvb2: $.data.version } }
            - { call: "POST /progress-billings", payload: { job_id: "${jb2}", period_label: "2026-08", expected_job_version: "${jvb2}" }, as: FABRICATOR_ADMIN, captures: { bb1: $.data.id, net1: $.data.net_due_cents } }
            - { call: "POST /progress-billings/${bb1}/submit", as: FABRICATOR_ADMIN }
            - { call: "GET /jobs/${jb2}", as: FABRICATOR_ADMIN, captures: { jvb2b: $.data.version } }
          trigger:
            - { call: "POST /progress-billings", payload: { job_id: "${jb2}", period_label: "2026-09", expected_job_version: "${jvb2b}" }, as: FABRICATOR_ADMIN, captures: { net2: $.data.net_due_cents } }
          assert:
            - "net1 == 4750000"
            - "net2 == 4750000 (SUBMITTED billing #1 excluded from previously_billed; had it counted, net2 would be 0)"

      - name: welder_continuity_lapse_blocks_weld
        claim_type: correct_result
        grounds: ["calculations.welder_continuity", "errors[ERR_WELDER_NOT_QUALIFIED]"]
        distinguishing_aspect: "A welder whose last same-process weld is 198 days before the logical clock (threshold 183) is rejected even though qual_expires_on is still in the future."
        test_recipe:
          setup: ["piece IN_SHOP; welder qualified FCAW through 2027-01-01 with one prior FCAW weld dated 2026-01-15; logical clock at default 2026-08-01"]
          setup_api_calls:
