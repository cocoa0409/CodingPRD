        distinguishing_aspect: "ConsumerRep's X-User-ID is a ConsumerSubscription id, so ownership is identity equality rather than an assignment lookup - and that check runs before the pending-notification check, so a foreign acknowledge on a subscription with no pending notification still reports ERR_NOT_SUBSCRIPTION_OWNER."
        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT) with two subscriptions BI_A and BI_B; neither has a pending notification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
