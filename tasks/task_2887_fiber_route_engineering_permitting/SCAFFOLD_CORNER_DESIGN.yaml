            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-20" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
