            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan3_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { vote_3_id: $.data.id }
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
          assert:
            - "HearingSession.${session_id}.quorum_required == 2 immediately after scheduling - CEILING(3 * 2 / 3) is computed at create time, not at decide time"
            - "decide with 1 cast vote returns HTTP 409 with data.error_id == ERR_QUORUM_NOT_MET and HearingSession.${session_id}.status stays CONVENED"
            - "decide with 2 ABSTAIN votes returns HTTP 409 with data.error_id == ERR_NO_EFFECTIVE_VOTES - the abstentions satisfied quorum, so this is a DIFFERENT error from the first refusal"
            - "after the third vote decide returns HTTP 200 with HearingSession.${session_id}.status == DECIDED, effective_vote_count == 1, panel_finding == RESPONSIBLE, panel_severity_recommendation == 3"
            - "Case.${case_id}.adjudication_status == DECIDED, responsibility_finding == RESPONSIBLE, finding_basis == PANEL, decided_at == 2026-08-20T10:00:00Z"
            - "Case.${case_id}.severity_index == 44.00 and recommended_ladder_rank == MAX(tier 3, panel 3) == 3"
            - "GET /integrity/panel-votes?session_id=${session_id} returns total_count 3 and the two ABSTAIN rows have severity_recommendation == null"

