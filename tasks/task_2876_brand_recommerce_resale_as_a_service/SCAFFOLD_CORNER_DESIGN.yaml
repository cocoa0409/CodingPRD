          - global_constants.IN_STORE_INTAKE_WINDOW_DAYS
          - entities.TradeIn.receive_deadline_at
        distinguishing_aspect: "A mail-in item received at exactly 2026-08-22T00:00:00Z is on time and one received a second later is not, while an in-store item created the same day carries the much shorter 2026-08-03T00:00:00Z deadline — a single shared window constant would collapse the two."
