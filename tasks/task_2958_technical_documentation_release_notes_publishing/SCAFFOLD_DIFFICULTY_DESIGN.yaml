# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2958 — Technical Documentation & Release Notes Publishing
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in `assert:` was computed by executing the referenced
# §1.3 formula with its declared constants.
# Logical clock default before any POST /_clock/set_current_utc: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: localization_cost_provisional_versus_final_on_one_job
        grounds:
          - calculations.localization_job_cost
          - calculations.release_train_localization_commitment
          - entities.LocalizationJob.fields.estimated_cost_cents
          - entities.LocalizationJob.fields.final_cost_cents
          - entities.LocalizationJob.fields.cost_variant
          - state_machines.LocalizationJob.QUEUED_to_TRANSLATED
        distinguishing_aspect: |
          This instance's dual variant lives in the translation-cost accounting domain
          (LocalizationJob x LocaleProfile): the PROVISIONAL quote prices the locale's
          ADVERTISED tm_coverage_pct against the reserved word count, while the FINAL
          quote prices the MEASURED tm_matched_word_count against the delivered word
          count, so one row simultaneously reports 12420 and 10839 cents for the same
          translation of the same page.
        test_recipe:
          setup:
            - "One release train ATLAS 12.0 in status PLANNED with a 5000000-cent localization cap."
            - "One SENIOR writer with capacity_points 100, one ENGINEERING and one PRODUCT reviewer."
            - "One STANDARD plan item (6 planned pages, complexity 10, NEW_TOPIC) assigned to that writer for 2026-08-03..2026-08-14, load_points 26.00."
            - "One topic with a single revision of 1200 words, fully approved by both disciplines and published by doc set 12.0-docs."
            - "One ACTIVE DELAYED locale de-DE: tm_coverage_pct 40, per_word_rate_cents 12.5, sla_days 10, parallel_job_limit 2 — created AFTER the doc set publication, so no job was auto-created and the budget projection at publish time was 0."
            - "One manual QUEUED job on that topic for de-DE over the closed window 2026-08-10..2026-08-17 (8 days against a 10-day SLA, so the rush surcharge applies), reserving 1200 source words."
            - "Logical clock advanced to 2026-08-17, still inside the SLA grace period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-search", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-search-overview", title: "Atlas Search Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["index", "query"], summary: "first draft" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_eng_id}" }
              as: DocsLead
              captures: { so_eng_id: $.data.id }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_prod_id}" }
              as: DocsLead
              captures: { so_prod_id: $.data.id }
            - call: "POST /sign-offs/${so_eng_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_eng_id}"
            - call: "POST /sign-offs/${so_prod_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_prod_id}"
            - call: "GET /release-trains/${rt_id}"
              payload: {}
              as: DocsLead
              captures: { rt_v: $.data.version }
            - call: "POST /doc-set-versions"
              payload: { release_train_id: "${rt_id}", version_label: "12.0-docs", expected_release_train_version: "${rt_v}" }
              as: DocsLead
              captures: { ds_id: $.data.id }
            - call: "POST /doc-set-versions/${ds_id}/publish"
              payload: {}
              as: DocsLead
            - call: "POST /locale-profiles"
              payload: { locale_code: "de-DE", publication_mode: "DELAYED", tm_coverage_pct: 40, per_word_rate_cents: 12.5, sla_days: 10, parallel_job_limit: 2 }
              as: LocalizationCoordinator
              captures: { loc_de_id: $.data.id }
            - call: "POST /localization-jobs"
              payload: { topic_id: "${t_id}", locale_profile_id: "${loc_de_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-17" }
              as: LocalizationCoordinator
              captures: { job_id: $.data.id, est_cents: $.data.estimated_cost_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: DocsLead
          trigger:
            - call: "POST /localization-jobs/${job_id}/deliver"
              payload: { translated_word_count: 1300, tm_matched_word_count: 780 }
              as: LocalizationCoordinator
          assert:
            - "${est_cents} == 12420"
            - "LocalizationJob.${job_id}.estimated_cost_cents == 12420 (unchanged by delivery)"
            - "LocalizationJob.${job_id}.final_cost_cents == 10839"
            - "LocalizationJob.${job_id}.leverage_pct == 60.00"
            - "LocalizationJob.${job_id}.rush_surcharge_cents == 1414"
            - "LocalizationJob.${job_id}.volume_discount_cents == 0"
            - "LocalizationJob.${job_id}.cost_variant == FINAL"
            - "LocalizationJob.${job_id}.state == TRANSLATED"
            - "LocalizationJob.${job_id}.reserved_source_words == 1200 and translated_word_count == 1300"
            - "ReleaseTrain.${rt_id}.localization_committed_cents == 10839 (the train ledger switches from the provisional 12420 to the final figure)"
            - "LocaleProfile.${loc_de_id}.committed_source_words == 1200 and open_job_count == 1"

      - name: topic_health_score_pre_versus_post_publication
        grounds:
          - calculations.topic_documentation_health_score
          - calculations.topic_deflection_metrics
          - entities.Topic.fields.health_score
          - entities.Topic.fields.health_score_variant
          - entities.Topic.fields.signoff_latency_days
          - state_machines.Topic.UNPUBLISHED_to_PUBLISHED
        distinguishing_aspect: |
          This instance's dual variant lives in a different entity domain — reader-signal
          quality scoring on a Topic, not money on a LocalizationJob: with churn and
          sign-off latency held fixed the PRE_PUBLICATION variant scores 90.00 by ignoring
          reader feedback entirely, while the POST_PUBLICATION variant scores 84.50 on the
          same row once four ratings exist.
          test_recipe.setup pins current_revision_number 4 and signoff_latency_days 4.
        test_recipe:
          setup:
            - "One release train, one SENIOR writer (capacity 100), one ENGINEERING and one PRODUCT reviewer."
            - "One STANDARD plan item assigned 2026-08-03..2026-08-14."
            - "One topic carrying FOUR revisions, so churn costs 4 * (4 - 2) = 8 points."
            - "Submitted for review with the clock at 2026-08-05 and approved with the clock at 2026-08-09, so signoff_latency_days == 4 and latency costs 2 * (4 - 3) = 2 points."
            - "PRE_PUBLICATION health_score therefore 90.00, captured before publication."
            - "The topic is then published by doc set 12.0-docs with no feedback yet, so its POST_PUBLICATION score is still 90.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.1", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-ranking", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-ranking-overview", title: "Atlas Ranking Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["index"], summary: "draft 1" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1250, used_terms: ["index"], summary: "draft 2" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1300, used_terms: ["index"], summary: "draft 3" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: DocsLead
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1350, used_terms: ["index"], summary: "draft 4" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_eng_id}" }
              as: DocsLead
              captures: { so_eng_id: $.data.id }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_prod_id}" }
              as: DocsLead
              captures: { so_prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T00:00:00Z" }
              as: DocsLead
            - call: "POST /sign-offs/${so_eng_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_eng_id}"
            - call: "POST /sign-offs/${so_prod_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_prod_id}"
            - call: "GET /topics/${t_id}"
              payload: {}
              as: DocsLead
              captures: { h_pre: $.data.health_score, v_pre: $.data.health_score_variant }
            - call: "GET /release-trains/${rt_id}"
              payload: {}
              as: DocsLead
              captures: { rt_v: $.data.version }
            - call: "POST /doc-set-versions"
              payload: { release_train_id: "${rt_id}", version_label: "12.1-docs", expected_release_train_version: "${rt_v}" }
              as: DocsLead
              captures: { ds_id: $.data.id }
            - call: "POST /doc-set-versions/${ds_id}/publish"
              payload: {}
              as: DocsLead
          trigger:
            - call: "POST /topics/${t_id}/feedback"
              payload: { rating: 5, outcome: "RESOLVED_SELF_SERVE", locale_code: "en-US", session_key: "sess-a" }
              as: Reader
            - call: "POST /topics/${t_id}/feedback"
              payload: { rating: 3, outcome: "RESOLVED_SELF_SERVE", locale_code: "en-US", session_key: "sess-b" }
              as: Reader
            - call: "POST /topics/${t_id}/feedback"
              payload: { rating: 4, outcome: "RESOLVED_SELF_SERVE", locale_code: "en-US", session_key: "sess-c" }
              as: Reader
            - call: "POST /topics/${t_id}/feedback"
              payload: { rating: 4, outcome: "OPENED_TICKET", locale_code: "en-US", session_key: "sess-d" }
              as: Reader
          assert:
            - "${h_pre} == 90.00 and ${v_pre} == PRE_PUBLICATION"
            - "Topic.${t_id}.health_score == 84.50"
            - "Topic.${t_id}.health_score_variant == POST_PUBLICATION"
            - "Topic.${t_id}.current_revision_number == 4 and signoff_latency_days == 4 (both unchanged by the feedback)"
            - "GET /topics/${t_id}/deflection-summary returns sample_count 4, mean_rating 4.00, deflection_pct 75.00, ticket_rate_pct 25.00"
            - "the two variants differ by exactly 5.50 points on identical churn and latency inputs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: localization_cost_surcharge_before_volume_discount_mode_c
        grounds:
          - calculations.localization_job_cost
          - entities.LocalizationJob.fields.rush_surcharge_cents
          - entities.LocalizationJob.fields.volume_discount_cents
          - entities.LocaleProfile.fields.sla_days
        distinguishing_aspect: |
          Mode (c) — circular-looking evaluation order pinned explicitly: the volume tier is
          selected from the SURCHARGE-INCLUSIVE subtotal, so surcharge-then-discount yields
          205390 while discount-then-surcharge would pick the 3% band on 190000 and yield
          211945. The scaffold pins the former; the two orders are numerically separable on
          this single job.
        test_recipe:
          setup:
            - "Release train ATLAS 13.0, SENIOR writer capacity 100, both reviewer disciplines."
            - "One STANDARD plan item assigned 2026-08-03..2026-08-14 with a single 15200-word revision, fully approved and published."
            - "One ACTIVE DELAYED locale it-IT with tm_coverage_pct 0, per_word_rate_cents 12.5, sla_days 10, parallel_job_limit 3, created after publication so nothing was auto-created."
            - "Logical clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "13.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-migration", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-migration-guide", title: "Atlas Migration Guide" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 15200, used_terms: ["index"], summary: "full guide" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_eng_id}" }
              as: DocsLead
              captures: { so_eng_id: $.data.id }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_prod_id}" }
              as: DocsLead
              captures: { so_prod_id: $.data.id }
            - call: "POST /sign-offs/${so_eng_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_eng_id}"
            - call: "POST /sign-offs/${so_prod_id}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_prod_id}"
            - call: "GET /release-trains/${rt_id}"
              payload: {}
              as: DocsLead
              captures: { rt_v: $.data.version }
            - call: "POST /doc-set-versions"
              payload: { release_train_id: "${rt_id}", version_label: "13.0-docs", expected_release_train_version: "${rt_v}" }
              as: DocsLead
              captures: { ds_id: $.data.id }
            - call: "POST /doc-set-versions/${ds_id}/publish"
              payload: {}
              as: DocsLead
            - call: "POST /locale-profiles"
              payload: { locale_code: "it-IT", publication_mode: "DELAYED", tm_coverage_pct: 0, per_word_rate_cents: 12.5, sla_days: 10, parallel_job_limit: 3 }
              as: LocalizationCoordinator
              captures: { loc_it_id: $.data.id }
          trigger:
            - call: "POST /localization-jobs"
              payload: { topic_id: "${t_id}", locale_profile_id: "${loc_it_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-17" }
              as: LocalizationCoordinator
              captures: { job_id: $.data.id }
          assert:
            - "LocalizationJob.${job_id}.leverage_pct == 0.00"
            - "LocalizationJob.${job_id}.rush_surcharge_cents == 28500 (15% of the 190000 base, because the 8-day window is shorter than the 10-day SLA)"
            - "LocalizationJob.${job_id}.volume_discount_cents == 13110 (6% of the 218500 surcharge-inclusive subtotal)"
            - "LocalizationJob.${job_id}.estimated_cost_cents == 205390"
            - "LocalizationJob.${job_id}.estimated_cost_cents != 211945 (the value the reversed order would produce)"
            - "ReleaseTrain.${rt_id}.localization_committed_cents == 205390"

      - name: doc_set_budget_rounds_per_locale_before_summing_mode_b
        grounds:
          - calculations.doc_set_localization_budget
          - validations[priority=60]
          - entities.DocSetVersion.fields.projected_localization_budget_cents
          - entities.ReleaseTrain.fields.localization_budget_cap_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order is decisive on a different axis from the
          previous instance: rounding each locale's quote before summing gives 11375 + 9471
          = 20846, which exactly equals the cap and publishes, whereas summing the unrounded
          products (11375.20 + 9471.30 = 20846.50) and rounding once gives 20847 and would
          exceed the same cap by one cent.
        test_recipe:
          setup:
            - "Release train ATLAS 14.0 whose localization_budget_cap_cents is exactly 20846."
            - "One SENIOR writer capacity 100, both reviewer disciplines."
            - "One STANDARD plan item assigned 2026-08-03..2026-08-14 with one 1205-word revision, fully approved and NOT yet published."
            - "Two ACTIVE SIMULTANEOUS locales with tm_coverage_pct 0, sla_days 20 and parallel_job_limit 5: de-DE at 9.44 cents per word and fr-FR at 7.86 cents per word (walked in locale_code ASC order)."
            - "A DRAFT doc set 14.0-docs opened against the train's current version."
            - "Logical clock at 2026-08-01, so auto-created jobs will span 2026-08-01..2026-08-21 (21 days against a 20-day SLA — no rush surcharge)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "14.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 20846 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-webhooks", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-webhooks-overview", title: "Atlas Webhooks Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1205, used_terms: ["webhook"], summary: "overview" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
