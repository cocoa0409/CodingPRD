          trigger:
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2026, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { det26_lep: "$.data.lep_cents", det26_total: "$.data.total_premium_cents" }
            - call: "POST /medicare/premium-determinations"
