      - name: shift_full_boundary
        claim_type: aggregate_validation
        grounds: ["validations[priority=9]", "errors[ERR_SHIFT_FULL]", "entities.Shift.fields.assigned_count"]
        distinguishing_aspect: "Seat capacity is inclusive: with required_headcount 1 the first assignment fills the shift (assigned_count == 1 is legal) and the second assignment rejects ERR_SHIFT_FULL."
        test_recipe:
          setup: ["two VOLUNTEER workers; shift with required_headcount 1"]
