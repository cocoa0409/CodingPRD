# =============================================================================
# SCAFFOLD.yaml — Escrow Holdback & Repair Escrow Administration
# =============================================================================

scenario: |
  Escrow Holdback & Repair Escrow Administration (title/escrow company): holdback
  agreement terms & amount (repair cost plus contingency), lender/insurer approval
  requirements, contractor selection & work completion deadline, inspection
  verification & draw disbursement, cost overrun & shortfall funding responsibility,
  expiration & forfeiture/return of funds, weather-delayed exterior work extension,
  dispute between buyer and seller

domain_name: escrow-holdback-administration
api_prefix: /escrow

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: EscrowFile
    parent: null
    common_fields: true
    fields:
      - { name: property_address, type: string, source: input, description: "Street address of the property in escrow" }
      - { name: closing_date, type: string, source: input, description: "Closing date, ISO YYYY-MM-DD" }
      - { name: buyer_user_id, type: string, source: input, description: "Opaque X-User-ID of the buyer of record" }
      - { name: seller_user_id, type: string, source: input, description: "Opaque X-User-ID of the seller of record" }
      - { name: lender_user_id, type: string, source: input, description: "Opaque X-User-ID of the lender representative; lender approval is always required" }
      - { name: insurer_user_id, type: string, source: input, description: "Opaque X-User-ID of the insurer representative", constraints: "optional; when omitted no insurer approval is required" }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED — CLOSED once its Holdback reaches CLOSED_COMPLETED or CLOSED_EXPIRED, else OPEN" }

  - name: Holdback
    parent: EscrowFile
    common_fields: true
    fields:
      - { name: escrow_file_id, type: string, source: system, description: "FK -> EscrowFile.id; owning escrow file" }
      - { name: repair_scope, type: string, source: input, description: "Agreed scope of repairs" }
      - { name: repair_estimate_cents, type: integer, source: input, description: "Contractor repair cost estimate in cents", constraints: "> 0" }
      - { name: contingency_pct, type: integer, source: input, description: "Contingency percentage added to the estimate", constraints: "integer 10..25 inclusive" }
      - { name: holdback_amount_cents, type: integer, source: computed, description: "round_half_up(repair_estimate_cents * (100 + contingency_pct) / 100); recomputed on amend" }
      - { name: commitment_basis_cents, type: integer, source: computed, description: "round_half_up(selected_bid.amount_cents * (100 + contingency_pct) / 100) once a bid is selected; null before selection" }
      - { name: funding_source, type: enum, source: input, description: "SELLER_PROCEEDS | BUYER_DEPOSIT | SPLIT_EQUAL — who funded the holdback; drives completed-close remainder split" }
      - { name: overrun_responsibility, type: enum, source: input, description: "BUYER | SELLER | SPLIT_EQUAL — who must deposit cost overruns" }
      - { name: expiration_terms, type: enum, source: input, description: "RETURN_TO_SELLER | RELEASE_TO_BUYER | SPLIT_EQUAL — default remainder disposition at expiration close" }
      - { name: work_deadline_date, type: string, source: input, description: "Contractor work completion deadline, ISO YYYY-MM-DD; must be <= hard_stop_date" }
      - { name: hard_stop_date, type: string, source: input, description: "Absolute latest completion date; extensions may never push the effective deadline past it, ISO YYYY-MM-DD" }
      - { name: exterior_work_flag, type: boolean, source: input, description: "True when the scope is exterior work eligible for weather extension" }
      - { name: granted_extension_days, type: integer, source: computed, description: "Sum of granted_days over GRANTED ExtensionRequests; default 0" }
      - { name: effective_deadline_date, type: string, source: computed, description: "work_deadline_date + granted_extension_days" }
      - { name: lender_approval_required, type: boolean, source: computed, description: "Always true" }
      - { name: insurer_approval_required, type: boolean, source: computed, description: "True iff the EscrowFile has insurer_user_id set" }
      - { name: selected_bid_id, type: string, source: system, description: "Selected Bid id (nullable; set by POST /escrow/bids/{id}/select)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVALS | ACTIVE | EXPIRED | CLOSED_COMPLETED | CLOSED_EXPIRED" }
      - { name: trust_balance_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents (signed) for this holdback; equals last entry running_balance_cents" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of amount_cents of DrawRequests in APPROVED state (approved-unpaid commitments)" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum of magnitudes of DRAW_DEBIT ledger entries" }
      - { name: total_shortfall_deposited_cents, type: integer, source: computed, description: "Sum of SHORTFALL_DEPOSIT ledger entries" }
      - { name: work_verified, type: boolean, source: computed, description: "True iff its WorkOrder (1:1) is in VERIFIED; false when no work order exists" }
      - { name: disbursement_frozen, type: boolean, source: computed, description: "True iff any Dispute of this holdback is OPEN" }
      - { name: closeout_status, type: enum, source: computed, description: "NOT_READY | READY_TO_CLOSE — READY_TO_CLOSE iff status=ACTIVE and work_verified and no OPEN dispute and no PLEDGED ShortfallPledge" }
      - { name: disposition_override, type: enum, source: system, description: "RETURN_TO_SELLER | RELEASE_TO_BUYER | SPLIT_EQUAL | null — set when a Dispute is resolved while the holdback is EXPIRED; overrides expiration_terms at expiration close" }

  - name: Approval
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: approver_role, type: enum, source: system, description: "LENDER | INSURER" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | STALE | CANCELLED" }
      - { name: approver_user_id, type: string, source: system, description: "Opaque user id that decided; null while REQUESTED" }
      - { name: holdback_version_at_decision, type: integer, source: system, description: "Holdback.version pinned when decided; null while REQUESTED" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp; null while REQUESTED" }
      - { name: rejection_reason, type: string, source: input, description: "Optional reason supplied at decide when decision=REJECTED" }

  - name: Bid
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: contractor_user_id, type: string, source: system, description: "Opaque X-User-ID of the bidding contractor, recorded from the create request" }
      - { name: amount_cents, type: integer, source: input, description: "Bid price in cents", constraints: "> 0" }
      - { name: scope_text, type: string, source: input, description: "Bid scope narrative" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SELECTED | REJECTED" }

  - name: WorkOrder
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id; exactly one WorkOrder per Holdback" }
      - { name: contractor_user_id, type: string, source: system, description: "Copied from the selected Bid at creation" }
      - { name: agreed_amount_cents, type: integer, source: system, description: "Copied from the selected Bid amount_cents" }
      - { name: started_at, type: datetime, source: system, description: "Work order creation timestamp" }
      - { name: completion_deadline_date, type: string, source: computed, description: "Always mirrors the parent Holdback.effective_deadline_date" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETION_SUBMITTED | VERIFIED" }
      - { name: failed_final_count, type: integer, source: system, description: "Number of FAILED FINAL_VERIFICATION/REINSPECTION reports; default 0" }
      - { name: submitted_completion_at, type: datetime, source: system, description: "Last submit-completion timestamp; null until first submission" }

  - name: Inspection
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: inspector_user_id, type: string, source: input, description: "Opaque user id of the assigned inspector" }
      - { name: purpose, type: enum, source: input, description: "DRAW_VERIFICATION | FINAL_VERIFICATION | REINSPECTION" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled window start (ISO8601); must be < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled window end (ISO8601)" }
      - { name: status, type: enum, source: system, description: "PLANNED | PASSED | FAILED | CANCELLED" }
      - { name: reported_at, type: datetime, source: system, description: "Report timestamp; null while PLANNED" }
      - { name: result_notes, type: string, source: input, description: "Optional notes supplied at report" }

  - name: DrawRequest
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: contractor_user_id, type: string, source: system, description: "Opaque X-User-ID of the requesting contractor; must equal the selected Bid's contractor_user_id" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement in cents; may exceed available trust cash (shortfall path)", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Work billed by this draw" }
      - { name: is_final, type: boolean, source: input, description: "True when this is the final billing", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | PAID | CANCELLED" }
      - { name: approved_at, type: datetime, source: system, description: "null until approved" }
      - { name: paid_at, type: datetime, source: system, description: "null until paid" }

  - name: ExtensionRequest
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: requester_user_id, type: string, source: system, description: "Buyer or seller user id, from the create request" }
      - { name: reason, type: enum, source: input, description: "WEATHER_EXTERIOR | SUPPLY_DELAY | OTHER" }
      - { name: requested_days, type: integer, source: input, description: "Days requested", constraints: "integer 1..45" }
      - { name: evidence_ref, type: string, source: input, description: "Reference to supporting evidence (e.g., weather report)" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | DENIED | CANCELLED" }
      - { name: granted_days, type: integer, source: system, description: "Computed at grant; null until GRANTED" }
      - { name: decided_at, type: datetime, source: system, description: "null until decided" }

  - name: Dispute
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: initiator_role, type: enum, source: system, description: "BUYER | SELLER, from X-User-Role" }
      - { name: initiator_user_id, type: string, source: system, description: "From X-User-ID; must match the file's buyer or seller id" }
      - { name: category, type: enum, source: input, description: "WORK_QUALITY | DRAW_DENIAL | DEADLINE | EXPENSE_RESPONSIBILITY | OTHER" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount in dispute", constraints: ">= 0" }
      - { name: statement, type: string, source: input, description: "Initiator's statement" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_BUYER | RESOLVED_SELLER | RESOLVED_SPLIT" }
      - { name: resolution_note, type: string, source: input, description: "Supplied at resolve" }
      - { name: resolved_at, type: datetime, source: system, description: "null until resolved" }

  - name: ShortfallPledge
    parent: Holdback
    common_fields: true
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: payer_role, type: enum, source: system, description: "BUYER | SELLER — assigned per overrun_responsibility" }
      - { name: payer_user_id, type: string, source: system, description: "Resolved from the EscrowFile's buyer/seller id" }
      - { name: amount_cents, type: integer, source: system, description: "Pledged shortfall amount; split rule pinned in calculations.shortfall_assessment" }
      - { name: status, type: enum, source: system, description: "PLEDGED | DEPOSITED" }
      - { name: deposited_at, type: datetime, source: system, description: "null until deposited" }

  - name: LedgerEntry
    parent: Holdback
    common_fields: false
    fields:
      - { name: holdback_id, type: string, source: system, description: "FK -> Holdback.id" }
      - { name: seq, type: integer, source: system, description: "Per-holdback monotonic sequence starting at 1; orders entries within a single request's waterfall" }
      - { name: entry_type, type: enum, source: system, description: "FUNDING | DRAW_DEBIT | SHORTFALL_DEPOSIT | RETURN_TO_SELLER | RELEASE_TO_BUYER | REFUND_TO_SOURCE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: credits into trust positive, debits negative" }
      - { name: running_balance_cents, type: integer, source: system, description: "Trust balance after applying this entry (chronological accumulator)" }
      - { name: memo, type: string, source: system, description: "Human-readable provenance note" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EscrowFile
    field: status
    derivation: |
      Derived, not user-driven: OPEN while its Holdback (0..1) is absent or in a
      non-terminal state (DRAFT, PENDING_APPROVALS, ACTIVE, EXPIRED); CLOSED once
      the Holdback reaches CLOSED_COMPLETED or CLOSED_EXPIRED (bubble-up at close).

  - entity: Holdback
    initial_state: DRAFT
    terminal_states: [CLOSED_COMPLETED, CLOSED_EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVALS
        trigger: "POST /escrow/holdbacks/{id}/submit"
        actor: EscrowOfficer
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "Create one Approval(status=REQUESTED, approver_role=LENDER); if insurer_approval_required also create Approval(approver_role=INSURER)"
      - from: PENDING_APPROVALS
        to: ACTIVE
        trigger: "system — evaluated after each approval decide"
        actor: system
        preconditions:
          - "Every required Approval of this holdback is APPROVED (none left in REQUESTED, none REJECTED)"
        side_effects:
          - "status -> ACTIVE"
      - from: PENDING_APPROVALS
        to: DRAFT
        trigger: "system — any Approval decided REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Sibling Approvals still REQUESTED -> CANCELLED"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /escrow/holdbacks/{id}/amend"
        actor: EscrowOfficer
        preconditions:
          - "expected_holdback_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Terms updated; holdback_amount_cents recomputed; version += 1"
          - "Funding delta ledger entry: FUNDING(+delta) when new amount > funded, REFUND_TO_SOURCE(-delta) when less"
      - from: PENDING_APPROVALS
        to: DRAFT
        trigger: "POST /escrow/holdbacks/{id}/amend"
        actor: EscrowOfficer
        preconditions:
          - "expected_holdback_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "All REQUESTED/APPROVED Approvals -> STALE (re-approval required after resubmit)"
          - "Same term/funding-delta effects as DRAFT amend; version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /escrow/holdbacks/{id}/expire"
        actor: EscrowOfficer
        preconditions:
          - "clock date (UTC) > effective_deadline_date (else ERR_NOT_EXPIRED; equality on the deadline date does not expire)"
          - "work_verified == false (else ERR_INVALID_STATE — verified work must be closed, not expired)"
        side_effects:
          - "All DrawRequests in SUBMITTED -> CANCELLED"
          - "All Inspections in PLANNED -> CANCELLED"
          - "All ExtensionRequests in PENDING -> CANCELLED"
      - from: ACTIVE
        to: CLOSED_COMPLETED
        trigger: "POST /escrow/holdbacks/{id}/close"
        actor: EscrowOfficer
        preconditions:
          - "closeout_status == READY_TO_CLOSE (else ERR_CLOSE_NOT_READY)"
        side_effects:
          - "Waterfall (calculations.close_waterfall): DRAW_DEBIT per APPROVED draw (approved_at ASC, tie created_at ASC), then remainder per funding_source split rule"
          - "trust_balance_cents -> 0; EscrowFile.status recomputes to CLOSED"
      - from: EXPIRED
        to: CLOSED_EXPIRED
        trigger: "POST /escrow/holdbacks/{id}/close"
        actor: EscrowOfficer
        preconditions:
          - "no OPEN Dispute and no PLEDGED ShortfallPledge (else ERR_CLOSE_NOT_READY)"
        side_effects:
          - "Waterfall: DRAW_DEBIT per APPROVED draw (approved_at ASC, tie created_at ASC), then remainder per (disposition_override ?? expiration_terms)"
          - "trust_balance_cents -> 0; EscrowFile.status recomputes to CLOSED"

  - entity: Approval
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED, STALE, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /escrow/approvals/{id}/decide (decision=APPROVED)"
        actor: Lender | Insurer
        preconditions:
          - "Caller role matches approver_role and caller user id matches the file's lender/insurer id (else ERR_NOT_FILE_PARTY)"
        side_effects:
          - "approver_user_id, decided_at set; holdback_version_at_decision = current Holdback.version"
          - "If no REQUESTED approvals remain on the holdback: Holdback PENDING_APPROVALS -> ACTIVE"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /escrow/approvals/{id}/decide (decision=REJECTED)"
        actor: Lender | Insurer
        preconditions:
          - "Same ownership rule as APPROVED"
        side_effects:
          - "Holdback PENDING_APPROVALS -> DRAFT; sibling REQUESTED approvals -> CANCELLED"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SELECTED
        trigger: "POST /escrow/bids/{id}/select"
        actor: Buyer
        preconditions:
          - "Caller user id == escrow file buyer_user_id (else ERR_NOT_FILE_PARTY)"
          - "Holdback ACTIVE (else ERR_HOLDBACK_NOT_ACTIVE)"
          - "No other Bid of this holdback already SELECTED (else ERR_WORK_ORDER_EXISTS)"
        side_effects:
          - "All other SUBMITTED bids of this holdback -> REJECTED"
          - "Create WorkOrder(IN_PROGRESS) with contractor_user_id/agreed_amount_cents from this bid"
          - "Holdback.selected_bid_id = this bid; commitment_basis_cents recomputed from bid amount"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system — another bid of the same holdback is selected"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: IN_PROGRESS
    terminal_states: [VERIFIED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETION_SUBMITTED
        trigger: "POST /escrow/work-orders/{id}/submit-completion"
        actor: Contractor
        preconditions:
          - "Caller user id == contractor_user_id (else ERR_NOT_FILE_PARTY)"
        side_effects:
          - "submitted_completion_at = clock"
      - from: COMPLETION_SUBMITTED
        to: VERIFIED
        trigger: "system — FINAL_VERIFICATION or REINSPECTION inspection reported PASSED"
        actor: system
        preconditions: []
        side_effects:
          - "Holdback.work_verified recomputes true; closeout_status recomputed"
      - from: COMPLETION_SUBMITTED
        to: IN_PROGRESS
        trigger: "system — FINAL_VERIFICATION or REINSPECTION inspection reported FAILED (rework loop)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_final_count += 1; Holdback.work_verified recomputes false; closeout_status -> NOT_READY"

  - entity: Inspection
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PASSED
        trigger: "POST /escrow/inspections/{id}/report (result=PASSED)"
        actor: Inspector
        preconditions:
          - "Caller user id == inspector_user_id (else ERR_NOT_FILE_PARTY)"
          - "purpose in {FINAL_VERIFICATION, REINSPECTION}: the holdback's WorkOrder must be COMPLETION_SUBMITTED (else ERR_WORK_NOT_SUBMITTED)"
        side_effects:
          - "reported_at = clock; FINAL_VERIFICATION/REINSPECTION: WorkOrder COMPLETION_SUBMITTED -> VERIFIED"
      - from: PLANNED
        to: FAILED
        trigger: "POST /escrow/inspections/{id}/report (result=FAILED)"
        actor: Inspector
        preconditions:
          - "Same as PASSED"
        side_effects:
          - "reported_at = clock; FINAL_VERIFICATION/REINSPECTION: WorkOrder COMPLETION_SUBMITTED -> IN_PROGRESS, failed_final_count += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system — parent holdback expires"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrawRequest
    initial_state: SUBMITTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /escrow/draw-requests/{id}/approve"
        actor: EscrowOfficer
        preconditions:
          - "Holdback ACTIVE (else ERR_HOLDBACK_NOT_ACTIVE)"
          - "Holdback not disbursement_frozen (else ERR_DISPUTE_FROZEN)"
          - "A verifying Inspection exists: status=PASSED, purpose in {DRAW_VERIFICATION, FINAL_VERIFICATION}, reported_at >= this draw's created_at; latest by reported_at, tie-break created_at ASC (else ERR_NO_VERIFYING_INSPECTION)"
        side_effects:
          - "approved_at = clock; Holdback.reserved_cents += amount_cents"
          - "Shortfall assessment: projected_excess = (total_disbursed_cents + reserved_cents_after_this) - (holdback_amount_cents + total_shortfall_deposited_cents); if > 0 create ShortfallPledge(s) per overrun_responsibility"
      - from: APPROVED
        to: PAID
        trigger: "POST /escrow/draw-requests/{id}/pay"
        actor: EscrowOfficer
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE / ERR_DRAW_NOT_APPROVED for SUBMITTED)"
          - "Holdback ACTIVE (else ERR_HOLDBACK_NOT_ACTIVE)"
          - "Holdback not disbursement_frozen (else ERR_DISPUTE_FROZEN)"
          - "No ShortfallPledge of this holdback in PLEDGED (else ERR_SHORTFALL_UNFUNDED)"
        side_effects:
          - "LedgerEntry DRAW_DEBIT(-amount_cents) appended; trust_balance_cents -= amount_cents; total_disbursed_cents += amount_cents; reserved_cents -= amount_cents; paid_at = clock"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system — parent holdback expires"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, CANCELLED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /escrow/extension-requests/{id}/decide (decision=GRANTED)"
        actor: EscrowOfficer
        preconditions:
          - "Holdback ACTIVE (else ERR_HOLDBACK_NOT_ACTIVE)"
          - "Computed granted_days >= 1 (else ERR_EXTENSION_EXCEEDS_HARD_STOP)"
        side_effects:
          - "granted_days = calculations.extension_grant; Holdback.granted_extension_days += granted_days; effective_deadline_date recomputed; WorkOrder.completion_deadline_date mirrors"
      - from: PENDING
        to: DENIED
        trigger: "POST /escrow/extension-requests/{id}/decide (decision=DENIED)"
        actor: EscrowOfficer
        preconditions:
          - "Holdback ACTIVE"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "system — parent holdback expires"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_BUYER, RESOLVED_SELLER, RESOLVED_SPLIT]
    transitions:
      - from: OPEN
        to: RESOLVED_BUYER
        trigger: "POST /escrow/disputes/{id}/resolve (resolution=FOR_BUYER)"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "If Holdback EXPIRED: Holdback.disposition_override = RELEASE_TO_BUYER; disbursement_frozen recomputes false"
      - from: OPEN
        to: RESOLVED_SELLER
        trigger: "POST /escrow/disputes/{id}/resolve (resolution=FOR_SELLER)"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "If Holdback EXPIRED: Holdback.disposition_override = RETURN_TO_SELLER; disbursement_frozen recomputes false"
      - from: OPEN
        to: RESOLVED_SPLIT
        trigger: "POST /escrow/disputes/{id}/resolve (resolution=SPLIT)"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "If Holdback EXPIRED: Holdback.disposition_override = SPLIT_EQUAL; disbursement_frozen recomputes false"

  - entity: ShortfallPledge
    initial_state: PLEDGED
    terminal_states: [DEPOSITED]
    transitions:
      - from: PLEDGED
        to: DEPOSITED
        trigger: "POST /escrow/shortfall-pledges/{id}/deposit"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "LedgerEntry SHORTFALL_DEPOSIT(+amount_cents) appended; trust_balance_cents += amount_cents; total_shortfall_deposited_cents += amount_cents; deposited_at = clock"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: amend-holdback-stale-version
    parent_entity: Holdback
    write_endpoint: "POST /escrow/holdbacks/{id}/amend"
    occ_field: expected_holdback_version
    description: |
      Amending a Holdback whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      amended or submitted the agreement in the meantime, so the current
      writer's amendment would silently discard terms it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: holdback_sizing
    trigger: "holdback creation and amend"
    algorithm: threshold
    formula: |
      holdback_amount_cents = round_half_up(repair_estimate_cents * (100 + contingency_pct) / 100)
      commitment_basis_cents = round_half_up(selected_bid.amount_cents * (100 + contingency_pct) / 100)   # null until a bid is SELECTED
    input_set: "the holdback's own terms; selected bid (post-selection)"
    constants:
      CONTINGENCY_MIN_PCT: 10
      CONTINGENCY_MAX_PCT: 25
    precision: "integer cents, round_half_up at the final multiplication only"
    variants:
      - name: PROVISIONAL
        when: "at creation/amend — sized from the estimate"
        difference: "uses repair_estimate_cents; this is the amount actually funded"
      - name: COMMITMENT_BASIS
        when: "after bid selection — sized from the selected bid"
        difference: "uses Bid.amount_cents; diverges from PROVISIONAL whenever the selected bid differs from the estimate (exposes underfunding gap)"

  - name: shortfall_assessment
    trigger: "draw approval"
    algorithm: threshold
    formula: |
      projected_excess = (total_disbursed_cents + reserved_cents_including_this_draw) - (holdback_amount_cents + total_shortfall_deposited_cents)
      if projected_excess > 0:            # strictly greater; excess == 0 creates no pledge
        if overrun_responsibility == BUYER:  one pledge (BUYER, projected_excess)
        if overrun_responsibility == SELLER: one pledge (SELLER, projected_excess)
        if overrun_responsibility == SPLIT_EQUAL:
          buyer_pledge  = round_half_up(projected_excess / 2)     # buyer rounded first
          seller_pledge = projected_excess - buyer_pledge         # seller takes the residual
        else-single-pledge cases: no split
    input_set: "all PAID draws (total_disbursed_cents), all APPROVED draws including this one (reserved), FUNDING amount and SHORTFALL_DEPOSIT entries"
    constants: {}
    precision: "integer cents, round_half_up on the split only"

  - name: draw_payable_cap
    trigger: "draw approval (pledge sizing) and payment batching decisions"
    algorithm: aggregation
    formula: |
      GROSS variant: payable_cap = trust_balance_cents
      NET variant (PINNED):  payable_cap = trust_balance_cents - reserved_cents_of_other_APPROVED_draws
      The NET variant reserves cash for other approved-but-unpaid draws; GROSS does not.
    input_set: "DrawRequests of this holdback in APPROVED (unpaid) state; ledger balance"
    constants: {}
    precision: "integer cents"
    variants:
      - name: GROSS
        when: "rejected reading"
        difference: "ignores approved-unpaid commitments; overcommits cash when any APPROVED-unpaid draw exists"
      - name: NET
        when: "authoritative"
        difference: "subtracts other approved-unpaid draws; diverges from GROSS exactly when at least one other APPROVED-unpaid draw exists"

  - name: extension_grant
    trigger: "extension decide with decision=GRANTED"
    algorithm: tiered_pricing
    formula: |
      per_request_cap = 21 if reason == WEATHER_EXTERIOR else 7
      total_cap_remaining = MAX_TOTAL_EXTENSION_DAYS - sum(granted_days over GRANTED extensions of this holdback)
      hard_stop_remaining = (hard_stop_date - effective_deadline_date) in whole days
      granted_days = min(requested_days, per_request_cap, total_cap_remaining, hard_stop_remaining)
      decide GRANTED with granted_days <= 0 -> ERR_EXTENSION_EXCEEDS_HARD_STOP
      new effective_deadline_date = effective_deadline_date + granted_days
    input_set: "this ExtensionRequest; GRANTED ExtensionRequests of the same holdback"
    constants:
      MAX_TOTAL_EXTENSION_DAYS: 45
      WEATHER_PER_REQUEST_CAP_DAYS: 21
      NON_WEATHER_PER_REQUEST_CAP_DAYS: 7
    precision: "whole days, calendar dates UTC"

  - name: close_waterfall
    trigger: "holdback close (from ACTIVE -> CLOSED_COMPLETED, or EXPIRED -> CLOSED_EXPIRED)"
    algorithm: waterfall_allocation
    formula: |
      Step 1: pay each APPROVED draw in order approved_at ASC (tie-break created_at ASC):
              append LedgerEntry DRAW_DEBIT(-draw.amount_cents); draw -> PAID (paid_at = clock)
      Step 2: remainder = trust_balance_cents after step 1
      Step 3: disposition basis =
                CLOSED_COMPLETED path: funding_source
                CLOSED_EXPIRED path:   disposition_override ?? expiration_terms
              RETURN_TO_SELLER: one entry RETURN_TO_SELLER(-remainder)
              RELEASE_TO_BUYER:   one entry RELEASE_TO_BUYER(-remainder)
              SPLIT_EQUAL:
                seller_share = round_half_up(remainder / 2)   # seller rounded first
                buyer_share  = remainder - seller_share       # buyer takes the residual
                entries: RETURN_TO_SELLER(-seller_share) then RELEASE_TO_BUYER(-buyer_share)
      After the waterfall trust_balance_cents == 0 (invariant).
    input_set: "APPROVED draws of this holdback; ledger balance; funding_source / expiration_terms / disposition_override"
    constants: {}
    precision: "integer cents; rounding order pinned: round the seller share half-up first, buyer receives the residual (independently rounding both shares drifts by a cent on odd remainders)"

  - name: ledger_reconciliation
    trigger: "every ledger mutation (fund, amend delta, deposit, pay, close waterfall)"
    algorithm: chronological
    formula: |
      Entries are ordered by seq (per-holdback, assigned in append order).
      running_balance_cents(entry N) = running_balance_cents(entry N-1) + amount_cents(entry N),
      with running_balance_cents(first) = amount_cents(first).
      Invariants:
        holdback.trust_balance_cents == sum(amount_cents over all entries) == last running_balance_cents
        holdback.reserved_cents == sum(amount_cents of APPROVED DrawRequests)
    input_set: "all LedgerEntry rows of the holdback, seq ASC"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the seven declared roles; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path ids exist and (for sub-resources) belong to the parent in the path", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 4, category: business_constraint, check: "Input shape: required fields present; enum members valid; integer ranges honored (contingency_pct 10..25, requested_days 1..45, amounts > 0, claimed_amount_cents >= 0); work_deadline_date <= hard_stop_date; scheduled_start < scheduled_end; unknown body fields rejected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 5, category: business_referential, check: "Ownership: caller's X-User-ID matches the stored party id for the action (file buyer selects bids; lender/insurer decide their own approvals; engaged contractor owns bids/draws/work order; assigned inspector reports; dispute caller is the file buyer or seller). When the referenced engagement does not exist (no selected bid), the ownership check is skipped and later state gates fire.", error_id: ERR_NOT_FILE_PARTY, http_status: 403, applies_to: "party-scoped endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_holdback_version == Holdback.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /escrow/holdbacks/{id}/amend" }
  - { priority: 7, category: state, check: "Generic state precondition for the attempted transition (wrong from-state, terminal lockdown, duplicate decide/report/resolve/deposit, reinspection without prior failure)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Domain state gates in this order: ERR_HOLDBACK_NOT_ACTIVE (bid create/select, draw create/approve/pay, inspection schedule, extension create/decide require ACTIVE); ERR_NO_SELECTED_CONTRACTOR (draw create before any bid selected); ERR_DRAW_NOT_APPROVED (pay on SUBMITTED); ERR_APPROVAL_NOT_PENDING; ERR_BID_NOT_SELECTABLE; ERR_INSPECTION_NOT_PLANNED; ERR_WORK_NOT_SUBMITTED", error_id: "ERR_HOLDBACK_NOT_ACTIVE | ERR_NO_SELECTED_CONTRACTOR | ERR_DRAW_NOT_APPROVED | ERR_APPROVAL_NOT_PENDING | ERR_BID_NOT_SELECTABLE | ERR_INSPECTION_NOT_PLANNED | ERR_WORK_NOT_SUBMITTED", http_status: 409, applies_to: "action endpoints" }
  - { priority: 9, category: state, check: "Disbursement freeze: holdback.disbursement_frozen blocks draw approve/pay", error_id: ERR_DISPUTE_FROZEN, http_status: 409, applies_to: "POST /escrow/draw-requests/{id}/approve, POST /escrow/draw-requests/{id}/pay" }
  - { priority: 10, category: business_constraint, check: "Cardinality/uniqueness: one holdback per escrow file (ERR_HOLDBACK_ALREADY_EXISTS); one SUBMITTED bid per contractor per holdback (ERR_BID_ALREADY_SUBMITTED); no bid creation after selection (ERR_WORK_ORDER_EXISTS); one SUBMITTED draw at a time (ERR_DRAW_ALREADY_OPEN); one PENDING extension at a time (ERR_EXTENSION_ALREADY_PENDING); one OPEN dispute at a time (ERR_DISPUTE_ALREADY_OPEN)", error_id: "ERR_HOLDBACK_ALREADY_EXISTS | ERR_BID_ALREADY_SUBMITTED | ERR_WORK_ORDER_EXISTS | ERR_DRAW_ALREADY_OPEN | ERR_EXTENSION_ALREADY_PENDING | ERR_DISPUTE_ALREADY_OPEN", http_status: 409, applies_to: "create endpoints" }
  - { priority: 11, category: business_constraint, check: "Eligibility: WEATHER_EXTERIOR extension requires exterior_work_flag == true", error_id: ERR_EXTENSION_NOT_WEATHER_ELIGIBLE, http_status: 409, applies_to: "POST /escrow/extension-requests" }
  - { priority: 12, category: business_constraint, check: "Interval occupation, checked in this order: (a) inspector calendar — new [scheduled_start, scheduled_end) must not overlap any PLANNED inspection of the same inspector_user_id across all holdbacks; half-open semantics, adjacency (start == existing end) allowed (ERR_INSPECTOR_SCHEDULE_CONFLICT); (b) property slot — new [scheduled_start, scheduled_end] must not overlap any PLANNED inspection of the same holdback; CLOSED semantics, adjacency conflicts (ERR_INSPECTION_SLOT_OCCUPIED)", error_id: "ERR_INSPECTOR_SCHEDULE_CONFLICT | ERR_INSPECTION_SLOT_OCCUPIED", http_status: 409, applies_to: "POST /escrow/inspections" }
  - { priority: 13, category: business_referential, check: "Verifying inspection exists for draw approval (PASSED, purpose in {DRAW_VERIFICATION, FINAL_VERIFICATION}, reported_at >= draw.created_at)", error_id: ERR_NO_VERIFYING_INSPECTION, http_status: 409, applies_to: "POST /escrow/draw-requests/{id}/approve" }
  - { priority: 14, category: business_temporal, check: "Windows: extension create requires clock date <= effective_deadline_date (ERR_EXTENSION_WINDOW_CLOSED); expire requires clock date > effective_deadline_date (ERR_NOT_EXPIRED); extension grant must yield granted_days >= 1 (ERR_EXTENSION_EXCEEDS_HARD_STOP)", error_id: "ERR_EXTENSION_WINDOW_CLOSED | ERR_NOT_EXPIRED | ERR_EXTENSION_EXCEEDS_HARD_STOP", http_status: 409, applies_to: "extension create, expire, extension decide" }
  - { priority: 15, category: business_fiscal, check: "Shortfall coverage: draw pay requires no PLEDGED ShortfallPledge on the holdback", error_id: ERR_SHORTFALL_UNFUNDED, http_status: 409, applies_to: "POST /escrow/draw-requests/{id}/pay" }
  - { priority: 16, category: business_fiscal, check: "Closeout aggregate: close from ACTIVE requires closeout_status == READY_TO_CLOSE; close from EXPIRED requires no OPEN dispute and no PLEDGED pledge", error_id: ERR_CLOSE_NOT_READY, http_status: 409, applies_to: "POST /escrow/holdbacks/{id}/close" }

# =============================================================================
# §1.5 API Endpoint Table (33 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/escrow/_clock/set_current_utc", description: "Set the logical clock (test-driving). Default before any set: 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. All deadline/expiry comparisons read this clock.", roles: [EscrowOfficer], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

  - { method: POST, path: "/escrow/files", description: "Open an escrow file for a property transaction", roles: [EscrowOfficer], code: 201, input: [property_address, closing_date, buyer_user_id, seller_user_id, lender_user_id, "insurer_user_id?"], output: EscrowFile, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/escrow/files/{id}", description: "Get an escrow file", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: EscrowFile, side_effects: [] }
  - { method: GET, path: "/escrow/files/{id}/holdbacks", description: "List holdbacks of an escrow file Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "Holdback[]", side_effects: [] }

  - { method: POST, path: "/escrow/holdbacks", description: "Create a holdback agreement (funds are withheld at creation: FUNDING ledger entry for the computed holdback_amount_cents)", roles: [EscrowOfficer], code: 201, input: [escrow_file_id, repair_scope, repair_estimate_cents, contingency_pct, funding_source, overrun_responsibility, expiration_terms, work_deadline_date, hard_stop_date, exterior_work_flag], output: Holdback, side_effects: ["status=DRAFT; LedgerEntry FUNDING(+holdback_amount_cents) seq 1; trust_balance_cents = holdback_amount_cents"] }
  - { method: GET, path: "/escrow/holdbacks/{id}", description: "Get a holdback", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: Holdback, side_effects: [] }
  - { method: POST, path: "/escrow/holdbacks/{id}/submit", description: "Submit a DRAFT holdback for lender/insurer approval", roles: [EscrowOfficer], code: 200, input: [], output: Holdback, side_effects: ["status -> PENDING_APPROVALS; REQUESTED Approvals created (LENDER always; INSURER when required)"] }
  - { method: POST, path: "/escrow/holdbacks/{id}/amend", description: "Amend terms of a DRAFT or PENDING_APPROVALS holdback (OCC on version; recomputes amount and posts the funding delta; STALEs live approvals)", roles: [EscrowOfficer], code: 200, input: [expected_holdback_version, "repair_scope?", "repair_estimate_cents?", "contingency_pct?", "funding_source?", "overrun_responsibility?", "expiration_terms?", "work_deadline_date?", "hard_stop_date?", "exterior_work_flag?"], output: Holdback, side_effects: ["version += 1; holdback_amount_cents recomputed; FUNDING/REFUND_TO_SOURCE delta ledger entry; from PENDING_APPROVALS: approvals -> STALE and status -> DRAFT"] }
  - { method: POST, path: "/escrow/holdbacks/{id}/expire", description: "Expire an ACTIVE holdback whose effective deadline has passed with work unverified", roles: [EscrowOfficer], code: 200, input: [], output: Holdback, side_effects: ["status -> EXPIRED; SUBMITTED draws -> CANCELLED; PLANNED inspections -> CANCELLED; PENDING extensions -> CANCELLED"] }
  - { method: POST, path: "/escrow/holdbacks/{id}/close", description: "Close an ACTIVE (verified) or EXPIRED holdback; runs the disbursement waterfall and zeroes the trust balance", roles: [EscrowOfficer], code: 200, input: [], output: Holdback, side_effects: ["close_waterfall ledger entries; status -> CLOSED_COMPLETED | CLOSED_EXPIRED; EscrowFile.status -> CLOSED"] }

  - { method: GET, path: "/escrow/holdbacks/{id}/approvals", description: "List approvals of a holdback (ordered created_at ASC, tie-break approver_role ASC) Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "Approval[]", side_effects: [] }
  - { method: POST, path: "/escrow/approvals/{id}/decide", description: "Lender or insurer approves/rejects their approval request", roles: [Lender, Insurer], code: 200, input: [decision, "rejection_reason?"], output: Approval, side_effects: ["APPROVED: version pinned; auto-activate holdback when no REQUESTED remain; REJECTED: holdback -> DRAFT, siblings CANCELLED"] }

  - { method: POST, path: "/escrow/bids", description: "Contractor submits a bid on an ACTIVE holdback", roles: [Contractor], code: 201, input: [holdback_id, amount_cents, scope_text], output: Bid, side_effects: ["status=SUBMITTED; contractor_user_id = caller"] }
  - { method: GET, path: "/escrow/holdbacks/{id}/bids", description: "List bids of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "Bid[]", side_effects: [] }
  - { method: POST, path: "/escrow/bids/{id}/select", description: "Buyer of record selects a bid; creates the WorkOrder and rejects competing bids", roles: [Buyer], code: 200, input: [], output: Bid, side_effects: ["this bid -> SELECTED; other SUBMITTED bids -> REJECTED; WorkOrder created IN_PROGRESS; holdback.selected_bid_id and commitment_basis_cents set"] }

  - { method: GET, path: "/escrow/holdbacks/{id}/work-orders", description: "List work orders of a holdback (0..1) Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/escrow/work-orders/{id}/submit-completion", description: "Engaged contractor declares work complete", roles: [Contractor], code: 200, input: [], output: WorkOrder, side_effects: ["IN_PROGRESS -> COMPLETION_SUBMITTED; submitted_completion_at set"] }

  - { method: POST, path: "/escrow/inspections", description: "Schedule an inspection on an ACTIVE holdback (inspector-calendar and property-slot occupation checks; purpose REINSPECTION requires the work order's failed_final_count >= 1, else ERR_INVALID_STATE)", roles: [EscrowOfficer], code: 201, input: [holdback_id, inspector_user_id, purpose, scheduled_start, scheduled_end], output: Inspection, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/escrow/holdbacks/{id}/inspections", description: "List inspections of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/escrow/inspections/{id}/report", description: "Assigned inspector reports PASSED/FAILED", roles: [Inspector], code: 200, input: [result, "result_notes?"], output: Inspection, side_effects: ["FINAL/REINSPECTION: work order VERIFIED on PASSED or back to IN_PROGRESS on FAILED (failed_final_count += 1)"] }

  - { method: POST, path: "/escrow/draw-requests", description: "Engaged contractor requests a draw", roles: [Contractor], code: 201, input: [holdback_id, amount_cents, description, "is_final?"], output: DrawRequest, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/escrow/holdbacks/{id}/draw-requests", description: "List draw requests of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "DrawRequest[]", side_effects: [] }
  - { method: POST, path: "/escrow/draw-requests/{id}/approve", description: "Escrow officer approves a draw after verification; reserves cash and assesses shortfall", roles: [EscrowOfficer], code: 200, input: [], output: DrawRequest, side_effects: ["reserved_cents += amount; shortfall pledges auto-created when projected_excess > 0"] }
  - { method: POST, path: "/escrow/draw-requests/{id}/pay", description: "Escrow officer disburses an approved draw", roles: [EscrowOfficer], code: 200, input: [], output: DrawRequest, side_effects: ["LedgerEntry DRAW_DEBIT; balances/reserved recomputed; paid_at set"] }

  - { method: POST, path: "/escrow/extension-requests", description: "Buyer or seller requests a completion-deadline extension", roles: [Buyer, Seller], code: 201, input: [holdback_id, reason, requested_days, evidence_ref], output: ExtensionRequest, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/escrow/holdbacks/{id}/extension-requests", description: "List extension requests of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "ExtensionRequest[]", side_effects: [] }
  - { method: POST, path: "/escrow/extension-requests/{id}/decide", description: "Escrow officer grants (possibly partially) or denies an extension", roles: [EscrowOfficer], code: 200, input: [decision, "decision_note?"], output: ExtensionRequest, side_effects: ["GRANTED: granted_days computed; effective deadline advanced"] }

  - { method: POST, path: "/escrow/disputes", description: "Buyer or seller opens a dispute (freezes disbursements)", roles: [Buyer, Seller], code: 201, input: [holdback_id, category, claimed_amount_cents, statement], output: Dispute, side_effects: ["status=OPEN; holdback.disbursement_frozen recomputes true"] }
  - { method: GET, path: "/escrow/holdbacks/{id}/disputes", description: "List disputes of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/escrow/disputes/{id}/resolve", description: "Escrow officer resolves a dispute; on an EXPIRED holdback the resolution overrides expiration_terms", roles: [EscrowOfficer], code: 200, input: [resolution, resolution_note], output: Dispute, side_effects: ["status -> RESOLVED_*; freeze lifted; disposition_override set iff holdback EXPIRED"] }

  - { method: GET, path: "/escrow/holdbacks/{id}/shortfall-pledges", description: "List shortfall pledges of a holdback Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "ShortfallPledge[]", side_effects: [] }
  - { method: POST, path: "/escrow/shortfall-pledges/{id}/deposit", description: "Escrow officer records receipt of pledged shortfall funds", roles: [EscrowOfficer], code: 200, input: [], output: ShortfallPledge, side_effects: ["status -> DEPOSITED; LedgerEntry SHORTFALL_DEPOSIT; balances recomputed"] }

  - { method: GET, path: "/escrow/holdbacks/{id}/ledger-entries", description: "List trust ledger entries of a holdback (seq ASC) Ordered by created_at ASC; equal timestamps keep insertion (append) order.", roles: [EscrowOfficer, Buyer, Seller, Lender, Insurer, Contractor, Inspector], code: 200, input: [], output: "LedgerEntry[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog (30 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FILE_PARTY, http: 403, condition: "Caller's user id does not match the stored party id this action is reserved for (buyer of record, lender/insurer of record, engaged contractor, assigned inspector)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (or sub-resource does not belong to the path parent)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed input: missing required field, invalid enum, range violation (contingency_pct 10..25, requested_days 1..45, amounts > 0), work_deadline_date > hard_stop_date, scheduled_start >= scheduled_end, or unknown body field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-from-state / terminal lockdown / duplicate decide-report-resolve-deposit / reinspection without prior failed final" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_holdback_version does not match the holdback's current version (OCC)" }
  - { id: ERR_HOLDBACK_ALREADY_EXISTS, http: 409, condition: "The escrow file already has a holdback" }
  - { id: ERR_HOLDBACK_NOT_ACTIVE, http: 409, condition: "Operation requires the holdback in ACTIVE state" }
  - { id: ERR_NO_SELECTED_CONTRACTOR, http: 409, condition: "Draw requested before any bid has been selected on the holdback" }
  - { id: ERR_APPROVAL_NOT_PENDING, http: 409, condition: "Decide attempted on an approval not in REQUESTED" }
  - { id: ERR_BID_ALREADY_SUBMITTED, http: 409, condition: "This contractor already has a SUBMITTED bid on the holdback" }
  - { id: ERR_BID_NOT_SELECTABLE, http: 409, condition: "Select attempted on a bid not in SUBMITTED" }
  - { id: ERR_WORK_ORDER_EXISTS, http: 409, condition: "A bid is already selected / work order already exists for this holdback" }
  - { id: ERR_DRAW_ALREADY_OPEN, http: 409, condition: "A SUBMITTED draw already exists on the holdback (one at a time)" }
  - { id: ERR_DRAW_NOT_APPROVED, http: 409, condition: "Pay attempted on a SUBMITTED draw" }
  - { id: ERR_NO_VERIFYING_INSPECTION, http: 409, condition: "No PASSED verification inspection reported on/after the draw's creation" }
  - { id: ERR_DISPUTE_FROZEN, http: 409, condition: "An OPEN dispute freezes draw approval and payment" }
  - { id: ERR_SHORTFALL_UNFUNDED, http: 409, condition: "A PLEDGED shortfall pledge has not been deposited yet" }
  - { id: ERR_WORK_NOT_SUBMITTED, http: 409, condition: "FINAL_VERIFICATION/REINSPECTION report requires the work order in COMPLETION_SUBMITTED" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Half-open interval overlap with another PLANNED inspection of the same inspector (adjacency allowed)" }
  - { id: ERR_INSPECTION_SLOT_OCCUPIED, http: 409, condition: "Closed-interval overlap with another PLANNED inspection of the same holdback (adjacency conflicts)" }
  - { id: ERR_INSPECTION_NOT_PLANNED, http: 409, condition: "Report attempted on an inspection not in PLANNED" }
  - { id: ERR_EXTENSION_ALREADY_PENDING, http: 409, condition: "Another extension request is already PENDING on the holdback" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "Extension requested after the effective deadline date (request on the deadline date itself is allowed)" }
  - { id: ERR_EXTENSION_NOT_WEATHER_ELIGIBLE, http: 409, condition: "WEATHER_EXTERIOR reason requires exterior_work_flag == true" }
  - { id: ERR_EXTENSION_EXCEEDS_HARD_STOP, http: 409, condition: "Grant would yield zero days (hard stop or cumulative cap reached)" }
  - { id: ERR_NOT_EXPIRED, http: 409, condition: "Expire attempted on/before the effective deadline date" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "An OPEN dispute already exists on the holdback" }
  - { id: ERR_CLOSE_NOT_READY, http: 409, condition: "Close preconditions unmet (work unverified on ACTIVE, OPEN dispute, or PLEDGED pledges outstanding)" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque; party identity stored on entities)
# =============================================================================
roles:
  - name: EscrowOfficer
    description: "Title/escrow company administrator; runs the file, approvals workflow, disbursements, extensions, disputes, and the ledger"
    identity: opaque
    exclusive_operations:
      - "POST /escrow/files; POST /escrow/holdbacks (+submit/amend/expire/close)"
      - "POST /escrow/inspections; POST /escrow/draw-requests/{id}/approve|pay"
      - "POST /escrow/extension-requests/{id}/decide; POST /escrow/disputes/{id}/resolve"
      - "POST /escrow/shortfall-pledges/{id}/deposit; POST /escrow/_clock/set_current_utc"
    shared_operations: ["GET reads"]
  - name: Buyer
    description: "Buyer of record on the escrow file"
    identity: opaque
    exclusive_operations: ["POST /escrow/bids/{id}/select"]
    shared_operations: ["POST /escrow/extension-requests", "POST /escrow/disputes", "GET reads"]
  - name: Seller
    description: "Seller of record on the escrow file"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /escrow/extension-requests", "POST /escrow/disputes", "GET reads"]
  - name: Lender
    description: "Lender representative; decides LENDER approvals"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /escrow/approvals/{id}/decide (LENDER approvals)", "GET reads"]
  - name: Insurer
    description: "Insurer representative; decides INSURER approvals"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /escrow/approvals/{id}/decide (INSURER approvals)", "GET reads"]
  - name: Contractor
    description: "Engaged/bidding contractor; bids, requests draws, reports completion"
    identity: opaque
    exclusive_operations: ["POST /escrow/bids", "POST /escrow/draw-requests", "POST /escrow/work-orders/{id}/submit-completion"]
    shared_operations: ["GET reads"]
  - name: Inspector
    description: "Assigned inspector; reports inspection results"
    identity: opaque
    exclusive_operations: ["POST /escrow/inspections/{id}/report"]
    shared_operations: ["GET reads"]
