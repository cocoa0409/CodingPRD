            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.5 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_b}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_a}/inspect", payload: { outcome: "PASS" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/entries/${e_a}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions/${div_a}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/jury-panels", payload: { regatta_id: "${reg}", chair_member_id: "${m_jc}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { pnl: $.data.id } }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "${m_j2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_pro}", position: "PRO", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_pro: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${d_pro}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_tk}", position: "TIMEKEEPER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_tk: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${d_tk}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_sg}", position: "SIGNALS", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { d_sg: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${d_sg}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 1, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r1: $.data.id } }
            - { call: "POST /regatta-ops/races/${r1}/start-sequence", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/races/${r1}/start", payload: { actual_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T15:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          trigger:
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_a}", finish_status: "FINISHED", elapsed_seconds: 4800.0 }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { res_a: $.data.id } }
          assert:
            - "the trigger call returns HTTP 201"
            - "RatingCertificate.${c_a}.rating_value == 0.8582 and RatingCertificate.${c_a}.band_key_spm == 171.3"
            - "RaceResult.${res_a}.corrected_seconds == 3772.2, the TIME_ON_DISTANCE result 4800.0 - 171.3 * 6.0"
            - "RaceResult.${res_a}.corrected_seconds != 4119.4, the TIME_ON_TIME result 4800.0 * 0.8582 that PER_CERTIFICATE would have produced"
            - "Race.${r1}.scoring_status == PROVISIONAL and Race.${r1}.results_closed_utc == 2026-08-05T15:00:00Z"
            - "RaceResult.${res_a}.place == null and RaceResult.${res_a}.points == 0: places and points wait for the score run"

      - name: per_race_rounding_precedes_the_series_sum
        claim_type: precision
        grounds:
          - calculations.series_standing
          - calculations.race_points_and_places
        excluded_because:
          difficulty_instance: rounding_order_dependency / series_gross_rounds_per_race_before_summing_bonus_tie
          rationale: "That instance builds a BONUS_POINT tie group whose mean is 5.5666..., asserts each per-race points value at 1 decimal and then asserts the gross as the sum of those already-rounded values, which is precisely the decimal-places-and-rounding-mode claim for both rules."

      - name: corrected_time_variants_diverge_on_identical_elapsed
        claim_type: variant_divergence
        grounds:
          - calculations.corrected_time.variants.TIME_ON_DISTANCE
          - calculations.corrected_time.variants.TIME_ON_TIME
        excluded_because:
          difficulty_instance: dual_variant_calculation / corrected_time_tod_versus_tot_on_identical_elapsed
          rationale: "That instance scores the same elapsed_seconds under both variants and asserts the delta between them, including the finishing-order inversion, which is the whole of this row."

      - name: series_aggregation_over_final_races_only
        claim_type: aggregation
        grounds:
          - calculations.series_standing
          - endpoints[GET /regatta-ops/entries/{id}/series-standing]
        excluded_because:
          difficulty_instance: threshold_boundary / discard_activates_exactly_at_fifth_final_race
          rationale: "The running-total claims are asserted there across five successive FINAL races: gross after each add, the discard floor at four counted races, and the pool conservation identity that the five race pools sum to the two entries' gross totals."

  # =========================================================================
  # From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: violation_error
        grounds:
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_UNKNOWN_ACTOR]
          - roles.ClubAdmin.identity
        distinguishing_aspect: |
          The header gate runs before the actor lookup and the actor lookup runs only for
          entity-backed roles: a request with X-User-Role but no X-User-ID and a request with an
          undeclared role name both answer 401, an entity-backed RegattaChair whose X-User-ID is
          not a ClubMember row answers 403, and the opaque ClubAdmin id "ops-desk-1" is accepted
          without ever being resolved against the roster.
        test_recipe:
          setup:
            - "One ClubMember row exists so the roster read has content."
            - "Trigger call 1 is sent with X-User-Role: ClubAdmin and NO X-User-ID header at all; trigger call 2 is sent with X-User-Role: Commodore, an undeclared role name."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          trigger:
            - { call: "GET /regatta-ops/club-members", payload: {}, as: ClubAdmin }
            - { call: "GET /regatta-ops/club-members", payload: {}, as: Commodore, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/club-members", payload: {}, as: RegattaChair, as_user_id: "00000000-0000-4000-8000-0000000000c1" }
            - { call: "GET /regatta-ops/club-members", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns HTTP 401 with error_id ERR_UNAUTHENTICATED: the missing X-User-ID header, not the role, is what fails"
            - "trigger call 2 returns HTTP 401 with error_id ERR_UNAUTHENTICATED and NOT ERR_FORBIDDEN_ROLE: an undeclared role name never reaches the endpoint roles list at priority 3"
            - "trigger call 3 returns HTTP 403 with error_id ERR_UNKNOWN_ACTOR: RegattaChair is entity_backed:ClubMember and the id resolves to nothing"
            - "trigger call 4 returns HTTP 200 with total_count 1: the ClubAdmin identity is opaque, so ops-desk-1 is never looked up in the roster"
            - "no ClubMember row was created or modified by any of the four calls"

      - name: competitor_calling_open_racing_returns_forbidden_role
        claim_type: violation_error
        grounds:
          - validations[priority 3 ERR_FORBIDDEN_ROLE]
          - endpoints[POST /regatta-ops/regattas/{id}/open-racing]
        distinguishing_aspect: |
          The role gate at priority 3 answers before any state or precondition check: a Competitor
          calling open-racing on a DRAFT regatta gets 403 ERR_FORBIDDEN_ROLE, and only when the
          RegattaChair repeats the very same call does the request reach the state machine and
          answer 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "One DRAFT regatta and one ClubMember who acts as a Competitor."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "trigger call 2 returns HTTP 409 with error_id ERR_INVALID_STATE, proving call 1 stopped at the role gate and never evaluated the DRAFT status"
            - "Regatta.${reg}.status == DRAFT and Regatta.${reg}.version == 1 after both calls"

      - name: unlicensed_measurer_blocked_from_certificate_create
        claim_type: conditional
        grounds:
          - validations[priority 4 ERR_MEASURER_NOT_LICENSED]
          - entities.ClubMember.fields.measurer_license_id
          - endpoints[PATCH /regatta-ops/club-members/{id}]
        distinguishing_aspect: |
          Rule 4 is conditional on the acting member's own roster row: the same member who is
          refused with 403 ERR_MEASURER_NOT_LICENSED files the identical certificate successfully
          once ClubAdmin patches a measurer_license_id onto them, and the refused attempt leaves
          Boat.version at 1 so the successful attempt can reuse expected_boat_version 1.
        test_recipe:
          setup:
            - "A ClubMember with measurer_license_id null, and one MONOHULL boat at version 1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Vera Nash", email: "vera.nash@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_new: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_new}" }
            - { call: "PATCH /regatta-ops/club-members/${m_new}", payload: { measurer_license_id: "M-777" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_new}", captures: { c_a: $.data.id } }
          assert:
            - "trigger call 1 returns HTTP 403 with error_id ERR_MEASURER_NOT_LICENSED"
            - "after trigger call 1, Boat.${b_a}.version == 1 and no RatingCertificate row exists for ${b_a}"
            - "trigger call 2 returns HTTP 200 with ClubMember.${m_new}.measurer_license_id == M-777"
            - "trigger call 3 returns HTTP 201 with RatingCertificate.${c_a}.status == DRAFT, measured_by_member_id == ${m_new}, raw_speed_index == 0.6545 and rating_value == 171.3"
            - "Boat.${b_a}.version == 2 only after trigger call 3"

      - name: pagination_limit_and_offset_boundaries_pass_before_out_of_range_values_fail
        claim_type: satisfaction_pass
        grounds:
          - validations[priority 7 ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
          - endpoints[GET /regatta-ops/boats]
        distinguishing_aspect: |
          The pagination window is inclusive at both declared ends and exclusive one step outside:
          limit 1, limit 100 and offset 0 all return 200, while limit 0, limit 101 and offset -1
          each return 400 ERR_INVALID_PAGINATION - and the legal calls still report the same
          total_count 2, so rejecting a bad page never changes the underlying count.
        test_recipe:
          setup:
            - "Two boats owned by the same member."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fable", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 9.6 }, as: Competitor, as_user_id: "${m_h1}" }
          trigger:
            - { call: "GET /regatta-ops/boats?limit=100&offset=0", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?limit=1&offset=1", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?limit=0", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?limit=101", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "GET /regatta-ops/boats?offset=-1", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns HTTP 200 with limit 100, offset 0, total_count 2, has_more false and 2 rows"
            - "trigger call 2 returns HTTP 200 with limit 1, offset 1, total_count 2, has_more false and 1 row"
            - "trigger calls 3, 4 and 5 each return HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "a sixth call GET /regatta-ops/boats with no query string returns limit 10, offset 0, total_count 2 and has_more false, applying the declared defaults"

      - name: competitor_acting_on_another_helms_entry_returns_not_acting_party
        claim_type: violation_error
        grounds:
          - validations[priority 5 ERR_NOT_ACTING_PARTY]
          - endpoints[POST /regatta-ops/entries/{id}/withdraw]
          - endpoints[POST /regatta-ops/boats]
        distinguishing_aspect: |
          Acting-party identity is resolved per endpoint from a different field each time: helm 2 is
          refused on helm 1's entry withdrawal and on helm 1's crew manifest because X-User-ID must
          equal Entry.helm_member_id, and refused on a boat create because it must equal
          Boat.owner_member_id in the payload - while helm 1 performs the identical withdrawal.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, two helms each with an ISSUED certificate and one SUBMITTED entry."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fable", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 9.6 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_b: $.data.id, b_b_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_b}", rule_code: "TOD_PHRF", sail_area_m2: 52.0, hull_length_m: 9.4, displacement_kg: 4100, draft_m: 1.95, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_b_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_b: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_b}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_b}", certificate_id: "${c_b}", helm_member_id: "${m_h2}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h2}", captures: { e_b: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/withdraw", payload: {}, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h2}", position: "TRIMMER", weight_kg: 79.25 }, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-9100", boat_name: "Borrowed Name", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 10.0 }, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/entries/${e_a}/withdraw", payload: {}, as: Competitor, as_user_id: "${m_h1}" }
          assert:
            - "trigger calls 1, 2 and 3 each return HTTP 403 with error_id ERR_NOT_ACTING_PARTY"
            - "Entry.${e_a}.registration_status == SUBMITTED, registered_crew_count == 0 and version == 1 after the three refusals"
            - "no Boat row with sail_number USA-9100 exists"
            - "trigger call 4 returns HTTP 200 with Entry.${e_a}.registration_status == WITHDRAWN and version == 2"
            - "Entry.${e_b} is untouched: registration_status == SUBMITTED and version == 1"

      - name: mark_boat_of_other_regatta_rejected
        claim_type: cross_entity
        grounds:
          - validations[priority 22 ERR_MARK_BOAT_ASSIGNMENT_INVALID]
          - entities.DutyAssignment.fields.mark_boat_id
          - entities.MarkBoat.fields.regatta_id
        distinguishing_aspect: |
          Rule 22 is a three-way coherence check between position, mark_boat_id and the mark boat's
          own regatta: MARK_BOAT_DRIVER with no boat, PRO with a boat, and SAFETY_BOAT pointing at
          a mark boat that belongs to the OTHER regatta all answer 422
          ERR_MARK_BOAT_ASSIGNMENT_INVALID, and none of them moves MarkBoat.committed_minutes off 0.
        test_recipe:
          setup:
            - "Two DRAFT regattas, each with one mark boat: MB-1 in regatta 1 and MB-2 in regatta 2."
            - "One ClubMember available for duty; every candidate window is 2026-08-05T12:00:00Z to 2026-08-05T20:00:00Z, that is 480 whole minutes."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg1: $.data.id } }
