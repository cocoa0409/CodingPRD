              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Confidentiality fixture.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${ps}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${ps}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c1}"
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${c1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${ps}", committee_member_id: "${c2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
          trigger:
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${ps}", committee_member_id: "${c1}" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { own: "$.data[0].id", ownmem: "$.data[0].committee_member_id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${ps}", committee_member_id: "${c2}" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { e1: "$.data.error_id" }
            - call: "GET /comp/ballots/${b2}"
              payload: {}
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /comp/ballots/${b2}"
              payload: {}
              as: CycleAdmin
              captures: { adminread: "$.data.id", adminstate: "$.data.state" }
          assert:
            - "${ownmem} == ${c1} and ${own} != ${b2} - C1 sees exactly its own ballot"
            - "${e1} == ERR_BALLOT_CONFIDENTIAL with HTTP 403 - a filtered list scoped to another member is refused, not silently emptied"
            - "${e2} == ERR_BALLOT_CONFIDENTIAL with HTTP 403"
            - "${adminread} == ${b2} and ${adminstate} == PENDING - CycleAdmin is exempt"
            - "CompensationCycle.${cy}.confidentiality_locked == false, so the refusal comes from the ownership clause, not the closed-cycle clause"

      - name: cycle_admin_performs_its_exclusive_operations_and_the_shared_reads
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles.CycleAdmin.exclusive_operations
          - roles.CycleAdmin.shared_operations
          - endpoints[POST /comp/cycles/{id}/advance]
        distinguishing_aspect: |
          Every CycleAdmin-exclusive write and every shared read succeeds for CycleAdmin
          without any ownership qualification - it opens a cycle, admits a partner, opens a
          matter, posts and verifies a contribution record, advances the cycle and reads
          each of those rows back, with no ERR_ROLE_NOT_PERMITTED and no
          ERR_ACTOR_NOT_A_PARTNER anywhere in the sequence.
        test_recipe:
          setup:
            - "Empty database beyond the clock call; the CycleAdmin actor id is not backed by any Partner row, which the priority-30 rule explicitly permits for this role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id", cst: "$.data.state" }
