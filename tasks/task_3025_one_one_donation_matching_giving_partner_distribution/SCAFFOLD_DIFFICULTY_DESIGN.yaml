              payload: { donation_product_id: "${prod_id}", partner_id: "${p_id}", stated_donation_units: 12000, stated_ratio_text: "one purchased = one donated", winback_multiplier: 1, stated_reference_period: "SEASON" }
              as: MarketingManager
