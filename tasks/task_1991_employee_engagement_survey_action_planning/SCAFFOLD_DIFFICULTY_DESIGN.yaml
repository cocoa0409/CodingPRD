              payload: { external_ref: "C001", unit_id: "${rd_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { rd_e1: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "C002", unit_id: "${rd_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
