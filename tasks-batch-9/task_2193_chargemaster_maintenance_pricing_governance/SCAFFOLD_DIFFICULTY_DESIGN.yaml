        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      assert:
      - trigger step 1 response.http_status == 409
      - trigger step 1 response.error.error_id == ERR_FACILITY_FROZEN
      - trigger step 1 response.error.error_id != ERR_ITEM_PRICE_FROZEN
      - trigger step 1 response.error.error_id != ERR_NO_APPLICABLE_PRICE_RULE
      - 'after trigger step 1: ChargeItem.${item_id}.price_status == PRICE_FROZEN'
      - 'after trigger step 1: ChargeItem.${item_id}.gross_charge_cents == 240000'
      - 'after trigger step 1: ChargeItem.${item_id}.applied_price_rule_id == ${pr1_id}'
      - 'after trigger step 2: TransparencyFile.${file_id}.status == FAILED'
      - 'after trigger step 2: ChargeItem.${item_id}.price_status == PRICED_CURRENT (VALIDATED -> FAILED thaws the frozen item, so priority 50 no longer applies)'
      - 'after trigger step 2: Facility.${fac_id}.chargemaster_posture == OPEN'
      - trigger step 3 response.http_status == 422
      - trigger step 3 response.error.error_id == ERR_NO_APPLICABLE_PRICE_RULE (proving the priority-53 business_fiscal row was already violated at step 1 and was masked by priority 14)
      - 'after trigger step 3: ChargeItem.${item_id}.gross_charge_cents == 240000'
  - name: priority_pair_validation_conflict__constraint_price_not_current_beats_fiscal_markup_limit_on_item_approve
    grounds:
    - validations[priority=49]
    - validations[priority=54]
    - state_machines.ChargeItem.PENDING_REVIEW_to_APPROVED
    - state_machines.ChargeItem.PRICED_CURRENT_to_PRICE_STALE
    - calculations.markup_compliance_ratio
    - calculations.gross_charge_from_price_rule
    distinguishing_aspect: 'A single POST /chargemaster/charge-items/{id}/lifecycle action=APPROVE simultaneously

      violates the `business_constraint` row at priority 49 (price_status == PRICE_STALE after

      its PriceRule was superseded) and the `business_fiscal` row at priority 54

      (markup_compliance_ratio yields 24000 bp against Facility.aggregate_markup_limit_bp of

      20000), and the response MUST carry ERR_ITEM_PRICE_NOT_CURRENT — the

      `business_constraint` category — while ERR_AGGREGATE_MARKUP_LIMIT surfaces only after a

      reprice clears priority 49.

      '
    test_recipe:
      setup:
      - Logical clock starts at 2026-08-01T00:00:00Z, later advanced to 2026-08-05T00:00:00Z.
      - Facility with rounding_mode NEAREST_CENT and a deliberately tight aggregate_markup_limit_bp of 20000; one department; one ACTIVE revenue code 0300.
      - PriceRule PR1 open-ended from 2026-08-01T00:00:00Z with markup tiers 0/32000, 50000/24000, 250000/18000, min_medicare_multiple_bp 10000, market_cap_multiple_bp 50000.
      - ChargeItem with cost_basis_cents 100000 repriced under PR1 to gross_charge_cents 240000 (tier 50000 -> 24000 bp), so its ratio is 24000 bp > the 20000 bp limit.
      - PR2 created with supersede_rule_id = PR1, which cascades the item's price_status PRICED_CURRENT -> PRICE_STALE while leaving gross_charge_cents at 240000.
      - Item then driven DRAFT -> PENDING_REVIEW so APPROVE is a legal §1.2 transition and priority 13 cannot mask the pair.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-MARKUP
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 20000
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory - general
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          rc_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Clinical Laboratory
          cost_center_code: CC-0300
          manager_user_id: dept_mgr_1
          allowed_revenue_code_values: []
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 50000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr1_id: $.data.id
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-6001
          description: Comprehensive metabolic panel
          code_type: CDM_INTERNAL
          cost_basis_cents: 100000
          medicare_rate_cents: 10000
          market_p75_cents: 5000000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          item_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 50000
          effective_from: '2026-08-05T00:00:00Z'
          supersede_rule_id: ${pr1_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr2_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
          note: submit for committee
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      trigger:
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: APPROVE
          note: committee approval attempt 1
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: APPROVE
          note: committee approval attempt 2
        as: PricingCommitteeApprover
        as_user_id: approver_1
      assert:
      - PriceRule.${pr1_id}.status == SUPERSEDED
      - PriceRule.${pr1_id}.superseded_by_rule_id == ${pr2_id}
      - PriceRule.${pr1_id}.effective_to == 2026-08-05T00:00:00Z
      - 'before trigger step 1: ChargeItem.${item_id}.price_status == PRICE_STALE'
      - 'before trigger step 1: ChargeItem.${item_id}.gross_charge_cents == 240000'
      - trigger step 1 response.http_status == 409
      - trigger step 1 response.error.error_id == ERR_ITEM_PRICE_NOT_CURRENT
      - trigger step 1 response.error.error_id != ERR_AGGREGATE_MARKUP_LIMIT
      - 'after trigger step 1: ChargeItem.${item_id}.lifecycle_status == PENDING_REVIEW'
      - 'after trigger step 1: ChargeItem.${item_id}.approved_by_user_id == null'
      - 'after trigger step 2: ChargeItem.${item_id}.price_status == PRICED_CURRENT'
      - 'after trigger step 2: ChargeItem.${item_id}.gross_charge_cents == 240000'
      - 'after trigger step 2: ChargeItem.${item_id}.applied_price_rule_id == ${pr2_id}'
      - trigger step 3 response.http_status == 422
      - trigger step 3 response.error.error_id == ERR_AGGREGATE_MARKUP_LIMIT (projected_markup_ratio_bp == 24000 > aggregate_markup_limit_bp == 20000, proving the priority-54 business_fiscal row was already
        violated at step 1 and was masked by priority 49)
      - 'after trigger step 3: ChargeItem.${item_id}.lifecycle_status == PENDING_REVIEW'
      - 'after trigger step 3: Facility.${fac_id}.active_item_count == 0'
- rule_id: boundary_precision_check
  instances:
  - name: boundary_precision_check__line_variance_bp_exactly_at_tolerance_100_on_reconcile
    grounds:
    - calculations.charge_capture_variance_summary
    - entities.CapturedCharge.fields.line_variance_bp
    - entities.CapturedCharge.fields.match_status
    - entities.ChargeCaptureBatch.fields.matched_line_count
    - entities.ChargeCaptureBatch.fields.exception_line_count
    - state_machines.ChargeCaptureBatch.INGESTED_to_RECONCILING
    distinguishing_aspect: 'The metric under test is the per-line signed variance in basis points

      (VARIANCE_TOLERANCE_BP = 100) reached through POST

      /chargemaster/charge-capture-batches/{batch_id}/reconcile: with

      expected_charge_cents pinned at exactly 1000000 per line, a posted overage of

      10000 cents is exactly +100 bp and MUST be MATCHED, 10049 cents rounds

      half-up to 100 and is still MATCHED, and 10050 cents rounds half-up to 101 and

      becomes PRICE_VARIANCE — the same three-point split holds symmetrically on the

      negative side.

      '
    test_recipe:
      setup:
      - Logical clock left at the fixed startup default 2026-08-01T00:00:00Z.
      - Facility BND with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 40000.
      - Department IMAGING (manager_user_id = u_dm_img).
      - RevenueCode 0320 ACTIVE with an ACTIVE FLAT_FEE PriceRule flat_fee_cents = 1000000, min_medicare_multiple_bp = 12000, market_cap_multiple_bp = 11000.
      - ChargeItem CDM-5000 with cost_basis_cents = 1000000, medicare_rate_cents = 100 (floor 120) and market_p75_cents = 10000000 (cap 11000000) so the flat fee survives both bounds; repriced to gross_charge_cents
        = 1000000 exactly and driven to ACTIVE. No companion item.
      - One INGESTED ChargeCaptureBatch over the closed window 2026-06-01..2026-06-30 with five quantity-1 lines on CDM-5000 (expected_charge_cents 1000000 each) on distinct encounters, posted at 1010000,
        1010049, 1010050, 990000 and 989950 cents.
      setup_api_calls:
      - call: POST /chargemaster/facilities
        payload:
          name: Boundary General
          cms_certification_number: CCN-2193-B
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Imaging
          cost_center_code: CC-320
          manager_user_id: u_dm_img
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0320'
          description: Radiology diagnostic
          requires_hcpcs: false
          allowed_code_types:
          - CDM_INTERNAL
          - REV_ONLY
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        captures:
          rc_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: FLAT_FEE
          effective_from: '2026-08-01T00:00:00Z'
          flat_fee_cents: 1000000
          min_medicare_multiple_bp: 12000
          market_cap_multiple_bp: 11000
        as: RevenueIntegrityAnalyst
        captures:
          rule_id: $.data.id
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-5000
          description: CT ABDOMEN WITH CONTRAST
          code_type: CDM_INTERNAL
          cost_basis_cents: 1000000
          medicare_rate_cents: 100
          market_p75_cents: 10000000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          item_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: u_pca_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: u_pca_1
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-06-01T00:00:00Z'
          window_end_date: '2026-06-30T00:00:00Z'
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          batch_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-5000
          encounter_id: ENC-1
          payer_code: AETNA_COMM
          service_datetime: '2026-06-02T08:00:00Z'
          quantity: 1
          posted_charge_cents: 1010000
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          lb_on_pos_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-5000
          encounter_id: ENC-2
          payer_code: AETNA_COMM
          service_datetime: '2026-06-03T08:00:00Z'
          quantity: 1
          posted_charge_cents: 1010049
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          lb_eps_below_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-5000
          encounter_id: ENC-3
          payer_code: AETNA_COMM
          service_datetime: '2026-06-04T08:00:00Z'
          quantity: 1
          posted_charge_cents: 1010050
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          lb_eps_above_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-5000
          encounter_id: ENC-4
          payer_code: AETNA_COMM
          service_datetime: '2026-06-05T08:00:00Z'
          quantity: 1
          posted_charge_cents: 990000
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          lb_on_neg_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-5000
          encounter_id: ENC-5
          payer_code: AETNA_COMM
          service_datetime: '2026-06-06T08:00:00Z'
          quantity: 1
          posted_charge_cents: 989950
        as: DepartmentManager
        as_user_id: u_dm_img
        captures:
          lb_eps_below_neg_id: $.data.id
      trigger:
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/reconcile
        payload: {}
        as: RevenueIntegrityAnalyst
      assert:
      - ChargeItem.${item_id}.gross_charge_cents == 1000000
      - CapturedCharge.${lb_on_pos_id}.line_variance_bp == 100 and CapturedCharge.${lb_on_pos_id}.match_status == MATCHED
      - CapturedCharge.${lb_eps_below_id}.line_variance_bp == 100 and CapturedCharge.${lb_eps_below_id}.match_status == MATCHED
      - CapturedCharge.${lb_eps_above_id}.line_variance_bp == 101 and CapturedCharge.${lb_eps_above_id}.match_status == PRICE_VARIANCE
      - CapturedCharge.${lb_on_neg_id}.line_variance_bp == -100 and CapturedCharge.${lb_on_neg_id}.match_status == MATCHED
      - CapturedCharge.${lb_eps_below_neg_id}.line_variance_bp == -101 and CapturedCharge.${lb_eps_below_neg_id}.match_status == PRICE_VARIANCE
      - ChargeCaptureBatch.${batch_id}.matched_line_count == 3
      - ChargeCaptureBatch.${batch_id}.exception_line_count == 2
      - ChargeCaptureBatch.${batch_id}.mean_line_variance_bp == 20
      - ChargeCaptureBatch.${batch_id}.total_expected_charge_cents == 5000000
      - ChargeCaptureBatch.${batch_id}.total_posted_charge_cents == 5010049
      - ChargeCaptureBatch.${batch_id}.status == RECONCILING
  - name: boundary_precision_check__included_item_count_zero_vs_one_on_transparency_validate
    grounds:
    - calculations.transparency_file_build
    - entities.TransparencyFile.fields.included_item_count
    - entities.TransparencyFile.fields.payer_column_count
    - entities.TransparencyFile.fields.validation_errors
    - entities.TransparencyFile.fields.content_hash
    - entities.Facility.fields.transparency_status
    - entities.Facility.fields.published_transparency_file_id
    - state_machines.TransparencyFile.BUILDING_to_FAILED
    - state_machines.TransparencyFile.BUILDING_to_VALIDATED
    - state_machines.TransparencyFile.VALIDATED_to_PUBLISHED
    - concurrency_rules[transparency-build-stale-facility]
    - validations[priority=17]
    distinguishing_aspect: 'The metric under test is the EMPTY-COLLECTION edge of included_item_count

      reached through POST /chargemaster/transparency-files/{file_id}/lifecycle

      action=VALIDATE (a different metric and a different endpoint from the numeric

      basis-point tolerance instance): the first build has included_item_count == 0

      with content_hash over the empty row list and VALIDATE routes BUILDING ->

      FAILED with validation_errors == [''NO_PUBLISHABLE_ITEMS''], while a second build

      taken after exactly one item reaches ACTIVE + PRICED_CURRENT has

      included_item_count == 1 and VALIDATE routes BUILDING -> VALIDATED.

      '
    test_recipe:
      setup:
      - Logical clock left at the fixed startup default 2026-08-01T00:00:00Z.
      - Facility TRN with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 40000; posture OPEN.
      - Department OUTPATIENT (manager_user_id = u_dm_op), ACTIVE RevenueCode 0300, one ACTIVE COST_PLUS_MARKUP PriceRule with the default tiers — all created BEFORE the first build, because a BUILDING
        file drives the facility posture to FROZEN and POST /price-rules is posture-gated.
      - One ACTIVE PayerContract AETNA_COMM/COMMERCIAL PERCENT_OF_CHARGE 4500bp with term 2026-01-01..2026-12-31 so payer_column_count is 1 in both builds and 'NO_ACTIVE_PAYER_COLUMNS' never appears.
      - No ChargeItem exists yet when the first transparency file is built, so the inclusion set is empty.
      setup_api_calls:
      - call: POST /chargemaster/facilities
        payload:
          name: Transparency Regional
          cms_certification_number: CCN-2193-T
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Outpatient Clinic
          cost_center_code: CC-OP
          manager_user_id: u_dm_op
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory
          requires_hcpcs: false
          allowed_code_types:
          - CDM_INTERNAL
          - REV_ONLY
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        captures:
          rc_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: COST_PLUS_MARKUP
          effective_from: '2026-08-01T00:00:00Z'
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 12000
          market_cap_multiple_bp: 11000
        as: RevenueIntegrityAnalyst
        captures:
          rule_id: $.data.id
      - call: POST /chargemaster/payer-contracts
        payload:
          facility_id: ${fac_id}
          payer_code: AETNA_COMM
          product_line: COMMERCIAL
          reimbursement_method: PERCENT_OF_CHARGE
          term_start_date: '2026-01-01T00:00:00Z'
          term_end_date: '2026-12-31T00:00:00Z'
          percent_of_charge_bp: 4500
          trailing_units: 5
          renegotiation_notice_days: 30
        as: ContractManager
        captures:
          pc_id: $.data.id
      - call: GET /chargemaster/facilities/${fac_id}
        payload: {}
        as: ComplianceOfficer
        captures:
          fac_v1: $.data.version
      trigger:
      - call: POST /chargemaster/transparency-files
        payload:
          facility_id: ${fac_id}
          file_format: CSV
          expected_facility_version: ${fac_v1}
        as: ComplianceOfficer
        captures:
          f1_id: $.data.id
      - call: POST /chargemaster/transparency-files/${f1_id}/lifecycle
        payload:
          action: VALIDATE
          note: first attempt on an empty chargemaster
        as: ComplianceOfficer
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-6000
          description: COMPREHENSIVE METABOLIC PANEL
          code_type: CDM_INTERNAL
          cost_basis_cents: 40000
          medicare_rate_cents: 20000
          market_p75_cents: 200000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          item_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: u_pca_1
      - call: POST /chargemaster/charge-items/${item_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: u_pca_1
      - call: GET /chargemaster/facilities/${fac_id}
        payload: {}
        as: ComplianceOfficer
        captures:
          fac_v2: $.data.version
      - call: POST /chargemaster/transparency-files
        payload:
          facility_id: ${fac_id}
          file_format: CSV
          expected_facility_version: ${fac_v2}
        as: ComplianceOfficer
        captures:
          f2_id: $.data.id
      - call: POST /chargemaster/transparency-files/${f2_id}/lifecycle
        payload:
          action: VALIDATE
          note: second attempt with exactly one publishable item
        as: ComplianceOfficer
      - call: POST /chargemaster/transparency-files/${f2_id}/lifecycle
        payload:
          action: PUBLISH
          note: machine-readable file live
        as: ComplianceOfficer
      assert:
      - 'After trigger[0]: TransparencyFile.${f1_id}.status == BUILDING and TransparencyFile.${f1_id}.as_of_datetime == 2026-08-01T00:00:00Z'
      - TransparencyFile.${f1_id}.included_item_count == 0
      - TransparencyFile.${f1_id}.total_gross_charge_cents == 0
      - TransparencyFile.${f1_id}.payer_column_count == 1
      - TransparencyFile.${f1_id}.content_hash == e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 (SHA256 of the empty serialization)
