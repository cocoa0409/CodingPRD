scaffold_corner_design:

  # ───────────────────────────── Entities ─────────────────────────────
  - section: entities
    instances:
      - name: client_register_returns_201_with_defaults
        claim_type: Creation
        grounds: ['entities.Client', 'endpoints."POST /styling/clients/register"']
        distinguishing_aspect: "Registering with full_name+email returns 201 with a server-minted id, wallet_credit_cents=0, has_paid_invoice=false, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /styling/clients/register"
              payload: { full_name: "New Client", email: "new_c1@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
          assert:
            - "http status == 201"
            - "Client.${cl_id}.wallet_credit_cents == 0"
            - "Client.${cl_id}.has_paid_invoice == false"
            - "Client.${cl_id}.status == ACTIVE"

      - name: get_client_nonexistent_returns_404
        claim_type: Not Found
        grounds: ['entities.Client', 'errors[ERR_CLIENT_NOT_FOUND]']
        distinguishing_aspect: "GET a non-existent client id returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /styling/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_CLIENT_NOT_FOUND"
            - "http status == 404"

      - name: register_missing_email_returns_422
        claim_type: Required Fields
        grounds: ['entities.Client.fields.email', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Registering without the required email returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /styling/clients/register"
              payload: { full_name: "No Email" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: register_wallet_input_ignored
        claim_type: System Fields
        grounds: ['entities.Client.fields.wallet_credit_cents']
        distinguishing_aspect: "A client-supplied wallet_credit_cents is ignored; the created client's wallet is 0 (system-controlled)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /styling/clients/register"
              payload: { full_name: "Sneaky", email: "sneaky1@x.com", wallet_credit_cents: 99999 }
              as: Anonymous
              captures: { cl_id: $.data.id }
          assert:
            - "Client.${cl_id}.wallet_credit_cents == 0"

      - name: stylist_create_bad_tier_returns_422
        claim_type: Type Constraints
        grounds: ['entities.Stylist.fields.tier', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Creating a stylist with an out-of-enum tier returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /styling/stylists"
              payload: { full_name: "Bad Tier", email: "bt1@x.com", commission_pct: 0.3, tier: "PLATINUM" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

  # ───────────────────────────── State machines ─────────────────────────────
  - section: state_machines
    instances:
      - name: complete_from_scheduled_state_rejected
        claim_type: Invalid Transitions
        grounds: ['state_machines.Session.CONFIRMED_to_COMPLETED', 'errors[ERR_INVALID_SESSION_STATE]']
        distinguishing_aspect: "Completing a session still in SCHEDULED (never CONFIRMED) returns ERR_INVALID_SESSION_STATE (409)."
        test_recipe:
          setup: ["HOURLY engagement ACTIVE; one session SCHEDULED (not confirmed)."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St A", email: "sta_c@x.com", commission_pct: 0.3, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl A", email: "cla_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-16T10:00:00Z", scheduled_end: "2026-04-16T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 60 }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_SESSION_STATE"
            - "http status == 409"

      - name: accept_already_accepted_lookbook_rejected
        claim_type: Terminal State Lockdown
        grounds: ['state_machines.Lookbook.DELIVERED_to_ACCEPTED', 'errors[ERR_INVALID_LOOKBOOK_STATE]']
        distinguishing_aspect: "Accepting a lookbook already in terminal ACCEPTED returns ERR_INVALID_LOOKBOOK_STATE (409)."
        test_recipe:
          setup: ["HOURLY engagement ACTIVE; lookbook with one outfit DELIVERED then ACCEPTED."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St B", email: "stb_c@x.com", commission_pct: 0.3, tier: "LEAD" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl B", email: "clb_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /styling/engagements/${eng_id}/lookbooks"
              payload: { title: "LB" }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /styling/lookbooks/${lb_id}/outfits"
              payload: { name: "O1" }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/lookbooks/${lb_id}/deliver"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/lookbooks/${lb_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /styling/lookbooks/${lb_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_LOOKBOOK_STATE"
            - "http status == 409"

      - name: activate_engagement_twice_rejected
        claim_type: Idempotency
        grounds: ['state_machines.Engagement.DRAFT_to_ACTIVE', 'errors[ERR_INVALID_ENGAGEMENT_STATE]']
        distinguishing_aspect: "Activating an already-ACTIVE engagement returns ERR_INVALID_ENGAGEMENT_STATE (409)."
        test_recipe:
          setup: ["HOURLY engagement created and ACTIVATED once."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St C", email: "stc_c@x.com", commission_pct: 0.3, tier: "JUNIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl C", email: "clc_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENGAGEMENT_STATE"
            - "http status == 409"

  # ───────────────────────────── Calculations ─────────────────────────────
  - section: calculations
    instances:
      - name: markup_tier_boundary_at_5000
        claim_type: Constants Applied
        grounds: ['calculations.retail_markup_and_commission', 'entities.PurchaseItem.fields.markup_pct']
        distinguishing_aspect: "retail_cost exactly 5000 selects the MID markup 0.20 (>=5000), giving marked_up 6000 and commission round((6000-5000)*0.40)=400; 4999 would take the 0.30 tier."
        test_recipe:
          setup: ["Stylist commission 0.40; HOURLY engagement ACTIVE; SHOPPING session CONFIRMED."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St D", email: "std_c@x.com", commission_pct: 0.40, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl D", email: "cld_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "pear", color_palette: "COOL", budget_band: "MID", lifestyle: "x" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "SHOPPING", modality: "IN_PERSON", scheduled_start: "2026-04-17T10:00:00Z", scheduled_end: "2026-04-17T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "dress", retail_cost_cents: 5000 }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { item_id: $.data.id }
          assert:
            - "PurchaseItem.${item_id}.markup_pct == 0.20"
            - "PurchaseItem.${item_id}.marked_up_price_cents == 6000"
            - "PurchaseItem.${item_id}.commission_cents == 400"

      - name: markup_high_tier_at_20000
        claim_type: Correct Result
        grounds: ['calculations.retail_markup_and_commission']
        distinguishing_aspect: "retail_cost 20000 selects HIGH tier 0.10, marked_up 22000, commission round((22000-20000)*0.40)=800."
        test_recipe:
          setup: ["Stylist commission 0.40; HOURLY engagement ACTIVE; SHOPPING session CONFIRMED."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St E", email: "ste_c@x.com", commission_pct: 0.40, tier: "LEAD" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl E", email: "cle_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "athletic", color_palette: "WARM", budget_band: "LUXURY", lifestyle: "x" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "SHOPPING", modality: "IN_PERSON", scheduled_start: "2026-04-18T10:00:00Z", scheduled_end: "2026-04-18T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "coat", retail_cost_cents: 20000 }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { item_id: $.data.id }
          assert:
            - "PurchaseItem.${item_id}.markup_pct == 0.10"
            - "PurchaseItem.${item_id}.marked_up_price_cents == 22000"
            - "PurchaseItem.${item_id}.commission_cents == 800"

      - name: invoice_volume_discount_5pct_at_50000_boundary
        claim_type: Correct Result
        grounds: ['calculations.engagement_invoice_total', 'entities.Invoice.fields.volume_discount_cents']
        distinguishing_aspect: "A single COMPLETED session charge of 51000 (>= 50000) triggers the 5% volume tier: styling_fee round(5100.0)=5100, volume_discount round(2550.0)=2550, total 51000+5100-2550=53550."
        test_recipe:
          setup: ["HOURLY engagement ACTIVE (block_rate 3000); one session CONFIRMED then COMPLETED at actual 255 minutes (17 blocks = 51000). No wallet credit."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St F", email: "stf_c@x.com", commission_pct: 0.30, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl F", email: "clf_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "oval", color_palette: "NEUTRAL", budget_band: "PREMIUM", lifestyle: "x" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "EVENT", modality: "IN_PERSON", scheduled_start: "2026-04-19T10:00:00Z", scheduled_end: "2026-04-19T14:15:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 255 }
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/engagements/${eng_id}/invoices"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 51000"
            - "Invoice.${inv_id}.styling_fee_cents == 5100"
            - "Invoice.${inv_id}.volume_discount_cents == 2550"
            - "Invoice.${inv_id}.total_cents == 53550"

  # ───────────────────────────── Validations / RBAC ─────────────────────────────
  - section: validations
    instances:
      - name: client_cannot_create_stylist
        claim_type: Violation → Error
        grounds: ['validations[priority=2]', 'errors[ERR_UNAUTHORIZED]', 'roles.Client']
        distinguishing_aspect: "A Client calling the PlatformAdmin-only stylist-create endpoint is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One registered client."]
          setup_api_calls:
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl G", email: "clg_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /styling/stylists"
              payload: { full_name: "Nope", email: "nope_c@x.com", commission_pct: 0.3, tier: "SENIOR" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: client_cannot_cancel_others_engagement
        claim_type: Violation → Error
        grounds: ['validations[priority=5]', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "Client B cancelling Client A's engagement is denied with ERR_UNAUTHORIZED (403) by the ownership check."
        test_recipe:
          setup: ["Client A HOURLY engagement ACTIVE; a second Client B registered."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "St H", email: "sth_c@x.com", commission_pct: 0.3, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl A2", email: "cla2_c@x.com" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl B2", email: "clb2_c@x.com" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${a_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${a_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /styling/engagements/${eng_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${b_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: stylist_cannot_complete_others_session
        claim_type: Violation → Error
        grounds: ['validations[priority=5]', 'errors[ERR_UNAUTHORIZED]', 'roles.Stylist']
        distinguishing_aspect: "A stylist who is not the engagement's stylist cannot complete its session -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Engagement with stylist STY1 ACTIVE; assessment COMPLETED; session CONFIRMED by STY1. A second stylist STY2 exists."]
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "STY1", email: "sty1_c@x.com", commission_pct: 0.3, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty1_id: $.data.id }
            - call: "POST /styling/stylists"
              payload: { full_name: "STY2", email: "sty2_c@x.com", commission_pct: 0.3, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty2_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cl I", email: "cli_c@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "x", color_palette: "COOL", budget_band: "MID", lifestyle: "x" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty1_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty1_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-20T10:00:00Z", scheduled_end: "2026-04-20T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty1_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 90 }
              as: Stylist
              as_user_id: "${sty2_id}"
              captures: { err_id: $.data.error_id }
          assert:
