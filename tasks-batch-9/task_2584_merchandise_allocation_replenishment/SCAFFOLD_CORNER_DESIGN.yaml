      - name: optional_field_omission_lands_on_declared_defaults
        claim_type: defaults
        grounds:
          - entities.AllocationProgram.fields.transfer_min_ratio_bp
          - entities.AllocationProgram.fields.scorecard_basis
          - entities.SizeProfile.fields.core_size_min_share_bp
          - entities.StorePosition.fields.on_order_units
          - entities.FixturePlan.fields.effective_to
          - entities.PromoEvent.fields.item_class
          - response_envelope.pagination
        distinguishing_aspect: |
          Seven writes are issued with every optional input omitted, and each must land on the exact
          declared default rather than on null, 0 or an implementation guess: transfer_min_ratio_bp 15000,
          scorecard_basis UNIT_WEIGHTED, core_size_min_share_bp 1500 (which makes all four sizes of the
          curve CORE because the smallest share is exactly 1500), on_order_units 0, effective_to null
          meaning +infinity, replenishment_model_override null, and the three PromoEvent target fields null.
          The final list read shows the pagination defaults limit 10 / offset 0 are defaults too.
        test_recipe:
          setup:
            - "The database is empty and the logical clock is 2026-08-01T00:00:00Z"
            - "Every call in the trigger supplies only the required inputs of its endpoint and omits every optional one"
            - "The size curve used is S 2000 / M 3500 / L 3000 / XL 1500, whose minimum share equals the default core threshold exactly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
