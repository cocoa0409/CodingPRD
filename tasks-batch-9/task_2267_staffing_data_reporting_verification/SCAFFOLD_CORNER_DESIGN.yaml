            - "the submit by ${w_admin} returns 200 with status SUBMITTED, proving only the identity and not the role was the obstacle"
            - "the accept by auditor-verify-01 returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES, since HourEntry.${e1}.verified_by_user_id == auditor-verify-01"
            - "the accept by auditor-accept-01 returns 200 with status ACCEPTED and accepted_by_user_id == auditor-accept-01"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_versions_rejected_on_every_occ_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hour-entry-create-stale-submission]
          - concurrency_rules[allocation-replace-stale-submission]
          - concurrency_rules[appeal-create-stale-measure]
        distinguishing_aspect: "All three §1.2.1 rules are probed on their declared write endpoints, and the measure rule shows that publish itself advances the version a client captured at computation time."
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission whose version has advanced past the value observed at creation, and a measure computed then published so the computation-time version is stale"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
            - *k_measure
            - *k_publish
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-09", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "PUT /hour-entries/${e1}/allocations"
              payload: { allocations: [{ job_category_id: "${jc_rn}", percent: 50.00 }, { job_category_id: "${jc_admin}", percent: 50.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "MEASURE_CALCULATION_ERROR", narrative: "Filed against the pre-publication view of the measure.", expected_measure_version: "${mver}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "MEASURE_CALCULATION_ERROR", narrative: "Refiled against the published view of the measure.", expected_measure_version: "${mver2}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          assert:
            - "the hour-entry create returns 412 with data.error_id == ERR_STALE_SUBMISSION_VERSION, since ${sv} was captured before the entry, census, reconcile, validate, submit and accept writes advanced the version"
            - "the allocation replacement returns 412 with data.error_id == ERR_STALE_SUBMISSION_VERSION and HourEntry.${e1}.allocation_revision is still 0 with direct_care_hours 8.00"
            - "the appeal at ${mver} returns 412 with data.error_id == ERR_STALE_MEASURE_VERSION, since publish incremented StaffingMeasure.${meas}.version to ${mver2}"
            - "the refiled appeal at ${mver2} returns 201 with status SUBMITTED, proving the version and not the payload was the obstacle"
            - "QuarterlySubmission.${sub}.version == ${sv_acc} and total_direct_care_hours == 8.00 after both refused submission writes"

      - name: audit_risk_floor_boundary_seventy_exact_versus_just_below
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.audit_support_score
          - endpoints[GET /facilities/{id}/audit-readiness]
        distinguishing_aspect: "at_risk is a strict comparison against AUDIT_RISK_FLOOR 70.00, so a support_ratio of exactly 0.4000 lands on 70.00 and is not at risk while 0.3994 lands on 69.97 and is."
        test_recipe:
          setup:
            - "A 2026Q2 submission with 8.00 SUPPORTED hours out of 20.00 considered hours and its single census day RECONCILED"
            - "A 2026Q3 submission at the same facility with 7.98 SUPPORTED hours out of 19.98 considered hours and its single census day RECONCILED"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-02", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_unv: $.data.id }
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_per3
            - *k_sub3
            - call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-07-01", pay_period_end: "2026-07-01", paid_hours: 7.98, support_type: "TIMECARD", document_ref: "TC-K0701" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr3: $.data.id }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub3}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-07-01", shift_start: "07:00", shift_end: "14:59", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr3}", expected_submission_version: "${sv3}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_798: $.data.id, sv3b: $.data.submission_version }
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub3}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-07-02", shift_start: "07:00", shift_end: "19:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv3b}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_1200: $.data.id }
            - call: "POST /census-days"
              payload: { submission_id: "${sub3}", census_date: "2026-07-01", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c3b: $.data.id }
            - call: "POST /census-days/${c3b}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries/${e_798}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
          trigger:
            - call: "GET /facilities/${fac}/audit-readiness"
              payload: { submission_id: "${sub}", variant: "FULL" }
