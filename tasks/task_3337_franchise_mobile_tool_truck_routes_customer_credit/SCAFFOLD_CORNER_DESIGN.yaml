            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id", r1_ver0: "$.data.version" } }
