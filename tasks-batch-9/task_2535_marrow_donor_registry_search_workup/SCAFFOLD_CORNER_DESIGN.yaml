          assert:
            - "one sweep call expires BOTH overdue rows: each is \"EXPIRED\" with expired_by_sweep_at \"2026-08-08T00:00:01Z\" - the same instant for both, because the whole batch runs at one logical now"
            - "both candidates move to \"TYPING_EXPIRED\" with ct_attempt_count 1; the rank-1 row keeps candidate_role \"PRIMARY\" and the rank-2 row keeps \"BACKUP\""
            - "no promotion and no stall: SearchRequest.status is still \"PRIMARY_ENGAGED\" with backup_candidate_count 1, because neither candidate has reached MAX_CT_ATTEMPTS 2"
            - "last_sweep_at is \"2026-08-08T00:00:01Z\" after the first sweep"
            - "the second sweep at the same clock instant is a total no-op: no row changes status, expired_by_sweep_at is unchanged, and the response still reports \"PRIMARY_ENGAGED\" - the input set is empty because no REQUESTED row is left"

      - name: a_search_request_links_its_patient_and_its_scored_donors
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_registry_search_requests
          - endpoints.GET_registry_patients_id_search_requests
          - endpoints.GET_registry_match_candidates
          - validations[priority=6]
        distinguishing_aspect: |
          The link is verified from both ends and in the failing direction: a body FK that does not exist
          must produce ERR_PATIENT_NOT_FOUND (404) with no SearchRequest written, while a successful call
          must be reachable from the patient AND each materialized candidate must join back to BOTH its
          search and its donor, so filtering candidates by donor_id alone finds the row.
        test_recipe:
          setup:
            - "one domestic registry, one donor D1, one patient"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              is_negative_trigger: true
              captures: { err_fk: "$.data.error_id" }
            - call: "GET /registry/patients/${p_id}/search-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_total_before: "$.meta.total_count" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id", sr_patient: "$.data.patient_id", sr_pool: "$.data.match_pool_size" }
            - call: "GET /registry/patients/${p_id}/search-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_total_after: "$.meta.total_count", sr_first_id: "$.data[0].id" }
            - call: "GET /registry/match-candidates"
              payload: { donor_id: "${d1_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc_total: "$.meta.total_count", mc_search: "$.data[0].search_request_id", mc_donor: "$.data[0].donor_id", mc_rank: "$.data[0].rank_position" }
          assert:
            - "the request naming a non-existent patient returns 404 with error_id \"ERR_PATIENT_NOT_FOUND\" (priority 6, body FK existence)"
            - "that rejection wrote nothing: the patient's search-request list is still empty (total_count 0) before the valid call"
            - "the valid call returns 201 with patient_id equal to the created patient and match_pool_size 1"
            - "the link is navigable from the patient side: the patient's search-request list now has total_count 1 and its single row is the created search"
            - "the candidate joins back to both parents: filtering candidates by donor_id alone returns exactly 1 row whose search_request_id is the new search, whose donor_id is D1 and whose rank_position is 1"

      - name: donor_counters_are_computed_reads_not_stored_inputs
        claim_type: Computed read
        grounds:
          - entities.DonorProfile.fields.adverse_event_count
          - entities.DonorProfile.fields.last_followup_at
          - endpoints.POST_registry_donors_id_follow_ups
          - endpoints.GET_registry_donors_id
        distinguishing_aspect: |
          Three follow-up rows filed at three different logical instants drive two different derived
          reads: adverse_event_count counts ONLY the ADVERSE_EVENT rows (so the contact row must not
          increment it) while last_followup_at is a max over every row regardless of type. The third row
          sits exactly on ADVERSE_EVENT_DEFERRAL_GRADE 4, which flips the donor to PERMANENTLY_DEFERRED
          and marks triggered_permanent_deferral - the grade-3 row must not.
        test_recipe:
          setup:
            - "one domestic registry and one donor D1, no candidates at all (the donor is followed up outside any search)"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id", d1_ae_0: "$.data.adverse_event_count", d1_last_0: "$.data.last_followup_at" }
          trigger:
            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "DAY_7_CONTACT", severity_grade: 0, description: "Routine day-7 telephone contact; no complaints." }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { fu1_reported: "$.data.reported_at", fu1_flag: "$.data.triggered_permanent_deferral" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_ae_1: "$.data.adverse_event_count", d1_last_1: "$.data.last_followup_at", d1_avail_1: "$.data.availability_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:30:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "ADVERSE_EVENT", severity_grade: 3, description: "Grade 3 bone pain after mobilisation; resolved with analgesia." }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { fu2_reported: "$.data.reported_at", fu2_flag: "$.data.triggered_permanent_deferral" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_ae_2: "$.data.adverse_event_count", d1_last_2: "$.data.last_followup_at", d1_avail_2: "$.data.availability_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/donors/${d1_id}/follow-ups"
              payload: { event_type: "ADVERSE_EVENT", severity_grade: 4, description: "Grade 4 splenic haematoma; donor permanently withdrawn from the registry." }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { fu3_reported: "$.data.reported_at", fu3_flag: "$.data.triggered_permanent_deferral" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_ae_3: "$.data.adverse_event_count", d1_last_3: "$.data.last_followup_at", d1_avail_3: "$.data.availability_status" }
            - call: "GET /registry/donors/${d1_id}/follow-ups"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { fu_total: "$.meta.total_count", fu_first_type: "$.data[0].event_type", fu_last_type: "$.data[2].event_type" }
          assert:
            - "the donor is created with adverse_event_count 0 and last_followup_at null"
            - "after the DAY_7_CONTACT row: adverse_event_count is STILL 0 (contacts are not adverse events) but last_followup_at becomes \"2026-08-01T00:00:00Z\", and availability_status is still \"AVAILABLE\""
            - "after the grade-3 ADVERSE_EVENT row: adverse_event_count is 1, last_followup_at is \"2026-08-15T09:30:00Z\", triggered_permanent_deferral is false and the donor is STILL \"AVAILABLE\" - grade 3 is below ADVERSE_EVENT_DEFERRAL_GRADE 4"
            - "after the grade-4 ADVERSE_EVENT row: adverse_event_count is 2, last_followup_at is \"2026-09-01T12:00:00Z\", triggered_permanent_deferral is true and availability_status is \"PERMANENTLY_DEFERRED\" - the boundary is inclusive at 4"
            - "the follow-up list holds all three rows in created_at ASC order (DAY_7_CONTACT first, the grade-4 ADVERSE_EVENT last); none of the derived reads is settable from the request body"

      - name: a_typing_request_is_allowed_only_while_the_partner_cooperates
        claim_type: Conditional action
        grounds:
          - endpoints.POST_registry_match_candidates_id_typing_requests
          - validations[priority=40]
        excluded_because:
          difficulty_instance: typing_request_depends_on_donor_registry_cooperation_state
          rationale: |
            §1.8 already runs the action under both conditions on the same candidate: refused with
            ERR_REGISTRY_NOT_COOPERATING while the donor's registry is SUSPENDED, accepted once the
            registry is patched back to ACTIVE, with already-open requests left untouched.

  - section: errors
    instances:
      - name: pagination_uniqueness_and_grade_errors_are_all_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - errors[ERR_UNAVAILABILITY_WINDOW_NOT_FOUND]
          - errors[ERR_ADVERSE_EVENT_GRADE_INVALID]
          - errors[ERR_REGISTRY_CODE_ALREADY_EXISTS]
          - errors[ERR_DONOR_CODE_ALREADY_EXISTS]
          - errors[ERR_MRN_ALREADY_EXISTS]
        distinguishing_aspect: |
          Six catalog entries that no other instance reaches, batched on one two-registry fixture. Each is
          paired with the neighbouring value that must SUCCEED: limit 100 is legal while 101 is not,
          donor_code "D-0001" is legal in a second registry while it collides in the first, and
          severity_grade 0 is legal for a contact row while it is invalid for an ADVERSE_EVENT row.
