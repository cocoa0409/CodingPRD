scaffold_corner_design:
  # =========================================================================
  # Section: entities — required fields, defaults, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_required_fields_and_defaults
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with only legal_name succeeds and applies defaults (credit_hold=false, status=ACTIVE, version=1)"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Default Corp" }
              as: QualityManager
              captures: { cust: $.data.id }
          trigger:
            - call: "GET /toll-operations/customers/${cust}"
              as: Any
              captures: { ch: $.data.credit_hold, st: $.data.status, v: $.data.version }
          assert:
            - "Customer.${cust}.credit_hold == false"
            - "Customer.${cust}.status == ACTIVE"
            - "Customer.${cust}.version == 1"

      - name: create_customer_missing_legal_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Customer.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required legal_name yields ERR_INVALID_REQUEST 400"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /toll-operations/customers"
              payload: { credit_hold: false }
              as: QualityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "POST returns error_id == ERR_INVALID_REQUEST and HTTP 400"

      - name: raw_material_lot_computed_quantities_initialized
        claim_type: computed_fields
        grounds: [entities.RawMaterialLot.fields.quantity_kg_on_hand, entities.RawMaterialLot.fields.quantity_kg_committed, entities.RawMaterialLot.fields.quantity_kg_available]
        distinguishing_aspect: "On lot create, on_hand = received, committed = 0, available = received"
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Init Corp" }
              as: QualityManager
              captures: { c: $.data.id }
          trigger:
            - call: "POST /toll-operations/customers/${c}/raw-material-lots"
              payload: { material_code: "X", ghS_class: "NON_HAZ", quantity_kg_received: 250.5, storage_zone: "Z_GENERAL", received_at: "2026-08-01T00:00:00Z" }
              as: BatchScheduler
              captures: { lot: $.data.id, on_hand: $.data.quantity_kg_on_hand, committed: $.data.quantity_kg_committed, avail: $.data.quantity_kg_available }
          assert:
            - "RawMaterialLot.${lot}.quantity_kg_on_hand == 250.5"
            - "RawMaterialLot.${lot}.quantity_kg_committed == 0"
            - "RawMaterialLot.${lot}.quantity_kg_available == 250.5"

      - name: lot_with_invalid_storage_zone_for_ghs_returns_incompatible_segregation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INCOMPATIBLE_SEGREGATION]"]
        distinguishing_aspect: "FLAMMABLE lot into Z_ACID zone is rejected by segregation matrix"
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "ZoneTest Inc" }
              as: QualityManager
              captures: { c: $.data.id }
          trigger:
            - call: "POST /toll-operations/customers/${c}/raw-material-lots"
              payload: { material_code: "GAS", ghS_class: "FLAMMABLE", quantity_kg_received: 100, storage_zone: "Z_ACID", received_at: "2026-08-01T00:00:00Z" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INCOMPATIBLE_SEGREGATION (FLAMMABLE not in ZONE_ALLOWED[Z_ACID])"

      - name: get_nonexistent_customer_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{random-uuid} -> 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /toll-operations/customers/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP 404"

  # =========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # =========================================================================
  - section: state_machines
    instances:
      - name: recipe_approve_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Recipe.DRAFT_to_APPROVED]
        distinguishing_aspect: "Double-approve is rejected"
        test_recipe:
          setup: ["APPROVED recipe exists"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "R-Corp" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "R1", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "A", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: recipe_fraction_sum_invalid_rejected_at_create
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_RECIPE_FRACTION_SUM_INVALID]"]
        distinguishing_aspect: "Components summing to 99.999 are rejected at approve-time"
        test_recipe:
          setup: ["Customer exists; recipe created with sum != 100"]
          setup_api_calls:
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Bad Recipe Inc" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Bad", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "A", mass_fraction_pct: 99.999, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
          trigger:
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECIPE_FRACTION_SUM_INVALID"

      - name: batch_create_with_draft_recipe_returns_recipe_not_approved
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_RECIPE_NOT_APPROVED]"]
        distinguishing_aspect: "Recipe still in DRAFT cannot be referenced by a new BatchJob"
        test_recipe:
          setup: ["Customer, DRAFT recipe, ACTIVE agreement, CLEAN_VALIDATED tank"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Draft Recipe Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "DraftR", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "A", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa}/activate"
              payload: { expected_pricing_agreement_version: "${pa_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-D1", capacity_l: 100, working_capacity_l: 100, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
          trigger:
            - call: "POST /toll-operations/customers/${c}/batch-jobs"
              payload: { recipe_id: "${r}", pricing_agreement_id: "${pa}", tank_id: "${t}", batch_size_l: 50, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECIPE_NOT_APPROVED"

      - name: batch_capacity_exceeded_returns_err
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_BATCH_SIZE_EXCEEDS_CAPACITY]"]
        distinguishing_aspect: "batch_size_l > Tank.working_capacity_l rejected at release"
        test_recipe:
          setup: ["Standard setup; batch_size_l=600 vs tank working=500"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Oversize Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/customers/${c}/raw-material-lots"
              payload: { material_code: "X", ghS_class: "NON_HAZ", quantity_kg_received: 2000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
            - call: "POST /toll-operations/recipes"
              payload: { name: "R", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "X", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa}/activate"
              payload: { expected_pricing_agreement_version: "${pa_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-SM", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c}/batch-jobs"
              payload: { recipe_id: "${r}", pricing_agreement_id: "${pa}", tank_id: "${t}", batch_size_l: 600, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { bj: $.data.id, bj_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/release"
              payload: { expected_batch_job_version: "${bj_v}" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_BATCH_SIZE_EXCEEDS_CAPACITY"

      - name: batch_release_with_dirty_tank_returns_tank_not_clean
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_TANK_NOT_CLEAN_VALIDATED]"]
        distinguishing_aspect: "Tank not yet cleaned (DIRTY) blocks batch release"
        test_recipe:
          setup: ["Standard setup but tank cleaning never validated"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Dirty Tank Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "R", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "X", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa}/activate"
              payload: { expected_pricing_agreement_version: "${pa_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-DIRTY", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
            - call: "POST /toll-operations/customers/${c}/batch-jobs"
              payload: { recipe_id: "${r}", pricing_agreement_id: "${pa}", tank_id: "${t}", batch_size_l: 100, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { bj: $.data.id, bj_v: $.data.version }
          trigger:
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/release"
              payload: { expected_batch_job_version: "${bj_v}" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_TANK_NOT_CLEAN_VALIDATED"

      - name: cleaning_validator_same_as_creator_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Same X-User-ID cannot create AND validate a cleaning record"
        test_recipe:
          setup: ["CleaningRecord created by user op-1; same user tries to validate"]
          setup_api_calls:
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-SOD", capacity_l: 100, working_capacity_l: 100, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              as_user_id: "user-op-1"
              captures: { cr: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/submit"
              payload: {}
              as: TankOperator
              as_user_id: "user-op-1"
          trigger:
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
              as_user_id: "user-op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: cancel_from_charging_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BatchJob]
        distinguishing_aspect: "Cancel is only valid from INTAKE or RELEASED; CHARGING is terminal-bound"
        test_recipe:
          setup: ["BJ driven to CHARGING"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "ChargeCancel Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/customers/${c}/raw-material-lots"
              payload: { material_code: "X", ghS_class: "NON_HAZ", quantity_kg_received: 500, storage_zone: "Z_GENERAL", received_at: "2026-08-01T08:00:00Z" }
              as: BatchScheduler
              captures: { l: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "R", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "X", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa}/activate"
              payload: { expected_pricing_agreement_version: "${pa_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-CC", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr: $.data.id }
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t}/cleaning-records/${cr}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c}/batch-jobs"
              payload: { recipe_id: "${r}", pricing_agreement_id: "${pa}", tank_id: "${t}", batch_size_l: 100, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { bj: $.data.id, bj_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/release"
              payload: { expected_batch_job_version: "${bj_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/batch-charges"
              payload: { raw_material_lot_id: "${l}", charge_order: 1, charged_qty_kg: 100 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/start-charging"
              payload: {}
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c}/batch-jobs/${bj}/cancel"
              payload: {}
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (cannot cancel from CHARGING)"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: theoretical_output_kg_correct_value
        claim_type: correct_result
        grounds: [calculations.theoretical_output_kg]
        distinguishing_aspect: "theoretical_output_kg = batch_size_l * density * (yield_pct/100), 3 dp"
        test_recipe:
          setup: ["Customer, recipe density=1.5 yield=80, batch_size_l=200"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Calc Co" }
              as: QualityManager
              captures: { c: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "R", revision: 1, customer_id: "${c}", target_density_kg_per_l: 1.5, theoretical_yield_pct: 80, components: [{ material_code: "A", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r: $.data.id }
            - call: "POST /toll-operations/recipes/${r}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /toll-operations/customers/${c}/pricing-agreements/${pa}/activate"
              payload: { expected_pricing_agreement_version: "${pa_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-C", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /toll-operations/customers/${c}/batch-jobs"
              payload: { recipe_id: "${r}", pricing_agreement_id: "${pa}", tank_id: "${t}", batch_size_l: 200, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { theo: $.data.theoretical_output_kg }
          assert:
            - "BatchJob theoretical_output_kg == 240.000 (200 * 1.5 * 0.80)"

      - name: highest_component_ghs_uses_severity_order
        claim_type: correct_result
        grounds: [calculations.highest_component_ghs]
