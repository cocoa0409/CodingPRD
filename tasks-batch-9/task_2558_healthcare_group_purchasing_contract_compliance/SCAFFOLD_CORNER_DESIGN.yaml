# =============================================================================
# §1.9 Scaffold Corner Design — Healthcare Group Purchasing & Contract Compliance
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values come
# verbatim from skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# `excluded_because:` stubs naming the covering instance.
#
# Shared fixture vocabulary (identical to §1.8 so the two files compose):
#   logical clock default            2026-08-01T00:00:00Z
#   short ladder  TIER_0 (0 units, 0.00 pct, 0 bps) · TIER_1 (2000, 80.00, 800 bps)
#   full ladder   adds TIER_2 (5000, 90.00, 1500 bps)
#   holdback      [{0 -> 0 bps}, {100000 -> 250 bps}]
#   item V-1      base 10000 / floor 8200 · item V-2 base 5000 / floor 4000
# =============================================================================

scaffold_corner_design:

  # ═══════════════════════════════════════════════════════════════════════════
  - section: entities
    instances:
      - name: contract_creation_derives_default_tier_and_zero_counters
        claim_type: creation
        grounds:
          - entities.Contract.fields.default_tier_code
          - entities.Contract.fields.status
          - endpoints[POST /gpo/contracts]
        distinguishing_aspect: "A 201 create returns the whole Contract: status DRAFT, default_tier_code TIER_0 derived from the single 0-units/0.00-pct ladder entry, evidence_endorsed false, active_commitment_count 0, and the submitted tiers[]/holdback_tiers[] echoed back."
        test_recipe:
          setup: ["Empty database; the logical clock is at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
          trigger:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-CRE-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id, dtc: $.data.default_tier_code }
          assert:
            - "HTTP 201 and the response envelope carries response_type object with data.id set"
            - "${dtc} == TIER_0 — derived, not supplied"
            - "Contract.${c1}.status == DRAFT, evidence_endorsed == false, active_commitment_count == 0"
            - "Contract.${c1}.tiers has 2 entries and holdback_tiers has 1 entry, echoed exactly as submitted"
            - "Contract.${c1}.version == 1 and created_at/updated_at are present ISO-8601 strings"

      - name: member_retrieval_returns_stored_item_master_and_zero_ledgers
        claim_type: retrieval
        grounds:
          - entities.Member.fields.item_master
          - entities.Member.fields.fee_credit_balance_cents
          - endpoints[GET /gpo/members/{member_id}]
        distinguishing_aspect: "GET /gpo/members/{member_id} returns the two item_master entries exactly as stored, status ACTIVE, watchlist_status NONE and fee_credit_balance_cents 0 — the read is a faithful projection, not a recomputation."
        test_recipe:
          setup: ["One member registered with a two-entry item master."]
          setup_api_calls:
            - call: "POST /gpo/members"
              payload: { member_code: "M-RET", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 }, { member_item_number: "MI-2", description: "Mesh graft", units_per_uom: 5 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /gpo/members/${m1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { st: $.data.status, wl: $.data.watchlist_status, bal: $.data.fee_credit_balance_cents }
          assert:
            - "HTTP 200 and ${st} == ACTIVE, ${wl} == NONE, ${bal} == 0"
            - "Member.${m1}.item_master has exactly 2 entries whose member_item_number values are MI-1 and MI-2 with units_per_uom 1 and 5"
            - "Member.${m1}.member_code == M-RET and aggregation_group_code == AGG-NORTH"

      - name: contract_listing_pages_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /gpo/contracts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three contracts stored, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 / offset 2 returns the remaining 1 row with has_more false. total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Three DRAFT contracts C-PAG-1, C-PAG-2, C-PAG-3, all in category CAT-SUT."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-PAG-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-PAG-2", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-PAG-3", supplier_name: "Beta Devices", category_code: "CAT-MSH", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
          trigger:
            - call: "GET /gpo/contracts"
              payload: { limit: 2, offset: 0 }
              as: FinanceAdministrator
            - call: "GET /gpo/contracts"
              payload: { limit: 2, offset: 2 }
              as: FinanceAdministrator
            - call: "GET /gpo/contracts"
              payload: { category_code: "CAT-SUT", limit: 10, offset: 0 }
              as: FinanceAdministrator
          assert:
            - "the first read returns 2 rows with limit 2, offset 0, total_count 3, has_more true"
            - "the second read returns 1 row with limit 2, offset 2, total_count 3, has_more false"
            - "the filtered read returns 2 rows with total_count 2 and has_more false — total_count reflects the category_code filter, not the whole table"
            - "response_type == array on all three reads"

      - name: commitment_and_review_reads_with_unknown_id_return_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_COMMITMENT_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that matches no row yields that resource's own 404 code — ERR_COMMITMENT_NOT_FOUND for a commitment path, ERR_REVIEW_NOT_FOUND for a review path — never a generic 404 and never ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /gpo/commitments/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /gpo/clinical-evidence-reviews/00000000-0000-0000-0000-0000000000bb"
              payload: {}
              as: ClinicalReviewer
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_COMMITMENT_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_REVIEW_NOT_FOUND with HTTP 404"
            - "both responses use response_type error with a non-empty data.message"

      - name: contract_create_missing_admin_fee_bps_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /gpo/contracts]
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "admin_fee_bps carries no default in §1.1, so omitting it is ERR_INVALID_REQUEST (400) and no Contract row is created — distinct from omitting requires_clinical_review, which is defaulted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-MISS", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", member_share_bps: 6000, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { e1: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /gpo/contracts?limit=10&offset=0 returns 0 rows and total_count 0"

      - name: contract_create_applies_declared_defaults_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.Contract.fields.requires_clinical_review
          - entities.Contract.fields.share_basis
          - entities.Contract.fields.leakage_alert_threshold_pct
        distinguishing_aspect: "Omitting the three optional inputs applies exactly the §1.1 defaults — requires_clinical_review true, share_basis COLLECTED, leakage_alert_threshold_pct 15.00 — and requires_clinical_review true is load-bearing: the contract cannot then be activated without an endorsed review."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-DEF", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id, rcr: $.data.requires_clinical_review, sb: $.data.share_basis, lat: $.data.leakage_alert_threshold_pct }
          assert:
            - "${rcr} == true, ${sb} == COLLECTED, ${lat} == 15.00"
            - "Contract.${c1}.status == DRAFT and evidence_endorsed == false"

      - name: purchase_line_extended_cost_computed_at_file_receipt
        claim_type: computed_fields
        grounds:
          - entities.PurchaseLine.fields.extended_cost_cents
          - entities.PurchaseLine.fields.classification
          - endpoints[POST /gpo/distributor-files]
        distinguishing_aspect: "extended_cost_cents is written at RECEIVED time as quantity_units * unit_price_paid_cents (3 * 1250 == 3750 and 10 * 900 == 9000), while classification stays UNCLASSIFIED and contract_units stays 0 until the load cascade runs — the two computed families are written by different hops."
        test_recipe:
          setup: ["ACTIVE contract C-ECC and ACTIVE member M-ECC; a distributor file received but not yet validated."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-ECC", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-ECC", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 3, unit_price_paid_cents: 1250, purchase_date: "2026-08-05" }, { member_item_number: "MI-1", quantity_units: 10, unit_price_paid_cents: 900, purchase_date: "2026-08-06" } ] }
              as: DistributorAgent
              captures: { f1: $.data.id, lc: $.data.line_count }
          assert:
            - "${lc} == 2 and DistributorFile.${f1}.status == RECEIVED with accepted_line_count 0 and rejected_line_count 0"
            - "GET /gpo/purchase-lines?distributor_file_id=${f1} returns 2 rows with extended_cost_cents 3750 and 9000"
            - "every returned line has classification UNCLASSIFIED, contract_units 0, matched_vendor_item_number null and reject_reason NONE"

      - name: contract_create_extra_status_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Contract.fields.status
          - entities.Contract.fields.evidence_endorsed
          - entities.Contract.fields.active_commitment_count
        distinguishing_aspect: "status, evidence_endorsed, active_commitment_count and id are `source: system`/`computed`; a client that supplies status ACTIVE, evidence_endorsed true and active_commitment_count 7 still gets DRAFT / false / 0 — the server never trusts them."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SYS", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ], status: "ACTIVE", evidence_endorsed: true, active_commitment_count: 7 }
              as: ContractManager
              captures: { c1: $.data.id }
          assert:
            - "Contract.${c1}.status == DRAFT — the supplied ACTIVE is ignored, not honoured and not rejected"
            - "Contract.${c1}.evidence_endorsed == false and active_commitment_count == 0"
            - "Contract.${c1}.id is a server-generated identifier and version == 1"

      - name: contract_item_unknown_uom_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ContractItem.fields.uom
          - entities.ContractItem.fields.floor_price_cents
          - validations[priority=6]
        distinguishing_aspect: "uom is constrained to {EA, BX, CS} and floor_price_cents to <= base_price_cents; a uom of PK and a floor above base are both ERR_INVALID_REQUEST (400) at priority 6, before any business rule runs."
        test_recipe:
          setup: ["One DRAFT contract C-TYP."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-TYP", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "PK", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200 }
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-2", item_description: "Mesh graft", uom: "EA", units_per_uom: 1, base_price_cents: 5000, floor_price_cents: 6000 }
              as: ContractManager
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /gpo/contract-items?contract_id=${c1} returns 0 rows"

      - name: purchase_line_is_immutable_with_no_write_endpoint_or_version
        claim_type: immutability
        grounds:
          - entities.PurchaseLine[common_fields=false]
          - endpoints[GET /gpo/purchase-lines/{purchase_line_id}]
          - endpoints[GET /gpo/purchase-lines]
        distinguishing_aspect: "PurchaseLine is declared `common_fields: false`: §1.5 exposes only two GETs for it and no POST/PATCH/DELETE, and the read carries no version or updated_at field. Its classification changes only as a side effect of the file's load and reverse transitions."
        test_recipe:
          setup: ["A RECEIVED distributor file with one line on an ACTIVE contract and ACTIVE member."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-IMM", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-IMM", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 4, unit_price_paid_cents: 1000, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
              captures: { f1: $.data.id }
          trigger:
            - call: "GET /gpo/purchase-lines"
              payload: { distributor_file_id: "${f1}" }
              as: ComplianceAnalyst
              captures: { p1: "$.data[0].id" }
            - call: "GET /gpo/purchase-lines/${p1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { ext: $.data.extended_cost_cents }
          assert:
            - "${ext} == 4000 and the payload carries distributor_file_id == ${f1}"
            - "the PurchaseLine read carries no `version` and no `updated_at` field, matching common_fields: false"
            - "§1.5 declares no POST, PATCH or DELETE whose path resolves to /gpo/purchase-lines/{purchase_line_id}: the only writes are the file's own transitions"

      - name: contract_item_create_under_unknown_parent_contract_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ContractItem.fields.contract_id
          - validations[priority=4]
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: "The nested create route resolves its path parent first: an unknown {contract_id} is ERR_CONTRACT_NOT_FOUND (404) at priority 4, before the body is even shape-checked, so a body that is also invalid still reports the missing parent."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /gpo/contracts/00000000-0000-0000-0000-0000000000cc/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200 }
              as: ContractManager
              captures: { e1: $.data.error_id }
          assert:
            - "${e1} == ERR_CONTRACT_NOT_FOUND with HTTP 404"

      - name: flat_topology_xref_body_foreign_keys_validated_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology=flat
          - entities.ItemCrossReference.fields.contract_item_id
          - validations[priority=5]
        distinguishing_aspect: "The topology is flat: ItemCrossReference names both of its peers in the body, and each body FK is resolved in declaration order — member_id first (ERR_MEMBER_NOT_FOUND), then contract_item_id (ERR_CONTRACT_ITEM_NOT_FOUND) — so a request with both unknown reports the member."
        test_recipe:
          setup: ["One ACTIVE member M-FK with item_master entry MI-1; no contract item exists."]
          setup_api_calls:
            - call: "POST /gpo/members"
              payload: { member_code: "M-FK", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "00000000-0000-0000-0000-0000000000dd", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "00000000-0000-0000-0000-0000000000ee", contract_item_id: "00000000-0000-0000-0000-0000000000dd", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "00000000-0000-0000-0000-0000000000ee"
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_CONTRACT_ITEM_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_MEMBER_NOT_FOUND with HTTP 404 — member_id is resolved before contract_item_id"

      - name: fk_reverse_reachability_reads_find_children_from_each_parent
        claim_type: listing
        grounds:
          - endpoints[GET /gpo/contract-items]
          - endpoints[GET /gpo/commitments]
          - endpoints[GET /gpo/item-cross-references]
          - endpoints[GET /gpo/purchase-lines]
        distinguishing_aspect: "Every FK in §1.1 is reverse-reachable through a filtered top-level list, which is the whole discovery surface of a flat topology: /gpo/contract-items finds ContractItem from contract_id, /gpo/commitments finds Commitment from member_id and from contract_id, /gpo/item-cross-references finds ItemCrossReference from member_id and contract_item_id, and /gpo/purchase-lines finds PurchaseLine from distributor_file_id — the last one matters most, because a purchase line is created only as a side effect of the file receipt and appears in no creation response."
        test_recipe:
          setup: ["ACTIVE contract C-FKR with item V-1; member M-FKR with MI-1; an ELECTED commitment; a PROPOSED cross-reference; a RECEIVED file with one line."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-FKR", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
