scenario: |
  Generate task harder than expert level!

  2522. Airline Ancillary Merchandising & Fare Family Design (airline retailing team): fare family construction with bundled attributes across baggage, seat selection, changes and boarding priority, seat map inventory segmentation with pricing by row, cabin zone and demand, dynamic ancillary pricing with willingness-to-pay models and offer sequencing, bundling and upsell offers at booking, check-in and in-flight touchpoints, distribution of ancillaries through indirect channels with content parity, refundability and change rules by product with waivers during irregular operations, revenue accounting for ancillary categories and tax treatment, regulatory disclosure of fees at the point of sale
domain_name: airline-ancillary-merchandising
api_prefix: ""   # graph topology: no single root collection; every entity is a flat top-level collection

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # 12 peer entities linked by FKs plus two junction entities (FamilyAttribute,
  # ChannelPublication) and one self-referential edge (FareFamily.upsell_parent_family_id).

  state_machine_shape: parallel
  # Flight carries two independent dimensions (sales_phase x irops_state); Booking
  # carries two (booking_status x disclosure_state) and booking_status is cyclic
  # (TICKETED -> CHANGE_PENDING -> TICKETED); FareFamily is cyclic
  # (IN_REVIEW -> DRAFT -> IN_REVIEW, PUBLISHED <-> SUSPENDED); AncillaryOffer is
  # branching (PRESENTED -> {ACCEPTED, DECLINED, EXPIRED, SUPERSEDED}) with a
  # divergent side-effect set per branch; ChannelPublication is cyclic
  # (IN_PARITY <-> OUT_OF_PARITY).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The MerchandisingAnalyst that authored a FareFamily may not be the
  # PricingApprover that decides its review (X-User-ID comparison).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 58 endpoints / 60 error codes / 7 calculations (2 dual-variant on
  # different subjects, 3 combinatorial modes) / 10 state-machine dimensions.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  CABIN_UPLIFT_BP: { ECONOMY: 0, PREMIUM: 1500, BUSINESS: 3000 }
  ZONE_MULTIPLIER_BP: { FWD: 13000, MID: 10000, AFT: 9000, EXIT_ROW: 16000, BULKHEAD: 14000 }
  ROW_BAND_ADJUST_CENTS: { rows_1_to_5: 1500, rows_6_to_15: 500, rows_16_plus: 0 }
  DEMAND_TIER_MULTIPLIER_BP: { LOW: 10000, MID: 11000, HIGH: 12500 }
  DEMAND_TIER_THRESHOLD_PCT: { HIGH_AT_OR_ABOVE: 80, MID_AT_OR_ABOVE: 60 }
  BASE_WTP_BP: 10000
  WTP_LF_SLOPE_BP: 40
  WTP_SCARCITY_SLOPE_BP: 60
  WTP_MIN_BP: 6000
  WTP_MAX_BP: 16000
  TOUCHPOINT_MULTIPLIER_BP: { BOOKING: 10000, CHECKIN: 11000, INFLIGHT: 12500 }
  PRICE_FLOOR_BP: 7000
  PRICE_CAP_BP: 18000
  MAX_OFFERS_PER_SESSION: 3
  OFFER_TTL_MINUTES: 60
  OFFER_COOLOFF_MINUTES: 30
  CATEGORY_PRIORITY_ORDER: [BAGGAGE, SEAT, CHANGE, BOARDING, ONBOARD, AIR_TRANSPORT]
  TAX_RATE_BP: { TAXABLE_TRANSPORT: 750, TAXABLE_SERVICE: 400, EXEMPT: 0 }
  INCENTIVE_TIER_BP: { at_or_above_50000: 300, at_or_above_30000: 150, below_30000: 0 }
  IROPS_CHANGE_WAIVER_MIN_DELAY_MINUTES: 180

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: AncillaryProduct
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: sku
        type: string
        source: input
        description: "Merchandising SKU; unique across the catalog"
        constraints: "3-32 chars, uppercase A-Z, digits and underscore only"
      - name: name
        type: string
        source: input
        description: "Display name shown at the point of sale"
      - name: category
        type: enum
        source: input
        description: "Ancillary category driving bundling, offer sequencing and revenue accounting"
        constraints: "BAGGAGE | SEAT | CHANGE | BOARDING | ONBOARD"
      - name: list_price_cents
        type: integer
        source: input
        description: "A-la-carte list price in cents; the base of every dynamic-price computation"
        constraints: ">= 0"
      - name: tax_treatment
        type: enum
        source: input
        description: "Tax bucket applied by the revenue split calculation"
        constraints: "TAXABLE_TRANSPORT | TAXABLE_SERVICE | EXEMPT"
      - name: revenue_class
        type: enum
        source: input
        description: "Reporting class for ancillary revenue disclosure"
        constraints: "AIR_TRANSPORT_RELATED | NON_AIR"
      - name: revenue_account_code
        type: string
        source: input
        description: "General-ledger account code stamped onto every RevenueEntry for this product"
      - name: refundable
        type: boolean
        source: input
        description: "When false, a booking cancellation does NOT reverse this product's SALE entries"
        default: false
      - name: disclosable_fee
        type: boolean
        source: input
        description: "When true, a chargeable fee for this product must appear in the point-of-sale fee disclosure"
        default: true
      - name: product_state
        type: enum
        source: input
        description: "WITHDRAWN products are excluded from offer eligibility but remain referenced by history"
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN"

  - name: FareFamily
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: code
        type: string
        source: input
        description: "Fare family code; unique"
        constraints: "3-24 chars, uppercase A-Z, digits and underscore only"
      - name: name
        type: string
        source: input
        description: "Marketing name of the fare family"
      - name: cabin_class
        type: enum
        source: input
        description: "Cabin the family sells in; selects CABIN_UPLIFT_BP in the bundle valuation"
        constraints: "ECONOMY | PREMIUM | BUSINESS"
      - name: base_fare_cents
        type: integer
        source: input
        description: "Air-transport component of the family, excluding bundled ancillaries"
        constraints: "> 0"
      - name: bundle_price_cents
        type: integer
        source: input
        description: "All-in sell price of the family; allocated across categories at ticketing"
        constraints: "> 0"
      - name: refundability
        type: enum
        source: input
        description: "Refund rule of the fare component; gates ALLOCATION reversal on cancellation"
        constraints: "NON_REFUNDABLE | REFUNDABLE_WITH_FEE | FULLY_REFUNDABLE"
      - name: change_fee_cents
        type: integer
        source: input
        description: "Change fee charged when a change is confirmed, before IROPS waivers"
        constraints: ">= 0"
      - name: boarding_priority_tier
        type: integer
        source: input
        description: "1 is boarded first; a bundled attribute of the family"
        constraints: "1..4"
      - name: upsell_parent_family_id
        type: string
        source: input
        description: "FK -> FareFamily.id; the family this one upsells from; null for the entry-level rung. The parent chain must be acyclic"
        default: null
      - name: design_owner_user_id
        type: string
        source: system
        description: "X-User-ID of the MerchandisingAnalyst that created the family; input to the segregation-of-duties check"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the PricingApprover that recorded the last review decision; null before the first decision"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the family"
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | PUBLISHED | SUSPENDED | RETIRED"
      - name: revision_no
        type: integer
        source: system
        description: "Increments by 1 on every IN_REVIEW -> DRAFT rejection; part of fee_fingerprint"
        default: 1
      - name: unbundled_value_cents
        type: integer
        source: computed
        description: "Sum of per-attribute extended values under the override_basis variant of fare_family_bundle_valuation"
        default: 0
      - name: a_la_carte_total_cents
        type: integer
        source: computed
        description: "base_fare_cents + unbundled_value_cents"
        default: 0
      - name: bundle_discount_bp
        type: integer
        source: computed
        description: "Basis points saved by buying the bundle instead of the a-la-carte total; 0 when unbundled_value_cents == 0"
        default: 0
      - name: included_attribute_count
        type: integer
        source: computed
        description: "Count of FamilyAttribute rows with attribute_state == ACTIVE and inclusion == INCLUDED"
        default: 0
      - name: fee_fingerprint
        type: string
        source: computed
        description: "Deterministic content fingerprint driving content parity and fee disclosure staleness; see calculations.fare_family_fee_fingerprint"
      - name: publication_count
        type: integer
        source: computed
        description: "Count of ChannelPublication rows for this family with parity_state IN {PENDING, IN_PARITY, OUT_OF_PARITY}"
        default: 0

  - name: FamilyAttribute
    parent: FareFamily
    common_fields: true
    entity_kind: resource
    fields:
      - name: fare_family_id
        type: string
        source: input
        description: "FK -> FareFamily.id"
      - name: ancillary_product_id
        type: string
        source: input
        description: "FK -> AncillaryProduct.id"
      - name: inclusion
        type: enum
        source: input
        description: "INCLUDED attributes are bundled into bundle_price_cents; CHARGEABLE attributes are sold separately and must be fee-disclosed"
        constraints: "INCLUDED | CHARGEABLE"
      - name: included_quantity
        type: integer
        source: input
        description: "Bundled units; must be >= 1 when inclusion == INCLUDED and exactly 0 when inclusion == CHARGEABLE"
        constraints: "0..9"
      - name: override_price_cents
        type: integer
        source: input
        description: "Replaces AncillaryProduct.list_price_cents in the override_basis valuation only; null means use the list price"
        default: null
        constraints: ">= 0 when present"
      - name: waiver_eligible
        type: boolean
        source: input
        description: "When true, this attribute's category may be waived by an IROPS waiver"
        default: false
      - name: effective_unit_cents
        type: integer
        source: computed
        description: "override_price_cents when not null, else the referenced AncillaryProduct.list_price_cents"
      - name: attr_value_cents
        type: integer
        source: computed
        description: "Per-attribute extended value under override_basis: round_half_up(effective_unit_cents * included_quantity * (10000 + CABIN_UPLIFT_BP) / 10000)"
        default: 0
      - name: attribute_state
        type: enum
        source: input
        description: "WITHDRAWN attributes leave the valuation, the fingerprint and the allocation weights"
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN"

  - name: Flight
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: flight_no
        type: string
        source: input
        description: "Marketing flight number"
      - name: origin
        type: string
        source: input
        description: "Departure airport code"
        constraints: "exactly 3 uppercase letters"
      - name: destination
        type: string
        source: input
        description: "Arrival airport code"
        constraints: "exactly 3 uppercase letters, different from origin"
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: "Scheduled departure instant, ISO 8601 UTC"
      - name: cabin_seat_total
        type: integer
        source: input
        description: "Physical seat count of the cabin; upper bound for the sum of seat-segment total_seats"
        constraints: "> 0"
      - name: sales_phase
        type: enum
        source: system
        description: "Retailing phase dimension; advances one step at a time and gates offer touchpoints"
        default: PRESALE
        constraints: "PRESALE | CHECKIN_OPEN | BOARDING | DEPARTED"
      - name: irops_state
        type: enum
        source: system
        description: "Irregular-operations dimension, independent of sales_phase"
        default: NORMAL
        constraints: "NORMAL | IRREGULAR | RECOVERED"
      - name: booked_load_factor_pct
        type: integer
        source: system
        description: "Revenue-management load factor feed; set only by POST /flights/{flight_id}/demand-snapshot"
        default: 0
        constraints: "0..100"
      - name: demand_index_bp
        type: integer
        source: system
        description: "Revenue-management demand index in basis points; set only by POST /flights/{flight_id}/demand-snapshot"
        default: 0
        constraints: "-5000..5000"
      - name: demand_tier
        type: enum
        source: computed
        description: "HIGH when booked_load_factor_pct >= 80, MID when >= 60, else LOW"
        default: LOW
        constraints: "LOW | MID | HIGH"
      - name: active_waiver_count
        type: integer
        source: computed
        description: "Count of IropsWaiver rows for this flight with waiver_state == ACTIVE"
        default: 0
      - name: ticketed_booking_count
        type: integer
        source: computed
        description: "Count of Booking rows for this flight with booking_status IN {TICKETED, CHANGE_PENDING}"
        default: 0

  - name: SeatInventorySegment
    parent: Flight
    common_fields: true
    entity_kind: resource
    fields:
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id"
      - name: ancillary_product_id
        type: string
        source: input
        description: "FK -> AncillaryProduct.id; the referenced product must have category == SEAT"
      - name: zone
        type: enum
        source: input
        description: "Cabin zone of the segment; selects ZONE_MULTIPLIER_BP"
        constraints: "FWD | MID | AFT | EXIT_ROW | BULKHEAD"
      - name: row_start
        type: integer
        source: input
        description: "First row of the segment; also selects ROW_BAND_ADJUST_CENTS"
        constraints: ">= 1"
      - name: row_end
        type: integer
        source: input
        description: "Last row of the segment; the row interval is CLOSED [row_start, row_end]"
        constraints: ">= row_start"
      - name: seat_letters
        type: array
        source: input
        description: "Seat letters occupied by this segment, e.g. [A, B, C]; the segment covers the rectangle rows x letters"
        constraints: "1..6 distinct single uppercase letters A-F"
      - name: base_price_cents
        type: integer
        source: input
        description: "Pre-zone, pre-demand seat price for this segment"
        constraints: ">= 0"
      - name: total_seats
        type: integer
        source: computed
        description: "(row_end - row_start + 1) * length(seat_letters)"
      - name: available_seats
        type: integer
        source: computed
        description: "total_seats - held_seats - sold_seats; conserved by seat_inventory_conservation"
      - name: held_seats
        type: integer
        source: system
        description: "Count of SeatAssignment rows on this segment with assignment_state == HELD"
        default: 0
      - name: sold_seats
        type: integer
        source: system
        description: "Count of SeatAssignment rows on this segment with assignment_state == CONFIRMED"
        default: 0
      - name: zone_multiplier_bp
        type: integer
        source: computed
        description: "ZONE_MULTIPLIER_BP for zone"
      - name: effective_price_cents
        type: integer
        source: computed
        description: "Output of seat_segment_effective_price; recomputed on every demand snapshot of the parent flight"
        default: 0
      - name: segment_state
        type: enum
        source: system
        description: "CLOSED segments accept no new assignments and leave the row-overlap candidate set"
        default: OPEN
        constraints: "OPEN | CLOSED"

  - name: DistributionChannel
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: channel_code
        type: string
        source: input
        description: "Channel code; unique"
      - name: channel_type
        type: enum
        source: input
        description: "Distribution path of the channel"
        constraints: "DIRECT | GDS | OTA | NDC"
      - name: commission_bp
        type: integer
        source: input
        description: "Commission in basis points applied to the settlement subtotal"
        constraints: "0..3000"
      - name: markup_bp
        type: integer
        source: input
        description: "Channel markup in basis points applied inside the dynamic ancillary price"
        constraints: "0..2000"
      - name: max_ancillary_price_cents
        type: integer
        source: input
        description: "Hard ceiling this channel accepts for a single accepted ancillary offer"
        constraints: "> 0"
      - name: supported_categories
        type: array
        source: input
        description: "Ancillary categories this channel can merchandise and fee-disclose"
        constraints: "non-empty subset of {BAGGAGE, SEAT, CHANGE, BOARDING, ONBOARD}"
      - name: parity_required
        type: boolean
        source: input
        description: "When true, a drifted publication breaches the channel; when false the publication drifts alone"
        default: true
      - name: content_parity_status
        type: enum
        source: computed
        description: "BREACHED when parity_required is true and at least one of the channel's publications is OUT_OF_PARITY, else COMPLIANT"
        default: COMPLIANT
        constraints: "COMPLIANT | BREACHED"
      - name: parity_breach_count
        type: integer
        source: system
        description: "Monotonic counter incremented once per publication that transitions IN_PARITY -> OUT_OF_PARITY on this channel"
        default: 0

  - name: ChannelPublication
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: fare_family_id
        type: string
        source: input
        description: "FK -> FareFamily.id"
      - name: distribution_channel_id
        type: string
        source: input
        description: "FK -> DistributionChannel.id"
      - name: published_family_version
        type: integer
        source: system
        description: "FareFamily.version pinned at publication or at the last resync"
      - name: published_fee_fingerprint
        type: string
        source: system
        description: "FareFamily.fee_fingerprint pinned at publication or at the last resync; parity holds while it equals the live fingerprint"
      - name: parity_state
        type: enum
        source: system
        description: "PENDING until the family is PUBLISHED, then IN_PARITY; OUT_OF_PARITY once the live fingerprint drifts"
        default: PENDING
        constraints: "PENDING | IN_PARITY | OUT_OF_PARITY | WITHDRAWN"
      - name: drift_reason
        type: string
        source: system
        description: "Free-text reason stamped when parity_state becomes OUT_OF_PARITY; null otherwise"
        default: null
      - name: last_resync_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last resync; null before the first resync"
        default: null

  - name: Booking
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: record_locator
        type: string
        source: input
        description: "Passenger name record locator supplied by the selling channel; unique"
        constraints: "exactly 6 chars, uppercase A-Z and digits"
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id"
      - name: fare_family_id
        type: string
        source: input
        description: "FK -> FareFamily.id"
      - name: distribution_channel_id
        type: string
        source: input
        description: "FK -> DistributionChannel.id; must equal the acting ChannelPartner X-User-ID"
      - name: passenger_name
        type: string
        source: input
        description: "Passenger full name"
      - name: booking_status
        type: enum
        source: system
        description: "Sales dimension; cyclic between TICKETED and CHANGE_PENDING"
        default: HELD
        constraints: "HELD | TICKETED | CHANGE_PENDING | CANCELLED | FLOWN"
      - name: disclosure_state
        type: enum
        source: system
        description: "Regulatory fee-disclosure dimension, independent of booking_status"
        default: NOT_ISSUED
        constraints: "NOT_ISSUED | PENDING_ACK | ACKNOWLEDGED | STALE"
      - name: disclosed_fee_fingerprint
        type: string
        source: system
        description: "FareFamily.fee_fingerprint pinned when the disclosure was issued; null while NOT_ISSUED"
        default: null
      - name: disclosed_total_fee_cents
        type: integer
        source: system
        description: "Total disclosable fee snapshotted at issuance: sum of effective_unit_cents over ACTIVE CHARGEABLE attributes plus FareFamily.change_fee_cents; null while NOT_ISSUED"
        default: null
      - name: disclosed_unbundled_list_cents
        type: integer
        source: system
        description: "fare_family_bundle_valuation under the list_basis variant, snapshotted at issuance; null while NOT_ISSUED"
        default: null
      - name: disclosure_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last issuance; null while NOT_ISSUED"
        default: null
      - name: disclosure_acked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the acknowledgement; null until acknowledged"
        default: null
      - name: fare_component_cents
        type: integer
        source: system
        description: "FareFamily.bundle_price_cents pinned at ticketing; the allocation base of ancillary_revenue_split"
        default: null
      - name: ancillary_gross_cents
        type: integer
        source: computed
        description: "Signed sum of RevenueEntry.gross_cents for this booking over entry_type IN {SALE, REFUND, WAIVER_CREDIT, WAIVER_REVERSAL}"
        default: 0
      - name: recognized_ancillary_net_cents
        type: integer
        source: computed
        description: "Signed sum of RevenueEntry.net_cents for this booking over rows whose category != AIR_TRANSPORT; conserved by ancillary_net_revenue_conservation"
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: "Step 3 of channel_settlement_total"
        default: 0
      - name: incentive_credit_cents
        type: integer
        source: computed
        description: "Step 6 of channel_settlement_total"
        default: 0
      - name: channel_settlement_total_cents
        type: integer
        source: computed
        description: "Step 7 of channel_settlement_total"
        default: 0
      - name: change_fee_waived_cents
        type: integer
        source: system
        description: "Cumulative change fee waived by ACTIVE IROPS waivers on this booking's flight"
        default: 0
      - name: waiver_applied
        type: boolean
        source: system
        description: "True while an ACTIVE IROPS waiver covers this booking"
        default: false
      - name: pending_change_fee_cents
        type: integer
        source: system
        description: "Change fee quoted when the change was opened: max(0, family.change_fee_cents - change_fee_waived_cents); null outside CHANGE_PENDING"
        default: null
      - name: change_count
        type: integer
        source: system
        description: "Count of confirmed changes on this booking"
        default: 0

  - name: SeatAssignment
    parent: Booking
    common_fields: true
    entity_kind: resource
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: seat_inventory_segment_id
        type: string
        source: input
        description: "FK -> SeatInventorySegment.id"
      - name: row
        type: integer
        source: input
        description: "Assigned row; must satisfy segment.row_start <= row <= segment.row_end"
      - name: seat_letter
        type: string
        source: input
        description: "Assigned seat letter; must be a member of segment.seat_letters"
        constraints: "single uppercase letter A-F"
      - name: price_charged_cents
        type: integer
        source: computed
        description: "SeatInventorySegment.effective_price_cents pinned at the instant the seat was held"
      - name: assignment_state
        type: enum
        source: system
        description: "HELD at creation, CONFIRMED when the booking is ticketed, RELEASED when given back"
        default: HELD
        constraints: "HELD | CONFIRMED | RELEASED"
      - name: released_reason
        type: enum
        source: system
        description: "Why the seat went back to inventory; null while HELD or CONFIRMED"
        default: null
        constraints: "PASSENGER_RELEASE | IROPS_REACCOMMODATION | BOOKING_CANCELLED"

  - name: AncillaryOffer
    parent: Booking
    common_fields: true
    entity_kind: resource
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: ancillary_product_id
        type: string
        source: input
        description: "FK -> AncillaryProduct.id"
      - name: touchpoint
        type: enum
        source: system
        description: "Retailing touchpoint of the session that created the offer; selects TOUCHPOINT_MULTIPLIER_BP"
        constraints: "BOOKING | CHECKIN | INFLIGHT"
      - name: sequence_rank
        type: integer
        source: system
        description: "1-based presentation rank inside the session, assigned by offer_sequencing_selection"
        constraints: "1..3"
      - name: pricing_variant
        type: enum
        source: system
        description: "Which variant of ancillary_offer_dynamic_price produced offered_price_cents"
        constraints: "WTP_ELASTIC | RESIDUAL_INVENTORY"
      - name: wtp_score_bp
        type: integer
        source: computed
        description: "Willingness-to-pay score in basis points, clamped to [WTP_MIN_BP, WTP_MAX_BP]"
      - name: offered_price_cents
        type: integer
        source: computed
        description: "Output of ancillary_offer_dynamic_price, clamped to the product floor and cap"
      - name: expected_value_cents
        type: integer
        source: computed
        description: "round_half_up(offered_price_cents * wtp_score_bp / 10000); the ranking key of offer_sequencing_selection"
      - name: valid_from
        type: datetime
        source: system
        description: "Logical clock at session creation"
      - name: valid_until
        type: datetime
        source: system
        description: "valid_from + OFFER_TTL_MINUTES; the validity window is half-open [valid_from, valid_until)"
      - name: offer_status
        type: enum
        source: system
        description: "Branching lifecycle with a divergent side-effect set per branch"
        default: PRESENTED
        constraints: "PRESENTED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED"
      - name: accepted_price_cents
        type: integer
        source: system
        description: "offered_price_cents frozen at acceptance; null unless offer_status == ACCEPTED"
        default: null

  - name: IropsWaiver
    parent: Flight
    common_fields: true
    entity_kind: resource
    fields:
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id"
      - name: event_type
        type: enum
        source: input
        description: "Irregular-operations event that justifies the waiver"
        constraints: "DELAY | CANCELLATION | DIVERSION"
      - name: delay_minutes
        type: integer
        source: input
        description: "Announced delay; must be >= IROPS_CHANGE_WAIVER_MIN_DELAY_MINUTES when CHANGE is in waiver_scope and event_type == DELAY"
        constraints: "0..1440"
      - name: waiver_scope
        type: array
        source: input
        description: "Ancillary categories whose posted fees are credited and whose future fees are waived"
        constraints: "non-empty subset of {BAGGAGE, SEAT, CHANGE, BOARDING, ONBOARD}"
      - name: declared_at
        type: datetime
        source: system
        description: "Logical clock at declaration"
      - name: waiver_state
        type: enum
        source: system
        description: "ACTIVE at declaration; RESCINDED when withdrawn; EXPIRED when the flight departs"
        default: ACTIVE
        constraints: "ACTIVE | RESCINDED | EXPIRED"
      - name: credited_bookings_count
        type: integer
        source: system
        description: "Number of bookings that received WAIVER_CREDIT entries from this waiver"
        default: 0
      - name: credited_amount_cents
        type: integer
        source: system
        description: "Sum of the absolute gross_cents of the WAIVER_CREDIT entries this waiver posted"
        default: 0
      - name: rescind_reason
        type: string
        source: system
        description: "Reason recorded when the waiver is rescinded; null otherwise"
        default: null

  - name: RevenueEntry
    parent: Booking
    common_fields: false
    entity_kind: event
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id"
      - name: product_sku
        type: string
        source: system
        description: "AncillaryProduct.sku snapshot, or the literal AIR_TRANSPORT for the fare-component bucket"
      - name: category
        type: enum
        source: system
        description: "Revenue category of the entry"
        constraints: "BAGGAGE | SEAT | CHANGE | BOARDING | ONBOARD | AIR_TRANSPORT"
      - name: entry_type
        type: enum
        source: system
        description: "ALLOCATION at ticketing, SALE on an ancillary purchase, REFUND on a reversal, WAIVER_CREDIT on an IROPS waiver, WAIVER_REVERSAL when that waiver is rescinded"
        constraints: "ALLOCATION | SALE | REFUND | WAIVER_CREDIT | WAIVER_REVERSAL"
      - name: gross_cents
        type: integer
        source: system
        description: "Signed gross amount: positive for ALLOCATION, SALE and WAIVER_REVERSAL; negative for REFUND and WAIVER_CREDIT"
      - name: tax_cents
        type: integer
        source: system
        description: "round_half_up(abs(gross_cents) * TAX_RATE_BP[tax_treatment] / 10000), carrying the sign of gross_cents"
      - name: net_cents
        type: integer
        source: system
        description: "gross_cents - tax_cents"
      - name: tax_treatment
        type: enum
        source: system
        description: "Tax bucket snapshotted from the product, or TAXABLE_TRANSPORT for AIR_TRANSPORT"
        constraints: "TAXABLE_TRANSPORT | TAXABLE_SERVICE | EXEMPT"
      - name: revenue_class
        type: enum
        source: system
        description: "Reporting class snapshotted from the product, or AIR_TRANSPORT_RELATED for AIR_TRANSPORT"
        constraints: "AIR_TRANSPORT_RELATED | NON_AIR"
      - name: revenue_account_code
        type: string
        source: system
        description: "GL account snapshotted from the product, or the literal 3000 for AIR_TRANSPORT"
      - name: accounting_period
        type: string
        source: system
        description: "YYYY-MM taken from the logical clock at posting"
      - name: source_ref
        type: string
        source: system
        description: "Audit string of the originating record: ticket:<Booking.id> | offer:<AncillaryOffer.id> | seat:<SeatAssignment.id> | waiver:<IropsWaiver.id> | change:<Booking.id>. Not a foreign key"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: FareFamily
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /fare-families/{family_id}/submit"
        actor: MerchandisingAnalyst
        preconditions:
          - "FareFamily.status == DRAFT, else ERR_FAMILY_STATE_INVALID"
          - "count(FamilyAttribute where fare_family_id == this.id and attribute_state == ACTIVE) >= 1, else ERR_FAMILY_HAS_NO_ATTRIBUTES"
          - "X-User-ID == FareFamily.design_owner_user_id, else ERR_ROLE_NOT_PERMITTED"
          - "bundle_price_cents <= a_la_carte_total_cents recomputed in this transition, else ERR_BUNDLE_DISCOUNT_FLOOR_BREACH"
        side_effects:
          - "recompute fare_family_bundle_valuation under the override_basis variant -> unbundled_value_cents, a_la_carte_total_cents, bundle_discount_bp, included_attribute_count"
          - "recompute fare_family_fee_fingerprint -> fee_fingerprint"
          - "increments FareFamily.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /fare-families/{family_id}/review-decision with decision == REJECT"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == IN_REVIEW, else ERR_FAMILY_STATE_INVALID"
          - "X-User-ID != FareFamily.design_owner_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "revision_no increases by 1"
          - "reviewer_user_id = X-User-ID of the acting PricingApprover"
          - "recompute fare_family_fee_fingerprint -> fee_fingerprint (revision_no is a fingerprint component, so the fingerprint always drifts here)"
          - "every ChannelPublication with fare_family_id == this.id and parity_state == IN_PARITY transitions to OUT_OF_PARITY with drift_reason FAMILY_REVISION_REJECTED"
          - "every Booking with fare_family_id == this.id and booking_status == HELD and disclosure_state IN {PENDING_ACK, ACKNOWLEDGED} transitions to disclosure_state STALE"
          - "increments FareFamily.version by 1"
        note: "Review/reject revision cycle: the family returns to DRAFT with a higher revision_no, so a second submit is never byte-identical to the first."
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /fare-families/{family_id}/review-decision with decision == APPROVE"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == IN_REVIEW, else ERR_FAMILY_STATE_INVALID"
          - "X-User-ID != FareFamily.design_owner_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "reviewer_user_id = X-User-ID of the acting PricingApprover"
          - "every ChannelPublication with fare_family_id == this.id and parity_state == PENDING transitions to IN_PARITY, pinning published_fee_fingerprint = FareFamily.fee_fingerprint and published_family_version = FareFamily.version as of the end of this transition"
          - "recompute publication_count"
          - "increments FareFamily.version by 1"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /fare-families/{family_id}/status-change with target_status == SUSPENDED"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == PUBLISHED, else ERR_FAMILY_STATE_INVALID"
        side_effects:
          - "every ChannelPublication with fare_family_id == this.id and parity_state == IN_PARITY transitions to OUT_OF_PARITY with drift_reason FAMILY_SUSPENDED"
          - "increments FareFamily.version by 1"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /fare-families/{family_id}/status-change with target_status == PUBLISHED"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == SUSPENDED, else ERR_FAMILY_STATE_INVALID"
        side_effects:
          - "ChannelPublication rows stay OUT_OF_PARITY; parity is restored only by POST /channel-publications/{publication_id}/resync"
          - "increments FareFamily.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /fare-families/{family_id}/status-change with target_status == RETIRED"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == PUBLISHED, else ERR_FAMILY_STATE_INVALID"
          - "count(Booking where fare_family_id == this.id and booking_status IN {HELD, TICKETED, CHANGE_PENDING}) == 0, else ERR_FAMILY_HAS_LIVE_BOOKINGS"
        side_effects:
          - "every ChannelPublication with fare_family_id == this.id and parity_state IN {PENDING, IN_PARITY, OUT_OF_PARITY} transitions to WITHDRAWN"
          - "recompute publication_count (falls to 0)"
          - "increments FareFamily.version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /fare-families/{family_id}/status-change with target_status == RETIRED"
        actor: PricingApprover
        preconditions:
          - "FareFamily.status == SUSPENDED, else ERR_FAMILY_STATE_INVALID"
          - "count(Booking where fare_family_id == this.id and booking_status IN {HELD, TICKETED, CHANGE_PENDING}) == 0, else ERR_FAMILY_HAS_LIVE_BOOKINGS"
        side_effects:
          - "every ChannelPublication with fare_family_id == this.id and parity_state IN {PENDING, IN_PARITY, OUT_OF_PARITY} transitions to WITHDRAWN"
          - "recompute publication_count (falls to 0)"
          - "increments FareFamily.version by 1"

  - entity: Flight
    dimension: sales_phase
    initial_state: PRESALE
    terminal_states: [DEPARTED]
    transitions:
      - from: PRESALE
        to: CHECKIN_OPEN
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == CHECKIN_OPEN"
        actor: OperationsController
        preconditions:
          - "Flight.sales_phase == PRESALE, else ERR_PHASE_TRANSITION_INVALID"
        side_effects:
          - "every AncillaryOffer on a Booking with flight_id == this.id whose touchpoint == BOOKING and offer_status == PRESENTED transitions to EXPIRED"
          - "increments Flight.version by 1"
      - from: CHECKIN_OPEN
        to: BOARDING
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == BOARDING"
        actor: OperationsController
        preconditions:
          - "Flight.sales_phase == CHECKIN_OPEN, else ERR_PHASE_TRANSITION_INVALID"
        side_effects:
          - "every AncillaryOffer on a Booking with flight_id == this.id whose touchpoint == CHECKIN and offer_status == PRESENTED transitions to EXPIRED"
          - "increments Flight.version by 1"
      - from: BOARDING
        to: DEPARTED
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == DEPARTED"
        actor: OperationsController
        preconditions:
          - "Flight.sales_phase == BOARDING, else ERR_PHASE_TRANSITION_INVALID"
        side_effects:
          - "every AncillaryOffer on a Booking with flight_id == this.id whose offer_status == PRESENTED transitions to EXPIRED"
          - "every SeatInventorySegment with flight_id == this.id and segment_state == OPEN transitions to CLOSED"
          - "every IropsWaiver with flight_id == this.id and waiver_state == ACTIVE transitions to EXPIRED (no reversal entries are posted)"
          - "every Booking with flight_id == this.id and booking_status == TICKETED transitions to FLOWN"
          - "recompute Flight.active_waiver_count and Flight.ticketed_booking_count"
          - "increments Flight.version by 1"
        note: "Bookings left in CHANGE_PENDING at departure stay CHANGE_PENDING; only TICKETED bookings fly."

  - entity: Flight
    dimension: irops_state
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: IRREGULAR
        trigger: "POST /flights/{flight_id}/irops-waivers"
        actor: OperationsController
        preconditions:
          - "Flight.sales_phase != DEPARTED, else ERR_FLIGHT_ALREADY_DEPARTED"
        side_effects:
          - "recompute active_waiver_count"
          - "increments Flight.version by 1"
      - from: RECOVERED
        to: IRREGULAR
        trigger: "POST /flights/{flight_id}/irops-waivers"
        actor: OperationsController
        preconditions:
          - "Flight.sales_phase != DEPARTED, else ERR_FLIGHT_ALREADY_DEPARTED"
        side_effects:
          - "recompute active_waiver_count"
          - "increments Flight.version by 1"
      - from: IRREGULAR
        to: RECOVERED
        trigger: "POST /irops-waivers/{waiver_id}/rescind that drops active_waiver_count to 0"
        actor: OperationsController
        preconditions:
          - "after this rescission, count(IropsWaiver where flight_id == this.id and waiver_state == ACTIVE) == 0"
        side_effects:
          - "recompute active_waiver_count (falls to 0)"
          - "increments Flight.version by 1"
        note: "sales_phase and irops_state are independent dimensions: a flight can be CHECKIN_OPEN x IRREGULAR, BOARDING x RECOVERED, and so on."

  - entity: Booking
    dimension: booking_status
    initial_state: HELD
    terminal_states: [CANCELLED, FLOWN]
    transitions:
      - from: HELD
        to: TICKETED
        trigger: "POST /bookings/{booking_id}/ticket"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == HELD, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
          - "Booking.disclosure_state NOT IN {NOT_ISSUED, PENDING_ACK}, else ERR_FEE_DISCLOSURE_NOT_ACKNOWLEDGED"
          - "Booking.disclosure_state != STALE and Booking.disclosed_fee_fingerprint == FareFamily.fee_fingerprint of Booking.fare_family_id, else ERR_FEE_DISCLOSURE_STALE"
          - "FareFamily.status == PUBLISHED, else ERR_FAMILY_NOT_PUBLISHED"
          - "a ChannelPublication with fare_family_id == Booking.fare_family_id and distribution_channel_id == Booking.distribution_channel_id and parity_state == IN_PARITY exists, else ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL"
          - "DistributionChannel.content_parity_status == COMPLIANT, else ERR_CHANNEL_CONTENT_PARITY_BREACH"
          - "Flight.irops_state != IRREGULAR, else ERR_IROPS_SALES_BLOCKED"
          - "Flight.sales_phase IN {PRESALE, CHECKIN_OPEN}, else ERR_FLIGHT_SALES_PHASE_CLOSED"
        side_effects:
          - "fare_component_cents = FareFamily.bundle_price_cents pinned at this instant"
          - "run ancillary_revenue_split over fare_component_cents and post one ALLOCATION RevenueEntry per weighted category, each with source_ref ticket:<Booking.id>"
          - "every SeatAssignment with booking_id == this.id and assignment_state == HELD transitions to CONFIRMED"
          - "recompute recognized_ancillary_net_cents and ancillary_gross_cents from the booking's RevenueEntry rows"
          - "run channel_settlement_total -> commission_cents, incentive_credit_cents, channel_settlement_total_cents"
          - "recompute Flight.ticketed_booking_count"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: CHANGE_PENDING
        trigger: "POST /bookings/{booking_id}/change-open"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == TICKETED, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
          - "Flight.sales_phase != DEPARTED, else ERR_FLIGHT_ALREADY_DEPARTED"
        side_effects:
          - "pending_change_fee_cents = max(0, FareFamily.change_fee_cents - Booking.change_fee_waived_cents)"
          - "increments Booking.version by 1"
      - from: CHANGE_PENDING
        to: TICKETED
        trigger: "POST /bookings/{booking_id}/change-settle with resolution == CONFIRM"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == CHANGE_PENDING, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "when pending_change_fee_cents > 0, post one SALE RevenueEntry with category CHANGE, gross_cents = pending_change_fee_cents, tax_treatment TAXABLE_SERVICE, revenue_class NON_AIR, revenue_account_code 4300, product_sku CHANGE_SETTLEMENT and source_ref change:<Booking.id>"
          - "change_count increases by 1"
          - "pending_change_fee_cents = null"
          - "recompute recognized_ancillary_net_cents, ancillary_gross_cents and channel_settlement_total"
          - "increments Booking.version by 1"
        note: "Cyclic: a booking may open and settle changes repeatedly, and change_fee_waived_cents from an IROPS waiver lowers each subsequent quote."
      - from: CHANGE_PENDING
        to: TICKETED
        trigger: "POST /bookings/{booking_id}/change-settle with resolution == ABANDON"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == CHANGE_PENDING, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "pending_change_fee_cents = null"
          - "change_count is unchanged and no RevenueEntry is posted"
          - "increments Booking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == HELD, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "every SeatAssignment with booking_id == this.id and assignment_state == HELD transitions to RELEASED with released_reason BOOKING_CANCELLED"
          - "every AncillaryOffer with booking_id == this.id and offer_status == PRESENTED transitions to SUPERSEDED"
          - "for every RevenueEntry of this booking with entry_type == SALE whose product has refundable == true, post a mirroring REFUND entry, processed in source SALE created_at ASC order"
          - "recompute recognized_ancillary_net_cents, ancillary_gross_cents and channel_settlement_total"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == TICKETED, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "every SeatAssignment with booking_id == this.id and assignment_state IN {HELD, CONFIRMED} transitions to RELEASED with released_reason BOOKING_CANCELLED"
          - "every AncillaryOffer with booking_id == this.id and offer_status == PRESENTED transitions to SUPERSEDED"
          - "for every RevenueEntry of this booking with entry_type == SALE whose product has refundable == true, post a mirroring REFUND entry, processed in source SALE created_at ASC order"
          - "when FareFamily.refundability == FULLY_REFUNDABLE, post a mirroring REFUND entry for every ALLOCATION entry of this booking, processed in source ALLOCATION created_at ASC order; otherwise ALLOCATION entries are not reversed"
          - "recompute recognized_ancillary_net_cents, ancillary_gross_cents and channel_settlement_total"
          - "recompute Flight.ticketed_booking_count"
          - "increments Booking.version by 1"
      - from: CHANGE_PENDING
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == CHANGE_PENDING, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "pending_change_fee_cents = null"
          - "the same seat, offer, refund and recount side effects as the TICKETED -> CANCELLED transition"
          - "increments Booking.version by 1"
      - from: TICKETED
        to: FLOWN
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == DEPARTED"
        actor: system
        preconditions:
          - "Booking.booking_status == TICKETED"
        side_effects:
          - "no revenue is posted or reversed; the booking becomes terminal"
          - "increments Booking.version by 1"

  - entity: Booking
    dimension: disclosure_state
    initial_state: NOT_ISSUED
    terminal_states: []
    transitions:
      - from: NOT_ISSUED
        to: PENDING_ACK
        trigger: "POST /bookings/{booking_id}/disclosure"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == HELD, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
          - "every FamilyAttribute of Booking.fare_family_id with attribute_state == ACTIVE and inclusion == CHARGEABLE references an AncillaryProduct whose category is a member of DistributionChannel.supported_categories, else ERR_CHANNEL_CATEGORY_UNSUPPORTED"
          - "every FamilyAttribute of Booking.fare_family_id with attribute_state == ACTIVE and inclusion == CHARGEABLE references an AncillaryProduct with disclosable_fee == true, else ERR_UNDISCLOSED_FEE_CATEGORY"
        side_effects:
          - "disclosed_fee_fingerprint = FareFamily.fee_fingerprint"
          - "disclosed_unbundled_list_cents = fare_family_bundle_valuation under the list_basis variant"
          - "disclosed_total_fee_cents = sum over FamilyAttribute rows with attribute_state == ACTIVE and inclusion == CHARGEABLE of effective_unit_cents, plus FareFamily.change_fee_cents"
          - "disclosure_issued_at = logical clock"
          - "increments Booking.version by 1"
      - from: STALE
        to: PENDING_ACK
        trigger: "POST /bookings/{booking_id}/disclosure"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status == HELD, else ERR_BOOKING_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "the same re-snapshot side effects as NOT_ISSUED -> PENDING_ACK, against the drifted fingerprint"
          - "disclosure_acked_at = null"
          - "increments Booking.version by 1"
      - from: PENDING_ACK
        to: ACKNOWLEDGED
        trigger: "POST /bookings/{booking_id}/disclosure-ack"
        actor: ChannelPartner
        preconditions:
          - "Booking.disclosure_state == PENDING_ACK, else ERR_DISCLOSURE_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id, else ERR_CHANNEL_SCOPE_VIOLATION"
          - "request acknowledged_fee_fingerprint == Booking.disclosed_fee_fingerprint, else ERR_DISCLOSURE_FINGERPRINT_MISMATCH"
        side_effects:
          - "disclosure_acked_at = logical clock"
          - "increments Booking.version by 1"
      - from: PENDING_ACK
        to: STALE
        trigger: "system: any transition or PATCH that changes FareFamily.fee_fingerprint of Booking.fare_family_id"
        actor: system
        preconditions:
          - "Booking.booking_status == HELD"
        side_effects:
          - "disclosed_* fields keep their stale snapshot so the drift is auditable"
          - "increments Booking.version by 1"
      - from: ACKNOWLEDGED
        to: STALE
        trigger: "system: any transition or PATCH that changes FareFamily.fee_fingerprint of Booking.fare_family_id"
        actor: system
        preconditions:
          - "Booking.booking_status == HELD"
        side_effects:
          - "disclosed_* fields keep their stale snapshot so the drift is auditable"
          - "increments Booking.version by 1"
        note: "Conditional cascade: bookings already TICKETED are NOT staled by a later fingerprint drift, because their disclosure obligation was discharged at the point of sale."

  - entity: AncillaryOffer
    dimension: offer_status
    initial_state: PRESENTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /ancillary-offers/{offer_id}/accept"
        actor: ChannelPartner
        preconditions:
          - "AncillaryOffer.offer_status == PRESENTED, else ERR_OFFER_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id of AncillaryOffer.booking_id, else ERR_CHANNEL_SCOPE_VIOLATION"
          - "valid_from <= logical clock < valid_until (half-open window), else ERR_OFFER_WINDOW_CLOSED"
          - "Booking.booking_status IN {HELD, TICKETED}, else ERR_BOOKING_STATE_INVALID"
          - "request expected_booking_version == Booking.version, else ERR_STALE_BOOKING_VERSION"
          - "DistributionChannel.content_parity_status == COMPLIANT, else ERR_CHANNEL_CONTENT_PARITY_BREACH"
          - "offered_price_cents <= DistributionChannel.max_ancillary_price_cents, else ERR_OFFER_PRICE_CAP_EXCEEDED"
        side_effects:
          - "accepted_price_cents = offered_price_cents"
          - "post one SALE RevenueEntry with category = AncillaryProduct.category, gross_cents = accepted_price_cents, tax and class snapshotted from the product, and source_ref offer:<AncillaryOffer.id>"
          - "every other AncillaryOffer with the same booking_id, the same ancillary_product_id and offer_status == PRESENTED transitions to SUPERSEDED"
          - "recompute Booking.recognized_ancillary_net_cents, Booking.ancillary_gross_cents and channel_settlement_total"
          - "increments Booking.version by 1"
          - "increments AncillaryOffer.version by 1"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /ancillary-offers/{offer_id}/decline"
        actor: ChannelPartner
        preconditions:
          - "AncillaryOffer.offer_status == PRESENTED, else ERR_OFFER_STATE_INVALID"
          - "X-User-ID == Booking.distribution_channel_id of AncillaryOffer.booking_id, else ERR_CHANNEL_SCOPE_VIOLATION"
        side_effects:
          - "AncillaryOffer.updated_at = logical clock, which starts the OFFER_COOLOFF_MINUTES cool-off window for this (booking_id, ancillary_product_id) pair"
          - "increments AncillaryOffer.version by 1"
      - from: PRESENTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc where the new clock value is >= AncillaryOffer.valid_until"
        actor: system
        preconditions:
          - "AncillaryOffer.offer_status == PRESENTED"
        side_effects:
          - "no revenue is posted; the offer becomes terminal and no longer occupies a MAX_OFFERS_PER_SESSION slot"
          - "increments AncillaryOffer.version by 1"
        note: "Expiry is swept deterministically on every clock set, so no wall-clock wait is ever required."
      - from: PRESENTED
        to: EXPIRED
        trigger: "POST /flights/{flight_id}/phase-advance that closes this offer's touchpoint"
        actor: system
        preconditions:
          - "AncillaryOffer.offer_status == PRESENTED"
          - "the advanced-to phase closes the offer's touchpoint: CHECKIN_OPEN closes BOOKING, BOARDING closes CHECKIN, DEPARTED closes every touchpoint"
        side_effects:
          - "increments AncillaryOffer.version by 1"
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system: a cascade that invalidates the offer's price basis (PATCH /family-attributes/{attribute_id}, REJECT review decision, POST /flights/{flight_id}/irops-waivers, or POST /bookings/{booking_id}/cancel)"
        actor: system
        preconditions:
          - "AncillaryOffer.offer_status == PRESENTED"
        side_effects:
          - "no revenue is posted; a fresh offer session is required to re-merchandise the product"
          - "increments AncillaryOffer.version by 1"
        note: "SUPERSEDED is distinct from EXPIRED: EXPIRED means the window or touchpoint closed, SUPERSEDED means the priced content changed underneath the offer."

  - entity: SeatAssignment
    dimension: assignment_state
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/seat-assignments when Booking.booking_status IN {TICKETED, CHANGE_PENDING} (same-request auto-confirmation)"
        actor: ChannelPartner
        preconditions:
          - "Booking.booking_status IN {TICKETED, CHANGE_PENDING}"
        side_effects:
          - "SeatInventorySegment.sold_seats increases by 1 and held_seats is unchanged (the row is never counted as held)"
          - "when price_charged_cents > 0, post one SALE RevenueEntry with category SEAT, gross_cents = price_charged_cents and source_ref seat:<SeatAssignment.id>"
          - "recompute Booking.recognized_ancillary_net_cents, Booking.ancillary_gross_cents and channel_settlement_total"
          - "recompute SeatInventorySegment.available_seats"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/ticket"
        actor: system
        preconditions:
          - "SeatAssignment.assignment_state == HELD"
        side_effects:
          - "SeatInventorySegment.held_seats decreases by 1 and sold_seats increases by 1"
          - "when price_charged_cents > 0, post one SALE RevenueEntry with category SEAT, gross_cents = price_charged_cents and source_ref seat:<SeatAssignment.id>"
          - "recompute SeatInventorySegment.available_seats"
          - "increments SeatAssignment.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /seat-assignments/{assignment_id}/release, or a cascade from POST /bookings/{booking_id}/cancel, or a cascade from POST /flights/{flight_id}/irops-waivers with event_type == DIVERSION and SEAT in waiver_scope"
        actor: ChannelPartner
        preconditions:
          - "SeatAssignment.assignment_state == HELD, else ERR_SEAT_ASSIGNMENT_STATE_INVALID"
        side_effects:
          - "released_reason = PASSENGER_RELEASE for the explicit release endpoint, BOOKING_CANCELLED for the cancel cascade, IROPS_REACCOMMODATION for the diversion cascade"
          - "SeatInventorySegment.held_seats decreases by 1 and available_seats increases by 1"
          - "no RevenueEntry is posted or reversed, because a HELD seat was never sold"
          - "increments SeatAssignment.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /seat-assignments/{assignment_id}/release, or a cascade from POST /bookings/{booking_id}/cancel, or a cascade from POST /flights/{flight_id}/irops-waivers with event_type == DIVERSION and SEAT in waiver_scope"
        actor: ChannelPartner
        preconditions:
          - "SeatAssignment.assignment_state == CONFIRMED, else ERR_SEAT_ASSIGNMENT_STATE_INVALID"
          - "Flight.sales_phase != DEPARTED, else ERR_FLIGHT_ALREADY_DEPARTED"
        side_effects:
          - "released_reason = PASSENGER_RELEASE for the explicit release endpoint, BOOKING_CANCELLED for the cancel cascade, IROPS_REACCOMMODATION for the diversion cascade"
          - "SeatInventorySegment.sold_seats decreases by 1 and available_seats increases by 1"
          - "when price_charged_cents > 0, post one REFUND RevenueEntry mirroring the seat SALE with gross_cents = -price_charged_cents, tax_cents = -(the SALE tax_cents) and source_ref seat:<SeatAssignment.id>"
          - "recompute Booking.recognized_ancillary_net_cents, Booking.ancillary_gross_cents and channel_settlement_total"
          - "increments SeatAssignment.version by 1"

  - entity: SeatInventorySegment
    dimension: segment_state
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == DEPARTED"
        actor: system
        preconditions:
          - "SeatInventorySegment.segment_state == OPEN"
        side_effects:
          - "the segment leaves the row-overlap candidate set of seat_segment_row_overlap validation and accepts no further SeatAssignment rows"
          - "increments SeatInventorySegment.version by 1"

  - entity: IropsWaiver
    dimension: waiver_state
    initial_state: ACTIVE
    terminal_states: [RESCINDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /irops-waivers/{waiver_id}/rescind"
        actor: OperationsController
        preconditions:
          - "IropsWaiver.waiver_state == ACTIVE, else ERR_WAIVER_STATE_INVALID"
          - "Flight.sales_phase != DEPARTED, else ERR_FLIGHT_ALREADY_DEPARTED"
        side_effects:
          - "for every RevenueEntry this waiver posted with entry_type == WAIVER_CREDIT, post one mirroring WAIVER_REVERSAL entry with gross_cents and tax_cents sign-flipped, processed in source WAIVER_CREDIT created_at ASC order"
          - "for every Booking this waiver credited, Booking.change_fee_waived_cents decreases by the amount this waiver added, and waiver_applied becomes false when no other IropsWaiver on the flight has waiver_state == ACTIVE"
          - "rescind_reason = request rescind_reason"
          - "recompute Flight.active_waiver_count, and Flight.irops_state -> RECOVERED when the count falls to 0"
          - "recompute recognized_ancillary_net_cents, ancillary_gross_cents and channel_settlement_total for every credited Booking"
          - "increments IropsWaiver.version by 1"
        note: "Compensation: the rescission restores every field the declaration moved, so a declare-then-rescind pair is net-zero on Booking.recognized_ancillary_net_cents."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /flights/{flight_id}/phase-advance with target_phase == DEPARTED"
        actor: system
        preconditions:
          - "IropsWaiver.waiver_state == ACTIVE"
        side_effects:
          - "no WAIVER_REVERSAL entries are posted: fees credited before departure stay credited"
          - "recompute Flight.active_waiver_count"
          - "increments IropsWaiver.version by 1"

  - entity: ChannelPublication
    dimension: parity_state
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: IN_PARITY
        trigger: "POST /fare-families/{family_id}/review-decision with decision == APPROVE, or POST /channel-publications against a FareFamily already in status PUBLISHED (same-request promotion)"
        actor: DistributionManager
        preconditions:
          - "ChannelPublication.parity_state == PENDING"
          - "FareFamily.status == PUBLISHED at the end of the triggering request"
        side_effects:
          - "published_fee_fingerprint = FareFamily.fee_fingerprint and published_family_version = FareFamily.version, both as of the end of the triggering request"
          - "recompute FareFamily.publication_count and DistributionChannel.content_parity_status"
          - "increments ChannelPublication.version by 1"
      - from: IN_PARITY
        to: OUT_OF_PARITY
        trigger: "system: PATCH /family-attributes/{attribute_id}, POST /fare-families/{family_id}/review-decision with decision == REJECT, or POST /fare-families/{family_id}/status-change with target_status == SUSPENDED"
        actor: system
        preconditions:
          - "ChannelPublication.parity_state == IN_PARITY"
          - "FareFamily.fee_fingerprint != ChannelPublication.published_fee_fingerprint, or the family left status PUBLISHED"
        side_effects:
          - "drift_reason = ATTRIBUTE_REPRICED, FAMILY_REVISION_REJECTED or FAMILY_SUSPENDED according to the trigger"
          - "DistributionChannel.parity_breach_count increases by 1"
          - "DistributionChannel.content_parity_status becomes BREACHED when DistributionChannel.parity_required == true"
          - "every AncillaryOffer with offer_status == PRESENTED on a Booking whose fare_family_id and distribution_channel_id match this publication transitions to SUPERSEDED"
          - "increments ChannelPublication.version by 1"
      - from: OUT_OF_PARITY
        to: IN_PARITY
        trigger: "POST /channel-publications/{publication_id}/resync"
        actor: DistributionManager
        preconditions:
          - "ChannelPublication.parity_state == OUT_OF_PARITY, else ERR_PUBLICATION_STATE_INVALID"
          - "FareFamily.status == PUBLISHED, else ERR_FAMILY_NOT_PUBLISHED"
        side_effects:
          - "published_fee_fingerprint and published_family_version are re-pinned to the live FareFamily values"
          - "drift_reason = null and last_resync_at = logical clock"
          - "recompute DistributionChannel.content_parity_status (COMPLIANT once no publication of the channel is OUT_OF_PARITY); parity_breach_count is monotonic and never decreases"
          - "increments ChannelPublication.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /fare-families/{family_id}/status-change with target_status == RETIRED"
        actor: system
        preconditions:
          - "ChannelPublication.parity_state == PENDING"
        side_effects:
          - "recompute FareFamily.publication_count and DistributionChannel.content_parity_status"
          - "increments ChannelPublication.version by 1"
      - from: IN_PARITY
        to: WITHDRAWN
        trigger: "POST /fare-families/{family_id}/status-change with target_status == RETIRED"
        actor: system
        preconditions:
          - "ChannelPublication.parity_state == IN_PARITY"
        side_effects:
          - "recompute FareFamily.publication_count and DistributionChannel.content_parity_status"
          - "increments ChannelPublication.version by 1"
      - from: OUT_OF_PARITY
        to: WITHDRAWN
        trigger: "POST /fare-families/{family_id}/status-change with target_status == RETIRED"
        actor: system
        preconditions:
          - "ChannelPublication.parity_state == OUT_OF_PARITY"
        side_effects:
          - "recompute FareFamily.publication_count and DistributionChannel.content_parity_status (a retired family's publications no longer breach the channel)"
          - "increments ChannelPublication.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: offer-accept-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /ancillary-offers/{offer_id}/accept"
    occ_field: "expected_booking_version"
    description: |
      Accepting an AncillaryOffer against a Booking whose version has advanced
      since the client last read it is rejected. Acceptance legitimately
      supersedes every other PRESENTED offer for the same product on that
      booking and posts a SALE entry that moves the booking's money fields, so a
      writer holding a stale view of the booking would settle against a revenue
      and settlement picture that no longer exists.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: publication-create-stale-family
    parent_entity: FareFamily
    write_endpoint: "POST /channel-publications"
    occ_field: "expected_fare_family_version"
    description: |
      Creating a ChannelPublication against a FareFamily whose version has
      advanced since the client last read it is rejected. A publication pins
      published_fee_fingerprint and published_family_version from the family it
      is created against, and any earlier write may have re-fingerprinted that
      family, so a stale view would publish content the airline no longer sells.
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: fare_family_bundle_valuation
    trigger: "POST /fare-families/{family_id}/attributes; PATCH /family-attributes/{attribute_id}; the DRAFT -> IN_REVIEW submit transition; POST /bookings/{booking_id}/disclosure (list_basis only)"
    algorithm: weighted_scoring
    formula: |
      # Per-attribute extended value, rounded ONCE PER ATTRIBUTE, then summed.
      # Rounding order is pinned: never sum the un-rounded products.
      for each FamilyAttribute a of the family with a.attribute_state == ACTIVE, taken in
      AncillaryProduct.sku ASC order:
          eff = effective_unit_cents(a)                      # variant-dependent, see variants
          a.attr_value_cents = round_half_up(
              eff * a.included_quantity * (10000 + CABIN_UPLIFT_BP[family.cabin_class]) / 10000 )
          # CHARGEABLE attributes always carry included_quantity == 0, so they contribute 0
      unbundled_value_cents  = sum of a.attr_value_cents over the same set
      a_la_carte_total_cents = family.base_fare_cents + unbundled_value_cents
      included_attribute_count = count of a with a.attribute_state == ACTIVE and a.inclusion == INCLUDED
      if unbundled_value_cents == 0:
          bundle_discount_bp = 0
      else:
          bundle_discount_bp = round_half_up(
              (a_la_carte_total_cents - family.bundle_price_cents) * 10000 / a_la_carte_total_cents )
    input_set: "FamilyAttribute rows with fare_family_id == family.id and attribute_state == ACTIVE; WITHDRAWN attributes are excluded from every output including the fingerprint. Iteration order is AncillaryProduct.sku ASC."
    constants:
      CABIN_UPLIFT_BP: { ECONOMY: 0, PREMIUM: 1500, BUSINESS: 3000 }
    precision: "integer cents, round_half_up, applied once per attribute and once again to bundle_discount_bp"
    variants:
      - name: override_basis
        when: "Every write that persists FareFamily.unbundled_value_cents, a_la_carte_total_cents, bundle_discount_bp and FamilyAttribute.attr_value_cents, and every ancillary_revenue_split weight"
        difference: "effective_unit_cents(a) = a.override_price_cents when it is not null, else the referenced AncillaryProduct.list_price_cents"
      - name: list_basis
        when: "POST /bookings/{booking_id}/disclosure only, to populate Booking.disclosed_unbundled_list_cents — regulatory disclosure must quote catalog list prices, never negotiated overrides"
        difference: "effective_unit_cents(a) = the referenced AncillaryProduct.list_price_cents, ignoring a.override_price_cents entirely"

  - name: fare_family_fee_fingerprint
    trigger: "every transition or PATCH that mutates a FareFamily's attribute set, its revision_no, or any referenced AncillaryProduct.list_price_cents"
    algorithm: projection
    formula: |
      parts = []
      for each FamilyAttribute a of the family with a.attribute_state == ACTIVE,
          in AncillaryProduct.sku ASC order:
          parts.append( product.sku + ":" + a.inclusion + ":" + str(a.included_quantity)
                        + ":" + str(a.effective_unit_cents) )      # override_basis effective unit
      fee_fingerprint = family.code + "|" + str(family.revision_no) + "|" + join(parts, ";")
      # A family with zero ACTIVE attributes yields "<code>|<revision_no>|"
    input_set: "FamilyAttribute rows with fare_family_id == family.id and attribute_state == ACTIVE, ordered by AncillaryProduct.sku ASC"
    constants: {}
    precision: "exact string equality; the fingerprint is compared byte-for-byte against ChannelPublication.published_fee_fingerprint and Booking.disclosed_fee_fingerprint"

  - name: ancillary_offer_dynamic_price
    trigger: "POST /bookings/{booking_id}/offer-sessions, once per candidate selected by offer_sequencing_selection"
    algorithm: threshold
    formula: |
      # Step 1 - willingness-to-pay score in basis points (variant-dependent, see variants)
      raw_wtp_bp   = <variant expression>
      wtp_score_bp = min(WTP_MAX_BP, max(WTP_MIN_BP, raw_wtp_bp))

      # Step 2 - nonlinear chain: THREE sequential round_half_up steps, THEN a clamp.
      # The order is pinned; folding the three multipliers into one product diverges.
      wtp_price_cents        = round_half_up(product.list_price_cents * wtp_score_bp / 10000)
      touchpoint_price_cents = round_half_up(wtp_price_cents * TOUCHPOINT_MULTIPLIER_BP[touchpoint] / 10000)
      channel_price_cents    = round_half_up(touchpoint_price_cents * (10000 + channel.markup_bp) / 10000)

      floor_cents = round_half_up(product.list_price_cents * PRICE_FLOOR_BP / 10000)
      cap_cents   = round_half_up(product.list_price_cents * PRICE_CAP_BP   / 10000)
      offered_price_cents = min(cap_cents, max(floor_cents, channel_price_cents))

      expected_value_cents = round_half_up(offered_price_cents * wtp_score_bp / 10000)
      # NOTE: DistributionChannel.max_ancillary_price_cents is NOT applied here. It is
      # enforced only at POST /ancillary-offers/{offer_id}/accept, so a channel-unsellable
      # price can be presented and then rejected with ERR_OFFER_PRICE_CAP_EXCEEDED.
    input_set: "The single AncillaryProduct being priced, the Booking's DistributionChannel, the Booking's Flight (booked_load_factor_pct, demand_index_bp), and, for the RESIDUAL_INVENTORY variant, every SeatInventorySegment with flight_id == Booking.flight_id, ancillary_product_id == product.id and segment_state == OPEN"
    constants:
      BASE_WTP_BP: 10000
      WTP_LF_SLOPE_BP: 40
      WTP_SCARCITY_SLOPE_BP: 60
      WTP_MIN_BP: 6000
      WTP_MAX_BP: 16000
      TOUCHPOINT_MULTIPLIER_BP: { BOOKING: 10000, CHECKIN: 11000, INFLIGHT: 12500 }
      PRICE_FLOOR_BP: 7000
      PRICE_CAP_BP: 18000
    precision: "integer cents, round_half_up at each of the three chain steps and again for expected_value_cents"
    variants:
      - name: WTP_ELASTIC
        when: "The product's category != SEAT, OR no SeatInventorySegment with flight_id == Booking.flight_id and ancillary_product_id == product.id has segment_state == OPEN"
        difference: |
          raw_wtp_bp = BASE_WTP_BP
                     + WTP_LF_SLOPE_BP * (flight.booked_load_factor_pct - 50)
                     + round_half_up(flight.demand_index_bp * WTP_SCARCITY_SLOPE_BP / 10000)
          The score is driven by the revenue-management demand feed on the flight.
      - name: RESIDUAL_INVENTORY
        when: "The product's category == SEAT AND at least one SeatInventorySegment with flight_id == Booking.flight_id and ancillary_product_id == product.id has segment_state == OPEN"
        difference: |
          basis_total     = sum of total_seats     over those OPEN segments
          basis_available = sum of available_seats over those OPEN segments
          sold_pct        = round_half_up((basis_total - basis_available) * 100 / basis_total)
          raw_wtp_bp      = BASE_WTP_BP + WTP_SCARCITY_SLOPE_BP * (sold_pct - 50)
          The score ignores the flight's demand feed entirely and reads only physical
          seat scarcity, so identical flight data yields a different offered_price_cents.

  - name: seat_segment_effective_price
    trigger: "POST /seat-segments; POST /flights/{flight_id}/demand-snapshot (recomputed for every SeatInventorySegment of the flight)"
    algorithm: tiered_pricing
    formula: |
      row_band_cents =
          ROW_BAND_ADJUST_CENTS.rows_1_to_5   when segment.row_start <= 5
          ROW_BAND_ADJUST_CENTS.rows_6_to_15  when 6  <= segment.row_start <= 15
          ROW_BAND_ADJUST_CENTS.rows_16_plus  when segment.row_start >= 16
      zone_base_cents = segment.base_price_cents + row_band_cents          # exact integer, no rounding

      demand_tier =
          HIGH when flight.booked_load_factor_pct >= DEMAND_TIER_THRESHOLD_PCT.HIGH_AT_OR_ABOVE
          MID  when flight.booked_load_factor_pct >= DEMAND_TIER_THRESHOLD_PCT.MID_AT_OR_ABOVE
          LOW  otherwise

      # ONE rounding at the very end: zone and demand multipliers are applied to the
      # exact rational product, never to an intermediate rounded value.
      effective_price_cents = round_half_up(
          zone_base_cents * ZONE_MULTIPLIER_BP[segment.zone]
                          * DEMAND_TIER_MULTIPLIER_BP[demand_tier] / 100000000 )
    input_set: "The single SeatInventorySegment and its parent Flight's booked_load_factor_pct; segments with segment_state == CLOSED are still repriced but accept no assignments"
    constants:
      ROW_BAND_ADJUST_CENTS: { rows_1_to_5: 1500, rows_6_to_15: 500, rows_16_plus: 0 }
      ZONE_MULTIPLIER_BP: { FWD: 13000, MID: 10000, AFT: 9000, EXIT_ROW: 16000, BULKHEAD: 14000 }
      DEMAND_TIER_MULTIPLIER_BP: { LOW: 10000, MID: 11000, HIGH: 12500 }
      DEMAND_TIER_THRESHOLD_PCT: { HIGH_AT_OR_ABOVE: 80, MID_AT_OR_ABOVE: 60 }
    precision: "integer cents, exactly one round_half_up applied to the full product"

  - name: channel_settlement_total
    trigger: "the HELD -> TICKETED ticket transition; every AncillaryOffer PRESENTED -> ACCEPTED; every SeatAssignment transition that posts or reverses a SALE; every CHANGE_PENDING -> TICKETED settle with resolution == CONFIRM; every IropsWaiver declaration and rescission; every Booking cancellation"
    algorithm: aggregation
    formula: |
      # PINNED SEVEN-STEP ORDER. The incentive tier is keyed on provisional_total_cents
      # (step 4) and is NEVER re-derived from channel_settlement_total_cents (step 7).
      1. ancillary_gross_cents = sum of RevenueEntry.gross_cents for this booking over rows with
                                 entry_type IN {SALE, REFUND, WAIVER_CREDIT, WAIVER_REVERSAL}   # signed
      2. subtotal_cents        = booking.fare_component_cents + ancillary_gross_cents
      3. commission_cents      = round_half_up(subtotal_cents * channel.commission_bp / 10000)
      4. provisional_total_cents = subtotal_cents + commission_cents
      5. incentive_tier_bp =
             INCENTIVE_TIER_BP.at_or_above_50000 when provisional_total_cents >= 50000
             INCENTIVE_TIER_BP.at_or_above_30000 when provisional_total_cents >= 30000
             INCENTIVE_TIER_BP.below_30000       otherwise
      6. incentive_credit_cents      = round_half_up(provisional_total_cents * incentive_tier_bp / 10000)
      7. channel_settlement_total_cents = provisional_total_cents - incentive_credit_cents
      # Before ticketing, fare_component_cents is null and commission_cents,
      # incentive_credit_cents and channel_settlement_total_cents all stay 0, while
      # ancillary_gross_cents keeps tracking the signed ancillary total of step 1.
    input_set: "RevenueEntry rows with booking_id == booking.id and entry_type IN {SALE, REFUND, WAIVER_CREDIT, WAIVER_REVERSAL}; ALLOCATION rows are excluded because the fare component enters through fare_component_cents"
    constants:
      INCENTIVE_TIER_BP: { at_or_above_50000: 300, at_or_above_30000: 150, below_30000: 0 }
    precision: "integer cents, round_half_up at step 3 and step 6 only"

  - name: ancillary_revenue_split
    trigger: "the HELD -> TICKETED ticket transition, over Booking.fare_component_cents"
    algorithm: waterfall_allocation
    formula: |
      # Category weights from the override_basis valuation of the booking's fare family.
      weight[category] = sum of a.attr_value_cents over FamilyAttribute rows a of the family with
                         a.attribute_state == ACTIVE and a.inclusion == INCLUDED whose product has
                         that category
      weight[AIR_TRANSPORT] = family.base_fare_cents
      total_weight = family.a_la_carte_total_cents          # == base_fare_cents + unbundled_value_cents
      buckets = the categories with weight > 0, iterated in CATEGORY_PRIORITY_ORDER

      # Pass 1 - floor proration (never round_half_up here; the remainder pass owns the residue)
      for each bucket c: gross[c] = floor(booking.fare_component_cents * weight[c] / total_weight)
      remainder = booking.fare_component_cents - sum(gross[c])

      # Pass 2 - distribute the remainder ONE CENT AT A TIME, in descending weight[c] order,
      # ties broken by index in CATEGORY_PRIORITY_ORDER ASC. remainder < count(buckets) always,
      # so each bucket receives at most one extra cent.
      for i in 0 .. remainder-1: gross[ranked_buckets[i]] += 1

      # Pass 3 - tax per bucket. The bucket's tax_treatment, revenue_class, revenue_account_code
      # and product_sku are snapshotted from the contributing attribute whose product sku is
      # lexicographically SMALLEST in that category; AIR_TRANSPORT uses TAXABLE_TRANSPORT,
      # revenue_class AIR_TRANSPORT_RELATED, revenue_account_code 3000, product_sku AIR_TRANSPORT.
      for each bucket c:
          tax[c] = round_half_up(gross[c] * TAX_RATE_BP[treatment[c]] / 10000)
          net[c] = gross[c] - tax[c]
          post one RevenueEntry(entry_type=ALLOCATION, category=c, gross_cents=gross[c],
                                tax_cents=tax[c], net_cents=net[c], source_ref="ticket:"+booking.id)
      # Invariant: sum(gross[c]) == booking.fare_component_cents, exactly.
    input_set: "FamilyAttribute rows of Booking.fare_family_id with attribute_state == ACTIVE and inclusion == INCLUDED, plus the synthetic AIR_TRANSPORT bucket; CHARGEABLE and WITHDRAWN attributes carry no weight"
    constants:
      CATEGORY_PRIORITY_ORDER: [BAGGAGE, SEAT, CHANGE, BOARDING, ONBOARD, AIR_TRANSPORT]
      TAX_RATE_BP: { TAXABLE_TRANSPORT: 750, TAXABLE_SERVICE: 400, EXEMPT: 0 }
    precision: "integer cents; floor in pass 1, exact remainder distribution in pass 2, round_half_up per bucket in pass 3"

  - name: offer_sequencing_selection
    trigger: "POST /bookings/{booking_id}/offer-sessions"
    algorithm: topological
    formula: |
      # (a) Eligibility filter - the candidate set, as an explicit predicate
      candidates = AncillaryProduct rows p such that ALL of:
          p.product_state == ACTIVE
          p.category is a member of channel.supported_categories
          when the request supplied requested_product_ids: p.id is a member of that list
          NOT exists FamilyAttribute a of booking.fare_family_id with a.attribute_state == ACTIVE
              and a.inclusion == INCLUDED and a.ancillary_product_id == p.id      # already bundled
          NOT exists AncillaryOffer o with o.booking_id == booking.id
              and o.ancillary_product_id == p.id and o.offer_status == ACCEPTED    # already bought
          NOT exists AncillaryOffer o with o.booking_id == booking.id
              and o.ancillary_product_id == p.id and o.offer_status == PRESENTED   # already on the table
          NOT ( o exists with o.booking_id == booking.id and o.ancillary_product_id == p.id
                and o.offer_status == DECLINED
                and o.updated_at + OFFER_COOLOFF_MINUTES > clock )                 # cool-off
          NOT ( p.category == CHANGE and touchpoint == BOOKING )                    # no change fee pre-ticket
          NOT exists IropsWaiver w with w.flight_id == booking.flight_id
              and w.waiver_state == ACTIVE and p.category is a member of w.waiver_scope

      # (b) Ranking expression
      for each candidate: price it with ancillary_offer_dynamic_price -> offered_price_cents,
          wtp_score_bp, expected_value_cents
      rank by expected_value_cents DESC

      # (c) Tie-break, applied in this order
      #     1. index of p.category in CATEGORY_PRIORITY_ORDER ASC
      #     2. p.created_at ASC          (never p.id)

      # (d) Truncation and empty-pool fallback
      presented = the first MAX_OFFERS_PER_SESSION entries of the ranked list;
                  sequence_rank = 1..n in ranked order; each becomes an AncillaryOffer with
                  offer_status PRESENTED, valid_from = clock, valid_until = clock + OFFER_TTL_MINUTES
      when candidates is empty: respond 201 with presented_offer_ids = [], candidate_count = 0 and
                  suppression_reason = "NO_ELIGIBLE_CANDIDATES"; no AncillaryOffer row is created
      otherwise:  suppression_reason = "" and candidate_count = count(candidates) before truncation
    input_set: "AncillaryProduct rows filtered by the (a) predicate above; the Booking, its Flight, its DistributionChannel and its FareFamily supply the filter and pricing inputs"
    constants:
      MAX_OFFERS_PER_SESSION: 3
      OFFER_TTL_MINUTES: 60
      OFFER_COOLOFF_MINUTES: 30
      CATEGORY_PRIORITY_ORDER: [BAGGAGE, SEAT, CHANGE, BOARDING, ONBOARD, AIR_TRANSPORT]
    precision: "integer ranking on expected_value_cents; the validity window is half-open [valid_from, valid_until)"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in 1.7 and that role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "request body contains every required field of the endpoint's input, no unknown fields, every value matches its declared type, enum member set and numeric range (including record_locator format, airport-code format, sku/code character sets, seat_letters membership in A-F, waiver_scope non-empty, delay_minutes 0..1440, booked_load_factor_pct 0..100, demand_index_bp -5000..5000, boarding_priority_tier 1..4, included_quantity 0..9, limit 1..100 and offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint's pagination and filter parameters"
  - priority: 4
    category: existence
    check: "every path-templated id resolves to a stored row, validated left-to-right: flight_id -> ERR_FLIGHT_NOT_FOUND, family_id -> ERR_FARE_FAMILY_NOT_FOUND, attribute_id -> ERR_FAMILY_ATTRIBUTE_NOT_FOUND, product_id -> ERR_ANCILLARY_PRODUCT_NOT_FOUND, segment_id -> ERR_SEAT_SEGMENT_NOT_FOUND, channel_id -> ERR_DISTRIBUTION_CHANNEL_NOT_FOUND, publication_id -> ERR_CHANNEL_PUBLICATION_NOT_FOUND, booking_id -> ERR_BOOKING_NOT_FOUND, offer_id -> ERR_ANCILLARY_OFFER_NOT_FOUND, assignment_id -> ERR_SEAT_ASSIGNMENT_NOT_FOUND, waiver_id -> ERR_IROPS_WAIVER_NOT_FOUND"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row, validated in the order the endpoint's input declares them, using the same per-entity NOT_FOUND error ids as priority 4"
    error_id: ERR_FARE_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "POST /fare-families, POST /fare-families/{family_id}/attributes, POST /seat-segments, POST /channel-publications, POST /bookings, POST /bookings/{booking_id}/seat-assignments, POST /bookings/{booking_id}/offer-sessions"
  - priority: 6
    category: auth
    check: "when X-User-Role == ChannelPartner, X-User-ID equals the distribution_channel_id of the Booking (or of the Booking that owns the AncillaryOffer or SeatAssignment) the request targets"
    error_id: ERR_CHANNEL_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /bookings, POST /bookings/{booking_id}/disclosure, POST /bookings/{booking_id}/disclosure-ack, POST /bookings/{booking_id}/ticket, POST /bookings/{booking_id}/change-open, POST /bookings/{booking_id}/change-settle, POST /bookings/{booking_id}/cancel, POST /bookings/{booking_id}/offer-sessions, POST /bookings/{booking_id}/seat-assignments, POST /ancillary-offers/{offer_id}/accept, POST /ancillary-offers/{offer_id}/decline, POST /seat-assignments/{assignment_id}/release; and on the reads GET /bookings/{id}, GET /ancillary-offers/{id}, GET /seat-assignments/{id}, where a row belonging to another channel is refused with this error, while the list endpoints GET /bookings, GET /ancillary-offers and GET /seat-assignments silently filter the result set to the acting partner's own channel instead of erroring"
  - priority: 7
    category: business_safety
    check: "the acting PricingApprover's X-User-ID differs from FareFamily.design_owner_user_id: the analyst who designed a family may never record its review decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fare-families/{family_id}/review-decision"
  - priority: 8
    category: state
    check: "FareFamily.status is the from-state the requested action declares: DRAFT for submit, IN_REVIEW for review-decision, DRAFT for the upsell re-parent PATCH /fare-families/{family_id}, and a status from which the requested target_status is reachable for status-change (PUBLISHED -> SUSPENDED|RETIRED, SUSPENDED -> PUBLISHED|RETIRED; every other pair is rejected)"
    error_id: ERR_FAMILY_STATE_INVALID
    http_status: 409
    applies_to: "POST /fare-families/{family_id}/submit, POST /fare-families/{family_id}/review-decision, POST /fare-families/{family_id}/status-change, PATCH /fare-families/{family_id}, PATCH /family-attributes/{attribute_id}, POST /fare-families/{family_id}/attributes"
  - priority: 9
    category: state
    check: "Booking.booking_status is a legal from-state for the requested action: HELD for disclosure/ticket, PENDING_ACK-carrying HELD for disclosure-ack, TICKETED for change-open, CHANGE_PENDING for change-settle, {HELD, TICKETED, CHANGE_PENDING} for cancel and seat-assignments, {HELD, TICKETED} for offer-sessions and offer accept"
    error_id: ERR_BOOKING_STATE_INVALID
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/disclosure, POST /bookings/{booking_id}/disclosure-ack, POST /bookings/{booking_id}/ticket, POST /bookings/{booking_id}/change-open, POST /bookings/{booking_id}/change-settle, POST /bookings/{booking_id}/cancel, POST /bookings/{booking_id}/seat-assignments, POST /bookings/{booking_id}/offer-sessions, POST /ancillary-offers/{offer_id}/accept"
  - priority: 10
    category: state
    check: "Booking.disclosure_state == PENDING_ACK when acknowledging a disclosure"
    error_id: ERR_DISCLOSURE_STATE_INVALID
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/disclosure-ack"
  - priority: 11
    category: state
    check: "AncillaryOffer.offer_status == PRESENTED when accepting or declining"
    error_id: ERR_OFFER_STATE_INVALID
    http_status: 409
    applies_to: "POST /ancillary-offers/{offer_id}/accept, POST /ancillary-offers/{offer_id}/decline"
  - priority: 12
    category: state
    check: "SeatAssignment.assignment_state IN {HELD, CONFIRMED} when releasing"
    error_id: ERR_SEAT_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /seat-assignments/{assignment_id}/release"
  - priority: 13
    category: state
    check: "IropsWaiver.waiver_state == ACTIVE when rescinding"
    error_id: ERR_WAIVER_STATE_INVALID
    http_status: 409
    applies_to: "POST /irops-waivers/{waiver_id}/rescind"
  - priority: 14
    category: state
    check: "ChannelPublication.parity_state == OUT_OF_PARITY when resyncing"
    error_id: ERR_PUBLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /channel-publications/{publication_id}/resync"
  - priority: 15
    category: state
    check: "target_phase is exactly the next phase in PRESALE -> CHECKIN_OPEN -> BOARDING -> DEPARTED; skipping a phase or moving backwards is rejected"
    error_id: ERR_PHASE_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /flights/{flight_id}/phase-advance"
  - priority: 16
    category: state
    check: "Flight.sales_phase != DEPARTED for every write that touches the flight's inventory, waivers, bookings or seats. POST /bookings/{booking_id}/seat-assignments is deliberately NOT in scope here: departure closes every segment of the flight, so that request is refused by the more specific segment-closed check at priority 17 instead"
    error_id: ERR_FLIGHT_ALREADY_DEPARTED
    http_status: 409
    applies_to: "POST /seat-segments, POST /flights/{flight_id}/demand-snapshot, POST /flights/{flight_id}/irops-waivers, POST /irops-waivers/{waiver_id}/rescind, POST /bookings, POST /bookings/{booking_id}/change-open, POST /seat-assignments/{assignment_id}/release"
  - priority: 17
    category: state
    check: "SeatInventorySegment.segment_state == OPEN when a seat on it is assigned"
    error_id: ERR_SEGMENT_CLOSED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/seat-assignments"
  - priority: 18
    category: business_temporal
    check: "the requested touchpoint matches Flight.sales_phase exactly: BOOKING requires PRESALE, CHECKIN requires CHECKIN_OPEN, INFLIGHT requires BOARDING"
    error_id: ERR_TOUCHPOINT_PHASE_MISMATCH
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/offer-sessions"
  - priority: 19
    category: business_temporal
    check: "Flight.sales_phase IN {PRESALE, CHECKIN_OPEN} when a booking is ticketed"
    error_id: ERR_FLIGHT_SALES_PHASE_CLOSED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket"
  - priority: 20
    category: business_temporal
    check: "AncillaryOffer.valid_from <= logical clock < AncillaryOffer.valid_until; the window is half-open, so a clock exactly equal to valid_until is closed"
    error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /ancillary-offers/{offer_id}/accept, POST /ancillary-offers/{offer_id}/decline"
  - priority: 21
    category: state
    check: "request expected_booking_version equals Booking.version (optimistic concurrency, rule offer-accept-stale-booking)"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /ancillary-offers/{offer_id}/accept"
  - priority: 22
    category: state
    check: "request expected_fare_family_version equals FareFamily.version (optimistic concurrency, rule publication-create-stale-family)"
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412
    applies_to: "POST /channel-publications"
  - priority: 23
    category: business_referential
    check: "FareFamily.status == PUBLISHED when a booking on that family is ticketed and when a publication of that family is resynced"
    error_id: ERR_FAMILY_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket, POST /channel-publications/{publication_id}/resync"
  - priority: 24
    category: business_safety
    check: "Flight.irops_state != IRREGULAR when a booking on that flight is ticketed: no new sale may be closed while irregular operations are open"
    error_id: ERR_IROPS_SALES_BLOCKED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket"
  - priority: 25
    category: business_safety
    check: "Booking.disclosure_state NOT IN {NOT_ISSUED, PENDING_ACK} when a booking is ticketed: the passenger must have acknowledged the point-of-sale fee disclosure"
    error_id: ERR_FEE_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /bookings/{booking_id}/ticket"
  - priority: 26
    category: business_safety
    check: "Booking.disclosure_state != STALE and Booking.disclosed_fee_fingerprint equals the live FareFamily.fee_fingerprint when a booking is ticketed"
    error_id: ERR_FEE_DISCLOSURE_STALE
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket"
  - priority: 27
    category: business_safety
    check: "request acknowledged_fee_fingerprint equals Booking.disclosed_fee_fingerprint byte-for-byte"
    error_id: ERR_DISCLOSURE_FINGERPRINT_MISMATCH
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/disclosure-ack"
  - priority: 28
    category: business_safety
    check: "every FamilyAttribute of the family with attribute_state == ACTIVE and inclusion == CHARGEABLE references an AncillaryProduct with disclosable_fee == true: an undisclosable chargeable fee may not be sold at the point of sale"
    error_id: ERR_UNDISCLOSED_FEE_CATEGORY
    http_status: 422
    applies_to: "POST /bookings/{booking_id}/disclosure"
  - priority: 29
    category: business_referential
    check: "a ChannelPublication with the booking's fare_family_id and distribution_channel_id and parity_state == IN_PARITY exists when the booking is ticketed"
    error_id: ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket"
  - priority: 30
    category: business_referential
    check: "DistributionChannel.content_parity_status == COMPLIANT when a booking on that channel is ticketed and when an offer on that channel is accepted"
    error_id: ERR_CHANNEL_CONTENT_PARITY_BREACH
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/ticket, POST /ancillary-offers/{offer_id}/accept"
  - priority: 31
    category: business_referential
    check: "every category the request would merchandise or disclose is a member of DistributionChannel.supported_categories: the CHARGEABLE attribute categories at disclosure, every requested_product_ids category at an offer session, and the offered product's category at acceptance"
    error_id: ERR_CHANNEL_CATEGORY_UNSUPPORTED
    http_status: 422
    applies_to: "POST /bookings/{booking_id}/disclosure, POST /bookings/{booking_id}/offer-sessions, POST /ancillary-offers/{offer_id}/accept"
  - priority: 32
    category: business_constraint
    check: "each natural key is unique across all stored rows, with its own error id: AncillaryProduct.sku -> ERR_DUPLICATE_SKU, FareFamily.code -> ERR_DUPLICATE_FAMILY_CODE, DistributionChannel.channel_code -> ERR_DUPLICATE_CHANNEL_CODE"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /ancillary-products, POST /fare-families, POST /distribution-channels"
  - priority: 33
    category: business_constraint
    check: "Booking.record_locator is unique across all stored bookings, including CANCELLED and FLOWN ones"
    error_id: ERR_DUPLICATE_RECORD_LOCATOR
    http_status: 409
    applies_to: "POST /bookings"
  - priority: 34
    category: business_constraint
    check: "at most one FamilyAttribute per (fare_family_id, ancillary_product_id) pair with attribute_state == ACTIVE"
    error_id: ERR_ATTRIBUTE_DUPLICATE_PRODUCT
    http_status: 409
    applies_to: "POST /fare-families/{family_id}/attributes"
  - priority: 35
    category: business_constraint
    check: "at most one ChannelPublication per (fare_family_id, distribution_channel_id) pair with parity_state IN {PENDING, IN_PARITY, OUT_OF_PARITY}"
    error_id: ERR_DUPLICATE_PUBLICATION
    http_status: 409
    applies_to: "POST /channel-publications"
  - priority: 36
    category: business_constraint
    check: "included_quantity >= 1 when inclusion == INCLUDED and included_quantity == 0 when inclusion == CHARGEABLE, both at creation and after a PATCH"
    error_id: ERR_INVALID_ATTRIBUTE_QUANTITY
    http_status: 422
    applies_to: "POST /fare-families/{family_id}/attributes, PATCH /family-attributes/{attribute_id}"
  - priority: 37
    category: business_constraint
    check: "following upsell_parent_family_id from the family being created or updated never revisits a family already on the path: the upsell chain must stay acyclic. At creation only an unknown parent can fail (priority 5), so the cycle is provoked by re-parenting an existing DRAFT family through PATCH /fare-families/{family_id}"
    error_id: ERR_UPSELL_CYCLE_DETECTED
    http_status: 422
    applies_to: "POST /fare-families, PATCH /fare-families/{family_id}"
  - priority: 38
    category: business_referential
    check: "the AncillaryProduct referenced by a seat segment has category == SEAT"
    error_id: ERR_SEAT_PRODUCT_CATEGORY_INVALID
    http_status: 422
    applies_to: "POST /seat-segments"
  - priority: 39
    category: business_constraint
    check: "the new segment's rectangle (rows [row_start, row_end] closed, crossed with seat_letters) shares no seat with any existing SeatInventorySegment on the same flight whose segment_state == OPEN; touching row ranges with disjoint letters and adjacent-but-disjoint row ranges are both allowed"
    error_id: ERR_SEAT_SEGMENT_ROW_OVERLAP
    http_status: 409
    applies_to: "POST /seat-segments"
  - priority: 40
    category: business_constraint
    check: "the sum of total_seats over every SeatInventorySegment of the flight, including the one being created, is <= Flight.cabin_seat_total"
    error_id: ERR_SEGMENT_EXCEEDS_CABIN
    http_status: 422
    applies_to: "POST /seat-segments"
  - priority: 41
    category: business_constraint
    check: "the requested row satisfies segment.row_start <= row <= segment.row_end and the requested seat_letter is a member of segment.seat_letters"
    error_id: ERR_SEAT_ROW_OUT_OF_SEGMENT
    http_status: 422
    applies_to: "POST /bookings/{booking_id}/seat-assignments"
  - priority: 42
    category: business_fiscal
    check: "SeatInventorySegment.available_seats >= 1 at the instant a seat on it is assigned. This aggregate capacity check is deliberately ordered BEFORE the point-occupancy check at priority 47, so a request against a fully held or fully sold segment answers with the capacity error rather than with the occupancy error"
    error_id: ERR_SEAT_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/seat-assignments"
  - priority: 43
    category: business_temporal
    check: "when the request supplies requested_product_ids, none of those products has an AncillaryOffer on this booking with offer_status == DECLINED whose updated_at + OFFER_COOLOFF_MINUTES is strictly greater than the logical clock. Products not named in requested_product_ids are silently filtered out of the candidate pool instead of raising this error"
    error_id: ERR_OFFER_COOLOFF_CONFLICT
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/offer-sessions"
  - priority: 44
    category: business_constraint
    check: "delay_minutes >= IROPS_CHANGE_WAIVER_MIN_DELAY_MINUTES when event_type == DELAY and CHANGE is a member of waiver_scope"
    error_id: ERR_DELAY_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /flights/{flight_id}/irops-waivers"
  - priority: 45
    category: business_constraint
    check: "the family has at least one FamilyAttribute with attribute_state == ACTIVE when it is submitted for review"
    error_id: ERR_FAMILY_HAS_NO_ATTRIBUTES
    http_status: 422
    applies_to: "POST /fare-families/{family_id}/submit"
  - priority: 46
    category: business_constraint
    check: "no Booking with this fare_family_id has booking_status IN {HELD, TICKETED, CHANGE_PENDING} when the family is retired"
    error_id: ERR_FAMILY_HAS_LIVE_BOOKINGS
    http_status: 409
    applies_to: "POST /fare-families/{family_id}/status-change"
  - priority: 47
    category: business_constraint
    check: "no SeatAssignment with assignment_state IN {HELD, CONFIRMED} already occupies the same (seat_inventory_segment_id, row, seat_letter) triple; reached only once the segment still has available_seats >= 1 per priority 42"
    error_id: ERR_SEAT_ALREADY_OCCUPIED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/seat-assignments"
  - priority: 48
    category: business_fiscal
    check: "AncillaryOffer.offered_price_cents <= DistributionChannel.max_ancillary_price_cents at acceptance; the ceiling is deliberately NOT applied when the offer is priced, so an unsellable price can be presented and then refused"
    error_id: ERR_OFFER_PRICE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ancillary-offers/{offer_id}/accept"
  - priority: 49
    category: business_fiscal
    check: "FareFamily.bundle_price_cents <= a_la_carte_total_cents recomputed from the family's ACTIVE attributes; a bundle that costs more than buying every component a la carte may not be submitted for review"
    error_id: ERR_BUNDLE_DISCOUNT_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /fare-families/{family_id}/submit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (api_prefix is "", so every path is top-level;
# every path parameter is named {id})
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time. Every PRESENTED AncillaryOffer whose valid_until <= the new clock value is swept to EXPIRED by this call."
    roles: [MerchandisingAnalyst, PricingApprover, DistributionManager, OperationsController, RevenueAccountant, ChannelPartner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_offer_count: integer }"
    side_effects:
      - "every AncillaryOffer with offer_status == PRESENTED and valid_until <= the new clock transitions to EXPIRED"

  - method: POST
    path: "/ancillary-products"
    description: "Create a merchandising catalog product."
    roles: [MerchandisingAnalyst]
    code: 201
