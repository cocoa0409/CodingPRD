  - rule_id: compensating_invariant
    instances:

      - name: claim_void_restores_the_unit_partition_and_undoes_the_cooperation_credit
        grounds:
          - state_machines.RemedyClaim.side_effects
          - calculations.recall_unit_ledger
          - entities.Recall.fields.units_corrected
          - entities.Recall.fields.units_outstanding
          - entities.Recall.fields.effectiveness_flag
          - entities.CivilPenaltyCase.fields.cooperation_bonus_applied
          - endpoints["POST /product-safety/remedy-claims/{id}/void"]
        distinguishing_aspect: |
          Conserved quantity: a COUNT of physical units, partitioned as
          units_corrected + units_outstanding == units_in_commerce == 100. Voiding
          a FULFILLED claim must reverse all four links of the
          claim_fulfilment_credit cascade exactly: 30 units return to outstanding,
          effectiveness_flag falls back from MET to PENDING, and the penalty case
          gives back the cooperation bonus so the preview re-prices from 4400000
          to 4675000. The invariant is what catches a partial undo — an
          implementation that decrements units_corrected but forgets to increment
          units_outstanding still shows units_corrected 0 and only fails the sum.
        test_recipe:
          setup:
            - "a Recall in MONITORING with units_in_commerce 100 and a CivilPenaltyCase assessed at 5500000"
            - "one REFUND RemedyClaim for quantity 30 taken all the way to FULFILLED, so the ledger reads 30 / 70, effectiveness_flag is MET, cooperation_bonus_applied is true and the preview is 4400000"
            - "no ProgressReport has been accepted, so the reversal target for effectiveness_flag is PENDING rather than SHORTFALL"
