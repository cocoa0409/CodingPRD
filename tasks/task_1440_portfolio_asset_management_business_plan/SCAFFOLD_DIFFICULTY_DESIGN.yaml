      - name: plan_state_conflict_beats_cadence_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_PLAN_NOT_APPROVED]
          - errors[ERR_REFORECAST_CADENCE]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a reforecast created against a
          DRAFT plan in a non-cadence month violates both rules; state (priority 5) MUST win
          over temporal (priority 10) with ERR_PLAN_NOT_APPROVED.
        test_recipe:
          setup:
            - "FY2027 plan in DRAFT (never submitted); clock at 2027-02-10 (fiscal month 2, not in {4,7,10})"
          setup_api_calls:
