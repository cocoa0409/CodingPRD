              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-08-02T00:00:00Z", payable_date: "2026-08-03T00:00:00Z", amount_per_share_millicents: 25000 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgentAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /escheatment/scan"
              payload: {}
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
              captures: { pay: "$.data[0].id" }
            - call: "GET /accounts/${acct}"
              as: AgentAdmin
            - call: "GET /escheatment-cases?account_id=${acct}"
              as: ComplianceOfficer
          assert:
            - "hop1: DividendPayment.${pay}.status == STALE_DATED (disbursed 2026-08-03 + 180 days = 2027-01-30 < 2029-08-01)"
            - "hop2: ShareholderAccount.${acct}.stale_dividend_cents == 250 (payment gross)"
            - "hop2: ShareholderAccount.${acct}.account_status == DORMANT"
            - "hop3: exactly one EscheatmentCase exists for the account with status == IDENTIFIED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_beats_sod_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.TransferRequest.MEDALLION_VERIFIED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the approve call violates BOTH the
          from-state rule (transfer is UNDER_REVIEW, not MEDALLION_VERIFIED) AND segregation of
          duties (approver id equals last_examiner_id). Priority 5 state must win over priority 6
          safety: the response is ERR_INVALID_STATE, not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Issuer outstanding 100; accounts A (100 book) and B; transfer of 50 shares UNDER_REVIEW"
            - "Examiner exam_1 flagged it deficient; deficiency cured back to UNDER_REVIEW, leaving last_examiner_id == exam_1"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Kappa Inc", cusip: "000000010", ticker: "KAPA", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
