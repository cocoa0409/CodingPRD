      - name: vendor_schedule_blocked_by_expired_coi_then_unblocked_by_renewal
        grounds:
          - state_machines.VendorAssignment.status.ACCEPTED_to_SCHEDULED
          - calculations.vendor_coi_validity
          - validations[priority=44]
          - errors[ERR_VENDOR_COI_EXPIRED]
          - entities.Vendor.fields.coi_expires_on
        distinguishing_aspect: |
          A different entity pair, VendorAssignment to Vendor: the assignment is in
          the correct ACCEPTED from-state but cannot reach SCHEDULED while the
          vendor's coi_expires_on of 2026-06-10 precedes the service_date of
          2026-06-15; renewing the vendor's COI to 2026-07-31 makes the identical
          request succeed.
        test_recipe:
          setup:
            - "A CLEANING vendor whose COI expires on 2026-06-10."
            - "A CLEANING vendor assignment for service_date 2026-06-15 that the vendor has already accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /vendors"
              payload: { name: "Bright Path Cleaning", vendor_type: "CLEANING", coi_expires_on: "2026-06-10", daily_capacity: 3, holdback_pct: 0.10 }
              as: PLATFORM_ADMIN
              captures: { vc: "$.data.id" }
            - call: "POST /vendor-assignments"
              payload: { engagement_id: "${eng}", vendor_id: "${vc}", service_kind: "CLEANING", service_date: "2026-06-15", quoted_cents: 85000 }
              as: MOVE_MANAGER
              captures: { va: "$.data.id" }
            - call: "POST /vendor-assignments/${va}/accept"
              payload: {}
              as: VENDOR
              as_user_id: "${vc}"
          trigger:
            - call: "POST /vendor-assignments/${va}/schedule"
              payload: {}
              as: MOVE_MANAGER
              captures: { err5: "$.data.error_id" }
            - call: "POST /vendors/${vc}/renew-coi"
              payload: { coi_expires_on: "2026-07-31" }
              as: VENDOR
              as_user_id: "${vc}"
            - call: "POST /vendor-assignments/${va}/schedule"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "the first trigger call responds 422 and ${err5} == ERR_VENDOR_COI_EXPIRED"
            - "after the first trigger call, VendorAssignment.${va}.status == ACCEPTED"
            - "VendorAssignment.${va}.holdback_cents == 8500"
            - "Vendor.${vc}.coi_renewal_count == 1"
            - "Vendor.${vc}.coi_expires_on == 2026-07-31"
            - "VendorAssignment.${va}.status == SCHEDULED"

      - name: invoice_version_bumped_by_a_vendor_cascade_defeats_the_manual_adjustment
        grounds:
          - concurrency_rules[invoice-line-create-stale-invoice]
          - validations[priority=66]
          - errors[ERR_STALE_INVOICE_VERSION]
          - state_machines.VendorAssignment.status.SCHEDULED_to_PERFORMED
          - calculations.vendor_payout
          - calculations.invoice_subtotal
        distinguishing_aspect: |
          A third entity pair, Invoice depending on VendorAssignment: nothing the
          billing admin did invalidated its own read, yet the vendor's perform
          transition appended a VENDOR_PASSTHROUGH line and bumped Invoice.version, so
          the manual adjustment carrying the pre-perform version is refused with 412
          ERR_STALE_INVOICE_VERSION and the ledger still holds exactly one line at
          subtotal 85000; re-reading the invoice and resubmitting the identical body
          succeeds and moves the subtotal to 90000.
        test_recipe:
          setup:
            - "An HOURLY STUDIO engagement whose invoice is still DRAFT and carries no lines at all."
            - "A CLEANING vendor with holdback_pct 0.10 holding a SCHEDULED assignment for service_date 2026-06-16 quoted at 85000, so holdback_cents is 8500."
            - "The billing admin has read the invoice and holds its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
