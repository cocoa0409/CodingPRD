  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency across DIFFERENT entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_issue_gated_by_authority_posture
        grounds:
          - state_machines.EnrollmentNotice.DRAFT_to_ISSUED
          - state_machines.Authority
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair EnrollmentNotice -> Authority: the DRAFT->ISSUED transition's
          preconditions read Authority.status and the existence of an ADOPTED default
          product/schedule; issuing while the Authority is SUSPENDED must fail even
          though the notice itself is in a valid from-state.
        test_recipe:
          setup:
            - "Authority ACTIVE then SUSPENDED (no ENROLLING wave, so suspend is legal)"
            - "Notice N1 in DRAFT"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
