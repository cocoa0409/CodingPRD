          ROOM_TURNOVER_BUFFER_MINUTES = 15 on each side, so a request starting 15 minutes after the
          existing end (10:15 against a 10:00 end) still collides and only 10:16 clears. An
          implementation using half-open or unpadded comparison accepts the 10:15 booking.
