            - "LessonPlan.${lp_id}.contact_hours == 2.50"
            - "the second POST /course-sessions/${cs1_id}/deliver -> 422 ERR_LESSON_PLAN_NOT_APPROVED (pinned_lesson_plan_revision 1 != approved_revision_number 2)"
            - "CourseSession.${cs1_id}.status == SCHEDULED"
            - "CourseSession.${cs1_id}.pinned_lesson_plan_revision == 1  # never re-pointed at the new revision"
            - "${cs2_pin} == 2"
            - "POST /course-sessions/${cs2_id}/deliver -> 200; CourseSession.${cs2_id}.status == DELIVERED"
            - "AcademyClass.${class_id}.status == IN_SESSION  # first delivered session of the class"
