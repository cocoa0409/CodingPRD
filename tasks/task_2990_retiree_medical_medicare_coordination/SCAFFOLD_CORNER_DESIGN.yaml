        grounds:
          - validations[priority=25]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: |
          Role authority is not enough: analyst-01 holds EligibilityAnalyst,
          which IS permitted to certify, yet certifying the determination it
          created is refused with 403 ERR_SEGREGATION_OF_DUTIES rather than
          ERR_UNAUTHORIZED. A second holder of the same role succeeds
          immediately afterwards, proving the check keys on X-User-ID and not on
          X-User-Role. The same separation covers appeal-decision, where the
          ComplianceOfficer who never touched the record may decide.
        test_recipe:
