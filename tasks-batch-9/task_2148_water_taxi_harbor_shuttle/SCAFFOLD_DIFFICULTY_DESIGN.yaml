            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-14", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
