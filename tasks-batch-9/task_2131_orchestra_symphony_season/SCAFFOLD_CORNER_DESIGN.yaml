  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_missing_auth_headers_returns_unauthenticated
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role is not one of the seven declared roles is rejected with ERR_UNAUTHENTICATED (401) before any authorization or existence check runs."
        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
          trigger:
            - call: "GET /orchestra/seasons/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"
            - "${err} != ERR_SEASON_NOT_FOUND  (authentication outranks existence)"

      - name: patron_cannot_create_concert_returns_unauthorized
        claim_type: Role denial
        grounds: ["roles.Patron", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /orchestra/concerts is exclusive to ArtisticAdmin, so a Patron receives ERR_UNAUTHORIZED (403) and no concert is created."
        test_recipe:
          setup: ["A season, a venue and a registered patron exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { pN: "$.data.id" }
          trigger:
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Patron Concert", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: Patron
              as_user_id: "${pN}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP status == 403"
            - "GET /orchestra/concerts?season_id=${s1} returns total_count == 0"

      - name: artistic_admin_cannot_add_musician_returns_unauthorized
        claim_type: Role denial
        grounds: ["roles.OrchestraManager", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Roster management is exclusive to OrchestraManager under the peer-role model, so even ArtisticAdmin is refused with ERR_UNAUTHORIZED (403) — there is no admin superset."
        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
