              payload: { refund_reason: "Donor requested reversal." }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /contributions/${c2}/refund"
              payload: { refund_reason: "Donor requested reversal." }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "GET /members/${m_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: 409 with data.error_id == ERR_REFUND_WINDOW_CLOSED and c1 stays settlement_status SETTLED / acknowledgment_status DISCLOSED"
            - "trigger[1]: 200 with settlement_status == REFUNDED and acknowledgment_status still RECEIPTED"
            - "trigger[2]: lifetime_giving_cents == 2500 - only the refunded row left the SETTLED set"

      - name: val_award_amount_must_be_within_the_request_and_inside_the_period
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_AWARD_AMOUNT_INVALID]
          - state_machines.GrantProposal.SUBMITTED_to_AWARDED
        distinguishing_aspect: >-
          One error code covers both halves of the outcome check: 350001 against a
          350000-cent request and a 2027-08-01 award date one day past the period end are
          each refused, and both must be fixed before the award lands.
        test_recipe:
          setup: "A SUBMITTED unrestricted proposal for 350000 cents in a period running 2026-08-01..2027-07-31."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: user-ed-1
            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "General operating support", requested_amount_cents: 350000, restriction_type: "UNRESTRICTED" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /grant-proposals/${gp_id}/internal-review"
              payload: { decision: "CLEAR" }
              as: EditorialDirector
              as_user_id: user-ed-1
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
            - call: "POST /grant-proposals/${gp_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350001, award_date: "2026-08-01" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /grant-proposals/${gp_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350000, award_date: "2027-08-01" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id2: "$.data.error_id" }
            - call: "POST /grant-proposals/${gp_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350000, award_date: "2027-07-31" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: 409 with data.error_id == ERR_AWARD_AMOUNT_INVALID and status stays SUBMITTED"
            - "trigger[1]: 409 with data.error_id == ERR_AWARD_AMOUNT_INVALID (2027-08-01 is outside the period)"
            - "trigger[2]: 200 with status == AWARDED, awarded_amount_cents == 350000, award_date == 2027-07-31, report_count == 0, unreleased_cents == 350000"

      - name: val_duplicate_benefit_code_within_one_tier_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=43]
          - errors[ERR_BENEFIT_CODE_DUPLICATE]
          - entities.MembershipTier.fields.benefits
        distinguishing_aspect: >-
          Uniqueness is enforced on benefit_code alone, so two entries sharing the code TOTE
          are refused even though their fulfillment_type and fair market value differ.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON"
                name: "Patron"
                renewal_cadence: "ANNUAL"
                contribution_amount_cents: 30000
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "TOTE_BAG", annual_fair_market_value_cents: 1200 }
                  - { benefit_code: "TOTE", fulfillment_type: "MERCH_DISCOUNT", annual_fair_market_value_cents: 900 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON"
                name: "Patron"
                renewal_cadence: "ANNUAL"
                contribution_amount_cents: 30000
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "TOTE_BAG", annual_fair_market_value_cents: 1200 }
                  - { benefit_code: "DISCOUNT", fulfillment_type: "MERCH_DISCOUNT", annual_fair_market_value_cents: 900 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: 409 with data.error_id == ERR_BENEFIT_CODE_DUPLICATE and no tier row is created"
            - "trigger[1]: 201 with benefit_count == 2, quid_pro_quo_per_period_cents == 2100 (threshold 600, both benefits substantial), insubstantial_benefit_codes == []"

