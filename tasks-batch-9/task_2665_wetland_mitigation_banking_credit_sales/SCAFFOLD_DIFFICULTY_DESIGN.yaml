  - rule_id: transitive_cascade
    instances:

      - name: failed_year3_review_cascades_five_hops_to_sale_cancellation
        grounds:
          - state_machines.MonitoringReport.SUBMITTED_to_ACCEPTED
          - state_machines.ReleaseMilestone.CLAIMED_to_DEFERRED
          - state_machines.CreditSale.RESERVED_to_CANCELLED
          - calculations.credit_sales_posture
          - calculations.credit_ledger_balance
          - entities.RemedialAction.fields.held_credits
        distinguishing_aspect: |
          FIVE-HOP CHAIN triggered by one review call, with an ORDER-SENSITIVE ledger: (1) the report's
          compliance dimension becomes FAIL, (2) a RemedialAction OPEN is created, (3) the bank's
          sales_posture is recomputed to RESTRICTED, (4) because the posture is RESTRICTED the RESERVED
          sale is cancelled and its 4.00-credit hold is RELEASED, and only then (5) the earliest
          non-terminal milestone is DEFERRED and freezes credits_released - credits_sold = 14.82. Hops
          4 and 5 must run in that order: freezing before releasing the sale hold would compute a
          14.82 freeze against a 10.82 available balance and drive credits_available negative. The
          other transitive_cascade instance runs the recovery direction and is only three hops deep.
