scenario: |
  2945. Neighborhood Fiber Build & Preorder Campaign (Google Fiber fiberhood program): service-area
  segmentation into build zones with preregistration thresholds, campaign deadline extension and
  threshold adjustment rules, construction sequencing by permit and pole-attachment readiness,
  address serviceability determination and multi-dwelling-unit owner agreement, install appointment
  scheduling with drop-bury and restoration follow-up, deposit collection, refund and
  preorder-to-order conversion, unserved-address exception and alternative technology fallback,
  construction damage claims to lawns and utilities

domain_name: neighborhood-fiber-build-preorder-campaign
api_prefix: "/"

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every URL path is a top-level collection
  # (`/preorders/{id}`), never a nested ownership chain (`/build-zones/{id}/preorders/{id}`).
  # Sub-resource paths appear only for server-side action endpoints and for the fallback-offer
  # creation endpoint whose parent supplies the selector's scope.

  state_machine_shape: parallel
  # Two entities carry independent parallel state dimensions on one row
  # (BuildZone.campaign_status x BuildZone.construction_status;
  #  Preorder.preorder_status x Preorder.deposit_status), and three entities carry cycles
  # (MduOwnerAgreement SENT->COUNTERED->SENT, PermitApplication REJECTED->SUBMITTED,
  #  DamageClaim DENIED->UNDER_ASSESSMENT). PoleAttachmentRequest is a branching fork whose
  #  ACCEPTED and DENIED branches carry disjoint side-effect sets.

  relationship_patterns:
    - one_to_many          # Campaign->BuildZone, BuildZone->ServiceAddress/Preorder/PermitApplication
    - self_referential     # InstallAppointment.parent_appointment_id -> InstallAppointment.id
    - cross_aggregate      # DamageClaim references InstallAppointment, ServiceAddress and Account
    - polymorphic          # LedgerEntry attaches to a Preorder or to a DamageClaim (exactly one set)

  role_model: segregation_of_duties
  # ClaimsAssessor prices a damage claim; ClaimsApprover decides it and MUST NOT be the same
  # X-User-ID that recorded the assessment. Layered on peer-role ownership: PermitOffice owns
  # permit decisions, UtilityOperator owns pole-attachment progress, MduOwner owns agreement
  # responses, InstallCoordinator owns appointments, Subscriber owns its own preorders/claims.

  consistency_model: immediate
  # Every derived field (zone rates, ledger-backed balances, crew booked minutes, zone posture)
  # is recomputed inside the same request that mutates its source rows.

  difficulty_level: expert_plus
  # Deliberately above the Expert band of SKILL.md 0.4: 14 entities, 65 endpoints, 12 state
  # machines, 8 calculations. The extra surface is read-side (28 of 65 endpoints are GETs that
  # exist to make every FK reverse-reachable and every derived field observable); the mutation
  # surface is 37 endpoints.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: marketing name of the citywide fiber build campaign
        constraints: 1..120 chars, non-blank
      - name: city
        type: string
        source: input
        description: city the campaign covers
        constraints: 1..80 chars
      - name: prereg_window_open_at
        type: datetime
        source: input
        description: instant preregistration opens; preorders are refused before it
        constraints: ISO 8601 UTC, three fractional digits accepted
      - name: prereg_window_close_at
        type: datetime
        source: input
        description: campaign-wide default preregistration close instant; seeds every new BuildZone.prereg_deadline_at
        constraints: must be strictly after prereg_window_open_at
      - name: default_threshold_pct
        type: number
        source: input
        description: default preregistration rate percentage a zone must reach to qualify
        constraints: 0.01..100.00, exactly 2 decimal places
      - name: deposit_amount_cents
        type: integer
        source: input
        description: refundable preorder deposit every Preorder in this campaign must remit
        constraints: '>= 0'
      - name: max_deadline_extensions
        type: integer
        source: input
        default: 2
        description: maximum number of deadline extensions any one BuildZone may receive
        constraints: '0..5'
      - name: extension_grant_days
        type: integer
        source: input
        default: 30
        description: whole days each granted extension adds to BuildZone.prereg_deadline_at
        constraints: '1..90'
      - name: claim_filing_window_days
        type: integer
        source: input
        default: 45
        description: whole days after InstallAppointment.completed_at during which a DamageClaim may be filed
        constraints: '1..365'
      - name: restoration_sla_days
        type: integer
        source: input
        default: 7
        description: whole days after InstallAppointment.completed_at by which restoration follow-up must be scheduled
        constraints: '1..60'
      - name: late_filing_factor
        type: number
        source: input
        default: 0.60
        description: multiplier applied by the LATE_FILING_SCHEDULE variant of damage_claim_assessment
        constraints: 0.00..1.00, exactly 2 decimal places
      - name: zone_count
        type: integer
        source: computed
        description: count of BuildZone rows whose campaign_id equals this Campaign.id (no status filter)

  - name: BuildZone
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose window, deposit and policy constants govern this zone
      - name: name
        type: string
        source: input
        description: fiberhood name shown to residents
        constraints: 1..120 chars
      - name: zone_code
        type: string
        source: input
        description: short operator code for the zone
        constraints: 1..16 chars, uppercase alphanumerics and underscore, unique within campaign_id
      - name: household_count
        type: integer
        source: input
        description: denominator of every preregistration-rate calculation; counts single-family homes plus MDU units in the zone
        constraints: '>= 1'
      - name: threshold_pct
        type: number
        source: input
        default: "Campaign.default_threshold_pct of the referenced campaign"
        description: preregistration rate percentage this zone must reach at its deadline to qualify
        constraints: 0.01..100.00, exactly 2 decimal places
      - name: required_permit_types
        type: array
        source: input
        default: ["ROW"]
        description: permit types that must each hold an APPROVED, non-EXPIRED PermitApplication before construction may start
        constraints: non-empty subset of {ROW, TRAFFIC_CONTROL, ENVIRONMENTAL}, no duplicates
      - name: max_concurrent_bury_ops
        type: integer
        source: input
        default: 2
        description: maximum number of SCHEDULED DROP_BURY InstallAppointments in this zone whose raw windows may overlap at any single instant
        constraints: '>= 1'
      - name: prereg_deadline_at
        type: datetime
        source: system
        description: zone-specific preregistration deadline; initialized to Campaign.prereg_window_close_at and advanced by extension_grant_days per granted extension
      - name: extension_count
        type: integer
        source: system
        default: 0
        description: number of deadline extensions granted to this zone
      - name: cumulative_extension_days
        type: integer
        source: system
        default: 0
        description: sum of days added by all granted extensions
      - name: campaign_status
        type: enum
        source: system
        default: PREREG_OPEN
        description: preregistration dimension of this zone's parallel state machine
        constraints: one of {PREREG_OPEN, PREREG_EXTENDED, QUALIFIED, NOT_QUALIFIED}
      - name: construction_status
        type: enum
        source: system
        default: NOT_STARTED
        description: construction dimension of this zone's parallel state machine; evolves independently of campaign_status
        constraints: one of {NOT_STARTED, SEQUENCED, IN_CONSTRUCTION, SUSPENDED, SERVICE_READY}
      - name: suspension_reason
        type: enum
        source: system
        description: why construction_status is SUSPENDED; null whenever construction_status != SUSPENDED
        constraints: null or one of {POLE_DENIED, PERMIT_EXPIRED, MANUAL}
      - name: provisional_qualifying_count
        type: integer
        source: computed
        description: numerator of the PROVISIONAL variant of zone_prereg_rate, recomputed on every preorder/serviceability mutation in this zone
      - name: prereg_rate_pct
        type: number
        source: computed
        description: PROVISIONAL variant output of zone_prereg_rate; live preregistration percentage shown during the campaign
      - name: final_qualifying_count
        type: integer
        source: computed
        description: numerator of the FINAL variant of zone_prereg_rate; null until a qualification run evaluates this zone
      - name: final_rate_pct
        type: number
        source: computed
        description: FINAL variant output of zone_prereg_rate, stamped by the qualification run; null before evaluation
      - name: make_ready_cost_cents
        type: integer
        source: computed
        default: 0
        description: sum of PoleAttachmentRequest.make_ready_cost_cents over this zone's requests whose status is in {ACCEPTED, ATTACHED}
      - name: readiness_score
        type: number
        source: computed
        description: zone_readiness_score output; null until a sequencing run evaluates this zone
      - name: readiness_posture
        type: enum
        source: computed
        description: derived gate over child readiness; BLOCKED when construction_status is NOT_STARTED and no required permit is APPROVED, PERMIT_PENDING when some required permit is not APPROVED, POLE_PENDING when all required permits are APPROVED but no PoleAttachmentRequest is ATTACHED, SUSPENDED when construction_status is SUSPENDED, READY otherwise
        constraints: one of {BLOCKED, PERMIT_PENDING, POLE_PENDING, READY, SUSPENDED}
      - name: build_sequence_index
        type: integer
        source: computed
        description: 1-based construction order among the campaign's QUALIFIED zones assigned by the sequencing run; null when unsequenced
      - name: outstanding_restoration_count
        type: integer
        source: computed
        default: 0
        description: count of InstallAppointment rows reachable through this zone's Preorders with status COMPLETED, restoration_required true and restoration_satisfied_at null

  - name: ServiceAddress
    parent: null
    common_fields: true
    fields:
      - name: build_zone_id
        type: string
        source: input
        description: FK -> BuildZone.id; the zone whose build determines this address's serviceability
      - name: street_address
        type: string
        source: input
        description: full street address; unique within build_zone_id and used as the final deterministic tie-break in make_ready_share_allocation
        constraints: 1..160 chars, unique per build_zone_id
      - name: dwelling_type
        type: enum
        source: input
        description: whether the address is a single-family home or a multi-dwelling unit building
        constraints: one of {SINGLE_FAMILY, MDU}
      - name: unit_count
        type: integer
        source: input
        default: 1
        description: number of dwelling units at this address; must be >= 2 when dwelling_type is MDU and exactly 1 when SINGLE_FAMILY
        constraints: '>= 1'
      - name: distance_to_node_m
        type: integer
        source: input
        description: metres from the address to the nearest aggregation node; eligibility input of the fallback_option_selection candidate filter
        constraints: '>= 0'
      - name: serviceability
        type: enum
        source: system
        default: UNDETERMINED
        description: serviceability determination dimension
        constraints: one of {UNDETERMINED, SERVICEABLE, CONDITIONAL_MDU, NOT_SERVICEABLE}
      - name: not_serviceable_reason
        type: enum
        source: system
        description: why serviceability is NOT_SERVICEABLE; null for every other serviceability value
        constraints: null or one of {NO_ROW_ACCESS, EXCESSIVE_DISTANCE, MDU_AGREEMENT_UNAVAILABLE, BUILD_NOT_QUALIFIED}
      - name: serviceability_determined_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent serviceability change; null while UNDETERMINED
      - name: exception_status
        type: enum
        source: system
        default: NONE
        description: unserved-address exception dimension; evolves independently of serviceability
        constraints: one of {NONE, REQUESTED, GRANTED, DENIED}
      - name: exception_reason
        type: string
        source: input
        description: free-text justification recorded when the exception is REQUESTED; null while exception_status is NONE
        constraints: null or 1..240 chars
      - name: active_fallback_technology
        type: enum
        source: system
        description: technology of the FallbackOffer this address has ACCEPTED; null until an offer is accepted
        constraints: null or one of {FIXED_WIRELESS, DSL_PARTNER, SATELLITE_PARTNER}
      - name: counts_toward_threshold
        type: boolean
        source: computed
        description: true when this address satisfies the FINAL-variant inclusion predicate of zone_prereg_rate (serviceability SERVICEABLE, or CONDITIONAL_MDU with a SIGNED MduOwnerAgreement)

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: person or organization name
        constraints: 1..120 chars
      - name: email
        type: string
        source: input
        description: contact email; unique across accounts
        constraints: unique, must contain '@'
      - name: phone
        type: string
        source: input
        description: contact phone number
        constraints: 1..32 chars
      - name: account_type
        type: enum
        source: input
        description: which party this account acts as
        constraints: one of {RESIDENT, PROPERTY_OWNER, BUSINESS}
      - name: deposit_held_cents
        type: integer
        source: computed
        default: 0
        description: signed sum of LedgerEntry.amount_cents for this account over entry_type in {DEPOSIT_HELD, DEPOSIT_REFUNDED, DEPOSIT_APPLIED, DEPOSIT_FORFEITED}
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: signed sum of LedgerEntry.amount_cents for this account over entry_type in {CLAIM_PAYOUT}

  - name: MduOwnerAgreement
    parent: null
    common_fields: true
    fields:
      - name: service_address_id
        type: string
        source: input
        description: FK -> ServiceAddress.id; the MDU building this agreement grants access to
      - name: owner_account_id
        type: string
        source: input
        description: FK -> Account.id; the property owner who may counter, sign or decline; the MduOwner role's X-User-ID must equal this value
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: negotiation state; SENT and COUNTERED alternate for as many rounds as max_counter_rounds allows
        constraints: one of {DRAFT, SENT, COUNTERED, SIGNED, DECLINED, EXPIRED}
      - name: access_fee_cents
        type: integer
        source: input
        description: monthly building-access fee currently offered by the operator
        constraints: '>= 0'
      - name: countered_fee_cents
        type: integer
        source: system
        description: fee the owner last countered with; null until the first counter
      - name: offer_round
        type: integer
        source: system
        default: 0
        description: number of operator offers sent (increments on every DRAFT->SENT and COUNTERED->SENT transition)
      - name: counter_round
        type: integer
        source: system
        default: 0
        description: number of owner counters recorded; bounded by max_counter_rounds
      - name: max_counter_rounds
        type: integer
        source: input
        default: 2
        description: maximum owner counters permitted before further counters are refused
        constraints: '0..5'
      - name: expires_at
        type: datetime
        source: input
        description: instant at or after which a SENT or COUNTERED agreement lazily transitions to EXPIRED
      - name: signed_at
        type: datetime
        source: system
        description: logical-clock instant the owner signed; null unless status is SIGNED

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: build_zone_id
        type: string
        source: input
        description: FK -> BuildZone.id; the zone this permit authorizes construction in
      - name: permit_type
        type: enum
        source: input
        description: which authority the permit is drawn against
        constraints: one of {ROW, TRAFFIC_CONTROL, ENVIRONMENTAL}
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: review state; REJECTED returns to SUBMITTED on resubmission
        constraints: one of {DRAFT, SUBMITTED, APPROVED, REJECTED, EXPIRED}
      - name: submission_round
        type: integer
        source: system
        default: 0
        description: number of times this application has been submitted; the first submission is round 1
      - name: max_resubmissions
        type: integer
        source: input
        default: 2
        description: maximum number of resubmissions after a rejection
        constraints: '0..5'
      - name: valid_days
        type: integer
        source: input
        default: 120
        description: whole days an approval remains valid; sets expires_at at approval
        constraints: '1..730'
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of approval; null unless the permit has ever been APPROVED
      - name: expires_at
        type: datetime
        source: system
        description: approved_at plus valid_days; null until approval
      - name: rejection_reason
        type: string
        source: input
        description: reviewer note captured on rejection; null unless the last decision was a rejection
        constraints: null or 1..240 chars
      - name: reviewer_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PermitOffice operator who recorded the last decision

  - name: PoleAttachmentRequest
    parent: null
    common_fields: true
    fields:
      - name: build_zone_id
        type: string
        source: input
        description: FK -> BuildZone.id; the zone whose aerial route needs pole attachments
      - name: utility_owner
        type: string
        source: input
        description: name of the pole-owning utility
        constraints: 1..120 chars
      - name: pole_count
        type: integer
        source: input
        description: number of poles in the attachment request
        constraints: '>= 1'
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: branching progress state; ACCEPTED and DENIED carry disjoint side-effect sets
        constraints: one of {REQUESTED, SURVEYED, ACCEPTED, DENIED, ATTACHED}
      - name: make_ready_cost_cents
        type: integer
        source: input
        description: make-ready cost quoted by the utility at survey; null until SURVEYED
        constraints: null or '>= 0'
      - name: survey_completed_at
        type: datetime
        source: system
        description: logical-clock instant the survey and quote were recorded; null until SURVEYED
      - name: denial_reason
        type: enum
        source: input
        description: why the utility denied attachment; null unless status is DENIED
        constraints: null or one of {INSUFFICIENT_CLEARANCE, SAFETY_VIOLATION, CAPACITY_FULL}
      - name: attached_at
        type: datetime
        source: system
        description: logical-clock instant attachment work completed; null unless status is ATTACHED

  - name: Preorder
    parent: null
    common_fields: true
    fields:
      - name: build_zone_id
        type: string
        source: input
        description: FK -> BuildZone.id; the zone whose threshold this preorder counts toward
      - name: service_address_id
        type: string
        source: input
        description: FK -> ServiceAddress.id; the address to be served; its build_zone_id must equal this row's build_zone_id
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the subscriber who placed the preorder and remitted the deposit
      - name: plan_tier
        type: enum
        source: input
        description: service tier preordered; selects INSTALL_BASE_CENTS in conversion_settlement
        constraints: one of {BASIC_300, GIGABIT_1000, MULTIGIG_2000}
      - name: unit_designator
        type: string
        source: input
        description: unit label inside an MDU building; null for SINGLE_FAMILY addresses
        constraints: null or 1..24 chars
      - name: preorder_status
        type: enum
        source: system
        default: PENDING
        description: lifecycle dimension of this row's parallel state machine
        constraints: one of {PENDING, QUALIFIED, CONVERTED, CANCELLED, LAPSED}
      - name: deposit_status
        type: enum
        source: system
        default: HELD
        description: money dimension of this row's parallel state machine; evolves independently of preorder_status
        constraints: one of {HELD, REFUNDED, APPLIED, FORFEITED}
      - name: deposit_amount_cents
        type: integer
        source: system
        description: deposit snapshot copied from Campaign.deposit_amount_cents at creation
      - name: counts_toward_threshold
        type: boolean
        source: computed
        description: true when this row satisfies the FINAL-variant inclusion predicate of zone_prereg_rate (preorder_status in {PENDING, QUALIFIED}, deposit_status HELD, and ServiceAddress.counts_toward_threshold true)
      - name: make_ready_share_cents
        type: integer
        source: computed
        description: this preorder's share of BuildZone.make_ready_cost_cents assigned by make_ready_share_allocation at construction start; null before allocation
      - name: drop_method
        type: enum
        source: input
        description: how the drop will be installed; supplied at conversion and pinned thereafter
        constraints: null or one of {BURY, AERIAL}
      - name: conversion_pre_discount_total_cents
        type: integer
        source: computed
        description: step-4 output of conversion_settlement (install base + drop surcharge + make-ready share); null before conversion
      - name: conversion_discount_cents
        type: integer
        source: computed
        description: step-6 output of conversion_settlement; null before conversion
      - name: conversion_total_due_cents
        type: integer
        source: computed
        description: step-9 output of conversion_settlement, after the deposit credit; null before conversion
      - name: converted_at
        type: datetime
        source: system
        description: logical-clock instant of preorder-to-order conversion; null unless preorder_status is CONVERTED
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant of cancellation; null unless preorder_status is CANCELLED
      - name: lapse_reason
        type: enum
        source: system
        description: why the preorder lapsed at a qualification run; null unless preorder_status is LAPSED
        constraints: null or one of {ZONE_NOT_QUALIFIED, ADDRESS_NOT_COUNTED}

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: crew identifier used by dispatch
        constraints: 1..80 chars
      - name: crew_type
        type: enum
        source: input
        description: work the crew is certified for; must match the appointment_type it is booked for
        constraints: one of {BURY, AERIAL, RESTORATION}
      - name: travel_buffer_minutes
        type: integer
        source: input
        default: 30
        description: trailing buffer appended to every appointment window of this crew for both conflict detection and capacity accounting
        constraints: '0..240'
      - name: daily_capacity_minutes
        type: integer
        source: input
        default: 480
        description: maximum occupied minutes this crew may hold on any single UTC calendar date
        constraints: '1..1440'
      - name: booked_minutes_total
        type: integer
        source: computed
        default: 0
        description: sum of occupied_minutes over all InstallAppointment rows for this crew whose status is SCHEDULED, across every date
      - name: scheduled_appointment_count
        type: integer
        source: computed
        default: 0
        description: count of InstallAppointment rows for this crew whose status is SCHEDULED

  - name: InstallAppointment
    parent: null
    common_fields: true
    fields:
      - name: preorder_id
        type: string
        source: input
        description: FK -> Preorder.id; the converted preorder being installed or restored
      - name: crew_id
        type: string
        source: input
        description: FK -> InstallCrew.id; the crew holding this window
      - name: parent_appointment_id
        type: string
        source: input
        description: FK -> InstallAppointment.id; the COMPLETED install appointment whose restoration obligation this follow-up discharges; required for RESTORATION_FOLLOWUP and null for every other appointment_type
      - name: appointment_type
        type: enum
        source: input
        description: work performed in the window
        constraints: one of {DROP_BURY, AERIAL_DROP, RESTORATION_FOLLOWUP}
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the appointment window
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the appointment window; must be strictly after window_start_at and at most MAX_WINDOW_MINUTES later
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: appointment lifecycle
        constraints: one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}
      - name: occupied_minutes
        type: integer
        source: computed
        description: whole minutes between window_start_at and window_end_at plus the crew's travel_buffer_minutes; the unit of both crew conflict geometry and crew daily capacity
      - name: restoration_required
        type: boolean
        source: system
        default: false
        description: true when the completing coordinator recorded lawn/utility disturbance needing restoration follow-up
      - name: restoration_due_by
        type: datetime
        source: computed
        description: completed_at plus Campaign.restoration_sla_days; null unless status is COMPLETED and restoration_required is true
      - name: restoration_satisfied_at
        type: datetime
        source: system
        description: logical-clock instant a child RESTORATION_FOLLOWUP appointment for this row was COMPLETED; null while the obligation is outstanding
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the outcome was recorded as COMPLETED; null otherwise
      - name: cancellation_reason
        type: enum
        source: system
        description: why the appointment was cancelled; null unless status is CANCELLED
        constraints: null or one of {SUBSCRIBER_REQUEST, ZONE_SUSPENDED, CREW_UNAVAILABLE}

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: install_appointment_id
        type: string
        source: input
        description: FK -> InstallAppointment.id; the COMPLETED appointment during which the damage occurred
      - name: service_address_id
        type: string
        source: input
        description: FK -> ServiceAddress.id; the damaged property; must equal the appointment's preorder's service_address_id
      - name: claimant_account_id
        type: string
        source: input
        description: FK -> Account.id; the party filing the claim; the Subscriber role's X-User-ID must equal this value
      - name: damage_type
        type: enum
        source: input
        description: what was damaged; selects the schedule cap in damage_claim_assessment
        constraints: one of {LAWN, IRRIGATION, DRIVEWAY, UTILITY_LINE}
      - name: claimed_amount_cents
        type: integer
        source: input
        description: amount the claimant asks for
        constraints: '>= 1'
      - name: description
        type: string
        source: input
        description: claimant narrative
        constraints: null or 1..500 chars
      - name: status
        type: enum
        source: system
        default: FILED
        description: adjudication state; DENIED returns to UNDER_ASSESSMENT on appeal
        constraints: one of {FILED, UNDER_ASSESSMENT, PAID, DENIED}
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the claim was filed; the variant selector of damage_claim_assessment
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: damage_claim_assessment output; null until the first assessment
      - name: assessment_variant
        type: enum
        source: computed
        description: which damage_claim_assessment variant produced assessed_amount_cents
        constraints: null or one of {STANDARD_SCHEDULE, LATE_FILING_SCHEDULE}
      - name: assessed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ClaimsAssessor who recorded the current assessment; the segregation-of-duties comparand
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ClaimsApprover who recorded the current decision
      - name: appeal_count
        type: integer
        source: system
        default: 0
        description: number of appeals recorded against denials of this claim
      - name: max_appeals
        type: integer
        source: input
        default: 1
        description: maximum appeals permitted on this claim
        constraints: '0..3'
      - name: denial_reason
        type: string
        source: input
        description: approver note captured on denial; null unless the last decision was a denial
        constraints: null or 1..240 chars
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant the payout ledger entry was appended; null unless status is PAID

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> Account.id; the account whose balances this entry moves
      - name: preorder_id
        type: string
        source: system
        description: FK -> Preorder.id; the preorder whose deposit this entry moves; null for CLAIM_PAYOUT entries
      - name: damage_claim_id
        type: string
        source: system
        description: FK -> DamageClaim.id; the claim this payout settles; null for every deposit entry_type
      - name: entry_type
        type: enum
        source: system
        description: which conserved movement this entry records
        constraints: one of {DEPOSIT_HELD, DEPOSIT_REFUNDED, DEPOSIT_APPLIED, DEPOSIT_FORFEITED, CLAIM_PAYOUT}
      - name: amount_cents
        type: integer
        source: system
        description: signed movement; positive for DEPOSIT_HELD and CLAIM_PAYOUT, negative for DEPOSIT_REFUNDED, DEPOSIT_APPLIED and DEPOSIT_FORFEITED
      - name: memo
        type: string
        source: system
        description: human-readable reason recorded by the appending side effect
      - name: occurred_at
        type: datetime
        source: system
        description: logical-clock instant the entry was appended

  - name: FallbackTechnologyOption
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose unserved addresses this option may be offered to
      - name: technology
        type: enum
        source: input
        description: alternative access technology
        constraints: one of {FIXED_WIRELESS, DSL_PARTNER, SATELLITE_PARTNER}
      - name: min_downstream_mbps
        type: integer
        source: input
        description: guaranteed downstream rate; primary sort key (descending) of fallback_option_selection
        constraints: '>= 1'
      - name: monthly_price_cents
        type: integer
        source: input
        description: monthly price; second sort key (ascending) of fallback_option_selection
        constraints: '>= 0'
      - name: max_serviceable_distance_m
        type: integer
        source: input
        description: maximum ServiceAddress.distance_to_node_m this option can serve; eligibility filter input
        constraints: '>= 0'
      - name: supports_mdu
        type: boolean
        source: input
        default: false
        description: whether this option may be offered to an MDU address
      - name: priority_rank
        type: integer
        source: input
        description: operator preference; third sort key (ascending) of fallback_option_selection
        constraints: '>= 1'
      - name: option_status
        type: enum
        source: input
        default: ENABLED
        description: whether the option participates in the candidate pool
        constraints: one of {ENABLED, DISABLED}

  - name: FallbackOffer
    parent: null
    common_fields: true
    fields:
      - name: service_address_id
        type: string
        source: input
        description: FK -> ServiceAddress.id; the unserved address the offer is made for
      - name: fallback_option_id
        type: string
        source: system
        description: FK -> FallbackTechnologyOption.id; the option chosen by fallback_option_selection, never supplied by the client
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the party the offer is extended to and who may respond
      - name: status
        type: enum
        source: system
        default: OFFERED
        description: offer lifecycle; lazily transitions to EXPIRED once the clock reaches expires_at
        constraints: one of {OFFERED, ACCEPTED, DECLINED, EXPIRED}
      - name: technology
        type: enum
        source: system
        description: technology snapshot copied from the selected option at offer time
        constraints: one of {FIXED_WIRELESS, DSL_PARTNER, SATELLITE_PARTNER}
      - name: min_downstream_mbps
        type: integer
        source: system
        description: downstream snapshot copied from the selected option at offer time
      - name: monthly_price_cents
        type: integer
        source: system
        description: price snapshot copied from the selected option at offer time; later option edits do not change it
      - name: offered_at
        type: datetime
        source: system
        description: logical-clock instant the offer was created
      - name: expires_at
        type: datetime
        source: input
        description: instant at or after which an OFFERED offer lazily transitions to EXPIRED
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant the account accepted or declined; null while OFFERED or EXPIRED

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# Two entities carry two independent dimensions each; each dimension is one entry below and
# names its `state_field:` so transition ids never collide.
# ---------------------------------------------------------------------------
state_machines:
  - entity: BuildZone
    state_field: campaign_status
    initial_state: PREREG_OPEN
    terminal_states: [QUALIFIED, NOT_QUALIFIED]
    transitions:
      - from: PREREG_OPEN
        to: PREREG_EXTENDED
        trigger: "POST /build-zones/{id}/extend-deadline"
        actor: ProgramManager
        preconditions:
          - "extension_count < Campaign.max_deadline_extensions"
          - "current_utc < prereg_deadline_at"
        side_effects:
          - "prereg_deadline_at += Campaign.extension_grant_days whole days"
          - "extension_count += 1; cumulative_extension_days += Campaign.extension_grant_days"
          - "increments BuildZone.version by 1"
        note: "construction_status is untouched by this transition."
      - from: PREREG_EXTENDED
        to: PREREG_EXTENDED
        trigger: "POST /build-zones/{id}/extend-deadline"
        actor: ProgramManager
        preconditions:
          - "extension_count < Campaign.max_deadline_extensions"
          - "current_utc < prereg_deadline_at"
        side_effects:
          - "prereg_deadline_at += Campaign.extension_grant_days whole days"
          - "extension_count += 1; cumulative_extension_days += Campaign.extension_grant_days"
          - "increments BuildZone.version by 1"
        note: "Self-loop: each further extension keeps the state and only advances the counters."
      - from: PREREG_OPEN
        to: QUALIFIED
        trigger: "POST /campaigns/{id}/qualification-run"
        actor: system
        preconditions:
          - "prereg_deadline_at <= current_utc"
          - "final_rate_pct >= threshold_pct (FINAL variant of zone_prereg_rate)"
        side_effects:
          - "final_qualifying_count and final_rate_pct stamped from the FINAL variant"
          - "every Preorder in this zone with preorder_status PENDING and counts_toward_threshold true -> QUALIFIED (deposit_status stays HELD)"
          - "every Preorder in this zone with preorder_status PENDING and counts_toward_threshold false -> LAPSED with lapse_reason ADDRESS_NOT_COUNTED, which itself drives that preorder's deposit_status HELD -> REFUNDED"
          - "increments BuildZone.version by 1"
      - from: PREREG_EXTENDED
        to: QUALIFIED
        trigger: "POST /campaigns/{id}/qualification-run"
        actor: system
        preconditions:
          - "prereg_deadline_at <= current_utc"
          - "final_rate_pct >= threshold_pct"
        side_effects:
          - "identical to PREREG_OPEN -> QUALIFIED"
          - "increments BuildZone.version by 1"
      - from: PREREG_OPEN
        to: NOT_QUALIFIED
        trigger: "POST /campaigns/{id}/qualification-run"
        actor: system
        preconditions:
          - "prereg_deadline_at <= current_utc"
          - "final_rate_pct < threshold_pct"
        side_effects:
          - "final_qualifying_count and final_rate_pct stamped from the FINAL variant"
          - "cascade hop 2: every Preorder in this zone with preorder_status PENDING -> LAPSED with lapse_reason ZONE_NOT_QUALIFIED"
          - "cascade hop 3 (caused by hop 2): each of those preorders' deposit_status HELD -> REFUNDED, appending one LedgerEntry(entry_type DEPOSIT_REFUNDED, amount_cents = -deposit_amount_cents)"
          - "cascade hop 4 (caused by hop 3): each affected Account.deposit_held_cents recomputed from its ledger"
          - "each ServiceAddress referenced by a hop-2 preorder: serviceability -> NOT_SERVICEABLE with not_serviceable_reason BUILD_NOT_QUALIFIED, and exception_status NONE -> REQUESTED with exception_reason 'zone build did not qualify'"
          - "provisional_qualifying_count and prereg_rate_pct recomputed (both fall to the post-lapse values)"
          - "increments BuildZone.version by 1"
      - from: PREREG_EXTENDED
        to: NOT_QUALIFIED
        trigger: "POST /campaigns/{id}/qualification-run"
        actor: system
        preconditions:
          - "prereg_deadline_at <= current_utc"
          - "final_rate_pct < threshold_pct"
        side_effects:
          - "identical to PREREG_OPEN -> NOT_QUALIFIED"
          - "increments BuildZone.version by 1"

  - entity: BuildZone
    state_field: construction_status
    initial_state: NOT_STARTED
    terminal_states: [SERVICE_READY]
    transitions:
      - from: NOT_STARTED
        to: SEQUENCED
        trigger: "POST /campaigns/{id}/sequencing-run"
        actor: system
        preconditions:
          - "campaign_status == QUALIFIED"
        side_effects:
          - "readiness_score stamped from zone_readiness_score"
          - "build_sequence_index assigned 1..n over the campaign's QUALIFIED zones by the pinned ranking of zone_readiness_score"
          - "increments BuildZone.version by 1"
        note: "Zones whose campaign_status is not QUALIFIED are skipped entirely: no score, no index, no version bump."
      - from: SEQUENCED
        to: IN_CONSTRUCTION
        trigger: "POST /build-zones/{id}/construction-start"
        actor: ProgramManager
        preconditions:
          - "campaign_status == QUALIFIED"
          - "every permit_type in required_permit_types has a PermitApplication in this zone with status APPROVED and expires_at > current_utc"
          - "at least one PoleAttachmentRequest in this zone has status ATTACHED"
        side_effects:
          - "make_ready_share_allocation runs, writing make_ready_share_cents on every Preorder in this zone with preorder_status QUALIFIED"
          - "readiness_posture recomputed to READY"
          - "increments BuildZone.version by 1"
      - from: IN_CONSTRUCTION
        to: SUSPENDED
        trigger: "POST /build-zones/{id}/suspension with action SUSPEND, or system cascade from PoleAttachmentRequest SURVEYED -> DENIED"
        actor: ProgramManager | system
        preconditions:
          - "construction_status == IN_CONSTRUCTION"
        side_effects:
          - "suspension_reason set (MANUAL for the operator action, POLE_DENIED for the pole cascade)"
          - "cascade hop 3 (when reached from the pole cascade): every InstallAppointment whose preorder_id belongs to this zone and whose status is SCHEDULED -> CANCELLED with cancellation_reason ZONE_SUSPENDED"
          - "cascade hop 4 (caused by hop 3): each affected InstallCrew.booked_minutes_total and scheduled_appointment_count recomputed, releasing the cancelled appointments' occupied_minutes"
          - "readiness_posture recomputed to SUSPENDED"
          - "increments BuildZone.version by 1"
      - from: SUSPENDED
        to: IN_CONSTRUCTION
        trigger: "POST /build-zones/{id}/suspension with action RESUME"
        actor: ProgramManager
        preconditions:
          - "construction_status == SUSPENDED"
          - "no PoleAttachmentRequest in this zone has status DENIED unless another has status ATTACHED"
        side_effects:
          - "suspension_reason cleared to null"
          - "readiness_posture recomputed"
          - "increments BuildZone.version by 1"
        note: "Cycle: a zone may be suspended and resumed any number of times; cancelled appointments are not restored."
      - from: IN_CONSTRUCTION
        to: SERVICE_READY
        trigger: "POST /build-zones/{id}/construction-complete"
        actor: ProgramManager
        preconditions:
          - "construction_status == IN_CONSTRUCTION"
          - "outstanding_restoration_count == 0"
        side_effects:
          - "readiness_posture recomputed to READY"
          - "increments BuildZone.version by 1"

  - entity: ServiceAddress
    state_field: serviceability
    initial_state: UNDETERMINED
    terminal_states: []
    transitions:
      - from: UNDETERMINED
        to: SERVICEABLE
        trigger: "POST /service-addresses/{id}/serviceability-determination with determination SERVICEABLE"
        actor: ProgramManager
        preconditions:
          - "dwelling_type == SINGLE_FAMILY, or dwelling_type == MDU with an MduOwnerAgreement for this address in status SIGNED"
        side_effects:
          - "serviceability_determined_at = current_utc"
          - "counts_toward_threshold recomputed to true"
          - "the zone's provisional_qualifying_count, prereg_rate_pct and every non-terminal Preorder.counts_toward_threshold at this address recomputed"
          - "increments BuildZone.version by 1"
      - from: UNDETERMINED
        to: CONDITIONAL_MDU
        trigger: "POST /service-addresses/{id}/serviceability-determination with determination CONDITIONAL_MDU"
        actor: ProgramManager
        preconditions:
          - "dwelling_type == MDU"
        side_effects:
          - "serviceability_determined_at = current_utc; counts_toward_threshold recomputed (false until an agreement is SIGNED)"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: UNDETERMINED
        to: NOT_SERVICEABLE
        trigger: "POST /service-addresses/{id}/serviceability-determination with determination NOT_SERVICEABLE"
        actor: ProgramManager
        preconditions:
          - "not_serviceable_reason supplied"
        side_effects:
          - "serviceability_determined_at = current_utc; counts_toward_threshold recomputed to false"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: CONDITIONAL_MDU
        to: SERVICEABLE
        trigger: "system cascade from MduOwnerAgreement SENT|COUNTERED -> SIGNED"
        actor: system
        preconditions:
          - "the signing agreement's service_address_id equals this address"
        side_effects:
          - "cascade hop 2: serviceability CONDITIONAL_MDU -> SERVICEABLE, counts_toward_threshold true, serviceability_determined_at = current_utc"
          - "cascade hop 3 (caused by hop 2): every Preorder at this address with preorder_status PENDING has counts_toward_threshold recomputed to true"
          - "cascade hop 4 (caused by hop 3): the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: CONDITIONAL_MDU
        to: NOT_SERVICEABLE
        trigger: "system cascade from MduOwnerAgreement SENT|COUNTERED -> DECLINED or -> EXPIRED"
        actor: system
        preconditions:
          - "no other MduOwnerAgreement for this address is in status SIGNED"
        side_effects:
          - "not_serviceable_reason = MDU_AGREEMENT_UNAVAILABLE; counts_toward_threshold recomputed to false"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: SERVICEABLE
        to: NOT_SERVICEABLE
        trigger: "system cascade from BuildZone campaign_status -> NOT_QUALIFIED, or POST /service-addresses/{id}/serviceability-determination with determination NOT_SERVICEABLE"
        actor: system | ProgramManager
        preconditions:
          - "for the cascade: a Preorder at this address lapsed with lapse_reason ZONE_NOT_QUALIFIED"
        side_effects:
          - "not_serviceable_reason = BUILD_NOT_QUALIFIED for the cascade, or the supplied reason for the operator action"
          - "exception_status NONE -> REQUESTED for the cascade only"
          - "counts_toward_threshold recomputed to false"

  - entity: ServiceAddress
    state_field: exception_status
    initial_state: NONE
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /service-addresses/{id}/unserved-exception with action REQUEST, or system cascade from BuildZone campaign_status -> NOT_QUALIFIED"
        actor: ProgramManager | system
        preconditions:
          - "serviceability == NOT_SERVICEABLE"
        side_effects:
          - "exception_reason recorded"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /service-addresses/{id}/unserved-exception with action GRANT"
        actor: ProgramManager
        preconditions:
          - "serviceability == NOT_SERVICEABLE"
        side_effects:
          - "the address becomes eligible for POST /service-addresses/{id}/fallback-offers"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /service-addresses/{id}/unserved-exception with action DENY"
        actor: ProgramManager
        preconditions:
          - "exception_status == REQUESTED"
        side_effects:
          - "no fallback offer may be created for this address"

  - entity: MduOwnerAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [SIGNED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /mdu-agreements/{id}/offers"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
          - "current_utc < expires_at"
        side_effects:
          - "access_fee_cents replaced by the offered fee; offer_round += 1"
      - from: SENT
        to: COUNTERED
        trigger: "POST /mdu-agreements/{id}/owner-response with response COUNTER"
        actor: MduOwner
        preconditions:
          - "status == SENT"
          - "counter_round < max_counter_rounds"
          - "current_utc < expires_at"
        side_effects:
          - "countered_fee_cents recorded; counter_round += 1"
      - from: COUNTERED
        to: SENT
        trigger: "POST /mdu-agreements/{id}/offers"
        actor: ProgramManager
        preconditions:
          - "status == COUNTERED"
          - "current_utc < expires_at"
        side_effects:
          - "access_fee_cents replaced by the new offered fee; offer_round += 1"
        note: "Cycle: SENT -> COUNTERED -> SENT repeats until the owner signs, declines, the clock passes expires_at, or counter_round reaches max_counter_rounds."
      - from: SENT
        to: SIGNED
        trigger: "POST /mdu-agreements/{id}/owner-response with response SIGN"
        actor: MduOwner
        preconditions:
          - "status == SENT"
          - "current_utc < expires_at"
        side_effects:
          - "signed_at = current_utc"
          - "cascade hop 2: the referenced ServiceAddress serviceability CONDITIONAL_MDU -> SERVICEABLE"
          - "cascade hop 3 (caused by hop 2): every PENDING Preorder at that address has counts_toward_threshold recomputed to true"
          - "cascade hop 4 (caused by hop 3): the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: COUNTERED
        to: SIGNED
        trigger: "POST /mdu-agreements/{id}/owner-response with response SIGN"
        actor: MduOwner
        preconditions:
          - "status == COUNTERED"
          - "current_utc < expires_at"
        side_effects:
          - "identical to SENT -> SIGNED; the signed fee is access_fee_cents, not countered_fee_cents"
      - from: SENT
        to: DECLINED
        trigger: "POST /mdu-agreements/{id}/owner-response with response DECLINE"
        actor: MduOwner
        preconditions:
          - "status == SENT"
          - "current_utc < expires_at"
        side_effects:
          - "the referenced ServiceAddress serviceability CONDITIONAL_MDU -> NOT_SERVICEABLE with not_serviceable_reason MDU_AGREEMENT_UNAVAILABLE"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /mdu-agreements/{id}/owner-response with response DECLINE"
        actor: MduOwner
        preconditions:
          - "status == COUNTERED"
          - "current_utc < expires_at"
        side_effects:
          - "identical to SENT -> DECLINED"
      - from: SENT
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at the start of any GET or POST that touches this agreement when current_utc >= expires_at"
        actor: system
        preconditions:
          - "status == SENT"
          - "current_utc >= expires_at"
        side_effects:
          - "the referenced ServiceAddress serviceability CONDITIONAL_MDU -> NOT_SERVICEABLE with not_serviceable_reason MDU_AGREEMENT_UNAVAILABLE"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; increments BuildZone.version by 1"
        note: "There is no background job: the transition is materialized by the next request that reads or writes the row, so tests observe it via GET /mdu-agreements/{id}."
      - from: COUNTERED
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at the start of any GET or POST that touches this agreement when current_utc >= expires_at"
        actor: system
        preconditions:
          - "status == COUNTERED"
          - "current_utc >= expires_at"
        side_effects:
          - "identical to SENT -> EXPIRED"

  - entity: PermitApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "submission_round += 1 (first submission is round 1)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-applications/{id}/decision with decision APPROVE"
        actor: PermitOffice
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "approved_at = current_utc; expires_at = approved_at + valid_days whole days; rejection_reason cleared to null"
          - "reviewer_user_id = the acting X-User-ID"
          - "the zone's readiness_posture recomputed (PERMIT_PENDING -> POLE_PENDING once every required permit type is approved)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /permit-applications/{id}/decision with decision REJECT"
        actor: PermitOffice
        preconditions:
          - "status == SUBMITTED"
          - "rejection_reason supplied"
        side_effects:
          - "rejection_reason recorded; reviewer_user_id = the acting X-User-ID"
          - "the zone's readiness_posture recomputed"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == REJECTED"
          - "submission_round <= max_resubmissions (a resubmission is permitted only while submission_round - 1 < max_resubmissions)"
        side_effects:
          - "submission_round += 1; rejection_reason cleared to null"
        note: "Cycle: reject/resubmit repeats until submission_round - 1 reaches max_resubmissions."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at the start of any GET or POST that touches this application, and inside the construction-start readiness check, when current_utc >= expires_at"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "current_utc >= expires_at"
        side_effects:
          - "the zone's readiness_posture recomputed to PERMIT_PENDING"
          - "when the zone's construction_status is IN_CONSTRUCTION it is suspended with suspension_reason PERMIT_EXPIRED, which cancels that zone's SCHEDULED appointments and releases their crew minutes"

  - entity: PoleAttachmentRequest
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, ATTACHED]
    transitions:
      - from: REQUESTED
        to: SURVEYED
        trigger: "POST /pole-attachment-requests/{id}/survey"
        actor: UtilityOperator
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "make_ready_cost_cents recorded from the quote; survey_completed_at = current_utc"
          - "the zone's readiness_posture recomputed"
      - from: SURVEYED
        to: ACCEPTED
        trigger: "POST /pole-attachment-requests/{id}/decision with decision ACCEPT"
        actor: ProgramManager
        preconditions:
          - "status == SURVEYED"
        side_effects:
          - "the zone's make_ready_cost_cents recomputed to include this request's quote; increments BuildZone.version by 1"
        note: "Branch A of the fork: the accepted branch adds cost and keeps construction alive."
      - from: SURVEYED
        to: DENIED
        trigger: "POST /pole-attachment-requests/{id}/decision with decision DENY"
        actor: UtilityOperator
        preconditions:
          - "status == SURVEYED"
          - "denial_reason supplied"
        side_effects:
          - "cascade hop 2: when the zone's construction_status is IN_CONSTRUCTION it transitions to SUSPENDED with suspension_reason POLE_DENIED"
          - "cascade hop 3 (caused by hop 2): every InstallAppointment whose preorder belongs to that zone and whose status is SCHEDULED -> CANCELLED with cancellation_reason ZONE_SUSPENDED"
          - "cascade hop 4 (caused by hop 3): each affected InstallCrew.booked_minutes_total and scheduled_appointment_count recomputed downward by the released occupied_minutes"
          - "the zone's make_ready_cost_cents excludes this request; readiness_posture recomputed; increments BuildZone.version by 1"
        note: "Branch B of the fork: disjoint side-effect set from ACCEPT - no cost added, a suspension cascade instead."
      - from: ACCEPTED
        to: ATTACHED
        trigger: "POST /pole-attachment-requests/{id}/attachment"
        actor: UtilityOperator
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "attached_at = current_utc"
          - "the zone's readiness_posture recomputed (POLE_PENDING -> READY once permits are also approved); increments BuildZone.version by 1"

  - entity: Preorder
    state_field: preorder_status
    initial_state: PENDING
    terminal_states: [CONVERTED, CANCELLED, LAPSED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /campaigns/{id}/qualification-run (zone qualifies)"
        actor: system
        preconditions:
          - "the zone's campaign_status becomes QUALIFIED in this run"
          - "counts_toward_threshold == true"
        side_effects:
          - "deposit_status stays HELD; no ledger entry is appended"
      - from: PENDING
        to: LAPSED
        trigger: "POST /campaigns/{id}/qualification-run (zone fails, or address not counted)"
        actor: system
        preconditions:
          - "the zone's campaign_status becomes NOT_QUALIFIED in this run, or the zone qualifies while counts_toward_threshold is false"
        side_effects:
          - "lapse_reason = ZONE_NOT_QUALIFIED or ADDRESS_NOT_COUNTED"
          - "this row's deposit_status HELD -> REFUNDED, which appends LedgerEntry(DEPOSIT_REFUNDED, -deposit_amount_cents) and recomputes Account.deposit_held_cents"
      - from: QUALIFIED
        to: CONVERTED
        trigger: "POST /preorders/{id}/conversion"
        actor: Subscriber | ProgramManager
        preconditions:
          - "preorder_status == QUALIFIED"
          - "the zone's construction_status is in {IN_CONSTRUCTION, SERVICE_READY}"
          - "when the address dwelling_type is MDU, an MduOwnerAgreement for that address is in status SIGNED"
        side_effects:
          - "drop_method pinned; conversion_settlement runs, writing conversion_pre_discount_total_cents, conversion_discount_cents and conversion_total_due_cents"
          - "deposit_status HELD -> APPLIED, appending LedgerEntry(DEPOSIT_APPLIED, -deposit_amount_cents) and recomputing Account.deposit_held_cents"
          - "converted_at = current_utc"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /preorders/{id}/cancel"
        actor: Subscriber | ProgramManager
        preconditions:
          - "preorder_status == PENDING"
        side_effects:
          - "cancelled_at = current_utc"
          - "deposit_status HELD -> REFUNDED, appending LedgerEntry(DEPOSIT_REFUNDED, -deposit_amount_cents) and recomputing Account.deposit_held_cents"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed downward; increments BuildZone.version by 1"
      - from: QUALIFIED
        to: CANCELLED
        trigger: "POST /preorders/{id}/cancel"
        actor: Subscriber | ProgramManager
        preconditions:
          - "preorder_status == QUALIFIED"
        side_effects:
          - "cancelled_at = current_utc"
          - "deposit_status HELD -> FORFEITED (conditional cascade: forfeited rather than refunded because the zone already committed to build), appending LedgerEntry(DEPOSIT_FORFEITED, -deposit_amount_cents)"
          - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed downward; increments BuildZone.version by 1"

  - entity: Preorder
    state_field: deposit_status
    initial_state: HELD
    terminal_states: [REFUNDED, APPLIED, FORFEITED]
    transitions:
      - from: HELD
        to: REFUNDED
        trigger: "system cascade from Preorder preorder_status PENDING -> CANCELLED or PENDING -> LAPSED"
        actor: system
        preconditions:
          - "deposit_status == HELD"
        side_effects:
          - "append LedgerEntry(entry_type DEPOSIT_REFUNDED, amount_cents = -deposit_amount_cents, preorder_id = this row)"
          - "Account.deposit_held_cents recomputed from the ledger"
      - from: HELD
        to: APPLIED
        trigger: "system cascade from Preorder preorder_status QUALIFIED -> CONVERTED"
        actor: system
        preconditions:
          - "deposit_status == HELD"
        side_effects:
          - "append LedgerEntry(entry_type DEPOSIT_APPLIED, amount_cents = -deposit_amount_cents)"
          - "Account.deposit_held_cents recomputed from the ledger"
      - from: HELD
        to: FORFEITED
        trigger: "system cascade from Preorder preorder_status QUALIFIED -> CANCELLED"
        actor: system
        preconditions:
          - "deposit_status == HELD"
        side_effects:
          - "append LedgerEntry(entry_type DEPOSIT_FORFEITED, amount_cents = -deposit_amount_cents)"
          - "Account.deposit_held_cents recomputed from the ledger"

  - entity: InstallAppointment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /install-appointments/{id}/outcome with outcome COMPLETED"
        actor: InstallCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "completed_at = current_utc; restoration_required recorded from the request"
          - "when restoration_required is true: restoration_due_by = completed_at + Campaign.restoration_sla_days whole days, and the zone's outstanding_restoration_count increases by 1"
          - "when appointment_type is RESTORATION_FOLLOWUP: the parent appointment's restoration_satisfied_at = current_utc, which decrements the zone's outstanding_restoration_count, which in turn unblocks POST /build-zones/{id}/construction-complete"
          - "the crew's booked_minutes_total and scheduled_appointment_count recomputed downward by this row's occupied_minutes"
          - "increments InstallCrew.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /install-appointments/{id}/outcome with outcome NO_SHOW"
        actor: InstallCoordinator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "the crew's booked_minutes_total and scheduled_appointment_count recomputed downward by this row's occupied_minutes"
          - "the preorder is untouched: deposit_status stays APPLIED and no ledger entry is appended"
          - "increments InstallCrew.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /install-appointments/{id}/outcome with outcome CANCELLED, or system cascade from BuildZone construction_status IN_CONSTRUCTION -> SUSPENDED"
        actor: InstallCoordinator | system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "cancellation_reason set (SUBSCRIBER_REQUEST or CREW_UNAVAILABLE for the operator action, ZONE_SUSPENDED for the cascade)"
          - "the crew's booked_minutes_total and scheduled_appointment_count recomputed downward by this row's occupied_minutes, restoring both to their pre-scheduling values"
          - "increments InstallCrew.version by 1"

  - entity: DamageClaim
    state_field: status
    initial_state: FILED
    terminal_states: [PAID]
    transitions:
      - from: FILED
        to: UNDER_ASSESSMENT
        trigger: "POST /damage-claims/{id}/assessment"
        actor: ClaimsAssessor
        preconditions:
          - "status == FILED"
        side_effects:
          - "damage_claim_assessment runs, writing assessed_amount_cents and assessment_variant"
          - "assessed_by_user_id = the acting X-User-ID"
      - from: UNDER_ASSESSMENT
        to: PAID
        trigger: "POST /damage-claims/{id}/decision with decision APPROVE"
        actor: ClaimsApprover
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "the acting X-User-ID differs from assessed_by_user_id"
        side_effects:
          - "decided_by_user_id = the acting X-User-ID; paid_at = current_utc"
          - "append LedgerEntry(entry_type CLAIM_PAYOUT, amount_cents = +assessed_amount_cents, damage_claim_id = this row, account_id = claimant_account_id)"
          - "Account.credit_balance_cents recomputed from the ledger"
      - from: UNDER_ASSESSMENT
        to: DENIED
        trigger: "POST /damage-claims/{id}/decision with decision DENY"
        actor: ClaimsApprover
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "the acting X-User-ID differs from assessed_by_user_id"
          - "denial_reason supplied"
        side_effects:
          - "decided_by_user_id = the acting X-User-ID; denial_reason recorded; no ledger entry is appended"
      - from: DENIED
        to: UNDER_ASSESSMENT
        trigger: "POST /damage-claims/{id}/appeal"
        actor: Subscriber
        preconditions:
          - "status == DENIED"
          - "appeal_count < max_appeals"
        side_effects:
          - "appeal_count += 1; denial_reason cleared to null; assessed_amount_cents and assessment_variant retained until the next assessment overwrites them"
        note: "Cycle: DENIED -> UNDER_ASSESSMENT -> DENIED repeats until appeal_count reaches max_appeals."

  - entity: FallbackOffer
    state_field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /fallback-offers/{id}/response with response ACCEPT"
        actor: Subscriber
        preconditions:
          - "status == OFFERED"
          - "current_utc < expires_at"
        side_effects:
          - "responded_at = current_utc; the address's active_fallback_technology = this offer's technology snapshot"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /fallback-offers/{id}/response with response DECLINE"
        actor: Subscriber
        preconditions:
          - "status == OFFERED"
          - "current_utc < expires_at"
        side_effects:
          - "responded_at = current_utc; the declined fallback_option_id is excluded from the candidate pool of any later fallback_option_selection for this address"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at the start of any GET or POST that touches this offer when current_utc >= expires_at"
        actor: system
        preconditions:
          - "status == OFFERED"
          - "current_utc >= expires_at"
        side_effects:
          - "responded_at stays null; the option is NOT excluded from later selections for this address"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: preorder-create-stale-zone
    parent_entity: BuildZone
    write_endpoint: "POST /preorders"
    occ_field: "expected_build_zone_version"
    description: |
      Creating a Preorder against a BuildZone whose version has advanced since the client last
      read it is rejected. Two preorders from two different accounts both legitimately succeed
      under the product rules, so no state precondition separates them; what the client must
      confirm is that the zone terms it showed the subscriber (threshold_pct, prereg_deadline_at,
      the campaign's deposit_amount_cents) are still current. Because every preorder creation,
      cancellation, serviceability determination and threshold adjustment bumps the zone's
      version, a client holding an older version has priced or dated the sign-up against terms
      the zone no longer carries and is refused.
    error_id: ERR_STALE_BUILD_ZONE_VERSION
    http_status: 412
  - rule_id: appointment-create-stale-crew
    parent_entity: InstallCrew
    write_endpoint: "POST /install-appointments"
    occ_field: "expected_crew_version"
    description: |
      Scheduling an InstallAppointment against an InstallCrew whose version has advanced since
      the client last read the crew is rejected. Two appointments in two non-overlapping windows
      on one crew both legitimately succeed, so the second is not excluded by any state
      precondition; the client must instead confirm that the booked_minutes_total and buffer
      geometry it planned against are still the crew's current values. Every appointment
      creation, outcome and cancellation bumps the crew's version, so a stale view is refused.
    error_id: ERR_STALE_CREW_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: zone_prereg_rate
    trigger: "Recomputed on every write that changes a zone's counted preorder population or household base: POST /preorders, POST /preorders/{id}/cancel, POST /service-addresses/{id}/serviceability-determination, POST /mdu-agreements/{id}/owner-response, lazy MduOwnerAgreement expiry, PATCH /build-zones/{id}/threshold, POST /build-zones/{id}/extend-deadline; and evaluated in the FINAL variant by POST /campaigns/{id}/qualification-run."
    algorithm: threshold
    formula: |
      # numerator: preorders that count toward the zone's threshold
      counted(variant) = [
        p for p in Preorder
        if  p.build_zone_id == zone.id
        and p.preorder_status in {PENDING, QUALIFIED}
        and p.deposit_status == HELD
        and address_counts(p.service_address_id, variant)
      ]

      # PROVISIONAL admits an address whose serviceability is still unresolved;
      # FINAL demands a resolved, contractually usable address.
      address_counts(a, PROVISIONAL) =
        a.serviceability in {UNDETERMINED, SERVICEABLE, CONDITIONAL_MDU}
      address_counts(a, FINAL) =
             a.serviceability == SERVICEABLE
          or (a.serviceability == CONDITIONAL_MDU
              and exists MduOwnerAgreement m
                  where m.service_address_id == a.id and m.status == SIGNED)

      numerator = len(counted(variant))
      rate_pct  = round_half_up(Decimal(100) * numerator / zone.household_count, 2)

      # zone.household_count is >= 1 by §1.4 range validation, so there is no zero divisor.
      qualifies = (rate_pct >= zone.threshold_pct)     # inclusive: exactly-at-threshold qualifies
    input_set: "Preorders of the zone with preorder_status in {PENDING, QUALIFIED} AND deposit_status == HELD. CANCELLED, LAPSED and CONVERTED preorders are excluded, and so is any preorder whose deposit has left HELD (REFUNDED / FORFEITED / APPLIED), because the deposit is the evidence of demand. The denominator is the zone's immutable household_count, never the number of registered ServiceAddress rows."
    constants:
      RATE_SCALE_PCT: 100
      QUALIFY_COMPARISON: ">="
    precision: "2 decimal places, round_half_up; comparison against threshold_pct is performed on the rounded 2-dp value, so a true rate of 9.995% rounds to 10.00 and qualifies at a 10.00 threshold"
    variants:
      - name: PROVISIONAL
        when: "Written to BuildZone.prereg_rate_pct and provisional_qualifying_count by every ordinary write during the open preregistration window; this is the number the campaign dashboard and POST /preorders see."
        difference: "Counts addresses whose serviceability is UNDETERMINED or CONDITIONAL_MDU without any signed MDU agreement, i.e. optimistically assumes unresolved addresses will turn out serviceable."
      - name: FINAL
        when: "Computed by POST /campaigns/{id}/qualification-run and written to BuildZone.final_rate_pct; it alone decides QUALIFIED vs NOT_QUALIFIED."
        difference: "Drops UNDETERMINED addresses entirely and admits CONDITIONAL_MDU only when a SIGNED MduOwnerAgreement exists for that address, so final_rate_pct <= prereg_rate_pct always; a zone can sit above threshold provisionally and still be NOT_QUALIFIED."

  - name: damage_claim_assessment
    trigger: "POST /damage-claims/{id}/assessment"
    algorithm: tiered_pricing
    formula: |
      cap    = SCHEDULE_CAP_CENTS[claim.damage_type]
      base   = min(claim.claimed_amount_cents, cap)

      # variant selection is temporal, not per-damage-type
      on_time = (claim.filed_at <= claim.install_appointment.restoration_due_by)
      factor  = Decimal("1.00") if on_time else campaign.late_filing_factor

      assessed_amount_cents = round_half_up(base * factor, 0)   # whole cents
      assessment_variant    = "STANDARD_SCHEDULE" if on_time else "LATE_FILING_SCHEDULE"
    input_set: "Exactly one DamageClaim row plus the schedule cap for its damage_type and the restoration_due_by of the InstallAppointment it was filed against. When the appointment has no restoration_due_by (restoration_required was false), the claim could not have been filed at all — §1.4 rejects it with ERR_CLAIM_FILING_WINDOW_EXPIRED."
    constants:
      SCHEDULE_CAP_CENTS_LAWN: 120000
      SCHEDULE_CAP_CENTS_IRRIGATION: 250000
      SCHEDULE_CAP_CENTS_DRIVEWAY: 400000
      SCHEDULE_CAP_CENTS_UTILITY_LINE: 750000
      DEFAULT_LATE_FILING_FACTOR: "0.60"
      ON_TIME_FACTOR: "1.00"
    precision: "assessed_amount_cents is an integer number of cents, round_half_up on the final multiplication only; the cap is applied before the factor, never after"
    variants:
      - name: STANDARD_SCHEDULE
        when: "claim.filed_at <= appointment.restoration_due_by"
        difference: "factor 1.00, so the assessment equals the capped claim."
      - name: LATE_FILING_SCHEDULE
        when: "claim.filed_at > appointment.restoration_due_by but still within Campaign.claim_filing_window_days of the appointment's completed_at"
        difference: "factor Campaign.late_filing_factor (default 0.60) multiplies the already-capped base, so a 150000-cent lawn claim assesses at 120000 on time and 72000 late."

  - name: make_ready_share_allocation
    trigger: "POST /build-zones/{id}/construction-start (after the readiness gate passes), which writes make_ready_share_cents onto every QUALIFIED preorder of the zone"
    algorithm: waterfall_allocation
    formula: |
      recipients = sorted(
        [p for p in Preorder if p.build_zone_id == zone.id and p.preorder_status == QUALIFIED],
        key = (p.created_at ASC, p.service_address.street_address ASC)
      )
      n = len(recipients)
      if n == 0: no allocation is written and the endpoint still succeeds

      total = zone.make_ready_cost_cents          # sum of ACCEPTED and ATTACHED pole quotes only

      # PINNED ORDER: floor first for everyone, then distribute the remainder one cent at a time.
      base      = total // n                       # integer floor division
      remainder = total - base * n                 # 0 <= remainder < n
      for i, p in enumerate(recipients):
        p.make_ready_share_cents = base + (1 if i < remainder else 0)

      # FORBIDDEN alternative order: round_half_up(total / n) per recipient and then reconcile the
      # drift onto the last row. For total=500000, n=3 that yields 166667/166667/166666 as well by
      # accident, but for total=100 n=8 it yields 13*8=104 != 100. The floor-then-distribute order
      # above is the only correct one.
      invariant: sum(p.make_ready_share_cents for p in recipients) == total
    input_set: "Preorders of the zone in preorder_status QUALIFIED at the instant construction starts. PENDING preorders are excluded (they never qualified), and so are LAPSED, CANCELLED and CONVERTED ones. The pool is frozen at construction-start: preorders that convert afterwards keep the share written here, and a later cancellation does not reallocate."
    constants:
      REMAINDER_DISTRIBUTION: "one extra cent to the first `remainder` recipients in (created_at ASC, street_address ASC) order"
      ROUNDING_ORDER: "floor_then_distribute"
    precision: "integer cents throughout; no decimal arithmetic and therefore no rounding mode; the sum of the shares equals the total exactly with zero residue"

  - name: zone_readiness_score
    trigger: "Recomputed on POST /campaigns/{id}/sequencing-run, which ranks the campaign's QUALIFIED zones and writes readiness_score and build_sequence_index on each"
    algorithm: weighted_scoring
    formula: |
      # factor 1 - demand, saturating: exceeding the threshold earns nothing extra
      demand_factor = min(Decimal("1.0"), zone.final_rate_pct / zone.threshold_pct)

      # factor 2 - permits, a ratio over the zone's declared required types
      required = zone.required_permit_types                       # non-empty list of enum values
      approved_required = count of distinct t in required such that
          exists PermitApplication a where a.build_zone_id == zone.id
                 and a.permit_type == t and a.status == APPROVED
      permit_factor = Decimal(approved_required) / Decimal(len(required))

      # factor 3 - pole readiness, the MAXIMUM over the zone's requests (best pole wins)
      POLE_FACTOR = {ATTACHED: 1.00, ACCEPTED: 0.50, SURVEYED: 0.25, REQUESTED: 0.10, DENIED: 0.00}
      pole_factor = max(POLE_FACTOR[r.status] for r in zone pole requests) if any else Decimal("0.00")

      # penalty - make-ready cost, saturating at the cap
      penalty = MAKE_READY_PENALTY_WEIGHT *
                min(Decimal("1.0"), Decimal(zone.make_ready_cost_cents) / MAKE_READY_CAP_CENTS)

      raw = DEMAND_WEIGHT * demand_factor
          + PERMIT_WEIGHT * permit_factor
          + POLE_WEIGHT   * pole_factor
          - penalty
      readiness_score = round_half_up(raw, 2)      # may be negative in principle; not clamped

      # sequencing: rank the campaign's QUALIFIED zones, 1-based
      order = sorted(zones, key = (readiness_score DESC,
                                  prereg_deadline_at ASC,
                                  household_count DESC,
                                  created_at ASC))
      build_sequence_index = position in `order`, starting at 1
    input_set: "BuildZones of the campaign whose campaign_status is QUALIFIED. NOT_QUALIFIED, PREREG_OPEN and PREREG_EXTENDED zones are skipped: they keep readiness_score null and build_sequence_index null. Within a zone, only PermitApplications whose permit_type appears in required_permit_types contribute, and every PoleAttachmentRequest of the zone contributes through the max."
    constants:
      DEMAND_WEIGHT: 50
      PERMIT_WEIGHT: 25
      POLE_WEIGHT: 20
      MAKE_READY_PENALTY_WEIGHT: 15
      MAKE_READY_CAP_CENTS: 1000000
      POLE_FACTOR_ATTACHED: "1.00"
      POLE_FACTOR_ACCEPTED: "0.50"
      POLE_FACTOR_SURVEYED: "0.25"
      POLE_FACTOR_REQUESTED: "0.10"
      POLE_FACTOR_DENIED: "0.00"
    precision: "2 decimal places, round_half_up, applied once to the composed raw score - never to the individual factors, so factor drift cannot accumulate; build_sequence_index is an integer with no rounding"

  - name: conversion_settlement
    trigger: "POST /preorders/{id}/conversion"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - install base, keyed on the plan tier frozen onto the Preorder at sign-up
      install_base = INSTALL_BASE_CENTS[preorder.plan_tier]   # frozen at preorder creation

      # STEP 2 - drop-method surcharge
      drop_surcharge = DROP_METHOD_SURCHARGE_CENTS[body.drop_method]

      # STEP 3 - the preorder's frozen make-ready share (0 when construction-start never ran)
      make_ready_share = preorder.make_ready_share_cents or 0

      # STEP 4 - pre-discount total
      pre_discount_total = install_base + drop_surcharge + make_ready_share

      # STEP 5 - loyalty tier, keyed on the STEP 4 total. PINNED: the tier is chosen from
      # pre_discount_total, NOT from the post-deposit amount and NOT from install_base alone.
      discount_rate = 0.10 if pre_discount_total >= 50000
                 else 0.05 if pre_discount_total >= 30000
                 else 0.00

      # STEP 6 - discount, rounded once
      discount_cents = round_half_up(pre_discount_total * discount_rate, 0)

      # STEP 7 - net
      net_total = pre_discount_total - discount_cents

      # STEP 8 - the held deposit is credited at face value, never discounted
      total_due = net_total - preorder.deposit_amount_cents

      # STEP 9 - persist
      conversion_pre_discount_total_cents = pre_discount_total
      conversion_discount_cents           = discount_cents
      conversion_total_due_cents          = total_due       # may be negative if the deposit exceeds net
    input_set: "One Preorder in preorder_status QUALIFIED with deposit_status HELD, plus the plan_tier frozen onto the row at sign-up and the drop_method supplied in the request body and the make_ready_share_cents frozen onto the row by construction-start. No other preorder of the account or zone participates."
    constants:
      INSTALL_BASE_CENTS_BASIC_300: 9900
      INSTALL_BASE_CENTS_GIGABIT_1000: 14900
      INSTALL_BASE_CENTS_MULTIGIG_2000: 24900
      DROP_METHOD_SURCHARGE_CENTS_BURY: 15000
      DROP_METHOD_SURCHARGE_CENTS_AERIAL: 5000
      LOYALTY_TIER_HIGH_MIN_CENTS: 50000
      LOYALTY_TIER_HIGH_RATE: "0.10"
      LOYALTY_TIER_MID_MIN_CENTS: 30000
      LOYALTY_TIER_MID_RATE: "0.05"
      LOYALTY_TIER_BASE_RATE: "0.00"
    precision: "integer cents; round_half_up is applied exactly once, at step 6, to the discount amount - the tier boundaries are compared against the unrounded integer pre_discount_total, and the deposit credit at step 8 is exact"

  - name: crew_occupancy
    trigger: "POST /install-appointments (both gates), and recomputed downward on POST /install-appointments/{id}/outcome and on the ZONE_SUSPENDED cancellation cascade"
    algorithm: interval_merge
    formula: |
      duration_minutes = (window_end_at - window_start_at) in whole minutes
      occupied_minutes = duration_minutes + crew.travel_buffer_minutes

      # GATE A - pairwise conflict on the buffered, half-open interval.
      # The trailing buffer belongs to the earlier appointment; the leading edge does not
      # get a buffer, so back-to-back-plus-buffer scheduling is legal.
      blocked(appt) = [appt.window_start_at, appt.window_end_at + crew.travel_buffer_minutes)
      conflict(new, existing) =
          existing.status == SCHEDULED
          and existing.crew_id == new.crew_id
          and new.window_start_at <  existing.window_end_at + crew.travel_buffer_minutes
          and existing.window_start_at <  new.window_end_at + crew.travel_buffer_minutes
      # half-open: new.window_start_at == existing.window_end_at + buffer is NOT a conflict

      # GATE B - daily capacity, an aggregate over the UTC calendar date of window_start_at
      booked_minutes_on_date(crew, d) = sum(a.occupied_minutes
          for a in InstallAppointment
          if a.crew_id == crew.id and a.status == SCHEDULED
          and date_utc(a.window_start_at) == d)
      allowed = booked_minutes_on_date(crew, date_utc(new.window_start_at)) + new.occupied_minutes
                <= crew.daily_capacity_minutes          # inclusive: an exact fit is allowed

      # GATE C - per-zone simultaneous bury cap, over RAW windows (no buffer)
      bury_overlaps(new) = count of a in InstallAppointment where
          a.status == SCHEDULED and a.appointment_type == DROP_BURY
          and a.preorder.build_zone_id == new.preorder.build_zone_id
          and a.window_start_at < new.window_end_at and new.window_start_at < a.window_end_at
      allowed = bury_overlaps(new) < zone.max_concurrent_bury_ops
      # note the deliberate asymmetry: gate A buffers the interval, gate C does not.

      crew.booked_minutes_total       = sum of occupied_minutes over the crew's SCHEDULED rows
      crew.scheduled_appointment_count = count of the crew's SCHEDULED rows
    input_set: "InstallAppointments in status SCHEDULED only. COMPLETED, NO_SHOW and CANCELLED rows occupy nothing, so completing or cancelling an appointment frees both its minutes and its interval. Gate A and gate B are scoped to one crew; gate C is scoped to one build zone across all crews and ignores the crew dimension entirely."
    constants:
      MAX_WINDOW_MINUTES: 480
      MIN_WINDOW_MINUTES: 30
      DEFAULT_TRAVEL_BUFFER_MINUTES: 30
      DEFAULT_DAILY_CAPACITY_MINUTES: 480
      CAPACITY_COMPARISON: "<="
      CONFLICT_INTERVAL: "half_open"
    precision: "whole minutes; window_start_at and window_end_at must land on exact minutes (zero seconds and zero fractional seconds) per §1.4, so no rounding is ever required"

  - name: ledger_balances
    trigger: "Recomputed from the LedgerEntry stream whenever an entry is appended: POST /preorders (DEPOSIT_HELD), the three deposit_status cascades (DEPOSIT_REFUNDED / DEPOSIT_APPLIED / DEPOSIT_FORFEITED), and POST /damage-claims/{id}/decision with APPROVE (CLAIM_PAYOUT)"
    algorithm: aggregation
    formula: |
      # LedgerEntry rows are immutable and append-only; no entry is ever updated or deleted.
      # A reversal is a new entry with the opposite sign, never a mutation of the original.
      deposit_held_cents = sum(e.amount_cents for e in LedgerEntry
                               if e.account_id == account.id
                               and e.entry_type in {DEPOSIT_HELD, DEPOSIT_REFUNDED,
                                                    DEPOSIT_APPLIED, DEPOSIT_FORFEITED})
      credit_balance_cents = sum(e.amount_cents for e in LedgerEntry
                                 if e.account_id == account.id
                                 and e.entry_type == CLAIM_PAYOUT)

      # sign convention: DEPOSIT_HELD is positive, the three releases are negative, and
      # CLAIM_PAYOUT is positive. Therefore deposit_held_cents is always >= 0 and returns
      # to exactly its pre-preorder value once a deposit is refunded, applied or forfeited.
      invariant: deposit_held_cents ==
                 sum(p.deposit_amount_cents for p in Preorder
                     if p.account_id == account.id and p.deposit_status == HELD)
    input_set: "All LedgerEntry rows for the account, partitioned by entry_type: the four deposit types feed deposit_held_cents and CLAIM_PAYOUT feeds credit_balance_cents. Entries are never filtered by date and are never pruned, so the recomputation is a full replay of the account's stream and is order-independent."
    constants:
      SIGN_DEPOSIT_HELD: "+1"
      SIGN_DEPOSIT_REFUNDED: "-1"
      SIGN_DEPOSIT_APPLIED: "-1"
      SIGN_DEPOSIT_FORFEITED: "-1"
      SIGN_CLAIM_PAYOUT: "+1"
    precision: "integer cents; sums are exact and no rounding occurs at any point"

  - name: fallback_option_selection
    trigger: "POST /service-addresses/{id}/fallback-offers, which picks exactly one FallbackTechnologyOption and creates the FallbackOffer for it"
    algorithm: topological
    formula: |
      candidates = [o for o in FallbackTechnologyOption
        if  o.campaign_id == address.build_zone.campaign_id
        and o.option_status == ENABLED
        and o.max_serviceable_distance_m >= address.distance_to_node_m
        and (o.supports_mdu or address.dwelling_type != MDU)
        and not exists FallbackOffer f
              where f.service_address_id == address.id
                and f.fallback_option_id == o.id
                and f.status == DECLINED
      ]
      if candidates is empty: ERR_NO_FALLBACK_OPTION_AVAILABLE (409)

      # ranking - best service first, then cheapest, then the operator's explicit preference,
      # then the deterministic creation-order fallback. `id` is never consulted.
      chosen = sorted(candidates, key = (min_downstream_mbps DESC,
                                         monthly_price_cents ASC,
                                         priority_rank ASC,
                                         created_at ASC))[0]

      # expires_at is supplied by the operator in the request body and must be strictly after
      # current_utc; there is no derived default window.
      offer snapshots technology, min_downstream_mbps and monthly_price_cents from `chosen`
    input_set: "FallbackTechnologyOption rows of the address's campaign with option_status ENABLED. DISABLED options are invisible even if they are the only ones that would fit. An option the subscriber previously DECLINED for this address is permanently excluded for that address only; an EXPIRED offer does not exclude its option, so the same option can be re-offered after expiry."
    constants:
      RANKING: "min_downstream_mbps DESC, monthly_price_cents ASC, priority_rank ASC, created_at ASC"
      MDU_REQUIREMENT: "supports_mdu must be true when the address dwelling_type is MDU"
      EXPIRY_SOURCE: "expires_at is an input field on the offer, validated as strictly after current_utc"
    precision: "no arithmetic; distance and speed comparisons are exact integer comparisons, with max_serviceable_distance_m >= distance_to_node_m inclusive at the boundary"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first rule that fails determines the response and no later rule runs)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-empty, and X-User-Role names one of the eight roles in §1.7. A missing header, an empty-string header, or an unknown role name all fail here."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the endpoint's declared roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every {id} path segment resolves to an existing row, validated left to right, and each is checked before any request body is inspected."
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_BUILD_ZONE_NOT_FOUND | ERR_SERVICE_ADDRESS_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_MDU_AGREEMENT_NOT_FOUND | ERR_PERMIT_APPLICATION_NOT_FOUND | ERR_POLE_REQUEST_NOT_FOUND | ERR_PREORDER_NOT_FOUND | ERR_INSTALL_CREW_NOT_FOUND | ERR_INSTALL_APPOINTMENT_NOT_FOUND | ERR_DAMAGE_CLAIM_NOT_FOUND | ERR_FALLBACK_OPTION_NOT_FOUND | ERR_FALLBACK_OFFER_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 4
    category: existence
    check: "Every foreign-key id supplied in a request body or query filter resolves to an existing row. Body references are checked after all path references, in the field order declared by the endpoint's input list."
    error_id: "the same NOT_FOUND catalog as priority 3, selected by the referenced entity"
    http_status: 404
    applies_to: "POST /build-zones, POST /service-addresses, POST /mdu-agreements, POST /permit-applications, POST /pole-attachment-requests, POST /preorders, POST /install-crews, POST /install-appointments, POST /damage-claims, POST /fallback-options, and every list endpoint that accepts an FK filter"
  - priority: 5
    category: auth
    check: "For an entity_backed role acting on a resource it must own, X-User-ID equals the resource's owning account FK: Subscriber acting on a Preorder matches preorder.account_id; Subscriber acting on a DamageClaim appeal matches claim.claimant_account_id; Subscriber acting on a FallbackOffer response matches offer.account_id; MduOwner responding to an agreement matches agreement.owner_account_id. On POST /preorders the supplied account_id must equal the acting Subscriber's X-User-ID. Ownership is checked only after existence, so a non-existent id yields 404 rather than 403."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /preorders, POST /preorders/{id}/cancel, POST /preorders/{id}/conversion, POST /damage-claims, POST /damage-claims/{id}/appeal, POST /fallback-offers/{id}/response, POST /mdu-agreements/{id}/owner-response"
  - priority: 6
    category: auth
    check: "Segregation of duties on the damage-claim chain: the X-User-ID deciding a claim must differ from the X-User-ID recorded in assessed_by_user_id. The same operator may hold both the ClaimsAssessor and ClaimsApprover roles, but may not use them on the same claim."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /damage-claims/{id}/decision"
  - priority: 7
    category: business_referential
    check: "Request shape: every required field is present and non-null, every enum field carries a declared value, every integer field is within its declared range (household_count >= 1, threshold_pct between 0.01 and 100.00, claimed_amount_cents >= 1, distance_to_node_m >= 0, travel_buffer_minutes between 0 and 240, daily_capacity_minutes between 60 and 1440, max_concurrent_bury_ops between 1 and 10), every timestamp parses as an ISO-8601 UTC instant, and pagination limit is between 1 and 100 with offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: business_referential
    check: "Cross-reference coherence between two supplied FKs: on POST /preorders the service_address_id's build_zone_id equals the supplied build_zone_id; on POST /mdu-agreements the address dwelling_type is MDU; on POST /damage-claims the appointment's preorder's service_address_id equals the supplied service_address_id; on POST /install-appointments a RESTORATION_FOLLOWUP's parent_appointment_id points at an appointment for the same preorder_id."
    error_id: ERR_ADDRESS_LINKAGE_MISMATCH
    http_status: 422
    applies_to: "POST /preorders, POST /mdu-agreements, POST /damage-claims, POST /install-appointments"
  - priority: 9
    category: business_referential
    check: "The crew's crew_type matches the work: a DROP_BURY appointment requires crew_type BURY, an AERIAL_DROP appointment requires crew_type AERIAL, and a RESTORATION_FOLLOWUP appointment requires crew_type RESTORATION."
    error_id: ERR_CREW_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /install-appointments"
  - priority: 10
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2. Checked before any capacity, temporal or fiscal rule so that a terminal row always reports its state rather than a downstream business failure."
    error_id: "ERR_BUILD_ZONE_STATE_INVALID | ERR_SERVICE_ADDRESS_STATE_INVALID | ERR_MDU_AGREEMENT_STATE_INVALID | ERR_PERMIT_APPLICATION_STATE_INVALID | ERR_POLE_REQUEST_STATE_INVALID | ERR_PREORDER_STATE_INVALID | ERR_INSTALL_APPOINTMENT_STATE_INVALID | ERR_DAMAGE_CLAIM_STATE_INVALID | ERR_FALLBACK_OFFER_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 11
    category: state
    check: "Optimistic concurrency: the supplied expected_build_zone_version equals the current BuildZone.version, and the supplied expected_crew_version equals the current InstallCrew.version. Evaluated after the parent's own state precondition so that a stale client acting on a closed zone learns the state problem first."
    error_id: "ERR_STALE_BUILD_ZONE_VERSION | ERR_STALE_CREW_VERSION"
    http_status: 412
    applies_to: "POST /preorders, POST /install-appointments"
  - priority: 12
    category: business_safety
    check: "Permit readiness: every permit_type in the zone's required_permit_types has a PermitApplication in status APPROVED whose expires_at is strictly after current_utc. Lazy expiry runs first, so an APPROVED-but-expired permit is materialized to EXPIRED and then fails this check."
    error_id: ERR_PERMIT_READINESS_UNMET
    http_status: 409
    applies_to: "POST /build-zones/{id}/construction-start"
  - priority: 13
    category: business_safety
    check: "Pole readiness: the zone has at least one PoleAttachmentRequest in status ATTACHED. A merely ACCEPTED or SURVEYED request is not enough to break ground."
    error_id: ERR_POLE_READINESS_UNMET
    http_status: 409
    applies_to: "POST /build-zones/{id}/construction-start"
  - priority: 14
    category: business_safety
    check: "The zone's construction_status is IN_CONSTRUCTION or SERVICE_READY. Installing at an address in a zone that has not broken ground, or whose construction is SUSPENDED, is refused."
    error_id: ERR_ZONE_CONSTRUCTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /install-appointments"
  - priority: 15
    category: business_safety
    check: "The zone's outstanding_restoration_count is zero: every completed appointment that required restoration has a satisfying RESTORATION_FOLLOWUP. A zone cannot be declared service-ready while lawns and driveways are still torn up."
    error_id: ERR_RESTORATION_OUTSTANDING
    http_status: 409
    applies_to: "POST /build-zones/{id}/construction-complete"
  - priority: 16
    category: business_temporal
    check: "The zone's preregistration window is open: campaign_status is PREREG_OPEN or PREREG_EXTENDED and current_utc <= prereg_deadline_at (the deadline instant itself is still inside the window)."
    error_id: ERR_PREREG_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /preorders, PATCH /build-zones/{id}/threshold, POST /build-zones/{id}/extend-deadline"
  - priority: 17
    category: business_temporal
    check: "A qualification run may only evaluate zones whose prereg_deadline_at has passed: the run requires current_utc > prereg_deadline_at for at least one open zone of the campaign, and it silently skips zones still inside their window. When every open zone is still inside its window the run itself is refused."
    error_id: ERR_PREREG_DEADLINE_NOT_REACHED
    http_status: 409
    applies_to: "POST /campaigns/{id}/qualification-run"
  - priority: 18
    category: business_temporal
    check: "Window geometry: window_end_at is strictly after window_start_at, both land on exact minute boundaries with zero seconds, the duration is between MIN_WINDOW_MINUTES (30) and MAX_WINDOW_MINUTES (480) inclusive, and window_start_at is at or after current_utc."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /install-appointments"
  - priority: 19
    category: business_temporal
    check: "A RESTORATION_FOLLOWUP appointment's window_start_at is at or before the parent appointment's restoration_due_by, and the parent actually requires restoration (restoration_required is true and restoration_satisfied_at is null)."
    error_id: ERR_RESTORATION_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /install-appointments"
  - priority: 20
    category: business_temporal
    check: "The claim is filed within Campaign.claim_filing_window_days whole days of the appointment's completed_at, and the appointment is COMPLETED with restoration_required true (so a restoration_due_by exists). Filing after the window, or against an appointment that never disturbed the property, is refused."
    error_id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /damage-claims"
  - priority: 21
    category: business_constraint
    check: "No pairwise crew conflict: the new buffered half-open interval [window_start_at, window_end_at + travel_buffer_minutes) does not overlap that of any SCHEDULED appointment already on the crew. Adjacency at exactly the buffer edge is permitted."
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /install-appointments"
  - priority: 22
    category: business_constraint
    check: "Per-zone simultaneous bury cap: the number of SCHEDULED DROP_BURY appointments in the same build zone whose RAW windows overlap the new one is strictly less than BuildZone.max_concurrent_bury_ops. This aggregate is measured across all crews and, unlike the pairwise crew rule, ignores the travel buffer."
    error_id: ERR_ZONE_BURY_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /install-appointments"
  - priority: 23
    category: business_fiscal
    check: "Crew daily capacity: booked_minutes_on_date for the UTC date of window_start_at plus the new appointment's occupied_minutes is at most crew.daily_capacity_minutes. An exact fit at the capacity is accepted."
    error_id: ERR_CREW_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /install-appointments"
  - priority: 24
    category: business_constraint
    check: "The address is not already ruled out: its serviceability is not NOT_SERVICEABLE. An UNDETERMINED address may still be preordered - that is the whole point of a fiberhood campaign - so only a definite negative determination blocks sign-up."
    error_id: ERR_ADDRESS_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /preorders, POST /install-appointments"
  - priority: 25
    category: business_constraint
    check: "For an address whose dwelling_type is MDU, converting a preorder requires an MduOwnerAgreement for that address in status SIGNED. A CONDITIONAL_MDU address may collect preorders but cannot be built into without the owner's signature."
    error_id: ERR_MDU_AGREEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /preorders/{id}/conversion"
  - priority: 26
    category: business_constraint
    check: "Uniqueness: at most one Preorder per (service_address_id, account_id) pair whose preorder_status is PENDING, QUALIFIED or CONVERTED. A CANCELLED or LAPSED preorder does not block a fresh sign-up."
    error_id: ERR_DUPLICATE_PREORDER
    http_status: 409
    applies_to: "POST /preorders"
  - priority: 27
    category: business_constraint
    check: "The zone's extension_count is strictly less than Campaign.max_deadline_extensions. The new deadline is not supplied by the client: the endpoint always adds exactly Campaign.extension_grant_days whole days to the current prereg_deadline_at."
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /build-zones/{id}/extend-deadline"
  - priority: 28
    category: business_constraint
    check: "The agreement's counter_round is strictly less than max_counter_rounds before a COUNTER response is accepted."
    error_id: ERR_COUNTER_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /mdu-agreements/{id}/owner-response"
  - priority: 29
    category: business_constraint
    check: "A rejected permit application may be resubmitted only while submission_round - 1 is strictly less than max_resubmissions."
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit"
  - priority: 30
    category: business_constraint
    check: "A denied damage claim may be appealed only while appeal_count is strictly less than max_appeals."
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /damage-claims/{id}/appeal"
  - priority: 31
    category: business_constraint
    check: "A threshold adjustment may only lower the bar: the new threshold_pct is strictly less than the current threshold_pct and at least 0.01. Raising the threshold after subscribers have signed up on the advertised terms is forbidden."
    error_id: ERR_THRESHOLD_INCREASE_FORBIDDEN
    http_status: 409
    applies_to: "PATCH /build-zones/{id}/threshold"
  - priority: 32
    category: business_constraint
    check: "The fallback candidate pool computed by fallback_option_selection is non-empty after eligibility filtering and DECLINED exclusion."
    error_id: ERR_NO_FALLBACK_OPTION_AVAILABLE
    http_status: 409
    applies_to: "POST /service-addresses/{id}/fallback-offers"
  - priority: 33
    category: business_fiscal
    check: "The deposit tendered on a preorder equals the campaign's deposit_amount_cents exactly - no partial and no overpayment. Checked last, after every state, temporal and constraint rule, so a fiscal complaint never masks a structural one."
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /preorders"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# All paths are top-level collections under api_prefix "/" (which rstrips to ""),
# so every path below is the literal request path.
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving clock (last-resort namespace per the priority ladder) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical current_utc to any instant, so deadline, expiry, SLA and filing-window rules are reachable deterministically. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Moving the clock does not itself mutate any row; every lazy expiry is materialized by the next GET or POST that touches the row."
    roles: [ProgramManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock replaced; no row is written and no expiry is evaluated eagerly"]

  # --- campaigns ---
  - method: POST
    path: "/campaigns"
    description: "Creates a citywide fiber build campaign that supplies the default threshold, deposit amount, extension policy, restoration SLA and claim-filing window inherited by its zones."
    roles: [ProgramManager]
    code: 201
    input: ["name", "city", "prereg_window_open_at", "prereg_window_close_at", "default_threshold_pct", "deposit_amount_cents", "max_deadline_extensions?", "extension_grant_days?", "claim_filing_window_days?", "restoration_sla_days?", "late_filing_factor?"]
    output: Campaign
    side_effects: ["zone_count initialized to 0"]
  - method: GET
    path: "/campaigns/{id}"
    description: "Reads one campaign, including its computed zone_count."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/campaigns"
    description: "Lists campaigns, paginated."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: ["city?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/campaigns/{id}/qualification-run"
    description: "Closes out every zone of the campaign whose prereg_deadline_at has passed: computes the FINAL variant of zone_prereg_rate, marks each zone QUALIFIED or NOT_QUALIFIED, and cascades into that zone's preorders, deposits, ledger and account balances. Returns the zones the run evaluated. Zones still inside their window are skipped; when no zone is past its deadline the run is refused."
    roles: [ProgramManager]
    code: 200
    input: []
    output: BuildZone[]
    side_effects:
      - "per evaluated zone: final_qualifying_count, final_rate_pct and campaign_status written; version incremented"
      - "on QUALIFIED: counted PENDING preorders -> QUALIFIED, deposits stay HELD"
      - "on NOT_QUALIFIED: every PENDING preorder -> LAPSED with lapse_reason ZONE_NOT_QUALIFIED, each deposit HELD -> REFUNDED, one DEPOSIT_REFUNDED LedgerEntry per preorder, each Account.deposit_held_cents recomputed"
      - "on QUALIFIED but counts_toward_threshold false: that preorder -> LAPSED with lapse_reason ADDRESS_NOT_COUNTED and the same refund chain"
      - "on NOT_QUALIFIED: every UNDETERMINED or CONDITIONAL_MDU address of the zone -> NOT_SERVICEABLE with not_serviceable_reason BUILD_NOT_QUALIFIED"
  - method: POST
    path: "/campaigns/{id}/sequencing-run"
    description: "Ranks the campaign's QUALIFIED zones by zone_readiness_score and assigns build_sequence_index 1..n, moving each zone's construction_status from NOT_STARTED to SEQUENCED. Returns the zones in assigned order."
    roles: [ProgramManager]
    code: 200
    input: []
    output: BuildZone[]
    side_effects:
      - "zone_readiness_score computed and readiness_score written per QUALIFIED zone"
      - "build_sequence_index assigned by the pinned ranking; construction_status NOT_STARTED -> SEQUENCED; version incremented"
      - "readiness_posture recomputed"

  # --- build zones ---
  - method: POST
    path: "/build-zones"
    description: "Carves a fiberhood build zone out of the campaign's service area with its own household base, preregistration threshold, required permit types and simultaneous-bury cap."
    roles: [ProgramManager]
    code: 201
    input: ["campaign_id", "name", "zone_code", "household_count", "threshold_pct?", "required_permit_types?", "max_concurrent_bury_ops?"]
    output: BuildZone
    side_effects:
      - "threshold_pct defaults to the campaign's default_threshold_pct"
      - "prereg_deadline_at seeded from the campaign's prereg_window_close_at"
      - "campaign_status PREREG_OPEN, construction_status NOT_STARTED, readiness_posture recomputed"
      - "the campaign's zone_count recomputed"
  - method: GET
    path: "/build-zones/{id}"
    description: "Reads one build zone with every derived field: provisional and final rates, qualifying counts, make_ready_cost_cents, readiness_score, readiness_posture, build_sequence_index, outstanding_restoration_count and the version used for optimistic concurrency on POST /preorders."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: []
    output: BuildZone
    side_effects: ["lazy evaluation: an APPROVED-but-expired permit of this zone is materialized to EXPIRED and readiness_posture is recomputed before the row is returned"]
  - method: GET
    path: "/build-zones"
    description: "Lists build zones filtered by campaign and by either state dimension; this is the reverse-reachability channel for BuildZone.campaign_id."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: ["campaign_id?", "campaign_status?", "construction_status?", "limit?", "offset?"]
    output: BuildZone[]
    side_effects: []
  - method: PATCH
    path: "/build-zones/{id}/threshold"
    description: "Lowers the zone's preregistration threshold while the window is open. Raising it is refused, because subscribers signed up against the advertised bar."
    roles: [ProgramManager]
    code: 200
    input: [threshold_pct]
    output: BuildZone
    side_effects:
      - "threshold_pct replaced; the PROVISIONAL rate is recomputed against the new bar"
      - "version incremented, which invalidates any in-flight POST /preorders holding the old version"
  - method: POST
    path: "/build-zones/{id}/extend-deadline"
    description: "Grants one deadline extension: adds exactly the campaign's extension_grant_days whole days to prereg_deadline_at. The client supplies no date, so the new deadline is fully determined by the campaign policy."
    roles: [ProgramManager]
    code: 200
    input: []
    output: BuildZone
    side_effects:
      - "prereg_deadline_at += extension_grant_days; extension_count += 1; cumulative_extension_days += extension_grant_days"
      - "campaign_status PREREG_OPEN -> PREREG_EXTENDED, or PREREG_EXTENDED -> PREREG_EXTENDED (self-loop)"
      - "version incremented"
  - method: POST
    path: "/build-zones/{id}/construction-start"
    description: "Breaks ground on a qualified, sequenced zone once every required permit is APPROVED and unexpired and at least one pole attachment is ATTACHED, and allocates the make-ready cost across the zone's qualified preorders."
    roles: [ProgramManager]
    code: 200
    input: []
    output: BuildZone
    side_effects:
      - "construction_status SEQUENCED -> IN_CONSTRUCTION"
      - "make_ready_share_allocation runs, writing make_ready_share_cents on every QUALIFIED preorder of the zone with the floor-then-distribute remainder order"
      - "readiness_posture recomputed to READY; version incremented"
  - method: POST
    path: "/build-zones/{id}/construction-complete"
    description: "Declares the zone service-ready. Refused while any completed appointment that disturbed a property still lacks its restoration follow-up."
    roles: [ProgramManager]
    code: 200
    input: []
    output: BuildZone
    side_effects: ["construction_status IN_CONSTRUCTION -> SERVICE_READY; version incremented"]
  - method: POST
    path: "/build-zones/{id}/suspension"
    description: "Suspends or resumes construction on a zone. SUSPEND cancels the zone's scheduled appointments and releases the crews' minutes; RESUME returns the zone to IN_CONSTRUCTION and clears suspension_reason without restoring the cancelled appointments."
    roles: [ProgramManager]
    code: 200
    input: ["action", "suspension_reason?"]
    output: BuildZone
    side_effects:
      - "SUSPEND: construction_status IN_CONSTRUCTION -> SUSPENDED with suspension_reason (default MANUAL); every SCHEDULED appointment of the zone -> CANCELLED with cancellation_reason ZONE_SUSPENDED; each crew's booked_minutes_total and scheduled_appointment_count recomputed downward; each crew version incremented"
      - "RESUME: construction_status SUSPENDED -> IN_CONSTRUCTION; suspension_reason cleared to null"
      - "readiness_posture recomputed; version incremented"

  # --- service addresses ---
  - method: POST
    path: "/service-addresses"
    description: "Registers a passable address inside a build zone with its dwelling type, unit count and distance to the nearest node."
    roles: [ProgramManager]
    code: 201
    input: ["build_zone_id", "street_address", "dwelling_type", "unit_count?", "distance_to_node_m"]
    output: ServiceAddress
    side_effects:
      - "serviceability UNDETERMINED, exception_status NONE, counts_toward_threshold computed as true (an undetermined address counts provisionally)"
      - "the zone's version incremented"
  - method: GET
    path: "/service-addresses/{id}"
    description: "Reads one address with its serviceability posture, exception status, active fallback technology and threshold-counting flag."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: []
    output: ServiceAddress
    side_effects: ["lazy evaluation: an MduOwnerAgreement of this address that is past expires_at is materialized to EXPIRED and this address's serviceability is recomputed before the row is returned"]
  - method: GET
    path: "/service-addresses"
    description: "Lists addresses filtered by zone, serviceability or exception status; this is the reverse-reachability channel for ServiceAddress.build_zone_id."
    roles: [ProgramManager, InstallCoordinator, PermitOffice, UtilityOperator, ClaimsAssessor, ClaimsApprover, Subscriber, MduOwner]
    code: 200
    input: ["build_zone_id?", "serviceability?", "exception_status?", "dwelling_type?", "limit?", "offset?"]
    output: ServiceAddress[]
    side_effects: []
  - method: POST
    path: "/service-addresses/{id}/serviceability-determination"
    description: "Records the engineering determination for an address: SERVICEABLE, CONDITIONAL_MDU (buildable only with the owner's signature) or NOT_SERVICEABLE with a reason."
    roles: [ProgramManager]
    code: 200
    input: ["serviceability", "not_serviceable_reason?"]
    output: ServiceAddress
    side_effects:
      - "serviceability and serviceability_determined_at written; not_serviceable_reason required for NOT_SERVICEABLE and cleared otherwise"
      - "counts_toward_threshold recomputed on this address and on every PENDING preorder at it"
      - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; the zone's version incremented"
  - method: POST
    path: "/service-addresses/{id}/unserved-exception"
    description: "Drives the unserved-address exception workflow with action REQUEST, GRANT or DENY. A GRANTED exception is what authorizes an alternative-technology offer for an address the build cannot reach."
    roles: [ProgramManager]
    code: 200
    input: ["action", "exception_reason?"]
    output: ServiceAddress
    side_effects:
      - "exception_status NONE -> REQUESTED -> GRANTED or DENIED; exception_reason recorded on REQUEST"
      - "serviceability is not changed by any of the three actions"
  - method: POST
    path: "/service-addresses/{id}/fallback-offers"
    description: "Runs fallback_option_selection over the campaign's enabled alternative-technology options and creates exactly one FallbackOffer for the winner, snapshotting its technology, speed and price."
    roles: [ProgramManager]
    code: 201
    input: [account_id, expires_at]
    output: FallbackOffer
    side_effects:
      - "the chosen option is ranked by min_downstream_mbps DESC, monthly_price_cents ASC, priority_rank ASC, created_at ASC over the eligible pool"
      - "options this address previously DECLINED are excluded; an empty pool is refused"
      - "offer created in status OFFERED with offered_at = current_utc"

  # --- accounts ---
  - method: POST
    path: "/accounts"
    description: "Creates a subscriber, property-owner or business account. Account ids are the X-User-ID values used by the Subscriber and MduOwner roles."
    roles: [ProgramManager]
    code: 201
    input: [full_name, email, phone, account_type]
    output: Account
    side_effects: ["deposit_held_cents and credit_balance_cents initialized to 0"]
  - method: GET
    path: "/accounts/{id}"
    description: "Reads one account with its ledger-derived deposit_held_cents and credit_balance_cents."
    roles: [ProgramManager, ClaimsAssessor, ClaimsApprover, InstallCoordinator, Subscriber, MduOwner]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "Lists accounts, paginated and filterable by type."
    roles: [ProgramManager, ClaimsAssessor, ClaimsApprover, InstallCoordinator]
    code: 200
    input: ["account_type?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  # --- MDU owner agreements ---
  - method: POST
    path: "/mdu-agreements"
    description: "Opens a DRAFT access agreement between the program and the owner of an MDU address, with the access fee, the negotiation round cap and an expiry instant."
    roles: [ProgramManager]
    code: 201
    input: ["service_address_id", "owner_account_id", "access_fee_cents", "expires_at", "max_counter_rounds?"]
    output: MduOwnerAgreement
    side_effects: ["status DRAFT, offer_round 0, counter_round 0"]
  - method: GET
    path: "/mdu-agreements/{id}"
    description: "Reads one agreement with its negotiation rounds and signature instant."
    roles: [ProgramManager, InstallCoordinator, Subscriber, MduOwner]
    code: 200
    input: []
    output: MduOwnerAgreement
    side_effects: ["lazy evaluation: a SENT or COUNTERED agreement past expires_at is materialized to EXPIRED, which cascades the address to NOT_SERVICEABLE and recomputes the zone's rates, before the row is returned"]
  - method: GET
    path: "/mdu-agreements"
    description: "Lists agreements by address, owner account or status; this is the reverse-reachability channel for MduOwnerAgreement.service_address_id and .owner_account_id."
    roles: [ProgramManager, InstallCoordinator, Subscriber, MduOwner]
    code: 200
    input: ["service_address_id?", "owner_account_id?", "status?", "limit?", "offset?"]
    output: MduOwnerAgreement[]
    side_effects: []
  - method: POST
    path: "/mdu-agreements/{id}/offers"
    description: "Sends the owner an access-fee offer, from DRAFT or after a counter. Each call replaces access_fee_cents and increments offer_round."
    roles: [ProgramManager]
    code: 200
    input: [access_fee_cents]
    output: MduOwnerAgreement
    side_effects: ["status DRAFT -> SENT or COUNTERED -> SENT; access_fee_cents replaced; offer_round += 1"]
  - method: POST
    path: "/mdu-agreements/{id}/owner-response"
    description: "The MDU owner signs, declines or counters the standing offer. Counters are capped by max_counter_rounds; signing makes a CONDITIONAL_MDU address serviceable and declining or expiring makes it unserviceable."
    roles: [MduOwner]
    code: 200
    input: ["response", "countered_fee_cents?"]
    output: MduOwnerAgreement
    side_effects:
      - "SIGN: status -> SIGNED, signed_at written; the address CONDITIONAL_MDU -> SERVICEABLE; every PENDING preorder at it recomputes counts_toward_threshold; the zone's provisional counts and prereg_rate_pct recomputed; the zone's version incremented"
      - "DECLINE: status -> DECLINED; the address CONDITIONAL_MDU -> NOT_SERVICEABLE with not_serviceable_reason MDU_AGREEMENT_UNAVAILABLE; the same recomputation chain runs"
      - "COUNTER: status SENT -> COUNTERED; countered_fee_cents recorded; counter_round += 1"

  # --- permit applications ---
  - method: POST
    path: "/permit-applications"
    description: "Opens a DRAFT permit application of one required type for a build zone, with its validity period and resubmission cap."
    roles: [ProgramManager]
    code: 201
    input: [build_zone_id, permit_type, "valid_days?", "max_resubmissions?"]
    output: PermitApplication
    side_effects: ["status DRAFT, submission_round 0; the zone's readiness_posture recomputed"]
  - method: GET
    path: "/permit-applications/{id}"
    description: "Reads one permit application including approved_at, expires_at and the reviewing office's user id."
    roles: [ProgramManager, PermitOffice, InstallCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["lazy evaluation: an APPROVED application past expires_at is materialized to EXPIRED before the row is returned, and the zone's posture (and suspension, when in construction) follows"]
  - method: GET
    path: "/permit-applications"
    description: "Lists permit applications by zone, type or status; this is the reverse-reachability channel for PermitApplication.build_zone_id."
    roles: [ProgramManager, PermitOffice, InstallCoordinator]
    code: 200
    input: ["build_zone_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/permit-applications/{id}/submit"
    description: "Submits a DRAFT application, or resubmits a REJECTED one while the resubmission cap allows."
    roles: [ProgramManager]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status -> SUBMITTED; submission_round += 1; rejection_reason cleared"]
  - method: POST
    path: "/permit-applications/{id}/decision"
    description: "The permit office approves or rejects a submitted application. Approval starts the validity clock that construction-start later checks."
    roles: [PermitOffice]
    code: 200
    input: [decision, "rejection_reason?"]
    output: PermitApplication
    side_effects:
      - "APPROVE: status -> APPROVED, approved_at = current_utc, expires_at = approved_at + valid_days whole days, reviewer_user_id recorded"
      - "REJECT: status -> REJECTED with rejection_reason, reviewer_user_id recorded"
      - "the zone's readiness_posture recomputed"

  # --- pole attachment requests ---
  - method: POST
    path: "/pole-attachment-requests"
    description: "Asks a pole owner for attachment rights on a number of poles in the zone."
    roles: [ProgramManager]
    code: 201
    input: [build_zone_id, utility_owner, pole_count]
    output: PoleAttachmentRequest
    side_effects: ["status REQUESTED, make_ready_cost_cents 0; the zone's readiness_posture recomputed"]
  - method: GET
    path: "/pole-attachment-requests/{id}"
    description: "Reads one pole attachment request with its make-ready quote, survey instant and attachment instant."
    roles: [ProgramManager, UtilityOperator, InstallCoordinator]
    code: 200
    input: []
    output: PoleAttachmentRequest
    side_effects: []
  - method: GET
    path: "/pole-attachment-requests"
    description: "Lists pole attachment requests by zone or status; this is the reverse-reachability channel for PoleAttachmentRequest.build_zone_id."
    roles: [ProgramManager, UtilityOperator, InstallCoordinator]
    code: 200
    input: ["build_zone_id?", "status?", "limit?", "offset?"]
    output: PoleAttachmentRequest[]
    side_effects: []
  - method: POST
    path: "/pole-attachment-requests/{id}/survey"
    description: "The pole owner files the field survey and the make-ready cost quote."
    roles: [UtilityOperator]
    code: 200
    input: [make_ready_cost_cents]
    output: PoleAttachmentRequest
    side_effects: ["status REQUESTED -> SURVEYED; make_ready_cost_cents and survey_completed_at written; the zone's readiness_posture recomputed"]
  - method: POST
    path: "/pole-attachment-requests/{id}/decision"
    description: "Accepts the make-ready quote (program manager) or denies the attachment outright (utility operator). The two branches carry disjoint side effects: acceptance adds cost, denial suspends construction."
    roles: [ProgramManager, UtilityOperator]
    code: 200
    input: [decision, "denial_reason?"]
    output: PoleAttachmentRequest
    side_effects:
      - "ACCEPT: status SURVEYED -> ACCEPTED; the zone's make_ready_cost_cents recomputed to include this quote; the zone's version incremented"
      - "DENY: status SURVEYED -> DENIED with denial_reason; the zone's make_ready_cost_cents excludes this request"
      - "DENY cascade: an IN_CONSTRUCTION zone -> SUSPENDED with suspension_reason POLE_DENIED; that zone's SCHEDULED appointments -> CANCELLED with cancellation_reason ZONE_SUSPENDED; each crew's booked_minutes_total and scheduled_appointment_count recomputed downward; each crew version incremented"
      - "the zone's readiness_posture recomputed; the zone's version incremented"
  - method: POST
    path: "/pole-attachment-requests/{id}/attachment"
    description: "The pole owner confirms the cables are physically attached, which is the only pole state that satisfies the construction-start gate."
    roles: [UtilityOperator]
    code: 200
    input: []
    output: PoleAttachmentRequest
    side_effects: ["status ACCEPTED -> ATTACHED; attached_at = current_utc; the zone's readiness_posture recomputed; the zone's version incremented"]

  # --- preorders ---
  - method: POST
    path: "/preorders"
    description: "A subscriber preregisters an address for the build and remits the campaign deposit. Requires expected_build_zone_version so a sign-up priced against stale zone terms is refused."
    roles: [Subscriber]
    code: 201
    input: [build_zone_id, service_address_id, account_id, plan_tier, "unit_designator?", tendered_deposit_cents, expected_build_zone_version]
    output: Preorder
    side_effects:
      - "preorder_status PENDING, deposit_status HELD, deposit_amount_cents copied from the campaign"
      - "one LedgerEntry(DEPOSIT_HELD, +deposit_amount_cents) appended; Account.deposit_held_cents recomputed"
      - "counts_toward_threshold computed from the address's serviceability"
      - "the zone's provisional_qualifying_count and prereg_rate_pct recomputed; the zone's version incremented"
  - method: GET
    path: "/preorders/{id}"
    description: "Reads one preorder with both state dimensions, its frozen make_ready_share_cents and its conversion settlement figures."
    roles: [ProgramManager, InstallCoordinator, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: []
    output: Preorder
    side_effects: []
  - method: GET
    path: "/preorders"
    description: "Lists preorders by zone, address, account or either state dimension; this is the reverse-reachability channel for Preorder.build_zone_id, .service_address_id and .account_id."
    roles: [ProgramManager, InstallCoordinator, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: ["build_zone_id?", "service_address_id?", "account_id?", "preorder_status?", "deposit_status?", "limit?", "offset?"]
    output: Preorder[]
    side_effects: []
  - method: POST
    path: "/preorders/{id}/cancel"
    description: "Cancels a preorder. The deposit is refunded while the preorder is still PENDING and forfeited once the zone has qualified and committed to build."
    roles: [Subscriber, ProgramManager]
    code: 200
    input: []
    output: Preorder
    side_effects:
      - "preorder_status PENDING or QUALIFIED -> CANCELLED; cancelled_at = current_utc"
      - "from PENDING: deposit_status HELD -> REFUNDED with a DEPOSIT_REFUNDED LedgerEntry"
      - "from QUALIFIED: deposit_status HELD -> FORFEITED with a DEPOSIT_FORFEITED LedgerEntry"
      - "Account.deposit_held_cents recomputed; the zone's provisional counts and prereg_rate_pct recomputed; the zone's version incremented"
  - method: POST
    path: "/preorders/{id}/conversion"
    description: "Converts a qualified preorder into an install order, pinning the drop method and running conversion_settlement. The held deposit is applied at face value against the settled total."
    roles: [Subscriber, ProgramManager]
    code: 200
    input: [drop_method]
    output: Preorder
    side_effects:
      - "preorder_status QUALIFIED -> CONVERTED; converted_at = current_utc; drop_method pinned"
      - "conversion_pre_discount_total_cents, conversion_discount_cents and conversion_total_due_cents written by conversion_settlement"
      - "deposit_status HELD -> APPLIED with a DEPOSIT_APPLIED LedgerEntry; Account.deposit_held_cents recomputed"

  # --- install crews ---
  - method: POST
    path: "/install-crews"
    description: "Registers a bury, aerial or restoration crew with its travel buffer and daily capacity."
    roles: [InstallCoordinator]
    code: 201
    input: [name, crew_type, "travel_buffer_minutes?", "daily_capacity_minutes?"]
    output: InstallCrew
    side_effects: ["booked_minutes_total and scheduled_appointment_count initialized to 0"]
  - method: GET
    path: "/install-crews/{id}"
    description: "Reads one crew with its booked_minutes_total, scheduled_appointment_count and the version used for optimistic concurrency on POST /install-appointments."
    roles: [ProgramManager, InstallCoordinator]
    code: 200
    input: []
    output: InstallCrew
    side_effects: []
  - method: GET
    path: "/install-crews"
    description: "Lists crews, filterable by type."
    roles: [ProgramManager, InstallCoordinator]
    code: 200
    input: ["crew_type?", "limit?", "offset?"]
    output: InstallCrew[]
    side_effects: []

  # --- install appointments ---
  - method: POST
    path: "/install-appointments"
    description: "Schedules a drop-bury, aerial-drop or restoration-follow-up window on a crew for a converted preorder. Enforces the buffered pairwise conflict rule, the per-zone simultaneous bury cap and the crew's daily capacity, and requires expected_crew_version."
    roles: [InstallCoordinator]
    code: 201
    input: [preorder_id, crew_id, appointment_type, window_start_at, window_end_at, "parent_appointment_id?", expected_crew_version]
    output: InstallAppointment
    side_effects:
      - "status SCHEDULED; occupied_minutes = duration + the crew's travel_buffer_minutes"
      - "the crew's booked_minutes_total and scheduled_appointment_count recomputed upward; the crew's version incremented"
  - method: GET
    path: "/install-appointments/{id}"
    description: "Reads one appointment with its occupied_minutes, restoration obligation, restoration_due_by and satisfaction instant."
    roles: [ProgramManager, InstallCoordinator, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: []
  - method: GET
    path: "/install-appointments"
    description: "Lists appointments by preorder, crew, parent appointment or status; this is the reverse-reachability channel for InstallAppointment.preorder_id, .crew_id and the self-referential .parent_appointment_id."
    roles: [ProgramManager, InstallCoordinator, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: ["preorder_id?", "crew_id?", "parent_appointment_id?", "status?", "appointment_type?", "limit?", "offset?"]
    output: InstallAppointment[]
    side_effects: []
  - method: POST
    path: "/install-appointments/{id}/outcome"
    description: "Records how the visit ended: COMPLETED (optionally opening a restoration obligation, or satisfying the parent's when this is the follow-up), NO_SHOW, or CANCELLED. Every outcome releases the crew's minutes."
    roles: [InstallCoordinator]
    code: 200
    input: [outcome, "restoration_required?", "cancellation_reason?"]
    output: InstallAppointment
    side_effects:
      - "COMPLETED: completed_at = current_utc; when restoration_required is true, restoration_due_by = completed_at + the campaign's restoration_sla_days whole days and the zone's outstanding_restoration_count increases by 1"
      - "COMPLETED on a RESTORATION_FOLLOWUP: the parent appointment's restoration_satisfied_at = current_utc and the zone's outstanding_restoration_count decreases by 1, which unblocks construction-complete"
      - "NO_SHOW: no restoration obligation and no ledger effect"
      - "CANCELLED: cancellation_reason recorded"
      - "all three outcomes: the crew's booked_minutes_total and scheduled_appointment_count recomputed downward; the crew's version incremented"

  # --- damage claims ---
  - method: POST
    path: "/damage-claims"
    description: "A subscriber files a construction damage claim against a completed appointment for a lawn, irrigation, driveway or utility line. filed_at is stamped from the logical clock, which decides the standard-versus-late assessment variant."
    roles: [Subscriber]
    code: 201
    input: [install_appointment_id, service_address_id, claimant_account_id, damage_type, claimed_amount_cents, description, "max_appeals?"]
    output: DamageClaim
    side_effects: ["status FILED; filed_at = current_utc; appeal_count 0"]
  - method: GET
    path: "/damage-claims/{id}"
    description: "Reads one claim with its assessed amount, assessment variant, the assessing and deciding user ids and its appeal count."
    roles: [ProgramManager, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/damage-claims"
    description: "Lists claims by appointment, address, claimant or status; this is the reverse-reachability channel for DamageClaim.install_appointment_id, .service_address_id and .claimant_account_id."
    roles: [ProgramManager, ClaimsAssessor, ClaimsApprover, Subscriber]
    code: 200
    input: ["install_appointment_id?", "service_address_id?", "claimant_account_id?", "damage_type?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{id}/assessment"
    description: "The claims assessor prices the claim by applying the damage-type schedule cap and then the on-time or late-filing factor, and is recorded as assessed_by_user_id."
    roles: [ClaimsAssessor]
    code: 200
    input: []
    output: DamageClaim
    side_effects:
      - "status FILED or UNDER_ASSESSMENT (after an appeal) -> UNDER_ASSESSMENT"
      - "damage_claim_assessment runs, writing assessed_amount_cents and assessment_variant"
      - "assessed_by_user_id = the acting X-User-ID"
  - method: POST
    path: "/damage-claims/{id}/decision"
    description: "The claims approver pays or denies an assessed claim. Segregation of duties: the deciding X-User-ID must differ from assessed_by_user_id."
    roles: [ClaimsApprover]
    code: 200
    input: [decision, "denial_reason?"]
    output: DamageClaim
    side_effects:
      - "APPROVE: status -> PAID, paid_at = current_utc, one LedgerEntry(CLAIM_PAYOUT, +assessed_amount_cents) appended, Account.credit_balance_cents recomputed"
      - "DENY: status -> DENIED with denial_reason and no ledger entry"
      - "decided_by_user_id = the acting X-User-ID"
  - method: POST
    path: "/damage-claims/{id}/appeal"
    description: "The claimant appeals a denial, returning the claim to assessment while the appeal cap allows."
    roles: [Subscriber]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status DENIED -> UNDER_ASSESSMENT; appeal_count += 1; denial_reason cleared"]

  # --- fallback technology options ---
  - method: POST
    path: "/fallback-options"
    description: "Publishes an alternative-technology option for the campaign (fixed wireless, DSL partner or satellite partner) with its reach, speed, price and operator preference rank."
    roles: [ProgramManager]
    code: 201
    input: [campaign_id, technology, min_downstream_mbps, monthly_price_cents, max_serviceable_distance_m, priority_rank, "supports_mdu?", "option_status?"]
    output: FallbackTechnologyOption
    side_effects: []
  - method: GET
    path: "/fallback-options/{id}"
    description: "Reads one alternative-technology option."
    roles: [ProgramManager, InstallCoordinator, Subscriber]
    code: 200
    input: []
    output: FallbackTechnologyOption
    side_effects: []
  - method: GET
    path: "/fallback-options"
    description: "Lists alternative-technology options by campaign or availability; this is the reverse-reachability channel for FallbackTechnologyOption.campaign_id."
    roles: [ProgramManager, InstallCoordinator, Subscriber]
    code: 200
    input: ["campaign_id?", "option_status?", "technology?", "limit?", "offset?"]
    output: FallbackTechnologyOption[]
    side_effects: []

  # --- fallback offers ---
  - method: GET
    path: "/fallback-offers/{id}"
    description: "Reads one alternative-technology offer with its snapshotted technology, speed and price."
    roles: [ProgramManager, InstallCoordinator, Subscriber]
    code: 200
    input: []
    output: FallbackOffer
    side_effects: ["lazy evaluation: an OFFERED offer past expires_at is materialized to EXPIRED before the row is returned"]
  - method: GET
    path: "/fallback-offers"
    description: "Lists offers by address, option, account or status; this is the reverse-reachability channel for FallbackOffer.service_address_id, .fallback_option_id and .account_id."
    roles: [ProgramManager, InstallCoordinator, Subscriber]
    code: 200
    input: ["service_address_id?", "fallback_option_id?", "account_id?", "status?", "limit?", "offset?"]
    output: FallbackOffer[]
    side_effects: []
  - method: POST
    path: "/fallback-offers/{id}/response"
    description: "The subscriber accepts or declines the standing alternative-technology offer. Accepting stamps the address's active_fallback_technology; declining permanently removes that option from this address's future candidate pools."
    roles: [Subscriber]
    code: 200
    input: [response]
    output: FallbackOffer
    side_effects:
      - "ACCEPT: status -> ACCEPTED, responded_at = current_utc, the address's active_fallback_technology set from the snapshot"
      - "DECLINE: status -> DECLINED, responded_at = current_utc, the option excluded from later selections for this address"

  # --- ledger (append-only, immutable) ---
  - method: GET
    path: "/ledger-entries/{id}"
    description: "Reads one immutable ledger entry. LedgerEntry has no version field and no update or delete endpoint."
    roles: [ProgramManager, ClaimsApprover, Subscriber]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "Lists ledger entries by account, preorder, damage claim or type; this is the reverse-reachability channel for LedgerEntry.account_id, .preorder_id and .damage_claim_id, and the only discovery channel for entries created by cascade."
    roles: [ProgramManager, ClaimsApprover, Subscriber]
    code: 200
    input: ["account_id?", "preorder_id?", "damage_claim_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role outside the eight declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a preorder, claim, offer or agreement whose owning account id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID deciding a damage claim equals the X-User-ID that recorded its assessment"
  # existence
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "no Campaign with the referenced id"
  - id: ERR_BUILD_ZONE_NOT_FOUND
    http: 404
    condition: "no BuildZone with the referenced id"
  - id: ERR_SERVICE_ADDRESS_NOT_FOUND
    http: 404
    condition: "no ServiceAddress with the referenced id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account with the referenced id"
  - id: ERR_MDU_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no MduOwnerAgreement with the referenced id"
  - id: ERR_PERMIT_APPLICATION_NOT_FOUND
    http: 404
    condition: "no PermitApplication with the referenced id"
  - id: ERR_POLE_REQUEST_NOT_FOUND
    http: 404
    condition: "no PoleAttachmentRequest with the referenced id"
  - id: ERR_PREORDER_NOT_FOUND
    http: 404
    condition: "no Preorder with the referenced id"
  - id: ERR_INSTALL_CREW_NOT_FOUND
    http: 404
    condition: "no InstallCrew with the referenced id"
  - id: ERR_INSTALL_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "no InstallAppointment with the referenced id, including a parent_appointment_id that resolves to nothing"
  - id: ERR_DAMAGE_CLAIM_NOT_FOUND
    http: 404
    condition: "no DamageClaim with the referenced id"
  - id: ERR_FALLBACK_OPTION_NOT_FOUND
    http: 404
    condition: "no FallbackTechnologyOption with the referenced id"
  - id: ERR_FALLBACK_OFFER_NOT_FOUND
    http: 404
    condition: "no FallbackOffer with the referenced id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "no LedgerEntry with the referenced id"
  # request shape and referential coherence
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum value, out-of-range number, unparseable timestamp, or pagination limit outside 1..100 / negative offset"
  - id: ERR_ADDRESS_LINKAGE_MISMATCH
    http: 422
    condition: "two supplied references disagree: the address does not belong to the supplied zone, an MDU agreement targets a SINGLE_FAMILY address, a claim's appointment does not serve the supplied address, or a follow-up's parent appointment serves a different preorder"
  - id: ERR_CREW_TYPE_MISMATCH
    http: 422
    condition: "the crew's crew_type does not match the appointment_type (DROP_BURY needs BURY, AERIAL_DROP needs AERIAL, RESTORATION_FOLLOWUP needs RESTORATION)"
  # state
  - id: ERR_BUILD_ZONE_STATE_INVALID
    http: 409
    condition: "the zone's campaign_status or construction_status does not permit the requested transition (e.g. construction-start on a zone that is not SEQUENCED, resume on a zone that is not SUSPENDED)"
  - id: ERR_SERVICE_ADDRESS_STATE_INVALID
    http: 409
    condition: "the address's serviceability or exception_status does not permit the request (e.g. GRANT on an exception that was never REQUESTED, or a fallback offer for an address whose exception_status is not GRANTED)"
  - id: ERR_MDU_AGREEMENT_STATE_INVALID
    http: 409
    condition: "the agreement is not in a state that accepts the action (offer on a SIGNED agreement, owner response on a DRAFT or EXPIRED one)"
  - id: ERR_PERMIT_APPLICATION_STATE_INVALID
    http: 409
    condition: "the application is not in a state that accepts the action (decision on a DRAFT, submit on an APPROVED or EXPIRED one)"
  - id: ERR_POLE_REQUEST_STATE_INVALID
    http: 409
    condition: "the pole request is not in a state that accepts the action (decision before survey, attachment before acceptance, any action on DENIED or ATTACHED)"
  - id: ERR_PREORDER_STATE_INVALID
    http: 409
    condition: "the preorder's preorder_status does not permit the action (conversion of a PENDING or LAPSED row, cancel of a CONVERTED row, a second conversion)"
  - id: ERR_INSTALL_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "the appointment is not SCHEDULED, so no outcome can be recorded; or a claim is filed against an appointment that is not COMPLETED"
  - id: ERR_DAMAGE_CLAIM_STATE_INVALID
    http: 409
    condition: "the claim is not in a state that accepts the action (decision before assessment, appeal of a PAID or UNDER_ASSESSMENT claim, assessment of a PAID claim)"
  - id: ERR_FALLBACK_OFFER_STATE_INVALID
    http: 409
    condition: "the offer is not OFFERED, so it cannot be accepted or declined (already answered, or lazily expired)"
  # optimistic concurrency
  - id: ERR_STALE_BUILD_ZONE_VERSION
    http: 412
    condition: "expected_build_zone_version does not equal the zone's current version"
  - id: ERR_STALE_CREW_VERSION
    http: 412
    condition: "expected_crew_version does not equal the crew's current version"
  # construction readiness and safety
  - id: ERR_PERMIT_READINESS_UNMET
    http: 409
    condition: "construction-start on a zone with a required permit type that has no unexpired APPROVED application"
  - id: ERR_POLE_READINESS_UNMET
    http: 409
    condition: "construction-start on a zone with no PoleAttachmentRequest in status ATTACHED"
  - id: ERR_ZONE_CONSTRUCTION_NOT_ACTIVE
    http: 409
    condition: "an install appointment is scheduled in a zone whose construction_status is not IN_CONSTRUCTION or SERVICE_READY"
  - id: ERR_RESTORATION_OUTSTANDING
    http: 409
    condition: "construction-complete while the zone's outstanding_restoration_count is greater than zero"
  # temporal
  - id: ERR_PREREG_WINDOW_CLOSED
    http: 409
    condition: "a preorder, threshold adjustment or extension is attempted after prereg_deadline_at, or on a zone already QUALIFIED or NOT_QUALIFIED"
  - id: ERR_PREREG_DEADLINE_NOT_REACHED
    http: 409
    condition: "a qualification run is attempted while every open zone of the campaign is still inside its preregistration window"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end_at is not strictly after window_start_at, either instant carries non-zero seconds, the duration falls outside 30..480 minutes, or window_start_at is before current_utc"
  - id: ERR_RESTORATION_WINDOW_MISSED
    http: 422
    condition: "a RESTORATION_FOLLOWUP is scheduled to start after the parent's restoration_due_by, or the parent has no outstanding restoration obligation"
  - id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http: 409
    condition: "a damage claim is filed more than claim_filing_window_days after the appointment's completed_at, or against an appointment that required no restoration"
  # capacity and constraints
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "the new buffered half-open interval overlaps an existing SCHEDULED appointment on the same crew"
  - id: ERR_ZONE_BURY_CONCURRENCY_EXCEEDED
    http: 409
    condition: "the number of SCHEDULED DROP_BURY appointments in the zone whose raw windows overlap the new one already equals BuildZone.max_concurrent_bury_ops"
  - id: ERR_CREW_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "the crew's booked minutes for that UTC date plus the new occupied_minutes would exceed daily_capacity_minutes"
  - id: ERR_ADDRESS_NOT_SERVICEABLE
    http: 409
    condition: "a preorder or appointment targets an address whose serviceability is NOT_SERVICEABLE"
  - id: ERR_MDU_AGREEMENT_REQUIRED
    http: 409
    condition: "conversion at an MDU address with no MduOwnerAgreement in status SIGNED"
  - id: ERR_DUPLICATE_PREORDER
    http: 409
    condition: "a second preorder for the same (service_address_id, account_id) pair while an earlier one is PENDING, QUALIFIED or CONVERTED"
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 409
    condition: "an extension is requested when extension_count already equals the campaign's max_deadline_extensions"
  - id: ERR_COUNTER_LIMIT_REACHED
    http: 409
    condition: "an owner counter is submitted when counter_round already equals max_counter_rounds"
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "a rejected permit application is resubmitted when submission_round - 1 already equals max_resubmissions"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "a denied claim is appealed when appeal_count already equals max_appeals"
  - id: ERR_THRESHOLD_INCREASE_FORBIDDEN
    http: 409
    condition: "a threshold adjustment supplies a threshold_pct greater than or equal to the zone's current threshold_pct"
  - id: ERR_NO_FALLBACK_OPTION_AVAILABLE
    http: 409
    condition: "the eligible alternative-technology pool for the address is empty after distance, MDU-support, option_status and prior-decline filtering"
  # fiscal
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 402
    condition: "tendered_deposit_cents does not equal the campaign's deposit_amount_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramManager
    description: "Fiber program operator: creates campaigns, zones, addresses and accounts, negotiates MDU access, files permits, accepts make-ready quotes, and drives qualification, sequencing, construction and suspension."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /campaigns"
      - "POST /campaigns/{id}/qualification-run"
      - "POST /campaigns/{id}/sequencing-run"
      - "POST /build-zones"
      - "PATCH /build-zones/{id}/threshold"
      - "POST /build-zones/{id}/extend-deadline"
      - "POST /build-zones/{id}/construction-start"
      - "POST /build-zones/{id}/construction-complete"
      - "POST /build-zones/{id}/suspension"
      - "POST /service-addresses"
      - "POST /service-addresses/{id}/serviceability-determination"
      - "POST /service-addresses/{id}/unserved-exception"
      - "POST /service-addresses/{id}/fallback-offers"
      - "POST /accounts"
      - "POST /mdu-agreements"
      - "POST /mdu-agreements/{id}/offers"
      - "POST /permit-applications"
      - "POST /permit-applications/{id}/submit"
      - "POST /pole-attachment-requests"
      - "POST /fallback-options"
    shared_operations:
      - "POST /pole-attachment-requests/{id}/decision (ACCEPT branch; shared with UtilityOperator, who owns the DENY branch)"
      - "POST /preorders/{id}/cancel (shared with the owning Subscriber)"
      - "POST /preorders/{id}/conversion (shared with the owning Subscriber)"
      - "every GET endpoint"
  - name: PermitOffice
    description: "Municipal permitting authority: the only actor that can approve or reject a submitted permit application."
    identity: "opaque"
    exclusive_operations:
      - "POST /permit-applications/{id}/decision"
    shared_operations:
      - "GET /campaigns, GET /campaigns/{id}, GET /build-zones, GET /build-zones/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /permit-applications, GET /permit-applications/{id}"
  - name: UtilityOperator
    description: "Pole owner: surveys attachment requests, quotes make-ready cost, denies attachments, and confirms physical attachment."
    identity: "opaque"
    exclusive_operations:
      - "POST /pole-attachment-requests/{id}/survey"
      - "POST /pole-attachment-requests/{id}/attachment"
    shared_operations:
      - "POST /pole-attachment-requests/{id}/decision (DENY branch; shared with ProgramManager, who owns the ACCEPT branch)"
      - "GET /campaigns, GET /campaigns/{id}, GET /build-zones, GET /build-zones/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /pole-attachment-requests, GET /pole-attachment-requests/{id}"
  - name: InstallCoordinator
    description: "Field scheduling operator: registers crews, books drop-bury, aerial-drop and restoration-follow-up windows, and records visit outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /install-crews"
      - "POST /install-appointments"
      - "POST /install-appointments/{id}/outcome"
    shared_operations:
      - "GET /install-crews, GET /install-crews/{id}, GET /install-appointments, GET /install-appointments/{id}, GET /preorders, GET /preorders/{id}, GET /build-zones, GET /build-zones/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /accounts, GET /accounts/{id}, GET /mdu-agreements, GET /mdu-agreements/{id}, GET /permit-applications, GET /permit-applications/{id}, GET /pole-attachment-requests, GET /pole-attachment-requests/{id}, GET /fallback-options, GET /fallback-options/{id}, GET /fallback-offers, GET /fallback-offers/{id}, GET /campaigns, GET /campaigns/{id}"
  - name: ClaimsAssessor
    description: "Damage adjuster: prices filed claims against the schedule caps and filing-timeliness factor. Cannot decide the claims it prices."
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-claims/{id}/assessment"
    shared_operations:
      - "GET /damage-claims, GET /damage-claims/{id}, GET /install-appointments, GET /install-appointments/{id}, GET /preorders, GET /preorders/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /accounts, GET /accounts/{id}, GET /build-zones, GET /build-zones/{id}, GET /campaigns, GET /campaigns/{id}"
  - name: ClaimsApprover
    description: "Claims authoriser: pays or denies an assessed claim. Segregation of duties forbids the same X-User-ID from assessing and deciding one claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-claims/{id}/decision"
    shared_operations:
      - "GET /damage-claims, GET /damage-claims/{id}, GET /ledger-entries, GET /ledger-entries/{id}, GET /install-appointments, GET /install-appointments/{id}, GET /preorders, GET /preorders/{id}, GET /accounts, GET /accounts/{id}, GET /build-zones, GET /build-zones/{id}, GET /campaigns, GET /campaigns/{id}"
  - name: Subscriber
    description: "Resident or business preregistering an address: signs up, cancels, converts to an order, answers alternative-technology offers, and files and appeals damage claims. X-User-ID is the Account id."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /preorders"
      - "POST /damage-claims"
      - "POST /damage-claims/{id}/appeal"
      - "POST /fallback-offers/{id}/response"
    shared_operations:
      - "POST /preorders/{id}/cancel (shared with ProgramManager; only for its own preorder)"
      - "POST /preorders/{id}/conversion (shared with ProgramManager; only for its own preorder)"
      - "GET /preorders, GET /preorders/{id}, GET /damage-claims, GET /damage-claims/{id}, GET /ledger-entries, GET /ledger-entries/{id}, GET /install-appointments, GET /install-appointments/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /build-zones, GET /build-zones/{id}, GET /campaigns, GET /campaigns/{id}, GET /accounts/{id}, GET /mdu-agreements, GET /mdu-agreements/{id}, GET /fallback-options, GET /fallback-options/{id}, GET /fallback-offers, GET /fallback-offers/{id}"
  - name: MduOwner
    description: "Owner of a multi-dwelling-unit property: the only actor that can sign, counter or decline the access agreement for its building. X-User-ID is the Account id recorded as owner_account_id."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /mdu-agreements/{id}/owner-response"
    shared_operations:
      - "GET /mdu-agreements, GET /mdu-agreements/{id}, GET /service-addresses, GET /service-addresses/{id}, GET /build-zones, GET /build-zones/{id}, GET /campaigns, GET /campaigns/{id}, GET /accounts/{id}"
