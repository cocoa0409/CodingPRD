      - name: multi_hop_cascades_are_covered_by_the_difficulty_design
        excluded_because:
          difficulty_instance: appeal_overturn_four_hop_cascade_to_auto_travel_training_referral
          rationale: "The end-to-end N-level chains for this layer are constructed there (appeal decision -> successor determination -> applicant mirrors -> auto referral, four hops) and in determination_expiry_three_hop_cascade_withdraws_travel_training (three hops). The instance above adds only what those do not test: the ORDERING sensitivity between two day-close steps that write the same applicant."

  - section: consistency_model
    instances:
      - name: every_derived_value_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.determination_term_and_expiry
        distinguishing_aspect: "The declared model is immediate, so no read-after-write delay is ever required: the submit response already carries determination_due_date, the scores response already carries recommended_category and recommended_term_days, the issue response already carries term_days, expires_at and status ISSUED, and the immediately following applicant read (no sweep, no second write) already shows current_eligibility_status ELIGIBLE with the category and active_determination_id mirrors set."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; a fresh applicant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Liesel Brandt", date_of_birth: "1949-09-09", residence_zone: "IN_SERVICE_AREA", mobility_aid: "MANUAL_WHEELCHAIR" }
              as: IntakeClerk
              captures: { rider_id: $.data.id, initial_state: $.data.current_eligibility_status }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 25, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
          trigger:
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
              captures: { sub_status: $.data.status, sub_due: $.data.determination_due_date, sub_completeness: $.data.completeness_established_at, sub_missing: $.data.missing_items }
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. X Ferreira", provider_type: "PHYSICIAN", provider_license_number: "MD-90033" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["c5 spinal cord injury"], attests_permanent: true }
              as: IntakeClerk
              captures: { recv_status: $.data.status, recv_wait: $.data.wait_days }
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 2, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { asmt_id: $.data.id, asmt_attendance: $.data.attendance_status, asmt_scoring: $.data.scoring_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_id}/attendance"
              payload: { attendance_status: "ATTENDED" }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 0, wayfinding_score: 1, distance_meters_walked: 25, heat_sensitivity_flag: false }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { score_rec: $.data.recommended_category, score_term: $.data.recommended_term_days, score_status: $.data.scoring_status }
            - call: "POST /assessments/${asmt_id}/sign-off"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-2"
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { appn_v: $.data.version }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v}", category: "UNCONDITIONAL", effective_date: "2026-08-06", rationale: "cannot use fixed route at all" }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { det_id: $.data.id, draft_status: $.data.status, draft_expires: $.data.expires_at }
            - call: "POST /determinations/${det_id}/issue"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { iss_status: $.data.status, iss_term: $.data.term_days, iss_expires: $.data.expires_at, iss_by: $.data.determined_by_user_id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { mirror_state: $.data.current_eligibility_status, mirror_cat: $.data.eligibility_category, mirror_active: $.data.active_determination_id }
          assert:
            - "${initial_state} == \"NONE\" on creation"
            - "the submit response itself carries ${sub_status} == \"SUBMITTED\", ${sub_due} == \"2026-08-22\", ${sub_completeness} == \"2026-08-01T00:00:00.000Z\" and ${sub_missing} == []"
            - "the receive response itself carries ${recv_status} == \"RECEIVED\" and ${recv_wait} == 0"
            - "the assessment creation response carries ${asmt_attendance} == \"SCHEDULED\" and ${asmt_scoring} == \"NOT_STARTED\""
            - "the scores response carries ${score_status} == \"SCORED\", ${score_rec} == \"UNCONDITIONAL\" and ${score_term} == 1825 — no second read needed"
            - "${draft_status} == \"DRAFT\" with ${draft_expires} == null, while the issue response carries ${iss_status} == \"ISSUED\", ${iss_term} == 1825, ${iss_expires} == \"2031-08-05\" and ${iss_by} == \"spec-1\""
            - "the very next applicant read shows ${mirror_state} == \"ELIGIBLE\", ${mirror_cat} == \"UNCONDITIONAL\" and ${mirror_active} == ${det_id} — cross-entity mirrors never lag"
