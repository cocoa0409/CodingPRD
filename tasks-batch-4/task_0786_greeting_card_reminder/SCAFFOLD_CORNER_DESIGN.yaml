  # ---------------- Cross-cutting: optimistic concurrency ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: submit_stale_account_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-submit-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - entities.Account.fields.version
        distinguishing_aspect: "Two draft orders share one observed Account.version; submitting the first advances the version, so submitting the second with the same stale expected_account_version returns ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["Account with 2 credits, VERIFIED contact, card, two draft orders; version observed before either submit."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "occ1@x.com", display_name: "OCC1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/credit-adjustments"
              payload: { delta: 2, reason: "MANUAL_ADJUST" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Oc", address_line1: "1 O", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "COCC", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "a", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "b", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_b: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_a}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
