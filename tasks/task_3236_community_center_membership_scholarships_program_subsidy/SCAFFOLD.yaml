# =============================================================================
# SCAFFOLD: Community Center Membership, Scholarships & Program Subsidy (YMCA)
# task_3236_community_center_membership_scholarships_program_subsidy
# =============================================================================

scenario: |
  Community Center Membership, Scholarships & Program Subsidy (YMCA): membership categories by household composition with joining fees and monthly draft billing, financial assistance applications using income documentation with sliding scale awards and annual renewal, branch-level program registration for swim lessons, childcare, camps and sports with member priority windows, childcare licensing compliance and staff ratio requirements inside a membership facility, facility scheduling across pools, gyms and studios balancing member drop-in use with programs and rentals, association-wide fundraising campaigns that fund scholarships with branch goals, membership hold, cancellation and nationwide reciprocity rules, volunteer and board governance at the branch and association level

domain_name: community-center-membership
api_prefix: ""  # flat topology: collections live at the API root

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: pricing engine
  complexity_layers:
    - optimistic concurrency
    - cascading side effects
    - dual-variant calculation
    - rate / threshold triggers
    - scheduled / deferred actions
    - temporal windowing
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED - EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association legal name" }
      - { name: reciprocity_enabled, type: boolean, source: input, default: true, description: "Whether visiting members from other associations may use branches at reciprocity rates" }
      - { name: ami_base_cents, type: integer, source: input, description: "Area median income for a 1-person household, in cents; basis for the sliding scale" }
      - { name: campaign_year, type: integer, source: input, description: "Active fundraising campaign year" }

  - name: Branch
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; owning association" }
      - { name: code, type: string, source: input, description: "Branch code; unique within the association" }
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: branch_goal_cents, type: integer, source: input, description: "Branch share of the association campaign goal" }
      - { name: scholarship_pool_received_cents, type: integer, source: computed, default: 0, description: "Sum of Donation.amount_cents for this branch with status RECEIVED and designation SCHOLARSHIP" }
      - { name: scholarship_pool_obligated_cents, type: integer, source: computed, default: 0, description: "Sum of award_obligation_cents of ScholarshipApplications in APPROVED status at this branch" }
      - { name: scholarship_pool_available_cents, type: integer, source: computed, default: 0, description: "= scholarship_pool_received_cents - scholarship_pool_obligated_cents; never allowed to go negative" }
      - { name: active_membership_count, type: integer, source: computed, default: 0, description: "Count of Memberships at this branch with status ACTIVE or ON_HOLD" }

  - name: MembershipCategory
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch offering this category" }
      - { name: name, type: string, source: input, description: "Category display name" }
      - { name: household_type, type: enum, source: input, description: "ADULT | TWO_ADULT | FAMILY | SENIOR | YOUNG_ADULT | TEEN" }
      - { name: joining_fee_cents, type: integer, source: input, description: "One-time joining fee in cents" }
      - { name: monthly_dues_cents, type: integer, source: input, description: "Standard monthly draft amount in cents before assistance" }
      - { name: max_adults, type: integer, source: input, description: "Maximum adult (>=18) members on one membership of this category" }
      - { name: max_dependents, type: integer, source: input, description: "Maximum dependent (<18) members on one membership of this category" }
      - { name: hold_fee_cents, type: integer, source: input, default: 1000, description: "Flat monthly draft while membership is ON_HOLD" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full legal name" }
      - { name: email, type: string, source: input, description: "Member email; unique across the association" }
      - { name: birth_date, type: string, source: input, description: "ISO date; determines adult/dependent eligibility and age-gated programs" }
      - { name: home_branch_id, type: string, source: input, description: "FK -> Branch.id; branch where the member joined" }
      - { name: visiting_association_name, type: string, source: input, default: null, description: "Set only for reciprocity visitors; null for home members" }

  - name: Membership
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch that owns the membership" }
      - { name: category_id, type: string, source: input, description: "FK -> MembershipCategory.id; category governs dues, joining fee, household caps" }
      - { name: primary_member_id, type: string, source: input, description: "FK -> Member.id; the adult responsible for billing" }
      - { name: member_ids, type: array, source: input, description: "All Member.ids on the membership (includes primary); bounded by category caps" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_HOLD | LAPSED | CANCELLED" }
      - { name: draft_status, type: enum, source: system, description: "Parallel billing dimension: CURRENT | RETRY_PENDING | DELINQUENT" }
      - { name: assistance_pct, type: number, source: system, default: 0, description: "Awarded subsidy fraction in {0, 0.25, 0.50, 0.75}; set from the governing ScholarshipApplication" }
      - { name: joining_fee_charged_cents, type: integer, source: system, default: 0, description: "Joining fee actually charged at activation (waived for renewals within 30 days of cancel/lapse)" }
      - { name: anniversary_day, type: integer, source: system, description: "Day of month (1-28) on which the monthly draft runs; set at activation" }
      - { name: hold_started_on, type: string, source: system, default: null, description: "ISO date the current hold began; null when not ON_HOLD" }
      - { name: hold_until, type: string, source: system, default: null, description: "ISO date the current hold ends (exclusive); null when not ON_HOLD" }
      - { name: lapsed_on, type: string, source: system, default: null, description: "ISO date the membership lapsed; null otherwise" }
      - { name: delinquent_since, type: string, source: system, default: null, description: "ISO date draft_status entered DELINQUENT; null otherwise" }
      - { name: hold_days_used_trailing_12mo, type: integer, source: computed, default: 0, description: "Calendar days spent ON_HOLD within the trailing 365 days, merging overlapping hold intervals" }
      - { name: lifetime_billed_cents, type: integer, source: system, default: 0, description: "Cumulative cents successfully drafted minus reversals; the billing conserved quantity" }

  - name: BillingDraft
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; membership being drafted" }
      - { name: period_month, type: string, source: system, description: "Billing period in YYYY-MM form" }
      - { name: amount_cents, type: integer, source: computed, description: "Draft amount per calculation monthly_draft_amount" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of failed collection attempts" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | FAILED" }
      - { name: kind, type: enum, source: system, description: "REGULAR | JOINING_FEE | HOLD_FEE" }

  - name: ScholarshipApplication
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch adjudicating the application" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; membership the award would subsidize" }
      - { name: applicant_member_id, type: string, source: input, description: "FK -> Member.id; applying adult (must equal membership primary)" }
      - { name: household_size, type: integer, source: input, description: "Persons in household, 1..12" }
      - { name: annual_income_cents, type: integer, source: input, description: "Documented gross annual household income" }
      - { name: documentation, type: array, source: input, description: "Document kinds supplied: TAX_RETURN | PAY_STUB | BENEFITS_LETTER; at least one required" }
      - { name: income_ratio, type: number, source: computed, description: "annual_income_cents / (ami_base_cents * household_multiplier(household_size)), rounded to 4 decimals round_half_up" }
      - { name: preview_award_pct, type: number, source: computed, default: null, description: "Provisional sliding-scale tier at submission; informational only, no pool obligation" }
      - { name: award_pct, type: number, source: system, default: null, description: "Final sliding-scale subsidy fraction decided at approval; one of {0.25, 0.50, 0.75}" }
      - { name: award_obligation_cents, type: integer, source: computed, default: 0, description: "Annualized obligation = 12 * monthly_dues_cents * award_pct, reserved from branch pool at approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | MORE_INFO_REQUIRED | APPROVED | DENIED | EXPIRED" }
      - { name: award_start_on, type: string, source: system, default: null, description: "ISO date the award takes effect (approval date)" }
      - { name: award_end_on, type: string, source: system, default: null, description: "ISO date the award lapses: award_start_on + 365 days (annual renewal)" }
      - { name: renews_application_id, type: string, source: input, default: null, description: "FK -> ScholarshipApplication.id; prior EXPIRED application this one renews" }

  - name: Program
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch running the program" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: kind, type: enum, source: input, description: "SWIM_LESSON | CHILDCARE | CAMP | SPORTS" }
      - { name: member_only, type: boolean, source: input, default: false, description: "When true only members of this association may register" }
      - { name: member_priority_days, type: integer, source: input, default: 0, description: "Days immediately before the public window during which only home-branch members may register" }
      - { name: min_age, type: integer, source: input, default: 0, description: "Minimum participant age in years (inclusive)" }
      - { name: max_age, type: integer, source: input, default: 99, description: "Maximum participant age in years (inclusive)" }
      - { name: base_fee_cents, type: integer, source: input, description: "Full member fee in cents before discounts" }
      - { name: non_member_multiplier, type: number, source: input, default: 1.5, description: "Fee multiplier applied to non-members" }
      - { name: is_licensed_childcare, type: boolean, source: input, default: false, description: "When true the session enforces licensing staff-ratio rules" }
      - { name: licensed_children_per_staff, type: integer, source: input, default: null, description: "Licensing ratio: max children per staff member; required when is_licensed_childcare" }

  - name: ProgramSession
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; parent program" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; denormalized from program for scoping" }
      - { name: space_id, type: string, source: input, description: "FK -> FacilitySpace.id; space the session occupies" }
      - { name: start_on, type: string, source: input, description: "First session date (ISO date)" }
      - { name: end_on, type: string, source: input, description: "Last session date (ISO date), >= start_on" }
      - { name: time_start, type: string, source: input, description: "Daily start time HH:MM (24h)" }
      - { name: time_end, type: string, source: input, description: "Daily end time HH:MM (24h), > time_start" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrolled participants" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Registrations with status REGISTERED" }
      - { name: waitlist_count, type: integer, source: computed, default: 0, description: "Registrations with status WAITLISTED" }
      - { name: staff_member_ids, type: array, source: input, default: [], description: "Staff Member.ids assigned; drives licensing ratio" }
      - { name: public_opens_on, type: string, source: system, description: "= start_on - 14 days; public registration window opens on this date" }
      - { name: member_opens_on, type: string, source: system, description: "= public_opens_on - program.member_priority_days; member-priority window runs [member_opens_on, public_opens_on)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REG_OPEN | REG_CLOSED | COMPLETED | CANCELLED" }

  - name: Registration
    parent: ProgramSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ProgramSession.id; session enrolled in" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; account registering (may be a non-member walk-in record)" }
      - { name: participant_name, type: string, source: input, description: "Participant full name (may differ from account holder, e.g. a child)" }
      - { name: participant_birth_date, type: string, source: input, description: "Participant ISO birth date; drives age-gating" }
      - { name: registrant_class, type: enum, source: system, description: "HOME_MEMBER | ASSOCIATION_MEMBER | RECIPROCITY_VISITOR | NON_MEMBER" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Per calculation registration_fee" }
      - { name: waitlist_position, type: integer, source: system, default: null, description: "1-based position among WAITLISTED; null when REGISTERED or terminal" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CANCELLED | REFUNDED | EXPIRED" }

  - name: FacilitySpace
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch containing the space" }
      - { name: name, type: string, source: input, description: "Space name (e.g. Pool A, Gym, Studio 2)" }
      - { name: kind, type: enum, source: input, description: "POOL | GYM | STUDIO | CHILDCARE_ROOM" }
      - { name: capacity, type: integer, source: input, description: "Maximum simultaneous occupants" }
      - { name: dropin_capacity, type: integer, source: input, description: "Capacity guaranteed for member drop-in use even during reservations" }

  - name: FacilityReservation
    parent: FacilitySpace
    common_fields: true
    fields:
      - { name: space_id, type: string, source: input, description: "FK -> FacilitySpace.id; reserved space" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; denormalized for scoping" }
      - { name: session_id, type: string, source: input, default: null, description: "FK -> ProgramSession.id; set for PROGRAM reservations" }
      - { name: reservation_type, type: enum, source: input, description: "PROGRAM | RENTAL | MAINTENANCE | BLACKOUT" }
      - { name: start_at, type: string, source: input, description: "ISO datetime reservation begins" }
      - { name: end_at, type: string, source: input, description: "ISO datetime reservation ends (exclusive), > start_at" }
      - { name: buffer_minutes, type: integer, source: system, description: "Setup/teardown buffer applied to BOTH ends per type: PROGRAM=15, RENTAL=30, MAINTENANCE=0, BLACKOUT=0" }
      - { name: renter_member_id, type: string, source: input, default: null, description: "FK -> Member.id; renting party for RENTAL reservations" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CANCELLED | COMPLETED" }

  - name: Campaign
    parent: Association
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; owning association" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Association-wide fundraising goal" }
      - { name: base_raised_cents, type: integer, source: computed, default: 0, description: "Sum of Donation.amount_cents with status RECEIVED on this campaign" }
      - { name: match_pct, type: number, source: computed, default: 0, description: "Board matching tier keyed on base attainment: <50% -> 0, >=50% -> 0.10, >=100% -> 0.25" }
      - { name: matched_raised_cents, type: integer, source: computed, default: 0, description: "= base_raised_cents * (1 + match_pct), integer cents round_half_up" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED" }

  - name: Donation
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign receiving the gift" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch credited (funds its scholarship pool when designated SCHOLARSHIP)" }
      - { name: donor_member_id, type: string, source: input, default: null, description: "FK -> Member.id; donating member, null for anonymous" }
      - { name: amount_cents, type: integer, source: input, description: "Gift amount in cents, > 0" }
      - { name: designation, type: enum, source: input, description: "SCHOLARSHIP | GENERAL" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | REFUNDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: >
      Two parallel state dimensions evolve on the same row: `status`
      (ACTIVE | ON_HOLD | LAPSED | CANCELLED) and `draft_status`
      (CURRENT | RETRY_PENDING | DELINQUENT). Billing failures move only
      draft_status; 45 consecutive days DELINQUENT moves status to LAPSED.
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /memberships/{membershipId}/hold"
        actor: Member | BranchDirector
        preconditions:
          - "membership.status == ACTIVE (else ERR_INVALID_STATE)"
          - "hold_until - current_date >= 30 days and <= 180 days (ERR_HOLD_WINDOW_INVALID)"
          - "hold_days_used_trailing_12mo + requested_days <= 120 (ERR_HOLD_ALLOWANCE_EXCEEDED)"
        side_effects:
          - "membership.hold_started_on = current_date; hold_until = requested"
          - "future drafts during the hold are created with kind=HOLD_FEE at category.hold_fee_cents"

      - from: ON_HOLD
        to: ACTIVE
        trigger: "system (clock reaches hold_until) or POST /memberships/{membershipId}/resume"
        actor: Member | BranchDirector | system
        preconditions: []
        side_effects:
          - "hold_days_used_trailing_12mo recomputed by interval merge of hold windows"
          - "next REGULAR draft resumes at full assisted dues"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: Member | BranchDirector
        preconditions: []
        side_effects:
          - "any APPROVED ScholarshipApplication with membership_id == this membership -> EXPIRED; branch.scholarship_pool_obligated_cents -= award_obligation_cents; that pool release itself raises scholarship_pool_available_cents"
          - "membership.assistance_pct -> 0"
          - "branch.active_membership_count -= 1"

      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: Member | BranchDirector
        preconditions: []
        side_effects:
          - "same scholarship deobligation cascade as ACTIVE -> CANCELLED"
          - "branch.active_membership_count -= 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "system (draft_status has been DELINQUENT for 45 consecutive days)"
        actor: system
        preconditions: []
        side_effects:
          - "lapsed_on = current_date"
          - "any APPROVED ScholarshipApplication for this membership -> EXPIRED; pool obligation released"
          - "branch.active_membership_count -= 1"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/reinstate"
        actor: BranchDirector
        preconditions:
          - "current_date - lapsed_on <= 90 days (ERR_REINSTATE_WINDOW_PASSED)"
          - "no BillingDraft for this membership remains in FAILED status (all settled)"
        side_effects:
          - "membership.status -> ACTIVE, draft_status -> CURRENT, delinquent_since -> null"
          - "branch.active_membership_count += 1"

      - from: "draft_status:CURRENT"
        to: "draft_status:RETRY_PENDING"
        trigger: "POST /drafts/{draftId}/fail"
        actor: BranchDirector | AssociationAdmin
        preconditions:
          - "draft.status IN {PENDING, FAILED} and attempt_count < 3"
        side_effects:
          - "draft.attempt_count += 1; draft.status -> FAILED"
          - "if attempt_count reaches 3: membership.draft_status -> DELINQUENT, delinquent_since = current_date (else RETRY_PENDING)"

      - from: "draft_status:RETRY_PENDING"
        to: "draft_status:CURRENT"
        trigger: "POST /drafts/{draftId}/settle"
        actor: Member | BranchDirector | FrontDesk
        preconditions: []
        side_effects:
          - "draft.status -> PAID; membership.lifetime_billed_cents += draft.amount_cents"
          - "if no FAILED drafts remain for the membership: draft_status -> CURRENT"

      - from: "draft_status:DELINQUENT"
        to: "draft_status:CURRENT"
        trigger: "POST /drafts/{draftId}/settle (on the last remaining FAILED draft)"
        actor: Member | BranchDirector | FrontDesk
        preconditions: []
        side_effects:
          - "membership.lifetime_billed_cents += draft.amount_cents; delinquent_since -> null; 45-day lapse countdown cleared"

  - entity: ScholarshipApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, EXPIRED]
    note: "Branching with revert: UNDER_REVIEW -> MORE_INFO_REQUIRED -> UNDER_REVIEW forms a cycle; annual renewal creates a new application linked via renews_application_id."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /scholarship-applications/{applicationId}/review"
        actor: BranchDirector
        preconditions:
          - "application.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: MORE_INFO_REQUIRED
        trigger: "POST /scholarship-applications/{applicationId}/request-info"
        actor: BranchDirector
        preconditions: []
        side_effects: []

      - from: MORE_INFO_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /scholarship-applications/{applicationId}/submit-info"
        actor: Member
        preconditions:
          - "acting member's X-User-ID == applicant_member_id (else ERR_UNAUTHORIZED)"
          - "documentation contains at least one of TAX_RETURN, PAY_STUB, BENEFITS_LETTER (ERR_DOCUMENTATION_MISSING)"
        side_effects:
          - "income_ratio and preview_award_pct recomputed from any updated annual_income_cents / household_size"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /scholarship-applications/{applicationId}/approve"
        actor: BranchDirector
        preconditions:
          - "final income_ratio yields award_pct in {0.25, 0.50, 0.75}; ratio >= 0.80 is ineligible and must be denied (ERR_AWARD_INELIGIBLE)"
          - "no other ScholarshipApplication for this membership is currently APPROVED (ERR_DUPLICATE_ACTIVE_AWARD)"
          - "branch.scholarship_pool_available_cents >= 12 * category.monthly_dues_cents * award_pct (ERR_POOL_EXHAUSTED)"
          - "OCC: expected_membership_version == membership.version (ERR_STALE_VERSION)"
        side_effects:
          - "membership.assistance_pct = award_pct; membership.version += 1"
          - "award_obligation_cents = 12 * monthly_dues_cents * award_pct; branch.scholarship_pool_obligated_cents += award_obligation_cents (pool_available recomputed)"
          - "award_start_on = current_date; award_end_on = award_start_on + 365 days"
          - "all PENDING BillingDrafts for this membership have amount_cents recomputed under the new assistance_pct"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /scholarship-applications/{applicationId}/deny"
        actor: BranchDirector
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock reaches award_end_on) or cascade from membership CANCELLED / LAPSED"
        actor: system
        preconditions: []
        side_effects:
          - "branch.scholarship_pool_obligated_cents -= award_obligation_cents"
          - "membership.assistance_pct -> 0 unless a renewal application (renews_application_id == this application) is already APPROVED, in which case the renewal's award_pct applies"

  - entity: ProgramSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Clock-driven compound: status flips on registration_opens_on / start_on / end_on boundaries."
    transitions:
      - from: SCHEDULED
        to: REG_OPEN
        trigger: "system (clock reaches member_opens_on)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REG_OPEN
        to: REG_CLOSED
        trigger: "system (clock reaches end of start_on day) or POST /sessions/{sessionId}/close-registration"
        actor: system | ProgramCoordinator | BranchDirector
        preconditions: []
        side_effects:
          - "every WAITLISTED Registration -> EXPIRED; waitlist_count -> 0"
          - "no new registrations accepted afterwards"

      - from: REG_CLOSED
        to: COMPLETED
        trigger: "system (clock passes end_on)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{sessionId}/cancel"
        actor: ProgramCoordinator | BranchDirector
        preconditions: []
        side_effects:
          - "every REGISTERED Registration -> REFUNDED; enrolled_count -> 0"
          - "every WAITLISTED Registration -> EXPIRED; waitlist_count -> 0"
          - "any linked PROGRAM FacilityReservation (session_id == this) in REQUESTED or APPROVED -> CANCELLED, releasing the space"

      - from: REG_OPEN
        to: CANCELLED
        trigger: "POST /sessions/{sessionId}/cancel"
        actor: ProgramCoordinator | BranchDirector
        preconditions: []
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED"

  - entity: Registration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, REFUNDED, EXPIRED]
    note: "Waitlist promotion forms a repeatable sibling chain: cancel -> promote head -> cancel -> promote next."
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /registrations/{registrationId}/cancel"
        actor: Member | ProgramCoordinator | FrontDesk
        preconditions:
          - "session.status IN {SCHEDULED, REG_OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "session.enrolled_count -= 1"
          - "head-of-line WAITLISTED registration (lowest waitlist_position; waitlist_position ties broken by created_at ASC, never id) -> REGISTERED; its fee_charged_cents computed at promotion time; enrolled_count += 1; remaining WAITLISTED positions each decrement by 1"
          - "promotion is skipped (seat stays open) when a licensed-childcare ratio check would fail for the head candidate: in that case the next eligible candidate is promoted instead"
          - "if cancellation occurs within 48h before session start_on, fee_charged_cents is forfeited; otherwise it is refunded"

      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (waitlist promotion after a REGISTERED cancellation, or after staff assignment raises ratio capacity)"
        actor: system
        preconditions:
          - "licensed childcare: post-promotion enrolled_count <= licensed_children_per_staff * len(staff_member_ids) (ERR_RATIO_CAPACITY_EXCEEDED skips the candidate)"
        side_effects:
          - "fee_charged_cents computed per registration_fee for the promoted participant"
          - "enrolled_count += 1; waitlist_count -= 1; waitlist_position -> null"

      - from: REGISTERED
        to: REFUNDED
        trigger: "cascade from ProgramSession cancel"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: EXPIRED
        trigger: "cascade from session REG_CLOSED or session cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FacilityReservation
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /reservations/{reservationId}/approve"
        actor: BranchDirector
        preconditions:
          - "no APPROVED reservation on the same space whose buffered interval [start_at - buffer_minutes, end_at + buffer_minutes) intersects this one's buffered interval (ERR_SPACE_CONFLICT); touching endpoints (one buffered interval ends exactly when the other begins) are allowed"
          - "an APPROVED BLACKOUT on the space covering any part of the requested interval blocks approval (ERR_SPACE_CONFLICT)"
        side_effects: []

      - from: REQUESTED
        to: DENIED
        trigger: "POST /reservations/{reservationId}/deny"
        actor: BranchDirector
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/cancel or cascade from session cancel"
        actor: BranchDirector | ProgramCoordinator | system
        preconditions: []
        side_effects:
          - "space availability restored"

      - from: APPROVED
        to: COMPLETED
        trigger: "system (clock passes end_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{campaignId}/activate"
        actor: AssociationAdmin
        preconditions:
          - "no other Campaign for this association has status ACTIVE (ERR_CAMPAIGN_ALREADY_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /campaigns/{campaignId}/close"
        actor: AssociationAdmin
        preconditions:
          - "OCC: expected_campaign_version == campaign.version (ERR_STALE_VERSION)"
        side_effects:
          - "campaign.version += 1"
          - "match_pct and matched_raised_cents frozen at closing values; later refunds reduce base_raised_cents but do NOT recompute match_pct"
          - "PLEDGED donations remain PLEDGED but can no longer be received"

  - entity: Donation
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /donations/{donationId}/receive"
        actor: BranchDirector | AssociationAdmin
        preconditions:
          - "campaign.status == ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
        side_effects:
          - "campaign.base_raised_cents += amount_cents; campaign.version += 1; match_pct recomputed from new attainment"
          - "if designation == SCHOLARSHIP: branch.scholarship_pool_received_cents += amount_cents; this pool credit itself raises scholarship_pool_available_cents and may unblock a scholarship approve that was previously failing ERR_POOL_EXHAUSTED"

      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /donations/{donationId}/refund"
        actor: AssociationAdmin
        preconditions:
          - "if designation == SCHOLARSHIP: refund must not make branch.scholarship_pool_available_cents negative (ERR_POOL_WOULD_GO_NEGATIVE)"
        side_effects:
          - "campaign.base_raised_cents -= amount_cents; campaign.version += 1; match_pct recomputed only while campaign.status == ACTIVE"
          - "if designation == SCHOLARSHIP: branch.scholarship_pool_received_cents -= amount_cents (pool_available recomputed)"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only - OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: scholarship-approve-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /scholarship-applications/{applicationId}/approve"
    occ_field: "expected_membership_version"
    description: |
      Approving a scholarship award against a Membership whose version has
      advanced since the BranchDirector last observed it is rejected with 412.
      The award mutates membership.assistance_pct and rewrites PENDING drafts,
      so a stale view of the membership (e.g. a category change or a hold that
      was applied after the director's review screen loaded) fails closed
      rather than overwriting the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: membership-update-stale-version
    parent_entity: Membership
    write_endpoint: "PATCH /memberships/{membershipId}"
    occ_field: "expected_membership_version"
    description: |
      Updating membership mutable fields (category_id change, member_ids
      household edit) requires the caller to present the membership version
      last observed; a stale version is rejected so an operator editing
      household composition cannot silently overwrite a category change or an
      assistance award that landed on the same row in the meantime.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-close-stale-version
    parent_entity: Campaign
    write_endpoint: "POST /campaigns/{campaignId}/close"
    occ_field: "expected_campaign_version"
    description: |
      Closing a campaign requires the campaign version the admin last
      observed; donations received in between advance the version, and the
      stale close is rejected so the frozen match_pct reflects the true final
      attainment rather than a snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: household_multiplier
    trigger: "ScholarshipApplication submit / submit-info; also used by membership category cap checks"
    algorithm: threshold
    formula: |
      household_multiplier(n) = 0.80 + 0.20 * min(n, 12)
      # n=1 -> 1.00, n=2 -> 1.20, n=4 -> 1.60, n=12 -> 3.20
    input_set: "household_size of the application"
    precision: "2 decimal places, round_half_up"

  - name: sliding_scale_award
    trigger: "ScholarshipApplication creation (preview) and approve (final)"
    algorithm: threshold
    formula: |
      income_ratio = round4(annual_income_cents / (ami_base_cents * household_multiplier(household_size)))
      if income_ratio < 0.30:  award_pct = 0.75
      elif income_ratio < 0.50: award_pct = 0.50
      elif income_ratio < 0.80: award_pct = 0.25
      else: ineligible (ERR_AWARD_INELIGIBLE on approve)
      # boundary precision: ratio EXACTLY 0.30 falls to the 0.50 tier; EXACTLY 0.50 falls to the 0.25 tier; EXACTLY 0.80 is ineligible
    input_set: "annual_income_cents, household_size, association.ami_base_cents (association resolved through branch.association_id)"
    constants:
      TIER1_CEILING: 0.30
      TIER2_CEILING: 0.50
      TIER3_CEILING: 0.80
    precision: "income_ratio rounded to 4 decimals, round_half_up, BEFORE tier comparison"
    variants:
      - name: provisional_at_submission
        when: "application is created or resubmitted (SUBMITTED / MORE_INFO_REQUIRED -> UNDER_REVIEW)"
        difference: "writes preview_award_pct from the declared inputs; informational only; no pool obligation; does not touch membership.assistance_pct"
      - name: final_at_approval
        when: "approve transition"
        difference: "recomputes income_ratio from the (possibly corrected) verified inputs; writes award_pct; obligates the branch pool; if verified income differs from declared, final award_pct can differ from preview_award_pct"

  - name: monthly_draft_amount
    trigger: "BillingDraft creation (POST /memberships/{id}/drafts) and PENDING-draft recompute on award approve"
    algorithm: threshold
    formula: |
      # evaluation order pinned to break the circular-looking dependency
      # (assistance_pct is awarded against dues, but hold status changes the base):
      #   step 1: select base by membership.status
      #   step 2: apply assistance_pct to that base
      if membership.status == ON_HOLD:
        base = category.hold_fee_cents        # kind = HOLD_FEE
      else:
        base = category.monthly_dues_cents    # kind = REGULAR
      amount_cents = round_half_up(base * (1 - membership.assistance_pct))
    input_set: "membership.status, category.hold_fee_cents, category.monthly_dues_cents, membership.assistance_pct"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_prorated
        when: "the first REGULAR draft created at membership activation mid-month"
        difference: "amount = round_half_up(full_assisted_amount * remaining_days_in_activation_month / days_in_activation_month), remaining days counted inclusively from the activation day"
      - name: standard_full
        when: "anniversary-day recurring drafts and recompute on award approve"
        difference: "full monthly assisted amount, no proration"

  - name: registration_fee
    trigger: "Registration creation and waitlist promotion"
    algorithm: tiered_pricing
    formula: |
      # nested rounding order pinned: compute the gross with ONE rounding,
      # then apply assistance with a SECOND rounding. Never round multipliers.
      if registrant_class IN {HOME_MEMBER, ASSOCIATION_MEMBER}:
        gross = program.base_fee_cents
      elif registrant_class == RECIPROCITY_VISITOR:
        gross = round_half_up(program.base_fee_cents * 1.25)
      else:  # NON_MEMBER
        gross = round_half_up(program.base_fee_cents * program.non_member_multiplier)
      if registrant has an ACTIVE or ON_HOLD membership at the session's branch:
        fee_charged_cents = round_half_up(gross * (1 - membership.assistance_pct))
      else:
        fee_charged_cents = gross
    input_set: "registrant_class (derived from member record vs session branch), program.base_fee_cents, program.non_member_multiplier, membership.assistance_pct when present"
    constants:
      RECIPROCITY_SURCHARGE: 1.25
    precision: "integer cents, round_half_up at each pinned rounding step"

  - name: licensed_ratio_capacity
    trigger: "Registration create for a program with is_licensed_childcare=true; waitlist promotion for such programs; session staff assignment"
    algorithm: threshold
    formula: |
      max_children = program.licensed_children_per_staff * len(session.staff_member_ids)
      effective_capacity = min(session.capacity, max_children)
      a new registration gets status REGISTERED iff enrolled_count + 1 <= effective_capacity;
      otherwise it becomes WAITLISTED (it is NOT an error to waitlist)
      # unstaffed licensed sessions (len(staff_member_ids) == 0) accept zero children: every registration waitlists
    input_set: "session REGISTERED registrations, session.staff_member_ids, program.licensed_children_per_staff, session.capacity"
    precision: "integers only"
    variants:
      - name: with_ratio_enforced
        when: "program.is_licensed_childcare == true"
        difference: "effective capacity = min(session.capacity, ratio * staff_count)"
      - name: without_ratio
        when: "program.is_licensed_childcare == false"
        difference: "effective capacity = session.capacity"

  - name: campaign_attainment_and_match
    trigger: "Donation receive / refund (refund recomputes only while campaign ACTIVE)"
    algorithm: threshold
    formula: |
      base_raised_cents = sum(amount_cents of Donation where campaign_id == campaign.id and status == RECEIVED)
      attainment = round4(base_raised_cents / campaign.goal_cents)
      if attainment < 0.50:  match_pct = 0
      elif attainment < 1.00: match_pct = 0.10
      else: match_pct = 0.25
      matched_raised_cents = round_half_up(base_raised_cents * (1 + match_pct))
      # boundary: attainment exactly 0.50 -> 0.10 tier; exactly 1.00 -> 0.25 tier
    input_set: "RECEIVED donations on the campaign only; PLEDGED excluded; REFUNDED removed at refund time"
    precision: "attainment rounded to 4 decimals round_half_up BEFORE tier comparison; matched_raised in integer cents round_half_up"
    variants:
      - name: live_attainment
        when: "campaign.status == ACTIVE"
        difference: "recomputed on every receive/refund; the match tier moves up AND down with attainment"
      - name: frozen_attainment
        when: "campaign.status == CLOSED"
        difference: "match_pct and matched_raised_cents frozen at close; refunds after close reduce base_raised_cents but leave the frozen fields untouched"

  - name: hold_allowance_interval_merge
    trigger: "Membership hold request"
    algorithm: interval_merge
    formula: |
      windows = all [hold_started_on, min(hold_until, resume_date if resumed early)) intervals of this membership
      clip each window to [current_date - 365 days, current_date]
      merge overlapping or adjacent clipped intervals (gap == 0 merges)
      hold_days_used_trailing_12mo = sum of merged interval lengths in days
      new request allowed iff hold_days_used_trailing_12mo + requested_days <= 120
      # boundary: total exactly 120 days is ALLOWED (<=); 121 days rejected
    input_set: "membership hold windows (current + historical), current_date"
    constants:
      HOLD_ALLOWANCE_DAYS: 120
      TRAILING_WINDOW_DAYS: 365
    precision: "whole days"

  - name: pool_available_reconciliation
    trigger: "Donation receive/refund, scholarship approve, award expiry, membership cancel/lapse with award"
    algorithm: aggregation
    formula: |
      branch.scholarship_pool_available_cents =
          sum(d.amount_cents for Donation d at branch where d.status == RECEIVED and d.designation == SCHOLARSHIP)
        - sum(a.award_obligation_cents for ScholarshipApplication a at branch where a.status == APPROVED)
    input_set: "branch donations with explicit status/designation filters; branch applications with explicit status filter"
    precision: "integer cents"
    variants:
      - name: forward_looking_recompute
        when: "stored as denormalized field on Branch"
        difference: "recomputed eagerly on each triggering mutation and persisted on the Branch row"
      - name: chronological_replay
        when: "audit/verification read"
        difference: "derived by replaying donation + application state events in created_at ASC order; MUST equal the forward-looking value (the compensating refund transition is what keeps both consistent)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present when the role is entity_backed (Member)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per 1.7; ownership rule: Member may act only on resources they own (primary_member_id / applicant_member_id / member_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "every path id exists; non-UUID or unknown id -> ERR_NOT_FOUND"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "body foreign keys resolve: branch_id, association_id, category_id (must belong to the same branch as the membership), primary_member_id, space_id (must belong to the session's branch), session_id, renews_application_id"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_SPACE_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with FK inputs"

  - priority: 5
    category: state
    check: "target resource is in a state where the operation is legal (approve only from UNDER_REVIEW, hold only from ACTIVE, receive only when campaign ACTIVE, reinstate only from LAPSED, ...)"
    error_id: "ERR_INVALID_STATE | ERR_CAMPAIGN_NOT_ACTIVE | ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "request body schema: required fields present, enum values valid, time ranges sane (end > start), household composition within category caps, documentation non-empty, amount_cents > 0, household_size 1..12"
    error_id: "ERR_INVALID_REQUEST | ERR_DOCUMENTATION_MISSING | ERR_HOUSEHOLD_CAP_EXCEEDED | ERR_TIME_RANGE_INVALID"
    http_status: 400
    applies_to: "create/update endpoints"

  - priority: 7
    category: business_safety
    check: "childcare licensing: registration into an is_licensed_childcare session keeps post-count <= licensed_children_per_staff * len(staff_member_ids); promotion that would break ratio skips the candidate"
    error_id: ERR_RATIO_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions/{id}/registrations, waitlist promotion, POST /sessions/{id}/staff"

  - priority: 8
    category: business_temporal
    check: "time-window rules: registration windows (member-priority vs public vs closed), hold window 30..180 days, participant age within [min_age, max_age], program.member_only gating"
    error_id: "ERR_REGISTRATION_WINDOW_CLOSED | ERR_MEMBER_PRIORITY_ONLY | ERR_HOLD_WINDOW_INVALID | ERR_PARTICIPANT_AGE_INVALID | ERR_MEMBER_ONLY_PROGRAM"
    http_status: 409
    applies_to: "registrations, membership hold"

  - priority: 9
    category: business_constraint
    check: "capacity and uniqueness: session seat capacity drives waitlisting, space temporal-overlap incl. per-type buffers, one APPROVED award per membership, one ACTIVE campaign per association, one draft per membership+period_month, unique member email, unique branch code"
    error_id: "ERR_SESSION_FULL | ERR_SPACE_CONFLICT | ERR_DUPLICATE_ACTIVE_AWARD | ERR_CAMPAIGN_ALREADY_ACTIVE | ERR_DUPLICATE_DRAFT | ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_BRANCH_CODE"
    http_status: 409
    applies_to: "create/action endpoints with uniqueness or capacity constraints"

  - priority: 10
    category: business_fiscal
    check: "fiscal limits last: pool solvency (approve, refund), hold allowance 120 days, award eligibility ratio, reinstate window 90 days"
    error_id: "ERR_POOL_EXHAUSTED | ERR_POOL_WOULD_GO_NEGATIVE | ERR_AWARD_INELIGIBLE | ERR_HOLD_ALLOWANCE_EXCEEDED | ERR_REINSTATE_WINDOW_PASSED"
    http_status: 409
    applies_to: "approve, refund, hold, reinstate"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in 1.2.1"

# =============================================================================
# 1.5 API Endpoint Table
#
# Flat topology: every entity has a canonical collection segment directly under
# the api_prefix. Parent scoping is expressed via FK body fields and list
# filters, not URL nesting (except sub-resource list endpoints used for FK
# reverse-reachability).
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default startup time is exactly 2026-09-01T00:00:00Z; the server MUST NOT use wall-clock time. Clock-driven transitions (hold auto-resume at hold_until, session SCHEDULED->REG_OPEN at member_opens_on, REG_OPEN->REG_CLOSED at end of start_on, REG_CLOSED->COMPLETED after end_on, reservation APPROVED->COMPLETED at end_at, award APPROVED->EXPIRED at award_end_on, membership ACTIVE->LAPSED after 45 days DELINQUENT) evaluate against this clock."
    roles: [AssociationAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["advances logical clock; may fire automatic transitions"]

  # --- Association ---
  - method: POST
    path: "/associations"
    description: "Create an association"
    roles: [AssociationAdmin]
    code: 201
    input: [name, "reciprocity_enabled?", ami_base_cents, campaign_year]
    output: Association
    side_effects: []

  - method: GET
    path: "/associations/{associationId}"
    description: "Get an association"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, BoardMember]
    code: 200
    input: []
    output: Association
    side_effects: []

  - method: GET
    path: "/associations/{associationId}/branches"
    description: "List branches of an association (FK reverse-reachability for Branch.association_id)"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, BoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "Branch[]"
    side_effects: []

  - method: GET
    path: "/associations/{associationId}/campaigns"
    description: "List campaigns of an association (FK reverse-reachability for Campaign.association_id)"
    roles: [AssociationAdmin, BranchDirector, BoardMember, FrontDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []

  # --- Branch ---
  - method: POST
    path: "/branches"
    description: "Create a branch"
    roles: [AssociationAdmin]
    code: 201
    input: [association_id, code, name, branch_goal_cents]
    output: Branch
    side_effects: ["pool counters = 0; active_membership_count = 0"]

  - method: GET
    path: "/branches/{branchId}"
    description: "Get a branch (includes computed pool + membership counts)"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, BoardMember]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: GET
    path: "/branches"
    description: "List branches, filterable by association_id"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, BoardMember]
    code: 200
    input: ["association_id?", "limit?", "offset?"]
    output: "Branch[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/memberships"
    description: "List memberships of a branch"
    roles: [AssociationAdmin, BranchDirector, FrontDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/categories"
    description: "List categories of a branch"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, Member, BoardMember]
    code: 200
    input: ["household_type?", "limit?", "offset?"]
    output: "MembershipCategory[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/programs"
    description: "List programs of a branch"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, Member, BoardMember]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "Program[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/spaces"
    description: "List facility spaces of a branch"
    roles: [AssociationAdmin, BranchDirector, ProgramCoordinator, FrontDesk, Member]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "FacilitySpace[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/scholarship-applications"
    description: "List scholarship applications of a branch"
    roles: [BranchDirector, AssociationAdmin, Member]
    code: 200
    input: ["membership_id?", "status?", "limit?", "offset?"]
    output: "ScholarshipApplication[]"
    side_effects: []

  - method: GET
    path: "/branches/{branchId}/donations"
    description: "List donations credited to a branch"
    roles: [AssociationAdmin, BranchDirector, BoardMember]
    code: 200
    input: ["status?", "designation?", "limit?", "offset?"]
    output: "Donation[]"
    side_effects: []

