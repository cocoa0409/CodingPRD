          trigger:
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "RESET" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 422"
            - "error_id == ERR_RESET_REQUIRES_SHOD_LIMB"
            - "GET /service-lines?appointment_id=${ap1} returns 0 rows"

      - name: corner_two_lines_for_the_same_limb_are_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=40]", "errors[ERR_DUPLICATE_LIMB_LINE]"]
        distinguishing_aspect: "The duplicate-limb check applies WITHIN one atomic lines array, so a request naming LF twice is refused with 409 ERR_DUPLICATE_LIMB_LINE and neither line is written."
        test_recipe:
          setup: ["A fresh horse and one UNROUTED appointment."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
          trigger:
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "TRIM" }, { limb_state_id: "${lf}", service_type: "TRIM" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409"
            - "error_id == ERR_DUPLICATE_LIMB_LINE"
            - "GET /service-lines?appointment_id=${ap1} returns 0 rows because the call is atomic"
            - "Appointment.${ap1}.service_units == 0"

      - name: corner_corrective_on_a_limb_outside_the_prescription_scope_is_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=37]", "errors[ERR_LIMB_NOT_IN_PRESCRIPTION_SCOPE]", entities.VetPrescription.fields.limb_scope]
        distinguishing_aspect: "The prescription is live and covers LF and RF only, so a CORRECTIVE line on RH returns 422 ERR_LIMB_NOT_IN_PRESCRIPTION_SCOPE rather than ERR_NO_LIVE_PRESCRIPTION."
        test_recipe:
          setup: ["A severity-2 case with an ACTIVE prescription scoped to LF and RF."]
