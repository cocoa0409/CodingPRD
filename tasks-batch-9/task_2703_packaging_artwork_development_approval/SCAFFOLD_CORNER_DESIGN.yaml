      - name: escape_lifecycle_refuses_out_of_order_claims_impossible_shares_and_over_cap_settlements
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - validations[priority=50]
          - validations[priority=56]
          - errors[ERR_ESCAPE_STATE_INVALID]
          - errors[ERR_SHARE_INCONSISTENT_WITH_PARTY]
          - errors[ERR_RECOVERY_EXCEEDS_LIABILITY_CAP]
          - entities.ErrorEscape.fields.printer_share_pct
          - entities.ErrorEscape.fields.liability_cap_applied
        distinguishing_aspect: |
          Four refusals along one escape. Claiming before root cause is a state error
          (34). PRINTER with 0.60 and SHARED with 0.00 are both share/party
          contradictions (50) - the second is the one implementations miss, because
          0.00 is a legal value in isolation and only SHARED forbids it. Then the cap
          behaves asymmetrically: the PROVISIONAL claim silently clamps 787000 to
          500000 with liability_cap_applied true, while a FINAL of 800000 is REFUSED
          (56) rather than clamped, and a revised 470000 settles with a NEGATIVE
          variance of -30000 against the clamped provisional.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ArtworkVersion v1 (CARTON / COATED_PAPER / US, standard_unit_cost_cents 42) is RELEASED_TO_PRINT."
            - "Printer Cascade Print Co is CERTIFIED with recovery_liability_cap_cents 500000 (deliberately small) and performance_score 100.0."
            - "ErrorEscape is OPEN: defect WRONG_ALLERGEN, discovered_stage MARKET (a LATE stage, so investigation_fee_cents 150000), units_affected 13000, no root cause yet."
