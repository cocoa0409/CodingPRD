              payload: { convene_note: "Legal seated; opening round 1." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
          assert:
            - "Before the trigger, ThreatCase.${case_id}.quorum_met == false with missing_disciplines == [\"LEGAL\"] (CLINICAL is not required because injury_level is NONE)"
            - "The first trigger call returns HTTP 409 with $.data.error_id == ERR_QUORUM_NOT_MET"
            - "After seating LEGAL, ThreatCase.${case_id}.quorum_met == true and missing_disciplines == []"
            - "The third trigger call returns HTTP 200 and ThreatCase.${case_id}.status == ASSESSING"
            - "ThreatCase.${case_id}.interim_risk_score == 4.80 (0.60 * 8 severity_points, no prior cases, no weapon points) with risk_band == LOW"
            - "ThreatCase.${case_id}.assessment_round == 1 and ballot_count_current_round == 0"
      - name: drill_component_uses_required_drills_per_year_two
        claim_type: constants_applied
        grounds:
