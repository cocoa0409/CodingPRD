            - { call: "POST /yard/vessels", payload: { name: "MV Early", owner_name: "O E", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_a: $.data.id } }
