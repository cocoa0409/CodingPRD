  - section: state_machines
    instances:
      - name: newly_created_records_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.HomeboundCase.service_status.initial_state
          - state_machines.HomeboundCase.funding_status.initial_state
          - state_machines.PhysicianCertification.initial_state
          - state_machines.TeacherAssignment.initial_state
          - state_machines.HomeVisitSafetyReview.initial_state
        distinguishing_aspect: |
          The case starts in the DRAFT x NOT_REPORTED product of its two parallel dimensions; a
          certification starts SUBMITTED with is_current false; an assignment starts PROPOSED with
          weekly_committed_minutes 0; a safety review starts DRAFT with clearance PENDING even though
          its risk_score is already computed.
        test_recipe:
          setup:
            - "One PUBLISHED MIDDLE/IN_HOME rule, one ENROLLED grade-7 student, one CLEARED teacher, one freshly created case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
