  - { method: POST, path: "/repricing-cycles", description: "Create or replace the cadence config for a (product_id, market_code) pair", roles: [PricingAnalyst], code: 201, input: [product_id, market_code, cadence_days], output: RepricingCycle, side_effects: [] }
  - { method: GET, path: "/repricing-cycles", description: "List cycles with computed status (CURRENT/OVERDUE)", roles: [PricingAnalyst, PricingCommittee], code: 200, input: ["product_id?", "market_code?", "status?", "limit?", "offset?"], output: "RepricingCycle[]", side_effects: [] }
  - { method: GET, path: "/repricing-cycles/{id}", description: "Get one cycle with computed status", roles: [PricingAnalyst, PricingCommittee], code: 200, input: [], output: RepricingCycle, side_effects: [] }

  - { method: POST, path: "/promotional-offers", description: "Create a DRAFT promotional offer", roles: [PricingAnalyst], code: 201, input: [product_id, market_code, promo_rate_bp, promo_term_days, enrollment_start, enrollment_end, "min_opening_balance_cents?", rollover_treatment], output: PromotionalOffer, side_effects: [] }
  - { method: GET, path: "/promotional-offers", description: "List offers", roles: [PricingAnalyst, PricingCommittee, BranchBanker], code: 200, input: ["product_id?", "market_code?", "status?", "limit?", "offset?"], output: "PromotionalOffer[]", side_effects: [] }
  - { method: GET, path: "/promotional-offers/{id}", description: "Get one offer", roles: [PricingAnalyst, PricingCommittee, BranchBanker], code: 200, input: [], output: PromotionalOffer, side_effects: [] }
  - { method: POST, path: "/promotional-offers/{id}/publish", description: "DRAFT -> SCHEDULED (closed-window overlap check)", roles: [PricingAnalyst], code: 200, input: [], output: PromotionalOffer, side_effects: [] }
  - { method: POST, path: "/promotional-offers/{id}/close", description: "ACTIVE -> CLOSED", roles: [PricingAnalyst], code: 200, input: [], output: PromotionalOffer, side_effects: [] }

  - { method: POST, path: "/exception-pricing-requests", description: "Banker requests off-sheet rate for an account; snapshots baseline, computes delta and authority tier", roles: [BranchBanker], code: 201, input: [account_id, sheet_id, requested_rate_bp, term_days, "justification_doc_ref?"], output: ExceptionPricingRequest, side_effects: ["baseline_rate_bp/delta_bp/authority_tier computed; submitted_by_user_id := X-User-ID"] }
  - { method: GET, path: "/exception-pricing-requests", description: "List exception requests", roles: [BranchBanker, PricingCommittee, ComplianceOfficer], code: 200, input: ["account_id?", "sheet_id?", "status?", "limit?", "offset?"], output: "ExceptionPricingRequest[]", side_effects: [] }
  - { method: GET, path: "/exception-pricing-requests/{id}", description: "Get one exception request", roles: [BranchBanker, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: ExceptionPricingRequest, side_effects: [] }
  - { method: POST, path: "/exception-pricing-requests/{id}/decision", description: "APPROVE | DECLINE | RETURN (from UNDER_REVIEW) or REVOKE (from APPLIED); authority-tier role gate and segregation of duties", roles: [BranchBanker, PricingCommittee], code: 200, input: [decision], output: ExceptionPricingRequest, side_effects: ["decided_by_user_id set; REVOKE compensates the account rate back to sheet-derived"] }
  - { method: POST, path: "/exception-pricing-requests/{id}/resubmit", description: "RETURNED or REBASE_REQUIRED -> UNDER_REVIEW with re-snapshotted baseline", roles: [BranchBanker], code: 200, input: ["requested_rate_bp?", "term_days?", "justification_doc_ref?"], output: ExceptionPricingRequest, side_effects: ["baseline re-snapshot from current EFFECTIVE sheet; delta/authority recomputed"] }
  - { method: POST, path: "/exception-pricing-requests/{id}/apply", description: "APPROVED -> APPLIED; account rate_source -> EXCEPTION", roles: [BranchBanker], code: 200, input: [], output: ExceptionPricingRequest, side_effects: ["account rate_source := EXCEPTION, exception_end_date := today + term_days, current_rate_bp recomputed, account version bumped"] }

  - { method: POST, path: "/deposit-accounts", description: "Open an account on the current EFFECTIVE sheet for (product_id, market_code)", roles: [BranchBanker], code: 201, input: [customer_ref, product_id, market_code, opening_balance_cents, channel], output: DepositAccount, side_effects: ["sheet_id resolved to the unique EFFECTIVE sheet for (product_id, market_code) — at most one EFFECTIVE sheet exists per pair because activation atomically supersedes the incumbent (none -> ERR_SHEET_NOT_FOUND); rates computed; bundle bonus evaluated"] }
  - { method: GET, path: "/deposit-accounts", description: "List accounts with filters", roles: [BranchBanker, PricingAnalyst, PricingCommittee], code: 200, input: ["customer_ref?", "product_id?", "market_code?", "sheet_id?", "rate_source?", "lifecycle?", "promo_offer_id?", "exception_request_id?", "limit?", "offset?"], output: "DepositAccount[]", side_effects: [] }
  - { method: GET, path: "/deposit-accounts/{id}", description: "Get one account", roles: [BranchBanker, PricingAnalyst, PricingCommittee], code: 200, input: [], output: DepositAccount, side_effects: [] }
