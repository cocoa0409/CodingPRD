            - "the incident report at 2026-09-11T00:00:00Z returns HTTP 201 with status REPORTED and drives readiness_state READY -> DEGRADED with Executive.open_degraded_trip_count == 1"
            - "closing at 2026-09-12T00:00:00Z (== return_at, so priority 35 is satisfied) returns HTTP 409 with ${e_incident} == ERR_OPEN_INCIDENTS_BLOCK_CLOSE and NOT ERR_ASSIGNMENTS_NOT_SETTLED, although both conditions hold: 46 precedes 47"
