            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Marlow Leave-On Blush", category_code: "07A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@marlow.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_leave_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Marlow Rinse-Off Bath Oil", category_code: "02C", product_form: "RINSE_OFF", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@marlow.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_rinse_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Marlow Unscented Balm", category_code: "07A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@marlow.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_empty_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings/${lst_leave_id}/ingredients"
              payload: { inci_name: "LINALOOL", function_code: "FRAGRANCE", concentration_pct: 0.001, is_fragrance_allergen: true, label_disclosed: false, is_data_gap_flag: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_leave_at_id: $.data.id, req_leave_at: $.data.disclosure_required }
            - call: "POST /cosmetics/listings/${lst_leave_id}/ingredients"
              payload: { inci_name: "CITRAL", function_code: "FRAGRANCE", concentration_pct: 0.0009, is_fragrance_allergen: true, label_disclosed: false, is_data_gap_flag: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_leave_below_id: $.data.id, req_leave_below: $.data.disclosure_required }
            - call: "POST /cosmetics/listings/${lst_rinse_id}/ingredients"
              payload: { inci_name: "LINALOOL", function_code: "FRAGRANCE", concentration_pct: 0.001, is_fragrance_allergen: true, label_disclosed: false, is_data_gap_flag: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_rinse_below_id: $.data.id, req_rinse_below: $.data.disclosure_required }
            - call: "POST /cosmetics/listings/${lst_rinse_id}/ingredients"
              payload: { inci_name: "GERANIOL", function_code: "FRAGRANCE", concentration_pct: 0.01, is_fragrance_allergen: true, label_disclosed: false, is_data_gap_flag: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ing_rinse_at_id: $.data.id, req_rinse_at: $.data.disclosure_required }
          assert:
            - "${req_leave_at} == true (0.0010 is INCLUSIVE at ALLERGEN_THRESHOLD_LEAVE_ON) and ${req_leave_below} == false (0.0009 is one step below)"
            - "${req_rinse_below} == false: the SAME 0.0010 concentration is not disclosure-required on a RINSE_OFF listing"
            - "${req_rinse_at} == true (0.0100 is INCLUSIVE at ALLERGEN_THRESHOLD_RINSE_OFF)"
            - "ProductListing.${lst_leave_id}.undisclosed_allergen_count == 1 and allergen_disclosure_complete == false"
            - "ProductListing.${lst_rinse_id}.undisclosed_allergen_count == 1 and allergen_disclosure_complete == false"
            - "ProductListing.${lst_empty_id}.undisclosed_allergen_count == 0 and allergen_disclosure_complete == true — the vacuous empty required set is COMPLETE, not incomplete"
            - "GET /cosmetics/listings/${lst_leave_id}/ingredients?is_fragrance_allergen=true returns both rows, only one of which has disclosure_required true"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_submit_gated_by_parent_facility_posture_while_still_registered
        grounds:
          - validations[priority=21]
          - validations[priority=20]
          - calculations.facility_compliance_posture
          - entities.Facility.fields.compliance_posture
        distinguishing_aspect: |
          Entity pair ProductListing -> Facility: the child write's admissibility depends on a state
          field of its PARENT, not on any field of its own. The facility stays REGISTERED (so
          validations[priority=20] is satisfied) but accumulates 30.00 event points and freezes, and
          the frozen posture alone refuses the listing submit. The pair is probed from both sides of
          the same parent state: creating a substantiation for the listing is NOT gated by posture and
          still succeeds, while submitting that substantiation IS gated and fails with the same error.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one DRAFT consumer listing"
            - "three SERIOUS events on that listing, all received 2026-08-05T10:00:00Z, all reported at clock 2026-09-01T12:00:00Z (lateness 12 each -> 10.00 points each -> 30.00 total, past POSTURE_FROZEN_POINTS 25.00)"
            - "the facility is therefore REGISTERED with compliance_posture FROZEN — the only combination that makes validations[priority=21] reachable, since a LAPSED facility would fail validations[priority=20] first"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Ashcroft Cream Plant", owner_operator_name: "Ashcroft Ltd", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "GA" }
