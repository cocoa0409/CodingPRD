scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: franchise_tax_share_tiers_versus_assumed_par_value
        grounds:
          - calculations.franchise_tax_amount
          - calculations.obligation_total_due
          - entities.StateRule.fields.franchise_tax_basis
          - entities.ComplianceObligation.fields.franchise_tax_cents
        distinguishing_aspect: |
          Two LegalEntity rows carrying byte-identical authorized_shares (8000),
          issued_shares (4000) and total_gross_assets_cents (12000000) produce
          franchise_tax_cents 25000 under Delaware's AUTHORIZED_SHARES_TIERS step
          function and 21000 under New York's continuous ASSUMED_PAR_VALUE formula;
          the divergence is money on ComplianceObligation, a different entity domain
          from the SopDocument temporal divergence of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z (server default)."
            - "A DE StateRule effective 2026-01-01 with franchise_tax_basis AUTHORIZED_SHARES_TIERS."
            - "A NY StateRule effective 2026-01-01 with franchise_tax_basis ASSUMED_PAR_VALUE, 35 bps, clamp [17500, 2000000]."
            - "Client DE-side owns entity A whose home state is DE; Client NY-side owns entity B whose home state is NY. Both entities have authorized_shares 8000, issued_shares 4000, total_gross_assets_cents 12000000."
            - "Both entities have an ACTIVE home registration, so each is the FIRST obligation of its own client and both pay the undiscounted service fee 4900."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "AUTHORIZED_SHARES_TIERS", authorized_shares_tiers: [{ up_to_shares: 5000, tax_cents: 17500 }, { up_to_shares: 10000, tax_cents: 25000 }, { up_to_shares: null, tax_cents: 40000 }], grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000, delinquency_to_dissolution_days: 90, reinstatement_window_days: 365, annual_report_fee_cents: 5000, franchise_tax_filing_fee_cents: 5000, foreign_qualification_fee_cents: 25000, withdrawal_fee_cents: 4900, dissolution_fee_cents: 4900, reinstatement_fee_cents: 16900, expedite_surcharge_cents: 10000, good_standing_freshness_days: 30, requires_tax_clearance: false }
              as: PlatformAdmin
              captures: { de_rule_id: $.data.id }
            - call: "POST /state-rules"
              payload: { state_code: "NY", effective_from: "2026-01-01", annual_report_basis: "ANNIVERSARY_MONTH_DAY", franchise_tax_basis: "ASSUMED_PAR_VALUE", assumed_par_value_rate_bps: 35, min_franchise_tax_cents: 17500, max_franchise_tax_cents: 2000000, grace_days: 15, grace_basis: "CALENDAR_DAYS", late_fee_style: "PERCENT_CAPPED", late_fee_percent_bps: 1000, late_fee_cap_cents: 30000, delinquency_to_dissolution_days: 60, reinstatement_window_days: 180, annual_report_fee_cents: 900, franchise_tax_filing_fee_cents: 900, foreign_qualification_fee_cents: 7000, withdrawal_fee_cents: 3000, dissolution_fee_cents: 3000, reinstatement_fee_cents: 25000, expedite_surcharge_cents: 35000, good_standing_freshness_days: 30, requires_tax_clearance: false }
              as: PlatformAdmin
              captures: { ny_rule_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_de_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Empire Holdings", billing_email: "ap@empire.example" }
              as: PlatformAdmin
              captures: { client_ny_id: $.data.id }
            - call: "POST /clients/${client_de_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31", authorized_shares: 8000, issued_shares: 4000, total_gross_assets_cents: 12000000, annual_gross_receipts_cents: 500000000 }
              as: ComplianceOfficer
              captures: { ent_de_id: $.data.id }
            - call: "POST /clients/${client_ny_id}/legal-entities"
              payload: { legal_name: "Eastwind Widgets LLC", entity_type: "LLC", home_state_code: "NY", formation_date: "2026-01-31", authorized_shares: 8000, issued_shares: 4000, total_gross_assets_cents: 12000000, annual_gross_receipts_cents: 500000000 }
              as: ComplianceOfficer
              captures: { ent_ny_id: $.data.id }
            - call: "POST /legal-entities/${ent_de_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_de_id: $.data.id, reg_de_v: $.data.version }
            - call: "POST /legal-entities/${ent_ny_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_ny_id: $.data.id, reg_ny_v: $.data.version }
            - call: "POST /registrations/${reg_de_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_de_v}" }
              as: ComplianceOfficer
              captures: { appt_de_id: $.data.id }
            - call: "POST /registrations/${reg_ny_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_ny_v}" }
              as: ComplianceOfficer
              captures: { appt_ny_id: $.data.id }
            - call: "POST /agent-appointments/${appt_de_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /agent-appointments/${appt_ny_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_de_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_ny_id}/activate"
              payload: {}
              as: FilingAgent
          trigger:
            - call: "POST /registrations/${reg_de_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob_de_id: $.data.id }
            - call: "POST /registrations/${reg_ny_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob_ny_id: $.data.id }
          assert:
            - "ComplianceObligation.${ob_de_id}.franchise_tax_cents == 25000"
            - "ComplianceObligation.${ob_ny_id}.franchise_tax_cents == 21000"
            - "ComplianceObligation.${ob_de_id}.state_fee_cents == 5000"
            - "ComplianceObligation.${ob_ny_id}.state_fee_cents == 900"
            - "ComplianceObligation.${ob_de_id}.service_fee_cents == 4900"
            - "ComplianceObligation.${ob_ny_id}.service_fee_cents == 4900"
            - "ComplianceObligation.${ob_de_id}.total_due_cents == 34900"
            - "ComplianceObligation.${ob_ny_id}.total_due_cents == 26800"
            - "ComplianceObligation.${ob_de_id}.due_date == '2027-03-01'"
            - "ComplianceObligation.${ob_ny_id}.due_date == '2027-02-01'"
            - "ComplianceObligation.${ob_de_id}.governing_rule_id == ${de_rule_id}"
            - "ComplianceObligation.${ob_ny_id}.governing_rule_id == ${ny_rule_id}"

      - name: sop_forward_deadline_ordinary_versus_litigation
        grounds:
          - calculations.sop_forward_deadline
          - entities.SopDocument.fields.sop_class
          - entities.SopDocument.fields.forward_deadline_at
          - state_machines.SopDocument.RECEIVED_to_SCANNED
        distinguishing_aspect: |
          Two SopDocument rows received at the identical instant 2026-06-05T14:00:00Z
          on the same registration get forward_deadline_at 2026-06-08T10:00:00Z
          (LITIGATION, 4 business hours) versus 2026-06-09T14:00:00Z (ORDINARY, 16
          business hours); the divergence is a business-hour deadline on SopDocument,
          a different entity domain from the franchise-tax money of the sibling instance.
        test_recipe:
          setup:
            - "A DE StateRule effective 2026-01-01."
            - "One client, one DE entity, one ACTIVE DE registration."
            - "Logical clock moved to Friday 2026-06-05T14:00:00Z."
            - "The LITIGATION document is created FIRST so no ORDINARY sibling exists to be pre-empted; the ORDINARY document is created second and is therefore never deferred."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "AUTHORIZED_SHARES_TIERS", authorized_shares_tiers: [{ up_to_shares: 5000, tax_cents: 17500 }, { up_to_shares: 10000, tax_cents: 25000 }, { up_to_shares: null, tax_cents: 40000 }], grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000, delinquency_to_dissolution_days: 90, reinstatement_window_days: 365, annual_report_fee_cents: 5000, franchise_tax_filing_fee_cents: 5000, foreign_qualification_fee_cents: 25000, withdrawal_fee_cents: 4900, dissolution_fee_cents: 4900, reinstatement_fee_cents: 16900, expedite_surcharge_cents: 10000, good_standing_freshness_days: 30, requires_tax_clearance: false }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31", authorized_shares: 8000, issued_shares: 4000, total_gross_assets_cents: 12000000 }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T14:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /registrations/${reg_id}/sop-documents"
              payload: { sop_class: "LITIGATION", plaintiff_name: "Acme Trading Co", court_case_number: "N26C-0417" }
              as: SopHandler
              captures: { sop_lit_id: $.data.id }
            - call: "POST /registrations/${reg_id}/sop-documents"
              payload: { sop_class: "ORDINARY" }
              as: SopHandler
              captures: { sop_ord_id: $.data.id }
          assert:
            - "SopDocument.${sop_lit_id}.forward_deadline_at == '2026-06-08T10:00:00.000Z'"
            - "SopDocument.${sop_ord_id}.forward_deadline_at == '2026-06-09T14:00:00.000Z'"
            - "SopDocument.${sop_lit_id}.received_at == '2026-06-05T14:00:00.000Z'"
            - "SopDocument.${sop_ord_id}.received_at == '2026-06-05T14:00:00.000Z'"
            - "SopDocument.${sop_ord_id}.deferred == false"
            - "SopDocument.${sop_ord_id}.deferral_count == 0"
            - "Registration.${reg_id}.sop_priority_hold == true"

  - rule_id: combinatorial_formula
    instances:
      - name: allocation_split_rounds_state_portion_first_then_remainder
        grounds:
          - calculations.payment_allocation_waterfall
          - calculations.filing_fee_breakdown
          - entities.PaymentAllocation.fields.state_portion_cents
          - entities.PaymentAllocation.fields.service_portion_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: on a DISSOLUTION filing whose state_portion_cents
          and service_portion_cents are both exactly 4900 (total 9800), a partial
          allocation of 4901 rounds the state portion FIRST to 2451 and takes the
          service portion as the remainder 2450; rounding both portions independently
          would yield 2451 + 2451 = 4902 and break the funds identity by one cent.
        test_recipe:
          setup:
            - "A DE StateRule with dissolution_fee_cents 4900."
            - "One client, one DE entity, one ACTIVE DE registration, no obligations at all."
            - "A DRAFT DISSOLUTION filing with expedite_tier NONE, so state_portion_cents 4900, service_portion_cents 4900, total_fee_cents 9800."
            - "A Payment authorized for 4901 cents."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "AUTHORIZED_SHARES_TIERS", authorized_shares_tiers: [{ up_to_shares: 5000, tax_cents: 17500 }, { up_to_shares: 10000, tax_cents: 25000 }, { up_to_shares: null, tax_cents: 40000 }], grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000, delinquency_to_dissolution_days: 90, reinstatement_window_days: 365, annual_report_fee_cents: 5000, franchise_tax_filing_fee_cents: 5000, foreign_qualification_fee_cents: 25000, withdrawal_fee_cents: 4900, dissolution_fee_cents: 4900, reinstatement_fee_cents: 16900, expedite_surcharge_cents: 10000, good_standing_freshness_days: 30, requires_tax_clearance: false }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31", authorized_shares: 8000, issued_shares: 4000, total_gross_assets_cents: 12000000 }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/filings"
              payload: { filing_kind: "DISSOLUTION", expedite_tier: "NONE" }
              as: ComplianceOfficer
              captures: { filing_id: $.data.id }
            - call: "POST /clients/${client_id}/payments"
              payload: { authorized_amount_cents: 4901 }
              as: PlatformAdmin
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/capture"
              payload: { capture_amount_cents: 4901, target_filing_id: "${filing_id}" }
              as: PlatformAdmin
          assert:
            - "Filing.${filing_id}.state_portion_cents == 4900"
            - "Filing.${filing_id}.service_portion_cents == 4900"
            - "Filing.${filing_id}.total_fee_cents == 9800"
            - "The single PaymentAllocation returned by GET /payments/${pay_id}/allocations has amount_cents == 4901"
            - "That allocation has state_portion_cents == 2451"
            - "That allocation has service_portion_cents == 2450"
            - "That allocation has state_portion_cents + service_portion_cents == 4901"
            - "That allocation has sequence_index == 0 and is_reversal == false"
            - "Filing.${filing_id}.paid_amount_cents == 4901"
            - "Payment.${pay_id}.captured_amount_cents == 4901"
            - "Payment.${pay_id}.allocated_amount_cents == 4901"
            - "Payment.${pay_id}.unallocated_amount_cents == 0"

      - name: service_fee_volume_discount_uses_pre_insert_open_count
        grounds:
          - calculations.obligation_service_fee
          - calculations.portfolio_rollup
          - entities.ComplianceObligation.fields.service_fee_cents
          - entities.Client.fields.portfolio_open_obligation_count
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: service_fee_cents feeds
          total_due_cents, which feeds portfolio_outstanding_cents, which sits beside
          the very portfolio_open_obligation_count the discount is keyed on. The
          scaffold pins the count to its PRE-INSERT value, so the sixth obligation
          created for one client is priced at 4165 while the fifth is still 4900.
        test_recipe:
          setup:
            - "A DE StateRule effective 2026-01-01; clock at the 2026-05-01T00:00:00Z default."
            - "One client, one DE entity, one ACTIVE DE registration."
            - "Five obligations already created on that registration, all still SCHEDULED, each priced with service_fee_cents 4900."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "AUTHORIZED_SHARES_TIERS", authorized_shares_tiers: [{ up_to_shares: 5000, tax_cents: 17500 }, { up_to_shares: 10000, tax_cents: 25000 }, { up_to_shares: null, tax_cents: 40000 }], grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000, delinquency_to_dissolution_days: 90, reinstatement_window_days: 365, annual_report_fee_cents: 5000, franchise_tax_filing_fee_cents: 5000, foreign_qualification_fee_cents: 25000, withdrawal_fee_cents: 4900, dissolution_fee_cents: 4900, reinstatement_fee_cents: 16900, expedite_surcharge_cents: 10000, good_standing_freshness_days: 30, requires_tax_clearance: false }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31", authorized_shares: 8000, issued_shares: 4000, total_gross_assets_cents: 12000000 }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob1_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2027 }
              as: ComplianceOfficer
              captures: { ob2_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2028 }
              as: ComplianceOfficer
              captures: { ob3_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2028 }
              as: ComplianceOfficer
              captures: { ob4_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2029 }
              as: ComplianceOfficer
              captures: { ob5_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "FRANCHISE_TAX", period_year: 2029 }
              as: ComplianceOfficer
              captures: { ob6_id: $.data.id }
          assert:
            - "ComplianceObligation.${ob5_id}.service_fee_cents == 4900"
            - "ComplianceObligation.${ob5_id}.total_due_cents == 9900"
            - "ComplianceObligation.${ob6_id}.service_fee_cents == 4165"
            - "ComplianceObligation.${ob6_id}.total_due_cents == 34165"
            - "Client.${client_id}.portfolio_open_obligation_count == 6"
            - "Client.${client_id}.portfolio_outstanding_cents == 133665"

  - rule_id: non_linear_state_machine
    instances:
      - name: registration_cycles_active_delinquent_active
        grounds:
          - state_machines.Registration.ACTIVE_to_DELINQUENT
          - state_machines.Registration.DELINQUENT_to_ACTIVE
          - state_machines.ComplianceObligation.SCHEDULED_to_DELINQUENT
          - calculations.registration_delinquency_rank
        distinguishing_aspect: |
          Registration.status returns to a state it has already occupied
          (ACTIVE -> DELINQUENT -> ACTIVE) - a true cycle, not a longer pipeline -
          and the cure edge is driven by a sibling entity's transition rather than by
          a direct call on the registration. The sibling non-linear machine lives on
          SopDocument, a different entity.
        test_recipe:
          setup:
            - "A DE StateRule effective 2026-01-01."
            - "One client, one DE entity, one ACTIVE DE registration."
            - "One ANNUAL_REPORT 2027 obligation (due 2027-03-01, grace end 2027-03-31)."
            - "Clock moved to 2027-04-15 and an ops-run executed, so the obligation is DELINQUENT with late_fee_cents 20000 and total_due_cents 29900, and the registration is DELINQUENT."
            - "A filing on that obligation is fully funded and submitted by a user other than its preparer."
