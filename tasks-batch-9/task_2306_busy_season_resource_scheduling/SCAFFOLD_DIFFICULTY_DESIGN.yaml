              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 45.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-03", end_date: "2026-08-10", allocated_hours: 20.00 }
              as: SchedulingManager
              captures: { a_p_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-03", end_date: "2026-08-10", allocated_hours: 25.00 }
              as: SchedulingManager
              captures: { a_q_id: $.data.id }
          trigger:
            - call: "POST /scheduling/engagement-phases/${ph1_id}/expand-scope"
              payload: { additional_expected_hours: 15.00, reason_note: "client added two inventory locations" }
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a_q_id}/release"
              payload: { reason_note: "senior reallocated to a filing-deadline client" }
              as: SchedulingManager
          assert:
            - "after trigger step 1: EngagementPhase.${ph1_id}.expected_hours == 60.00"
            - "after trigger step 1: EngagementPhase.${ph1_id}.staffed_hours == 45.00 and unstaffed_hours == 15.00 (sum == 60.00)"
            - "after trigger step 1: EngagementPhase.${ph1_id}.staffing_status == PARTIALLY_STAFFED"
            - "after trigger step 1: Engagement.${e1_id}.scope_change_count == 1"
            - "after trigger step 1: Engagement.${e1_id}.staffing_completion_pct == 75.00"
            - "after trigger step 2: Assignment.${a_q_id}.staffing_status == RELEASED"
            - "after trigger step 2: EngagementPhase.${ph1_id}.staffed_hours == 20.00 and unstaffed_hours == 40.00 (sum == 60.00 == expected_hours)"
            - "after trigger step 2: EngagementPhase.${ph1_id}.staffing_status == PARTIALLY_STAFFED"
            - "after trigger step 2: Engagement.${e1_id}.staffing_completion_pct == 33.33"
            - "after trigger step 2: StaffMember.${s1_id}.committed_hours_current_week == 20.02"
            - "Assignment.${a_p_id}.staffing_status == PROPOSED and Assignment.${a_p_id}.daily_hours == 2.86"
