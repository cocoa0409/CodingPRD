          assert:
            - "first load: ${e_pending} == \"ERR_INVALID_LOT_STATE\" with HTTP 409 while ProductionLot.${lot_id}.process_state == \"TESTED\" and quality_state == \"PENDING\""
            - "the refusal is inert: Reel.${reel_id}.status is still \"AVAILABLE\" with current_lot_id == null and loaded_length_ft == 0"
            - "the release flips only the quality dimension: ProductionLot.${lot_id}.quality_state == \"CONFORMING\", process_state still \"TESTED\", packaged_length_ft == 5000, released_by_user_id == \"qe-002\""
