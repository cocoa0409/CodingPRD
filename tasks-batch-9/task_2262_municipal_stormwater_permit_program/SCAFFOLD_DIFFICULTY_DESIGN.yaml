              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_SITE_NOT_FOUND, not ERR_INSPECTION_SUBJECT_MISMATCH (422): priority 50 outranks priority 75"
            - "no Inspection row is created: GET /stormwater/inspections?construction_site_id=${site_d_id} returns total_count 0"
            - "ConstructionSite.${site_d_id}.field_status == ACTIVE_DISTURBANCE and open_deficiency_score == 0"
            - "swapping only the construction_site_id to ${site_d_id} leaves the subject-set violation alone and then returns ERR_INSPECTION_SUBJECT_MISMATCH (422)"

      - name: escalation_cooling_off_outranks_penalty_decrease_guard
        grounds:
          - validations[priority=80]
          - validations[priority=85]
          - errors.ERR_ESCALATION_COOLING_OFF
          - errors.ERR_PENALTY_DECREASE_FORBIDDEN
        distinguishing_aspect: |
          business_temporal (80) versus business_fiscal (85) on the same escalate call: the clock
          is only 4 days past issued_at and the supplied violation_days 5 is below the stored 20,
          so both the cooling-off window and the no-decrease guard are violated at once.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures and outfall OF-01"
            - "an IllicitDischargeCase in SOURCE_IDENTIFIED reached from a SUSPECT screening"
            - "a NOTICE_OF_VIOLATION issued by enf-01 on 2026-08-01 with violation_days 20 -> penalty_cents 65000"
            - "logical clock advanced to 2026-08-05T00:00:00Z, only 4 days into the 14-day cooling-off window"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
