      - name: a_draft_profile_blocks_dcv_and_a_pending_authorization_cannot_be_invalidated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROFILE_NOT_ACTIVE]
          - errors[ERR_AUTHORIZATION_NOT_VALIDATED]
          - validations[priority=31]
          - validations[priority=37]
        distinguishing_aspect: "ERR_PROFILE_NOT_ACTIVE is the mirror image of ERR_PROFILE_NOT_DRAFT: the same DRAFT status that permits activation forbids domain validation. ERR_AUTHORIZATION_NOT_VALIDATED shows that invalidate is reserved for VALIDATED rows, so a still-PENDING authorization cannot be recycled through the invalidate path."
