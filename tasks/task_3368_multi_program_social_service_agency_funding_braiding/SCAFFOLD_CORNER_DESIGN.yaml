              payload: { grant_id: "${g1}", donor_type: "VOLUNTEER", donor_reference: "VOL-1", donation_date: "2026-09-02T00:00:00Z", hours: 2, valuation_method: "APPRAISAL", rate_cents: 3000 }
              as: ProgramManager
            - call: "POST /api/in-kind-donations"
              payload: { grant_id: "${g1}", donor_type: "PARISH", donor_reference: "PARISH-01", donation_date: "2026-09-02T00:00:00Z", hours: 2, valuation_method: "APPRAISAL", rate_cents: 3000 }
