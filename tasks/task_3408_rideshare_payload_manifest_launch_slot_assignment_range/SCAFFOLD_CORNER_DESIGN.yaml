            - *k_confirm_slot
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-11-01T00:00:00Z", new_window_close_utc: "2026-11-10T00:00:00Z", reason_code: "VEHICLE_STACKING" }
              as: MissionOps
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-D4", target_orbit: "SSO", window_open_utc: "2026-10-25T00:00:00Z", window_close_utc: "2026-10-28T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "GET /rideshare/contracts/${ct_id}"
