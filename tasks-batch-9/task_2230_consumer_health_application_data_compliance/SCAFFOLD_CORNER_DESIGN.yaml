            - "the response data field regulated_element_count == 1"
            - "the response data field active_share_consent_count == 1"
            - "the response data field policy_compliance_state == NO_POLICY"
            - "the response data field exposure_cents == 240000"
            - "the response data field open_request_count == 1"
            - "the response data field outstanding_deletion_task_count == 0"

      - name: conditional_action_notify_without_the_media_notice_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=45]", "errors[ERR_MEDIA_NOTICE_REQUIRED]", "state_machines.BreachIncident.REPORTABLE_to_NOTIFIED"]
        distinguishing_aspect: "With affected_state_max_count 700 above MEDIA_NOTICE_THRESHOLD 500 the incident carries media_notice_required true, so notify with media_notice_sent false is refused and notified_at stays null."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one REPORTABLE CHD_ONLY BreachIncident discovered 2026-08-05T00:00:00Z affecting 700 consumers, 700 of them in one state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/breach-incidents"
              payload: { app_product_id: "${prod_id}", incident_label: "Analytics bucket left public", discovered_at: "2026-08-05T00:00:00Z", breach_scope: "CHD_ONLY", protection_state: "UNPROTECTED", affected_consumer_count: 700, affected_state_max_count: 700 }
              as: SecurityEngineer
              captures: { inc_id: $.data.id }
            - call: "POST /health-data/breach-incidents/${inc_id}/assess"
              payload: {}
              as: SecurityEngineer
          trigger:
            - call: "POST /health-data/breach-incidents/${inc_id}/notify"
              payload: { media_notice_sent: false }
              as: SecurityEngineer
          assert:
            - "error_id == ERR_MEDIA_NOTICE_REQUIRED"
            - "http_status == 409"
            - "BreachIncident.${inc_id}.state == REPORTABLE"
            - "BreachIncident.${inc_id}.media_notice_required == true"
            - "BreachIncident.${inc_id}.governing_deadline_at == 2026-10-04T00:00:00Z"
            - "BreachIncident.${inc_id}.notified_at == null"
            - "AppProduct.${prod_id}.exposure_cents == 840000"

  - section: errors
    instances:
      - name: error_consumer_not_found_on_consent_record_create
        claim_type: error_triggerability
        grounds: ["errors[ERR_CONSUMER_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "consumer_id is the first unresolvable body FK on this endpoint, so the OCC version is never compared and the response carries ERR_CONSUMER_NOT_FOUND, not ERR_STALE_CONSUMER_VERSION."
        test_recipe:
          setup: ["one AppProduct with one real Consumer whose version has been read"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_v: $.data.version }
          trigger:
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "00000000-0000-0000-0000-0000000000c1", expected_consumer_version: "${cons_v}" }
              as: PrivacyOfficer
          assert:
            - "error_id == ERR_CONSUMER_NOT_FOUND"
            - "http_status == 404"

      - name: error_data_element_not_found_on_mapping_create
        claim_type: error_triggerability
        grounds: ["errors[ERR_DATA_ELEMENT_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "data_element_id precedes processing_purpose_id in the priority-5 field order, so an unknown element id wins over the resolvable purpose and returns ERR_DATA_ELEMENT_NOT_FOUND."
        test_recipe:
          setup: ["one AppProduct with one COLLECT ProcessingPurpose and no DataElements"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "core_service", description_text: "Deliver the service", purpose_kind: "PRIMARY_SERVICE", activity_kind: "COLLECT" }
              as: DataSteward
              captures: { pur_id: $.data.id }
          trigger:
            - call: "POST /health-data/element-purpose-mappings"
              payload: { data_element_id: "00000000-0000-0000-0000-0000000000e1", processing_purpose_id: "${pur_id}", disclosure_specificity: "CATEGORY_ONLY" }
              as: DataSteward
          assert:
            - "error_id == ERR_DATA_ELEMENT_NOT_FOUND"
            - "http_status == 404"

      - name: error_purpose_not_found_on_mapping_create
        claim_type: error_triggerability
        grounds: ["errors[ERR_PURPOSE_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "With a resolvable data_element_id, the next FK in the priority-5 order is processing_purpose_id, whose own 404 id is ERR_PURPOSE_NOT_FOUND."
        test_recipe:
          setup: ["one AppProduct with one ACTIVE DIAGNOSIS element and no ProcessingPurposes"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /health-data/element-purpose-mappings"
              payload: { data_element_id: "${el_id}", processing_purpose_id: "00000000-0000-0000-0000-0000000000f1", disclosure_specificity: "CATEGORY_ONLY" }
              as: DataSteward
          assert:
            - "error_id == ERR_PURPOSE_NOT_FOUND"
            - "http_status == 404"

      - name: error_element_retired_on_mapping_activate
        claim_type: error_triggerability
        grounds: ["errors[ERR_ELEMENT_RETIRED]", "validations[priority=8]", "state_machines.ElementPurposeMapping.PROPOSED_to_ACTIVE"]
        distinguishing_aspect: "A mapping created after its DataElement was retired escapes the retirement cascade, so activate is the first call to see status != ACTIVE and it returns ERR_ELEMENT_RETIRED rather than the generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["logical clock at 2026-08-05T00:00:00Z", "one AppProduct whose only DataElement is RETIRED", "one PROPOSED mapping created after the retirement"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { el_id: $.data.id }
            - call: "POST /health-data/processing-purposes"
              payload: { app_product_id: "${prod_id}", purpose_key: "core_service", description_text: "Deliver the service", purpose_kind: "PRIMARY_SERVICE", activity_kind: "COLLECT" }
              as: DataSteward
              captures: { pur_id: $.data.id }
            - call: "POST /health-data/data-elements/${el_id}/retire"
              payload: { retired_reason: "Signal dropped" }
              as: DataSteward
            - call: "POST /health-data/element-purpose-mappings"
              payload: { data_element_id: "${el_id}", processing_purpose_id: "${pur_id}", disclosure_specificity: "ELEMENT_NAMED" }
              as: DataSteward
              captures: { map_id: $.data.id }
          trigger:
            - call: "POST /health-data/element-purpose-mappings/${map_id}/activate"
              payload: {}
              as: DataSteward
          assert:
            - "error_id == ERR_ELEMENT_RETIRED"
            - "http_status == 409"
            - "ElementPurposeMapping.${map_id}.status == PROPOSED"
            - "DataElement.${el_id}.status == RETIRED"

      - name: error_geofence_standoff_violation_one_meter_short
        claim_type: error_triggerability
        grounds: ["errors[ERR_GEOFENCE_STANDOFF_VIOLATION]", "validations[priority=12]", "calculations.geofence_standoff.constants.SENSITIVE_STANDOFF_METERS"]
        distinguishing_aspect: "A CT sensitive-health zone carries min_standoff_meters 500, and a campaign whose computed standoff_meters is 499 is refused one meter short while the campaign stays PLANNED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one CT GeofenceZone of facility_kind SENSITIVE_HEALTH with radius_meters 301"
            - "one PLANNED GeofenceCampaign 1000 meters from the zone centre with target_radius_meters 200"
          setup_api_calls:
