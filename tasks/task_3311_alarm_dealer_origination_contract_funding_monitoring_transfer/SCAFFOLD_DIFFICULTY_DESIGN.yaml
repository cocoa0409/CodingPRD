  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: credit_gate_failure_contagion_freezes_sibling_children
        grounds:
          - state_machines.Contract.transitions.PENDING_VALIDATION_to_CANCELLED
          - state_machines.DealerPackage.transitions.APPROVED_to_FUNDED
          - calculations.package_funding_posture
          - entities.Contract.fields.validation_failure_code
        distinguishing_aspect: |
          A depth-3 cascade: the credit-floor gate failure on one child contract (hop 1)
          flips the whole-package posture to DECLINED (hop 2), and that posture change is
          itself what freezes the sibling children that passed every gate (hop 3) — the
          third hop is caused by the second, not by the original funding call.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Dealer D1 (holdback_rate 0.10) has package P7 with two children: Kbad (credit 600) and Kok (credit 700, PREMIUM)."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D1", legal_name: "Northstar Security LLC", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d1_id: $.data.id }
