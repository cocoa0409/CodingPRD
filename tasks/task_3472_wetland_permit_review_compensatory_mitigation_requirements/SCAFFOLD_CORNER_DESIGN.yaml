# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across the claim-extraction-guide taxonomy. Stubs marked
# excluded_because cite the §1.8 instance that already covers the claim.
# Logical clock default before any set_current_utc call: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_applicant_creation_conventions
        claim_type: creation
        grounds: [entities.Applicant]
        distinguishing_aspect: "POST /applicants returns 201 with server-minted id, version 1, created_at/updated_at populated, prior_violation_count 0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id", v: "$.data.version", pvc: "$.data.prior_violation_count", ca: "$.data.created_at" } }
          assert:
            - "HTTP 201; ap_id is a UUID; v == 1; pvc == 0; ca is an ISO-8601 UTC timestamp with three fractional digits"

      - name: corner_site_missing_watershed_rejected
        claim_type: required_fields
        grounds: [entities.WatersSite, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required watershed_code is rejected at priority 6 with ERR_INVALID_REQUEST; no site is persisted."
        test_recipe:
          setup: ["One registered applicant"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "No Watershed Tract", state_code: "VA", total_acres: 10.0, resource_types_present: ["STREAM"] }, as: SystemAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (400); GET /sites?applicant_id=${ap_id} returns an empty data array"

      - name: corner_jd_created_in_draft
        claim_type: creation
        grounds: [entities.JurisdictionalDetermination, state_machines.JurisdictionalDetermination]
        distinguishing_aspect: "A new JD starts in DRAFT with null issued_date and null expiration_date until issued."
        test_recipe:
          setup: ["Applicant and site registered"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Delineation under review" }, as: Reviewer, as_user_id: "rev-1", captures: { st: "$.data.status", issued: "$.data.issued_date", exp: "$.data.expiration_date" } }
          assert:
            - "st == DRAFT; issued == null; exp == null"

      - name: corner_application_computed_fields
        claim_type: computed_fields
        grounds: [entities.PermitApplication.fields.total_impact_acres, entities.PermitApplication.fields.compensatory_mitigation_required]
        distinguishing_aspect: "total_impact_acres, is_after_the_fact and compensatory_mitigation_required are server-computed from impacts and pathway at creation."
        test_recipe:
          setup: ["Applicant, site, ISSUED JURISDICTIONAL JD"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 1.5 }, { resource_type: "STREAM", impact_acres: 0.5 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { tot: "$.data.total_impact_acres", atf: "$.data.is_after_the_fact", req: "$.data.compensatory_mitigation_required", st: "$.data.status" } }
          assert:
            - "tot == 2.0 (1.5 + 0.5); atf == false; req == true (2.0 > 0.10); st == DRAFT"

      - name: corner_applicant_violation_count_computed
        claim_type: computed_fields
        grounds: [entities.Applicant.fields.prior_violation_count]
        distinguishing_aspect: "prior_violation_count counts only cases past OPENED: an OPENED case leaves it 0; confirming the violation raises it to 1."
        test_recipe:
          setup: ["Applicant with site; enforcement case opened"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/enforcement-cases", payload: { site_id: "${site_id}", responsible_applicant_id: "${ap_id}", unauthorized_fill_acres: 1.0, description: "Unpermitted fill" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "GET /wetland-permits/applicants/${ap_id}", as: SystemAdmin, captures: { pvc_open: "$.data.prior_violation_count" } }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/confirm-violation", payload: {}, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "GET /wetland-permits/applicants/${ap_id}", as: SystemAdmin, captures: { pvc_conf: "$.data.prior_violation_count" } }
          assert:
            - "pvc_open == 0 (OPENED cases do not count)"
            - "pvc_conf == 1 (VIOLATION_CONFIRMED counts)"

      - name: corner_get_missing_application_not_found
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown application id returns 404 ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wetland-permits/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPLICATION_NOT_FOUND (404)"

      - name: corner_get_missing_bank_not_found
        claim_type: not_found
        grounds: ["errors[ERR_BANK_NOT_FOUND]"]
        distinguishing_aspect: "GET on an unknown bank id returns 404 ERR_BANK_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wetland-permits/mitigation-banks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_BANK_NOT_FOUND (404)"

      - name: corner_not_found_sweep_remaining_entities
        claim_type: not_found
        grounds: ["errors[ERR_SITE_NOT_FOUND]", "errors[ERR_JD_NOT_FOUND]", "errors[ERR_APPEAL_NOT_FOUND]", "errors[ERR_AA_NOT_FOUND]", "errors[ERR_COMMENT_NOT_FOUND]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_CREDIT_TXN_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]", "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "Every other single-resource GET maps an unknown id to its entity-specific 404 error id."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wetland-permits/applicants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SystemAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "GET /wetland-permits/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e2: "$.data.error_id" } }
            - { call: "GET /wetland-permits/jurisdictional-determinations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e3: "$.data.error_id" } }
            - { call: "GET /wetland-permits/appeals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e4: "$.data.error_id" } }
            - { call: "GET /wetland-permits/alternatives-analyses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e5: "$.data.error_id" } }
            - { call: "GET /wetland-permits/agency-comments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e6: "$.data.error_id" } }
            - { call: "GET /wetland-permits/mitigation-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e7: "$.data.error_id" } }
            - { call: "GET /wetland-permits/credit-transactions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e8: "$.data.error_id" } }
            - { call: "GET /wetland-permits/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e9: "$.data.error_id" } }
            - { call: "GET /wetland-permits/monitoring-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e10: "$.data.error_id" } }
            - { call: "GET /wetland-permits/enforcement-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Reviewer, as_user_id: "rev-1", captures: { e11: "$.data.error_id" } }
          assert:
            - "e1..e11 == ERR_APPLICANT_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_JD_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_AA_NOT_FOUND, ERR_COMMENT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_CREDIT_TXN_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CASE_NOT_FOUND respectively (all 404)"

      - name: corner_list_sites_filtered_by_applicant
        claim_type: listing
        grounds: [endpoints.GET /wetland-permits/sites]
        distinguishing_aspect: "The applicant_id filter returns only that applicant's sites; unfiltered list returns all in created_at ascending order."
        test_recipe:
          setup: ["Two applicants with one site each"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "a@acme.example" }, as: SystemAdmin, captures: { ap_a: "$.data.id" } }
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Blue Ridge Builders", organization_type: "CORPORATION", contact_email: "b@brb.example" }, as: SystemAdmin, captures: { ap_b: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_a}", site_name: "Acme Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["STREAM"] }, as: SystemAdmin, captures: { site_a: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_b}", site_name: "BRB Lot", state_code: "MD", watershed_code: "02070010", total_acres: 9.0, resource_types_present: ["EMERGENT_MARSH"] }, as: SystemAdmin, captures: { site_b: "$.data.id" } }
          trigger:
            - { call: "GET /wetland-permits/sites?applicant_id=${ap_a}", as: Reviewer, as_user_id: "rev-1", captures: { first: "$.data[0].id" } }
          assert:
            - "filtered list contains exactly one row and first == ${site_a}; total_count == 1"

      - name: corner_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Applicant.fields.organization_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An organization_type outside the declared enum is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Mystery Trust", organization_type: "TRUST", contact_email: "x@x.example" }, as: SystemAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

  - section: state_machines
    instances:
      - name: corner_jd_double_issue_rejected
        claim_type: invalid_transition
        grounds: [state_machines.JurisdictionalDetermination.DRAFT_to_ISSUED, "errors[ERR_JD_INVALID_STATE]"]
        distinguishing_aspect: "Issuing an already-ISSUED JD is rejected with ERR_JD_INVALID_STATE; the second call changes nothing."
        test_recipe:
          setup: ["JD issued for a site"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_JD_INVALID_STATE (409)"

      - name: corner_jd_reversed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.JurisdictionalDetermination.ISSUED_to_REVERSED, "errors[ERR_JD_INVALID_STATE]"]
        distinguishing_aspect: "A REVERSED JD is terminal: issue on it fails, and no transition out of REVERSED exists."
        test_recipe:
          setup: ["JD issued, appealed, and the appeal SUSTAINED so the JD is REVERSED"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/appeals", payload: { jd_id: "${jd_id}", grounds_text: "Delineation omitted a channel" }, as: Applicant, as_user_id: "${ap_id}", captures: { appeal_id: "$.data.id" } }
            - { call: "POST /wetland-permits/appeals/${appeal_id}/decide", payload: { outcome: "SUSTAINED", decision_rationale: "Remand confirmed" }, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_JD_INVALID_STATE; the JD remains REVERSED"

      - name: corner_appeal_double_decide_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Appeal, "errors[ERR_APPEAL_INVALID_STATE]"]
        distinguishing_aspect: "A second decide on an already-decided appeal is rejected with ERR_APPEAL_INVALID_STATE."
        test_recipe:
          setup: ["Appeal FILED on an ISSUED APPROVED JD"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/appeals", payload: { jd_id: "${jd_id}", grounds_text: "Grounds" }, as: Applicant, as_user_id: "${ap_id}", captures: { appeal_id: "$.data.id" } }
            - { call: "POST /wetland-permits/appeals/${appeal_id}/decide", payload: { outcome: "DENIED", decision_rationale: "Delineation upheld" }, as: DistrictEngineer, as_user_id: "de-1" }
          trigger:
            - { call: "POST /wetland-permits/appeals/${appeal_id}/decide", payload: { outcome: "SUSTAINED", decision_rationale: "Second bite" }, as: DistrictEngineer, as_user_id: "de-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPEAL_INVALID_STATE; the appeal stays DENIED"

      - name: corner_application_submit_from_screening_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "submit is defined only from DRAFT, RETURNED_TO_APPLICANT, and SUSPENDED_PENDING_JD; from SCREENING it fails."
        test_recipe:
          setup: ["Application in SCREENING"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPLICATION_INVALID_STATE (409)"

      - name: corner_application_withdraw_from_issued_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PermitApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "ISSUED is terminal for the application lifecycle: withdraw after issuance fails and the permit survives."
        test_recipe:
          setup: ["Application fully ISSUED (secured plan, FAVORABLE pir, district engineer de-9 distinct from screener rev-1)"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
