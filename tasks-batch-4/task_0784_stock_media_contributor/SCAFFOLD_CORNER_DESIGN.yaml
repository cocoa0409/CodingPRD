              captures: { rel_id: $.data.id }
            - call: "POST /model-releases/${rel_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "T", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: true, model_release_id: "${rel_id}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
          trigger:
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
          assert:
            - "Asset.${a_id}.status == ACCEPTED"
            - "Contributor.${c_id}.accepted_asset_count == 1"

      - name: corner_end_before_start_window_invalid
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_VALIDATION]", entities.ExclusivityWindow.fields.end_at]
        distinguishing_aspect: "POST exclusivity-windows with end_at <= start_at -> ERR_VALIDATION (422)."
