  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_product_version_on_change_order_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.change-order-create-stale-product, errors.ERR_STALE_PRODUCT_VERSION]
        distinguishing_aspect: "The product's version is bumped by the order create itself, so a client that reuses the version it read before that create is rejected with 412 and must re-read; the retry with the refreshed version succeeds without any other change to the request."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Product SKU-OCC-1 own 20000, cost 8000, margin 0.20 -> effective_floor 10000, version 1 captured at creation."
            - "Order A created MANUAL at 19000 for the window 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z using that version, which bumps Product.version to 2."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-OCC-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, p_ver1: $.data.version }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-02T00:00:00Z", expected_product_version: "${p_ver1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_a: $.data.id }
          trigger:
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 18500, effective_from: "2026-08-02T00:00:00Z", expected_product_version: "${p_ver1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /pricing/products/${p_id}"
              payload: {}
              as: PricingAnalyst
              captures: { p_ver2: $.data.version }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 18500, effective_from: "2026-08-02T00:00:00Z", expected_product_version: "${p_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_b: $.data.id }
          assert:
            - "First trigger: HTTP 412 with error_id == ERR_STALE_PRODUCT_VERSION"
            - "Product.${p_id}.version reads 2 after the rejection — a 412 neither creates a row nor bumps the version"
            - "Third trigger: HTTP 201 with PriceChangeOrder.${ord_b}.proposed_price_cents == 18500 and Product.${p_id}.version == 3"
            - "GET /pricing/change-orders?product_id=${p_id} returns total_count == 2 containing ${ord_a} and ${ord_b}, both DRAFT"
            - "Product.${p_id}.own_price_cents is still 20000 — creating orders never moves the price, only executing does"

      - name: corner_occ_stale_market_version_on_index_report_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.index-report-create-stale-market, errors.ERR_STALE_MARKET_VERSION]
        distinguishing_aspect: "Report creation is the writer that advances Market.version, so two reports built from one market read collide: the second is 412 on its own dedicated error code, distinct from the product-side stale-version code."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST at AT_PARITY with strategic_index_target_bp 9800, version 1 captured at creation."
            - "One ACTIVE product SKU-OCCM-1 own 20000, cost 8000 with no CONFIRMED match, so both reports come out INSUFFICIENT — the collision is about versions, not about data."
            - "Report R1 for (US-WEST, APPLIANCE, MATCHED_BASKET) created with the captured version, which bumps Market.version to 2."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_ver1: $.data.version }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-OCCM-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", basis: "MATCHED_BASKET", expected_market_version: "${m_ver1}" }
              as: PricingAnalyst
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", basis: "IMPUTED_FULL_CATALOG", expected_market_version: "${m_ver1}" }
              as: PricingAnalyst
              captures: { e_stale_market: $.data.error_id }
            - call: "GET /pricing/markets/${m_id}"
              payload: {}
              as: PricingAnalyst
              captures: { m_ver2: $.data.version }
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", basis: "IMPUTED_FULL_CATALOG", expected_market_version: "${m_ver2}" }
              as: PricingAnalyst
              captures: { rep2: $.data.id }
          assert:
            - "First trigger: HTTP 412 with error_id == ERR_STALE_MARKET_VERSION, not ERR_STALE_PRODUCT_VERSION"
            - "Market.${m_id}.version reads 2 after the rejection and 3 after the accepted retry"
            - "GET /pricing/index-reports?market_id=${m_id} returns total_count == 2 containing ${rep1} and ${rep2}, both DRAFT"
            - "Both reports have candidate_product_count == 1, matched_product_count == 0, data_sufficiency == INSUFFICIENT, index_bp == null and positioning_verdict == INDETERMINATE"
            - "Market.${m_id}.observed_index_bp and pricing_posture are untouched by DRAFT creation: still null and OPEN"

      - name: corner_label_batch_selector_ranks_earliest_window_then_falls_back
        claim_type: selector_policy
        grounds: [calculations.label_batch_selection, "endpoints.POST_/pricing/change-orders/{id}/decide.side_effects"]
        distinguishing_aspect: "The selector is a ranked waterfall, not a first-found scan: with two SCHEDULED batches the later-created but earlier-starting one wins, and with no candidate at all the order is still QUEUED with a null label_batch_id instead of erroring."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with label_printer_capacity_per_day 5."
            - "Products SKU-SEL-1 and SKU-SEL-2, both own 20000, cost 8000, margin 0.20."
            - "Batch B_LATE created first with window 2026-08-01T06:00:00Z..08:00:00Z, then batch B_EARLY with window 2026-08-01T02:00:00Z..04:00:00Z, each reserving 1 item."
            - "Order 1 on SKU-SEL-1 with signage_store_id STORE-101, submitted."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-SEL-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id, p1_ver: $.data.version }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-SEL-2", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p2_id: $.data.id, p2_ver: $.data.version }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T08:00:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_late: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T04:00:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_early: $.data.id }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p1_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p1_ver}", signage_store_id: "${s_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord1: $.data.id }
            - call: "POST /pricing/change-orders/${ord1}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /pricing/change-orders/${ord1}/decide"
              payload: { decision: "APPROVE" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { sig1: $.data.signage_status }
            - call: "POST /pricing/label-batches/${b_early}/cancel"
              payload: { cancel_reason: "printer swap" }
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/label-batches/${b_late}/cancel"
              payload: { cancel_reason: "printer swap" }
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p2_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p2_ver}", signage_store_id: "${s_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord2: $.data.id }
            - call: "POST /pricing/change-orders/${ord2}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pricing/change-orders/${ord2}/decide"
              payload: { decision: "APPROVE" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { sig2: $.data.signage_status }
          assert:
            - "First trigger: HTTP 200 with PriceChangeOrder.${ord1}.signage_status == QUEUED and label_batch_id == ${b_early}, not ${b_late}"
            - "LabelPrintBatch.${b_early}.queued_order_ids == [${ord1}] with item_count == 2, while LabelPrintBatch.${b_late}.queued_order_ids == [] with item_count == 1"
            - "Store.${s_id}.label_slots_used_today == 3 and label_slots_remaining_today == 2 at that point"
            - "After both cancellations: Store.${s_id}.label_slots_used_today == 0, label_slots_remaining_today == 5, and PriceChangeOrder.${ord1}.signage_status == NOT_REQUIRED with label_batch_id == null"
            - "Last trigger: HTTP 200 with PriceChangeOrder.${ord2}.signage_status == QUEUED and label_batch_id == null — the empty candidate set is a fallback, not an error"
            - "Store.${s_id}.label_slots_used_today is still 0 after that approval, because an unbatched queue consumes no batch slot"

      - name: corner_cascading_side_effects_reach_five_levels
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers.cascading_side_effects]
        distinguishing_aspect: "A single execute call must propagate five levels deep — price, link gaps, competitor auto-suspension, link demotion and observation voiding — with ordering that cannot be reproduced by any shallower chain."
        excluded_because:
          difficulty_instance: transitive_cascade / execute_order_drift_autosuspends_competitor_depth5
          rationale: "The §1.8 transitive_cascade instance already asserts the depth-5 chain level by level, so a separate corner recipe would duplicate it exactly."

      - name: corner_dual_variant_layer_diverges_on_identical_inputs
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers.dual_variant_calculation, calculations.match_confidence_score.variants, calculations.price_index.variants]
        distinguishing_aspect: "Both dual-variant calculations must produce different answers from one fixture — the confidence variants on one score triple and the index bases on one basket — which is what makes a single shared code path detectable."
        excluded_because:
          difficulty_instance: dual_variant_calc / confidence_variant_identifier_anchored_vs_attribute_blend
          rationale: "The §1.8 dual_variant_calc instances cover both variant pairs on shared fixtures (confidence 9700 vs 6000, and the matched-basket vs imputed index divergence), including the selection rule for each."

  - section: consistency_model
    instances:
      - name: corner_immediate_visibility_of_every_side_effect
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/pricing/change-orders/{id}/decide.side_effects"]
        distinguishing_aspect: "Under an immediate model the approving response itself already carries the label assignment, and reads of the other entities issued straight afterwards show the same values with no settling step or refresh call."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with label_printer_capacity_per_day 5."
            - "Product SKU-IMM-1 own 20000, cost 8000, margin 0.20; batch B with window 2026-08-01T02:00:00Z..04:00:00Z reserving 1 item."
            - "MANUAL order at 19000 with signage_store_id STORE-101, submitted and awaiting a decision."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-IMM-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T04:00:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p_ver}", signage_store_id: "${s_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_id: $.data.id }
            - call: "POST /pricing/change-orders/${ord_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /pricing/change-orders/${ord_id}/decide"
              payload: { decision: "APPROVE" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { batch_ref: $.data.label_batch_id }
            - call: "GET /pricing/stores/${s_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { used_now: $.data.label_slots_used_today }
            - call: "GET /pricing/label-batches/${b_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { batch_items: $.data.item_count }
          assert:
            - "The decide response itself already reads status == APPROVED, signage_status == QUEUED and label_batch_id == ${b_id} — no second call is needed to observe the assignment"
            - "The immediately following store read returns label_slots_used_today == 2 and label_slots_remaining_today == 3"
            - "The immediately following batch read returns item_count == 2 and queued_order_ids == [${ord_id}]"
            - "GET /pricing/change-orders?label_batch_id=${b_id} returns total_count == 1 in the same sequence, so the list projection is not lagging either"

      - name: corner_rejected_write_leaves_no_partial_state
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/pricing/claims/{id}/honor.side_effects", validations.priority_86_ERR_OVERRIDE_BUDGET_EXCEEDED]
        distinguishing_aspect: "The honor endpoint writes four entities, so a rejection must roll all four back together: with a 3000-cent budget and a 3099-cent discount none of the ledger row, the spawned order, the label slot or the policy counter may survive."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with override_authority 5000 and label_printer_capacity_per_day 5."
            - "Product SKU-ATOM-1 own 12999, cost 7000, margin 0.20 -> effective_floor 8750; CONFIRMED link to ACTIVE PRIMARY eligible C-A."
            - "Policy with daily_override_budget_cents 3000 and max_match_discount_pct 0.30 (cap 3900)."
            - "Claim CL at claimed_price 10400 -> bonus 500, honored 9900, discount 3099, tier ASSOCIATE; verified and decided VERIFIED."
            - "Batch B with window 2026-08-01T02:00:00Z..04:00:00Z reserving 1 item, so a successful honor would have had a slot to take."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-ATOM-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 12999, unit_cost_cents: 7000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 3000, max_match_discount_pct: 0.30 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T04:00:00Z", reserved_item_count: 1 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 10400, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-atom" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /pricing/claims/${cl_id}/verify"
              payload: {}
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${cl_id}/decide"
              payload: { decision: "VERIFIED" }
              as: StoreManager
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /pricing/claims/${cl_id}/honor"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { e_budget: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_OVERRIDE_BUDGET_EXCEEDED, because 0 + 3099 > 3000"
            - "PriceMatchClaim.${cl_id}.status is still VERIFIED with discount_cents == 3099 and required_approval_tier == ASSOCIATE"
            - "GET /pricing/claims/${cl_id}/override-logs returns total_count == 0 — no DEBIT row was written and then compensated"
            - "GET /pricing/change-orders?source_claim_id=${cl_id} returns total_count == 0, so no PRICE_MATCH order survives"
            - "Store.${s_id}.override_budget_used_cents == 0, label_slots_used_today == 1 and label_slots_remaining_today == 4 — only the batch's own reservation is held"
            - "LabelPrintBatch.${b_id}.queued_order_ids == [] with item_count == 1, and PriceMatchPolicy.${pol_id}.honored_claim_count == 0"
