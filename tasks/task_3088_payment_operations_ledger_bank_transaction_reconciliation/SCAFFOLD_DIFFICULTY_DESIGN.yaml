# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3088 - payment-operations-ledger-bank-transaction-reconciliation
#
# One `rule_id` block per §0.5 Difficulty Rule, two instances each (18 total).
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.6,
# and every test_recipe chain was replayed against §1.5 for endpoint, role,
# payload, capture and OCC-version conformance (scaffold_lint.py: clean).
#
# rule_id                        instance pair
#   dual_variant_calc            Ledger provisional-vs-posted | PaymentOrder aggregate-vs-tranche fee
#   combinatorial_formula        fee-pool floor-then-cycle (mode b) | deposit gross tier (mode c)
#   non_linear_state_machine     Transaction parallel axes | BankStatement revision cycle
#   transitive_cascade           return -> restrict -> suspend (depth 3) | revise -> deposits (depth 2)
#   priority_pair_validation_conflict  safety-vs-constraint | state-vs-temporal
#   boundary_precision_check     velocity strict ceiling | open-virtual-account cardinality
#   cross_entity_state_dependency      ExceptionItem<-Ledger | Relationship<-ExceptionItem
#   resource_temporal_overlap    statement cycle closed-end | calendar cutoff buffer
#   compensating_invariant       reverse-rail fee pool | double-entry identity
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: ledger_pending_vs_posted_variant_divergence
    grounds:
    - calculations.ledger_balance_projection
    - calculations.ledger_balance_projection.variants.provisional_pending
    - calculations.ledger_balance_projection.variants.final_posted
    - entities.Ledger.fields.pending_balance_cents
    - entities.Ledger.fields.posted_balance_cents
    - endpoints.POST_/ledgers/{ledgerId}/summary
    - endpoints.POST_/ledgers/{ledgerId}/recompute
    distinguishing_aspect: 'Two valid algorithms over one population diverge on the Ledger itself: an order dispatched
      but not settled is inside the provisional_pending input set and outside the final_posted input set, so after
      a 250000-cent ACH CREDIT order is dispatched the provisional variant reports 2239990 while the final variant
      still reports only the settled deposit''s 2500000, and the two differ by exactly the 250010 cents of the unsettled
      order.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. One ledger. One manual 2500000-cent CREDIT DEPOSIT posted and marked
        settled. One ACH CREDIT order for 250000 cents dispatched and never settled, so its ORIGINATING -250000
        leg and its FEE leg of -10 cents (the ACH CREDIT fee is adjusted to 0 and then floored to the declared 10-cent
        minimum) sit in the pending partition.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /ledgers
        payload:
          name: Ops Ledger
          currency: USD
        as: PlatformAdmin
