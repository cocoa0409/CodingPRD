  instances:
  - name: loan_dscr_and_ltv_reported_from_declared_constants
    claim_type: correct_result
    grounds:
    - calculations.loan_dscr
    - calculations.loan_ltv_check
    - entities.LoanFacility.fields.dscr
    - entities.LoanFacility.fields.ltv_pct
    distinguishing_aspect: 'One create call pins BOTH ratios against their declared constants: 720,000,000 at 425 bps on a 1,200,000,000 appraisal reports ltv_pct 60.0 and dscr 3.1699 — the dscr is round_half_up(97,000,000 * 10000 / 30,600,000) / 10000, i.e. 31699 basis points, not the truncated 31699.3.'
    test_recipe:
      setup:
      - Property P1 with appraised_value_cents 1,200,000,000 and annual_noi_cents 97,000,000.
      - DstTrust T1 FORMING on P1 with no facility yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
