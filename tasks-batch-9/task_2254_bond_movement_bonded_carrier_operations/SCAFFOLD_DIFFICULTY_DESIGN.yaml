            - "InBondMovement.${m4}.transit_deadline_utc == 2026-09-05T00:00:00Z"

      - name: single_transaction_bond_windows_are_closed_and_free_up_on_cancellation
        grounds:
          - validations[priority=13].ERR_STB_WINDOW_CONFLICT
          - calculations.bond_selection_policy
          - state_machines.InBondMovement.transit_status.FILED_to_CANCELLED
          - entities.CustomsBond.fields.bond_type
        distinguishing_aspect: |
          A different resource entity (CustomsBond coverage window rather than a
          Port bay) with the OPPOSITE interval semantics: movement windows on a
          SINGLE_TRANSACTION bond are CLOSED [filed_at, transit_deadline_utc], so a
          second filing whose window starts exactly at the first window's end
          (2026-09-05T00:00:00Z) collides and is refused; the same filing succeeds
          once the first movement is cancelled, and its deadline is
          2026-10-10T00:00:00Z.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW); carrier ACTIVE."
            - "Bond b4 = SINGLE_TRANSACTION limit 50000.00, 2026-07-01 .. 2027-06-30."
            - "M5 filed on b4 at 2026-08-01 covering the closed window [2026-08-01T00:00:00Z, 2026-09-05T00:00:00Z]; it is left FILED."
            - "Clock advanced to 2026-09-05T00:00:00Z, exactly the end of that window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "SINGLE_TRANSACTION", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-400" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b4: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0005", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b4}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m5: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0006", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b4}" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements/${m5}/cancellation"
              payload: { reason_code: "SHIPPER_WITHDREW" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0006", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b4}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m6: $.data.id }
          assert:
            - "the first MAN-0006 filing returned HTTP 409 with error_id == ERR_STB_WINDOW_CONFLICT"
            - "InBondMovement.${m5}.transit_status == CANCELLED"
            - "InBondMovement.${m5}.cancellation_reason == SHIPPER_WITHDREW"
            - "the retry returned HTTP 201 with InBondMovement.${m6}.transit_status == FILED"
            - "InBondMovement.${m6}.filed_at == 2026-09-05T00:00:00Z"
            - "InBondMovement.${m6}.transit_days_allowed == 35"
            - "InBondMovement.${m6}.transit_deadline_utc == 2026-10-10T00:00:00Z"
            - "InBondMovement.${m6}.obligation_amount == 41.75"
            - "CustomsBond.${b4}.obligated_amount == 41.75"
            - "CustomsBond.${b4}.available_amount == 49958.25"
            - "CustomsBond.${b4}.open_movement_count == 1"
            - "GET /in-bond/ledger-entries?bond_id=${b4} returns 3 entries with amounts 41.75, -41.75, 41.75 and balance_after 41.75, 0.00, 41.75"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancelling_a_claim_nets_its_ledger_stream_to_zero
        grounds:
          - state_machines.LiquidatedDamagesClaim.ISSUED_to_CANCELLED
          - calculations.bond_obligation_ledger_balance
          - entities.BondObligationLedgerEntry.fields.balance_after
        distinguishing_aspect: |
          Conserved quantity = MONEY: the signed ledger stream for claim_id must sum
          to exactly 0.00 after cancellation (+1234.60 INCREASE_LD then -1234.60
          RELEASE_LD) and CustomsBond.obligated_amount must return to the pre-claim
          41.75 / available 49958.25 — an implementation that merely flips the claim
          status leaves the bond at 1276.35.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; M1 = IT 4601 -> 3901 (obligation 41.75, deadline 2026-09-05T00:00:00Z) filed and departed on the CONTINUOUS 50000.00 bond."
            - "At 2026-09-11T12:00:00Z the carrier files the ARRIVAL report (7 days late)."
            - "OFF-1 issues a LATE_ARRIVAL claim: overdue 7, raw 1750.00, cap 1234.60 -> assessed 1234.60, taking the bond to obligated 1276.35 / available 48723.65."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T12:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "LATE_ARRIVAL", reason_code: "OVERDUE_ARRIVAL" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl4: $.data.id, cl4_amt: $.data.assessed_amount }
          trigger:
            - call: "POST /in-bond/ld-claims/${cl4}/disposition"
              payload: { action: "CANCEL", reason_code: "CLAIM_ISSUED_IN_ERROR" }
              as: FPFOfficer
              as_user_id: "FPF-9"
          assert:
            - "LiquidatedDamagesClaim.${cl4}.assessed_amount == 1234.60"
            - "LiquidatedDamagesClaim.${cl4}.overdue_days_at_issue == 7"
            - "LiquidatedDamagesClaim.${cl4}.status == CANCELLED"
            - "LiquidatedDamagesClaim.${cl4}.mitigated_amount == null"
            - "CustomsBond.${b1}.obligated_amount == 41.75"
            - "CustomsBond.${b1}.available_amount == 49958.25"
            - "CustomsBond.${b1}.status == ACTIVE"
            - "GET /in-bond/ledger-entries?claim_id=${cl4} returns exactly 2 entries: (INCREASE_LD, +1234.60, balance_after 1276.35) then (RELEASE_LD, -1234.60, balance_after 41.75); the signed sum is 0.00"
            - "InBondMovement.${m1}.transit_status == ARRIVED"
            - "InBondMovement.${m1}.obligation_amount == 41.75"

      - name: cancelling_the_claim_restores_sanction_points_but_not_cancelled_movements
        grounds:
          - calculations.carrier_sanction_points
          - state_machines.BondedCarrier.SUSPENDED_to_ACTIVE
          - state_machines.InBondMovement.transit_status.FILED_to_CANCELLED
        distinguishing_aspect: |
          A different conserved quantity — the RISK SCORE: excluding the cancelled
          NON_ARRIVAL claim returns sanction_points to exactly 4.0 (the surviving
          SEAL_VIOLATION) and the carrier to ACTIVE with suspension_reason null,
          yet the compensation is deliberately asymmetric: M3, cancelled by the
          suspension cascade, stays CANCELLED and its obligation is NOT re-added,
          leaving the bond at 1041.75.
        test_recipe:
          setup:
            - "The end state of the non-arrival cascade: clock 2026-09-06T00:00:00Z, carrier SUSPENDED at sanction_points 10.0."
            - "Claims: SEAL_VIOLATION (issued 2026-08-10, assessed 1000.00, 4 points) and NON_ARRIVAL (issued 2026-09-06, assessed 1000.00, 6 points), both by OFF-1."
            - "M1 is OVERDUE; M3 was CANCELLED by the cascade; bond obligated 2041.75 / available 47958.25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0003", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m3: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/seal-events"
              payload: { movement_id: "${m1}", event_type: "BROKEN_UNAUTHORIZED", seal_number: "SEAL-100", port_code: "3901" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "SEAL_VIOLATION", reason_code: "SEAL_BROKEN_IN_TRANSIT" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl_seal2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/compliance-sweeps"
              payload: { note: "mark overdue" }
              as: CBPOfficer
