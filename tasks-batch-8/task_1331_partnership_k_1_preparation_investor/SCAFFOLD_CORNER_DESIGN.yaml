              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP1", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 1000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 9000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp1: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/tax-years/${ty}/submit-review"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP3", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "NY", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp3: "$.data.id" }
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${p_lp1}", transferee_partner_id: "${p_lp3}", pct_bps: 100, effective_date: "2025-06-01", settlement_date: "2025-06-10" }
              as: FundTaxAdmin
              captures: { tr: "$.data.id" }
            - call: "POST /funds/transfers/${tr}/confirm"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/transfers/${tr}/settle"
              payload: {}
              as: FundTaxAdmin
          trigger:
            - call: "POST /funds/tax-years/${ty}/approve"
              payload: {}
              as: TaxReviewer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_ALLOCATION_STALE (409) — the state precondition (UNDER_REVIEW) passes and only the fiscal staleness check fires"
            - "TaxYear.${ty}.status remains UNDER_REVIEW; AllocationRun.${run}.status == STALE"

