  # ===========================================================================
  - section: errors
    instances:
      - name: error_brand_safety_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_BRAND_SAFETY_CONFLICT]"]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_line_item_create
          rationale: "Asserted as the winning error of the §1.8 dual-failure instance."
      - name: error_make_good_outstanding_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_MAKE_GOOD_OUTSTANDING]"]
        excluded_because:
          difficulty_instance: invoice_issue_blocked_by_offered_makegood
          rationale: "Asserted as the blocking error in the §1.8 cross-entity gate instance."
      - name: error_stale_version_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: campaign_patch_occ_stale_after_increment
          rationale: "Asserted as the 412 outcome of the OCC corner instance in the cross-cutting layer section below."

  # ===========================================================================
  - section: rbac
    instances:
      - name: advertiser_role_cannot_create_shows
        claim_type: rbac_denial
        grounds: ["roles[AdOps].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Advertiser is not in the roles of POST /adnet/shows -> 403 ERR_FORBIDDEN regardless of payload validity."
        test_recipe:
          setup: ["One advertiser exists"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "RoleCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
          trigger:
            - call: "POST /adnet/shows"
              payload: { title: "Nope", content_category: "NEWS", avg_downloads_30d: 1 }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_FORBIDDEN"

      - name: show_producer_cannot_review_produced_audio
        claim_type: rbac_denial
        grounds: ["roles[ShowProducer].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Kind-scoped authority: the ShowProducer may review HOST_READ_SCRIPT for its own show but a PRODUCED_AUDIO copy (AdOps-only) draws 403."
        test_recipe:
          setup: ["Show; advertiser; campaign; PRODUCED_AUDIO copy SUBMITTED"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Prod FM", content_category: "COMEDY", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "PrCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CP", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
          trigger:
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: ShowProducer
              as_user_id: "${sh}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_FORBIDDEN; AdCopy.${cpy}.status stays SUBMITTED"

      - name: advertiser_cannot_patch_foreign_campaign
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership scoping: Advertiser B holding a fresh version of Advertiser A's campaign still gets 403 on PATCH."
        test_recipe:
          setup: ["Advertisers A and B; DRAFT campaign of A; current version captured via GET"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "OwnerA", category: "FINTECH" }
              as: AdOps
              captures: { adva: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "OwnerB", category: "AUTOMOTIVE" }
              as: AdOps
              captures: { advb: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adva}", name: "CA", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "GET /adnet/campaigns/${cmp}"
              as: Advertiser
              as_user_id: "${advb}"
              captures: { cver: $.data.version }
          trigger:
            - call: "PATCH /adnet/campaigns/${cmp}"
              payload: { cpm_cents: 9999, expected_campaign_version: "${cver}" }
              as: Advertiser
              as_user_id: "${advb}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_FORBIDDEN; cpm_cents stays 1000"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: campaign_patch_occ_stale_after_increment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: a PATCH with the pre-mutation version is rejected 412 after an earlier PATCH advanced Campaign.version; the sequential loser observes identical business state and would otherwise succeed."
        test_recipe:
          setup: ["Advertiser; DRAFT campaign created (version 1)"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "OccCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CO", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id, cver: $.data.version }
          trigger:
            - call: "PATCH /adnet/campaigns/${cmp}"
              payload: { cpm_cents: 1500, expected_campaign_version: "${cver}" }
              as: AdOps
            - call: "PATCH /adnet/campaigns/${cmp}"
              payload: { cpm_cents: 2500, expected_campaign_version: "${cver}" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds and Campaign.${cmp}.version == 2 (incremented by 1)"
            - "Second PATCH with the stale version: HTTP 412, error_id == ERR_STALE_VERSION"
            - "Campaign.${cmp}.cpm_cents == 1500 (the stale write changed nothing)"

      - name: copy_revocation_cascades_pause_line_items
        claim_type: cascading_side_effects
        grounds: [state_machines.AdCopy.APPROVED_to_CHANGES_REQUESTED, state_machines.LineItem.ACTIVE_to_PAUSED]
        distinguishing_aspect: "Requesting changes on an APPROVED copy pauses the ACTIVE line item serving it and releases its show reservation in the same request."
        test_recipe:
          setup: ["Show (avg 10000, episode in horizon -> forecast 9500); ACTIVE campaign; PRODUCED_AUDIO copy APPROVED; run-of-show line item reserved 100 ACTIVE (show reserved 100, available 9400)"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Rev FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
