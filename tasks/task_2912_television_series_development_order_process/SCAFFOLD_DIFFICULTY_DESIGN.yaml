# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: television-series-development (task_2912)
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every literal below is pre-computed from SCAFFOLD.yaml §1.3; no formula is left
# for the test author to evaluate.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: feasibility_pattern_basis_feasible_while_license_basis_infeasible
        grounds:
          - calculations.pilot_series_feasibility
          - entities.Slate.fields.pattern_budget_per_episode_cents
          - entities.Slate.fields.license_fee_cap_per_episode_cents
          - entities.Slate.fields.max_deficit_per_episode_cents
          - entities.DevelopmentProject.fields.cumulative_dev_cost_cents
          - endpoints["GET /development-projects/{id}/feasibility"]
        distinguishing_aspect: |
          Cost-accounting variant on the DevelopmentProject/Slate economics: the same
          project row, the same episode_count and the same slate return verdict
          FEASIBLE on basis=PATTERN and verdict INFEASIBLE on basis=LICENSE, because
          only the LICENSE variant scales the licence ceiling by
          PLATFORM_COST_FACTOR_BPS[STREAMING]=12000 before amortising development
          cost. This is a different entity domain from the ScriptDeal commitment
          variants in the sibling instance.
        test_recipe:
          setup:
            - "logical clock at 2026-09-26T00:00:00Z"
            - "one STREAMING slate, season 2027, total_dev_budget_cents 400000000, pattern_budget_per_episode_cents 32000000, license_fee_cap_per_episode_cents 30000000, max_deficit_per_episode_cents 7000000"
            - "one DevelopmentProject on that slate with dev_status PILOT_DELIVERED and cumulative_dev_cost_cents exactly 37375000 (4375000 of accepted guaranteed script step plus a 33000000 wrapped pilot budget)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 82.5, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", guaranteed_step_count: 1, option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 3000000 }, { step_type: "FIRST_DRAFT", fee_cents: 8000000 }] }
              as: BusinessAffairs
              captures: { deal_id: $.data.id }
            - call: "GET /script-deals/${deal_id}/steps"
              payload: {}
              as: BusinessAffairs
              captures: { step1_id: "$.data[0].id" }
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/exercise"
              payload: {}
              as: BusinessAffairs
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/deliver"
              payload: {}
              as: DevelopmentExec
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/review"
              payload: { outcome: "ACCEPT" }
              as: DevelopmentExec
            - call: "POST /pilot-orders"
              payload: { project_id: "${proj_id}", budget_cents: 33000000, shoot_start_date: "2026-09-10", shoot_end_date: "2026-09-25", casting_deadline_date: "2026-09-05", location_deadline_date: "2026-09-08" }
              as: DevelopmentExec
              captures: { pilot_id: $.data.id }
            - call: "POST /pilot-orders/${pilot_id}/contingency-clearances"
              payload: { kind: "CASTING", resolution: "SATISFIED" }
              as: DevelopmentExec
            - call: "POST /pilot-orders/${pilot_id}/contingency-clearances"
              payload: { kind: "LOCATION", resolution: "SATISFIED" }
              as: DevelopmentExec
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pilot-orders/${pilot_id}/wrap"
              payload: {}
              as: DevelopmentExec
          trigger:
            - call: "GET /development-projects/${proj_id}/feasibility"
              payload: { basis: "PATTERN", episode_count: 10 }
              as: FinanceController
            - call: "GET /development-projects/${proj_id}/feasibility"
              payload: { basis: "LICENSE", episode_count: 10 }
              as: FinanceController
          assert:
            - "DevelopmentProject.${proj_id}.cumulative_dev_cost_cents == 37375000"
            - "PATTERN read: per_episode_cost_cents == 35737500"
            - "PATTERN read: tier_factor_bps == 9000"
            - "PATTERN read: license_fee_final_cents == 30000000"
            - "PATTERN read: deficit_per_episode_cents == 5737500"
            - "PATTERN read: total_deficit_cents == 57375000"
            - "PATTERN read: verdict == FEASIBLE"
            - "LICENSE read: per_episode_cost_cents == 39737500"
            - "LICENSE read: tier_factor_bps == 9000"
            - "LICENSE read: license_fee_final_cents == 30000000"
            - "LICENSE read: deficit_per_episode_cents == 9737500"
            - "LICENSE read: total_deficit_cents == 97375000"
            - "LICENSE read: verdict == INFEASIBLE"
            - "the two reads differ by exactly 4000000 cents of per-episode deficit on identical stored data"

      - name: script_deal_guaranteed_only_and_full_option_variants_diverge
        grounds:
          - calculations.script_deal_commitment
          - entities.ScriptDeal.fields.guaranteed_commitment_cents
          - entities.ScriptDeal.fields.full_option_exposure_cents
          - entities.ScriptDeal.fields.encumbered_cents
          - entities.DealStep.fields.effective_fee_cents
          - entities.Writer.fields.guild_minimum_tier
        distinguishing_aspect: |
          Contractual-exposure variant on the ScriptDeal/DealStep/Writer domain, not
          on slate economics: GUARANTEED_ONLY sums step_index <= guaranteed_step_count
          while FULL_OPTION sums every step, and the guild-floor scaling makes the
          divergence non-proportional - the guaranteed STORY step is lifted from its
          submitted 3000000 to the HIGH-tier floor 4375000 while the optional
          FIRST_DRAFT keeps its submitted 8000000 because that already clears its floor.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one writer with guild_minimum_tier HIGH"
            - "one DevelopmentProject in ACTIVE_DEVELOPMENT on a slate with total_dev_budget_cents 400000000"
            - "one ScriptDeal with guaranteed_step_count 1 and two steps: STORY at 3000000 and FIRST_DRAFT at 8000000, both still PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 82.5, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", guaranteed_step_count: 1, option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 3000000 }, { step_type: "FIRST_DRAFT", fee_cents: 8000000 }] }
              as: BusinessAffairs
              captures: { deal_id: $.data.id }
            - call: "GET /script-deals/${deal_id}/steps"
              payload: {}
              as: BusinessAffairs
            - call: "GET /slates/${slate_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ScriptDeal.${deal_id}.step_count == 2"
            - "ScriptDeal.${deal_id}.guaranteed_commitment_cents == 4375000"
            - "ScriptDeal.${deal_id}.full_option_exposure_cents == 12375000"
            - "ScriptDeal.${deal_id}.encumbered_cents == 4375000"
            - "the STORY step has effective_fee_cents == 4375000 while its submitted fee_cents == 3000000"
            - "the FIRST_DRAFT step has effective_fee_cents == 8000000, equal to its submitted fee_cents"
            - "Slate.${slate_id}.committed_dev_cents == 4375000"
            - "Slate.${slate_id}.available_dev_cents == 395625000"
            - "full_option_exposure_cents - guaranteed_commitment_cents == 8000000 on identical stored data"

  - rule_id: combinatorial_formula
    instances:
      - name: feasibility_tier_pinned_to_provisional_deficit_not_final_deficit
        grounds:
          - calculations.pilot_series_feasibility
          - calculations.pilot_series_feasibility.constants.DEFICIT_TIER1_CENTS
          - endpoints["GET /development-projects/{id}/feasibility"]
        distinguishing_aspect: |
          Mode (c) - pinned evaluation order inside a circular pair. tier_factor_bps
          is selected from the PROVISIONAL deficit (per_episode_cost minus the raw
          slate cap) while the FINAL deficit is produced two steps later from the
          tier-scaled licence fee. On this slate the two deficits straddle
          DEFICIT_TIER1_CENTS = 1500000 (provisional 1000000, final 1550000), so
          re-deriving the tier from the final deficit - or iterating the pair to a
          fixed point - returns tier 9000 and flips the verdict. The second read at
          episode_count 4 crosses the same breakpoint legitimately, so an
          implementation that hardcodes one tier fails too.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one STREAMING slate with pattern_budget_per_episode_cents 30500000, license_fee_cap_per_episode_cents 30000000, max_deficit_per_episode_cents 2000000, total_dev_budget_cents 100000000"
            - "one DevelopmentProject on it in ACTIVE_DEVELOPMENT whose cumulative_dev_cost_cents is exactly 5000000 (one guaranteed STORY step at 5000000 for a LOW-tier writer, whose guild floor 3500000 does not bite)"
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Meridian Literary", agency_code: "MER", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 100000000, pattern_budget_per_episode_cents: 30500000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 2000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Boris Kade", agency_id: "${ag_id}", guild_minimum_tier: "LOW", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Deep Cover", logline: "A tax auditor infiltrates a cartel by accident.", packaging_elements: [], underlying_ip_key: "IP-DEEP-COVER" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-DEEP-COVER", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 78.0, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", guaranteed_step_count: 1, option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 5000000 }] }
              as: BusinessAffairs
              captures: { deal_id: $.data.id }
          trigger:
            - call: "GET /development-projects/${proj_id}/feasibility"
              payload: { basis: "PATTERN", episode_count: 10 }
              as: FinanceController
            - call: "GET /development-projects/${proj_id}/feasibility"
              payload: { basis: "PATTERN", episode_count: 4 }
              as: FinanceController
          assert:
            - "DevelopmentProject.${proj_id}.cumulative_dev_cost_cents == 5000000"
            - "read at episode_count 10: per_episode_cost_cents == 31000000"
            - "read at episode_count 10: tier_factor_bps == 9500 (chosen from provisional deficit 1000000, which is <= 1500000)"
            - "read at episode_count 10: license_fee_final_cents == 29450000"
            - "read at episode_count 10: deficit_per_episode_cents == 1550000"
            - "read at episode_count 10: total_deficit_cents == 15500000"
            - "read at episode_count 10: verdict == FEASIBLE"
            - "re-deriving the tier from the final deficit 1550000 would give tier 9000, license_fee_final_cents 27900000, deficit_per_episode_cents 3100000 and verdict INFEASIBLE - that response is wrong"
            - "read at episode_count 4: per_episode_cost_cents == 31750000"
            - "read at episode_count 4: tier_factor_bps == 9000 (provisional deficit 1750000 > 1500000)"
            - "read at episode_count 4: license_fee_final_cents == 28575000"
            - "read at episode_count 4: deficit_per_episode_cents == 3175000"
            - "read at episode_count 4: total_deficit_cents == 12700000"
            - "read at episode_count 4: verdict == INFEASIBLE"

      - name: test_score_rounds_each_weighted_component_before_summing
        grounds:
          - calculations.weighted_test_score
          - entities.TestScreening.fields.weighted_raw_score
          - entities.TestScreening.fields.norm_adjusted_score
          - endpoints["POST /pilot-orders/{id}/test-screenings"]
        distinguishing_aspect: |
          Mode (b) - pinned rounding order in a two-stage weighted score, a wholly
          different combinatorial hazard from the sibling instance's circular
          tier/fee pair. Each of the three weighted components is rounded
          half-up to 2 decimals BEFORE they are summed, and only then is the sum
          normalised against comp_norm_index and rounded to 1 decimal. Summing the
          unrounded products first gives 65.70 rather than 65.71 on the first
          screening, and the second screening shows the 62.0 floor being reached
          exactly from below through the same two-stage rounding.
        test_recipe:
          setup:
            - "one wrapped PilotOrder on a PILOT_DELIVERED project (full intake -> deal -> pilot -> wrap chain)"
            - "logical clock advanced to 2026-09-26T00:00:00Z so the shoot window has elapsed"
