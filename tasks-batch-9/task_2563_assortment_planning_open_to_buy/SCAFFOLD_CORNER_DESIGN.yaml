              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 1, unit_cost_cents: 2600, ship_window_start: "2027-04-01T00:00:00Z", ship_window_end: "2027-04-08T00:00:00Z", expected_plan_month_version: "${v3}" }
