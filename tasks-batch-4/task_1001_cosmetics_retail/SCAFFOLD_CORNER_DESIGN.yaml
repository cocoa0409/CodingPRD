  # ============================================================ calculations
  - section: calculations
    instances:
      - name: shade_match_ranks_by_score_then_depth_then_created_at
        claim_type: selector_policy
        grounds: ["calculations.shade_match_ranking", "endpoints[POST /shade-recommendations]"]
        distinguishing_aspect: "Score = 100 - 10*|depth diff| + 25 (undertone) + 15 (finish): the exact WARM/MATTE/depth-6 variant scores 140, the depth-5 WARM/MATTE scores 130 and the depth-6 COOL/MATTE scores 115, so the 140 variant is returned."
        test_recipe:
          setup: ["Three ACTIVE, NOT_LIMITED variants: V_A (depth 6, WARM, MATTE), V_B (depth 5, WARM, MATTE), V_C (depth 6, COOL, MATTE)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Sand", shade_code: "F-06W", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { va_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Beige", shade_code: "F-05W", finish: "MATTE", undertone: "WARM", depth_index: 5, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { vb_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Shell", shade_code: "F-06C", finish: "MATTE", undertone: "COOL", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { vc_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "sm@x.com", name: "SM" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /shade-recommendations"
              payload: { undertone: "WARM", depth_index: 6, finish_pref: "MATTE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rec_id: "$.data.id"}
          assert:
            - "${rec_id} == ${va_id} (score 140 beats 130 and 115)"
            - "HTTP 200 and response_type == object"
            - "the recommendation is decided by the score/depth/created_at chain, never by the UUID id"

      - name: shade_match_excludes_discontinued_and_unopened_launch_variants
        claim_type: input_set_filtering
        grounds: ["calculations.shade_match_ranking", "entities.Variant.fields.status", "entities.Variant.fields.launch_status"]
        distinguishing_aspect: "The eligibility filter is status == ACTIVE AND launch_status IN {NOT_LIMITED, PUBLIC}: a DISCONTINUED perfect match and a SCHEDULED limited perfect match are both excluded, so the imperfect NOT_LIMITED variant (score 100) wins."
        test_recipe:
          setup:
            - "V_DISC: depth 6 WARM MATTE but PATCHed to DISCONTINUED (would score 140)."
            - "V_LTD: depth 6 WARM MATTE, is_limited_launch, still SCHEDULED at the 2026-05-01T00:00:00Z default clock (would score 140)."
            - "V_OK: depth 6 NEUTRAL DEWY, ACTIVE, NOT_LIMITED (scores 100)."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Disc", shade_code: "F-D", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { v_disc_id: "$.data.id"}
            - call: "PATCH /variants/${v_disc_id}"
              payload: { status: "DISCONTINUED" }
              as: MerchandisingAdmin
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Ltd", shade_code: "F-L", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 4500, is_limited_launch: true, launch_open_rouge_at: "2026-07-01T00:00:00Z", launch_open_vib_at: "2026-07-02T00:00:00Z", launch_open_public_at: "2026-07-03T00:00:00Z" }
              as: MerchandisingAdmin
              captures: { v_ltd_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Ok", shade_code: "F-O", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { v_ok_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "flt@x.com", name: "Flt" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /shade-recommendations"
              payload: { undertone: "WARM", depth_index: 6, finish_pref: "MATTE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rec_id: "$.data.id"}
          assert:
            - "${rec_id} == ${v_ok_id}"
            - "${rec_id} != ${v_disc_id} and ${rec_id} != ${v_ltd_id}"

      - name: shade_match_store_filter_excludes_out_of_stock_variants
        claim_type: input_set_filtering
        grounds: ["calculations.shade_match_ranking", "endpoints[POST /shade-recommendations]", "entities.InventoryLot.fields.on_hand_units"]
        distinguishing_aspect: "When store_id is supplied, a variant with no drawable units at that store (on_hand - launch_reserved < 1) leaves the candidate set even though it would score highest; the stocked, lower-scoring variant is returned instead."
        test_recipe:
          setup:
            - "V_HI (depth 6 WARM MATTE, score 140) has a lot at SEP-CA with units_received 0."
            - "V_LO (depth 6 NEUTRAL DEWY, score 100) has a lot at SEP-CA with units_received 5."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Hi", shade_code: "F-HI", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { v_hi_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Lo", shade_code: "F-LO", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { v_lo_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_hi_id}", units_received: 0 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_lo_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "stk@x.com", name: "Stk" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
