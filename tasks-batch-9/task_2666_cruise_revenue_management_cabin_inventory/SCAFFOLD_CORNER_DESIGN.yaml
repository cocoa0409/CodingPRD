          assert:
            - "the unknown booking in the path returns HTTP 404 with data.error_id == ERR_BOOKING_NOT_FOUND - the path id is resolved at priority 5, before the body"
            - "the unknown target category returns HTTP 404 with data.error_id == ERR_CABIN_CATEGORY_NOT_FOUND at priority 6"
            - "the SPA target returns HTTP 422 with data.error_id == ERR_UPGRADE_PATH_INVALID: SPA has an allotment and a current fare rule, but it is not reachable from IA by following upgrade_to_category_id"
            - "the OV target returns HTTP 201 with status == SUBMITTED, counter_rounds == 0, countered_min_per_guest_cents == null and award_amount_cents == null"
            - "UpgradeBid.${bid_ov}.booking_id == ${bk_nell} and target_cabin_category_id == ${cat_ov} - the join is stored on both ends"
            - "UpgradeBid.${bid_ov}.guest_count == 2 and submitted_days_to_sail == 45"
            - "UpgradeBid.${bid_ov}.min_acceptable_per_guest_cents == 33000: fare_gap 100000 * 0.40 == 40000, less the per-guest onboard uplift round_half_up(7 * 2 * 1000 / 2) == 7000"
            - "the bid does not move inventory - SailingInventory.${inv_l_ov}.available_cabins is still 30 and Booking.${bk_nell}.assigned_cabin_category_id is still ${cat_ia}"
            - "GET /upgrade-bids?booking_id=${bk_nell} returns total_count == 1; GET /upgrade-bids?target_cabin_category_id=${cat_spa} returns total_count == 0 - no refused call was stored"

      - name: ops_run_steps_with_empty_candidate_sets_are_silent_no_ops
        claim_type: bulk_action
        grounds:
          - endpoints[POST /sailings/{id}/ops-run]
          - state_machines.Booking.payment_status[AWAITING_DEPOSIT -> DELINQUENT]
          - calculations.sailing_ralbd
        distinguishing_aspect: |
          ops-run is the one batch verb and it has no partial-failure vocabulary: the nine steps run
          in a pinned order and each step whose candidate set is empty is skipped silently instead of
          erroring or aborting the sweep. The sharp version of the claim is a sailing where exactly
          ONE step has work - a booking whose deposit went overdue - and where re-running the sweep
          finds nothing left to do while still incrementing version.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing NOP-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z, deposit_due_days_after_booking 7) is OPEN_FOR_SALE with an IA allotment 10/0 and a 730..0 fare window at base 50000."
            - "One booking of two adults is created at the initial clock, so its deposit falls due at 2026-08-08T00:00:00Z and the delinquency grace expires at 2026-08-15T00:00:00Z."
            - "No promotion, no group block, no waitlisted booking, no upgrade bid and no itinerary change exists, and the clock is nowhere near embark_date - so eight of the nine steps have nothing to do."
            - "The clock is then advanced to 2026-08-09T00:00:00Z, one day past the deposit due date and well inside the grace window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "NOP-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_n: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_n: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_n}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_ada: $.data.id }
            - call: "GET /sailings/${sail_n}"
              payload: {}
              as: RevenueManager
              captures: { nv0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${sail_n}/ops-run"
              payload: {}
              as: RevenueManager
              captures: { nv1: $.data.version }
            - call: "POST /sailings/${sail_n}/ops-run"
              payload: {}
              as: RevenueManager
              captures: { nv2: $.data.version }
          assert:
            - "the first ops-run returns HTTP 200 with ${nv1} == ${nv0} + 1 - it is a write even though eight steps did nothing"
            - "the only state change is Booking.${bk_ada}.payment_status == DELINQUENT with booking_status still OPTION - step 5 fired, step 6 did not because the grace expires at 2026-08-15T00:00:00Z"
            - "the response carries no per-item status array, no partial-failure envelope and no error - empty candidate sets are silent"
            - "Sailing.${sail_n}.status is still OPEN_FOR_SALE: step 8 did not sail the voyage because current_utc is far before embark_date"
            - "Sailing.${sail_n}.lower_berths_sold == 2, occupancy_pct == 5.00, inventory_posture == OPEN"
            - "Sailing.${sail_n}.gross_ticket_revenue_cents == 100000, projected_onboard_revenue_cents == 72000, ralbd_gross_cents == 1075 and ralbd_net_cents == 1075 (172000 / 160)"
            - "Sailing.${sail_n}.confirmed_bookings_count == 0 and final_payment_risk_flag == false - the flag needs at least one confirmed booking"
            - "SailingInventory.${inv_n}.booked_cabins == 1, group_held_cabins == 0, waitlisted_bookings_count == 0, available_cabins == 9"
            - "the second ops-run returns HTTP 200 with ${nv2} == ${nv1} + 1 while Booking.${bk_ada} is untouched - a booking already DELINQUENT is no longer a candidate, so step 5 is now a no-op too"
            - "GET /bookings/${bk_ada}/payment-events returns total_count == 0 - marking delinquency posts no money"

  # ===========================================================================
  - section: errors
    instances:

      - name: uniqueness_collisions_return_their_dedicated_duplicate_errors
        claim_type: triggerable
        grounds:
          - errors[ERR_DUPLICATE_VOYAGE_CODE]
          - errors[ERR_DUPLICATE_CATEGORY_CODE]
          - errors[ERR_DUPLICATE_TIER_RANK]
          - errors[ERR_DUPLICATE_GUEST_EMAIL]
          - errors[ERR_DUPLICATE_PROMO_CODE]
          - errors[ERR_DUPLICATE_INVENTORY]
          - validations[priority=4]
          - validations[priority=19]
        distinguishing_aspect: |
          Six uniqueness constraints, six distinct codes, and two different HTTP statuses: the four
          shape-level keys and the per-sailing promotion code are 400s decided at priority 4, while
          the one-allotment-per-pair rule is a 422 business constraint at priority 19. The promotion
          case also settles a priority question - an identical code in an identical window is
          reported as the duplicate, never as the cadence conflict, because priority 4 runs first -
          and the promotion code is scoped per sailing, so the same code is legal on another voyage.
