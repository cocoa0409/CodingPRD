            - "${partner_status} == TERMINATED, ${partner_v_terminated} == 3 and ${partner_enrolled} == 1"
            - "${product_total} == 2, ${product_one_after} == WITHDRAWN and ${product_two_after} == WITHDRAWN  # §1.2 GAP: ServiceLineProduct has no state machine entry, so its version behaviour on this cascade is undeclared and is not asserted"
            - "${mailed_after} == MAILED and ${mailed_version_after} == 4  # MAILED is terminal and outside the {DRAFT, PARTNER_REVIEW, APPROVED} filter, so hop 1 skips it; version 4 = create, submission, decision, mail-drop per §1.2 (the §1.5 mail-drop side-effect list omits the increment)"
            - "${approved_after} == WITHDRAWN and ${approved_version_after} == 4  # was version 3 after the decision, +1 for the cascade"
            - "${review_after} == WITHDRAWN and ${review_version_after} == 3  # was version 2 after the submission"
