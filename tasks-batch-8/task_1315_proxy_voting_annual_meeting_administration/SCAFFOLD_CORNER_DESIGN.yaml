              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 400"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: account_list_pagination_limit_offset_total_count
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /proxy/shareholder-accounts]"]
        distinguishing_aspect: "Pagination fields interact: limit=2 over 3 accounts yields total_count 3 and has_more true; offset=2 yields the last item with has_more false."
        test_recipe:
          setup: ["DRAFT meeting with three accounts"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Page Co", ticker: "PGE", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "H1", account_number: "A-1001", share_class: "COMMON", shares_held: 100 }
              as: TransferAgent
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "H2", account_number: "A-1002", share_class: "COMMON", shares_held: 200 }
              as: TransferAgent
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "H3", account_number: "A-1003", share_class: "COMMON", shares_held: 300 }
              as: TransferAgent
          trigger:
            - call: "GET /proxy/shareholder-accounts?meeting_id=${m_id}&limit=2&offset=0"
              as: TransferAgent
            - call: "GET /proxy/shareholder-accounts?meeting_id=${m_id}&limit=2&offset=2"
              as: TransferAgent
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2: exactly 1 item, total_count == 3, has_more == false"

      - name: response_envelope_success_and_error_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp and response_type 'object'; error responses carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["one meeting exists"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Env Co", ticker: "ENV", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /proxy/meetings/${m_id}"
              as: ProxyAdministrator
            - call: "GET /proxy/meetings/00000000-0000-4000-8000-000000000000"
              as: ProxyAdministrator
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "success: meta.api_request_id non-empty string, meta.api_request_timestamp ISO8601, response_type == object, data.id == ${m_id}"
            - "error: response_type == error, data.error_id == ERR_MEETING_NOT_FOUND, data.message non-empty"

      - name: vote_list_filter_by_status
        claim_type: listing
        grounds: ["endpoints[GET /proxy/vote-instructions]"]
        excluded_because:
          difficulty_instance: revoke_then_identical_revote_restores_tabulation_totals
          rationale: "The named §1.8 instance asserts GET /proxy/vote-instructions?account_id&status=VALIDATED returns exactly 1 record after a revoke/re-vote round trip, exercising the filtered list."

      - name: computed_tabulation_read_matches_formula
        claim_type: computed_read
        grounds: ["endpoints[GET /proxy/proposals/{id}/tabulation]", calculations.weighted_tabulation]
        excluded_because:
          difficulty_instance: weighted_tabulation_per_instruction_rounding_order
          rationale: "The named §1.8 instance pins exact computed tabulation output (for_votes 1002) from formula inputs."

