            - "the current-version call succeeds and Preauthorization.${bax}.review_status == APPROVED"
            - "Preauthorization.${bax}.version > ${bax_v} after the successful decision"
            - "TreatmentPlan.${bp}.plan_status == IN_PROGRESS and TreatmentPlan.${bp}.version == ${bpv}"
            - "the stale rejection left Preauthorization.${bax}.review_status at CLINICAL_REVIEW with no denial recorded"

      - name: occ_stale_preauthorization_version_on_pay_returns_preauth_version_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-pay-stale-auth]
          - errors[ERR_PREAUTH_VERSION_STALE]
          - endpoints.POST_/claims/{id}/pay
        distinguishing_aspect: "A second OCC parent: paying a claim while carrying an expected_preauthorization_version observed before the authorization advanced is rejected with 412 ERR_PREAUTH_VERSION_STALE, and the successful pay then advances the authorization version so the same stale payload is refused deterministically on a strictly sequential retry."
        test_recipe:
