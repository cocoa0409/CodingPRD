        test_recipe:
          setup: ["Active policy whose tier_matrix maps the PUBLIC/NONE/LOW triple to TIER_4"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: { "PUBLIC|NONE|LOW": "TIER_4" } }
              as: PlatformAdmin
          trigger:
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id }
          assert:
            - "Vendor.${v_id}.current_tier == TIER_4 (matrix override), not TIER_1 (rank fallback)"

