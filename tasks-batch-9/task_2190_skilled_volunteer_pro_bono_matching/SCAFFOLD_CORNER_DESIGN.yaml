      - name: rbac_volunteer_cannot_register_partner_org
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /partner-orgs]", "roles.ProgramManager.exclusive_operations[POST /partner-orgs]", "errors[ERR_ROLE_NOT_PERMITTED]", "validations[priority=2]"]
        distinguishing_aspect: "Partner onboarding is ProgramManager-only; a Volunteer holding a perfectly valid enrolment id is still refused, and the 403 arrives even though the body is well formed, so no second PartnerOrg row may exist afterwards."
        test_recipe:
          setup: ["One partner and one enrolled volunteer, so the caller has a real X-User-ID."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "POST /partner-orgs", as: Volunteer, as_user_id: "${vol_id}", payload: {name: "Volunteer Side Project", contact_email: "side@vol.example", sector: HUMAN_SERVICES, annual_budget_usd: 100000.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /partner-orgs/${partner_id} still succeeds as ProgramManager and no org named \"Volunteer Side Project\" is reachable by any id"
      - name: rbac_partner_contact_cannot_open_program_cycle
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /program-cycles]", "roles.ProgramManager.exclusive_operations[POST /program-cycles]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Capacity creation is a program-office act: the PartnerContact who will consume slots cannot mint the cycle that holds them, so the 403 precedes any capacity_slot_total range checking."
        test_recipe:
          setup: ["One partner org only - deliberately no cycle exists yet."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "POST /program-cycles", as: PartnerContact, as_user_id: "${partner_id}", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "no cycle_code \"2026-Q4\" is subsequently resolvable, and a later POST /project-requests naming any cycle id fails with ERR_PROGRAM_CYCLE_NOT_FOUND"
      - name: rbac_scoping_specialist_cannot_run_cycle_recalculate
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /program-cycles/{id}/recalculate]", "roles.ProgramManager.exclusive_operations[POST /program-cycles/{id}/recalculate]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "The specialist reads cycle posture through GET /program-cycles/{id} but cannot drive the sweep that changes it: recalc_epoch must remain 0 and last_recalculated_at null after the refusal."
        test_recipe:
          setup: ["One partner and one freshly opened cycle with recalc_epoch 0."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /program-cycles/${cycle_id}/recalculate", as: ScopingSpecialist, as_user_id: "spec-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /program-cycles/${cycle_id} as ScopingSpecialist returns HTTP 200 with recalc_epoch == 0 and last_recalculated_at == null"
      - name: rbac_quality_reviewer_cannot_advance_the_logical_clock
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /_clock/set_current_utc]", "roles.ProgramManager.exclusive_operations[POST /_clock/set_current_utc]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "The test-driving clock is guarded like any other operation: a QualityReviewer's attempt to jump to 2026-09-01 is refused, and the proof that the clock never moved is that the ProgramManager can afterwards set 2026-08-01T12:00:00Z without ERR_CLOCK_REGRESSION."
        test_recipe:
          setup: ["One partner and one cycle; the logical clock is still at its 2026-08-01T00:00:00Z startup default."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /_clock/set_current_utc", as: QualityReviewer, as_user_id: "qr-1", payload: {to_iso8601: "2026-09-01T00:00:00Z"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "a following POST /_clock/set_current_utc as ProgramManager with to_iso8601 == \"2026-08-01T12:00:00Z\" returns HTTP 200, proving the clock was never advanced to 2026-09-01"
      - name: rbac_volunteer_cannot_suspend_partner_org
        claim_type: cross_role_denial
        grounds: ["endpoints[PATCH /partner-orgs/{id}/status]", "roles.ProgramManager.exclusive_operations[PATCH /partner-orgs/{id}/status]", "errors[ERR_ROLE_NOT_PERMITTED]", "state_machines.PartnerOrg"]
        distinguishing_aspect: "Suspension carries the full abandon/terminate cascade, so the role gate must hold absolutely: a Volunteer's PATCH is refused with 403 and the partner stays ACTIVE with probation_reason null and no cascade side effect."
        test_recipe:
          setup: ["One ACTIVE partner and one enrolled volunteer."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "PATCH /partner-orgs/${partner_id}/status", as: Volunteer, as_user_id: "${vol_id}", payload: {to_status: "SUSPENDED"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /partner-orgs/${partner_id} as ProgramManager shows status == \"ACTIVE\" and probation_reason == null"
      - name: rbac_partner_contact_cannot_enrol_volunteer
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /volunteers]", "roles.ProgramManager.exclusive_operations[POST /volunteers]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Volunteer supply is program-owned: a partner cannot enrol its own preferred expert to bias later matching, so the 403 lands before any reliability baseline is created."
        test_recipe:
          setup: ["One partner org."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "POST /volunteers", as: PartnerContact, as_user_id: "${partner_id}", payload: {full_name: "Preferred Expert", email: "pref@vol.example", professional_rate_usd_per_hour: 400.00, seniority: PRINCIPAL, weekly_hours_cap: 30}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "no Volunteer row with email \"pref@vol.example\" is reachable, so a later match on this partner's request fails with ERR_NO_ELIGIBLE_VOLUNTEER rather than offering that expert"
      - name: rbac_scoping_specialist_cannot_vet_volunteer_credentials
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /volunteers/{id}/vet]", "roles.ProgramManager.exclusive_operations[POST /volunteers/{id}/vet]", "errors[ERR_ROLE_NOT_PERMITTED]", "validations[priority=2]"]
        distinguishing_aspect: "The specialist most motivated to unblock a candidate cannot self-serve the credential stamp: the 403 leaves credential_verified_at null, status PENDING_VETTING and the TAX_LAW claim verified == false, which is exactly what keeps the matcher's VERIFIED_SKILL_BONUS off."
