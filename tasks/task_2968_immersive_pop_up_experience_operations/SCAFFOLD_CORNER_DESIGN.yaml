  # =========================================================================
  # SECTION 2 -- STATE MACHINES
  # Every §1.2 machine has an initial state, a precondition, an invalid-source
  # rejection and a side-effect obligation. The cascade rows walk the six
  # declared cascade shapes; the shape rows walk the cyclic permit loop and the
  # two parallel dimensions of ExperienceRun.
  # =========================================================================
  - section: state_machines
    instances:
      - name: every_entity_lands_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines[PopupVenue].initial_state
          - state_machines[LicenseAgreement].initial_state
          - state_machines[BuildKit].initial_state
          - state_machines[ExperienceRun].initial_state
          - state_machines[TimedEntrySlot].initial_state
          - state_machines[TicketOrder].initial_state
          - state_machines[StaffMember].initial_state
          - state_machines[StaffShift].initial_state
          - state_machines[SafetyInspection].initial_state
          - state_machines[RoyaltyStatement].initial_state
          - state_machines[CreativeSubmission].initial_state
          - state_machines[GuestAccount].initial_state
        distinguishing_aspect: |
          Eleven machines plus the run's second dimension, each with a different initial symbol,
          and three of them are counter-intuitive: a BuildKit is born READY and already LOCALIZED
          (so it can be deployed immediately), a StaffMember is born CANDIDATE rather than TRAINING
          (only a training record moves it), and a fresh ExperienceRun carries the PAIR
          (PLANNED, UNCLEARED) because run_status and clearance_status are independent dimensions.
          A single wrong initial symbol makes every downstream precondition test unreachable.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation, plus one themed room so the run has capacity, plus one guest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
