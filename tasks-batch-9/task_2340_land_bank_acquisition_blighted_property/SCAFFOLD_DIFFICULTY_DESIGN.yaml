  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: demolition_run_execute_depth_four_funding_cascade
        grounds:
          - state_machines.DemolitionRun.status.PLANNED_to_EXECUTED
          - state_machines.FundingSource.status.ACTIVE_to_CONSTRAINED
          - state_machines.AcquisitionPacket.status.DUE_DILIGENCE_to_ON_HOLD_FUNDING
          - calculations.funding_ledger_position
        distinguishing_aspect: |
          One request propagates four causal levels: executing the run creates a DEMOLITION order
          (link 1), the order plus the administrative fee commit 1534682 cents against the source
          (link 2), the commitment drops available_cents to 55318 which is below the 80000-cent
          reserve floor so the source flips ACTIVE -> CONSTRAINED (link 3), and that flip puts the
          unrelated DUE_DILIGENCE acquisition packet on the same source into ON_HOLD_FUNDING with
          hold_reason FUNDING_SOURCE_CONSTRAINED (link 4). Nothing in the request mentions the
          packet, so only the transitive chain can explain its new status.
        test_recipe:
          setup:
            - "One ACTIVE funding source with restriction ANY, authorized 1600000 cents, so reserve_floor_cents is 80000."
            - "Parcel P1: grade F, 3000 sqft, structure present, vacancy 12 months (score 47.0), acquired by donation with a 10000-cent title fee, quiet-titled CLEAR - a valid demolition candidate whose estimate is 1427611."
            - "Parcel P2: a second registry parcel whose acquisition packet is left in DUE_DILIGENCE on the same funding source (never board-approved, so it commits nothing)."
            - "A planned run with budget_cents 1590000, exactly equal to the source's available_cents."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Blight Fund", source_type: "GRANT", authorized_cents: 1600000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
