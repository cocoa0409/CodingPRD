  - rule_id: combinatorial_formula
    instances:

      - name: disclosure_score_capability_penalty_is_max_not_sum
        grounds:
          - calculations.channel_disclosure_score
          - entities.Channel.fields.supports_total_price_display
          - entities.Channel.fields.supports_itemization
          - entities.Jurisdiction.fields.first_quote_total_required
          - entities.ChannelDisclosureProfile.fields.disclosure_score
        distinguishing_aspect: |
          Mode (a): channel_disclosure_score takes six inputs (two booleans, a
          five-way placement lookup, a floor-capped coverage bonus, two
          jurisdiction mandates crossed with two channel capabilities, and a
          per-complaint decrement) and combines the two capability penalties with
          MAX rather than SUM, so a channel that can neither show totals nor
          itemise is penalised 30 and not 50 — the raw base of -20 then clamps to
          exactly 0 rather than to -40.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, jurisdiction US-NV-CLARK with first_quote_total_required true AND itemization_required_on_folio true"
            - "A VOICE channel with supports_total_price_display false and supports_itemization false"
            - "A PUBLISHED single-mandatory-fee program with full inclusion coverage, so the coverage bonus is exactly 10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
