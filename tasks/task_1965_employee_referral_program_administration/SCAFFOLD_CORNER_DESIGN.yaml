        claim_type: correct_result
        grounds: [calculations.fraud_risk_score]
        distinguishing_aspect: "Decay function: a RESUME_FARM confirmation is worth 50 at t0 and halves to 25 after exactly 180 days (floor(180/86400)/180 == 1 full halflife); the suspension flag flips off only when the decayed score drops below 100."
        test_recipe:
          setup: ["Employee with one RESUME_FARM case confirmed at the default clock; risk 50"]
          setup_api_calls:
            - call: "POST /erp/employees"
              payload: { employee_number: "E102", full_name: "Shady S", email: "shady@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_s: $.data.id }
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_s}", case_type: "RESUME_FARM" }
              as: TalentAdmin
              as_user_id: "ta-1"
              captures: { case_id: $.data.id }
            - call: "POST /erp/abuse-cases/${case_id}/confirm"
              as: ComplianceOfficer
              as_user_id: "co-9"
            - call: "GET /erp/employees/${emp_s}"
              as: TalentAdmin
              captures: { risk_t0: $.data.risk_score }
          trigger:
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /erp/employees/${emp_s}"
              as: TalentAdmin
              captures: { risk_t1: $.data.risk_score, susp: $.data.referral_suspended }
          assert:
            - "risk_score == 50 at confirmation (2026-08-01)"
            - "risk_score == 25 at 2027-01-28T00:00:00Z (exactly one 180-day halflife)"
            - "referral_suspended == false at both readings (never reached 100)"

