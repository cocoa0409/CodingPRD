            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-MUG", name: "Ceramic Mug", category: HOUSEWARE, is_regulated_food: false, unit_retail_price_cents: 1800, units_per_case: 6 }, captures: { pr2: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr2}", production_line_id: "${ln1}", batch_code: "MUG-88", code_date: "2026-07-10T00:00:00Z", units_produced: 100000 }, captures: { lot2: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-08-01T00:00:00Z", raw_message: "Sharp edge." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: PACKAGING, reported_batch_code: "MUG88", foreign_object_class: HARD_SHARP, medical_attention_sought: true, symptom_codes: [CUT, PAIN, SWELLING, BLEEDING] }, captures: { cp1: "$.data.id" } }
          trigger:
