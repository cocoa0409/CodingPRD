            - "Logical clock at 2026-02-10T00:00:00Z."
            - "Pilot A: RECREATIONAL, CERTIFIED via a PASSED TRUST test. Pilot B: COMMERCIAL, still UNCERTIFIED, with no rows of any other kind."
            - "Airframe A1 under pilot A: 300 g (so remote_id_required is true), module VERIFIED until 2027-02-10, then REGISTERED."
            - "Zone Z: class D, requires_authorization true, with one REQUESTED authorization from pilot A."
            - "Waiver W (NIGHT, DRAFT) with one PENDING SafetyCase, and one ACTIVE InsurancePolicy for pilot A."
