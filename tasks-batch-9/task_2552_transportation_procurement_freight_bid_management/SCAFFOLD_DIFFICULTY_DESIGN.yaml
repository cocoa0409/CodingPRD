      - name: scorecard_publication_three_link_watchlist_cascade
        depth: 3
        grounds:
          - state_machines.Scorecard.DRAFT_to_PUBLISHED
          - calculations.carrier_composite_score
          - entities.Carrier.fields.published_scorecard_count
          - entities.Carrier.fields.composite_score_variant
          - state_machines.Carrier.QUALIFIED_to_WATCHLIST
        distinguishing_aspect: |
          A third distinct trigger — publishing a mid-term scorecard — driving a chain that
          crosses from Scorecard into Carrier's counter, then into its computed composite, then
          into its lifecycle state. Unlike the award and tender cascades, the middle link here
          is a recalculation rather than a state change, and the last link fires only because
          the recomputed number fell below WATCHLIST_FLOOR.
        chain:
          - "link 1: Carrier.published_scorecard_count += 1"
          - "link 2 (because the published count changed): carrier_composite_score re-evaluated and composite_score_variant switches PROVISIONAL_SCREENING -> FINAL_PERFORMANCE"
          - "link 3 (because the composite changed): Carrier.status QUALIFIED -> WATCHLIST because 64.70 < WATCHLIST_FLOOR 75.00"
        test_recipe:
          setup:
            - "Carrier ALFL qualified: capability_score 88.00, insurance headroom beyond 90 days so the insurance component scores 100.00, composite 90.60 under PROVISIONAL_SCREENING, status QUALIFIED, published_scorecard_count 0."
            - "One DRAFT scorecard for the period ending 2026-07-01 with on_time_pct 40.00 and claims_ratio 0.100 and no tender events in the period (tender_acceptance_pct defaults to 100.00), giving a period composite of 53.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN", "REEFER"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", on_time_pct: 40.00, claims_ratio: 0.100 }
              as: CategoryManager
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/scorecards/${sc_id}/publish"
              payload: {}
              as: CategoryManager
          assert:
            - "before the trigger — Carrier.${carrier_a_id}.published_scorecard_count == 0, composite_score == 90.60, composite_score_variant == PROVISIONAL_SCREENING, status == QUALIFIED"
            - "Scorecard.${sc_id}.status == PUBLISHED, published_at == 2026-08-01T00:00:00Z, tender_acceptance_pct == 100.00, period_tender_count == 0, composite_score == 53.00"
            - "link 1 — Carrier.${carrier_a_id}.published_scorecard_count == 1"
            - "link 2 — Carrier.${carrier_a_id}.composite_score_variant == FINAL_PERFORMANCE and composite_score == 64.70"
            - "link 3 — Carrier.${carrier_a_id}.status == WATCHLIST"
            - "Carrier.${carrier_a_id}.capability_score is still 88.00 — only the performance component moved"
            - "a DRAFT scorecard alone changes nothing: the composite is still 90.60 before publication, so link 2 is caused by link 1 and not by scorecard creation"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_round_state_beats_rate_below_floor
        pair: "priority 9 state (ERR_ROUND_NOT_OPEN, 409) vs priority 17 business_fiscal (ERR_RATE_BELOW_FLOOR, 422)"
        grounds:
          - validations.priority_9_state
          - validations.priority_17_business_fiscal
          - errors.ERR_ROUND_NOT_OPEN
          - errors.ERR_RATE_BELOW_FLOOR
        distinguishing_aspect: |
          Category pair: state vs business_fiscal. One request violates both — the round is
          CLOSED and the rate is under the event floor — and the ladder must answer with the
