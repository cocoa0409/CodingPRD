            - "Patient MRN-L1 is ADMITTED on 7W."
            - "A WOUND ConsultRequest for MRN-L1 is in status TRIAGED with assigned_nurse_id null."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
