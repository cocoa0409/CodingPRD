    output: PartOrder
    side_effects:
      - "member_sequence = CommercialAccount.order_sequence + 1; the account's order_sequence increments"
      - "pricing_band resolved from member_sequence"
      - "fulfillment_route, promised_at and delivery_fee_cents provisionally set"
      - "satisfaction_cents initialized from order_satisfaction"
      - "status = DRAFT"

