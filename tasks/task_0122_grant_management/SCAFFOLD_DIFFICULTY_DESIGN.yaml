              captures: { rf10_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${award10_id}", amount_cents: 5000000, allocation_plan: [ { restricted_fund_id: "${rf10_id}", amount_cents: 5000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_X"
