            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-A", scope: "PROGRAM", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
