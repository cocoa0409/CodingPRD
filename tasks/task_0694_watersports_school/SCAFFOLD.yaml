    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "School display name" }
      - { name: timezone, type: string, source: input, description: "IANA tz label (informational)", default: "UTC" }
      - { name: storm_advisory_active, type: boolean, source: system, description: "True while a storm advisory is in effect", default: false }
      - { name: operating_status, type: enum, source: computed, description: "OPEN | STORM_CLOSED — STORM_CLOSED iff storm_advisory_active==true; gates session scheduling, session start, and check-in", constraints: "OPEN at creation" }
      - { name: open_session_count, type: integer, source: computed, description: "Count of this school's Sessions in {SCHEDULED, WEATHER_HOLD, IN_PROGRESS}", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

