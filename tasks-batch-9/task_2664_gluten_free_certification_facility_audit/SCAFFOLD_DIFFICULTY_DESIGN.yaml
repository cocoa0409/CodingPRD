            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_1: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_1}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2029-07-01T00:00:00Z" }
              as: ApplicantContact
