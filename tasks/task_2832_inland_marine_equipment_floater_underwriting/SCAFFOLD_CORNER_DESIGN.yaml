            - "the loss clears the 20000000 per-item limit with room to spare, so an implementation that tests settlement_amount_cents against claim_limit_cents alone pays the claim"

      - name: corner_hired_vehicle_approval_requires_carrier_and_future_expiry
        claim_type: Violation → Error
        grounds:
          - validations[priority=53]
          - validations[priority=41]
          - errors[ERR_CARRIER_APPROVAL_MISSING]
          - errors[ERR_VEHICLE_NOT_APPROVED]
          - endpoints[POST /inland-marine/vehicles/{id}/approve]
          - endpoints[POST /inland-marine/transit-shipments/{id}/depart]
        distinguishing_aspect: |
          Approving a HIRED conveyance needs BOTH a carrier_name and an
          approval_expires_on strictly after the clock date: the unnamed carrier and the
          carrier whose approval expires ON 2026-08-01 are both refused with
          ERR_CARRIER_APPROVAL_MISSING, and a shipment loaded on the still
          PENDING_APPROVAL unit cannot depart.
        test_recipe:
          setup:
            - "One IN_FORCE Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE TRANSIT CoveragePart: valuation_basis ACV, aggregate_limit_cents 200000000, transit_owned_limit_cents 4000000, transit_hired_limit_cents 3000000, catastrophe_limit_cents 2000000."
            - "One PENDING_APPROVAL HIRED Vehicle with no carrier_name, per_conveyance_limit_cents 10000000."
            - "One PENDING_APPROVAL HIRED Vehicle with carrier_name Blue Line Trucking, per_conveyance_limit_cents 10000000."
            - "One PLANNED TransitShipment of 1000000 on the unnamed-carrier vehicle."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Hired Haul Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 4000000, transit_hired_limit_cents: 3000000, catastrophe_limit_cents: 2000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "HIRE-NONAME", ownership: "HIRED", per_conveyance_limit_cents: 10000000 }
              as: Underwriter
              captures: { veh_noname: $.data.id }
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "HIRE-BLUELINE", ownership: "HIRED", carrier_name: "Blue Line Trucking", per_conveyance_limit_cents: 10000000 }
              as: Underwriter
              captures: { veh_named: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh_noname}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T00:00:00Z", arrival_at: "2026-08-05T06:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
              captures: { shp: $.data.id }
          trigger:
            - call: "POST /inland-marine/vehicles/${veh_noname}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles/${veh_named}/approve"
              payload: { approval_expires_on: "2026-08-01" }
              as: Underwriter
            - call: "POST /inland-marine/transit-shipments/${shp}/depart"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles/${veh_named}/approve"
              payload: { approval_expires_on: "2026-12-31" }
              as: Underwriter
          assert:
            - "after setup: Vehicle.${veh_noname}.status == PENDING_APPROVAL, approved_at is null and Vehicle.${veh_named}.status == PENDING_APPROVAL"
            - "after setup: TransitShipment.${shp}.status == PLANNED and applicable_limit_cents == 3000000 (the hired limit, no catastrophe zone)"
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_CARRIER_APPROVAL_MISSING"
            - "trigger[1] HTTP status == 422"
            - "trigger[1] response error_id == ERR_CARRIER_APPROVAL_MISSING"
            - "after trigger[1]: Vehicle.${veh_named}.status == PENDING_APPROVAL and approval_expires_on is null"
            - "trigger[2] HTTP status == 409"
            - "trigger[2] response error_id == ERR_VEHICLE_NOT_APPROVED"
            - "after trigger[2]: TransitShipment.${shp}.status == PLANNED, departed_at is null and Vehicle.${veh_noname}.in_transit_value_cents == 0"
            - "trigger[3] HTTP status == 200"
            - "after trigger[3]: Vehicle.${veh_named}.status == APPROVED, approval_expires_on == 2026-12-31 and approved_at == 2026-08-01T00:00:00Z"
            - "2026-08-01 equals the clock date and is refused while 2026-12-31 is accepted, so the expiry test is strict rather than inclusive"

      - name: corner_pagination_bounds_rejected_on_list_endpoints
        claim_type: Violation → Error
        grounds:
          - validations[priority=36]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[GET /inland-marine/equipment-items]
          - endpoints[GET /inland-marine/claims]
        distinguishing_aspect: |
          limit is an inclusive [1, 100] window and offset must be non-negative, so
          limit 0, limit 101 and offset -1 are each rejected with ERR_INVALID_PAGINATION
          at HTTP 400 (not 422), while limit 100 - the largest legal page - returns the
          full two-row result on the same query.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart with exactly two RATED EquipmentItems."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Page Bounds Contracting", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Item 1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Item 2", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { it2: $.data.id }
          trigger:
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 0 }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 101 }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 10, offset: -1 }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 100, offset: 0 }
              as: Underwriter
            - call: "GET /inland-marine/claims"
              payload: { policy_id: "${pol}", limit: 101 }
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 400"
            - "trigger[0] response error_id == ERR_INVALID_PAGINATION"
            - "trigger[1] HTTP status == 400"
            - "trigger[1] response error_id == ERR_INVALID_PAGINATION"
            - "trigger[2] HTTP status == 400"
            - "trigger[2] response error_id == ERR_INVALID_PAGINATION"
            - "trigger[3] HTTP status == 200"
            - "trigger[3] response: 2 rows, total_count == 2, has_more == false, covering ${it1} and ${it2} in created_at ASC order"
            - "trigger[4] HTTP status == 400"
            - "trigger[4] response error_id == ERR_INVALID_PAGINATION (the same bound applies to every list endpoint, including one whose result set is empty)"
            - "limit 100 is accepted and limit 101 is not, so the upper bound is inclusive at exactly 100"

      - name: corner_jobsite_security_gate_versus_floater_aggregate
        claim_type: Priority Ordering
        grounds:
