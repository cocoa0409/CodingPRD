  - method: GET
    path: "/accreditation/written-plans"
    description: "list written plans; camp_id and supersedes_plan_id are the reverse-reachability channels from Camp and from WrittenPlan itself"
    roles: [CampDirector, HealthCareStaff, AccreditationOfficer]
