  - method: GET
    path: "/tissue-bank/freezers"
    description: "List freezers; filters status?, current_excursion_id? (finds the freezer holding a given excursion); sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: ["status?", "current_excursion_id?"]
    output: "Freezer[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/freezers/{id}"
    description: "Get a freezer incl. computed occupied_count / utilization_pct / quarantine_reserve_slots / effective_capacity"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
