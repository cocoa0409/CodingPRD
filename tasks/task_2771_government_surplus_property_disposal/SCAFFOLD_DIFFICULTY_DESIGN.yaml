      - name: nlsm_screening_request_info_requested_resubmit_loop
        grounds:
          - state_machines.ScreeningRequest.SUBMITTED_to_INFO_REQUESTED
          - state_machines.ScreeningRequest.INFO_REQUESTED_to_SUBMITTED
          - entities.ScreeningRequest.fields.resubmission_count
          - entities.ScreeningRequest.fields.tier_at_submission
          - calculations.screening_tier_deadline
          - validations[priority=70]
          - validations[priority=72]
