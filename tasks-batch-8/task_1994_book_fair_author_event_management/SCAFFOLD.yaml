# =============================================================================
# SCAFFOLD.yaml — task_1994_book_fair_author_event_management
# Book Fair & Author Event Management (Scholastic-style book fair)
# §1.0–§1.7 seed tables. Difficulty: beyond-Expert (dense coupling, 13 state
# machines, 3 OCC rules, cyclic negotiation, dual-variant financials).
# =============================================================================

scenario: |
  1994. Book Fair & Author Event Management (Scholastic style book fair): venue & date
  scheduling with school/store calendar, inventory selection & consignment terms with
  publisher, author booking, travel & honorarium, signing line management & ticketed vs
  free events, pre-order/backlist stock planning, sales reconciliation & unsold return,
  promotion & local media outreach, school profit-share or scrip payout

domain_name: book-fair-author-events
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 13
  calculation_count: 8
  validation_count: 20
  endpoint_count: 90
  error_code_count: 28
  role_count: 6
  difficulty_note: |
    Deliberately beyond the Expert band on every axis: consignment terms feed both
    publisher remittance and school payout; pre-order/backlist allocation feeds sales
    reconciliation and unsold returns; ticketed-vs-free signing sessions feed
    honorarium settlement; three OCC-guarded supersede writes; two interval-overlap
    regimes with different geometry; two compensating invariants over different
    conserved quantities.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology, FK references)
# =============================================================================
entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "SCHOOL | PUBLISHER | AUTHOR", constraints: "immutable after create" }
      - { name: name, type: string, source: input, description: "Display name of the school, publisher, or author" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: Fair
    parent: null
    common_fields: true
    fields:
      - { name: school_party_id, type: string, source: input, description: "FK -> Party.id; must reference a Party with kind=SCHOOL; scopes SchoolCoordinator ownership" }
      - { name: title, type: string, source: input, description: "Fair title" }
      - { name: venue_key, type: string, source: input, description: "Venue calendar identifier shared by VenueSlots; conflicts computed per venue_key" }
      - { name: planned_start_date, type: string, source: input, description: "Planned first fair day, ISO date" }
      - { name: planned_end_date, type: string, source: input, description: "Planned last fair day, ISO date; must be >= planned_start_date" }
      - { name: signing_floor_capacity_units, type: integer, source: input, description: "Aggregate signing-floor capacity consumed by overlapping SigningSessions", constraints: "> 0" }
      - { name: promo_budget_cents, type: integer, source: input, description: "Total approved-spend ceiling for MediaBlasts", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | STOCKING | OPEN | RECONCILING | SETTLED | CANCELLED", default: DRAFT }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of total_cents over TENDERED sales plus fulfillment_price_cents over FULFILLED preorders; recomputed on tender/void/fulfill", default: 0 }
      - { name: firm_purchases_cents, type: integer, source: computed, description: "Sum over BACKLIST StockLines of qty_delivered * list_price_cents * (1 - agreement discount), per-line round_half_up; accrued at deliver", default: 0 }
      - { name: publisher_remittance_cents, type: integer, source: computed, description: "Consignment remittance locked at reconciliation approve", default: 0 }
      - { name: return_credits_cents, type: integer, source: computed, description: "Sum of credit_cents over CREDITED ReturnAuthorizations", default: 0 }
      - { name: honorarium_total_cents, type: integer, source: computed, description: "Sum of settled_total_cents over SETTLED bookings plus kill_fee_cents over CANCELLED bookings", default: 0 }
      - { name: preorder_allocation_run, type: boolean, source: system, description: "True once preorder allocation ran at STOCKING -> OPEN", default: false }

  - name: VenueSlot
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: venue_key, type: string, source: input, description: "Venue calendar identifier; must equal the linked Fair.venue_key" }
      - { name: purpose, type: enum, source: input, description: "SETUP | FAIR_DAY | AUTHOR_EVENT | TEARDOWN" }
      - { name: start_at, type: datetime, source: input, description: "Block start, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Block end, ISO 8601 UTC; must be > start_at" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Occupancy buffer before start_at", constraints: ">= 0" }
      - { name: teardown_buffer_minutes, type: integer, source: input, description: "Occupancy buffer after end_at", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED", default: HELD }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: publisher_party_id, type: string, source: input, description: "FK -> Party.id; kind=PUBLISHER; scopes PublisherRep ownership" }
      - { name: discount_pct, type: number, source: input, description: "Current offer: organizer discount off list price as decimal fraction (0..1)" }
      - { name: return_cap_pct, type: number, source: input, description: "Current offer: max fraction of delivered FRONTLIST copies returnable at full credit (0..1)" }
      - { name: restocking_fee_pct, type: number, source: input, description: "Current offer: fee fraction deducted from credit on over-cap returns (0..1)" }
      - { name: markdown_allowance_pct, type: number, source: input, description: "Current offer: max sell-price markdown below list (0..1)" }
      - { name: freight_responsibility, type: enum, source: input, description: "Current offer: PUBLISHER | ORGANIZER" }
      - { name: offer_expiry_hours, type: integer, source: input, description: "Current offer: hours from offer time until expiry", constraints: "> 0" }
      - { name: offered_by, type: enum, source: system, description: "ORGANIZER | PUBLISHER — side holding the live offer" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Logical-clock timestamp at which the live offer lapses" }
      - { name: negotiation_round, type: integer, source: system, description: "Offer round counter; starts at 1, +1 per counter", default: 1 }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | DECLINED | EXPIRED", default: PROPOSED }

  - name: StockLine
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ConsignmentAgreement.id; agreement must belong to same fair" }
      - { name: isbn, type: string, source: input, description: "ISBN-13 of the title" }
      - { name: title, type: string, source: input, description: "Book title" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per copy", constraints: "> 0" }
      - { name: line_type, type: enum, source: input, description: "FRONTLIST (consignment) | BACKLIST (firm purchase)", constraints: "immutable after create" }
      - { name: qty_committed, type: integer, source: input, description: "Copies ordered from the publisher", constraints: "> 0" }
      - { name: qty_delivered, type: integer, source: system, description: "Copies received; set at deliver", default: 0 }
      - { name: qty_held_preorder, type: integer, source: computed, description: "Copies held for ALLOCATED preorders", default: 0 }
      - { name: qty_sold, type: integer, source: computed, description: "Copies sold (tendered sales + fulfilled preorders)", default: 0 }
      - { name: qty_damaged, type: integer, source: computed, description: "Copies written off as damaged", default: 0 }
      - { name: qty_returned_shipped, type: integer, source: computed, description: "Copies shipped back under SHIPPED/CREDITED return authorizations", default: 0 }
      - { name: qty_returned_credited, type: integer, source: computed, description: "Copies whose return credit the publisher confirmed", default: 0 }
      - { name: qty_on_hand_counted, type: integer, source: system, description: "Physical count entered at reconciliation; null until counted", default: null }
      - { name: qty_available_for_sale, type: integer, source: computed, description: "qty_delivered - qty_held_preorder - qty_sold - qty_damaged - qty_returned_shipped", default: 0 }
      - { name: status, type: enum, source: system, description: "QUOTED | COMMITTED | DELIVERED | RECONCILED", default: QUOTED }

  - name: AuthorBooking
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: author_party_id, type: string, source: input, description: "FK -> Party.id; kind=AUTHOR; scopes AuthorRep ownership" }
      - { name: base_honorarium_cents, type: integer, source: input, description: "Current offer: base appearance fee", constraints: ">= 0" }
      - { name: travel_cap_cents, type: integer, source: input, description: "Current offer: max reimbursable travel", constraints: ">= 0" }
      - { name: bonus_threshold_attendees, type: integer, source: input, description: "Current offer: per-session attendance at which bonus triggers (>=)", constraints: ">= 1" }
      - { name: bonus_base_cents, type: integer, source: input, description: "Current offer: bonus paid at threshold", constraints: ">= 0" }
      - { name: bonus_per_attendee_cents, type: integer, source: input, description: "Current offer: extra per attendee beyond threshold", constraints: ">= 0" }
      - { name: offer_expiry_hours, type: integer, source: input, description: "Current offer: hours until offer lapses", constraints: "> 0" }
      - { name: offered_by, type: enum, source: system, description: "ORGANIZER | AUTHOR — side holding the live offer" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Logical-clock lapse time of the live offer" }
      - { name: negotiation_round, type: integer, source: system, description: "Offer round counter; starts at 1, +1 per counter", default: 1 }
      - { name: travel_actual_cents, type: integer, source: system, description: "Actual travel spend recorded at book-travel; null until booked", default: null }
      - { name: accrued_bonus_cents, type: integer, source: computed, description: "Sum of bonus_cents over RECONCILED TICKETED sessions of this booking", default: 0 }
      - { name: kill_fee_cents, type: integer, source: computed, description: "Cancellation fee accrued per kill-fee schedule; 0 unless cancelled after CONFIRMED", default: 0 }
      - { name: settled_total_cents, type: integer, source: computed, description: "Final honorarium settlement computed at settle; null until SETTLED", default: null }
      - { name: status, type: enum, source: system, description: "INVITED | NEGOTIATING | CONFIRMED | TRAVEL_BOOKED | SETTLED | CANCELLED | DECLINED", default: INVITED }

  - name: SigningSession
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> AuthorBooking.id; booking must belong to fair_id" }
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: mode, type: enum, source: input, description: "TICKETED | FREE; drives ticket kind and bonus eligibility", constraints: "immutable after create" }
      - { name: start_at, type: datetime, source: input, description: "Signing window start, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Signing window end; must be > start_at" }
      - { name: line_space_units, type: integer, source: input, description: "Floor-space footprint counted against Fair.signing_floor_capacity_units under closed-interval overlap", constraints: "> 0" }
      - { name: capacity_seats, type: integer, source: input, description: "Max live entitlements (tickets or wristbands)", constraints: "> 0" }
      - { name: admit_concurrent_cap, type: integer, source: input, description: "Fire-marshal cap on tickets holding ADMITTED state at any one moment", constraints: "> 0, <= capacity_seats" }
      - { name: attendance_count, type: integer, source: computed, description: "count(ADMITTED) + count(REDEEMED) frozen at close-signing; null until closed", default: null }
      - { name: bonus_cents, type: integer, source: computed, description: "Signing bonus computed at reconcile; 0 for FREE sessions; null until reconciled", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN_FOR_SIGNING | CLOSED_FOR_SIGNING | RECONCILED | CANCELLED", default: SCHEDULED }

  - name: SigningTicket
    parent: null
    common_fields: false
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> SigningSession.id" }
      - { name: kind, type: enum, source: system, description: "TICKET | WRISTBAND — derived from session mode at issue" }
      - { name: holder_name, type: string, source: input, description: "Attendee name" }
      - { name: status, type: enum, source: system, description: "ISSUED | ADMITTED | REDEEMED | NO_SHOW | VOIDED", default: ISSUED }

  - name: Preorder
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: stock_line_id, type: string, source: input, description: "FK -> StockLine.id; line must belong to fair_id" }
      - { name: customer_name, type: string, source: input, description: "Customer placing the preorder" }
      - { name: qty, type: integer, source: input, description: "Copies preordered", constraints: "> 0" }
      - { name: fulfillment_price_cents, type: integer, source: computed, description: "qty * list_price_cents snapshot, set at FULFILLED; null until fulfilled", default: null }
      - { name: status, type: enum, source: system, description: "PLACED | ALLOCATED | FULFILLED | CONVERTED_BACKLIST | CANCELLED", default: PLACED }

  - name: SaleTransaction
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: lines, type: array, source: input, description: "Array of {stock_line_id, qty, unit_price_cents?}; unit defaults to list price; immutable after create" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over lines of qty * unit_price_cents (integer math, no rounding needed)", default: 0 }
      - { name: tendered_amount_cents, type: integer, source: system, description: "Amount tendered, recorded at tender; null until TENDERED", default: null }
      - { name: change_cents, type: integer, source: computed, description: "tendered_amount_cents - total_cents at tender; null until TENDERED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | TENDERED | VOIDED", default: DRAFT }

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: system, description: "FK -> Fair.id; set by the close-sales transition that spawns this reconciliation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Organizer who ran close-sales; segregation-of-duties anchor" }
      - { name: provisional_lines, type: array, source: computed, description: "Per DELIVERED StockLine: {stock_line_id, expected_on_hand = qty_delivered - qty_sold - qty_damaged - qty_returned_shipped - qty_held_preorder}; initialized at creation from current counters and recomputed from CURRENT counters on every counts call and at submit-review, so damage recorded during RECONCILING is the sanctioned shrink-absorption path" }
      - { name: counted_lines, type: array, source: system, description: "Latest physical counts [{stock_line_id, qty_on_hand}]; each counts call supersedes the previous set" }
      - { name: variance_lines, type: array, source: computed, description: "Per line: qty_on_hand_counted - expected_on_hand; recomputed on every counts call" }
      - { name: total_abs_variance, type: integer, source: computed, description: "Sum of |variance| over variance_lines", default: 0 }
      - { name: remittance_cents, type: integer, source: computed, description: "Publisher remittance locked at approve; null until APPROVED", default: null }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on dispute; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | VARIANCE_REVIEW | APPROVED | SUBMITTED | DISPUTED | ACCEPTED", default: OPEN }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ConsignmentAgreement.id; must be the ACCEPTED agreement of the fair for the lines' publisher" }
      - { name: lines, type: array, source: input, description: "Array of {stock_line_id, qty}; FRONTLIST lines only; immutable after create" }
      - { name: credit_cents, type: integer, source: computed, description: "Publisher credit computed at confirm-credit; null until CREDITED", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | SHIPPED | CREDITED", default: REQUESTED }

  - name: ProfitSharePayout
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id; at most one non-terminal payout per fair" }
      - { name: school_party_id, type: string, source: system, description: "FK -> Party.id; copied from Fair.school_party_id at create; scopes SchoolCoordinator approval" }
      - { name: net_revenue_cents, type: integer, source: computed, description: "gross - firm purchases - remittance + return credits - honoraria - promo spend; computed at calculate; null until CALCULATED", default: null }
      - { name: share_cents, type: integer, source: computed, description: "Tiered school share of net_revenue_cents; null until CALCULATED", default: null }
      - { name: cash_amount_cents, type: integer, source: computed, description: "CASH variant payout; null until CALCULATED", default: null }
      - { name: scrip_amount_cents, type: integer, source: computed, description: "SCRIP variant payout (share * 1.15, round_half_up); null until CALCULATED", default: null }
      - { name: mode, type: enum, source: system, description: "CASH | SCRIP — chosen by the school at approve; null until APPROVED", default: null }
      - { name: final_amount_cents, type: integer, source: computed, description: "Amount locked at approve per chosen mode; null until APPROVED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | APPROVED | PAID", default: DRAFT }

  - name: MediaBlast
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: channel, type: enum, source: input, description: "LOCAL_PAPER | RADIO | SOCIAL | SCHOOL_NEWSLETTER" }
      - { name: spend_cents, type: integer, source: input, description: "Committed spend counted against Fair.promo_budget_cents at approve", constraints: ">= 0" }
      - { name: embargo_until, type: datetime, source: input, description: "Earliest logical-clock instant at which publish is allowed" }
      - { name: content_summary, type: string, source: input, description: "Summary of the promotional content" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | PUBLISHED", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Fair
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /fairs/{id}/schedule"
        actor: Organizer
        preconditions:
          - "At least one VenueSlot of this fair is CONFIRMED"
        side_effects: []
      - from: SCHEDULED
        to: STOCKING
        trigger: "POST /fairs/{id}/open-stocking"
        actor: Organizer
        preconditions:
          - "At least one ConsignmentAgreement of this fair is ACCEPTED"
        side_effects: []
      - from: STOCKING
        to: OPEN
        trigger: "POST /fairs/{id}/open"
        actor: Organizer
        preconditions:
          - "No StockLine of this fair is in COMMITTED (every committed line must be DELIVERED)"
        side_effects:
          - "Runs preorder_allocation: PLACED preorders processed in created_at ASC, qty ASC, customer_name ASC order; each becomes ALLOCATED (hold placed: StockLine.qty_held_preorder += qty) if qty <= qty_available_for_sale at its turn, else CONVERTED_BACKLIST"
          - "Fair.preorder_allocation_run = true"
      - from: OPEN
        to: RECONCILING
        trigger: "POST /fairs/{id}/close-sales"
        actor: Organizer
        preconditions:
          - "No SigningSession of this fair is in SCHEDULED or OPEN_FOR_SIGNING"
        side_effects:
          - "Every Preorder still ALLOCATED -> CANCELLED (hold released: StockLine.qty_held_preorder -= qty)"
          - "Spawns a Reconciliation for this fair (status OPEN, created_by_user_id = acting Organizer)"
      - from: RECONCILING
        to: SETTLED
        trigger: "POST /fairs/{id}/settle"
        actor: Organizer
        preconditions:
          - "The fair's latest Reconciliation is ACCEPTED"
          - "Every ReturnAuthorization of this fair is in CREDITED or REJECTED"
          - "Every AuthorBooking of this fair is in SETTLED, CANCELLED, or DECLINED"
          - "The fair's ProfitSharePayout exists and is PAID"
        side_effects: []
      - from: [DRAFT, SCHEDULED, STOCKING, OPEN]
        to: CANCELLED
        trigger: "POST /fairs/{id}/cancel"
        actor: Organizer
        preconditions:
          - "No SaleTransaction of this fair is in TENDERED"
        side_effects:
          - "Cascade link 1a: every VenueSlot of this fair in HELD or CONFIRMED -> RELEASED"
          - "Cascade link 1b: every AuthorBooking of this fair not in a terminal state -> CANCELLED (kill fee accrues per booking kill-fee schedule)"
          - "Cascade link 2: each booking cancelled by link 1b cancels its own non-terminal SigningSessions (SCHEDULED/OPEN_FOR_SIGNING/CLOSED_FOR_SIGNING -> CANCELLED) — caused by the booking transition, not by the fair directly"
          - "Cascade link 3: each session cancelled by link 2 voids its own non-terminal SigningTickets (ISSUED/ADMITTED -> VOIDED) — caused by the session transition, not by the fair directly"
          - "Every Preorder in PLACED or ALLOCATED -> CANCELLED (ALLOCATED holds released)"

  - entity: VenueSlot
    field: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /venue-slots/{id}/confirm"
        actor: SchoolCoordinator
        preconditions:
          - "Acting school party == slot's fair.school_party_id"
          - "Slot's fair is in DRAFT or SCHEDULED"
        side_effects: []
      - from: [HELD, CONFIRMED]
        to: RELEASED
        trigger: "POST /venue-slots/{id}/release"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Slot stops constraining the venue calendar"

  - entity: ConsignmentAgreement
    field: status
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /consignment-agreements/{id}/counter by PublisherRep"
        actor: PublisherRep
        preconditions:
          - "offered_by == ORGANIZER (the publisher holds no live offer)"
          - "Logical clock < offer_expires_at"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (6)"
          - "expected_agreement_version == current version (OCC)"
        side_effects:
          - "Terms replaced by payload; offered_by -> PUBLISHER; negotiation_round += 1; offer_expires_at = clock + offer_expiry_hours; version += 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /consignment-agreements/{id}/counter by Organizer"
        actor: Organizer
        preconditions:
          - "offered_by == PUBLISHER"
          - "Logical clock < offer_expires_at"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (6)"
          - "expected_agreement_version == current version (OCC)"
        side_effects:
          - "Terms replaced by payload; offered_by -> ORGANIZER; negotiation_round += 1; offer_expires_at = clock + offer_expiry_hours; version += 1"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /consignment-agreements/{id}/accept by PublisherRep"
        actor: PublisherRep
        preconditions:
          - "offered_by == ORGANIZER"
          - "Logical clock < offer_expires_at"
        side_effects:
          - "Terms freeze; fair gains an accepted consignment basis"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /consignment-agreements/{id}/accept by Organizer"
        actor: Organizer
        preconditions:
          - "offered_by == PUBLISHER"
          - "Logical clock < offer_expires_at"
        side_effects:
          - "Terms freeze"
      - from: [PROPOSED, COUNTERED]
        to: DECLINED
        trigger: "POST /consignment-agreements/{id}/decline"
        actor: "Organizer | PublisherRep"
        preconditions: []
        side_effects: []
      - from: [PROPOSED, COUNTERED]
        to: EXPIRED
        trigger: "system (logical clock reaches offer_expires_at; evaluated on clock-set sweep and lazily on any access to the agreement)"
        actor: system
        preconditions:
          - "Logical clock >= offer_expires_at"
        side_effects: []

  - entity: StockLine
    field: status
    initial_state: QUOTED
    terminal_states: [RECONCILED]
    transitions:
      - from: QUOTED
        to: COMMITTED
        trigger: "POST /stock-lines/{id}/commit"
        actor: Organizer
        preconditions:
          - "Line's agreement is ACCEPTED"
          - "Line's fair is in SCHEDULED or STOCKING"
        side_effects: []
      - from: COMMITTED
        to: DELIVERED
        trigger: "POST /stock-lines/{id}/deliver"
        actor: Organizer
        preconditions:
          - "qty_delivered payload <= qty_committed (ERR_OVER_DELIVERY)"
          - "Line's fair is in STOCKING or OPEN"
        side_effects:
          - "StockLine.qty_delivered set; qty_available_for_sale recomputed"
          - "BACKLIST lines only: Fair.firm_purchases_cents += round_half_up(qty_delivered * list_price_cents * (1 - agreement.discount_pct))"
      - from: DELIVERED
        to: RECONCILED
        trigger: "system (fair's Reconciliation -> APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Line counters freeze; further sales/damage/returns on the line are rejected"

  - entity: AuthorBooking
    field: status
    initial_state: INVITED
    terminal_states: [SETTLED, CANCELLED, DECLINED]
    transitions:
      - from: INVITED
        to: NEGOTIATING
        trigger: "POST /author-bookings/{id}/counter by AuthorRep"
        actor: AuthorRep
        preconditions:
          - "offered_by == ORGANIZER"
          - "Logical clock < offer_expires_at"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (4)"
          - "expected_booking_version == current version (OCC)"
        side_effects:
          - "Offer terms replaced; offered_by -> AUTHOR; negotiation_round += 1; offer_expires_at = clock + offer_expiry_hours; version += 1"
      - from: NEGOTIATING
        to: INVITED
        trigger: "POST /author-bookings/{id}/counter by Organizer"
        actor: Organizer
        preconditions:
          - "offered_by == AUTHOR"
          - "Logical clock < offer_expires_at"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (4)"
          - "expected_booking_version == current version (OCC)"
        side_effects:
          - "Offer terms replaced; offered_by -> ORGANIZER; negotiation_round += 1; offer_expires_at = clock + offer_expiry_hours; version += 1"
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /author-bookings/{id}/accept by AuthorRep"
        actor: AuthorRep
        preconditions:
          - "offered_by == ORGANIZER"
          - "Logical clock < offer_expires_at"
        side_effects:
          - "Offer terms freeze"
      - from: NEGOTIATING
        to: CONFIRMED
        trigger: "POST /author-bookings/{id}/accept by Organizer"
        actor: Organizer
        preconditions:
          - "offered_by == AUTHOR"
          - "Logical clock < offer_expires_at"
        side_effects:
          - "Offer terms freeze"
      - from: [INVITED, NEGOTIATING]
        to: DECLINED
        trigger: "POST /author-bookings/{id}/decline"
        actor: "Organizer | AuthorRep"
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: TRAVEL_BOOKED
        trigger: "POST /author-bookings/{id}/book-travel"
        actor: Organizer
        preconditions:
          - "travel_actual_cents payload <= travel_cap_cents (ERR_TRAVEL_CAP_EXCEEDED)"
        side_effects:
          - "travel_actual_cents recorded"
      - from: TRAVEL_BOOKED
        to: SETTLED
        trigger: "POST /author-bookings/{id}/settle"
        actor: Organizer
        preconditions:
          - "Every SigningSession of this booking is RECONCILED or CANCELLED"
          - "Booking's fair is in OPEN or RECONCILING"
        side_effects:
          - "settled_total_cents = base_honorarium_cents + accrued_bonus_cents + min(travel_actual_cents, travel_cap_cents)"
          - "Fair.honorarium_total_cents recomputed (adds settled_total_cents)"
      - from: [CONFIRMED, TRAVEL_BOOKED]
        to: CANCELLED
        trigger: "POST /author-bookings/{id}/cancel"
        actor: "Organizer | AuthorRep"
        preconditions: []
        side_effects:
          - "kill_fee_cents = round_half_up(0.25 * base_honorarium_cents) from CONFIRMED; round_half_up(0.50 * base_honorarium_cents) from TRAVEL_BOOKED"
          - "Cascade: every non-terminal SigningSession of this booking -> CANCELLED, each of which voids its non-terminal SigningTickets"
          - "Fair.honorarium_total_cents recomputed (adds kill_fee_cents)"
      - from: [INVITED, NEGOTIATING, CONFIRMED, TRAVEL_BOOKED]
        to: CANCELLED
        trigger: "system (fair cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Kill fee accrues per schedule: 0 from INVITED/NEGOTIATING, 25% of base from CONFIRMED, 50% of base from TRAVEL_BOOKED"
          - "Cascade: every non-terminal SigningSession of this booking -> CANCELLED, each of which voids its non-terminal SigningTickets"
          - "Fair.honorarium_total_cents recomputed (adds kill_fee_cents)"

  - entity: SigningSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_SIGNING
        trigger: "POST /signing-sessions/{id}/open-signing"
        actor: LineStaff
        preconditions:
          - "Session's booking is TRAVEL_BOOKED (cross-entity gate)"
          - "Logical clock within [start_at, end_at] inclusive (ERR_OUTSIDE_SIGNING_WINDOW)"
          - "Session's fair is OPEN"
        side_effects: []
      - from: OPEN_FOR_SIGNING
        to: CLOSED_FOR_SIGNING
        trigger: "POST /signing-sessions/{id}/close-signing"
        actor: LineStaff
        preconditions: []
        side_effects:
          - "Every ticket still ISSUED -> NO_SHOW (auto sweep)"
          - "attendance_count = count(tickets ADMITTED) + count(tickets REDEEMED), frozen"
      - from: CLOSED_FOR_SIGNING
        to: RECONCILED
        trigger: "POST /signing-sessions/{id}/reconcile"
        actor: Organizer
        preconditions:
          - "Session's booking is not in a terminal state"
        side_effects:
          - "bonus_cents computed per signing_bonus (TICKETED sessions only; FREE sessions always 0)"
          - "Booking.accrued_bonus_cents += bonus_cents (bubble-up; bumps booking version)"
      - from: [SCHEDULED, OPEN_FOR_SIGNING, CLOSED_FOR_SIGNING]
        to: CANCELLED
        trigger: "POST /signing-sessions/{id}/cancel, or system (booking cancel / fair cancel cascade)"
        actor: "Organizer | system"
        preconditions: []
        side_effects:
          - "Every ticket in ISSUED or ADMITTED -> VOIDED (entitlement release; redeemed history preserved)"

  - entity: SigningTicket
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, NO_SHOW, VOIDED]
    transitions:
      - from: ISSUED
        to: ADMITTED
        trigger: "POST /signing-tickets/{id}/admit"
        actor: LineStaff
        preconditions:
          - "The PAYLOAD session (session_id) is OPEN_FOR_SIGNING (ERR_SESSION_NOT_SIGNING)"
          - "Safety: count(payload-session tickets in ADMITTED) < that session's admit_concurrent_cap (ERR_LINE_CAPACITY_EXCEEDED)"
          - "Referential: payload session_id == ticket.session_id (ERR_TICKET_SESSION_MISMATCH)"
        side_effects: []
        note: "All session-scoped checks (state, safety) run against the payload session; only the referential check compares the ticket's own session_id. Check order follows §1.4: state (8) before safety (10) before referential (20)."
      - from: ADMITTED
        to: REDEEMED
        trigger: "POST /signing-tickets/{id}/redeem"
        actor: LineStaff
        preconditions:
          - "Session is OPEN_FOR_SIGNING or CLOSED_FOR_SIGNING"
        side_effects: []
      - from: [ISSUED, ADMITTED]
        to: VOIDED
        trigger: "POST /signing-tickets/{id}/void, or system (session cancel cascade)"
        actor: "LineStaff | system"
        preconditions: []
        side_effects:
          - "Entitlement released: session live-entitlement count decreases by 1"
      - from: ISSUED
        to: NO_SHOW
        trigger: "system (session close-signing sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Preorder
    field: status
    initial_state: PLACED
    terminal_states: [FULFILLED, CONVERTED_BACKLIST, CANCELLED]
    transitions:
      - from: PLACED
        to: ALLOCATED
        trigger: "system (preorder_allocation at fair open, when qty <= qty_available_for_sale at its turn)"
        actor: system
        preconditions: []
        side_effects:
          - "StockLine.qty_held_preorder += qty; qty_available_for_sale recomputed"
      - from: PLACED
        to: CONVERTED_BACKLIST
        trigger: "system (preorder_allocation at fair open, when qty > qty_available_for_sale at its turn — includes the qty_available_for_sale == 0 empty-stock edge)"
        actor: system
        preconditions: []
        side_effects:
          - "No hold placed; demand deferred to a firm backlist reorder outside this API"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /preorders/{id}/fulfill"
        actor: Cashier
        preconditions:
          - "Preorder's fair is OPEN"
        side_effects:
          - "fulfillment_price_cents = qty * StockLine.list_price_cents"
          - "StockLine.qty_held_preorder -= qty; StockLine.qty_sold += qty; qty_available_for_sale recomputed"
          - "Fair.gross_sales_cents += fulfillment_price_cents"
      - from: [PLACED, ALLOCATED]
        to: CANCELLED
        trigger: "POST /preorders/{id}/cancel, or system (close-sales sweep for ALLOCATED; fair cancel cascade for PLACED/ALLOCATED)"
        actor: "Cashier | system"
        preconditions:
          - "Actor-driven cancel: fair not in RECONCILING, SETTLED, or CANCELLED"
        side_effects:
          - "If ALLOCATED: StockLine.qty_held_preorder -= qty (compensating release); qty_available_for_sale recomputed"

  - entity: SaleTransaction
    field: status
    initial_state: DRAFT
    terminal_states: [TENDERED, VOIDED]
    transitions:
      - from: DRAFT
        to: TENDERED
        trigger: "POST /sales/{id}/tender"
        actor: Cashier
        preconditions:
          - "Sale's fair is OPEN (ERR_FAIR_NOT_OPEN) — checked before fiscal checks"
          - "Every line's StockLine is DELIVERED and belongs to sale's fair (ERR_LINE_FAIR_MISMATCH)"
          - "Per line: qty <= StockLine.qty_available_for_sale (ERR_STOCK_NOT_AVAILABLE)"
          - "Per line: unit_price_cents, if supplied, within [floor(list * (1 - markdown_allowance_pct)), list] of the line's ACCEPTED agreement (ERR_PRICE_BEYOND_MARKDOWN)"
          - "tendered_amount_cents >= total_cents (ERR_TENDER_SHORT)"
        side_effects:
          - "Per line: StockLine.qty_sold += qty; qty_available_for_sale recomputed"
          - "Fair.gross_sales_cents += total_cents (derived-field sync; bumps fair version)"
          - "tendered_amount_cents and change_cents recorded"
      - from: [DRAFT, TENDERED]
        to: VOIDED
        trigger: "POST /sales/{id}/void"
        actor: Cashier
        preconditions:
          - "Sale's fair is OPEN (voids after close-sales are rejected to protect reconciliation integrity)"
        side_effects:
          - "If TENDERED (compensation): per line StockLine.qty_sold -= qty; qty_available_for_sale recomputed; Fair.gross_sales_cents -= total_cents"
          - "If DRAFT: no compensation (nothing was committed)"

  - entity: Reconciliation
    field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: VARIANCE_REVIEW
        trigger: "POST /reconciliations/{id}/submit-review"
        actor: Organizer
        preconditions:
          - "counted_lines covers every DELIVERED StockLine of the fair (ERR_COUNTS_INCOMPLETE)"
        side_effects:
          - "variance_lines and total_abs_variance recomputed"
      - from: VARIANCE_REVIEW
        to: OPEN
        trigger: "POST /reconciliations/{id}/counts (recount supersedes)"
        actor: Organizer
        preconditions:
          - "expected_reconciliation_version == current version (OCC)"
        side_effects:
          - "counted_lines replaced; variance_lines recomputed; version += 1"
        note: "Same transition shape applies OPEN -> OPEN (a recount while OPEN stays OPEN and still bumps version)"
      - from: VARIANCE_REVIEW
        to: APPROVED
        trigger: "POST /reconciliations/{id}/approve"
        actor: Organizer
        preconditions:
          - "Segregation of duties: acting X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "total_abs_variance <= SHRINK_TOLERANCE_UNITS (2) (ERR_VARIANCE_BEYOND_TOLERANCE)"
        side_effects:
          - "publisher_remittance computed and locked: remittance_cents; Fair.publisher_remittance_cents = remittance_cents"
          - "Every DELIVERED StockLine of the fair -> RECONCILED (counters freeze)"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /reconciliations/{id}/submit"
        actor: Organizer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /reconciliations/{id}/accept"
        actor: PublisherRep
        preconditions:
          - "Acting publisher party == the ACCEPTED agreement's publisher for this fair"
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /reconciliations/{id}/dispute"
        actor: PublisherRep
        preconditions:
          - "Acting publisher party == the ACCEPTED agreement's publisher for this fair"
        side_effects:
          - "dispute_reason recorded"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /reconciliations/{id}/counts (recount after dispute reopens the reconciliation)"
        actor: Organizer
        preconditions:
          - "expected_reconciliation_version == current version (OCC)"
        side_effects:
          - "counted_lines replaced; variance recomputed; dispute_reason cleared; version += 1"
        note: "Cycle: OPEN -> VARIANCE_REVIEW -> OPEN (recount) and SUBMITTED -> DISPUTED -> OPEN (dispute + recount); remittance is only ever locked by approve from VARIANCE_REVIEW"

  - entity: ReturnAuthorization
    field: status
    initial_state: REQUESTED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-authorizations/{id}/approve"
        actor: PublisherRep
        preconditions:
          - "Acting publisher party == agreement.publisher_party_id"
          - "Per line: cumulative qty over this RA and all APPROVED/SHIPPED/CREDITED RAs of the fair for that line <= qty_delivered - qty_sold - qty_damaged (ERR_RETURN_QUANTITY_EXCEEDS_ON_HAND)"
        side_effects: []
        note: "The consignment cap floor(return_cap_pct * qty_delivered) is NOT a rejection: copies beyond the cap are credited at the reduced restocking rate per the return_credit waterfall. The only hard rejection is returning more than physically remains."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /return-authorizations/{id}/reject"
        actor: PublisherRep
        preconditions:
          - "Acting publisher party == agreement.publisher_party_id"
        side_effects: []
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /return-authorizations/{id}/ship"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Per line: StockLine.qty_returned_shipped += qty; qty_available_for_sale recomputed"
      - from: SHIPPED
        to: CREDITED
        trigger: "POST /return-authorizations/{id}/confirm-credit"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Cascade link 1: credit_cents computed per return_credit (in-cap vs over-cap waterfall, per-line round_half_up then summed); StockLine.qty_returned_credited += qty"
          - "Cascade link 2: caused by link 1's counter mutation — Fair.return_credits_cents recomputed (+= credit_cents); any ProfitSharePayout already CALCULATED is deliberately NOT refreshed (snapshot semantics; requires recalculate)"

  - entity: ProfitSharePayout
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /profit-share-payouts/{id}/calculate"
        actor: Organizer
        preconditions:
          - "Fair's latest Reconciliation is ACCEPTED (cross-entity gate)"
          - "Every AuthorBooking of the fair is in SETTLED, CANCELLED, or DECLINED (honorarium basis must be final)"
        side_effects:
          - "school_payout computed: net_revenue_cents, share_cents, cash_amount_cents, scrip_amount_cents (both variants computed; mode not yet chosen)"
      - from: CALCULATED
        to: DRAFT
        trigger: "POST /profit-share-payouts/{id}/recalculate"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Computed amounts cleared (revision loop back to DRAFT)"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /profit-share-payouts/{id}/approve"
        actor: SchoolCoordinator
        preconditions:
          - "Acting school party == payout.school_party_id"
          - "Payload mode in {CASH, SCRIP}"
        side_effects:
          - "mode recorded; final_amount_cents = cash_amount_cents if CASH else scrip_amount_cents (variant selection locked)"
      - from: APPROVED
        to: PAID
        trigger: "POST /profit-share-payouts/{id}/pay"
        actor: Organizer
        preconditions: []
        side_effects: []

  - entity: MediaBlast
    field: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: [DRAFT, REJECTED]
        to: PENDING_APPROVAL
        trigger: "POST /media-blasts/{id}/submit"
        actor: Organizer
        preconditions:
          - "Blast's fair is in DRAFT, SCHEDULED, STOCKING, or OPEN"
        side_effects:
          - "Revision loop: submitting a REJECTED blast re-enters PENDING_APPROVAL"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /media-blasts/{id}/approve"
        actor: SchoolCoordinator
        preconditions:
          - "Acting school party == blast's fair.school_party_id"
          - "Fiscal: sum of spend_cents over this fair's blasts in APPROVED or PUBLISHED, plus this blast, <= fair.promo_budget_cents (ERR_PROMO_BUDGET_EXCEEDED)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /media-blasts/{id}/reject"
        actor: SchoolCoordinator
        preconditions:
          - "Acting school party == blast's fair.school_party_id"
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /media-blasts/{id}/publish"
        actor: Organizer
        preconditions:
          - "Logical clock >= embargo_until (ERR_EMBARGO_ACTIVE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true supersede races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-counter-stale-version
    parent_entity: ConsignmentAgreement
    write_endpoint: "POST /consignment-agreements/{id}/counter"
    occ_field: "expected_agreement_version"
    description: |
      Countering an offer on a ConsignmentAgreement whose version has advanced
      since the client last observed it is rejected. This captures the case where
      the other negotiating party has just posted a counter-offer (which
      legitimately supersedes the prior live offer) and the current writer's
      view of the negotiation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-counter-stale-version
    parent_entity: AuthorBooking
    write_endpoint: "POST /author-bookings/{id}/counter"
    occ_field: "expected_booking_version"
    description: |
      Countering an offer on an AuthorBooking whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      other side has just posted a counter-offer (which legitimately supersedes
      the prior live offer) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recount-stale-version
    parent_entity: Reconciliation
    write_endpoint: "POST /reconciliations/{id}/counts"
    occ_field: "expected_reconciliation_version"
    description: |
      Submitting physical counts against a Reconciliation whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another organizer has just posted a recount (which legitimately
      supersedes the prior count set) and the current writer's view of the count
      basis is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stock_qty_available
    trigger: "StockLine deliver, preorder allocation/cancel/fulfill, sale tender/void, damage, return ship"
    algorithm: aggregation
    formula: |
      qty_available_for_sale = qty_delivered - qty_held_preorder - qty_sold - qty_damaged - qty_returned_shipped
    input_set: "The single StockLine whose counters changed; all mutations are immediate (consistency_model: immediate)"
    precision: "integer units; no rounding"
    note: "Copy-conservation invariant anchor: qty_delivered == qty_held_preorder + qty_sold + qty_damaged + qty_returned_shipped + qty_available_for_sale at all times after delivery"

  - name: preorder_allocation
    trigger: "Fair STOCKING -> OPEN transition"
    algorithm: chronological
    formula: |
      candidates = all Preorders of the fair with status == PLACED
      order: created_at ASC, then qty ASC, then customer_name ASC (never id)
      for each preorder in order:
        line = preorder.stock_line
        if preorder.qty <= line.qty_available_for_sale:
          preorder -> ALLOCATED; line.qty_held_preorder += preorder.qty
        else:
          preorder -> CONVERTED_BACKLIST (no hold)
    input_set: "Preorders of this fair in PLACED only; stock counters as of the open transition"
    precision: "integer units"
    note: "All-or-nothing per preorder; a preorder that exactly exhausts remaining stock (qty == qty_available_for_sale) is ALLOCATED (>= semantics); qty_available_for_sale == 0 routes everything remaining to CONVERTED_BACKLIST without error"

  - name: publisher_remittance
    trigger: "Reconciliation VARIANCE_REVIEW -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER: round per line first, then sum.
      per FRONTLIST StockLine with status DELIVERED (now -> RECONCILED):
        remit_line_cents = round_half_up(qty_sold * list_price_cents * (1 - agreement.discount_pct))
      remittance_cents = sum(remit_line_cents)
      BACKLIST lines contribute 0 (their cost was accrued to firm_purchases_cents at deliver).
    input_set: "StockLines of the fair in DELIVERED at approve time; terms from the ACCEPTED ConsignmentAgreement"
    precision: "2 decimal places, round_half_up, applied PER LINE before summation"
    variants:
      - name: per_line_then_sum
        when: "always (pinned)"
        difference: "canonical"
      - name: sum_then_round
        when: "PROHIBITED alternative"
        difference: "round_half_up(sum(qty_sold * list_price_cents * (1 - discount_pct))) — can differ from the pinned order by cents; e.g. 3 lines of qty=1 at list 999 with discount 0.45: pinned gives 3 * round_half_up(549.45) = 3 * 549 = 1647, prohibited gives round_half_up(1648.35) = 1648"

  - name: return_credit
    trigger: "ReturnAuthorization SHIPPED -> CREDITED (confirm-credit)"
    algorithm: waterfall_allocation
    formula: |
      cap_per_line = floor(return_cap_pct * qty_delivered)
      Prior credited/shipped quantities consume cap first, in RA created_at ASC order (tie-break: none needed, timestamps unique to the millisecond).
      For this RA, per line, walking copies in order:
        in_cap_qty  = max(0, min(qty, cap_per_line - prior_credited_qty_for_line))
        over_cap_qty = qty - in_cap_qty
        credit_line_cents = round_half_up(in_cap_qty * list * (1 - discount_pct))
                          + round_half_up(over_cap_qty * list * (1 - discount_pct) * (1 - restocking_fee_pct))
      credit_cents = sum(credit_line_cents)  # per-line rounding, then sum (same pinned order as publisher_remittance)
    input_set: "This RA's lines; the fair's ACCEPTED agreement terms; prior RAs of the fair in APPROVED, SHIPPED, or CREDITED status"
    precision: "2 decimal places, round_half_up per in-cap/over-cap component"
    note: "Boundary: cumulative qty exactly == cap is fully in-cap (<= semantics); the first copy beyond cap is credited at the reduced rate"

  - name: signing_bonus
    trigger: "SigningSession CLOSED_FOR_SIGNING -> RECONCILED"
    algorithm: threshold
    formula: |
      if session.mode == FREE: bonus_cents = 0
      else (TICKETED):
        attendance = session.attendance_count  # frozen at close-signing
        if attendance >= booking.bonus_threshold_attendees:
          bonus_cents = booking.bonus_base_cents + booking.bonus_per_attendee_cents * (attendance - booking.bonus_threshold_attendees)
        else:
          bonus_cents = 0
    input_set: "The session's frozen attendance_count; the booking's frozen offer terms"
    precision: "integer cents"
    note: "Boundary is >= : attendance exactly equal to bonus_threshold_attendees triggers the bonus; ticketed-vs-free mode decides eligibility outright"

  - name: honorarium_settlement
    trigger: "AuthorBooking TRAVEL_BOOKED -> SETTLED"
    algorithm: aggregation
    formula: |
      travel_reimbursement = min(travel_actual_cents, travel_cap_cents)
      settled_total_cents = base_honorarium_cents + accrued_bonus_cents + travel_reimbursement
      Fair.honorarium_total_cents = sum(settled_total_cents over SETTLED bookings of the fair)
                                  + sum(kill_fee_cents over CANCELLED bookings of the fair)
    input_set: "The booking's frozen terms, travel actuals, and accrued bonuses; fair bookings in SETTLED/CANCELLED"
    precision: "integer cents; kill fees rounded round_half_up at accrual (0.25 / 0.50 of base)"
    variants:
      - name: settled_path
        when: "booking completes (TRAVEL_BOOKED -> SETTLED)"
        difference: "full base + bonuses + capped travel"
      - name: cancelled_path
        when: "booking cancelled from CONFIRMED or TRAVEL_BOOKED"
        difference: "base and bonuses are NOT paid; only kill_fee_cents (25% of base from CONFIRMED, 50% from TRAVEL_BOOKED) accrues to the fair's honorarium total"

  - name: school_payout
    trigger: "ProfitSharePayout DRAFT -> CALCULATED"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED (do not reorder):
      (1) gross        = fair.gross_sales_cents
      (2) costs        = fair.firm_purchases_cents + fair.publisher_remittance_cents
                         - fair.return_credits_cents + fair.honorarium_total_cents + promo_spend
        where promo_spend = sum(spend_cents) over this fair's MediaBlasts in APPROVED or PUBLISHED
      (3) net_revenue_cents = gross - costs
      (4) share: if net_revenue_cents <= 0 -> share_cents = 0
          else marginal tiers (constants in cents):
            tier1 = 0.20 * min(net, 200000)
            tier2 = 0.25 * max(0, min(net, 600000) - 200000)
            tier3 = 0.30 * max(0, net - 600000)
            share_cents = round_half_up(tier1 + tier2 + tier3)   # single final rounding, no per-tier rounding
      (5) variants: cash_amount_cents = share_cents
                    scrip_amount_cents = round_half_up(share_cents * 1.15)
    input_set: "Fair computed fields at calculate time (snapshot semantics — later mutations do not refresh a CALCULATED payout); MediaBlasts of the fair in APPROVED or PUBLISHED"
    constants:
      TIER1_CAP_CENTS: 200000
      TIER2_CAP_CENTS: 600000
      TIER1_RATE: 0.20
      TIER2_RATE: 0.25
      TIER3_RATE: 0.30
      SCRIP_MULTIPLIER: 1.15
    precision: "2 decimal places, round_half_up, exactly one rounding at step (4) and one at step (5)"
    variants:
      - name: cash
        when: "school selects CASH at approve"
        difference: "final_amount_cents = cash_amount_cents = share_cents"
      - name: scrip
        when: "school selects SCRIP at approve"
        difference: "final_amount_cents = scrip_amount_cents = round_half_up(share_cents * 1.15) — always >= cash variant; e.g. share 40000 -> cash 40000 vs scrip 46000"

  - name: reconciliation_variance
    trigger: "Reconciliation counts entry (every POST .../counts) and submit-review"
    algorithm: aggregation
    formula: |
      provisional per line (snapshot at close-sales):
        expected_on_hand = qty_delivered - qty_sold - qty_damaged - qty_returned_shipped - qty_held_preorder
      final per line: qty_on_hand from the latest counted_lines set
      variance_line = qty_on_hand - expected_on_hand
      total_abs_variance = sum(|variance_line|)
    input_set: "StockLines of the fair in DELIVERED/RECONCILED; expected_on_hand recomputed from current counters at each evaluation (counts entry or submit-review); the latest count set supplies the final side"
    constants:
      SHRINK_TOLERANCE_UNITS: 2
    precision: "integer units"
    variants:
      - name: provisional
        when: "system-derived from sales/returns counters (the books)"
        difference: "expected_on_hand from recorded events only"
      - name: final
        when: "physical count entered by staff (the shelf)"
        difference: "qty_on_hand as counted; identical underlying stock can yield provisional != final when unrecorded shrink exists — the delta IS the variance and drives the VARIANCE_REVIEW branch"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_MISSING_HEADERS
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "For entity-backed roles (SchoolCoordinator, PublisherRep, AuthorRep), X-User-ID references an existing Party"
    error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints invoked with an entity-backed role"
  - priority: 4
    category: auth
    check: "Entity-backed role's Party kind matches the role (SchoolCoordinator->SCHOOL, PublisherRep->PUBLISHER, AuthorRep->AUTHOR)"
    error_id: ERR_ROLE_PARTY_KIND_MISMATCH
    http_status: 403
    applies_to: "all endpoints invoked with an entity-backed role"
  - priority: 5
    category: existence
    check: "Path resources exist, validated left-to-right; body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body resource references"
  - priority: 6
    category: auth
    check: "Party scope: acting Party equals the resource's scoped party (fair.school_party_id, agreement.publisher_party_id, booking.author_party_id)"
    error_id: ERR_PARTY_SCOPE_MISMATCH
    http_status: 403
    applies_to: "scoped endpoints: venue-slot confirm; agreement counter/accept/decline (publisher side); booking counter/accept/decline/cancel (author side); reconciliation accept/dispute; return-authorization approve/reject; payout approve; media-blast approve/reject"
  - priority: 7
    category: business_constraint
    check: "Request shape: required fields present, types match, enums valid, numeric ranges honored (qty > 0, pct in [0,1], end > start), unknown fields rejected; VenueSlot.venue_key must equal the linked Fair.venue_key"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 8
    category: state
    check: "Target entity is in a state from which the requested transition exists (terminal-state lockdown included)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: state
    check: "Cross-entity gate: sale tender/void, preorder fulfill, and session open-signing require the fair to be OPEN"
    error_id: ERR_FAIR_NOT_OPEN
    http_status: 409
    applies_to: "POST /sales/{id}/tender, POST /sales/{id}/void, POST /preorders/{id}/fulfill, POST /signing-sessions/{id}/open-signing"
  - priority: 8
    category: state
    check: "Cross-entity gate: stock-line commit and return create require an ACCEPTED consignment agreement"
    error_id: ERR_AGREEMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /stock-lines/{id}/commit, POST /return-authorizations"
  - priority: 8
    category: state
    check: "Cross-entity gate: return create requires the fair's latest Reconciliation in APPROVED/SUBMITTED/ACCEPTED; payout calculate requires it ACCEPTED"
    error_id: ERR_RECONCILIATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /return-authorizations, POST /profit-share-payouts/{id}/calculate"
  - priority: 8
    category: state
    check: "Cross-entity gate: session open-signing requires its booking TRAVEL_BOOKED"
    error_id: ERR_BOOKING_NOT_TRAVEL_READY
    http_status: 409
    applies_to: "POST /signing-sessions/{id}/open-signing"
  - priority: 8
    category: state
    check: "Cross-entity gate: ticket admit requires session OPEN_FOR_SIGNING; redeem requires OPEN_FOR_SIGNING or CLOSED_FOR_SIGNING"
    error_id: ERR_SESSION_NOT_SIGNING
    http_status: 409
    applies_to: "POST /signing-tickets/{id}/admit, POST /signing-tickets/{id}/redeem"
  - priority: 9
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /consignment-agreements/{id}/counter, POST /author-bookings/{id}/counter, POST /reconciliations/{id}/counts"
  - priority: 10
    category: business_safety
    check: "Signing-line fire-marshal cap: count(session tickets ADMITTED) < admit_concurrent_cap before admitting another"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /signing-tickets/{id}/admit"
  - priority: 11
    category: business_temporal
    check: "Venue overlap: candidate VenueSlot effective half-open interval [start_at - setup_buffer, end_at + teardown_buffer) intersects a non-RELEASED slot with the same venue_key"
    error_id: ERR_VENUE_CONFLICT
    http_status: 409
    applies_to: "POST /venue-slots"
  - priority: 12
    category: business_temporal
    check: "Signing-floor aggregate capacity: sum of line_space_units over the fair's non-CANCELLED sessions whose CLOSED windows [start_at, end_at] intersect the candidate's, plus candidate's, <= fair.signing_floor_capacity_units"
    error_id: ERR_SIGNING_FLOOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /signing-sessions"
  - priority: 13
    category: business_temporal
    check: "Logical clock within signing window [start_at, end_at] inclusive at open-signing"
    error_id: ERR_OUTSIDE_SIGNING_WINDOW
    http_status: 409
    applies_to: "POST /signing-sessions/{id}/open-signing"
  - priority: 14
    category: business_temporal
    check: "Logical clock >= embargo_until at publish"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /media-blasts/{id}/publish"
  - priority: 15
    category: business_temporal
    check: "Logical clock < offer_expires_at on counter/accept (expired offers transition to EXPIRED instead)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "agreement/booking counter and accept endpoints"
  - priority: 16
    category: business_constraint
    check: "Negotiation round cap: negotiation_round < MAX_NEGOTIATION_ROUNDS (agreements 6, bookings 4) on counter"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /consignment-agreements/{id}/counter, POST /author-bookings/{id}/counter"
  - priority: 17
    category: business_constraint
    check: "Duplicate active resource: one non-terminal ConsignmentAgreement per (fair_id, publisher_party_id); one Reconciliation per fair; one non-terminal ProfitSharePayout per fair"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /consignment-agreements, POST /profit-share-payouts, and the close-sales spawn"
  - priority: 18
    category: business_constraint
    check: "Capacity: issuing a signing ticket requires count(session tickets in ISSUED/ADMITTED/REDEEMED) < capacity_seats"
    error_id: ERR_SIGNING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /signing-tickets"
  - priority: 19
    category: business_constraint
    check: "Sale tender: per-line qty <= StockLine.qty_available_for_sale"
    error_id: ERR_STOCK_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sales/{id}/tender"
  - priority: 19
    category: business_constraint
    check: "Damage write-off: qty <= qty_delivered - qty_sold - qty_damaged - qty_returned_shipped - qty_held_preorder (unsold, unheld on-hand)"
    error_id: ERR_DAMAGE_EXCEEDS_ON_HAND
    http_status: 409
    applies_to: "POST /stock-lines/{id}/damage"
  - priority: 19
    category: business_constraint
    check: "Delivery: qty_delivered <= qty_committed"
    error_id: ERR_OVER_DELIVERY
    http_status: 409
    applies_to: "POST /stock-lines/{id}/deliver"
  - priority: 19
    category: business_constraint
    check: "Return approve: per-line cumulative qty over APPROVED/SHIPPED/CREDITED RAs + this RA <= qty_delivered - qty_sold - qty_damaged"
    error_id: ERR_RETURN_QUANTITY_EXCEEDS_ON_HAND
    http_status: 409
    applies_to: "POST /return-authorizations/{id}/approve"
  - priority: 19
    category: business_constraint
    check: "Return create: every referenced StockLine has line_type FRONTLIST (BACKLIST lines are firm purchases and cannot be returned)"
    error_id: ERR_FIRM_SALE_NOT_RETURNABLE
    http_status: 409
    applies_to: "POST /return-authorizations"
  - priority: 20
    category: business_referential
    check: "Cross-references coherent: stock_line.fair_id == request fair_id (preorders, sales); session.booking.fair_id == request fair_id (signing-sessions); agreement.fair_id == request fair_id and agreement ACCEPTED (return-authorizations)"
    error_id: ERR_LINE_FAIR_MISMATCH
    http_status: 409
    applies_to: "POST /preorders, POST /sales, POST /signing-sessions, POST /return-authorizations"
  - priority: 20
    category: business_referential
    check: "Admit payload session_id == ticket.session_id"
    error_id: ERR_TICKET_SESSION_MISMATCH
    http_status: 409
    applies_to: "POST /signing-tickets/{id}/admit"
  - priority: 21
    category: business_fiscal
    check: "Markdown band: supplied unit_price_cents within [floor(list*(1-markdown_allowance_pct)), list] per the ACCEPTED agreement"
    error_id: ERR_PRICE_BEYOND_MARKDOWN
    http_status: 409
    applies_to: "POST /sales, POST /sales/{id}/tender"
  - priority: 22
    category: business_fiscal
    check: "tendered_amount_cents >= total_cents"
    error_id: ERR_TENDER_SHORT
    http_status: 402
    applies_to: "POST /sales/{id}/tender"
  - priority: 23
    category: business_fiscal
    check: "Promo budget: cumulative APPROVED+PUBLISHED blast spend + candidate <= fair.promo_budget_cents"
    error_id: ERR_PROMO_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /media-blasts/{id}/approve"
  - priority: 24
    category: business_fiscal
    check: "travel_actual_cents <= travel_cap_cents"
    error_id: ERR_TRAVEL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /author-bookings/{id}/book-travel"
  - priority: 25
    category: business_constraint
    check: "Segregation of duties: reconciliation approver X-User-ID != reconciliation.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reconciliations/{id}/approve"
  - priority: 26
    category: business_constraint
    check: "Counts completeness: counted_lines at submit-review must cover every DELIVERED StockLine of the fair"
    error_id: ERR_COUNTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /reconciliations/{id}/submit-review"
  - priority: 27
    category: business_constraint
    check: "Reconciliation approve gate: total_abs_variance <= SHRINK_TOLERANCE_UNITS (2)"
    error_id: ERR_VARIANCE_BEYOND_TOLERANCE
    http_status: 409
    applies_to: "POST /reconciliations/{id}/approve"
  - priority: 28
    category: business_constraint
    check: "Preorder intake window: preorder creation allowed only while fair is SCHEDULED or STOCKING"
    error_id: ERR_PREORDER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /preorders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving endpoint; default logical time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Default at server startup is exactly 2026-08-01T00:00:00Z (never wall-clock). Side effect: offer-expiry sweep — agreements in PROPOSED/COUNTERED and bookings in INVITED/NEGOTIATING whose offer_expires_at <= new clock become EXPIRED (agreements) / DECLINED is NOT auto-set; bookings are not auto-expired, only agreements (bookings surface ERR_OFFER_EXPIRED on next counter/accept)."
    roles: [Organizer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_agreement_ids: string[] }"
    side_effects: ["Agreement expiry sweep"]

  # --- Parties ---
  - method: POST
    path: "/parties"
    description: "Register a school, publisher, or author party"
    roles: [Organizer]
    code: 201
    input: [kind, name, contact_email]
    output: Party
    side_effects: []
  - method: GET
    path: "/parties/{id}"
    description: "Read a party"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: Party
    side_effects: []

  # --- Fairs ---
  - method: POST
    path: "/fairs"
    description: "Create a fair in DRAFT"
    roles: [Organizer]
    code: 201
    input: [school_party_id, title, venue_key, planned_start_date, planned_end_date, signing_floor_capacity_units, promo_budget_cents]
    output: Fair
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/fairs"
    description: "List fairs (FK reverse-reachability for Fair.school_party_id)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: ["school_party_id?", "status?", "limit?", "offset?"]
    output: Fair[]
    side_effects: []
  - method: GET
    path: "/fairs/{id}"
    description: "Read a fair including computed totals"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: Fair
    side_effects: []
  - method: POST
    path: "/fairs/{id}/schedule"
    description: "DRAFT -> SCHEDULED; requires a CONFIRMED venue slot"
    roles: [Organizer]
    code: 200
    input: []
    output: Fair
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/fairs/{id}/open-stocking"
    description: "SCHEDULED -> STOCKING; requires an ACCEPTED agreement"
    roles: [Organizer]
    code: 200
    input: []
    output: Fair
    side_effects: ["status -> STOCKING"]
  - method: POST
    path: "/fairs/{id}/open"
    description: "STOCKING -> OPEN; runs preorder allocation"
    roles: [Organizer]
    code: 200
    input: []
    output: Fair
    side_effects: ["status -> OPEN", "preorder_allocation runs", "preorder_allocation_run = true"]
  - method: POST
    path: "/fairs/{id}/close-sales"
    description: "OPEN -> RECONCILING; sweeps unfulfilled preorders; spawns Reconciliation"
    roles: [Organizer]
    code: 200
    input: []
    output: Fair
    side_effects: ["status -> RECONCILING", "ALLOCATED preorders -> CANCELLED (holds released)", "Reconciliation created (OPEN)"]
  - method: POST
    path: "/fairs/{id}/settle"
    description: "RECONCILING -> SETTLED; requires recon ACCEPTED, RAs terminal, bookings terminal, payout PAID"
    roles: [Organizer]
    code: 200
    input: []
    output: Fair
    side_effects: ["status -> SETTLED"]
  - method: POST
    path: "/fairs/{id}/cancel"
    description: "Cancel fair (DRAFT/SCHEDULED/STOCKING/OPEN); deep cascade to slots, bookings, sessions, tickets, preorders"
    roles: [Organizer]
    code: 200
    input: ["reason?"]
    output: Fair
    side_effects: ["status -> CANCELLED", "VenueSlots RELEASED", "AuthorBookings CANCELLED (kill fees)", "their SigningSessions CANCELLED", "their SigningTickets VOIDED", "Preorders CANCELLED"]

  # --- Venue slots ---
  - method: POST
    path: "/venue-slots"
    description: "Hold a venue block (HELD); buffered half-open overlap check per venue_key"
    roles: [Organizer]
    code: 201
    input: [fair_id, venue_key, purpose, start_at, end_at, setup_buffer_minutes, teardown_buffer_minutes]
    output: VenueSlot
    side_effects: ["status=HELD"]
  - method: GET
    path: "/venue-slots"
    description: "List venue slots (FK reverse-reachability for VenueSlot.fair_id)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: ["fair_id?", "venue_key?", "status?", "limit?", "offset?"]
    output: VenueSlot[]
    side_effects: []
  - method: GET
    path: "/venue-slots/{id}"
    description: "Read a venue slot"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: VenueSlot
    side_effects: []
  - method: POST
    path: "/venue-slots/{id}/confirm"
    description: "HELD -> CONFIRMED; school-scoped"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: VenueSlot
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/venue-slots/{id}/release"
    description: "HELD/CONFIRMED -> RELEASED"
    roles: [Organizer]
    code: 200
    input: []
    output: VenueSlot
    side_effects: ["status -> RELEASED"]

  # --- Consignment agreements ---
  - method: POST
    path: "/consignment-agreements"
    description: "Organizer proposes consignment terms (PROPOSED, round 1, offered_by ORGANIZER)"
    roles: [Organizer]
    code: 201
    input: [fair_id, publisher_party_id, discount_pct, return_cap_pct, restocking_fee_pct, markdown_allowance_pct, freight_responsibility, offer_expiry_hours]
    output: ConsignmentAgreement
    side_effects: ["status=PROPOSED", "offer_expires_at = clock + offer_expiry_hours"]
  - method: GET
    path: "/consignment-agreements"
    description: "List agreements (FK reverse for fair_id, publisher_party_id)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: ["fair_id?", "publisher_party_id?", "status?", "limit?", "offset?"]
    output: ConsignmentAgreement[]
    side_effects: []
  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Read agreement (terms, round, version)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []
  - method: POST
    path: "/consignment-agreements/{id}/counter"
    description: "Counter the live offer; flips PROPOSED<->COUNTERED; OCC-guarded"
    roles: [Organizer, PublisherRep]
    code: 200
    input: [discount_pct, return_cap_pct, restocking_fee_pct, markdown_allowance_pct, freight_responsibility, offer_expiry_hours, expected_agreement_version]
    output: ConsignmentAgreement
    side_effects: ["status flips PROPOSED<->COUNTERED", "offered_by flips", "negotiation_round += 1", "offer_expires_at reset", "increments ConsignmentAgreement.version by 1"]
  - method: POST
    path: "/consignment-agreements/{id}/accept"
    description: "Accept the live offer (must be the non-offering side)"
    roles: [Organizer, PublisherRep]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/consignment-agreements/{id}/decline"
