            - call: "GET /salt/allocations?delivery_order_id=${order_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { first_lot: "$.data[0].stockpile_lot_id", first_tons: "$.data[0].tons", first_rank: "$.data[0].rank_position", second_lot: "$.data[1].stockpile_lot_id", second_tons: "$.data[1].tons", second_rank: "$.data[1].rank_position" }
          assert:
            - "HTTP 200 and ${st} == ALLOCATED with ${alloc} == 1000.00 and shorted_tons == 0"
            - "total_count == 2 and both rows have origin == WATERFALL and state == RESERVED"
            - "${first_lot} == ${lot_a}, ${first_tons} == 282.00, ${first_rank} == 1"
            - "${second_lot} == ${lot_b}, ${second_tons} == 718.00, ${second_rank} == 2"
            - "StockpileLot.${lot_a}.tons_reserved == 282.00 and tons_available == 0.00 (still AVAILABLE, tons_on_hand 282.00)"
            - "StockpileLot.${lot_b}.tons_reserved == 718.00 and tons_available == 222.00"
            - "DeliveryOrder.${order_id}.shortfall_penalty_usd == 0 and penalty_state == NONE"

      - name: shortfall_haircut_saturates_at_forty_points_while_penalty_hits_the_per_event_cap
        claim_type: decay_function
        grounds:
          - calculations.supply_reliability_score
          - calculations.shortfall_penalty
          - entities.BidContract.fields.breach_watch
          - calculations.storm_allocation_waterfall
        distinguishing_aspect: |
          A single catastrophic short drives both non-linear guards to their limits at once: 2506 t
          short on a 2000 t commitment is a 125.30 % raw haircut that must saturate at the 40-point
          cap (score exactly 60, not -25.30), while the raw penalty 2506 * 30.00 = 75180.00 must be
          clipped by the 15 % order-value cap to 31200.00 — and 31200.00 >= 5 % of the 160000.00
          contract value flips breach_watch to true.
        test_recipe:
          setup:
            - "Two NY depots: Watertown Depot is manually put into SURGE holding an 1880.00 t HIGHWAY_DEICING lot, Syracuse Depot stays OPEN with only 94.00 t. An ACTIVE 2000 t / 80.00 USD/t contract (min_take 80 -> coverage 1600 satisfied by 1974.00 t, max_take 130 -> band 2600.00, penalty 30.00/t) and a ROUTINE 2600 t order on Syracuse."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 2100, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 2100 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Watertown Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 600, outbound_freight_rate_per_ton: 6.000 }
              as: LogisticsPlanner
              captures: { depot_c: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_c}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 2000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_c: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_c}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 100, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_a: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_a}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "POST /salt/depots/${depot_c}/posture"
              payload: { depot_state: "SURGE", reason: "storm staging" }
              as: LogisticsPlanner
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 2000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 130, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { c_v: "$.data.version" }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 2600, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${c_v}" }
              as: LogisticsPlanner
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /salt/delivery-orders/${order_id}/allocate"
              payload: {}
              as: LogisticsPlanner
              captures: { st: "$.data.status", short: "$.data.shorted_tons", pen: "$.data.shortfall_penalty_usd" }
            - call: "GET /salt/bid-contracts/${c_id}/ledger"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { score: "$.data.supply_reliability_score", accrued: "$.data.penalty_accrued_usd", watch: "$.data.breach_watch" }
          assert:
            - "HTTP 200 and ${st} == SHORTED with allocated_tons == 94.00 (the SURGE depot's 1880.00 t lot is invisible to a ROUTINE order)"
            - "${short} == 2506.00"
            - "${pen} == 31200.00 — the 15 % cap on the 208000.00 order value, not the raw 75180.00"
            - "${accrued} == 31200.00 and DeliveryOrder.${order_id}.penalty_state == ACCRUED"
            - "${score} == 60 — the raw 125.30-point haircut saturates at the 40-point cap"
            - "${watch} == true (31200.00 >= 0.05 * 160000.00)"
            - "the ledger still reports preseason_coverage_tons == 1974.00, which is why activation succeeded"

      - name: grade_tier_boundaries_of_the_panel_reserve
        claim_type: threshold
        excluded_because:
          difficulty_instance: grade_tier_boundary_at_exactly_95_and_90_pct_nacl
          rationale: |
            The at/above/below behaviour of both grade tier edges (95.00 and 90.00 % NaCl) on
            calculations.panel_recoverable_tons, including the exactly-at-boundary tier choice, is
            already asserted there.

      - name: overlapping_and_touching_hoist_windows
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: half_open_hoist_windows_touch_and_aggregate_rate_equals_capacity
          rationale: |
            Half-open window semantics (a window ending exactly when the next begins does not
            overlap) and the equality-allowed aggregate rate on calculations.hoist_window_aggregate_capacity
            are the whole subject of that instance; the loadout-bay variant of the same algorithm is
            covered by closed_loadout_windows_collide_across_mode_switch_buffer_by_one_minute.

      - name: per_line_rounding_before_summation_on_the_invoice
        claim_type: aggregation
        excluded_because:
          difficulty_instance: delivery_invoice_per_line_rounding_before_summation_two_lots
          rationale: |
            The pinned rounding order of calculations.delivery_invoice_amount (round each allocation
            line to cents, then sum) is asserted there on a two-lot order where summing raw products
            and rounding once differs by whole cents.

      - name: capacity_change_propagates_through_the_mine_tree
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: mine_citation_re_derives_child_panel_reserve_but_spares_depleted_panels
          rationale: |
            Propagation of a compliance-state change through calculations.mine_effective_hoist_capacity
            into child panels and runs, its fixed point and the exemption of terminal panels are all
            asserted there.

      - name: per_event_versus_season_aggregate_penalty_tiers
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: shortfall_penalty_per_event_versus_season_aggregate_reconciliation
          rationale: |
            Both penalty tiers of calculations.shortfall_penalty (per-order storm multiplier plus
            15 % cap versus the season tolerance band with neither) are driven there on one identical
            delivery history.

      - name: penalty_variant_switch_reconciliation_delta
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: shortfall_penalty_per_event_versus_season_aggregate_reconciliation
          rationale: |
            penalty_reconciliation_delta_usd — the signed gap applied to the ledger when the variant
            switches from PER_EVENT to SEASON_AGGREGATE at close-season — is asserted in the same
            instance.

      - name: preseason_target_includes_pending_severity_revisions
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: preseason_target_severity_weighted_versus_trailing_baseline_switch
          rationale: |
            The forward-looking re-evaluation of calculations.preseason_stockpile_target when the
            severity index is revised through PATCH /salt/season-forecasts/{id} is asserted there.

      - name: severity_weighted_versus_trailing_baseline_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: preseason_target_severity_weighted_versus_trailing_baseline_switch
          rationale: |
            The same forecast row is computed under both declared variants there, and the delta
            between them is asserted as a literal.

      - name: forecast_method_selects_the_variant
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: preseason_target_severity_weighted_versus_trailing_baseline_switch
          rationale: |
            Variant selection by SeasonForecast.method (and the re-selection performed by a PATCH
            that flips the method) is asserted in the same instance.

      - name: rework_loss_factor_compounds_without_rounding_drift
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: treatment_batch_pending_self_loop_bounded_at_two_reworks
          rationale: |
            The only place where the weights of calculations.treatment_yield_and_purity accumulate
            (0.97 compounded across successive reworks, recomputed from input_tons rather than from
            the previously rounded yield) is that instance, which asserts 940.00 -> 911.80 -> 884.45
            and the frozen purity.

