        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_APPOINTMENT_IN_PAST]", "errors[ERR_INVALID_TIME_RANGE]", "errors[ERR_SAME_DAY_ONLY]"]
        distinguishing_aspect: "Past start, inverted range, and same-day-triage-for-tomorrow each fail with their own error; range shape is checked before pastness."
        test_recipe:
          setup: ["clock 2026-05-01T00:00; student; provider"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S30", full_name: "Temp Rules" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr M", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-04-30T10:00:00Z", scheduled_end: "2026-04-30T10:30:00Z" }, as: FrontDeskStaff, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T10:30:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FrontDeskStaff, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:15:00Z" }, as: FrontDeskStaff, captures: { err3: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 422, error_id == ERR_APPOINTMENT_IN_PAST (valid range, but start <= now)"
            - "trigger[1]: HTTP 422, error_id == ERR_INVALID_TIME_RANGE (end <= start; future dates do not rescue it)"
            - "trigger[2]: HTTP 422, error_id == ERR_SAME_DAY_ONLY (triage must be scheduled on the current date 2026-05-01)"

      - name: travel_booking_requires_verified_policy
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSURANCE_NOT_VERIFIED]"]
        distinguishing_aspect: "TRAVEL_CLINIC booking fails with 402 when the student has no policy and when the policy is merely UNVERIFIED; it succeeds only after verification."
        test_recipe:
          setup: ["clock 2026-05-01; student; provider; no policy initially"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S31", full_name: "Traveler" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr N", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "TR-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "TRAVEL_CLINIC", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
          assert:
            - "trigger[0]: HTTP 402, error_id == ERR_INSURANCE_NOT_VERIFIED (no policy at all)"
            - "trigger[2]: HTTP 402, error_id == ERR_INSURANCE_NOT_VERIFIED (policy exists but UNVERIFIED)"
            - "trigger[4]: HTTP 201, Appointment.${appt}.status == BOOKED (policy VERIFIED)"

      - name: triage_quota_boundary_and_release
        claim_type: violation_to_error
        grounds: [calculations.triage_daily_quota, "errors[ERR_TRIAGE_QUOTA_EXHAUSTED]"]
        distinguishing_aspect: "The 4th same-day triage booking succeeds (count 3 < 4), the 5th fails (count 4 >= 4), and cancelling one frees the quota so the retry succeeds."
        test_recipe:
          setup: ["clock 2026-05-01T00:00; student; provider; four SAME_DAY_TRIAGE bookings on 2026-05-01 at 09:00/09:15/09:30/09:45"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S32", full_name: "Triage Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr O", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T09:15:00Z" }, as: FrontDeskStaff, captures: { t1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T09:15:00Z", scheduled_end: "2026-05-01T09:30:00Z" }, as: FrontDeskStaff }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T09:30:00Z", scheduled_end: "2026-05-01T09:45:00Z" }, as: FrontDeskStaff }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T09:45:00Z", scheduled_end: "2026-05-01T10:00:00Z" }, as: FrontDeskStaff }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T10:00:00Z", scheduled_end: "2026-05-01T10:15:00Z" }, as: FrontDeskStaff, captures: { err: $.data.error_id } }
            - { call: "POST /shc/appointments/${t1}/cancel", payload: {}, as: FrontDeskStaff }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SAME_DAY_TRIAGE", scheduled_start: "2026-05-01T10:00:00Z", scheduled_end: "2026-05-01T10:15:00Z" }, as: FrontDeskStaff, captures: { t5: $.data.id } }
          assert:
            - "setup_api_calls[3..6]: all four bookings 201 (quota 4, boundary inclusive below the cap)"
            - "trigger[0]: HTTP 409, error_id == ERR_TRIAGE_QUOTA_EXHAUSTED (count == 4 >= 4)"
            - "trigger[2]: HTTP 201 — cancelling a triage booking frees the quota (CANCELLED excluded from the count)"

      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role is rejected before any role, existence, or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shc/students", payload: { external_ref: "S33", full_name: "No Auth" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 400, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (as: Anonymous means no X-User headers are sent)"

      - name: existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Dispensing against a non-existent prescription id returns 404 (existence P3) before any state check (P4) could apply."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shc/prescriptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/dispense", payload: { quantity: 1 }, as: Pharmacist, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 404, error_id == ERR_NOT_FOUND"

  # ==================================================================
  # Section: calculations (Table 3 claims)
  # ==================================================================
  - section: calculations
    instances:
      - name: posture_grace_window_provisional_hold
        claim_type: correct_result
        grounds: [calculations.compliance_posture_derivation]
        distinguishing_aspect: "Between deadline and deadline+grace the record is GRACE and posture is PROVISIONAL_HOLD, which still permits elective booking (only REGISTRATION_HOLD blocks)."
        test_recipe:
          setup: ["MMR requirement deadline 2026-05-10 grace 5; student with PENDING record; clock moved to 2026-05-12 (inside grace)"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-05-10", grace_period_days: 5 }, as: HealthAdmin, captures: { req: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S40", full_name: "Grace Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${stu}", requirement_id: "${req}" }, as: Nurse, captures: { rec: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr P", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: HealthAdmin }
          trigger:
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
            - { call: "GET /shc/immunization-records/${rec}", payload: {}, as: Any }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-13T10:00:00Z", scheduled_end: "2026-05-13T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
          assert:
            - "trigger[1]: ImmunizationRecord.${rec}.status == GRACE (2026-05-10 < 2026-05-12 <= 2026-05-15)"
            - "trigger[0]: Student.compliance_posture == PROVISIONAL_HOLD and active_hold_types contains IMMUNIZATION"
            - "trigger[2]: HTTP 201 — elective booking still allowed under PROVISIONAL_HOLD"

      - name: financial_hold_released_by_full_payment
        claim_type: side_effect_execution
        grounds: [calculations.compliance_posture_derivation, state_machines.Invoice]
        distinguishing_aspect: "Paying the overdue invoice in full flips it OVERDUE -> PAID and the student's posture recomputes back to CLEAR with empty active_hold_types."
        test_recipe:
          setup: ["clock 2026-05-01; student; SPORTS_PHYSICAL encounter with self-pay invoice 5000 ISSUED (due 2026-05-31); clock advanced to 2026-06-01 so the invoice is OVERDUE and posture REGISTRATION_HOLD"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S41", full_name: "Release Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr Q", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
          trigger:
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 5000, method: "CARD" }, as: BillingOfficer }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
          assert:
            - "setup_api_calls[8]: posture == REGISTRATION_HOLD with FINANCIAL in active_hold_types (invoice OVERDUE past due_date)"
            - "trigger[1]: Invoice.${inv}.status == PAID, balance_cents == 0"
            - "trigger[2]: Student.compliance_posture == CLEAR and active_hold_types == [] (financial hold released by full payment)"

      - name: stock_reorder_flag_boundary_walk
        claim_type: precision
        grounds: [calculations.stock_reorder_flag]
        distinguishing_aspect: "needs_reorder uses <= : stock 5/4 starts false, dispense to exactly 4 flips true, restock to 5 flips false."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; urgent encounter open; stock initial 5 threshold 4; prescription qty 1"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S42", full_name: "Flag Walk" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr R", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "FLAG1", medication_name: "Flag Drug", initial_on_hand: 5, reorder_threshold: 4 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 1 }, as: Clinician, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx}/dispense", payload: { quantity: 1 }, as: Pharmacist }
            - { call: "GET /shc/medication-stocks", payload: { medication_code: "FLAG1" }, as: Any }
            - { call: "POST /shc/medication-stocks/${stk}/restock", payload: { quantity: 1 }, as: Pharmacist }
          assert:
            - "setup_api_calls[5]: needs_reorder == false at creation (5 > 4)"
            - "trigger[1]: on_hand == 4 and needs_reorder == true (4 <= 4, boundary inclusive)"
            - "trigger[2]: on_hand == 5 and needs_reorder == false"

      - name: outbreak_auto_open_debits_emergency_pool
        claim_type: side_effect_execution
        grounds: [state_machines.DiseaseCase, entities.HealthFeePool.fields.spent_cents]
        distinguishing_aspect: "The third confirm auto-opens the outbreak AND debits the OPEN pool exactly 25000 cents (OUTBREAK_EMERGENCY_DEBIT_CENTS)."
        test_recipe:
          setup: ["clock 2026-05-11T12:00; OPEN pool budget 100000; three MEASLES cases confirmed"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T12:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 100000, term_end_date: "2026-08-31" }, as: HealthAdmin }
            - { call: "POST /shc/providers", payload: { full_name: "Dr S", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S43", full_name: "Pool One" }, as: HealthAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s1}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T13:00:00Z", scheduled_end: "2026-05-11T13:30:00Z" }, as: FrontDeskStaff, captures: { a1: $.data.id } }
            - { call: "POST /shc/appointments/${a1}/check-in", payload: {}, as: FrontDeskStaff, captures: { e1: $.data.id } }
            - { call: "POST /shc/encounters/${e1}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l1: $.data.id } }
            - { call: "POST /shc/lab-orders/${l1}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l1}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l1}/disease-cases", payload: {}, as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c1}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/students", payload: { external_ref: "S44", full_name: "Pool Two" }, as: HealthAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s2}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T14:00:00Z", scheduled_end: "2026-05-11T14:30:00Z" }, as: FrontDeskStaff, captures: { a2: $.data.id } }
            - { call: "POST /shc/appointments/${a2}/check-in", payload: {}, as: FrontDeskStaff, captures: { e2: $.data.id } }
            - { call: "POST /shc/encounters/${e2}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l2: $.data.id } }
            - { call: "POST /shc/lab-orders/${l2}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l2}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l2}/disease-cases", payload: {}, as: Any, captures: { c2: "$.data[0].id" } }
            - { call: "POST /shc/disease-cases/${c2}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "POST /shc/students", payload: { external_ref: "S45", full_name: "Pool Three" }, as: HealthAdmin, captures: { s3: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${s3}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-11T15:00:00Z", scheduled_end: "2026-05-11T15:30:00Z" }, as: FrontDeskStaff, captures: { a3: $.data.id } }
            - { call: "POST /shc/appointments/${a3}/check-in", payload: {}, as: FrontDeskStaff, captures: { e3: $.data.id } }
            - { call: "POST /shc/encounters/${e3}/lab-orders", payload: { test_code: "MEASLES_IGM", reportable_disease_code: "MEASLES" }, as: Clinician, captures: { l3: $.data.id } }
            - { call: "POST /shc/lab-orders/${l3}/collect", payload: {}, as: Nurse }
            - { call: "POST /shc/lab-orders/${l3}/result", payload: { result_summary: "positive", flags_reportable: true }, as: Nurse }
            - { call: "GET /shc/lab-orders/${l3}/disease-cases", payload: {}, as: Any, captures: { c3: "$.data[0].id" } }
          trigger:
            - { call: "POST /shc/disease-cases/${c3}/confirm", payload: {}, as: Clinician, as_user_id: "clin-1" }
            - { call: "GET /shc/health-fee-pools", payload: { term_code: "SP26" }, as: Any }
          assert:
            - "trigger[1]: spent_cents == 25000 (exactly one emergency debit on auto-open)"

      - name: fee_covered_close_debits_pool_visit_cost
        claim_type: side_effect_execution
        grounds: [state_machines.Encounter, entities.HealthFeePool.fields.spent_cents]
        distinguishing_aspect: "Closing a fee-covered urgent encounter (ENROLLED student) debits the OPEN pool exactly 12000 cents and issues no invoice."
        test_recipe:
          setup: ["clock 2026-05-01; OPEN pool budget 100000; ENROLLED student; urgent encounter open"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 100000, term_end_date: "2026-08-31" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S46", full_name: "Pool Visit" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr T", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/close", payload: {}, as: Clinician }
            - { call: "GET /shc/health-fee-pools", payload: { term_code: "SP26" }, as: Any }
          assert:
            - "trigger[0]: HTTP 200, Encounter.${enc}.status == CLOSED, fee_covered == true"
            - "trigger[1]: spent_cents == 12000 (VISIT_SUBSIDY_CENTS)"

  # ==================================================================
  # Section: endpoints (Table 5 claims)
  # ==================================================================
  - section: endpoints
    instances:
      - name: appointment_list_envelope_and_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id, response_type array, and pagination fields with default limit 10 / offset 0."
        test_recipe:
          setup: ["clock 2026-05-01; one booked appointment"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S50", full_name: "Envelope" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr U", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff }
          trigger:
            - { call: "GET /shc/appointments", payload: {}, as: Any }
          assert:
            - "trigger[0]: meta.api_request_id and meta.api_request_timestamp present; response_type == 'array'"
            - "trigger[0]: total_count == 1, limit == 10, offset == 0, has_more == false (pagination defaults)"

      - name: fk_reverse_reachability_student_policies
        claim_type: cross_reference_link
        grounds: [entities.InsurancePolicy.fields.student_id]
        distinguishing_aspect: "The sub-resource GET returns exactly the policies created for that student, in array form (length 1 here)."
        test_recipe:
          setup: ["clock 2026-05-01; student with one EXTERNAL policy"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S51", full_name: "Reverse FK" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "RF-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
          trigger:
            - { call: "GET /shc/students/${stu}/insurance-policies", payload: {}, as: Any }
          assert:
            - "trigger[0]: array of length 1; [0].id == ${pol} and [0].student_id == ${stu}"

  # ==================================================================
  # Section: rbac (Table 7 claims)
  # ==================================================================
  - section: rbac
    instances:
      - name: student_booking_for_other_forbidden
        claim_type: ownership_scope
        grounds: [roles.Student, "validations[priority=2]"]
        distinguishing_aspect: "A Student may book for themself (student_id == X-User-ID) but booking for another student is 403."
        test_recipe:
          setup: ["clock 2026-05-01; students A and B; provider"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S60", full_name: "Self A" }, as: HealthAdmin, captures: { sa: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S61", full_name: "Other B" }, as: HealthAdmin, captures: { sb: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr V", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${sa}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Student, as_user_id: "${sa}", captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${sb}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Student, as_user_id: "${sa}", captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 201, Appointment.${appt}.status == BOOKED (self-booking allowed)"
            - "trigger[1]: HTTP 403, error_id == ERR_FORBIDDEN (X-User-ID != payload student_id)"

      - name: pharmacist_cannot_close_encounter_forbidden
        claim_type: role_denial
        grounds: [roles.Pharmacist, roles.Clinician, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Encounter close is exclusive to Clinician; Pharmacist gets 403 even with a valid payload on a closable encounter."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; fee-covered urgent encounter open"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S62", full_name: "Role Deny" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr W", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/close", payload: {}, as: Pharmacist, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 403, error_id == ERR_FORBIDDEN"

      - name: frontdesk_cannot_verify_policy_forbidden
        claim_type: role_denial
        grounds: [roles.FrontDeskStaff, roles.BillingOfficer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Insurance verification is exclusive to BillingOfficer; FrontDeskStaff is denied 403."
        test_recipe:
          setup: ["clock 2026-05-01; student with one UNVERIFIED EXTERNAL policy"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S63", full_name: "Verify Deny" }, as: HealthAdmin, captures: { stu: $.data.id, stu_v: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "VD-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${stu_v}" }, as: BillingOfficer, captures: { pol: $.data.id } }
          trigger:
            - { call: "POST /shc/insurance-policies/${pol}/verify", payload: {}, as: FrontDeskStaff, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 403, error_id == ERR_FORBIDDEN"

  # ==================================================================
  # Section: cross_cutting_layers (complexity layer claims)
  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_student_version_on_policy_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[insurance-policy-create-supersede]", "errors[ERR_STALE_STUDENT_VERSION]"]
        distinguishing_aspect: "Two strictly sequential policy creates: the second, carrying the version observed before the first create (which superseded the prior policy and bumped Student.version), is rejected 412; retrying with the fresh version succeeds and supersedes."
        test_recipe:
          setup: ["clock 2026-05-01; student at version 1"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S70", full_name: "Occ Stu" }, as: HealthAdmin, captures: { stu: $.data.id, sv1: $.data.version } }
          trigger:
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "EXTERNAL", policy_number: "OC-1", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 100, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sv1}" }, as: BillingOfficer, captures: { pa: $.data.id } }
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any, captures: { sv2: $.data.version } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "STUDENT_PLAN", policy_number: "OC-2", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sv1}" }, as: BillingOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /shc/insurance-policies", payload: { student_id: "${stu}", payer_type: "STUDENT_PLAN", policy_number: "OC-2", coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2027-03-31T00:00:00Z", copay_cents: 0, deductible_cents: 0, coinsurance_pct: 0.0, expected_student_version: "${sv2}" }, as: BillingOfficer, captures: { pb: $.data.id } }
            - { call: "GET /shc/students/${stu}/insurance-policies", payload: {}, as: Any }
          assert:
            - "trigger[1]: Student.version == 2 (policy create bumped it)"
            - "trigger[2]: HTTP 412, error_id == ERR_STALE_STUDENT_VERSION (stale ${sv1})"
            - "trigger[3]: HTTP 201 with fresh version; trigger[4]: policy ${pa} status == SUPERSEDED, policy ${pb} status == UNVERIFIED"

      - name: occ_stale_record_version_on_dose_entry
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dose-recording-stale-record]", "errors[ERR_STALE_RECORD_VERSION]"]
        distinguishing_aspect: "Dose entry with the pre-dose record version is rejected 412; the version observed after the first dose succeeds."
        test_recipe:
          setup: ["clock 2026-05-01; MMR requirement (2 doses, 28-day interval, deadline 2026-08-01); student with PENDING record version 1"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-08-01", grace_period_days: 0 }, as: HealthAdmin, captures: { req: $.data.id } }
            - { call: "POST /shc/students", payload: { external_ref: "S71", full_name: "Occ Rec" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/immunization-records", payload: { student_id: "${stu}", requirement_id: "${req}" }, as: Nurse, captures: { rec: $.data.id, rv1: $.data.version } }
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-04-01", expected_record_version: "${rv1}" }, as: Nurse, captures: { rv2: $.data.version } }
          trigger:
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-05-01", expected_record_version: "${rv1}" }, as: Nurse, captures: { err: $.data.error_id } }
            - { call: "POST /shc/immunization-records/${rec}/doses", payload: { dose_date: "2026-05-01", expected_record_version: "${rv2}" }, as: Nurse }
          assert:
            - "setup_api_calls[4]: doses_received == 1, record version == 2"
            - "trigger[0]: HTTP 412, error_id == ERR_STALE_RECORD_VERSION (dose date itself is valid: 2026-05-01 >= 2026-04-29 interval and not future)"
            - "trigger[1]: HTTP 200, status == IN_COMPLIANCE (2 of 2 doses), doses_received == 2"

      - name: duplicate_configuration_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_REQUIREMENT]", "errors[ERR_DUPLICATE_MEDICATION]", "errors[ERR_DUPLICATE_POOL_TERM]"]
        distinguishing_aspect: "Config uniqueness: vaccine_code, medication_code, and OPEN term_code each reject duplicates with their own 409."
        test_recipe:
          setup: ["clock 2026-05-01; one requirement MMR, one medication DOXY, one OPEN pool SP26"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 2, min_interval_days: 28, deadline_date: "2026-08-01", grace_period_days: 0 }, as: HealthAdmin }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "DOXY", medication_name: "Doxycycline", initial_on_hand: 10, reorder_threshold: 0 }, as: Pharmacist }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 100000, term_end_date: "2026-08-31" }, as: HealthAdmin }
          trigger:
            - { call: "POST /shc/immunization-requirements", payload: { vaccine_code: "MMR", required_doses: 1, min_interval_days: 0, deadline_date: "2026-09-01", grace_period_days: 3 }, as: HealthAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "DOXY", medication_name: "Doxy Again", initial_on_hand: 5, reorder_threshold: 1 }, as: Pharmacist, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/health-fee-pools", payload: { term_code: "SP26", budget_cents: 50000, term_end_date: "2026-08-31" }, as: HealthAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_DUPLICATE_REQUIREMENT"
            - "trigger[1]: HTTP 409, error_id == ERR_DUPLICATE_MEDICATION"
            - "trigger[2]: HTTP 409, error_id == ERR_DUPLICATE_POOL_TERM"

  # ==================================================================
  # Section: consistency_model (immediate)
  # ==================================================================
  - section: consistency_model
    instances:
      - name: payment_immediately_visible_on_invoice_read
        claim_type: immediate
        grounds: [calculations.invoice_balance_and_status]
        distinguishing_aspect: "Immediate consistency: the GET following a payment reflects the reduced balance and PARTIALLY_PAID status without any delay or refresh call."
        test_recipe:
          setup: ["clock 2026-05-01; student (self-pay); SPORTS_PHYSICAL encounter; invoice 5000 ISSUED"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S80", full_name: "Immediate" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr X", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
          trigger:
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 2000, method: "CASH" }, as: BillingOfficer }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
          assert:
            - "trigger[1]: balance_cents == 3000 and status == PARTIALLY_PAID immediately after the payment response"

  # ==================================================================
  # Excluded stubs — corners already exercised by §1.8 difficulty probes
  # ==================================================================
  - section: validations
    instances:
      - name: error_slot_conflict_on_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / appointment_half_open_intervals_allow_adjacency
          rationale: "Asserted as the failure path (trigger[0]) of the named §1.8 instance."
      - name: error_compliance_hold_blocks_elective_booking
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPLIANCE_HOLD_ACTIVE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / booking_hold_safety_beats_slot_temporal
          rationale: "Asserted as the winning error of the named §1.8 instance."
      - name: error_clearance_blocked_on_close
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLEARANCE_BLOCKED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / clearance_gated_by_student_posture
          rationale: "Asserted as the failure path (trigger[0]) of the named §1.8 instance."
      - name: error_no_oncall_coverage_for_after_hours_referral
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ONCALL_COVERAGE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / after_hours_referral_gated_by_oncall_shift
          rationale: "Asserted as the failure path (trigger[0]) of the named §1.8 instance."
      - name: error_oncall_overlap_and_rest_violation
        claim_type: violation_to_error
        grounds: ["errors[ERR_ONCALL_OVERLAP]", "errors[ERR_ONCALL_REST_VIOLATION]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / oncall_closed_interval_and_rest_buffer
          rationale: "Both errors asserted (trigger[0..2]) in the named §1.8 instance."
      - name: error_prescription_not_dispensable
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRESCRIPTION_NOT_DISPENSABLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dispense_state_beats_stock_fiscal
          rationale: "Asserted as the winning error of the named §1.8 instance."
  - section: calculations
    instances:
      - name: outbreak_threshold_auto_open_at_three
        claim_type: constants_applied
        grounds: [calculations.outbreak_case_count]
        excluded_because:
          difficulty_instance: boundary_precision_check / outbreak_third_case_is_the_boundary
          rationale: "Threshold boundary (2 vs 3) asserted by the named §1.8 instance."
      - name: payer_split_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.invoice_payer_split]
        excluded_because:
          difficulty_instance: dual_variant_calc / billing_provisional_vs_final_payer_split
          rationale: "Provisional (10000) vs final (8000) divergence asserted by the named §1.8 instance."
