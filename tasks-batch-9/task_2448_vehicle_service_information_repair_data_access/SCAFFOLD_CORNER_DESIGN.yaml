            - "first validate: distribution_status == WITHHELD (the availability axis did not move)"
            - "second validate: HTTP status == 409 and response.data.error_id == ERR_INVALID_STATE"
            - "PublicationVersion.${pv1_id}.validated_by_user_id == cp_1 (not cp_9)"
