  - section: errors
    instances:
      - name: unknown_ids_across_entity_families_return_not_found_codes
        claim_type: error_triggerable
        grounds: ["errors[ERR_LOT_NOT_FOUND]", "errors[ERR_GRADE_RUN_NOT_FOUND]", "errors[ERR_PREFINISH_RUN_NOT_FOUND]", "errors[ERR_BATCH_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Five sibling 404 codes are distinct per family rather than a single generic not-found, and each is raised from its own GET path with no other row in the database."
        test_recipe:
          setup: ["An empty database beyond the logical clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "GET /mill/flooring-lots/00000000-0000-0000-0000-0000000010a1", payload: {}, as: MillSupervisor }
            - { call: "GET /mill/grade-runs/00000000-0000-0000-0000-000000009244", payload: {}, as: GradeInspector }
            - { call: "GET /mill/prefinish-runs/00000000-0000-0000-0000-0000000009f0", payload: {}, as: PrefinishScheduler }
            - { call: "GET /mill/byproduct-batches/00000000-0000-0000-0000-0000000ba7c4", payload: {}, as: ByproductBroker }
            - { call: "GET /mill/warranty-claims/00000000-0000-0000-0000-00000000c1a1", payload: {}, as: WarrantyAdjudicator }
          assert:
            - "Lot read: status 404 with data.error_id == \"ERR_LOT_NOT_FOUND\"."
            - "Grade run read: status 404 with data.error_id == \"ERR_GRADE_RUN_NOT_FOUND\"."
            - "Prefinish run read: status 404 with data.error_id == \"ERR_PREFINISH_RUN_NOT_FOUND\"."
            - "Byproduct batch read: status 404 with data.error_id == \"ERR_BATCH_NOT_FOUND\"."
            - "Warranty claim read: status 404 with data.error_id == \"ERR_CLAIM_NOT_FOUND\"."
            - "Every response carries meta.api_request_id and response_type \"error\"."

      - name: core_stock_reservation_above_available_square_feet_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_CORE_STOCK_INSUFFICIENT]", "validations[priority 41]", "calculations.core_reservation"]
        distinguishing_aspect: "The check is against the 1.10 sq ft per board foot reservation, not the raw board feet: 1000 bf needs 1100.00 sq ft and is refused by a 1000.00 sq ft stock, while 900 bf needing 990.00 sq ft fits."
        test_recipe:
          setup: ["A RELEASED RED_OAK charge, an ENGINEERED product line and a core stock holding only 1000.00 available square feet."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "ENG-RO-500", species_profile_id: "${species_id}", construction_type: "ENGINEERED", nominal_width_in: 5.000, nominal_thickness_in: 0.500, material_value_cents_per_sf: 720, warranty_funded_total_cents: 400000 }, as: MillAdmin, captures: { eng_line: "$.data.id" } }
            - { call: "POST /mill/core-stocks", payload: { product_line_id: "${eng_line}", core_material: "HDF", lot_reference: "HDF-2026-08", available_square_feet: 1000.00 }, as: MillAdmin, captures: { core_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${eng_line}", kiln_charge_id: "${charge_a}", core_stock_id: "${core_id}", input_dry_bf: 1000 }, as: MillSupervisor }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${eng_line}", kiln_charge_id: "${charge_a}", core_stock_id: "${core_id}", input_dry_bf: 900 }, as: MillSupervisor }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${eng_line}", kiln_charge_id: "${charge_a}", core_stock_id: "${core_id}", input_dry_bf: 10 }, as: MillSupervisor }
          assert:
            - "1000 bf: status 422 with data.error_id == \"ERR_CORE_STOCK_INSUFFICIENT\" (1100.00 > 1000.00)."
            - "GET /mill/core-stocks/{core_id} after the rejection shows reserved_square_feet == 0.00 and GET /mill/kiln-charges/{charge_a} shows remaining_dry_bf == 8972.50."
            - "900 bf: status 201 with data.reserved_core_sf == 990.00; the core stock now shows reserved_square_feet == 990.00."
            - "10 bf: status 422 with data.error_id == \"ERR_CORE_STOCK_INSUFFICIENT\" (990.00 + 11.00 = 1001.00 > 1000.00) - the ceiling is on the running reserved total, not per lot."

