            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Second narrowing", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-07T00:00:00Z", expected_request_version: "${req_v2}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_v3: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Third narrowing", requested_date_from: "2026-07-01T00:00:00Z", requested_date_to: "2026-07-02T00:00:00Z", expected_request_version: "${req_v3}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_limit: $.data.error_id } }
          assert:
