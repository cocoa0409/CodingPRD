        as: TravelDesk
        as_user_id: td-01
        captures:
          ra_id: $.data.id
      - call: POST /registrations/${ra_id}/respond
        payload:
          response: ACCEPT
        as: Participant
        as_user_id: ${qa_id}
      trigger:
      - 'POST /programs/${p_id}/advance {"to_status": "ONSITE"} as SourcingManager sm-01; POST /programs/${p_id}/notify-qualifiers
        as TravelDesk td-01; POST /programs/${p_id}/gross-up-policy {"gross_up_policy": "NO_GROSS_UP"}
        as TaxComplianceOfficer tc-01; POST /programs/${p_id}/cancel as TravelDesk td-01; POST /award-tiers
        (a well-formed BRONZE body) as SalesOpsAnalyst so-01.'
      - 'POST /destinations (a well-formed body) as ProgramDirector pd-01; POST /destinations/${d2_id}/shortlist
        as ContractApprover ca-01; POST /supplier-contracts (a well-formed body) as ContractApprover ca-01;
        POST /supplier-contracts/${c1_id}/withdraw {"withdrawal_reason": "x"} as ContractApprover ca-01;
        POST /deposit-milestones (a well-formed body) as ContractApprover ca-01.'
      - 'POST /supplier-contracts/${c1_id}/execute as SourcingManager sm-01; POST /deposit-milestones/${m2_id}/pay
        as SourcingManager sm-01; POST /supplier-contracts/${c1_id}/negotiate {"action": "PROPOSE"} as
        TaxComplianceOfficer tc-01.'
      - POST /qualifiers (a well-formed body) as ProgramDirector pd-01; POST /qualifiers/${qb_id}/review
        as ProgramDirector pd-01.
      - 'POST /registrations/${ra_id}/confirm as Participant ${qa_id}; POST /registrations/${ra_id}/air
        {"action": "REQUEST", "cabin_class": "BUSINESS"} as Participant ${qa_id}; POST /registrations/${ra_id}/respond
        {"response": "DECLINE"} as TravelDesk td-01; POST /onsite-activities (a well-formed body) as ProgramDirector
        pd-01.'
      - 'POST /tax-award-reports {"qualifier_id": "${qa_id}", "tax_year": 2026} as ProgramDirector pd-01;
        GET /tax-award-reports as SalesOpsAnalyst so-01; GET /programs/${p_id}/measurement as TravelDesk
        td-01; GET /supplier-contracts/${c1_id} as Participant ${qa_id}.'
      - POST /supplier-contracts/00000000-0000-0000-0000-000000009999/execute as SourcingManager sm-01;
        POST /deposit-milestones/${m1_id}/pay with a body missing nothing but sent as SourcingManager
        sm-01; POST /award-tiers with a body missing tier_rank as SalesOpsAnalyst so-01.
      assert:
      - Every probe in the first six groups returns ERR_ROLE_NOT_PERMITTED with HTTP 403 — twenty-two
        refusals covering at least one exclusive operation of each of the seven roles, plus three reads
        whose roles list excludes the caller.
      - 'The refusals are total: GET /programs/${p_id} afterwards shows version, status "REGISTRATION_OPEN",
        gross_up_policy "FULL_GROSS_UP" and committed_budget_cents 1443174 all unchanged, no new AwardTier,
        Destination, SupplierContract, DepositMilestone, Qualifier, OnsiteActivity or TaxAwardReport row
        exists, and ${ra_id} is still "ACCEPTED" with air_status "NOT_REQUESTED".'
      - 'POST /supplier-contracts/00000000-0000-0000-0000-000000009999/execute as SourcingManager returns
        ERR_ROLE_NOT_PERMITTED (403), NOT ERR_CONTRACT_NOT_FOUND (404): priority 3 precedes priority 5,
        so a forbidden caller learns nothing about which ids exist.'
      - POST /deposit-milestones/${m1_id}/pay as SourcingManager returns ERR_ROLE_NOT_PERMITTED (403)
        even though the same call by ContractApprover would also have to satisfy the contract-EXECUTED
        cross-entity gate — the role check answers first.
      - 'POST /award-tiers missing tier_rank as SalesOpsAnalyst returns ERR_ROLE_NOT_PERMITTED (403),
        NOT ERR_INVALID_REQUEST (400): priority 3 precedes priority 7, so the body is never even parsed
        for a caller who is not allowed in.'
      - Every 403 body carries error_id "ERR_ROLE_NOT_PERMITTED" and the standard error envelope; no refusal
        returns ERR_INVALID_ROLE, because in every probe the supplied role is one of the seven declared
        in §1.7.
  - name: participant_identity_is_entity_backed_so_one_qualifier_cannot_touch_another
    claim_type: forbidden_operations
    grounds:
    - §1.7 Participant identity entity_backed:Qualifier
    - §1.4 priority 6 ERR_NOT_RESOURCE_OWNER
    - §1.6 ERR_NOT_RESOURCE_OWNER (403)
    - §1.2 Registration INVITED -> ACCEPTED precondition X-User-ID == Registration.qualifier_id
    distinguishing_aspect: |
      Six of the seven roles in §1.7 have opaque identity, where X-User-ID is only ever recorded as provenance; Participant is the single role whose X-User-ID is a foreign key into Qualifier and therefore changes what the caller may reach. This instance is the only one that probes that second dimension of authorisation: the role passes the priority 3 check and then fails the priority 6 ownership check. It is deliberately paired with the two neighbours in the ladder — existence at 5 still wins, and state at 11 still loses — because getting either ordering wrong turns a 403 into an information leak or into a misleading 409.
