  side_effects: []
- method: GET
  path: /ops/patrol-rounds
  description: List patrol rounds
  roles: *id001
  code: 200
  input:
  - facility_id?
  - patrol_status?
  output: PatrolRound[]
  side_effects: []
- method: POST
  path: /ops/patrol-rounds/{patrol_round_id}/complete
  description: Complete a patrol with checkpoint and lighting-outage counts
  roles:
  - SecurityOfficer
  code: 200
  input:
  - checkpoints_completed
  - lighting_outages_found?
  output: PatrolRound
  side_effects:
  - patrol_status -> COMPLETED
  - completed_at set
- method: POST
  path: /ops/incidents
  description: File an incident report
  roles:
  - SecurityOfficer
  - ParkingAttendant
  - RevenueAuditor
  code: 201
  input:
  - facility_id
  - incident_type
  - severity
  - description
  - patrol_round_id?
  - reconciliation_id?
  output: IncidentReport
  side_effects:
  - incident_status=OPEN
  - auto_created=false
- method: GET
  path: /ops/incidents/{incident_id}
  description: Get incident
  roles: *id001
  code: 200
  input: []
  output: IncidentReport
  side_effects: []
- method: GET
  path: /ops/incidents
  description: List incidents
  roles: *id001
  code: 200
  input:
  - facility_id?
  - incident_status?
  - severity?
  - patrol_round_id?
  - reconciliation_id?
  - duplicate_of_incident_id?
  output: IncidentReport[]
  side_effects: []
- method: POST
  path: /ops/incidents/{incident_id}/investigate
  description: Open an investigation
  roles:
  - SecurityOfficer
  - RevenueAuditor
  code: 200
  input: []
  output: IncidentReport
  side_effects:
  - incident_status -> INVESTIGATING
- method: POST
  path: /ops/incidents/{incident_id}/resolve
  description: Resolve an investigated incident
  roles:
  - SecurityOfficer
  - RevenueAuditor
  code: 200
  input:
  - resolution_note
  output: IncidentReport
  side_effects:
  - incident_status -> RESOLVED
- method: POST
  path: /ops/incidents/{incident_id}/close
  description: Close an OPEN or RESOLVED incident
  roles:
  - SecurityOfficer
  - RevenueAuditor
  - FacilityManager
  code: 200
  input: []
  output: IncidentReport
  side_effects:
  - incident_status -> CLOSED
- method: POST
  path: /ops/incidents/{incident_id}/mark-duplicate
  description: Mark this incident a duplicate of another; closes it
  roles:
  - SecurityOfficer
  code: 200
  input:
  - duplicate_of_incident_id
  output: IncidentReport
  side_effects:
  - duplicate_of_incident_id set
  - incident_status -> CLOSED
- method: POST
  path: /ops/ev-chargers
  description: Propose an EV charger
  roles:
  - MaintenanceSupervisor
  code: 201
  input:
  - facility_id
  - charger_label
  - max_kw
  output: EVCharger
  side_effects:
  - charger_status=PROPOSED
- method: GET
  path: /ops/ev-chargers/{ev_charger_id}
  description: Get charger
  roles: *id001
  code: 200
  input: []
  output: EVCharger
  side_effects: []
- method: GET
  path: /ops/ev-chargers
  description: List chargers
  roles: *id001
  code: 200
  input:
  - facility_id?
  - charger_status?
  output: EVCharger[]
  side_effects: []
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/permit
  description: Record electrical permit
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> PERMITTED
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/install
  description: Record physical installation
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> INSTALLED
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/commission
  description: Energize and commission
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> COMMISSIONED
  - commissioned_at set on first commissioning
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/take-out-of-service
  description: Take a commissioned charger out of service
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> OUT_OF_SERVICE
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/return-to-service
  description: Return an out-of-service charger to service
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> COMMISSIONED
- method: POST
  path: /ops/ev-chargers/{ev_charger_id}/decommission
  description: Decommission a charger (not from COMMISSIONED; take it out of service first)
  roles:
  - MaintenanceSupervisor
  code: 200
  input: []
  output: EVCharger
  side_effects:
  - charger_status -> DECOMMISSIONED
- method: POST
  path: /ops/charging-sessions
  description: Start a charging session on a COMMISSIONED charger with no active session
  roles:
  - MonthlyParker
  - ParkingAttendant
  - MaintenanceSupervisor
  code: 201
  input:
  - charger_id
  - agreement_id?
  output: ChargingSession
  side_effects:
  - session_status=CHARGING
  - started_at set
- method: GET
  path: /ops/charging-sessions/{charging_session_id}
  description: Get charging session
  roles: *id001
  code: 200
  input: []
  output: ChargingSession
  side_effects: []
- method: GET
  path: /ops/charging-sessions
  description: List charging sessions
  roles: *id001
  code: 200
  input:
  - charger_id?
  - agreement_id?
  - session_status?
  output: ChargingSession[]
  side_effects: []
- method: POST
  path: /ops/charging-sessions/{charging_session_id}/complete
  description: Complete a charge with delivered energy
  roles:
  - MonthlyParker
  - ParkingAttendant
  - MaintenanceSupervisor
  code: 200
  input:
  - kwh_delivered
  - idle_minutes?
  output: ChargingSession
  side_effects:
  - session_status -> COMPLETED
  - ended_at set
- method: POST
  path: /ops/charging-sessions/{charging_session_id}/fault
  description: Fault a charging session; cascades the charger OUT_OF_SERVICE
  roles:
  - ParkingAttendant
  - MaintenanceSupervisor
  code: 200
  input:
  - fault_description
  output: ChargingSession
  side_effects:
  - session_status -> FAULTED
  - ended_at set
  - charger -> OUT_OF_SERVICE
- method: POST
  path: /ops/event-bookings
  description: Request an event parking booking
  roles:
  - FacilityManager
  code: 201
  input:
  - facility_id
  - event_name
  - start_at
  - end_at
  - presale_allocation
  - min_staff
  - deposit_cents?
  - cancellation_policy?
  output: EventBooking
  side_effects:
  - booking_status=REQUESTED
- method: GET
  path: /ops/event-bookings/{event_booking_id}
  description: Get event booking
  roles: *id001
  code: 200
  input: []
  output: EventBooking
  side_effects: []
- method: GET
  path: /ops/event-bookings
  description: List event bookings
  roles: *id001
  code: 200
  input:
  - facility_id?
  - booking_status?
  output: EventBooking[]
  side_effects: []
- method: POST
  path: /ops/event-bookings/{event_booking_id}/confirm
  description: Confirm with staffing roster; enforces pool aggregate capacity
  roles:
  - FacilityManager
  code: 200
  input:
  - staffing_assignments
  output: EventBooking
  side_effects:
  - booking_status -> CONFIRMED
  - staffing_assignments recorded
- method: POST
  path: /ops/event-bookings/{event_booking_id}/activate
  description: Activate within the event window; cascades posture EVENT_SURGE and device EVENT mode
  roles:
  - FacilityManager
  code: 200
  input: []
  output: EventBooking
  side_effects:
  - booking_status -> ACTIVE
  - Facility posture cascade per §1.2 (2-link chain)
- method: POST
  path: /ops/event-bookings/{event_booking_id}/complete
  description: Complete the event; posture reverses when it is the last ACTIVE event
  roles:
  - FacilityManager
  code: 200
  input: []
  output: EventBooking
  side_effects:
  - booking_status -> COMPLETED
  - conditional posture/device reversal cascade
- method: POST
  path: /ops/event-bookings/{event_booking_id}/cancel
  description: Cancel a REQUESTED or CONFIRMED event; fee per cancellation policy
  roles:
  - FacilityManager
  code: 200
  input:
  - reason
  output: EventBooking
  side_effects:
  - booking_status -> CANCELLED
  - cancellation_fee_cents/deposit_refund_cents per event_cancellation_fee
errors:
- id: ERR_MISSING_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing, or role not declared
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: Caller role not in the endpoint's roles list
- id: ERR_DEVICE_IDENTITY_MISMATCH
  http: 403
  condition: GateDevice X-User-ID does not equal the device id acted upon (heartbeat/fault) or the entry_device_id posted (entry)
- id: ERR_NOT_OWNER
  http: 403
  condition: Entity-backed caller does not own the resource (parker vs agreement, attendant vs shift)
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Reconciliation submit/approve attempted by the same X-User-ID as the shift's attendant_user_id
- id: ERR_NOT_FOUND
  http: 404
  condition: Path resource id does not exist (validated left-to-right)
- id: ERR_REFERENCE_NOT_FOUND
  http: 404
  condition: Body reference id does not exist or (mark-duplicate) target is CLOSED/self
- id: ERR_VALIDATION
  http: 400
  condition: Missing required field, invalid enum value, or numeric range violation
- id: ERR_STALE_FACILITY_VERSION
  http: 412
  condition: expected_facility_version behind current Facility.version on publish
- id: ERR_STALE_AGREEMENT_VERSION
  http: 412
  condition: expected_agreement_version behind current MonthlyAgreement.version on amend
- id: ERR_INVALID_STATE_TRANSITION
  http: 409
  condition: Current state does not permit the requested transition; includes second close-of-business for the same date
- id: ERR_FACILITY_POSTURE_BLOCKS
  http: 409
  condition: Facility posture blocks the action (transient entry outside NORMAL/EVENT_SURGE, credentialed entry in CLOSED_TEMPORARY/DECOMMISSIONED, agreement/event actions while closed)
- id: ERR_POSTURE_TRANSITION_BLOCKED
  http: 409
  condition: Manual posture target illegal (EVENT_SURGE manual, decommission with open workload, release with open CRITICAL incidents)
- id: ERR_STRUCTURAL_CRITICAL
  http: 409
  condition: Posture release blocked by a REPORTED CRITICAL structural inspection
- id: ERR_DEVICE_NOT_ONLINE
  http: 409
  condition: Entry/exit device not ONLINE or not of this facility
- id: ERR_NO_PUBLISHED_RATE
  http: 409
  condition: No PUBLISHED rate schedule with effective_from <= logical now for the facility
- id: ERR_SHIFT_NOT_OPEN
  http: 409
  condition: CASH pay/comp requires an OPEN shift at this facility owned by the caller
- id: ERR_SHIFT_ALREADY_OPEN
  http: 409
  condition: Attendant already has an OPEN shift at this facility
- id: ERR_EXIT_UNPAID
  http: 409
  condition: Exit attempted with billing OPEN/QUOTED and a positive computed fee
- id: ERR_DUPLICATE_TICKET
  http: 409
  condition: ticket_barcode already in use by a PARKED session of this facility
- id: ERR_CREDENTIAL_NOT_VALID
  http: 409
  condition: Credential not ACTIVE or its agreement not ACTIVE at credentialed entry
- id: ERR_CREDENTIAL_LIMIT
  http: 409
  condition: Agreement already has 2 credentials in {ACTIVE, LOST_REPORTED}
- id: ERR_AGREEMENT_NOT_ISSUABLE
  http: 409
  condition: Credential issuance requires agreement APPROVED or ACTIVE
- id: ERR_CREDENTIALS_OUTSTANDING
  http: 409
  condition: 'Terminate blocked: credentials still ACTIVE or LOST_REPORTED'
- id: ERR_CHARGER_UNAVAILABLE
  http: 409
  condition: Charger not COMMISSIONED, already has a CHARGING session, or supplied agreement not ACTIVE
- id: ERR_STAFFING_INSUFFICIENT
  http: 409
  condition: len(staffing_assignments) < min_staff at event confirm
- id: ERR_SAFETY_HOLD
  http: 409
  condition: Window on a level with a REPORTED CRITICAL inspection without safety_authorized=true
- id: ERR_INVALID_TIME_RANGE
  http: 400
  condition: end_at <= start_at, or event activation outside [start_at, end_at)
- id: ERR_WINDOW_OVERLAP
  http: 409
  condition: Window collides with another SCHEDULED/IN_PROGRESS window on the same facility+level under the 30-minute buffer rule
- id: ERR_EVENT_POOL_EXCEEDED
  http: 409
  condition: Combined presale_allocation of overlapping CONFIRMED/ACTIVE events would exceed event_pool_spaces
- id: ERR_MONTHLY_POOL_EXHAUSTED
  http: 409
  condition: Activation while count(ACTIVE+SUSPENDED) == monthly_capacity
- id: ERR_COMP_LIMIT_EXCEEDED
  http: 422
  condition: Shift comp_total_cents + waived fee would exceed COMP_CAP_PER_SHIFT_CENTS (5000)
- id: ERR_REFUND_EXCEEDS_COLLECTED
  http: 422
  condition: refund amount_cents > settled_fee_cents
- id: ERR_INSUFFICIENT_RESERVE
  http: 422
  condition: Repair draw exceeds Facility.capital_reserve_cents
- id: ERR_VARIANCE_INCIDENT_REQUIRED
  http: 409
  condition: Approve from VARIANCE_REVIEW without a valid linked INVESTIGATING CASH_VARIANCE incident_id
- id: ERR_INSPECTION_NOT_REPORTED
  http: 409
  condition: Repair funding references an inspection not yet REPORTED
roles:
- name: FacilityManager
  description: 'General manager: rates, posture, agreements oversight, capital funding, events, close-of-business'
  identity: opaque
  exclusive_operations:
  - POST /ops/facilities, POST /ops/facilities/{id}/transition-posture, POST /ops/facilities/{id}/close-of-business
  - POST /ops/rate-schedules, POST /ops/rate-schedules/{id}/publish, POST /ops/rate-schedules/{id}/retire
  - POST /ops/access-devices, POST /ops/access-devices/{id}/decommission
  - POST /ops/monthly-agreements/{id}/suspend, /resume, /amend
  - POST /ops/repair-projects/{id}/fund, /defer, /cancel
  - POST /ops/event-bookings and all event-bookings actions
  - POST /ops/_clock/set_current_utc
  shared_operations:
  - POST /ops/parker-accounts (with ParkingAttendant)
  - POST /ops/monthly-agreements (with ParkingAttendant), /activate (with ParkingAttendant), /terminate (with ParkingAttendant), /withdraw (with ParkingAttendant, MonthlyParker)
  - POST /ops/credentials/{id}/revoke (with ParkingAttendant)
  - POST /ops/access-devices/{id}/report-fault (with GateDevice)
  - POST /ops/incidents/{id}/close (with SecurityOfficer, RevenueAuditor)
  - All GET endpoints (with all roles)
- name: ParkingAttendant
  description: 'Front-line cashier/operator: shifts, settlements, comps, credential desk, lost tickets'
  identity: opaque
  exclusive_operations:
  - POST /ops/shifts, POST /ops/shifts/{id}/close
  - POST /ops/parking-sessions/{id}/pay, /comp, /lost-ticket
  - POST /ops/credentials, /report-found (shared), /replace, /return
  shared_operations:
  - POST /ops/parker-accounts, POST /ops/monthly-agreements, /activate, /terminate, /withdraw (see FacilityManager)
  - POST /ops/credentials/{id}/report-lost (with MonthlyParker owner), /revoke (with FacilityManager)
  - POST /ops/parking-sessions/{id}/quote (with GateDevice)
  - POST /ops/incidents (with SecurityOfficer, RevenueAuditor)
  - POST /ops/charging-sessions, /complete (with MonthlyParker, MaintenanceSupervisor), /fault (with MaintenanceSupervisor)
  - All GET endpoints
- name: RevenueAuditor
  description: Revenue reconciliation and theft control; MUST NOT be the same X-User-ID as the shift attendant (segregation of duties)
  identity: opaque
  exclusive_operations:
  - POST /ops/reconciliations, /submit, /approve
  - POST /ops/parking-sessions/{id}/refund
  shared_operations:
  - POST /ops/incidents, /investigate, /resolve, /close (with SecurityOfficer / FacilityManager)
  - All GET endpoints
- name: MaintenanceSupervisor
  description: Structural inspections, capital repair execution, maintenance windows, EV charger lifecycle
  identity: opaque
  exclusive_operations:
  - POST /ops/inspections and all inspection actions
  - POST /ops/repair-projects, /schedule, /start, /close-out, /revise
  - POST /ops/maintenance-windows and all window actions
  - POST /ops/ev-chargers and all charger lifecycle actions
  shared_operations:
  - POST /ops/charging-sessions, /complete, /fault (see ParkingAttendant)
  - All GET endpoints
- name: SecurityOfficer
  description: Patrols and incident reporting
  identity: opaque
  exclusive_operations:
  - POST /ops/patrol-rounds, /complete
  - POST /ops/incidents/{id}/mark-duplicate
  shared_operations:
  - POST /ops/incidents, /investigate, /resolve, /close
  - All GET endpoints
- name: GateDevice
  description: 'An AccessDevice acting on itself: heartbeats, faults, entries, exits. X-User-ID equals the device id.'
  identity: entity_backed:AccessDevice
  exclusive_operations:
  - POST /ops/access-devices/{id}/heartbeat
  - POST /ops/parking-sessions (entry), POST /ops/parking-sessions/{id}/exit
  shared_operations:
  - POST /ops/access-devices/{id}/report-fault (with FacilityManager)
  - POST /ops/parking-sessions/{id}/quote (with ParkingAttendant)
  - All GET endpoints
- name: MonthlyParker
  description: 'A ParkerAccount holder: self-service credential loss reporting, waitlist withdrawal, EV charging'
  identity: entity_backed:ParkerAccount
  exclusive_operations: []
  shared_operations:
  - POST /ops/credentials/{id}/report-lost, /report-found (owner only; with ParkingAttendant)
  - POST /ops/monthly-agreements/{id}/withdraw (owner only)
  - POST /ops/charging-sessions, /complete (see ParkingAttendant)
  - All GET endpoints
