              as_user_id: "u_na_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/city-ledger-sweep as NightAuditor (X-User-ID u_na_1)."
          assert:
            - "The trigger response returns city_ledger_swept_folio_count == 3, city_ledger_transferred_balance_total_amount == 389.44 (210.00 + 77.77 + 101.67) and city_ledger_fee_total_amount == 5.85."
            - "Rounding once over the summed 389.44 would give 5.84; that value must not appear."
            - "GET /night-audit/journal-postings?folio_id=${db2_id}&charge_type=CITY_LEDGER_FEE returns exactly one row with amount == 1.17 (round(77.77 * 0.015, 2)); the same query for ${db1_id} returns 3.15 and for ${db3_id} returns 1.53."
            - "GET /night-audit/folios/${db1_id} returns settlement_status == TRANSFERRED_TO_CITY_LEDGER and balance_amount == 0.00; the same holds for ${db2_id} and ${db3_id}."
            - "GET /night-audit/ledger-accounts/${city_gl_id} returns current_balance_amount == 395.29 (389.44 + 5.85)."
            - "The trigger response returns ledger_control_amount == 0.00 because each folio's two LEDGER_TRANSFER rows are equal and opposite."
            - "Repeating the sweep is a no-op that resets city_ledger_swept_folio_count to 0 and both totals to 0.00, because every candidate folio is now TRANSFERRED_TO_CITY_LEDGER."

      - name: outlet_ticket_threshold_pinned_to_pre_discount_taxable_base
        grounds: "§1.3 calculation outlet_ticket_total (algorithm threshold, constants from HotelProperty.service_charge_pct 18.0, fb_tax_rate_pct 6.25, large_ticket_threshold_amount 472.00, large_party_discount_pct 5.0); §1.5 POST /night-audit/outlet-tickets/{id}/close."
        distinguishing_aspect: >-
          Mode (c) - a formula that looks self-referential but is not. The discount gate is tested
          against taxable_base_amount (which already contains the service charge) while the
          discount itself is a percentage of gross_amount, and neither the service charge nor the
          tax may ever be recomputed on the discounted figure. Differs from the two instances
          above in that no clamp and no rounding-placement question is involved; the trap is the
          asymmetric basis pair.
        test_recipe:
          setup: "Standard property; one ACTIVE FB_OUTLET with requires_shift_settlement false; business date 2026-08-01; three OPEN CASH tickets at gross 400.00, 399.99 and 500.00 opened at 2026-08-01T19:00:00.000Z."
