- section: consistency_model
  instances:
  - name: derived_center_fields_are_visible_in_the_same_request
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - entities.ShoppingCenter.fields.open_occupancy_pct
    - state_machines.Lease.premises_status.OPEN_to_DARK
    - calculations.center_posture_derivation
    distinguishing_aspect: The consistency model is immediate, so the go-dark response itself already carries the new Lease state and a GET of the center in the same test - with no intervening write and
      no retry - already reports 225000 sqft, 75.00 pct and posture BREACH.
    test_recipe:
      setup:
      - 'Center Northgate Crossing (300000 GLA, occupancy_grace_days 30) with five EXECUTED-then-OPEN leases: A1 120000 anchor, A2 100000 anchor, I1 2000 coffee, I2 3000 books, I3 30000 fitness; occupied_gla_sqft
        255000, open_occupancy_pct 85.00, compliance_posture COMPLIANT'
