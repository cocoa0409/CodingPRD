              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "DELAY", incident_at: "2026-06-05T00:00:00Z", delay_hours: 12 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "DELAY", incident_at: "2026-06-05T15:00:00Z", delay_hours: 12 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DELAY_EVENT_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payout_reverse_restores_remaining_aggregate
        grounds:
          - state_machines.Payout.DISBURSED_to_REVERSED
          - state_machines.Payout.PENDING_to_DISBURSED
          - entities.Policy.fields.remaining_aggregate_cents
          - entities.Policy.fields.amount_reimbursed_cents
        distinguishing_aspect: |
          Conserved quantity #1 — coverage capacity. Invariant
          remaining_aggregate_cents == aggregate_limit_cents - sum(DISBURSED Payout.amount_cents)
          must hold before disburse and after the compensating reverse: disbursing 300000
          then reversing it returns remaining_aggregate_cents to its pre-disburse value
          (and amount_reimbursed_cents back to 0).
        test_recipe:
          setup:
            - "Plan aggregate 1200000 (trip_cost 500000, cancellation 100%, medical 500000, delay 100000, baggage 100000). ACTIVE policy; CANCELLATION claim approved 300000 with a DISBURSED payout (remaining = 900000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "INV-1", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t17@x.com", full_name: "T Seventeen", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "CANCELLATION", cancellation_reason: "COVERED_REASON", incident_at: "2026-06-05T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/expenses"
              payload: { category: "PREPAID_TRIP", description: "all", documented_amount_cents: 300000, prepaid_nonrefundable_cents: 300000, supplier_refund_received_cents: 0 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "r1" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /payouts"
              payload: { claim_id: "${claim_id}" }
              as: ClaimsAdjuster
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/disburse"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /payouts/${payout_id}/reverse"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Policy.${pol_id}.amount_reimbursed_cents == 0"
            - "Policy.${pol_id}.remaining_aggregate_cents == 1200000"
            - "remaining_aggregate_cents == aggregate_limit_cents - sum(DISBURSED Payout.amount_cents) holds (1200000 == 1200000 - 0)"

      - name: free_look_refund_conserves_net_premium_collected
        grounds:
          - state_machines.Policy.payment:PENDING_to_payment:PAID
          - state_machines.Policy.payment:PAID_to_payment:REFUNDED
          - entities.Policy.fields.net_premium_collected_cents
          - entities.Refund.fields.amount_cents
