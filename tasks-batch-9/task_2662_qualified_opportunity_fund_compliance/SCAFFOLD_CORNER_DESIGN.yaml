  # ---------------------------------------------------------------------------
  # Table 6 (Errors): every id in the §1.6 catalog must be triggerable. Ids
  # already asserted by a §1.8 instance appear here as excluded_because stubs;
  # ids asserted by another §1.9 instance above (ERR_INVALID_REQUEST,
  # ERR_QOZ_BUSINESS_NOT_FOUND, ERR_ASSET_TEST_NOT_FOUND, ERR_ALREADY_TERMINAL,
  # ERR_INVALID_STATE_TRANSITION, ERR_RELATED_PARTY_ACQUISITION,
  # ERR_EXPENDITURE_OUTSIDE_WINDOW, ERR_WCSH_PLAN_INCOMPLETE,
  # ERR_CHECKPOINT_INDEX_INVALID, ERR_SAFE_HARBOR_INPUT_MISSING,
  # ERR_QOZB_LINK_REQUIRED, ERR_CURE_BASIS_NOT_APPROVABLE) are not repeated;
  # the three RBAC ids and the two OCC ids belong to the rbac and
  # complexity_layers sections below.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: auth_and_pagination_envelope_errors_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_MISSING_AUTH_HEADER]
          - errors[ERR_UNKNOWN_ROLE]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "The three envelope-level guards fire before any domain logic and on an empty database: absent headers are 401 ERR_MISSING_AUTH_HEADER, a syntactically fine but unknown role string is 401 ERR_UNKNOWN_ROLE (not 403), and limit/offset outside 1..100 / >= 0 is 400 ERR_INVALID_PAGINATION. The first two calls deliberately omit or corrupt X-User-Role, which no positive test can express."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "GET /qof/funds"
              as: OMITTED
              as_user_id: OMITTED
              captures: { err_noauth: $.data.error_id }
            - call: "GET /qof/funds"
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_role: $.data.error_id }
            - call: "GET /qof/eligible-gains?limit=0"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_lo: $.data.error_id }
            - call: "GET /qof/eligible-gains?limit=101"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_hi: $.data.error_id }
            - call: "GET /qof/eligible-gains?offset=-1"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_off: $.data.error_id }
            - call: "GET /qof/eligible-gains?limit=100&offset=0"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { page: $.data }
          assert:
            - "First call: neither X-User-Role nor X-User-ID is sent; HTTP 401 with ${err_noauth} == ERR_MISSING_AUTH_HEADER"
            - "Second call: X-User-Role is the string Auditor, which is not one of the four §1.7 roles; HTTP 401 with ${err_role} == ERR_UNKNOWN_ROLE (priority 2 beats the 403 at priority 3)"
            - "${err_lo} == ERR_INVALID_PAGINATION with HTTP 400 (limit 0 is below the 1..100 band)"
            - "${err_hi} == ERR_INVALID_PAGINATION with HTTP 400 (limit 101 is above the band)"
            - "${err_off} == ERR_INVALID_PAGINATION with HTTP 400 (offset must be >= 0)"
            - "Last call: limit == 100 and offset == 0 are both inside the band, so HTTP 200 and ${page} is an empty list with total_count == 0 and has_more == false"

      - name: every_path_id_returns_its_own_entity_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_FUND_NOT_FOUND]
          - errors[ERR_INVESTOR_NOT_FOUND]
          - errors[ERR_ELIGIBLE_GAIN_NOT_FOUND]
          - errors[ERR_DEFERRAL_ELECTION_NOT_FOUND]
          - errors[ERR_FUND_ASSET_NOT_FOUND]
          - errors[ERR_BUSINESS_TEST_NOT_FOUND]
          - errors[ERR_IMPROVEMENT_PROJECT_NOT_FOUND]
          - errors[ERR_WCSH_PLAN_NOT_FOUND]
          - errors[ERR_PENALTY_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "Priority 6 emits the not-found error OWNED BY the path segment, so nine well-formed but unknown UUIDs on nine different routes must produce nine DIFFERENT error ids, never a single generic 404. Run against an empty database so nothing can accidentally match."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z. UNKNOWN denotes the well-formed UUID 00000000-0000-4000-8000-000000000099, which matches no row of any table."
          setup_api_calls: []
          trigger:
            - call: "GET /qof/funds/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_fund: $.data.error_id }
            - call: "GET /qof/investors/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_inv: $.data.error_id }
            - call: "GET /qof/eligible-gains/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_gain: $.data.error_id }
            - call: "GET /qof/deferral-elections/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_elec: $.data.error_id }
            - call: "GET /qof/fund-assets/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_asset: $.data.error_id }
            - call: "GET /qof/business-tests/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_btest: $.data.error_id }
            - call: "GET /qof/improvement-projects/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_proj: $.data.error_id }
            - call: "GET /qof/wcsh-plans/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_plan: $.data.error_id }
            - call: "GET /qof/penalty-assessments/00000000-0000-4000-8000-000000000099"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { e_pen: $.data.error_id }
          assert:
            - "All nine calls answer HTTP 404 with response_type error"
            - "${e_fund} == ERR_FUND_NOT_FOUND"
            - "${e_inv} == ERR_INVESTOR_NOT_FOUND"
            - "${e_gain} == ERR_ELIGIBLE_GAIN_NOT_FOUND"
            - "${e_elec} == ERR_DEFERRAL_ELECTION_NOT_FOUND"
            - "${e_asset} == ERR_FUND_ASSET_NOT_FOUND"
            - "${e_btest} == ERR_BUSINESS_TEST_NOT_FOUND"
            - "${e_proj} == ERR_IMPROVEMENT_PROJECT_NOT_FOUND"
            - "${e_plan} == ERR_WCSH_PLAN_NOT_FOUND"
            - "${e_pen} == ERR_PENALTY_ASSESSMENT_NOT_FOUND"
            - "The nine ids are pairwise distinct: a shared generic 404 fails this instance"

      - name: body_foreign_key_reference_not_found_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
        distinguishing_aspect: "A dangling FK in the request BODY is the single generic 404 ERR_REFERENCED_ENTITY_NOT_FOUND, not the entity-specific not-found error that priority 6 emits for path ids. Priority 7 also runs before the fund-manager (9), certification (11) and window (20) gates, so a bogus fund_id answers 404 rather than 403/409."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. UNKNOWN denotes the unmatched UUID 00000000-0000-4000-8000-000000000099."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Dangling FK Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id, fund_v: $.data.version }
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "00000000-0000-4000-8000-000000000099", asset_class: "CASH", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 100000.00, afs_fair_value: 100000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { e_asset_fund: $.data.error_id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "00000000-0000-4000-8000-000000000099", fund_id: "${fund_id}", elected_amount: 50000.00, expected_fund_version: "${fund_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_elec_gain: $.data.error_id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "00000000-0000-4000-8000-000000000099", window_start: "2026-01-01T00:00:00Z", covered_amount: 100000.00, written_plan_reference: "WP-2662-DANGLE", schedule_month_count: 1, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 } ] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_plan_biz: $.data.error_id }
          assert:
            - "${e_asset_fund} == ERR_REFERENCED_ENTITY_NOT_FOUND with HTTP 404 (a DRAFT fund would have answered 409 ERR_FUND_NOT_CERTIFIED; the FK check at priority 7 wins)"
            - "${e_elec_gain} == ERR_REFERENCED_ENTITY_NOT_FOUND with HTTP 404 even though fund_id and expected_fund_version are both valid"
            - "${e_plan_biz} == ERR_REFERENCED_ENTITY_NOT_FOUND with HTTP 404"
            - "No FundAsset, DeferralElection or WorkingCapitalPlan row exists; Fund.${fund_id}.version is still ${fund_v} and aggregate_asset_basis == 0.00"

      - name: decertified_fund_rejects_a_new_asset_test
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - state_machines.Fund.certification_status
          - errors[ERR_FUND_DECERTIFIED]
        distinguishing_aspect: "POST /qof/funds/{id}/asset-tests is in priority 12's applies_to list but NOT in priority 11's, so a DECERTIFIED fund answers 409 ERR_FUND_DECERTIFIED there — the only route on which the lockout error is observable ahead of ERR_FUND_NOT_CERTIFIED (11) and ERR_ALREADY_TERMINAL (14). §1.2 declares the DRAFT -> DECERTIFIED arc directly, so no self-certification is needed."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Lockout Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
