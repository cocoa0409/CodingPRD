# =============================================================================
# Task 1125: School Furniture & Public Bid Fulfillment — §1.9 Corner Design
# Breadth coverage of §1.1-§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: district_creation_applies_enrollment_default
        claim_type: defaults
        grounds: [entities.District.fields.extended_warranty_enrolled]
        distinguishing_aspect: "Omitting extended_warranty_enrolled on district creation stores false; common fields id/version/created_at are server-minted."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 5000000 }, as: ContractorAdmin, captures: { d1: $.data.id, enroll: $.data.extended_warranty_enrolled, ver: $.data.version } }
          assert:
            - "201 created; enroll == false (declared default applied)"
            - "ver == 1 and District.${d1}.created_at is set (system fields generated, client input for them ignored)"

      - name: spec_line_missing_qty_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.SpecLine.fields.qty, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "qty is a required input with no default; omitting it fails request-shape validation with ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["District D1; spec in DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
          trigger:
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400; missing required qty)"

      - name: poline_computed_unit_price_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.POLine.fields.computed_unit_price_cents, calculations.coop_tiered_unit_price]
        distinguishing_aspect: "computed_unit_price_cents is source:computed — a client-supplied value in the create body is ignored and the server-computed tier price is stored."
        test_recipe:
          setup: ["District D1; coop C1 tier 1:12000; spec/line qty 500 cap 13000; COOP award accepted; PO created (RECEIVED)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 3, computed_unit_price_cents: 1 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { ln: $.data.id, unit: $.data.computed_unit_price_cents, total: $.data.line_total_cents } }
          assert:
            - "unit == 12000 (server-computed tier-1 price; client-supplied 1 ignored)"
            - "total == 36000 (3 x 12000)"

      - name: get_shipment_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent shipment id returns ERR_NOT_FOUND 404 with the standard error envelope."
        test_recipe:
          setup: ["Empty DB (clock default)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "GET /v1/shipments/00000000-0000-4000-8000-000000000000", payload: {}, as: FulfillmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: bidspec_publish_from_published_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BidSpec.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "publish is declared only from DRAFT and ADDENDUM_ISSUED; calling it from PUBLISHED is an invalid-from rejection with no spec_version change."
        test_recipe:
          setup: ["District D1; spec with one line; published once (PUBLISHED, spec_version 1)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { v1: $.data.spec_version } }
          trigger:
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "v1 == 1 after the first publish"
            - "err == ERR_INVALID_STATE (second publish from PUBLISHED rejected; spec_version still 1)"

      - name: award_creation_pins_spec_version_and_moves_spec_to_awarded
        claim_type: side_effect_execution
        grounds: [state_machines.BidSpec.CLOSED_to_AWARDED, entities.Award.fields.awarded_spec_version]
        distinguishing_aspect: "Award creation both pins awarded_spec_version := spec_version and auto-transitions the spec CLOSED -> AWARDED; new award itself starts in ISSUED."
        test_recipe:
          setup: ["District D1; spec with one line; published then closed (CLOSED, spec_version 1)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id, pin: $.data.awarded_spec_version, astatus: $.data.status } }
            - { call: "GET /v1/bid-specs/${specA}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { spec_status: $.data.status } }
          assert:
            - "pin == 1 (spec_version pinned at award time)"
            - "astatus == ISSUED (award initial state)"
            - "spec_status == AWARDED (cascade side effect of award creation)"

      - name: po_cancelled_terminal_lockdown_rejects_new_lines
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PurchaseOrder.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for a PO: adding a line to it is rejected with ERR_INVALID_STATE and no line is created."
        test_recipe:
          setup: ["District D1; flat award accepted; PO with one line qty 5; PO cancelled while RECEIVED"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 5 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/purchase-orders/${po1}/cancel", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 3 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (PO CANCELLED terminal; line creation rejected)"
            - "GET /v1/po-lines?purchase_order_id=${po1} still lists exactly 1 line (the cancelled one)"

      - name: backorder_update_eta_on_resolved_notice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BackorderNotice.transitions, "errors[ERR_BACKORDER_NOT_OPEN]"]
        distinguishing_aspect: "update-eta is valid only from OPEN/ETA_UPDATED; once the line's full remainder is delivered the notice auto-resolves and further ETA updates are rejected."
        test_recipe:
          setup: ["District D1; coop award accepted; PO line qty 10 ORDERED then BACKORDERED (clock 2026-05-10, eta 2026-07-20); site; remediation shipment delivers all 10 on 2026-07-01, resolving the notice"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/po-lines/${l1}/declare-backorder", payload: { initial_eta_date: "2026-07-20" }, as: FulfillmentCoordinator }
            - { call: "GET /v1/backorder-notices", payload: { po_line_id: "${l1}" }, as: FulfillmentCoordinator, captures: { n1 : "$.data[0].id" } }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "GET /v1/backorder-notices/${n1}", payload: {}, as: FulfillmentCoordinator, captures: { n1_status: $.data.status } }
          trigger:
            - { call: "POST /v1/backorder-notices/${n1}/update-eta", payload: { new_eta_date: "2026-08-01" }, as: FulfillmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "n1_status == RESOLVED before the trigger (full delivery auto-resolved the notice)"
            - "err == ERR_BACKORDER_NOT_OPEN (RESOLVED is terminal for ETA updates)"

      - name: install_complete_requires_full_checklist_then_verifies_lines
        claim_type: side_effect_execution
        grounds: [state_machines.InstallTask.IN_PROGRESS_to_COMPLETED, "errors[ERR_INSTALL_CHECKLIST_INCOMPLETE]", entities.POLine.fields.installed_at]
        distinguishing_aspect: "complete with placed=false is rejected and leaves the task IN_PROGRESS; a full checklist completes the task, verifies the shipment's lines with installed_at stamped from the clock, completes the shipment, and bubbles the PO to FULFILLED."
        test_recipe:
          setup: ["District D1; flat award; PO line qty 10 delivered 2026-07-01; task [2026-07-06, 2026-07-08) crew Alpha started; clock 2026-07-08T10:00:00Z at completion"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-12", start_date: "2026-07-06", end_date: "2026-07-08", crew_count: 1 }, as: FulfillmentCoordinator, captures: { task1: $.data.id } }
            - { call: "POST /v1/install-tasks/${task1}/start", payload: {}, as: CrewLead, as_user_id: "${crew1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-08T10:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/install-tasks/${task1}/complete", payload: { uncrated: true, debris_removed: true, placed: false }, as: CrewLead, as_user_id: "${crew1}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/install-tasks/${task1}/complete", payload: { uncrated: true, debris_removed: true, placed: true }, as: CrewLead, as_user_id: "${crew1}", captures: { t_status: $.data.status, t_check: $.data.completed_checklist } }
            - { call: "GET /v1/po-lines/${l1}", payload: {}, as: FulfillmentCoordinator, captures: { l_status: $.data.status, l_installed: $.data.installed_at } }
            - { call: "GET /v1/shipments/${ship1}", payload: {}, as: FulfillmentCoordinator, captures: { ship_status: $.data.status } }
            - { call: "GET /v1/purchase-orders/${po1}", payload: {}, as: FulfillmentCoordinator, captures: { po_status: $.data.status } }
          assert:
            - "err == ERR_INSTALL_CHECKLIST_INCOMPLETE (placed=false; task stayed IN_PROGRESS)"
            - "t_status == COMPLETED and t_check contains [UNCRATED, DEBRIS_REMOVED, PLACED]"
            - "l_status == VERIFIED and l_installed == 2026-07-08T10:00:00Z (clock-stamped)"
            - "ship_status == COMPLETED (all tasks done) and po_status == FULFILLED (bubble-up)"

      - name: shipment_mark_delivered_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Shipment.SCHEDULED_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-delivered is not idempotent: the second call observes status DELIVERED and is rejected with ERR_INVALID_STATE; delivered_qty does not double."
        test_recipe:
