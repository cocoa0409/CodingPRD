  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_halfopen_touching_windows_allowed
        grounds:
          - validations[priority=8]
          - state_machines.Cohort.DRAFT_to_SCHEDULED
          - errors[ERR_INSTRUCTOR_TIME_CONFLICT]
          - entities.Cohort.fields.instructor_id
        distinguishing_aspect: |
          Instructor resource, HALF-OPEN [starts_at, ends_at) interval semantics: cohortA.ends_at ==
          cohortB.starts_at (2026-06-30T00:00:00Z) is treated as NON-overlapping, so scheduling the
          same instructor on back-to-back windows SUCCEEDS — distinct interval geometry from the
          student closed-interval rule below.
        test_recipe:
          setup:
            - "Instructor certified for SAT; cohort A [2026-06-01,2026-06-30) already SCHEDULED with that instructor; cohort B [2026-06-30,2026-07-30) touching at the boundary awaits scheduling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT Live", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 5 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cA_id: $.data.id }
            - call: "POST /cohorts/${cA_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-30T00:00:00Z", ends_at: "2026-07-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cB_id: $.data.id }
          trigger:
            - call: "POST /cohorts/${cB_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
          assert:
            - "Cohort.${cB_id}.status == SCHEDULED"
            - "Cohort.${cB_id}.instructor_id == ${inst_id}"
            - "Instructor.${inst_id}.active_cohort_count == 2"

      - name: student_closed_touching_windows_rejected
        grounds:
          - validations[priority=17]
          - state_machines.Enrollment.PENDING_PAYMENT_to_WAITLISTED
          - errors[ERR_STUDENT_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Student resource, CLOSED (buffer-inclusive) interval semantics: a student already enrolled in
          cohort A [2026-06-01,2026-06-30) is REJECTED when enrolling in cohort B [2026-06-30,2026-07-30)
          that merely touches A's end — boundary-touching counts as a conflict, the OPPOSITE geometric
          treatment from the instructor half-open rule, and on a different resource entity.
        test_recipe:
          setup:
            - "Student already holds a non-terminal (PENDING_PAYMENT) enrollment in cohort A [2026-06-01,2026-06-30); cohort B [2026-06-30,2026-07-30) touches A's end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT Live", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 5 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cA_id: $.data.id, cA_v0: $.data.version }
            - call: "POST /cohorts/${cA_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cA_v1: $.data.version }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-30T00:00:00Z", ends_at: "2026-07-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cB_id: $.data.id, cB_v0: $.data.version }
            - call: "POST /cohorts/${cB_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cB_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "sc@x.com", full_name: "SC" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cA_id}", expected_cohort_version: "${cA_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cB_id}", expected_cohort_version: "${cB_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STUDENT_SCHEDULE_CONFLICT"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_money_collected_equals_returned
        grounds:
          - calculations.guarantee_refund_amount
          - state_machines.InstallmentPlan.OPEN_to_REFUNDED
          - entities.InstallmentPlan.fields.amount_paid_cents
          - entities.GuaranteeClaim.fields.refund_amount_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: after the forward action (payments collecting 51000) and its
          compensating action (REFUND approval), money_returned (refund_amount_cents) MUST equal
          money_collected (plan.amount_paid_cents) exactly: 51000 == 51000, zero drift.
        test_recipe:
