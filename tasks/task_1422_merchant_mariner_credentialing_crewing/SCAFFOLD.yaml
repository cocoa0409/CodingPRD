    input: [outcome]
    output: TrainingEnrollment
    side_effects: ["status -> COMPLETED or NO_SHOW", "NO_SHOW: reserved_cents -= provisional; strike += 1; at 2 strikes privileges SUSPENDED + REQUESTED->REJECTED + APPROVED->CANCELLED cascade"]
  - method: POST
    path: "/training-enrollments/{id}/reimburse"
    description: "COMPLETED -> REIMBURSED; SoD vs approver; final amount = min(receipt, provisional)"
    roles: [FleetAdmin]
    code: 200
    input: [receipt_amount_cents]
    output: TrainingEnrollment
    side_effects: ["status -> REIMBURSED", "reimbursed_amount_cents computed", "budget used += reimbursed, reserved -= provisional", "reimbursed_by_user_id := X-User-ID"]
  - method: POST
    path: "/training-enrollments/{id}/cancel"
    description: "APPROVED|ENROLLED -> CANCELLED; ENROLLED cancel releases seat and budget reservation"
    roles: [Mariner, CrewingManager, FleetAdmin]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["status -> CANCELLED", "if was ENROLLED: seats_reserved -= 1, reserved_cents -= provisional"]

  # --- TrainingBudget ---
  - method: GET
    path: "/mariners/{id}/training-budgets"
    description: "List training budget rows of a mariner (one per fiscal year, auto-created at first enroll)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: "TrainingBudget[]"
    side_effects: []

  # --- UnionHall / UnionRegistration ---
  - method: POST
    path: "/union-halls"
    description: "Register a union hall"
    roles: [FleetAdmin]
    code: 201
    input: [local_number, name, region]
    output: UnionHall
    side_effects: []
  - method: GET
    path: "/union-halls"
    description: "List union halls"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["limit?", "offset?"]
    output: "UnionHall[]"
    side_effects: []
  - method: GET
    path: "/union-halls/{id}"
    description: "Get one union hall"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: UnionHall
    side_effects: []
  - method: POST
    path: "/union-halls/{id}/registrations"
    description: "Register a UNION_HALL mariner with a hall (REGISTERED; dues_current_until := seniority_date)"
    roles: [UnionDispatcher, FleetAdmin]
    code: 201
    input: [mariner_id, seniority_date, shipping_card_number]
    output: UnionRegistration
    side_effects: ["status = REGISTERED", "dues_current_until := seniority_date"]
  - method: GET
    path: "/union-halls/{id}/registrations"
    description: "List registrations of a hall"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "UnionRegistration[]"
    side_effects: []
  - method: GET
    path: "/mariners/{id}/union-registrations"
    description: "List union registrations of a mariner"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "UnionRegistration[]"
    side_effects: []
  - method: POST
    path: "/union-halls/{id}/registrations/{registrationId}/extend-dues"
    description: "Extend dues currency (REGISTERED only)"
    roles: [UnionDispatcher]
    code: 200
    input: [new_dues_current_until]
    output: UnionRegistration
    side_effects: ["dues_current_until := new_dues_current_until (must be > current value else ERR_INVALID_REQUEST)"]
  - method: POST
    path: "/union-halls/{id}/registrations/{registrationId}/suspend"
    description: "REGISTERED -> SUSPENDED"
    roles: [UnionDispatcher, FleetAdmin]
    code: 200
    input: []
    output: UnionRegistration
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/union-halls/{id}/registrations/{registrationId}/reinstate"
    description: "SUSPENDED -> REGISTERED"
    roles: [UnionDispatcher, FleetAdmin]
    code: 200
    input: []
    output: UnionRegistration
    side_effects: ["status -> REGISTERED"]

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (no wall-clock fallback). Setting the clock synchronously runs calculations.credential_expiry_sweep (credential EXPIRED/LAPSED, prerequisite SUSPENDED_PREREQ cascade, medical EXPIRED, posture recompute, CONFIRMED->SUSPENDED cascade, coverage/vessel posture recompute)."
    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["runs credential_expiry_sweep in pinned order (1) credential expiry, (2) LAPSED sweep, (3) prereq cascade, (4) medical expiry, (5) posture recompute, (6) assignment SUSPENDED cascade, (7) coverage/vessel posture recompute"]
  - method: GET
    path: "/_clock/current"
    description: "Read the logical clock (default 2026-08-01T00:00:00Z before any set)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_FORBIDDEN_RESOURCE_ACCESS, http: 403, condition: "Mariner role addressing another mariner's resources, or UnionDispatcher acting outside own hall" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/type/enum/date-order/range/uniqueness violation, or manual REPATRIATION booking creation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_MARINER_NOT_FOUND, http: 404, condition: "Mariner id not found" }
  - { id: ERR_VESSEL_NOT_FOUND, http: 404, condition: "Vessel id not found" }
  - { id: ERR_MANNING_SLOT_NOT_FOUND, http: 404, condition: "ManningSlot id not found" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "Credential id not found" }
  - { id: ERR_SEA_SERVICE_RECORD_NOT_FOUND, http: 404, condition: "SeaServiceRecord id not found" }
  - { id: ERR_MEDICAL_CERTIFICATE_NOT_FOUND, http: 404, condition: "MedicalCertificate id not found" }
  - { id: ERR_DRUG_TEST_NOT_FOUND, http: 404, condition: "DrugTestRecord id not found" }
  - { id: ERR_TRAINING_COURSE_NOT_FOUND, http: 404, condition: "TrainingCourse id not found" }
  - { id: ERR_TRAINING_ENROLLMENT_NOT_FOUND, http: 404, condition: "TrainingEnrollment id not found" }
  - { id: ERR_UNION_HALL_NOT_FOUND, http: 404, condition: "UnionHall id not found" }
  - { id: ERR_UNION_REGISTRATION_NOT_FOUND, http: 404, condition: "UnionRegistration id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Assignment id not found" }
  - { id: ERR_TRAVEL_BOOKING_NOT_FOUND, http: 404, condition: "TravelBooking id not found" }
  - { id: ERR_ROTATION_PLAN_NOT_FOUND, http: 404, condition: "CrewRotationPlan id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (no more specific error applies)" }
  - { id: ERR_MARINER_NOT_ACTIVE, http: 409, condition: "Operation requires mariner.status == ACTIVE (assignment create, enrollment create)" }
  - { id: ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING, http: 409, condition: "Activate/reinstate without VALID medical, qualifying NEGATIVE drug test, and VALID credential" }
  - { id: ERR_VESSEL_NOT_ACTIVE, http: 409, condition: "Operation requires vessel.status in {ACTIVE, UNDERWAY} (rotation plan create, assignment create)" }
  - { id: ERR_NO_MANNING_SLOTS, http: 409, condition: "Vessel activation requires >= 1 ACTIVE manning slot" }
  - { id: ERR_SLOT_NOT_ACTIVE, http: 409, condition: "Assignment create requires slot.status == ACTIVE" }
  - { id: ERR_SLOT_HAS_OPEN_ASSIGNMENTS, http: 409, condition: "Slot retire blocked by assignments in {PROPOSED, CONFIRMED, ONBOARD, SUSPENDED}" }
  - { id: ERR_ACTIVE_CREW_ABOARD, http: 409, condition: "Vessel lay-up/decommission or mariner terminate blocked by ONBOARD assignments" }
  - { id: ERR_CREDENTIAL_NOT_RENEWABLE, http: 409, condition: "submit-renewal requires VALID or EXPIRED credential" }
  - { id: ERR_RENEWAL_NOT_PENDING, http: 409, condition: "approve/deny-renewal requires RENEWAL_PENDING" }
  - { id: ERR_CREDENTIAL_NOT_VALID, http: 409, condition: "revoke requires VALID" }
  - { id: ERR_RECORD_NOT_SUBMITTABLE, http: 409, condition: "submit requires DRAFT or DISPUTED" }
  - { id: ERR_RECORD_NOT_VERIFIABLE, http: 409, condition: "verify/dispute/reject requires SUBMITTED (reject also allows DISPUTED)" }
  - { id: ERR_MEDICAL_CERT_NOT_VALID, http: 409, condition: "suspend requires VALID; reinstate requires SUSPENDED" }
  - { id: ERR_DRUG_TEST_NOT_PENDING, http: 409, condition: "record-result requires PENDING" }
  - { id: ERR_COURSE_NOT_SCHEDULED, http: 409, condition: "Operation requires course.status == SCHEDULED (enrollment create, enroll, course cancel)" }
  - { id: ERR_SIGN_ON_TOO_EARLY, http: 409, condition: "sign-on before sign_on_date" }
  - { id: ERR_TRAVEL_NOT_READY, http: 409, condition: "sign-on requires travel_status in {READY, WAIVED}" }
  - { id: ERR_RELIEF_NOT_ONBOARD, http: 409, condition: "relieve requires another ONBOARD assignment on the same slot" }
  - { id: ERR_REPATRIATION_INCOMPLETE, http: 409, condition: "close requires repatriation_status == COMPLETED" }
  - { id: ERR_NO_TRAVEL_LEGS, http: 409, condition: "JOIN booking create or book transition requires >= 1 leg" }
  - { id: ERR_MARINER_NOT_CLEAR, http: 409, condition: "Mariner readiness_posture gate failed (BLOCKED, or RESTRICTED where CLEAR required)" }
  - { id: ERR_RESTRICTED_WINDOW_EXCEEDED, http: 409, condition: "RESTRICTED mariner confirmed with planned_relief_date beyond earliest restricting expiry" }
  - { id: ERR_ENDORSEMENT_MISMATCH, http: 409, condition: "No VALID credential with slot.required_endorsement_code at create/confirm" }
  - { id: ERR_RANK_BELOW_MINIMUM, http: 409, condition: "Mariner rank_track mismatch or rank_grade below slot.min_rank_grade at create/confirm" }
  - { id: ERR_ENDORSEMENT_PREREQUISITE_INVALID, http: 409, condition: "prerequisite_credential_id missing, wrong mariner, or not VALID at issuance/renewal/reinstate" }
  - { id: ERR_UPGRADE_REQUIREMENTS_NOT_MET, http: 409, condition: "OFFICER_ENDORSEMENT issuance without upgrade eligibility (days and/or course)" }
  - { id: ERR_CHANNEL_NOT_PERMITTED, http: 409, condition: "Channel/actor/mariner.hire_channel mismatch (DIRECT_HIRE vs UNION_DISPATCH)" }
  - { id: ERR_UNION_REGISTRATION_INVALID, http: 409, condition: "UNION_DISPATCH requires registration status REGISTERED" }
  - { id: ERR_DUES_NOT_CURRENT, http: 409, condition: "UNION_DISPATCH requires dues_current_until >= sign_on_date" }
  - { id: ERR_NO_ACTIVE_ROTATION_WINDOW, http: 409, condition: "No ACTIVE CrewRotationPlan with effective_from <= sign_on_date < effective_to" }
  - { id: ERR_MARINER_ASSIGNMENT_OVERLAP, http: 409, condition: "Strict half-open overlap with mariner's own CONFIRMED/ONBOARD/SUSPENDED assignment" }
  - { id: ERR_HANDOVER_WINDOW_EXCEEDED, http: 409, condition: "Slot handover overlap > max_handover_overlap_days" }
  - { id: ERR_COURSE_FULL, http: 409, condition: "course.seats_open == 0 at enroll" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Open enrollment already exists for (mariner, course)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Non-SUSPENDED registration already exists for (hall, mariner)" }
  - { id: ERR_VESSEL_NOT_COMPLIANT, http: 409, condition: "mark-underway with CRITICAL_SHORTAGE, or DEFICIENT without waiver_justification" }
  - { id: ERR_TRAINING_PRIVILEGES_SUSPENDED, http: 409, condition: "Enrollment create with training_privileges == SUSPENDED" }
  - { id: ERR_SOD_VERIFY_SAME_RECORDER, http: 403, condition: "Sea-service verifier == entered_by_user_id" }
  - { id: ERR_SOD_REIMBURSE_SAME_APPROVER, http: 403, condition: "Reimburser == enrollment.approved_by_user_id" }
  - { id: ERR_TRAINING_BUDGET_EXCEEDED, http: 402, condition: "available_cents < provisional_amount_cents at enroll" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Crewing department system administrator: owns mariner/vessel/course/hall registries, lifecycle actions, enrollment seat allocation, reimbursement disbursement, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mariners, PUT /mariners/{id}, /activate, /suspend, /reinstate, /terminate"
      - "POST /vessels, /vessels/{id}/activate, /decommission"
      - "POST /training-courses, /training-courses/{id}/cancel"
      - "POST /training-enrollments/{id}/enroll, /record-completion, /reimburse"
      - "POST /union-halls"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "POST /training-enrollments/{id}/cancel", "POST /union-halls/{id}/registrations, /suspend, /reinstate"]
  - name: CredentialingOfficer
    description: "Licensing/credentialing specialist: issues and renews credentials, verifies sea service, manages medical certificates and drug-test program records"
    identity: opaque
    exclusive_operations:
      - "POST /mariners/{id}/credentials and all credential actions (submit-renewal shared with Mariner)"
      - "POST /mariners/{id}/sea-service-records (on behalf), /verify, /dispute, /reject (submit shared with Mariner)"
      - "POST /mariners/{id}/medical-certificates, /suspend, /reinstate"
      - "POST /mariners/{id}/drug-tests, /record-result"
    shared_operations: ["all GET endpoints"]
  - name: CrewingManager
    description: "Crewing/relief planner: owns rotation plans, DIRECT_HIRE assignments, travel and repatriation logistics, training approvals"
    identity: opaque
    exclusive_operations:
      - "POST /vessels/{id}/rotation-plans, /archive"
      - "POST /assignments (DIRECT_HIRE only), /confirm (DIRECT_HIRE), /relieve, /close, /resume"
      - "POST /assignments/{id}/travel-bookings and booking actions, PUT booking legs"
      - "POST /training-enrollments/{id}/approve, /reject"
    shared_operations: ["all GET endpoints", "POST /assignments/{id}/cancel", "POST /assignments/{id}/sign-on", "POST /training-enrollments/{id}/cancel"]
  - name: PortCaptain
    description: "Vessel manning authority: defines safe-manning billets, authorizes underway with compliance gate"
    identity: opaque
    exclusive_operations:
      - "POST /vessels/{id}/manning-slots, PUT .../manning-slots/{slotId}, /retire"
      - "POST /vessels/{id}/mark-underway, /return-to-port, /lay-up"
    shared_operations: ["all GET endpoints", "POST /assignments/{id}/sign-on"]
  - name: UnionDispatcher
    description: "Union hall dispatcher: manages own hall's registrations and dispatches UNION_HALL mariners"
    identity: "entity_backed:UnionHall"
    exclusive_operations:
      - "POST /union-halls/{id}/registrations/{registrationId}/extend-dues"
      - "POST /assignments (UNION_DISPATCH only), /confirm and /cancel for own-hall UNION_DISPATCH assignments"
    shared_operations: ["all GET endpoints", "POST /union-halls/{id}/registrations, /suspend, /reinstate (own hall)"]
  - name: Mariner
    description: "The credentialed mariner: self-service record submission, credential renewal requests, training requests, own-data reads"
    identity: "entity_backed:Mariner"
    exclusive_operations:
      - "POST /training-courses/{id}/enrollments (self only; mariner_id := X-User-ID)"
    shared_operations: ["GET endpoints scoped to own id", "POST /mariners/{id}/sea-service-records, /submit (own)", "POST /mariners/{id}/credentials/{cid}/submit-renewal (own)", "POST /training-enrollments/{id}/cancel (own)"]
