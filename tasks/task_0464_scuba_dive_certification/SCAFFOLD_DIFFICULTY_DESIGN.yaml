          - entities.DiveTrip.fields.ends_at
          - entities.Boat.fields.turnaround_minutes
        distinguishing_aspect: |
          Closed-with-buffer interval semantics on the Boat resource: a trip
          08:00-12:00 plus a 60-minute turnaround blocks any trip starting
          before 13:00 — a 12:30 start is rejected with ERR_BOAT_CONFLICT even
          though it does not overlap the raw window. Different interval
          arithmetic (buffer-expanded) and different resource entity than the
          instructor half-open case.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. A Boat (turnaround_minutes 60) with one trip 2026-07-02T08:00..12:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /boats"
              payload: { name: "Buffered Beauty", capacity: 8, turnaround_minutes: 60 }
              as: ShopAdmin
              captures: { boat_id: $.data.id }
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-07-02T08:00:00Z", ends_at: "2026-07-02T12:00:00Z", min_cert_level: "OPEN_WATER", base_fare_cents: 12000, fill_addon_cents: 1500 }
              as: ShopAdmin
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-07-02T12:30:00Z", ends_at: "2026-07-02T16:00:00Z", min_cert_level: "OPEN_WATER", base_fare_cents: 12000, fill_addon_cents: 1500 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_BOAT_CONFLICT"
            - "response.http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: session_seat_conservation_book_then_cancel
        grounds:
          - state_machines.SessionBooking.BOOKED_to_CANCELLED
          - entities.Session.fields.confirmed_seats
          - concurrency_rules[session-book-stale-session]
        distinguishing_aspect: |
          Conserved quantity SEATS: confirmed_seats == count(SessionBooking
          BOOKED). After booking one seat then cancelling it, Session.confirmed_seats
          returns to its pre-action value (0), with no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. An OPEN_WATER session (confirmed_seats 0) and an ACTIVE enrollment (waiver-cleared diver)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Sam Seat", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /divers"
              payload: { full_name: "Seth Seat", email: "seth@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v}" }
              as: ShopAdmin
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /session-bookings/${sb_id}/cancel"
              payload: {}
              as: ShopAdmin
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "SessionBooking.${sb_id}.status == CANCELLED"
            - "Session.${sess_id}.confirmed_seats == 0"

      - name: diver_deposit_conservation_checkout_then_void
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_VOIDED
          - entities.Diver.fields.deposit_on_hold_cents
          - entities.RentalAgreement.fields.deposit_cents
        distinguishing_aspect: |
          Conserved quantity MONEY (distinct from SEATS): Diver.deposit_on_hold_cents
          == sum(deposit_cents over ACTIVE rentals). Checking out a rental then
          voiding it returns deposit_on_hold_cents to its pre-action value (0)
          with no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-10T09:00:00Z. A diver with deposit_on_hold_cents 0 (no rentals yet)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /divers"
              payload: { full_name: "Vic Void", email: "vic@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { diver_id: "${diver_id}", item_description: "Mask", daily_rate_cents: 4500, deposit_cents: 20000, scheduled_return_at: "2026-06-12T09:00:00Z" }
              as: ShopAdmin
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${rental_id}/void"
              payload: {}
              as: ShopAdmin
            - call: "GET /divers/${diver_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "RentalAgreement.${rental_id}.status == VOIDED"
            - "Diver.${diver_id}.deposit_on_hold_cents == 0"
