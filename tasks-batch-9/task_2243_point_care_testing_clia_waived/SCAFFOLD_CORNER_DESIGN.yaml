            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Jo Villanueva", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-08-25" }
              as: ProgramAdmin
              captures: { assr_id: $.data.id, assr_comp: $.data.competency_status, assr_access: $.data.access_status }
          trigger:
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "POST /poct/operators/${assr_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-26" }
              as: QualityCoordinator
              captures: { assr_comp_2: $.data.competency_status, assr_access_2: $.data.access_status }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "GLUCO-9", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { asmt_id: $.data.id, asmt_status: $.data.status }
          assert:
