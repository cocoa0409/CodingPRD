# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2128 — Separately Managed Account & Model Portfolio Delivery
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: drift_settled_vs_trade_date_diverge_on_one_account
        grounds:
          - calculations.account_drift_bps
          - entities.Account.fields.drift_basis
          - entities.Account.fields.drift_basis_used
          - state_machines.Account.implementation_status.SYNCED_to_DRIFTED
          - state_machines.Account.implementation_status.DRIFTED_to_SYNCED
        distinguishing_aspect: |
          The dual variant lives in the Account / TaxLot valuation domain: with the
          settled lot ledger and the pending order book both frozen, the SETTLED
          variant returns drift_bps 1000 while the TRADE_DATE variant returns 52
          on the very same Account row, and the two results land on opposite sides
          of Model.drift_threshold_bps so the implementation dimension flips.
        test_recipe:
          setup:
            - "Sponsor NRTH, Model CORE with drift_threshold_bps 1000, ModelVersion v1 PUBLISHED with sleeves ALFA 5000 / BETA 3000 / CETA 2000"
            - "Account ACC-001 holding 1250 ALFA (12,500,000c), 1500 BETA (7,500,000c), 1000 CETA (2,500,000c) and 2,500,000c cash, market value exactly 25,000,000c"
            - "One SETTLED drift evaluation already ran and left the account DRIFTED at 1000 bps"
            - "A rebalance already generated three PROPOSED orders: SELL 13 ALFA, SELL 15 BETA, BUY 980 CETA"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "BETA", name: "Beta Materials", asset_class: "US_EQUITY", last_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_beta: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "CETA", name: "Ceta Utilities", asset_class: "US_EQUITY", last_price_cents: 2500 }
              as: PlatformAdmin
              captures: { sec_ceta: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333, implementation_lag_days: 2, min_account_value_cents: 0 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90, drift_threshold_bps: 1000 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 5000 }, { security_id: "${sec_beta}", target_weight_bps: 3000 }, { security_id: "${sec_ceta}", target_weight_bps: 2000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001", cash_reserve_bps: 100, drift_basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/deposits"
              payload: { amount_cents: 2500000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 1250, cost_basis_cents: 12500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_beta}", shares: 1500, cost_basis_cents: 7500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_ceta}", shares: 1000, cost_basis_cents: 2500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/drift-evaluations"
              payload: { basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/rebalances"
              payload: {}
              as: SponsorOperator
              as_user_id: "${sp1}"
          trigger:
            - call: "POST /sma/accounts/${a1}/drift-evaluations"
              payload: { basis: "TRADE_DATE" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { td_drift: "$.data.drift_bps", td_status: "$.data.implementation_status" }
            - call: "POST /sma/accounts/${a1}/drift-evaluations"
              payload: { basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { st_drift: "$.data.drift_bps", st_status: "$.data.implementation_status" }
          assert:
            - "Account.${a1}.drift_bps == 52 immediately after the TRADE_DATE evaluation"
            - "Account.${a1}.drift_basis_used == TRADE_DATE immediately after the TRADE_DATE evaluation"
            - "Account.${a1}.implementation_status == SYNCED immediately after the TRADE_DATE evaluation (52 < 1000)"
            - "Account.${a1}.drift_bps == 1000 immediately after the second, SETTLED evaluation"
            - "Account.${a1}.drift_basis_used == SETTLED immediately after the second evaluation"
            - "Account.${a1}.implementation_status == DRIFTED immediately after the second evaluation (1000 >= 1000)"
            - "No TaxLot row and no TradeOrder row changed status between the two evaluations"

      - name: dispersion_equal_weighted_vs_asset_weighted_diverge_on_one_cohort
        grounds:
          - calculations.cross_account_dispersion
          - entities.Account.fields.latest_return_bps
          - entities.Account.fields.latest_ending_value_cents
          - endpoints.GET./sma/model-versions/{model_version_id}/dispersion
        distinguishing_aspect: |
          The second dual variant lives in the ModelVersion cross-account
          performance domain, not the Account valuation domain: for the identical
          three-account cohort the EQUAL_WEIGHTED mean is 113 bps with mean
          absolute deviation 124, while the ASSET_WEIGHTED mean is 104 bps with
          mean absolute deviation 39.
        test_recipe:
          setup:
            - "ModelVersion v1 PUBLISHED with a single sleeve ALFA 10000"
            - "Three accounts track v1 and are all in implementation_status SYNCED"
            - "Their recorded observations are +300 bps on 1,000,000c, +100 bps on 8,000,000c and -60 bps on 1,000,000c"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90, drift_threshold_bps: 1000 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-002" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a2: "$.data.id" }
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-003" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a3: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/performance-observations"
              payload: { period_end: "2026-06-30T00:00:00Z", gross_return_bps: 300, ending_value_cents: 1000000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a2}/performance-observations"
              payload: { period_end: "2026-06-30T00:00:00Z", gross_return_bps: 100, ending_value_cents: 8000000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a3}/performance-observations"
              payload: { period_end: "2026-06-30T00:00:00Z", gross_return_bps: -60, ending_value_cents: 1000000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
          trigger:
            - call: "GET /sma/model-versions/${mv1}/dispersion"
              payload: { basis: "EQUAL_WEIGHTED" }
              as: PortfolioManager
              captures: { ew_mean: "$.data.mean_return_bps", ew_mad: "$.data.mean_abs_deviation_bps" }
            - call: "GET /sma/model-versions/${mv1}/dispersion"
              payload: { basis: "ASSET_WEIGHTED" }
              as: PortfolioManager
              captures: { aw_mean: "$.data.mean_return_bps", aw_mad: "$.data.mean_abs_deviation_bps" }
          assert:
            - "EQUAL_WEIGHTED response account_count == 3"
            - "EQUAL_WEIGHTED response mean_return_bps == 113"
            - "EQUAL_WEIGHTED response mean_abs_deviation_bps == 124"
            - "ASSET_WEIGHTED response mean_return_bps == 104"
            - "ASSET_WEIGHTED response mean_abs_deviation_bps == 39"
            - "Both responses report dispersion_bps == 360, min_return_bps == -60 and max_return_bps == 300"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_tier_prorate_rounding_order_and_residual_split
        grounds:
          - calculations.fee_invoice_tiered_split
          - entities.FeeInvoice.fields.tier1_fee_cents
          - entities.FeeInvoice.fields.gross_fee_cents
          - entities.FeeInvoice.fields.manager_share_cents
          - endpoints.POST./sma/fee-invoices
        distinguishing_aspect: |
          MODE (b) — nested rounding whose order changes the cents twice over.
          Rounding each prorated tier independently and summing gives
          gross_fee_cents 289725, whereas summing the exact tier fees and
          rounding once gives 289726; and taking the manager share as the
          residual gives 178674 whereas rounding it directly gives 178673.
        test_recipe:
          setup:
            - "Sponsor NRTH with revenue_share_bps 3333; Model CORE with base_fee_bps 90"
            - "Account ACC-001 open on that sponsor and model, billing_status CURRENT"
            - "Billing period 2026-01-01 inclusive to 2026-04-01 exclusive = 90 days"
            - "Average daily value 150,000,000c straddles all three fee tiers"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /sma/fee-invoices"
              payload: { account_id: "${a1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", average_daily_value_cents: 150000000 }
              as: BillingOfficer
              captures: { inv1: "$.data.id" }
          assert:
            - "FeeInvoice.${inv1}.billing_days == 90"
            - "FeeInvoice.${inv1}.tier1_fee_cents == 55479"
            - "FeeInvoice.${inv1}.tier2_fee_cents == 147945"
            - "FeeInvoice.${inv1}.tier3_fee_cents == 86301"
            - "FeeInvoice.${inv1}.gross_fee_cents == 289725"
            - "FeeInvoice.${inv1}.gross_fee_cents != 289726"
            - "FeeInvoice.${inv1}.sponsor_share_cents == 96565"
            - "FeeInvoice.${inv1}.platform_share_cents == 14486"
            - "FeeInvoice.${inv1}.manager_share_cents == 178674"
            - "FeeInvoice.${inv1}.manager_share_cents != 178673"
            - "FeeInvoice.${inv1}.status == DRAFT"

      - name: effective_weight_capping_fixed_point_evaluation_order
        grounds:
          - calculations.effective_sleeve_weights
          - calculations.trade_order_generation
          - entities.AccountRestriction.fields.max_position_bps
          - entities.TradeOrder.fields.effective_weight_bps
          - endpoints.POST./sma/accounts/{account_id}/rebalances
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency with a pinned evaluation order.
          eff[s] is derived from `residual`, `residual` is derived from the pinned
          set, and the pinned set is derived from eff[s]; the three-pass loop
          resolves ALFA to exactly 3000, BETA to exactly 4000 and CETA to exactly
          3000, whereas a single non-iterative pass would leave BETA at 4200 and
          CETA at 2800.
        test_recipe:
          setup:
            - "ModelVersion v1 PUBLISHED with sleeves ALFA 5000 / BETA 3000 / CETA 2000, every max_position_bps left at the 10000 default"
            - "Account ACC-001 holding 1250 ALFA, 1500 BETA, 1000 CETA and 2,500,000c cash, market value exactly 25,000,000c"
            - "Two ACTIVE MAX_POSITION restrictions: ALFA capped at 3000 bps and BETA capped at 4000 bps"
            - "A drift evaluation has already left the account DRIFTED"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "BETA", name: "Beta Materials", asset_class: "US_EQUITY", last_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_beta: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "CETA", name: "Ceta Utilities", asset_class: "US_EQUITY", last_price_cents: 2500 }
              as: PlatformAdmin
              captures: { sec_ceta: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90, drift_threshold_bps: 1000 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 5000 }, { security_id: "${sec_beta}", target_weight_bps: 3000 }, { security_id: "${sec_ceta}", target_weight_bps: 2000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001", cash_reserve_bps: 100 }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/deposits"
              payload: { amount_cents: 2500000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 1250, cost_basis_cents: 12500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_beta}", shares: 1500, cost_basis_cents: 7500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_ceta}", shares: 1000, cost_basis_cents: 2500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/account-restrictions"
              payload: { account_id: "${a1}", security_id: "${sec_alfa}", restriction_type: "MAX_POSITION", max_position_bps: 3000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/account-restrictions"
              payload: { account_id: "${a1}", security_id: "${sec_beta}", restriction_type: "MAX_POSITION", max_position_bps: 4000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/accounts/${a1}/drift-evaluations"
              payload: { basis: "SETTLED" }
              as: SponsorOperator
              as_user_id: "${sp1}"
          trigger:
            - call: "POST /sma/accounts/${a1}/rebalances"
              payload: {}
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { gen_count: "$.data.generated_order_count" }
            - call: "GET /sma/trade-orders"
              payload: { account_id: "${a1}", security_id: "${sec_alfa}", status: "PROPOSED" }
              as: SponsorOperator
              captures: { o_alfa: "$.data[0].id" }
            - call: "GET /sma/trade-orders"
              payload: { account_id: "${a1}", security_id: "${sec_beta}", status: "PROPOSED" }
              as: SponsorOperator
              captures: { o_beta: "$.data[0].id" }
            - call: "GET /sma/trade-orders"
              payload: { account_id: "${a1}", security_id: "${sec_ceta}", status: "PROPOSED" }
              as: SponsorOperator
              captures: { o_ceta: "$.data[0].id" }
          assert:
            - "rebalance response generated_order_count == 3"
            - "TradeOrder.${o_alfa}.effective_weight_bps == 3000"
            - "TradeOrder.${o_beta}.effective_weight_bps == 4000"
            - "TradeOrder.${o_ceta}.effective_weight_bps == 3000"
            - "TradeOrder.${o_beta}.effective_weight_bps != 4200"
            - "TradeOrder.${o_ceta}.effective_weight_bps != 2800"
            - "TradeOrder.${o_alfa}.side == SELL and TradeOrder.${o_alfa}.shares == 508 and TradeOrder.${o_alfa}.target_shares == 742"
            - "TradeOrder.${o_beta}.side == BUY and TradeOrder.${o_beta}.shares == 480 and TradeOrder.${o_beta}.target_shares == 1980"
            - "TradeOrder.${o_ceta}.side == BUY and TradeOrder.${o_ceta}.shares == 1970 and TradeOrder.${o_ceta}.target_shares == 2970"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: model_version_reject_closes_draft_cycle_and_resubmits
        grounds:
          - state_machines.ModelVersion.DRAFT_to_PENDING_APPROVAL
          - state_machines.ModelVersion.PENDING_APPROVAL_to_DRAFT
          - entities.ModelVersion.fields.rejection_note
          - entities.ModelVersion.fields.submitted_by_user_id
        distinguishing_aspect: |
          ModelVersion is the CYCLIC machine: the PENDING_APPROVAL -> DRAFT reject
          edge returns the row to a state it already occupied, re-opens the
          version-pinned sleeves for editing, and lets the same row traverse
          DRAFT -> PENDING_APPROVAL a second time under a different submitter.
        test_recipe:
          setup:
            - "Model CORE with one DRAFT ModelVersion whose sleeves ALFA 6000 / BETA 4000 sum to 10000"
            - "The version has been submitted by X-User-ID pm-1 and is PENDING_APPROVAL"
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "BETA", name: "Beta Materials", asset_class: "US_EQUITY", last_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_beta: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 6000 }, { security_id: "${sec_beta}", target_weight_bps: 4000 } ] }
