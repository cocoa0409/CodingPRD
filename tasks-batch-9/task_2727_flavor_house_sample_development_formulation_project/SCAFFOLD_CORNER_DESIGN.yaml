        excluded_because:
          difficulty_instance: combinatorial_formula / tolerance_band_nested_clamp_interaction
          rationale: "That instance asserts the three emitted band_pct literals produced by the nested max/min clamps over weight_pct, potency_class, target_kg and max_use_ppm."

      - name: retention_interval_adjacency_does_not_occupy_slots
        claim_type: interval_merge
        grounds:
          - calculations.retention_slot_occupancy
          - errors.ERR_CABINET_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / retention_half_open_adjacency_admitted_then_straddling_aliquot_overflows
          rationale: "That instance admits the touching interval (stored_until == stored_from) and then rejects the straddling aliquot, covering both the adjacency and overlap branches."

      - name: mass_ledger_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.sample_mass_ledger
          - entities.SampleLot.fields.available_g
        excluded_because:
          difficulty_instance: compensating_invariant / lot_gram_mass_conserved_across_shipment_cancel_and_retention_withdraw
          rationale: "That instance walks allocated_g/available_g forward through three allocations and back through two reversals, asserting the running total at each step."

  - section: validations
    instances:

      - name: duplicate_brief_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - entities.CustomerBrief.fields.brief_code
          - errors.ERR_DUPLICATE_CODE
        distinguishing_aspect: "A second brief with brief_code BRF-0001 returns ERR_DUPLICATE_CODE (409) while brf-0001 in lower case is accepted, because uniqueness is compared case-sensitively."
        test_recipe:
          setup:
            - "One brief already exists with brief_code BRF-0001."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Alpine Snacks", matrix_type: "BAKERY_SWEET", target_profile: "RED_FRUIT", dosage_pct: 0.5, annual_volume_kg: 200, cost_in_use_cap_cents_per_tonne: 90000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_CODE"
            - "GET /customer-briefs returns total_count == 1"

      - name: component_at_the_max_use_ceiling_admitted_then_next_increment_rejected
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=57]
          - entities.RawMaterial.fields.max_use_ppm
          - errors.ERR_MAX_USE_EXCEEDED
        distinguishing_aspect: "With max_use_ppm 20000 the ceiling is exactly 2.0000 weight-%: a line at 2.0000 is created 201, and a line at 2.0001 returns ERR_MAX_USE_EXCEEDED (422) even though total_weight_pct 4.0001 is still far below 100."
        test_recipe:
          setup:
            - "Material HI-VANILLIN with max_use_ppm 20000 (ceiling 2.0000 weight-%)."
            - "Brief BRF-0001 accepted; formula F1 is DRAFT with no components."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "HI-VANILLIN", name: "Vanillin Crystals", cost_per_kg_cents: 4500, natural_status: "NATURE_IDENTICAL", potency_class: "HIGH_IMPACT", max_use_ppm: 20000 }
              as: PurchasingManager
              captures: { m_hi: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
          trigger:
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m_hi}", weight_pct: 2.0 }
              as: Flavorist
              captures: { c_ok: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m_hi}", weight_pct: 2.0001 }
              as: Flavorist
              captures: { err: "$.data.error_id" }
          assert:
            - "first trigger call returns HTTP status == 201"
            - "FormulaComponent.${c_ok}.weight_pct == 2.0000 and FormulaComponent.${c_ok}.sequence_no == 1"
            - "second trigger call returns HTTP status == 422"
            - "data.error_id == ERR_MAX_USE_EXCEEDED"
            - "Formula.${f1}.component_count == 1"
            - "Formula.${f1}.total_weight_pct == 2.0000"

      - name: component_type_raw_material_with_sub_formula_id_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - entities.FormulaComponent.fields.component_type
          - errors.ERR_COMPONENT_TYPE_MISMATCH
        distinguishing_aspect: "component_type RAW_MATERIAL carrying a sub_formula_id returns ERR_COMPONENT_TYPE_MISMATCH (422); the polymorphic shape rule fires on the extra reference field even though both ids exist."
