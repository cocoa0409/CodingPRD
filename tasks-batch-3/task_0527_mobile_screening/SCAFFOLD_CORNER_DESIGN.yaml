  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_settle_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[charge-settle-stale]", state_machines.Charge.ADJUDICATED_to_SETTLED, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Charge.version: after adjudication advances the charge version, a settle carrying the pre-adjudication version (captured before adjudicate) is rejected with ERR_STALE_VERSION (412); charge stays ADJUDICATED."
        test_recipe:
          setup: ["One SELF_PAY skin charge adjudicated; client still holds the DRAFT-era version."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van S", modality: "SKIN", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech Skin", role_type: "TECHNOLOGIST", modality: "SKIN" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "SKIN", site_label: "L3", event_date: "2026-06-12", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat S", date_of_birth: "1985-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges?appointment_id=${appt_id}", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id", ch_v_draft: "$.data[0].version" } }
            - { call: "POST /charges/${charge_id}/adjudicate", payload: { expected_charge_version: "${ch_v_draft}" }, as: BillingClerk }
          trigger:
            - { call: "POST /charges/${charge_id}/settle", payload: { expected_charge_version: "${ch_v_draft}" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "Charge.${charge_id}.status == ADJUDICATED"

      - name: occ_adjudicate_stale_version_after_void_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[charge-adjudicate-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Charge.version via a deliberately stale expression: a client adjudicating with expected_charge_version = ${draft_version} - 1 (one below actual) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["One SELF_PAY skin charge in DRAFT; client submits a version one lower than actual."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van S", modality: "SKIN", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech Skin", role_type: "TECHNOLOGIST", modality: "SKIN" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "SKIN", site_label: "L3", event_date: "2026-06-12", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat S", date_of_birth: "1985-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges?appointment_id=${appt_id}", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id", ch_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /charges/${charge_id}/adjudicate", payload: { expected_charge_version: "${ch_v} - 1" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "Charge.${charge_id}.status == DRAFT"

      - name: event_cancel_cascade_cancels_pending_reminder
        claim_type: cascading_side_effects
        grounds: [state_machines.ScreeningEvent.PUBLISHED_to_CANCELLED, state_machines.Reminder.PENDING_to_CANCELLED]
        distinguishing_aspect: "Cancelling a PUBLISHED event cascades to a PENDING reminder on one of its SCHEDULED appointments: the reminder transitions PENDING->CANCELLED as hop 2 of the cascade."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event with a SCHEDULED appointment and a PENDING reminder on that appointment."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /reminders", payload: { appointment_id: "${appt_id}", send_at_min: 500, channel: "SMS" }, as: ProgramManager, captures: { rem_id: $.data.id } }
          trigger:
            - { call: "POST /screening-events/${event_id}/cancel", payload: {}, as: ProgramManager }
            - { call: "GET /reminders/${rem_id}", payload: {}, as: ProgramManager, captures: { rem_status: $.data.status } }
          assert:
            - "Reminder.${rem_id}.status == CANCELLED"
            - "Appointment.${appt_id}.status == CANCELLED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: dual_variant_billing_covered_by_difficulty
