  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_mode_a_tiered_rush_floor_interaction
        grounds:
          - calculations.quote_pricing
          - endpoints."POST /ct/training-agreements/{id}/quote"
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (tiered headcount, ON_CAMPUS venue-hour cost,
          rush window) with non-linear interaction (marginal tiers + additive venue cost +
          multiplicative rush uplift) yields exactly 1661000; the two dual_variant_calc
          instances do not exercise rush or venue-hour inputs.
        test_recipe:
