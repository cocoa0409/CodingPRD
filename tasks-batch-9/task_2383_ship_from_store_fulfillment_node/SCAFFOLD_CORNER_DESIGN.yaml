              as_user_id: "${s5}"
            - call: "GET /fulfillment-network/orders/${o1}/cost-comparison"
              payload: {}
              as: NetworkPlanner
          assert:
            - "the provisional pass: assignment provisional_cost_cents == 875 (12 reserved minutes * 25 = 300 labour + 145 packaging + 430 freight), fee == 53 from exactly 52.5, store_cost 928, cost_index_bps 4711 against dc_baseline 1970"
            - "the final pass: labor_minutes_actual == 20, measured from accepted_at 09:05:00Z to packed_at 09:25:00Z and NOT from picked_at 09:06:00Z (which would give 19)"
            - "assignment final_cost_cents == 1075 (20 * 25 = 500 labour + 145 packaging + 430 freight)"
            - "the final fee == 65 from exactly 64.5, so CustomerOrder.${o1}.final_cost_cents == 1140"
            - "CustomerOrder.${o1}.cost_variance_cents == 212 and cost_index_bps == 5787 (1140 * 10000 / 1970 = 5786.80 -> 5787)"
            - "the freight leg itself is rounded once: (380 zone-delta-1 base + 25 * ceil(800/500 -> 2 steps)) * 1.00 = 430 exactly"
            - "banker's rounding would give 52 and 64, yielding 927 and 1139 with cost_index 5782; those values must NOT appear"

      - name: pick_deadline_is_clamped_by_the_cutoff_instant_not_the_sla
        claim_type: threshold
        grounds:
          - calculations.assignment_pick_deadline
          - constants.PICK_SLA_MINUTES
        distinguishing_aspect: "The deadline is a min() of two thresholds and this fixture makes the CUTOFF the binding one: a 14:00 commit at S3-SUBURB (cutoff minute 960 = 16:00Z) yields pick_deadline 16:00Z, not the 18:00Z that PICK_SLA_MINUTES alone would give."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:00:00Z; node S3-SUBURB (origin_zone 2, cutoff_utc_minutes 960) is the only node; SKU-A with 20 on hand / 2 safety; order O1 line SKU-A x2 to zone 4 GROUND."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s3}", sku_id: "${sku_a}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-A401", customer_ref: "C-241", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T20:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
          assert:
            - "FulfillmentAssignment.${a1}.pick_deadline_utc == 2026-08-03T16:00:00Z (min(14:00 + 240 min = 18:00, cutoff instant 16:00))"
            - "the SLA-only reading 2026-08-03T18:00:00Z must NOT appear"
            - "FulfillmentAssignment.${a1}.status == ASSIGNED with provisional_cost_cents 985 (14 reserved minutes * 20 = 280 labour + 160 packaging + 545 freight for zone delta 2 and 4 weight steps)"
            - "CustomerOrder.${o1}.provisional_cost_cents == 1044 (pre-fee 985, fee 59) and cost_index_bps == 4995"

      - name: routing_score_weights_coverage_cost_speed_and_node_health
        claim_type: weighted_scoring
        grounds:
          - calculations.routing_candidate_evaluation
          - calculations.store_eligibility_score
        distinguishing_aspect: "Every weighted component of the single candidate is pinned: coverage 1.0000 * 45, cost factor (2000-875)/1600 = 0.7031 * 25, speed factor (6-2)/5 = 0.8000 * 20 and health 63.00/100 = 0.6300 * 10, summing to routing_score 84.88 with no probation penalty."
        test_recipe:
          setup:
            - "Clock 09:00; node S5-ANNEX (capacity 100, staffed 400 minutes, origin_zone 3) is the only node, cold-started at eligibility_score 63.00; SKU-A with 10 on hand / 2 safety; order O1 line SKU-A x1 to zone 4 GROUND."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S5-ANNEX", region_code: "EAST", origin_zone: 3, daily_unit_capacity: 100, staffed_labor_minutes: 400, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 25, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s5: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s5}", sku_id: "${sku_a}", on_hand_units: 10, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-A501", customer_ref: "C-251", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 1, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "PROVISIONAL", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/routing-candidates"
              payload: { routing_run_id: "${run1}" }
              as: NetworkPlanner
              captures: { cand1: "$.data[0].id" }
          assert:
            - "Store.${s5}.eligibility_score == 63.00 (capacity 40 * 100/200 = 20.0000, labour 30 * 400/480 = 25.0000, cold-start performance 30 * 0.60 = 18.0000)"
            - "RoutingCandidate.${cand1}: eligible true, ineligible_reason null, coverage_units 1, coverage_ratio 1.0000, cost_estimate_cents 875, delivery_days 2"
            - "RoutingCandidate.${cand1}.routing_score == 84.88 (45 * 1.0000 + 25 * 0.7031 + 20 * 0.8000 + 10 * 0.6300 = 84.8775 -> 84.88)"
            - "RoutingCandidate.${cand1}.rank == 1 and selected == false, assigned_units == 0: a PROVISIONAL run ranks without committing"
            - "RoutingRun.${run1}.mode == PROVISIONAL, status == EVALUATED, selected_store_count == 0, projected_cost_cents == 928, projected_cost_index_bps == 4711"
            - "CustomerOrder.${o1}.routing_status is re-derived to UNROUTABLE (a RoutingRun exists but covered_units is 0) and unassigned_units stays 1"

      - name: window_aggregation_over_the_epoch_cohort
        claim_type: aggregation
        grounds:
          - calculations.node_performance_metrics
        excluded_because:
          difficulty_instance: boundary_precision_check / fill_rate_exactly_at_the_floor_does_not_breach_while_one_tenth_lower_does
          rationale: "The aggregation claim for node_performance_metrics - summing units_promised and units_shipped over the epoch cohort and dividing to a 4-decimal fill_rate - is exercised at its decision boundary by the boundary_precision_check instance of that name in §1.8, which pins 9/10 = 0.9000 not breaching and 8/10 = 0.8000 breaching."
      - name: network_fee_tier_selection
        claim_type: tiered_pricing
        grounds:
          - calculations.order_cost_per_order_comparison
        excluded_because:
          difficulty_instance: combinatorial_formula / network_fee_tier_keyed_on_pre_fee_subtotal_not_store_cost
          rationale: "The tiered_pricing claim - that the 0.060 / 0.045 / 0.030 band is keyed on pre_fee_subtotal_cents and never re-keyed on store_cost_cents after the fee is added - is the combinatorial_formula instance of that name in §1.8, which pins the correct band and the wrong-band value that must not appear."
      - name: overlapping_pick_interval_load
        claim_type: interval_merge
        grounds:
          - calculations.concurrent_pick_labor_load
        excluded_because:
          difficulty_instance: resource_temporal_overlap / concurrent_pick_labor_counts_only_overlapping_pick_intervals
          rationale: "The interval_merge claim for concurrent_pick_labor_load - summing labour only over assignments whose [accepted_at, pick_deadline_utc) intervals overlap the candidate interval - is the resource_temporal_overlap instance of that name in §1.8, which pins an accept that succeeds only because an earlier interval has already elapsed."
      - name: routing_status_projection_over_persisted_rows
        claim_type: projection
        grounds:
          - calculations.order_routing_status_derivation
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_routing_status_cycles_routed_to_routing_and_back_to_routed
          rationale: "The projection claim for order_routing_status_derivation - routing_status as a pure first-match predicate over covered / open / cancelled / dc_fallback unit sums - is the non_linear_state_machine instance of that name in §1.8, which drives the projection through ROUTED -> ROUTING -> ROUTED on unchanged inputs other than the persisted rows."
      - name: node_selection_waterfall_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.routing_node_selection_waterfall
        excluded_because:
          difficulty_instance: boundary_precision_check / routing_run_flips_at_available_to_promise_exactly_zero
          rationale: "The waterfall_allocation claim for routing_node_selection_waterfall - the filter clauses, the per-iteration allocation of min(remaining, coverage) and the exit conditions - is exercised at the filter's exact boundary by the boundary_precision_check instance of that name in §1.8, where available_to_promise 0 empties the pool and 1 fills it."
      - name: provisional_versus_final_cost_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.assignment_fulfillment_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / assignment_provisional_cost_versus_final_cost_at_ship
          rationale: "The variant_divergence claim for assignment_fulfillment_cost - reserved standard minutes and derived package versus billable actual minutes and the package actually used - is the dual_variant_calc instance of that name in §1.8, which pins both variants and their difference on one assignment."
      - name: eligibility_score_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.store_eligibility_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / node_posture_score_diverges_from_governance_review_score
          rationale: "The variant_selection claim for store_eligibility_score - cold_start versus trailing_window versus governance_blended, chosen by the call site rather than by the inputs - is the dual_variant_calc instance of that name in §1.8, which pins the two different numbers the same node carries at the same instant."
      - name: demand_unit_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.order_demand_units_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / order_demand_units_stay_conserved_across_all_five_buckets
          rationale: "The reconciliation claim for order_demand_units_reconciliation - quantity == assigned + shipped + cancelled + dc_fallback + open at every observation point - is the compensating_invariant instance of that name in §1.8, which walks a reject, a reroute, a DC hand-off and a cancel while re-checking the identity after each step."

  - section: validations
    instances:
      - name: adding_a_line_after_the_first_routing_run_returns_order_lines_locked
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - errors.ERR_ORDER_LINES_LOCKED
        distinguishing_aspect: "Demand is frozen the moment any RoutingRun exists: a third line added after even a PROVISIONAL run returns 409 ERR_ORDER_LINES_LOCKED and leaves total_units at 2."
        test_recipe:
          setup:
            - "Clock 09:00; node S1; SKU-A 20/2; order O1 with one line SKU-A x2; one PROVISIONAL routing run has been executed, so routing_status is no longer UNROUTED."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-B001", customer_ref: "C-301", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "PROVISIONAL", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 1, unit_price_cents: 4500 }
