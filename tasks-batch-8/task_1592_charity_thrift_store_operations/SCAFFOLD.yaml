    side_effects: ["stops SCHEDULED -> CANCELLED", "PickupRoute.version += 1"]
  - method: POST
    path: "/api/pickup-stops/{stop_id}/depart"
    description: "SCHEDULED -> EN_ROUTE (route IN_PROGRESS, acting driver owns route, earlier stops terminal)"
    roles: [Driver]
    code: 200
    input: []
    output: PickupStop
    side_effects: ["PickupStop.version += 1"]
  - method: POST
    path: "/api/pickup-stops/{stop_id}/complete"
    description: "EN_ROUTE -> COMPLETED; auto-creates the donor's PICKUP_STOP DonationBatch"
    roles: [Driver]
    code: 200
    input: []
    output: PickupStop
    side_effects: ["creates DonationBatch {source=PICKUP_STOP, receipt_requested=true, status=OPEN}", "completed_batch_id set", "PickupStop.version += 1"]
  - method: POST
    path: "/api/pickup-stops/{stop_id}/no-show"
    description: "EN_ROUTE -> NO_SHOW"
    roles: [Driver]
    code: 200
    input: []
    output: PickupStop
    side_effects: ["PickupStop.version += 1"]
  - method: POST
    path: "/api/pickup-stops/{stop_id}/reschedule"
    description: "From a NO_SHOW stop, create a NEW SCHEDULED stop on a target route in DRAFT or PUBLISHED (window conflict + capacity checks run against the target)"
