      - name: loyalty_bands_apply_at_their_exact_inclusive_floors
        claim_type: constants_applied
        grounds:
          - calculations.guest_loyalty_tier.constants
          - entities.Guest.fields.loyalty_tier
          - entities.Guest.fields.repeat_guest_offer_pct
        distinguishing_aspect: |
          All three floors are probed at floor-1, floor and floor+1 in one sweep, and the MEMBER
          band is the trap: a guest with exactly 1 prior sailing IS a MEMBER but earns
          MEMBER_PCT 0.00, so tier membership and a non-zero offer are separate facts. The
          highest-band-first evaluation also matters - a guest with 7 prior sailings must be
          PLATINUM, not GOLD.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; an empty database. No sailing is required because the tier is derived at guest creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /guests"
              payload: { full_name: "Zero Prior", email: "p0@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g0: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "One Prior", email: "p1@example.com", prior_sailings_count: 1 }
              as: ReservationAgent
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Two Prior", email: "p2@example.com", prior_sailings_count: 2 }
              as: ReservationAgent
              captures: { g2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Three Prior", email: "p3@example.com", prior_sailings_count: 3 }
              as: ReservationAgent
              captures: { g3: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Five Prior", email: "p5@example.com", prior_sailings_count: 5 }
              as: ReservationAgent
              captures: { g5: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Six Prior", email: "p6@example.com", prior_sailings_count: 6 }
              as: ReservationAgent
              captures: { g6: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Seven Prior", email: "p7@example.com", prior_sailings_count: 7 }
              as: ReservationAgent
              captures: { g7: $.data.id }
          assert:
            - "Guest.${g0}.loyalty_tier == NONE and repeat_guest_offer_pct == 0.00 (below MEMBER_FLOOR 1)"
            - "Guest.${g1}.loyalty_tier == MEMBER and repeat_guest_offer_pct == 0.00 (exactly at MEMBER_FLOOR, and MEMBER_PCT is 0.00)"
            - "Guest.${g2}.loyalty_tier == MEMBER and repeat_guest_offer_pct == 0.00 (one below GOLD_FLOOR)"
            - "Guest.${g3}.loyalty_tier == GOLD and repeat_guest_offer_pct == 0.03 (exactly at GOLD_FLOOR 3)"
            - "Guest.${g5}.loyalty_tier == GOLD and repeat_guest_offer_pct == 0.03 (one below PLATINUM_FLOOR)"
            - "Guest.${g6}.loyalty_tier == PLATINUM and repeat_guest_offer_pct == 0.05 (exactly at PLATINUM_FLOOR 6)"
            - "Guest.${g7}.loyalty_tier == PLATINUM and repeat_guest_offer_pct == 0.05 - highest band first, never GOLD"
            - "GET /guests?loyalty_tier=GOLD returns total_count == 2"

      - name: occupancy_pct_and_ralbd_round_half_up_at_two_and_zero_decimals
        claim_type: precision
        grounds:
          - calculations.sailing_occupancy_posture.precision
          - calculations.sailing_ralbd.precision
        distinguishing_aspect: |
          A 32-berth ship makes every occupancy ratio land on a third decimal of exactly 5, which
          separates round_half_up from banker's rounding: 1/32 is 3.125 -> 3.13 (banker's would
          say 3.12), 5/32 is 15.625 -> 15.63 (banker's would say 15.62). The same fixture then
          pins the integer-cents rounding of RALBD, where 467500 / 128 == 3652.34375 truncates
          nothing and rounds to 3652.
