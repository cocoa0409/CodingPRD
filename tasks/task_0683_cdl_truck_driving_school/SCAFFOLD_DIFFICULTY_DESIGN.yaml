              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/sponsorship-offers"
              payload: { carrier_id: "${car_id}" }
              as: Registrar
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /sponsorship-offers/${off_id}/accept"
              payload: {}
              as: Registrar
          assert:
            - "SponsorshipOffer.${off_id}.status == ACCEPTED"
            - "Enrollment.${enr_id}.sponsoring_carrier_id == ${car_id}"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complete_session_requires_enrollment_training
        grounds:
          - state_machines.ClockSession.BOOKED_to_COMPLETED
          - entities.Enrollment.fields.status
          - errors[ERR_ENROLLMENT_NOT_TRAINING]
        distinguishing_aspect: |
          ClockSession->Enrollment dependency: a BOOKED ClockSession may only be COMPLETED while its owning
          Enrollment.status == TRAINING; if the enrollment reverted to PREREQ_PENDING (a prereq expired),
          completing the session is rejected with ERR_ENROLLMENT_NOT_TRAINING.
        test_recipe:
          setup:
            - "Enrollment E reaches TRAINING (both prereqs approved) and books a CLASSROOM session; then DOT-medical is expired, reverting E to PREREQ_PENDING and auto-cancelling the BOOKED session. Completing it is now rejected because the owning enrollment is no longer TRAINING."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
