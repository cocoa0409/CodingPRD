            - call: "POST /nabs/tasting-events/${ev11b_id}/flight-items"
              payload: { sku_id: "${sku11_id}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${ev11b_id}/publish"
              as: ShopStaff
            - call: "GET /nabs/tasting-events/${ev11b_id}"
              as: ShopStaff
              captures:
                ev11b_v: "$.data.version"
            - call: "POST /nabs/tasting-events/${ev11b_id}/seats"
              payload: { member_id: "${member11_id}", expected_event_version: "${ev11b_v}" }
              as: Member
              as_user_id: "${member11_id}"
              captures:
                seat11b_id: "$.data.id"
            - call: "POST /nabs/tasting-seats/${seat11b_id}/confirm"
              as: Member
              as_user_id: "${member11_id}"
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/tasting-seats/${seat11b_id}/check-in"
              as: ShopStaff
            - call: "GET /nabs/members/${member11_id}"
              as: ShopStaff
              captures:
                tier_5000: "$.data.loyalty_tier"
                lifetime_5000: "$.data.loyalty_points_lifetime"
          assert:
            - "After first check-in: lifetime == 4999 AND tier == 'BRONZE' (strictly below threshold)"
            - "After second check-in: lifetime == 5000 AND tier == 'SILVER' (>= boundary flips)"

      - name: tasting_event_capacity_zero_remaining_seats
        grounds:
