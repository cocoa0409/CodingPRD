# SCAFFOLD_DIFFICULTY_DESIGN.yaml - section 1.8 Test Targeting Index.
# Nine difficulty rules x 2 instances = 18 instances. Single top-level key: scaffold_difficulty_design.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: xp_award_streak_multiplier_tier_split
        grounds:
          - calculations.ComputePracticeXpAward
          - entities.Learner.fields.program_tier
          - state_machines.LessonNode.transitions.UNLOCKED_to_BRONZE
        distinguishing_aspect: |
          The two variants of ComputePracticeXpAward differ by the learner's program_tier on the
          Learner entity, so the same lesson node, the same response_ms and the same streak length
          award 16 xp to a PLUS_FAMILY learner and 13 xp to a FREE learner.
        test_recipe:
          setup:
            - "learner Ada at program_tier PLUS_FAMILY holding a 2-qualified-day streak"
            - "learner Bea at program_tier FREE holding a 2-qualified-day streak"
            - "both learners hold an UNLOCKED lesson node in the same course unit, both at 10 energy units"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /learners"
              payload: { display_name: "Bea", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { bea: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 3 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 3, prerequisite_node_id: "${n12}" }
              as: PlatformAdmin
              captures: { n13: $.data.id }
            - call: "POST /subscriptions"
              payload: { learner_id: "${ada}", plan_code: "PLUS_FAMILY", seats_total: 4, auto_renew: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { ada_sub: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${bea}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${bea}"
            - call: "PATCH /learners/${ada}"
              payload: { expected_learner_version: "${ada_v}", timezone_id: "Etc/GMT+1" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-02T09:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { ada_attempt: $.data.id }
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${bea}", recorded_at: "2026-09-02T09:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${bea}"
              captures: { bea_attempt: $.data.id }
          assert:
            - "PracticeAttempt.${ada_attempt}.xp_awarded == 14"
            - "PracticeAttempt.${bea_attempt}.xp_awarded == 13"
            - "Learner.${ada}.streak_anchor_date != Learner.${bea}.streak_anchor_date"
      - name: placement_hard_cap_anchor_by_session_grade
        grounds:
          - calculations.ComputePlacementBand
          - entities.PlacementTest.fields.is_institution_graded
          - state_machines.PlacementTest.transitions.SCORED_to_CALIBRATED
        distinguishing_aspect: |
          The two variants of ComputePlacementBand differ by PlacementTest.is_institution_graded,
          so identical sub-scores and identical course progress yield placed_unit_index 1 for the
          self-serve session and placed_unit_index 2 with a B2 band for the institution-graded one.
        test_recipe:
          setup:
            - "learner Ada with course unit 1 COMPLETED and unit 2 IN_PROGRESS"
            - "a CREATED self-serve placement session (proctor_user_id empty) for Ada"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "CERTIFICATION_ELITE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 2, title: "Unit 2", cefr_band: "B1", unlock_index: 1, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit2: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /course-units/2/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n21: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n21}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T01:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "PATCH /learners/${ada}"
              payload: { expected_learner_version: "${ada_v}", display_name: "Ada" }
              as: PlatformAdmin
              captures: { ada_v2: $.data.version }
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit2}", administered_at: "2026-09-01T02:00:00Z", total_items: 10, expected_learner_version: "${ada_v2}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt: $.data.id }
          trigger:
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "SUBMIT_SCORES", comprehension_score: 120, accuracy_score: 80 }
              as: Learner
              as_user_id: "${ada}"
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "CALIBRATE" }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt_id: $.data.id }
          assert:
            - "PlacementTest.${pt_id}.placed_unit_index == 1"
            - "PlacementTest.${pt_id}.calibrated_cefr_band == \"A2\""
            - "PlacementTest.${pt_id}.status == \"CALIBRATED\""
  - rule_id: combinatorial_formula
    instances:
      - name: league_weekly_xp_per_attempt_rounding_vs_sum_then_round
        grounds:
          - calculations.ComputeLeagueRanking
          - calculations.ComputePracticeXpAward
          - state_machines.LeagueStanding.transitions.GOOD_STANDING_to_PROMOTED
        distinguishing_aspect: |
          ComputeLeagueRanking's settlement variant pins per-attempt round_half_up before summation
          while its reopen variant rounds the exact sum once, so ten attempts of exact 7.5 xp settle
          weekly_xp at 80 and re-rank at 75, moving the standing across the promotion cutoff.
        test_recipe:
          setup:
            - "a BRONZE league for the week starting 2026-09-21 anchored on Ada"
            - "Ada holds five accepted attempts on her UNLOCKED node, all inside the league week"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "PLUS_FAMILY" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /leagues"
              payload: { tier: "BRONZE", week_start: "2026-09-21T00:00:00Z", learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { lg: $.data.id, st_ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-23T10:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-24T10:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-25T10:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-26T10:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-27T10:00:00Z", response_ms: 2500, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PUT /leagues/${lg}"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
            - call: "GET /league-standings"
              payload: { league_id: "${lg}", learner_id: "${ada}" }
              as: PlatformAdmin
              captures: { ada_rank: $.data.0.rank, ada_xp_settled: $.data.0.weekly_xp }
          assert:
            - "LeagueStanding.${st_ada}.weekly_xp == ${ada_xp_settled}"
            - "LeagueStanding.${st_ada}.weekly_xp == 80"
            - "the settlement rounded each attempt's exact 15.5 xp before summing, yielding 80 while the sum-then-round variant yields 75"
            - "LeagueStanding.${st_ada}.settled_outcome == \"PROMOTED\""
      - name: skill_decay_review_interval_nested_rounding
        grounds:
          - calculations.ComputeSkillDecayAndReviewSchedule
          - state_machines.LessonNode.transitions.BRONZE_to_DECAYED
          - state_machines.CourseUnit.transitions.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          ComputeSkillDecayAndReviewSchedule pins the day count by truncating the elapsed seconds
          before the grace division, so a node reviewed ten days ago reads decay_meter 5 and crosses
          to DECAYED, while evaluating the grace division on unrounded elapsed seconds first raises the
          point count and decodes the node one day earlier.
        test_recipe:
          setup:
            - "Ada holds a BRONZE lesson node last reviewed at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "SKILL_DECAY" }
              as: PlatformAdmin
          trigger:
            - call: "GET /lesson-nodes?unit_id=${unit1}"
              payload: { unit_id: "${unit1}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_state: $.data.0.state, n11_meter: $.data.0.decay_meter, n11_v2: $.data.0.version }
          assert:
            - "LessonNode.${n11}.decay_meter == ${n11_meter}"
            - "LessonNode.${n11}.decay_meter == 5"
            - "LessonNode.${n11}.state == \"DECAYED\""
            - "CourseUnit.${unit1}.state == \"IN_PROGRESS\""
  - rule_id: non_linear_state_machine
    instances:
      - name: lesson_node_decay_and_prerequisite_fork
        grounds:
          - state_machines.LessonNode.transitions.BRONZE_to_DECAYED
          - state_machines.LessonNode.transitions.DECAYED_to_UNLOCKED
          - state_machines.LessonNode.transitions.DECAYED_to_LOCKED
          - entities.LessonNode.fields.decay_level
        distinguishing_aspect: |
          LessonNode branches at DECAYED into UNLOCKED when decay_level is below DECAY_LEVEL_FLOOR and
          into LOCKED at the floor, while the same machine carries a cycle that re-decays the restored
          node — a fork-join plus cycle shape rather than a linear pipeline.
        test_recipe:
          setup:
            - "Ada holds a BRONZE lesson node whose successor node is UNLOCKED"
            - "both nodes are due for review, so one decay sweep demotes the predecessor and locks the successor"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id, n12_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lesson-nodes/${n12}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-02T01:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_events/auto-transition"
              payload: { event_type: "SKILL_DECAY" }
              as: PlatformAdmin
          trigger:
            - call: "PUT /lesson-nodes/${n11}/review"
              payload: { learner_id: "${ada}", expected_node_version: "${n11_v}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_v2: $.data.version }
            - call: "GET /lesson-nodes?unit_id=${unit1}"
              payload: { unit_id: "${unit1}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_state: $.data.0.state, n11_meter: $.data.0.decay_meter, n12_state: $.data.1.state }
          assert:
            - "LessonNode.${n11}.state == \"UNLOCKED\""
            - "LessonNode.${n11}.state == ${n11_state}"
            - "LessonNode.${n11}.decay_meter == 0"
            - "LessonNode.${n12}.state == ${n12_state}"
            - "LessonNode.${n12}.state == \"UNLOCKED\""
      - name: placement_scored_calibrated_cycle_with_certified_branch
        grounds:
          - state_machines.PlacementTest.transitions.SCORED_to_CALIBRATED
          - state_machines.PlacementTest.transitions.CALIBRATED_to_SCORED
          - state_machines.PlacementTest.transitions.SCORED_to_CERTIFIED
          - entities.PlacementTest.fields.calibrated_cefr_band
        distinguishing_aspect: |
          PlacementTest loops SCORED -> CALIBRATED -> SCORED on each re-score while branching to
          CERTIFIED only when the calibrated band is B2 or C1, so the same machine exhibits a cycle
          and a guarded fork rather than a single forward path.
        test_recipe:
          setup:
            - "Ada holds a placement session calibrated to band B1 at placed_unit_index 1"
            - "the single course unit is IN_PROGRESS and its only node is SILVER"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "CERTIFICATION_ELITE" }
              as: Anonymous
              captures: { ada: $.data.id, ada_v: $.data.version }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "B1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
            - call: "PATCH /learners/${ada}"
              payload: { expected_learner_version: "${ada_v}", display_name: "Ada" }
              as: PlatformAdmin
              captures: { ada_v2: $.data.version }
            - call: "POST /placement-tests"
              payload: { learner_id: "${ada}", course_id: "${unit1}", administered_at: "2026-09-01T02:00:00Z", total_items: 20, expected_learner_version: "${ada_v2}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt: $.data.id }
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "SUBMIT_SCORES", comprehension_score: 120, accuracy_score: 80 }
              as: Learner
              as_user_id: "${ada}"
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "CALIBRATE" }
              as: Learner
              as_user_id: "${ada}"
          trigger:
            - call: "PUT /placement-tests/${pt}"
              payload: { action: "SUBMIT_SCORES", comprehension_score: 100, accuracy_score: 60 }
              as: Learner
              as_user_id: "${ada}"
              captures: { pt_id: $.data.id, pt_v: $.data.version }
          assert:
            - "PlacementTest.${pt_id}.status == \"SCORED\""
            - "PlacementTest.${pt_id}.calibrated_cefr_band == null"
            - "PlacementTest.${pt_id}.placed_unit_index == 2"
            - "LessonNode.${n11}.state == \"BRONZE\""
  - rule_id: transitive_cascade
    instances:
      - name: decay_cascade_learner_league_engagement
        grounds:
          - state_machines.LessonNode.transitions.GOLD_to_DECAYED
          - state_machines.LessonNode.transitions.LEGENDARY_to_DECAYED
          - state_machines.LeagueStanding.transitions.GOOD_STANDING_to_DEMOTED
          - state_machines.League.transitions.SETTLING_to_CLOSED
        distinguishing_aspect: |
          One decay sweep on a GOLD node propagates through four links that span two entity domains —
          the GOLD node itself, then its UNLOCKED successor node, then the learner's LeagueStanding,
          then the demotion sweep's own lesson-node decay_meter mutation — each hop caused by the hop
          immediately before it.
        test_recipe:
          setup:
            - "Ada holds a GOLD node with an UNLOCKED successor and a GOOD_STANDING league standing in a league whose week has closed"
            - "the successor node and the GOLD node are both due for review"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "PLUS_FAMILY" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "B1", unlock_index: 0, total_nodes: 2 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 2, prerequisite_node_id: "${n11}" }
              as: PlatformAdmin
              captures: { n12: $.data.id }
            - call: "POST /leagues"
              payload: { tier: "GOLD", week_start: "2026-09-21T00:00:00Z", learner_id: "${ada}" }
              as: Learner
              as_user_id: "${ada}"
              captures: { lg: $.data.id, st_ada: $.data.id }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T01:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T02:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_events/auto-transition"
              payload: { event_type: "SKILL_DECAY" }
              as: PlatformAdmin
            - call: "PUT /leagues/${lg}"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          assert:
            - "LessonNode.${n11}.state == \"DECAYED\""
            - "LessonNode.${n11}.decay_meter == 0"
            - "LessonNode.${n12}.state == \"LOCKED\""
            - "LeagueStanding.${st_ada}.settled_outcome == \"DEMOTED\""
            - "LeagueStanding.${st_ada}.weekly_xp == 0"
      - name: subscription_lapse_cascade_seat_heart_cadence
        grounds:
          - state_machines.Subscription.transitions.IN_GRACE_to_EXPIRED
          - state_machines.FamilyMembership.transitions.ACTIVE_to_REMOVED
          - calculations.ComputeHeartAndEnergyLimits
          - calculations.ComputeNotificationCadence
        distinguishing_aspect: |
          The grace-window lapse starts at Subscription, propagates to the FamilyMembership seat, then
          to the member's heart allowance and energy accrual, and finally to that member's issued
          engagement offer, each hop caused by the hop before it.
        test_recipe:
          setup:
            - "Ada owns a PLUS_FAMILY subscription with a 4-seat quota in IN_GRACE"
            - "Bea occupies one ACTIVE seat and holds an ISSUED engagement offer"
          setup_api_calls:
