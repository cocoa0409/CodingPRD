          Depth-3 cascade triggered by the reconciliation edge - a different trigger from
          the adjudication cascade: lot becomes DISCREPANT -> a system IrregularityReport
          is created in SUBMITTED -> the window's open_breach_count and security_hold
          rise, which is what later refuses SCORING -> RELEASED.
