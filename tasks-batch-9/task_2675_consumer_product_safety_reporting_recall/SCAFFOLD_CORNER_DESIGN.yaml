          A read that must carry TWO derived money figures at once and keep them
          apart: the frozen assessment (4 violations x HOSPITALIZATION 1.25 x
          lateness 1.10 = 5500000) and the non-binding preview keyed on that same
          assessment because no offer stands yet (TIER_2 at 15% -> credit 825000 ->
          4675000). The binding settlement fields must all still be empty, and the
          reserve partition must read 0 / 5500000. An implementation that populates
          consent_agreement_total_cents at creation, or that keys the preview on the
          post-credit total, is caught by a single GET.
