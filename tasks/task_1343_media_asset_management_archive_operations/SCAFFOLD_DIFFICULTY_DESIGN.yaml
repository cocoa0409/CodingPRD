# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Media Asset Management & Archive Operations
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_accrual
        grounds:
          - calculations.royalty_event_accrual
          - calculations.royalty_statement_totals
        distinguishing_aspect: |
          Same two usage events yield provisional_total_cents == 10850 (verify-time,
          event-local inputs) but total_accrual_cents == 9765 (close-time final variant
          applying the TIER_1 10% volume discount) — the divergence lives in the
          UsageEvent/RoyaltyStatement (royalty) domain.
        test_recipe:
          setup:
            - "Clock at 2026-07-01T00:00:00Z; asset (rights_holder ACME) exists"
            - "E1 VERIFIED: BROADCAST, market 6,000,000, 120s → provisional 2000"
            - "E2 VERIFIED: STREAMING, market 500,000, 3540s → provisional 8850"
            - "Statement OPEN for ACME [2026-07-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/staff-members"
              payload: { email: "req1@x.com", full_name: "Req One", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "Clip", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 600, size_gb: 50, rights_holder: "ACME", keywords: ["news"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "BROADCAST", market_size: 6000000, duration_seconds_used: 120, aired_at: "2026-07-10T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { e1: $.data.id }
            - call: "POST /archive/usage-events/${e1}/verify"
              payload: {}
              as: FinanceOfficer
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "STREAMING", market_size: 500000, duration_seconds_used: 3540, aired_at: "2026-07-15T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { e2: $.data.id }
            - call: "POST /archive/usage-events/${e2}/verify"
              payload: {}
              as: FinanceOfficer
            - call: "POST /archive/royalty-statements"
              payload: { rights_holder: "ACME", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOfficer
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /archive/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOfficer
          assert:
            - "RoyaltyStatement.${stmt_id}.volume_tier == TIER_1 (total 3660s >= 3600)"
            - "RoyaltyStatement.${stmt_id}.total_verified_seconds == 3660"
            - "RoyaltyStatement.${stmt_id}.provisional_total_cents == 10850"
            - "RoyaltyStatement.${stmt_id}.total_accrual_cents == 9765 (2000*0.9=1800 + 8850*0.9=7965)"

      - name: storage_cost_projected_vs_actual
        grounds:
          - calculations.storage_cost_cents
        distinguishing_aspect: |
          Same asset (100 GB, migrated ONLINE→NEARLINE completed 2026-08-06T00:00:00Z,
          read 2026-08-11T00:00:00Z) yields projected_cost_cents == 3150 (forward-looking:
          100 × 1.5 × 21 remaining days) but actual_cost_cents == 2750 (chronological:
          2000 ONLINE + 750 NEARLINE) — the divergence lives in the Asset/MigrationJob
          (storage) domain, a different entity domain than royalty_provisional_vs_final_accrual.
        test_recipe:
          setup:
            - "Asset 100 GB created at default clock 2026-08-01T00:00:00Z (ONLINE)"
            - "Migration ONLINE→NEARLINE completed at 2026-08-06T00:00:00Z"
            - "Clock at 2026-08-11T00:00:00Z"
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "Big", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 600, size_gb: 100, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id, a_v: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "NEARLINE", expected_asset_version: "${a_v}" }
              as: ArchivistLead
              captures: { job_id: $.data.id }
            - call: "POST /archive/migration-jobs/${job_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/migration-jobs/${job_id}/complete"
              payload: { checksum_sha256: "c1" }
              as: LabTechnician
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /archive/assets/${asset_id}/storage-cost"
              as: FinanceOfficer
          assert:
            - "storage-cost.projected_cost_cents == 3150"
            - "storage-cost.actual_cost_cents == 2750"
            - "projected_cost_cents != actual_cost_cents"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas in DIFFERENT modes (a), (c), (b)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_event_floor_and_ceil_interaction
        grounds:
          - calculations.royalty_event_accrual
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — ceil(10/30)=1 unit,
          SMALL market rate 100, PROMO multiplier 0.25, floor max(25, ...) — a PROMO
          event of 10s in a 100-person market lands exactly on the per-event floor:
          provisional_accrual_cents == 25, not 0 and not un-floored 25.0 rounding artifact.
        test_recipe:
          setup:
            - "Asset exists; event PROMO market_size 100 duration 10s REPORTED"
          setup_api_calls:
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "PROMO", market_size: 100, duration_seconds_used: 10, aired_at: "2026-08-01T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /archive/usage-events/${e1}/verify"
              payload: {}
              as: FinanceOfficer
          assert:
            - "UsageEvent.${e1}.provisional_accrual_cents == 25 (floor binding: ceil(10/30)*100*0.25 = 25)"
            - "UsageEvent.${e1}.status == VERIFIED"

      - name: statement_volume_tier_evaluation_order
        grounds:
          - calculations.royalty_statement_totals
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the volume tier is keyed on the
          statement's total seconds while each event's final accrual depends on the
          tier's discount. Pinned order (sum seconds → tier → per-event finals → sum)
          yields volume_tier == TIER_1 and total_accrual_cents == 29700 with
          provisional_total_cents == 33000 on identical swept data.
        test_recipe:
          setup:
            - "E1 VERIFIED: BROADCAST, market 6,000,000, 1800s → provisional 30000"
            - "E2 VERIFIED: REBROADCAST, market 100, 1800s → provisional 3000"
            - "Statement OPEN for ACME [2026-07-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 600, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "BROADCAST", market_size: 6000000, duration_seconds_used: 1800, aired_at: "2026-07-10T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { e1: $.data.id }
            - call: "POST /archive/usage-events/${e1}/verify"
              payload: {}
              as: FinanceOfficer
            - call: "POST /archive/usage-events"
              payload: { asset_id: "${asset_id}", reported_by_id: "${staff_id}", usage_type: "REBROADCAST", market_size: 100, duration_seconds_used: 1800, aired_at: "2026-07-11T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { e2: $.data.id }
            - call: "POST /archive/usage-events/${e2}/verify"
              payload: {}
              as: FinanceOfficer
            - call: "POST /archive/royalty-statements"
              payload: { rights_holder: "ACME", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOfficer
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /archive/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOfficer
          assert:
            - "RoyaltyStatement.${stmt_id}.total_verified_seconds == 3600"
            - "RoyaltyStatement.${stmt_id}.volume_tier == TIER_1"
            - "RoyaltyStatement.${stmt_id}.provisional_total_cents == 33000"
            - "RoyaltyStatement.${stmt_id}.total_accrual_cents == 29700 (30000*0.9=27000 + 3000*0.9=2700)"

      - name: storage_actual_round_per_interval_then_sum
        grounds:
          - calculations.storage_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — ACTUAL pins round-half-up PER INTERVAL then
          sum: 1 GB asset with intervals ONLINE 9.6h (1.6c→2), NEARLINE 9.6h (0.6c→1),
          ONLINE 4.8h (0.8c→1) yields actual_cost_cents == 4; the alternative
          sum-then-round order would yield 3, so the pinned order is observable.
        test_recipe:
          setup:
            - "Asset 1 GB created at 2026-08-01T00:00:00Z (ONLINE)"
            - "Migration ONLINE→NEARLINE completed 2026-08-01T09:36:00Z"
            - "Migration NEARLINE→ONLINE completed 2026-08-01T19:12:00Z"
            - "Clock at 2026-08-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "Tiny", description: "d", media_type: "AUDIO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 1, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id, v1: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "NEARLINE", expected_asset_version: "${v1}" }
              as: ArchivistLead
              captures: { j1: $.data.id }
            - call: "POST /archive/migration-jobs/${j1}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:36:00Z" }
              as: SystemAdmin
            - call: "POST /archive/migration-jobs/${j1}/complete"
              payload: { checksum_sha256: "c1" }
              as: LabTechnician
            - call: "GET /archive/assets/${asset_id}"
              as: ArchivistLead
              captures: { v2: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "ONLINE", expected_asset_version: "${v2}" }
              as: ArchivistLead
              captures: { j2: $.data.id }
            - call: "POST /archive/migration-jobs/${j2}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T19:12:00Z" }
              as: SystemAdmin
            - call: "POST /archive/migration-jobs/${j2}/complete"
              payload: { checksum_sha256: "c2" }
              as: LabTechnician
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /archive/assets/${asset_id}/storage-cost"
              as: FinanceOfficer
          assert:
            - "storage-cost.actual_cost_cents == 4 (2 + 1 + 1, per-interval round_half_up then sum)"
            - "storage-cost.projected_cost_cents == 120 (1 GB × 4c × 30 remaining days at ONLINE)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state machines on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_parallel_dimensions_and_recatalog_cycle
        grounds:
          - state_machines.Asset.ARCHIVED_to_IN_REVIEW
          - state_machines.Asset.IN_REVIEW_to_CATALOGED
          - entities.Asset.fields.storage_tier
        distinguishing_aspect: |
          Asset carries parallel state dimensions: driving catalog_status
          ARCHIVED → IN_REVIEW → CATALOGED (recatalog rework cycle) leaves the
          independently-migrated storage_tier == NEARLINE untouched — proof the
          catalog cycle and the tier dimension evolve independently on one entity.
        test_recipe:
          setup:
            - "Asset CATALOGED with READY proxy and one rights grant"
            - "Asset migrated ONLINE → NEARLINE (completed job)"
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/proxy-renditions"
              payload: { asset_id: "${asset_id}" }
              as: LabTechnician
              captures: { pr_id: $.data.id }
            - call: "POST /archive/proxy-renditions/${pr_id}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr_id}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/assets/${asset_id}/archive"
              payload: {}
              as: ArchivistLead
              captures: { v_arch: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "NEARLINE", expected_asset_version: "${v_arch}" }
              as: ArchivistLead
              captures: { job_id: $.data.id }
            - call: "POST /archive/migration-jobs/${job_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/migration-jobs/${job_id}/complete"
              payload: { checksum_sha256: "ok" }
              as: LabTechnician
            - call: "POST /archive/assets/${asset_id}/recatalog"
              payload: {}
              as: ArchivistLead
          trigger:
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
          assert:
            - "Asset.${asset_id}.catalog_status == CATALOGED (rework cycle ARCHIVED → IN_REVIEW → CATALOGED completed)"
            - "Asset.${asset_id}.storage_tier == NEARLINE (tier dimension unaffected by catalog cycle)"

      - name: retrieval_request_return_loop_and_tier_fork
        grounds:
          - state_machines.RetrievalRequest.UNDER_REVIEW_to_SUBMITTED
          - state_machines.RetrievalRequest.UNDER_REVIEW_to_STAGED
        distinguishing_aspect: |
          RetrievalRequest is cyclic with a tier fork: UNDER_REVIEW → SUBMITTED →
          UNDER_REVIEW (return loop, return_count == 1), then approve on an ONLINE
          asset takes the STAGED branch (not RECALLING) and quotes fee 50 cents
          (0 base + ceil(5 GB) × 10).
        test_recipe:
          setup:
            - "Asset CATALOGED, ONLINE, 5 GB, posture CLEARED; request SUBMITTED then returned once"
          setup_api_calls:
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/retrieval-requests"
              payload: { asset_id: "${asset_id}", requester_id: "${staff_id}", purpose: "BROADCAST", requested_delivery_by: "2026-12-01T00:00:00Z" }
              as: Requester
              as_user_id: "${staff_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /archive/retrieval-requests/${rr_id}/start-review"
              payload: {}
              as: AccessOfficer
            - call: "POST /archive/retrieval-requests/${rr_id}/return"
              payload: { note: "need air date" }
              as: AccessOfficer
            - call: "POST /archive/retrieval-requests/${rr_id}/start-review"
              payload: {}
              as: AccessOfficer
          trigger:
            - call: "POST /archive/retrieval-requests/${rr_id}/approve"
              payload: {}
              as: AccessOfficer
          assert:
            - "RetrievalRequest.${rr_id}.status == STAGED (ONLINE fork, not RECALLING)"
            - "RetrievalRequest.${rr_id}.return_count == 1"
            - "RetrievalRequest.${rr_id}.quoted_fee_cents == 50"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascades from DIFFERENT triggers (depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: legal_hold_activation_depth3_cascade
        grounds:
          - state_machines.DisposalOrder.APPROVED_to_BLOCKED
          - state_machines.Asset.DISPOSAL_SCHEDULED_to_ARCHIVED
          - entities.Asset.fields.hold_status
        distinguishing_aspect: |
          Depth-3 chain from POST /archive/legal-holds: (1) Asset.hold_status → HELD,
          (2) because of HELD the APPROVED DisposalOrder → BLOCKED, (3) because the
          order left APPROVED the Asset DISPOSAL_SCHEDULED → ARCHIVED. Each link is
          caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Asset ARCHIVED (VIDEO; RetentionPolicy VIDEO 0 years exists)"
            - "DisposalOrder APPROVED (creator arch-1, approver arch-2); asset DISPOSAL_SCHEDULED"
          setup_api_calls:
            - call: "POST /archive/retention-policies"
              payload: { media_type: "VIDEO", min_retention_years: 0 }
              as: SystemAdmin
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/proxy-renditions"
              payload: { asset_id: "${asset_id}" }
              as: LabTechnician
              captures: { pr_id: $.data.id }
            - call: "POST /archive/proxy-renditions/${pr_id}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr_id}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/assets/${asset_id}/archive"
              payload: {}
              as: ArchivistLead
