        distinguishing_aspect: |
          Parallel state dimensions on EVVVisit (different entity from ISP):
          verification_status walks PENDING -> EXCEPTION -> VERIFIED while
          billing_status independently walks UNBILLED -> BILLED -> UNBILLED under
