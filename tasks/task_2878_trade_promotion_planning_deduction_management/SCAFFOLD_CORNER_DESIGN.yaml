        grounds:
          - endpoints.POST_/trade-marketing/deductions/{deductionId}/validate.side_effects
          - validations.priority_50
          - calculations.promotion_spend_status
          - calculations.allocation_posture
          - calculations.customer_penalty_score
        distinguishing_aspect: |
          Partial-failure handling for the four-hop chain: the request that would have driven
          consumed_deduction_amount -> spend_status -> overspend_event_count ->
          compliance_penalty_points is refused at priority 50, and every one of the four hops
          must be exactly where it was. The claim is deliberately large enough (5000.00
          against a 4000.00 plan) that a successful validation would have reached OVERSPENT
          and put the customer on credit hold, so a leak at any hop is visible.
