      - name: derived_protocol_budget_frozen_while_fund_pools_rederive
        grounds:
          - calculations.fundraising_split_at_commitment
          - entities.ClinicalProtocol.fields.protocol_budget_cents
          - entities.ResearchFund.fields.research_balance_cents
          - entities.ClinicalProtocol.fields.available_cents
        distinguishing_aspect: "The protocol budget is frozen derived data while the fund pools are live derived data: a later donation moves research_balance_cents from 160000000 to 168000000 but leaves protocol_budget_cents and available_cents exactly as they were at protocol creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund SJ-FY26 with 400000000 cents raised and 80000000 federal; protocol ALL-INT-001 created against it with protocol_budget_cents 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id, research_at_creation: $.data.research_balance_cents }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id, budget_at_creation: $.data.protocol_budget_cents, available_at_creation: $.data.available_cents }
          trigger:
            - call: "POST /programs/research-funds/${fund_id}/donations"
              payload: { amount_cents: 20000000, is_federal_grant: false }
              as: PlatformAdmin
              captures: { research_after: $.data.research_balance_cents }
            - call: "GET /programs/clinical-protocols/${protocol_id}"
              payload: {}
              as: Any
              captures: { budget_after: $.data.protocol_budget_cents, available_after: $.data.available_cents, saturated_after: $.data.is_budget_saturated }
          assert:
            - "the fund reported research_balance_cents 160000000 at creation and 168000000 after the donation"
            - "ClinicalProtocol.${protocol_id}.protocol_budget_cents == 10000000 both before and after the donation"
            - "ClinicalProtocol.${protocol_id}.available_cents == 10000000 both before and after the donation"
            - "the fund pool reconciled while the protocol budget did not, so the two derived surfaces are reconciled on different schedules"
            - "ClinicalProtocol.${protocol_id}.is_budget_saturated == false after the donation"

