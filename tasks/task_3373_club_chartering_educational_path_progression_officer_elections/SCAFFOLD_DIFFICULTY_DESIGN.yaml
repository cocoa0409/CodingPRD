            - "Club.${club_id}.good_standing_score == 36 (30 dues + 0 officer + 0 education + 0 meeting + 6 from 3 DCP points)"
            - "Club.${club_id}.good_standing == NOT_IN_GOOD_STANDING and Club.${club_id}.charter_status == ORGANIZING (an un-chartered club is never suspended or revoked)"
            - "Club.${club_id}.cycle_open_standing == NOT_IN_GOOD_STANDING for the cycle that follows, so the next close would drop the admin point"

  - rule_id: non_linear_state_machine
    instances:
      - name: membership_status_lapse_and_renewal_cycle
        grounds:
          - state_machines.Membership.PENDING_to_ACTIVE
          - state_machines.Membership.ACTIVE_to_LAPSED
          - state_machines.Membership.LAPSED_to_ACTIVE
          - state_machines.Membership.ISSUED_to_OVERDUE
          - state_machines.Membership.PAID_to_ISSUED
        distinguishing_aspect: |
          Membership.status is a cyclic machine on the Membership entity (PENDING to ACTIVE to
          LAPSED back to ACTIVE) that carries an independent dues_status dimension walking ISSUED to
          PAID to ISSUED to OVERDUE to PAID across the same two closes.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING at cycle 0 with club_dues_cents 3000"
            - "Grace is enrolled at 2026-09-02T00:00:00Z and pays cycle 0 so she is ACTIVE with dues_status PAID"
