            - "ContractorReview.${cr_id}.applied_ic_test == ABC (taken from the CA StateRule, not from the request)"

      - name: fieldwork_transition_without_a_job_family_is_refused
        claim_type: precondition_enforcement
        grounds: ["state_machines.AuditProject.PLANNING_to_FIELDWORK", "errors[ERR_PROJECT_STAGE_PRECONDITION_UNMET]", "validations[priority=7]"]
        distinguishing_aspect: "The transition is declared, so the target-state check passes; only its precondition fails. That must surface as ERR_PROJECT_STAGE_PRECONDITION_UNMET rather than the generic ERR_PROJECT_STAGE_INVALID, and the project must remain in PLANNING with version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one AuditProject in PLANNING with zero JobFamily rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
