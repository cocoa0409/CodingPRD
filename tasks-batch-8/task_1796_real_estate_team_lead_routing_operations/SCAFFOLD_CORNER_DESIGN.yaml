        distinguishing_aspect: "Segregation between working and approving: the Agent role is absent from the approve endpoint's roles, so even the closing agent cannot approve their own deal."
        test_recipe:
          setup: ["Same minimal deal chain: team, ACTIVE policy, source, ACTIVE agent C, PENDING deal on C's lead"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550144", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead}", gross_commission_cents: 500000 }, as: Agent, as_user_id: "${c}", captures: { deal: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal}/approve", payload: {}, as: Agent, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (403); Deal.${deal}.status remains PENDING"

  - section: complexity_layers
    instances:
      - name: occ_stale_team_version_rejected_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-activate-stale-team]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Team.version for create-with-supersede: activating P1 advances the team version; a second activation carrying the pre-activation version fails with ERR_STALE_VERSION (412), while the same call with a freshly read version succeeds and supersedes P1."
        test_recipe:
          setup: ["Team (version 1); DRAFT policy P1 activated (team version -> 2, P1 ACTIVE); DRAFT policy P2 created"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { p1: $.data.id } }
            - { call: "POST /crm/routing-policies/${p1}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "PERFORMANCE_WEIGHTED" }, as: TeamAdmin, captures: { p2: $.data.id } }
            - { call: "GET /crm/teams/${t}", as: TeamAdmin, captures: { t_v2: $.data.version } }
          trigger:
            - { call: "POST /crm/routing-policies/${p2}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/routing-policies/${p2}/activate", payload: { expected_team_version: "${t_v2}" }, as: TeamAdmin, captures: { st: $.data.status } }
          assert:
            - "First trigger: err == ERR_STALE_VERSION with HTTP 412 (expected ${t_v} == 1 but the team advanced to 2 when P1 activated)"
            - "Second trigger: st == ACTIVE, P1 becomes SUPERSEDED, and Team.${t}.version == 3 (each successful activation increments by exactly 1)"

      - name: selector_round_robin_nulls_first_then_created_at_tiebreak
        claim_type: selector_determinism
        grounds: [calculations.agent_selector]
        distinguishing_aspect: "Round-robin ordering is fully deterministic: never-assigned agents (last_assigned_at null) sort first, ties on null break by created_at ASC; after the first assignment the ordering rotates by last_assigned_at."
        test_recipe:
          setup: ["Team with ACTIVE ROUND_ROBIN policy; auto_route false source; ACTIVE agents M (created first) and N; two pooled leads"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent M", license_number: "LIC-M", max_active_leads: 5 }, as: TeamAdmin, captures: { m: $.data.id } }
            - { call: "POST /crm/agents/${m}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent N", license_number: "LIC-N", max_active_leads: 5 }, as: TeamAdmin, captures: { n: $.data.id } }
            - { call: "POST /crm/agents/${n}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead One", contact_phone: "+15125550145", contact_email: "1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { l1: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Two", contact_phone: "+15125550146", contact_email: "2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { l2: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${l1}/route", payload: {}, as: TeamAdmin, captures: { a1: $.data.agent_id } }
            - { call: "POST /crm/leads/${l2}/route", payload: {}, as: TeamAdmin, captures: { a2: $.data.agent_id } }
          assert:
            - "a1 == ${m} (both agents never assigned; created_at ASC tie-break picks the earlier-created M)"
            - "a2 == ${n} (N's null last_assigned_at sorts before M's set timestamp — NULLS FIRST)"

      - name: capacity_ledger_reconciled_across_release_reroute
        claim_type: derived_field_reconciliation
        grounds: [entities.Agent.fields.active_lead_count]
        excluded_because:
          difficulty_instance: release_and_reroute_preserves_single_active_assignment
          rationale: "active_lead_count before/after claim, release, and re-route is asserted step-by-step in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: intake_response_reflects_autoroute_immediately
        claim_type: immediate
        grounds: [endpoints."POST /crm/leads", state_machines.Lead.NEW_to_OFFERED]
        distinguishing_aspect: "Immediate consistency: the POST /crm/leads response itself shows the auto-route side effects (status OFFERED, assigned_agent_id, claim_deadline_at = created_at + 7200s) — no re-read or delay required."
        test_recipe:
          setup: ["Team with ACTIVE policy (default claim window 7200s); auto_route source; ACTIVE agent C; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550147", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { st: $.data.status, agent: $.data.assigned_agent_id, cdl: $.data.claim_deadline_at } }
          assert:
            - "st == OFFERED, agent == ${c}, cdl == 2026-08-01T02:00:00Z (created_at 2026-08-01T00:00:00Z + 7200s) — all visible in the creation response"
