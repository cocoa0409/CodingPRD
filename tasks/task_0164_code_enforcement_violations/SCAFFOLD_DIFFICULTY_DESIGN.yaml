  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: property_exclusive_open_case_overlap
        grounds:
          - validations[priority=9b]
          - entities.Case.fields.posture
          - errors[ERR_PROPERTY_HAS_OPEN_CASE]
        distinguishing_aspect: |
          Interval semantics = EXCLUSIVE half-open occupancy [opened, closed): a Property may host
          at most one Case whose posture != CLOSED. Opening a second Case while the first is open
          overlaps and is rejected. (Different geometry than the buffered point-event gap of the
          hearing-buffer instance, and a different resource entity — Property vs case-timeline.)
        test_recipe:
          setup:
            - "Property P has an open Case C1 (posture ACTIVE, a MAJOR notice issued). A second POST /cases on P is attempted."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Owen Open", mailing_email: "owen@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-1201", street_address: "120 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case1_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case1_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case1_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
          trigger:
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Second POST /cases rejected with HTTP 409"
            - "error_id == ERR_PROPERTY_HAS_OPEN_CASE (Case C1 posture != CLOSED occupies the property)"

      - name: hearing_buffer_window_overlap
        grounds:
          - validations[priority=10b]
          - entities.Hearing.fields.scheduled_for
          - errors[ERR_HEARING_SLOT_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = BUFFER (minimum-gap) between point-events: two active Hearings on
          the SAME case must be >= HEARING_BUFFER_DAYS (7) apart. Contesting a second notice with a
          scheduled_for only 3 days from the first hearing's slot violates the buffer. (Different
          geometry than exclusive occupancy, and a different resource — the case's hearing timeline.)
        test_recipe:
          setup:
            - "Case with two MAJOR notices. Notice1 contested with hearing at 2026-01-10."
            - "Notice2 contested with scheduled_for 2026-01-13 (only 3 days from the first, < 7-day buffer)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Bea Buffer", mailing_email: "bea@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-1301", street_address: "130 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp1_id: $.data.id }
            - call: "POST /inspections/${insp1_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp1_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice1_id: $.data.id }
            - call: "POST /notices/${notice1_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp2_id: $.data.id }
            - call: "POST /inspections/${insp2_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp2_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice2_id: $.data.id }
          trigger:
            - call: "POST /notices/${notice2_id}/contest"
              payload: { scheduled_for: "2026-01-13T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second contest rejected with HTTP 409"
            - "error_id == ERR_HEARING_SLOT_CONFLICT (2026-01-13 is 3 days from 2026-01-10, within the 7-day buffer)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dismiss_waives_fine_restores_outstanding_balance
        grounds:
          - state_machines.ViolationNotice.CONTESTED_to_DISMISSED
          - entities.Case.fields.outstanding_balance_cents
          - entities.Fine.fields.settlement_status
        distinguishing_aspect: |
          Conserved quantity = Case.outstanding_balance_cents. Forward action (issue notice) adds a
          20000 CITATION debit; its compensating action (hearing DISMISSED -> Fine WAIVED, fine_total->0)
          must restore outstanding_balance to its pre-notice value (0). Pinned: balance_after_dismiss
          == balance_before_issue. (Distinct conserved quantity from the lien payment-coverage invariant.)
        test_recipe:
          setup:
            - "Fresh INTAKE case (balance 0). MAJOR notice issued (balance 20000). Contested, hearing DISMISSED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Della Dismiss", mailing_email: "della@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-1401", street_address: "140 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { bal_before: $.data.outstanding_balance_cents }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /notices/${notice_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { hearing_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hearings/${hearing_id}/decide"
              payload: { decision: "DISMISSED" }
              as: HearingOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { bal_after: $.data.outstanding_balance_cents }
            - call: "GET /notices/${notice_id}/fines"
              payload: {}
              as: FinanceClerk
          assert:
            - "Case.${case_id}.outstanding_balance_cents before issuance == 0"
            - "ViolationNotice.${notice_id}.status == DISMISSED and its CITATION Fine settlement_status == WAIVED"
            - "Case.${case_id}.outstanding_balance_cents after dismiss == 0 (compensated back to the pre-issue value)"

      - name: lien_release_conserves_payment_coverage
        grounds:
          - state_machines.Lien.RECORDED_to_RELEASED
          - entities.Case.fields.payments_applied_cents
          - entities.Lien.fields.total_cents
          - entities.Fine.fields.settlement_status
        distinguishing_aspect: |
          Conserved quantity = payment-coverage identity payments_applied_cents == Lien.total_cents at
          release. Forward action records a lien (total 26250 frozen); the compensating release requires
          payments_applied >= total and then SETTLES all open fines, leaving outstanding_balance 0 with
          payments_applied == total. (Distinct conserved quantity from the outstanding-balance restoration invariant.)
        test_recipe:
          setup:
            - "MAJOR notice OVERDUE 10 days (fine_total 25000). Lien recorded -> principal 25000, fee 1250, total 26250."
            - "Payment of 26250 posted, then lien released."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Reed Release", mailing_email: "reed@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-1501", street_address: "150 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { case_v: $.data.version }
            - call: "POST /liens"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v}" }
              as: FinanceClerk
              captures: { lien_id: $.data.id, lien_total: $.data.total_cents }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { case_v_post_lien: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/payments"
              payload: { amount_cents: 26250, expected_case_version: "${case_v_post_lien}" }
              as: FinanceClerk
              captures: { paid: $.data.payments_applied_cents }
            - call: "POST /liens/${lien_id}/release"
              payload: {}
              as: FinanceClerk
              captures: { lien_status: $.data.status }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { bal_final: $.data.outstanding_balance_cents, paid_final: $.data.payments_applied_cents }
          assert:
            - "Lien.${lien_id}.total_cents == 26250 (principal 25000 + admin_fee 1250)"
            - "After payment: Case.${case_id}.payments_applied_cents == 26250 (== Lien.total_cents, coverage identity holds)"
            - "After release: Lien.${lien_id}.status == RELEASED, Case.${case_id}.outstanding_balance_cents == 0"
