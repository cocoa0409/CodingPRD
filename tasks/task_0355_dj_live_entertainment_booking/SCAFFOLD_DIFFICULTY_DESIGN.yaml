              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /performers/${perf}/blackouts"
              payload: { start_utc: "2026-08-01T10:00:00Z", end_utc: "2026-08-01T14:00:00Z", reason: "rec" }
              as: StudioAdmin
          trigger:
            - call: "POST /performers/${perf}/blackouts"
              payload: { start_utc: "2026-08-01T12:00:00Z", end_utc: "2026-08-01T18:00:00Z", reason: "overlap" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BLACKOUT_OVERLAP"

      - name: double_booking_closed_buffer_on_performer_bookings
        grounds:
          - validations[priority=12]
          - errors[ERR_PERFORMER_DOUBLE_BOOKED]
          - state_machines.Booking.INQUIRY_to_HOLD
          - entities.Booking.fields.event_start_utc
        distinguishing_aspect: |
          Booking-vs-booking overlap uses a CLOSED 4-hour buffer around event_start_utc
          (set window treated as [start-2h, start+contracted_minutes+2h]) on the same
          active performer — different interval arithmetic than the blackout half-open rule —
          so a second hold at 2026-08-01T21:00Z within the buffer of a 2026-08-01T20:00Z held booking is rejected.
        test_recipe:
          setup:
            - "Performer holds booking A at 2026-08-01T20:00:00Z (contracted 120). Booking B at 2026-08-01T21:00:00Z same performer."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bkA: $.data.id }
            - call: "POST /bookings/${bkA}/hold"
              payload: {}
              as: BookingAgent
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T21:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bkB: $.data.id }
          trigger:
            - call: "POST /bookings/${bkB}/hold"
              payload: {}
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERFORMER_DOUBLE_BOOKED"
            - "Booking.${bkB}.status == INQUIRY"

  # =====================================================================
  # RULE 9 — compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_money_quote_equals_fee_plus_refund
        grounds:
          - state_machines.Booking.HOLD_to_CANCELLED
          - calculations.cancellation_fee
          - entities.Booking.fields.cancellation_fee_cents
          - entities.Client.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity = money. After cancel of a deposit-only booking,
          cancellation_fee_cents (retained) + Client.store_credit_cents (refunded to credit)
          == amount captured (81000): 64800 + 16200 == 81000, no cash leaks or is minted.
        test_recipe:
          setup:
            - "CONFIRMED booking, deposit 81000 captured with refund_destination STORE_CREDIT, then cancelled (lead 48, CONFIRMED tier -> fee 64800)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "SOUND", label: "PA", unit_fee_cents: 30000 }
              as: StudioAdmin
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "LIGHTING", label: "Rig", unit_fee_cents: 20000 }
              as: StudioAdmin
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zevent}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 81000, refund_destination: "STORE_CREDIT" }
              as: BookingAgent
              captures: { pay: $.data.id }
            - call: "POST /payments/${pay}/capture"
              payload: {}
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: BookingAgent
              captures: { fee: $.data.cancellation_fee_cents }
            - call: "GET /clients/${cli}"
              payload: {}
              as: BookingAgent
              captures: { credit: $.data.store_credit_cents }
          assert:
            - "Booking.${bk}.cancellation_fee_cents == 64800"
            - "Client.${cli}.store_credit_cents == 16200"
            - "Booking.${bk}.cancellation_fee_cents + Client.${cli}.store_credit_cents == 81000"

      - name: promote_backup_conserves_performer_assignment_count
        grounds:
          - state_machines.BackupAssignment.ACCEPTED_to_PROMOTED
          - entities.Booking.fields.active_performer_id
          - entities.Performer.fields.availability_status
        distinguishing_aspect: |
          Conserved quantity = count of BOOKED performers tied to this booking (always
          exactly 1). Before promote the primary is BOOKED and backup AVAILABLE-or-ONHOLD;
          after promote the backup is BOOKED and primary AVAILABLE — the booking still has
          exactly one BOOKED active performer (no double-booking, no orphaned slot).
        test_recipe:
          setup:
            - "CONFIRMED booking, primary BOOKED, one ACCEPTED backup; then promote."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Primary", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Backup", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 180000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { back: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 62500 }
              as: BookingAgent
              captures: { pay: $.data.id }
            - call: "POST /payments/${pay}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /bookings/${bk}/backup-assignments"
              payload: { candidate_performer_id: "${back}", rank: 1 }
              as: BookingAgent
              captures: { ba: $.data.id }
            - call: "POST /backup-assignments/${ba}/accept"
              payload: {}
              as: Performer
              as_user_id: "${back}"
            - call: "GET /bookings/${bk}"
              payload: {}
              as: BookingAgent
              captures: { bkv_pre: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/promote-backup"
              payload: { backup_assignment_id: "${ba}", expected_booking_version: "${bkv_pre}" }
              as: BookingAgent
            - call: "GET /performers/${perf}"
              payload: {}
              as: BookingAgent
              captures: { prim: $.data.availability_status }
            - call: "GET /performers/${back}"
              payload: {}
              as: BookingAgent
              captures: { bck: $.data.availability_status }
          assert:
            - "Performer.${perf}.availability_status == AVAILABLE"
            - "Performer.${back}.availability_status == BOOKED"
            - "Booking.${bk}.active_performer_id == ${back}"
