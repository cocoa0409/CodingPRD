        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_EVENT_IN_FUTURE
        distinguishing_aspect: "occurred_at one second past the logical clock fails 422 ERR_EVENT_IN_FUTURE; occurred_at exactly equal to the clock is admitted."
        test_recipe:
