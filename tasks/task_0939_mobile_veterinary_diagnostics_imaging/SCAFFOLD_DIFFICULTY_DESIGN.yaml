          assert:
            - "${st_returned_1} == RETURNED"
            - "${st_resub_1} == SUBMITTED"
            - "Referral.${rf_l}.status == ACCEPTED"
            - "Referral.${rf_l}.clinical_history == 'vomiting for two days; last radiographs 2026-01-14'"
            - "Referral.${rf_l}.return_reason == null"

  - rule_id: transitive_cascade
    instances:
      - name: qc_fail_quarantine_six_hop_cascade_to_contract_balance
        grounds:
          - state_machines.Equipment.calibration.VALID_to_QUARANTINED
          - state_machines.Study.qc.ACCEPTED_to_REPEAT_REQUIRED
          - state_machines.ReadAssignment.OFFERED_to_REVOKED
          - state_machines.Study.billing.POSTED_to_REVERSED
          - calculations.equipment_retro_blast_radius
          - calculations.block_balance_projection
          - entities.QcCheck.fields.affected_study_count
        distinguishing_aspect: |
          A single POST /qc-checks with result FAIL propagates through SIX
          entity hops, each caused by the previous one:
          QcCheck -> Equipment(QUARANTINED) -> Study(REPEAT_PENDING) ->
          ChargeLine(REVERSED) -> Invoice(total 0) -> BlockLedgerEntry(+1) ->
          ClinicContract(block_remaining back to 2). The parallel leg
          Study -> ReadAssignment(REVOKED) -> Specialist(open_read_count 0)
          is caused by the same Study hop, not by the original request.
