              payload: {}
              as: ResearchOps
              captures: { e_nn: $.data.error_id }
          assert:
            - "response status 409 and e_nn == ERR_INVALID_STATE_TRANSITION"
            - "MethodologyChange.${chgn_id}.change_status == APPROVED"

      - name: audit_close_penalty_with_zero_uses_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_AUDIT_OUTCOME_INVALID]
          - state_machines.LicenseAudit.transitions
        distinguishing_aspect: "Closing an audit with outcome=PENALTY when unlicensed_uses_found == 0 fails with ERR_AUDIT_OUTCOME_INVALID; outcome=NO_ACTION succeeds on the same findings."
        test_recipe:
          setup:
            - "Licensee LAU ACTIVE; agreement AGAU ACTIVE; audit AAU filed with 0 uses."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/licensees"
              payload: { licensee_name: "Clean Client" }
              as: LicenseAdmin
              captures: { lau_id: $.data.id }
            - call: "POST /research/license-agreements"
              payload: { licensee_id: "${lau_id}", tier: "DISPLAY", seat_limit: 5, effective_from: "2026-01-01", base_fee_cents: 100000 }
              as: LicenseAdmin
              captures: { agau_id: $.data.id }
            - call: "POST /research/license-agreements/${agau_id}/activate"
              payload: {}
              as: LicenseAdmin
            - call: "POST /research/license-audits"
              payload: { agreement_id: "${agau_id}" }
              as: LicenseAdmin
