  - rule_id: compensating_invariant
    instances:
      - name: award_cancellation_restores_member_points_and_releases_the_last_award_room
        grounds:
          - calculations.point_conservation
          - state_machines.Redemption.HELD_to_CANCELLED
          - calculations.award_inventory_check
          - validations.priority_70_ERR_AWARD_INVENTORY_UNAVAILABLE
          - calculations.point_liability_valuation
          - entities.PointLedgerEntry.fields.reversal_of_entry_id
        distinguishing_aspect: |
          Conserved quantity 1 - MEMBER POINTS. The compensating action is a cancellation, and the
          instance pins three separate restorations from the one hop: the scoped ledger sum over
          source_redemption_id returns to exactly 0, the member balance returns to its pre-booking
          value, and the released award night becomes bookable again by a second member who was
