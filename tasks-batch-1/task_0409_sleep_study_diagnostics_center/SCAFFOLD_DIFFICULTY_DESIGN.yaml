              as: DMECoordinator
          trigger:
            - call: "POST /compliance-records"
              payload: { dme_order_id: "${dme_id}", window_start_utc: "2026-08-15T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", nights_used_4h_plus: 22, total_usage_minutes: 6000 }
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COMPLIANCE_WINDOW_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_occupation_conserved_on_schedule_then_cancel
        grounds:
          - state_machines.StudyOrder.ORDERED_to_SCHEDULED
          - state_machines.StudyOrder.ORDERED_to_CANCELLED
          - entities.SleepBed.fields.id
          - errors[ERR_BED_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Conserved quantity = the set of occupied night intervals on a bed.
          Forward action (schedule study on bed for night N) + compensating
          action (cancel study) MUST leave the bed's occupied-interval set
          identical to before: a fresh study can then book the exact same night
          N without ERR_BED_DOUBLE_BOOKED. No drift in bed occupancy.
        test_recipe:
          setup:
            - "A bed; a study scheduled on it for night N then cancelled; a second authorized study ready to book night N."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Ruiz", date_of_birth: "1979-05-19", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /beds"
              payload: { bed_label: "Room-6-Bed-A", turnover_buffer_minutes: 60 }
              as: SchedulingCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1919191919", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/approve-auth"
              payload: { prior_auth_number: "PA-19a", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref1_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref1_id}", modality: "IN_LAB_PSG", expected_referral_version: "${ref1_v2}" }
              as: SchedulingCoordinator
              captures: { so1_id: $.data.id }
            - call: "POST /study-orders/${so1_id}/schedule"
              payload: { night_start_utc: "2026-07-25T22:00:00Z", night_end_utc: "2026-07-26T06:00:00Z", bed_id: "${bed_id}" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so1_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
              captures: { so1_status: $.data.status }
            - call: "POST /patients"
              payload: { full_name: "Pat Ruiz 2", date_of_birth: "1979-05-19", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat2_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat2_id}", referring_provider_npi: "1919191919", requested_modality: "IN_LAB_PSG", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals/${ref2_id}/approve-auth"
              payload: { prior_auth_number: "PA-19b", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref2_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref2_id}", modality: "IN_LAB_PSG", expected_referral_version: "${ref2_v2}" }
              as: SchedulingCoordinator
              captures: { so2_id: $.data.id }
          trigger:
            - call: "POST /study-orders/${so2_id}/schedule"
              payload: { night_start_utc: "2026-07-25T22:00:00Z", night_end_utc: "2026-07-26T06:00:00Z", bed_id: "${bed_id}" }
              as: SchedulingCoordinator
              captures: { so2_status: $.data.status }
          assert:
            - "StudyOrder.${so1_id}.status == CANCELLED"
            - "StudyOrder.${so2_id}.status == SCHEDULED"

      - name: noncancelled_study_count_conserved_on_create_then_cancel
        grounds:
          - state_machines.StudyOrder.initial_state
          - state_machines.StudyOrder.ORDERED_to_CANCELLED
          - entities.StudyOrder.fields.status
          - endpoints.GET./study-orders
        distinguishing_aspect: |
          Conserved quantity = count of non-CANCELLED StudyOrders for a referral
          (a different conserved quantity than bed occupation). Forward action
          (create a study, count goes 1->2) + compensating action (cancel that
          study) MUST restore the count to 1; the cancelled study is excluded
          from the non-CANCELLED tally pinned by status filter.
        test_recipe:
          setup:
            - "An authorized referral with one ORDERED study (count of non-CANCELLED studies = 1)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Rae Soto", date_of_birth: "1983-06-20", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "2020202020", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-20", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so1_id: $.data.id, ref_v3: $.data.version }
          trigger:
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v3}" }
              as: SchedulingCoordinator
              captures: { so2_id: $.data.id }
            - call: "POST /study-orders/${so2_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
              captures: { so2_status: $.data.status }
            - call: "GET /study-orders"
              payload: { referral_id: "${ref_id}", status: "ORDERED" }
              as: SchedulingCoordinator
              captures: { remaining: $.data }
          assert:
            - "StudyOrder.${so2_id}.status == CANCELLED"
            - "StudyOrder.${so1_id}.status == ORDERED"
            - "GET /study-orders?referral_id=${ref_id}&status=ORDERED returns total_count == 1"
