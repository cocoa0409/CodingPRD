            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Nil", subject_first_name: "Pat", sex: "FEMALE", jurisdiction_code: "CTY-17", facility_id: "${fac}", place_of_event: "FH17" }
