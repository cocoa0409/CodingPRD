              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_b: $.data.id }
            - call: "POST /waste-in-records/${w_a}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 3960 }
              as: RemedialProjectManager
