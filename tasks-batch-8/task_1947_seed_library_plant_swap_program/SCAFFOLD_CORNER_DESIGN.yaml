              as_user_id: "${mp}"
              captures: { c1: "$.data.id" }
            - call: "POST /api/checkouts/${c1}/return"
              payload: {}
              as: Member
              as_user_id: "${mp}"
            - call: "POST /api/checkouts/${c1}/verify-return"
              payload: {}
              as: ProgramAdmin
            # p2, p3 -> overdue -> dispute -> write off
            - call: "POST /api/checkouts"
              payload: { member_id: "${mp}", packet_id: "${p2}" }
              as: Member
              as_user_id: "${mp}"
              captures: { c2: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${mp}", packet_id: "${p3}" }
