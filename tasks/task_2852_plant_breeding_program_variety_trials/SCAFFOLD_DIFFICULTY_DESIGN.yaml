            - "One program, one objective with min_generation_number 5 and min_advancement_index 85.00, line SX-1001 at generation 6 so advancement_readiness is READY at creation."
            - "The line's StewardshipAgreement has been driven DRAFT -> SUBMITTED -> APPROVED by two different X-User-IDs, so stewardship_status = APPROVED while pipeline_stage is still NURSERY."
