            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 120, room: "OR-6" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_g: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_g}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_g}", qty_used: 0 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/usage-records?pick_list_line_id=${line_g}", as: Any, captures: { ur_waste: "$.data[0].waste_charge_cents" } }
            - { call: "GET /perioperative/consignment-charges?case_id=${case_id}", as: Any, captures: { chg_amt: "$.data[0].amount_cents" } }
          assert:
            - "UsageRecord waste_charge_cents == 5000 (${ur_waste}) — consignment 1.0x branch, NOT the HOLD 1.5x branch (7500)"
            - "ConsignmentCharge amount_cents == 5000 (${chg_amt}) — opened-not-used is still billed on consignment"

      - name: consignment_count_variance_adjusts_stock_on_verify
        claim_type: correct_result
        grounds: [calculations.consignment_count_variance, state_machines.ConsignmentCount.RECORDED_to_VERIFIED]
        distinguishing_aspect: "Count 7 against system 8 yields variance_qty -1 and variance_value_cents -5000; verification applies the -1 ledger sync so on_hand becomes 7."
        test_recipe:
          setup: ["consignment item ROD-TI 5000c with on_hand 8 (set at creation)"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 8 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/consignment-counts", payload: { supply_item_id: "${item_d}", counted_qty: 7 }, as: MaterialsManager, captures: { cnt_id: "$.data.id", cnt_sys: "$.data.system_qty_at_count", cnt_var: "$.data.variance_qty" } }
          trigger:
            - { call: "POST /perioperative/consignment-counts/${cnt_id}/verify", payload: {}, as: MaterialsManager, captures: { cnt_status: "$.data.status", cnt_val: "$.data.variance_value_cents" } }
            - { call: "GET /perioperative/supply-items/${item_d}", as: Any, captures: { on_hand: "$.data.on_hand_quantity" } }
          assert:
            - "count snapshot: ${cnt_sys} == 8 and variance_qty == -1 (${cnt_var})"
            - "after verify: status VERIFIED (${cnt_status}), variance_value_cents == -5000 (${cnt_val})"
            - "SupplyItem.${item_d}.on_hand_quantity == 7 (ledger sync applied)"

      - name: consignment_count_zero_variance_leaves_stock_unchanged
        claim_type: correct_result
        grounds: [calculations.consignment_count_variance]
        distinguishing_aspect: "When counted == system, verify applies no adjustment — the aggregation's zero branch leaves on_hand untouched."
        test_recipe:
          setup: ["consignment item on_hand 8; count records 8"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 8 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/consignment-counts", payload: { supply_item_id: "${item_d}", counted_qty: 8 }, as: MaterialsManager, captures: { cnt_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/consignment-counts/${cnt_id}/verify", payload: {}, as: MaterialsManager }
            - { call: "GET /perioperative/supply-items/${item_d}", as: Any, captures: { on_hand: "$.data.on_hand_quantity" } }
          assert:
            - "SupplyItem.${item_d}.on_hand_quantity == 8 (${on_hand}) — zero variance, no drift"

      - name: stock_adjustment_negative_result_rejected
        claim_type: correct_result
        grounds: [entities.SupplyItem.fields.on_hand_quantity, "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "The running-total floor is honored: a delta that would drive on_hand below zero is rejected, while a delta landing exactly on zero succeeds."
        test_recipe:
          setup: ["item SCALPEL-11 on_hand 5"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "SCALPEL-11", name: "Scalpel 11", unit_cost_cents: 150, substitute_group: "BLADE", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_s: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/supply-items/${item_s}/stock-adjustments", payload: { delta_qty: -6, reason: "cycle count" }, as: MaterialsManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /perioperative/supply-items/${item_s}/stock-adjustments", payload: { delta_qty: -5, reason: "cycle count" }, as: MaterialsManager, captures: { on_hand: "$.data.on_hand_quantity" } }
          assert:
            - "${err} == ERR_INVALID_QUANTITY for the -6 adjustment (would floor below zero)"
            - "-5 adjustment succeeds: on_hand_quantity == 0 (${on_hand})"

  # ============================================================ validations
  - section: validations
    instances:
      - name: usage_exceeding_opened_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_USAGE_EXCEEDS_OPENED]"]
        distinguishing_aspect: "qty_used 2 against qty_opened 1 (picked 1, none returned) fails the safety check with ERR_USAGE_EXCEEDS_OPENED (http 422)."
        test_recipe:
          setup: ["1-line case (1x GLOVE-PR) picked, dispatched, returned"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Over", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 2 } ] }, as: CirculatingNurse, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_USAGE_EXCEEDS_OPENED (http 422); case remains IN_PROGRESS; no UsageRecord persisted"

      - name: duplicate_card_line_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CARD_LINE]"]
        distinguishing_aspect: "A second line for the same (card_id, supply_item_id) pair is rejected with ERR_DUPLICATE_CARD_LINE."
        test_recipe:
          setup: ["DRAFT card already containing 1x GLOVE-PR"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Dup", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 2, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_CARD_LINE (http 409); card still has exactly one line"

      - name: quantity_zero_returns_invalid_quantity
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "quantity 0 violates the >= 1 range and fails input validation with ERR_INVALID_QUANTITY before any card-state check."
        test_recipe:
          setup: ["surgeon S, item A, DRAFT card"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Zero", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 0, designation: "OPEN" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_QUANTITY (http 400)"

      - name: case_card_surgeon_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CARD_SURGEON_MISMATCH]"]
        distinguishing_aspect: "Scheduling a case for surgeon B against surgeon A's ACTIVE card fails referential coherence with ERR_CARD_SURGEON_MISMATCH."
        test_recipe:
          setup: ["surgeons S_A (card owner) and S_B; S_A's card published"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. A", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_a: "$.data.id" } }
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. B", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_b: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_a}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_b}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CARD_SURGEON_MISMATCH (http 409); no case persisted"

      - name: card_create_for_inactive_surgeon_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SURGEON_INACTIVE]", state_machines.Surgeon.ACTIVE_to_INACTIVE]
        distinguishing_aspect: "After deactivation, the surgeon cannot acquire new preference cards: ERR_SURGEON_INACTIVE."
        test_recipe:
          setup: ["surgeon S deactivated"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Off", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/surgeons/${s_id}/deactivate", payload: {}, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SURGEON_INACTIVE (http 409)"

      - name: consignment_count_on_stock_item_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NOT_CONSIGNMENT_ITEM]"]
        distinguishing_aspect: "Counting a non-consignment item (consignment_flag false) fails with ERR_NOT_CONSIGNMENT_ITEM."
        test_recipe:
          setup: ["item GLOVE-PR (stock, not consignment)"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/consignment-counts", payload: { supply_item_id: "${item_a}", counted_qty: 100 }, as: MaterialsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_CONSIGNMENT_ITEM (http 409)"

      - name: substitute_price_threshold_boundary_and_override
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_SUBSTITUTE_PRICE_THRESHOLD]"]
        distinguishing_aspect: "Fiscal guard boundary: substitute at exactly 1.25x (2500 vs 2000) is allowed; 2600 without override fails ERR_SUBSTITUTE_PRICE_THRESHOLD (402); 2600 with override_price_threshold=true succeeds."
        test_recipe:
          setup:
            - "surgeon S; TRAY-STD 2000c group TRAY on_hand 0; TRAY-EDGE 2500c group TRAY on_hand 5; TRAY-PRM 2600c group TRAY on_hand 5"
            - "two identical cases on a 1x TRAY-STD OPEN card, each released, picking begun, line marked SHORT"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Price", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-STD", name: "Standard tray", unit_cost_cents: 2000, substitute_group: "TRAY", initial_on_hand: 0 }, as: SupplyChainAnalyst, captures: { item_x: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-EDGE", name: "Edge tray", unit_cost_cents: 2500, substitute_group: "TRAY", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_edge: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "TRAY-PRM", name: "Premium tray", unit_cost_cents: 2600, substitute_group: "TRAY", initial_on_hand: 5 }, as: SupplyChainAnalyst, captures: { item_prm: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "ORIF" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_x}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_1: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_1}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_1: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_1}", as: Any, captures: { line_1: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_1}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_1}/mark-short", payload: { reason_code: "OUT_OF_STOCK" }, as: CartTechnician }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T10:30:00Z", expected_duration_min: 60, room: "OR-2" }, as: SupplyChainAnalyst, captures: { case_2: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_2}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_2: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_2}", as: Any, captures: { line_2: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_2}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_2}/mark-short", payload: { reason_code: "OUT_OF_STOCK" }, as: CartTechnician }
          trigger:
