  # --------------------------------------------------------------- writes ----
  - method: POST
    path: "/siting/projects"
    description: "Create a transmission project in stage PLANNING"
    roles: [Developer]
    code: 201
    input: [name, voltage_class, jurisdiction_state, target_energization_at]
    output: Project
    side_effects: ["stage := PLANNING", "schedule_posture := ON_TRACK", "right_of_way_hold := false", "all escrow counters := 0"]

  - method: POST
    path: "/siting/projects/{projectId}/escrow-deposits"
    description: "Deposit funds into the project's mitigation/right-of-way escrow"
    roles: [Developer]
    code: 201
    input: [amount_cents, reference]
    output: Project
    side_effects: ["escrow_funded_cents += amount_cents", "escrow_balance_cents += amount_cents", "conservation invariant escrow_funded_cents == escrow_balance_cents + escrow_disbursed_cents re-verified"]

  - method: POST
    path: "/siting/planning-studies"
    description: "Create a planning study establishing the need case"
    roles: [Developer]
    code: 201
    input: [project_id, horizon_year, reliability_deficit_mw, transmission_capex_cents, benefit_pv_cents]
    output: PlanningStudy
    side_effects: ["status := DRAFT", "authored_by_user_id := X-User-ID"]

  - method: POST
    path: "/siting/planning-studies/{studyId}/sufficiency-certification"
    description: "Certify (or fail) the need case; runs the need_justification_margin calculation including the non-transmission alternative selector"
    roles: [Developer]
    code: 201
    input: [attestation_note]
    output: PlanningStudy
    side_effects: ["computes transmission_levelized_cents_per_mw, benefit_ratio, need_margin_ratio, selected_nta_alternative_id", "status := CERTIFIED_SUFFICIENT or INSUFFICIENT", "certified_by_user_id := X-User-ID"]

  - method: POST
    path: "/siting/alternatives"
    description: "Register an alternative (including non-transmission options) against a planning study"
    roles: [RouteAnalyst, Developer]
    code: 201
    input: [study_id, kind, description, capex_cents, deliverable_mw]
    output: Alternative
    side_effects: ["levelized_cost_cents_per_mw computed and frozen", "screening_status := SUBMITTED"]

  - method: POST
    path: "/siting/alternatives/{alternativeId}/screening"
    description: "Screen an alternative in or out of the analysis"
    roles: [RouteAnalyst]
    code: 201
    input: [decision, screen_reason]
    output: Alternative
    side_effects: ["screening_status := SCREENED_IN or SCREENED_OUT", "PlanningStudy.alternatives_screened_in_count adjusted", "study may bubble DRAFT|INSUFFICIENT -> ALTERNATIVES_ANALYZED and clear stale need ratios"]

  - method: POST
    path: "/siting/routes"
    description: "Create a proposed or alternate route on a project"
    roles: [RouteAnalyst, Developer]
    code: 201
    input: [project_id, label, kind]
    output: Route
    side_effects: ["status := DRAFT", "Project.stage := ROUTING on the first route"]

  - method: POST
    path: "/siting/route-segments"
    description: "Add a segment with its four constraint criteria ratings to a route"
    roles: [RouteAnalyst]
    code: 201
    input: [route_id, sequence_index, miles, land_use_rating, environmental_rating, cultural_rating, engineering_rating, county, crew_capacity, "survey_status?", "habitat_blackout?", "federal_crossing_kind?"]
    output: RouteSegment
    side_effects: ["federal_permit_status initialised from federal_crossing_kind", "construction_state := PENDING", "Route.segment_count, total_miles and unsurveyed_segment_count recomputed"]

  - method: POST
    path: "/siting/route-segments/{segmentId}/federal-permit-actions"
    description: "Record a federal crossing permit action (APPLY | ISSUE | DENY) for public land or waterway crossings"
    roles: [FederalPermitOfficer]
    code: 201
    input: [action, "agency?", "determination_note?"]
    output: RouteSegment
    side_effects: ["federal_permit_status advanced", "federal_permit_agency recorded on APPLY", "on DENY, non-terminal ConstructionActivity rows on the segment := SUSPENDED and segment construction_state := HALTED when it was ACTIVE"]

  - method: POST
    path: "/siting/routes/{routeId}/constraint-mapping"
    description: "Run constraint mapping across land use, environmental, cultural and engineering criteria; computes both score variants and the density"
    roles: [RouteAnalyst]
    code: 201
    input: ["mapping_note?"]
    output: Route
    side_effects: ["total_miles, segment_count, unsurveyed_segment_count recomputed", "constraint_score_preliminary, constraint_score_certified and constraint_density_certified recomputed", "status := CONSTRAINT_MAPPED"]

  - method: POST
    path: "/siting/routes/{routeId}/publication"
    description: "Publish a proposed route for public comment and open the comment window"
    roles: [Developer]
    code: 201
    input: [comment_window_days]
    output: Route
    side_effects: ["comment_window_closes_at := logical_now + comment_window_days", "status := PUBLISHED_FOR_COMMENT"]

  - method: POST
    path: "/siting/routes/{routeId}/open-houses"
    description: "Record a public open house held for a route in a named county"
    roles: [Developer]
    code: 201
    input: [county, attendee_count, "held_at?"]
    output: Route
    side_effects: ["open_house_held_count incremented", "county appended to open_house_counties when not already present"]

  - method: POST
    path: "/siting/routes/{routeId}/refinements"
    description: "Refine the route in response to material comments; runs the refinement_target_selection selector"
    roles: [RouteAnalyst]
    code: 201
    input: [refinement_note]
    output: Route
    side_effects: ["refinement_target_segment_id selected", "target segment survey_status := FIELD_VERIFIED and refinement_count incremented", "comments on the target segment := INCORPORATED and material_comment_count recomputed", "refinement_round incremented", "status := REFINING"]

  - method: POST
    path: "/siting/routes/{routeId}/nomination"
    description: "Nominate a route for inclusion in the siting application"
    roles: [Developer]
    code: 201
    input: ["nomination_note?"]
    output: Route
    side_effects: ["status := NOMINATED"]

  - method: POST
    path: "/siting/public-comments"
    description: "Intake a public comment on a published route"
    roles: [Landowner, RouteAnalyst, CommissionStaff]
    code: 201
    input: [route_id, commenter_kind, commenter_name, body, materiality, "segment_id?", "commenter_landowner_id?"]
    output: PublicComment
    side_effects: ["status := RECEIVED", "received_at := logical_now", "segment material_comment_count incremented for MATERIAL comments"]

  - method: POST
    path: "/siting/public-comments/{commentId}/disposition"
    description: "Acknowledge or dismiss a comment with a written disposition"
    roles: [RouteAnalyst]
    code: 201
    input: [disposition, disposition_note]
    output: PublicComment
    side_effects: ["status := ACKNOWLEDGED or DISMISSED", "disposition_note recorded", "segment material_comment_count decremented for MATERIAL comments"]

  - method: POST
    path: "/siting/applications"
    description: "File the siting application with the state commission, snapshotting the nominated alternate routes"
    roles: [Developer]
    code: 201
    input: [project_id, study_id, proposed_route_id, docket_number, filing_fee_cents]
    output: SitingApplication
    side_effects: ["alternate_route_ids snapshot from NOMINATED ALTERNATE routes on the project", "review_status := FILED, record_status := NOT_OPENED", "filed_at := logical_now, decision_deadline_at := filed_at + 365 days", "Project.stage := APPLICATION_FILED and schedule_posture/right_of_way_hold recomputed"]

  - method: POST
    path: "/siting/applications/{applicationId}/sufficiency-review"
    description: "Commission staff accept the filing or return it as deficient"
    roles: [CommissionStaff]
    code: 201
    input: [outcome, "deficiency_note?"]
    output: SitingApplication
    side_effects: ["review_status := ACCEPTED or DEFICIENT", "record_status := SCHEDULING on acceptance", "increments SitingApplication.version by 1"]

  - method: POST
    path: "/siting/applications/{applicationId}/amendments"
    description: "Amend a deficient application, superseding the prior filing and restarting the statutory clock"
    roles: [Developer]
    code: 201
    input: [expected_application_version, amendment_summary, "filing_fee_cents?"]
    output: SitingApplication
    side_effects: ["amendment_round incremented", "deficiency_note cleared", "review_status := FILED", "filed_at := logical_now and decision_deadline_at recomputed", "Project.schedule_posture and right_of_way_hold recomputed", "increments SitingApplication.version by 1"]

  - method: POST
    path: "/siting/hearing-sessions"
    description: "Schedule a prehearing, evidentiary or public-testimony session on the docket"
    roles: [HearingExaminer]
    code: 201
    input: [application_id, kind, window_start_at, window_end_at]
    output: HearingSession
    side_effects: ["status := SCHEDULED", "presiding_user_id := X-User-ID"]

  - method: POST
    path: "/siting/hearing-sessions/{sessionId}/holding"
    description: "Record that a scheduled session was held and exhibits admitted"
    roles: [HearingExaminer]
    code: 201
    input: [exhibits_admitted_count]
    output: HearingSession
    side_effects: ["status := HELD", "application record_status may advance to RECORD_OPEN"]

  - method: POST
    path: "/siting/applications/{applicationId}/record-closure"
    description: "Close the evidentiary record"
    roles: [HearingExaminer]
    code: 201
    input: ["closure_note?"]
    output: SitingApplication
    side_effects: ["record_status := RECORD_CLOSED", "increments SitingApplication.version by 1"]

  - method: POST
    path: "/siting/applications/{applicationId}/decision"
    description: "Issue the commission's order granting (with certificate and conditions) or denying the application"
    roles: [CommissionStaff]
    code: 201
    input: [outcome, "certified_route_id?", "eminent_domain_authorized?", "mitigation_base_cents?", "conditions?"]
    input_notes: "conditions is an ordered array of { code, category, constraint_kind, severity_weight, blackout_start_mmdd?, blackout_end_mmdd?, crew_limit? } objects; rows are created in array order so GET .../conditions returns them in that order"
    output: SitingApplication
    side_effects: ["review_status := GRANTED or DENIED", "on GRANT: Certificate created ISSUED/ACTIVE with escrow tier, contingency, surcharge and escrow_required_cents computed, CertificateCondition rows created ACTIVE, certified route := CERTIFIED, other NOMINATED routes := REJECTED, Project.stage := CERTIFICATED", "on DENY: all NOMINATED routes := REJECTED"]

  - method: POST
    path: "/siting/interventions"
    description: "Petition to intervene as a landowner or interest group"
    roles: [Landowner, CommissionStaff]
    code: 201
    input: [application_id, petitioner_kind, grounds, "landowner_id?", "organization_name?"]
    output: Intervention
    side_effects: ["status := PETITIONED", "filed_at := logical_now"]

  - method: POST
    path: "/siting/interventions/{interventionId}/ruling"
    description: "Rule on an intervention petition"
    roles: [CommissionStaff]
    code: 201
    input: [ruling, ruling_reason]
    output: Intervention
    side_effects: ["status := GRANTED or DENIED", "ruled_by_user_id := X-User-ID", "on the second GRANTED petition: record_status := EVIDENTIARY_REQUIRED, suspension_days := 90, decision_deadline_at recomputed, Project.schedule_posture and right_of_way_hold recomputed"]

  - method: POST
    path: "/siting/certificate-conditions/{conditionId}/waiver"
    description: "Waive a certificate condition on the record"
    roles: [CommissionStaff]
    code: 201
    input: [waiver_reason]
    output: CertificateCondition
    side_effects: ["status := WAIVED", "the condition stops constraining construction scheduling", "Certificate escrow figures unchanged"]

  - method: POST
    path: "/siting/certificates/{certificateId}/closeout"
    description: "Close out the certificate after construction compliance is demonstrated"
    roles: [CommissionStaff]
    code: 201
    input: ["closeout_note?"]
    output: Certificate
    side_effects: ["status := CLOSED", "Project.stage := ENERGIZED", "remaining escrow_balance_cents released and escrow_funded_cents reduced by the same amount"]

  - method: POST
    path: "/siting/landowners"
    description: "Register a landowner of record"
    roles: [Developer, CommissionStaff]
    code: 201
    input: [name, email, mailing_address]
    output: Landowner
    side_effects: []

  - method: POST
    path: "/siting/easement-tracts"
    description: "Create an easement tract on a certified route segment"
    roles: [Developer]
    code: 201
    input: [project_id, segment_id, landowner_id, parcel_number, acres, per_acre_value_cents, easement_factor, "structure_damages_cents?", "before_value_cents?", "after_value_cents?", "severance_damages_cents?"]
    output: EasementTract
    side_effects: ["acquisition_status := NOT_STARTED", "payment_status := UNPAID", "offer_round := 0"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/offers"
    description: "Extend or re-extend a negotiated purchase offer; runs the NEGOTIATED_OFFER compensation variant"
    roles: [Developer]
    code: 201
    input: [expected_tract_version, "offer_note?"]
    output: EasementTract
    side_effects: ["offer_round incremented", "offered_compensation_cents recomputed at the round's escalation factor", "acquisition_status := OFFERED", "increments EasementTract.version by 1"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/offer-response"
    description: "Landowner accepts or rejects the standing offer"
    roles: [Landowner]
    code: 201
    input: [response, "response_note?"]
    output: EasementTract
    side_effects: ["on ACCEPT: agreed_compensation_cents and committed_cents frozen, acquisition_status := AGREED, Project.easement_committed_cents recomputed", "on REJECT: acquisition_status := REJECTED"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/condemnation"
    description: "File an eminent domain proceeding where the certificate authorizes it"
    roles: [Developer]
    code: 201
    input: [court_docket_number, deposit_cents]
    output: EasementTract
    side_effects: ["acquisition_status := CONDEMNATION_FILED", "court_docket_number and deposit_cents recorded"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/award"
    description: "Record the court's just-compensation award; runs the CONDEMNATION_AWARD compensation variant"
    roles: [CommissionStaff]
    code: 201
    input: ["award_note?"]
    output: EasementTract
    side_effects: ["award_cents computed", "committed_cents := award_cents", "acquisition_status := AWARDED", "Project.easement_committed_cents recomputed"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/payments"
    description: "Disburse the committed compensation to the landowner from project escrow"
    roles: [Developer]
    code: 201
    input: [payment_reference]
    output: EasementTract
    side_effects: ["paid_amount_cents := committed_cents", "paid_at := logical_now", "Project.escrow_balance_cents debited and escrow_disbursed_cents credited", "payment_status := PAID"]

  - method: POST
    path: "/siting/easement-tracts/{tractId}/payment-rescission"
    description: "Rescind a disbursement inside the 30-day statutory window and restore escrow"
    roles: [CommissionStaff]
    code: 201
    input: [rescission_reason]
    output: EasementTract
    side_effects: ["paid_amount_cents := 0", "Project.escrow_balance_cents restored and escrow_disbursed_cents reduced", "payment_status := RESCINDED"]

  - method: POST
    path: "/siting/construction-activities"
    description: "Schedule a construction activity on a certified route segment"
    roles: [Developer]
    code: 201
    input: [certificate_id, segment_id, activity_kind, crew_count, window_start_at, window_end_at]
    output: ConstructionActivity
    side_effects: ["status := SCHEDULED", "segment committed_crew_count += crew_count"]

  - method: POST
    path: "/siting/construction-activities/{activityId}/start"
    description: "Start (or restart after suspension) a construction activity"
    roles: [Developer]
    code: 201
    input: ["start_note?"]
    output: ConstructionActivity
    side_effects: ["status := IN_PROGRESS", "started_at := logical_now on the first start", "suspension_reason cleared", "segment construction_state := ACTIVE", "Project.stage := CONSTRUCTION on the first start of the project"]

  - method: POST
    path: "/siting/construction-activities/{activityId}/completion"
    description: "Complete a construction activity"
    roles: [Developer]
    code: 201
    input: ["completion_note?"]
    output: ConstructionActivity
    side_effects: ["status := COMPLETE", "completed_at := logical_now", "segment committed_crew_count -= crew_count", "segment may bubble to construction_state COMPLETE"]

  - method: POST
    path: "/siting/construction-activities/{activityId}/cancellation"
    description: "Cancel a scheduled or suspended construction activity"
    roles: [Developer]
    code: 201
    input: [cancellation_reason]
    output: ConstructionActivity
    side_effects: ["status := CANCELLED", "segment committed_crew_count -= crew_count"]

  - method: POST
    path: "/siting/nonconformances"
    description: "File a construction compliance nonconformance against a certificate condition"
    roles: [ComplianceMonitor]
    code: 201
    input: [certificate_id, condition_id, severity, observation, "activity_id?"]
    output: Nonconformance
    side_effects: ["deduction_points computed and frozen", "status := OPEN", "observed_at := logical_now", "condition status := VIOLATED", "both compliance indices recomputed", "Certificate.posture may cascade to STOP_WORK or REVOKED, suspending activities and halting segments"]

  - method: POST
    path: "/siting/nonconformances/{nonconformanceId}/correction"
    description: "Record corrective action (or void the finding) against a nonconformance"
    roles: [ComplianceMonitor, CommissionStaff]
    code: 201
    input: [corrective_action, "void_finding?"]
    output: Nonconformance
    side_effects: ["status := CORRECTED or VOIDED", "compliance_index_rolling recomputed with the halved (or removed) deduction", "compliance_index_cumulative recomputed with CORRECTED still fully charged", "condition may return to ACTIVE", "Certificate.posture may return to ACTIVE"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: *all_roles
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent logical_now readings (comment windows, decision deadlines, rescission windows, blackout evaluation, session holding) use the supplied instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the endpoint" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path id does not resolve to an existing row" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A foreign key supplied in the request body does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum value, out-of-range number, or conditional-field violation (materiality MATERIAL without segment_id, petitioner kind/identity mismatch, window_end_at not after window_start_at)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "A Landowner acts on a tract or comment that is not theirs" }
  - { id: ERR_STALE_TRACT_VERSION, http: 412, condition: "expected_tract_version does not match EasementTract.version" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match SitingApplication.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The requested transition does not exist from the row's current state" }
  - { id: ERR_TERMINAL_STATE, http: 409, condition: "The row is already in a terminal state for the dimension being transitioned" }
  - { id: ERR_ROUTE_NOT_PUBLISHED, http: 409, condition: "Comment intake or refinement attempted on a route that is not published for comment" }
  - { id: ERR_STUDY_NOT_SUFFICIENT, http: 409, condition: "Application filed against a planning study that is not CERTIFIED_SUFFICIENT" }
  - { id: ERR_ROUTE_NOT_NOMINATED, http: 409, condition: "Application filed against a route that is not a NOMINATED PROPOSED route" }
  - { id: ERR_RECORD_NOT_CLOSED, http: 409, condition: "Decision attempted before the evidentiary record is closed" }
  - { id: ERR_HEARING_STILL_SCHEDULED, http: 409, condition: "Record closure attempted with a session still in status SCHEDULED" }
  - { id: ERR_INTERVENTION_UNRULED, http: 409, condition: "Record closure attempted with an intervention still PETITIONED" }
  - { id: ERR_SESSION_NOT_STARTED, http: 409, condition: "Session held before logical_now reaches window_start_at" }
  - { id: ERR_CERTIFICATE_NOT_ACTIVE, http: 409, condition: "Operation requires Certificate.posture == ACTIVE" }
  - { id: ERR_CERTIFICATE_REVOKED, http: 409, condition: "Operation refused because the certificate posture is REVOKED" }
  - { id: ERR_SEASONAL_BLACKOUT_VIOLATION, http: 422, condition: "Activity window overlaps an ACTIVE seasonal blackout condition on a habitat-flagged segment" }
  - { id: ERR_FEDERAL_PERMIT_MISSING, http: 422, condition: "Activity start attempted while the segment's federal crossing permit is not ISSUED" }
  - { id: ERR_FEDERAL_AGENCY_MISMATCH, http: 422, condition: "Permit agency does not match the segment's federal_crossing_kind, or the segment has no federal crossing" }
  - { id: ERR_SELF_CERTIFICATION, http: 403, condition: "The same user authored and then certified/filed the need case" }
  - { id: ERR_DECIDER_PRESIDED, http: 403, condition: "The deciding staff user presided over a held hearing session on the application" }
  - { id: ERR_HEARING_WINDOW_CONFLICT, http: 409, condition: "Session's buffered interval overlaps another non-terminal session on the same application" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "Overlapping crew commitments on a segment would exceed the effective crew limit" }
  - { id: ERR_SEGMENT_SEQUENCE_DUPLICATE, http: 409, condition: "sequence_index already used on the route" }
  - { id: ERR_SEGMENT_SEQUENCE_GAP, http: 422, condition: "Constraint mapping attempted with fewer than 2 segments or a non-contiguous sequence" }
  - { id: ERR_REFINEMENT_LIMIT_REACHED, http: 409, condition: "Route already completed 3 refinement rounds" }
  - { id: ERR_AMENDMENT_LIMIT_REACHED, http: 409, condition: "Application already completed 2 amendment rounds" }
  - { id: ERR_OFFER_LIMIT_REACHED, http: 409, condition: "Tract already received 3 offers" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Project already has an application that is neither GRANTED nor DENIED" }
  - { id: ERR_COMMENT_WINDOW_CLOSED, http: 422, condition: "Comment intake after the comment window closed" }
  - { id: ERR_COMMENT_WINDOW_OPEN, http: 422, condition: "Nomination of a PROPOSED route while the comment window is still open" }
  - { id: ERR_RESCISSION_WINDOW_EXPIRED, http: 422, condition: "Payment rescission attempted 30 days or more after paid_at" }
  - { id: ERR_CONDITION_CERTIFICATE_MISMATCH, http: 422, condition: "Nonconformance references a condition or activity belonging to a different certificate" }
  - { id: ERR_SEGMENT_ROUTE_MISMATCH, http: 422, condition: "Activity segment does not belong to the certificate's certified route" }
  - { id: ERR_TRACT_SEGMENT_MISMATCH, http: 422, condition: "Tract segment belongs to a route on a different project" }
  - { id: ERR_ROUTE_PROJECT_MISMATCH, http: 422, condition: "Comment segment does not belong to the named route, or a route does not belong to the named project" }
  - { id: ERR_STUDY_PROJECT_MISMATCH, http: 422, condition: "Application study or proposed route belongs to a different project" }
  - { id: ERR_CONSTRAINT_DENSITY_EXCEEDED, http: 422, condition: "constraint_density_certified exceeds 4.00 at nomination" }
  - { id: ERR_MATERIAL_COMMENTS_OPEN, http: 422, condition: "Nomination attempted with MATERIAL comments still in status RECEIVED" }
  - { id: ERR_OPEN_HOUSE_COVERAGE_INSUFFICIENT, http: 422, condition: "Fewer than 2 open houses or fewer than 2 distinct counties covered at nomination" }
  - { id: ERR_INSUFFICIENT_ALTERNATIVES, http: 422, condition: "Sufficiency certification with fewer than 2 screened-in alternatives" }
  - { id: ERR_NO_NONTRANSMISSION_ALTERNATIVE, http: 422, condition: "Selector found no SCREENED_IN NON_TRANSMISSION or HYBRID alternative" }
  - { id: ERR_NO_REFINEMENT_TARGET, http: 409, condition: "Selector found no segment carrying a material comment" }
  - { id: ERR_ZERO_DELIVERABLE, http: 422, condition: "Alternative deliverable_mw is zero or negative" }
  - { id: ERR_EMINENT_DOMAIN_NOT_AUTHORIZED, http: 403, condition: "Condemnation filed without certificate authority or before two offers were made" }
  - { id: ERR_RIGHT_OF_WAY_HOLD, http: 409, condition: "Condemnation filed while the project carries a right-of-way hold" }
  - { id: ERR_NO_VALUE_DIMINUTION, http: 422, condition: "Award recorded with before_value_cents not exceeding after_value_cents" }
  - { id: ERR_EASEMENT_NOT_ACQUIRED, http: 422, condition: "Activity start attempted before every tract on the segment is AGREED or AWARDED (or with no tract at all)" }
  - { id: ERR_OPEN_NONCONFORMANCE, http: 409, condition: "Closeout or activity completion attempted with an OPEN nonconformance" }
  - { id: ERR_SEGMENTS_INCOMPLETE, http: 409, condition: "Closeout attempted while a segment on the certified route is not COMPLETE" }
  - { id: ERR_COMPLIANCE_TOO_LOW, http: 422, condition: "Closeout attempted with compliance_index_cumulative below 75.00" }
  - { id: ERR_FILING_FEE_INSUFFICIENT, http: 402, condition: "filing_fee_cents below 2500000" }
  - { id: ERR_NO_ALTERNATE_ROUTE, http: 422, condition: "Application filed with no NOMINATED ALTERNATE route on the project" }
  - { id: ERR_ESCROW_INSUFFICIENT, http: 402, condition: "Project escrow balance below the tract's committed compensation at payment time" }
  - { id: ERR_ESCROW_UNDERFUNDED, http: 402, condition: "Activity start attempted while escrow_funded_cents is below the certificate's escrow_required_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Developer
    description: "Electric transmission developer staff: builds the need case, files the application, acquires easements and runs construction"
    identity: opaque
    exclusive_operations:
      - "POST /siting/projects"
      - "POST /siting/projects/{projectId}/escrow-deposits"
      - "POST /siting/planning-studies"
      - "POST /siting/planning-studies/{studyId}/sufficiency-certification"
      - "POST /siting/routes/{routeId}/publication"
      - "POST /siting/routes/{routeId}/open-houses"
      - "POST /siting/routes/{routeId}/nomination"
      - "POST /siting/applications"
      - "POST /siting/applications/{applicationId}/amendments"
      - "POST /siting/easement-tracts"
      - "POST /siting/easement-tracts/{tractId}/offers"
      - "POST /siting/easement-tracts/{tractId}/condemnation"
      - "POST /siting/easement-tracts/{tractId}/payments"
      - "POST /siting/construction-activities"
      - "POST /siting/construction-activities/{activityId}/start"
      - "POST /siting/construction-activities/{activityId}/completion"
      - "POST /siting/construction-activities/{activityId}/cancellation"
    shared_operations:
      - "POST /siting/alternatives (with RouteAnalyst)"
      - "POST /siting/routes (with RouteAnalyst)"
      - "POST /siting/landowners (with CommissionStaff)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the Developer user that authored a PlanningStudy may neither certify its sufficiency nor file the resulting application."

  - name: RouteAnalyst
    description: "Routing and environmental analyst: builds segments, runs constraint mapping, screens alternatives, dispositions comments and refines routes"
    identity: opaque
    exclusive_operations:
      - "POST /siting/route-segments"
      - "POST /siting/routes/{routeId}/constraint-mapping"
      - "POST /siting/routes/{routeId}/refinements"
      - "POST /siting/alternatives/{alternativeId}/screening"
      - "POST /siting/public-comments/{commentId}/disposition"
    shared_operations:
      - "POST /siting/alternatives (with Developer)"
      - "POST /siting/routes (with Developer)"
      - "POST /siting/public-comments (with Landowner and CommissionStaff)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: CommissionStaff
    description: "State siting commission staff: reviews filings, rules on interventions, issues the order and certificate, records awards and closes out"
    identity: opaque
    exclusive_operations:
      - "POST /siting/applications/{applicationId}/sufficiency-review"
      - "POST /siting/applications/{applicationId}/decision"
      - "POST /siting/interventions/{interventionId}/ruling"
      - "POST /siting/certificate-conditions/{conditionId}/waiver"
      - "POST /siting/certificates/{certificateId}/closeout"
      - "POST /siting/easement-tracts/{tractId}/award"
      - "POST /siting/easement-tracts/{tractId}/payment-rescission"
    shared_operations:
      - "POST /siting/landowners (with Developer)"
      - "POST /siting/interventions (with Landowner)"
      - "POST /siting/public-comments (with Landowner and RouteAnalyst)"
      - "POST /siting/nonconformances/{nonconformanceId}/correction (with ComplianceMonitor)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the staff user recording a decision must not be the presiding_user_id of any HELD hearing session on that application."

  - name: HearingExaminer
    description: "Administrative hearing examiner: schedules and holds sessions and closes the evidentiary record"
    identity: opaque
    exclusive_operations:
      - "POST /siting/hearing-sessions"
      - "POST /siting/hearing-sessions/{sessionId}/holding"
      - "POST /siting/applications/{applicationId}/record-closure"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: Landowner
    description: "Affected landowner of record: comments, intervenes and responds to easement offers"
    identity: "entity_backed:Landowner"
    exclusive_operations:
      - "POST /siting/easement-tracts/{tractId}/offer-response"
    shared_operations:
      - "POST /siting/public-comments (with RouteAnalyst and CommissionStaff)"
      - "POST /siting/interventions (with CommissionStaff)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID equals a Landowner.id; ownership checks compare it to EasementTract.landowner_id and PublicComment.commenter_landowner_id."

  - name: FederalPermitOfficer
    description: "Federal land or waterway agency officer (BLM, USACE, USFS) acting on crossing permits"
    identity: opaque
    exclusive_operations:
      - "POST /siting/route-segments/{segmentId}/federal-permit-actions"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ComplianceMonitor
    description: "Independent construction compliance monitor filing findings against certificate conditions"
    identity: opaque
    exclusive_operations:
      - "POST /siting/nonconformances"
    shared_operations:
      - "POST /siting/nonconformances/{nonconformanceId}/correction (with CommissionStaff)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

