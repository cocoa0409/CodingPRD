              as: ClinicAdmin
              captures: { zero_len_err: $.data.error_id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c64_id}", clinician_id: "${cl64_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T09:00:00Z", ends_at: "2026-08-01T09:01:00Z", pinned_supervising_physician_id: "${p64_id}" }
              as: ClinicAdmin
              captures: { one_min_sa_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c64_id}", patient_id: "${tim_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-07-31T23:59:00Z" }
              as: FrontDeskAgent
              captures: { past_booking_err: $.data.error_id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c64_id}", patient_id: "${tim_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T00:00:00Z" }
              as: FrontDeskAgent
