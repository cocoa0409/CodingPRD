        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_create_blocked_until_owning_contract_is_active
          rationale: "Asserted as the failure path of that instance, including the successful retry after activation."

      - name: error_booking_window_conflict_on_buffer_breach
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BOOKING_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / asset_half_open_window_with_changeover_buffer_boundary
          rationale: "Asserted at both sides of the 30-minute buffer boundary in that instance."

      - name: error_asset_capacity_exceeded_on_overbooking
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSET_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / asset_capacity_admits_exact_equality_and_rejects_one_more_unit
          rationale: "Asserted as the one-unit-over case in that instance."

      - name: error_staff_shift_conflict_on_rest_gap
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFF_SHIFT_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / staff_closed_interval_shift_with_forty_five_minute_rest_gap
          rationale: "Asserted for both the touching-endpoint case and the sub-45-minute rest case."

