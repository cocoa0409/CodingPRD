            - "NominationSlate.${slate_id}.contested == true, universal_proxy_applicable == true, nominee_count == 1, independent_nominee_pct == 100.00"
            - "NominationSlate.${slate_id}.independence_shortfall == false, so \"ERR_INDEPENDENCE_SHORTFALL\" is NOT the returned error"
            - "NominationSlate.${slate_id}.status is still \"DRAFT\""

      - name: seating_one_more_director_than_authorized_seats_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_65.ERR_SEAT_COUNT_EXCEEDED
          - entities.GovernancePolicy.fields.authorized_seats
          - endpoints.POST_/governance/directors/{director_id}/seat
        distinguishing_aspect: |
          With authorized_seats 1 and one director already SEATED, seating a second director whose onboarding
          is COMPLETE returns 422 ERR_SEAT_COUNT_EXCEEDED - not the priority-45 ERR_ONBOARDING_INCOMPLETE,
          which is satisfied - and the second director stays in ONBOARDING.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with authorized_seats 1."
            - "One director created directly as SEATED."
            - "One director in ONBOARDING whose single required OnboardingItem is COMPLETED."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", authorized_seats: 1 }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Solo Seat", email: "solo@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { seated_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Wait List", email: "waitlist@issuer.example", birth_date: "1972-01-01", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { wait_id: $.data.id }
            - call: "POST /governance/directors/${wait_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item_id: $.data.id }
            - call: "POST /governance/onboarding-items/${item_id}/complete"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/directors/${wait_id}/seat"
              payload: {}
              as: CorporateSecretary
              captures: { seat_count_error_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_SEAT_COUNT_EXCEEDED\""
            - "The response does NOT carry \"ERR_ONBOARDING_INCOMPLETE\": Director.${wait_id}.onboarding_status == \"COMPLETE\" with onboarding_completion_pct == 100.00"
            - "Director.${wait_id}.service_status is still \"ONBOARDING\""
            - "Director.${seated_id}.service_status is still \"SEATED\""

      - name: the_logical_clock_refuses_to_move_backwards_or_stand_still
        claim_type: violation_to_error
        grounds:
          - validations.priority_62.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/governance/_clock/set_current_utc
          - entities.Director.fields.age_years
        distinguishing_aspect: |
          The clock comparison is strictly after, so from 2026-09-01 both an earlier instant and the identical
          instant are refused with 422 ERR_CLOCK_NOT_MONOTONIC, and the director recomputation that rides on
          the clock is not re-run: the director born 1970-08-15 stays at age_years 56 rather than reverting to
          the 55 that the default 2026-08-01 clock produced.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one SEATED director born 1970-08-15, appointed 2019-06-01, with the clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cal Endar", email: "cal@issuer.example", birth_date: "1970-08-15", appointed_on: "2019-06-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
          trigger:
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: CorporateSecretary
              captures: { backwards_error_id: $.data.error_id }
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { standstill_error_id: $.data.error_id }
          assert:
            - "The first call returns HTTP 200 with data.current_utc == \"2026-09-01T00:00:00Z\" and data.recomputed_director_count == 1"
            - "Director.${dir_id}.age_years == 56 and tenure_years == 7 after the forward move (birthday 1970-08-15 has passed)"
            - "The backwards call returns HTTP 422 with data.error_id == \"ERR_CLOCK_NOT_MONOTONIC\""
            - "The identical-instant call also returns HTTP 422 with data.error_id == \"ERR_CLOCK_NOT_MONOTONIC\""
            - "Director.${dir_id}.age_years is still 56 after both refusals - no recomputation ran"

      - name: a_slate_or_policy_that_does_not_advance_the_cycle_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_62.ERR_CYCLE_YEAR_NOT_ADVANCED
          - calculations.active_policy_selector
          - endpoints.POST_/governance/slates
        distinguishing_aspect: |
          Two different bodies share one error id: a slate whose cycle_year is below the ACTIVE policy's 2026
          is refused, and a policy whose effective_from is not strictly after the ACTIVE policy's is refused,
          while a slate for exactly 2026 is accepted because the slate comparison is at-or-above and the
          policy comparison is strictly after.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 effective 2026-01-01 and no slates."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/slates"
              payload: { cycle_year: 2025, seat_count: 9 }
              as: CorporateSecretary
              captures: { stale_cycle_error_id: $.data.error_id }
            - call: "POST /governance/policies"
              payload: { cycle_year: 2027, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { stale_effective_error_id: $.data.error_id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id }
          assert:
            - "The 2025 slate call returns HTTP 422 with data.error_id == \"ERR_CYCLE_YEAR_NOT_ADVANCED\""
            - "The equal-effective_from policy call returns HTTP 422 with data.error_id == \"ERR_CYCLE_YEAR_NOT_ADVANCED\" and GovernancePolicy.${policy_id}.status is still \"ACTIVE\""
            - "The 2026 slate call returns HTTP 201 with NominationSlate.${slate_id}.cycle_year == 2026 and status == \"DRAFT\""
            - "Exactly one GovernancePolicy row exists and exactly one NominationSlate row exists"

      - name: uniqueness_keys_reject_a_duplicate_committee_name_and_category_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_55.ERR_DUPLICATE_RESOURCE
          - entities.Committee.fields.name
          - entities.SkillCategory.fields.code
        distinguishing_aspect: |
          The declared uniqueness keys are one Committee per name and one SkillCategory per code, so a second
          committee reusing the name is refused even with a different code, and a second category reusing the
          code is refused even with a different name; both return 409 ERR_DUPLICATE_RESOURCE and create
          nothing.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one AUDIT committee named \"Audit Committee\" and one SkillCategory with code CYBER."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER", name: "Cybersecurity Oversight", strategic_weight: 0.80, required_min_directors: 2 }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /governance/committees"
              payload: { code: "AUDIT2", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { dup_committee_error_id: $.data.error_id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER", name: "Cyber Risk", strategic_weight: 0.50, required_min_directors: 1 }
              as: GovernanceStaff
              captures: { dup_category_error_id: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with data.error_id == \"ERR_DUPLICATE_RESOURCE\""
            - "GET /governance/committees returns exactly 1 row with total_count == 1"
            - "GET /governance/skill-categories returns exactly 1 row whose name is still \"Cybersecurity Oversight\""

      - name: source_channel_coherence_rejects_missing_and_forbidden_subject_ids
        claim_type: violation_to_error
        grounds:
          - validations.priority_15.ERR_SOURCE_CHANNEL_MISMATCH
          - entities.Candidate.fields.source_channel
          - endpoints.POST_/governance/slates/{slate_id}/nominees
        distinguishing_aspect: |
          One error id guards three different coherence failures: a SEARCH_FIRM candidate with no
          search_firm_id, a SHAREHOLDER_PROPOSAL candidate that nevertheless carries a search_firm_id, and a
          slate nominee carrying both candidate_id and incumbent_director_id. The nominee case is decided at
          priority 15, ahead of the priority-40 candidate-state rule the same call would also fail.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SearchFirm, one SEATED director, one SOURCED candidate and one DRAFT slate for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/search-firms"
              payload: { name: "Beacon Search Partners", contact_email: "partners@beacon.example", placement_fee_pct: 30.0, placement_fee_tier2_pct: 20.0 }
              as: CorporateSecretary
              captures: { firm_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ida Incumbent", email: "ida@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Sam Sourced", email: "sam@cand.example", birth_date: "1974-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
          trigger:
            - call: "POST /governance/candidates"
              payload: { full_name: "Missing Firm", email: "missingfirm@cand.example", birth_date: "1975-01-01", source_channel: "SEARCH_FIRM" }
              as: GovernanceStaff
              captures: { missing_firm_error_id: $.data.error_id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Extra Firm", email: "extrafirm@cand.example", birth_date: "1976-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital", search_firm_id: "${firm_id}" }
              as: GovernanceStaff
              captures: { extra_firm_error_id: $.data.error_id }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, candidate_id: "${cand_id}", incumbent_director_id: "${dir_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { both_subjects_error_id: $.data.error_id }
          assert:
            - "All three calls return HTTP 400 with data.error_id == \"ERR_SOURCE_CHANNEL_MISMATCH\""
            - "The third response does NOT carry \"ERR_CANDIDATE_STATE_INVALID\", even though candidate ${cand_id} is only SOURCED"
            - "GET /governance/candidates returns exactly 1 row (only the setup candidate was created)"
            - "NominationSlate.${slate_id}.nominee_count == 0 and version is still ${slate_v1}"

      - name: degenerate_and_reversed_intervals_are_rejected_on_three_endpoints
        claim_type: violation_to_error
        grounds:
          - validations.priority_13.ERR_INVALID_INTERVAL
          - endpoints.POST_/governance/interviews
          - endpoints.POST_/governance/committees/{committee_id}/assignments
          - endpoints.POST_/governance/directors/{director_id}/comp-awards
        distinguishing_aspect: |
          Each interval input has its own declared strictness: an interview needs end_at strictly after
          start_at, so an identical pair is refused, while an assignment term and an award service window are
          rejected only when the end precedes the start. All three return 400 ERR_INVALID_INTERVAL at
          priority 13, ahead of the priority-40 candidate-state rule and the priority-62 overlap rules.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SEATED director, one SOURCED candidate and one AUDIT committee."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ivan Interviewer", email: "ivan@issuer.example", birth_date: "1966-07-07", appointed_on: "2020-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Sam Sourced", email: "sam@cand.example", birth_date: "1974-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
          trigger:
            - call: "POST /governance/interviews"
              payload: { candidate_id: "${cand_id}", interviewer_director_id: "${dir_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:00:00Z", modality: "VIDEO" }
              as: GovernanceStaff
              captures: { degenerate_error_id: $.data.error_id }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir_id}", term_start_on: "2026-12-31", term_end_on: "2026-01-01", expected_committee_version: "${comm_v1}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { reversed_term_error_id: $.data.error_id }
            - call: "POST /governance/directors/${dir_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-12-31", service_end_on: "2026-01-01", share_price_cents: 90000, shares_held: 100 }
              as: CorporateSecretary
              captures: { reversed_service_error_id: $.data.error_id }
          assert:
            - "All three calls return HTTP 400 with data.error_id == \"ERR_INVALID_INTERVAL\""
            - "The interview response does NOT carry \"ERR_CANDIDATE_STATE_INVALID\" and does NOT carry \"ERR_INTERVIEWER_DOUBLE_BOOKED\""
            - "GET /governance/interviews returns 0 rows and GET /governance/assignments returns 0 rows"
            - "Committee.${comm_id}.version is still ${comm_v1} and filled_seats == 0"

      - name: interview_scheduling_priority_pair_is_exercised_by_the_state_over_overlap_test
        claim_type: priority_ordering
        grounds:
          - validations.priority_40.ERR_CANDIDATE_STATE_INVALID
          - validations.priority_62.ERR_INTERVIEWER_DOUBLE_BOOKED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / interview_scheduling_state_error_wins_over_double_booking_error
          rationale: "Both rules are violated by one call there, and the winning priority-40 error plus the absence of the priority-62 error are both asserted."

      - name: nominee_add_priority_pair_is_exercised_by_the_interlock_over_budget_test
        claim_type: priority_ordering
        grounds:
          - validations.priority_52.ERR_INTERLOCK_LIMIT_EXCEEDED
          - validations.priority_70.ERR_SEARCH_FEE_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / interlock_safety_error_wins_over_search_fee_budget_error_on_nominee_add
          rationale: "One nominee-add call violates the interlock safety rule and the fee-budget rule together there, and the priority-52 winner is asserted along with the untouched fee ledger."

  - section: endpoints
    instances:
      - name: search_firm_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/governance/search-firms
          - endpoints.GET_/governance/search-firms/{firm_id}
          - entities.SearchFirm
        distinguishing_aspect: |
          The declared surface for SearchFirm is create plus read - there is no update or delete endpoint - so
          the round trip must return the stored row with its fee ledger initialised to zeros: placed_nominee_count
          0, committed_fee_cents 0, retainer_credit_applied_cents 0, net_payable_cents 0 and fee_model at its
          CONTINGENCY default.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and no search firms."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/search-firms"
              payload: { name: "Beacon Search Partners", contact_email: "partners@beacon.example", placement_fee_pct: 30.0, placement_fee_tier2_pct: 20.0 }
              as: CorporateSecretary
              captures: { firm_id: $.data.id }
            - call: "GET /governance/search-firms/${firm_id}"
              payload: {}
              as: GovernanceStaff
          assert:
            - "The create call returns HTTP 201 with data.name == \"Beacon Search Partners\", placement_fee_pct == 30.0 and placement_fee_tier2_pct == 20.0"
            - "data.fee_model == \"CONTINGENCY\" and retainer_fee_cents == 0 (both declared defaults)"
            - "data.placed_nominee_count == 0, committed_fee_cents == 0, retainer_credit_applied_cents == 0, net_payable_cents == 0"
            - "The read call returns HTTP 200 with the identical field values and the same version"

      - name: slate_action_chain_files_and_records_the_election
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/governance/slates/{slate_id}/file
          - endpoints.POST_/governance/slates/{slate_id}/record-election
          - state_machines.NominationSlate.FILED_to_ELECTION_RECORDED
        distinguishing_aspect: |
          Each action endpoint drives exactly one declared transition and stamps its own timestamp: file moves
          APPROVED -> FILED with filed_at, record-election moves FILED -> ELECTION_RECORDED with
          election_recorded_at, marks the listed nominee ELECTED, and applies the declared refreshment side
          effect - the SEATED chair who was left off the slate becomes NOT_RENOMINATED.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with quorum_size 1."
            - "One SEATED independent chair director and one SEATED independent incumbent director."
            - "An APPROVED slate for cycle 2026 carrying only the incumbent, approved on a single FOR ballot."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", quorum_size: 1 }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ida Incumbent", email: "ida@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${dir_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/submit-for-review"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${chair_id}", ballot: "FOR" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { vote_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/decide"
              payload: { decision: "APPROVE", rationale: "Unanimous on a single ballot" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          trigger:
            - call: "POST /governance/slates/${slate_id}/file"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/slates/${slate_id}/record-election"
              payload: { elected_nominee_ids: ["${nom_id}"] }
              as: CorporateSecretary
          assert:
            - "After file: NominationSlate.${slate_id}.status == \"FILED\" and filed_at == \"2026-08-01T00:00:00Z\""
            - "After record-election: NominationSlate.${slate_id}.status == \"ELECTION_RECORDED\" and election_recorded_at == \"2026-08-01T00:00:00Z\""
            - "SlateNominee.${nom_id}.status == \"ELECTED\""
            - "Director.${dir_id}.service_status == \"SEATED\" (a re-elected incumbent keeps its seat)"
            - "Director.${chair_id}.service_status == \"NOT_RENOMINATED\" - the declared refreshment side effect for a SEATED incumbent left off the slate"
            - "NominationSlate.${slate_id}.version increased on each of the two calls"

      - name: waiving_an_onboarding_item_is_allowed_only_for_the_secretary_and_only_while_pending
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/governance/onboarding-items/{item_id}/waive
          - state_machines.OnboardingItem.PENDING_to_WAIVED
          - calculations.director_onboarding_rollup
        distinguishing_aspect: |
          The waive action carries two independent conditions: the role must be CorporateSecretary, so a
          GovernanceStaff attempt returns 403 ERR_UNAUTHORIZED with the item untouched; and the item must be
          PENDING. A successful waiver counts as satisfied in the rollup, so a director with one COMPLETED and
          one WAIVED required item reaches onboarding_completion_pct 100.00 and becomes seatable.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One Director in ONBOARDING with two required OnboardingItems, the first already COMPLETED and the second still PENDING."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Wanda Waiver", email: "wanda@issuer.example", birth_date: "1972-01-01", appointed_on: "2026-07-01" }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item1_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "COMMITTEE_CHARTER_REVIEW", category: "COMMITTEE_ORIENTATION", is_required: true, credit_hours: 1.5, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item2_id: $.data.id }
            - call: "POST /governance/onboarding-items/${item1_id}/complete"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/onboarding-items/${item2_id}/waive"
              payload: { waiver_reason: "Credited from prior board service" }
              as: GovernanceStaff
              captures: { unauthorized_error_id: $.data.error_id }
            - call: "POST /governance/onboarding-items/${item2_id}/waive"
              payload: { waiver_reason: "Credited from prior board service" }
              as: CorporateSecretary
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
          assert:
            - "The staff attempt returns HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" and OnboardingItem.${item2_id}.status is still \"PENDING\""
            - "Before the waiver Director.${dir_id}.onboarding_status == \"IN_PROGRESS\" and onboarding_completion_pct == 50.00"
            - "The secretary attempt returns HTTP 200 with OnboardingItem.${item2_id}.status == \"WAIVED\" and waiver_reason == \"Credited from prior board service\""
            - "OnboardingItem.${item2_id}.completed_at is null - a waiver is not a completion"
            - "Director.${dir_id}.onboarding_status == \"COMPLETE\" and onboarding_completion_pct == 100.00"
            - "The seat call returns HTTP 200 with Director.${dir_id}.service_status == \"SEATED\""

      - name: skill_rating_links_a_director_to_a_category_and_validation_overrides_the_rating
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/governance/directors/{director_id}/skill-ratings
          - endpoints.POST_/governance/skill-ratings/{rating_id}/validate
          - entities.DirectorSkillRating.fields.effective_rating
        distinguishing_aspect: |
          The junction row requires both ends to exist - an unknown skill_category_id in the body returns 404
          ERR_SKILL_CATEGORY_NOT_FOUND - and the link starts UNVALIDATED with effective_rating mirroring
          self_rating. Committee validation then overrides it: effective_rating follows validated_rating even
          when the committee marks the director DOWN from 5 to 2.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one SkillCategory CYBER and one SEATED director."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER", name: "Cybersecurity Oversight", strategic_weight: 0.80, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/${chair_id}/skill-ratings"
              payload: { skill_category_id: "00000000-0000-4000-8000-000000000000", self_rating: 5 }
              as: GovernanceStaff
              captures: { unknown_category_error_id: $.data.error_id }
            - call: "POST /governance/directors/${chair_id}/skill-ratings"
              payload: { skill_category_id: "${cat_id}", self_rating: 5 }
              as: GovernanceStaff
              captures: { rating_id: $.data.id }
            - call: "POST /governance/skill-ratings/${rating_id}/validate"
              payload: { validated_rating: 2 }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: {}
              as: GovernanceStaff
          assert:
            - "The unknown-category call returns HTTP 404 with data.error_id == \"ERR_SKILL_CATEGORY_NOT_FOUND\" and creates no rating row"
            - "The create call returns HTTP 201 with validation_status == \"UNVALIDATED\", validated_rating null, effective_rating == 5 and validated_at null"
            - "The validate call returns HTTP 200 with validation_status == \"VALIDATED\", validated_rating == 2, effective_rating == 2 and validated_at == \"2026-08-01T00:00:00Z\""
            - "The default SELF_REPORTED gap analysis still reads self_rating 5, so CYBER reports seated_director_count == 1, covered_director_count == 1, gap == 1, weighted_gap == 1.20 and severity == \"MINOR_GAP\" - the validation override changes effective_rating without changing the self-reported view"
            - "GET /governance/skill-ratings returns exactly 1 row"

      - name: gap_analysis_computed_read_envelope_is_exercised_on_the_empty_board
        claim_type: computed_read
        grounds:
          - endpoints.GET_/governance/skills-matrix/gap-analysis
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_set_denominator_boundaries_gap_index_and_slate_independence_pct
          rationale: "The computed-read body on a board with no directors and no categories - board_gap_index 0.00, null priority category, empty categories array - is asserted there."

  - section: errors
    instances:
      - name: missing_identity_headers_return_unauthenticated_before_anything_else
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1
          - response_envelope.error
        distinguishing_aspect: |
          Priority 1 runs before every other check, so a request with no X-User-Role and no X-User-ID returns
          401 ERR_UNAUTHENTICATED even when the body is also invalid and the path id does not exist - the
          response must not be ERR_INVALID_REQUEST, ERR_UNAUTHORIZED or a 404.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /governance/directors"
              payload: { full_name: "No Headers" }
              as: none
              captures: { unauthenticated_error_id: $.data.error_id }
            - call: "GET /governance/directors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: none
              captures: { unauthenticated_read_error_id: $.data.error_id }
          assert:
            - "Both calls are made with neither X-User-Role nor X-User-ID and return HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "The first response is NOT \"ERR_INVALID_REQUEST\" even though birth_date, email and appointed_on are all missing"
            - "The second response is NOT \"ERR_DIRECTOR_NOT_FOUND\" even though the path id does not exist"
            - "Every response carries response_type == \"error\" with a non-empty message and no Director row is created"

      - name: every_threshold_reading_endpoint_reports_no_active_policy_on_an_empty_database
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ACTIVE_POLICY]
          - validations.priority_25
          - calculations.active_policy_selector
        distinguishing_aspect: |
          The selector's empty-set fallback is an error, not a default: with zero GovernancePolicy rows the
          computed read and the clock advance both return 409 ERR_NO_ACTIVE_POLICY, and the clock does not
          move as a side effect of the refusal.
        test_recipe:
          setup:
            - "Completely empty database - no GovernancePolicy row has ever been adopted."
          setup_api_calls: []
          trigger:
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: {}
              as: GovernanceStaff
              captures: { gap_no_policy_error_id: $.data.error_id }
            - call: "POST /governance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { clock_no_policy_error_id: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with data.error_id == \"ERR_NO_ACTIVE_POLICY\""
            - "The gap-analysis response carries no board_gap_index field - it is an error envelope, not a zeroed result"
            - "After adopting a policy the same gap-analysis call succeeds, proving the refusal was caused only by the empty selector input set"

      - name: every_path_and_body_id_family_has_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations.priority_20
          - validations.priority_21
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_SLATE_NOT_FOUND]
          - errors[ERR_EXTERNAL_COMPANY_NOT_FOUND]
        distinguishing_aspect: |
          The catalog declares a distinct 404 per entity family and the id is resolved wherever it appears:
          path ids on the read endpoints and body ids on the create endpoints. Every call below uses the same
          well-formed but unknown UUID and must return the error id belonging to that specific family - never
          a generic not-found and never ERR_INVALID_REQUEST.
