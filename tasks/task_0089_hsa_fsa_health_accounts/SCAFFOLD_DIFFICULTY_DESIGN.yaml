            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${c1_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { b1_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
            - call: "POST /reimbursement-batches/${b1_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
