            - { call: "POST /claims", payload: { claim_number: "C-OWN", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_a}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_b}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_NOT_ASSIGNMENT_OWNER (http 403)"

