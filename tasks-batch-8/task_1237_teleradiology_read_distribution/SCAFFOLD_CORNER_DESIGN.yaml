        distinguishing_aspect: "Billing periods use inclusive-day windows per hospital: 2026-05-15..2026-06-15 overlaps 2026-05-01..2026-05-31 and is rejected; 2026-06-01..2026-06-30 is allowed."
        test_recipe:
          setup: ["hospital with existing period 2026-05-01..2026-05-31"]
