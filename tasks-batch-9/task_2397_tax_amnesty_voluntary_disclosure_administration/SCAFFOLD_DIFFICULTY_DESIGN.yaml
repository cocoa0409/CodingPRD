      - name: realization_rounds_to_four_places_before_the_forecast_comparison
        grounds:
          - calculations.program_revenue_realization
          - entities.AmnestyProgram.fields.final_realization_pct
          - endpoints[GET /amnesty/programs/{id}/revenue-summary]
        distinguishing_aspect: |
          Collections 1050000 against forecast 1166667 give the raw ratio 0.8999997428...,
          which must be rounded to 0.9000 FIRST and only then compared, reporting ON_TRACK;
          comparing the raw ratio to 0.9000 reports WATCH. Reversing a 100-cent payment drops
          collections to 1049900, whose ratio rounds to 0.8999 and genuinely reports WATCH,
          and /reconcile then freezes that value in final_realization_pct.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with revenue_forecast_cents 1166667 and one SALES_USE term"
