  - section: errors
    instances:

      - name: every_entity_read_with_an_unknown_id_returns_its_own_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_COUNTERPARTY_NOT_FOUND]
          - errors[ERR_LOAN_NOT_FOUND]
          - errors[ERR_ASSUMPTION_SET_NOT_FOUND]
          - errors[ERR_RATE_CURVE_NOT_FOUND]
          - errors[ERR_VALUATION_RUN_NOT_FOUND]
          - errors[ERR_BID_PACKAGE_NOT_FOUND]
          - errors[ERR_TAPE_LINE_NOT_FOUND]
          - errors[ERR_BID_NOT_FOUND]
          - errors[ERR_PURCHASE_AGREEMENT_NOT_FOUND]
          - errors[ERR_APPROVAL_REQUEST_NOT_FOUND]
          - errors[ERR_SERVICING_TRANSFER_NOT_FOUND]
          - errors[ERR_ERROR_CASE_NOT_FOUND]
          - errors[ERR_HEDGE_POSITION_NOT_FOUND]
        distinguishing_aspect: "The catalog deliberately has one 404 per entity rather than a single generic code, so the claim is that each read discriminates its own id space: thirteen unknown ids on thirteen reads must produce thirteen distinct error_ids, and none of them may fall back to a shared NOT_FOUND."
        test_recipe:
          setup: ["An empty database with the logical clock at its default instant. No fixture is needed: the point is that nothing resolves."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
          trigger:
            - call: "GET /msr/counterparties/00000000-0000-0000-0000-0000000000c1"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_cp: "$.data.error_id" }
            - call: "GET /msr/loans/00000000-0000-0000-0000-0000000000c2"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_loan: "$.data.error_id" }
            - call: "GET /msr/assumption-sets/00000000-0000-0000-0000-0000000000c3"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_as: "$.data.error_id" }
            - call: "GET /msr/rate-curves/00000000-0000-0000-0000-0000000000c4"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_curve: "$.data.error_id" }
            - call: "GET /msr/valuation-runs/00000000-0000-0000-0000-0000000000c5"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_vr: "$.data.error_id" }
