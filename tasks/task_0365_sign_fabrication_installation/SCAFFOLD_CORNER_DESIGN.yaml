            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-decide"
              payload: { qc_pass: true }
              as: ShopManager
            - call: "POST /crews"
              payload: { name: "Crew Cl", certified_aerial: false, active: true }
              as: ShopManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "LAD-Cl", equipment_class: "LADDER", max_reach_ft: 16, in_service: true }
              as: ShopManager
              captures: { equip_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/install-jobs"
