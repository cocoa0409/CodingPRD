            - call: "POST /leases/${m14_l_id}/ti-projects"
              payload: { suite_id: "${m14_s_id}", target_suite_class: "INFUSION", power_amps_requested: 250, medical_gas_requested: false, authorized_allowance_total: 400000.00, landlord_share_pct: 0.50 }
              as: LeasingAgent
              captures: { m14_tp_id: $.data.id, m14_tp_v: $.data.version }
            - call: "POST /ti-projects/${m14_tp_id}/line-items"
              payload: { expected_ti_project_version: "${m14_tp_v}", description: "Infusion bay electrical upgrade", category: "POWER", cost_amount: 60000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${m14_tp_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Fork both dimensions" }
              as: LeasingAgent
