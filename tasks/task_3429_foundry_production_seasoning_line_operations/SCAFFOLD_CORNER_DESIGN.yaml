            - call: "POST /foundry/outlet-sales"
              payload: { product_id: "${p_id}", channel: FACTORY_OUTLET, qty: 1, unit_price_cents: 2199 }
              as: OutletManager
              captures: { err_low: $.data.error_id }
            - call: "POST /foundry/outlet-sales"
              payload: { product_id: "${p_id}", channel: FACTORY_OUTLET, qty: 1, unit_price_cents: 2200 }
              as: OutletManager
              captures: { err_at_floor: $.data.error_id }
          assert:
            - "${err_low} == ERR_OUTLET_PRICE_BELOW_FLOOR (HTTP 422)"
            - "${err_at_floor} == ERR_INSUFFICIENT_INVENTORY (HTTP 422): 2200 == floor passed the price check and failed only for stock"
