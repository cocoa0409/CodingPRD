        as: AccreditationBody
        captures:
          cyc_id: $.data.id
      - call: POST /accreditation/cycles/${cyc_id}/activate
        payload: {}
        as: AccreditationBody
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Ira Sundaram
