      - name: shared_read_surface_is_wide_but_carries_three_named_exceptions
        claim_type: shared_operations
        grounds:
          - roles.TalentBuyer
          - roles.FairOperationsDirector
          - roles.SettlementController
          - endpoints.GET_sponsors_id
          - endpoints.GET_show_bookings_id_settlement_preview
          - endpoints.GET_fair_editions_id_buying_strategy_report
        distinguishing_aspect: |
          The three roles with catalog-wide read rights each have exactly one hole in that
          surface, and the holes are different: TalentBuyer cannot read a Sponsor,
          FairOperationsDirector cannot read the settlement preview, and
          SettlementController cannot read the buying-strategy report or the artist list.
          Each hole is proved by contrast on the SAME unissued id -- the excluded role gets
          403 while an included role gets 404, which shows the excluded role never reached
          the existence layer at all.
        test_recipe:
          setup:
            - "Only one row is needed: the TalentAgent agent-hollis, so that agent-side reads resolve their entity-backed identity instead of failing priority 4."
            - "Every probe below uses an unissued but well-formed UUID, so an included role must answer 404 with the resource's own code while an excluded role must answer 403 -- no other fixture can influence the outcome."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
          trigger:
            - call: "GET /grandstand/sponsors/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: TalentBuyer
              captures: { err_m1: "$.data.error_id" }
            - call: "GET /grandstand/sponsors/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: SponsorshipDirector
              captures: { err_m2: "$.data.error_id" }
            - call: "GET /grandstand/show-bookings/00000000-0000-4000-8000-000000000012/settlement-preview"
              payload: {}
              as: FairOperationsDirector
              captures: { err_m3: "$.data.error_id" }
            - call: "GET /grandstand/show-bookings/00000000-0000-4000-8000-000000000012/settlement-preview"
              payload: {}
              as: SettlementController
              captures: { err_m4: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions/00000000-0000-4000-8000-000000000013/buying-strategy-report"
              payload: {}
              as: SettlementController
              captures: { err_m5: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions/00000000-0000-4000-8000-000000000013/buying-strategy-report"
              payload: {}
              as: FairOperationsDirector
              captures: { err_m6: "$.data.error_id" }
            - call: "GET /grandstand/artists"
              payload: {}
              as: SettlementController
              captures: { err_m7: "$.data.error_id" }
            - call: "GET /grandstand/artists"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/show-bookings"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00.000Z" }
              as: BoxOfficeManager
          assert:
            - "${err_m1} == ERR_FORBIDDEN_ROLE with HTTP 403: the sponsor detail read is the one GET the TalentBuyer is excluded from."
            - "${err_m2} == ERR_SPONSOR_NOT_FOUND with HTTP 404 on the identical path: the SponsorshipDirector passed the role gate and was stopped only by the missing row."
            - "${err_m3} == ERR_FORBIDDEN_ROLE with HTTP 403: the settlement preview is the one GET the FairOperationsDirector is excluded from."
            - "${err_m4} == ERR_SHOW_BOOKING_NOT_FOUND with HTTP 404 on the identical path, which is the contrast that proves the 403 above was a role decision and not a resource decision."
            - "${err_m5} == ERR_FORBIDDEN_ROLE with HTTP 403: the buying-strategy report is closed to the SettlementController."
            - "${err_m6} == ERR_FAIR_EDITION_NOT_FOUND with HTTP 404 on the identical path for the FairOperationsDirector."
            - "${err_m7} == ERR_FORBIDDEN_ROLE with HTTP 403: the artist list is the SettlementController's second exclusion."
            - "The TalentAgent artist list returns HTTP 200 with total_count == 0: a resolvable agent identity reads the roster surface even when it is empty."
            - "Both ProductionManager and BoxOfficeManager read GET /grandstand/show-bookings with HTTP 200 and total_count == 0: the booking list is genuinely shared by all seven roles."
            - "The clock write returns HTTP 200 for BoxOfficeManager: POST /grandstand/_clock/set_current_utc is the one write every role shares."

