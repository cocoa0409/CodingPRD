              payload: { event_type: "CURTAILMENT", claimed_by: "DEVELOPER", window_start: "2026-09-03T00:00:00Z", window_end: "2026-09-03T23:00:00Z", description: "grid emergency, 3 September, awaiting review" }
              as: Originator
