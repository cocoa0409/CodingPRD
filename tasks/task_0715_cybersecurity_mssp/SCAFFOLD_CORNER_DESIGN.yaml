            - call: "POST /clients/${client_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
