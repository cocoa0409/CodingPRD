# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. Same 7-point per-instance contract as §1.8.
# Clock default before any set_current_utc: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_show_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Show.fields.status, entities.Show.fields.monetization_enabled, entities.Show.fields.episode_count]
        distinguishing_aspect: "POST /shows with required fields → 201; status=DRAFT, monetization_enabled defaults false, episode_count=0, version=1."
        test_recipe:
          setup: ["Publisher pubA exists"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubA", payout_email: "pa@x.com" }
              as: PlatformAdmin
              captures: { pubA: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { publisher_id: "${pubA}", title: "S", category: "TECH" }
              as: Publisher
              as_user_id: "${pubA}"
              captures: { s: $.data.id }
          assert:
            - "response.status == 201"
            - "Show.${s}.status == DRAFT"
            - "Show.${s}.monetization_enabled == false"
            - "Show.${s}.episode_count == 0"
            - "Show.${s}.version == 1"

      - name: create_show_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Show.fields.title, "validations[priority=16]"]
        distinguishing_aspect: "POST /shows without title → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Publisher pubB exists"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubB", payout_email: "pb@x.com" }
              as: PlatformAdmin
              captures: { pubB: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { publisher_id: "${pubB}", category: "TECH" }
              as: Publisher
              as_user_id: "${pubB}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_show_invalid_enum_category_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Show.fields.category, "validations[priority=16]"]
        distinguishing_aspect: "POST /shows with category not in the enum set → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Publisher pubC exists"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubCc", payout_email: "pcc@x.com" }
              as: PlatformAdmin
              captures: { pubCc: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { publisher_id: "${pubCc}", title: "S", category: "SPORTS" }
              as: Publisher
              as_user_id: "${pubCc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_show_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Show, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shows/{random-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /shows/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: system_fields_generated_on_create_input_ignored
        claim_type: System Fields
        grounds: [entities.Advertiser]
        distinguishing_aspect: "POST /advertisers — server mints id/created_at/updated_at/version=1; client cannot set them."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /advertisers"
              payload: { name: "AdvSys", billing_email: "asys@x.com" }
              as: PlatformAdmin
              captures: { adv: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Advertiser.${adv}.version == 1"
            - "Advertiser.${adv}.id is a server-minted UUID"

      - name: download_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DownloadEvent]
        distinguishing_aspect: "DownloadEvent has common_fields:false — only id + created_at; no version, no update endpoint."
        test_recipe:
          setup: ["ACTIVE show with PUBLIC feed + PUBLISHED READY episode epPub (private access not required)"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubDl", payout_email: "pdl@x.com" }
              as: PlatformAdmin
              captures: { pubDl: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubDl}", title: "SDl", category: "TECH" }
              as: Publisher
              as_user_id: "${pubDl}"
              captures: { sDl: $.data.id }
            - call: "POST /shows/${sDl}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubDl}"
            - call: "POST /feeds"
              payload: { show_id: "${sDl}", visibility: "PUBLIC" }
              as: Publisher
              as_user_id: "${pubDl}"
            - call: "POST /episodes"
              payload: { show_id: "${sDl}", title: "EpDl", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubDl}"
              captures: { epDl: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epDl}", source_filename: "dl.wav", source_duration_ms: 100000 }
              as: Publisher
              as_user_id: "${pubDl}"
              captures: { maDl: $.data.id }
            - call: "POST /media-assets/${maDl}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maDl}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 100000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epDl}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubDl}"
          trigger:
            - call: "POST /download-events"
              payload: { episode_id: "${epDl}", client_ip_hash: "z1", user_agent: "ua", bytes_served: 2000000, event_at: "2026-01-01T03:00:00Z" }
              as: PlatformAdmin
              captures: { de: $.data.id }
          assert:
            - "response.status == 201"
            - "DownloadEvent.${de}.counted == true"

      - name: parent_relationship_show_unknown_publisher_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Show.fields.publisher_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /shows with a publisher_id that does not exist → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /shows"
              payload: { publisher_id: "00000000-0000-4000-8000-000000000001", title: "S", category: "TECH" }
              as: Publisher
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_show_from_archived_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Show.DRAFT_to_ARCHIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Show ARCHIVED is terminal; POST /shows/{id}/activate → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Show sArch DRAFT then ARCHIVED"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubAr", payout_email: "par@x.com" }
              as: PlatformAdmin
              captures: { pubAr: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubAr}", title: "SAr", category: "TECH" }
              as: Publisher
              as_user_id: "${pubAr}"
              captures: { sArch: $.data.id }
            - call: "POST /shows/${sArch}/archive"
              payload: {}
              as: Publisher
              as_user_id: "${pubAr}"
          trigger:
            - call: "POST /shows/${sArch}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubAr}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_subscription_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on an already-CANCELLED subscription → ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Listener with ACTIVE subscription subC on a PRIVATE-feed show, then cancelled once"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubSc", payout_email: "psc@x.com" }
              as: PlatformAdmin
              captures: { pubSc: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubSc}", title: "SSc", category: "BUSINESS" }
              as: Publisher
              as_user_id: "${pubSc}"
              captures: { sSc: $.data.id }
            - call: "POST /shows/${sSc}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubSc}"
            - call: "POST /feeds"
              payload: { show_id: "${sSc}", visibility: "PRIVATE" }
              as: Publisher
              as_user_id: "${pubSc}"
            - call: "POST /listeners"
              payload: { email: "lsc@x.com", display_name: "LSc" }
              as: PlatformAdmin
              captures: { lSc: $.data.id }
            - call: "POST /subscriptions"
              payload: { listener_id: "${lSc}", show_id: "${sSc}", price_cents: 500, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Listener
              as_user_id: "${lSc}"
              captures: { subC: $.data.id }
            - call: "POST /subscriptions/${subC}/activate"
              payload: {}
              as: Listener
              as_user_id: "${lSc}"
            - call: "POST /subscriptions/${subC}/cancel"
              payload: {}
              as: Listener
              as_user_id: "${lSc}"
          trigger:
            - call: "POST /subscriptions/${subC}/cancel"
              payload: {}
              as: Listener
              as_user_id: "${lSc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: schedule_episode_in_past_returns_schedule_in_past
        claim_type: Precondition Enforcement
        grounds: [state_machines.Episode.DRAFT_to_SCHEDULED, "validations[priority=14]", "errors[ERR_SCHEDULE_IN_PAST]"]
        distinguishing_aspect: "scheduled_publish_at == current clock (not strictly after) → ERR_SCHEDULE_IN_PAST (422)."
        test_recipe:
          setup: ["clock at 2026-06-01; episode epSch DRAFT under ACTIVE show"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "PubSch", payout_email: "psch@x.com" }
              as: PlatformAdmin
              captures: { pubSch: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubSch}", title: "SSch", category: "NEWS" }
              as: Publisher
              as_user_id: "${pubSch}"
              captures: { sSch: $.data.id }
            - call: "POST /shows/${sSch}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubSch}"
            - call: "POST /episodes"
              payload: { show_id: "${sSch}", title: "EpSch", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubSch}"
              captures: { epSch: $.data.id }
          trigger:
            - call: "POST /episodes/${epSch}/schedule"
              payload: { scheduled_publish_at: "2026-06-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pubSch}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SCHEDULE_IN_PAST"

      - name: scheduled_episode_auto_publishes_when_clock_advances
        claim_type: Side Effect Execution
        grounds: [state_machines.Episode.SCHEDULED_to_PUBLISHED, entities.Episode.fields.scheduled_publish_at]
        distinguishing_aspect: "Advancing the clock past scheduled_publish_at (show ACTIVE, media READY) auto-transitions the episode SCHEDULED→PUBLISHED."
        test_recipe:
          setup: ["clock 2026-07-01; episode epAuto SCHEDULED for 2026-07-15, media READY, show ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "PubAu", payout_email: "pau@x.com" }
              as: PlatformAdmin
              captures: { pubAu: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubAu}", title: "SAu", category: "NEWS" }
              as: Publisher
              as_user_id: "${pubAu}"
              captures: { sAu: $.data.id }
            - call: "POST /shows/${sAu}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubAu}"
            - call: "POST /episodes"
              payload: { show_id: "${sAu}", title: "EpAu", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubAu}"
              captures: { epAuto: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epAuto}", source_filename: "au.wav", source_duration_ms: 100000 }
              as: Publisher
              as_user_id: "${pubAu}"
              captures: { maAu: $.data.id }
            - call: "POST /media-assets/${maAu}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maAu}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 100000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epAuto}/schedule"
              payload: { scheduled_publish_at: "2026-07-15T00:00:00Z" }
              as: Publisher
              as_user_id: "${pubAu}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Episode.${epAuto}.publish_status == PUBLISHED"

      - name: archive_active_show_with_published_episode_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Show.ACTIVE_to_ARCHIVED, "errors[ERR_SHOW_HAS_PUBLISHED_EPISODES]"]
        distinguishing_aspect: "Archiving an ACTIVE show that still has a PUBLISHED episode → ERR_SHOW_HAS_PUBLISHED_EPISODES (409)."
        test_recipe:
          setup: ["ACTIVE show with one PUBLISHED+READY episode"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubArc", payout_email: "parc@x.com" }
              as: PlatformAdmin
              captures: { pubArc: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubArc}", title: "SArc", category: "TECH" }
              as: Publisher
              as_user_id: "${pubArc}"
              captures: { sArc: $.data.id }
            - call: "POST /shows/${sArc}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubArc}"
            - call: "POST /episodes"
              payload: { show_id: "${sArc}", title: "EpArc", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubArc}"
              captures: { epArc: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epArc}", source_filename: "arc.wav", source_duration_ms: 100000 }
              as: Publisher
              as_user_id: "${pubArc}"
              captures: { maArc: $.data.id }
            - call: "POST /media-assets/${maArc}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maArc}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 100000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epArc}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubArc}"
          trigger:
            - call: "POST /shows/${sArc}/archive"
              payload: {}
              as: Publisher
              as_user_id: "${pubArc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SHOW_HAS_PUBLISHED_EPISODES"

      - name: complete_campaign_with_open_placements_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.AdCampaign.ACTIVE_to_COMPLETED, "errors[ERR_CAMPAIGN_HAS_OPEN_PLACEMENTS]"]
        distinguishing_aspect: "Completing a campaign that still has an INSERTED placement → ERR_CAMPAIGN_HAS_OPEN_PLACEMENTS (409)."
        test_recipe:
          setup: ["Campaign cOpen ACTIVE with one INSERTED placement on a published episode"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubCo", payout_email: "pco@x.com" }
              as: PlatformAdmin
              captures: { pubCo: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubCo}", title: "SCo", category: "TECH", monetization_enabled: true }
              as: Publisher
              as_user_id: "${pubCo}"
              captures: { sCo: $.data.id }
            - call: "POST /shows/${sCo}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubCo}"
            - call: "POST /episodes"
              payload: { show_id: "${sCo}", title: "EpCo", total_ad_slots: 1, offered_positions: ["PRE_ROLL"] }
              as: Publisher
              as_user_id: "${pubCo}"
              captures: { epCo: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epCo}", source_filename: "co.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubCo}"
              captures: { maCo: $.data.id }
            - call: "POST /media-assets/${maCo}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maCo}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epCo}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubCo}"
            - call: "POST /advertisers"
              payload: { name: "AdvCo", billing_email: "aco@x.com" }
              as: PlatformAdmin
              captures: { advCo: $.data.id }
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advCo}", name: "cOpen", budget_cents: 1000000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advCo}"
              captures: { cOpen: $.data.id }
            - call: "POST /ad-campaigns/${cOpen}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advCo}"
              captures: { cOpenv: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cOpen}", episode_id: "${epCo}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cOpenv}" }
              as: Advertiser
              as_user_id: "${advCo}"
              captures: { pOpen: $.data.id }
            - call: "POST /ad-placements/${pOpen}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${advCo}"
          trigger:
            - call: "POST /ad-campaigns/${cOpen}/complete"
              payload: {}
              as: Advertiser
              as_user_id: "${advCo}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CAMPAIGN_HAS_OPEN_PLACEMENTS"

      - name: transcode_result_from_uploaded_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.MediaAsset.TRANSCODING_to_READY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "transcode-result while MediaAsset is UPLOADED (never started) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["MediaAsset maU UPLOADED, transcode never started"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubMu", payout_email: "pmu@x.com" }
              as: PlatformAdmin
              captures: { pubMu: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubMu}", title: "SMu", category: "TECH" }
              as: Publisher
              as_user_id: "${pubMu}"
              captures: { sMu: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${sMu}", title: "EpMu", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubMu}"
              captures: { epMu: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epMu}", source_filename: "mu.wav", source_duration_ms: 100000 }
              as: Publisher
              as_user_id: "${pubMu}"
              captures: { maU: $.data.id }
          trigger:
            - call: "POST /media-assets/${maU}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 100000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: distribution_approve_without_public_feed_rejected
        claim_type: guarded transitions
        grounds: [state_machines.Distribution.PENDING_to_LIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a distribution when the show has no PUBLIC ENABLED feed — guarded cross-entity precondition fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE show with only a PRIVATE feed; PENDING distribution to APPLE"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubDi", payout_email: "pdi@x.com" }
              as: PlatformAdmin
              captures: { pubDi: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubDi}", title: "SDi", category: "TECH" }
              as: Publisher
              as_user_id: "${pubDi}"
              captures: { sDi: $.data.id }
            - call: "POST /shows/${sDi}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubDi}"
            - call: "POST /feeds"
              payload: { show_id: "${sDi}", visibility: "PRIVATE" }
              as: Publisher
              as_user_id: "${pubDi}"
            - call: "POST /distributions"
              payload: { show_id: "${sDi}", channel: "APPLE" }
              as: Publisher
              as_user_id: "${pubDi}"
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /distributions/${dist}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: validations
    instances:
      - name: insert_position_not_offered_returns_position_not_offered
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_POSITION_NOT_OFFERED]"]
