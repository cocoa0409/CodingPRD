              as: FundAccountant
            - call: "POST /distributions/${dist}/pay"
              payload: {}
              as: FundAccountant
          assert:
            - "NavRecord.${nav2}.nav_per_share == 11.0000"
            - "Distribution.${dist}.payment_count == 3"
            - "the DistributionPayment for account ${acc1} has gross_amount == 558.26 and withholding_amount == 0.00"
            - "the DistributionPayment for account ${acc2} has gross_amount == 290.76 and withholding_amount == 0.00"
            - "the DistributionPayment for account ${acc3} has gross_amount == 93.04 and withholding_amount == 22.33"
            - "Distribution.${dist}.total_gross_amount == 942.06"
            - "Distribution.${dist}.total_gross_amount != 942.07 (the sum-then-round answer is explicitly wrong)"
            - "Distribution.${dist}.total_withholding_amount == 22.33"
            - "Distribution.${dist}.total_cash_amount == 290.76"
            - "Distribution.${dist}.total_reinvested_amount == 628.97"
            - "Distribution.${dist}.reinvest_nav_per_share == 11.0000"
            - "the DistributionPayment for account ${acc1} has reinvested_shares == 50.751"
            - "the DistributionPayment for account ${acc3} has reinvested_shares == 6.428"
            - "Distribution.${dist}.total_cash_amount + Distribution.${dist}.total_reinvested_amount + Distribution.${dist}.total_withholding_amount == 942.06"

      - name: breakpoint_tier_resolved_on_gross_amount_before_load_is_deducted
        grounds:
          - calculations.purchase_trade_pricing
          - calculations.roa_household_basis
          - entities.ShareClass.fields.breakpoint_tiers
          - entities.Trade.fields.roa_qualifying_amount
        distinguishing_aspect: |
          Mode (c) of the combinatorial rule: a circular-looking dependency whose evaluation order is
          pinned. The tier depends on the qualifying amount, the qualifying amount includes the purchase,
          and the purchase's net amount depends on the tier. Pinning step 1 on gross 51000.00 selects the
          50000 tier at 0.045 and yields 4870.500 shares; re-deriving the tier from the 48705.00 net
          amount would fall back to the 0 tier at 0.0575 and yield 4806.750 shares.
        test_recipe:
          setup:
            - "Class A with tiers 0/0.0575, 50000/0.045, 100000/0.035, a CA registration of 1000000.00, and NAV 2026-08-03 struck at the 10.0000 seed and FINAL."
            - "Account B is DIRECT/CA, ACTIVE, and holds nothing, so its household basis is 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
