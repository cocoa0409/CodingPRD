          assert:
            - "Candidate 1 (09:00-10:00) is accepted: HTTP 201, status \"SCHEDULED\", duration_minutes 60"
            - "Candidate 2 (10:00-11:00) returns HTTP 409 with error.id == \"ERR_SCOPE_INTERVAL_CONFLICT\" — its start_at equals the incumbent's end_at and both endpoints are inclusive, so this is an overlap and NOT merely a buffer violation"
            - "Candidate 3 (10:30-11:30) returns HTTP 409 with error.id == \"ERR_REPROCESSING_BUFFER_VIOLATION\" — 10:30 does not overlap [09:00, 10:00] at all, but it is only 30 minutes after that end, short of REPROCESSING_BUFFER_MINUTES 45"
            - "Candidate 4 (10:45-11:45) is accepted: exactly 45 minutes after the 10:00 end, and the buffer boundary is inclusive"
            - "Candidate 5 (08:00-08:30) returns HTTP 409 with error.id == \"ERR_REPROCESSING_BUFFER_VIOLATION\" — the buffer is symmetric: its end_at 08:30 is only 30 minutes before the 09:00 start of the following booking"
            - "Candidate 6 (07:00-08:00) is accepted: its end_at is 60 minutes before the 09:00 start of the following booking"
            - "Final state — exactly three bookings exist on ${scope_id}: GET /procedure-bookings?endoscope_asset_id=${scope_id} returns total_count 3 with the 07:00, 09:00 and 10:45 intervals, all \"SCHEDULED\""
            - "EndoscopeAsset.${scope_id}.status is still \"READY\" and cycle_count is still 0 — creating bookings never touches the scope's own lifecycle"

      - name: surgery_block_half_open_window_and_aggregate_concurrency
        grounds:
          - calculations.surgery_block_utilization
          - errors.ERR_BLOCK_CAPACITY_EXCEEDED
          - errors.ERR_BLOCK_WINDOW_EXCEEDED
          - entities.SurgeryCenterBlock.fields.max_concurrent_cases
          - endpoints[POST /procedure-bookings]
        distinguishing_aspect: |
          Resource: SurgeryCenterBlock, multi-occupancy, HALF-OPEN intervals — the exact
          opposite endpoint convention from the sibling instance. A candidate starting exactly
          when an incumbent ends is admissible here, while the same shape is a conflict on the
          scope. Two independent temporal rules are separated: an aggregate concurrency ceiling
          of 2 rooms at every instant inside the candidate's own half-open interval, and a
          containment window that admits end_at == block_end_at but rejects anything past it.
          The accepted adjacency also drives booked_minutes and utilization_bps to 7500 without
          the block flipping to FULL.
        test_recipe:
          setup:
            - "PayerPolicy BLK-2999; four Patients with date_of_birth 2020-01-01, so each is 79 months old at the 2026-08-01T00:00:00Z default clock — above the 36-month pediatric venue line and irrelevant to the overnight rule, which only touches TONSILLECTOMY."
            - "One SurgeryCenterBlock 2026-08-10T08:00:00Z..12:00:00Z with max_concurrent_cases 2, so duration_minutes 240 and capacity_minutes 480, status OPEN, booked_minutes 0 and utilization_bps 0."
            - "Every candidate is TYMPANOSTOMY_TUBES / SURGERY_CENTER on that block with physician_user_id u_ent_1 and no supply lot, so the only variables between calls are the interval and the patient."
            - "Candidates use four different patients, so no candidate is rejected for a reason belonging to the patient."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Block Health", plan_code: "BLK-2999", requires_prior_auth: true }
