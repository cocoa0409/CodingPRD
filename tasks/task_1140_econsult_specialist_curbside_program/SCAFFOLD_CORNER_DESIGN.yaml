            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-V3", specialty_track_id: "${track_id}", question_text: "Pacemaker interrogation scheduling question after battery elective replacement alert.", icd10_primary: "Z45", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
