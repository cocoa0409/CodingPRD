              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/links/${link}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
          assert:
            - "the first pull returns 409 with data.error_id == \"ERR_LINK_NOT_ROUTED\""
            - "the second pull returns 409 with data.error_id == \"ERR_TRADE_NOT_COORDINATED\""
            - "the third pull returns 200 with install_state == \"PULLED\""
            - "GET /cabling/links/${link} reported install_state == \"DESIGNED\" after both refusals"

      - name: rack_capacity_is_checked_before_room_power_capacity
        claim_type: priority_ordering
        grounds:
          - validations[priority=190]
          - validations[priority=195]
          - errors[ERR_RACK_CAPACITY_EXCEEDED]
          - errors[ERR_POWER_CAPACITY_EXCEEDED]
        distinguishing_aspect: "One assignment violates both limits at once — end_ru 45 on a 42 RU rack and power_va 5000 against a 3000 VA UPS — and the answer is ERR_RACK_CAPACITY_EXCEEDED from priority 190; shrinking the interval to a legal one then exposes the power error, and lowering the draw finally admits the row."
        test_recipe:
          setup: ["Project RVT1, room TR01 with ups_capacity_va 3000, and rack RK-A with total_ru 42 and no assignments"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
