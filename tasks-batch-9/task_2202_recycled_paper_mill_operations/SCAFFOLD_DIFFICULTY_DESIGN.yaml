            - "PulpBatch.${pb_id}.consumed_tons == 0.000"

      - name: state_axis_mismatch_beats_safety_exceedance_on_second_run_start
        grounds:
          - validations.priority_31
          - validations.priority_40
          - errors.ERR_RUN_INVALID_STATE
          - errors.ERR_PERMIT_EXCEEDANCE_BLOCK
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
        distinguishing_aspect: |
          Category pair state (31) versus business_safety (40) — the mirror image of the previous
          instance: the same permit is in EXCEEDANCE, but because the run has already left
          SCHEDULED the state check outranks the safety check, so the answer is
          ERR_RUN_INVALID_STATE with HTTP 409 and not ERR_PERMIT_EXCEEDANCE_BLOCK; the two
          instances together prove priority 40 sits strictly between 31 and 67 rather than at
          either extreme.
        test_recipe:
          setup:
            - "Identical base fixture to the previous instance, except the run is created with pulp_draw_tons 20.000 so its first /start succeeds while the permit is still COMPLIANT with zero readings."
            - "After the run reaches RUNNING, the same three July readings are logged, taking the permit to EXCEEDANCE."
