  # ===========================================================================
  - section: calculations
    instances:
      - name: exchange_fee_tier1_cap_exact_boundary
        claim_type: constants_applied
        grounds:
          - "calculations.exchange_fee"
          - "entities.AuctionRecord.fields.exchange_fee_micros"
        distinguishing_aspect: "Gross exactly 5,000,000 micros sits entirely in slab 1: fee == 750,000 (the slab-2 branch requires gross > 5,000,000, strict)."
        test_recipe:
          setup: ["Publisher P, package floor 500,000, APPROVED FIRST_PRICE deal floor 500,000, partner DP; no supply chain"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 5000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { gross: $.data.auction_record.gross_micros, fee: $.data.auction_record.exchange_fee_micros } }
          assert:
            - "gross_micros == 5000000 (exactly the slab-1 cap)"
            - "exchange_fee_micros == 750000 (15% of 5,000,000; zero contribution from slab 2)"

      - name: second_price_sole_winner_clears_at_pinned_floor
        claim_type: correct_result
        grounds:
          - "calculations.clearing_price"
          - "entities.AuctionRecord.fields.clearing_cpm_micros"
        distinguishing_aspect: "SECOND_PRICE with a single eligible bid collapses to the pinned floor: clearing == max(F, (F - 1000) + 1000) == F exactly."
        test_recipe:
          setup: ["Publisher P, package floor 1,000,000, APPROVED SECOND_PRICE deal floor 1,000,000 (approved floor 1,000,000), partner DP"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "SECOND_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 2500000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { clearing: $.data.auction_record.clearing_cpm_micros, gross: $.data.auction_record.gross_micros } }
          assert:
            - "clearing_cpm_micros == 1000000 (sole eligible winner pays the pinned floor, not its 2,500,000 bid)"
            - "gross_micros == 1000000"

      - name: brand_safety_domain_drop_promotes_next_highest_bid
        claim_type: input_set_filtering
        grounds:
          - "calculations.clearing_price"
          - "entities.BlocklistEntry.fields.rule_type"
        distinguishing_aspect: "An ACTIVE EXCHANGE-scope ADVERTISER_DOMAIN entry removes the top bid from the candidate set without error; the next-highest eligible bid wins and the record carries the surviving creative domain."
        test_recipe:
          setup: ["Publisher P, package floor 500,000, APPROVED FIRST_PRICE deal floor 500,000; EXCHANGE blocklist entry on creative domain evil.com"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /blocklist-entries", payload: { scope: "EXCHANGE", rule_type: "ADVERTISER_DOMAIN", value: "evil.com" }, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 1000, creative_domain: "evil.com" }, { bid_cpm_micros: 2000000, impression_count: 1000, creative_domain: "good.com" } ] }, as: DemandSide, captures: { outcome: $.data.outcome, win_domain: $.data.auction_record.creative_domain, clearing: $.data.auction_record.clearing_cpm_micros } }
          assert:
            - "outcome == FILL with creative_domain == good.com (the blocked 3,000,000 bid was dropped before ranking)"
            - "clearing_cpm_micros == 2000000 (FIRST_PRICE pays the surviving winning bid)"

      - name: category_blocklist_excludes_deal_from_selection
        claim_type: input_set_filtering
        grounds:
          - "calculations.deal_selection"
          - "entities.InventoryPackage.fields.category_tags"
        distinguishing_aspect: "A CATEGORY blocklist entry removes any deal whose package carries the blocked tag from the auction's candidate set: the higher-floor deal D1 (tag IAB_ALC) is skipped and the lower-floor D2 (tag IAB_NEWS) fills."
        test_recipe:
          setup: ["Publisher P with TWO packages: PKG1 tags [IAB_ALC] floor 500,000 with APPROVED deal D1 floor 2,000,000; PKG2 tags [IAB_NEWS] floor 500,000 with APPROVED deal D2 floor 1,000,000; same partner DP on both; EXCHANGE CATEGORY entry on IAB_ALC"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg1", ad_format: "DISPLAY", category_tags: ["IAB_ALC"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg1: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg2", ad_format: "DISPLAY", category_tags: ["IAB_NEWS"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg2: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg1}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 2000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { d1: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg2}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { d2: $.data.id } }
            - { call: "POST /deals/${d1}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${d1}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${d2}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${d2}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /blocklist-entries", payload: { scope: "EXCHANGE", rule_type: "CATEGORY", value: "IAB_ALC" }, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { outcome: $.data.outcome, rec_deal: $.data.auction_record.deal_id, clearing: $.data.auction_record.clearing_cpm_micros } }
          assert:
            - "outcome == FILL and the record's deal_id == D2 (D1 excluded by the CATEGORY rule despite ranking first on approved floor)"
            - "clearing_cpm_micros == 3000000"

      - name: floor_boundary_no_fill_consumes_no_counters
        claim_type: precision
        grounds:
          - "calculations.clearing_price"
          - "calculations.auction_throttle"
          - "entities.DemandPartner.fields.current_second_auction_count"
        distinguishing_aspect: "A bid 1 micro below the pinned floor is ineligible (>=, strict) and yields NO_FILL with zero side effects: no record, QPS counter and spend unchanged; a bid exactly at the floor fills."
        test_recipe:
          setup: ["Publisher P, package floor 2,000,000, APPROVED FIRST_PRICE deal floor 2,000,000 (approved floor 2,000,000), partner DP with max_qps 100, daily_cap 100,000,000"]
