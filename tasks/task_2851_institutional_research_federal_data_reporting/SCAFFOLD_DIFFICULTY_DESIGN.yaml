        grounds:
          - state_machines.ReportingCycle.FROZEN_to_REOPENED
          - state_machines.SurveyComponent.CERTIFIED_to_DRAFT
          - state_machines.DashboardPublication.PUBLISHED_to_RESTATEMENT_PENDING
          - state_machines.RestatementRequest.SUBMITTED_to_VOIDED
          - entities.SurveyComponent.fields.certified_by_user_id
        distinguishing_aspect: |
          One reopen call propagates four levels deep - cycle -> component -> both of its
          publications -> the SUBMITTED restatement under the second publication - and the
          already-RESTATEMENT_PENDING publication is still visited, so its child restatement
          is VOIDED even though that publication's own status does not change.
