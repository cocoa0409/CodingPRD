    output: StockLine
    side_effects: ["status=QUOTED"]
  - method: GET
    path: "/stock-lines"
    description: "List stock lines (FK reverse for fair_id, agreement_id)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: ["fair_id?", "agreement_id?", "status?", "line_type?", "limit?", "offset?"]
    output: StockLine[]
    side_effects: []
  - method: GET
    path: "/stock-lines/{id}"
    description: "Read a stock line including all counters"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: StockLine
    side_effects: []
  - method: POST
    path: "/stock-lines/{id}/commit"
