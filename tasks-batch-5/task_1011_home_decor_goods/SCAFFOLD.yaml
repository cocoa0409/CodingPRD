# =============================================================================
# SCAFFOLD.yaml — Home Décor & Home-Goods Store (HomeGoods style)
# §1.0–§1.7. Difficulty: Expert.
# =============================================================================

scenario: |
  1011. Home Décor & Home-Goods Store (HomeGoods style): SKU & treasure-hunt/allocation,
  markdown cadence & clearance, loyalty & BOPIS, oversized delivery & assembly, seasonal
  reset, return policy, home registry, special order

domain_name: home-decor-goods
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite per-store SKU stock reserved/committed/released
  secondary_archetype: pricing_engine          # markdown cadence & clearance ladder
  complexity_layers:
    - optimistic_concurrency                   # SpecialOrder re-quote supersede (OCC on version)
    - cascading_side_effects                   # discontinue / order-cancel / return propagation
    - dual_variant_calculation                 # refund (receipted vs non-receipted); points (provisional vs earned)
    - rate_threshold_triggers                  # markdown tier breakpoints on weeks_on_shelf
    - derived_field_reconciliation             # inventory & points conservation invariants
  entity_topology: flat                        # peer entities linked by FK; multi-root URL surface
  state_machine_shape: parallel                # Order carries independent fulfillment × payment axes; SpecialOrder is cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many                             # StoreInventory junction (Store × Product)
    - cross_aggregate                          # Order lines reference Product across aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code, e.g. CA, NY" }
      - { name: oversized_slots_per_day, type: integer, source: input, description: "Max oversized delivery bookings accepted per calendar day", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESET_LOCKED; RESET_LOCKED during a seasonal reset blocks new orders and delivery confirmations", default: ACTIVE }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Merchandising SKU code, unique", constraints: "unique across Products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "DECOR | FURNITURE | KITCHEN | TEXTILE | SEASONAL" }
      - { name: base_price_cents, type: integer, source: input, description: "Full ticket price in cents", constraints: ">= 0" }
      - { name: clearance_floor_cents, type: integer, source: input, description: "Price floor; current_price_cents never falls below this", constraints: ">= 0, <= base_price_cents" }
      - { name: is_treasure_hunt, type: boolean, source: input, description: "Treasure-hunt SKU: uses the compressed markdown ladder", default: false }
      - { name: first_received_at, type: datetime, source: input, description: "Timestamp the SKU first hit the sales floor; anchors weeks_on_shelf" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: ACTIVE }
      - { name: weeks_on_shelf, type: integer, source: computed, description: "floor((clock_now - first_received_at)/7 days), min 0" }
      - { name: markdown_tier, type: enum, source: computed, description: "FULL | MARKDOWN_1 | MARKDOWN_2 | CLEARANCE derived from weeks_on_shelf and is_treasure_hunt" }
      - { name: current_price_cents, type: integer, source: computed, description: "max(round_half_up(base_price_cents*(1-markdown_pct)), clearance_floor_cents)" }

  - name: StoreInventory
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: allocated_qty, type: integer, source: input, description: "Total units allocated to this store for this SKU (treasure-hunt allocation)", constraints: ">= 0" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Units available to reserve; starts equal to allocated_qty" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units reserved by open order lines" }
      - { name: sold_qty, type: integer, source: computed, description: "Units committed (fulfilled) net of restocked returns" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEAD; DEAD when parent Product is discontinued", default: ACTIVE }

  - name: LoyaltyMember
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Member email, unique", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Cumulative captured spend; increments by Order.total_due_cents on fulfill; seeds from initial_lifetime_spend_cents at registration" }
      - { name: tier, type: enum, source: computed, description: "STANDARD | SILVER | GOLD derived from lifetime_spend_cents" }
      - { name: points_balance, type: integer, source: computed, description: "Redeemable points; decremented on order redemption, incremented on earn, restored on cancel", default: 0 }
      - { name: points_earned_total, type: integer, source: computed, description: "Cumulative points ever earned (never decreases)" }
      - { name: points_redeemed_total, type: integer, source: computed, description: "Cumulative points ever redeemed net of restored redemptions" }
      - { name: status, type: enum, source: system, description: "ACTIVE (members are never deactivated in this version; the single-value enum is a stable guard for SpecialOrder confirm)", default: ACTIVE }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; null for guest orders", default: null }
      - { name: order_type, type: enum, source: input, description: "CARRYOUT | BOPIS | OVERSIZED_DELIVERY" }
      - { name: requested_redeem_points, type: integer, source: input, description: "Points the member redeems on this order (1 point = 1 cent)", default: 0, constraints: ">= 0" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING | READY | FULFILLED | CANCELLED (independent axis)", default: PENDING }
      - { name: payment_status, type: enum, source: system, description: "AUTHORIZED | CAPTURED | REFUNDED | VOIDED (independent axis)", default: AUTHORIZED }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of line_net_cents (round per line, then sum)" }
      - { name: redeemed_cents, type: integer, source: computed, description: "= requested_redeem_points (validated <= member.points_balance at create); 1 point = 1 cent; deducted from member.points_balance at create" }
      - { name: total_due_cents, type: integer, source: computed, description: "max(subtotal_cents - redeemed_cents, 0)" }
      - { name: provisional_points, type: integer, source: computed, description: "floor(subtotal_cents/100) * tier_rate, estimated at create, not yet in balance" }
      - { name: earned_points, type: integer, source: computed, description: "floor(total_due_cents/100) * tier_rate, credited to member on fulfill" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Clock timestamp when fulfillment_status became FULFILLED; anchors return window" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; at most one line per product per order" }
      - { name: qty, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of Product.current_price_cents at line-add time" }
      - { name: line_net_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents*qty*(1 - tier_discount_pct))" }
      - { name: returned_qty, type: integer, source: computed, description: "Cumulative units returned via approved Returns", default: 0 }

  - name: DeliveryBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> AssemblyCrew.id; null when needs_assembly is false", default: null }
      - { name: delivery_date, type: string, source: input, description: "Calendar day (YYYY-MM-DD) of the oversized delivery" }
      - { name: needs_assembly, type: boolean, source: input, description: "True when white-glove assembly is required", default: false }
      - { name: assembly_window_start, type: datetime, source: input, description: "Assembly window start (inclusive); required when needs_assembly", default: null }
      - { name: assembly_window_end, type: datetime, source: input, description: "Assembly window end (exclusive); required when needs_assembly", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: AssemblyCrew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: name, type: string, source: input, description: "Crew display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE (crews are always active in this version)", default: ACTIVE }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; identifies the line (one line per product per order)" }
      - { name: returned_qty, type: integer, source: input, description: "Units being returned", constraints: ">= 1" }
      - { name: variant, type: enum, source: input, description: "RECEIPTED | NON_RECEIPTED; selects refund basis", default: RECEIPTED }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED", default: REQUESTED }
      - { name: base_refund_cents, type: integer, source: computed, description: "RECEIPTED: line.unit_price_cents*returned_qty; NON_RECEIPTED: product.current_price_cents*returned_qty" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "round_half_up(base_refund_cents*0.15) when order_type==OVERSIZED_DELIVERY, else 0" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "base_refund_cents - restocking_fee_cents" }

  - name: Registry
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: owner_member_id, type: string, source: input, description: "FK -> LoyaltyMember.id" }
      - { name: title, type: string, source: input, description: "Registry title, e.g. 'Housewarming'" }
      - { name: event_date, type: string, source: input, description: "Event date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: ACTIVE }

  - name: RegistryItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: registry_id, type: string, source: input, description: "FK -> Registry.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: desired_qty, type: integer, source: input, description: "Units desired", constraints: ">= 1" }
      - { name: purchased_qty, type: integer, source: computed, description: "Units purchased against this registry item", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | UNAVAILABLE; UNAVAILABLE when product discontinued", default: OPEN }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id" }
      - { name: description, type: string, source: input, description: "Free-text description of the custom/special-order item" }
      - { name: quoted_price_cents, type: integer, source: system, description: "Latest quoted price; set by the quote action", default: null }
      - { name: quote_revision, type: integer, source: system, description: "Increments each time a quote is (re)issued; starts at 0", default: 0 }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(quoted_price_cents*0.25) captured at confirm" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | CUSTOMER_REVIEW | CONFIRMED | CANCELLED", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESET_LOCKED
        trigger: "POST /stores/{id}/lock"
        actor: Admin
        preconditions: ["Store.status == ACTIVE"]
        side_effects:
          - "Store enters seasonal reset: POST /orders and DeliveryBooking CONFIRM at this store are blocked while RESET_LOCKED"
      - from: RESET_LOCKED
        to: ACTIVE
        trigger: "POST /stores/{id}/unlock"
        actor: Admin
        preconditions: ["Store.status == RESET_LOCKED"]
        side_effects: ["Store resumes normal operation"]

  - entity: Product
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{id}/discontinue"
        actor: MerchandisingManager
        preconditions: ["Product.status == ACTIVE"]
        side_effects:
          - "CASCADE-A depth-1: every StoreInventory with product_id==this and status==ACTIVE -> status DEAD (its reserved_qty stays reserved for open lines)"
          - "CASCADE-A depth-2: each StoreInventory that just went DEAD -> every RegistryItem with product_id==this and status==OPEN -> status UNAVAILABLE"
          - "CASCADE-A depth-3: each RegistryItem that just went UNAVAILABLE -> its parent Registry updated_at refreshed (registry availability recomputed)"

  - entity: Order
    field: fulfillment_status
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "POST /orders/{id}/ready"
        actor: StoreAssociate
        preconditions:
          - "Order.fulfillment_status == PENDING"
          - "Order has >= 1 OrderLine"
          - "Store.status == ACTIVE"
        side_effects: ["Order marked ready for BOPIS pickup / staging"]
      - from: READY
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: StoreAssociate
        preconditions:
          - "Order.fulfillment_status == READY"
          - "Order.payment_status == CAPTURED"
        side_effects:
          - "For each line: StoreInventory.reserved_qty -= qty, sold_qty += qty (inventory conservation preserved)"
          - "member.points_balance += Order.earned_points; member.points_earned_total += earned_points"
          - "member.lifetime_spend_cents += Order.total_due_cents; member.tier recomputed"
          - "For each line whose product matches an OPEN RegistryItem on an ACTIVE Registry owned by member: RegistryItem.purchased_qty += qty"
          - "Order.fulfilled_at = clock_now"
      - from: [PENDING, READY]
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: StoreAssociate
        preconditions: ["Order.fulfillment_status in {PENDING, READY}"]
        side_effects:
          - "CASCADE-B depth-1: for each OrderLine -> StoreInventory.reserved_qty -= qty, on_hand_qty += qty"
          - "CASCADE-B depth-2: each StoreInventory whose on_hand_qty changed -> owning Product.updated_at refreshed (availability reconciled)"
          - "member.points_balance += Order.redeemed_cents (points redemption restored); member.points_redeemed_total -= redeemed_cents"
          - "If payment_status == AUTHORIZED -> payment_status VOIDED"

  - entity: Order
    field: payment_status
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{id}/capture"
        actor: StoreAssociate
        preconditions: ["Order.payment_status == AUTHORIZED", "Order.fulfillment_status != CANCELLED"]
        side_effects: ["Payment captured; order becomes fulfillable"]
      - from: CAPTURED
        to: REFUNDED
        trigger: "system (Return APPROVED that returns the full ordered quantity across all lines)"
        actor: system
        preconditions: ["Order.payment_status == CAPTURED"]
        side_effects: ["Order fully refunded"]
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system (order cancelled before capture)"
        actor: system
        preconditions: []
        side_effects: ["Authorization voided"]

  - entity: DeliveryBooking
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /delivery-bookings/{id}/confirm"
        actor: DeliveryCoordinator
        preconditions:
          - "DeliveryBooking.status == SCHEDULED"
          - "Store.status == ACTIVE"
        side_effects: ["Booking confirmed; slot and crew window remain occupied"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /delivery-bookings/{id}/complete"
        actor: DeliveryCoordinator
        preconditions:
          - "DeliveryBooking.status == CONFIRMED"
          - "clock_now date >= delivery_date"
        side_effects: ["Delivery completed"]
      - from: [SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /delivery-bookings/{id}/cancel"
        actor: DeliveryCoordinator
        preconditions: ["DeliveryBooking.status in {SCHEDULED, CONFIRMED}"]
        side_effects: ["Day-capacity slot released; assembly crew window released"]

  - entity: Return
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: StoreAssociate
        preconditions:
          - "Return.status == REQUESTED"
          - "Order.payment_status == CAPTURED"
        side_effects:
          - "CASCADE-C depth-1: OrderLine.returned_qty += returned_qty for the matching (order_id, product_id) line"
          - "CASCADE-C depth-2: matching StoreInventory.sold_qty -= returned_qty, on_hand_qty += returned_qty (restock; inventory conservation preserved)"
          - "member.points_balance clawback: -= floor(refund_amount_cents/100)*tier_rate credited earlier for these units (never below 0)"
          - "If cumulative returned_qty across all lines == cumulative ordered qty -> Order.payment_status CAPTURED -> REFUNDED"

  - entity: Registry
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /registries/{id}/close"
        actor: Customer
        preconditions: ["Registry.status == ACTIVE", "acting Customer owns the Registry (owner_member_id == X-User-ID)"]
        side_effects: ["Registry closed; no further items may be added"]

  - entity: RegistryItem
    field: status
    initial_state: OPEN
    terminal_states: [UNAVAILABLE]
    transitions:
      - from: OPEN
        to: UNAVAILABLE
        trigger: "system (parent Product discontinued — CASCADE-A depth-2)"
        actor: system
        preconditions: []
        side_effects: ["Registry item flagged unavailable"]

  - entity: SpecialOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status == DRAFT", "expected_special_order_version matches current SpecialOrder.version"]
        side_effects: ["quoted_price_cents set; quote_revision += 1; increments SpecialOrder.version by 1"]
      - from: QUOTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status == QUOTED", "expected_special_order_version matches current SpecialOrder.version"]
        note: "Re-quote supersedes the prior quote (cyclic self-loop); OCC-guarded (see concurrency_rules)."
        side_effects: ["quoted_price_cents replaced; quote_revision += 1; increments SpecialOrder.version by 1"]
      - from: QUOTED
        to: CUSTOMER_REVIEW
        trigger: "POST /special-orders/{id}/submit-for-review"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status == QUOTED"]
        side_effects: ["increments SpecialOrder.version by 1"]
      - from: CUSTOMER_REVIEW
        to: QUOTED
        trigger: "POST /special-orders/{id}/request-changes"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status == CUSTOMER_REVIEW"]
        note: "Cyclic revision loop back to QUOTED."
        side_effects: ["increments SpecialOrder.version by 1"]
      - from: CUSTOMER_REVIEW
        to: CONFIRMED
        trigger: "POST /special-orders/{id}/confirm"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status == CUSTOMER_REVIEW", "LoyaltyMember.status == ACTIVE"]
        side_effects: ["deposit_cents computed = round_half_up(quoted_price_cents*0.25); increments SpecialOrder.version by 1"]
      - from: [DRAFT, QUOTED, CUSTOMER_REVIEW]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreAssociate
        preconditions: ["SpecialOrder.status in {DRAFT, QUOTED, CUSTOMER_REVIEW}"]
        side_effects: ["increments SpecialOrder.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: special-order-requote-supersede
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{id}/quote"
    occ_field: "expected_special_order_version"
    description: |
      Issuing a quote against a SpecialOrder whose version has advanced since the
      client last observed it is rejected. A new quote legitimately supersedes the
      prior one (the QUOTED->QUOTED self-loop), so a stale-version quote is the
      loser: another writer has already re-quoted (advancing the version) and this
      writer's view of the SpecialOrder is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: product_pricing
    trigger: "read of Product (GET /products/{id}) and snapshot at OrderLine add"
    algorithm: threshold
    formula: |
      weeks_on_shelf = max(0, floor((clock_now - first_received_at) / 7 days))
      if is_treasure_hunt:
        markdown_tier = FULL      if weeks_on_shelf <  8
                        CLEARANCE if weeks_on_shelf >= 8
        markdown_pct  = 0.00 (FULL) | 0.40 (CLEARANCE)
      else:
        markdown_tier = FULL       if weeks_on_shelf <  4
                        MARKDOWN_1 if 4  <= weeks_on_shelf < 8
                        MARKDOWN_2 if 8  <= weeks_on_shelf < 12
                        CLEARANCE  if weeks_on_shelf >= 12
        markdown_pct  = 0.00 | 0.15 | 0.30 | 0.50
      current_price_cents = max(round_half_up(base_price_cents * (1 - markdown_pct)), clearance_floor_cents)
    input_set: "Single Product; clock_now from logical clock"
    constants:
      REGULAR_TIER_WEEKS: [4, 8, 12]
      REGULAR_PCT: [0.00, 0.15, 0.30, 0.50]
      TREASURE_TIER_WEEKS: [8]
      TREASURE_PCT: [0.00, 0.40]
    precision: "2 decimal places at cents granularity, round_half_up"

  - name: order_totals
    trigger: "OrderLine add and Order create; recomputed on every line mutation"
    algorithm: aggregation
    formula: |
      tier_discount_pct = STANDARD 0.00 | SILVER 0.05 | GOLD 0.10   (0.00 for guest orders with member_id null)
      per line: line_net_cents = round_half_up(unit_price_cents * qty * (1 - tier_discount_pct))
      subtotal_cents = SUM over lines of line_net_cents        # PINNED: round per line, THEN sum
      redeemed_cents = requested_redeem_points   # validated <= member.points_balance at create; deducted at create
      total_due_cents = max(subtotal_cents - redeemed_cents, 0)
    input_set: "All OrderLines belonging to the Order"
    constants:
      TIER_DISCOUNT_PCT: { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "round_half_up per line before summation (order pinned); redemption 1 point = 1 cent"

  - name: loyalty_points
    trigger: "provisional at Order create; earned credited on POST /orders/{id}/fulfill"
    algorithm: threshold
    formula: |
      tier_rate = STANDARD 1 | SILVER 2 | GOLD 3   (points per whole dollar)
      variant PROVISIONAL: provisional_points = floor(subtotal_cents / 100) * tier_rate   (estimate; NOT added to balance)
      variant EARNED:      earned_points      = floor(total_due_cents / 100) * tier_rate  (credited to member.points_balance on fulfill)
    input_set: "Single Order + owning LoyaltyMember tier"
    constants:
      TIER_RATE: { STANDARD: 1, SILVER: 2, GOLD: 3 }
    precision: "integer points, floor"
    variants:
      - name: provisional
        when: "at Order create, over subtotal_cents (pre-redemption)"
        difference: "uses subtotal_cents and is not persisted to points_balance"
      - name: earned
        when: "at fulfill, over total_due_cents (post-redemption)"
        difference: "uses total_due_cents and is credited to points_balance; diverges from provisional whenever redeemed_cents > 0"

  - name: return_refund
    trigger: "Return create (compute) and POST /returns/{id}/approve (apply)"
    algorithm: threshold
    formula: |
      unit_basis = variant==RECEIPTED ? matching_OrderLine.unit_price_cents
                                      : Product.current_price_cents (at approval, today's markdown/clearance price)
      base_refund_cents = unit_basis * returned_qty
      restocking_fee_cents = (Order.order_type == OVERSIZED_DELIVERY) ? round_half_up(base_refund_cents * 0.15) : 0
      refund_amount_cents = base_refund_cents - restocking_fee_cents
    input_set: "Single Return + its matching OrderLine + Product + parent Order"
    constants:
      RESTOCK_FEE_PCT: 0.15
    precision: "round_half_up for restocking fee"
    variants:
      - name: receipted
        when: "variant == RECEIPTED"
        difference: "basis is the original paid unit_price_cents"
      - name: non_receipted
        when: "variant == NON_RECEIPTED"
        difference: "basis is Product.current_price_cents today, which can be far lower after markdown"

  - name: loyalty_tier
    trigger: "member create (seed) and every lifetime_spend_cents change"
    algorithm: threshold
    formula: |
      tier = STANDARD if lifetime_spend_cents <  50000
             SILVER   if 50000  <= lifetime_spend_cents < 200000
             GOLD     if lifetime_spend_cents >= 200000
    input_set: "Single LoyaltyMember"
    constants:
      SILVER_MIN_CENTS: 50000
      GOLD_MIN_CENTS: 200000

  - name: inventory_conservation
    trigger: "invariant maintained on allocate, line add, fulfill, cancel, return approve, adjust"
    algorithm: aggregation
    formula: |
      INVARIANT (per StoreInventory row): allocated_qty == on_hand_qty + reserved_qty + sold_qty
      Forward (line add):      on_hand_qty -= qty; reserved_qty += qty
      Compensating (cancel):   reserved_qty -= qty; on_hand_qty += qty
      Commit (fulfill):        reserved_qty -= qty; sold_qty += qty
      Restock (return approve):sold_qty -= returned_qty; on_hand_qty += returned_qty
      Adjust:                  allocated_qty += delta; on_hand_qty += delta
      on_hand_qty >= 0 always
    input_set: "Single StoreInventory row for (store_id, product_id)"
    precision: "integer units"

  - name: points_conservation
    trigger: "invariant maintained on order redeem, cancel restore, earn"
    algorithm: aggregation
    formula: |
      INVARIANT (per LoyaltyMember): points_balance == points_earned_total - points_redeemed_total
      Forward (order create redeem):    points_balance -= redeemed_cents; points_redeemed_total += redeemed_cents
      Compensating (order cancel):      points_balance += redeemed_cents; points_redeemed_total -= redeemed_cents
      Earn (fulfill):                   points_balance += earned_points;  points_earned_total  += earned_points
      Clawback (return approve):        points_balance -= claw; points_earned_total -= claw   (claw = floor(refund_amount_cents/100)*tier_rate, floored at balance >= 0)
    input_set: "Single LoyaltyMember"
    precision: "integer points"

  - name: delivery_day_capacity
    trigger: "POST /delivery-bookings (create)"
    algorithm: interval_merge
    formula: |
      occupied = COUNT of DeliveryBooking where store_id == this.store_id
                 AND delivery_date == this.delivery_date
                 AND status in {SCHEDULED, CONFIRMED}
      reject with ERR_DELIVERY_DAY_FULL when occupied >= Store.oversized_slots_per_day
    input_set: "DeliveryBookings for the same store and same calendar day"
    precision: "integer count; discrete-day aggregate-capacity semantics"

  - name: assembly_window_overlap
    trigger: "POST /delivery-bookings (create) when needs_assembly is true"
    algorithm: interval_merge
    formula: |
      For the requested [assembly_window_start, assembly_window_end) on crew_id, reject with
      ERR_ASSEMBLY_CREW_UNAVAILABLE when there exists a DeliveryBooking on the same crew_id with
      status in {SCHEDULED, CONFIRMED} such that:
        requested_start < existing_end AND existing_start < requested_end
      Half-open intervals: touching endpoints (requested_start == existing_end) do NOT overlap and are allowed.
    input_set: "DeliveryBookings sharing the same crew_id"
    precision: "datetime; half-open interval adjacency (no buffer)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and referenced FK resources exist (validated left-to-right)"
    error_id: "ERR_STORE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_REGISTRY_NOT_FOUND | ERR_SPECIAL_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: state
    check: "Target resource in the correct state for the transition (includes Order.fulfillment_status and Order.payment_status guards; Return requires Order FULFILLED)"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_FULFILLED | ERR_PAYMENT_NOT_CAPTURED | ERR_PRODUCT_DISCONTINUED | ERR_REGISTRY_CLOSED | ERR_SPECIAL_ORDER_NOT_REVIEWABLE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: business_referential
    check: "Cross-entity link integrity: OrderLine product must be ACTIVE and stocked at Order.store; at most one line per product per order; Return (order_id, product_id) must match an existing line; crew_id belongs to the same store"
    error_id: "ERR_DUPLICATE_LINE | ERR_PRODUCT_NOT_STOCKED | ERR_LINE_NOT_FOUND | ERR_CREW_STORE_MISMATCH"
    http_status: 409
    applies_to: "POST /orders/{id}/lines, POST /returns, POST /delivery-bookings"

  - priority: 6
    category: state
    check: "Owning Store must not be RESET_LOCKED for order creation and delivery confirmation (seasonal reset gate)"
    error_id: ERR_STORE_RESET_LOCKED
    http_status: 409
    applies_to: "POST /orders, POST /delivery-bookings/{id}/confirm"

  - priority: 7
    category: business_temporal
    check: "Temporal window rules: delivery_date not in the past; per-day delivery capacity not exceeded; return within 30 days of Order.fulfilled_at"
    error_id: "ERR_DELIVERY_DATE_IN_PAST | ERR_DELIVERY_DAY_FULL | ERR_RETURN_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /delivery-bookings, POST /returns"

  - priority: 8
    category: business_constraint
    check: "Resource-occupation constraints: assembly crew window free; sufficient on-hand inventory to reserve requested qty"
    error_id: "ERR_ASSEMBLY_CREW_UNAVAILABLE | ERR_INSUFFICIENT_INVENTORY"
    http_status: 409
    applies_to: "POST /delivery-bookings, POST /orders/{id}/lines"

  - priority: 9
    category: business_fiscal
    check: "Fiscal limits: redeemed points cannot exceed member points_balance; returned_qty cannot exceed the line's net sold (ordered minus already returned)"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_RETURN_QTY_EXCEEDS"
    http_status: 422
    applies_to: "POST /orders, POST /returns"

  - priority: 10
    category: state
    check: "OCC: expected_special_order_version must equal SpecialOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /special-orders/{id}/quote"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving; default 2026-07-01T00:00:00Z before any set) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock_now = to_iso8601; affects weeks_on_shelf, delivery date checks, return window"]

  # ---- Stores ----
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [Admin]
    code: 201
    input: [name, region_code, oversized_slots_per_day]
    output: Store
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/stores/{id}"
    description: "Get a store"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{id}/lock"
    description: "Enter seasonal reset (lock)"
    roles: [Admin]
    code: 200
    input: []
    output: Store
    side_effects: ["status ACTIVE -> RESET_LOCKED"]
  - method: POST
    path: "/stores/{id}/unlock"
    description: "Exit seasonal reset (unlock)"
    roles: [Admin]
    code: 200
    input: []
    output: Store
    side_effects: ["status RESET_LOCKED -> ACTIVE"]

  # ---- Products ----
  - method: POST
    path: "/products"
    description: "Create a product (SKU)"
    roles: [MerchandisingManager]
    code: 201
    input: [sku, name, category, base_price_cents, clearance_floor_cents, first_received_at, "is_treasure_hunt?"]
    output: Product
    side_effects: ["status=ACTIVE; markdown_tier & current_price_cents computed from clock"]
  - method: GET
    path: "/products/{id}"
    description: "Get a product (returns computed markdown_tier and current_price_cents at clock_now)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products (browse), optional category filter"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["category?"]
    output: "Product[]"
    side_effects: []
  - method: POST
    path: "/products/{id}/discontinue"
    description: "Discontinue a product (fires CASCADE-A)"
    roles: [MerchandisingManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status ACTIVE -> DISCONTINUED; CASCADE-A over StoreInventory -> RegistryItem -> Registry"]

  # ---- Store Inventory (allocation) ----
  - method: POST
    path: "/store-inventory"
    description: "Allocate a SKU quantity to a store (treasure-hunt allocation)"
    roles: [MerchandisingManager]
    code: 201
    input: [store_id, product_id, allocated_qty]
    output: StoreInventory
    side_effects: ["on_hand_qty=allocated_qty; reserved_qty=0; sold_qty=0; status=ACTIVE"]
  - method: GET
    path: "/store-inventory/{id}"
    description: "Get a store-inventory row"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: StoreInventory
    side_effects: []
  - method: GET
    path: "/store-inventory"
    description: "List store-inventory rows; filter by store_id and/or product_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["store_id?", "product_id?"]
    output: "StoreInventory[]"
    side_effects: []
  - method: POST
    path: "/store-inventory/{id}/adjust"
    description: "Adjust allocation (receive more stock or shrink)"
    roles: [MerchandisingManager]
    code: 200
    input: [delta_qty]
    output: StoreInventory
    side_effects: ["allocated_qty += delta_qty; on_hand_qty += delta_qty (must keep on_hand_qty >= 0)"]

  # ---- Loyalty Members ----
  - method: POST
    path: "/loyalty-members"
    description: "Register a loyalty member"
    roles: [StoreAssociate]
    code: 201
    input: [email, full_name, "initial_lifetime_spend_cents?", "initial_points_balance?"]
    output: LoyaltyMember
    side_effects: ["lifetime_spend_cents seeded; tier computed; points_balance & points_earned_total seeded from initial_points_balance; status=ACTIVE"]
  - method: GET
    path: "/loyalty-members/{id}"
    description: "Get a loyalty member"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: LoyaltyMember
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/orders"
    description: "Create an order (blocked when store RESET_LOCKED)"
    roles: [StoreAssociate]
    code: 201
    input: [store_id, order_type, "member_id?", "requested_redeem_points?"]
    output: Order
    side_effects: ["fulfillment_status=PENDING; payment_status=AUTHORIZED; redeemed_cents deducted from member.points_balance; totals & provisional_points computed"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders; filter by store_id and/or member_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["store_id?", "member_id?"]
    output: "Order[]"
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to an order (reserves inventory)"
    roles: [StoreAssociate]
    code: 201
    input: [product_id, qty]
    output: OrderLine
    side_effects: ["unit_price_cents snapshot from Product.current_price_cents; StoreInventory on_hand -= qty, reserved += qty; Order totals recomputed"]
  - method: POST
    path: "/orders/{id}/capture"
    description: "Capture payment (payment axis)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status AUTHORIZED -> CAPTURED"]
  - method: POST
    path: "/orders/{id}/ready"
    description: "Mark order ready (fulfillment axis)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status PENDING -> READY"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill / complete pickup (commits inventory, earns points, registry credit)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status READY -> FULFILLED; inventory commit; earned_points credited; lifetime_spend += total_due_cents; registry purchased_qty updated; fulfilled_at set"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel order (fires CASCADE-B, restores redeemed points, voids auth)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status -> CANCELLED; CASCADE-B releases reserved inventory; redeemed points restored; payment AUTHORIZED -> VOIDED"]

  # ---- Order Lines (reads) ----
  - method: GET
    path: "/order-lines/{id}"
    description: "Get an order line"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines; filter by order_id and/or product_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["order_id?", "product_id?"]
    output: "OrderLine[]"
    side_effects: []

  # ---- Assembly Crews ----
  - method: POST
    path: "/assembly-crews"
    description: "Create an assembly crew for a store"
    roles: [Admin]
    code: 201
    input: [store_id, name]
    output: AssemblyCrew
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/assembly-crews/{id}"
    description: "Get an assembly crew"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: AssemblyCrew
    side_effects: []
  - method: GET
    path: "/assembly-crews"
    description: "List assembly crews; filter by store_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["store_id?"]
    output: "AssemblyCrew[]"
    side_effects: []

  # ---- Delivery Bookings ----
  - method: POST
    path: "/delivery-bookings"
    description: "Book an oversized delivery (day-capacity + assembly-window checks)"
    roles: [DeliveryCoordinator]
    code: 201
    input: [order_id, store_id, delivery_date, "needs_assembly?", "crew_id?", "assembly_window_start?", "assembly_window_end?"]
    output: DeliveryBooking
    side_effects: ["status=SCHEDULED; occupies a day slot and (if assembly) a crew window"]
  - method: GET
    path: "/delivery-bookings/{id}"
    description: "Get a delivery booking"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: DeliveryBooking
    side_effects: []
  - method: GET
    path: "/delivery-bookings"
    description: "List delivery bookings; filter by order_id, store_id, crew_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["order_id?", "store_id?", "crew_id?"]
    output: "DeliveryBooking[]"
    side_effects: []
  - method: POST
    path: "/delivery-bookings/{id}/confirm"
    description: "Confirm a delivery booking (blocked when store RESET_LOCKED)"
    roles: [DeliveryCoordinator]
    code: 200
    input: []
    output: DeliveryBooking
    side_effects: ["status SCHEDULED -> CONFIRMED"]
  - method: POST
    path: "/delivery-bookings/{id}/complete"
    description: "Complete a delivery (on/after delivery_date)"
    roles: [DeliveryCoordinator]
    code: 200
    input: []
    output: DeliveryBooking
    side_effects: ["status CONFIRMED -> COMPLETED"]
  - method: POST
    path: "/delivery-bookings/{id}/cancel"
    description: "Cancel a delivery booking (releases slot and crew window)"
    roles: [DeliveryCoordinator]
    code: 200
    input: []
    output: DeliveryBooking
    side_effects: ["status -> CANCELLED"]

  # ---- Returns ----
  - method: POST
    path: "/returns"
    description: "Create a return request (order must be FULFILLED; within window)"
    roles: [StoreAssociate]
    code: 201
    input: [order_id, product_id, returned_qty, "variant?"]
    output: Return
    side_effects: ["status=REQUESTED; base_refund/restocking/refund computed"]
  - method: GET
    path: "/returns/{id}"
    description: "Get a return"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns; filter by order_id and/or product_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["order_id?", "product_id?"]
    output: "Return[]"
    side_effects: []
  - method: POST
    path: "/returns/{id}/approve"
    description: "Approve a return (fires CASCADE-C: restock, refund, points clawback)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Return
    side_effects: ["status REQUESTED -> APPROVED; OrderLine.returned_qty += qty; StoreInventory restock; points clawback; full-return -> Order payment REFUNDED"]

  # ---- Registries ----
  - method: POST
    path: "/registries"
    description: "Create a home registry (owned by the acting Customer)"
    roles: [Customer]
    code: 201
    input: [owner_member_id, title, event_date]
    output: Registry
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/registries/{id}"
    description: "Get a registry"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: Registry
    side_effects: []
  - method: GET
    path: "/registries"
    description: "List registries; filter by owner_member_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["owner_member_id?"]
    output: "Registry[]"
    side_effects: []
  - method: POST
    path: "/registries/{id}/items"
    description: "Add an item to a registry"
    roles: [Customer]
    code: 201
    input: [product_id, desired_qty]
    output: RegistryItem
    side_effects: ["status=OPEN; purchased_qty=0"]
  - method: POST
    path: "/registries/{id}/close"
    description: "Close a registry"
    roles: [Customer]
    code: 200
    input: []
    output: Registry
    side_effects: ["status ACTIVE -> CLOSED"]

  # ---- Registry Items (reads) ----
  - method: GET
    path: "/registry-items/{id}"
    description: "Get a registry item"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: RegistryItem
    side_effects: []
  - method: GET
    path: "/registry-items"
    description: "List registry items; filter by registry_id and/or product_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["registry_id?", "product_id?"]
    output: "RegistryItem[]"
    side_effects: []

  # ---- Special Orders ----
  - method: POST
    path: "/special-orders"
    description: "Open a special order"
    roles: [StoreAssociate]
    code: 201
    input: [store_id, member_id, description]
    output: SpecialOrder
    side_effects: ["status=DRAFT; quote_revision=0; version=1"]
  - method: GET
    path: "/special-orders/{id}"
    description: "Get a special order"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List special orders; filter by store_id and/or member_id (FK reverse-reachability)"
    roles: [Admin, MerchandisingManager, StoreAssociate, DeliveryCoordinator, Customer]
    code: 200
    input: ["store_id?", "member_id?"]
    output: "SpecialOrder[]"
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/quote"
    description: "Issue or re-issue a quote (OCC-guarded; supersedes prior quote)"
    roles: [StoreAssociate]
    code: 200
    input: [quoted_price_cents, expected_special_order_version]
    output: SpecialOrder
    side_effects: ["status -> QUOTED; quoted_price_cents set; quote_revision += 1; increments SpecialOrder.version by 1"]
  - method: POST
    path: "/special-orders/{id}/submit-for-review"
    description: "Submit quote for customer review"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status QUOTED -> CUSTOMER_REVIEW; increments SpecialOrder.version by 1"]
  - method: POST
    path: "/special-orders/{id}/request-changes"
    description: "Customer requests changes (cyclic back to QUOTED)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status CUSTOMER_REVIEW -> QUOTED; increments SpecialOrder.version by 1"]
  - method: POST
    path: "/special-orders/{id}/confirm"
    description: "Confirm special order (captures 25% deposit)"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status CUSTOMER_REVIEW -> CONFIRMED; deposit_cents computed; increments SpecialOrder.version by 1"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a special order"
    roles: [StoreAssociate]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status -> CANCELLED; increments SpecialOrder.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or negative/zero where positive required" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation, or Customer acting on a registry it does not own" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_INVENTORY_NOT_FOUND, http: 404, condition: "StoreInventory id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "LoyaltyMember id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "DeliveryBooking id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "AssemblyCrew id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return id does not exist" }
  - { id: ERR_REGISTRY_NOT_FOUND, http: 404, condition: "Registry id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Return requires the Order to be FULFILLED" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "Fulfill/return requires Order.payment_status == CAPTURED" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Operation references a DISCONTINUED product" }
  - { id: ERR_REGISTRY_CLOSED, http: 409, condition: "Registry is CLOSED; no items may be added" }
  - { id: ERR_SPECIAL_ORDER_NOT_REVIEWABLE, http: 409, condition: "Confirm requires SpecialOrder.status == CUSTOMER_REVIEW" }
  - { id: ERR_DUPLICATE_LINE, http: 409, condition: "An order already has a line for this product" }
  - { id: ERR_PRODUCT_NOT_STOCKED, http: 409, condition: "No StoreInventory row for this product at the order's store" }
  - { id: ERR_LINE_NOT_FOUND, http: 409, condition: "Return (order_id, product_id) matches no order line" }
  - { id: ERR_CREW_STORE_MISMATCH, http: 409, condition: "crew_id belongs to a different store than the booking" }
  - { id: ERR_STORE_RESET_LOCKED, http: 409, condition: "Store is RESET_LOCKED (seasonal reset) — order creation / delivery confirmation blocked" }
  - { id: ERR_DELIVERY_DATE_IN_PAST, http: 409, condition: "delivery_date is before clock_now date" }
  - { id: ERR_DELIVERY_DAY_FULL, http: 409, condition: "Store day capacity (oversized_slots_per_day) reached for delivery_date" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "More than 30 days since Order.fulfilled_at" }
  - { id: ERR_ASSEMBLY_CREW_UNAVAILABLE, http: 409, condition: "Requested assembly window overlaps another booking on the same crew" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "on_hand_qty - would-be reservation < requested qty" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "requested_redeem_points exceeds member.points_balance" }
  - { id: ERR_RETURN_QTY_EXCEEDS, http: 422, condition: "returned_qty exceeds the line's net sold (ordered minus already returned)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version != SpecialOrder.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Operations admin: store setup, seasonal reset lock/unlock, assembly crews, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /stores"
      - "POST /stores/{id}/lock"
      - "POST /stores/{id}/unlock"
      - "POST /assembly-crews"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read access)"

  - name: MerchandisingManager
    description: "Merchandising: products, markdown/clearance lifecycle, per-store allocation, discontinue"
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/discontinue"
      - "POST /store-inventory"
      - "POST /store-inventory/{id}/adjust"
    shared_operations:
      - "GET endpoints (read access)"

  - name: StoreAssociate
    description: "Front-line store ops: loyalty registration, orders & lines, BOPIS ready/fulfill/cancel/capture, returns, special orders"
    identity: opaque
    exclusive_operations:
      - "POST /loyalty-members"
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/capture"
      - "POST /orders/{id}/ready"
      - "POST /orders/{id}/fulfill"
      - "POST /orders/{id}/cancel"
      - "POST /returns"
      - "POST /returns/{id}/approve"
      - "POST /special-orders"
      - "POST /special-orders/{id}/quote"
      - "POST /special-orders/{id}/submit-for-review"
      - "POST /special-orders/{id}/request-changes"
      - "POST /special-orders/{id}/confirm"
      - "POST /special-orders/{id}/cancel"
    shared_operations:
      - "GET endpoints (read access)"

  - name: DeliveryCoordinator
    description: "Oversized delivery & assembly scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /delivery-bookings"
      - "POST /delivery-bookings/{id}/confirm"
      - "POST /delivery-bookings/{id}/complete"
      - "POST /delivery-bookings/{id}/cancel"
    shared_operations:
      - "GET endpoints (read access)"

  - name: Customer
    description: "Loyalty member acting on their own home registry"
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations:
      - "POST /registries"
      - "POST /registries/{id}/items"
      - "POST /registries/{id}/close"
    shared_operations:
      - "GET endpoints (read access)"
