        grounds: ["validations[priority=43]", calculations.waitlist_promotion_selector, errors.ERR_NO_READY_SITE_CAPACITY, entities.BuildSite.fields.readiness_status, "state_machines.ApplicantHousehold.selection_status.WAITLISTED_to_SELECTED", "endpoints.POST /homeownership/programs/{id}/waitlist-promotions"]
        distinguishing_aspect: "Capacity counts only READY_TO_BUILD sites with no assigned household, so a program holding a perfectly good ENV_CLEARED site has capacity 0 and must return ERR_NO_READY_SITE_CAPACITY — distinctly not ERR_NO_ELIGIBLE_WAITLIST_HOUSEHOLD, since an eligible 61.75 household is waiting. Clearing utilities on that same site turns the same call into a promotion."
