        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=48]
          - errors[ERR_INVALID_CYCLE_STATE]
        excluded_because:
          difficulty_instance: cycle_state_outranks_career_threshold_on_nomination
          rationale: |
            The §1.8 instance already violates the priority-20 cycle-state rule and the priority-48
            career-threshold rule with a single nomination and pins the response to the lower-numbered
            rule, then repairs only the cycle state to prove the second error was really queued behind
            it. A §1.9 restatement would test the identical pair with no extra discrimination.

      - name: case_window_conflict_outranks_case_capacity_on_the_same_installation
        claim_type: priority_conflict
        grounds:
          - validations[priority=68]
          - validations[priority=69]
          - calculations.exhibit_window_conflict
          - errors[ERR_CASE_WINDOW_CONFLICT]
