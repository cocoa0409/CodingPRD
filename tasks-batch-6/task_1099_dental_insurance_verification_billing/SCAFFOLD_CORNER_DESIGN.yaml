# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_patient_defaults_active_zero_balance
        claim_type: Defaults
        grounds: ["entities.Patient.fields.status", "entities.Patient.fields.balance_cents"]
        distinguishing_aspect: "POST /patients with only required fields -> 201; status defaults ACTIVE, balance_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Def Pat", date_of_birth: "1990-02-02", email: "def@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
          assert:
            - "HTTP 201; Patient.${pid}.status == ACTIVE; Patient.${pid}.balance_cents == 0"
            - "Patient.${pid}.version == 1"

      - name: attachment_is_immutable_no_version
        claim_type: Immutability
        grounds: ["entities.Attachment"]
        distinguishing_aspect: "Attachment uses common_fields:false -> response carries id/created_at only, no version/updated_at; there is no update endpoint."
        test_recipe:
          setup: ["A DRAFT claim exists to attach to."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Att Pat", date_of_birth: "1990-02-02", email: "att@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D0220", description: "PA xray", category: "BASIC", ucr_fee_cents: 3500 }
              as: BillingManager
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D0220", billed_fee_cents: 3500 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /attachments"
              payload: { claim_id: "${claim_id}", kind: "XRAY", filename: "pa.png" }
              as: Biller
              captures: { att_id: $.data.id }
          assert:
            - "HTTP 201; Attachment.${att_id} exposes id and created_at; no version field is present"

      - name: get_nonexistent_claim_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /claims/{unknown} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-4000-8000-000000000000"
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; response.data.error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: preauth_submitted_pended_resubmit_cycle
        claim_type: cyclic
        grounds: ["state_machines.PreAuthorization.SUBMITTED_to_PENDED", "state_machines.PreAuthorization.PENDED_to_SUBMITTED"]
        distinguishing_aspect: "PreAuthorization loops SUBMITTED->PENDED->SUBMITTED; a PENDED pre-auth can be resubmitted and re-decided APPROVED."
        test_recipe:
          setup: ["A DRAFT pre-auth for a verified coverage."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pre Pat", date_of_birth: "1990-02-02", email: "pre@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /preauthorizations"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { pa_id: $.data.id }
            - call: "POST /preauthorizations/${pa_id}/submit"
              as: Biller
            - call: "POST /preauthorizations/${pa_id}/decision"
              payload: { outcome: "PENDED" }
              as: Biller
          trigger:
            - call: "POST /preauthorizations/${pa_id}/submit"
              as: Biller
              captures: { st: $.data.status }
            - call: "POST /preauthorizations/${pa_id}/decision"
              payload: { outcome: "APPROVED" }
              as: Biller
              captures: { st2: $.data.status, appr: $.data.approved_amount_cents }
          assert:
            - "After resubmit PreAuthorization.${pa_id}.status == SUBMITTED"
            - "After APPROVED decision status == APPROVED and approved_amount_cents == 57500"

      - name: decision_on_approved_preauth_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.PreAuthorization.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is terminal; a second decision -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A pre-auth already APPROVED."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pre2 Pat", date_of_birth: "1990-02-02", email: "pre2@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /preauthorizations"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { pa_id: $.data.id }
            - call: "POST /preauthorizations/${pa_id}/submit"
              as: Biller
            - call: "POST /preauthorizations/${pa_id}/decision"
              payload: { outcome: "APPROVED" }
              as: Biller
          trigger:
            - call: "POST /preauthorizations/${pa_id}/decision"
              payload: { outcome: "DENIED" }
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; response.data.error_id == ERR_INVALID_STATE"

      - name: appeal_on_submitted_claim_not_allowed
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.DENIED_to_APPEALED", "validations[priority=22]", "errors[ERR_APPEAL_NOT_ALLOWED]"]
        distinguishing_aspect: "Appeal is only valid from DENIED/ADJUDICATED; appealing a SUBMITTED claim -> 409 ERR_APPEAL_NOT_ALLOWED."
        test_recipe:
          setup: ["A SUBMITTED (not yet adjudicated) crown claim."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ap Pat", date_of_birth: "1990-02-02", email: "ap@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
          trigger:
            - call: "POST /claims/${claim_id}/appeal"
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; response.data.error_id == ERR_APPEAL_NOT_ALLOWED"

      - name: membership_two_missed_periods_cancels
        claim_type: cyclic
        grounds: ["state_machines.Membership.PAST_DUE_to_CANCELLED", "calculations.membership_billing"]
        distinguishing_aspect: "After MAX_PAST_DUE_PERIODS(2) consecutive unpaid billing runs the membership becomes CANCELLED."
        test_recipe:
          setup: ["Enroll 2026-05-01; run billing at two well-separated overdue dates without paying."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingManager
            - call: "POST /patients"
              payload: { full_name: "Can Pat", date_of_birth: "1990-02-02", email: "can@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /membership-plans"
              payload: { name: "Basic", annual_fee_cents: 30000, billing_period: "MONTHLY" }
              as: BillingManager
              captures: { mp_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pid}", membership_plan_id: "${mp_id}", period_start: "2026-05-01", period_end: "2027-05-01" }
              as: FrontOffice
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: BillingManager
            - call: "POST /billing/run"
              as: BillingManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: BillingManager
            - call: "POST /billing/run"
              as: BillingManager
          assert:
            - "Membership.${mem_id}.status == CANCELLED after the second overdue billing run (past_due_periods reached 2)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: claim_aging_bucket_31_60
        claim_type: Correct Result
        grounds: ["calculations.claim_aging", "entities.Claim.fields.aging_bucket"]
        distinguishing_aspect: "A claim submitted 2026-05-01 read at clock 2026-06-15 has aging_days 45 -> aging_bucket DAYS_31_60."
        test_recipe:
          setup: ["Submit a crown claim at 2026-05-01, advance clock to 2026-06-15, recompute via billing/run."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingManager
            - call: "POST /patients"
              payload: { full_name: "Age Pat", date_of_birth: "1990-02-02", email: "age@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BillingManager
            - call: "POST /billing/run"
              as: BillingManager
          trigger:
            - call: "GET /claims/${claim_id}"
              as: Biller
              captures: { ad: $.data.aging_days, ab: $.data.aging_bucket }
          assert:
            - "Claim.${claim_id}.aging_days == 45"
            - "Claim.${claim_id}.aging_bucket == DAYS_31_60"

      - name: patient_balance_collections_threshold
        claim_type: Correct Result
        grounds: ["calculations.patient_balance", "entities.Patient.fields.status"]
        distinguishing_aspect: "A denied crown claim adds full 130000 to Patient.balance_cents (>50000) -> Patient.status flips to COLLECTIONS."
        test_recipe:
          setup: ["Submit a crown claim then post an INSURANCE denial so the patient owes 130000."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Col Pat", date_of_birth: "1990-02-02", email: "col@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000 }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
          trigger:
            - call: "POST /payments"
              payload: { patient_id: "${pid}", payer_type: "INSURANCE", amount_cents: 0, claim_id: "${claim_id}", is_denial: true }
              as: BillingManager
              as_user_id: "mgr_bob"
          assert:
            - "Patient.${pid}.balance_cents == 130000"
            - "Patient.${pid}.status == COLLECTIONS"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: create_patient_missing_email_invalid_request
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /patients without required email -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Email", date_of_birth: "1990-02-02" }
              as: FrontOffice
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; response.data.error_id == ERR_INVALID_REQUEST"

      - name: missing_user_context_header_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (test omits headers)."
        test_recipe:
          setup: ["Empty DB; the trigger is issued with both auth headers omitted."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Anon", date_of_birth: "1990-02-02", email: "anon@x.com" }
              as: FrontOffice
              captures: { err: $.data.error_id }
          assert:
            - "With X-User-ID and X-User-Role omitted -> HTTP 400; response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: attachment_without_target_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_ATTACHMENT_TARGET_REQUIRED]"]
        distinguishing_aspect: "POST /attachments with neither claim_id nor preauth_id -> 422 ERR_ATTACHMENT_TARGET_REQUIRED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /attachments"
              payload: { kind: "XRAY", filename: "orphan.png" }
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; response.data.error_id == ERR_ATTACHMENT_TARGET_REQUIRED"

      - name: missing_narrative_rejected_on_submit
        claim_type: Conditional validation
        grounds: ["validations[priority=16]", "entities.Procedure.fields.requires_narrative", "errors[ERR_MISSING_NARRATIVE]"]
        distinguishing_aspect: "A line whose Procedure.requires_narrative is true with empty claim narrative -> 422 ERR_MISSING_NARRATIVE at submit."
        test_recipe:
          setup: ["Procedure D4341 requires_narrative; verified coverage; claim with no narrative."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Nar Pat", date_of_birth: "1990-02-02", email: "nar@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, basic_coinsurance_pct: 80, deductible_cents: 0 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D4341", description: "SRP", category: "BASIC", ucr_fee_cents: 20000, requires_narrative: true }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 0, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D4341", billed_fee_cents: 20000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; response.data.error_id == ERR_MISSING_NARRATIVE"

      - name: missing_attachment_rejected_on_submit
        claim_type: Conditional validation
        grounds: ["validations[priority=17]", "entities.Procedure.fields.requires_attachment", "errors[ERR_MISSING_ATTACHMENT]"]
        distinguishing_aspect: "A line whose Procedure.requires_attachment is true with zero attachments -> 422 ERR_MISSING_ATTACHMENT at submit."
        test_recipe:
          setup: ["Procedure D2740 requires_attachment; verified coverage; claim with no attachment."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Atn Pat", date_of_birth: "1990-02-02", email: "atn@x.com" }
              as: FrontOffice
              captures: { pid: $.data.id }
            - call: "POST /insurance-plans"
              payload: { payer_name: "Delta", plan_name: "P1", annual_maximum_cents: 150000, major_coinsurance_pct: 50, deductible_cents: 5000 }
              as: BillingManager
              captures: { plan_id: $.data.id }
            - call: "POST /procedures"
              payload: { cdt_code: "D2740", description: "Crown", category: "MAJOR", ucr_fee_cents: 120000, requires_attachment: true }
              as: BillingManager
            - call: "POST /coverages"
              payload: { patient_id: "${pid}", insurance_plan_id: "${plan_id}", priority: "PRIMARY", subscriber_id: "S1", effective_date: "2026-01-01", term_date: "2026-12-31" }
              as: FrontOffice
              captures: { cov_id: $.data.id, cov_v: $.data.version }
            - call: "POST /coverages/${cov_id}/verifications"
              payload: { expected_coverage_version: "${cov_v}", verified_annual_maximum_cents: 150000, verified_deductible_cents: 5000, verified_preventive_pct: 100, verified_basic_pct: 80, verified_major_pct: 50 }
              as: FrontOffice
            - call: "POST /claims"
              payload: { patient_id: "${pid}", coverage_id: "${cov_id}", service_date: "2026-05-01", procedures: [ { cdt_code: "D2740", billed_fee_cents: 130000 } ] }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              as: Biller
              as_user_id: "biller_alice"
              captures: { err: $.data.error_id }
          assert:
