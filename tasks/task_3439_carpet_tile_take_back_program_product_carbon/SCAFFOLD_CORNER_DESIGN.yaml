      - name: area_exceeds_batch_availability_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors[ERR_AREA_EXCEEDS_BATCH]
        distinguishing_aspect: "The batch-capacity guard: a zone of 100.5 m2 against 100 available m2 fails ERR_AREA_EXCEEDS_BATCH and debits nothing."
        test_recipe:
