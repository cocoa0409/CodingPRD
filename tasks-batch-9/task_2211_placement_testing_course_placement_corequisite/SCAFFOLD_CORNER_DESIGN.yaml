  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: Validations
    instances:

      - name: authentication_precedes_every_other_check_including_existence
        claim_type: Violation → Error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]", "validations[priority=2]"]
        distinguishing_aspect: |
          Four different header defects all answer the same 401 ahead of every other
          rule in the ordered list, including existence: a Student-role request whose
          X-User-ID is a well-formed UUID that is not a Student.id is UNAUTHENTICATED
          (priority 2), not 403 and not 404, because the identity cannot be resolved
          before authorisation or lookup can run.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One Student SA9 exists; no Student carries the probe UUID."
          setup_api_calls:
            - call: "POST /students"
              payload: { student_number: "SA9", full_name: "Student A Nine", race_ethnicity_code: "UNKNOWN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sa9: $.data.id }
          trigger:
            - call: "GET /students/${sa9}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              headers: { X-User-Role: "<OMITTED ENTIRELY>", X-User-ID: "staff-1" }
              captures: { err_no_role: $.data.error_id }
            - call: "GET /students/${sa9}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              headers: { X-User-Role: "Provost", X-User-ID: "staff-1" }
              captures: { err_bad_role: $.data.error_id }
            - call: "GET /students/${sa9}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              headers: { X-User-Role: "AssessmentStaff", X-User-ID: "<OMITTED ENTIRELY>" }
              captures: { err_no_user: $.data.error_id }
            - call: "GET /students/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: Student
              as_user_id: "11111111-2222-4333-8444-555555555555"
              captures: { err_ghost_student: $.data.error_id }
            - call: "GET /students/${sa9}"
              payload: {}
              as: Student
              as_user_id: "${sa9}"
              captures: { ok_id: $.data.id, ok_number: $.data.student_number }
          assert:
            - "${err_no_role} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — a missing X-User-Role is priority 1"
            - "${err_bad_role} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — \"Provost\" is not one of the seven declared roles, so it is unauthenticated rather than unauthorized"
            - "${err_no_user} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — a missing X-User-ID is priority 2"
            - "${err_ghost_student} == \"ERR_UNAUTHENTICATED\" with HTTP 401, NOT ERR_STUDENT_NOT_FOUND and NOT ERR_UNAUTHORIZED — for the Student role the X-User-ID must resolve to an existing Student.id, and that resolution happens at priority 2, ahead of the priority 5 path lookup"
            - "${ok_id} == \"${sa9}\" and ${ok_number} == \"SA9\" — the satisfaction leg: a Student reading their own row with correct headers gets HTTP 200"

      - name: duplicate_registration_blocked_while_live_and_allowed_after_a_drop
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_REGISTRATION]", "validations[priority=25]", calculations.section_seat_ledger_invariant]
        distinguishing_aspect: |
          "One live Registration per (student, section)" spans PENDING and ENROLLED
          alike, so the duplicate is refused both before and after the confirm — but
          DROPPED is not live, so the very same request succeeds afterwards. The
          ledger then holds TWO rows for one seat, which is exactly what INVARIANT 1
          counts and what a naive "delete on drop" implementation loses.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 with no requisite edges; ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
            - "Section secD (room R780, capacity 5) OPEN."
            - "Student SDUP (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) with a determination placing MATH-050."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R780", meets_start_at: "2026-09-01T13:00:00Z", meets_end_at: "2026-09-01T14:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secd: $.data.id }
            - call: "POST /sections/${secd}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "SDUP", full_name: "Student Duplicate", race_ethnicity_code: "MULTI", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sdup: $.data.id, sdup_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sdup}", subject_area: "MATH", expected_student_version: "${sdup_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det: $.data.id }
          trigger:
            - call: "GET /sections/${secd}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secd_v1: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${sdup}", section_id: "${secd}", expected_section_version: "${secd_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1: $.data.id, reg1_state: $.data.state }
            - call: "GET /sections/${secd}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secd_v2: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${sdup}", section_id: "${secd}", expected_section_version: "${secd_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_pending: $.data.error_id }
            - call: "POST /registrations/${reg1}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_confirmed: $.data.state }
            - call: "GET /sections/${secd}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secd_v3: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${sdup}", section_id: "${secd}", expected_section_version: "${secd_v3}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_enrolled: $.data.error_id }
            - call: "POST /registrations/${reg1}/drop"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_dropped: $.data.state }
            - call: "GET /sections/${secd}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secd_v4: $.data.version, taken_after_drop: $.data.seats_taken, held_after_drop: $.data.seats_held }
            - call: "POST /registrations"
              payload: { student_id: "${sdup}", section_id: "${secd}", expected_section_version: "${secd_v4}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2: $.data.id, reg2_state: $.data.state }
            - call: "GET /sections/${secd}/registrations"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { first_row_student: "$.data[0].student_id" }
          assert:
            - "${reg1_state} == \"PENDING\" (setup leg)"
            - "${err_pending} == \"ERR_DUPLICATE_REGISTRATION\" with HTTP 409 — a PENDING hold already counts as live"
            - "${reg1_confirmed} == \"ENROLLED\" then ${err_enrolled} == \"ERR_DUPLICATE_REGISTRATION\" — still refused after the confirm"
            - "${reg1_dropped} == \"DROPPED\" and ${taken_after_drop} == 0 and ${held_after_drop} == 0"
            - "${reg2_state} == \"PENDING\" and ${reg2} != \"${reg1}\" — DROPPED is not live, so the identical request now succeeds and mints a SECOND row rather than resurrecting the first"
            - "GET /sections/${secd}/registrations reports total_count 2 and ${first_row_student} == \"${sdup}\" — the DROPPED row is retained, so seat_ledger(secd) == 0 taken + 1 held + 0 waitlisted + 1 dropped == 2 == the row count (INVARIANT 1)"

      - name: booking_refusals_inside_priority_twenty_three_keep_their_declared_order
        claim_type: Priority Ordering
        grounds: ["validations[priority=23]", "errors[ERR_ATTEMPT_ALREADY_OPEN]", "errors[ERR_ADMINISTRATION_FULL]"]
        distinguishing_aspect: |
          Priority 23 bundles three sub-checks with two different HTTP statuses, and
          their internal order is observable: a student who already has an open
          attempt AND is aiming at a session that is already full receives the 422
          ERR_ATTEMPT_ALREADY_OPEN, not the 409 ERR_ADMINISTRATION_FULL. A second
          student booking the same full session proves the 409 is reachable.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "TestAdministration F1 (room T41, MATH, proctor-41, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 1) driven to OPEN."
            - "TestAdministration F2 (room T42, MATH, proctor-42, same window, seat_capacity 5) driven to OPEN — distinct room and distinct proctor, so priorities 17 and 19 stay clear."
            - "Students SY1 and SY2 with full retake budgets and no prior attempts."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T41", subject_area: "MATH", proctor_user_id: "proctor-41", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 1 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { f1: $.data.id }
            - call: "POST /test-administrations/${f1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
