          - errors[ERR_NO_COMPLIANCE_GAP]
          - errors[ERR_STALE_BATCH_VERSION]
        distinguishing_aspect: "Five independent gates guard one endpoint, and each faulty proposal isolates exactly one of them: reporting year 2025, a gross of 0.01 that rounds its delivered quantity to 0.00, a gross of 600.00 against 520.00 available, a buyer already IN_COMPLIANCE, and a batch version captured before the listing write."
