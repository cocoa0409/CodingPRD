              as: Employee
              as_user_id: "${e1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /exception-requests/${c1_id}/adjudicate"
              payload: { decision: "DENY", closure_reason: "coverage available on the requested days" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /exception-requests"
              payload: { employee_id: "${e1_id}", category: "CAREGIVING", requested_relief_days: 1, start_date: "2026-09-11", end_date: "2026-09-15", rationale: "re-filed after the first denial" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e1_id}", category: "CAREGIVING", requested_relief_days: 1, start_date: "2026-09-16", end_date: "2026-09-20", rationale: "the following week, abutting but not overlapping" }
              as: Employee
              as_user_id: "${e1_id}"
