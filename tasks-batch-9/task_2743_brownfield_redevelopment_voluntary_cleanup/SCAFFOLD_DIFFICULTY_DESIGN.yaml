  # ===========================================================================
  # Rule 9 — Compensating invariant on two different conserved-quantity types
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: funding_rescind_conserves_total_funding_need_cents
        grounds:
          - calculations.funding_assembly_waterfall
          - state_machines.FundingAward.AWARDED_to_RESCINDED
          - entities.FundingAward.fields.allocated_cents
          - endpoints[POST /funding-awards/{id}/decision]
          - endpoints[GET /sites/{id}/funding-assembly]
        distinguishing_aspect: |
          Conserved quantity type = MONEY (integer cents). The invariant is
          sum(allocated_cents over AWARDED awards) + unfunded_gap_cents ==
          total_funding_need_cents == 118043177, and it must hold both before and
          after the compensating RESCIND even though the individual allocations
          are not conserved: the fourth award was remainder-clamped to 16203434
          while the third was AWARDED, and releasing the third's 55361124 lets the
          fourth rise to its own share cap of 18610003 (a 2406569-cent increase)
          rather than simply inheriting the freed amount. local_match_required_cents
          is a derived by-product and is NOT conserved: it falls from 11114726 to
          5698942. A naive implementation that zeroes the rescinded award without
          re-running the waterfall leaves the gap at 0 and breaks the identity.
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED plan A and the BOUND cost-cap policy, so the plan's total_funding_need_cents is 118043177 (design estimate 115210677 plus premium 2832500)."
            - "The plan's per-line rounded cost figures are EXCAVATION_DISPOSAL 433062 + 865562 + 54062500 = 55361124, GW_TREATMENT 18610003, VAPOR_MITIGATION 11571875, MONITORING 4244400."
            - "Awards 1 and 2 already AWARDED: priority 1 GRANT (max 30000000, share 0.40, match 0.20, categories EXCAVATION_DISPOSAL+MONITORING) and priority 2 TAX_CREDIT (max 60000000, share 0.75, match 0.00, categories GW_TREATMENT+VAPOR_MITIGATION)."
            - "Two further awards are filed and AWARDED: priority 3 GRANT (max 80000000, share 1.00, match 0.10, categories [EXCAVATION_DISPOSAL]) and priority 4 TAX_CREDIT (max 80000000, share 1.00, match 0.05, categories [GW_TREATMENT])."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planA
            - *k_ctlA
            - *k_planAsub
            - *k_planAtech
            - *k_planApcc
            - *k_planAapp
            - *k_quoteA
            - *k_bindA
            - *k_w1
            - *k_w2
            - *k_w1dec
            - *k_w2dec
            - &k_w3
              call: "POST /funding-awards"
              payload:
                site_id: "${site_id}"
                program_code: "OH-CLEAN-REVITALIZATION-GRANT"
                funding_kind: GRANT
                program_priority: 3
                max_award_cents: 80000000
                max_share_pct: 1.00
                match_requirement_pct: 0.10
                eligible_cost_categories: [EXCAVATION_DISPOSAL]
                eligibility_documents: [SITE_CONTROL_EVIDENCE, PHASE_II_REPORT, COST_ESTIMATE, MATCH_COMMITMENT]
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { w3_id: $.data.id }
            - &k_w4
              call: "POST /funding-awards"
              payload:
                site_id: "${site_id}"
                program_code: "OH-GROUNDWATER-CREDIT"
                funding_kind: TAX_CREDIT
                program_priority: 4
                max_award_cents: 80000000
                max_share_pct: 1.00
                match_requirement_pct: 0.05
                eligible_cost_categories: [GW_TREATMENT]
                eligibility_documents: [BFPP_CERTIFICATION, PHASE_II_REPORT, COST_ESTIMATE]
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { w4_id: $.data.id }
            - &k_w3dec
              call: "POST /funding-awards/${w3_id}/decision"
              payload: { decision: AWARD, decision_note: "Revitalization grant awarded." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_w4dec
              call: "POST /funding-awards/${w4_id}/decision"
              payload: { decision: AWARD, decision_note: "Groundwater credit reserved." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_assembly_before
              call: "GET /sites/${site_id}/funding-assembly"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - &k_w3rescind
              call: "POST /funding-awards/${w3_id}/decision"
              payload: { decision: RESCIND, decision_note: "Programme appropriation withdrawn." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_assembly_after
              call: "GET /sites/${site_id}/funding-assembly"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "before the trigger, GET /sites/${site_id}/funding-assembly returns total_funding_need_cents == 118043177 with four allocations in program_priority order: ${w1_id} 23842210, ${w2_id} 22636409, ${w3_id} 55361124, ${w4_id} 16203434"
            - "before the trigger: unfunded_gap_cents == 0 and 23842210 + 22636409 + 55361124 + 16203434 + 0 == 118043177"
            - "before the trigger: local_match_required_cents == 11114726 (4768442 + 0 + 5536112 + 810172)"
            - "the RESCIND returns HTTP 200 with FundingAward.${w3_id}.status == RESCINDED and allocated_cents == 0"
            - "after the trigger, GET /sites/${site_id}/funding-assembly returns total_funding_need_cents == 118043177 unchanged with three allocations: ${w1_id} 23842210, ${w2_id} 22636409, ${w4_id} 18610003"
            - "after the trigger: unfunded_gap_cents == 52954555 and 23842210 + 22636409 + 18610003 + 52954555 == 118043177 — the conserved quantity is exactly preserved with no drift"
            - "after the trigger: FundingAward.${w4_id}.allocated_cents == 18610003, up from 16203434, because the remainder clamp min(80000000, 18610003, 16203434) is released to min(80000000, 18610003, 71564558)"
            - "after the trigger: FundingAward.${w1_id}.allocated_cents == 23842210 and FundingAward.${w2_id}.allocated_cents == 22636409 are untouched (both were share-capped, not remainder-capped)"
            - "after the trigger: local_match_required_cents == 5698942 (4768442 + 0 + 930500) — the derived match is not a conserved quantity"
            - "FundingAward.${w4_id}.version incremented by 1 (its allocated_cents changed) while FundingAward.${w1_id}.version and FundingAward.${w2_id}.version are unchanged by the RESCIND"

      - name: void_certification_conserves_obligation_weight_total
        grounds:
          - calculations.bfpp_compliance
          - state_machines.ContinuingObligation.SATISFIED_to_AT_RISK
          - entities.ContinuingObligation.fields.prior_due_date
          - entities.ContinuingObligation.fields.certification_count
          - endpoints[POST /continuing-obligations/{id}/void-certification]
        distinguishing_aspect: |
          Conserved quantity type = WEIGHT UNITS (a dimensionless integer
          partition), not money: obligations_total_weight == 20 must equal
          current_weight + satisfied_weight + at_risk_weight + lapsed_weight in
          every snapshot, so the compensating void has to move the whole weight-4
          bucket back out of satisfied_weight and into at_risk_weight rather than
          into current_weight. The restored bucket is chosen by the 30-day grace
          test on the RESTORED period (prior_due_date 2027-02-05 minus clock
          2027-01-10 = 26 days), which is why the correct target is AT_RISK and the
          post-void compliance_pct is exactly the pre-certification 0.7500 with no
          drift. Reversibility is what is asserted: due_date, prior_due_date,
          certified_at, certification_count and all four buckets return to their
          pre-certification values, while version keeps climbing.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site acquired with an AAI_COMPLETE inquiry so bfpp_status is ESTABLISHED."
            - "Five continuing obligations imposed by reviewer-alpha, total weight 20: REASONABLE_STEPS (5) and LAND_USE_RESTRICTION_COMPLIANCE (5) due 2027-06-30; INSTITUTIONAL_CONTROL_MAINTENANCE (4), ACCESS_AND_COOPERATION (3) and NOTIFICATION (3) due 2027-02-05, all with recurrence_days 90."
            - "Clock 2027-01-10 and a compliance sweep at as_of_date 2027-01-10 moves the three obligations due 2027-02-05 to AT_RISK (26 days out, inside the 30-day grace): buckets become current 10 / satisfied 0 / at_risk 10 / lapsed 0 and compliance_pct 0.7500."
            - "The owner then certifies the weight-4 INSTITUTIONAL_CONTROL_MAINTENANCE obligation: it becomes SATISFIED, prior_due_date 2027-02-05 is stored, due_date advances to 2027-05-06, certification_count becomes 1, buckets become current 10 / satisfied 4 / at_risk 6 and compliance_pct rises to exactly 0.8500 so obligation_state returns to CURRENT."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_ob_rs
            - *k_ob_lu
            - *k_ob_ic
            - *k_ob_ac
            - *k_ob_nt
            - *k_clock_2701b
            - *k_sweep_2701b
            - *k_certify_ic
          trigger:
            - &k_void_ic
              call: "POST /continuing-obligations/${ob_ic_id}/void-certification"
              payload: { void_reason: "Inspection log did not support the filed certification." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-beta"
          assert:
            - "before the trigger: ContinuingObligation.${ob_ic_id}.status == SATISFIED, certification_count == 1, prior_due_date == '2027-02-05', due_date == '2027-05-06'; LiabilityProtection.${prot_id} has current_weight 10, satisfied_weight 4, at_risk_weight 6, lapsed_weight 0, obligations_total_weight 20 and compliance_pct 0.8500 with obligation_state CURRENT"
            - "the void returns HTTP 200: the acting user reviewer-beta differs from imposed_by_user_id reviewer-alpha, so the segregation-of-duties precondition passes"
            - "after the trigger: ContinuingObligation.${ob_ic_id}.status == AT_RISK (not CURRENT), because prior_due_date 2027-02-05 minus the clock date 2027-01-10 is 26 days, inside the 0..30 grace band"
            - "after the trigger: ContinuingObligation.${ob_ic_id}.due_date == '2027-02-05' restored verbatim from prior_due_date, prior_due_date == null, certified_at == null and certification_count == 0"
            - "after the trigger: LiabilityProtection.${prot_id} has current_weight 10, satisfied_weight 0, at_risk_weight 10, lapsed_weight 0 — byte-identical to the pre-certification partition"
            - "the conserved quantity holds in all three snapshots: 20 == 20 + 0 + 0 + 0 at imposition, 10 + 0 + 10 + 0 after the sweep, 10 + 4 + 6 + 0 after the certify, 10 + 0 + 10 + 0 after the void"
            - "after the trigger: LiabilityProtection.${prot_id}.compliance_pct == 0.7500 exactly, obligation_state == AT_RISK and bfpp_status == ESTABLISHED (the void never touches the inquiry dimension and never forfeits)"
            - "the other four obligations are untouched: ContinuingObligation.${ob_rs_id}.status == CURRENT, ContinuingObligation.${ob_lu_id}.status == CURRENT, ContinuingObligation.${ob_ac_id}.status == AT_RISK, ContinuingObligation.${ob_nt_id}.status == AT_RISK, all with certification_count == 0"
            - "version is not conserved: ContinuingObligation.${ob_ic_id}.version is strictly greater after the void than before the certify, and LiabilityProtection.${prot_id}.version increased on both the certify and the void"
