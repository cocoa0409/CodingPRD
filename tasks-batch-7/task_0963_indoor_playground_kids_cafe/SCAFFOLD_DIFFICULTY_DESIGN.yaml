        grounds:
          - validations[priority=6]
          - errors[ERR_ROOM_TIME_CONFLICT]
        distinguishing_aspect: |
          Buffered occupied interval on PartyRoom: a booking [10:00, 12:00)
          occupies until 12:30 (cleanup buffer); a new booking at 12:00
          conflicts but one at exactly 12:30 is accepted (half-open at the
          buffer edge).
        test_recipe:
          setup:
            - "room r1 with STD package (120 min); booking A HELD at 2026-06-08T10:00Z (Monday, no peak), 10 children"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G P", email: "gp@x.com", phone: "606" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T10:00:00Z", child_count: 10, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pbA: $.data.id } }
            - { call: "GET /party-rooms/${r1}", payload: {}, as: Anonymous, captures: { r_ver2: $.data.version } }
          trigger:
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T12:00:00Z", child_count: 10, expected_party_room_version: "${r_ver2}" }, as: Guardian, as_user_id: "${g}", captures: { errB: $.data.error_id } }
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T12:30:00Z", child_count: 10, expected_party_room_version: "${r_ver2}" }, as: Guardian, as_user_id: "${g}", captures: { pbC: $.data.id, stC: $.data.status } }
          assert:
            - "booking at 12:00 -> ERR_ROOM_TIME_CONFLICT (inside the 30-min cleanup buffer of A)"
            - "booking at 12:30 succeeds with status HELD (start == A.end_at + 30min exactly, half-open buffer edge)"
            - "PartyBooking.${pbC}.end_at == 2026-06-08T14:30:00Z"

      - name: session_slot_half_open_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_SLOT_OVERLAP]
          - entities.SessionSlot.fields.start_at
        distinguishing_aspect: |
          Different resource (SessionSlot) and different interval semantics
          (plain half-open [start,end) with NO buffer): a slot at 15:00
          overlaps the 14:00-15:30 slot and is rejected, while a slot at
          exactly 15:30 (adjacent, gap = 0) is accepted.
        test_recipe:
          setup:
            - "slot1 2026-06-06 14:00-15:30 exists (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T15:00:00Z", end_at: "2026-06-06T16:00:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T15:30:00Z", end_at: "2026-06-06T17:00:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s3: $.data.id, st3: $.data.status } }
          assert:
            - "15:00-16:00 slot -> ERR_SLOT_OVERLAP (intersects [14:00,15:30))"
            - "15:30-17:00 slot succeeds (adjacent start == prior end; half-open semantics permit gap=0)"
            - "SessionSlot.${s3}.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: membership_credit_reserve_cancel_invariant
        grounds:
          - calculations.membership_credit_balance
          - state_machines.Visit.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: session credits. reserve then cancel is a
          forward/compensating pair that MUST restore
          granted == consumed + held + available exactly (8 = 7+1+0 while
          held; 8 = 8+0+0 after cancel).
        test_recipe:
          setup:
            - "PLUS member g (8 credits) with signed waiver and one child; OPEN slot"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /membership-plans", payload: { name: "PLUS", monthly_fee_cents: 4900, included_session_credits: 8, party_discount_pct: 0.10, cafe_discount_pct: 0.10, socks_included: true }, as: Admin, captures: { plus: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G C", email: "gc2@x.com", phone: "707" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/membership", payload: { membership_plan_id: "${plus}" }, as: Guardian, as_user_id: "${g}", captures: { gv2: $.data.version } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${gv2}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
          trigger:
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { a0: $.data.credits_available, h0: $.data.credits_held, u0: $.data.credits_consumed } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60, use_credit: true }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { a1: $.data.credits_available, h1: $.data.credits_held, u1: $.data.credits_consumed } }
            - { call: "POST /visits/${v1}/cancel", payload: {}, as: Guardian, as_user_id: "${g}" }
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { a2: $.data.credits_available, h2: $.data.credits_held, u2: $.data.credits_consumed } }
          assert:
            - "before reserve: available 8, held 0, consumed 0"
            - "after reserve: available 7, held 1, consumed 0 (invariant 8 == 7+1+0)"
            - "after cancel: available 8, held 0, consumed 0 (invariant restored exactly, no credit drift)"

      - name: loyalty_earn_and_reversal_invariant
        grounds:
          - calculations.loyalty_redemption_and_earn
          - entities.LoyaltyTransaction.fields.points
          - entities.Guardian.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity: loyalty points (different from session
          credits). points_balance == sum(EARN) - sum(REDEEM) + sum(signed
          ADJUSTMENT); a +8 earn followed by a -8 compensating adjustment
          leaves balance and lifetime_points exactly at their pre-order 0.
        test_recipe:
          setup:
            - "guardian g (BRONZE x1); served order of 2 Lattes (total 850 -> 8 points earned)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Cafe One", role: "CAFE_STAFF" }, as: Admin, captures: { cafe: $.data.id } }
            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G L", email: "gl@x.com", phone: "808" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 2 } ], child_ids: [] }, as: Guardian, as_user_id: "${g}", captures: { o: $.data.id } }
            - { call: "POST /cafe-orders/${o}/start-preparing", payload: {}, as: CafeStaff, as_user_id: "${cafe}" }
            - { call: "POST /cafe-orders/${o}/serve", payload: {}, as: CafeStaff, as_user_id: "${cafe}", captures: { pe: $.data.points_earned } }
          trigger:
            - { call: "GET /guardians/${g}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { bal1: $.data.points_balance, lif1: $.data.lifetime_points } }
            - { call: "POST /guardians/${g}/loyalty-adjustments", payload: { points: -8, note: "compensating reversal" }, as: Manager, as_user_id: "${mgr}", captures: { tx: $.data.id, bal_after: $.data.balance_after } }
            - { call: "GET /guardians/${g}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { bal2: $.data.points_balance, lif2: $.data.lifetime_points } }
          assert:
            - "after serve: points_earned == 8, points_balance == 8, lifetime_points == 8"
            - "after compensating -8 adjustment: points_balance == 0 and lifetime_points == 0 (exactly the pre-order state)"
            - "LoyaltyTransaction.${tx}.balance_after == 0 (ledger running balance agrees with recomputed Guardian fields)"
