            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { trace_complete: $.data.design_trace_complete, clearance_before: $.data.clearance_status }
            - call: "POST /product-specifications/${ps_id}/clearance"
              payload: { submission_ref: "K700001" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
            - call: "POST /reagent-lots/${rl_id}/disposition"
              payload: { decision: "RELEASE", shelf_life_basis: "CLAIM" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { disp: $.data.disposition_status, dist: $.data.distribution_status }
          assert:
            - "the first RELEASE returns HTTP 409 with error_id ERR_PRODUCT_NOT_CLEARED although the lot itself satisfies every one of its own preconditions"
            - "the lot is untouched by the failed call: disposition_status UNDER_RELEASE_TEST, distribution_status WITHHELD, released_by_user_id null, expiry_date null and version unchanged"
            - "GET on the parent confirms design_trace_complete true with clearance_status DESIGN — a complete design trace is necessary but not sufficient for release"
            - "the clearance call moves clearance_status DESIGN -> CLEARED and increments ProductSpecification.version"
            - "the second RELEASE, identical to the first, returns HTTP 200 with disposition_status RELEASED and distribution_status AVAILABLE via cascade hop 2"
            - "assigned_shelf_life_months == 12 from the CLAIM basis and expiry_date == 2027-08-10T10:00:00.000Z, computed from fill_completed_at rather than from the release instant"

      - name: component_consumption_gated_on_material_lot_qualification_state
        grounds:
          - validations.priority_75_ERR_MATERIAL_NOT_QUALIFIED
          - state_machines.MaterialLot.UNDER_TEST_to_QUALIFIED
          - calculations.material_quantity_conservation
          - entities.LotComponent.fields.status
        distinguishing_aspect: |
          The mirror-image dependency, one aggregate DOWNWARD instead of upward and
          on a create rather than a transition: the ReagentLot child create is
          rejected because of a state on the referenced MaterialLot. The failing call
          must leave the material ledger and the OCC version of the reagent lot
          completely untouched, which is what makes the originally captured
          expected_reagent_lot_version still usable on the retry — a distinct
          observable from the release-gate instance.
        test_recipe:
          setup:
            - "One MaterialSpecification EZ-CE with required_test_codes [POTENCY] and one MaterialLot of 1000.00 units still in qualification_status RECEIVED."
            - "One ProductSpecification IVD-CE-2 and one PLANNED ReagentLot CE-LOT-2, whose version is captured at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "EZ-CE", material_type: "ENZYME", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-CE02", received_quantity_units: 1000.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id, ml_status: $.data.qualification_status }
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CE-2", reference_material_code: "REF-5", required_material_codes: ["EZ-CE"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CE-LOT-2", planned_units: 300 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_v: $.data.version }
          trigger:
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_id}", component_role: "ENZYME", quantity_used: 250.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { err_not_qualified: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_id}", component_role: "ENZYME", quantity_used: 250.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { err_still_not_qualified: $.data.error_id }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_id}", component_role: "ENZYME", quantity_used: 250.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { lc_status: $.data.status }
          assert:
            - "the first component add returns HTTP 409 with error_id ERR_MATERIAL_NOT_QUALIFIED because the referenced lot is RECEIVED"
            - "recording the POTENCY result moves the material lot RECEIVED -> UNDER_TEST, and the SECOND component add still returns ERR_MATERIAL_NOT_QUALIFIED — UNDER_TEST is not QUALIFIED, so the gate is a specific state and not merely 'has been tested'"
            - "after both failures MaterialLot.available_quantity_units is still 1000.00 and consumed_quantity_units 0.00, and no LotComponent row exists for the reagent lot"
            - "after both failures ReagentLot.version is unchanged, so the version captured at creation is still current and the third call can reuse ${rl_v} — a rejected write must not consume an OCC generation"
            - "QUALIFY moves the material lot UNDER_TEST -> QUALIFIED and touches no ReagentLot"
            - "the third component add returns HTTP 201 with LotComponent.status CONSUMED, MaterialLot.available_quantity_units 750.00, consumed_quantity_units 250.00 and 1000.00 == 750.00 + 250.00 per calculations.material_quantity_conservation"
            - "only the successful add increments ReagentLot.version, and the reagent lot's disposition_status stays PLANNED throughout"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fill_line_changeover_buffer_closed_interval_symmetric_boundaries
        grounds:
          - validations.priority_100_ERR_FILL_LINE_CONFLICT
          - entities.FillRun.fields.line_code
          - entities.FillRun.fields.scheduled_start
          - state_machines.FillRun.SCHEDULED_to_ABORTED
        distinguishing_aspect: |
          A pairwise CLOSED-interval resource with a 120-minute buffer inflated on
          BOTH ends, probed on both sides of the existing run: a gap of 60 minutes
          after it conflicts, a gap of exactly 120 minutes after it does not, a gap of
          119 minutes BEFORE it conflicts, and a gap of exactly 120 minutes before it
          does not. The line_code scopes the resource, and only SCHEDULED or RUNNING
          runs occupy it, so aborting the blocker frees the slot.
        test_recipe:
          setup:
            - "ProductSpecification IVD-RT-1 and one PLANNED ReagentLot RT-LOT-1; no run is ever started, so the lot stays PLANNED and every run stays SCHEDULED."
            - "Run RT-A occupies LINE-D over the CLOSED interval 2026-08-10T06:00:00Z..2026-08-10T10:00:00Z, so with the buffer it blocks 04:00..12:00 on that line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-RT-1", reference_material_code: "REF-6", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "RT-LOT-1", planned_units: 300 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-A", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_a_id: $.data.id }
          trigger:
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-B", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { err_after_60: $.data.error_id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-E", formulation_batch_code: "BULK-RT-C", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_c_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-D", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T14:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_d_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-E", scheduled_start: "2026-08-10T02:00:00Z", scheduled_end: "2026-08-10T04:01:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { err_before_119: $.data.error_id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-F", scheduled_start: "2026-08-10T02:00:00Z", scheduled_end: "2026-08-10T04:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_f_id: $.data.id }
            - call: "POST /fill-runs/${fr_d_id}/abort"
              payload: { abort_reason: "line released for maintenance" }
              as: ProductionOperator
              captures: { d_status: $.data.status }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-D", formulation_batch_code: "BULK-RT-G", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T14:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_g_id: $.data.id }
          assert:
            - "RT-B at 11:00 returns HTTP 409 ERR_FILL_LINE_CONFLICT: new_start 11:00 < existing_end 10:00 + 120min == 12:00 and existing_start 06:00 < new_end 13:00 + 120min, so both halves of the conflict predicate hold"
            - "RT-C, identical in time to RT-B but on LINE-E, returns HTTP 201 — the resource is scoped by line_code"
            - "RT-D starting at exactly 12:00 returns HTTP 201: new_start 12:00 < 12:00 is false, so the buffer boundary is exclusive and back-to-back-plus-changeover scheduling is legal"
            - "RT-E ending at 04:01 returns HTTP 409 ERR_FILL_LINE_CONFLICT on the symmetric half of the predicate: existing_start 06:00 < new_end 04:01 + 120min == 06:01"
            - "RT-F ending at exactly 04:00 returns HTTP 201: existing_start 06:00 < 06:00 is false, so the pre-run boundary behaves exactly like the post-run boundary"
            - "RT-F is also checked against RT-D and does not conflict with it, so a successful insert is validated against every live run on the line, not only the newest"
            - "aborting RT-D returns status ABORTED, and RT-G with RT-D's exact interval then returns HTTP 201 — only SCHEDULED or RUNNING runs occupy the line"
            - "each rejected create persists nothing: GET /fill-runs filtered to LINE-D lists exactly RT-A, RT-F and RT-G as SCHEDULED plus RT-D as ABORTED, and never RT-B or RT-E"

      - name: stability_chamber_half_open_interval_with_aggregate_capacity_two
        grounds:
          - validations.priority_102_ERR_CHAMBER_CAPACITY_EXCEEDED
          - entities.StabilityStudy.fields.chamber_code
          - entities.StabilityStudy.fields.protocol_end
          - state_machines.StabilityStudy.PROTOCOL_DRAFT_to_APPROVED
        distinguishing_aspect: |
          A structurally different overlap rule from the fill line: the interval is
          HALF-OPEN rather than closed, there is no buffer, and the constraint is an
          AGGREGATE count of 2 rather than mutual exclusion — each pairwise overlap is
          legal and only the third overlapping occupant is rejected. A study starting
          exactly when another ends shares no instant and is admitted, and the live set
          spans three statuses, so approving a protocol does not free capacity.
        test_recipe:
          setup:
            - "ProductSpecification IVD-RT-2 and one PLANNED ReagentLot RT-LOT-2 used as the stability sample."
