            - "${err_stale} == 'ERR_STALE_STATION_VERSION' with HTTP 412 for the identical version value against the real station"
            - "neither rejected call created a MonitoringAssignment row and neither incremented Station.version: ${sv2} == ${sv1} + 1 (only ma_pep bumped it)"
            - "the retry with the freshly read ${sv2} returns 201 with status == 'ACTIVE'"
            - "compliance-summary.accessible_source_count == 2, missing_source_count == 0, compliance_score == 100.00, posture COMPLIANT"

      - name: ownership_check_precedes_the_occ_version_check
        claim_type: cross_entity_validation
        grounds:
          - "§1.4 priority 5 (ownership): 'StationEngineer's X-User-ID is in the target station's engineer_user_ids' -> ERR_ENGINEER_NOT_ASSIGNED (403), applies_to 'every StationEngineer and CertifyingOfficer write endpoint'"
