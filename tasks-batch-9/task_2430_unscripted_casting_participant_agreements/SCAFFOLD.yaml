# =============================================================================
# PRD Benchmark Scaffold — Unscripted Casting & Participant Agreements
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2430. Unscripted Casting & Participant Agreements (unscripted television production): casting call distribution with eligibility criteria and open call logistics, applicant screening with interviews, background checks and psychological evaluation for high-stress formats, participant agreement negotiation covering exclusivity, confidentiality, depiction rights and stipend structure, minor participant protections with work permits, education requirements and trust account deposits, medical clearance, insurance and on-set welfare protocols including duty of care, release management for incidental appearances and location filming, post-production participation obligations including press and reunion appearances, participant complaint and aftercare programs

domain_name: unscripted-casting-participant-agreements
api_prefix: /casting

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is addressed
  # as `/casting/<collection>` or `/casting/<collection>/{id}` with at most one
  # id segment. Sub-resource GETs exist only as reverse-lookup read channels,
  # never as the identity of a child.
  state_machine_shape: cyclic
  # ParticipantAgreement cycles SENT -> COUNTERED -> REVISED -> SENT for an
  # unbounded number of negotiation rounds; Applicant carries two independent
  # state dimensions (screening_status x medical_status); Complaint forks
  # TRIAGED -> {AFTERCARE_ACTIVE, ESCALATED} -> RESOLVED with divergent
  # side-effect sets per branch.
  relationship_patterns:
    - one_to_many          # Production -> CastingCall/WelfareProtocol/ShootBlock
    - self_referential     # ParticipantAgreement.supersedes_agreement_id
    - polymorphic          # ScreeningItem.kind and Release.subject_kind switch validation + weighting
    - cross_aggregate      # ShootBlock references ParticipantAgreement ids across the agreement aggregate
  role_model: segregation_of_duties
  # Four-eyes rules: the ComplianceOfficer user who recorded BACKGROUND_CHECK
  # may not record PSYCH_EVAL for the same Applicant; the BusinessAffairs user
  # who authored the latest PRODUCTION-side negotiation round may not execute
  # the agreement.
  consistency_model: immediate
  difficulty_level: expert_plus
  # 13 entities / 48 endpoints / 46 ordered validations / 53 errors /
  # 11 calculations / 9 state machines (38 transitions) / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Show title
        constraints: 1..200 chars
      - name: format_type
        type: enum
        source: input
        description: Programme format; drives hazard uplift, psych-eval requirement and initial duty-of-care tier
        constraints: "one of {COMPETITION_HIGH_STRESS, DOCUSOAP, DATING_FORMAT, TALENT_SEARCH}"
      - name: jurisdiction_code
        type: enum
        source: input
        description: Employment jurisdiction; selects minor education-hour and trust-percentage minimums
        constraints: "one of {CA, NY, GA, IL}"
      - name: season_number
        type: integer
        source: input
        description: Season ordinal
        constraints: ">= 1"
      - name: episode_order
        type: integer
        source: input
        description: Ordered episode count for the season; the PROVISIONAL stipend variant assumes full-season retention
        constraints: 1..40
      - name: photography_start_utc
        type: datetime
        source: input
        description: First day of principal photography; the reference instant for minor-age determination
      - name: photography_end_utc
        type: datetime
        source: input
        description: Last day of principal photography; the anchor for post-production obligation due dates
        constraints: must be strictly after photography_start_utc
      - name: stipend_pool_cents
        type: integer
        source: input
        description: Total participant stipend budget in cents
        constraints: ">= 0"
      - name: stipend_committed_cents
        type: integer
        source: computed
        description: Conserved quantity, recomputed by production_stipend_rollup over EXECUTED agreements
        default: 0
      - name: welfare_budget_cents
        type: integer
        source: input
        description: On-set welfare and insurance budget in cents
        constraints: ">= 0"
      - name: welfare_committed_cents
        type: integer
        source: computed
        description: Conserved quantity, recomputed by welfare_commitment_rollup (protocol subtotal + duty-of-care surcharge)
        default: 0
      - name: trust_escrow_balance_cents
        type: integer
        source: computed
        description: Conserved quantity, recomputed by trust_escrow_rollup over minor trust deposits
        default: 0
      - name: duty_of_care_tier
        type: enum
        source: computed
        description: STANDARD unless format_type is COMPETITION_HIGH_STRESS (then ENHANCED); escalates one level per ESCALATED complaint whose duty_of_care_breach is true, ceiling CRITICAL
        constraints: "one of {STANDARD, ENHANCED, CRITICAL}"
      - name: welfare_incident_count
        type: integer
        source: computed
        description: Count of Complaint rows on this production with status ESCALATED and duty_of_care_breach true
        default: 0
      - name: breached_obligation_count
        type: integer
        source: computed
        description: Count of PostObligation rows with status BREACHED across this production's agreements
        default: 0
      - name: casting_posture
        type: enum
        source: computed
        description: Derived gate over all child casting operations, recomputed by casting_posture_derivation
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: minor_participant_cap
        type: integer
        source: input
        description: Maximum number of minor participants allowed under EXECUTED agreements
        constraints: ">= 0"
      - name: minor_participant_count
        type: integer
        source: computed
        description: Count of EXECUTED agreements whose applicant has is_minor true
        default: 0

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Venue / stage name
      - name: state_code
        type: enum
        source: input
        description: US state of the venue
        constraints: "one of {CA, NY, GA, IL}"
      - name: capacity
        type: integer
        source: input
        description: Simultaneous head capacity; caps aggregate open-call expected attendance
        constraints: ">= 1"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Strike/turnaround minutes reserved AFTER each shoot block's end_utc at this location
        default: 60
        constraints: 0..480
      - name: filming_permit_number
        type: string
        source: input
        description: Municipal filming permit; null means the venue may host STUDIO blocks only
        default: null

  - name: CastingCall
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK -> Production.id; the production this call recruits for
      - name: venue_location_id
        type: string
        source: input
        description: FK -> Location.id; open-call venue, required when channel is OPEN_CALL, null otherwise
        default: null
      - name: channel
        type: enum
        source: input
        description: Distribution channel; OPEN_CALL adds venue and window logistics
        constraints: "one of {OPEN_CALL, DIGITAL_SUBMISSION, REFERRAL}"
      - name: min_age
        type: integer
        source: input
        description: Inclusive minimum eligible age in years at production.photography_start_utc
        constraints: 13..80
      - name: max_age
        type: integer
        source: input
        description: Inclusive maximum eligible age in years at production.photography_start_utc
        constraints: must be >= min_age and <= 99
      - name: residency_state_code
        type: enum
        source: input
        description: When non-null, applicant.residency_state_code must equal this value
        default: null
        constraints: "one of {CA, NY, GA, IL} or null"
      - name: open_call_window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the open-call intake window; required when channel is OPEN_CALL
        default: null
      - name: open_call_window_end_utc
        type: datetime
        source: input
        description: Inclusive end of the open-call intake window; required when channel is OPEN_CALL
        default: null
      - name: expected_attendance
        type: integer
        source: input
        description: Forecast head count at the open call; summed across window-overlapping PUBLISHED calls at the same venue
        default: 0
        constraints: ">= 0"
      - name: exclusivity_window_days
        type: integer
        source: input
        description: Default exclusivity term (days) offered to applicants recruited through this call
        constraints: 0..730
      - name: status
        type: enum
        source: computed
        description: Lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CLOSED}"
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of the publish transition
        default: null
      - name: closed_reason
        type: enum
        source: computed
        description: Why the call closed
        default: null
        constraints: "one of {DIRECTOR_CLOSED, POSTURE_RESTRICTED, POSTURE_FROZEN} or null"
      - name: screened_pass_count
        type: integer
        source: computed
        description: Count of applicants on this call whose screening_status is CLEARED or CAST
        default: 0

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: casting_call_id
        type: string
        source: input
        description: FK -> CastingCall.id; the call this application arrived through
      - name: legal_name
        type: string
        source: input
        description: Legal name as it appears on the participant agreement
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD)
      - name: residency_state_code
        type: enum
        source: input
        description: State of residence, checked against casting_call.residency_state_code
        constraints: "one of {CA, NY, GA, IL}"
      - name: guardian_name
        type: string
        source: input
        description: Parent/guardian of record; required when the applicant is a minor
        default: null
      - name: is_minor
        type: boolean
        source: computed
        description: True when the applicant's completed age at production.photography_start_utc is < 18
      - name: screening_status
        type: enum
        source: computed
        description: State dimension 1 — screening pipeline
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SCREENING, CLEARED, REJECTED, WITHDRAWN, CAST}"
      - name: medical_status
        type: enum
        source: computed
        description: State dimension 2 — medical clearance, evolves independently of screening_status
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, PENDING, CLEARED, DEFERRED, EXPIRED}"
      - name: psych_eval_required
        type: boolean
        source: computed
        description: True when production.format_type is COMPETITION_HIGH_STRESS or is_minor is true
      - name: provisional_risk_score
        type: number
        source: computed
        description: Variant PROVISIONAL_CEILING of applicant_risk_score, refreshed on every screening-item write
        default: 0
      - name: final_risk_score
        type: number
        source: computed
        description: Variant FINAL_DECAYED of applicant_risk_score, written only once every required screening kind is recorded
        default: 0
      - name: enhanced_support_required
        type: boolean
        source: computed
        description: True when final_risk_score >= 8.00; gates agreement send on an ACTIVE ONSET_PSYCH_SUPPORT protocol
        default: false

  - name: ScreeningItem
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the screened applicant
      - name: kind
        type: enum
        source: input
        description: Screening instrument; selects the risk weight and the clearance validity window
        constraints: "one of {INTERVIEW, BACKGROUND_CHECK, PSYCH_EVAL, MEDICAL_EXAM}"
      - name: outcome
        type: enum
        source: input
        description: Recorded outcome; PENDING until an outcome is recorded
        default: PENDING
        constraints: "one of {PENDING, PASS, CONDITIONAL, FAIL}"
      - name: severity_flags
        type: integer
        source: input
        description: Adverse-finding count on this instrument, 0..5; PENDING items are charged at the ceiling of 5 by the PROVISIONAL_CEILING variant
        default: 0
        constraints: 0..5
      - name: conditional_conditions
        type: string
        source: input
        description: Free-text conditions attached to a CONDITIONAL outcome
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the outcome; the four-eyes comparison key
        default: null
      - name: recorded_at
        type: datetime
        source: computed
        description: Logical-clock instant the outcome was recorded; primary sort key of the FINAL_DECAYED variant
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: recorded_at + validity window by kind (MEDICAL_EXAM 30d, PSYCH_EVAL 60d, BACKGROUND_CHECK 180d, INTERVIEW never expires -> null)
        default: null

  - name: MinorProtection
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the minor participant protected by this packet
      - name: work_permit_number
        type: string
        source: input
        description: State-issued minor work permit number
      - name: permit_expires_on
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) on which the work permit lapses
      - name: education_hours_scheduled_weekly
        type: integer
        source: input
        description: On-set tutoring hours scheduled per week
        constraints: 0..40
      - name: trust_deposit_pct
        type: number
        source: input
        description: Fraction of the executed stipend commitment deposited into the blocked trust account
        constraints: 0..1 with two decimals
      - name: trust_deposited_cents
        type: integer
        source: computed
        description: Sum of the installments actually deposited, computed by minor_trust_deposit_schedule
        default: 0
      - name: installment_count
        type: integer
        source: input
        description: Number of equal trust installments requested at deposit time
        default: null
        constraints: 1..24
      - name: per_installment_cents
        type: integer
        source: computed
        description: Per-installment amount after round-half-up, computed BEFORE summation
        default: 0
      - name: status
        type: enum
        source: computed
        description: COMPLETE when permit unexpired and education/trust minimums met, else INCOMPLETE; LAPSED on permit expiry sweep; RELEASED when the trust is refunded
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, COMPLETE, LAPSED, RELEASED}"

  - name: ParticipantAgreement
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the participant
      - name: production_id
        type: string
        source: input
        description: FK -> Production.id; the contracting production
      - name: supersedes_agreement_id
        type: string
        source: input
        description: FK -> ParticipantAgreement.id; the same applicant's prior non-terminal agreement this one replaces, null for a first agreement
        default: null
      - name: status
        type: enum
        source: computed
        description: Negotiation lifecycle; SENT -> COUNTERED -> REVISED -> SENT may cycle without bound
        default: DRAFTED
        constraints: "one of {DRAFTED, SENT, COUNTERED, REVISED, EXECUTED, VOIDED}"
      - name: round_number
        type: integer
        source: computed
        description: Count of NegotiationRound rows appended for this agreement
        default: 0
      - name: exclusivity_window_days
        type: integer
        source: input
        description: Days after wrap during which the participant may not appear on a competing programme
        constraints: 0..730
      - name: confidentiality_tier
        type: enum
        source: input
        description: Confidentiality obligation strength
        constraints: "one of {STANDARD, ENHANCED, PERPETUAL}"
      - name: depiction_rights_scope
        type: enum
        source: input
        description: Depiction licence granted; selects the depiction adjustment percentage
        constraints: "one of {FULL, LIMITED, PSEUDONYMIZED}"
      - name: stipend_structure
        type: enum
        source: input
        description: Stipend shape agreed with the participant
        constraints: "one of {FLAT, PER_EPISODE, TIERED}"
      - name: base_stipend_cents
        type: integer
        source: input
        description: Per-episode base stipend in cents
        constraints: ">= 0"
      - name: episodes_committed
        type: integer
        source: input
        description: Episodes the participant commits to; selects the tier multiplier of the FINAL variant
        constraints: 1..40
      - name: press_appearance_obligation_count
        type: integer
        source: input
        description: Number of contracted press-junket appearances
        default: 0
        constraints: 0..6
      - name: reunion_obligation
        type: boolean
        source: input
        description: Whether the participant owes a reunion taping
        default: false
      - name: provisional_stipend_cents
        type: integer
        source: computed
        description: Variant PROVISIONAL of agreement_stipend_commitment, written on every send transition
        default: 0
      - name: total_stipend_commitment_cents
        type: integer
        source: computed
        description: Variant FINAL of agreement_stipend_commitment, written on execute and zeroed on void
        default: 0
      - name: last_production_proposer_user_id
        type: string
        source: computed
        description: X-User-ID recorded on the most recent PRODUCTION-side NegotiationRound; the four-eyes key for execute
        default: null
      - name: executed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the BusinessAffairs user who executed the agreement
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the execute transition
        default: null
      - name: welfare_hold
        type: boolean
        source: computed
        description: Set by duty-of-care cascades, minor permit lapse and repeat obligation breach; blocks further negotiation writes
        default: false
      - name: void_reason
        type: enum
        source: computed
        description: Why the agreement was voided
        default: null
        constraints: "one of {WELFARE_BREACH, APPLICANT_WITHDRAWN, BUSINESS_AFFAIRS_VOID, SUPERSEDED} or null"

  - name: NegotiationRound
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ParticipantAgreement.id; the agreement under negotiation
      - name: round_number
        type: integer
        source: computed
        description: 1-based ordinal of this round within the agreement
      - name: proposed_by
        type: enum
        source: computed
        description: Which side authored the round
        constraints: "one of {PRODUCTION, PARTICIPANT}"
      - name: proposer_user_id
        type: string
        source: system
        description: X-User-ID of the author of this round
      - name: requested_base_stipend_cents
        type: integer
        source: input
        description: Per-episode base stipend proposed in this round
      - name: requested_exclusivity_window_days
        type: integer
        source: input
        description: Exclusivity term proposed in this round
      - name: requested_depiction_rights_scope
        type: enum
        source: input
        description: Depiction scope proposed in this round
        constraints: "one of {FULL, LIMITED, PSEUDONYMIZED}"
      - name: disposition
        type: enum
        source: computed
        description: COUNTERED for participant rounds, REVISED for production rounds
        constraints: "one of {COUNTERED, REVISED}"
      - name: recorded_at
        type: datetime
        source: computed
        description: Logical-clock instant the round was appended; append-only, never mutated

  - name: WelfareProtocol
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK -> Production.id; the covered production
      - name: kind
        type: enum
        source: input
        description: Welfare instrument
        constraints: "one of {DUTY_OF_CARE_OFFICER, ONSET_PSYCH_SUPPORT, INSURANCE_RIDER, AFTERCARE_PROGRAM}"
      - name: coverage_start_utc
        type: datetime
        source: input
        description: Inclusive start of coverage
      - name: coverage_end_utc
        type: datetime
        source: input
        description: Inclusive end of coverage; must be strictly after coverage_start_utc
      - name: cost_cents
        type: integer
        source: input
        description: Committed cost in cents; enters welfare_commitment_rollup while status is PLANNED or ACTIVE
        constraints: ">= 0"
      - name: carrier_certificate_number
        type: string
        source: input
        description: Insurance certificate; required when kind is INSURANCE_RIDER
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, EXPIRED, CANCELLED}"

  - name: ShootBlock
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK -> Production.id; the shooting production
      - name: location_id
        type: string
        source: input
        description: FK -> Location.id; the occupied venue
      - name: block_kind
        type: enum
        source: input
        description: Shooting environment; LOCATION_EXTERIOR and PUBLIC_SPACE require a venue filming permit
        constraints: "one of {STUDIO, LOCATION_EXTERIOR, PUBLIC_SPACE}"
      - name: start_utc
        type: datetime
        source: input
        description: Inclusive start of the occupation interval
      - name: end_utc
        type: datetime
        source: input
        description: Exclusive end of the occupation interval; must be strictly after start_utc
      - name: expected_crowd_headcount
        type: integer
        source: input
        description: Forecast incidental crowd size; 0 means no incidental appearances are expected
        default: 0
        constraints: 0..5000
      - name: participant_agreement_ids
        type: array
        source: input
        description: Array of ParticipantAgreement.id values called to this block; every entry must belong to production_id with status EXECUTED
        constraints: 0..40 entries, no duplicates
      - name: onset_minor_hours
        type: number
        source: input
        description: On-set hours each minor participant of this block is called for; summed per UTC calendar date against the daily cap
        default: 0
        constraints: 0..12 with one decimal
      - name: status
        type: enum
        source: computed
        description: Lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ROLLING, WRAPPED, CANCELLED}"
      - name: minor_participant_count
        type: integer
        source: computed
        description: Count of participant_agreement_ids whose applicant has is_minor true
        default: 0
      - name: covered_head_count
        type: integer
        source: computed
        description: Sum of Release.head_count for this block with disposition in {COLLECTED, BLURRED_WAIVER}
        default: 0
      - name: release_coverage_complete
        type: boolean
        source: computed
        description: Recomputed by release_coverage_completeness on every release write
        default: false

  - name: Release
    parent: null
    common_fields: false
    fields:
      - name: shoot_block_id
        type: string
        source: input
        description: FK -> ShootBlock.id; the block the release was collected on
      - name: subject_kind
        type: enum
        source: input
        description: Kind of incidental subject
        constraints: "one of {INCIDENTAL_CROWD, BYSTANDER_IDENTIFIABLE, PROPERTY_OWNER, MINOR_INCIDENTAL}"
      - name: subject_name
        type: string
        source: input
        description: Named subject; null for blanket crowd releases
        default: null
      - name: head_count
        type: integer
        source: input
        description: Heads covered by this release; blanket crowd releases may cover many
        constraints: 1..5000
      - name: guardian_signature
        type: boolean
        source: input
        description: Guardian counter-signature; must be true when subject_kind is MINOR_INCIDENTAL
        default: false
      - name: disposition
        type: enum
        source: input
        description: Collection outcome; REFUSED contributes no coverage
        constraints: "one of {COLLECTED, REFUSED, BLURRED_WAIVER}"
      - name: collected_at
        type: datetime
        source: computed
        description: Logical-clock instant of collection; append-only, never mutated

  - name: PostObligation
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ParticipantAgreement.id; the agreement that owes the appearance
      - name: kind
        type: enum
        source: computed
        description: Obligation kind, derived from the executed agreement's press and reunion terms
        constraints: "one of {PRESS_JUNKET, REUNION_TAPING}"
      - name: sequence_ordinal
        type: integer
        source: computed
        description: 1-based ordinal within its kind; PRESS_JUNKET ordinals space their due dates 30 days apart
      - name: due_utc
        type: datetime
        source: computed
        description: PRESS_JUNKET -> photography_end_utc + 30 * sequence_ordinal days; REUNION_TAPING -> photography_end_utc + 180 days
      - name: fee_cents
        type: integer
        source: computed
        description: Appearance fee, allocated by post_obligation_fee_allocation
      - name: status
        type: enum
        source: computed
        description: Lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, FULFILLED, EXCUSED, BREACHED}"
      - name: fulfilled_at
        type: datetime
        source: computed
        description: Logical-clock instant of fulfilment
        default: null

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ParticipantAgreement.id; the agreement the complaint arises under
      - name: category
        type: enum
        source: input
        description: Complaint category; WELFARE and HARASSMENT can constitute a duty-of-care breach
        constraints: "one of {WELFARE, MISREPRESENTATION, HARASSMENT, PAYMENT}"
      - name: severity
        type: integer
        source: input
        description: Reporter-assessed severity 1..5; selects the aftercare session base
        constraints: 1..5
      - name: narrative
        type: string
        source: input
        description: Complaint narrative
        constraints: 1..2000 chars
      - name: status
        type: enum
        source: computed
        description: OPEN -> TRIAGED -> {AFTERCARE_ACTIVE | ESCALATED} -> RESOLVED
        default: OPEN
        constraints: "one of {OPEN, TRIAGED, AFTERCARE_ACTIVE, ESCALATED, RESOLVED}"
      - name: duty_of_care_breach
        type: boolean
        source: computed
        description: Set only on the ESCALATION branch, true when category is WELFARE or HARASSMENT and severity >= 4
        default: false
      - name: aftercare_sessions_authorized
        type: integer
        source: computed
        description: Authorised aftercare sessions, computed by aftercare_session_authorization using the duty-of-care tier as of the START of the route transition
        default: 0
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the WelfareOfficer who triaged
        default: null
      - name: routed_by_user_id
        type: string
        source: system
        description: X-User-ID of the WelfareOfficer who routed the complaint
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Closing note recorded at resolution
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- CastingCall
  - entity: CastingCall
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /casting/casting-calls/{id}/publish"
        actor: CastingDirector
        preconditions:
          - "casting_call.status == DRAFT"
          - "production.casting_posture == OPEN (RESTRICTED and FROZEN both reject)"
          - "channel != OPEN_CALL OR (venue_location_id, open_call_window_start_utc, open_call_window_end_utc, expected_attendance all non-null)"
          - "channel != OPEN_CALL OR aggregate expected_attendance of PUBLISHED OPEN_CALL calls at the same venue whose CLOSED windows intersect this one, plus this call's expected_attendance, <= location.capacity"
        side_effects:
          - "sets status = PUBLISHED and published_at = logical clock now"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /casting/casting-calls/{id}/close"
        actor: CastingDirector
        preconditions:
          - "casting_call.status == PUBLISHED"
        side_effects:
          - "sets status = CLOSED and closed_reason = DIRECTOR_CLOSED"
      - from: PUBLISHED
        to: CLOSED
        trigger: "system cascade — Production.casting_posture becomes RESTRICTED (link 4 of the execute cascade)"
        actor: system
        preconditions:
          - "casting_call.status == PUBLISHED"
          - "casting_call.channel == OPEN_CALL"
        side_effects:
          - "sets status = CLOSED and closed_reason = POSTURE_RESTRICTED"
          - "increments casting_call.version by 1"
        note: "Only OPEN_CALL calls close on RESTRICTED; DIGITAL_SUBMISSION and REFERRAL calls stay PUBLISHED."
      - from: PUBLISHED
        to: CLOSED
        trigger: "system cascade — Production.casting_posture becomes FROZEN (link 5 of the complaint-escalation cascade)"
        actor: system
        preconditions:
          - "casting_call.status == PUBLISHED"
        side_effects:
          - "sets status = CLOSED and closed_reason = POSTURE_FROZEN"
          - "increments casting_call.version by 1"
        note: "FROZEN closes every PUBLISHED call regardless of channel."

  # ------------------------------------------------------------------ Applicant
  # Parallel dimensions: screening_status and medical_status advance
  # independently on the same row. Neither dimension gates the other's
  # transitions; only the agreement send transition reads both.
  - entity: Applicant
    initial_state: "SUBMITTED x NOT_STARTED"
    terminal_states: [WITHDRAWN]
    transitions:
      - from: "screening_status = SUBMITTED"
        to: "screening_status = SCREENING"
        trigger: "POST /casting/applicants/{id}/screening-items"
        actor: ComplianceOfficer
        preconditions:
          - "applicant.screening_status IN {SUBMITTED, SCREENING}"
        side_effects:
          - "recomputes applicant.provisional_risk_score via applicant_risk_score variant PROVISIONAL_CEILING"
      - from: "screening_status = SCREENING"
        to: "screening_status = CLEARED"
        trigger: "POST /casting/applicants/{id}/screening-items (with outcome) or POST /casting/screening-items/{id}/record-outcome"
        actor: ComplianceOfficer
        preconditions:
          - "every required kind for this applicant has an item with outcome IN {PASS, CONDITIONAL}"
          - "no item has outcome FAIL"
          - "final_risk_score < 12.00"
        side_effects:
          - "recomputes provisional_risk_score and final_risk_score"
          - "sets enhanced_support_required = (final_risk_score >= 8.00)"
          - "increments casting_call.screened_pass_count by 1"
      - from: "screening_status = SCREENING"
        to: "screening_status = REJECTED"
        trigger: "POST /casting/applicants/{id}/screening-items (with outcome) or POST /casting/screening-items/{id}/record-outcome"
        actor: ComplianceOfficer
        preconditions:
          - "the recorded outcome is FAIL, OR every required kind is recorded and final_risk_score >= 12.00"
        side_effects:
          - "recomputes provisional_risk_score and final_risk_score"
          - "sets screening_status = REJECTED"
      - from: "screening_status = CLEARED"
        to: "screening_status = CAST"
        trigger: "system cascade — POST /casting/participant-agreements/{id}/execute"
        actor: system
        preconditions:
          - "applicant.screening_status == CLEARED"
        side_effects:
          - "sets screening_status = CAST and increments applicant.version by 1"
      - from: "screening_status IN {SUBMITTED, SCREENING, CLEARED, CAST}"
        to: "screening_status = WITHDRAWN"
        trigger: "POST /casting/applicants/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "applicant.screening_status NOT IN {WITHDRAWN, REJECTED}"
          - "X-User-ID == applicant.id"
        side_effects:
          - "link 1: sets screening_status = WITHDRAWN"
          - "link 2: because the applicant withdrew, every ParticipantAgreement of this applicant with status IN {DRAFTED, SENT, COUNTERED, REVISED, EXECUTED} moves to VOIDED with void_reason = APPLICANT_WITHDRAWN"
          - "link 3: because an EXECUTED agreement was voided, its total_stipend_commitment_cents is zeroed and production.stipend_committed_cents is recomputed by production_stipend_rollup; production.minor_participant_count is recomputed; every PostObligation of that agreement with status SCHEDULED moves to EXCUSED"
          - "link 4: because the agreement was voided, every MinorProtection of this applicant with status IN {INCOMPLETE, COMPLETE, LAPSED} moves to RELEASED, its trust_deposited_cents and per_installment_cents are zeroed, and production.trust_escrow_balance_cents is recomputed by trust_escrow_rollup"
          - "link 5: because production.stipend_committed_cents changed, casting_posture is recomputed by casting_posture_derivation"
      - from: "medical_status = NOT_STARTED"
        to: "medical_status = PENDING"
        trigger: "POST /casting/applicants/{id}/screening-items with kind MEDICAL_EXAM and no outcome"
        actor: ComplianceOfficer
        preconditions:
          - "applicant.medical_status == NOT_STARTED"
        side_effects:
          - "sets medical_status = PENDING"
      - from: "medical_status IN {NOT_STARTED, PENDING, DEFERRED, EXPIRED}"
        to: "medical_status = CLEARED"
        trigger: "MEDICAL_EXAM item recorded with outcome PASS"
        actor: ComplianceOfficer
        preconditions:
          - "the item's kind == MEDICAL_EXAM and outcome == PASS"
        side_effects:
          - "sets medical_status = CLEARED and item.expires_at = recorded_at + 30 days"
      - from: "medical_status IN {NOT_STARTED, PENDING}"
        to: "medical_status = DEFERRED"
        trigger: "MEDICAL_EXAM item recorded with outcome CONDITIONAL"
        actor: ComplianceOfficer
        preconditions:
          - "the item's kind == MEDICAL_EXAM and outcome == CONDITIONAL"
        side_effects:
          - "sets medical_status = DEFERRED (blocks agreement send until a PASS is recorded)"
      - from: "medical_status = CLEARED"
        to: "medical_status = EXPIRED"
        trigger: "POST /casting/productions/{id}/welfare-run"
        actor: system
        preconditions:
          - "the applicant's latest MEDICAL_EXAM item has expires_at <= logical clock now"
        side_effects:
          - "sets medical_status = EXPIRED and increments applicant.version by 1"

  # -------------------------------------------------------------- ScreeningItem
  - entity: ScreeningItem
    initial_state: PENDING
    terminal_states: [FAIL]
    transitions:
      - from: PENDING
        to: "PASS | CONDITIONAL | FAIL"
        trigger: "POST /casting/screening-items/{id}/record-outcome"
        actor: ComplianceOfficer
        preconditions:
          - "screening_item.outcome == PENDING"
          - "applicant.screening_status NOT IN {WITHDRAWN, REJECTED}"
          - "if kind == PSYCH_EVAL: no BACKGROUND_CHECK item of the same applicant has recorded_by_user_id == X-User-ID"
          - "if kind == BACKGROUND_CHECK: no PSYCH_EVAL item of the same applicant has recorded_by_user_id == X-User-ID"
        side_effects:
          - "sets outcome, severity_flags, recorded_by_user_id = X-User-ID, recorded_at = logical clock now, expires_at per kind validity window"
          - "recomputes applicant.provisional_risk_score and (when all required kinds are recorded) applicant.final_risk_score"
          - "may advance applicant.screening_status and applicant.medical_status per the Applicant machine"

  # ------------------------------------------------------------ MinorProtection
  - entity: MinorProtection
    initial_state: INCOMPLETE
    terminal_states: [RELEASED]
    transitions:
      - from: INCOMPLETE
        to: COMPLETE
        trigger: "POST /casting/applicants/{id}/minor-protections or PATCH /casting/minor-protections/{id}"
        actor: ComplianceOfficer
        preconditions:
          - "permit_expires_on > logical clock now (date comparison)"
          - "education_hours_scheduled_weekly >= jurisdiction minimum (CA 15, NY 12, GA 10, IL 12)"
          - "trust_deposit_pct >= jurisdiction minimum (CA 0.15, NY 0.15, GA 0.10, IL 0.10)"
        side_effects:
          - "sets status = COMPLETE"
      - from: COMPLETE
        to: INCOMPLETE
        trigger: "PATCH /casting/minor-protections/{id}"
        actor: ComplianceOfficer
        preconditions:
          - "the patched packet no longer satisfies all three COMPLETE conditions"
        side_effects:
          - "sets status = INCOMPLETE"
      - from: COMPLETE
        to: LAPSED
        trigger: "POST /casting/productions/{id}/welfare-run"
        actor: system
        preconditions:
          - "permit_expires_on <= logical clock now (date comparison)"
        side_effects:
          - "sets status = LAPSED"
          - "sets welfare_hold = true on every ParticipantAgreement of this applicant with status IN {SENT, COUNTERED, REVISED, EXECUTED}"
      - from: "INCOMPLETE | COMPLETE | LAPSED"
        to: RELEASED
        trigger: "system cascade — the applicant's agreement moves to VOIDED"
        actor: system
        preconditions:
          - "status != RELEASED"
        side_effects:
          - "zeroes trust_deposited_cents and per_installment_cents, sets status = RELEASED, and recomputes production.trust_escrow_balance_cents"

  # ------------------------------------------------------- ParticipantAgreement
  # Cyclic: SENT -> COUNTERED -> REVISED -> SENT, unbounded rounds.
  - entity: ParticipantAgreement
    initial_state: DRAFTED
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: DRAFTED
        to: SENT
        trigger: "POST /casting/participant-agreements/{id}/send"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status IN {DRAFTED, REVISED}"
          - "agreement.welfare_hold == false"
          - "production.casting_posture != FROZEN"
          - "applicant.screening_status == CLEARED"
          - "applicant.medical_status == CLEARED"
          - "applicant.psych_eval_required == false OR the applicant has a PSYCH_EVAL item with outcome IN {PASS, CONDITIONAL} and (expires_at is null OR expires_at > now)"
          - "applicant.enhanced_support_required == false OR the production has a WelfareProtocol with kind ONSET_PSYCH_SUPPORT and status ACTIVE whose coverage interval contains [production.photography_start_utc, production.photography_end_utc]"
          - "applicant.is_minor == false OR the applicant has a MinorProtection with status COMPLETE"
          - "applicant.is_minor == false OR that MinorProtection.permit_expires_on > now"
          - "production.stipend_committed_cents + provisional_stipend_cents(this agreement) <= production.stipend_pool_cents"
        side_effects:
          - "writes provisional_stipend_cents = agreement_stipend_commitment variant PROVISIONAL"
          - "sets status = SENT"
      - from: REVISED
        to: SENT
        trigger: "POST /casting/participant-agreements/{id}/send"
        actor: BusinessAffairs
        preconditions:
          - "same preconditions as DRAFTED -> SENT"
        side_effects:
          - "recomputes provisional_stipend_cents from the revised terms (variant PROVISIONAL)"
          - "sets status = SENT"
        note: "Closes the negotiation cycle; round_number is unchanged by send."
      - from: SENT
        to: COUNTERED
        trigger: "POST /casting/participant-agreements/{id}/counter-offer"
        actor: Applicant
        preconditions:
          - "agreement.status == SENT"
          - "agreement.welfare_hold == false"
          - "X-User-ID == agreement.applicant_id"
          - "expected_agreement_version == agreement.version"
        side_effects:
          - "appends a NegotiationRound with proposed_by = PARTICIPANT, disposition = COUNTERED, round_number = agreement.round_number + 1"
          - "increments agreement.round_number by 1"
          - "sets status = COUNTERED"
          - "increments agreement.version by 1"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /casting/participant-agreements/{id}/revise"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status == COUNTERED"
          - "agreement.welfare_hold == false"
        side_effects:
          - "overwrites base_stipend_cents, exclusivity_window_days, depiction_rights_scope and any supplied episodes_committed / press_appearance_obligation_count / reunion_obligation"
          - "appends a NegotiationRound with proposed_by = PRODUCTION, disposition = REVISED, round_number = agreement.round_number + 1"
          - "sets last_production_proposer_user_id = X-User-ID"
          - "increments agreement.round_number by 1"
          - "sets status = REVISED"
      - from: SENT
        to: EXECUTED
        trigger: "POST /casting/participant-agreements/{id}/execute"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status == SENT"
          - "agreement.welfare_hold == false"
          - "production.casting_posture != FROZEN"
          - "last_production_proposer_user_id is null OR X-User-ID != last_production_proposer_user_id"
          - "applicant.screening_status == CLEARED"
          - "applicant.medical_status == CLEARED"
          - "applicant.is_minor == false OR production.minor_participant_count + 1 <= production.minor_participant_cap"
          - "production.stipend_committed_cents + total_stipend_commitment_cents(this agreement) <= production.stipend_pool_cents"
        side_effects:
          - "link 1: writes total_stipend_commitment_cents = agreement_stipend_commitment variant FINAL, sets status = EXECUTED, executed_by_user_id = X-User-ID, executed_at = now; sets applicant.screening_status = CAST"
          - "link 2: because total_stipend_commitment_cents was written, production.stipend_committed_cents is recomputed by production_stipend_rollup and production.minor_participant_count is recomputed"
          - "link 3: because production.stipend_committed_cents changed, casting_posture is recomputed by casting_posture_derivation and may become RESTRICTED"
          - "link 4: because casting_posture became RESTRICTED, every CastingCall of this production with status PUBLISHED and channel OPEN_CALL moves to CLOSED with closed_reason = POSTURE_RESTRICTED"
          - "auto-creates PostObligation rows per post_obligation_fee_allocation (one PRESS_JUNKET per contracted appearance plus one REUNION_TAPING when reunion_obligation is true)"
      - from: "DRAFTED | SENT | COUNTERED | REVISED | EXECUTED"
        to: VOIDED
        trigger: "POST /casting/participant-agreements/{id}/void"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status != VOIDED"
        side_effects:
          - "sets status = VOIDED and void_reason = the supplied reason"
          - "if the prior status was EXECUTED: zeroes total_stipend_commitment_cents, recomputes production.stipend_committed_cents by production_stipend_rollup, recomputes production.minor_participant_count, moves every SCHEDULED PostObligation to EXCUSED, releases every MinorProtection of the applicant (status RELEASED, trust_deposited_cents zeroed) and recomputes production.trust_escrow_balance_cents by trust_escrow_rollup"
          - "recomputes production.casting_posture by casting_posture_derivation"
        note: "Compensating action for execute; conserves stipend_committed_cents and trust_escrow_balance_cents exactly."
      - from: "DRAFTED | SENT | COUNTERED | REVISED"
        to: VOIDED
        trigger: "system cascade — a newer agreement naming this one in supersedes_agreement_id is created"
        actor: system
        preconditions:
          - "agreement.status IN {DRAFTED, SENT, COUNTERED, REVISED}"
        side_effects:
          - "sets status = VOIDED and void_reason = SUPERSEDED"
          - "increments agreement.version by 1"

  # ------------------------------------------------------------ WelfareProtocol
  - entity: WelfareProtocol
    initial_state: PLANNED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /casting/welfare-protocols/{id}/activate"
        actor: WelfareOfficer
        preconditions:
          - "protocol.status == PLANNED"
          - "kind != INSURANCE_RIDER OR carrier_certificate_number is non-null"
          - "coverage_end_utc > logical clock now"
        side_effects:
          - "sets status = ACTIVE"
          - "recomputes production.welfare_committed_cents by welfare_commitment_rollup (PLANNED and ACTIVE both count, so the subtotal is unchanged) and production.casting_posture"
      - from: "PLANNED | ACTIVE"
        to: CANCELLED
        trigger: "POST /casting/welfare-protocols/{id}/cancel"
        actor: WelfareOfficer
        preconditions:
          - "protocol.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "sets status = CANCELLED"
          - "recomputes production.welfare_committed_cents by welfare_commitment_rollup (CANCELLED protocols leave the subtotal) and production.casting_posture"
        note: "Compensating action for protocol creation; conserves welfare_committed_cents exactly."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /casting/productions/{id}/welfare-run"
        actor: system
        preconditions:
          - "coverage_end_utc <= logical clock now"
        side_effects:
          - "sets status = EXPIRED"
          - "recomputes production.welfare_committed_cents and casting_posture"

  # ------------------------------------------------------------------ ShootBlock
  - entity: ShootBlock
    initial_state: SCHEDULED
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ROLLING
        trigger: "POST /casting/shoot-blocks/{id}/roll"
        actor: ProductionAdmin
        preconditions:
          - "block.status == SCHEDULED"
          - "production.casting_posture != FROZEN"
          - "a WelfareProtocol of this production with kind DUTY_OF_CARE_OFFICER and status ACTIVE has coverage_start_utc <= block.start_utc and coverage_end_utc >= block.end_utc"
          - "every called participant's applicant has medical_status == CLEARED"
          - "for every minor called participant: sum of onset_minor_hours over this block plus every ShootBlock of this production with status IN {ROLLING, WRAPPED} that calls the same agreement and whose start_utc falls on the same UTC calendar date, plus education_hours_scheduled_weekly / 5, <= 8.0"
        side_effects:
          - "sets status = ROLLING"
      - from: ROLLING
        to: WRAPPED
        trigger: "POST /casting/shoot-blocks/{id}/wrap"
        actor: ProductionAdmin
        preconditions:
          - "block.status == ROLLING"
          - "release_coverage_complete == true (recomputed at wrap time by release_coverage_completeness)"
        side_effects:
          - "sets status = WRAPPED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade — Production.casting_posture becomes FROZEN"
        actor: system
        preconditions:
          - "block.status == SCHEDULED"
        side_effects:
          - "sets status = CANCELLED and increments shoot_block.version by 1"

  # ------------------------------------------------------------------- Complaint
  # Branching fork-join: TRIAGED forks into AFTERCARE_ACTIVE or ESCALATED with
  # divergent side-effect sets, both joining at RESOLVED.
  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /casting/complaints/{id}/triage"
        actor: WelfareOfficer
        preconditions:
          - "complaint.status == OPEN"
        side_effects:
          - "sets status = TRIAGED and triaged_by_user_id = X-User-ID"
      - from: TRIAGED
        to: AFTERCARE_ACTIVE
        trigger: "POST /casting/complaints/{id}/route with route = AFTERCARE"
        actor: WelfareOfficer
        preconditions:
          - "complaint.status == TRIAGED"
        side_effects:
          - "sets status = AFTERCARE_ACTIVE, routed_by_user_id = X-User-ID"
          - "writes aftercare_sessions_authorized by aftercare_session_authorization using production.duty_of_care_tier as of the start of this transition"
          - "leaves duty_of_care_breach false and mutates no Production field"
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /casting/complaints/{id}/route with route = ESCALATION"
        actor: WelfareOfficer
        preconditions:
          - "complaint.status == TRIAGED"
        side_effects:
          - "link 1: sets status = ESCALATED, routed_by_user_id = X-User-ID, duty_of_care_breach = (category IN {WELFARE, HARASSMENT} AND severity >= 4), and writes aftercare_sessions_authorized using the duty_of_care_tier as of the START of this transition (pre-escalation tier)"
          - "link 2: because duty_of_care_breach is true, production.welfare_incident_count is incremented and production.duty_of_care_tier escalates one level (STANDARD -> ENHANCED -> CRITICAL, ceiling CRITICAL)"
          - "link 3: because duty_of_care_tier changed, production.welfare_committed_cents is recomputed by welfare_commitment_rollup with the higher tier factor"
          - "link 4: because welfare_committed_cents now exceeds welfare_budget_cents, casting_posture_derivation sets production.casting_posture = FROZEN"
          - "link 5: because casting_posture became FROZEN, every CastingCall of this production with status PUBLISHED moves to CLOSED with closed_reason = POSTURE_FROZEN, every ShootBlock with status SCHEDULED moves to CANCELLED, and every ParticipantAgreement with status IN {DRAFTED, SENT, COUNTERED, REVISED} gets welfare_hold = true"
        note: "Links 2-5 fire only while their own precondition holds; a non-breach escalation stops after link 1."
      - from: "AFTERCARE_ACTIVE | ESCALATED"
        to: RESOLVED
        trigger: "POST /casting/complaints/{id}/resolve"
        actor: WelfareOfficer
        preconditions:
          - "complaint.status IN {AFTERCARE_ACTIVE, ESCALATED}"
        side_effects:
          - "sets status = RESOLVED and resolution_note"
        note: "Join point of both branches; welfare_incident_count is NOT decremented on resolution, so an escalated breach keeps the escalated duty-of-care tier."

  # ------------------------------------------------------------- PostObligation
  - entity: PostObligation
    initial_state: SCHEDULED
    terminal_states: [FULFILLED, EXCUSED, BREACHED]
    transitions:
      - from: SCHEDULED
        to: FULFILLED
        trigger: "POST /casting/post-obligations/{id}/fulfill"
        actor: BusinessAffairs
        preconditions:
          - "obligation.status == SCHEDULED"
          - "agreement.status == EXECUTED"
        side_effects:
          - "sets status = FULFILLED and fulfilled_at = logical clock now"
      - from: SCHEDULED
        to: BREACHED
        trigger: "POST /casting/productions/{id}/welfare-run"
        actor: system
        preconditions:
          - "due_utc <= logical clock now"
        side_effects:
          - "sets status = BREACHED and increments production.breached_obligation_count"
          - "when the owning agreement now has >= 2 BREACHED obligations, sets agreement.welfare_hold = true"
      - from: SCHEDULED
        to: EXCUSED
        trigger: "system cascade — the owning agreement moves to VOIDED"
        actor: system
        preconditions:
          - "obligation.status == SCHEDULED"
        side_effects:
          - "sets status = EXCUSED and increments post_obligation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /casting/participant-agreements"
    occ_field: "expected_applicant_version"
    description: |
      Creating a ParticipantAgreement for an Applicant whose version has
      advanced since the client last read it is rejected. This captures the
      case where another BusinessAffairs writer has already created an
      agreement for that applicant — which legitimately supersedes the prior
      one when supersedes_agreement_id names it — so the current writer's view
      of the applicant (including its screening_status and existing
      agreements) is stale.
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412

  - rule_id: agreement-counter-stale-version
    parent_entity: ParticipantAgreement
    write_endpoint: "POST /casting/participant-agreements/{id}/counter-offer"
    occ_field: "expected_agreement_version"
    description: |
      A participant counter-offer carrying a version older than the
      agreement's current version is rejected. The terms the participant is
      countering have already been replaced by a newer round or a production
      revision, so the counter would negotiate against text the participant
      never saw.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: agreement_stipend_commitment
    trigger: "POST /casting/participant-agreements/{id}/send writes the PROVISIONAL variant into provisional_stipend_cents; POST /casting/participant-agreements/{id}/execute writes the FINAL variant into total_stipend_commitment_cents"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: each component is rounded to whole cents
      # BEFORE the components are summed, and the depiction adjustment is
      # applied to the rounded subtotal (never per component).
      tier_multiplier(episodes) =
          1.00 if episodes <= 4
          1.15 if 5 <= episodes <= 8
          1.30 if episodes >= 9
      episodes_used  = episodes_committed                                  # FINAL
      base_component = round_half_up(base_stipend_cents * episodes_used * tier_multiplier(episodes_used))
      hazard_component = round_half_up(base_component * HAZARD_UPLIFT_PCT)
                         if production.format_type == COMPETITION_HIGH_STRESS else 0
      exclusivity_component = ceil(exclusivity_window_days / 30) * EXCLUSIVITY_PREMIUM_PER_30D_CENTS
      press_component   = press_appearance_obligation_count * PRESS_APPEARANCE_RATE_CENTS
      reunion_component = REUNION_FLAT_CENTS if reunion_obligation else 0
      subtotal = base_component + hazard_component + exclusivity_component
                 + press_component + reunion_component
      depiction_adjustment = round_half_up(subtotal * DEPICTION_ADJ_PCT[depiction_rights_scope])
      total = subtotal + depiction_adjustment
    input_set: "Exactly one ParticipantAgreement row plus its production's format_type and episode_order. Negotiation history is NOT re-read: the agreement's current term fields (already overwritten by the latest revise) are authoritative."
    constants:
      HAZARD_UPLIFT_PCT: 0.10
      EXCLUSIVITY_PREMIUM_PER_30D_CENTS: 40000
      PRESS_APPEARANCE_RATE_CENTS: 25000
      REUNION_FLAT_CENTS: 150000
      DEPICTION_ADJ_PCT: { FULL: 0.00, LIMITED: -0.05, PSEUDONYMIZED: -0.12 }
    precision: "whole cents, round_half_up; per-component rounding precedes summation"
    variants:
      - name: PROVISIONAL
        when: "written on every send transition (DRAFTED -> SENT and REVISED -> SENT) into provisional_stipend_cents; used by the send-time stipend pool guard"
        difference: |
          Forward-looking worst case for the same row:
            episodes_used = max(episodes_committed, production.episode_order)
            press_component uses (press_appearance_obligation_count + PROVISIONAL_PRESS_RESERVE) where PROVISIONAL_PRESS_RESERVE = 2
            reunion_component = REUNION_FLAT_CENTS unconditionally (a reunion is assumed)
            depiction_adjustment = 0 (no discount is assumed)
          Because episodes_used may cross into a higher tier, the tier multiplier
          itself can differ from the FINAL variant's.
      - name: FINAL
        when: "written on the execute transition into total_stipend_commitment_cents; the only variant that enters production_stipend_rollup"
        difference: "Uses episodes_committed as agreed, the contracted press count, the actual reunion_obligation flag, and applies the depiction adjustment."

  - name: applicant_risk_score
    trigger: "recomputed on POST /casting/applicants/{id}/screening-items and POST /casting/screening-items/{id}/record-outcome; writes provisional_risk_score always and final_risk_score only once every required kind is recorded"
    algorithm: weighted_scoring
    formula: |
      KIND_WEIGHT   = { INTERVIEW: 1.5, BACKGROUND_CHECK: 3.0, PSYCH_EVAL: 4.0, MEDICAL_EXAM: 2.0 }
      OUTCOME_FACTOR = { PASS: 0.0, CONDITIONAL: 0.5, FAIL: 1.0 }
      points(item) = item.severity_flags * KIND_WEIGHT[item.kind] * OUTCOME_FACTOR[item.outcome]
      required_kinds = {INTERVIEW, BACKGROUND_CHECK, MEDICAL_EXAM}
                       + ({PSYCH_EVAL} if applicant.psych_eval_required)
    input_set: "Every ScreeningItem of the applicant. PROVISIONAL_CEILING includes PENDING items; FINAL_DECAYED includes only items with recorded_at non-null."
    constants:
      PENDING_SEVERITY_CEILING: 5
      DECAY_LADDER: [1.00, 0.80, 0.60, 0.50]
      RISK_REJECT_THRESHOLD: 12.00
      RISK_ENHANCED_SUPPORT_THRESHOLD: 8.00
    precision: "2 decimal places, round_half_up, applied once to the final sum (never per item)"
    variants:
      - name: PROVISIONAL_CEILING
        when: "written to provisional_risk_score on every screening-item write"
        difference: |
          score = round_half_up(
              sum over items with recorded_at == null of
                  PENDING_SEVERITY_CEILING * KIND_WEIGHT[kind] * 1.0
            + sum over items with recorded_at != null of points(item), 2)
          No recency decay is applied, so recorded items keep full weight.
      - name: FINAL_DECAYED
        when: "written to final_risk_score only when every required kind has an item with recorded_at != null; the variant the CLEARED / REJECTED / enhanced_support_required thresholds read"
        difference: |
          Recorded items are ordered by recorded_at DESC, tie-broken by
          created_at DESC. The i-th row of that ordering (1-based) is weighted
          by DECAY_LADDER[i] for i <= 4 and by 0.50 for i > 4:
            score = round_half_up(sum over ordered items of points(item) * decay(i), 2)
          PENDING items contribute nothing. For identical data the two variants
          therefore disagree whenever any decayed item carries points.

  - name: welfare_commitment_rollup
    trigger: "recomputed on WelfareProtocol create / activate / cancel, on the welfare-run epoch sweep, and on any duty_of_care_tier change (link 3 of the complaint-escalation cascade); writes Production.welfare_committed_cents"
    algorithm: threshold
    formula: |
      # The surcharge is part of welfare_committed_cents, but the band that
      # sets the surcharge rate is selected from the PRE-surcharge subtotal.
      # Evaluation order is pinned to break the apparent circularity:
      #   (1) subtotal  (2) band from subtotal  (3) surcharge  (4) total
      protocol_subtotal = sum of cost_cents over WelfareProtocol rows of this
                          production whose status IN {PLANNED, ACTIVE}
                          (EXPIRED and CANCELLED rows are excluded)
      band_rate = 0.04 if protocol_subtotal <  5000000
                  0.07 if 5000000 <= protocol_subtotal < 20000000
                  0.09 if protocol_subtotal >= 20000000
      tier_factor = { STANDARD: 1.0, ENHANCED: 1.5, CRITICAL: 2.0 }[production.duty_of_care_tier]
      surcharge_cents = round_half_up(protocol_subtotal * band_rate * tier_factor)
      welfare_committed_cents = protocol_subtotal + surcharge_cents
    input_set: "WelfareProtocol rows of one production with status IN {PLANNED, ACTIVE}; no time window filter — coverage dates do not affect membership, only the welfare-run sweep's EXPIRED transition does."
    constants:
      BAND_LOW_RATE: 0.04
      BAND_MID_RATE: 0.07
      BAND_HIGH_RATE: 0.09
      BAND_MID_FLOOR_CENTS: 5000000
      BAND_HIGH_FLOOR_CENTS: 20000000
      TIER_FACTOR: { STANDARD: 1.0, ENHANCED: 1.5, CRITICAL: 2.0 }
    precision: "whole cents, round_half_up"

  - name: minor_trust_deposit_schedule
    trigger: "POST /casting/minor-protections/{id}/trust-deposits; writes per_installment_cents, trust_deposited_cents and installment_count, then Production.trust_escrow_balance_cents"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is pinned: round PER INSTALLMENT, then sum. The
      # alternative order (round the total, then divide) is wrong and can
      # differ by a few cents.
      target_cents         = agreement.total_stipend_commitment_cents * minor_protection.trust_deposit_pct
      per_installment_cents = round_half_up(target_cents / installment_count)
      trust_deposited_cents = per_installment_cents * installment_count
    input_set: "The single EXECUTED ParticipantAgreement of this MinorProtection's applicant (status EXECUTED, chosen as the applicant's only non-VOIDED agreement) plus the packet's trust_deposit_pct."
    constants:
      MIN_TRUST_PCT_BY_JURISDICTION: { CA: 0.15, NY: 0.15, GA: 0.10, IL: 0.10 }
      MAX_INSTALLMENTS: 24
    precision: "whole cents, round_half_up per installment; the sum is NOT re-rounded"

  - name: production_stipend_rollup
    trigger: "recomputed on agreement execute (link 2), on agreement void, and on the applicant-withdraw cascade; writes Production.stipend_committed_cents"
    algorithm: aggregation
    formula: |
      stipend_committed_cents =
          sum of total_stipend_commitment_cents over ParticipantAgreement rows
          with production_id == this production AND status == EXECUTED
      # Conserved-quantity invariant: this equality MUST hold after every
      # forward action and after its compensating action, with no drift.
    input_set: "ParticipantAgreement rows of one production with status == EXECUTED only; DRAFTED, SENT, COUNTERED, REVISED and VOIDED rows are excluded (VOIDED rows also carry total_stipend_commitment_cents == 0)."
    constants: {}
    precision: "whole cents; full recompute from the agreement rows, never an incremental delta"

  - name: trust_escrow_rollup
    trigger: "recomputed on trust deposit, on MinorProtection release (agreement void / applicant withdraw cascade); writes Production.trust_escrow_balance_cents"
    algorithm: aggregation
    formula: |
      trust_escrow_balance_cents =
          sum of trust_deposited_cents over MinorProtection rows whose applicant
          belongs to a ParticipantAgreement of this production and whose status
          IN {INCOMPLETE, COMPLETE, LAPSED}
      # RELEASED packets are excluded AND carry trust_deposited_cents == 0, so
      # the compensating refund leaves zero drift in this quantity.
    input_set: "MinorProtection rows reachable from this production through Applicant -> ParticipantAgreement, with status IN {INCOMPLETE, COMPLETE, LAPSED}."
    constants: {}
    precision: "whole cents; full recompute, never an incremental delta"

  - name: casting_posture_derivation
    trigger: "recomputed after every write that changes stipend_committed_cents, welfare_committed_cents, minor_participant_count, welfare_incident_count or duty_of_care_tier, and at the end of every welfare-run"
    algorithm: threshold
    formula: |
      # Precedence is pinned FROZEN > RESTRICTED > OPEN; the first matching
      # clause wins and no lower clause is evaluated.
      FROZEN     if welfare_committed_cents > welfare_budget_cents
                 OR welfare_incident_count >= 2
      RESTRICTED if (stipend_committed_cents * 100) >= (stipend_pool_cents * 90)
                 OR (minor_participant_cap > 0
                     AND minor_participant_count >= minor_participant_cap)
      OPEN       otherwise
      # The utilisation test is evaluated by integer cross-multiplication, so
      # exactly 90.000% RESTRICTS and 89.99999% does not.
      # The minor clause is guarded by minor_participant_cap > 0: a production
      # that admits no minors at all (cap 0) is never RESTRICTED by the minor
      # clause, because the execute precondition
      # `minor_participant_count + 1 <= minor_participant_cap` already makes a
      # minor's agreement unexecutable there. Only a production with real minor
      # slots restricts once those slots are filled.
    input_set: "One Production row's own computed fields; no child scan beyond the rollups that already wrote them."
    constants:
      RESTRICTED_UTILISATION_NUMERATOR: 90
      RESTRICTED_UTILISATION_DENOMINATOR: 100
      FROZEN_INCIDENT_COUNT: 2
    precision: "integer cross-multiplication only; no floating-point division"

  - name: release_coverage_completeness
    trigger: "recomputed on POST /casting/shoot-blocks/{id}/releases and re-evaluated at the start of POST /casting/shoot-blocks/{id}/wrap; writes ShootBlock.covered_head_count and ShootBlock.release_coverage_complete"
    algorithm: aggregation
    formula: |
      covered_head_count = sum of head_count over Release rows of this block
                           whose disposition IN {COLLECTED, BLURRED_WAIVER}
                           (REFUSED rows contribute nothing)
      release_coverage_complete =
          covered_head_count >= expected_crowd_headcount
          AND every Release of this block with subject_kind == MINOR_INCIDENTAL
              has guardian_signature == true
      # expected_crowd_headcount == 0 with zero Release rows is vacuously
      # complete: the sum of an empty set is 0 and 0 >= 0.
    input_set: "Release rows of exactly one ShootBlock; ordering is irrelevant because the aggregate is a sum."
    constants: {}
    precision: "integer head counts; >= comparison (exact equality is complete)"

  - name: minor_daily_onset_hours
    trigger: "evaluated as a precondition of POST /casting/shoot-blocks/{id}/roll for every minor participant called to the block"
    algorithm: aggregation
    formula: |
      # Aggregate-capacity semantics over a UTC calendar-date bucket, NOT a
      # pairwise interval intersection: two blocks on the same date collide on
      # the cap even when their clock intervals are disjoint.
      bucket_date = date part (UTC) of this_block.start_utc
      onset_hours = this_block.onset_minor_hours
                    + sum of onset_minor_hours over ShootBlock rows of the same
                      production with status IN {ROLLING, WRAPPED} that list the
                      same agreement id in participant_agreement_ids and whose
                      start_utc has the same UTC calendar date
      education_hours = minor_protection.education_hours_scheduled_weekly / 5
      violation when (onset_hours + education_hours) > MINOR_DAILY_TOTAL_HOURS_CAP
    input_set: "ShootBlock rows of one production with status IN {ROLLING, WRAPPED} sharing the bucket date and the agreement id, plus the block under test; SCHEDULED and CANCELLED blocks are excluded."
    constants:
      MINOR_DAILY_TOTAL_HOURS_CAP: 8.0
      EDUCATION_DAYS_PER_WEEK: 5
    precision: "one decimal place on hours; the comparison is > (exactly 8.0 is allowed)"

  - name: post_obligation_fee_allocation
    trigger: "runs inside POST /casting/participant-agreements/{id}/execute to auto-create the agreement's PostObligation rows"
    algorithm: waterfall_allocation
    formula: |
      for ordinal in 1 .. press_appearance_obligation_count:
          create PostObligation(kind = PRESS_JUNKET, sequence_ordinal = ordinal,
                                fee_cents = PRESS_APPEARANCE_RATE_CENTS,
                                due_utc = production.photography_end_utc + 30 * ordinal days)
      if reunion_obligation:
          create PostObligation(kind = REUNION_TAPING, sequence_ordinal = 1,
                                fee_cents = REUNION_FLAT_CENTS,
                                due_utc = production.photography_end_utc + 180 days)
      # Creation order is pinned: all PRESS_JUNKET rows by ascending ordinal,
      # then the REUNION_TAPING row.
    input_set: "Exactly one agreement at execute time; the fee constants are the same rows used by agreement_stipend_commitment, so the obligation fees always reconcile with the stipend components."
    constants:
      PRESS_APPEARANCE_RATE_CENTS: 25000
      REUNION_FLAT_CENTS: 150000
      PRESS_SPACING_DAYS: 30
      REUNION_OFFSET_DAYS: 180
    precision: "whole cents; due dates are exact day additions on the UTC instant"

  - name: aftercare_session_authorization
    trigger: "runs inside POST /casting/complaints/{id}/route on both branches; writes Complaint.aftercare_sessions_authorized"
    algorithm: threshold
    formula: |
      BASE_SESSIONS = { 1: 2, 2: 4, 3: 8, 4: 12, 5: 16 }[complaint.severity]
      tier_factor   = { STANDARD: 1.0, ENHANCED: 1.5, CRITICAL: 2.0 }[
                          production.duty_of_care_tier AS OF THE START of this
                          route transition — i.e. BEFORE any escalation this
                          same request performs ]
      aftercare_sessions_authorized = min(AFTERCARE_SESSION_CAP,
                                          round_half_up(BASE_SESSIONS * tier_factor))
    input_set: "One Complaint row plus the owning production's duty_of_care_tier read at the start of the transition."
    constants:
      BASE_SESSIONS: { 1: 2, 2: 4, 3: 8, 4: 12, 5: 16 }
      TIER_FACTOR: { STANDARD: 1.0, ENHANCED: 1.5, CRITICAL: 2.0 }
      AFTERCARE_SESSION_CAP: 24
    precision: "integer sessions, round_half_up before the cap is applied"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when the role is Applicant, X-User-ID equals the Applicant.id that owns the addressed resource (the applicant itself, or the applicant_id of the addressed agreement / complaint)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /casting/applicants/{id}, POST /casting/applicants/{id}/withdraw, POST /casting/participant-agreements/{id}/counter-offer, POST /casting/participant-agreements/{id}/complaints, GET /casting/participant-agreements/{id}"

  - priority: 5
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_PRODUCTION_NOT_FOUND | ERR_CASTING_CALL_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_SCREENING_ITEM_NOT_FOUND | ERR_MINOR_PROTECTION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_WELFARE_PROTOCOL_NOT_FOUND | ERR_SHOOT_BLOCK_NOT_FOUND | ERR_POST_OBLIGATION_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign key in the body exists (production_id, venue_location_id, casting_call_id, applicant_id, location_id, supersedes_agreement_id, every entry of participant_agreement_ids)"
    error_id: "ERR_PRODUCTION_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_CASTING_CALL_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /casting/casting-calls, POST /casting/applicants, POST /casting/participant-agreements, POST /casting/shoot-blocks"

  - priority: 7
    category: business_constraint
    check: "request body shape — required fields present, enum members valid, numeric ranges respected, datetime pairs ordered (photography_end_utc > photography_start_utc, coverage_end_utc > coverage_start_utc, end_utc > start_utc, open_call_window_end_utc > open_call_window_start_utc, max_age >= min_age), participant_agreement_ids free of duplicates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST / PATCH endpoints"

  - priority: 8
    category: business_constraint
    check: "pagination parameters within bounds (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 9
    category: state
    check: "expected_applicant_version equals Applicant.version"
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412
    applies_to: "POST /casting/participant-agreements"

  - priority: 10
    category: state
    check: "expected_agreement_version equals ParticipantAgreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /casting/participant-agreements/{id}/counter-offer"

  - priority: 11
    category: state
    check: "production.casting_posture != FROZEN"
    error_id: ERR_CASTING_FROZEN
    http_status: 409
    applies_to: "POST /casting/casting-calls/{id}/publish, POST /casting/applicants, POST /casting/participant-agreements, POST /casting/participant-agreements/{id}/send, POST /casting/participant-agreements/{id}/execute, POST /casting/shoot-blocks, POST /casting/shoot-blocks/{id}/roll"

  - priority: 12
    category: state
    check: "production.casting_posture != RESTRICTED for casting-call publish and for applicant intake through an OPEN_CALL channel"
    error_id: ERR_CASTING_RESTRICTED
    http_status: 409
    applies_to: "POST /casting/casting-calls/{id}/publish, POST /casting/applicants"

  - priority: 13
    category: state
    check: "the addressed entity is in a from-state that declares this transition in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 14
    category: state
    check: "the agreement's welfare_hold is false"
    error_id: ERR_WELFARE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /casting/participant-agreements/{id}/send, /counter-offer, /revise, /execute"

  - priority: 15
    category: state
    check: "casting_call.status == PUBLISHED for applicant intake"
    error_id: ERR_CASTING_CALL_NOT_OPEN
    http_status: 409
    applies_to: "POST /casting/applicants"

  - priority: 16
    category: state
    check: "when the call's channel is OPEN_CALL, the logical clock lies inside the CLOSED window [open_call_window_start_utc, open_call_window_end_utc]"
    error_id: ERR_OPEN_CALL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /casting/applicants"

  - priority: 17
    category: state
    check: "the applicant's agreement is EXECUTED before a trust deposit is accepted"
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /casting/minor-protections/{id}/trust-deposits"

  - priority: 18
    category: state
    check: "the complaint's agreement has status IN {EXECUTED, VOIDED}"
    error_id: ERR_COMPLAINT_TARGET_INVALID
    http_status: 409
    applies_to: "POST /casting/participant-agreements/{id}/complaints"

  - priority: 19
    category: business_safety
    check: "four-eyes screening — the X-User-ID recording a PSYCH_EVAL outcome must differ from every X-User-ID that recorded a BACKGROUND_CHECK outcome for the same applicant, and vice versa"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /casting/applicants/{id}/screening-items (with outcome), POST /casting/screening-items/{id}/record-outcome"

  - priority: 20
    category: business_safety
    check: "four-eyes execution — X-User-ID must differ from agreement.last_production_proposer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /casting/participant-agreements/{id}/execute"

  - priority: 21
    category: business_safety
    check: "applicant.screening_status == CLEARED"
    error_id: ERR_SCREENING_INCOMPLETE
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send, POST /casting/participant-agreements/{id}/execute"

  - priority: 22
    category: business_safety
    check: "applicant.medical_status == CLEARED"
    error_id: ERR_MEDICAL_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send, POST /casting/participant-agreements/{id}/execute"

  - priority: 23
    category: business_safety
    check: "when applicant.psych_eval_required is true, a PSYCH_EVAL item exists with outcome IN {PASS, CONDITIONAL} and (expires_at is null OR expires_at > now)"
    error_id: ERR_PSYCH_EVAL_REQUIRED
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send"

  - priority: 24
    category: business_safety
    check: "when applicant.enhanced_support_required is true, the production has an ACTIVE ONSET_PSYCH_SUPPORT protocol whose coverage interval contains the whole photography window"
    error_id: ERR_ENHANCED_SUPPORT_MISSING
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send"

  - priority: 25
    category: business_safety
    check: "when applicant.is_minor is true, a MinorProtection with status COMPLETE exists for that applicant"
    error_id: ERR_MINOR_PROTECTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send"

  - priority: 26
    category: business_safety
    check: "every minor participant's MinorProtection.permit_expires_on is strictly after the logical clock date (checked on agreement send and on shoot-block creation for every minor called to the block)"
    error_id: ERR_WORK_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /casting/participant-agreements/{id}/send, POST /casting/shoot-blocks"

  - priority: 27
    category: business_safety
    check: "education_hours_scheduled_weekly >= the jurisdiction minimum (CA 15, NY 12, GA 10, IL 12)"
    error_id: ERR_EDUCATION_HOURS_SHORTFALL
    http_status: 422
    applies_to: "POST /casting/applicants/{id}/minor-protections, PATCH /casting/minor-protections/{id}"

  - priority: 28
    category: business_safety
    check: "minor_daily_onset_hours does not exceed MINOR_DAILY_TOTAL_HOURS_CAP for any minor called to the block"
    error_id: ERR_MINOR_DAILY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /casting/shoot-blocks/{id}/roll"

  - priority: 29
    category: business_safety
    check: "an ACTIVE DUTY_OF_CARE_OFFICER protocol covers the whole block interval"
    error_id: ERR_DUTY_OF_CARE_UNCOVERED
    http_status: 422
    applies_to: "POST /casting/shoot-blocks/{id}/roll"

  - priority: 30
    category: business_safety
    check: "no called participant's applicant has medical_status EXPIRED or DEFERRED at roll time"
    error_id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http_status: 422
    applies_to: "POST /casting/shoot-blocks/{id}/roll"

  - priority: 31
    category: business_safety
    check: "a MINOR_INCIDENTAL release carries guardian_signature == true"
    error_id: ERR_GUARDIAN_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /casting/shoot-blocks/{id}/releases"

  - priority: 32
    category: business_safety
    check: "release_coverage_complete is true at wrap time"
    error_id: ERR_RELEASE_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /casting/shoot-blocks/{id}/wrap"

  - priority: 33
    category: business_constraint
    check: "applicant eligibility — completed age at production.photography_start_utc lies in [min_age, max_age] and, when casting_call.residency_state_code is non-null, residency_state_code matches it"
    error_id: ERR_ELIGIBILITY_NOT_MET
    http_status: 422
    applies_to: "POST /casting/applicants"

  - priority: 34
    category: business_constraint
    check: "a minor applicant supplies guardian_name"
    error_id: ERR_GUARDIAN_REQUIRED
    http_status: 422
    applies_to: "POST /casting/applicants"

  - priority: 35
    category: business_constraint
    check: "the applicant has no other agreement with status IN {DRAFTED, SENT, COUNTERED, REVISED, EXECUTED} unless supersedes_agreement_id names exactly that agreement"
    error_id: ERR_DUPLICATE_AGREEMENT
    http_status: 409
    applies_to: "POST /casting/participant-agreements"

  - priority: 36
    category: business_constraint
    check: "supersedes_agreement_id, when supplied, references an agreement of the same applicant with status IN {DRAFTED, SENT, COUNTERED, REVISED}"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /casting/participant-agreements"

  - priority: 37
    category: business_constraint
    check: "executing a minor's agreement keeps minor_participant_count + 1 <= minor_participant_cap"
    error_id: ERR_MINOR_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /casting/participant-agreements/{id}/execute"

  - priority: 38
    category: business_referential
    check: "an INSURANCE_RIDER protocol carries carrier_certificate_number"
    error_id: ERR_INSURANCE_CERTIFICATE_MISSING
    http_status: 422
    applies_to: "POST /casting/productions/{id}/welfare-protocols, POST /casting/welfare-protocols/{id}/activate"

  - priority: 39
    category: business_referential
    check: "a LOCATION_EXTERIOR or PUBLIC_SPACE block's location carries a non-null filming_permit_number"
    error_id: ERR_LOCATION_PERMIT_MISSING
    http_status: 422
    applies_to: "POST /casting/shoot-blocks"

  - priority: 40
    category: business_referential
    check: "every entry of participant_agreement_ids belongs to production_id and has status EXECUTED"
    error_id: ERR_PARTICIPANT_NOT_EXECUTED
    http_status: 422
    applies_to: "POST /casting/shoot-blocks"

  - priority: 41
    category: business_temporal
    check: "the block interval lies inside [production.photography_start_utc, production.photography_end_utc]"
    error_id: ERR_OUTSIDE_PHOTOGRAPHY_WINDOW
    http_status: 422
    applies_to: "POST /casting/shoot-blocks"

  - priority: 42
    category: business_temporal
    check: "no other ShootBlock at the same location with status IN {SCHEDULED, ROLLING} occupies an intersecting interval, where each block occupies the half-open interval [start_utc, end_utc + location.turnaround_buffer_minutes)"
    error_id: ERR_LOCATION_BLOCK_CONFLICT
    http_status: 409
    applies_to: "POST /casting/shoot-blocks"

  - priority: 43
    category: business_fiscal
    check: "aggregate expected_attendance over PUBLISHED OPEN_CALL calls at the same venue whose CLOSED windows intersect this one, plus this call's expected_attendance, is <= location.capacity"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /casting/casting-calls/{id}/publish"

  - priority: 44
    category: business_fiscal
    check: "stipend pool guard — at send, stipend_committed_cents + provisional_stipend_cents <= stipend_pool_cents; at execute, stipend_committed_cents + total_stipend_commitment_cents <= stipend_pool_cents"
    error_id: ERR_STIPEND_POOL_EXCEEDED
    http_status: 409
    applies_to: "POST /casting/participant-agreements/{id}/send, POST /casting/participant-agreements/{id}/execute"

  - priority: 45
    category: business_fiscal
    check: "welfare budget guard — the recomputed welfare_committed_cents must not exceed welfare_budget_cents when a protocol is created or activated"
    error_id: ERR_WELFARE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /casting/productions/{id}/welfare-protocols, POST /casting/welfare-protocols/{id}/activate"

  - priority: 46
    category: business_fiscal
    check: "trust_deposit_pct >= the jurisdiction minimum (CA 0.15, NY 0.15, GA 0.10, IL 0.10)"
    error_id: ERR_TRUST_DEPOSIT_SHORTFALL
    http_status: 422
    applies_to: "POST /casting/applicants/{id}/minor-protections, PATCH /casting/minor-protections/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Production
  - method: POST
    path: "/casting/productions"
    description: "Create a production"
    roles: [ProductionAdmin]
    code: 201
    input: [title, format_type, jurisdiction_code, season_number, episode_order, photography_start_utc, photography_end_utc, stipend_pool_cents, welfare_budget_cents, minor_participant_cap]
    output: Production
    side_effects:
      - "sets duty_of_care_tier = ENHANCED when format_type is COMPETITION_HIGH_STRESS, else STANDARD"
      - "sets casting_posture = OPEN and every rollup field to 0"

  - method: GET
    path: "/casting/productions/{id}"
    description: "Read one production including every rollup and the derived posture"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/casting/productions/{id}/welfare-run"
    description: "Advance the welfare epoch: expire coverage, lapse permits, expire medical clearances, breach overdue obligations, then recompute welfare_committed_cents and casting_posture"
    roles: [ProductionAdmin]
    code: 200
    input: []
    output: Production
    side_effects:
      - "ACTIVE WelfareProtocol rows with coverage_end_utc <= now become EXPIRED"
      - "COMPLETE MinorProtection rows with permit_expires_on <= now become LAPSED and set welfare_hold on their applicant's non-terminal agreements"
      - "applicants whose latest MEDICAL_EXAM item has expires_at <= now move medical_status CLEARED -> EXPIRED"
      - "SCHEDULED PostObligation rows with due_utc <= now become BREACHED, increment breached_obligation_count, and set welfare_hold when their agreement reaches 2 breaches"
      - "recomputes welfare_committed_cents by welfare_commitment_rollup and casting_posture by casting_posture_derivation"
      - "increments Production.version by 1"

  - method: POST
    path: "/casting/productions/{id}/welfare-protocols"
    description: "Plan an on-set welfare, insurance or aftercare protocol"
    roles: [WelfareOfficer]
    code: 201
    input: [kind, coverage_start_utc, coverage_end_utc, cost_cents, "carrier_certificate_number?"]
    output: WelfareProtocol
    side_effects:
      - "recomputes production.welfare_committed_cents by welfare_commitment_rollup and casting_posture"
      - "increments Production.version by 1"

  - method: GET
    path: "/casting/productions/{id}/welfare-protocols"
    description: "List a production's welfare protocols"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: WelfareProtocol[]
    side_effects: []

  - method: POST
    path: "/casting/welfare-protocols/{id}/activate"
    description: "Activate a planned welfare protocol; INSURANCE_RIDER rows must carry a carrier certificate and the coverage must not already be over"
    roles: [WelfareOfficer]
    code: 200
    input: []
    output: WelfareProtocol
    side_effects:
      - "sets status = ACTIVE"
      - "recomputes production.welfare_committed_cents by welfare_commitment_rollup (PLANNED and ACTIVE both count, so the subtotal is unchanged) and casting_posture"
      - "increments Production.version by 1"

  - method: POST
    path: "/casting/welfare-protocols/{id}/cancel"
    description: "Cancel a planned or active welfare protocol; the compensating action for protocol creation"
    roles: [WelfareOfficer]
    code: 200
    input: []
    output: WelfareProtocol
    side_effects:
      - "sets status = CANCELLED"
      - "recomputes production.welfare_committed_cents by welfare_commitment_rollup (CANCELLED rows leave the subtotal) and casting_posture"
      - "increments Production.version by 1"

  # --------------------------------------------------------------- Location
  - method: POST
    path: "/casting/locations"
    description: "Register a stage or location venue"
    roles: [ProductionAdmin]
    code: 201
    input: [name, state_code, capacity, turnaround_buffer_minutes, "filming_permit_number?"]
    output: Location
    side_effects: []

  # ------------------------------------------------------------ CastingCall
  - method: POST
    path: "/casting/casting-calls"
    description: "Draft a casting call with eligibility criteria and open-call logistics"
    roles: [CastingDirector]
    code: 201
    input: [production_id, channel, min_age, max_age, exclusivity_window_days, "residency_state_code?", "venue_location_id?", "open_call_window_start_utc?", "open_call_window_end_utc?", "expected_attendance?"]
    output: CastingCall
    side_effects:
      - "sets status = DRAFT"

  - method: GET
    path: "/casting/casting-calls"
    description: "List casting calls, filterable by production, venue and status"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["production_id?", "venue_location_id?", "status?", "channel?", "limit?", "offset?"]
    output: CastingCall[]
    side_effects: []

  - method: GET
    path: "/casting/casting-calls/{id}"
    description: "Read one casting call"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: []
    output: CastingCall
    side_effects: []

  - method: POST
    path: "/casting/casting-calls/{id}/publish"
    description: "Publish a casting call; open-call channels are checked against the venue's aggregate attendance capacity"
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingCall
    side_effects:
      - "sets status = PUBLISHED and published_at = now"

  - method: POST
    path: "/casting/casting-calls/{id}/close"
    description: "Close a published casting call"
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingCall
    side_effects:
      - "sets status = CLOSED and closed_reason = DIRECTOR_CLOSED"

  - method: GET
    path: "/casting/casting-calls/{id}/applicants"
    description: "List the applicants received through one casting call"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["screening_status?", "medical_status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  # ---------------------------------------------------------------- Applicant
  - method: POST
    path: "/casting/applicants"
    description: "Record an application against a published casting call"
    roles: [CastingDirector]
    code: 201
    input: [casting_call_id, legal_name, date_of_birth, residency_state_code, "guardian_name?"]
    output: Applicant
    side_effects:
      - "computes is_minor from date_of_birth against production.photography_start_utc"
      - "computes psych_eval_required from production.format_type and is_minor"
      - "sets screening_status = SUBMITTED and medical_status = NOT_STARTED"

  - method: GET
    path: "/casting/applicants/{id}"
    description: "Read one applicant including both state dimensions and both risk-score variants"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/casting/applicants/{id}/withdraw"
    description: "Participant withdrawal; cascades through agreements, obligations and the minor trust"
    roles: [Applicant]
    code: 200
    input: [reason]
    output: Applicant
    side_effects:
      - "sets screening_status = WITHDRAWN"
      - "voids the applicant's non-VOIDED agreements with void_reason = APPLICANT_WITHDRAWN"
      - "excuses SCHEDULED post-obligations, releases MinorProtection packets and refunds the trust escrow"
      - "recomputes production.stipend_committed_cents, minor_participant_count, trust_escrow_balance_cents and casting_posture"

  - method: POST
    path: "/casting/applicants/{id}/screening-items"
    description: "Open a screening instrument; supplying outcome records it immediately, omitting it leaves the item PENDING"
    roles: [ComplianceOfficer]
    code: 201
    input: [kind, "outcome?", "severity_flags?", "conditional_conditions?"]
    output: ScreeningItem
    side_effects:
      - "sets recorded_by_user_id, recorded_at and expires_at when an outcome is supplied"
      - "recomputes applicant.provisional_risk_score, and final_risk_score once every required kind is recorded"
      - "advances applicant.screening_status and medical_status per the Applicant machine"

  - method: GET
    path: "/casting/applicants/{id}/screening-items"
    description: "List one applicant's screening items"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["kind?", "outcome?", "limit?", "offset?"]
    output: ScreeningItem[]
    side_effects: []

  - method: POST
    path: "/casting/screening-items/{id}/record-outcome"
    description: "Record the outcome of a PENDING screening item under the four-eyes rule"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, severity_flags, "conditional_conditions?"]
    output: ScreeningItem
    side_effects:
      - "sets outcome, severity_flags, recorded_by_user_id = X-User-ID, recorded_at = now, expires_at per kind"
      - "recomputes both risk-score variants and both applicant state dimensions"

  # ---------------------------------------------------------- MinorProtection
  - method: POST
    path: "/casting/applicants/{id}/minor-protections"
    description: "File a minor's work permit, education schedule and trust percentage"
    roles: [ComplianceOfficer]
    code: 201
    input: [work_permit_number, permit_expires_on, education_hours_scheduled_weekly, trust_deposit_pct]
    output: MinorProtection
    side_effects:
      - "sets status = COMPLETE when the permit is unexpired and both jurisdiction minimums are met, else INCOMPLETE"

  - method: GET
    path: "/casting/applicants/{id}/minor-protections"
    description: "List one applicant's minor-protection packets"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MinorProtection[]
    side_effects: []

  - method: PATCH
    path: "/casting/minor-protections/{id}"
    description: "Amend a minor-protection packet; re-derives status in both directions"
    roles: [ComplianceOfficer]
    code: 200
    input: ["work_permit_number?", "permit_expires_on?", "education_hours_scheduled_weekly?", "trust_deposit_pct?"]
    output: MinorProtection
    side_effects:
      - "re-derives status between INCOMPLETE and COMPLETE"

  - method: POST
    path: "/casting/minor-protections/{id}/trust-deposits"
    description: "Deposit the minor's blocked-trust share in equal installments"
    roles: [BusinessAffairs]
    code: 200
    input: [installment_count]
    output: MinorProtection
    side_effects:
      - "writes per_installment_cents and trust_deposited_cents by minor_trust_deposit_schedule"
      - "recomputes production.trust_escrow_balance_cents by trust_escrow_rollup"

  # ----------------------------------------------------- ParticipantAgreement
  - method: POST
    path: "/casting/participant-agreements"
    description: "Draft a participant agreement; expected_applicant_version guards the applicant's state against a concurrent draft that would supersede this one"
    roles: [BusinessAffairs]
    code: 201
    input: [applicant_id, production_id, exclusivity_window_days, confidentiality_tier, depiction_rights_scope, stipend_structure, base_stipend_cents, episodes_committed, expected_applicant_version, "press_appearance_obligation_count?", "reunion_obligation?", "supersedes_agreement_id?"]
    output: ParticipantAgreement
    side_effects:
      - "sets status = DRAFTED and round_number = 0"
      - "voids the superseded agreement with void_reason = SUPERSEDED when supersedes_agreement_id is supplied"
      - "increments Applicant.version by 1"

  - method: GET
    path: "/casting/participant-agreements"
    description: "List agreements, filterable by production, applicant, supersede target and status"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["production_id?", "applicant_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"]
    output: ParticipantAgreement[]
    side_effects: []

  - method: GET
    path: "/casting/participant-agreements/{id}"
    description: "Read one agreement including both stipend variants and the negotiation counters"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: []
    output: ParticipantAgreement
    side_effects: []

  - method: POST
    path: "/casting/participant-agreements/{id}/send"
    description: "Send the agreement to the participant; writes the PROVISIONAL stipend variant and enforces the full clearance gate"
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: ParticipantAgreement
    side_effects:
      - "writes provisional_stipend_cents (variant PROVISIONAL)"
      - "sets status = SENT"

  - method: POST
    path: "/casting/participant-agreements/{id}/counter-offer"
    description: "Participant counter-offer; appends a negotiation round under optimistic concurrency on the agreement version"
    roles: [Applicant]
    code: 200
    input: [requested_base_stipend_cents, requested_exclusivity_window_days, requested_depiction_rights_scope, expected_agreement_version]
    output: ParticipantAgreement
    side_effects:
      - "appends a NegotiationRound with proposed_by = PARTICIPANT and disposition = COUNTERED"
      - "increments round_number, sets status = COUNTERED"
      - "increments ParticipantAgreement.version by 1"

  - method: POST
    path: "/casting/participant-agreements/{id}/revise"
    description: "Production-side revision of a countered agreement; overwrites the negotiated terms and appends a PRODUCTION round"
    roles: [BusinessAffairs]
    code: 200
    input: [base_stipend_cents, exclusivity_window_days, depiction_rights_scope, "episodes_committed?", "press_appearance_obligation_count?", "reunion_obligation?"]
    output: ParticipantAgreement
    side_effects:
      - "overwrites the agreement's term fields"
      - "appends a NegotiationRound with proposed_by = PRODUCTION and disposition = REVISED"
      - "sets last_production_proposer_user_id = X-User-ID, increments round_number, sets status = REVISED"

  - method: POST
    path: "/casting/participant-agreements/{id}/execute"
    description: "Execute the agreement; writes the FINAL stipend variant and drives the stipend/posture/casting-call cascade"
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: ParticipantAgreement
    side_effects:
      - "writes total_stipend_commitment_cents (variant FINAL), status = EXECUTED, executed_by_user_id, executed_at"
      - "sets applicant.screening_status = CAST"
      - "recomputes production.stipend_committed_cents, minor_participant_count and casting_posture"
      - "closes PUBLISHED OPEN_CALL calls when the posture becomes RESTRICTED"
      - "auto-creates the PostObligation rows by post_obligation_fee_allocation"

  - method: POST
    path: "/casting/participant-agreements/{id}/void"
    description: "Void an agreement; the compensating action that must leave stipend_committed_cents and trust_escrow_balance_cents free of drift"
    roles: [BusinessAffairs]
    code: 200
    input: [void_reason]
    output: ParticipantAgreement
    side_effects:
      - "sets status = VOIDED, void_reason, and zeroes total_stipend_commitment_cents"
      - "excuses SCHEDULED post-obligations and releases the applicant's MinorProtection packets"
      - "recomputes production.stipend_committed_cents, minor_participant_count, trust_escrow_balance_cents and casting_posture"

  - method: GET
    path: "/casting/participant-agreements/{id}/negotiation-rounds"
    description: "Read the append-only negotiation log of one agreement"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: ["proposed_by?", "limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []

  - method: GET
    path: "/casting/participant-agreements/{id}/post-obligations"
    description: "List the post-production obligations auto-created for one agreement"
    roles: [ProductionAdmin, CastingDirector, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: PostObligation[]
    side_effects: []

  - method: POST
    path: "/casting/post-obligations/{id}/fulfill"
    description: "Record a press or reunion appearance as fulfilled"
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: PostObligation
    side_effects:
      - "sets status = FULFILLED and fulfilled_at = now"

  # ------------------------------------------------------------- Complaint
  - method: POST
    path: "/casting/participant-agreements/{id}/complaints"
    description: "Participant files a complaint against an executed or voided agreement"
    roles: [Applicant]
    code: 201
    input: [category, severity, narrative]
    output: Complaint
    side_effects:
      - "sets status = OPEN"

  - method: GET
    path: "/casting/participant-agreements/{id}/complaints"
    description: "List complaints filed under one agreement"
    roles: [ProductionAdmin, BusinessAffairs, WelfareOfficer, Applicant]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/casting/complaints/{id}/triage"
    description: "Triage a complaint"
    roles: [WelfareOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "sets status = TRIAGED and triaged_by_user_id = X-User-ID"

  - method: POST
    path: "/casting/complaints/{id}/route"
    description: "Fork a triaged complaint into the aftercare branch or the escalation branch; the branches carry different side-effect sets"
    roles: [WelfareOfficer]
    code: 200
    input: [route]
    output: Complaint
    side_effects:
      - "AFTERCARE: status = AFTERCARE_ACTIVE and aftercare_sessions_authorized written; no Production field changes"
      - "ESCALATION: status = ESCALATED, duty_of_care_breach derived, aftercare_sessions_authorized written from the pre-escalation tier, then the welfare-incident / tier / welfare-committed / posture / casting-call cascade"

  - method: POST
    path: "/casting/complaints/{id}/resolve"
    description: "Close a complaint from either branch"
    roles: [WelfareOfficer]
    code: 200
    input: [resolution_note]
    output: Complaint
    side_effects:
      - "sets status = RESOLVED and resolution_note"

  # ------------------------------------------------------------- ShootBlock
  - method: POST
    path: "/casting/shoot-blocks"
    description: "Schedule a shooting block at a location for a set of executed participants"
    roles: [ProductionAdmin]
    code: 201
    input: [production_id, location_id, block_kind, start_utc, end_utc, participant_agreement_ids, "expected_crowd_headcount?", "onset_minor_hours?"]
    output: ShootBlock
    side_effects:
      - "sets status = SCHEDULED and computes minor_participant_count"

  - method: GET
    path: "/casting/shoot-blocks"
    description: "List shoot blocks, filterable by production, location and status"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["production_id?", "location_id?", "status?", "limit?", "offset?"]
    output: ShootBlock[]
    side_effects: []

  - method: GET
    path: "/casting/shoot-blocks/{id}"
    description: "Read one shoot block including its release coverage rollup"
    roles: [ProductionAdmin, CastingDirector, ComplianceOfficer, BusinessAffairs, WelfareOfficer]
    code: 200
    input: []
    output: ShootBlock
    side_effects: []

  - method: POST
    path: "/casting/shoot-blocks/{id}/roll"
    description: "Start rolling; enforces duty-of-care coverage, medical validity and the minor daily-hours cap"
    roles: [ProductionAdmin]
    code: 200
    input: []
    output: ShootBlock
    side_effects:
      - "sets status = ROLLING"

  - method: POST
    path: "/casting/shoot-blocks/{id}/wrap"
    description: "Wrap the block; requires complete incidental-release coverage"
    roles: [ProductionAdmin]
    code: 200
    input: []
    output: ShootBlock
    side_effects:
      - "re-evaluates release_coverage_completeness and sets status = WRAPPED"

  - method: POST
    path: "/casting/shoot-blocks/{id}/releases"
    description: "Collect an incidental-appearance or property release on a block"
    roles: [ProductionAdmin]
    code: 201
    input: [subject_kind, head_count, disposition, "subject_name?", "guardian_signature?"]
    output: Release
    side_effects:
      - "sets collected_at = now"
      - "recomputes shoot_block.covered_head_count and release_coverage_complete"

  - method: GET
    path: "/casting/shoot-blocks/{id}/releases"
    description: "List the releases collected on one block"
    roles: [ProductionAdmin, CastingDirector, BusinessAffairs, WelfareOfficer]
    code: 200
    input: ["subject_kind?", "disposition?", "limit?", "offset?"]
    output: Release[]
    side_effects: []

  # ------------------------------------------------------- test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, expiry, window and age comparison in this scaffold reads the logical clock."
    roles: [ProductionAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "sets the logical clock; performs no entity mutation and fires no sweep"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or not one of the six declared roles"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Applicant-role caller addresses a resource whose owning applicant_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same user id would record both BACKGROUND_CHECK and PSYCH_EVAL for one applicant, or would both author the latest production revision and execute the agreement"
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "no Production with the referenced id"
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "no Location with the referenced id"
  - id: ERR_CASTING_CALL_NOT_FOUND
    http: 404
    condition: "no CastingCall with the referenced id"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "no Applicant with the referenced id"
  - id: ERR_SCREENING_ITEM_NOT_FOUND
    http: 404
    condition: "no ScreeningItem with the referenced id"
  - id: ERR_MINOR_PROTECTION_NOT_FOUND
    http: 404
    condition: "no MinorProtection with the referenced id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ParticipantAgreement with the referenced id"
  - id: ERR_WELFARE_PROTOCOL_NOT_FOUND
    http: 404
    condition: "no WelfareProtocol with the referenced id"
  - id: ERR_SHOOT_BLOCK_NOT_FOUND
    http: 404
    condition: "no ShootBlock with the referenced id"
  - id: ERR_POST_OBLIGATION_NOT_FOUND
    http: 404
    condition: "no PostObligation with the referenced id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint with the referenced id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, mis-ordered datetime pair, or duplicate entry in participant_agreement_ids"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or negative offset"
  - id: ERR_STALE_APPLICANT_VERSION
    http: 412
    condition: "expected_applicant_version does not equal the applicant's current version"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the agreement's current version"
  - id: ERR_CASTING_FROZEN
    http: 409
    condition: "the production's casting_posture is FROZEN and the operation is gated by posture"
  - id: ERR_CASTING_RESTRICTED
    http: 409
    condition: "the production's casting_posture is RESTRICTED and the operation is a casting-call publish or an OPEN_CALL intake"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the addressed entity's current state does not declare the requested transition"
  - id: ERR_WELFARE_HOLD_ACTIVE
    http: 409
    condition: "the agreement carries welfare_hold true and a negotiation write was attempted"
  - id: ERR_CASTING_CALL_NOT_OPEN
    http: 409
    condition: "an application was recorded against a call whose status is not PUBLISHED"
  - id: ERR_OPEN_CALL_WINDOW_CLOSED
    http: 409
    condition: "the logical clock lies outside the OPEN_CALL closed intake window"
  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "a trust deposit was requested before the applicant's agreement reached EXECUTED"
  - id: ERR_COMPLAINT_TARGET_INVALID
    http: 409
    condition: "a complaint was filed against an agreement whose status is not EXECUTED or VOIDED"
  - id: ERR_DUPLICATE_AGREEMENT
    http: 409
    condition: "the applicant already has a non-VOIDED agreement that supersedes_agreement_id does not name"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_agreement_id names an agreement of another applicant or one already in a terminal state"
  - id: ERR_MINOR_CAP_EXCEEDED
    http: 409
    condition: "executing a minor's agreement would push minor_participant_count above minor_participant_cap"
  - id: ERR_SCREENING_INCOMPLETE
    http: 422
    condition: "the applicant's screening_status is not CLEARED"
  - id: ERR_MEDICAL_CLEARANCE_MISSING
    http: 422
    condition: "the applicant's medical_status is not CLEARED at send or execute"
  - id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http: 422
    condition: "a called participant's medical_status is EXPIRED or DEFERRED at roll time"
  - id: ERR_PSYCH_EVAL_REQUIRED
    http: 422
    condition: "a high-stress-format or minor applicant lacks a valid PSYCH_EVAL outcome"
  - id: ERR_ENHANCED_SUPPORT_MISSING
    http: 422
    condition: "enhanced_support_required is true but no ACTIVE ONSET_PSYCH_SUPPORT protocol covers the photography window"
  - id: ERR_MINOR_PROTECTION_INCOMPLETE
    http: 422
    condition: "a minor applicant has no MinorProtection packet with status COMPLETE"
  - id: ERR_WORK_PERMIT_EXPIRED
    http: 422
    condition: "a minor's work permit expires on or before the logical clock date"
  - id: ERR_EDUCATION_HOURS_SHORTFALL
    http: 422
    condition: "education_hours_scheduled_weekly is below the jurisdiction minimum"
  - id: ERR_TRUST_DEPOSIT_SHORTFALL
    http: 422
    condition: "trust_deposit_pct is below the jurisdiction minimum"
  - id: ERR_MINOR_DAILY_HOURS_EXCEEDED
    http: 422
    condition: "a minor's same-date on-set plus education hours would exceed 8.0"
  - id: ERR_DUTY_OF_CARE_UNCOVERED
    http: 422
    condition: "no ACTIVE DUTY_OF_CARE_OFFICER protocol covers the block interval at roll time"
  - id: ERR_GUARDIAN_REQUIRED
    http: 422
    condition: "a minor application omits guardian_name"
  - id: ERR_GUARDIAN_SIGNATURE_REQUIRED
    http: 422
    condition: "a MINOR_INCIDENTAL release lacks the guardian counter-signature"
  - id: ERR_RELEASE_COVERAGE_INCOMPLETE
    http: 422
    condition: "covered_head_count is below expected_crowd_headcount, or a minor incidental release lacks its guardian signature, at wrap time"
  - id: ERR_ELIGIBILITY_NOT_MET
    http: 422
    condition: "the applicant's age at photography start is outside the call's age band, or residency does not match the call's required state"
  - id: ERR_INSURANCE_CERTIFICATE_MISSING
    http: 422
    condition: "an INSURANCE_RIDER protocol is created or activated without carrier_certificate_number"
  - id: ERR_LOCATION_PERMIT_MISSING
    http: 422
    condition: "a LOCATION_EXTERIOR or PUBLIC_SPACE block is scheduled at a venue with no filming_permit_number"
  - id: ERR_PARTICIPANT_NOT_EXECUTED
    http: 422
    condition: "a participant_agreement_ids entry is not an EXECUTED agreement of the same production"
  - id: ERR_OUTSIDE_PHOTOGRAPHY_WINDOW
    http: 422
    condition: "the block interval falls outside the production's photography window"
  - id: ERR_LOCATION_BLOCK_CONFLICT
    http: 409
    condition: "the block's half-open interval, extended by the venue turnaround buffer, intersects another SCHEDULED or ROLLING block at the same venue"
  - id: ERR_VENUE_CAPACITY_EXCEEDED
    http: 409
    condition: "aggregate expected attendance of window-overlapping PUBLISHED open calls at the venue would exceed its capacity"
  - id: ERR_STIPEND_POOL_EXCEEDED
    http: 409
    condition: "the send-time provisional guard or the execute-time final guard would push committed stipend past the pool"
  - id: ERR_WELFARE_BUDGET_EXCEEDED
    http: 409
    condition: "creating or activating a protocol would push welfare_committed_cents past welfare_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionAdmin
    description: "Production management: productions, venues, shooting blocks, releases and the welfare epoch sweep"
    identity: opaque
    exclusive_operations:
      - "POST /casting/productions"
      - "POST /casting/locations"
      - "POST /casting/productions/{id}/welfare-run"
      - "POST /casting/shoot-blocks"
      - "POST /casting/shoot-blocks/{id}/roll"
      - "POST /casting/shoot-blocks/{id}/wrap"
      - "POST /casting/shoot-blocks/{id}/releases"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: CastingDirector
    description: "Casting call distribution and applicant intake"
    identity: opaque
    exclusive_operations:
      - "POST /casting/casting-calls"
      - "POST /casting/casting-calls/{id}/publish"
      - "POST /casting/casting-calls/{id}/close"
      - "POST /casting/applicants"
    shared_operations:
      - "all GET endpoints except GET /casting/participant-agreements/{id}/complaints"

  - name: ComplianceOfficer
    description: "Screening instruments, medical clearance and minor protections; subject to the four-eyes screening rule"
    identity: opaque
    exclusive_operations:
      - "POST /casting/applicants/{id}/screening-items"
      - "POST /casting/screening-items/{id}/record-outcome"
      - "POST /casting/applicants/{id}/minor-protections"
      - "PATCH /casting/minor-protections/{id}"
    shared_operations:
      - "GET endpoints on productions, casting calls, applicants, screening items, minor protections, agreements, welfare protocols and shoot blocks"

  - name: BusinessAffairs
    description: "Agreement drafting, negotiation, execution, voiding, trust deposits and post-production obligations; subject to the four-eyes execution rule"
    identity: opaque
    exclusive_operations:
      - "POST /casting/participant-agreements"
      - "POST /casting/participant-agreements/{id}/send"
      - "POST /casting/participant-agreements/{id}/revise"
      - "POST /casting/participant-agreements/{id}/execute"
      - "POST /casting/participant-agreements/{id}/void"
      - "POST /casting/post-obligations/{id}/fulfill"
      - "POST /casting/minor-protections/{id}/trust-deposits"
    shared_operations:
      - "GET endpoints on productions, casting calls, applicants, screening items, minor protections, agreements, negotiation rounds, post-obligations, complaints, welfare protocols and shoot blocks"

  - name: WelfareOfficer
    description: "On-set welfare and insurance protocols, complaint triage, aftercare and escalation"
    identity: opaque
    exclusive_operations:
      - "POST /casting/productions/{id}/welfare-protocols"
      - "POST /casting/welfare-protocols/{id}/activate"
      - "POST /casting/welfare-protocols/{id}/cancel"
      - "POST /casting/complaints/{id}/triage"
      - "POST /casting/complaints/{id}/route"
      - "POST /casting/complaints/{id}/resolve"
    shared_operations:
      - "GET endpoints on productions, casting calls, applicants, screening items, minor protections, agreements, negotiation rounds, post-obligations, complaints, welfare protocols, shoot blocks and releases"

  - name: Applicant
    description: "The participant: counter-offers, withdrawal, complaints and reads of their own records"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /casting/participant-agreements/{id}/counter-offer"
      - "POST /casting/applicants/{id}/withdraw"
      - "POST /casting/participant-agreements/{id}/complaints"
    shared_operations:
      - "GET /casting/productions/{id}"
      - "GET /casting/applicants/{id} (own record only)"
      - "GET /casting/participant-agreements/{id} (own agreements only)"
      - "GET /casting/participant-agreements/{id}/negotiation-rounds"
      - "GET /casting/participant-agreements/{id}/post-obligations"
      - "GET /casting/participant-agreements/{id}/complaints"
