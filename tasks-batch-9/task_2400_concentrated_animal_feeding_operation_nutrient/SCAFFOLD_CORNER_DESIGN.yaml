          the zero-findings shortcut and the full notice-of-violation path are each blocked for the
          conducting user and each succeed for a second closer — once a peer StateReviewer, once the
          ComplianceAdmin who shares the close operation. The rejected attempts must leave the
          inspection, the permit compliance dimension and the operation posture untouched.
