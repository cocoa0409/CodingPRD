          - state_machines.InventoryLot.DEPLETED_to_ON_HAND
          - calculations.fifo_lot_reservation
        distinguishing_aspect: |
          Conserved quantity: mbf of physical stock at a branch. The invariant
          qty_available + qty_reserved + qty_sold == qty_received holds per lot
          before, during, and after a confirm/cancel round trip: confirm moves 8
          mbf to reserved; cancel returns exactly those 8 mbf; nothing is sold.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch with L1 10 mbf @ 50000 (received 2026-09-02) and L2 10 mbf @ 60000 (received 2026-09-03). Builder ACTIVE; job J. Order of 8 mbf FIXED @ 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 50000 }
              as: BranchManager
              captures: { lot1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 60000 }
              as: BranchManager
              captures: { lot2: $.data.id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 8, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /sales-orders/${o}/cancel"
              payload: {}
              as: AccountManager
              captures: { o_status: $.data.order_status }
          assert:
            - "mid-flight invariant (observed after confirm, before cancel): InventoryLot.${lot1} had qty_reserved_mbf == 8 and qty_available_mbf == 2; sum across lots stayed 20 == received 20"
            - "after cancel: InventoryLot.${lot1}.qty_available_mbf == 10 and qty_reserved_mbf == 0 and lot_status == ON_HAND"
            - "InventoryLot.${lot2}.qty_available_mbf == 10 and qty_reserved_mbf == 0 (never touched: FIFO took L1 only)"
            - "per-lot conservation: available + reserved + sold == received for both lots (10+0+0 == 10)"
            - "SalesOrder.${o}.order_status == CANCELLED"

      - name: confirm_then_cancel_restores_builder_committed_exposure_cents
        grounds:
          - calculations.builder_exposure
          - state_machines.SalesOrder.CONFIRMED_to_CANCELLED
          - entities.Builder.fields.exposure_committed_cents
        distinguishing_aspect: |
          Conserved quantity: cents of committed credit exposure. Confirm adds
          exactly order_total_cents (2000000) to builder and job committed
          exposure; cancel subtracts exactly the same amount; the round trip
          returns both exposure_committed_cents fields to 0 with settled exposure
          untouched at 0 — forward + compensating action leaves no drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch stocked 100 mbf. Builder ACTIVE limit 5000000; job J. Order of 20 mbf FIXED @ 100000 = 2000000 CONFIRMED (committed exposure 2000000 on builder and job)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 100, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 20, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /sales-orders/${o}/cancel"
              payload: {}
              as: AccountManager
            - call: "GET /builders/${b}/exposure"
              payload: {}
              as: CreditManager
              captures: { com: $.data.exposure_committed_cents, set_: $.data.exposure_settled_cents }
          assert:
            - "exposure_committed_cents == 0 after the round trip (was 2000000 after confirm)"
            - "exposure_settled_cents == 0 (cancel never touches settled)"
            - "BuilderJob.${job}.exposure_committed_cents == 0"
            - "the invariant exposure_committed == sum of order totals over CONFIRMED/ON_HOLD orders holds with zero qualifying orders"
