            - "inventorying the STEP_THERAPY item is permitted although the plan year is UNDER_REGULATOR_REVIEW (only classifications and treatment limitations are frozen at priority 15)"
            - "the second respond -> 200 with RegulatorRequest.${rr_id}.status == RESPONDED, requested_item_count == 1, covered_item_count == 0"
            - "RegulatorRequest.${rr_id}.completeness_score == 0.00 and response_sufficient == false"

