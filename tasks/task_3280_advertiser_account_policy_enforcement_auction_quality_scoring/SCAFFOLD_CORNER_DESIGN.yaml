  # ===========================================================================
  - section: validations
    instances:
      - name: campaign_create_missing_budget_returns_validation
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /campaigns without daily_budget_cents fails shape validation with ERR_VALIDATION (400) before any fiscal rule."
        test_recipe:
          setup: ["Clock 2026-09-01. Fresh account."]
          setup_api_calls:
            - *clock0
            - *acct0
          trigger:
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "NB", start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: campaign_budget_below_minimum_returns_fiscal_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_BUDGET_BELOW_MINIMUM]
        distinguishing_aspect: "daily_budget_cents 99 is shape-valid but below the 100 minimum and returns ERR_BUDGET_BELOW_MINIMUM (422); 100 succeeds."
        test_recipe:
          setup: ["Clock 2026-09-01. Fresh account."]
          setup_api_calls:
            - *clock0
            - *acct0
          trigger:
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "B99", daily_budget_cents: 99, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "B100", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ok: $.data.id }
          assert:
            - "err == ERR_BUDGET_BELOW_MINIMUM"
            - "budget 100 campaign created (201)"

      - name: campaign_end_before_start_returns_date_range_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_CAMPAIGN_DATE_RANGE_INVALID]
        distinguishing_aspect: "end_date 2026-09-10 < start_date 2026-09-20 is rejected with ERR_CAMPAIGN_DATE_RANGE_INVALID at creation."
        test_recipe:
          setup: ["Clock 2026-09-01. Fresh account."]
          setup_api_calls:
            - *clock0
            - *acct0
          trigger:
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "BAD", daily_budget_cents: 100, start_date: "2026-09-20", end_date: "2026-09-10" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CAMPAIGN_DATE_RANGE_INVALID"

      - name: negative_keyword_must_not_carry_bid
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - entities.Keyword.fields.max_cpc_cents
        distinguishing_aspect: "is_negative=true with max_cpc_cents 100 is a shape violation (bid forbidden on negatives) returning ERR_VALIDATION; the same call without the bid succeeds."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with campaign and ad group."]
          setup_api_calls:
            - *clock0
            - *acct0
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "NK", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "free", match_type: "BROAD", is_negative: true, max_cpc_cents: 100 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "free", match_type: "BROAD", is_negative: true }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ok: $.data.id }
          assert:
            - "err == ERR_VALIDATION"
            - "negative keyword without bid created (201)"

      - name: duplicate_keyword_tuple_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_KEYWORD]
        distinguishing_aspect: "Same (normalized_text, match_type, is_negative) in one ad group conflicts even with different raw casing; a different match_type with the same text does NOT conflict."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with campaign, ad group, and keyword 'shoes' EXACT bid 100."]
          setup_api_calls:
            - *clock0
            - *acct0
