            - call: "POST /kitchen/meal-services"
              payload: { menu_day_id: "${md}", service_model: "TO_GO", window_start: "2026-08-11T11:00:00Z", window_end: "2026-08-11T12:00:00Z", capacity: 40 }
              as: KitchenManager
              captures: { ok_id: $.data.id }
          assert:
            - "capacity 41 rejected: $.data.error_id == ERR_CONSTRAINT_VIOLATION (shape rule)"
            - "capacity 40 accepted (20 per 30-min slot x 2 slots)"

