            - "after docketing, the master hearing is created with 201"
            - "a second hearing while one is SCHEDULED fails 409 ERR_CASE_HAS_SCHEDULED_HEARING"

      - name: decision_issuance_guards
        claim_type: Violation → Error
        grounds:
          - errors.ERR_NO_COMPLETED_MERITS_HEARING
          - errors.ERR_NOT_ASSIGNED_JUDGE
          - state_machines.Case.MERITS_to_DECIDED
        distinguishing_aspect: "Decision issuance enforces ownership before readiness: the wrong judge is rejected with 403 ERR_NOT_ASSIGNED_JUDGE (priority 4) even though the case also lacks a completed merits hearing, while the assigned judge hits 409 ERR_NO_COMPLETED_MERITS_HEARING (priority 5)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case in MERITS (master hearing completed) with NO merits hearing held. A second judge exists at the same court."
          setup_api_calls:
            - *c_clock
            - *c_court
