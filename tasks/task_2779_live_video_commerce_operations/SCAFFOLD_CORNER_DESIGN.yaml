            - "Second call: HTTP 200; LineupSlot.${sl1}.replay_marker_offset_sec == 4200, replay_product_link_url == 'https://shop.example.com/robe', replay_marker_status == DRAFT"
            - "Show.${sh1}.went_live_at == 2026-08-10T17:50:00Z and ended_at == 2026-08-10T19:00:00Z bound the range"

