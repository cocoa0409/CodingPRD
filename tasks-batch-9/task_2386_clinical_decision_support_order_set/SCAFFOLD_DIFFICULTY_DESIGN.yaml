              captures: { b_final_state: $.data.review_cycle_state, b_restaged: $.data.restaged_order_set_count }
          assert:
            - "${a1_weight} == 9 (SEVERITY_INCREASED 5 plus the CONTRAINDICATED bonus 4)"
            - "${a_score} == 24 and ${a_state} == IMPACT_ANALYZED_FAST_TRACK"
            - "${b_score} == 26 and ${b_state} == IMPACT_ANALYZED_CLINICAL_REVIEW — the single extra 2-point delta crosses the 25-point fork"
            - "${a_final_state} == ACTIVATED and ${a_restaged} == 0"
            - "${b_denied} == ERR_UNAUTHORIZED (HTTP 403): the same role and the same payload that activated the FAST_TRACK arm is refused on the CLINICAL_REVIEW arm"
            - "${b_final_state} == ACTIVATED and ${b_restaged} == 0 (no published order set is pinned to a predecessor in this instance)"
            - "VendorContentRelease.${vra_id}.contraindicated_delta_count == 2 and VendorContentRelease.${vrb_id}.contraindicated_delta_count == 2"
            - "VendorContentRelease.${vra_id}.dispositioned_delta_count == 4 and VendorContentRelease.${vrb_id}.dispositioned_delta_count == 5"

  - rule_id: transitive_cascade
    instances:
      - name: cascade_expiration_sweep_task_to_order_set_to_alert_to_window_to_ledger
        cascade_depth: 5
        grounds:
          - state_machines.AnnualReviewTask.PENDING_to_EXPIRED
          - state_machines.OrderSet.PUBLISHED_to_EXPIRED
          - state_machines.Alert.ACTIVE_to_SUSPENDED
          - state_machines.AlertBurdenWindow.OPEN_to_CLOSED
          - calculations.alert_burden_index
          - calculations.content_review_schedule
        distinguishing_aspect: |
          One sweep call propagates five links deep, and every link exists only
          because the previous one fired: the task expires because the clock passed
          expiration_at, the order set expires BECAUSE the task expired, the alert is
          suspended BECAUSE its linked order set expired, the OPEN burden window is
          closed BECAUSE the alert was suspended, and the alert's firing ledger and
          latest_burden_index are rewritten BECAUSE that window closed and computed a
          burden index. Nothing in the trigger payload names the alert, the window or
          the ledger.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair, pharmacist, two peer reviewers and two specialty approvers exist."
            - "An ACTIVATED vendor release exists to pin."
            - "An accepted BOTH request carries one STANDARD order set (one non-high-alert item) approved by 2 peer and 2 specialty votes and published with go_live_at 2026-08-15T00:00:00Z, producing an AnnualReviewTask with review_due_date 2027-08-15, expiration_at 2027-09-14 and archive_eligible_at 2027-12-13."
            - "A TIER_2_INTERRUPTIVE alert linked to that order set is APPROVED by 2 specialty votes; the clock is advanced to 2026-09-01T00:00:00Z before activation so its own task expires later (review_due 2027-09-01, expiration 2027-10-01)."
            - "40 firings at 3600s intervals from 2026-09-01T00:00:00Z, 36 of them overrides, across 10 distinct clinicians."
            - "One OPEN burden window spans 2026-09-01T00:00:00Z to 2026-10-01T00:00:00Z and contains all 40 firings."
            - "Clock advanced to 2027-09-14T00:00:00Z, exactly the order set's expiration_at and 30 days before its archive_eligible_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
