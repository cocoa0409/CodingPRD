  - method: POST
    path: "/api/terms/{id}/close"
    description: "Close a term at/after end_date"
    roles: [DiningServicesManager]
    code: 200
    input: []
    output: Term
    side_effects: ["increments Term.version by 1", "enrollment close cascade", "DINING_DOLLARS sweep to CLOSE_PENDING / FORFEITED", "pending change requests -> EXPIRED"]
  - method: POST
    path: "/api/terms/{id}/settle"
