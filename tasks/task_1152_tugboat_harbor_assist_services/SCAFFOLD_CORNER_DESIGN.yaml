scaffold_corner_design:
  - section: entities
    instances:
      - name: create_tug_initializes_system_fields
        claim_type: creation
        grounds: [entities.Tug, "endpoints[POST /api/tugs]"]
        distinguishing_aspect: "A tug is created 201 with server-minted id, operational_status AVAILABLE (default), and version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id, tug_status: $.data.operational_status, tug_v: $.data.version }
          trigger:
            - call: "GET /api/tugs/${tug_a}"
              payload: {}
              as: PortAdmin
              captures: { tug_get_status: $.data.operational_status }
          assert:
            - "Tug.${tug_a}.operational_status == AVAILABLE on create and on re-read"
            - "Tug.${tug_a}.version == 1"
            - "Tug.${tug_a}.id is a server-minted UUID (no type prefix)"

      - name: create_job_order_missing_scheduled_end_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.JobOrder.fields.scheduled_end, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field scheduled_end on job creation yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Vessel and tariff exist"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { err: $.data.error_id }
          assert:
            - "Create rejected with error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: create_job_order_invalid_maneuver_type_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.JobOrder.fields.maneuver_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "maneuver_type outside {DOCKING, UNDOCKING, SHIFTING, ESCORT, TOWAGE} yields ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["Vessel and tariff exist"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "CIRCLE", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { err: $.data.error_id }
          assert:
            - "Create rejected with error_id == ERR_INVALID_ENUM (HTTP 400)"

      - name: get_tug_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /api/tugs/{id}]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/tugs/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PortAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: create_tug_with_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Tug]
        distinguishing_aspect: "Client-supplied id in the create payload is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/tugs"
              payload: { id: "11111111-2222-4333-8444-555555555555", name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_id: $.data.id }
          assert:
            - "Response data.id != 11111111-2222-4333-8444-555555555555 (server-minted id wins)"

      - name: list_job_orders_pagination_defaults
        claim_type: listing
        grounds: ["endpoints[GET /api/job-orders]", response_envelope]
        distinguishing_aspect: "List response carries pagination fields with defaults limit=10, offset=0 and correct total_count/has_more."
        test_recipe:
          setup: ["Two job orders for the same vessel"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
          trigger:
            - call: "GET /api/job-orders"
              payload: { vessel_id: "${v1}" }
              as: PortDispatcher
          assert:
            - "Response envelope includes limit == 10, offset == 0, total_count == 2, has_more == false"
            - "response_type == array and data has 2 entries"

      - name: gear_inspection_is_immutable_event_record
        claim_type: immutability
        grounds: [entities.GearInspection]
        distinguishing_aspect: "GearInspection has common_fields false: its response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Tug exists"]
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
          trigger:
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "BITTS", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-11-01T00:00:00Z" }
              as: MarineSurveyor
              captures: { gi: $.data.id }
          assert:
            - "GearInspection.${gi} response contains id and created_at and no version field"
            - "GET /api/gear-inspections/${gi} returns the stored record with outcome == PASSED"

  - section: state_machines
    instances:
      - name: job_order_initial_state_requested
        claim_type: initial_state
        grounds: [state_machines.JobOrder]
        distinguishing_aspect: "A newly created JobOrder starts in REQUESTED."
        test_recipe:
          setup: ["Vessel and tariff exist; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id, st: $.data.status }
          assert:
            - "JobOrder.${job1}.status == REQUESTED"

      - name: start_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.JobOrder.DISPATCHED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /start on a REQUESTED job (not a valid from-state) fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Job created, still REQUESTED"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
          trigger:
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409)"
            - "JobOrder.${job1}.status remains REQUESTED and actual_start remains null"

      - name: confirm_cancelled_job_returns_already_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.JobOrder, "errors[ERR_ALREADY_TERMINAL]"]
        excluded_because:
          difficulty_instance: terminal_state_beats_weather_safety
          rationale: "The named §1.8 instance dispatches a CANCELLED job and asserts ERR_ALREADY_TERMINAL (priority 8), covering terminal lockdown."

      - name: pilot_booking_no_show_on_job_complete
        claim_type: side_effect_execution
        grounds: [state_machines.PilotBooking.CONFIRMED_to_NO_SHOW, state_machines.JobOrder.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "A CONFIRMED booking whose pilot never boarded flips to NO_SHOW when the job completes; a BOARDED booking would flip to COMPLETED instead."
        test_recipe:
          setup:
            - "Job dispatched with confirmed assignment and confirmed-but-never-boarded booking; clock at scheduled start"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { jv: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${jv}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_a}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
          trigger:
            - call: "POST /api/job-orders/${job1}/complete"
              payload: {}
              as: PortDispatcher
            - call: "GET /api/pilot-bookings/${pb1}"
              payload: {}
              as: PortDispatcher
              captures: { pb_status: $.data.status }
          assert:
            - "PilotBooking.${pb1}.status == NO_SHOW (was CONFIRMED, never BOARDED)"

      - name: amend_supersedes_confirmed_children
        claim_type: side_effect_execution
        grounds: [state_machines.JobOrder.CONFIRMED_to_REQUESTED]
        excluded_because:
          difficulty_instance: job_order_amend_cycle_and_weather_hold_cycle
          rationale: "The named §1.8 instance amends from CONFIRMED and asserts both children flip to SUPERSEDED."

      - name: incident_resolve_restores_tug_available
        claim_type: side_effect_execution
        grounds: [state_machines.Tug.AVAILABLE_to_OUT_OF_SERVICE, state_machines.Tug.OUT_OF_SERVICE_to_AVAILABLE, state_machines.Incident.REPORTED_to_RESOLVED]
        distinguishing_aspect: "A MAJOR incident drives the tug OUT_OF_SERVICE; resolving it with all-latest-PASSED inspections returns the tug to AVAILABLE (cyclic recovery)."
        test_recipe:
          setup: ["Tug Atlas AVAILABLE with a PASSED inspection; MAJOR incident reported by its captain"]
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/incidents"
              payload: { tug_id: "${tug_a}", incident_type: "GEAR_FAILURE", severity: "MAJOR", occurred_at: "2026-06-01T09:00:00Z", description: "Winch failure under load" }
              as: TugCaptain
              as_user_id: "${tug_a}"
              captures: { inc1: $.data.id }
            - call: "GET /api/tugs/${tug_a}"
              payload: {}
              as: MarineSurveyor
              captures: { tug_mid: $.data.operational_status }
          trigger:
            - call: "POST /api/incidents/${inc1}/resolve"
              payload: { resolution_notes: "Winch repaired and load-tested" }
              as: MarineSurveyor
              captures: { inc_status: $.data.status }
            - call: "GET /api/tugs/${tug_a}"
              payload: {}
              as: MarineSurveyor
              captures: { tug_end: $.data.operational_status }
          assert:
            - "After MAJOR incident: Tug.${tug_a}.operational_status == OUT_OF_SERVICE"
            - "Incident.${inc1}.status == RESOLVED"
            - "After resolve: Tug.${tug_a}.operational_status == AVAILABLE"

      - name: invoice_finalize_bubbles_job_to_invoiced
        claim_type: side_effect_execution
        grounds: [state_machines.JobOrder.COMPLETED_to_INVOICED]
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_standby_divergence
          rationale: "The named §1.8 instance asserts JobOrder.status == INVOICED after finalize."

      - name: board_before_dispatch_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.PilotBooking.CONFIRMED_to_BOARDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Boarding while the owning job is still CONFIRMED (not DISPATCHED/IN_PROGRESS) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Job CONFIRMED; booking CONFIRMED; job never dispatched"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
          trigger:
            - call: "POST /api/pilot-bookings/${pb1}/board"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409); PilotBooking.${pb1}.status remains CONFIRMED"

      - name: weather_hold_and_lift_resume_cycle
        claim_type: valid_transition
        grounds: [state_machines.JobOrder.DISPATCHED_to_ON_HOLD, state_machines.JobOrder.ON_HOLD_to_DISPATCHED]
        excluded_because:
          difficulty_instance: job_order_amend_cycle_and_weather_hold_cycle
          rationale: "The named §1.8 instance drives DISPATCHED -> ON_HOLD -> DISPATCHED and asserts both held and resumed states."

  - section: calculations
    instances:
      - name: standby_ceil_partial_block_bills_two_blocks
        claim_type: boundary_edge
        grounds: [calculations.standby_blocks, calculations.invoice_charge]
        distinguishing_aspect: "Standby 46 minutes -> billable 16 -> ceil(16/15) = 2 blocks -> 50000 cents; partial blocks round UP, not to nearest."
        test_recipe:
          setup:
            - "Standard job (base 500000, tug 120000/h x 2.0h = 240000), clock advanced to 08:46 before start"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", free_standby_minutes: 30, standby_block_minutes: 15, weather_surcharge_pct: 0 }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { jv: $.data.version }
            - call: "POST /api/gear-inspections"
