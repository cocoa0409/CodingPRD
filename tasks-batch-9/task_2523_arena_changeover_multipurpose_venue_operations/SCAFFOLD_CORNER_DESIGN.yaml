  # ---------------------------------------------------------------------------
  # errors — the claim-extraction guide sets no table for Table 6: the rule is
  # simply that EVERY error in the §1.4 catalog must be triggerable by some
  # instance. Coverage of the 48 catalog entries:
  #   this section          : ERR_UNAUTHENTICATED, all ten *_NOT_FOUND codes,
  #                           ERR_INVALID_LABOR_CALL_STATE, ERR_INVALID_ISSUE_STATE
  #   rbac section          : ERR_ROLE_NOT_PERMITTED, ERR_SEGREGATION_OF_DUTIES
  #   entities section      : ERR_INVALID_REQUEST, ERR_VENUE_SCOPE_MISMATCH
  #   state_machines section: ERR_INVALID_BOOKING_STATE, ERR_INVALID_ORDER_STATE,
  #                           ERR_INVALID_ICE_SHEET_STATE, ERR_INVALID_CHALLENGE_STATE,
  #                           ERR_INVALID_DOCK_RESERVATION_STATE
  #   validations section   : ERR_LABOR_CALL_SCOPE_INVALID, ERR_ICE_SHEET_ALREADY_PRESENT,
  #                           ERR_DEHUMIDIFICATION_INSUFFICIENT, ERR_FLOOR_PROTECTION_SHORTFALL,
  #                           ERR_BOOKING_TIME_CONFLICT, ERR_CREW_CAP_EXCEEDED,
  #                           ERR_DOCK_NUMBER_INVALID, ERR_ORDER_BOOKING_SEQUENCE_INVALID,
  #                           ERR_EQUIPMENT_UNITS_UNAVAILABLE, ERR_ANCHOR_HOLD_PROTECTED,
  #                           ERR_HOLD_PRIORITY_INSUFFICIENT, ERR_CHALLENGE_CREDITS_EXHAUSTED,
  #                           ERR_CHANGEOVER_DEBT_FREEZE, ERR_DUPLICATE_CHALLENGE,
  #                           ERR_TENANT_HOLD_QUOTA_EXCEEDED
  #   §1.8 instances        : ERR_TENANT_SCOPE_VIOLATION, ERR_STALE_VENUE_VERSION,
  #                           ERR_HOLD_EXPIRED, ERR_TURNAROUND_WINDOW_INSUFFICIENT,
  #                           ERR_INCOMING_BOOKING_NOT_CONFIRMED, ERR_ASSET_OUT_OF_SERVICE,
  #                           ERR_CONDENSATION_RISK_TOO_HIGH, ERR_ICE_EVENT_DEPENDENCY,
  #                           ERR_DOCK_WINDOW_CONFLICT, ERR_CHANGEOVER_WINDOW_CONFLICT,
  #                           ERR_RIGGING_CAPACITY_EXCEEDED  (stubbed below)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: a_request_missing_required_auth_headers_returns_unauthenticated
        claim_type: triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: "A POST /venues sent with no X-User-Role and no X-User-ID header returns 401 ERR_UNAUTHENTICATED before any field validation runs, so an otherwise-invalid body still produces the auth error and no venue row."
        test_recipe:
          setup:
            - "An empty database; the logical clock has been set once by the operations director."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
          trigger:
            - call: "POST /venues"
              payload: { name: "Headerless Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { err: $.data.error_id }
            - call: "POST /venues"
              payload: { rigging_capacity_kg: 20000 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { err2: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 401 with err == ERR_UNAUTHENTICATED and the standard error envelope carrying error_id, message and details"
            - "the second trigger call, whose body is also missing the required name field, still returns HTTP 401 with err2 == ERR_UNAUTHENTICATED and not 400 ERR_INVALID_REQUEST, because priority 10 precedes priority 30"
            - "no Venue row exists after either call"

      - name: every_not_found_code_in_the_catalog_is_triggerable_with_an_unknown_id
        claim_type: triggerable
        grounds:
          - validations[priority=40]
          - errors.ERR_VENUE_NOT_FOUND
          - errors.ERR_PROFILE_NOT_FOUND
          - errors.ERR_TENANT_NOT_FOUND
          - errors.ERR_BOOKING_NOT_FOUND
          - errors.ERR_CHALLENGE_NOT_FOUND
          - errors.ERR_CHANGEOVER_ORDER_NOT_FOUND
          - errors.ERR_ICE_SHEET_NOT_FOUND
          - errors.ERR_DOCK_RESERVATION_NOT_FOUND
          - errors.ERR_LABOR_CALL_NOT_FOUND
          - errors.ERR_EQUIPMENT_NOT_FOUND
        distinguishing_aspect: "Ten calls that each reference one unknown identifier return ten distinct 404 codes — venue, profile, tenant, booking, challenge, order, ice sheet, dock reservation, labor call and equipment asset — so no not-found code in the catalog is dead and none is substituted for another."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE exists so that the profile and tenant lookups happen inside a real venue rather than failing on the venue first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
