scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: terminal_creation_defaults_and_unique_code
        claim_type: creation
        grounds: [entities.Terminal]
        distinguishing_aspect: "POST /ltl/terminals applies default timezone and status=ACTIVE; duplicate code rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
          trigger:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Dup", dock_doors: 4 }, as: TerminalAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Terminal.${t_chi}.timezone == America/Chicago (default applied) and status == ACTIVE"
            - "Duplicate code rejected: ${err} == ERR_INVALID_REQUEST"

      - name: shipment_creation_system_fields_and_pro_minting
        claim_type: creation
        grounds: [entities.Shipment]
        distinguishing_aspect: "Server mints pro_number, sets rating_status=UNRATED and handling_status=TENDERED regardless of any client-supplied status fields."
        test_recipe:
          setup: ["Two ACTIVE terminals"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id, pro: $.data.pro_number } }
          assert:
            - "Shipment.${s_id}.pro_number matches 'PRO-' prefix (server-minted)"
            - "Shipment.${s_id}.rating_status == UNRATED and handling_status == TENDERED"
            - "Shipment.${s_id}.rated_amount_cents == 0 and chargeable_weight_lbs == 450 (pre-measurement default = actual_weight_lbs)"

      - name: shipment_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Shipment, "validations[priority=20]"]
        distinguishing_aspect: "Omitting actual_weight_lbs (input, no default) -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Two ACTIVE terminals"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: shipment_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Shipment.fields.nmfc_class]
        distinguishing_aspect: "nmfc_class not in the declared enum -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Two ACTIVE terminals"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_999", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: entity_get_not_found
        claim_type: not_found
        grounds: [entities.Shipment, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ltl/shipments/00000000-0000-0000-0000-000000000000", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: shipments_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Shipment]
        distinguishing_aspect: "List response carries pagination_fields with defaults limit=10, offset=0; response_type == array."
        test_recipe:
          setup: ["Two terminals, one shipment"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher }
          trigger:
            - { call: "GET /ltl/shipments", payload: {}, as: Dispatcher }
          assert:
            - "response contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array and data is a list of length 1"
            - "pagination fields limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: dimensioner_scan_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.DimensionerScan]
        distinguishing_aspect: "common_fields: false entity carries no version and exposes no update/delete endpoints; scans are append-only evidence."
        test_recipe:
          setup: ["Shipment exists"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_id}", measured_length_in: 60, measured_width_in: 48, measured_height_in: 50, measured_weight_lbs: 430 }, as: RatingClerk, captures: { scan_id: $.data.id } }
          assert:
            - "DimensionerScan.${scan_id} response has no version field (immutable log)"
            - "DimensionerScan.${scan_id}.scanned_by == the X-User-ID used for the call"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: rate_already_rated_shipment_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.UNRATED_to_RATED]
        distinguishing_aspect: "Second rate call on a RATED shipment fails; rating_status UNRATED is the only valid from-state."
        test_recipe:
          setup: ["Shipment rated once"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
          trigger:
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE and Shipment.${s_id}.rated_amount_cents == 13725 unchanged (CLASS_70 450 lbs no accessorials: linehaul 11250 + fuel 2475)"

      - name: cancel_manifested_shipment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Shipment.TENDERED_to_CANCELLED]
        distinguishing_aspect: "Cancel precondition 'no ACTIVE ManifestEntry' — cancelling a MANIFESTED shipment returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Shipment manifested onto a LOADING trailer"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 35, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_id}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
          trigger:
            - { call: "POST /ltl/shipments/${s_id}/cancel", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; Shipment.${s_id}.handling_status remains MANIFESTED"

      - name: dock_door_release_blocked_while_trailer_active
        claim_type: precondition_enforcement
        grounds: [state_machines.DockDoor.OCCUPIED_to_AVAILABLE]
        distinguishing_aspect: "Release precondition: an OutboundTrailer in LOADING/READY/SEALED at the door blocks release with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OUTBOUND door OCCUPIED by a LOADING trailer"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 36, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/dock-doors/${door_id}/reserve", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/dock-doors/${door_id}/occupy", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/dock-doors/${door_id}/release", payload: {}, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; DockDoor.${door_id}.status remains OCCUPIED"

      - name: terminal_state_lockdown_on_arrived_trailer
        claim_type: terminal_state_lockdown
        grounds: [state_machines.OutboundTrailer]
        distinguishing_aspect: "ARRIVED is terminal: void/reopen/mark-ready on an ARRIVED trailer all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Trailer fully dispatched and arrived"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 37, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s1}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-01T20:00:00Z", planned_arrival_utc: "2026-08-02T08:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/linehaul-legs/${leg1}/arrive", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/reopen", payload: {}, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; OutboundTrailer.${tr_id}.posture remains ARRIVED"

      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.PickupRoute, state_machines.DockDoor, state_machines.OutboundTrailer, state_machines.LinehaulLeg, state_machines.OsdCase, state_machines.SortationBatch]
        distinguishing_aspect: "Newly created entities start in PLANNED (route/leg), AVAILABLE (door), LOADING (trailer), OPEN (batch/case)."
        test_recipe:
          setup: ["Terminals and a door exist"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 38, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id } }
            - { call: "POST /ltl/sortation-batches", payload: { terminal_id: "${t_chi}", inbound_door_id: "${door_id}", destination_terminal_id: "${t_atl}" }, as: DockSupervisor, captures: { err_b: $.data.error_id } }
          assert:
            - "PickupRoute.${r_id}.status == PLANNED"
            - "OutboundTrailer.${tr_id}.posture == LOADING, DockDoor.${door_id}.status == AVAILABLE"
            - "SortationBatch creation on an OUTBOUND door rejected: ${err_b} == ERR_DOOR_KIND_MISMATCH"

      - name: idempotent_duplicate_complete_rejected
        claim_type: idempotency
        grounds: [state_machines.PickupStop.ARRIVED_to_PICKED_UP]
        distinguishing_aspect: "Completing the same stop twice: second call fails with ERR_INVALID_STATE; shipment stays ON_DOCK (no double-fire)."
        test_recipe:
          setup: ["Stop PICKED_UP once"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; Shipment.${s_id}.handling_status remains ON_DOCK"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: freight_rating_constants_applied_class_rates
        claim_type: constants_applied
        grounds: [calculations.freight_rating]
        distinguishing_aspect: "CLASS_100 at 200 lbs, no accessorials: linehaul = 2*3400 = 6800, fuel = round_half_up(6800*0.22) = 1496, total 8296."
        test_recipe:
          setup: ["Shipment CLASS_100 200 lbs"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_100", actual_weight_lbs: 200, length_in: 36, width_in: 36, height_in: 36, service_standard: "EXPEDITED" }, as: Dispatcher, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
          assert:
            - "Shipment.${s_id}.rated_amount_cents == 8296"

      - name: on_time_report_threshold_and_half_open_window
        claim_type: correct_result
        grounds: [calculations.on_time_performance]
        distinguishing_aspect: "Window is half-open [start,end) and on-time predicate is delivered_at <= committed (boundary inclusive); 95.0% exactly meets the standard."
        test_recipe:
          setup:
            - "Destination ATL; shipment tendered 2026-08-01T10:00:00Z GUARANTEED (commit 2026-08-02T10:00:00Z), delivered exactly at commitment"
          setup_api_calls:
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10, timezone: "UTC" }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 39, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "GUARANTEED" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s1}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-01T20:00:00Z", planned_arrival_utc: "2026-08-02T08:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ltl/linehaul-legs/${leg1}/arrive", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /ltl/terminals/${t_atl}/service-standard-reports", payload: { report_date: "2026-08-02" }, as: TerminalAdmin, captures: { rep_id: $.data.id } }
          assert:
            - "ServiceStandardReport.${rep_id}.shipments_due == 1 (commitment 2026-08-02T10:00:00Z inside [2026-08-02T00:00:00Z, 2026-08-03T00:00:00Z))"
            - "shipments_on_time == 1 (delivered exactly at commitment; <= is on time) and on_time_pct == 100.0, service_level_met == true"

      - name: input_set_filtering_excludes_cancelled_and_tendered
        claim_type: input_set_filtering
        grounds: [calculations.on_time_performance]
        distinguishing_aspect: "Shipments still TENDERED or CANCELLED with commitments inside the window are excluded from both numerator and denominator."
        test_recipe:
          setup: ["One shipment tendered but never picked up (still TENDERED) with commitment inside the report window"]
          setup_api_calls:
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10, timezone: "UTC" }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "GUARANTEED" }, as: Dispatcher, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /ltl/terminals/${t_atl}/service-standard-reports", payload: { report_date: "2026-08-02" }, as: TerminalAdmin, captures: { rep_id: $.data.id } }
          assert:
            - "ServiceStandardReport.${rep_id}.shipments_due == 0 (TENDERED excluded) and on_time_pct == 0.0, service_level_met == false"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: error_terminal_closed_on_shipment_tender
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_TERMINAL_CLOSED]"]
        distinguishing_aspect: "Tendering to a CLOSED origin terminal returns ERR_TERMINAL_CLOSED."
        test_recipe:
          setup: ["CHI closed; ATL active"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/terminals/${t_chi}/close", payload: {}, as: TerminalAdmin }
          trigger:
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TERMINAL_CLOSED"

      - name: error_route_not_dispatched_on_stop_arrive
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_ROUTE_NOT_DISPATCHED]"]
        distinguishing_aspect: "Arriving a stop while its route is PLANNED returns ERR_ROUTE_NOT_DISPATCHED."
        test_recipe:
          setup: ["Route PLANNED (never dispatched) with one stop"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
          trigger:
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ROUTE_NOT_DISPATCHED"

      - name: error_scan_shipment_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_SCAN_SHIPMENT_MISMATCH]"]
        distinguishing_aspect: "Inspection whose scan_id belongs to a different shipment returns ERR_SCAN_SHIPMENT_MISMATCH (business_referential)."
        test_recipe:
          setup: ["Two rated shipments; scan taken on shipment A"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 900, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/shipments/${s_a}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_b}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_a}", measured_length_in: 60, measured_width_in: 48, measured_height_in: 50, measured_weight_lbs: 430 }, as: RatingClerk, captures: { scan_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/inspections", payload: { shipment_id: "${s_b}", scan_id: "${scan_id}", claimed_nmfc_class: "CLASS_85" }, as: RatingClerk, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SCAN_SHIPMENT_MISMATCH"

      - name: error_leg_window_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_LEG_WINDOW_INVALID]"]
        distinguishing_aspect: "planned_arrival_utc equal to planned_departure_utc (not strictly after) returns ERR_LEG_WINDOW_INVALID."
        test_recipe:
          setup: ["Sealed trailer ready for leg planning"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 40, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T10:00:00Z", planned_arrival_utc: "2026-08-02T10:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_LEG_WINDOW_INVALID"

      - name: error_double_manifest_second_trailer_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", state_machines.Shipment.ON_DOCK_to_MANIFESTED]
        distinguishing_aspect: "Manifesting an already-MANIFESTED shipment onto a second trailer fails at the p5 state precondition (shipment no longer ON_DOCK) with ERR_INVALID_STATE; the shipment stays on its original trailer."
        test_recipe:
          setup: ["Shipment manifested on trailer T1; trailer T2 also LOADING to ATL"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 41, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_a: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 42, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_b: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_a}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_a: $.data.id, tr_a_v0: $.data.version } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_b}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_b: $.data.id, tr_b_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_a}/manifest-entries", payload: { shipment_id: "${s_id}", load_position: 1, expected_trailer_version: "${tr_a_v0}" }, as: DockSupervisor }
          trigger:
            - { call: "POST /ltl/trailers/${tr_b}/manifest-entries", payload: { shipment_id: "${s_id}", load_position: 1, expected_trailer_version: "${tr_b_v0}" }, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; Shipment.${s_id}.handling_status remains MANIFESTED on trailer ${tr_a}"

      - name: error_shipment_not_billable_before_delivery
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SHIPMENT_NOT_BILLABLE]"]
        distinguishing_aspect: "Billing a RATED but not-DELIVERED shipment returns ERR_SHIPMENT_NOT_BILLABLE."
        test_recipe:
          setup: ["Shipment rated, still TENDERED"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
          trigger:
            - { call: "POST /ltl/shipments/${s_id}/bill", payload: {}, as: RatingClerk, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SHIPMENT_NOT_BILLABLE"

      - name: error_body_fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Shipment tender with a random origin_terminal_id returns ERR_REFERENCE_NOT_FOUND (404), distinct from path-id 404."
        test_recipe:
          setup: ["One terminal exists"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
          trigger:
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "00000000-0000-0000-0000-000000000000", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REFERENCE_NOT_FOUND"

      - name: priority_auth_beats_business
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=20]"]
        distinguishing_aspect: "A request with no auth headers AND an invalid body returns ERR_UNAUTHENTICATED (p1 beats p20)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ltl/shipments", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: osd_case_create_side_effect_sets_hold
        claim_type: side_effect_execution
        grounds: [state_machines.OsdCase, entities.Shipment.fields.osd_hold]
        distinguishing_aspect: "POST /ltl/osd-cases side effect flips shipment.osd_hold to true immediately (visible on same-request GET)."
        test_recipe:
          setup: ["Rated shipment"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
          trigger:
