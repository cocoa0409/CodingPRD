              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_1: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_1}/issue"
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_1}/accept"
              as: ArtistRep
              as_user_id: "${artist_n}"
              captures: { bk: "$.data.id" }
            - call: "GET /festival-ops/bookings/${bk}"
              as: TalentBuyer
              captures: { bk_v_stale: "$.data.version" }
            - call: "POST /festival-ops/bookings/${bk}/cancel"
              payload: { cancelling_party: "PROMOTER", cancellation_reason: "Stage rebuild." }
              as: TalentBuyer
          trigger:
            - call: "PATCH /festival-ops/bookings/${bk}/guarantee-amendment"
              payload: { guarantee_cents: 9000000, expected_booking_version: "${bk_v_stale}", amendment_reason: "Stale and terminal at once." }
              as: TalentBuyer
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /festival-ops/bookings/${bk}"
              as: TalentBuyer
              captures: { bk_v_now: "$.data.version" }
            - call: "PATCH /festival-ops/bookings/${bk}/guarantee-amendment"
              payload: { guarantee_cents: 9000000, expected_booking_version: "${bk_v_now}", amendment_reason: "Fresh version, still terminal." }
              as: TalentBuyer
              captures: { e_state: "$.data.error_id" }
          assert:
            - "first call: HTTP 412 with error_id ERR_STALE_BOOKING_VERSION"
            - "first call: the error is neither ERR_INVALID_BOOKING_STATE nor ERR_GUARANTEE_CEILING_EXCEEDED"
            - "second call: data.contract_status == \"CANCELLED\""
            - "third call: HTTP 409 with error_id ERR_INVALID_BOOKING_STATE - with a fresh version priority 30 becomes the answer"
            - "third call: the error is still not ERR_GUARANTEE_CEILING_EXCEEDED, because 30 outranks 73"

      - name: state_outranks_fiscal_on_offer_revise
        claim_type: priority_ordering
        grounds:
          - validations[priority 30]
          - validations[priority 73]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_over_fiscal_on_offer_revise
          rationale: "That instance builds the ACCEPTED-offer-plus-broken-ceiling request and asserts ERR_OFFER_NOT_NEGOTIABLE, then isolates each rule on its own."

      - name: safety_outranks_referential_on_countersign
        claim_type: priority_ordering
        grounds:
          - validations[priority 40]
          - validations[priority 45]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_over_referential_on_countersign
          rationale: "That instance builds a RIDER_SETTLED booking with a BREACHED clause and no APPROVED packet and asserts ERR_RADIUS_BREACH_ACTIVE."

      - name: temporal_outranks_constraint_on_offer_issue
        claim_type: priority_ordering
        grounds:
          - validations[priority 50]
          - validations[priority 60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_over_constraint_on_offer_issue
          rationale: "That instance issues an offer that both overlaps a live slot and reuses the taken ordinal, asserting ERR_STAGE_SLOT_CONFLICT."

