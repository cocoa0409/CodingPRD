      - name: convene_below_quorum_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUORUM_NOT_MET]", state_machines.Meeting.NOTICED_to_IN_SESSION]
        distinguishing_aspect: "With a compliant EMERGENCY notice but only 1 of the required 2 members present, convene returns ERR_QUORUM_NOT_MET (isolated from the notice check)."
        test_recipe:
          setup: ["EMERGENCY meeting NOTICED with compliant lead; quorum_size 2; only m1 present."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body D2", jurisdiction_state: "AR", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room D2" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "D2", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_QUORUM_NOT_MET"

      - name: close_granted_with_balance_fee_outstanding
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEE_OUTSTANDING]", state_machines.RecordsRequest.GRANTED_to_CLOSED]
        distinguishing_aspect: "Closing a GRANTED request with fee_balance_cents > 0 (unpaid) returns ERR_FEE_OUTSTANDING (409)."
        test_recipe:
          setup: ["Request GRANTED with a 600-page released doc -> assessed 7750, unpaid."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Pia", email: "pia@example.com" }
              as: Anonymous
