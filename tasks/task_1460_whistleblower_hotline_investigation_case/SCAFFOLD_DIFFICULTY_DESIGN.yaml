            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-h1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Expense report PDF export", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-06T00:00:00Z", end_at: "2026-08-12T00:00:00Z", reason: "Pending litigation review" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { err_id: "$.data.error_id" } }
            - { call: "POST /hotline/legal-holds/${h1}/release", as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { d1_st: $.data.status } }
          assert:
            - "trigger[0]: err_id == ERR_LEGAL_HOLD_FREEZE; determination remains SUBMITTED (failed review leaves state unchanged)"
            - "trigger[2] after release (releaser off2 != placer off1): d1_st == APPROVED and case reaches CLOSURE_READY with a SENT notice"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_buffer_half_open_semantics
        grounds:
          - validations[priority=12]
          - errors[ERR_INTERVIEW_OVERLAP]
          - entities.Interview.fields.scheduled_start
        distinguishing_aspect: |
          Resource: investigator schedule; semantics: half-open intervals [start, end)
          plus a mandatory 15-minute buffer. A successor starting exactly 15 minutes after
          the previous end is allowed (gap >= 15), while 14 minutes is rejected.
        test_recipe:
          setup:
            - "Staff: intake, off1, inv; case UNDER_INVESTIGATION assigned to inv; existing SCHEDULED interview 2026-08-05T10:00:00Z-11:00:00Z"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-i1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}" }
          trigger:
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: SUBJECT, interviewee_identifier: "s-1", scheduled_start: "2026-08-05T11:15:00Z", scheduled_end: "2026-08-05T12:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv_ok: $.data.id, iv_ok_st: $.data.status } }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: REPORTER, interviewee_identifier: "r-1", scheduled_start: "2026-08-05T11:14:00Z", scheduled_end: "2026-08-05T11:45:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "trigger[0]: iv_ok_st == SCHEDULED (gap exactly 15 minutes satisfies >= 15 buffer)"
            - "trigger[1]: err_id == ERR_INTERVIEW_OVERLAP (gap 14 minutes < 15)"

      - name: legal_hold_closed_interval_touch
        grounds:
          - validations[priority=12]
          - errors[ERR_LEGAL_HOLD_OVERLAP]
          - entities.LegalHold.fields.start_at
        distinguishing_aspect: |
          Resource: HotlineCase hold timeline; semantics: closed inclusive intervals with
          zero buffer — a new hold whose start equals the existing hold's end touches it
          and is rejected, while one second later is accepted. Different interval
          geometry from the interview buffer rule (half-open + 15-minute buffer).
        test_recipe:
          setup:
            - "Staff: off1; one RECEIVED case; ACTIVE hold [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z] placed by off1"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-j1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z", reason: "First litigation hold" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-20T00:00:00Z", end_at: "2026-08-25T00:00:00Z", reason: "Touching second hold" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-20T00:00:01Z", end_at: "2026-08-25T00:00:00Z", reason: "Adjacent second hold" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { h3: $.data.id, h3_st: $.data.status } }
          assert:
            - "trigger[0]: err_id == ERR_LEGAL_HOLD_OVERLAP (closed intervals: 2026-08-20T00:00:00Z belongs to both)"
            - "trigger[1]: h3_st == ACTIVE (start one second after the inclusive end is disjoint)"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: activate_release_conserves_active_count
        grounds:
          - state_machines.CaseAssignment.CLEARED_to_ACTIVE
          - state_machines.CaseAssignment.ACTIVE_to_RELEASED
          - entities.StaffMember.fields.active_case_count
          - entities.StaffMember.fields.weighted_caseload
        distinguishing_aspect: |
          Conserved quantity: investigator capacity counters — invariant
          active_case_count == |assignments with status ACTIVE| and weighted_caseload ==
          sum of severity weights over the same set. Activate (+1 / +2 weighted on MEDIUM)
          followed by release restores both to zero with no drift.
        test_recipe:
          setup:
            - "Staff: intake, off1, invF (max_active_cases 5, zero load); case ASSIGNED to invF, screened CLEAR; triaged MEDIUM (FRAUD/STAFF/NONE/NONE = 35)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Fred Fresh", email: "fresh@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-m1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Fresh investigator" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
          trigger:
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1_st: $.data.status } }
            - { call: "GET /hotline/staff-members", payload: { employment_status: ACTIVE }, as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/assignments/${a1}/release", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1_st2: $.data.status } }
          assert:
            - "a1_st == ACTIVE: invF.active_case_count == 1 and weighted_caseload == 2 (MEDIUM weight)"
            - "a1_st2 == RELEASED: invF.active_case_count == 0 and weighted_caseload == 0 (forward + compensating action conserve the counters)"
            - "HotlineCase.${c1}.status == TRIAGED and assigned_investigator_id is null"

      - name: flag_dismiss_conserves_risk_score
        grounds:
          - state_machines.RetaliationFlag.OPEN_to_DISMISSED
          - calculations.retaliation_risk_score
          - entities.HotlineCase.fields.retaliation_risk_score
        distinguishing_aspect: |
          Conserved quantity: the case's retaliation risk score — invariant
          score == sum of weights of OPEN flags flagged within [now-90d, now]. Creating an
          HR_SIGNAL flag raises it to 2; dismissing that exact flag restores 0 with no drift
          (different conserved quantity than investigator capacity counters).
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; LOW case closed into MONITORING (reporter acknowledged)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: OTHER, description: "Allegation of minor policy lapse", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-n9", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Policy acknowledgement form", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "GET /hotline/cases/${c1}/closure-notices", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { n1: "$.data[0].id" } }
            - { call: "POST /hotline/closure-notices/${n1}/acknowledge", as: HotlineReporter, as_user_id: "${key1}" }
          trigger:
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: HR_SIGNAL, description: "Manager excluded reporter from meetings" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f1: $.data.id } }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { score_mid: $.data.retaliation_risk_score } }
            - { call: "POST /hotline/retaliation-flags/${f1}/dismiss", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f1_st: $.data.status } }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { score_end: $.data.retaliation_risk_score, st_end: $.data.status } }
          assert:
            - "score_mid == 2 after the HR_SIGNAL flag (forward action)"
            - "f1_st == DISMISSED and score_end == 0 (compensating action restores the invariant)"
            - "st_end == MONITORING (score 0 < 4, no escalation fired at any point)"
