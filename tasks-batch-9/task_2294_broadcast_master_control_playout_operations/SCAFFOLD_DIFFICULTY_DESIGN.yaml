      - name: asset_retract_cascades_three_hops_and_disarms_playlist
        grounds:
          - state_machines.Asset.QC_PASSED_to_RETRACTED
          - state_machines.PlaylistItem.CLEARED_to_BLOCKED
          - state_machines.Playlist.ARMED_to_IMPORTED
          - entities.Playlist.fields.armed_at_utc
          - calculations.spot_credit_settlement
          - entities.SpotOrder.fields.credited_spots
        distinguishing_aspect: |
          A different triggering transition (Asset QC_PASSED -> RETRACTED, not a
          transmitter power write) drives a three-link chain where each link is
          caused by the previous write: retraction blocks the commercial item's
          clearance axis, the blocked item forces the owning Playlist backwards
          ARMED -> IMPORTED and nulls armed_at_utc, and the blocked spot moves
          scheduled_spots -> credited_spots accruing round_half_up(1000/3) == 333
          cents; an implementation that only marks the asset RETRACTED leaves the
          playlist still ARMED and the order still at 0 cents.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), one ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1) still DARK with posture NORMAL — the cascade never needs the channel on air."
            - "SpotOrder ORD-4B on channel 12.1: ordered_spots 3, unit_duration_seconds 30, rate_cents_total 1000, so per_spot_rate_cents is the exact rational 1000/3 and round_half_up(1000/3) == 333."
            - "Two QC_PASSED assets: A (expected 1770 s) and X (expected 30 s), both scored 100."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s: seq 1 PROGRAM asset A 1770 s at 12:00:00Z, seq 2 COMMERCIAL asset X 30 s at 12:29:30Z linked to ORD-4B. Total 1800 s so projected_end_variance_seconds == 0."
            - "The playlist has been driven IMPORTED -> VALIDATED -> ARMED, so armed_at_utc is set, blocked_item_count == 0, both items are CLEARED, and SpotOrder.scheduled_spots == 1 with credit_accrued_cents == 0."
            - "The logical clock stands at 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
