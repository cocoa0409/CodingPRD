  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: officiant_double_booked_within_buffer
        grounds:
          - calculations.officiant_ceremony_overlap
          - validations[priority=9.5]
          - errors[ERR_OFFICIANT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Two ACCEPTED-bound returns for the SAME officiant whose ceremony instants are 30
          minutes apart (< OFFICIANT_BUFFER_MINUTES=60) collide: the second accept fails
          ERR_OFFICIANT_DOUBLE_BOOKED. Interval semantics: symmetric point-buffer with
          strict-< adjacency on the Officiant resource, distinct from the half-open license
          window overlap below.
        test_recipe:
          setup:
            - "Two ISSUED licenses for two distinct couples; one officiant. First return (ceremony 12:00) already ACCEPTED. Second return ceremony at 12:30 SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Dot Wye", date_of_birth: "1990-01-01", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { gA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Eli Yaw", date_of_birth: "1991-02-02", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { gB: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Fox Zed", date_of_birth: "1989-03-03", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { gC: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Gem Abe", date_of_birth: "1988-04-04", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { gD: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Wun", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { gofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${gA}", applicant_b_id: "${gB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { gap1: $.data.id }
            - call: "POST /applications/${gap1}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${gap1}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${gap1}/licenses"
              payload: {}
              as: Clerk
              captures: { glc1: "$.data[0].id" }
            - call: "POST /applications"
              payload: { applicant_a_id: "${gC}", applicant_b_id: "${gD}", ceremony_county: "Kern" }
              as: Clerk
              captures: { gap2: $.data.id }
            - call: "POST /applications/${gap2}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${gap2}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${gap2}/licenses"
              payload: {}
              as: Clerk
              captures: { glc2: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T13:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${glc1}", officiant_id: "${gofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${gofc}"
              captures: { grt1: $.data.id }
            - call: "POST /returns/${grt1}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /returns"
              payload: { license_id: "${glc2}", officiant_id: "${gofc}", ceremony_date: "2026-01-20T12:30:00Z" }
              as: Officiant
              as_user_id: "${gofc}"
              captures: { grt2: $.data.id }
          trigger:
            - call: "POST /returns/${grt2}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { gerr: $.data.error_id }
          assert:
            - "response error_id == ERR_OFFICIANT_DOUBLE_BOOKED"
            - "OfficiantReturn.${grt2}.status == SUBMITTED"
            - "OfficiantReturn.${grt1}.status == ACCEPTED"

      - name: applicant_concurrent_license_window_overlap
        grounds:
          - calculations.applicant_license_window_overlap
          - validations[priority=9.7]
          - errors[ERR_APPLICANT_LICENSE_OVERLAP]
        distinguishing_aspect: |
          Approving a second application that shares applicant gA, while gA already holds an
          ISSUED license whose [valid_from, expires_at) window overlaps the prospective new
          window, fails ERR_APPLICANT_LICENSE_OVERLAP. Interval semantics: half-open window
          overlap with per-applicant aggregate capacity 1 on the Applicant resource,
          distinct from the symmetric point-buffer on the Officiant above.
        test_recipe:
          setup:
            - "Applicant gA already on one APPROVED application -> ISSUED license (window starts 2026-01-13). A second UNDER_REVIEW application reuses gA with a fresh second party at the same clock, so windows overlap."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
