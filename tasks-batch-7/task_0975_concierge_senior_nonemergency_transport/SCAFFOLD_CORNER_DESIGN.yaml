  # ===========================================================================
  # From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Consistency is immediate: a GET issued right after creation returns every stored field with the same values in the same request sequence — no lag, no recompute delay."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "WALKER", assist_level_default: "DOOR_THROUGH_DOOR", home_zone: "north", address: "1 Main St", billing_hold_limit_cents: 12345 }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "GET /clients/${cli}", as: Coordinator, captures: { name: $.data.full_name, aid: $.data.mobility_aid, assist: $.data.assist_level_default, zone: $.data.home_zone, limit: $.data.billing_hold_limit_cents, st: $.data.status } }
          assert:
            - "GET returns full_name == Ada L, mobility_aid == WALKER, assist_level_default == DOOR_THROUGH_DOOR, home_zone == north, billing_hold_limit_cents == 12345, status == ACTIVE — identical to the POST response"
