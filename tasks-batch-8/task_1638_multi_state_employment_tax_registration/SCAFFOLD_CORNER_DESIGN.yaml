            - { call: "POST /etax/employees", payload: { employee_ref: "E-6007", full_name: "BH Five", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
