      - name: restricted_rent_clamps_at_the_exact_ceiling_and_at_the_exact_program_floor
        grounds:
          - calculations.restricted_rent_ceiling
          - entities.UnitRestriction.restricted_rent_cents
          - entities.UnitRestriction.imputed_household_size
          - endpoints[POST /unit-restrictions]
        distinguishing_aspect: |
          One-cent boundaries on both clamps of the SAME formula, holding
          household size (3), band (60) and utility allowance (12,000) fixed so
          the AMI-derived ceiling is exactly 109,500 for all five units: market
          109,500 ties the ceiling and market 109,499 is one cent under it, so
          min() must be inclusive on the tie; market 24,999 is lifted to exactly
          MIN_RENT_FLOOR_CENTS 25,000 while market 25,001 is left alone one cent
          above it, so max() must not fire on equality-or-above. An
          implementation that used < instead of <= in either clamp, or applied
          the floor before the caps, gets a different answer on at least one of
          the five units.
        test_recipe:
          setup:
            - "One developer and one project with total_units 5, total_floor_space_sqft 4250 and set_aside_election MIN_40_60, so the election ceiling percent is 60."
            - "Four RESTRICTED units are created first, all with bedroom_count 2 (imputed_household_size 3, AMI_100_ANNUAL_INCOME_CENTS 8,100,000), ami_percent 60, utility_allowance_cents 12,000 and floor_space_sqft 850."
            - "For that configuration annual_income_cents is 4,860,000, max_gross_rent_cents is floor(floor(4860000*30/100)/12) = 121,500 and the AMI-derived ceiling after the utility allowance is exactly 109,500."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Rent Boundary House", total_units: 5, total_floor_space_sqft: 4250, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 850, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u101_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 850, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 109500 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u102_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "103", bedroom_count: 2, floor_space_sqft: 850, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 109499 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u103_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "104", bedroom_count: 2, floor_space_sqft: 850, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 24999 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u104_id: $.data.id }
          trigger:
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "105", bedroom_count: 2, floor_space_sqft: 850, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 25001 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u105_id: $.data.id }
          assert:
            - "the trigger response is HTTP 201 with restricted_rent_cents == 25001 and imputed_household_size == 3"
            - "UnitRestriction.${u101_id}.restricted_rent_cents == 109500 (the AMI ceiling binds, market 150000 is above it)"
            - "UnitRestriction.${u102_id}.restricted_rent_cents == 109500 (market exactly equals the ceiling; the tie resolves to the same 109500)"
            - "UnitRestriction.${u103_id}.restricted_rent_cents == 109499 (market one cent under the ceiling binds instead)"
            - "UnitRestriction.${u104_id}.restricted_rent_cents == 25000 (the program floor lifts the answer above BOTH caps)"
            - "every one of the five units has status PROPOSED and Project.${proj_id}.restricted_unit_count == 5"
            - "Project.${proj_id}.applicable_fraction_bps == 10000 and set_aside_ratio_bps == 10000 and set_aside_satisfied == true"

