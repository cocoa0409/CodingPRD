      - name: storage_unit_create_with_invalid_unit_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.StorageUnit.fields.unit_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          unit_type is a closed enum {CONTAINER_AREA, TANK_SYSTEM, TEN_DAY_TRANSFER}; an out-of-domain
          value is refused at priority 4, i.e. before priority 33's inspection-frequency ceiling can
          be evaluated (that ceiling is keyed on the very field being rejected).
        test_recipe:
          setup:
            - "One facility"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /tsdf/storage-units"
              payload: { facility_id: "${fac_id}", unit_code: "CA-01", unit_type: "DRUM_ROW", permitted_capacity_kg: 20000.0, aisle_width_cm: 120.0, aisle_free_container_capacity: 4, inspection_frequency_days: 30, allowed_compatibility_classes: ["ORGANIC_SOLVENT"], air_emission_control_level: "LEVEL_2", containment_volume_l: 5000.0 }
