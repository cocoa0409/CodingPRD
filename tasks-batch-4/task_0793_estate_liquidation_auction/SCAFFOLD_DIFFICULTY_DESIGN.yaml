          assert:
            - "trigger POST /orders/${ob_id}/schedule-pickup returns 409 with error_id == ERR_PICKUP_OVERLAP"
            - "Order.${ob_id}.pickup_status == PENDING"
            - "PickupWindow.${wb_id}.booked_count == 0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_split_conserved_across_dispute_reversal
        grounds:
          - calculations.payout_split_invariant
          - state_machines.Estate.CLOSED_to_SETTLED
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
          - state_machines.Lot.SOLD_to_PASSED
        distinguishing_aspect: |
          Conserved quantity = settled gross money. Before the reversal
          seller_payout_cents + commission_cents == gross_sales_cents
          (6500 + 3500 == 10000). The buyer-favor dispute reversal decrements
          gross to 0 and re-derives both terms so 0 + 0 == 0 still holds — no
          drift in the payout split.
        test_recipe:
          setup:
            - "Estate: B1 wins L1 (hammer 10000), close, pay O1 (12690), settle (gross 10000, commission 3500, payout 6500)."
            - "B1 files dispute D on (O1, L1); Operator PATCH D->UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ep", seller_email: "ep@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l1_id}"
              payload: {}
              as: Operator
              captures: { l1v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l1_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${l1v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: {}
              as: Operator
              captures: { o1_id: "$.data[0].id" }
            - call: "POST /orders/${o1_id}/pay"
              payload: { amount_cents: 12690 }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${e_id}/settle"
              payload: {}
              as: Operator
            - call: "POST /disputes"
              payload: { order_id: "${o1_id}", lot_id: "${l1_id}", reason: "broken on arrival" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { d_id: $.data.id }
            - call: "PATCH /disputes/${d_id}"
              payload: { status: "UNDER_REVIEW" }
              as: Operator
          trigger:
            - call: "PATCH /disputes/${d_id}"
              payload: { status: "RESOLVED", outcome: "BUYER_FAVOR" }
              as: Operator
          assert:
            - "Estate.${e_id}.gross_sales_cents == 0"
            - "Estate.${e_id}.commission_cents == 0"
            - "Estate.${e_id}.seller_payout_cents == 0"
            - "invariant Estate.${e_id}.seller_payout_cents + Estate.${e_id}.commission_cents == Estate.${e_id}.gross_sales_cents"

      - name: window_booked_count_conserved_across_cancel
        grounds:
          - entities.PickupWindow.fields.booked_count
          - state_machines.Order.PENDING_to_SCHEDULED
          - state_machines.Order.SCHEDULED_to_PENDING
        distinguishing_aspect: |
          Conserved quantity = booking count. schedule-pickup increments
          booked_count by exactly 1 and the compensating cancel-pickup decrements
          by exactly 1, so booked_count == count(orders in SCHEDULED/PICKED_UP for
          the window) at all times — a COUNT invariant, distinct from the money
          split invariant. After schedule(+1) then cancel(-1) booked_count == 0.
        test_recipe:
          setup:
            - "Estate: B1 wins L1 (hammer 10000) -> order O1 total 12690, PAID."
            - "Window W capacity 5; O1 scheduled into W (booked_count 1)."
          setup_api_calls:
