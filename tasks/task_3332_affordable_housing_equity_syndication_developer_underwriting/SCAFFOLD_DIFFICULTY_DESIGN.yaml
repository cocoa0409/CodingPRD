            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Investor
              captures: { fund_v_now: $.data.version, fund_status_now: $.data.status }
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 60000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.5 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.5 }], expected_fund_version: "${fund_v_now}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SUBSCRIPTION_EXCEEDS_CAPACITY"
            - "the response error_id is NOT ERR_SUBSCRIPTION_WINDOW_CLOSED"
            - "Investor.${inv_id}.outstanding_commitment_cents == 460000000"

  - rule_id: boundary_precision_check
    instances:

