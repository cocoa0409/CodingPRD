              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/capital-budgets/${budget_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/capital-budgets/${budget_id}/lock"
