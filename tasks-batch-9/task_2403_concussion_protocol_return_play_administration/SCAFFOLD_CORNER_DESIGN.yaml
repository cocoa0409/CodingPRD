      - name: respond_to_open_audit_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ProtocolAudit.FINDINGS_ISSUED_to_CLUB_RESPONDED
          - errors.ERR_AUDIT_STATE_INVALID
        distinguishing_aspect: "A club can only respond once findings exist: responding to an OPEN audit returns ERR_AUDIT_STATE_INVALID (409) and response_round_count stays 0."
        test_recipe:
          setup: ["An audit opened against Harbor City by auditor-a, still OPEN"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - &k_audit_open
              call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit_id}/respond"
              payload: { response_note: "we dispute the premise" }
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
          assert:
            - "response status 409 with error_id ERR_AUDIT_STATE_INVALID"
            - "ProtocolAudit.${audit_id}.status == OPEN and response_round_count == 0"
            - "Club.${club_h_id}.compliance_score == 100"

      - name: third_club_response_exhausts_audit_rounds
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProtocolAudit.FINDINGS_ISSUED_to_CLUB_RESPONDED
          - constants.MAX_AUDIT_RESPONSE_ROUNDS
          - errors.ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED
        distinguishing_aspect: "MAX_AUDIT_RESPONSE_ROUNDS is 2: after two response/re-findings cycles a third response returns ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED (409) with response_round_count frozen at 2."
        test_recipe:
          setup: ["An audit on Harbor City that has already gone through two response rounds and is FINDINGS_ISSUED for the third time"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_audit_open
            - &k_findings_late
              call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["LATE_INJURY_REPORT"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "POST /concussion-program/protocol-audits/${audit_id}/respond"
              payload: { response_note: "round one response" }
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
            - *k_findings_late
            - call: "POST /concussion-program/protocol-audits/${audit_id}/respond"
              payload: { response_note: "round two response" }
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
            - *k_findings_late
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit_id}/respond"
              payload: { response_note: "round three response" }
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
          assert:
            - "response status 409 with error_id ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED"
            - "ProtocolAudit.${audit_id}.status == FINDINGS_ISSUED and response_round_count == 2"
            - "ProtocolAudit.${audit_id}.assessed_fine_cents == 1500000"
            - "Club.${club_h_id}.compliance_score == 94 and outstanding_fine_cents == 1500000"

      - name: invalidating_baseline_test_twice_rejected
        claim_type: invalid_transition
        grounds:
