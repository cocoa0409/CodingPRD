  - rule_id: boundary_precision_check
    instances:

      - name: composite_score_rounds_half_up_at_the_inclusive_pass_floor
        grounds:
          - calculations.diligence_composite_score
          - validations[priority=57]
          - state_machines.DiligenceReview.SUBMITTED_to_PASSED
          - entities.Partner.fields.capability_tier
        distinguishing_aspect: |
          Metric under test is composite_score at the DILIGENCE_PASS_FLOOR of
          55.0 on POST /oversight/diligence-reviews/{id}/decide: partner A's
          weighted sum is exactly 55.00 and must be ACCEPTED because the floor is
          inclusive, while partner B's weighted sum is 54.45, which
          ROUND_HALF_UP lifts to 54.5 (banker's rounding would give 54.4) and
          which must still be REFUSED because 54.5 < 55.0 - so the instance pins
          both the inclusive comparison and the half-up tie direction of the
          rounding step itself.
        test_recipe:
          setup:
            - "One OPEN cycle. Two PROSPECT partners with end_user_account_count = 0, so both reviews are INITIAL and effective_complaint_history_score equals the submitted complaint_history_score."
            - "Partner A: 60 / 60 / 60 / 35 -> 60*0.20 + 60*0.25 + 60*0.35 + 35*0.20 = 12.00 + 15.00 + 21.00 + 7.00 = 55.00 exactly; compliance_capability 60 also exactly meets its own inclusive floor."
            - "Partner B: 60 / 58 / 61 / 33 -> 12.00 + 14.50 + 21.35 + 6.60 = 54.45; ROUND_HALF_UP to one decimal = 54.5."
            - "Both are submitted by po_1 and decided by co_1 so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Threshold Pay A Inc", business_model: "PAYMENT_FACILITATION", funding_stage: "SERIES_A", months_runway: 14, disclosed_complaints_per_10k: 20.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_id: "$.data.id", a_v1: "$.data.version" }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Threshold Pay B Inc", business_model: "PAYMENT_FACILITATION", funding_stage: "SERIES_A", months_runway: 14, disclosed_complaints_per_10k: 20.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_id: "$.data.id", b_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${a_id}", review_type: "INITIAL", business_model_score: 60, funding_score: 60, compliance_capability_score: 60, complaint_history_score: 35, expected_partner_version: "${a_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_dr: "$.data.id" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${b_id}", review_type: "INITIAL", business_model_score: 60, funding_score: 58, compliance_capability_score: 61, complaint_history_score: 33, expected_partner_version: "${b_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_dr: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${a_dr}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_comp: "$.data.composite_score", a_tier: "$.data.tier" }
            - call: "POST /oversight/diligence-reviews/${b_dr}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_comp: "$.data.composite_score", b_tier: "$.data.tier" }
          trigger:
            - call: "POST /oversight/diligence-reviews/${a_dr}/decide"
              payload: { outcome: "PASSED", decision_note: "exactly at floor" }
              as: ComplianceOfficer
              as_user_id: co_1
              captures: { a_status: "$.data.status" }
            - call: "POST /oversight/diligence-reviews/${b_dr}/decide"
              payload: { outcome: "PASSED", decision_note: "one tick under" }
              as: ComplianceOfficer
              as_user_id: co_1
          assert:
            - "${a_comp} == 55.0   # exactly the inclusive floor, no rounding needed"
            - "${a_tier} == TIER_3   # 55.0 >= TIER_3_FLOOR 55"
            - "${a_status} == PASSED   # accepted at exact equality"
            - "${b_comp} == 54.5   # 54.45 rounded HALF_UP, not 54.4"
            - "${b_tier} == UNRATED   # 54.5 < 55"
            - "the ${b_dr} decide call responds 422 with error_id ERR_DILIGENCE_SCORE_BELOW_FLOOR"
            - "DiligenceReview.${b_dr}.status == SUBMITTED"
            - "Partner.${a_id}.status == DILIGENCE_PASSED and Partner.${a_id}.capability_tier == TIER_3"
            - "Partner.${a_id}.latest_composite_score == 55.0"
            - "Partner.${b_id}.status == IN_DILIGENCE and Partner.${b_id}.capability_tier == UNRATED"
            - "Partner.${b_id}.latest_composite_score == 54.5"

