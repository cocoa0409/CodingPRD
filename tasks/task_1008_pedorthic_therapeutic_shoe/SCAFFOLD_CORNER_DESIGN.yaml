  # ---------------- Cross-Cutting Complexity Layers ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_customer_version_on_second_certification
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cert-create-stale-customer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential cert creates both carrying expected_customer_version = the original v1: the first succeeds and bumps Customer.version to 2, the second (still v1) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A Medicare customer at version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Occ Cust", date_of_birth: "1946-06-06", medicare_beneficiary_id: "5EF6GH7IJ88" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "5050505050", prescribing_practitioner_npi: "6060606060", statement_date: "2026-06-01", in_person_visit_date: "2026-05-01", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert1_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "5050505050", prescribing_practitioner_npi: "6060606060", statement_date: "2026-06-05", in_person_visit_date: "2026-05-05", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_correct_version_second_certification_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cert-create-stale-customer]", "state_machines.Certification.COMPLETE_to_SUPERSEDED"]
        distinguishing_aspect: "Re-reading Customer.version==2 after cert1 and passing it lets cert2 succeed and supersede cert1 (cert1 -> SUPERSEDED)."
        test_recipe:
          setup: ["A Medicare customer with one COMPLETE certification (customer now version 2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Occ2 Cust", date_of_birth: "1947-07-07", medicare_beneficiary_id: "6GH7IJ8KL99" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "7070707070", prescribing_practitioner_npi: "8080808080", statement_date: "2026-06-01", in_person_visit_date: "2026-05-01", expected_customer_version: "${cust_v0}" }
              as: BillingSpecialist
              captures: { cert1_id: $.data.id }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cust_v1: $.data.version }
          trigger:
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "7070707070", prescribing_practitioner_npi: "8080808080", statement_date: "2026-06-10", in_person_visit_date: "2026-05-10", expected_customer_version: "${cust_v1}" }
              as: BillingSpecialist
              captures: { cert2_id: $.data.id }
          assert:
            - "Certification.${cert1_id}.status == SUPERSEDED"
            - "Certification.${cert2_id}.status == COMPLETE"

      - name: version_increments_on_certification_create
        claim_type: optimistic_concurrency
        grounds: [entities.Customer.fields.version]
        distinguishing_aspect: "Customer.version advances 1 -> 2 after exactly one certification create (write bumps version)."
        test_recipe:
          setup: ["A Medicare customer at version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Ver Cust", date_of_birth: "1948-08-08", medicare_beneficiary_id: "7IJ8KL9MN00" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "9090909090", prescribing_practitioner_npi: "1212121212", statement_date: "2026-06-01", in_person_visit_date: "2026-05-01", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingSpecialist
              captures: { cust_v_after: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 2"

      - name: derived_deductible_reconciled_after_paid_claim
        claim_type: derived_field_reconciliation
        grounds: [entities.Customer.fields.medicare_deductible_remaining_cents, state_machines.MedicareClaim.SUBMITTED_to_PAID]
        distinguishing_aspect: "After a PAID A5500 claim that applies 25700 deductible, Customer.medicare_deductible_remaining_cents reconciles from 25700 to 0."
        test_recipe:
          setup: ["Clock 2026-07-01; A5500 allowable 30000 fulfilled sale, COMPLETE cert; claim submitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Ded Shoe", brand: "Apex", category: "DIABETIC", base_price_cents: 32000, medicare_allowable_cents: 30000, hcpcs_code: "A5500" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "DD", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ded Cust", date_of_birth: "1941-01-01", medicare_beneficiary_id: "8KL9MN0OP11" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fitters"
              payload: { full_name: "Ded Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "1313131313", prescribing_practitioner_npi: "1414141414", statement_date: "2026-06-01", in_person_visit_date: "2026-05-01", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /medicare-claims"
              payload: { customer_id: "${cust_id}", sale_id: "${sale_id}", certification_id: "${cert_id}", hcpcs_code: "A5500", billed_amount_cents: 32000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /medicare-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "PAID" }
              as: BillingSpecialist
          assert:
            - "Customer.${cust_id}.medicare_deductible_remaining_cents == 0"
            - "Customer.${cust_id}.medicare_pairs_claimed_ytd == 1"

  # ---------------- Consistency model ----------------
  - section: consistency_model
    instances:
      - name: special_order_cancel_deposit_credit_visible_immediately
        claim_type: immediate
        grounds: [state_machines.SpecialOrder.ORDERED_to_CANCELLED, entities.Customer.fields.loyalty_points_balance]
        distinguishing_aspect: "Cancelling an ORDERED special order with deposit 3000 immediately reflects a +30 ADJUST credit in the same customer's loyalty_points_balance on the next read."
        test_recipe:
          setup: ["An ORDERED special order with deposit 3000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Dep Shoe", brand: "X", category: "REGULAR", base_price_cents: 9000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dep Cust", date_of_birth: "1963-03-03" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", requested_size: 10.0, requested_width: "D", deposit_cents: 3000 }
              as: StoreManager
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/place"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /special-orders/${so_id}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "SpecialOrder.${so_id}.status == CANCELLED"
            - "Customer.${cust_id}.loyalty_points_balance == 30"

  # ---------------- Excluded (already covered by §1.8) ----------------
  - section: calculations
    instances:
      - name: loyalty_accrual_rounding_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.loyalty_points_accrual]
        excluded_because:
          difficulty_instance: combinatorial_formula / loyalty_round_per_line_then_sum
          rationale: "Round-per-line-then-sum accrual (176) is asserted by the named §1.8 instance."
      - name: medicare_final_reimbursement_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: [calculations.medicare_final_reimbursement, calculations.medicare_provisional_reimbursement]
        excluded_because:
          difficulty_instance: dual_variant_calc / medicare_provisional_vs_final_reimbursement
          rationale: "Provisional-vs-final divergence is asserted by the named §1.8 instance."
  - section: state_machines
    instances:
      - name: recall_issue_cascade_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds: [state_machines.Recall.DRAFT_to_ISSUED]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_issue_quarantine_cancel_deposit_chain
          rationale: "The recall quarantine/cancel/deposit cascade is asserted by the named §1.8 instance."
