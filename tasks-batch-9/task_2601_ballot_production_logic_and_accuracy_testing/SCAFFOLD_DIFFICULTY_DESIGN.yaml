              as: BallotCoordinator
              captures: { job: $.data.id }
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T08:00:00Z", press_window_end: "2026-08-13T08:00:00Z", expected_ballot_style_version: "${st_v}" }
