scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: score_normalization_z_vs_minmax_diverge
        grounds:
          - calculations.normalized_score_per_sheet
          - calculations.project_aggregate
          - entities.ScoreSheet.fields.normalized_score
        distinguishing_aspect: |
          Identical raw scores under Z_SCORE vs MIN_MAX produce different per-sheet
          normalized_score values and different project final_aggregate values:
          PA aggregates -0.33 (z) vs 0.33 (min-max); the variant is selected by the
          parent FairEdition.normalization_algorithm, i.e. the ScoreSheet/Project
          entity domain.
        test_recipe:
          setup:
            - "Two editions: EZ with normalization_algorithm=Z_SCORE, EM with MIN_MAX, both max_judges_per_project=2, min_quorum_ratio_pct=50"
            - "Each edition has one OPEN category, registration opened then closed with two CONFIRMED projects that PASSED inspection"
            - "Each project judged by two ACTIVE judges with raw scores J1: PA=70/PB=90, J2: PA=88/PB=100 (identical raw data in both editions)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Z Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ez_id: $.data.id }
            - call: "POST /science-fair/fair-editions"
              payload: { name: "M Edition", normalization_algorithm: "MIN_MAX", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { em_id: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ez_id}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cz_id: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${em_id}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cm_id: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor One", email: "m1@x.com" }
              as: FairDirector
              captures: { mentor1: $.data.id }
            - call: "POST /science-fair/fair-editions/${ez_id}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/fair-editions/${em_id}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ez_id}", category_id: "${cz_id}", title: "PA-Z", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mentor1}"
              captures: { paz_id: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ez_id}", category_id: "${cz_id}", title: "PB-Z", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mentor1}"
              captures: { pbz_id: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${em_id}", category_id: "${cm_id}", title: "PA-M", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mentor1}"
              captures: { pam_id: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${em_id}", category_id: "${cm_id}", title: "PB-M", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mentor1}"
              captures: { pbm_id: $.data.id }
            - call: "POST /science-fair/projects/${paz_id}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mentor1}"
            - call: "POST /science-fair/projects/${pbz_id}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mentor1}"
            - call: "POST /science-fair/projects/${pam_id}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mentor1}"
            - call: "POST /science-fair/projects/${pbm_id}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mentor1}"
            - call: "POST /science-fair/fair-editions/${ez_id}/close-registration"
