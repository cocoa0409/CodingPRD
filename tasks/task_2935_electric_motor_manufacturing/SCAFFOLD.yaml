      - "GET /rotor-builds/{id}"
      - "GET /rotor-builds"
      - "GET /assembly-records/{id}"
      - "GET /assembly-records"
      - "GET /performance-tests/{id}"
      - "GET /performance-tests"
      - "GET /test-cells/{id}"
      - "GET /test-cells"
    note: "Stored as StatorBuild.surge_tester_user_id and PerformanceTest.test_engineer_user_id; the certification separation compares test_engineer_user_id to the certifier's X-User-ID."
  - name: QualityCertifier
    description: "Issues and revokes nameplate certificates against the governing regulatory standard."
