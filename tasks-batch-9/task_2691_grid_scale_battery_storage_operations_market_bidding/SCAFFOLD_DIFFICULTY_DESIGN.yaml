# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
# domain: grid-scale-battery-storage-operations   (task_2691)
#
# 9 rule_ids x >= 2 differentiated instances. Every numeric assert literal below
# was produced by executing the referenced calculations[].formula with its
# declared constants under Decimal/ROUND_HALF_UP.
#
# Reference fixtures used by the chains (all created through §1.5 endpoints):
#   A1 "Mesa Verde BESS 1"   nameplate 100.0 / power 25.0 / POI 25.0 MW, 27.5 MVA
#                            RTE 88.0 / floor 10% / ceiling 95% / soc 80.0
#                            degradation 12.00 / warranty throughput 40000.0
#                            COD 2023-08-01 / cycle limit 365
#                            => rated 100.0, available 100.0, floor_mwh 10.0,
#                               usable 80.0, free_dispatchable 70.0
#   A2 = A1 + initial_cumulative_throughput_mwh 34000.0
#                            => efc_ytd 170.0, scarcity tier 1.25, knee adder 5.6
#   A4 = A1 + warranty_throughput_limit_mwh 200.0
#                + initial_cumulative_throughput_mwh 80.0
#                            => throughput ratio 0.4 now, 0.85 after a 90.0 MWh test
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: dispatch_performance_provisional_versus_settled_score
        grounds:
          - calculations.dispatch_performance_score
          - state_machines.DispatchInstruction.scoring_status.PROVISIONAL_to_SETTLED
          - entities.DispatchInstruction.fields.composite_score
          - entities.DispatchInstruction.fields.non_performance_charge_usd
          - endpoints[POST /dispatch-instructions/{id}/settle-score]
        distinguishing_aspect: |
          Dual variant on the DispatchInstruction domain (ancillary performance scoring): the
          PROVISIONAL variant averages only samples with sampled_at <= setpoint_end and forces
          non_performance_charge_usd to 0.00, while the SETTLED variant admits the late 15:10Z
          sample and therefore returns composite_score 74.28 instead of 91.10 and a charge of
          57.60 instead of 0.00 from byte-identical stored telemetry.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 registered and commissioned (market_state AVAILABLE, safety_state NORMAL)"
            - "SocReservation 40.0 MWh, purpose ENERGY_ARBITRAGE, window 2026-08-10T12:00:00Z .. 20:00:00Z"
            - "DAY_AHEAD ENERGY DISCHARGE bid, 20.0 MW, delivery 12:00:00Z .. 16:00:00Z, CLEARED at 45.00 for 20.0 MW"
            - "DispatchInstruction instructed_mw 20.0, setpoint 14:00:00Z .. 15:00:00Z, EXECUTING"
            - "four on-time telemetry samples at 14:15Z/14:30Z/14:45Z/15:00Z measuring 19.6, 20.4, 19.2, 20.0 MW"
            - "instruction COMPLETED, so scoring_status is PROVISIONAL"
            - "one late telemetry sample at 15:10Z measuring 2.0 MW, appended after completion"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { a1_v: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${a1_v}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id, b1_price: $.data.offer_price_usd_per_mwh }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 19.6, measured_mvar: 0.0, soc_mwh_reading: 75.1, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 20.4, measured_mvar: 0.0, soc_mwh_reading: 70.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 3, sampled_at: "2026-08-10T14:45:00Z", measured_mw: 19.2, measured_mvar: 0.0, soc_mwh_reading: 65.2, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 4, sampled_at: "2026-08-10T15:00:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 60.2, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /dispatch-instructions/${d1}/complete"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { prov_accuracy: $.data.accuracy_score, prov_deadband: $.data.deadband_pct, prov_composite: $.data.composite_score, prov_charge: $.data.non_performance_charge_usd, prov_delivered: $.data.delivered_mwh }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 5, sampled_at: "2026-08-10T15:10:00Z", measured_mw: 2.0, measured_mvar: 0.0, soc_mwh_reading: 59.7, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
          trigger:
            - call: "POST /dispatch-instructions/${d1}/settle-score"
              payload: {}
              as: MarketOperator
              captures: { settled_composite: $.data.composite_score, settled_charge: $.data.non_performance_charge_usd }
          assert:
            - "PROVISIONAL variant (captured at completion): ${prov_accuracy} == 98.00, ${prov_deadband} == 75.00, ${prov_composite} == 91.10, ${prov_charge} == 0.00"
            - "PROVISIONAL delivered_mwh: ${prov_delivered} == 19.8 (four on-time samples x 0.25 h, the 15:10Z sample excluded)"
            - "SETTLED variant: DispatchInstruction.${d1}.accuracy_score == 80.40"
            - "SETTLED variant: DispatchInstruction.${d1}.deadband_pct == 60.00"
            - "SETTLED variant: ${settled_composite} == 74.28, strictly below the PROVISIONAL 91.10"
            - "SETTLED variant: ${settled_charge} == 57.60 == round(max(0, 75.00 - 74.28) * 20.0 * 4.00, 2)"
            - "DispatchInstruction.${d1}.scoring_status == SETTLED and execution_status == COMPLETED (the two axes moved independently)"
            - "DispatchInstruction.${d1}.telemetry_sample_count == 5"

      - name: capacity_obligation_preliminary_versus_final_penalty
        grounds:
          - calculations.capacity_obligation_assessment
          - entities.CapacityObligation.fields.penalty_exposure_usd
          - entities.CapacityObligation.fields.assessment_mode
          - state_machines.CapacityObligation.ACTIVE_to_SHORTFALL
          - endpoints[POST /capacity-obligations/{id}/assess]
        distinguishing_aspect: |
          Dual variant on the CapacityObligation domain (availability settlement), a different
          entity and metric from the DispatchInstruction score: with unavailable_hours frozen at
          120.0 and the clock at 2026-08-06, PRELIMINARY pro-rates the 8600 h requirement to
          5112.88 h over the 5208 elapsed hours and bills 22392.00 with status SHORTFALL, while
          FINAL measures the same 120.0 h against 8760 h, finds zero shortfall, and returns
          penalty_exposure_usd 0.00 with status FULFILLED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-06T00:00:00Z (5208 hours after 2026-01-01T00:00:00Z)"
            - "A1 registered and commissioned"
            - "CapacityObligation for program_year 2026: committed_mw 20.0, availability_hours_required 8600.0, penalty_rate_usd_per_mw_hour 45.00"
            - "120.0 unavailable hours accrued through the unavailability endpoint, no assessment yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "ISO Capacity Auction", program_year: 2026, committed_mw: 20.0, availability_hours_required: 8600.0, penalty_rate_usd_per_mw_hour: 45.00 }
              as: AssetManager
              captures: { o1: $.data.id }
            - call: "POST /capacity-obligations/${o1}/unavailability"
              payload: { unavailable_hours_delta: 120.0, reason: "FORCED_OUTAGE" }
              as: ControlRoomOperator
              captures: { o1_unavail: $.data.unavailable_hours }
          trigger:
            - call: "POST /capacity-obligations/${o1}/assess"
              payload: { mode: "PRELIMINARY" }
              as: MarketOperator
              captures: { prelim_pct: $.data.availability_pct, prelim_shortfall: $.data.shortfall_hours, prelim_penalty: $.data.penalty_exposure_usd, prelim_status: $.data.status }
            - call: "POST /capacity-obligations/${o1}/assess"
              payload: { mode: "FINAL" }
              as: MarketOperator
              captures: { final_pct: $.data.availability_pct, final_shortfall: $.data.shortfall_hours, final_penalty: $.data.penalty_exposure_usd, final_status: $.data.status }
          assert:
            - "${o1_unavail} == 120.0 and the unavailability call left availability_pct, shortfall_hours and penalty_exposure_usd untouched (0.0 / 0.0 / 0.0)"
            - "PRELIMINARY: measured_available_hours == 5088.00, ${prelim_pct} == 97.70, required_hours_scaled == 5112.88, ${prelim_shortfall} == 24.88"
            - "PRELIMINARY: ${prelim_penalty} == 22392.00 == round(20.0 * 45.00 * 24.88 * 1.0, 2) and ${prelim_status} == SHORTFALL"
            - "FINAL: measured_available_hours == 8640.00, ${final_pct} == 98.63, ${final_shortfall} == 0.00"
            - "FINAL: ${final_penalty} == 0.00 and ${final_status} == FULFILLED — the same 120.0 stored unavailable hours"
            - "CapacityObligation.${o1}.assessment_mode == FINAL after the second trigger call"
            - "CapacityObligation.${o1}.unavailable_hours == 120.0 — neither assessment mutates the accrual"

  - rule_id: combinatorial_formula
    instances:
      - name: bid_floor_price_nonlinear_tier_knee_and_direction_branch
        grounds:
          - calculations.bid_floor_price
          - entities.MarketBid.fields.offer_price_usd_per_mwh
          - entities.StorageAsset.fields.equivalent_full_cycles_ytd
          - endpoints[POST /market-bids]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the cycle-scarcity tier selected from
          efc_headroom (195 -> 1.25), the max()-gated warranty knee (ratio 0.85 -> adder 5.6), the
          product factor table and the DISCHARGE/CHARGE branch that flips the wear terms from
          additive to subtractive inside a max(0, ...). On one asset A2 the same 20.0 MW 4-hour
          offer prices at 45.60 discharging and 4.40 charging, and a 12.0 MW SPIN offer with a
          3.00 adder prices at 28.08 — three different answers from one formula.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A2 registered and commissioned with initial_cumulative_throughput_mwh 34000.0, so equivalent_full_cycles_ytd is 170.0, efc_headroom is 195.0 (tier 1.25) and the throughput ratio is 0.85 (above the 0.5 knee)"
            - "SocReservation 40.0 MWh, ENERGY_ARBITRAGE, window 2026-08-10T12:00:00Z .. 20:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 2", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 34000.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a2: $.data.id, a2_efc: $.data.equivalent_full_cycles_ytd }
            - call: "POST /storage-assets/${a2}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { a2_v: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a2}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${a2_v}" }
              as: MarketTrader
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${a2}", reservation_id: "${r2}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b_dis: $.data.id, p_dis: $.data.offer_price_usd_per_mwh, e_dis: $.data.expected_energy_mwh, c_dis: $.data.cycle_debit_efc }
            - call: "POST /market-bids"
              payload: { asset_id: "${a2}", reservation_id: "${r2}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "CHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b_chg: $.data.id, p_chg: $.data.offer_price_usd_per_mwh }
            - call: "POST /market-bids"
              payload: { asset_id: "${a2}", reservation_id: "${r2}", market_type: "REAL_TIME", product: "SPIN", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 12.0, price_adder_usd_per_mwh: 3.00 }
              as: MarketTrader
              captures: { b_spin: $.data.id, p_spin: $.data.offer_price_usd_per_mwh }
          assert:
            - "${a2_efc} == 170.0 so efc_headroom is 195.0 and the scarcity tier is 1.25 (degradation term 15.0000, not 12.0000)"
            - "${p_dis} == 45.60 == round((25.0000 + 15.0000 + 5.6000) * 1.00 + 0.0, 2)"
            - "${e_dis} == 80.0 and ${c_dis} == 0.4 (80.0 / (2 * 100.0 available energy))"
            - "${p_chg} == 4.40 == round(max(0, 25.0000 - 15.0000 - 5.6000) * 1.00, 2) — the CHARGE branch subtracts the same two wear terms"
            - "${p_spin} == 28.08 == round(45.6000 * 0.55 + 3.00, 2) — product factor applies to the whole wear stack, the adder is applied after it"
            - "MarketBid.${b_dis}.status == DRAFT, MarketBid.${b_chg}.status == DRAFT, MarketBid.${b_spin}.status == DRAFT"

      - name: soh_model_pinned_order_sizes_remedy_against_pre_remedy_rated_energy
        grounds:
          - calculations.soh_degradation_model
          - state_machines.CapacityTest.IN_PROGRESS_to_COMPLETED
          - state_machines.WarrantyClaim.APPROVED_to_REMEDIED
          - entities.StorageAsset.fields.rated_energy_mwh
          - entities.WarrantyClaim.fields.remedy_energy_add_mwh
        distinguishing_aspect: |
          Mode (c): the dependency looks circular — remedy_energy_add_mwh is a percentage of
          rated_energy_mwh while rated_energy_mwh is nameplate plus every installed remedy — and
          the pinned order makes it well-defined. The remedy is sized against the PRE-remedy
          rated energy 100.0 (2.310 MWh, not 2.361 from a post-remedy 102.310 base), and the
          second test measuring the identical 90.0 MWh then reads 87.97% instead of 90.00%
          because augmentation raised the denominator it is judged against.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A3 registered and commissioned with initial_cumulative_throughput_mwh 19.8 (COD 2023-08-01, so the test date is 3.0027 warranty years in)"
            - "CapacityTest scheduled 2026-08-01, started, then completed with measured_capacity_mwh 90.0 -> expected 92.10, measured 90.00, deficit 2.10, warranty_claim_triggered true"
            - "WarrantyClaim CAPACITY_SHORTFALL drafted by am_filer and submitted by am_reviewer against that test (claimed_shortfall_pct 2.10) — the submit is a segregation-of-duties step"
            - "claim APPROVED with remedy_install_date 2026-09-01 and remedy_outage_days 3"
            - "clock advanced to 2026-09-01T00:00:00Z so the remedy may be installed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 3", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a3: $.data.id, a3_rated_pre: $.data.rated_energy_mwh }
            - call: "POST /storage-assets/${a3}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id }
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a3}"
            - call: "POST /capacity-tests/${t1}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${a3}"
              captures: { t1_expected: $.data.expected_soh_pct, t1_measured: $.data.measured_soh_pct, t1_deficit: $.data.soh_deficit_pct, t1_trigger: $.data.warranty_claim_triggered }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${a3}", capacity_test_id: "${t1}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1: $.data.id, w1_pct: $.data.claimed_shortfall_pct }
            - call: "POST /warranty-claims/${w1}/submit"
              payload: {}
              as: AssetManager
              as_user_id: "am_reviewer"
            - call: "POST /warranty-claims/${w1}/adjudicate"
              payload: { decision: "APPROVE", remedy_install_date: "2026-09-01T00:00:00Z", remedy_outage_days: 3 }
              as: PlatformAdmin
              as_user_id: "provider_adjudicator"
              captures: { w1_remedy: $.data.remedy_energy_add_mwh }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty-claims/${w1}/install-remedy"
              payload: {}
              as: AssetManager
              as_user_id: "am_filer"
            - call: "GET /storage-assets/${a3}"
              payload: {}
              as: AssetManager
              captures: { a3_rated_post: $.data.rated_energy_mwh, a3_avail_post: $.data.available_energy_mwh, a3_efc_post: $.data.equivalent_full_cycles_ytd, a3_soh: $.data.soh_pct, a3_cum: $.data.cumulative_throughput_mwh }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-09-10T00:00:00Z" }
              as: AssetManager
              captures: { t2: $.data.id }
            - call: "POST /capacity-tests/${t2}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a3}"
            - call: "POST /capacity-tests/${t2}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${a3}"
              captures: { t2_expected: $.data.expected_soh_pct, t2_measured: $.data.measured_soh_pct, t2_deficit: $.data.soh_deficit_pct }
          assert:
            - "step 1/3 of the pinned order: ${a3_rated_pre} == 100.0 and ${t1_measured} == 90.00 (measured against the PRE-remedy rated energy)"
            - "step 2: ${t1_expected} == 92.10 == round(max(80.0, 100 - 2.5 * 3.0027 - 8.0 * (19.8 / 40000) * 100), 2) — read against the PRE-test throughput 19.8"
            - "step 4: ${t1_deficit} == 2.10 and ${t1_trigger} == true (2.10 >= 1.00 inclusive)"
            - "${w1_pct} == 2.10 copied from the cited test"
            - "step 5: ${w1_remedy} == 2.31 == round(100.0 * 2.10 / 100 * 1.10, 3) — sized on the PRE-remedy 100.0 base, NOT on 102.310"
            - "step 6 order: ${a3_rated_post} == 102.31, then ${a3_soh} == 90.00, then ${a3_avail_post} == 92.079 == round(102.310 * 90.00 / 100, 3), then ${a3_efc_post} == 0.5962 == round(109.8 / (2 * 92.079), 4)"
            - "step 7: ${a3_cum} == 109.8 == round(19.8 + 90.0, 3) — the test's own discharge was credited AFTER step 2 read the pre-test value"
            - "post-augmentation bar: ${t2_measured} == 87.97 == round(90.0 / 102.310 * 100, 2), ${t2_expected} == 90.02, ${t2_deficit} == 2.05"

  - rule_id: non_linear_state_machine
    instances:
      - name: storage_asset_parallel_safety_and_market_axes_move_independently
        grounds:
          - state_machines.StorageAsset.safety_state.NORMAL_to_ELEVATED
          - state_machines.StorageAsset.safety_state.ELEVATED_to_ALARM
          - state_machines.StorageAsset.market_state.AVAILABLE_to_SUSPENDED
          - state_machines.StorageAsset.market_state.SUSPENDED_to_AVAILABLE
          - entities.StorageAsset.fields.suspension_reason
        distinguishing_aspect: |
          Parallel state dimensions on the StorageAsset row: safety_state and market_state advance
          on their own axes. An ADVISORY event leaves NORMAL/AVAILABLE, a WARNING event moves
          safety_state to ELEVATED while market_state stays AVAILABLE, a CRITICAL event drives
          ALARM/SUSPENDED, and closing only the CRITICAL event returns the pair to
          ELEVATED/AVAILABLE — a combined state unreachable by any single linear pipeline.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned (NORMAL / AVAILABLE)"
            - "an ADVISORY OFFGAS_DETECTED event opened by safety officer so_1 (imposed NONE)"
            - "a WARNING THERMAL_ANOMALY event opened by so_1 (imposed ELEVATED)"
            - "a CRITICAL SMOKE_DETECTED event opened by so_1 (imposed ALARM)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { st0_safety: $.data.safety_state, st0_market: $.data.market_state }
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "OFFGAS_DETECTED", severity: "ADVISORY", detected_max_cell_temp_c: 45.0 }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { e_adv: $.data.id, e_adv_imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { st1_safety: $.data.safety_state, st1_market: $.data.market_state }
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_ANOMALY", severity: "WARNING", detected_max_cell_temp_c: 66.0 }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { e_warn: $.data.id, e_warn_imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { st2_safety: $.data.safety_state, st2_market: $.data.market_state }
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "SMOKE_DETECTED", severity: "CRITICAL", detected_max_cell_temp_c: 70.0 }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { e_crit: $.data.id, e_crit_imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { st3_safety: $.data.safety_state, st3_market: $.data.market_state, st3_reason: $.data.suspension_reason }
          trigger:
            - call: "POST /safety-events/${e_crit}/close"
              payload: { emergency_response_ack_at: "2026-08-01T02:00:00Z", emergency_ack_agencies: ["Mesa County Fire", "ISO Control Centre"], responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_2"
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { st4_safety: $.data.safety_state, st4_market: $.data.market_state, st4_reason: $.data.suspension_reason }
          assert:
            - "${st0_safety} == NORMAL and ${st0_market} == AVAILABLE after commissioning"
            - "${e_adv_imposed} == NONE, and ${st1_safety} == NORMAL with ${st1_market} == AVAILABLE — an ADVISORY event moves neither axis"
            - "${e_warn_imposed} == ELEVATED, and ${st2_safety} == ELEVATED while ${st2_market} == AVAILABLE — the safety axis moved alone"
            - "${e_crit_imposed} == ALARM, and ${st3_safety} == ALARM with ${st3_market} == SUSPENDED and ${st3_reason} == SAFETY_ALARM"
            - "${st4_safety} == ELEVATED and ${st4_market} == AVAILABLE and ${st4_reason} == null — closing only the CRITICAL event drops the safety axis one level and releases the market axis"
            - "SafetyEvent.${e_adv}.status == OPEN and SafetyEvent.${e_warn}.status == OPEN and SafetyEvent.${e_crit}.status == CLOSED"

      - name: market_bid_revision_cycle_reaches_revision_limit
        grounds:
          - state_machines.MarketBid.SUBMITTED_to_DRAFT
          - state_machines.MarketBid.DRAFT_to_SUBMITTED
          - validations[priority=30]
          - entities.MarketBid.fields.revision_count
          - calculations.bid_floor_price
        distinguishing_aspect: |
          Cyclic shape on a different entity (MarketBid): DRAFT -> SUBMITTED -> DRAFT loops three
          times with revision_count incrementing and the price recomputed each pass, and the loop
          terminates on the fourth revise attempt with ERR_REVISION_LIMIT_REACHED (409) while the
          bid stays SUBMITTED — a termination condition on a genuine cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned"
            - "SocReservation 40.0 MWh, ENERGY_ARBITRAGE, window 2026-08-10T12:00:00Z .. 20:00:00Z"
            - "DAY_AHEAD ENERGY DISCHARGE bid, 20.0 MW, delivery 12:00:00Z .. 16:00:00Z, offer_price 37.00"
            - "three completed submit/revise cycles: offer_mw 21.0, then 22.0, then price_adder 2.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { a1_v: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${a1_v}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id, p0: $.data.offer_price_usd_per_mwh, rc0: $.data.revision_count }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/revise"
              payload: { offer_mw: 21.0 }
              as: MarketTrader
              captures: { rc1: $.data.revision_count, s1: $.data.status }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/revise"
              payload: { offer_mw: 22.0 }
              as: MarketTrader
              captures: { rc2: $.data.revision_count, e2: $.data.expected_energy_mwh, c2: $.data.cycle_debit_efc }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/revise"
              payload: { price_adder_usd_per_mwh: 2.00 }
              as: MarketTrader
              captures: { rc3: $.data.revision_count, p3: $.data.offer_price_usd_per_mwh }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { s4: $.data.status }
          trigger:
            - call: "POST /market-bids/${b1}/revise"
              payload: { offer_mw: 23.0 }
              as: MarketTrader
              captures: { err: $.data.error_id }
          assert:
            - "${rc0} == 0 and ${p0} == 37.00 at draft time"
            - "${s1} == DRAFT and ${rc1} == 1 — the cycle returned the bid to its own initial state"
            - "${rc2} == 2 with ${e2} == 88.0 and ${c2} == 0.44 — each pass recomputes the derived offer fields"
            - "${rc3} == 3 and ${p3} == 39.00 == round(37.0000 + 2.00, 2)"
            - "${s4} == SUBMITTED before the trigger"
            - "${err} == ERR_REVISION_LIMIT_REACHED with HTTP 409 (validations[priority=30], MAX_BID_REVISIONS = 3)"
            - "MarketBid.${b1}.status == SUBMITTED and revision_count == 3 after the rejected fourth revise — the failed loop iteration left no trace"

  - rule_id: transitive_cascade
    instances:
      - name: telemetry_runaway_cascades_six_levels_through_bids_reservations_dispatches_and_obligation
        grounds:
          - calculations.poi_reactive_compliance
          - state_machines.StorageAsset.safety_state.NORMAL_to_LOCKOUT
          - state_machines.StorageAsset.market_state.AVAILABLE_to_SUSPENDED
          - state_machines.MarketBid.DRAFT_to_WITHDRAWN
          - state_machines.SocReservation.HELD_to_RELEASED
          - state_machines.DispatchInstruction.PENDING_to_FAILED
          - endpoints[POST /telemetry-samples]
        distinguishing_aspect: |
          Depth 6 from a single POST /telemetry-samples: sample thermal_escalation RUNAWAY (link 1)
          auto-creates a LOCKOUT SafetyEvent and drives safety_state to LOCKOUT, which suspends
          market_state (link 2), which withdraws every live MarketBid (link 3), which releases
          their HELD SocReservations and rewrites the asset's reservation ledger (link 4), which
          fails every live DispatchInstruction (link 5), and finally starts unavailability accrual
          on the CapacityObligation (link 6). Trigger: an ingested measurement.
