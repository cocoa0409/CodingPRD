      - name: hatchery_scope_beats_request_shape_on_foreign_feeding
        grounds:
          - validations.hatchery-scope
          - validations.request-shape
          - errors.ERR_HATCHERY_SCOPE_VIOLATION
          - endpoints.POST /rearing-lots/{id}/feedings
        distinguishing_aspect: |
          Priority 3 (ownership and scope) against priority 6 (request shape) — a
          much earlier pair in the ladder than the other three instances: the PINE
          manager posts a structurally invalid feeding (feed_lbs -50.0) on Silver
          Creek's lot, and the answer is ERR_HATCHERY_SCOPE_VIOLATION (403), never
          ERR_INVALID_REQUEST (400). A validator that parses the body before it
          resolves the actor leaks the existence and shape of another station's row.
        test_recipe:
          setup:
            - "The base chain through the first feeding, so Silver Creek's lot exists at FINGERLING"
            - "A second station PINE is registered, and its manager's X-User-ID is PINE's hatchery id"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_hatch_pine
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
          trigger:
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-20T00:00:00Z", feed_lbs: -50.0, avg_weight_g_after: 45.3592, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch3_id}"
          assert:
            - "HTTP 403 with error_id ERR_HATCHERY_SCOPE_VIOLATION"
            - "NOT ERR_INVALID_REQUEST, even though feed_lbs is negative"
            - "RearingLot.${lot_id}.cumulative_feed_lbs == 300.0 and avg_weight_g == 4.53592 (nothing was written)"
            - "the same call from Silver Creek's own manager reports ERR_INVALID_REQUEST (400), proving both rules were live"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: density_cap_admits_exactly_one_then_refuses_the_next_increment
        grounds:
          - validations.density-cap
          - calculations.hatchery_density_index
          - errors.ERR_DENSITY_CAP_EXCEEDED
          - endpoints.POST /rearing-lots/{id}/feedings
        distinguishing_aspect: |
          Inclusive numeric cap on a 4-dp derived ratio: a feeding that lands the
          station at exactly density_index 1.0000 is written and flips the posture to
          RESTRICTED, and the very next feeding at 1.0100 is refused with nothing
          persisted. The pair pins both the comparison direction (> not >=) and the
          4-dp rounding, because 2000.00 / 2000.0 must land on 1.0000 and not
          0.9999.
        test_recipe:
          setup:
            - "The base chain through the second feeding: 16000 fish at 45.3592 g, biomass 1600.00 lbs against rearing_capacity_lbs 2000.0, density_index 0.8000, posture OPEN"
            - "The clock stands at 2026-08-20T00:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-21T00:00:00Z", feed_lbs: 400.0, avg_weight_g_after: 56.699, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-22T00:00:00Z", feed_lbs: 20.0, avg_weight_g_after: 57.2659, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "the first feeding returns 201: RearingLot.${lot_id}.biomass_lbs == 2000.00 and Hatchery.${hatch_id}.density_index == 1.0000"
            - "Hatchery.${hatch_id}.operating_posture == RESTRICTED (1.0000 >= 0.90)"
            - "the second feeding returns HTTP 422 with error_id ERR_DENSITY_CAP_EXCEEDED"
            - "after the refusal RearingLot.${lot_id}.avg_weight_g == 56.699, biomass_lbs == 2000.00 and cumulative_feed_lbs == 2200.0 (the refused 20.0 lbs was not booked)"
            - "Hatchery.${hatch_id}.density_index is still 1.0000, never 1.0100"

      - name: load_at_the_certificate_expiry_instant_is_still_legal
        grounds:
          - validations.certificate-current
          - entities.RearingLot.fields.certificate_expires_at
          - endpoints.POST /stocking-events/{id}/load
          - state_machines.RearingLot.health CERTIFIED_to_health UNSCREENED
        distinguishing_aspect: |
          The inclusive far edge of a datetime window: with the clock parked exactly
          on certificate_expires_at (2026-09-24T00:00:00Z) the clock's own lapse
          sweep must NOT fire (the test is strictly greater) and the load must
          succeed. This is the accept side of the pair; its sibling instance moves
          the same clock one second later.
        test_recipe:
          setup:
            - "The base chain through the allocation run, so request R1 is ALLOCATED 2400 and the lot is CERTIFIED with certificate_expires_at 2026-09-24T00:00:00Z"
            - "The clock is then set to exactly 2026-09-24T00:00:00Z and event E3 is SCHEDULED for 2400 fish that day"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - &k_clock_0924
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:00Z" }
              as: ProgramAdmin
            - &k_lot_v3
              call: "GET /rearing-lots/${lot_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { lot_v3: $.data.version }
            - &k_event3
              call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2400
                scheduled_depart_at: "2026-09-24T08:00:00Z"
                scheduled_return_at: "2026-09-24T14:00:00Z"
                expected_lot_version: "${lot_v3}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event3_id: $.data.id }
          trigger:
            - call: "POST /stocking-events/${event3_id}/load"
              payload: { loaded_at: "2026-09-24T00:00:00Z", load_water_temp_c: 12.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "the clock move did NOT lapse the certificate: RearingLot.${lot_id}.health_status == CERTIFIED and certificate_expires_at == 2026-09-24T00:00:00Z"
            - "the load returns 201: StockingEvent.${event3_id}.status == IN_TRANSIT"
            - "StockingEvent.${event3_id}.max_fish_allowed == 2500 and oxygen_flow_lpm == 3.600"
            - "TransportUnit.${truck1_id}.status == IN_USE"

      - name: load_one_second_past_expiry_reports_certificate_expired
        grounds:
          - validations.certificate-current
          - validations.lot-certified
          - errors.ERR_HEALTH_CERTIFICATE_EXPIRED
          - state_machines.RearingLot.health CERTIFIED_to_health UNSCREENED
        distinguishing_aspect: |
          The refuse side of the same edge, one second later: at
          2026-09-24T00:00:01Z the clock sweep lapses health_status to UNSCREENED but
          RETAINS certificate_expires_at, and the load must report
          ERR_HEALTH_CERTIFICATE_EXPIRED rather than ERR_LOT_NOT_CERTIFIED — the two
          422s are distinguished only by whether the retained expiry instant is
          present.
        test_recipe:
          setup:
            - "Exactly the accept-side setup: event E3 SCHEDULED with the clock at 2026-09-24T00:00:00Z and the lot CERTIFIED"
            - "The clock is then advanced to 2026-09-24T00:00:01Z, which lapses the lot to UNSCREENED while certificate_expires_at stays on the row"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0924
            - *k_lot_v3
