            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app}/submit", payload: {}, as: SponsorStaff }
