            - "trigger call 5 returns 201 with PurchaseOffer.${of1}.base_value_cents == 20000000 and dob_deduction_cents == 500000"
            - "Parcel.${p1}.acquisition_status == VALUE_ESTABLISHED and the parcel version advanced again with the offer write"

      - name: a_project_version_reused_for_a_second_ledger_entry_is_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.program-income-stale-project
          - endpoints.POST_mitigation_projects_project_id_program_income_entries
          - calculations.program_income_federal_share
        distinguishing_aspect: |
          The project version is bumped by the ledger write itself, so a caller that reads the version
          once and then posts two entries has its second entry refused with 412
          ERR_STALE_PROJECT_VERSION even though nobody else touched the project - the writer's own
          previous success invalidated the token it was holding. The balance shows only the first
          entry's federal share until the version is re-read.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel and a zero program-income balance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "CC-OCC-PR1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CC-OCC-PR1", site_address: "5001 River Rd", acreage: 0.34, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: "$.data.id" }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
          trigger:
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pv1: "$.data.version" }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "LEASE_REVENUE", amount_cents: 100000, posted_on: "2026-08-01", applied_to_parcel_id: "${p1}", expected_project_version: "${pv1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pi1: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "SALVAGE_PROCEEDS", amount_cents: 40000, posted_on: "2026-08-01", expected_project_version: "${pv1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pv2: "$.data.version" }
            - call: "POST /mitigation-projects/${proj}/program-income-entries"
              payload: { project_id: "${proj}", entry_type: "SALVAGE_PROCEEDS", amount_cents: 40000, posted_on: "2026-08-01", expected_project_version: "${pv2}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { pi2: "$.data.id" }
          assert:
            - "trigger call 2 returns 201; ProgramIncomeLedgerEntry.${pi1}.federal_share_cents == 75000 and MitigationProject.${proj}.program_income_balance_cents == 75000"
            - "trigger call 3 returns 412 with data.error_id == ERR_STALE_PROJECT_VERSION"
            - "MitigationProject.${proj}.program_income_balance_cents == 75000 immediately after trigger call 3 (nothing was written)"
            - "${pv2} == ${pv1} + 1"
            - "trigger call 5 returns 201; ProgramIncomeLedgerEntry.${pi2}.federal_share_cents == 30000 and MitigationProject.${proj}.program_income_balance_cents == 105000"
            - "GET /program-income-entries?project_id=${proj} returns total_count == 2"

      - name: one_write_fans_out_into_several_dependent_rows
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.ClosingRecord
          - state_machines.DeedRestriction
        excluded_because:
          difficulty_instance: deed_recording_cascades_four_levels_into_project_open_space_acreage
          rationale: |
            That instance follows a single recording write down four levels - ClosingRecord to Parcel to
            a newly created DeedRestriction to the project's protected_open_space_acres - asserting the
            literal at each level, which is the cascading-side-effects layer in full.

      - name: the_same_inputs_are_run_through_two_formula_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.benefit_cost_ratio
          - calculations.replacement_housing_payment
        excluded_because:
          difficulty_instance: bcr_discounted_npv_vs_undiscounted_life_cycle_divergence
          rationale: |
            Both dual-variant calculations in the domain are asserted in the difficulty design: this
            instance for benefit_cost_ratio and
            replacement_housing_comparable_dwelling_vs_actual_replacement_divergence for the housing
            payment, each with the delta between the two variants pinned to a literal.

      - name: derived_totals_are_reconciled_rather_than_incrementally_patched
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.federal_obligation
          - calculations.program_income_federal_share
        excluded_because:
          difficulty_instance: federal_obligation_returns_to_the_same_literal_after_offer_withdrawal_and_re_presentation
          rationale: |
            Reconciliation is exactly what that instance proves: the aggregate is recomputed from its
            input set on every touch, so removing and re-adding an obligation returns the identical
            literal instead of drifting, and
            program_income_balance_returns_to_the_same_literal_after_ledger_entry_reversal makes the
            same point for the ledger.

  - section: consistency_model
    instances:

      - name: every_write_response_already_carries_the_recomputed_derived_fields
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.MitigationProject.fields.validated_bcr
          - entities.MitigationProject.fields.viability_status
        distinguishing_aspect: |
          There is no deferred recomputation anywhere in the program: the BCA validation response
          already carries the project's validated_bcr and the approval response already carries the
          derived viability fields, and an immediately following GET returns byte-identical values. A
          test may therefore read derived state straight out of the write response without polling.
        test_recipe:
          setup:
            - "One DRAFT MitigationProject with one parcel and a SUBMITTED BCA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "CM-IMM-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CM-IMM-1", site_address: "5101 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: "$.data.id" }
          trigger:
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "GET /mitigation-projects/${proj}"
              payload: { project_id: "${proj}" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
          assert:
            - "the response body of trigger call 1 already contains BenefitCostAnalysis.${bca}.bcr == 2.667 and status == VALIDATED"
            - "the response body of trigger call 1's project projection and the body of trigger call 2 agree: MitigationProject.${proj}.validated_bcr == 2.667 and validated_by_user_id == pa-validator"
            - "the response body of trigger call 4 already contains status == APPROVED, viability_status == NONVIABLE, neighborhood_viability_ratio == 0, participating_parcel_count == 1 and holdout_parcel_count == 0"
            - "trigger call 5 returns exactly the same field values as trigger call 4's body, read by a different role"
