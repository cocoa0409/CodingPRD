      - name: stability_timepoint_gates_reject_an_unplanned_month_and_a_duplicate_measurement
        claim_type: Violation → Error
        grounds:
          - validations.priority_121_ERR_TIMEPOINT_NOT_PLANNED
          - validations.priority_70
          - errors.ERR_TIMEPOINT_NOT_PLANNED
          - errors.ERR_DUPLICATE_TIMEPOINT
        distinguishing_aspect: "The duplicate key here is a THREE-part tuple (study, month_index, test_code), so the same month with a different code must still be accepted while the same month with the same code is rejected. The companion rule pins month_index to declared membership in planned_timepoints_months rather than to a range check: month 4 lies between the planned 3 and 6 and must still be refused with a 422."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. ProductSpecification IVD-CA-13 with release_test_codes [ACTIVITY, SENSITIVITY], one PLANNED ReagentLot, and one APPROVED REAL_TIME StabilityStudy with planned_timepoints_months [0, 3, 6]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CA-13", reference_material_code: "REF-CA13", required_material_codes: ["AB-CA-13"], release_test_codes: ["ACTIVITY", "SENSITIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CA-LOT-13", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "${ps_id}", reagent_lot_id: "${rl_id}", study_type: "REAL_TIME", chamber_code: "CH-CA13", storage_temp_c: 5.0, protocol_start: "2026-09-01T00:00:00Z", protocol_end: "2027-09-01T00:00:00Z", planned_timepoints_months: [0, 3, 6], baseline_value: 100.0 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ss_id: $.data.id }
            - call: "POST /stability-studies/${ss_id}/approve-protocol"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { proto_status: $.data.status }
          trigger:
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 4, test_code: "ACTIVITY", measured_value: 98.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_unplanned: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { tp_id: $.data.id, tp_recovery: $.data.recovery_pct }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 99.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_duplicate: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 0, test_code: "SENSITIVITY", measured_value: 97.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { tp2_id: $.data.id, tp2_code: $.data.test_code }
            - call: "GET /stability-studies/${ss_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { study_status: $.data.status, tp_count: $.data.timepoint_count }
          assert:
            - "month_index 4 returns HTTP 422 ERR_TIMEPOINT_NOT_PLANNED: membership in planned_timepoints_months [0, 3, 6] is required, and lying inside the planned span is not enough"
            - "the first month 0 ACTIVITY record is accepted with recovery_pct 100.00 and moves the study from APPROVED to IN_PROGRESS"
            - "repeating month 0 with test_code ACTIVITY returns HTTP 409 ERR_DUPLICATE_TIMEPOINT, even with a different measured_value"
            - "month 0 with test_code SENSITIVITY is accepted, so the uniqueness key is the (study, month_index, test_code) triple"
            - "timepoint_count is 2 after the two accepted records; the rejected calls persist nothing"

      - name: material_dispensing_gates_at_priorities_75_76_78_and_123_fire_in_the_declared_order
        claim_type: Priority Ordering
        grounds:
          - validations.priority_75_ERR_MATERIAL_NOT_QUALIFIED
          - validations.priority_76_ERR_MATERIAL_EXPIRED
          - validations.priority_78_ERR_INSUFFICIENT_MATERIAL
          - validations.priority_123_ERR_COMPONENT_ROLE_NOT_IN_BOM
        distinguishing_aspect: "Each candidate lot below violates its own gate AND every gate below it, so the answer identifies which check ran first: an unqualified, expired, over-drawn lot must answer ERR_MATERIAL_NOT_QUALIFIED, and a qualified-but-expired, over-drawn lot must answer ERR_MATERIAL_EXPIRED. The 123 pair then shows the bill-of-materials check has two independent halves — role versus material_type, and material_code membership in the BOM."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z. ProductSpecification IVD-CA-14 whose required_material_codes is [AB-CA-14] only."
            - "Four MaterialLots: MLR is RECEIVED, expired on 2026-08-19 and holds 100 units; MLE is QUALIFIED, expired on 2026-08-19 and holds 100 units; MLG is QUALIFIED, expires in 2027 and holds 100 units; MLX is a QUALIFIED ENZYME lot of EZ-CA-14, a code that is NOT in the BOM."
