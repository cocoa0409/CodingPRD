              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R1 Deciding", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev1: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R2 Adjudicating", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer B", body_text: "The offer whose disapproval will be appealed and then denied.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/b", display_url: "https://www.beaconlending.example/b" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_b: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_b}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_b_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_b}/screening-runs"
