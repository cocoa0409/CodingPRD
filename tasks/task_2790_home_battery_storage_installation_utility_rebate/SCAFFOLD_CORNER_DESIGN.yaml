  - section: rbac
    instances:
      - name: each_of_the_six_roles_performs_its_own_exclusive_operation
        claim_type: role_permissions
        grounds:
          - rbac.roles.CertifiedInstaller
          - rbac.roles.AuthorityHavingJurisdiction
          - rbac.roles.UtilityInterconnectionReviewer
          - rbac.roles.RebateAdministrator
          - rbac.roles.ManufacturerWarrantyAgent
          - rbac.roles.Homeowner
          - validations[priority=20]
        distinguishing_aspect: |
          One happy-path pass over the whole role table: the authority records the inspection, the installer commissions, a second utility reviewer grants permission to operate, the rebate administrator publishes a program, the manufacturer amends the certification and the homeowner reads the bank — six roles, six endpoints, six successes.
