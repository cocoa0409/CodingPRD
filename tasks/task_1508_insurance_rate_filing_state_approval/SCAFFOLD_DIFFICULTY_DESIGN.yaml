              as: ImplementationLead
              captures: { w3_id: $.data.id, w3_status: $.data.status }
          assert:
            - "Gap of exactly 7 days (start 2026-12-22): error_id == ERR_WAVE_GAP_VIOLATION (HTTP 409)"
            - "Gap of 8 days (start 2026-12-23): wave ${w3_id} created with status == SCHEDULED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: capped_book_premium_conservation
        grounds:
          - calculations.wave_balance_factor
          - calculations.renewal_re_rate
          - entities.ImplementationWave.fields.final_book_delta_cents
        distinguishing_aspect: |
          Conserved quantity: the aggregate book premium delta. Per-policy capping
          alone would overshoot the approved +10% (capped deltas sum to 35001 over
          the 250002 baseline vs the 25000 target); cap + balance-factor +
          penny-remainder allocation must land sum(final - baseline) EXACTLY on
          target_book_delta_cents == 25000.
        test_recipe:
          setup:
            - "CA filing EFFECTIVE 2026-10-16 (approved 0.10); wave cap 0.15; policies PA (50001, rel 1.0), PB (50001, rel 2.0), PC (150000, rel 1.5)"
