            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/taper-plans"
              payload: { admission_id: "${adm_id}", total_steps: 3 }
