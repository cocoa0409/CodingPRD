            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { st: $.data.status } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS"
            - "st == PENDED_REVIEW (role check fired before state mutation)"

      - name: um_admin_cannot_decide_appeal
        claim_type: rbac_denial
        grounds: ["roles[UMAdmin]", "roles[AppealsReviewer]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "UMAdmin (void/clock/registry powers) has no appeal-decision permission: decide is AppealsReviewer-exclusive, rejected 403 regardless of appeal state."
        test_recipe:
          setup: ["Active criteria set; provider; denied request; appeal filed"]
          setup_api_calls:
