        distinguishing_aspect: "One request carrying both a stale expected_customer_version and a wildly over-cap requested_credit_minor answers 412 ERR_STALE_CUSTOMER_VERSION; with a fresh version the same 99999 request answers 422 ERR_REDEMPTION_CAP_EXCEEDED, and the exact cap 10627 is accepted."
