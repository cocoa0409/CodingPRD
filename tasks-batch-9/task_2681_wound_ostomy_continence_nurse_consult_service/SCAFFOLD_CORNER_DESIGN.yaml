            - "After dispute: ConsultRequest.${c1_id}.protocol_hold == true and Unit.${u1_id}.disputed_staging_count == 1"
            - "After dispute: GET /pressure-injury-cases?skin_assessment_id=${a1_id} still shows classification == UNDETERMINED and status == OPEN — a dispute touches no case field"
            - "After restage: HTTP 200, SkinAssessment.${a1_id}.validation_status == PENDING_VALIDATION, observed_stage == DTI, measured_area_cm2 == 22, restage_count == 1, dispute_reason == null"
            - "After restage: ConsultRequest.${c1_id}.protocol_hold == false — the latch is released"
            - "After restage: Unit.${u1_id}.disputed_staging_count is still 1 — a lifetime counter is never decremented"
