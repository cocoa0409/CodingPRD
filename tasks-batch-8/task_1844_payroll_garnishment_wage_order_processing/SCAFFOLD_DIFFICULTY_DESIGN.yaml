            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
            # Suspend order C AFTER pay but BEFORE remittance creation
            - call: "POST /orders/${ord_c}/suspend"
