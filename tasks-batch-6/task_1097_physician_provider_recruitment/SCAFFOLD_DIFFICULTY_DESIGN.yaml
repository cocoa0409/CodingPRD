          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_COMP_OUT_OF_RANGE]
        distinguishing_aspect: |
          Category pair state (priority 8) vs business_constraint (priority 11): a POST /offers against an
          application in SUBMITTED (wrong state for offer) AND with base_salary 35,000,000 above comp_max
          30,000,000 fails both; the state check wins, returning ERR_INVALID_STATE, not ERR_COMP_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "Application in SUBMITTED (not INTERVIEWING) on a CARDIOLOGY opening with comp range up to 30,000,000."
