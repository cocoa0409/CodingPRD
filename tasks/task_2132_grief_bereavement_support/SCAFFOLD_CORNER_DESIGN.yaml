      - name: safety_error_wins_over_referential_error_on_companion_match_create
        claim_type: Priority Conflict
        grounds: ["validations[priority=10]", "validations[priority=11]", "errors[ERR_COMPANION_TRAINING_INSUFFICIENT]", "errors[ERR_LOSS_TYPE_NOT_ENDORSED]"]
        distinguishing_aspect: "One create violates the priority-10 safety rule (HIGH-risk participant, volunteer with only 16 training hours) and the priority-11 referential rule (loss type not endorsed) at once; the response must be ERR_COMPANION_TRAINING_INSUFFICIENT (422), not ERR_LOSS_TYPE_NOT_ENDORSED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One CERTIFIED VolunteerCompanion with exactly 16 training_hours and endorsed_loss_types [PERINATAL]."
            - "One accepted ANTICIPATED_ILLNESS Participant whose NEEDS Assessment (32, 12, 12) gives composite 70.00 and risk_tier HIGH."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/volunteer-companions"
