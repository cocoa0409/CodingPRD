scenario: |
  Home Collection Screening Kit Ordering, Provider Order Capture & Result Return (Exact Sciences): patient-initiated interest requiring a valid provider order obtained through the ordering physician or a telehealth network, eligibility screening for age, risk category and contraindications that would require a different test, kit shipment with collection instructions, stabilization requirements and return logistics, uncollected kit follow-up outreach with reminder cadence and abandonment tracking, laboratory processing with specimen adequacy checks and recollection requests, result delivery to the ordering provider with positive-result navigation to follow-up colonoscopy, health plan and health system programs that push outreach to defined member populations, quality measure attribution and adherence reporting

domain_name: home-collection-screening
api_prefix: /screening

complexity_profile:
  primary_archetype: Workflow orchestration
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Cascading side effects
    - Optimistic concurrency
    - Rate / threshold triggers
    - Dual-variant calculation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: HealthPlanProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code" }
      - { name: program_name, type: string, source: input, description: "Display name of the payer/health-system program" }
      - { name: outreach_mode, type: enum, source: input, description: "PUSH (program pushes outreach to members) | SELF_SERVE (patient-initiated only)", constraints: "PUSH | SELF_SERVE" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether program is currently enrolling cohorts" }
      - { name: population_size, type: integer, source: system, default: 0, description: "Count of MemberCohort rows currently ELIGIBLE under this program" }
      - { name: attributed_count, type: integer, source: computed, default: 0, description: "Count of member months where the member is attributed to this program for the quality measure" }
      - { name: adherent_count, type: integer, source: computed, default: 0, description: "Count of attributed members whose adherence_window closed with a qualifying screen" }
      - { name: measure_year, type: integer, source: input, description: "Calendar year of the quality measure (e.g. 2026)" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Client-facing reference (MRN / email surrogate); unique" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: risk_category, type: enum, source: input, description: "AVERAGE | ELEVATED | HIGH", constraints: "AVERAGE | ELEVATED | HIGH" }
      - { name: contraindication_flags, type: array, source: input, default: [], description: "List of contraindication codes; any non-empty value disqualifies the home kit" }
      - { name: recent_symptoms, type: boolean, source: input, default: false, description: "Advisory risk flag: recent GI symptoms" }
      - { name: comorbidity, type: boolean, source: input, default: false, description: "Advisory risk flag: relevant comorbidity" }
      - { name: family_history, type: boolean, source: input, default: false, description: "Advisory risk flag: family history of colorectal cancer" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DECEASED | OPTED_OUT", constraints: "ACTIVE | DECEASED | OPTED_OUT" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique" }
      - { name: display_name, type: string, source: input, description: "Provider name" }
      - { name: channel, type: enum, source: input, description: "ORDERING (patient's own physician) | TELEHEALTH (network provider)", constraints: "ORDERING | TELEHEALTH" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the provider may issue new orders" }

  - name: MemberCohort
    parent: HealthPlanProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> HealthPlanProgram.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: enrolled_at, type: string, source: system, description: "ISO date the cohort row was created" }
      - { name: attributed, type: boolean, source: computed, default: true, description: "Whether the member is attributed to this program for the measure year (false once patient OPTED_OUT or DECEASED before any qualifying screen)" }
      - { name: adherence_window_start, type: string, source: system, description: "ISO date = enrolled_at; start of the adherence window (inclusive)" }
      - { name: adherence_window_end, type: string, source: system, description: "ISO date = enrolled_at + ADHERENCE_WINDOW_DAYS - 1; end of the adherence window (inclusive)" }
      - { name: status, type: enum, source: system, default: "ELIGIBLE", description: "ELIGIBLE | OUTREACH_SENT | ORDERED | SCREENED | EXCLUDED", constraints: "ELIGIBLE | OUTREACH_SENT | ORDERED | SCREENED | EXCLUDED" }

  - name: ScreeningOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: program_id, type: string, source: input, description: "FK -> HealthPlanProgram.id; nullable for pure self-serve orders", required: false }
      - { name: cohort_id, type: string, source: input, description: "FK -> MemberCohort.id; required when program_id is set", required: false }
      - { name: order_channel, type: enum, source: computed, description: "Copied from Provider.channel at order time" }
      - { name: status, type: enum, source: system, default: "PENDING_ELIGIBILITY", description: "PENDING_ELIGIBILITY | ELIGIBLE | REJECTED_INELIGIBLE | KIT_ORDERED | KIT_SHIPPED | KIT_RETURNED | IN_LAB | RESULTED | CANCELLED | ABANDONED | RECOLLECTION_REQUESTED", constraints: "see state machine" }
      - { name: eligible_at, type: string, source: system, description: "ISO timestamp of ELIGIBLE determination; null until set", required: false }
      - { name: shipped_at, type: string, source: system, description: "ISO timestamp kit left the depot; null until set", required: false }
      - { name: returned_at, type: string, source: system, description: "ISO timestamp returned kit was received at the lab dock; null until set", required: false }
      - { name: abandonment_due_at, type: string, source: computed, description: "ISO date = date(shipped_at) + KIT_ABANDON_DAYS; the day the order auto-transitions KIT_SHIPPED -> ABANDONED if still unreturned", required: false }
      - { name: recollection_round, type: integer, source: system, default: 0, description: "Number of recollection cycles completed (0, 1, or 2)" }
      - { name: active_kit_id, type: string, source: system, description: "Id of the ScreeningKit currently outstanding for this order; null when no kit outstanding", required: false }
      - { name: quality_outcome, type: enum, source: computed, description: "UNRESOLVED | ADHERENT_NEGATIVE | ADHERENT_POSITIVE_NAVIGATED | POSITIVE_NAVIGATION_PENDING | POSITIVE_NAVIGATION_LAPSED", default: "UNRESOLVED", constraints: "see quality_measure_attribution calculation" }

  - name: OutreachEvent
    parent: MemberCohort
    common_fields: false
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> MemberCohort.id" }
      - { name: channel, type: enum, source: input, description: "MAIL | SMS | PHONE", constraints: "MAIL | SMS | PHONE" }
      - { name: sent_at, type: string, source: system, description: "ISO timestamp of dispatch" }
      - { name: template_code, type: string, source: input, description: "Outreach template identifier" }

  - name: Reminder
    parent: ScreeningOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id" }
      - { name: sequence_no, type: integer, source: system, description: "1-based ordinal within the cadence (1, 2, 3)" }
      - { name: channel, type: enum, source: input, description: "MAIL | SMS | PHONE", constraints: "MAIL | SMS | PHONE" }
      - { name: scheduled_for, type: string, source: computed, description: "ISO date = date(shipped_at) + cadence offset for this sequence_no" }
      - { name: sent_at, type: string, source: system, description: "ISO timestamp when dispatched; null while SCHEDULED", required: false }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | SENT | SKIPPED", constraints: "SCHEDULED | SENT | SKIPPED" }

  - name: ScreeningKit
    parent: ScreeningOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id" }
      - { name: kit_serial, type: string, source: system, description: "Server-minted serial number; unique" }
      - { name: shipped_at, type: string, source: system, description: "ISO dispatch timestamp; null until SHIPPED", required: false }
      - { name: returned_at, type: string, source: system, description: "ISO receipt timestamp at lab dock; null until returned", required: false }
      - { name: stabilization_expires_at, type: string, source: computed, description: "ISO timestamp = returned_at + STABILIZATION_HOURS hours; processing must start before this instant", required: false }
      - { name: status, type: enum, source: system, default: "ORDERED", description: "ORDERED | SHIPPED | RETURNED | IN_PROCESSING | CONSUMED | EXPIRED_STABILIZATION | CANCELLED", constraints: "see state machine" }

  - name: LabSpecimen
    parent: ScreeningKit
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> ScreeningKit.id" }
      - { name: order_id, type: string, source: system, description: "Id of the ScreeningOrder that owns the kit producing this specimen (denormalized at intake)" }
      - { name: accessioned_at, type: string, source: system, description: "ISO timestamp of lab intake" }
      - { name: adequacy, type: enum, source: system, default: "PENDING", description: "PENDING | ADEQUATE | INADEQUATE", constraints: "PENDING | ADEQUATE | INADEQUATE" }
      - { name: adequacy_checked_at, type: string, source: system, description: "ISO timestamp of adequacy determination", required: false }
      - { name: processing_started_at, type: string, source: system, description: "ISO timestamp processing began; null until PROCESSING", required: false }
      - { name: status, type: enum, source: system, default: "ACCESSIONED", description: "ACCESSIONED | PROCESSING | ADEQUATE | INADEQUATE | RESULTED", constraints: "see state machine" }

  - name: ScreeningResult
    parent: ScreeningOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id" }
      - { name: specimen_id, type: string, source: system, description: "FK -> LabSpecimen.id that produced this result" }
      - { name: resulted_at, type: string, source: system, description: "ISO timestamp the result was finalized" }
      - { name: outcome, type: enum, source: system, description: "NEGATIVE | POSITIVE", constraints: "NEGATIVE | POSITIVE" }
      - { name: delivered_to_provider_at, type: string, source: system, description: "ISO timestamp the result was delivered to the ordering provider" }
      - { name: navigation_due_at, type: string, source: computed, description: "ISO date = date(delivered_to_provider_at) + NAVIGATION_WINDOW_DAYS; only set when outcome = POSITIVE", required: false }
      - { name: navigation_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING | SCHEDULED | COMPLETED | LAPSED", default: "NOT_REQUIRED", constraints: "see state machine" }
      - { name: navigation_completed_at, type: string, source: system, description: "ISO timestamp colonoscopy navigation completed; null until COMPLETED", required: false }

  - name: QualityMeasureReport
    parent: HealthPlanProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> HealthPlanProgram.id" }
      - { name: measure_year, type: integer, source: system, description: "Copied from program" }
      - { name: numerator, type: integer, source: computed, description: "adherent_count at snapshot time" }
      - { name: denominator, type: integer, source: computed, description: "attributed_count at snapshot time" }
      - { name: adherence_rate, type: number, source: computed, description: "numerator / denominator rounded to 4 decimal places round_half_up; 0 when denominator = 0" }
      - { name: snapshot_at, type: string, source: system, description: "ISO timestamp of report generation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningOrder
    initial_state: PENDING_ELIGIBILITY
    terminal_states: [RESULTED, CANCELLED, ABANDONED, REJECTED_INELIGIBLE]
    transitions:
      - from: PENDING_ELIGIBILITY
        to: ELIGIBLE
        trigger: "POST /screening/orders/{orderId}/eligibility/confirm"
        actor: ProgramAdmin
        preconditions:
          - "order.status == PENDING_ELIGIBILITY (ERR_ORDER_INVALID_STATE)"
          - "patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)"
          - "patient age at order date within [45, 75] inclusive (ERR_AGE_OUT_OF_RANGE)"
          - "patient.risk_category != HIGH (ERR_RISK_CATEGORY_EXCLUDED)"
          - "patient.contraindication_flags is empty (ERR_CONTRAINDICATION_PRESENT)"
        side_effects:
          - "order.eligible_at = logical clock now"
          - "increments ScreeningOrder.version by 1"

      - from: PENDING_ELIGIBILITY
        to: REJECTED_INELIGIBLE
        trigger: "POST /screening/orders/{orderId}/eligibility/reject"
        actor: ProgramAdmin
        preconditions:
          - "order.status == PENDING_ELIGIBILITY (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "if order.cohort_id set: cohort.status stays ELIGIBLE (order rejection does not consume the cohort)"
          - "increments ScreeningOrder.version by 1"

      - from: ELIGIBLE
        to: KIT_ORDERED
        trigger: "POST /screening/orders/{orderId}/kit"
        actor: FulfillmentAgent
        preconditions:
          - "order.status == ELIGIBLE (ERR_ORDER_INVALID_STATE)"
          - "expected_order_version matches current order.version (ERR_STALE_VERSION)"
          - "no other ScreeningOrder for the same patient_id in status ELIGIBLE, KIT_ORDERED, KIT_SHIPPED, KIT_RETURNED, IN_LAB, or RECOLLECTION_REQUESTED (ERR_ACTIVE_ORDER_EXISTS)"
        side_effects:
          - "create ScreeningKit (status ORDERED) and set order.active_kit_id"
          - "if order.cohort_id set: cohort.status -> ORDERED"
          - "increments ScreeningOrder.version by 1"

      - from: KIT_ORDERED
        to: KIT_SHIPPED
        trigger: "POST /screening/kits/{kitId}/ship"
        actor: FulfillmentAgent
        preconditions:
          - "kit.status == ORDERED (ERR_KIT_INVALID_STATE)"
          - "kit.order_id's order.status == KIT_ORDERED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "kit.status -> SHIPPED; kit.shipped_at = now"
          - "order.status -> KIT_SHIPPED; order.shipped_at = now; order.abandonment_due_at = date(now) + KIT_ABANDON_DAYS"
          - "create 3 Reminder rows (sequence_no 1..3) with scheduled_for = date(shipped_at) + REMINDER_OFFSETS[sequence_no]"
          - "increments ScreeningOrder.version by 1"

      - from: KIT_SHIPPED
        to: KIT_RETURNED
        trigger: "POST /screening/kits/{kitId}/return"
        actor: FulfillmentAgent
        preconditions:
          - "kit.status == SHIPPED (ERR_KIT_INVALID_STATE)"
          - "order.status == KIT_SHIPPED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "kit.status -> RETURNED; kit.returned_at = now; kit.stabilization_expires_at = now + STABILIZATION_HOURS hours"
          - "order.status -> KIT_RETURNED; order.returned_at = now"
          - "all SCHEDULED Reminders for the order -> SKIPPED"
          - "increments ScreeningOrder.version by 1"

      - from: KIT_RETURNED
        to: IN_LAB
        trigger: "POST /screening/orders/{orderId}/specimens"
        actor: LabTechnician
        preconditions:
          - "order.status == KIT_RETURNED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "create LabSpecimen (status ACCESSIONED) for order.active_kit_id"
          - "increments ScreeningOrder.version by 1"

      - from: IN_LAB
        to: RESULTED
        trigger: "POST /screening/specimens/{specimenId}/result"
        actor: LabTechnician
        preconditions:
          - "specimen.status == PROCESSING (ERR_SPECIMEN_INVALID_STATE)"
          - "specimen.adequacy == ADEQUATE (ERR_SPECIMEN_NOT_ADEQUATE)"
        side_effects:
          - "specimen.status -> RESULTED"
          - "kit.status -> CONSUMED; order.active_kit_id = null"
          - "create ScreeningResult (outcome from payload); delivered_to_provider_at = now"
          - "if outcome == POSITIVE: navigation_status = PENDING, navigation_due_at = date(now) + NAVIGATION_WINDOW_DAYS"
          - "quality_outcome recomputed per quality_measure_attribution"
          - "if cohort attached: cohort.status -> SCREENED; program counters recomputed"
          - "increments ScreeningOrder.version by 1"

      - from: IN_LAB
        to: RECOLLECTION_REQUESTED
        trigger: "POST /screening/specimens/{specimenId}/adequacy with adequacy=INADEQUATE"
        actor: LabTechnician
        preconditions:
          - "specimen.status in {ACCESSIONED, PROCESSING} (ERR_SPECIMEN_INVALID_STATE)"
          - "order.recollection_round < MAX_RECOLLECTIONS (ERR_RECOLLECTION_LIMIT_REACHED)"
        side_effects:
          - "specimen.status -> INADEQUATE; adequacy_checked_at = now"
          - "kit.status -> CONSUMED; order.active_kit_id = null"
          - "order.recollection_round += 1"
          - "order.status -> RECOLLECTION_REQUESTED"
          - "increments ScreeningOrder.version by 1"

      - from: RECOLLECTION_REQUESTED
        to: KIT_ORDERED
        trigger: "POST /screening/orders/{orderId}/kit"
        actor: FulfillmentAgent
        preconditions:
          - "order.status == RECOLLECTION_REQUESTED (ERR_ORDER_INVALID_STATE)"
          - "expected_order_version matches current order.version (ERR_STALE_VERSION)"
        side_effects:
          - "create replacement ScreeningKit; order.active_kit_id set"
          - "order.abandonment_due_at cleared (reset on next ship)"
          - "increments ScreeningOrder.version by 1"

      - from: KIT_SHIPPED
        to: ABANDONED
        trigger: "system (logical clock reaches date >= abandonment_due_at while order.status == KIT_SHIPPED)"
        actor: system
        preconditions:
          - "current logical date >= order.abandonment_due_at"
        side_effects:
          - "active kit -> EXPIRED_STABILIZATION"
          - "all SCHEDULED Reminders -> SKIPPED"
          - "increments ScreeningOrder.version by 1"

      - from: RECOLLECTION_REQUESTED
        to: ABANDONED
        trigger: "system (logical clock reaches date >= date(status entered RECOLLECTION_REQUESTED) + RECOLLECTION_ABANDON_DAYS with no replacement kit)"
        actor: system
        preconditions:
          - "current logical date >= date(order.updated_at of the transition into RECOLLECTION_REQUESTED) + RECOLLECTION_ABANDON_DAYS"
        side_effects:
          - "increments ScreeningOrder.version by 1"

      - from: PENDING_ELIGIBILITY
        to: CANCELLED
        trigger: "POST /screening/orders/{orderId}/cancel"
        actor: Provider | ProgramAdmin
        preconditions:
          - "order.status in {PENDING_ELIGIBILITY, ELIGIBLE} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "increments ScreeningOrder.version by 1"

      - from: ELIGIBLE
        to: CANCELLED
        trigger: "POST /screening/orders/{orderId}/cancel"
        actor: Provider | ProgramAdmin
        preconditions:
          - "order.status in {PENDING_ELIGIBILITY, ELIGIBLE} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "increments ScreeningOrder.version by 1"

  - entity: ScreeningKit
    initial_state: ORDERED
    terminal_states: [CONSUMED, EXPIRED_STABILIZATION, CANCELLED]
    transitions:
      - from: ORDERED
        to: SHIPPED
        trigger: "POST /screening/kits/{kitId}/ship"
        actor: FulfillmentAgent
        preconditions:
          - "parent order.status == KIT_ORDERED"
        side_effects: ["see ScreeningOrder KIT_ORDERED->KIT_SHIPPED"]

      - from: SHIPPED
        to: RETURNED
        trigger: "POST /screening/kits/{kitId}/return"
        actor: FulfillmentAgent
        preconditions:
          - "parent order.status == KIT_SHIPPED"
        side_effects: ["stabilization_expires_at = returned_at + STABILIZATION_HOURS"]

      - from: RETURNED
        to: IN_PROCESSING
        trigger: "POST /screening/specimens/{specimenId}/process"
        actor: LabTechnician
        preconditions:
          - "specimen for this kit exists and specimen.status == ACCESSIONED (ERR_SPECIMEN_INVALID_STATE)"
          - "logical clock now < kit.stabilization_expires_at (ERR_STABILIZATION_EXPIRED)"
        side_effects:
          - "specimen.status -> PROCESSING; specimen.processing_started_at = now"

      - from: IN_PROCESSING
        to: CONSUMED
        trigger: "POST /screening/specimens/{specimenId}/result or adequacy=INADEQUATE"
        actor: LabTechnician
        preconditions: []
        side_effects: ["kit consumed; order.active_kit_id cleared"]

      - from: SHIPPED
        to: EXPIRED_STABILIZATION
        trigger: "system (order abandonment auto-transition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LabSpecimen
    initial_state: ACCESSIONED
    terminal_states: [RESULTED, INADEQUATE]
    transitions:
      - from: ACCESSIONED
        to: PROCESSING
        trigger: "POST /screening/specimens/{specimenId}/process"
        actor: LabTechnician
        preconditions:
          - "kit.stabilization not expired (ERR_STABILIZATION_EXPIRED)"
        side_effects: ["processing_started_at = now"]

      - from: PROCESSING
        to: RESULTED
        trigger: "POST /screening/specimens/{specimenId}/result"
        actor: LabTechnician
        preconditions:
          - "adequacy == ADEQUATE (ERR_SPECIMEN_NOT_ADEQUATE)"
        side_effects: ["see ScreeningOrder IN_LAB->RESULTED"]

      - from: ACCESSIONED
        to: INADEQUATE
        trigger: "POST /screening/specimens/{specimenId}/adequacy (adequacy=INADEQUATE)"
        actor: LabTechnician
        preconditions: []
        side_effects: ["see ScreeningOrder IN_LAB->RECOLLECTION_REQUESTED"]

      - from: PROCESSING
        to: INADEQUATE
        trigger: "POST /screening/specimens/{specimenId}/adequacy (adequacy=INADEQUATE)"
        actor: LabTechnician
        preconditions: []
        side_effects: ["see ScreeningOrder IN_LAB->RECOLLECTION_REQUESTED"]

  - entity: ScreeningResult
    initial_state: PENDING
    terminal_states: [COMPLETED, LAPSED, NOT_REQUIRED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /screening/results/{resultId}/navigation/schedule"
        actor: Navigator
        preconditions:
          - "result.outcome == POSITIVE (ERR_NAVIGATION_NOT_REQUIRED)"
          - "navigation_status == PENDING (ERR_NAVIGATION_INVALID_STATE)"
        side_effects: []

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /screening/results/{resultId}/navigation/complete"
        actor: Navigator
        preconditions:
          - "navigation_status == SCHEDULED (ERR_NAVIGATION_INVALID_STATE)"
        side_effects:
          - "navigation_completed_at = now"
          - "order.quality_outcome recomputed (ADHERENT_POSITIVE_NAVIGATED if within window)"

      - from: PENDING
        to: LAPSED
        trigger: "system (logical date > navigation_due_at while navigation_status == PENDING)"
        actor: system
        preconditions: []
        side_effects: ["order.quality_outcome -> POSITIVE_NAVIGATION_LAPSED; increments ScreeningOrder.version by 1"]

      - from: SCHEDULED
        to: LAPSED
        trigger: "system (logical date > navigation_due_at while navigation_status == SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: ["order.quality_outcome -> POSITIVE_NAVIGATION_LAPSED; increments ScreeningOrder.version by 1"]

  - entity: MemberCohort
    initial_state: ELIGIBLE
    terminal_states: [SCREENED, EXCLUDED]
    transitions:
      - from: ELIGIBLE
        to: OUTREACH_SENT
        trigger: "POST /screening/programs/{programId}/cohorts/{cohortId}/outreach"
        actor: ProgramAdmin
        preconditions:
          - "cohort.status == ELIGIBLE (ERR_COHORT_INVALID_STATE)"
          - "program.is_active == true (ERR_PROGRAM_INACTIVE)"
          - "program.outreach_mode == PUSH (ERR_PROGRAM_MODE_VIOLATION)"
        side_effects:
          - "create OutreachEvent row"
          - "cohort.status -> OUTREACH_SENT"

      - from: OUTREACH_SENT
        to: ORDERED
        trigger: "cascade from ScreeningOrder ELIGIBLE->KIT_ORDERED for a screening order carrying this cohort_id"
        actor: system
        preconditions: []
        side_effects: []

      - from: ELIGIBLE
        to: ORDERED
        trigger: "cascade from ScreeningOrder ELIGIBLE->KIT_ORDERED for a screening order carrying this cohort_id"
        actor: system
        preconditions: []
        side_effects: []

      - from: ORDERED
        to: SCREENED
        trigger: "cascade from ScreeningOrder IN_LAB->RESULTED"
        actor: system
        preconditions: []
        side_effects: ["program counters recomputed per quality_measure_attribution"]

      - from: ELIGIBLE
        to: EXCLUDED
        trigger: "POST /screening/programs/{programId}/cohorts/{cohortId}/exclude"
        actor: ProgramAdmin
        preconditions:
          - "cohort.status in {ELIGIBLE, OUTREACH_SENT} (ERR_COHORT_INVALID_STATE)"
        side_effects:
          - "cohort.attributed = false"
          - "program counters recomputed"

      - from: OUTREACH_SENT
        to: EXCLUDED
        trigger: "POST /screening/programs/{programId}/cohorts/{cohortId}/exclude"
        actor: ProgramAdmin
        preconditions:
          - "cohort.status in {ELIGIBLE, OUTREACH_SENT} (ERR_COHORT_INVALID_STATE)"
        side_effects:
          - "cohort.attributed = false"
          - "program counters recomputed"

  - entity: Reminder
    initial_state: SCHEDULED
    terminal_states: [SENT, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /screening/orders/{orderId}/reminders/dispatch (dispatches all due reminders)"
        actor: ProgramAdmin
        preconditions:
          - "order.status == KIT_SHIPPED (ERR_ORDER_INVALID_STATE)"
          - "current logical date >= reminder.scheduled_for"
        side_effects:
          - "reminder.sent_at = now"
          - "each due reminder -> SENT"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "system (kit returned before scheduled_for, or order abandoned)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: kit-create-stale-order
    parent_entity: ScreeningOrder
    write_endpoint: "POST /screening/orders/{orderId}/kit"
    occ_field: "expected_order_version"
    description: |
      Creating a ScreeningKit against a ScreeningOrder whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just created a replacement
      kit (which legitimately consumes the order's single outstanding-kit
      slot) and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: kit_turnaround_sla_days
    trigger: "computed read GET /screening/orders/{orderId}/sla"
    algorithm: dual_variant_temporal
    formula: |
      VARIANT default (provisional):
        if order.returned_at is set:
          sla_days = date(returned_at) - date(shipped_at)
        else:
          sla_days = current_logical_date - date(shipped_at)
      VARIANT return_logistics (final, used for adherence reporting):
        if order.returned_at is set:
          sla_days = date(returned_at) - date(shipped_at)   # identical on success
        else:
          sla_days = KIT_ABANDON_DAYS                        # abandoned orders count full allowance
      Both variants are exposed side-by-side in the SLA response.
    constants:
      KIT_ABANDON_DAYS: 45
    precision: "integer days"
    variants:
      - name: provisional
        when: "operational monitoring of in-flight kits"
        difference: "uses current logical date as end when unreturned"
      - name: return_logistics
        when: "adherence/quality reporting"
        difference: "abandoned orders count the full KIT_ABANDON_DAYS allowance"

  - name: reminder_cadence_schedule
    trigger: "ScreeningOrder KIT_ORDERED -> KIT_SHIPPED"
    algorithm: chronological
    formula: |
      For sequence_no in {1, 2, 3}:
        scheduled_for = date(shipped_at) + REMINDER_OFFSETS[sequence_no]
      REMINDER_OFFSETS = {1: 7, 2: 14, 3: 28}
      Dispatch is chronological ascending by (scheduled_for, sequence_no);
      ties impossible because offsets are strictly increasing.
    constants:
      REMINDER_OFFSET_1: 7
      REMINDER_OFFSET_2: 14
      REMINDER_OFFSET_3: 28
    precision: "ISO date"

  - name: quality_measure_attribution
    trigger: "order RESULTED, cohort excluded, patient status change, report snapshot"
    algorithm: aggregation
    formula: |
      denominator (program.attributed_count) =
        count of MemberCohort rows of the program where attributed == true
        AND cohort.status != EXCLUDED
      numerator (program.adherent_count) =
        count of attributed cohorts where a linked ScreeningOrder has
        quality_outcome in {ADHERENT_NEGATIVE, ADHERENT_POSITIVE_NAVIGATED}
      adherence_rate = numerator / denominator, 4 decimals round_half_up;
        0.0000 when denominator == 0
      quality_outcome mapping (recomputed on every relevant event):
        RESULTED + outcome == NEGATIVE                                  -> ADHERENT_NEGATIVE
        RESULTED + outcome == POSITIVE + navigation COMPLETED
          with navigation_completed_at <= navigation_due_at             -> ADHERENT_POSITIVE_NAVIGATED
        RESULTED + outcome == POSITIVE + navigation still PENDING/SCHEDULED -> POSITIVE_NAVIGATION_PENDING
        RESULTED + outcome == POSITIVE + navigation LAPSED              -> POSITIVE_NAVIGATION_LAPSED
        otherwise                                                        -> UNRESOLVED
    precision: "4 decimal places, round_half_up"

  - name: weighted_risk_screen_score
    trigger: "computed read GET /screening/patients/{patientId}/risk-score"
    algorithm: weighted_scoring
    formula: |
      score = 5 * has_recent_symptoms
            + 3 * has_comorbidity
            + 2 * has_family_history
      where each flag is 0 or 1 derived from patient fields supplied at
      Patient creation (recent_symptoms, comorbidity, family_history booleans).
      Score >= 6 => recommended_channel = CLINIC (home kit NOT recommended
      advisory); score <= 5 => HOME_KIT_OK. Advisory only; eligibility is
      governed by the validation rules, not this score.
    constants:
      W_RECENT_SYMPTOMS: 5
      W_COMORBIDITY: 3
      W_FAMILY_HISTORY: 2
      CLINIC_THRESHOLD: 6
    precision: "integer"

  - name: stabilization_window_check
    trigger: "POST /screening/specimens/{specimenId}/process"
    algorithm: threshold
    formula: |
      processing_allowed iff logical_clock_now < kit.stabilization_expires_at
      where stabilization_expires_at = kit.returned_at + STABILIZATION_HOURS hours.
      Boundary: a processing start exactly equal to stabilization_expires_at
      is REJECTED (strict less-than).
    constants:
      STABILIZATION_HOURS: 72
    precision: "ISO timestamp comparison"

  - name: navigation_window_check
    trigger: "ScreeningResult navigation transitions and auto-lapse"
    algorithm: threshold
    formula: |
      navigation_due_at = date(delivered_to_provider_at) + NAVIGATION_WINDOW_DAYS
      On-time completion iff date(navigation_completed_at) <= navigation_due_at
      (inclusive boundary). Auto-lapse fires when current logical date >
      navigation_due_at while navigation_status in {PENDING, SCHEDULED}.
    constants:
      NAVIGATION_WINDOW_DAYS: 90
    precision: "ISO date comparison, inclusive on-time boundary"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3.5
    category: existence
    check: "Request body well-formed: required fields present, types match, enum values valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 4
    category: state
    check: "Order must be in a state permitting the requested transition (per ScreeningOrder state machine)"
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/orders/{orderId}/eligibility/confirm, .../eligibility/reject, .../kit, .../specimens, .../reminders/dispatch"

  - priority: 4.1
    category: state
    check: "Order must be in {PENDING_ELIGIBILITY, ELIGIBLE} for cancel"
    error_id: ERR_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /screening/orders/{orderId}/cancel"

  - priority: 4.2
    category: state
    check: "Kit must be ORDERED for ship and SHIPPED for return"
    error_id: ERR_KIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/kits/{kitId}/ship, POST /screening/kits/{kitId}/return"

  - priority: 4.3
    category: state
    check: "Specimen must be ACCESSIONED for process, ACCESSIONED|PROCESSING for adequacy, PROCESSING for result"
    error_id: ERR_SPECIMEN_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/specimens/{specimenId}/process, .../adequacy, .../result"

  - priority: 4.4
    category: state
    check: "Cohort must be ELIGIBLE for outreach; ELIGIBLE|OUTREACH_SENT for exclude"
    error_id: ERR_COHORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/programs/{programId}/cohorts/{cohortId}/outreach, .../exclude"

  - priority: 4.5
    category: state
    check: "Navigation status must be PENDING for schedule, SCHEDULED for complete"
    error_id: ERR_NAVIGATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/results/{resultId}/navigation/schedule, .../complete"

  - priority: 5
    category: business_concurrency
    check: "expected_order_version (when required) must equal current ScreeningOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /screening/orders/{orderId}/kit"
    note: "OCC check runs after state preconditions, before any other business rule"

  - priority: 6
    category: business_safety
    check: "Patient must be ACTIVE (not DECEASED or OPTED_OUT) for eligibility confirmation"
    error_id: ERR_PATIENT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /screening/orders/{orderId}/eligibility/confirm"

  - priority: 7
    category: business_safety
    check: "Patient age at order creation must be within [45, 75] inclusive"
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /screening/orders/{orderId}/eligibility/confirm"

  - priority: 8
    category: business_safety
    check: "Patient risk_category must not be HIGH (HIGH requires a different test)"
    error_id: ERR_RISK_CATEGORY_EXCLUDED
    http_status: 422
    applies_to: "POST /screening/orders/{orderId}/eligibility/confirm"

  - priority: 9
    category: business_safety
    check: "Patient contraindication_flags must be empty"
    error_id: ERR_CONTRAINDICATION_PRESENT
    http_status: 422
    applies_to: "POST /screening/orders/{orderId}/eligibility/confirm"

  - priority: 10
    category: business_referential
    check: "Provider referenced by the order must be active (is_active == true)"
    error_id: ERR_PROVIDER_INACTIVE
    http_status: 422
    applies_to: "POST /screening/orders"

  - priority: 11
    category: business_referential
    check: "program_id and cohort_id must be consistent: cohort belongs to program; both-or-neither"
    error_id: ERR_COHORT_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /screening/orders"

  - priority: 12
    category: business_constraint
    check: "No other ScreeningOrder for the same patient in an in-flight status (ELIGIBLE, KIT_ORDERED, KIT_SHIPPED, KIT_RETURNED, IN_LAB, RECOLLECTION_REQUESTED)"
    error_id: ERR_ACTIVE_ORDER_EXISTS
    http_status: 409
    applies_to: "POST /screening/orders/{orderId}/kit"

  - priority: 13
    category: business_temporal
    check: "Processing must start strictly before kit.stabilization_expires_at"
    error_id: ERR_STABILIZATION_EXPIRED
    http_status: 422
    applies_to: "POST /screening/specimens/{specimenId}/process"

  - priority: 14
    category: business_temporal
    check: "Reminders may only be dispatched while order.status == KIT_SHIPPED"
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /screening/orders/{orderId}/reminders/dispatch"

  - priority: 15
    category: business_constraint
    check: "Recollection allowed only while order.recollection_round < MAX_RECOLLECTIONS (2)"
    error_id: ERR_RECOLLECTION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /screening/specimens/{specimenId}/adequacy (adequacy=INADEQUATE)"

  - priority: 16
    category: business_constraint
    check: "Specimen adequacy must be ADEQUATE before resulting"
    error_id: ERR_SPECIMEN_NOT_ADEQUATE
    http_status: 422
    applies_to: "POST /screening/specimens/{specimenId}/result"

  - priority: 17
    category: business_constraint
    check: "Program must be active and in PUSH mode for outreach"
    error_id: ERR_PROGRAM_INACTIVE
    http_status: 422
    applies_to: "POST /screening/programs/{programId}/cohorts/{cohortId}/outreach"

  - priority: 18
    category: business_constraint
    check: "Outreach allowed only when program.outreach_mode == PUSH"
    error_id: ERR_PROGRAM_MODE_VIOLATION
    http_status: 422
    applies_to: "POST /screening/programs/{programId}/cohorts/{cohortId}/outreach"

  - priority: 19
    category: business_referential
    check: "Navigation actions only valid on POSITIVE results"
    error_id: ERR_NAVIGATION_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /screening/results/{resultId}/navigation/schedule, .../complete"

  - priority: 20
    category: business_constraint
    check: "Duplicate active patient registration (same external_ref) rejected"
    error_id: ERR_DUPLICATE_PATIENT
    http_status: 409
    applies_to: "POST /screening/patients"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/screening/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "evaluates time-based auto-transitions: KIT_SHIPPED->ABANDONED (abandonment_due_at), RECOLLECTION_REQUESTED->ABANDONED, navigation PENDING/SCHEDULED->LAPSED"

  # --- Health plan programs ---
  - method: POST
    path: "/screening/programs"
    description: "Create a health plan / health system program"
    roles: [ProgramAdmin]
    code: 201
    input: [program_code, program_name, outreach_mode, measure_year, "is_active?"]
    output: HealthPlanProgram
    side_effects: []

  - method: GET
    path: "/screening/programs"
    description: "List programs"
    roles: [ProgramAdmin, Provider, LabTechnician, FulfillmentAgent, Navigator]
    code: 200
    input: ["limit?", "offset?"]
    output: "HealthPlanProgram[]"
    side_effects: []

  - method: GET
    path: "/screening/programs/{programId}"
    description: "Get one program (includes computed counters)"
    roles: [ProgramAdmin, Provider, LabTechnician, FulfillmentAgent, Navigator]
    code: 200
    input: []
    output: HealthPlanProgram
    side_effects: []

  - method: GET
    path: "/screening/programs/{programId}/cohorts"
    description: "List member cohort rows of a program"
    roles: [ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "MemberCohort[]"
    side_effects: []

  - method: POST
    path: "/screening/programs/{programId}/cohorts"
    description: "Enroll a patient into the program's member cohort"
    roles: [ProgramAdmin]
    code: 201
    input: [patient_id]
    output: MemberCohort
    side_effects:
      - "adherence_window_start = today; adherence_window_end = today + ADHERENCE_WINDOW_DAYS - 1"
      - "program.population_size += 1; program.attributed_count recomputed"

  - method: GET
    path: "/screening/programs/{programId}/cohorts/{cohortId}"
    description: "Get one cohort row"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MemberCohort
    side_effects: []

  - method: POST
    path: "/screening/programs/{programId}/cohorts/{cohortId}/outreach"
    description: "Dispatch PUSH outreach to one member"
    roles: [ProgramAdmin]
    code: 201
    input: [channel, template_code]
    output: OutreachEvent
    side_effects: ["cohort.status -> OUTREACH_SENT"]

  - method: POST
    path: "/screening/programs/{programId}/cohorts/{cohortId}/exclude"
    description: "Exclude a member from the measure (e.g. opted out)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MemberCohort
    side_effects: ["cohort.attributed = false; program counters recomputed"]

  - method: GET
    path: "/screening/programs/{programId}/cohorts/{cohortId}/outreach-events"
    description: "List outreach events for one cohort member"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "OutreachEvent[]"
    side_effects: []

  - method: GET
    path: "/screening/cohorts"
    description: "Filtered list of cohort rows across programs"
    roles: [ProgramAdmin]
    code: 200
    input: ["program_id?", "patient_id?", "limit?", "offset?"]
    output: "MemberCohort[]"
    side_effects: []

  - method: GET
    path: "/screening/cohorts/{cohortId}"
    description: "Get one cohort row by id"
    roles: [ProgramAdmin]
    code: 200
    input: []
