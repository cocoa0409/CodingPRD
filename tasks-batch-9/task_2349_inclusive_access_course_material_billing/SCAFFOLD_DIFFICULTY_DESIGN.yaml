  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_opt_out_cycle_terminates_at_max_opt_out_cycles
        grounds:
          - state_machines.OptOutRequest.GRANTED_to_RESCINDED
          - state_machines.OptOutRequest.RESCINDED_to_SUBMITTED
          - state_machines.StudentCharge.REFUNDED_to_POSTED
          - state_machines.StudentCharge.RESTORED_to_REVOKED
          - validations[priority=91]
          - errors[ERR_OPT_OUT_CYCLE_LIMIT]
        distinguishing_aspect: |
          The cycle SUBMITTED -> GRANTED -> RESCINDED -> SUBMITTED is traversed the full
          MAX_OPT_OUT_CYCLES (2) times and the third re-entry is refused with
          ERR_OPT_OUT_CYCLE_LIMIT, so the loop has a hard termination condition rather than being
          unbounded; the charge's two parallel dimensions ride the loop in lockstep
          (billing POSTED <-> REFUNDED, access PROVISIONED -> REVOKED <-> RESTORED) and land back
          on their original values.
