  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bill_post_then_void_leaves_balance_unchanged
        grounds:
          - state_machines.Bill.DRAFT_to_POSTED
          - state_machines.Bill.POSTED_to_VOID
          - calculations.account_balance_reconciliation
        distinguishing_aspect: |
          Conserved quantity: Account.balance_due_cents. POST adds total_cents (18980 -> balance 18980);
          the compensating VOID subtracts the same total_cents, leaving balance_due_cents back at 0.
          The forward+compensating pair conserves the ledger balance exactly.
        test_recipe:
          setup:
            - "Account with one bill (amount_billed 18980) posted then voided (no payment applied)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "19 St" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
