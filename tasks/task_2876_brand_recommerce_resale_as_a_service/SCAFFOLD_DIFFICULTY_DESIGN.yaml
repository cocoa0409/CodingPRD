scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_credit_quote_versus_issuance_diverges_on_identical_grade
        grounds:
          - calculations.trade_in_appraised_credit
          - entities.TradeIn.fields.appraised_credit_minor
          - entities.Customer.fields.loyalty_tier
          - entities.CreditGrant.fields.issued_amount_minor
          - state_machines.TradeIn.AUTHENTICATED_to_ACCEPTED
        distinguishing_aspect: |
          The dual variant sits on the TradeIn / brand-currency domain: quote_provisional omits
          the PLUS loyalty bonus while issuance_final includes it, so for a PLUS customer whose
          assessed_grade equals declared_grade the quote is 46200 and the issued grant is 48300
          — a 2100 divergence on byte-identical trade-in data.
        test_recipe:
          setup:
            - "One ACTIVE GradePolicy for FOOTWEAR grade A with base_credit_pct_bp 3500."
            - "One ACTIVE CreditPolicy with mail_in_bonus_pct_bp 1000 and expiry_days 180."
            - "One ACTIVE StoreLocation and one PLUS-tier Customer."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "A MAIL_IN trade-in of a FOOTWEAR item, declared_grade A, msrp_minor 120000, received and authenticated GENUINE with assessed_grade A."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id", quote_minor: "$.data.appraised_credit_minor" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "A" }
              as: Authenticator
              as_user_id: "auth-001"
          trigger:
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { final_minor: "$.data.appraised_credit_minor" }
            - call: "GET /recommerce/credit-grants?trade_in_id=${ti_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { grant_id: "$.data[0].id", granted_minor: "$.data[0].issued_amount_minor" }
          assert:
            - "${quote_minor} == 46200  # quote_provisional: base 42000 + mail-in bonus 4200, no loyalty bonus"
            - "${final_minor} == 48300  # issuance_final: base 42000 + mail-in bonus 4200 + PLUS bonus 2100"
            - "${final_minor} - ${quote_minor} == 2100"
            - "${granted_minor} == 48300 and CreditGrant.${grant_id}.remaining_minor == 48300"
            - "CreditGrant.${grant_id}.status == ISSUED"
            - "CreditGrant.${grant_id}.expires_at == 2027-01-28T00:00:00Z"
            - "TradeIn.${ti_id}.declared_grade == A and TradeIn.${ti_id}.assessed_grade == A  # the divergence is the variant, not the grade"
            - "Customer.${cust_id}.credit_balance_minor == 48300"

      - name: return_refund_remorse_versus_warranty_diverges_on_identical_order
        grounds:
          - calculations.return_refund_settlement
          - entities.ResaleOrder.fields.refund_cash_minor
          - entities.ResaleOrder.fields.restock_fee_minor
          - entities.GradePolicy.fields.restock_fee_pct_bp
          - state_machines.ResaleOrder.RETURN_REQUESTED_to_RETURNED
        distinguishing_aspect: |
          The dual variant sits on the ResaleOrder / refund domain, a different entity domain
          from the TradeIn credit appraisal: on two orders with identical gross 19500, fee 1755
          and cash_due 21255, remorse_return refunds 17160 (channel fee 1755 and restock fee
          2340 both retained) while warranty_defect_return refunds the full 21255.
        test_recipe:
          setup:
            - "One ACTIVE GradePolicy for OUTERWEAR grade B with resale_price_pct_bp 3900 and restock_fee_pct_bp 1200."
            - "One RESALE_MARKETPLACE channel with max_resale_price_ratio_bp 7000."
            - "One OUTERWEAR grade B unit derived from a 50000-msrp trade-in, refurbished with no task lines, listed at list_price_minor 19500."
            - "The unit is bought with requested_credit_minor 0, fulfilled, returned as BUYER_REMORSE and refunded; then re-listed at the same 19500 and bought again."
            - "Logical clock held at 2026-08-01T00:00:00Z throughout, so no return window closes."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-R1", bay_type: "REPAIR" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_id: "$.data.id" }
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti_id}"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { unit_id: "$.data[0].id", unit_ver: "$.data[0].version" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${unit_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_id: "$.data.id" }
            - call: "POST /recommerce/refurb-orders/${ro_id}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro_id}/submit-qc"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
            - call: "POST /recommerce/refurb-orders/${ro_id}/qc-decision"
              payload: { decision: "PASS" }
              as: RefurbTechnician
              as_user_id: "tech-002"
            - call: "POST /recommerce/resale-units/${unit_id}/list"
              payload: { channel_id: "${chan_id}" }
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_ver_1: "$.data.version" }
            - call: "POST /recommerce/resale-orders"
              payload: { customer_id: "${cust_id}", channel_id: "${chan_id}", resale_unit_id: "${unit_id}", requested_credit_minor: 0, expected_customer_version: "${cust_ver_1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_1: "$.data.id", gross_1: "$.data.gross_price_minor", fee_1: "$.data.channel_fee_minor", cash_1: "$.data.cash_due_minor" }
            - call: "POST /recommerce/resale-orders/${ord_1}/fulfill"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "POST /recommerce/resale-orders/${ord_1}/return-request"
              payload: { reason_type: "BUYER_REMORSE" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /recommerce/resale-orders/${ord_1}/settle-return"
              payload: { resolution: "REFUND" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { remorse_cash: "$.data.refund_cash_minor", remorse_restock: "$.data.restock_fee_minor" }
            - call: "POST /recommerce/resale-units/${unit_id}/list"
              payload: { channel_id: "${chan_id}" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { relist_price: "$.data.list_price_minor" }
            - call: "GET /recommerce/customers/${cust_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_ver_2: "$.data.version" }
            - call: "POST /recommerce/resale-orders"
              payload: { customer_id: "${cust_id}", channel_id: "${chan_id}", resale_unit_id: "${unit_id}", requested_credit_minor: 0, expected_customer_version: "${cust_ver_2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_2: "$.data.id", gross_2: "$.data.gross_price_minor", fee_2: "$.data.channel_fee_minor", cash_2: "$.data.cash_due_minor" }
            - call: "POST /recommerce/resale-orders/${ord_2}/fulfill"
              payload: {}
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "POST /recommerce/resale-orders/${ord_2}/return-request"
              payload: { reason_type: "WARRANTY_DEFECT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /recommerce/resale-orders/${ord_2}/settle-return"
              payload: { resolution: "REFUND" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { warranty_cash: "$.data.refund_cash_minor", warranty_restock: "$.data.restock_fee_minor" }
          assert:
            - "${gross_1} == 19500 and ${gross_2} == 19500 and ${relist_price} == 19500  # identical price data on both orders"
            - "${fee_1} == 1755 and ${fee_2} == 1755"
            - "${cash_1} == 21255 and ${cash_2} == 21255"
            - "${remorse_restock} == 2340  # ceil(19500 * 1200 / 10000)"
            - "${remorse_cash} == 17160  # 21255 - 1755 channel fee - 2340 restocking fee"
            - "${warranty_restock} == 0"
            - "${warranty_cash} == 21255  # channel fee refunded, no restocking fee"
            - "${warranty_cash} - ${remorse_cash} == 4095"
            - "ResaleOrder.${ord_1}.refund_credit_minor == 0 and ResaleOrder.${ord_2}.refund_credit_minor == 0"
            - "ResaleOrder.${ord_1}.status == RETURNED and ResaleOrder.${ord_2}.status == RETURNED"

  - rule_id: combinatorial_formula
    instances:
      - name: refurb_cost_rounds_per_task_line_before_summation
        grounds:
          - calculations.refurb_logged_cost
          - entities.RefurbTask.fields.cost_minor
          - entities.RefurbOrder.fields.logged_cost_minor
          - entities.RefurbBay.fields.bay_type
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: each REPAIR line of 2 minutes is
          round_half_up(2 * 145 * 13500 / 10000) = round_half_up(391.5) = 392, so two identical
          lines sum to 784; summing the raw products first and rounding once would give 783, so
          the one-minor-unit gap proves the pinned per-line-then-sum order.
        test_recipe:
          setup:
            - "One ACTIVE GradePolicy for OUTERWEAR grade B with resale_price_pct_bp 3900 and refurb_budget_cap_pct_bp 3000."
            - "One REPAIR bay, so BAY_TYPE_MULTIPLIER_BP resolves to 13500."
            - "One OUTERWEAR grade B resale unit in lifecycle_state INTAKE from a 50000-msrp accepted trade-in."
            - "A refurbishment order on that unit, started and IN_PROGRESS, with no task lines yet."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-R1", bay_type: "REPAIR" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { unit_id: "$.data[0].id", unit_ver: "$.data[0].version" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_id}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${unit_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_id: "$.data.id" }
            - call: "POST /recommerce/refurb-orders/${ro_id}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-001"
          trigger:
            - call: "POST /recommerce/refurb-orders/${ro_id}/tasks"
              payload: { task_type: "REPAIR_SEAM", labor_minutes: 2, parts_cost_minor: 0 }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { line_1_cost: "$.data.cost_minor", line_1_seq: "$.data.sequence_no" }
            - call: "POST /recommerce/refurb-orders/${ro_id}/tasks"
              payload: { task_type: "REPAIR_SOLE", labor_minutes: 2, parts_cost_minor: 0 }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { line_2_cost: "$.data.cost_minor", line_2_seq: "$.data.sequence_no" }
            - call: "GET /recommerce/refurb-orders/${ro_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { order_cost: "$.data.logged_cost_minor", order_ratio: "$.data.viability_ratio_bp" }
          assert:
            - "${line_1_cost} == 392 and ${line_2_cost} == 392  # round_half_up(391.5) per line"
            - "${order_cost} == 784  # per-line rounding then summation"
            - "${order_cost} != 783  # sum-then-round would have produced 783"
            - "${line_1_seq} == 1 and ${line_2_seq} == 2"
            - "${order_ratio} == 402  # floor(784 * 10000 / floor(50000 * 3900 / 10000)) = floor(784 * 10000 / 19500)"
            - "RefurbOrder.${ro_id}.status == IN_PROGRESS  # logging tasks does not move the order"

      - name: resale_settlement_fee_tier_keyed_on_gross_not_order_total
        grounds:
          - calculations.resale_order_settlement
          - entities.ResaleOrder.fields.channel_fee_minor
          - entities.ResaleOrder.fields.order_total_minor
          - entities.ResaleOrder.fields.cash_due_minor
          - entities.CreditPolicy.fields.max_redemption_pct_bp
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: order_total
          contains the channel fee, yet the CHANNEL_FEE_TIERS band is selected from
          gross_price_minor 19500 (900 bp, fee 1755, total 21255). Keying the band on the
          resulting total 21255 would have selected 650 bp and produced fee 1268 / total 20768,
          so the two orders are observably different values on the same order.
        test_recipe:
          setup:
            - "One ACTIVE GradePolicy for OUTERWEAR grade B (resale_price_pct_bp 3900) and one ACTIVE CreditPolicy with max_redemption_pct_bp 5000 and min_cash_remainder_minor 500."
            - "A PLUS customer whose MAIL_IN OUTERWEAR grade B trade-in of msrp 50000 issued 11500 of brand currency."
            - "That same unit refurbished with no task lines (logged_cost_minor 0, capitalized_cost_minor 11500) and listed at list_price_minor 19500 on a RESALE_MARKETPLACE channel."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
