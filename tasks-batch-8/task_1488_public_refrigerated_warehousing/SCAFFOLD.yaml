    output: BlastFreezeBooking
    side_effects:
      - "pallet_count <= cell.capacity_pallets (ERR_CELL_CAPACITY_EXCEEDED)"
      - "conflict iff any booking on same cell with status in {SCHEDULED, IN_PROGRESS} satisfies: new.window_start < existing.window_end + turnaround_minutes AND existing.window_start < new.window_end + turnaround_minutes (ERR_BOOKING_WINDOW_CONFLICT); gap must be >= turnaround_minutes, so mere adjacency still conflicts when turnaround > 0"
  - method: GET
    path: "/api/blast-freeze-bookings/{id}"
    description: "Get booking"
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: []
    output: BlastFreezeBooking
    side_effects: []
  - method: GET
    path: "/api/blast-freeze-bookings"
