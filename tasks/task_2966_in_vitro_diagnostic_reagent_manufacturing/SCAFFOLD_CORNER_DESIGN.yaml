      - name: child_collections_are_reachable_from_each_declared_parent_and_start_empty
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_material_lots_id_lot_components
          - endpoints.GET_reagent_lots_id_components
          - endpoints.GET_fill_runs_id_samples
          - endpoints.GET_reagent_lots_id_allocations
        distinguishing_aspect: "The LotComponent junction is the only entity reachable from two different parents, so the same dispensing row must appear under the material lot AND under the reagent lot with the same id. The instance also pins the empty-collection contract: a lot with no allocations yet returns an empty paginated array rather than a 404, and each child list honours its own declared filter."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One QUALIFIED material lot dispensed once into ReagentLot EP-LOT-3, plus one SCHEDULED FillRun carrying two MonitoringSamples of different types."
