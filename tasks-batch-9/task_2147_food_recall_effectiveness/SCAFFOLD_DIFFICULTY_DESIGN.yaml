          Interval semantics #2 on a different resource entity (the Consignee contact timeline):
          the forbidden interval is not a stored window but a BUFFER derived as
          max(METHOD_BUFFER_HOURS[new], METHOD_BUFFER_HOURS[prior]) = max(24, 12) = 24 hours, and
          the edge is admitted — 23 hours after the PHONE attempt is rejected while exactly 24
