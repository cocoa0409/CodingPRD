# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1159: Farmland Leasing & Cash-Rent Management
# Enumerates the testable claims of SCAFFOLD.yaml §1.1-§1.7 NOT already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections follow the
# claim-extraction-guide taxonomy. Negative triggers capture $.data.error_id.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: landlord_creation_applies_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - "entities.Landlord.fields.absentee"
          - "entities.Landlord.fields.report_channel"
          - "entities.Landlord.fields.ack_required_days"
          - "entities.Landlord.fields.total_received_cents"
        distinguishing_aspect: "Omitting optional landlord fields applies defaults (absentee false, EMAIL, 14 days); computed balances start at 0 and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /landlords"
              payload: { name: "L Dflt", contact_email: "ld@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
                ab: "$.data.absentee"
                ch: "$.data.report_channel"
                ack: "$.data.ack_required_days"
                bal: "$.data.total_received_cents"
                ver: "$.data.version"
          assert:
            - "absentee == false, report_channel == EMAIL, ack_required_days == 14 (defaults applied)"
            - "total_received_cents == 0 and pending_receivable_cents == 0 (computed fields initialized)"
            - "version == 1 and id is a server-minted UUID"

      - name: lease_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET on a well-formed but nonexistent lease UUID returns 404 ERR_NOT_FOUND under the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /leases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FarmManager
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: field_creation_missing_required_acres_rejected
        claim_type: required_fields
        grounds:
          - "entities.Field.fields.acres"
          - "validations[priority=3]"
        distinguishing_aspect: "POST /fields without the required acres field is rejected with ERR_VALIDATION 400 before any state change."
        test_recipe:
          setup: ["one landlord exists"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Req", contact_email: "lr@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
          trigger:
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FNoAcres", soil_csr2: 80 }
              as: FarmManager
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_VALIDATION (required field acres missing)"

      - name: bid_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Bid.fields.lease_type"
          - "validations[priority=3]"
        distinguishing_aspect: "lease_type outside the enum CASH|FLEX|SHARE is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["approved tenant, field, and OPEN offering exist"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L En", contact_email: "le@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T En", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FEn", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
          trigger:
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "GROSS", cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_VALIDATION (invalid enum member)"

      - name: bid_create_flex_missing_conditional_params_rejected
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "entities.Bid.fields.flex_cap_cents"
        distinguishing_aspect: "A FLEX bid missing the conditional flex_cap_cents parameter fails ERR_VALIDATION even though all base required fields are present."
        test_recipe:
          setup: ["approved tenant, field, OPEN offering"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Cn", contact_email: "lc2@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Cn", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FCn", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
          trigger:
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "FLEX", flex_base_per_acre_cents: 20000, flex_bonus_pct: 0.2, revenue_trigger_cents: 9000000, cash_equivalent_bid_cents_per_acre: 22000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_VALIDATION (flex_cap_cents is conditionally required for FLEX bids)"

      - name: expense_create_computed_share_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.ExpenseRecord.fields.landlord_share_cents"
          - "calculations.share_settlement"
        distinguishing_aspect: "A client-supplied landlord_share_cents on expense creation is ignored; the server computes round_half_up(100001 * 0.5) = 50001 from the lease's input_share_pct."
        test_recipe:
          setup: ["SHARE lease ACTIVE (input_share_pct 0.5) — chain identical to difficulty instance share_settlement_per_line_rounding up through activation"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Ci", contact_email: "lci@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Ci", years_experience: 15 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FCi", acres: 100, soil_csr2: 90 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "SHARE", landlord_share_pct: 0.4, input_share_pct: 0.5, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "NONE", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
          trigger:
            - call: "POST /expenses"
              payload: { lease_id: "${lse}", category: "SEED", total_cost_cents: 100001, incurred_date: "2027-04-10T00:00:00Z", crop_year: 2027, landlord_share_cents: 999999 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                share: "$.data.landlord_share_cents"
                pct: "$.data.landlord_share_pct"
          assert:
            - "response landlord_share_cents == 50001 (server-computed; the 999999 input is ignored)"
            - "response landlord_share_pct == 0.5 (copied from the lease)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: created_entities_start_in_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.LeaseOffering"
          - "state_machines.Bid"
          - "state_machines.Lease"
          - "state_machines.Tenant"
        distinguishing_aspect: "Newly created Tenant is APPLICANT, LeaseOffering is OPEN, Bid is SUBMITTED, Lease is DRAFT — each machine's declared initial_state holds at creation."
        test_recipe:
          setup: ["landlord, tenant (APPLICANT observed), field, offering, bid created"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Ini", contact_email: "li2@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Ini", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
                t_st: "$.data.status"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FIni", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
                o_st: "$.data.status"
                o_cnt: "$.data.eligible_bid_count"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
                b_st: "$.data.status"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
                l_st: "$.data.status"
          assert:
            - "tenant ${tn}.status == APPLICANT at creation"
            - "offering ${off}.status == OPEN and eligible_bid_count == 0 at creation"
            - "bid ${bid}.status == SUBMITTED at creation"
            - "lease ${lse}.status == DRAFT at creation"

      - name: lease_double_activate_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Lease.DRAFT_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Activating an already-ACTIVE lease is not idempotent: the second call fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["CASH lease ACTIVE (standard cash chain)"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L DA", contact_email: "lda@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T DA", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FDA", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
          trigger:
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_INVALID_STATE (ACTIVE is not a valid from-state for activate)"

      - name: awarded_offering_close_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.LeaseOffering"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "AWARDED is terminal: closing an awarded offering fails ERR_INVALID_STATE and no bid states change."
        test_recipe:
          setup: ["offering AWARDED to a bid (standard cash chain through award)"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L TL", contact_email: "ltl@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T TL", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FTL", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
          trigger:
            - call: "POST /offerings/${off}/close"
              as: FarmManager
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_INVALID_STATE (AWARDED is terminal)"
            - "bid ${bid} remains ACCEPTED (no side effects fired)"

      - name: bid_withdraw_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Bid.SUBMITTED_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal for bids: a second withdraw of the same bid fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN offering with one SUBMITTED bid"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L WW", contact_email: "lww@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T WW", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FWW", acres: 100, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/withdraw"
              as: Tenant
              as_user_id: "${tn}"
          trigger:
            - call: "POST /bids/${bid}/withdraw"
              as: Tenant
              as_user_id: "${tn}"
              captures:
                err: "$.data.error_id"
          assert:
            - "error_id == ERR_INVALID_STATE (second withdraw from WITHDRAWN)"

      - name: lease_activation_generates_exact_installments
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Lease.DRAFT_to_ACTIVE"
          - "calculations.rent_schedule_generation"
        distinguishing_aspect: "Activation runs rent_schedule_generation with pinned rounding: annual 25001*101 = 2525101 splits into first 1262551 (round_half_up) and remainder-to-last 1262550, with dues 2027-03-01 and 2027-11-01."
        test_recipe:
          setup: ["awarded CASH bid 25001 cents/acre on a 101-acre field; lease DRAFT with MAR_NOV_50_50"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L GI", contact_email: "lgi@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T GI", years_experience: 5 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "FGI", acres: 101, soil_csr2: 80 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25001, cash_equivalent_bid_cents_per_acre: 25001 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
          trigger:
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                a1: "$.data[0].amount_cents"
                d1: "$.data[0].due_date"
                s1: "$.data[0].status"
                a2: "$.data[1].amount_cents"
                d2: "$.data[1].due_date"
          assert:
            - "installment[0].amount_cents == 1262551 (round_half_up(2525101*0.5)) due 2027-03-01T00:00:00Z, status SCHEDULED"
            - "installment[1].amount_cents == 1262550 (remainder-to-last: 2525101 - 1262551) due 2027-11-01T00:00:00Z"
            - "exactly 2 installments exist for the lease; field ${fld}.status == LEASED after activation"

      - name: late_fee_applied_once_and_waterfall_pays_fee_first
        claim_type: side_effect_execution
        grounds:
          - "state_machines.PaymentInstallment.OPEN_to_LATE"
          - "calculations.late_fee_and_allocation"
        distinguishing_aspect: "Crossing the grace boundary stamps a one-time fee of round_half_up(1250000*0.05) = 62500; a partial payment of exactly 62500 clears the fee first and leaves the installment LATE with paid_cents 62500; paying the remaining 1250000 then flips it PAID with total paid 1312500."
        test_recipe:
          setup: ["CASH lease ACTIVE, I1 1250000 due 2027-03-01; clock 2027-03-12 (past due+10d grace)"]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L LF", contact_email: "llf@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
