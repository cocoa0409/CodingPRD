      - name: settle_blocked_without_approved_fee_disclosure
        grounds:
          - state_machines.SettlementRun.DRAFT_to_SETTLED
          - entities.ATM.fields.fee_disclosure_id
          - validations[priority=11]
        distinguishing_aspect: |
          Different entity pair SettlementRun->FeeDisclosure(/ATM): a DRAFT run cannot settle
          when the ATM has no APPROVED FeeDisclosure (fee_disclosure_id null) -> ERR_NO_FEE_DISCLOSURE.
        test_recipe:
          setup:
            - "ATM with NO approved fee disclosure (only a DRAFT one). One WITHDRAWAL exists; DRAFT settlement run created."
          setup_api_calls:
            - call: "POST /vaults"
