        distinguishing_aspect: "A customer decision on a line still in PROPOSED returns 409 ERR_PART_LINE_INVALID_STATE, and voiding a note that is already VOID returns 409 ERR_CREDIT_NOTE_INVALID_STATE - each entity answering with its own state error and leaving the ledger untouched."
