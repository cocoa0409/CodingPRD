      # ---- side-effect: control-plan revision approve supersedes prior + flips needs_review ----
      - name: revision_approve_supersedes_prior_and_flags_inspection_plans
        claim_type: side_effect_execution
        grounds:
          - state_machines.ControlPlanRevision.DRAFT_to_APPROVED
          - state_machines.ControlPlanRevision.APPROVED_to_SUPERSEDED
          - entities.ControlPlan.fields.current_revision_no
          - entities.InspectionPlan.fields.needs_review
        distinguishing_aspect: "Approving revision #2 sets ControlPlan.current_revision_no=2, supersedes the prior APPROVED revision #1 (->SUPERSEDED), and cascades needs_review=true onto every InspectionPlan linked to that control plan."
        test_recipe:
          setup:
            - "A QualityEngineer and a QualityManager exist; a ControlPlan with an APPROVED revision #1 and a linked InspectionPlan exist; a DRAFT revision #2 has been created."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Rs", email: "qers@x.com", role: "QUALITY_ENGINEER" }
