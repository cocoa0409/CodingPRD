              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "Zed", declared_weight_lb: 150 }, { full_name: "Amy", declared_weight_lb: 150 }, { full_name: "Bob", declared_weight_lb: 150 } ] }
