            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["BLOOD_TRANSFUSION_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-9201" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-9201" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v: $.data.version }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v}", primary_offer_slots: 2, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 240 }, { sequence_position: 2, center_code: "CTR-B", candidate_code: "CAND-B", acceptance_clock_minutes: 240 }, { sequence_position: 3, center_code: "CTR-C", candidate_code: "CAND-C", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id, pending_fill: $.data.pending_offer_count, free_fill: $.data.slots_free }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer1_id: "$.data[0].id", offer2_id: "$.data[1].id", offer3_id: "$.data[2].id", offer3_state_fill: "$.data[2].status" }
          trigger:
            - call: "POST /opo/match-runs/${run_id}/offers/${offer1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: AllocationSpecialist
              as_user_id: "alloc-1"
            - call: "GET /opo/match-runs/${run_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { run_state_accepted: $.data.status, pending_accepted: $.data.pending_offer_count, free_accepted: $.data.slots_free }
            - call: "POST /opo/match-runs/${run_id}/offers/${offer1_id}/respond"
              payload: { decision: "WITHDRAW_ACCEPTANCE" }
              as: AllocationSpecialist
              as_user_id: "alloc-1"
            - call: "GET /opo/match-runs/${run_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { run_state_withdrawn: $.data.status, pending_withdrawn: $.data.pending_offer_count, free_withdrawn: $.data.slots_free }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer1_final: "$.data[0].status", offer2_final: "$.data[1].status", offer3_final: "$.data[2].status" }
          assert:
            - "${pending_fill} == 2 and ${free_fill} == 0 and ${offer3_state_fill} == QUEUED, so the invariant holds at 2 + 0 == 2"
            - "${run_state_accepted} == CLOSED, ${pending_accepted} == 0 and ${free_accepted} == 2, so the invariant holds at 0 + 2 == 2"
            - "immediately after the acceptance OrganOffer.${offer2_id} and OrganOffer.${offer3_id} were BYPASSED with bypass_reason PEER_ACCEPTED"
            - "${run_state_withdrawn} == OPEN with closed_reason null, ${pending_withdrawn} == 2 and ${free_withdrawn} == 0, so the invariant holds at 2 + 0 == 2"
            - "${offer1_final} == WITHDRAWN, ${offer2_final} == PENDING, ${offer3_final} == PENDING, all with bypass_reason null"
            - "Organ.${organ_id}.status == OFFERING with accepted_offer_id null and DonorCase.${case_id}.allocation_status == OFFERS_IN_FLIGHT, organs_accepted_count == 0"
