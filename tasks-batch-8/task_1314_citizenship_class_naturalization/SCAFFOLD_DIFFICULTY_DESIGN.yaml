              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vp_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vs_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/workshops"
              payload: { title: "N-400 Workshop", supervising_volunteer_id: "${vs_id}", scheduled_start: "2026-08-05T10:00:00Z", duration_hours: 3, capacity: 5 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id, ws_v: $.data.version }
            - call: "POST /naturalization/workshops/${ws_id}/seats"
              payload: { applicant_id: "${app_id}", expected_workshop_version: "${ws_v}" }
              as: IntakeCoordinator
              captures: { seat_id: $.data.id }
          trigger:
            - call: "POST /naturalization/applicants/${app_id}/packets"
              payload: { workshop_seat_id: "${seat_id}", prepared_by_volunteer_id: "${vp_id}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_WORKSHOP_NOT_ATTENDED (seat is RESERVED; workshop still SCHEDULED)"
            - "no packet row created: GET /naturalization/packets?applicant_id=${app_id} returns total_count == 0"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: class_section_room_halfopen_adjacency
        grounds:
          - validations[priority=11]
          - entities.ClassSection.fields.room_id
        distinguishing_aspect: |
          Semantics 1 (half-open, adjacency allowed) on resource room_id: MON
          [600,660) then MON [660,720) in the same room is ACCEPTED (touching
          endpoints do not overlap); MON [630,690) is REJECTED; the same overlapping
          window in a DIFFERENT room is accepted.
        test_recipe:
          setup:
            - "GENERAL instructor; one existing section R1 MON [600,660)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/class-sections"
              payload: { title: "S1", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 10, total_sessions: 10 }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /naturalization/class-sections"
              payload: { title: "S2", weekday: "MON", start_minute: 660, end_minute: 720, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 10, total_sessions: 10 }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /naturalization/class-sections"
              payload: { title: "S3", weekday: "MON", start_minute: 630, end_minute: 690, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 10, total_sessions: 10 }
              as: ProgramAdmin
              captures: { err_s3: $.data.error_id }
            - call: "POST /naturalization/class-sections"
              payload: { title: "S4", weekday: "MON", start_minute: 630, end_minute: 690, room_id: "R2", instructor_volunteer_id: "${vol_id}", capacity: 10, total_sessions: 10 }
              as: ProgramAdmin
              captures: { s4_id: $.data.id }
          assert:
            - "S2 created (201): adjacency [600,660) vs [660,720) is not an overlap under half-open semantics"
            - "S3 rejected with ERR_SCHEDULE_CONFLICT (true overlap [630,660))"
            - "S4 created (201): overlap check is scoped per room_id"
            - "S2.weekday scoping: the same window on a different weekday would also pass (MON vs TUE are disjoint resources)"

      - name: mock_interview_volunteer_buffer_gap
        grounds:
          - validations[priority=11]
          - entities.MockInterview.fields.volunteer_id
        distinguishing_aspect: |
          Semantics 2 (mandatory buffer, different from half-open) on resource
          volunteer_id: a new interview must leave gap >= mock_buffer_minutes (15)
          from any non-cancelled interview of the same volunteer; a 14-minute gap is
          rejected with ERR_INTERVIEW_SLOT_CONFLICT while exactly 15 minutes passes.
        test_recipe:
          setup:
            - "GENERAL volunteer; eligible applicant (attained 80 >= 40); existing interview 2026-08-10T10:00:00Z + 30 min (ends 10:30)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Vic Torres", email: "vic@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T10:00:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T10:44:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { err_m2: $.data.error_id }
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T10:45:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { m3_id: $.data.id }
          assert:
            - "10:44 start rejected with ERR_INTERVIEW_SLOT_CONFLICT (gap 14 < 15)"
            - "10:45 start accepted (201): gap exactly 15 == mock_buffer_minutes is allowed"
            - "MockInterview.${m3_id}.status == SCHEDULED"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_ledger_enroll_withdraw_conservation
        grounds:
          - calculations.seat_ledger
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: ClassSection.enrolled_count == COUNT(enrollments with
          status ENROLLED). Forward action enroll (+1) paired with its compensating
          withdraw (-1) returns the ledger to its prior value, verified against the
          authoritative filtered list count — no drift.
        test_recipe:
          setup:
            - "Section capacity 2; A and B ENROLLED (enrolled_count 2, seats_open 0)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/class-sections"
              payload: { title: "Ledger", weekday: "FRI", start_minute: 600, end_minute: 660, room_id: "R7", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v0: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /naturalization/applicants/${a_id}/screenings"
              payload: { expected_applicant_version: "${a_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${a_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
              captures: { enr_a: $.data.id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v1: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "B Two", email: "b@x.com", date_of_birth: "1991-01-01" }
              as: IntakeCoordinator
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /naturalization/applicants/${b_id}/screenings"
              payload: { expected_applicant_version: "${b_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 35, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${b_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v1}" }
              as: IntakeCoordinator
              captures: { enr_b: $.data.id }
          trigger:
            - call: "POST /naturalization/enrollments/${enr_a}/withdraw"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_after_wd: $.data.enrolled_count, sec_v2: $.data.version }
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${a_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v2}" }
              as: IntakeCoordinator
              captures: { enr_a2: $.data.id }
            - call: "GET /naturalization/enrollments?class_section_id=${sec_id}&status=ENROLLED"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "after withdraw: ClassSection.enrolled_count == 1 (compensation applied exactly once)"
            - "after re-enroll: ClassSection.enrolled_count == 2 AND seats_open == 0"
            - "GET filtered list total_count == 2 == ClassSection.enrolled_count (derived counter reconciles with source rows)"
            - "Enrollment.${enr_a}.status == WITHDRAWN and Enrollment.${enr_a2}.status == ENROLLED (re-enrollment creates a new row; no resurrection)"

      - name: supervised_hours_complete_reverse_conservation
        grounds:
          - calculations.workshop_hours_ledger
          - state_machines.Workshop.COMPLETED_to_COMPLETION_REVERSED
        distinguishing_aspect: |
          Conserved quantity (different from seats): Volunteer.supervised_hours of
          the assisting volunteer. Workshop complete (+duration_hours) paired with
          reverse-completion (-duration_hours) leaves the assistant's supervised_hours
          exactly at its prior value; the conserved quantity is hours, not counts.
        test_recipe:
          setup:
            - "LEGAL supervisor Vs; GENERAL assistant Va with supervised_hours 0; workshop duration 3 held at 2026-08-05; one RESERVED seat (no packets created)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vs_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Asst Vol", email: "va@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { va_id: $.data.id }
            - call: "POST /naturalization/volunteers/${va_id}/training-credits"
              payload: { topic: "forms", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${va_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/workshops"
              payload: { title: "Apprentice WS", supervising_volunteer_id: "${vs_id}", assisting_volunteer_id: "${va_id}", scheduled_start: "2026-08-05T10:00:00Z", duration_hours: 3, capacity: 3 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/workshops/${ws_id}/complete"
              payload: {}
              as: Volunteer
              as_user_id: "${vs_id}"
            - call: "GET /naturalization/volunteers/${va_id}"
              payload: {}
              as: ProgramAdmin
              captures: { hours_after_complete: $.data.supervised_hours }
            - call: "POST /naturalization/workshops/${ws_id}/reverse-completion"
              payload: {}
              as: ProgramAdmin
            - call: "GET /naturalization/volunteers/${va_id}"
              payload: {}
              as: ProgramAdmin
              captures: { hours_after_reverse: $.data.supervised_hours }
          assert:
            - "hours_after_complete == 3 (credit of duration_hours)"
            - "hours_after_reverse == 0 (exact debit; complete+reverse pair conserves the assistant's supervised_hours)"
            - "Workshop.${ws_id}.status == COMPLETION_REVERSED"
