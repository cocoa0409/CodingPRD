        claim_type: conditional_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_CAPITAL_REVIEW_REQUIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / capital_equipment_certification_reads_the_committee_meeting_minutes_state
          rationale: "That instance certifies EQUIPMENT below and at the CAPITAL_THRESHOLD_CENTS boundary, so the gate is shown to apply only above it and only with quorate EQUIPMENT_REVIEW minutes."

      - name: admin_cap_is_evaluated_against_the_running_admin_total_not_the_single_line
        claim_type: aggregate_validation
        grounds:
          - validations[priority=38]
          - errors[ERR_ADMIN_CAP_EXCEEDED]
          - entities.GrantAward.fields.admin_obligated_cents
          - entities.GrantAward.fields.admin_cap_cents
        distinguishing_aspect: |
          Every one of the three ADMINISTRATION lines is individually far below the 250000 cap, so a per-line check passes
          all three. The rule is stated as admin_obligated_cents + this line's approved_cents <= admin_cap_cents, so the
          second line must be refused at a cumulative 255000 while a smaller third line, arriving after the refusal, must
          be accepted at a cumulative 246500. The refusal also has to leave the ledger byte-for-byte where the first
          certification left it, which catches an implementation that reserves the amount before validating.
