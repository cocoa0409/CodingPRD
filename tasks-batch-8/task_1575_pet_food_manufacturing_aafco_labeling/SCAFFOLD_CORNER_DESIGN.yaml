  # ===========================================================================
  # Section 4: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: undeclared_role_fails_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority-1 authentication: a request whose X-User-Role is not one of
          the eight declared roles fails with ERR_UNAUTHENTICATED (401) before
          any other check runs.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Anon Co", fein: "553000010", contact_email: "a@anon.example" }
              as: UndeclaredRole
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: authorization_checked_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Priority pair auth(2) vs existence(3): the same bogus-id lock call
          returns ERR_UNAUTHORIZED_ROLE (403) when the role lacks permission
          and ERR_NOT_FOUND (404) when the role is permitted — the higher
          priority category always masks the lower one.
        test_recipe:
          setup:
            - "empty DB (target id does not exist)"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/formulas/00000000-0000-0000-0000-000000000000/lock"
              payload: {}
              as: LineOperator
              captures: { err1: $.data.error_id }
            - call: "POST /petfood/formulas/00000000-0000-0000-0000-000000000000/lock"
              payload: {}
              as: QAApprover
              captures: { err2: $.data.error_id }
          assert:
            - "LineOperator on bogus id: error_id == ERR_UNAUTHORIZED_ROLE, http 403 (P2 beats P3)"
            - "QAApprover on bogus id: error_id == ERR_NOT_FOUND, http 404 (P3 reached only after P2 passes)"

      - name: pairing_approve_blocked_until_supplier_approved
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SUPPLIER_NOT_APPROVED]
        distinguishing_aspect: |
          A pairing whose supplier is still PROVISIONAL cannot be approved:
          P6 fires ERR_SUPPLIER_NOT_APPROVED (422); after the supplier is
          approved the same pairing approves cleanly (satisfaction path).
        test_recipe:
          setup:
            - "Supplier PROVISIONAL; pairing PENDING_REVIEW created by a different user than the approver"
          setup_api_calls:
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "ProvSupply", fsma_facility_id: "FSMA-V100", country_code: "US", risk_tier: "HIGH" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Canola Meal", ingredient_code: "CNML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.36, CRUDE_FAT: 0.03, MOISTURE: 0.09 }, allergen_class: "NONE" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-V100" }
              as: QualityAnalyst
              as_user_id: "qa-requester-11"
              captures: { sia_id: $.data.id }
          trigger:
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
              as_user_id: "qa-approver-11"
              captures: { err: $.data.error_id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
              as_user_id: "qa-approver-11"
              captures: { sia_state: $.data.approval_state }
          assert:
            - "While supplier PROVISIONAL: error_id == ERR_SUPPLIER_NOT_APPROVED, http 422"
            - "After supplier approval: pairing approves, approval_state == APPROVED"

      - name: batch_release_blocked_after_pairing_revocation
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_UNAPPROVED_INGREDIENT_SOURCE]
        distinguishing_aspect: |
          Batch release re-checks ingredient coverage at release time: the
          pairing was APPROVED at substantiation, but revoking it afterwards
          (LOCKED formulas are not demoted by the revoke cascade) makes release
          fail with ERR_UNAPPROVED_INGREDIENT_SOURCE (422).
        test_recipe:
          setup:
            - "LOCKED formula whose sole ingredient pairing is revoked after lock; batch SCHEDULED"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Revoke Co", fein: "553000020", contact_email: "qa@revoke.example" }
              as: PlatformAdmin
