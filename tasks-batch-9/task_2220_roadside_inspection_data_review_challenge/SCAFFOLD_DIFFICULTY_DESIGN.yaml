              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "SMALL", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
