        grounds:
          - state_machines.Seller.delivery_standing.GOOD_STANDING -> SUSPENDED
          - state_machines.Seller.delivery_standing.GOOD_STANDING -> TERMINATED
          - state_machines.Commitment.LOCKED -> CANCELLED
          - calculations.pair_off_fee_cents.variants.administrative_flat
        distinguishing_aspect: |
          The two manual standing actions differ exactly in their commitment
          side effects: SUSPEND sets suspension_reason
          MANUAL_COUNTERPARTY_ACTION and cancels nothing (both lines stay
          LOCKED), while TERMINATE cancels only the line with
          allocated_amount_cents == 0 — booking the ADMINISTRATIVE_FLAT fee of
          25000 to Seller.fee_receivable_cents and releasing that line's
