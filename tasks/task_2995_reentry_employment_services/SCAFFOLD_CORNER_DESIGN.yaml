      - call: POST /participants/${p1_id}/release-plan/approve
        payload: {}
        as: CaseManager
        as_user_id: cm-1
        captures:
          err: $.data.error_id
      - call: POST /participants/${p1_id}/release-plan/approve
        payload: {}
        as: ProgramDirector
        as_user_id: pd-1
      assert:
      - 'first call: HTTP 403 with data.error_id == "ERR_UNAUTHORIZED"'
      - immediately after the denial, GET /participants/${p1_id} returns release_plan_status == "DRAFT" and stage
        == "PRE_RELEASE"
