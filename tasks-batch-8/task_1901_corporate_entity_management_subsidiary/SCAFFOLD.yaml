    path: "/api/registered-agents"
    description: "Register a registered agent in a jurisdiction"
    roles: [CorporateSecretary]
    code: 201
    input: [name, jurisdiction_id, address]
    output: RegisteredAgent
    side_effects: []
  - method: GET
    path: "/api/registered-agents"
    description: "List registered agents"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "jurisdiction_id?"]
    output: "RegisteredAgent[]"
    side_effects: []
  - method: GET
    path: "/api/registered-agents/{agentId}"
    description: "Get a registered agent"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: RegisteredAgent
    side_effects: []

  # --- Officer ---
  - method: POST
    path: "/api/officers"
    description: "Register an officer/director person"
    roles: [CorporateSecretary]
    code: 201
    input: [full_name, email]
    output: Officer
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/api/officers"
    description: "List officers"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Officer[]"
    side_effects: []
  - method: GET
    path: "/api/officers/{officerId}"
    description: "Get an officer"
