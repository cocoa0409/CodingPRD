          difficulty_instance: dual_variant_calc / utilization_dual_basis_diverges_on_holiday_period
          rationale: "That instance holds one period's hours fixed and shows AVAILABLE_BASIS and TARGET_BASIS diverging by an exact computed delta on a holiday-bearing period, then shows the variant of record switching at close. The realization pair is covered the same way by dual_variant_calc / realization_booked_vs_earned_diverges_on_investment_mix. Both deltas are already literal, so a corner instance would only re-assert them."

  - section: consistency model
    instances:

