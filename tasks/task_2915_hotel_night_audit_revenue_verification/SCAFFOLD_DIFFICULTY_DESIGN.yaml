            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${cafe_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 155.45 }
              as: OutletManager
              as_user_id: "${cafe_id}"
              captures: { batch_at_id: "$.data.id" }
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${bar_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 155.46 }
              as: OutletManager
