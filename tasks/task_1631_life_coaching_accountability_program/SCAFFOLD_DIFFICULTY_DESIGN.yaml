  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_temporal_on_paused_booking
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: |
          Pair = state vs business_temporal: booking a session under a PAUSED
          enrollment into a slot that ALSO overlaps another SCHEDULED session of the
          same coach must return ERR_INVALID_STATE (priority 4), not
          ERR_SESSION_OVERLAP (priority 8).
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor; Clients S1 and S2; Tier PKG-8"
            - "Enrollment ES1 ACTIVE then PAUSED (no sessions booked before pause)"
            - "Enrollment ES2 ACTIVE with one SCHEDULED session 2026-08-10T10:00Z 60m (occupies [10:00, 11:15))"
            - "Clock 2026-08-04"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
