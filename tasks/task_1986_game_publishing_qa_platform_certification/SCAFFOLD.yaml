  roles:
  - ReleaseManager
  code: 201
  input:
  - title_id
  - territory
  - content_descriptors
  output: AgeRatingFiling
  side_effects:
  - status = DRAFT; at most one DRAFT/FILED filing per (title, territory) (ERR_DUPLICATE_FILING)
- method: GET
  path: /qa-cert/age-rating-filings/{filingId}
  description: Get a filing
  roles:
  - Any
  code: 200
  input: []
  output: AgeRatingFiling
  side_effects: []
- method: GET
  path: /qa-cert/age-rating-filings
  description: List filings
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - territory?
  - status?
  output: AgeRatingFiling[]
  side_effects: []
- method: POST
  path: /qa-cert/age-rating-filings/{filingId}/transition
  description: file (ReleaseManager, charges fee with bundle discount); decide GRANTED/CHALLENGED (PlatformReviewer); amend CHALLENGED->DRAFT
    with new descriptors (ReleaseManager)
  roles:
  - ReleaseManager
  - PlatformReviewer
  code: 200
  input:
  - to_status
  - content_descriptors?
  output: AgeRatingFiling
