          One analyze call fans out over every in-scope award and writes a determination per over-payment, each
          sized from that award's own target: restating ADJ_EPS from 5.50 to 5.00 drops the blended factor from 130.00
          to 100.00, so the CEO's 2,340,000.00 yields 540,000.00 and the CFO's 1,040,000.00 yields 240,000.00 —
