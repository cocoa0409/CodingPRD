      - name: rollout_step_sequencing_errors_are_distinct_and_priority_ordered
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STEP_STATE_INVALID]
          - errors[ERR_STEP_OUT_OF_ORDER]
          - errors[ERR_STEP_ALREADY_SOAKING]
          - errors[ERR_SOAK_NOT_ELAPSED]
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=35]
        distinguishing_aspect: "Four distinct 409s guard one ladder: applying a PLANNED step gives ERR_STEP_STATE_INVALID, soaking step 2 before step 1 gives ERR_STEP_OUT_OF_ORDER, soaking step 2 while step 1 soaks gives the higher-priority ERR_STEP_ALREADY_SOAKING, and applying at 00:29:59 gives ERR_SOAK_NOT_ELAPSED while 00:30:00 succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FeatureFlag checkout-v2 owned by u-eng-1 with current_exposure_pct 0."
