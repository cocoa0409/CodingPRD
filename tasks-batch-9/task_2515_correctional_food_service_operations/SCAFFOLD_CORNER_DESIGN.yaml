      - name: corner_parallel_axes_move_independently_on_production_batch
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[ProductionBatch stage axis]
          - state_machines[ProductionBatch qa axis]
        distinguishing_aspect: "ProductionBatch carries two independent dimensions - production_stage and qa_status - and a qa-axis excursion must not drag the stage axis with it."
        excluded_because:
          difficulty_instance: non_linear_state_machine / production_batch_qa_axis_loops_back_while_stage_axis_holds_at_chilled
          rationale: "That instance walks the qa axis QA_PENDING -> QA_HELD -> QA_PASSED while asserting production_stage stays CHILLED at every step, which is precisely the parallel-axis claim."

      - name: corner_cyclic_reverification_terminates
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[DietOrder].transitions[SUSPENDED -> PENDING_VERIFICATION]
          - calculations.diet_order_coverage_window.constants.MAX_REVERIFICATIONS
        distinguishing_aspect: "The suspend/re-verify loop is bounded: the third request-reverification must fail rather than cycling forever."
        excluded_because:
          difficulty_instance: non_linear_state_machine / diet_order_suspend_reverify_cycle_caps_at_two_reverifications
          rationale: "That instance drives the loop twice, asserts reverification_count == 2 and then asserts ERR_REVERIFICATION_LIMIT_REACHED on the third pass, covering both the loop and its termination condition."

      - name: corner_guarded_transition_needs_the_other_entity_in_state
        claim_type: guarded_transitions
        grounds:
          - state_machines[MenuCycle].transitions[NUTRITION_APPROVED -> ACTIVE].preconditions
          - validations[priority=43]
        distinguishing_aspect: "Menu-cycle activation is guarded by a different aggregate's state: the transition is legal only while the facility's ServiceContract is ACTIVE."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / menu_cycle_activation_requires_service_contract_active
          rationale: "That instance activates the same signed cycle under a DRAFT contract (ERR_CONTRACT_NOT_ACTIVE) and then under an ACTIVE contract (success), which is the guarded-transition claim in both directions."

      - name: corner_cascade_down_from_lockdown_reaches_grandchildren
        claim_type: cascade_down
        grounds:
          - state_machines[ToolIssuance].transitions[ISSUED -> UNACCOUNTED].side_effects
          - complexity_profile.complexity_layers
        distinguishing_aspect: "One unaccounted sharp must propagate down four hops - facility posture, batch discard, worker unassignment - and stop at batches that are already terminal."
        excluded_because:
          difficulty_instance: transitive_cascade / unaccounted_sharp_cascades_facility_lockdown_batch_discard_worker_unassignment
          rationale: "That instance asserts every hop of the same chain, including the SERVED batch that must be left alone, so the cascade-down claim is fully covered."

      - name: corner_conditional_cascade_respects_stricter_posture
        claim_type: conditional_cascade
        grounds:
          - state_machines[MealServiceRecord].transitions[OPEN -> CLOSED].side_effects
        distinguishing_aspect: "The corrective-action cascade only rewrites kitchen_posture for facilities currently OPEN; a facility already RESTRICTED or LOCKDOWN keeps the stricter value."
        excluded_because:
          difficulty_instance: transitive_cascade / service_record_close_cascades_contract_ledger_to_facility_corrective_posture
          rationale: "That instance closes a record that pushes missed_meal_total past the escalation threshold and asserts the conditional posture rewrite on the affected facility."

      - name: corner_ledger_sync_on_service_record_close
        claim_type: ledger_sync
        grounds:
          - state_machines[MealServiceRecord].transitions[OPEN -> CLOSED].side_effects
          - calculations.contract_liquidated_damages
        distinguishing_aspect: "Closing a child MealServiceRecord must post its trays, meal-days and missed meals onto the ancestor ServiceContract ledger and re-derive liquidated damages and performance score in the same request."
        excluded_because:
          difficulty_instance: transitive_cascade / service_record_close_cascades_contract_ledger_to_facility_corrective_posture
          rationale: "That instance asserts the exact post-close ledger literals on the contract (missed_meal_total, gross_food_cost_cents, net_liquidated_damages_cents, performance_score), which is the ledger-sync claim."

      - name: corner_compensating_supersede_leaves_no_census_drift
        claim_type: compensation
        grounds:
          - state_machines[DietOrder].transitions[PENDING_VERIFICATION -> ACTIVE].side_effects
          - calculations.special_diet_census_invariant
        distinguishing_aspect: "When a supersede verification revokes the incumbent, the increment and the decrement must cancel exactly, leaving both census counters at their pre-verification value."
        excluded_because:
          difficulty_instance: compensating_invariant / supersede_verify_leaves_special_diet_census_unchanged
          rationale: "That instance asserts the counters are unchanged after the supersede and strictly higher after a non-superseding verification, which covers the compensation claim."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_expedited_grievance_due_date_is_five_days_from_filing
        claim_type: correct_result
        grounds:
          - calculations.grievance_response_sla
          - endpoints[POST /cfs/grievances]
        distinguishing_aspect: "RELIGIOUS_DIET_DENIAL is in the expedited set, so response_due_at is filed_at + 5 * 24 hours (2026-08-03T09:00:00Z -> 2026-08-08T09:00:00Z) and carries the time-of-day, not a midnight-truncated calendar date."
        test_recipe:
          setup:
            - "Facility FAC-C01 with Inmate BK-C01, clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-C01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-C01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-C01", housing_unit: "GENERAL", religious_affiliation: "MUSLIM" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
          trigger:
            - call: "POST /cfs/grievances"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", category: "RELIGIOUS_DIET_DENIAL", narrative: "Halal tray refused at the serving line." }
              as: GrievanceCoordinator
              as_user_id: "gc-001"
              captures: { grievance_id: $.data.id, filed: $.data.filed_at, due: $.data.response_due_at }
          assert:
            - "${filed} == 2026-08-03T09:00:00Z"
            - "${due} == 2026-08-08T09:00:00Z (EXPEDITED_WINDOW_DAYS 5, not the 10-day standard window)"
            - "Grievance.${grievance_id}.sla_breached == false and status == FILED"

      - name: corner_forecast_special_diet_count_includes_only_active_in_window_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.meal_forecast_trays
          - endpoints[POST /cfs/meal-forecasts]
        distinguishing_aspect: "Of three diet orders at the facility only one is ACTIVE and covers the service date, so forecast_special_diet_trays is 1: a PENDING_VERIFICATION order and an ACTIVE order whose half-open window starts after the service date are both excluded."
        test_recipe:
