        distinguishing_aspect: |
          Category pair STATE (ERR_INVALID_STATE, pri 6) vs BUSINESS_FISCAL
          (ERR_PROJECTED_RESERVE_SHORTFALL, pri 13): accepting an already-REJECTED offer
