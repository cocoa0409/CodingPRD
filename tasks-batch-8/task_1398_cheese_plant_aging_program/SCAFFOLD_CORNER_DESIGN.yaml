# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Cheese Plant & Aging Program
#
# Common reachability note: every batch-dependent chain below uses the same
# base factory sequence (clock -> plant -> vat -> intake -> accept -> 2 lots ->
# 2 lot releases -> make-sheet -> start -> N step sign-offs alternating two
# cheesemaker ids -> complete -> GET cheese-batches by make_sheet_id). Recipes
# inline the full chain so each is independently executable from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: plant_creation_applies_defaults_and_computed_fields
        claim_type: creation
        grounds: [entities.Plant]
        distinguishing_aspect: "POST /plant/plants omitting export_listed yields export_listed=false and total_aging_capacity_wheels=0; server mints id and version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "Defaults Plant", license_number: "WI-200" }, as: PlantAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /plant/plants/${pid}", payload: {}, as: PlantAdmin, captures: { el: $.data.export_listed, cap: $.data.total_aging_capacity_wheels, ver: $.data.version } }
          assert:
            - "el == false (default applied)"
            - "cap == 0 (computed field initialized)"
            - "ver == 1"

      - name: plant_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Plant"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/plants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlantAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: milk_intake_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.MilkIntake"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST milk-intakes without volume_liters returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-201" }, as: PlantAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: milk_intake_antibiotics_default_false
        claim_type: defaults
        grounds: [entities.MilkIntake.fields.antibiotics_detected]
        distinguishing_aspect: "Omitting antibiotics_detected stores false."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-202" }, as: PlantAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { ab: $.data.antibiotics_detected, st: $.data.status } }
          assert:
            - "ab == false"
            - "st == RECEIVED (initial state)"

      - name: milk_intake_invalid_enum_or_type_rejected
        claim_type: type_constraints
        grounds:
          - "entities.MilkIntake"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "somatic_cell_count supplied as a non-integer string returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["plant exists"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-203" }, as: PlantAdmin, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: "high" }, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: make_sheet_variety_pins_steps_required
        claim_type: computed_fields
        grounds: [entities.MakeSheet.fields.make_steps_required, entities.MakeSheet.fields.variety]
        distinguishing_aspect: "make_steps_required is pinned by variety (MUENSTER 5, CHEDDAR 8); a client-supplied value is ignored."
        test_recipe:
          setup: ["plant, vat, accepted intake, released lots"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-204" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
          trigger:
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { req: $.data.make_steps_required } }
          assert:
            - "req == 5 (MUENSTER pins 5 required steps)"

      - name: grading_event_self_referential_chain_links_prior_event
        claim_type: parent_relationships
        grounds: [entities.GradingEvent.fields.supersedes_grading_event_id]
        distinguishing_aspect: "Self-referential FK: second grading of the same batch links supersedes_grading_event_id to the first event's id."
        test_recipe:
          setup: ["graded MUENSTER batch (first GradingEvent exists)"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-205" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 4 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${pid}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 100, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 4, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 40.0, fat_dry_basis_pct: 50.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_carol", captures: { ge1: $.data.id } }
          trigger:
            - { call: "GET /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", supersedes_grading_event_id: "${ge1}" }, as: QAGrader }
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 41.0, fat_dry_basis_pct: 50.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_dave", captures: { ge2: $.data.id, sup: $.data.supersedes_grading_event_id } }
            - { call: "GET /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", supersedes_grading_event_id: "${ge1}" }, as: QAGrader }
          assert:
            - "first filtered GET returns data.total_count == 0 (no superseding event before the re-grade)"
            - "sup == ${ge1} (self-referential chain)"
            - "second filtered GET returns data.total_count == 1 (FK filter finds the re-grade)"

      - name: child_list_pagination_envelope_fields
        claim_type: listing
        grounds: [entities.MilkIntake, response_envelope]
        distinguishing_aspect: "GET /plant/milk-intakes?plant_id=... returns response_type=array with limit/offset/total_count/has_more pagination fields and honors limit=1."
        test_recipe:
          setup: ["plant with 2 intakes"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-206" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-2", received_at: "2026-08-01T02:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver }
          trigger:
            - { call: "GET /plant/milk-intakes", payload: { plant_id: "${pid}", limit: 1, offset: 0 }, as: MilkReceiver }
          assert:
            - "response envelope data.total_count == 2"
            - "response envelope data.has_more == true (limit 1 with 2 rows)"
            - "response envelope response_type == array and data rows length == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: milk_intake_initial_state_received
        claim_type: initial_state
        grounds: [state_machines.MilkIntake]
        excluded_because:
          difficulty_instance: dual_variant_calc / cheese_batch_provisional_vs_actual_yield_diverge
          rationale: "That instance's accept step asserts the RECEIVED->ACCEPTED transition; RECEIVED initial state is asserted in milk_intake_antibiotics_default_false."

      - name: milk_intake_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.MilkIntake"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A REJECTED intake rejects every further transition (accept, reject) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["intake REJECTED"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-210" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/reject", payload: {}, as: MilkReceiver }
          trigger:
            - { call: "POST /plant/milk-intakes/${milk_id}/reject", payload: {}, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (REJECTED is terminal; second reject rejected)"

      - name: milk_intake_invalid_trigger_accept_after_accept
        claim_type: invalid_transition
        grounds:
          - "state_machines.MilkIntake"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ACCEPTED -> ACCEPTED is not a declared transition; second accept returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["intake ACCEPTED"]
          setup_api_calls:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-211" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
          trigger:
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: make_sheet_signoff_out_of_order_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.MakeSheet.IN_PROGRESS_to_CURD_READY"
          - "errors[ERR_STEP_OUT_OF_ORDER]"
        distinguishing_aspect: "Signing step 3 when make_steps_completed == 1 returns ERR_STEP_OUT_OF_ORDER; strictly sequential."
        test_recipe:
          setup: ["IN_PROGRESS MUENSTER make with 1 step signed"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-212" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
          trigger:
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STEP_OUT_OF_ORDER"
            - "MakeSheet.${make_id}.make_steps_completed == 1 (unchanged)"

      - name: make_sheet_consecutive_same_operator_signoff_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.MakeSheet.IN_PROGRESS_to_CURD_READY"
          - "errors[ERR_STEP_SOLE_OPERATOR]"
        distinguishing_aspect: "Same cheesemaker X-User-ID signing step N and step N+1 returns ERR_STEP_SOLE_OPERATOR (procedure-level segregation of duties)."
        test_recipe:
          setup: ["IN_PROGRESS MUENSTER make with step 1 signed by cm_alice"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-213" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
          trigger:
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STEP_SOLE_OPERATOR"

      - name: grader_who_signed_make_step_rejected_on_grading
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.CheeseBatch.AGING_to_GRADED"
          - "errors[ERR_SOLE_OPERATOR]"
        distinguishing_aspect: "A QAGrader whose X-User-ID appears in the originating MakeSheet.step_signer_ids is rejected with ERR_SOLE_OPERATOR (cross-role segregation of duties)."
        test_recipe:
          setup: ["AGING MUENSTER batch aged past 21 days; make steps signed by cm_alice/cm_bob; grading attempted by QAGrader with as_user_id cm_alice"]
          setup_api_calls:
