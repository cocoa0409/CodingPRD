            - {call: "GET /injury-analyses/${ia_inst}", as: WaterRightsAnalyst}
          assert:
            - "INSTANTANEOUS_DEPLETION: distance_factor 0.9400 == round(1 - 0.015 * 4.00, 4), gross_depletion_af 86.48 == round(100.00 * 0.92 * 0.9400, 2), net_injury_af 86.48."
            - "SEASONAL_AVERAGE on the SAME inputs: gross_depletion_af 78.00 == round(100.00 * 0.78, 2), net_injury_af 78.00 — a difference of 8.48 AF."
            - "Neither figure is derivable from the other by rounding: 0.92 * 0.9400 == 0.8648 versus a flat 0.78."
            - "The first analysis is VOIDED and retains 86.48; the second is the live DRAFT at 78.00."

