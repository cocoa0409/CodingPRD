# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Clock default current_period_index = 0.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: device_create_returns_registered_with_computed_fields
        claim_type: Creation
        grounds:
          - "entities.Device.fields.status"
          - "entities.Device.fields.risk_class"
        distinguishing_aspect: "POST /devices returns 201 with status REGISTERED, risk_class HIGH (PASSENGER_ELEVATOR), outstanding_balance_cents 10000 (auto registration invoice), and version 1."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "A1 Realty", contact_email: "a1@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "L1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id", rc: "$.data.risk_class" }
          assert:
            - "Device.${dev_id}.status == REGISTERED"
            - "Device.${dev_id}.risk_class == HIGH"
            - "Device.${dev_id}.outstanding_balance_cents == 10000"
            - "Device.${dev_id}.version == 1"

      - name: get_nonexistent_device_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_DEVICE_NOT_FOUND]"]
        distinguishing_aspect: "GET /devices/{unknown-uuid} returns ERR_DEVICE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /devices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DEVICE_NOT_FOUND"
            - "response http status == 404"

      - name: device_create_missing_category_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /devices without the required category field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "A2 Realty", contact_email: "a2@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", location_description: "L2", install_period: 0 }
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response http status == 400"

      - name: device_risk_class_computed_dumbwaiter_is_low
        claim_type: Computed Fields
        grounds: ["entities.Device.fields.risk_class"]
        distinguishing_aspect: "risk_class is computed from category: a DUMBWAITER device yields risk_class LOW regardless of any client input."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "A3 Realty", contact_email: "a3@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "DUMBWAITER", location_description: "L3", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id", rc: "$.data.risk_class" }
          assert:
            - "Device.${dev_id}.risk_class == LOW"

      - name: devices_list_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Device.fields.status"]
        distinguishing_aspect: "GET /devices returns response_type array with pagination fields total_count and has_more; limit 1 returns at most one device."
        test_recipe:
          setup: ["Two devices exist under one owner."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "A4 Realty", contact_email: "a4@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "D1", install_period: 0 }
              as: Registrar
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "ESCALATOR", location_description: "D2", install_period: 0 }
              as: Registrar
          trigger:
            - call: "GET /devices?limit=1&offset=0"
              payload: { limit: 1, offset: 0, owner_id: "${owner_id}" }
              as: Registrar
          assert:
            - "response_type == array"
            - "data array length == 1 (limit honored)"
            - "meta/pagination exposes total_count == 2 and has_more == true"

  - section: state_machines
    instances:
      - name: cancel_in_progress_returns_not_cancellable
        claim_type: invalid_transition
        grounds:
          - "state_machines.Inspection.SCHEDULED_to_CANCELLED"
          - "errors[ERR_INSPECTION_NOT_CANCELLABLE]"
        distinguishing_aspect: "cancel is only valid from {SCHEDULED, ASSIGNED}; an IN_PROGRESS inspection rejects cancel with ERR_INSPECTION_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["A PASSENGER inspection is IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B1 Co", contact_email: "b1@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "B1 Insp", license_number: "B-1", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/cancel"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INSPECTION_NOT_CANCELLABLE"
            - "response http status == 409"

      - name: complete_on_passed_returns_not_in_progress
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Inspection.IN_PROGRESS_to_PASSED"
          - "errors[ERR_INSPECTION_NOT_IN_PROGRESS]"
        distinguishing_aspect: "A PASSED inspection is terminal; a second complete returns ERR_INSPECTION_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A PASSENGER inspection has already completed with PASS."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B2 Co", contact_email: "b2@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "B2 Insp", license_number: "B-2", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B2", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INSPECTION_NOT_IN_PROGRESS"
            - "response http status == 409"

      - name: activate_twice_returns_not_registered
        claim_type: Idempotency
        grounds:
          - "state_machines.Device.REGISTERED_to_ACTIVE"
          - "errors[ERR_DEVICE_NOT_REGISTERED]"
        distinguishing_aspect: "A device already ACTIVE rejects a second activate with ERR_DEVICE_NOT_REGISTERED (409)."
        test_recipe:
          setup: ["A PASSENGER device with paid registration fee has been activated."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B3 Co", contact_email: "b3@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B3", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /devices/${dev_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /devices/${dev_id}/activate"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DEVICE_NOT_REGISTERED"
            - "response http status == 409"

      - name: resolve_open_deficiency_marks_resolved
        claim_type: Valid Transition
        grounds:
          - "state_machines.Deficiency.OPEN_to_RESOLVED"
          - "entities.Deficiency.fields.status"
        distinguishing_aspect: "POST /deficiencies/{id}/resolve moves an OPEN deficiency to RESOLVED."
        test_recipe:
          setup: ["A PASSENGER device has one OPEN deficiency from a CONDITIONAL inspection."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B4 Co", contact_email: "b4@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "B4 Insp", license_number: "B-4", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B4", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "B4-1", severity: "MINOR", description: "loose bolt" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins_id}"
              payload: { inspection_id: "${ins_id}" }
              as: Registrar
              captures: { def_id: "$.data[0].id" }
          trigger:
            - call: "POST /deficiencies/${def_id}/resolve"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
          assert:
            - "Deficiency.${def_id}.status == RESOLVED"

      - name: lift_inactive_order_returns_not_active
        claim_type: invalid_transition
        grounds:
          - "state_machines.OutOfServiceOrder.ACTIVE_to_LIFTED"
          - "errors[ERR_OOS_ORDER_NOT_ACTIVE]"
        distinguishing_aspect: "Lifting an already-LIFTED order returns ERR_OOS_ORDER_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A device has one order that was created then lifted."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B5 Co", contact_email: "b5@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B5", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /out-of-service-orders"
              payload: { device_id: "${dev_id}", reason: "NONPAYMENT", effective_start_period: 0, effective_end_period: 5 }
              as: SafetyAdministrator
              captures: { oos_id: "$.data.id" }
            - call: "POST /out-of-service-orders/${oos_id}/lift"
              payload: {}
              as: SafetyAdministrator
          trigger:
            - call: "POST /out-of-service-orders/${oos_id}/lift"
              payload: {}
              as: SafetyAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_OOS_ORDER_NOT_ACTIVE"
            - "response http status == 409"

      - name: oos_lift_restores_device_active
        claim_type: Bubble up
        grounds:
          - "state_machines.OutOfServiceOrder.ACTIVE_to_LIFTED"
          - "state_machines.Device.OUT_OF_SERVICE_to_ACTIVE"
        distinguishing_aspect: "Lifting the last ACTIVE order returns the device from OUT_OF_SERVICE to ACTIVE and clears active_oos_count to 0."
        test_recipe:
          setup: ["An ACTIVE device is placed OUT_OF_SERVICE by one order."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B6 Co", contact_email: "b6@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B6", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /devices/${dev_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /out-of-service-orders"
              payload: { device_id: "${dev_id}", reason: "NONPAYMENT", effective_start_period: 0, effective_end_period: 5 }
              as: SafetyAdministrator
              captures: { oos_id: "$.data.id" }
          trigger:
            - call: "POST /out-of-service-orders/${oos_id}/lift"
              payload: {}
              as: SafetyAdministrator
          assert:
            - "OutOfServiceOrder.${oos_id}.status == LIFTED"
            - "Device.${dev_id}.status == ACTIVE"
            - "Device.${dev_id}.active_oos_count == 0"

      - name: certificate_supersede_prior_marks_superseded
        claim_type: Cross-entity
        grounds:
          - "state_machines.Certificate.POSTED_to_SUPERSEDED"
          - "entities.Device.fields.current_certificate_id"
        distinguishing_aspect: "Issuing a second certificate supersedes the prior one (status SUPERSEDED) and repoints device.current_certificate_id to the new certificate."
        test_recipe:
          setup: ["A PASSENGER device (fee paid) has an ISSUED-then-POSTED certificate from inspection ins1, and a second PASSED inspection ins2."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "B7 Co", contact_email: "b7@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "B7 Insp", license_number: "B-7", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "B7", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins1}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Registrar
              captures: { dev_v1: "$.data.version" }
            - call: "POST /certificates"
              payload: { device_id: "${dev_id}", source_inspection_id: "${ins1}", expected_device_version: "${dev_v1}" }
              as: Registrar
              captures: { cert1: "$.data.id" }
            - call: "POST /certificates/${cert1}/post"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 5, scheduled_end_period: 6 }
              as: Registrar
              captures: { ins2: "$.data.id" }
            - call: "POST /inspections/${ins2}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins2}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Registrar
              captures: { dev_v2: "$.data.version" }
          trigger:
            - call: "POST /certificates"
              payload: { device_id: "${dev_id}", source_inspection_id: "${ins2}", expected_device_version: "${dev_v2}" }
              as: Registrar
              captures: { cert2: "$.data.id" }
          assert:
            - "Certificate.${cert1}.status == SUPERSEDED"
            - "Certificate.${cert2}.status == ISSUED"
            - "Device.${dev_id}.current_certificate_id == ${cert2}"

  - section: calculations
    instances:
      - name: certificate_expiry_period_computed_escalator
        claim_type: Correct Result
        grounds:
          - "calculations.certificate_expiry_period"
          - "entities.Certificate.fields.expiry_period"
        distinguishing_aspect: "expiry_period = issue_period + INTERVAL_MONTHS[category]; an ESCALATOR certificate issued at period 0 has expiry_period 6."
        test_recipe:
          setup: ["An ESCALATOR device (fee paid) has a PASSED inspection; clock at default 0."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "C1 Co", contact_email: "c1@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "C1 Insp", license_number: "C-1", license_expiry_period: 999, certified_categories: ["ESCALATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "ESCALATOR", location_description: "C1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Registrar
              captures: { dev_v: "$.data.version" }
          trigger:
            - call: "POST /certificates"
              payload: { device_id: "${dev_id}", source_inspection_id: "${ins_id}", expected_device_version: "${dev_v}" }
              as: Registrar
              captures: { cert_id: "$.data.id", exp: "$.data.expiry_period" }
          assert:
            - "Certificate.${cert_id}.issue_period == 0"
            - "Certificate.${cert_id}.expiry_period == 6 (0 + INTERVAL_MONTHS[ESCALATOR]=6)"

      - name: pass_sets_next_inspection_due_period
        claim_type: Correct Result
        grounds:
          - "calculations.next_inspection_due_period"
          - "entities.Device.fields.next_inspection_due_period"
        distinguishing_aspect: "A PASS at period 0 on a PASSENGER device sets device.next_inspection_due_period to 12 (0 + INTERVAL_MONTHS[PASSENGER]=12)."
        test_recipe:
          setup: ["A PASSENGER device inspection is IN_PROGRESS; clock at default 0."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "C2 Co", contact_email: "c2@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "C2 Insp", license_number: "C-2", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "C2", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
