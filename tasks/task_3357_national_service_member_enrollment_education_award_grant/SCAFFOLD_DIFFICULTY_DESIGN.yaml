# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3357_national_service_member_enrollment_education_award_grant
# 9 difficulty rules x 2 instances each. Every instance is self-contained from
# empty-DB; shared setup chains are YAML anchors defined at first use.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_per_msy_federal_vs_total_basis
        grounds:
          - calculations.cost_per_msy
          - calculations.allowable_match
          - entities.GrantApplication.fields.cost_per_msy_federal_cents
          - entities.GrantApplication.fields.cost_per_msy_total_cents
        distinguishing_aspect: "On the GrantApplication/GrantAward domain: the SAME slot_requests and federal share produce cost_per_msy_federal_cents == 2000000.0 (passes the 2300000 cap) while cost_per_msy_total_cents == 2500000.0 (exceeds it) — two valid bases, two different numbers; the cap binds only the federal basis."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One org, one open competition."
          setup_api_calls:
            - &d_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CNCSProgramOfficer
            - &d_org
              call: "POST /organizations"
              payload: { legal_name: "River City Service Corps", ein: "12-3456789", org_type: "NONPROFIT" }
              as: CNCSProgramOfficer
              captures: { org_id: $.data.id }
            - &d_comp
              call: "POST /competitions"
              payload: { title: "FY2026 Service Corps", fiscal_year: 2026, application_open_at: "2026-09-01T00:00:00Z", application_close_at: "2026-10-01T00:00:00Z" }
              as: CNCSProgramOfficer
              captures: { comp_id: $.data.id }
            - &d_app_2ft_4m
              call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 4000000, slot_requests: [{ term_category: "FULL_TIME", count: 2 }], match_lines: [{ category: "CASH", amount_cents: 1000000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "GrantApplication.${app_id}.total_term_minutes == 204000"
            - "GrantApplication.${app_id}.msy_requested == 2.0"
            - "GrantApplication.${app_id}.allowable_match_commitment_cents == 1000000"
            - "GrantApplication.${app_id}.cost_per_msy_federal_cents == 2000000.0"
            - "GrantApplication.${app_id}.cost_per_msy_total_cents == 2500000.0"
            - "cost_per_msy_federal_cents <= 2300000 (cap satisfied on the federal basis) while cost_per_msy_total_cents > 2300000"

      - name: education_award_full_vs_prorated_same_term
        grounds:
          - calculations.education_award_amount
          - state_machines.MemberEnrollment.ACTIVE_to_EXITED_SUCCESSFUL
          - state_machines.MemberEnrollment.ACTIVE_to_EXITED_COMPELLING
        distinguishing_aspect: "On the MemberEnrollment/EducationAward domain: two FULL_TIME enrollments exit the same day — a SUCCESSFUL exit issues 739500 cents while a COMPELLING_CIRCUMSTANCE exit at 36000 of 102000 minutes issues round(739500 x 36000/102000) == 261000 cents; variant selection is driven by exit_reason."
        test_recipe:
          setup:
            - "Award with 2 FULL_TIME slots ACTIVE. Member A enrolled with 102000 certified minutes; member B enrolled with 36000 certified minutes. Clock at 2026-10-02T00:00:00Z at exit time."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - &d_submit
              call: "POST /applications/${app_id}/submit"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - &d_clock_close
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: CNCSProgramOfficer
            - &d_close
              call: "POST /competitions/${comp_id}/close"
              payload: {}
              as: CNCSProgramOfficer
            - &d_award_4m
              call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 4000000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id, award_v1: $.data.version }
            - &d_member_a
              call: "POST /members/register"
              payload: { full_name: "Alex Rivera", date_of_birth: "2000-01-01", citizenship_status: "US_CITIZEN" }
              as: Anonymous
              captures: { m_a: $.data.id }
            - &d_check_a
              call: "POST /members/${m_a}/criminal-history-checks"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { chk_a: $.data.id }
            - &d_clr_a1
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "NSOPR", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_a2
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "STATE_REPOSITORY", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_a3
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "FBI_FINGERPRINT", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_enroll_a
              call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_a: $.data.id }
            - &d_hrs_a1
              call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 48000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a1: $.data.id }
            - &d_cert_a1
              call: "POST /hour-entries/${ent_a1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - &d_hrs_a2
              call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-17", minutes: 48000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a2: $.data.id }
            - &d_cert_a2
              call: "POST /hour-entries/${ent_a2}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - &d_hrs_a3
              call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-18", minutes: 6000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a3: $.data.id }
            - &d_cert_a3
              call: "POST /hour-entries/${ent_a3}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v2: $.data.version }
            - &d_member_b
              call: "POST /members/register"
              payload: { full_name: "Blair Kim", date_of_birth: "1999-05-20", citizenship_status: "US_NATIONAL" }
              as: Anonymous
              captures: { m_b: $.data.id }
            - &d_check_b
              call: "POST /members/${m_b}/criminal-history-checks"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { chk_b: $.data.id }
            - &d_clr_b1
              call: "POST /criminal-history-checks/${chk_b}/component-results"
              payload: { component: "NSOPR", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_b2
              call: "POST /criminal-history-checks/${chk_b}/component-results"
              payload: { component: "STATE_REPOSITORY", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_b3
              call: "POST /criminal-history-checks/${chk_b}/component-results"
              payload: { component: "FBI_FINGERPRINT", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_enroll_b
              call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_b: $.data.id }
            - &d_hrs_b1
              call: "POST /enrollments/${enr_b}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 36000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_b1: $.data.id }
            - &d_cert_b1
              call: "POST /hour-entries/${ent_b1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "SUCCESSFUL" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { edu_a: $.data.education_award_id }
            - call: "POST /enrollments/${enr_b}/exit"
              payload: { exit_reason: "COMPELLING_CIRCUMSTANCE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { edu_b: $.data.education_award_id }
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "GET /education-awards/${edu_b}"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "MemberEnrollment.${enr_a}.status == EXITED_SUCCESSFUL and MemberEnrollment.${enr_b}.status == EXITED_COMPELLING"
            - "EducationAward.${edu_a}.issued_amount_cents == 739500 and remaining_balance_cents == 739500"
            - "EducationAward.${edu_b}.issued_amount_cents == 261000 and remaining_balance_cents == 261000"
            - "both awards share term_category FULL_TIME — the 478500-cent delta comes from the variant, not the category"
            - "EducationAward.${edu_a}.use_deadline_at == 2033-10-02T00:00:00Z (issued 2026-10-02T00:00:00Z + 7 years)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: living_allowance_nested_min_gate
        grounds:
          - calculations.living_allowance_gate
          - validations[priority=35]
          - validations[priority=36]
          - validations[priority=37]
        distinguishing_aspect: "Mode (a): the allowance gate is a three-input nested min (period cap 100000, remaining total 2200000, hours-earned cap floor(2200000 x certified/102000)) with a state branch; at 51000 certified minutes the earned cap binds at exactly 1100000 — an 11th payment of 100000 lands exactly on the cap (allowed, <= semantics) and a further 1000 is rejected with ERR_ALLOWANCE_EARNED_CAP_EXCEEDED, distinct from the period-cap and exhaustion errors."
        test_recipe:
          setup:
            - "Award ACTIVE with 2 FULL_TIME slots; member A enrolled and ACTIVE with 51000 certified minutes (48000 + 3000)."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
            - *d_clock_close
            - *d_close
            - *d_award_4m
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
            - *d_hrs_a1
            - *d_cert_a1
            - &d_hrs_a4
              call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-18", minutes: 3000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a4: $.data.id }
            - &d_cert_a4
              call: "POST /hour-entries/${ent_a4}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
          trigger:
            - &d_pay1
              call: "POST /enrollments/${enr_a}/allowance-payments"
              payload: { amount_cents: 100000 }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - *d_pay1
            - call: "GET /enrollments/${enr_a}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "POST /enrollments/${enr_a}/allowance-payments"
              payload: { amount_cents: 1000 }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /enrollments/${enr_a}/allowance-payments"
              payload: { amount_cents: 100001 }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id2: $.data.error_id }
          assert:
            - "eleven payments of 100000 all succeed (the 11th lands paid exactly on the 1100000 earned cap)"
            - "MemberEnrollment.${enr_a}.allowance_paid_cents == 1100000"
            - "the 1000-cent payment is rejected: status 422 and error_id == ERR_ALLOWANCE_EARNED_CAP_EXCEEDED (earned cap binds before the total)"
            - "the 100001-cent payment is rejected: status 422 and error_id2 == ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED (period cap checked first)"
            - "MemberEnrollment.${enr_a}.allowance_paid_cents still == 1100000 after both rejections"

      - name: match_allowable_per_line_rounding
        grounds:
          - calculations.allowable_match
          - entities.GrantApplication.fields.allowable_match_commitment_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned per-line-then-sum — three IN_KIND lines of 100001 cents yield 3 x round(80000.8) == 240003, whereas sum-then-round would yield round(240002.4) == 240002; the stored commitment must be 240003, and 240003 x 25 == 6000075 >= 6000000 so the 24% match gate passes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Org and competition exist."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 1000000, slot_requests: [{ term_category: "FULL_TIME", count: 1 }], match_lines: [{ category: "IN_KIND", amount_cents: 100001 }, { category: "IN_KIND", amount_cents: 100001 }, { category: "IN_KIND", amount_cents: 100001 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}"
              payload: {}
              as: CNCSProgramOfficer
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
          assert:
            - "GrantApplication.${app_id}.allowable_match_commitment_cents == 240003 (per-line rounding), NOT 240002 (sum-then-round)"
            - "GrantApplication.${app_id}.cost_per_msy_federal_cents == 1000000.0 (1000000 x 102000 / 102000)"
            - "submit succeeds with status 200 and application status == UNDER_REVIEW (240003 satisfies the 24% floor of 240000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_clarification_cycle
        grounds:
          - state_machines.GrantApplication.UNDER_REVIEW_to_CLARIFICATION_REQUESTED
          - state_machines.GrantApplication.CLARIFICATION_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: "GrantApplication runs the UNDER_REVIEW -> CLARIFICATION_REQUESTED -> UNDER_REVIEW loop TWICE before a terminal decision — a revision cycle on the application entity, not a linear pipeline; each hop bumps version by exactly 1."
        test_recipe:
          setup:
            - "Application submitted (UNDER_REVIEW, version 2 after submit)."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
          trigger:
            - call: "POST /applications/${app_id}/request-clarification"
              payload: { question: "What is the recruitment plan?" }
              as: CNCSProgramOfficer
            - call: "POST /applications/${app_id}/respond-clarification"
              payload: { response: "Local college pipeline." }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /applications/${app_id}/request-clarification"
              payload: { question: "Clarify match source." }
              as: CNCSProgramOfficer
            - call: "POST /applications/${app_id}/respond-clarification"
              payload: { response: "Second answer" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /applications/${app_id}"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "the second request-clarification from UNDER_REVIEW succeeds (cycle repeats)"
            - "GrantApplication.${app_id}.status == UNDER_REVIEW after the second respond-clarification"
            - "GrantApplication.${app_id}.version == 6 (create v1, submit v2, clarify v3, respond v4, clarify v5, respond v6)"
            - "GrantApplication.${app_id}.clarification_question == \"Clarify match source.\" and clarification_response == \"Second answer\""

      - name: slot_refill_cycle_terminates
        grounds:
          - state_machines.PositionSlot.OPEN_to_RESERVED
          - state_machines.PositionSlot.FILLED_to_VACATED
          - state_machines.PositionSlot.VACATED_to_OPEN
          - state_machines.PositionSlot.VACATED_to_RETIRED
        distinguishing_aspect: "PositionSlot runs the cycle OPEN -> RESERVED -> FILLED -> VACATED -> OPEN once (refill while fill_count < 2 and award ACTIVE) and then exits the cycle to RETIRED on the second vacancy — a cycle with a counter-based termination condition on the slot entity."
        test_recipe:
          setup:
            - "Award with exactly 1 FULL_TIME slot (federal 2300000, CASH match 560000). Member A enrolled (slot FILLED, fill_count 1) with 15300 certified minutes."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 2300000, slot_requests: [{ term_category: "FULL_TIME", count: 1 }], match_lines: [{ category: "CASH", amount_cents: 560000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - *d_submit
            - *d_clock_close
            - *d_close
            - call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 2300000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id, award_v1: $.data.version }
            - call: "GET /awards/${award_id}/slots"
              payload: {}
              as: CNCSProgramOfficer
              captures: { slot_1: "$.data[0].id" }
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_a: $.data.id }
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 15300, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a1: $.data.id }
            - call: "POST /hour-entries/${ent_a1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - *d_member_b
            - *d_check_b
            - *d_clr_b1
            - *d_clr_b2
            - *d_clr_b3
          trigger:
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "COMPELLING_CIRCUMSTANCE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /slots/${slot_1}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { slot_v_mid: $.data.version }
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v2: $.data.version }
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-11-01", service_end_date: "2027-09-01", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_b: $.data.id, slot_of_b: $.data.slot_id }
            - call: "POST /enrollments/${enr_b}/hour-entries"
              payload: { service_date: "2026-11-02", minutes: 15300, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_b1: $.data.id }
            - call: "POST /hour-entries/${ent_b1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /enrollments/${enr_b}/exit"
              payload: { exit_reason: "COMPELLING_CIRCUMSTANCE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /slots/${slot_1}"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "after member A's exit the same PositionSlot.${slot_1} is OPEN again with fill_count == 1 (refill, not replacement)"
            - "the refill selector assigns member B to the SAME slot: MemberEnrollment.${enr_b}.slot_id == ${slot_1}"
            - "after member B's enrollment the slot is FILLED with fill_count == 2"
            - "after member B's exit PositionSlot.${slot_1}.status == RETIRED and fill_count == 2 (cycle terminates; VACATED -> OPEN no longer legal)"
            - "GET /awards/${award_id}/slots returns exactly 1 row whose status == RETIRED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: overdue_corrective_action_suspends_award_and_enrollments
        grounds:
          - state_machines.Finding.ACTION_ASSIGNED_to_ESCALATED
          - state_machines.GrantAward.ACTIVE_to_SUSPENDED
          - state_machines.MemberEnrollment.ACTIVE_to_SUSPENDED
          - endpoints.POST_/compliance/sweep-overdue
        distinguishing_aspect: "Depth-3 mutation chain from one trigger: the overdue sweep escalates the FINDING (hop 1), the finding's escalation itself suspends the AWARD (hop 2), and the award's suspension itself suspends its ACTIVE ENROLLMENTS (hop 3) — observable at depth 4 because a suspended enrollment rejects allowance payments with ERR_ENROLLMENT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Award ACTIVE; member A enrolled and ACTIVE. Visit (created by officer co-one, 2026-11-02) conducted; finding HIGH assigned corrective action due_days 14 at clock 2026-10-02 (due 2026-10-16). Clock advanced to 2026-10-17T00:00:00Z (past due)."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
            - *d_clock_close
            - *d_close
            - *d_award_4m
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
