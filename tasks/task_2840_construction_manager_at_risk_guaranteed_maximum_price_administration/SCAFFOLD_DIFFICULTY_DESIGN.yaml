      - name: post_audit_final_savings_depends_on_cost_report_and_audit_states
        grounds:
          - validations.priority_115_ERR_COST_REPORTS_NOT_RECONCILED
          - validations.priority_116_ERR_AUDIT_NOT_CLOSED
          - calculations.shared_savings_split
          - state_machines.CmarProject.IN_PROGRESS_to_CLOSED
          - state_machines.CostReport.OPEN_to_RECONCILED
        distinguishing_aspect: |
          POST_AUDIT_FINAL is gated by the states of two unrelated neighbours - every CostReport
          of the project and the project's own audit_status - while PRE_AUDIT_PROVISIONAL under
          the very same data is not gated at all and returns 24900.00. The instance unblocks the
          two dependencies one at a time, so the implementation must evaluate the cost-report
          aggregate before the audit gate and must scope both gates to the POST_AUDIT_FINAL
          basis only.
