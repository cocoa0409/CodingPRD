        distinguishing_aspect: "Three distinct 409s from the intake path: a MAIL_IN quote with no ACTIVE CreditPolicy at all (the quote needs mail_in_bonus_pct_bp), a BAG trade-in with no ACTIVE GradePolicy for its (category, grade) pair, and an ACCEPT disposition on a COUNTERFEIT item."
