              as: SchedulingCoordinator
          assert:
            - "${ch_avail0} == 5000000 and ${ch_enc1} == 31650 and ${ch_avail1} == 4968350"
            - "${pc1_prov} == 31650"
            - "first trigger returns service_status == CANCELLED, cancel_reason_code == COORDINATOR_CANCELLED"
            - "GET /pay-claims/${pc1} returns status == VOIDED, provisional_total_cents == 31650 (frozen), final_total_cents == null, late_cancellation == false"
            - "GET /courthouses/${ch_main} returns encumbered_pay_cents == 0, obligated_pay_cents == 0, available_pay_cents == 5000000 — exactly the pre-confirm trio, so the release neither over- nor under-shoots"
            - "GET /interpreters/${i1} returns pending_pay_cents == 0"
            - "${h1_status2} == SCHEDULED (the hearing is schedulable again) and ${h1_v2} is strictly greater than ${h1_v}"
            - "third trigger returns HTTP 201 with service_status == PROPOSED — the released hearing accepts a fresh assignment"
            - "after the third trigger GET /courthouses/${ch_main} still returns encumbered_pay_cents == 0 (a PROPOSED assignment encumbers nothing)"
            - "GET /assignments?hearing_id=${h1} returns total_count == 2 with the first row service_status == CANCELLED and the second PROPOSED, ordered by created_at ASC"

      - name: vacated_appeal_reverses_points_and_roster_without_resurrecting_cancelled_work
        grounds:
          - state_machines.Complaint.APPEALED_to_VACATED
          - state_machines.DisciplinaryAction.IN_EFFECT_to_RESCINDED
          - state_machines.Interpreter.SUSPENDED_to_ACTIVE
          - state_machines.Assignment.compliance.SUBSTANTIATED_DEFECT_to_CLEAR
          - calculations.interpreter_quality_score
          - validations[priority=7]
          - endpoints[POST /complaints/{id}/appeal-decision]
        distinguishing_aspect: |
          The vacatur is a PARTIAL compensation and the boundary between what is
          reversed and what is not is the whole point: points, both quality scores,
          roster_status, suspension_through and the assignment's compliance dimension
          all return to their pre-sanction values, while the assignment the sanction
          cancelled stays CANCELLED, its PayClaim stays VOIDED and the hearing stays
          SCHEDULED. Segregation of duties is enforced across the reversal too — the
          adjudicator pa-001 may not decide the appeal, so pa-002 must.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language spa; courthouse CH_MAIN; rate schedule RS1."
            - "Interpreter Ana Reyes ACTIVE with an ACTIVE CERTIFIED spa credential; hearing H1 at CH_MAIN 2026-08-20T09:00-12:00Z with assignment A1 CONFIRMED (provisional 31650 encumbered)."
            - "Complaint C1 (ACCURACY, MAJOR) filed against A1 by QualityReviewer qr-001, reviewed by qr-002, adjudicated SUBSTANTIATED with sanction_type SUSPENSION and suspension_days 90 by ProgramAdmin pa-001."
            - "That adjudication produced DisciplinaryAction D1: points 12, effective_from 2026-08-01, effective_through 2026-10-30, status IN_EFFECT; Ana went SUSPENDED, complaint_points 12, rolling_12_month_score 52, lifetime_score 52; A1 was cancelled with INTERPRETER_SUSPENDED, its claim VOIDED and H1 returned to SCHEDULED."
            - "Clock advanced to 2026-08-10T00:00:00Z, inside the 30-day appeal window, and Ana filed the appeal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS", accepts_in_person: true, accepts_remote: true }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /interpreters/${i1}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { i1_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v2}" }
              as: CredentialingOfficer
              captures: { cred1: "$.data.id" }
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-0120", hearing_type: "TRIAL", in_custody: true, scheduled_start: "2026-08-20T09:00:00.000Z", scheduled_end: "2026-08-20T12:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v: "$.data.version" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${i1}", delivery_mode: "IN_PERSON", estimated_one_way_miles: 40.0, expected_hearing_version: "${h1_v}" }
              as: SchedulingCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/confirm"
              payload: {}
              as: Interpreter
              as_user_id: "${i1}"
            - call: "GET /pay-claims"
              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", assignment_id: "${a1}", category: "ACCURACY", severity: "MAJOR", narrative: "Counsel reports whole answers omitted during direct examination." }
              as: QualityReviewer
              as_user_id: "qr-001"
              captures: { c1: "$.data.id" }
            - call: "POST /complaints/${c1}/review"
              payload: { recommendation: "SUBSTANTIATE", findings: "Recording confirms two omitted answers." }
              as: QualityReviewer
              as_user_id: "qr-002"
            - call: "POST /complaints/${c1}/adjudicate"
              payload: { disposition: "SUBSTANTIATED", sanction_type: "SUSPENSION", suspension_days: 90 }
              as: ProgramAdmin
              as_user_id: "pa-001"
              captures: { c1_status1: "$.data.status" }
            - call: "GET /disciplinary-actions"
              payload: { interpreter_id: "${i1}" }
              as: ProgramAdmin
              captures: { d1: "$.data[0].id", d1_points: "$.data[0].points", d1_through: "$.data[0].effective_through", d1_status1: "$.data[0].status" }
            - call: "GET /interpreters/${i1}"
              payload: {}
              as: ProgramAdmin
              captures: { i1_roster1: "$.data.roster_status", i1_points1: "$.data.complaint_points", i1_rolling1: "$.data.rolling_12_month_score", i1_lifetime1: "$.data.lifetime_score", i1_susp1: "$.data.suspension_through" }
            - call: "GET /assignments/${a1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { a1_service1: "$.data.service_status", a1_reason1: "$.data.cancel_reason_code", a1_compliance1: "$.data.compliance_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /complaints/${c1}/appeal"
              payload: { grounds: "The omitted answers were struck from the record before interpretation." }
              as: Interpreter
              as_user_id: "${i1}"
              captures: { c1_status2: "$.data.status" }
          trigger:
            - call: "POST /complaints/${c1}/appeal-decision"
              payload: { outcome: "VACATED" }
              as: ProgramAdmin
              as_user_id: "pa-001"
            - call: "POST /complaints/${c1}/appeal-decision"
              payload: { outcome: "VACATED" }
              as: ProgramAdmin
              as_user_id: "pa-002"
          assert:
            - "${c1_status1} == SUBSTANTIATED and ${c1_status2} == APPEALED"
            - "${d1_points} == 12, ${d1_through} == 2026-10-30 (2026-08-01 + 90 days), ${d1_status1} == IN_EFFECT"
            - "${i1_roster1} == SUSPENDED, ${i1_points1} == 12, ${i1_rolling1} == 52 (100 - 4 x 12), ${i1_lifetime1} == 52, ${i1_susp1} == 2026-10-30"
            - "${a1_service1} == CANCELLED, ${a1_reason1} == INTERPRETER_SUSPENDED, ${a1_compliance1} == SUBSTANTIATED_DEFECT"
            - "first trigger returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES (pa-001 adjudicated, so pa-001 cannot decide the appeal) and leaves Complaint.${c1}.status == APPEALED"
            - "second trigger returns HTTP 200 with status == VACATED"
            - "GET /disciplinary-actions?interpreter_id=${i1} returns the row ${d1} with status == RESCINDED and points still 12 on the row itself"
            - "GET /interpreters/${i1} returns roster_status == ACTIVE, suspension_through == null, complaint_points == 0, rolling_12_month_score == 100, lifetime_score == 100 — the RESCINDED action drops out of both variants"
            - "GET /interpreters/${i1}/quality-score returns rolling_12_month_score == 100, lifetime_score == 100, complaint_points == 0, recent_points == 0, older_points == 0"
            - "GET /assignments/${a1} returns compliance_status == CLEAR (the fiscal hold is released) but service_status still CANCELLED with cancel_reason_code INTERPRETER_SUSPENDED — a vacatur never resurrects cancelled work"
            - "GET /pay-claims/${pc1} returns status == VOIDED, final_total_cents == null"
            - "Hearing.${h1}.status == SCHEDULED (still uncovered; the vacatur does not re-cover it)"
            - "GET /courthouses/${ch_main} returns encumbered_pay_cents == 0, obligated_pay_cents == 0, available_pay_cents == 5000000"
