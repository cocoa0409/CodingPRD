              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "the two claims are disjoint (23:00 on 1 September against 00:00 on 3 September), so neither creation trips ERR_RISK_WINDOW_OVERLAP; RiskEvent.${event_a_id}.status == ACCEPTED and RiskEvent.${event_b_id}.status == CLAIMED"
            - "RiskEvent.${event_a_id}.duration_days == 1 = floor(82800 / 86400) + 1 and excused_hours == 2, counting only the two intervals inside the closed window"
            - "RiskEvent.${event_b_id}.duration_days is null and excused_hours == 0, because an unreviewed claim is never sized"
            - "the trigger returns 200 with every interval carrying expected_mwh == 7.0000 = round(25.000 * 0.28, 4), regardless of flag or coverage"
            - "MeterInterval.${h1_id}: flag ECONOMIC inside the ACCEPTED BUYER_BEARS window -> deemed_mwh == 4.0000 = round(max(0, 7.0000 - 3.0000) * 1.0, 4) and delivered_mwh == 7.0000"
            - "MeterInterval.${h2_id}: flag NONE inside the same accepted window -> deemed_mwh == 0.0000 and delivered_mwh == 6.0000, so coverage without a flag earns nothing"
            - "MeterInterval.${h3_id}: flag ECONOMIC outside every accepted window -> deemed_mwh == 0.0000 and delivered_mwh == 3.0000, so a flag without coverage earns nothing"
            - "MeterInterval.${h4_id}: flag GRID_EMERGENCY inside a window that is only CLAIMED -> deemed_mwh == 0.0000 and delivered_mwh == 2.0000, so status CLAIMED is not status ACCEPTED"
            - "SettlementPeriod.${period_id}.total_metered_mwh == 14.0000, total_deemed_mwh == 4.0000 and total_delivered_mwh == 18.0000"
            - "net_settlement_usd == 144.00 = (7.0000 + 6.0000 + 3.0000 + 2.0000) * (30.00 - 22.00), so the single deemed MWh block does reach the money even though it will not reach the registry"

      - name: mintable_attributes_floors_metered_volume_and_ignores_deemed
        claim_type: aggregation
        grounds:
          - calculations.mintable_attributes
          - endpoints.POST_/ppa/settlement-periods/{id}/mint-attributes
          - entities.SettlementPeriod.fields.mintable_attributes_mwh
        distinguishing_aspect: |
          A period with 8.5000 metered MWh and 4.0000 deemed MWh settles on 12.5000
          delivered MWh but can mint only 8 attributes. Three wrong answers are all
          within reach: 12 (flooring delivered volume), 9 (round-half-up of 8.5) and
          13 (rounding delivered). Only physically metered energy earns a certificate,
          because a make-whole payment is money and not electrons, and the floor is a
          truncation rather than a rounding.
