            - { call: "POST /homeownership/mortgage-applications/${app_id}/submit-underwriting", payload: {}, as: MortgageOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "GET /homeownership/programs/${prog_id}", as: MortgageOfficer, as_user_id: "officer-2", captures: { pv_1: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/approve", payload: { expected_program_version: "${pv_1}", resale_restriction_months: 240 }, as: MortgageOfficer, as_user_id: "officer-2" }
            - { call: "GET /homeownership/programs/${prog_id}", as: MortgageOfficer, as_user_id: "officer-2" }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/deny", payload: { denial_reason_code: "READINESS" }, as: MortgageOfficer, as_user_id: "officer-2" }
