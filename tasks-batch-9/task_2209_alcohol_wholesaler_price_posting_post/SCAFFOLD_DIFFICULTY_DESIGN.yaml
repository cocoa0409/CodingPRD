            - "The clock moves to 2026-11-06T00:00:00Z; invoice 2 dated 2026-11-05T00:00:00Z carries one line of 1 case at 110000, a 10000-cent variance, and is FLAGGED. Audit 2 for period 2026-11 is opened and collected, so base_penalty_cents is 4000."
            - "The clock moves to 2026-12-06T00:00:00Z; invoice 3 dated 2026-12-05T00:00:00Z carries one line of 1 case at 100000, a 20000-cent variance, and is FLAGGED. Audit 3 for period 2026-12 is opened and collected, so base_penalty_cents is 8000."
