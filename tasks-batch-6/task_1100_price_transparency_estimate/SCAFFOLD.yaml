scenario: "Healthcare Price-Transparency & Cost-Estimate Service: procedure & CPT/DRG, payer-contract & negotiated-rate ingest, good-faith-estimate (No Surprises) generation, shoppable-service comparison, deductible/benefit accumulation, prior-auth & scheduling linkage, patient-provider dispute, reporting"
domain_name: "price-transparency-estimate"
api_prefix: ""

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_band: Expert
  notes: |
    A patient cost-estimation engine. Negotiated rates (many-to-many between
    Procedure and PayerContract via NegotiatedRate) drive a Good-Faith-Estimate
    whose patient responsibility is computed two ways (ESTIMATE variant at issue
    using accumulators as-of-issue, FINAL variant at settlement using accumulators
    as-of-settlement). Estimates cycle ISSUED<->DISPUTED. Completing a linked
    Appointment cascades settlement -> patient benefit accumulation -> sibling
    estimate staleness. Scheduling collides on two resource entities with
    different interval semantics (Provider buffered, Room strict half-open).

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Procedure
    parent: null
    common_fields: true
    fields:
      - name: code_system
        type: enum
        source: input
        description: "Code standard for this shoppable service."
        constraints: "one of {CPT, HCPCS, DRG}"
      - name: code
        type: string
        source: input
        description: "The CPT/HCPCS/DRG code string, e.g. '70450'."
      - name: description
        type: string
        source: input
        description: "Human-readable procedure name."
      - name: setting
        type: enum
        source: input
        description: "Care setting for the service."
        constraints: "one of {INPATIENT, OUTPATIENT}"
      - name: is_shoppable
        type: boolean
        source: input
        default: true
        description: "Whether the service appears in shoppable-service comparison."
      - name: requires_prior_auth
        type: boolean
        source: input
        default: false
        description: "If true, an appointment for an estimate containing this procedure requires an APPROVED PriorAuthorization."
      - name: gross_charge_cents
        type: integer
        source: input
        description: "Chargemaster list price in cents; basis for PERCENT_OF_CHARGE rates and self-pay pricing."
        constraints: ">= 0"

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: "Name of the insurance payer this contract is with."
      - name: payer_type
        type: enum
        source: input
        description: "Payer category."
        constraints: "one of {COMMERCIAL, MEDICARE, MEDICAID}"
      - name: methodology
        type: enum
        source: input
        description: "How negotiated rates under this contract are expressed."
        constraints: "one of {FEE_SCHEDULE, PERCENT_OF_CHARGE, CASE_RATE}"
      - name: effective_date
        type: datetime
        source: input
        description: "Contract effective date (ISO 8601 UTC)."
      - name: expiration_date
        type: datetime
        source: input
        description: "Contract expiration date (ISO 8601 UTC)."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle state."
        constraints: "one of {DRAFT, ACTIVE}"

  - name: NegotiatedRate
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> PayerContract.id"
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id"
      - name: rate_type
        type: enum
        source: input
        description: "Rate expression form."
        constraints: "one of {FLAT, PERCENT}"
      - name: flat_amount_cents
        type: integer
        source: input
        default: null
        description: "Fixed negotiated allowed amount in cents; required when rate_type=FLAT."
        constraints: ">= 0 when present"
      - name: percent_of_charge
        type: number
        source: input
        default: null
        description: "Fraction of Procedure.gross_charge_cents; required when rate_type=PERCENT (e.g. 0.60)."
        constraints: "0 < percent_of_charge <= 1 when present"
      - name: superseded
        type: boolean
        source: computed
        default: false
        description: "True once a newer rate for the same (contract_id, procedure_id) supersedes this row; superseded rates are excluded from pricing and comparison."

  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: "Payer that administers this benefit plan."
      - name: plan_year
        type: integer
        source: input
        description: "Benefit year, e.g. 2026."
      - name: individual_deductible_cents
        type: integer
        source: input
        description: "Individual annual deductible in cents."
        constraints: ">= 0"
      - name: individual_oop_max_cents
        type: integer
        source: input
        description: "Individual annual out-of-pocket maximum in cents."
        constraints: ">= individual_deductible_cents"
      - name: coinsurance_rate
        type: number
        source: input
        description: "Patient coinsurance share applied to the allowed amount after the deductible is met (e.g. 0.20 = 20%)."
        constraints: "0 <= coinsurance_rate <= 1"
      - name: copay_cents
        type: integer
        source: input
        description: "Flat copay applied once per estimate/visit in cents."
        constraints: ">= 0"
      - name: in_network
        type: boolean
        source: input
        default: true
        description: "Whether this plan is in-network for the provider."

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Patient full name."
      - name: member_id
        type: string
        source: input
        description: "Insurance member identifier."
      - name: benefit_plan_id
        type: string
        source: input
        description: "FK -> BenefitPlan.id"
      - name: deductible_met_cents
        type: integer
        source: computed
        default: 0
        description: "Year-to-date deductible satisfied in cents; accumulator advanced at estimate settlement and by accumulation-adjustments; decremented when a settled estimate is voided."
      - name: oop_met_cents
        type: integer
        source: computed
        default: 0
        description: "Year-to-date out-of-pocket satisfied in cents; accumulator advanced at estimate settlement and by accumulation-adjustments; decremented when a settled estimate is voided."

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Rendering provider name."
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier."
      - name: specialty
        type: string
        source: input
        description: "Clinical specialty."

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Room / equipment label."
      - name: room_type
        type: enum
        source: input
        description: "Kind of room resource."
        constraints: "one of {EXAM, PROCEDURE, IMAGING}"

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: contract_id
        type: string
        source: input
        default: null
        description: "FK -> PayerContract.id; null for GFE_SELFPAY estimates, required for GFE_INSURED."
      - name: estimate_type
        type: enum
        source: input
        description: "Good-Faith-Estimate variety."
        constraints: "one of {GFE_INSURED, GFE_SELFPAY}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle state."
        constraints: "one of {DRAFT, ISSUED, ACCEPTED, DISPUTED, SETTLED, VOID}"
      - name: allowed_amount_cents
        type: integer
        source: computed
        default: null
        description: "Sum of line allowed_amount_cents; set at issue."
      - name: deductible_applied_cents
        type: integer
        source: computed
        default: null
        description: "Portion of allowed applied against the deductible across lines; set at issue and refreshed at settlement."
      - name: coinsurance_cents
        type: integer
        source: computed
        default: null
        description: "Sum of per-line coinsurance (each line rounded then summed); set at issue and refreshed at settlement."
      - name: copay_cents
        type: integer
        source: computed
        default: null
        description: "Copay applied once for this estimate (0 for GFE_SELFPAY); set at issue."
      - name: patient_responsibility_cents
        type: integer
        source: computed
        default: null
        description: "Patient's total responsibility; deductible_applied + coinsurance + copay capped at remaining out-of-pocket; overridden by dispute adjustment."
      - name: plan_paid_cents
        type: integer
        source: computed
        default: null
        description: "allowed_amount_cents - patient_responsibility_cents; the plan's share (0 for GFE_SELFPAY)."
      - name: responsibility_basis
        type: enum
        source: computed
        default: null
        description: "Which variant produced the current numbers."
        constraints: "one of {ESTIMATE, FINAL}"
      - name: recompute_required
        type: boolean
        source: computed
        default: false
        description: "Set true when the patient's accumulators change after this estimate was priced, flagging the projection as stale."
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock timestamp when the estimate was issued."
      - name: settled_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock timestamp when the estimate settled."

  - name: EstimateLine
    parent: Estimate
    common_fields: true
    fields:
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id"
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id"
      - name: line_number
        type: integer
        source: system
        description: "Sequential position within the estimate starting at 1; assigned at creation; defines the deductible-consumption and rounding order."
      - name: allowed_amount_cents
        type: integer
        source: computed
        default: null
        description: "Allowed amount for this line from the pinned negotiated rate (or self-pay price); set at issue."
      - name: deductible_applied_cents
        type: integer
        source: computed
        default: null
        description: "Deductible consumed by this line given lines processed in line_number order; set at issue."
      - name: coinsurance_cents
        type: integer
        source: computed
        default: null
        description: "round_half_up((allowed - deductible_applied) * plan.coinsurance_rate) for this line; set at issue."
      - name: line_patient_responsibility_cents
        type: integer
        source: computed
        default: null
        description: "deductible_applied_cents + coinsurance_cents for this line; set at issue."
      - name: pinned_rate_id
        type: string
        source: computed
        default: null
        description: "Identifier of the NegotiatedRate pinned at issue (version-pinning reference, not a navigational FK); null for self-pay."
      - name: pinned_rate_version
        type: integer
        source: computed
        default: null
        description: "The version integer of the pinned NegotiatedRate captured at issue time."

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id"
      - name: procedure_code
        type: string
        source: input
        description: "The procedure code the authorization covers."
      - name: requested_units
        type: integer
        source: input
        description: "Units/visits requested."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Lifecycle state."
        constraints: "one of {REQUESTED, APPROVED, DENIED, CONSUMED}"
      - name: auth_number
        type: string
        source: computed
        default: null
        description: "Payer-issued authorization number; set on approval."
      - name: approved_units
        type: integer
        source: computed
        default: null
        description: "Units approved; set on approval."
      - name: expiration_date
        type: datetime
        source: computed
        default: null
        description: "Authorization expiry (ISO 8601 UTC); set on approval."
      - name: denial_reason
        type: string
        source: computed
        default: null
        description: "Reason text; set on denial."

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id"
      - name: prior_auth_id
        type: string
        source: input
        default: null
        description: "FK -> PriorAuthorization.id; required when any line procedure requires_prior_auth, else null."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Slot start (ISO 8601 UTC), inclusive."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Slot end (ISO 8601 UTC), exclusive."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Lifecycle state."
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id"
      - name: reason
        type: string
        source: input
        description: "Patient's stated reason for disputing the estimate."
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Amount the patient disputes in cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Lifecycle state."
        constraints: "one of {OPEN, UNDER_REVIEW, RESOLVED_UPHELD, RESOLVED_ADJUSTED}"
      - name: resolution_note
        type: string
        source: computed
        default: null
        description: "Reviewer's resolution note; set at resolution."
      - name: adjusted_patient_responsibility_cents
        type: integer
        source: computed
        default: null
        description: "New patient responsibility applied to the estimate when resolution=ADJUSTED; null when UPHELD."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PayerContract
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /payer-contracts/{id}/activate"
        actor: PayerAnalyst
        preconditions: ["contract in DRAFT"]
        side_effects: ["increments PayerContract.version by 1"]
        note: "ACTIVE is required before an insured estimate referencing this contract may be issued."

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /estimates/{id}/issue"
        actor: ProviderStaff
        preconditions:
          - "estimate in DRAFT"
          - "for GFE_INSURED: referenced PayerContract.status == ACTIVE"
          - "estimate has >= 1 EstimateLine"
          - "for GFE_INSURED: every line's procedure has a non-superseded NegotiatedRate under the estimate's contract"
        side_effects:
          - "compute each line allowed_amount_cents from the pinned NegotiatedRate (FLAT -> flat_amount_cents; PERCENT -> round_half_up(gross_charge_cents * percent_of_charge)); for GFE_SELFPAY allowed = round_half_up(gross_charge_cents * (1 - SELF_PAY_DISCOUNT_PCT))"
          - "pin pinned_rate_id and pinned_rate_version on each line"
          - "run calc estimate_line_aggregation then calc estimate_patient_responsibility with responsibility_basis=ESTIMATE using patient accumulators as of issue"
          - "set allowed_amount_cents, deductible_applied_cents, coinsurance_cents, copay_cents, patient_responsibility_cents, plan_paid_cents, issued_at"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /estimates/{id}/accept"
        actor: PatientUser
        preconditions: ["estimate in ISSUED", "acting PatientUser owns the estimate's patient"]
        side_effects: ["increments Estimate.version by 1"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /disputes (estimate_id)"
        actor: PatientUser
        preconditions: ["estimate in ISSUED", "acting PatientUser owns the estimate's patient"]
        side_effects: ["a Dispute is created in OPEN"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /disputes/{id}/resolve"
        actor: ProviderStaff
        preconditions: ["a linked Dispute is UNDER_REVIEW"]
        side_effects:
          - "resolution=UPHELD: estimate numbers unchanged"
          - "resolution=ADJUSTED: patient_responsibility_cents := adjusted value; plan_paid_cents := allowed_amount_cents - patient_responsibility_cents (allowed_amount_cents conserved)"
        note: "Cyclic revision loop ISSUED -> DISPUTED -> ISSUED."
      - from: ACCEPTED
        to: SETTLED
        trigger: "system: POST /appointments/{id}/complete on the linked appointment"
        actor: system
        preconditions: ["estimate in ACCEPTED", "linked Appointment transitions to COMPLETED"]
        side_effects:
          - "re-run calc estimate_patient_responsibility with responsibility_basis=FINAL using patient accumulators as of settlement"
          - "set settled_at"
          - "Patient.deductible_met_cents += deductible_applied_cents; Patient.oop_met_cents += patient_responsibility_cents; Patient.version += 1 (cascade)"
          - "every other non-terminal Estimate of the same patient sets recompute_required=true (cascade)"
      - from: ISSUED
        to: VOID
        trigger: "POST /estimates/{id}/void"
        actor: ProviderStaff
        preconditions: ["estimate in {ISSUED, ACCEPTED, SETTLED}"]
        side_effects: ["increments Estimate.version by 1"]
      - from: ACCEPTED
        to: VOID
        trigger: "POST /estimates/{id}/void"
        actor: ProviderStaff
        preconditions: ["estimate in {ISSUED, ACCEPTED, SETTLED}"]
        side_effects: ["increments Estimate.version by 1"]
      - from: SETTLED
        to: VOID
        trigger: "POST /estimates/{id}/void"
        actor: ProviderStaff
        preconditions: ["estimate in {ISSUED, ACCEPTED, SETTLED}"]
        side_effects:
          - "compensation: Patient.deductible_met_cents -= this estimate's deductible_applied_cents; Patient.oop_met_cents -= this estimate's patient_responsibility_cents; Patient.version += 1"
        note: "Voiding a SETTLED estimate reverses exactly the accumulation applied at settlement (Rule 9 invariant A)."

  - entity: PriorAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, CONSUMED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/approve"
        actor: PayerAnalyst
        preconditions: ["prior auth in REQUESTED"]
        side_effects: ["set auth_number, approved_units, expiration_date"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/deny"
        actor: PayerAnalyst
        preconditions: ["prior auth in REQUESTED"]
        side_effects: ["set denial_reason"]
      - from: APPROVED
        to: CONSUMED
        trigger: "system: POST /appointments/{id}/complete on the linked appointment"
        actor: system
        preconditions: ["prior auth in APPROVED", "linked Appointment transitions to COMPLETED"]
        side_effects: []
        note: "Branching machine REQUESTED -> {APPROVED, DENIED}."

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: ProviderStaff
        preconditions: ["appointment in SCHEDULED"]
        side_effects:
          - "linked Estimate ACCEPTED -> SETTLED (cascade, see Estimate machine)"
          - "linked PriorAuthorization APPROVED -> CONSUMED (cascade)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: ProviderStaff
        preconditions: ["appointment in SCHEDULED"]
        side_effects: ["frees the provider and room intervals"]
        note: "Branching machine SCHEDULED -> {COMPLETED, CANCELLED}."

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/assign"
        actor: ProviderStaff
        preconditions: ["dispute in OPEN"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve (resolution=UPHELD)"
        actor: ProviderStaff
        preconditions: ["dispute in UNDER_REVIEW"]
        side_effects: ["linked Estimate DISPUTED -> ISSUED with numbers unchanged"]
      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /disputes/{id}/resolve (resolution=ADJUSTED)"
        actor: ProviderStaff
        preconditions: ["dispute in UNDER_REVIEW", "0 <= adjusted_patient_responsibility_cents <= estimate.patient_responsibility_cents"]
        side_effects:
          - "set adjusted_patient_responsibility_cents, resolution_note"
          - "linked Estimate DISPUTED -> ISSUED; estimate.patient_responsibility_cents := adjusted value; estimate.plan_paid_cents := allowed_amount_cents - adjusted value (allowed conserved, Rule 9 invariant B)"
        note: "Branching machine UNDER_REVIEW -> {RESOLVED_UPHELD, RESOLVED_ADJUSTED}."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /estimates"
    occ_field: "expected_patient_version"
    description: |
      Creating an Estimate against a Patient whose version has advanced since the
      client last observed it is rejected. The estimate is meaningful only against
      the benefit-accumulation baseline the client last saw; a stale
      expected_patient_version means the patient's accumulators advanced (another
      estimate was attached, an accumulation was posted, or a prior estimate
      settled) since the client read, so the baseline is stale. Each successful
      create advances Patient.version, so a second create carrying the pre-create
      version is deterministically rejected.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
  - rule_id: rate-ingest-stale-contract
    parent_entity: PayerContract
    write_endpoint: "POST /negotiated-rates"
    occ_field: "expected_contract_version"
    description: |
      Ingesting a NegotiatedRate against a PayerContract whose version has advanced
      since the client last observed it is rejected. A new rate for the same
      (contract, procedure) supersedes the prior one; a stale contract version means
      another ingest batch already advanced the contract.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_allowed_amount
    trigger: "POST /estimates/{id}/issue (per line)"
    algorithm: threshold
    formula: |
      if estimate_type == GFE_SELFPAY:
        allowed = round_half_up(procedure.gross_charge_cents * (1 - SELF_PAY_DISCOUNT_PCT))
      else:  # GFE_INSURED, pinned NegotiatedRate under estimate.contract for line.procedure
        if rate.rate_type == FLAT:   allowed = rate.flat_amount_cents
        if rate.rate_type == PERCENT: allowed = round_half_up(procedure.gross_charge_cents * rate.percent_of_charge)
    input_set: "The single non-superseded NegotiatedRate for (estimate.contract_id, line.procedure_id); for self-pay, only the procedure gross charge."
    constants:
      SELF_PAY_DISCOUNT_PCT: 0.35
    precision: "whole cents, round_half_up"

  - name: estimate_line_aggregation
    trigger: "POST /estimates/{id}/issue and estimate settlement"
    algorithm: aggregation
    formula: |
      # Lines processed in line_number ASC order (deterministic; never id).
      running_dm = patient.deductible_met_cents            # as-of the variant's clock
      for line in lines_ordered_by_line_number_asc:
        remaining_ded = max(0, plan.individual_deductible_cents - running_dm)
        line.deductible_applied_cents = min(line.allowed_amount_cents, remaining_ded)
        line.coinsurance_cents = round_half_up((line.allowed_amount_cents - line.deductible_applied_cents) * plan.coinsurance_rate)   # ROUND PER LINE
        line.line_patient_responsibility_cents = line.deductible_applied_cents + line.coinsurance_cents
        running_dm += line.deductible_applied_cents
      estimate.deductible_applied_cents = sum(line.deductible_applied_cents)
      estimate.coinsurance_cents        = sum(line.coinsurance_cents)   # per-line rounded THEN summed
    input_set: "All EstimateLine rows of the estimate, ordered by line_number ASC."
    constants: {}
    precision: "whole cents, round_half_up; per-line rounding pinned (round each line's coinsurance, then sum) — NOT sum-then-round."

  - name: estimate_patient_responsibility
    trigger: "POST /estimates/{id}/issue (ESTIMATE variant) and estimate settlement (FINAL variant)"
    algorithm: threshold
    formula: |
      if estimate_type == GFE_SELFPAY:
        patient_responsibility_cents = allowed_amount_cents
        plan_paid_cents = 0
        copay_cents = 0
      else:
        copay_cents = plan.copay_cents
        pre_oop = estimate.deductible_applied_cents + estimate.coinsurance_cents + copay_cents
        remaining_oop = max(0, plan.individual_oop_max_cents - patient.oop_met_cents)   # as-of the variant's clock
        patient_responsibility_cents = min(pre_oop, remaining_oop)
        plan_paid_cents = allowed_amount_cents - patient_responsibility_cents
    input_set: "estimate.deductible_applied_cents & coinsurance_cents (from estimate_line_aggregation), plan.copay_cents, plan.individual_oop_max_cents, patient.oop_met_cents."
    constants: {}
    precision: "whole cents"
    variants:
      - name: ESTIMATE
        when: "at POST /estimates/{id}/issue"
        difference: "uses patient.deductible_met_cents and patient.oop_met_cents as of issue time (responsibility_basis=ESTIMATE)."
      - name: FINAL
        when: "at settlement (appointment complete)"
        difference: "uses patient.deductible_met_cents and patient.oop_met_cents as of settlement time; because intervening claims/adjustments may have advanced the accumulators, FINAL can differ from ESTIMATE for identical allowed amounts (responsibility_basis=FINAL)."

  - name: shoppable_comparison_price
    trigger: "GET /procedures/{id}/comparison"
    algorithm: aggregation
    formula: |
      candidates = [ line_allowed for each non-superseded NegotiatedRate r where
                     r.procedure_id == id AND r.contract.status == ACTIVE
                     AND (payer_type filter matches if supplied) ]
      # line_allowed uses the FLAT / PERCENT rule from line_allowed_amount.
      sample_count = len(candidates)
      if sample_count == 0:
        median_allowed_cents = null; min_allowed_cents = null
      else:
        sorted_asc = sort(candidates ascending)
        min_allowed_cents = sorted_asc[0]
        if sample_count is odd:  median_allowed_cents = sorted_asc[sample_count//2]
        else:                    median_allowed_cents = round_half_up((sorted_asc[n/2 - 1] + sorted_asc[n/2]) / 2)
      self_pay_price_cents = round_half_up(procedure.gross_charge_cents * (1 - SELF_PAY_DISCOUNT_PCT))
    input_set: "Non-superseded NegotiatedRate rows for the procedure whose contract is ACTIVE."
    constants:
      SELF_PAY_DISCOUNT_PCT: 0.35
    precision: "whole cents, round_half_up"
    variants:
      - name: MEDIAN
        when: "median_allowed_cents field"
        difference: "central negotiated allowed across contracts (mean of the two middle values, rounded, when the count is even)."
      - name: MIN
        when: "min_allowed_cents field"
        difference: "lowest negotiated allowed across contracts; diverges from MEDIAN whenever rates are not all equal."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation (RBAC §1.7); PatientUser mutations must own the target patient"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "required body fields present, correct type, enum values legal, numeric ranges honored; rate_type=FLAT requires flat_amount_cents, rate_type=PERCENT requires percent_of_charge"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 4
    category: existence
    check: "every referenced resource (path id and FK body fields) exists, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /estimates, POST /negotiated-rates"
  - priority: 6
    category: state
    check: "target resource is in a legal state for this transition (own-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"
  - priority: 7
    category: state
    check: "cross-entity state: for GFE_INSURED issue the PayerContract.status == ACTIVE; for appointment scheduling the Estimate.status == ACCEPTED"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /estimates/{id}/issue, POST /appointments"
  - priority: 8
    category: business_constraint
    check: "estimate has at least one line at issue; dispute adjustment within [0, estimate.patient_responsibility_cents]; estimate_type/contract_id consistency (INSURED needs contract, SELFPAY forbids it)"
    error_id: ERR_ESTIMATE_NO_LINES
    http_status: 422
    applies_to: "POST /estimates/{id}/issue, POST /disputes/{id}/resolve, POST /estimates"
  - priority: 9
    category: business_referential
    check: "appointment scheduling: when any line procedure requires_prior_auth, prior_auth_id is supplied and its PriorAuthorization is APPROVED and not expired"
    error_id: ERR_PRIOR_AUTH_NOT_APPROVED
    http_status: 409
    applies_to: "POST /appointments"
  - priority: 10
    category: business_fiscal
    check: "for GFE_INSURED issue, every line's procedure has a non-superseded NegotiatedRate under the estimate's contract"
    error_id: ERR_NO_NEGOTIATED_RATE
    http_status: 422
    applies_to: "POST /estimates/{id}/issue"
  - priority: 11
    category: business_temporal
    check: "provider is free: no SCHEDULED/COMPLETED appointment for the same provider within CLEANUP_BUFFER_MINUTES of the requested interval (buffered)"
    error_id: ERR_PROVIDER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments"
  - priority: 12
    category: business_temporal
    check: "room is free: no SCHEDULED/COMPLETED appointment for the same room whose half-open [start,end) interval overlaps the requested [start,end) (adjacency allowed, no buffer)"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments"

constants:
  SELF_PAY_DISCOUNT_PCT: 0.35
  CLEANUP_BUFFER_MINUTES: 15
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Procedure ----
  - method: POST
    path: "/procedures"
    description: "Create a shoppable procedure (chargemaster entry)."
    roles: [ProviderStaff]
    code: 201
    input: [code_system, code, description, setting, "is_shoppable?", "requires_prior_auth?", gross_charge_cents]
    output: Procedure
    side_effects: []
  - method: GET
    path: "/procedures/{id}"
    description: "Fetch a procedure."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Procedure
    side_effects: []
  - method: GET
    path: "/procedures"
    description: "List procedures (paginated)."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["code_system?", "is_shoppable?", "limit?", "offset?"]
    output: Procedure[]
    side_effects: []
  - method: GET
    path: "/procedures/{id}/comparison"
    description: "Shoppable-service comparison: median/min negotiated allowed across ACTIVE contracts plus self-pay price."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["payer_type?"]
    output: "{ procedure_id: string, sample_count: integer, median_allowed_cents: integer, min_allowed_cents: integer, gross_charge_cents: integer, self_pay_price_cents: integer }"
    side_effects: []

  # ---- PayerContract ----
  - method: POST
    path: "/payer-contracts"
    description: "Create a payer contract (DRAFT)."
    roles: [PayerAnalyst]
    code: 201
    input: [payer_name, payer_type, methodology, effective_date, expiration_date]
    output: PayerContract
    side_effects: []
  - method: GET
    path: "/payer-contracts/{id}"
    description: "Fetch a payer contract."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: PayerContract
    side_effects: []
  - method: POST
    path: "/payer-contracts/{id}/activate"
    description: "Activate a DRAFT contract."
    roles: [PayerAnalyst]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["PayerContract.status DRAFT -> ACTIVE", "increments PayerContract.version by 1"]

  # ---- NegotiatedRate ----
  - method: POST
    path: "/negotiated-rates"
    description: "Ingest a negotiated rate for a (contract, procedure); supersedes any prior rate for that pair. OCC on the contract."
    roles: [PayerAnalyst]
    code: 201
    input: [contract_id, procedure_id, rate_type, "flat_amount_cents?", "percent_of_charge?", expected_contract_version]
    output: NegotiatedRate
    side_effects:
      - "prior non-superseded NegotiatedRate for the same (contract_id, procedure_id) sets superseded=true"
      - "increments PayerContract.version by 1"
  - method: GET
    path: "/negotiated-rates/{id}"
    description: "Fetch a negotiated rate."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: NegotiatedRate
    side_effects: []
  - method: GET
    path: "/negotiated-rates"
    description: "List negotiated rates; filter by contract and/or procedure."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["contract_id?", "procedure_id?", "superseded?", "limit?", "offset?"]
    output: NegotiatedRate[]
    side_effects: []

  # ---- BenefitPlan ----
  - method: POST
    path: "/benefit-plans"
    description: "Create a patient benefit plan."
    roles: [PayerAnalyst]
    code: 201
    input: [payer_name, plan_year, individual_deductible_cents, individual_oop_max_cents, coinsurance_rate, copay_cents, "in_network?"]
    output: BenefitPlan
    side_effects: []
  - method: GET
    path: "/benefit-plans/{id}"
    description: "Fetch a benefit plan."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: BenefitPlan
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient against a benefit plan."
    roles: [ProviderStaff]
    code: 201
    input: [name, member_id, benefit_plan_id]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient including accumulators."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients; filter by benefit plan."
    roles: [ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["benefit_plan_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: POST
    path: "/patients/{id}/accumulation-adjustments"
    description: "Apply an external benefit accumulation (e.g. from an EOB adjudicated elsewhere) to the patient's year-to-date deductible/out-of-pocket."
    roles: [PayerAnalyst]
    code: 200
    input: [deductible_delta_cents, oop_delta_cents, source]
    output: Patient
    side_effects:
      - "Patient.deductible_met_cents += deductible_delta_cents; Patient.oop_met_cents += oop_delta_cents"
      - "increments Patient.version by 1"
      - "every non-terminal Estimate of this patient sets recompute_required=true (cascade)"

  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Create a rendering provider (schedulable resource)."
    roles: [ProviderStaff]
    code: 201
    input: [name, npi, specialty]
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers/{id}"
    description: "Fetch a provider."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- Room ----
  - method: POST
    path: "/rooms"
    description: "Create a room/equipment (schedulable resource)."
    roles: [ProviderStaff]
    code: 201
    input: [name, room_type]
    output: Room
    side_effects: []
  - method: GET
    path: "/rooms/{id}"
    description: "Fetch a room."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Room
    side_effects: []

  # ---- Estimate ----
  - method: POST
    path: "/estimates"
    description: "Create a Good-Faith-Estimate (DRAFT); supersedes the patient's prior non-terminal estimate. OCC on the patient."
    roles: [PatientUser, ProviderStaff]
    code: 201
    input: [patient_id, estimate_type, "contract_id?", expected_patient_version]
    output: Estimate
    side_effects:
      - "attaches the new DRAFT estimate to the patient and snapshots the accumulation baseline"
      - "increments Patient.version by 1"
  - method: GET
    path: "/estimates/{id}"
    description: "Fetch an estimate."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List estimates; filter by patient, contract, status."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["patient_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []
  - method: POST
    path: "/estimates/{id}/lines"
    description: "Add a line (procedure) to a DRAFT estimate; assigns the next line_number."
    roles: [PatientUser, ProviderStaff]
    code: 201
    input: [procedure_id]
    output: EstimateLine
    side_effects: ["line_number assigned sequentially from 1"]
  - method: POST
    path: "/estimates/{id}/issue"
    description: "Price and issue a DRAFT estimate (ESTIMATE variant)."
    roles: [ProviderStaff]
    code: 200
    input: []
    output: Estimate
    side_effects:
      - "Estimate.status DRAFT -> ISSUED"
      - "runs line_allowed_amount, estimate_line_aggregation, estimate_patient_responsibility (ESTIMATE), sets money fields and issued_at"
      - "increments Estimate.version by 1"
  - method: POST
    path: "/estimates/{id}/accept"
    description: "Patient accepts an ISSUED estimate."
    roles: [PatientUser]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate.status ISSUED -> ACCEPTED", "increments Estimate.version by 1"]
  - method: POST
    path: "/estimates/{id}/void"
    description: "Void an estimate; voiding a SETTLED estimate reverses its benefit accumulation."
    roles: [ProviderStaff]
    code: 200
    input: []
    output: Estimate
    side_effects:
      - "Estimate.status -> VOID"
      - "if prior status was SETTLED: Patient.deductible_met_cents -= deductible_applied_cents; Patient.oop_met_cents -= patient_responsibility_cents; Patient.version += 1"

  # ---- EstimateLine ----
  - method: GET
    path: "/estimate-lines/{id}"
    description: "Fetch an estimate line."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: EstimateLine
    side_effects: []
  - method: GET
    path: "/estimate-lines"
    description: "List estimate lines; filter by estimate and/or procedure."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["estimate_id?", "procedure_id?", "limit?", "offset?"]
    output: EstimateLine[]
    side_effects: []

  # ---- PriorAuthorization ----
  - method: POST
    path: "/prior-authorizations"
    description: "Request prior authorization for a procedure on an estimate."
    roles: [ProviderStaff]
    code: 201
    input: [estimate_id, procedure_code, requested_units]
    output: PriorAuthorization
    side_effects: []
  - method: GET
    path: "/prior-authorizations/{id}"
    description: "Fetch a prior authorization."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []
  - method: GET
    path: "/prior-authorizations"
    description: "List prior authorizations; filter by estimate."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["estimate_id?", "status?", "limit?", "offset?"]
    output: PriorAuthorization[]
    side_effects: []
  - method: POST
    path: "/prior-authorizations/{id}/approve"
    description: "Payer approves a prior authorization."
    roles: [PayerAnalyst]
    code: 200
    input: [auth_number, approved_units, expiration_date]
    output: PriorAuthorization
    side_effects: ["PriorAuthorization.status REQUESTED -> APPROVED", "increments PriorAuthorization.version by 1"]
  - method: POST
    path: "/prior-authorizations/{id}/deny"
    description: "Payer denies a prior authorization."
    roles: [PayerAnalyst]
    code: 200
    input: [denial_reason]
    output: PriorAuthorization
    side_effects: ["PriorAuthorization.status REQUESTED -> DENIED", "increments PriorAuthorization.version by 1"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Schedule an appointment for an ACCEPTED estimate; enforces prior-auth and provider/room availability."
    roles: [ProviderStaff]
    code: 201
    input: [patient_id, estimate_id, provider_id, room_id, "prior_auth_id?", scheduled_start, scheduled_end]
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Fetch an appointment."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments; filter by patient, estimate, provider, room, prior auth, status."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["patient_id?", "estimate_id?", "provider_id?", "room_id?", "prior_auth_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Mark an appointment completed; cascades estimate settlement, benefit accumulation, prior-auth consumption."
    roles: [ProviderStaff]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.status SCHEDULED -> COMPLETED"
      - "linked Estimate ACCEPTED -> SETTLED (recompute FINAL, accumulate patient benefits, flag sibling estimates stale)"
      - "linked PriorAuthorization APPROVED -> CONSUMED"
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a scheduled appointment; frees provider and room."
    roles: [ProviderStaff, PatientUser]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment.status SCHEDULED -> CANCELLED"]

  # ---- Dispute ----
  - method: POST
    path: "/disputes"
    description: "Patient files a dispute against an ISSUED estimate."
    roles: [PatientUser]
    code: 201
    input: [estimate_id, reason, disputed_amount_cents]
    output: Dispute
    side_effects: ["linked Estimate ISSUED -> DISPUTED"]
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch a dispute."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes; filter by estimate and status."
    roles: [PatientUser, ProviderStaff, PayerAnalyst, Admin]
    code: 200
    input: ["estimate_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/assign"
    description: "Provider takes an OPEN dispute under review."
    roles: [ProviderStaff]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status OPEN -> UNDER_REVIEW", "increments Dispute.version by 1"]
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Provider resolves a dispute; ADJUSTED rewrites the estimate's patient/plan split, conserving the allowed amount; both outcomes return the estimate to ISSUED."
    roles: [ProviderStaff]
    code: 200
    input: [resolution, "adjusted_patient_responsibility_cents?", "resolution_note?"]
    output: Dispute
    side_effects:
      - "Dispute.status UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_ADJUSTED"
      - "linked Estimate DISPUTED -> ISSUED"
      - "ADJUSTED: estimate.patient_responsibility_cents := adjusted value; estimate.plan_paid_cents := allowed_amount_cents - adjusted value"

  # ---- Reporting ----
  - method: GET
    path: "/reports/price-transparency"
    description: "Aggregate transparency report: rate counts and average negotiated allowed by code system."
    roles: [Admin]
    code: 200
    input: ["code_system?", "payer_type?"]
    output: "{ procedure_count: integer, rate_count: integer, avg_allowed_cents_by_code_system: object, issued_estimate_count: integer }"
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted, or PatientUser acting on a patient it does not own."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing/invalid body field, illegal enum, out-of-range number, or rate_type/amount mismatch."
  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "Referenced procedure id does not exist."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Referenced payer contract id does not exist."
  - id: ERR_RATE_NOT_FOUND
    http: 404
    condition: "Referenced negotiated rate id does not exist."
  - id: ERR_BENEFIT_PLAN_NOT_FOUND
    http: 404
    condition: "Referenced benefit plan id does not exist."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "Referenced patient id does not exist."
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Referenced provider id does not exist."
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "Referenced room id does not exist."
  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "Referenced estimate id does not exist."
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "Referenced estimate line id does not exist."
  - id: ERR_PRIOR_AUTH_NOT_FOUND
    http: 404
    condition: "Referenced prior authorization id does not exist."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Referenced appointment id does not exist."
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "Referenced dispute id does not exist."
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not match the patient's current version on POST /estimates."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the contract's current version on POST /negotiated-rates."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a legal state for the requested transition."
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Issuing a GFE_INSURED estimate whose PayerContract is not ACTIVE."
  - id: ERR_ESTIMATE_NOT_ACCEPTED
    http: 409
    condition: "Scheduling an appointment for an estimate that is not ACCEPTED."
  - id: ERR_ESTIMATE_NO_LINES
    http: 422
    condition: "Issuing an estimate that has no lines."
  - id: ERR_ESTIMATE_TYPE_CONTRACT_MISMATCH
    http: 422
    condition: "GFE_INSURED without a contract_id, or GFE_SELFPAY with a contract_id."
  - id: ERR_INVALID_ADJUSTMENT
    http: 422
    condition: "Dispute ADJUSTED with adjusted_patient_responsibility_cents outside [0, estimate.patient_responsibility_cents], or ADJUSTED without the field."
  - id: ERR_PRIOR_AUTH_NOT_APPROVED
    http: 409
    condition: "Appointment requires prior auth but prior_auth_id is missing or its authorization is not APPROVED."
  - id: ERR_PRIOR_AUTH_EXPIRED
    http: 409
    condition: "The referenced prior authorization is APPROVED but its expiration_date is before the appointment start."
  - id: ERR_NO_NEGOTIATED_RATE
    http: 422
    condition: "Issuing a GFE_INSURED estimate whose line procedure has no non-superseded negotiated rate under the contract."
  - id: ERR_PROVIDER_UNAVAILABLE
    http: 409
    condition: "Provider already occupied within CLEANUP_BUFFER_MINUTES of the requested interval."
  - id: ERR_ROOM_UNAVAILABLE
    http: 409
    condition: "Room's half-open [start,end) interval overlaps an existing booking."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PatientUser
    description: "A patient acting on their own estimates, disputes, and appointments."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /estimates/{id}/accept"
      - "POST /disputes"
    shared_operations:
      - "POST /estimates"
      - "POST /estimates/{id}/lines"
      - "POST /appointments/{id}/cancel"
      - "GET reads on own resources and comparison"
  - name: ProviderStaff
    description: "Provider-side operational staff who define procedures/resources, issue estimates, schedule/complete care, and review disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /procedures"
      - "POST /providers"
      - "POST /rooms"
      - "POST /patients"
      - "POST /estimates/{id}/issue"
      - "POST /estimates/{id}/void"
      - "POST /prior-authorizations"
      - "POST /appointments"
      - "POST /appointments/{id}/complete"
      - "POST /disputes/{id}/assign"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "POST /estimates"
      - "POST /estimates/{id}/lines"
      - "POST /appointments/{id}/cancel"
      - "GET reads"
  - name: PayerAnalyst
    description: "Payer-side staff who ingest contracts, negotiated rates, and benefit plans, decide prior authorizations, and post external accumulations."
    identity: "opaque"
    exclusive_operations:
      - "POST /payer-contracts"
      - "POST /payer-contracts/{id}/activate"
      - "POST /negotiated-rates"
      - "POST /benefit-plans"
      - "POST /patients/{id}/accumulation-adjustments"
      - "POST /prior-authorizations/{id}/approve"
      - "POST /prior-authorizations/{id}/deny"
    shared_operations:
      - "GET reads"
  - name: Admin
    description: "System operator: reporting and logical clock."
    identity: "opaque"
    exclusive_operations:
      - "GET /reports/price-transparency"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"
