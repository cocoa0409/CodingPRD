scenario: "2298. Subscription Retention & Cancellation Management (direct-to-consumer subscription brand): cancellation flow design with reason capture and offer presentation subject to simple-cancellation requirements, save offer eligibility rules across pause, skip, discount and plan downgrade with margin guardrails, dunning management for failed payments with retry logic, card updater services and grace periods, cohort retention analysis by acquisition channel, plan and tenure with lifetime value modeling, win-back campaign targeting for lapsed subscribers with offer suppression rules, subscription modification including frequency changes, add-ons and shipment skipping, negative-option disclosure and renewal reminder compliance, involuntary versus voluntary churn separation and remediation"
domain_name: "subscription-retention-cancellation"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nested ownership URLs except
  # the single `GET /subscriptions/{id}/compliance-notices` reverse-reachability read.

  state_machine_shape: parallel
  # Subscription carries two independent axes (lifecycle_state x billing_state) that
  # evolve from different triggers; WinBackTarget is cyclic
  # (ELIGIBLE -> SENT -> EXPIRED -> ELIGIBLE); CancellationSession forks
  # (REASON_CAPTURED -> {OFFERS_PRESENTED, COMPLETED_CANCELLED}).

  relationship_patterns:
    - one_to_many          # Subscriber -> Subscription -> Invoice -> DunningAttempt
    - self_referential     # Plan.downgrade_target_plan_id, DunningAttempt.previous_attempt_id,
                           # SubscriptionModification.reverses_modification_id
    - cross_aggregate      # SaveOfferGrant links CancellationSession, SaveOfferTemplate and Subscription
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The RetentionSpecialist user id that presented a save offer may never be the
  # ComplianceOfficer user id that approves that grant's margin-floor exception.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique plan code"
        constraints: "unique across Plan; uppercase letters, digits and underscore only"
      - name: name
        type: string
        source: input
        description: "Human-readable plan name"
      - name: monthly_price_cents
        type: integer
        source: input
        description: "List price charged per shipment cycle, in cents"
        constraints: "> 0"
      - name: unit_cogs_cents
        type: integer
        source: input
        description: "Cost of goods per shipment, in cents; used by every margin calculation"
        constraints: ">= 0"
      - name: shipments_per_cycle
        type: integer
        source: input
        description: "Shipments billed on one invoice cycle"
        default: 1
        constraints: ">= 1"
      - name: shipments_per_term
        type: integer
        source: input
        description: "Shipment units allotted to one subscription term; conserved quantity for skip accounting"
        default: 12
        constraints: ">= 1"
      - name: allowed_frequency_weeks
        type: array
        source: input
        description: "Permitted values for Subscription.frequency_weeks"
        default: [2, 4, 8]
        constraints: "non-empty array of positive integers"
      - name: margin_floor_pct
        type: number
        source: input
        description: "Minimum blended-term margin a save offer may leave; guardrail threshold"
        constraints: "0.0000 <= value <= 1.0000, 4 decimal places"
      - name: is_negative_option
        type: boolean
        source: input
        description: "True when the plan auto-renews under a negative-option offer and is subject to the renewal-reminder gate"
        default: true
      - name: renewal_reminder_days_before
        type: integer
        source: input
        description: "Days before next_renewal_at at which the RENEWAL_REMINDER notice is auto-scheduled and the legal window opens"
        default: 10
        constraints: ">= MIN_REMINDER_LEAD_DAYS (3)"
      - name: max_pause_cycles
        type: integer
        source: input
        description: "Maximum cycles a single PAUSE may span"
        default: 3
        constraints: ">= 1"
      - name: addon_catalog
        type: array
        source: input
        description: "Array of { code, unit_price_cents, unit_cogs_cents } offered on this plan"
        default: []
      - name: downgrade_target_plan_id
        type: string
        source: input
        description: "FK -> Plan.id; plan a PLAN_DOWNGRADE save offer moves the subscription to; null makes downgrade offers ineligible"
        default: null
      - name: status
        type: enum
        source: input
        description: "Plan availability"
        default: ACTIVE
        constraints: "status IN {ACTIVE, RETIRED}"
      - name: active_subscription_count
        type: integer
        source: computed
        description: "Count of Subscription rows with plan_id == this.id and lifecycle_state IN {ACTIVE, PAUSED, PENDING_CANCEL}"

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Subscriber email"
        constraints: "unique across Subscriber"
      - name: acquisition_channel
        type: enum
        source: input
        description: "Channel that acquired the subscriber; drives cohort grouping and projected churn rate"
        constraints: "acquisition_channel IN {PAID_SOCIAL, SEARCH, AFFILIATE, ORGANIC, REFERRAL}"
      - name: do_not_contact
        type: boolean
        source: input
        description: "Marketing opt-out; suppresses win-back targeting"
        default: false
      - name: first_subscribed_at
        type: datetime
        source: computed
        description: "Logical clock at creation of this subscriber's first Subscription; null until then; never overwritten"
      - name: lapsed_at
        type: datetime
        source: computed
        description: "Logical clock at the moment the subscriber's last non-CANCELLED Subscription reached lifecycle_state CANCELLED; null while any subscription is non-CANCELLED"
      - name: won_back_at
        type: datetime
        source: computed
        description: "Logical clock at the Subscription create call that carried a winback_target_id; null otherwise"
      - name: tenure_days
        type: integer
        source: computed
        description: "floor((clock_now - first_subscribed_at) / 1 day); 0 when first_subscribed_at is null"
      - name: tenure_bucket
        type: enum
        source: computed
        description: "Bucket of floor(tenure_days / 30) months: 0-1 => M0_1, 2-3 => M2_3, 4-6 => M4_6, 7-12 => M7_12, else M13_PLUS"
        constraints: "tenure_bucket IN {M0_1, M2_3, M4_6, M7_12, M13_PLUS}"
      - name: churn_type
        type: enum
        source: computed
        description: "Churn classification: VOLUNTARY when the terminal cancel came from a CancellationSession completion, INVOLUNTARY when it came from an Invoice write-off"
        default: NONE
        constraints: "churn_type IN {NONE, VOLUNTARY, INVOLUNTARY}"
      - name: realized_ltv_cents
        type: integer
        source: computed
        description: "Realized lifetime value; see calculations.subscriber_lifetime_value variant REALIZED"
      - name: projected_ltv_cents
        type: integer
        source: computed
        description: "Projected lifetime value; see calculations.subscriber_lifetime_value variant PROJECTED"
      - name: save_offer_grants_365d_count
        type: integer
        source: computed
        description: "Count of SaveOfferGrant rows whose subscription_id belongs to this subscriber, state IN {PRESENTED, ACCEPTED}, created_at >= clock_now - 365 days"
      - name: winback_suppressed_until
        type: datetime
        source: computed
        description: "Instant before which win-back targeting is rejected; set to lapsed_at + INVOLUNTARY_SUPPRESSION_DAYS on involuntary churn and to accepted_at + VOLUNTARY_SAVE_SUPPRESSION_DAYS when a save offer is accepted; null when unset"
      - name: last_contacted_at
        type: datetime
        source: computed
        description: "sent_at of the most recent WinBackTarget for this subscriber with state IN {SENT, EXPIRED, CONVERTED}, ordered by sent_at DESC, created_at DESC; null when never contacted"
      - name: cohort_month
        type: string
        source: computed
        description: "first_subscribed_at formatted YYYY-MM in UTC; null until first subscription"
    note: "Every computed field on Subscriber is derived at read time against the logical clock, so GET /subscribers/{id} always reflects the current tenure bucket, the current LTV pair and the current trailing-window counts without requiring an intervening write."

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id"
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; mutated by an APPLIED PLAN_DOWNGRADE modification"
      - name: payment_method_id
        type: string
        source: input
        description: "FK -> PaymentMethod.id; repointed when the subscriber adds a newer payment method"
      - name: lifecycle_state
        type: enum
        source: system
        description: "Access/fulfilment axis of the parallel state machine"
        default: ACTIVE
        constraints: "lifecycle_state IN {ACTIVE, PAUSED, PENDING_CANCEL, CANCELLED}"
      - name: billing_state
        type: enum
        source: system
        description: "Collections axis of the parallel state machine; evolves independently of lifecycle_state"
        default: CURRENT
        constraints: "billing_state IN {CURRENT, PAST_DUE, GRACE, DELINQUENT}"
      - name: frequency_weeks
        type: integer
        source: input
        description: "Weeks between shipment cycles; cycle_days = frequency_weeks * 7"
        constraints: "must be a member of Plan.allowed_frequency_weeks"
      - name: addons
        type: array
        source: input
        description: "Array of { code, qty, unit_price_cents, unit_cogs_cents } snapshotted from Plan.addon_catalog at attach time"
        default: []
      - name: active_discount_pct
        type: number
        source: computed
        description: "Fraction discounted from every line item while discount_remaining_cycles > 0"
        default: 0.0000
        constraints: "0.0000 <= value < 1.0000, 4 decimal places"
      - name: discount_remaining_cycles
        type: integer
        source: computed
        description: "Cycles for which active_discount_pct still applies; decremented by each renewal that issues an invoice"
        default: 0
      - name: baseline_price_cents
        type: computed
        source: computed
        description: "committed_price_cents as of subscription creation; the anchor of the price-conservation invariant"
      - name: committed_price_cents
        type: integer
        source: computed
        description: "Full-cycle billable amount; see calculations.committed_price_cents"
      - name: next_renewal_at
        type: datetime
        source: computed
        description: "Instant the next renewal run may issue an invoice; created_at + cycle_days at creation, then advanced by cycle_days per renewal run"
      - name: next_ship_at
        type: datetime
        source: computed
        description: "Instant of the next shipment; equals next_renewal_at unless the cycle is skipped, in which case it advances by one further cycle_days"
      - name: paused_until
        type: datetime
        source: computed
        description: "End of the active pause window (half-open: the subscription is paused on [pause_start_at, paused_until)); null when not paused"
      - name: pause_cycles_used
        type: integer
        source: computed
        description: "Sum of pause cycles across SubscriptionModification rows with mod_type PAUSE and state IN {APPLIED, REVERSED}"
        default: 0
      - name: term_shipments_delivered
        type: integer
        source: computed
        description: "Shipment units consumed by renewals that issued an invoice"
        default: 0
      - name: term_shipments_skipped
        type: integer
        source: computed
        description: "Shipment units consumed by APPLIED SKIP_SHIPMENT modifications"
        default: 0
      - name: term_shipments_remaining
        type: integer
        source: computed
        description: "Plan.shipments_per_term - term_shipments_delivered - term_shipments_skipped; conserved quantity"
      - name: cancel_effective_at
        type: datetime
        source: computed
        description: "Instant access ends; next_renewal_at on voluntary completion, clock_now on involuntary write-off; null otherwise"
      - name: first_failed_at
        type: datetime
        source: computed
        description: "attempted_at of the earliest DunningAttempt with outcome IN {SOFT_DECLINE, HARD_DECLINE} on the currently unpaid invoice; cleared when that invoice reaches PAID"
      - name: grace_end_at
        type: datetime
        source: computed
        description: "End of the collections grace window; recomputed on every dunning-attempt creation per calculations.dunning_retry_schedule steps 1-3"
      - name: consecutive_failed_attempts
        type: integer
        source: computed
        description: "Count of DunningAttempt rows with outcome IN {SOFT_DECLINE, HARD_DECLINE} on the currently unpaid invoice; reset to 0 when an invoice reaches PAID"
        default: 0
      - name: disclosure_acknowledged
        type: boolean
        source: input
        description: "Subscriber acknowledgement of the negative-option disclosure at signup"

  - name: PaymentMethod
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id"
      - name: card_last4
        type: string
        source: input
        description: "Last four digits of the card"
        constraints: "exactly 4 digits"
      - name: exp_month
        type: integer
        source: input
        description: "Card expiry month"
        constraints: "1 <= exp_month <= 12"
      - name: exp_year
        type: integer
        source: input
        description: "Card expiry year"
        constraints: ">= 2020"
      - name: network
        type: enum
        source: input
        description: "Card network"
        constraints: "network IN {VISA, MASTERCARD, AMEX, DISCOVER}"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while chargeable; REPLACED when the subscriber added a newer method; EXPIRED when the card updater reported UNAVAILABLE"
        default: ACTIVE
        constraints: "status IN {ACTIVE, REPLACED, EXPIRED}"
      - name: updater_status
        type: enum
        source: system
        description: "Card-updater service state; PENDING is set by an EXPIRED_CARD decline and extends the grace window"
        default: NONE
        constraints: "updater_status IN {NONE, PENDING, UPDATED, UNAVAILABLE}"
      - name: updater_requested_at
        type: datetime
        source: computed
        description: "Logical clock at the transition of updater_status to PENDING; null while NONE"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id"
      - name: payment_method_id
        type: string
        source: input
        description: "FK -> PaymentMethod.id; snapshotted from the subscription at invoice creation"
      - name: cycle_index
        type: integer
        source: computed
        description: "0 for the signup invoice, incremented by one per renewal-issued invoice on the same subscription"
      - name: amount_cents
        type: integer
        source: computed
        description: "Billable total; see calculations.invoice_amount_cents"
      - name: cogs_cents
        type: integer
        source: computed
        description: "Cost of goods for this invoice; see calculations.invoice_amount_cents"
      - name: line_items
        type: array
        source: computed
        description: "Array of { kind, code, unit_price_cents, qty, line_cents } in pinned order: PLAN line first, then addon lines by code ascending"
      - name: status
        type: enum
        source: system
        description: "Collections status of the invoice"
        default: OPEN
        constraints: "status IN {OPEN, FAILED, PAID, WRITTEN_OFF}"
      - name: due_at
        type: datetime
        source: computed
        description: "Logical clock at invoice creation"
      - name: paid_at
        type: datetime
        source: computed
        description: "attempted_at of the SUCCEEDED DunningAttempt; null while unpaid"
      - name: attempt_count
        type: integer
        source: computed
        description: "Count of DunningAttempt rows with invoice_id == this.id"
        default: 0
      - name: proration_factor
        type: number
        source: computed
        description: "Multiplier applied to every line item; 1.0000 unless the invoice was re-priced mid-cycle by a plan change"
        default: 1.0000
      - name: is_renewal
        type: boolean
        source: computed
        description: "False for cycle_index 0, true for renewal-issued invoices"

  - name: DunningAttempt
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id"
      - name: previous_attempt_id
        type: string
        source: computed
        description: "FK -> DunningAttempt.id; the immediately preceding attempt on the same invoice ordered by created_at ASC; null on the first attempt"
      - name: attempt_number
        type: integer
        source: computed
        description: "Invoice.attempt_count + 1 as observed at creation; 1 is the initial charge"
      - name: scheduled_at
        type: datetime
        source: computed
        description: "Instant this attempt is due; see calculations.dunning_retry_schedule"
      - name: attempted_at
        type: datetime
        source: computed
        description: "Logical clock at the settlement call; null while outcome is PENDING"
      - name: outcome
        type: enum
        source: system
        description: "Gateway result"
        default: PENDING
        constraints: "outcome IN {PENDING, SUCCEEDED, SOFT_DECLINE, HARD_DECLINE}"
      - name: decline_code
        type: enum
        source: system
        description: "Gateway decline reason; null unless outcome IN {SOFT_DECLINE, HARD_DECLINE}"
        constraints: "decline_code IN {INSUFFICIENT_FUNDS, EXPIRED_CARD, DO_NOT_HONOR, LOST_STOLEN}"
      - name: backoff_days_applied
        type: integer
        source: computed
        description: "Backoff days used at step 4 of calculations.dunning_retry_schedule; 0 on the first attempt"
      - name: grace_clamped
        type: boolean
        source: computed
        description: "True when step 5 replaced the raw schedule with grace_end_at because the raw instant fell strictly after it"
      - name: is_final
        type: boolean
        source: computed
        description: "True when grace_clamped is true; a SOFT_DECLINE on a final attempt writes the invoice off"

  - name: CancellationSession
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id"
      - name: state
        type: enum
        source: system
        description: "Cancellation flow state"
        default: STARTED
        constraints: "state IN {STARTED, REASON_CAPTURED, OFFERS_PRESENTED, OFFER_ACCEPTED, COMPLETED_CANCELLED, ABANDONED}"
      - name: reason_code
        type: enum
        source: input
        description: "Captured cancellation reason; null until captured; overwritten by a revision"
        constraints: "reason_code IN {PRICE, PRODUCT_FIT, TOO_MUCH_PRODUCT, SHIPPING_ISSUES, FINANCIAL_HARDSHIP, OTHER}"
      - name: reason_detail
        type: string
        source: input
        description: "Free-text elaboration; null when omitted"
      - name: step_count
        type: integer
        source: computed
        description: "Number of state-advancing calls recorded on this session, starting at 1 for the create call; the simple-cancellation budget is checked against it"
        default: 1
      - name: offers_presented_count
        type: integer
        source: computed
        description: "Number of offer-presentation rounds executed on this session"
        default: 0
      - name: entry_channel
        type: enum
        source: input
        description: "Surface the subscriber cancelled from"
        constraints: "entry_channel IN {WEB_SELF_SERVE, APP_SELF_SERVE, AGENT_ASSISTED}"
      - name: started_at
        type: datetime
        source: computed
        description: "Logical clock at session creation"
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock at the transition into COMPLETED_CANCELLED, OFFER_ACCEPTED or ABANDONED; null while non-terminal"
      - name: presented_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the RetentionSpecialist that executed the offer-presentation round; null before presentation"

  - name: SaveOfferTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique template code"
        constraints: "unique across SaveOfferTemplate"
      - name: name
        type: string
        source: input
        description: "Human-readable offer name"
      - name: offer_type
        type: enum
        source: input
        description: "Save lever this template pulls"
        constraints: "offer_type IN {PAUSE, SKIP, DISCOUNT, PLAN_DOWNGRADE}"
      - name: discount_pct
        type: number
        source: input
        description: "Discount fraction applied for discount_cycles cycles; 0.0000 for non-DISCOUNT types"
        default: 0.0000
        constraints: "0.0000 <= value < 1.0000, 4 decimal places"
      - name: discount_cycles
        type: integer
        source: input
        description: "Cycles the discount applies for; 0 for non-DISCOUNT types"
        default: 0
      - name: pause_cycles
        type: integer
        source: input
        description: "Cycles paused for PAUSE offers; 0 otherwise"
        default: 0
      - name: skip_count
        type: integer
        source: input
        description: "Shipment units skipped for SKIP offers; 0 otherwise"
        default: 0
      - name: min_tenure_days
        type: integer
        source: input
        description: "Minimum Subscriber.tenure_days for eligibility; boundary is inclusive (>=)"
        default: 0
      - name: eligible_reason_codes
        type: array
        source: input
        description: "CancellationSession.reason_code values this template may be presented for; empty array means no reason matches"
        default: []
      - name: max_per_subscriber_per_365d
        type: integer
        source: input
        description: "Cap on grants of this template per subscriber within the trailing 365 days"
        default: 1
      - name: priority_rank
        type: integer
        source: input
        description: "Primary ranking key of the offer selector; lower rank is presented first"
        constraints: ">= 1"
      - name: expires_after_hours
        type: integer
        source: input
        description: "Hours a presented grant stays acceptable"
        default: 48
      - name: status
        type: enum
        source: input
        description: "Template availability; only ACTIVE templates enter the candidate set"
        default: ACTIVE
        constraints: "status IN {ACTIVE, RETIRED}"

  - name: SaveOfferGrant
    parent: null
    common_fields: true
    fields:
      - name: cancellation_session_id
        type: string
        source: input
        description: "FK -> CancellationSession.id"
      - name: save_offer_template_id
        type: string
        source: computed
        description: "FK -> SaveOfferTemplate.id; chosen by calculations.save_offer_selection"
      - name: subscription_id
        type: string
        source: computed
        description: "FK -> Subscription.id; copied from the session"
      - name: state
        type: enum
        source: system
        description: "Grant lifecycle"
        default: PRESENTED
        constraints: "state IN {PRESENTED, ACCEPTED, DECLINED, EXPIRED, REVOKED}"
      - name: per_cycle_margin_pct
        type: number
        source: computed
        description: "Display margin of the first offer cycle; see calculations.save_offer_margin_pct variant PER_CYCLE"
      - name: blended_term_margin_pct
        type: number
        source: computed
        description: "Guardrail margin over the whole offer horizon; see calculations.save_offer_margin_pct variant BLENDED_TERM"
      - name: margin_exception_required
        type: boolean
        source: computed
        description: "True when blended_term_margin_pct < Plan.margin_floor_pct of the subscription's current plan"
      - name: margin_exception_state
        type: enum
        source: system
        description: "Second axis of the grant: guardrail-exception workflow"
        default: NOT_REQUIRED
        constraints: "margin_exception_state IN {NOT_REQUIRED, PENDING, APPROVED, REJECTED}"
      - name: presented_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the presenting RetentionSpecialist; the segregation-of-duties comparand"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer that decided the margin exception; null while undecided"
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + SaveOfferTemplate.expires_after_hours hours"
      - name: accepted_at
        type: datetime
        source: computed
        description: "Logical clock at acceptance; null unless state is ACCEPTED"
      - name: retention_value_cents
        type: integer
        source: computed
        description: "Contribution margin retained over the offer horizon; total_term_revenue_cents - total_term_cogs_cents from calculations.save_offer_margin_pct"

  - name: SubscriptionModification
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id"
      - name: save_offer_grant_id
        type: string
        source: computed
        description: "FK -> SaveOfferGrant.id; set when the modification was created by accepting a grant, null when subscriber-initiated"
      - name: reverses_modification_id
        type: string
        source: computed
        description: "FK -> SubscriptionModification.id; set on a compensating row, null otherwise"
      - name: target_plan_id
        type: string
        source: input
        description: "FK -> Plan.id; required for mod_type PLAN_DOWNGRADE, null otherwise"
      - name: mod_type
        type: enum
        source: input
        description: "Kind of change"
        constraints: "mod_type IN {FREQUENCY_CHANGE, ADDON_ADD, ADDON_REMOVE, SKIP_SHIPMENT, PLAN_DOWNGRADE, PAUSE, RESUME, DISCOUNT_APPLY}"
      - name: state
        type: enum
        source: system
        description: "REQUESTED is transient; the create call settles it into APPLIED or SCHEDULED"
        default: REQUESTED
        constraints: "state IN {REQUESTED, SCHEDULED, APPLIED, REVERSED, CANCELLED}"
      - name: frequency_weeks
        type: integer
        source: input
        description: "New cadence for mod_type FREQUENCY_CHANGE; null otherwise"
      - name: addon_code
        type: string
        source: input
        description: "Addon code for mod_type IN {ADDON_ADD, ADDON_REMOVE}; null otherwise"
      - name: addon_qty
        type: integer
        source: input
        description: "Addon quantity for mod_type ADDON_ADD; null otherwise"
        constraints: ">= 1 when present"
      - name: skip_ship_at
        type: datetime
        source: input
        description: "Cycle instant being skipped for mod_type SKIP_SHIPMENT; null otherwise"
      - name: pause_start_at
        type: datetime
        source: input
        description: "Inclusive start of the pause window for mod_type PAUSE; null otherwise"
      - name: pause_end_at
        type: datetime
        source: input
        description: "Exclusive end of the pause window for mod_type PAUSE; null otherwise"
      - name: effective_at
        type: datetime
        source: input
        description: "Instant the change takes effect; defaults to the logical clock, producing APPLIED; a future value produces SCHEDULED"
      - name: delta_price_cents
        type: integer
        source: computed
        description: "Subscription.committed_price_cents after this row was applied minus its value before; 0 for rows that do not move price and 0 while the row is SCHEDULED or CANCELLED"
      - name: prior_snapshot
        type: object
        source: computed
        description: "{ plan_id, frequency_weeks, addons, active_discount_pct, discount_remaining_cycles, committed_price_cents, term_shipments_skipped } captured immediately before application; the reversal restores exactly these values"
      - name: applied_at
        type: datetime
        source: computed
        description: "Logical clock at the transition into APPLIED; null while SCHEDULED or CANCELLED"

  - name: ComplianceNotice
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id"
      - name: notice_type
        type: enum
        source: input
        description: "Regulated notice kind"
        constraints: "notice_type IN {NEGATIVE_OPTION_DISCLOSURE, RENEWAL_REMINDER, PRICE_CHANGE, CANCELLATION_CONFIRMATION}"
      - name: state
        type: enum
        source: system
        description: "SCHEDULED until sent; MISSED when a renewal ran while the notice was still SCHEDULED"
        default: SCHEDULED
        constraints: "state IN {SCHEDULED, SENT, MISSED}"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Instant the notice is due; auto-set for system-created notices"
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical clock at the send call; null while SCHEDULED or MISSED"
      - name: channel
        type: enum
        source: input
        description: "Delivery channel"
        default: EMAIL
        constraints: "channel IN {EMAIL, SMS}"
      - name: renewal_cycle_index
        type: integer
        source: computed
        description: "Subscription.cycle counter this notice belongs to: Invoice.cycle_index of the upcoming renewal at creation time"
      - name: body_ref
        type: string
        source: input
        description: "Reference to the notice body template; null when omitted"

  - name: WinBackCampaign
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique campaign code"
        constraints: "unique across WinBackCampaign"
      - name: name
        type: string
        source: input
        description: "Campaign name"
      - name: target_channels
        type: array
        source: input
        description: "Subscriber.acquisition_channel values in scope; empty array means every channel is in scope"
        default: []
      - name: target_reason_codes
        type: array
        source: input
        description: "Latest-CancellationSession reason codes in scope; empty array means every reason is in scope"
        default: []
      - name: min_days_since_lapse
        type: integer
        source: input
        description: "Inclusive lower bound on days since Subscriber.lapsed_at"
        constraints: ">= 0"
      - name: max_days_since_lapse
        type: integer
        source: input
        description: "Inclusive upper bound on days since Subscriber.lapsed_at; also the recency normalizer of the priority score"
        constraints: ">= min_days_since_lapse"
      - name: offer_discount_pct
        type: number
        source: input
        description: "Discount advertised by the campaign"
        constraints: "0.0000 <= value < 1.0000, 4 decimal places"
      - name: send_window_days
        type: integer
        source: input
        description: "Days a sent target stays live before it may be expired"
        default: 14
      - name: suppression_days
        type: integer
        source: input
        description: "Days after a send during which the same subscriber may not be re-targeted by this campaign"
        default: 60
      - name: state
        type: enum
        source: system
        description: "Campaign lifecycle"
        default: DRAFT
        constraints: "state IN {DRAFT, LAUNCHED, CLOSED}"
      - name: targeted_count
        type: integer
        source: computed
        description: "Count of WinBackTarget rows with winback_campaign_id == this.id"
        default: 0
      - name: sent_count
        type: integer
        source: computed
        description: "Count of this campaign's targets with state IN {SENT, EXPIRED, CONVERTED}"
        default: 0
      - name: converted_count
        type: integer
        source: computed
        description: "Count of this campaign's targets with state CONVERTED"
        default: 0

  - name: WinBackTarget
    parent: null
    common_fields: true
    fields:
      - name: winback_campaign_id
        type: string
        source: input
        description: "FK -> WinBackCampaign.id"
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id"
      - name: state
        type: enum
        source: system
        description: "Targeting lifecycle; cyclic through ELIGIBLE -> SENT -> EXPIRED -> ELIGIBLE"
        default: ELIGIBLE
        constraints: "state IN {ELIGIBLE, SUPPRESSED, SENT, EXPIRED, CONVERTED}"
      - name: suppression_reason
        type: enum
        source: computed
        description: "Why the target is not contactable; NONE while contactable"
        default: NONE
        constraints: "suppression_reason IN {NONE, RECENT_SAVE_OFFER, ACTIVE_SUBSCRIPTION, DO_NOT_CONTACT, INVOLUNTARY_UNRESOLVED, CONTACT_CAP}"
      - name: priority_score
        type: number
        source: computed
        description: "See calculations.winback_priority_score"
      - name: projected_ltv_cents
        type: integer
        source: computed
        description: "Subscriber.projected_ltv_cents snapshotted at targeting"
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical clock at the send call; null while never sent"
      - name: expires_at
        type: datetime
        source: computed
        description: "sent_at + WinBackCampaign.send_window_days days; null while never sent"
      - name: converted_at
        type: datetime
        source: computed
        description: "Logical clock at the Subscription create call that cited this target; null otherwise"
      - name: days_since_lapse_at_target
        type: integer
        source: computed
        description: "floor((clock_now - Subscriber.lapsed_at) / 1 day) at target creation"

  - name: RetentionCohortSnapshot
    parent: null
    common_fields: false
    fields:
      - name: cohort_month
        type: string
        source: input
        description: "Acquisition month in YYYY-MM UTC; membership window is half-open [month_start, next_month_start)"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: acquisition_channel
        type: enum
        source: input
        description: "Optional channel filter; null means every channel"
        constraints: "acquisition_channel IN {PAID_SOCIAL, SEARCH, AFFILIATE, ORGANIC, REFERRAL} when present"
      - name: plan_code
        type: string
        source: input
        description: "Optional filter on the Plan.code of each member's FIRST subscription; null means every plan"
      - name: tenure_bucket
        type: enum
        source: input
        description: "Optional filter on Subscriber.tenure_bucket at snapshot time; null means every bucket"
        constraints: "tenure_bucket IN {M0_1, M2_3, M4_6, M7_12, M13_PLUS} when present"
      - name: ltv_variant
        type: enum
        source: input
        description: "Which lifetime-value variant mean_ltv_cents averages"
        constraints: "ltv_variant IN {REALIZED, PROJECTED}"
      - name: member_count
        type: integer
        source: computed
        description: "Cohort members after all filters"
      - name: retained_count
        type: integer
        source: computed
        description: "Members holding at least one Subscription with lifecycle_state IN {ACTIVE, PAUSED, PENDING_CANCEL}"
      - name: churned_voluntary_count
        type: integer
        source: computed
        description: "Members with churn_type VOLUNTARY"
      - name: churned_involuntary_count
        type: integer
        source: computed
        description: "Members with churn_type INVOLUNTARY"
      - name: retention_rate
        type: number
        source: computed
        description: "retained_count / member_count rounded to 4 decimals ROUND_HALF_UP; 0.0000 when member_count is 0"
      - name: mean_ltv_cents
        type: integer
        source: computed
        description: "Mean of the selected LTV variant across members, ROUND_HALF_UP to whole cents; 0 when member_count is 0"
      - name: computed_at
        type: datetime
        source: computed
        description: "Logical clock at snapshot creation"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Subscription: parallel dimensions (lifecycle_state x billing_state) ----
  - entity: Subscription
    initial_state: ACTIVE          # lifecycle_state axis; billing_state starts CURRENT
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/modifications with mod_type PAUSE and effective_at <= clock_now"
        actor: Subscriber
        preconditions:
          - "lifecycle_state == ACTIVE"
          - "pause window [pause_start_at, pause_end_at) does not overlap any window of a SubscriptionModification with mod_type PAUSE and state IN {APPLIED, SCHEDULED}"
          - "ceil((pause_end_at - pause_start_at) / (frequency_weeks * 7 days)) <= Plan.max_pause_cycles"
        side_effects:
          - "sets paused_until = pause_end_at"
          - "advances next_renewal_at to pause_end_at"
          - "increments pause_cycles_used by ceil((pause_end_at - pause_start_at) / cycle_days)"
          - "creates SubscriptionModification(mod_type PAUSE, state APPLIED, delta_price_cents 0)"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/modifications with mod_type RESUME, or POST /subscriptions/{id}/renewals when clock_now >= paused_until"
        actor: Subscriber | BillingOperator
        preconditions:
          - "lifecycle_state == PAUSED"
        side_effects:
          - "clears paused_until to null"
          - "sets next_renewal_at = clock_now when resumed by RESUME modification"
          - "creates SubscriptionModification(mod_type RESUME, state APPLIED) when triggered by the modification endpoint"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PENDING_CANCEL
        trigger: "POST /cancellation-sessions/{id}/complete"
        actor: Subscriber
        preconditions:
          - "lifecycle_state IN {ACTIVE, PAUSED}"
          - "CancellationSession.state IN {REASON_CAPTURED, OFFERS_PRESENTED}"
        side_effects:
          - "sets cancel_effective_at = next_renewal_at"
          - "every SaveOfferGrant on the session with state PRESENTED becomes EXPIRED, which recomputes Subscriber.save_offer_grants_365d_count"
          - "creates ComplianceNotice(notice_type CANCELLATION_CONFIRMATION, state SENT, sent_at clock_now)"
          - "increments Subscription.version by 1"
        note: "Access continues through the paid term; the CANCELLED transition is executed by the renewal run."
      - from: PAUSED
        to: PENDING_CANCEL
        trigger: "POST /cancellation-sessions/{id}/complete"
        actor: Subscriber
        preconditions:
          - "lifecycle_state == PAUSED"
        side_effects:
          - "sets cancel_effective_at = next_renewal_at"
          - "creates ComplianceNotice(notice_type CANCELLATION_CONFIRMATION, state SENT)"
          - "increments Subscription.version by 1"
      - from: PENDING_CANCEL
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/renewals when clock_now >= cancel_effective_at"
        actor: BillingOperator
        preconditions:
          - "lifecycle_state == PENDING_CANCEL"
          - "clock_now >= cancel_effective_at"
        side_effects:
          - "issues no invoice for this cycle"
          - "sets Subscriber.churn_type = VOLUNTARY and Subscriber.lapsed_at = clock_now (hop 2)"
          - "recomputes Subscriber.projected_ltv_cents with expected_remaining_cycles = 0, so it equals realized_ltv_cents (hop 3)"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: Invoice reaches WRITTEN_OFF during POST /_payments/simulate"
        actor: system
        preconditions:
          - "lifecycle_state IN {ACTIVE, PAUSED}"
          - "an Invoice on this subscription transitioned to WRITTEN_OFF"
        side_effects:
          - "sets billing_state = DELINQUENT and cancel_effective_at = clock_now"
          - "sets Subscriber.churn_type = INVOLUNTARY, Subscriber.lapsed_at = clock_now, Subscriber.winback_suppressed_until = clock_now + INVOLUNTARY_SUPPRESSION_DAYS (hop 3)"
          - "recomputes Subscriber.projected_ltv_cents with expected_remaining_cycles = 0, so it equals realized_ltv_cents (hop 4)"
          - "every non-terminal CancellationSession on this subscription becomes ABANDONED (hop 5)"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "system: Invoice reaches WRITTEN_OFF during POST /_payments/simulate"
        actor: system
        preconditions:
          - "lifecycle_state == PAUSED"
        side_effects:
          - "identical to the ACTIVE -> CANCELLED involuntary cascade"
          - "increments Subscription.version by 1"
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /_payments/simulate with outcome SOFT_DECLINE on a non-final attempt"
        actor: BillingOperator
        preconditions:
          - "billing_state == CURRENT"
          - "the settled DunningAttempt belongs to an Invoice on this subscription"
        side_effects:
          - "sets first_failed_at = clock_now and consecutive_failed_attempts = 1"
          - "sets grace_end_at per calculations.dunning_retry_schedule steps 1-3"
          - "when decline_code == EXPIRED_CARD, sets the invoice's PaymentMethod.updater_status = PENDING and updater_requested_at = clock_now"
          - "increments Subscription.version by 1"
        note: "Billing axis only; lifecycle_state is untouched, so a PAUSED subscription can be PAUSED x PAST_DUE."
      - from: PAST_DUE
        to: GRACE
        trigger: "POST /invoices/{id}/dunning-attempts when the invoice's PaymentMethod.updater_status == PENDING at scheduling time"
        actor: BillingOperator
        preconditions:
          - "billing_state == PAST_DUE"
          - "PaymentMethod.updater_status == PENDING"
        side_effects:
          - "extends grace_end_at by CARD_UPDATER_EXTENSION_DAYS via step 2 of calculations.dunning_retry_schedule"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /_payments/simulate with outcome SUCCEEDED"
        actor: BillingOperator
        preconditions:
          - "billing_state IN {PAST_DUE, GRACE}"
        side_effects:
          - "clears first_failed_at and grace_end_at to null, resets consecutive_failed_attempts to 0"
          - "sets the Invoice to PAID with paid_at = clock_now"
          - "increments Subscription.version by 1"
      - from: GRACE
        to: CURRENT
        trigger: "POST /_payments/simulate with outcome SUCCEEDED"
        actor: BillingOperator
        preconditions:
          - "billing_state == GRACE"
        side_effects:
          - "identical to PAST_DUE -> CURRENT"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /_payments/simulate with outcome HARD_DECLINE, or SOFT_DECLINE on an attempt whose is_final is true"
        actor: BillingOperator
        preconditions:
          - "billing_state IN {PAST_DUE, GRACE}"
        side_effects:
          - "sets the Invoice to WRITTEN_OFF (hop 1), which drives the lifecycle axis to CANCELLED (hop 2)"
          - "increments Subscription.version by 1"
      - from: GRACE
        to: DELINQUENT
        trigger: "POST /_payments/simulate with outcome HARD_DECLINE, or SOFT_DECLINE on an attempt whose is_final is true"
        actor: BillingOperator
        preconditions:
          - "billing_state == GRACE"
        side_effects:
          - "identical to PAST_DUE -> DELINQUENT"
          - "increments Subscription.version by 1"

  # ---- CancellationSession: branching fork with divergent side-effect sets ----
  - entity: CancellationSession
    initial_state: STARTED
    terminal_states: [OFFER_ACCEPTED, COMPLETED_CANCELLED, ABANDONED]
    transitions:
      - from: STARTED
        to: REASON_CAPTURED
        trigger: "POST /cancellation-sessions/{id}/reason"
        actor: Subscriber
        preconditions:
          - "state IN {STARTED, REASON_CAPTURED}"
          - "step_count + 1 <= MAX_CANCELLATION_STEPS - 1"
        side_effects:
          - "sets reason_code and reason_detail"
          - "increments step_count by 1"
      - from: REASON_CAPTURED
        to: REASON_CAPTURED
        trigger: "POST /cancellation-sessions/{id}/reason (reason revision)"
        actor: Subscriber
        preconditions:
          - "state == REASON_CAPTURED"
          - "step_count + 1 <= MAX_CANCELLATION_STEPS - 1"
        side_effects:
          - "overwrites reason_code and reason_detail"
          - "increments step_count by 1"
        note: "A revision consumes one of the three pre-completion steps, so it can starve a later offer round."
      - from: REASON_CAPTURED
        to: OFFERS_PRESENTED
        trigger: "POST /cancellation-sessions/{id}/present-offers"
        actor: RetentionSpecialist
        preconditions:
          - "state == REASON_CAPTURED"
          - "offers_presented_count == 0"
          - "step_count + 1 <= MAX_CANCELLATION_STEPS - 1"
          - "calculations.save_offer_selection yields a non-empty candidate set"
        side_effects:
          - "creates exactly one SaveOfferGrant in state PRESENTED for the selected template"
          - "sets presented_by_user_id = X-User-ID and offers_presented_count = 1, increments step_count by 1"
          - "recomputes Subscriber.save_offer_grants_365d_count"
      - from: REASON_CAPTURED
        to: COMPLETED_CANCELLED
        trigger: "POST /cancellation-sessions/{id}/complete"
        actor: Subscriber
        preconditions:
          - "state IN {REASON_CAPTURED, OFFERS_PRESENTED}"
        side_effects:
          - "sets completed_at = clock_now and increments step_count by 1"
          - "drives Subscription lifecycle_state to PENDING_CANCEL"
          - "creates ComplianceNotice(CANCELLATION_CONFIRMATION, SENT)"
        note: "Completion is exempt from the step budget: the simple-cancellation guarantee is that a subscriber can always finish."
      - from: OFFERS_PRESENTED
        to: COMPLETED_CANCELLED
        trigger: "POST /cancellation-sessions/{id}/complete"
        actor: Subscriber
        preconditions:
          - "state == OFFERS_PRESENTED"
        side_effects:
          - "every SaveOfferGrant on this session with state PRESENTED becomes EXPIRED"
          - "drives Subscription lifecycle_state to PENDING_CANCEL"
          - "creates ComplianceNotice(CANCELLATION_CONFIRMATION, SENT)"
      - from: OFFERS_PRESENTED
        to: OFFER_ACCEPTED
        trigger: "POST /save-offer-grants/{id}/accept"
        actor: Subscriber
        preconditions:
          - "state == OFFERS_PRESENTED"
          - "the accepted grant's cancellation_session_id == this.id"
        side_effects:
          - "sets completed_at = clock_now and increments step_count by 1"
          - "leaves Subscription lifecycle_state unchanged (the save succeeded)"
      - from: STARTED
        to: ABANDONED
        trigger: "POST /subscriptions/{id}/renewals when clock_now - started_at > SESSION_TTL_HOURS"
        actor: BillingOperator
        preconditions:
          - "state IN {STARTED, REASON_CAPTURED, OFFERS_PRESENTED}"
          - "clock_now - started_at > SESSION_TTL_HOURS"
        side_effects:
          - "sets completed_at = clock_now"
          - "every SaveOfferGrant on this session with state PRESENTED becomes EXPIRED"
      - from: REASON_CAPTURED
        to: ABANDONED
        trigger: "POST /subscriptions/{id}/renewals when clock_now - started_at > SESSION_TTL_HOURS, or system when the subscription reaches CANCELLED"
        actor: BillingOperator | system
        preconditions:
          - "state IN {STARTED, REASON_CAPTURED, OFFERS_PRESENTED}"
        side_effects:
          - "sets completed_at = clock_now"
          - "preserves reason_code so win-back scoring can still read it"

  # ---- SaveOfferGrant: branching plus the exception axis ----
  - entity: SaveOfferGrant
    initial_state: PRESENTED
    terminal_states: [DECLINED, EXPIRED, REVOKED]
    transitions:
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /save-offer-grants/{id}/accept"
        actor: Subscriber
        preconditions:
          - "state == PRESENTED"
          - "clock_now < expires_at"
          - "Subscription.billing_state == CURRENT when offer_type IN {DISCOUNT, PLAN_DOWNGRADE}"
          - "margin_exception_required == false OR margin_exception_state == APPROVED"
        side_effects:
          - "sets accepted_at = clock_now"
          - "creates a SubscriptionModification of the offer's lever in state APPLIED, mutating the Subscription (hop 1)"
          - "sets Subscriber.winback_suppressed_until = clock_now + VOLUNTARY_SAVE_SUPPRESSION_DAYS"
          - "drives CancellationSession to OFFER_ACCEPTED"
          - "increments Subscription.version by 1"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /save-offer-grants/{id}/decline"
        actor: Subscriber
        preconditions:
          - "state == PRESENTED"
        side_effects:
          - "recomputes Subscriber.save_offer_grants_365d_count (a DECLINED grant leaves the trailing window)"
          - "leaves CancellationSession in OFFERS_PRESENTED so the subscriber can still complete"
        note: "Divergent branch: unlike ACCEPTED, no SubscriptionModification is created and no suppression window is set."
      - from: PRESENTED
        to: EXPIRED
        trigger: "system: POST /cancellation-sessions/{id}/complete, or session ABANDONED by the renewal run"
        actor: system
        preconditions:
          - "state == PRESENTED"
        side_effects:
          - "recomputes Subscriber.save_offer_grants_365d_count"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /subscription-modifications/{id}/reverse on the modification this grant created"
        actor: RetentionSpecialist
        preconditions:
          - "state == ACCEPTED"
          - "the reversed SubscriptionModification.save_offer_grant_id == this.id"
        side_effects:
          - "clears Subscriber.winback_suppressed_until to null when it was set by this grant"
          - "recomputes Subscriber.save_offer_grants_365d_count, restoring the pre-grant count"
          - "restores Subscription.active_discount_pct and discount_remaining_cycles from prior_snapshot"
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "system: grant creation with blended_term_margin_pct < Plan.margin_floor_pct"
        actor: system
        preconditions:
          - "margin_exception_required == true"
        side_effects:
          - "sets margin_exception_state = PENDING at creation time (exception axis)"
      - from: PENDING
        to: APPROVED
        trigger: "POST /save-offer-grants/{id}/margin-exception with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "margin_exception_state == PENDING"
          - "X-User-ID != presented_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
      - from: PENDING
        to: REJECTED
        trigger: "POST /save-offer-grants/{id}/margin-exception with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "margin_exception_state == PENDING"
          - "X-User-ID != presented_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID; acceptance now fails with ERR_MARGIN_FLOOR_BREACH"

  # ---- Invoice ----
  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /_payments/simulate with outcome SUCCEEDED"
        actor: BillingOperator
        preconditions:
          - "status IN {OPEN, FAILED}"
          - "a DunningAttempt with outcome PENDING exists on this invoice"
        side_effects:
          - "sets paid_at = clock_now"
          - "drives Subscription.billing_state to CURRENT"
          - "recomputes Subscriber.realized_ltv_cents and projected_ltv_cents"
      - from: OPEN
        to: FAILED
        trigger: "POST /_payments/simulate with outcome SOFT_DECLINE on a non-final attempt"
        actor: BillingOperator
        preconditions:
          - "status IN {OPEN, FAILED}"
        side_effects:
          - "drives Subscription.billing_state to PAST_DUE (hop 1 -> hop 2)"
      - from: FAILED
        to: PAID
        trigger: "POST /_payments/simulate with outcome SUCCEEDED on a retry attempt"
        actor: BillingOperator
        preconditions:
          - "status == FAILED"
        side_effects:
          - "identical to OPEN -> PAID"
      - from: FAILED
        to: WRITTEN_OFF
        trigger: "POST /_payments/simulate with outcome HARD_DECLINE, or SOFT_DECLINE on an attempt whose is_final is true"
        actor: BillingOperator
        preconditions:
          - "status IN {OPEN, FAILED}"
        side_effects:
          - "drives Subscription.billing_state to DELINQUENT and lifecycle_state to CANCELLED (hop 2)"
          - "recomputes Subscriber.realized_ltv_cents, subtracting this invoice's cogs_cents"
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /_payments/simulate with outcome HARD_DECLINE on the first attempt"
        actor: BillingOperator
        preconditions:
          - "status == OPEN"
        side_effects:
          - "identical to FAILED -> WRITTEN_OFF"

  # ---- SubscriptionModification ----
  - entity: SubscriptionModification
    initial_state: REQUESTED
    terminal_states: [REVERSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPLIED
        trigger: "POST /subscriptions/{id}/modifications with effective_at <= clock_now"
        actor: Subscriber | RetentionSpecialist
        preconditions:
          - "Subscription.lifecycle_state IN {ACTIVE, PAUSED}"
          - "expected_subscription_version == Subscription.version"
        side_effects:
          - "captures prior_snapshot, mutates the Subscription, sets delta_price_cents and applied_at"
          - "increments Subscription.version by 1"
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /subscriptions/{id}/modifications with effective_at > clock_now"
        actor: Subscriber | RetentionSpecialist
        preconditions:
          - "Subscription.lifecycle_state IN {ACTIVE, PAUSED}"
        side_effects:
          - "leaves the Subscription untouched except for the version increment"
          - "increments Subscription.version by 1"
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /subscriptions/{id}/renewals when clock_now >= effective_at"
        actor: BillingOperator
        preconditions:
          - "state == SCHEDULED"
          - "clock_now >= effective_at"
        side_effects:
          - "applies the change in created_at ASC order across all due scheduled rows, then re-prices the cycle"
          - "increments Subscription.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /subscription-modifications/{id}/reverse before the effective_at is reached"
        actor: RetentionSpecialist
        preconditions:
          - "state == SCHEDULED"
        side_effects:
          - "creates no compensating row: nothing was applied"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /subscription-modifications/{id}/reverse"
        actor: RetentionSpecialist
        preconditions:
          - "state == APPLIED"
          - "no later APPLIED modification on the same subscription references this row's prior_snapshot fields"
        side_effects:
          - "creates a compensating SubscriptionModification with reverses_modification_id == this.id, state APPLIED, delta_price_cents = -this.delta_price_cents"
          - "restores every field captured in prior_snapshot on the Subscription"
          - "when save_offer_grant_id is set, drives that SaveOfferGrant to REVOKED (hop 2), which clears Subscriber.winback_suppressed_until (hop 3)"
          - "increments Subscription.version by 1"

  # ---- ComplianceNotice ----
  - entity: ComplianceNotice
    initial_state: SCHEDULED
    terminal_states: [SENT, MISSED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /compliance-notices/{id}/send"
        actor: BillingOperator
        preconditions:
          - "state == SCHEDULED"
          - "for notice_type RENEWAL_REMINDER: clock_now is inside the closed window [next_renewal_at - Plan.renewal_reminder_days_before, next_renewal_at - MIN_REMINDER_LEAD_DAYS]"
          - "clock_now - sent_at of the latest SENT notice with the same notice_type and renewal_cycle_index >= NOTICE_COOLDOWN_DAYS"
        side_effects:
          - "sets sent_at = clock_now"
          - "updates Subscriber.last_contacted_at only for win-back sends, never for compliance notices"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /subscriptions/{id}/renewals that issues an invoice while this notice is still SCHEDULED and scheduled_for < clock_now"
        actor: BillingOperator
        preconditions:
          - "state == SCHEDULED"
          - "scheduled_for < clock_now"
        side_effects:
          - "records the compliance gap without blocking non-negative-option renewals"

  # ---- WinBackCampaign ----
  - entity: WinBackCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LAUNCHED
        trigger: "POST /winback-campaigns/{id}/launch"
        actor: RetentionSpecialist
        preconditions:
          - "state == DRAFT"
        side_effects:
          - "increments WinBackCampaign.version by 1"
      - from: LAUNCHED
        to: CLOSED
        trigger: "POST /winback-campaigns/{id}/launch with the campaign already LAUNCHED is rejected; closure happens when every target is terminal"
        actor: system
        preconditions:
          - "state == LAUNCHED"
          - "every WinBackTarget on this campaign has state IN {CONVERTED, EXPIRED, SUPPRESSED} and targeted_count > 0"
        side_effects:
          - "evaluated at the end of POST /winback-targets/{id}/reevaluate; sets state CLOSED"

  # ---- WinBackTarget: cyclic ----
  - entity: WinBackTarget
    initial_state: ELIGIBLE
    terminal_states: [CONVERTED]
    transitions:
      - from: ELIGIBLE
        to: SENT
        trigger: "POST /winback-targets/{id}/send"
        actor: RetentionSpecialist
        preconditions:
          - "state == ELIGIBLE"
          - "WinBackCampaign.state == LAUNCHED"
          - "count of WinBackTarget rows for this subscriber with sent_at inside [clock_now - CONTACT_CAP_WINDOW_DAYS, clock_now] is < CONTACT_CAP"
        side_effects:
          - "sets sent_at = clock_now and expires_at = clock_now + WinBackCampaign.send_window_days days"
          - "sets Subscriber.last_contacted_at = clock_now"
          - "increments WinBackCampaign.sent_count"
      - from: ELIGIBLE
        to: SUPPRESSED
        trigger: "system: target creation, or POST /winback-targets/{id}/reevaluate"
        actor: system
        preconditions:
          - "at least one suppression predicate holds (see calculations.winback_suppression_reason)"
        side_effects:
          - "sets suppression_reason to the first matching predicate in the pinned order"
      - from: SENT
        to: EXPIRED
        trigger: "POST /winback-targets/{id}/reevaluate when clock_now >= expires_at"
        actor: RetentionSpecialist
        preconditions:
          - "state == SENT"
          - "clock_now >= expires_at"
        side_effects:
          - "leaves sent_at intact so the contact cap keeps counting it"
      - from: EXPIRED
        to: ELIGIBLE
        trigger: "POST /winback-targets/{id}/reevaluate when the suppression window has lapsed"
        actor: RetentionSpecialist
        preconditions:
          - "state == EXPIRED"
          - "clock_now >= sent_at + WinBackCampaign.suppression_days days"
          - "no suppression predicate holds"
        side_effects:
          - "clears expires_at to null and suppression_reason to NONE; the target may be sent again (cycle closed)"
      - from: SUPPRESSED
        to: ELIGIBLE
        trigger: "POST /winback-targets/{id}/reevaluate when no suppression predicate holds any more"
        actor: RetentionSpecialist
        preconditions:
          - "state == SUPPRESSED"
          - "no suppression predicate holds"
        side_effects:
          - "sets suppression_reason = NONE"
      - from: SENT
        to: CONVERTED
        trigger: "POST /subscriptions carrying winback_target_id"
        actor: Subscriber
        preconditions:
          - "state == SENT"
          - "the new subscription's subscriber_id == this.subscriber_id"
        side_effects:
          - "sets converted_at = clock_now"
          - "sets Subscriber.churn_type = NONE, won_back_at = clock_now, lapsed_at = null"
          - "increments WinBackCampaign.converted_count"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: modification-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/modifications"
    occ_field: "expected_subscription_version"
    description: |
      Creating a SubscriptionModification against a Subscription whose version has
      advanced since the client last read it is rejected. A newly applied
      modification legitimately supersedes the plan, cadence, addon set and
      discount captured in the prior read, so a writer holding a stale view would
      compute prior_snapshot and delta_price_cents from values the subscription no
      longer holds and silently break the price-conservation invariant.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: target-create-stale-campaign
    parent_entity: WinBackCampaign
    write_endpoint: "POST /winback-campaigns/{id}/targets"
    occ_field: "expected_campaign_version"
    description: |
      Adding a WinBackTarget to a WinBackCampaign whose version has advanced since
      the client last read it is rejected. Each accepted target changes
      targeted_count and can flip the campaign into CLOSED, so a stale writer would
      re-target a subscriber against a target roster it can no longer see.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: invoice_amount_cents
    trigger: "POST /subscriptions (cycle_index 0), POST /subscriptions/{id}/renewals (renewal invoice), and re-pricing of an OPEN invoice when an APPLIED PLAN_DOWNGRADE changes Subscription.plan_id"
    algorithm: aggregation
    formula: |
      # Line construction, pinned order: the PLAN line first, then one line per
      # addon in Subscription.addons sorted by code ASC.
      cycle_days        = Subscription.frequency_weeks * 7
      proration_factor  = 1.0000 for a freshly issued invoice
                        = ROUND_HALF_UP(remaining_days / cycle_days, 4) when an OPEN
                          invoice is re-priced mid-cycle, where
                          remaining_days = floor((Subscription.next_renewal_at - clock_now) / 1 day)
      discount_mult     = 1 - Subscription.active_discount_pct   # 1 when discount_remaining_cycles == 0

      plan_line_cents   = ROUND_HALF_UP(Plan.monthly_price_cents
                                        * Plan.shipments_per_cycle
                                        * discount_mult
                                        * proration_factor)
      addon_line_cents  = ROUND_HALF_UP(addon.unit_price_cents * addon.qty
                                        * discount_mult * proration_factor)

      # ROUNDING ORDER IS PINNED: round EVERY line to whole cents first, THEN sum.
      # "Sum the raw products, then round once" is the forbidden reading and yields
      # a different total (4999 + 1299 at 35% off: 4093 pinned vs 4094 forbidden).
      amount_cents      = plan_line_cents + sum(addon_line_cents)

      cogs_cents        = ROUND_HALF_UP(Plan.unit_cogs_cents * Plan.shipments_per_cycle * proration_factor)
                          + sum(ROUND_HALF_UP(addon.unit_cogs_cents * addon.qty * proration_factor))
      # COGS ignores discount_mult: discounts do not make goods cheaper.
    input_set: "The Subscription's current plan_id, addons array, active_discount_pct (only while discount_remaining_cycles > 0) and frequency_weeks, all read AFTER any modification applied in the same request"
    constants:
      ROUNDING: ROUND_HALF_UP
      PRORATION_DECIMALS: 4
    precision: "amount_cents and cogs_cents are whole cents; proration_factor 4 decimal places, ROUND_HALF_UP"
    variants:
      - name: FULL_CYCLE
        when: "Invoice issued by POST /subscriptions or POST /subscriptions/{id}/renewals"
        difference: "proration_factor is exactly 1.0000 and line_items reflect the plan as of issuance"
      - name: MID_CYCLE_REPRICE
        when: "An OPEN invoice is re-priced because an APPLIED PLAN_DOWNGRADE changed Subscription.plan_id"
        difference: "proration_factor < 1.0000, lines are rebuilt from the TARGET plan, and addons absent from the target plan's addon_catalog are dropped before line construction"

  - name: committed_price_cents
    trigger: "Every transition that mutates Subscription.plan_id, addons, active_discount_pct or frequency_weeks (modification APPLIED, modification REVERSED, grant ACCEPTED, grant REVOKED)"
    algorithm: aggregation
    formula: |
      committed_price_cents = ROUND_HALF_UP(Plan.monthly_price_cents
                                            * Plan.shipments_per_cycle
                                            * (1 - Subscription.active_discount_pct))
                              + sum over Subscription.addons of
                                ROUND_HALF_UP(addon.unit_price_cents * addon.qty
                                              * (1 - Subscription.active_discount_pct))
      # Conserved-quantity invariant (money):
      #   committed_price_cents == baseline_price_cents
      #     + sum of delta_price_cents over SubscriptionModification rows with
      #       subscription_id == S and state IN {APPLIED, REVERSED}
      # A reversal keeps the original row's delta and adds the exact inverse, so a
      # forward-plus-compensating pair leaves committed_price_cents unchanged.
    input_set: "SubscriptionModification rows in state APPLIED or REVERSED; rows in state SCHEDULED or CANCELLED are excluded"
    constants:
      ROUNDING: ROUND_HALF_UP
    precision: "whole cents"

  - name: save_offer_margin_pct
    trigger: "POST /cancellation-sessions/{id}/present-offers, at SaveOfferGrant creation"
    algorithm: weighted_scoring
    formula: |
      P  = Plan.monthly_price_cents of the subscription's CURRENT plan
      C  = Plan.unit_cogs_cents of that plan
      S  = Plan.shipments_per_cycle
      H  = POST_OFFER_HORIZON_CYCLES

      # Offer-cycle shape by offer_type (N = number of offer cycles):
      #   DISCOUNT       : N = discount_cycles
      #                    rev_offer  = ROUND_HALF_UP(P * S * (1 - discount_pct))
      #                    cogs_offer = C * S
      #   PAUSE          : N = pause_cycles ; rev_offer = 0 ; cogs_offer = 0
      #   SKIP           : N = skip_count   ; rev_offer = 0 ; cogs_offer = 0
      #   PLAN_DOWNGRADE : N = 0 ; the whole horizon is priced on the target plan:
      #                    rev_post = ROUND_HALF_UP(target.monthly_price_cents * S)
      #                    cogs_post = target.unit_cogs_cents * S
      # Post-offer cycles (H of them) are priced on the CURRENT plan at list price,
      # except PLAN_DOWNGRADE, which prices them on the target plan.
      # For PLAN_DOWNGRADE the PER_CYCLE variant reads the first POST-offer cycle
      # instead (rev_offer := rev_post, cogs_offer := cogs_post), because a
      # downgrade has no distinct offer cycle.

      total_term_revenue_cents = N * rev_offer + H * rev_post
      total_term_cogs_cents    = N * cogs_offer + H * cogs_post
      retention_value_cents    = total_term_revenue_cents - total_term_cogs_cents

      per_cycle_margin_pct     = ROUND_HALF_UP((rev_offer - cogs_offer) / rev_offer, 4)
                                 ; 0.0000 when rev_offer == 0
      blended_term_margin_pct  = ROUND_HALF_UP((total_term_revenue_cents - total_term_cogs_cents)
                                               / total_term_revenue_cents, 4)
                                 ; 0.0000 when total_term_revenue_cents == 0

      # THE GUARDRAIL USES blended_term_margin_pct, NEVER per_cycle_margin_pct:
      margin_exception_required = blended_term_margin_pct < Plan.margin_floor_pct   # strict <
    input_set: "The subscription's current Plan, the SaveOfferTemplate being presented, and (for PLAN_DOWNGRADE) Plan.downgrade_target_plan_id"
    constants:
      POST_OFFER_HORIZON_CYCLES: 3
      ROUNDING: ROUND_HALF_UP
    precision: "margins 4 decimal places ROUND_HALF_UP; cents are whole integers"
    variants:
      - name: PER_CYCLE
        when: "Displayed to the subscriber and stored in per_cycle_margin_pct"
        difference: "Only the first offer cycle is considered, so a deep short discount looks unprofitable (4999/2100 at 35% off for 2 cycles: 0.3536)"
      - name: BLENDED_TERM
        when: "Compared against Plan.margin_floor_pct to decide margin_exception_required"
        difference: "Amortises the offer over N + POST_OFFER_HORIZON_CYCLES cycles, so the same offer reads 0.5115 and clears a 0.4200 floor the PER_CYCLE reading would breach"

  - name: save_offer_selection
    trigger: "POST /cancellation-sessions/{id}/present-offers"
    algorithm: constraint_propagation
    formula: |
      # (a) Eligibility filter -- candidate set of SaveOfferTemplate rows T:
      T.status == ACTIVE
      AND CancellationSession.reason_code IN T.eligible_reason_codes
      AND Subscriber.tenure_days >= T.min_tenure_days                       # inclusive
      # The 365-day grant quota is deliberately NOT part of this filter: the
      # selector never skips a quota-exhausted template, so an exhausted
      # top-ranked offer wins the ranking and is then rejected by
      # validations[priority=39] with ERR_OFFER_QUOTA_EXCEEDED. Filtering it out
      # here instead would make that error unreachable and would silently
      # promote a cheaper offer the retention policy did not authorise.
      AND (T.offer_type != PAUSE OR Subscription.lifecycle_state == ACTIVE)
      AND (T.offer_type != SKIP  OR Subscription.term_shipments_remaining > 0)
      AND (T.offer_type != PLAN_DOWNGRADE OR Plan.downgrade_target_plan_id IS NOT NULL)

      # (b) Ranking expression, applied to the candidate set:
      ORDER BY T.priority_rank ASC,
               blended_term_margin_pct DESC,        # from save_offer_margin_pct
      # (c) Tie-break when both keys tie:
               T.created_at ASC
      # (d) Empty candidate set:
      #     reject with ERR_NO_ELIGIBLE_SAVE_OFFER (422); session.state stays
      #     REASON_CAPTURED, offers_presented_count and step_count unchanged, so the
      #     subscriber can still complete within the simple-cancellation budget.
      selected = first row of the ordered candidate set
    input_set: "SaveOfferTemplate rows with status ACTIVE; grants counted across every subscription of the acting subscriber"
    constants:
      GRANT_WINDOW_DAYS: 365
    precision: "n/a - selection returns exactly one SaveOfferTemplate.id"

  - name: dunning_retry_schedule
    trigger: "POST /invoices/{id}/dunning-attempts"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular -- the grace
      # window bounds the retry schedule, while the card-updater state that widens
      # the grace window is itself set by the decline that triggered the retry --
      # so the order below is normative and each step reads only values written by
      # earlier steps.
      step 1: grace_base_days = BASE_GRACE_DAYS_BY_TENURE[
                  Subscriber.tenure_bucket evaluated at Subscription.first_failed_at]
      step 2: grace_days = grace_base_days
                           + (CARD_UPDATER_EXTENSION_DAYS
                              if PaymentMethod.updater_status == PENDING
                                 as observed NOW, before this attempt settles
                              else 0)
      step 3: Subscription.grace_end_at = Subscription.first_failed_at + grace_days days
              # Recomputed on EVERY attempt creation, so an UNAVAILABLE updater
              # result shrinks the window back to grace_base_days.
      step 4: raw_scheduled_at = previous_attempt.attempted_at
                                 + BACKOFF_DAYS_BY_DECLINE[previous_attempt.decline_code]
                                                          [attempt_number - 1] days
              # attempt_number == 1 (initial charge): raw_scheduled_at = clock_now,
              # backoff_days_applied = 0, grace_clamped = false, is_final = false,
              # and steps 1-3 are skipped because first_failed_at is null.
      step 5: scheduled_at   = min(raw_scheduled_at, Subscription.grace_end_at)
      step 6: grace_clamped  = (raw_scheduled_at > Subscription.grace_end_at)   # strict >
              is_final       = grace_clamped
      step 7: reject with ERR_DUNNING_ATTEMPTS_EXHAUSTED when attempt_number > MAX_RETRY_ATTEMPTS
              reject with ERR_GRACE_PERIOD_ENDED when attempt_number >= 2
                     and clock_now > Subscription.grace_end_at computed at step 3
    input_set: "The invoice's DunningAttempt rows ordered by created_at ASC; the subscription's PaymentMethod as of now; the subscriber's tenure bucket frozen at first_failed_at"
    constants:
      BASE_GRACE_DAYS_BY_TENURE: { M0_1: 3, M2_3: 5, M4_6: 7, M7_12: 10, M13_PLUS: 14 }
      CARD_UPDATER_EXTENSION_DAYS: 4
      BACKOFF_DAYS_BY_DECLINE:
        INSUFFICIENT_FUNDS: [1, 3, 5, 7]
        EXPIRED_CARD: [0, 2, 4, 6]
        DO_NOT_HONOR: [2, 4, 6, 8]
        LOST_STOLEN: [0, 0, 0, 0]
      MAX_RETRY_ATTEMPTS: 4
    precision: "whole days; all instants are ISO 8601 UTC with three fractional digits"

  - name: subscriber_lifetime_value
    trigger: "Invoice transitions to PAID or WRITTEN_OFF; Subscription transitions to CANCELLED; WinBackTarget targeting; POST /retention-cohort-snapshots"
    algorithm: forward_looking
    formula: |
      realized_ltv_cents =
            sum over Invoice I where I.subscription_id IN (subscriptions of this subscriber)
                                 AND I.status == PAID
                of (I.amount_cents - I.cogs_cents)
          - sum over Invoice I where same subscriber AND I.status == WRITTEN_OFF
                of I.cogs_cents
      # Invoices in OPEN or FAILED contribute nothing to the realized figure.

      current_cycle_margin_cents =
          (I.amount_cents - I.cogs_cents) for the single Invoice I of this subscriber
          with I.status IN {OPEN, PAID} ordered by I.due_at DESC, I.created_at DESC
          taking the first row; 0 when no such invoice exists

      monthly_churn_rate = CHANNEL_BASE_CHURN[Subscriber.acquisition_channel]
                           * TENURE_MULTIPLIER[Subscriber.tenure_bucket]
      expected_remaining_cycles = 0 when Subscriber.churn_type != NONE
                                = min(HORIZON_CYCLES_CAP,
                                      int(ROUND_HALF_UP(1 / monthly_churn_rate, 0)))
                                  otherwise
      projected_ltv_cents = realized_ltv_cents
                            + int(ROUND_HALF_UP(current_cycle_margin_cents
                                                * expected_remaining_cycles, 0))
    input_set: "Every Invoice of every Subscription of the subscriber, filtered by status as written above; tenure_bucket and churn_type as of clock_now"
    constants:
      CHANNEL_BASE_CHURN: { PAID_SOCIAL: 0.10, SEARCH: 0.07, AFFILIATE: 0.12, ORGANIC: 0.05, REFERRAL: 0.04 }
      TENURE_MULTIPLIER: { M0_1: 1.6, M2_3: 1.2, M4_6: 1.0, M7_12: 0.8, M13_PLUS: 0.6 }
      HORIZON_CYCLES_CAP: 24
    precision: "whole cents; expected_remaining_cycles is an integer via ROUND_HALF_UP"
    variants:
      - name: REALIZED
        when: "Stored in Subscriber.realized_ltv_cents and averaged when RetentionCohortSnapshot.ltv_variant == REALIZED"
        difference: "Counts only settled invoices and subtracts written-off COGS, so a subscriber who paid one 6298/2620 invoice and had a second written off reads 1058"
      - name: PROJECTED
        when: "Stored in Subscriber.projected_ltv_cents and averaged when RetentionCohortSnapshot.ltv_variant == PROJECTED"
        difference: "Adds current_cycle_margin_cents * expected_remaining_cycles, so the same PAID_SOCIAL/M2_3 subscriber with one paid 6298/2620 invoice reads 33102 instead of 3678; identical to REALIZED once churn_type != NONE"

  - name: cohort_retention_metrics
    trigger: "POST /retention-cohort-snapshots"
    algorithm: aggregation
    formula: |
      month_start      = first instant of cohort_month, UTC
      next_month_start = first instant of the following month, UTC
      members = Subscriber rows where
          first_subscribed_at IS NOT NULL
          AND month_start <= first_subscribed_at < next_month_start        # half-open
          AND (acquisition_channel filter is null OR matches)
          AND (plan_code filter is null OR equals Plan.code of the subscriber's
               FIRST Subscription ordered by created_at ASC)
          AND (tenure_bucket filter is null OR equals Subscriber.tenure_bucket now)

      member_count               = count(members)
      retained_count             = count of members holding at least one Subscription
                                   with lifecycle_state IN {ACTIVE, PAUSED, PENDING_CANCEL}
      churned_voluntary_count    = count of members with churn_type == VOLUNTARY
      churned_involuntary_count  = count of members with churn_type == INVOLUNTARY
      retention_rate = 0.0000 when member_count == 0
                     = ROUND_HALF_UP(retained_count / member_count, 4)
      mean_ltv_cents = 0 when member_count == 0
                     = int(ROUND_HALF_UP(sum over members of
                             (realized_ltv_cents when ltv_variant == REALIZED
                              else projected_ltv_cents) / member_count, 0))
    input_set: "Subscriber rows only; the snapshot never reads Invoice rows directly, it reads the two stored LTV fields"
    constants:
      ROUNDING: ROUND_HALF_UP
    precision: "retention_rate 4 decimal places; mean_ltv_cents whole cents"

  - name: winback_suppression_reason
    trigger: "POST /winback-campaigns/{id}/targets and POST /winback-targets/{id}/reevaluate"
    algorithm: constraint_propagation
    formula: |
      # Predicates evaluated in this pinned order; the FIRST match wins and the
      # target is created (or re-set) in state SUPPRESSED with that reason.
      1. DO_NOT_CONTACT         : Subscriber.do_not_contact == true
      2. ACTIVE_SUBSCRIPTION    : the subscriber holds a Subscription with
                                  lifecycle_state IN {ACTIVE, PAUSED, PENDING_CANCEL}
      3. INVOLUNTARY_UNRESOLVED : Subscriber.churn_type == INVOLUNTARY
                                  AND the PaymentMethod of the subscriber's most
                                  recently created Subscription has
                                  status != ACTIVE OR updater_status IN {PENDING, UNAVAILABLE}
      4. RECENT_SAVE_OFFER      : a SaveOfferGrant with state ACCEPTED exists for this
                                  subscriber with accepted_at >= clock_now - 90 days
      5. CONTACT_CAP            : Subscriber.last_contacted_at IS NOT NULL AND
                                  last_contacted_at > clock_now - CONTACT_CAP_WINDOW_DAYS days
      # No predicate matches -> state ELIGIBLE, suppression_reason NONE.
    input_set: "The subscriber, all of its subscriptions and their payment methods, its accepted grants, and its last_contacted_at"
    constants:
      RECENT_SAVE_OFFER_DAYS: 90
      CONTACT_CAP_WINDOW_DAYS: 30
      CONTACT_CAP: 1
    precision: "n/a - returns one enum member"

  - name: winback_priority_score
    trigger: "POST /winback-campaigns/{id}/targets, at WinBackTarget creation"
    algorithm: weighted_scoring
    formula: |
      days_since_lapse = floor((clock_now - Subscriber.lapsed_at) / 1 day)
      reason_code      = CancellationSession.reason_code of the most recent session on
                         any subscription of this subscriber ordered by
                         started_at DESC, created_at DESC, in ANY state; null when none
      raw = 0.45 * min(1, Subscriber.realized_ltv_cents / LTV_NORMALIZER_CENTS)
          + 0.30 * (1 - min(1, days_since_lapse / max(1, WinBackCampaign.max_days_since_lapse)))
          + 0.25 * REASON_WEIGHT[reason_code]        # 0.0 when reason_code is null
      priority_score = ROUND_HALF_UP(raw, 4)
      # Non-linear ceiling: an involuntary churner can never outrank a voluntary one
      # above the ceiling, no matter how strong the other two factors are.
      priority_score = min(priority_score, INVOLUNTARY_SCORE_CEILING)
                       when Subscriber.churn_type == INVOLUNTARY
      # min(1, ...) clamps a negative realized LTV upward only at the 1 bound; a
      # negative realized LTV contributes a negative first term unchanged.
    input_set: "The subscriber's realized_ltv_cents, lapsed_at, churn_type and latest cancellation reason; the campaign's max_days_since_lapse"
    constants:
      LTV_NORMALIZER_CENTS: 20000
      REASON_WEIGHT: { PRICE: 1.0, FINANCIAL_HARDSHIP: 0.7, SHIPPING_ISSUES: 0.6, TOO_MUCH_PRODUCT: 0.8, PRODUCT_FIT: 0.4, OTHER: 0.2 }
      INVOLUNTARY_SCORE_CEILING: 0.4000
    precision: "4 decimal places, ROUND_HALF_UP"

  - name: cancellation_step_budget
    trigger: "POST /cancellation-sessions/{id}/reason and POST /cancellation-sessions/{id}/present-offers"
    algorithm: threshold
    formula: |
      # Simple-cancellation requirement: a subscriber must always be able to finish
      # in at most MAX_CANCELLATION_STEPS recorded steps, of which the completion
      # call is the last. Pre-completion calls therefore share a budget of
      # MAX_CANCELLATION_STEPS - 1 steps.
      allowed = (CancellationSession.step_count + 1) <= (MAX_CANCELLATION_STEPS - 1)
      # step_count starts at 1 (the create call). POST .../reason and
      # POST .../present-offers each consume one step; POST .../complete increments
      # step_count but is EXEMPT from the check.
      # An offer round additionally requires offers_presented_count == 0.
      violation -> ERR_SIMPLE_CANCELLATION_VIOLATION (422), no state change
    input_set: "The session's own step_count and offers_presented_count"
    constants:
      MAX_CANCELLATION_STEPS: 4
    precision: "integer steps; the boundary is inclusive (step_count may reach 3)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path-segment resource exists, validated left to right"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Every foreign key supplied in the body resolves to an existing row (subscriber_id, plan_id, payment_method_id, subscription_id, target_plan_id, winback_target_id)"
    error_id: ERR_SUBSCRIBER_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
  - priority: 5
    category: business_constraint
    check: "Body conforms to the endpoint input schema: required fields present, enums in range, integers non-negative, ISO 8601 datetimes, cohort_month matching ^[0-9]{4}-(0[1-9]|1[0-2])$"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: auth
    check: "When the acting role is Subscriber, X-User-ID equals the subscriber_id of the resource chain being touched"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /payment-methods, POST /subscriptions, POST /subscriptions/{id}/modifications, PATCH /subscribers/{id}, POST /cancellation-sessions, POST /cancellation-sessions/{id}/reason, POST /cancellation-sessions/{id}/complete, POST /save-offer-grants/{id}/accept, POST /save-offer-grants/{id}/decline"
  - priority: 7
    category: state
    check: "expected_subscription_version equals Subscription.version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/modifications"
  - priority: 8
    category: state
    check: "expected_campaign_version equals WinBackCampaign.version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /winback-campaigns/{id}/targets"
  - priority: 9
    category: business_safety
    check: "The acting ComplianceOfficer's X-User-ID differs from SaveOfferGrant.presented_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /save-offer-grants/{id}/margin-exception"
  - priority: 10
    category: state
    check: "Plan.status == ACTIVE for the plan a new subscription is created on"
    error_id: ERR_PLAN_RETIRED
    http_status: 422
    applies_to: "POST /subscriptions"
  - priority: 11
    category: state
    check: "Subscription.lifecycle_state IN {ACTIVE, PAUSED}"
    error_id: ERR_SUBSCRIPTION_NOT_MODIFIABLE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/modifications, POST /cancellation-sessions"
  - priority: 12
    category: state
    check: "No other CancellationSession on this subscription is in state STARTED, REASON_CAPTURED or OFFERS_PRESENTED"
    error_id: ERR_SESSION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /cancellation-sessions"
  - priority: 13
    category: state
    check: "CancellationSession.state is not one of the terminal states OFFER_ACCEPTED, COMPLETED_CANCELLED, ABANDONED"
    error_id: ERR_SESSION_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /cancellation-sessions/{id}/reason, POST /cancellation-sessions/{id}/present-offers, POST /cancellation-sessions/{id}/complete"
  - priority: 14
    category: state
    check: "CancellationSession.reason_code is not null"
    error_id: ERR_REASON_NOT_CAPTURED
    http_status: 409
    applies_to: "POST /cancellation-sessions/{id}/present-offers, POST /cancellation-sessions/{id}/complete"
  - priority: 15
    category: state
    check: "SaveOfferGrant.state == PRESENTED"
    error_id: ERR_OFFER_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /save-offer-grants/{id}/accept, POST /save-offer-grants/{id}/decline"
  - priority: 16
    category: state
    check: "clock_now < SaveOfferGrant.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /save-offer-grants/{id}/accept"
  - priority: 17
    category: state
    check: "Invoice.status IN {OPEN, FAILED}"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /invoices/{id}/dunning-attempts, POST /_payments/simulate"
  - priority: 18
    category: state
    check: "A DunningAttempt with outcome PENDING exists on the invoice"
    error_id: ERR_NO_PENDING_ATTEMPT
    http_status: 409
    applies_to: "POST /_payments/simulate"
  - priority: 19
    category: state
    check: "PaymentMethod.updater_status == PENDING"
    error_id: ERR_UPDATER_NOT_PENDING
    http_status: 409
    applies_to: "POST /payment-methods/{id}/updater-result"
  - priority: 20
    category: state
    check: "WinBackCampaign.state == LAUNCHED"
    error_id: ERR_CAMPAIGN_NOT_LAUNCHED
    http_status: 409
    applies_to: "POST /winback-campaigns/{id}/targets, POST /winback-targets/{id}/send"
  - priority: 21
    category: state
    check: "WinBackTarget.state == ELIGIBLE"
    error_id: ERR_TARGET_SUPPRESSED
    http_status: 409
    applies_to: "POST /winback-targets/{id}/send"
  - priority: 22
    category: state
    check: "ComplianceNotice.state == SCHEDULED"
    error_id: ERR_NOTICE_ALREADY_SENT
    http_status: 409
    applies_to: "POST /compliance-notices/{id}/send"
  - priority: 23
    category: state
    check: "SubscriptionModification.state IN {APPLIED, SCHEDULED}"
    error_id: ERR_MODIFICATION_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /subscription-modifications/{id}/reverse"
  - priority: 24
    category: business_safety
    check: "Simple-cancellation step budget: step_count + 1 <= MAX_CANCELLATION_STEPS - 1, and offers_presented_count == 0 for an offer round"
    error_id: ERR_SIMPLE_CANCELLATION_VIOLATION
    http_status: 422
    applies_to: "POST /cancellation-sessions/{id}/reason, POST /cancellation-sessions/{id}/present-offers"
  - priority: 25
    category: business_safety
    check: "disclosure_acknowledged == true when Plan.is_negative_option == true"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /subscriptions"
  - priority: 26
    category: business_safety
    check: "For a negative-option plan, a ComplianceNotice with notice_type RENEWAL_REMINDER, state SENT and renewal_cycle_index equal to the cycle being renewed has sent_at inside the closed window [next_renewal_at - Plan.renewal_reminder_days_before, next_renewal_at - MIN_REMINDER_LEAD_DAYS]"
    error_id: ERR_RENEWAL_REMINDER_MISSING
    http_status: 422
    applies_to: "POST /subscriptions/{id}/renewals"
  - priority: 27
    category: business_safety
    check: "clock_now - sent_at of the latest SENT notice with the same notice_type and renewal_cycle_index >= NOTICE_COOLDOWN_DAYS (3)"
    error_id: ERR_NOTICE_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /compliance-notices/{id}/send"
  - priority: 28
    category: business_temporal
    check: "For notice_type RENEWAL_REMINDER, the pinned instant lies inside the closed window [next_renewal_at - Plan.renewal_reminder_days_before, next_renewal_at - MIN_REMINDER_LEAD_DAYS]: scheduled_for on the schedule call, clock_now on the send call"
    error_id: ERR_NOTICE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /subscriptions/{id}/compliance-notices, POST /compliance-notices/{id}/send"
  - priority: 29
    category: business_temporal
    check: "The requested pause window [pause_start_at, pause_end_at) does not overlap the window of any SubscriptionModification with mod_type PAUSE and state IN {APPLIED, SCHEDULED}; half-open semantics, so prior.pause_end_at == new.pause_start_at is allowed"
    error_id: ERR_PAUSE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /subscriptions/{id}/modifications"
  - priority: 30
    category: business_temporal
    check: "Count of WinBackTarget rows for this subscriber whose sent_at lies in the closed sliding window [clock_now - CONTACT_CAP_WINDOW_DAYS, clock_now] is strictly below CONTACT_CAP (1); aggregate capacity, not pairwise overlap"
    error_id: ERR_CONTACT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /winback-targets/{id}/send"
  - priority: 31
    category: business_temporal
    check: "For attempt_number >= 2, clock_now <= Subscription.grace_end_at recomputed at step 3 of dunning_retry_schedule"
    error_id: ERR_GRACE_PERIOD_ENDED
    http_status: 409
    applies_to: "POST /invoices/{id}/dunning-attempts"
  - priority: 32
    category: business_temporal
    check: "clock_now >= Subscription.next_renewal_at"
    error_id: ERR_RENEWAL_NOT_DUE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/renewals"
  - priority: 33
    category: business_constraint
    check: "frequency_weeks is a member of Plan.allowed_frequency_weeks"
    error_id: ERR_FREQUENCY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/modifications"
  - priority: 34
    category: business_constraint
    check: "addon_code appears in Plan.addon_catalog of the subscription's current plan"
    error_id: ERR_ADDON_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/modifications"
  - priority: 35
    category: business_constraint
    check: "ceil((pause_end_at - pause_start_at) / cycle_days) <= Plan.max_pause_cycles"
    error_id: ERR_PAUSE_EXCEEDS_MAX_CYCLES
    http_status: 422
    applies_to: "POST /subscriptions/{id}/modifications"
  - priority: 36
    category: business_constraint
    check: "Subscription.term_shipments_remaining > 0 before a SKIP_SHIPMENT is applied"
    error_id: ERR_SKIP_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/modifications"
  - priority: 37
    category: business_constraint
    check: "For PLAN_DOWNGRADE, target_plan_id equals Plan.downgrade_target_plan_id of the current plan and that value is not null"
    error_id: ERR_DOWNGRADE_TARGET_MISSING
    http_status: 422
    applies_to: "POST /subscriptions/{id}/modifications"
  - priority: 38
    category: business_constraint
    check: "Not every ACTIVE template whose eligible_reason_codes contains the session's reason_code was excluded SOLELY by min_tenure_days; when tenure is the only reason the pool emptied, this rule fires and priority 40 does not"
    error_id: ERR_TENURE_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /cancellation-sessions/{id}/present-offers"
  - priority: 39
    category: business_constraint
    check: "Grants of the selected template for this subscriber inside the trailing 365 days are strictly below max_per_subscriber_per_365d"
    error_id: ERR_OFFER_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /cancellation-sessions/{id}/present-offers"
  - priority: 40
    category: business_constraint
    check: "The eligibility filter of save_offer_selection yields at least one candidate template for a reason other than min_tenure_days (no template lists the reason_code, the offer_type's structural precondition fails, or every match is RETIRED); the grant quota is not part of the filter and is enforced separately at priority 39"
    error_id: ERR_NO_ELIGIBLE_SAVE_OFFER
    http_status: 422
    applies_to: "POST /cancellation-sessions/{id}/present-offers"
  - priority: 41
    category: business_constraint
    check: "Subscriber.lapsed_at is not null and min_days_since_lapse <= days_since_lapse <= max_days_since_lapse"
    error_id: ERR_SUBSCRIBER_NOT_LAPSED
    http_status: 422
    applies_to: "POST /winback-campaigns/{id}/targets"
  - priority: 42
    category: business_constraint
    check: "Subscriber.winback_suppressed_until is null or <= clock_now"
    error_id: ERR_WINBACK_SUPPRESSION_ACTIVE
    http_status: 422
    applies_to: "POST /winback-campaigns/{id}/targets"
  - priority: 43
    category: business_constraint
    check: "No WinBackTarget with this winback_campaign_id and subscriber_id already exists"
    error_id: ERR_DUPLICATE_TARGET
    http_status: 409
    applies_to: "POST /winback-campaigns/{id}/targets"
  - priority: 44
    category: business_fiscal
    check: "SaveOfferGrant.margin_exception_state == PENDING"
    error_id: ERR_MARGIN_EXCEPTION_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /save-offer-grants/{id}/margin-exception"
  - priority: 45
    category: business_fiscal
    check: "Subscription.billing_state == CURRENT when the grant's offer_type IN {DISCOUNT, PLAN_DOWNGRADE}"
    error_id: ERR_SUBSCRIPTION_PAST_DUE
    http_status: 409
    applies_to: "POST /save-offer-grants/{id}/accept"
  - priority: 46
    category: business_fiscal
    check: "margin_exception_required == false OR margin_exception_state == APPROVED"
    error_id: ERR_MARGIN_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /save-offer-grants/{id}/accept"
  - priority: 47
    category: business_fiscal
    check: "attempt_number <= MAX_RETRY_ATTEMPTS (4)"
    error_id: ERR_DUNNING_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /invoices/{id}/dunning-attempts"
  - priority: 48
    category: business_referential
    check: "Subscription.payment_method_id points at a PaymentMethod whose status is ACTIVE; a REPLACED or EXPIRED card may still be retried against an existing invoice but may not have a new invoice issued against it"
    error_id: ERR_PAYMENT_METHOD_INACTIVE
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/renewals"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- configuration ----
  - method: POST
    path: "/plans"
    description: "Create a plan"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, monthly_price_cents, unit_cogs_cents, margin_floor_pct, "shipments_per_cycle?", "shipments_per_term?", "allowed_frequency_weeks?", "is_negative_option?", "renewal_reminder_days_before?", "max_pause_cycles?", "addon_catalog?", "downgrade_target_plan_id?", "status?"]
    output: Plan
    side_effects: ["initialises active_subscription_count to 0"]
  - method: GET
    path: "/plans/{id}"
    description: "Read one plan"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans ordered by created_at ASC; downgrade_target_plan_id filters to the children of one plan (self-referential reverse reachability)"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["downgrade_target_plan_id?", "status?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []

  - method: POST
    path: "/save-offer-templates"
    description: "Create a save-offer template"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, offer_type, priority_rank, "discount_pct?", "discount_cycles?", "pause_cycles?", "skip_count?", "min_tenure_days?", "eligible_reason_codes?", "max_per_subscriber_per_365d?", "expires_after_hours?", "status?"]
    output: SaveOfferTemplate
    side_effects: []
  - method: GET
    path: "/save-offer-templates/{id}"
    description: "Read one save-offer template"
    roles: [PlatformAdmin, RetentionSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: SaveOfferTemplate
    side_effects: []

  # ---- subscribers ----
  - method: POST
    path: "/subscribers"
    description: "Register a subscriber"
    roles: [PlatformAdmin]
    code: 201
    input: [email, acquisition_channel, "do_not_contact?"]
    output: Subscriber
    side_effects: ["sets churn_type NONE, realized_ltv_cents 0, projected_ltv_cents 0, save_offer_grants_365d_count 0"]
  - method: PATCH
    path: "/subscribers/{id}"
    description: "Update the marketing contact preference"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: [do_not_contact]
    output: Subscriber
    side_effects: ["increments Subscriber.version by 1"]
  - method: GET
    path: "/subscribers/{id}"
    description: "Read one subscriber including both LTV variants and the suppression window"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  - method: POST
    path: "/payment-methods"
    description: "Attach a payment method; the subscriber's previous ACTIVE method becomes REPLACED and every non-CANCELLED subscription is repointed to the new method"
    roles: [Subscriber, PlatformAdmin]
    code: 201
    input: [subscriber_id, card_last4, exp_month, exp_year, network]
    output: PaymentMethod
    side_effects:
      - "prior ACTIVE PaymentMethod of this subscriber becomes REPLACED"
      - "Subscription.payment_method_id of every subscription with lifecycle_state != CANCELLED is repointed, incrementing Subscription.version by 1"
  - method: POST
    path: "/payment-methods/{id}/updater-result"
    description: "Ingest the card-updater network response for a method whose updater_status is PENDING"
    roles: [BillingOperator]
    code: 200
    input: [outcome, "new_card_last4?", "new_exp_month?", "new_exp_year?"]
    output: PaymentMethod
    side_effects:
      - "outcome UPDATED: sets updater_status UPDATED, applies new_card_last4/new_exp_month/new_exp_year when supplied, keeps status ACTIVE"
      - "outcome UNAVAILABLE: sets updater_status UNAVAILABLE and status EXPIRED"
      - "increments PaymentMethod.version by 1"
  - method: GET
    path: "/payment-methods/{id}"
    description: "Read one payment method"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: PaymentMethod
    side_effects: []
  - method: GET
    path: "/payment-methods"
    description: "List payment methods ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscriber_id?", "status?", "limit?", "offset?"]
    output: PaymentMethod[]
    side_effects: []

  # ---- subscriptions ----
  - method: POST
    path: "/subscriptions"
    description: "Start a subscription; optionally cites the WinBackTarget it converts"
    roles: [Subscriber, PlatformAdmin]
    code: 201
    input: [subscriber_id, plan_id, payment_method_id, frequency_weeks, disclosure_acknowledged, "addons?", "winback_target_id?"]
    output: Subscription
    side_effects:
      - "sets Subscriber.first_subscribed_at and cohort_month when this is the subscriber's first subscription"
      - "sets next_renewal_at = next_ship_at = created_at + frequency_weeks * 7 days"
      - "creates Invoice(cycle_index 0, status OPEN, is_renewal false) priced by calculations.invoice_amount_cents, with addon unit prices and unit COGS snapshotted from Plan.addon_catalog"
      - "creates ComplianceNotice(NEGATIVE_OPTION_DISCLOSURE, state SENT, sent_at clock_now, renewal_cycle_index 0) when Plan.is_negative_option"
      - "creates ComplianceNotice(RENEWAL_REMINDER, state SCHEDULED, scheduled_for next_renewal_at - Plan.renewal_reminder_days_before, renewal_cycle_index 1) when Plan.is_negative_option"
      - "sets baseline_price_cents = committed_price_cents, term_shipments_delivered = 1, term_shipments_skipped = 0 and term_shipments_remaining = Plan.shipments_per_term - 1"
      - "when winback_target_id is supplied: WinBackTarget -> CONVERTED, Subscriber.churn_type -> NONE, lapsed_at -> null, won_back_at -> clock_now, WinBackCampaign.converted_count incremented"
      - "increments Plan.active_subscription_count"
  - method: GET
    path: "/subscriptions/{id}"
    description: "Read one subscription including both state axes and every conserved counter"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscriber_id?", "plan_id?", "payment_method_id?", "lifecycle_state?", "billing_state?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/modifications"
    description: "Request a subscription modification; applied immediately when effective_at <= now, otherwise scheduled"
    roles: [Subscriber, RetentionSpecialist]
    code: 201
    input: [mod_type, expected_subscription_version, "frequency_weeks?", "addon_code?", "addon_qty?", "skip_ship_at?", "pause_start_at?", "pause_end_at?", "target_plan_id?", "effective_at?"]
    output: SubscriptionModification
    side_effects:
      - "captures prior_snapshot, mutates the Subscription per mod_type, recomputes committed_price_cents and delta_price_cents"
      - "PAUSE drives lifecycle_state to PAUSED; RESUME drives it back to ACTIVE"
      - "SKIP_SHIPMENT increments term_shipments_skipped and decrements term_shipments_remaining"
      - "PLAN_DOWNGRADE repoints plan_id to target_plan_id and drops from addons every entry whose code is absent from the target plan's addon_catalog; when an OPEN invoice exists on the subscription it is re-priced from the target plan under the MID_CYCLE_REPRICE variant and a ComplianceNotice(PRICE_CHANGE, SCHEDULED, scheduled_for clock_now + PRICE_CHANGE_NOTICE_LEAD_DAYS) is created"
      - "a row settled into SCHEDULED leaves delta_price_cents at 0 and mutates nothing but the version"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/subscriptions/{id}/renewals"
    description: "Ops-run checkpoint for one subscription: finalises a due PENDING_CANCEL, auto-resumes a lapsed pause, abandons stale cancellation sessions, applies due SCHEDULED modifications, marks overdue notices MISSED, then issues the renewal invoice"
    roles: [BillingOperator]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "step 1: lifecycle_state PENDING_CANCEL with clock_now >= cancel_effective_at -> CANCELLED, Subscriber.churn_type VOLUNTARY, lapsed_at clock_now, projected_ltv_cents re-derived to equal realized_ltv_cents; steps 5-7 are then skipped and no invoice is issued, so the negative-option gate never applies to a cancelling subscription"
      - "step 2: lifecycle_state PAUSED with clock_now >= paused_until -> ACTIVE, paused_until null"
      - "step 3: every CancellationSession on this subscription with a non-terminal state and clock_now - started_at > SESSION_TTL_HOURS -> ABANDONED, and its PRESENTED grants -> EXPIRED"
      - "step 4: SubscriptionModification rows in SCHEDULED with effective_at <= clock_now -> APPLIED in created_at ASC order"
      - "step 5: negative-option gate per validations[priority=26]; on failure nothing is mutated"
      - "step 6: ComplianceNotice rows still SCHEDULED with scheduled_for < clock_now -> MISSED"
      - "step 7: the cycle is skipped when an APPLIED SubscriptionModification with mod_type SKIP_SHIPMENT carries skip_ship_at == next_ship_at; a skipped cycle issues no invoice and only advances next_renewal_at and next_ship_at by cycle_days. Otherwise a new Invoice(cycle_index = previous cycle_index + 1, OPEN, is_renewal true) is created, term_shipments_delivered increments, term_shipments_remaining decrements, discount_remaining_cycles decrements when > 0, next_renewal_at and next_ship_at advance by cycle_days, and a RENEWAL_REMINDER notice is scheduled for the following cycle when Plan.is_negative_option"
      - "increments Subscription.version by 1"
  - method: GET
    path: "/subscriptions/{id}/compliance-notices"
    description: "List a subscription's compliance notices ordered by created_at ASC (reverse reachability for ComplianceNotice.subscription_id)"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["notice_type?", "state?", "limit?", "offset?"]
    output: ComplianceNotice[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/compliance-notices"
    description: "Schedule an additional compliance notice for a subscription"
    roles: [BillingOperator, ComplianceOfficer]
    code: 201
    input: [notice_type, scheduled_for, "channel?", "body_ref?"]
    output: ComplianceNotice
    side_effects: ["sets renewal_cycle_index to the cycle_index of the upcoming renewal"]
  - method: POST
    path: "/compliance-notices/{id}/send"
    description: "Send a scheduled compliance notice"
    roles: [BillingOperator]
    code: 200
    input: []
    output: ComplianceNotice
    side_effects: ["sets state SENT and sent_at clock_now", "increments ComplianceNotice.version by 1"]

  - method: POST
    path: "/subscription-modifications/{id}/reverse"
    description: "Reverse an applied modification (creating a compensating row) or cancel a scheduled one"
    roles: [RetentionSpecialist, PlatformAdmin]
    code: 201
    input: ["reason_note?"]
    output: SubscriptionModification
    side_effects:
      - "APPLIED source: creates a compensating row with reverses_modification_id set, delta_price_cents inverted, and restores every prior_snapshot field on the Subscription"
      - "SCHEDULED source: sets the source row to CANCELLED and returns it, creating no compensating row"
      - "when the source row carries save_offer_grant_id: that SaveOfferGrant -> REVOKED, Subscriber.winback_suppressed_until cleared, save_offer_grants_365d_count recomputed"
      - "increments Subscription.version by 1"
  - method: GET
    path: "/subscription-modifications/{id}"
    description: "Read one modification including prior_snapshot and delta_price_cents"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: SubscriptionModification
    side_effects: []
  - method: GET
    path: "/subscription-modifications"
    description: "List modifications ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscription_id?", "save_offer_grant_id?", "reverses_modification_id?", "target_plan_id?", "state?", "mod_type?", "limit?", "offset?"]
    output: SubscriptionModification[]
    side_effects: []

  # ---- invoices and dunning ----
  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice including line_items and proration_factor"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscription_id?", "payment_method_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/dunning-attempts"
    description: "Schedule the next charge attempt on an invoice; attempt 1 is the initial charge"
    roles: [BillingOperator]
    code: 201
    input: []
    output: DunningAttempt
    side_effects:
      - "computes scheduled_at, backoff_days_applied, grace_clamped and is_final per calculations.dunning_retry_schedule"
      - "recomputes Subscription.grace_end_at (steps 1-3) and drives billing_state PAST_DUE -> GRACE when the card-updater extension applies"
      - "links previous_attempt_id to the prior attempt on the same invoice"
      - "increments Invoice.attempt_count and Invoice.version by 1"
  - method: GET
    path: "/dunning-attempts/{id}"
    description: "Read one dunning attempt"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: DunningAttempt
    side_effects: []
  - method: GET
    path: "/dunning-attempts"
    description: "List dunning attempts ordered by created_at ASC; previous_attempt_id filters the successor of one attempt (self-referential reverse reachability)"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["invoice_id?", "previous_attempt_id?", "outcome?", "limit?", "offset?"]
    output: DunningAttempt[]
    side_effects: []
  - method: POST
    path: "/_payments/simulate"
    description: "Test-driving endpoint: settle the invoice's PENDING dunning attempt with a synthetic gateway result, replacing the external payment webhook"
    roles: [PlatformAdmin, BillingOperator]
    code: 200
    input: [invoice_id, outcome, "decline_code?"]
    output: DunningAttempt
    side_effects:
      - "sets outcome, decline_code and attempted_at on the PENDING attempt"
      - "SUCCEEDED: Invoice -> PAID, Subscription.billing_state -> CURRENT, both Subscriber LTV fields recomputed"
      - "SOFT_DECLINE on a non-final attempt: Invoice -> FAILED, billing_state -> PAST_DUE, consecutive_failed_attempts incremented, first_failed_at set on the first decline of this invoice, and grace_end_at set to first_failed_at + BASE_GRACE_DAYS_BY_TENURE[bucket] with NO card-updater extension (the extension is applied only at the next attempt creation, step 2 of dunning_retry_schedule)"
      - "SOFT_DECLINE or HARD_DECLINE with decline_code EXPIRED_CARD sets the invoice's PaymentMethod.updater_status PENDING and updater_requested_at clock_now"
      - "HARD_DECLINE, or SOFT_DECLINE with is_final true: Invoice -> WRITTEN_OFF, billing_state -> DELINQUENT, lifecycle_state -> CANCELLED, Subscriber.churn_type INVOLUNTARY, lapsed_at and winback_suppressed_until set, projected_ltv_cents re-derived to equal realized_ltv_cents, non-terminal CancellationSessions -> ABANDONED"

  # ---- cancellation flow ----
  - method: POST
    path: "/cancellation-sessions"
    description: "Open a self-serve cancellation session"
    roles: [Subscriber, RetentionSpecialist]
    code: 201
    input: [subscription_id, entry_channel]
    output: CancellationSession
    side_effects: ["sets state STARTED, step_count 1, offers_presented_count 0, started_at clock_now"]
  - method: GET
    path: "/cancellation-sessions/{id}"
    description: "Read one cancellation session including the step budget counters"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: CancellationSession
    side_effects: []
  - method: GET
    path: "/cancellation-sessions"
    description: "List cancellation sessions ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscription_id?", "state?", "limit?", "offset?"]
    output: CancellationSession[]
    side_effects: []
  - method: POST
    path: "/cancellation-sessions/{id}/reason"
    description: "Capture or revise the cancellation reason; consumes one simple-cancellation step"
    roles: [Subscriber, RetentionSpecialist]
    code: 200
    input: [reason_code, "reason_detail?"]
    output: CancellationSession
    side_effects: ["sets reason_code and reason_detail, increments step_count, state -> REASON_CAPTURED"]
  - method: POST
    path: "/cancellation-sessions/{id}/present-offers"
    description: "Run the save-offer selector once and present the winning offer; consumes one simple-cancellation step"
    roles: [RetentionSpecialist]
    code: 201
    input: []
    output: SaveOfferGrant
    side_effects:
      - "creates exactly one SaveOfferGrant with both margin variants, margin_exception_required and margin_exception_state computed"
      - "sets session.presented_by_user_id = X-User-ID, offers_presented_count 1, step_count + 1, state -> OFFERS_PRESENTED"
      - "recomputes Subscriber.save_offer_grants_365d_count"
  - method: POST
    path: "/cancellation-sessions/{id}/complete"
    description: "Finish the cancellation; exempt from the step budget so cancellation is always reachable"
    roles: [Subscriber, RetentionSpecialist]
    code: 200
    input: [confirm]
    output: CancellationSession
    side_effects:
      - "state -> COMPLETED_CANCELLED, completed_at clock_now, step_count + 1"
      - "Subscription lifecycle_state -> PENDING_CANCEL with cancel_effective_at = next_renewal_at, Subscription.version + 1"
      - "every PRESENTED grant on the session -> EXPIRED, Subscriber.save_offer_grants_365d_count recomputed"
      - "creates ComplianceNotice(CANCELLATION_CONFIRMATION, SENT)"

  - method: GET
    path: "/save-offer-grants/{id}"
    description: "Read one grant including both margin variants and the exception axis"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: SaveOfferGrant
    side_effects: []
  - method: GET
    path: "/save-offer-grants"
    description: "List grants ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, BillingOperator, ComplianceOfficer, Subscriber]
    code: 200
    input: ["cancellation_session_id?", "save_offer_template_id?", "subscription_id?", "state?", "limit?", "offset?"]
    output: SaveOfferGrant[]
    side_effects: []
  - method: POST
    path: "/save-offer-grants/{id}/accept"
    description: "Accept a presented save offer"
    roles: [Subscriber]
    code: 200
    input: []
    output: SaveOfferGrant
    side_effects:
      - "state -> ACCEPTED, accepted_at clock_now"
      - "creates the SubscriptionModification implementing the offer in state APPLIED and mutates the Subscription (hop 1)"
      - "PLAN_DOWNGRADE additionally re-prices the subscription's OPEN invoice from the target plan (hop 2) and schedules a PRICE_CHANGE notice (hop 3)"
      - "session -> OFFER_ACCEPTED; Subscriber.winback_suppressed_until = clock_now + VOLUNTARY_SAVE_SUPPRESSION_DAYS"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/save-offer-grants/{id}/decline"
    description: "Decline a presented save offer; the session stays open so the subscriber can complete"
    roles: [Subscriber]
    code: 200
    input: ["decline_note?"]
    output: SaveOfferGrant
    side_effects: ["state -> DECLINED", "recomputes Subscriber.save_offer_grants_365d_count"]
  - method: POST
    path: "/save-offer-grants/{id}/margin-exception"
    description: "Decide a pending margin-floor exception; decision IN {APPROVE, REJECT} maps to margin_exception_state APPROVED or REJECTED, and the deciding user id may not equal presented_by_user_id"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "justification?"]
    output: SaveOfferGrant
    side_effects: ["margin_exception_state -> APPROVED or REJECTED, decided_by_user_id set", "increments SaveOfferGrant.version by 1"]

  # ---- win-back ----
  - method: POST
    path: "/winback-campaigns"
    description: "Create a win-back campaign in DRAFT"
    roles: [RetentionSpecialist]
    code: 201
    input: [code, name, min_days_since_lapse, max_days_since_lapse, offer_discount_pct, "target_channels?", "target_reason_codes?", "send_window_days?", "suppression_days?"]
    output: WinBackCampaign
    side_effects: []
  - method: POST
    path: "/winback-campaigns/{id}/launch"
    description: "Launch a draft campaign"
    roles: [RetentionSpecialist]
    code: 200
    input: []
    output: WinBackCampaign
    side_effects: ["state -> LAUNCHED", "increments WinBackCampaign.version by 1"]
  - method: GET
    path: "/winback-campaigns/{id}"
    description: "Read one campaign including its counters and version"
    roles: [PlatformAdmin, RetentionSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: WinBackCampaign
    side_effects: []
  - method: POST
    path: "/winback-campaigns/{id}/targets"
    description: "Add one lapsed subscriber to a launched campaign; suppression is evaluated at creation"
    roles: [RetentionSpecialist]
    code: 201
    input: [subscriber_id, expected_campaign_version]
    output: WinBackTarget
    side_effects:
      - "computes priority_score, projected_ltv_cents and days_since_lapse_at_target"
      - "sets state ELIGIBLE, or SUPPRESSED with the first matching reason from calculations.winback_suppression_reason"
      - "increments WinBackCampaign.targeted_count and WinBackCampaign.version by 1"
  - method: POST
    path: "/winback-targets/{id}/send"
    description: "Send the win-back offer to an eligible target"
    roles: [RetentionSpecialist]
    code: 200
    input: []
    output: WinBackTarget
    side_effects:
      - "state -> SENT, sent_at clock_now, expires_at clock_now + send_window_days"
      - "sets Subscriber.last_contacted_at, increments WinBackCampaign.sent_count"
  - method: POST
    path: "/winback-targets/{id}/reevaluate"
    description: "Re-run the target state machine against the clock and the suppression predicates: SENT -> EXPIRED, EXPIRED -> ELIGIBLE, SUPPRESSED -> ELIGIBLE, ELIGIBLE -> SUPPRESSED, and closes the campaign when every target is terminal"
    roles: [RetentionSpecialist]
    code: 200
    input: []
    output: WinBackTarget
    side_effects: ["applies exactly one target transition per call; when no declared transition's preconditions hold the call returns 200 with the target unchanged", "may set WinBackCampaign.state CLOSED"]
  - method: GET
    path: "/winback-targets/{id}"
    description: "Read one target including priority_score and suppression_reason"
    roles: [PlatformAdmin, RetentionSpecialist, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: WinBackTarget
    side_effects: []
  - method: GET
    path: "/winback-targets"
    description: "List targets ordered by created_at ASC"
    roles: [PlatformAdmin, RetentionSpecialist, ComplianceOfficer, Subscriber]
    code: 200
    input: ["winback_campaign_id?", "subscriber_id?", "state?", "limit?", "offset?"]
    output: WinBackTarget[]
    side_effects: []

  # ---- analytics ----
  - method: POST
    path: "/retention-cohort-snapshots"
    description: "Compute and persist a cohort retention snapshot"
    roles: [RetentionSpecialist, PlatformAdmin]
    code: 201
    input: [cohort_month, ltv_variant, "acquisition_channel?", "plan_code?", "tenure_bucket?"]
    output: RetentionCohortSnapshot
    side_effects: ["immutable artifact: no update or delete endpoint exists"]
  - method: GET
    path: "/retention-cohort-snapshots/{id}"
    description: "Read one cohort snapshot"
    roles: [PlatformAdmin, RetentionSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: RetentionCohortSnapshot
    side_effects: []

  # ---- logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent tenure, grace, window and expiry evaluations read the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not listed on the endpoint, or a Subscriber acting on another subscriber's resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed enum, out-of-range integer, malformed datetime, or cohort_month not matching YYYY-MM"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "subscriber_id in a path or body does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id, target_plan_id or downgrade_target_plan_id does not resolve"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription_id in a path or body does not resolve"
  - id: ERR_PAYMENT_METHOD_NOT_FOUND
    http: 404
    condition: "payment_method_id in a path or body does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id in a path or body does not resolve"
  - id: ERR_CANCELLATION_SESSION_NOT_FOUND
    http: 404
    condition: "cancellation session id in the path does not resolve"
  - id: ERR_SAVE_OFFER_GRANT_NOT_FOUND
    http: 404
    condition: "save offer grant id in the path does not resolve"
  - id: ERR_SAVE_OFFER_TEMPLATE_NOT_FOUND
    http: 404
    condition: "save offer template id in the path does not resolve"
  - id: ERR_MODIFICATION_NOT_FOUND
    http: 404
    condition: "subscription modification id in the path does not resolve"
  - id: ERR_COMPLIANCE_NOTICE_NOT_FOUND
    http: 404
    condition: "compliance notice id in the path does not resolve"
  - id: ERR_WINBACK_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "win-back campaign id in the path does not resolve"
  - id: ERR_WINBACK_TARGET_NOT_FOUND
    http: 404
    condition: "win-back target id in a path or body does not resolve"
  - id: ERR_DUNNING_ATTEMPT_NOT_FOUND
    http: 404
    condition: "dunning attempt id in the path does not resolve"
  - id: ERR_COHORT_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "retention cohort snapshot id in the path does not resolve"
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal Subscription.version"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal WinBackCampaign.version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ComplianceOfficer deciding a margin exception has the same X-User-ID as the grant's presented_by_user_id"
  - id: ERR_PLAN_RETIRED
    http: 422
    condition: "Subscription creation on a plan whose status is RETIRED"
  - id: ERR_SUBSCRIPTION_NOT_MODIFIABLE
    http: 409
    condition: "Subscription.lifecycle_state is PENDING_CANCEL or CANCELLED"
  - id: ERR_SESSION_ALREADY_OPEN
    http: 409
    condition: "Another cancellation session on the same subscription is still non-terminal"
  - id: ERR_SESSION_ALREADY_TERMINAL
    http: 409
    condition: "Cancellation session already in OFFER_ACCEPTED, COMPLETED_CANCELLED or ABANDONED"
  - id: ERR_REASON_NOT_CAPTURED
    http: 409
    condition: "Offer presentation or completion attempted while reason_code is null"
  - id: ERR_SIMPLE_CANCELLATION_VIOLATION
    http: 422
    condition: "A pre-completion step would exceed MAX_CANCELLATION_STEPS - 1, or a second offer round was attempted"
  - id: ERR_NO_ELIGIBLE_SAVE_OFFER
    http: 422
    condition: "The save-offer eligibility filter yields an empty candidate set"
  - id: ERR_TENURE_REQUIREMENT_NOT_MET
    http: 422
    condition: "Every template matching the session's reason_code was excluded solely by min_tenure_days"
  - id: ERR_OFFER_QUOTA_EXCEEDED
    http: 422
    condition: "The selected template's grants for this subscriber inside 365 days already reached max_per_subscriber_per_365d"
  - id: ERR_OFFER_ALREADY_RESOLVED
    http: 409
    condition: "Accept or decline attempted on a grant whose state is not PRESENTED"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Accept attempted at or after the grant's expires_at"
  - id: ERR_MARGIN_FLOOR_BREACH
    http: 422
    condition: "Accept attempted while margin_exception_required is true and margin_exception_state is not APPROVED"
  - id: ERR_MARGIN_EXCEPTION_NOT_REQUIRED
    http: 409
    condition: "Margin-exception decision attempted while margin_exception_state is not PENDING"
  - id: ERR_SUBSCRIPTION_PAST_DUE
    http: 409
    condition: "Accept of a DISCOUNT or PLAN_DOWNGRADE offer while billing_state is not CURRENT"
  - id: ERR_MODIFICATION_NOT_REVERSIBLE
    http: 409
    condition: "Reverse attempted on a modification whose state is REQUESTED, REVERSED or CANCELLED"
  - id: ERR_FREQUENCY_NOT_ALLOWED
    http: 422
    condition: "frequency_weeks is not a member of Plan.allowed_frequency_weeks"
  - id: ERR_ADDON_NOT_AVAILABLE
    http: 422
    condition: "addon_code is absent from the current plan's addon_catalog"
  - id: ERR_PAUSE_WINDOW_OVERLAP
    http: 409
    condition: "The requested half-open pause window overlaps an APPLIED or SCHEDULED pause window"
  - id: ERR_PAUSE_EXCEEDS_MAX_CYCLES
    http: 422
    condition: "The pause spans more cycles than Plan.max_pause_cycles"
  - id: ERR_SKIP_BUDGET_EXHAUSTED
    http: 422
    condition: "SKIP_SHIPMENT requested while term_shipments_remaining is 0"
  - id: ERR_DOWNGRADE_TARGET_MISSING
    http: 422
    condition: "PLAN_DOWNGRADE requested while the current plan's downgrade_target_plan_id is null or target_plan_id does not match it"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 422
    condition: "Subscription created on a negative-option plan with disclosure_acknowledged false"
  - id: ERR_RENEWAL_REMINDER_MISSING
    http: 422
    condition: "Renewal of a negative-option subscription without a RENEWAL_REMINDER notice SENT inside the legal window for that cycle"
  - id: ERR_NOTICE_WINDOW_INVALID
    http: 422
    condition: "A RENEWAL_REMINDER is scheduled for, or sent at, an instant outside the closed window [next_renewal_at - renewal_reminder_days_before, next_renewal_at - MIN_REMINDER_LEAD_DAYS]"
  - id: ERR_NOTICE_COOLDOWN_ACTIVE
    http: 409
    condition: "A second notice of the same type and renewal cycle is sent fewer than NOTICE_COOLDOWN_DAYS after the previous send"
  - id: ERR_NOTICE_ALREADY_SENT
    http: 409
    condition: "Send attempted on a notice whose state is SENT or MISSED"
  - id: ERR_RENEWAL_NOT_DUE
    http: 409
    condition: "Renewal run invoked before next_renewal_at"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "Charge attempt or settlement on an invoice whose status is PAID or WRITTEN_OFF"
  - id: ERR_NO_PENDING_ATTEMPT
    http: 409
    condition: "Settlement requested while the invoice has no attempt in outcome PENDING"
  - id: ERR_DUNNING_ATTEMPTS_EXHAUSTED
    http: 422
    condition: "A charge attempt would carry attempt_number above MAX_RETRY_ATTEMPTS"
  - id: ERR_GRACE_PERIOD_ENDED
    http: 409
    condition: "A retry attempt is requested after the recomputed grace_end_at has passed"
  - id: ERR_UPDATER_NOT_PENDING
    http: 409
    condition: "Card-updater result ingested for a method whose updater_status is not PENDING"
  - id: ERR_PAYMENT_METHOD_INACTIVE
    http: 409
    condition: "A subscription is created on, or a renewal invoice would be issued against, a PaymentMethod whose status is REPLACED or EXPIRED"
  - id: ERR_CAMPAIGN_NOT_LAUNCHED
    http: 409
    condition: "Targeting or sending on a campaign whose state is DRAFT or CLOSED"
  - id: ERR_SUBSCRIBER_NOT_LAPSED
    http: 422
    condition: "Targeting a subscriber with lapsed_at null or days_since_lapse outside the campaign's inclusive bounds"
  - id: ERR_WINBACK_SUPPRESSION_ACTIVE
    http: 422
    condition: "Targeting a subscriber whose winback_suppressed_until is later than the clock"
  - id: ERR_DUPLICATE_TARGET
    http: 409
    condition: "The campaign already holds a target for this subscriber"
  - id: ERR_TARGET_SUPPRESSED
    http: 409
    condition: "Send attempted on a target whose state is not ELIGIBLE"
  - id: ERR_CONTACT_CAP_EXCEEDED
    http: 422
    condition: "Send would exceed CONTACT_CAP contacts for this subscriber inside the trailing CONTACT_CAP_WINDOW_DAYS"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Subscriber
    description: "The end customer; owns subscriptions, payment methods and the cancellation flow"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /save-offer-grants/{id}/accept"
      - "POST /save-offer-grants/{id}/decline"
    shared_operations:
      - "POST /payment-methods"
      - "POST /subscriptions"
      - "PATCH /subscribers/{id}"
      - "POST /subscriptions/{id}/modifications"
      - "POST /cancellation-sessions"
      - "POST /cancellation-sessions/{id}/reason"
      - "POST /cancellation-sessions/{id}/complete"
      - "all GET reads scoped to own resources"
  - name: RetentionSpecialist
    description: "Retention operator; presents save offers, reverses modifications and runs win-back campaigns"
    identity: "opaque"
    exclusive_operations:
      - "POST /cancellation-sessions/{id}/present-offers"
      - "POST /winback-campaigns"
      - "POST /winback-campaigns/{id}/launch"
      - "POST /winback-campaigns/{id}/targets"
      - "POST /winback-targets/{id}/send"
      - "POST /winback-targets/{id}/reevaluate"
    shared_operations:
      - "POST /cancellation-sessions"
      - "POST /cancellation-sessions/{id}/reason"
      - "POST /cancellation-sessions/{id}/complete"
      - "POST /subscriptions/{id}/modifications"
      - "POST /subscription-modifications/{id}/reverse"
      - "POST /retention-cohort-snapshots"
      - "all GET reads"
    note: "A RetentionSpecialist user id recorded in presented_by_user_id can never decide that grant's margin exception."
  - name: BillingOperator
    description: "Collections operator; runs renewals, dunning attempts, card-updater ingestion and compliance sends"
    identity: "opaque"
    exclusive_operations:
      - "POST /subscriptions/{id}/renewals"
      - "POST /invoices/{id}/dunning-attempts"
      - "POST /payment-methods/{id}/updater-result"
      - "POST /compliance-notices/{id}/send"
    shared_operations:
      - "POST /subscriptions/{id}/compliance-notices"
      - "POST /_payments/simulate"
      - "all GET reads"
  - name: ComplianceOfficer
    description: "Regulatory reviewer; decides margin-floor exceptions and schedules statutory notices, but may never present an offer"
    identity: "opaque"
    exclusive_operations:
      - "POST /save-offer-grants/{id}/margin-exception"
    shared_operations:
      - "POST /subscriptions/{id}/compliance-notices"
      - "all GET reads"
  - name: PlatformAdmin
    description: "Configuration and test-harness operator"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /save-offer-templates"
      - "POST /subscribers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /subscribers/{id}"
      - "POST /payment-methods"
      - "POST /subscriptions"
      - "POST /subscription-modifications/{id}/reverse"
      - "POST /_payments/simulate"
      - "POST /retention-cohort-snapshots"
      - "all GET reads"

# =============================================================================
# Global constants referenced across tables
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MIN_REMINDER_LEAD_DAYS: 3
  NOTICE_COOLDOWN_DAYS: 3
  SESSION_TTL_HOURS: 48
  MAX_CANCELLATION_STEPS: 4
  INVOLUNTARY_SUPPRESSION_DAYS: 30
  VOLUNTARY_SAVE_SUPPRESSION_DAYS: 90
  CONTACT_CAP_WINDOW_DAYS: 30
  CONTACT_CAP: 1
  POST_OFFER_HORIZON_CYCLES: 3
  PRICE_CHANGE_NOTICE_LEAD_DAYS: 1
