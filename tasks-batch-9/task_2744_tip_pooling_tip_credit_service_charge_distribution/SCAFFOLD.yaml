# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication, authorization and schema -----------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an acting Employee or ShiftManager touches a shift, pay line, allocation or dispute outside their own identity or unit"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving user equals PayPeriod.computed_by_user_id, or the applying user equals BackWageCorrection.issued_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, enum value outside its domain, negative money or minutes, malformed timestamp, end before start, or pagination outside limit in [1,100] and offset >= 0"

  # --- existence ------------------------------------------------------------
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "location_id in the path or body names no stored Location"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee_id or raised_by_employee_id names no stored Employee"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id names no stored TipPoolPolicy"
  - id: ERR_PAY_PERIOD_NOT_FOUND
    http: 404
    condition: "pay_period_id names no stored PayPeriod"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shift_id names no stored Shift"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "pool_id names no stored ShiftTipPool"
  - id: ERR_PAY_LINE_NOT_FOUND
    http: 404
    condition: "pay_line_id names no stored PayLine"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id names no stored Dispute"
  - id: ERR_CORRECTION_NOT_FOUND
    http: 404
    condition: "correction_id or supersedes_correction_id names no stored BackWageCorrection"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "job_role_id, role_assignment_id, service_charge_id or allocation_id names no stored JobRole, EmployeeRoleAssignment, ServiceChargeEvent or PoolAllocation"

  # --- state preconditions --------------------------------------------------
  - id: ERR_SHIFT_NOT_OPEN
    http: 409
    condition: "close attempted on a Shift whose time_status is CLOSED or VOIDED"
  - id: ERR_SHIFT_NOT_CLOSED
    http: 409
    condition: "declare-tips attempted on a Shift whose time_status is OPEN or VOIDED"
  - id: ERR_SHIFT_ALREADY_POOLED
    http: 409
    condition: "declare-tips or void attempted on a Shift already folded into a pool that has not been reversed"
  - id: ERR_POLICY_NOT_DRAFT
    http: 409
    condition: "activate attempted on a TipPoolPolicy whose status is ACTIVE or SUPERSEDED"
  - id: ERR_PAY_PERIOD_NOT_OPEN
    http: 409
    condition: "a shift, declaration, pool or compute is attempted while the governing PayPeriod.status is COMPUTED or APPROVED"
  - id: ERR_PAY_PERIOD_NOT_COMPUTED
    http: 409
    condition: "approve attempted on a PayPeriod that is not COMPUTED, or reopen attempted on a PayPeriod that is still OPEN"
  - id: ERR_PENDING_CORRECTION_EXISTS
    http: 409
    condition: "reopen attempted while a PENDING BackWageCorrection still sits on a PayLine of the period"
  - id: ERR_POOL_ALREADY_DISTRIBUTED
    http: 409
    condition: "distribute attempted on a ShiftTipPool whose distribution_status is DISTRIBUTED or REVERSED"
  - id: ERR_POOL_REVERSED
    http: 409
    condition: "distribute or reverse attempted on a ShiftTipPool whose contribution_status is already REVERSED"
  - id: ERR_POOL_NOT_DISTRIBUTED
    http: 409
    condition: "compute attempted while an operating date with CLOSED shifts at a unit holding an ACTIVE policy has no DISTRIBUTED pool"
  - id: ERR_DISPUTE_NOT_OPEN
    http: 409
    condition: "adjudicate attempted on a Dispute that has already been adjudicated or closed"
  - id: ERR_DISPUTE_NOT_ADJUDICATED
    http: 409
    condition: "close attempted on a Dispute still OPEN, or on an award-bearing dispute whose correction has not been APPLIED"
  - id: ERR_CORRECTION_NOT_PENDING
    http: 409
    condition: "apply attempted on a BackWageCorrection whose status is APPLIED or VOIDED"
  - id: ERR_PAY_LINE_NOT_FINAL
    http: 409
    condition: "a dispute or correction targets a PayLine whose status is DRAFT or SUPERSEDED"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_LOCATION_VERSION
    http: 412
    condition: "expected_location_version does not equal the stored Location.version at activation time"
  - id: ERR_STALE_PAY_LINE_VERSION
    http: 412
    condition: "expected_pay_line_version does not equal the stored PayLine.version at correction time"

  # --- safety, compliance and regulatory -----------------------------------
  - id: ERR_MANAGER_POOL_PARTICIPATION
    http: 422
    condition: "a pool would be built solely from management shifts, which may neither contribute to nor receive from a mandatory pool"
  - id: ERR_POOL_TYPE_REQUIRES_NO_TIP_CREDIT
    http: 422
    condition: "an ALL_NON_MANAGEMENT policy is activated at a unit that claims a tip credit"
  - id: ERR_CC_FEE_DEDUCTION_PROHIBITED
    http: 422
    condition: "a policy with cc_fee_pass_through true is activated at a unit whose state forbids fee deduction from tips"
  - id: ERR_CASH_WAGE_BELOW_FLOOR
    http: 422
    condition: "a tip-credit unit sets cash_wage_cents below 213, or at or above its applicable minimum wage"
  - id: ERR_CC_FEE_CAP_REQUIRED
    http: 422
    condition: "cc_fee_cap_bps is missing or zero under CAPPED_BPS, or supplied under ACTUAL_ONLY or PROHIBITED"
  - id: ERR_SIDE_WORK_NOT_ELIGIBLE
    http: 422
    condition: "side_work_minutes greater than 0 recorded on a job role whose side_work_eligible is false"

  # --- referential integrity across aggregates -----------------------------
  - id: ERR_NO_ACTIVE_ROLE_ASSIGNMENT
    http: 422
    condition: "no EmployeeRoleAssignment for that employee and job role covers the shift's business_date"
  - id: ERR_EMPLOYEE_LOCATION_MISMATCH
    http: 422
    condition: "the shift, employee and pay period do not all belong to the same unit, or a dispute is raised by someone other than the pay line's employee"
  - id: ERR_NO_ACTIVE_POOL_POLICY
    http: 422
    condition: "a pool is requested at a unit with no ACTIVE TipPoolPolicy to pin"
  - id: ERR_UNDECLARED_SHIFT_IN_POOL
    http: 422
    condition: "a CLOSED shift on the pool's operating date has declaration_status UNDECLARED"
  - id: ERR_UNDECLARED_SHIFT_IN_PERIOD
    http: 422
    condition: "a CLOSED shift of the period has declaration_status UNDECLARED at compute time"
  - id: ERR_SERVICE_CHARGE_UNALLOCATABLE
    http: 422
    condition: "a WAGES-treated service charge inside the period has no CLOSED shift on its business_date to allocate against"
  - id: ERR_SUPERSEDE_TARGET_MISMATCH
    http: 422
    condition: "supersedes_correction_id names a correction that is not PENDING or not on the same pay line, or is omitted while such a correction exists"

  # --- temporal ------------------------------------------------------------
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "the new shift's half-open interval intersects another non-VOIDED shift of the same employee"
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "the new period's inclusive date interval intersects an existing period of the same unit"
  - id: ERR_ASSIGNMENT_OVERLAP
    http: 409
    condition: "the new assignment's interval intersects an existing assignment of the same employee and job role, treating a null effective_to as unbounded"
  - id: ERR_SHIFT_FUTURE_DATE
    http: 422
    condition: "business_date is after the logical clock date, or end_at is after the logical clock instant"
  - id: ERR_BUSINESS_DATE_OUT_OF_PERIOD
    http: 422
    condition: "business_date falls outside the named period's date interval, or the shift's clock times fall outside business_date and the day after it"
  - id: ERR_PAY_PERIOD_LENGTH
    http: 422
    condition: "end_date is not exactly start_date plus six days"
  - id: ERR_EMPLOYEE_SEPARATED
    http: 422
    condition: "a shift's business_date, or a new role assignment's effective_from, is after Employee.separation_date"

  # --- constraint satisfaction and uniqueness ------------------------------
  - id: ERR_SIDE_WORK_EXCEEDS_SHIFT
    http: 422
    condition: "side_work_minutes exceeds the shift's whole minutes, or max_continuous_side_work_minutes exceeds side_work_minutes"
  - id: ERR_POOL_DATE_DUPLICATE
    http: 409
    condition: "a CONTRIBUTED pool already exists for that unit and operating date"
  - id: ERR_DUPLICATE_DISPUTE_CATEGORY
    http: 409
    condition: "an unclosed dispute of the same category already exists on that pay line"
  - id: ERR_PARTIAL_AMOUNT_INVALID
    http: 422
    condition: "awarded_cents is missing, zero, or at or above claimed_amount_cents under PARTIALLY_UPHELD, or supplied under UPHELD or DENIED"
  - id: ERR_DUPLICATE_JOB_ROLE_CODE
    http: 409
    condition: "the job role code already exists"

  # --- fiscal --------------------------------------------------------------
  - id: ERR_DECLARED_CHARGED_TIPS_EXCEED_CHARGED_SALES
    http: 422
    condition: "declared_charged_tips_cents exceeds the shift's charged_sales_cents"
  - id: ERR_CHARGED_SALES_EXCEED_GROSS_SALES
    http: 422
    condition: "charged_sales_cents exceeds gross_sales_cents on a shift, or a service charge amount_cents is not strictly positive"
  - id: ERR_EMPTY_POOL_NO_CONTRIBUTIONS
    http: 422
    condition: "the pool would hold no money at all, at creation or at distribution"
  - id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http: 422
    condition: "the pool holds money but no shift on that date is eligible to receive from it"
  - id: ERR_CORRECTION_EXCEEDS_CLAIM
    http: 422
    condition: "amount_cents exceeds the linked dispute's adjudicated_amount_cents, or is not strictly positive"
  - id: ERR_CORRECTION_EXCEEDS_OBLIGATION
    http: 422
    condition: "applying the correction would push the line's APPLIED corrections above its minimum_wage_obligation_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PayrollAdmin
    description: "Chain configuration operator: registers units, job roles, employees, role assignments and draft policies, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /locations"
      - "POST /job-roles"
      - "POST /employees"
      - "POST /role-assignments"
      - "POST /tip-pool-policies"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /pay-periods"
      - "every GET endpoint"

  - name: PayrollPreparer
    description: "Unit payroll operator: records shifts and service charges, builds and distributes pools, and computes pay periods"
    identity: opaque
    exclusive_operations:
      - "POST /pay-periods/{pay_period_id}/compute"
      - "POST /shifts/{shift_id}/void"
      - "POST /service-charges/{service_charge_id}/void"
      - "POST /shift-tip-pools"
      - "POST /shift-tip-pools/{pool_id}/distribute"
    shared_operations:
      - "POST /pay-periods"
      - "POST /shifts"
      - "POST /shifts/{shift_id}/close"
      - "POST /service-charges"
      - "POST /back-wage-corrections/{correction_id}/apply"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Wage-and-hour compliance authority: activates policies, approves and reopens periods, reverses pools, adjudicates disputes and issues back-wage corrections"
    identity: opaque
    exclusive_operations:
      - "POST /tip-pool-policies/{policy_id}/activate"
      - "POST /pay-periods/{pay_period_id}/approve"
      - "POST /pay-periods/{pay_period_id}/reopen"
      - "POST /shift-tip-pools/{pool_id}/reverse"
      - "POST /disputes/{dispute_id}/adjudicate"
      - "POST /disputes/{dispute_id}/close"
      - "POST /back-wage-corrections"
    shared_operations:
      - "POST /back-wage-corrections/{correction_id}/apply"
      - "every GET endpoint"

  - name: ShiftManager
    description: "Front-of-house supervisor, acting as the Employee row named by X-User-ID and confined to that employee's unit; records and closes shifts, records service charges and may declare tips on behalf of staff"
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /shifts"
      - "POST /shifts/{shift_id}/close"
      - "POST /shifts/{shift_id}/declare-tips"
      - "POST /service-charges"
      - "every GET endpoint, restricted to the manager's own unit"

  - name: Employee
    description: "Tipped or non-tipped worker, acting as the Employee row named by X-User-ID; declares tips on their own shifts and raises disputes on their own pay lines"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /disputes"
    shared_operations:
      - "POST /shifts/{shift_id}/declare-tips"
      - "every GET endpoint, restricted to the employee's own records"
