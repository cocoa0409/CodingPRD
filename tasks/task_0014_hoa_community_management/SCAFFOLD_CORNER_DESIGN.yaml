        grounds: [roles.ACCMember, roles.BoardPresident, "endpoints[POST /hoa/liens/{id}/initiate-foreclosure]"]
        distinguishing_aspect: "POST /hoa/liens/{id}/initiate-foreclosure is exclusive to BoardPresident; an ACCMember attempt → ERR_UNAUTHORIZED."
        test_recipe:
          setup:
