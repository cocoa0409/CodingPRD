  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_withdraw_conserves_precinct_assigned_count
        grounds:
          - state_machines.VoterRegistration.PENDING_to_ACTIVE
          - state_machines.VoterRegistration.ACTIVE_to_WITHDRAWN
          - entities.Precinct.fields.assigned_count
        distinguishing_aspect: |
          Conserved quantity: Precinct.assigned_count. Approve increments it by 1 and the compensating
          withdraw decrements it by 1, so after the forward+compensating pair assigned_count returns to
          its pre-approval value (0). Distinct conserved quantity from the machine-backup linkage.
        test_recipe:
          setup:
            - "A precinct with assigned_count=0; one PENDING citizen-eligible registration matching it."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /registrations/${r1_id}/transition"
              payload: { target_status: "WITHDRAWN" }
              as: ElectionOfficial
              as_user_id: "off-1"
          assert:
            - "Precinct.${p_id}.assigned_count == 0"
            - "Precinct.${p_id}.capacity_posture == OPEN"

      - name: fail_then_repair_conserves_backup_idle_state
        grounds:
          - state_machines.VotingMachine.OPERATIONAL_to_FAILED
          - state_machines.VotingMachine.FAILED_to_OPERATIONAL
          - entities.VotingMachine.fields.backup_for_machine_id
        distinguishing_aspect: |
          Conserved quantity: the count of idle BACKUP machines (backup_for_machine_id == null) in a
          precinct. Reporting a PRIMARY failure activates one backup (idle count 1 -> 0); the compensating
          repair clears that backup's backup_for_machine_id (idle count 0 -> 1), restoring the original
          idle-backup count. Different conserved quantity than precinct assigned_count.
        test_recipe:
          setup:
            - "A precinct with one OPERATIONAL PRIMARY (M-1) and one idle OPERATIONAL BACKUP (M-2, backup_for_machine_id null)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-11-03T12:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /voting-machines"
              payload: { precinct_id: "${p_id}", serial: "M-1", role: "PRIMARY", capacity: 30 }
              as: ElectionAdmin
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /voting-machines"
              payload: { precinct_id: "${p_id}", serial: "M-2", role: "BACKUP", capacity: 25 }
              as: ElectionAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /machine-failures"
              payload: { machine_id: "${m1_id}", expected_machine_version: "${m1_v}" }
              as: PollWorker
              as_user_id: "pw-1"
          trigger:
            - call: "POST /voting-machines/${m1_id}/transition"
              payload: { target_status: "OPERATIONAL" }
              as: PollWorker
              as_user_id: "pw-1"
          assert:
            - "VotingMachine.${m1_id}.status == OPERATIONAL"
            - "VotingMachine.${m2_id}.backup_for_machine_id == null"
