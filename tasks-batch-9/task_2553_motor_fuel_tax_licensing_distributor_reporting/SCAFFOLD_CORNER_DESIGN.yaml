              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Cascade Distribution Inc", fein: "41-5900002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-5900", name: "Cascade River Terminal", state_code: "MN" }
