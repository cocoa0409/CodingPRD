            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "HIGH", description: "leak" }
              as: Consultant
              captures: { an1_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/warranty-claims"
              payload: { anomaly_id: "${an1_id}", manufacturer_name: "ACME", claimed_amount_cents: 100000 }
              as: Consultant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ANOMALY_NOT_VERIFIED (409)"
            - "no WarrantyClaim persisted for anomaly ${an1_id} (GET .../warranty-claims?anomaly_id=... returns total_count == 0)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: chamber_slot_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.ChamberSlot.fields.start_date
          - entities.ChamberSlot.fields.end_date
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on chamber slots,
          resource = chamber_code. Overlap iff new.start < existing.end AND
          existing.start < new.end; touching at a boundary day is disjoint.
          [2026-09-01, 2026-09-05) vs [2026-09-04, 2026-09-06) conflicts, but
          [2026-09-05, 2026-09-08) does not (asserted in the sibling boundary
          instance; here the inner containment case is pinned: a slot wholly
          inside another conflicts).
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; slot CHAMBER-C [2026-09-10, 2026-09-20) RESERVED"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E15", client_name: "C15", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-C", start_date: "2026-09-10", end_date: "2026-09-20", daily_rate_cents: 90000 }
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-C", start_date: "2026-09-12", end_date: "2026-09-15", daily_rate_cents: 90000 }
              as: Consultant
              captures: { err: $.data.error_id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-D", start_date: "2026-09-12", end_date: "2026-09-15", daily_rate_cents: 90000 }
              as: Consultant
              captures: { other_id: $.data.id }
          assert:
            - "contained slot on CHAMBER-C rejected with ERR_WINDOW_OVERLAP"
            - "same dates on a DIFFERENT chamber (CHAMBER-D) accepted (resource key is chamber_code, not the engagement)"
      - name: maintenance_visit_closed_interval_with_buffer
        grounds:
          - validations[priority=10]
          - entities.MaintenanceVisit.fields.buffer_days
        distinguishing_aspect: |
          Interval semantics = CLOSED [start, end] expanded by buffer_days on
          both sides, resource = the engagement itself (visits serialize per
          engagement, not per chamber). Unlike chamber slots, touching
          endpoints DO conflict: existing [2026-10-01, 2026-10-05] with
          buffer 2 occupies through 2026-10-07; a new visit starting 2026-10-07
          conflicts, while 2026-10-08 is accepted.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; visit V1 SCHEDULED with closed window [2026-10-01, 2026-10-05] and buffer_days 2"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E16", client_name: "C16", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/maintenance-visits"
              payload: { visit_label: "AUTUMN-2026", window_start_date: "2026-10-01", window_end_date: "2026-10-05", buffer_days: 2 }
              as: Consultant
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/maintenance-visits"
              payload: { visit_label: "TOO-CLOSE", window_start_date: "2026-10-07", window_end_date: "2026-10-08", buffer_days: 0 }
              as: Consultant
              captures: { err: $.data.error_id }
            - call: "POST /engagements/${eng_id}/maintenance-visits"
              payload: { visit_label: "FAR-ENOUGH", window_start_date: "2026-10-08", window_end_date: "2026-10-09", buffer_days: 0 }
              as: Consultant
              captures: { v2_id: $.data.id }
          assert:
            - "visit starting 2026-10-07 rejected with ERR_WINDOW_OVERLAP (inside buffer-expanded occupancy [2026-09-29, 2026-10-07])"
            - "visit starting 2026-10-08 accepted — buffer expansion is [end+1, end+buffer] inclusive on the right edge, so end+buffer+1 is the first free day"
            - "MaintenanceVisit.${v2_id}.visit_status == SCHEDULED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: supersede_restores_recognized_fees
        grounds:
          - state_machines.RemediationPlan.ISSUED_to_SUPERSEDED
          - calculations.remediation_cost_estimate
          - concurrency_rules[remediation-plan-create-stale-engagement]
        distinguishing_aspect: |
          Conserved quantity = Engagement.recognized_fees_cents. Forward action:
          plan P1 issued (+estimated_cost_cents). Compensating action: creating
          P2 with supersedes_plan_id == P1 flips P1 to SUPERSEDED and reverses
          exactly P1.estimated_cost_cents. Invariant: recognized_fees after
          issue-then-supersede == recognized_fees before issue.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS OPEN; anomaly AN1 (MEDIUM) VERIFIED; plan P1 created+issued (1 spec section; ESTIMATE = 1500000 * 1.2 = 1800000)"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E17", client_name: "C17", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W17", assembly_type: "MASONRY", design_u_factor: 1.3, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "MOISTURE_TRAP", severity: "MEDIUM", description: "wet" }
              as: Consultant
              captures: { an1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an1_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans"
              payload: { anomaly_ids: ["${an1_id}"], spec_sections: ["07 01 00"], expected_engagement_version: "${eng_v}" }
              as: Consultant
              captures: { p1_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/remediation-plans/${p1_id}/issue"
              payload: { expected_engagement_version: "${eng_v2}" }
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { rec_after_issue: $.data.recognized_fees_cents, eng_v3: $.data.version }
          trigger:
            - call: "POST /engagements/${eng_id}/remediation-plans"
              payload: { anomaly_ids: ["${an1_id}"], spec_sections: ["07 01 00", "07 02 00"], supersedes_plan_id: "${p1_id}", expected_engagement_version: "${eng_v3}" }
              as: Consultant
              captures: { p2_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { rec_after_supersede: $.data.recognized_fees_cents }
          assert:
            - "rec_after_issue == 1800000"
            - "RemediationPlan.${p1_id}.plan_status == SUPERSEDED"
            - "RemediationPlan.${p2_id}.plan_status == DRAFT"
            - "rec_after_supersede == 0 (1800000 - 1800000; conserved quantity restored exactly)"
      - name: mockup_fail_retest_cycle_conserves_slot_occupancy
        grounds:
          - state_machines.MockUp.TESTING_to_FAILED
          - state_machines.MockUp.REMEDIATED_to_TESTING
          - state_machines.ChamberSlot.RESERVED_to_CONSUMED
          - calculations.risk_score_update
          - calculations.mockup_testing_fee
        distinguishing_aspect: |
          Conserved quantity = chamber-slot occupancy: exactly one ChamberSlot
          ends CONSUMED per TESTING entry, and the fail -> remediate -> retest
          cycle MUST consume a fresh RESERVED slot (the prior slot stays
          CONSUMED, never released or reused). Invariant after the full cycle:
          count(ChamberSlot with status CONSUMED) == number of TESTING entries
          == 2, attempt_number == 2, fee accrued twice (200000 + 400000 since
          the retest fee multiplies by attempt_number 2), risk_score == 75
          (exactly one -25 FAIL delta; PASS and remediation add nothing).
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS OPEN; assembly required 1.5; slot S1 CHAMBER-E [2026-09-01, 2026-09-03) rate 100000; slot S2 CHAMBER-E [2026-09-10, 2026-09-12) rate 100000; mock-up M (specimen_count 1) bound to S1, driven to TESTING at clock 2026-09-02, recorded FAIL, marked REMEDIATED"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E18", client_name: "C18", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W18", assembly_type: "CURTAIN_WALL", design_u_factor: 1.6, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-E", start_date: "2026-09-01", end_date: "2026-09-03", daily_rate_cents: 100000 }
              as: Consultant
              captures: { s1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-E", start_date: "2026-09-10", end_date: "2026-09-12", daily_rate_cents: 100000 }
              as: Consultant
              captures: { s2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups"
              payload: { assembly_id: "${asm_id}", chamber_slot_id: "${s1_id}", specimen_count: 1 }
              as: Consultant
              captures: { m1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/begin-construction"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/declare-ready"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: Principal
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/begin-testing"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/record-result"
              payload: { measured_leakage_lps_m2: 2.0 }
              as: Consultant
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/mark-remediated"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/begin-testing"
              payload: { new_chamber_slot_id: "${s2_id}" }
              as: Consultant
              captures: { attempt: $.data.attempt_number }
            - call: "POST /engagements/${eng_id}/mock-ups/${m1_id}/record-result"
              payload: { measured_leakage_lps_m2: 1.0 }
              as: Consultant
              captures: { fee2: $.data.testing_fee_cents }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { risk: $.data.risk_score, recognized: $.data.recognized_fees_cents }
          assert:
            - "MockUp.${m1_id}.attempt_number == 2 (incremented on REMEDIATED -> TESTING re-entry)"
            - "ChamberSlot.${s1_id}.status == CONSUMED and ChamberSlot.${s2_id}.status == CONSUMED (occupancy conserved: 2 entries, 2 consumed slots, none released)"
            - "MockUp.${m1_id}.testing_fee_cents == 400000 on the second entry (2 days * 100000 * attempt_number 2)"
            - "Engagement.${eng_id}.recognized_fees_cents == 600000 (200000 first entry + 400000 second entry)"
            - "Engagement.${eng_id}.risk_score == 75 (exactly one -25 FAIL delta; PASS and mark-remediated add nothing)"
            - "MockUp.${m1_id}.status == PASSED"
