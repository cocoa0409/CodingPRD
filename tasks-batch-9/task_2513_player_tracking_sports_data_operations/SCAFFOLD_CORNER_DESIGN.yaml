          assert:
            - "call 1: HTTP 404 error_id \"ERR_VENUE_NOT_FOUND\""
            - "call 2: HTTP 404 error_id \"ERR_CLUB_NOT_FOUND\""
            - "call 3: HTTP 404 error_id \"ERR_LICENSEE_NOT_FOUND\" (the holder reference is resolved before the holder_type consistency rule at priority 77)"
            - "call 4: HTTP 404 error_id \"ERR_RIGHTS_WINDOW_NOT_FOUND\" (not ERR_GAME_NOT_COLLECTING, although the game is still SCHEDULED)"
            - "GET /games returns pagination.total_count 1 and GET /games/${g_id}/rights-windows returns 0 - nothing was persisted by the four rejected calls"

  - section: rbac
    instances:
      - name: header_gate_returns_unauthenticated_before_the_role_check
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - roles
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 owns three failure shapes that must all answer 401 ERR_UNAUTHENTICATED and never 403:
          a missing X-User-Role, a missing X-User-ID, and a syntactically fine but undeclared role name.
          Only when both headers are present and the role is one of the six declared roles does priority 2
          get to speak, which the final accepted call demonstrates.
        test_recipe:
          setup:
            - "empty database; the six declared roles are LeagueDataOps, CalibrationEngineer, Statistician, QualityReviewer, ClubDataOfficer, Licensee"
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: "(X-User-Role header omitted)"
              as_user_id: "ops-01"
              captures: { e_norole: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "(X-User-ID header omitted)"
              captures: { e_nouser: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: "SystemAdmin"
              as_user_id: "root-01"
              captures: { e_unknown: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
          assert:
            - "calls 1-3: HTTP 401 with error_id \"ERR_UNAUTHENTICATED\" - never ERR_ROLE_NOT_PERMITTED and never ERR_INVALID_REQUEST"
            - "call 3 specifically: an unrecognised role string is an authentication failure, not an authorisation failure"
            - "call 4: HTTP 201 with data.data_posture \"UNCERTIFIED\" and every installation counter 0"
            - "GET /venues/${v_id} confirms exactly one venue exists (the three rejected calls persisted nothing)"

      - name: endpoints_reject_every_role_outside_their_declared_list_as_forbidden
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=2]
          - roles
          - endpoints
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          A sweep across the six mutually exclusive operational boundaries: ops cannot record a calibration
          run, the engineer cannot certify the rig they calibrated, the reviewer cannot author tags, the
          reviewer cannot certify a game, ops cannot open a feed session in a licensee's name, and a
          licensee cannot drive the clock. Each is a 403 ERR_ROLE_NOT_PERMITTED raised before any state or
          fiscal rule is consulted, even where the target state would also be wrong.
        test_recipe:
          setup:
            - "Harbor Arena with a VALIDATED rig RIG-A (PASS run by eng-01); two clubs; one SCHEDULED game"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_home}", full_name: "Ada Ruiz", jersey_number: 9 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p1: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id, gv0: $.data.version }
          trigger:
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_run: $.data.error_id }
            - call: "POST /installations/${i_id}/certify"
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { e_certify: $.data.error_id }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "SHOT", clock_ms: 60000, confidence: 0.9, expected_game_version: "${gv0}" }
              as: QualityReviewer
              as_user_id: "qr-01"
              captures: { e_tag: $.data.error_id }
            - call: "POST /games/${g_id}/certify"
              as: QualityReviewer
              as_user_id: "qr-01"
              captures: { e_gcert: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: Licensee
              as_user_id: "lic-01"
              captures: { e_clock: $.data.error_id }
          assert:
            - "all five calls: HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\""
            - "call 2 proves the role gate precedes the segregation-of-duties gate: eng-01 is refused for being an engineer, not for being the calibrating engineer"
            - "call 4 proves the role gate precedes the certify ladder: the game is SCHEDULED with no accepted tags, yet the answer is 403, not ERR_GAME_NOT_COLLECTED"
            - "GET /installations/${i_id} still shows status \"VALIDATED\", calibration_run_count 1"
            - "GET /games/${g_id} still shows collection_status \"SCHEDULED\", certification_status \"PENDING\", total_tag_count 0, version 1; the logical clock is still 2026-08-01T12:00:00Z"

      - name: club_officer_cannot_touch_another_clubs_consent_records
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=25]
          - roles[ClubDataOfficer]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          The ClubDataOfficer role is entity-backed, so authorisation is per row: the Summit SC officer holds
          the right role for POST consent-records and for withdraw and is still refused with
          ERR_NOT_RESOURCE_OWNER on a Harbor FC player, both before the record exists and after it is
          ACTIVE. The Harbor FC officer performs the same two calls successfully, which pins the difference
          to X-User-ID rather than to the payload.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor FC and Summit SC exist; Ada Ruiz is registered to Harbor FC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_home}", full_name: "Ada Ruiz", jersey_number: 9 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /players/${p1}/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2026A", effective_from_utc: "2026-08-01T00:00:00Z", expires_at_utc: "2026-12-31T00:00:00Z" }
              as: ClubDataOfficer
              as_user_id: "${c_away}"
              captures: { e_file: $.data.error_id }
            - call: "POST /players/${p1}/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2026A", effective_from_utc: "2026-08-01T00:00:00Z", expires_at_utc: "2026-12-31T00:00:00Z" }
              as: ClubDataOfficer
              as_user_id: "${c_home}"
              captures: { cr1: $.data.id }
            - call: "POST /consent-records/${cr1}/ratify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { st_active: $.data.status }
            - call: "POST /consent-records/${cr1}/withdraw"
              as: ClubDataOfficer
              as_user_id: "${c_away}"
              captures: { e_withdraw: $.data.error_id }
            - call: "POST /consent-records/${cr1}/withdraw"
              as: ClubDataOfficer
              as_user_id: "${c_home}"
              captures: { st_withdrawn: $.data.status }
          assert:
            - "call 1: HTTP 403 error_id \"ERR_NOT_RESOURCE_OWNER\" (correct role, wrong club) and no record is created"
            - "call 2: HTTP 201 with data.status \"PENDING\" and data.submitted_by_club_id == ${c_home}"
            - "call 3: HTTP 200 with data.status \"ACTIVE\" and data.ratified_by_user_id \"ops-01\"; GET /players/${p1} shows biometric_release_state \"GRANTED\" and active_consent_record_id == ${cr1}"
            - "call 4: HTTP 403 error_id \"ERR_NOT_RESOURCE_OWNER\" - the record stays ACTIVE with terminated_at_utc null"
            - "call 5: HTTP 200 with data.status \"WITHDRAWN\" and data.terminated_at_utc \"2026-08-01T12:00:00Z\"; GET /players/${p1} shows biometric_release_state \"WITHDRAWN\" and active_consent_record_id null"

      - name: licensee_cannot_read_another_licensees_session_or_ledger
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=25]
          - roles[Licensee]
          - entities.FeedSession.fields.licensee_id
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Peer isolation between two entity-backed Licensee principals: licensee B is refused on both
          licensee A's session read and A's own licensee row with ERR_NOT_RESOURCE_OWNER, while
          LeagueDataOps - an opaque role with no ownership dimension - reads both freely. This separates
          "role permitted" from "row owned" on the same endpoints.
        test_recipe:
          setup:
            - "Harbor Arena CERTIFIED; game LIVE; ACTIVE window 18:00-21:00, max_latency_ms 5000, allowed_scopes [POSITIONAL]"
            - "licensee A (GOLD) owns one ACTIVE session; licensee B (BRONZE) owns nothing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
