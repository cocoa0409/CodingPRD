          - errors[ERR_INVOICE_ALREADY_PAID]
          - state_machines.Invoice.ISSUED_to_VOID
        distinguishing_aspect: "An ISSUED invoice with net_due_cents 1800000 rejects a 1800001-cent payment with 409 ERR_OVERPAYMENT; once paid in full (payment_status PAID) the void is refused with 409 ERR_INVOICE_ALREADY_PAID, coupling the two parallel dimensions."
        test_recipe:
          setup:
            - "An executed PERCENT_OF_CONSTRUCTION contract (base_fee 10000000, weights 2000/2000/4000/2000) with SD COMPLETED (earned 2000000) and no expenses."
            - "One ISSUED invoice with fee_billed_cents 2000000, gross 2000000, retainage_bp 1000, retainage 200000, net_due 1800000, payment_status UNPAID."
