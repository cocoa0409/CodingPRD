        grounds:
          - validations.priority_37_ERR_SITE_SCORE_BELOW_MINIMUM
          - calculations.de_novo_site_score
        distinguishing_aspect: "The site score is computed and stored at creation but only enforced at approval: Northgate scores 44.5 -> 45, half a point of rounding below SITE_SCORE_MIN 55, so creation succeeds with HTTP 201 and the APPROVE decision is the call that returns 422."
        test_recipe:
          setup:
            - "Northgate (population 100000, 28 competitors, income 6000000, deposit market 400000000000, growth 150 bps) has a SITE_IDENTIFIED plan; the market is SATURATED (density 28) so the over-branched rule at priority 38 is not in play."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Northgate", region_code: "MD-03", population: 100000, median_household_income_cents: 6000000, deposit_market_total_cents: 400000000000, competitor_branch_count: 28, household_growth_pct_bps: 150, digital_penetration_bps: 4800 }
