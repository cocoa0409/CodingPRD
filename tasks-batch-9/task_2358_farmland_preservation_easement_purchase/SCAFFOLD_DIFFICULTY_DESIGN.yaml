          - calculations.violation_severity_and_cure_deadline
          - endpoints[POST /stewardship-sweeps]
        distinguishing_aspect: |
          PARALLEL shape: Easement carries three orthogonal status dimensions. During setup the
          compliance dimension moves three times (COMPLIANT -> VIOLATION_OPEN ->
          CURE_PLAN_ACCEPTED-driven -> VIOLATION_CURED) while the stewardship dimension stays
          MONITORING_CURRENT and the recording dimension stays RECORDED; the trigger then
          advances ONLY the stewardship dimension past next_monitoring_due_on 2027-12-15. The
          end state (RECORDED, MONITORING_DUE, VIOLATION_CURED) is a combination that no
          single-dimension state machine can represent, and a compound/derived reading would
          wrongly collapse a cured violation plus an overdue visit into one status.
