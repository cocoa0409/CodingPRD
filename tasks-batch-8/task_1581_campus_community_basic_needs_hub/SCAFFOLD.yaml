# =============================================================================
# SCAFFOLD.yaml — Campus & Community Basic Needs Hub (task_1581)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Campus & Community Basic Needs Hub (college basic needs center): student/resident
  eligibility & confidential intake, pantry inventory & visit frequency limits,
  benefits screening (SNAP/childcare/housing) & application assistance, emergency
  grant application & rapid disbursement, housing insecurity referral & short-term
  shelter coordination, partner agency network & warm handoff, usage data & outcome
  tracking, stigma reduction & outreach programming

domain_name: campus-basic-needs-hub
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency      # Client.version on assessment verify; PantryItem.version on config PATCH; GrantFund.version on approve
    - cascading_side_effects      # disburse -> fund counters -> fund posture flip -> queued-grant promotion; exit -> stays/referrals/registrations/visits unwind
    - rate_threshold_triggers     # 168h rolling visit limit, weekly points allotment, referral SLA 120h, agency weekly capacity + CRISIS overflow
    - selector_policy             # counselor auto-assignment (eligibility filter + ranking + tie-break + empty-pool error)
    - derived_field_reconciliation # Client points/lifetime totals, PantryItem stock + restock_flag, GrantFund committed/disbursed/remaining, OutreachEvent registered_count
  entity_topology: hybrid         # flat collections with FK references + action endpoints under resource paths
  state_machine_shape: cyclic     # RETURNED->DRAFT->SUBMITTED, MORE_INFO_REQUESTED->SUBMITTED, OPEN<->EXHAUSTED, OPEN<->FULL, ACTIVE<->SUSPENDED, EXPIRED->SENT, CANCELLED->REGISTERED
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties   # grant reviewer != creator/verifier; disburser != reviewer; pantry staff walled off from confidential intake
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: alias_name, type: string, source: input, description: "Confidential pseudonym chosen by the client; never a legal name" }
      - { name: contact_channel, type: enum, source: input, description: "EMAIL | SMS | PHONE | NONE" }
      - { name: population_type, type: enum, source: input, description: "ENROLLED_STUDENT | COMMUNITY_RESIDENT | FACULTY_STAFF" }
      - { name: enrolled_credits, type: integer, source: input, default: 0, description: "Credits this term; 0 allowed; must be >= 6 when population_type == ENROLLED_STUDENT" }
      - { name: status, type: enum, source: system, description: "INTAKE_PENDING | ACTIVE | SUSPENDED | EXITED" }
      - { name: risk_tier, type: enum, source: computed, description: "CRISIS | ELEVATED | STABLE — derived from the client's VERIFIED assessment and shelter-stay history; null until first verification" }
      - { name: household_size_effective, type: integer, source: computed, description: "household_size of the client's currently VERIFIED IntakeAssessment; null when none" }
      - { name: pantry_points_allotment, type: integer, source: computed, description: "Weekly points budget for the current week window: min(30 + 10*(household_size_effective - 1), 60); 0 when no VERIFIED assessment" }
      - { name: pantry_points_spent_settled, type: integer, source: computed, description: "Sum of points_spent over this client's COMPLETED PantryVisits whose week_start equals the current week window" }
      - { name: pantry_points_spent_reserved, type: integer, source: computed, description: "pantry_points_spent_settled + provisional_points of this client's CHECKED_IN visit (at most one)" }
      - { name: pantry_week_start, type: datetime, source: system, description: "Monday 00:00:00.000Z of the current logical week; window key for points aggregation" }
      - { name: lifetime_grant_cents, type: integer, source: computed, description: "Sum of approved_cents over this client's DISBURSED EmergencyGrantApplications (all funds, all time)" }
      - { name: shelter_no_show_count_90d, type: integer, source: computed, description: "Count of this client's ShelterStays flipped to NO_SHOW with no_show_marked_at within the trailing 2160h (90 days) of logical now" }
      - { name: shelter_restricted, type: boolean, source: computed, description: "true iff shelter_no_show_count_90d >= 2; blocks new ShelterStay creation" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: email, type: string, source: input, description: "Staff email; unique across StaffMember" , constraints: "unique"}
      - { name: staff_role, type: enum, source: input, description: "INTAKE_COORDINATOR | PANTRY_STAFF | BENEFITS_COUNSELOR | GRANT_REVIEWER | SHELTER_COORDINATOR — must match the X-User-Role claim on every staff-backed call" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: active_case_load, type: integer, source: computed, description: "Count of BenefitsScreenings assigned to this counselor with status IN {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED}" }

  - name: IntakeAssessment
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: household_size, type: integer, source: input, description: "People in household including client; >= 1" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Gross monthly household income in cents; >= 0" }
      - { name: earned_income_cents, type: integer, source: input, default: 0, description: "Earned (wage) portion of monthly income in cents; 0 <= earned <= monthly_income_cents" }
      - { name: shelter_cost_cents, type: integer, source: input, default: 0, description: "Monthly rent/mortgage + utility costs in cents; >= 0" }
      - { name: housing_status, type: enum, source: input, description: "STABLE | COST_BURDENED | UNSTABLE | HOMELESS" }
      - { name: dependents_under_18, type: integer, source: input, description: "Count of dependents under 18; >= 0 and < household_size" }
      - { name: receives_snap, type: boolean, source: input, description: "Currently receiving SNAP" }
      - { name: receives_childcare_subsidy, type: boolean, source: input, description: "Currently receiving childcare subsidy" }
      - { name: food_insecurity_score, type: integer, source: input, description: "USDA 6-item screener raw score; 0..6" }
      - { name: consent_confidential, type: boolean, source: input, description: "Informed consent to confidential handling; must be true to submit" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | VERIFIED | SUPERSEDED | EXPIRED | DISCARDED" }
      - { name: income_ratio, type: number, source: computed, description: "monthly_income_cents / POVERTY_MONTHLY_CENTS[household_size] at submit time, 4 decimal places round_half_up" }
      - { name: eligibility_band, type: enum, source: computed, description: "FULL | PARTIAL | INELIGIBLE — computed at submit time per calculation eligibility_band" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical time of DRAFT->SUBMITTED; null until submitted" }
      - { name: verified_at, type: datetime, source: system, description: "Logical time of SUBMITTED->VERIFIED; null until verified" }
      - { name: verified_by, type: string, source: system, description: "FK -> StaffMember.id; coordinator who verified; null until verified" }
      - { name: expires_at, type: datetime, source: system, description: "verified_at + 365 days; expiry boundary is exclusive (EXPIRED when now >= expires_at)" }
      - { name: return_notes, type: string, source: system, description: "Coordinator notes recorded on RETURN; null unless returned" }

  - name: PantryItem
    parent: null
    common_fields: true
    fields:
      - { name: item_name, type: string, source: input, description: "Display name; unique across non-DISCONTINUED items", constraints: "unique among ACTIVE items" }
      - { name: category, type: enum, source: input, description: "PERISHABLE | SHELF_STABLE | HYGIENE | BABY_CARE" }
      - { name: point_cost, type: integer, source: input, description: "Points charged per unit; >= 1" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Units on shelf; initialized from creation input, thereafter system-maintained by restock/checkout/void" }
      - { name: reorder_threshold, type: integer, source: input, description: "Restock flag level; >= 0" }
      - { name: per_visit_limit, type: integer, source: input, description: "Max cumulative units of this item per PantryVisit; >= 1" }
      - { name: restock_flag, type: boolean, source: computed, description: "true iff quantity_on_hand <= reorder_threshold; recomputed on every stock mutation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: PantryVisit
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; visiting client" }
      - { name: visit_date, type: datetime, source: system, description: "Logical timestamp of check-in" }
      - { name: week_start, type: datetime, source: system, description: "Monday 00:00:00.000Z of visit_date; points/frequency window key" }
      - { name: status, type: enum, source: system, description: "CHECKED_IN | COMPLETED | VOIDED" }
      - { name: provisional_points, type: integer, source: computed, description: "Sum of points_charged over current line items while CHECKED_IN" }
      - { name: points_spent, type: integer, source: computed, description: "Final points at checkout; equals provisional_points at completion; frozen thereafter (0 while CHECKED_IN, reset to 0 on VOID from COMPLETED)" }

  - name: VisitLineItem
    parent: PantryVisit
    common_fields: false
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> PantryVisit.id; owning visit" }
      - { name: item_id, type: string, source: system, description: "FK -> PantryItem.id; item taken" }
      - { name: quantity, type: integer, source: input, description: "Units added in this line; >= 1" }
      - { name: points_charged, type: integer, source: system, description: "quantity * PantryItem.point_cost pinned at line-add time; later price changes do not retro-edit" }

  - name: BenefitsScreening
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; screened client" }
      - { name: program, type: enum, source: input, description: "SNAP | CHILDCARE | HOUSING" }
      - { name: status, type: enum, source: system, description: "STARTED | SCREENED | APPLICATION_ASSISTED | SUBMITTED | DETERMINED | WITHDRAWN" }
      - { name: counselor_id, type: string, source: system, description: "FK -> StaffMember.id; auto-assigned BENEFITS_COUNSELOR per counselor_assignment selector" }
      - { name: score, type: integer, source: computed, description: "0..100 weighted score from the client's VERIFIED assessment per screening_score; null until scored" }
      - { name: result_band, type: enum, source: computed, description: "LIKELY_ELIGIBLE (>=70) | POSSIBLY_ELIGIBLE (40..69) | NOT_ELIGIBLE (<40); null until scored" }
      - { name: snap_estimate_cents, type: integer, source: computed, description: "Estimated monthly SNAP benefit per snap_benefit_estimate; computed at score time when program == SNAP, else null" }
      - { name: determination_outcome, type: enum, source: input, description: "APPROVED_BY_AGENCY | DENIED_BY_AGENCY — supplied on determine; null until DETERMINED" }
      - { name: determined_at, type: datetime, source: system, description: "Logical time of determination; null until DETERMINED" }

  - name: EmergencyGrantApplication
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; applicant" }
      - { name: fund_id, type: string, source: system, description: "FK -> GrantFund.id; fund the application draws on" }
      - { name: category, type: enum, source: input, description: "RENT | UTILITY | FOOD | MEDICAL | TRANSPORT | CHILDCARE" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested; >= 100 and <= 150000 (PER_AWARD_CAP_CENTS)" }
      - { name: hardship_statement, type: string, source: input, description: "Free-text statement" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (Client.id for self-service, StaffMember.id when coordinator-assisted); segregation-of-duties input" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QUEUED | UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | DISBURSED | EXPIRED | WITHDRAWN" }
      - { name: reviewed_by, type: string, source: system, description: "FK -> StaffMember.id; reviewing GrantReviewer; null until UNDER_REVIEW" }
      - { name: info_request_notes, type: string, source: system, description: "Reviewer notes recorded on MORE_INFO_REQUESTED; null otherwise" }
      - { name: decision_rationale, type: string, source: system, description: "Reviewer rationale on DENIED; null otherwise" }
      - { name: approved_cents, type: integer, source: computed, description: "Award sized at approval per grant_award_sizing; 0 until APPROVED" }
      - { name: approved_at, type: datetime, source: system, description: "Logical time of approval; disbursement window = approved_at + 72h (inclusive); null until APPROVED" }
      - { name: disbursed_at, type: datetime, source: system, description: "Logical time of disbursement; null until DISBURSED" }

  - name: GrantFund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Fund name; unique per fiscal_year", constraints: "unique with fiscal_year" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label, e.g. 2026" }
      - { name: allocated_cents, type: integer, source: input, description: "Total pool; > 0" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of approved_cents over applications in APPROVED status against this fund" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of approved_cents over applications in DISBURSED status against this fund" }
      - { name: remaining_committed_basis, type: integer, source: computed, description: "allocated_cents - committed_cents - disbursed_cents; CONSERVATIVE reading used by grant_award_sizing" }
      - { name: remaining_cash_basis, type: integer, source: computed, description: "allocated_cents - disbursed_cents; OPTIMISTIC reading reported for cash planning" }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED — EXHAUSTED auto when remaining_committed_basis == 0 and committed_cents > 0; reopens automatically" }

  - name: ShelterBed
    parent: null
    common_fields: true
    fields:
      - { name: shelter_site, type: string, source: input, description: "Site name" }
      - { name: bed_label, type: string, source: input, description: "Bed label; unique within shelter_site", constraints: "unique per site" }
      - { name: features, type: array, source: input, default: [], description: "Subset of [ADA_ACCESSIBLE, FAMILY_UNIT, PET_FRIENDLY]; PET_FRIENDLY beds impose a 1-day sanitation buffer after each stay" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE" }

  - name: ShelterStay
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; placed client" }
      - { name: bed_id, type: string, source: system, description: "FK -> ShelterBed.id; reserved bed" }
      - { name: check_in_date, type: string, source: input, description: "ISO date YYYY-MM-DD of first night; must be within [today, today + 13 days] by logical clock" }
      - { name: planned_nights, type: integer, source: input, description: "1..14 (MAX_STAY_NIGHTS)" }
      - { name: check_out_exclusive, type: string, source: computed, description: "ISO date check_in_date + planned_nights; the bed turns over on this date" }
      - { name: buffer_until_exclusive, type: string, source: computed, description: "check_out_exclusive + 1 day when the bed has PET_FRIENDLY, else equal to check_out_exclusive" }
      - { name: actual_check_out_date, type: string, source: system, description: "ISO date of check-out; null until CHECKED_OUT" }
      - { name: no_show_marked_at, type: datetime, source: system, description: "Logical timestamp when sweep marked NO_SHOW; null otherwise" }
      - { name: status, type: enum, source: system, description: "RESERVED | OCCUPIED | CHECKED_OUT | NO_SHOW | CANCELLED" }

  - name: PartnerAgency
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Agency name; unique", constraints: "unique" }
      - { name: service_categories, type: array, source: input, description: "Non-empty subset of [SNAP_APPLICATION, CHILDCARE_SUBSIDY, HOUSING_PLACEMENT, LEGAL_AID, MENTAL_HEALTH]" }
      - { name: weekly_capacity, type: integer, source: input, description: "Max concurrent active referrals; >= 1" }
      - { name: accepts_walk_ins, type: boolean, source: input, default: false, description: "Whether the agency accepts unscheduled warm-handoff walk-ins" }
      - { name: active_referral_count, type: integer, source: computed, description: "Count of Referrals to this agency with status IN {SENT, ACKNOWLEDGED, APPOINTMENT_BOOKED}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED" }

  - name: Referral
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; referred client" }
      - { name: agency_id, type: string, source: system, description: "FK -> PartnerAgency.id; receiving agency" }
      - { name: service_category, type: enum, source: input, description: "SNAP_APPLICATION | CHILDCARE_SUBSIDY | HOUSING_PLACEMENT | LEGAL_AID | MENTAL_HEALTH; must be in agency.service_categories" }
      - { name: warm_handoff, type: boolean, source: input, default: false, description: "Staff-assisted introduction; requires agency.accepts_walk_ins == true" }
      - { name: notes, type: string, source: input, description: "Handoff notes" }
      - { name: status, type: enum, source: system, description: "INITIATED | SENT | ACKNOWLEDGED | APPOINTMENT_BOOKED | SERVICE_RECEIVED | DECLINED | WITHDRAWN | EXPIRED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical time of latest INITIATED->SENT or EXPIRED->SENT; null until first sent" }
      - { name: ack_due_at, type: datetime, source: system, description: "sent_at + 120h; sweep expires when now > ack_due_at (strictly greater; exactly at due remains SENT)" }
      - { name: decline_reason, type: string, source: system, description: "Agency reason on DECLINED; null otherwise" }

  - name: OutreachEvent
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: event_date, type: datetime, source: input, description: "Logical start time of the event" }
      - { name: capacity, type: integer, source: input, description: "Max count of registrations holding status REGISTERED at any moment; >= 1" }
      - { name: stigma_theme, type: enum, source: input, description: "NORMALIZATION | PEER_LED | FACULTY_TRAINING | RESOURCE_FAIR" }
      - { name: anonymous_attendance_allowed, type: boolean, source: input, default: true, description: "Whether attendees may register under a display alias only" }
      - { name: registered_count, type: integer, source: computed, description: "Count of EventRegistrations with status == REGISTERED" }
      - { name: attended_count, type: integer, source: computed, description: "Count of EventRegistrations with status == ATTENDED" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | FULL | COMPLETED | CANCELLED" }

  - name: EventRegistration
    parent: OutreachEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> OutreachEvent.id; registered event" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; registering client" }
      - { name: display_alias, type: string, source: input, description: "Alias shown on the attendee list (stigma reduction); defaults to client alias_name" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CANCELLED | ATTENDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: INTAKE_PENDING
    terminal_states: [EXITED]
    transitions:
      - from: INTAKE_PENDING
        to: ACTIVE
        trigger: "system (automatic when the client's first IntakeAssessment is VERIFIED)"
        actor: system
        preconditions:
          - "The assessment being verified is the client's only VERIFIED assessment"
        side_effects:
          - "client.household_size_effective, risk_tier, pantry_points_allotment populated from the VERIFIED assessment"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/suspend"
        actor: HubAdmin
        preconditions:
          - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "Client's CHECKED_IN PantryVisit (if any) is auto-voided: provisional lines discarded, frequency slot freed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/reinstate"
        actor: HubAdmin
        preconditions:
          - "Client must be SUSPENDED (ERR_CLIENT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: EXITED
        trigger: "POST /clients/{id}/exit"
        actor: IntakeCoordinator | HubAdmin
        preconditions:
          - "Client must be ACTIVE or SUSPENDED (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "All future ShelterStays (status RESERVED) -> CANCELLED, freeing bed intervals"
          - "All Referrals in INITIATED or SENT -> WITHDRAWN; SENT withdrawals decrement agency.active_referral_count"
          - "All EventRegistrations in REGISTERED for events with event_date > now -> CANCELLED; each cancellation recomputes its event's registered_count and may flip FULL -> OPEN"
          - "CHECKED_IN PantryVisit (if any) -> VOIDED"
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /clients/{id}/exit"
        actor: IntakeCoordinator | HubAdmin
        preconditions:
          - "Client must be ACTIVE or SUSPENDED (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "Same unwind side effects as ACTIVE -> EXITED"

  - entity: IntakeAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, DISCARDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clients/{cid}/assessments/{aid}/submit"
        actor: Client (self) | IntakeCoordinator
        preconditions:
          - "Assessment must be DRAFT (ERR_ASSESSMENT_NOT_EDITABLE)"
          - "consent_confidential must be true (ERR_CONSENT_REQUIRED)"
          - "household_size >= 1, monthly_income_cents >= 0, 0 <= earned_income_cents <= monthly_income_cents, 0 <= dependents_under_18 < household_size, food_insecurity_score in 0..6 (ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_at set to logical now"
          - "income_ratio and eligibility_band computed per calculation eligibility_band and frozen on the assessment"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /clients/{cid}/assessments/{aid}/verify"
        actor: IntakeCoordinator
        preconditions:
          - "Assessment must be SUBMITTED (ERR_ASSESSMENT_NOT_EDITABLE)"
          - "Client must be INTAKE_PENDING or ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "OCC: expected_client_version must equal Client.version (ERR_STALE_VERSION)"
        side_effects:
          - "verified_at = now; verified_by = acting coordinator StaffMember.id; expires_at = now + 365 days"
          - "Any other VERIFIED assessment of this client -> SUPERSEDED"
          - "Client fields recomputed from this assessment: household_size_effective, risk_tier (calculation risk_tier), pantry_points_allotment (calculation pantry_points)"
          - "Client INTAKE_PENDING -> ACTIVE when this is the client's first VERIFIED assessment"
          - "increments Client.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /clients/{cid}/assessments/{aid}/return"
        actor: IntakeCoordinator
        preconditions:
          - "Assessment must be SUBMITTED (ERR_ASSESSMENT_NOT_EDITABLE)"
        side_effects:
          - "return_notes recorded"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /clients/{cid}/assessments/{aid}/revise"
        actor: Client (self) | IntakeCoordinator
        preconditions:
          - "Assessment must be RETURNED (ERR_ASSESSMENT_NOT_EDITABLE)"
        side_effects:
          - "Optional payload fields overwrite the corresponding assessment fields (in-place revision loop)"
          - "income_ratio and eligibility_band cleared until next submit"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system (automatic when another assessment of the same client is VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (sweep: logical now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Client derived fields recomputed: household_size_effective -> null, pantry_points_allotment -> 0, risk_tier -> null when no other VERIFIED assessment remains"
      - from: DRAFT
        to: DISCARDED
        trigger: "system (automatic on POST /clients/{id}/exit)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PantryItem
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /pantry-items/{iid}/discontinue"
        actor: HubAdmin
        preconditions:
          - "Item must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Item excluded from new line-item adds (ERR_ITEM_NOT_AVAILABLE); existing CHECKED_IN lines remain chargeable at checkout"

  - entity: PantryVisit
    initial_state: CHECKED_IN
    terminal_states: [VOIDED]
    transitions:
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /pantry-visits/{vid}/checkout"
        actor: PantryStaff
        preconditions:
          - "Visit must be CHECKED_IN (ERR_VISIT_NOT_OPEN)"
          - "Visit must have at least one line item (ERR_EMPTY_CHECKOUT)"
          - "For every line: referenced PantryItem.quantity_on_hand >= line quantity (ERR_ITEM_NOT_AVAILABLE)"
          - "Reserved-basis points check: client.pantry_points_spent_settled + visit.provisional_points <= client.pantry_points_allotment (ERR_POINTS_BALANCE_EXCEEDED)"
          - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "points_spent = provisional_points; provisional_points cleared to 0"
          - "Each line decrements its PantryItem.quantity_on_hand by line quantity; each decrement recomputes that item's restock_flag (sets it when quantity_on_hand <= reorder_threshold)"
          - "Client pantry_points_spent_settled and pantry_points_spent_reserved recomputed (calculation pantry_points)"
      - from: CHECKED_IN
        to: VOIDED
        trigger: "POST /pantry-visits/{vid}/void or system (client suspend/exit)"
        actor: PantryStaff | HubAdmin | system
        preconditions:
          - "Visit must be CHECKED_IN or COMPLETED (ERR_VISIT_NOT_OPEN)"
        side_effects:
          - "Provisional lines discarded; no stock or points movement; frequency slot freed"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /pantry-visits/{vid}/void"
        actor: PantryStaff | HubAdmin
        preconditions:
          - "Visit must be CHECKED_IN or COMPLETED (ERR_VISIT_NOT_OPEN)"
        side_effects:
          - "Each line restores its PantryItem.quantity_on_hand by line quantity; each restore recomputes that item's restock_flag (clears it when quantity_on_hand > reorder_threshold)"
          - "Client pantry_points_spent_settled recomputed downward; points_spent reset to 0"
          - "Frequency slot freed (VOIDED visits do not count toward the 168h limit)"

  - entity: BenefitsScreening
    initial_state: STARTED
    terminal_states: [DETERMINED, WITHDRAWN]
    transitions:
      - from: STARTED
        to: SCREENED
        trigger: "POST /screenings/{sid}/score"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be STARTED (ERR_SCREENING_NOT_ACTIONABLE)"
          - "Acting counselor must equal screening.counselor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Client must have a VERIFIED assessment (ERR_ASSESSMENT_REQUIRED)"
        side_effects:
          - "score and result_band computed per calculation screening_score from the client's VERIFIED assessment"
          - "snap_estimate_cents computed per calculation snap_benefit_estimate when program == SNAP"
      - from: SCREENED
        to: APPLICATION_ASSISTED
        trigger: "POST /screenings/{sid}/assist"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be SCREENED (ERR_SCREENING_NOT_ACTIONABLE)"
          - "Acting counselor must equal screening.counselor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "result_band must be LIKELY_ELIGIBLE or POSSIBLY_ELIGIBLE (ERR_SCREENING_NOT_ACTIONABLE)"
        side_effects: []
      - from: APPLICATION_ASSISTED
        to: SUBMITTED
        trigger: "POST /screenings/{sid}/submit-application"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be APPLICATION_ASSISTED (ERR_SCREENING_NOT_ACTIONABLE)"
          - "Acting counselor must equal screening.counselor_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: SUBMITTED
        to: DETERMINED
        trigger: "POST /screenings/{sid}/determine"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be SUBMITTED (ERR_SCREENING_NOT_ACTIONABLE)"
          - "Acting counselor must equal screening.counselor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "outcome must be APPROVED_BY_AGENCY or DENIED_BY_AGENCY (ERR_INVALID_REQUEST)"
        side_effects:
          - "determined_at set; feeds usage-summary conversion metrics"
      - from: STARTED
        to: WITHDRAWN
        trigger: "POST /screenings/{sid}/withdraw"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be in {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED} (ERR_SCREENING_NOT_ACTIONABLE)"
        side_effects: []
      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /screenings/{sid}/withdraw"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be in {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED} (ERR_SCREENING_NOT_ACTIONABLE)"
        side_effects: []
      - from: APPLICATION_ASSISTED
        to: WITHDRAWN
        trigger: "POST /screenings/{sid}/withdraw"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be in {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED} (ERR_SCREENING_NOT_ACTIONABLE)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /screenings/{sid}/withdraw"
        actor: BenefitsCounselor (assigned counselor only)
        preconditions:
          - "Screening must be in {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED} (ERR_SCREENING_NOT_ACTIONABLE)"
        side_effects: []

  - entity: EmergencyGrantApplication
    initial_state: DRAFT
    terminal_states: [DENIED, DISBURSED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grant-applications/{gid}/submit"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Application must be DRAFT (ERR_GRANT_NOT_REVIEWABLE)"
          - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "Client must have a VERIFIED assessment (ERR_ASSESSMENT_REQUIRED)"
          - "Fund must be OPEN (EXHAUSTED routes to QUEUED instead; CLOSED -> ERR_FUND_CLOSED)"
        side_effects: []
      - from: DRAFT
        to: QUEUED
        trigger: "POST /grant-applications/{gid}/submit (when fund.status == EXHAUSTED)"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Same as DRAFT -> SUBMITTED except fund must be EXHAUSTED"
        side_effects:
          - "Application parks until the fund reopens; promotion per fund_reopen_promotion"
      - from: QUEUED
        to: SUBMITTED
        trigger: "system (automatic on fund reopen per fund_reopen_promotion)"
        actor: system
        preconditions:
          - "Fund transitioned EXHAUSTED -> OPEN within the same atomic event"
          - "This application is the QUEUED application on this fund with the earliest created_at"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /grant-applications/{gid}/begin-review"
        actor: GrantReviewer
        preconditions:
          - "Application must be SUBMITTED (ERR_GRANT_NOT_REVIEWABLE)"
          - "Segregation of duties: acting reviewer StaffMember.id != application.created_by_user_id (ERR_SOD_CONFLICT) — reachable when a GrantReviewer assisted the intake (grant creation is open to GrantReviewer)"
        side_effects:
          - "reviewed_by set to acting reviewer"
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /grant-applications/{gid}/request-info"
        actor: GrantReviewer (must equal reviewed_by)
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_GRANT_NOT_REVIEWABLE)"
          - "Acting reviewer must equal reviewed_by (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "info_request_notes recorded"
      - from: MORE_INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /grant-applications/{gid}/submit"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Application must be MORE_INFO_REQUESTED (ERR_GRANT_NOT_REVIEWABLE)"
          - "Client must be ACTIVE with a VERIFIED assessment (ERR_CLIENT_NOT_ACTIVE / ERR_ASSESSMENT_REQUIRED)"
        side_effects:
          - "reviewed_by cleared; application re-enters the review pool (resubmission cycle)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /grant-applications/{gid}/approve"
        actor: GrantReviewer (must equal reviewed_by)
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_GRANT_NOT_REVIEWABLE)"
          - "Acting reviewer must equal reviewed_by (ERR_FORBIDDEN_OWNERSHIP)"
          - "OCC: expected_fund_version must equal GrantFund.version (ERR_STALE_VERSION)"
          - "Approved amount per grant_award_sizing must be > 0 (ERR_AWARD_CAP_EXHAUSTED)"
        side_effects:
          - "approved_cents computed per grant_award_sizing; approved_at = now"
          - "GrantFund.committed_cents += approved_cents; remaining_committed_basis and remaining_cash_basis recomputed"
          - "increments GrantFund.version by 1"
          - "GrantFund OPEN -> EXHAUSTED when remaining_committed_basis reaches 0"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /grant-applications/{gid}/deny"
        actor: GrantReviewer (must equal reviewed_by)
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_GRANT_NOT_REVIEWABLE)"
          - "Acting reviewer must equal reviewed_by (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "decision_rationale recorded"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /grant-applications/{gid}/disburse"
        actor: HubAdmin
        preconditions:
          - "Application must be APPROVED (ERR_GRANT_NOT_REVIEWABLE)"
          - "Two-person rule: acting HubAdmin X-User-ID != reviewed_by (ERR_SOD_CONFLICT)"
          - "Logical now <= approved_at + 72h inclusive (ERR_DISBURSE_WINDOW_LAPSED)"
        side_effects:
          - "disbursed_at = now"
          - "GrantFund.committed_cents -= approved_cents; GrantFund.disbursed_cents += approved_cents; remaining bases recomputed; increments GrantFund.version by 1"
          - "Client.lifetime_grant_cents += approved_cents"
          - "GrantFund EXHAUSTED -> OPEN when remaining_committed_basis becomes > 0; that flip itself triggers fund_reopen_promotion (oldest QUEUED application -> SUBMITTED)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (sweep: logical now > approved_at + 72h)"
        actor: system
        preconditions: []
        side_effects:
          - "GrantFund.committed_cents -= approved_cents; remaining bases recomputed; increments GrantFund.version by 1"
          - "GrantFund EXHAUSTED -> OPEN when remaining_committed_basis becomes > 0; that flip itself triggers fund_reopen_promotion"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /grant-applications/{gid}/withdraw"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, QUEUED} (ERR_GRANT_NOT_REVIEWABLE)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /grant-applications/{gid}/withdraw"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, QUEUED} (ERR_GRANT_NOT_REVIEWABLE)"
        side_effects: []
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /grant-applications/{gid}/withdraw"
        actor: Client (self, creator only) | IntakeCoordinator
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, QUEUED} (ERR_GRANT_NOT_REVIEWABLE)"
        side_effects: []

  - entity: GrantFund
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic when remaining_committed_basis reaches 0 via an approval; requires committed_cents > 0)"
        actor: system
        preconditions:
          - "remaining_committed_basis == 0 and committed_cents > 0"
        side_effects:
          - "New submissions against this fund park as QUEUED instead of SUBMITTED"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (automatic when remaining_committed_basis becomes > 0 via disbursement or approval expiry)"
        actor: system
        preconditions:
          - "remaining_committed_basis > 0"
        side_effects:
          - "fund_reopen_promotion: the QUEUED application on this fund with the earliest created_at -> SUBMITTED (at most one per reopen event)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /grant-funds/{fid}/close"
        actor: HubAdmin
        preconditions:
          - "No applications against this fund in {SUBMITTED, QUEUED, UNDER_REVIEW, MORE_INFO_REQUESTED, APPROVED} (ERR_FUND_HAS_OPEN_APPLICATIONS)"
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /grant-funds/{fid}/close"
        actor: HubAdmin
        preconditions:
          - "No applications against this fund in {SUBMITTED, QUEUED, UNDER_REVIEW, MORE_INFO_REQUESTED, APPROVED} (ERR_FUND_HAS_OPEN_APPLICATIONS)"
        side_effects: []

  - entity: ShelterStay
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /shelter-stays/{sid}/check-in"
        actor: ShelterCoordinator
        preconditions:
          - "Stay must be RESERVED (ERR_STAY_NOT_ACTIONABLE)"
          - "Logical today's date must be within [check_in_date, check_in_date + 1 day] (ERR_STAY_WINDOW_INVALID)"
          - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects: []
      - from: OCCUPIED
        to: CHECKED_OUT
        trigger: "POST /shelter-stays/{sid}/check-out"
        actor: ShelterCoordinator
        preconditions:
          - "Stay must be OCCUPIED (ERR_STAY_NOT_ACTIONABLE)"
        side_effects:
          - "actual_check_out_date = logical today's date"
          - "Client.risk_tier recomputed per risk_tier calculation"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /shelter-stays/{sid}/cancel or system (client exit)"
        actor: ShelterCoordinator | HubAdmin | system
        preconditions:
          - "Stay must be RESERVED (ERR_STAY_NOT_ACTIONABLE)"
        side_effects:
          - "Bed interval [check_in_date, buffer_until_exclusive) freed"
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (sweep: logical today's date > check_in_date + 1 day and still RESERVED)"
        actor: system
        preconditions: []
        side_effects:
          - "no_show_marked_at = now"
          - "Client.shelter_no_show_count_90d recomputed; when it reaches 2, client.shelter_restricted becomes true, which blocks subsequent ShelterStay creation (ERR_SHELTER_RESTRICTED)"

  - entity: Referral
    initial_state: INITIATED
    terminal_states: [SERVICE_RECEIVED, DECLINED, WITHDRAWN]
    transitions:
      - from: INITIATED
        to: SENT
        trigger: "POST /referrals/{rid}/send"
        actor: IntakeCoordinator | BenefitsCounselor | ShelterCoordinator
        preconditions:
          - "Referral must be INITIATED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Agency must be ACTIVE (ERR_AGENCY_NOT_ACTIVE)"
        side_effects:
          - "sent_at = now; ack_due_at = now + 120h"
          - "PartnerAgency.active_referral_count += 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /referrals/{rid}/acknowledge"
        actor: PartnerAgencyRep (own agency only)
        preconditions:
          - "Referral must be SENT (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Acting X-User-ID must equal referral.agency_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: APPOINTMENT_BOOKED
        trigger: "POST /referrals/{rid}/book-appointment"
        actor: PartnerAgencyRep (own agency only)
        preconditions:
          - "Referral must be ACKNOWLEDGED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Acting X-User-ID must equal referral.agency_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "appointment_date must be >= logical today (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: APPOINTMENT_BOOKED
        to: SERVICE_RECEIVED
        trigger: "POST /referrals/{rid}/record-service"
        actor: PartnerAgencyRep (own agency only)
        preconditions:
          - "Referral must be APPOINTMENT_BOOKED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Acting X-User-ID must equal referral.agency_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "PartnerAgency.active_referral_count -= 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /referrals/{rid}/decline"
        actor: PartnerAgencyRep (own agency only)
        preconditions:
          - "Referral must be SENT or ACKNOWLEDGED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Acting X-User-ID must equal referral.agency_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "decline_reason recorded"
          - "PartnerAgency.active_referral_count -= 1"
      - from: ACKNOWLEDGED
        to: DECLINED
        trigger: "POST /referrals/{rid}/decline"
        actor: PartnerAgencyRep (own agency only)
        preconditions:
          - "Referral must be SENT or ACKNOWLEDGED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Acting X-User-ID must equal referral.agency_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "decline_reason recorded"
          - "PartnerAgency.active_referral_count -= 1"
      - from: SENT
        to: EXPIRED
        trigger: "system (sweep: logical now > ack_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "PartnerAgency.active_referral_count -= 1 (that decrement itself frees agency capacity for subsequent referral creation)"
      - from: EXPIRED
        to: SENT
        trigger: "POST /referrals/{rid}/resend"
        actor: IntakeCoordinator | BenefitsCounselor | ShelterCoordinator
        preconditions:
          - "Referral must be EXPIRED (ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Agency must be ACTIVE (ERR_AGENCY_NOT_ACTIVE)"
          - "Capacity re-checked per referral_capacity_check using the client's CURRENT risk_tier (ERR_AGENCY_CAPACITY_FULL)"
        side_effects:
          - "sent_at = now; ack_due_at = now + 120h"
          - "PartnerAgency.active_referral_count += 1"
      - from: INITIATED
        to: WITHDRAWN
        trigger: "POST /referrals/{rid}/withdraw or system (client exit)"
        actor: IntakeCoordinator | BenefitsCounselor | ShelterCoordinator | system
        preconditions:
          - "Referral must be INITIATED or SENT (ERR_REFERRAL_NOT_ACTIONABLE)"
        side_effects: []
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /referrals/{rid}/withdraw or system (client exit)"
        actor: IntakeCoordinator | BenefitsCounselor | ShelterCoordinator | system
        preconditions:
          - "Referral must be INITIATED or SENT (ERR_REFERRAL_NOT_ACTIONABLE)"
        side_effects:
          - "PartnerAgency.active_referral_count -= 1"

  - entity: PartnerAgency
    initial_state: ACTIVE
