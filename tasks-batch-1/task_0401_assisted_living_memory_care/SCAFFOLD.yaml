# =============================================================================
# Assisted Living & Memory Care Facility — PRD Benchmark Seed Tables
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  Assisted Living & Memory Care Facility (Brookdale style): resident assessment &
  acuity-based level of care, care plan & ADL tracking, medication administration
  record (eMAR), unit/bed inventory & move-in agreement, monthly rent + care-points
  billing, fall/incident report, state licensing & survey deficiency (POC),
  respite/short-stay, discharge/transfer to SNF

domain_name: assisted-living-memory-care
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # full-month vs prorated billing; provisional vs finalized care points
    - cascading_side_effects        # admit/discharge cascades across bed, agreement, billing, care plan
    - rate_threshold_triggers       # acuity-tier breakpoints map ADL scores to care levels
    - derived_field_reconciliation  # facility occupancy rate, resident open_balance_cents recomputed
    - optimistic_concurrency        # OCC on Facility.version and Resident.version for true CREATE-supersede races

  entity_topology: hybrid
  # Facility -> Unit (strict hierarchy for bed inventory); Resident, Assessment,
  # CarePlan, MedicationOrder, eMAR, MoveInAgreement, BillingStatement,
  # IncidentReport, SurveyDeficiency reference parents by FK (flat with references).

  state_machine_shape: branching
  # Resident lifecycle branches (discharge-to-SNF vs discharge-other); SurveyDeficiency
  # and CarePlan are cyclic (revision loops); Unit/Bed is a cyclic occupancy loop;
  # BillingStatement branches (PAID vs PARTIALLY_PAID vs VOID).

  relationship_patterns:
    - one_to_many        # Facility 1—* Unit; Resident 1—* Assessment/Incident/Statement
    - cross_aggregate    # MoveInAgreement links Resident to Unit across aggregates
    - self_referential   # CarePlan.supersedes_care_plan_id chains revisions

  role_model: peer_roles
  # Registrar owns admissions/agreements, ClinicalDirector owns assessments/care plans,
  # Nurse owns eMAR/incidents, BillingClerk owns statements, ComplianceOfficer owns
  # survey deficiencies. GET reads shared via Staff.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code where the facility is licensed (e.g. CA, FL)" }
      - { name: license_number, type: string, source: input, description: "State-issued operating license number" }
      - { name: care_point_rate_cents, type: integer, source: input, description: "Price in cents charged per care point per month at this facility" }
      - { name: license_status, type: enum, source: system, description: "ACTIVE -> CONDITIONAL -> SUSPENDED -> ACTIVE; gates new admissions", default: "ACTIVE", constraints: "one of {ACTIVE, CONDITIONAL, SUSPENDED}" }
      - { name: bed_count, type: integer, source: computed, description: "Count of Units whose status != RETIRED; recomputed on unit create/retire" }
      - { name: occupied_bed_count, type: integer, source: computed, description: "Count of Units whose status == OCCUPIED; recomputed on bed occupancy change" }
      - { name: occupancy_rate_bps, type: integer, source: computed, description: "Occupancy in basis points = round_half_up(occupied_bed_count * 10000 / bed_count); 0 when bed_count == 0" }
      - { name: open_deficiency_count, type: integer, source: computed, description: "Count of SurveyDeficiency rows for this facility whose status NOT IN {CORRECTED} ; recomputed on deficiency state change" }

  - name: Unit
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: unit_number, type: string, source: input, description: "Room/bed label, unique within facility among non-RETIRED units" }
      - { name: wing, type: enum, source: input, description: "Care wing this bed belongs to", constraints: "one of {ASSISTED_LIVING, MEMORY_CARE}" }
      - { name: monthly_base_rent_cents, type: integer, source: input, description: "Base monthly rent in cents for this bed before care points" }
      - { name: current_resident_id, type: string, source: system, description: "FK -> Resident.id ; null unless status == OCCUPIED", default: null }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> RESERVED -> OCCUPIED -> CLEANING -> AVAILABLE ; or RETIRED (terminal)", default: "AVAILABLE", constraints: "one of {AVAILABLE, RESERVED, OCCUPIED, CLEANING, RETIRED}" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Resident legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: stay_type, type: enum, source: input, description: "Standard long-term stay vs short-term respite stay", default: "STANDARD", constraints: "one of {STANDARD, RESPITE}" }
      - { name: respite_end_date, type: string, source: input, description: "ISO date the respite stay is scheduled to end; required when stay_type == RESPITE, ignored otherwise", default: null }
      - { name: current_care_level, type: enum, source: computed, description: "Acuity level copied from the most recent FINALIZED Assessment; null before first finalization", default: null, constraints: "one of {LEVEL_1, LEVEL_2, LEVEL_3, MEMORY_CARE}" }
      - { name: current_care_points, type: integer, source: computed, description: "care_points_total of the most recent FINALIZED Assessment; 0 before first finalization", default: 0 }
      - { name: assigned_unit_id, type: string, source: computed, description: "FK -> Unit.id ; the Unit bound by the ACTIVE MoveInAgreement, null otherwise", default: null }
      - { name: open_balance_cents, type: integer, source: computed, description: "Sum of (total_charge_cents - paid_cents) over BillingStatement rows with status IN {ISSUED, PARTIALLY_PAID}; recomputed on statement issue/payment/void", default: 0 }
      - { name: status, type: enum, source: system, description: "PROSPECT -> ASSESSED -> ADMITTED -> DISCHARGE_PENDING -> DISCHARGED ; ADMITTED->ASSESSED reassessment loop; DISCHARGE_PENDING->ADMITTED rescind", default: "PROSPECT", constraints: "one of {PROSPECT, ASSESSED, ADMITTED, DISCHARGE_PENDING, DISCHARGED}" }
      - { name: discharge_disposition, type: enum, source: system, description: "Set when DISCHARGED: TRANSFER_TO_SNF or OTHER", default: null, constraints: "one of {TRANSFER_TO_SNF, OTHER}" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: adl_bathing, type: integer, source: input, description: "ADL dependency score for bathing, 0 (independent) to 4 (total dependence)", constraints: "integer 0..4" }
      - { name: adl_dressing, type: integer, source: input, description: "ADL dependency score for dressing, 0..4", constraints: "integer 0..4" }
      - { name: adl_toileting, type: integer, source: input, description: "ADL dependency score for toileting, 0..4", constraints: "integer 0..4" }
      - { name: adl_transferring, type: integer, source: input, description: "ADL dependency score for transferring, 0..4", constraints: "integer 0..4" }
      - { name: adl_eating, type: integer, source: input, description: "ADL dependency score for eating, 0..4", constraints: "integer 0..4" }
      - { name: cognition_score, type: integer, source: input, description: "Cognitive impairment score 0 (intact) to 10 (severe); >= MEMORY_CARE_COGNITION_THRESHOLD forces MEMORY_CARE level", constraints: "integer 0..10" }
      - { name: behavior_flags, type: integer, source: input, description: "Count of documented behavioral risk flags (wandering, aggression, exit-seeking)", default: 0, constraints: "integer >= 0" }
      - { name: care_points_total, type: integer, source: computed, description: "Weighted acuity points (see calculations.care_points_total); written at create, frozen at FINALIZED" }
      - { name: care_level, type: enum, source: computed, description: "Acuity tier derived from care_points_total and cognition (see calculations.care_level_assignment)", constraints: "one of {LEVEL_1, LEVEL_2, LEVEL_3, MEMORY_CARE}" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED ; or DRAFT -> SUPERSEDED when a newer DRAFT is finalized", default: "DRAFT", constraints: "one of {DRAFT, FINALIZED, SUPERSEDED}" }

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: source_assessment_id, type: string, source: input, description: "FK -> Assessment.id ; the FINALIZED assessment this plan is built from" }
      - { name: supersedes_care_plan_id, type: string, source: input, description: "FK -> CarePlan.id ; the prior ACTIVE plan this revision replaces, null for the first plan", default: null }
      - { name: adl_support_items, type: array, source: input, description: "List of ADL support task objects {task, frequency_per_day}" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED (revision loop) ; ACTIVE/DRAFT -> ARCHIVED on resident discharge", default: "DRAFT", constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, ARCHIVED}" }

  - name: MedicationOrder
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: drug_name, type: string, source: input, description: "Medication name" }
      - { name: dose, type: string, source: input, description: "Dose string, e.g. '5 mg'" }
      - { name: schedule_times, type: array, source: input, description: "List of HH:MM local times the dose is due each day; non-empty" }
      - { name: is_controlled, type: boolean, source: input, description: "Whether this is a controlled substance requiring witnessed administration", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DISCONTINUED (terminal)", default: "ACTIVE", constraints: "one of {ACTIVE, DISCONTINUED}" }

  - name: MedicationAdministrationRecord
    parent: null
    common_fields: false   # immutable eMAR event: id + created_at only (append-only audit log)
    fields:
      - { name: medication_order_id, type: string, source: input, description: "FK -> MedicationOrder.id" }
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id ; copied from the medication order" }
      - { name: scheduled_time, type: string, source: input, description: "HH:MM slot being recorded; must be a member of the order's schedule_times" }
      - { name: outcome, type: enum, source: input, description: "Administration outcome", constraints: "one of {GIVEN, REFUSED, HELD, MISSED}" }
      - { name: witness_user_id, type: string, source: input, description: "X-User-ID of the witnessing nurse; required when the order is_controlled and outcome == GIVEN", default: null }
      - { name: administered_by_user_id, type: string, source: system, description: "X-User-ID of the recording nurse" }

  - name: MoveInAgreement
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id ; the bed being reserved/occupied" }
      - { name: move_in_date, type: string, source: input, description: "ISO date YYYY-MM-DD the resident occupies the bed (also the billing anchor day)" }
      - { name: monthly_base_rent_cents, type: integer, source: system, description: "Base rent in cents snapshotted from the Unit at signing" }
      - { name: community_fee_cents, type: integer, source: input, description: "One-time non-refundable community fee in cents charged on the first statement", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> TERMINATED ; or DRAFT -> CANCELLED", default: "DRAFT", constraints: "one of {DRAFT, ACTIVE, TERMINATED, CANCELLED}" }

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: period_year, type: integer, source: input, description: "Billing month year, e.g. 2026" }
      - { name: period_month, type: integer, source: input, description: "Billing month 1..12", constraints: "integer 1..12" }
      - { name: is_first_statement, type: boolean, source: input, description: "True if this is the move-in month statement (applies community fee and move-in proration)", default: false }
      - { name: rent_charge_cents, type: integer, source: computed, description: "Prorated or full base-rent line in cents (see calculations.monthly_charge)" }
      - { name: care_points_charge_cents, type: integer, source: computed, description: "Prorated or full care-points line in cents (see calculations.monthly_charge)" }
      - { name: community_fee_charge_cents, type: integer, source: computed, description: "community_fee_cents from the ACTIVE agreement when is_first_statement, else 0" }
      - { name: total_charge_cents, type: integer, source: computed, description: "rent_charge_cents + care_points_charge_cents + community_fee_charge_cents" }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative amount paid against this statement in cents", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PARTIALLY_PAID -> PAID ; ISSUED/PARTIALLY_PAID -> VOID", default: "DRAFT", constraints: "one of {DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID}" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: incident_type, type: enum, source: input, description: "Category of incident", constraints: "one of {FALL, MEDICATION_ERROR, ELOPEMENT, INJURY, OTHER}" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO 8601 timestamp the incident occurred" }
      - { name: severity, type: enum, source: input, description: "Clinical severity", constraints: "one of {MINOR, MODERATE, SEVERE}" }
      - { name: requires_state_report, type: boolean, source: computed, description: "True when severity == SEVERE OR incident_type == ELOPEMENT (state-reportable within 24h)" }
      - { name: linked_deficiency_id, type: string, source: system, description: "FK -> SurveyDeficiency.id ; set if this incident is escalated into a deficiency", default: null }
      - { name: status, type: enum, source: system, description: "REPORTED -> UNDER_INVESTIGATION -> RESOLVED ; UNDER_INVESTIGATION -> ESCALATED (terminal, spawns deficiency)", default: "REPORTED", constraints: "one of {REPORTED, UNDER_INVESTIGATION, RESOLVED, ESCALATED}" }

  - name: SurveyDeficiency
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: tag_code, type: string, source: input, description: "State survey deficiency tag (e.g. 'F-880')" }
      - { name: scope_severity, type: enum, source: input, description: "Survey scope/severity grid letter band", constraints: "one of {A_C_NO_HARM, D_F_NO_HARM, G_I_ACTUAL_HARM, J_L_IMMEDIATE_JEOPARDY}" }
      - { name: cited_at, type: datetime, source: input, description: "ISO 8601 timestamp the deficiency was cited by the surveyor" }
      - { name: poc_due_date, type: string, source: computed, description: "ISO date the plan of correction is due (cited_at date + POC_WINDOW_DAYS)" }
      - { name: poc_text, type: string, source: system, description: "Plan-of-correction narrative submitted by the facility", default: null }
      - { name: status, type: enum, source: system, description: "CITED -> POC_SUBMITTED -> POC_ACCEPTED -> CORRECTED ; POC_SUBMITTED -> POC_REJECTED -> POC_SUBMITTED (resubmit loop)", default: "CITED", constraints: "one of {CITED, POC_SUBMITTED, POC_ACCEPTED, POC_REJECTED, CORRECTED}" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CONDITIONAL
        trigger: "POST /facilities/{facilityId}/license-action  (action=PLACE_CONDITIONAL)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Facility.version by 1"]
        note: "Conditional license: admissions still allowed but flagged."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /facilities/{facilityId}/license-action  (action=SUSPEND)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Facility.version by 1"]
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /facilities/{facilityId}/license-action  (action=SUSPEND)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Facility.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /facilities/{facilityId}/license-action  (action=REINSTATE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Facility.version by 1"]
      - from: CONDITIONAL
        to: ACTIVE
        trigger: "POST /facilities/{facilityId}/license-action  (action=REINSTATE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Facility.version by 1"]

  - entity: Resident
    initial_state: PROSPECT
    terminal_states: [DISCHARGED]
    transitions:
      - from: PROSPECT
        to: ASSESSED
        trigger: "system (automatic when the resident's first Assessment is FINALIZED)"
        actor: system
        preconditions: ["At least one Assessment for this resident reaches FINALIZED"]
        side_effects:
          - "Resident.current_care_level := finalized Assessment.care_level"
          - "Resident.current_care_points := finalized Assessment.care_points_total"
      - from: ADMITTED
        to: ASSESSED
        trigger: "system (automatic reassessment: a NEW Assessment is FINALIZED while resident is ADMITTED)"
        actor: system
        preconditions: ["Resident.status == ADMITTED", "A newer Assessment reaches FINALIZED"]
        side_effects:
          - "Resident.current_care_level := newly finalized Assessment.care_level"
          - "Resident.current_care_points := newly finalized Assessment.care_points_total"
        note: "Reassessment loop ADMITTED->ASSESSED. Resident is re-admitted via admit when a fresh agreement/bed is confirmed, but care-level/points update immediately on finalize."
      - from: ASSESSED
        to: ADMITTED
        trigger: "POST /residents/{residentId}/admit"
        actor: Registrar
        preconditions:
          - "Resident.status == ASSESSED"
          - "Facility.license_status != SUSPENDED"
          - "A MoveInAgreement for this resident is ACTIVE and its Unit.status == RESERVED bound to this resident"
        side_effects:
          - "Bound Unit.status RESERVED -> OCCUPIED ; Unit.current_resident_id := residentId"
          - "Recompute Facility.occupied_bed_count and occupancy_rate_bps"
          - "Resident.assigned_unit_id := agreement.unit_id"
      - from: ADMITTED
        to: DISCHARGE_PENDING
        trigger: "POST /residents/{residentId}/initiate-discharge"
        actor: Registrar
        preconditions: ["Resident.status == ADMITTED", "Resident.open_balance_cents == 0"]
        side_effects: []
      - from: DISCHARGE_PENDING
        to: ADMITTED
        trigger: "POST /residents/{residentId}/rescind-discharge"
        actor: Registrar
        preconditions: ["Resident.status == DISCHARGE_PENDING"]
        side_effects: []
        note: "Branching revert: discharge can be rescinded before finalization."
      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: "POST /residents/{residentId}/finalize-discharge  (disposition=TRANSFER_TO_SNF | OTHER)"
        actor: Registrar
        preconditions: ["Resident.status == DISCHARGE_PENDING", "All MedicationOrder rows for the resident are DISCONTINUED"]
        side_effects:
          - "Resident.discharge_disposition := disposition"
          - "Bound Unit.status OCCUPIED -> CLEANING ; Unit.current_resident_id := null"
          - "Recompute Facility.occupied_bed_count and occupancy_rate_bps"
          - "ACTIVE MoveInAgreement.status -> TERMINATED"
          - "ACTIVE CarePlan.status -> ARCHIVED ; DRAFT CarePlan.status -> ARCHIVED"
          - "Resident.assigned_unit_id := null"
        note: "Branching terminal: TRANSFER_TO_SNF vs OTHER differ only in discharge_disposition; cascade is identical."

  - entity: Unit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (automatic when a MoveInAgreement binding this Unit is ACTIVATED)"
        actor: system
        preconditions: ["Unit.status == AVAILABLE"]
        side_effects: ["Unit.current_resident_id := agreement.resident_id (provisional hold)"]
      - from: RESERVED
        to: OCCUPIED
        trigger: "system (automatic on resident admit)"
        actor: system
        preconditions: ["Unit.status == RESERVED"]
        side_effects: ["Recompute Facility.occupied_bed_count and occupancy_rate_bps"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (automatic when the binding MoveInAgreement is CANCELLED)"
        actor: system
        preconditions: ["Unit.status == RESERVED"]
        side_effects: ["Unit.current_resident_id := null"]
      - from: OCCUPIED
        to: CLEANING
        trigger: "system (automatic on resident finalize-discharge)"
        actor: system
        preconditions: ["Unit.status == OCCUPIED"]
        side_effects: ["Unit.current_resident_id := null", "Recompute Facility.occupied_bed_count and occupancy_rate_bps"]
      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /facilities/{facilityId}/units/{unitId}/mark-clean"
        actor: Registrar
        preconditions: ["Unit.status == CLEANING"]
        side_effects: []
        note: "Cyclic occupancy loop AVAILABLE->RESERVED->OCCUPIED->CLEANING->AVAILABLE."
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /facilities/{facilityId}/units/{unitId}/retire"
        actor: Registrar
        preconditions: ["Unit.status == AVAILABLE"]
        side_effects: ["Recompute Facility.bed_count and occupancy_rate_bps"]

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /assessments/{assessmentId}/finalize"
        actor: ClinicalDirector
        preconditions: ["Assessment.status == DRAFT", "Resident.status != DISCHARGED"]
        side_effects:
          - "care_points_total and care_level frozen (recomputed once, then immutable)"
          - "Any other FINALIZED Assessment for the same resident -> SUPERSEDED"
          - "Resident.current_care_level := this.care_level ; Resident.current_care_points := this.care_points_total"
          - "Resident PROSPECT -> ASSESSED (first finalize) or ADMITTED -> ASSESSED (reassessment)"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (automatic when a newer Assessment for the same resident is FINALIZED)"
        actor: system
        preconditions: ["A newer Assessment for the same resident reaches FINALIZED"]
        side_effects: []

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /care-plans/{carePlanId}/activate"
        actor: ClinicalDirector
        preconditions:
          - "CarePlan.status == DRAFT"
          - "source_assessment Assessment.status == FINALIZED"
          - "Resident.status IN {ASSESSED, ADMITTED}"
        side_effects:
          - "If supersedes_care_plan_id set: that CarePlan.status ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a revision CarePlan naming this one in supersedes_care_plan_id is ACTIVATED)"
        actor: system
        preconditions: ["A newer CarePlan with supersedes_care_plan_id == this.id is ACTIVATED"]
        side_effects: []
        note: "Cyclic revision loop via self-referential supersedes_care_plan_id."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (automatic on resident finalize-discharge)"
        actor: system
        preconditions: ["Owning Resident reaches DISCHARGED"]
        side_effects: []
      - from: DRAFT
        to: ARCHIVED
        trigger: "system (automatic on resident finalize-discharge)"
        actor: system
        preconditions: ["Owning Resident reaches DISCHARGED"]
        side_effects: []

  - entity: MedicationOrder
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /medication-orders/{medicationOrderId}/discontinue"
        actor: Nurse
        preconditions: ["MedicationOrder.status == ACTIVE"]
        side_effects: []

  - entity: BillingStatement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /billing-statements/{statementId}/issue"
        actor: BillingClerk
        preconditions:
          - "BillingStatement.status == DRAFT"
          - "Resident has an ACTIVE MoveInAgreement (rent/care lines need a bound bed)"
        side_effects:
          - "rent_charge_cents, care_points_charge_cents, community_fee_charge_cents, total_charge_cents computed and frozen"
          - "Recompute Resident.open_balance_cents (this statement now ISSUED)"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /billing-statements/{statementId}/payments  (amount_cents < remaining)"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == ISSUED", "0 < amount_cents < (total_charge_cents - paid_cents)"]
        side_effects: ["paid_cents += amount_cents", "Recompute Resident.open_balance_cents"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /billing-statements/{statementId}/payments  (amount_cents < remaining)"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == PARTIALLY_PAID", "0 < amount_cents < (total_charge_cents - paid_cents)"]
        side_effects: ["paid_cents += amount_cents", "Recompute Resident.open_balance_cents"]
      - from: ISSUED
        to: PAID
        trigger: "POST /billing-statements/{statementId}/payments  (amount_cents == remaining)"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == ISSUED", "amount_cents == (total_charge_cents - paid_cents)"]
        side_effects: ["paid_cents := total_charge_cents", "Recompute Resident.open_balance_cents"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /billing-statements/{statementId}/payments  (amount_cents == remaining)"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == PARTIALLY_PAID", "amount_cents == (total_charge_cents - paid_cents)"]
        side_effects: ["paid_cents := total_charge_cents", "Recompute Resident.open_balance_cents"]
      - from: ISSUED
        to: VOID
        trigger: "POST /billing-statements/{statementId}/void"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == ISSUED"]
        side_effects: ["Recompute Resident.open_balance_cents (statement leaves the open set)"]
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /billing-statements/{statementId}/void"
        actor: BillingClerk
        preconditions: ["BillingStatement.status == PARTIALLY_PAID"]
        side_effects: ["Recompute Resident.open_balance_cents (statement leaves the open set)"]

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /incident-reports/{incidentId}/investigate"
        actor: Nurse
        preconditions: ["IncidentReport.status == REPORTED"]
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: RESOLVED
        trigger: "POST /incident-reports/{incidentId}/resolve"
        actor: Nurse
        preconditions: ["IncidentReport.status == UNDER_INVESTIGATION"]
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: ESCALATED
        trigger: "POST /incident-reports/{incidentId}/escalate"
        actor: ComplianceOfficer
        preconditions: ["IncidentReport.status == UNDER_INVESTIGATION", "IncidentReport.requires_state_report == true"]
        side_effects:
          - "Create a SurveyDeficiency on the resident's Facility (status CITED, scope_severity from request)"
          - "IncidentReport.linked_deficiency_id := new SurveyDeficiency.id"
          - "Recompute Facility.open_deficiency_count"
        note: "Branching fork from UNDER_INVESTIGATION: RESOLVED (no spawn) vs ESCALATED (spawns deficiency); divergent side-effect sets."

  - entity: SurveyDeficiency
    initial_state: CITED
    terminal_states: [CORRECTED]
    transitions:
      - from: CITED
        to: POC_SUBMITTED
        trigger: "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/submit-poc"
        actor: ComplianceOfficer
        preconditions: ["SurveyDeficiency.status == CITED"]
        side_effects: ["SurveyDeficiency.poc_text := request poc_text"]
      - from: POC_SUBMITTED
        to: POC_ACCEPTED
        trigger: "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/review-poc  (decision=ACCEPT)"
        actor: ComplianceOfficer
        preconditions: ["SurveyDeficiency.status == POC_SUBMITTED"]
        side_effects: []
      - from: POC_SUBMITTED
        to: POC_REJECTED
        trigger: "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/review-poc  (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: ["SurveyDeficiency.status == POC_SUBMITTED"]
        side_effects: []
      - from: POC_REJECTED
        to: POC_SUBMITTED
        trigger: "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/submit-poc"
        actor: ComplianceOfficer
        preconditions: ["SurveyDeficiency.status == POC_REJECTED"]
        side_effects: ["SurveyDeficiency.poc_text := request poc_text (resubmitted)"]
        note: "Cyclic resubmit loop POC_SUBMITTED->POC_REJECTED->POC_SUBMITTED."
      - from: POC_ACCEPTED
        to: CORRECTED
        trigger: "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/mark-corrected"
        actor: ComplianceOfficer
        preconditions: ["SurveyDeficiency.status == POC_ACCEPTED"]
        side_effects: ["Recompute Facility.open_deficiency_count (this deficiency leaves the open set)"]

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /move-in-agreements/{agreementId}/activate"
    occ_field: "expected_unit_version"
    description: |
      Activating a MoveInAgreement reserves its Unit (AVAILABLE -> RESERVED). If the
      Unit's version has advanced since the client last observed it, the activation is
      rejected. This captures the case where another agreement was just activated and
      legitimately reserved the same bed (so the bed the current client believed was
      AVAILABLE is now stale), preventing a double-reservation of one bed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assessment-finalize-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /assessments/{assessmentId}/finalize"
    occ_field: "expected_resident_version"
    description: |
      Finalizing an Assessment mutates the parent Resident (current_care_level,
      current_care_points, and possibly status). If the Resident's version has
      advanced since the client last observed it, finalize is rejected. This captures
      the case where another Assessment for the same resident was just finalized
      (which legitimately supersedes prior care data and bumps the resident), so the
      current client's view of the resident is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: care_points_total
    trigger: "Assessment create (provisional) and POST /assessments/{id}/finalize (frozen)"
    algorithm: weighted_scoring
    formula: |
      adl_sum = adl_bathing + adl_dressing + adl_toileting + adl_transferring + adl_eating   # 0..20
      base = adl_sum * ADL_POINT_WEIGHT
      cognition_component = cognition_score * COGNITION_WEIGHT
      behavior_component = min(behavior_flags, BEHAVIOR_FLAG_CAP) * BEHAVIOR_WEIGHT
      care_points_total = base + cognition_component + behavior_component
      # >= 3 inputs (adl_sum, cognition_score, behavior_flags) with a non-linear
      # min() cap on the behavior term — combinatorial mode (a).
    input_set: "The single Assessment row being scored; ADL fields, cognition_score, behavior_flags."
    constants:
      ADL_POINT_WEIGHT: 3
      COGNITION_WEIGHT: 2
      BEHAVIOR_WEIGHT: 5
      BEHAVIOR_FLAG_CAP: 4
    precision: "integer points, no rounding (all inputs and weights are integers)"
    variants:
      - name: provisional
        when: "At Assessment create (status DRAFT)"
        difference: "Stored on the DRAFT row but mutable while DRAFT; not yet copied to the Resident."
      - name: frozen
        when: "At finalize (DRAFT -> FINALIZED)"
        difference: "Recomputed once from the row's then-current inputs, frozen, and copied to Resident.current_care_points; later input edits cannot occur because FINALIZED rows are immutable."

  - name: care_level_assignment
    trigger: "Computed alongside care_points_total at create and finalize"
    algorithm: threshold
    formula: |
      if cognition_score >= MEMORY_CARE_COGNITION_THRESHOLD:
          care_level = MEMORY_CARE          # cognition gate overrides point tiers
      elif care_points_total >= LEVEL_3_MIN_POINTS:
          care_level = LEVEL_3
      elif care_points_total >= LEVEL_2_MIN_POINTS:
          care_level = LEVEL_2
      else:
          care_level = LEVEL_1
      # Boundary precision: a resident with care_points_total EXACTLY equal to a tier
      # minimum lands in the higher tier (>=, not >).
    input_set: "care_points_total (from care_points_total calc) and cognition_score on the same Assessment."
    constants:
      MEMORY_CARE_COGNITION_THRESHOLD: 7
      LEVEL_2_MIN_POINTS: 30
      LEVEL_3_MIN_POINTS: 55
    precision: "exact integer comparison"

  - name: monthly_charge
    trigger: "POST /billing-statements/{id}/issue (DRAFT -> ISSUED)"
    algorithm: tiered_pricing
    formula: |
      days_in_month = calendar days in (period_year, period_month)
      care_points_month_cents = current_care_points * facility.care_point_rate_cents
      base_rent_month_cents   = agreement.monthly_base_rent_cents
      if is_first_statement:
          # Move-in proration: charge from move_in_date through end of month, inclusive.
          billable_days = days_in_month - (day_of_month(move_in_date) - 1)
          # NESTED ROUNDING ORDER IS PINNED: prorate EACH line independently and
          # round_half_up to whole cents PER LINE, THEN sum. (Do NOT sum the two
          # monthly figures first and prorate the combined total.)
          rent_charge_cents         = round_half_up(base_rent_month_cents   * billable_days / days_in_month)
          care_points_charge_cents  = round_half_up(care_points_month_cents * billable_days / days_in_month)
          community_fee_charge_cents = agreement.community_fee_cents
      else:
          rent_charge_cents          = base_rent_month_cents          # full month, no proration
          care_points_charge_cents   = care_points_month_cents
          community_fee_charge_cents = 0
      total_charge_cents = rent_charge_cents + care_points_charge_cents + community_fee_charge_cents
      # Combinatorial mode (b): per-line round-then-sum is the pinned order; sum-then-round
      # would yield a different cent on fractional days.
    input_set: "ACTIVE MoveInAgreement for the resident (base rent, community fee, move_in_date), Resident.current_care_points, Facility.care_point_rate_cents."
    constants: {}
    precision: "round_half_up to whole cents PER LINE before summing"
    variants:
      - name: full_month
        when: "is_first_statement == false"
        difference: "No proration; rent and care-points lines are the full monthly amounts; community fee = 0."
      - name: prorated_move_in
        when: "is_first_statement == true"
        difference: "Each of rent and care-points lines prorated by billable_days/days_in_month (round per line), plus the one-time community fee."

  - name: facility_occupancy
    trigger: "Recomputed on unit create, unit retire, resident admit, resident finalize-discharge"
    algorithm: aggregation
    formula: |
      bed_count          = count(Unit where Unit.facility_id == facility.id AND Unit.status != RETIRED)
      occupied_bed_count = count(Unit where Unit.facility_id == facility.id AND Unit.status == OCCUPIED)
      if bed_count == 0:
          occupancy_rate_bps = 0
      else:
          occupancy_rate_bps = round_half_up(occupied_bed_count * 10000 / bed_count)
      # Boundary precision: empty-set edge (bed_count == 0) returns 0, not a divide error.
    input_set: "All non-RETIRED Units of the facility; OCCUPIED subset."
    constants:
      BPS_SCALE: 10000
    precision: "round_half_up to integer basis points; 0 when bed_count == 0"

  - name: poc_due_date
    trigger: "SurveyDeficiency create (CITED)"
    algorithm: threshold
    formula: |
      band = scope_severity
      window_days = IJ_POC_WINDOW_DAYS if band == J_L_IMMEDIATE_JEOPARDY else STANDARD_POC_WINDOW_DAYS
      poc_due_date = date(cited_at) + window_days   # calendar-day addition
      # Tiered selection by severity band.
    input_set: "The SurveyDeficiency's cited_at and scope_severity."
    constants:
      STANDARD_POC_WINDOW_DAYS: 10
      IJ_POC_WINDOW_DAYS: 2
    precision: "whole calendar days"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path resource IDs exist, validated left-to-right (facility, then unit/deficiency; resident; assessment; etc.)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing rows (resident_id, unit_id, source_assessment_id, supersedes_care_plan_id, medication_order_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints carrying FK fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: when the endpoint declares expected_<parent>_version, it must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /move-in-agreements/{id}/activate, POST /assessments/{id}/finalize"

  - priority: 7
    category: business_constraint
    check: "ADL scores are integers 0..4, cognition_score integer 0..10, behavior_flags integer >= 0"
    error_id: ERR_INVALID_ASSESSMENT_INPUT
    http_status: 422
    applies_to: "POST /assessments"

  - priority: 8
    category: business_constraint
    check: "Unit.unit_number unique within the facility among non-RETIRED units"
    error_id: ERR_DUPLICATE_UNIT_NUMBER
    http_status: 409
    applies_to: "POST /facilities/{facilityId}/units"

  - priority: 9
    category: business_constraint
    check: "stay_type == RESPITE requires a respite_end_date strictly after move_in/admission context; STANDARD must omit it"
    error_id: ERR_INVALID_RESPITE_WINDOW
    http_status: 422
    applies_to: "POST /residents"

  - priority: 10
    category: business_referential
    check: "A resident may have at most one MoveInAgreement in status IN {DRAFT, ACTIVE} at a time"
    error_id: ERR_AGREEMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /move-in-agreements"

  - priority: 11
    category: business_temporal
    check: "MoveInAgreement may only activate against a Unit whose status == AVAILABLE and whose wing matches the resident's care wing (MEMORY_CARE level requires MEMORY_CARE wing)"
    error_id: ERR_BED_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /move-in-agreements/{id}/activate"

  - priority: 12
    category: business_safety
    check: "Wing match: a resident whose current_care_level == MEMORY_CARE may only be bound to a Unit whose wing == MEMORY_CARE"
    error_id: ERR_WING_MISMATCH
    http_status: 409
    applies_to: "POST /move-in-agreements/{id}/activate"

  - priority: 13
    category: business_safety
    check: "Admission requires Facility.license_status != SUSPENDED"
    error_id: ERR_LICENSE_SUSPENDED
    http_status: 409
    applies_to: "POST /residents/{residentId}/admit"

  - priority: 14
    category: business_safety
    check: "Recording an eMAR GIVEN outcome on a controlled (is_controlled) order requires a witness_user_id different from the administering nurse"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 422
    applies_to: "POST /medication-orders/{medicationOrderId}/administrations"

  - priority: 15
    category: business_constraint
    check: "eMAR scheduled_time must be a member of the order's schedule_times"
    error_id: ERR_INVALID_MED_SLOT
    http_status: 422
    applies_to: "POST /medication-orders/{medicationOrderId}/administrations"

  - priority: 16
    category: business_referential
    check: "At most one BillingStatement per (resident_id, period_year, period_month) in status != VOID"
    error_id: ERR_DUPLICATE_STATEMENT_PERIOD
    http_status: 409
    applies_to: "POST /billing-statements"

  - priority: 17
    category: business_fiscal
    check: "Payment amount_cents must be > 0 and <= (total_charge_cents - paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /billing-statements/{statementId}/payments"

  - priority: 18
    category: business_fiscal
    check: "initiate-discharge requires Resident.open_balance_cents == 0"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /residents/{residentId}/initiate-discharge"

  - priority: 19
    category: business_safety
    check: "finalize-discharge requires every MedicationOrder for the resident to be DISCONTINUED"
    error_id: ERR_ACTIVE_MED_ORDERS
    http_status: 409
    applies_to: "POST /residents/{residentId}/finalize-discharge"

  - priority: 20
    category: business_constraint
    check: "escalate requires IncidentReport.requires_state_report == true"
    error_id: ERR_NOT_STATE_REPORTABLE
    http_status: 409
    applies_to: "POST /incident-reports/{incidentId}/escalate"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Facility ----
  - method: POST
    path: "/facilities"
    description: "Create a facility"
    roles: [Registrar, ComplianceOfficer]
    code: 201
    input: [name, state_code, license_number, care_point_rate_cents]
    output: Facility
    side_effects: ["license_status := ACTIVE; bed_count, occupied_bed_count, occupancy_rate_bps, open_deficiency_count := 0"]

  - method: GET
    path: "/facilities"
    description: "List facilities"
    roles: [Staff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/facilities/{facilityId}"
    description: "Get a facility (with computed occupancy and deficiency counts)"
    roles: [Staff]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{facilityId}/license-action"
    description: "Apply a license action (PLACE_CONDITIONAL | SUSPEND | REINSTATE)"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "expected_facility_version?"]
    output: Facility
    side_effects: ["license_status transition per §1.2; increments Facility.version by 1"]

  # ---- Unit ----
  - method: POST
    path: "/facilities/{facilityId}/units"
    description: "Create a unit/bed in a facility"
    roles: [Registrar]
    code: 201
    input: [unit_number, wing, monthly_base_rent_cents]
    output: Unit
    side_effects: ["status := AVAILABLE; recompute Facility.bed_count and occupancy_rate_bps"]

  - method: GET
    path: "/units"
    description: "List units, filterable by facility_id (reverse-reachability for Unit.facility_id) and current_resident_id (reverse-reachability for Unit.current_resident_id)"
    roles: [Staff]
    code: 200
    input: ["facility_id?", "current_resident_id?", "wing?", "status?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/units/{unitId}"
    description: "Get a unit"
    roles: [Staff]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/facilities/{facilityId}/units/{unitId}/mark-clean"
    description: "Mark a CLEANING unit back to AVAILABLE"
    roles: [Registrar]
    code: 200
    input: []
    output: Unit
    side_effects: ["status CLEANING -> AVAILABLE"]

  - method: POST
    path: "/facilities/{facilityId}/units/{unitId}/retire"
    description: "Retire an AVAILABLE unit"
    roles: [Registrar]
    code: 200
    input: []
    output: Unit
    side_effects: ["status AVAILABLE -> RETIRED; recompute Facility.bed_count and occupancy_rate_bps"]

  # ---- Resident ----
  - method: POST
    path: "/residents"
    description: "Register a prospective resident"
    roles: [Registrar]
    code: 201
    input: [facility_id, full_name, date_of_birth, "stay_type?", "respite_end_date?"]
    output: Resident
    side_effects: ["status := PROSPECT; current_care_points := 0; open_balance_cents := 0"]

  - method: GET
    path: "/residents"
    description: "List residents, filterable by facility_id (reverse-reachability for Resident.facility_id) and assigned_unit_id (reverse-reachability for Resident.assigned_unit_id)"
    roles: [Staff]
    code: 200
    input: ["facility_id?", "assigned_unit_id?", "status?", "limit?", "offset?"]
    output: "Resident[]"
    side_effects: []

  - method: GET
    path: "/residents/{residentId}"
    description: "Get a resident (with computed care level, points, balance)"
    roles: [Staff]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: POST
    path: "/residents/{residentId}/admit"
    description: "Admit an ASSESSED resident to their reserved bed"
    roles: [Registrar]
    code: 200
    input: []
    output: Resident
    side_effects:
      - "status ASSESSED -> ADMITTED"
      - "bound Unit RESERVED -> OCCUPIED; Unit.current_resident_id := residentId"
      - "Resident.assigned_unit_id := agreement.unit_id; recompute Facility occupancy"

  - method: POST
    path: "/residents/{residentId}/initiate-discharge"
    description: "Move an ADMITTED resident to DISCHARGE_PENDING"
    roles: [Registrar]
    code: 200
    input: []
    output: Resident
    side_effects: ["status ADMITTED -> DISCHARGE_PENDING (requires open_balance_cents == 0)"]

  - method: POST
    path: "/residents/{residentId}/rescind-discharge"
    description: "Rescind a pending discharge"
    roles: [Registrar]
    code: 200
    input: []
    output: Resident
    side_effects: ["status DISCHARGE_PENDING -> ADMITTED"]

  - method: POST
    path: "/residents/{residentId}/finalize-discharge"
    description: "Finalize discharge with disposition (TRANSFER_TO_SNF | OTHER)"
    roles: [Registrar]
    code: 200
    input: [disposition]
    output: Resident
    side_effects:
      - "status DISCHARGE_PENDING -> DISCHARGED; discharge_disposition := disposition"
      - "bound Unit OCCUPIED -> CLEANING; Unit.current_resident_id := null; recompute Facility occupancy"
      - "ACTIVE MoveInAgreement -> TERMINATED; ACTIVE/DRAFT CarePlan -> ARCHIVED; assigned_unit_id := null"

  # ---- Assessment ----
  - method: POST
    path: "/assessments"
    description: "Create a DRAFT acuity assessment for a resident"
    roles: [ClinicalDirector]
    code: 201
    input: [resident_id, adl_bathing, adl_dressing, adl_toileting, adl_transferring, adl_eating, cognition_score, "behavior_flags?"]
    output: Assessment
    side_effects: ["care_points_total and care_level computed (provisional)"]

  - method: GET
    path: "/assessments"
    description: "List assessments (filter by resident_id — reverse-reachability for Assessment.resident_id)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []

  - method: GET
    path: "/assessments/{assessmentId}"
    description: "Get an assessment"
    roles: [Staff]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: "/assessments/{assessmentId}/finalize"
    description: "Finalize an assessment (freezes points/level, updates resident)"
    roles: [ClinicalDirector]
    code: 200
    input: [expected_resident_version]
    output: Assessment
    side_effects:
      - "status DRAFT -> FINALIZED; care_points_total/care_level frozen"
      - "prior FINALIZED assessment for resident -> SUPERSEDED"
      - "Resident.current_care_level/current_care_points updated; Resident PROSPECT->ASSESSED or ADMITTED->ASSESSED; increments Resident.version by 1"

  # ---- CarePlan ----
  - method: POST
    path: "/care-plans"
    description: "Create a DRAFT care plan from a finalized assessment"
    roles: [ClinicalDirector]
    code: 201
    input: [resident_id, source_assessment_id, adl_support_items, "supersedes_care_plan_id?"]
    output: CarePlan
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/care-plans"
    description: "List care plans, filterable by resident_id, source_assessment_id, and supersedes_care_plan_id (reverse-reachability for all three CarePlan FKs)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "source_assessment_id?", "supersedes_care_plan_id?", "status?", "limit?", "offset?"]
    output: "CarePlan[]"
    side_effects: []

  - method: GET
    path: "/care-plans/{carePlanId}"
    description: "Get a care plan"
    roles: [Staff]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: POST
    path: "/care-plans/{carePlanId}/activate"
    description: "Activate a DRAFT care plan (supersedes prior ACTIVE plan if named)"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status DRAFT -> ACTIVE; superseded plan ACTIVE -> SUPERSEDED"]

  # ---- MedicationOrder + eMAR ----
  - method: POST
    path: "/medication-orders"
    description: "Create an active medication order"
    roles: [Nurse, ClinicalDirector]
    code: 201
    input: [resident_id, drug_name, dose, schedule_times, "is_controlled?"]
    output: MedicationOrder
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/medication-orders"
    description: "List medication orders (filter by resident_id — reverse-reachability for MedicationOrder.resident_id)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: "MedicationOrder[]"
    side_effects: []

  - method: GET
    path: "/medication-orders/{medicationOrderId}"
    description: "Get a medication order"
    roles: [Staff]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: []

  - method: POST
    path: "/medication-orders/{medicationOrderId}/discontinue"
    description: "Discontinue a medication order"
    roles: [Nurse, ClinicalDirector]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status ACTIVE -> DISCONTINUED"]

  - method: POST
    path: "/medication-orders/{medicationOrderId}/administrations"
    description: "Record an eMAR administration event (append-only)"
    roles: [Nurse]
    code: 201
    input: [scheduled_time, outcome, "witness_user_id?"]
    output: MedicationAdministrationRecord
    side_effects: ["append immutable eMAR row; resident_id and administered_by_user_id stamped by system"]

  - method: GET
    path: "/administrations"
    description: "List eMAR events, filterable by resident_id and medication_order_id (reverse-reachability for both MedicationAdministrationRecord FKs)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "medication_order_id?", "limit?", "offset?"]
    output: "MedicationAdministrationRecord[]"
    side_effects: []

  - method: GET
    path: "/administrations/{administrationId}"
    description: "Get a single eMAR administration record"
    roles: [Staff]
    code: 200
    input: []
    output: MedicationAdministrationRecord
    side_effects: []

  # ---- MoveInAgreement ----
  - method: POST
    path: "/move-in-agreements"
    description: "Draft a move-in agreement binding a resident to a unit"
    roles: [Registrar]
    code: 201
    input: [resident_id, unit_id, move_in_date, "community_fee_cents?"]
    output: MoveInAgreement
    side_effects: ["status := DRAFT; monthly_base_rent_cents snapshotted from Unit"]

  - method: GET
    path: "/move-in-agreements"
    description: "List move-in agreements (filter by resident_id or unit_id — reverse-reachability for both FKs)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: "MoveInAgreement[]"
    side_effects: []

  - method: GET
    path: "/move-in-agreements/{agreementId}"
    description: "Get a move-in agreement"
    roles: [Staff]
    code: 200
    input: []
    output: MoveInAgreement
    side_effects: []

  - method: POST
    path: "/move-in-agreements/{agreementId}/activate"
    description: "Activate a DRAFT agreement, reserving the bed (OCC on Unit.version)"
    roles: [Registrar]
    code: 200
    input: [expected_unit_version]
    output: MoveInAgreement
    side_effects:
      - "status DRAFT -> ACTIVE"
      - "bound Unit AVAILABLE -> RESERVED; Unit.current_resident_id := resident_id; increments Unit.version by 1"

  - method: POST
    path: "/move-in-agreements/{agreementId}/cancel"
    description: "Cancel a DRAFT agreement (releases any reserved bed)"
    roles: [Registrar]
    code: 200
    input: []
    output: MoveInAgreement
    side_effects: ["status DRAFT -> CANCELLED; if bound Unit RESERVED -> AVAILABLE; Unit.current_resident_id := null"]

  # ---- BillingStatement ----
  - method: POST
    path: "/billing-statements"
    description: "Create a DRAFT billing statement for a resident period"
    roles: [BillingClerk]
    code: 201
    input: [resident_id, period_year, period_month, "is_first_statement?"]
    output: BillingStatement
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/billing-statements"
    description: "List billing statements (filter by resident_id — reverse-reachability for BillingStatement.resident_id)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: "BillingStatement[]"
    side_effects: []

  - method: GET
    path: "/billing-statements/{statementId}"
    description: "Get a billing statement"
    roles: [Staff]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []

  - method: POST
    path: "/billing-statements/{statementId}/issue"
    description: "Issue a DRAFT statement (computes and freezes charge lines)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["status DRAFT -> ISSUED; charge lines computed (monthly_charge); recompute Resident.open_balance_cents"]

  - method: POST
    path: "/billing-statements/{statementId}/payments"
    description: "Record a payment against an issued statement"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: BillingStatement
    side_effects: ["paid_cents += amount_cents; status -> PARTIALLY_PAID or PAID; recompute Resident.open_balance_cents"]

  - method: POST
    path: "/billing-statements/{statementId}/void"
    description: "Void an issued or partially-paid statement"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["status -> VOID; recompute Resident.open_balance_cents"]

  # ---- IncidentReport ----
  - method: POST
    path: "/incident-reports"
    description: "File a fall/incident report"
    roles: [Nurse]
    code: 201
    input: [resident_id, incident_type, occurred_at, severity]
    output: IncidentReport
    side_effects: ["status := REPORTED; requires_state_report computed"]

  - method: GET
    path: "/incident-reports"
    description: "List incident reports (filter by resident_id — reverse-reachability for IncidentReport.resident_id; and by linked_deficiency_id)"
    roles: [Staff]
    code: 200
    input: ["resident_id?", "linked_deficiency_id?", "status?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

  - method: GET
    path: "/incident-reports/{incidentId}"
    description: "Get an incident report"
    roles: [Staff]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/incident-reports/{incidentId}/investigate"
    description: "Begin investigation"
    roles: [Nurse]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status REPORTED -> UNDER_INVESTIGATION"]

  - method: POST
    path: "/incident-reports/{incidentId}/resolve"
    description: "Resolve an investigated incident (no deficiency spawned)"
    roles: [Nurse]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status UNDER_INVESTIGATION -> RESOLVED"]

  - method: POST
    path: "/incident-reports/{incidentId}/escalate"
    description: "Escalate a state-reportable incident into a survey deficiency"
    roles: [ComplianceOfficer]
    code: 200
    input: [scope_severity, tag_code, cited_at]
    output: IncidentReport
    side_effects:
      - "status UNDER_INVESTIGATION -> ESCALATED"
      - "create SurveyDeficiency (CITED) on resident's facility; IncidentReport.linked_deficiency_id := new id"
      - "recompute Facility.open_deficiency_count"

  # ---- SurveyDeficiency ----
  - method: POST
    path: "/facilities/{facilityId}/deficiencies"
    description: "Cite a survey deficiency against a facility"
    roles: [ComplianceOfficer]
    code: 201
    input: [tag_code, scope_severity, cited_at]
    output: SurveyDeficiency
    side_effects: ["status := CITED; poc_due_date computed; recompute Facility.open_deficiency_count"]

  - method: GET
    path: "/deficiencies"
    description: "List survey deficiencies, filterable by facility_id (reverse-reachability for SurveyDeficiency.facility_id)"
    roles: [Staff]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "SurveyDeficiency[]"
    side_effects: []

  - method: GET
    path: "/deficiencies/{deficiencyId}"
    description: "Get a survey deficiency"
    roles: [Staff]
    code: 200
    input: []
    output: SurveyDeficiency
    side_effects: []

  - method: POST
    path: "/facilities/{facilityId}/deficiencies/{deficiencyId}/submit-poc"
    description: "Submit (or resubmit) a plan of correction"
    roles: [ComplianceOfficer]
    code: 200
    input: [poc_text]
    output: SurveyDeficiency
    side_effects: ["status CITED|POC_REJECTED -> POC_SUBMITTED; poc_text stored"]

  - method: POST
    path: "/facilities/{facilityId}/deficiencies/{deficiencyId}/review-poc"
    description: "Accept or reject a submitted plan of correction"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: SurveyDeficiency
    side_effects: ["status POC_SUBMITTED -> POC_ACCEPTED or POC_REJECTED"]

  - method: POST
    path: "/facilities/{facilityId}/deficiencies/{deficiencyId}/mark-corrected"
    description: "Mark an accepted deficiency corrected"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SurveyDeficiency
    side_effects: ["status POC_ACCEPTED -> CORRECTED; recompute Facility.open_deficiency_count"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- not found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit id does not exist in the facility" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "Resident id does not exist (path or FK body field)" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment id does not exist (path or source_assessment_id)" }
  - { id: ERR_CARE_PLAN_NOT_FOUND, http: 404, condition: "CarePlan id does not exist (path or supersedes_care_plan_id)" }
  - { id: ERR_MEDICATION_ORDER_NOT_FOUND, http: 404, condition: "MedicationOrder id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "MoveInAgreement id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "BillingStatement id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "IncidentReport id does not exist" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "SurveyDeficiency id does not exist in the facility" }
  # --- generic request / state ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or type mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- business ---
  - { id: ERR_INVALID_ASSESSMENT_INPUT, http: 422, condition: "ADL score out of 0..4, cognition out of 0..10, or behavior_flags negative" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "unit_number already used by a non-RETIRED unit in the facility" }
  - { id: ERR_INVALID_RESPITE_WINDOW, http: 422, condition: "RESPITE missing/invalid respite_end_date, or STANDARD supplying one" }
  - { id: ERR_AGREEMENT_ALREADY_OPEN, http: 409, condition: "Resident already has a DRAFT or ACTIVE MoveInAgreement" }
  - { id: ERR_BED_NOT_AVAILABLE, http: 409, condition: "Unit is not AVAILABLE at activation time" }
  - { id: ERR_WING_MISMATCH, http: 409, condition: "MEMORY_CARE resident bound to a non-MEMORY_CARE wing unit" }
  - { id: ERR_LICENSE_SUSPENDED, http: 409, condition: "Admission attempted while Facility.license_status == SUSPENDED" }
  - { id: ERR_WITNESS_REQUIRED, http: 422, condition: "Controlled-med GIVEN eMAR lacks a distinct witness_user_id" }
  - { id: ERR_INVALID_MED_SLOT, http: 422, condition: "eMAR scheduled_time not in the order's schedule_times" }
  - { id: ERR_DUPLICATE_STATEMENT_PERIOD, http: 409, condition: "Non-VOID statement already exists for (resident, year, month)" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents <= 0 or exceeds remaining balance" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 409, condition: "initiate-discharge while open_balance_cents > 0" }
  - { id: ERR_ACTIVE_MED_ORDERS, http: 409, condition: "finalize-discharge while a MedicationOrder is still ACTIVE" }
  - { id: ERR_NOT_STATE_REPORTABLE, http: 409, condition: "escalate on an incident whose requires_state_report == false" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Owns admissions, beds, residents, and move-in agreements"
    identity: opaque
    exclusive_operations:
      - "POST /facilities — create facility (shared with ComplianceOfficer)"
      - "POST /facilities/{facilityId}/units — create unit"
      - "POST /facilities/{facilityId}/units/{unitId}/mark-clean"
      - "POST /facilities/{facilityId}/units/{unitId}/retire"
      - "POST /residents — register resident"
      - "POST /residents/{residentId}/admit"
      - "POST /residents/{residentId}/initiate-discharge"
      - "POST /residents/{residentId}/rescind-discharge"
      - "POST /residents/{residentId}/finalize-discharge"
      - "POST /move-in-agreements — draft agreement"
      - "POST /move-in-agreements/{agreementId}/activate"
      - "POST /move-in-agreements/{agreementId}/cancel"
    shared_operations:
      - "POST /facilities (with ComplianceOfficer)"

  - name: ClinicalDirector
    description: "Owns acuity assessments and care plans; may also place medication orders"
    identity: opaque
    exclusive_operations:
      - "POST /assessments — create assessment"
      - "POST /assessments/{assessmentId}/finalize"
      - "POST /care-plans — create care plan"
      - "POST /care-plans/{carePlanId}/activate"
    shared_operations:
      - "POST /medication-orders (with Nurse)"
      - "POST /medication-orders/{medicationOrderId}/discontinue (with Nurse)"

  - name: Nurse
    description: "Owns eMAR administration and incident reporting; can manage medication orders"
    identity: opaque
    exclusive_operations:
      - "POST /medication-orders/{medicationOrderId}/administrations — record eMAR"
      - "POST /incident-reports — file incident"
      - "POST /incident-reports/{incidentId}/investigate"
      - "POST /incident-reports/{incidentId}/resolve"
    shared_operations:
      - "POST /medication-orders (with ClinicalDirector)"
      - "POST /medication-orders/{medicationOrderId}/discontinue (with ClinicalDirector)"

  - name: BillingClerk
    description: "Owns billing statements and payments"
    identity: opaque
    exclusive_operations:
      - "POST /billing-statements — create statement"
      - "POST /billing-statements/{statementId}/issue"
      - "POST /billing-statements/{statementId}/payments"
      - "POST /billing-statements/{statementId}/void"
    shared_operations: []

  - name: ComplianceOfficer
    description: "Owns licensing actions and survey deficiencies / plans of correction; can escalate incidents"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{facilityId}/license-action"
      - "POST /facilities/{facilityId}/deficiencies — cite deficiency"
      - "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/submit-poc"
      - "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/review-poc"
      - "POST /facilities/{facilityId}/deficiencies/{deficiencyId}/mark-corrected"
      - "POST /incident-reports/{incidentId}/escalate"
    shared_operations:
      - "POST /facilities (with Registrar)"

  - name: Staff
    description: "Any authenticated staff member; read-only GET access across the API"
    identity: opaque
    shared_operations:
      - "GET on all collection and item endpoints (facilities, units, residents, assessments, care-plans, medication-orders, administrations, move-in-agreements, billing-statements, incident-reports, deficiencies)"
