# =============================================================================
# Example: shuttle-ops benchmark seed tables (v1)
# =============================================================================

scenario: |
  Rideshare event corridor product where bookings are seat reservations on shared
  shuttles. Riders draft bookings, submit into queue, get dispatched to driver-shuttles,
  then start and complete. Bookings can be prepaid via partner-issued seat passes or
  rider wallets. Ops can pause cities, clean up stale requests, and fix mistakes.
  Everything is hub-scoped. Considerations: posture (NORMAL/SAFETY_HOLD), wallet
  accounting, pass management, ride lifecycle events, stale cleanup, waitlist promotion.

domain_name: shuttle-ops
api_prefix: /hubs

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Hub
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Hub name (city/event footprint)" }
      - { name: posture, type: enum, source: system, description: "NORMAL | SAFETY_HOLD" }
      - { name: ops_run_index, type: integer, source: system, description: "Batch tick counter, starts at 0, incremented by run_ops" }
      - { name: pool_seat_price_cents, type: integer, source: system, description: "Price per seat in cents, starts at 800" }

  - name: Rider
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Associated hub ID" }
      - { name: name, type: string, source: input, description: "Rider name" }
      - { name: wallet_balance_cents, type: integer, source: input, description: "Wallet balance in cents, starts at or above 0" }

  - name: Driver
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Associated hub ID" }
      - { name: name, type: string, source: input, description: "Driver name" }
      - { name: seat_capacity, type: integer, source: input, description: "Total seat capacity of the shuttle" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: seats_assigned, type: integer, source: computed, description: "Seats currently reserved across DISPATCHED and IN_PROGRESS rides" }

  - name: Pass
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Associated hub ID" }
      - { name: partner_ref, type: string, source: input, description: "Opaque partner identifier" }
      - { name: owner_rider_id, type: string, source: input, description: "Rider who owns this pass" }
      - { name: total_seats, type: integer, source: input, description: "Total seat credits issued" }
      - { name: seats_remaining, type: integer, source: computed, description: "Remaining seat credits" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Ride
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Associated hub ID" }
      - { name: rider_id, type: string, source: input, description: "Owning rider ID" }
      - { name: kind, type: string, source: input, description: "Always POOL in v1" }
      - { name: seat_count, type: integer, source: input, description: "Number of seats requested" }
      - { name: payment_mode, type: enum, source: input, description: "WALLET_ONLY | PASS_ONLY | PASS_THEN_WALLET" }
      - { name: pass_id, type: string, source: input, required: false, description: "Required for PASS_ONLY and PASS_THEN_WALLET" }
      - { name: rider_note, type: string, source: input, required: false, description: "Small note ops can see" }
      - { name: status, type: enum, source: system, description: "DRAFT → REQUESTED → DISPATCHED → IN_PROGRESS → COMPLETED / CANCELLED / VOIDED / WAITLISTED / ON_HOLD" }
      - { name: request_seq, type: integer, source: system, required: false, description: "Queue position, set on submit" }
      - { name: driver_id, type: string, source: system, required: false, description: "Assigned driver ID" }
      - { name: hold_reason, type: enum, source: system, required: false, description: "HUB_SAFETY_HOLD | PASS_SUSPENDED | PASS_TRANSFERRED" }
      - { name: wallet_charge_cents, type: integer, source: computed, description: "Wallet amount charged, 0 initially" }
      - { name: pass_seats_applied, type: integer, source: computed, description: "Pass seats consumed, 0 initially" }
      - { name: cancel_by, type: enum, source: input, required: false, description: "RIDER | DRIVER | OPS" }
      - { name: cancel_reason, type: string, source: input, required: false, description: "e.g. RIDER_CHANGED_MIND, OPS_STALE, OPS_UNRESOLVED" }
      - { name: adjustments, type: array, source: system, description: "List of adjustments with adjustment_id, direction, amount_cents, status" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Hub
    field: posture
    transitions:
      - from: NORMAL
        to: SAFETY_HOLD
        trigger: POST /hubs/:hub_id/posture
        actor: ops
        preconditions: []
        side_effects:
          - "REQUESTED rides → ON_HOLD with hold_reason=HUB_SAFETY_HOLD"
          - "DISPATCHED rides → ON_HOLD with hold_reason=HUB_SAFETY_HOLD, driver_id cleared, driver seats released"
          - "Rides keep request_seq and prepaid fields"

      - from: SAFETY_HOLD
        to: NORMAL
        trigger: POST /hubs/:hub_id/posture
        actor: ops
        preconditions: []
        side_effects:
          - "ON_HOLD rides with hold_reason=HUB_SAFETY_HOLD → REQUESTED (same request_seq, same prepaid fields)"
          - "Pass-related holds do NOT auto-restore"

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hubs/:hub_id/drivers/:driver_id/events (SUSPEND)"
        actor: ops
        preconditions: []
        side_effects:
          - "DISPATCHED rides for this driver → REQUESTED, driver seats released"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hubs/:hub_id/drivers/:driver_id/events (REINSTATE)"
        actor: ops
        preconditions: []
        side_effects: []

  - entity: Pass
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hubs/:hub_id/passes/:pass_id/events (SUSPEND)"
        actor: ops
        preconditions: []
        side_effects:
          - "Open rides using this pass → ON_HOLD with hold_reason=PASS_SUSPENDED"
          - "pass_seats_applied unwound to 0, seats_remaining restored"
          - "request_seq cleared"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hubs/:hub_id/passes/:pass_id/events (REINSTATE)"
        actor: ops
        preconditions: []
        side_effects:
          - "Pass-related holds do NOT auto-re-enter queue"

  - entity: Ride
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    transitions:
      - from: DRAFT
        to: REQUESTED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (SUBMIT)"
        actor: rider
        preconditions:
          - "Hub posture is NORMAL"
          - "No existing active ride for rider"
          - "WALLET_ONLY: wallet has sufficient funds"
          - "PASS_ONLY: pass is ACTIVE and owned by rider"
          - "PASS_THEN_WALLET: pass ACTIVE + owned; wallet covers remainder"
        side_effects:
          - "request_seq assigned"
          - "WALLET_ONLY: wallet charged (seat_count * pool_seat_price_cents)"
          - "PASS_ONLY: pass seats deducted if sufficient; else → WAITLISTED"
          - "PASS_THEN_WALLET: pass seats applied first, wallet covers rest"

      - from: DRAFT
        to: WAITLISTED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (SUBMIT)"
        actor: rider
        preconditions:
          - "PASS_ONLY with insufficient seats"
        side_effects:
          - "request_seq assigned"
          - "No seats consumed yet"

      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (DISPATCH)"
        actor: ops
        preconditions:
          - "Hub posture is NORMAL"
          - "Driver is ACTIVE"
          - "Driver has sufficient seat capacity"
        side_effects:
          - "driver_id set"
          - "Driver seats_assigned increases"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (START)"
        actor: ops
        preconditions:
          - "Hub posture is NORMAL"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (COMPLETE)"
        actor: ops
        preconditions: []
        side_effects:
          - "Driver seats_assigned decreases"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (CANCEL)"
        actor: "rider, driver, or ops"
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (CANCEL)"
        actor: "rider, driver, or ops"
        preconditions: []
        side_effects:
          - "Prepayment refunded (wallet credited, pass seats returned)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (CANCEL)"
        actor: "rider, driver, or ops"
        preconditions: []
        side_effects:
          - "Prepayment refunded"
          - "Driver seats_assigned decreases"

      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (CANCEL)"
        actor: "rider, driver, or ops"
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (CANCEL)"
        actor: "rider, driver, or ops"
        preconditions: []
        side_effects:
          - "Any remaining prepaid amounts refunded"

      - from: REQUESTED
        to: ON_HOLD
        trigger: "system (hub posture → SAFETY_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason=HUB_SAFETY_HOLD, keeps request_seq and prepaid fields"

      - from: DISPATCHED
        to: ON_HOLD
        trigger: "system (hub posture → SAFETY_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason=HUB_SAFETY_HOLD, driver_id cleared, driver seats released"

      - from: ON_HOLD
        to: REQUESTED
        trigger: "system (hub posture → NORMAL, hold_reason=HUB_SAFETY_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Same request_seq, same prepaid fields"

      - from: WAITLISTED
        to: REQUESTED
        trigger: "system (run_ops waitlist promotion)"
        actor: system
        preconditions:
          - "Pass has enough seats"
        side_effects:
          - "Pass seats consumed at promotion time"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /hubs/:hub_id/rides/:ride_id/events (VOID)"
        actor: ops
        preconditions:
          - "No non-voided adjustments (ERR_DEPENDENCY_EXISTS)"
        side_effects:
          - "Prepayment refunded (pass seats returned, wallet credited)"

      - from: DISPATCHED
        to: REQUESTED
        trigger: "system (driver suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "driver_id cleared, driver seats released"

      - from: "REQUESTED/DISPATCHED/ON_HOLD(HUB_SAFETY_HOLD)"
        to: CANCELLED
        trigger: "system (run_ops stale cleanup, unchanged through 2 ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_by=OPS, cancel_reason=OPS_STALE"
          - "Prepayment refunded"

      - from: "ON_HOLD(PASS_SUSPENDED/PASS_TRANSFERRED)"
        to: CANCELLED
        trigger: "system (run_ops stale cleanup, unchanged through 2 ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_by=OPS, cancel_reason=OPS_UNRESOLVED"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: wallet_charge
    trigger: "ride submit (WALLET_ONLY or PASS_THEN_WALLET)"
    algorithm: simple_multiplication
    formula: |
      wallet_charge_cents = remaining_seats * pool_seat_price_cents
      where remaining_seats = seat_count - pass_seats_applied (0 for WALLET_ONLY)
      pool_seat_price_cents is always 800 in v1

  - name: pass_seats_applied
    trigger: "ride submit (PASS_ONLY or PASS_THEN_WALLET)"
    algorithm: minimum
    formula: |
      PASS_ONLY: if pass.seats_remaining >= seat_count → pass_seats_applied = seat_count, status=REQUESTED
                 else → pass_seats_applied = 0, status=WAITLISTED
      PASS_THEN_WALLET: pass_seats_applied = min(pass.seats_remaining, seat_count)
                        wallet covers remainder

  - name: driver_seats_assigned
    trigger: "dispatch, complete, cancel, driver suspend, hub posture change"
    algorithm: aggregation
    formula: |
      seats_assigned = sum of seat_count across all DISPATCHED and IN_PROGRESS rides for this driver

  - name: stale_cleanup
    trigger: "run_ops"
    algorithm: threshold
    formula: |
      Rides unchanged through 2 ops runs (comparing ops_run_index at creation/last change):
      - REQUESTED, DISPATCHED, ON_HOLD(HUB_SAFETY_HOLD) → CANCELLED with OPS_STALE
      - ON_HOLD(PASS_SUSPENDED/PASS_TRANSFERRED) → CANCELLED with OPS_UNRESOLVED
      - WAITLISTED excluded from stale cleanup

  - name: waitlist_promotion
    trigger: "run_ops"
    algorithm: priority_queue
    formula: |
      For WAITLISTED rides where pass now has enough seats:
      Promote in order of lowest request_seq first.
      Consume pass seats at promotion time.
      Ride status → REQUESTED.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: format
    check: "Request body is valid JSON with required fields"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints

  - priority: 3
    category: concurrency
    check: "If-Match header required for PUT"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 428
    applies_to: "PUT /hubs/:hub_id/rides/:ride_id"

  - priority: 4
    category: concurrency
    check: "If-Match version must match current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PUT /hubs/:hub_id/rides/:ride_id"

  - priority: 5
    category: posture
    check: "Hub must be in NORMAL posture for SUBMIT, DISPATCH, START"
    error_id: ERR_HUB_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "SUBMIT, DISPATCH, START ride events"

  - priority: 6
    category: state
    check: "Resource must be in the correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 7
    category: constraint
    check: "General constraint violation (e.g., editing non-editable ride)"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: various

  - priority: 8
    category: business_pass
    check: "Pass must be ACTIVE to fund a ride"
    error_id: ERR_PASS_SUSPENDED
    http_status: 409
    applies_to: "SUBMIT ride event"

  - priority: 9
    category: business_pass
    check: "Pass must be owned by the rider"
    error_id: ERR_PASS_NOT_OWNED
    http_status: 403
    applies_to: "SUBMIT ride event"

  - priority: 10
    category: business_wallet
    check: "Wallet must have sufficient funds"
    error_id: ERR_WALLET_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "SUBMIT (WALLET_ONLY/PASS_THEN_WALLET), VOID_ADJUSTMENT"

  - priority: 11
    category: business_driver
    check: "Driver must be ACTIVE for dispatch"
    error_id: ERR_DRIVER_SUSPENDED
    http_status: 409
    applies_to: "DISPATCH ride event"

  - priority: 12
    category: business_driver
    check: "Driver seat capacity must not be exceeded"
    error_id: ERR_DRIVER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "DISPATCH ride event"

  - priority: 13
    category: business_dependency
    check: "Ride has non-voided adjustments blocking void"
    error_id: ERR_DEPENDENCY_EXISTS
    http_status: 409
    applies_to: "VOID ride event"

  - priority: 14
    category: business_uniqueness
    check: "Only one active ride per rider at a time"
    error_id: ERR_DUPLICATE_ACTIVE_RIDE
    http_status: 409
    applies_to: "SUBMIT ride event"

# =============================================================================
# Table 5: API Endpoint Table (16 endpoints)
# =============================================================================
endpoints:
  # --- Hub ---
  - method: POST
    path: "/hubs"
    description: "Create a new Hub"
    roles: [ops]
    code: 201
    input: [name]
    output: Hub
    side_effects: ["posture initialized to NORMAL, ops_run_index to 0, pool_seat_price_cents to 800"]

  - method: GET
    path: "/hubs/:hub_id"
    description: "Get a specific Hub"
    roles: [Any]
    code: 200
    input: []
    output: Hub
    side_effects: []

  - method: POST
    path: "/hubs/:hub_id/posture"
    description: "Change hub posture"
    roles: [ops]
    code: 200
    input: [posture, "note?"]
    output: Hub
    side_effects:
      - "NORMAL → SAFETY_HOLD: REQUESTED/DISPATCHED rides → ON_HOLD"
      - "SAFETY_HOLD → NORMAL: HUB_SAFETY_HOLD rides → REQUESTED"

  - method: POST
    path: "/hubs/:hub_id/run_ops"
    description: "Run the batch ops job"
    roles: [ops]
    code: 200
    input: []
    output: Hub
    side_effects:
      - "ops_run_index incremented"
      - "Waitlist promotion: WAITLISTED → REQUESTED when pass has seats"
      - "Stale cleanup: unchanged rides through 2 ops runs auto-cancelled"

  # --- Rider ---
  - method: POST
    path: "/hubs/:hub_id/riders"
    description: "Create a new Rider"
    roles: [Any]
    code: 201
    input: [name, "wallet_balance_cents?"]
    output: Rider
    side_effects: []

  - method: GET
    path: "/hubs/:hub_id/riders/:rider_id"
    description: "Get a specific Rider"
    roles: [Any]
    code: 200
    input: []
    output: Rider
    side_effects: []

  # --- Driver ---
  - method: POST
    path: "/hubs/:hub_id/drivers"
    description: "Create a new Driver"
    roles: [ops]
    code: 201
    input: [name, seat_capacity]
    output: Driver
    side_effects: ["status initialized to ACTIVE, seats_assigned to 0"]

  - method: GET
    path: "/hubs/:hub_id/drivers/:driver_id"
    description: "Get a specific Driver"
    roles: [Any]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/hubs/:hub_id/drivers/:driver_id/events"
    description: "Post a driver event (SUSPEND or REINSTATE)"
    roles: [ops]
    code: 200
    input: ["event_type, reason?, note?"]
    output: Driver
    side_effects:
      - "SUSPEND: DISPATCHED rides requeued to REQUESTED, driver seats released"
      - "REINSTATE: driver status → ACTIVE"

  # --- Pass ---
  - method: POST
    path: "/hubs/:hub_id/passes"
    description: "Create a new Pass"
    roles: [ops]
    code: 201
    input: [partner_ref, owner_rider_id, total_seats]
    output: Pass
    side_effects: ["status ACTIVE, seats_remaining = total_seats"]

  - method: GET
    path: "/hubs/:hub_id/passes/:pass_id"
    description: "Get a specific Pass"
    roles: [Any]
    code: 200
    input: []
    output: Pass
    side_effects: []

  - method: POST
    path: "/hubs/:hub_id/passes/:pass_id/events"
    description: "Post a pass event (TOP_UP, SUSPEND, REINSTATE, TRANSFER)"
    roles: [ops]
    code: 200
    input: ["event_type, added_seats?, to_rider_id?, reason?, note?"]
    output: Pass
    side_effects:
      - "TOP_UP: seats_remaining increases by added_seats"
      - "SUSPEND: open rides using pass → ON_HOLD(PASS_SUSPENDED), seats unwound"
      - "REINSTATE: pass status → ACTIVE (no auto-requeue)"
      - "TRANSFER: owner changes, open rides using pass → ON_HOLD(PASS_TRANSFERRED), seats unwound"

  # --- Ride ---
  - method: POST
    path: "/hubs/:hub_id/rides"
    description: "Create a new Ride in DRAFT"
    roles: [rider]
    code: 201
    input: [rider_id, kind, seat_count, payment_mode, "pass_id?, rider_note?"]
    output: Ride
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/hubs/:hub_id/rides/:ride_id"
    description: "Get a specific Ride"
    roles: [Any]
    code: 200
    input: []
    output: Ride
    side_effects: []

  - method: PUT
    path: "/hubs/:hub_id/rides/:ride_id"
    description: "Edit a ride (only from DRAFT, WAITLISTED, ON_HOLD)"
    roles: [rider]
    code: 200
    input: ["seat_count?, payment_mode?, pass_id?, rider_note?"]
    output: Ride
    side_effects:
      - "Ride resets to DRAFT, clears request_seq, hold_reason, driver_id"
      - "Refunds any prepaid amounts"
      - "Requires If-Match"

  - method: POST
    path: "/hubs/:hub_id/rides/:ride_id/events"
    description: "Post a ride event"
    roles: [rider, ops]
    code: 200
    input: ["event_type, driver_id?, cancel_by?, cancel_reason?, direction?, amount_cents?, adjustment_id?, void_reason?, note?"]
    output: Ride
    side_effects:
      - "SUBMIT: prepay and enter queue or waitlist"
      - "DISPATCH: assign driver, reserve seats"
      - "START: begin ride"
      - "COMPLETE: finish ride, release driver seats"
      - "CANCEL: refund if pre-START"
      - "ADJUST: create adjustment on COMPLETED ride"
      - "VOID_ADJUSTMENT: reverse an adjustment"
      - "VOID: void entire COMPLETED ride, refund all"

# =============================================================================
# Table 6: Error Code Catalogue (14 error codes)
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist within this hub"

  - id: ERR_MISSING_IF_MATCH
    http: 428
    condition: "PUT request missing If-Match header"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version does not match current version"

  - id: ERR_HUB_POSTURE_RESTRICTED
    http: 409
    condition: "Hub is in SAFETY_HOLD; SUBMIT, DISPATCH, START blocked"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the correct state for this operation"

  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "General constraint violation"

  - id: ERR_PASS_SUSPENDED
    http: 409
    condition: "Pass is SUSPENDED and cannot fund a ride"

  - id: ERR_PASS_NOT_OWNED
    http: 403
    condition: "Pass is not owned by the rider"

  - id: ERR_WALLET_INSUFFICIENT_FUNDS
    http: 402
    condition: "Wallet balance insufficient for the charge"

  - id: ERR_DRIVER_SUSPENDED
    http: 409
    condition: "Driver is SUSPENDED and cannot accept dispatches"

  - id: ERR_DRIVER_CAPACITY_EXCEEDED
    http: 409
    condition: "Driver does not have enough available seat capacity"

  - id: ERR_DEPENDENCY_EXISTS
    http: 409
    condition: "Ride has non-voided adjustments; void them before voiding the ride"

  - id: ERR_DUPLICATE_ACTIVE_RIDE
    http: 409
    condition: "Rider already has an active ride (REQUESTED/DISPATCHED/IN_PROGRESS/ON_HOLD/WAITLISTED)"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ops
    description: "Operations team managing hubs, drivers, passes, and ride dispatch"
    exclusive_operations:
      - "POST /hubs — Create hub"
      - "POST .../posture — Change hub posture"
      - "POST .../run_ops — Run batch ops"
      - "POST .../drivers — Create driver"
      - "POST .../drivers/:id/events — Suspend/reinstate driver"
      - "POST .../passes — Create pass"
      - "POST .../passes/:id/events — TOP_UP/SUSPEND/REINSTATE/TRANSFER pass"
      - "POST .../rides/:id/events (DISPATCH, ADJUST, VOID_ADJUSTMENT, VOID) — Ops ride events"

  - name: rider
    description: "Riders creating and managing their own rides"
    exclusive_operations:
      - "POST .../riders — Create rider"
      - "POST .../rides — Create ride"
      - "PUT .../rides/:id — Edit ride"
      - "POST .../rides/:id/events (SUBMIT, START, COMPLETE, CANCEL) — Rider ride events"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /hubs/:hub_id — Get hub"
      - "GET .../riders/:id — Get rider"
      - "GET .../drivers/:id — Get driver"
      - "GET .../passes/:id — Get pass"
      - "GET .../rides/:id — Get ride"
