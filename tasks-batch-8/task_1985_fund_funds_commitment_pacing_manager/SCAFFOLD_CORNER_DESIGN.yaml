            - call: "POST /fof/proposals/${prop}/ic-approve"
              payload: {}
              as: InvestmentCommittee
              as_user_id: "${ic}"
            - call: "GET /fof/proposals/${prop}/commitments"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { com: "$.data[0].id" }
            - call: "GET /fof/programs/${prog}"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { pv: $.data.version }
            - call: "POST /fof/programs/${prog}/commitments/${com}/execute"
              payload: { sized_amount: 5000000, expected_program_version: "${pv}" }
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/commitments/${com}/calls"
              payload: { amount: 1000000, purpose: "FEES", due_date: "2026-08-10T00:00:00Z" }
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { call1: $.data.id }
            - call: "POST /fof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: OperationsAnalyst
              as_user_id: "${ops}"
          trigger:
            - call: "POST /fof/calls/${call1}/cancel"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CALL_OVERDUE (clock past due_date)"
            - "CapitalCall.${call1}.status == ISSUED (unchanged; grace period 10 days means not yet OVERDUE either)"

      - name: overdue_sweep_flips_call_and_restricts_posture
        claim_type: valid_transition
        grounds: [state_machines.CapitalCall.ISSUED_to_OVERDUE, calculations.program_posture]
        distinguishing_aspect: "Clock advance beyond due_date + overdue_grace_days flips ISSUED -> OVERDUE (system transition) and posture recomputes to RESTRICTED; paying the overdue call is still allowed and restores NORMAL."
        test_recipe:
          setup: ["Program open with cash 20,000,000; EXECUTED commitment 5,000,000; ISSUED call 1,000,000 due 2026-08-10; grace 10 days; clock advanced to 2026-08-21"]
