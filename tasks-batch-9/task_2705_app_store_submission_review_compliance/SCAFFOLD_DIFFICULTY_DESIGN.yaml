            - { call: "GET /publisher-accounts/${acct_id}/standing", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
          assert:
            - "Creating exp1/exp2/exp3 -> 201 each with state REQUESTED and granted_at == null; standing still reports expedite_credits_remaining == 2, credits_used_in_window == 0 (a request consumes nothing)"
            - "After GRANT exp1: standing expedite_credits_remaining == 1, credits_used_in_window == 1; ExpediteRequest.${exp1_id}.state == GRANTED with granted_at == 2026-08-01T00:00:00Z"
            - "After GRANT exp2: standing expedite_credits_remaining == 0, credits_used_in_window == 2"
