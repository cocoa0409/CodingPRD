        distinguishing_aspect: |
          One endpoint forks on its decision argument into two structurally different outcomes: PASS
          approves the scoped stage tasks and credits shot BCWP, while FAIL drives the very same tasks
          to RETAKE and bumps retake counters. Both branches feed the same partner quality average.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with two shots of 1,000,000 cents each, and each shot's LAYOUT task has been assigned so it sits at IN_PROGRESS"
            - "Partner Northwind Animation is APPROVED at TIER1 with watermark_required false"
            - "two TIER1 packages each scope one shot's LAYOUT task, minimum quality score 50.00, and both have been delivered, which moved the scoped tasks from IN_PROGRESS to SUBMITTED"
            - "the clock stands at its 2026-08-01T00:00:00Z default so both QC decisions land inside the rolling 90-day window"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
