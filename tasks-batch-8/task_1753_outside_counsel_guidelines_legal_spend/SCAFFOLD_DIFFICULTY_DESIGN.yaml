                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 10.00, rate_cents: 100000 }
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L120", narrative: "did L110 then L220", hours: 5.00, rate_cents: 100000 }
              as: PanelFirmUser
