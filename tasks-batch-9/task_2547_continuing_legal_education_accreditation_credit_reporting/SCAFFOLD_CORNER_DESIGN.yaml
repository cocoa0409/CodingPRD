              captures: { v_b: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "FL", origin_course_title: "Florida diversity and inclusion workshop", origin_credit_hours: 1.5, origin_category: "DIVERSITY_INCLUSION", completion_date: "2026-03-03T00:00:00Z", expected_attorney_version: "${v_b}" }
              as: Attorney
