              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
          trigger:
            - call: "POST /fee-programs/${fp2}/publish"
              payload: { attestation_note: "One-second overlap attempt." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_FEE_PROGRAM_PERIOD_OVERLAP, because fp2.effective_from 2026-11-30T23:59:59Z < fp1.effective_to 2026-12-01T00:00:00Z and fp1.effective_from < fp2.effective_to"
            - "after the trigger: FeeProgram.${fp2}.status is still UNDER_REVIEW, published_at is null, attested_by_user_id is null, and Property.${p1}.published_fee_program_count is still 1"
            - "POST /fee-programs/${fp3}/publish then returns HTTP 200: fp3.effective_from == fp1.effective_to exactly, so BOTH strict inequalities fail and the touching pair is legal"
            - "after publishing fp3: FeeProgram.${fp3}.status == PUBLISHED, published_at == 2026-08-01T00:00:00Z, and Property.${p1}.published_fee_program_count == 2"
            - "the property's calendar therefore has zero gap between fp1 and fp3 — the instant 2026-12-01T00:00:00Z belongs to fp3 only, since fp1's end is exclusive"
            - "a fourth program authored for [2026-11-30T00:00:00Z, 2026-12-01T00:00:00Z) — fully inside fp1 — is also rejected with ERR_FEE_PROGRAM_PERIOD_OVERLAP at publish, proving containment counts as overlap and not merely a straddling edge"
            - "an implementation using non-strict comparisons (<=) would wrongly reject fp3; one using an inclusive end would wrongly accept fp2"

