# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2358 — Farmland Preservation Easement Purchase
#
# Nine §0.5 difficulty rules x 2 instances = 18 instances.
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert literal below was produced by executing the §1.3
# formulas as code against the pinned fixture inputs.
#
# Fixture identity conventions (opaque roles): "admin-1" ProgramAdmin,
# "officer-1" AcquisitionOfficer, "reviewer-1" AppraisalReviewer,
# "appraiser-1"/"appraiser-2" Appraiser, "monitor-1" StewardshipMonitor.
# Landowner ids are server-minted and captured.
#
# The logical clock starts at its declared default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: composite_score_receipt_basis_versus_round_close_basis
        grounds:
          - calculations.application_composite_score
          - entities.Application.fields.contiguity_acres_at_receipt
          - entities.Parcel.fields.contiguous_preserved_acres
          - entities.FundingRound.fields.score_basis
          - state_machines.Application.RECEIVED_to_RANKED
          - endpoints[POST /funding-rounds/{id}/rank]
        distinguishing_aspect: |
          Two structurally identical parcels whose contiguity was 80.00 acres at receipt and
          160.00 acres by ranking time score 73.40 under RECEIPT_BASIS and 85.90 under
          ROUND_CLOSE_BASIS — a 12.50-point divergence on identical stored data, located in
          the APPLICATION-RANKING domain (Application/Parcel/FundingRound), driven purely by
          which contiguity field the variant reads.
        test_recipe:
          setup:
            - "PreservationProgram P1 exists, ACTIVE, weights 0.35/0.15/0.25/0.25, min_composite_score 60.00."
            - "Three ACTIVE FundingSources on P1 (LOCAL priority 1, STATE priority 2, FEDERAL priority 3)."
            - "Two OPEN FundingRounds R1 and R2 on P1, both windowed 2026-08-05 .. 2026-09-30."
            - "One Landowner owning two identical parcels PA1 and PA2 (160.00 acres, 120.00 prime, 24.00 statewide-important, 80.00 contiguous, 640 ft frontage, sewer available, 2.0-acre zoning)."
            - "Application AP1 filed on R1 against PA1 and Application AP2 filed on R2 against PA2, both at clock 2026-08-10, both stamping contiguity_acres_at_receipt = 80.00."
            - "Both parcels then patched to contiguous_preserved_acres = 160.00, so the live value differs from the receipt value on both applications."
            - "Clock advanced to 2026-10-01, past both rounds' closes_on."
          setup_api_calls:
            - &c_prog1
              call: "POST /preservation-programs"
              payload: { name: "Statewide Farmland Preservation", soil_weight: 0.35, size_weight: 0.15, contiguity_weight: 0.25, pressure_weight: 0.25, min_composite_score: 60.00, max_negotiation_rounds: 3, local_match_min_pct: 0.25, federal_max_share_pct: 0.50, impervious_allowance_pct: 0.02, amendment_policy: "STRICT", monitoring_interval_days: 365, monitoring_grace_days: 30, appraisal_engagement_buffer_days: 3 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - &c_src_local
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "County Open Space Fund", level: "LOCAL", authorized_cents: 60000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.35, priority_order: 1, requires_match: false, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_local_id: $.data.id }
            - &c_src_state
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "State Farmland Trust", level: "STATE", authorized_cents: 120000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.40, priority_order: 2, requires_match: false, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_state_id: $.data.id }
            - &c_src_fed
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "Federal ACEP-ALE", level: "FEDERAL", authorized_cents: 200000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.25, priority_order: 3, requires_match: true, match_ratio: 1.0, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_fed_id: $.data.id }
            - &c_round1
              call: "POST /funding-rounds"
              payload: { program_id: "${prog_id}", round_label: "2026 Cycle A", opens_on: "2026-08-05T00:00:00Z", closes_on: "2026-09-30T00:00:00Z", pool_cents: 500000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { round1_id: $.data.id }
            - &c_round1_open
              call: "POST /funding-rounds/${round1_id}/opening"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_lo_a
              call: "POST /landowners"
              payload: { legal_name: "Harlan Family Trust", mailing_state: "PA", tax_id_last4: "4417" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { lo_a_id: $.data.id }
            - &c_clk_0810
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_parcel_a
              call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 24.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000, mortgage_lienholder_name: "Midstate Farm Credit" }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_a_id: $.data.id }
            - &c_app_a
              call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /funding-rounds"
              payload: { program_id: "${prog_id}", round_label: "2026 Cycle B", opens_on: "2026-08-05T00:00:00Z", closes_on: "2026-09-30T00:00:00Z", pool_cents: 500000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { round2_id: $.data.id }
            - call: "POST /funding-rounds/${round2_id}/opening"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 24.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000, mortgage_lienholder_name: "Midstate Farm Credit" }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_a2_id: $.data.id }
            - call: "POST /applications"
              payload: { funding_round_id: "${round2_id}", parcel_id: "${parcel_a2_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_a2_id: $.data.id }
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { parcel_a_v: $.data.version }
            - call: "PATCH /parcels/${parcel_a_id}"
              payload: { expected_parcel_version: "${parcel_a_v}", contiguous_preserved_acres: 160.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /parcels/${parcel_a2_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { parcel_a2_v: $.data.version }
            - call: "PATCH /parcels/${parcel_a2_id}"
              payload: { expected_parcel_version: "${parcel_a2_v}", contiguous_preserved_acres: 160.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_clk_1001
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - &c_rank_receipt_r1
              call: "POST /funding-rounds/${round1_id}/rank"
              payload: { score_basis: "RECEIPT_BASIS" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /funding-rounds/${round2_id}/rank"
              payload: { score_basis: "ROUND_CLOSE_BASIS" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Application.${app_a_id}.composite_score == 73.40"
            - "Application.${app_a2_id}.composite_score == 85.90"
            - "Application.${app_a2_id}.composite_score - Application.${app_a_id}.composite_score == 12.50"
            - "Application.${app_a_id}.contiguity_acres_at_receipt == 80.00 and Application.${app_a2_id}.contiguity_acres_at_receipt == 80.00"
            - "Parcel.${parcel_a_id}.contiguous_preserved_acres == 160.00 and Parcel.${parcel_a2_id}.contiguous_preserved_acres == 160.00"
            - "FundingRound.${round1_id}.score_basis == RECEIPT_BASIS and FundingRound.${round2_id}.score_basis == ROUND_CLOSE_BASIS"
            - "Application.${app_a_id}.status == RANKED and Application.${app_a2_id}.status == RANKED"
            - "Application.${app_a_id}.rank_position == 1 and Application.${app_a2_id}.rank_position == 1"

      - name: easement_value_preliminary_assessor_versus_certified_appraisal_basis
        grounds:
          - calculations.easement_value
          - entities.Application.fields.preliminary_easement_value_cents
          - entities.Application.fields.certified_easement_value_cents
          - entities.Appraisal.fields.easement_value_cents
          - state_machines.Appraisal.SUBMITTED_to_CERTIFIED
          - endpoints[POST /appraisals/{id}/review]
        distinguishing_aspect: |
          The same 175,550,000-cent unrestricted-minus-restricted spread yields 157,900,000
          under preliminary_assessor_basis (0.90 haircut, FLOOR to 100,000-cent units) and
          175,550,000 under certified_appraisal_basis (no haircut, ROUND_HALF_UP to
          10,000-cent units under a 1,200,000-cent-per-acre ceiling) — a 17,650,000-cent
          divergence in the VALUATION domain (Parcel/Appraisal), distinct from the
          ranking-domain variant above because the two bases differ in haircut, rounding
          direction AND rounding granularity rather than in which field they read.
        test_recipe:
          setup:
            - "Program P1, three funding sources, OPEN round R1, Landowner, Parcel PA1 and Application AP1 exist exactly as in composite_score_receipt_basis_versus_round_close_basis."
            - "Application AP1 already carries preliminary_easement_value_cents stamped at filing time."
            - "An Appraisal on AP1 is engaged to appraiser-1 for 2026-08-12 .. 2026-08-26 and has been SUBMITTED at clock 2026-08-20 with unrestricted 288,000,000 and restricted 112,450,000."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - &c_appraisal_a
              call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-1", appraiser_firm: "Keystone Rural Appraisal", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "PAIRED_SALES" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_a_id: $.data.id }
            - &c_clk_0820
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_appr_submit_a
              call: "POST /appraisals/${appr_a_id}/submission"
              payload: { unrestricted_value_cents: 288000000, restricted_value_cents: 112450000 }
              as: Appraiser
              as_user_id: "appraiser-1"
          trigger:
            - &c_appr_certify_a
              call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Application.${app_a_id}.preliminary_easement_value_cents == 157900000"
            - "Appraisal.${appr_a_id}.easement_value_cents == 175550000"
            - "Application.${app_a_id}.certified_easement_value_cents == 175550000"
            - "Application.${app_a_id}.certified_easement_value_cents - Application.${app_a_id}.preliminary_easement_value_cents == 17650000"
            - "Appraisal.${appr_a_id}.status == CERTIFIED"
            - "Appraisal.${appr_a_id}.basis == CERTIFIED_APPRAISAL_BASIS"
            - "Appraisal.${appr_a_id}.certified_by_user_id == reviewer-1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: funding_waterfall_per_source_floor_then_remainder_to_last_non_zero_take
        grounds:
          - calculations.funding_waterfall_allocation
          - entities.FundingSource.fields.max_share_pct
          - entities.FundingSource.fields.available_cents
          - entities.FundingCommitment.fields.absorbed_remainder_cents
          - entities.FundingCommitment.fields.sweep_order
          - validations[priority=28]
          - endpoints[POST /applications/{id}/funding-plan]
        distinguishing_aspect: |
          Mode (b) — ROUNDING ORDER. With max_share_pct 0.35/0.40/0.25 summing to exactly
          1.00 over a target of 160,364,925 cents, flooring each source's share
          independently yields caps 56,127,723 + 64,145,970 + 40,091,231 = 160,364,924, one
          cent short; the disciplined order (floor per source, THEN sum, THEN hand the
          1-cent residue to the LAST non-zero-take source without re-checking its
          max_share_pct) makes the FEDERAL commitment 40,091,232 with
          absorbed_remainder_cents == 1, whereas flooring the summed shares would produce
          40,091,231 and no remainder step at all.
        test_recipe:
          setup:
            - "Program P1 with local_match_min_pct 0.25 and federal_max_share_pct 0.50; three ACTIVE sources swept in priority order LOCAL(1, 60,000,000, 0.35) -> STATE(2, 120,000,000, 0.40) -> FEDERAL(3, 200,000,000, 0.25, requires_match, ratio 1.0), all windowed 2026-01-01 .. 2027-12-31."
            - "Application AP1 on Parcel PA1 is RANKED with composite_score 73.40 and certified_easement_value_cents 175,550,000."
            - "A BARGAIN_SALE offer of 175,550,000 with donation_pct 0.10 has been issued at clock 2026-10-05, so total_program_cost_cents == 160,364,925 and funding_plan_status == UNFUNDED."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - &c_clk_1005
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_get_app_a_v1
              call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_a_v1: $.data.version }
            - &c_offer_a
              call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v1}", offer_cents: 175550000, structure: "BARGAIN_SALE", donation_pct: 0.10, offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - &c_get_app_a_v2
              call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_a_v2: $.data.version }
          trigger:
            - &c_plan_a
              call: "POST /applications/${app_a_id}/funding-plan"
              payload: { expected_application_version: "${app_a_v2}", target_closing_date: "2027-01-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { plan_a_funded: $.data.funded_cost_cents, plan_a_remainder: $.data.remainder_absorbed_cents }
          assert:
            - "Application.${app_a_id}.total_program_cost_cents == 160364925"
            - "Application.${app_a_id}.funded_cost_cents == 160364925"
            - "Application.${app_a_id}.funding_plan_status == FUNDED"
            - "the response commitment_count == 3 and remainder_absorbed_cents == 1"
            - "the LOCAL commitment has amount_cents == 56127723, sweep_order == 1, absorbed_remainder_cents == 0, status == RESERVED"
            - "the STATE commitment has amount_cents == 64145970, sweep_order == 2, absorbed_remainder_cents == 0, status == RESERVED"
            - "the FEDERAL commitment has amount_cents == 40091232, sweep_order == 3, absorbed_remainder_cents == 1, status == RESERVED"
            - "56127723 + 64145970 + 40091232 == 160364925 exactly (no cent lost, none invented)"
            - "the FEDERAL commitment amount_cents 40091232 is one cent ABOVE its own cap floor(160364925 * 0.25) == 40091231, proving the remainder bypasses max_share_pct"
            - "federal_total_cents 40091232 <= floor(160364925 * 0.50) == 80182462"
            - "local_total_cents 56127723 >= ceil(160364925 * 0.25) == 40091232"
            - "FundingSource.${src_local_id}.reserved_cents == 56127723 and FundingSource.${src_local_id}.available_cents == 60000000 (RESERVED is deliberately not netted)"
            - "FundingSource.${src_state_id}.reserved_cents == 64145970 and FundingSource.${src_fed_id}.reserved_cents == 40091232"
            - "FundingSource.${src_local_id}.committed_cents == 0 and FundingSource.${src_state_id}.committed_cents == 0 and FundingSource.${src_fed_id}.committed_cents == 0"

      - name: admin_fee_tier_selected_on_pre_fee_bargain_sale_price_not_on_total
        grounds:
          - calculations.bargain_sale_and_admin_fee
          - entities.Application.fields.bargain_sale_price_cents
          - entities.Application.fields.admin_fee_cents
          - entities.Application.fields.total_program_cost_cents
          - state_machines.Application.RANKED_to_OFFER_ISSUED
          - endpoints[POST /applications/{id}/offers]
        distinguishing_aspect: |
          Mode (c) — CIRCULAR-LOOKING DEPENDENCY resolved by a pinned evaluation order.
          Parcel PD's offer of 74,500,000 with donation_pct 0 sits in the 0.020 tier because
          the tier is read off the PRE-FEE bargain_sale_price_cents (74,500,000 < 75,000,000),
          giving admin_fee_cents 1,490,000 and total_program_cost_cents 75,990,000; reading
          the tier off the resulting total (75,990,000 >= 75,000,000 -> 0.015) would give
          1,117,500 and 75,617,500. This is order-of-evaluation, not rounding order, so it is
          structurally distinct from the waterfall instance above.
        test_recipe:
          setup:
            - "Program P1 and its three funding sources exist; round R1 is OPEN."
            - "Landowner owns Parcel PA1 and additionally Parcel PD (80.00 acres, 72.00 prime, 8.00 statewide-important, 60.00 contiguous, 400 ft frontage, sewer available, 1.5-acre zoning, baseline_dwelling_rights 3, unrestricted 120,000,000, restricted 45,500,000, no lienholder)."
            - "Applications AP1 (PA1) and APD (PD) are both filed on R1 at clock 2026-08-10; APD's requested_price_cents is 70,000,000, within its 73,700,000 preliminary ceiling."
            - "An Appraisal on APD is CERTIFIED with unrestricted 120,000,000 and restricted 45,500,000, so certified_easement_value_cents == 74,500,000."
            - "R1 has been ranked at clock 2026-10-01 under RECEIPT_BASIS; APD is RANKED with composite_score 76.35. Clock is 2026-10-05."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - &c_parcel_d
              call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Berks", acres: 80.00, prime_soil_acres: 72.00, statewide_important_soil_acres: 8.00, contiguous_preserved_acres: 60.00, road_frontage_feet: 400, sewer_available: true, zoning_min_lot_acres: 1.5, baseline_dwelling_rights: 3, unrestricted_value_cents: 120000000, restricted_value_cents: 45500000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_d_id: $.data.id }
            - &c_app_d
              call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_d_id}", landowner_id: "${lo_a_id}", requested_price_cents: 70000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_d_id: $.data.id }
            - &c_appraisal_d
              call: "POST /applications/${app_d_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Conestoga Valuation", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "INCOME_CAPITALIZATION" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_d_id: $.data.id }
            - *c_clk_0820
            - &c_appr_submit_d
              call: "POST /appraisals/${appr_d_id}/submission"
              payload: { unrestricted_value_cents: 120000000, restricted_value_cents: 45500000 }
              as: Appraiser
              as_user_id: "appraiser-2"
            - &c_appr_certify_d
              call: "POST /appraisals/${appr_d_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - call: "GET /applications/${app_d_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_d_v1: $.data.version }
          trigger:
            - call: "POST /applications/${app_d_id}/offers"
              payload: { expected_application_version: "${app_d_v1}", offer_cents: 74500000, structure: "FULL_PURCHASE", donation_pct: 0, offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "Application.${app_d_id}.composite_score == 76.35"
            - "Application.${app_d_id}.certified_easement_value_cents == 74500000"
