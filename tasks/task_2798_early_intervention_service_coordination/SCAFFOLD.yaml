# =============================================================================
# PRD Benchmark Seed Tables — Early Intervention Service Coordination
# Task 2798 | §1.0–§1.7 (§1.8 and §1.9 live in their own sibling files)
# =============================================================================

scenario: |
  2798. Early Intervention Service Coordination (state early intervention
  program): referral intake with primary referral source reporting and timeline
  start, initial evaluation and assessment completion within the statutory
  period, family assessment and individualized family service plan development
  in natural environments, service coordinator assignment, caseload standards
  and monthly contact requirements, provider authorization, service delivery
  documentation and makeup visits, family cost participation with sliding scale
  and insurance use consent, transition planning to preschool services with
  notification deadlines, child outcome measurement at entry and exit

domain_name: early-intervention-service-coordination
api_prefix: /ei

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: beyond_expert          # §0.4 Expert band, pushed on coupling density
  primary_archetype: compliance_audit      # statutory clocks, mandated sequences, audit-grade ledgers
  secondary_archetype: quota_allocation    # weighted caseload standards + service-unit pools
  complexity_layers:
    - optimistic_concurrency               # OCC on Referral.version for CREATE-with-supersede IFSPs
    - cascading_side_effects               # 4–5 hop propagation chains (§1.2 side_effects)
    - dual_variant_calculation             # statutory-timeline variants; provisional vs final family fee
    - selector_policy                      # server-side service coordinator auto-selection

  entity_topology: graph
  # Peer collections joined by explicit FKs, two self-referential chains
  # (IFSP.supersedes_ifsp_id, ServiceVisit.makeup_for_visit_id) and one
  # many-to-many junction (ProviderAuthorization joins IFSPService x Provider).

  state_machine_shape: cyclic
  secondary_state_machine_shapes: [branching, parallel, compound]
  # cyclic: IFSPService AT_RISK -> IN_DELIVERY -> AT_RISK; ProviderAuthorization
  #         EXHAUSTED -> ACTIVE on visit void; Referral IFSP_PENDING ->
  #         EVALUATION_PENDING revert on supplemental evaluation.
  # branching: Referral EVALUATION_PENDING forks to ELIGIBILITY_DETERMINED or
  #         NOT_ELIGIBLE; TransitionPlan DRAFT forks to NOTIFIED or OPT_OUT.
  # parallel: ServiceVisit carries visit_status x billing_status independently.
  # compound: IFSPService.status and Referral.service_gap_flag derive from
  #         child/sibling aggregates.

  relationship_patterns:
    - one_to_many          # Referral -> Assessment / ContactLog / CostShare / IFSP
    - many_to_many         # IFSPService <-> Provider via ProviderAuthorization
    - self_referential     # IFSP.supersedes_ifsp_id, ServiceVisit.makeup_for_visit_id
    - cross_aggregate      # ServiceVisit delivery mutates CostShare + ServiceCoordinator

  role_model: segregation_of_duties
  # The FiscalOfficer who determined a CostShare may not waive its balance;
  # peer ownership on top (Provider owns its visits, ServiceCoordinator owns
  # its caseload's referrals, FamilyRepresentative owns its child's consents).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Subject of service -----------------------------------------------------
  - name: Child
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: first_name, type: string, source: input, description: "Child given name" }
      - { name: last_name, type: string, source: input, description: "Child family name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date, YYYY-MM-DD", constraints: "must be a calendar date not later than the logical clock date" }
      - { name: county_code, type: string, source: input, description: "County of residence; matched against ServiceCoordinator.county_code during assignment", constraints: "non-empty uppercase token" }
      - { name: primary_language, type: string, source: input, description: "Family primary language code, e.g. EN or ES", constraints: "non-empty uppercase token" }
      - { name: third_birthday_date, type: string, source: computed, description: "date_of_birth plus 3 calendar years; when date_of_birth is 02-29 the anniversary falls on 02-28. Anchors the transition notification window" }
      - { name: active_referral_count, type: integer, source: computed, default: 0, description: "Count of Referral rows for this child with status NOT IN {NOT_ELIGIBLE, EXITED}" }

  # --- Case record and statutory clock ---------------------------------------
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the referred child" }
      - { name: primary_referral_source, type: enum, source: input, description: "Federally reported primary referral source", constraints: "PHYSICIAN | HOSPITAL | PARENT | CHILD_CARE | SOCIAL_SERVICES | PUBLIC_HEALTH | EARLY_HEAD_START | OTHER" }
      - { name: referral_received_date, type: string, source: input, description: "Date the program received the referral; day 0 of the 45-day statutory timeline", constraints: "YYYY-MM-DD, not after the logical clock date" }
      - { name: county_code, type: string, source: input, description: "Serving county for this case; must match the assigned coordinator county" }
      - { name: presenting_concern, type: string, source: input, description: "Narrative reason for referral" }
      - { name: interpreter_required, type: boolean, source: input, default: false, description: "True when the family needs an interpreter; adds 0.50 to the weighted caseload contribution and constrains coordinator eligibility" }
      - { name: coordinator_id, type: string, source: system, default: null, description: "FK -> ServiceCoordinator.id; assigned service coordinator, null until assignment" }
      - { name: assignment_date, type: string, source: system, default: null, description: "Logical clock date on which the coordinator was assigned" }
      - { name: statutory_deadline_date, type: string, source: computed, description: "referral_received_date + 45 calendar days; the initial IFSP meeting must occur on or before this date" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", constraints: "INTAKE | EVALUATION_PENDING | ELIGIBILITY_DETERMINED | IFSP_PENDING | ACTIVE_SERVICES | NOT_ELIGIBLE | EXITED" }
      - { name: eligibility_status, type: enum, source: system, default: PENDING, description: "Outcome of the eligibility determination", constraints: "PENDING | ELIGIBLE | NOT_ELIGIBLE" }
      - { name: eligibility_determination_date, type: string, source: system, default: null, description: "Date the determination was recorded" }
      - { name: initial_ifsp_meeting_date, type: string, source: system, default: null, description: "meeting_date of the INITIAL IFSP; stops the 45-day statutory clock" }
      - { name: excluded_delay_days, type: integer, source: computed, default: 0, description: "Sum of Assessment.family_unavailable_days over Assessment rows on this referral with status == COMPLETED" }
      - { name: gross_elapsed_days, type: integer, source: computed, default: 0, description: "Whole days from referral_received_date (exclusive) to the timeline stop date (inclusive); see calculations.initial_timeline_elapsed_days" }
      - { name: net_elapsed_days, type: integer, source: computed, default: 0, description: "max(0, gross_elapsed_days - excluded_delay_days)" }
      - { name: initial_timeline_status, type: enum, source: computed, default: IN_PROGRESS, description: "Persisted statutory verdict; uses the net-of-documented-delay variant only", constraints: "IN_PROGRESS | MET | MISSED" }
      - { name: case_weight_points, type: number, source: computed, default: 0, description: "This case's weighted caseload contribution, 2 decimals; 0 once the case is terminal" }
      - { name: entry_rating_social, type: integer, source: system, default: null, description: "Entry child-outcome rating for positive social relationships, 1..7" }
      - { name: entry_rating_knowledge, type: integer, source: system, default: null, description: "Entry rating for acquiring and using knowledge and skills, 1..7" }
      - { name: entry_rating_needs, type: integer, source: system, default: null, description: "Entry rating for taking action to meet needs, 1..7" }
      - { name: entry_outcomes_date, type: string, source: system, default: null, description: "Date the entry outcome ratings were recorded" }
      - { name: exit_rating_social, type: integer, source: system, default: null, description: "Exit rating for positive social relationships, 1..7" }
      - { name: exit_rating_knowledge, type: integer, source: system, default: null, description: "Exit rating for acquiring and using knowledge and skills, 1..7" }
      - { name: exit_rating_needs, type: integer, source: system, default: null, description: "Exit rating for taking action to meet needs, 1..7" }
      - { name: services_start_date, type: string, source: system, default: null, description: "consent_signed_date of the first IFSP that reached ACTIVE on this referral" }
      - { name: exit_date, type: string, source: system, default: null, description: "Date the case exited the program" }
      - { name: exit_reason, type: enum, source: system, default: null, description: "Exit reason", constraints: "REACHED_AGE_THREE | FAMILY_WITHDREW | MOVED_OUT_OF_STATE | NO_LONGER_ELIGIBLE" }
      - { name: service_duration_days, type: integer, source: computed, default: 0, description: "exit_date - services_start_date in whole days; 0 while services_start_date is null" }
      - { name: progress_category_social, type: enum, source: computed, default: null, description: "Federal progress category for social relationships", constraints: "a | b | c | d | e | NOT_COMPARABLE" }
      - { name: progress_category_knowledge, type: enum, source: computed, default: null, description: "Federal progress category for knowledge and skills", constraints: "a | b | c | d | e | NOT_COMPARABLE" }
      - { name: progress_category_needs, type: enum, source: computed, default: null, description: "Federal progress category for taking action to meet needs", constraints: "a | b | c | d | e | NOT_COMPARABLE" }
      - { name: last_qualifying_contact_date, type: string, source: computed, default: null, description: "Latest ContactLog.contact_date among rows with qualifies_for_monthly_requirement == true" }
      - { name: monthly_contact_status, type: enum, source: computed, default: NOT_APPLICABLE, description: "Monthly contact compliance for an ACTIVE_SERVICES case", constraints: "NOT_APPLICABLE | COMPLIANT | DUE | DELINQUENT" }
      - { name: service_gap_flag, type: boolean, source: computed, default: false, description: "True when at least one IFSPService on this referral's ACTIVE IFSP has status == AT_RISK" }

  # --- Staffing / caseload standards ------------------------------------------
  - name: ServiceCoordinator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Coordinator name" }
      - { name: county_code, type: string, source: input, description: "County this coordinator serves; must equal Referral.county_code to be eligible" }
      - { name: language_codes, type: array, source: input, description: "Language codes the coordinator can serve directly", constraints: "non-empty array of uppercase tokens" }
      - { name: max_weighted_caseload_points, type: number, source: input, description: "State caseload standard ceiling in weighted points", constraints: "1.00 .. 40.00, two decimals" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "Only ACTIVE coordinators enter the assignment candidate pool", constraints: "ACTIVE | INACTIVE" }
      - { name: weighted_caseload_points, type: number, source: computed, default: 0, description: "Sum of Referral.case_weight_points over non-terminal referrals assigned to this coordinator, 2 decimals" }
      - { name: active_case_count, type: integer, source: computed, default: 0, description: "Count of assigned referrals with status NOT IN {NOT_ELIGIBLE, EXITED}" }
      - { name: utilization_ratio, type: number, source: computed, default: 0, description: "weighted_caseload_points / max_weighted_caseload_points, round_half_up to 4 decimals" }

  # --- Evaluation and family assessment ---------------------------------------
  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; case being evaluated" }
      - { name: assessment_type, type: enum, source: input, description: "Kind of assessment", constraints: "INITIAL_EVALUATION | FAMILY_ASSESSMENT | SUPPLEMENTAL_EVALUATION" }
      - { name: scheduled_date, type: string, source: input, description: "Planned date, YYYY-MM-DD" }
      - { name: setting_code, type: enum, source: input, description: "Where the assessment happens", constraints: "HOME | COMMUNITY_CHILDCARE | COMMUNITY_OTHER | CLINIC | PROGRAM_OFFICE" }
      - { name: natural_environment_justification, type: string, source: input, default: null, description: "Written justification, required when setting_code IN {CLINIC, PROGRAM_OFFICE}", constraints: "when present, at least 20 characters" }
      - { name: domains_assessed, type: array, source: input, default: null, description: "Developmental domains covered", constraints: "subset of {PHYSICAL, COGNITIVE, COMMUNICATION, SOCIAL_EMOTIONAL, ADAPTIVE}; must contain all five for INITIAL_EVALUATION" }
      - { name: evaluator_user_id, type: string, source: system, description: "X-User-ID of the Evaluator who created the row (opaque operator id)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Assessment lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: completion_date, type: string, source: system, default: null, description: "Date the assessment was completed" }
      - { name: family_unavailable_days, type: integer, source: system, default: 0, description: "Documented days the family was unavailable; the only input to Referral.excluded_delay_days", constraints: "0 .. 120" }
      - { name: eligibility_recommendation, type: enum, source: system, default: null, description: "Evaluator recommendation recorded at completion", constraints: "ELIGIBLE | NOT_ELIGIBLE | INCONCLUSIVE" }

  # --- The plan ---------------------------------------------------------------
  - name: IFSP
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; case this plan belongs to" }
      - { name: ifsp_type, type: enum, source: input, description: "INITIAL is the first plan; ANNUAL supersedes an ACTIVE plan", constraints: "INITIAL | ANNUAL" }
      - { name: meeting_date, type: string, source: input, description: "IFSP team meeting date; for INITIAL plans this is the statutory clock stop date", constraints: "YYYY-MM-DD, not after the logical clock date" }
      - { name: supersedes_ifsp_id, type: string, source: input, default: null, description: "FK -> IFSP.id; prior plan this plan replaces. Required for ANNUAL, forbidden for INITIAL" }
      - { name: authoring_coordinator_id, type: string, source: input, description: "FK -> ServiceCoordinator.id; coordinator credited with authoring the plan, normally the referral's assigned coordinator" }
      - { name: natural_environment_justification, type: string, source: input, default: null, description: "Plan-level justification, required at consent when non_natural_setting_line_count > 0", constraints: "when present, at least 20 characters" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Plan lifecycle", constraints: "DRAFT | PENDING_CONSENT | ACTIVE | AMENDMENT_PENDING | SUPERSEDED | CLOSED | WITHDRAWN" }
      - { name: consent_scope, type: enum, source: system, default: null, description: "Scope of the parental consent recorded", constraints: "FULL | PARTIAL" }
      - { name: consent_signed_date, type: string, source: system, default: null, description: "Date the parent signed consent" }
      - { name: consent_user_id, type: string, source: system, default: null, description: "X-User-ID of the consenting FamilyRepresentative; equals the referral's child_id" }
      - { name: activated_date, type: string, source: system, default: null, description: "Date the plan most recently reached ACTIVE" }
      - { name: service_line_count, type: integer, source: computed, default: 0, description: "Count of IFSPService rows on this plan with status NOT IN {DISCONTINUED}" }
      - { name: non_natural_setting_line_count, type: integer, source: computed, default: 0, description: "Count of non-DISCONTINUED IFSPService rows whose setting_code IN {CLINIC, PROGRAM_OFFICE}" }

  - name: IFSPService
    parent: null
    common_fields: true
    fields:
      - { name: ifsp_id, type: string, source: input, description: "FK -> IFSP.id; plan this service line belongs to" }
      - { name: service_type, type: enum, source: input, description: "Early intervention service", constraints: "SPEECH_THERAPY | OCCUPATIONAL_THERAPY | PHYSICAL_THERAPY | DEVELOPMENTAL_INSTRUCTION | SOCIAL_WORK | SERVICE_COORDINATION | EVALUATION_ASSESSMENT" }
      - { name: setting_code, type: enum, source: input, description: "Where the service is delivered", constraints: "HOME | COMMUNITY_CHILDCARE | COMMUNITY_OTHER | CLINIC | PROGRAM_OFFICE" }
      - { name: natural_environment_justification, type: string, source: input, default: null, description: "Required when setting_code IN {CLINIC, PROGRAM_OFFICE}", constraints: "when present, at least 20 characters" }
      - { name: frequency_per_month, type: integer, source: input, description: "Planned sessions per month", constraints: "1 .. 30" }
      - { name: units_per_session, type: integer, source: input, description: "15-minute units per session", constraints: "1 .. 8" }
      - { name: unit_rate_cents, type: integer, source: input, description: "State rate per 15-minute unit, in cents", constraints: "1 .. 100000" }
      - { name: planned_units_total, type: integer, source: input, description: "Total units the plan authorizes for this line; the conserved quantity of the unit-pool invariant", constraints: "1 .. 4000" }
      - { name: family_fee_exempt, type: boolean, source: computed, description: "True when service_type IN {SERVICE_COORDINATION, EVALUATION_ASSESSMENT}; exempt lines never enter the family fee formula and never accrue a family share" }
      - { name: units_committed, type: integer, source: computed, default: 0, description: "Sum of authorized_units over ProviderAuthorization rows with status IN {ACTIVE, EXHAUSTED, SUSPENDED} plus (authorized_units - units_released) over rows with status IN {REVOKED, EXPIRED}" }
      - { name: units_pool_remaining, type: integer, source: computed, default: 0, description: "planned_units_total - units_committed" }
      - { name: units_delivered, type: integer, source: computed, default: 0, description: "Sum of actual_units over ServiceVisit rows on this line with visit_status == DELIVERED" }
      - { name: makeup_owed_units, type: integer, source: computed, default: 0, description: "Outstanding makeup obligation in units, floored at 0" }
      - { name: declined_by_family, type: boolean, source: system, default: false, description: "True when this line was named in a PARTIAL consent's declined_service_ids" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Service line lifecycle", constraints: "PLANNED | AUTHORIZED | IN_DELIVERY | AT_RISK | COMPLETED | DISCONTINUED" }

  # --- Provider network and authorization --------------------------------------
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Provider agency or independent practitioner name" }
      - { name: qualified_service_types, type: array, source: input, description: "Service types this provider is credentialed to deliver", constraints: "non-empty subset of the IFSPService.service_type enum" }
      - { name: credential_expiry_date, type: string, source: input, description: "Date the provider credential lapses; an authorization end_date after this date is rejected", constraints: "YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Provider standing; TERMINATED is terminal and revokes the provider's authorizations instead of suspending them", constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: suspension_reason_code, type: enum, source: system, default: null, description: "Reason recorded at suspension or termination; CONTRACT_ENDED selects the TERMINATED branch, every other code selects SUSPENDED", constraints: "CREDENTIAL_LAPSE | QUALITY_CONCERN | BILLING_AUDIT | VOLUNTARY_WITHDRAWAL | CONTRACT_ENDED" }
      - { name: suspended_date, type: string, source: system, default: null, description: "effective_date recorded when the provider left ACTIVE standing" }
      - { name: active_authorization_count, type: integer, source: computed, default: 0, description: "Count of ProviderAuthorization rows for this provider with status == ACTIVE" }

  - name: ProviderAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: ifsp_service_id, type: string, source: input, description: "FK -> IFSPService.id; the service line being funded" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the authorized provider" }
      - { name: start_date, type: string, source: input, description: "First date of the authorization window, inclusive", constraints: "YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last date of the authorization window, inclusive", constraints: "YYYY-MM-DD, >= start_date" }
      - { name: authorized_units, type: integer, source: input, description: "Units drawn from the service line's pool", constraints: "1 .. 4000" }
      - { name: unit_rate_cents, type: integer, source: computed, description: "Copied from IFSPService.unit_rate_cents at creation and pinned for the life of this authorization" }
      - { name: units_consumed, type: integer, source: computed, default: 0, description: "Sum of actual_units over this authorization's ServiceVisit rows with visit_status == DELIVERED" }
      - { name: units_released, type: integer, source: computed, default: 0, description: "Units returned to the service pool at revocation; equals units_remaining at the moment of revocation, 0 otherwise" }
      - { name: units_remaining, type: integer, source: computed, description: "authorized_units - units_consumed - units_released" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Authorization lifecycle; EXPIRED is reached when the logical clock passes end_date and releases the unspent units", constraints: "ACTIVE | EXHAUSTED | SUSPENDED | REVOKED | EXPIRED" }
      - { name: revoked_date, type: string, source: system, default: null, description: "Logical clock date of revocation" }
      - { name: revocation_reason_code, type: enum, source: system, default: null, description: "Reason recorded at revocation", constraints: "PROVIDER_SUSPENDED | PROVIDER_TERMINATED | PLAN_SUPERSEDED | CASE_EXITED | ADMIN_CORRECTION | FAMILY_REQUEST | WINDOW_EXPIRED" }

  # --- Service delivery documentation (event-shaped, self-referential) ---------
  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: provider_authorization_id, type: string, source: input, description: "FK -> ProviderAuthorization.id; the authorization this visit draws from" }
      - { name: makeup_for_visit_id, type: string, source: input, default: null, description: "FK -> ServiceVisit.id; the provider-cancelled visit this visit makes up, null for ordinary visits" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start, ISO 8601 UTC with three fractional digits tolerated; interval is half-open [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end, exclusive", constraints: "strictly after scheduled_start; the duration must be a whole multiple of 15 minutes" }
      - { name: setting_code, type: enum, source: input, description: "Where this session occurs; a change of setting between consecutive same-provider visits requires a 30-minute travel buffer", constraints: "HOME | COMMUNITY_CHILDCARE | COMMUNITY_OTHER | CLINIC | PROGRAM_OFFICE" }
      - { name: scheduled_units, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in minutes / 15" }
      - { name: actual_units, type: integer, source: system, default: null, description: "Units actually delivered, recorded at documentation", constraints: "1 .. scheduled_units" }
      - { name: actual_start, type: datetime, source: system, default: null, description: "Actual session start recorded at documentation" }
      - { name: actual_end, type: datetime, source: system, default: null, description: "Actual session end recorded at documentation" }
      - { name: session_note, type: string, source: system, default: null, description: "Delivery note captured at documentation" }
      - { name: documented_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the documenting provider; equals the authorization's provider_id" }
      - { name: visit_status, type: enum, source: system, default: SCHEDULED, description: "Delivery dimension, independent of billing_status", constraints: "SCHEDULED | DELIVERED | FAMILY_CANCELLED | NO_SHOW | CANCELLED_PROVIDER | CANCELLED_PROGRAM | VOIDED" }
      - { name: billing_status, type: enum, source: system, default: PENDING, description: "Family-fee dimension, independent of visit_status", constraints: "PENDING | ACCRUED | EXEMPT | CAPPED | REVERSED | CANCELLED_NO_CHARGE" }
      - { name: family_share_cents, type: integer, source: computed, default: 0, description: "Family share accrued by this visit after the monthly cap remainder is applied" }
      - { name: void_reason_code, type: enum, source: system, default: null, description: "Reason recorded at void", constraints: "DOCUMENTATION_ERROR | DUPLICATE_ENTRY | AUDIT_REVERSAL" }

  # --- Family cost participation ----------------------------------------------
  - name: CostShare
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; case whose family fee this row determines" }
      - { name: effective_month, type: string, source: input, description: "Month this determination governs, YYYY-MM", constraints: "YYYY-MM; unique per referral_id" }
      - { name: household_size, type: integer, source: input, description: "Household size used for the federal poverty level threshold", constraints: "1 .. 12" }
      - { name: declared_annual_gross_income_cents, type: integer, source: input, description: "Self-declared annual gross household income in cents", constraints: ">= 0" }
      - { name: verified_annual_gross_income_cents, type: integer, source: system, default: null, description: "Verified income recorded at finalization" }
      - { name: insurance_use_consent, type: boolean, source: input, description: "True when the family consents to use of private insurance; only a consented policy produces an offset" }
      - { name: insurance_policy_id, type: string, source: input, default: null, description: "Private insurance policy identifier; required when insurance_use_consent is true" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of the FiscalOfficer who created this determination; may not be the waiving officer" }
      - { name: fpl_threshold_cents, type: integer, source: computed, description: "FPL_BASE_CENTS + (household_size - 1) * FPL_PER_ADDITIONAL_MEMBER_CENTS" }
      - { name: fpl_percent, type: number, source: computed, description: "Income as a percentage of fpl_threshold_cents for the currently effective income, round_half_up to 1 decimal" }
      - { name: tier_code, type: enum, source: computed, description: "Sliding-scale tier selected by fpl_percent", constraints: "TIER_0 | TIER_1 | TIER_2 | TIER_3" }
      - { name: coinsurance_rate, type: number, source: computed, description: "Sliding-scale rate selected by fpl_percent" }
      - { name: monthly_cap_cents, type: integer, source: computed, description: "Sliding-scale monthly ceiling selected by fpl_percent" }
      - { name: assessed_monthly_fee_cents, type: integer, source: computed, default: 0, description: "Provisional monthly fee from the self-declared variant" }
      - { name: insurance_offset_cents, type: integer, source: computed, default: 0, description: "60% of the capped monthly fee, applied by the FINAL variant only and only when insurance_use_consent is true with an insurance_policy_id on file" }
      - { name: final_monthly_fee_cents, type: integer, source: computed, default: null, description: "Final monthly fee from the verified variant, net of insurance_offset_cents; null until finalization" }
      - { name: effective_coinsurance_rate, type: number, source: computed, default: 0, description: "Rate used for per-visit accrual: the provisional tier rate while status == PROVISIONAL, the verified tier rate once status == VERIFIED" }
      - { name: total_assessed_cents, type: integer, source: computed, default: 0, description: "Cumulative family share accrued by delivered visits; the conserved quantity of the family ledger invariant" }
      - { name: family_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding family balance" }
      - { name: family_waived_cents, type: integer, source: computed, default: 0, description: "Cumulative amount waived by a second fiscal officer" }
      - { name: waiver_reason_code, type: enum, source: system, default: null, description: "Reason recorded on the most recent waiver", constraints: "HARDSHIP | ADMIN_ERROR | PROGRAM_POLICY" }
      - { name: month_accrued_cents, type: integer, source: computed, default: 0, description: "Cumulative accrual charged against this row's monthly_cap_cents" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "Determination lifecycle; a later effective_month supersedes an earlier row", constraints: "PROVISIONAL | VERIFIED | SUPERSEDED | CLOSED" }
      - { name: verification_date, type: string, source: system, default: null, description: "Date income verification was recorded" }

  # --- Monthly contact log (append-only, no version) ---------------------------
  - name: ContactLog
    parent: null
    common_fields: false          # id + created_at only; append-only, never mutated
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; taken from the request path" }
      - { name: contact_date, type: string, source: input, description: "Date of the contact", constraints: "YYYY-MM-DD, not after the logical clock date" }
      - { name: contact_month, type: string, source: computed, description: "YYYY-MM prefix of contact_date" }
      - { name: contact_method, type: enum, source: input, description: "How the contact happened; only HOME_VISIT, PHONE and VIDEO satisfy the monthly requirement", constraints: "HOME_VISIT | PHONE | VIDEO | EMAIL | LETTER" }
      - { name: contact_type, type: enum, source: input, description: "Purpose of the contact", constraints: "MONTHLY_CHECK_IN | SERVICE_REVIEW | CRISIS | TRANSITION_PLANNING" }
      - { name: summary, type: string, source: input, description: "Contact narrative" }
      - { name: qualifies_for_monthly_requirement, type: boolean, source: computed, description: "True when contact_method IN {HOME_VISIT, PHONE, VIDEO}" }

  # --- Transition to preschool services ---------------------------------------
  - name: TransitionPlan
    parent: null
    common_fields: true
    fields:
      - { name: ifsp_id, type: string, source: input, description: "FK -> IFSP.id; the ACTIVE plan this transition plan hangs off; at most one per plan" }
      - { name: target_conference_date, type: string, source: input, description: "Planned transition conference date", constraints: "YYYY-MM-DD" }
      - { name: conference_held_date, type: string, source: input, default: null, description: "Date the transition conference actually took place; must be present before the LEA notification is sent" }
      - { name: transition_steps_count, type: integer, source: input, default: 0, description: "Number of documented transition steps and services in the plan; must be at least 1 before notification", constraints: "0 .. 20" }
      - { name: lea_code, type: string, source: system, default: null, description: "Local education agency notified; must be absent when family_opt_out is true" }
      - { name: notification_date, type: string, source: system, default: null, description: "Date the LEA notification was sent" }
      - { name: family_opt_out, type: boolean, source: system, default: false, description: "True when the family declined LEA notification" }
      - { name: opt_out_signed_date, type: string, source: system, default: null, description: "Date the family signed the opt-out; required when family_opt_out is true" }
      - { name: notification_lead_days, type: integer, source: computed, default: null, description: "Child.third_birthday_date - notification_date in whole days" }
      - { name: notification_compliance, type: enum, source: computed, default: null, description: "Deadline verdict", constraints: "TIMELY | LATE | EARLY | WAIVED_OPT_OUT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Transition plan lifecycle", constraints: "DRAFT | NOTIFIED | OPT_OUT | COMPLETE | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Referral — branching fork (eligible / not eligible) + revert cycle
  # (IFSP_PENDING -> EVALUATION_PENDING) + compound flags derived from children.
  # ---------------------------------------------------------------------------
  - entity: Referral
    state_field: status
    initial_state: INTAKE
    terminal_states: [NOT_ELIGIBLE, EXITED]
    transitions:
      - from: INTAKE
        to: EVALUATION_PENDING
        trigger: "POST /ei/referrals/{referralId}/assign-coordinator"
        actor: ProgramAdmin
        preconditions:
          - "referral.status == INTAKE"
          - "when coordinator_id is supplied: that coordinator satisfies every clause of the eligibility filter in calculations.coordinator_auto_selection"
          - "when coordinator_id is omitted: the candidate set of calculations.coordinator_auto_selection is non-empty"
          - "coordinator.weighted_caseload_points + projected case_weight_points <= coordinator.max_weighted_caseload_points (equality admitted)"
        side_effects:
          - "referral.coordinator_id = the supplied or selected ServiceCoordinator.id; referral.assignment_date = logical clock date"
          - "referral.case_weight_points = calculations.case_weight_points (base 1.50 for a pre-plan case)"
          - "ServiceCoordinator.weighted_caseload_points, active_case_count and utilization_ratio recomputed for the assigned coordinator"
          - "referral.version incremented by 1"
      - from: EVALUATION_PENDING
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /ei/referrals/{referralId}/eligibility-determination with is_eligible == true"
        actor: ProgramAdmin
        preconditions:
          - "referral.status == EVALUATION_PENDING"
          - "at least one Assessment on this referral with assessment_type == INITIAL_EVALUATION and status == COMPLETED"
          - "at least one Assessment on this referral with assessment_type == FAMILY_ASSESSMENT and status == COMPLETED"
          - "determination_date >= referral_received_date and not after the logical clock date"
        side_effects:
          - "referral.eligibility_status = ELIGIBLE; referral.eligibility_determination_date = determination_date"
          - "referral.excluded_delay_days, gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed by calculations.initial_timeline_elapsed_days"
      - from: EVALUATION_PENDING
        to: NOT_ELIGIBLE
        trigger: "POST /ei/referrals/{referralId}/eligibility-determination with is_eligible == false"
        actor: ProgramAdmin
        preconditions:
          - "referral.status == EVALUATION_PENDING"
          - "at least one Assessment on this referral with assessment_type == INITIAL_EVALUATION and status == COMPLETED"
          - "at least one Assessment on this referral with assessment_type == FAMILY_ASSESSMENT and status == COMPLETED"
        side_effects:
          - "referral.eligibility_status = NOT_ELIGIBLE; referral.eligibility_determination_date = determination_date"
          - "every Assessment on this referral with status == SCHEDULED transitions to CANCELLED"
          - "referral.case_weight_points = 0; the assigned ServiceCoordinator's weighted_caseload_points, active_case_count and utilization_ratio recomputed (cascade hop 2)"
          - "Child.active_referral_count recomputed"
        note: "Branch sibling of the ELIGIBILITY_DETERMINED transition: identical trigger, divergent side-effect set."
      - from: ELIGIBILITY_DETERMINED
        to: IFSP_PENDING
        trigger: "POST /ei/referrals/{referralId}/entry-outcomes"
        actor: Evaluator
        preconditions:
          - "referral.status == ELIGIBILITY_DETERMINED"
          - "rating_social, rating_knowledge and rating_needs are each integers in 1..7"
          - "measurement_date >= referral.eligibility_determination_date and not after the logical clock date"
        side_effects:
          - "referral.entry_rating_social / entry_rating_knowledge / entry_rating_needs and entry_outcomes_date stored"
      - from: IFSP_PENDING
        to: EVALUATION_PENDING
        trigger: "POST /ei/assessments with assessment_type == SUPPLEMENTAL_EVALUATION"
        actor: Evaluator
        preconditions:
          - "referral.status == IFSP_PENDING"
          - "no IFSP on this referral has status IN {ACTIVE, AMENDMENT_PENDING}"
        side_effects:
          - "every IFSP on this referral with status IN {DRAFT, PENDING_CONSENT} transitions to WITHDRAWN (cascade hop 2)"
          - "every IFSPService on each withdrawn plan with status NOT IN {DISCONTINUED} transitions to DISCONTINUED (cascade hop 3)"
          - "each withdrawn plan's service_line_count and non_natural_setting_line_count recomputed (cascade hop 4)"
          - "referral.case_weight_points recomputed because the non-DISCONTINUED service line count changed, then the coordinator aggregates recomputed (cascade hop 5)"
        note: "Revert edge: the case cycles back to evaluation when the IFSP team finds the evaluation record inadequate."
      - from: IFSP_PENDING
        to: ACTIVE_SERVICES
        trigger: "system, on POST /ei/ifsps/{ifspId}/consent for an IFSP whose ifsp_type == INITIAL"
        actor: system
        preconditions:
          - "referral.status == IFSP_PENDING"
          - "the consented IFSP.referral_id == referral.id and IFSP.status == PENDING_CONSENT"
        side_effects:
          - "referral.services_start_date = IFSP.consent_signed_date"
          - "referral.case_weight_points recomputed (stage base drops from 1.50 to 1.00), then the coordinator aggregates recomputed"
          - "referral.monthly_contact_status recomputed by calculations.monthly_contact_compliance (leaves NOT_APPLICABLE)"
      - from: ACTIVE_SERVICES
        to: EXITED
        trigger: "POST /ei/referrals/{referralId}/exit"
        actor: ServiceCoordinator
        preconditions:
          - "referral.status == ACTIVE_SERVICES"
          - "X-User-ID == referral.coordinator_id"
          - "exit_rating_social, exit_rating_knowledge and exit_rating_needs all supplied and each in 1..7"
          - "when exit_reason == REACHED_AGE_THREE: a TransitionPlan on the referral's ACTIVE IFSP exists with status IN {NOTIFIED, OPT_OUT}"
          - "exit_date >= referral.services_start_date and not after the logical clock date"
        side_effects:
          - "referral.exit_date, exit_reason and exit ratings stored; service_duration_days recomputed"
          - "progress_category_social / _knowledge / _needs computed by calculations.child_outcome_progress_category"
          - "the referral's IFSP with status IN {ACTIVE, AMENDMENT_PENDING} transitions to CLOSED (cascade hop 2)"
          - "every IFSPService on that closed plan with status IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK} transitions to DISCONTINUED (cascade hop 3)"
          - "every ProviderAuthorization on each discontinued line with status IN {ACTIVE, EXHAUSTED, SUSPENDED} transitions to REVOKED with units_released = units_remaining and revocation_reason_code = CASE_EXITED (cascade hop 4)"
          - "each affected IFSPService.units_committed and units_pool_remaining recomputed, restoring the unit-pool invariant (cascade hop 5)"
          - "every ServiceVisit with visit_status == SCHEDULED on those authorizations transitions to CANCELLED_PROGRAM with billing_status = CANCELLED_NO_CHARGE"
          - "the referral's TransitionPlan with status IN {NOTIFIED, OPT_OUT} transitions to COMPLETE"
          - "every CostShare on the referral with status IN {PROVISIONAL, VERIFIED} transitions to CLOSED"
          - "referral.case_weight_points = 0; the coordinator aggregates recomputed; service_gap_flag = false; monthly_contact_status = NOT_APPLICABLE"
      - from: EVALUATION_PENDING
        to: EXITED
        trigger: "POST /ei/referrals/{referralId}/exit with exit_reason IN {FAMILY_WITHDREW, MOVED_OUT_OF_STATE}"
        actor: ServiceCoordinator
        preconditions:
          - "referral.status == EVALUATION_PENDING"
          - "X-User-ID == referral.coordinator_id"
          - "exit ratings are not required because services never started (referral.services_start_date is null)"
        side_effects:
          - "referral.exit_date and exit_reason stored; progress categories remain null"
          - "every Assessment with status == SCHEDULED transitions to CANCELLED"
          - "referral.case_weight_points = 0; the coordinator aggregates recomputed"
      - from: ELIGIBILITY_DETERMINED
        to: EXITED
        trigger: "POST /ei/referrals/{referralId}/exit with exit_reason IN {FAMILY_WITHDREW, MOVED_OUT_OF_STATE}"
        actor: ServiceCoordinator
        preconditions:
          - "referral.status == ELIGIBILITY_DETERMINED"
          - "X-User-ID == referral.coordinator_id"
        side_effects:
          - "same side-effect set as the EVALUATION_PENDING -> EXITED edge"
      - from: IFSP_PENDING
        to: EXITED
        trigger: "POST /ei/referrals/{referralId}/exit with exit_reason IN {FAMILY_WITHDREW, MOVED_OUT_OF_STATE}"
        actor: ServiceCoordinator
        preconditions:
          - "referral.status == IFSP_PENDING"
          - "X-User-ID == referral.coordinator_id"
        side_effects:
          - "every IFSP on this referral with status IN {DRAFT, PENDING_CONSENT} transitions to WITHDRAWN and its IFSPService rows to DISCONTINUED"
          - "referral.case_weight_points = 0; the coordinator aggregates recomputed"

  # ---------------------------------------------------------------------------
  # Assessment — short linear machine with a cancellation branch.
  # ---------------------------------------------------------------------------
  - entity: Assessment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ei/assessments/{assessmentId}/complete"
        actor: Evaluator
        preconditions:
          - "assessment.status == SCHEDULED"
          - "completion_date >= referral.referral_received_date and not after the logical clock date"
          - "family_unavailable_days is an integer in 0..120"
        side_effects:
          - "assessment.completion_date, family_unavailable_days and eligibility_recommendation stored"
          - "Referral.excluded_delay_days recomputed as the sum over COMPLETED assessments (cascade hop 2)"
          - "Referral.gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed from the new excluded_delay_days (cascade hop 3)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, on a Referral transition to NOT_ELIGIBLE or EXITED"
        actor: system
        preconditions:
          - "assessment.status == SCHEDULED"
        side_effects:
          - "assessment row is frozen; it never contributes to Referral.excluded_delay_days"

  # ---------------------------------------------------------------------------
  # IFSP — cyclic (ACTIVE -> AMENDMENT_PENDING -> ACTIVE) plus supersede chain.
  # ---------------------------------------------------------------------------
  - entity: IFSP
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_CONSENT
        trigger: "system, on the first POST /ei/ifsp-services for this plan"
        actor: system
        preconditions:
          - "ifsp.status == DRAFT"
          - "the created IFSPService row is the plan's first non-DISCONTINUED line"
        side_effects:
          - "ifsp.service_line_count and non_natural_setting_line_count recomputed"
      - from: PENDING_CONSENT
        to: ACTIVE
        trigger: "POST /ei/ifsps/{ifspId}/consent"
        actor: FamilyRepresentative
        preconditions:
          - "ifsp.status == PENDING_CONSENT"
          - "X-User-ID == the referral's child_id"
          - "when non_natural_setting_line_count > 0: ifsp.natural_environment_justification is present with at least 20 characters"
          - "when consent_scope == PARTIAL: declined_service_ids is a non-empty subset of this plan's line ids and at least one line remains undeclined"
        side_effects:
          - "ifsp.consent_scope, consent_signed_date, consent_user_id and activated_date stored"
          - "lines named in declined_service_ids get declined_by_family = true and transition to DISCONTINUED"
          - "when ifsp_type == INITIAL: the Referral transitions IFSP_PENDING -> ACTIVE_SERVICES"
          - "when supersedes_ifsp_id is present: the prior IFSP transitions ACTIVE -> SUPERSEDED (cascade hop 2)"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "system, on POST /ei/ifsp-services for a plan already ACTIVE"
        actor: system
        preconditions:
          - "ifsp.status == ACTIVE"
        side_effects:
          - "ifsp.service_line_count and non_natural_setting_line_count recomputed"
          - "no ProviderAuthorization may be created for any line of this plan until it returns to ACTIVE"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /ei/ifsps/{ifspId}/consent"
        actor: FamilyRepresentative
        preconditions:
          - "ifsp.status == AMENDMENT_PENDING"
          - "X-User-ID == the referral's child_id"
        side_effects:
          - "ifsp.consent_scope, consent_signed_date, consent_user_id and activated_date overwritten with the amendment consent"
        note: "Closes the amendment cycle: the same plan row can traverse ACTIVE -> AMENDMENT_PENDING -> ACTIVE repeatedly."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on consent of a later IFSP whose supersedes_ifsp_id == this plan"
        actor: system
        preconditions:
          - "ifsp.status == ACTIVE"
          - "the superseding plan reached ACTIVE in the same request"
        side_effects:
          - "every IFSPService on this plan with status IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK} transitions to DISCONTINUED (cascade hop 3)"
          - "every ProviderAuthorization on those lines with status IN {ACTIVE, EXHAUSTED, SUSPENDED} transitions to REVOKED with units_released = units_remaining and revocation_reason_code = PLAN_SUPERSEDED (cascade hop 4)"
          - "each affected IFSPService.units_committed and units_pool_remaining recomputed (cascade hop 5)"
          - "every ServiceVisit with visit_status == SCHEDULED on those authorizations transitions to CANCELLED_PROGRAM with billing_status = CANCELLED_NO_CHARGE"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, on a Referral transition to EXITED"
        actor: system
        preconditions:
          - "ifsp.status IN {ACTIVE, AMENDMENT_PENDING}"
        side_effects:
          - "see the Referral ACTIVE_SERVICES -> EXITED cascade for hops 3 through 5"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system, on a Referral revert to EVALUATION_PENDING or exit before services start"
        actor: system
        preconditions:
          - "ifsp.status IN {DRAFT, PENDING_CONSENT}"
        side_effects:
          - "every IFSPService on this plan transitions to DISCONTINUED"
      - from: PENDING_CONSENT
        to: WITHDRAWN
        trigger: "system, on a Referral revert to EVALUATION_PENDING or exit before services start"
        actor: system
        preconditions:
          - "ifsp.status == PENDING_CONSENT"
        side_effects:
          - "every IFSPService on this plan transitions to DISCONTINUED"

  # ---------------------------------------------------------------------------
  # IFSPService — cyclic delivery machine (IN_DELIVERY <-> AT_RISK).
  # ---------------------------------------------------------------------------
  - entity: IFSPService
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, DISCONTINUED]
    transitions:
      - from: PLANNED
        to: AUTHORIZED
        trigger: "POST /ei/provider-authorizations"
        actor: ProgramAdmin
        preconditions:
          - "ifsp_service.status == PLANNED"
          - "the parent IFSP.status == ACTIVE"
          - "authorized_units <= ifsp_service.units_pool_remaining"
        side_effects:
          - "ifsp_service.units_committed and units_pool_remaining recomputed by calculations.service_unit_pool"
      - from: AUTHORIZED
        to: IN_DELIVERY
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED"
        actor: Provider
        preconditions:
          - "ifsp_service.status == AUTHORIZED"
          - "the documented visit belongs to an ACTIVE ProviderAuthorization on this line"
        side_effects:
          - "ifsp_service.units_delivered increased by actual_units"
      - from: IN_DELIVERY
        to: AT_RISK
        trigger: "system, on POST /ei/service-visits/{visitId}/document with visit_status == CANCELLED_PROVIDER, or on POST /ei/providers/{providerId}/suspend"
        actor: system
        preconditions:
          - "ifsp_service.status IN {AUTHORIZED, IN_DELIVERY}"
          - "ifsp_service.makeup_owed_units > constants.MAKEUP_AT_RISK_THRESHOLD_UNITS after the increment (strict greater-than)"
        side_effects:
          - "ifsp_service.makeup_owed_units increased by the cancelled visit's scheduled_units"
          - "Referral.service_gap_flag = true (cascade hop 4 of the provider-suspension chain)"
      - from: AT_RISK
        to: IN_DELIVERY
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED for a visit whose makeup_for_visit_id is non-null"
        actor: Provider
        preconditions:
          - "ifsp_service.status == AT_RISK"
          - "ifsp_service.makeup_owed_units - the makeup visit's actual_units <= constants.MAKEUP_AT_RISK_THRESHOLD_UNITS"
        side_effects:
          - "ifsp_service.makeup_owed_units decreased by the makeup visit's actual_units, floored at 0"
          - "Referral.service_gap_flag recomputed: false when no other line on the referral is AT_RISK"
        note: "Closes the makeup cycle; a line may oscillate IN_DELIVERY <-> AT_RISK any number of times."
      - from: IN_DELIVERY
        to: COMPLETED
        trigger: "system, on POST /ei/service-visits/{visitId}/document when the line's units_delivered reaches planned_units_total"
        actor: system
        preconditions:
          - "ifsp_service.status == IN_DELIVERY"
          - "ifsp_service.units_delivered >= ifsp_service.planned_units_total"
          - "ifsp_service.makeup_owed_units == 0"
        side_effects:
          - "every ProviderAuthorization on this line with status == ACTIVE transitions to EXHAUSTED"
      - from: PLANNED
        to: DISCONTINUED
        trigger: "system, on family decline at consent, plan supersede, plan withdrawal or case exit"
        actor: system
        preconditions:
          - "ifsp_service.status IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK}"
        side_effects:
          - "the parent IFSP.service_line_count and non_natural_setting_line_count recomputed"
          - "Referral.case_weight_points recomputed when the line count crosses the 4-line complexity threshold"
      - from: AT_RISK
        to: DISCONTINUED
        trigger: "system, on plan supersede, plan withdrawal or case exit"
        actor: system
        preconditions:
          - "ifsp_service.status == AT_RISK"
        side_effects:
          - "Referral.service_gap_flag recomputed after the line leaves the AT_RISK population"

  # ---------------------------------------------------------------------------
  # Provider — credentialing machine; suspension is the head of a 5-hop cascade.
  # ---------------------------------------------------------------------------
  - entity: Provider
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ei/providers/{providerId}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "provider.status == ACTIVE"
          - "effective_date is not after the logical clock date"
        side_effects:
          - "provider.suspension_reason_code and suspended_date stored"
          - "every ProviderAuthorization for this provider with status == ACTIVE transitions to SUSPENDED (cascade hop 2)"
          - "every ServiceVisit with visit_status == SCHEDULED on those authorizations transitions to CANCELLED_PROVIDER with billing_status = CANCELLED_NO_CHARGE (cascade hop 3)"
          - "each affected IFSPService.makeup_owed_units increased by the cancelled visits' scheduled_units and, where the total exceeds constants.MAKEUP_AT_RISK_THRESHOLD_UNITS, the line transitions to AT_RISK (cascade hop 4)"
          - "each affected Referral.service_gap_flag = true (cascade hop 5)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ei/providers/{providerId}/suspend with suspension_reason_code == CONTRACT_ENDED"
        actor: ProgramAdmin
        preconditions:
          - "provider.status == ACTIVE"
        side_effects:
          - "the same five cascade hops as the SUSPENDED edge, except that affected authorizations transition to REVOKED with units_released = units_remaining and revocation_reason_code = PROVIDER_TERMINATED"
        note: "Branch sibling of ACTIVE -> SUSPENDED: same endpoint, reason code selects the branch."

  # ---------------------------------------------------------------------------
  # ProviderAuthorization — non-linear: EXHAUSTED can return to ACTIVE when a
  # delivered visit is voided and its units are given back.
  # ---------------------------------------------------------------------------
  - entity: ProviderAuthorization
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system, on POST /ei/service-visits/{visitId}/document when units_remaining reaches 0"
        actor: system
        preconditions:
          - "provider_authorization.status == ACTIVE"
          - "provider_authorization.units_consumed == provider_authorization.authorized_units"
        side_effects:
          - "no further ServiceVisit may be created on this authorization"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /ei/service-visits/{visitId}/void"
        actor: ProgramAdmin
        preconditions:
          - "provider_authorization.status == EXHAUSTED"
          - "the voided visit had visit_status == DELIVERED with actual_units > 0"
          - "the authorization window has not ended relative to the logical clock date"
        side_effects:
          - "provider_authorization.units_consumed decreased by the voided visit's actual_units; units_remaining recomputed"
          - "the parent IFSPService.units_delivered decreased by the same amount"
        note: "Reverse edge: proves the machine is not linear and that void is a true compensating action."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, on POST /ei/providers/{providerId}/suspend"
        actor: system
        preconditions:
          - "provider_authorization.status == ACTIVE"
        side_effects:
          - "SCHEDULED visits on this authorization are cancelled as CANCELLED_PROVIDER"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /ei/provider-authorizations/{authorizationId}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "provider_authorization.status IN {ACTIVE, EXHAUSTED, SUSPENDED}"
        side_effects:
          - "provider_authorization.units_released = units_remaining; revoked_date and revocation_reason_code stored"
          - "the parent IFSPService.units_committed and units_pool_remaining recomputed, returning the unreleased units to the pool"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /ei/provider-authorizations/{authorizationId}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "provider_authorization.status == ACTIVE"
        side_effects:
          - "provider_authorization.units_released = units_remaining; revoked_date and revocation_reason_code stored"
          - "every ServiceVisit with visit_status == SCHEDULED on this authorization transitions to CANCELLED_PROGRAM with billing_status = CANCELLED_NO_CHARGE"
          - "the parent IFSPService.units_committed and units_pool_remaining recomputed"
      - from: EXHAUSTED
        to: REVOKED
        trigger: "POST /ei/provider-authorizations/{authorizationId}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "provider_authorization.status == EXHAUSTED"
        side_effects:
          - "provider_authorization.units_released = 0 because units_remaining is already 0; the committed total is unchanged"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc past the authorization's end_date"
        actor: system
        preconditions:
          - "provider_authorization.status == ACTIVE"
          - "the new logical clock date is after provider_authorization.end_date"
        side_effects:
          - "provider_authorization.units_released = units_remaining; the parent IFSPService pool fields recomputed"

  # ---------------------------------------------------------------------------
  # ServiceVisit — TWO independent state dimensions (parallel shape):
  # visit_status (operational) and billing_status (fiscal).
  # ---------------------------------------------------------------------------
  - entity: ServiceVisit
    state_field: visit_status
    initial_state: SCHEDULED
    terminal_states: [VOIDED, FAMILY_CANCELLED, NO_SHOW, CANCELLED_PROVIDER, CANCELLED_PROGRAM]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED"
        actor: Provider
        preconditions:
          - "service_visit.visit_status == SCHEDULED"
          - "X-User-ID == the authorization's provider_id"
          - "provider_authorization.status == ACTIVE"
          - "the visit's scheduled_start is not after the logical clock instant"
          - "actual_units >= 1 and actual_units <= scheduled_units"
          - "actual_units <= provider_authorization.units_remaining"
        side_effects:
          - "service_visit.actual_units, session_note and documented_at_utc stored"
          - "provider_authorization.units_consumed increased by actual_units; units_remaining recomputed"
          - "IFSPService.units_delivered increased by actual_units"
          - "service_visit.family_share_cents computed by calculations.visit_family_share_cents and billing_status set to ACCRUED, EXEMPT or CAPPED"
          - "the selected CostShare.month_accrued_cents and family_balance_cents increased by family_share_cents"
      - from: SCHEDULED
        to: CANCELLED_PROVIDER
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == CANCELLED_PROVIDER"
        actor: Provider
        preconditions:
          - "service_visit.visit_status == SCHEDULED"
          - "X-User-ID == the authorization's provider_id"
        side_effects:
          - "service_visit.actual_units = 0; billing_status = CANCELLED_NO_CHARGE"
          - "IFSPService.makeup_owed_units increased by scheduled_units; the line may transition to AT_RISK"
          - "no authorization units are consumed"
      - from: SCHEDULED
        to: FAMILY_CANCELLED
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == FAMILY_CANCELLED"
        actor: Provider
        preconditions:
          - "service_visit.visit_status == SCHEDULED"
          - "X-User-ID == the authorization's provider_id"
        side_effects:
          - "service_visit.actual_units = 0; billing_status = CANCELLED_NO_CHARGE"
          - "IFSPService.makeup_owed_units is NOT increased: only provider cancellations create a makeup obligation"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == NO_SHOW"
        actor: Provider
        preconditions:
          - "service_visit.visit_status == SCHEDULED"
          - "X-User-ID == the authorization's provider_id"
        side_effects:
          - "service_visit.actual_units = 0; billing_status = CANCELLED_NO_CHARGE; no makeup obligation"
      - from: SCHEDULED
        to: CANCELLED_PROGRAM
        trigger: "system, on authorization revoke, plan supersede, plan closure or case exit"
        actor: system
        preconditions:
          - "service_visit.visit_status == SCHEDULED"
        side_effects:
          - "service_visit.billing_status = CANCELLED_NO_CHARGE; no makeup obligation"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /ei/service-visits/{visitId}/void"
        actor: ProgramAdmin
        preconditions:
          - "service_visit.visit_status == DELIVERED"
          - "the void would not drive the selected CostShare's family_balance_cents below 0"
        side_effects:
          - "provider_authorization.units_consumed and IFSPService.units_delivered decreased by actual_units"
          - "the selected CostShare.month_accrued_cents and family_balance_cents decreased by family_share_cents"
          - "service_visit.billing_status = REVERSED"
          - "an EXHAUSTED authorization returns to ACTIVE"

  - entity: ServiceVisit
    state_field: billing_status
    initial_state: PENDING
    terminal_states: [CANCELLED_NO_CHARGE, REVERSED]
    transitions:
      - from: PENDING
        to: ACCRUED
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED"
        actor: Provider
        preconditions:
          - "the visit's selected CostShare exists with status IN {PROVISIONAL, VERIFIED} and effective_coinsurance_rate > 0"
          - "the computed family share is greater than 0 and the monthly cap remainder is greater than 0"
        side_effects:
          - "service_visit.family_share_cents = the full computed share; CostShare.family_balance_cents increased by it"
      - from: PENDING
        to: EXEMPT
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED"
        actor: Provider
        preconditions:
          - "no CostShare row is selected for the visit's month, OR the selected row's effective_coinsurance_rate == 0, OR the line's family_fee_exempt == true"
        side_effects:
          - "service_visit.family_share_cents = 0; no CostShare field changes"
        note: "Same trigger as the ACCRUED edge; the fiscal dimension branches on the cost-share context only."
      - from: PENDING
        to: CAPPED
        trigger: "POST /ei/service-visits/{visitId}/document with visit_status == DELIVERED"
        actor: Provider
        preconditions:
          - "the computed family share is greater than 0 but the selected CostShare's monthly cap remainder is 0"
        side_effects:
          - "service_visit.family_share_cents = 0; CostShare.month_accrued_cents unchanged"
      - from: PENDING
        to: CANCELLED_NO_CHARGE
        trigger: "POST /ei/service-visits/{visitId}/document with a non-delivered visit_status, or a system cancellation"
        actor: Provider
        preconditions:
          - "service_visit.visit_status leaves SCHEDULED for any state other than DELIVERED"
        side_effects:
          - "service_visit.family_share_cents = 0"
      - from: ACCRUED
        to: REVERSED
        trigger: "POST /ei/service-visits/{visitId}/void"
        actor: ProgramAdmin
        preconditions:
          - "service_visit.billing_status == ACCRUED"
        side_effects:
          - "CostShare.month_accrued_cents and family_balance_cents decreased by service_visit.family_share_cents"
      - from: EXEMPT
        to: REVERSED
        trigger: "POST /ei/service-visits/{visitId}/void"
        actor: ProgramAdmin
        preconditions:
          - "service_visit.billing_status == EXEMPT"
        side_effects:
          - "only unit counters are reversed; no CostShare money field changes because family_share_cents was 0"
      - from: CAPPED
        to: REVERSED
        trigger: "POST /ei/service-visits/{visitId}/void"
        actor: ProgramAdmin
        preconditions:
          - "service_visit.billing_status == CAPPED"
        side_effects:
          - "only unit counters are reversed; no CostShare money field changes"
        note: "The two dimensions move independently: visit_status DELIVERED -> VOIDED can pair with billing_status ACCRUED, EXEMPT or CAPPED -> REVERSED."

  # ---------------------------------------------------------------------------
  # CostShare — provisional/final variant carrier plus the family ledger.
  # ---------------------------------------------------------------------------
  - entity: CostShare
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: VERIFIED
        trigger: "POST /ei/cost-shares/{costShareId}/finalize"
        actor: FiscalOfficer
        preconditions:
          - "cost_share.status == PROVISIONAL"
          - "verified_annual_gross_income_cents >= 0 and verification_date is not after the logical clock date"
          - "when insurance_use_consent == true: insurance_policy_id is present"
        side_effects:
          - "cost_share.verified_annual_gross_income_cents and verification_date stored"
          - "fpl_percent, tier_code, coinsurance_rate, monthly_cap_cents, effective_coinsurance_rate and final_monthly_fee_cents recomputed by the FINAL variant of calculations.family_cost_share"
          - "cost_share.insurance_offset_cents populated when insurance_use_consent is true and insurance_policy_id is on file, and left at 0 otherwise"
          - "already-accrued visits are NOT retroactively re-priced: total_assessed_cents, family_balance_cents and month_accrued_cents keep their pre-finalization values, so the ledger identity total_assessed_cents == family_balance_cents + family_waived_cents still holds"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system, on POST /ei/cost-shares for the same referral with a later effective_month"
        actor: system
        preconditions:
          - "cost_share.status IN {PROVISIONAL, VERIFIED}"
          - "the new row's effective_month is strictly after this row's effective_month"
        side_effects:
          - "this row stops being selected for new visits; already-accrued balances stay on this row"
      - from: VERIFIED
        to: CLOSED
        trigger: "system, on a Referral transition to EXITED"
        actor: system
        preconditions:
          - "cost_share.status IN {PROVISIONAL, VERIFIED}"
        side_effects:
          - "no further accrual or waiver is permitted against this row"

  # ---------------------------------------------------------------------------
  # TransitionPlan — notification machine with an opt-out branch.
  # ---------------------------------------------------------------------------
  - entity: TransitionPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: NOTIFIED
        trigger: "POST /ei/transition-plans/{transitionPlanId}/notify-lea with family_opt_out == false"
        actor: ServiceCoordinator
        preconditions:
          - "transition_plan.status == DRAFT"
          - "X-User-ID == the referral's coordinator_id"
          - "transition_plan.conference_held_date is present and transition_steps_count >= 1"
          - "lea_code is present and opt_out_signed_date is absent"
          - "notification_date is not after Child.third_birthday_date"
        side_effects:
          - "transition_plan.lea_code, notification_date, notification_lead_days and notification_compliance stored per calculations.transition_notification_timeliness"
      - from: DRAFT
        to: OPT_OUT
        trigger: "POST /ei/transition-plans/{transitionPlanId}/notify-lea with family_opt_out == true"
        actor: ServiceCoordinator
        preconditions:
          - "transition_plan.status == DRAFT"
          - "X-User-ID == the referral's coordinator_id"
          - "opt_out_signed_date is present and lea_code is absent"
        side_effects:
          - "transition_plan.notification_compliance = WAIVED_OPT_OUT; notification_lead_days is still computed and stored"
        note: "Branch sibling of DRAFT -> NOTIFIED under the same endpoint."
      - from: NOTIFIED
        to: COMPLETE
        trigger: "system, on a Referral transition to EXITED"
        actor: system
        preconditions:
          - "transition_plan.status IN {NOTIFIED, OPT_OUT}"
        side_effects:
          - "the plan is frozen as the audit record of the transition"
      - from: DRAFT
        to: CANCELLED
        trigger: "system, on IFSP supersede or plan withdrawal"
        actor: system
        preconditions:
          - "transition_plan.status == DRAFT"
        side_effects:
          - "a fresh TransitionPlan may then be created against the successor IFSP"

# =============================================================================
# §1.2.1 Concurrency Rules — exactly one optimistic-concurrency-control rule.
# =============================================================================
concurrency_rules:
  - rule_id: ifsp-create-stale-referral
    parent_entity: Referral
    child_entity: IFSP
    write_endpoint: "POST /ei/ifsps"
    occ_field: expected_referral_version
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412
    description: >-
      Plan authoring is guarded by the referral's version counter. A caller reads the referral,
      keeps the returned version, and submits it as expected_referral_version when creating the
      IFSP. Every request that mutates the referral aggregate (assign-coordinator,
      eligibility-determination, entry-outcomes, exit, and IFSP creation itself) increments
      Referral.version by 1. If the stored version no longer equals the submitted value, the
      request is rejected with ERR_STALE_REFERRAL_VERSION (412) and nothing is written, so a plan
      can never be authored against a referral whose eligibility, coordinator or timeline state has
      moved on since it was read.
    stale_detection: "reject when referral.version != expected_referral_version at the moment the write is applied"
    on_conflict: "no IFSP row is created, no counters are touched, and Referral.version is unchanged"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  # 1. Statutory 45-day timeline — DUAL VARIANT (gross vs net of excluded delay)
  # ---------------------------------------------------------------------------
  - name: initial_timeline_elapsed_days
    trigger: >-
      Recomputed whenever an Assessment on the referral is completed, whenever the eligibility
      determination is recorded, whenever the initial IFSP meeting date is recorded, and whenever
      GET /ei/referrals/{referralId}/timeline-compliance is read.
    algorithm: chronological
    formula: |
      statutory_deadline_date = referral_received_date + STATUTORY_TIMELINE_DAYS days

      # the stop instant: the initial IFSP meeting if one exists, else "still running"
      initial_ifsp = the IFSP on this referral with ifsp_type == INITIAL and
                     status IN {PENDING_CONSENT, ACTIVE, AMENDMENT_PENDING, SUPERSEDED, CLOSED}
      if initial_ifsp exists and initial_ifsp.meeting_date is not null:
          stop_date = initial_ifsp.meeting_date
      else:
          stop_date = logical clock date

      # received date is exclusive, stop date inclusive
      gross_elapsed_days = day_count(referral_received_date -> stop_date)

      excluded_delay_days = sum(a.family_unavailable_days
                                for a in assessments(referral) if a.status == COMPLETED)

      net_elapsed_days = max(0, gross_elapsed_days - excluded_delay_days)

      # the status uses the NET variant only
      if net_elapsed_days <= STATUTORY_TIMELINE_DAYS:
          initial_timeline_status = MET if stop_date is an IFSP meeting_date else IN_PROGRESS
      else:
          initial_timeline_status = MISSED
    input_set: >-
      Assessments on the referral with status == COMPLETED only. SCHEDULED and CANCELLED assessments
      never contribute family_unavailable_days, so cancelling an assessment that had already been
      completed is impossible and cancelling a scheduled one changes nothing. When the referral has
      no COMPLETED assessment the excluded total is 0 and the two variants coincide.
    constants:
      STATUTORY_TIMELINE_DAYS: 45
      MAX_FAMILY_UNAVAILABLE_DAYS_PER_ASSESSMENT: 120
    precision: "whole days, integer arithmetic; no rounding"
    variants:
      - name: GROSS
        when: >-
          Reported as gross_elapsed_days on the referral and in the timeline-compliance read; this is
          the raw wall-clock span the state uses for federal reporting.
        difference: "ignores excluded_delay_days entirely"
      - name: NET
        when: >-
          Reported as net_elapsed_days and is the ONLY variant that drives
          referral.initial_timeline_status and the ERR-free/MISSED compliance verdict.
        difference: >-
          subtracts excluded_delay_days (documented family unavailability) and floors the result at
          0, so the same referral can be MISSED on the gross count and MET on the net count.

  # ---------------------------------------------------------------------------
  # 2. Family cost participation — DUAL VARIANT (provisional vs final)
  # ---------------------------------------------------------------------------
  - name: family_cost_share
    trigger: >-
      Runs on POST /ei/cost-shares (PROVISIONAL variant) and again on
      POST /ei/cost-shares/{costShareId}/finalize (FINAL variant).
    algorithm: tiered_pricing
    formula: |
      fpl_threshold_cents = FPL_BASE_CENTS + (household_size - 1) * FPL_PER_ADDITIONAL_MEMBER_CENTS
      income_cents        = declared_annual_gross_income_cents      # PROVISIONAL variant
                          | verified_annual_gross_income_cents      # FINAL variant
      fpl_percent         = round_half_up(income_cents * 100 / fpl_threshold_cents, 1)

      # tier selection: first tier whose ceiling is >= fpl_percent (inclusive upper bounds)
      if   fpl_percent <= 250.0: tier_code = TIER_0; coinsurance_rate = 0.00; monthly_cap_cents = 0
      elif fpl_percent <= 400.0: tier_code = TIER_1; coinsurance_rate = 0.05; monthly_cap_cents = 12000
      elif fpl_percent <= 600.0: tier_code = TIER_2; coinsurance_rate = 0.10; monthly_cap_cents = 30000
      else:                      tier_code = TIER_3; coinsurance_rate = 0.15; monthly_cap_cents = 60000

      # PER-LINE ROUNDING BEFORE SUMMATION (order is normative)
      raw_assessed_cents = 0
      for line in eligible_service_lines ordered by created_at ASC:
          line_cents = round_half_up(line.frequency_per_month
                                     * line.units_per_session
                                     * line.unit_rate_cents
                                     * coinsurance_rate)
          raw_assessed_cents = raw_assessed_cents + line_cents

      capped_cents = min(raw_assessed_cents, monthly_cap_cents)

      # insurance offset — FINAL variant only
      if variant == FINAL and insurance_use_consent and insurance_policy_id is present:
          insurance_offset_cents = round_half_up(capped_cents * INSURANCE_OFFSET_RATE)
      else:
          insurance_offset_cents = 0

      # the PROVISIONAL variant writes assessed_monthly_fee_cents, the FINAL variant writes
      # final_monthly_fee_cents; neither ever re-derives the tier from the post-offset amount
      if variant == PROVISIONAL:
          assessed_monthly_fee_cents = capped_cents          # offset is never applied here
          effective_coinsurance_rate = coinsurance_rate
      else:
          final_monthly_fee_cents    = capped_cents - insurance_offset_cents
          effective_coinsurance_rate = coinsurance_rate      # the verified tier's rate
    input_set: >-
      IFSPService rows belonging to the referral's IFSP with status == ACTIVE, whose own status is
      IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK}, with declined_by_family == false and
      family_fee_exempt == false, taken in created_at ASC order. DISCONTINUED and COMPLETED lines,
      family-declined lines and fee-exempt lines are excluded. When the eligible set is empty the
      raw assessed amount is 0 and the tier fields are still stored.
    constants:
      FPL_BASE_CENTS: 1580000
      FPL_PER_ADDITIONAL_MEMBER_CENTS: 555000
      TIER_0_CEILING_FPL_PERCENT: 250.0
      TIER_1_CEILING_FPL_PERCENT: 400.0
      TIER_2_CEILING_FPL_PERCENT: 600.0
      TIER_0_COINSURANCE_RATE: 0.00
      TIER_1_COINSURANCE_RATE: 0.05
      TIER_2_COINSURANCE_RATE: 0.10
      TIER_3_COINSURANCE_RATE: 0.15
      TIER_0_MONTHLY_CAP_CENTS: 0
      TIER_1_MONTHLY_CAP_CENTS: 12000
      TIER_2_MONTHLY_CAP_CENTS: 30000
      TIER_3_MONTHLY_CAP_CENTS: 60000
      INSURANCE_OFFSET_RATE: 0.60
    precision: >-
      fpl_percent to 1 decimal place, round_half_up. All money in integer cents; each line is
      rounded to whole cents with round_half_up BEFORE summation, never after, so the assessed total
      can differ by a cent or more from a sum-then-round implementation.
    variants:
      - name: PROVISIONAL
        when: "at POST /ei/cost-shares, from the family's self-declared income"
        difference: >-
          uses declared_annual_gross_income_cents and NEVER applies the insurance offset, even when
          insurance_use_consent is true.
      - name: FINAL
        when: "at POST /ei/cost-shares/{costShareId}/finalize, after income documentation is verified"
        difference: >-
          uses verified_annual_gross_income_cents, which can move the family across a tier boundary, and
          applies the insurance offset when consent and a policy number are both on file.

  # ---------------------------------------------------------------------------
  # 3. Weighted case load points — combinatorial, non-linear (clamped)
  # ---------------------------------------------------------------------------
  - name: case_weight_points
    trigger: >-
      Recomputed on coordinator assignment, on every Referral status transition, on IFSPService
      creation or discontinuation, on POST /_clock/set_current_utc, and on case exit.
    algorithm: weighted_scoring
    formula: |
      if referral.status IN {NOT_ELIGIBLE, EXITED}:
          return 0.00

      if referral.status IN {INTAKE, EVALUATION_PENDING, ELIGIBILITY_DETERMINED, IFSP_PENDING}:
          base_stage_points = PRE_PLAN_STAGE_POINTS      # 1.50 — pre-plan work is heavier
      else:                                              # ACTIVE_SERVICES
          base_stage_points = ACTIVE_STAGE_POINTS        # 1.00

      complexity_add = 0.00
      if referral.interpreter_required:
          complexity_add += INTERPRETER_ADD_POINTS       # 0.50
      if child.third_birthday_date - logical clock date <= TRANSITION_WINDOW_DAYS:
          complexity_add += TRANSITION_WINDOW_ADD_POINTS # 0.75
      if service_line_count >= MULTI_SERVICE_LINE_THRESHOLD:
          complexity_add += MULTI_SERVICE_ADD_POINTS     # 0.50

      case_weight_points = min(MAX_CASE_WEIGHT_POINTS,
                               max(MIN_CASE_WEIGHT_POINTS,
                                   base_stage_points + complexity_add))
    input_set: >-
      service_line_count is the number of IFSPService rows on the referral's IFSP with status
      IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK} (DISCONTINUED and COMPLETED lines excluded).
      The transition-window term compares Child.third_birthday_date to the logical clock date, so
      advancing the clock alone can raise a case's weight.
    constants:
      PRE_PLAN_STAGE_POINTS: 1.50
      ACTIVE_STAGE_POINTS: 1.00
      INTERPRETER_ADD_POINTS: 0.50
      TRANSITION_WINDOW_ADD_POINTS: 0.75
      MULTI_SERVICE_ADD_POINTS: 0.50
      MULTI_SERVICE_LINE_THRESHOLD: 4
      TRANSITION_WINDOW_DAYS: 180
      MIN_CASE_WEIGHT_POINTS: 1.00
      MAX_CASE_WEIGHT_POINTS: 3.00
    precision: "2 decimal places, round_half_up; the clamp is applied after the additive sum, never before"

  # ---------------------------------------------------------------------------
  # 4. Coordinator caseload aggregates
  # ---------------------------------------------------------------------------
  - name: coordinator_caseload_aggregates
    trigger: >-
      Recomputed for a coordinator whenever any referral assigned to them changes case_weight_points
      or status, and read by GET /ei/service-coordinators/{coordinatorId}/caseload-summary.
    algorithm: aggregation
    formula: |
      active_case_count         = count(r for r in referrals(coordinator)
                                        if r.status NOT IN {NOT_ELIGIBLE, EXITED})
      weighted_caseload_points  = sum(r.case_weight_points for r in referrals(coordinator)
                                      if r.status NOT IN {NOT_ELIGIBLE, EXITED})
      utilization_ratio         = round_half_up(weighted_caseload_points
                                                / max_weighted_caseload_points, 4)
      caseload_posture          = OVER    if weighted_caseload_points > max_weighted_caseload_points
                                | AT_CAP  if weighted_caseload_points == max_weighted_caseload_points
                                | NEAR_CAP if utilization_ratio >= NEAR_CAP_RATIO
                                | OPEN
    input_set: >-
      Referrals assigned to the coordinator whose status is not terminal. Exited and not-eligible
      cases drop out of both the count and the weighted total in the same request that closes them.
    constants:
      NEAR_CAP_RATIO: 0.9000
    precision: "weighted_caseload_points to 2 decimals, utilization_ratio to 4 decimals, round_half_up"

  # ---------------------------------------------------------------------------
  # 5. Coordinator auto-selection — deterministic selector policy
  # ---------------------------------------------------------------------------
  - name: coordinator_auto_selection
    trigger: >-
      Runs on POST /ei/referrals/{referralId}/assign-coordinator when coordinator_id is omitted; the
      same eligibility filter also validates an explicitly supplied coordinator_id.
    algorithm: constraint_propagation
    formula: |
      projected_weight = case_weight_points(referral)   # computed as if already assigned

      candidates = [c for c in service_coordinators if
                      c.status == ACTIVE
                      and c.county_code == referral.county_code
                      and (referral.interpreter_required == false
                           or referral.primary_language IN c.language_codes)
                      and c.weighted_caseload_points + projected_weight
                              <= c.max_weighted_caseload_points]

      if candidates is empty:
          raise ERR_NO_ELIGIBLE_COORDINATOR      # 409, nothing is written

      # rank by PROJECTED utilization ascending, then by created_at ASC
      rank_key(c) = (round_half_up((c.weighted_caseload_points + projected_weight)
                                    / c.max_weighted_caseload_points, 4),
                     c.created_at)
      selected = min(candidates by rank_key)
    input_set: >-
      All ServiceCoordinator rows; only status == ACTIVE rows are candidates. The cap comparison is
      inclusive (<=), so a coordinator landing exactly on max_weighted_caseload_points is eligible;
      exceeding it by any amount is not. Ranking uses the projected utilization (post-assignment),
      not the current one, so coordinators with different caps rank on percentage, not on points.
    constants: {}
    precision: >-
      projected utilization to 4 decimal places, round_half_up. Ties on the rounded ratio are broken
      by created_at ASC; record identifiers are never used as a decision input.

  # ---------------------------------------------------------------------------
  # 6. Per-visit family share
  # ---------------------------------------------------------------------------
  - name: visit_family_share_cents
    trigger: "Runs on POST /ei/service-visits/{visitId}/document when visit_status == DELIVERED."
    algorithm: threshold
    formula: |
      # cost-share selection for the visit's calendar month
      candidates = [cs for cs in cost_shares(referral)
                    if cs.status IN {PROVISIONAL, VERIFIED}
                    and cs.effective_month <= month_of(visit.scheduled_start)]
      if candidates is empty:
          family_share_cents = 0; billing_status = EXEMPT; return
      selected = max(candidates by (effective_month, created_at))   # effective_month DESC, then created_at DESC

      if ifsp_service.family_fee_exempt or selected.effective_coinsurance_rate == 0.00:
          family_share_cents = 0; billing_status = EXEMPT; return

      raw = round_half_up(actual_units
                          * provider_authorization.unit_rate_cents
                          * selected.effective_coinsurance_rate)

      cap_remainder = selected.monthly_cap_cents - selected.month_accrued_cents
      if cap_remainder <= 0:
          family_share_cents = 0; billing_status = CAPPED; return

      family_share_cents = min(raw, cap_remainder)
      billing_status     = CAPPED if family_share_cents < raw else ACCRUED
    input_set: >-
      CostShare rows on the visit's referral with status IN {PROVISIONAL, VERIFIED} whose
      effective_month is at or before the visit month; SUPERSEDED and CLOSED rows are never
      selected. month_accrued_cents is the running accrual for the selected row's effective month.
    constants: {}
    precision: >-
      integer cents, round_half_up on the single multiplication; the cap is applied after rounding.
      Ties in the selector are broken by effective_month DESC then created_at DESC.

  # ---------------------------------------------------------------------------
  # 7. Service unit pool — conserved quantity (compensating invariant)
  # ---------------------------------------------------------------------------
  - name: service_unit_pool
    trigger: >-
      Recomputed on authorization creation, revocation and expiry, on plan supersede, on plan
      withdrawal and on case exit.
    algorithm: aggregation
    formula: |
      units_committed = sum(a.authorized_units for a in authorizations(line)
                            if a.status IN {ACTIVE, EXHAUSTED, SUSPENDED})
                      + sum(a.authorized_units - a.units_released for a in authorizations(line)
                            if a.status == REVOKED)
                      + sum(a.authorized_units - a.units_released for a in authorizations(line)
                            if a.status == EXPIRED)

      units_pool_remaining = line.planned_units_total - units_committed

      # INVARIANT, checked after every write that touches the line:
      #   units_committed + units_pool_remaining == line.planned_units_total
      #   and 0 <= units_pool_remaining <= line.planned_units_total
    input_set: >-
      All ProviderAuthorization rows on the IFSPService line. A revoked authorization keeps the
      units already consumed as committed (authorized_units - units_released) and hands the rest
      back to the pool, so revoking an untouched authorization returns exactly what it took.
    constants: {}
    precision: "whole units, integer arithmetic"

  # ---------------------------------------------------------------------------
  # 8. Family ledger — conserved quantity (compensating invariant)
  # ---------------------------------------------------------------------------
  - name: family_ledger
    trigger: >-
      Recomputed on visit documentation, visit void, cost-share finalize and cost-share waiver.
    algorithm: aggregation
    formula: |
      family_balance_cents = sum(v.family_share_cents for v in visits(referral)
                                 if v.billing_status IN {ACCRUED, CAPPED}
                                 and v.visit_status == DELIVERED)
                             - cost_share.family_waived_cents

      # INVARIANT, checked after every write that touches the row:
      #   cost_share.total_assessed_cents == family_balance_cents + family_waived_cents
      #   and family_balance_cents >= 0 and family_waived_cents >= 0
      # A waiver moves cents from balance to waived; it never changes total_assessed_cents.
      # A visit void removes the visit's contribution from balance and lowers total_assessed_cents
      # by the same amount, so the identity holds on both sides of the compensation.
    input_set: >-
      ServiceVisits on the referral whose billing_status is ACCRUED or CAPPED; REVERSED, EXEMPT,
      PENDING and CANCELLED_NO_CHARGE visits contribute nothing. Only the CostShare row selected for
      each visit's month carries that visit's accrual.
    constants: {}
    precision: "integer cents; any write that would break the identity is rejected with ERR_LEDGER_WOULD_UNBALANCE"

  # ---------------------------------------------------------------------------
  # 9. Makeup obligation
  # ---------------------------------------------------------------------------
  - name: makeup_obligation
    trigger: >-
      Recomputed on documentation of a CANCELLED_PROVIDER visit, on provider suspension or
      termination, and on documentation of a DELIVERED makeup visit.
    algorithm: aggregation
    formula: |
      makeup_owed_units = sum(v.scheduled_units for v in visits(line)
                              if v.visit_status == CANCELLED_PROVIDER)
                        - sum(v.actual_units for v in visits(line)
                              if v.visit_status == DELIVERED and v.makeup_for_visit_id is not null)
      makeup_owed_units = max(0, makeup_owed_units)

      line_at_risk = makeup_owed_units > MAKEUP_AT_RISK_THRESHOLD_UNITS   # STRICT >
      # a makeup visit must fall within MAKEUP_WINDOW_DAYS of the cancelled visit it repairs
      makeup_deadline_date = date_of(target.scheduled_start) + MAKEUP_WINDOW_DAYS days
    input_set: >-
      ServiceVisits on the IFSPService line. Only CANCELLED_PROVIDER cancellations create an
      obligation — FAMILY_CANCELLED, NO_SHOW and CANCELLED_PROGRAM never do. A voided makeup visit
      stops discharging the obligation and the owed total rises back.
    constants:
      MAKEUP_AT_RISK_THRESHOLD_UNITS: 4
      MAKEUP_WINDOW_DAYS: 30
    precision: "whole units, integer arithmetic; the AT_RISK test is strictly greater-than, so exactly 4 owed units is not AT_RISK"

  # ---------------------------------------------------------------------------
  # 10. Transition notification timeliness
  # ---------------------------------------------------------------------------
  - name: transition_notification_timeliness
    trigger: "Runs on POST /ei/transition-plans/{transitionPlanId}/notify-lea."
    algorithm: threshold
    formula: |
      notification_lead_days = day_count(notification_date -> child.third_birthday_date)

      if notification_lead_days < 0:
          raise ERR_NOTIFICATION_AFTER_THIRD_BIRTHDAY        # 422
      if family_opt_out:
          notification_compliance = WAIVED_OPT_OUT
      elif notification_lead_days > EARLIEST_LEAD_DAYS:
          notification_compliance = EARLY
      elif notification_lead_days >= MINIMUM_LEAD_DAYS:
          notification_compliance = TIMELY                        # inclusive at exactly 90
      else:
          notification_compliance = LATE
    input_set: >-
      The Child reached through the plan's IFSP and Referral supplies third_birthday_date. The
      transition window must already be open when the plan is created: the plan cannot be created
      unless third_birthday_date - logical clock date <= TRANSITION_WINDOW_OPEN_DAYS.
    constants:
      MINIMUM_LEAD_DAYS: 90
      EARLIEST_LEAD_DAYS: 270
      TRANSITION_WINDOW_OPEN_DAYS: 270
    precision: >-
      whole days, integer arithmetic. Both boundaries are inclusive on the TIMELY side: a lead of
      exactly 90 days is TIMELY (89 is LATE) and a lead of exactly 270 days is TIMELY (271 is EARLY).

  # ---------------------------------------------------------------------------
  # 11. Child outcome progress category (COSF categories a-e)
  # ---------------------------------------------------------------------------
  - name: child_outcome_progress_category
    trigger: "Runs on POST /ei/referrals/{referralId}/exit for each of the three outcome areas."
    algorithm: threshold
    formula: |
      service_duration_days = day_count(services_start_date -> exit_date)
      if service_duration_days < MINIMUM_COMPARABLE_DURATION_DAYS:
          return NOT_COMPARABLE          # for all three areas

      for each area in {social, knowledge, needs}:
          e = entry_rating_<area>        # 1..7
          x = exit_rating_<area>         # 1..7
          if   x <  e:                                  category = a   # regressed
          elif x == e and x <  AGE_EXPECTED_RATING:      category = b   # no progress, still below
          elif x >  e and x <  AGE_EXPECTED_RATING:      category = c   # progress, still below
          elif x >= AGE_EXPECTED_RATING and e <  AGE_EXPECTED_RATING: category = d  # reached age level
          else:                                         category = e   # maintained age level
    input_set: >-
      The three entry ratings recorded at POST /ei/referrals/{referralId}/entry-outcomes and the
      three exit ratings supplied at exit. Both sets are required for a comparable category; a case
      that exits before entry outcomes were recorded cannot leave ACTIVE_SERVICES at all.
    constants:
      AGE_EXPECTED_RATING: 6
      MINIMUM_COMPARABLE_DURATION_DAYS: 180
    precision: "integer ratings 1..7; the age-expected test is >= 6, so a rating of exactly 6 counts as age-expected"

  # ---------------------------------------------------------------------------
  # 12. Monthly contact compliance
  # ---------------------------------------------------------------------------
  - name: monthly_contact_compliance
    trigger: >-
      Recomputed on POST /ei/referrals/{referralId}/contact-logs, on POST /_clock/set_current_utc
      and on every Referral status transition.
    algorithm: threshold
    formula: |
      if referral.status != ACTIVE_SERVICES:
          return NOT_APPLICABLE

      qualifying = [c for c in contact_logs(referral)
                    if c.contact_method IN QUALIFYING_METHODS
                    and month_of(c.contact_date) == month_of(logical clock date)]

      if qualifying is non-empty:                             monthly_contact_status = COMPLIANT
      elif day_of_month(logical clock date) <= GRACE_DAY_OF_MONTH: monthly_contact_status = DUE
      else:                                                   monthly_contact_status = DELINQUENT
    input_set: >-
      ContactLog rows on the referral, filtered to qualifying methods within the logical clock's
      calendar month. ATTEMPTED_NO_ANSWER, EMAIL and LETTER contacts are logged but never satisfy
      the requirement.
    constants:
      QUALIFYING_METHODS: [HOME_VISIT, PHONE, VIDEO]
      GRACE_DAY_OF_MONTH: 20
    precision: "calendar-month bucketing on the logical clock; a contact in a prior month never satisfies the current month"

  # ---------------------------------------------------------------------------
  # 13. Authorization window overlap — CLOSED intervals (touching endpoints collide)
  # ---------------------------------------------------------------------------
  - name: authorization_window_overlap
    trigger: "Runs on POST /ei/provider-authorizations before any fiscal check."
    algorithm: interval_merge
    formula: |
      # date windows on the SAME ifsp_service_id are treated as CLOSED intervals [start, end]
      conflict = exists a in authorizations(ifsp_service_id) with
                   a.status IN {ACTIVE, SUSPENDED, EXHAUSTED}
                   and new.start_date <= a.end_date
                   and a.start_date   <= new.end_date
      if conflict: raise ERR_AUTHORIZATION_WINDOW_OVERLAP    # 409
    input_set: >-
      ProviderAuthorization rows on the same IFSPService line with status IN
      {ACTIVE, SUSPENDED, EXHAUSTED}. REVOKED and EXPIRED windows are ignored, so a revoked window
      can be re-covered by a new authorization for the same dates.
    constants: {}
    precision: >-
      whole dates, CLOSED/CLOSED semantics: a new window starting exactly on an existing window's
      end date CONFLICTS; starting one day later does not.

  # ---------------------------------------------------------------------------
  # 14. Provider schedule conflict — HALF-OPEN intervals with a cross-setting buffer
  # ---------------------------------------------------------------------------
  - name: provider_visit_schedule_conflict
    trigger: "Runs on POST /ei/service-visits after the authorization state checks."
    algorithm: interval_merge
    formula: |
      new_start = new.scheduled_start
      new_end   = new.scheduled_end            # exclusive

      for v in visits(same provider_id) with visit_status IN {SCHEDULED, DELIVERED}:
          v_start = v.scheduled_start
          v_end   = v.scheduled_end            # exclusive
          if v.setting_code == new.setting_code:
              buffer = 0
          else:
              buffer = CROSS_SETTING_BUFFER_MINUTES        # 30 minutes of travel
          # half-open [start, end) comparison, widened by the buffer
          if new_start < v_end + buffer and v_start < new_end + buffer:
              raise ERR_PROVIDER_SCHEDULE_CONFLICT         # 409
    input_set: >-
      ServiceVisits for the same Provider (reached through provider_authorization.provider_id) with
      visit_status IN {SCHEDULED, DELIVERED}. Cancelled, no-show and voided visits free their slot.
    constants:
      CROSS_SETTING_BUFFER_MINUTES: 30
    precision: >-
      minute resolution, HALF-OPEN [start, end): two same-setting visits may touch exactly
      (09:00-09:30 then 09:30-10:00 is allowed). A different setting_code requires at least
      CROSS_SETTING_BUFFER_MINUTES of clear time on both sides, so 09:30-10:00 in another setting
      conflicts with a 09:00-09:30 visit while 10:00-10:30 does not.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order; the first
# violated rule determines the response, and no state is written on any failure)
# =============================================================================
validations:

  # --- auth -------------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-Role header present and names a role declared in §1.7; X-User-ID present whenever the role is entity_backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role named by X-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "request body parses, contains every required input field, has no unknown field, and every value matches its declared type, enum domain and numeric range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: auth
    check: "limit is an integer in 1..200 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /ei/referrals, GET /ei/assessments, GET /ei/ifsps, GET /ei/ifsp-services, GET /ei/provider-authorizations, GET /ei/service-visits, GET /ei/cost-shares, GET /ei/contact-logs, GET /ei/transition-plans"

  # --- existence (path segments left to right, then body FKs in declaration order)
  - priority: 5
    category: existence
    check: "child_id in the path or body resolves to a Child"
    error_id: ERR_CHILD_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/children/{childId}, POST /ei/referrals"
  - priority: 6
    category: existence
    check: "referralId in the path or referral_id in the body resolves to a Referral"
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "all /ei/referrals/{referralId}/* endpoints, POST /ei/assessments, POST /ei/ifsps, POST /ei/cost-shares"
  - priority: 7
    category: existence
    check: "coordinatorId in the path or coordinator_id in the body resolves to a ServiceCoordinator"
    error_id: ERR_COORDINATOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/service-coordinators/{coordinatorId}, GET /ei/service-coordinators/{coordinatorId}/caseload-summary, POST /ei/referrals/{referralId}/assign-coordinator"
  - priority: 8
    category: existence
    check: "assessmentId in the path resolves to an Assessment"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /ei/assessments/{assessmentId}/complete"
  - priority: 9
    category: existence
    check: "ifspId in the path, ifsp_id in the body and supersedes_ifsp_id when supplied each resolve to an IFSP"
    error_id: ERR_IFSP_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/ifsps/{ifspId}, POST /ei/ifsps/{ifspId}/consent, POST /ei/ifsp-services, POST /ei/transition-plans"
  - priority: 10
    category: existence
    check: "serviceId in the path or ifsp_service_id in the body resolves to an IFSPService"
    error_id: ERR_IFSP_SERVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/ifsp-services/{serviceId}, POST /ei/provider-authorizations"
  - priority: 11
    category: existence
    check: "providerId in the path or provider_id in the body resolves to a Provider"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/providers/{providerId}, POST /ei/providers/{providerId}/suspend, POST /ei/provider-authorizations"
  - priority: 12
    category: existence
    check: "authorizationId in the path or provider_authorization_id in the body resolves to a ProviderAuthorization"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/provider-authorizations/{authorizationId}, POST /ei/provider-authorizations/{authorizationId}/revoke, POST /ei/service-visits"
  - priority: 13
    category: existence
    check: "visitId in the path and makeup_for_visit_id when supplied each resolve to a ServiceVisit"
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/service-visits/{visitId}, POST /ei/service-visits/{visitId}/document, POST /ei/service-visits/{visitId}/void, POST /ei/service-visits"
  - priority: 14
    category: existence
    check: "costShareId in the path resolves to a CostShare"
    error_id: ERR_COST_SHARE_NOT_FOUND
    http_status: 404
    applies_to: "GET /ei/cost-shares/{costShareId}, POST /ei/cost-shares/{costShareId}/finalize, POST /ei/cost-shares/{costShareId}/waive, POST /ei/cost-shares/{costShareId}/insurance-consent"
  - priority: 15
    category: existence
    check: "transitionPlanId in the path resolves to a TransitionPlan"
    error_id: ERR_TRANSITION_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /ei/transition-plans/{transitionPlanId}/notify-lea"

  # --- ownership and segregation of duties ------------------------------------
  - priority: 16
    category: auth
    check: >-
      For entity_backed roles the acting identity must own the target: X-User-ID must equal
      referral.coordinator_id for ServiceCoordinator writes, provider_authorization.provider_id for
      Provider writes, and the referral's child_id for FamilyRepresentative writes.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /ei/referrals/{referralId}/contact-logs, POST /ei/referrals/{referralId}/exit, POST /ei/ifsps/{ifspId}/consent, POST /ei/service-visits/{visitId}/document, POST /ei/transition-plans, POST /ei/transition-plans/{transitionPlanId}/notify-lea"
  - priority: 17
    category: auth
    check: "the FiscalOfficer recorded in cost_share.determined_by_user_id may not waive that same cost share; a different FiscalOfficer must act"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ei/cost-shares/{costShareId}/waive"

  # --- concurrency ------------------------------------------------------------
  - priority: 18
    category: state
    check: "expected_referral_version equals the stored Referral.version"
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412
    applies_to: "POST /ei/ifsps"

  # --- state preconditions ----------------------------------------------------
  - priority: 19
    category: state
    check: "the referral is in a status from which this operation is declared in §1.2"
    error_id: ERR_REFERRAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /ei/referrals/{referralId}/assign-coordinator, POST /ei/referrals/{referralId}/eligibility-determination, POST /ei/referrals/{referralId}/entry-outcomes, POST /ei/referrals/{referralId}/exit, POST /ei/referrals/{referralId}/contact-logs, POST /ei/assessments, POST /ei/ifsps, POST /ei/cost-shares"
  - priority: 20
    category: state
    check: "the IFSP is in a status from which this operation is declared: PENDING_CONSENT or AMENDMENT_PENDING for consent, ACTIVE for authorization creation, DRAFT/PENDING_CONSENT/ACTIVE/AMENDMENT_PENDING for adding a service line"
    error_id: ERR_IFSP_STATE_INVALID
    http_status: 409
    applies_to: "POST /ei/ifsps/{ifspId}/consent, POST /ei/ifsp-services, POST /ei/provider-authorizations, POST /ei/transition-plans"
  - priority: 21
    category: state
    check: "assessment.status == SCHEDULED"
    error_id: ERR_ASSESSMENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /ei/assessments/{assessmentId}/complete"
  - priority: 22
    category: state
    check: "provider.status == ACTIVE"
    error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ei/provider-authorizations, POST /ei/providers/{providerId}/suspend"
  - priority: 23
    category: state
    check: "provider_authorization.status == ACTIVE"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ei/service-visits, POST /ei/provider-authorizations/{authorizationId}/revoke"
  - priority: 24
    category: state
    check: "service_visit.visit_status == SCHEDULED"
    error_id: ERR_VISIT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /ei/service-visits/{visitId}/document"
  - priority: 25
    category: state
    check: "service_visit.visit_status == DELIVERED"
    error_id: ERR_VISIT_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /ei/service-visits/{visitId}/void"
  - priority: 26
    category: state
    check: "ifsp_service.status IN {PLANNED, AUTHORIZED, IN_DELIVERY, AT_RISK}: a DISCONTINUED or COMPLETED line accepts no new authorization"
    error_id: ERR_SERVICE_NOT_DELIVERABLE
    http_status: 409
    applies_to: "POST /ei/provider-authorizations"
  - priority: 27
    category: state
    check: "cost_share.status == PROVISIONAL for finalize and insurance-consent; status IN {PROVISIONAL, VERIFIED} for waive"
    error_id: ERR_COST_SHARE_NOT_PROVISIONAL
    http_status: 409
    applies_to: "POST /ei/cost-shares/{costShareId}/finalize, POST /ei/cost-shares/{costShareId}/insurance-consent, POST /ei/cost-shares/{costShareId}/waive"
  - priority: 28
    category: state
    check: "transition_plan.status == DRAFT"
    error_id: ERR_TRANSITION_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /ei/transition-plans/{transitionPlanId}/notify-lea"

  # --- business_safety (child protection and regulatory compliance first) -----
  - priority: 29
    category: business_safety
    check: "the child is under 3 years old on referral_received_date: third_birthday_date is strictly after referral_received_date"
    error_id: ERR_CHILD_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /ei/referrals"
  - priority: 30
    category: business_safety
    check: "the child has no other Referral with status NOT IN {NOT_ELIGIBLE, EXITED}"
    error_id: ERR_DUPLICATE_REFERRAL
    http_status: 409
    applies_to: "POST /ei/referrals"
  - priority: 31
    category: business_safety
    check: "provider.credential_expiry_date is on or after the requested authorization end_date, so no authorization can extend past the credential"
    error_id: ERR_PROVIDER_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /ei/provider-authorizations"
  - priority: 32
    category: business_safety
    check: "when the plan has at least one service line whose setting_code is not a natural environment, ifsp.natural_environment_justification is present with at least 20 characters"
    error_id: ERR_NATURAL_ENVIRONMENT_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /ei/ifsps/{ifspId}/consent"
  - priority: 33
    category: business_safety
    check: "the referral has at least one COMPLETED Assessment of type INITIAL_EVALUATION and at least one COMPLETED Assessment of type FAMILY_ASSESSMENT"
    error_id: ERR_REQUIRED_ASSESSMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /ei/referrals/{referralId}/eligibility-determination"
  - priority: 34
    category: business_safety
    check: "an INITIAL_EVALUATION assessment lists all five developmental domains in domains_assessed"
    error_id: ERR_EVALUATION_DOMAINS_INCOMPLETE
    http_status: 422
    applies_to: "POST /ei/assessments"
  - priority: 35
    category: business_safety
    check: "conference_held_date is present and transition_steps_count >= 1 before the LEA notification is sent"
    error_id: ERR_TRANSITION_PLAN_INCOMPLETE
    http_status: 422
    applies_to: "POST /ei/transition-plans/{transitionPlanId}/notify-lea"
  - priority: 36
    category: business_safety
    check: >-
      Exit from ACTIVE_SERVICES requires all three exit ratings, and when exit_reason ==
      REACHED_AGE_THREE it also requires a TransitionPlan with status IN {NOTIFIED, OPT_OUT}
    error_id: ERR_EXIT_OUTCOMES_REQUIRED
    http_status: 422
    applies_to: "POST /ei/referrals/{referralId}/exit"

  # --- business_referential ---------------------------------------------------
  - priority: 37
    category: business_referential
    check: >-
      makeup_for_visit_id, when supplied, names a visit with visit_status == CANCELLED_PROVIDER whose
      provider_authorization belongs to the same IFSPService line as the new visit
    error_id: ERR_MAKEUP_TARGET_INVALID
    http_status: 422
    applies_to: "POST /ei/service-visits"
  - priority: 38
    category: business_referential
    check: "no other ServiceVisit with visit_status NOT IN {VOIDED, CANCELLED_PROGRAM} already names the same makeup_for_visit_id"
    error_id: ERR_MAKEUP_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /ei/service-visits"
  - priority: 39
    category: business_referential
    check: >-
      supersedes_ifsp_id is required when ifsp_type == ANNUAL and forbidden when ifsp_type ==
      INITIAL; when supplied it must name an ACTIVE IFSP on the same referral that no other
      non-WITHDRAWN plan already supersedes
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /ei/ifsps"
  - priority: 40
    category: business_referential
    check: "insurance_policy_id is present whenever insurance_use_consent is set to true"
    error_id: ERR_INSURANCE_POLICY_REQUIRED
    http_status: 422
    applies_to: "POST /ei/cost-shares/{costShareId}/insurance-consent, POST /ei/cost-shares/{costShareId}/finalize"
  - priority: 41
    category: business_referential
    check: "the IFSPService.service_type appears in provider.qualified_service_types"
    error_id: ERR_PROVIDER_SERVICE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /ei/provider-authorizations"
  - priority: 42
    category: business_referential
    check: "a PARTIAL consent must leave at least one non-declined service line on the plan, and every id in declined_service_ids must belong to that plan"
    error_id: ERR_ALL_SERVICES_DECLINED
    http_status: 422
    applies_to: "POST /ei/ifsps/{ifspId}/consent"

  # --- business_constraint ----------------------------------------------------
  - priority: 43
    category: business_constraint
    check: "the new authorization window does not overlap any ACTIVE, SUSPENDED or EXHAUSTED window on the same IFSPService line under CLOSED interval semantics"
    error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ei/provider-authorizations"
  - priority: 44
    category: business_constraint
    check: "the new visit does not collide with another SCHEDULED or DELIVERED visit for the same provider under the half-open plus cross-setting-buffer rule of calculations.provider_visit_schedule_conflict"
    error_id: ERR_PROVIDER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /ei/service-visits"
  - priority: 45
    category: business_constraint
    check: "no other CostShare on the referral has the same effective_month with status IN {PROVISIONAL, VERIFIED}"
    error_id: ERR_COST_SHARE_DUPLICATE
    http_status: 409
    applies_to: "POST /ei/cost-shares"
  - priority: 46
    category: business_constraint
    check: "the IFSP has no TransitionPlan with status IN {DRAFT, NOTIFIED, OPT_OUT, COMPLETE}"
    error_id: ERR_TRANSITION_PLAN_DUPLICATE
    http_status: 409
    applies_to: "POST /ei/transition-plans"
  - priority: 47
    category: business_constraint
    check: >-
      an explicitly supplied coordinator_id satisfies the non-capacity clauses of
      calculations.coordinator_auto_selection: status ACTIVE, county match, and language coverage
      when the family needs an interpreter
    error_id: ERR_COORDINATOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /ei/referrals/{referralId}/assign-coordinator"
  - priority: 48
    category: business_constraint
    check: "when coordinator_id is omitted, at least one coordinator satisfies every clause of the auto-selection filter"
    error_id: ERR_NO_ELIGIBLE_COORDINATOR
    http_status: 409
    applies_to: "POST /ei/referrals/{referralId}/assign-coordinator"
  - priority: 49
    category: business_constraint
    check: "coordinator.weighted_caseload_points + the referral's projected case_weight_points <= coordinator.max_weighted_caseload_points"
    error_id: ERR_CASELOAD_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /ei/referrals/{referralId}/assign-coordinator"

  # --- business_temporal ------------------------------------------------------
  - priority: 50
    category: business_temporal
    check: >-
      Event-recording dates are not after the logical clock date: referral_received_date,
      completion_date, determination_date, measurement_date, meeting_date, consent_signed_date,
      opt_out_signed_date, notification_date, verification_date, contact_date, exit_date and a
      provider suspension's effective_date. Authorization windows and visit schedules may be
      future-dated and are exempt.
    error_id: ERR_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /ei/referrals, POST /ei/referrals/{referralId}/eligibility-determination, POST /ei/referrals/{referralId}/entry-outcomes, POST /ei/referrals/{referralId}/exit, POST /ei/referrals/{referralId}/contact-logs, POST /ei/assessments/{assessmentId}/complete, POST /ei/ifsps, POST /ei/ifsps/{ifspId}/consent, POST /ei/cost-shares/{costShareId}/finalize, POST /ei/providers/{providerId}/suspend, POST /ei/transition-plans/{transitionPlanId}/notify-lea"
  - priority: 51
    category: business_temporal
    check: >-
      Ordered date pairs are coherent: start_date <= end_date; completion_date >=
      referral_received_date; determination_date >= referral_received_date; measurement_date >=
      eligibility_determination_date; exit_date >= services_start_date when services started
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /ei/provider-authorizations, POST /ei/assessments/{assessmentId}/complete, POST /ei/referrals/{referralId}/eligibility-determination, POST /ei/referrals/{referralId}/entry-outcomes, POST /ei/referrals/{referralId}/exit"
  - priority: 52
    category: business_temporal
    check: "scheduled_end is strictly after scheduled_start, the span is a whole multiple of 15 minutes and at most 240 minutes, and both endpoints fall on a 15-minute boundary"
    error_id: ERR_INVALID_VISIT_DURATION
    http_status: 422
    applies_to: "POST /ei/service-visits"
  - priority: 53
    category: business_temporal
    check: "a makeup visit is scheduled within constants.MAKEUP_WINDOW_DAYS of the cancelled visit it repairs"
    error_id: ERR_MAKEUP_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /ei/service-visits"
  - priority: 54
    category: business_temporal
    check: "child.third_birthday_date - logical clock date <= constants.TRANSITION_WINDOW_OPEN_DAYS"
    error_id: ERR_TRANSITION_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /ei/transition-plans"
  - priority: 55
    category: business_temporal
    check: "notification_date is on or before child.third_birthday_date, i.e. notification_lead_days >= 0"
    error_id: ERR_NOTIFICATION_AFTER_THIRD_BIRTHDAY
    http_status: 422
    applies_to: "POST /ei/transition-plans/{transitionPlanId}/notify-lea"
  - priority: 56
    category: business_temporal
    check: "the visit's scheduled date falls inside the authorization window, inclusive of both endpoints"
    error_id: ERR_VISIT_OUTSIDE_AUTHORIZATION_WINDOW
    http_status: 422
    applies_to: "POST /ei/service-visits"
  - priority: 57
    category: business_temporal
    check: "a visit may only be documented once its scheduled_start is at or before the logical clock instant"
    error_id: ERR_VISIT_NOT_YET_OCCURRED
    http_status: 422
    applies_to: "POST /ei/service-visits/{visitId}/document"

  # --- business_fiscal (capacity and money last) ------------------------------
  - priority: 58
    category: business_fiscal
    check: "authorized_units <= ifsp_service.units_pool_remaining"
    error_id: ERR_UNITS_EXCEED_SERVICE_POOL
    http_status: 422
    applies_to: "POST /ei/provider-authorizations"
  - priority: 59
    category: business_fiscal
    check: "scheduled_units <= provider_authorization.units_remaining at creation, and actual_units <= provider_authorization.units_remaining at documentation"
    error_id: ERR_UNITS_EXCEED_AUTHORIZATION
    http_status: 422
    applies_to: "POST /ei/service-visits, POST /ei/service-visits/{visitId}/document"
  - priority: 60
    category: business_fiscal
    check: "actual_units >= 1 and actual_units <= service_visit.scheduled_units"
    error_id: ERR_ACTUAL_UNITS_EXCEED_SCHEDULED
    http_status: 422
    applies_to: "POST /ei/service-visits/{visitId}/document"
  - priority: 61
    category: business_fiscal
    check: "waive_amount_cents >= 1 and waive_amount_cents <= cost_share.family_balance_cents"
    error_id: ERR_WAIVE_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /ei/cost-shares/{costShareId}/waive"
  - priority: 62
    category: business_fiscal
    check: >-
      the write leaves the ledger identity total_assessed_cents == family_balance_cents +
      family_waived_cents intact with both components >= 0
    error_id: ERR_LEDGER_WOULD_UNBALANCE
    http_status: 409
    applies_to: "POST /ei/service-visits/{visitId}/void, POST /ei/cost-shares/{costShareId}/waive, POST /ei/cost-shares/{costShareId}/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# All business paths sit under the /ei prefix. Reads are open to the five staff
# roles; ownership scoping (§1.4 priority 16) constrains WRITES only.
# =============================================================================
endpoints:

  # --- test-driving surface (last resort per the §1.5 priority ladder) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock to an explicit instant. Before the first call the logical clock
      reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Every deadline,
      window, expiry, month-bucket and "not in the future" rule in this scaffold is evaluated against
      this clock.
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Referral.gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed for every non-terminal referral"
      - "Referral.case_weight_points recomputed where the transition-window term changes, then the coordinator aggregates recomputed"
      - "Referral.monthly_contact_status recomputed for every ACTIVE_SERVICES referral"
      - "every ACTIVE ProviderAuthorization whose end_date is now in the past transitions to EXPIRED and releases its unspent units"

  # --- Child ------------------------------------------------------------------
  - method: POST
    path: "/ei/children"
    description: "Registers a child record; third_birthday_date is derived from date_of_birth."
    roles: [IntakeSpecialist]
    code: 201
    input: [first_name, last_name, date_of_birth, county_code, primary_language]
    output: Child
    side_effects: ["computes third_birthday_date", "active_referral_count initialised to 0"]
  - method: GET
    path: "/ei/children/{childId}"
    description: "Reads one child."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: Child
    side_effects: []

  # --- ServiceCoordinator -----------------------------------------------------
  - method: POST
    path: "/ei/service-coordinators"
    description: "Registers a service coordinator with a state caseload ceiling in weighted points."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, county_code, language_codes, max_weighted_caseload_points, "status?"]
    output: ServiceCoordinator
    side_effects: ["weighted_caseload_points, active_case_count and utilization_ratio initialised to 0"]
  - method: GET
    path: "/ei/service-coordinators/{coordinatorId}"
    description: "Reads one coordinator with live caseload aggregates."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: ServiceCoordinator
    side_effects: []
  - method: GET
    path: "/ei/service-coordinators/{coordinatorId}/caseload-summary"
    description: "Computed read of the caseload standard: weighted points, utilization and posture."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: "{ coordinator_id: string, active_case_count: integer, weighted_caseload_points: number, max_weighted_caseload_points: number, utilization_ratio: number, caseload_posture: string, headroom_points: number }"
    side_effects: []

  # --- Referral ---------------------------------------------------------------
  - method: POST
    path: "/ei/referrals"
    description: "Intake: opens a case, reports the primary referral source and starts the 45-day statutory clock."
    roles: [IntakeSpecialist]
    code: 201
    input: [child_id, primary_referral_source, referral_received_date, county_code, presenting_concern, "interpreter_required?"]
    output: Referral
    side_effects:
      - "computes statutory_deadline_date as referral_received_date + 45 days"
      - "status set to INTAKE, eligibility_status to PENDING, initial_timeline_status to IN_PROGRESS"
      - "Child.active_referral_count recomputed"
  - method: GET
    path: "/ei/referrals/{referralId}"
    description: "Reads one referral, including its version for optimistic concurrency control."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/ei/referrals"
    description: "Lists referrals, filterable by child, coordinator and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["child_id?", "coordinator_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/ei/referrals/{referralId}/assign-coordinator"
    description: >-
      Assigns a service coordinator. With coordinator_id supplied the named coordinator is validated
      against the eligibility filter; with coordinator_id omitted the server auto-selects by
      calculations.coordinator_auto_selection.
    roles: [ProgramAdmin]
    code: 200
    input: ["coordinator_id?"]
    output: Referral
    side_effects:
      - "referral.status INTAKE -> EVALUATION_PENDING; coordinator_id and assignment_date set"
      - "referral.case_weight_points computed by calculations.case_weight_points"
      - "the coordinator's weighted_caseload_points, active_case_count and utilization_ratio recomputed"
      - "increments Referral.version by 1"
  - method: POST
    path: "/ei/referrals/{referralId}/eligibility-determination"
    description: "Records the eligibility determination; forks the case to ELIGIBILITY_DETERMINED or NOT_ELIGIBLE."
    roles: [ProgramAdmin]
    code: 200
    input: [is_eligible, determination_date]
    output: Referral
    side_effects:
      - "eligibility_status and eligibility_determination_date set"
      - "on is_eligible false: SCHEDULED assessments cancelled, case_weight_points zeroed and the coordinator aggregates recomputed"
      - "excluded_delay_days, gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed"
      - "increments Referral.version by 1"
  - method: POST
    path: "/ei/referrals/{referralId}/entry-outcomes"
    description: "Records the three child-outcome entry ratings and moves the case to IFSP_PENDING."
    roles: [Evaluator]
    code: 200
    input: [measurement_date, rating_social, rating_knowledge, rating_needs]
    output: Referral
    side_effects:
      - "entry_rating_social, entry_rating_knowledge, entry_rating_needs and entry_outcomes_date stored"
      - "referral.status ELIGIBILITY_DETERMINED -> IFSP_PENDING"
      - "increments Referral.version by 1"
  - method: POST
    path: "/ei/referrals/{referralId}/exit"
    description: >-
      Exits the case, records exit outcome ratings, computes the federal progress categories and runs
      the five-hop closure cascade.
    roles: [ServiceCoordinator]
    code: 200
    input: [exit_date, exit_reason, "exit_rating_social?", "exit_rating_knowledge?", "exit_rating_needs?"]
    output: Referral
    side_effects:
      - "exit_date, exit_reason, exit ratings and service_duration_days stored"
      - "progress_category_social, progress_category_knowledge and progress_category_needs computed"
      - "ACTIVE/AMENDMENT_PENDING IFSP -> CLOSED, its lines -> DISCONTINUED, their authorizations -> REVOKED with units released, SCHEDULED visits -> CANCELLED_PROGRAM"
      - "TransitionPlan NOTIFIED/OPT_OUT -> COMPLETE; CostShare PROVISIONAL/VERIFIED -> CLOSED"
      - "case_weight_points zeroed and the coordinator aggregates recomputed"
      - "increments Referral.version by 1"
  - method: GET
    path: "/ei/referrals/{referralId}/timeline-compliance"
    description: "Computed read of the statutory 45-day timeline in both variants plus monthly contact standing."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: "{ referral_id: string, referral_received_date: string, statutory_deadline_date: string, stop_date: string, gross_elapsed_days: integer, excluded_delay_days: integer, net_elapsed_days: integer, initial_timeline_status: string, monthly_contact_status: string, last_qualifying_contact_date: string }"
    side_effects: []

  # --- ContactLog (append-only) ----------------------------------------------
  - method: POST
    path: "/ei/referrals/{referralId}/contact-logs"
    description: "Logs a family contact against the monthly contact requirement."
    roles: [ServiceCoordinator]
    code: 201
    input: [contact_date, contact_method, contact_type, summary]
    output: ContactLog
    side_effects:
      - "computes contact_month and qualifies_for_monthly_requirement"
      - "Referral.last_qualifying_contact_date and monthly_contact_status recomputed"
  - method: GET
    path: "/ei/contact-logs"
    description: "Lists contact logs, filterable by referral and method."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["referral_id?", "contact_method?", "limit?", "offset?"]
    output: ContactLog[]
    side_effects: []
  - method: GET
    path: "/ei/contact-logs/{contactLogId}"
    description: "Reads one contact log entry."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: ContactLog
    side_effects: []

  # --- Assessment -------------------------------------------------------------
  - method: POST
    path: "/ei/assessments"
    description: >-
      Schedules an evaluation or family assessment. A SUPPLEMENTAL_EVALUATION on an IFSP_PENDING case
      reverts the case to EVALUATION_PENDING and withdraws any un-consented plan.
    roles: [Evaluator]
    code: 201
    input: [referral_id, assessment_type, scheduled_date, setting_code, "natural_environment_justification?", "domains_assessed?"]
    output: Assessment
    side_effects:
      - "status set to SCHEDULED; evaluator_user_id captured from X-User-ID"
      - "on SUPPLEMENTAL_EVALUATION for an IFSP_PENDING referral: referral reverts to EVALUATION_PENDING, DRAFT/PENDING_CONSENT plans -> WITHDRAWN, their lines -> DISCONTINUED, case_weight_points and coordinator aggregates recomputed"
  - method: GET
    path: "/ei/assessments/{assessmentId}"
    description: "Reads one assessment."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/ei/assessments"
    description: "Lists assessments, filterable by referral, type and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["referral_id?", "assessment_type?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: POST
    path: "/ei/assessments/{assessmentId}/complete"
    description: "Completes an assessment and records documented family-unavailable days."
    roles: [Evaluator]
    code: 200
    input: [completion_date, eligibility_recommendation, "family_unavailable_days?"]
    output: Assessment
    side_effects:
      - "status SCHEDULED -> COMPLETED; completion_date, eligibility_recommendation and family_unavailable_days stored"
      - "Referral.excluded_delay_days, gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed"

  # --- IFSP -------------------------------------------------------------------
  - method: POST
    path: "/ei/ifsps"
    description: >-
      Authors a plan against a referral. Guarded by optimistic concurrency control:
      expected_referral_version must equal the referral's current version.
    roles: [ProgramAdmin]
    code: 201
    input: [referral_id, ifsp_type, meeting_date, authoring_coordinator_id, expected_referral_version, "supersedes_ifsp_id?", "natural_environment_justification?"]
    output: IFSP
    side_effects:
      - "status set to DRAFT; Referral.initial_ifsp_meeting_date set for an INITIAL plan"
      - "Referral gross_elapsed_days, net_elapsed_days and initial_timeline_status recomputed against the meeting date"
      - "increments Referral.version by 1"
  - method: GET
    path: "/ei/ifsps/{ifspId}"
    description: "Reads one plan with its derived service-line counts."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: IFSP
    side_effects: []
  - method: GET
    path: "/ei/ifsps"
    description: "Lists plans, filterable by referral, superseded plan, authoring coordinator and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["referral_id?", "supersedes_ifsp_id?", "authoring_coordinator_id?", "status?", "limit?", "offset?"]
    output: IFSP[]
    side_effects: []
  - method: POST
    path: "/ei/ifsps/{ifspId}/consent"
    description: >-
      Records parental consent. FULL consent activates every line; PARTIAL consent discontinues the
      lines named in declined_service_ids. Activating an INITIAL plan starts services on the case.
    roles: [FamilyRepresentative]
    code: 200
    input: [consent_scope, consent_signed_date, "declined_service_ids?"]
    output: IFSP
    side_effects:
      - "status PENDING_CONSENT -> ACTIVE or AMENDMENT_PENDING -> ACTIVE; consent_scope, consent_signed_date, consent_user_id and activated_date stored"
      - "declined lines get declined_by_family = true and transition to DISCONTINUED; service_line_count and non_natural_setting_line_count recomputed"
      - "for an INITIAL plan: Referral IFSP_PENDING -> ACTIVE_SERVICES, services_start_date set, case_weight_points and coordinator aggregates recomputed"
      - "when supersedes_ifsp_id is set: the prior plan -> SUPERSEDED and its authorizations -> REVOKED with units released"

  # --- IFSPService ------------------------------------------------------------
  - method: POST
    path: "/ei/ifsp-services"
    description: >-
      Adds a service line to a plan. The first line moves a DRAFT plan to PENDING_CONSENT; a line
      added to an ACTIVE plan moves it to AMENDMENT_PENDING and blocks new authorizations until it is
      re-consented.
    roles: [ProgramAdmin]
    code: 201
    input: [ifsp_id, service_type, setting_code, frequency_per_month, units_per_session, unit_rate_cents, planned_units_total, "natural_environment_justification?"]
    output: IFSPService
    side_effects:
      - "status set to PLANNED; family_fee_exempt computed from service_type; units_committed 0 and units_pool_remaining = planned_units_total"
      - "IFSP.service_line_count and non_natural_setting_line_count recomputed; plan status DRAFT -> PENDING_CONSENT or ACTIVE -> AMENDMENT_PENDING"
      - "Referral.case_weight_points recomputed when the line count crosses the 4-line threshold, then the coordinator aggregates recomputed"
  - method: GET
    path: "/ei/ifsp-services/{serviceId}"
    description: "Reads one service line with its unit-pool fields."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: IFSPService
    side_effects: []
  - method: GET
    path: "/ei/ifsp-services"
    description: "Lists service lines, filterable by plan and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["ifsp_id?", "status?", "limit?", "offset?"]
    output: IFSPService[]
    side_effects: []

  # --- Provider ---------------------------------------------------------------
  - method: POST
    path: "/ei/providers"
    description: "Registers a provider agency with its credentialed service types and credential expiry."
    roles: [ProgramAdmin]
    code: 201
    input: [agency_name, qualified_service_types, credential_expiry_date]
    output: Provider
    side_effects: ["status set to ACTIVE; active_authorization_count initialised to 0"]
  - method: GET
    path: "/ei/providers/{providerId}"
    description: "Reads one provider."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/ei/providers/{providerId}/suspend"
    description: >-
      Suspends or terminates a provider. CONTRACT_ENDED terminates and revokes the provider's
      authorizations; every other reason suspends them. Head of the five-hop service-gap cascade.
    roles: [ProgramAdmin]
    code: 200
    input: [suspension_reason_code, effective_date]
    output: Provider
    side_effects:
      - "status ACTIVE -> SUSPENDED or ACTIVE -> TERMINATED; suspension_reason_code and suspended_date stored"
      - "ACTIVE authorizations -> SUSPENDED, or -> REVOKED with units released when terminated"
      - "SCHEDULED visits on those authorizations -> CANCELLED_PROVIDER with billing_status CANCELLED_NO_CHARGE"
      - "IFSPService.makeup_owed_units increased and the line -> AT_RISK when the owed total exceeds 4 units"
      - "Referral.service_gap_flag set to true for every affected case"

  # --- ProviderAuthorization --------------------------------------------------
  - method: POST
    path: "/ei/provider-authorizations"
    description: >-
      Authorizes a provider to deliver a service line for a date window, drawing units from the
      line's pool. Windows on one line are closed intervals and may not touch or overlap.
    roles: [ProgramAdmin]
    code: 201
    input: [ifsp_service_id, provider_id, start_date, end_date, authorized_units]
    output: ProviderAuthorization
    side_effects:
      - "status set to ACTIVE; unit_rate_cents pinned from IFSPService.unit_rate_cents; units_remaining = authorized_units"
      - "IFSPService.units_committed and units_pool_remaining recomputed; line status PLANNED -> AUTHORIZED"
      - "Provider.active_authorization_count recomputed"
  - method: GET
    path: "/ei/provider-authorizations/{authorizationId}"
    description: "Reads one authorization with its unit counters."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: ProviderAuthorization
    side_effects: []
  - method: GET
    path: "/ei/provider-authorizations"
    description: "Lists authorizations, filterable by service line, provider and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["ifsp_service_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: ProviderAuthorization[]
    side_effects: []
  - method: POST
    path: "/ei/provider-authorizations/{authorizationId}/revoke"
    description: "Revokes an authorization, releasing its unspent units back to the service line's pool."
    roles: [ProgramAdmin]
    code: 200
    input: [revocation_reason_code]
    output: ProviderAuthorization
    side_effects:
      - "status -> REVOKED; units_released = units_remaining; revoked_date and revocation_reason_code stored"
      - "SCHEDULED visits on this authorization -> CANCELLED_PROGRAM with billing_status CANCELLED_NO_CHARGE"
      - "IFSPService.units_committed and units_pool_remaining recomputed, restoring the unit-pool invariant"
      - "Provider.active_authorization_count recomputed"

  # --- ServiceVisit -----------------------------------------------------------
  - method: POST
    path: "/ei/service-visits"
    description: >-
      Schedules a session against an authorization. Same-provider intervals are half-open, so
      back-to-back same-setting sessions are legal while a change of setting needs a 30-minute buffer.
      Supplying makeup_for_visit_id marks the session as the makeup for a provider cancellation.
    roles: [ProgramAdmin, ServiceCoordinator]
    code: 201
    input: [provider_authorization_id, scheduled_start, scheduled_end, setting_code, "makeup_for_visit_id?"]
    output: ServiceVisit
    side_effects:
      - "visit_status set to SCHEDULED, billing_status to PENDING; scheduled_units computed from the interval"
      - "no units are consumed and no family share accrues until the visit is documented"
  - method: GET
    path: "/ei/service-visits/{visitId}"
    description: "Reads one visit with both status dimensions."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/ei/service-visits"
    description: "Lists visits, filterable by authorization, makeup target and either status dimension."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["provider_authorization_id?", "makeup_for_visit_id?", "visit_status?", "billing_status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/ei/service-visits/{visitId}/document"
    description: >-
      Documents delivery or non-delivery. DELIVERED consumes authorization units, accrues the family
      share against the selected cost share and can complete the line; CANCELLED_PROVIDER creates a
      makeup obligation.
    roles: [Provider]
    code: 200
    input: [visit_status, "actual_units?", "actual_start?", "actual_end?", "session_note?"]
    output: ServiceVisit
    side_effects:
      - "visit_status and (on delivery) actual_units, actual_start, actual_end, session_note and documented_by_user_id stored"
      - "on delivery: ProviderAuthorization.units_consumed and IFSPService.units_delivered increased; the authorization may reach EXHAUSTED and the line IN_DELIVERY or COMPLETED"
      - "on delivery: family_share_cents computed, billing_status set to ACCRUED, EXEMPT or CAPPED, and the selected CostShare.month_accrued_cents, total_assessed_cents and family_balance_cents increased"
      - "on CANCELLED_PROVIDER: IFSPService.makeup_owed_units increased and the line may reach AT_RISK, setting Referral.service_gap_flag"
      - "on a DELIVERED makeup visit: makeup_owed_units reduced and the line may return to IN_DELIVERY"
  - method: POST
    path: "/ei/service-visits/{visitId}/void"
    description: >-
      Voids a documented visit as a compensating action: units are returned, the family accrual is
      reversed and an EXHAUSTED authorization returns to ACTIVE.
    roles: [ProgramAdmin]
    code: 200
    input: [void_reason_code]
    output: ServiceVisit
    side_effects:
      - "visit_status DELIVERED -> VOIDED; billing_status -> REVERSED; void_reason_code stored"
      - "ProviderAuthorization.units_consumed and IFSPService.units_delivered decreased by actual_units"
      - "CostShare.month_accrued_cents, total_assessed_cents and family_balance_cents decreased by family_share_cents"
      - "EXHAUSTED authorization returns to ACTIVE"

  # --- CostShare --------------------------------------------------------------
  - method: POST
    path: "/ei/cost-shares"
    description: >-
      Determines the family's sliding-scale participation for a month from self-declared income
      (PROVISIONAL variant, never insurance-offset).
    roles: [FiscalOfficer]
    code: 201
    input: [referral_id, effective_month, household_size, declared_annual_gross_income_cents, insurance_use_consent, "insurance_policy_id?"]
    output: CostShare
    side_effects:
      - "status set to PROVISIONAL; determined_by_user_id captured from X-User-ID"
      - "fpl_threshold_cents, fpl_percent, tier_code, coinsurance_rate, monthly_cap_cents, effective_coinsurance_rate and assessed_monthly_fee_cents computed by the PROVISIONAL variant"
      - "any earlier PROVISIONAL/VERIFIED row on the referral with an earlier effective_month -> SUPERSEDED"
  - method: GET
    path: "/ei/cost-shares/{costShareId}"
    description: "Reads one cost-share determination with its ledger fields."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: CostShare
    side_effects: []
  - method: GET
    path: "/ei/cost-shares"
    description: "Lists cost-share determinations, filterable by referral and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["referral_id?", "status?", "limit?", "offset?"]
    output: CostShare[]
    side_effects: []
  - method: POST
    path: "/ei/cost-shares/{costShareId}/finalize"
    description: >-
      Records verified income and re-runs the sliding scale in the FINAL variant, applying the 60%
      insurance offset when the family consented and a policy is on file.
    roles: [FiscalOfficer]
    code: 200
    input: [verified_annual_gross_income_cents, verification_date]
    output: CostShare
    side_effects:
      - "status PROVISIONAL -> VERIFIED; verified_annual_gross_income_cents and verification_date stored"
      - "fpl_percent, tier_code, coinsurance_rate, monthly_cap_cents, effective_coinsurance_rate, insurance_offset_cents and final_monthly_fee_cents recomputed by the FINAL variant"
      - "already-accrued visits are not re-priced; the ledger identity is preserved"
  - method: POST
    path: "/ei/cost-shares/{costShareId}/waive"
    description: >-
      Waives part of the outstanding family balance. Segregation of duties: the fiscal officer who
      determined the row may not waive it.
    roles: [FiscalOfficer]
    code: 200
    input: [waive_amount_cents, waiver_reason_code]
    output: CostShare
    side_effects:
      - "family_waived_cents increased and family_balance_cents decreased by waive_amount_cents; waiver_reason_code stored"
      - "total_assessed_cents is unchanged, so the ledger identity total_assessed_cents == family_balance_cents + family_waived_cents still holds"
  - method: POST
    path: "/ei/cost-shares/{costShareId}/insurance-consent"
    description: "Records or withdraws the family's consent to bill private insurance for this determination."
    roles: [FiscalOfficer]
    code: 200
    input: [insurance_use_consent, "insurance_policy_id?"]
    output: CostShare
    side_effects:
      - "insurance_use_consent and insurance_policy_id updated while the row is still PROVISIONAL"
      - "no fee is recomputed here: the offset is applied only by the FINAL variant at finalize"

  # --- TransitionPlan ---------------------------------------------------------
  - method: POST
    path: "/ei/transition-plans"
    description: >-
      Opens transition planning for a child approaching age three. Allowed only once the transition
      window is open (third birthday within 270 days) and only once per plan.
    roles: [ServiceCoordinator]
    code: 201
    input: [ifsp_id, target_conference_date, "conference_held_date?", "transition_steps_count?"]
    output: TransitionPlan
    side_effects: ["status set to DRAFT; notification fields left null"]
  - method: GET
    path: "/ei/transition-plans/{transitionPlanId}"
    description: "Reads one transition plan with its notification verdict."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: []
  - method: GET
    path: "/ei/transition-plans"
    description: "Lists transition plans, filterable by plan and status."
    roles: [ProgramAdmin, ServiceCoordinator, Evaluator, FiscalOfficer, IntakeSpecialist]
    code: 200
    input: ["ifsp_id?", "status?", "limit?", "offset?"]
    output: TransitionPlan[]
    side_effects: []
  - method: POST
    path: "/ei/transition-plans/{transitionPlanId}/notify-lea"
    description: >-
      Sends (or waives) the local education agency notification and grades its timeliness against the
      90-day statutory lead.
    roles: [ServiceCoordinator]
    code: 200
    input: [notification_date, family_opt_out, "lea_code?", "opt_out_signed_date?"]
    output: TransitionPlan
    side_effects:
      - "status DRAFT -> NOTIFIED, or DRAFT -> OPT_OUT when family_opt_out is true"
      - "lea_code or opt_out_signed_date, notification_date, notification_lead_days and notification_compliance stored"

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, message: "Authentication headers missing or unknown role" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, message: "Role not permitted for this operation" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, message: "Request body invalid, incomplete or out of range" }
  - { error_id: ERR_INVALID_PAGINATION, http_status: 400, message: "limit or offset out of range" }
  - { error_id: ERR_CHILD_NOT_FOUND, http_status: 404, message: "Child not found" }
  - { error_id: ERR_REFERRAL_NOT_FOUND, http_status: 404, message: "Referral not found" }
  - { error_id: ERR_COORDINATOR_NOT_FOUND, http_status: 404, message: "Service coordinator not found" }
  - { error_id: ERR_ASSESSMENT_NOT_FOUND, http_status: 404, message: "Assessment not found" }
  - { error_id: ERR_IFSP_NOT_FOUND, http_status: 404, message: "IFSP not found" }
  - { error_id: ERR_IFSP_SERVICE_NOT_FOUND, http_status: 404, message: "IFSP service line not found" }
  - { error_id: ERR_PROVIDER_NOT_FOUND, http_status: 404, message: "Provider not found" }
  - { error_id: ERR_AUTHORIZATION_NOT_FOUND, http_status: 404, message: "Provider authorization not found" }
  - { error_id: ERR_VISIT_NOT_FOUND, http_status: 404, message: "Service visit not found" }
  - { error_id: ERR_COST_SHARE_NOT_FOUND, http_status: 404, message: "Cost share determination not found" }
  - { error_id: ERR_TRANSITION_PLAN_NOT_FOUND, http_status: 404, message: "Transition plan not found" }
  - { error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, message: "Acting identity does not own this resource" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "The determining fiscal officer may not waive this balance" }
  - { error_id: ERR_STALE_REFERRAL_VERSION, http_status: 412, message: "expected_referral_version does not match the stored referral version" }
  - { error_id: ERR_REFERRAL_STATE_INVALID, http_status: 409, message: "Referral is not in a state that permits this operation" }
  - { error_id: ERR_IFSP_STATE_INVALID, http_status: 409, message: "IFSP is not in a state that permits this operation" }
  - { error_id: ERR_ASSESSMENT_NOT_SCHEDULED, http_status: 409, message: "Assessment is not scheduled" }
  - { error_id: ERR_PROVIDER_NOT_ACTIVE, http_status: 409, message: "Provider is not in ACTIVE standing" }
  - { error_id: ERR_AUTHORIZATION_NOT_ACTIVE, http_status: 409, message: "Provider authorization is not ACTIVE" }
  - { error_id: ERR_VISIT_NOT_SCHEDULED, http_status: 409, message: "Service visit is not SCHEDULED" }
  - { error_id: ERR_VISIT_NOT_VOIDABLE, http_status: 409, message: "Only a DELIVERED visit can be voided" }
  - { error_id: ERR_SERVICE_NOT_DELIVERABLE, http_status: 409, message: "Service line is discontinued or completed" }
  - { error_id: ERR_COST_SHARE_NOT_PROVISIONAL, http_status: 409, message: "Cost share determination is not in the required status" }
  - { error_id: ERR_TRANSITION_PLAN_STATE_INVALID, http_status: 409, message: "Transition plan is not in DRAFT" }
  - { error_id: ERR_CHILD_AGE_INELIGIBLE, http_status: 422, message: "Child is already three years old on the referral date" }
  - { error_id: ERR_DUPLICATE_REFERRAL, http_status: 409, message: "Child already has an open referral" }
  - { error_id: ERR_PROVIDER_CREDENTIAL_EXPIRED, http_status: 422, message: "Authorization window extends past the provider credential expiry" }
  - { error_id: ERR_NATURAL_ENVIRONMENT_JUSTIFICATION_REQUIRED, http_status: 422, message: "Non-natural service setting requires a written justification" }
  - { error_id: ERR_REQUIRED_ASSESSMENTS_INCOMPLETE, http_status: 422, message: "Initial evaluation and family assessment must both be completed" }
  - { error_id: ERR_EVALUATION_DOMAINS_INCOMPLETE, http_status: 422, message: "An initial evaluation must cover all five developmental domains" }
  - { error_id: ERR_TRANSITION_PLAN_INCOMPLETE, http_status: 422, message: "Transition conference and steps must be recorded before notification" }
  - { error_id: ERR_EXIT_OUTCOMES_REQUIRED, http_status: 422, message: "Exit outcome ratings or LEA notification missing" }
  - { error_id: ERR_MAKEUP_TARGET_INVALID, http_status: 422, message: "Makeup target is not a provider-cancelled visit on the same service line" }
  - { error_id: ERR_MAKEUP_ALREADY_SCHEDULED, http_status: 409, message: "A makeup visit already exists for that cancellation" }
  - { error_id: ERR_SUPERSEDE_TARGET_INVALID, http_status: 422, message: "supersedes_ifsp_id missing, forbidden or not an active plan on this referral" }
  - { error_id: ERR_INSURANCE_POLICY_REQUIRED, http_status: 422, message: "Insurance consent requires a policy identifier" }
  - { error_id: ERR_PROVIDER_SERVICE_TYPE_MISMATCH, http_status: 422, message: "Provider is not credentialed for this service type" }
  - { error_id: ERR_ALL_SERVICES_DECLINED, http_status: 422, message: "Partial consent must leave at least one service line" }
  - { error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http_status: 409, message: "Authorization window overlaps an existing window on this service line" }
  - { error_id: ERR_PROVIDER_SCHEDULE_CONFLICT, http_status: 409, message: "Provider already has a session in that time window" }
  - { error_id: ERR_COST_SHARE_DUPLICATE, http_status: 409, message: "A cost share determination already exists for that month" }
  - { error_id: ERR_TRANSITION_PLAN_DUPLICATE, http_status: 409, message: "This plan already has a transition plan" }
  - { error_id: ERR_COORDINATOR_NOT_ELIGIBLE, http_status: 422, message: "Named coordinator fails the assignment eligibility filter" }
  - { error_id: ERR_NO_ELIGIBLE_COORDINATOR, http_status: 409, message: "No coordinator satisfies the assignment filter" }
  - { error_id: ERR_CASELOAD_CAP_EXCEEDED, http_status: 409, message: "Assignment would exceed the coordinator caseload standard" }
  - { error_id: ERR_DATE_IN_FUTURE, http_status: 422, message: "Recorded event date is after the logical clock date" }
  - { error_id: ERR_INVALID_DATE_RANGE, http_status: 422, message: "Date pair is out of order" }
  - { error_id: ERR_INVALID_VISIT_DURATION, http_status: 422, message: "Visit interval must be a whole number of 15-minute units" }
  - { error_id: ERR_MAKEUP_WINDOW_EXPIRED, http_status: 422, message: "Makeup visit falls outside the 30-day makeup window" }
  - { error_id: ERR_TRANSITION_WINDOW_NOT_OPEN, http_status: 422, message: "Transition window is not open for this child yet" }
  - { error_id: ERR_NOTIFICATION_AFTER_THIRD_BIRTHDAY, http_status: 422, message: "LEA notification date is after the child's third birthday" }
  - { error_id: ERR_VISIT_OUTSIDE_AUTHORIZATION_WINDOW, http_status: 422, message: "Visit date falls outside the authorization window" }
  - { error_id: ERR_VISIT_NOT_YET_OCCURRED, http_status: 422, message: "Visit cannot be documented before it starts" }
  - { error_id: ERR_UNITS_EXCEED_SERVICE_POOL, http_status: 422, message: "Authorized units exceed the service line's remaining pool" }
  - { error_id: ERR_UNITS_EXCEED_AUTHORIZATION, http_status: 422, message: "Units exceed the authorization's remaining units" }
  - { error_id: ERR_ACTUAL_UNITS_EXCEED_SCHEDULED, http_status: 422, message: "Actual units exceed the scheduled units for this visit" }
  - { error_id: ERR_WAIVE_EXCEEDS_BALANCE, http_status: 422, message: "Waiver exceeds the outstanding family balance" }
  - { error_id: ERR_LEDGER_WOULD_UNBALANCE, http_status: 409, message: "Operation would break the family ledger identity" }

# =============================================================================
# §1.7 RBAC Table
# role_model: segregation_of_duties — plus peer ownership for the three
# entity_backed roles. Ownership scoping applies to WRITES only; the five staff
# roles share read access across the program.
# =============================================================================
roles:
  - name: IntakeSpecialist
    identity: opaque
    description: "Front-door intake staff: registers children and opens referrals."
    exclusive_operations:
      - "POST /ei/children"
      - "POST /ei/referrals"
    shared_operations:
      - "every GET under /ei"
    forbidden_operations:
      - "any coordinator assignment, eligibility, plan, authorization, delivery or fiscal write"
  - name: ProgramAdmin
    identity: opaque
    description: >-
      Program operations: coordinator roster, caseload assignment, eligibility determination, plan
      authoring, provider network, authorizations, visit scheduling, visit voids and the logical clock.
    exclusive_operations:
      - "POST /ei/service-coordinators"
      - "POST /ei/referrals/{referralId}/assign-coordinator"
      - "POST /ei/referrals/{referralId}/eligibility-determination"
      - "POST /ei/ifsps"
      - "POST /ei/ifsp-services"
      - "POST /ei/providers"
      - "POST /ei/providers/{providerId}/suspend"
      - "POST /ei/provider-authorizations"
      - "POST /ei/provider-authorizations/{authorizationId}/revoke"
      - "POST /ei/service-visits/{visitId}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /ei/service-visits"
      - "every GET under /ei"
    forbidden_operations:
      - "POST /ei/assessments and /complete (Evaluator only)"
      - "POST /ei/ifsps/{ifspId}/consent (FamilyRepresentative only)"
      - "POST /ei/service-visits/{visitId}/document (Provider only)"
      - "every /ei/cost-shares write (FiscalOfficer only)"
      - "POST /ei/referrals/{referralId}/exit, contact-logs, transition-plans and notify-lea (ServiceCoordinator only)"
  - name: Evaluator
    identity: opaque
    description: "Multidisciplinary evaluation staff: schedules and completes assessments, records entry outcomes."
    exclusive_operations:
      - "POST /ei/assessments"
      - "POST /ei/assessments/{assessmentId}/complete"
      - "POST /ei/referrals/{referralId}/entry-outcomes"
    shared_operations:
      - "every GET under /ei"
    forbidden_operations:
      - "eligibility determination, plan authoring, authorizations, delivery documentation and all fiscal writes"
  - name: FiscalOfficer
    identity: opaque
    description: >-
      Family cost participation: determines the sliding scale, finalizes verified income, records
      insurance consent and waives balances. Segregation of duties applies within this role.
    exclusive_operations:
      - "POST /ei/cost-shares"
      - "POST /ei/cost-shares/{costShareId}/finalize"
      - "POST /ei/cost-shares/{costShareId}/waive"
      - "POST /ei/cost-shares/{costShareId}/insurance-consent"
    shared_operations:
      - "every GET under /ei"
    forbidden_operations:
      - "any clinical, plan, authorization or delivery write"
    segregation_of_duties:
      - "the X-User-ID recorded in CostShare.determined_by_user_id may not call POST /ei/cost-shares/{costShareId}/waive on that row; a different FiscalOfficer identity must act (ERR_SEGREGATION_OF_DUTIES, 403)"
  - name: ServiceCoordinator
    identity: "entity_backed:ServiceCoordinator"
    description: >-
      The assigned coordinator for a case. X-User-ID is a ServiceCoordinator.id. Owns its caseload's
      referrals: monthly contacts, transition planning, LEA notification and case exit.
    exclusive_operations:
      - "POST /ei/referrals/{referralId}/contact-logs"
      - "POST /ei/referrals/{referralId}/exit"
      - "POST /ei/transition-plans"
      - "POST /ei/transition-plans/{transitionPlanId}/notify-lea"
    shared_operations:
      - "POST /ei/service-visits"
      - "every GET under /ei"
    forbidden_operations:
      - "writes against a referral whose coordinator_id is a different identity (ERR_NOT_RESOURCE_OWNER, 403)"
      - "eligibility determination, plan authoring, authorizations, visit documentation and fiscal writes"
  - name: Provider
    identity: "entity_backed:Provider"
    description: >-
      The authorized delivering provider. X-User-ID is a Provider.id and must equal the visit's
      authorization provider_id.
    exclusive_operations:
      - "POST /ei/service-visits/{visitId}/document"
    shared_operations: []
    forbidden_operations:
      - "documenting a visit on another provider's authorization (ERR_NOT_RESOURCE_OWNER, 403)"
      - "voiding a visit, creating authorizations, and every read under /ei"
  - name: FamilyRepresentative
    identity: "entity_backed:Child"
    description: >-
      The parent or guardian acting for the child. X-User-ID is a Child.id and must equal the
      referral's child_id.
    exclusive_operations:
      - "POST /ei/ifsps/{ifspId}/consent"
    shared_operations: []
    forbidden_operations:
      - "consenting to a plan for another child (ERR_NOT_RESOURCE_OWNER, 403)"
      - "every other write and every read under /ei"
