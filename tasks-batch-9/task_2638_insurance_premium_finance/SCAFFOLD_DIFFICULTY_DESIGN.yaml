  - rule_id: priority_pair_validation_conflict
    instances:

      - name: licensing_beats_temporal_due_date_on_origination
        grounds:
          - validations.priority_22_ERR_STATE_NOT_LICENSED
          - validations.priority_33_ERR_INVALID_FIRST_DUE_DATE
          - errors.ERR_STATE_NOT_LICENSED
          - errors.ERR_INVALID_REQUEST
          - state_machines.License.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair business_safety (priority 22) versus business_temporal (priority 33) on
          POST /agreements. The scaffold's stated ordering rationale is that a deal the company may
          not legally write in that state is reported before anything about how the deal is priced or
          scheduled, so the suspended-license failure must surface even though the requested first
          installment date is also plainly invalid. Both control legs are included so the test cannot
          pass by always returning the licensing error.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; one TX StateRateRule with license_required == true whose only License has been SUSPENDED"
            - "one Insured and one ACTIVE ProducerAgent, so no earlier-priority rule can fire"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
