      - name: declination_rescind_is_refused_once_the_row_is_already_rescinded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DECLINATION_INVALID_STATE]
          - state_machines.MatterDeclination.ACTIVE_to_RESCINDED
          - state_machines.ClientBookEntry.DECLINED_to_VALIDATED
          - calculations.declination_revenue_split
        distinguishing_aspect: |
          The refusal has to be distinguished from the LAST-ONE side effect that fires on the
          same endpoint: rescinding declination 1 while declination 2 is still ACTIVE leaves
          the entry DECLINED, so a second rescind of row 1 is a pure no-op that must 409
          rather than re-run the restoration. Rescinding row 2 afterwards is the last ACTIVE
