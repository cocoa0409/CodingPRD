              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_PAUSE_WINDOW_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: mrr_conserved_across_subscription_create_then_cancel
        grounds:
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - calculations.account_mrr
          - entities.Account.fields.mrr_cents
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/cancel"]
        distinguishing_aspect: |
          Conserved quantity Account.mrr_cents: a forward action (subscription create -> ACTIVE, +9000)
          paired with its compensating action (cancel, -9000) leaves Account.mrr_cents back at its
          pre-action value 0 — invariant: Account.mrr_cents == sum of ACTIVE subs' contributions.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan fee 9000 trial_days 0 (immediate ACTIVE); account mrr starts 0"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "inv9@x.com", company_name: "Inv9", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr_mid: $.data.mrr_cents }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/cancel"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr_after: $.data.mrr_cents }
          assert:
            - "Account.${acct_id}.mrr_cents == 9000 immediately after the ACTIVE subscription create"
            - "Account.${acct_id}.mrr_cents == 0 after cancel (returned to its pre-create value)"

      - name: contribution_conserved_across_addon_add_then_remove
        grounds:
          - calculations.account_mrr
          - entities.Subscription.fields.mrr_contribution_cents
          - entities.SubscriptionAddOn.fields.status
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/addons"]
          - endpoints["DELETE /accounts/{id}/subscriptions/{sid}/addons/{aid}"]
        distinguishing_aspect: |
          A different conserved quantity (Subscription.mrr_contribution_cents, not account-level MRR):
          add SEATS (+2000 -> 11000) then remove it (-2000) restores contribution to the base 9000 —
          invariant: contribution == plan fee + sum of ACTIVE add-on fees.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan fee 9000 trial_days 0 (ACTIVE); AddOn SEATS fee 2000"
            - "ACTIVE PRO subscription; SEATS add-on attached (contribution 11000)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "SEATS", monthly_fee_cents: 2000 }
              as: BillingAdmin
              captures: { seats_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "addon@x.com", company_name: "AddCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/addons"
              payload: { addon_id: "${seats_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sa_id: $.data.id }
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { contrib_mid: $.data.mrr_contribution_cents }
          trigger:
            - call: "DELETE /accounts/${acct_id}/subscriptions/${sub_id}/addons/${sa_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { contrib_after: $.data.mrr_contribution_cents }
          assert:
            - "Subscription.${sub_id}.mrr_contribution_cents == 11000 after the add-on is attached"
            - "Subscription.${sub_id}.mrr_contribution_cents == 9000 after the add-on is removed"
