        distinguishing_aspect: |
          Category pair state vs business_constraint: cancelling an already-CANCELLED
          membership that (before cancellation) had an open call must surface
          ERR_INVALID_STATE (priority 6) and NOT ERR_OPEN_SERVICE_CALLS (priority 15),
