      - name: required_test_set_expands_with_the_profile_flags
        claim_type: conditional_validation
        grounds:
          - calculations.test_minimum_value
          - validations[priority=37]
          - validations[priority=36]
          - validations[priority=50]
          - validations[priority=59]
          - validations[priority=27]
          - errors[ERR_REQUIRED_TEST_MISSING]
          - errors[ERR_MEASURED_VALUE_BELOW_MINIMUM]
          - errors[ERR_TEST_TYPE_UNSUPPORTED]
          - errors[ERR_INVALID_TEST_WINDOW]
          - errors[ERR_TEST_NOT_SCHEDULED]
        distinguishing_aspect: |
          A CA profile with requires_joint_strength_test and requires_rollover_protection both true expands
          the required set from three types to five, so a bus with four PASSED tests still cannot certify.
          The same walk pins the conditional minima (JOINT_STRENGTH takes 62.5 from the profile, ROLLOVER
          takes round_half_up(21500 * 0.0025) == 53.75 from the model), shows that a PASS below the minimum
          is refused while leaving the test SCHEDULED for a second attempt, that a bay only accepts the types
          it supports, that a reversed day window is refused, and that a recorded test cannot be recorded
          twice. Under a TX-style profile the same bus would have certified after three tests.
