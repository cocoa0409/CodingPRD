            - "Company E (GOLD firm, discount 0.35 at ceiling): price_e == 6500 (10000 * (1 - 0.35))"
            - "Company F (PLATINUM firm, discount 0.10 below ceiling): price_f == 9000 (10000 * (1 - 0.10))"
            - "Silver firm's raw 0.50 was REJECTED by ceiling — proves tier_ceiling branch fires"

      - name: invoice_total_mode_c_evaluation_order_pinned
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned — subtotal depends on
          wholesale_discount, but tax_cents depends on subtotal, and total_cents
          depends on tax_cents. Scaffold pins: subtotal -> tax -> total. A
          different order (tax on list price, then add discount) yields a
          different cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan PLUS (list 8000)."
            - "Firm GOLD with discount 0.30."
            - "Company G in UK (tax rate 0.20) on PLUS, transferred to firm."
            - "Payroll SELF_SERVICE with 1 employee hired 2026-09-01."
            - "Clock at 2026-10-01; invoice issued."
