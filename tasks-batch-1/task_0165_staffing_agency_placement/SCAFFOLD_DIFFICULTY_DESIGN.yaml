            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${candA_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { subA_id: $.data.id }
            - call: "POST /staffing/submissions"
              payload: { job_order_id: "${jo_id}", candidate_id: "${candB_id}", submitted_pay_rate_cents: 8000 }
              as: Recruiter
              captures: { subB_id: $.data.id }
            - call: "PATCH /staffing/submissions/${subB_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "PATCH /staffing/submissions/${subA_id}"
              payload: { target_status: "CLIENT_REVIEW" }
              as: Recruiter
            - call: "POST /staffing/submissions/${subA_id}/interviews"
              payload: { scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
