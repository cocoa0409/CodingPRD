            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses"
              payload: { full_name: "Vera Verifier", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n2_id: "$.data.id" }
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "ROOT_CAUSE_ANALYSIS" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/certify"
              payload: { cert_expires_at: "2027-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_3", clinical_note: "Full-thickness sacral wound with slough at the margin." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_3", measured_area_cm2: 12.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: false }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "GET /pressure-injury-cases?skin_assessment_id=${a1_id}"
              payload: {}
              as: WocProgramDirector
              captures: { k1_id: "$.data[0].id" }
          trigger:
            - call: "POST /skin-assessments/${a1_id}/dispute"
              payload: { dispute_reason: "Photograph does not support a full-thickness call; re-measure and re-stage." }
              as: WocProgramDirector
            - call: "POST /skin-assessments/${a1_id}/restage"
              payload: { observed_stage: "STAGE_3", measured_area_cm2: 14.0 }
              as: WocNurse
              as_user_id: "${n2_id}"
              captures: { err_wrong_stager: "$.data.error_id" }
            - call: "POST /skin-assessments/${a1_id}/restage"
              payload: { observed_stage: "STAGE_3", measured_area_cm2: 14.0 }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_3", present_on_admission_confirmed: false }
              as: WocProgramDirector
            - call: "POST /pressure-injury-cases/${k1_id}/rca-start"
              payload: { rca_lead_nurse_id: "${n1_id}" }
              as: WocNurse
              as_user_id: "${n2_id}"
              captures: { err_lead_is_stager: "$.data.error_id" }
            - call: "POST /pressure-injury-cases/${k1_id}/rca-start"
              payload: { rca_lead_nurse_id: "${n2_id}" }
              as: WocNurse
              as_user_id: "${n2_id}"
          assert:
            - "Call 1 returns HTTP 200: SkinAssessment.${a1_id}.validation_status == DISPUTED, ConsultRequest.${c1_id}.protocol_hold == true, Unit.${u1_id}.disputed_staging_count == 1, and PressureInjuryCase.${k1_id} is untouched at classification == UNDETERMINED / status == OPEN"
            - "Call 2 returns HTTP 422 with data.error_id == ERR_SEGREGATION_OF_DUTIES — N2 did not stage A1, so it may not re-stage it"
            - "Call 2 changed nothing: SkinAssessment.${a1_id}.measured_area_cm2 == 12.0, restage_count == 0, validation_status still DISPUTED, and ConsultRequest.${c1_id}.protocol_hold still true"
            - "Call 3 returns HTTP 200 from the original stager: validation_status == PENDING_VALIDATION, measured_area_cm2 == 14.0, restage_count == 1, dispute_reason == null and ConsultRequest.${c1_id}.protocol_hold == false"
            - "Call 4 returns HTTP 200 with poa_determination == HAPI (earliest observed_at 2026-08-01T00:00:00Z is after the POA window end 2026-07-31T00:00:00Z), and the assessed_final recompute gives ConsultRequest.${c1_id}.acuity_score == 75.0 with priority_band == P1 (60 stage + 10 comorbidity + 0 device + 5 area, TYPE_MULTIPLIER 1.0)"
            - "Call 4's cascade leaves PressureInjuryCase.${k1_id}.status == RCA_REQUIRED with rca_due_at == 2026-08-04T00:00:00Z, Unit.${u1_id}.open_hapi_rca_count == 1 and survey_posture == OPEN (one open RCA is below the RESTRICTED floor of 2)"
            - "Call 5 returns HTTP 422 with data.error_id == ERR_SEGREGATION_OF_DUTIES, NOT ERR_NURSE_NOT_CERTIFIED — N1 is both the stager (priority 30) and merely CANDIDATE (priority 32), and the lower priority number wins"
            - "Call 5 changed nothing: PressureInjuryCase.${k1_id}.status is still RCA_REQUIRED with rca_lead_nurse_id == null"
            - "Call 6 returns HTTP 200: PressureInjuryCase.${k1_id}.status == RCA_IN_PROGRESS with rca_lead_nurse_id == ${n2_id}"
            - "Unit.${u1_id}.version == 3 — 1 at creation, +1 from the dispute counter, +1 from the HAPI posture hop; the two refused calls never bumped it"

  # ==========================================================================
  # SECTION: cross_cutting_complexity_layers  (claim-extraction-guide section 8).
  # complexity_profile.complexity_layers declares exactly four layers:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # rate_threshold_triggers. The two OCC entries in §1.2.1 each get their own
  # stale-version instance here (this is also where the two 412 codes in the
  # error catalog are triggered); the cascade and dual-variant layers are
  # already the subject matter of §1.8 and are stubbed; the threshold layer is
  # authored here at both of its cumulative boundaries.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_patient_version_rejected_then_accepted_after_reread
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-patient]
          - validations[priority=20]
          - errors[ERR_STALE_PATIENT_VERSION]
          - endpoints[POST /skin-assessments]
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_SUPERSEDED
        distinguishing_aspect: "The token that was correct for the first assessment is stale for the second because filing the first bumped Patient.version itself; the 412 must leave version at 2 (no bump on rejection) and the retry with the re-read token must then supersede the first row rather than being blocked by any state precondition."
        test_recipe:
          setup:
            - "Unit U1 exists; Patient P1 is ADMITTED on U1 with comorbidity_count 0 and device_related_risk false, so Patient.version == 1 and ${p1_v} == 1."
            - "WocNurse N1 is CANDIDATE; ConsultRequest C1 (WOUND, reported_stage STAGE_2) was triaged and assigned to N1, so C1.version == 3 and its status is ASSIGNED."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "OCC-U1", name: "OCC Probe Med-Surg", bed_count: 20, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "OCCMRN0001", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Omar Concurrent", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Non-blanchable sacral erythema found on the 06:00 turn." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
          trigger:
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 6.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: false }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_3", measured_area_cm2: 8.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: false }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_stale: "$.data.error_id" }
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v2: "$.data.version" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_3", measured_area_cm2: 8.0, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v2}", present_on_admission_claimed: false }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a2_id: "$.data.id" }
          assert:
            - "Call 1 returns HTTP 201 with validation_status == PENDING_VALIDATION and staged_by_nurse_id == ${n1_id}; Patient.${p1_id}.version == 2 and ConsultRequest.${c1_id}.status == ASSESSED with acuity_score == 35.0 and priority_band == P3 (STAGE_2 weight 35, no comorbidity, no device, area 6.0 below the 10 cm2 step)"
            - "Call 2 returns HTTP 412 with data.error_id == ERR_STALE_PATIENT_VERSION — the token ${p1_v} that call 1 legitimately used is stale precisely because call 1 bumped Patient.version"
            - "Call 2 is a total no-op: Patient.${p1_id}.version is still 2, GET /skin-assessments?patient_id=${p1_id} returns total_count == 1, SkinAssessment.${a1_id}.validation_status is still PENDING_VALIDATION, and ConsultRequest.${c1_id}.acuity_score is still 35.0"
            - "Call 3 returns HTTP 200 with data.version == 2, so ${p1_v2} == 2"
            - "Call 4 returns HTTP 201 with the re-read token: SkinAssessment.${a2_id}.validation_status == PENDING_VALIDATION and SkinAssessment.${a1_id}.validation_status == SUPERSEDED — the state machine allows the supersession, only the stale token blocked it"
            - "Patient.${p1_id}.version == 3 after call 4 (1 at creation, +1 per ACCEPTED assessment, nothing for the rejected one)"
            - "ConsultRequest.${c1_id}.version == 5 (1 create, +1 triage, +1 assign, +1 each for the two accepted assessments) and acuity_score == 60.0 with priority_band == P2, recomputed from the NEW row only (STAGE_3 weight 60, area 8.0 still below the step)"
            - "GET /pressure-injury-cases?patient_id=${p1_id} returns total_count == 2 — the superseding row created its own case, and the first case is untouched at classification == UNDETERMINED / status == OPEN because A1 was never VALIDATED"

      - name: stale_expected_unit_version_on_approve_rejected_then_accepted_after_reread
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-approve-stale-unit]
          - validations[priority=20]
          - errors[ERR_STALE_UNIT_VERSION]
          - endpoints[POST /support-surface-orders/{order_id}/approve]
          - entities.Unit.fields.rental_encumbered_cents
          - entities.Unit.fields.rental_available_cents
        distinguishing_aspect: "Two REQUESTED orders on the same unit each pass every state and budget precondition on their own, so only the OCC token separates them: approving the second with the version read BEFORE the first approval returns 412 and leaves the ledger at 32400 encumbered, and the same call succeeds unchanged once the caller re-reads version 2."
        test_recipe:
          setup:
            - "Unit U1 has rental_budget_cap_cents 200000, rental_encumbered_cents 0 and rental_available_cents 200000, so both orders below would fit the budget even taken together."
            - "Patient P1 is ADMITTED on U1; SupportSurfaces S1 and S2 are AVAILABLE at 10000 cents/day each."
            - "SupportSurfaceOrders O1 (on S1) and O2 (on S2) are both REQUESTED / UNBILLED for 2026-08-02T00:00:00Z .. 2026-08-05T00:00:00Z, i.e. 3 billable days, projected 30000, fee 2400, authorized 32400 each."
            - "The MaterialsCoordinator read Unit.version once, before either approval: ${uv1} == 1."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "OCC-U2", name: "OCC Probe Surgical", bed_count: 24, rental_budget_cap_cents: 200000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "OCCMRN0002", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z", comorbidity_count: 1, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "OCC-S1", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 10000, vendor_name: "Probe Rentals" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "OCC-S2", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 10000, vendor_name: "Probe Rentals" }
              as: MaterialsCoordinator
              captures: { s2_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-02T00:00:00Z", rental_end: "2026-08-05T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s2_id}", rental_start: "2026-08-02T00:00:00Z", rental_end: "2026-08-05T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o2_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { uv1: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${uv1}" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${uv1}" }
              as: MaterialsCoordinator
              captures: { err_stale_unit: "$.data.error_id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { uv2: "$.data.version" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${uv2}" }
              as: MaterialsCoordinator
          assert:
            - "Call 1 returns HTTP 200: SupportSurfaceOrder.${o1_id}.fulfillment_status == APPROVED, billing_status == ENCUMBERED, SupportSurface.${s1_id}.status == IN_USE"
            - "After call 1: Unit.${u1_id}.rental_encumbered_cents == 32400, rental_committed_cents == 0, rental_released_cents == 0, rental_available_cents == 167600 and version == 2"
            - "Call 2 returns HTTP 412 with data.error_id == ERR_STALE_UNIT_VERSION — the budget had ample headroom (167600 available against 32400 authorized), so nothing but the stale token could have rejected it"
            - "Call 2 is a total no-op: SupportSurfaceOrder.${o2_id}.fulfillment_status == REQUESTED, billing_status == UNBILLED, SupportSurface.${s2_id}.status == AVAILABLE, Unit.${u1_id}.rental_encumbered_cents == 32400 and version == 2"
            - "Call 3 returns HTTP 200 with data.version == 2, so ${uv2} == 2"
            - "Call 4 returns HTTP 200 with the identical payload except the token: SupportSurfaceOrder.${o2_id}.fulfillment_status == APPROVED, billing_status == ENCUMBERED, SupportSurface.${s2_id}.status == IN_USE"
            - "After call 4: Unit.${u1_id}.rental_encumbered_cents == 64800, rental_available_cents == 135200 and version == 3 — one bump per accepted approve, none for the refused one"

      - name: posture_ladder_flips_at_the_second_and_fourth_cumulative_open_rca
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
          - entities.Unit.fields.open_hapi_rca_count
          - entities.Unit.fields.survey_posture
          - entities.SupportSurfaceOrder.fields.requires_director_override
          - entities.SupportSurfaceOrder.fields.posture_hold_applied_at
          - validations[priority=58]
          - errors[ERR_UNIT_POSTURE_RESTRICTED]
        distinguishing_aspect: "The cumulative counter is tested at every boundary of the FROZEN >= 4 / RESTRICTED >= 2 / OPEN ladder: the 1st HAPI leaves posture OPEN and stamps no hold, the 2nd flips to RESTRICTED and stamps the hold, the 3rd changes nothing at all (posture did not CHANGE, so hop 5 must not re-stamp), and the 4th flips to FROZEN, re-stamps and turns order creation itself into a 409."
        test_recipe:
          setup:
            - "Unit U1 has rental_budget_cap_cents 500000, open_hapi_rca_count 0 and survey_posture OPEN."
            - "WocNurse N1 is CERTIFIED (30 CE credits, two sign-offs, advance, certify) so max_consult_load == 8 and it can hold all four consults."
            - "Patients P1..P4 were all admitted 2026-07-30T00:00:00Z on U1 with comorbidity_count 0 and device_related_risk false; each has its own triaged-and-assigned ConsultRequest C1..C4 (WOUND, STAGE_2) and its own PENDING_VALIDATION SkinAssessment A1..A4 on the SACRUM (STAGE_2, 6.0 cm2, observed_at 2026-08-01T00:00:00Z), each with an auto-created PressureInjuryCase K1..K4."
            - "Because every observed_at (2026-08-01T00:00:00Z) is after every POA window end (2026-07-31T00:00:00Z), declining the present-on-admission claim yields HAPI on all four."
            - "SupportSurfaces S1, S2, S3 are AVAILABLE at 10000 cents/day; SupportSurfaceOrder O1 (on S1, 2026-08-02 .. 2026-08-05, authorized 32400) is REQUESTED and was created while posture was OPEN, so requires_director_override == false and posture_hold_applied_at == null."
            - "Every validate below is issued by WocProgramDirector, which keeps the priority-30 segregation check out of the way."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "THR-U1", name: "Threshold Probe Med-Surg", bed_count: 30, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Tess Threshold", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2027-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "THRMRN0001", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /patients"
              payload: { mrn: "THRMRN0002", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /patients"
              payload: { mrn: "THRMRN0003", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 0, device_related_risk: false, ostomy_present: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p3_id: "$.data.id", p3_v: "$.data.version" }
