              as_user_id: "${officer_id}"
              captures: { manual_entry_id: $.data.id }
            - call: "POST /deals"
              payload: { codename: "PROJECTORCA", deal_type: "ACQUISITION", security_ticker: "ACME" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "GET /restricted-list-entries"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /deals/${deal_id}/close"
              payload: { outcome: "COMPLETED" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          assert:
            - "before activate: ACTIVE entries for ACME == 1 (the MANUAL entry ${manual_entry_id})"
            - "after activate: ACTIVE entries for ACME == 2 (MANUAL + DEAL_INTAKE)"
            - "after close COMPLETED: ACTIVE entries for ACME == 1 — the deal-sourced entry is REMOVED with removed_reason == DEAL_CLOSED"
            - "RestrictedListEntry.${manual_entry_id}.status remains ACTIVE (compensation removes only deal-sourced rows)"
