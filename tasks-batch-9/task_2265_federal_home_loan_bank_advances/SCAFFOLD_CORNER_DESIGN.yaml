      - name: approve_against_a_fully_committed_allocation_rejected
        claim_type: violation_to_error
        grounds: ["validations.allocation-open", "entities.CommunityProgramAllocation.status (CLOSED when remaining_cents == 0)", "errors[ERR_ALLOCATION_CLOSED]"]
        distinguishing_aspect: "The allocation closes itself the instant its last cent is committed, so the third advance is refused with ERR_ALLOCATION_CLOSED at priority 8 rather than the priority-13 pool-exhausted error that a partially funded pool would produce."
        test_recipe:
          setup:
            - "Harbor Savings tier 1, ACTIVE, BLANKET_LIEN, one ELIGIBLE SF_MORTGAGE (lendable 15,600,000); community product CIP-C and a CIP allocation for fiscal 2026 with a 400,000 pool."
            - "Advance I (gross 2,000,000, bucket FIRST_TIME_HOMEBUYER, subsidy 300,000) is approved, filling the 140,000 first-time bucket and spilling 160,000 into general."
            - "Advance J (gross 2,000,000, bucket REHABILITATION, subsidy 100,000) is then approved, filling the last 100,000, so remaining_cents hits 0 and the allocation status becomes CLOSED."
            - "Advance K (gross 1,000,000, bucket GENERAL, subsidy 10,000) is created against the same allocation and is still REQUESTED."
