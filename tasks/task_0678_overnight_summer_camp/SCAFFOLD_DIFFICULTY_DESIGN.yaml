  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: activity_buffer_window_collision_on_offering_slot
        grounds:
          - calculations.activity_overlap_block
          - entities.ActivityOffering.fields.setup_buffer_minutes
          - errors[ERR_ACTIVITY_TIME_CONFLICT]
        distinguishing_aspect: |
          Interval semantics #1 (asymmetric INCLUSIVE buffer on ActivityOffering):
          two raw-disjoint adjacent offerings on the same slot_day still conflict
          because the existing offering [540,600) carries a 15-minute setup buffer, so
          the new offering starting at 600 violates new.start >= 600+15 -> rejected
          ERR_ACTIVITY_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Application SUBMITTED for a camper. Two offerings on slot_day 1: Archery [540,600) with setup_buffer_minutes=15, Swim [600,660) with buffer 0. Camper is BOOKED into Archery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Trailhead", deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/activities"
              payload: { name: "Archery", slot_day: 1, starts_minute: 540, ends_minute: 600, seat_capacity: 10, setup_buffer_minutes: 15 }
              as: CampDirector
              captures: { off_archery: $.data.id }
            - call: "POST /sessions/${sess_id}/activities"
              payload: { name: "Swim", slot_day: 1, starts_minute: 600, ends_minute: 660, seat_capacity: 10, setup_buffer_minutes: 0 }
              as: CampDirector
              captures: { off_swim: $.data.id }
            - call: "POST /guardians/register"
              payload: { email: "g14@x.com", full_name: "Guardian Fourteen", phone: "555-1414" }
              as: Anonymous
              captures: { g14_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Fourteen", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g14_id}"
              captures: { c14_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c14_id}" }
              as: Guardian
              as_user_id: "${g14_id}"
              captures: { hf14_id: $.data.id }
            - call: "POST /health-forms/${hf14_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g14_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c14_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g14_id}"
              captures: { app14_id: $.data.id }
            - call: "POST /applications/${app14_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g14_id}"
            - call: "POST /activity-enrollments"
              payload: { offering_id: "${off_archery}", application_id: "${app14_id}" }
              as: Guardian
              as_user_id: "${g14_id}"
          trigger:
            - call: "POST /activity-enrollments"
              payload: { offering_id: "${off_swim}", application_id: "${app14_id}" }
              as: Guardian
              as_user_id: "${g14_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ACTIVITY_TIME_CONFLICT"

      - name: visiting_day_outside_session_window_closed_interval
        grounds:
          - validations[priority=9]
          - entities.Session.fields.visiting_day_on
          - errors[ERR_VISITING_DAY_OUT_OF_RANGE]
        distinguishing_aspect: |
          Interval semantics #2 (point-in-CLOSED-interval containment on the Session
          resource, distinct from the half-open+buffer collision geometry on
          ActivityOffering): a Session whose visiting_day_on (2026-07-20) falls AFTER
          ends_on (2026-07-14) is rejected ERR_VISITING_DAY_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "A Camp exists; the director attempts to create a Session whose visiting_day_on is outside [starts_on, ends_on]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Summit" }
              as: CampDirector
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Bad Session", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-20T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VISITING_DAY_OUT_OF_RANGE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: activity_book_then_drop_conserves_seats_taken
        grounds:
          - state_machines.ActivityEnrollment.BOOKED_to_DROPPED
          - entities.ActivityOffering.fields.seats_taken
        distinguishing_aspect: |
          Conserved quantity #1 = ActivityOffering.seats_taken. Invariant: after a
          BOOK (forward: seats_taken += 1) followed by its compensating DROP
          (seats_taken -= 1), seats_taken returns to its pre-book value (0).
          Pinned formula: seats_taken == count(BOOKED ActivityEnrollments on offering).
        test_recipe:
          setup:
            - "Offering Crafts [60,120) slot_day 1 seat_capacity 5 (seats_taken=0). A submitted application's camper is BOOKED into it (seats_taken=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Meadow", deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "GIRLS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/activities"
              payload: { name: "Crafts", slot_day: 1, starts_minute: 60, ends_minute: 120, seat_capacity: 5 }
              as: CampDirector
              captures: { off_crafts: $.data.id }
            - call: "POST /guardians/register"
              payload: { email: "g15@x.com", full_name: "Guardian Fifteen", phone: "555-1515" }
              as: Anonymous
              captures: { g15_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Fifteen", age: 10, gender: "GIRL" }
              as: Guardian
              as_user_id: "${g15_id}"
              captures: { c15_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c15_id}" }
              as: Guardian
              as_user_id: "${g15_id}"
              captures: { hf15_id: $.data.id }
            - call: "POST /health-forms/${hf15_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g15_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c15_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g15_id}"
              captures: { app15_id: $.data.id }
            - call: "POST /applications/${app15_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g15_id}"
            - call: "POST /activity-enrollments"
              payload: { offering_id: "${off_crafts}", application_id: "${app15_id}" }
              as: Guardian
              as_user_id: "${g15_id}"
              captures: { ae15_id: $.data.id }
          trigger:
            - call: "POST /activity-enrollments/${ae15_id}/drop"
              payload: {}
              as: Guardian
              as_user_id: "${g15_id}"
          assert:
            - "ActivityEnrollment.${ae15_id}.status == DROPPED"
            - "ActivityOffering.${off_crafts}.seats_taken == 0   # conserved: returned to pre-book value"

      - name: canteen_deposit_then_equal_purchase_conserves_balance
        grounds:
          - calculations.canteen_balance
          - entities.CanteenAccount.fields.balance_cents
          - entities.CanteenTransaction.fields.kind
        distinguishing_aspect: |
          Conserved quantity #2 = CanteenAccount.balance_cents (a DIFFERENT conserved
          quantity than seats_taken). Invariant: a DEPOSIT of 3000 (forward) followed
          by a PURCHASE of 3000 (compensating) leaves balance_cents at its pre-deposit
          value (0). Pinned: balance == sum(DEPOSIT) - sum(PURCHASE) over APPLIED txns.
        test_recipe:
          setup:
            - "CanteenAccount opened for a submitted application, balance 0. A DEPOSIT of 3000 is applied (balance 3000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "Harbor", deposit_cents: 25000, canteen_low_balance_cents: 1000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "Session A", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
