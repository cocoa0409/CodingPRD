  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_parallel_lifecycle_and_revocation_dimensions
        grounds:
          - state_machines.Certificate.lifecycle_status
          - state_machines.Certificate.revocation_status
          - state_machines.Certificate.PREISSUANCE_to_EXPIRED
          - state_machines.Certificate.NONE_to_REVOCATION_PENDING
          - state_machines.Certificate.REVOCATION_PENDING_to_REVOKED
          - calculations.revocation_deadline
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on one entity: Certificate carries two
          independent state machines (lifecycle_status and revocation_status) that advance
          on unrelated triggers. A certificate can be REVOKED while still PREISSUANCE, and
          the clock sweep then moves the lifecycle dimension PREISSUANCE -> EXPIRED without
          disturbing the terminal REVOKED value in the other dimension, so the pair
          (EXPIRED, REVOKED) is reachable and neither dimension is derivable from the other.
