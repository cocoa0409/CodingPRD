scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: report_credit_provisional_vs_final_variant
        grounds:
          - calculations.report_rvu_credit
          - calculations.study_rvu
          - state_machines.Study.IN_PROGRESS_to_PRELIMINARY_SIGNED
          - state_machines.Study.IN_PROGRESS_to_FINAL_SIGNED
        distinguishing_aspect: |
          Radiologist-productivity domain: for the SAME study_rvu (CT = 1.5), the provisional variant
          credits 0.8x (1.2) at PRELIMINARY sign while the final variant credits (1 - penalty)x (1.5 at
          grade 0) at FINAL sign — identical input RVU, different credit, and the provisional credit is
          not clawed back on supersede.
        test_recipe:
          setup:
            - "ACTIVE CA hospital with routing policy CT/NEURO/STAT prelim_required=true"
            - "radiologist rad_pre and rad_fin: NEURORAD, licensed CA, ACTIVE shift covering CT, GRANTED BY_PROXY credential"
            - "logical clock at 2026-05-10T10:00:00Z"
            - "one STAT CT study driven to FINAL_SIGNED via prelim by rad_pre then final (grade 0) by rad_fin"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Mercy General", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Prelim Reader", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_pre: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Final Reader", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_fin: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_pre}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g1: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g1}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_fin}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g2: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g2}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_pre}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_fin}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-1", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "MRN-1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_pre}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg1: $.data.id } }
            - { call: "POST /telerad/assignments/${asg1}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_pre}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg1}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad_pre}", captures: { rep_pre: $.data.id } }
            - { call: "POST /telerad/reports/${rep_pre}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_pre}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv2: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_fin}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { asg2: $.data.id } }
            - { call: "POST /telerad/assignments/${asg2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_fin}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg2}", report_type: "FINAL", findings_text: "f", impression_text: "i", discrepancy_grade: 0 }, as: Radiologist, as_user_id: "${rad_fin}", captures: { rep_fin: $.data.id } }
            - { call: "POST /telerad/reports/${rep_fin}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_fin}" }
          trigger:
            - { call: "GET /telerad/reports/${rep_pre}", payload: {}, as: QaReviewer, captures: { pre_credit: $.data.credited_rvu, pre_status: $.data.status } }
            - { call: "GET /telerad/reports/${rep_fin}", payload: {}, as: QaReviewer, captures: { fin_credit: $.data.credited_rvu } }
            - { call: "GET /telerad/radiologists/${rad_pre}", payload: {}, as: PlatformAdmin, captures: { pre_24h: $.data.completed_rvu_24h } }
            - { call: "GET /telerad/radiologists/${rad_fin}", payload: {}, as: PlatformAdmin, captures: { fin_24h: $.data.completed_rvu_24h } }
          assert:
            - "Report.${rep_pre}.credited_rvu == 1.2 (0.8 * 1.5, provisional variant)"
            - "Report.${rep_fin}.credited_rvu == 1.5 (1.5 * (1 - 0), final variant)"
            - "Report.${rep_pre}.status == SUPERSEDED yet credited_rvu remains 1.2 (no clawback)"
            - "Radiologist.${rad_pre}.completed_rvu_24h == 1.2"
            - "Radiologist.${rad_fin}.completed_rvu_24h == 1.5"
            - "credited_rvu differs (1.2 != 1.5) for identical study_rvu 1.5 across the two variants"

      - name: invoice_pricing_marginal_vs_flat_tier
        grounds:
          - calculations.invoice_volume_pricing
          - calculations.invoice_total_composition
        distinguishing_aspect: |
          Billing domain (distinct from radiologist productivity): for the SAME 1200 billable regular-hour
          studies, a MARGINAL hospital pays per-tier (1000*901 + 200*801 = 1061200c) while a FLAT_TIER
          hospital pays all units at the highest reached tier rate (1200*801 = 961200c) — identical volume,
          different totals.
        test_recipe:
          setup:
            - "hospital A pricing_mode=MARGINAL (default), hospital B pricing_mode=FLAT_TIER"
            - "each hospital has 1200 ROUTINE CT studies finalized on time at 2026-05-04T12:00:00Z, received 2026-05-04T10:00:00Z (regular hours, no critical)"
            - "each hospital has a CLOSED billing period 2026-05-01..2026-05-31 and a generated invoice"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Marginal", state_code: "CA" }, as: PlatformAdmin, captures: { ha: $.data.id } }
            - { call: "POST /telerad/hospitals/${ha}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Flat", state_code: "TX", pricing_mode: "FLAT_TIER" }, as: PlatformAdmin, captures: { hb: $.data.id } }
            - { call: "POST /telerad/hospitals/${hb}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${ha}", count: 1200, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hb}", count: 1200, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${ha}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /telerad/billing-periods/${pa}/close", payload: {}, as: PlatformAdmin, captures: { pa_v: $.data.version } }
            - { call: "POST /telerad/billing-periods/${pa}/generate-invoice", payload: { expected_billing_period_version: "${pa_v}" }, as: PlatformAdmin, captures: { inv_a: $.data.id } }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hb}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /telerad/billing-periods/${pb}/close", payload: {}, as: PlatformAdmin, captures: { pb_v: $.data.version } }
            - { call: "POST /telerad/billing-periods/${pb}/generate-invoice", payload: { expected_billing_period_version: "${pb_v}" }, as: PlatformAdmin, captures: { inv_b: $.data.id } }
          trigger:
            - { call: "GET /telerad/invoices/${inv_a}", payload: {}, as: PlatformAdmin, captures: { a_total: $.data.total_cents, a_gross: $.data.gross_cents, a_count: $.data.billable_study_count, a_mode: $.data.pricing_mode_snapshot } }
            - { call: "GET /telerad/invoices/${inv_b}", payload: {}, as: PlatformAdmin, captures: { b_total: $.data.total_cents, b_gross: $.data.gross_cents, b_count: $.data.billable_study_count, b_mode: $.data.pricing_mode_snapshot } }
          assert:
            - "Invoice.${inv_a}.pricing_mode_snapshot == MARGINAL and gross_cents == 1061200 (1000*901 + 200*801)"
            - "Invoice.${inv_b}.pricing_mode_snapshot == FLAT_TIER and gross_cents == 961200 (1200*801)"
            - "Invoice.${inv_a}.total_cents == 1061200 (no penalties, no add-ons)"
            - "Invoice.${inv_b}.total_cents == 961200"
            - "both billable_study_count == 1200 — identical volume, totals differ by variant (1061200 != 961200)"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes (a) and (b))
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_pricing_tier_straddle_multi_input
        grounds:
          - calculations.invoice_volume_pricing
          - calculations.invoice_total_composition
          - entities.ClientHospital.fields.pricing_mode
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — 1200 units straddle tier1/tier2 (marginal
          selection), 300 after-hours units draw the x1.5 multiplier branch, 1 critical study adds a flat
          250c add-on; the pinned combination yields gross 1196750c, which no subset of the inputs reproduces.
        test_recipe:
          setup:
            - "MARGINAL hospital with billing period 2026-05-01..2026-05-31"
            - "seed batch 1: 300 after-hours studies (received 2026-05-03T23:00:00Z), created FIRST so unit indices 1-300 (tier1) are the after-hours units"
            - "seed batch 2: 899 regular studies (received 2026-05-04T10:00:00Z) -> units 301-1199"
            - "seed batch 3: 1 critical regular study (received 2026-05-04T10:30:00Z) -> unit 1200"
            - "all finalized on time at 2026-05-04T12:00:00Z (tie on first_final_signed_at broken by created_at ASC = seed order)"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Combo", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 300, received_at: "2026-05-03T23:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 899, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1, received_at: "2026-05-04T10:30:00Z", final_signed_at: "2026-05-04T12:00:00Z", critical_finding: true }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin, captures: { per_v: $.data.version } }
          trigger:
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${per_v}" }, as: PlatformAdmin, captures: { inv: $.data.id } }
            - { call: "GET /telerad/invoices/${inv}", payload: {}, as: PlatformAdmin, captures: { gross: $.data.gross_cents, total: $.data.total_cents, addon: $.data.critical_addon_cents, cnt: $.data.billable_study_count, penalty: $.data.penalty_credits_cents } }
          assert:
            - "Invoice.${inv}.billable_study_count == 1200"
            - "tier1 AFTER_HOURS line: 300 * round_half_up(901*1.5) = 300*1352 = 405600"
            - "tier1 REGULAR line: 700 * 901 = 630700; tier2 REGULAR line: 200 * 801 = 160200"
            - "Invoice.${inv}.critical_addon_cents == 250"
            - "Invoice.${inv}.gross_cents == 1196750 (405600 + 630700 + 160200 + 250)"
            - "Invoice.${inv}.penalty_credits_cents == 0 and total_cents == 1196750"

      - name: invoice_after_hours_per_unit_rounding_order
        grounds:
          - calculations.invoice_total_composition
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — after-hours unit price is rounded half-up PER UNIT
          (round_half_up(901*1.5)=1352) BEFORE aggregation; the forbidden sum-then-round interpretation
          (round_half_up(3*1351.5)=4055) differs by exactly 1 cent, and the pinned result is 4056.
        test_recipe:
          setup:
            - "MARGINAL hospital, billing period 2026-05-01..2026-05-31"
            - "exactly 3 after-hours tier1 studies (received 2026-05-03T23:00:00Z), finalized on time at 2026-05-04T12:00:00Z, no critical"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Round", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 3, received_at: "2026-05-03T23:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin, captures: { per_v: $.data.version } }
          trigger:
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${per_v}" }, as: PlatformAdmin, captures: { inv: $.data.id } }
            - { call: "GET /telerad/invoices/${inv}", payload: {}, as: PlatformAdmin, captures: { gross: $.data.gross_cents, total: $.data.total_cents } }
          assert:
            - "Invoice.${inv}.gross_cents == 4056 (3 * round_half_up(901 * 1.5) = 3 * 1352)"
            - "gross_cents != 4055 (sum-then-round alternative is explicitly rejected)"
            - "Invoice.${inv}.total_cents == 4056"
  # ==========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: study_release_requeue_and_amendment_cycle
        grounds:
          - state_machines.Study.ASSIGNED_to_QUEUED
          - state_machines.Study.FINAL_SIGNED_to_AMENDMENT_PENDING
          - state_machines.Study.IN_PROGRESS_to_FINAL_SIGNED
          - state_machines.Study.AMENDMENT_PENDING_to_ASSIGNED
        distinguishing_aspect: |
          Study machine is non-linear: ASSIGNED -> QUEUED is a revert (release loop) and
          FINAL_SIGNED -> AMENDMENT_PENDING -> ... -> FINAL_SIGNED is a cycle; a linear pipeline could
          not express either. The second non-linear machine lives on CredentialGrant (different entity).
        test_recipe:
          setup:
            - "ACTIVE CA hospital; policy CT/NEURO/ROUTINE prelim_required=false; rad_a and rad_b credentialed + ACTIVE shifts covering CT"
            - "logical clock 2026-05-10T10:00:00Z; one ROUTINE CT study"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Loop", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Rad A", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_a: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Rad B", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_b: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_a}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { ga: $.data.id } }
            - { call: "POST /telerad/credential-grants/${ga}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_b}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { gb: $.data.id } }
            - { call: "POST /telerad/credential-grants/${gb}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_a}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_b}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-L", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "MRN-L" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_a}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg1: $.data.id } }
            - { call: "POST /telerad/assignments/${asg1}/release", payload: {}, as: Radiologist, as_user_id: "${rad_a}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { st_mid: $.data.status, excl: $.data.excluded_radiologist_ids, sv2: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_b}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { asg2: $.data.id } }
            - { call: "POST /telerad/assignments/${asg2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_b}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg2}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad_b}", captures: { rep_f: $.data.id } }
            - { call: "POST /telerad/reports/${rep_f}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_b}" }
            - { call: "POST /telerad/studies/${sid}/request-addendum", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { st_amend: $.data.status } }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv3: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_b}", expected_study_version: "${sv3}" }, as: DispatchOps, captures: { asg3: $.data.id, ph3: $.data.phase } }
            - { call: "POST /telerad/assignments/${asg3}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_b}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg3}", report_type: "ADDENDUM", findings_text: "af", impression_text: "ai" }, as: Radiologist, as_user_id: "${rad_b}", captures: { rep_a: $.data.id } }
            - { call: "POST /telerad/reports/${rep_a}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_b}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { st_end: $.data.status, acnt: $.data.addendum_count } }
          assert:
            - "after release: Study.${sid}.status == QUEUED (revert ASSIGNED -> QUEUED fired)"
            - "after release: Study.${sid}.excluded_radiologist_ids contains ${rad_a}"
            - "after final sign: Study.${sid}.status == FINAL_SIGNED"
            - "request-addendum: Study.${sid}.status == AMENDMENT_PENDING"
            - "addendum assignment phase == FINAL"
            - "after addendum sign: Study.${sid}.status == FINAL_SIGNED (cycle closed) and addendum_count == 1"

      - name: credential_grant_suspend_renewal_cycle
        grounds:
          - state_machines.CredentialGrant.GRANTED_to_SUSPENDED
          - state_machines.CredentialGrant.SUSPENDED_to_GRANTED
          - state_machines.CredentialGrant.GRANTED_to_EXPIRED
          - state_machines.CredentialGrant.EXPIRED_to_PENDING
        distinguishing_aspect: |
          CredentialGrant machine is cyclic on a DIFFERENT entity than Study: GRANTED -> SUSPENDED ->
          GRANTED is a revert loop, and GRANTED -> EXPIRED -> PENDING -> GRANTED is a full renewal cycle
          driven partly by the clock sweep (system actor).
        test_recipe:
          setup:
            - "hospital and radiologist exist; one grant PENDING valid 2026-01-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Cred", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Rad C", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { gid: $.data.id } }
          trigger:
            - { call: "POST /telerad/credential-grants/${gid}/grant", payload: {}, as: PlatformAdmin, captures: { s1: $.data.status } }
            - { call: "POST /telerad/credential-grants/${gid}/suspend", payload: {}, as: PlatformAdmin, captures: { s2: $.data.status } }
            - { call: "POST /telerad/credential-grants/${gid}/reinstate", payload: {}, as: PlatformAdmin, captures: { s3: $.data.status } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /telerad/credential-grants/${gid}", payload: {}, as: PlatformAdmin, captures: { s4: $.data.status } }
            - { call: "POST /telerad/credential-grants/${gid}/renew", payload: { valid_from: "2027-01-01", valid_until: "2027-12-31" }, as: PlatformAdmin, captures: { s5: $.data.status, vf: $.data.valid_from } }
            - { call: "POST /telerad/credential-grants/${gid}/grant", payload: {}, as: PlatformAdmin, captures: { s6: $.data.status, v_end: $.data.version } }
          assert:
            - "after grant: status == GRANTED"
            - "after suspend: status == SUSPENDED (loop step 1)"
            - "after reinstate: status == GRANTED (loop step 2, cycle GRANTED->SUSPENDED->GRANTED)"
            - "after clock sweep past valid_until: status == EXPIRED (system transition)"
            - "after renew: status == PENDING and valid_from == 2027-01-01 (cycle EXPIRED->PENDING)"
            - "after second grant: status == GRANTED and version == 7 (create v1 + 6 mutations)"

  # ==========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >=3 / >=2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: final_sign_critical_cascade
        grounds:
          - state_machines.Study.IN_PROGRESS_to_FINAL_SIGNED
          - state_machines.Report.SIGNED_to_SUPERSEDED
          - entities.Radiologist.fields.pending_critical_count
          - state_machines.DiscrepancyCase
        distinguishing_aspect: |
          Trigger = POST /reports/{id}/sign (FINAL, critical, grade 2). Chain: Report DRAFT->SIGNED (hop 1)
          causes Study -> FINAL_SIGNED (hop 2) which causes prelim Report SIGNED->SUPERSEDED, DiscrepancyCase
          AUTO OPEN creation, and CriticalResultNotice PENDING creation (hop 3); the notice creation raises
          Radiologist.pending_critical_count (hop 4). Depth 4, each hop caused by the previous hop.
        test_recipe:
          setup:
            - "CA hospital ACTIVE; policy CT/NEURO/STAT prelim_required=true; rad_pre + rad_fin credentialed with ACTIVE CT shifts"
            - "STAT CT study read to PRELIMINARY_SIGNED by rad_pre; FINAL assignment accepted by rad_fin"
            - "logical clock 2026-05-10T10:00:00Z"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Casc", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: true, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Prelim R", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_pre: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Final R", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad_fin: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_pre}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g1: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g1}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad_fin}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g2: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g2}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_pre}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad_fin}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-C", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "MRN-C" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_pre}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg1: $.data.id } }
            - { call: "POST /telerad/assignments/${asg1}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_pre}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg1}", report_type: "PRELIMINARY", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad_pre}", captures: { rep_pre: $.data.id } }
            - { call: "POST /telerad/reports/${rep_pre}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_pre}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv2: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad_fin}", expected_study_version: "${sv2}" }, as: DispatchOps, captures: { asg2: $.data.id } }
            - { call: "POST /telerad/assignments/${asg2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad_fin}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg2}", report_type: "FINAL", findings_text: "f2", impression_text: "i2", critical_finding: true, discrepancy_grade: 2 }, as: Radiologist, as_user_id: "${rad_fin}", captures: { rep_fin: $.data.id } }
          trigger:
            - { call: "POST /telerad/reports/${rep_fin}/sign", payload: {}, as: Radiologist, as_user_id: "${rad_fin}", captures: { fin_status: $.data.status, fin_credit: $.data.credited_rvu } }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { st: $.data.status } }
            - { call: "GET /telerad/reports/${rep_pre}", payload: {}, as: QaReviewer, captures: { pre_status: $.data.status } }
            - { call: "GET /telerad/discrepancy-cases", payload: { study_id: "${sid}" }, as: QaReviewer, captures: { case0_status: "$.data[0].status", case0_origin: "$.data[0].origin", case0_grade: "$.data[0].grade" } }
            - { call: "GET /telerad/critical-notices", payload: { report_id: "${rep_fin}" }, as: DispatchOps, captures: { n0_status: "$.data[0].status" } }
            - { call: "GET /telerad/radiologists/${rad_fin}", payload: {}, as: PlatformAdmin, captures: { pcc: $.data.pending_critical_count } }
            - { call: "GET /telerad/assignments/${asg2}", payload: {}, as: DispatchOps, captures: { asg2_status: $.data.status } }
          assert:
            - "hop 1: Report.${rep_fin}.status == SIGNED, credited_rvu == 1.125 (1.5 * (1 - 0.25) for grade 2)"
            - "hop 2: Study.${sid}.status == FINAL_SIGNED"
            - "hop 3a: prelim Report.${rep_pre}.status == SUPERSEDED"
            - "hop 3b: exactly one DiscrepancyCase with status OPEN, origin AUTO, grade 2"
            - "hop 3c: exactly one CriticalResultNotice with status PENDING for the final report"
            - "hop 4: Radiologist.${rad_fin}.pending_critical_count == 1 (raised by notice creation)"
            - "Assignment.${asg2}.status == COMPLETED"

      - name: release_requeue_cascade
        grounds:
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - state_machines.Study.ASSIGNED_to_QUEUED
          - calculations.fatigue_utilization
        distinguishing_aspect: |
          Trigger = POST /assignments/{id}/release (different trigger than final_sign_critical_cascade).
          Chain: Assignment ACTIVE->RELEASED (hop 1) causes Study ASSIGNED->QUEUED plus exclusion-list
          append (hop 2) which causes Radiologist.reserved_rvu to be decremented (hop 3). Depth 3.
        test_recipe:
          setup:
            - "CA hospital ACTIVE; policy CT/NEURO/ROUTINE; rad credentialed + ACTIVE CT shift; clock 2026-05-10T10:00:00Z"
            - "one ROUTINE CT study assigned to rad (reserved_rvu 1.5)"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Rel", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Rad Rel", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-R", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "MRN-R" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /telerad/assignments/${asg}/release", payload: {}, as: Radiologist, as_user_id: "${rad}", captures: { asg_status: $.data.status } }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { st: $.data.status, assigned: $.data.assigned_radiologist_id, excl: $.data.excluded_radiologist_ids } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res: $.data.reserved_rvu } }
          assert:
            - "hop 1: Assignment.${asg}.status == RELEASED"
            - "hop 2: Study.${sid}.status == QUEUED and assigned_radiologist_id is null"
            - "hop 2: Study.${sid}.excluded_radiologist_ids contains ${rad}"
            - "hop 3: Radiologist.${rad}.reserved_rvu == 0.0 (decremented from 1.5)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_licensure_on_assign
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSURE_GAP]
        distinguishing_aspect: |
          Pair = state (priority 6) vs business_safety (priority 7): the study is CANCELLED AND the
          radiologist lacks CA licensure; the dual failure must surface ERR_INVALID_STATE because state
          preconditions outrank safety checks.
        test_recipe:
          setup:
            - "CA hospital ACTIVE; policy CT/NEURO/ROUTINE; radiologist licensed only in NY (would fail ERR_LICENSURE_GAP), credentialed + ACTIVE CT shift"
            - "one ROUTINE CT study routed then CANCELLED by the hospital"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp P5a", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "NY Rad", subspecialties: ["NEURORAD"], license_states: ["NY"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-P5A", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "MRN-P5A" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps }
            - { call: "POST /telerad/studies/${sid}/cancel", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (study CANCELLED; state priority 6 wins over licensure priority 7)"
            - "no Assignment is created; Study.${sid}.status remains CANCELLED"

      - name: licensure_beats_fatigue_on_assign
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_LICENSURE_GAP]
          - errors[ERR_FATIGUE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Pair = business_safety (priority 7) vs business_fiscal (priority 10) — a DIFFERENT category pair
          than state-vs-safety: the radiologist both lacks CA licensure AND would exceed the fatigue cap
          (cap 0.5 < CT 1.5); the dual failure must surface ERR_LICENSURE_GAP.
        test_recipe:
          setup:
            - "CA hospital ACTIVE; policy CT/NEURO/ROUTINE; radiologist licensed NY only, fatigue_cap_rvu 0.5, credentialed + ACTIVE CT shift"
            - "one ROUTINE CT study in QUEUED"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp P5b", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Busy NY Rad", subspecialties: ["NEURORAD"], license_states: ["NY"], fatigue_cap_rvu: 0.5 }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-P5B", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "MRN-P5B" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LICENSURE_GAP (safety priority 7 wins over fiscal priority 10)"
            - "Study.${sid}.status remains QUEUED; radiologist reserved_rvu remains 0.0"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fatigue_cap_equality_allowed_strict_greater_rejected
        grounds:
          - calculations.fatigue_utilization
          - calculations.study_rvu
          - validations[priority=10]
          - errors[ERR_FATIGUE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric = RVU (numeric threshold), endpoint = POST /telerad/assignments: projected utilization
          exactly EQUAL to fatigue_cap_rvu (4.0 == 4.0) is allowed; one more 0.5 RVU study (4.5 > 4.0) is
          rejected — the boundary is strict-greater rejection, not >=.
        test_recipe:
          setup:
            - "CA hospital ACTIVE; policies MR/NEURO/ROUTINE and XR/NEURO/ROUTINE; radiologist fatigue_cap_rvu=4.0, NEURORAD, CA, credentialed, ACTIVE shift covering MR+XR"
            - "two MR studies (2.0 RVU each) assigned -> reserved_rvu exactly 4.0; one XR study (0.5) QUEUED"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Fat", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "MR", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "GET /telerad/hospitals/${hosp}", payload: {}, as: PlatformAdmin, captures: { hosp_v2: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "XR", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v2}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Cap Rad", subspecialties: ["NEURORAD"], license_states: ["CA"], fatigue_cap_rvu: 4.0 }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["MR", "XR"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-M1", modality: "MR", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "M1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s1: $.data.id } }
            - { call: "POST /telerad/studies/${s1}/route", payload: {}, as: DispatchOps, captures: { s1v: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s1}", radiologist_id: "${rad}", expected_study_version: "${s1v}" }, as: DispatchOps }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-M2", modality: "MR", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "M2" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s2: $.data.id } }
            - { call: "POST /telerad/studies/${s2}/route", payload: {}, as: DispatchOps, captures: { s2v: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s2}", radiologist_id: "${rad}", expected_study_version: "${s2v}" }, as: DispatchOps }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-X1", modality: "XR", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "X1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s3: $.data.id } }
            - { call: "POST /telerad/studies/${s3}/route", payload: {}, as: DispatchOps, captures: { s3v: $.data.version } }
          trigger:
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res: $.data.reserved_rvu } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s3}", radiologist_id: "${rad}", expected_study_version: "${s3v}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "Radiologist.${rad}.reserved_rvu == 4.0 — equality with fatigue_cap_rvu 4.0 was ALLOWED on the second assign"
            - "third assign (projected 4.5 > 4.0) rejected with error_id == ERR_FATIGUE_CAP_EXCEEDED"
            - "Study.${s3}.status remains QUEUED"

      - name: tat_breach_strict_greater_than_due_at
        grounds:
          - calculations.tat_deadline
          - calculations.tat_breach_and_penalty
          - entities.Study.fields.tat_breached
        distinguishing_aspect: |
          Metric = time (minutes), endpoint = POST /telerad/reports/{id}/sign: signing exactly AT due_at is
          on time (breach uses strict >); signing 60 seconds later breaches with breach_minutes == 1.
          Different metric and endpoint than the fatigue-cap boundary.
        test_recipe:
          setup:
            - "CA hospital ACTIVE with default STAT TAT 60 min; policy CT/NEURO/STAT prelim_required=false; rad credentialed + ACTIVE CT shift"
            - "two STAT CT studies created at clock 2026-05-10T10:00:00Z (due 2026-05-10T11:00:00Z), both IN_PROGRESS with DRAFT FINAL reports"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Tat", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "STAT", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Tat Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-T1", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "T1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s1: $.data.id, due1: $.data.due_at } }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-T2", modality: "CT", body_part_group: "NEURO", priority: "STAT", patient_ref: "T2" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { s2: $.data.id } }
            - { call: "POST /telerad/studies/${s1}/route", payload: {}, as: DispatchOps, captures: { s1v: $.data.version } }
            - { call: "POST /telerad/studies/${s2}/route", payload: {}, as: DispatchOps, captures: { s2v: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s1}", radiologist_id: "${rad}", expected_study_version: "${s1v}" }, as: DispatchOps, captures: { a1: $.data.id } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${s2}", radiologist_id: "${rad}", expected_study_version: "${s2v}" }, as: DispatchOps, captures: { a2: $.data.id } }
            - { call: "POST /telerad/assignments/${a1}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/assignments/${a2}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${a1}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { r1: $.data.id } }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${a2}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { r2: $.data.id } }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/reports/${r1}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T11:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/reports/${r2}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
          trigger:
            - { call: "GET /telerad/studies/${s1}", payload: {}, as: DispatchOps, captures: { b1: $.data.tat_breached, m1: $.data.breach_minutes, d1: $.data.due_at } }
            - { call: "GET /telerad/studies/${s2}", payload: {}, as: DispatchOps, captures: { b2: $.data.tat_breached, m2: $.data.breach_minutes } }
          assert:
            - "Study.${s1}.due_at == 2026-05-10T11:00:00Z (received 10:00 + STAT 60min)"
            - "Study.${s1}.tat_breached == false and breach_minutes == 0 — signing exactly AT due_at is on time (strict >)"
            - "Study.${s2}.tat_breached == true and breach_minutes == 1 — signed 60s after due_at"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: study_create_route_blocked_when_hospital_suspended
        grounds:
          - state_machines.Study.RECEIVED_to_QUEUED
          - state_machines.ClientHospital.ACTIVE_to_SUSPENDED
          - validations[priority=6]
          - errors[ERR_HOSPITAL_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair = Study -> ClientHospital: study creation and routing are gated on the RELATED hospital's
          status == ACTIVE; a SUSPENDED hospital blocks both with ERR_HOSPITAL_NOT_ACTIVE even though the
          study itself is in a valid state.
        test_recipe:
          setup:
            - "hospital created and activated; one study created while ACTIVE; hospital then SUSPENDED"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Gate", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-G1", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "G1" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id, st0: $.data.status } }
            - { call: "POST /telerad/hospitals/${hosp}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-G2", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "G2" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { err_create: $.data.error_id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { err_route: $.data.error_id } }
          assert:
            - "study creation while hospital SUSPENDED: error_id == ERR_HOSPITAL_NOT_ACTIVE"
            - "routing an existing RECEIVED study while hospital SUSPENDED: error_id == ERR_HOSPITAL_NOT_ACTIVE"
            - "Study.${sid}.status remains RECEIVED"

      - name: assignment_blocked_when_credential_grant_suspended
        grounds:
          - calculations.auto_assignment_selector
          - state_machines.CredentialGrant.GRANTED_to_SUSPENDED
          - validations[priority=7]
          - errors[ERR_CREDENTIAL_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair = Assignment -> CredentialGrant (DIFFERENT pair than Study -> ClientHospital): assignment
          requires a GRANTED, in-window CredentialGrant for (radiologist, study.hospital_id); suspending
          the grant flips assignment eligibility to ERR_CREDENTIAL_NOT_ACTIVE with no change to the study.
        test_recipe:
          setup:
            - "full assignment-ready fixture (CA hospital, CT policy, NEURORAD rad licensed CA with ACTIVE CT shift, clock 2026-05-10T10:00:00Z)"
            - "the radiologist's grant is GRANTED then SUSPENDED before assignment"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp CredGate", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Cred Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-CG", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "CG" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/credential-grants/${g}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CREDENTIAL_NOT_ACTIVE"
            - "Study.${sid}.status remains QUEUED and assigned_radiologist_id is null"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_overlap_half_open_adjacency
        grounds:
          - entities.CoverageShift.fields.starts_at
          - entities.CoverageShift.fields.ends_at
          - errors[ERR_SHIFT_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Resource = CoverageShift, semantics = half-open datetime intervals [starts_at, ends_at): a shift
          starting exactly when another ends (16:00 == 16:00) is ADJACENT and allowed; overlapping by one
          minute (15:59) is rejected. Distinct from the inclusive-day semantics on CredentialGrant.
        test_recipe:
          setup:
            - "one radiologist; shift A [2026-05-01T08:00:00Z, 2026-05-01T16:00:00Z) exists (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /telerad/radiologists", payload: { full_name: "Shift Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-01T08:00:00Z", ends_at: "2026-05-01T16:00:00Z", modalities: ["CT"] }, as: PlatformAdmin, captures: { sh_a: $.data.id } }
          trigger:
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T20:00:00Z", modalities: ["MR"] }, as: PlatformAdmin, captures: { sh_b: $.data.id } }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-01T15:59:00Z", ends_at: "2026-05-01T21:00:00Z", modalities: ["CT"] }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent shift B (starts_at == A.ends_at) is created successfully (half-open semantics: touching is not overlapping)"
            - "overlapping shift C (15:59 < 16:00) rejected with error_id == ERR_SHIFT_OVERLAP"
            - "only 2 shifts exist for the radiologist after the three calls"

      - name: grant_overlap_inclusive_day_semantics
        grounds:
          - entities.CredentialGrant.fields.valid_from
          - entities.CredentialGrant.fields.valid_until
          - errors[ERR_GRANT_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Resource = CredentialGrant, semantics = INCLUSIVE whole-day ranges [valid_from, valid_until]:
          a new grant starting on the existing grant's LAST valid day (2026-12-31) shares that calendar day
          and is rejected; starting the NEXT day (2027-01-01) is allowed. Different interval geometry than
          the half-open shift rule.
        test_recipe:
          setup:
            - "hospital + radiologist; grant G1 GRANTED with validity 2026-01-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Over", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Grant Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g1: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g1}/grant", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-12-31", valid_until: "2027-06-30" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2027-01-01", valid_until: "2027-12-31" }, as: PlatformAdmin, captures: { g3: $.data.id, g3_status: $.data.status } }
          assert:
            - "grant starting 2026-12-31 rejected with error_id == ERR_GRANT_OVERLAP (shares the inclusive last day of G1)"
            - "grant starting 2027-01-01 is created with status PENDING (adjacent days do not overlap under inclusive semantics either)"

  # ==========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserved_rvu_conserved_across_assign_release
        grounds:
          - calculations.fatigue_utilization
          - state_machines.Study.QUEUED_to_ASSIGNED
          - state_machines.Study.ASSIGNED_to_QUEUED
          - entities.Radiologist.fields.reserved_rvu
        distinguishing_aspect: |
          Conserved quantity = Radiologist.reserved_rvu (RVU capacity). Invariant pinned as a formula:
          reserved_rvu == sum(reserved_rvu over ACTIVE assignments) at every observable point; the forward
          action (assign, +1.5) paired with its compensating action (release, -1.5) returns the quantity
          to exactly its prior value with zero drift.
        test_recipe:
          setup:
            - "full fixture: CA hospital ACTIVE, CT/NEURO/ROUTINE policy, credentialed rad with ACTIVE CT shift, clock 2026-05-10T10:00:00Z"
            - "one QUEUED ROUTINE CT study (study_rvu 1.5)"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp Inv", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/routing-policies", payload: { hospital_id: "${hosp}", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", required_subspecialty: "NEURORAD", prelim_required: false, expected_hospital_version: "${hosp_v}" }, as: PlatformAdmin }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Inv Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-INV", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "INV" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
          trigger:
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res_before: $.data.reserved_rvu } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res_during: $.data.reserved_rvu } }
            - { call: "POST /telerad/assignments/${asg}/release", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "GET /telerad/radiologists/${rad}", payload: {}, as: PlatformAdmin, captures: { res_after: $.data.reserved_rvu } }
          assert:
            - "before assign: reserved_rvu == 0.0"
            - "after assign (forward action): reserved_rvu == 1.5 == sum over ACTIVE assignments"
            - "after release (compensating action): reserved_rvu == 0.0 exactly — no drift in the conserved quantity"
            - "count of ACTIVE assignments for ${rad} == 0, consistent with reserved_rvu == 0.0"

      - name: billable_count_gross_conserved_across_addendum_and_regenerate
        grounds:
          - calculations.invoice_volume_pricing
          - state_machines.BillingPeriod.INVOICED_to_INVOICED
          - state_machines.Invoice.CURRENT_to_VOID
          - state_machines.Study.FINAL_SIGNED_to_AMENDMENT_PENDING
        distinguishing_aspect: |
          Conserved quantity = billing volume (billable_study_count and gross_cents) — a DIFFERENT quantity
          than radiologist RVU: an addendum cycle (request-addendum + ADDENDUM sign) plus an invoice
          regenerate must leave the count and gross identical; addenda are not re-billed and regeneration
          supersedes without double counting.
        test_recipe:
          setup:
            - "MARGINAL CA hospital ACTIVE; credentialed rad with ACTIVE CT shift; clock 2026-05-10T10:00:00Z"
            - "one seeded FINAL_SIGNED study (received 2026-05-04T10:00:00Z regular hours, finalized on time), period 2026-05-01..2026-05-31 CLOSED, invoice I1 generated (1 unit @ 901c)"
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp InvB", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hosp_v: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hosp_v: $.data.version } }
            - { call: "POST /telerad/radiologists", payload: { full_name: "Add Rad", subspecialties: ["NEURORAD"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/_seed/finalized-studies", payload: { hospital_id: "${hosp}", count: 1, received_at: "2026-05-04T10:00:00Z", final_signed_at: "2026-05-04T12:00:00Z" }, as: PlatformAdmin, captures: { sid: "$.data.study_ids[0]" } }
            - { call: "POST /telerad/billing-periods", payload: { hospital_id: "${hosp}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: PlatformAdmin, captures: { per: $.data.id } }
            - { call: "POST /telerad/billing-periods/${per}/close", payload: {}, as: PlatformAdmin, captures: { per_v: $.data.version } }
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${per_v}" }, as: PlatformAdmin, captures: { inv1: $.data.id, gross1: $.data.gross_cents, cnt1: $.data.billable_study_count } }
          trigger:
            - { call: "POST /telerad/studies/${sid}/request-addendum", payload: {}, as: ClientHospitalUser, as_user_id: "${hosp}" }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "ADDENDUM", findings_text: "af", impression_text: "ai" }, as: Radiologist, as_user_id: "${rad}", captures: { rep_a: $.data.id } }
            - { call: "POST /telerad/reports/${rep_a}/sign", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "GET /telerad/billing-periods/${per}", payload: {}, as: PlatformAdmin, captures: { per_v2: $.data.version } }
            - { call: "POST /telerad/billing-periods/${per}/generate-invoice", payload: { expected_billing_period_version: "${per_v2}" }, as: PlatformAdmin, captures: { inv2: $.data.id, gross2: $.data.gross_cents, cnt2: $.data.billable_study_count } }
            - { call: "GET /telerad/invoices/${inv1}", payload: {}, as: PlatformAdmin, captures: { inv1_status: $.data.status } }
            - { call: "GET /telerad/studies/${sid}", payload: {}, as: DispatchOps, captures: { acnt: $.data.addendum_count, st: $.data.status } }
          assert:
            - "Invoice.${inv1}: billable_study_count == 1 and gross_cents == 901 before the addendum cycle"
            - "after addendum cycle + regenerate: Invoice.${inv2}.billable_study_count == 1 (addendum not re-billed)"
            - "Invoice.${inv2}.gross_cents == 901 — conserved across the forward/compensating pair"
            - "Invoice.${inv1}.status == VOID (superseded) and Invoice.${inv2}.status == CURRENT"
            - "Study.${sid}.status == FINAL_SIGNED and addendum_count == 1"
