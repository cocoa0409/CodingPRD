              as: CenterAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Cody Bell", clinician_role: "CODER", npi: "1000000003", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
