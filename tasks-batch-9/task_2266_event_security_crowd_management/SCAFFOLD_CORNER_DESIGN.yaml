  - name: post_status_ladder_marks_understaffed_only_after_activation
    claim_type: aggregation
    grounds:
    - calculations.post_fill_and_status
    - calculations.plan_coverage_and_posture
    - calculations.event_gate_posture
    - state_machines.StaffingPlan.PUBLISHED_to_ACTIVATED
    distinguishing_aspect: |
      post_fill_and_status is a first-match ladder whose clause 3 depends on the PARENT plan's status, so the same under-filled post must read PARTIALLY_STAFFED before ACTIVATE and UNDERSTAFFED after it, with nothing about the post or its assignments having changed in between. That flip is also the only way understaffed_post_count becomes non-zero, which is in turn the third term of the READY clause and the trigger for the gate's RESTRICTED posture.
