            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "EDU", name: "Education Research", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: true }
              as: ConferenceAdmin
              captures: { cat_edu_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ben Okafor", email: "ben@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ben_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_edu_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology", "immunotherapy", "imaging"], body_structured: true, coauthor_emails: ["ben@lab.example"], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1a_id: "$.data.id" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r2_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1b_id: "$.data.id" }
            - call: "POST /reviews/${rv1a_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "POST /reviews/${rv1b_id}/submission"
              payload: { score_originality: 3, score_methodology: 3, score_relevance: 3, score_clarity: 3, confidence: "MEDIUM", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r2_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
            - call: "GET /conferences/${conf_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { conf_v0: "$.data.version" }
            - call: "POST /abstracts/${ab1_id}/decision"
              payload: { decision: "ORAL", expected_conference_version: "${conf_v0}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: ConferenceAdmin
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: true }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: Author
              as_user_id: "${au_ada_id}"
            - call: "POST /sessions"
              payload: { conference_id: "${conf_id}", chair_member_id: "${mb_chair_id}", theme_code: "oncology", format: "ORAL", room_code: "HALL-A", start_utc: "2026-09-01T09:00:00Z", end_utc: "2026-09-01T10:00:00Z", capacity_slots: 3, cme_designated: false }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { sess_id: "$.data.id", sess_v0: "$.data.version" }
            - call: "POST /sessions/${sess_id}/slots"
              payload: { abstract_id: "${ab1_id}", presenter_author_id: "${au_ada_id}", position: 1, duration_minutes: 25, expected_session_version: "${sess_v0}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { slot1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T08:00:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /program-change-requests"
              payload: { session_slot_id: "${slot1_id}", change_type: "SUBSTITUTE_PRESENTER", requested_by_author_id: "${au_ada_id}", substitute_presenter_author_id: "${au_ben_id}", reason: "presenting author hospitalised" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { pcr_id: "$.data.id", pcr_estimate: "$.data.estimated_fee_cents" }
            - call: "POST /program-change-requests/${pcr_id}/adjudication"
              payload: { outcome: "APPROVED", note: "substitution accepted" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
          assert:
            - "ProgramChangeRequest.${pcr_id}.days_to_event == 5"
            - "ProgramChangeRequest.${pcr_id}.estimated_fee_cents == 3125"
            - "ProgramChangeRequest.${pcr_id}.final_fee_cents == 5250"
            - "ProgramChangeRequest.${pcr_id}.rush_pct_applied == 50"
            - "ProgramChangeRequest.${pcr_id}.estimated_fee_cents != ProgramChangeRequest.${pcr_id}.final_fee_cents"
            - "ProgramChangeRequest.${pcr_id}.status == APPLIED"
            - "SessionSlot.${slot1_id}.presenter_author_id == ${au_ben_id}"
            - "SessionSlot.${slot1_id}.status == SCHEDULED"

      - name: cme_credits_per_abstract_award_vs_conference_bundle_estimate
        grounds:
          - calculations.cme_credit_award
          - entities.CmeAccreditation.fields.awarded_credits
          - entities.Conference.fields.cme_minutes_allocated
          - state_machines.CmeAccreditation.PENDING_to_VALIDATED
          - endpoints.GET_/conferences/{conferenceId}/capacity-summary
        distinguishing_aspect: |
          The dual variant lives in the CME minute-to-credit domain: over the
          same two VALIDATED accreditations of 20 and 25 content minutes the
          per_abstract_award variant floors first and sums to 0.50 credits while
          the session_bundle_estimate variant sums first and floors once to 0.75
          credits, so awarded_credits_sum != cme_bundle_credits on one read.
        test_recipe:
          setup:
            - "Conference GOS26 at REVIEW_CLOSED with cme_minutes_pool_total 600 and two chairs so the accreditation validator is never the decider."
            - "Category EDU is cme_eligible with min_reviews_required 2."
            - "Two abstracts by Ada, each with two SUBMITTED reviews, each decided ACCEPTED/ORAL by chair Cho."
            - "Each abstract carries one PENDING CmeAccreditation (20 and 25 content_minutes) and one VALIDATED DisclosureStatement with has_financial_relationship false, so commercial_bias_flag is false."
            - "Both accreditations are VALIDATED by the second chair Dana."
          setup_api_calls:
