          assert:
            - "avail_draft == 10000000 (deliver released the quoted hold; DRAFT invoices are not outstanding)"
            - "avail_final == 9961480 (10000000 - 38520 while FINALIZED)"
            - "avail_paid == 10000000 and ytd_billed_cents == 38520; Job.${job_id}.job_status == CLOSED (bubble-up from PAID)"

