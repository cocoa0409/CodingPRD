  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: credit_exposure_exactly_at_limit_is_accepted_one_cent_over_is_not
        grounds:
          - calculations.servicer_credit_exposure
          - validations[priority=48]
          - endpoints.POST_/part-orders/{id}/lines
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary metric: projected credit exposure against credit_limit_cents, probed on
          POST /part-orders/{id}/lines. Exposure landing exactly on the 31197 limit is accepted
          because the rule is <=, and the next line (41596) is refused — an inclusive-limit probe
          on a money aggregate.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P1 (12999 MECHANICAL, GOLD unit price 10399)."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 31197 — exactly three units' worth — core_liability_limit_cents 5000000, authorized for WHIRLPOOL."
            - "A DRAFT WILL_CALL order at STL with no lines and credit_used_cents 0."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Boundary Repairs", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 31197, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_b_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_b_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_b_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_b_id}"
              captures: { line_1_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v1: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v1}" }
              as: Servicer
              as_user_id: "${acct_b_id}"
          assert:
            - "trigger step 1 returns 201 and OrderLine.${line_1_id}.extended_price_cents == 31197"
            - "after trigger step 1: ServicerAccount.${acct_b_id}.credit_used_cents == 31197 (exactly the limit, accepted)"
            - "trigger step 3 returns HTTP 402 with data.error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "after trigger step 3: PartOrder.${order_id}.subtotal_cents == 31197 and ServicerAccount.${acct_b_id}.credit_used_cents == 31197"
            - "the refused projection was 41596, not 31197 + 41596"
            - "GET /order-lines?part_order_id=${order_id} returns exactly 1 row"

      - name: allocation_requires_at_least_one_line_zero_versus_one
        grounds:
          - validations[priority=43]
          - state_machines.PartOrder.DRAFT_to_ALLOCATED
          - endpoints.POST_/part-orders/{id}/allocate
          - errors[ERR_ORDER_HAS_NO_LINES]
        distinguishing_aspect: |
          A different metric on a different endpoint from the exposure probe: the boundary here is
          the cardinality of the non-CANCELLED OrderLine collection, probed on
          POST /part-orders/{id}/allocate. Zero lines is refused with ERR_ORDER_HAS_NO_LINES (422)
          while exactly one line is the smallest accepted collection.
        test_recipe:
