          setup:
            - "CA StateRule and a SORE_THROAT protocol with requires_cosign false exist; one OPEN CA clinic with one ACTIVE clinician."
            - "The patient consents to PCP communication and has a direct address that accepts electronic summaries, so checkout creates a QUEUED DIRECT_MESSAGE summary."
