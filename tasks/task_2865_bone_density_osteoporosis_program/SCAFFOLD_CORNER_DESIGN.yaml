              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/diagnostic-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/treatment-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
