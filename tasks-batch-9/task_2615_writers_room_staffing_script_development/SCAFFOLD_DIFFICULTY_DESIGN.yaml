  - rule_id: non_linear_state_machine
    instances:
      - name: script_assignment_revision_loop_traversed_twice_then_capped
        grounds:
          - state_machines.ScriptAssignment
          - state_machines.ScriptAssignment.transitions.DELIVERED_to_IN_NOTES
          - state_machines.ScriptAssignment.transitions.IN_NOTES_to_DRAFTING
          - state_machines.Milestone.transitions.DELIVERED_to_NOTES_ISSUED
          - state_machines.Milestone.transitions.NOTES_ISSUED_to_DELIVERED
          - entities.ScriptAssignment.fields.revision_round
          - endpoints.POST_/script-assignments/{assignment_id}/issue-notes
          - endpoints.POST_/milestones/{milestone_id}/deliver
          - validations.priority_69_ERR_REVISION_CAP_EXCEEDED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          A true cycle, not a linear ladder: DRAFTING -> DELIVERED -> IN_NOTES -> DRAFTING is traversed
          twice on the SAME assignment, and each traversal is driven by two different endpoints on two
          different entities (issue-notes on the assignment, deliver on the milestone). The loop is not
          endless - the third attempt is refused by the revision cap (revision_round + 1 <= 2), so the
          termination condition of the cycle is asserted rather than assumed. The assignment also
          re-enters DELIVERED a second time, so no implementation may treat DELIVERED as one-shot.
        test_recipe:
          setup:
            - "Agreement AG (max_free_revision_rounds 2), season SE, ACTIVE room RM with W1 CONFIRMED (STORY_EDITOR 600000)."
            - "Episode E1 (ONE_HOUR, production start 2026-11-02) with assignment A1 = TELEPLAY by W1."
            - "All three milestones of A1 (OUTLINE, FIRST_DRAFT, SECOND_DRAFT - the set synthesized for a TELEPLAY assignment) are delivered, so A1 sits in DELIVERED with revision_round 0 and the logical clock still at its 2026-08-01T00:00:00Z default (every due date in the future, so no milestone is LATE)."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
