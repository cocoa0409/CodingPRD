          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Each declared shape rule is enforced independently: inspection_level 7 (range 1..6), an
          unknown selection_source member, inspection_end equal to inspection_start,
          severity_weight 11 (range 1..10), limit 0 (range 1..100) and a non-monotonic threshold
          trio (p50 2.0 > p65 1.0) all return ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
