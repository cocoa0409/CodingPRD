            - "TreatmentFacility.${tf_ca}.pending_intake_units == 60"

  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Sponsor
          - state_machines.SponsorshipProgram.initial_state
          - state_machines.TreatmentFacility.initial_state
          - state_machines.Patient.initial_state
          - state_machines.Enrollment.initial_state
        distinguishing_aspect: "Four creations land on ACTIVE / ACTIVE / PENDING_ELIGIBILITY / DRAFT exactly as §1.2 declares — a program created with a positive ceiling is ACTIVE (not EXHAUSTED) and a fresh patient is PENDING_ELIGIBILITY (not ELIGIBLE)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule seeded; patient Ada Chen created and APPROVED so that an enrollment can be created in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Ada Chen", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_SYRINGES", weekly_sharps_count: 10, contact_email: "ada@example.com" }
              as: ProgramAdmin
              captures: { pat_a: $.data.id }
            - call: "POST /sharps/patients/${pat_a}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_nw: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Valley Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: ["UN3291_SHARPS_ONLY"], daily_intake_capacity_units: 1000 }
              as: ProgramAdmin
              captures: { tf_ca: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Ray Okafor", state_rule_id: "${sr_ca}", therapy_type: "LANCETS_ONLY", weekly_sharps_count: 30, contact_email: "ray@example.com" }
              as: ProgramAdmin
              captures: { pat_r: $.data.id }
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_a}", sponsorship_program_id: "${prog_nw}", cadence_days: 30, kits_authorized: 2 }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
          assert:
            - "Sponsor.${sp_nw}.status == \"ACTIVE\""
            - "SponsorshipProgram.${prog_nw}.status == \"ACTIVE\""
            - "SponsorshipProgram.${prog_nw}.available_cents == 500000"
            - "SponsorshipProgram.${prog_nw}.reserved_cents == 0 and SponsorshipProgram.${prog_nw}.committed_cents == 0"
            - "SponsorshipProgram.${prog_nw}.kits_issued_count == 0 and SponsorshipProgram.${prog_nw}.kits_settled_count == 0"
            - "TreatmentFacility.${tf_ca}.status == \"ACTIVE\""
            - "Patient.${pat_r}.status == \"PENDING_ELIGIBILITY\""
            - "Patient.${pat_a}.status == \"ELIGIBLE\" (unchanged by the enrollment creation; only sponsor APPROVE promotes it to ENROLLED)"
            - "Enrollment.${enr_a}.status == \"DRAFT\""
            - "Enrollment.${enr_a}.version == 1"

      - name: eligibility_review_deny_forks_the_patient_into_the_ineligible_branch
        claim_type: valid_transition
        grounds:
          - state_machines.Patient.PENDING_ELIGIBILITY_to_INELIGIBLE
          - endpoints.POST /sharps/patients/{id}/eligibility-review
        distinguishing_aspect: "The DENY arm of the same endpoint that produces ELIGIBLE lands the patient in INELIGIBLE with suspended_at still null and both risk scores still 0 — the branch is a fork, not a variant of APPROVE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule seeded; patient Ray Okafor created, PENDING_ELIGIBILITY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Ray Okafor", state_rule_id: "${sr_ca}", therapy_type: "LANCETS_ONLY", weekly_sharps_count: 30, contact_email: "ray@example.com" }
              as: ProgramAdmin
              captures: { pat_r: $.data.id }
          trigger:
            - call: "POST /sharps/patients/${pat_r}/eligibility-review"
              payload: { decision: "DENY", note: "no mail-back eligibility on file" }
              as: ProgramAdmin
          assert:
            - "HTTP status == 200"
            - "Patient.${pat_r}.status == \"INELIGIBLE\""
            - "Patient.${pat_r}.suspended_at == null"
            - "Patient.${pat_r}.screening_risk_score == 0 and Patient.${pat_r}.audit_risk_score == 0"
            - "Patient.${pat_r}.version == 2"
            - "Patient.${pat_r}.updated_at == \"2026-08-01T00:00:00Z\""
            - "GET /sharps/patients?status=INELIGIBLE returns exactly 1 row whose id == ${pat_r}"

      - name: terminal_ineligible_patient_rejects_every_further_status_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Patient.terminal_states
          - validations[priority 7].state
          - errors[ERR_INVALID_PATIENT_STATE]
        distinguishing_aspect: "From the terminal INELIGIBLE state both a second eligibility-review and a WITHDRAW return 409 ERR_INVALID_PATIENT_STATE and the row never changes version — terminal means no outbound edge at all, not merely no forward edge."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule seeded; patient Ray Okafor DENIED, so status is the terminal INELIGIBLE at version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/patients"
