# =============================================================================
# PRD Benchmark Seed Tables — task_3269
# Domain: Data Labeling Workforce Task Routing & Quality Consensus
# =============================================================================

scenario: |
  Data Labeling Workforce Task Routing & Quality Consensus (Scale AI): task
  decomposition from a customer specification into labeling units with
  instruction documents and edge case guidance, worker qualification through
  training tasks and ongoing gold-standard evaluation, task routing by worker
  skill, language and historical accuracy with dynamic pay rates, consensus
  mechanisms where multiple workers label the same item and disagreements route
  to reviewers, quality measurement against customer-provided ground truth with
  acceptance thresholds and rework, throughput planning against customer
  deadlines with workforce capacity scaling, confidentiality and data handling
  requirements for sensitive customer datasets, worker payment, dispute and
  appeal processes for rejected work.

domain_name: data-labeling-ops
api_prefix: /api

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation       # consensus panel + reviewer concurrence quorum
  secondary_archetype: compliance / audit          # gold-standard audit + appeal adjudication
  complexity_layers:
    - selector_policy                # per-item panel selection from a qualified worker pool
    - multi_tenancy_isolation        # per-program dataset and language separation
    - rate_threshold_triggers        # tier thresholds, gold-rotation streak, capacity breakpoints
    - optimistic_concurrency         # OCC on LabelingItem.version, CustomerProgram.version, AppealClaim.version
    - dual_variant_calculation       # accepted vs provisional accuracy and payout
    - derived_field_reconciliation   # item_count, certified_item_count, accuracy metrics, plan points
    - bulk_operations                # panel dispatch creates N commits in one request
  entity_topology: graph             # self-referential spec decomposition + cross-aggregate FKs
  state_machine_shape: cyclic        # SpecUnit COMPLETE->ACTIVE, WorkerQualification PROBATION->QUALIFIED, LabelingItem COMPLETED->REWORK
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties  # the worker who committed a piece may not audit, review or adjudicate it
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: CustomerProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Customer ticket code for the engagement, e.g. AX-4410; unique across programs" }
      - { name: name, type: string, source: input, description: "Engagement name" }
      - { name: language_code, type: enum, source: input, description: "Sole task language of the engagement", constraints: "one of es-MX, en-US, vi-VN, tl-PH, pt-BR, ta-IN, hi-IN" }
      - { name: instruction_model, type: enum, source: input, description: "Labeling task family produced by this engagement", constraints: "one of IDEAL_RESPONSE, RANKED_PREFERENCE, SPAN_EXTRACTION, SAFETY_CLASSIFICATION" }
      - { name: sensitivity_class, type: enum, source: input, default: STANDARD, description: "Confidentiality class of the customer dataset", constraints: "one of STANDARD, SENSITIVE, RESTRICTED" }
      - { name: incident_severity, type: enum, source: system, default: NONE, description: "Worst unresolved confidentiality incident observed on this program", constraints: "one of NONE, MINOR, MAJOR, CATASTROPHIC" }
      - { name: open_incident_count, type: integer, source: computed, default: 0, description: "Count of ConfidentialityIncident rows on this program with status OPEN" }
      - { name: operational_restricted, type: boolean, source: computed, default: false, description: "True while any ConfidentialityIncident on this program has status OPEN and severity in {MAJOR, CATASTROPHIC}" }
      - { name: min_consensus_agreement, type: number, source: input, default: 0.6, description: "Fraction of non-abstaining committed members that must share the modal value for a piece to certify on its own" }
      - { name: commitment_quorum, type: integer, source: input, default: 3, description: "Non-abstaining committed assignments required before a piece may certify or be tie-broken" }
      - { name: commit_deadline_seconds, type: integer, source: input, default: 7200, description: "Seconds after dispatch a committed answer is still admissible" }
      - { name: weekly_earning_cap_cents, type: integer, source: input, default: 9000, description: "Per-worker ceiling on accepted payouts inside one week epoch; a low value makes the ceiling reachable inside a short test" }
      - { name: patience_seconds, type: integer, source: input, default: 600, description: "Seconds a piece or appeal may wait for its remaining quorum before the deadlock or hold fires" }
      - { name: deadline_utc, type: datetime, source: input, description: "Customer delivery deadline in UTC; earlier deadlines are allocated workforce points first" }
      - { name: blackout_start_utc, type: datetime, source: input, description: "Start of the customer blackout window during which no labeling coverage may run" }
      - { name: blackout_end_utc, type: datetime, source: input, description: "End of the customer blackout window; a coverage window ending exactly here is adjacent and therefore allowed" }
      - { name: coverage_hours, type: number, source: input, default: 168, description: "Wall-clock hours the engagement's delivery window spans" }
      - { name: capacity_points, type: integer, source: input, default: 100000, description: "Total workforce points available inside the coverage window" }
      - { name: point_cost_high_accuracy, type: integer, source: input, default: 2, description: "Points charged per item when accuracy is at or above accuracy_high_watermark_pct" }
      - { name: point_cost_medium_accuracy, type: integer, source: input, default: 3, description: "Points charged per item when accuracy is at or above accuracy_floor_pct but strictly below the watermark" }
      - { name: point_cost_fallback, type: integer, source: input, default: 4, description: "Points charged per item when accuracy is strictly below accuracy_floor_pct" }
      - { name: accuracy_floor_pct, type: number, source: input, default: 85, description: "Hard floor the accepted accuracy variant must clear for the plan to stay feasible" }
      - { name: accuracy_high_watermark_pct, type: number, source: input, default: 95, description: "Accuracy at or above which the cheap per-item point cost applies" }
      - { name: demand_points, type: integer, source: computed, default: 0, description: "Sum of unit_effective_points over every SpecUnit under this program, including DRAFT and REJECTED units" }
      - { name: capacity_requirement_points, type: integer, source: computed, default: 0, description: "= round_half_up(demand_points * capacity_multiplier), the multiplier being 1.0 / 1.15 / 1.35 by accuracy variant" }
      - { name: capacity_multiplier, type: number, source: computed, default: 1.0, description: "1.0 for the ACCEPTED variant, 1.15 for PROVISIONAL, 1.35 for AT_RISK" }
      - { name: capacity_feasible, type: boolean, source: computed, default: false, description: "True when capacity_points is at or above capacity_requirement_points and accuracy is at or above accuracy_floor_pct" }
      - { name: projected_miss_deadline, type: boolean, source: computed, default: false, description: "True when capacity_feasible is false or the requested accuracy variant sits strictly below accuracy_floor_pct" }
      - { name: accuracy_floor_variant_below, type: boolean, source: computed, default: false, description: "True when the requested accuracy variant is strictly below accuracy_floor_pct; equality is NOT below floor" }
      - { name: accepted_accuracy_pct, type: number, source: computed, default: 0, description: "Accepted variant: 100 * gold audits graded PASSED / gold audits graded PASSED or FAILED" }
      - { name: provisional_accuracy_pct, type: number, source: computed, default: 0, description: "Provisional variant: 100 * gold audits graded PASSED or FLAGGED / gold audits graded PASSED or FAILED; always at or above accepted_accuracy_pct" }
      - { name: accuracy_denominator_count, type: integer, source: computed, default: 0, description: "Count of gold audits graded PASSED or FAILED on this program; EXCLUDED_FROM_ACCURACY and CATALOGUED audits are outside both variants" }
      - { name: on_time, type: boolean, source: computed, default: false, description: "True when every piece that entered REWORK was eventually certified at or before deadline_utc" }
      - { name: qa_sample_rate, type: number, source: computed, default: 0, description: "Highest gold_rate declared by any SpecUnit under this program" }
      - { name: current_week_epoch_index, type: integer, source: system, default: 0, description: "0-based week epoch; every weekly accumulator resets when this advances" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT then ACTIVE then QUALITY_EMBARGO (recoverable) or FROZEN (terminal)", constraints: "one of DRAFT, ACTIVE, QUALITY_EMBARGO, FROZEN" }

  - name: SpecUnit
    parent: CustomerProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CustomerProgram.id; owning engagement" }
      - { name: unit_code, type: string, source: input, description: "Customer-facing unit key; unique within the program" }
      - { name: parent_unit_id, type: string, source: input, required: false, description: "FK -> SpecUnit.id; the decomposition parent, null for a root unit" }
      - { name: max_items, type: integer, source: input, description: "Item ceiling of this unit; item_count may never exceed it" }
      - { name: item_count, type: integer, source: system, default: 0, description: "Number of LabelingItem rows attached to this unit" }
      - { name: instruction_revision, type: integer, source: input, description: "Current instruction document revision carried by items created under this unit" }
      - { name: instruction_status, type: enum, source: system, default: DRAFT, description: "Instruction document status; a unit may only activate against a PUBLISHED revision", constraints: "one of DRAFT, PUBLISHED, SUPERSEDED" }
      - { name: has_edge_case_guidance, type: boolean, source: input, default: false, description: "True when the instruction document publishes edge case guidance for this unit" }
      - { name: edge_case_count, type: integer, source: input, default: 0, description: "Number of edge cases the instruction document enumerates; must be 0 when has_edge_case_guidance is true" }
      - { name: field_schema, type: array, source: input, description: "Ordered payload field names the instruction document defines; a commit payload must carry exactly this key set" }
      - { name: panel_size, type: integer, source: input, default: 3, description: "Distinct panel assignments dispatched when the piece enters CONSENSUS; minimum 2" }
      - { name: gold_rate, type: number, source: input, default: 0, description: "Fraction of dispatched commits on this unit served as gold audits, 0 <= gold_rate <= 1" }
      - { name: coverage_start_utc, type: datetime, source: input, description: "Start of the labeling coverage window for this unit" }
      - { name: coverage_end_utc, type: datetime, source: input, description: "End of the coverage window; a window ending exactly at the blackout start is adjacent and allowed" }
      - { name: piece_status, type: enum, source: system, default: DECOMPOSED, description: "Production state of the unit's pieces", constraints: "one of DECOMPOSED, IN_PRODUCTION, CONSENSUS, CERTIFIED, REJECTED, REWORK" }
      - { name: frozen_revision, type: integer, source: system, default: null, description: "Instruction revision pinned when the unit's first piece reached CONSENSUS; later lower revisions never move it backwards" }
      - { name: certified_item_count, type: integer, source: computed, default: 0, description: "Count of attached items whose consensus_status is CERTIFIED" }
      - { name: remaining_item_slots, type: integer, source: computed, description: "= max_items - item_count" }
      - { name: unit_ceiling_points, type: integer, source: computed, description: "= max_items * capacity_weight of the owning program, the weight being 1 for STANDARD, 2 for SENSITIVE, 3 for RESTRICTED" }
      - { name: unit_effective_points, type: integer, source: computed, description: "= round_half_up(unit_ceiling_points * rework_point_multiplier), the multiplier being 1.0 normally and 1.2 while piece_status is REWORK" }
      - { name: rework_point_multiplier, type: number, source: computed, default: 1.0, description: "1.0 normally, 1.2 while the unit holds any item in REWORK" }
      - { name: unit_accuracy_pct, type: number, source: computed, default: 0, description: "Accepted variant accuracy over the unit's gold-audited items" }
      - { name: unit_provisional_accuracy_pct, type: number, source: computed, default: 0, description: "Provisional variant accuracy over the unit's gold-audited items" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Decomposition lifecycle of the unit itself", constraints: "one of DRAFT, ACTIVE, COMPLETE, REJECTED" }

  - name: LabelingItem
    parent: SpecUnit
    common_fields: true
    fields:
      - { name: spec_unit_id, type: string, source: system, description: "FK -> SpecUnit.id; the unit this piece belongs to" }
      - { name: item_key, type: string, source: input, description: "Customer payload key; unique within the spec unit" }
      - { name: item_seq, type: integer, source: system, description: "1-based insertion sequence within the spec unit; the list endpoint orders by this value" }
      - { name: payload_uri, type: string, source: input, description: "Storage handle of the raw payload; omitted from responses while the owning program sensitivity_class is SENSITIVE or RESTRICTED" }
      - { name: required_units, type: integer, source: input, default: 1, description: "Number of certified items in this unit required before the piece may be released; zero means the piece would publish with no detection coverage" }
      - { name: instruction_revision, type: integer, source: system, description: "Revision copied from the spec unit at creation; a mismatch against frozen_revision at submit time is fatal" }
      - { name: item_status, type: enum, source: system, default: PENDING, description: "Production status of the piece", constraints: "one of PENDING, ROUTED, IN_REVIEW, COMPLETED, REWORK" }
      - { name: consensus_status, type: enum, source: system, default: PENDING, description: "Consensus outcome of the piece", constraints: "one of PENDING, AWAITING_CONSENSUS, CERTIFIED, HELD_QUORUM, REJECTED, REWORK" }
      - { name: non_abstaining_commit_count, type: integer, source: computed, default: 0, description: "Count of COMMITTED commits on this item with abstained false; the agreement denominator" }
      - { name: modal_label, type: string, source: computed, default: null, description: "Value carried by the largest committed value group; null while AWAITING_CONSENSUS" }
      - { name: agreement_ratio, type: number, source: computed, default: 0, description: "modal group size divided by non_abstaining_commit_count, rounded to 4 decimal places half-up" }
      - { name: gold_audits_this_week, type: integer, source: system, default: 0, description: "Gold audits dispatched against this piece since the current week epoch began" }
      - { name: gold_rotation, type: boolean, source: computed, default: false, description: "True while gold_audits_this_week is at or above 3 and consensus_status is not REWORK" }
      - { name: holds_quorum, type: boolean, source: computed, default: false, description: "True while the piece sits in HELD_QUORUM awaiting a reviewer tie-break" }
      - { name: rework_cycles, type: integer, source: system, default: 0, description: "Number of REWORK rounds this piece has entered" }
      - { name: rework_round_limit, type: integer, source: system, default: 3, description: "Maximum rework rounds; reaching it rejects the piece" }
      - { name: rework_started_at, type: datetime, source: system, default: null, description: "Instant the piece entered REWORK; the rework window is measured from here" }
      - { name: rework_window_seconds, type: integer, source: system, default: 900, description: "Length of the rework correction window in seconds" }
      - { name: rework_window_remaining_seconds, type: integer, source: computed, default: null, description: "= rework_window_seconds minus elapsed(rework_started_at, logical clock); null unless the piece is in REWORK" }
      - { name: payout_complete, type: boolean, source: computed, default: false, description: "True when every COMMITTED commit on this item has an ACCEPTED or REVERSED payment status" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Container state of the piece", constraints: "one of DRAFT, RELEASED, IN_PANEL, RESOLVED" }

  - name: Commit
    parent: LabelingItem
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> LabelingItem.id; the piece this assignment answers" }
      - { name: worker_id, type: string, source: system, description: "The assigned worker, resolved as the WorkerIdentity matching the selected panel candidate and never client supplied" }
      - { name: qualification_id, type: string, source: system, default: null, description: "WorkerQualification row the rate and eligibility were read from; resolved as (worker_id, owning program language_code)" }
      - { name: kind, type: enum, source: input, default: PRODUCTION, description: "PRODUCTION commits form the consensus panel; GOLD commits are quality audits and never count toward consensus", constraints: "one of PRODUCTION, GOLD" }
      - { name: dispatch_rank, type: integer, source: system, description: "1-based rank assigned at dispatch from the selector ordering; the commit list orders by this value" }
      - { name: payload, type: object, source: input, default: null, description: "Label payload; its key set must equal the spec unit field_schema key set exactly" }
      - { name: committed_value, type: string, source: computed, default: null, description: "Canonical string of the payload's first schema field value; null when abstained is true" }
      - { name: value_group_rank, type: integer, source: computed, default: null, description: "1-based rank of this commit's value group under the modal policy, sized DESC then by the group's minimum dispatch_rank ASC" }
      - { name: is_modal_agent, type: boolean, source: computed, default: false, description: "True for the single member of the winning value group carrying that group's minimum dispatch_rank" }
      - { name: is_superseded, type: boolean, source: computed, default: false, description: "True once a rework round replaced this member's answer" }
      - { name: instructions_ack, type: boolean, source: input, default: false, description: "Worker acknowledgement of the instruction document; must be true for every commit" }
      - { name: abstained, type: boolean, source: input, default: false, description: "True when the member declines to label; an abstaining member leaves the agreement denominator" }
      - { name: dispatched_at, type: datetime, source: system, description: "Instant the assignment was dispatched" }
      - { name: commit_deadline_at, type: datetime, source: system, description: "= dispatched_at plus the owning program commit_deadline_seconds" }
      - { name: gold_outcome, type: enum, source: system, default: null, description: "Recorded gold audit outcome; null for PRODUCTION commits and for audits not yet graded", constraints: "one of PASSED, FLAGGED, FAILED, EXCLUDED_FROM_ACCURACY, null" }
      - { name: expected_value, type: string, source: system, default: null, description: "Customer ground truth inherited from the selected committed anchor payload of this audit" }
      - { name: eligible_outcomes, type: array, source: system, default: null, description: "Outcome vocabulary of this audit family; SAFETY_CLASSIFICATION adds FLAGGED to the base vocabulary" }
      - { name: selected_anchor_commit_id, type: string, source: system, default: null, description: "The committed panel member whose payload supplied expected_value; a server-side reference, never client supplied" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Accepted payout in cents; 0 until a payout record is accepted" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "Payment lifecycle of this assignment", constraints: "one of UNPAID, PENDING, ACCEPTED, REVERSED" }
      - { name: payment_capped, type: boolean, source: computed, default: false, description: "True when the weekly ceiling, not the formula, bound the accepted amount" }
      - { name: week_epoch_index, type: integer, source: system, default: null, description: "Week epoch the payment was accepted in; the weekly ceiling applies per worker and epoch" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "Assignment lifecycle", constraints: "one of DISPATCHED, COMMITTED, ABSTAINED, COMMIT_EXPIRED" }

  - name: WorkerIdentity
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Immutable workforce handle; unique across the workforce and used for deterministic scoring" }
      - { name: display_name, type: string, source: input, required: false, description: "Optional display name" }
      - { name: payout_currency, type: enum, source: input, default: USD, description: "Currency every accepted payment and settlement is denominated in", constraints: "one of USD, MXN, PHP, VND, BRL, INR" }
      - { name: settlement_min_cents, type: integer, source: input, default: 1000, description: "Minimum worker_receivable_cents required before a settlement request is accepted" }
      - { name: lifetime_earned_cents, type: integer, source: computed, default: 0, description: "Monotonic sum of accepted payout amounts for this worker; never decremented, not even by a reversal" }
      - { name: worker_receivable_cents, type: integer, source: computed, default: 0, description: "Conserved quantity Q_worker: sum of accepted payouts minus settled cents plus reversed cents; never negative" }
      - { name: restricted, type: boolean, source: computed, default: false, description: "True while any ConfidentialityIncident naming this worker has status OPEN" }
      - { name: total_accepted_payout_cents, type: integer, source: computed, default: 0, description: "Sum of accepted payout amounts over all epochs; the settlement ceiling is measured against it" }

  - name: WorkerQualification
    parent: WorkerIdentity
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> WorkerIdentity.id; the worker this qualification belongs to" }
      - { name: language_code, type: enum, source: input, description: "Language this qualification covers; unique per worker and language pair", constraints: "one of es-MX, en-US, vi-VN, tl-PH, pt-BR, ta-IN, hi-IN" }
      - { name: tier, type: enum, source: input, default: NOVICE, description: "Declared skill tier; sets the minimum qualification score", constraints: "one of NOVICE, PROFICIENT, EXPERT" }
      - { name: qualification_score, type: integer, source: computed, default: 0, description: "= 5000 + ((len(handle) * 977 + sum of handle character codes * 31 + sum of language code character codes * 17) mod 5000); a deterministic integer in the range 5000 to 9999" }
      - { name: tier_min_score, type: integer, source: computed, default: 5000, description: "5000 for NOVICE, 6500 for PROFICIENT, 8000 for EXPERT" }
      - { name: tier_multiplier, type: number, source: computed, default: 1.0, description: "1.0 for NOVICE, 1.25 for PROFICIENT, 1.5 for EXPERT" }
      - { name: gold_audits_dispatched, type: integer, source: system, default: 0, description: "Count of GOLD commits ever dispatched to this qualification" }
      - { name: gold_denominator_count, type: integer, source: computed, default: 0, description: "Count of gold audits on this qualification graded PASSED or FAILED" }
      - { name: accepted_gold_count, type: integer, source: computed, default: 0, description: "Count graded PASSED" }
      - { name: provisional_gold_count, type: integer, source: computed, default: 0, description: "Count graded PASSED or FLAGGED" }
      - { name: accuracy_pct, type: number, source: computed, default: 0, description: "Accepted variant: 100 * accepted_gold_count / gold_denominator_count, rounded to 2 decimals, 0 when the denominator is 0" }
      - { name: provisional_accuracy_pct, type: number, source: computed, default: 0, description: "Provisional variant: 100 * provisional_gold_count / gold_denominator_count; always at or above accuracy_pct" }
      - { name: training_passed_count, type: integer, source: system, default: 0, description: "Training tasks passed on this qualification" }
      - { name: training_required_count, type: integer, source: input, default: 3, description: "Training tasks that must pass before the qualification may be verified" }
      - { name: gold_fail_streak, type: integer, source: system, default: 0, description: "Consecutive FAILED gold audits since the last non-FAILED grade on this qualification" }
      - { name: restricted_accessible, type: boolean, source: computed, default: false, description: "True while tier is EXPERT and status is QUALIFIED; required for RESTRICTED sensitivity routing" }
      - { name: status, type: enum, source: system, default: IN_TRAINING, description: "Cyclic qualification lifecycle driven by gold audit streaks", constraints: "one of IN_TRAINING, QUALIFIED, PROBATION, SUSPENDED, REVOKED" }

  - name: ConfidentialityIncident
    parent: WorkerIdentity
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "The engagement whose dataset was exposed, resolved as the CustomerProgram whose program_code equals the submitted program_code" }
      - { name: worker_id, type: string, source: system, description: "FK -> WorkerIdentity.id; the worker under report" }
      - { name: category, type: enum, source: input, description: "Breach family", constraints: "one of PII_EXPOSURE, DATASET_DOWNLOAD, SCREEN_RECORDING, UNAUTHORIZED_SHARE" }
      - { name: severity, type: enum, source: input, description: "Breach severity; MAJOR or CATASTROPHIC restricts the program and the worker", constraints: "one of MINOR, MAJOR, CATASTROPHIC" }
      - { name: description_text, type: string, source: input, description: "Free-text description of the observed breach" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Incident lifecycle", constraints: "one of OPEN, RESOLVED, DISMISSED" }

  - name: AppealClaim
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "The engagement the disputed piece belongs to, resolved as the CustomerProgram owning the item via item -> spec_unit -> program and never client supplied" }
      - { name: item_id, type: string, source: system, description: "The disputed piece, resolved as the LabelingItem whose id equals the submitted item_id" }
      - { name: worker_id, type: string, source: system, description: "The appealing worker, resolved as the WorkerIdentity whose id equals the submitting X-User-ID" }
      - { name: spec_unit_id, type: string, source: system, description: "The SpecUnit of the disputed piece, denormalized from the resolved LabelingItem" }
      - { name: grounds, type: enum, source: input, description: "Appeal grounds; only AMBIGUOUS_INSTRUCTIONS qualifies a later outcome as compensating", constraints: "one of AMBIGUOUS_INSTRUCTIONS, INSUFFICIENT_CONTEXT, TECHNICAL_ERROR" }
      - { name: statement_text, type: string, source: input, description: "The worker's explanation of the dispute" }
      - { name: requested_reviewer_id, type: string, source: input, required: false, description: "Preferred reviewer; a preference only and never binding on the adjudicator assignment" }
      - { name: adjudicator_id, type: string, source: system, default: null, description: "Opaque operator id of the reviewer who filed the proposal; null until the claim is PROPOSED" }
      - { name: proposed_outcome, type: enum, source: system, default: null, description: "Compensation the reviewer proposes; null in ADVOCACY and ADJUDICATION", constraints: "one of PAY_REVERSAL, QUALIFICATION_RESET, OUTCOME_STANDS, null" }
      - { name: revised_amount_cents, type: integer, source: system, default: null, description: "Amount returned to the worker by a PAY_REVERSAL concurrence; null for every other ground or outcome" }
      - { name: lock_reason, type: string, source: system, default: null, description: "Set to REVIEWER_SUSPENSION when the claim terminates in that state; informational only" }
      - { name: consensus_outcome, type: enum, source: system, default: null, description: "Filled only when the claim terminates DEADLOCKED; null everywhere else", constraints: "one of UPHELD, DENIED, DEADLOCKED, null" }
      - { name: status, type: enum, source: system, default: ADVOCACY, description: "Appeal lifecycle; ADJUDICATION is the reviewer to reviewer cycle and REVIEWER_SUSPENSION is terminal", constraints: "one of ADVOCACY, PROPOSED, CONCURRENCE, ADJUDICATION, ACCEPTED, REVIEWER_SUSPENSION, REJECTED, DEADLOCK" }

  - name: WeekEpoch
    parent: null
    common_fields: true
    fields:
      - { name: index, type: integer, source: system, description: "0-based week index; unique across the table" }
      - { name: name, type: string, source: input, required: false, description: "Optional human label for the week" }
      - { name: starts_at_utc, type: datetime, source: input, description: "Week start in UTC; the first epoch created by the advance endpoint uses the supplied instant" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Only one epoch is OPEN at any time", constraints: "one of OPEN, CLOSED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: CustomerProgram
    initial_state: DRAFT
    terminal_states: [FROZEN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /labor-programs/{program_id}/open-program"
        actor: PlatformAdmin
        preconditions:
          - "the program has at least one SpecUnit whose status is in DRAFT or ACTIVE"
        side_effects:
          - "CustomerProgram.status := ACTIVE"
          - "CustomerProgram.version incremented by 1"
          - "every SpecUnit under the program with status DRAFT whose parent_unit_id is null and which already satisfies the unit activation gates (instruction_status PUBLISHED, edge_case_count 0 when has_edge_case_guidance is true, coverage window clear of the blackout) transitions to status := ACTIVE and piece_status := IN_PRODUCTION; a unit that fails a gate stays DRAFT"
          - "for each such unit the piece_status change cascades to its attached LabelingItem rows in status DRAFT, which transition to item_status := PENDING and status := RELEASED"
      - from: ACTIVE
        to: QUALITY_EMBARGO
        trigger: "system event raised when a payout record is accepted on this program"
        actor: system
        preconditions:
          - "the program accepted_accuracy_pct is strictly below accuracy_floor_pct"
          - "the program accuracy_denominator_count is at least 1, so an empty denominator never triggers the embargo"
        side_effects:
          - "CustomerProgram.status := QUALITY_EMBARGO"
          - "CustomerProgram.version incremented by 1"
          - "every SpecUnit under the program with status ACTIVE transitions to piece_status := REWORK and increments its own version by 1"
          - "for each such unit every attached LabelingItem with consensus_status AWAITING_CONSENSUS transitions to consensus_status := REWORK, item_status := REWORK, and rework_cycles incremented by 1"
          - "each of those items has rework_started_at set to the current logical clock"
        note: "Depth-3 hop chain: the payout acceptance is hop 1, the program embargo is hop 2, the unit rework sweep is hop 3, and the item consensus demotion is hop 3's own child mutation."
      - from: QUALITY_EMBARGO
        to: ACTIVE
        trigger: "POST /labor-programs/{program_id}/recall-and-raise-quality"
        actor: PlatformAdmin
        preconditions:
          - "the program accepted_accuracy_pct is at or above accuracy_floor_pct"
        side_effects:
          - "CustomerProgram.status := ACTIVE"
          - "CustomerProgram.version incremented by 1"
          - "operational_restricted and open_incident_count recomputed from the program's unresolved incidents"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /labor-programs/{program_id}/freeze"
        actor: PlatformAdmin
        preconditions:
          - "no SpecUnit under the program has piece_status CONSENSUS"
        side_effects:
          - "CustomerProgram.status := FROZEN"
          - "CustomerProgram.version incremented by 1"
          - "every SpecUnit under the program transitions to status := REJECTED and piece_status := REJECTED"
          - "every LabelingItem under those units transitions to status := RESOLVED, item_status := COMPLETED and consensus_status := REJECTED, and increments its own version by 1"
          - "every Commit on those items still in DISPATCHED transitions to status := COMMIT_EXPIRED"
      - from: QUALITY_EMBARGO
        to: FROZEN
        trigger: "POST /labor-programs/{program_id}/freeze"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "the same cascade as the ACTIVE to FROZEN transition applies"

  - entity: SpecUnit
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /labor-programs/spec-units/{unit_id}/activate-unit"
        actor: PlatformAdmin
        preconditions:
          - "the parent program status is in {ACTIVE, QUALITY_EMBARGO}"
          - "the parent program status is not FROZEN"
          - "every unit whose parent_unit_id equals this unit's id has status in {ACTIVE, COMPLETE}"
          - "this unit instruction_status is PUBLISHED"
          - "edge_case_count is 0 whenever has_edge_case_guidance is true"
          - "the unit coverage window does not overlap the program blackout window under the half-open rule"
        side_effects:
          - "SpecUnit.status := ACTIVE"
          - "SpecUnit.piece_status := IN_PRODUCTION"
          - "SpecUnit.version incremented by 1"
          - "every attached LabelingItem still in status DRAFT transitions to status := RELEASED"
      - from: ACTIVE
        to: COMPLETE
        trigger: "automatic system transition driven by the consensus resolver"
        actor: system
        preconditions:
          - "every LabelingItem attached to the unit has consensus_status in {CERTIFIED, REJECTED}"
          - "at least one attached item has consensus_status CERTIFIED"
          - "every COMMITTED commit on the unit's items is paid, so payout_complete is true on each certified item"
        side_effects:
          - "SpecUnit.status := COMPLETE"
          - "SpecUnit.piece_status := CERTIFIED"
          - "SpecUnit.certified_item_count recomputed as the count of attached items whose consensus_status is CERTIFIED"
          - "SpecUnit.unit_accuracy_pct and unit_provisional_accuracy_pct recomputed over the unit's gold-audited items"
          - "CustomerProgram.demand_points recomputed from unit_effective_points, and capacity_requirement_points, capacity_feasible and projected_miss_deadline recomputed with it"
          - "CustomerProgram.accepted_accuracy_pct, provisional_accuracy_pct and on_time recomputed"
        note: "Bubble up by three hops: the panel resolver certifies the last child item, the unit completes as a consequence, the program's demand and accuracy metrics then recompute."
      - from: COMPLETE
        to: ACTIVE
        trigger: "POST /labor-programs/spec-units/{unit_id}/reopen-unit"
        actor: PlatformAdmin
        preconditions:
          - "the parent program status is in {ACTIVE, QUALITY_EMBARGO}"
          - "at least one attached item has consensus_status REWORK"
        side_effects:
          - "SpecUnit.status := ACTIVE"
          - "SpecUnit.piece_status := REWORK"
          - "SpecUnit.version incremented by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "system event raised by the program freeze cascade"
        actor: system
        preconditions:
          - "the owning program transitioned to FROZEN"
        side_effects:
          - "SpecUnit.status := REJECTED"
      - from: COMPLETE
        to: REJECTED
        trigger: "system event raised by the program freeze cascade"
        actor: system
        preconditions:
          - "the owning program transitioned to FROZEN"
        side_effects:
          - "SpecUnit.status := REJECTED"

  - entity: LabelingItem
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "system event raised by the unit activation cascade"
        actor: system
        preconditions:
          - "the owning SpecUnit transitioned DRAFT to ACTIVE"
        side_effects:
          - "LabelingItem.status := RELEASED"
          - "LabelingItem.item_status := PENDING"
          - "LabelingItem.item_seq assigned as the next insertion sequence inside the unit"
      - from: PENDING
        to: ROUTED
        trigger: "POST /labor-programs/labeling-items/{item_id}/dispatch-panel"
        actor: PlatformAdmin
        preconditions:
          - "the owning SpecUnit status is ACTIVE"
          - "the owning SpecUnit piece_status is in {IN_PRODUCTION, CONSENSUS, REWORK}"
          - "required_units is at least 1"
          - "the count of certified items in the unit is at or above required_units minus 1, so the release does not publish a zero detection gap"
          - "the owning program operational_restricted is false"
          - "gold_rotation is false"
          - "the candidate pool of calculations.worker_selection is non-empty"
        side_effects:
          - "LabelingItem.status := IN_PANEL"
          - "LabelingItem.item_status := IN_REVIEW"
          - "LabelingItem.consensus_status := AWAITING_CONSENSUS"
          - "the selector is evaluated once for this dispatch and one Commit row per selected member is created with status DISPATCHED, kind PRODUCTION, dispatch_rank set from the ranked order, dispatched_at set to the current logical clock and commit_deadline_at set to dispatched_at plus the program commit_deadline_seconds"
          - "SpecUnit.version incremented by 1"
      - from: ROUTED
        to: COMPLETED
        trigger: "automatic system transition driven by the consensus resolver"
        actor: system
        preconditions:
          - "the piece has at least one non-abstaining committed assignment"
        side_effects:
          - "when non_abstaining_commit_count is at or above the program commitment_quorum and agreement_ratio is at or above min_consensus_agreement: consensus_status := CERTIFIED, modal_label and agreement_ratio are stamped, value_group_rank and is_modal_agent are stamped on every committed member, and status := RESOLVED with item_status := COMPLETED"
          - "when non_abstaining_commit_count is at or above the quorum and agreement_ratio is strictly below min_consensus_agreement: consensus_status := HELD_QUORUM and holds_quorum := true, status stays IN_PANEL and item_status stays IN_REVIEW"
          - "when non_abstaining_commit_count is strictly below the quorum and the hold window has NOT expired: consensus_status stays AWAITING_CONSENSUS and the piece waits"
          - "when non_abstaining_commit_count is strictly below the quorum and the elapsed seconds since the first commit is at or above the program patience_seconds: consensus_status := REJECTED, holds_quorum := false, status := RESOLVED and item_status := COMPLETED"
          - "when SpecUnit.frozen_revision is null at the moment a piece first reaches CERTIFIED: frozen_revision := the minimum of this piece's instruction_revision and the instruction_revision of every other item attached to the unit, so a later activation cannot drag the pinned revision backwards"
        note: "Branching resolution selected by committed count and agreement ratio rather than by any single member's answer; the HELD_QUORUM branch is the drop-out fork and the CERTIFIED branch is the join."
      - from: COMPLETED
        to: REWORK
        trigger: "POST /labor-programs/labeling-items/{item_id}/open-rework"
        actor: PlatformReviewer
        preconditions:
          - "the piece consensus_status is CERTIFIED or HELD_QUORUM"
          - "rework_cycles is strictly below rework_round_limit"
          - "the acting reviewer holds no commit on this piece"
        side_effects:
          - "LabelingItem.consensus_status := REWORK"
          - "LabelingItem.item_status := REWORK"
          - "LabelingItem.status := IN_PANEL"
          - "LabelingItem.rework_cycles incremented by 1"
          - "LabelingItem.rework_started_at := current logical clock"
          - "LabelingItem.gold_audits_this_week := 0, because the rework epoch resets the weekly gold rotation counter"
          - "LabelingItem.version incremented by 1"
          - "the lowest ranked member of the winning value group is marked is_superseded and the piece is re-dispatched to one fresh member drawn from calculations.worker_selection with dispatch_rank equal to the incremented rework_cycles plus panel_size"
      - from: REWORK
        to: COMPLETED
        trigger: "POST /labor-programs/labeling-items/{item_id}/submit-rework"
        actor: Worker
        preconditions:
          - "the acting worker_id is the owner of the superseded commit"
          - "rework_window_remaining_seconds is strictly greater than 0"
          - "the revised payload key set equals the unit field_schema key set"
        side_effects:
          - "the superseded commit is replaced in place, its is_superseded flag cleared and its committed_value refreshed"
          - "consensus_value_groups is re-evaluated over the refreshed member set"
          - "when the refreshed modal value equals the modal value of the previous round: consensus_status := CERTIFIED and the piece rejoins the previous value as though it had never moved"
          - "when the refreshed modal value differs: consensus_status := HELD_QUORUM and holds_quorum := true, routing the disagreement to a reviewer"
          - "LabelingItem.version incremented by 1"
      - from: REWORK
        to: REWORK
        trigger: "system event raised by the automatic rework timeout sweep"
        actor: system
        preconditions:
          - "rework_window_remaining_seconds is at or below 0, meaning the elapsed time since rework_started_at is at or above rework_window_seconds"
          - "rework_cycles is strictly below rework_round_limit"
        side_effects:
          - "rework_cycles incremented by 1"
          - "rework_started_at := current logical clock"
          - "the superseded commit is restored with is_superseded cleared"
          - "LabelingItem.version incremented by 1"
      - from: REWORK
        to: COMPLETED
        trigger: "system event raised by the automatic rework timeout sweep when the round limit is reached"
        actor: system
        preconditions:
          - "rework_window_remaining_seconds is at or below 0"
          - "rework_cycles is at the rework_round_limit"
        side_effects:
          - "consensus_status := REJECTED"
          - "holds_quorum := false"
          - "status := RESOLVED and item_status := COMPLETED"
          - "SpecUnit.piece_status := REJECTED when every attached item has been rejected"

  - entity: Commit
    initial_state: DISPATCHED
    terminal_states: [COMMITTED, ABSTAINED, COMMIT_EXPIRED]
    transitions:
      - from: DISPATCHED
        to: COMMITTED
        trigger: "POST /labor-programs/commits/{commit_id}/commit-label"
        actor: Worker
        preconditions:
          - "the acting worker_id equals Commit.worker_id"
          - "the current logical clock is strictly before commit_deadline_at"
          - "instructions_ack is true"
          - "the payload key set equals the unit field_schema key set"
          - "abstained is false"
        side_effects:
          - "Commit.status := COMMITTED"
          - "committed_value, value_group_rank and is_modal_agent computed by calculations.consensus_value_groups"
          - "LabelingItem.non_abstaining_commit_count recomputed"
          - "the consensus resolver is re-evaluated for the piece"
      - from: DISPATCHED
        to: ABSTAINED
        trigger: "POST /labor-programs/commits/{commit_id}/commit-label"
        actor: Worker
        preconditions:
          - "the acting worker_id equals Commit.worker_id"
          - "abstained is true"
        side_effects:
          - "Commit.status := ABSTAINED"
          - "committed_value := null"
          - "LabelingItem.non_abstaining_commit_count recomputed, leaving the abstainer out of the denominator"
      - from: DISPATCHED
        to: COMMIT_EXPIRED
        trigger: "system event raised by the program freeze cascade"
        actor: system
        preconditions:
          - "the owning program transitioned to FROZEN"
        side_effects:
          - "Commit.status := COMMIT_EXPIRED"
          - "LabelingItem.non_abstaining_commit_count recomputed"

  - entity: WorkerQualification
    initial_state: IN_TRAINING
    terminal_states: [REVOKED]
    transitions:
      - from: IN_TRAINING
        to: QUALIFIED
        trigger: "POST /labor-programs/worker-qualifications/{qualification_id}/verify-qualification"
        actor: PlatformAdmin
        preconditions:
          - "training_passed_count is at least training_required_count"
          - "qualification_score is at or above tier_min_score"
          - "the owning worker has no open ConfidentialityIncident"
        side_effects:
          - "WorkerQualification.status := QUALIFIED"
          - "restricted_accessible := true when tier is EXPERT and status is QUALIFIED"
      - from: PROBATION
        to: QUALIFIED
        trigger: "POST /labor-programs/worker-qualifications/{qualification_id}/verify-qualification"
        actor: PlatformAdmin
        preconditions:
          - "training_passed_count is at least training_required_count"
          - "the qualification was rehabilitated in an earlier week epoch, so the current program week index differs from the epoch of the last rehabilitation"
        side_effects:
          - "WorkerQualification.status := QUALIFIED"
          - "gold_fail_streak := 0"
      - from: QUALIFIED
        to: PROBATION
        trigger: "system event raised when a gold audit is graded FAILED"
        actor: system
        preconditions:
          - "the resulting gold_fail_streak is at least 2"
        side_effects:
          - "WorkerQualification.status := PROBATION"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /labor-programs/worker-qualifications/{qualification_id}/reset-qualification"
        actor: PlatformReviewer
        preconditions:
          - "a ConfidentialityIncident naming the qualification owner exists with status OPEN"
        side_effects:
          - "WorkerQualification.status := SUSPENDED"
          - "gold_fail_streak := 0"
          - "every Commit of that worker still in DISPATCHED on a non-terminal item is withdrawn by decrementing LabelingItem.non_abstaining_commit_count and returning the piece to AWAITING_CONSENSUS when the withdrawn assignment was the last outstanding one"
      - from: SUSPENDED
        to: IN_TRAINING
        trigger: "POST /labor-programs/worker-qualifications/{qualification_id}/reset-qualification"
        actor: PlatformReviewer
        preconditions:
          - "training_passed_count is strictly below training_required_count"
        side_effects:
          - "WorkerQualification.status := IN_TRAINING"
          - "training_passed_count := 0"
      - from: IN_TRAINING
        to: REVOKED
        trigger: "system event raised when the deterministic qualification score is below the declared tier minimum"
        actor: system
        preconditions:
          - "qualification_score is strictly below tier_min_score"
        side_effects:
          - "WorkerQualification.status := REVOKED"
          - "every uncommitted Commit on this qualification is withdrawn"

  - entity: AppealClaim
    initial_state: ADVOCACY
    terminal_states: [ACCEPTED, REVIEWER_SUSPENSION, REJECTED, DEADLOCK]
    transitions:
      - from: ADVOCACY
        to: PROPOSED
        trigger: "POST /labor-programs/appeal-cases/{case_id}/review-appeal"
        actor: PlatformReviewer
        preconditions:
          - "the acting reviewer holds no commit on the disputed piece"
        side_effects:
          - "AppealClaim.status := PROPOSED"
          - "adjudicator_id := the acting reviewer's X-User-ID"
          - "proposed_outcome := the submitted outcome"
          - "when grounds is AMBIGUOUS_INSTRUCTIONS and proposed_outcome is PAY_REVERSAL: revised_amount_cents := the disputed commit's paid_amount_cents"
      - from: PROPOSED
        to: CONCURRENCE
        trigger: "POST /labor-programs/appeal-cases/{case_id}/concur"
        actor: PlatformReviewer
        preconditions:
          - "the acting reviewer's X-User-ID differs from adjudicator_id"
          - "the acting reviewer holds no commit on the disputed piece"
          - "the proposed_outcome is PAY_REVERSAL and grounds is AMBIGUOUS_INSTRUCTIONS"
        side_effects:
          - "AppealClaim.status := CONCURRENCE"
          - "the disputed commit payment_status moves from ACCEPTED to REVERSED"
          - "the disputed worker worker_receivable_cents incremented by revised_amount_cents"
          - "the disputed worker lifetime_earned_cents is left unchanged, so the reversal is compensating rather than a rewinding of lifetime earnings"
          - "the disputed qualification gold_fail_streak := 0"
          - "the disputed piece consensus_status := REWORK and rework_cycles incremented by 1, with rework_started_at set to the current logical clock"
      - from: CONCURRENCE
        to: ACCEPTED
        trigger: "automatic system transition raised by the concurrence"
        actor: system
        preconditions:
          - "the concurrence completed without disagreement"
        side_effects:
          - "AppealClaim.status := ACCEPTED"
          - "the disputed piece is returned to the panel under the re-dispatch rules"
      - from: PROPOSED
        to: ADJUDICATION
        trigger: "POST /labor-programs/appeal-cases/{case_id}/escalate-appeal"
        actor: PlatformReviewer
        preconditions:
          - "the acting reviewer's X-User-ID differs from adjudicator_id"
          - "the proposed_outcome is QUALIFICATION_RESET"
        side_effects:
          - "AppealClaim.status := ADJUDICATION"
          - "the claim joins the reviewer to reviewer cycle"
      - from: ADJUDICATION
        to: CONCURRENCE
        trigger: "POST /labor-programs/appeal-cases/{case_id}/concur"
        actor: PlatformReviewer
        preconditions:
          - "the acting reviewer holds no commit on the disputed piece"
          - "the proposed_outcome is QUALIFICATION_RESET"
        side_effects:
          - "AppealClaim.status := CONCURRENCE"
          - "the disputed qualification gold_fail_streak := 0"
      - from: ADJUDICATION
        to: PROPOSED
        trigger: "POST /labor-programs/appeal-cases/{case_id}/escalate-appeal"
        actor: PlatformReviewer
        preconditions:
          - "the acting reviewer's X-User-ID differs from adjudicator_id"
        side_effects:
          - "AppealClaim.status := PROPOSED"
          - "adjudicator_id := the acting reviewer's X-User-ID"
          - "proposed_outcome := the resubmitted outcome and revised_amount_cents recomputed for the new outcome"
      - from: ADJUDICATION
        to: REVIEWER_SUSPENSION
        trigger: "POST /labor-programs/appeal-cases/{case_id}/suspend-case"
        actor: PlatformAdmin
        preconditions:
          - "the claim has spent at least one full patience_seconds window in ADJUDICATION without agreement"
        side_effects:
          - "AppealClaim.status := REVIEWER_SUSPENSION"
          - "lock_reason := REVIEWER_SUSPENSION"
          - "the disputed piece is frozen with its outcome unchanged and holds_quorum := true"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /labor-programs/appeal-cases/{case_id}/withdraw-appeal"
        actor: Worker
        preconditions:
          - "the acting worker_id equals the claim's worker_id"
          - "the claim is still within one patience_seconds window of filing"
        side_effects:
          - "AppealClaim.status := REJECTED"
          - "lock_reason := null and no payment or qualification mutation is applied"
      - from: ADJUDICATION
        to: DEADLOCK
        trigger: "automatic system transition raised by the appeal deadlock sweep"
        actor: system
        preconditions:
          - "the elapsed seconds since the claim entered ADJUDICATION is at or above patience_seconds"
          - "no concurrence was recorded"
        side_effects:
          - "AppealClaim.status := DEADLOCK"
          - "consensus_outcome := DEADLOCKED"
          - "the disputed piece is released with its outcome unchanged and holds_quorum := false"

# =============================================================================
# §1.2.1 Concurrency Rules — true races only, resolved by OCC
# =============================================================================
concurrency_rules:
  - rule_id: spec-unit-create-stale-program
    parent_entity: CustomerProgram
    write_endpoint: "POST /labor-programs/{program_id}/spec-units"
    occ_field: "expected_program_version"
    description: |
      Creating a SpecUnit under a CustomerProgram whose version has advanced
      since the client last observed it is rejected. This captures the case
      where an embargo, reopen or freeze cascade has just moved the program
      and every one of its units, so a decomposition submitted against the
      stale snapshot would resurrect a superseded structure.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: gold-grade-stale-item
    parent_entity: LabelingItem
    write_endpoint: "POST /labor-programs/gold-audits/{gold_audit_id}/grade-audit"
    occ_field: "expected_item_version"
    description: |
      Grading a gold audit against a LabelingItem whose version has advanced
      since the reviewer last observed it is rejected. This captures the case
      where the audited piece was re-dispatched onto a new instruction
      revision between the reviewer's read and the grade submission, so the
      reviewer's view of the piece is stale and the grade would be attributed
      to the wrong revision.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appeal-concur-stale-claim
    parent_entity: AppealClaim
    write_endpoint: "POST /labor-programs/appeal-cases/{case_id}/concur"
    occ_field: "expected_claim_version"
    description: |
      Concurring on an AppealClaim whose version has advanced since the
      reviewer last observed it is rejected. This captures the case where the
      claim was escalated to adjudication or withdrawn between the reviewer's
      read and the concurrence, so the reviewer would otherwise be concurring
      with a proposal the claim no longer carries.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: worker_selection
    trigger: "on POST /api/items/{item_id}/dispatch-panel"
    algorithm: selector_policy
    formula: |
      ELIGIBLE(q, program) :=
            q.language_code == program.language_code
        AND q.status IN {QUALIFIED, PROBATION}
        AND q.qualification_score >= TIER_MIN[q.tier]
        AND program.sensitivity_class != RESTRICTED -> q.restricted_accessible == true
        AND the owning WorkerIdentity.restricted == false
        AND q.worker_id NOT IN {owners of existing Commit rows on this item}
        AND q.worker_id NOT IN {owners of the item's previous rework revisions}
        AND the candidate holds no DISPATCHED commit whose closed dispatch-to-deadline interval touches or overlaps this dispatch's interval
      RANK(q) := sort by (-q.accuracy_pct ASC, q.qualification_score DESC, q.created_at ASC)
      SELECT(q) := ELIGIBLE(q) AND (q.gold_denominator_count < 3 OR q.accuracy_pct >= 60.0)
      # the cold-start exemption keeps a brand new qualification routable until it has three graded audits
      candidates := every qualification with language_code == program.language_code satisfying SELECT
      selected := the first panel_size members of candidates in RANK order
      if candidates is empty -> ERR_NO_ELIGIBLE_WORKER
      if candidates holds fewer than panel_size members -> ERR_WORKER_LANE_CONFLICT
    input_set: "WorkerQualification rows whose language_code equals the program language_code; the acting worker is never a candidate because the dispatch itself is admin-driven and the panel excludes existing assignment owners"
    constants:
      TIER_MIN: { NOVICE: 5000, PROFICIENT: 6500, EXPERT: 8000 }
      MIN_ACCURACY_PCT: 60.0
      TIE_BREAK: "earliest WorkerQualification.created_at"
    precision: "accuracy_pct compared at 2 decimal places; qualification_score is an exact integer"
    note: "Tie-break uses created_at ASC, never the server-minted id. When the pool holds fewer eligible members than panel_size, every member is dispatched and the piece simply waits longer for quorum."
    variants:
      - name: provisional_ranking
        when: "the program accuracy_denominator_count is strictly below 3, meaning the engagement is cold-starting"
        difference: "RANK's first key becomes -q.provisional_accuracy_pct instead of -q.accuracy_pct, so a cold-start engagement orders the pool differently and may pick a different panel from identical worker data"

  - name: consensus_value_groups
    trigger: "on POST /api/commits/{commit_id}/commit-label and on every re-evaluation by the consensus resolver"
    algorithm: chronological
    formula: |
      N := count of Commit rows on the item with status COMMITTED and abstained false
      groups := those rows bucketed by committed_value
      group.size := member count
      group.min_rank := minimum Commit.dispatch_rank over the group members
      modal := the group maximising (size DESC, then group.min_rank ASC)
      modal_group_size := modal.size
      agreement_ratio := (N == 0) ? 0.0 : round_half_up(modal_group_size / N, 4)
      value_group_rank := 1-based rank of this commit's group under (size DESC, then group.min_rank ASC)
      is_modal_agent := this commit is the member of the modal group carrying that group's minimum dispatch_rank
      abstainers are excluded from N entirely, so an abstaining member can never lower agreement_ratio
    input_set: "Commit rows with status COMMITTED and abstained false; DISPATCHED, ABSTAINED and COMMIT_EXPIRED rows sit outside both the numerator and the denominator"
    precision: "agreement_ratio rounded to 4 decimal places, round_half_up"
    note: "Order sensitivity is resolved without any random field: the tie-break is the integer dispatch_rank assigned by calculations.worker_selection at dispatch time, so a panel whose members share a created_at still has a deterministic modal agent."

  - name: accepted_unit_amount
    trigger: "on POST /api/commits/{commit_id}/payout-records"
    algorithm: tiered_pricing
    formula: |
      BASE := (commit.kind == GOLD) ? GOLD_BASE_RATE : BASE_RATE
      m_streak := STREAK_MULT[qualification.gold_fail_streak]        # 0 -> 1.0, 1 -> 1.0, 2 -> 0.8, >=3 -> 0.5
      m_tier   := TIER_MULT[qualification.tier]                      # NOVICE -> 1.0, PROFICIENT -> 1.25, EXPERT -> 1.5
      UNROUNDED := BASE * m_streak * m_tier
      UNCAPPED  := round_half_up(UNROUNDED)                          # the single rounding site
      settled   := sum of paid_amount_cents over Commit rows already in payment_status ACCEPTED for
                   this worker and this week epoch
      REMAINING := max(0, program.weekly_earning_cap_cents - settled)
      amount_cents := min(UNCAPPED, REMAINING)
      capped := UNCAPPED > REMAINING
    input_set: "the commit named by the path; its qualification is the WorkerQualification matching (commit.worker_id, owning program language_code); the week epoch is the single OPEN WeekEpoch row"
    constants:
      BASE_RATE: 6
      GOLD_BASE_RATE: 9
      TIER_MULT: { NOVICE: 1.0, PROFICIENT: 1.25, EXPERT: 1.5 }
      STREAK_MULT: { 0: 1.0, 1: 1.0, 2: 0.8, 3: 0.5 }
    precision: "integer cents; the product is rounded exactly once, with round_half_up, and the ceiling clamp is applied after that single rounding"
    note: "Rounding order is pinned: multiply by the streak factor, then by the tier factor, round ONCE, then clamp to the weekly remainder. Rounding after each factor is a different and wrong answer."
    variants:
      - name: provisional_estimate
        when: "GET /api/worker-qualifications/{qualification_id} with an earnings variant of PROVISIONAL"
        difference: |
          An extra decay factor LP = max(0.5, 1 - floor(lifetime_earned_cents / 10000) * 0.05) is multiplied in
          BEFORE the tier factor, so the same commit prices differently once the worker crosses a lifetime
          10000-cent step. A PROFICIENT worker with 0 lifetime cents earns 6 * 1.0 * 1.25 = 7.5 -> 8 on a
          production commit, while the same worker at 10000 lifetime cents earns round_half_up(6 * 1.0 * 0.95 * 1.25)
          = round_half_up(7.125) = 7 -- a one-cent divergence that does not exist under the base variant.

  - name: program_accuracy
    trigger: "on every gold audit grade and on every unit completion"
    algorithm: weighted_scoring
    formula: |
      denominator := count of GOLD commits on the program's items whose gold_outcome IN {PASSED, FAILED}
      accepted_numerator    := count of those with gold_outcome == PASSED
      provisional_numerator := count of those with gold_outcome IN {PASSED, FLAGGED}
      accepted_accuracy_pct    := (denominator == 0) ? 0.0 : round_half_up(100 * accepted_numerator    / denominator, 2)
      provisional_accuracy_pct := (denominator == 0) ? 0.0 : round_half_up(100 * provisional_numerator / denominator, 2)
    input_set: "GOLD commits on the program's items; gold_outcome EXCLUDED_FROM_ACCURACY and an ungraded gold_outcome of null are both outside the denominator, so cataloguing an audit removes it from both variants"
    precision: "2 decimal places, round_half_up"
    note: "selected_anchor_commit_id pins which committed member supplied expected_value, so the ground truth is reproducible and independent of arrival order."
    variants:
      - name: accepted
        when: "the feasibility gate, the embargo trigger and every acceptance decision"
        difference: "counts only PASSED in the numerator, so a FLAGGED audit lowers this metric"
      - name: provisional
        when: "the cold-start ranking inside worker_selection and the plan's AT_RISK reading"
        difference: "counts PASSED and FLAGGED, so it is greater than or equal to the accepted variant on every input"

  - name: capacity_requirement_points
    trigger: "on POST /api/programs/{program_id}/program-state with action ASSESS and on GET /api/programs/{program_id}"
    algorithm: waterfall_allocation
    formula: |
      demand_points := sum over EVERY SpecUnit under the program, including DRAFT and REJECTED units,
                       of unit_effective_points
      where unit_ceiling_points     := max_items * capacity_weight
            capacity_weight         := 1 for STANDARD, 2 for SENSITIVE, 3 for RESTRICTED
            rework_point_multiplier := 1.2 when the unit holds at least one item with consensus_status REWORK, else 1.0
            unit_effective_points   := round_half_up(unit_ceiling_points * rework_point_multiplier)

      accuracy := program accuracy under the requested variant
      if accuracy <  accuracy_floor_pct:            points_per_item := point_cost_fallback        ; below_floor := true
      elif accuracy < accuracy_high_watermark_pct:  points_per_item := point_cost_medium_accuracy ; below_floor := false
      else:                                        points_per_item := point_cost_high_accuracy  ; below_floor := false
      # accuracy exactly equal to accuracy_floor_pct takes the MEDIUM branch and is NOT below floor.
      # accuracy exactly equal to accuracy_high_watermark_pct takes the HIGH branch.

      multiplier                  := 1.0 for ACCEPTED, 1.15 for PROVISIONAL, 1.35 for AT_RISK
      capacity_requirement_points := round_half_up(demand_points * multiplier)
      capacity_feasible           := (capacity_points >= capacity_requirement_points) AND (below_floor == false)
      projected_miss_deadline     := (capacity_feasible == false)
      qa_sample_rate              := max over the program's SpecUnit rows of gold_rate
    input_set: "Every SpecUnit row under the program, including DRAFT and REJECTED ones, because collapsing a unit never refunds its ceiling"
    constants:
      POINT_COST: { HIGH: 2, MEDIUM: 3, FALLBACK: 4 }
      MULT: { ACCEPTED: 1.0, PROVISIONAL: 1.15, AT_RISK: 1.35 }
      REWORK_MULTIPLIER: 1.2
      CAPACITY_WEIGHT: { STANDARD: 1, SENSITIVE: 2, RESTRICTED: 3 }
    precision: "demand_points, capacity_points and capacity_requirement_points are integers; round_half_up is applied to the product"
    note: "Boundary precision is pinned twice: accuracy exactly at the floor is feasible, and accuracy exactly at the high watermark is cheap. A plan is infeasible whenever the accuracy variant sits strictly below the floor, even when capacity is plentiful."

  - name: week_epoch_roll
    trigger: "on POST /api/_clock/set_current_utc when the supplied instant crosses a week boundary"
    algorithm: chronological
    formula: |
      the advance closes the single OPEN WeekEpoch row (status := CLOSED) and opens the next one with
      index := closed.index + 1 and starts_at_utc := the supplied instant
      CustomerProgram.current_week_epoch_index := the new index for every program
      every accumulator keyed to a week resets at that boundary:
        - the weekly ceiling accumulator restarts, because `settled` counts only ACCEPTED rows whose week_epoch_index equals the new index
        - every LabelingItem.gold_audits_this_week resets to 0
        - WorkerQualification rehabilitation eligibility is measured against the new epoch index
    input_set: "exactly one WeekEpoch row is OPEN at any time; the supplied instant is the new week start"
    precision: "integer epoch indices"

# =============================================================================
# Table 4: Validation Rules Table — ordered by priority (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: business_constraint
    check: "the request body carries every input field the endpoint declares as required, and the envelope is well formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that declares required inputs"
  - priority: 1
    category: auth
    check: "the X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /api/workers"
  - priority: 2
    category: auth
    check: "the acting role is one of the roles declared on the endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all protected endpoints"
  - priority: 3
    category: existence
    check: "the program named in the path exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "program, spec-unit creation and item endpoints"
  - priority: 3
    category: existence
    check: "the spec unit named in the path exists"
    error_id: ERR_SPEC_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "spec-unit and item-creation endpoints"
  - priority: 3
    category: existence
    check: "the labeling item named in the path exists"
    error_id: ERR_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "item, commit-creation, gold-audit and rework endpoints"
  - priority: 3
    category: existence
    check: "the commit named in the path exists and belongs to the item named alongside it"
    error_id: ERR_COMMIT_NOT_FOUND
    http_status: 404
    applies_to: "commit and payout-record endpoints"
  - priority: 3
    category: existence
    check: "the gold audit named in the path exists and targets the item named alongside it"
    error_id: ERR_GOLD_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "gold-audit grading"
  - priority: 3
    category: existence
    check: "the worker named in the path exists, and the qualification or incident named alongside it names that worker"
    error_id: ERR_WORKER_NOT_FOUND
    http_status: 404
    applies_to: "worker, qualification and incident endpoints"
  - priority: 3
    category: existence
    check: "the qualification named in the path exists"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "qualification endpoints"
  - priority: 3
    category: existence
    check: "the appeal case named in the path exists"
    error_id: ERR_APPEAL_CASE_NOT_FOUND
    http_status: 404
    applies_to: "appeal-case endpoints"
  - priority: 4
    category: business_constraint
    check: "the OCC guard passes: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/spec-units, POST /api/gold-audits/{id}/grade-audit, POST /api/appeal-cases/{id}/concur"
  - priority: 5
    category: state
    check: "the target resource is in a state that admits this operation and no ancestor program is FROZEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "the commit is still DISPATCHED, so it has not already been committed, abstained or expired"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /api/commits/{id}/commit-label"
  - priority: 5
    category: state
    check: "the unit instruction document is PUBLISHED, so the unit may be activated"
    error_id: ERR_INSTRUCTION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /api/spec-units/{id}/advance-unit"
  - priority: 6
    category: business_safety
    check: "the owning program has an unresolved MAJOR or CATASTROPHIC confidentiality incident, so no further labeling work may be dispatched against it"
    error_id: ERR_PROGRAM_OPERATIONALLY_RESTRICTED
    http_status: 409
    applies_to: "POST /api/items/{id}/dispatch-panel, POST /api/commits/{id}/gold-audits, POST /api/programs/{id}/spec-units"
  - priority: 6
    category: business_safety
    check: "the acting worker has an open confidentiality incident, so the worker may not commit, be dispatched work or be paid"
    error_id: ERR_WORKER_RESTRICTED
    http_status: 403
    applies_to: "POST /api/commits/{id}/commit-label, POST /api/items/{id}/dispatch-panel, POST /api/commits/{id}/payout-records, POST /api/workers/{id}/settlement-requests"
  - priority: 6
    category: business_safety
    check: "the qualification carries a payload field the instruction document does not enumerate, or omits one it does"
    error_id: ERR_FIELD_SCHEMA_MISMATCH
    http_status: 400
    applies_to: "POST /api/commits/{id}/commit-label, POST /api/items/{id}/submit-rework"
  - priority: 6
    category: business_safety
    check: "a unit presenting edge_case_count above zero while has_edge_case_guidance is true is rejected, because a published edge case list and an enumerated count contradict each other"
    error_id: ERR_EDGE_CASE_GUIDANCE_CONFLICT
    http_status: 409
    applies_to: "POST /api/spec-units/{id}/advance-unit"
  - priority: 7
    category: business_referential
    check: "unit_code is unique inside its program, item_key is unique inside its spec unit, and a worker handle is unique across the workforce"
    error_id: ERR_UNIT_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /api/programs/{id}/spec-units, POST /api/spec-units/{id}/items, POST /api/workers"
  - priority: 7
    category: business_referential
    check: "the claimed parent unit would close a cycle in the decomposition graph"
    error_id: ERR_SPEC_UNIT_CYCLE
    http_status: 409
    applies_to: "POST /api/programs/{id}/spec-units"
  - priority: 7
    category: business_referential
    check: "the commit instruction_revision equals SpecUnit.frozen_revision when frozen_revision is set"
    error_id: ERR_INSTRUCTION_REVISION_MISMATCH
    http_status: 409
    applies_to: "POST /api/commits/{id}/commit-label, POST /api/items/{id}/submit-rework"
  - priority: 8
    category: business_temporal
    check: "the commit arrives strictly before commit_deadline_at"
    error_id: ERR_COMMIT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/commits/{id}/commit-label"
  - priority: 8
    category: business_temporal
    check: "required_units is at least 1, and the unit already holds at least required_units minus 1 certified items, so releasing the piece would publish a detection gap of zero"
    error_id: ERR_REQUIRED_UNITS_GAP
    http_status: 409
    applies_to: "POST /api/items/{id}/dispatch-panel"
  - priority: 8
    category: business_temporal
    check: "the piece coverage window and the program blackout window are treated as half-open, so a coverage window ending exactly at blackout_start_utc is adjacent and allowed while any overlap of positive length is rejected"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/spec-units/{id}/advance-unit"
  - priority: 8
    category: business_temporal
    check: "the worker's assignment lanes are treated as closed intervals, so a worker may not hold two DISPATCHED commits on different pieces whose dispatch-to-deadline intervals touch or overlap; a lane ending exactly when the next begins is a conflict"
    error_id: ERR_WORKER_LANE_CONFLICT
    http_status: 409
    applies_to: "POST /api/items/{id}/dispatch-panel"
  - priority: 8
    category: business_temporal
    check: "the rework window has not lapsed: the elapsed time since rework_started_at is strictly below rework_window_seconds"
    error_id: ERR_REWORK_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /api/items/{id}/submit-rework"
  - priority: 9
    category: business_constraint
    check: "the selector produced a non-empty eligible candidate set for this dispatch"
    error_id: ERR_NO_ELIGIBLE_WORKER
    http_status: 422
    applies_to: "POST /api/items/{id}/dispatch-panel"
  - priority: 9
    category: business_constraint
    check: "the piece gold_rotation is false and gold_audits_this_week is strictly below 3"
    error_id: ERR_GOLD_ROTATION_ACTIVE
    http_status: 409
    applies_to: "POST /api/items/{id}/dispatch-panel"
  - priority: 9
    category: business_constraint
    check: "the panel is not already fully dispatched, so the committed PRODUCTION assignment count is strictly below panel_size"
    error_id: ERR_PANEL_ALREADY_DISPATCHED
    http_status: 409
    applies_to: "POST /api/items/{id}/dispatch-panel"
  - priority: 9
    category: business_constraint
    check: "a panel decision may only be recorded once at least commitment_quorum non-abstaining commits exist"
    error_id: ERR_QUORUM_NOT_REACHED
    http_status: 409
    applies_to: "POST /api/items/{id}/reviewer-action"
  - priority: 9
    category: business_constraint
    check: "the rework round limit has not been reached: rework_cycles is strictly below rework_round_limit"
    error_id: ERR_REWORK_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /api/items/{id}/reviewer-action"
  - priority: 9
    category: business_constraint
    check: "the acting reviewer holds no commit on the disputed piece and, for a concurrence, is not the claim's adjudicator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/items/{id}/reviewer-action, POST /api/gold-audits/{id}/grade-audit, POST /api/appeal-cases/{id}/advance-appeal, POST /api/appeal-cases/{id}/concur"
  - priority: 9
    category: business_constraint
    check: "the qualification qualification_score is at or above tier_min_score for its declared tier"
    error_id: ERR_QUALIFICATION_SCORE_BELOW_TIER
    http_status: 422
    applies_to: "POST /api/workers/{id}/qualifications with action VERIFY"
  - priority: 9
    category: business_constraint
    check: "the plan is feasible: capacity_points is at or above capacity_requirement_points and the accuracy variant is at or above accuracy_floor_pct"
    error_id: ERR_CAPACITY_INFEASIBLE
    http_status: 409
    applies_to: "POST /api/programs/{id}/program-state with action ASSESS_CAPACITY"
  - priority: 10
    category: business_fiscal
    check: "the asserted payout amount_cents equals the computed capped amount for this commit, so an under- or over-stated claim is rejected rather than silently corrected"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/commits/{id}/payout-records"
  - priority: 10
    category: business_fiscal
    check: "the payout is denominated in the worker payout_currency"
    error_id: ERR_CURRENCY_MISMATCH
    http_status: 409
    applies_to: "POST /api/commits/{id}/payout-records, POST /api/workers/{id}/settlement-requests"
  - priority: 10
    category: business_fiscal
    check: "a settlement or reversal never drives worker_receivable_cents strictly negative"
    error_id: ERR_INSUFFICIENT_RECEIVABLE
    http_status: 422
    applies_to: "POST /api/workers/{id}/settlement-requests, POST /api/appeal-cases/{id}/concur"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: "/api/workers"
    description: "Register a worker on the labeling workforce; the only endpoint open to an unauthenticated caller"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [handle, "payout_currency?", "settlement_min_cents?", "display_name?"]
    output: WorkerIdentity
    side_effects: ["creates the worker with zero receivables"]
  - method: GET
    path: "/api/workers/{id}"
    description: "Read one worker with receivables, staff flags and payout currency"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: ["earnings_variant?"]
    output: WorkerIdentity
    side_effects: ["recomputes worker_receivable_cents"]
  - method: POST
    path: "/api/workers/{id}/settlement-requests"
    description: "Withdraw the worker receivable balance as a settlement payout"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: WorkerIdentity
    side_effects: ["decrements worker_receivable_cents by the settled amount"]
  - method: GET
    path: "/api/workers/{id}/qualifications"
    description: "List a worker language qualifications with their accuracy variants and staff status"
    roles: [PlatformAdmin, PlatformReviewer]
    code: 200
    input: ["language_code?", "limit?", "offset?"]
    output: WorkerQualification[]
    side_effects: []
  - method: POST
    path: "/api/workers/{id}/qualifications"
    description: "Enroll, verify or reset a worker language qualification"
    roles: [PlatformAdmin, PlatformReviewer]
    code: 200
    input: [language_code, tier, qualification_action, "training_required_count?"]
    output: WorkerQualification
    side_effects: ["action ENROLL creates the qualification IN_TRAINING", "action VERIFY enforces the training count and the tier score minimum", "action RESET suspends the qualification in the presence of an open incident, or returns it to IN_TRAINING when training is incomplete"]
  - method: GET
    path: "/api/workers/{id}/incidents"
    description: "List the confidentiality incidents reported against a worker"
    roles: [PlatformAdmin, PlatformReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConfidentialityIncident[]
    side_effects: []
  - method: POST
    path: "/api/workers/{id}/incidents"
    description: "Report or resolve a confidentiality incident tied to a customer dataset"
    roles: [PlatformAdmin]
    code: 201
    input: [program_code, category, severity, description_text, incident_action]
    output: ConfidentialityIncident
    side_effects: ["action REPORT opens the incident and recomputes program operational_restricted and worker restricted", "action RESOLVE closes it and recomputes both flags"]
  - method: POST
    path: "/api/programs"
    description: "Register a customer engagement with its task language, instruction model and confidentiality class"
    roles: [PlatformAdmin]
    code: 201
    input: [program_code, name, language_code, instruction_model, sensitivity_class, deadline_utc, blackout_start_utc, blackout_end_utc, "min_consensus_agreement?", "commitment_quorum?", "commit_deadline_seconds?", "patience_seconds?", "coverage_hours?", "capacity_points?", "accuracy_floor_pct?", "accuracy_high_watermark_pct?", "weekly_earning_cap_cents?"]
    output: CustomerProgram
    side_effects: ["creates the engagement in DRAFT"]
  - method: GET
    path: "/api/programs/{id}"
    description: "Read one engagement with its acceptance metrics and capacity requirement under the requested plan variant"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: ["plan_variant?"]
    output: CustomerProgram
    side_effects: ["recomputes demand_points and capacity_requirement_points under the requested plan_variant"]
  - method: POST
    path: "/api/programs/{id}/program-state"
    description: "Advance the engagement lifecycle: open it, assess the capacity plan, recall it from an embargo, or freeze it terminally"
    roles: [PlatformAdmin]
    code: 200
    input: [program_action, "plan_variant?"]
    output: CustomerProgram
    side_effects: ["action OPEN advances every root unit that already satisfies the unit activation gates (published instruction, edge case rule, half-open coverage window) from DRAFT to ACTIVE and releases its pieces; a unit that fails those gates is left in DRAFT", "action ASSESS_CAPACITY recomputes demand_points, capacity_requirement_points, capacity_feasible and projected_miss_deadline", "action RECALL clears QUALITY_EMBARGO when accuracy has recovered", "action FREEZE rejects every unit and expires every dispatched commit"]
  - method: GET
    path: "/api/spec-units"
    description: "List decomposition units, filterable by owning engagement so a program's whole decomposition is discoverable from the program id, and by parent unit so a unit's direct children are discoverable from the unit id"
    roles: [PlatformAdmin, PlatformReviewer]
    code: 200
    input: ["program_id?", "parent_unit_id?", "status?", "limit?", "offset?"]
    output: SpecUnit[]
    side_effects: []
  - method: POST
    path: "/api/spec-units"
    description: "Decompose the customer specification into a labeling unit with its instruction document, edge case guidance and field schema; the owning program is carried as a body reference"
    roles: [PlatformAdmin]
    code: 201
    input: [program_id, unit_code, max_items, instruction_revision, instruction_status, field_schema, coverage_start_utc, coverage_end_utc, expected_program_version, "parent_unit_id?", "has_edge_case_guidance?", "edge_case_count?", "panel_size?", "gold_rate?"]
    output: SpecUnit
    side_effects: ["increments CustomerProgram.version by 1", "increments CustomerProgram.demand_points"]
  - method: GET
    path: "/api/spec-units/{id}"
    description: "Read one spec unit with its pinned instruction revision, derived accuracy and remaining slots"
    roles: [PlatformAdmin, PlatformReviewer]
    code: 200
    input: []
    output: SpecUnit
    side_effects: []
  - method: POST
    path: "/api/spec-units/{id}/advance-unit"
    description: "Activate a decomposed unit into production, or reopen a completed unit whose child piece returned to rework"
    roles: [PlatformAdmin]
    code: 200
    input: [unit_action]
    output: SpecUnit
    side_effects: ["action ACTIVATE enforces the published instruction, the edge case rule, the child status gate and the half-open coverage window", "action REOPEN returns a COMPLETE unit to ACTIVE with piece_status REWORK"]
  - method: POST
    path: "/api/spec-units/{id}/items"
    description: "Attach a customer payload to a spec unit as a labeling piece"
    roles: [PlatformAdmin]
    code: 201
    input: [item_key, payload_uri, "required_units?"]
    output: LabelingItem
    side_effects: ["increments SpecUnit.item_count by 1", "assigns the next item_seq inside the unit"]
  - method: GET
    path: "/api/items"
    description: "List labeling pieces, filtered by spec unit, owning program or consensus outcome"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: ["spec_unit_id?", "program_id?", "consensus_status?", "limit?", "offset?"]
    output: LabelingItem[]
    side_effects: []
  - method: GET
    path: "/api/items/{id}"
    description: "Read one labeling piece with its consensus state, agreement ratio, gold rotation and rework clock"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: []
    output: LabelingItem
    side_effects: []
  - method: POST
    path: "/api/items/{id}/dispatch-panel"
    description: "Select a qualified panel by language, skill and historical accuracy and dispatch one assignment per selected worker"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LabelingItem
    side_effects: ["evaluates calculations.worker_selection", "creates one Commit per selected worker with kind PRODUCTION", "sets consensus_status to AWAITING_CONSENSUS", "increments SpecUnit.version by 1"]
  - method: POST
    path: "/api/items/{id}/reviewer-action"
    description: "Reviewer tie-break on a held panel, or open a rework round on a certified piece"
    roles: [PlatformReviewer, PlatformAdmin]
    code: 200
    input: [reviewer_action, "decision_value?"]
    output: LabelingItem
    side_effects: ["action RESOLVE_PANEL_DECISION records the reviewer value and certifies the piece", "action OPEN_REWORK demotes the piece to REWORK and marks the lowest-ranked modal member superseded"]
  - method: POST
    path: "/api/items/{id}/submit-rework"
    description: "Hand in a corrected answer for a piece inside its rework window"
    roles: [Worker]
    code: 200
    input: [commit_id, payload, instructions_ack]
    output: LabelingItem
    side_effects: ["replaces the superseded member in place", "re-evaluates calculations.consensus_value_groups", "increments LabelingItem.version by 1"]
  - method: GET
    path: "/api/items/{id}/commits"
    description: "List the assignments on a piece, including gold audits"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Commit[]
    side_effects: []
  - method: GET
    path: "/api/commits/{id}"
    description: "Read one assignment with its committed value, group rank and payment state"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: []
    output: Commit
    side_effects: []
  - method: POST
    path: "/api/commits/{id}/commit-label"
    description: "Submit the worker label payload for an assignment, or record an abstention"
    roles: [Worker]
    code: 200
    input: ["payload?", "abstained?", "instructions_ack?"]
    output: Commit
    side_effects: ["computes committed_value via calculations.consensus_value_groups", "re-evaluates the consensus resolver for the piece", "recomputes LabelingItem.non_abstaining_commit_count"]
  - method: POST
    path: "/api/commits/{id}/gold-audits"
    description: "Create a gold-standard audit over an already committed panel member"
    roles: [PlatformReviewer]
    code: 201
    input: [gold_task_key]
    output: Commit
    side_effects: ["selects the anchor member by the anchor rule and inherits its payload as expected_value", "increments LabelingItem.gold_audits_this_week by 1"]
  - method: POST
    path: "/api/gold-audits/{id}/grade-audit"
    description: "Grade a dispatched gold audit against the customer ground truth, or catalogue it out of both accuracy variants"
    roles: [PlatformReviewer]
    code: 200
    input: [gold_outcome, expected_item_version]
    output: Commit
    side_effects: ["records gold_outcome", "updates WorkerQualification.gold_fail_streak, accuracy_pct and the cyclic qualification status", "recomputes program and unit accuracy", "increments LabelingItem.version by 1"]
  - method: POST
    path: "/api/commits/{id}/payout-records"
    description: "Accept a worker payment for a committed assignment at the computed dynamic rate"
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents, currency]
    output: Commit
    side_effects: ["evaluates calculations.accepted_unit_amount", "credits WorkerIdentity.worker_receivable_cents and lifetime_earned_cents", "stamps week_epoch_index", "fires the quality embargo when the owning program is ACTIVE and accuracy has fallen below the floor"]
  - method: POST
    path: "/api/appeal-cases"
    description: "File a worker dispute over a rejected or disputed piece"
    roles: [Worker, PlatformReviewer]
    code: 201
    input: [item_id, grounds, statement_text, "requested_reviewer_id?"]
    output: AppealClaim
    side_effects: ["creates the claim in ADVOCACY"]
  - method: GET
    path: "/api/items/{id}/appeal-cases"
    description: "List the disputes filed against a piece"
    roles: [PlatformAdmin, PlatformReviewer, Worker]
    code: 200
    input: ["limit?", "offset?"]
    output: AppealClaim[]
    side_effects: []
  - method: POST
    path: "/api/appeal-cases/{id}/advance-appeal"
    description: "Move a dispute forward: file the reviewer proposal, escalate it to adjudication, suspend it, or withdraw it"
    roles: [PlatformReviewer, PlatformAdmin, Worker]
    code: 200
    input: [appeal_action, "proposed_outcome?"]
    output: AppealClaim
    side_effects: ["action PROPOSE stamps adjudicator_id and revised_amount_cents", "action ESCALATE enters the reviewer to reviewer cycle", "action SUSPEND terminates as REVIEWER_SUSPENSION", "action WITHDRAW terminates as REJECTED"]
  - method: POST
    path: "/api/appeal-cases/{id}/concur"
    description: "Concur with a proposed outcome, delivering the compensation that resolves the dispute"
    roles: [PlatformReviewer]
    code: 200
    input: [expected_claim_version]
    output: AppealClaim
    side_effects: ["moves the disputed payment from ACCEPTED to REVERSED", "credits worker_receivable_cents while leaving lifetime_earned_cents unchanged", "clears the qualification failure streak", "returns the disputed piece to REWORK"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. The server starts at exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; advancing the clock past a week boundary rolls the open week epoch, resets every weekly accumulator and fires the rework and appeal sweeps"
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["rolls the open WeekEpoch when the instant crosses the week boundary", "resets gold_audits_this_week on every piece", "re-evaluates the consensus resolver for every piece in AWAITING_CONSENSUS or HELD_QUORUM so the hold, quorum-rejection and rework-timeout transitions whose windows have expired fire deterministically", "fires the appeal deadlock sweep"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent from the request body or carries a value of the wrong type"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "the X-User-ID or X-User-Role header is absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not declared on the endpoint"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the program named in the path does not exist"
  - id: ERR_SPEC_UNIT_NOT_FOUND
    http: 404
    condition: "the spec unit named in the path does not exist"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "the labeling item named in the path does not exist"
  - id: ERR_COMMIT_NOT_FOUND
    http: 404
    condition: "the commit named in the path does not exist"
  - id: ERR_GOLD_AUDIT_NOT_FOUND
    http: 404
    condition: "the gold audit named in the path does not exist or does not target the named item"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "the worker named in the path does not exist"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "the qualification named in the path does not exist"
  - id: ERR_APPEAL_CASE_NOT_FOUND
    http: 404
    condition: "the appeal case named in the path does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected_<parent>_version supplied by the client does not equal the parent entity's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is in a state that does not admit this operation, or an ancestor program is FROZEN"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the commit is no longer DISPATCHED, so it has already been committed, abstained or expired"
  - id: ERR_INSTRUCTION_NOT_PUBLISHED
    http: 409
    condition: "the unit instruction document has not reached PUBLISHED, so the unit may not be activated"
  - id: ERR_PROGRAM_OPERATIONALLY_RESTRICTED
    http: 409
    condition: "the owning program carries an unresolved MAJOR or CATASTROPHIC confidentiality incident"
  - id: ERR_WORKER_RESTRICTED
    http: 403
    condition: "the acting worker has an open confidentiality incident"
  - id: ERR_FIELD_SCHEMA_MISMATCH
    http: 400
    condition: "the committed payload key set does not equal the spec unit field_schema key set"
  - id: ERR_EDGE_CASE_GUIDANCE_CONFLICT
    http: 409
    condition: "the unit publishes edge case guidance while also declaring a positive enumerated edge case count"
  - id: ERR_UNIT_CODE_DUPLICATE
    http: 409
    condition: "the unit_code is already used inside the program, or the item_key is already used inside the unit"
  - id: ERR_SPEC_UNIT_CYCLE
    http: 409
    condition: "the declared parent unit would close a cycle in the decomposition graph"
  - id: ERR_INSTRUCTION_REVISION_MISMATCH
    http: 409
    condition: "the instruction revision carried by the answer differs from the unit's pinned frozen_revision"
  - id: ERR_COMMIT_WINDOW_CLOSED
    http: 409
    condition: "the logical clock has reached or passed the assignment commit_deadline_at"
  - id: ERR_REQUIRED_UNITS_GAP
    http: 409
    condition: "required_units is below 1, or the unit lacks the certified items the piece requires, so releasing it would publish a zero detection gap"
  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "the half-open coverage window overlaps the program blackout window by a positive length"
  - id: ERR_WORKER_LANE_CONFLICT
    http: 409
    condition: "a selected worker already holds a dispatched assignment whose closed dispatch-to-deadline interval touches or overlaps the new one"
  - id: ERR_REWORK_WINDOW_EXPIRED
    http: 409
    condition: "the elapsed time since rework_started_at has reached or passed rework_window_seconds"
  - id: ERR_NO_ELIGIBLE_WORKER
    http: 422
    condition: "the selector produced an empty eligible candidate set for this dispatch"
  - id: ERR_GOLD_ROTATION_ACTIVE
    http: 409
    condition: "the piece has already taken three gold audits this week epoch while its consensus status is not REWORK"
  - id: ERR_PANEL_ALREADY_DISPATCHED
    http: 409
    condition: "the committed production assignment count has already reached panel_size"
  - id: ERR_QUORUM_NOT_REACHED
    http: 409
    condition: "fewer than commitment_quorum non-abstaining commits exist, so no panel decision may be recorded"
  - id: ERR_REWORK_ROUND_LIMIT
    http: 409
    condition: "the piece has already exhausted rework_round_limit rounds"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting reviewer holds a commit on the disputed piece, or is the claim's own adjudicator when concurring"
  - id: ERR_QUALIFICATION_SCORE_BELOW_TIER
    http: 422
    condition: "the deterministic qualification score is below the tier minimum, so the verification is refused"
  - id: ERR_CAPACITY_INFEASIBLE
    http: 409
    condition: "capacity_points is below capacity_requirement_points, or the accuracy variant sits strictly below accuracy_floor_pct"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "the asserted payout amount differs from the capped amount the formula computes"
  - id: ERR_CURRENCY_MISMATCH
    http: 409
    condition: "the payout or settlement currency differs from the worker payout_currency"
  - id: ERR_INSUFFICIENT_RECEIVABLE
    http: 422
    condition: "a settlement or reversal would drive worker_receivable_cents strictly negative"

# =============================================================================
# Table 7: RBAC Permission Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Bench operator who decomposes specifications, opens and freezes engagements, dispatches panels and settles worker payouts"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs"
      - "POST /api/programs/{id}/program-state"
      - "POST /api/programs/{id}/spec-units"
      - "POST /api/spec-units/{id}/advance-unit"
      - "POST /api/spec-units/{id}/items"
      - "POST /api/items/{id}/dispatch-panel"
      - "POST /api/commits/{id}/payout-records"
      - "POST /api/workers/{id}/incidents"
      - "POST /api/workers/{id}/settlement-requests"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs/{id}/spec-units"
      - "GET /api/items"
      - "GET /api/items/{id}"
      - "GET /api/commits"
      - "GET /api/commits/{id}"
      - "GET /api/workers/{id}"
      - "GET /api/workers/{id}/qualifications"
      - "GET /api/workers/{id}/incidents"
      - "GET /api/items/{id}/appeal-cases"
      - "POST /api/workers"
      - "POST /api/workers/{id}/qualifications"
      - "POST /api/appeal-cases/{id}/advance-appeal"

  - name: PlatformReviewer
    description: "Quality reviewer who grades gold-standard audits, breaks held panels, opens rework rounds and adjudicates worker disputes"
    identity: opaque
    exclusive_operations:
      - "POST /api/gold-audits/{id}/grade-audit"
      - "POST /api/items/{id}/reviewer-action"
      - "POST /api/items/{id}/gold-audits"
      - "POST /api/appeal-cases/{id}/concur"
    shared_operations:
      - "GET /api/programs/{id}"
      - "GET /api/programs/{id}/spec-units"
      - "GET /api/items"
      - "GET /api/items/{id}"
      - "GET /api/commits"
      - "GET /api/commits/{id}"
      - "GET /api/workers/{id}"
      - "GET /api/workers/{id}/qualifications"
      - "GET /api/workers/{id}/incidents"
      - "GET /api/items/{id}/appeal-cases"
      - "POST /api/workers/{id}/qualifications"
      - "POST /api/appeal-cases/{id}/advance-appeal"

  - name: Worker
    description: "Labeling workforce member who commits labels, abstains, hands in corrected rework answers, settles receivables and files disputes"
    identity: entity_backed:WorkerIdentity
    exclusive_operations:
      - "POST /api/commits/{id}/commit-label"
      - "POST /api/items/{id}/submit-rework"
      - "POST /api/workers/{id}/settlement-requests"
      - "POST /api/appeal-cases"
    shared_operations:
      - "POST /api/appeal-cases/{id}/advance-appeal"
      - "GET /api/items/{id}"
      - "GET /api/commits/{id}"
      - "GET /api/workers/{id}"
      - "GET /api/programs/{id}"

  - name: Anonymous
    description: "Unauthenticated caller permitted only to register a new workforce member"
    identity: opaque
    exclusive_operations:
      - "POST /api/workers"
    shared_operations: []
