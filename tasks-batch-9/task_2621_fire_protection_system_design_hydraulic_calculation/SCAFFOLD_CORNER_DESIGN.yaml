      - name: system_type_decides_which_schema_optional_fields_are_actually_required
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - errors.ERR_SYSTEM_TYPE_FIELD_REQUIRED
          - endpoints.POST_/auxiliary-systems
          - calculations.auxiliary_system_demand
        distinguishing_aspect: |
          Every one of these fields is optional in the endpoint's input schema, so a pure schema check
          would accept all five bodies; the conditional rule rejects each with priority 10's
          ERR_SYSTEM_TYPE_FIELD_REQUIRED rather than priority 9's ERR_INVALID_REQUEST. IN_RACK is the
          sharp case because it needs TWO conditional fields and is tested missing each one in turn,
          while the sixth call proves a type whose own conditional field is present is accepted.
        test_recipe:
          setup:
            - "Project FP-2601 with the CLASS_IV rack area on file"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems"
