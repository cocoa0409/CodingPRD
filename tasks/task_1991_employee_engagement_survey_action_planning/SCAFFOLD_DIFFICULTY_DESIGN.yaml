  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes: b nested rounding; c eval order)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: engagement_score_nested_rounding_order
        grounds:
          - calculations.engagement_score
          - entities.ReportSnapshot.fields.dimension_scores
        distinguishing_aspect: |
          Mode (b) nested rounding: per-answer weighted products are rounded to
          4dp BEFORE summation, then the quotient is rounded to 2dp. Summing
          unrounded products and rounding once at the end yields a different
          2dp result for the pinned fixture — the scaffold pins product-then-sum
          order explicitly.
        test_recipe:
          setup:
            - "Bank with items I1 (PURPOSE w=0.3), I2 (GROWTH w=0.7), I3 (BELONGING w=1.1)"
            - "Unit C min_n=3 with 3 ACTIVE employees; CENSUS cycle opened, 3 submit with answers engineered so rounding order flips the 2dp digit"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Rounding Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { rd_bank: $.data.id }
            - call: "POST /engagement/item-banks/${rd_bank}/items"
              payload: { item_code: "RD-01", dimension: "PURPOSE", weight: 0.3 }
              as: HRAdmin
              captures: { rd_i1: $.data.id }
            - call: "POST /engagement/item-banks/${rd_bank}/items"
              payload: { item_code: "RD-02", dimension: "GROWTH", weight: 0.7 }
              as: HRAdmin
              captures: { rd_i2: $.data.id }
            - call: "POST /engagement/item-banks/${rd_bank}/items"
              payload: { item_code: "RD-03", dimension: "BELONGING", weight: 1.1 }
              as: HRAdmin
              captures: { rd_i3: $.data.id }
            - call: "POST /engagement/item-banks/${rd_bank}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/org-units"
              payload: { name: "Unit C", manager_user_id: "mgr-c", min_n_threshold: 3, verbatim_n_threshold: 5 }
