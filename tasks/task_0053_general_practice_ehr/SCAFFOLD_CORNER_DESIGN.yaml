  # ===================================================================
  # Cross-Cutting Complexity Layers
  # ===================================================================
  - section: cross_cutting
    instances:
      - name: panel_bind_stale_provider_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.panel-bind-stale-provider
          - errors[ERR_STALE_VERSION]
          - validations[priority=13]
        distinguishing_aspect: "Two strictly-sequential panel binds: the second carries the pre-first-bind expected_provider_version (${prov_v}, now stale because the first bind advanced Provider.version) and is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Provider panel_capacity=5; two patients; first patient bound (provider version advanced)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000070", full_name: "Dr AK", specialty: "FAMILY_MEDICINE", panel_capacity: 5 }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "OCC", last_name: "One", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat1: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "OCC", last_name: "Two", date_of_birth: "1981-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat2: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat1}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
              captures: { prov_v2: $.data.version }
          trigger:
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat2}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 and error_id == ERR_STALE_VERSION (stale expected_provider_version after first bind advanced it)"

      - name: panel_bind_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.panel-bind-stale-provider, entities.Provider.fields.version]
        distinguishing_aspect: "A panel bind carrying the current expected_provider_version succeeds and increments Provider.version by exactly 1 (from ${prov_v} to ${prov_v}+1)."
        test_recipe:
          setup: ["Provider panel_capacity=5 at version 1; one patient"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000071", full_name: "Dr AL", specialty: "FAMILY_MEDICINE", panel_capacity: 5 }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "OCC", last_name: "Three", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat1: $.data.id }
          trigger:
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat1}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
              captures: { new_v: $.data.version, size: $.data.panel_size }
          assert:
            - "HTTP 200; Provider.panel_size == 1; Provider.version == 2 (incremented by 1)"

      - name: finalize_cascade_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Visit.CODED_to_FINALIZED]
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_visit_depth3_cascade
          rationale: "The depth-3 finalize cascade is asserted by the named §1.8 transitive-cascade instance."

      - name: dispense_cascade_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Prescription.TRANSMITTED_to_DISPENSED]
        excluded_because:
          difficulty_instance: transitive_cascade / dispense_prescription_depth2_cascade
          rationale: "The depth-2 dispense cascade is asserted by the named §1.8 transitive-cascade instance."

      - name: lifetime_charges_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [calculations.patient_lifetime_charges, entities.Patient.fields.lifetime_charges_cents]
        distinguishing_aspect: "After finalizing two visits (final totals 7200 and 10800), Patient.lifetime_charges_cents reconciles to 18000 (sum of FINALIZED visit totals)."
        test_recipe:
          setup: ["Patient with two visits driven to FINALIZED: visit A final 7200 (EM base 8000 em3), visit B final 10800 (PREVENTIVE base 12000)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000072", full_name: "Dr AM", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Recon", last_name: "Ledger", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "REM01", short_description: "EM", category: "EM", base_fee_cents: 8000, requires_em_level: true }
              as: Biller
              captures: { cptA: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "RPV01", short_description: "Preventive", category: "PREVENTIVE", base_fee_cents: 12000 }
              as: Biller
              captures: { cptB: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { vA: $.data.id }
            - call: "POST /visits/${vA}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${vA}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${vA}/charge-lines"
              payload: { cpt_code: "REM01", units: 1, em_level: 3 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${vA}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${vA}/finalize"
              payload: {}
              as: Biller
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "PHYSICAL", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:30:00Z" }
              as: FrontDesk
              captures: { vB: $.data.id }
            - call: "POST /visits/${vB}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${vB}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${vB}/charge-lines"
              payload: { cpt_code: "RPV01", units: 1 }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${vB}/code"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${vB}/finalize"
              payload: {}
              as: Biller
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: FrontDesk
              captures: { lc: $.data.lifetime_charges_cents }
          assert:
            - "Patient.${pat_id}.lifetime_charges_cents == 18000 (7200 + 10800)"

  # ===================================================================
  # Consistency Model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: finalize_response_reflects_charges_immediately
        claim_type: immediate
        grounds: [endpoints, calculations.visit_billed_total]
        distinguishing_aspect: "The POST /visits/{id}/finalize response itself already carries billed_total_cents==7200 (final), proving immediate consistency — no re-read needed."
        test_recipe:
          setup: ["Visit CODED with one EM line (base 8000 em3 -> provisional 8000)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000080", full_name: "Dr AN", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Imm", last_name: "Consist", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
