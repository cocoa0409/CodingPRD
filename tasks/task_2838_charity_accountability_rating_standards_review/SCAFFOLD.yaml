# =============================================================================
# PRD Benchmark Seed Tables — Charity Accountability Rating & Standards Review
# =============================================================================
scenario: |
  2838. Charity Accountability Rating & Standards Review (charity evaluation
  organization): rating methodology across financial health, accountability,
  transparency and impact with weighting and thresholds, data collection from
  public filings, organization submissions and audited statements with
  validation, standards evaluation on governance practices including board
  size, independence and conflict of interest policy, program expense ratio
  and fundraising efficiency calculation with methodology adjustments for
  organization type, organization response and correction process before
  publication with appeal rights, rating publication with change notifications
  and historical trend display, methodology revision with public comment and
  transition periods for affected organizations, complaint intake and
  investigation of donor concerns

domain_name: charity-accountability-rating

# Flat peer surface: no shared top-level resource prefix. Every entity is
# addressed at the root (`/organizations`, `/rating-cycles`, `/appeals`, ...)
# and linked by foreign keys carried in request bodies / query filters.
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - optimistic_concurrency

  entity_topology: flat
  # Thirteen peer entities joined by explicit FK fields; zero nesting in URL
  # paths for writes. Sub-resource GETs exist only as reverse-reachability
  # read channels for cascade-created children (DimensionScore,
  # StandardEvaluation, PublicComment).

  state_machine_shape: cyclic
  # RatingCycle loops DATA_COLLECTION -> SCORED -> ORG_REVIEW ->
  # CORRECTION_REQUESTED -> DATA_COLLECTION (bounded at 2 correction rounds),
  # and ORG_REVIEW -> SCORED on a substantiated complaint re-score.
  # MethodologyVersion loops COMMENT_CLOSED -> DRAFT on revision. Appeal and
  # Complaint are 3-way branching machines with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Organization -> RatingCycle -> DimensionScore
    - self_referential     # MethodologyVersion.supersedes_version_id
    - cross_aggregate      # Complaint -> RatingCycle.DimensionScore penalty
    - polymorphic          # CorrectionRequest.target_kind selects which
                           # aggregate (FilingRecord vs GovernanceProfile)
                           # the accepted change rewrites

  role_model: segregation_of_duties
  # The RatingAnalyst who scores a cycle may not publish it; the
  # PublishingReviewer who publishes may not sit on its appeal panel; the
  # MethodologyAdmin owns methodology + waivers but never scores.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Targets: 13 entities, 55 endpoints, 49 error codes, 8 calculations
  # (3 with variants), 6 state machines (2 cyclic, 2 branching).

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the rated charity.
        constraints: 1..200 chars, non-blank
      - name: ein
        type: string
        source: input
        description: Employer identification number; the charity's public tax id.
        constraints: "exactly 9 digits; unique across all Organization rows -> ERR_DUPLICATE_EIN"
      - name: org_type
        type: enum
        source: input
        description: Drives every methodology adjustment in program_expense_ratio and the NOT_APPLICABLE standard set.
        constraints: "PUBLIC_CHARITY | PRIVATE_FOUNDATION | RELIGIOUS_CONGREGATION | DONOR_ADVISED_SPONSOR | MEMBERSHIP_ASSOCIATION"
      - name: fiscal_year_end_month
        type: integer
        source: input
        description: Calendar month in which the charity closes its books.
        constraints: 1..12
      - name: contact_email
        type: string
        source: input
        description: Address that receives publication change notifications.
        constraints: must contain '@'
      - name: latest_published_score
        type: number
        source: computed
        description: published_score of the PublicationRecord for this Organization with the highest sequence_number; null until the first publication.
        default: null
        constraints: 2 decimal places
      - name: latest_published_grade
        type: enum
        source: computed
        description: published_grade of the same PublicationRecord as latest_published_score.
        default: null
        constraints: "ACCREDITED | MEETS_STANDARDS | NEEDS_IMPROVEMENT | DOES_NOT_MEET | UNRATED | null"
      - name: published_cycle_count
        type: integer
        source: computed
        description: Count of PublicationRecord rows whose organization_id equals this Organization.id.
        default: 0
      - name: trend_direction
        type: enum
        source: computed
        description: change_direction of the highest-sequence_number PublicationRecord, with FIRST_PUBLICATION mapped to NOT_APPLICABLE.
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | IMPROVED | UNCHANGED | DECLINED"
      - name: transition_grace_until
        type: datetime
        source: computed
        description: grace_until of the TransitionGrant for this Organization with status == ACTIVE; null when no such grant exists.
        default: null
      - name: substantiated_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows for this Organization with status == SUBSTANTIATED.
        default: 0

  - name: MethodologyVersion
    parent: null
    common_fields: true
    fields:
      - name: version_label
        type: string
        source: input
        description: Human-readable methodology label published alongside every rating.
        constraints: "1..32 chars; unique across all MethodologyVersion rows -> ERR_DUPLICATE_VERSION_LABEL"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the MethodologyVersion state machine.
        default: DRAFT
        constraints: "DRAFT | COMMENT_OPEN | COMMENT_CLOSED | ADOPTED | RETIRED"
      - name: supersedes_version_id
        type: string
        source: input
        description: "FK -> MethodologyVersion.id; the version this revision replaces; null for the first methodology ever created."
        default: null
      - name: weight_financial_health
        type: number
        source: input
        description: Weight applied to the FINANCIAL_HEALTH dimension's normalized_score.
        constraints: 0.0000..1.0000, 4 decimal places
      - name: weight_accountability
        type: number
        source: input
        description: Weight applied to the ACCOUNTABILITY dimension's normalized_score.
        constraints: 0.0000..1.0000, 4 decimal places
      - name: weight_transparency
        type: number
        source: input
        description: Weight applied to the TRANSPARENCY dimension's normalized_score.
        constraints: 0.0000..1.0000, 4 decimal places
      - name: weight_impact
        type: number
        source: input
        description: Weight applied to the IMPACT dimension's normalized_score.
        constraints: "0.0000..1.0000; the four weights must sum to exactly 1.0000 -> ERR_WEIGHTS_NOT_NORMALIZED"
      - name: dimension_floor_score
        type: number
        source: input
        description: Minimum normalized_score every included dimension must reach for grades ACCREDITED / MEETS_STANDARDS.
        default: 40.0
        constraints: 0.00..100.00
      - name: comment_period_days
        type: integer
        source: input
        description: Length of the public comment window opened by open-comment.
        default: 30
        constraints: 7..120
      - name: transition_period_days
        type: integer
        source: input
        description: Days of grace granted to affected Organizations when this version is adopted.
        default: 90
        constraints: 0..365
      - name: comment_open_at
        type: datetime
        source: system
        description: Logical-clock instant at which open-comment ran.
        default: null
      - name: comment_closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which close-comment ran.
        default: null
      - name: comment_deadline_at
        type: datetime
        source: computed
        description: comment_open_at plus comment_period_days; the window is inclusive at this instant and public comments are refused strictly after it.
        default: null
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant at which adopt ran.
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant at which a successor's adoption retired this version.
        default: null
      - name: effective_from
        type: datetime
        source: input
        description: Start of this version's effectivity window; supplied to adopt, null while unadopted.
        default: null
      - name: effective_until
        type: datetime
        source: input
        description: End of this version's effectivity window; supplied to adopt, null while unadopted.
        default: null
      - name: revision_note
        type: string
        source: input
        description: Reason recorded when close-comment is reversed by return-to-draft.
        default: null
      - name: comment_count
        type: integer
        source: computed
        description: Count of PublicComment rows whose methodology_version_id equals this row's id.
        default: 0
      - name: unresolved_comment_count
        type: integer
        source: computed
        description: Count of PublicComment rows for this version with status == SUBMITTED.
        default: 0

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - name: methodology_version_id
        type: string
        source: input
        description: "FK -> MethodologyVersion.id; the version under public comment."
      - name: commenter_kind
        type: enum
        source: input
        description: Declared standing of the commenter.
        constraints: "DONOR | RATED_ORGANIZATION | PUBLIC"
      - name: commenter_user_id
        type: string
        source: system
        description: X-User-ID of the caller that submitted the comment.
      - name: body
        type: string
        source: input
        description: Comment text.
        constraints: 1..2000 chars, non-blank
      - name: status
        type: enum
        source: system
        description: SUBMITTED until a MethodologyAdmin disposes of it.
        default: SUBMITTED
        constraints: "SUBMITTED | INCORPORATED | DECLINED"
      - name: disposition_note
        type: string
        source: input
        description: Rationale recorded by dispose.
        default: null

  - name: TransitionGrant
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: system
        description: "FK -> Organization.id; the Organization whose projected score drops under the newly adopted methodology."
      - name: methodology_version_id
        type: string
        source: system
        description: "FK -> MethodologyVersion.id; the newly ADOPTED version whose adoption created this grant."
      - name: superseded_version_label
        type: string
        source: system
        description: version_label of the MethodologyVersion retired by the adoption, i.e. the version affected cycles stay pinned to.
      - name: status
        type: enum
        source: system
        description: ACTIVE at creation; CONSUMED once a new cycle is opened under the superseded version with use_transition_grant true; EXPIRED once the transition sweep passes grace_until.
        default: ACTIVE
        constraints: "ACTIVE | CONSUMED | EXPIRED"
      - name: grace_until
        type: datetime
        source: computed
        description: adopted_at of the new version plus its transition_period_days.
      - name: trigger_reason
        type: enum
        source: computed
        description: WEIGHT_CHANGE when any of the four weights differs from the superseded version, otherwise THRESHOLD_TIGHTENED.
        constraints: "WEIGHT_CHANGE | THRESHOLD_TIGHTENED"
      - name: projected_score_delta
        type: number
        source: computed
        description: methodology_impact_projection output minus Organization.latest_published_score, 2 decimal places, always <= -5.00 for a persisted grant.

  - name: RatingCycle
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity under review."
      - name: methodology_version_id
        type: string
        source: input
        description: "FK -> MethodologyVersion.id; pinned at creation and never rewritten, even after the version is RETIRED."
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year whose filings feed this review.
        constraints: 2000..2100
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the review period this cycle occupies on the Organization timeline.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the review period; interval semantics are half-open [period_start, period_end).
        constraints: must be strictly after period_start
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the RatingCycle state machine.
        default: DATA_COLLECTION
        constraints: "DATA_COLLECTION | SCORED | ORG_REVIEW | CORRECTION_REQUESTED | APPEAL_OPEN | APPEAL_RESOLVED | PUBLISHED | WITHDRAWN"
      - name: assigned_analyst_user_id
        type: string
        source: input
        description: X-User-ID of the RatingAnalyst permitted to score this cycle and decide its corrections.
      - name: publishing_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the PublishingReviewer that published the cycle; null until PUBLISHED.
        default: null
      - name: correction_round
        type: integer
        source: computed
        description: Count of CorrectionRequest rows for this cycle with status == ACCEPTED; capped at 2 by ERR_CORRECTION_ROUND_LIMIT.
        default: 0
      - name: review_opened_at
        type: datetime
        source: system
        description: Logical-clock instant at which open-org-review ran; cleared when the cycle leaves ORG_REVIEW without publishing.
        default: null
      - name: correction_deadline_at
        type: datetime
        source: computed
        description: review_opened_at plus CORRECTION_WINDOW_DAYS; publication is refused before this instant.
        default: null
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: Instant at which the sole open CorrectionRequest was REJECTED plus APPEAL_WINDOW_DAYS; appeals filed at or after it are refused.
        default: null
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication.
        default: null
      - name: program_expense_ratio
        type: number
        source: computed
        description: Output of the program_expense_ratio calculation, 4 decimal places.
        default: null
      - name: fundraising_efficiency
        type: number
        source: computed
        description: Output of the fundraising_efficiency_3yr calculation, 4 decimal places.
        default: null
      - name: months_of_reserve
        type: number
        source: computed
        description: Output of the months_of_reserve calculation, 2 decimal places.
        default: null
      - name: failed_standard_count
        type: integer
        source: computed
        description: Count of StandardEvaluation rows with result == NOT_MET on this cycle's GovernanceProfile.
        default: 0
      - name: accountability_penalty_points
        type: integer
        source: computed
        description: Sum of penalty_points_applied over Complaint rows with status == SUBSTANTIATED and penalized_rating_cycle_id equal to this cycle's id.
        default: 0
      - name: data_completeness_pct
        type: number
        source: computed
        description: Weighted completeness across the four DimensionScore rows, 2 decimal places; gates publication and the UNRATED grade.
        default: null
      - name: weighted_sum_provisional
        type: number
        source: computed
        description: Provisional-variant weighted sum before the standards penalty, 2 decimal places.
        default: null
      - name: provisional_composite_score
        type: number
        source: computed
        description: Provisional-variant output of composite_score_with_penalty, set by score and re-set by every recompute, 2 decimal places.
        default: null
      - name: provisional_grade
        type: enum
        source: computed
        description: Grade band of provisional_composite_score at score time.
        default: null
        constraints: "ACCREDITED | MEETS_STANDARDS | NEEDS_IMPROVEMENT | DOES_NOT_MEET | UNRATED | null"
      - name: weighted_sum_final
        type: number
        source: computed
        description: Final-variant weighted sum before the standards penalty, computed only at publication, 2 decimal places.
        default: null
      - name: final_composite_score
        type: number
        source: computed
        description: Final-variant output of composite_score_with_penalty, computed only at publication, 2 decimal places.
        default: null
      - name: grade
        type: enum
        source: computed
        description: Grade band of final_composite_score; null until publication.
        default: null
        constraints: "ACCREDITED | MEETS_STANDARDS | NEEDS_IMPROVEMENT | DOES_NOT_MEET | UNRATED | null"
      - name: standards_penalty_points
        type: number
        source: computed
        description: Penalty subtracted from the weighted sum by composite_score_with_penalty step 4, 2 decimal places.
        default: null
      - name: methodology_pin_locked
        type: boolean
        source: computed
        description: Set true when a TransitionGrant is created for this cycle's Organization while the cycle is non-terminal, marking the pinned version as frozen.
        default: false
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason recorded by withdraw.
        default: null

  - name: DimensionScore
    parent: null
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; the cycle this dimension row belongs to."
      - name: dimension
        type: enum
        source: system
        description: Which of the four methodology dimensions this row scores; exactly one row per dimension per cycle.
        constraints: "FINANCIAL_HEALTH | ACCOUNTABILITY | TRANSPARENCY | IMPACT"
      - name: raw_points
        type: integer
        source: computed
        description: Points earned per the dimension_raw_points calculation, or the analyst-supplied value after a dimension override.
        constraints: 0..max_points
      - name: max_points
        type: integer
        source: computed
        description: DIMENSION_MAX_POINTS constant for this dimension (40 / 24 / 20 / 12).
      - name: normalized_score
        type: number
        source: computed
        description: raw_points divided by max_points times 100, 2 decimal places, round_half_up.
      - name: weight_applied
        type: number
        source: computed
        description: Weight the FINAL composite variant assigned this dimension, 4 decimal places; 0.0000 when the final variant excluded the dimension for having zero data completeness. The provisional variant's declared weight is not stored on the row.
        default: null
      - name: weighted_contribution
        type: number
        source: computed
        description: normalized_score times weight_applied rounded to 2 decimal places, the addend that entered the weighted sum.
        default: null
      - name: data_completeness_pct
        type: number
        source: computed
        description: 100.00 when this dimension's evidence set is present, 0.00 when it is empty; see dimension_data_completeness.
      - name: penalty_points
        type: integer
        source: computed
        description: Complaint penalty currently deducted from this row's raw_points; non-zero only on the ACCOUNTABILITY row.
        default: 0
      - name: status
        type: enum
        source: system
        description: COMPUTED after score, OVERRIDDEN after a dimension override, STALE once source data or penalties change.
        default: PENDING
        constraints: "PENDING | COMPUTED | OVERRIDDEN | STALE"
      - name: override_reason
        type: string
        source: input
        description: Justification recorded by the dimension-overrides endpoint.
        default: null
      - name: overridden_by_user_id
        type: string
        source: system
        description: X-User-ID of the RatingAnalyst that overrode raw_points.
        default: null

  - name: FilingRecord
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the filing's subject charity."
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the figures describe.
        constraints: 2000..2100
      - name: source_kind
        type: enum
        source: input
        description: Provenance of the figures; determines source_precedence.
        constraints: "AUDITED_STATEMENT | PUBLIC_FILING | ORG_SUBMISSION"
      - name: source_precedence
        type: integer
        source: computed
        description: 1 for AUDITED_STATEMENT, 2 for PUBLIC_FILING, 3 for ORG_SUBMISSION; the winning filing is the lowest precedence.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the FilingRecord state machine.
        default: RECEIVED
        constraints: "RECEIVED | VALIDATED | REJECTED | SUPERSEDED"
      - name: total_expense_cents
        type: integer
        source: input
        description: Total functional expenses in cents.
        constraints: ">= 0; must equal program_expense_cents + fundraising_expense_cents + admin_expense_cents -> ERR_EXPENSE_COMPONENTS_MISMATCH"
      - name: program_expense_cents
        type: integer
        source: input
        description: Expenses classified as program services, before methodology adjustment.
        constraints: ">= 0"
      - name: fundraising_expense_cents
        type: integer
        source: input
        description: Expenses classified as fundraising.
        constraints: ">= 0"
      - name: admin_expense_cents
        type: integer
        source: input
        description: Expenses classified as management and general.
        constraints: ">= 0"
      - name: contributions_cents
        type: integer
        source: input
        description: Contributions, gifts and grants received; denominator of fundraising efficiency.
        constraints: ">= 0"
      - name: total_revenue_cents
        type: integer
        source: input
        description: Total revenue for the fiscal year.
        constraints: ">= 0"
      - name: net_assets_cents
        type: integer
        source: input
        description: Unrestricted net assets at year end; numerator of months_of_reserve.
        constraints: ">= 0"
      - name: total_liabilities_cents
        type: integer
        source: input
        description: Total liabilities at year end.
        constraints: ">= 0"
      - name: grants_paid_cents
        type: integer
        source: input
        description: Grants paid to other organizations; entered by the PRIVATE_FOUNDATION and DONOR_ADVISED_SPONSOR adjustments.
        default: 0
        constraints: ">= 0"
      - name: membership_services_cents
        type: integer
        source: input
        description: Member services spend; entered by the MEMBERSHIP_ASSOCIATION adjustment.
        default: 0
        constraints: ">= 0"
      - name: joint_cost_allocated_cents
        type: integer
        source: input
        description: Joint costs allocated from fundraising appeals into program services; stripped back out by the PUBLIC_CHARITY and DONOR_ADVISED_SPONSOR adjustments.
        default: 0
        constraints: ">= 0; <= program_expense_cents"
      - name: origin
        type: enum
        source: system
        description: ORG_PORTAL when an OrganizationRep posted it, ANALYST_ENTRY when a RatingAnalyst posted it, CORRECTION_APPLIED when an accepted correction or granted appeal synthesized it.
        constraints: "ORG_PORTAL | ANALYST_ENTRY | CORRECTION_APPLIED"
      - name: validated_at
        type: datetime
        source: system
        description: Logical-clock instant of the validate decision.
        default: null
      - name: rejection_code
        type: string
        source: input
        description: Analyst-supplied reason code recorded when validate decides REJECTED.
        default: null
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which a newer filing for the same triple displaced this row.
        default: null

  - name: GovernanceProfile
    parent: null
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id; at most one GovernanceProfile per cycle -> ERR_DUPLICATE_GOVERNANCE_PROFILE."
      - name: board_member_count
        type: integer
        source: input
        description: Number of voting board members.
        constraints: 0..100
      - name: independent_board_member_count
        type: integer
        source: input
        description: Board members with no compensated or family relationship to the charity.
        constraints: "0..board_member_count"
      - name: conflict_of_interest_policy_on_file
        type: boolean
        source: input
        description: Whether a written conflict-of-interest policy has been filed.
      - name: coi_policy_reviewed_at
        type: datetime
        source: input
        description: Date the board last reviewed the conflict-of-interest policy; null when never reviewed.
        default: null
      - name: board_meetings_last_year
        type: integer
        source: input
        description: Number of full-board meetings held in the reported year.
        constraints: 0..52
      - name: audit_committee_exists
        type: boolean
        source: input
        description: Whether a standing audit committee is seated.
      - name: whistleblower_policy
        type: boolean
        source: input
        description: Whether a written whistleblower policy has been filed.
      - name: ceo_compensation_reviewed
        type: boolean
        source: input
        description: Whether the board documented a comparability review of chief-executive compensation.
      - name: impact_report_on_file
        type: boolean
        source: input
        description: Whether an annual outcomes report has been filed; IMPACT evidence signal.
      - name: outcome_measures_count
        type: integer
        source: input
        description: Number of published outcome measures; IMPACT evidence signal.
        constraints: 0..50
      - name: third_party_evaluation_on_file
        type: boolean
        source: input
        description: Whether an independent programme evaluation has been filed; IMPACT evidence signal.
      - name: independence_ratio
        type: number
        source: computed
        description: independent_board_member_count divided by board_member_count, 4 decimal places; 0.0000 when board_member_count == 0.
        default: null
      - name: evaluation_status
        type: enum
        source: system
        description: PENDING until evaluate creates the eight StandardEvaluation rows.
        default: PENDING
        constraints: "PENDING | EVALUATED"
      - name: evaluated_at
        type: datetime
        source: system
        description: Logical-clock instant at which evaluate ran.
        default: null
      - name: standards_met_count
        type: integer
        source: computed
        description: Count of this profile's StandardEvaluation rows with result == MET.
        default: 0
      - name: standards_not_met_count
        type: integer
        source: computed
        description: Count of this profile's StandardEvaluation rows with result == NOT_MET.
        default: 0
      - name: standards_waived_count
        type: integer
        source: computed
        description: Count of this profile's StandardEvaluation rows with result == WAIVED.
        default: 0
      - name: standards_not_applicable_count
        type: integer
        source: computed
        description: Count of this profile's StandardEvaluation rows with result == NOT_APPLICABLE.
        default: 0

  - name: StandardEvaluation
    parent: null
    common_fields: true
    fields:
      - name: governance_profile_id
        type: string
        source: system
        description: "FK -> GovernanceProfile.id; the profile this standard was evaluated against."
      - name: standard_code
        type: enum
        source: system
        description: Which governance standard this row records; evaluate creates exactly one row per code.
        constraints: "BOARD_SIZE_MIN | BOARD_INDEPENDENCE | COI_POLICY | COI_POLICY_CURRENCY | BOARD_MEETING_FREQUENCY | AUDIT_COMMITTEE | WHISTLEBLOWER_POLICY | CEO_COMP_REVIEW"
      - name: result
        type: enum
        source: computed
        description: MET or NOT_MET from the standards_evaluation calculation; NOT_APPLICABLE for codes exempted by org_type; WAIVED only via the waive endpoint.
        constraints: "MET | NOT_MET | WAIVED | NOT_APPLICABLE"
      - name: observed_value
        type: string
        source: computed
        description: Stringified value observed on the GovernanceProfile for this standard.
      - name: required_value
        type: string
        source: computed
        description: Stringified threshold the standard demands.
      - name: waiver_reason
        type: string
        source: input
        description: Justification recorded by waive; cleared by revoke-waiver.
        default: null
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the MethodologyAdmin that waived the standard; cleared by revoke-waiver.
        default: null
      - name: evaluated_at
        type: datetime
        source: system
        description: Logical-clock instant at which evaluate produced this row.

  - name: CorrectionRequest
    parent: null
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id; the cycle whose pre-publication figures the charity disputes."
      - name: submitted_by_org_user_id
        type: string
        source: system
        description: X-User-ID of the OrganizationRep that filed the request.
      - name: round_number
        type: integer
        source: computed
        description: RatingCycle.correction_round at filing time plus 1.
      - name: target_kind
        type: enum
        source: input
        description: Which aggregate an acceptance rewrites - FILING_FINANCIAL supersedes a FilingRecord, GOVERNANCE_DISCLOSURE rewrites the GovernanceProfile field.
        constraints: "FILING_FINANCIAL | GOVERNANCE_DISCLOSURE"
      - name: target_fiscal_year
        type: integer
        source: input
        description: fiscal_year of the FilingRecord an acceptance supersedes; required when target_kind == FILING_FINANCIAL, null otherwise.
        default: null
      - name: target_source_kind
        type: enum
        source: input
        description: source_kind of the FilingRecord an acceptance supersedes; required when target_kind == FILING_FINANCIAL, null otherwise.
        default: null
        constraints: "AUDITED_STATEMENT | PUBLIC_FILING | ORG_SUBMISSION | null"
      - name: target_field_name
        type: string
        source: input
        description: Name of the single field the charity wants changed.
        constraints: "one of the input fields of FilingRecord or GovernanceProfile"
      - name: proposed_value
        type: string
        source: input
        description: Stringified replacement value applied verbatim on acceptance.
      - name: narrative
        type: string
        source: input
        description: The charity's explanation of the disputed figure.
        constraints: 1..2000 chars, non-blank
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the CorrectionRequest state machine.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_ANALYST_REVIEW | ACCEPTED | REJECTED"
      - name: claimed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RatingAnalyst that claimed the request.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID recorded on the accept/reject decision, or null when a cascade rejected the request.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Rationale recorded on decide, or the cascade's fixed note.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant at which the request reached ACCEPTED or REJECTED.
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id; the cycle under appeal."
      - name: correction_request_id
        type: string
        source: input
        description: "FK -> CorrectionRequest.id; the REJECTED correction this appeal contests."
      - name: filed_by_org_user_id
        type: string
        source: system
        description: X-User-ID of the OrganizationRep that filed the appeal.
      - name: grounds
        type: string
        source: input
        description: The charity's argument for overturning the rejection.
        constraints: 1..2000 chars, non-blank
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the Appeal state machine.
        default: FILED
        constraints: "FILED | PANEL_ASSIGNED | GRANTED | DENIED | DISMISSED"
      - name: panel_member_user_ids
        type: array
        source: input
        description: Exactly three distinct AppealPanelist X-User-IDs, none equal to the cycle's assigned_analyst_user_id or publishing_reviewer_user_id.
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the appeal was filed.
      - name: deadline_at
        type: datetime
        source: computed
        description: Copy of RatingCycle.appeal_deadline_at at filing time, retained for audit.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the panel member that recorded the decision, or null when a cascade dismissed the appeal.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Rationale recorded on decide, or the cascade's fixed note.
        default: null

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity the concern is about."
      - name: penalized_rating_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; the cycle selected by the complaint_penalty_target selector when the complaint was substantiated; null otherwise."
        default: null
      - name: complainant_kind
        type: enum
        source: input
        description: Standing of the complainant; a credibility input.
        constraints: "DONOR | BENEFICIARY | EMPLOYEE | ANONYMOUS"
      - name: complainant_user_id
        type: string
        source: system
        description: X-User-ID of the caller that filed the complaint.
      - name: category
        type: enum
        source: input
        description: Concern category; a credibility input.
        constraints: "MISUSE_OF_FUNDS | GOVERNANCE | SOLICITATION_PRACTICE | TRANSPARENCY | OTHER"
      - name: narrative
        type: string
        source: input
        description: The donor's account of the concern.
        constraints: 1..4000 chars, non-blank
      - name: corroborating_document_count
        type: integer
        source: input
        description: Number of supporting documents supplied; a credibility input, counted up to 3.
        default: 0
        constraints: 0..50
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the Complaint state machine.
        default: INTAKE
        constraints: "INTAKE | INVESTIGATING | SUBSTANTIATED | UNSUBSTANTIATED | CLOSED_NO_ACTION | REFERRED_OUT"
      - name: credibility_score
        type: number
        source: computed
        description: Output of complaint_credibility_score under whichever variant last ran, 2 decimal places.
        default: null
      - name: credibility_variant
        type: enum
        source: computed
        description: Which variant produced credibility_score - INTAKE at triage, INVESTIGATED at resolve.
        default: null
        constraints: "INTAKE | INVESTIGATED | null"
      - name: severity_tier
        type: enum
        source: computed
        description: HIGH when credibility_score >= 80.00, MEDIUM when >= 50.00, otherwise LOW; caps penalty_points_applied.
        default: null
        constraints: "LOW | MEDIUM | HIGH | null"
      - name: investigation_due_at
        type: datetime
        source: computed
        description: Triage instant plus INVESTIGATION_DAYS.
        default: null
      - name: penalty_points_applied
        type: integer
        source: input
        description: ACCOUNTABILITY raw_points deducted on substantiation; returns to 0 when the finding is reversed.
        default: 0
        constraints: 1..15 when supplied, capped by severity_tier
      - name: triage_note
        type: string
        source: input
        description: Analyst note recorded by triage.
        default: null
      - name: finding_note
        type: string
        source: input
        description: Analyst note recorded by resolve.
        default: null
      - name: referred_to
        type: string
        source: input
        description: External authority named when triage disposition is REFER_OUT.
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: Justification recorded by reverse-finding.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant at which the complaint reached a resolved status.
        default: null

  - name: PublicationRecord
    parent: null
    common_fields: false
    fields:
      - name: rating_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; the published cycle."
      - name: organization_id
        type: string
        source: system
        description: "FK -> Organization.id; the rated charity, denormalized for trend queries."
      - name: sequence_number
        type: integer
        source: computed
        description: Count of pre-existing PublicationRecord rows for this Organization plus 1; 1-based and gap-free.
      - name: published_score
        type: number
        source: computed
        description: Copy of RatingCycle.final_composite_score at publication, 2 decimal places; immutable thereafter.
      - name: published_grade
        type: enum
        source: computed
        description: Copy of RatingCycle.grade at publication.
        constraints: "ACCREDITED | MEETS_STANDARDS | NEEDS_IMPROVEMENT | DOES_NOT_MEET | UNRATED"
      - name: previous_published_score
        type: number
        source: computed
        description: published_score of the PublicationRecord with sequence_number one lower for the same Organization; null when sequence_number == 1.
        default: null
      - name: score_delta
        type: number
        source: computed
        description: published_score minus previous_published_score, 2 decimal places; null when sequence_number == 1.
        default: null
      - name: change_direction
        type: enum
        source: computed
        description: FIRST_PUBLICATION when sequence_number == 1, else IMPROVED / UNCHANGED / DECLINED by the sign of score_delta.
        constraints: "FIRST_PUBLICATION | IMPROVED | UNCHANGED | DECLINED"
      - name: methodology_version_label
        type: string
        source: computed
        description: version_label of the MethodologyVersion pinned on the published cycle.
      - name: weighted_sum_final
        type: number
        source: computed
        description: Copy of RatingCycle.weighted_sum_final, 2 decimal places.
      - name: standards_penalty_points
        type: number
        source: computed
        description: Copy of RatingCycle.standards_penalty_points, 2 decimal places.
      - name: notified_recipient_kinds
        type: array
        source: computed
        description: Ordered recipient list; always starts with RATED_ORGANIZATION and appends MEDIA when change_direction != FIRST_PUBLICATION and abs(score_delta) >= 10.00.
      - name: published_at
        type: datetime
        source: computed
        description: Copy of RatingCycle.published_at.

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  - entity: MethodologyVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: COMMENT_OPEN
        trigger: "POST /methodology-versions/{methodology_version_id}/open-comment"
        actor: MethodologyAdmin
        preconditions:
          - "status == DRAFT else ERR_METHODOLOGY_STATE_INVALID"
        side_effects:
          - "sets comment_open_at = logical clock"
          - "sets comment_deadline_at = comment_open_at + comment_period_days"
          - "increments MethodologyVersion.version by 1"
      - from: COMMENT_OPEN
        to: COMMENT_CLOSED
        trigger: "POST /methodology-versions/{methodology_version_id}/close-comment"
        actor: MethodologyAdmin
        preconditions:
          - "status == COMMENT_OPEN else ERR_METHODOLOGY_STATE_INVALID"
        side_effects:
          - "sets comment_closed_at = logical clock"
          - "recomputes comment_count and unresolved_comment_count"
          - "increments MethodologyVersion.version by 1"
        note: "Closing the window does not dispose of comments; unresolved_comment_count still blocks adoption."
      - from: COMMENT_CLOSED
        to: DRAFT
        trigger: "POST /methodology-versions/{methodology_version_id}/return-to-draft"
        actor: MethodologyAdmin
        preconditions:
          - "status == COMMENT_CLOSED else ERR_METHODOLOGY_STATE_INVALID"
        side_effects:
          - "stores revision_note"
          - "clears comment_open_at, comment_deadline_at and comment_closed_at to null"
          - "increments MethodologyVersion.version by 1"
        note: "Revision loop: a revised draft must run a fresh comment period before it can be adopted, so COMMENT_CLOSED -> DRAFT -> COMMENT_OPEN is a genuine cycle."
      - from: COMMENT_CLOSED
        to: ADOPTED
        trigger: "POST /methodology-versions/{methodology_version_id}/adopt"
        actor: MethodologyAdmin
        preconditions:
          - "status == COMMENT_CLOSED else ERR_METHODOLOGY_STATE_INVALID"
          - "unresolved_comment_count == 0 else ERR_UNRESOLVED_COMMENTS"
          - "when effective_until is supplied: effective_until > effective_from else ERR_METHODOLOGY_WINDOW_CONFLICT (see §1.4 priority 17, which owns every effectivity-window check on this endpoint)"
          - "when a MethodologyVersion with status == ADOPTED exists AND its effective_until is not null: effective_from >= that version's effective_until + METHODOLOGY_BUFFER_DAYS else ERR_METHODOLOGY_WINDOW_CONFLICT. An open-ended predecessor (effective_until null) imposes no lower bound beyond the clock buffer, because this adoption is precisely what closes its window at effective_from"
        side_effects:
          - "hop 1: sets status = ADOPTED, adopted_at = logical clock, effective_from and effective_until from the request"
          - "hop 1: the MethodologyVersion with status == ADOPTED (if any) transitions to RETIRED with retired_at = logical clock"
          - "hop 2 (caused by hop 1's retirement): for every Organization with published_cycle_count >= 1 the methodology_impact_projection calculation runs against the DimensionScore rows of the cycle named by that Organization's highest-sequence_number PublicationRecord; each Organization whose projected_score_delta <= -5.00 gets one TransitionGrant with status = ACTIVE, grace_until = adopted_at + transition_period_days, superseded_version_label = the retired version's version_label and trigger_reason per its definition"
          - "hop 3 (caused by hop 2's grant creation): each granted Organization's transition_grace_until is set to that grant's grace_until and Organization.version increments by 1; every RatingCycle of that Organization whose status is not in {PUBLISHED, WITHDRAWN} sets methodology_pin_locked = true and keeps its pinned methodology_version_id unchanged"
          - "increments MethodologyVersion.version by 1 on both the adopted and the retired row"
      - from: ADOPTED
        to: RETIRED
        trigger: "system: a successor MethodologyVersion is adopted"
        actor: system
        preconditions:
          - "a different MethodologyVersion is transitioning COMMENT_CLOSED -> ADOPTED"
        side_effects:
          - "sets retired_at = logical clock"
          - "increments MethodologyVersion.version by 1"
          - "cycles already pinned to this version keep the pin and publish normally, because methodology_pin_locked was set at creation; only a NEW cycle pinned to the superseded version needs a TransitionGrant"

  - entity: FilingRecord
    initial_state: RECEIVED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /filing-records/{filing_record_id}/validate with decision == ACCEPT"
        actor: RatingAnalyst
        preconditions:
          - "status == RECEIVED else ERR_FILING_STATE_INVALID"
        side_effects:
          - "sets validated_at = logical clock"
          - "any other FilingRecord with the same organization_id, fiscal_year and source_kind whose status == VALIDATED transitions to SUPERSEDED"
          - "increments FilingRecord.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /filing-records/{filing_record_id}/validate with decision == REJECT"
        actor: RatingAnalyst
        preconditions:
          - "status == RECEIVED else ERR_FILING_STATE_INVALID"
          - "rejection_code present else ERR_INVALID_REQUEST"
        side_effects:
          - "stores rejection_code"
          - "increments FilingRecord.version by 1"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system: a newer FilingRecord for the same (organization_id, fiscal_year, source_kind) triple reaches VALIDATED, or an accepted CorrectionRequest / granted Appeal synthesizes a replacement"
        actor: system
        preconditions:
          - "status == VALIDATED"
        side_effects:
          - "sets superseded_at = logical clock"
          - "increments FilingRecord.version by 1"
          - "at most one FilingRecord per (organization_id, fiscal_year, source_kind) may hold status == VALIDATED at any instant"

  - entity: DimensionScore
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COMPUTED
        trigger: "POST /rating-cycles/{rating_cycle_id}/score"
        actor: RatingAnalyst
        preconditions:
          - "the parent RatingCycle is transitioning DATA_COLLECTION -> SCORED"
        side_effects:
          - "sets raw_points, max_points, normalized_score, data_completeness_pct per the dimension_raw_points and dimension_data_completeness calculations"
          - "increments DimensionScore.version by 1"
      - from: COMPUTED
        to: OVERRIDDEN
        trigger: "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
        actor: RatingAnalyst
        preconditions:
          - "the parent RatingCycle.status == SCORED else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "replaces raw_points with the supplied value, recomputes normalized_score, stores override_reason and overridden_by_user_id"
          - "increments DimensionScore.version by 1"
      - from: COMPUTED
        to: STALE
        trigger: "system: a Complaint penalty lands on the ACCOUNTABILITY row, an accepted CorrectionRequest supersedes a source FilingRecord, or the cycle is withdrawn"
        actor: system
        preconditions:
          - "status == COMPUTED"
        side_effects:
          - "sets status = STALE; the parent cycle immediately recomputes its provisional figures from the adjusted rows, while its final figures stay as last written until the next score call"
          - "increments DimensionScore.version by 1"
      - from: OVERRIDDEN
        to: STALE
        trigger: "system: same triggers as COMPUTED -> STALE"
        actor: system
        preconditions:
          - "status == OVERRIDDEN"
        side_effects:
          - "sets status = STALE; the override value is discarded when the cycle is re-scored"
          - "increments DimensionScore.version by 1"
      - from: STALE
        to: COMPUTED
        trigger: "POST /rating-cycles/{rating_cycle_id}/score after the cycle returned to DATA_COLLECTION, or a Complaint reverse-finding that restores the ACCOUNTABILITY row"
        actor: RatingAnalyst
        preconditions:
          - "status == STALE"
        side_effects:
          - "recomputes raw_points from source data (discarding any prior override) and recomputes normalized_score"
          - "increments DimensionScore.version by 1"
        note: "STALE -> COMPUTED -> STALE is a genuine loop driven by complaint findings and their reversals."
      - from: OVERRIDDEN
        to: OVERRIDDEN
        trigger: "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
        actor: RatingAnalyst
        preconditions:
          - "the parent RatingCycle.status == SCORED else ERR_CYCLE_STATE_INVALID"
          - "expected_rating_cycle_version equals the cycle's current version else ERR_STALE_VERSION"
        side_effects:
          - "replaces raw_points with the newly supplied value and overwrites override_reason and overridden_by_user_id"
          - "increments DimensionScore.version by 1"
        note: "A later override legitimately supersedes an earlier one; no state precondition catches it, which is why OCC on the parent cycle is required."
      - from: STALE
        to: OVERRIDDEN
        trigger: "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
        actor: RatingAnalyst
        preconditions:
          - "the parent RatingCycle.status == SCORED else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "replaces raw_points with the supplied value, recomputes normalized_score, stores override_reason and overridden_by_user_id"
          - "increments DimensionScore.version by 1"
        note: "An analyst may override a row a complaint penalty left STALE without re-running the whole pipeline."

  - entity: RatingCycle
    initial_state: DATA_COLLECTION
    terminal_states: [PUBLISHED, WITHDRAWN]
    transitions:
      - from: DATA_COLLECTION
        to: SCORED
        trigger: "POST /rating-cycles/{rating_cycle_id}/score"
        actor: RatingAnalyst
        preconditions:
          - "status == DATA_COLLECTION else ERR_CYCLE_STATE_INVALID"
          - "X-User-ID == assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
          - "at least one FilingRecord exists with organization_id == this cycle's organization_id, fiscal_year == this cycle's fiscal_year and status == VALIDATED else ERR_NO_VALIDATED_FILING"
          - "a GovernanceProfile exists with rating_cycle_id == this cycle's id and evaluation_status == EVALUATED else ERR_GOVERNANCE_NOT_EVALUATED"
        side_effects:
          - "creates the four DimensionScore rows on first score (PENDING -> COMPUTED); on a re-score after a correction round the existing rows go STALE -> COMPUTED and any override value is discarded"
          - "computes program_expense_ratio, fundraising_efficiency and months_of_reserve from the winning FilingRecord set"
          - "computes failed_standard_count from the cycle's GovernanceProfile"
          - "computes data_completeness_pct, then BOTH variants of composite_score_with_penalty: weighted_sum_provisional, provisional_composite_score and provisional_grade from the provisional variant, and weighted_sum_final, final_composite_score and grade from the final variant; standards_penalty_points records the final variant's penalty"
          - "sets provisional_grade AND grade to UNRATED when data_completeness_pct < 60.00, regardless of the computed scores"
          - "increments RatingCycle.version by 1"
      - from: SCORED
        to: SCORED
        trigger: "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
        actor: RatingAnalyst
        preconditions:
          - "status == SCORED else ERR_CYCLE_STATE_INVALID"
          - "X-User-ID == assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
          - "expected_rating_cycle_version == version else ERR_STALE_VERSION"
        side_effects:
          - "each named DimensionScore row goes COMPUTED|OVERRIDDEN|STALE -> OVERRIDDEN with the supplied raw_points"
          - "recomputes BOTH composite variants: weighted_sum_provisional, provisional_composite_score, provisional_grade, weighted_sum_final, final_composite_score and grade (an override changes raw_points only, never data_completeness_pct, so the final variant's inclusion set is unchanged)"
          - "increments RatingCycle.version by 1"
        note: "Self-loop: a later override legitimately supersedes an earlier one, which is why this write is guarded by OCC on RatingCycle.version rather than by a state precondition."
      - from: SCORED
        to: ORG_REVIEW
        trigger: "POST /rating-cycles/{rating_cycle_id}/open-org-review"
        actor: RatingAnalyst
        preconditions:
          - "status == SCORED else ERR_CYCLE_STATE_INVALID"
          - "X-User-ID == assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
          - "no DimensionScore row of this cycle has status == STALE else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "sets review_opened_at = logical clock and correction_deadline_at = review_opened_at + CORRECTION_WINDOW_DAYS"
          - "increments RatingCycle.version by 1"
      - from: ORG_REVIEW
        to: CORRECTION_REQUESTED
        trigger: "system: POST /correction-requests creates a CorrectionRequest for this cycle"
        actor: system
        preconditions:
          - "status == ORG_REVIEW else ERR_CYCLE_STATE_INVALID"
          - "correction_round < 2 else ERR_CORRECTION_ROUND_LIMIT"
        side_effects:
          - "increments RatingCycle.version by 1"
          - "correction_deadline_at is retained; the publication gate stays armed"
      - from: CORRECTION_REQUESTED
        to: DATA_COLLECTION
        trigger: "system: POST /correction-requests/{correction_request_id}/decide with decision == ACCEPT"
        actor: system
        preconditions:
          - "status == CORRECTION_REQUESTED"
        side_effects:
          - "when target_kind == FILING_FINANCIAL the VALIDATED FilingRecord for (organization_id, target_fiscal_year, target_source_kind) transitions to SUPERSEDED and a replacement FilingRecord is created with origin = CORRECTION_APPLIED, status = VALIDATED and target_field_name overwritten by proposed_value"
          - "when target_kind == GOVERNANCE_DISCLOSURE the cycle's GovernanceProfile field named by target_field_name is overwritten by proposed_value and evaluation_status returns to PENDING"
          - "every DimensionScore row of this cycle goes COMPUTED|OVERRIDDEN -> STALE"
          - "clears review_opened_at, correction_deadline_at, appeal_deadline_at, weighted_sum_provisional, provisional_composite_score and provisional_grade to null"
          - "recomputes correction_round (now +1)"
          - "increments RatingCycle.version by 1"
        note: "Revision loop: DATA_COLLECTION -> SCORED -> ORG_REVIEW -> CORRECTION_REQUESTED -> DATA_COLLECTION, bounded at two ACCEPTED corrections."
      - from: CORRECTION_REQUESTED
        to: ORG_REVIEW
        trigger: "system: POST /correction-requests/{correction_request_id}/decide with decision == REJECT"
        actor: system
        preconditions:
          - "status == CORRECTION_REQUESTED"
          - "no other CorrectionRequest of this cycle has status in {SUBMITTED, UNDER_ANALYST_REVIEW}"
        side_effects:
          - "sets appeal_deadline_at = logical clock + APPEAL_WINDOW_DAYS"
          - "increments RatingCycle.version by 1"
      - from: ORG_REVIEW
        to: APPEAL_OPEN
        trigger: "system: POST /appeals creates an Appeal for this cycle"
        actor: system
        preconditions:
          - "status == ORG_REVIEW else ERR_CYCLE_STATE_INVALID"
          - "the referenced CorrectionRequest.status == REJECTED else ERR_CORRECTION_NOT_REJECTED"
          - "logical clock < appeal_deadline_at else ERR_APPEAL_WINDOW_CLOSED"
        side_effects:
          - "increments RatingCycle.version by 1"
      - from: APPEAL_OPEN
        to: APPEAL_RESOLVED
        trigger: "system: POST /appeals/{appeal_id}/decide with decision in {DENY, DISMISS}"
        actor: system
        preconditions:
          - "status == APPEAL_OPEN"
        side_effects:
          - "increments RatingCycle.version by 1"
          - "the rejected CorrectionRequest stays REJECTED and the scores stand unchanged"
      - from: APPEAL_OPEN
        to: DATA_COLLECTION
        trigger: "system: POST /appeals/{appeal_id}/decide with decision == GRANT"
        actor: system
        preconditions:
          - "status == APPEAL_OPEN"
          - "correction_round < 2 else ERR_CORRECTION_ROUND_LIMIT"
        side_effects:
          - "the contested CorrectionRequest transitions REJECTED -> ACCEPTED with decided_by_user_id = the deciding panel member"
          - "the same substitution the ACCEPT path performs is applied (FilingRecord superseded and replaced, or GovernanceProfile field overwritten and evaluation_status returned to PENDING)"
          - "every DimensionScore row of this cycle goes to STALE"
          - "clears review_opened_at, correction_deadline_at, appeal_deadline_at, weighted_sum_provisional, provisional_composite_score and provisional_grade to null"
          - "recomputes correction_round (now +1)"
          - "increments RatingCycle.version by 1"
        note: "Branch divergence: GRANT rewinds the cycle to DATA_COLLECTION while DENY and DISMISS advance it to APPEAL_RESOLVED."
      - from: ORG_REVIEW
        to: SCORED
        trigger: "system: POST /complaints/{complaint_id}/resolve with finding == SUBSTANTIATED selects this cycle"
        actor: system
        preconditions:
          - "status == ORG_REVIEW"
          - "this cycle is the one chosen by the complaint_penalty_target selector"
        side_effects:
          - "clears review_opened_at and correction_deadline_at to null"
          - "increments RatingCycle.version by 1"
          - "cascade hop 4 fires: Appeal rows of this cycle with status in {FILED, PANEL_ASSIGNED} go to DISMISSED and CorrectionRequest rows with status in {SUBMITTED, UNDER_ANALYST_REVIEW} go to REJECTED"
        note: "Second cyclic edge: the charity's review window is re-armed only after the analyst re-opens it."
      - from: CORRECTION_REQUESTED
        to: SCORED
        trigger: "system: POST /complaints/{complaint_id}/resolve with finding == SUBSTANTIATED selects this cycle"
        actor: system
        preconditions:
          - "status == CORRECTION_REQUESTED"
          - "this cycle is the one chosen by the complaint_penalty_target selector"
        side_effects:
          - "clears review_opened_at and correction_deadline_at to null"
          - "increments RatingCycle.version by 1"
          - "cascade hop 4 fires: the pending CorrectionRequest rows in {SUBMITTED, UNDER_ANALYST_REVIEW} go to REJECTED with decision_note 'cycle re-scored after substantiated complaint' and decided_by_user_id null; correction_round is NOT incremented because no correction was decided on its merits"
        note: "A substantiated complaint outranks an in-flight correction: the charity must re-submit against the penalised score."
      - from: APPEAL_OPEN
        to: SCORED
        trigger: "system: POST /complaints/{complaint_id}/resolve with finding == SUBSTANTIATED selects this cycle"
        actor: system
        preconditions:
          - "status == APPEAL_OPEN"
          - "this cycle is the one chosen by the complaint_penalty_target selector"
        side_effects:
          - "clears review_opened_at, correction_deadline_at and appeal_deadline_at to null"
          - "increments RatingCycle.version by 1"
          - "cascade hop 4 fires: Appeal rows in {FILED, PANEL_ASSIGNED} go to DISMISSED with decided_by_user_id null"
        note: "The appeal is dismissed without a merits finding because the score it contested no longer exists."
      - from: ORG_REVIEW
        to: PUBLISHED
        trigger: "POST /rating-cycles/{rating_cycle_id}/publish"
        actor: PublishingReviewer
        preconditions:
          - "status in {ORG_REVIEW, APPEAL_RESOLVED} else ERR_CYCLE_NOT_PUBLISHABLE"
          - "X-User-ID != assigned_analyst_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "no CorrectionRequest of this cycle has status in {SUBMITTED, UNDER_ANALYST_REVIEW} else ERR_CYCLE_NOT_PUBLISHABLE"
          - "no Appeal of this cycle has status in {FILED, PANEL_ASSIGNED} else ERR_CYCLE_NOT_PUBLISHABLE"
          - "no DimensionScore row of this cycle has status == STALE else ERR_CYCLE_NOT_PUBLISHABLE"
          - "logical clock >= correction_deadline_at else ERR_CYCLE_NOT_PUBLISHABLE"
          - "data_completeness_pct >= 60.00 else ERR_DATA_COMPLETENESS_TOO_LOW"
        side_effects:
          - "hop 1: computes weighted_sum_final, standards_penalty_points, final_composite_score and grade via composite_score_with_penalty variant final; sets published_at = logical clock, publishing_reviewer_user_id = X-User-ID, status = PUBLISHED; increments RatingCycle.version by 1"
          - "hop 2 (caused by hop 1's PUBLISHED state): one PublicationRecord is created with sequence_number, previous_published_score, score_delta and change_direction per the publication_change_classification calculation"
          - "hop 3 (caused by hop 2's record creation): notified_recipient_kinds is populated on that record (RATED_ORGANIZATION always, MEDIA appended when change_direction != FIRST_PUBLICATION and abs(score_delta) >= 10.00); the Organization's latest_published_score, latest_published_grade, published_cycle_count and trend_direction are recomputed from the new record and Organization.version increments by 1"
      - from: APPEAL_RESOLVED
        to: PUBLISHED
        trigger: "POST /rating-cycles/{rating_cycle_id}/publish"
        actor: PublishingReviewer
        preconditions:
          - "identical to the ORG_REVIEW -> PUBLISHED preconditions"
        side_effects:
          - "identical to the ORG_REVIEW -> PUBLISHED side effects"
      - from: DATA_COLLECTION
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "status not in {PUBLISHED, WITHDRAWN} else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "stores withdrawal_reason; every DimensionScore row goes to STALE"
          - "CorrectionRequest rows with status in {SUBMITTED, UNDER_ANALYST_REVIEW} go to REJECTED with decision_note 'cycle withdrawn'"
          - "Appeal rows with status in {FILED, PANEL_ASSIGNED} go to DISMISSED with decision_note 'cycle withdrawn'"
          - "the cycle's period stops occupying the Organization timeline, so a later cycle may reuse the interval"
          - "increments RatingCycle.version by 1"
      - from: SCORED
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "identical to the DATA_COLLECTION -> WITHDRAWN preconditions"
        side_effects:
          - "identical to the DATA_COLLECTION -> WITHDRAWN side effects"
      - from: ORG_REVIEW
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "identical to the DATA_COLLECTION -> WITHDRAWN preconditions"
        side_effects:
          - "identical to the DATA_COLLECTION -> WITHDRAWN side effects"
      - from: CORRECTION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "identical to the DATA_COLLECTION -> WITHDRAWN preconditions"
        side_effects:
          - "identical to the DATA_COLLECTION -> WITHDRAWN side effects"
      - from: APPEAL_OPEN
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "identical to the DATA_COLLECTION -> WITHDRAWN preconditions"
        side_effects:
          - "identical to the DATA_COLLECTION -> WITHDRAWN side effects"
      - from: APPEAL_RESOLVED
        to: WITHDRAWN
        trigger: "POST /rating-cycles/{rating_cycle_id}/withdraw"
        actor: MethodologyAdmin
        preconditions:
          - "identical to the DATA_COLLECTION -> WITHDRAWN preconditions"
        side_effects:
          - "identical to the DATA_COLLECTION -> WITHDRAWN side effects"

  - entity: GovernanceProfile
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: EVALUATED
        trigger: "POST /governance-profiles/{governance_profile_id}/evaluate"
        actor: RatingAnalyst
        preconditions:
          - "evaluation_status == PENDING else ERR_GOVERNANCE_STATE_INVALID"
          - "the parent RatingCycle.status == DATA_COLLECTION else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "computes independence_ratio"
          - "creates exactly eight StandardEvaluation rows per the standards_evaluation calculation, one per standard_code"
          - "recomputes standards_met_count, standards_not_met_count, standards_waived_count and standards_not_applicable_count"
          - "sets evaluated_at = logical clock"
          - "increments GovernanceProfile.version by 1"
      - from: EVALUATED
        to: PENDING
        trigger: "system: a CorrectionRequest with target_kind == GOVERNANCE_DISCLOSURE is ACCEPTED (by decide or by a granted Appeal)"
        actor: system
        preconditions:
          - "evaluation_status == EVALUATED"
        side_effects:
          - "overwrites the field named by target_field_name with proposed_value"
          - "deletes the eight StandardEvaluation rows so the next evaluate re-mints them from the corrected disclosure"
          - "zeroes the four standards_*_count fields"
          - "increments GovernanceProfile.version by 1"
        note: "Loop: PENDING -> EVALUATED -> PENDING mirrors the cycle's correction rounds."

  - entity: StandardEvaluation
    initial_state: NOT_MET
    terminal_states: []
    transitions:
      - from: NOT_MET
        to: WAIVED
        trigger: "POST /standard-evaluations/{standard_evaluation_id}/waive"
        actor: MethodologyAdmin
        preconditions:
          - "result == NOT_MET else ERR_STANDARD_STATE_INVALID"
          - "the owning GovernanceProfile's RatingCycle.status not in {PUBLISHED, WITHDRAWN} else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "stores waiver_reason and waived_by_user_id"
          - "the owning GovernanceProfile's standards_not_met_count decreases by 1 and standards_waived_count increases by 1"
          - "the owning RatingCycle's failed_standard_count decreases by 1"
          - "when the cycle's ACCOUNTABILITY DimensionScore is COMPUTED or OVERRIDDEN it is recomputed (a WAIVED standard is worth STANDARD_WAIVED_POINTS, a MET standard STANDARD_MET_POINTS)"
          - "increments StandardEvaluation.version by 1"
        note: "Forward half of the standards-partition invariant."
      - from: WAIVED
        to: NOT_MET
        trigger: "POST /standard-evaluations/{standard_evaluation_id}/revoke-waiver"
        actor: MethodologyAdmin
        preconditions:
          - "result == WAIVED else ERR_STANDARD_STATE_INVALID"
          - "the owning GovernanceProfile's RatingCycle.status not in {PUBLISHED, WITHDRAWN} else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "clears waiver_reason and waived_by_user_id to null"
          - "the owning GovernanceProfile's standards_waived_count decreases by 1 and standards_not_met_count increases by 1"
          - "the owning RatingCycle's failed_standard_count increases by 1"
          - "the ACCOUNTABILITY DimensionScore raw_points and the cycle's provisional figures return to their pre-waiver values"
          - "increments StandardEvaluation.version by 1"
        note: "Compensating half of the standards-partition invariant; the four standards_*_count fields must still sum to 8."

  - entity: CorrectionRequest
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_ANALYST_REVIEW
        trigger: "POST /correction-requests/{correction_request_id}/claim"
        actor: RatingAnalyst
        preconditions:
          - "status == SUBMITTED else ERR_CORRECTION_STATE_INVALID"
          - "X-User-ID == the cycle's assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
        side_effects:
          - "stores claimed_by_user_id"
          - "increments CorrectionRequest.version by 1"
      - from: UNDER_ANALYST_REVIEW
        to: ACCEPTED
        trigger: "POST /correction-requests/{correction_request_id}/decide with decision == ACCEPT"
        actor: RatingAnalyst
        preconditions:
          - "status == UNDER_ANALYST_REVIEW else ERR_CORRECTION_STATE_INVALID"
          - "X-User-ID == the cycle's assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
          - "the cycle's correction_round < 2 else ERR_CORRECTION_ROUND_LIMIT"
        side_effects:
          - "stores decided_by_user_id, decision_note and decided_at"
          - "drives the parent RatingCycle CORRECTION_REQUESTED -> DATA_COLLECTION transition and its substitution side effects"
          - "increments CorrectionRequest.version by 1"
      - from: UNDER_ANALYST_REVIEW
        to: REJECTED
        trigger: "POST /correction-requests/{correction_request_id}/decide with decision == REJECT"
        actor: RatingAnalyst
        preconditions:
          - "status == UNDER_ANALYST_REVIEW else ERR_CORRECTION_STATE_INVALID"
          - "X-User-ID == the cycle's assigned_analyst_user_id else ERR_NOT_ASSIGNED_ANALYST"
        side_effects:
          - "stores decided_by_user_id, decision_note and decided_at"
          - "drives the parent RatingCycle CORRECTION_REQUESTED -> ORG_REVIEW transition, which arms appeal_deadline_at"
          - "increments CorrectionRequest.version by 1"
      - from: REJECTED
        to: ACCEPTED
        trigger: "system: POST /appeals/{appeal_id}/decide with decision == GRANT"
        actor: system
        preconditions:
          - "status == REJECTED"
          - "an Appeal referencing this request has status == PANEL_ASSIGNED"
        side_effects:
          - "overwrites decided_by_user_id with the deciding panel member and decided_at with the logical clock"
          - "applies the same substitution the ACCEPT path performs"
          - "increments CorrectionRequest.version by 1"
        note: "The only path out of a terminal state, and the reason appeal rights are meaningful."
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: the parent cycle is withdrawn, or a substantiated Complaint re-scores the cycle"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets decision_note to the cascade's fixed note and decided_at = logical clock; decided_by_user_id stays null"
          - "increments CorrectionRequest.version by 1"
      - from: UNDER_ANALYST_REVIEW
        to: REJECTED
        trigger: "system: the parent cycle is withdrawn, or a substantiated Complaint re-scores the cycle"
        actor: system
        preconditions:
          - "status == UNDER_ANALYST_REVIEW"
        side_effects:
          - "sets decision_note to the cascade's fixed note and decided_at = logical clock; decided_by_user_id stays null"
          - "increments CorrectionRequest.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, DISMISSED]
    transitions:
      - from: FILED
        to: PANEL_ASSIGNED
        trigger: "POST /appeals/{appeal_id}/assign-panel"
        actor: MethodologyAdmin
        preconditions:
          - "status == FILED else ERR_APPEAL_STATE_INVALID"
          - "panel_member_user_ids holds exactly three distinct ids, none equal to the cycle's assigned_analyst_user_id or publishing_reviewer_user_id, else ERR_PANEL_COMPOSITION_INVALID"
        side_effects:
          - "stores panel_member_user_ids"
          - "increments Appeal.version by 1"
      - from: PANEL_ASSIGNED
        to: GRANTED
        trigger: "POST /appeals/{appeal_id}/decide with decision == GRANT"
        actor: AppealPanelist
        preconditions:
          - "status == PANEL_ASSIGNED else ERR_APPEAL_STATE_INVALID"
          - "X-User-ID is a member of panel_member_user_ids else ERR_ROLE_NOT_PERMITTED"
        side_effects:
          - "stores decided_by_user_id, decided_at and decision_note"
          - "the contested CorrectionRequest goes REJECTED -> ACCEPTED"
          - "the parent RatingCycle goes APPEAL_OPEN -> DATA_COLLECTION with the full substitution cascade"
          - "increments Appeal.version by 1"
        note: "Divergent branch A: the rating is rewound and must be re-scored."
      - from: PANEL_ASSIGNED
        to: DENIED
        trigger: "POST /appeals/{appeal_id}/decide with decision == DENY"
        actor: AppealPanelist
        preconditions:
          - "status == PANEL_ASSIGNED else ERR_APPEAL_STATE_INVALID"
          - "X-User-ID is a member of panel_member_user_ids else ERR_ROLE_NOT_PERMITTED"
        side_effects:
          - "stores decided_by_user_id, decided_at and decision_note"
          - "the parent RatingCycle goes APPEAL_OPEN -> APPEAL_RESOLVED; no score changes"
          - "increments Appeal.version by 1"
        note: "Divergent branch B: the rating stands and becomes publishable."
      - from: PANEL_ASSIGNED
        to: DISMISSED
        trigger: "POST /appeals/{appeal_id}/decide with decision == DISMISS"
        actor: AppealPanelist
        preconditions:
          - "status == PANEL_ASSIGNED else ERR_APPEAL_STATE_INVALID"
          - "X-User-ID is a member of panel_member_user_ids else ERR_ROLE_NOT_PERMITTED"
        side_effects:
          - "stores decided_by_user_id, decided_at and decision_note"
          - "the parent RatingCycle goes APPEAL_OPEN -> APPEAL_RESOLVED; the contested CorrectionRequest stays REJECTED and no substitution runs"
          - "increments Appeal.version by 1"
        note: "Divergent branch C: procedural dismissal - same cycle destination as DENY, but the panel records no merits finding."
      - from: FILED
        to: DISMISSED
        trigger: "system: the parent cycle is withdrawn, or a substantiated Complaint re-scores the cycle"
        actor: system
        preconditions:
          - "status == FILED"
        side_effects:
          - "sets decision_note to the cascade's fixed note and decided_at = logical clock; decided_by_user_id stays null"
          - "increments Appeal.version by 1"
      - from: PANEL_ASSIGNED
        to: DISMISSED
        trigger: "system: the parent cycle is withdrawn, or a substantiated Complaint re-scores the cycle"
        actor: system
        preconditions:
          - "status == PANEL_ASSIGNED"
        side_effects:
          - "sets decision_note to the cascade's fixed note and decided_at = logical clock; decided_by_user_id stays null"
          - "increments Appeal.version by 1"

  - entity: Complaint
    initial_state: INTAKE
    terminal_states: [UNSUBSTANTIATED, CLOSED_NO_ACTION, REFERRED_OUT]
    transitions:
      - from: INTAKE
        to: INVESTIGATING
        trigger: "POST /complaints/{complaint_id}/triage with disposition == INVESTIGATE"
        actor: RatingAnalyst
        preconditions:
          - "status == INTAKE else ERR_COMPLAINT_STATE_INVALID"
        side_effects:
          - "computes credibility_score via complaint_credibility_score variant intake, sets credibility_variant = INTAKE and severity_tier"
          - "sets investigation_due_at = logical clock + INVESTIGATION_DAYS"
          - "stores triage_note"
          - "increments Complaint.version by 1"
        note: "Divergent branch A of the intake fork."
      - from: INTAKE
        to: CLOSED_NO_ACTION
        trigger: "POST /complaints/{complaint_id}/triage with disposition == CLOSE_NO_ACTION"
        actor: RatingAnalyst
        preconditions:
          - "status == INTAKE else ERR_COMPLAINT_STATE_INVALID"
        side_effects:
          - "stores triage_note and sets resolved_at = logical clock"
          - "no credibility_score is computed and investigation_due_at stays null"
          - "increments Complaint.version by 1"
        note: "Divergent branch B: terminal with no scoring side effects at all."
      - from: INTAKE
        to: REFERRED_OUT
        trigger: "POST /complaints/{complaint_id}/triage with disposition == REFER_OUT"
        actor: RatingAnalyst
        preconditions:
          - "status == INTAKE else ERR_COMPLAINT_STATE_INVALID"
          - "referred_to present else ERR_INVALID_REQUEST"
        side_effects:
          - "stores referred_to, triage_note and resolved_at = logical clock"
          - "computes credibility_score via variant intake so the referral carries a severity_tier, but applies no rating penalty"
          - "increments Complaint.version by 1"
        note: "Divergent branch C: terminal, scored but never penalising."
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /complaints/{complaint_id}/resolve with finding == SUBSTANTIATED"
        actor: RatingAnalyst
        preconditions:
          - "status == INVESTIGATING else ERR_COMPLAINT_STATE_INVALID"
          - "penalty_points present and within 1..15 and <= MAX_PENALTY_BY_SEVERITY[severity_tier recomputed under the investigated variant] else ERR_PENALTY_POINTS_RANGE"
        side_effects:
          - "hop 1: recomputes credibility_score via variant investigated, sets credibility_variant = INVESTIGATED, re-derives severity_tier, stores penalty_points_applied, finding_note and resolved_at; the Organization's substantiated_complaint_count is recomputed"
          - "hop 1: penalized_rating_cycle_id is set to the cycle chosen by the complaint_penalty_target selector, or stays null when the candidate set is empty (hops 2-4 are then skipped and no error is raised)"
          - "hop 2 (caused by hop 1 naming a cycle): that cycle's ACCOUNTABILITY DimensionScore adds penalty_points to penalty_points, sets raw_points = max(0, base_raw_points - penalty_points) and goes COMPUTED|OVERRIDDEN -> STALE"
          - "hop 3 (caused by hop 2's STALE row): the cycle recomputes accountability_penalty_points, weighted_sum_provisional, standards_penalty_points, provisional_composite_score and provisional_grade, and when its status is in {ORG_REVIEW, CORRECTION_REQUESTED, APPEAL_OPEN} it transitions to SCORED, clearing review_opened_at, correction_deadline_at and appeal_deadline_at"
          - "hop 4 (caused by hop 3's departure from the review track): that cycle's Appeal rows in {FILED, PANEL_ASSIGNED} go to DISMISSED and its CorrectionRequest rows in {SUBMITTED, UNDER_ANALYST_REVIEW} go to REJECTED, both with decision_note 'cycle re-scored after substantiated complaint' and decided_by_user_id null"
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /complaints/{complaint_id}/resolve with finding == UNSUBSTANTIATED"
        actor: RatingAnalyst
        preconditions:
          - "status == INVESTIGATING else ERR_COMPLAINT_STATE_INVALID"
          - "penalty_points absent or 0 else ERR_PENALTY_POINTS_RANGE"
        side_effects:
          - "recomputes credibility_score via variant investigated (which subtracts UNSUBSTANTIATED_ADJUSTMENT), sets credibility_variant = INVESTIGATED, re-derives severity_tier and sets resolved_at"
          - "no DimensionScore, RatingCycle or Organization field changes"
          - "increments Complaint.version by 1"
      - from: SUBSTANTIATED
        to: INVESTIGATING
        trigger: "POST /complaints/{complaint_id}/reverse-finding"
        actor: MethodologyAdmin
        preconditions:
          - "status == SUBSTANTIATED else ERR_COMPLAINT_STATE_INVALID"
          - "penalized_rating_cycle_id names a RatingCycle whose status not in {PUBLISHED, WITHDRAWN} else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "stores reversal_reason, clears resolved_at to null and sets penalty_points_applied = 0; the Organization's substantiated_complaint_count is recomputed"
          - "the penalized cycle's ACCOUNTABILITY DimensionScore subtracts the reversed points from penalty_points, recomputes raw_points from source data and goes STALE -> COMPUTED"
          - "the cycle recomputes accountability_penalty_points, weighted_sum_provisional, standards_penalty_points, provisional_composite_score and provisional_grade"
          - "penalized_rating_cycle_id is cleared to null"
          - "increments Complaint.version by 1"
        note: "Compensating action: the accountability point ledger returns to its pre-substantiation value with zero drift."

# =============================================================================
# Section 2.1: Concurrency Rules (OCC on the parent's version - only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: filing-create-stale-organization
    parent_entity: Organization
    write_endpoint: "POST /filing-records"
    occ_field: "expected_organization_version"
    description: |
      Posting a FilingRecord against an Organization whose version has advanced
      since the client last read it is rejected with a stale-version error. The
      product intentionally allows a newly validated filing to supersede the
      prior VALIDATED filing for the same (organization_id, fiscal_year,
      source_kind) triple, so a second sequential submission observing the same
      state would otherwise succeed and silently displace data the submitter
      never saw; the version check is what makes the displacement deliberate.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dimension-override-stale-cycle
    parent_entity: RatingCycle
    write_endpoint: "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
    occ_field: "expected_rating_cycle_version"
    description: |
      Applying a dimension override to a RatingCycle whose version has advanced
      since the client last read it is rejected with a stale-version error. A
      later override legitimately supersedes an earlier one (the transition is a
      SCORED -> SCORED self-loop with no state precondition to catch it), and
      complaint penalties, standard waivers and correction decisions all bump
      the cycle's version between reads, so the check is the only thing that
      keeps an analyst from overwriting figures computed from data they never
      observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Section 3: Calculation Rules
# =============================================================================
calculations:
  - name: winning_filing_selector
    trigger: "Whenever a financial figure is needed for an (organization_id, fiscal_year) pair - i.e. at POST /rating-cycles/{id}/score and at GET /rating-cycles/{id}/score-breakdown"
    algorithm: chronological
    formula: |
      candidates = FilingRecord rows where
                     organization_id == cycle.organization_id
                     AND fiscal_year  == the requested fiscal_year
                     AND status       == VALIDATED
      if candidates is empty:
          the caller raises ERR_NO_VALIDATED_FILING for the cycle's own
          fiscal_year, and treats a prior year as "unavailable" (which reduces
          the fundraising-efficiency weight pool) for fiscal_year - 1 and
          fiscal_year - 2.
      rank candidates by:
          1. source_precedence ASCENDING (AUDITED_STATEMENT 1 beats
             PUBLIC_FILING 2 beats ORG_SUBMISSION 3)
          2. created_at ASCENDING  (earliest surviving submission wins)
      winner = first ranked candidate
    input_set: "FilingRecord rows in status VALIDATED only. RECEIVED, REJECTED and SUPERSEDED rows are never read, no matter how recent or how authoritative their source_kind."
    constants:
      SOURCE_PRECEDENCE_AUDITED_STATEMENT: 1
      SOURCE_PRECEDENCE_PUBLIC_FILING: 2
      SOURCE_PRECEDENCE_ORG_SUBMISSION: 3
    precision: "not applicable - selection only"
    note: "created_at is the only tie-break; id is never consulted."

  - name: program_expense_ratio
    trigger: "POST /rating-cycles/{rating_cycle_id}/score, on the winning filing for the cycle's own fiscal_year"
    algorithm: threshold
    formula: |
      f   = winning_filing_selector(cycle.organization_id, cycle.fiscal_year)
      t   = Organization.org_type

      # --- numerator: methodology adjustment by organization type ---
      if t == PUBLIC_CHARITY or t == DONOR_ADVISED_SPONSOR:
          adjusted_program = f.program_expense_cents - f.joint_cost_allocated_cents
      elif t == PRIVATE_FOUNDATION:
          adjusted_program = f.program_expense_cents + f.grants_paid_cents
      elif t == MEMBERSHIP_ASSOCIATION:
          adjusted_program = f.program_expense_cents + f.membership_services_cents
      else:                                     # RELIGIOUS_CONGREGATION
          adjusted_program = f.program_expense_cents

      # --- denominator: a DIFFERENT branch table, not the same one ---
      if t == PRIVATE_FOUNDATION:
          adjusted_total = f.total_expense_cents + f.grants_paid_cents
      elif t == DONOR_ADVISED_SPONSOR:
          adjusted_total = f.total_expense_cents - f.grants_paid_cents
      else:
          adjusted_total = f.total_expense_cents

      adjusted_program = max(0, adjusted_program)
      if adjusted_total <= 0:
          program_expense_ratio = 0.0000
      else:
          program_expense_ratio = round(adjusted_program / adjusted_total, 4)   # half-up
    input_set: "Exactly one FilingRecord - the winner of winning_filing_selector for the cycle's own fiscal_year. Never an average across filings."
    constants:
      RATIO_SCALE: 4
    precision: "4 decimal places, round_half_up"
    note: |
      The numerator and denominator adjustment tables are deliberately not
      symmetric: PUBLIC_CHARITY and DONOR_ADVISED_SPONSOR share a numerator rule
      but not a denominator rule, and PRIVATE_FOUNDATION adds grants_paid to
      both sides while DONOR_ADVISED_SPONSOR subtracts it from one. Applying one
      table to both sides yields a plausible but wrong ratio.

  - name: fundraising_efficiency_3yr
    trigger: "POST /rating-cycles/{rating_cycle_id}/score"
    algorithm: weighted_scoring
    formula: |
      years = [cycle.fiscal_year, cycle.fiscal_year - 1, cycle.fiscal_year - 2]
      weights_declared = { fiscal_year: 0.50, fiscal_year-1: 0.30, fiscal_year-2: 0.20 }

      # step 1 - per-year ratio, ROUNDED before it is weighted
      available = []
      for y in years:
          f = winning_filing_selector(cycle.organization_id, y)
          if f is unavailable: continue
          if f.contributions_cents == 0:
              ratio_y = 1.0000
          else:
              ratio_y = round(f.fundraising_expense_cents / f.contributions_cents, 4)
          available.append((y, ratio_y, weights_declared[y]))

      if available is empty:
          fundraising_efficiency = 1.0000     # worst possible, no data
      else:
          # step 2 - renormalise the declared weights over available years only
          weight_pool = sum(w for (_, _, w) in available)
          for each (y, ratio_y, w) in available:
              w_prime_y = round(w / weight_pool, 4)

          # step 3 - round EACH weighted term, then sum, then round the sum
          fundraising_efficiency = round(
              sum( round(ratio_y * w_prime_y, 4) for each available year ), 4)
    input_set: "Up to three winning filings (one per fiscal year); missing years shrink the weight pool rather than contributing zero."
    constants:
      WEIGHT_FY0: 0.50
      WEIGHT_FY_MINUS_1: 0.30
      WEIGHT_FY_MINUS_2: 0.20
      NO_CONTRIBUTIONS_RATIO: 1.0000
      RATIO_SCALE: 4
    precision: "4 decimal places, round_half_up, applied THREE times: per-year ratio, per-year renormalised weight, and each weighted term before summation"
    note: |
      The pinned order is load-bearing. Pooling first
      (sum(fundraising) / sum(contributions)) over the canonical three-year
      fixture gives 0.1824; the pinned per-year order gives 0.1867. Both are
      defensible accounting; only one matches this methodology.

  - name: months_of_reserve
    trigger: "POST /rating-cycles/{rating_cycle_id}/score"
    algorithm: threshold
    formula: |
      f = winning_filing_selector(cycle.organization_id, cycle.fiscal_year)
      if f.total_expense_cents <= 0:
          months_of_reserve = 0.00
      else:
          months_of_reserve = round(
              f.net_assets_cents * MONTHS_PER_YEAR / f.total_expense_cents, 2)
          # net_assets_cents is already reported net of liabilities, so
          # total_liabilities_cents is NOT subtracted a second time here.
    input_set: "The winning filing for the cycle's own fiscal_year."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "2 decimal places, round_half_up"

  - name: standards_evaluation
    trigger: "POST /governance-profiles/{governance_profile_id}/evaluate"
    algorithm: constraint_propagation
    formula: |
      g   = the GovernanceProfile
      org = the Organization owning g's RatingCycle
      now = logical clock

      independence_ratio = 0.0000 if g.board_member_count == 0
                           else round(g.independent_board_member_count
                                      / g.board_member_count, 4)

      for each standard_code, emit exactly one StandardEvaluation row:

        BOARD_SIZE_MIN
          not_applicable: never
          observed = str(g.board_member_count); required = "5"
          MET when g.board_member_count >= BOARD_SIZE_MIN

        BOARD_INDEPENDENCE
          not_applicable: never
          observed = str(independence_ratio); required = "0.5000"
          MET when independence_ratio >= BOARD_INDEPENDENCE_MIN

        COI_POLICY
          not_applicable: never
          observed = str(g.conflict_of_interest_policy_on_file); required = "true"
          MET when g.conflict_of_interest_policy_on_file is true

        COI_POLICY_CURRENCY
          not_applicable when org.org_type == RELIGIOUS_CONGREGATION
          observed = g.coi_policy_reviewed_at or "null"; required = "reviewed within 730 days"
          MET when g.coi_policy_reviewed_at is not null
                  AND g.coi_policy_reviewed_at >= now - COI_REVIEW_MAX_AGE_DAYS days

        BOARD_MEETING_FREQUENCY
          not_applicable: never
          observed = str(g.board_meetings_last_year); required = "3"
          MET when g.board_meetings_last_year >= BOARD_MEETINGS_MIN

        AUDIT_COMMITTEE
          not_applicable when org.org_type == RELIGIOUS_CONGREGATION
          observed = str(g.audit_committee_exists); required = "true"
          MET when g.audit_committee_exists is true

        WHISTLEBLOWER_POLICY
          not_applicable: never
          observed = str(g.whistleblower_policy); required = "true"
          MET when g.whistleblower_policy is true

        CEO_COMP_REVIEW
          not_applicable when org.org_type == RELIGIOUS_CONGREGATION
          observed = str(g.ceo_compensation_reviewed); required = "true"
          MET when g.ceo_compensation_reviewed is true

      result = NOT_APPLICABLE when the code's not_applicable condition holds,
               else MET when its MET condition holds, else NOT_MET.
      Every row's evaluated_at = now.

      g.standards_met_count            = count(result == MET)
      g.standards_not_met_count        = count(result == NOT_MET)
      g.standards_waived_count         = 0        # waivers are applied later
      g.standards_not_applicable_count = count(result == NOT_APPLICABLE)
      cycle.failed_standard_count      = g.standards_not_met_count
    input_set: "The eight STANDARD_CODES, evaluated against one GovernanceProfile and the org_type of its Organization."
    constants:
      BOARD_SIZE_MIN: 5
      BOARD_INDEPENDENCE_MIN: 0.5000
      BOARD_MEETINGS_MIN: 3
      COI_REVIEW_MAX_AGE_DAYS: 730
      STANDARD_CODE_COUNT: 8
    precision: "independence_ratio to 4 decimal places, round_half_up; counts are integers"
    note: |
      NOT_APPLICABLE is never NOT_MET: a RELIGIOUS_CONGREGATION with no audit
      committee scores identically to one with an audit committee, and its
      accountability ceiling drops accordingly (5 gradeable standards, not 8).
      The four counts always partition 8.

  - name: dimension_raw_points
    trigger: "POST /rating-cycles/{rating_cycle_id}/score, and again on any recompute (standard waived or revoked, complaint substantiated or reversed)"
    algorithm: tiered_pricing
    formula: |
      # ---------------- FINANCIAL_HEALTH (max 40) ----------------
      ratio_points = 20 if program_expense_ratio >= 0.85
                     else 15 if program_expense_ratio >= 0.75
                     else 10 if program_expense_ratio >= 0.65
                     else  5 if program_expense_ratio >= 0.50
                     else  0
      efficiency_points = 12 if fundraising_efficiency <= 0.10
                          else 9 if fundraising_efficiency <= 0.20
                          else 5 if fundraising_efficiency <= 0.35
                          else 0
      reserve_points = 8 if months_of_reserve >= 12
                       else 5 if months_of_reserve >= 6
                       else 2 if months_of_reserve >= 3
                       else 0
      FINANCIAL_HEALTH.raw_points = ratio_points + efficiency_points + reserve_points
      FINANCIAL_HEALTH.max_points = 40

      # ---------------- ACCOUNTABILITY (max 24, org_type sensitive) ----
      g = the cycle's GovernanceProfile
      base = min(24, STANDARD_MET_POINTS   * g.standards_met_count
                   + STANDARD_WAIVED_POINTS * g.standards_waived_count)
      ACCOUNTABILITY.raw_points = max(0, base - cycle.accountability_penalty_points)
      ACCOUNTABILITY.max_points = min(24, STANDARD_MET_POINTS
                                          * (8 - g.standards_not_applicable_count))
      # NOT_APPLICABLE standards shrink the DENOMINATOR, so an organization type
      # exempted from a standard is neither rewarded nor punished for it.

      # ---------------- TRANSPARENCY (max 20) ----------------
      source_points = 8 if the cycle's fiscal_year has a VALIDATED filing with
                           source_kind == AUDITED_STATEMENT
                      else 4 if it has a VALIDATED filing with
                           source_kind == PUBLIC_FILING
                      else 0
      TRANSPARENCY.raw_points = source_points
                              + (6 if g.evaluation_status == EVALUATED else 0)
                              + (3 if g.conflict_of_interest_policy_on_file else 0)
                              + (3 if g.whistleblower_policy else 0)
      TRANSPARENCY.max_points = 20
      # source_points reads the FilingRecord table directly, NOT the winning
      # filing: an org with both an AUDITED_STATEMENT and a PUBLIC_FILING scores
      # 8, and the two source terms are alternatives, never additive.

      # ---------------- IMPACT (max 12) ----------------
      IMPACT.raw_points = (5 if g.impact_report_on_file else 0)
                        + min(4, g.outcome_measures_count)
                        + (3 if g.third_party_evaluation_on_file else 0)
      IMPACT.max_points = 12

      # ---------------- normalisation, per dimension ----------------
      normalized_score = 0.00 if max_points == 0
                         else round(raw_points * 100 / max_points, 2)
      # weight_applied and weighted_contribution ALWAYS mirror the FINAL variant,
      # because that is the published figure. A dimension the final variant
      # excludes carries weight_applied 0.0000 and weighted_contribution 0.00
      # even though the provisional variant still counted it at its declared
      # weight - the provisional arithmetic is visible only on the cycle's
      # weighted_sum_provisional and on GET /rating-cycles/{id}/score-breakdown.
      weight_applied        = the FINAL variant's weight for this dimension
      weighted_contribution = round(normalized_score * weight_applied, 2)
      status                = COMPUTED
    input_set: "One GovernanceProfile (must be EVALUATED for the accountability and transparency terms to be non-zero), the winning filings, and the cycle's own accountability_penalty_points ledger."
    constants:
      DIMENSION_MAX_FINANCIAL_HEALTH: 40
      DIMENSION_MAX_ACCOUNTABILITY: 24
      DIMENSION_MAX_TRANSPARENCY: 20
      DIMENSION_MAX_IMPACT: 12
      STANDARD_MET_POINTS: 3
      STANDARD_WAIVED_POINTS: 2
      RATIO_TIER_POINTS: "0.85->20, 0.75->15, 0.65->10, 0.50->5, else 0"
      EFFICIENCY_TIER_POINTS: "<=0.10->12, <=0.20->9, <=0.35->5, else 0"
      RESERVE_TIER_POINTS: ">=12->8, >=6->5, >=3->2, else 0"
      OUTCOME_MEASURE_CAP: 4
    precision: "raw_points and max_points are integers; normalized_score to 2 decimal places, round_half_up"
    note: |
      Three tier ladders with opposite polarity live in one dimension: the ratio
      and reserve ladders reward larger values with >=, the efficiency ladder
      rewards smaller values with <=. A waived standard is worth 2 points where a
      met standard is worth 3, so waiving a failure improves the score without
      erasing the shortfall.

  - name: dimension_data_completeness
    trigger: "POST /rating-cycles/{rating_cycle_id}/score, before composite_score_with_penalty runs"
    algorithm: aggregation
    formula: |
      g = the cycle's GovernanceProfile (may be absent)

      # FINANCIAL_HEALTH is the ONLY graded dimension: it is complete in thirds
      # over the three fiscal years the efficiency calculation reads.
      years_available = count of y in [cycle.fiscal_year,
                                      cycle.fiscal_year - 1,
                                      cycle.fiscal_year - 2]
                        for which winning_filing_selector(org, y) exists
      FINANCIAL_HEALTH.data_completeness_pct =
          round(100.00 * years_available / 3, 2)     # 0.00, 33.33, 66.67, 100.00
      ACCOUNTABILITY.data_completeness_pct =
          100.00 if g exists and g.evaluation_status == EVALUATED else 0.00
      TRANSPARENCY.data_completeness_pct =
          100.00 if (g exists and g.evaluation_status == EVALUATED)
                    AND at least one VALIDATED FilingRecord exists for the
                        organization in any fiscal_year
          else 0.00
      IMPACT.data_completeness_pct =
          100.00 if g exists and (g.impact_report_on_file
                                  OR g.outcome_measures_count > 0
                                  OR g.third_party_evaluation_on_file)
          else 0.00

      cycle.data_completeness_pct = round(
          sum( dim.data_completeness_pct * declared_weight(dim)
               for dim in the four dimensions ), 2)
      # declared_weight always comes from the PINNED MethodologyVersion, never
      # from the renormalised final-variant weights.
    input_set: "All four DimensionScore rows of the cycle; the pinned MethodologyVersion's four declared weights."
    constants:
      COMPLETENESS_FULL: 100.00
      COMPLETENESS_NONE: 0.00
      FINANCIAL_HISTORY_YEARS: 3
    precision: "2 decimal places, round_half_up"
    note: |
      Three dimensions are binary; FINANCIAL_HEALTH is graded in thirds, so a
      single-year filer scores 33.33 there and can fall below the UNRATED gate
      even though its own fiscal year is fully documented. The aggregate is what
      gates UNRATED; the per-dimension values are what the final variant uses to
      decide which dimensions to exclude - and only an EXACT 0.00 excludes, so a
      33.33 FINANCIAL_HEALTH row still participates in the final variant.

  - name: composite_score_with_penalty
    trigger: "POST /rating-cycles/{rating_cycle_id}/score (both variants), and again on any recompute"
    algorithm: weighted_scoring
    formula: |
      # -------- STEP 1: choose the weight vector (variant-specific) --------
      m = the cycle's PINNED MethodologyVersion
      declared = { FINANCIAL_HEALTH: m.weight_financial_health,
                   ACCOUNTABILITY:   m.weight_accountability,
                   TRANSPARENCY:     m.weight_transparency,
                   IMPACT:           m.weight_impact }
      included = the variant's included dimension set (see variants below)
      if the variant renormalises:
          pool = sum(declared[d] for d in included)
          weight[d] = round(declared[d] / pool, 4)  for d in included
      else:
          weight[d] = declared[d]                   for d in included

      # -------- STEP 2: weighted sum, term-rounded then summed --------
      weighted_sum = round(
          sum( round(DimensionScore[d].normalized_score * weight[d], 2)
               for d in included ), 2)

      # -------- STEP 3: PRE-penalty band, from weighted_sum --------
      band = "A" if weighted_sum >= 90 else
             "B" if weighted_sum >= 75 else
             "C" if weighted_sum >= 60 else "D"

      # -------- STEP 4: penalty, whose RATE depends on the band --------
      penalty = round(PENALTY_RATE_BY_BAND[band] * cycle.failed_standard_count, 2)

      # -------- STEP 5: final score --------
      composite = round(max(0.00, weighted_sum - penalty), 2)

      # -------- STEP 6: grade, from the POST-penalty score --------
      floor_ok = min(DimensionScore[d].normalized_score for d in included)
                 >= m.dimension_floor_score
      if cycle.data_completeness_pct < UNRATED_COMPLETENESS_THRESHOLD:
          grade = "UNRATED"
      elif composite >= 85 and floor_ok:   grade = "ACCREDITED"
      elif composite >= 70 and floor_ok:   grade = "MEETS_STANDARDS"
      elif composite >= 55:                grade = "NEEDS_IMPROVEMENT"
      else:                                grade = "DOES_NOT_MEET"
    input_set: "The four DimensionScore rows (or the subset the variant includes), the PINNED MethodologyVersion's weights and dimension_floor_score, and cycle.failed_standard_count."
    constants:
      BAND_A_MIN: 90
      BAND_B_MIN: 75
      BAND_C_MIN: 60
      PENALTY_RATE_BY_BAND: "A: 2.0, B: 1.5, C: 1.0, D: 0.5"
      GRADE_ACCREDITED_MIN: 85
      GRADE_MEETS_STANDARDS_MIN: 70
      GRADE_NEEDS_IMPROVEMENT_MIN: 55
      UNRATED_COMPLETENESS_THRESHOLD: 60.00
      WEIGHT_SCALE: 4
      SCORE_SCALE: 2
    precision: "weights to 4 decimal places, scores to 2 decimal places, round_half_up; each weighted term is rounded BEFORE summation and the sum is rounded again"
    variants:
      - name: provisional
        when: "Written to weighted_sum_provisional / provisional_composite_score / provisional_grade at every score and recompute; this is the only figure the organization sees during ORG_REVIEW, and the only one an appeal can contest."
        difference: |
          Includes all four dimensions at their DECLARED weights, with no
          renormalisation, even when a dimension's data_completeness_pct is
          0.00 - a missing-data dimension drags the score down at its full
          declared weight. This variant's per-dimension weights are NOT stored on
          the DimensionScore rows (those mirror the final variant); they are
          observable only through GET /rating-cycles/{id}/score-breakdown.
      - name: final
        when: "Written to weighted_sum_final / final_composite_score / grade at every score and recompute; this is the figure PublicationRecord copies at publish time."
        difference: |
          EXCLUDES every dimension whose data_completeness_pct == 0.00 and
          renormalises the surviving declared weights as round(w / pool, 4).
          The excluded dimension's own normalized_score is also dropped from the
          floor_ok minimum, so a zero-data dimension can never breach the floor.
          Because step 3's band is derived from the renormalised weighted_sum,
          excluding a weak dimension can PROMOTE the band and therefore RAISE the
          per-standard penalty rate - the final score is not monotonically
          better than the provisional one.
    note: |
      The six steps are pinned. Banding after the penalty (or grading from
      weighted_sum instead of composite) produces different published grades on
      the same inputs, and computing the penalty rate from the post-penalty score
      is a fixed-point trap with no defined answer.

  - name: complaint_penalty_target
    trigger: "POST /complaints/{complaint_id}/resolve with finding == SUBSTANTIATED, hop 1 of the cascade"
    algorithm: chronological
    formula: |
      candidates = RatingCycle rows where
                     organization_id == complaint.organization_id
                     AND status not in { PUBLISHED, WITHDRAWN }
      if candidates is empty:
          penalized_rating_cycle_id = null      # hops 2-4 are skipped, no error
      else:
          rank candidates by
            1. fiscal_year DESCENDING   (the most recent open cycle absorbs it)
            2. created_at  ASCENDING    (tie-break within a fiscal year)
          penalized_rating_cycle_id = first ranked candidate's id
    input_set: "Open RatingCycle rows of the complained-about organization. Already-published and withdrawn cycles are immune; a published rating is never retro-penalised."
    constants:
      IMMUNE_STATUSES: "PUBLISHED, WITHDRAWN"
    precision: "not applicable - selection only"
    note: "created_at is the only tie-break; id is never consulted."

  - name: complaint_credibility_score
    trigger: "POST /complaints/{complaint_id}/triage (intake variant) and POST /complaints/{complaint_id}/resolve (investigated variant)"
    algorithm: weighted_scoring
    formula: |
      base = KIND_POINTS[complaint.complainant_kind]
           + CATEGORY_POINTS[complaint.category]
           + DOC_POINTS_EACH * min(DOC_POINTS_CAP_COUNT,
                                   complaint.corroborating_document_count)
      score = the variant's adjustment applied to base (see variants)
      credibility_score = round(max(0.00, min(100.00, score)), 2)

      severity_tier = "HIGH"   if credibility_score >= SEVERITY_HIGH_MIN
                      else "MEDIUM" if credibility_score >= SEVERITY_MEDIUM_MIN
                      else "LOW"
      max_penalty = MAX_PENALTY_BY_SEVERITY[severity_tier]
      # The severity_tier is re-derived from the INVESTIGATED score BEFORE the
      # submitted penalty_points is range-checked against max_penalty, so the
      # admissible penalty ceiling is not knowable from the intake score alone.
    input_set: "One Complaint row, plus - for the investigated variant only - the count of that organization's OTHER complaints already in status SUBSTANTIATED."
    constants:
      KIND_POINTS: "DONOR: 30, BENEFICIARY: 25, EMPLOYEE: 35, ANONYMOUS: 10"
      CATEGORY_POINTS: "MISUSE_OF_FUNDS: 30, GOVERNANCE: 25, SOLICITATION_PRACTICE: 20, TRANSPARENCY: 15, OTHER: 5"
      DOC_POINTS_EACH: 8
      DOC_POINTS_CAP_COUNT: 3
      PATTERN_POINTS_EACH: 5
      PATTERN_POINTS_CAP: 20
      SUBSTANTIATED_ADJUSTMENT: 10
      UNSUBSTANTIATED_ADJUSTMENT: -15
      SEVERITY_HIGH_MIN: 80
      SEVERITY_MEDIUM_MIN: 50
      MAX_PENALTY_BY_SEVERITY: "LOW: 5, MEDIUM: 10, HIGH: 15"
      SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up; the ceiling is applied before rounding, so a clamped score is exactly 100.00"
    variants:
      - name: intake
        when: "POST /complaints/{complaint_id}/triage, for dispositions INVESTIGATE and REFER_OUT; written with credibility_variant = INTAKE"
        difference: |
          score = base. No pattern term and no finding adjustment - at triage
          time neither the investigation outcome nor a corroborating pattern of
          prior substantiated complaints is knowable.
      - name: investigated
        when: "POST /complaints/{complaint_id}/resolve, both findings; written with credibility_variant = INVESTIGATED"
        difference: |
          score = base
                + min(PATTERN_POINTS_CAP,
                      PATTERN_POINTS_EACH * count(other complaints of the same
                        organization whose status == SUBSTANTIATED))
                + (SUBSTANTIATED_ADJUSTMENT   if finding == SUBSTANTIATED
                   else UNSUBSTANTIATED_ADJUSTMENT)
          The pattern count reads OTHER complaints only and is taken BEFORE this
          complaint's own status is written, so a first substantiated complaint
          contributes 0 pattern points to itself. The recomputed score can cross
          a severity boundary in either direction, which is why penalty_points is
          validated against the investigated tier rather than the intake tier.

  - name: workflow_deadline_windows
    trigger: "Every transition that arms a deadline: open-org-review, correction decide (REJECT), complaint triage (INVESTIGATE), methodology open-comment, methodology adopt"
    algorithm: interval_merge
    formula: |
      now = logical clock at the moment of the transition

      # correction window - armed when the analyst opens organization review
      cycle.correction_deadline_at = now + CORRECTION_WINDOW_DAYS days
      # A CorrectionRequest may be filed while now <= correction_deadline_at.
      # Publication is permitted while now >= correction_deadline_at.
      # The two windows therefore TOUCH at exactly correction_deadline_at: at
      # that single instant both filing and publishing are legal.

      # appeal window - armed when a correction is REJECTED
      cycle.appeal_deadline_at = now + APPEAL_WINDOW_DAYS days
      # An Appeal may be filed while now < appeal_deadline_at (STRICTLY before);
      # at exactly appeal_deadline_at the window is closed.

      # investigation clock - armed at triage INVESTIGATE
      complaint.investigation_due_at = now + INVESTIGATION_DAYS days

      # methodology comment window
      m.comment_open_at    = now
      m.comment_deadline_at = now + m.comment_period_days days
      # A PublicComment may be submitted while now <= comment_deadline_at AND
      # m.status == COMMENT_OPEN.

      # methodology effectivity buffer and transition grace, both at adopt
      require m.effective_from >= now + METHODOLOGY_BUFFER_DAYS days
      grant.grace_until = now + m.transition_period_days days
      org.transition_grace_until = max(existing value, grant.grace_until)
    input_set: "The logical clock plus the per-MethodologyVersion comment_period_days and transition_period_days overrides."
    constants:
      CORRECTION_WINDOW_DAYS: 21
      APPEAL_WINDOW_DAYS: 14
      INVESTIGATION_DAYS: 30
      METHODOLOGY_BUFFER_DAYS: 30
      DEFAULT_COMMENT_PERIOD_DAYS: 30
      DEFAULT_TRANSITION_PERIOD_DAYS: 90
      MAX_CORRECTION_ROUNDS: 2
      LOGICAL_CLOCK_DEFAULT: "2026-08-01T00:00:00Z"
    precision: "whole days added to an ISO-8601 UTC instant; comparisons are to the second"
    note: |
      The three windows use three different boundary polarities on purpose:
      corrections are inclusive of their deadline, appeals are exclusive of
      theirs, and the publication gate is inclusive of the same instant the
      correction window is. An implementation that normalises all three to one
      comparison operator fails at least one of them.

  - name: methodology_impact_projection
    trigger: "POST /methodology-versions/{methodology_version_id}/adopt, once per organization that has at least one PublicationRecord"
    algorithm: projection
    formula: |
      for each Organization org with published_cycle_count > 0:
          p = the PublicationRecord of org with the greatest sequence_number
          c = the RatingCycle named by p.rating_cycle_id
          rows = the four DimensionScore rows of c   (normalized_score and
                 data_completeness_pct are replayed AS STORED - the projection
                 never re-reads filings or governance data)

          projected_final = composite_score_with_penalty(
                              variant = final,
                              weights = the NEW MethodologyVersion's four weights,
                              floor   = the NEW MethodologyVersion's
                                        dimension_floor_score,
                              rows    = rows,
                              failed_standard_count = c.failed_standard_count,
                              data_completeness_pct = c.data_completeness_pct)

          projected_score_delta = round(projected_final
                                        - org.latest_published_score, 2)

          if projected_score_delta <= TRANSITION_GRANT_DELTA:
              create a TransitionGrant (status ACTIVE) for org with
                methodology_version_id     = the new version
                superseded_version_label   = the retiring version's version_label
                projected_score_delta      = the value above
                grace_until                = now + m.transition_period_days days
                trigger_reason             = WEIGHT_CHANGE when any of the four
                  weights differs from the retiring version's, else
                  THRESHOLD_TIGHTENED (dimension_floor_score raised)
              and set org.transition_grace_until = grant.grace_until
    input_set: "One PublicationRecord per organization - the highest sequence_number - and the stored DimensionScore rows of its cycle. Organizations with published_cycle_count == 0 are skipped entirely and never receive a grant."
    constants:
      TRANSITION_GRANT_DELTA: -5.00
    precision: "2 decimal places, round_half_up; the grant threshold is inclusive (a delta of exactly -5.00 grants)"
    note: |
      The projection is a replay against stored dimension figures, so it is
      deterministic and independent of any filing added after publication. Its
      threshold is inclusive at exactly -5.00, which is the boundary the
      difficulty design probes from both sides.

  - name: publication_change_classification
    trigger: "POST /rating-cycles/{rating_cycle_id}/publish"
    algorithm: chronological
    formula: |
      prior = PublicationRecord rows of the same organization_id
      sequence_number = count(prior) + 1

      if sequence_number == 1:
          previous_published_score = null
          score_delta              = null
          change_direction         = FIRST_PUBLICATION
      else:
          previous = the prior row whose sequence_number == sequence_number - 1
          previous_published_score = previous.published_score
          score_delta = round(cycle.final_composite_score
                              - previous_published_score, 2)
          change_direction = IMPROVED   if score_delta >  0
                             else DECLINED if score_delta <  0
                             else UNCHANGED
      published_score = cycle.final_composite_score
      published_grade = cycle.grade

      notified_recipient_kinds = ["RATED_ORGANIZATION"]
      if change_direction != FIRST_PUBLICATION
         and abs(score_delta) >= MEDIA_NOTIFY_DELTA:
             append "MEDIA"

      # Organization roll-up (denormalised, immediate)
      org.latest_published_score  = published_score
      org.latest_published_grade  = published_grade
      org.published_cycle_count   = sequence_number
      org.trend_direction         = NOT_APPLICABLE if sequence_number == 1
                                    else IMPROVED  if score_delta > 0
                                    else DECLINED  if score_delta < 0
                                    else UNCHANGED
    input_set: "All existing PublicationRecord rows of the organization; sequence_number ordering, never created_at ordering, identifies the predecessor."
    constants:
      MEDIA_NOTIFY_DELTA: 10.00
      FIRST_SEQUENCE_NUMBER: 1
    precision: "2 decimal places, round_half_up; the media threshold is inclusive on the absolute delta"
    note: |
      A first publication has a null delta and never notifies MEDIA, even though
      its score may be extreme. The media threshold is symmetric - a +10.00 rise
      notifies exactly as a -10.00 fall does - and inclusive at 10.00, so 8.75
      does not notify.

# =============================================================================
# Section 4: Validation Rules (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id appearing in the path resolves to a stored row, validated left-to-right"
    error_id: "ERR_ORGANIZATION_NOT_FOUND | ERR_METHODOLOGY_VERSION_NOT_FOUND | ERR_PUBLIC_COMMENT_NOT_FOUND | ERR_TRANSITION_GRANT_NOT_FOUND | ERR_RATING_CYCLE_NOT_FOUND | ERR_FILING_RECORD_NOT_FOUND | ERR_GOVERNANCE_PROFILE_NOT_FOUND | ERR_STANDARD_EVALUATION_NOT_FOUND | ERR_CORRECTION_REQUEST_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_PUBLICATION_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: auth
    check: "When X-User-Role == OrganizationRep, X-User-ID equals the Organization.id the target resource belongs to (directly, or via its RatingCycle.organization_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /correction-requests, POST /appeals, GET /organizations/{id}/filing-records, GET /organizations/{organization_id}/rating-trend"

  - priority: 5
    category: existence
    check: "Request body is well-formed: every required input field present, every enum value within its declared set, every integer non-negative where declared, every timestamp a valid ISO-8601 UTC instant, no unknown field rejected but silently ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 7
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to a stored row"
    error_id: "ERR_ORGANIZATION_NOT_FOUND | ERR_METHODOLOGY_VERSION_NOT_FOUND | ERR_RATING_CYCLE_NOT_FOUND | ERR_CORRECTION_REQUEST_NOT_FOUND | ERR_DIMENSION_SCORE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /rating-cycles, POST /filing-records, POST /governance-profiles, POST /public-comments, POST /correction-requests, POST /appeals, POST /complaints, POST /rating-cycles/{rating_cycle_id}/dimension-overrides"

  - priority: 8
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2 (and, for cross-entity guards, so is the related resource named in the transition's preconditions)"
    error_id: "ERR_CYCLE_STATE_INVALID | ERR_FILING_STATE_INVALID | ERR_METHODOLOGY_STATE_INVALID | ERR_GOVERNANCE_STATE_INVALID | ERR_STANDARD_STATE_INVALID | ERR_CORRECTION_STATE_INVALID | ERR_APPEAL_STATE_INVALID | ERR_COMPLAINT_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 9
    category: state
    check: "expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /filing-records, POST /rating-cycles/{rating_cycle_id}/dimension-overrides"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must differ from the user who performed the conflicting earlier step - the publishing reviewer may not be the cycle's assigned_analyst_user_id, and the MethodologyAdmin who assigns an appeal panel may not be the cycle's assigned_analyst_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rating-cycles/{rating_cycle_id}/publish, POST /appeals/{appeal_id}/assign-panel"

  - priority: 11
    category: business_safety
    check: "The acting RatingAnalyst's X-User-ID equals the cycle's assigned_analyst_user_id"
    error_id: ERR_NOT_ASSIGNED_ANALYST
    http_status: 403
    applies_to: "POST /rating-cycles/{rating_cycle_id}/score, POST /rating-cycles/{rating_cycle_id}/open-org-review, POST /rating-cycles/{rating_cycle_id}/dimension-overrides, POST /correction-requests/{correction_request_id}/claim, POST /correction-requests/{correction_request_id}/decide"

  - priority: 12
    category: business_referential
    check: "The related resource is in the specific state this operation depends on: the MethodologyVersion referenced by a new RatingCycle is ADOPTED, or is RETIRED with use_transition_grant true in which case the verdict is deferred to priority 13; an Appeal's CorrectionRequest is REJECTED; a cycle being scored has an EVALUATED GovernanceProfile"
    error_id: "ERR_METHODOLOGY_NOT_ADOPTED | ERR_CORRECTION_NOT_REJECTED | ERR_GOVERNANCE_NOT_EVALUATED"
    http_status: 409
    applies_to: "POST /rating-cycles, POST /appeals, POST /rating-cycles/{rating_cycle_id}/score"

  - priority: 13
    category: business_referential
    check: "When a new RatingCycle pins a MethodologyVersion whose status == RETIRED, use_transition_grant must be true AND a TransitionGrant must exist for this organization_id whose superseded_version_label equals the pinned version's version_label, whose status == ACTIVE and whose grace_until >= the logical clock"
    error_id: ERR_TRANSITION_GRACE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rating-cycles"

  - priority: 14
    category: business_temporal
    check: "The requested clock value is greater than or equal to the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  - priority: 15
    category: business_temporal
    check: "The MethodologyVersion pinned to a new RatingCycle is effective at the logical clock: effective_from <= now AND (effective_until is null OR now <= effective_until). A RETIRED version already admitted by the priority-13 grant check is exempt, because a transition grant is precisely a licence to pin an interval that has closed"
    error_id: ERR_METHODOLOGY_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /rating-cycles"

  - priority: 16
    category: business_temporal
    check: "An Appeal is filed strictly before the cycle's appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 17
    category: business_temporal
    check: "At adopt time effective_from >= now + METHODOLOGY_BUFFER_DAYS, effective_until (when present) > effective_from, and the [effective_from, effective_until] closed interval does not overlap the interval of any other ADOPTED version EXCEPT the one named by supersedes_version_id, which this adoption is closing at effective_from. An ADOPTED version whose effective_until is null is open-ended and therefore never overlapped by a successor's window: it is closed at the successor's effective_from by the adoption cascade, so only the clock buffer binds"
    error_id: ERR_METHODOLOGY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /methodology-versions/{methodology_version_id}/adopt"

  - priority: 18
    category: business_temporal
    check: "A new RatingCycle's [period_start, period_end) half-open interval does not overlap any non-WITHDRAWN cycle of the same organization; adjacency (previous period_end == new period_start) is allowed with no buffer"
    error_id: ERR_CYCLE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rating-cycles"

  - priority: 19
    category: business_constraint
    check: "weight_financial_health + weight_accountability + weight_transparency + weight_impact == 1.0000 exactly, each weight > 0.0000"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /methodology-versions"

  - priority: 20
    category: business_constraint
    check: "ein is unique across all Organizations"
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "POST /organizations"

  - priority: 21
    category: business_constraint
    check: "version_label is unique across all MethodologyVersions"
    error_id: ERR_DUPLICATE_VERSION_LABEL
    http_status: 409
    applies_to: "POST /methodology-versions"

  - priority: 22
    category: business_constraint
    check: "At most one GovernanceProfile exists per RatingCycle"
    error_id: ERR_DUPLICATE_GOVERNANCE_PROFILE
    http_status: 409
    applies_to: "POST /governance-profiles"

  - priority: 23
    category: business_constraint
    check: "A PublicComment is submitted while its MethodologyVersion is COMMENT_OPEN and the logical clock is at or before comment_deadline_at"
    error_id: ERR_COMMENT_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /public-comments"

  - priority: 24
    category: business_constraint
    check: "A MethodologyVersion is adopted only when unresolved_comment_count == 0 - every PublicComment has been disposed to INCORPORATED or DECLINED"
    error_id: ERR_UNRESOLVED_COMMENTS
    http_status: 409
    applies_to: "POST /methodology-versions/{methodology_version_id}/adopt"

  - priority: 25
    category: business_constraint
    check: "A CorrectionRequest is accepted only while the cycle's correction_round < MAX_CORRECTION_ROUNDS, and the request's round_number equals cycle.correction_round + 1"
    error_id: ERR_CORRECTION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /correction-requests, POST /correction-requests/{correction_request_id}/decide"

  - priority: 26
    category: business_constraint
    check: "At most one Appeal exists per RatingCycle in a non-DISMISSED state"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 27
    category: business_constraint
    check: "panel_member_user_ids holds exactly three distinct ids, none equal to the cycle's assigned_analyst_user_id or publishing_reviewer_user_id"
    error_id: ERR_PANEL_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /appeals/{appeal_id}/assign-panel"

  - priority: 28
    category: business_constraint
    check: "On a SUBSTANTIATED finding, penalty_points is an integer in 1..15 and does not exceed MAX_PENALTY_BY_SEVERITY for the severity_tier derived from the INVESTIGATED credibility score; on an UNSUBSTANTIATED finding penalty_points is absent or 0"
    error_id: ERR_PENALTY_POINTS_RANGE
    http_status: 422
    applies_to: "POST /complaints/{complaint_id}/resolve"

  - priority: 29
    category: business_fiscal
    check: "total_expense_cents == program_expense_cents + fundraising_expense_cents + admin_expense_cents, and joint_cost_allocated_cents <= program_expense_cents"
    error_id: ERR_EXPENSE_COMPONENTS_MISMATCH
    http_status: 422
    applies_to: "POST /filing-records, POST /filing-records/{filing_record_id}/validate"

  - priority: 30
    category: business_fiscal
    check: "At least one VALIDATED FilingRecord exists for the cycle's organization and its own fiscal_year"
    error_id: ERR_NO_VALIDATED_FILING
    http_status: 409
    applies_to: "POST /rating-cycles/{rating_cycle_id}/score"

  - priority: 31
    category: business_fiscal
    check: "A cycle is published only when its data_completeness_pct >= UNRATED_COMPLETENESS_THRESHOLD - an UNRATED cycle may be scored and reviewed but never published"
    error_id: ERR_DATA_COMPLETENESS_TOO_LOW
    http_status: 409
    applies_to: "POST /rating-cycles/{rating_cycle_id}/publish"

  - priority: 32
    category: state
    check: "A cycle is published only when the logical clock is at or after correction_deadline_at, no CorrectionRequest of the cycle is in SUBMITTED or UNDER_ANALYST_REVIEW, and no Appeal of the cycle is in FILED or PANEL_ASSIGNED"
    error_id: ERR_CYCLE_NOT_PUBLISHABLE
    http_status: 409
    applies_to: "POST /rating-cycles/{rating_cycle_id}/publish"

# =============================================================================
# Section 5: API Endpoints
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- clock / ops
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock, which is the only time source every deadline, window, grace period and age check in this service reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time at any point. The clock may only move forward or stay put."
    roles: [MethodologyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "advances the logical clock; no stored row changes and no deadline is re-armed retroactively"

  - method: POST
    path: "/ops/transition-sweep"
    description: "Operator sweep that expires TransitionGrant rows whose grace_until has passed, so grace expiry is observable without wall-clock waiting."
    roles: [MethodologyAdmin]
    code: 200
    input: []
    output: { expired_grant_count: integer, expired_grant_ids: "string[]" }
    side_effects:
      - "every ACTIVE TransitionGrant whose grace_until < logical clock goes ACTIVE -> EXPIRED and its version increments by 1"
      - "for each affected Organization, transition_grace_until is cleared to null when it has no remaining ACTIVE grant"

  # ---------------------------------------------------------------- Organization
  - method: POST
    path: "/organizations"
    description: "Registers a rated organization. All computed roll-up fields start empty: latest_published_score null, published_cycle_count 0, trend_direction NOT_APPLICABLE, substantiated_complaint_count 0."
    roles: [MethodologyAdmin]
    code: 201
    input: [legal_name, ein, org_type, fiscal_year_end_month, contact_email]
    output: Organization
    side_effects:
      - "sets published_cycle_count = 0, substantiated_complaint_count = 0, trend_direction = NOT_APPLICABLE, transition_grace_until = null"

  - method: GET
    path: "/organizations"
    description: "Lists organizations, filterable by type and published trend."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, PublicUser]
    code: 200
    input: ["org_type?", "trend_direction?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  - method: GET
    path: "/organizations/{organization_id}"
    description: "Returns one organization including its published roll-up fields."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/organizations/{organization_id}/rating-trend"
    description: "Computed read. Returns the organization's published history newest-first for the public trend display, plus the roll-up figures."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, OrganizationRep, PublicUser]
    code: 200
    input: ["limit?", "offset?"]
    output: { organization_id: string, latest_published_score: decimal, latest_published_grade: string, published_cycle_count: integer, trend_direction: string, points: "object[]" }
    side_effects: []

  - method: GET
    path: "/organizations/{id}/filing-records"
    description: "Reverse lookup of an organization's filings. Ordered by fiscal_year descending then source_precedence ascending then created_at ascending, which is exactly the winning_filing_selector order."
    roles: [MethodologyAdmin, RatingAnalyst, OrganizationRep]
    code: 200
    input: ["fiscal_year?", "source_kind?", "status?", "limit?", "offset?"]
    output: FilingRecord[]
    side_effects: []

  # ---------------------------------------------------------- MethodologyVersion
  - method: POST
    path: "/methodology-versions"
    description: "Drafts a rating methodology. The four dimension weights must sum to exactly 1.0000. supersedes_version_id names the ADOPTED version this draft is intended to replace; it is what the adopt cascade retires."
    roles: [MethodologyAdmin]
    code: 201
    input: ["version_label", "weight_financial_health", "weight_accountability", "weight_transparency", "weight_impact", "dimension_floor_score?", "comment_period_days?", "transition_period_days?", "supersedes_version_id?", "revision_note?"]
    output: MethodologyVersion
    side_effects:
      - "status = DRAFT, comment_count = 0, unresolved_comment_count = 0"
      - "dimension_floor_score defaults to 40.0, comment_period_days to 30, transition_period_days to 90"

  - method: GET
    path: "/methodology-versions"
    description: "Lists methodology versions. supersedes_version_id is the reverse lookup for the self-referential supersession chain."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, OrganizationRep, PublicUser]
    code: 200
    input: ["status?", "supersedes_version_id?", "limit?", "offset?"]
    output: MethodologyVersion[]
    side_effects: []

  - method: GET
    path: "/methodology-versions/{methodology_version_id}"
    description: "Returns one methodology version with its weights, windows and comment counters."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects: []

  - method: POST
    path: "/methodology-versions/{methodology_version_id}/open-comment"
    description: "Opens the public comment period on a DRAFT methodology."
    roles: [MethodologyAdmin]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects:
      - "status DRAFT -> COMMENT_OPEN"
      - "sets comment_open_at = logical clock and comment_deadline_at = logical clock + comment_period_days days"
      - "increments MethodologyVersion.version by 1"

  - method: POST
    path: "/methodology-versions/{methodology_version_id}/close-comment"
    description: "Closes the comment period. Comments may still be disposed after closing; only new submissions are barred."
    roles: [MethodologyAdmin]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects:
      - "status COMMENT_OPEN -> COMMENT_CLOSED"
      - "sets comment_closed_at = logical clock"
      - "increments MethodologyVersion.version by 1"

  - method: POST
    path: "/methodology-versions/{methodology_version_id}/return-to-draft"
    description: "Sends a COMMENT_CLOSED methodology back to DRAFT so its weights can be revised in response to comments. This is the revision loop the scenario's public-comment process requires."
    roles: [MethodologyAdmin]
    code: 200
    input: ["revision_note", "weight_financial_health?", "weight_accountability?", "weight_transparency?", "weight_impact?", "dimension_floor_score?"]
    output: MethodologyVersion
    side_effects:
      - "status COMMENT_CLOSED -> DRAFT"
      - "overwrites revision_note, and any weight or floor supplied; when any weight is supplied all four must be and they must still sum to 1.0000"
      - "clears comment_open_at, comment_closed_at and comment_deadline_at to null; comment_count and unresolved_comment_count are preserved so prior comments still gate adoption"
      - "increments MethodologyVersion.version by 1"

  - method: POST
    path: "/methodology-versions/{methodology_version_id}/adopt"
    description: "Adopts a COMMENT_CLOSED methodology, retires the version it supersedes, and projects the impact on every already-published organization to mint transition grants."
    roles: [MethodologyAdmin]
    code: 200
    input: ["effective_from", "effective_until?"]
    output: MethodologyVersion
    side_effects:
      - "status COMMENT_CLOSED -> ADOPTED, sets adopted_at = logical clock, effective_from and effective_until"
      - "cascade hop 1 (caused by this adoption): the version named by supersedes_version_id goes ADOPTED -> RETIRED with retired_at = logical clock and effective_until = the new version's effective_from"
      - "cascade hop 2 (caused by hop 1's retirement): methodology_impact_projection runs for every Organization last rated under the retired version and creates a TransitionGrant when projected_score_delta <= -5.00"
      - "cascade hop 3 (caused by hop 2's grant creation): each granted Organization's transition_grace_until is set to that grant's grace_until and its version increments by 1"
      - "increments MethodologyVersion.version by 1 on both the adopted and the retired version"

  - method: GET
    path: "/methodology-versions/{id}/public-comments"
    description: "Reverse lookup of the comments filed against a methodology version, ordered by created_at ascending."
    roles: [MethodologyAdmin, RatingAnalyst, OrganizationRep, PublicUser]
    code: 200
    input: ["status?", "commenter_kind?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  # ---------------------------------------------------------------- PublicComment
  - method: POST
    path: "/public-comments"
    description: "Files a public comment on an open methodology revision. commenter_user_id is taken from X-User-ID, never from the body."
    roles: [PublicUser, OrganizationRep]
    code: 201
    input: [methodology_version_id, commenter_kind, body]
    output: PublicComment
    side_effects:
      - "status = SUBMITTED and commenter_user_id = X-User-ID"
      - "the parent MethodologyVersion's comment_count and unresolved_comment_count each increase by 1 and its version increments by 1"

  - method: POST
    path: "/public-comments/{public_comment_id}/dispose"
    description: "Records how a comment was handled. Every comment must be disposed before the methodology can be adopted."
    roles: [MethodologyAdmin]
    code: 200
    input: ["disposition", "disposition_note?"]
    output: PublicComment
    side_effects:
      - "status SUBMITTED -> INCORPORATED or DECLINED per disposition"
      - "the parent MethodologyVersion's unresolved_comment_count decreases by 1 and its version increments by 1"
      - "increments PublicComment.version by 1"

  # -------------------------------------------------------------- TransitionGrant
  - method: GET
    path: "/transition-grants"
    description: "Reverse lookup for transition grants by organization or by the methodology version that triggered them."
    roles: [MethodologyAdmin, RatingAnalyst, OrganizationRep]
    code: 200
    input: ["organization_id?", "methodology_version_id?", "status?", "limit?", "offset?"]
    output: TransitionGrant[]
    side_effects: []

  - method: GET
    path: "/transition-grants/{transition_grant_id}"
    description: "Returns one transition grant with its projected score delta and grace deadline."
    roles: [MethodologyAdmin, RatingAnalyst, OrganizationRep]
    code: 200
    input: []
    output: TransitionGrant
    side_effects: []

  # ---------------------------------------------------------------- FilingRecord
  - method: POST
    path: "/filing-records"
    description: "Submits a financial filing for an organization and fiscal year, from a public filing, an organization submission or an audited statement. Requires expected_organization_version because a validated submission can supersede an existing VALIDATED filing for the same (organization_id, fiscal_year, source_kind) triple."
    roles: [RatingAnalyst, OrganizationRep]
    code: 201
    input: ["organization_id", "fiscal_year", "source_kind", "total_expense_cents", "program_expense_cents", "fundraising_expense_cents", "admin_expense_cents", "contributions_cents", "total_revenue_cents", "net_assets_cents", "total_liabilities_cents", "grants_paid_cents?", "membership_services_cents?", "joint_cost_allocated_cents?", "expected_organization_version"]
    output: FilingRecord
    side_effects:
      - "status = RECEIVED, source_precedence derived from source_kind, origin = ORG_PORTAL when the caller is OrganizationRep else ANALYST_ENTRY"
      - "increments Organization.version by 1"
      - "the three optional cent amounts default to 0"

  - method: GET
    path: "/filing-records/{filing_record_id}"
    description: "Returns one filing record with its validation status and precedence."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: FilingRecord
    side_effects: []

  - method: POST
    path: "/filing-records/{filing_record_id}/validate"
    description: "Analyst validation gate. Only VALIDATED filings are ever read by a calculation; a REJECTED filing is invisible to scoring no matter how authoritative its source."
    roles: [RatingAnalyst]
    code: 200
    input: ["decision", "rejection_code?"]
    output: FilingRecord
    side_effects:
      - "status RECEIVED -> VALIDATED (decision ACCEPT) sets validated_at = logical clock, or RECEIVED -> REJECTED (decision REJECT) stores rejection_code"
      - "on ACCEPT, any other VALIDATED filing with the same organization_id, fiscal_year and source_kind goes VALIDATED -> SUPERSEDED with superseded_at = logical clock and its version increments by 1"
      - "increments FilingRecord.version by 1"

  # ----------------------------------------------------------- GovernanceProfile
  - method: POST
    path: "/governance-profiles"
    description: "Records the governance disclosure for one rating cycle. At most one profile per cycle. Creation only stores the disclosure; no standard is evaluated until evaluate is called."
    roles: [RatingAnalyst]
    code: 201
    input: ["rating_cycle_id", "board_member_count", "independent_board_member_count", "conflict_of_interest_policy_on_file", "coi_policy_reviewed_at?", "board_meetings_last_year", "audit_committee_exists", "whistleblower_policy", "ceo_compensation_reviewed", "impact_report_on_file", "outcome_measures_count", "third_party_evaluation_on_file"]
    output: GovernanceProfile
    side_effects:
      - "evaluation_status = PENDING, independence_ratio = null, the four standards_*_count fields = 0"

  - method: GET
    path: "/governance-profiles"
    description: "Reverse lookup of governance profiles by rating cycle. The array is length 0 or 1 for any single rating_cycle_id."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["rating_cycle_id?", "evaluation_status?", "limit?", "offset?"]
    output: GovernanceProfile[]
    side_effects: []

  - method: GET
    path: "/governance-profiles/{governance_profile_id}"
    description: "Returns one governance profile with its independence ratio and standards counts."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: GovernanceProfile
    side_effects: []

  - method: POST
    path: "/governance-profiles/{governance_profile_id}/evaluate"
    description: "Runs the standards evaluation, minting exactly eight StandardEvaluation rows whose results partition into met, not-met, waived and not-applicable."
    roles: [RatingAnalyst]
    code: 200
    input: []
    output: GovernanceProfile
    side_effects:
      - "evaluation_status PENDING -> EVALUATED, sets independence_ratio and evaluated_at"
      - "creates eight StandardEvaluation rows per the standards_evaluation calculation"
      - "sets standards_met_count, standards_not_met_count, standards_waived_count (0) and standards_not_applicable_count"
      - "sets the parent RatingCycle.failed_standard_count = standards_not_met_count and increments that cycle's version by 1"
      - "increments GovernanceProfile.version by 1"

  - method: GET
    path: "/governance-profiles/{id}/standard-evaluations"
    description: "Reverse lookup of the eight standard evaluations of a profile, ordered by standard_code ascending so a filtered read is positionally stable."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["standard_code?", "result?", "limit?", "offset?"]
    output: StandardEvaluation[]
    side_effects: []

  # ---------------------------------------------------------- StandardEvaluation
  - method: GET
    path: "/standard-evaluations/{standard_evaluation_id}"
    description: "Returns one standard evaluation with its observed and required values."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: StandardEvaluation
    side_effects: []

  - method: POST
    path: "/standard-evaluations/{standard_evaluation_id}/waive"
    description: "Waives a failed standard. A waived standard scores 2 points where a met standard scores 3, so waiving improves the accountability dimension without erasing the shortfall, and the four standards counts still partition eight."
    roles: [MethodologyAdmin]
    code: 200
    input: [waiver_reason]
    output: StandardEvaluation
    side_effects:
      - "result NOT_MET -> WAIVED, stores waiver_reason and waived_by_user_id = X-User-ID"
      - "the owning GovernanceProfile's standards_not_met_count decreases by 1, standards_waived_count increases by 1, and its version increments by 1"
      - "the owning RatingCycle's failed_standard_count decreases by 1 and its version increments by 1"
      - "when the ACCOUNTABILITY DimensionScore is COMPUTED or OVERRIDDEN, its raw_points, normalized_score and weighted_contribution are recomputed and the cycle's provisional and final figures are rewritten"
      - "increments StandardEvaluation.version by 1"

  - method: POST
    path: "/standard-evaluations/{standard_evaluation_id}/revoke-waiver"
    description: "Compensating action that undoes a waiver. Every field the waiver touched returns to its pre-waiver value with no drift."
    roles: [MethodologyAdmin]
    code: 200
    input: ["revocation_note?"]
    output: StandardEvaluation
    side_effects:
      - "result WAIVED -> NOT_MET, clears waiver_reason and waived_by_user_id to null"
      - "the owning GovernanceProfile's standards_waived_count decreases by 1, standards_not_met_count increases by 1, and its version increments by 1"
      - "the owning RatingCycle's failed_standard_count increases by 1 and its version increments by 1"
      - "the ACCOUNTABILITY DimensionScore and the cycle's provisional and final figures return to their pre-waiver values"
      - "increments StandardEvaluation.version by 1"

  # ---------------------------------------------------------------- RatingCycle
  - method: POST
    path: "/rating-cycles"
    description: "Opens a rating cycle for one organization and fiscal year, PINNING the methodology version that will score it. The pin is what makes a mid-cycle methodology revision harmless: the cycle keeps its pinned weights even after that version is retired."
    roles: [RatingAnalyst]
    code: 201
    input: ["organization_id", "methodology_version_id", "fiscal_year", "period_start", "period_end", "assigned_analyst_user_id", "use_transition_grant?"]
    output: RatingCycle
    side_effects:
      - "status = DATA_COLLECTION, correction_round = 0, methodology_pin_locked = true, all score and ratio fields null"
      - "when the pinned version is RETIRED and use_transition_grant is true, the organization's ACTIVE TransitionGrant whose superseded_version_label equals the pinned version's version_label goes ACTIVE -> CONSUMED and its version increments by 1"

  - method: GET
    path: "/rating-cycles"
    description: "Reverse lookup of rating cycles by organization, by pinned methodology version, by status or by fiscal year."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: ["organization_id?", "methodology_version_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: RatingCycle[]
    side_effects: []

  - method: GET
    path: "/rating-cycles/{rating_cycle_id}"
    description: "Returns one rating cycle with both the provisional and the final score family."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: []
    output: RatingCycle
    side_effects: []

  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/score"
    description: "Runs the full scoring pipeline: winning filing selection, ratio and efficiency and reserve calculations, dimension points, per-dimension completeness, then BOTH composite variants. Callable only from DATA_COLLECTION, which is also where an accepted correction or a granted appeal returns the cycle, so a re-score is a fresh DATA_COLLECTION -> SCORED traversal rather than a self-loop."
    roles: [RatingAnalyst]
    code: 200
    input: []
    output: RatingCycle
    side_effects:
      - "status DATA_COLLECTION -> SCORED, including the re-score after a correction or granted appeal rewound the cycle"
      - "computes program_expense_ratio, fundraising_efficiency and months_of_reserve"
      - "creates or rewrites the four DimensionScore rows with raw_points, max_points, normalized_score, weight_applied, weighted_contribution, data_completeness_pct and status = COMPUTED"
      - "sets data_completeness_pct, weighted_sum_provisional, provisional_composite_score, provisional_grade, weighted_sum_final, final_composite_score, grade and standards_penalty_points"
      - "increments RatingCycle.version by 1"

  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/open-org-review"
    description: "Sends a scored cycle to the organization for review before publication, arming the correction window."
    roles: [RatingAnalyst]
    code: 200
    input: []
    output: RatingCycle
    side_effects:
      - "status SCORED -> ORG_REVIEW"
      - "sets review_opened_at = logical clock and correction_deadline_at = logical clock + 21 days"
      - "increments RatingCycle.version by 1"

  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/publish"
    description: "Publishes the final rating. Requires a different acting user from the cycle's assigned analyst, an elapsed correction window, no open correction or appeal, and sufficient data completeness."
    roles: [PublishingReviewer]
    code: 200
    input: ["publishing_reviewer_note?"]
    output: RatingCycle
    side_effects:
      - "status ORG_REVIEW or APPEAL_RESOLVED -> PUBLISHED, sets published_at = logical clock and publishing_reviewer_user_id = X-User-ID"
      - "cascade hop 2 (caused by hop 1's PUBLISHED state): creates the immutable PublicationRecord with sequence_number, previous_published_score, score_delta and change_direction per publication_change_classification"
      - "cascade hop 3 (caused by hop 2's record creation): notified_recipient_kinds is populated on that record, and the Organization's latest_published_score, latest_published_grade, published_cycle_count and trend_direction are recomputed from the new record with its version incremented by 1"
      - "because the cycle is now PUBLISHED it also leaves the complaint_penalty_target candidate pool, so a later substantiation selects a different open cycle or none"
      - "increments RatingCycle.version by 1"

  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/withdraw"
    description: "Withdraws a cycle from any pre-publication state, terminating every open correction, appeal and dimension row beneath it."
    roles: [MethodologyAdmin]
    code: 200
    input: [withdrawal_reason]
    output: RatingCycle
    side_effects:
      - "status DATA_COLLECTION, SCORED, ORG_REVIEW, CORRECTION_REQUESTED, APPEAL_OPEN or APPEAL_RESOLVED -> WITHDRAWN, stores withdrawal_reason"
      - "every CorrectionRequest of the cycle in SUBMITTED or UNDER_ANALYST_REVIEW goes to REJECTED"
      - "every Appeal of the cycle in FILED or PANEL_ASSIGNED goes to DISMISSED"
      - "every DimensionScore of the cycle in COMPUTED or OVERRIDDEN goes to STALE"
      - "increments RatingCycle.version by 1"

  - method: GET
    path: "/rating-cycles/{rating_cycle_id}/score-breakdown"
    description: "Computed read exposing the intermediate figures behind both composite variants, so a test can inspect the pinned rounding order without recomputing it."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: { rating_cycle_id: string, methodology_version_label: string, program_expense_ratio: decimal, fundraising_efficiency: decimal, months_of_reserve: decimal, data_completeness_pct: decimal, failed_standard_count: integer, accountability_penalty_points: integer, provisional_band: string, provisional_penalty: decimal, weighted_sum_provisional: decimal, provisional_composite_score: decimal, provisional_grade: string, final_included_dimensions: "string[]", final_band: string, final_penalty: decimal, weighted_sum_final: decimal, final_composite_score: decimal, grade: string }
    side_effects: []

  - method: GET
    path: "/rating-cycles/{id}/dimension-scores"
    description: "Reverse lookup of a cycle's dimension scores, ordered FINANCIAL_HEALTH, ACCOUNTABILITY, TRANSPARENCY, IMPACT so a filtered read is positionally stable."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["dimension?", "status?", "limit?", "offset?"]
    output: DimensionScore[]
    side_effects: []

  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/dimension-overrides"
    description: "Bulk analyst override of one or more dimension raw_points on a SCORED cycle, used when a dimension needs a judgement the automated pipeline cannot make. `overrides` is a non-empty array of objects {dimension_score_id, raw_points}; every dimension_score_id must resolve to a DimensionScore of THIS cycle else ERR_DIMENSION_SCORE_NOT_FOUND, and every raw_points must be an integer in 0..that row's max_points else ERR_INVALID_REQUEST. All-or-nothing: if any entry is invalid nothing is written. Requires expected_rating_cycle_version because a later override supersedes an earlier one with no state precondition to catch it."
    roles: [RatingAnalyst]
    code: 200
    input: [overrides, override_reason, expected_rating_cycle_version]
    output: RatingCycle
    side_effects:
      - "each named DimensionScore takes the supplied raw_points, recomputes normalized_score and weighted_contribution, goes COMPUTED or STALE -> OVERRIDDEN, stores override_reason and overridden_by_user_id = X-User-ID, and increments its version by 1"
      - "the cycle recomputes both composite variants and their grades, status SCORED -> SCORED"
      - "increments RatingCycle.version by 1"

  # ----------------------------------------------------------- CorrectionRequest
  - method: POST
    path: "/correction-requests"
    description: "The rated organization's correction channel during review. Names the field it disputes and the value it asserts; acceptance substitutes that value and rewinds the cycle for re-scoring."
    roles: [OrganizationRep]
    code: 201
    input: ["rating_cycle_id", "target_kind", "target_field_name", "proposed_value", "narrative", "target_fiscal_year?", "target_source_kind?"]
    output: CorrectionRequest
    side_effects:
      - "status = SUBMITTED, submitted_by_org_user_id = X-User-ID, round_number = cycle.correction_round + 1"
      - "the parent RatingCycle goes ORG_REVIEW -> CORRECTION_REQUESTED and its version increments by 1"

  - method: GET
    path: "/correction-requests"
    description: "Reverse lookup of correction requests by rating cycle."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["rating_cycle_id?", "status?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []

  - method: GET
    path: "/correction-requests/{correction_request_id}"
    description: "Returns one correction request with its decision trail."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects: []

  - method: POST
    path: "/correction-requests/{correction_request_id}/claim"
    description: "The cycle's assigned analyst takes ownership of a submitted correction. Only the assigned analyst may claim it."
    roles: [RatingAnalyst]
    code: 200
    input: []
    output: CorrectionRequest
    side_effects:
      - "status SUBMITTED -> UNDER_ANALYST_REVIEW, stores claimed_by_user_id = X-User-ID"
      - "increments CorrectionRequest.version by 1"

  - method: POST
    path: "/correction-requests/{correction_request_id}/decide"
    description: "Accepts or rejects a claimed correction. Acceptance rewinds the cycle to data collection and substitutes the disputed value; rejection returns it to review and arms the appeal window."
    roles: [RatingAnalyst]
    code: 200
    input: ["decision", "decision_note?"]
    output: CorrectionRequest
    side_effects:
      - "status UNDER_ANALYST_REVIEW -> ACCEPTED or REJECTED, stores decided_by_user_id = X-User-ID, decision_note and decided_at = logical clock"
      - "on ACCEPT, cascade hop 1: status -> ACCEPTED"
      - "on ACCEPT, cascade hop 2 (caused by hop 1): the cycle goes CORRECTION_REQUESTED -> DATA_COLLECTION, correction_round increases by 1, and review_opened_at and correction_deadline_at are cleared"
      - "on ACCEPT, cascade hop 3 (caused by hop 2 reopening data collection): the disputed value is substituted - a FILING_FINANCIAL target supersedes the winning filing with a CORRECTION_APPLIED replacement, a GOVERNANCE_DISCLOSURE target sends the GovernanceProfile EVALUATED -> PENDING and deletes its eight StandardEvaluation rows - and every DimensionScore in COMPUTED or OVERRIDDEN goes to STALE"
      - "on ACCEPT, cascade hop 4 (caused by hop 3 deleting the standard rows): the cycle's failed_standard_count and the profile's four standards_*_count fields are reset to 0, so the next score call recomputes the accountability penalty from scratch"
      - "on REJECT: the cycle goes CORRECTION_REQUESTED -> ORG_REVIEW and appeal_deadline_at is set to logical clock + 14 days"
      - "increments RatingCycle.version by 1 and CorrectionRequest.version by 1"

  # ---------------------------------------------------------------------- Appeal
  - method: POST
    path: "/appeals"
    description: "The organization's appeal against a rejected correction. Admissible only while the appeal window is open and only against a REJECTED correction."
    roles: [OrganizationRep]
    code: 201
    input: [rating_cycle_id, correction_request_id, grounds]
    output: Appeal
    side_effects:
      - "status = FILED, filed_by_org_user_id = X-User-ID, filed_at = logical clock, deadline_at = the cycle's appeal_deadline_at, panel_member_user_ids = []"
      - "the parent RatingCycle goes ORG_REVIEW -> APPEAL_OPEN and its version increments by 1"

  - method: GET
    path: "/appeals"
    description: "Reverse lookup of appeals by rating cycle or by the correction request they contest."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["rating_cycle_id?", "correction_request_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/appeals/{appeal_id}"
    description: "Returns one appeal with its panel and decision."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{appeal_id}/assign-panel"
    description: "Seats exactly three distinct panelists, none of whom may be the cycle's assigned analyst or its publishing reviewer. The assigning admin may not be the assigned analyst either."
    roles: [MethodologyAdmin]
    code: 200
    input: [panel_member_user_ids]
    output: Appeal
    side_effects:
      - "status FILED -> PANEL_ASSIGNED, stores panel_member_user_ids"
      - "increments Appeal.version by 1"

  - method: POST
    path: "/appeals/{appeal_id}/decide"
    description: "A seated panelist decides the appeal three ways. GRANT rewinds the rating and flips the contested correction to ACCEPTED; DENY and DISMISS both advance the cycle to APPEAL_RESOLVED but only DENY records a merits finding."
    roles: [AppealPanelist]
    code: 200
    input: ["decision", "decision_note?"]
    output: Appeal
    side_effects:
      - "status PANEL_ASSIGNED -> GRANTED, DENIED or DISMISSED, stores decided_by_user_id = X-User-ID, decided_at = logical clock and decision_note"
      - "on GRANT: the contested CorrectionRequest goes REJECTED -> ACCEPTED with its substitution applied, the cycle goes APPEAL_OPEN -> DATA_COLLECTION, correction_round increases by 1, every DimensionScore goes to STALE"
      - "on DENY or DISMISS: the cycle goes APPEAL_OPEN -> APPEAL_RESOLVED with no score change; the contested correction stays REJECTED"
      - "increments RatingCycle.version by 1 and Appeal.version by 1"

  # ------------------------------------------------------------------- Complaint
  - method: POST
    path: "/complaints"
    description: "Donor and stakeholder complaint intake. Filed against an organization, not against a rating; the penalty target is chosen only if and when the complaint is substantiated."
    roles: [PublicUser, OrganizationRep]
    code: 201
    input: ["organization_id", "complainant_kind", "category", "narrative", "corroborating_document_count?"]
    output: Complaint
    side_effects:
      - "status = INTAKE, complainant_user_id = X-User-ID, corroborating_document_count defaults to 0, credibility_score and severity_tier stay null, penalty_points_applied = 0, penalized_rating_cycle_id = null"

  - method: GET
    path: "/complaints"
    description: "Reverse lookup of complaints by organization or by the rating cycle a substantiated complaint penalised."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: ["organization_id?", "penalized_rating_cycle_id?", "status?", "category?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/complaints/{complaint_id}"
    description: "Returns one complaint with its credibility score, severity tier and applied penalty."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{complaint_id}/triage"
    description: "Three-way intake fork. INVESTIGATE scores the complaint at intake and arms the investigation clock; CLOSE_NO_ACTION terminates it unscored; REFER_OUT terminates it scored but never penalising."
    roles: [RatingAnalyst]
    code: 200
    input: ["disposition", "triage_note?", "referred_to?"]
    output: Complaint
    side_effects:
      - "status INTAKE -> INVESTIGATING, CLOSED_NO_ACTION or REFERRED_OUT per disposition"
      - "on INVESTIGATE and REFER_OUT: sets credibility_score via the intake variant, credibility_variant = INTAKE and severity_tier"
      - "on INVESTIGATE only: sets investigation_due_at = logical clock + 30 days"
      - "on CLOSE_NO_ACTION and REFER_OUT: sets resolved_at = logical clock"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/complaints/{complaint_id}/resolve"
    description: "Closes an investigation. A substantiated finding recomputes credibility under the investigated variant, re-derives the severity tier that caps the admissible penalty, then drives the four-hop accountability cascade into the organization's most recent open rating cycle."
    roles: [RatingAnalyst]
    code: 200
    input: ["finding", "penalty_points?", "finding_note?"]
    output: Complaint
    side_effects:
      - "status INVESTIGATING -> SUBSTANTIATED or UNSUBSTANTIATED per finding"
      - "recomputes credibility_score via the investigated variant, sets credibility_variant = INVESTIGATED and re-derives severity_tier"
      - "on SUBSTANTIATED: stores penalty_points_applied, sets penalized_rating_cycle_id via the complaint_penalty_target selector (or leaves it null when no open cycle exists), and drives hops 2 to 4 of the cascade - ACCOUNTABILITY DimensionScore penalised and STALE, cycle provisional figures recomputed and any of ORG_REVIEW, CORRECTION_REQUESTED or APPEAL_OPEN reverted to SCORED, then open appeals DISMISSED and open corrections REJECTED"
      - "the Organization's substantiated_complaint_count is recomputed and its version increments by 1"
      - "sets resolved_at = logical clock"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/complaints/{complaint_id}/reverse-finding"
    description: "Compensating action reversing a substantiated finding. Every accountability point the finding removed is restored and the penalty ledger returns to its prior value with no drift."
    roles: [MethodologyAdmin]
    code: 200
    input: [reversal_reason]
    output: Complaint
    side_effects:
      - "status SUBSTANTIATED -> INVESTIGATING, stores reversal_reason, sets penalty_points_applied = 0, clears resolved_at and penalized_rating_cycle_id to null"
      - "the previously penalised cycle's ACCOUNTABILITY DimensionScore has the reversed points removed from penalty_points, its raw_points recomputed from source data, and goes STALE -> COMPUTED"
      - "that cycle's accountability_penalty_points, provisional figures and standards_penalty_points return to their pre-substantiation values and its version increments by 1"
      - "the Organization's substantiated_complaint_count is recomputed and its version increments by 1"
      - "increments Complaint.version by 1"

  # ----------------------------------------------------------- PublicationRecord
  - method: GET
    path: "/publication-records"
    description: "Reverse lookup of the immutable publication ledger by organization or by rating cycle, ordered by sequence_number ascending."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: ["organization_id?", "rating_cycle_id?", "limit?", "offset?"]
    output: PublicationRecord[]
    side_effects: []

  - method: GET
    path: "/publication-records/{publication_record_id}"
    description: "Returns one publication record. The entity is append-only: it has no version field, no update endpoint and no delete endpoint."
    roles: [MethodologyAdmin, RatingAnalyst, PublishingReviewer, AppealPanelist, OrganizationRep, PublicUser]
    code: 200
    input: []
    output: PublicationRecord
    side_effects: []

# =============================================================================
# Section 6: Error Code Catalog
# =============================================================================
errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not among the target endpoint's declared roles, or an AppealPanelist deciding an appeal is not a member of its panel_member_user_ids"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An OrganizationRep acts on a resource belonging to a different Organization than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The publishing reviewer's X-User-ID equals the cycle's assigned_analyst_user_id, or the MethodologyAdmin assigning an appeal panel is that same analyst"
  - id: ERR_NOT_ASSIGNED_ANALYST
    http: 403
    condition: "A RatingAnalyst acts on a cycle or correction whose assigned_analyst_user_id is a different user"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unparseable value, out-of-range integer, malformed ISO-8601 instant, or enum value outside its declared set"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"

  # ---- existence ----
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "organization_id does not resolve"
  - id: ERR_METHODOLOGY_VERSION_NOT_FOUND
    http: 404
    condition: "methodology_version_id or supersedes_version_id does not resolve"
  - id: ERR_PUBLIC_COMMENT_NOT_FOUND
    http: 404
    condition: "public_comment_id does not resolve"
  - id: ERR_TRANSITION_GRANT_NOT_FOUND
    http: 404
    condition: "transition_grant_id does not resolve"
  - id: ERR_RATING_CYCLE_NOT_FOUND
    http: 404
    condition: "rating_cycle_id or penalized_rating_cycle_id does not resolve"
  - id: ERR_FILING_RECORD_NOT_FOUND
    http: 404
    condition: "filing_record_id does not resolve"
  - id: ERR_GOVERNANCE_PROFILE_NOT_FOUND
    http: 404
    condition: "governance_profile_id does not resolve"
  - id: ERR_STANDARD_EVALUATION_NOT_FOUND
    http: 404
    condition: "standard_evaluation_id does not resolve"
  - id: ERR_DIMENSION_SCORE_NOT_FOUND
    http: 404
    condition: "A dimension_score_id inside a dimension-overrides entry does not resolve, or resolves to a row belonging to a different rating cycle"
  - id: ERR_CORRECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "correction_request_id does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id does not resolve"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint_id does not resolve"
  - id: ERR_PUBLICATION_RECORD_NOT_FOUND
    http: 404
    condition: "publication_record_id does not resolve"

  # ---- state preconditions ----
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "The RatingCycle is not in a state from which the requested transition is declared - scoring a PUBLISHED cycle, opening review on a DATA_COLLECTION cycle, overriding dimensions on a WITHDRAWN cycle, waiving a standard on a published cycle"
  - id: ERR_FILING_STATE_INVALID
    http: 409
    condition: "Validating a FilingRecord that is not RECEIVED"
  - id: ERR_METHODOLOGY_STATE_INVALID
    http: 409
    condition: "Opening comment on a non-DRAFT version, closing comment on a non-COMMENT_OPEN version, returning a non-COMMENT_CLOSED version to draft, or adopting a version that is not COMMENT_CLOSED"
  - id: ERR_GOVERNANCE_STATE_INVALID
    http: 409
    condition: "Evaluating a GovernanceProfile that is already EVALUATED"
  - id: ERR_STANDARD_STATE_INVALID
    http: 409
    condition: "Waiving a StandardEvaluation whose result is not NOT_MET, or revoking a waiver on one whose result is not WAIVED"
  - id: ERR_CORRECTION_STATE_INVALID
    http: 409
    condition: "Claiming a CorrectionRequest that is not SUBMITTED, or deciding one that is not UNDER_ANALYST_REVIEW"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "Assigning a panel to an Appeal that is not FILED, or deciding one that is not PANEL_ASSIGNED"
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "Triaging a Complaint that is not INTAKE, resolving one that is not INVESTIGATING, or reversing a finding on one that is not SUBSTANTIATED"
  - id: ERR_CYCLE_NOT_PUBLISHABLE
    http: 409
    condition: "Publishing before correction_deadline_at, or while any CorrectionRequest of the cycle is SUBMITTED or UNDER_ANALYST_REVIEW, or while any Appeal is FILED or PANEL_ASSIGNED"

  # ---- concurrency ----
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_organization_version or expected_rating_cycle_version does not equal the parent's current version"

  # ---- cross-entity referential state ----
  - id: ERR_METHODOLOGY_NOT_ADOPTED
    http: 409
    condition: "A RatingCycle pins a MethodologyVersion whose status is not ADOPTED"
  - id: ERR_CORRECTION_NOT_REJECTED
    http: 409
    condition: "An Appeal contests a CorrectionRequest whose status is not REJECTED"
  - id: ERR_GOVERNANCE_NOT_EVALUATED
    http: 409
    condition: "Scoring a cycle whose GovernanceProfile is missing or still PENDING"
  - id: ERR_TRANSITION_GRACE_UNAVAILABLE
    http: 409
    condition: "A new RatingCycle pins a RETIRED MethodologyVersion with use_transition_grant true, but the organization holds no ACTIVE TransitionGrant whose superseded_version_label equals that version's version_label, or that grant's grace_until has already passed. A RETIRED pin WITHOUT use_transition_grant never reaches this rule - priority 12 rejects it as ERR_METHODOLOGY_NOT_ADOPTED first"

  # ---- temporal ----
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 409
    condition: "to_iso8601 is earlier than the current logical clock"
  - id: ERR_METHODOLOGY_NOT_EFFECTIVE
    http: 409
    condition: "The pinned MethodologyVersion's effectivity interval does not contain the logical clock"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "An Appeal is filed at or after the cycle's appeal_deadline_at, or the cycle has no appeal_deadline_at armed"
  - id: ERR_METHODOLOGY_WINDOW_CONFLICT
    http: 409
    condition: "effective_from is less than 30 days after the logical clock, effective_until is not after effective_from, or the closed interval overlaps that of an ADOPTED version other than the one being superseded"
  - id: ERR_CYCLE_PERIOD_OVERLAP
    http: 409
    condition: "A new cycle's half-open [period_start, period_end) interval overlaps a non-WITHDRAWN cycle of the same organization; touching endpoints do not overlap"

  # ---- business constraints ----
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "The four dimension weights do not sum to exactly 1.0000, or any weight is not strictly positive"
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "ein already registered to another Organization"
  - id: ERR_DUPLICATE_VERSION_LABEL
    http: 409
    condition: "version_label already used by another MethodologyVersion"
  - id: ERR_DUPLICATE_GOVERNANCE_PROFILE
    http: 409
    condition: "The RatingCycle already has a GovernanceProfile"
  - id: ERR_COMMENT_PERIOD_CLOSED
    http: 409
    condition: "A PublicComment is submitted while the version is not COMMENT_OPEN or after comment_deadline_at"
  - id: ERR_UNRESOLVED_COMMENTS
    http: 409
    condition: "Adopting a MethodologyVersion whose unresolved_comment_count is greater than 0"
  - id: ERR_CORRECTION_ROUND_LIMIT
    http: 409
    condition: "A correction is filed or accepted when the cycle's correction_round has already reached 2"
  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "The RatingCycle already has an Appeal in FILED, PANEL_ASSIGNED, GRANTED or DENIED"
  - id: ERR_PANEL_COMPOSITION_INVALID
    http: 422
    condition: "panel_member_user_ids does not hold exactly three distinct ids, or includes the cycle's assigned_analyst_user_id or publishing_reviewer_user_id"
  - id: ERR_PENALTY_POINTS_RANGE
    http: 422
    condition: "penalty_points is outside 1..15, exceeds the cap for the severity tier derived from the investigated credibility score, or is non-zero on an UNSUBSTANTIATED finding"

  # ---- fiscal / data sufficiency ----
  - id: ERR_EXPENSE_COMPONENTS_MISMATCH
    http: 422
    condition: "total_expense_cents does not equal program + fundraising + admin, or joint_cost_allocated_cents exceeds program_expense_cents"
  - id: ERR_NO_VALIDATED_FILING
    http: 409
    condition: "Scoring a cycle with no VALIDATED FilingRecord for its own fiscal_year"
  - id: ERR_DATA_COMPLETENESS_TOO_LOW
    http: 409
    condition: "Publishing a cycle whose data_completeness_pct is below 60.00 - an UNRATED cycle may be scored and reviewed but never published"

# =============================================================================
# Section 7: RBAC Matrix
# =============================================================================
roles:
  - name: RatingAnalyst
    description: "Charity-evaluation analyst who collects and validates filings, records governance disclosures, runs scoring, opens organization review, decides corrections and triages and resolves complaints. May never publish the cycle they scored."
    identity: "opaque"
    exclusive_operations:
      - "POST /filing-records/{filing_record_id}/validate"
      - "POST /governance-profiles"
      - "POST /governance-profiles/{governance_profile_id}/evaluate"
      - "POST /rating-cycles"
      - "POST /rating-cycles/{rating_cycle_id}/score"
      - "POST /rating-cycles/{rating_cycle_id}/open-org-review"
      - "POST /rating-cycles/{rating_cycle_id}/dimension-overrides"
      - "POST /correction-requests/{correction_request_id}/claim"
      - "POST /correction-requests/{correction_request_id}/decide"
      - "POST /complaints/{complaint_id}/triage"
      - "POST /complaints/{complaint_id}/resolve"
    shared_operations:
      - "POST /filing-records"
      - "GET /organizations"
      - "GET /organizations/{organization_id}"
      - "GET /organizations/{organization_id}/rating-trend"
      - "GET /organizations/{id}/filing-records"
      - "GET /filing-records/{filing_record_id}"
      - "GET /methodology-versions"
