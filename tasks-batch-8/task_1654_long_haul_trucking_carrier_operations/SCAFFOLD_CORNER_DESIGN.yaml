  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role/existence check."
        test_recipe:
          setup: ["one driver exists"]
          setup_api_calls:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-V1", full_name: "V One", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
          trigger:
            - { call: "GET /drivers/${drv}", payload: {}, as: Dispatcher }
          assert:
            - "the trigger request is sent WITHOUT X-User-ID and X-User-Role headers -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the as:/as_user_id: recipe fields document the would-be caller and are omitted from the actual request)"

      - name: existence_beats_body_format
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_LOAD_NOT_FOUND]"]
        distinguishing_aspect: "Priority: unknown load id (404) beats an invalid body enum (400): POST accessorial with type BOGUS on a missing load returns ERR_LOAD_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accessorials", payload: { type: "BOGUS", quantity: 5 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_LOAD_NOT_FOUND (existence priority 3 before body-format priority 4)"

      - name: occ_stale_driver_patch_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[driver-patch-stale-version]", "errors[ERR_STALE_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: "OCC on Driver.version: patch with the observed version succeeds (v1->v2); replaying the same stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["driver created, version captured"]
          setup_api_calls:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-V3", full_name: "V Three", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id, dv: $.data.version } }
          trigger:
            - { call: "PATCH /drivers/${drv}", payload: { home_terminal: "FTW", expected_driver_version: "${dv}" }, as: FleetAdmin, captures: { dv2: $.data.version } }
            - { call: "PATCH /drivers/${drv}", payload: { home_terminal: "HOU", expected_driver_version: "${dv}" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first patch: ${dv2} == 2; second patch with stale version: captured ${err} == ERR_STALE_VERSION (412)"

