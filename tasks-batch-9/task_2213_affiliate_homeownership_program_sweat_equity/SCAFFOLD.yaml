# =============================================================================
# Task 2213 — Affiliate Homeownership Program & Sweat Equity
# Seed tables §1.0 – §1.7 (single source of truth for downstream PRD / tests /
# reference implementation). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  2213. Affiliate Homeownership Program & Sweat Equity (Habitat for Humanity affiliate): applicant selection on need, ability to pay and willingness to partner with a documented selection process, sweat equity hour requirements with tracking, credit and family-member allocation, homebuyer education curriculum completion before closing, construction volunteer scheduling, site safety and skilled trade coordination, mortgage origination with affordability-based payment structuring and subsidy silent second liens, land acquisition, lot readiness and construction cost management with donated materials, resale restrictions, right of first refusal and foreclosure prevention counseling, donor and grant reporting on households served

domain_name: affiliate-homeownership-sweat-equity
api_prefix: /homeownership

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a top-level collection under /homeownership; relationships are
  # expressed by explicit FK fields, never by URL nesting.

  state_machine_shape: branching
  # Non-linear shapes present: ApplicantHousehold carries TWO independent state
  # dimensions (selection_status x partnership_readiness); MortgageApplication
  # carries TWO (status x lien_status) with a UNDERWRITING->DRAFT revision cycle;
  # SweatEquityEntry has a REJECTED->CLAIMED cycle; ShiftAssignment is a fork with
  # divergent side-effect sets per branch (COMPLETED vs NO_SHOW).

  relationship_patterns:
    - one_to_many          # AffiliateProgram -> ApplicantHousehold / BuildSite / GrantAward
    - many_to_many         # ShiftAssignment joins VolunteerProfile x ConstructionShift
    - self_referential     # SweatEquityEntry.reversal_of_entry_id -> SweatEquityEntry.id
    - cross_aggregate      # MortgageApplication references both ApplicantHousehold and BuildSite

  role_model: segregation_of_duties
  # A user who submitted a SelectionReview on a household may not underwrite or
  # approve that household's mortgage; the user who claims sweat equity hours may
  # not verify them.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities, 8 state machines (2 entities with parallel dimensions), 9
  # calculations (2 dual-variant on different domains), 3 OCC parents, 67 endpoints.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: AffiliateProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: affiliate_name, type: string, source: input, description: "Habitat affiliate legal name", constraints: "1..120 chars, unique" }
      - { name: service_area_code, type: string, source: input, description: "County/service-area code the affiliate builds in", constraints: "2..10 chars uppercase" }
      - { name: ami_median_income_cents, type: integer, source: input, description: "Area median income (annual, cents) used as the denominator of every AMI band test", constraints: ">= 1000000" }
      - { name: sweat_equity_base_hours_required, type: number, source: input, default: 300, description: "Base sweat equity hours required of a partner household with one adult occupant", constraints: ">= 0, <= 500, 2dp" }
      - { name: committee_quorum, type: integer, source: input, default: 3, description: "Distinct SelectionCommitteeMember reviewers required per scoring dimension before a selection decision is allowed", constraints: ">= 2, <= 9" }
      - { name: subsidy_pool_cents, type: integer, source: input, description: "Total silent-second subsidy capital the affiliate may commit this program", constraints: ">= 0" }
      - { name: subsidy_committed_cents, type: integer, source: computed, default: 0, description: "Sum of silent_second_amount_cents over MortgageApplication rows whose status IN {APPROVED, CLEARED_TO_CLOSE}" }
      - { name: subsidy_disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of silent_second_amount_cents over MortgageApplication rows whose status == CLOSED AND lien_status IN {ACTIVE, FORBEARANCE, TRANSFER_PENDING}" }
      - { name: subsidy_available_cents, type: integer, source: computed, default: 0, description: "= subsidy_pool_cents - subsidy_committed_cents - subsidy_disbursed_cents; conserved-quantity identity of calculations.subsidy_pool_ledger" }
      - { name: donated_material_fmv_cents, type: integer, source: computed, default: 0, description: "Sum of CostEntry.fair_market_value_cents where is_in_kind == true AND status == RECORDED, across all BuildSite rows of this program" }
      - { name: households_served_count, type: integer, source: computed, default: 0, description: "Count of ApplicantHousehold rows of this program whose selection_status == CLOSED" }
      - { name: program_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | SUBSIDY_RESTRICTED | FROZEN — derived gate: FROZEN when status == SUSPENDED; SUBSIDY_RESTRICTED when subsidy_available_cents == 0 and status == ACTIVE; else OPEN", constraints: "OPEN | SUBSIDY_RESTRICTED | FROZEN" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — set at creation to ACTIVE, flipped by POST /programs/{id}/subsidy-pool-adjustments with action SUSPEND_PROGRAM / RESUME_PROGRAM", constraints: "ACTIVE | SUSPENDED" }

  - name: ApplicantHousehold
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AffiliateProgram.id; the affiliate that owns this application" }
      - { name: household_name, type: string, source: input, description: "Applicant household display name", constraints: "1..120 chars" }
      - { name: household_size, type: integer, source: input, description: "Total persons who will occupy the home", constraints: ">= 1, <= 12" }
      - { name: adult_occupant_count, type: integer, source: computed, default: 1, description: "Count of HouseholdMember rows of this household with is_adult_occupant == true AND status == ACTIVE; minimum 1" }
      - { name: current_bedroom_count, type: integer, source: input, description: "Bedrooms in the household's current dwelling, used by the overcrowding term of need_score", constraints: ">= 0, <= 10" }
      - { name: habitability_deficiency_count, type: integer, source: input, description: "Documented substandard-housing deficiencies in the current dwelling", constraints: ">= 0, <= 10" }
      - { name: self_reported_annual_income_cents, type: integer, source: input, description: "Annual gross household income as stated on the application", constraints: ">= 0" }
      - { name: self_reported_housing_cost_cents, type: integer, source: input, description: "Current monthly housing cost as stated on the application", constraints: ">= 0" }
      - { name: verified_annual_income_cents, type: integer, source: input, default: null, description: "Annual gross income substantiated by pay stubs and tax returns; written only by POST /households/{id}/screen", constraints: "null or >= 0" }
      - { name: verified_housing_cost_cents, type: integer, source: input, default: null, description: "Monthly housing cost substantiated by lease/mortgage statement; written only by POST /households/{id}/screen", constraints: "null or >= 0" }
      - { name: monthly_debt_payment_cents, type: integer, source: input, description: "Recurring monthly non-housing debt service", constraints: ">= 0" }
      - { name: credit_score, type: integer, source: input, description: "Tri-merge middle credit score", constraints: ">= 300, <= 850" }
      - { name: on_time_housing_payment_months, type: integer, source: input, description: "Consecutive months of on-time housing payments evidenced in the file", constraints: ">= 0, <= 120" }
      - { name: documentation_status, type: enum, source: system, default: "INCOMPLETE", description: "INCOMPLETE | SUBMITTED | VERIFIED — INCOMPLETE at create, SUBMITTED by POST /households/{id}/submit, VERIFIED by POST /households/{id}/screen when all four verified_* / income-document inputs are supplied", constraints: "INCOMPLETE | SUBMITTED | VERIFIED" }
      - { name: ami_pct, type: number, source: computed, description: "= round(income_basis_annual_cents / AffiliateProgram.ami_median_income_cents, 4) where income_basis follows calculations.household_selection_scoring variant selection" }
      - { name: need_score, type: number, source: computed, default: null, description: "0..100 from calculations.household_selection_scoring (cost burden + overcrowding + substandard points)" }
      - { name: ability_to_pay_score, type: number, source: computed, default: null, description: "0..100 from calculations.household_selection_scoring (DTI + credit + payment-history points)" }
      - { name: willingness_score, type: number, source: computed, default: null, description: "0..100 mean of latest non-retracted SelectionReview.score rows with dimension == WILLINGNESS, per calculations.committee_quorum_and_willingness" }
      - { name: composite_selection_score, type: number, source: computed, default: null, description: "= round(0.40*need_score + 0.35*ability_to_pay_score + 0.25*willingness_score, 2)" }
      - { name: score_basis, type: enum, source: computed, default: null, description: "PRELIMINARY | FINAL — which variant of calculations.household_selection_scoring produced the currently stored scores", constraints: "null | PRELIMINARY | FINAL" }
      - { name: sweat_equity_required_hours, type: number, source: computed, default: null, description: "= min(500, program.sweat_equity_base_hours_required + 50 * max(0, adult_occupant_count - 1)); frozen at the SCREENING -> COMMITTEE_REVIEW transition" }
      - { name: sweat_equity_credited_hours, type: number, source: computed, default: 0, description: "= round(sum of SweatEquityEntry.hours_credited over rows of this household whose status IN {CREDITED, REVERSED}, 2); a reversal mirror row keeps status CREDITED and carries negative hours, so an original-plus-mirror pair nets to exactly zero" }
      - { name: family_member_credited_hours, type: number, source: computed, default: 0, description: "Same sum restricted to rows whose HouseholdMember.relationship NOT IN {APPLICANT, CO_APPLICANT}" }
      - { name: sweat_equity_satisfied, type: boolean, source: computed, default: false, description: "= sweat_equity_credited_hours >= sweat_equity_required_hours (equality satisfies)" }
      - { name: selection_status, type: enum, source: system, default: "DRAFT", description: "State dimension 1 — see state_machines.ApplicantHousehold.selection_status", constraints: "DRAFT | SUBMITTED | SCREENING | COMMITTEE_REVIEW | SELECTED | WAITLISTED | DENIED | PARTNERSHIP_ACTIVE | CLOSED" }
      - { name: partnership_readiness, type: enum, source: system, default: "NOT_READY", description: "State dimension 2, evolves independently of selection_status — see state_machines.ApplicantHousehold.partnership_readiness", constraints: "NOT_READY | EDUCATION_IN_PROGRESS | EDUCATION_COMPLETE | CLOSING_READY | WITHDRAWN" }
      - { name: closing_date, type: datetime, source: system, default: null, description: "Logical-clock timestamp at which selection_status became CLOSED; input set boundary for calculations.households_served_report" }
      - { name: denial_reason_code, type: enum, source: system, default: null, description: "null | INCOME_BAND | SCORE_BELOW_WAITLIST | WILLINGNESS_VETO | DOCUMENTATION — written by the selection decision that produced DENIED", constraints: "null | INCOME_BAND | SCORE_BELOW_WAITLIST | WILLINGNESS_VETO | DOCUMENTATION" }

  - name: HouseholdMember
    parent: ApplicantHousehold
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> ApplicantHousehold.id" }
      - { name: full_name, type: string, source: input, description: "Member legal name", constraints: "1..120 chars" }
      - { name: relationship, type: enum, source: input, description: "APPLICANT | CO_APPLICANT | DEPENDENT | EXTENDED_FAMILY | FRIEND_OF_FAMILY — only APPLICANT and CO_APPLICANT hours are exempt from the family-credit cap", constraints: "APPLICANT | CO_APPLICANT | DEPENDENT | EXTENDED_FAMILY | FRIEND_OF_FAMILY" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth (UTC midnight); age at SweatEquityEntry.work_date decides credit eligibility" }
      - { name: is_adult_occupant, type: boolean, source: input, default: false, description: "True when the member is >= 18 and will occupy the home; drives ApplicantHousehold.adult_occupant_count and the hour requirement" }
      - { name: credited_hours_to_date, type: number, source: computed, default: 0, description: "= round(sum of SweatEquityEntry.hours_credited for this member over rows with status IN {CREDITED, REVERSED}, 2)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REMOVED — ACTIVE at creation; REMOVED when the household reaches selection_status == DENIED or partnership_readiness == WITHDRAWN", constraints: "ACTIVE | REMOVED" }

  - name: SelectionReview
    parent: ApplicantHousehold
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> ApplicantHousehold.id; the household under committee review" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the SelectionCommitteeMember who filed this review; the segregation-of-duties key checked at mortgage underwriting" }
      - { name: dimension, type: enum, source: input, description: "NEED | ABILITY | WILLINGNESS — the scoring dimension this review speaks to", constraints: "NEED | ABILITY | WILLINGNESS" }
      - { name: score, type: number, source: input, description: "Reviewer score on the dimension", constraints: ">= 0, <= 100, 2dp" }
      - { name: recommendation, type: enum, source: input, description: "ADVANCE | ABSTAIN | VETO_WILLINGNESS — VETO_WILLINGNESS forces DENIED at the selection decision and requires documented_reason", constraints: "ADVANCE | ABSTAIN | VETO_WILLINGNESS" }
      - { name: documented_reason, type: string, source: input, default: null, description: "Written rationale; required when recommendation == VETO_WILLINGNESS", constraints: "null or 10..500 chars" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | RETRACTED — RETRACTED rows are excluded from every quorum count and score aggregate", constraints: "SUBMITTED | RETRACTED" }

  - name: SweatEquityEntry
    parent: ApplicantHousehold
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> ApplicantHousehold.id; the household whose hour ledger this entry moves" }
      - { name: member_id, type: string, source: input, description: "FK -> HouseholdMember.id; who performed the hours" }
      - { name: shift_assignment_id, type: string, source: input, default: null, description: "FK -> ShiftAssignment.id; set only on entries synthesized by a construction shift completion, null on manually claimed entries" }
      - { name: reversal_of_entry_id, type: string, source: input, default: null, description: "FK -> SweatEquityEntry.id; self-referential link set on the compensating mirror entry created by POST /sweat-equity-entries/{id}/reverse" }
      - { name: category, type: enum, source: input, description: "CONSTRUCTION | RESTORE_STORE | HOMEOWNER_EDUCATION | OTHER_AFFILIATE | ADVOCACY — decides the credit weight and per-category cap in calculations.sweat_equity_credit_allocation", constraints: "CONSTRUCTION | RESTORE_STORE | HOMEOWNER_EDUCATION | OTHER_AFFILIATE | ADVOCACY" }
      - { name: work_date, type: datetime, source: input, description: "UTC instant the hours were worked; must be <= logical clock now and used for the member's age test" }
      - { name: hours_claimed, type: number, source: input, description: "Raw hours claimed on this entry", constraints: ">= 0.25, <= 12, 2dp" }
      - { name: credit_weight, type: number, source: computed, default: null, description: "Category/age weight applied by calculations.sweat_equity_credit_allocation (1.00, 0.75, 0.50)" }
      - { name: hours_credited, type: number, source: computed, default: null, description: "Hours actually posted to the household ledger, rounded to 2dp half-up at this entry before any summation; negative on a reversal mirror entry" }
      - { name: capped_hours, type: number, source: computed, default: 0, description: "Portion of round(hours_claimed * credit_weight, 2) refused because a per-category or family-member allowance was exhausted" }
      - { name: claimed_by_user_id, type: string, source: system, description: "X-User-ID that created the entry; must differ from verified_by_user_id (segregation of duties)" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded the verification decision" }
      - { name: status, type: enum, source: system, default: "CLAIMED", description: "See state_machines.SweatEquityEntry.status", constraints: "CLAIMED | VERIFIED | CREDITED | REJECTED | REVERSED" }

  - name: BuildSite
    parent: AffiliateProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AffiliateProgram.id" }
      - { name: assigned_household_id, type: string, source: system, default: null, description: "FK -> ApplicantHousehold.id; written as a side effect of POST /mortgage-applications when the site is unassigned, cleared when that application is denied" }
      - { name: parcel_number, type: string, source: input, description: "County parcel identifier", constraints: "1..40 chars, unique per program_id" }
      - { name: street_address, type: string, source: input, description: "Site street address", constraints: "1..200 chars" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Land acquisition price paid by the affiliate; always part of the cash cost basis", constraints: ">= 0" }
      - { name: appraised_value_cents, type: integer, source: input, description: "As-completed appraised value used by calculations.affordable_payment_structure", constraints: ">= 1000000" }
      - { name: title_cleared, type: boolean, source: system, default: false, description: "Title search and insurance complete; advanced by POST /build-sites/{id}/readiness-advance with step TITLE" }
      - { name: environmental_cleared, type: boolean, source: system, default: false, description: "Phase I environmental review complete; step ENVIRONMENTAL" }
      - { name: utilities_cleared, type: boolean, source: system, default: false, description: "Water/sewer/electric taps committed; step UTILITIES" }
      - { name: cash_cost_cents, type: integer, source: computed, default: 0, description: "CASH_BASIS variant of calculations.development_cost_basis = acquisition_cost_cents + sum(CostEntry.amount_cents where is_in_kind == false AND status == RECORDED)" }
      - { name: total_development_cost_cents, type: integer, source: computed, default: 0, description: "FULL_FMV_BASIS variant of calculations.development_cost_basis = cash_cost_cents + sum(CostEntry.fair_market_value_cents where is_in_kind == true AND status == RECORDED)" }
      - { name: readiness_status, type: enum, source: system, default: "RAW_LAND", description: "See state_machines.BuildSite.readiness_status", constraints: "RAW_LAND | TITLE_CLEAR | ENV_CLEARED | READY_TO_BUILD | UNDER_CONSTRUCTION | SAFETY_HOLD | COMPLETED" }
      - { name: safety_posture, type: enum, source: computed, default: "CLEAR", description: "CLEAR | HOLD — HOLD while readiness_status == SAFETY_HOLD; gates every ConstructionShift operation on this site", constraints: "CLEAR | HOLD" }
      - { name: pre_hold_readiness_status, type: enum, source: system, default: null, description: "null | READY_TO_BUILD | UNDER_CONSTRUCTION — readiness_status captured when a safety hold was placed, restored on release", constraints: "null | READY_TO_BUILD | UNDER_CONSTRUCTION" }

  - name: ConstructionShift
    parent: BuildSite
    common_fields: true
    fields:
      - { name: build_site_id, type: string, source: input, description: "FK -> BuildSite.id; the site this shift occupies exclusively" }
      - { name: crew_lead_user_id, type: string, source: input, description: "X-User-ID of the ConstructionManager accountable for the shift" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (UTC, inclusive); site-level interval geometry is closed with a 60-minute cleanup buffer on both sides" }
      - { name: end_at, type: datetime, source: input, description: "Shift end (UTC, exclusive for volunteer double-booking, buffered for site occupation)", constraints: "> start_at, duration <= 10 hours" }
      - { name: duration_hours, type: number, source: computed, description: "= round((end_at - start_at) / 3600 seconds, 2)" }
      - { name: volunteer_slots, type: integer, source: input, description: "General volunteer capacity of the shift", constraints: ">= 0, <= 40" }
      - { name: required_trade_slots, type: integer, source: input, default: 0, description: "Skilled-trade positions that MUST be confirmed before the shift can be locked", constraints: ">= 0, <= 10" }
      - { name: required_trade, type: enum, source: input, default: null, description: "null | ELECTRICAL | PLUMBING | HVAC | ROOFING — certification a SKILLED_TRADE assignment must carry", constraints: "null | ELECTRICAL | PLUMBING | HVAC | ROOFING" }
      - { name: confirmed_general_count, type: integer, source: computed, default: 0, description: "Count of ShiftAssignment rows on this shift with role == GENERAL_VOLUNTEER AND status IN {CONFIRMED, CHECKED_IN, COMPLETED}" }
      - { name: confirmed_trade_count, type: integer, source: computed, default: 0, description: "Count of ShiftAssignment rows on this shift with role == SKILLED_TRADE AND status IN {CONFIRMED, CHECKED_IN, COMPLETED}" }
      - { name: fill_ratio, type: number, source: computed, default: 0, description: "= 0 when volunteer_slots == 0, else round(confirmed_general_count / volunteer_slots, 4)" }
      - { name: safety_briefing_completed, type: boolean, source: system, default: false, description: "Set true by POST /construction-shifts/{id}/lock; a prerequisite of every check-in" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "See state_machines.ConstructionShift.status", constraints: "SCHEDULED | OPEN | LOCKED | COMPLETED | CANCELLED" }

  - name: VolunteerProfile
    parent: AffiliateProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AffiliateProgram.id" }
      - { name: full_name, type: string, source: input, description: "Volunteer legal name", constraints: "1..120 chars" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth; volunteers under 16 at shift start are ineligible, 16-17 are minors with a reduced weekly cap" }
      - { name: is_minor, type: boolean, source: computed, description: "= age at logical-clock now < 18" }
      - { name: waiver_expires_on, type: datetime, source: input, description: "Liability waiver expiry (UTC); a shift whose start_at >= this instant may not be confirmed" }
      - { name: trade_certifications, type: array, source: input, default: [], description: "Array of { trade: ELECTRICAL|PLUMBING|HVAC|ROOFING, expires_on: datetime } objects" }
      - { name: assigned_hours_committed, type: number, source: computed, default: 0, description: "= round(sum of ConstructionShift.duration_hours over ALL of this volunteer's ShiftAssignment rows with status IN {RESERVED, CONFIRMED, CHECKED_IN, COMPLETED}, 2); conserved quantity of calculations.volunteer_hour_capacity_invariant" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of this volunteer's ShiftAssignment rows with status == NO_SHOW; 3 strikes auto-suspends the profile" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED when no_show_strikes >= 3; a suspended volunteer cannot hold new reservations", constraints: "ACTIVE | SUSPENDED" }

  - name: ShiftAssignment
    parent: ConstructionShift
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> ConstructionShift.id" }
      - { name: volunteer_id, type: string, source: input, default: null, description: "FK -> VolunteerProfile.id; null when the seat is filled by a partner-family member instead of a community volunteer" }
      - { name: household_member_id, type: string, source: input, default: null, description: "FK -> HouseholdMember.id; set when role == HOMEOWNER_PARTNER so shift completion can synthesize a SweatEquityEntry" }
      - { name: role, type: enum, source: input, description: "GENERAL_VOLUNTEER | SKILLED_TRADE | HOMEOWNER_PARTNER — SKILLED_TRADE requires an unexpired certification matching shift.required_trade", constraints: "GENERAL_VOLUNTEER | SKILLED_TRADE | HOMEOWNER_PARTNER" }
      - { name: checked_in_at, type: datetime, source: system, default: null, description: "Logical-clock instant of check-in" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "See state_machines.ShiftAssignment.status", constraints: "RESERVED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }

  - name: EducationEnrollment
    parent: ApplicantHousehold
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> ApplicantHousehold.id" }
      - { name: curriculum_code, type: enum, source: input, description: "HOMEBUYER_CORE | BUDGET_COACHING | HOME_MAINTENANCE — only HOMEBUYER_CORE gates closing", constraints: "HOMEBUYER_CORE | BUDGET_COACHING | HOME_MAINTENANCE" }
      - { name: required_module_count, type: integer, source: input, description: "Modules that must be PASSED for completion", constraints: ">= 1, <= 12" }
      - { name: passed_module_count, type: integer, source: computed, default: 0, description: "Distinct module_index values recorded with outcome PASSED" }
      - { name: missed_session_count, type: integer, source: computed, default: 0, description: "Module completions recorded with outcome MISSED; 3 forces status FAILED" }
      - { name: completed_on, type: datetime, source: system, default: null, description: "Logical-clock instant at which passed_module_count reached required_module_count" }
      - { name: expires_on, type: datetime, source: computed, default: null, description: "= completed_on + 730 days; curriculum currency window for closing eligibility" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "See state_machines.EducationEnrollment.status", constraints: "ENROLLED | IN_PROGRESS | COMPLETED | EXPIRED | FAILED" }

  - name: MortgageApplication
    parent: ApplicantHousehold
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> ApplicantHousehold.id" }
      - { name: build_site_id, type: string, source: input, description: "FK -> BuildSite.id; the home being financed" }
      - { name: originating_officer_user_id, type: string, source: system, description: "X-User-ID of the MortgageOfficer who created the application; segregation-of-duties subject" }
      - { name: appraised_value_cents, type: integer, source: computed, description: "Snapshot of BuildSite.appraised_value_cents pinned at DRAFT -> UNDERWRITING; later site edits do not move an underwritten structure" }
      - { name: income_basis_annual_cents, type: integer, source: computed, description: "Snapshot of ApplicantHousehold.verified_annual_income_cents pinned at DRAFT -> UNDERWRITING" }
      - { name: escrow_monthly_cents, type: integer, source: computed, default: null, description: "Monthly tax + hazard insurance escrow from calculations.affordable_payment_structure step 2" }
      - { name: affordable_pi_payment_cents, type: integer, source: computed, default: null, description: "Principal-only monthly payment the household can afford (0% note) from step 4" }
      - { name: term_months, type: integer, source: computed, default: null, description: "240 | 300 | 360, selected in step 6 from the provisional 360-month principal", constraints: "null | 240 | 300 | 360" }
      - { name: first_mortgage_principal_cents, type: integer, source: computed, default: null, description: "= min(affordable_pi_payment_cents * term_months, appraised_value_cents) from step 7" }
      - { name: silent_second_amount_cents, type: integer, source: computed, default: null, description: "Subsidy silent second = appraised_value_cents - first_mortgage_principal_cents; the amount committed against AffiliateProgram.subsidy_pool_cents" }
      - { name: closing_cost_credit_cents, type: integer, source: input, default: 0, description: "Affiliate-funded closing cost credit requested by the officer", constraints: ">= 0, <= 500000" }
      - { name: superseded_application_id, type: string, source: system, default: null, description: "FK -> MortgageApplication.id; set on the replacement application when a prior DRAFT/DENIED application for the same household is superseded" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "State dimension 1 — see state_machines.MortgageApplication.status", constraints: "DRAFT | UNDERWRITING | APPROVED | CLEARED_TO_CLOSE | CLOSED | DENIED | SUPERSEDED" }
      - { name: lien_status, type: enum, source: system, default: "NONE", description: "State dimension 2, independent of status — see state_machines.MortgageApplication.lien_status", constraints: "NONE | ACTIVE | FORBEARANCE | TRANSFER_PENDING | SATISFIED | RECAPTURED" }
      - { name: lien_recorded_on, type: datetime, source: system, default: null, description: "Logical-clock instant the silent second was recorded (set at CLOSED)" }
      - { name: resale_restriction_months, type: integer, source: input, default: 240, description: "Resale restriction / affordability period in months from lien_recorded_on", constraints: "120 | 240 | 360" }
      - { name: forgiven_amount_cents, type: integer, source: computed, default: 0, description: "Straight-line forgiveness from calculations.lien_forgiveness_and_recapture; 0 before month 60" }
      - { name: lien_outstanding_cents, type: integer, source: computed, default: 0, description: "= silent_second_amount_cents - forgiven_amount_cents, floored at 0" }
      - { name: right_of_first_refusal_expires_on, type: datetime, source: system, default: null, description: "= transfer request instant + 30 days; the affiliate's ROFR window on a TRANSFER_PENDING lien" }
      - { name: forbearance_counseling_sessions, type: integer, source: computed, default: 0, description: "Count of FORBEARANCE_GRANT lien actions recorded; the 3rd grant is refused" }
      - { name: denial_reason_code, type: enum, source: system, default: null, description: "null | AFFORDABILITY | SUBSIDY_CAPACITY | READINESS | DOCUMENTATION", constraints: "null | AFFORDABILITY | SUBSIDY_CAPACITY | READINESS | DOCUMENTATION" }

  - name: CostEntry
    parent: BuildSite
    common_fields: false   # append-only construction cost ledger: id and created_at only, no version (never OCC-guarded)
    fields:
      - { name: id, type: string, source: system, description: "Server-assigned identifier; never used as a tie-break or ordering key in any business decision" }
      - { name: created_at, type: timestamp, source: system, description: "Logical-clock timestamp of the ledger append; the ordering key for cost-basis reporting" }
      - { name: build_site_id, type: string, source: input, description: "FK -> BuildSite.id" }
      - { name: category, type: enum, source: input, description: "SITE_WORK | MATERIALS | LABOR | PERMITS | OTHER", constraints: "SITE_WORK | MATERIALS | LABOR | PERMITS | OTHER" }
      - { name: amount_cents, type: integer, source: input, default: 0, description: "Cash outlay; MUST be 0 when is_in_kind == true", constraints: ">= 0" }
      - { name: is_in_kind, type: boolean, source: input, default: false, description: "True for donated materials or donated professional labor" }
      - { name: fair_market_value_cents, type: integer, source: input, default: 0, description: "Documented FMV of the donation; required > 0 when is_in_kind == true, MUST be 0 when is_in_kind == false", constraints: ">= 0" }
      - { name: donor_name, type: string, source: input, default: null, description: "Donor of record for in-kind entries; required when is_in_kind == true", constraints: "null or 1..120 chars" }
      - { name: grant_award_code, type: string, source: input, default: null, description: "Restricted funding source code copied from GrantAward.award_code when the cost is charged to a grant", constraints: "null or 1..40 chars" }
      - { name: status, type: enum, source: system, default: "RECORDED", description: "RECORDED | VOIDED — VOIDED rows leave both cost bases and the program's donated_material_fmv_cents; set only by POST /cost-entries/{id}/void", constraints: "RECORDED | VOIDED" }

  - name: GrantAward
    parent: AffiliateProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AffiliateProgram.id" }
      - { name: award_code, type: string, source: input, description: "Funder-assigned award code", constraints: "1..40 chars, unique per program_id" }
      - { name: funder_name, type: string, source: input, description: "Donor or grantor legal name", constraints: "1..120 chars" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total award", constraints: ">= 0" }
      - { name: households_served_target, type: integer, source: input, description: "Contractual household count for the reporting period", constraints: ">= 1, <= 500" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (UTC midnight, INCLUSIVE)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (UTC, INCLUSIVE through 23:59:59.999)", constraints: "> period_start" }
      - { name: restricted_to_in_kind_reporting, type: boolean, source: input, default: false, description: "When true the impact report values homes on the FULL_FMV_BASIS variant, otherwise on CASH_BASIS" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | REPORTED — flipped to REPORTED by the first POST /grant-awards/{id}/impact-reports accepted at or after period_end", constraints: "OPEN | REPORTED" }

# =============================================================================
# §1.2 State Machine Table
# ApplicantHousehold and MortgageApplication each carry TWO independent state
# dimensions; `state_field:` names the column each machine governs.
# =============================================================================
state_machines:

  - entity: ApplicantHousehold
    state_field: selection_status
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /homeownership/households/{id}/submit"
        actor: Applicant
        preconditions:
          - "selection_status == DRAFT"
          - "at least one HouseholdMember row with household_id == this.id AND relationship == APPLICANT AND status == ACTIVE"
          - "household_size >= count of HouseholdMember rows with status == ACTIVE"
        side_effects:
          - "documentation_status := SUBMITTED"
          - "adult_occupant_count := count(HouseholdMember where household_id == this.id AND is_adult_occupant == true AND status == ACTIVE), minimum 1"
          - "updated_at refreshed, version += 1"
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /homeownership/households/{id}/screen"
        actor: FamilyServicesCoordinator
        preconditions:
          - "selection_status == SUBMITTED"
          - "AffiliateProgram.program_posture != FROZEN"
        side_effects:
          - "verified_annual_income_cents / verified_housing_cost_cents written from the payload when supplied"
          - "documentation_status := VERIFIED when both verified_* values are supplied AND income_documents_received == true, otherwise unchanged (SUBMITTED)"
          - "need_score, ability_to_pay_score, ami_pct recomputed by calculations.household_selection_scoring variant PRELIMINARY; score_basis := PRELIMINARY; willingness_score stays null so composite_selection_score stays null"
          - "version += 1"
      - from: SCREENING
        to: COMMITTEE_REVIEW
        trigger: "POST /homeownership/households/{id}/committee-referral"
        actor: FamilyServicesCoordinator
        preconditions:
          - "selection_status == SCREENING"
          - "documentation_status == VERIFIED"
          - "ami_pct computed on the FINAL basis satisfies 0.3000 <= ami_pct <= 0.8000 (both bounds inclusive)"
        side_effects:
          - "sweat_equity_required_hours := min(500, AffiliateProgram.sweat_equity_base_hours_required + 50 * max(0, adult_occupant_count - 1)) and is frozen for the remainder of the household's life"
          - "version += 1"
      - from: COMMITTEE_REVIEW
        to: SCREENING
        trigger: "POST /homeownership/households/{id}/return-to-screening"
        actor: FamilyServicesCoordinator
        preconditions:
          - "selection_status == COMMITTEE_REVIEW"
        side_effects:
          - "score_basis := PRELIMINARY; composite_selection_score := null; willingness_score := null"
          - "every SelectionReview row of this household with status == SUBMITTED is left untouched (quorum survives the loop)"
          - "version += 1"
        note: "Revision cycle — COMMITTEE_REVIEW -> SCREENING -> COMMITTEE_REVIEW may repeat without bound."
      - from: COMMITTEE_REVIEW
        to: SELECTED
        trigger: "POST /homeownership/households/{id}/selection-decision"
        actor: ProgramAdmin
        preconditions:
          - "selection_status == COMMITTEE_REVIEW"
          - "calculations.committee_quorum_and_willingness reports quorum_met == true for all three dimensions"
          - "no SelectionReview row of this household with status == SUBMITTED AND recommendation == VETO_WILLINGNESS"
          - "composite_selection_score (FINAL basis) >= 70.00"
        side_effects:
          - "need_score, ability_to_pay_score, ami_pct recomputed by calculations.household_selection_scoring variant FINAL; score_basis := FINAL"
          - "willingness_score and composite_selection_score written"
          - "version += 1"
      - from: COMMITTEE_REVIEW
        to: WAITLISTED
        trigger: "POST /homeownership/households/{id}/selection-decision"
        actor: ProgramAdmin
        preconditions:
          - "selection_status == COMMITTEE_REVIEW"
          - "quorum_met == true for all three dimensions"
          - "no SUBMITTED VETO_WILLINGNESS review"
          - "55.00 <= composite_selection_score (FINAL basis) < 70.00"
        side_effects:
          - "scores written exactly as in the SELECTED branch; score_basis := FINAL"
          - "version += 1"
      - from: COMMITTEE_REVIEW
        to: DENIED
        trigger: "POST /homeownership/households/{id}/selection-decision"
        actor: ProgramAdmin
        preconditions:
          - "selection_status == COMMITTEE_REVIEW"
          - "quorum_met == true for all three dimensions"
          - "composite_selection_score (FINAL basis) < 55.00 OR at least one SUBMITTED review carries recommendation == VETO_WILLINGNESS"
        side_effects:
          - "denial_reason_code := WILLINGNESS_VETO when a veto exists, else SCORE_BELOW_WAITLIST"
          - "partnership_readiness := WITHDRAWN (cross-dimension cascade)"
          - "every HouseholdMember of this household with status == ACTIVE := REMOVED"
          - "version += 1"
        note: "Branching fork — the same trigger yields SELECTED, WAITLISTED or DENIED with divergent side-effect sets."
      - from: WAITLISTED
        to: SELECTED
        trigger: "POST /homeownership/programs/{id}/waitlist-promotions (selector policy)"
        actor: ProgramAdmin
        preconditions:
          - "selection_status == WAITLISTED"
          - "partnership_readiness != WITHDRAWN"
          - "composite_selection_score >= 55.00"
          - "this household is among the top `promote_count` of the ranked candidate pool defined in calculations.waitlist_promotion_selector"
        side_effects:
          - "selection_status := SELECTED; score_basis unchanged (FINAL)"
          - "version += 1"
        note: "Cycle COMMITTEE_REVIEW -> WAITLISTED -> SELECTED re-enters the selected population without re-review."
      - from: SELECTED
        to: PARTNERSHIP_ACTIVE
        trigger: "system — first SweatEquityEntry of this household reaches status CREDITED"
        actor: system
        preconditions:
          - "selection_status == SELECTED"
          - "sweat_equity_credited_hours > 0 after the crediting entry is posted"
        side_effects:
          - "version += 1"
      - from: PARTNERSHIP_ACTIVE
        to: CLOSED
        trigger: "system — MortgageApplication of this household transitions CLEARED_TO_CLOSE -> CLOSED"
        actor: system
        preconditions:
          - "selection_status == PARTNERSHIP_ACTIVE"
          - "partnership_readiness == CLOSING_READY"
        side_effects:
          - "closing_date := logical clock now"
          - "AffiliateProgram.households_served_count += 1"
          - "version += 1"

  - entity: ApplicantHousehold
    state_field: partnership_readiness
    initial_state: NOT_READY
    terminal_states: [WITHDRAWN]
    transitions:
      - from: NOT_READY
        to: EDUCATION_IN_PROGRESS
        trigger: "POST /homeownership/education-enrollments with curriculum_code == HOMEBUYER_CORE"
        actor: FamilyServicesCoordinator
        preconditions:
          - "selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}"
          - "partnership_readiness IN {NOT_READY}"
          - "no EducationEnrollment row of this household with curriculum_code == HOMEBUYER_CORE AND status IN {ENROLLED, IN_PROGRESS, COMPLETED}"
        side_effects:
          - "version += 1"
      - from: EDUCATION_IN_PROGRESS
        to: EDUCATION_COMPLETE
        trigger: "system — HOMEBUYER_CORE EducationEnrollment reaches status COMPLETED"
        actor: system
        preconditions:
          - "partnership_readiness == EDUCATION_IN_PROGRESS"
        side_effects:
          - "version += 1"
          - "if sweat_equity_satisfied == true at this instant, immediately continue to CLOSING_READY (same request)"
      - from: EDUCATION_IN_PROGRESS
        to: NOT_READY
        trigger: "system — HOMEBUYER_CORE EducationEnrollment reaches status FAILED (missed_session_count == 3)"
        actor: system
        preconditions:
          - "partnership_readiness == EDUCATION_IN_PROGRESS"
        side_effects:
          - "version += 1"
      - from: EDUCATION_COMPLETE
        to: CLOSING_READY
        trigger: "system — sweat_equity_credited_hours crosses sweat_equity_required_hours (>= satisfies) after a SweatEquityEntry reaches CREDITED"
        actor: system
        preconditions:
          - "partnership_readiness == EDUCATION_COMPLETE"
          - "sweat_equity_satisfied == true"
          - "the household's HOMEBUYER_CORE EducationEnrollment status == COMPLETED AND expires_on > logical clock now"
        side_effects:
          - "cascade hop 4: every MortgageApplication of this household with status == APPROVED transitions APPROVED -> CLEARED_TO_CLOSE"
          - "version += 1"
      - from: CLOSING_READY
        to: EDUCATION_COMPLETE
        trigger: "system — sweat_equity_satisfied flips back to false (a CREDITED entry was REVERSED)"
        actor: system
        preconditions:
          - "partnership_readiness == CLOSING_READY"
          - "sweat_equity_credited_hours < sweat_equity_required_hours after the reversal mirror entry is posted"
        side_effects:
          - "cascade: every MortgageApplication of this household with status == CLEARED_TO_CLOSE regresses CLEARED_TO_CLOSE -> APPROVED"
          - "version += 1"
        note: "Regression cycle EDUCATION_COMPLETE <-> CLOSING_READY; independent of selection_status, which never moves during it."
      - from: CLOSING_READY
        to: NOT_READY
        trigger: "system — POST /_clock/set_current_utc advances now to or past the HOMEBUYER_CORE enrollment's expires_on"
        actor: system
        preconditions:
          - "partnership_readiness == CLOSING_READY"
          - "HOMEBUYER_CORE EducationEnrollment transitions COMPLETED -> EXPIRED in this same request"
        side_effects:
          - "cascade: every MortgageApplication of this household with status == CLEARED_TO_CLOSE regresses to APPROVED"
          - "version += 1"
      - from: EDUCATION_COMPLETE
        to: NOT_READY
        trigger: "system — POST /_clock/set_current_utc advances now to or past the HOMEBUYER_CORE enrollment's expires_on"
        actor: system
        preconditions:
          - "partnership_readiness == EDUCATION_COMPLETE"
          - "HOMEBUYER_CORE EducationEnrollment transitions COMPLETED -> EXPIRED in this same request"
        side_effects:
          - "version += 1"
      - from: EDUCATION_IN_PROGRESS
        to: WITHDRAWN
        trigger: "system — selection_status transitions COMMITTEE_REVIEW -> DENIED"
        actor: system
        preconditions:
          - "partnership_readiness != WITHDRAWN"
        side_effects:
          - "every EducationEnrollment of this household with status IN {ENROLLED, IN_PROGRESS} := FAILED"
          - "version += 1"
        note: "The same cascade applies from NOT_READY, EDUCATION_COMPLETE and CLOSING_READY; WITHDRAWN is reachable from every non-terminal readiness state."

  - entity: SweatEquityEntry
    state_field: status
    initial_state: CLAIMED
    terminal_states: [REVERSED]
    transitions:
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /homeownership/sweat-equity-entries/{id}/verification with decision == VERIFIED"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == CLAIMED"
          - "X-User-ID != claimed_by_user_id (segregation of duties)"
          - "HouseholdMember.status == ACTIVE"
          - "work_date <= logical clock now"
        side_effects:
          - "verified_by_user_id := X-User-ID; version += 1"
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /homeownership/sweat-equity-entries/{id}/verification with decision == REJECTED"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == CLAIMED"
          - "X-User-ID != claimed_by_user_id"
          - "rejection_reason present"
        side_effects:
          - "verified_by_user_id := X-User-ID; hours_credited := 0; version += 1"
      - from: REJECTED
        to: CLAIMED
        trigger: "POST /homeownership/sweat-equity-entries/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "status == REJECTED"
          - "the acting Applicant's X-User-ID == household_id"
          - "ApplicantHousehold.selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}"
        side_effects:
          - "hours_claimed and work_date overwritten from the payload; verified_by_user_id := null; version += 1"
        note: "Revision cycle CLAIMED -> REJECTED -> CLAIMED, unbounded."
      - from: VERIFIED
        to: CREDITED
        trigger: "POST /homeownership/sweat-equity-entries/{id}/credit"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == VERIFIED"
          - "ApplicantHousehold.selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}"
          - "the family-member allowance of calculations.sweat_equity_credit_allocation is not already exhausted (allowance_remaining > 0) when the member's relationship NOT IN {APPLICANT, CO_APPLICANT}"
        side_effects:
          - "credit_weight, hours_credited, capped_hours written by calculations.sweat_equity_credit_allocation"
          - "cascade hop 1: HouseholdMember.credited_hours_to_date += hours_credited"
          - "cascade hop 2: ApplicantHousehold.sweat_equity_credited_hours += hours_credited, family_member_credited_hours updated, sweat_equity_satisfied recomputed"
          - "cascade hop 3: if selection_status == SELECTED, it advances to PARTNERSHIP_ACTIVE; if partnership_readiness == EDUCATION_COMPLETE and sweat_equity_satisfied became true, readiness advances to CLOSING_READY"
          - "cascade hop 4: readiness CLOSING_READY drives every APPROVED MortgageApplication of the household to CLEARED_TO_CLOSE"
          - "version += 1"
      - from: CREDITED
        to: REVERSED
        trigger: "POST /homeownership/sweat-equity-entries/{id}/reverse"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == CREDITED"
          - "hours_credited != 0 (a reversal mirror entry, whose hours_credited is negative, may not itself be reversed: reversal_of_entry_id must be null)"
          - "ApplicantHousehold.selection_status != CLOSED"
        side_effects:
          - "a new SweatEquityEntry is created with status CREDITED, reversal_of_entry_id == this.id, hours_claimed 0, credit_weight equal to this.credit_weight and hours_credited == -1 * this.hours_credited"
          - "cascade: HouseholdMember.credited_hours_to_date and ApplicantHousehold.sweat_equity_credited_hours both fall by exactly this.hours_credited, restoring the pre-credit values (calculations.sweat_equity_ledger_invariant)"
          - "cascade: sweat_equity_satisfied recomputed; readiness may regress CLOSING_READY -> EDUCATION_COMPLETE, which regresses CLEARED_TO_CLOSE mortgages to APPROVED"
          - "version += 1"

  - entity: BuildSite
    state_field: readiness_status
    initial_state: RAW_LAND
    terminal_states: [COMPLETED]
    transitions:
      - from: RAW_LAND
        to: TITLE_CLEAR
        trigger: "POST /homeownership/build-sites/{id}/readiness-advance with step == TITLE"
        actor: ProgramAdmin
        preconditions:
          - "readiness_status == RAW_LAND"
          - "title_cleared == false"
        side_effects:
          - "title_cleared := true; version += 1"
      - from: TITLE_CLEAR
        to: ENV_CLEARED
        trigger: "POST /homeownership/build-sites/{id}/readiness-advance with step == ENVIRONMENTAL"
        actor: ProgramAdmin
        preconditions:
          - "readiness_status == TITLE_CLEAR"
        side_effects:
          - "environmental_cleared := true; version += 1"
      - from: ENV_CLEARED
        to: READY_TO_BUILD
        trigger: "POST /homeownership/build-sites/{id}/readiness-advance with step == UTILITIES"
        actor: ProgramAdmin
        preconditions:
          - "readiness_status == ENV_CLEARED"
          - "title_cleared == true AND environmental_cleared == true"
        side_effects:
          - "utilities_cleared := true; version += 1"
      - from: READY_TO_BUILD
        to: UNDER_CONSTRUCTION
        trigger: "system — a ConstructionShift of this site transitions OPEN -> LOCKED"
        actor: system
        preconditions:
          - "readiness_status == READY_TO_BUILD"
        side_effects:
          - "version += 1"
      - from: READY_TO_BUILD
        to: SAFETY_HOLD
        trigger: "POST /homeownership/build-sites/{id}/safety-posture with posture == HOLD"
        actor: ConstructionManager
        preconditions:
          - "readiness_status IN {READY_TO_BUILD, UNDER_CONSTRUCTION}"
          - "safety_posture == CLEAR"
        side_effects:
          - "pre_hold_readiness_status := readiness_status before this transition; safety_posture := HOLD"
          - "cascade hop 1: every ConstructionShift of this site with status IN {SCHEDULED, OPEN, LOCKED} transitions to CANCELLED"
          - "cascade hop 2: each of those shift cancellations transitions its own ShiftAssignment rows with status IN {RESERVED, CONFIRMED, CHECKED_IN} to CANCELLED"
          - "cascade hop 3: each cancelled assignment lowers its VolunteerProfile.assigned_hours_committed by that shift's duration_hours"
          - "version += 1"
      - from: UNDER_CONSTRUCTION
        to: SAFETY_HOLD
        trigger: "POST /homeownership/build-sites/{id}/safety-posture with posture == HOLD"
        actor: ConstructionManager
        preconditions:
          - "readiness_status == UNDER_CONSTRUCTION"
          - "safety_posture == CLEAR"
        side_effects:
          - "identical three-hop cascade as the READY_TO_BUILD -> SAFETY_HOLD transition; pre_hold_readiness_status := UNDER_CONSTRUCTION"
          - "version += 1"
      - from: SAFETY_HOLD
        to: UNDER_CONSTRUCTION
        trigger: "POST /homeownership/build-sites/{id}/safety-posture with posture == CLEAR"
        actor: ConstructionManager
        preconditions:
          - "readiness_status == SAFETY_HOLD"
          - "pre_hold_readiness_status == UNDER_CONSTRUCTION"
        side_effects:
          - "safety_posture := CLEAR; pre_hold_readiness_status := null; version += 1"
          - "cancelled shifts are NOT restored — new shifts must be created"
        note: "Cycle UNDER_CONSTRUCTION <-> SAFETY_HOLD."
      - from: SAFETY_HOLD
        to: READY_TO_BUILD
        trigger: "POST /homeownership/build-sites/{id}/safety-posture with posture == CLEAR"
        actor: ConstructionManager
        preconditions:
          - "readiness_status == SAFETY_HOLD"
          - "pre_hold_readiness_status == READY_TO_BUILD"
        side_effects:
          - "safety_posture := CLEAR; pre_hold_readiness_status := null; version += 1"
      - from: UNDER_CONSTRUCTION
        to: COMPLETED
        trigger: "POST /homeownership/build-sites/{id}/readiness-advance with step == FINAL_INSPECTION"
        actor: ConstructionManager
        preconditions:
          - "readiness_status == UNDER_CONSTRUCTION"
          - "no ConstructionShift of this site has status IN {SCHEDULED, OPEN, LOCKED}"
          - "assigned_household_id is not null"
        side_effects:
          - "cash_cost_cents and total_development_cost_cents recomputed by calculations.development_cost_basis (both variants)"
          - "version += 1"

  - entity: ConstructionShift
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /homeownership/construction-shifts/{id}/open"
        actor: ConstructionManager
        preconditions:
          - "status == SCHEDULED"
          - "BuildSite.readiness_status IN {READY_TO_BUILD, UNDER_CONSTRUCTION}"
          - "BuildSite.safety_posture == CLEAR"
          - "volunteer_slots + required_trade_slots >= 1"
          - "start_at > logical clock now"
        side_effects:
          - "version += 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /homeownership/construction-shifts/{id}/lock"
        actor: ConstructionManager
        preconditions:
          - "status == OPEN"
          - "BuildSite.safety_posture == CLEAR"
          - "confirmed_trade_count >= required_trade_slots"
          - "confirmed_general_count >= ceil(0.60 * volunteer_slots) per calculations.shift_lock_readiness"
          - "start_at > logical clock now"
        side_effects:
          - "safety_briefing_completed := true"
          - "cascade: every ShiftAssignment of this shift still in RESERVED transitions to CANCELLED, each lowering its VolunteerProfile.assigned_hours_committed by duration_hours"
          - "cascade: BuildSite.readiness_status READY_TO_BUILD -> UNDER_CONSTRUCTION"
          - "version += 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /homeownership/construction-shifts/{id}/open"
        actor: ConstructionManager
        preconditions:
          - "status == LOCKED"
          - "start_at > logical clock now"
          - "no ShiftAssignment of this shift has status == CHECKED_IN"
        side_effects:
          - "safety_briefing_completed := false"
          - "version += 1"
        note: "Reopen cycle OPEN <-> LOCKED, permitted only before the shift starts."
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /homeownership/construction-shifts/{id}/complete"
        actor: ConstructionManager
        preconditions:
          - "status == LOCKED"
          - "logical clock now >= end_at (equality completes)"
        side_effects:
          - "branch A: every ShiftAssignment with status == CHECKED_IN transitions to COMPLETED; each HOMEOWNER_PARTNER assignment synthesizes a SweatEquityEntry (category CONSTRUCTION, hours_claimed == duration_hours, status VERIFIED, verified_by_user_id := crew_lead_user_id, shift_assignment_id := the assignment id)"
          - "branch B: every ShiftAssignment with status == CONFIRMED (never checked in) transitions to NO_SHOW, incrementing VolunteerProfile.no_show_strikes; a profile reaching 3 strikes becomes SUSPENDED, and that suspension cancels all of the volunteer's RESERVED assignments on shifts whose start_at > now"
          - "version += 1"
        note: "Fork with divergent side-effect sets: branch A creates hour ledger rows, branch B creates strikes and suspension cascades."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /homeownership/construction-shifts/{id}/cancel or system cascade from BuildSite safety hold"
        actor: ConstructionManager
        preconditions:
          - "status IN {SCHEDULED, OPEN, LOCKED}"
        side_effects:
          - "cascade: every ShiftAssignment of this shift with status IN {RESERVED, CONFIRMED, CHECKED_IN} transitions to CANCELLED"
          - "cascade: each cancelled assignment lowers VolunteerProfile.assigned_hours_committed by duration_hours; no strike is recorded"
          - "version += 1"
        note: "Also valid from OPEN and LOCKED with identical side effects."

  - entity: ShiftAssignment
    state_field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /homeownership/shift-assignments/{id}/confirm"
        actor: Volunteer
        preconditions:
          - "status == RESERVED"
          - "ConstructionShift.status IN {SCHEDULED, OPEN}"
          - "BuildSite.safety_posture == CLEAR"
          - "for volunteer seats: VolunteerProfile.status == ACTIVE AND VolunteerProfile.waiver_expires_on > ConstructionShift.start_at"
          - "for role == SKILLED_TRADE: the volunteer holds a trade_certifications entry with trade == ConstructionShift.required_trade AND expires_on > ConstructionShift.end_at"
        side_effects:
          - "ConstructionShift.confirmed_general_count or confirmed_trade_count += 1; fill_ratio recomputed; ConstructionShift.version += 1"
          - "version += 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /homeownership/shift-assignments/{id}/check-in"
        actor: ConstructionManager
        preconditions:
          - "status == CONFIRMED"
          - "ConstructionShift.status == LOCKED AND safety_briefing_completed == true"
          - "BuildSite.safety_posture == CLEAR"
          - "logical clock now >= ConstructionShift.start_at - 30 minutes AND now < ConstructionShift.end_at"
        side_effects:
          - "checked_in_at := logical clock now; version += 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system — ConstructionShift transitions LOCKED -> COMPLETED"
        actor: system
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "for role == HOMEOWNER_PARTNER: a SweatEquityEntry is created in status VERIFIED as described in the shift's branch A"
          - "version += 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system — ConstructionShift transitions LOCKED -> COMPLETED with this assignment never checked in"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "VolunteerProfile.no_show_strikes += 1; at 3 strikes VolunteerProfile.status := SUSPENDED and every RESERVED assignment of that volunteer on shifts with start_at > now transitions to CANCELLED"
          - "version += 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /homeownership/shift-assignments/{id}/cancel, or system cascade from shift lock / shift cancel / volunteer suspension"
        actor: Volunteer
        preconditions:
          - "status IN {RESERVED, CONFIRMED}"
          - "for a Volunteer actor: X-User-ID == volunteer_id"
        side_effects:
          - "if status was CONFIRMED, ConstructionShift.confirmed_general_count or confirmed_trade_count -= 1 and fill_ratio recomputed"
          - "VolunteerProfile.assigned_hours_committed -= ConstructionShift.duration_hours, restoring the pre-reservation value exactly (calculations.volunteer_hour_capacity_invariant)"
          - "version += 1"
        note: "Also valid from CONFIRMED with the same side-effect set plus the confirmed-count decrement."

  - entity: EducationEnrollment
    state_field: status
    initial_state: ENROLLED
    terminal_states: [FAILED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: IN_PROGRESS
        trigger: "POST /homeownership/education-enrollments/{id}/module-completions (first accepted record)"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == ENROLLED"
          - "ApplicantHousehold.selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}"
        side_effects:
          - "passed_module_count or missed_session_count incremented per outcome; version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /homeownership/education-enrollments/{id}/module-completions with outcome == PASSED bringing passed_module_count to required_module_count"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == IN_PROGRESS"
          - "passed_module_count == required_module_count - 1 before this record"
          - "missed_session_count <= 2"
        side_effects:
          - "completed_on := logical clock now; expires_on := completed_on + 730 days"
          - "cascade: ApplicantHousehold.partnership_readiness EDUCATION_IN_PROGRESS -> EDUCATION_COMPLETE, and on to CLOSING_READY when sweat_equity_satisfied is already true, which in turn drives APPROVED mortgages to CLEARED_TO_CLOSE"
          - "version += 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /homeownership/education-enrollments/{id}/module-completions with outcome == MISSED bringing missed_session_count to 3"
        actor: FamilyServicesCoordinator
        preconditions:
          - "status == IN_PROGRESS"
          - "missed_session_count == 2 before this record"
        side_effects:
          - "cascade: ApplicantHousehold.partnership_readiness EDUCATION_IN_PROGRESS -> NOT_READY"
          - "version += 1"
      - from: COMPLETED
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc moves now to or past expires_on (equality expires)"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "curriculum_code == HOMEBUYER_CORE"
          - "logical clock now >= expires_on"
        side_effects:
          - "cascade hop 1: ApplicantHousehold.partnership_readiness (CLOSING_READY or EDUCATION_COMPLETE) -> NOT_READY"
          - "cascade hop 2: every MortgageApplication of that household with status == CLEARED_TO_CLOSE regresses to APPROVED"
          - "version += 1"
      - from: ENROLLED
        to: FAILED
        trigger: "system — ApplicantHousehold.selection_status transitions COMMITTEE_REVIEW -> DENIED"
        actor: system
        preconditions:
          - "status IN {ENROLLED, IN_PROGRESS}"
        side_effects:
          - "version += 1"

  - entity: MortgageApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDERWRITING
        trigger: "POST /homeownership/mortgage-applications/{id}/submit-underwriting"
        actor: MortgageOfficer
        preconditions:
          - "status == DRAFT"
          - "ApplicantHousehold.selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}"
          - "ApplicantHousehold.documentation_status == VERIFIED AND verified_annual_income_cents is not null"
          - "BuildSite.readiness_status IN {READY_TO_BUILD, UNDER_CONSTRUCTION, COMPLETED}"
          - "no SelectionReview row with household_id == this.household_id AND reviewer_user_id == X-User-ID AND status == SUBMITTED (segregation of duties)"
        side_effects:
          - "appraised_value_cents := BuildSite.appraised_value_cents and income_basis_annual_cents := ApplicantHousehold.verified_annual_income_cents (both pinned)"
          - "escrow_monthly_cents, affordable_pi_payment_cents, term_months, first_mortgage_principal_cents, silent_second_amount_cents written by calculations.affordable_payment_structure"
          - "version += 1"
      - from: UNDERWRITING
        to: DRAFT
        trigger: "POST /homeownership/mortgage-applications/{id}/return-to-draft"
        actor: MortgageOfficer
        preconditions:
          - "status == UNDERWRITING"
        side_effects:
          - "appraised_value_cents, income_basis_annual_cents, escrow_monthly_cents, affordable_pi_payment_cents, term_months, first_mortgage_principal_cents, silent_second_amount_cents all reset to null (snapshots unpinned)"
          - "version += 1"
        note: "Revision cycle DRAFT <-> UNDERWRITING; each re-submission re-pins the snapshots from current entity values, so a site re-appraisal between loops changes the structure."
      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /homeownership/mortgage-applications/{id}/approve"
        actor: MortgageOfficer
        preconditions:
          - "status == UNDERWRITING"
          - "expected_program_version == AffiliateProgram.version (OCC, see concurrency_rules.mortgage-approve-stale-program)"
          - "AffiliateProgram.program_posture != FROZEN"
          - "AffiliateProgram.subsidy_available_cents >= silent_second_amount_cents (equality approves)"
          - "no SelectionReview row with household_id == this.household_id AND reviewer_user_id == X-User-ID AND status == SUBMITTED"
        side_effects:
          - "AffiliateProgram.subsidy_committed_cents += silent_second_amount_cents; subsidy_available_cents recomputed; program_posture recomputed; AffiliateProgram.version += 1"
          - "if ApplicantHousehold.partnership_readiness == CLOSING_READY, continue immediately to CLEARED_TO_CLOSE in the same request"
          - "version += 1"
      - from: UNDERWRITING
        to: DENIED
        trigger: "POST /homeownership/mortgage-applications/{id}/deny"
        actor: MortgageOfficer
        preconditions:
          - "status IN {UNDERWRITING, APPROVED}"
          - "denial_reason_code supplied in the payload"
        side_effects:
          - "BuildSite.assigned_household_id := null when it equals this.household_id; BuildSite.version += 1"
          - "every CostEntry of that BuildSite with status == RECORDED AND is_in_kind == false AND category == SITE_WORK is left untouched (cost history is append-only)"
          - "version += 1"
      - from: APPROVED
        to: DENIED
        trigger: "POST /homeownership/mortgage-applications/{id}/deny"
        actor: MortgageOfficer
        preconditions:
          - "status == APPROVED"
          - "denial_reason_code supplied"
        side_effects:
          - "compensating action: AffiliateProgram.subsidy_committed_cents -= silent_second_amount_cents, restoring subsidy_available_cents to its pre-approval value exactly (calculations.subsidy_pool_ledger)"
          - "AffiliateProgram.program_posture recomputed; AffiliateProgram.version += 1"
          - "BuildSite.assigned_household_id := null; BuildSite.version += 1"
          - "version += 1"
      - from: APPROVED
        to: CLEARED_TO_CLOSE
        trigger: "system — ApplicantHousehold.partnership_readiness reaches CLOSING_READY"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "ApplicantHousehold.partnership_readiness == CLOSING_READY"
          - "the household's HOMEBUYER_CORE EducationEnrollment status == COMPLETED AND expires_on > logical clock now"
        side_effects:
          - "version += 1"
      - from: CLEARED_TO_CLOSE
        to: APPROVED
        trigger: "system — ApplicantHousehold.partnership_readiness leaves CLOSING_READY (sweat equity reversal or HOMEBUYER_CORE expiry)"
        actor: system
        preconditions:
          - "status == CLEARED_TO_CLOSE"
        side_effects:
          - "AffiliateProgram.subsidy_committed_cents is NOT changed (the commitment survives the regression)"
          - "version += 1"
        note: "Cycle APPROVED <-> CLEARED_TO_CLOSE driven entirely by the other entity's readiness dimension."
      - from: CLEARED_TO_CLOSE
        to: CLOSED
        trigger: "POST /homeownership/mortgage-applications/{id}/close"
        actor: MortgageOfficer
        preconditions:
          - "status == CLEARED_TO_CLOSE"
          - "BuildSite.readiness_status == COMPLETED"
          - "the household's HOMEBUYER_CORE EducationEnrollment status == COMPLETED AND expires_on > logical clock now"
          - "ApplicantHousehold.sweat_equity_satisfied == true"
        side_effects:
          - "lien_status NONE -> ACTIVE; lien_recorded_on := logical clock now; lien_outstanding_cents := silent_second_amount_cents; forgiven_amount_cents := 0"
          - "AffiliateProgram.subsidy_committed_cents -= silent_second_amount_cents AND subsidy_disbursed_cents += silent_second_amount_cents (pool identity preserved); AffiliateProgram.version += 1"
          - "ApplicantHousehold.selection_status PARTNERSHIP_ACTIVE -> CLOSED with closing_date := now; AffiliateProgram.households_served_count += 1"
          - "version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /homeownership/mortgage-applications creates a replacement application for the same household"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "the new application's superseded_application_id := this.id"
          - "version += 1"

  - entity: MortgageApplication
    state_field: lien_status
    initial_state: NONE
    terminal_states: [SATISFIED, RECAPTURED]
    transitions:
      - from: NONE
        to: ACTIVE
        trigger: "system — status transitions CLEARED_TO_CLOSE -> CLOSED"
        actor: system
        preconditions:
          - "lien_status == NONE"
          - "silent_second_amount_cents > 0"
        side_effects:
          - "version += 1"
      - from: ACTIVE
        to: FORBEARANCE
        trigger: "POST /homeownership/mortgage-applications/{id}/lien-actions with action == FORBEARANCE_GRANT"
        actor: MortgageOfficer
        preconditions:
          - "lien_status == ACTIVE"
          - "status == CLOSED"
          - "forbearance_counseling_sessions <= 1 (the third grant is refused)"
        side_effects:
          - "forbearance_counseling_sessions += 1; forgiven_amount_cents and lien_outstanding_cents recomputed by calculations.lien_forgiveness_and_recapture"
          - "version += 1"
      - from: FORBEARANCE
        to: ACTIVE
        trigger: "POST /homeownership/mortgage-applications/{id}/lien-actions with action == REINSTATE"
        actor: MortgageOfficer
        preconditions:
          - "lien_status == FORBEARANCE"
        side_effects:
          - "version += 1"
        note: "Foreclosure-prevention cycle ACTIVE <-> FORBEARANCE, at most two grants."
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /homeownership/mortgage-applications/{id}/lien-actions with action == TRANSFER_REQUEST"
        actor: MortgageOfficer
        preconditions:
          - "lien_status == ACTIVE"
          - "sale_price_cents supplied in the payload"
        side_effects:
          - "right_of_first_refusal_expires_on := logical clock now + 30 days"
          - "forgiven_amount_cents, lien_outstanding_cents and the recapture total recomputed by calculations.lien_forgiveness_and_recapture"
          - "version += 1"
      - from: TRANSFER_PENDING
        to: RECAPTURED
        trigger: "POST /homeownership/mortgage-applications/{id}/lien-actions with action == RECORD_TRANSFER"
        actor: MortgageOfficer
        preconditions:
          - "lien_status == TRANSFER_PENDING"
          - "logical clock now >= right_of_first_refusal_expires_on (the affiliate's right of first refusal has lapsed)"
        side_effects:
          - "AffiliateProgram.subsidy_disbursed_cents -= lien_outstanding_cents AND subsidy_pool_cents += the shared-appreciation portion returned; AffiliateProgram.version += 1"
          - "version += 1"
      - from: ACTIVE
        to: SATISFIED
        trigger: "POST /homeownership/mortgage-applications/{id}/lien-actions with action == SATISFY"
        actor: MortgageOfficer
        preconditions:
          - "lien_status == ACTIVE"
          - "lien_outstanding_cents == 0 after recomputation (full straight-line forgiveness accrued, i.e. months elapsed >= 240)"
        side_effects:
          - "AffiliateProgram.subsidy_disbursed_cents -= silent_second_amount_cents (the forgiven subsidy leaves the ledger as program expense); AffiliateProgram.version += 1"
          - "version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: mortgage-approve-stale-program
    parent_entity: AffiliateProgram
    write_endpoint: "POST /homeownership/mortgage-applications/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a mortgage commits silent-second subsidy out of the shared
      program pool. An approval carrying an expected_program_version older than
      AffiliateProgram.version is rejected: the client's view of the pool is
      stale because an earlier accepted write (another approval, a pool
      adjustment, or a closing) already moved subsidy_committed_cents, and the
      pool arithmetic this request was built on no longer holds.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-shift
    parent_entity: ConstructionShift
    write_endpoint: "POST /homeownership/shift-assignments"
    occ_field: "expected_shift_version"
    description: |
      Reserving a seat on a shift whose version has advanced since the client
      last read it is rejected. The advance means the shift's confirmed counts,
      lock state or slot inventory changed after the client computed that a seat
      was free, so the reservation is built on a stale seat map.
    error_id: ERR_STALE_SHIFT_VERSION
    http_status: 412

  - rule_id: mortgage-create-stale-household
    parent_entity: ApplicantHousehold
    write_endpoint: "POST /homeownership/mortgage-applications"
    occ_field: "expected_household_version"
    description: |
      Creating a MortgageApplication legitimately supersedes any prior DRAFT
      application for the same household. A create carrying an
      expected_household_version older than ApplicantHousehold.version is
      rejected, because the household record the officer underwrote against
      (scores, verified income, readiness) has since moved.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

  - rule_id: subsidy-pool-adjust-stale-program
    parent_entity: AffiliateProgram
    write_endpoint: "POST /homeownership/programs/{id}/subsidy-pool-adjustments"
    occ_field: "expected_program_version"
    description: |
      A pool adjustment (top-up, reduction, suspend, resume) carrying an
      expected_program_version older than AffiliateProgram.version is rejected;
      the adjustment was sized against a pool balance that an earlier accepted
      write has already changed.

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: household_selection_scoring
    trigger: "POST /households/{id}/screen (PRELIMINARY variant) and POST /households/{id}/selection-decision (FINAL variant); writes need_score, ability_to_pay_score, ami_pct, composite_selection_score, score_basis"
    algorithm: weighted_scoring
    formula: |
      # income_basis_annual and housing_cost_basis are variant-dependent (see variants)
      monthly_gross_cents      = floor(income_basis_annual / 12)
      cost_burden_ratio        = 0 if monthly_gross_cents == 0
                                 else round(housing_cost_basis / monthly_gross_cents, 4)
      cost_burden_points       = 40 if cost_burden_ratio >= 0.5000
                                 else 30 if cost_burden_ratio >= 0.4000
                                 else 20 if cost_burden_ratio >= 0.3000
                                 else 0
      persons_per_bedroom      = household_size / max(1, current_bedroom_count)
      overcrowding_points      = 30 if persons_per_bedroom >= 2.0
                                 else 20 if persons_per_bedroom >= 1.5
                                 else 0
      substandard_points       = 30 if habitability_deficiency_count >= 2
                                 else 15 if habitability_deficiency_count == 1
                                 else 0
      need_score               = cost_burden_points + overcrowding_points + substandard_points   # 0..100

      dti_ratio                = 0 if monthly_gross_cents == 0
                                 else round(monthly_debt_payment_cents / monthly_gross_cents, 4)
      dti_points               = 50 if dti_ratio <= 0.1300
                                 else 35 if dti_ratio <= 0.2500
                                 else 20 if dti_ratio <= 0.3600
                                 else 0
      credit_points            = 25 if credit_score >= 620 else 15 if credit_score >= 580 else 0
      history_points           = 25 if on_time_housing_payment_months >= 12 else 0
      ability_to_pay_score     = dti_points + credit_points + history_points                     # 0..100

      ami_pct                  = round(income_basis_annual / AffiliateProgram.ami_median_income_cents, 4)
      composite_selection_score = round(0.40 * need_score
                                        + 0.35 * ability_to_pay_score
                                        + 0.25 * willingness_score, 2)   # null while willingness_score is null
    input_set: "The single ApplicantHousehold row under evaluation plus its program's ami_median_income_cents; willingness_score comes from calculations.committee_quorum_and_willingness and is null before quorum is met."
    constants:
      NEED_WEIGHT: 0.40
      ABILITY_WEIGHT: 0.35
      WILLINGNESS_WEIGHT: 0.25
      COST_BURDEN_TIERS: "[[0.5000, 40], [0.4000, 30], [0.3000, 20]]"
      OVERCROWDING_TIERS: "[[2.0, 30], [1.5, 20]]"
      DTI_TIERS: "[[0.1300, 50], [0.2500, 35], [0.3600, 20]]"
      AMI_BAND_MIN: 0.3000
      AMI_BAND_MAX: 0.8000
      SELECT_THRESHOLD: 70.00
      WAITLIST_THRESHOLD: 55.00
    precision: "ratios round to 4 decimal places half-up before any tier comparison; scores are integers; composite_selection_score rounds to 2 decimal places half-up"
    variants:
      - name: PRELIMINARY
        when: "Evaluated at POST /households/{id}/screen — score_basis := PRELIMINARY"
        difference: "income_basis_annual := self_reported_annual_income_cents and housing_cost_basis := self_reported_housing_cost_cents; verified_* values are ignored even when already present. willingness_score is null so composite_selection_score stays null."
      - name: FINAL
        when: "Evaluated at POST /households/{id}/selection-decision and at POST /households/{id}/committee-referral's AMI band gate — score_basis := FINAL"
        difference: "income_basis_annual := verified_annual_income_cents and housing_cost_basis := verified_housing_cost_cents. Because verified figures routinely differ from self-reported ones, the same row yields a different need_score, ability_to_pay_score, ami_pct and AMI-band verdict than the PRELIMINARY variant produced minutes earlier; the stored PRELIMINARY values are overwritten, never blended."

  - name: committee_quorum_and_willingness
    trigger: "Evaluated on POST /selection-reviews, POST /selection-reviews/{id}/retract and POST /households/{id}/selection-decision; writes ApplicantHousehold.willingness_score"
    algorithm: aggregation
    formula: |
      # candidate rows: SelectionReview where household_id == target AND status == SUBMITTED
      # one effective review per (reviewer_user_id, dimension): the row with the
      # greatest created_at; tie on created_at is impossible because a reviewer may
      # hold at most one SUBMITTED row per dimension (uniqueness rule §1.4 p22).
      effective(d)     = { latest SUBMITTED review per reviewer_user_id with dimension == d }
      quorum_met       = for every d in {NEED, ABILITY, WILLINGNESS}:
                           count(distinct reviewer_user_id in effective(d)) >= AffiliateProgram.committee_quorum
      willingness_score = null if effective(WILLINGNESS) is empty
                          else round(sum(score over effective(WILLINGNESS))
                                     / count(effective(WILLINGNESS)), 2)
      veto_present     = any row in effective(WILLINGNESS) with recommendation == VETO_WILLINGNESS
    input_set: "SelectionReview rows of the target household with status == SUBMITTED only; RETRACTED rows are excluded from the distinct-reviewer count, from the mean and from the veto test."
    constants:
      QUORUM_SOURCE: "AffiliateProgram.committee_quorum (default 3)"
      REQUIRED_DIMENSIONS: "[NEED, ABILITY, WILLINGNESS]"
    precision: "willingness_score rounds to 2 decimal places half-up after the division"

  - name: waitlist_promotion_selector
    trigger: "POST /programs/{id}/waitlist-promotions"
    algorithm: weighted_scoring
    formula: |
      eligible = ApplicantHousehold rows where
                   program_id == {id}
                   AND selection_status == WAITLISTED
                   AND partnership_readiness != WITHDRAWN
                   AND composite_selection_score >= 55.00
      ranked   = eligible sorted by composite_selection_score DESC,
                            then need_score DESC,
                            then created_at ASC        # final tie-break, never `id`
      capacity = count(BuildSite rows of this program where
                         readiness_status == READY_TO_BUILD
                         AND assigned_household_id is null)
      promote_n = min(promote_count_from_payload, capacity, count(ranked))
      promoted  = first promote_n rows of `ranked`
      if count(eligible) == 0            -> reject with ERR_NO_ELIGIBLE_WAITLIST_HOUSEHOLD (409)
      if capacity == 0 and count(eligible) > 0 -> reject with ERR_NO_READY_SITE_CAPACITY (409)
    input_set: "Only WAITLISTED, non-withdrawn households of the addressed program with composite_selection_score >= 55.00; capacity counts only READY_TO_BUILD sites with no assigned household (SAFETY_HOLD and UNDER_CONSTRUCTION sites do not count)."
    constants:
      MIN_PROMOTION_SCORE: 55.00
      MAX_PROMOTE_COUNT: 10
    precision: "scores compared at 2 decimal places; promote_count is an integer 1..10"

  - name: sweat_equity_credit_allocation
    trigger: "POST /sweat-equity-entries/{id}/credit; writes SweatEquityEntry.credit_weight, hours_credited, capped_hours and updates the household and member ledgers"
    algorithm: waterfall_allocation
    formula: |
      age_at_work_date = floor((work_date - HouseholdMember.birth_date) / 365.25 days)
      if age_at_work_date < 16                        -> reject ERR_MEMBER_INELIGIBLE_FOR_CREDIT (422)
      minor            = age_at_work_date < 18
      if minor and category NOT IN {RESTORE_STORE, ADVOCACY} -> reject ERR_MINOR_CATEGORY_NOT_ALLOWED (422)

      base_weight      = 1.00 if category IN {CONSTRUCTION, RESTORE_STORE, HOMEOWNER_EDUCATION}
                         else 0.75 if category == OTHER_AFFILIATE
                         else 0.50                     # ADVOCACY
      credit_weight    = round(base_weight * (0.50 if minor else 1.00), 2)

      # STEP 1 — per-entry rounding happens HERE, before any summation.
      gross_hours      = round(hours_claimed * credit_weight, 2)      # round_half_up, 2dp

      # STEP 2 — per-category allowance (a cap on the SUM of already-credited hours)
      category_cap     = 25.00 if category == HOMEOWNER_EDUCATION
                         else 10.00 if category == ADVOCACY
                         else null                                    # uncapped
      category_used    = sum(hours_credited over SweatEquityEntry rows of this household
                             with status IN {CREDITED, REVERSED} AND category == this.category)
      category_room    = 999999.00 if category_cap is null
                         else max(0, round(category_cap - category_used, 2))

      # STEP 3 — family-member allowance (non-applicant relatives and friends)
      family_scoped    = HouseholdMember.relationship NOT IN {APPLICANT, CO_APPLICANT}
      family_cap       = floor(0.50 * ApplicantHousehold.sweat_equity_required_hours)
      family_room      = 999999.00 if family_scoped == false
                         else max(0, round(family_cap
                                    - ApplicantHousehold.family_member_credited_hours, 2))
      if family_scoped and family_room == 0 -> reject ERR_FAMILY_CREDIT_CAP_REACHED (422)

      hours_credited   = min(gross_hours, category_room, family_room)
      capped_hours     = round(gross_hours - hours_credited, 2)
      if hours_credited == 0 -> reject ERR_CATEGORY_CREDIT_CAP_REACHED (422)
    input_set: "The one entry being credited, plus every entry of the household with status IN {CREDITED, REVERSED} (a reversed original and its negative mirror net to zero, releasing allowance room), filtered by category for the category allowance and by member relationship for the family allowance. CLAIMED, VERIFIED and REJECTED entries never consume allowance."
    constants:
      CATEGORY_WEIGHTS: "{CONSTRUCTION: 1.00, RESTORE_STORE: 1.00, HOMEOWNER_EDUCATION: 1.00, OTHER_AFFILIATE: 0.75, ADVOCACY: 0.50}"
      MINOR_WEIGHT_MULTIPLIER: 0.50
      MIN_CREDIT_AGE: 16
      HOMEOWNER_EDUCATION_CAP_HOURS: 25.00
      ADVOCACY_CAP_HOURS: 10.00
      FAMILY_CAP_FRACTION: 0.50
    precision: |
      Rounding order is PINNED: each entry's gross_hours is rounded to 2 decimal
      places half-up BEFORE it is compared against an allowance and BEFORE it is
      added to any ledger ("round per entry, then sum"). Summing raw
      hours_claimed * credit_weight products first and rounding the total
      afterwards is explicitly wrong and yields different ledger balances (e.g.
      three 2.5h ADVOCACY entries: round(1.25,2)*3 = 3.75 vs round(3.75,2) = 3.75
      agree, but three 1.75h OTHER_AFFILIATE entries give 1.31+1.31+1.31 = 3.93
      per-entry versus round(3.9375,2) = 3.94 sum-first).
    variants:
      - name: MANUAL_CLAIM
        when: "Entry was created by POST /sweat-equity-entries with shift_assignment_id == null"
        difference: "hours_claimed comes from the payload and may be any value in [0.25, 12]."
      - name: SHIFT_SYNTHESIZED
        when: "Entry was created by the LOCKED -> COMPLETED shift cascade (shift_assignment_id is not null)"
        difference: "hours_claimed is forced to ConstructionShift.duration_hours, category is forced to CONSTRUCTION, and the entry starts in VERIFIED (skipping CLAIMED), so the crew lead's verification is implicit."

  - name: sweat_equity_ledger_invariant
    trigger: "Asserted after every SweatEquityEntry credit and reverse"
    algorithm: aggregation
    formula: |
      LEDGER_SET = SweatEquityEntry rows of this household with status IN {CREDITED, REVERSED}
      ApplicantHousehold.sweat_equity_credited_hours
        == round(sum(hours_credited over LEDGER_SET), 2)
      ApplicantHousehold.family_member_credited_hours
        == round(sum(hours_credited over LEDGER_SET rows whose HouseholdMember.relationship
                     NOT IN {APPLICANT, CO_APPLICANT}), 2)
      # Conserved quantity: credited sweat equity hours. credit(e) followed by
      # reverse(e) MUST leave sweat_equity_credited_hours,
      # family_member_credited_hours and HouseholdMember.credited_hours_to_date at
      # exactly their pre-credit values: reverse flips e to REVERSED (e stays in
      # LEDGER_SET at +h) and posts a mirror row in CREDITED at -h, so the pair
      # nets to 0.00 with no drift and no allowance leakage.
    input_set: "All SweatEquityEntry rows of the household with status IN {CREDITED, REVERSED}; reversal mirrors keep status CREDITED forever and carry negative hours_credited."
    constants:
      CONSERVED_QUANTITY: "credited sweat equity hours"
    precision: "2 decimal places half-up on every sum"

  - name: affordable_payment_structure
    trigger: "POST /mortgage-applications/{id}/submit-underwriting (DRAFT -> UNDERWRITING); writes escrow_monthly_cents, affordable_pi_payment_cents, term_months, first_mortgage_principal_cents, silent_second_amount_cents"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular — term_months is
      # chosen from a principal tier, while first_mortgage_principal_cents is
      # payment * term_months — so the order below is normative: ONE forward pass,
      # no iteration, no re-selection of term_months after step 7.
      # 1
      monthly_gross_cents  = floor(income_basis_annual_cents / 12)
      # 2  (each escrow component is rounded to whole cents SEPARATELY, then summed)
      tax_monthly_cents       = round_half_up(appraised_value_cents * 0.0125 / 12)
      insurance_annual_cents  = max(60000, round_half_up(appraised_value_cents * 0.0035))
      insurance_monthly_cents = round_half_up(insurance_annual_cents / 12)
      escrow_monthly_cents    = tax_monthly_cents + insurance_monthly_cents
      # 3
      max_total_payment_cents = floor(monthly_gross_cents * 0.30)
      # 4
      affordable_pi_payment_cents = max_total_payment_cents - escrow_monthly_cents
      if affordable_pi_payment_cents <= 0 -> reject ERR_NO_AFFORDABLE_STRUCTURE (422)
      # 5  provisional principal at the longest term, used ONLY to pick the tier
      provisional_principal = affordable_pi_payment_cents * 360
      # 6  tier selection (note: a shorter term is chosen when the household can
      #    almost self-fund the home, so subsidy is not parked in a long note)
      term_months = 240 if provisional_principal >= round_half_up(0.90 * appraised_value_cents)
                    else 300 if provisional_principal >= round_half_up(0.70 * appraised_value_cents)
                    else 360
      # 7  final principal — term_months is NOT re-derived from this value
      first_mortgage_principal_cents = min(affordable_pi_payment_cents * term_months,
                                           appraised_value_cents)
      # 8
      silent_second_amount_cents = appraised_value_cents - first_mortgage_principal_cents
      if silent_second_amount_cents < 0 -> silent_second_amount_cents = 0
    input_set: "Only the snapshots pinned on the MortgageApplication at DRAFT -> UNDERWRITING (income_basis_annual_cents, appraised_value_cents). Live ApplicantHousehold or BuildSite edits after the snapshot never move an underwritten structure; a return-to-draft plus re-submission is the only way to re-pin."
    constants:
      HOUSING_RATIO: 0.30
      ANNUAL_TAX_RATE: 0.0125
      ANNUAL_INSURANCE_RATE: 0.0035
      INSURANCE_ANNUAL_FLOOR_CENTS: 60000
      NOTE_INTEREST_RATE: 0.0
      TERM_TIER_240_THRESHOLD_PCT: 0.90
      TERM_TIER_300_THRESHOLD_PCT: 0.70
      TERM_CANDIDATES: "[240, 300, 360]"
    precision: "all money is integer cents; every division rounds half-up to whole cents at the step shown; monthly_gross_cents and max_total_payment_cents use floor, never round"

  - name: development_cost_basis
    trigger: "POST /cost-entries, and recomputed on BuildSite UNDER_CONSTRUCTION -> COMPLETED; writes BuildSite.cash_cost_cents and BuildSite.total_development_cost_cents"
    algorithm: aggregation
    formula: |
      RECORDED = CostEntry rows with build_site_id == site.id AND status == RECORDED
      cash_cost_cents             = BuildSite.acquisition_cost_cents
                                    + sum(amount_cents over RECORDED where is_in_kind == false)
      donated_fmv_cents           = sum(fair_market_value_cents over RECORDED where is_in_kind == true)
      total_development_cost_cents = cash_cost_cents + donated_fmv_cents
      AffiliateProgram.donated_material_fmv_cents = sum(donated_fmv_cents over all sites of the program)
    input_set: "CostEntry rows with status == RECORDED only; VOIDED rows leave both bases. Land acquisition_cost_cents is part of the cash basis even though it is not a CostEntry row."
    constants:
      IN_KIND_CASH_AMOUNT_RULE: "amount_cents MUST be 0 when is_in_kind == true; fair_market_value_cents MUST be 0 when is_in_kind == false"
    precision: "integer cents; no rounding"
    variants:
      - name: CASH_BASIS
        when: "Used by the affordability gap check on POST /mortgage-applications/{id}/approve and by an impact report whose GrantAward.restricted_to_in_kind_reporting == false"
        difference: "Counts only cash outlays (acquisition + non-in-kind CostEntry rows). Donated materials are invisible, so cost_per_household comes out LOWER and the affiliate looks cheaper per home."
      - name: FULL_FMV_BASIS
        when: "Used by BuildSite.total_development_cost_cents, by AffiliateProgram.donated_material_fmv_cents and by an impact report whose GrantAward.restricted_to_in_kind_reporting == true"
        difference: "Adds the documented fair market value of every in-kind donation, so the SAME set of CostEntry rows yields a strictly larger development cost and a strictly larger cost_per_household than CASH_BASIS whenever any RECORDED in-kind row exists."

  - name: subsidy_pool_ledger
    trigger: "POST /programs/{id}/subsidy-pool-adjustments, mortgage approve / deny / close, and the RECAPTURE and PAYOFF lien actions; writes AffiliateProgram.subsidy_committed_cents, subsidy_disbursed_cents, subsidy_available_cents, program_posture"
    algorithm: threshold
    formula: |
      subsidy_committed_cents = sum(silent_second_amount_cents over MortgageApplication rows
                                    of this program whose status IN {APPROVED, CLEARED_TO_CLOSE})
      subsidy_disbursed_cents = sum(silent_second_amount_cents over MortgageApplication rows
                                    of this program whose status == CLOSED AND lien_status
                                    IN {ACTIVE, FORBEARANCE, TRANSFER_PENDING})
      subsidy_available_cents = subsidy_pool_cents - subsidy_committed_cents - subsidy_disbursed_cents
      # INVARIANT (conserved quantity: subsidy capital in cents)
      subsidy_pool_cents == subsidy_available_cents + subsidy_committed_cents + subsidy_disbursed_cents
      # approval gate — equality passes
      approve_allowed = subsidy_available_cents >= application.silent_second_amount_cents
      program_posture  = FROZEN             if status == SUSPENDED
                         else SUBSIDY_RESTRICTED if subsidy_available_cents == 0
                         else OPEN
    input_set: "MortgageApplication rows of this program only; DRAFT, UNDERWRITING, DENIED and SUPERSEDED applications contribute nothing. A CLOSED application whose lien_status is SATISFIED or RECAPTURED has left the disbursed bucket."
    constants:
      CONSERVED_QUANTITY: "subsidy capital cents"
      APPROVE_COMPARATOR: ">= (an approval requiring exactly the remaining balance succeeds and drives program_posture to SUBSIDY_RESTRICTED)"
    precision: "integer cents; no rounding anywhere in the ledger"

  - name: shift_lock_readiness
    trigger: "POST /construction-shifts/{id}/lock, and recomputed on every ShiftAssignment confirm / cancel; writes ConstructionShift.confirmed_general_count, confirmed_trade_count, fill_ratio"
    algorithm: threshold
    formula: |
      CONFIRMED_SET = ShiftAssignment rows of this shift with status IN {CONFIRMED, CHECKED_IN, COMPLETED}
      confirmed_general_count = count(CONFIRMED_SET where role == GENERAL_VOLUNTEER)
      confirmed_trade_count   = count(CONFIRMED_SET where role == SKILLED_TRADE)
      fill_ratio              = 0 if volunteer_slots == 0
                                else round(confirmed_general_count / volunteer_slots, 4)
      min_general_required    = ceil(0.60 * volunteer_slots)     # 0 when volunteer_slots == 0
      lock_allowed            = confirmed_trade_count >= required_trade_slots
                                AND confirmed_general_count >= min_general_required
      # Boundary cases:
      #   volunteer_slots == 5 -> min_general_required == 3 (ceil(3.0) == 3): 3 confirms lock, 2 do not.
      #   volunteer_slots == 0 AND required_trade_slots == 0 -> the shift can never
      #   be OPENed (precondition volunteer_slots + required_trade_slots >= 1), so
      #   lock is unreachable and ERR_SHIFT_HAS_NO_SLOTS fires at open time.
    input_set: "ShiftAssignment rows of the addressed shift with status IN {CONFIRMED, CHECKED_IN, COMPLETED}; RESERVED, CANCELLED and NO_SHOW rows are excluded from both counts."
    constants:
      MIN_GENERAL_FILL_FRACTION: 0.60
      ROUNDING_FOR_MIN_GENERAL: "ceil"
    precision: "fill_ratio rounds to 4 decimal places half-up; counts are integers"

  - name: site_shift_buffer_overlap
    trigger: "POST /construction-shifts (creation) — validates the requested window against the site's existing shifts"
    algorithm: interval_merge
    formula: |
      # Interval semantics: a shift OCCUPIES the site for
      #   [start_at - 60 min, end_at + 60 min]  (closed, symmetric cleanup buffer)
      # A candidate collides when the buffered intervals intersect on more than a
      # single instant:
      OCCUPYING = ConstructionShift rows with build_site_id == candidate.build_site_id
                  AND status IN {SCHEDULED, OPEN, LOCKED, COMPLETED}
      collides(existing) = candidate.start_at < existing.end_at   + 60 minutes
                           AND existing.start_at < candidate.end_at + 60 minutes
      if any collides -> reject ERR_SITE_SHIFT_BUFFER_CONFLICT (409)
      # Boundary: a candidate starting EXACTLY 60 minutes after an existing shift's
      # end_at is ACCEPTED (strict `<` on both sides); 59 minutes is rejected.
      # The site is exclusive: no two shifts may hold overlapping intervals on it regardless of
      # slot counts.
    input_set: "Shifts of the same BuildSite with status IN {SCHEDULED, OPEN, LOCKED, COMPLETED}; CANCELLED shifts release the site immediately and never collide."
    constants:
      SITE_CLEANUP_BUFFER_MINUTES: 60
      INTERVAL_GEOMETRY: "closed, symmetric buffer on both ends, exclusive occupancy"
    precision: "instants compared at whole-second resolution in UTC"

  - name: volunteer_shift_overlap_and_weekly_cap
    trigger: "POST /shift-assignments (creation) — validates the volunteer's calendar and weekly hour budget"
    algorithm: interval_merge
    formula: |
      # Interval semantics: a volunteer OCCUPIES [start_at, end_at) — HALF-OPEN,
      # ZERO buffer. Back-to-back shifts (previous.end_at == candidate.start_at) are
      # explicitly ALLOWED, which is the opposite of the site rule's buffered geometry.
      HELD = ShiftAssignment rows with volunteer_id == candidate.volunteer_id
             AND status IN {RESERVED, CONFIRMED, CHECKED_IN, COMPLETED}
      overlaps(held) = candidate_shift.start_at < held_shift.end_at
                       AND held_shift.start_at < candidate_shift.end_at
      if any overlaps -> reject ERR_VOLUNTEER_DOUBLE_BOOKED (409)

      # Aggregate capacity, calendar-anchored (NOT a floating window):
      week_start = the Monday 00:00:00.000Z at or before candidate_shift.start_at
      week_end   = week_start + 7 days                       # half-open [week_start, week_end)
      week_hours = sum(ConstructionShift.duration_hours over HELD rows whose shift
                       start_at is in [week_start, week_end))
      weekly_cap = 16.00 if VolunteerProfile.is_minor else 40.00
      if round(week_hours + candidate_shift.duration_hours, 2) > weekly_cap
         -> reject ERR_VOLUNTEER_WEEKLY_CAP_EXCEEDED (422)
      # Boundary: landing exactly ON the cap (== 40.00) is ACCEPTED; 40.01 is not.
    input_set: "The candidate volunteer's non-terminal and completed assignments only; CANCELLED and NO_SHOW rows neither block a window nor consume weekly hours. Partner-family seats (volunteer_id == null) are exempt from both tests."
    constants:
      INTERVAL_GEOMETRY: "half-open [start, end), zero buffer, adjacency allowed"
      ADULT_WEEKLY_CAP_HOURS: 40.00
      MINOR_WEEKLY_CAP_HOURS: 16.00
      WEEK_ANCHOR: "Monday 00:00:00.000Z of the candidate shift's UTC week"
    precision: "hours round to 2 decimal places half-up before the cap comparison"

  - name: volunteer_hour_capacity_invariant
    trigger: "Asserted after every ShiftAssignment create, cancel, lock-release cascade, shift cancel cascade and volunteer suspension cascade"
    algorithm: aggregation
    formula: |
      VolunteerProfile.assigned_hours_committed
        == round(sum(ConstructionShift.duration_hours over this volunteer's ShiftAssignment
                     rows with status IN {RESERVED, CONFIRMED, CHECKED_IN, COMPLETED}), 2)
      # Conserved quantity: committed volunteer hours. A reservation followed by its
      # compensating cancellation (explicit cancel, lock-time release of RESERVED
      # seats, shift cancellation, or suspension cascade) MUST restore
      # assigned_hours_committed to exactly its pre-reservation value. A NO_SHOW is
      # NOT compensating: the hours stay committed and a strike is added.
    input_set: "All ShiftAssignment rows of the volunteer, all time, restricted to status IN {RESERVED, CONFIRMED, CHECKED_IN, COMPLETED}. CANCELLED rows leave the sum (that is the compensating path). NO_SHOW rows also leave the sum, but they leave a permanent strike behind, so a no-show is a lossy exit rather than a compensating one."
    constants:
      CONSERVED_QUANTITY: "committed volunteer hours"
    precision: "2 decimal places half-up"

  - name: households_served_report
    trigger: "POST /grant-awards/{id}/impact-reports"
    algorithm: aggregation
    formula: |
      SERVED = ApplicantHousehold rows where
                 program_id == GrantAward.program_id
                 AND selection_status == CLOSED
                 AND closing_date >= GrantAward.period_start                    # INCLUSIVE
                 AND closing_date <= GrantAward.period_end + 23:59:59.999       # INCLUSIVE
      households_served      = count(SERVED)
      persons_served         = sum(household_size over SERVED)
      sweat_equity_hours     = round(sum(sweat_equity_credited_hours over SERVED), 2)
      basis                  = FULL_FMV_BASIS if GrantAward.restricted_to_in_kind_reporting
                               else CASH_BASIS
      cost_total_cents       = sum over SERVED of the household's closed MortgageApplication's
                               BuildSite cost on `basis`
                               (total_development_cost_cents or cash_cost_cents)
      subsidy_total_cents    = sum(silent_second_amount_cents over those applications)
      cost_per_household_cents    = 0 if households_served == 0
                                    else round_half_up(cost_total_cents / households_served)
      subsidy_per_household_cents = 0 if households_served == 0
                                    else round_half_up(subsidy_total_cents / households_served)
      target_variance        = households_served - GrantAward.households_served_target
      itemized list ordered by closing_date ASC, then created_at ASC   # never `id`
      # EMPTY-SET BOUNDARY: with no qualifying household every numeric field is the
      # integer 0 (never null, never a division error) and `households` is [].
    input_set: "Only CLOSED households of the award's program whose closing_date falls inside the award period with BOTH ends inclusive; PARTNERSHIP_ACTIVE, SELECTED, WAITLISTED and DENIED households are excluded even when their build is finished."
    constants:
      PERIOD_START_BOUNDARY: "inclusive"
      PERIOD_END_BOUNDARY: "inclusive through 23:59:59.999Z"
      EMPTY_SET_RESULT: 0
    precision: "money rounds half-up to whole cents after division; hours to 2 decimal places"

  - name: lien_forgiveness_and_recapture
    trigger: "Every lien action (FORBEARANCE_GRANT, REINSTATE, TRANSFER_REQUEST, RECORD_TRANSFER, SATISFY) and on POST /_clock/set_current_utc for CLOSED applications with lien_status IN {ACTIVE, FORBEARANCE, TRANSFER_PENDING}"
    algorithm: decay_function
    formula: |
      months_elapsed = floor((now - lien_recorded_on) / 30 days)     # 30-day months, floor
      # straight-line forgiveness starts only after the 60th month and completes at 240
      forgiven_amount_cents = 0 if months_elapsed < 60
                              else silent_second_amount_cents if months_elapsed >= 240
                              else round_half_up(silent_second_amount_cents
                                                 * (months_elapsed - 60) / 180)
      lien_outstanding_cents = max(0, silent_second_amount_cents - forgiven_amount_cents)
      # transfer recapture (TRANSFER_REQUEST / RECORD_TRANSFER only)
      appreciation_cents = max(0, sale_price_cents - appraised_value_cents)
      shared_pct = 0.75 if months_elapsed < 60
                   else 0.50 if months_elapsed < 120
                   else 0.25 if months_elapsed < resale_restriction_months
                   else 0.00
      recapture_total_cents = lien_outstanding_cents
                              + round_half_up(appreciation_cents * shared_pct)
    input_set: "The single MortgageApplication row; months_elapsed is measured from lien_recorded_on to the logical clock now, so the value only moves when POST /_clock/set_current_utc moves."
    constants:
      FORGIVENESS_START_MONTH: 60
      FORGIVENESS_END_MONTH: 240
      MONTH_LENGTH_DAYS: 30
      SHARED_APPRECIATION_TIERS: "[[60, 0.75], [120, 0.50], [resale_restriction_months, 0.25], [beyond, 0.00]]"
      ROFR_WINDOW_DAYS: 30
    precision: "integer cents, round half-up after each multiplication; months_elapsed uses floor over 30-day months"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing row decides the response, so a request that violates several
# rows returns the lowest-priority-number error_id)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role is listed in the addressed endpoint's roles[] set"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing row of the backing entity (Applicant -> ApplicantHousehold.id, Volunteer -> VolunteerProfile.id)"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles[] include Applicant or Volunteer"

  - priority: 5
    category: existence
    check: "Every path id resolves, validated left-to-right in path order"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "Every FK supplied in the request body resolves to an existing row, validated in the field order declared in the endpoint's input[]"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"

  - priority: 7
    category: auth
    check: "Ownership — an Applicant may only address a household whose id == X-User-ID (and its members, entries and enrollments); a Volunteer may only address assignments whose volunteer_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles[] include Applicant or Volunteer"

  - priority: 8
    category: business_constraint
    check: "Request body passes field-level schema checks — required fields present, enums in range, numbers inside the constraints declared in §1.1, limit in [1,100], offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

  - priority: 9
    category: state
    check: "OCC — expected_program_version / expected_shift_version / expected_household_version equals the parent's current version"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_SHIFT_VERSION | ERR_STALE_HOUSEHOLD_VERSION"
    http_status: 412
    applies_to: "POST /programs/{id}/subsidy-pool-adjustments, POST /shift-assignments, POST /mortgage-applications, POST /mortgage-applications/{id}/approve"

  - priority: 10
    category: state
    check: "The addressed row is in a `from:` state that §1.2 declares for the requested transition (state_field-specific)"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 11
    category: state
    check: "The addressed row is not already in a terminal state for the dimension being moved (DENIED / CLOSED / WITHDRAWN / COMPLETED / CANCELLED / NO_SHOW / SUPERSEDED / SATISFIED / RECAPTURED / FAILED / EXPIRED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 12
    category: state
    check: "AffiliateProgram.program_posture != FROZEN (program status ACTIVE) for every write that intakes households, credits hours, schedules construction or moves money"
    error_id: ERR_PROGRAM_FROZEN
    http_status: 409
    applies_to: "POST /households, POST /households/{id}/*, POST /selection-reviews, POST /sweat-equity-entries and its sub-actions, POST /construction-shifts and its sub-actions, POST /shift-assignments, POST /mortgage-applications and its sub-actions, POST /cost-entries"
    note: "PRIORITY CONFLICT PAIR A (state vs business_fiscal). A request to approve a mortgage on a SUSPENDED program whose remaining subsidy is ALSO too small fails both this row and priority 38; the state category wins, so the response is ERR_PROGRAM_FROZEN, never ERR_SUBSIDY_POOL_EXHAUSTED."

  - priority: 13
    category: business_referential
    check: "Documentation completeness — POST /households/{id}/committee-referral requires documentation_status == VERIFIED"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /households/{id}/committee-referral"

  - priority: 14
    category: business_constraint
    check: "AMI band — the FINAL-basis ami_pct satisfies 0.3000 <= ami_pct <= 0.8000 (both bounds inclusive)"
    error_id: ERR_INCOME_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /households/{id}/committee-referral"

  - priority: 15
    category: business_referential
    check: "Committee quorum — calculations.committee_quorum_and_willingness reports quorum_met == true for all three dimensions"
    error_id: ERR_COMMITTEE_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /households/{id}/selection-decision"

  - priority: 16
    category: business_constraint
    check: "A SelectionCommitteeMember may hold at most one SUBMITTED SelectionReview per (household_id, dimension); the previous one must be retracted first"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /selection-reviews"

  - priority: 17
    category: business_constraint
    check: "recommendation == VETO_WILLINGNESS requires documented_reason of 10..500 chars and dimension == WILLINGNESS"
    error_id: ERR_VETO_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /selection-reviews"

  - priority: 18
    category: business_safety
    check: "Segregation of duties — the acting user's X-User-ID must not appear as reviewer_user_id on any SUBMITTED SelectionReview of the household being underwritten"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mortgage-applications, POST /mortgage-applications/{id}/submit-underwriting, POST /mortgage-applications/{id}/approve"

  - priority: 19
    category: business_safety
    check: "Segregation of duties — the verifier of a sweat equity entry must not be the user who claimed it (X-User-ID != claimed_by_user_id)"
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
    http_status: 403
    applies_to: "POST /sweat-equity-entries/{id}/verification"

  - priority: 20
    category: business_referential
    check: "The HouseholdMember referenced by a sweat equity entry belongs to the same household as the entry AND has status == ACTIVE"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sweat-equity-entries, POST /sweat-equity-entries/{id}/credit"
    note: "PRIORITY CONFLICT PAIR C (business_referential vs business_constraint). Crediting an entry whose member was REMOVED while the family allowance is ALSO exhausted returns ERR_MEMBER_NOT_ACTIVE, not ERR_FAMILY_CREDIT_CAP_REACHED (priority 24)."

  - priority: 21
    category: business_temporal
    check: "work_date <= logical clock now and work_date >= ApplicantHousehold.created_at"
    error_id: ERR_WORK_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /sweat-equity-entries, POST /sweat-equity-entries/{id}/resubmit"

  - priority: 22
    category: business_safety
    check: "Member age at work_date >= 16; members aged 16-17 may only claim RESTORE_STORE or ADVOCACY categories"
    error_id: "ERR_MEMBER_INELIGIBLE_FOR_CREDIT | ERR_MINOR_CATEGORY_NOT_ALLOWED"
    http_status: 422
    applies_to: "POST /sweat-equity-entries/{id}/credit"

  - priority: 23
    category: business_constraint
    check: "Per-category allowance — HOMEOWNER_EDUCATION credits cap at 25.00 hours and ADVOCACY at 10.00 hours per household; an entry with zero remaining room is refused"
    error_id: ERR_CATEGORY_CREDIT_CAP_REACHED
    http_status: 422
    applies_to: "POST /sweat-equity-entries/{id}/credit"

  - priority: 24
    category: business_constraint
    check: "Family-member allowance — members whose relationship NOT IN {APPLICANT, CO_APPLICANT} may contribute at most floor(0.50 * sweat_equity_required_hours) credited hours in aggregate; landing exactly on the cap is allowed, exceeding it is partially credited, and a request with zero remaining room is refused"
    error_id: ERR_FAMILY_CREDIT_CAP_REACHED
    http_status: 422
    applies_to: "POST /sweat-equity-entries/{id}/credit"

  - priority: 25
    category: business_safety
    check: "BuildSite.safety_posture == CLEAR for every shift, assignment and check-in write touching that site"
    error_id: ERR_SITE_UNDER_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /construction-shifts, POST /construction-shifts/{id}/open, POST /construction-shifts/{id}/lock, POST /shift-assignments, POST /shift-assignments/{id}/confirm, POST /shift-assignments/{id}/check-in"

  - priority: 26
    category: business_referential
    check: "BuildSite.readiness_status IN {READY_TO_BUILD, UNDER_CONSTRUCTION} before a shift may be opened"
    error_id: ERR_SITE_NOT_READY_TO_BUILD
    http_status: 409
    applies_to: "POST /construction-shifts/{id}/open"

  - priority: 27
    category: business_constraint
    check: "A shift must offer at least one seat: volunteer_slots + required_trade_slots >= 1; and required_trade_slots > 0 requires a non-null required_trade"
    error_id: "ERR_SHIFT_HAS_NO_SLOTS | ERR_REQUIRED_TRADE_MISSING"
    http_status: 422
    applies_to: "POST /construction-shifts, POST /construction-shifts/{id}/open"

  - priority: 28
    category: business_safety
    check: "Volunteer eligibility — VolunteerProfile.status == ACTIVE, waiver_expires_on > ConstructionShift.start_at, and for role == SKILLED_TRADE an unexpired certification matching ConstructionShift.required_trade (expires_on > end_at)"
    error_id: "ERR_VOLUNTEER_SUSPENDED | ERR_WAIVER_EXPIRED | ERR_TRADE_CERTIFICATION_INVALID"
    http_status: 422
    applies_to: "POST /shift-assignments, POST /shift-assignments/{id}/confirm"
    note: "PRIORITY CONFLICT PAIR B (business_safety vs business_temporal). A reservation for a volunteer whose waiver expires before the shift AND who is already booked on an overlapping shift returns ERR_WAIVER_EXPIRED, never ERR_VOLUNTEER_DOUBLE_BOOKED (priority 29)."

  - priority: 29
    category: business_temporal
    check: "Interval conflicts — (a) a new ConstructionShift may not collide with another shift on the same BuildSite under the closed 60-minute cleanup buffer; (b) a new ShiftAssignment may not overlap another held assignment of the same volunteer under half-open [start, end) geometry with zero buffer"
    error_id: "ERR_SITE_SHIFT_BUFFER_CONFLICT | ERR_VOLUNTEER_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /construction-shifts, POST /shift-assignments"

  - priority: 30
    category: business_constraint
    check: "Seat inventory — RESERVED+CONFIRMED+CHECKED_IN+COMPLETED assignments of the requested role may not exceed volunteer_slots (GENERAL_VOLUNTEER) or required_trade_slots + 2 (SKILLED_TRADE); HOMEOWNER_PARTNER seats are unlimited but require household_member_id of a household assigned to that site"
    error_id: "ERR_SHIFT_ROLE_FULL | ERR_PARTNER_MEMBER_NOT_ON_SITE"
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 31
    category: business_temporal
    check: "Weekly volunteer hour capacity — round(week_hours + candidate duration, 2) <= 40.00 for adults and <= 16.00 for minors, measured over the candidate shift's UTC calendar week [Monday 00:00:00.000Z, +7 days)"
    error_id: ERR_VOLUNTEER_WEEKLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /shift-assignments"

  - priority: 32
    category: business_temporal
    check: "Check-in window — logical clock now >= start_at - 30 minutes AND now < end_at; shift completion requires now >= end_at"
    error_id: "ERR_CHECK_IN_WINDOW_CLOSED | ERR_SHIFT_NOT_ENDED"
    http_status: 409
    applies_to: "POST /shift-assignments/{id}/check-in, POST /construction-shifts/{id}/complete"

  - priority: 33
    category: business_constraint
    check: "Lock readiness — confirmed_trade_count >= required_trade_slots AND confirmed_general_count >= ceil(0.60 * volunteer_slots)"
    error_id: "ERR_TRADE_COVERAGE_INSUFFICIENT | ERR_SHIFT_FILL_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /construction-shifts/{id}/lock"

  - priority: 34
    category: business_referential
    check: "Education gating — closing requires the household's HOMEBUYER_CORE EducationEnrollment to be COMPLETED with expires_on > now; a household may hold only one HOMEBUYER_CORE enrollment in status IN {ENROLLED, IN_PROGRESS, COMPLETED}"
    error_id: "ERR_EDUCATION_NOT_COMPLETE | ERR_EDUCATION_EXPIRED | ERR_DUPLICATE_ENROLLMENT"
    http_status: 409
    applies_to: "POST /education-enrollments, POST /mortgage-applications/{id}/close"

  - priority: 35
    category: business_referential
    check: "Underwriting prerequisites — household selection_status IN {SELECTED, PARTNERSHIP_ACTIVE}, verified_annual_income_cents not null, and the BuildSite is either unassigned or already assigned to this household"
    error_id: "ERR_HOUSEHOLD_NOT_SELECTED | ERR_SITE_ALREADY_ASSIGNED"
    http_status: 409
    applies_to: "POST /mortgage-applications, POST /mortgage-applications/{id}/submit-underwriting"

  - priority: 36
    category: business_constraint
    check: "Affordability — calculations.affordable_payment_structure must yield affordable_pi_payment_cents > 0; a household whose 30% housing budget cannot cover escrow has no structure"
    error_id: ERR_NO_AFFORDABLE_STRUCTURE
    http_status: 422
    applies_to: "POST /mortgage-applications/{id}/submit-underwriting"

  - priority: 37
    category: business_referential
    check: "Closing prerequisites — BuildSite.readiness_status == COMPLETED and ApplicantHousehold.sweat_equity_satisfied == true"
    error_id: "ERR_SITE_NOT_COMPLETED | ERR_SWEAT_EQUITY_INCOMPLETE"
    http_status: 409
    applies_to: "POST /mortgage-applications/{id}/close"

  - priority: 38
    category: business_fiscal
    check: "Subsidy capacity — AffiliateProgram.subsidy_available_cents >= silent_second_amount_cents (an approval that consumes the pool down to exactly 0 succeeds)"
    error_id: ERR_SUBSIDY_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /mortgage-applications/{id}/approve"

  - priority: 39
    category: business_fiscal
    check: "Pool adjustments may not drive subsidy_pool_cents below subsidy_committed_cents + subsidy_disbursed_cents"
    error_id: ERR_POOL_BELOW_OBLIGATIONS
    http_status: 409
    applies_to: "POST /programs/{id}/subsidy-pool-adjustments"

  - priority: 40
    category: business_fiscal
    check: "In-kind bookkeeping — is_in_kind == true requires amount_cents == 0, fair_market_value_cents > 0 and donor_name; is_in_kind == false requires fair_market_value_cents == 0 and amount_cents > 0"
    error_id: ERR_IN_KIND_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /cost-entries"

  - priority: 41
    category: business_constraint
    check: "Lien actions — FORBEARANCE_GRANT requires forbearance_counseling_sessions <= 1, SATISFY requires lien_outstanding_cents == 0, RECORD_TRANSFER requires now >= right_of_first_refusal_expires_on, TRANSFER_REQUEST requires sale_price_cents > 0"
    error_id: "ERR_FORBEARANCE_LIMIT_REACHED | ERR_LIEN_BALANCE_OUTSTANDING | ERR_ROFR_WINDOW_OPEN"
    http_status: 409
    applies_to: "POST /mortgage-applications/{id}/lien-actions"

  - priority: 42
    category: business_temporal
    check: "Impact reports may only be produced at or after GrantAward.period_end; the logical clock must satisfy now >= period_end"
    error_id: ERR_REPORTING_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /grant-awards/{id}/impact-reports"

  - priority: 43
    category: business_constraint
    check: "Waitlist promotion — the eligible pool must be non-empty and READY_TO_BUILD unassigned site capacity must be >= 1; promote_count is 1..10"
    error_id: "ERR_NO_ELIGIBLE_WAITLIST_HOUSEHOLD | ERR_NO_READY_SITE_CAPACITY"
    http_status: 409
    applies_to: "POST /programs/{id}/waitlist-promotions"

  - priority: 44
    category: business_temporal
    check: "The logical clock may only move forward: to_iso8601 > current logical now"
    error_id: ERR_CLOCK_MUST_ADVANCE
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix /homeownership on every business path;
# the single test-driving endpoint lives outside the prefix under /_clock)
# =============================================================================
endpoints:

  # ---- AffiliateProgram ------------------------------------------------------
  - method: POST
    path: "/homeownership/programs"
    description: "Create an affiliate program (selection policy, hour requirement, subsidy pool)"
    roles: [ProgramAdmin]
    code: 201
    input: [affiliate_name, service_area_code, ami_median_income_cents, subsidy_pool_cents, "sweat_equity_base_hours_required?", "committee_quorum?"]
    output: AffiliateProgram
    side_effects: ["status := ACTIVE", "subsidy_committed_cents := 0, subsidy_disbursed_cents := 0, subsidy_available_cents := subsidy_pool_cents", "program_posture computed by calculations.subsidy_pool_ledger"]

  - method: GET
    path: "/homeownership/programs"
    description: "List affiliate programs"
    roles: [ProgramAdmin, FamilyServicesCoordinator, MortgageOfficer, ConstructionManager, SelectionCommitteeMember]
    code: 200
    input: ["service_area_code?", "status?", "limit?", "offset?"]
    output: AffiliateProgram[]
    side_effects: []

  - method: GET
    path: "/homeownership/programs/{id}"
    description: "Read one program with its live subsidy ledger and posture"
    roles: [ProgramAdmin, FamilyServicesCoordinator, MortgageOfficer, ConstructionManager, SelectionCommitteeMember]
    code: 200
    input: []
    output: AffiliateProgram
    side_effects: []

  - method: POST
    path: "/homeownership/programs/{id}/subsidy-pool-adjustments"
    description: "Top up / reduce the silent-second subsidy pool, or suspend / resume the program (OCC guarded)"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "delta_cents?", expected_program_version, "memo?"]
    output: AffiliateProgram
    side_effects: ["action TOP_UP / REDUCE moves subsidy_pool_cents by delta_cents", "action SUSPEND_PROGRAM sets status := SUSPENDED, RESUME_PROGRAM sets status := ACTIVE", "subsidy_available_cents and program_posture recomputed by calculations.subsidy_pool_ledger", "increments AffiliateProgram.version by 1"]

  - method: POST
    path: "/homeownership/programs/{id}/waitlist-promotions"
    description: "Run the waitlist promotion selector: ranks WAITLISTED households and promotes up to promote_count of them to SELECTED against unassigned READY_TO_BUILD site capacity"
    roles: [ProgramAdmin]
    code: 200
    input: [promote_count]
    output: ApplicantHousehold[]
    side_effects: ["each promoted household transitions WAITLISTED -> SELECTED per calculations.waitlist_promotion_selector", "increments each promoted ApplicantHousehold.version by 1", "empty eligible pool -> ERR_NO_ELIGIBLE_WAITLIST_HOUSEHOLD; zero site capacity -> ERR_NO_READY_SITE_CAPACITY"]

  # ---- ApplicantHousehold ----------------------------------------------------
  - method: POST
    path: "/homeownership/households"
    description: "Intake a new applicant household in DRAFT; the returned id is the X-User-ID the household uses as the Applicant role"
    roles: [FamilyServicesCoordinator]
    code: 201
    input: [program_id, household_name, household_size, current_bedroom_count, habitability_deficiency_count, self_reported_annual_income_cents, self_reported_housing_cost_cents, monthly_debt_payment_cents, credit_score, on_time_housing_payment_months]
    output: ApplicantHousehold
    side_effects: ["selection_status := DRAFT, partnership_readiness := NOT_READY, documentation_status := INCOMPLETE", "adult_occupant_count := 1"]

  - method: GET
    path: "/homeownership/households"
    description: "List applicant households with filters (reverse-reachability for ApplicantHousehold.program_id)"
    roles: [ProgramAdmin, FamilyServicesCoordinator, SelectionCommitteeMember, MortgageOfficer]
    code: 200
    input: ["program_id?", "selection_status?", "partnership_readiness?", "score_basis?", "limit?", "offset?"]
    output: ApplicantHousehold[]
    side_effects: []

  - method: GET
    path: "/homeownership/households/{id}"
    description: "Read one household with its scores, hour ledger totals and both state dimensions"
    roles: [ProgramAdmin, FamilyServicesCoordinator, SelectionCommitteeMember, MortgageOfficer, Applicant]
    code: 200
    input: []
    output: ApplicantHousehold
    side_effects: []

  - method: POST
    path: "/homeownership/households/{id}/submit"
    description: "Applicant submits the application (DRAFT -> SUBMITTED)"
    roles: [Applicant, FamilyServicesCoordinator]
    code: 200
    input: [attestation_signed]
    output: ApplicantHousehold
    side_effects: ["documentation_status := SUBMITTED", "adult_occupant_count recomputed from ACTIVE members", "increments ApplicantHousehold.version by 1"]

  - method: POST
    path: "/homeownership/households/{id}/screen"
    description: "Coordinator screening (SUBMITTED -> SCREENING): records verified income/housing figures and computes the PRELIMINARY score variant from the SELF-REPORTED figures"
    roles: [FamilyServicesCoordinator]
    code: 200
    input: [income_documents_received, "verified_annual_income_cents?", "verified_housing_cost_cents?", "screening_notes?"]
    output: ApplicantHousehold
    side_effects: ["verified_* written when supplied; documentation_status := VERIFIED when both are supplied and income_documents_received == true", "need_score, ability_to_pay_score, ami_pct written from calculations.household_selection_scoring variant PRELIMINARY; score_basis := PRELIMINARY", "increments ApplicantHousehold.version by 1"]

  - method: POST
    path: "/homeownership/households/{id}/committee-referral"
    description: "Refer a screened household to the selection committee (SCREENING -> COMMITTEE_REVIEW) and freeze its sweat equity requirement"
    roles: [FamilyServicesCoordinator]
    code: 200
    input: ["referral_memo?"]
    output: ApplicantHousehold
    side_effects: ["AMI band gate evaluated on the FINAL basis", "sweat_equity_required_hours frozen at min(500, base + 50 * (adult_occupant_count - 1))", "increments ApplicantHousehold.version by 1"]

  - method: POST
    path: "/homeownership/households/{id}/return-to-screening"
    description: "Send a household back for more documentation (COMMITTEE_REVIEW -> SCREENING); submitted reviews survive the loop"
    roles: [FamilyServicesCoordinator]
    code: 200
    input: [reason]
    output: ApplicantHousehold
    side_effects: ["composite_selection_score := null, willingness_score := null, score_basis := PRELIMINARY", "increments ApplicantHousehold.version by 1"]

  - method: POST
    path: "/homeownership/households/{id}/selection-decision"
    description: "Record the documented committee decision (COMMITTEE_REVIEW -> SELECTED | WAITLISTED | DENIED) after recomputing the FINAL score variant"
    roles: [ProgramAdmin]
    code: 200
    input: [decision_minutes]
    output: ApplicantHousehold
    side_effects: ["scores recomputed by calculations.household_selection_scoring variant FINAL; score_basis := FINAL", "willingness_score and composite_selection_score written from calculations.committee_quorum_and_willingness", "DENIED branch cascades partnership_readiness := WITHDRAWN, members := REMOVED and open enrollments := FAILED", "increments ApplicantHousehold.version by 1"]

  # ---- HouseholdMember -------------------------------------------------------
  - method: POST
    path: "/homeownership/household-members"
    description: "Add a household member (applicant, co-applicant, dependent, extended family, friend of family)"
    roles: [FamilyServicesCoordinator, Applicant]
    code: 201
    input: [household_id, full_name, relationship, birth_date, "is_adult_occupant?"]
    output: HouseholdMember
    side_effects: ["ApplicantHousehold.adult_occupant_count recomputed", "increments ApplicantHousehold.version by 1"]

  - method: GET
    path: "/homeownership/household-members"
    description: "List household members (reverse-reachability for HouseholdMember.household_id)"
    roles: [ProgramAdmin, FamilyServicesCoordinator, SelectionCommitteeMember, MortgageOfficer, ConstructionManager, Applicant]
    code: 200
    input: ["household_id?", "relationship?", "status?", "limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []

  - method: GET
    path: "/homeownership/household-members/{id}"
    description: "Read one household member with credited_hours_to_date"
    roles: [ProgramAdmin, FamilyServicesCoordinator, MortgageOfficer, ConstructionManager, Applicant]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []

  # ---- SelectionReview -------------------------------------------------------
  - method: POST
    path: "/homeownership/selection-reviews"
    description: "A committee member files a scored review on one dimension of a household under COMMITTEE_REVIEW"
    roles: [SelectionCommitteeMember]
    code: 201
    input: [household_id, dimension, score, recommendation, "documented_reason?"]
    output: SelectionReview
    side_effects: ["reviewer_user_id := X-User-ID", "ApplicantHousehold.willingness_score recomputed by calculations.committee_quorum_and_willingness when dimension == WILLINGNESS", "increments ApplicantHousehold.version by 1"]

  - method: GET
    path: "/homeownership/selection-reviews"
    description: "List selection reviews (reverse-reachability for SelectionReview.household_id)"
    roles: [ProgramAdmin, FamilyServicesCoordinator, SelectionCommitteeMember, MortgageOfficer]
    code: 200
    input: ["household_id?", "dimension?", "status?", "reviewer_user_id?", "limit?", "offset?"]
    output: SelectionReview[]
    side_effects: []

  - method: GET
    path: "/homeownership/selection-reviews/{id}"
    description: "Read one selection review"
    roles: [ProgramAdmin, FamilyServicesCoordinator, SelectionCommitteeMember, MortgageOfficer]
    code: 200
    input: []
    output: SelectionReview
    side_effects: []

  - method: POST
    path: "/homeownership/selection-reviews/{id}/retract"
    description: "Retract a submitted review (SUBMITTED -> RETRACTED); it leaves every quorum count and score aggregate"
    roles: [SelectionCommitteeMember]
    code: 200
    input: [retraction_reason]
    output: SelectionReview
