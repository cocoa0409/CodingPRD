# SCAFFOLD_CORNER_DESIGN.yaml - Section 1.9, Scaffold Corner Design
#
# Task: 2715 Nonprofit Merger & Affiliation
# Companion files: SCAFFOLD.yaml (S1.1-S1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml (S1.8).
#
# Breadth probe. Every instance below is a testable claim that the scaffold's
# S1.1-S1.7 surface already declares, walked section by section against
# references/claim-extraction-guide.md. Instances whose corner is already asserted
# by a S1.8 difficulty instance carry an excluded_because stub and no test_recipe.
#
# Conventions shared with S1.8:
#   * the logical clock stays at its mandatory default 2026-08-01T00:00:00Z unless a
#     recipe advances it through POST /_clock/set_current_utc;
#   * StrategyOfficer and BoardSecretary are entity_backed:Organization, so their
#     as_user_id is the party Organization id;
#   * PlatformAdmin, DiligenceLead, CharitableTrustCounsel, StateCharitiesRegulator
#     and IntegrationManager are opaque, so their as_user_id is an operator handle;
#   * every expected_restructuring_version value is derived from a prior captured read,
#     never from a bare literal.

scaffold_corner_design:
  - section: entities
    instances:
      - name: organization_create_returns_declared_fields_and_computed_monthly_expense
        claim_type: creation
        grounds:
          - entities.Organization
          - endpoints.POST_/organizations
          - calculations.combined_operating_reserve_months
        distinguishing_aspect: "A create must echo every declared field, mint the four common fields, apply the three declared defaults (restricted_corpus_cents 0, governance_seats 0, affiliation_role INDEPENDENT) and compute monthly_expense_cents = round_half_up(100000002 / 12) = 8333334 rather than truncating to 8333333."
        test_recipe:
          setup:
            - "Empty database; no Organization registered yet, so the EIN uniqueness rule cannot fire"
          setup_api_calls: []
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Organization.${org_a}.legal_name == Riverside Youth Alliance"
            - "Organization.${org_a}.ein == 11-1111111"
            - "Organization.${org_a}.state_code == CA"
            - "Organization.${org_a}.mission_code == YM-YOUTH_MENTORING"
            - "Organization.${org_a}.annual_expense_cents == 100000002"
            - "Organization.${org_a}.unrestricted_net_assets_cents == 59916670"
            - "Organization.${org_a}.monthly_expense_cents == 8333334"
            - "Organization.${org_a}.restricted_corpus_cents == 0"
            - "Organization.${org_a}.governance_seats == 0"
            - "Organization.${org_a}.affiliation_role == INDEPENDENT"
            - "Organization.${org_a}.parent_org_id == null"
            - "Organization.${org_a}.version == 1"

      - name: organization_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/organizations/{id}
          - entities.Organization.fields.monthly_expense_cents
        distinguishing_aspect: "The single-entity GET must return the persisted row unchanged, including the computed monthly_expense_cents, and must not re-derive it from a stale annual figure."
        test_recipe:
          setup:
            - "One Organization registered with annual_expense_cents 100000002"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          trigger:
            - call: "GET /organizations/${org_a}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { fetched: $.data.id, fetched_monthly: $.data.monthly_expense_cents }
          assert:
            - "HTTP status == 200"
            - "${fetched} == ${org_a}"
            - "${fetched_monthly} == 8333334"
            - "Organization.${org_a}.affiliation_role == INDEPENDENT"

      - name: restructuring_listing_filters_by_initiator_and_reports_pagination
        claim_type: listing
        grounds:
          - endpoints.GET_/restructurings
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three deals exist, two of them initiated by A. Filtering on initiator_org_id must return exactly those two with total_count 2 and has_more false, which separates a real filter from a client-side slice of the whole table."
        test_recipe:
          setup:
            - "Three Organizations A, B and C"
            - "Three Restructurings: A to B, A to C and B to C, all in EXPLORATORY"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Delta Youth Partners", ein: "55-5555555", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_c: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal1: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_c}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal2: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_b}", target_org_id: "${org_c}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
              captures: { deal3: $.data.id }
          trigger:
            - call: "GET /restructurings"
              payload: { initiator_org_id: "${org_a}", limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "the response data array holds exactly 2 rows"
            - "total_count == 2"
            - "has_more == false"
            - "the returned ids are exactly ${deal1} and ${deal2}"
            - "${deal3} is absent from the response"

      - name: restricted_fund_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_9_ERR_RESTRICTED_FUND_NOT_FOUND
          - endpoints.GET_/restricted-funds/{id}
        distinguishing_aspect: "A syntactically valid UUID that names no RestrictedFund must produce ERR_RESTRICTED_FUND_NOT_FOUND at 404, not a 500 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no RestrictedFund has ever been registered"
          setup_api_calls: []
          trigger:
            - call: "GET /restricted-funds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_RESTRICTED_FUND_NOT_FOUND"
            - "the response envelope response_type == error"
            - "message is present and non-blank"

      - name: letter_of_intent_create_missing_required_exclusivity_days_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - endpoints.POST_/letters-of-intent
        distinguishing_aspect: "exclusivity_days carries no default, so omitting it must fail at priority 3 before any exclusivity or seat-split business rule is consulted - the response must be 400 ERR_INVALID_REQUEST, never 409 or 422."
        test_recipe:
          setup:
            - "A Restructuring in RATIONALE_BUILT with a SCREENING assessment recorded, so the create would otherwise be legal"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
          trigger:
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Restructuring.${deal}.status == RATIONALE_BUILT"
            - "Restructuring.${deal}.version == ${rv_a}"

      - name: restructuring_confidentiality_tier_defaults_to_standard_when_omitted
        claim_type: defaults
        grounds:
          - entities.Restructuring.fields.confidentiality_tier
          - endpoints.POST_/restructurings
        distinguishing_aspect: "confidentiality_tier is the only optional input on the create and declares default STANDARD; omitting it must persist STANDARD rather than null, and every other system default (status EXPLORATORY, round_no 1, reserved_seat_pool 0, restricted_asset_posture NOT_ASSESSED) must also be applied."
        test_recipe:
          setup:
            - "Two Organizations both incorporated in CA, so ag_review_required computes to true at creation"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
          trigger:
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
          assert:
            - "Restructuring.${deal}.confidentiality_tier == STANDARD"
            - "Restructuring.${deal}.status == EXPLORATORY"
            - "Restructuring.${deal}.round_no == 1"
            - "Restructuring.${deal}.combined_board_seats == 0"
            - "Restructuring.${deal}.reserved_seat_pool == 0"
            - "Restructuring.${deal}.unrestricted_transfer_value_cents == 0"
            - "Restructuring.${deal}.unresolved_restricted_fund_count == 0"
            - "Restructuring.${deal}.restricted_asset_posture == NOT_ASSESSED"
            - "Restructuring.${deal}.ag_review_required == true"
            - "Restructuring.${deal}.structure_type == null"
            - "Restructuring.${deal}.version == 1"

      - name: alignment_assessment_computed_fields_are_derived_from_stored_data
        claim_type: computed_fields
        grounds:
          - entities.AlignmentAssessment.fields.sequence_no
          - entities.AlignmentAssessment.fields.included_program_count
          - entities.AlignmentAssessment.fields.overlap_pair_count
          - calculations.mission_program_alignment_score
        distinguishing_aspect: "Every field of the assessment except restructuring_id and variant is computed. With one program per party sharing service_category and county_code the derived tuple is fully determined: sequence_no 1, included_program_count 2, overlap_pair_count 1, program_overlap_index 1.0000 and therefore program_overlap_points 0.00 at the far side of the non-linear peak."
        test_recipe:
          setup:
            - "Two Organizations with identical mission_code and annual_expense_cents 100000002, unrestricted 59916670 and 40000000"
            - "Exactly one Program per party, both YOUTH_MENTORING in CA-ALAMEDA, so overlap_pair_count is 1 over a denominator of 1"
            - "A Restructuring in EXPLORATORY and no DiligenceRequest, so the SCREENING variant sees zero open exposure"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "Peer Mentoring East", service_category: "YOUTH_MENTORING", county_code: "CA-ALAMEDA", annual_expense_cents: 40000000, clients_served: 900 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { prog_a1: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "Peer Mentoring West", service_category: "YOUTH_MENTORING", county_code: "CA-ALAMEDA", annual_expense_cents: 35000000, clients_served: 700 }
              as: StrategyOfficer
              as_user_id: "${org_b}"
              captures: { prog_b1: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
          trigger:
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { scr: $.data.id }
          assert:
            - "AlignmentAssessment.${scr}.sequence_no == 1"
            - "AlignmentAssessment.${scr}.included_program_count == 2"
            - "AlignmentAssessment.${scr}.overlap_pair_count == 1"
            - "AlignmentAssessment.${scr}.program_overlap_index == 1.0000"
            - "AlignmentAssessment.${scr}.program_overlap_points == 0.00"
            - "AlignmentAssessment.${scr}.mission_alignment_points == 40.00"
            - "AlignmentAssessment.${scr}.open_diligence_exposure_cents == 0"
            - "AlignmentAssessment.${scr}.available_unrestricted_cents == 99916670"
            - "AlignmentAssessment.${scr}.combined_monthly_expense_cents == 16666668"
            - "AlignmentAssessment.${scr}.reserve_months == 5.99"
            - "AlignmentAssessment.${scr}.sustainability_points == 20.00"
            - "AlignmentAssessment.${scr}.composite_score == 60.00"
            - "AlignmentAssessment.${scr}.composite_rating == MODERATE"
            - "Program.${prog_a1}.continuity_status == ACTIVE"
            - "Program.${prog_b1}.continuity_status == ACTIVE"

      - name: board_approval_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.BoardApproval.fields.status
          - entities.BoardApproval.fields.eligible_seats
          - calculations.board_vote_outcome
          - complexity_profile.entity_topology
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server and version starts at exactly 1; the tally fields are derived from the request rather than accepted from it - eligible_seats 14, quorum_required 7, votes_cast 14, approval_ratio 0.7143, required_ratio 0.6667 keyed off the deal structure_type MERGER, decision APPROVED and initial status RECORDED."
        test_recipe:
          setup:
            - "A Restructuring in STRUCTURE_SELECTED with structure_type MERGER, so required_ratio resolves to 0.6667"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "${deal}", workstream: "FINANCE", severity: "HIGH", summary: "Unreconciled pledge receivable", exposure_cents: 29916670 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { finding: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "DILIGENCE_ADJUSTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/respond"
              payload: { response_ref: "RESP-0001" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/clear"
              payload: { clearance_note: "Reconciled against audited schedule" }
              as: DiligenceLead
              as_user_id: "dl-002"
            - call: "POST /restructurings/${deal}/select-structure"
              payload: { structure_type: "MERGER", unrestricted_transfer_value_cents: 200000000 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { rv_b: $.data.version }
          trigger:
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_b}", approving_party: "INITIATOR", seats_total: 15, recusals: 1, votes_for: 10, votes_against: 4, abstentions: 0, conflict_disclosures_count: 1, recording_secretary_ref: "SEC-A-1" }
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { ba_i: $.data.id }
          assert:
            - "HTTP status == 201"
            - "BoardApproval.${ba_i}.version == 1"
            - "BoardApproval.${ba_i}.status == RECORDED"
            - "BoardApproval.${ba_i}.eligible_seats == 14"
            - "BoardApproval.${ba_i}.quorum_required == 7"
            - "BoardApproval.${ba_i}.votes_cast == 14"
            - "BoardApproval.${ba_i}.approval_ratio == 0.7143"
            - "BoardApproval.${ba_i}.required_ratio == 0.6667"
            - "BoardApproval.${ba_i}.decision == APPROVED"
            - "BoardApproval.${ba_i}.allocated_seats == 0"
            - "BoardApproval.${ba_i}.certifying_secretary_ref == null"
            - "Restructuring.${deal}.status == BOARD_APPROVAL"

      - name: program_service_category_outside_the_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Program.fields.service_category
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "service_category is a closed enum of six values; a plausible but undeclared value such as LEGAL_AID must be rejected at 400 rather than stored and silently excluded from the overlap pairing later."
        test_recipe:
          setup:
            - "One Organization registered"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "Tenant Legal Clinic", service_category: "LEGAL_AID", county_code: "CA-ALAMEDA", annual_expense_cents: 40000000, clients_served: 300 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Program row exists for ${org_a}"

      - name: alignment_assessment_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.AlignmentAssessment
          - endpoints.GET_/restructurings/{id}/alignment-assessments
        distinguishing_aspect: "AlignmentAssessment declares common_fields false, so it carries id and created_at only - no version, no updated_at - and S1.5 exposes no mutating endpoint for it. Two SCREENING snapshots taken across a financial restatement must both persist unchanged with sequence_no 1 and 2, proving the earlier snapshot was not rewritten."
        test_recipe:
          setup:
            - "Two Organizations and a Restructuring in EXPLORATORY"
            - "One SCREENING assessment already taken at the original financial figures"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { scr1: $.data.id }
          trigger:
            - call: "POST /organizations/${org_a}/financial-restatement"
              payload: { annual_expense_cents: 600000000, unrestricted_net_assets_cents: 10000000, restatement_reason: "Audited figures superseded the draft" }
              as: PlatformAdmin
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { scr2: $.data.id }
          assert:
