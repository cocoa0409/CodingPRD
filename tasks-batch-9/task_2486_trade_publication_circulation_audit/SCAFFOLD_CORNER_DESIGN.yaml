      - name: reconciliation_discrepancy_exactly_at_materiality_forces_restatement
        claim_type: threshold
        grounds:
          - calculations.statement_reconciliation_discrepancy
          - entities.Publication.fields.materiality_pct
          - state_machines.CirculationStatement.UNDER_AUDIT_to_RESTATEMENT_REQUIRED
        distinguishing_aspect: "The materiality test is `>=`, not `>`: 24 copies of 1200 is exactly 2.00 percent, which must force RESTATEMENT_REQUIRED rather than clearing the audit, and the percentage must be computed against the DECLARED total, not the verified one."
        test_recipe:
          setup:
            - "publication with materiality_pct 2.00, all three rules and one qualified 1200-copy PAID recipient"
            - "clock at 2026-10-01 with a FILED statement for [2026-07-01, 2026-09-01) declaring 1200 copies"
            - "an audit engagement with sample_size 1 whose single verification records 1176 copies"
          setup_api_calls:
