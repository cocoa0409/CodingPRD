              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "A2 core offload", planned_start_offset_hours: 100, planned_duration_hours: 150, predecessor_activity_id: "${a1_id}" }
              as: OutagePlanner
              captures: { a2_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
