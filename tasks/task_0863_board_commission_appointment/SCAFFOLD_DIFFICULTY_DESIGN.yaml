scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attendance_provisional_vs_final_diverge
        grounds:
          - calculations.attendance_rate
          - entities.Term.fields.provisional_attendance_rate
          - entities.Term.fields.final_attendance_rate
        distinguishing_aspect: "On the SAME Term (1 PRESENT + 1 EXCUSED), the provisional variant excludes EXCUSED (denom=1 -> 100.0) while the final variant includes it (denom=2 -> 50.0); domain is Term attendance."
        test_recipe:
          setup:
            - "Board (quorum 3), one AT_LARGE seat (residency NONE), one applicant seated ACTIVE via nominate+confirm, two HELD meetings, member recorded PRESENT at meeting1 and EXCUSED at meeting2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoardClerk
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", s1v: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "POST /civic/appointments/${appt1}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { appointment_id: "${appt1}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
            - call: "POST /civic/meetings"
              payload: { board_id: "${b1}", scheduled_date: "2026-06-02T00:00:00Z" }
              as: BoardClerk
              captures: { m1: "$.data.id" }
            - call: "POST /civic/meetings/${m1}/post-notice"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/meetings/${m1}/hold"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/meetings"
              payload: { board_id: "${b1}", scheduled_date: "2026-06-03T00:00:00Z" }
              as: BoardClerk
              captures: { m2: "$.data.id" }
            - call: "POST /civic/meetings/${m2}/post-notice"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/meetings/${m2}/hold"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/attendance"
              payload: { term_id: "${t1}", meeting_id: "${m1}", presence: "PRESENT" }
              as: BoardClerk
            - call: "POST /civic/attendance"
              payload: { term_id: "${t1}", meeting_id: "${m2}", presence: "EXCUSED" }
              as: BoardClerk
          trigger:
            - call: "GET /civic/terms/${t1}"
              payload: {}
              as: BoardClerk
              captures: { prov: "$.data.provisional_attendance_rate", fin: "$.data.final_attendance_rate" }
          assert:
            - "Term.${t1}.provisional_attendance_rate == 100.0"
            - "Term.${t1}.final_attendance_rate == 50.0"

      - name: tenure_consecutive_vs_cumulative_diverge
        grounds:
          - calculations.tenure_measurement
          - entities.ReappointmentRequest.fields.consecutive_terms_at_request
          - entities.ReappointmentRequest.fields.cumulative_years_at_request
          - state_machines.ReappointmentRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: "From identical two-term history (2014-2018 and 2022-2026, a gap between), the consecutive variant resets to 1 across the gap while the cumulative variant sums both nominal terms to 8.01 years; domain is Applicant tenure (distinct from Term attendance)."
        test_recipe:
          setup:
            - "Board (max_consecutive_terms 2, max_cumulative_years 12); applicant Ada seated on seat A term [2014-01-01,2018-01-01) then expired to HOLDOVER, and on seat B term [2022-01-01,2026-01-01) still ACTIVE; a reappointment request opened against the seat A holdover term."
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { sa: "$.data.id", sav: "$.data.version" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 2, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { sb: "$.data.id", sbv: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${sa}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { va: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${va}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { appA: "$.data.id" }
            - call: "POST /civic/applications/${appA}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${appA}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${appA}", seat_id: "${sa}", term_start_date: "2014-01-01T00:00:00Z", expected_seat_version: "${sav}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { aptA: "$.data.id" }
            - call: "POST /civic/appointments/${aptA}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { seat_id: "${sa}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${sb}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { vb: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${vb}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { appB: "$.data.id" }
            - call: "POST /civic/applications/${appB}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${appB}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${appB}", seat_id: "${sb}", term_start_date: "2022-01-01T00:00:00Z", expected_seat_version: "${sbv}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { aptB: "$.data.id" }
            - call: "POST /civic/appointments/${aptB}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "POST /civic/terms/${t1}/expire"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/reappointments"
              payload: { term_id: "${t1}", seat_id: "${sa}", applicant_id: "${ap1}", requested_term_start: "2027-01-01T00:00:00Z" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { rr: "$.data.id" }
          trigger:
            - call: "POST /civic/reappointments/${rr}/decide"
              payload: { approve: true }
              as: ConfirmingMember
              as_user_id: "cm-1"
              captures: { cons: "$.data.consecutive_terms_at_request", cum: "$.data.cumulative_years_at_request" }
          assert:
            - "ReappointmentRequest.${rr}.consecutive_terms_at_request == 1"
            - "ReappointmentRequest.${rr}.cumulative_years_at_request == 8.01"
            - "ReappointmentRequest.${rr}.status == APPROVED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: holdover_term_end_min_over_ceiling_mode_a
        grounds:
          - calculations.term_expiry_resolution
          - state_machines.Term.ACTIVE_to_HOLDOVER
          - entities.Term.fields.term_end_date
        distinguishing_aspect: "Mode (a): resolved holdover end = max(min(successor_start_or_ceiling, ceiling), scheduled_end) with a conditional branch on successor existence; with no successor and 90-day ceiling, end extends from 2030-06-01 to 2030-08-30."
        test_recipe:
          setup:
            - "Board (term_length_months 48, max_holdover_days 90); one seated ACTIVE term starting 2026-06-01 (nominal end 2030-06-01); no successor; clock advanced past nominal end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoardClerk
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", s1v: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "POST /civic/appointments/${appt1}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { seat_id: "${s1}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-07-01T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /civic/terms/${t1}/expire"
              payload: {}
              as: BoardClerk
              captures: { st: "$.data.status", te: "$.data.term_end_date" }
          assert:
            - "Term.${t1}.status == HOLDOVER"
            - "Term.${t1}.is_holdover == true"
            - "Term.${t1}.term_end_date == 2030-08-30T00:00:00Z"

      - name: board_attendance_index_round_once_mode_b
        grounds:
          - calculations.board_attendance_index
          - calculations.attendance_rate
        distinguishing_aspect: "Mode (b): pinned rounding order averages EXACT per-member final rates (66.6667 and 50.0) then rounds once to 58.3; rounding each member first would give 58.4."
        test_recipe:
          setup:
            - "Board with two ACTIVE members: member1 present2/absent1 (exact 66.6667), member2 present1/absent1 (exact 50.0), across shared HELD meetings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoardClerk
            - call: "POST /civic/boards"
