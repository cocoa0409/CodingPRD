scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: response_vs_handle_time_diverge_on_incident
        grounds:
          - calculations.response_time_dispatch_based
          - calculations.handle_time_call_receipt_based
          - entities.Incident.fields.response_time_seconds
          - entities.Incident.fields.total_handle_seconds
        distinguishing_aspect: |
          Two clock anchors on the same onscene event produce different numbers on the Incident
          (cost/time domain): response_time_seconds starts at first_dispatch_at (390s) while
          total_handle_seconds starts at received_at (540s); they differ by the 150s queue delay.
        test_recipe:
          setup:
            - "One EMS Agency (response_sla_seconds=480), one Station, one AVAILABLE MEDIC_ALS Unit at the ALI grid."
            - "Incident MEDICAL_EMERGENCY received at 08:00:00; dispatched at 08:02:30; unit goes ONSCENE at 08:09:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS One", discipline: "EMS", response_sla_seconds: 480 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "Medic Base", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "M1", capability: "MEDIC_ALS", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550001", ali_grid_x: 10, ali_grid_y: 10, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:02:30Z" }
              as: SystemClock
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:09:00Z" }
              as: SystemClock
          trigger:
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
          assert:
            - "Incident.${inc_id}.response_time_seconds == 390"
            - "Incident.${inc_id}.total_handle_seconds == 540"
            - "Incident.${inc_id}.response_time_seconds != Incident.${inc_id}.total_handle_seconds"

      - name: recommendation_primary_vs_mutual_aid_pass
        grounds:
          - calculations.nearest_unit_recommendation
          - state_machines.Agency.ONLINE_to_MUTUAL_AID_ONLY
          - entities.Unit.fields.agency_id
          - entities.Agency.fields.status
        distinguishing_aspect: |
          On the Unit/Agency pool domain the same incident yields a DIFFERENT recommended unit
          depending on the candidate-pass variant: primary pass (ONLINE agencies only) recommends
          the nearer in-jurisdiction unit; mutual-aid fallback pass (agency MUTUAL_AID_ONLY) is
          only consulted when the primary pass is empty and then recommends the farther mutual-aid unit.
        test_recipe:
          setup:
            - "POLICE Agency A ONLINE with one PATROL unit at distance 2 from ALI; POLICE Agency B with one PATROL unit at distance 9."
            - "Incident ASSAULT_IN_PROGRESS at grid (50,50). Primary pass recommends A's near unit."
            - "Agency A then set MUTUAL_AID_ONLY and its unit dispatched elsewhere so primary pass empties; mutual-aid pass recommends B's unit."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "PD A", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pdA_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "PD B", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pdB_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pdA_id}", name: "A House", grid_x: 52, grid_y: 50 }
              as: Supervisor
              captures: { stnA_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pdB_id}", name: "B House", grid_x: 59, grid_y: 50 }
              as: Supervisor
              captures: { stnB_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pdA_id}", station_id: "${stnA_id}", call_sign: "A1", capability: "PATROL", grid_x: 52, grid_y: 50 }
              as: Supervisor
              captures: { unitA_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pdB_id}", station_id: "${stnB_id}", call_sign: "B1", capability: "PATROL", grid_x: 59, grid_y: 50 }
              as: Supervisor
              captures: { unitB_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550010", ali_grid_x: 50, ali_grid_y: 50, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
          trigger:
            - call: "GET /incidents/${inc_id}/recommendation"
              payload: { discipline: "POLICE" }
              as: Dispatcher
              captures: { primary_rec: $.data.recommended_unit_id }
            - call: "PATCH /agencies/${pdA_id}/status"
              payload: { status: "MUTUAL_AID_ONLY" }
              as: Supervisor
            - call: "GET /incidents/${inc_id}/recommendation"
              payload: { discipline: "POLICE" }
              as: Dispatcher
              captures: { fallback_rec: $.data.recommended_unit_id }
          assert:
            - "primary_rec == ${unitA_id} (distance 2, ONLINE primary pass)"
            - "fallback_rec == ${unitB_id} (distance 9, mutual-aid pass after primary empties)"
            - "primary_rec != fallback_rec"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_clamp_order_premise_then_confidence
        grounds:
          - calculations.effective_priority_at_intake
          - entities.Incident.fields.priority_level
          - entities.Incident.fields.base_priority_level
          - entities.PremiseAlert.fields.min_priority_floor
        distinguishing_aspect: |
          Mode (c) pinned-evaluation-order: priority_level is a fixed 4-step pipeline where the
          premise clamp (min(base, floor)) is applied BEFORE the ali_confidence clamp (min(., 2));
          ALARM base=4 with no premise alert but ali_confidence=UNKNOWN yields priority_level==2
          (confidence clamp), proving Step4 runs after Step1-3 in the pinned order.
        test_recipe:
          setup:
            - "No premise alert at grid (300,300)."
            - "Incident ALARM intake at (300,300) with ali_confidence=UNKNOWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemClock
          trigger:
            - call: "POST /incidents"
              payload: { ani: "5125550020", ali_grid_x: 300, ali_grid_y: 300, incident_type: "ALARM", ali_confidence: "UNKNOWN" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.base_priority_level == 4"
            - "Incident.${inc_id}.priority_level == 2"
            - "Incident.${inc_id}.premise_alert_id == null"

      - name: governing_sla_nested_aggregate_selection
        grounds:
          - calculations.sla_breach_evaluation
          - calculations.handle_time_call_receipt_based
          - entities.Agency.fields.response_sla_seconds
          - entities.Incident.fields.sla_breached
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: governing_sla = max over the required-discipline
          agencies that actually have a non-CANCELLED assignment (a conditional aggregate selection),
          then sla_breached = handle > governing_sla; with a FIRE agency sla=600 and an EMS agency
          sla=480 both assigned to a STRUCTURE_FIRE incident, the governing SLA is max(600,480)=600
          and handle=540 yields sla_breached==false — a result that flips if the EMS-only 480 were used.
        test_recipe:
          setup:
            - "FIRE Agency sla=600 with one ENGINE unit; EMS Agency sla=480 with one MEDIC_ALS unit; both at ALI grid."
            - "STRUCTURE_FIRE incident (required [FIRE,EMS]); received 08:00:00; both units dispatched 08:01:00; engine ONSCENE 08:09:00 (handle 540)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "Fire Co", discipline: "FIRE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { fire_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "EMS Co", discipline: "EMS", response_sla_seconds: 480 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${fire_id}", name: "FH1", grid_x: 70, grid_y: 70 }
              as: Supervisor
              captures: { fstn_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "EH1", grid_x: 70, grid_y: 70 }
              as: Supervisor
              captures: { estn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${fire_id}", station_id: "${fstn_id}", call_sign: "E7", capability: "ENGINE", grid_x: 70, grid_y: 70 }
              as: Supervisor
              captures: { eng_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${estn_id}", call_sign: "M7", capability: "MEDIC_ALS", grid_x: 70, grid_y: 70 }
              as: Supervisor
              captures: { med_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550030", ali_grid_x: 70, ali_grid_y: 70, incident_type: "STRUCTURE_FIRE" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:01:00Z" }
              as: SystemClock
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v0}", unit_id: "${eng_id}" }
              as: Dispatcher
              captures: { asg_eng: $.data.id }
            - call: "GET /incidents/${inc_id}"
              payload: {}
              as: Dispatcher
              captures: { inc_v_after_eng: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v_after_eng}", unit_id: "${med_id}" }
              as: Dispatcher
              captures: { asg_med: $.data.id }
            - call: "PATCH /assignments/${asg_eng}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:09:00Z" }
              as: SystemClock
          trigger:
            - call: "PATCH /assignments/${asg_eng}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${eng_id}"
          assert:
            - "Incident.${inc_id}.total_handle_seconds == 540"
            - "Incident.${inc_id}.sla_breached == false"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_onscene_revert_to_enroute_cycle
        grounds:
          - state_machines.Assignment.ONSCENE_to_ENROUTE
          - state_machines.Assignment.ENROUTE_to_ONSCENE
          - entities.Assignment.fields.status
          - entities.Assignment.fields.onscene_at
        distinguishing_aspect: |
          Assignment has a cycle ENROUTE->ONSCENE->ENROUTE: a unit pulled off scene reverts to
          ENROUTE (onscene_at cleared, Unit.status->ENROUTE) yet the incident stays ACTIVE — the
          re-stage loops the assignment dimension without undoing the incident bubble-up.
        test_recipe:
          setup:
            - "EMS agency, MEDIC_ALS unit, MEDICAL_EMERGENCY incident dispatched; assignment driven ENROUTE then ONSCENE (incident -> ACTIVE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Cyc", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "ECyc", grid_x: 20, grid_y: 20 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MC1", capability: "MEDIC_ALS", grid_x: 20, grid_y: 20 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550040", ali_grid_x: 20, ali_grid_y: 20, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
          trigger:
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
          assert:
            - "Assignment.${asg_id}.status == ENROUTE"
            - "Assignment.${asg_id}.onscene_at == null"
            - "Unit.${unit_id}.status == ENROUTE"
            - "Incident.${inc_id}.lifecycle_status == ACTIVE"

      - name: incident_priority_cyclic_escalation_parallel_dimension
        grounds:
          - state_machines.Incident.priority_level.N_to_Nminus1
          - state_machines.Incident.lifecycle_status.PENDING_to_DISPATCHED
          - entities.Incident.fields.priority_level
          - entities.Incident.fields.escalation_count
        distinguishing_aspect: |
          Incident carries a parallel/cyclic priority dimension distinct from Assignment: priority_level
          ratchets 4->3->2 across repeated escalate calls (escalation_count grows) while the lifecycle_status
          dimension stays PENDING — two independent state axes on one Incident row.
        test_recipe:
          setup:
            - "ALARM incident (base priority 4) at a grid with no premise alert, never dispatched (lifecycle stays PENDING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125550050", ali_grid_x: 400, ali_grid_y: 400, incident_type: "ALARM" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/escalate"
              payload: { reason: "no_unit_yet" }
              as: Supervisor
            - call: "POST /incidents/${inc_id}/escalate"
              payload: { reason: "no_unit_yet" }
              as: Supervisor
          assert:
            - "Incident.${inc_id}.priority_level == 2"
            - "Incident.${inc_id}.escalation_count == 2"
            - "Incident.${inc_id}.lifecycle_status == PENDING"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_cascades_assignment_then_unit_depth3
        grounds:
          - state_machines.Incident.lifecycle_status.ACTIVE_to_CLOSED
          - state_machines.Assignment.ONSCENE_to_CLEARED
          - entities.Unit.fields.status
          - entities.Unit.fields.active_incident_id
        distinguishing_aspect: |
          Depth-3 cascade from disposition close: POST dispositions mutates Incident (->CLOSED),
          which forces each non-terminal Assignment ONSCENE->CLEARED, which in turn frees the bound
          Unit (status->AVAILABLE, active_incident_id cleared). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "EMS agency + MEDIC_ALS unit; MEDICAL_EMERGENCY incident dispatched and driven to ONSCENE (assignment ONSCENE, incident ACTIVE, unit ONSCENE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T10:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Casc", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "ECa", grid_x: 30, grid_y: 30 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MD1", capability: "MEDIC_ALS", grid_x: 30, grid_y: 30 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550060", ali_grid_x: 30, ali_grid_y: 30, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
          trigger:
            - call: "POST /incidents/${inc_id}/dispositions"
              payload: { disposition_code: "TRANSPORT", narrative: "Patient transported" }
              as: Supervisor
          assert:
            - "Incident.${inc_id}.lifecycle_status == CLOSED"
            - "Assignment.${asg_id}.status == CLEARED"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.active_incident_id == null"

      - name: cancel_only_assignment_reverts_incident_depth2
        grounds:
          - state_machines.Assignment.DISPATCHED_to_CANCELLED
          - state_machines.Incident.lifecycle_status.PENDING_to_DISPATCHED
          - entities.Incident.fields.first_dispatch_at
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (assignment CANCEL, not incident close):
          cancelling the sole pre-onscene DISPATCHED assignment frees the Unit (status->AVAILABLE)
          which then reverts the Incident DISPATCHED->PENDING and clears first_dispatch_at.
        test_recipe:
          setup:
            - "POLICE agency + PATROL unit; ASSAULT incident dispatched (single DISPATCHED assignment, incident DISPATCHED, first_dispatch_at set), never went ONSCENE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T11:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Rev", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PRev", grid_x: 40, grid_y: 40 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "P9", capability: "PATROL", grid_x: 40, grid_y: 40 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550070", ali_grid_x: 40, ali_grid_y: 40, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
          trigger:
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "CANCEL" }
              as: Dispatcher
          assert:
            - "Assignment.${asg_id}.status == CANCELLED"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Incident.${inc_id}.lifecycle_status == PENDING"
            - "Incident.${inc_id}.first_dispatch_at == null"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: held_beats_discipline_mismatch
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_INCIDENT_HELD]
          - errors[ERR_DISCIPLINE_MISMATCH]
        distinguishing_aspect: |
          state (priority 8, ERR_INCIDENT_HELD) outranks business_safety (priority 9,
          ERR_DISCIPLINE_MISMATCH): assigning a wrong-discipline unit to a HELD incident returns
          ERR_INCIDENT_HELD, proving the state check precedes the discipline check.
        test_recipe:
          setup:
            - "EMS incident driven to ACTIVE then HELD; a POLICE (wrong-discipline) AVAILABLE unit exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T12:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS H", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "PD H", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "EHs", grid_x: 15, grid_y: 15 }
              as: Supervisor
              captures: { estn_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PHs", grid_x: 15, grid_y: 15 }
              as: Supervisor
              captures: { pstn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${estn_id}", call_sign: "MH1", capability: "MEDIC_ALS", grid_x: 15, grid_y: 15 }
              as: Supervisor
              captures: { med_id: $.data.id }
            - call: "POST /units"
