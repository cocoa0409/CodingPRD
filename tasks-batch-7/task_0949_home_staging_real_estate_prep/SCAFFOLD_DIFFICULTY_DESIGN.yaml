              payload: {}
              as: WarehouseManager
          assert:
            - "DamageAssessment.${as_missing}.depreciated_replacement_value == 840.00"
            - "DamageAssessment.${as_missing}.disposition == REPLACE"
            - "DamageAssessment.${as_missing}.charge_amount == 840.00"
