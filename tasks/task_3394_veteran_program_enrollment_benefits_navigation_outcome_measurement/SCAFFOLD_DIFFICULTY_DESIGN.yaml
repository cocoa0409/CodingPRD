              captures: { sv2: "$.data[0].id", sv2_status: "$.data[0].status" }
            - call: "POST /veteran-services/surveys/${sv2}/submit"
              payload: { q1: 4, q2: 4, q3: 4, q4: 4, q5: 4 }
              as: ProgramMember
              as_user_id: "${m2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "sv1_status == SUBMITTED and sv1_score == 80 — submission at exactly window_close_at succeeds (inclusive bound)"
            - "sv2_status == EXPIRED after the clock moved to 2026-10-31T00:00:01Z (one second past close)"
            - "err == ERR_INVALID_STATE with status 409"
            - "OutcomeSurvey.${sv2}.wellbeing_score remains null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_member_verified
        grounds:
          - validations[priority=7]
          - state_machines.Member.verification_status
          - errors.ERR_MEMBER_NOT_VERIFIED
        distinguishing_aspect: |
          Entity pair Enrollment <- Member: enrollment creation is gated on the MEMBER's
          verification_status. The other instance (appeal_requires_claim_decided) gates
          Appeal creation on a BenefitsClaim's state — a different pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. MENTAL_HEALTH track capacity 5. One member, initially UNVERIFIED."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 5 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Gate Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
          trigger:
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { err1: "$.data.error_id" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
          assert:
            - "err1 == ERR_MEMBER_NOT_VERIFIED with status 409 while verification_status == UNVERIFIED"
            - "GET /veteran-services/enrollments?member_id=${m_id} returned 0 rows after the rejected attempt"
            - "after the case decision, the identical enrollment request returns 201 with status INTAKE"
            - "Enrollment.${e_id} exists and ProgramTrack.active_enrollment_count == 1"

      - name: appeal_requires_claim_decided
        grounds:
          - state_machines.BenefitsClaim.DECIDED_to_APPEAL_PENDING
          - validations[priority=7]
          - errors.ERR_CLAIM_NOT_APPEALABLE
        distinguishing_aspect: |
          Entity pair Appeal <- BenefitsClaim: appeal creation is gated on the CLAIM being
          DECIDED. The other instance gates Enrollment on Member — a different pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with a FILED disability claim (no decision yet)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Appeal Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "COAST_GUARD" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 40, dependent_count: 1 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/appeals"
              payload: { claim_id: "${claim_id}", grounds: "premature" }
              as: AccreditedRepresentative
              captures: { err: "$.data.error_id" }
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 40 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
            - call: "POST /veteran-services/appeals"
              payload: { claim_id: "${claim_id}", grounds: "rating too low" }
              as: AccreditedRepresentative
              captures: { ap_id: "$.data.id" }
          assert:
            - "err == ERR_CLAIM_NOT_APPEALABLE with status 409 while the claim is FILED"
            - "after the decision, appeal creation returns 201 and Appeal.${ap_id}.status == OPEN"
            - "BenefitsClaim.${claim_id}.status == APPEAL_PENDING after the successful appeal"
            - "GET /veteran-services/claims/${claim_id}/appeals returns exactly 1 row"

  - rule_id: resource_temporal_overlap
    instances:
      - name: event_schedule_half_open_adjacency
        grounds:
          - calculations.event_schedule_overlap
          - errors.ERR_EVENT_SCHEDULE_CONFLICT
          - entities.EventRegistration.fields.status
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the member's event schedule (resource:
          EventRegistration/CommunityEvent): an event starting exactly when another ends
          does NOT conflict, but one starting one second earlier does. The other instance
          (referral_window_closed_buffered) uses closed semantics plus a recovery buffer
          on Referral — different arithmetic, different resource.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Three events on 2026-10-15: E1 10:00-12:00, E2 12:00-14:00, E3 11:59:59-13:00. One member (events need no verification)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/community-events"
              payload: { name: "E1 Morning", starts_at: "2026-10-15T10:00:00Z", ends_at: "2026-10-15T12:00:00Z", capacity: 5, accessibility_seat_count: 0, travel_budget_cents: 0 }
              as: EventCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /veteran-services/community-events"
              payload: { name: "E2 Afternoon", starts_at: "2026-10-15T12:00:00Z", ends_at: "2026-10-15T14:00:00Z", capacity: 5, accessibility_seat_count: 0, travel_budget_cents: 0 }
              as: EventCoordinator
              captures: { e2: "$.data.id" }
            - call: "POST /veteran-services/community-events"
              payload: { name: "E3 Overlapper", starts_at: "2026-10-15T11:59:59Z", ends_at: "2026-10-15T13:00:00Z", capacity: 5, accessibility_seat_count: 0, travel_budget_cents: 0 }
              as: EventCoordinator
              captures: { e3: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Busy Member", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m_id}", community_event_id: "${e1}" }
              as: EventCoordinator
              captures: { r1: "$.data.id", r1_status: "$.data.status" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m_id}", community_event_id: "${e2}" }
              as: EventCoordinator
              captures: { r2: "$.data.id", r2_status: "$.data.status" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m_id}", community_event_id: "${e3}" }
              as: EventCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "r1_status == CONFIRMED"
            - "r2_status == CONFIRMED — E2 starts exactly at E1's ends_at, and half-open [starts_at, ends_at) semantics admit adjacency"
            - "err == ERR_EVENT_SCHEDULE_CONFLICT with status 409 — E3 starts one second before E1 ends"
            - "GET /veteran-services/event-registrations?member_id=${m_id} returns exactly 2 rows"

      - name: referral_window_closed_buffered
        grounds:
          - calculations.treatment_window_overlap
          - errors.ERR_TREATMENT_WINDOW_CONFLICT
          - concurrency_rules[referral-create-stale-member]
        distinguishing_aspect: |
          CLOSED interval semantics extended by a 7-day recovery buffer on the member's
          treatment plan (resource: Referral): a new referral starting exactly on the prior
          window's buffered end (2026-11-17) conflicts, while 2026-11-18 is clear. The other
          instance (event_schedule_half_open_adjacency) uses half-open semantics on events.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with an ACTIVE MENTAL_HEALTH enrollment at intensity_tier INTENSIVE (acuity 100). Referral ref1 occupies [2026-10-01, 2026-11-10] (buffered to 2026-11-17T00:00:00Z inclusive)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Ref Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 10, phys_score: 10, voc_score: 10, soc_score: 10 }
              as: IntakeCoordinator
            - call: "GET /veteran-services/members/${m_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { m_v1: "$.data.version" }
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-10-01T00:00:00Z", treatment_end: "2026-11-10T00:00:00Z", expected_member_version: "${m_v1}" }
              as: IntakeCoordinator
              captures: { ref1: "$.data.id" }
            - call: "GET /veteran-services/members/${m_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { m_v2: "$.data.version" }
          trigger:
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-11-17T00:00:00Z", treatment_end: "2026-12-01T00:00:00Z", expected_member_version: "${m_v2}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-11-18T00:00:00Z", treatment_end: "2026-12-01T00:00:00Z", expected_member_version: "${m_v2}" }
              as: IntakeCoordinator
              captures: { ref2: "$.data.id", ref2_status: "$.data.status" }
          assert:
            - "err == ERR_TREATMENT_WINDOW_CONFLICT with status 409 — 2026-11-17T00:00:00Z equals ref1's buffered end (closed bound intersects)"
            - "the failed attempt did not bump Member.version, so the retry reuses ${m_v2} successfully"
            - "ref2_status == PENDING_MATCH (no partner site exists) — 2026-11-18 clears the buffer"
            - "GET /veteran-services/referrals?member_id=${m_id} shows ref1 SUPERSEDED (superseded by ref2's creation) and ref2 PENDING_MATCH"

  - rule_id: compensating_invariant
    instances:
      - name: travel_budget_award_cancel_conservation
        grounds:
          - calculations.travel_award
          - state_machines.EventRegistration.CONFIRMED_to_CANCELLED
          - entities.CommunityEvent.fields.travel_budget_remaining_cents
        distinguishing_aspect: |
          Conserved quantity is the event's TRAVEL BUDGET in cents:
          travel_budget_remaining_cents + sum(travel_award_cents over non-CANCELLED
          registrations) == travel_budget_cents must hold after every step, including the
          award-then-cancel pair. The other instance (placement_requisition_conservation)
          conserves an employer's integer requisition count.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Event capacity 10, no accessibility seats, travel_budget_cents 120000 on 2026-10-20. Two members: r1 requests 80000 (capped at 50000), r2 requests 30000."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/community-events"
              payload: { name: "Awards Gala", starts_at: "2026-10-20T09:00:00Z", ends_at: "2026-10-20T11:00:00Z", capacity: 10, accessibility_seat_count: 0, travel_budget_cents: 120000 }
              as: EventCoordinator
              captures: { ev: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Gala One", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m1: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Gala Two", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { m2: "$.data.id" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m1}", community_event_id: "${ev}", travel_request_cents: 80000 }
              as: EventCoordinator
              captures: { r1: "$.data.id", r1_award: "$.data.travel_award_cents" }
            - call: "POST /veteran-services/event-registrations"
              payload: { member_id: "${m2}", community_event_id: "${ev}", travel_request_cents: 30000 }
              as: EventCoordinator
              captures: { r2: "$.data.id", r2_award: "$.data.travel_award_cents" }
          trigger:
            - call: "POST /veteran-services/event-registrations/${r1}/transition"
              payload: { action: "CANCEL" }
              as: EventCoordinator
            - call: "GET /veteran-services/community-events"
              payload: {}
              as: EventCoordinator
              captures: { remaining_after: "$.data[0].travel_budget_remaining_cents" }
          assert:
            - "r1_award == 50000 (PER_REGISTRATION_TRAVEL_CAP_CENTS binds below the 80000 request)"
            - "r2_award == 30000 (request binds)"
            - "after both awards: 40000 remaining and 40000 + 50000 + 30000 == 120000"
            - "after the cancel: remaining_after == 90000 and 90000 + 30000 == 120000 (conservation holds; no waitlist existed to promote)"
            - "EventRegistration.${r2}.travel_award_cents is still 30000 — the cancel of r1 did not disturb it"

      - name: placement_requisition_conservation
        grounds:
          - calculations.requisition_restore
          - state_machines.Placement.ACTIVE_to_SEPARATED
          - entities.EmployerPartner.fields.open_requisitions
        distinguishing_aspect: |
          Conserved quantity is the employer's integer REQUISITION COUNT:
          open_requisitions + placements in {ACTIVE, MILESTONE_30, MILESTONE_90,
          MILESTONE_180, RETAINED} + placements separated from MILESTONE_90 or later ==
          initial open_requisitions. A create followed by an early separation (from ACTIVE)
          restores exactly. The other instance conserves event travel cents.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Employer with open_requisitions 2. VERIFIED veteran with an ACTIVE CAREER enrollment."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "CAREER", name: "Career Counseling Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Job Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 5, phys_score: 5, voc_score: 5, soc_score: 5 }
              as: IntakeCoordinator
            - call: "POST /veteran-services/employer-partners"
              payload: { name: "Logistics Co", industry: "LOGISTICS", open_requisitions: 2 }
              as: CareerCounselor
              captures: { emp: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/placements"
              payload: { member_id: "${m_id}", employer_partner_id: "${emp}", start_date: "2026-09-15T00:00:00Z", salary_cents: 6000000 }
              as: CareerCounselor
              captures: { pl: "$.data.id" }
            - call: "POST /veteran-services/placements/${pl}/transition"
              payload: { action: "SEPARATE", separation_reason: "resigned in week one" }
              as: CareerCounselor
              captures: { pl_status: "$.data.status" }
          assert:
            - "Placement.${pl} created 201 with status ACTIVE; GET /veteran-services/employer-partners then showed open_requisitions == 1"
            - "pl_status == SEPARATED (separated from ACTIVE, before MILESTONE_90)"
            - "GET /veteran-services/employer-partners now shows open_requisitions == 2 — create + early-separate is exactly compensating"
            - "invariant: open_requisitions (2) + active placements (0) + late separations (0) == initial 2"
