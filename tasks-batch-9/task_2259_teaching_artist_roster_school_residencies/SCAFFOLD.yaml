    output: Session
    side_effects: ["status := PLANNED", "REGULAR: Residency.sessions_unscheduled_count -= 1; MAKEUP: origin session makeup_consumed := true and makeup_credits_outstanding -= 1", "Residency.sessions_open_count += 1, projected_cost_cents recomputed", "increments Residency.version by 1"]

  - method: GET
    path: "/sessions/{id}"
    description: "Read a session with its interval, ledger and payment fields"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "Search the schedule (reverse-reachability for Session.residency_id, assigned_artist_id, vacated_artist_id, lesson_plan_id, makeup_for_session_id and payment_voucher_id)"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: ["residency_id?", "assigned_artist_id?", "vacated_artist_id?", "lesson_plan_id?", "makeup_for_session_id?", "payment_voucher_id?", "status?", "session_date_from?", "session_date_to?", "limit?", "offset?"]
