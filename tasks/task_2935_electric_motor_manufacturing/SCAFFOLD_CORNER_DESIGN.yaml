            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "00000000-0000-4000-8000-0000000000f2", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
