scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_invoice_totals
        grounds:
          - calculations.invoice_total_calc
          - calculations.promo_allowance_calc
          - calculations.pick_fee_calc
          - calculations.fuel_surcharge_calc
          - entities.PurchaseOrder.fields.provisional_total_cents
          - entities.PurchaseOrder.fields.final_total_cents
          - entities.Invoice.fields.invoiced_total_cents
        distinguishing_aspect: |
          Same order, two valid algorithms on the PurchaseOrder/Invoice money domain: the
          provisional variant prices ordered quantities at submit (58500) while the final
          variant prices delivered quantities net of shorts and adds the close-stamped fuel
          surcharge (57779) — identical inputs except the variant produce different totals.
        test_recipe:
          setup:
            - "Retailer R (NET7, limit 10000000, delivery MON, jurisdiction CA_NORTH, license TLIC-9)"
            - "Product P1: case 12, case_cost 1200, unit 110, split allowed, 10 lbs; Product Q1: case 24, case_cost 2400, unit 150, split allowed, 8 lbs"
            - "Guide G1 for R on MON cutoff 24 with lines [P1, Q1]; promo 1000 bps OFF_INVOICE on P1 covering 2026-05-25"
            - "Manifest M on route R-1 for 2026-05-25; fuel rate week 2026-05-25 at 3.75 (2.5% tier)"
            - "Order: 50 cases P1 + 20 split units Q1, submitted, assigned, manifest closed, 2 cases P1 shorted, delivered"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "Q1", description: "q1", case_pack_units: 24, case_cost_cents: 2400, unit_cost_cents: 150, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 8 }, as: WholesaleAdmin, captures: { q1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 }, { product_id: "${q1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p1}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 }, { product_id: "${q1}", cases_qty: 0, split_units_qty: 20 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_prov: $.data.provisional_total_cents } }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.75 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "GET /order-lines", payload: { order_id: "${po_id}", product_id: "${p1}" }, as: WholesaleAdmin, captures: { line_p1: "$.data[0].id" } }
            - { call: "POST /delivery-manifests/${m_id}/delivery-exceptions", payload: { order_id: "${po_id}", order_line_id: "${line_p1}", exception_type: "SHORT", cases_qty: 2, split_units_qty: 0 }, as: RouteDriver }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver, captures: { inv_total: $.data.invoiced_total_cents, inv_bal: $.data.balance_cents } }
          assert:
            - "captured po_prov == 58500 (provisional: 63000 merch - 6000 promo + 1500 pick + 0 min-drop + 0 stamp)"
            - "captured inv_total == 57779 (final: 60600 delivered merch - 5760 promo + 1476 pick + 1463 surcharge)"
            - "captured inv_bal == 57779"
            - "po_prov != inv_total"
      - name: forward_vs_aging_credit_exposure
        grounds:
          - calculations.credit_exposure_calc
          - entities.Retailer.fields.exposure_forward_cents
          - entities.Retailer.fields.ar_balance_cents
        distinguishing_aspect: |
          Same retailer at the same instant, two valid exposure algorithms on the Retailer
          credit domain: forward_looking includes the SUBMITTED order's provisional total
          (58500) while chronological_aging buckets only invoiced balances (0 before any
          invoice exists) — different entity domain from the invoice-total variant.
        test_recipe:
          setup:
            - "Retailer R (NET7, limit 10000000, MON, CA_NORTH, license) with guide and P1 promo as in the base fixture"
            - "Order of 50 cases P1 + 20 split Q1 submitted; no manifest, no invoice"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "Q1", description: "q1", case_pack_units: 24, case_cost_cents: 2400, unit_cost_cents: 150, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 8 }, as: WholesaleAdmin, captures: { q1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 }, { product_id: "${q1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p1}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 }, { product_id: "${q1}", cases_qty: 0, split_units_qty: 20 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
          trigger:
            - { call: "GET /retailers/${ret_id}/credit-summary", payload: {}, as: CreditManager, captures: { fwd: $.data.exposure_forward_cents, aging_cur: $.data.exposure_aging_current_cents, ar: $.data.ar_balance_cents } }
          assert:
            - "captured fwd == 58500 (pipeline order provisional included)"
            - "captured aging_cur == 0 (no invoice exists; aging ignores pipeline)"
            - "captured ar == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: tax_stamp_nested_max_ceil
        grounds:
          - calculations.tax_stamp_cost_calc
          - entities.PurchaseOrder.fields.tax_stamp_cost_cents
          - entities.TaxStampSupply.fields.min_charge_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested max(packs*rate,
          min_charge) plus ceil(packs/packs_per_roll) roll fee. 20 packs at 200 cents falls
          below the 5000 minimum, so the max binds and exactly 1 roll handling fee applies:
          5000 + 1*1500 = 6500.
        test_recipe:
          setup:
            - "Retailer R jurisdiction CA_NORTH with tobacco license; TaxStampSupply CA_NORTH: rate 200/pack, handling 1500/roll, 6000 packs/roll, min charge 5000, ACTIVE"
            - "Tobacco product T1 (case 60 packs, case_cost 33000, unit 550, split allowed); guide line T1; order of 20 split units only"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "RT", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /tax-stamp-supplies", payload: { jurisdiction_code: "CA_NORTH", stamp_rate_cents_per_pack: 200, handling_fee_per_roll_cents: 1500, packs_per_roll: 6000, min_charge_cents: 5000 }, as: WholesaleAdmin }
            - { call: "POST /products", payload: { sku: "T1", description: "tobacco", case_pack_units: 60, case_cost_cents: 33000, unit_cost_cents: 550, split_case_allowed: true, is_tobacco: true, weight_lbs_per_case: 15 }, as: WholesaleAdmin, captures: { t1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${t1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${t1}", cases_qty: 0, split_units_qty: 20 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { stamp: $.data.tax_stamp_cost_cents, prov: $.data.provisional_total_cents } }
          assert:
            - "captured stamp == 6500 (max(20*200, 5000) + ceil(20/6000)*1500)"
            - "captured prov == 20900 (11000 merch + 900 pick + 2500 min-drop + 6500 stamp)"
      - name: promo_per_line_rounding_order
        grounds:
          - calculations.promo_allowance_calc
          - entities.OrderLine.fields.line_promo_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-line-then-sum. Two
          lines of 1005 cents at 1000 bps round half-up to 101 each and sum to 202;
          sum-then-round would yield round(2010*0.10) = 201, a one-cent divergence.
        test_recipe:
          setup:
            - "Retailer R with guide lines [P2, P3]; P2 and P3 each case_cost 1005, split not allowed; 1000 bps OFF_INVOICE promos on BOTH covering 2026-05-25"
            - "Order: 1 case P2 + 1 case P3"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P2", description: "p2", case_pack_units: 12, case_cost_cents: 1005, unit_cost_cents: 100, split_case_allowed: false, is_tobacco: false, weight_lbs_per_case: 5 }, as: WholesaleAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "P3", description: "p3", case_pack_units: 12, case_cost_cents: 1005, unit_cost_cents: 100, split_case_allowed: false, is_tobacco: false, weight_lbs_per_case: 5 }, as: WholesaleAdmin, captures: { p3: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p2}", par_cases: 0 }, { product_id: "${p3}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p2}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /promo-events", payload: { product_id: "${p3}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p2}", cases_qty: 1, split_units_qty: 0 }, { product_id: "${p3}", cases_qty: 1, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { promo: $.data.promo_allowance_cents, prov: $.data.provisional_total_cents } }
          assert:
            - "captured promo == 202 (101 + 101, per-line half-up then sum; NOT 201)"
            - "captured prov == 4332 (2010 merch - 202 promo + 24 pick + 2500 min-drop)"
      - name: fuel_surcharge_base_excludes_min_drop_fee
        grounds:
          - calculations.fuel_surcharge_calc
          - calculations.min_drop_fee_calc
          - entities.PurchaseOrder.fields.fuel_surcharge_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the surcharge
          base is (merch - promo + pick) and excludes the min-drop fee even though both are
          order-level charges on the same invoice. Base 48480 at 2.5% gives 1212; including
          the 2500 fee would give 1275.
        test_recipe:
          setup:
            - "Retailer R with guide line P1 only; no promo; order of 40 cases P1 (merch 48000 < 50000 threshold)"
            - "Manifest for 2026-05-25, fuel rate week 2026-05-25 at 3.75"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 40, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { prov: $.data.provisional_total_cents, minfee: $.data.min_drop_fee_cents } }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.75 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
          trigger:
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "GET /purchase-orders/${po_id}", payload: {}, as: WholesaleAdmin, captures: { sur: $.data.fuel_surcharge_cents } }
          assert:
            - "captured minfee == 2500"
            - "captured prov == 50980 (48000 + 480 pick + 2500 min-drop)"
            - "captured sur == 1212 (2.5% of 48480 = 48000 - 0 + 480; min-drop fee excluded from base)"

  - rule_id: non_linear_state_machine
    instances:
      - name: new_item_revision_cycle
        grounds:
          - state_machines.NewItemRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.NewItemRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.NewItemRequest.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.NewItemRequest.UNDER_REVIEW_to_AUTHORIZED
          - calculations.slotting_fee_calc
        distinguishing_aspect: |
          NewItemRequest is cyclic (SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW -> AUTHORIZED), a revision loop on the item-authorization
          entity — not a linear pipeline.
        test_recipe:
          setup:
            - "Retailer R with ACTIVE guide (lines [P1]); candidate product PX (case_pack 12) not yet on the guide"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "PX", description: "candidate", case_pack_units: 12, case_cost_cents: 900, unit_cost_cents: 90, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 6 }, as: WholesaleAdmin, captures: { px: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /new-item-requests", payload: { retailer_id: "${ret_id}", product_id: "${px}", proposed_shelf_price_cents: 999 }, as: SalesRep, captures: { nir: $.data.id } }
            - { call: "POST /new-item-requests/${nir}/start-review", payload: {}, as: WholesaleAdmin, captures: { fee: $.data.slotting_fee_cents } }
            - { call: "POST /new-item-requests/${nir}/request-revision", payload: { revision_notes: "reprice" }, as: WholesaleAdmin }
            - { call: "POST /new-item-requests/${nir}/resubmit", payload: { proposed_shelf_price_cents: 949 }, as: SalesRep }
            - { call: "POST /new-item-requests/${nir}/start-review", payload: {}, as: WholesaleAdmin }
          trigger:
            - { call: "POST /new-item-requests/${nir}/authorize", payload: {}, as: WholesaleAdmin, captures: { st: $.data.status } }
            - { call: "GET /order-guides/${g1}", payload: {}, as: SalesRep, captures: { glines: $.data.lines } }
            - { call: "GET /retail-price-records", payload: { retailer_id: "${ret_id}", product_id: "${px}", status: "ACTIVE" }, as: SalesRep, captures: { shelf: "$.data[0].shelf_price_cents" } }
          assert:
            - "captured fee == 53000 (50000 + 12*250, under cap)"
            - "captured st == AUTHORIZED after one full revision cycle"
            - "captured glines contains an entry with product_id == px (guide extended by authorize)"
            - "captured shelf == 949 (resubmitted price published)"
      - name: invoice_paid_to_open_reversal_cycle
        grounds:
          - state_machines.Invoice.OPEN_to_PAID
          - state_machines.Invoice.PAID_to_OPEN
          - entities.Payment.fields.status
        distinguishing_aspect: |
          Invoice is cyclic via compensation (OPEN -> PAID -> OPEN on payment reversal), a
          revert loop on the billing entity — a different entity and shape from the
          NewItemRequest revision cycle.
        test_recipe:
          setup:
            - "Retailer R, guide with P1, order of 50 cases P1 (no promo), manifest closed with doe 3.00 (0% surcharge), delivery confirmed: invoice 60600"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
