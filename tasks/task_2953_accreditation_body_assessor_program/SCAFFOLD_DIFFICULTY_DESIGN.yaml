  - rule_id: boundary_precision_check
    instances:
      - name: qualification_granted_at_exact_points_and_exact_witness_day_floor
        endpoint: "POST /accreditation/qualifications/{qualification_id}/verify-evidence"
        metric: "verified_points against scheme.qualification_points_required, and verified_witness_days against ROLE_MIN_WITNESS_DAYS"
        grounds:
          - calculations.assessor_competence_points
          - state_machines.AssessorQualification.PENDING_to_GRANTED
          - state_machines.AssessorQualification.PENDING_to_PENDING
        distinguishing_aspect: |
          Two independent boundaries are exercised on the same endpoint with a >= comparison on each.
          A CONTRACT assessor with 6 years, 4 verified witness days and 1 module scores exactly
          60.00 - equal to qualification_points_required - with exactly 4 verified witness days,
          equal to the LEAD_ASSESSOR floor of 4, so the grant must fire. One step below on points
          (3 witness days, 55.00) and one step below on the witness floor alone (9 years so 67.00
          points but still 3 witness days) must both leave the qualification PENDING.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme with qualification_points_required 60.0."
            - "Three CONTRACT assessors, each with a PENDING LEAD_ASSESSOR qualification and last_witness_on 2026-06-01 so the recency factor is exactly 1.00."
            - "Assessor B is verified at 6 years / 3 witness days / 1 module and assessor C at 9 years / 3 witness days / 1 module, both before the trigger."
