# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Apartment Leasing Center & Traffic Conversion
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7; sections and claim_type values
# follow references/claim-extraction-guide.md. Instances already exercised by
# §1.8 are emitted as excluded_because stubs.
# Clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: property_creation_applies_config_defaults
        claim_type: defaults
        grounds: ["entities.Property"]
        distinguishing_aspect: "Creating a property with only name+code applies every documented default: response_time_target_minutes 60, tour_buffer_minutes 15, self_guided_window_minutes 60, max_moveins_per_day 2, utility_transfer_required true, prorate_method CALENDAR, required_addenda []."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /leasing/properties"
              payload: { name: "Default Hall", code: "DFT1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          assert:
            - "Property.${p_id}.response_time_target_minutes == 60"
            - "Property.${p_id}.tour_buffer_minutes == 15"
            - "Property.${p_id}.self_guided_window_minutes == 60"
            - "Property.${p_id}.max_moveins_per_day == 2"
            - "Property.${p_id}.utility_transfer_required == true"
            - "Property.${p_id}.prorate_method == CALENDAR"
            - "Property.${p_id}.required_addenda == []"
            - "Property.${p_id}.version == 1"

      - name: floorplan_computed_availability_on_create
        claim_type: computed_fields
        grounds: ["entities.Floorplan.fields.committed_units", "entities.Floorplan.fields.available_units"]
        distinguishing_aspect: "A fresh floorplan reports committed_units 0 and available_units == total_units; client-supplied values for these computed fields are ignored."
        test_recipe:
          setup: ["Property P exists"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Avail Arms", code: "AV1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "3BR", bedrooms: 3, base_rent_cents: 350000, total_units: 4 }
              as: PropertyManager
              captures: { f_id: $.data.id }
          assert:
            - "Floorplan.${f_id}.committed_units == 0"
            - "Floorplan.${f_id}.available_units == 4"

      - name: inquiry_missing_required_source_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Inquiry.fields.source", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required enum field source on inquiry creation fails with ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["Property P exists"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Req Towers", code: "RQ1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "NoSource", contact_email: "ns@x.com" }
              as: LeasingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /leasing/inquiries?property_id=${p_id} returns empty data array"

      - name: inquiry_invalid_source_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Inquiry.fields.source", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A source value outside {WALK_IN, PHONE, WEB_FORM, ILS_LISTING, REFERRAL} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property P exists"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Enum Estates", code: "EN1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "BadEnum", contact_email: "be@x.com", source: "SMOKE_SIGNAL" }
              as: LeasingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_nonexistent_floorplan_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_FLOORPLAN_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown floorplan UUID returns 404 ERR_FLOORPLAN_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /leasing/floorplans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLOORPLAN_NOT_FOUND"
            - "HTTP status == 404"

      - name: system_fields_input_ignored_on_floorplan_create
        claim_type: system_fields
        grounds: ["entities.Floorplan"]
        distinguishing_aspect: "Client-supplied id/version/created_at in the create body are ignored: the response carries a server-minted UUID, version 1, and a server timestamp."
        test_recipe:
          setup: ["Property P exists"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Sysfield Suites", code: "SY1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "2BR", bedrooms: 2, base_rent_cents: 250000, total_units: 2, id: "11111111-1111-1111-1111-111111111111", version: 99, created_at: "2020-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { f_id: $.data.id }
          assert:
            - "Floorplan.${f_id}.id != 11111111-1111-1111-1111-111111111111"
            - "Floorplan.${f_id}.version == 1"
            - "Floorplan.${f_id}.created_at == 2026-08-01T00:00:00Z   # server logical clock default, not the client value"

      - name: self_guided_tour_end_computed_from_property_window
        claim_type: computed_fields
        grounds: ["entities.Tour.fields.scheduled_end", "entities.Property.fields.self_guided_window_minutes"]
        distinguishing_aspect: "For SELF_GUIDED tours the server computes scheduled_end = scheduled_start + property.self_guided_window_minutes and ignores any client-supplied end; agent_id must be absent."
        test_recipe:
          setup:
            - "Property P (self_guided_window_minutes 60), agent A, floorplan F (1 unit, available)"
            - "Inquiry I claimed + responded (CONTACTED)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Self Tour Lofts", code: "SG1", self_guided_window_minutes: 60 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "SA", email: "sa@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "Studio", bedrooms: 0, base_rent_cents: 150000, total_units: 1 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "SG", contact_email: "sg@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "${i_id}", tour_type: "SELF_GUIDED", scheduled_start: "2026-08-10T10:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { t_id: $.data.id }
          assert:
            - "Tour.${t_id}.scheduled_end == 2026-08-10T11:00:00Z   # start + 60 minutes, server-computed"
            - "Tour.${t_id}.agent_id == null"
            - "Inquiry.${i_id}.status == TOUR_SCHEDULED"

      - name: self_guided_tour_with_agent_id_rejected
        claim_type: type_constraints
        grounds: ["entities.Tour.fields.agent_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Conditional field rule: agent_id is required for GUIDED and forbidden for SELF_GUIDED; supplying it on a SELF_GUIDED tour fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F (1 unit); inquiry I claimed + responded"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Cond Field Court", code: "CF1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "CA", email: "cfa@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 150000, total_units: 1 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "CF", contact_email: "cf@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "${i_id}", tour_type: "SELF_GUIDED", agent_id: "${a_id}", scheduled_start: "2026-08-10T10:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: tour_create_with_unknown_inquiry_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_INQUIRY_NOT_FOUND]", "entities.Tour.fields.inquiry_id"]
        distinguishing_aspect: "A body FK that does not resolve fails existence validation with 404 ERR_INQUIRY_NOT_FOUND before any state or temporal check."
        test_recipe:
          setup: ["empty database (no property needed — the inquiry reference fails first)"]
          setup_api_calls: []
          trigger:
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", tour_type: "SELF_GUIDED", scheduled_start: "2026-08-10T10:00:00Z" }
              as: LeasingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INQUIRY_NOT_FOUND"
            - "HTTP status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: inquiry_created_in_initial_state_new
        claim_type: initial_state
        grounds: ["state_machines.Inquiry"]
        distinguishing_aspect: "A newly created inquiry has status NEW, assigned_agent_id null, first_responded_at null, response_met_target null."
        test_recipe:
          setup: ["Property P exists"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Init Towers", code: "IN1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "Init", contact_email: "init@x.com", source: "WALK_IN" }
              as: PropertyManager
              captures: { i_id: $.data.id }
          assert:
            - "Inquiry.${i_id}.status == NEW"
            - "Inquiry.${i_id}.assigned_agent_id == null"
            - "Inquiry.${i_id}.first_responded_at == null"
            - "Inquiry.${i_id}.response_met_target == null"

      - name: claim_then_double_claim_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Inquiry", "errors[ERR_INQUIRY_INVALID_STATE]"]
        distinguishing_aspect: "Claim assigns the calling agent without changing status; a second claim against the already-assigned inquiry fails with ERR_INQUIRY_INVALID_STATE."
        test_recipe:
          setup: ["Property P, agents A1 and A2, inquiry I unassigned"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Claim Court", code: "CL1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "A One", email: "a1@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a1_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "A Two", email: "a2@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a2_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "Cl", contact_email: "cl@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first claim: Inquiry.${i_id}.assigned_agent_id == ${a1_id} and status == NEW"
            - "err == ERR_INQUIRY_INVALID_STATE   # already assigned"
            - "Inquiry.${i_id}.assigned_agent_id == ${a1_id}   # unchanged by failed claim"

      - name: mark_lost_cascades_tour_cancellation
        claim_type: side_effect_execution
        grounds: ["state_machines.Inquiry.TOUR_SCHEDULED_to_LOST", "state_machines.Tour.SCHEDULED_to_CANCELLED"]
        distinguishing_aspect: "Cascade down: marking an inquiry LOST cancels its still-SCHEDULED tour; the tour's terminal state is CANCELLED and the inquiry does not revert."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F; inquiry I claimed + responded; GUIDED tour T scheduled (I is TOUR_SCHEDULED)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Lost Lake", code: "LL1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "LA", email: "lla@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "LL", contact_email: "ll@x.com", source: "ILS_LISTING" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "${i_id}", tour_type: "GUIDED", agent_id: "${a_id}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /leasing/inquiries/${i_id}/mark-lost"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          assert:
            - "Inquiry.${i_id}.status == LOST"
            - "Tour.${t_id}.status == CANCELLED   # cascade down from mark-lost"

      - name: tour_no_show_reverts_inquiry_to_contacted
        claim_type: side_effect_execution
        grounds: ["state_machines.Tour.SCHEDULED_to_NO_SHOW", "state_machines.Inquiry.TOUR_SCHEDULED_to_CONTACTED"]
        distinguishing_aspect: "Cross-entity revert: completing a tour with outcome NO_SHOW returns the inquiry from TOUR_SCHEDULED to CONTACTED (cycle guard satisfied because the inquiry is still TOUR_SCHEDULED)."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F; inquiry I claimed + responded; GUIDED tour T scheduled"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "NoShow Nook", code: "NS1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "NA", email: "na@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "NS", contact_email: "ns2@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "${i_id}", tour_type: "GUIDED", agent_id: "${a_id}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /leasing/tours/${t_id}/complete"
              payload: { outcome: "NO_SHOW" }
              as: LeasingAgent
              as_user_id: "${a_id}"
          assert:
            - "Tour.${t_id}.status == NO_SHOW"
            - "Inquiry.${i_id}.status == CONTACTED   # reverted; a new tour can be scheduled again"

      - name: tour_complete_from_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Tour", "errors[ERR_TOUR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CANCELLED, the complete trigger is not in the transition list and fails with ERR_TOUR_INVALID_STATE."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F; inquiry I claimed + responded; tour T scheduled then cancelled"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Term Court", code: "TC1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "TA", email: "tca@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "TC", contact_email: "tc@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/tours"
              payload: { inquiry_id: "${i_id}", tour_type: "GUIDED", agent_id: "${a_id}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { t_id: $.data.id }
            - call: "POST /leasing/tours/${t_id}/cancel"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /leasing/tours/${t_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TOUR_INVALID_STATE"
            - "Tour.${t_id}.status == CANCELLED   # unchanged"

      - name: decide_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Application", "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "Decide is valid only from SCREENING; a second decide on an APPROVED application fails with ERR_APPLICATION_INVALID_STATE (no idempotent replay)."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F; application via inquiry already decided APPROVED"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Decide Den", code: "DD1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "DA", email: "dda@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "DD", contact_email: "dd@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "DD App", applicant_email: "dd@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
          trigger:
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "DENIED" }
              as: PropertyManager
