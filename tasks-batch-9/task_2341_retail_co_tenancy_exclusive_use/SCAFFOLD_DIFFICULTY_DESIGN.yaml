# Scaffold Difficulty Design (SKILL.md §1.8) for task_2341_retail_co_tenancy_exclusive_use
# Nine §0.5 difficulty rule_ids; 24 instances total. All numeric asserts are pre-computed literals.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: occupancy_variant_divergence_dark_inline_strict_versus_trailing_grace
    grounds:
    - calculations.occupancy_measurement_snapshot
    - entities.OccupancyMeasurement.fields.variant
    - entities.OccupancyMeasurement.fields.gla_occupancy_pct
    - entities.ShoppingCenter.fields.occupancy_grace_days
    - concurrency_rules[measurement-create-stale-center]
    distinguishing_aspect: The SNAPSHOT_STRICT variant counts only premises_status == OPEN so the 30,000 sqft dark inline suite drops out and gla_occupancy_pct is 75.00, while TRAILING_GRACE re-admits a
      suite dark fewer than occupancy_grace_days=30 days and reports 85.00 on the identical entity population.
    test_recipe:
      setup:
      - Center Northgate Crossing with total_gla_sqft 300000 and occupancy_grace_days 30
      - 'Five OPEN leases: A1 120000 anchor, A2 100000 anchor, I1 2000, I2 3000, I3 30000'
      - Lease I3 driven DARK on the logical clock date 2026-08-01 (dark_since 2026-08-01)
      - Logical clock left at 2026-08-01T00:00:00Z so I3 has been dark 0 days, inside the 30-day grace
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Boxmart Retail Inc
          notice_email: legal@boxmart.example
          primary_use_code: DISCOUNT_DEPT
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_a1: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Grocerway Foods LLC
          notice_email: legal@grocerway.example
          primary_use_code: GROCERY
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_a2: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Bean Theory Coffee LLC
          notice_email: legal@beantheory.example
          primary_use_code: COFFEE
          is_national_chain: false
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_i1: $.data.id
      - call: POST /tenants
