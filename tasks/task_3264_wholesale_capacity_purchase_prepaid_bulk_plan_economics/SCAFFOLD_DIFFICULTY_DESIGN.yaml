        distinguishing_aspect: "An empty-intersection boundary: with an existing 7-day window ending 2026-10-08T00:00:00Z, a new 7-day add-on whose start_at is exactly that instant is admitted, while one starting a single second earlier is rejected, because the intervals are half-open [start_at, end_at)."
