        distinguishing_aspect: "A create missing required task_kind AND referencing a nonexistent work_order_id fails with ERR_VALIDATION — schema (priority 3) precedes existence (priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "00000000-0000-0000-0000-000000000000", description: "x", estimated_hours: 1.0 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (400) — not ERR_NOT_FOUND"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before even existence checks on the path id."
        test_recipe:
          setup: ["empty database; the trigger request is sent WITHOUT the X-User-Role / X-User-ID headers (the `as` role below is omitted on purpose)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /avionics/customers/00000000-0000-0000-0000-000000000000", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401 — not ERR_NOT_FOUND"

