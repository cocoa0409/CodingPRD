      - name: training_hours_gate_is_inclusive_at_twenty_four_hours
        claim_type: threshold
        grounds:
          - validations[priority=44]
          - errors[ERR_TRAINING_HOURS_NOT_MET]
          - constants.MIN_TRAINING_HOURS
        distinguishing_aspect: "MIN_TRAINING_HOURS is compared with >=, so 23 recorded hours blocks the exam with ERR_TRAINING_HOURS_NOT_MET (422) and leaves the certification ENROLLED, while exactly 24 hours is graded and a score of exactly PASS_SCORE (80) passes."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC model; ServicePartner SP-1 (FULL) in APPLIED with certifications T-SHORT (23 hours) and T-EXACT (24 hours), both ENROLLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T-SHORT", training_hours: 23 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc_short: $.data.id, st_short: $.data.status }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T-EXACT", training_hours: 24 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc_exact: $.data.id }
          trigger:
            - call: "POST /technician-certifications/${tc_short}/grade"
              payload: { exam_score: 95 }
              as: ChannelManager
              captures: { err: $.data.error_id }
            - call: "POST /technician-certifications/${tc_exact}/grade"
              payload: { exam_score: 80 }
              as: ChannelManager
              captures: { st_exact: $.data.status, exp: $.data.expires_on }
          assert:
            - "${st_short} == ENROLLED"
            - "first trigger HTTP status == 422"
            - "${err} == ERR_TRAINING_HOURS_NOT_MET"
            - "after the first trigger TechnicianCertification.${tc_short}.status == ENROLLED"
            - "after the first trigger TechnicianCertification.${tc_short}.exam_score is null"
            - "second trigger HTTP status == 200"
            - "${st_exact} == PASSED"
            - "${exp} == '2028-07-31T00:00:00Z'"

      - name: authorization_state_gate_precedes_the_parts_stocking_gate
        claim_type: Priority Ordering
        grounds:
          - validations[priority=21]
          - validations[priority=45]
          - errors[ERR_CHANNEL_STATE_INVALID]
          - errors[ERR_PARTS_STOCKING_INSUFFICIENT]
        distinguishing_aspect: "AUTHORIZE straight from APPLIED returns the priority-21 ERR_CHANNEL_STATE_INVALID (409) even though the PARTIAL stocking level also violates priority 45; only after PROVISION does the same call surface ERR_PARTS_STOCKING_INSUFFICIENT (422), and the partner stays PROVISIONAL."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC model; ServicePartner SP-1 registered with parts_stocking_level PARTIAL and two PASSED certifications on that model, so the certified-technician count is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "PARTIAL" }
              as: ChannelManager
              captures: { sp_id: $.data.id, sp_status: $.data.status }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T1", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc1: $.data.id }
            - call: "POST /technician-certifications/${tc1}/grade"
              payload: { exam_score: 88 }
              as: ChannelManager
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T2", training_hours: 36 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc2: $.data.id }
            - call: "POST /technician-certifications/${tc2}/grade"
              payload: { exam_score: 91 }
              as: ChannelManager
          trigger:
            - call: "POST /service-partners/${sp_id}/authorization"
              payload: { action: "AUTHORIZE" }
              as: ChannelManager
              captures: { err_state: $.data.error_id }
            - call: "POST /service-partners/${sp_id}/authorization"
              payload: { action: "PROVISION" }
              as: ChannelManager
              captures: { st_prov: $.data.status, models_prov: $.data.authorized_model_ids }
            - call: "POST /service-partners/${sp_id}/authorization"
              payload: { action: "AUTHORIZE" }
              as: ChannelManager
              captures: { err_stock: $.data.error_id }
          assert:
            - "${sp_status} == APPLIED"
            - "first trigger HTTP status == 409"
            - "${err_state} == ERR_CHANNEL_STATE_INVALID"
            - "${err_state} != ERR_PARTS_STOCKING_INSUFFICIENT"
            - "second trigger HTTP status == 200"
            - "${st_prov} == PROVISIONAL"
            - "${models_prov} == ['${model_id}']"
            - "third trigger HTTP status == 422"
            - "${err_stock} == ERR_PARTS_STOCKING_INSUFFICIENT"
            - "ServicePartner.${sp_id}.status == PROVISIONAL"

      - name: conclusion_needs_three_runs_and_is_not_replayable_once_passed
        claim_type: Violation -> Error
        grounds:
          - validations[priority=42]
          - validations[priority=18]
          - errors[ERR_MIN_TEST_RUNS_NOT_MET]
          - errors[ERR_VALIDATION_STATE_INVALID]
        distinguishing_aspect: "MIN_RUNS is counted on the current attempt's test_runs list, so two runs give ERR_MIN_TEST_RUNS_NOT_MET (422) without incrementing attempt_count; the third run makes the same conclusion call pass with certified 66.06, and a replayed conclusion on the now-terminal PASSED validation gives ERR_VALIDATION_STATE_INVALID (409) rather than a second stamp."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900; ChainAccount CHN-1 at volume 250; DRAFT configuration CFG-1; PerformanceValidation for FRIES with target 60 and hold target 175.0 carrying only two runs (95/90 and 108/95, both at 175.0)."
