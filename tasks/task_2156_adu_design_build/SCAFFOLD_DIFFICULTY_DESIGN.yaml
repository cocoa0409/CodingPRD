            - "ConstructionPhase F is SCHEDULED for 2026-09-01 through 2026-09-05 with no predecessor."
            - "A revision PermitSubmittal S2 was then created and filed, so S2 is UNDER_PLAN_CHECK and is the project's newest submittal."
