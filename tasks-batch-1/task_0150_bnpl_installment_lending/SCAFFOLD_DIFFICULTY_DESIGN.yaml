            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
