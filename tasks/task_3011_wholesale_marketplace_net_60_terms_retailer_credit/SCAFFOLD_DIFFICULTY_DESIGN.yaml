              captures: { r_rate: $.data.return_rate }
          assert:
            - "ReturnAuthorization.${ra_id}.status == RECEIVED and credit_cents == 10000 (opening order, fee 0)"
            - "Invoice.${inv_id}.amount_due_cents == 0 and status == PAID (hop 2: credit zeroed the balance)"
            - "Order.${o_id}.status == RETURNED (hop 3: all lines net_sold_qty == 0)"
            - "Retailer.${r_id}.return_rate is recomputed with returned_units == 2 in the numerator"

