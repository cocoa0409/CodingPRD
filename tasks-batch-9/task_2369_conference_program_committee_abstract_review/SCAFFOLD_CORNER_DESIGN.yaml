        excluded_because:
          difficulty_instance: combinatorial_formula / oral_to_poster_to_waitlist_waterfall_nested_branching
          rationale: "First-bucket-fills-first, the downgrade overflow and the waitlist remainder are all walked by the named §1.8 instance."

      - name: tiered_pricing_boundaries_on_the_change_fee
        claim_type: tiered_pricing
        grounds:
          - calculations.program_change_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / change_fee_days_to_event_frozen_at_submission_pins_evaluation_order
          rationale: "The 14-day and 7-day tier boundaries and the frozen days_to_event input are asserted by the named §1.8 instance."

      - name: variant_divergence_between_provisional_and_final_consensus
        claim_type: variant_divergence
        grounds:
          - calculations.abstract_consensus_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / consensus_provisional_unweighted_vs_final_confidence_weighted_on_abstract
          rationale: "Same input set, two formulas, non-zero delta — exactly the named §1.8 instance."

  # ===========================================================================
  # SECTION 4 — Validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: request_without_identity_headers_is_rejected_at_priority_one
        claim_type: violation_to_error
        grounds:
          - validations.p1.ERR_MISSING_AUTH_HEADERS
        distinguishing_aspect: |
          The very top of the ladder: a body that is otherwise perfectly valid
          is still refused with 401 ERR_MISSING_AUTH_HEADERS when X-User-Role
          and X-User-ID are absent, and no Conference row is created. A second
          attempt with a role string outside the five declared roles fails the
          same rule rather than falling through to 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z. No conferences exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1 }
              as: NONE
              note: "sent with neither X-User-Role nor X-User-ID"
              captures: { err1: "$.data.error_id" }
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1 }
              as: NONE
              note: "sent with X-User-Role: Registrar (not one of the five declared roles) and X-User-ID: anything"
              captures: { err2: "$.data.error_id" }
            - call: "GET /conferences"
              as: ConferenceAdmin
              captures: { total: "$.meta.total_count" }
          assert:
            - "first call → HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "second call → HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS (an undeclared role is a header problem, not an authorization problem)"
            - "GET /conferences reports total_count == 0 — neither attempt persisted a row"

      - name: abstract_at_exactly_the_category_word_limit_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.p16.ERR_ABSTRACT_FORMAT_INVALID
          - entities.SubmissionCategory.fields.max_word_count
        distinguishing_aspect: |
          The formatting rule is body_word_count <= max_word_count, so 300
          against a 300-word ceiling satisfies it and the submission is created
          normally with status SUBMITTED and a minted blind_code. An
          implementation that reads the ceiling as exclusive rejects this legal
          submission.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at CFA_OPEN with category GEN whose max_word_count is 300 and requires_structured_body is false."
            - "Author Ada exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 300, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"], body_structured: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab_id: "$.data.id", code: "$.data.blind_code", st: "$.data.status" }
          assert:
            - "HTTP 201"
            - "Abstract.${ab_id}.status == SUBMITTED"
            - "Abstract.${ab_id}.body_word_count == 300"
            - "Abstract.${ab_id}.blind_code == GOS26-B0001"
            - "Abstract.${ab_id}.revision_round == 0"

      - name: abstract_one_word_over_the_category_limit_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.p16.ERR_ABSTRACT_FORMAT_INVALID
        distinguishing_aspect: |
          301 words against the same 300-word ceiling returns 422
          ERR_ABSTRACT_FORMAT_INVALID, and because the rejection happens at
          p16 no Abstract row and no blind_code are minted — the next legal
          submission still receives GOS26-B0001, proving the sequence was not
          consumed by the failed attempt.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at CFA_OPEN with category GEN whose max_word_count is 300."
            - "Author Ada exists and no abstract has been submitted yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 301, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { err: "$.data.error_id", msg: "$.data.message" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 299, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab_id: "$.data.id", code: "$.data.blind_code" }
          assert:
            - "first call → HTTP 422 with error_id ERR_ABSTRACT_FORMAT_INVALID"
            - "second call → HTTP 201 with blind_code GOS26-B0001 and abstract_sequence 1"
            - "Conference.${conf_id}.abstract_sequence_counter == 1 (the rejected attempt consumed nothing)"

      - name: structured_body_requirement_applies_only_where_configured
        claim_type: conditional
        grounds:
          - validations.p16.ERR_ABSTRACT_FORMAT_INVALID
          - entities.SubmissionCategory.fields.requires_structured_body
        distinguishing_aspect: |
          Conditional validation keyed on a per-category flag: the identical
          payload with body_structured false is accepted under GEN
          (requires_structured_body false) and refused under STR
          (requires_structured_body true). The same request therefore has two
          legitimate outcomes depending only on the referenced category's
          configuration, and both must be exercised to distinguish an
          always-on from a flag-driven check.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at CFA_OPEN."
            - "Category GEN has requires_structured_body false; category STR has requires_structured_body true; both allow ORAL and cap at 300 words."
            - "Author Ada exists."
          setup_api_calls:
