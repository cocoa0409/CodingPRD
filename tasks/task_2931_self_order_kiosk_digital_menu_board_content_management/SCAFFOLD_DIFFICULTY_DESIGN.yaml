  - rule_id: cross_entity_state_dependency
    instances:

      - name: device_cache_sync_gated_by_content_bundle_state
        grounds:
          - validations.priority_14_ERR_BUNDLE_NOT_PUBLISHED
          - state_machines.Device.cache_state=MISSING_to_cache_state=FRESH
          - state_machines.ContentBundle
        distinguishing_aspect: |
          Entity pair Device -> ContentBundle: the Device write is legal in every respect on
          the Device side (registered, ONLINE, attested, capacity free) and is refused purely
          because the *referenced* ContentBundle is still DRAFT. The same call succeeds once
          the bundle reaches PUBLISHED, with no change to the device.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001."
            - "A ContentBundle for CL_WEST is created with a LUNCH slot but left in DRAFT (no audit, no VALIDATE, no PUBLISH)."
            - "Kiosk K001 is registered, attested and heartbeats all-true, so it is ONLINE with cache_state MISSING."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
