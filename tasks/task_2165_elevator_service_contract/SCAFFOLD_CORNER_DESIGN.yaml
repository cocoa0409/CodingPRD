            - "${e_rb6} == \"ERR_UNAUTHENTICATED\""
            - "GET /elevator-program/contracts returns an empty array with total_count == 0"
        note: "`as: Anonymous` denotes the deliberate absence of the X-User-Role and X-User-ID headers; no such role exists in §1.7, which is exactly what the test asserts."

