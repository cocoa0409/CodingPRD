              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv1: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_id}", expected_issue_version: "${iv1}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { f1_id: "$.data.id" }
            - call: "POST /disclosure/filings/${f1_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "POST /disclosure/filings/${f1_id}/confirm"
              payload: { repository_receipt_id: "EMMA-HA-2026-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { f1_status0: "$.data.status" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { billable1: "$.data.billable_filing_count", invoice1: "$.data.invoice_total_cents" }
            - call: "GET /disclosure/material-event-notices/${notice_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { notice_status1: "$.data.status", notice_days1: "$.data.days_late", notice_filed1: "$.data.filed_filing_id" }
          trigger:
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv2: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_id}", supersedes_filing_id: "${f1_id}", correction_reason: "Called maturities table omitted two CUSIPs.", expected_issue_version: "${iv2}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { f2_id: "$.data.id", f2_status0: "$.data.status", f2_super: "$.data.supersedes_filing_id", f2_reason: "$.data.correction_reason" }
            - call: "POST /disclosure/filings/${f2_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { f2_status1: "$.data.status" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { billable_mid: "$.data.billable_filing_count", invoice_mid: "$.data.invoice_total_cents" }
            - call: "POST /disclosure/filings/${f2_id}/confirm"
              payload: { repository_receipt_id: "EMMA-HA-2026-0002" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { f2_status2: "$.data.status" }
            - call: "GET /disclosure/filings/${f1_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { f1_status1: "$.data.status", f1_superseded_by: "$.data.superseded_by_filing_id", f1_receipt: "$.data.repository_receipt_id" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { billable2: "$.data.billable_filing_count", invoice2: "$.data.invoice_total_cents" }
            - call: "GET /disclosure/material-event-notices/${notice_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { notice_status2: "$.data.status", notice_days2: "$.data.days_late", notice_filed2: "$.data.filed_filing_id" }
            - call: "GET /disclosure/failure-to-file-events?undertaking_id=${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { fte_total: "$.total_count" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { posture2: "$.data.compliance_posture", risk2: "$.data.disclosure_risk_score" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_id}", supersedes_filing_id: "${f1_id}", correction_reason: "Second attempt to supersede the same predecessor.", expected_issue_version: "${iv2}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_supersede: "$.data.error_id" }
          assert:
            - "${notice_perse} == true and ${notice_deadline} == \"2026-08-14\""
            - "${billable0} == 0 and ${invoice0} == 400000 at engagement creation (retainer only, above the 300000 floor)"
            - "${f1_status0} == CONFIRMED, ${billable1} == 1, ${invoice1} == 445000 (400000 + 45000)"
            - "${notice_status1} == FILED_TIMELY, ${notice_days1} == 0, ${notice_filed1} == \"${f1_id}\""
            - "${f2_status0} == DRAFT, ${f2_super} == \"${f1_id}\", ${f2_reason} == \"Called maturities table omitted two CUSIPs.\" — the correction clears priority 28's discharged-state exception even though the notice is no longer MATERIAL"
            - "${f2_status1} == SUBMITTED, and ${billable_mid} == 1 with ${invoice_mid} == 445000 — a SUBMITTED corrector is not yet billable, so the number holds while both filings are live"
            - "${f2_status2} == CONFIRMED and ${f1_status1} == SUPERSEDED with ${f1_superseded_by} == \"${f2_id}\""
            - "${f1_receipt} == \"EMMA-HA-2026-0001\" — the predecessor keeps its own receipt id; the two receipts are distinct so priority 33's uniqueness rule is satisfied"
            - "${billable2} == 1 — NOT 2: the predecessor left status CONFIRMED in the same request the corrector entered it"
            - "${invoice2} == 445000 — NOT 490000; the conserved quantity is unchanged to the cent across two confirmations"
            - "${notice_status2} == FILED_TIMELY and ${notice_days2} == 0 — cascade hop 1 was skipped, so the discharged subject's timeliness was not re-derived at the later clock"
            - "${notice_filed2} == \"${f2_id}\" — the only field the supersede touches on the subject is the pointer to the current document"
            - "${fte_total} == 0 and ${posture2} == COMPLIANT with ${risk2} == 0.00 — a correction mints no failure event and cannot trigger the surcharge"
            - "${err_supersede} == ERR_SUPERSEDE_TARGET_INVALID with HTTP 409 — the predecessor is already superseded, so the invariant cannot be broken by a second corrector chained onto the same target"
