  - section: endpoints
    instances:
      - name: corner_volunteer_group_create_read_and_missing_id
        claim_type: standard_crud
        grounds: ["endpoints[POST /volunteer-groups]", "endpoints[GET /volunteer-groups/{id}]", "errors[ERR_VOLUNTEER_GROUP_NOT_FOUND]"]
        distinguishing_aspect: "The VolunteerGroup pair round-trips the skill_profile map and the two booleans unchanged, and a well-formed but unknown UUID returns 404 ERR_VOLUNTEER_GROUP_NOT_FOUND rather than 500 or an empty 200."
        test_recipe:
          setup:
            - "No prior state beyond the pinned clock."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /volunteer-groups
              payload: { group_name: "Group Tango", home_organization: "Tango Baptist", member_count: 9, skill_profile: { ROOFING: 3, DRYWALL: 4, GENERAL_LABOR: 9 }, requires_housing: true, brings_own_tools: false }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { gt41: "$.data.id" }
            - call: GET /volunteer-groups/{id}
              payload: {}
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: GET /volunteer-groups/{id}
              payload: {}
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { e: "$.data.error_id" }
          assert:
            - "The create returns HTTP 201 with member_count 9, skill_profile exactly {ROOFING: 3, DRYWALL: 4, GENERAL_LABOR: 9}, requires_housing true, brings_own_tools false and version 1."
            - "The read of ${gt41} returns HTTP 200 with the identical payload."
            - "The read of the unknown id 00000000-0000-4000-8000-0000000000ff returns HTTP 404 with data.error_id == 'ERR_VOLUNTEER_GROUP_NOT_FOUND'."
      - name: corner_housing_assignment_links_a_group_to_a_site_and_both_must_exist
        claim_type: cross_reference_link
        grounds: ["endpoints[POST /housing-assignments]", "errors[ERR_LODGING_SITE_NOT_FOUND]"]
        distinguishing_aspect: "The link is validated on the body FK, not just the group: a request naming an unknown lodging_site_id must return 404 ERR_LODGING_SITE_NOT_FOUND, and the successful link must both expose the association and move the site's derived bed counters."
        test_recipe:
          setup:
            - "One LodgingSite with bed_capacity 10 and one group of 4 volunteers who require housing."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
