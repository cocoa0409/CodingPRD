              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
