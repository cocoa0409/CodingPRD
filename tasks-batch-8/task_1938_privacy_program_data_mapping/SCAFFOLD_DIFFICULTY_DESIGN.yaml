# =============================================================================
# Scaffold Difficulty Design (§1.8) — Test Targeting Index
# task_1938_privacy_program_data_mapping
# 9 rules x >=2 instances = 23 instances. All literals pre-computed from
# SCAFFOLD.yaml constants; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: activity_risk_screening_vs_comprehensive
        grounds:
          - calculations.activity_risk_score
          - entities.ProcessingActivity.fields.risk_score
          - entities.PrivacyImpactAssessment.fields.final_score
        distinguishing_aspect: |
          Two valid scoring algorithms run on the SAME ProcessingActivity domain data:
          screening stores max-based 475 on the activity, comprehensive stores sum-based
          750 on the PIA — identical inputs, different numbers, different storage fields.
        test_recipe:
          setup:
            - "Vendor Medidata processes [HEALTH] -> risk_tier HIGH (exposure 150)"
            - "Elements bank_acct FINANCIAL/CONFIDENTIAL (200*1.5=300) and health_rec HEALTH/INTERNAL (300*1.0=300)"
            - "Activity links both elements + vendor: screening = max(300,300) + 25*1 + 150 = 475 (< 500, no auto-PIA)"
            - "Manual PIA created and submitted by bo-1"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "bank_acct", category: FINANCIAL, classification: CONFIDENTIAL }
              as: DataSteward
              captures: { e_bank: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "health_rec", category: HEALTH, classification: INTERNAL }
              as: DataSteward
              captures: { e_health: $.data.id }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "Medidata", home_region: EU, processes_categories: [HEALTH] }
              as: VendorManager
              captures: { v_high: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Claims analytics", business_unit: "Analytics", notice_scope: WEBSITE, data_element_ids: ["${e_bank}", "${e_health}"], vendor_id: "${v_high}" }
              as: DataSteward
              captures: { a_id: $.data.id, a_risk: $.data.risk_score }
            - call: "POST /privacy/processing-activities/${a_id}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia_id: $.data.id }
            - call: "POST /privacy/assessments/${pia_id}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
          trigger:
            - call: "POST /privacy/assessments/${pia_id}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { pia_final: $.data.final_score, pia_status: $.data.status }
          assert:
            - "ProcessingActivity.${a_id}.risk_score == 475 (screening: max(300,300)+25+150)"
            - "PrivacyImpactAssessment.${pia_id}.final_score == 750 (comprehensive: 300+300+150+0, no CONSENT purpose)"
            - "PrivacyImpactAssessment.${pia_id}.status == APPROVED"
            - "750 != 475 — the two variants diverge on identical inputs"

      - name: request_deadline_provisional_vs_final
        grounds:
          - calculations.request_deadline
          - entities.RightsRequest.fields.provisional_due_at
          - entities.RightsRequest.fields.final_due_at
        distinguishing_aspect: |
          Dual-variant deadline on the RightsRequest domain (distinct from the
          ProcessingActivity domain of the sibling instance): provisional omits the
          extension, final adds 45 extension days for DELETION only — same consumer,
          same rule, different dates per variant and per request_type.
        test_recipe:
          setup:
            - "CA rule: deadline 45d, extension 45d, records threshold 1; consumer in CA"
            - "Applicability run: count 1 >= 1 -> applies true, so the CA rule governs"
            - "Logical clock unset: request created_at == 2026-08-01T00:00:00.000Z"
            - "DELETION and ACCESS requests created (INTAKE/UNVERIFIED)"
          setup_api_calls:
            - call: "POST /privacy/state-law-rules"
              payload: { state_code: "CA", law_name: "CCPA", resident_records_threshold: 1, revenue_share_threshold_pct: 100.0, request_deadline_days: 45, extension_days: 45 }
              as: PrivacyAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /privacy/consumers"
              payload: { email: "ca@x.com", full_name: "CA One", state_code: "CA" }
              as: PrivacyAdmin
              captures: { cons_ca: $.data.id }
            - call: "POST /privacy/applicability-evaluations/run"
              payload: { state_revenues: { CA: 0 }, total_revenue_cents: 1000 }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers/${cons_ca}/rights-requests"
              payload: { request_type: DELETION, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons_ca}"
              captures: { req_del: $.data.id, prov_del: $.data.provisional_due_at, appl_del: $.data.applicable_state_code }
            - call: "POST /privacy/consumers/${cons_ca}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons_ca}"
              captures: { req_acc: $.data.id, prov_acc: $.data.provisional_due_at }
          trigger:
            - call: "POST /privacy/rights-requests/${req_del}/verify"
              payload: {}
              as: DataSteward
              captures: { fin_del: $.data.final_due_at }
            - call: "POST /privacy/rights-requests/${req_acc}/verify"
              payload: {}
              as: DataSteward
              captures: { fin_acc: $.data.final_due_at }
          assert:
            - "RightsRequest.${req_del}.provisional_due_at == 2026-09-15T00:00:00.000Z (created_at + 45d)"
            - "RightsRequest.${req_del}.final_due_at == 2026-10-30T00:00:00.000Z (created_at + 45d + 45d extension)"
            - "RightsRequest.${req_acc}.final_due_at == 2026-09-15T00:00:00.000Z (ACCESS gets no extension; final == provisional)"
            - "RightsRequest.${req_del}.applicable_state_code == CA"
            - "${fin_del} != ${prov_del} while ${fin_acc} == ${prov_acc}"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_formula_mode_a_cap_and_conditionals
        grounds:
          - calculations.activity_risk_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (4 element weights x multipliers, element count
          surcharge, conditional vendor exposure) with non-linear max() aggregation and
          a nested min() cap — uncapped value 1025 must be capped to 1000.
        test_recipe:
          setup:
            - "Elements: bio_fp 400*2.0=800, genome 300*2.0=600, minor_profile 350*2.0=700, gps 250*1.5=375"
            - "Vendor HIGH (processes [HEALTH]) -> exposure 150"
            - "screening = min(1000, max(800,600,700,375) + 25*(4-1) + 150) = min(1000, 1025) = 1000"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "bio_fp", category: BIOMETRIC, classification: RESTRICTED }
              as: DataSteward
              captures: { e_bio: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "genome", category: HEALTH, classification: RESTRICTED }
              as: DataSteward
              captures: { e_gen: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "minor_profile", category: MINOR_DATA, classification: RESTRICTED }
              as: DataSteward
              captures: { e_min: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "gps", category: PRECISE_LOCATION, classification: CONFIDENTIAL }
              as: DataSteward
              captures: { e_gps: $.data.id }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "HealthCorp", home_region: US, processes_categories: [HEALTH] }
              as: VendorManager
              captures: { v_h: $.data.id }
          trigger:
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Genomics research", business_unit: "R&D", notice_scope: EMPLOYEE, data_element_ids: ["${e_bio}", "${e_gen}", "${e_min}", "${e_gps}"], vendor_id: "${v_h}" }
              as: DataSteward
              captures: { a_id: $.data.id, a_risk: $.data.risk_score, a_pia_req: $.data.pia_required }
            - call: "GET /privacy/processing-activities/${a_id}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia_reason: "$.data[0].trigger_reason", pia_status: "$.data[0].status" }
          assert:
            - "ProcessingActivity.${a_id}.risk_score == 1000 (min cap applied; uncapped 1025)"
            - "ProcessingActivity.${a_id}.pia_required == true"
            - "assessments[0].trigger_reason == RISK_THRESHOLD (auto-created)"
            - "assessments[0].status == TRIGGERED"

      - name: applicability_revenue_share_rounding_mode_b
        grounds:
          - calculations.state_law_applicability
          - entities.ApplicabilityEvaluation.fields.revenue_share_pct
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned order is
          divide-raw-cents then round_half_up once to 2dp (33.335% -> 33.34, applies);
          the forbidden round-down/truncate order yields 33.33 (< 33.34, not applicable).
        test_recipe:
          setup:
            - "NV rule: records threshold 100000 (count path unreachable with 1 consumer), revenue threshold 33.34"
            - "Run inputs: NV revenue 6667 of total 20000 -> 100*6667/20000 = 33.335 exactly"
          setup_api_calls:
            - call: "POST /privacy/state-law-rules"
              payload: { state_code: "NV", law_name: "SB 370", resident_records_threshold: 100000, revenue_share_threshold_pct: 33.34, request_deadline_days: 45, extension_days: 30 }
              as: PrivacyAdmin
              captures: { rule_nv: $.data.id }
            - call: "POST /privacy/consumers"
              payload: { email: "nv@x.com", full_name: "NV One", state_code: "NV" }
              as: PrivacyAdmin
          trigger:
            - call: "POST /privacy/applicability-evaluations/run"
              payload: { state_revenues: { NV: 6667 }, total_revenue_cents: 20000 }
              as: PrivacyAdmin
              captures: { run_count: $.data.evaluation_count }
            - call: "GET /privacy/applicability-evaluations?state_law_rule_id=${rule_nv}"
              payload: { state_law_rule_id: "${rule_nv}" }
              as: PrivacyAdmin
              captures: { nv_share: "$.data[0].revenue_share_pct", nv_applies: "$.data[0].applies", nv_count: "$.data[0].resident_consumer_count" }
          assert:
            - "ApplicabilityEvaluation.revenue_share_pct == 33.34 (round_half_up of 33.335, exactly one rounding step)"
            - "ApplicabilityEvaluation.applies == true (33.34 >= 33.34)"
            - "ApplicabilityEvaluation.resident_consumer_count == 1 (count path alone would fail: 1 < 100000)"
            - "run response evaluation_count == 1"

      - name: pia_gating_no_feedback_mode_c
        grounds:
          - calculations.pia_gating_order
          - calculations.activity_risk_score
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (approval writes final_score that looks
          like risk; risk gates pia_required; pia_required gates activation) resolved by
          pinned evaluation order — approval recomputes comprehensive 650 >= 500 yet
          pia_required stays false and activation proceeds.
        test_recipe:
          setup:
            - "Notice published in WEBSITE scope (backs the CONSENT purpose)"
            - "Activity links bank_acct(300)+health_rec(300), NO vendor: screening = 300 + 25 = 325 -> pia_required false"
            - "CONSENT purpose pinned to the notice; manual PIA submitted by bo-1"
          setup_api_calls:
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "Site v1", body: "body", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n1: $.data.id }
            - call: "POST /privacy/notices/${n1}/publish"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "bank_acct", category: FINANCIAL, classification: CONFIDENTIAL }
              as: DataSteward
              captures: { e_bank: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "health_rec", category: HEALTH, classification: INTERNAL }
              as: DataSteward
              captures: { e_health: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Marketing analytics", business_unit: "Growth", notice_scope: WEBSITE, data_element_ids: ["${e_bank}", "${e_health}"] }
              as: DataSteward
              captures: { a_id: $.data.id, a_risk: $.data.risk_score, a_pia_req: $.data.pia_required }
            - call: "POST /privacy/processing-activities/${a_id}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONSENT, retention_policy_id: "${rp1}" }
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a_id}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
          trigger:
            - call: "POST /privacy/assessments/${pia}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { pia_final: $.data.final_score }
            - call: "GET /privacy/processing-activities/${a_id}"
              payload: {}
              as: DataSteward
              captures: { a_pia_after: $.data.pia_required }
            - call: "POST /privacy/processing-activities/${a_id}/activate"
              payload: {}
              as: DataSteward
              captures: { a_status: $.data.status }
          assert:
            - "PrivacyImpactAssessment.${pia}.final_score == 650 (comprehensive: 300+300+0+50 CONSENT adjustment)"
            - "ProcessingActivity.${a_id}.pia_required == false after approval — comprehensive 650 >= 500 NEVER feeds back into gating"
            - "POST activate succeeds: ProcessingActivity.${a_id}.status == ACTIVE"

  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_review_cycle
        grounds:
          - state_machines.PrivacyImpactAssessment.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.PrivacyImpactAssessment.IN_REVIEW_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          Cycle on PrivacyImpactAssessment: IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW
          re-entry is legal (loop), unlike a linear approve-only pipeline; the machine
          terminates APPROVED only after the second submission.
        test_recipe:
          setup:
            - "Activity with a single BASIC_CONTACT/INTERNAL element: screening risk 50, no auto-PIA"
            - "Manual PIA created -> TRIGGERED"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
          trigger:
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
              captures: { st1: $.data.status }
            - call: "POST /privacy/assessments/${pia}/request-changes"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { st2: $.data.status }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
              captures: { st3: $.data.status, sub_by: $.data.submitted_by_user_id }
            - call: "POST /privacy/assessments/${pia}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { st4: $.data.status, fin: $.data.final_score }
          assert:
            - "status sequence == IN_REVIEW, CHANGES_REQUESTED, IN_REVIEW, APPROVED (cycle traversed)"
            - "submitted_by_user_id == bo-1 after resubmission"
            - "final_score == 50 (comprehensive: sum 50, no vendor, no CONSENT purpose)"

      - name: rights_request_parallel_dimensions
        grounds:
          - state_machines.RightsRequest.UNVERIFIED_to_VERIFIED
          - state_machines.RightsRequest.INTAKE_to_ROUTED
          - state_machines.RightsRequest.READY_TO_RESPOND_to_COMPLETED
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: verification_status and fulfillment_status
          evolve independently (verify leaves fulfillment at INTAKE; routing requires
          VERIFIED), with compound bubble-ups from RequestTask children driving
          ROUTED -> IN_PROGRESS -> READY_TO_RESPOND.
        test_recipe:
          setup:
            - "Consumer in TX (no StateLawRule -> default deadlines 45/30)"
            - "Systems: sys-a stores [FINANCIAL]; sys-b stores [FINANCIAL, HEALTH]; sys-c stores [BIOMETRIC]"
            - "request1 ACCESS [FINANCIAL] created UNVERIFIED/INTAKE"
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-a", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-b", hosting_region: US, stores_categories: [FINANCIAL, HEALTH] }
              as: PrivacyAdmin
              captures: { sys_b: $.data.id }
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-c", hosting_region: US, stores_categories: [BIOMETRIC] }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [FINANCIAL] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req1: $.data.id }
          trigger:
            - call: "POST /privacy/rights-requests/${req1}/route"
              payload: {}
              as: DataSteward
              captures: { err_route: $.data.error_id }
            - call: "POST /privacy/rights-requests/${req1}/fail-verification"
              payload: {}
              as: DataSteward
              captures: { v1: $.data.verification_status, f1: $.data.fulfillment_status }
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [FINANCIAL] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req2: $.data.id }
            - call: "POST /privacy/rights-requests/${req2}/verify"
              payload: {}
              as: DataSteward
              captures: { v2: $.data.verification_status, f2: $.data.fulfillment_status }
            - call: "POST /privacy/rights-requests/${req2}/route"
              payload: {}
              as: DataSteward
              captures: { f3: $.data.fulfillment_status }
            - call: "GET /privacy/rights-requests/${req2}/tasks"
              payload: {}
              as: DataSteward
              captures: { t0: "$.data[0].id", t0_sys: "$.data[0].data_system_id", t1: "$.data[1].id" }
            - call: "POST /privacy/tasks/${t0}/start"
              payload: {}
              as: DataSteward
            - call: "GET /privacy/rights-requests/${req2}"
              payload: {}
              as: DataSteward
              captures: { f4: $.data.fulfillment_status }
            - call: "POST /privacy/tasks/${t0}/complete"
              payload: { outcome_notes: "exported" }
              as: DataSteward
            - call: "GET /privacy/rights-requests/${req2}"
              payload: {}
              as: DataSteward
              captures: { f5: $.data.fulfillment_status }
            - call: "POST /privacy/tasks/${t1}/start"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/tasks/${t1}/complete"
              payload: {}
              as: DataSteward
            - call: "GET /privacy/rights-requests/${req2}"
              payload: {}
              as: DataSteward
              captures: { f6: $.data.fulfillment_status }
            - call: "POST /privacy/rights-requests/${req2}/respond"
              payload: {}
              as: DataSteward
              captures: { f7: $.data.fulfillment_status }
          assert:
            - "route while UNVERIFIED -> error_id ERR_REQUEST_NOT_VERIFIED"
            - "fail-verification: verification_status == VERIFICATION_FAILED AND fulfillment_status == DENIED (cross-dimension cascade)"
            - "verify on req2: verification_status == VERIFIED but fulfillment_status stays INTAKE (dimension independence)"
            - "route: fulfillment_status == ROUTED; exactly 2 tasks created; sys-c excluded (no category intersection)"
            - "tasks[0].data_system_id == ${sys_a} (created_at tie under fixed clock -> system_key ASC: sys-a < sys-b)"
            - "first task start bubbles request ROUTED -> IN_PROGRESS; completing one of two leaves IN_PROGRESS"
            - "after both tasks COMPLETED: fulfillment_status == READY_TO_RESPOND; respond -> COMPLETED"

      - name: transfer_suspend_reinstate_cycle
        grounds:
          - state_machines.CrossBorderTransfer.APPROVED_to_SUSPENDED
          - state_machines.CrossBorderTransfer.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          Cycle on CrossBorderTransfer (a different entity than the PIA and
          RightsRequest instances): APPROVED -> SUSPENDED -> APPROVED driven entirely by
          system cascades (notice publish supersession, then retract compensation).
        test_recipe:
          setup:
            - "Vendor DataPro STANDARD ([FINANCIAL]) APPROVED with EXECUTED contract c1 (clauses DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT)"
            - "System sys-crm US ACTIVE; activity WEBSITE with email element (risk 125 incl. vendor exposure), CONSENT purpose pinned to published notice n1, ACTIVE"
            - "Transfer t1 (sys-crm -> EU, SCC_2021, [2026-03-01, 2026-09-01)) APPROVED"
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [FINANCIAL] }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /privacy/vendors/${v_id}/submit-assessment"
              payload: {}
              as: VendorManager
              captures: { v_ver: $.data.version }
            - call: "POST /privacy/vendors/${v_id}/contracts"
              payload: { provided_clauses: [DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c1: $.data.id }
            - call: "POST /privacy/contracts/${c1}/verify"
              payload: {}
              as: LegalCounsel
            - call: "POST /privacy/contracts/${c1}/execute"
              payload: {}
              as: VendorManager
            - call: "POST /privacy/vendors/${v_id}/approve"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-crm", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
              captures: { s1: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "v1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n1: $.data.id }
            - call: "POST /privacy/notices/${n1}/publish"
              payload: {}
