# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 3201: Household Verification & Extra Member Administration
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7; stubs mark corners already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml instances.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: account_creation_defaults
        claim_type: defaults
        grounds:
          - entities.Account.fields.status
          - entities.Account.fields.verification_posture
          - entities.Account.fields.billing_anchor_day
        distinguishing_aspect: |
          A freshly created account at the default logical clock
          2026-09-01T00:00:00Z starts ACTIVE / VERIFIED with version 1,
          billing_anchor_day 1 (day-of-month), zeroed billing accumulators,
          and a server-created OWNER member.
        test_recipe:
          setup: ["empty database; logical clock untouched at the 2026-09-01T00:00:00Z default"]
          setup_api_calls: []
          trigger:
            - call: "POST /hv/accounts"
              payload: { email: "corner-acct@x.com", region_code: "APAC", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id, st: $.data.status, posture: $.data.verification_posture, ver: $.data.version, anchor: $.data.billing_anchor_day, billed: $.data.extra_member_billed_cents, net: $.data.extra_member_net_revenue_cents }
          assert:
            - "st == ACTIVE"
            - "posture == VERIFIED"
            - "ver == 1"
            - "anchor == 1"
            - "billed == 0 and net == 0"
            - "GET /hv/members/${owner_id} returns member_role == OWNER and status == ACTIVE"

      - name: account_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: |
          Reading a well-formed but nonexistent account id yields
          ERR_ACCOUNT_NOT_FOUND with HTTP 404, not a generic error.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hv/accounts/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_NOT_FOUND"

      - name: member_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Member.fields.display_name
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Omitting the required display_name on member creation is rejected
          with ERR_VALIDATION (400) before any state or business check.
        test_recipe:
          setup: ["NA STANDARD account exists"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-req@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/members"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "GET /hv/accounts/${acc_id}/members returns total_count == 1 (owner only)"

      - name: member_list_pagination
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The members list honors limit/offset: with 3 members, limit=2 yields
          total_count 3 and has_more true; offset=2 yields the final page with
          has_more false.
        test_recipe:
          setup: ["NA STANDARD account with owner plus two HOUSEHOLD members"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-page@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/members"
              payload: { display_name: "Pat" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/accounts/${acc_id}/members"
              payload: { display_name: "Sam" }
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /hv/accounts/${acc_id}/members?limit=2&offset=0"
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /hv/accounts/${acc_id}/members?limit=2&offset=2"
              as: AccountOwner
              as_user_id: "${owner_id}"
          assert:
            - "first page returns 2 data items with total_count == 3 and has_more == true"
            - "second page returns 1 data item with total_count == 3 and has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: device_removed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Device
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          REMOVED is terminal: trusting a removed device is rejected with
          ERR_INVALID_STATE even though its last signals would score 100.
        test_recipe:
          setup: ["NA STANDARD account, household fp-home-1/geo-home-1, one device that was TRUSTED then REMOVED"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-term@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/devices/${dev_id}/remove"
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Device.${dev_id}.trust_status == REMOVED"

      - name: slot_revoked_assign_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ExtraMemberSlot
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Assign is only valid from OFFERED: assigning a REVOKED slot (which
          must first be reoffered) is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup: ["NA STANDARD account with a slot purchased, assigned, then revoked on the same day (full-credit window)"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-slot@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-slot@x.com", display_name: "Extra S", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/extra-member-slots/${slot_id}/revoke"
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-slot2@x.com", display_name: "Extra S2", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ExtraMemberSlot.${slot_id}.status == REVOKED"

      - name: travel_pass_convert_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.TravelPass.ACTIVE_to_CONVERTED
        distinguishing_aspect: |
          Conversion bypasses the 70-point confidence threshold: after the
          device signals from the household network, convert flips the pass to
          CONVERTED and the device to TRUSTED, incrementing
          household.trusted_device_count to 1.
        test_recipe:
          setup:
            - "NA STANDARD account, household fp-home-1/geo-home-1, one UNTRUSTED device registered from away network fp-away-1/geo-away-1"
            - "device holds an ACTIVE 14-day pass and has since signaled from the home network"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-conv@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Phone", device_type: "MOBILE", network_fingerprint: "fp-away-1", geo_cell: "geo-away-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_14D", starts_at: "2026-09-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { pass_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/signal"
              payload: { network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/travel-passes/${pass_id}/convert"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { st: $.data.status }
          assert:
            - "st == CONVERTED"
            - "Device.${dev_id}.trust_status == TRUSTED"
            - "Household.${hh_id}.trusted_device_count == 1"

      - name: household_relocation_untrust_cycle
        claim_type: side_effect_execution
        grounds:
          - state_machines.Household.ESTABLISHED_to_RELOCATING
          - state_machines.Household.RELOCATING_to_ESTABLISHED
        distinguishing_aspect: |
          Relocating the household anchor untrusts its devices (cascade down)
          and the first signal matching the NEW fingerprint returns the
          household to ESTABLISHED with last_verified_at stamped — the
          household machine's cyclic path.
        test_recipe:
          setup: ["NA STANDARD account, household fp-home-1/geo-home-1 with one TRUSTED device"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-relo@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/households/${hh_id}/relocate"
              payload: { primary_location: "9 Oak Ave", network_fingerprint: "fp-home-2", geo_cell: "geo-home-2" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_status: $.data.status }
            - call: "POST /hv/devices/${dev_id}/signal"
              payload: { network_fingerprint: "fp-home-2", geo_cell: "geo-home-2" }
              as: AccountOwner
              as_user_id: "${owner_id}"
          assert:
            - "hh_status == RELOCATING"
            - "Device.${dev_id}.trust_status == UNTRUSTED"
            - "Household.${hh_id}.status == ESTABLISHED after the matching signal"
            - "Household.${hh_id}.last_verified_at == 2026-09-01T00:00:00Z"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: standard_tier_uhd_rejected_hd_granted
        claim_type: violation_to_error
        grounds:
          - calculations.stream_admission_decision
          - errors[ERR_RESOLUTION_NOT_ENTITLED]
        distinguishing_aspect: |
          Resolution entitlement is enforced at play time: on STANDARD a UHD
          request is rejected with ERR_RESOLUTION_NOT_ENTITLED while an
          otherwise identical HD request is granted with
          resolution_granted == HD.
        test_recipe:
          setup: ["NA STANDARD account, household, one TRUSTED device"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-res@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/members/${owner_id}/playback-sessions"
              payload: { device_id: "${dev_id}", requested_resolution: "UHD" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "POST /hv/members/${owner_id}/playback-sessions"
              payload: { device_id: "${dev_id}", requested_resolution: "HD" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { granted: $.data.resolution_granted }
          assert:
            - "err == ERR_RESOLUTION_NOT_ENTITLED"
            - "granted == HD"
            - "Member.${owner_id}.current_streams == 1"

      - name: churn_summary_gross_vs_net
        claim_type: variant_divergence
        grounds:
          - calculations.churn_rate_estimate
        distinguishing_aspect: |
          With 2 churn signals, 1 winback, and an ACTIVE account, the
          denominator is 4: gross_churn_rate == 0.5 while net_churn_rate ==
          0.25 — both variants of the same aggregation reported side by side.
        test_recipe:
          setup: ["NA STANDARD account with two CHURN_SIGNAL and one WINBACK metrics recorded"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-churn@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /hv/accounts/${acc_id}/enforcement-metrics"
              payload: { metric_type: "CHURN_SIGNAL", notes: "exit survey" }
              as: SupportAgent
            - call: "POST /hv/accounts/${acc_id}/enforcement-metrics"
              payload: { metric_type: "CHURN_SIGNAL", notes: "cancel intent" }
              as: SupportAgent
            - call: "POST /hv/accounts/${acc_id}/enforcement-metrics"
              payload: { metric_type: "WINBACK", notes: "returned" }
              as: SupportAgent
          trigger:
            - call: "GET /hv/accounts/${acc_id}/churn-summary"
              as: SupportAgent
              captures: { gross: $.data.gross_churn_rate, net: $.data.net_churn_rate, cs: $.data.churn_signals, wb: $.data.winbacks, af: $.data.active_flag }
          assert:
            - "cs == 2 and wb == 1 and af == 1"
            - "gross == 0.5"
            - "net == 0.25"
            - "gross != net"

      - name: travel_pass_ends_at_computed
        claim_type: computed_fields
        grounds:
          - entities.TravelPass.fields.ends_at
        distinguishing_aspect: |
          ends_at is system-computed from grant_type: a TEMPORARY_30D pass
          starting 2026-09-01T00:00:00Z ends exactly 2026-10-01T00:00:00Z; any
          client-supplied ends_at is impossible (not in the input schema).
        test_recipe:
          setup: ["NA STANDARD account, household, one device"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-ends@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Phone", device_type: "MOBILE", network_fingerprint: "fp-away-1", geo_cell: "geo-away-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_30D", starts_at: "2026-09-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { ends: $.data.ends_at, st: $.data.status }
          assert:
            - "ends == 2026-10-01T00:00:00Z"
            - "st == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request whose role header is not a declared role is rejected with
          ERR_UNAUTHENTICATED (401) before any authorization, existence, or
          business check runs.
        test_recipe:
          setup: ["one account exists so the path id is valid"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-auth@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
          trigger:
            - call: "GET /hv/accounts/${acc_id}"
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: extra_member_cannot_add_member_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
          - roles[ExtraMember]
        distinguishing_aspect: |
          Member creation is an AccountOwner exclusive operation; an
          ExtraMember caller on the same account is rejected with
          ERR_FORBIDDEN (403).
        test_recipe:
          setup: ["NA STANDARD account with a slot assigned to an extra member"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-rbac1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-rbac1@x.com", display_name: "Extra R1", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { extra_id: $.data.member_id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/members"
              payload: { display_name: "Nope" }
              as: ExtraMember
              as_user_id: "${extra_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"
            - "GET /hv/accounts/${acc_id}/members returns total_count == 2"

      - name: device_not_found_beats_suspended_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_DEVICE_NOT_FOUND]
        distinguishing_aspect: |
          Existence (priority 4) outranks account state (priority 6): a
          playback request naming a nonexistent device on a SUSPENDED account
          returns ERR_DEVICE_NOT_FOUND, not ERR_ACCOUNT_SUSPENDED.
        test_recipe:
          setup: ["NA STANDARD account created then suspended"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-prio@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/suspend"
              as: PlatformAdmin
          trigger:
            - call: "POST /hv/members/${owner_id}/playback-sessions"
              payload: { device_id: "00000000-0000-0000-0000-000000000000", requested_resolution: "HD" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEVICE_NOT_FOUND"
            - "err != ERR_ACCOUNT_SUSPENDED"

      - name: invalid_enum_plan_tier_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=1]
          - entities.Account.fields.plan_tier
        distinguishing_aspect: |
          plan_tier "GOLD" is outside the declared enum set {BASIC, STANDARD,
          PREMIUM} and is rejected with ERR_VALIDATION (400).
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /hv/accounts"
              payload: { email: "corner-enum@x.com", region_code: "NA", plan_tier: "GOLD" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope.success
        distinguishing_aspect: |
          A successful object read carries meta.api_request_id,
          meta.api_request_timestamp, response_type == "object", and the
          entity under data.
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-env@x.com", region_code: "LATAM", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
          trigger:
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { rt: $.response_type }
          assert:
            - "response body has meta.api_request_id and meta.api_request_timestamp"
            - "rt == object"
            - "data.id == ${acc_id}"

      - name: error_envelope_shape_on_not_found
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: |
          An error response carries response_type == "error" and
          data.error_id / data.message — never a bare status code.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hv/accounts/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { rt: $.response_type, err: $.data.error_id, msg: $.data.message }
          assert:
            - "rt == error"
            - "err == ERR_ACCOUNT_NOT_FOUND"
            - "msg is a non-empty string"

      - name: second_household_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=14]
          - errors[ERR_ACCOUNT_ALREADY_HAS_HOUSEHOLD]
        distinguishing_aspect: |
          An account supports exactly one non-DISSOLVED household: the second
          create is rejected with ERR_ACCOUNT_ALREADY_HAS_HOUSEHOLD.
        test_recipe:
          setup: ["NA STANDARD account that already has an ESTABLISHED household"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-hh2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Cabin", primary_location: "7 Lake Rd", network_fingerprint: "fp-cabin-1", geo_cell: "geo-cabin-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_ALREADY_HAS_HOUSEHOLD"
            - "GET /hv/accounts/${acc_id}/households returns total_count == 1"

      - name: device_confidence_computed_read
        claim_type: computed_read
        grounds:
          - calculations.household_match_confidence_pct
        excluded_because:
          difficulty_instance: household_confidence_strict_vs_lenient
          rationale: "The confidence computed read (network_match, geo_match, recency_score, strict_pct, lenient_pct) is asserted verbatim as the failure path of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: extra_member_region_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_REGION_MISMATCH]
        distinguishing_aspect: |
          Assigning a slot with member_region EMEA on an NA account is
          rejected with ERR_REGION_MISMATCH (422); the slot stays OFFERED.
        test_recipe:
          setup: ["NA STANDARD account with one purchased OFFERED slot"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-region@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-region@x.com", display_name: "Extra Reg", member_region: "EMEA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REGION_MISMATCH"
            - "ExtraMemberSlot.${slot_id}.status == OFFERED"

      - name: profile_transfer_target_self_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_TRANSFER_TARGET_SELF]
        distinguishing_aspect: |
          A transfer whose target_email equals the source account's email is
          rejected with ERR_TRANSFER_TARGET_SELF (422) at initiation.
        test_recipe:
          setup: ["NA STANDARD account with an extra member assigned"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-self@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-self@x.com", display_name: "Extra Self", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { extra_id: $.data.member_id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/profile-transfers"
              payload: { member_id: "${extra_id}", target_email: "corner-self@x.com" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRANSFER_TARGET_SELF"
            - "GET /hv/accounts/${acc_id}/profile-transfers returns total_count == 0"

      - name: periodic_challenge_blocked_during_grace
        claim_type: temporal_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_ENFORCEMENT_GRACE_ACTIVE]
          - state_machines.EnforcementPolicy
        distinguishing_aspect: |
          Regional enforcement timing: with an ACTIVE NA policy effective
          2026-09-10 and grace_days 7, a PERIODIC challenge on 2026-09-15 is
          rejected with ERR_ENFORCEMENT_GRACE_ACTIVE, while the same request
          on 2026-09-17 (grace elapsed) succeeds.
        test_recipe:
          setup:
            - "NA enforcement policy (enabled, grace_days 7, effective_from 2026-09-10T00:00:00Z) created and activated"
            - "NA STANDARD account exists"
          setup_api_calls:
            - call: "POST /hv/enforcement-policies"
              payload: { region_code: "NA", enforcement_enabled: true, grace_days: 7, messaging_variant: "SOFT", effective_from: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /hv/enforcement-policies/${pol_id}/activate"
              as: PlatformAdmin
            - call: "POST /hv/accounts"
              payload: { email: "corner-grace@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hv/accounts/${acc_id}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "PERIODIC" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hv/accounts/${acc_id}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "PERIODIC" }
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "err == ERR_ENFORCEMENT_GRACE_ACTIVE"
            - "st == PENDING"
            - "Account.${acc_id}.verification_posture == CHALLENGE_PENDING"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: support_agent_cannot_suspend
        claim_type: role_denied
        grounds:
          - roles[SupportAgent]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Suspend is a PlatformAdmin exclusive; a SupportAgent caller is
          rejected with ERR_FORBIDDEN and the account stays ACTIVE.
        test_recipe:
          setup: ["one ACTIVE account"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-sa@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/suspend"
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"
            - "Account.${acc_id}.status == ACTIVE"

      - name: extra_member_cannot_read_other_member
        claim_type: role_denied
        grounds:
          - roles[ExtraMember]
          - validations[priority=3]
        distinguishing_aspect: |
          Entity-backed ownership: an ExtraMember can read members of their
          own account (200) but reading a member of a different account is
          ERR_FORBIDDEN even though the role is on the endpoint's roles list.
        test_recipe:
          setup: ["account A with an assigned extra member; separate account B with its owner"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-xa@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_a: $.data.id, owner_a: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_a}"
              as: PlatformAdmin
              captures: { acc_a_v: $.data.version }
            - call: "POST /hv/accounts/${acc_a}/extra-member-slots"
              payload: { payer_member_id: "${owner_a}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_a_v}" }
              as: AccountOwner
              as_user_id: "${owner_a}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-xa@x.com", display_name: "Extra XA", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_a}"
              captures: { extra_id: $.data.member_id }
            - call: "POST /hv/accounts"
              payload: { email: "corner-xb@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_b: $.data.id, owner_b: $.data.owner_member_id }
          trigger:
            - call: "GET /hv/members/${owner_a}"
              as: ExtraMember
              as_user_id: "${extra_id}"
              captures: { ok_id: $.data.id }
            - call: "GET /hv/members/${owner_b}"
              as: ExtraMember
              as_user_id: "${extra_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ok_id == ${owner_a}"
            - "err == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_slot_purchase_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-purchase-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: |
          The second purchase carries the account version observed before the
          first purchase (which bumped it): rejected with 412
          ERR_STALE_ACCOUNT_VERSION; the first purchase succeeded and bumped
          version by exactly 1.
        test_recipe:
          setup: ["NA PREMIUM account (slot cap 2 so the cap never interferes)"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-occ1@x.com", region_code: "NA", plan_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot1: $.data.id }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { v_after: $.data.version }
          assert:
            - "ExtraMemberSlot.${slot1}.status == OFFERED"
            - "err == ERR_STALE_ACCOUNT_VERSION"
            - "v_after == acc_v + 1"
            - "Account.${acc_id}.extra_member_billed_cents == 599"

      - name: occ_transfer_accept_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-accept-stale]
          - errors[ERR_STALE_TRANSFER_VERSION]
        distinguishing_aspect: |
          The second accept carries the pre-acceptance transfer version: the
          OCC check (priority 5) fires before the state check (priority 7), so
          the stale accept is rejected with 412 ERR_STALE_TRANSFER_VERSION
          rather than ERR_INVALID_STATE.
        test_recipe:
          setup: ["NA STANDARD account with an extra member assigned and a transfer initiated; transfer version captured before acceptance"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-occ2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-occ2@x.com", display_name: "Extra O2", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { extra_id: $.data.member_id }
            - call: "POST /hv/accounts/${acc_id}/profile-transfers"
              payload: { member_id: "${extra_id}", target_email: "newhome-occ2@x.com" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { tr_id: $.data.id, tr_v: $.data.version }
          trigger:
            - call: "POST /hv/profile-transfers/${tr_id}/accept"
              payload: { new_account_email: "newhome-occ2@x.com", new_account_region: "NA", new_account_plan_tier: "BASIC", expected_profile_transfer_version: "${tr_v}" }
              as: PlatformAdmin
              captures: { st: $.data.status }
            - call: "POST /hv/profile-transfers/${tr_id}/accept"
              payload: { new_account_email: "newhome-occ2b@x.com", new_account_region: "NA", new_account_plan_tier: "BASIC", expected_profile_transfer_version: "${tr_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "st == COMPLETED"
            - "err == ERR_STALE_TRANSFER_VERSION"
            - "ProfileTransfer.${tr_id}.version == tr_v + 1"

      - name: billing_failure_lapses_slot
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ExtraMemberSlot.OFFERED_to_LAPSED
          - state_machines.Account.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          A failed billing event suspends the account and lapses its OFFERED
          slot in the same operation: slot LAPSED issues no credit and the
          account's billed/credit accumulators are untouched.
        test_recipe:
          setup: ["NA STANDARD account with one purchased OFFERED slot"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-bill@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /hv/_billing/simulate"
              payload: { account_id: "${acc_id}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "st == SUSPENDED"
            - "ExtraMemberSlot.${slot_id}.status == LAPSED"
            - "Account.${acc_id}.extra_member_billed_cents == 799"
            - "Account.${acc_id}.extra_member_credit_cents == 0"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: slot_purchase_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.extra_member_fee_cents
        distinguishing_aspect: |
          Immediate consistency: the purchase response already carries the
          computed price snapshot, and a read of the account in the same
          logical instant shows extra_member_billed_cents == 799 with no
          reconciliation delay.
        test_recipe:
          setup: ["NA STANDARD account created at the default clock (anchor day)"]
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "corner-imm@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { price: $.data.price_cents_snapshot }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { billed: $.data.extra_member_billed_cents, net: $.data.extra_member_net_revenue_cents }
          assert:
            - "price == 799"
            - "billed == 799"
            - "net == 799"
