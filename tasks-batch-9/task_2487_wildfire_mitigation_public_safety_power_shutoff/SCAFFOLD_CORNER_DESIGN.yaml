            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: GridPlanner
              captures: { v_after_create: $.data.version }
            - *k_fpi15
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: GridPlanner
              captures: { v_after_index: $.data.version }
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
