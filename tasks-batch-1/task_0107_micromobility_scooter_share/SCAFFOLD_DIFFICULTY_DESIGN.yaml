  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: end_completed_trip_in_no_ride_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Different category pair (state priority 6 vs business_safety priority 8). A single end request both
          (i) targets an already-COMPLETED trip — no end transition is defined from COMPLETED, violating the
          priority-6 state check — and (ii) supplies a NO_RIDE end zone, violating the priority-8 safety check.
          The lower-numbered state check fires first, so ERR_INVALID_STATE (409) wins over ERR_END_IN_NO_RIDE_ZONE.
        test_recipe:
          setup:
            - "a trip that has already been COMPLETED (ended once in a legal zone); a NO_RIDE zone also exists"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core7", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NoRide7", zone_type: "NO_RIDE", priority: 2 }
              as: PlatformAdmin
              captures: { zone_noride_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-I1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "i@x.com", full_name: "Rider I", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:02:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_noride_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409), not ERR_END_IN_NO_RIDE_ZONE (422): the priority-6 state check precedes the priority-8 safety check"

      - name: start_no_ride_safety_beats_vehicle_not_available_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Different category pair (business_safety priority 7 NO_RIDE-start vs business_constraint priority 10
          vehicle-not-available): a start request against a NON-AVAILABLE (MAINTENANCE) vehicle parked in a
          NO_RIDE zone returns the higher-priority safety error ERR_START_IN_NO_RIDE_ZONE (422) at priority 7,
          not the lower-priority ERR_VEHICLE_NOT_AVAILABLE (409) at priority 10.
        test_recipe:
          setup:
            - "a vehicle registered in a NO_RIDE zone and then sent to MAINTENANCE (so it is both NO_RIDE-located and non-AVAILABLE)"
            - "a funded rider attempts to unlock it"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NoRide8", zone_type: "NO_RIDE", priority: 2 }
              as: PlatformAdmin
              captures: { zone_noride_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-J1", battery_pct: 100, current_zone_id: "${zone_noride_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicles/${veh_id}/maintenance"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/riders"
              payload: { email: "j2@x.com", full_name: "Rider J2", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider2_id: $.data.id }
            - call: "POST /api/riders/${rider2_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider2_id}"
          trigger:
            - call: "POST /api/trips"
              payload: { rider_id: "${rider2_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_START_IN_NO_RIDE_ZONE (422), not ERR_VEHICLE_NOT_AVAILABLE (409): the priority-7 safety check precedes the priority-10 availability constraint"

