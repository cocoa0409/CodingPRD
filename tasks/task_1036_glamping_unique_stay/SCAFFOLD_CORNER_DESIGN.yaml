        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role header is absent/unknown -> ERR_UNAUTHENTICATED (401), checked before any resource lookup."
        test_recipe:
          setup: ["No auth headers supplied; test harness omits X-User-Role/X-User-ID on the trigger call."]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "When the harness sends NO auth headers, response error_id == ERR_UNAUTHENTICATED (this instance's transcription omits the role/id headers; the `as:` shown is a placeholder the generator drops for the no-header variant)."

