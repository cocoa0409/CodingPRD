# =========================================================================
# 1.9 Scaffold Corner Design  --  task_2237_direct_consumer_hearing_aid_remote
#
# Breadth probe. Walks references/claim-extraction-guide.md against
# SCAFFOLD.yaml §1.1-§1.7 and emits one executable instance per applicable
# row. Sections are exactly the nine guide sections; claim_type values are
# exactly the guide's row labels. Every instance is self-contained: the
# logical clock is pinned first, every ${var} is bound by an earlier
# captures:, and every assert: carries pre-computed literals.
#
# Shared abbreviations used in setup prose only (never in calls):
#   POLICY_CA = StatePolicy CA, OTC + telehealth permitted, min_age_years 18,
#               trial_period_days 45, FLAT_PCT 0.1, shipping_refundable false,
#               referral_validity_days 180, waiver_required false,
#               max_loss_damage_claims 2
# =========================================================================

scaffold_corner_design:

  # =====================================================================
  # SECTION 1 -- Entities  (guide: From Table 1)
  # =====================================================================
  - section: entities
    instances:

      - name: entity_state_policy_create_returns_201_with_all_declared_fields
        claim_type: creation
        grounds: [entities.StatePolicy, "endpoints.POST /state-policies"]
        distinguishing_aspect: "A StatePolicy created with every input field present echoes each one back verbatim alongside system fields id/version/created_at, so an implementation that silently drops restocking_fee_cap_cents or referral_validity_days fails."
        test_recipe:
          setup:
            - "Logical clock pinned to the scaffold default so created_at is deterministic."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.state_code == \"CA\""
            - "data.trial_period_days == 45"
            - "data.restocking_fee_mode == \"FLAT_PCT\""
            - "data.restocking_fee_pct == 0.1"
            - "data.shipping_refundable == false"
            - "data.referral_validity_days == 180"
            - "data.max_loss_damage_claims == 2"
            - "data.is_retired == false"
            - "data.version == 1"
            - "data.id is a non-empty string"

      - name: entity_patient_retrieval_returns_stored_row_by_id
        claim_type: retrieval
        grounds: [entities.Patient, "endpoints.GET /patients/{id}"]
        distinguishing_aspect: "GET /patients/{id} returns the exact row written by POST /patients, including the state_code denormalised from the referenced StatePolicy, so a handler that returns only the id or omits derived state_code fails."
        test_recipe:
          setup:
            - "POLICY_CA exists; one Patient registered against it by CareOpsAgent."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "ret1@x.test", full_name: "Ret One", age_years: 70 }, as: CareOpsAgent, captures: { pat_ret: "$.data.id" } }
          trigger:
            - { call: "GET /patients/${pat_ret}", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 200"
            - "data.id == ${pat_ret}"
            - "data.email == \"ret1@x.test\""
            - "data.full_name == \"Ret One\""
            - "data.age_years == 70"
            - "data.state_policy_id == ${pol_ca}"
            - "data.state_code == \"CA\""
            - "data.status == \"REGISTERED\""

      - name: entity_devices_listing_pagination_envelope_and_has_more
        claim_type: listing
        grounds: [entities.Device, "endpoints.GET /devices", response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With 3 devices and limit=2&offset=0 the envelope must report total_count 3 and has_more true while returning exactly 2 rows, so an implementation that sets has_more from the page length or omits total_count fails."
        test_recipe:
          setup:
            - "Exactly three Device rows exist on an otherwise empty device table."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-L001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-L002", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-L003", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /devices?limit=2&offset=0", payload: {}, as: PlatformAdmin }
          assert:
            - "HTTP 200"
            - "response_type == \"array\""
            - "len(data) == 2"
            - "limit == 2"
            - "offset == 0"
            - "total_count == 3"
            - "has_more == true"

      - name: entity_devices_listing_default_limit_is_ten_and_offset_zero
        claim_type: listing
        grounds: [entities.Device, "endpoints.GET /devices", response_envelope.pagination_defaults]
        distinguishing_aspect: "Omitting limit and offset entirely must apply the declared defaults limit 10 / offset 0 and echo them, so an implementation that returns all rows unpaginated or echoes null fails."
        test_recipe:
          setup:
            - "Exactly three Device rows exist."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-D001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-D002", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-D003", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /devices", payload: {}, as: PlatformAdmin }
          assert:
            - "HTTP 200"
            - "limit == 10"
            - "offset == 0"
            - "total_count == 3"
            - "has_more == false"
            - "len(data) == 3"

      - name: entity_patient_not_found_on_unknown_uuid
        claim_type: not_found
        grounds: [entities.Patient, "endpoints.GET /patients/{id}", errors.ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown path id must produce ERR_RESOURCE_NOT_FOUND with HTTP 404 rather than 200-with-null or 400, distinguishing path-id resolution from body-FK resolution."
        test_recipe:
          setup:
            - "No Patient exists with the probed id."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /patients/00000000-0000-4000-8000-000000000009", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_RESOURCE_NOT_FOUND\""

      - name: entity_patient_missing_required_age_years_is_err_validation
        claim_type: required_fields
        grounds: [entities.Patient.fields.age_years, errors.ERR_VALIDATION]
        distinguishing_aspect: "age_years is source:input with no default, so omitting it must fail with ERR_VALIDATION (422) before any state-policy business check runs."
        test_recipe:
          setup:
            - "POLICY_CA exists and is not retired, so the only defect in the request is the missing field."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
          trigger:
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "noage@x.test", full_name: "No Age" }, as: CareOpsAgent }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""

      - name: entity_device_defaults_firmware_and_claim_counter_applied
        claim_type: defaults
        grounds: [entities.Device, "endpoints.POST /devices"]
        distinguishing_aspect: "A Device created without loss_damage_claims_approved must default that counter to 0 and start with version 1, so an implementation that leaves the counter null and later fails the claim-cap comparison is caught at creation time."
        test_recipe:
          setup:
            - "Clock pinned; empty device table."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /devices", payload: { serial_number: "SN-DEF01", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, captures: { dev_def: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.loss_damage_claims_approved == 0"
            - "data.firmware_version == \"4.0.0\""
            - "data.version == 1"

      - name: entity_screening_computed_candidacy_score_ignores_client_supplied_value
        claim_type: computed_fields
        grounds: [entities.ScreeningSession, calculations.candidacy_risk_score, "endpoints.POST /screening-sessions/{id}/submit"]
        distinguishing_aspect: "attempt_ordinal and screening_outcome are source:computed, so client values injected in the PATCH body must be discarded: the first attempt stays ordinal 1, the outcome is PASS from scoring, and the derived Patient.candidacy_risk_score equals the formula output 39.3."
        test_recipe:
          setup:
            - "POLICY_CA + one Patient; a screening measured at PTA 40.0 dB, asymmetry 5.0 dB, difficulty 20, speech-in-noise 70.0 pct, no symptom codes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "comp@x.test", full_name: "Comp One", age_years: 70 }, as: CareOpsAgent, captures: { pat_c: "$.data.id" } }
            - { call: "POST /patients/${pat_c}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_c}", captures: { scr_c: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_c}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [], attempt_ordinal: 99, screening_outcome: "RED_FLAG" }, as: Patient, as_user_id: "${pat_c}" }
          trigger:
            - { call: "POST /screening-sessions/${scr_c}/submit", payload: {}, as: Patient, as_user_id: "${pat_c}" }
          assert:
            - "HTTP 200"
            - "data.status == \"SCORED\""
            - "data.attempt_ordinal == 1"
            - "data.screening_outcome == \"PASS\""
            - "data.scored_at == \"2026-08-01T00:00:00Z\""
            - "GET /patients/${pat_c} returns data.status == \"CANDIDATE_APPROVED\""
            - "GET /patients/${pat_c} returns data.candidacy_risk_score == 39.3"
            - "GET /patients/${pat_c} returns data.candidacy_risk_band == \"MODERATE\""
            - "GET /patients/${pat_c} returns data.candidacy_risk_variant == \"PROVISIONAL_SELF_REPORTED\""

      - name: entity_state_policy_system_fields_ignore_client_supplied_id_and_version
        claim_type: system_fields
        grounds: [entities.StatePolicy, "endpoints.POST /state-policies"]
        distinguishing_aspect: "id, version and created_at are source:system, so a POST body carrying id and version 77 must be overridden with a server id and version 1 instead of echoing the client values."
        test_recipe:
          setup:
            - "Empty state-policy table; clock pinned."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /state-policies", payload: { id: "11111111-1111-4111-8111-111111111111", version: 77, state_code: "NV", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.05, restocking_fee_cap_cents: 0, shipping_refundable: true, referral_validity_days: 90, waiver_required: false, max_loss_damage_claims: 1 }, as: PlatformAdmin }
          assert:
            - "HTTP 201"
            - "data.version == 1"
            - "data.id != \"11111111-1111-4111-8111-111111111111\""
            - "data.state_code == \"NV\""

      - name: entity_state_policy_invalid_restocking_fee_mode_enum_rejected
        claim_type: type_constraints
        grounds: [entities.StatePolicy.fields.restocking_fee_mode, errors.ERR_INVALID_ENUM_VALUE]
        distinguishing_aspect: "restocking_fee_mode outside {FLAT_PCT, PRORATED_DAILY, PROHIBITED} must return ERR_INVALID_ENUM_VALUE (422) specifically, not the generic ERR_VALIDATION."
        test_recipe:
          setup:
            - "Clock pinned; no other defect in the body."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /state-policies", payload: { state_code: "OR", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "SLIDING_SCALE", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_INVALID_ENUM_VALUE\""

      - name: entity_state_policy_negative_money_field_rejected
        claim_type: type_constraints
        grounds: [entities.StatePolicy.fields.restocking_fee_cap_cents, errors.ERR_VALIDATION]
        distinguishing_aspect: "A negative money value must be rejected with ERR_VALIDATION even though the field is nominally an integer, separating type checking from sign checking."
        test_recipe:
          setup:
            - "Clock pinned; every other field of the body is valid."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /state-policies", payload: { state_code: "WA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: -1, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""

      - name: entity_red_flag_finding_is_immutable_event_with_no_version_field
        claim_type: immutability
        grounds: [entities.RedFlagFinding, "endpoints.GET /screening-sessions/{id}/red-flag-findings"]
        distinguishing_aspect: "RedFlagFinding is declared common_fields: false and kind: event, so its read payload must expose no version and no updated_at field, and §1.5 offers only list endpoints for it -- the row exists solely as a scoring side effect."
        test_recipe:
          setup:
            - "POLICY_CA + Patient; a screening submitted with a mandatory symptom code so exactly one RedFlagFinding is emitted."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "imm@x.test", full_name: "Imm One", age_years: 70 }, as: CareOpsAgent, captures: { pat_i: "$.data.id" } }
            - { call: "POST /patients/${pat_i}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_i}", captures: { scr_i: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_i}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["SUDDEN_LOSS"] }, as: Patient, as_user_id: "${pat_i}" }
            - { call: "POST /screening-sessions/${scr_i}/submit", payload: {}, as: Patient, as_user_id: "${pat_i}" }
          trigger:
            - { call: "GET /screening-sessions/${scr_i}/red-flag-findings", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 200"
            - "total_count == 1"
            - "data[0].screening_session_id == ${scr_i}"
            - "data[0].code == \"SUDDEN_UNILATERAL_LOSS\""
            - "data[0].severity == \"MANDATORY_REFERRAL\""
            - "data[0].weight == 0.0"
            - "data[0].cleared_by_referral_id == null"
            - "data[0].detected_at == \"2026-08-01T00:00:00Z\""
            - "data[0] contains no key named \"version\""
            - "data[0] contains no key named \"updated_at\""

      - name: entity_screening_parent_patient_must_exist_else_resource_not_found
        claim_type: parent_relationships
        grounds: [entities.ScreeningSession.parent, "endpoints.POST /patients/{patient_id}/screening-sessions", errors.ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Creating a nested child under an unknown parent id in the path must be ERR_RESOURCE_NOT_FOUND (404), not a 403 from the ownership check, proving parent resolution precedes scope enforcement."
        test_recipe:
          setup:
            - "POLICY_CA + one real Patient whose id is used as X-User-ID while the path names a non-existent patient."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "par@x.test", full_name: "Par One", age_years: 70 }, as: CareOpsAgent, captures: { pat_p: "$.data.id" } }
          trigger:
            - { call: "POST /patients/00000000-0000-4000-8000-0000000000aa/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_p}" }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_RESOURCE_NOT_FOUND\""

      - name: entity_patient_body_fk_state_policy_unknown_is_reference_not_found
        claim_type: parent_relationships
        grounds: [entities.Patient.fields.state_policy_id, errors.ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "An unknown FK supplied in the request body must yield ERR_REFERENCE_NOT_FOUND, which is a different error_id from the ERR_RESOURCE_NOT_FOUND used for path ids."
        test_recipe:
          setup:
            - "Clock pinned; no StatePolicy with the probed id exists."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /patients", payload: { state_policy_id: "00000000-0000-4000-8000-0000000000bb", email: "fk@x.test", full_name: "Fk One", age_years: 70 }, as: CareOpsAgent }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_REFERENCE_NOT_FOUND\""

      - name: entity_topology_graph_firmware_rollout_junction_links_campaign_and_device
        claim_type: many_to_many_junction
        grounds: [complexity_profile.entity_topology, entities.FirmwareRollout, "endpoints.POST /firmware-campaigns/{campaign_id}/manual-enrollments"]
        distinguishing_aspect: "FirmwareRollout is the Campaign x Device junction: one device enrolled into two distinct campaigns must produce two rollout rows carrying the same device_id but different firmware_campaign_id, proving the junction is not modelled as a single-valued field on Device."
        test_recipe:
          setup:
            - "One Device at firmware 4.0.0 and two SCHEDULED campaigns for model NEO with non-overlapping windows."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-J001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, captures: { dev_j: "$.data.id" } }
            - { call: "POST /firmware-campaigns", payload: { campaign_code: "FWJ-1", model: "NEO", from_version: "4.0.0", to_version: "4.1.0", window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-06T00:00:00Z", batch_size: 5, max_concurrent_installs: 5, failure_rate_abort_pct: 50.0, is_mandatory_safety: true }, as: FirmwareEngineer, captures: { camp_j1: "$.data.id" } }
            - { call: "POST /firmware-campaigns", payload: { campaign_code: "FWJ-2", model: "NEO", from_version: "4.0.0", to_version: "4.1.1", window_start_utc: "2026-08-20T00:00:00Z", window_end_utc: "2026-08-21T00:00:00Z", batch_size: 5, max_concurrent_installs: 5, failure_rate_abort_pct: 50.0, is_mandatory_safety: true }, as: FirmwareEngineer, captures: { camp_j2: "$.data.id" } }
            - { call: "GET /devices/${dev_j}", payload: {}, as: FirmwareEngineer, captures: { dev_j_v: "$.data.version" } }
            - { call: "POST /firmware-campaigns/${camp_j1}/manual-enrollments", payload: { device_id: "${dev_j}", expected_device_version: "${dev_j_v}" }, as: FirmwareEngineer, captures: { roll_j1: "$.data.id" } }
            - { call: "GET /devices/${dev_j}", payload: {}, as: FirmwareEngineer, captures: { dev_j_v2: "$.data.version" } }
          trigger:
