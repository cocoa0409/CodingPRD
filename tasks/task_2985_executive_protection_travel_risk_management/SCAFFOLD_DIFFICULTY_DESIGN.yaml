      - name: vendor_capacity_counts_intersecting_engagements_and_allows_adjacent_ones
        grounds:
          - validations[priority=39]
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
          - entities.Vendor.max_concurrent_engagements
          - entities.Vendor.committed_engagement_hours
          - state_machines.VendorEngagement.null_to_ACTIVE
          - concurrency_rules.vendor-engagement-create-stale-vendor
          - calculations.commitment_ledgers
        distinguishing_aspect: |
          A different resource entity (VENDOR, not SecurityStaff) under different interval
          semantics: an AGGREGATE COUNT of ACTIVE engagements whose HALF-OPEN
          [starts_at, ends_at) windows intersect the candidate, with no buffer inflation at
          all. Two consequences separate this from the staff instance: (1) adjacency is
          legal — an engagement starting exactly when another ends does NOT intersect,
          because the existing interval excludes its own end instant; (2) each existing
          engagement is individually legal and only the collective count against
