  # ===========================================================================
  # RULE 4 - Transitive cascades from two different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offer_send_saturates_stage_and_closes_edition_slot
        grounds:
          - state_machines.Offer.DRAFT_to_SENT
          - calculations.stage_hold_ledger
          - entities.Stage.fields.held_show_count
          - entities.Stage.fields.booking_posture
          - entities.Stage.fields.slot_soft_cap
          - entities.FairEdition.fields.open_stage_count
        distinguishing_aspect: |
          TRIGGER: a talent-buying send. Depth 3, and every hop is caused strictly by the
          previous one: hop 1 raises Stage.held_show_count from 0 to 1 because the offer now
          holds a slot; hop 2 flips Stage.booking_posture to SATURATED only because
          held_show_count reached slot_soft_cap; hop 3 drops
          FairEdition.open_stage_count from 2 to 1 only because that posture changed. With
          slot_soft_cap 2 instead of 1 hop 1 would still happen and hops 2 and 3 would not,
          which is what makes the causal chain falsifiable.
        test_recipe:
          setup:
            - "One edition with two stages, each with slot_soft_cap 1, so a single hold saturates a stage."
            - "Before the trigger both stages read held_show_count 0 / booking_posture OPEN and the edition reads open_stage_count 2."
            - "One DRAFT offer at guarantee 9000000 targeting stage 1 on 2026-08-22, load window 14:00 -> 23:00 inside the 23:30 curfew."
            - "No other offer or booking exists, so no scheduling validation can pre-empt the send."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Hold Ledger Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 1 }
              as: FairOperationsDirector
              captures: { st1: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Pavilion", reserved_seat_capacity: 500, ga_capacity: 500, changeover_buffer_minutes: 60, slot_soft_cap: 1 }
              as: FairOperationsDirector
              captures: { st2: "$.data.id" }
            - call: "GET /grandstand/fair-editions/${ed}"
              payload: {}
              as: TalentBuyer
              captures: { ed_open_before: "$.data.open_stage_count" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar}", target_stage_id: "${st1}", deal_type: "VERSUS", offered_guarantee_cents: 9000000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of: "$.data.id" }
          trigger:
            - call: "POST /grandstand/offers/${of}/send"
              payload: {}
              as: TalentBuyer
          assert:
            - "${ed_open_before} == 2 (both stages were OPEN before the send)"
            - "HOP 1: Stage.${st1}.held_show_count == 1"
            - "HOP 2: Stage.${st1}.booking_posture == SATURATED"
            - "HOP 3: FairEdition.${ed}.open_stage_count == 1"
            - "Stage.${st2}.held_show_count == 0 and Stage.${st2}.booking_posture == OPEN (the untouched stage did not move)"
            - "FairEdition.${ed}.committed_guarantee_total_cents == 9000000"
            - "Offer.${of}.status == SENT with expires_at_utc == 2026-08-03T00:00:00.000Z"

      - name: weather_cancellation_voids_riders_and_zeroes_recoupment
        grounds:
          - state_machines.ShowBooking.DATE_HELD_to_CANCELLED
          - state_machines.ProductionAdvance.ADVANCE_IN_REVIEW_to_ADVANCE_CANCELLED
          - state_machines.SponsorshipActivation.CONFIRMED_to_CANCELLED
          - entities.RiderItem.fields.status
          - entities.ProductionAdvance.fields.recoupable_rider_cost_cents
          - entities.ShowBooking.fields.recoupable_production_cost_cents
          - entities.SponsorshipActivation.fields.make_good_credit_cents
          - calculations.refund_liability
        distinguishing_aspect: |
          TRIGGER: a severe-weather CANCEL contingency action, a completely different entry
          point from the offer send. The chain is deeper (4 causal hops) and runs the
          opposite way down the graph: booking -> its ProductionAdvance -> that advance's
          RiderItem rows -> the advance's recoupable aggregate -> back up to the booking's
          recoupable_production_cost_cents. The final hop is only observable because a rider
          line was APPROVED as artist_recoupable, so the pre-cancel value is 120000 and the
          post-cancel value is 0.
        test_recipe:
          setup:
            - "One accepted offer giving a booking in DATE_HELD, its advance in ADVANCE_IN_REVIEW."
            - "A HOSPITALITY rider line at 120000 with artist_recoupable true is APPROVED, so before the trigger the advance reads approved_rider_cost_cents 120000 / recoupable_rider_cost_cents 120000 and the booking reads recoupable_production_cost_cents 120000."
            - "The seed STAGING line is deliberately left REQUESTED, so the advance is still in review when the weather call is made."
            - "A SUPPORTING sponsor buys SIGNAGE at base_fee_cents 1000000 on a booking with no scales: premium 0.00 gives net_fee_cents 1000000, and confirming it sets booking.sponsorship_revenue_cents to 1000000."
            - "No ticket scales exist, so refund_liability_cents computes to 0 and the REFUNDING -> REFUNDED auto-transition fires."
            - "The booking version is re-read immediately before the activation write and again before the contingency write."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Weather Cascade Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of: "$.data.id" }
            - call: "POST /grandstand/offers/${of}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of}" }
              as: TalentBuyer
              captures: { bk: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk}" }
              as: ProductionManager
              captures: { adv: "$.data[0].id" }
            - call: "GET /grandstand/production-advances/${adv}/rider-items"
              payload: {}
              as: ProductionManager
              captures: { seed: "$.data[0].id" }
            - call: "POST /grandstand/production-advances/${adv}/rider-items"
              payload: { category: "HOSPITALITY", description: "Dressing room hospitality buyout", requested_cost_cents: 120000, is_critical: false, artist_recoupable: true }
              as: ProductionManager
              captures: { r_hosp: "$.data.id" }
            - call: "POST /grandstand/rider-items/${r_hosp}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/sponsors"
              payload: { name: "Valley Mutual", category: "FINANCIAL", exclusivity_tier: "SUPPORTING" }
              as: SponsorshipDirector
