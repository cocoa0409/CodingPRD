# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0528_veterinary_emergency — 9 rules x 2 instances = 18 instances
# All setup chains start from empty-DB. Common shorthand used across instances:
#   register patient -> register visit (creates OPEN Invoice) -> triage.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_estimate_low_vs_high_band
        grounds:
          - calculations.estimate_range
          - entities.Estimate.fields.low_cents
          - entities.Estimate.fields.high_cents
        distinguishing_aspect: |
          On the Estimate entity, the same line_items yield low_cents=214500 and
          high_cents=257400 because the high band applies a 20% variance uplift
          before tax; the two bands diverge on a different entity domain than the
          invoice-domain reconciliation instance.
        test_recipe:
          setup:
            - "A YELLOW-triaged Visit exists with one draft estimate of a single line qty1 @ 200000 cents."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Rex", species: "CANINE", weight_kg: 30, owner_user_id: "owner-1" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "collapse" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
          trigger:
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "treatment", qty: 1, unit_price_cents: 200000 } ] }
              as: FinanceCoordinator
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.low_cents == 214500"
            - "Estimate.${est_id}.high_cents == 257400"
            - "Estimate.${est_id}.deposit_pct == 0.5"
            - "Estimate.${est_id}.deposit_cents == 128700"

      - name: dvc_invoice_per_line_vs_sum_then_tax
        grounds:
          - calculations.invoice_reconciliation
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: |
          On the Invoice entity, three posted charge lines (4599, 12750, 8899)
          give per-line-then-sum tax_cents=1902, whereas the forbidden
          sum-then-tax variant would give 1903 — a 1-cent divergence on a
          different entity domain (Invoice, not Estimate).
          triage_level GREEN keeps deposit tiers out of this instance.
          Authorization ceiling 30000 admits all three charges.
          Charges: 4599 + 12750 + 8899 = 26248 subtotal.
        test_recipe:
          setup:
            - "A GREEN Visit IN_TREATMENT with an ACTIVE authorization ceiling 30000, and three procedures priced 4599/12750/8899 performed so the OPEN invoice holds all three charge lines."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Milo", species: "FELINE", weight_kg: 5, owner_user_id: "owner-2" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "vomiting" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "GREEN" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 20000 } ] }
              as: FinanceCoordinator
              captures: { est_id: $.data.id, est_high: $.data.high_cents }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv_issue: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${est_id}/issue"
              payload: { expected_visit_version: "${vv_issue}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${est_id}", approved_ceiling_cents: 30000 }
              as: FinanceCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${auth_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-2"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "IMAGING_CT", resource_room: "CT_SUITE", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T09:30:00Z", price_cents: 4599 }
              as: ClinicianDVM
              captures: { p1: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${p1}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "IMAGING_MRI", resource_room: "MRI_SUITE", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z", price_cents: 12750 }
              as: ClinicianDVM
              captures: { p2: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${p2}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "SURGERY", resource_room: "OR_1", start_at: "2026-05-01T11:00:00Z", end_at: "2026-05-01T11:30:00Z", price_cents: 8899 }
              as: ClinicianDVM
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/procedures/${p3}/perform"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Invoice(visit=${visit_id}).subtotal_cents == 26248"
            - "Invoice(visit=${visit_id}).tax_cents == 1902"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_rounding_order_invoice_per_line
        grounds:
          - calculations.invoice_reconciliation
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: charge lines 4599/12750/8899 make
          round-per-line-then-sum (1902) differ from sum-then-round (1903).
          The scaffold pins PER_LINE, so tax_cents==1902 is the only correct
          value; this is the rounding-order axis.
        test_recipe:
          setup:
            - "Same GREEN Visit as dvc_invoice_per_line_vs_sum_then_tax with the three charges posted."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Milo2", species: "FELINE", weight_kg: 5, owner_user_id: "owner-2" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "vomiting" }
              as: TriageNurse
              captures: { visit_id: $.data.id, vv0: $.data.version }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "GREEN" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 20000 } ] }
              as: FinanceCoordinator
              captures: { est_id: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv_issue: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${est_id}/issue"
              payload: { expected_visit_version: "${vv_issue}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${est_id}", approved_ceiling_cents: 30000 }
              as: FinanceCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${auth_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-2"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "IMAGING_CT", resource_room: "CT_SUITE", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T09:30:00Z", price_cents: 4599 }
              as: ClinicianDVM
              captures: { p1: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${p1}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "IMAGING_MRI", resource_room: "MRI_SUITE", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z", price_cents: 12750 }
              as: ClinicianDVM
              captures: { p2: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${p2}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "SURGERY", resource_room: "OR_1", start_at: "2026-05-01T11:00:00Z", end_at: "2026-05-01T11:30:00Z", price_cents: 8899 }
              as: ClinicianDVM
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/procedures/${p3}/perform"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Invoice(visit=${visit_id}).tax_cents == 1902"
            - "Invoice(visit=${visit_id}).subtotal_cents == 26248"

      - name: cf_payment_plan_eval_order_promo
        grounds:
          - calculations.payment_plan_schedule
          - entities.PaymentPlan.fields.financing_fee_cents
          - entities.PaymentPlan.fields.promo_applied
        distinguishing_aspect: |
          Mode (c) circular-looking eval order: financing_fee depends on
          promo_applied, which depends on BOTH principal and term. The scaffold
          pins order principal->promo->fee->total->installments. For a CARECREDIT
          plan on principal 128700 over 6 months, promo_applied=true so fee=0 and
          installment=21450 — a different combinatorial axis (eval order) than
          the invoice rounding-order instance.
        test_recipe:
          setup:
            - "A YELLOW Visit with a FINALIZED invoice whose balance_due_cents==128700 (one performed 300000 procedure, deposit 193050 credited)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Bella", species: "CANINE", weight_kg: 25, owner_user_id: "owner-3" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "GDV" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "SX", description: "surgery", qty: 1, unit_price_cents: 300000 } ] }
              as: FinanceCoordinator
              captures: { est_id: $.data.id, est_high: $.data.high_cents }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv_issue: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${est_id}/issue"
              payload: { expected_visit_version: "${vv_issue}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${est_id}", approved_ceiling_cents: 386100 }
              as: FinanceCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${auth_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-3"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "SURGERY", resource_room: "OR_1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T11:00:00Z", price_cents: 300000 }
              as: ClinicianDVM
              captures: { proc_id: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${proc_id}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/invoice/finalize"
              payload: {}
              as: FinanceCoordinator
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/payment-plans"
              payload: { invoice_id: "${inv_id}", provider: "CARECREDIT", term_months: 6 }
              as: FinanceCoordinator
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.principal_cents == 128700"
            - "PaymentPlan.${plan_id}.promo_applied == true"
            - "PaymentPlan.${plan_id}.financing_fee_cents == 0"
            - "PaymentPlan.${plan_id}.installment_cents == 21450"
            - "PaymentPlan.${plan_id}.final_installment_cents == 21450"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_authorization_decline_revision_cycle
        grounds:
          - state_machines.Authorization.PENDING_to_DECLINED
          - state_machines.Estimate.ISSUED_to_SUPERSEDED
          - state_machines.Estimate.DRAFT_to_ISSUED
        distinguishing_aspect: |
          On the Authorization/Estimate pair a revision cycle exists: declining
          an authorization SUPERSEDES its estimate, and a fresh estimate can be
          issued and re-authorized — a non-linear loop, not an A->B->C pipeline.
        test_recipe:
          setup:
            - "A YELLOW Visit with an ISSUED estimate E1 and a PENDING authorization A1 referencing it."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Coco", species: "CANINE", weight_kg: 12, owner_user_id: "owner-4" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "lameness" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 100000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id, e1_high: $.data.high_cents }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 200000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/authorizations/${a1}/decline"
              payload: {}
              as: Owner
              as_user_id: "owner-4"
          assert:
            - "Authorization.${a1}.status == DECLINED"
            - "Estimate.${e1}.status == SUPERSEDED"

      - name: nlsm_visit_branch_deceased_vs_discharge
        grounds:
          - state_machines.Visit.IN_TREATMENT_to_DECEASED
          - state_machines.Visit.IN_TREATMENT_to_READY_FOR_DISCHARGE
        distinguishing_aspect: |
          On the Visit entity, IN_TREATMENT forks to two terminal-bound branches
          (DECEASED with unwind cascade vs READY_FOR_DISCHARGE -> DISCHARGED)
          with divergent side-effect sets — branching, on a different entity than
          the Authorization revision cycle.
        test_recipe:
          setup:
            - "A YELLOW Visit IN_TREATMENT with an ACTIVE hospitalization and a SCHEDULED procedure."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Duke", species: "CANINE", weight_kg: 40, owner_user_id: "owner-5" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "trauma" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 100000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 300000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-5"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/hospitalizations"
              payload: { ward: "ICU", cage_number: 1, admit_at: "2026-05-01T08:00:00Z", planned_discharge_at: "2026-05-03T08:00:00Z" }
              as: ClinicianDVM
              captures: { hosp_id: $.data.id }
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "SURGERY", resource_room: "OR_1", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T14:00:00Z", price_cents: 50000 }
              as: ClinicianDVM
              captures: { proc_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/mark-deceased"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Visit.${visit_id}.status == DECEASED"
            - "Hospitalization.${hosp_id}.status == RELEASED"
            - "Procedure.${proc_id}.status == CANCELLED"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_discharge_finalize_report_depth3
        grounds:
          - state_machines.Visit.READY_FOR_DISCHARGE_to_DISCHARGED
          - state_machines.Invoice.OPEN_to_FINALIZED
          - entities.ReferringVetReport.fields.total_billed_cents
        distinguishing_aspect: |
          Depth-3 cascade from discharge: discharge (hop1) mutates Visit ->
          settled-invoice already; but on a decease-free settled path, discharge
          fires the report snapshot AFTER finalize. Chain: discharge triggers
          Invoice FINALIZE (hop2, when still OPEN) which triggers ReferringVet
          Report generation (hop3) snapshotting Invoice totals. Originates from
          the discharge transition.
        test_recipe:
          setup:
            - "A YELLOW Visit READY_FOR_DISCHARGE with a FINALIZED+paid (SETTLED) invoice; invoice finalize done via pay path so discharge's finalize hop is exercised on an already-finalized invoice, then report is generated."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Sky", species: "FELINE", weight_kg: 4, owner_user_id: "owner-6" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "URI" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 20000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 100000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-6"
            - call: "POST /visits/${visit_id}/begin-treatment"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/procedures"
              payload: { modality: "IMAGING_CT", resource_room: "CT_SUITE", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T09:30:00Z", price_cents: 20000 }
              as: ClinicianDVM
              captures: { proc_id: $.data.id }
            - call: "POST /visits/${visit_id}/procedures/${proc_id}/perform"
              payload: {}
              as: ClinicianDVM
            - call: "POST /visits/${visit_id}/invoice/finalize"
              payload: {}
              as: FinanceCoordinator
              captures: { inv_id: $.data.id, bal: $.data.balance_due_cents }
            - call: "POST /visits/${visit_id}/invoice/pay"
              payload: { amount_cents: 21450 }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/ready-for-discharge"
              payload: {}
              as: ClinicianDVM
          trigger:
            - call: "POST /visits/${visit_id}/discharge"
              payload: {}
              as: ClinicianDVM
          assert:
            - "Visit.${visit_id}.status == DISCHARGED"
            - "Invoice.${inv_id}.status == SETTLED"
            - "ReferringVetReport(visit=${visit_id}) count == 1"
            - "ReferringVetReport(visit=${visit_id}).total_billed_cents == 21450"

      - name: tc_authorization_approve_deposit_balance_depth2
        grounds:
          - state_machines.Authorization.PENDING_to_ACTIVE
          - state_machines.Estimate.ISSUED_to_CONSUMED
          - entities.Invoice.fields.deposit_applied_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (authorization approve):
          approve mutates Authorization->ACTIVE (hop1), which itself mutates the
          Estimate ISSUED->CONSUMED and credits Invoice.deposit_applied_cents
          (hop2), recomputing balance_due_cents. Originates from approve, not
          discharge.
        test_recipe:
          setup:
            - "A YELLOW Visit with an ISSUED estimate (deposit_cents 128700) and a PENDING authorization ceiling 386100."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Nova", species: "CANINE", weight_kg: 22, owner_user_id: "owner-7" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "bloat" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "SX", description: "surgery", qty: 1, unit_price_cents: 300000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
              captures: { e1_dep: $.data.deposit_cents }
            - call: "POST /visits/${visit_id}/authorizations"
