    output: "Show[]"
    side_effects: []

  - method: GET
    path: "/tours/holds/{holdId}"
    description: "Flat fetch of a PromoterHold by id"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: PromoterHold
