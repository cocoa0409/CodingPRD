# =============================================================================
# §1.8 Scaffold Difficulty Design — Junk Removal & Hauling (Expert)
# Test Targeting Index: 9 Difficulty Rules x >= 2 instances each.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7.
# Canonical ACTIVE policy used throughout (see std_policy in setups):
#   full_truck_cents=60000; tier_breaks=[{0.25,1.0},{0.5,0.9},{1.0,0.8}];
#   min_billable_fraction=0.125; fraction_step=0.125;
#   mattress=3500; appliance=2500; freon=5000;
#   dump_fee_per_ton_cents=9000; full_truck_dump_cents=12000;
#   recycle_fee_per_ton_cents=4000; diversion_credit_per_ton_cents=1500;
#   same_day_surcharge_pct=0.20; tax_pct=0.08;
#   cancel_pct_scheduled=0.25; cancel_pct_dispatched=0.50
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_total_diverge_across_photoestimate_and_hauljob
        grounds:
          - calculations.estimated_total_cents
          - calculations.final_total_cents
          - entities.HaulJob.fields.estimated_total_cents
          - entities.HaulJob.fields.final_total_cents
          - entities.PhotoEstimate.fields.raw_fraction
        distinguishing_aspect: |
          The estimate variant runs on the PhotoEstimate domain (declared_items + raw photo fraction,
          no dump/diversion/tax) while the final variant runs on the HaulJob domain (measured fraction +
          actual items + dump tickets + diversion credit + tax); for the same job they yield 27750 vs 54486.
        test_recipe:
          setup:
            - "ACTIVE std_policy; customer with high credit limit; job SCHEDULED service_type, ESTIMATED via accepted photo (raw 0.30, declared 1 mattress + 1 appliance -> estimated_total_cents=27750)."
            - "Job then driven to LOADED with measured 0.40, actual items 1 mattress+2 appliance+1 freon, one WEIGHT_BASED dump ticket 0.8t, one RECYCLING diversion 0.5t -> final_total_cents=54486."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "alice@x.com", full_name: "Alice", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Team A", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z", hazmat_certified: true }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T-1" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "1 Main St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "MATTRESS", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "APPLIANCE", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "FREON_APPLIANCE", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/1.jpg", raw_fraction: 0.30, declared_items: [{category: "MATTRESS", quantity: 1}, {category: "APPLIANCE", quantity: 1}] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T11:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${job_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/dump-tickets"
              payload: { landfill_tons: 0.8, landfill_fraction: 0.5, fee_basis: "WEIGHT_BASED" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/diversions"
              payload: { destination: "RECYCLING", tons: 0.5 }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /haul-jobs/${job_id}/load"
              payload: { measured_truck_fraction: 0.40 }
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { final_total: $.data.final_total_cents, est_total: $.data.estimated_total_cents }
          assert:
            - "HaulJob.${job_id}.estimated_total_cents == 27750"
            - "HaulJob.${job_id}.final_total_cents == 54486"
            - "HaulJob.${job_id}.estimated_total_cents != HaulJob.${job_id}.final_total_cents"

      - name: dump_fee_weight_vs_volume_diverge_on_dumpticket
        grounds:
          - calculations.dump_fee_passthrough
          - entities.DumpTicket.fields.fee_basis
          - entities.DumpTicket.fields.dump_fee_cents
        distinguishing_aspect: |
          On the DumpTicket domain (distinct from the estimate-vs-final pair), the SAME physical load
          (0.8 ton / 0.5 fraction) priced WEIGHT_BASED yields 7200 but VOLUME_BASED yields 6000 — two
          valid pass-through algorithms producing different cents for identical inputs.
        test_recipe:
          setup:
            - "ACTIVE std_policy; two ON_SITE jobs each carrying one dump ticket for the same 0.8t/0.5-fraction load, one WEIGHT_BASED, one VOLUME_BASED; both loaded."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "bob@x.com", full_name: "Bob", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Team B", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T-2" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            # Job W (WEIGHT_BASED)
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "2 Oak St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { jobw_id: $.data.id }
            - call: "POST /haul-jobs/${jobw_id}/photo-estimates"
              payload: { photo_url: "http://p/w.jpg", raw_fraction: 0.30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { estw_id: $.data.id }
            - call: "POST /haul-jobs/${jobw_id}/photo-estimates/${estw_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v0: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${jobw_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { dispw_id: $.data.id }
            - call: "POST /dispatches/${dispw_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${jobw_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${jobw_id}/dump-tickets"
              payload: { landfill_tons: 0.8, landfill_fraction: 0.5, fee_basis: "WEIGHT_BASED" }
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { ticketw_id: $.data.id }
            # Job V (VOLUME_BASED)
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "3 Oak St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { jobv_id: $.data.id }
            - call: "POST /haul-jobs/${jobv_id}/photo-estimates"
              payload: { photo_url: "http://p/v.jpg", raw_fraction: 0.30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { estv_id: $.data.id }
            - call: "POST /haul-jobs/${jobv_id}/photo-estimates/${estv_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v1: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${jobv_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T11:00:00.000Z", window_end_utc: "2026-06-10T12:00:00.000Z", expected_crew_version: "${crew_v1}" }
              as: Dispatcher
              captures: { dispv_id: $.data.id }
            - call: "POST /dispatches/${dispv_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${jobv_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${jobv_id}/dump-tickets"
              payload: { landfill_tons: 0.8, landfill_fraction: 0.5, fee_basis: "VOLUME_BASED" }
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { ticketv_id: $.data.id }
          trigger:
            - call: "POST /haul-jobs/${jobw_id}/load"
              payload: { measured_truck_fraction: 0.20 }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${jobv_id}/load"
              payload: { measured_truck_fraction: 0.20 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "DumpTicket.${ticketw_id}.dump_fee_cents == 7200"
            - "DumpTicket.${ticketv_id}.dump_fee_cents == 6000"
            - "DumpTicket.${ticketw_id}.dump_fee_cents != DumpTicket.${ticketv_id}.dump_fee_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_total_nonlinear_tiered_with_conditional_branches_mode_a
        grounds:
          - calculations.final_total_cents
          - entities.PricingPolicy.fields.tier_breaks
          - entities.HaulJob.fields.service_type
          - entities.DumpTicket.fields.dump_fee_cents
          - entities.DiversionRecord.fields.tons
        distinguishing_aspect: |
          Mode (a): final_total_cents combines >=3 inputs with non-linear interaction — marginal-tiered
          base over tier_breaks, a conditional same_day uplift branch, per-item surcharge, summed dump
          fees, recycle fee, and a subtracted diversion credit, then tax; computed to the literal 54486.
        test_recipe:
          setup:
            - "Reuse the big-job chain (1 mattress+2 appliance+1 freon, measured 0.40, 0.8t WEIGHT_BASED dump, 0.5t RECYCLING) on a SCHEDULED job; final_total_cents=54486."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "carol@x.com", full_name: "Carol", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Team C", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z", hazmat_certified: true }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T-3" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "4 Pine St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "MATTRESS", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "APPLIANCE", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "FREON_APPLIANCE", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/c.jpg", raw_fraction: 0.30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T11:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${job_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/dump-tickets"
              payload: { landfill_tons: 0.8, landfill_fraction: 0.5, fee_basis: "WEIGHT_BASED" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/diversions"
              payload: { destination: "RECYCLING", tons: 0.5 }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /haul-jobs/${job_id}/load"
              payload: { measured_truck_fraction: 0.40 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "HaulJob.${job_id}.final_total_cents == 54486"

      - name: surcharge_round_per_item_then_sum_mode_b
        grounds:
          - calculations.final_total_cents
          - entities.JobItem.fields.quantity
          - entities.PricingPolicy.fields.appliance_surcharge_cents
        distinguishing_aspect: |
          Mode (b): per-item surcharge is rounded PER LINE ITEM (per_item*quantity, rounded) then summed,
          pinned over a sum-then-round alternative; with 2 appliance + 1 mattress the surcharge contribution
          is round(2500*2)+round(3500*1)=8500 and total resolves to the literal 8100+... pinned below.
        test_recipe:
          setup:
            - "ACTIVE std_policy; SCHEDULED job, 1 mattress + 2 appliance, measured 0.05 (-> billed 0.125 base 7500), no dump, no diversion -> surcharge 8500+... final 17280."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "dan@x.com", full_name: "Dan", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Team D", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T-4" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "5 Elm St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "MATTRESS", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/items"
              payload: { category: "APPLIANCE", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/d.jpg", raw_fraction: 0.05 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${job_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /haul-jobs/${job_id}/load"
              payload: { measured_truck_fraction: 0.05 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            # base(0.125)=7500; surcharge=round(3500*1)+round(2500*2)=3500+5000=8500; subtotal=16000; tax=round(16000*0.08)=1280; total=17280
            - "HaulJob.${job_id}.final_total_cents == 17280"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hauljob_revision_cycle_scheduled_back_to_estimated
        grounds:
          - state_machines.HaulJob.SCHEDULED_to_ESTIMATED
          - state_machines.HaulJob.ESTIMATED_to_SCHEDULED
          - entities.Dispatch.fields.dispatch_status
        distinguishing_aspect: |
          HaulJob exhibits a cycle: ESTIMATED -> SCHEDULED (dispatch) then SCHEDULED -> ESTIMATED (revise),
          voiding the reserved dispatch and returning the job to ESTIMATED — a non-linear loop on the HaulJob entity.
        test_recipe:
          setup:
            - "ACTIVE std_policy; job ESTIMATED then SCHEDULED via a RESERVED dispatch (crew reserved_minutes=60)."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "eve@x.com", full_name: "Eve", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Team E", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T-5" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "6 Fir St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/e.jpg", raw_fraction: 0.30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
