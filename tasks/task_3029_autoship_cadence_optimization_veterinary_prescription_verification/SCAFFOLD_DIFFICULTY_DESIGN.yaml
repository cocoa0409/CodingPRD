            - "hop 1: Prescription.${rx_d3}.rx_status == VERIFICATION_FAILED and callback_attempt_count == 3"
            - "hop 2: AutoshipItem.${item_d3}.verification_state == BLOCKED, caused by the failed prescription rather than by the attempt itself"
            - "hop 3: AutoshipPlan.${plan_d3}.plan_status == SUSPENDED, caused by the BLOCKED item"
            - "hop 4: AutoshipPlan.${plan_d3}.autoship_discount_eligibility == INELIGIBLE, caused by the suspension hop"
            - "the chain is live rather than cosmetic: POST /v1/autoship-plans/${plan_d3}/compose is rejected with ERR_PLAN_PAUSED, not with ERR_RX_NOT_VERIFIED, because the plan hop precedes the prescription check"

