  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assignment_state_error_outranks_packaging_depletion_on_repack
        grounds:
          - validations.ERR_ASSIGNMENT_STATE_INVALID
          - validations.ERR_PACKAGING_DEPLETED
          - state_machines.FulfillmentAssignment.PICKED_to_PACKED
        distinguishing_aspect: |
          Error-category pair 1 = state (priority 10) versus business_constraint (priority 42):
          re-packing an already PACKED assignment at a store whose only MEDIUM_BOX was consumed
          by that very pack must answer 409 ERR_ASSIGNMENT_STATE_INVALID, while the sibling
          assignment - identical in every way except that it is still PICKED - proves the
          422 ERR_PACKAGING_DEPLETED branch is live.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; store S1 is the only node, SKU-A on_hand 12 / safety 2, and PackagingSupply (S1, MEDIUM_BOX) has on_hand_units 1."
            - "Two GROUND orders to zone 4 (SKU-A x2 each) are committed to S1 as a1 and a2, both provisional_cost_cents 1336."
            - "a1 is accepted 09:05, picked 2/2 and packed MEDIUM_BOX at 09:20 - that pack consumes the last box, so PackagingSupply.on_hand_units is 0."
            - "a2 is accepted 09:25 and picked 2/2, so it sits in PICKED with the supply already depleted."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_s1: "$.data.id" }
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 1, reorder_point_units: 1 }
              as: NetworkPlanner
              captures: { sup1: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-5001", customer_ref: "C-11", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T16:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "POST /fulfillment-network/orders"
