            - "GET /liability-periods/${period_id}/exposure-summary returns net_funded_liability_cents == 7500, confirmed_alert_count == 0, in_period_alert_count == 0"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: physical_issuance_screen_blocked_by_suspect_rack_state
        grounds:
          - validations[priority=56]
          - errors.ERR_RACK_TAMPERED
          - state_machines.CardRack.INTACT_to_SUSPECT
          - state_machines.IssuanceRequest.SUBMITTED_to_APPROVED
          - calculations.rack_tamper_classification
          - calculations.store_floor_posture
        distinguishing_aspect: |
          ENTITY PAIR IssuanceRequest -> CardRack: the request is created while
          the rack is INTACT and is screened AFTER an audit moves the rack to
          SUSPECT, so the guard must be evaluated against the rack's state at
          SCREEN time rather than at request-creation time — an implementation
          that snapshots rack state on create wrongly approves and mints value.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack with expected_card_count 10, one INACTIVE GiftCard on that rack."
            - "A PHYSICAL IssuanceRequest for 4000 cents created FIRST, while the rack is still INTACT — it sits in SUBMITTED."
            - "Only THEN an audit showing 1 missing card and 1 seal break, which classifies the rack SUSPECT and the store floor HEIGHTENED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Gateway Foods", region_code: "SW", address_line: "60 Gateway Blvd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-G1", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id, rack_state0: $.data.tamper_state }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1101" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 4000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-11", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id, ir_state0: $.data.state, ir_v0: $.data.version }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 9, seal_breaks_observed: 1 }
              as: PosAssociate
              captures: { rack_state1: $.data.tamper_state, missing: $.data.missing_card_count }
          trigger:
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "${rack_state0} == INTACT — the request was legal at the moment it was created"
            - "${rack_state1} == SUSPECT and ${missing} == 1 (shrink 1 and 1 seal break are both below their thresholds of 3)"
            - "HTTP status == 422"
            - "${err} == ERR_RACK_TAMPERED"
            - "IssuanceRequest.${ir_id}.state == SUBMITTED — still parked, not APPROVED and not DECLINED"
            - "IssuanceRequest.${ir_id}.screened_at == null"
            - "IssuanceRequest.${ir_id}.screening_score == null"
            - "IssuanceRequest.${ir_id}.version == ${ir_v0}"
            - "GiftCard.${card_id}.activation_state == INACTIVE and current_balance_cents == 0 — no value was minted"
            - "CardRack.${rack1_id}.tamper_state == SUSPECT and RetailStore.${store1_id}.floor_posture == HEIGHTENED"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 0"

      - name: reseller_listing_validation_gated_by_gift_card_risk_posture
        grounds:
          - calculations.listing_validation_decision
          - state_machines.ResellerListing.SUBMITTED_to_VALIDATED
          - state_machines.ResellerListing.SUBMITTED_to_BLOCKED
          - state_machines.GiftCard.risk_posture
          - entities.ResellerListing.fields.block_reason
        distinguishing_aspect: |
          A DIFFERENT entity pair — ResellerListing -> GiftCard — resolved by a
          side-by-side pair of listings whose OWN fields are byte-identical
          (same marketplace, same asking price, same declared balance) and whose
          only difference is the referenced card's risk_posture: WATCH validates
          while RESTRICTED blocks with block_reason CARD_RISK_POSTURE.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, and TWO ACTIVE PHYSICAL GiftCards each with face value 6000 cents."
            - "cardA is walked to risk_posture WATCH the organic way — four balance inquiries inside one velocity window score it 48, at or above the watch threshold of 40 but below the velocity threshold of 5, so no alert exists."
            - "cardB is pushed straight to risk_posture RESTRICTED by a RiskManager override."
            - "One SUBMITTED ResellerListing per card, created by partner-2 with IDENTICAL marketplace_name, asking_price_cents and listed_balance_cents."
          setup_api_calls:
