  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_capacity_on_run_complete
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.ProductionRun.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Pair state (priority 7) vs business_fiscal/capacity (priority 12): completing a
          CANCELLED run with actual_units far over line capacity fails with
          ERR_INVALID_STATE, not ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Owned variety ACTIVE; line cap 10000/day; run 2026-09-10..2026-09-11 planned 5000, then CANCELLED."
