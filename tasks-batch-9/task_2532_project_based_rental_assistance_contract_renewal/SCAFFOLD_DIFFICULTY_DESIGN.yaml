            - "${det_b_state} == MUTM_ELIGIBLE and ${det_b_reason} == MARKET_ABOVE_CONTRACT_AND_FMR"
            - "RestructuringDetermination.${det_a_id}.market_rent_per_unit_cents == 118000 and RestructuringDetermination.${det_a_id}.current_rent_per_unit_cents == 118000"
            - "RestructuringDetermination.${det_b_id}.determination_state == APPROVED"
            - "${det_b_post_rent} == 118100"
            - "RenewalCase.${case_b_id}.ocaf_rent_per_unit_cents == 118100"

      - name: utility_allowance_change_exactly_at_the_ten_percent_threshold_stays_with_the_contract_administrator
        grounds:
          - calculations.utility_allowance_adjustment
          - entities.UtilityAllowanceAnalysis.fields.change_pct
          - entities.UtilityAllowanceAnalysis.fields.requires_field_office_approval
          - validations[priority=46]
          - errors[ERR_UA_CHANGE_REQUIRES_FIELD_OFFICE]
        distinguishing_aspect: |
          The field-office escalation test is strict on a 4-decimal-place quantity: a +10 percent
          factor gives proposed_allowance_cents 12650 and change_pct exactly 0.1000, which the
          ContractAdministrator may still accept, whereas +12 percent gives 12880 / 0.1200 and
          the same ContractAdministrator call is refused 403. The boundary is a rounded ratio,
          not an integer comparison — differentiating it from the MUTM integer boundary.
        test_recipe:
          setup:
            - "One owner with two IL properties P1 and P2, each with baseline_utility_allowance_cents 11500 and no prior applied analysis."
            - "Clock at the default 2026-08-01; no households, so an apply would recertify nobody."
            - "P1 carries a FACTOR_BASED analysis at +0.10; P2 carries a FACTOR_BASED analysis at +0.12."
