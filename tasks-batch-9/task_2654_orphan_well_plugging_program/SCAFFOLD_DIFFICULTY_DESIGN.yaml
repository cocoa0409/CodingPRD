  - rule_id: resource_temporal_overlap
    instances:
      - name: contractor_crew_window_is_half_open_so_touching_jobs_are_allowed
        grounds:
          - validations[priority=59]
          - errors.ERR_CREW_WINDOW_CONFLICT
          - entities.PluggingJob.fields.crew_window_end_at
          - entities.PluggingJob.fields.scheduled_start
        distinguishing_aspect: |
          A contractor crew occupies the HALF-OPEN interval [scheduled_start, scheduled_start +
          (planned_rig_days + 2) days): job 1 starting 2026-09-01 with 3 rig days occupies up to but
          not including 2026-09-06, so a second job starting 2026-09-05 is rejected with
          ERR_CREW_WINDOW_CONFLICT while an otherwise identical job starting exactly 2026-09-06 is
          accepted. Capacity is 1 crew per contractor.
