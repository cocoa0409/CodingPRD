scenario: |
  Wedding RSVP & Gift Registry: guest list, Plus-One, meal selection, kids meal,
  Seating Chart algorithm, cross-platform gift purchase aggregation, duplicate
  cancellation, Thank You tracking.

domain_name: wedding-rsvp-gift-registry
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - idempotency

  entity_topology: hybrid
  state_machine_shape: branching            # Guest INVITED -> ATTENDING/DECLINED with revoke loop; RegistryItem has parallel dimensions; Wedding posture-driven
  relationship_patterns:
    - one_to_many                            # Wedding -> Guest, Wedding -> Table, Wedding -> RegistryItem
    - cross_aggregate                        # Purchase (external platform stream) updates RegistryItem aggregates
    - polymorphic                            # SeatingAssignment.assignee_type can be GUEST or PLUS_ONE
  role_model: peer_roles                     # Couple owns wedding; Guest acts via token; PlatformIntegration ingests purchases; PlatformAdmin operates
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Wedding
    parent: null
    common_fields: true
    fields:
      - name: couple_user_id
        type: string
        source: input
        description: "Opaque identifier of the Couple operator who owns this wedding (matches X-User-ID when X-User-Role is Couple)."
      - name: title
        type: string
        source: input
        description: "Display title for the wedding event (e.g., 'Alex & Robin — May 2027')."
      - name: ceremony_at
        type: datetime
        source: input
        description: "ISO 8601 UTC date-time of the ceremony; rsvp_deadline_at must be strictly earlier."
      - name: rsvp_deadline_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; after this point guests cannot self-RSVP and seating may be finalized."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle posture; derived/maintained by state machine transitions."
        default: DRAFT
        constraints: "Enum: DRAFT, RSVP_OPEN, RSVP_CLOSED, SEATED, ARCHIVED."
      - name: seating_dirty
        type: boolean
        source: computed
        description: "True when a guest/plus-one RSVP change has invalidated a finalized seating plan; resets to false on re-finalize."
        default: false
      - name: total_capacity
        type: integer
        source: computed
        description: "Sum of Table.capacity for all Tables of this Wedding; recomputed on Table create/update/delete."
        default: 0

  - name: MealOption
    parent: Wedding
    common_fields: true
    fields:
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id; the wedding offering this meal option."
      - name: code
        type: string
        source: input
        description: "Couple-defined short code, unique within the Wedding (e.g., 'BEEF', 'VEG', 'KIDS_PASTA')."
      - name: label
        type: string
        source: input
        description: "Human-readable meal name."
      - name: is_kids
        type: boolean
        source: input
        description: "True when this option is reserved for guests under the wedding's kids age threshold; only Guest.is_child=true or PlusOne.is_child=true may pick it."
        default: false
      - name: max_servings
        type: integer
        source: input
        description: "Hard cap (caterer-bound) on how many ATTENDING guests+plus-ones may choose this meal_option_id; >=1."

  - name: Table
    parent: Wedding
    common_fields: true
    fields:
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id."
      - name: table_number
        type: integer
        source: input
        description: "Couple-assigned table number, unique within the Wedding; >=1."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of assignees (guests + plus-ones) this table may seat; >=1."
      - name: kids_only
        type: boolean
        source: input
        description: "When true, only assignees with is_child=true may be seated here."
        default: false

  - name: Guest
    parent: Wedding
    common_fields: true
    fields:
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id."
      - name: full_name
        type: string
        source: input
        description: "Guest's display name."
      - name: email
        type: string
        source: input
        description: "Email used for invitation; case-insensitively unique within the Wedding."
      - name: is_child
        type: boolean
        source: input
        description: "True if this guest is below the kids age threshold; only is_child=true assignees can pick is_kids meal options or sit at kids_only tables."
        default: false
      - name: plus_one_allowed
        type: boolean
        source: input
        description: "True if the couple has granted this guest the right to invite a single PlusOne; flipping false while a PlusOne exists is rejected."
        default: false
      - name: rsvp_status
        type: enum
        source: computed
        description: "Guest's RSVP state."
        default: INVITED
        constraints: "Enum: INVITED, ATTENDING, DECLINED."
      - name: meal_option_id
        type: string
        source: input
        description: "FK -> MealOption.id; set when rsvp_status flips to ATTENDING; cleared on DECLINED."
        default: null
      - name: invitation_token
        type: string
        source: system
        description: "Opaque server-minted token used by GuestSelf to authenticate self-RSVP."

  - name: PlusOne
    parent: Guest
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; primary guest that brought this plus-one; the parent Guest must have plus_one_allowed=true."
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id; must equal the parent Guest's wedding_id."
      - name: full_name
        type: string
        source: input
        description: "Plus-one's display name."
      - name: is_child
        type: boolean
        source: input
        description: "Same semantics as Guest.is_child."
        default: false
      - name: rsvp_status
        type: enum
        source: computed
        description: "PlusOne RSVP state; mirrors Guest semantics but evolves independently."
        default: ATTENDING
        constraints: "Enum: ATTENDING, DECLINED."
      - name: meal_option_id
        type: string
        source: input
        description: "FK -> MealOption.id; required when rsvp_status=ATTENDING; cleared on DECLINED."
        default: null

  - name: SeatingAssignment
    parent: Wedding
    common_fields: true
    fields:
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id."
      - name: table_id
        type: string
        source: input
        description: "FK -> Table.id."
      - name: assignee_type
        type: enum
        source: input
        description: "Polymorphic discriminator for which entity the assignee_id refers to."
        constraints: "Enum: GUEST, PLUS_ONE."
      - name: assignee_id
        type: string
        source: input
        description: "FK -> Guest.id when assignee_type=GUEST; FK -> PlusOne.id when assignee_type=PLUS_ONE. Uniqueness is enforced on (wedding_id, assignee_type, assignee_id)."

  - name: RegistryItem
    parent: Wedding
    common_fields: true
    fields:
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id."
      - name: sku
        type: string
        source: input
        description: "Couple-defined registry SKU, unique within the Wedding."
      - name: title
        type: string
        source: input
        description: "Display name of the gift."
      - name: target_quantity
        type: integer
        source: input
        description: "Desired total units; >=1. status flips FULFILLED when fulfilled_quantity >= target_quantity."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents; >=0; used only for display and Purchase reconciliation."
      - name: status
        type: enum
        source: computed
        description: "Aggregated registry status driven by purchases."
        default: OPEN
        constraints: "Enum: OPEN, FULFILLED, ARCHIVED."
      - name: fulfilled_quantity
        type: integer
        source: computed
        description: "Sum of Purchase.quantity for purchases on this item whose status=CONFIRMED; recomputed on every purchase create/cancel."
        default: 0
      - name: pending_quantity
        type: integer
        source: computed
        description: "Sum of Purchase.quantity for purchases on this item whose status=PENDING_REVIEW (duplicates awaiting couple decision); recomputed on every purchase create/cancel."
        default: 0

  - name: Purchase
    parent: RegistryItem
    common_fields: true
    fields:
      - name: registry_item_id
        type: string
        source: input
        description: "FK -> RegistryItem.id."
      - name: platform_code
        type: string
        source: input
        description: "Source platform identifier (e.g., 'STORE_A', 'STORE_B', 'MANUAL')."
      - name: external_purchase_id
        type: string
        source: input
        description: "Platform-side purchase identifier; (platform_code, external_purchase_id) is globally unique — same-key replay is idempotent."
      - name: purchaser_name
        type: string
        source: input
        description: "Name of the gift-giver as reported by the platform."
      - name: quantity
        type: integer
        source: input
        description: ">=1; counts toward RegistryItem.fulfilled_quantity when status=CONFIRMED, toward pending_quantity when PENDING_REVIEW."
      - name: occurred_at
        type: datetime
        source: input
        description: "Platform-side purchase time (ISO 8601 UTC); used as the chronological sort key in duplicate detection."
      - name: status
        type: enum
        source: computed
        description: "Purchase posture in the duplicate-cancellation workflow."
        default: CONFIRMED
        constraints: "Enum: CONFIRMED, PENDING_REVIEW, CANCELLED."
      - name: dup_of_purchase_id
        type: string
        source: computed
        description: "FK -> Purchase.id; set on the LATER purchase (by occurred_at, ties broken by created_at ASC) when ingesting a same-item duplicate that would push the running CONFIRMED running total > target_quantity. Always null on the canonical (earlier) purchase."
        default: null

  - name: ThankYouNote
    parent: Purchase
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "FK -> Purchase.id; one ThankYouNote per Purchase whose status=CONFIRMED."
      - name: wedding_id
        type: string
        source: input
        description: "FK -> Wedding.id; denormalised from purchase.registry_item.wedding_id for filterable listing."
      - name: status
        type: enum
        source: computed
        description: "Thank-you progression."
        default: PENDING
        constraints: "Enum: PENDING, DRAFTED, SENT."
      - name: drafted_body
        type: string
        source: input
        description: "Body text saved when status flips to DRAFTED; required for SENT."
        default: null
      - name: sent_at
        type: datetime
        source: computed
        description: "Set when status flips to SENT; ISO 8601 UTC."
        default: null

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Wedding
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: RSVP_OPEN
        trigger: "POST /weddings/{id}/open-rsvp"
        actor: Couple
        preconditions:
          - "wedding.ceremony_at > current_utc"
          - "wedding.rsvp_deadline_at > current_utc and < ceremony_at"
          - "wedding has >=1 MealOption with is_kids=false"
        side_effects:
          - "Guests of this Wedding become invitable; invitation_tokens are minted on Guest create."
      - from: RSVP_OPEN
        to: RSVP_CLOSED
        trigger: "POST /weddings/{id}/close-rsvp  OR  automatic when current_utc >= rsvp_deadline_at on any write"
        actor: Couple | system
        preconditions:
          - "wedding.status == RSVP_OPEN"
        side_effects:
          - "All Guests whose rsvp_status == INVITED auto-transition to DECLINED (Guest cascade: clear meal_option_id; any PlusOne under that Guest also auto-DECLINED with meal cleared)."
          - "Cascade: Wedding.seating_dirty is recomputed against current ATTENDING assignees."
      - from: RSVP_CLOSED
        to: SEATED
        trigger: "POST /weddings/{id}/finalize-seating"
        actor: Couple
        preconditions:
          - "wedding.status == RSVP_CLOSED"
          - "Every Guest with rsvp_status==ATTENDING is referenced by exactly one SeatingAssignment; same for every PlusOne with rsvp_status==ATTENDING"
          - "No Table is over capacity; no kids_only table seats a non-child"
          - "expected_wedding_version matches wedding.version (OCC)"
        side_effects:
          - "wedding.seating_dirty = false."
          - "wedding.version increments by 1."
      - from: SEATED
        to: RSVP_CLOSED
        trigger: "automatic when any SeatingAssignment is deleted or any Guest/PlusOne rsvp_status flips ATTENDING->DECLINED while wedding.status==SEATED"
        actor: system
        preconditions:
          - "wedding.status == SEATED"
        side_effects:
          - "wedding.seating_dirty = true."
      - from: SEATED
        to: ARCHIVED
        trigger: "POST /weddings/{id}/archive"
        actor: Couple
        preconditions:
          - "current_utc > ceremony_at"
        side_effects:
          - "Wedding becomes read-only; no further mutations on its Guests, Purchases, ThankYouNotes."

  - entity: Guest
    initial_state: INVITED
    terminal_states: []
    transitions:
      - from: INVITED
        to: ATTENDING
        trigger: "POST /guests/{id}/rsvp  (with attending=true)"
        actor: GuestSelf | Couple
        preconditions:
          - "wedding.status == RSVP_OPEN"
          - "current_utc < wedding.rsvp_deadline_at"
          - "request.meal_option_id refers to a MealOption of this wedding"
          - "If guest.is_child=false, MealOption.is_kids must be false; if guest.is_child=true, MealOption.is_kids must be true"
          - "Cardinality: count of ATTENDING (guests + plus-ones) whose meal_option_id == this MealOption.id is < MealOption.max_servings"
        side_effects:
          - "guest.meal_option_id is set."
      - from: INVITED
        to: DECLINED
        trigger: "POST /guests/{id}/rsvp  (with attending=false)  OR  automatic on RSVP_OPEN->RSVP_CLOSED for INVITED guests"
        actor: GuestSelf | Couple | system
        preconditions:
          - "wedding.status in {RSVP_OPEN, RSVP_CLOSED}"
        side_effects:
          - "guest.meal_option_id = null."
          - "Cascade: every PlusOne under this guest auto-transitions to DECLINED with meal_option_id cleared."
          - "If wedding.status == SEATED before this transition, any SeatingAssignment for this guest is deleted and wedding auto-transitions SEATED -> RSVP_CLOSED with seating_dirty=true."
      - from: ATTENDING
        to: DECLINED
        trigger: "POST /guests/{id}/rsvp  (with attending=false)"
        actor: GuestSelf | Couple
        preconditions:
          - "wedding.status in {RSVP_OPEN, RSVP_CLOSED, SEATED}"
        side_effects:
          - "guest.meal_option_id = null."
          - "Cascade depth-3: declining ATTENDING guest in SEATED wedding -> (1) PlusOne auto-DECLINE with meal cleared -> (2) SeatingAssignment rows for both guest and any plus-ones are deleted -> (3) wedding auto-transitions SEATED -> RSVP_CLOSED with seating_dirty=true."
      - from: ATTENDING
        to: INVITED
        trigger: "POST /guests/{id}/revoke-rsvp"
        actor: Couple
        preconditions:
          - "wedding.status == RSVP_OPEN"
          - "current_utc < wedding.rsvp_deadline_at"
        side_effects:
          - "guest.meal_option_id = null."
          - "Cascade: every PlusOne under this guest reverts to ATTENDING-with-null-meal? NO — plus-ones with rsvp_status=ATTENDING are not auto-reverted; revoke-rsvp is rejected if any PlusOne under this guest exists with rsvp_status != INVITED. Couple must DELETE the PlusOne first."
      - from: DECLINED
        to: INVITED
        trigger: "POST /guests/{id}/revoke-rsvp"
        actor: Couple
        preconditions:
          - "wedding.status == RSVP_OPEN"
          - "current_utc < wedding.rsvp_deadline_at"
        side_effects: []

  - entity: PlusOne
    initial_state: ATTENDING
    terminal_states: []
    transitions:
      - from: ATTENDING
        to: DECLINED
        trigger: "POST /plus-ones/{id}/decline  OR  cascade from parent Guest DECLINE"
        actor: GuestSelf | Couple | system
        preconditions:
          - "wedding.status in {RSVP_OPEN, RSVP_CLOSED, SEATED}"
        side_effects:
          - "plus_one.meal_option_id = null."
          - "Any SeatingAssignment with assignee_type=PLUS_ONE and assignee_id=this.id is deleted; if wedding.status was SEATED, it auto-transitions to RSVP_CLOSED with seating_dirty=true."

  - entity: Purchase
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: PENDING_REVIEW
        trigger: "automatic on Purchase create when CONFIRMED running total for this RegistryItem (sum of quantity over CONFIRMED purchases sorted by (occurred_at ASC, created_at ASC)) would exceed RegistryItem.target_quantity"
        actor: system
        preconditions:
          - "RegistryItem.status == OPEN at create time"
        side_effects:
          - "The new purchase is parked in PENDING_REVIEW and its dup_of_purchase_id is set to the id of the earliest CONFIRMED purchase whose quantity contributes to the overage (the canonical one). RegistryItem.pending_quantity += this.quantity."
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /purchases/{id}/cancel-duplicate"
        actor: Couple
        preconditions:
          - "purchase.status == PENDING_REVIEW"
          - "expected_registry_item_version matches RegistryItem.version (OCC)"
        side_effects:
          - "RegistryItem.pending_quantity -= this.quantity."
          - "RegistryItem.version increments by 1."
          - "Cascade: any ThankYouNote previously created on this purchase is hard-deleted; if none existed (the normal path since CONFIRMED never fired), nothing else happens."
      - from: PENDING_REVIEW
        to: CONFIRMED
        trigger: "POST /purchases/{id}/promote (Couple accepts the duplicate as a legitimate extra)"
        actor: Couple
        preconditions:
          - "purchase.status == PENDING_REVIEW"
          - "RegistryItem.status == OPEN"
          - "expected_registry_item_version matches RegistryItem.version (OCC)"
        side_effects:
          - "RegistryItem.pending_quantity -= this.quantity."
          - "RegistryItem.fulfilled_quantity += this.quantity."
          - "RegistryItem.version increments by 1."
          - "Cascade: a ThankYouNote with status=PENDING is created for this purchase (one-shot); RegistryItem.status flips OPEN->FULFILLED if fulfilled_quantity >= target_quantity."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /purchases/{id}/cancel-duplicate (Couple cancels a CONFIRMED purchase, e.g., the canonical of a duplicate pair)"
        actor: Couple
        preconditions:
          - "purchase.status == CONFIRMED"
          - "expected_registry_item_version matches RegistryItem.version (OCC)"
        side_effects:
          - "RegistryItem.fulfilled_quantity -= this.quantity."
          - "RegistryItem.version increments by 1."
          - "Cascade: any ThankYouNote on this purchase is hard-deleted."
          - "If RegistryItem.status was FULFILLED and the new fulfilled_quantity < target_quantity, status reverts to OPEN."

  - entity: RegistryItem
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "automatic on Purchase CONFIRMED transition (initial create or PENDING_REVIEW->CONFIRMED) when fulfilled_quantity reaches target_quantity"
        actor: system
        preconditions:
          - "fulfilled_quantity >= target_quantity"
        side_effects: []
      - from: FULFILLED
        to: OPEN
        trigger: "automatic on Purchase CONFIRMED->CANCELLED when fulfilled_quantity drops below target_quantity"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ARCHIVED
        trigger: "automatic on parent Wedding SEATED->ARCHIVED"
        actor: system
        preconditions:
          - "wedding.status == ARCHIVED"
        side_effects: []
      - from: FULFILLED
        to: ARCHIVED
        trigger: "automatic on parent Wedding SEATED->ARCHIVED"
        actor: system
        preconditions:
          - "wedding.status == ARCHIVED"
        side_effects: []

  - entity: ThankYouNote
    initial_state: PENDING
    terminal_states: [SENT]
    transitions:
      - from: PENDING
        to: DRAFTED
        trigger: "POST /thank-you-notes/{id}/draft"
        actor: Couple
        preconditions:
          - "purchase.status == CONFIRMED"
          - "request.drafted_body is non-empty"
        side_effects:
          - "thank_you_note.drafted_body is stored."
      - from: DRAFTED
        to: SENT
        trigger: "POST /thank-you-notes/{id}/send"
        actor: Couple
        preconditions:
          - "thank_you_note.drafted_body is non-empty"
          - "purchase.status == CONFIRMED"
        side_effects:
          - "thank_you_note.sent_at = current_utc."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on parent version only
# =============================================================================
concurrency_rules:
  - rule_id: finalize-seating-stale-wedding
    parent_entity: Wedding
    write_endpoint: "POST /weddings/{id}/finalize-seating"
    occ_field: "expected_wedding_version"
    description: |
      Finalizing a seating plan against a Wedding whose version has advanced
      since the client last observed it is rejected. A common cause is a
      late RSVP flip (ATTENDING->DECLINED) cascading through the wedding's
      side effects between the time the Couple loaded the seating UI and the
      finalize submit — that cascade bumps wedding.version and sets
      seating_dirty=true, so the Couple's view of "ready to seat" is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cancel-duplicate-stale-registry-item
    parent_entity: RegistryItem
    write_endpoint: "POST /purchases/{id}/cancel-duplicate"
    occ_field: "expected_registry_item_version"
    description: |
      Cancelling a Purchase (CONFIRMED or PENDING_REVIEW) on a RegistryItem
      whose version has advanced since last observed is rejected. The
      typical cause is a fresh cross-platform purchase ingest landing between
      the Couple's read of the duplicates list and the cancel submit —
      RegistryItem.version was bumped by that ingest (fulfilled or pending
      quantity changed), so the cancellation decision is being made against
      stale aggregate totals.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: meal_count_aggregation
    trigger: "Recomputed on every Guest/PlusOne ATTENDING<->DECLINED transition and on every guest.meal_option_id / plus_one.meal_option_id change; surfaced via GET /weddings/{id}/meal-summary."
    algorithm: aggregation
    formula: |
      For each MealOption M of the Wedding:
        count(M) =
          (# of Guests where guest.wedding_id == W.id
                            AND guest.rsvp_status == ATTENDING
                            AND guest.meal_option_id == M.id)
        + (# of PlusOnes where plus_one.wedding_id == W.id
                              AND plus_one.rsvp_status == ATTENDING
                              AND plus_one.meal_option_id == M.id)
      Constraint enforced on the meal_option_id setter (Guest.RSVP and PlusOne.RSVP
      transitions to ATTENDING, and on Couple-driven meal changes):
        count(M) AFTER the change must be <= M.max_servings.
      Return shape from GET /weddings/{id}/meal-summary:
        [ { meal_option_id, code, label, is_kids, max_servings, count } ]
    input_set: "Source rows: Guests and PlusOnes of the wedding whose rsvp_status == ATTENDING. INVITED and DECLINED rows are excluded; rows with meal_option_id == null are excluded."
    constants: {}
    precision: "Integer counts."

  - name: seating_chart_assignment
    trigger: "POST /weddings/{id}/auto-seat (returns the proposed plan); state is materialised only when the Couple persists individual SeatingAssignment rows. The algorithm itself is deterministic."
    algorithm: waterfall_allocation
    formula: |
      ATTENDEE LIST (chronological, deterministic):
        Build A = [ all Guests with rsvp_status==ATTENDING ]
              ++ [ all PlusOnes with rsvp_status==ATTENDING ]
        Sort A by (created_at ASC, full_name ASC) — created_at primary,
        full_name as the disciplined tie-break (NEVER id).
      TABLE LIST:
        Build T = [ all Tables of this Wedding ] sorted by (table_number ASC).
      WATERFALL ALLOCATION:
        For each attendee a in A (in order):
          Find the first table t in T (in order) such that
            (a) t.assignments.length < t.capacity, AND
            (b) if t.kids_only == true then a.is_child must be true, AND
            (c) if t.kids_only == false then a.is_child must be false
                UNLESS a.is_child=true AND every kids_only=true table is
                already full — in which case a may overflow into a non-
                kids_only table (kids spill into adult tables only when no
                kids_only slot remains).
          Place a into t.
        If no table satisfies the predicate, the algorithm returns a
        partial plan PLUS the unseatable list.
      OUTPUT:
        {
          plan: [{ assignee_type, assignee_id, table_id, table_number }],
          unseatable: [{ assignee_type, assignee_id, reason }]
        }
    input_set: "Attendees: ATTENDING Guests + ATTENDING PlusOnes of the wedding. Tables: all Tables of the wedding."
    constants: {}
    precision: "Integer slots; no decimals."
    variants:
      - name: dry_run
        when: "GET /weddings/{id}/auto-seat?dry_run=true — caller wants to inspect the plan without writing."
        difference: "Returns the same plan + unseatable list, but does NOT create SeatingAssignment rows; wedding.seating_dirty is unchanged."
      - name: commit
        when: "POST /weddings/{id}/auto-seat — caller wants the plan persisted."
        difference: "Atomically deletes every existing SeatingAssignment of this wedding and re-creates rows from the computed plan; wedding.seating_dirty stays true (Couple must still POST /finalize-seating to clear)."

  - name: registry_purchase_aggregation
    trigger: "Recomputed on every Purchase create / status transition / cancel."
    algorithm: chronological
    formula: |
      For a given RegistryItem R, replay all of R's Purchases sorted by
      (occurred_at ASC, created_at ASC) — occurred_at primary, created_at as
      the deterministic tie-break (NEVER id).
      Initialise running_confirmed = 0.
      For each purchase p in this chronological order:
        if p.status currently CANCELLED -> skip (does not contribute).
        if p is the just-ingested purchase from a brand-new POST:
          tentative = running_confirmed + p.quantity
          if tentative <= R.target_quantity:
            p.status = CONFIRMED
            running_confirmed = tentative
          else:
            p.status = PENDING_REVIEW
            p.dup_of_purchase_id = id of the earliest CONFIRMED p' such that
              cumulative running_confirmed BEFORE p' reached <= target and
              AFTER p' exceeded — i.e., the canonical purchase that "ate the
              last slot" (boundary is inclusive — exact target hit yields
              CONFIRMED; target+1 yields PENDING_REVIEW).
        if p is an existing row replayed:
          its status field is the authoritative current status; only its
          quantity contributes if status == CONFIRMED.
      After replay:
        R.fulfilled_quantity = sum of CONFIRMED p.quantity
        R.pending_quantity   = sum of PENDING_REVIEW p.quantity
        R.status = FULFILLED if R.fulfilled_quantity >= R.target_quantity
                   else OPEN (or ARCHIVED, frozen by wedding state)
    input_set: "All Purchase rows whose registry_item_id = R.id (any platform_code, any status)."
    constants: {}
    precision: "Integer quantities."
    variants:
      - name: provisional_view
        when: "GET /registry-items/{id}/purchases?include_pending=true — Couple inspects the live duplicates queue before deciding."
        difference: "Includes PENDING_REVIEW rows; fulfilled_quantity stays based on CONFIRMED only; pending_quantity is surfaced."
      - name: settled_view
        when: "GET /registry-items/{id} — public summary."
        difference: "Returns RegistryItem.fulfilled_quantity (CONFIRMED only); does not surface pending_quantity. The two views diverge for any item with non-zero pending_quantity."

  - name: thank_you_completion_score
    trigger: "Recomputed on every ThankYouNote status change; surfaced via GET /weddings/{id}/thank-you-report."
    algorithm: weighted_scoring
    formula: |
      Inputs (all integer counts, weddingscoped):
        N_total    = number of ThankYouNotes attached to CONFIRMED purchases of this wedding
        N_sent     = number of those with status == SENT
        N_drafted  = number of those with status == DRAFTED
        N_pending  = number of those with status == PENDING
      Constants:
        W_SENT     = 1.00
        W_DRAFTED  = 0.40
        W_PENDING  = 0.00
      Raw weighted sum:
        S_raw = N_sent * W_SENT + N_drafted * W_DRAFTED + N_pending * W_PENDING
      Completion percent:
        completion_pct = round_half_up( (S_raw / N_total) * 100.0 , 2 ) when N_total > 0
        completion_pct = 100.00 when N_total == 0    -- empty registry => fully "done"
      Boundary flag:
        is_complete = (N_sent == N_total) AND (N_total > 0)
      ROUNDING ORDER (pinned): compute S_raw to full float precision first,
        divide by N_total, multiply by 100, THEN round_half_up to 2 decimals.
        The reverse order ("round per-note contribution then sum") is
        EXPLICITLY forbidden and produces different cents at large N.
    input_set: "ThankYouNotes attached to CONFIRMED Purchases of this wedding only. ThankYouNotes orphaned by purchase cancellation are excluded (they are hard-deleted by the cascade)."
    constants:
      W_SENT: 1.00
      W_DRAFTED: 0.40
      W_PENDING: 0.00
    precision: "Two decimal places, round_half_up; rounding applied ONCE at the very end."

# =============================================================================
# §1.4 Validations — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed; for GuestSelf, X-Invitation-Token header present and matches Guest.invitation_token."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all (except POST /weddings which is bootstrap)"

  - priority: 2
    category: auth
    check: "Caller's role is permitted by §1.7 RBAC for this endpoint."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every {id} path segment refers to an existing resource (404 the leftmost missing one)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path-templated ids"

  - priority: 4
    category: state
    check: "Wedding.status == ARCHIVED rejects every mutation on the wedding and on any of its child entities (Guest, PlusOne, Table, MealOption, RegistryItem, Purchase, ThankYouNote, SeatingAssignment)."
    error_id: ERR_WEDDING_ARCHIVED
    http_status: 409
    applies_to: "all mutations rooted in a Wedding"

  - priority: 5
    category: state
    check: "Operation requires wedding.status in the permitted set declared on the relevant §1.2 transition (e.g., POST /guests/{id}/rsvp requires wedding.status in {RSVP_OPEN, RSVP_CLOSED, SEATED}; POST /weddings/{id}/finalize-seating requires RSVP_CLOSED)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /weddings/{id}/open-rsvp, /close-rsvp, /finalize-seating, /archive; POST /guests/{id}/rsvp, /revoke-rsvp; POST /plus-ones/{id}/decline; POST /purchases/{id}/cancel-duplicate, /promote; POST /thank-you-notes/{id}/draft, /send"

  - priority: 6
    category: business_safety
    check: "Kids-meal pairing — meal_option_id supplied on a Guest.RSVP/PlusOne.RSVP-ATTENDING request must satisfy: if the assignee.is_child=true then MealOption.is_kids must be true; if the assignee.is_child=false then MealOption.is_kids must be false."
    error_id: ERR_KIDS_MEAL_PAIRING
    http_status: 422
    applies_to: "POST /guests/{id}/rsvp, POST /plus-ones/{id}/rsvp, PATCH /guests/{id}/meal, PATCH /plus-ones/{id}/meal"

  - priority: 7
    category: business_safety
    check: "Kids-only seating — SeatingAssignment on a Table with kids_only=true is rejected unless the assignee has is_child=true; conversely, seating a child at a non-kids_only table is allowed only when every kids_only Table of this Wedding is at capacity."
    error_id: ERR_KIDS_SEATING_VIOLATION
    http_status: 422
    applies_to: "POST /seating-assignments, POST /weddings/{id}/auto-seat (when committing)"

  - priority: 8
    category: business_referential
    check: "Plus-one eligibility — POST /guests/{guest_id}/plus-ones requires Guest.plus_one_allowed=true AND Guest has no existing PlusOne (one-shot)."
    error_id: ERR_PLUS_ONE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /guests/{guest_id}/plus-ones, PATCH /guests/{id} (when toggling plus_one_allowed=false while a PlusOne exists)"

  - priority: 9
    category: business_referential
    check: "Same-wedding referential integrity — every cross-entity reference must live in the same Wedding (e.g., Guest.meal_option_id.wedding_id == Guest.wedding_id; SeatingAssignment.table_id.wedding_id == SeatingAssignment.wedding_id; Purchase.registry_item_id.wedding_id is the relevant wedding for ThankYouNote)."
    error_id: ERR_CROSS_WEDDING_REFERENCE
    http_status: 422
    applies_to: "POST /guests/{id}/rsvp, POST /plus-ones/{id}/rsvp, POST /seating-assignments, POST /weddings/{id}/registry-items, POST /registry-items/{id}/purchases, POST /thank-you-notes (cascade-created)"

  - priority: 10
    category: business_constraint
    check: "Meal capacity — accepting an ATTENDING RSVP (or changing meal_option_id) MUST NOT push count(MealOption) over MealOption.max_servings."
    error_id: ERR_MEAL_FULL
    http_status: 422
    applies_to: "POST /guests/{id}/rsvp, POST /plus-ones/{id}/rsvp, PATCH /guests/{id}/meal, PATCH /plus-ones/{id}/meal"

  - priority: 11
    category: business_constraint
    check: "Table capacity — SeatingAssignment create rejected if Table.assignments.length == Table.capacity at the time of write."
    error_id: ERR_TABLE_FULL
    http_status: 422
    applies_to: "POST /seating-assignments, POST /weddings/{id}/auto-seat (when committing)"

  - priority: 12
    category: business_referential
    check: "Duplicate seating — each (wedding_id, assignee_type, assignee_id) MUST be unique across SeatingAssignment rows."
    error_id: ERR_ALREADY_SEATED
    http_status: 422
    applies_to: "POST /seating-assignments"

  - priority: 13
    category: business_temporal
    check: "RSVP deadline — POST /guests/{id}/rsvp (and PlusOne equivalent) when issued by GuestSelf is rejected once current_utc >= wedding.rsvp_deadline_at, even if wedding.status is still RSVP_OPEN (the close-rsvp transition may not yet have fired)."
    error_id: ERR_RSVP_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /guests/{id}/rsvp (GuestSelf), POST /plus-ones/{id}/rsvp (GuestSelf)"

  - priority: 14
    category: business_referential
    check: "Idempotent purchase ingest — (platform_code, external_purchase_id) is globally unique; re-posting the same key returns the existing Purchase with the same id (200) without creating a new row and without mutating RegistryItem aggregates."
    error_id: ERR_DUPLICATE_EXTERNAL_PURCHASE
    http_status: 409
    applies_to: "POST /registry-items/{id}/purchases — applies only when the existing row's quantity differs from the new payload's quantity (true conflict); same-key + same-quantity is a successful idempotent replay (200)."

  - priority: 15
    category: business_constraint
    check: "OCC version match — finalize-seating requires expected_wedding_version == wedding.version; cancel-duplicate and promote on a Purchase require expected_registry_item_version == registry_item.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /weddings/{id}/finalize-seating, POST /purchases/{id}/cancel-duplicate, POST /purchases/{id}/promote"

  - priority: 16
    category: business_constraint
    check: "Required-field / type validation — every endpoint's required input fields must be present and well-typed (enums in declared set, integers in declared ranges)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:
  # ---------- Wedding ----------
  - method: POST
    path: "/weddings"
    description: "Create a Wedding in DRAFT state."
    roles: [Couple]
    code: 201
    input: [couple_user_id, title, ceremony_at, rsvp_deadline_at]
    output: Wedding
    side_effects: ["wedding.status set to DRAFT; wedding.version=1; wedding.seating_dirty=false; wedding.total_capacity=0."]

  - method: GET
    path: "/weddings/{id}"
    description: "Read a Wedding."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: Wedding
    side_effects: []

  - method: GET
    path: "/weddings"
    description: "List Weddings, filterable by couple_user_id."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["couple_user_id?", "limit?", "offset?"]
    output: Wedding[]
    side_effects: []

  - method: POST
    path: "/weddings/{id}/open-rsvp"
    description: "Transition Wedding DRAFT -> RSVP_OPEN."
    roles: [Couple]
    code: 200
    input: []
    output: Wedding
    side_effects: ["wedding.status = RSVP_OPEN; wedding.version += 1."]

  - method: POST
    path: "/weddings/{id}/close-rsvp"
    description: "Transition Wedding RSVP_OPEN -> RSVP_CLOSED."
    roles: [Couple]
    code: 200
    input: []
    output: Wedding
    side_effects:
      - "wedding.status = RSVP_CLOSED; wedding.version += 1."
      - "Cascade: every Guest with rsvp_status==INVITED auto-DECLINES; their PlusOnes auto-DECLINE; meal_option_ids cleared."
      - "Recompute wedding.seating_dirty."

  - method: POST
    path: "/weddings/{id}/finalize-seating"
    description: "Transition Wedding RSVP_CLOSED -> SEATED. OCC-guarded by expected_wedding_version."
    roles: [Couple]
    code: 200
    input: [expected_wedding_version]
    output: Wedding
    side_effects:
      - "wedding.status = SEATED; wedding.seating_dirty = false; wedding.version += 1."

  - method: POST
    path: "/weddings/{id}/archive"
    description: "Transition Wedding SEATED -> ARCHIVED (post-ceremony)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: Wedding
    side_effects:
      - "wedding.status = ARCHIVED; wedding.version += 1."
      - "All child RegistryItems auto-transition to ARCHIVED."

  - method: GET
    path: "/weddings/{id}/meal-summary"
    description: "Returns per-MealOption counts for ATTENDING guests+plus-ones (calculation: meal_count_aggregation)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: "{ items: array, total_attendees: integer }"
    side_effects: []

  - method: GET
    path: "/weddings/{id}/auto-seat"
    description: "Dry-run seating chart algorithm; returns plan+unseatable without persisting."
    roles: [Couple]
    code: 200
    input: []
    output: "{ plan: array, unseatable: array }"
    side_effects: []

  - method: POST
    path: "/weddings/{id}/auto-seat"
    description: "Run seating chart algorithm and persist SeatingAssignment rows (replaces any existing). Wedding must be in RSVP_CLOSED or SEATED."
    roles: [Couple]
    code: 200
    input: []
    output: "{ plan: array, unseatable: array }"
    side_effects:
      - "All existing SeatingAssignment rows for this Wedding are deleted; new rows are created from the plan."
      - "wedding.seating_dirty = true if any new rows were created or removed; otherwise unchanged."
      - "wedding.version += 1."
      - "If wedding.status was SEATED, it auto-transitions back to RSVP_CLOSED (since seating is being re-planned)."

  - method: GET
    path: "/weddings/{id}/thank-you-report"
    description: "Returns thank_you_completion_score: { n_total, n_sent, n_drafted, n_pending, completion_pct, is_complete }."
    roles: [Couple]
    code: 200
    input: []
    output: "{ n_total: integer, n_sent: integer, n_drafted: integer, n_pending: integer, completion_pct: number, is_complete: boolean }"
    side_effects: []

  # ---------- MealOption ----------
  - method: POST
    path: "/weddings/{id}/meal-options"
    description: "Add a MealOption to a Wedding."
    roles: [Couple]
    code: 201
    input: [code, label, "is_kids?", max_servings]
    output: MealOption
    side_effects: []

  - method: GET
    path: "/weddings/{id}/meal-options"
    description: "List MealOptions of a Wedding (FK reverse-reachability for MealOption.wedding_id)."
    roles: [Couple, GuestSelf, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MealOption[]
    side_effects: []

  - method: GET
    path: "/meal-options/{id}"
    description: "Read a MealOption."
    roles: [Couple, GuestSelf, PlatformAdmin]
    code: 200
    input: []
    output: MealOption
    side_effects: []

  # ---------- Table ----------
  - method: POST
    path: "/weddings/{id}/tables"
    description: "Add a Table to a Wedding."
    roles: [Couple]
    code: 201
    input: [table_number, capacity, "kids_only?"]
    output: Table
    side_effects:
      - "wedding.total_capacity += new table.capacity."
      - "wedding.version += 1."

  - method: GET
    path: "/weddings/{id}/tables"
    description: "List Tables of a Wedding (FK reverse-reachability for Table.wedding_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Table[]
    side_effects: []

  - method: GET
    path: "/tables/{id}"
    description: "Read a Table."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: Table
    side_effects: []

  # ---------- Guest ----------
  - method: POST
    path: "/weddings/{id}/guests"
    description: "Add a Guest to a Wedding; mints invitation_token."
    roles: [Couple]
    code: 201
    input: [full_name, email, "is_child?", "plus_one_allowed?"]
    output: Guest
    side_effects:
      - "Guest.rsvp_status = INVITED; invitation_token minted; meal_option_id = null."

  - method: GET
    path: "/weddings/{id}/guests"
    description: "List Guests of a Wedding (FK reverse-reachability for Guest.wedding_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["rsvp_status?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: GET
    path: "/guests"
    description: "List Guests; filterable by meal_option_id (FK reverse-reachability for Guest.meal_option_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["meal_option_id?", "rsvp_status?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: GET
    path: "/guests/{id}"
    description: "Read a Guest."
    roles: [Couple, GuestSelf, PlatformAdmin]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: POST
    path: "/guests/{id}/rsvp"
    description: "Guest (self) or Couple sets rsvp_status to ATTENDING or DECLINED. Body: { attending: bool, meal_option_id?: string }."
    roles: [Couple, GuestSelf]
    code: 200
    input: [attending, "meal_option_id?"]
    output: Guest
    side_effects:
      - "On attending=true: rsvp_status=ATTENDING, meal_option_id stored."
      - "On attending=false: rsvp_status=DECLINED, meal_option_id=null, cascade to PlusOne and SeatingAssignment per §1.2."

  - method: POST
    path: "/guests/{id}/revoke-rsvp"
    description: "Couple reverts a Guest from ATTENDING or DECLINED back to INVITED (only while RSVP_OPEN and before rsvp_deadline)."
    roles: [Couple]
    code: 200
    input: []
    output: Guest
    side_effects:
      - "rsvp_status=INVITED; meal_option_id=null."

  # ---------- PlusOne ----------
  - method: POST
    path: "/guests/{id}/plus-ones"
    description: "Couple adds the (single) PlusOne under a Guest with plus_one_allowed=true."
    roles: [Couple]
    code: 201
    input: [full_name, "is_child?", "meal_option_id?"]
    output: PlusOne
    side_effects:
      - "PlusOne.rsvp_status=ATTENDING (default); meal_option_id stored if provided."

  - method: GET
    path: "/guests/{id}/plus-ones"
    description: "List PlusOnes under a Guest (FK reverse-reachability for PlusOne.guest_id)."
    roles: [Couple, GuestSelf, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PlusOne[]
    side_effects: []

  - method: GET
    path: "/plus-ones"
    description: "List PlusOnes, filterable by wedding_id and meal_option_id (FK reverse-reachability for PlusOne.wedding_id and PlusOne.meal_option_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["wedding_id?", "meal_option_id?", "limit?", "offset?"]
    output: PlusOne[]
    side_effects: []

  - method: GET
    path: "/plus-ones/{id}"
    description: "Read a PlusOne."
    roles: [Couple, GuestSelf, PlatformAdmin]
    code: 200
    input: []
    output: PlusOne
    side_effects: []

  - method: POST
    path: "/plus-ones/{id}/rsvp"
    description: "GuestSelf or Couple sets PlusOne rsvp_status to ATTENDING or DECLINED."
    roles: [Couple, GuestSelf]
    code: 200
    input: [attending, "meal_option_id?"]
    output: PlusOne
    side_effects:
      - "On attending=true: rsvp_status=ATTENDING, meal_option_id stored."
      - "On attending=false: rsvp_status=DECLINED; cascade to SeatingAssignment per §1.2."

  - method: DELETE
    path: "/plus-ones/{id}"
    description: "Couple removes a PlusOne entirely (e.g., to flip plus_one_allowed=false)."
    roles: [Couple]
    code: 204
    input: []
    output: null
    side_effects:
      - "Any SeatingAssignment for this PlusOne deleted; wedding seating_dirty=true if it was SEATED."

  # ---------- SeatingAssignment ----------
  - method: POST
    path: "/seating-assignments"
    description: "Manually create a single SeatingAssignment row."
    roles: [Couple]
    code: 201
    input: [wedding_id, table_id, assignee_type, assignee_id]
    output: SeatingAssignment
    side_effects:
      - "If wedding.status was SEATED, it auto-transitions back to RSVP_CLOSED with seating_dirty=true and version+=1."

  - method: GET
    path: "/seating-assignments"
    description: "List SeatingAssignments, filterable by wedding_id, table_id, and assignee_id (FK reverse-reachability for SeatingAssignment.wedding_id, SeatingAssignment.table_id, SeatingAssignment.assignee_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["wedding_id?", "table_id?", "assignee_type?", "assignee_id?", "limit?", "offset?"]
    output: SeatingAssignment[]
    side_effects: []

  - method: GET
    path: "/seating-assignments/{id}"
    description: "Read a SeatingAssignment."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: SeatingAssignment
    side_effects: []

  - method: DELETE
    path: "/seating-assignments/{id}"
    description: "Remove a single SeatingAssignment."
    roles: [Couple]
    code: 204
    input: []
    output: null
    side_effects:
      - "If wedding.status was SEATED, it auto-transitions back to RSVP_CLOSED with seating_dirty=true and version+=1."

  # ---------- RegistryItem ----------
  - method: POST
    path: "/weddings/{id}/registry-items"
    description: "Couple adds a RegistryItem to the Wedding."
    roles: [Couple]
    code: 201
    input: [sku, title, target_quantity, unit_price_cents]
    output: RegistryItem
    side_effects:
      - "RegistryItem.status=OPEN; fulfilled_quantity=0; pending_quantity=0; version=1."

  - method: GET
    path: "/weddings/{id}/registry-items"
    description: "List RegistryItems of a Wedding (FK reverse-reachability for RegistryItem.wedding_id)."
    roles: [Couple, PlatformIntegration, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RegistryItem[]
    side_effects: []

  - method: GET
    path: "/registry-items/{id}"
    description: "Read a RegistryItem (settled_view: fulfilled_quantity only)."
    roles: [Couple, PlatformIntegration, PlatformAdmin]
    code: 200
    input: []
    output: RegistryItem
    side_effects: []

  # ---------- Purchase ----------
  - method: POST
    path: "/registry-items/{id}/purchases"
    description: "PlatformIntegration ingests a purchase from a cross-platform feed. Idempotent on (platform_code, external_purchase_id)."
    roles: [PlatformIntegration, Couple]
    code: 201
    input: [platform_code, external_purchase_id, purchaser_name, quantity, occurred_at]
    output: Purchase
    side_effects:
      - "Chronological replay (calculation registry_purchase_aggregation) classifies the new row CONFIRMED or PENDING_REVIEW; dup_of_purchase_id set on PENDING_REVIEW."
      - "RegistryItem.fulfilled_quantity / pending_quantity recomputed; status flips OPEN->FULFILLED if applicable."
      - "RegistryItem.version += 1."
      - "If new status is CONFIRMED: a ThankYouNote(PENDING) is auto-created for this purchase."

  - method: GET
    path: "/registry-items/{id}/purchases"
    description: "List Purchases on a RegistryItem (FK reverse-reachability for Purchase.registry_item_id). With include_pending=true, surfaces PENDING_REVIEW rows; default false."
    roles: [Couple, PlatformIntegration, PlatformAdmin]
    code: 200
    input: ["include_pending?", "status?", "limit?", "offset?"]
    output: Purchase[]
    side_effects: []

  - method: GET
    path: "/purchases/{id}"
    description: "Read a Purchase."
    roles: [Couple, PlatformIntegration, PlatformAdmin]
    code: 200
    input: []
    output: Purchase
    side_effects: []

  - method: GET
    path: "/purchases"
    description: "List Purchases; filterable by dup_of_purchase_id (FK reverse-reachability for Purchase.dup_of_purchase_id) or status."
    roles: [Couple, PlatformIntegration, PlatformAdmin]
    code: 200
    input: ["dup_of_purchase_id?", "status?", "limit?", "offset?"]
    output: Purchase[]
    side_effects: []

  - method: POST
    path: "/purchases/{id}/cancel-duplicate"
    description: "Couple cancels a Purchase (either a CONFIRMED canonical that should not have been recorded, or a PENDING_REVIEW duplicate). OCC-guarded by expected_registry_item_version."
    roles: [Couple]
    code: 200
    input: [expected_registry_item_version]
    output: Purchase
    side_effects:
      - "purchase.status = CANCELLED."
      - "RegistryItem.fulfilled_quantity / pending_quantity recomputed; RegistryItem.version += 1."
      - "If RegistryItem.status was FULFILLED and new fulfilled_quantity < target, status reverts to OPEN."
      - "Any ThankYouNote on this purchase is hard-deleted."

  - method: POST
    path: "/purchases/{id}/promote"
    description: "Couple promotes a PENDING_REVIEW purchase to CONFIRMED (accept duplicate as a legitimate extra). OCC-guarded."
    roles: [Couple]
    code: 200
    input: [expected_registry_item_version]
    output: Purchase
    side_effects:
      - "purchase.status = CONFIRMED."
      - "RegistryItem.fulfilled_quantity += quantity; pending_quantity -= quantity; RegistryItem.version += 1; status may flip to FULFILLED."
      - "A ThankYouNote(PENDING) is auto-created for this purchase."

  # ---------- ThankYouNote ----------
  - method: GET
    path: "/thank-you-notes"
    description: "List ThankYouNotes; filterable by wedding_id, purchase_id, status (FK reverse-reachability for ThankYouNote.wedding_id and ThankYouNote.purchase_id)."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: ["wedding_id?", "purchase_id?", "status?", "limit?", "offset?"]
    output: ThankYouNote[]
    side_effects: []

  - method: GET
    path: "/thank-you-notes/{id}"
    description: "Read a ThankYouNote."
    roles: [Couple, PlatformAdmin]
    code: 200
    input: []
    output: ThankYouNote
    side_effects: []

  - method: POST
    path: "/thank-you-notes/{id}/draft"
    description: "Couple stores a drafted body and transitions PENDING -> DRAFTED."
    roles: [Couple]
    code: 200
    input: [drafted_body]
    output: ThankYouNote
    side_effects:
      - "status=DRAFTED; drafted_body stored."

  - method: POST
    path: "/thank-you-notes/{id}/send"
    description: "Couple marks the note SENT (DRAFTED -> SENT)."
    roles: [Couple]
    code: 200
    input: []
    output: ThankYouNote
    side_effects:
      - "status=SENT; sent_at=current_utc."

  # ---------- Test-driving endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server clock used for rsvp_deadline_at comparisons, sent_at stamps, and any other current_utc reference. Outside the public business surface (leading underscore)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "All subsequent reads of current_utc on the server return to_iso8601 until reset."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed authentication headers; GuestSelf missing or wrong X-Invitation-Token."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint per §1.7; Couple acting on a Wedding whose couple_user_id != X-User-ID."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated id refers to a resource that does not exist (Wedding, Guest, PlusOne, Table, MealOption, RegistryItem, Purchase, ThankYouNote, SeatingAssignment)."

  - id: ERR_WEDDING_ARCHIVED
    http: 409
    condition: "Mutation attempted on an ARCHIVED Wedding or any of its children."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation requires the target entity to be in a state it is not in (e.g., finalize-seating with wedding.status != RSVP_CLOSED; draft on a ThankYouNote whose status != PENDING; cancel-duplicate on a CANCELLED Purchase)."

  - id: ERR_KIDS_MEAL_PAIRING
    http: 422
    condition: "MealOption.is_kids and assignee.is_child do not match (adult picked kids meal, or child picked adult meal)."

  - id: ERR_KIDS_SEATING_VIOLATION
    http: 422
    condition: "Non-child assignee placed at a kids_only=true Table, OR a child placed at a non-kids_only Table while at least one kids_only Table still has open slots."

  - id: ERR_PLUS_ONE_NOT_ALLOWED
    http: 422
    condition: "Adding a PlusOne to a Guest with plus_one_allowed=false, or adding a second PlusOne, or toggling plus_one_allowed=false while a PlusOne exists."

  - id: ERR_CROSS_WEDDING_REFERENCE
    http: 422
    condition: "A foreign-key reference crosses Wedding boundaries (Guest.meal_option_id.wedding_id != Guest.wedding_id; SeatingAssignment.table_id.wedding_id != SeatingAssignment.wedding_id; Purchase.registry_item_id.wedding_id != ThankYouNote.wedding_id)."

  - id: ERR_MEAL_FULL
    http: 422
    condition: "Setting a meal_option_id would push count(MealOption) above MealOption.max_servings."

  - id: ERR_TABLE_FULL
    http: 422
    condition: "Creating a SeatingAssignment when Table already has capacity assignees."

  - id: ERR_ALREADY_SEATED
    http: 422
    condition: "SeatingAssignment unique-key violation on (wedding_id, assignee_type, assignee_id)."

  - id: ERR_RSVP_DEADLINE_PASSED
    http: 409
    condition: "GuestSelf attempts to RSVP after current_utc >= wedding.rsvp_deadline_at."

  - id: ERR_DUPLICATE_EXTERNAL_PURCHASE
    http: 409
    condition: "Purchase ingest with (platform_code, external_purchase_id) already on record where the existing row's quantity differs from the new payload (true key conflict, not idempotent replay)."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch on finalize-seating (expected_wedding_version != wedding.version), cancel-duplicate (expected_registry_item_version != registry_item.version), or promote."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed enum, integer out of range, drafted_body empty on /draft, etc."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Couple
    description: "The couple who owns the wedding; can manage every aspect of their own Wedding's lifecycle, guests, registry, and notes."
    identity: "opaque"   # X-User-ID is the couple_user_id stored on Wedding; not tied to a separate Couple entity in this scaffold.
    exclusive_operations:
      - "POST /weddings"
      - "POST /weddings/{id}/open-rsvp"
      - "POST /weddings/{id}/close-rsvp"
      - "POST /weddings/{id}/finalize-seating"
      - "POST /weddings/{id}/auto-seat"
      - "POST /weddings/{id}/meal-options"
      - "POST /weddings/{id}/tables"
      - "POST /weddings/{id}/guests"
      - "POST /guests/{id}/revoke-rsvp"
      - "POST /guests/{id}/plus-ones"
      - "DELETE /plus-ones/{id}"
      - "POST /seating-assignments"
      - "DELETE /seating-assignments/{id}"
      - "POST /weddings/{id}/registry-items"
      - "POST /purchases/{id}/cancel-duplicate"
      - "POST /purchases/{id}/promote"
      - "POST /thank-you-notes/{id}/draft"
      - "POST /thank-you-notes/{id}/send"
      - "GET /weddings/{id}/thank-you-report"
      - "GET /weddings/{id}/auto-seat"
    shared_operations:
      - "GET /weddings, /weddings/{id}"
      - "POST /weddings/{id}/archive (shared with PlatformAdmin)"
      - "POST /guests/{id}/rsvp (shared with GuestSelf)"
      - "POST /plus-ones/{id}/rsvp (shared with GuestSelf)"
      - "POST /registry-items/{id}/purchases (shared with PlatformIntegration)"
      - "GET reads on child resources of own wedding"

  - name: GuestSelf
    description: "An invited guest acting via X-Invitation-Token; can only operate on the Guest they were issued to (and that Guest's PlusOne)."
    identity: "entity_backed:Guest"  # X-User-ID equals Guest.id; X-Invitation-Token verifies the binding.
    exclusive_operations: []
    shared_operations:
      - "POST /guests/{id}/rsvp on own Guest"
      - "POST /plus-ones/{id}/rsvp on own Guest's PlusOne"
      - "GET /guests/{id} on own Guest"
      - "GET /plus-ones/{id} on own Guest's PlusOne"
      - "GET /weddings/{id}/meal-options on the Wedding they were invited to"

  - name: PlatformIntegration
    description: "Server-to-server integration that pushes cross-platform gift purchases into the registry. No access to RSVP, seating, or thank-you notes."
    identity: "opaque"   # X-User-ID is a platform integration identifier.
    exclusive_operations: []
    shared_operations:
      - "POST /registry-items/{id}/purchases"
      - "GET /registry-items, /registry-items/{id}"
      - "GET /registry-items/{id}/purchases"
      - "GET /purchases/{id}"

  - name: PlatformAdmin
    description: "Operator role for the platform itself; read-only on every wedding's content, plus the ability to archive and to drive the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all weddings"
      - "POST /weddings/{id}/archive (shared with Couple)"
