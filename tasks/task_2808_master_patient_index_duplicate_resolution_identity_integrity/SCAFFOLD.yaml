  - method: GET
    path: "/mpi/patient-records/{id}"
    purpose: "Read one patient record including enterprise_id, identity_state, integrity_state and subsumed_member_count."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: PatientRecord
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RECORD_NOT_FOUND]

  - method: GET
    path: "/mpi/patient-records"
    purpose: "List/filter patient records. Reverse reachability for site_id, origin_search_attempt_id and the self-referential survivor_record_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - site_id?
      - survivor_record_id?
      - origin_search_attempt_id?
      - identity_state?
      - integrity_state?
      - enterprise_id?
