            - call: "GET /cosmetology/infection-incidents/00000000-0000-4000-8000-0000000000a9"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "GET /cosmetology/ledger-entries/00000000-0000-4000-8000-0000000000b1"
              payload: {}
              as: BoardAdmin
