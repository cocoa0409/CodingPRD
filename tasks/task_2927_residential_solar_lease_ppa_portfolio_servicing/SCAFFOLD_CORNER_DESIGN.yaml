            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoR4_id}", tariff_id: "${tR4_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agR4_id: $.data.id }
            - call: "POST /servicing/agreements/${agR4_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${agR4_id}", transfer_type: "PREPAYMENT", closing_date: "2026-07-31" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${agR4_id}", transfer_type: "PREPAYMENT", closing_date: "2026-08-01" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tcR4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/transfer-cases/${tcR4_id}/clear-title"
              payload: {}
              as: TitleAgent
              as_user_id: "u_title_1"
          assert:
            - "the first creation returns HTTP 422 with ERR_CLOSING_DATE_IN_PAST: 2026-07-31 is strictly before the clock date 2026-08-01"
            - "the second creation returns 201 with status INITIATED, proving the comparison is strictly-before and a closing on the clock date itself is allowed"
            - "the agreement moved to TRANSFER_PENDING only on the accepted creation, so its version incremented exactly once across the two attempts"
            - "after the clock moves one day, clear-title returns 422 with ERR_CLOSING_DATE_IN_PAST even though every UccFiling precondition holds vacuously and INITIATED -> TITLE_CLEARED is a legal PREPAYMENT transition"
            - "the case is still INITIATED and its version did not change on the failed clearance"

  - section: rbac
    instances:

      - name: missing_or_empty_auth_headers_are_unauthenticated_before_anything_else
        claim_type: authentication_required
        grounds:
          - validations[priority=1].request_authentication
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Priority 1 fires on an absent OR empty-string X-User-ID / X-Role before the path id is resolved and before the body is parsed, so a headerless request to a non-existent id with a malformed body still returns 401 — and the clock endpoint is the single documented exception that needs no headers."
        test_recipe:
          setup:
            - "Empty database. No fixture entity is needed: the ids below are fabricated on purpose."
            - "Header convention for this instance: `as: OMITTED` means the X-Role header is NOT sent at all, `as_user_id: OMITTED` means the X-User-ID header is NOT sent at all, and an empty-string value means the header IS sent with an empty value."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "GET /servicing/agreements"
              payload: {}
              as: OMITTED
              as_user_id: "u_agent_1"
            - call: "GET /servicing/agreements"
              payload: {}
              as: ServicingAgent
              as_user_id: OMITTED
            - call: "GET /servicing/agreements"
              payload: {}
              as: ""
              as_user_id: ""
            - call: "GET /servicing/agreements/ag_missing_0003"
              payload: {}
              as: OMITTED
              as_user_id: OMITTED
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "ag_missing_0003", period_year: 2026 }
              as: OMITTED
              as_user_id: OMITTED
          assert:
            - "all five calls return HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the fourth call returns 401 and NOT 404 ERR_AGREEMENT_NOT_FOUND: authentication precedes path existence"
            - "the fifth call returns 401 and NOT 400 ERR_INVALID_REQUEST even though period_month is missing: authentication precedes body parsing"
            - "the setup clock call succeeded with no X-User-ID at all, confirming POST /_clock/set_current_utc is exempt from priority 1"

      - name: each_role_reaching_for_another_roles_exclusive_operation_is_unauthorized
        claim_type: role_denied
        grounds:
          - validations[priority=2].endpoint_role_permission
          - errors[ERR_UNAUTHORIZED]
          - endpoints[POST /servicing/utility-tariffs]
          - endpoints[POST /servicing/transfer-cases/{transfer_case_id}/run-credit-review]
          - endpoints[POST /servicing/transfer-cases/{transfer_case_id}/clear-title]
          - endpoints[POST /servicing/outage-events/{outage_event_id}/triage]
          - endpoints[POST /servicing/production-periods/{period_id}/reconcile]
          - endpoints[POST /servicing/end-of-term-elections/{election_id}/execute]
        distinguishing_aspect: "Every one of the six roles is denied at least one operation another role holds exclusively, including PortfolioAdmin — which is deliberately NOT a hierarchical override and cannot run a credit review, clear title, triage, dispatch or handle panels."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Every id below is fabricated: priority 2 outranks priority 4, so role denial is observable without any fixture rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "SCE", tariff_code: "TOU-D-4", generation: "NEM_2", retail_rate_per_kwh_millicents: 31000, export_credit_rate_per_kwh_millicents: 26000, monthly_fixed_charge_cents: 1600, effective_from_date: "2021-01-01", grandfathers_predecessors: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/transfer-cases/tc_missing_0003/run-credit-review"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
            - call: "POST /servicing/transfer-cases/tc_missing_0003/clear-title"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "ag_missing_0003", transfer_type: "PREPAYMENT", closing_date: "2026-09-15" }
              as: CreditUnderwriter
              as_user_id: "u_credit_1"
            - call: "POST /servicing/outage-events/oe_missing_0003/triage"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods/pp_missing_0003/reconcile"
              payload: {}
              as: FieldOpsCoordinator
              as_user_id: "u_ops_1"
            - call: "POST /servicing/end-of-term-elections/el_missing_0003/execute"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/roof-work-orders/rw_missing_0003/remove-panels"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "ho_missing_0003", tariff_id: "tf_missing_0003", site_address: "1 Nowhere St", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, base_ppa_rate_per_kwh_millicents: 14750 }
              as: Homeowner
              as_user_id: "ho_missing_0003"
            - call: "GET /servicing/agreements"
              payload: {}
              as: Auditor
              as_user_id: "u_auditor_1"
          assert:
            - "all ten calls return HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "each denial precedes the 404 that the fabricated id would otherwise produce, and precedes the 400 the tariff body would produce for a role that were allowed"
            - "PortfolioAdmin is denied run-credit-review, clear-title and remove-panels, proving the role model is segregation_of_duties and not hierarchical_override"
            - "the tenth call shows an X-Role value that is not one of the six declared roles is also ERR_UNAUTHORIZED, not ERR_INVALID_REQUEST"
            - "no entity exists afterwards: GET /servicing/utility-tariffs as PortfolioAdmin returns total_count 0"

