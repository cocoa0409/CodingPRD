              payload: {}
              as: PlatformAdmin
              captures: { bp2_exp: $.data.expected_monthly_pods }
          assert:
            - "after 199 brews: descale_overdue == false (199 - 0 < 200)"
            - "after the 200th brew: descale_overdue == true (200 - 0 >= 200 — equality trips)"
            - "Household.${bp2_hh}.expected_monthly_pods == 102.00 (4*30*1.0*0.85*1.0)"

      - name: empty_slots_boundary
        grounds:
          - validations[priority=5]
          - errors.ERR_EMPTY_SLOTS
          - entities.AssortmentPlan.fields.slots
        distinguishing_aspect: |
          Metric: collection cardinality (zero, not a number line); endpoint: assortment
          plan creation. slots: [] is rejected with ERR_EMPTY_SLOTS while a single slot
          with facings 1 is accepted — the empty-set edge, distinct from the numeric
          thresholds in the other two instances.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Retail account (floor 0, 10 slots). Owned ACTIVE variety."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Empty Slot Beans", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { bp3_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${bp3_brand}", name: "Solo Cup", roast_level: "LIGHT", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${bp3_brand}"
              captures: { bp3_var: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Corner Mart", region: "US", shelf_slots_total: 10, productivity_floor_cents: 0 }
              as: CategoryManager
              captures: { bp3_acct: $.data.id, bp3_acct_v: $.data.version }
          trigger:
            - call: "POST /retail-accounts/${bp3_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${bp3_acct_v}", period: "2026-10", slots: [] }
              as: CategoryManager
              captures: { bp3_err: $.data.error_id }
            - call: "POST /retail-accounts/${bp3_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${bp3_acct_v}", period: "2026-10", slots: [{variety_id: "${bp3_var}", facings: 1, clearance_flag: false}] }
              as: CategoryManager
              captures: { bp3_plan: $.data.id }
          assert:
            - "empty slots: error_id == ERR_EMPTY_SLOTS (400) and RetailAccount.version is unchanged"
            - "one-slot plan: created 201 with status DRAFT — the boundary is zero slots, not one"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_requires_variety_active
        grounds:
          - validations[priority=11]
          - state_machines.PodVariety.ACTIVE_to_PHASE_OUT
          - errors.ERR_VARIETY_NOT_ACTIVE
        distinguishing_aspect: |
          Pair ProductionRun -> PodVariety: run creation reads the variety's current
          state; a PHASE_OUT variety (perfectly valid for brewing and assortment) is
          rejected for new production with ERR_VARIETY_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Owned variety moved ACTIVE -> PHASE_OUT. Line available 2026-09-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Phaseout Beans", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { ce1_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${ce1_brand}", name: "Old Faithful", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${ce1_brand}"
              captures: { ce1_var: $.data.id }
            - call: "POST /pod-varieties/${ce1_var}/transition"
              payload: { target_state: "PHASE_OUT" }
              as: BrandManager
              as_user_id: "${ce1_brand}"
            - call: "POST /facilities"
              payload: { name: "Fresno Plant", kind: "OWNED", region: "US-W" }
              as: OperationsDirector
              captures: { ce1_fac: $.data.id }
            - call: "POST /facilities/${ce1_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { ce1_line: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${ce1_line}", variety_id: "${ce1_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { ce1_err: $.data.error_id }
          assert:
            - "error_id == ERR_VARIETY_NOT_ACTIVE (409) — PHASE_OUT blocks new production"

      - name: issue_requires_agreement_not_suspended
        grounds:
          - validations[priority=11]
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - errors.ERR_LICENSE_SUSPENDED
        distinguishing_aspect: |
          Pair RoyaltyStatement -> LicenseAgreement (different pair than Run->Variety): a
          DRAFT statement created while the agreement was ACTIVE cannot be ISSUED after a
          quality FAIL suspends the agreement — ERR_LICENSE_SUSPENDED, distinct from a
          generic state error on the statement itself.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. ACTIVE agreement; statement 2026-08 created in DRAFT; then a FAIL audit suspends the agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Suspenders Coffee", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { ce2_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${ce2_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ce2_ag: $.data.id }
            - call: "POST /license-agreements/${ce2_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${ce2_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 1000, sell_through_units: 1000, unlicensed_share_pct: 0 }
              as: FinanceAnalyst
              captures: { ce2_st: $.data.id }
            - call: "POST /license-agreements/${ce2_ag}/quality-audits"
              payload: { audited_at: "2026-09-01T00:00:00Z", cup_score: 65, defect_rate_ppm: 50 }
              as: QualityAuditor
          trigger:
            - call: "POST /royalty-statements/${ce2_st}/transition"
              payload: { target_state: "ISSUED" }
              as: FinanceAnalyst
              captures: { ce2_err: $.data.error_id }
          assert:
            - "the FAIL audit suspended the agreement (status SUSPENDED)"
            - "error_id == ERR_LICENSE_SUSPENDED (409) and the statement remains DRAFT"

      - name: audit_requires_agreement_live
        grounds:
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - endpoints."POST /license-agreements/{id}/quality-audits"
        distinguishing_aspect: |
          Pair QualityAudit -> LicenseAgreement (different pair again): audits are accepted
          on ACTIVE or SUSPENDED agreements (remediation path) but rejected with
          ERR_INVALID_STATE once the agreement is TERMINATED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agreement taken ACTIVE then TERMINATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Closed Books Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { ce3_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${ce3_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ce3_ag: $.data.id }
            - call: "POST /license-agreements/${ce3_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${ce3_ag}/transition"
              payload: { target_state: "TERMINATED" }
              as: LicensingManager
          trigger:
            - call: "POST /license-agreements/${ce3_ag}/quality-audits"
              payload: { audited_at: "2026-09-01T00:00:00Z", cup_score: 95, defect_rate_ppm: 10 }
              as: QualityAuditor
              captures: { ce3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409) — no audits on a terminated agreement, even a passing one"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_half_open_plus_changeover_buffer
        grounds:
          - calculations.temporal_overlap_rules
          - errors.ERR_LINE_WINDOW_CONFLICT
          - errors.ERR_CHANGEOVER_BUFFER_VIOLATION
        distinguishing_aspect: |
          Interval semantics (i): HALF-OPEN [start, end) with a conditional buffer —
          back-to-back same-spec runs touching at an endpoint are legal, a following
          different-roast run needs changeover_hours of gap (equality at end+buffer is
          legal), and any interior overlap conflicts.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Line changeover_hours 4, cap 100000/day. V1 MEDIUM, V2 DARK (both owned ACTIVE). Run A: V1 2026-09-10T08:00 -> 2026-09-10T16:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Window Beans", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { ov1_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${ov1_brand}", name: "Window Medium", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${ov1_brand}"
              captures: { ov1_v1: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${ov1_brand}", name: "Window Dark", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${ov1_brand}"
              captures: { ov1_v2: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Boise Plant", kind: "OWNED", region: "US-W" }
              as: OperationsDirector
              captures: { ov1_fac: $.data.id }
            - call: "POST /facilities/${ov1_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 100000, changeover_hours: 4 }
              as: OperationsDirector
              captures: { ov1_line: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${ov1_line}", variety_id: "${ov1_v1}", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { ov1_ra: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${ov1_line}", variety_id: "${ov1_v1}", window_start: "2026-09-10T16:00:00Z", window_end: "2026-09-10T20:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { ov1_rb: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${ov1_line}", variety_id: "${ov1_v2}", window_start: "2026-09-10T20:00:00Z", window_end: "2026-09-10T22:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { ov1_err_buffer: $.data.error_id }
            - call: "POST /production-runs"
              payload: { line_id: "${ov1_line}", variety_id: "${ov1_v2}", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-11T02:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { ov1_rc: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${ov1_line}", variety_id: "${ov1_v1}", window_start: "2026-09-10T15:59:00Z", window_end: "2026-09-10T17:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { ov1_err_olap: $.data.error_id }
          assert:
            - "same-spec adjacency at 16:00 (A.end == B.start): run B created 201 — half-open boundary is legal"
            - "different-roast run at 20:00 exactly after B: ERR_CHANGEOVER_BUFFER_VIOLATION (needs >= 4h gap after 20:00)"
            - "different-roast run at 2026-09-11T00:00 (B.end 20:00 + 4h exactly): created 201 — buffer boundary uses >="
            - "interior overlap 15:59..17:00 against A: ERR_LINE_WINDOW_CONFLICT"

      - name: territory_closed_day_intervals
        grounds:
          - calculations.temporal_overlap_rules
          - errors.ERR_TERRITORY_WINDOW_CONFLICT
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics (ii) on a DIFFERENT resource (LicenseAgreement territory
          windows vs FillingLine runs): CLOSED day-granularity intervals with no buffer —
          an agreement starting the day after another's effective_end is legal, but sharing
          the end date itself conflicts; amendment-chain members are exempt.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensed brand. Agreement A: US 2026-01-01..2026-06-30 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Territory Tea", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { ov2_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${ov2_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-06-30", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ov2_a: $.data.id }
            - call: "POST /license-agreements/${ov2_a}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
          trigger:
            - call: "POST /license-agreements"
              payload: { brand_id: "${ov2_brand}", territory_code: "US", effective_start: "2026-07-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ov2_b: $.data.id }
            - call: "POST /license-agreements/${ov2_b}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { ov2_b_status: $.data.status }
            - call: "POST /license-agreements"
              payload: { brand_id: "${ov2_brand}", territory_code: "US", effective_start: "2026-06-30", effective_end: "2026-08-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { ov2_c: $.data.id }
            - call: "POST /license-agreements/${ov2_c}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { ov2_err: $.data.error_id }
          assert:
            - "agreement B (starting 2026-07-01, the day AFTER A's end) activates: status == ACTIVE — closed intervals are disjoint here"
            - "agreement C (starting 2026-06-30, ON A's inclusive end date): activation rejected ERR_TERRITORY_WINDOW_CONFLICT (409)"
            - "contrast with line windows: day-granularity closed intervals reject the shared boundary day that half-open semantics would allow"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capacity_reserve_cancel_conservation
        grounds:
          - calculations.filling_line_capacity
          - state_machines.ProductionRun.RESERVED_to_CANCELLED
          - entities.Facility.fields.total_capacity_pods_per_day
        distinguishing_aspect: |
          Conserved quantity: bookable capacity-units per line window. Reserve then cancel
          is a forward/compensating pair — after the pair, a run of exactly
          capacity*window_days (20000) books again with 201, proving
          free = capacity*days - sum(non-terminal planned) drifted by zero.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Owned ACTIVE variety; line cap 10000/day; window W = 2026-09-10T00:00..2026-09-12T00:00 (2 days, bookable 20000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Conservation Beans", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { ci1_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${ci1_brand}", name: "Steady Medium", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${ci1_brand}"
              captures: { ci1_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Ely Plant", kind: "OWNED", region: "US-W" }
              as: OperationsDirector
              captures: { ci1_fac: $.data.id, ci1_cap0: $.data.total_capacity_pods_per_day }
            - call: "POST /facilities/${ci1_fac}/filling-lines"
              payload: { line_code: "L1", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 10000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { ci1_line: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { line_id: "${ci1_line}", variety_id: "${ci1_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", planned_units: 20000 }
              as: ProductionPlanner
              captures: { ci1_r1: $.data.id }
            - call: "POST /production-runs/${ci1_r1}/transition"
              payload: { target_state: "CANCELLED" }
              as: ProductionPlanner
            - call: "POST /production-runs"
              payload: { line_id: "${ci1_line}", variety_id: "${ci1_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", planned_units: 20000 }
              as: ProductionPlanner
              captures: { ci1_r2: $.data.id }
          assert:
            - "first reserve at exactly capacity*window_days (20000 == 10000*2) succeeds 201 — boundary uses <="
            - "cancel returns 200 with status CANCELLED"
            - "the identical second reserve succeeds 201 — the compensating cancel restored the full window (invariant: capacity_units conserved)"
            - "Facility.${ci1_fac}.total_capacity_pods_per_day == 10000 throughout (physical capacity untouched by reservations)"

      - name: installed_base_register_replace_conservation
        grounds:
          - entities.Household.fields.installed_brewers
          - state_machines.Brewer
          - calculations.household_consumption_model
        distinguishing_aspect: |
          Conserved quantity: household installed-base COUNT (a different quantity type
          than capacity units). Register then replacement-decommission returns
          installed_brewers to 0 and expected_monthly_pods to 0.00 — the forward action
          and its compensating action leave the named quantity unchanged.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Household size 4 (installed_brewers 0, CHURNED, expected 0.00). One brewer registered, then decommissioned via an APPROVED REPLACEMENT event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { region: "NW", size: 4 }
              as: PlatformAdmin
              captures: { ci2_hh: $.data.id, ci2_i0: $.data.installed_brewers, ci2_e0: $.data.expected_monthly_pods }
            - call: "POST /brewer-models"
              payload: { model_code: "K-CONS", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 7000, unit_cost_cents: 6000 }
              as: PlatformAdmin
              captures: { ci2_model: $.data.id }
            - call: "POST /households/${ci2_hh}/brewers"
              payload: { model_id: "${ci2_model}", serial_number: "SN-CI2-1" }
              as: PlatformAdmin
              captures: { ci2_br: $.data.id }
          trigger:
            - call: "POST /brewers/${ci2_br}/service-events"
              payload: { kind: "REPLACEMENT", note: "dead on arrival" }
              as: SupportAgent
              captures: { ci2_ev: $.data.id }
            - call: "POST /service-events/${ci2_ev}/resolve"
              payload: { outcome: "APPROVED" }
              as: SupportAgent
            - call: "GET /households/${ci2_hh}"
              payload: {}
              as: PlatformAdmin
              captures: { ci2_i1: $.data.installed_brewers, ci2_e1: $.data.expected_monthly_pods, ci2_g1: $.data.engagement }
          assert:
            - "at creation: installed_brewers == 0, engagement == CHURNED, expected_monthly_pods == 0.00"
            - "after registration the household read showed installed_brewers == 1 (ENGAGED, expected 120.00)"
            - "after the REPLACEMENT resolution: installed_brewers == 0 again — register+decommission conserve the installed-base count"
            - "engagement == CHURNED and expected_monthly_pods == 0.00 — identical to the pre-registration state"
