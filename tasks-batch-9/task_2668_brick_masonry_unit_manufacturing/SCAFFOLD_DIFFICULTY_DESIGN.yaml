            - "Checkpoint 0 - ${a_proven} == 5000.00 with ${a_avail_0} == 5000.00, ${a_comm_0} == 0.00, ${a_cons_0} == 0.00: 5000.00 == 5000.00 + 0.00 + 0.00"
            - "${r1_committed} == 32.00 total, so each of the two 50.00 percent pits carries 16.00"
            - "Checkpoint 1 (after COMMIT) - ${a_avail_1} == 4984.00, ${a_comm_1} == 16.00, ${a_cons_1} == 0.00: 5000.00 == 4984.00 + 16.00 + 0.00"
            - "${r1_status} == SET"
            - "Checkpoint 2 (after the TRANSFER) - ${a_avail_2} == 4984.00, ${a_comm_2} == 0.00, ${a_cons_2} == 16.00: available did NOT move, the tonnage shifted from committed to consumed"
            - "Checkpoint 3 (second COMMIT) - ${a_avail_3} == 4968.00, ${a_comm_3} == 16.00, ${a_cons_3} == 16.00: 5000.00 == 4968.00 + 16.00 + 16.00"
            - "${p1_status} == IDLED and ${a_status_4} == SUSPENDED"
            - "${r2_status} == SCRAPPED with ${r2_committed} == 0.00, while ${r1_status_after} == SET is untouched"
            - "Checkpoint 4 (after RELEASE) - ${a_avail_4} == 4984.00, ${a_comm_4} == 0.00, ${a_cons_4} == 16.00: 5000.00 == 4984.00 + 0.00 + 16.00"
            - "The release returned exactly 16.00 tons, NOT 32.00 - R1's already-consumed clay is gone forever and must not be resurrected"
            - "available_tons never exceeds proven_reserve_tons at any checkpoint, and no bucket ever goes negative"
