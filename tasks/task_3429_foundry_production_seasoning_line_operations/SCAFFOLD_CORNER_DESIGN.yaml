              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 10, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v2}" }
              as: SeasoningLead
              as_user_id: sl-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE (HTTP 403)"
            - "GET /foundry/melt-batches?production_order_id=${o_id} returns total_count == 0"
      - name: foundry_manager_cannot_record_outlet_sale
        claim_type: rbac_exclusive_denied
        grounds: ["roles.FoundryManager", "roles.OutletManager", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Outlet sales are exclusive to OutletManager: even the FoundryManager (the broadest operational role) is denied with ERR_UNAUTHORIZED_ROLE — the role model is peer roles with segregation, not hierarchical override."
        test_recipe:
          setup: ["product P exists"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /foundry/outlet-sales"
              payload: { product_id: "${p_id}", channel: FACTORY_OUTLET, qty: 1, unit_price_cents: 3000 }
              as: FoundryManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE (HTTP 403)"
      - name: rbac_shared_get_endpoints_allowed_for_all_roles
        claim_type: rbac_shared_allowed
        grounds: ["roles.OutletManager", "endpoints.GET_/foundry/products"]
        distinguishing_aspect: "Shared read access: every declared role (here OutletManager, the role with the narrowest write surface) can list products and gets the same 200 array envelope."
        test_recipe:
          setup: ["one product exists"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /foundry/products"
              payload: {}
              as: OutletManager
          assert:
            - "HTTP 200, response_type == \"array\", total_count == 1, data[0].id == ${p_id}"
  - section: complexity_layers
    instances:
      - name: stale_order_version_melt_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[melt-create-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on ProductionOrder.version: the client captured version 1 at create, release advanced it to 2, so a melt create still carrying expected_production_order_version 1 is rejected 412 ERR_STALE_ORDER_VERSION and no batch is created."
        test_recipe:
          setup: ["product P; order O created (version 1, captured) then released (version 2)"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "POST /foundry/production-orders"
              payload: { product_id: "${p_id}", planned_quantity: 10, scheduled_week: 40 }
              as: FoundryManager
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /foundry/production-orders/${o_id}/release"
              payload: {}
              as: FoundryManager
          trigger:
            - call: "POST /foundry/melt-batches"
              payload: { production_order_id: "${o_id}", furnace_id: FURNACE_A, planned_tap_start: "2026-09-02T10:00:00Z", planned_tap_end: "2026-09-02T12:00:00Z", planned_iron_lbs: 2000, planned_pig_iron_pct: 40, planned_scrap_steel_pct: 40, planned_returns_pct: 15, planned_alloy_pct: 5, expected_production_order_version: "${o_v}" }
              as: MeltOperator
              as_user_id: op-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_ORDER_VERSION (HTTP 412): expected ${o_v} but the order is at version 2 after release"
            - "GET /foundry/melt-batches?production_order_id=${o_id} returns total_count == 0"
      - name: stale_inventory_version_allocation_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-create-stale-inventory]", "errors[ERR_STALE_INVENTORY_VERSION]"]
        distinguishing_aspect: "OCC on InventoryRecord.version: an allocation create carrying a version one behind the current value is rejected 412 ERR_STALE_INVENTORY_VERSION before the fiscal availability check is even reached (priority 7 beats 28)."
        test_recipe:
          setup: ["product P exists; InventoryRecord auto-created at version 1 (captured)"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
            - call: "GET /foundry/inventory-records"
              payload: { product_id: "${p_id}" }
              as: RetailPlanner
              captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" }
          trigger:
            - call: "POST /foundry/retail-allocations"
              payload: { inventory_record_id: "${inv_id}", channel: RETAIL_CHAIN, allocated_qty: 1, ship_week: "2026-11-16", expected_inventory_version: "${inv_v} - 1" }
              as: RetailPlanner
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_INVENTORY_VERSION (HTTP 412): expected_inventory_version (${inv_v} - 1) is behind the current ${inv_v}"
            - "InventoryRecord.${inv_id}.version == ${inv_v} (rejected request did not bump it) and reserved_units == 0"
      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: emissions_breach_freeze_and_remediation_thaw
          rationale: "The 3-level cascade (reading -> permit -> melt -> order posture) plus the remediation thaw is asserted end-to-end by the named difficulty instance."
      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: unit_cost_provisional_vs_final_at_completion
          rationale: "Both variants and their literal divergence are asserted by the named difficulty instance (and its melt_charge_cost sibling)."
      - name: layer_rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: scrap_index_exactly_at_restrict_threshold
          rationale: "The cumulative threshold at exactly 0.0800 is asserted by the named difficulty instance; the WATCH band edge is asserted by corner scrap_tier_watch_at_exactly_four_percent."
  - section: consistency_model
    instances:
      - name: immediate_consistency_create_then_read
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the POST response and a subsequent GET return the same stored representation (sku_code, prices, computed status), with updated_at == created_at and version == 1 until the first mutation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
              as: FoundryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /foundry/products/${p_id}"
              payload: {}
              as: RetailPlanner
          assert:
            - "GET returns the same field values as the 201 response (sku_code L8SK3, wholesale_price_cents 2400, status ACTIVE)"
            - "Product.${p_id}.version == 1 and updated_at == created_at"
