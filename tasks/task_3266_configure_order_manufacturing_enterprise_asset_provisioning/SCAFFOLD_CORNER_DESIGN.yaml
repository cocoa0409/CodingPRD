              captures:
                vv4_sr: $.data[0].id
            - { call: "POST /api/substitution-requests/${vv4_sr}/reject", payload: {}, as: CustomerUser, as_user_id: "${vv4_a}" }
          trigger:
            - { call: "POST /api/substitution-requests/${vv4_sr}/repropose", payload: { proposed_component_id: "${vv4_x}" }, as: FactoryOps, captures: { vv4_err: $.data.error_id } }
