        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields, entities.StorageUnit.fields.facility_id]
        distinguishing_aspect: "GET /units?facility_id={fac} returns response_type array with pagination fields total_count and has_more; two units for the facility yield total_count 2."
        test_recipe:
          setup: ["A facility with two units."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
