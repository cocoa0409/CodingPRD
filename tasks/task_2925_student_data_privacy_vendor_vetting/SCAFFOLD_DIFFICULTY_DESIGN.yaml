      - name: incident_response_and_notification_dimensions_advance_independently
        grounds:
          - state_machines.VendorIncident.PENDING_to_SENT
          - state_machines.VendorIncident.REPORTED_to_CONTAINED
          - entities.VendorIncident.fields.response_status
          - entities.VendorIncident.fields.notification_status
          - validations[priority=18]
          - errors[ERR_NOTIFICATION_ALREADY_SENT]
        distinguishing_aspect: |
          VendorIncident is the INDEPENDENT-DIMENSIONS machine: response_status and
          notification_status are two orthogonal tracks on one row. Sending the
          notification advances only the notification track (response_status stays
          REPORTED), containing advances only the response track (notification_status
          stays SENT), and the notification track reaching its terminal SENT blocks a
          second send even though the response track is still mid-flight at CONTAINED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Vendor V with breach_notification_hours 72."
            - "One RETENTION_VIOLATION incident of V detected 2026-08-01T00:00:00Z, affected_student_count 5, max_data_tier 1 => severity LOW, STATUTORY_MAX_HOURS 168, effective hours min(72, 168) = 72, notification_due_at 2026-08-04T00:00:00Z."
            - "The notification has been sent (inside the window, so SENT) and the incident has then been contained."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Harborlight Media Inc", hq_country_code: "US", breach_notification_hours: 72, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v_id}", incident_type: "RETENTION_VIOLATION", detected_at: "2026-08-01T00:00:00Z", affected_student_count: 5, max_data_tier: 1 }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /vendor-incidents/${inc_id}/send-notification"
              payload: { notified_party_count: 5 }
              as: PrivacyOfficeAdmin
            - call: "POST /vendor-incidents/${inc_id}/contain"
              payload: { contained_at: "2026-08-01T12:00:00Z", remediation_note: "Retained rows purged." }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "POST /vendor-incidents/${inc_id}/send-notification"
              payload: { notified_party_count: 9 }
              as: PrivacyOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409 and ${err} == ERR_NOTIFICATION_ALREADY_SENT"
            - "VendorIncident.${inc_id}.severity == LOW"
            - "VendorIncident.${inc_id}.notification_due_at == 2026-08-04T00:00:00.000Z"
            - "VendorIncident.${inc_id}.notification_status == SENT"
            - "VendorIncident.${inc_id}.notification_sent_at == 2026-08-01T00:00:00.000Z"
            - "VendorIncident.${inc_id}.notified_party_count == 5 (the rejected second call must not overwrite it with 9)"
            - "VendorIncident.${inc_id}.response_status == CONTAINED"
            - "VendorIncident.${inc_id}.contained_at == 2026-08-01T12:00:00.000Z"
            - "Vendor.${v_id}.open_incident_count == 1"

  - rule_id: transitive_cascade
    instances:

      - name: review_clear_cascades_four_hops_to_teacher_open_request_count
        grounds:
          - state_machines.DataPracticeReview.FINDINGS_ISSUED_to_CLEARED
          - entities.Teacher.fields.open_request_count
          - entities.Application.fields.status
          - entities.ApplicationRequest.fields.status
          - calculations.review_compliance_score
          - calculations.analyst_allocated_minutes
        distinguishing_aspect: |
          One decide call must propagate four hops: review -> CLEARED, Application
          IN_REVIEW -> APPROVED, that Application's TRIAGED_FOR_REVIEW requests ->
          CLOSED_APPROVED, and finally each requester Teacher's open_request_count
          recomputed. The teacher deliberately holds a SECOND request that is only
          SUBMITTED (never triaged), so hop 3 must touch exactly one row and the
          count must land on 1 -- not 0 (over-cascading) and not 2 (no cascade).
