              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PAY_PERIOD_LOCKED"

      - name: timeoff_approve_blocked_by_overlapping_assignment
        grounds:
          - state_machines.TimeOffRequest.PENDING_to_APPROVED
          - state_machines.Assignment.SCHEDULED_to_CONFIRMED
          - errors[ERR_TIME_OFF_CONFLICTS_ASSIGNMENT]
        distinguishing_aspect: |
          A DIFFERENT entity pair TimeOffRequest->Assignment: approving a PENDING
