              as: Technician
              as_user_id: "tech-001"
          trigger:
            - call: "POST /procedure-records/${pr3_id}/calibration-schedule"
              payload: { bay_id: "${bay_id}", window_start: "2026-08-01T10:30:00Z", window_end: "2026-08-01T11:30:00Z" }
              as: Technician
