              payload: { shop_id: "${shop_id}", full_name: "Tina Tech", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { tech_a_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Raj Wrench", credential_expires_at: "2026-12-31T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { tech_b_id: $.data.id }
          trigger:
            - call: "POST /technicians/${tech_a_id}/verify"
              payload: { identity_document_ref: "DL-OLD", credential_expires_at: "2026-07-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /technicians/${tech_b_id}/verify"
              payload: { identity_document_ref: "DL-NEW", credential_expires_at: "2026-08-01T00:00:01Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "expired-credential verify: HTTP status == 409 and response.data.error_id == ERR_SECURITY_CREDENTIAL_EXPIRED"
            - "Technician.${tech_a_id}.identity_status == UNVERIFIED"
            - "one-second-future verify: HTTP status == 200 and identity_status == VERIFIED"
            - "Technician.${tech_b_id}.credential_expires_at == 2026-08-01T00:00:01Z"
            - "clock call: HTTP status == 200 and current_utc == 2026-08-01T00:00:00Z"

