# =============================================================================
# PRD Benchmark Scaffold — Radon Testing & Mitigation (Expert tier)
# =============================================================================

scenario: |
  656. Radon Testing & Mitigation: test placement & 48-hr/continuous monitor,
  result & EPA action-level (4 pCi/L), mitigation-system design & quote, install
  (sub-slab depressurization) & permit, post-mitigation retest & guarantee,
  real-estate-transaction rush, warranty, recurring retest

domain_name: radon-testing-mitigation
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # Flat top-level collections linked by foreign keys (no nesting in URL paths):
  # /properties, /inspectors, /crews, /radon-tests, /mitigation-jobs, /permits,
  # /warranties, /retest-schedules, /payment-records. Children carry FK fields
  # (property_id, mitigation_job_id, warranty_id, etc.) and are discovered via
  # filtered-list GETs. Cross-aggregate references (RadonTest→Inspector,
  # MitigationJob→MitigationCrew) span the flat graph.
  state_machine_shape: cyclic
  # RadonTest carries a placement→retrieval→result cycle; MitigationJob carries a
  # retest→re-mitigation loop; Warranty carries parallel operational × coverage
  # dimensions; Property posture is compound over its jobs/tests.
  relationship_patterns:
    - one_to_many       # Property has many RadonTests, MitigationJobs
    - cross_aggregate   # RadonTest references Inspector; MitigationJob references MitigationCrew
    - flat              # Inspector, MitigationCrew are peer resources with FK links
  role_model: peer_roles
  # Inspector places/retrieves tests; MitigationDesigner quotes/designs; CrewLead
  # installs; ComplianceOfficer issues permits & guarantees; ClientContact (the
  # homeowner / real-estate party) authorizes work. PlatformAdmin overrides.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: address_line, type: string, source: input, description: "Street address of the dwelling" }
      - { name: foundation_type, type: enum, source: input, description: "SLAB | BASEMENT | CRAWLSPACE — drives quote base and suction-point geometry", constraints: "one of SLAB, BASEMENT, CRAWLSPACE" }
      - { name: floor_area_sqft, type: integer, source: input, description: "Conditioned floor area; feeds the quote area surcharge tiers", constraints: "> 0" }
      - { name: is_real_estate_transaction, type: boolean, source: input, default: false, description: "True when the property is mid-sale; unlocks rush handling and the closing deadline" }
      - { name: closing_deadline_utc, type: datetime, source: input, default: null, description: "Real-estate closing date; required when is_real_estate_transaction=true. ISO 8601 UTC" }
      - { name: posture, type: enum, source: computed, description: "OPEN | TESTING | MITIGATION_REQUIRED | MITIGATING | CLEARED — compound posture derived from child RadonTest/MitigationJob states", constraints: "one of OPEN, TESTING, MITIGATION_REQUIRED, MITIGATING, CLEARED" }
      - { name: latest_result_pci_l, type: number, source: computed, description: "pCi/L of the most recent RadonTest in RESULT_READY state (by created_at desc); null if none", default: null }
      - { name: open_test_count, type: integer, source: computed, default: 0, description: "Count of RadonTests on this property not in a terminal state" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector legal name" }
      - { name: nrpp_license_id, type: string, source: input, description: "National Radon Proficiency Program license identifier; unique among ACTIVE inspectors" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — only ACTIVE inspectors may be assigned to placements", constraints: "one of ACTIVE, SUSPENDED" }

  - name: MitigationCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Installation crew label" }
      - { name: max_jobs_per_day, type: integer, source: input, default: 2, description: "Daily install capacity used by the install-window overlap rule", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "one of ACTIVE, SUSPENDED" }

  - name: RadonTest
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the inspector who places and retrieves the device" }
      - { name: test_kind, type: enum, source: input, description: "SHORT_TERM_48HR | CONTINUOUS_MONITOR — selects the averaging variant", constraints: "one of SHORT_TERM_48HR, CONTINUOUS_MONITOR" }
      - { name: purpose, type: enum, source: input, default: "INITIAL", description: "INITIAL | POST_MITIGATION | RECURRING — POST_MITIGATION links to a MitigationJob", constraints: "one of INITIAL, POST_MITIGATION, RECURRING" }
      - { name: mitigation_job_id, type: string, source: input, default: null, description: "FK -> MitigationJob.id; required when purpose=POST_MITIGATION, else must be null" }
      - { name: placement_start_utc, type: datetime, source: system, description: "Logical-clock instant when the device was placed" }
      - { name: placement_window_hours, type: integer, source: input, default: 48, description: "Required minimum exposure window in hours before retrieval is allowed", constraints: ">= 48" }
      - { name: hourly_readings, type: array, source: input, default: null, description: "Array of hourly pCi/L numbers supplied at retrieval for CONTINUOUS_MONITOR; null for SHORT_TERM_48HR" }
      - { name: lab_integrated_pci_l, type: number, source: input, default: null, description: "Single integrated pCi/L value supplied at retrieval for SHORT_TERM_48HR; null for CONTINUOUS_MONITOR" }
      - { name: result_pci_l, type: number, source: computed, default: null, description: "Final averaged radon concentration; set when result is recorded" }
      - { name: action_outcome, type: enum, source: computed, default: null, description: "NO_ACTION | ACTION_RECOMMENDED — computed against the 4.0 pCi/L action level", constraints: "one of NO_ACTION, ACTION_RECOMMENDED" }
      - { name: warmup_hours_dropped, type: integer, source: input, default: 4, description: "Number of leading hourly readings discarded as device warm-up for CONTINUOUS_MONITOR", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "PLACED", description: "PLACED | RETRIEVED | RESULT_READY | VOIDED", constraints: "one of PLACED, RETRIEVED, RESULT_READY, VOIDED" }

  - name: MitigationJob
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id" }
      - { name: triggering_test_id, type: string, source: input, description: "FK -> RadonTest.id; the ACTION_RECOMMENDED test that justified this job" }
      - { name: crew_id, type: string, source: input, default: null, description: "FK -> MitigationCrew.id; assigned at scheduling" }
      - { name: system_design, type: enum, source: input, default: "SUB_SLAB_DEPRESSURIZATION", description: "SUB_SLAB_DEPRESSURIZATION | SUB_MEMBRANE_DEPRESSURIZATION — design class", constraints: "one of SUB_SLAB_DEPRESSURIZATION, SUB_MEMBRANE_DEPRESSURIZATION" }
      - { name: num_suction_points, type: integer, source: input, default: 1, description: "Suction points in the design; feeds the quote", constraints: ">= 1" }
      - { name: has_sump_pump, type: boolean, source: input, default: false, description: "Whether a sump-pit seal is required; feeds the quote" }
      - { name: is_rush, type: boolean, source: input, default: false, description: "Real-estate rush; adds the rush surcharge and tightens scheduling" }
      - { name: warranty_term_days, type: integer, source: input, default: 1825, description: "Warranty term length to snapshot into the Warranty at clear", constraints: ">= 1" }
      - { name: warranty_guarantee_ceiling_pci_l, type: number, source: input, default: 2.0, description: "Guarantee ceiling to snapshot into the Warranty at clear", constraints: "> 0" }
      - { name: warranty_refund_method, type: enum, source: input, default: "STRAIGHT_LINE", description: "STRAIGHT_LINE | STEP_TIER — refund variant to snapshot into the Warranty at clear", constraints: "one of STRAIGHT_LINE, STEP_TIER" }
      - { name: retest_interval_days, type: integer, source: input, default: 730, description: "Recurring retest cadence to snapshot into the RetestSchedule at clear", constraints: ">= 1" }
      - { name: quote_subtotal_cents, type: integer, source: computed, default: null, description: "Quote before rush surcharge" }
      - { name: rush_surcharge_cents, type: integer, source: computed, default: 0, description: "15% of subtotal when is_rush, else 0" }
      - { name: quote_total_cents, type: integer, source: computed, default: null, description: "subtotal + rush_surcharge" }
      - { name: deposit_required_cents, type: integer, source: computed, default: null, description: "30% of quote_total, round_half_up" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Deposit actually recorded" }
      - { name: balance_paid_cents, type: integer, source: system, default: 0, description: "Final balance recorded at completion" }
      - { name: permit_id, type: string, source: system, default: null, description: "Denormalized pointer to the currently-ISSUED Permit for this job (set on issue, cleared on revoke); the canonical link is Permit.mitigation_job_id. Discover permits via GET /permits?mitigation_job_id=." }
      - { name: install_start_utc, type: datetime, source: input, default: null, description: "Scheduled install window start; ISO 8601 UTC" }
      - { name: install_end_utc, type: datetime, source: input, default: null, description: "Scheduled install window end; ISO 8601 UTC" }
      - { name: retest_passed, type: boolean, source: computed, default: false, description: "True once a POST_MITIGATION RadonTest on this job yields NO_ACTION" }
      - { name: status, type: enum, source: system, default: "DESIGN", description: "DESIGN | QUOTED | SCHEDULED | INSTALLED | RETEST_PENDING | CLEARED | REWORK | CANCELLED", constraints: "one of DESIGN, QUOTED, SCHEDULED, INSTALLED, RETEST_PENDING, CLEARED, REWORK, CANCELLED" }

  - name: Permit
    parent: MitigationJob
    common_fields: true
    fields:
      - { name: mitigation_job_id, type: string, source: system, description: "FK -> MitigationJob.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "Issuing authority code (e.g., county code)" }
      - { name: permit_number, type: string, source: input, description: "Authority-assigned permit number; unique among ISSUED permits in a jurisdiction" }
      - { name: issued_at_utc, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | CLOSED | REVOKED", constraints: "one of ISSUED, CLOSED, REVOKED" }

  - name: Warranty
    parent: MitigationJob
    common_fields: true
    fields:
      - { name: mitigation_job_id, type: string, source: system, description: "FK -> MitigationJob.id" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id" }
      - { name: covered_system_price_cents, type: integer, source: system, description: "Snapshot of MitigationJob.quote_total_cents at issuance; basis for refund proration" }
      - { name: term_days, type: integer, source: system, default: 1825, description: "Warranty term length in days (snapshot of MitigationJob.warranty_term_days at issuance; default 5 years)", constraints: ">= 1" }
      - { name: started_at_utc, type: datetime, source: system, description: "Logical-clock instant warranty coverage began (job CLEARED)" }
      - { name: guarantee_ceiling_pci_l, type: number, source: system, default: 2.0, description: "Guaranteed maximum radon level (snapshot of MitigationJob.warranty_guarantee_ceiling_pci_l); a recurring/post retest at or above this triggers free rework", constraints: "> 0" }
      - { name: refund_method, type: enum, source: system, default: "STRAIGHT_LINE", description: "STRAIGHT_LINE | STEP_TIER — selects the cancellation-refund variant (snapshot of MitigationJob.warranty_refund_method)", constraints: "one of STRAIGHT_LINE, STEP_TIER" }
      - { name: refund_paid_cents, type: integer, source: computed, default: 0, description: "Computed prorated refund when warranty is CANCELLED" }
      - { name: coverage_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED | CANCELLED — coverage dimension", constraints: "one of ACTIVE, EXPIRED, CANCELLED" }
      - { name: claim_status, type: enum, source: system, default: "NONE", description: "NONE | CLAIM_OPEN | CLAIM_RESOLVED — independent claim dimension evolving separately from coverage_status", constraints: "one of NONE, CLAIM_OPEN, CLAIM_RESOLVED" }

  - name: RetestSchedule
    parent: Warranty
    common_fields: true
    fields:
      - { name: warranty_id, type: string, source: system, description: "FK -> Warranty.id" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id" }
      - { name: interval_days, type: integer, source: input, default: 730, description: "Days between recurring retests (default 2 years)", constraints: ">= 1" }
      - { name: next_due_utc, type: datetime, source: computed, description: "Logical-clock instant the next recurring retest becomes due" }
      - { name: last_fired_utc, type: datetime, source: system, default: null, description: "Logical-clock instant the schedule last produced a RECURRING RadonTest" }
      - { name: fired_count, type: integer, source: system, default: 0, description: "Number of RECURRING RadonTests this schedule has produced" }
      - { name: status, type: enum, source: system, default: "ARMED", description: "ARMED | PAUSED | ENDED", constraints: "one of ARMED, PAUSED, ENDED" }

  - name: PaymentRecord
    parent: MitigationJob
    common_fields: false
    fields:
      - { name: mitigation_job_id, type: string, source: system, description: "FK -> MitigationJob.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND — append-only ledger entry kind", constraints: "one of DEPOSIT, BALANCE, REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount in cents; positive for DEPOSIT/BALANCE, negative for REFUND" }
      - { name: recorded_at_utc, type: datetime, source: system, description: "Logical-clock instant of the ledger entry" }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical clock value; defaults to 2026-04-01T00:00:00Z at server start" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # RadonTest — placement → retrieval → result, with a void revert (cyclic-ish:
  # PLACED can be re-entered only by creating a fresh test; VOIDED is terminal).
  # ---------------------------------------------------------------------------
  - entity: RadonTest
    initial_state: PLACED
    terminal_states: [RESULT_READY, VOIDED]
    transitions:
      - from: PLACED
        to: RETRIEVED
        trigger: "POST /radon-tests/{testId}/retrieve"
        actor: Inspector
        preconditions:
          - "RadonTest.status == PLACED"
          - "clock.current_utc - placement_start_utc >= placement_window_hours hours (else ERR_PLACEMENT_WINDOW_NOT_ELAPSED)"
          - "Assigned Inspector.status == ACTIVE (else ERR_INSPECTOR_SUSPENDED)"
          - "For CONTINUOUS_MONITOR: hourly_readings present and length > warmup_hours_dropped (else ERR_INSUFFICIENT_READINGS)"
          - "For SHORT_TERM_48HR: lab_integrated_pci_l present and >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Record retrieval payload (hourly_readings or lab_integrated_pci_l) on the test"
          - "Property.open_test_count unchanged (still open until RESULT_READY)"
      - from: RETRIEVED
        to: RESULT_READY
        trigger: "POST /radon-tests/{testId}/record-result"
        actor: Inspector
        preconditions:
          - "RadonTest.status == RETRIEVED"
        side_effects:
          - "Compute result_pci_l via radon_result_average (variant by test_kind)"
          - "Compute action_outcome via action_level_classification (ACTION_RECOMMENDED iff result_pci_l >= 4.0)"
          - "Decrement Property.open_test_count by 1"
          - "Recompute Property.latest_result_pci_l and Property.posture (compound)"
          - "CASCADE depth-3 (INITIAL ACTION_RECOMMENDED): set Property.posture=MITIGATION_REQUIRED; this posture write makes the property eligible for MitigationJob creation"
          - "CASCADE (POST_MITIGATION test linked to a job): if NO_ACTION, set MitigationJob.retest_passed=true which itself drives the job RETEST_PENDING→CLEARED transition (see MitigationJob); if ACTION_RECOMMENDED, drive job RETEST_PENDING→REWORK"
      - from: PLACED
        to: VOIDED
        trigger: "POST /radon-tests/{testId}/void"
        actor: Inspector | PlatformAdmin
        preconditions:
          - "RadonTest.status == PLACED"
        side_effects:
          - "Decrement Property.open_test_count by 1"
          - "Recompute Property.posture (compound)"

  # ---------------------------------------------------------------------------
  # MitigationJob — design → quote → schedule → install → retest loop → cleared.
  # CYCLIC: RETEST_PENDING → REWORK → SCHEDULED (re-install and retest again).
  # ---------------------------------------------------------------------------
  - entity: MitigationJob
    initial_state: DESIGN
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: DESIGN
        to: QUOTED
        trigger: "POST /mitigation-jobs/{jobId}/quote"
        actor: MitigationDesigner
        preconditions:
          - "MitigationJob.status == DESIGN"
          - "Property.posture == MITIGATION_REQUIRED (cross-entity: triggering_test.action_outcome == ACTION_RECOMMENDED) (else ERR_NO_ACTIONABLE_RESULT)"
        side_effects:
          - "Compute quote_subtotal_cents, rush_surcharge_cents, quote_total_cents via mitigation_quote"
          - "Compute deposit_required_cents = round_half_up(0.30 * quote_total_cents)"
      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /mitigation-jobs/{jobId}/schedule"
        actor: MitigationDesigner
        preconditions:
          - "MitigationJob.status == QUOTED"
          - "deposit_paid_cents >= deposit_required_cents (else ERR_DEPOSIT_NOT_SATISFIED)"
          - "crew_id references MitigationCrew.status == ACTIVE (else ERR_CREW_SUSPENDED)"
          - "install_start_utc < install_end_utc (else ERR_INVALID_WINDOW)"
          - "Install window does not push past closing_deadline_utc when is_rush (else ERR_RUSH_DEADLINE_MISSED)"
          - "Crew's install windows on the install day do not exceed max_jobs_per_day and the new window does not overlap an existing SCHEDULED job's window for that crew (else ERR_CREW_WINDOW_CONFLICT)"
        side_effects:
          - "Set Property.posture = MITIGATING (compound)"
          - "Set crew_id, install_start_utc, install_end_utc"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /mitigation-jobs/{jobId}/complete-install"
        actor: CrewLead
        preconditions:
          - "MitigationJob.status == SCHEDULED"
          - "permit_id is set and Permit.status == ISSUED (cross-entity, else ERR_PERMIT_REQUIRED)"
          - "clock.current_utc >= install_start_utc (else ERR_INSTALL_NOT_DUE)"
        side_effects:
          - "Mark install complete; job now awaits a post-mitigation retest"
      - from: INSTALLED
        to: RETEST_PENDING
        trigger: "POST /radon-tests with purpose=POST_MITIGATION, mitigation_job_id={jobId}"
        actor: Inspector
        preconditions:
          - "MitigationJob.status == INSTALLED (cross-entity guard on test placement, else ERR_RETEST_NOT_ALLOWED)"
        side_effects:
          - "A POST_MITIGATION RadonTest is placed against this job; job enters RETEST_PENDING"
      - from: RETEST_PENDING
        to: CLEARED
        trigger: "system (POST_MITIGATION RadonTest reaches RESULT_READY with NO_ACTION)"
        actor: system
        preconditions:
          - "Linked POST_MITIGATION RadonTest.action_outcome == NO_ACTION"
          - "balance_paid_cents >= (quote_total_cents - deposit_required_cents) (else ERR_BALANCE_NOT_SATISFIED)"
        side_effects:
          - "Set retest_passed=true"
          - "CASCADE depth-3: issue Warranty (coverage_status=ACTIVE, claim_status=NONE) snapshotting covered_system_price_cents=quote_total_cents, term_days=warranty_term_days, guarantee_ceiling_pci_l=warranty_guarantee_ceiling_pci_l, refund_method=warranty_refund_method, started_at_utc=clock.current_utc; warranty issuance itself arms a RetestSchedule (interval_days=retest_interval_days, next_due_utc = warranty.started_at_utc + interval_days); set Property.posture=CLEARED"
      - from: RETEST_PENDING
        to: REWORK
        trigger: "system (POST_MITIGATION RadonTest reaches RESULT_READY with ACTION_RECOMMENDED)"
        actor: system
        preconditions:
          - "Linked POST_MITIGATION RadonTest.action_outcome == ACTION_RECOMMENDED"
        side_effects:
          - "Property.posture remains MITIGATING"
      - from: REWORK
        to: SCHEDULED
        trigger: "POST /mitigation-jobs/{jobId}/schedule"
        actor: MitigationDesigner
        preconditions:
          - "MitigationJob.status == REWORK"
          - "crew_id references MitigationCrew.status == ACTIVE (else ERR_CREW_SUSPENDED)"
          - "install_start_utc < install_end_utc (else ERR_INVALID_WINDOW)"
          - "Crew window does not overlap an existing SCHEDULED job for that crew (else ERR_CREW_WINDOW_CONFLICT)"
        side_effects:
          - "Re-enter the install loop (no additional deposit required; rework is free under guarantee)"
        note: "Cycle edge: RETEST_PENDING→REWORK→SCHEDULED forms the re-mitigation loop."
      - from: DESIGN
        to: CANCELLED
        trigger: "POST /mitigation-jobs/{jobId}/cancel"
        actor: MitigationDesigner | PlatformAdmin
        preconditions:
          - "MitigationJob.status IN {DESIGN, QUOTED}"
        side_effects:
          - "Recompute Property.posture (compound)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /mitigation-jobs/{jobId}/cancel"
        actor: MitigationDesigner | PlatformAdmin
        preconditions:
          - "MitigationJob.status IN {DESIGN, QUOTED}"
        side_effects:
          - "If deposit_paid_cents > 0, append a REFUND PaymentRecord of -deposit_paid_cents and reset deposit_paid_cents to 0 (compensating action: total recorded cash returns to 0)"
          - "Recompute Property.posture (compound)"

  # ---------------------------------------------------------------------------
  # Permit — issued → closed/revoked.
  # ---------------------------------------------------------------------------
  - entity: Permit
    initial_state: ISSUED
    terminal_states: [CLOSED, REVOKED]
    transitions:
      - from: ISSUED
        to: CLOSED
        trigger: "system (MitigationJob reaches CLEARED)"
        actor: system
        preconditions:
          - "Parent MitigationJob.status == CLEARED"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{permitId}/revoke"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "Permit.status == ISSUED"
          - "Parent MitigationJob.status != INSTALLED and != CLEARED (cannot revoke after install complete, else ERR_PERMIT_LOCKED)"
        side_effects:
          - "Clear MitigationJob.permit_id (cross-entity): the job loses its permit and complete-install is blocked again"

  # ---------------------------------------------------------------------------
  # Warranty — PARALLEL dimensions: coverage_status × claim_status evolve
  # independently on the same row.
  # ---------------------------------------------------------------------------
  - entity: Warranty
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      # ----- coverage_status dimension -----
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc then POST /warranties/{warrantyId}/refresh"
        actor: ComplianceOfficer | system
        preconditions:
          - "coverage_status == ACTIVE"
          - "clock.current_utc >= started_at_utc + term_days days"
        side_effects:
          - "Set RetestSchedule.status = ENDED (cross-entity cascade)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /warranties/{warrantyId}/cancel"
        actor: ClientContact | PlatformAdmin
        preconditions:
          - "coverage_status == ACTIVE"
          - "claim_status != CLAIM_OPEN (cannot cancel mid-claim, else ERR_CLAIM_IN_PROGRESS)"
        side_effects:
          - "Compute refund_paid_cents via warranty_refund (variant by refund_method) over covered_system_price_cents"
          - "Append REFUND PaymentRecord of -refund_paid_cents on the MitigationJob"
          - "Set RetestSchedule.status = ENDED (cross-entity cascade)"
      # ----- claim_status dimension (independent of coverage_status) -----
      - from: NONE
        to: CLAIM_OPEN
        trigger: "POST /warranties/{warrantyId}/open-claim"
        actor: ClientContact
        preconditions:
          - "coverage_status == ACTIVE (a claim requires live coverage)"
          - "claim_status == NONE"
          - "Property.latest_result_pci_l >= guarantee_ceiling_pci_l (a qualifying high retest exists, else ERR_NO_QUALIFYING_RETEST)"
        side_effects:
          - "Set claim_status = CLAIM_OPEN; coverage_status is untouched"
          - "Set parent MitigationJob.status = REWORK (cross-entity: guarantee triggers free re-mitigation)"
        note: "Parallel-dimension edge: claim_status advances while coverage_status stays ACTIVE."
      - from: CLAIM_OPEN
        to: CLAIM_RESOLVED
        trigger: "system (the rework MitigationJob returns to CLEARED with a passing retest)"
        actor: system
        preconditions:
          - "claim_status == CLAIM_OPEN"
          - "Parent MitigationJob.status == CLEARED with retest_passed == true"
        side_effects:
          - "Set claim_status = CLAIM_RESOLVED; coverage_status is untouched"

  # ---------------------------------------------------------------------------
  # RetestSchedule — recurring scheduled action; ARMED ⇄ PAUSED, fires on tick.
  # ---------------------------------------------------------------------------
  - entity: RetestSchedule
    initial_state: ARMED
    terminal_states: [ENDED]
    transitions:
      - from: ARMED
        to: ARMED
        trigger: "POST /retest-schedules/{scheduleId}/fire-due (or system tick after clock advance past next_due_utc)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == ARMED"
          - "clock.current_utc >= next_due_utc (else ERR_RETEST_NOT_DUE)"
          - "Parent Warranty.coverage_status == ACTIVE (cross-entity, else ERR_WARRANTY_NOT_ACTIVE)"
        side_effects:
          - "Create a RECURRING RadonTest on the property (status PLACED)"
          - "Increment fired_count; set last_fired_utc = clock.current_utc"
          - "Advance next_due_utc = next_due_utc + interval_days (self-loop: schedule re-arms for the next cycle)"
        note: "Cycle edge: ARMED→ARMED recurring self-loop."
      - from: ARMED
        to: PAUSED
        trigger: "POST /retest-schedules/{scheduleId}/pause"
        actor: ClientContact | ComplianceOfficer
        preconditions:
          - "status == ARMED"
        side_effects: []
      - from: PAUSED
        to: ARMED
        trigger: "POST /retest-schedules/{scheduleId}/resume"
        actor: ClientContact | ComplianceOfficer
        preconditions:
          - "status == PAUSED"
        side_effects: []
      - from: ARMED
        to: ENDED
        trigger: "system (parent Warranty leaves ACTIVE)"
        actor: system
        preconditions:
          - "Parent Warranty.coverage_status IN {EXPIRED, CANCELLED}"
        side_effects: []

  # ---------------------------------------------------------------------------
  # Property posture — COMPOUND: derived from child RadonTest/MitigationJob.
  # ---------------------------------------------------------------------------
  - entity: Property
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: TESTING
        trigger: "system (first RadonTest placed; open_test_count goes 0→positive)"
        actor: system
        preconditions: ["open_test_count > 0"]
        side_effects: []
      - from: TESTING
        to: MITIGATION_REQUIRED
        trigger: "system (an INITIAL RadonTest reaches RESULT_READY with ACTION_RECOMMENDED)"
        actor: system
        preconditions: ["latest_result_pci_l >= 4.0", "no CLEARED-eligible job"]
        side_effects: []
      - from: MITIGATION_REQUIRED
        to: MITIGATING
        trigger: "system (a MitigationJob for this property reaches SCHEDULED)"
        actor: system
        preconditions: ["exists MitigationJob in {SCHEDULED, INSTALLED, RETEST_PENDING, REWORK}"]
        side_effects: []
      - from: MITIGATING
        to: CLEARED
        trigger: "system (a MitigationJob for this property reaches CLEARED)"
        actor: system
        preconditions: ["exists MitigationJob.status == CLEARED with retest_passed == true"]
        side_effects: []
      - from: TESTING
        to: CLEARED
        trigger: "system (an INITIAL RadonTest reaches RESULT_READY with NO_ACTION and no open jobs)"
        actor: system
        preconditions: ["latest_result_pci_l < 4.0", "no MitigationJob in a non-terminal state"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: schedule-job-stale-property
    parent_entity: Property
    write_endpoint: "POST /mitigation-jobs/{jobId}/schedule"
    occ_field: "expected_property_version"
    description: |
      Scheduling a MitigationJob requires the caller's last-observed Property
      version. If another writer has advanced the Property (e.g., a competing
      job for the same property reached SCHEDULED and flipped the property
      posture to MITIGATING, bumping Property.version), the current scheduler's
      view is stale and the schedule is rejected. The CREATE-with-supersede
      shape applies: a new SCHEDULED job legitimately changes the property's
      mitigation posture, so the second scheduler must re-read before scheduling.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

  - rule_id: cancel-warranty-stale-warranty
    parent_entity: Warranty
    write_endpoint: "POST /warranties/{warrantyId}/cancel"
    occ_field: "expected_warranty_version"
    description: |
      Cancelling a Warranty requires the caller's last-observed Warranty version.
      Opening a claim, refreshing to EXPIRED, or a parallel-dimension write all
      advance Warranty.version; a cancel still carrying the pre-mutation version
      is rejected as stale, because the prorated refund would be computed against
      a coverage/claim state the caller never saw.
    error_id: ERR_STALE_WARRANTY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: radon_result_average
    trigger: "RadonTest RETRIEVED→RESULT_READY (POST .../record-result)"
    algorithm: aggregation
    formula: |
      # Variant selected by RadonTest.test_kind.
      # CONTINUOUS_MONITOR (valid-hours mean):
      #   valid = hourly_readings[warmup_hours_dropped:]   # drop leading warm-up hours
      #   result_pci_l = round_half_up( sum(valid) / len(valid), 1 )
      # SHORT_TERM_48HR (lab integrated value):
      #   result_pci_l = round_half_up( lab_integrated_pci_l, 1 )
      # NOTE: the divergence target is the CONTINUOUS_MONITOR pair below — the
      # same hourly_readings averaged over ALL hours vs over valid hours can fall
      # on opposite sides of the 4.0 action level.
    input_set: "For CONTINUOUS_MONITOR: hourly_readings excluding the first warmup_hours_dropped entries. For SHORT_TERM_48HR: the single lab_integrated_pci_l."
    constants:
      ACTION_LEVEL_PCI_L: 4.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: valid_hours_mean
        when: "test_kind == CONTINUOUS_MONITOR (the pinned, correct variant)"
        difference: "Drops the first warmup_hours_dropped hourly readings before averaging."
      - name: all_hours_mean
        when: "INCORRECT alternative interpretation a naive implementation might choose"
        difference: "Averages every hourly reading including warm-up hours; the leading warm-up spikes can push the mean from below 4.0 (valid-hours) to >= 4.0 (all-hours), flipping action_outcome."

  - name: action_level_classification
    trigger: "RadonTest RETRIEVED→RESULT_READY, immediately after radon_result_average"
    algorithm: threshold
    formula: |
      if result_pci_l >= ACTION_LEVEL_PCI_L:   # 4.0, inclusive boundary
        action_outcome = ACTION_RECOMMENDED
      else:
        action_outcome = NO_ACTION
    input_set: "The single result_pci_l of this test."
    constants:
      ACTION_LEVEL_PCI_L: 4.0
    precision: "comparison on the 1-decimal result_pci_l"
    variants:
      - name: inclusive_boundary
        when: "always"
        difference: "Boundary is inclusive: result_pci_l == 4.0 => ACTION_RECOMMENDED (>= not >). 3.9 => NO_ACTION."

  - name: mitigation_quote
    trigger: "MitigationJob DESIGN→QUOTED (POST .../quote)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (combinatorial mode (c): rush_surcharge keys off
      # the subtotal tier, so subtotal MUST be fully resolved before the surcharge).
      base = BASE_BY_FOUNDATION[Property.foundation_type]
      extra_points = max(MitigationJob.num_suction_points - 1, 0) * PER_SUCTION_POINT_CENTS
      sump_fee = SUMP_SEAL_FEE_CENTS if MitigationJob.has_sump_pump else 0
      # Tiered area surcharge on Property.floor_area_sqft (>= boundaries inclusive):
      if floor_area_sqft <= AREA_TIER1_SQFT:        area = 0
      elif floor_area_sqft <= AREA_TIER2_SQFT:      area = AREA_TIER2_SURCHARGE_CENTS
      else:                                          area = AREA_TIER3_SURCHARGE_CENTS
      quote_subtotal_cents = base + extra_points + sump_fee + area
      rush_surcharge_cents = round_half_up(quote_subtotal_cents * RUSH_RATE) if is_rush else 0
      quote_total_cents = quote_subtotal_cents + rush_surcharge_cents
      deposit_required_cents = round_half_up(quote_total_cents * DEPOSIT_RATE)
    input_set: "Property.foundation_type, Property.floor_area_sqft, MitigationJob.num_suction_points, MitigationJob.has_sump_pump, MitigationJob.is_rush."
    constants:
      BASE_BY_FOUNDATION: { SLAB: 150000, BASEMENT: 185000, CRAWLSPACE: 240000 }
      PER_SUCTION_POINT_CENTS: 45000
      SUMP_SEAL_FEE_CENTS: 32000
      AREA_TIER1_SQFT: 1500
      AREA_TIER2_SQFT: 3000
      AREA_TIER2_SURCHARGE_CENTS: 50000
      AREA_TIER3_SURCHARGE_CENTS: 120000
      RUSH_RATE: 0.15
      DEPOSIT_RATE: 0.30
    precision: "integer cents, round_half_up on each percentage step"
    variants:
      - name: rush_applied
        when: "MitigationJob.is_rush == true"
        difference: "Adds 15% of the subtotal as rush_surcharge_cents; deposit is 30% of the rush-inclusive total."
      - name: standard
        when: "MitigationJob.is_rush == false"
        difference: "rush_surcharge_cents = 0; deposit is 30% of the subtotal."

  - name: warranty_refund
    trigger: "Warranty ACTIVE→CANCELLED (POST /warranties/{id}/cancel)"
    algorithm: decay_function
    formula: |
      elapsed_days = floor( (clock.current_utc - started_at_utc) / 1 day )
      remaining_days = max(term_days - elapsed_days, 0)
      # Variant selected by Warranty.refund_method:
      # STRAIGHT_LINE:
      #   refund_paid_cents = round_half_up( covered_system_price_cents * remaining_days / term_days )
      # STEP_TIER (frac = elapsed_days / term_days):
      #   frac < 0.25 -> 0.90 ; frac < 0.50 -> 0.60 ; frac < 0.75 -> 0.30 ; else 0.00
      #   refund_paid_cents = round_half_up( covered_system_price_cents * tier_pct )
    input_set: "covered_system_price_cents, term_days, started_at_utc, clock.current_utc, refund_method."
    constants:
      STEP_T1: 0.25
      STEP_T2: 0.50
      STEP_T3: 0.75
      STEP_PCT1: 0.90
      STEP_PCT2: 0.60
      STEP_PCT3: 0.30
    precision: "integer cents, round_half_up"
    variants:
      - name: straight_line
        when: "refund_method == STRAIGHT_LINE"
        difference: "Linear in remaining_days/term_days."
      - name: step_tier
        when: "refund_method == STEP_TIER"
        difference: "Flat percentage by elapsed-fraction band; for the same elapsed_days the two variants produce different cents."

  - name: payment_ledger_balance
    trigger: "Any PaymentRecord append (POST /payment-records); recompute on read of MitigationJob"
    algorithm: aggregation
    formula: |
      deposit_paid_cents = sum(PaymentRecord.amount_cents where kind == DEPOSIT)
      balance_paid_cents = sum(PaymentRecord.amount_cents where kind == BALANCE)
      net_recorded_cents = sum(PaymentRecord.amount_cents over ALL kinds incl. negative REFUND)
      # Conservation invariant: after a cancel-refund or warranty-refund, the
      # forward charge and its REFUND must net to a pinned value (see §1.9 / §1.8).
    input_set: "All PaymentRecord rows for the MitigationJob; DEPOSIT/BALANCE positive, REFUND negative; ordered by recorded_at_utc ASC, tie-break created_at ASC."
    constants: {}
    precision: "integer cents (exact)"
    variants:
      - name: gross_paid
        when: "computing deposit/balance gating thresholds"
        difference: "Counts only positive DEPOSIT and BALANCE rows (refunds excluded), so gating compares against money actually still held."
      - name: net_cash
        when: "computing the conservation invariant after a compensating refund"
        difference: "Sums ALL rows including negative REFUND; used to assert net cash returns to the pinned conserved value."

  - name: next_retest_due
    trigger: "Warranty issuance (RetestSchedule armed) and each RetestSchedule fire"
    algorithm: chronological
    formula: |
      on arm:   next_due_utc = warranty.started_at_utc + interval_days days
      on fire:  next_due_utc = next_due_utc + interval_days days   # NOT clock-based; fixed cadence
    input_set: "warranty.started_at_utc, interval_days, prior next_due_utc."
    constants: {}
    precision: "exact datetime arithmetic on whole days"
    variants:
      - name: fixed_cadence
        when: "always"
        difference: "Advances from the prior scheduled due date, not from the fire timestamp, so late fires do not drift the cadence."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (Property, then RadonTest/MitigationJob, then Permit/Warranty/RetestSchedule)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing resources (inspector_id, crew_id, triggering_test_id, mitigation_job_id)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /properties/{id}/radon-tests, POST /properties/{id}/mitigation-jobs, schedule"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the live parent version on schedule and warranty-cancel"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST .../mitigation-jobs/{id}/schedule"

  - priority: 7
    category: business_safety
    check: "A RadonTest cannot be retrieved before its placement_window_hours has elapsed against the logical clock"
    error_id: ERR_PLACEMENT_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST .../radon-tests/{id}/retrieve"

  - priority: 8
    category: business_safety
    check: "Assigned Inspector / MitigationCrew must be ACTIVE (not SUSPENDED) for placement and scheduling"
    error_id: ERR_INSPECTOR_SUSPENDED
    http_status: 409
    applies_to: "POST .../radon-tests (placement), POST .../radon-tests/{id}/retrieve"

  - priority: 9
    category: business_safety
    check: "complete-install requires an ISSUED Permit on the job (regulatory gate)"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/complete-install"

  - priority: 10
    category: business_referential
    check: "POST_MITIGATION RadonTest must carry a mitigation_job_id whose job is INSTALLED; INITIAL/RECURRING must omit it"
    error_id: ERR_RETEST_NOT_ALLOWED
    http_status: 409
    applies_to: "POST .../radon-tests"

  - priority: 11
    category: business_referential
    check: "Quoting requires Property.posture == MITIGATION_REQUIRED and a triggering_test with action_outcome == ACTION_RECOMMENDED"
    error_id: ERR_NO_ACTIONABLE_RESULT
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/quote"

  - priority: 12
    category: business_temporal
    check: "Install window must be well-formed (start < end) and, when is_rush, install_end_utc <= Property.closing_deadline_utc"
    error_id: ERR_RUSH_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/schedule"

  - priority: 13
    category: business_temporal
    check: "A crew's new install window must not overlap an existing SCHEDULED job's window for that crew (half-open [start,end) adjacency allowed), and must not exceed max_jobs_per_day for the calendar day"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/schedule"

  - priority: 14
    category: business_constraint
    check: "Inspector.nrpp_license_id unique among ACTIVE inspectors; Permit.permit_number unique among ISSUED permits in a jurisdiction"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /inspectors, POST .../permit"

  - priority: 15
    category: business_constraint
    check: "RetestSchedule.fire-due requires clock.current_utc >= next_due_utc"
    error_id: ERR_RETEST_NOT_DUE
    http_status: 409
    applies_to: "POST /retest-schedules/{id}/fire-due"

  - priority: 16
    category: business_fiscal
    check: "Scheduling requires deposit_paid_cents >= deposit_required_cents"
    error_id: ERR_DEPOSIT_NOT_SATISFIED
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/schedule"

  - priority: 17
    category: business_fiscal
    check: "Clearing requires balance_paid_cents >= (quote_total_cents - deposit_required_cents)"
    error_id: ERR_BALANCE_NOT_SATISFIED
    http_status: 409
    applies_to: "POST .../mitigation-jobs/{id}/complete-install retest cascade, record-result on POST_MITIGATION"

  - priority: 18
    category: business_constraint
    check: "Cannot cancel a Warranty whose claim_status == CLAIM_OPEN"
    error_id: ERR_CLAIM_IN_PROGRESS
    http_status: 409
    applies_to: "POST /warranties/{id}/cancel"

  - priority: 19
    category: business_referential
    check: "open-claim requires Property.latest_result_pci_l >= guarantee_ceiling_pci_l"
    error_id: ERR_NO_QUALIFYING_RETEST
    http_status: 409
    applies_to: "POST .../warranty/{id}/open-claim"

  - priority: 20
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numerics non-negative, CONTINUOUS_MONITOR readings vs SHORT_TERM_48HR lab value mutually exclusive and consistent with test_kind"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-04-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["current_utc = to_iso8601"]

  # ---------- Inspector ----------
  - method: POST
    path: "/inspectors"
    description: "Register an inspector"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, nrpp_license_id]
    output: Inspector
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/inspectors/{inspectorId}/suspend"
    description: "Suspend an inspector"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Inspector
    side_effects: ["status=SUSPENDED"]

  # ---------- MitigationCrew ----------
  - method: POST
    path: "/crews"
    description: "Register a mitigation crew"
    roles: [PlatformAdmin]
    code: 201
    input: [crew_name, 'max_jobs_per_day?']
    output: MitigationCrew
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/crews/{crewId}/suspend"
    description: "Suspend a crew"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MitigationCrew
    side_effects: ["status=SUSPENDED"]

  # ---------- Property (flat top-level collection) ----------
  - method: POST
    path: "/properties"
    description: "Create a property record"
    roles: [PlatformAdmin, ClientContact]
    code: 201
    input: [address_line, foundation_type, floor_area_sqft, 'is_real_estate_transaction?', 'closing_deadline_utc?']
    output: Property
    side_effects: ["posture=OPEN", "open_test_count=0", "latest_result_pci_l=null"]

  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a property with computed posture and latest result"
    roles: [PlatformAdmin, ClientContact, Inspector, MitigationDesigner, CrewLead, ComplianceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties (paginated)"
    roles: [PlatformAdmin, ClientContact]
    code: 200
    input: ['limit?', 'offset?']
    output: Property[]
    side_effects: []

  # ---------- RadonTest (flat; FK property_id, inspector_id, mitigation_job_id) ----------
  - method: POST
    path: "/radon-tests"
    description: "Place a radon test device (INITIAL, POST_MITIGATION, or RECURRING)"
    roles: [Inspector]
    code: 201
    input: [property_id, inspector_id, test_kind, 'purpose?', 'mitigation_job_id?', 'placement_window_hours?', 'warmup_hours_dropped?']
    output: RadonTest
    side_effects:
      - "status=PLACED; placement_start_utc=clock.current_utc"
      - "Increment Property.open_test_count; Property posture OPEN→TESTING on first placement"
      - "For purpose=POST_MITIGATION: drive linked MitigationJob INSTALLED→RETEST_PENDING"

  - method: GET
    path: "/radon-tests/{testId}"
    description: "Get a radon test"
    roles: [PlatformAdmin, Inspector, MitigationDesigner, ClientContact, ComplianceOfficer]
    code: 200
    input: []
    output: RadonTest
    side_effects: []

  - method: GET
    path: "/radon-tests"
    description: "List radon tests (filtered list; reverse-reachability for RadonTest.property_id, RadonTest.inspector_id, RadonTest.mitigation_job_id)"
    roles: [PlatformAdmin, Inspector, MitigationDesigner, ClientContact, ComplianceOfficer]
    code: 200
    input: ['property_id?', 'inspector_id?', 'mitigation_job_id?', 'purpose?', 'status?', 'limit?', 'offset?']
    output: RadonTest[]
    side_effects: []

  - method: POST
    path: "/radon-tests/{testId}/retrieve"
    description: "Retrieve the device and supply readings (continuous) or lab value (short-term)"
    roles: [Inspector]
    code: 200
    input: ['hourly_readings?', 'lab_integrated_pci_l?']
    output: RadonTest
    side_effects: ["status=RETRIEVED; store retrieval payload"]

  - method: POST
    path: "/radon-tests/{testId}/record-result"
    description: "Compute and record the averaged result and action outcome"
    roles: [Inspector]
    code: 200
    input: []
    output: RadonTest
    side_effects:
      - "Compute result_pci_l (radon_result_average) and action_outcome (action_level_classification)"
      - "Decrement Property.open_test_count; recompute Property.latest_result_pci_l and posture"
      - "If INITIAL & ACTION_RECOMMENDED: Property posture→MITIGATION_REQUIRED"
      - "If POST_MITIGATION & NO_ACTION: set MitigationJob.retest_passed=true, drive RETEST_PENDING→CLEARED (issues Warranty, arms RetestSchedule, posture→CLEARED)"
      - "If POST_MITIGATION & ACTION_RECOMMENDED: drive RETEST_PENDING→REWORK"

  - method: POST
    path: "/radon-tests/{testId}/void"
    description: "Void a placed test that will not be retrieved"
    roles: [Inspector, PlatformAdmin]
    code: 200
    input: []
    output: RadonTest
    side_effects: ["status=VOIDED; decrement Property.open_test_count; recompute posture"]

  # ---------- MitigationJob (flat; FK property_id, triggering_test_id, crew_id, permit_id) ----------
  - method: POST
    path: "/mitigation-jobs"
    description: "Open a mitigation job design tied to an ACTION_RECOMMENDED test"
    roles: [MitigationDesigner]
    code: 201
    input: [property_id, triggering_test_id, 'system_design?', 'num_suction_points?', 'has_sump_pump?', 'is_rush?', 'warranty_term_days?', 'warranty_guarantee_ceiling_pci_l?', 'warranty_refund_method?', 'retest_interval_days?']
    output: MitigationJob
    side_effects: ["status=DESIGN"]

  - method: GET
    path: "/mitigation-jobs/{jobId}"
    description: "Get a mitigation job with computed quote fields"
    roles: [PlatformAdmin, MitigationDesigner, CrewLead, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: MitigationJob
    side_effects: []

  - method: GET
    path: "/mitigation-jobs"
    description: "List mitigation jobs (filtered list; reverse-reachability for MitigationJob.property_id, MitigationJob.triggering_test_id, MitigationJob.crew_id)"
    roles: [PlatformAdmin, MitigationDesigner, CrewLead, ComplianceOfficer, ClientContact]
    code: 200
    input: ['property_id?', 'triggering_test_id?', 'crew_id?', 'status?', 'limit?', 'offset?']
    output: MitigationJob[]
    side_effects: []

  - method: POST
    path: "/mitigation-jobs/{jobId}/quote"
    description: "Compute and freeze the quote, deposit requirement"
    roles: [MitigationDesigner]
    code: 200
    input: []
    output: MitigationJob
    side_effects: ["status=QUOTED; compute quote_subtotal_cents, rush_surcharge_cents, quote_total_cents, deposit_required_cents"]

  - method: POST
    path: "/mitigation-jobs/{jobId}/schedule"
    description: "Assign a crew and install window; OCC-guarded on the parent Property"
    roles: [MitigationDesigner]
    code: 200
    input: [crew_id, install_start_utc, install_end_utc, expected_property_version]
    output: MitigationJob
    side_effects:
      - "status SCHEDULED; set crew_id, install_start_utc, install_end_utc"
      - "Property posture→MITIGATING; increments Property.version by 1"

  - method: POST
    path: "/mitigation-jobs/{jobId}/complete-install"
    description: "Mark the sub-slab depressurization install complete"
    roles: [CrewLead]
    code: 200
    input: []
    output: MitigationJob
    side_effects: ["status=INSTALLED (requires ISSUED permit and install window due)"]

  - method: POST
    path: "/mitigation-jobs/{jobId}/cancel"
    description: "Cancel a job still in DESIGN or QUOTED; refunds any deposit"
    roles: [MitigationDesigner, PlatformAdmin]
    code: 200
    input: []
    output: MitigationJob
    side_effects:
      - "status=CANCELLED; if deposit_paid_cents>0 append REFUND of -deposit_paid_cents and reset deposit_paid_cents=0"
      - "Recompute Property.posture"

  # ---------- PaymentRecord (flat; FK mitigation_job_id) ----------
  - method: POST
    path: "/payment-records"
    description: "Append a DEPOSIT, BALANCE, or REFUND ledger entry to a job"
    roles: [ClientContact, MitigationDesigner, PlatformAdmin]
    code: 201
    input: [mitigation_job_id, kind, amount_cents]
    output: PaymentRecord
    side_effects:
      - "Append PaymentRecord; recompute MitigationJob.deposit_paid_cents / balance_paid_cents (payment_ledger_balance)"

  - method: GET
    path: "/payment-records/{recordId}"
    description: "Get a single ledger entry"
    roles: [PlatformAdmin, MitigationDesigner, ClientContact, ComplianceOfficer]
    code: 200
    input: []
    output: PaymentRecord
    side_effects: []

  - method: GET
    path: "/payment-records"
    description: "List ledger entries (filtered list; reverse-reachability for PaymentRecord.mitigation_job_id)"
    roles: [PlatformAdmin, MitigationDesigner, ClientContact, ComplianceOfficer]
    code: 200
    input: ['mitigation_job_id?', 'kind?', 'limit?', 'offset?']
    output: PaymentRecord[]
    side_effects: []

  # ---------- Permit (flat; FK mitigation_job_id) ----------
  - method: POST
    path: "/permits"
    description: "Issue a sub-slab depressurization permit for a job"
    roles: [ComplianceOfficer]
    code: 201
    input: [mitigation_job_id, jurisdiction_code, permit_number]
    output: Permit
    side_effects: ["status=ISSUED; issued_at_utc=clock.current_utc; set MitigationJob.permit_id"]

  - method: GET
    path: "/permits/{permitId}"
    description: "Get a permit"
    roles: [PlatformAdmin, ComplianceOfficer, MitigationDesigner, CrewLead]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits (filtered list; reverse-reachability for Permit.mitigation_job_id)"
    roles: [PlatformAdmin, ComplianceOfficer, MitigationDesigner, CrewLead]
    code: 200
    input: ['mitigation_job_id?', 'status?', 'limit?', 'offset?']
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{permitId}/revoke"
    description: "Revoke an issued permit (only before install complete)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: ["status=REVOKED; clear MitigationJob.permit_id"]

  # ---------- Warranty (flat; FK mitigation_job_id, property_id) ----------
  - method: GET
    path: "/warranties/{warrantyId}"
    description: "Get a warranty (coverage_status × claim_status)"
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact, MitigationDesigner]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: GET
    path: "/warranties"
    description: "List warranties (filtered list; reverse-reachability for Warranty.mitigation_job_id, Warranty.property_id)"
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact, MitigationDesigner]
    code: 200
    input: ['mitigation_job_id?', 'property_id?', 'coverage_status?', 'limit?', 'offset?']
    output: Warranty[]
    side_effects: []

  - method: POST
    path: "/warranties/{warrantyId}/refresh"
    description: "Re-evaluate coverage_status against the clock (ACTIVE→EXPIRED when term elapsed)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Warranty
    side_effects: ["coverage_status=EXPIRED if past term; cascade RetestSchedule→ENDED"]

  - method: POST
    path: "/warranties/{warrantyId}/cancel"
    description: "Cancel coverage and pay a prorated refund; OCC-guarded on the warranty"
    roles: [ClientContact, PlatformAdmin]
    code: 200
    input: [expected_warranty_version]
    output: Warranty
    side_effects:
      - "coverage_status=CANCELLED; compute refund_paid_cents (warranty_refund); append REFUND PaymentRecord"
      - "cascade RetestSchedule→ENDED; increments Warranty.version by 1"

  - method: POST
    path: "/warranties/{warrantyId}/open-claim"
    description: "Open a guarantee claim (claim_status NONE→CLAIM_OPEN); drives a free rework"
    roles: [ClientContact]
    code: 200
    input: []
    output: Warranty
    side_effects: ["claim_status=CLAIM_OPEN; parent MitigationJob→REWORK; increments Warranty.version by 1"]

  # ---------- RetestSchedule (flat; FK warranty_id, property_id) ----------
  - method: GET
    path: "/retest-schedules/{scheduleId}"
    description: "Get a retest schedule"
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: RetestSchedule
    side_effects: []

  - method: GET
    path: "/retest-schedules"
    description: "List retest schedules (filtered list; reverse-reachability for RetestSchedule.warranty_id and RetestSchedule.property_id)"
    roles: [PlatformAdmin, ComplianceOfficer, ClientContact]
    code: 200
    input: ['warranty_id?', 'property_id?', 'status?', 'limit?', 'offset?']
    output: RetestSchedule[]
    side_effects: []

  - method: POST
    path: "/retest-schedules/{scheduleId}/fire-due"
    description: "Fire a due recurring retest (creates a RECURRING RadonTest; advances cadence)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RetestSchedule
    side_effects:
      - "Create RECURRING RadonTest (PLACED) on the property; increment fired_count; set last_fired_utc"
      - "next_due_utc += interval_days"

  - method: POST
    path: "/retest-schedules/{scheduleId}/pause"
    description: "Pause a recurring schedule"
    roles: [ClientContact, ComplianceOfficer]
    code: 200
    input: []
    output: RetestSchedule
    side_effects: ["status=PAUSED"]

  - method: POST
    path: "/retest-schedules/{scheduleId}/resume"
    description: "Resume a paused schedule"
    roles: [ClientContact, ComplianceOfficer]
    code: 200
    input: []
    output: RetestSchedule
    side_effects: ["status=ARMED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role valid but not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist"
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "A body FK (inspector_id, crew_id, triggering_test_id, mitigation_job_id) references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, negative numeric, or test_kind inconsistent with readings/lab value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is allowed"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not match the live Property.version on schedule"
  - id: ERR_STALE_WARRANTY_VERSION
    http: 412
    condition: "expected_warranty_version does not match the live Warranty.version on cancel"
  - id: ERR_PLACEMENT_WINDOW_NOT_ELAPSED
    http: 409
    condition: "retrieve called before placement_window_hours elapsed since placement_start_utc"
  - id: ERR_INSUFFICIENT_READINGS
    http: 409
    condition: "CONTINUOUS_MONITOR retrieve has hourly_readings length <= warmup_hours_dropped"
  - id: ERR_INSPECTOR_SUSPENDED
    http: 409
    condition: "Assigned inspector is SUSPENDED at placement or retrieval"
  - id: ERR_CREW_SUSPENDED
    http: 409
    condition: "Assigned crew is SUSPENDED at scheduling"
  - id: ERR_PERMIT_REQUIRED
    http: 409
    condition: "complete-install attempted without an ISSUED permit on the job"
  - id: ERR_PERMIT_LOCKED
    http: 409
    condition: "Permit revoke attempted after the job is INSTALLED or CLEARED"
  - id: ERR_RETEST_NOT_ALLOWED
    http: 409
    condition: "POST_MITIGATION test placed without an INSTALLED job, or mitigation_job_id supplied for a non-POST_MITIGATION purpose"
  - id: ERR_NO_ACTIONABLE_RESULT
    http: 409
    condition: "Quote attempted while Property.posture != MITIGATION_REQUIRED or triggering_test not ACTION_RECOMMENDED"
  - id: ERR_INVALID_WINDOW
    http: 409
    condition: "install_start_utc is not strictly before install_end_utc"
  - id: ERR_RUSH_DEADLINE_MISSED
    http: 409
    condition: "is_rush job scheduled with install_end_utc after Property.closing_deadline_utc"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "Crew install window overlaps an existing SCHEDULED job for that crew, or exceeds max_jobs_per_day"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "nrpp_license_id duplicate among ACTIVE inspectors, or permit_number duplicate among ISSUED permits in a jurisdiction"
  - id: ERR_RETEST_NOT_DUE
    http: 409
    condition: "fire-due called before clock.current_utc >= next_due_utc"
  - id: ERR_WARRANTY_NOT_ACTIVE
    http: 409
    condition: "fire-due on a schedule whose parent Warranty is not ACTIVE"
  - id: ERR_DEPOSIT_NOT_SATISFIED
    http: 409
    condition: "schedule attempted with deposit_paid_cents < deposit_required_cents"
  - id: ERR_BALANCE_NOT_SATISFIED
    http: 409
    condition: "clear attempted with balance_paid_cents < (quote_total_cents - deposit_required_cents)"
  - id: ERR_CLAIM_IN_PROGRESS
    http: 409
    condition: "warranty cancel attempted while claim_status == CLAIM_OPEN"
  - id: ERR_NO_QUALIFYING_RETEST
    http: 409
    condition: "open-claim attempted while Property.latest_result_pci_l < guarantee_ceiling_pci_l"
  - id: ERR_INSTALL_NOT_DUE
    http: 409
    condition: "complete-install attempted before clock.current_utc >= install_start_utc"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of range (limit 1..100, offset >= 0)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superuser: registers inspectors/crews, sets the clock, can override voids/cancels/revokes."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /inspectors — register inspector"
      - "POST /inspectors/{id}/suspend — suspend inspector"
      - "POST /crews — register crew"
      - "POST /crews/{id}/suspend — suspend crew"
    shared_operations:
      - "POST /properties — create property (with ClientContact)"
      - "POST .../radon-tests/{id}/void — void test (with Inspector)"
      - "POST .../mitigation-jobs/{id}/cancel — cancel job (with MitigationDesigner)"
      - "POST .../permit/{id}/revoke — revoke permit (with ComplianceOfficer)"
      - "POST /warranties/{id}/cancel — cancel warranty (with ClientContact)"
      - "POST .../warranty/{id}/refresh — refresh warranty (with ComplianceOfficer)"
      - "POST .../mitigation-jobs/{id}/payments — record payment (with ClientContact, MitigationDesigner)"
      - "POST /retest-schedules/{id}/fire-due — fire retest (with ComplianceOfficer)"

  - name: Inspector
    description: "Places, retrieves, and records results for radon test devices."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST .../radon-tests — place test"
      - "POST .../radon-tests/{id}/retrieve — retrieve device"
      - "POST .../radon-tests/{id}/record-result — record result"
    shared_operations:
      - "POST .../radon-tests/{id}/void — void test (with PlatformAdmin)"

  - name: MitigationDesigner
    description: "Designs systems, computes quotes, schedules installs."
    identity: "opaque"
    exclusive_operations:
      - "POST .../mitigation-jobs — open job design"
      - "POST .../mitigation-jobs/{id}/quote — quote job"
      - "POST .../mitigation-jobs/{id}/schedule — schedule install"
    shared_operations:
      - "POST .../mitigation-jobs/{id}/cancel — cancel job (with PlatformAdmin)"
      - "POST .../mitigation-jobs/{id}/payments — record payment (with ClientContact, PlatformAdmin)"

  - name: CrewLead
    description: "Performs the sub-slab depressurization install."
    identity: "entity_backed:MitigationCrew"
    exclusive_operations:
      - "POST .../mitigation-jobs/{id}/complete-install — complete install"
    shared_operations: []

  - name: ComplianceOfficer
    description: "Issues/revokes permits, manages warranty refresh, fires recurring retests."
    identity: "opaque"
    exclusive_operations:
      - "POST .../permit — issue permit"
    shared_operations:
      - "POST .../permit/{id}/revoke — revoke permit (with PlatformAdmin)"
      - "POST .../warranty/{id}/refresh — refresh warranty (with PlatformAdmin)"
      - "POST /retest-schedules/{id}/fire-due — fire retest (with PlatformAdmin)"
      - "POST /retest-schedules/{id}/pause — pause schedule (with ClientContact)"
      - "POST /retest-schedules/{id}/resume — resume schedule (with ClientContact)"

  - name: ClientContact
    description: "Homeowner or real-estate party: creates property, pays, opens/cancels warranty claims, manages retest cadence."
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST .../warranty/{id}/open-claim — open guarantee claim"
    shared_operations:
      - "POST /properties — create property (with PlatformAdmin)"
      - "POST .../mitigation-jobs/{id}/payments — record payment (with MitigationDesigner, PlatformAdmin)"
      - "POST /warranties/{id}/cancel — cancel warranty (with PlatformAdmin)"
      - "POST /retest-schedules/{id}/pause — pause schedule (with ComplianceOfficer)"
      - "POST /retest-schedules/{id}/resume — resume schedule (with ComplianceOfficer)"
