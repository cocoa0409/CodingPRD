        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-submit-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DistributionCase.version: election #1 with the observed version succeeds and bumps it; a second submission carrying the now-stale version is rejected 412; re-reading and resubmitting with the fresh version succeeds and supersedes election #1."
        test_recipe:
          setup: ["case ${c_a} NOTIFIED at version 2 (notice delivered)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${v1}" }, as: Participant, as_user_id: "${p_a}", captures: { el1: $.data.id } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${v1}" }, as: Participant, as_user_id: "${p_a}", captures: { err: $.data.error_id } }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { v2: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${v2}" }, as: Participant, as_user_id: "${p_a}", captures: { el2: $.data.id } }
          assert:
            - "Election #1 (${el1}) created; case version advanced past ${v1}"
            - "Stale retry: err == ERR_STALE_VERSION, http 412 — no second election written"
            - "Fresh retry with ${v2}: 201; Election.${el1}.election_status == SUPERSEDED, Election.${el2}.election_status == SUBMITTED"

      - name: occ_plan_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-config-stale-update]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Plan.version: first PATCH with the observed version applies and increments; a second PATCH replaying the same expected version is rejected 412 with no partial update."
        test_recipe:
          setup: ["plan ${pl} at version ${pv}"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk}" }, as: PlanSponsor, captures: { pl: $.data.id } }
            - { call: "GET /plans/${pl}", payload: {}, as: PlanSponsor, captures: { pv: $.data.version } }
          trigger:
            - { call: "PATCH /plans/${pl}", payload: { expected_plan_version: "${pv}", state_withholding_rate: 0.05 }, as: PlanSponsor }
            - { call: "PATCH /plans/${pl}", payload: { expected_plan_version: "${pv}", state_withholding_rate: 0.07 }, as: PlanSponsor, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH: 200, state_withholding_rate == 0.05, version == ${pv} + 1"
            - "Second PATCH (stale ${pv}): err == ERR_STALE_VERSION, http 412; state_withholding_rate stays 0.05"

      - name: network_reachable_reconciles_on_suspend_reinstate
        claim_type: derived_field_reconciliation
        grounds: ["entities.Plan.fields.network_reachable", "state_machines.Recordkeeper"]
        distinguishing_aspect: "Derived field reconciliation: plan.network_reachable tracks recordkeeper status — true while ACTIVE, false while SUSPENDED, true again after reinstatement (and accepts_incoming_transfers unchanged throughout)."
        test_recipe:
          setup: ["recordkeeper ${rk} ACTIVE with plan ${pl} (accepts_incoming_transfers default true)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk: $.data.id } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk}" }, as: PlanSponsor, captures: { pl: $.data.id } }
          trigger:
            - { call: "POST /recordkeepers/${rk}/suspend", payload: {}, as: ProviderOps, captures: { susp: "$.data.network_status" } }
            - { call: "POST /recordkeepers/${rk}/activate", payload: {}, as: ProviderOps }
          assert:
            - "After suspend: Plan.${pl}.network_reachable == false (recomputed by the recordkeeper transition, not by a plan write)"
            - "After reinstate: Plan.${pl}.network_reachable == true"
            - "Plan.${pl}.accepts_incoming_transfers == true throughout (source field untouched)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_computed_fields
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "calculations.vested_balance_determination"]
        distinguishing_aspect: "Immediate consistency: the POST /distribution-cases response itself carries the computed quoted_balance_cents (90000) — no re-read, lag, or async job is needed to observe the derivation."
        test_recipe:
          setup: ["plan, batch, participant exist"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
          trigger:
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 90000, processing_date_balance_cents: 120000 }, as: PlanSponsor, captures: { c_a: $.data.id, quoted: $.data.quoted_balance_cents } }
          assert:
            - "Create response data.quoted_balance_cents == 90000 in the same request"
            - "GET /distribution-cases/${c_a} returns the identical quoted_balance_cents == 90000 and case_status == IDENTIFIED"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: match_sibling_expiry_on_confirm
        claim_type: violation_to_error
        grounds: ["state_machines.MatchCandidate.CANDIDATE_to_EXPIRED"]
        excluded_because:
          difficulty_instance: match_score_weighted_gate_banding
          rationale: "Sibling CANDIDATE -> EXPIRED on auto-confirm is asserted directly in the §1.8 instance."

      - name: recordkeeper_exit_cascade_corner
        claim_type: cross_entity_cascade
        grounds: ["state_machines.Recordkeeper.ACTIVE_to_EXITED"]
        excluded_because:
          difficulty_instance: recordkeeper_exit_cascade_depth3
          rationale: "The exit cascade (plan reachability -> match expiry -> IRA reopen) is the §1.8 transitive-cascade instance."

      - name: net_check_at_zero_state_rate
        claim_type: correct_result
        grounds: ["calculations.net_check_withholding"]
        excluded_because:
          difficulty_instance: check_chain_obligation_conservation
          rationale: "Net 75000 from gross 100000 at 0% state rate is asserted in the §1.8 check-chain instance."
