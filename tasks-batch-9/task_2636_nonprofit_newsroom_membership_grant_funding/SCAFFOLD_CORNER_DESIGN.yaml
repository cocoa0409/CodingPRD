# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design - breadth walk of references/claim-extraction-guide.md
# against SCAFFOLD.yaml §1.1-§1.7 for task 2636 (Nonprofit Newsroom Membership &
# Grant Funding). Every instance is reproducible from an empty database using only
# §1.5 endpoints. Instances whose claim is already carried end-to-end by a §1.8
# difficulty instance carry excluded_because instead of a test_recipe.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: Entities
    instances:

      - name: en_fiscal_period_creation_persists_inputs_and_seeds_derived_sustainability_fields
        claim_type: Creation
        grounds:
          - entities.FiscalPeriod.fields.status
          - entities.FiscalPeriod.fields.board_override_active
          - calculations.reserve_policy_posture
        distinguishing_aspect: >-
          A period created with no revenue at all still carries a WATCH posture, because
          a 500000-cent reserve is 2.5 months against a 200000-cent expense base and the
          zero-revenue target is 3 months - an empty period is not HEALTHY by default.
        test_recipe:
          setup: "Empty database; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "GET /fiscal-periods/${fp_id}/sustainability"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
          assert:
            - "trigger[0] returns 201 and echoes label == FY2027, start_date == 2026-08-01, end_date == 2027-07-31, monthly_expense_base_cents == 200000, reserve_balance_cents == 500000"
            - "trigger[0]: status == OPEN, board_override_active == false, recognized_revenue_cents == 0, concentration_hhi == 0, top_source_share_bps == 0"
            - "trigger[1]: basis == RECOGNIZED, recognized_revenue_cents == 0, reserve_months_target == 3, operating_reserve_target_cents == 600000"
            - "trigger[1]: reserve_months_ratio_bps == 25000, sustainability_posture == WATCH, restricted_release_cap_pct_bps == 6000"

      - name: en_membership_tier_retrieval_returns_every_stored_and_computed_field
        claim_type: Retrieval
        grounds:
          - entities.MembershipTier.fields.quid_pro_quo_per_period_cents
          - endpoints[GET /membership-tiers/{id}]
        distinguishing_aspect: >-
          The read-back of a DRAFT tier returns insubstantial_threshold_cents == 50 and
          quid_pro_quo_per_period_cents == 0 for a benefit-free tier, proving the computed
          columns are persisted at creation rather than only on publication.
        test_recipe:
          setup: "One benefit-free MONTHLY tier at 2500 cents."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
          trigger:
            - call: "GET /membership-tiers/${tier_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "200 with tier_code == SUSTAINER, renewal_cadence == MONTHLY, contribution_amount_cents == 2500"
            - "status == DRAFT, published_at == null, grace_period_days == 30"
            - "benefit_count == 0, insubstantial_benefit_codes == [], quid_pro_quo_per_period_cents == 0, insubstantial_threshold_cents == 50"

      - name: en_membership_tier_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /membership-tiers]
          - response_envelope.pagination_fields
        distinguishing_aspect: >-
          total_count stays 3 across both pages while the returned row count drops to 1 on
          the second page, so total_count counts the filtered set and not the page.
        test_recipe:
          setup: "Three DRAFT tiers created in order BRONZE, SILVER, GOLD."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { tier_code: "BRONZE", name: "Bronze", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /membership-tiers"
              payload: { tier_code: "SILVER", name: "Silver", renewal_cadence: "MONTHLY", contribution_amount_cents: 5000, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /membership-tiers"
              payload: { tier_code: "GOLD", name: "Gold", renewal_cadence: "ANNUAL", contribution_amount_cents: 30000, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
            - call: "GET /membership-tiers?status=DRAFT&limit=2&offset=0"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
            - call: "GET /membership-tiers?status=DRAFT&limit=2&offset=2"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
            - call: "GET /membership-tiers?renewal_cadence=ANNUAL"
              payload: {}
              as: FinanceController
              as_user_id: user-fc-1
          assert:
            - "trigger[0]: response_type == array, 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger[1]: 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "trigger[2]: 1 row returned with tier_code == GOLD, total_count == 1, has_more == false"

      - name: en_member_get_with_unknown_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_MEMBER_NOT_FOUND]
          - endpoints[GET /members/{id}]
        distinguishing_aspect: >-
          A well-formed but unknown member id returns ERR_MEMBER_NOT_FOUND with HTTP 404
          rather than the generic ERR_INVALID_REQUEST used for malformed bodies.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /members/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "404 with data.error_id == ERR_MEMBER_NOT_FOUND"
            - "response_type == error and data carries only error_id and message"

      - name: en_funder_create_without_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Funder.fields.legal_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          legal_name and funder_type are the only mandatory funder inputs, so omitting
          legal_name is rejected while omitting the optional affiliated_coverage_area_id
          and self_attested_advocacy succeeds in the same shape of request.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /funders"
              payload: { funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /funders"
              payload: { legal_name: "Wexler Family Foundation", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: 400 with data.error_id == ERR_INVALID_REQUEST and no Funder row is created"
            - "trigger[1]: 201 with legal_name == Wexler Family Foundation, affiliated_coverage_area_id == null, self_attested_advocacy == false"
            - "trigger[1]: status == PROSPECT, risk_basis == SELF_ATTESTED, reporting_reliability_bps == 10000, independence_risk_score == 10"

      - name: en_membership_tier_omitted_grace_period_days_defaults_to_thirty
        claim_type: Defaults
        grounds:
          - entities.MembershipTier.fields.grace_period_days
          - entities.MembershipTier.fields.benefits
        distinguishing_aspect: >-
          Omitting grace_period_days yields exactly 30 while an explicit 7 is honoured, so
          the default is applied on absence only and never overwrites a supplied value.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership-tiers"
              payload: { tier_code: "DEFAULTGRACE", name: "Default Grace", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /membership-tiers"
              payload: { tier_code: "SHORTGRACE", name: "Short Grace", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [], grace_period_days: 7 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: grace_period_days == 30, benefits == [], benefit_count == 0"
            - "trigger[1]: grace_period_days == 7"

      - name: en_membership_tier_computed_benefit_columns_derive_from_the_benefits_array
        claim_type: Computed Fields
        grounds:
          - calculations.tier_quid_pro_quo_value
          - entities.MembershipTier.fields.insubstantial_benefit_codes
        distinguishing_aspect: >-
          On a MONTHLY tier of 30000 cents the threshold is 600, so a 6000-per-year tote
          bag (500 per period) is insubstantial and excluded while a 12000-per-year event
          pass (1000 per period) is counted: quid_pro_quo_per_period_cents == 1000, not 1500.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON"
                name: "Patron"
                renewal_cadence: "MONTHLY"
                contribution_amount_cents: 30000
                benefits:
                  - { benefit_code: "TOTE", fulfillment_type: "TOTE_BAG", annual_fair_market_value_cents: 6000 }
                  - { benefit_code: "EVENTS", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 12000 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "201 with benefit_count == 2 and insubstantial_threshold_cents == 600"
            - "insubstantial_benefit_codes == [TOTE] and quid_pro_quo_per_period_cents == 1000"

      - name: en_funder_status_and_score_input_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Funder.fields.status
          - entities.Funder.fields.cultivated_by_user_id
          - entities.Funder.fields.independence_risk_score
        distinguishing_aspect: >-
          A client that posts status == CLEARED and independence_risk_score == 0 still gets
          a PROSPECT funder scored 10, and cultivated_by_user_id is taken from the X-User-ID
          header rather than from the body.
        test_recipe:
          setup: "Empty database. The request body carries undeclared system columns which the server must ignore."
          setup_api_calls: []
          trigger:
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION", status: "CLEARED", independence_risk_score: 0, cultivated_by_user_id: "user-spoofed" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "201 with status == PROSPECT and independence_risk_score == 10 (the posted values are discarded)"
            - "cultivated_by_user_id == user-do-1, cleared_by_user_id == null, restricted_at == null, lifetime_committed_cents == 0"
            - "id, created_at, updated_at and version are server-minted and present"

      - name: en_grant_proposal_invalid_enum_restriction_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.GrantProposal.fields.restriction_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          restriction_type accepts only UNRESTRICTED, PROGRAM_RESTRICTED and
          PROJECT_RESTRICTED, so CAPITAL_CAMPAIGN is rejected at creation before any
          funder-institutionality or window checks are reached.
        test_recipe:
          setup: "One fiscal period and one FOUNDATION funder."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
          trigger:
            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "Housing beat capital", requested_amount_cents: 350000, restriction_type: "CAPITAL_CAMPAIGN" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /grant-proposals returns total_count == 0"

      - name: en_influence_contact_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InfluenceContact.common_fields
          - endpoints[GET /influence-contacts/{id}]
        distinguishing_aspect: >-
          InfluenceContact is the only entity declared with common_fields false: its read
          model carries no version column and §1.5 exposes no mutating endpoint for it, so
          the audit log of donor contacts can never be edited or superseded.
        test_recipe:
          setup: "One PROSPECT funder with one routine stewardship contact logged against it."
          setup_api_calls:
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
            - call: "POST /influence-contacts"
              payload: { funder_id: "${f_id}", contact_type: "ROUTINE_STEWARDSHIP", occurred_at: "2026-08-01T00:00:00Z", summary: "Annual stewardship lunch; no coverage discussed." }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { ic_id: "$.data.id" }
          trigger:
            - call: "GET /influence-contacts/${ic_id}"
              payload: {}
              as: EditorialDirector
              as_user_id: user-ed-1
          assert:
            - "200 with severity_weight == 0, triggered_restriction == false, logged_by_user_id == user-do-1"
            - "the response carries no version field and no updated_at-driven optimistic-concurrency token"
            - "§1.5 declares no PATCH, PUT or DELETE for /influence-contacts, so the row is append-only"
            - "GET /funders/${f_id} still reports status == PROSPECT and prior_editorial_requests_count == 0"

      - name: en_collaboration_partner_create_under_unknown_collaboration_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_COLLABORATION_NOT_FOUND]
          - endpoints[POST /collaborations/{id}/partners]
        distinguishing_aspect: >-
          The partner sub-resource resolves its {id} path segment before validating the
          body, so an unknown collaboration returns ERR_COLLABORATION_NOT_FOUND rather
          than ERR_PARTNER_NOT_FOUND or a share-sum error.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /collaborations/22222222-2222-4222-8222-222222222222/partners"
              payload: { partner_org_name: "Riverbend Public Media", credit_share_bps: 3300, cost_share_bps: 3300 }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "404 with data.error_id == ERR_COLLABORATION_NOT_FOUND"
            - "no CollaborationPartner row is created"

      - name: en_flat_topology_unknown_affiliated_coverage_area_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Funder.fields.affiliated_coverage_area_id
          - errors[ERR_COVERAGE_AREA_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: >-
          Topology is flat, so cross-references are validated by field rather than by URL
          nesting: an unknown affiliated_coverage_area_id on POST /funders is rejected with
          the coverage-area error even though the path contains no coverage-area segment.
        test_recipe:
          setup: "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION", affiliated_coverage_area_id: "33333333-3333-4333-8333-333333333333" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "404 with data.error_id == ERR_COVERAGE_AREA_NOT_FOUND"
            - "GET /funders returns total_count == 0"

  - section: State Machines
    instances:

      - name: sm_member_initial_state_is_pending_with_no_renewal_dates
        claim_type: Initial State
        grounds:
          - state_machines.Member.initial_state
          - entities.Member.fields.next_renewal_date
        distinguishing_aspect: >-
          A newly enrolled member is PENDING with cycle_start_date and next_renewal_date
          both null: the renewal schedule is seeded by the settling contribution, not by
          enrolment, so no dates exist before money arrives.
        test_recipe:
          setup: "One PUBLISHED benefit-free MONTHLY tier at 2500 cents."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "201 with status == PENDING, cycle_start_date == null, next_renewal_date == null, grace_expires_at == null"
            - "lifetime_giving_cents == 0, consecutive_renewals == 0, is_major_donor == false, cultivation_locked == false"

      - name: sm_gift_offer_submit_for_review_recomputes_netting_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.GiftOffer.PROPOSED_to_INDEPENDENCE_REVIEW
          - calculations.gift_stewardship_netting
        distinguishing_aspect: >-
          stewardship_fee_cents and net_acceptable_amount_cents stay 0 and equal to the
          gross at creation and are only written by the PROPOSED -> INDEPENDENCE_REVIEW
          transition, which on a 1000000-cent gross yields a 15000 fee and a 985000 net.
        test_recipe:
          setup: "One fiscal period and one PROSPECT FOUNDATION funder scored 10."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id" }
            - call: "POST /gift-offers"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", offered_amount_cents: 1000000, designation: "UNRESTRICTED" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { go_id: "$.data.id" }
          trigger:
            - call: "POST /gift-offers/${go_id}/submit-for-review"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "200 with status == INDEPENDENCE_REVIEW"
            - "stewardship_fee_cents == 15000, net_acceptable_amount_cents == 985000"
            - "board_ratification_required == false (1000000 < 2500000 and the funder scores 10 < 40)"
            - "solicited_by_user_id == user-do-1, cleared_by_user_id == null, conditions_round_count == 0"

      - name: sm_membership_tier_publish_precondition_blocks_benefit_heavy_tier
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MembershipTier.DRAFT_to_PUBLISHED
          - validations[priority=47]
          - errors[ERR_BENEFIT_VALUE_EXCEEDS_CONTRIBUTION]
        distinguishing_aspect: >-
          A 36000-per-year benefit on a MONTHLY 2500 tier is worth 3000 per period, above
          the 50-cent insubstantiality threshold and above the contribution itself, so the
          publish precondition fails and the tier is left in DRAFT.
        test_recipe:
          setup: "One DRAFT MONTHLY tier at 2500 cents carrying a single 36000-per-year event pass."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload:
                tier_code: "OVERGIVE"
                name: "Overgive"
                renewal_cadence: "MONTHLY"
                contribution_amount_cents: 2500
                benefits:
                  - { benefit_code: "GALA", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 36000 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
          trigger:
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
          assert:
            - "409 with data.error_id == ERR_BENEFIT_VALUE_EXCEEDS_CONTRIBUTION"
            - "GET /membership-tiers/${tier_id}: status == DRAFT, published_at == null, quid_pro_quo_per_period_cents == 3000, insubstantial_benefit_codes == []"

      - name: sm_member_cancel_from_pending_is_not_a_declared_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Member.ACTIVE_to_CANCELLED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >-
          CANCEL is declared only from ACTIVE, GRACE or LAPSED, so a PENDING member whose
          enrolment contribution never settled cannot be cancelled - the enrolment is
          abandoned rather than terminated.
        test_recipe:
          setup: "One PUBLISHED tier and one PENDING member with no contribution."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id" }
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_id}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "CANCEL" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "RENEW" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err2_id: "$.data.error_id" }
          assert:
            - "trigger[0]: 409 with data.error_id == ERR_INVALID_STATE and the member stays PENDING"
            - "trigger[1]: 409 with data.error_id == ERR_INVALID_STATE (RENEW is declared only from ACTIVE and GRACE)"

      - name: sm_gift_offer_declined_is_terminal_and_locks_further_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GiftOffer.terminal_states
          - validations[priority=12]
          - errors[ERR_TERMINAL_STATE]
        distinguishing_aspect: >-
          DECLINED is terminal, so resubmitting a declined offer reports ERR_TERMINAL_STATE
          at priority 12 rather than the source-state guard ERR_INVALID_STATE at priority 13.
        test_recipe:
          setup: "A gift offer taken to DECLINED by the editorial director."
          setup_api_calls:
            - call: "POST /fiscal-periods"
