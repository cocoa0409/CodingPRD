              as: TalentBuyer
              captures: { ci_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ci_ar_id}", venue_id: "${ci_vn_id}", event_at: "2026-11-20T02:00:00.000Z", load_in_at: "2026-11-19T14:00:00.000Z", load_out_at: "2026-11-20T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 200000, adjusted_gross_cents: 88888888, committed_guarantee_cents: 7777777, breakeven_cents: 6666666, gross_sold_cents: 5555555, paid_tickets_sold: 4444, budget_posture: "OVER_BUDGET", refund_liability_cents: 3333 }
              as: TalentBuyer
              captures: { ci_sh_id: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ci_sh_id}", tier_name: "GA", price_cents: 6000, allocation_qty: 500, sold_qty: 499, gross_sold_cents: 2994000, comp_qty: 1, held_qty: 0, available_qty: 0 }
              as: TalentBuyer
              captures: { ci_tt_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${ci_sh_id}", category: "MARKETING", description: "Radio buy", budgeted_cents: 300000, actual_cents: 299000, variance_cents: -1000, variance_pct: -0.33, settlement_expense_cents: 299000 }
              as: TourAccountant
              captures: { ci_bl_id: $.data.id }
          assert:
            - "MARKET — all six computed fields ignore the poisoned inputs: committed_guarantee_cents == 0, at_risk_guarantee_cents == 0, exposure_utilization_pct == 0.00, risk_posture == OPEN (not FROZEN), settled_show_count == 0, performance_index == 0"
            - "ARTIST — confirmed_show_count == 0 (not 42), while the genuinely-declared input withholding_pct == 10.00 is honoured"
            - "SHOW — adjusted_gross_cents == 0, committed_guarantee_cents == 0, breakeven_cents == 0, gross_sold_cents == 0, paid_tickets_sold == 0, refund_liability_cents == 0, budget_posture == ON_BUDGET (not OVER_BUDGET)"
            - "TICKET TIER — sold_qty == 0, gross_sold_cents == 0, comp_qty == 0, held_qty == 0, and available_qty == 500 (recomputed from allocation, NOT the supplied 0)"
            - "BUDGET LINE — actual_cents == 0, variance_cents == 0, variance_pct == 0, settlement_expense_cents == 0; variance_status is WITHIN_TOLERANCE because no invoice has been approved"
            - "Every one of the six creates still returns HTTP 201 — unknown/computed keys are dropped, not treated as ERR_INVALID_REQUEST"

      - name: client_supplied_identity_and_audit_fields_are_ignored_input
        claim_type: System Fields
        grounds:
          - "entities.Show.market_id"
          - "entities.Show.show_status"
          - "entities.Offer.status"
          - "entities.Settlement.calculated_by_user_id"
          - "response_envelope"
        distinguishing_aspect: |
          Distinct from the computed-field probe: these fields carry `source: system`, meaning the
          server MINTS them (id, created_at, updated_at, version) or DERIVES them from another row
          (Show.market_id from the venue) or writes them from the request identity
          (verified_by_user_id). A client-supplied market_id pointing at a DIFFERENT real market must
          be discarded in favour of the venue's market — the most falsifiable case, since the supplied
          id would otherwise resolve successfully.
        test_recipe:
          setup:
            - "TWO markets so a client-supplied market_id can name a real-but-wrong market; one venue in the FIRST market."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "True Market", region_code: "TRU", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { sf_mk_true: $.data.id }
            - call: "POST /markets"
              payload: { name: "Decoy Market", region_code: "DCY", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { sf_mk_decoy: $.data.id }
            - call: "POST /artists"
              payload: { name: "System Act", agency: "Sys Talent", tier: "THEATER", historical_sellthrough_pct: 65.00 }
              as: TalentBuyer
              captures: { sf_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${sf_mk_true}", name: "System Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 100, ticket_tax_pct: 3.00 }
              as: TalentBuyer
              captures: { sf_vn_id: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { artist_id: "${sf_ar_id}", venue_id: "${sf_vn_id}", event_at: "2026-11-26T02:00:00.000Z", load_in_at: "2026-11-25T14:00:00.000Z", load_out_at: "2026-11-26T08:00:00.000Z", announce_at: "2026-08-22T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 110000, id: "00000000-0000-4000-8000-0000000000ff", market_id: "${sf_mk_decoy}", show_status: "PERFORMED", sales_status: "CLOSED", version: 99, created_at: "2020-01-01T00:00:00.000Z", updated_at: "2020-01-01T00:00:00.000Z", exposure_override_limit_cents: 999999999, exposure_override_by_user_id: "u_forged" }
              as: TalentBuyer
              captures: { sf_sh_id: $.data.id, sf_sh_market: $.data.market_id, sf_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${sf_sh_id}", expected_show_version: "${sf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1200000, deposit_cents: 0, expense_cap_cents: 800000, status: "ACCEPTED", round_index: 3, submitted_at: "2026-08-01T00:00:00.000Z", expires_at: "2099-01-01T00:00:00.000Z", accepted_by_user_id: "u_forged" }
              as: TalentBuyer
              captures: { sf_of_id: $.data.id }
            - call: "GET /markets/${sf_mk_decoy}"
              payload: {}
              as: RiskOfficer
          assert:
            - "MINTED ID — ${sf_sh_id} != '00000000-0000-4000-8000-0000000000ff'; the server allocated its own UUID"
            - "DERIVED FK WINS OVER SUPPLIED FK — ${sf_sh_market} == ${sf_mk_true} (the venue's market), NOT ${sf_mk_decoy}, even though the decoy id names a real Market row"
            - "SYSTEM ENUMS — show_status == PLANNED and sales_status == PRE_SALE; the supplied PERFORMED/CLOSED are discarded"
            - "VERSION AND TIMESTAMPS — ${sf_sh_v} == 1 (not 99); created_at and updated_at are the current logical clock 2026-08-01T00:00:00.000Z, not the supplied 2020 values"
            - "OVERRIDE FIELDS UNFORGEABLE — exposure_override_limit_cents == null, exposure_override_justification == null, exposure_override_by_user_id == null"
            - "OFFER — status == DRAFT (not ACCEPTED), round_index == 1 (not 3), submitted_at == null, expires_at == null, accepted_by_user_id == null"
            - "NO SIDE EFFECT ON THE DECOY — GET /markets/${sf_mk_decoy} still reports committed_guarantee_cents == 0, proving the show never attached to it"

      - name: enum_and_numeric_range_constraints_are_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Offer.deal_structure"
          - "entities.Offer.deposit_cents"
          - "entities.Venue.ticket_tax_pct"
          - "entities.Artist.withholding_pct"
          - "entities.TicketTier.allocation_qty"
          - "validations[priority=3]"
        distinguishing_aspect: |
          Constraint strings in §1.1 are enforced, not decorative. Four different constraint SHAPES are
          probed: a closed enum set, a scalar floor (>= 1), a two-decimal percentage ceiling
          (0.00..25.00 and 0.00..40.00) and a RELATIONAL constraint between two fields of the same
          payload (deposit_cents <= guarantee_cents). All four surface as ERR_INVALID_REQUEST 400 —
          a relational field constraint must not be promoted to a business error like
          ERR_DEAL_TERMS_INCOHERENT.
        test_recipe:
          setup:
            - "One Market, one Artist, one Venue and one PLANNED show, so every probe fails only on the field under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
