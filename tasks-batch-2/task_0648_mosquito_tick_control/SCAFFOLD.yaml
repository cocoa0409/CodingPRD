scenario: "648. Mosquito & Tick Control Subscription (Mosquito Joe style): property profile & treatment zones, seasonal recurring schedule (every ~3 weeks) & weather reschedule, barrier-spray application log, special-event one-time treatment, automatic pre-renewal & off-season, satisfaction re-treat guarantee, route/crew dispatch, billing per-visit/seasonal"
domain_name: "mosquito-tick-control"
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_actions
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Property is the hierarchical root (Property -> TreatmentZone, Property -> Subscription).
  # Visits are flat children of a Subscription but carry cross-aggregate FKs to a
  # CrewRoute (dispatch) and to a WeatherEvent (reschedule cause). ApplicationLog rows
  # are append-only event children of a Visit.

  state_machine_shape: cyclic
  # Visit is cyclic: SCHEDULED -> WEATHER_HOLD -> SCHEDULED (reschedule loop), and
  # COMPLETED -> RETREAT_REQUESTED -> RETREAT_SCHEDULED -> COMPLETED (guarantee loop).
  # Subscription is compound (its season_status is derived from member visits + season window).

  relationship_patterns:
    - one_to_many        # Property -> TreatmentZone, Subscription -> Visit, Visit -> ApplicationLog
    - cross_aggregate    # Visit -> CrewRoute, Visit -> WeatherEvent, Invoice -> Visit
    - self_referential   # Visit.parent_visit_id links a re-treat / reschedule successor to its origin

  role_model: peer_roles
  # AccountHolder owns Property+Subscription resources; Dispatcher owns CrewRoute dispatch;
  # CrewTech logs applications on the route they are assigned; BillingAdmin owns invoices.
  # PlatformAdmin is an opaque operator superset for configuration + clock + weather feeds.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: ServicePlan
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: tier
        type: enum
        source: input
        description: "Plan tier."
        constraints: "one of {BASIC, PLUS, PREMIER}"
      - name: visit_interval_days
        type: integer
        source: input
        description: "Nominal days between recurring barrier-spray visits."
        constraints: "integer 14..28; the seasonal cadence (~21 = every 3 weeks)"
      - name: per_visit_price_cents
        type: integer
        source: input
        description: "List price charged per completed recurring visit when billing_mode=PER_VISIT."
        constraints: ">= 0"
      - name: seasonal_price_cents
        type: integer
        source: input
        description: "Flat season price when billing_mode=SEASONAL; covers all scheduled recurring visits in the season."
        constraints: ">= 0"
      - name: includes_tick_barrier
        type: boolean
        source: input
        description: "Whether the plan includes the tick perimeter barrier add-on (PLUS/PREMIER true, BASIC false)."
        default: false
      - name: retreat_guarantee_days
        type: integer
        source: input
        description: "Window after a COMPLETED recurring visit during which the AccountHolder may invoke the free satisfaction re-treat guarantee."
        constraints: "integer 1..14"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: account_holder_id
        type: string
        source: input
        description: "FK -> AccountHolder.id; the owning customer account."
      - name: street_address
        type: string
        source: input
        description: "Service address."
      - name: lot_size_sqft
        type: integer
        source: input
        description: "Total lot area; drives surface-area pricing surcharge."
        constraints: "> 0"
      - name: service_region_code
        type: string
        source: input
        description: "Operational region; weather events and crew routes are scoped to a region_code."
        constraints: "uppercase 2-6 chars, e.g. NE01, SE02"
      - name: zone_count
        type: integer
        source: computed
        description: "Count of TreatmentZone rows whose property_id == this Property.id (any status)."
      - name: total_treatable_sqft
        type: integer
        source: computed
        description: "Sum of TreatmentZone.area_sqft over zones with status == ACTIVE for this property."

  - name: TreatmentZone
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; owning property."
      - name: label
        type: string
        source: input
        description: "Human label e.g. 'Backyard', 'Front perimeter'."
      - name: zone_type
        type: enum
        source: input
        description: "Treatment surface class; sets the per-zone application multiplier."
        constraints: "one of {TURF, PERIMETER, WATER_FEATURE, WOODLINE}"
      - name: area_sqft
        type: integer
        source: input
        description: "Surface area of this zone."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Zone lifecycle."
        constraints: "one of {ACTIVE, EXCLUDED}; initial ACTIVE"

  - name: AccountHolder
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique."
        constraints: "unique across AccountHolder"
      - name: full_name
        type: string
        source: input
        description: "Customer name."
      - name: wallet_credit_cents
        type: integer
        source: system
        description: "Account credit balance in cents; goodwill credits from honored guarantees and overpayment refunds accrue here. Conserved: any credit issued debits exactly one named source."
        default: 0

  - name: Subscription
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this subscription services."
      - name: service_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan governing cadence and pricing."
      - name: billing_mode
        type: enum
        source: input
        description: "Whether the account is billed per completed visit or one flat seasonal charge."
        constraints: "one of {PER_VISIT, SEASONAL}"
      - name: season_start_date
        type: string
        source: input
        description: "Inclusive first calendar date (YYYY-MM-DD) of the active service season."
      - name: season_end_date
        type: string
        source: input
        description: "Inclusive last calendar date (YYYY-MM-DD) of the active service season; recurring visits are only scheduled on or before this date."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle."
        constraints: "one of {DRAFT, ACTIVE, OFF_SEASON, RENEWED, CANCELLED}; initial DRAFT"
      - name: auto_renew
        type: boolean
        source: input
        description: "If true, the off-season transition schedules a pre-renewal for the next season."
        default: true
      - name: renewed_into_subscription_id
        type: string
        source: system
        description: "FK -> Subscription.id; set on the prior subscription when a pre-renewal mints its successor. Null until renewed."
      - name: visits_completed_count
        type: integer
        source: computed
        description: "Count of Visit rows for this subscription with status == COMPLETED."
      - name: season_balance_cents
        type: integer
        source: computed
        description: "For PER_VISIT: sum of Invoice.amount_cents for invoices linked to this subscription's visits with invoice status == ISSUED or PAID. For SEASONAL: the single seasonal Invoice.amount_cents once issued, else 0."

  - name: Visit
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; owning subscription."
      - name: visit_kind
        type: enum
        source: system
        description: "Recurring barrier spray, a one-time special-event treatment, or a guarantee re-treat."
        constraints: "one of {RECURRING, SPECIAL_EVENT, RETREAT}"
      - name: scheduled_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the visit is scheduled for service."
      - name: sequence_index
        type: integer
        source: system
        description: "1-based ordinal of this RECURRING visit within the season; 0 for SPECIAL_EVENT and RETREAT visits."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle."
        constraints: "one of {SCHEDULED, WEATHER_HOLD, DISPATCHED, COMPLETED, RETREAT_REQUESTED, RETREAT_SCHEDULED, SKIPPED, CANCELLED}; initial SCHEDULED"
      - name: crew_route_id
        type: string
        source: system
        description: "FK -> CrewRoute.id; the route this visit is dispatched on. Null until DISPATCHED."
      - name: weather_event_id
        type: string
        source: system
        description: "FK -> WeatherEvent.id; the weather event that forced the most recent WEATHER_HOLD. Null if never held."
      - name: parent_visit_id
        type: string
        source: system
        description: "FK -> Visit.id; for a RETREAT visit, the COMPLETED RECURRING visit whose guarantee it fulfills; for a reschedule successor, null (the same row is reused on reschedule). Null for original visits."
      - name: reschedule_count
        type: integer
        source: system
        description: "Number of times this visit has been weather-held and re-scheduled. Caps re-scheduling."
        default: 0
      - name: completed_at_date
        type: string
        source: system
        description: "Calendar date the visit was marked COMPLETED; null until COMPLETED. Anchors the re-treat guarantee window."

  - name: ApplicationLog
    parent: Visit
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits; append-only log timestamp."
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the visit during which this barrier spray was applied."
      - name: treatment_zone_id
        type: string
        source: input
        description: "FK -> TreatmentZone.id; the zone sprayed."
      - name: product_code
        type: string
        source: input
        description: "Barrier-spray product applied."
        constraints: "one of {BIFEN_IT, TALSTAR, ESSENTRIA_IC3}"
      - name: gallons_applied
        type: number
        source: input
        description: "Mix gallons applied to this zone."
        constraints: "> 0"
      - name: logged_by_tech_id
        type: string
        source: input
        description: "FK -> Crew.id; the technician who recorded this application."

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: tech_name
        type: string
        source: input
        description: "Technician/crew name."
      - name: home_region_code
        type: string
        source: input
        description: "Region this crew serves; must match the route's region to be assigned."
        constraints: "uppercase 2-6 chars"
      - name: daily_capacity
        type: integer
        source: input
        description: "Maximum number of visits this crew can service on one route/day."
        constraints: "integer 1..40"

  - name: CrewRoute
    parent: null
    common_fields: true
    fields:
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the crew running this route."
      - name: region_code
        type: string
        source: input
        description: "Service region this route covers; must equal the crew's home_region_code."
        constraints: "uppercase 2-6 chars"
      - name: route_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the route runs."
      - name: status
        type: enum
        source: system
        description: "Route lifecycle."
        constraints: "one of {OPEN, LOCKED, CLOSED}; initial OPEN"
      - name: assigned_visit_count
        type: integer
        source: computed
        description: "Count of Visit rows with crew_route_id == this route and status IN {DISPATCHED, COMPLETED}."
      - name: remaining_capacity
        type: integer
        source: computed
        description: "Crew.daily_capacity minus assigned_visit_count for this route."

  - name: WeatherEvent
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Region the advisory applies to; scopes which visits may be held."
        constraints: "uppercase 2-6 chars"
      - name: event_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the adverse-weather advisory covers."
      - name: severity
        type: enum
        source: input
        description: "Advisory severity; only RAIN_HEAVY and WIND_HIGH force holds, RAIN_LIGHT does not."
        constraints: "one of {RAIN_LIGHT, RAIN_HEAVY, WIND_HIGH}"

  - name: Invoice
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription being billed."
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the completed visit being billed, for PER_VISIT invoices. Null for SEASONAL invoices."
      - name: invoice_type
        type: enum
        source: system
        description: "Per-visit charge vs one flat seasonal charge."
        constraints: "one of {PER_VISIT, SEASONAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Billed amount; computed by the visit_charge (PER_VISIT) or seasonal_charge (SEASONAL) calculation."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        constraints: "one of {ISSUED, PAID, VOID}; initial ISSUED"
      - name: paid_amount_cents
        type: integer
        source: input
        description: "Amount tendered on payment; recorded on the pay transition."
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: AccountHolder
        preconditions:
          - "subscription.status == DRAFT"
          - "the Property has >= 1 TreatmentZone with status == ACTIVE"
          - "season_start_date <= season_end_date"
        side_effects:
          - "Generate the full recurring Visit schedule: starting at season_start_date, create one RECURRING Visit every ServicePlan.visit_interval_days, with sequence_index 1..N, for each scheduled_date <= season_end_date (the seasonal recurring schedule)."
          - "Each generated Visit starts status == SCHEDULED."
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: OFF_SEASON
        trigger: "POST /_clock/set_current_utc advancing logical date past season_end_date (system auto-transition evaluated on clock set), or POST /subscriptions/{id}/close-season"
        actor: system
        preconditions:
          - "subscription.status == ACTIVE"
          - "logical current date > season_end_date"
          - "no Visit for this subscription is in status DISPATCHED"
        side_effects:
          - "Every Visit still in {SCHEDULED, WEATHER_HOLD} is transitioned to SKIPPED (off-season cascade)."
          - "If auto_renew == true: mint a successor Subscription (status DRAFT) for the next season (season_start_date and season_end_date each shifted forward by 365 days, same plan and billing_mode), and set this subscription.renewed_into_subscription_id to the successor id (automatic pre-renewal)."
          - "increments Subscription.version by 1"
      - from: OFF_SEASON
        to: RENEWED
        trigger: "POST /subscriptions/{id}/confirm-renewal"
        actor: AccountHolder
        preconditions:
          - "subscription.status == OFF_SEASON"
          - "subscription.renewed_into_subscription_id is not null"
          - "the successor Subscription referenced by renewed_into_subscription_id is in status DRAFT"
        side_effects:
          - "Activate the successor Subscription (it transitions DRAFT -> ACTIVE with its own recurring schedule generated)."
          - "increments Subscription.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: AccountHolder
        preconditions:
          - "subscription.status == DRAFT"
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: AccountHolder
        preconditions:
          - "subscription.status == ACTIVE"
          - "no Visit for this subscription is in status DISPATCHED"
        side_effects:
          - "Every Visit in {SCHEDULED, WEATHER_HOLD, RETREAT_REQUESTED, RETREAT_SCHEDULED} is transitioned to CANCELLED (cancel cascade)."
          - "For SEASONAL billing_mode: if a SEASONAL Invoice exists in status ISSUED, it is VOIDed and the AccountHolder.wallet_credit_cents is credited a prorated refund = seasonal_charge.amount_cents * (remaining_unserved_recurring_visits / total_recurring_visits), floor to cents (compensation)."
          - "increments Subscription.version by 1"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /visits/{id}/weather-hold"
        actor: Dispatcher
        preconditions:
          - "visit.status == SCHEDULED"
          - "a WeatherEvent exists with region_code == visit's Property.service_region_code, event_date == visit.scheduled_date, and severity IN {RAIN_HEAVY, WIND_HIGH}"
          - "visit.reschedule_count < 3"
        side_effects:
          - "Set visit.weather_event_id to the matching WeatherEvent.id."
          - "If the visit was DISPATCHED to a route the hold first releases it: not applicable from SCHEDULED."
          - "increments Visit.version by 1"
      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /visits/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "visit.status == WEATHER_HOLD"
          - "new_scheduled_date > the held scheduled_date"
          - "new_scheduled_date <= owning Subscription.season_end_date"
          - "no WeatherEvent with severity IN {RAIN_HEAVY, WIND_HIGH} exists for the property's region on new_scheduled_date"
        side_effects:
          - "Set visit.scheduled_date = new_scheduled_date."
          - "Increment visit.reschedule_count by 1 (the weather-reschedule loop)."
          - "increments Visit.version by 1"
        note: "Cyclic: SCHEDULED -> WEATHER_HOLD -> SCHEDULED."
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /crew-routes/{routeId}/dispatch-visit"
        actor: Dispatcher
        preconditions:
          - "visit.status == SCHEDULED"
          - "CrewRoute.status == OPEN"
          - "CrewRoute.region_code == visit's Property.service_region_code (cross-entity: route region must match property region)"
          - "CrewRoute.route_date == visit.scheduled_date"
          - "CrewRoute.remaining_capacity >= 1 (route not at crew daily_capacity)"
        side_effects:
          - "Set visit.crew_route_id = routeId."
          - "Recompute CrewRoute.assigned_visit_count and CrewRoute.remaining_capacity (derived-field reconciliation)."
          - "increments Visit.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: CrewTech
        preconditions:
          - "visit.status == DISPATCHED"
          - "at least one ApplicationLog row exists for this visit"
          - "the acting CrewTech (X-User-ID) equals the Crew.id assigned to visit.crew_route_id's route"
        side_effects:
          - "Set visit.completed_at_date = logical current date."
          - "Recompute owning Subscription.visits_completed_count."
          - "For billing_mode == PER_VISIT: issue a PER_VISIT Invoice for this visit (status ISSUED, amount via visit_charge calculation); recompute Subscription.season_balance_cents (ledger sync)."
          - "increments Visit.version by 1"
      - from: COMPLETED
        to: RETREAT_REQUESTED
        trigger: "POST /visits/{id}/request-retreat"
        actor: AccountHolder
        preconditions:
          - "visit.status == COMPLETED"
          - "visit.visit_kind == RECURRING"
          - "logical current date <= visit.completed_at_date + ServicePlan.retreat_guarantee_days (within guarantee window)"
          - "no existing RETREAT Visit whose parent_visit_id == this visit.id"
        side_effects:
          - "increments Visit.version by 1"
        note: "Cyclic guarantee loop entry: COMPLETED -> RETREAT_REQUESTED."
      - from: RETREAT_REQUESTED
        to: RETREAT_SCHEDULED
        trigger: "POST /visits/{id}/schedule-retreat"
        actor: Dispatcher
        preconditions:
          - "visit.status == RETREAT_REQUESTED"
          - "retreat_date > logical current date"
          - "retreat_date <= owning Subscription.season_end_date"
        side_effects:
          - "Create a new RETREAT Visit (status SCHEDULED, visit_kind RETREAT, scheduled_date = retreat_date, parent_visit_id = this visit.id, sequence_index 0) under the same subscription (re-treat guarantee fulfillment)."
          - "increments Visit.version by 1"
      - from: RETREAT_SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/close-retreat"
        actor: Dispatcher
        preconditions:
          - "visit.status == RETREAT_SCHEDULED"
          - "the child RETREAT Visit (parent_visit_id == this visit.id) is in status COMPLETED"
        side_effects:
          - "increments Visit.version by 1"
        note: "Closes the guarantee loop back to COMPLETED once the free re-treat is done."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: AccountHolder
        preconditions:
          - "visit.status == SCHEDULED"
          - "visit.visit_kind == SPECIAL_EVENT (only one-time special-event visits may be individually cancelled; recurring visits are cancelled via subscription cancel/off-season)"
        side_effects:
          - "increments Visit.version by 1"

  - entity: CrewRoute
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /crew-routes/{id}/lock"
        actor: Dispatcher
        preconditions:
          - "route.status == OPEN"
        side_effects:
          - "No further visits may be dispatched onto this route."
          - "increments CrewRoute.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /crew-routes/{id}/close"
        actor: Dispatcher
        preconditions:
          - "route.status == LOCKED"
          - "every Visit with crew_route_id == this route is in status {COMPLETED, SKIPPED} (no DISPATCHED visit still open)"
        side_effects:
          - "increments CrewRoute.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED"
          - "paid_amount_cents >= invoice.amount_cents"
        side_effects:
          - "Set invoice.paid_amount_cents = paid_amount_cents."
          - "If paid_amount_cents > invoice.amount_cents: credit the overpayment (paid_amount_cents - amount_cents) to the AccountHolder.wallet_credit_cents (conserved overpayment compensation)."
          - "Recompute owning Subscription.season_balance_cents."
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Recompute owning Subscription.season_balance_cents (the voided invoice no longer counts)."
          - "increments Invoice.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: dispatch-visit-stale-route
    parent_entity: CrewRoute
    write_endpoint: "POST /crew-routes/{routeId}/dispatch-visit"
    occ_field: "expected_crewroute_version"
    description: |
      Dispatching a Visit onto a CrewRoute whose version has advanced since the
      client last observed it is rejected with a stale-version error. A prior
      dispatch onto the same route legitimately consumed capacity and advanced
      the route's version; a client still holding the pre-dispatch version has a
      stale view of remaining_capacity and must re-read before dispatching.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: visit_charge
    trigger: "Visit DISPATCHED -> COMPLETED transition, when owning Subscription.billing_mode == PER_VISIT; produces the PER_VISIT Invoice.amount_cents."
    algorithm: tiered_pricing
    formula: |
      # Per-completed-visit charge. Surface-area surcharge is tiered on the
      # property's total_treatable_sqft, then a per-zone-type application
      # multiplier is summed, then rounded ONCE at the end.
      base = ServicePlan.per_visit_price_cents
      sqft = Property.total_treatable_sqft
      # Tiered area surcharge (marginal NOT applied; flat surcharge by tier):
      if sqft <= 5000:        area_surcharge = 0
      elif sqft <= 10000:     area_surcharge = 1500
      elif sqft <= 20000:     area_surcharge = 3500
      else:                   area_surcharge = 6000
      # Per-zone application weighting: sum over ACTIVE zones of
      #   area_sqft * ZONE_MULTIPLIER_BPS[zone_type] / 10000, in cents-rate.
      # ZONE_RATE_CENTS_PER_1000_SQFT is applied per zone.
      zone_component = 0.0
      for z in ACTIVE TreatmentZones of property:
          zone_component += (z.area_sqft / 1000.0) * ZONE_RATE_CENTS_PER_1000_SQFT[z.zone_type]
      raw = base + area_surcharge + zone_component
      amount_cents = round_half_up(raw)   # round ONCE at the end (sum-then-round)
    input_set: "ACTIVE TreatmentZones of the owning Property; the owning Subscription's ServicePlan."
    constants:
      ZONE_RATE_CENTS_PER_1000_SQFT: { TURF: 120, PERIMETER: 200, WATER_FEATURE: 350, WOODLINE: 280 }
      AREA_TIER_BREAKS_SQFT: [5000, 10000, 20000]
      AREA_TIER_SURCHARGE_CENTS: [0, 1500, 3500, 6000]
    precision: "integer cents, round_half_up; sum-then-round (round ONCE at the end, NOT per-zone)."
    variants:
      - name: special_event_charge
        when: "Visit.visit_kind == SPECIAL_EVENT (one-time treatment), billed PER_VISIT on completion."
        difference: "A SPECIAL_EVENT_SURCHARGE_CENTS=4000 flat fee is added to raw before rounding, and the area_surcharge tier is doubled (premium one-off rate). RETREAT visits never bill (free guarantee)."

  - name: seasonal_charge
    trigger: "Subscription DRAFT -> ACTIVE transition, when billing_mode == SEASONAL; issues a single SEASONAL Invoice.amount_cents covering the whole season."
    algorithm: forward_looking
    formula: |
      # Forward-looking: price the WHOLE season up front from the planned
      # recurring schedule (the projected count of RECURRING visits), NOT from
      # visits actually completed.
      base = ServicePlan.seasonal_price_cents
      planned_recurring_visits = count of RECURRING Visits generated at activation
      # Volume discount on planned visit count:
      if planned_recurring_visits >= 10:   discount_bps = 1200   # 12%
      elif planned_recurring_visits >= 6:  discount_bps = 700    # 7%
      else:                                discount_bps = 0
      tick_addon = TICK_BARRIER_SEASON_CENTS if ServicePlan.includes_tick_barrier else 0
      raw = base + tick_addon
      amount_cents = round_half_up(raw * (10000 - discount_bps) / 10000)  # discount then round
    input_set: "The set of RECURRING Visits created by the activation side-effect (planned, not completed); the ServicePlan."
    constants:
      TICK_BARRIER_SEASON_CENTS: 8000
      VOLUME_DISCOUNT_TIER_COUNTS: [6, 10]
      VOLUME_DISCOUNT_BPS: [0, 700, 1200]
    precision: "integer cents, round_half_up; discount-then-round."

  - name: retreat_guarantee_window_open
    trigger: "Evaluated on Visit COMPLETED -> RETREAT_REQUESTED to decide whether the free re-treat guarantee is still claimable."
    algorithm: threshold
    formula: |
      # Boundary precision: guarantee is OPEN iff the logical current date is
      # within retreat_guarantee_days INCLUSIVE of the completion date.
      deadline = date(visit.completed_at_date) + ServicePlan.retreat_guarantee_days  # in days
      window_open = (logical_current_date <= deadline)   # <= INCLUSIVE; equal date still open, deadline+1 closed
    input_set: "The single COMPLETED RECURRING Visit and its ServicePlan."
    constants: {}
    precision: "whole calendar days; boundary is inclusive (<=)."

  - name: route_load_factor
    trigger: "Computed on every dispatch attempt and on GET /crew-routes/{id}/summary to expose route fill."
    algorithm: aggregation
    formula: |
      assigned = count of Visits with crew_route_id == route.id AND status IN {DISPATCHED, COMPLETED}
      remaining_capacity = Crew.daily_capacity - assigned
      load_factor = assigned / Crew.daily_capacity   # 0.0 .. 1.0
    input_set: "Visits with status IN {DISPATCHED, COMPLETED} on this route; the route's Crew.daily_capacity."
    constants: {}
    precision: "load_factor to 4 decimal places, round_half_up; assigned/remaining_capacity are integers."

  - name: cancellation_proration_refund
    trigger: "Subscription ACTIVE -> CANCELLED transition when billing_mode == SEASONAL and a SEASONAL Invoice in status ISSUED exists; produces the wallet credit."
    algorithm: aggregation
    formula: |
      # Conserved-quantity compensation: refund the unserved fraction of the
      # season to wallet credit, so (invoice paid value retained + wallet credit
      # issued) == original seasonal Invoice.amount_cents.
      total_recurring = count of RECURRING Visits ever created for this subscription
      served = count of RECURRING Visits with status == COMPLETED
      unserved = total_recurring - served
      refund_cents = floor( seasonal_invoice.amount_cents * unserved / total_recurring )
      # The SEASONAL Invoice is VOIDed; refund_cents credited to wallet.
    input_set: "All RECURRING Visits of the subscription (any status), partitioned by COMPLETED vs not; the SEASONAL Invoice."
    constants: {}
    precision: "integer cents, floor (round toward zero); unserved/total is an exact integer ratio scaled by amount_cents before floor."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /account-holders and POST /service-plans bootstrap reads"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in path order."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the targeted resource (AccountHolder owns the Property/Subscription/Visit chain; CrewTech equals the Crew assigned to the visit's route)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "AccountHolder and CrewTech ownership-scoped writes"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints except POST /subscriptions/{id}/special-event (priority 18) and POST /crew-routes/{id}/close (priority 19), which raise specialized state errors"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /crew-routes/{routeId}/dispatch-visit"
  - priority: 7
    category: business_constraint
    check: "Required input fields present and typed; enum values within declared sets; numeric ranges honored (e.g., area_sqft > 0, season_start_date <= season_end_date)."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"
  - priority: 8
    category: business_safety
    check: "A Visit may only be placed in WEATHER_HOLD when a qualifying WeatherEvent (severity IN {RAIN_HEAVY, WIND_HIGH}) exists for the property's region on the visit's scheduled_date; RAIN_LIGHT does not qualify."
    error_id: ERR_NO_QUALIFYING_WEATHER
    http_status: 409
    applies_to: "POST /visits/{id}/weather-hold"
  - priority: 9
    category: business_constraint
    check: "A Visit may be rescheduled at most 3 times (reschedule_count < 3 before the reschedule)."
    error_id: ERR_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /visits/{id}/reschedule"
  - priority: 10
    category: business_temporal
    check: "Reschedule/retreat target dates must be strictly after the current scheduled/logical date and on or before season_end_date."
    error_id: ERR_DATE_OUT_OF_SEASON
    http_status: 409
    applies_to: "POST /visits/{id}/reschedule, POST /visits/{id}/schedule-retreat, POST /subscriptions/{id}/special-event"
  - priority: 11
    category: business_temporal
    check: "Re-treat guarantee may only be requested while the guarantee window is open (retreat_guarantee_window_open == true)."
    error_id: ERR_GUARANTEE_EXPIRED
    http_status: 409
    applies_to: "POST /visits/{id}/request-retreat"
  - priority: 12
    category: business_referential
    check: "An ApplicationLog's treatment_zone_id must reference a TreatmentZone of the same Property as the visit's subscription, and that zone must be status ACTIVE (cannot spray an EXCLUDED zone)."
    error_id: ERR_ZONE_NOT_TREATABLE
    http_status: 409
    applies_to: "POST /visits/{id}/application-logs"
  - priority: 13
    category: business_referential
    check: "A CrewRoute's region_code must equal its Crew.home_region_code; a Visit dispatched to a route requires route.region_code == the visit's Property.service_region_code and route.route_date == visit.scheduled_date."
    error_id: ERR_REGION_MISMATCH
    http_status: 409
    applies_to: "POST /crew-routes, POST /crew-routes/{routeId}/dispatch-visit"
  - priority: 14
    category: business_constraint
    check: "A route at remaining_capacity == 0 (assigned_visit_count == Crew.daily_capacity) cannot accept another dispatch."
    error_id: ERR_ROUTE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /crew-routes/{routeId}/dispatch-visit"
  - priority: 15
    category: business_constraint
    check: "Only one RETREAT Visit may exist per parent RECURRING Visit; a duplicate retreat request/schedule is rejected."
    error_id: ERR_RETREAT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /visits/{id}/request-retreat, POST /visits/{id}/schedule-retreat"
  - priority: 16
    category: business_fiscal
    check: "Payment tendered (paid_amount_cents) must be >= invoice.amount_cents; underpayment rejected."
    error_id: ERR_UNDERPAYMENT
    http_status: 402
    applies_to: "POST /invoices/{id}/pay"
  - priority: 17
    category: business_constraint
    check: "A Visit cannot be completed without at least one ApplicationLog row recorded (barrier-spray application log required)."
    error_id: ERR_NO_APPLICATION_LOGGED
    http_status: 409
    applies_to: "POST /visits/{id}/complete"
  - priority: 18
    category: state
    check: "A SPECIAL_EVENT visit may only be scheduled against a Subscription whose status == ACTIVE (specialized state-tier check, evaluated in the same tier as priority 5)."
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/special-event"
  - priority: 19
    category: state
    check: "A CrewRoute may only be CLOSED when every Visit assigned to it is in status {COMPLETED, SKIPPED}; a still-DISPATCHED visit blocks close (specialized state-tier check, evaluated in the same tier as priority 5)."
    error_id: ERR_ROUTE_NOT_EMPTY
    http_status: 409
    applies_to: "POST /crew-routes/{id}/close"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Bootstrap / config ----
  - method: POST
    path: "/service-plans"
    description: "Create a ServicePlan (cadence + pricing config)."
    roles: [PlatformAdmin]
    code: 201
    input: ["tier", "visit_interval_days", "per_visit_price_cents", "seasonal_price_cents", "includes_tick_barrier?", "retreat_guarantee_days"]
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/service-plans/{id}"
    description: "Fetch a ServicePlan."
    roles: [PlatformAdmin, AccountHolder, BillingAdmin, Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []
  - method: POST
    path: "/account-holders"
    description: "Register an AccountHolder."
    roles: [PlatformAdmin, AccountHolder]
    code: 201
    input: [email, full_name]
    output: AccountHolder
    side_effects: []
  - method: GET
    path: "/account-holders/{id}"
    description: "Fetch an AccountHolder (including wallet_credit_cents)."
    roles: [PlatformAdmin, AccountHolder, BillingAdmin]
    code: 200
    input: []
    output: AccountHolder
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Create a Crew (technician)."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [tech_name, home_region_code, daily_capacity]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a Crew."
    roles: [PlatformAdmin, Dispatcher, CrewTech]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- Property + zones ----
  - method: POST
    path: "/properties"
    description: "Create a Property under an AccountHolder."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [account_holder_id, street_address, lot_size_sqft, service_region_code]
    output: Property
    side_effects: ["zone_count and total_treatable_sqft initialize to 0"]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a Property with computed zone_count and total_treatable_sqft."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/account-holders/{id}/properties"
    description: "List Properties for an AccountHolder (FK reverse-reachability for Property.account_holder_id)."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/properties/{id}/zones"
    description: "Add a TreatmentZone to a Property."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [label, zone_type, area_sqft]
    output: TreatmentZone
    side_effects: ["Recompute Property.zone_count and Property.total_treatable_sqft (derived-field reconciliation)"]
  - method: GET
    path: "/properties/{id}/zones"
    description: "List TreatmentZones of a Property (FK reverse-reachability for TreatmentZone.property_id)."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, CrewTech]
    code: 200
    input: ["limit?", "offset?"]
    output: TreatmentZone[]
    side_effects: []
  - method: POST
    path: "/zones/{id}/exclude"
    description: "Mark a TreatmentZone EXCLUDED (no longer sprayed)."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: TreatmentZone
    side_effects: ["Set zone.status = EXCLUDED", "Recompute Property.zone_count (unchanged, still counted) and Property.total_treatable_sqft (excluded zone drops out of ACTIVE sum)"]

  # ---- Subscription lifecycle ----
  - method: POST
    path: "/subscriptions"
    description: "Create a DRAFT Subscription for a Property."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: ["property_id", "service_plan_id", "billing_mode", "season_start_date", "season_end_date", "auto_renew?"]
    output: Subscription
    side_effects: ["status initializes DRAFT", "visits_completed_count and season_balance_cents initialize to 0"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a Subscription with computed visits_completed_count and season_balance_cents."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/properties/{id}/subscriptions"
    description: "List Subscriptions of a Property (FK reverse-reachability for Subscription.property_id)."
    roles: [AccountHolder, PlatformAdmin, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List Subscriptions, filterable by service_plan_id or renewed_into_subscription_id (FK reverse-reachability for Subscription.service_plan_id and Subscription.renewed_into_subscription_id)."
    roles: [PlatformAdmin, BillingAdmin]
    code: 200
    input: ["service_plan_id?", "renewed_into_subscription_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "Activate a DRAFT Subscription: generate the recurring visit schedule and, for SEASONAL billing, issue the seasonal invoice."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Generate RECURRING Visits at visit_interval_days cadence up to season_end_date", "For SEASONAL: issue SEASONAL Invoice via seasonal_charge", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/close-season"
    description: "Manually transition an ACTIVE Subscription to OFF_SEASON (also auto-fired when the clock advances past season_end_date)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Skip remaining SCHEDULED/WEATHER_HOLD visits", "If auto_renew: mint DRAFT successor subscription and set renewed_into_subscription_id", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/confirm-renewal"
    description: "Confirm pre-renewal: activate the successor subscription minted at off-season."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Activate successor Subscription (DRAFT -> ACTIVE)", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a DRAFT or ACTIVE Subscription."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Cancel-cascade non-terminal visits", "For SEASONAL with ISSUED invoice: void invoice and credit prorated refund to wallet via cancellation_proration_refund", "increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/special-event"
    description: "Schedule a one-time SPECIAL_EVENT treatment visit under an ACTIVE subscription."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [scheduled_date]
    output: Visit
    side_effects: ["Create a SPECIAL_EVENT Visit (status SCHEDULED, sequence_index 0)"]

  # ---- Visits ----
  - method: GET
    path: "/visits/{id}"
    description: "Fetch a Visit."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, CrewTech, BillingAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/visits"
    description: "List Visits of a Subscription (FK reverse-reachability for Visit.subscription_id)."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: ["parent_visit_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List Visits filterable by crew_route_id, weather_event_id, or parent_visit_id (FK reverse-reachability for Visit.crew_route_id, Visit.weather_event_id, Visit.parent_visit_id)."
    roles: [PlatformAdmin, Dispatcher, CrewTech]
    code: 200
    input: ["crew_route_id?", "weather_event_id?", "parent_visit_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/weather-hold"
    description: "Place a SCHEDULED Visit on WEATHER_HOLD due to a qualifying weather event."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: [weather_event_id]
    output: Visit
    side_effects: ["Set visit.weather_event_id", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/reschedule"
    description: "Reschedule a WEATHER_HOLD Visit to a new in-season date."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: [new_scheduled_date]
    output: Visit
    side_effects: ["Set visit.scheduled_date = new_scheduled_date", "Increment visit.reschedule_count", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a SCHEDULED SPECIAL_EVENT Visit."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/application-logs"
    description: "Record a barrier-spray ApplicationLog for a DISPATCHED visit."
    roles: [CrewTech, PlatformAdmin]
    code: 201
    input: [treatment_zone_id, product_code, gallons_applied, logged_by_tech_id]
    output: ApplicationLog
    side_effects: []
  - method: GET
    path: "/visits/{id}/application-logs"
    description: "List ApplicationLogs for a Visit (FK reverse-reachability for ApplicationLog.visit_id)."
    roles: [AccountHolder, PlatformAdmin, Dispatcher, CrewTech]
    code: 200
    input: ["limit?", "offset?"]
    output: ApplicationLog[]
    side_effects: []
  - method: GET
    path: "/application-logs/{id}"
    description: "Fetch a single ApplicationLog."
    roles: [PlatformAdmin, Dispatcher, CrewTech]
    code: 200
    input: []
    output: ApplicationLog
    side_effects: []
  - method: GET
    path: "/application-logs"
    description: "List ApplicationLogs filterable by treatment_zone_id or logged_by_tech_id (FK reverse-reachability for ApplicationLog.treatment_zone_id and ApplicationLog.logged_by_tech_id)."
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["treatment_zone_id?", "logged_by_tech_id?", "limit?", "offset?"]
    output: ApplicationLog[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/complete"
    description: "Mark a DISPATCHED Visit COMPLETED (requires >=1 application log); for PER_VISIT billing, issues the per-visit invoice."
    roles: [CrewTech, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: ["Set completed_at_date = logical date", "Recompute Subscription.visits_completed_count", "For PER_VISIT: issue PER_VISIT Invoice via visit_charge, recompute season_balance_cents", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/request-retreat"
    description: "AccountHolder invokes the satisfaction re-treat guarantee on a COMPLETED RECURRING visit within the window."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/schedule-retreat"
    description: "Dispatcher schedules the free re-treat: creates a child RETREAT Visit."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: [retreat_date]
    output: Visit
    side_effects: ["Create child RETREAT Visit (SCHEDULED, parent_visit_id set)", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/close-retreat"
    description: "Close the guarantee loop on the parent visit once the child RETREAT visit is COMPLETED."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version by 1"]

  # ---- Routes / dispatch ----
  - method: POST
    path: "/crew-routes"
    description: "Create an OPEN CrewRoute for a crew on a date in their region."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [crew_id, region_code, route_date]
    output: CrewRoute
    side_effects: ["status initializes OPEN", "assigned_visit_count 0, remaining_capacity = Crew.daily_capacity"]
  - method: GET
    path: "/crew-routes/{id}"
    description: "Fetch a CrewRoute with computed assigned_visit_count and remaining_capacity."
    roles: [Dispatcher, PlatformAdmin, CrewTech]
    code: 200
    input: []
    output: CrewRoute
    side_effects: []
  - method: GET
    path: "/crews/{id}/crew-routes"
    description: "List CrewRoutes for a Crew (FK reverse-reachability for CrewRoute.crew_id)."
    roles: [Dispatcher, PlatformAdmin, CrewTech]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewRoute[]
    side_effects: []
  - method: GET
    path: "/crew-routes/{id}/summary"
    description: "Computed read: route_load_factor and remaining_capacity for a route."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: CrewRoute
    side_effects: []
  - method: POST
    path: "/crew-routes/{routeId}/dispatch-visit"
    description: "Dispatch a SCHEDULED Visit onto an OPEN CrewRoute (OCC-guarded on route version)."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: [visit_id, expected_crewroute_version]
    output: Visit
    side_effects: ["Set visit.crew_route_id, visit -> DISPATCHED", "Recompute route assigned_visit_count and remaining_capacity", "increments CrewRoute.version by 1"]
  - method: POST
    path: "/crew-routes/{id}/lock"
    description: "Lock an OPEN route (no further dispatch)."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: CrewRoute
    side_effects: ["increments CrewRoute.version by 1"]
  - method: POST
    path: "/crew-routes/{id}/close"
    description: "Close a LOCKED route once all its visits are COMPLETED or SKIPPED."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: CrewRoute
    side_effects: ["increments CrewRoute.version by 1"]

  # ---- Weather feed ----
  - method: POST
    path: "/weather-events"
    description: "Publish a WeatherEvent advisory for a region/date."
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [region_code, event_date, severity]
    output: WeatherEvent
    side_effects: []
  - method: GET
    path: "/weather-events/{id}"
    description: "Fetch a WeatherEvent."
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: []
    output: WeatherEvent
    side_effects: []

  # ---- Invoices / billing ----
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an Invoice."
    roles: [BillingAdmin, AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/invoices"
    description: "List Invoices of a Subscription (FK reverse-reachability for Invoice.subscription_id)."
    roles: [BillingAdmin, AccountHolder, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List Invoices filterable by visit_id (FK reverse-reachability for Invoice.visit_id)."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: ["visit_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Record payment on an ISSUED Invoice; overpayment credits wallet."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [paid_amount_cents]
    output: Invoice
    side_effects: ["Set paid_amount_cents, status PAID", "Overpayment credited to AccountHolder.wallet_credit_cents", "Recompute Subscription.season_balance_cents", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an ISSUED Invoice."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status VOID", "Recompute Subscription.season_balance_cents", "increments Invoice.version by 1"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical current UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to real wall-clock time. Advancing the logical date past an ACTIVE subscription's season_end_date auto-fires the ACTIVE -> OFF_SEASON transition for that subscription."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Auto-transition every ACTIVE Subscription whose season_end_date < new logical date to OFF_SEASON (with its off-season cascade and pre-renewal)"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for the operation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or FK-referenced resource does not exist."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting entity_backed user does not own the targeted resource (AccountHolder/CrewTech ownership)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match the parent's current version."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum, or out-of-range numeric (incl. season_start_date > season_end_date, area_sqft <= 0)."
  - id: ERR_NO_QUALIFYING_WEATHER
    http: 409
    condition: "weather-hold attempted with no RAIN_HEAVY/WIND_HIGH WeatherEvent for the property's region on the visit's scheduled_date."
  - id: ERR_RESCHEDULE_LIMIT
    http: 409
    condition: "Visit has already been rescheduled 3 times (reschedule_count >= 3)."
  - id: ERR_DATE_OUT_OF_SEASON
    http: 409
    condition: "A reschedule/retreat/special-event date is not strictly after the anchor date or falls after season_end_date."
  - id: ERR_GUARANTEE_EXPIRED
    http: 409
    condition: "Re-treat requested after the retreat_guarantee_days window has closed."
  - id: ERR_ZONE_NOT_TREATABLE
    http: 409
    condition: "ApplicationLog references a zone of a different property or an EXCLUDED zone."
  - id: ERR_REGION_MISMATCH
    http: 409
    condition: "Route region != crew home region, or dispatch route region/date != visit's property region / scheduled_date."
  - id: ERR_ROUTE_AT_CAPACITY
    http: 409
    condition: "Dispatch to a route already at remaining_capacity == 0."
  - id: ERR_RETREAT_ALREADY_EXISTS
    http: 409
    condition: "A RETREAT visit already exists for this parent RECURRING visit."
  - id: ERR_UNDERPAYMENT
    http: 402
    condition: "paid_amount_cents < invoice.amount_cents."
  - id: ERR_NO_APPLICATION_LOGGED
    http: 409
    condition: "Visit completion attempted with zero ApplicationLog rows."
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "Special-event scheduling or visit-level operation attempted against a Subscription not in ACTIVE status."
  - id: ERR_ROUTE_NOT_EMPTY
    http: 409
    condition: "Close attempted on a LOCKED route that still has a DISPATCHED visit."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: AccountHolder
    description: "Owns properties, zones, subscriptions, special-event and re-treat requests; pays nothing directly (BillingAdmin records payments)."
    identity: "entity_backed:AccountHolder"
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{id}/zones"
      - "POST /zones/{id}/exclude"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/confirm-renewal"
      - "POST /subscriptions/{id}/cancel"
      - "POST /subscriptions/{id}/special-event"
      - "POST /visits/{id}/cancel"
      - "POST /visits/{id}/request-retreat"
    shared_operations:
      - "POST /account-holders"
      - "GET reads on owned properties, subscriptions, visits, invoices, application-logs"
  - name: Dispatcher
    description: "Owns route/crew dispatch, weather holds, reschedules, and re-treat scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /crew-routes"
      - "POST /crew-routes/{routeId}/dispatch-visit"
      - "POST /crew-routes/{id}/lock"
      - "POST /crew-routes/{id}/close"
      - "POST /visits/{id}/weather-hold"
      - "POST /visits/{id}/reschedule"
      - "POST /visits/{id}/schedule-retreat"
      - "POST /visits/{id}/close-retreat"
    shared_operations:
      - "POST /crews"
      - "POST /weather-events"
      - "GET reads on visits, routes, zones, weather-events"
  - name: CrewTech
    description: "Technician on a route; records barrier-spray application logs and completes visits on routes assigned to their own Crew id."
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /visits/{id}/application-logs"
      - "POST /visits/{id}/complete"
    shared_operations:
      - "GET reads on visits, zones, routes, crews, application-logs"
  - name: BillingAdmin
    description: "Manages invoices: payment recording and voiding."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{id}/pay"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "GET reads on invoices, subscriptions, account-holders"
  - name: PlatformAdmin
    description: "Operational superset: configures plans/crews, publishes weather, drives the logical clock, and may perform any business operation for operational support."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-plans"
      - "POST /_clock/set_current_utc"
      - "POST /subscriptions/{id}/close-season"
    shared_operations:
      - "All AccountHolder, Dispatcher, CrewTech, BillingAdmin operations (operational override)"
