  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: disclosure_boundary_rejects_amenity_outside_zone
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_DISCLOSURE_BOUNDARY_VIOLATION
        distinguishing_aspect: "A bid whose required_amenity_codes contains an amenity the zone does not reveal (SPA when the zone reveals only POOL) is rejected with 422 ERR_DISCLOSURE_BOUNDARY_VIOLATION — the rate-parity guard fires before any candidate math."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Zone NB29 reveals only [POOL]; customer C exists."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB29", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc13@x.com", full_name: "Corner Cust Thirteen" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB29", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED", required_amenity_codes: ["SPA"] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_DISCLOSURE_BOUNDARY_VIOLATION"
            - "GET /opaque/opaque-bids?customer_id=${cust_id} returns 0 rows"

      - name: blocked_customer_cannot_create_bid
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_CUSTOMER_BLOCKED
        distinguishing_aspect: "The fraud gate applies at bid CREATION (not only evaluation): a BLOCKED customer gets 403 ERR_CUSTOMER_BLOCKED from POST /opaque/opaque-bids."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer C driven to BLOCKED via two upheld manual flags of 30. Zone NB30 exists."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/customers"
              payload: { email: "cc14@x.com", full_name: "Corner Cust Fourteen" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /opaque/fraud-flags/${f1}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /opaque/fraud-flags/${f2}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB30", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB30", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_CUSTOMER_BLOCKED"

      - name: goodwill_amount_must_be_strictly_between_zero_and_charged
        claim_type: Violation → Error
        grounds:
