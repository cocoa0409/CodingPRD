  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_offering_withdraws_enrollment_refunds_contributions_depth3
        grounds:
          - state_machines.OfferingPeriod.OPEN_to_CANCELLED
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Contribution.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from offering cancel: cancel OfferingPeriod -> each child
          Enrollment WITHDRAWN -> each Enrollment's POSTED Contributions REFUNDED.
          The Contribution refund is caused by the Enrollment withdrawal, not directly
          by the offering cancel.
        test_recipe:
          setup:
            - "An OPEN offering with one ENROLLED enrollment that has one POSTED contribution of 50000c"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "CancCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_x_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "canc@x.com", full_name: "C P", employee_id: "ECANC" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { px_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_x_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_x_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${px_id}", offering_period_id: "${off_x_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${px_id}"
              captures: { enr_x_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_x_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 500000 }
              as: PlanAdministrator
              as_user_id: admin1
          trigger:
            - call: "POST /offering-periods/${off_x_id}/cancel"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /enrollments/${enr_x_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { enr_x_status: $.data.status }
            - call: "GET /contributions"
              payload: { enrollment_id: "${enr_x_id}" }
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "OfferingPeriod.${off_x_id}.status == CANCELLED"
            - "Enrollment.${enr_x_id}.status == WITHDRAWN"
            - "Enrollment.${enr_x_id}.refunded_contribution_cents == 50000"
            - "every Contribution for enrollment ${enr_x_id} has status == REFUNDED"

      - name: run_purchase_charges_ledger_closes_offering_completes_enrollment_depth3
        grounds:
          - state_machines.PurchasePeriod.CERTIFIED_to_PURCHASED
          - state_machines.OfferingPeriod.ACTIVE_to_CLOSED
          - state_machines.Enrollment.ENROLLED_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (run-purchase on the last batch):
          run-purchase -> PurchasePeriod PURCHASED -> (last batch) OfferingPeriod
          ACTIVE->CLOSED -> child ENROLLED Enrollment COMPLETED. The enrollment
          completion is caused by the offering closing, not directly by run-purchase.
        test_recipe:
          setup:
            - "Single-batch offering, one ENROLLED enrollment with 100000c contributions, batch CERTIFIED"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "CloseCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_cl_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cl@x.com", full_name: "Cl P", employee_id: "ECL" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pcl_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_cl_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 6, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_cl_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pcl_id}", offering_period_id: "${off_cl_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pcl_id}"
              captures: { enr_cl_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_cl_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_cl_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_cl_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-05-31T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_cl_id: $.data.id }
            - call: "POST /purchase-periods/${pp_cl_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_cl_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_cl_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_cl_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_cl_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /offering-periods/${off_cl_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_cl_status: $.data.status }
            - call: "GET /enrollments/${enr_cl_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { enr_cl_status: $.data.status }
            - call: "GET /accrual-ledgers"
              payload: { participant_id: "${pcl_id}" }
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "PurchasePeriod.${pp_cl_id}.status == PURCHASED"
            - "OfferingPeriod.${off_cl_id}.status == CLOSED"
            - "Enrollment.${enr_cl_id}.status == COMPLETED"
            - "AccrualLedger for (${pcl_id}, 2024).accrued_grant_value_cents == 117000"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: five_percent_owner_beats_rate_exceeds_on_enroll
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_safety (ERR_FIVE_PERCENT_OWNER, priority 5)
          vs business_constraint (ERR_RATE_EXCEEDS_LIMIT, priority 13). A 5% owner
          enrolling at rate 99% fails both; the safety check wins.
        test_recipe:
          setup:
            - "Participant flagged is_five_percent_owner=true; OPEN offering under a plan with max rate 15"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "FiveCo", max_contribution_rate_pct: 15 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_f_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "five@x.com", full_name: "F P", employee_id: "EFIVE", is_five_percent_owner: true }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pf_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_f_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_f_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { participant_id: "${pf_id}", offering_period_id: "${off_f_id}", contribution_rate_pct: 99 }
              as: Participant
              as_user_id: "${pf_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_FIVE_PERCENT_OWNER"

      - name: not_certified_beats_stale_version_on_run_purchase
        grounds:
          - validations[priority=8]
          - validations[priority=17]
        distinguishing_aspect: |
          Error-category pair state (ERR_NOT_CERTIFIED, priority 8) vs business_fiscal
          (ERR_STALE_VERSION, priority 17). Running an OPEN (un-certified) batch with a
          deliberately stale version fails the state check first.
        test_recipe:
          setup:
            - "A batch in OPEN status (opened but not certified)"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "NcCo", discount_pct: 15, lookback_enabled: true }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_nc_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "nc@x.com", full_name: "Nc P", employee_id: "ENC" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pnc_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_nc_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_nc_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pnc_id}", offering_period_id: "${off_nc_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pnc_id}"
              captures: { enr_nc_id: $.data.id }
            - call: "POST /offering-periods/${off_nc_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_nc_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_nc_id: $.data.id }
            - call: "POST /purchase-periods/${pp_nc_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_nc_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_nc_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_nc_v} - 1" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { err_id2: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NOT_CERTIFIED"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: qualifying_holding_period_exact_anniversary_inclusive
        grounds:
          - calculations.disposition_classification
          - state_machines.Disposition.create_to_RECORDED
        distinguishing_aspect: |
          Boundary metric: holding-period date threshold on POST /dispositions.
          Selling exactly on the 2y-grant / 1y-purchase anniversary (2024-06-30,
          grant 2022-01-01, purchase 2022-06-30) is QUALIFYING (>= inclusive);
          one day earlier would be DISQUALIFYING.
        test_recipe:
          setup:
            - "Purchased ShareLot grant 2022-01-01, purchase 2022-06-30, 100 shares"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "BndCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_bn_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "bnd@x.com", full_name: "Bnd P", employee_id: "EBND" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pbn_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_bn_id}", grant_date: "2022-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_bn_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pbn_id}", offering_period_id: "${off_bn_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${pbn_id}"
              captures: { enr_bn_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_bn_id}", pay_date: "2022-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_bn_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_bn_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2022-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_bn_id: $.data.id }
            - call: "POST /purchase-periods/${pp_bn_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_bn_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_bn_v: $.data.version }
            - call: "POST /purchase-periods/${pp_bn_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_bn_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /share-lots"
              payload: { participant_id: "${pbn_id}" }
              as: Participant
              as_user_id: "${pbn_id}"
              captures: { lot_bn_id: "$.data[0].id" }
          trigger:
            - call: "POST /dispositions"
              payload: { share_lot_id: "${lot_bn_id}", participant_id: "${pbn_id}", sale_date: "2024-06-30T00:00:00.000Z", shares_sold: 50, sale_price_per_share_cents: 1500 }
              as: Participant
              as_user_id: "${pbn_id}"
              captures: { disp_bn_id: $.data.id }
          assert:
            - "Disposition.${disp_bn_id}.disposition_type == QUALIFYING"

      - name: offering_duration_lower_bound_six_months_inclusive
        grounds:
          - validations[priority=10]
          - entities.OfferingPeriod.fields.duration_months
        distinguishing_aspect: |
          Boundary metric: duration_months threshold on POST /offering-periods (a
          different endpoint and a different metric than the holding-period date
          boundary). duration_months=6 is accepted (>= inclusive); 5 is rejected
          with ERR_OFFERING_DURATION.
        test_recipe:
          setup:
            - "A plan exists; create an offering at exactly the 6-month floor"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "DurCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_du_id: $.data.id }
          trigger:
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_du_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 6, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_du_id: $.data.id, off_du_status: $.data.status }
          assert:
            - "response status == 201"
            - "OfferingPeriod.${off_du_id}.duration_months == 6"
            - "OfferingPeriod.${off_du_id}.status == OPEN"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contribution_requires_enrolled_enrollment
        grounds:
          - validations[priority=16]
          - state_machines.Enrollment.ENROLLED_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair Contribution->Enrollment: a Contribution POST is rejected when
          the referenced Enrollment is SUSPENDED (not ENROLLED). The child operation's
          validity depends on the parent enrollment's state.
        test_recipe:
          setup:
            - "An enrollment that has been SUSPENDED"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "CcdCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_cc_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "ccd@x.com", full_name: "Ccd P", employee_id: "ECCD" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pcc_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_cc_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_cc_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pcc_id}", offering_period_id: "${off_cc_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pcc_id}"
              captures: { enr_cc_id: $.data.id }
            - call: "POST /enrollments/${enr_cc_id}/suspend"
              payload: {}
              as: Participant
              as_user_id: "${pcc_id}"
          trigger:
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_cc_id}", pay_date: "2024-03-01T00:00:00.000Z", gross_pay_cents: 500000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { err_cc: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ENROLLMENT_NOT_CONTRIBUTING"

      - name: open_purchase_period_requires_offering_enrollment_closed
        grounds:
          - state_machines.PurchasePeriod.PENDING_to_OPEN
          - state_machines.OfferingPeriod.OPEN_to_ENROLLMENT_CLOSED
        distinguishing_aspect: |
          Entity pair PurchasePeriod->OfferingPeriod (different from Contribution->
          Enrollment): opening a PurchasePeriod is rejected with ERR_INVALID_STATE
          while the parent OfferingPeriod is still OPEN (enrollment not yet closed).
        test_recipe:
          setup:
            - "An OPEN offering (enrollment not closed) with a PENDING purchase period"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "OpcCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_op_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_op_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_op_id: $.data.id }
            - call: "POST /offering-periods/${off_op_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_op_id: $.data.id }
          trigger:
            - call: "POST /purchase-periods/${pp_op_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { err_op: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: purchase_date_must_fall_within_offering_window_closed_interval
        grounds:
          - validations[priority=11]
          - entities.OfferingPeriod.fields.end_date
          - entities.PurchasePeriod.fields.purchase_date
        distinguishing_aspect: |
          Interval semantics: closed-interval containment on the OfferingPeriod
          resource. A PurchasePeriod.purchase_date is rejected when it lies outside
          [grant_date, end_date]; here purchase_date 2025-01-01 is past the
          12-month offering end 2025-01-01 boundary -> rejected if strictly after.
        test_recipe:
          setup:
            - "12-month offering grant 2024-01-01 end 2025-01-01"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "WinCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_w_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_w_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_w_id: $.data.id }
          trigger:
            - call: "POST /offering-periods/${off_w_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2025-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { err_w: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_PURCHASE_DATE_OUT_OF_RANGE"

      - name: disposition_sale_date_not_before_purchase_date_half_open_floor
        grounds:
          - validations[priority=12]
          - entities.ShareLot.fields.purchase_date
          - entities.Disposition.fields.sale_date
        distinguishing_aspect: |
          Different interval semantics (a one-sided lower-bound floor on the ShareLot
          resource, vs the two-sided containment of instance 1): a Disposition.sale_date
          strictly before ShareLot.purchase_date is rejected with ERR_SALE_BEFORE_PURCHASE.
        test_recipe:
          setup:
            - "A purchased ShareLot with purchase_date 2024-06-30"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "SbpCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_sb_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "sbp@x.com", full_name: "Sbp P", employee_id: "ESBP" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { psb_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_sb_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_sb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${psb_id}", offering_period_id: "${off_sb_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${psb_id}"
              captures: { enr_sb_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_sb_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_sb_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_sb_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_sb_id: $.data.id }
            - call: "POST /purchase-periods/${pp_sb_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_sb_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_sb_v: $.data.version }
            - call: "POST /purchase-periods/${pp_sb_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_sb_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /share-lots"
              payload: { participant_id: "${psb_id}" }
              as: Participant
              as_user_id: "${psb_id}"
              captures: { lot_sb_id: "$.data[0].id" }
          trigger:
            - call: "POST /dispositions"
              payload: { share_lot_id: "${lot_sb_id}", participant_id: "${psb_id}", sale_date: "2024-06-29T00:00:00.000Z", shares_sold: 10, sale_price_per_share_cents: 1500 }
              as: Participant
              as_user_id: "${psb_id}"
              captures: { err_sb: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_SALE_BEFORE_PURCHASE"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_conserves_contribution_cash
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Enrollment.fields.accumulated_contribution_cents
          - entities.Enrollment.fields.refunded_contribution_cents
        distinguishing_aspect: |
          Conserved quantity = total contribution cash. After POST contributions then
          withdraw, accumulated_contribution_cents + refunded_contribution_cents equals
          the total ever contributed (50000); the forward (contribute) and compensating
          (withdraw->refund) actions leave the cash total unchanged at 50000.
        test_recipe:
          setup:
            - "An ENROLLED enrollment with one 50000c POSTED contribution"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ConsCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_co_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cons@x.com", full_name: "Cons P", employee_id: "ECONS" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pco_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_co_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_co_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pco_id}", offering_period_id: "${off_co_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pco_id}"
              captures: { enr_co_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_co_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 500000 }
              as: PlanAdministrator
              as_user_id: admin1
          trigger:
            - call: "POST /enrollments/${enr_co_id}/withdraw"
              payload: {}
              as: Participant
              as_user_id: "${pco_id}"
              captures: { enr_co_status: $.data.status }
            - call: "GET /enrollments/${enr_co_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "Enrollment.${enr_co_id}.accumulated_contribution_cents == 0"
            - "Enrollment.${enr_co_id}.refunded_contribution_cents == 50000"
            - "accumulated_contribution_cents + refunded_contribution_cents == 50000 (cash conserved)"

      - name: purchase_conserves_shares_and_residual_cash
        grounds:
          - state_machines.PurchasePeriod.CERTIFIED_to_PURCHASED
          - entities.Purchase.fields.spend_cents
          - entities.Purchase.fields.residual_cents
        distinguishing_aspect: |
          Different conserved quantity = contribution cash split at purchase:
          spend_cents + residual_cents == accumulated_contribution_cents (100000).
          The buy consumes cash into shares and refunds the remainder; no cash is
          created or lost (spend 99450 + residual 550 == 100000).
        test_recipe:
          setup:
            - "Single-batch offering, enrollment with 100000c contributions, price 850c -> 117 shares, residual 550c"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ShCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_sh_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "sh@x.com", full_name: "Sh P", employee_id: "ESH" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { psh_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_sh_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 6, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_sh_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${psh_id}", offering_period_id: "${off_sh_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${psh_id}"
              captures: { enr_sh_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_sh_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_sh_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_sh_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-05-31T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_sh_id: $.data.id }
            - call: "POST /purchase-periods/${pp_sh_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_sh_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_sh_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_sh_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_sh_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /purchases"
              payload: { enrollment_id: "${enr_sh_id}" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { purch_sh_id: "$.data[0].id" }
          assert:
            - "Purchase ${purch_sh_id}.shares_purchased == 117"
            - "Purchase ${purch_sh_id}.spend_cents == 99450"
            - "Purchase ${purch_sh_id}.residual_cents == 550"
            - "spend_cents + residual_cents == 100000 (contribution cash conserved)"
