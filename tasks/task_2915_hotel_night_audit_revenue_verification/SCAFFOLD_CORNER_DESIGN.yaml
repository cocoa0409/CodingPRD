            - "GET /night-audit/ledger-accounts/${deposit_acct_id} reads current_balance_amount == 300.00, derived from its own postings rather than stored by the client."
            - "GET /night-audit/folios/${folio_id} reads charges_total_amount == 300.00, credits_total_amount == -300.00, balance_amount == 0.00 and settlement_status == \"SETTLED\"."
            - "GET /night-audit/journal-postings?ledger_account_id=${deposit_acct_id} returns exactly 1 row and GET /night-audit/journal-postings?folio_id=${folio_id} returns exactly 2 - neither leg leaked into the other's index."
            - "POST /night-audit/journal-postings/${folio_leg_id}/reverse as Controller drives ledger_control_amount back to 300.00 and the ledger account current_balance_amount stays 300.00, so the control total tracks live postings rather than a running counter."

      - name: state_conditional_cascade_reopen_supersedes_only_live_reports
        claim_type: conditional_cascade
        grounds: ["state_machines.BusinessDate.status", "state_machines.RevenueReport.status", "entities.BusinessDate.fields.reopen_count", "errors[ERR_REPORT_NOT_DISTRIBUTED]"]
        distinguishing_aspect: "The reopen cascade is explicitly conditional on the child's state - it touches reports in DRAFT or DISTRIBUTED and leaves an already-SUPERSEDED report exactly as it was - and its consequence is that the period's subsystem total gives the date back."
        test_recipe:
          setup: ["Standard property, no outlets, no folios; date 2026-08-01 driven to CLOSED via a first report that a second report already superseded, so the date owns one SUPERSEDED and one DISTRIBUTED report before the trigger."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
