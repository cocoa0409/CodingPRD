  # -------------------------------------------------- AssociationParticipation
  - method: POST
    path: "/compliance/participations"
    description: "Business lead nominates a delegate for participation in an approved trade association"
    roles: [BusinessLead]
    code: 201
    input: [business_unit_id, association_id, employee_id, purpose]
    output: AssociationParticipation
    side_effects: ["status := DRAFT", "review_load_minutes := 0"]

  - method: GET
    path: "/compliance/participations/{id}"
    description: "Read a participation including its reserved counsel review minutes"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: []
    output: AssociationParticipation
    side_effects: []

  - method: GET
    path: "/compliance/participations"
    description: "List participations, filterable by unit, association, delegate and status"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: ["business_unit_id?", "association_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: "AssociationParticipation[]"
    side_effects: []

  - method: POST
    path: "/compliance/participations/{id}/submission"
    description: "Submit a draft participation into the two-branch approval fork"
    roles: [BusinessLead]
    code: 200
    input: []
    output: AssociationParticipation
    side_effects: ["status := APPROVAL_PENDING"]

  - method: POST
    path: "/compliance/participations/{id}/legal-clearance"
    description: "LEGAL BRANCH — counsel clears or rejects the participation; clearing reserves the counsel review load against the unit's budget"
    roles: [AntitrustCounsel]
    code: 200
    input: [decision, "notes?"]
    output: AssociationParticipation
    side_effects:
      - "decision CLEARED: review_load_minutes := calculations.participation_review_load_minutes; review_minutes_reserved := review_load_minutes; BusinessUnit.review_minutes_consumed += review_minutes_reserved; BusinessUnit.version += 1"
      - "decision CLEARED: legal_cleared := true; legal_cleared_by_user_id := X-User-ID"
      - "status := PARTIALLY_APPROVED, or ACTIVE when this arrival completes the join"
      - "decision REJECTED: status := REJECTED and no minutes are reserved"

  - method: POST
    path: "/compliance/participations/{id}/business-justification"
    description: "BUSINESS BRANCH — business lead records the commercial justification; reserves no counsel minutes"
    roles: [BusinessLead]
    code: 200
    input: [justification]
    output: AssociationParticipation
    side_effects:
      - "business_justified := true; business_justification recorded"
      - "status := PARTIALLY_APPROVED, or ACTIVE when this arrival completes the join"

  - method: POST
    path: "/compliance/participations/{id}/reinstatement"
    description: "Counsel reinstates a suspended or under-review participation"
    roles: [AntitrustCounsel]
    code: 200
    input: []
    output: AssociationParticipation
    side_effects: ["status := ACTIVE"]

  - method: POST
    path: "/compliance/participations/{id}/termination"
    description: "Terminate a participation and release its reserved counsel review minutes"
    roles: [BusinessLead, AntitrustCounsel]
    code: 200
    input: [reason]
    output: AssociationParticipation
    side_effects:
      - "status := TERMINATED"
      - "BusinessUnit.review_minutes_consumed -= review_minutes_reserved; review_minutes_reserved := 0; BusinessUnit.version += 1"
      - "cancels the participation's PLANNED attendances"

