          (priority 8, HTTP 422) vs conflict_safety (priority 9, HTTP 409) — and
          a different endpoint (POST /presentations/{presentationId}/submit).
          Here the two rules disagree on the status code, so an implementation
          that evaluates conflict rules first fails on both error_id and status.
