scenario: |
  2752. Address Point & Emergency Response Geographic Data Management (county geographic
  information services): authoritative address point creation from parcel, permit and postal
  sources with subaddress handling for units, road centerline maintenance with names, ranges
  and jurisdictional boundaries validated against address points, emergency service boundary
  maintenance defining which agency responds to each location with overlap and gap detection,
  quality control validation reports required before provisioning data to the emergency call
  routing system, address assignment for new construction coordinated with permitting and
  utilities, discrepancy resolution between agencies over road names, ranges and boundaries,
  data provisioning cadence to dispatch, mapping and public systems with version control,
  historical address retention for records research

domain_name: county-address-and-emergency-response-gis
api_prefix: "/gis"

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

envelope_conventions:
  list_endpoints: |
    Every endpoint whose `output:` is `<Entity>[]` returns `response_type: "array"`, the array
    itself in `data`, and the four `pagination_fields` inside `meta` alongside
    `api_request_id` / `api_request_timestamp`. `total_count` is the count of rows matching the
    filters BEFORE limit/offset; `has_more` is `offset + len(data) < total_count`.
  datetime_format: |
    Every datetime crossing the API boundary (request or response, including `created_at`,
    `updated_at`, `effective_start`, `effective_end`, `published_at`) is ISO 8601 UTC with
    EXACTLY three fractional-second digits and a trailing `Z`: `YYYY-MM-DDTHH:MM:SS.mmmZ`.
    Inputs supplied with zero fractional digits (`2026-09-01T00:00:00Z`) are accepted and
    normalized by zero-padding to `.000Z`; responses always emit the three-digit form.
  money_and_scores: |
    All scores are JSON numbers (never strings) with exactly 2 decimal places, ROUND_HALF_UP.
  default_sort: |
    Every list endpoint sorts by `created_at ASC` and never by `id`.

# ---------------------------------------------------------------------------
# §0.1–§0.4 Complexity Profile
# ---------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  entity_topology_note: |
    Peer aggregates linked by foreign keys with two junction-style entities
    (BoundaryCellAssignment joins EmergencyServiceBoundary x CoverageCell; PackageRecord joins
    ProvisioningPackage x {AddressPoint | RoadCenterline | EmergencyServiceBoundary}) and two
    self-referential edges on AddressPoint (`parent_address_point_id` for subaddress units,
    `superseded_by_address_point_id` for historical retention chains). Nested URL paths are used
    only for genuine sub-resources (defects, records, proposals, cell-assignments).

  state_machine_shape: cyclic
  state_machine_shape_note: |
    DiscrepancyCase is cyclic (PROPOSAL_PENDING -> COUNTERED -> PROPOSAL_PENDING negotiation
    rounds); AddressAssignmentRequest carries three parallel state dimensions
    (review_status x utility_status -> derived fulfillment_status) with a cycle on the utility
    axis (UTILITY_HELD -> UTILITY_CLEARED); RoadCenterline has a demotion cycle
    (VALIDATED -> PUBLISHED -> VALIDATED); ProvisioningPackage has a restore cycle
    (PUBLISHED -> SUPERSEDED -> PUBLISHED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    The user who generated a QC report may not certify it; the user who certified a report may
    not publish a provisioning package built on it; the agency that authored the pending
    discrepancy proposal may not concur with it.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the jurisdiction (e.g. "Larimer County").
        constraints: 1..120 chars, non-blank
      - name: code
        type: string
        source: input
        description: Short jurisdiction code used on provisioning exports.
        constraints: 2..8 chars, uppercase A-Z0-9, globally unique
      - name: jurisdiction_type
        type: enum
        source: input
        description: Kind of jurisdiction.
        constraints: one of {COUNTY, MUNICIPAL, UNINCORPORATED}
      - name: postal_city
        type: string
        source: input
        description: Authoritative postal city string for addresses in this jurisdiction; stored uppercased.
        constraints: 1..60 chars, uppercased on write
      - name: cell_count
        type: integer
        source: computed
        description: Count of CoverageCell rows whose jurisdiction_id equals this Jurisdiction.id.
        default: 0
      - name: covered_cell_count
        type: integer
        source: computed
        description: |
          Count of CoverageCell rows in this jurisdiction that have EXACTLY ONE ACTIVE
          BoundaryCellAssignment whose half-open window contains the logical clock instant, for
          EACH of the three service types {LAW, FIRE, EMS}. See calculations.coverage_integrity_counters.
        default: 0
      - name: gap_pair_count
        type: integer
        source: computed
        description: |
          Count of (CoverageCell, service_type) pairs in this jurisdiction with ZERO ACTIVE
          BoundaryCellAssignment covering the logical clock instant (instantaneous variant).
        default: 0
      - name: forward_gap_pair_count
        type: integer
        source: computed
        description: |
          Count of (CoverageCell, service_type) pairs in this jurisdiction that have at least one
          instant inside the horizon [now, now + E911_FORWARD_HORIZON_DAYS) uncovered
          (forward_window variant of coverage_integrity_counters).
        default: 0

  - name: Agency
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Responding agency name.
        constraints: 1..120 chars, non-blank
      - name: agency_type
        type: enum
        source: input
        description: Which emergency service this agency provides.
        constraints: one of {LAW, FIRE, EMS}
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; the jurisdiction that charters this agency.
      - name: contact_phone
        type: string
        source: input
        description: Dispatch contact number; informational only.
        default: null
      - name: status
        type: enum
        source: system
        description: ACTIVE agencies may hold emergency service boundaries; SUSPENDED agencies may not activate new ones.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}
      - name: suspended_reason
        type: string
        source: system
        description: Reason captured by POST /gis/agencies/{id}/suspend; null while ACTIVE.
        default: null

  - name: CoverageCell
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: cell_code
        type: string
        source: input
        description: Grid cell label (the deterministic spatial primitive; all geography in this system is expressed as cell membership).
        constraints: 1..12 chars, uppercase A-Z0-9, unique per jurisdiction_id
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; jurisdiction the cell belongs to.
      - name: centroid_lat
        type: number
        source: input
        description: Informational centroid latitude; never used in any business decision.
        default: null
      - name: centroid_lon
        type: number
        source: input
        description: Informational centroid longitude; never used in any business decision.
        default: null
      - name: active_assignment_count
        type: integer
        source: computed
        description: |
          Count of BoundaryCellAssignment rows with cell_id == this cell and status == ACTIVE
          whose half-open window contains the logical clock instant (all service types summed).
        default: 0

  - name: RoadCenterline
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: primary_name
        type: string
        source: input
        description: Road name exactly as maintained by the county (spelling preserved verbatim).
        constraints: 1..120 chars, non-blank
      - name: normalized_name
        type: string
        source: computed
        description: Output of calculations.normalized_road_name over primary_name; the road-identity key for overlap and discrepancy detection.
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; jurisdictional boundary this centerline segment falls in.
      - name: from_addr_left
        type: integer
        source: input
        description: Low end (inclusive) of the LEFT-side address range.
        constraints: 0..999999
      - name: to_addr_left
        type: integer
        source: input
        description: High end (inclusive) of the LEFT-side address range.
        constraints: 0..999999
      - name: parity_left
        type: enum
        source: input
        description: Parity of house numbers on the LEFT side.
        constraints: one of {EVEN, ODD}
      - name: from_addr_right
        type: integer
        source: input
        description: Low end (inclusive) of the RIGHT-side address range.
        constraints: 0..999999
      - name: to_addr_right
        type: integer
        source: input
        description: High end (inclusive) of the RIGHT-side address range.
        constraints: 0..999999
      - name: parity_right
        type: enum
        source: input
        description: Parity of house numbers on the RIGHT side; must differ from parity_left.
        constraints: one of {EVEN, ODD}
      - name: status
        type: enum
        source: system
        description: Maintenance lifecycle of the centerline record.
        default: DRAFT
        constraints: one of {DRAFT, VALIDATED, PUBLISHED, RETIRED}
      - name: qc_dirty
        type: boolean
        source: system
        description: True once name or range fields change after validation; cleared by a successful validate.
        default: false
      - name: open_discrepancy_case_count
        type: integer
        source: computed
        description: |
          Count of DiscrepancyCase rows whose subject_ref_id == this RoadCenterline.id and whose
          status IN {OPEN, PROPOSAL_PENDING, COUNTERED, ESCALATED}. Greater than zero freezes the record.
        default: 0
      - name: assignable_slot_count_left
        type: integer
        source: computed
        description: LEFT-side output of calculations.assignable_slot_count (capacity minus consumed slots, floored at 0).
        default: 0
      - name: assignable_slot_count_right
        type: integer
        source: computed
        description: RIGHT-side output of calculations.assignable_slot_count.
        default: 0
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant the centerline was retired; null unless status == RETIRED.
        default: null
      - name: retire_reason
        type: string
        source: system
        description: Operator-supplied reason recorded by POST /gis/road-centerlines/{id}/retire.
        default: null

  - name: AddressPoint
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: house_number
        type: integer
        source: input
        description: Primary house number; must lie in the addressed side's inclusive range and match its parity.
        constraints: 0..999999
      - name: house_number_suffix
        type: string
        source: input
        description: Optional alpha suffix (e.g. "A"); part of the duplicate-address key.
        default: null
        constraints: 0..4 chars, uppercase A-Z
      - name: road_centerline_id
        type: string
        source: input
        description: FK -> RoadCenterline.id; the centerline this address is ranged against.
      - name: side
        type: enum
        source: input
        description: Which side of the centerline the address sits on; selects the range/parity pair.
        constraints: one of {LEFT, RIGHT}
      - name: unit_type
        type: enum
        source: input
        description: Subaddress designator; null for a base address.
        default: null
        constraints: one of {UNIT, APT, STE, BLDG} or null
      - name: unit_id
        type: string
        source: input
        description: Subaddress identifier (e.g. "3B"); null for a base address. Non-null requires a parent_address_point_id.
        default: null
        constraints: 0..8 chars, uppercase A-Z0-9
      - name: parent_address_point_id
        type: string
        source: input
        description: FK -> AddressPoint.id; the base address a subaddress unit hangs off. Null for base addresses.
        default: null
      - name: jurisdiction_id
        type: string
        source: computed
        description: FK -> Jurisdiction.id; copied from the referenced RoadCenterline.jurisdiction_id at creation and never independently editable.
      - name: cell_id
        type: string
        source: input
        description: FK -> CoverageCell.id; the coverage cell the point falls in (drives emergency response routing).
      - name: source
        type: enum
        source: input
        description: Authoritative source the address was derived from; drives the confidence base weight.
        constraints: one of {PARCEL, PERMIT, POSTAL, FIELD}
      - name: postal_city
        type: string
        source: input
        description: Postal city asserted for this address; stored uppercased and compared to Jurisdiction.postal_city for confidence scoring.
        constraints: 1..60 chars
      - name: geometry_verified
        type: boolean
        source: input
        description: True when field staff verified the point geometry; adds GEOMETRY_VERIFIED_BONUS to confidence.
        default: false
      - name: latitude
        type: number
        source: input
        description: Informational latitude; never used in a business decision.
        default: null
      - name: longitude
        type: number
        source: input
        description: Informational longitude; never used in a business decision.
        default: null
      - name: status
        type: enum
        source: system
        description: PENDING (authored, not yet authoritative), ACTIVE (provisionable), RETIRED (historical, retained for records research), VOIDED (never existed in the field).
        default: PENDING
        constraints: one of {PENDING, ACTIVE, RETIRED, VOIDED}
      - name: confidence_score
        type: number
        source: computed
        description: PROVISIONAL variant of calculations.address_point_confidence_score, recomputed on every mutation of this point or its centerline's status.
        default: 0
      - name: certified_confidence_score
        type: number
        source: computed
        description: CERTIFIED variant of calculations.address_point_confidence_score; written at QC certification, nulled when the point is invalidated by a discrepancy adoption.
        default: null
      - name: confidence_basis
        type: enum
        source: computed
        description: Which variant currently describes this point.
        default: PROVISIONAL
        constraints: one of {PROVISIONAL, CERTIFIED}
      - name: unit_child_count
        type: integer
        source: computed
        description: Count of AddressPoint rows whose parent_address_point_id equals this point and whose status IN {PENDING, ACTIVE}.
        default: 0
      - name: superseded_by_address_point_id
        type: string
        source: input
        description: FK -> AddressPoint.id; successor address recorded at retirement so records research can walk the chain. Null unless superseded.
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant of retirement or voiding; null while PENDING/ACTIVE.
        default: null
      - name: retire_reason
        type: enum
        source: system
        description: Why the point left service.
        default: null
        constraints: one of {ROAD_RETIRED, PARENT_RETIRED, REPLACED, ANALYST_RETIRED, REQUEST_VOIDED} or null

  - name: AddressAssignmentRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: permit_number
        type: string
        source: input
        description: Building permit number the address assignment is requested for.
        constraints: 1..32 chars, globally unique
      - name: parcel_id
        type: string
        source: input
        description: Assessor parcel identifier supplied by the permit office.
        constraints: 1..32 chars
      - name: road_centerline_id
        type: string
        source: input
        description: FK -> RoadCenterline.id; the centerline the new construction fronts.
      - name: side
        type: enum
        source: input
        description: Side of the centerline the parcel fronts; selects the range/parity pair for number selection.
        constraints: one of {LEFT, RIGHT}
      - name: requested_unit_count
        type: integer
        source: input
        description: Number of subaddress units to mint under the base address; 0 mints a base address only.
        default: 0
        constraints: 0..99
      - name: proposed_house_number
        type: integer
        source: input
        description: Optional operator-preferred house number; must be a member of the candidate set or the assignment is rejected.
        default: null
      - name: review_status
        type: enum
        source: system
        description: GIS review dimension (independent of the utility dimension).
        default: PENDING_REVIEW
        constraints: one of {PENDING_REVIEW, GIS_APPROVED, GIS_REJECTED}
      - name: utility_status
        type: enum
        source: system
        description: Utility coordination dimension (independent of the review dimension); HELD may later flip to CLEARED.
        default: PENDING_UTILITY
        constraints: one of {PENDING_UTILITY, UTILITY_CLEARED, UTILITY_HELD}
      - name: fulfillment_status
        type: enum
        source: computed
        description: Derived join of the two dimensions plus assignment/void outcome; see state_machines.AddressAssignmentRequest.
        default: OPEN
        constraints: one of {OPEN, READY_TO_ASSIGN, FULFILLED, CLOSED_REJECTED, VOIDED}
      - name: assigned_address_point_id
        type: string
        source: system
        description: FK -> AddressPoint.id; the base AddressPoint minted by the assign action. Null until FULFILLED.
        default: null
      - name: assigned_house_number
        type: integer
        source: computed
        description: House number chosen by calculations.next_house_number_selection at assign time.
        default: null
      - name: minted_point_count
        type: integer
        source: computed
        description: Count of AddressPoint rows minted by this request (base plus units), independent of their later status.
        default: 0
      - name: review_note
        type: string
        source: input
        description: Free-text note recorded with the GIS review decision.
        default: null
      - name: utility_note
        type: string
        source: input
        description: Free-text note recorded with the utility clearance decision.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason recorded by POST /gis/address-assignment-requests/{id}/void.
        default: null

  - name: EmergencyServiceBoundary
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; the agency that responds inside this boundary.
      - name: service_type
        type: enum
        source: computed
        description: Copied from Agency.agency_type at creation; a boundary can never disagree with its agency's service.
        constraints: one of {LAW, FIRE, EMS}
      - name: effective_start
        type: datetime
        source: input
        description: Inclusive start of the boundary's service window.
      - name: effective_end
        type: datetime
        source: input
        description: EXCLUSIVE end of the boundary's service window; null means open-ended.
        default: null
      - name: status
        type: enum
        source: system
        description: DRAFT (editable), PROPOSED (cells fixed, awaiting activation), ACTIVE (responds to calls), RETIRED (terminal).
        default: DRAFT
        constraints: one of {DRAFT, PROPOSED, ACTIVE, RETIRED}
      - name: assigned_cell_count
        type: integer
        source: computed
        description: Count of BoundaryCellAssignment rows with boundary_id == this boundary and status IN {PENDING, ACTIVE}.
        default: 0
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant of retirement; null unless status == RETIRED.
        default: null
      - name: retire_reason
        type: string
        source: system
        description: Reason recorded by POST /gis/emergency-service-boundaries/{id}/retire.
        default: null

  - name: BoundaryCellAssignment
    parent: EmergencyServiceBoundary
    common_fields: true
    entity_kind: resource
    fields:
      - name: boundary_id
        type: string
        source: system
        description: FK -> EmergencyServiceBoundary.id; taken from the path of the creating call.
      - name: cell_id
        type: string
        source: input
        description: FK -> CoverageCell.id; the cell this boundary claims.
      - name: service_type
        type: enum
        source: computed
        description: Copied from the parent boundary's service_type; the overlap key is (cell_id, service_type).
        constraints: one of {LAW, FIRE, EMS}
      - name: effective_start
        type: datetime
        source: input
        description: Inclusive start of the cell claim window.
      - name: effective_end
        type: datetime
        source: input
        description: EXCLUSIVE end of the cell claim window; null means open-ended.
        default: null
      - name: status
        type: enum
        source: system
        description: Mirrors the parent boundary lifecycle — PENDING while the boundary is DRAFT/PROPOSED, ACTIVE once activated, RETIRED once the boundary retires.
        default: PENDING
        constraints: one of {PENDING, ACTIVE, RETIRED}

  - name: QcValidationReport
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: scope
        type: enum
        source: input
        description: Which slice of the database the scan covered.
        constraints: one of {FULL, JURISDICTION, ROAD}
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; required when scope == JURISDICTION, must be null otherwise.
        default: null
      - name: road_centerline_id
        type: string
        source: input
        description: FK -> RoadCenterline.id; required when scope == ROAD, must be null otherwise.
        default: null
      - name: status
        type: enum
        source: system
        description: GENERATED (scan complete), CERTIFIED (usable for provisioning), REJECTED (terminal), DECERTIFIED (invalidated by a later record change, terminal).
        default: GENERATED
        constraints: one of {GENERATED, CERTIFIED, REJECTED, DECERTIFIED}
      - name: generated_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that generated the report; segregation of duties bars this id from certifying it.
      - name: defect_count
        type: integer
        source: computed
        description: Count of QcDefect rows on this report (any status).
        default: 0
      - name: blocking_defect_count
        type: integer
        source: computed
        description: Count of QcDefect rows with severity == BLOCKING (any status).
        default: 0
      - name: warning_defect_count
        type: integer
        source: computed
        description: Count of QcDefect rows with severity == WARNING.
        default: 0
      - name: info_defect_count
        type: integer
        source: computed
        description: Count of QcDefect rows with severity == INFO.
        default: 0
      - name: open_blocking_defect_count
        type: integer
        source: computed
        description: Count of QcDefect rows with severity == BLOCKING and status == OPEN; must be 0 to certify.
        default: 0
      - name: waived_blocking_count
        type: integer
        source: computed
        description: Count of QcDefect rows with severity == BLOCKING and status == WAIVED; drives the eligibility waiver penalty.
        default: 0
      - name: quality_score
        type: number
        source: computed
        description: strict_certification variant of calculations.qc_quality_score (waived blocking defects still deduct).
        default: 0
      - name: advisory_quality_score
        type: number
        source: computed
        description: advisory_snapshot variant of calculations.qc_quality_score (waived defects excluded from deductions).
        default: 0
      - name: quality_tier
        type: enum
        source: computed
        description: Tier selected from quality_score by calculations.provisioning_eligibility_score; never re-derived from the final score.
        default: null
        constraints: one of {A, B, C, D} or null
      - name: provisioning_eligibility_score
        type: number
        source: computed
        description: Output of calculations.provisioning_eligibility_score.
        default: 0
      - name: is_provisioning_eligible
        type: boolean
        source: computed
        description: True when provisioning_eligibility_score >= PROVISIONING_MIN_SCORE (inclusive).
        default: false
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the certifier; segregation of duties bars this id from publishing a package built on the report.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Reason recorded by POST /gis/qc-validation-reports/{id}/reject.
        default: null
      - name: decertified_reason
        type: enum
        source: system
        description: Why a CERTIFIED report was invalidated.
        default: null
        constraints: one of {SUBJECT_RECORD_CHANGED} or null

  - name: QcDefect
    parent: QcValidationReport
    common_fields: true
    entity_kind: event
    fields:
      - name: report_id
        type: string
        source: system
        description: FK -> QcValidationReport.id; the scan that emitted this defect.
      - name: defect_code
        type: enum
        source: system
        description: Which validation rule the scan violated.
        constraints: >-
          one of {ADDRESS_MISSING_GEOMETRY, ADDRESS_UNCOVERED_CELL, ADDRESS_POSTAL_CITY_MISMATCH,
          ADDRESS_UNIT_TYPE_MISSING, ADDRESS_LOW_CONFIDENCE, ROAD_UNVALIDATED, ROAD_RANGE_OVERLAP,
          ROAD_NAME_NOT_NORMALIZED, ROAD_QC_DIRTY, ROAD_NO_ADDRESSES, BOUNDARY_COVERAGE_GAP,
          PROPOSED_COVERAGE_OVERLAP, BOUNDARY_STALE_WINDOW} — exactly the twelve rule codes
          emitted by calculations.qc_defect_scan
      - name: severity
        type: enum
        source: system
        description: Fixed per defect_code by constants.DEFECT_SEVERITY.
        constraints: one of {BLOCKING, WARNING, INFO}
      - name: defect_category
        type: enum
        source: system
        description: Scoring category the defect deducts from, fixed per defect_code by constants.DEFECT_CATEGORY.
        constraints: one of {ADDRESS, ROAD, BOUNDARY}
      - name: entity_type
        type: enum
        source: system
        description: Type of record the defect is anchored to.
        constraints: one of {ROAD_CENTERLINE, ADDRESS_POINT, COVERAGE_CELL}
      - name: entity_ref_id
        type: string
        source: system
        description: Polymorphic anchor id resolved per entity_type (ROAD_CENTERLINE -> RoadCenterline.id, ADDRESS_POINT -> AddressPoint.id, COVERAGE_CELL -> CoverageCell.id). Intentionally NOT a canonical FK; no referential integrity is enforced on it.
      - name: detail
        type: string
        source: system
        description: Human-readable explanation emitted by the scan (e.g. "LEFT range 150-248 EVEN overlaps 100-198 EVEN").
      - name: status
        type: enum
        source: system
        description: OPEN or WAIVED; waiving clears the certification gate but never removes the strict-score deduction.
        default: OPEN
        constraints: one of {OPEN, WAIVED}
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the certifier who waived the defect.
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: Reason recorded by POST /gis/qc-defects/{id}/waive.
        default: null
      - name: waived_at
        type: datetime
        source: system
        description: Logical-clock instant of the waiver.
        default: null

  - name: ProvisioningPackage
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: channel
        type: enum
        source: input
        description: Downstream consumer this release targets; sets the cadence interval and whether the E911 coverage gate applies.
        constraints: one of {DISPATCH_E911, MAPPING, PUBLIC}
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; the jurisdiction whose records are released.
      - name: qc_report_id
        type: string
        source: input
        description: FK -> QcValidationReport.id; the QC report that authorises this release.
      - name: status
        type: enum
        source: system
        description: DRAFT -> SEALED -> PUBLISHED, with SUPERSEDED / INVALIDATED / ROLLED_BACK exits.
        default: DRAFT
        constraints: one of {DRAFT, SEALED, PUBLISHED, SUPERSEDED, INVALIDATED, ROLLED_BACK}
      - name: package_version
        type: integer
        source: computed
        description: Monotonic release number per (channel, jurisdiction_id), assigned at seal by calculations.package_version_assignment. Null while DRAFT.
        default: null
      - name: record_count
        type: integer
        source: computed
        description: Number of records captured in the seal snapshot; equals pinned_record_count.
        default: 0
      - name: pinned_record_count
        type: integer
        source: computed
        description: Count of PackageRecord rows created at seal.
        default: 0
      - name: fresh_pin_count
        type: integer
        source: computed
        description: Count of PackageRecord rows with pin_state == FRESH.
        default: 0
      - name: stale_pin_count
        type: integer
        source: computed
        description: Count of PackageRecord rows with pin_state == STALE.
        default: 0
      - name: drift_detected
        type: boolean
        source: computed
        description: True once stale_pin_count > 0; a PUBLISHED package keeps serving but is flagged as drifted.
        default: false
      - name: sealed_at
        type: datetime
        source: system
        description: Logical-clock instant of sealing.
        default: null
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication; the cadence baseline for the next release on this (channel, jurisdiction).
        default: null
      - name: sealed_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who sealed the package.
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who published the package.
        default: null
      - name: invalidated_reason
        type: enum
        source: system
        description: Reason recorded by the FIRST invalidating cascade rule to fire; later rules do not overwrite it.
        default: null
        constraints: one of {PIN_STALE, REPORT_DECERTIFIED} or null
      - name: rollback_reason
        type: string
        source: system
        description: Reason recorded by POST /gis/provisioning-packages/{id}/rollback.
        default: null

  - name: PackageRecord
    parent: ProvisioningPackage
    common_fields: true
    entity_kind: event
    fields:
      - name: package_id
        type: string
        source: system
        description: FK -> ProvisioningPackage.id; the seal snapshot this pin belongs to.
      - name: record_type
        type: enum
        source: system
        description: Which record family the pin refers to.
        constraints: one of {ADDRESS_POINT, ROAD_CENTERLINE, EMERGENCY_SERVICE_BOUNDARY}
      - name: record_id
        type: string
        source: system
        description: Polymorphic id of the pinned record resolved per record_type. Intentionally NOT a canonical FK.
      - name: pinned_version
        type: integer
        source: system
        description: The pinned record's `version` at seal time; the pin goes stale when the live record's version moves past it.
      - name: pin_state
        type: enum
        source: system
        description: FRESH while the live record's version still equals pinned_version, STALE afterwards.
        default: FRESH
        constraints: one of {FRESH, STALE}
      - name: staled_at
        type: datetime
        source: system
        description: Logical-clock instant the pin went stale.
        default: null

  - name: DiscrepancyCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: subject_type
        type: enum
        source: input
        description: What the two agencies disagree about.
        constraints: one of {ROAD_NAME, ADDRESS_RANGE, BOUNDARY_CELL}
      - name: subject_ref_id
        type: string
        source: input
        description: Polymorphic subject id — RoadCenterline.id when subject_type IN {ROAD_NAME, ADDRESS_RANGE}, CoverageCell.id when subject_type == BOUNDARY_CELL. Intentionally NOT a canonical FK; existence is validated per subject_type at creation.
      - name: jurisdiction_id
        type: string
        source: computed
        description: FK -> Jurisdiction.id; copied from the subject record's jurisdiction at creation.
      - name: opened_by_agency_id
        type: string
        source: system
        description: FK -> Agency.id; the acting AgencyLiaison's agency (X-User-ID) at creation.
      - name: counterparty_agency_id
        type: string
        source: input
        description: FK -> Agency.id; the other party, which must be a different agency in the same jurisdiction.
      - name: description
        type: string
        source: input
        description: Statement of the disagreement.
        constraints: 1..500 chars
      - name: status
        type: enum
        source: system
        description: Negotiation lifecycle; PROPOSAL_PENDING and COUNTERED cycle until concurrence, withdrawal of rounds is not permitted.
        default: OPEN
        constraints: one of {OPEN, PROPOSAL_PENDING, COUNTERED, CONCURRED, ADOPTED, ESCALATED, ARBITRATED}
      - name: round_count
        type: integer
        source: system
        description: Number of DiscrepancyProposal rows filed on this case; escalation fires when a proposal is filed while round_count already equals MAX_PROPOSAL_ROUNDS.
        default: 0
      - name: current_proposal_id
        type: string
        source: system
        description: FK -> DiscrepancyProposal.id; the most recently filed proposal (the only one that may be concurred with). Null while OPEN.
        default: null
      - name: concurred_by_side
        type: enum
        source: system
        description: Which side concurred; the authoring side may never concur with its own proposal.
        default: null
        constraints: one of {OPENER, COUNTERPARTY} or null
      - name: resolved_value
        type: string
        source: system
        description: The value written into the subject record at adoption or arbitration.
        default: null
      - name: escalated_at
        type: datetime
        source: system
        description: Logical-clock instant the round limit was breached.
        default: null
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant of adoption or arbitration.
        default: null

  - name: DiscrepancyProposal
    parent: DiscrepancyCase
    common_fields: false
    entity_kind: event
    immutability_note: |
      Append-only: `id` and `created_at` only, no `updated_at`, no `version`. Its `status` is a
      pure projection over sibling rows and the parent case (calculations.discrepancy_proposal_projection),
      so a filed proposal row is never rewritten.
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> DiscrepancyCase.id; taken from the path of the creating call.
      - name: round_number
        type: integer
        source: computed
        description: 1-based ordinal of this proposal within the case, equal to case.round_count after the filing.
      - name: proposed_by_side
        type: enum
        source: computed
        description: OPENER when the acting agency is case.opened_by_agency_id, COUNTERPARTY when it is case.counterparty_agency_id.
        constraints: one of {OPENER, COUNTERPARTY}
      - name: proposed_value
        type: string
        source: input
        description: The road name, range expression, or cell claim being proposed.
        constraints: 1..120 chars
      - name: rationale
        type: string
        source: input
        description: Optional justification.
        default: null
      - name: status
        type: enum
        source: computed
        description: Projection per calculations.discrepancy_proposal_projection — PENDING (latest, case not yet resolved), COUNTERED (a later proposal exists), ADOPTED (case ADOPTED/ARBITRATED and this is the resolved proposal), VOIDED (case ESCALATED and this is not the resolved proposal).
        constraints: one of {PENDING, COUNTERED, ADOPTED, VOIDED}

# ---------------------------------------------------------------------------
# Shared cascade rules referenced by name from side_effects below
# ---------------------------------------------------------------------------
cascade_rules:
  - name: PIN_STALENESS_RULE
    description: |
      Whenever ANY mutation increments the `version` of a record that some PackageRecord pins
      (matching record_type + record_id, pin_state == FRESH), that PackageRecord flips to
      pin_state = STALE with staled_at = clock now, and its ProvisioningPackage recomputes
      fresh_pin_count / stale_pin_count / drift_detected.
      The consequence for a SEALED package depends on WHY the pin drifted:
        (a) DESTRUCTIVE drift — the mutation moved the pinned record into a terminal status
            (AddressPoint RETIRED/VOIDED, RoadCenterline RETIRED, EmergencyServiceBoundary
            RETIRED): the snapshot can never be published because the record no longer exists in
            the field, so the package transitions to INVALIDATED with
            invalidated_reason = PIN_STALE.
        (b) NON-DESTRUCTIVE drift — the pinned record merely changed while remaining live
            (re-scored by CONFIDENCE_REFRESH, re-validated, re-published, stamped by a QC
            certification, edited): the package STAYS SEALED with drift_detected = true and
            stale_pin_count > 0, and is refused at publish by validations[priority=27]
            (ERR_PACKAGE_PINS_STALE). A drifted SEALED package is never repaired in place — the
            officer opens and seals a fresh package.
      A PUBLISHED package always stays PUBLISHED with drift_detected = true under either kind of
      drift; DRAFT packages hold no pins.
      This rule is evaluated after each individual record mutation, in the declared cascade
      order of the triggering transition, before the cascade advances to its next level.
  - name: JURISDICTION_COUNTER_REFRESH
    description: |
      Whenever a BoundaryCellAssignment row is created, or its status changes, or a CoverageCell
      is created, the owning Jurisdiction recomputes cell_count, covered_cell_count,
      gap_pair_count and forward_gap_pair_count, and each affected CoverageCell recomputes
      active_assignment_count (calculations.coverage_integrity_counters).
  - name: ROAD_SLOT_REFRESH
    description: |
      Whenever an AddressPoint on a centerline is created, or its status changes, or the
      centerline's range/parity fields change, that RoadCenterline recomputes
      assignable_slot_count_left and assignable_slot_count_right
      (calculations.assignable_slot_count).
  - name: CONFIDENCE_REFRESH
    description: |
      Whenever a RoadCenterline's `status` changes or an AddressPoint's own scoring inputs
      change, every AddressPoint with status IN {PENDING, ACTIVE} on that centerline recomputes
      confidence_score with the PROVISIONAL variant, ordered by `house_number ASC, created_at ASC`,
      each bumping its own `version` by 1.
  - name: INVALIDATED_REASON_FIRST_WRITER
    description: |
      A ProvisioningPackage that is already INVALIDATED keeps the invalidated_reason recorded by
      the first invalidating rule that fired in the declared cascade order; later invalidating
      rules in the same request do not overwrite it and do not bump `version` again.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: RoadCenterline
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /gis/road-centerlines/{id}"
        actor: GisAnalyst
        preconditions:
          - "expected_road_version equals road.version"
          - "road.open_discrepancy_case_count == 0"
          - "resulting range geometry passes validations[priority=17]"
        side_effects:
          - "recompute normalized_name when primary_name changed"
          - "set qc_dirty = true"
          - "ROAD_SLOT_REFRESH"
          - "increments RoadCenterline.version by 1"
          - "PIN_STALENESS_RULE for this RoadCenterline"
        note: "Range/name edits on a DRAFT road do not change status."
      - from: VALIDATED
        to: DRAFT
        trigger: "PATCH /gis/road-centerlines/{id}"
        actor: GisAnalyst
        preconditions:
          - "expected_road_version equals road.version"
          - "road.open_discrepancy_case_count == 0"
          - "resulting range geometry passes validations[priority=17]"
        side_effects:
          - "recompute normalized_name when primary_name changed"
          - "set qc_dirty = true"
          - "ROAD_SLOT_REFRESH"
          - "increments RoadCenterline.version by 1"
          - "CONFIDENCE_REFRESH (ROAD_STATUS_PENALTY moves 5 -> 15)"
          - "PIN_STALENESS_RULE for this RoadCenterline and every recomputed AddressPoint"
        note: "Editing a validated road demotes it; it must be re-validated before publication."
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /gis/road-centerlines/{id}/validate"
        actor: GisAnalyst
        preconditions:
          - "road.open_discrepancy_case_count == 0"
          - "range geometry valid (validations[priority=17])"
          - "no address-range overlap against any other RoadCenterline with the same (jurisdiction_id, normalized_name) whose status IN {VALIDATED, PUBLISHED} (validations[priority=21])"
        side_effects:
          - "set qc_dirty = false"
          - "increments RoadCenterline.version by 1"
          - "CONFIDENCE_REFRESH (ROAD_STATUS_PENALTY moves 15 -> 5)"
          - "PIN_STALENESS_RULE for this RoadCenterline and every recomputed AddressPoint"
      - from: VALIDATED
        to: PUBLISHED
        trigger: "POST /gis/road-centerlines/{id}/publish"
        actor: QcCertifier
        preconditions:
          - "road.qc_dirty == false"
          - "road.open_discrepancy_case_count == 0"
        side_effects:
          - "increments RoadCenterline.version by 1"
          - "CONFIDENCE_REFRESH (ROAD_STATUS_PENALTY moves 5 -> 0)"
          - "PIN_STALENESS_RULE for this RoadCenterline and every recomputed AddressPoint"
      - from: PUBLISHED
        to: VALIDATED
        trigger: "system: DiscrepancyCase adoption/arbitration writes a new name or range into this centerline"
        actor: system
        preconditions:
          - "the adopted case's subject_ref_id == this RoadCenterline.id"
        side_effects:
          - "apply resolved_value to primary_name (subject_type ROAD_NAME) or to the side range fields (subject_type ADDRESS_RANGE)"
          - "recompute normalized_name"
          - "set qc_dirty = true"
          - "ROAD_SLOT_REFRESH"
          - "increments RoadCenterline.version by 1"
          - "for every AddressPoint on this road with status IN {PENDING, ACTIVE}: set confidence_basis = PROVISIONAL, set certified_confidence_score = null, recompute confidence_score, increment that point's version by 1 (level 3 of the adoption cascade)"
          - "PIN_STALENESS_RULE for this RoadCenterline and each invalidated AddressPoint"
        note: "Demotion cycle: a published road returns to VALIDATED and must be re-published."
      - from: DRAFT
        to: RETIRED
        trigger: "POST /gis/road-centerlines/{id}/retire"
        actor: GisAnalyst
        preconditions:
          - "road.open_discrepancy_case_count == 0"
        side_effects:
          - "set retired_at = clock now, retire_reason = payload retire_reason"
          - "increments RoadCenterline.version by 1"
          - "cascade level 2: every BASE AddressPoint on this road (unit_id IS NULL) with status IN {PENDING, ACTIVE}, ordered by house_number ASC then created_at ASC, transitions to RETIRED with retire_reason = ROAD_RETIRED"
          - "PIN_STALENESS_RULE per mutated record"
      - from: VALIDATED
        to: RETIRED
        trigger: "POST /gis/road-centerlines/{id}/retire"
        actor: GisAnalyst
        preconditions:
          - "road.open_discrepancy_case_count == 0"
        side_effects:
          - "same as DRAFT -> RETIRED"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /gis/road-centerlines/{id}/retire"
        actor: GisAnalyst
        preconditions:
          - "road.open_discrepancy_case_count == 0"
        side_effects:
          - "set retired_at = clock now, retire_reason = payload retire_reason"
          - "increments RoadCenterline.version by 1"
          - "cascade level 2: every BASE AddressPoint on this road (unit_id IS NULL) with status IN {PENDING, ACTIVE}, ordered by house_number ASC then created_at ASC, transitions to RETIRED with retire_reason = ROAD_RETIRED"
          - "cascade level 3 (caused by level 2, not by the retire call): for each base point retired in level 2, every subaddress AddressPoint whose parent_address_point_id equals it and whose status IN {PENDING, ACTIVE} transitions to RETIRED with retire_reason = PARENT_RETIRED — units are reached ONLY through their parent, never directly by level 2"
          - "cascade level 4 (caused by level 3): every PackageRecord pinning any record retired in levels 1-3 with pin_state == FRESH flips to STALE (PIN_STALENESS_RULE)"
          - "cascade level 5 (caused by level 4): every ProvisioningPackage whose status == SEALED and whose stale_pin_count became > 0 transitions to INVALIDATED with invalidated_reason = PIN_STALE"
          - "ROAD_SLOT_REFRESH"

  - entity: AddressPoint
    initial_state: PENDING
    terminal_states: [RETIRED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /gis/address-points/{id}/activate"
        actor: GisAnalyst
        preconditions:
          - "the referenced RoadCenterline.status IN {VALIDATED, PUBLISHED}"
          - "the referenced RoadCenterline.open_discrepancy_case_count == 0"
          - "when unit_id is not null: the parent AddressPoint.status == ACTIVE"
        side_effects:
          - "recompute confidence_score (PROVISIONAL variant)"
          - "increments AddressPoint.version by 1"
          - "ROAD_SLOT_REFRESH (no net change: PENDING and ACTIVE both consume a slot)"
          - "parent's unit_child_count refreshed when this point is a unit"
          - "PIN_STALENESS_RULE for this AddressPoint"
      - from: PENDING
        to: RETIRED
        trigger: "POST /gis/address-points/{id}/retire"
        actor: GisAnalyst
        preconditions:
          - "when superseded_by_address_point_id is supplied it must reference an AddressPoint with status IN {PENDING, ACTIVE}"
        side_effects:
          - "set retired_at = clock now; retire_reason = REPLACED when superseded_by_address_point_id supplied, else ANALYST_RETIRED"
          - "increments AddressPoint.version by 1"
          - "every AddressPoint whose parent_address_point_id equals this point and whose status IN {PENDING, ACTIVE} transitions to RETIRED with retire_reason = PARENT_RETIRED"
          - "ROAD_SLOT_REFRESH (frees one slot for a base address; units free none)"
          - "PIN_STALENESS_RULE per mutated record"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /gis/address-points/{id}/retire"
        actor: GisAnalyst
        preconditions:
          - "when superseded_by_address_point_id is supplied it must reference an AddressPoint with status IN {PENDING, ACTIVE}"
        side_effects:
          - "same as PENDING -> RETIRED"
        note: "Retired points are retained forever and remain queryable via include_retired=true for records research."
      - from: PENDING
        to: RETIRED
        trigger: "system: owning RoadCenterline retired (cascade level 2) or parent AddressPoint retired (cascade level 3)"
        actor: system
        preconditions:
          - "the triggering record's retirement completed"
        side_effects:
          - "set retire_reason = ROAD_RETIRED or PARENT_RETIRED, retired_at = clock now"
          - "increments AddressPoint.version by 1"
          - "PIN_STALENESS_RULE"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: owning RoadCenterline retired (cascade level 2) or parent AddressPoint retired (cascade level 3)"
        actor: system
        preconditions:
          - "the triggering record's retirement completed"
        side_effects:
          - "same as the PENDING system-retire transition"
      - from: PENDING
        to: VOIDED
        trigger: "system: POST /gis/address-assignment-requests/{id}/void voids the points it minted"
        actor: system
        preconditions:
          - "this point's id equals the request's assigned_address_point_id, or its parent_address_point_id does"
        side_effects:
          - "set retire_reason = REQUEST_VOIDED, retired_at = clock now"
          - "increments AddressPoint.version by 1"
          - "ROAD_SLOT_REFRESH (releases the consumed slot)"
          - "PIN_STALENESS_RULE"
      - from: ACTIVE
        to: VOIDED
        trigger: "system: POST /gis/address-assignment-requests/{id}/void voids the points it minted"
        actor: system
        preconditions:
          - "this point's id equals the request's assigned_address_point_id, or its parent_address_point_id does"
        side_effects:
          - "same as the PENDING -> VOIDED transition"

  - entity: AddressAssignmentRequest
    initial_state: "review_status=PENDING_REVIEW | utility_status=PENDING_UTILITY | fulfillment_status=OPEN"
    terminal_states: ["fulfillment_status=FULFILLED", "fulfillment_status=CLOSED_REJECTED", "fulfillment_status=VOIDED"]
    parallel_dimensions: [review_status, utility_status, fulfillment_status]
    transitions:
      - from: "review_status=PENDING_REVIEW"
        to: "review_status=GIS_APPROVED"
        trigger: "POST /gis/address-assignment-requests/{id}/gis-review with decision=APPROVE"
        actor: GisAnalyst
        preconditions:
          - "review_status == PENDING_REVIEW"
          - "fulfillment_status IN {OPEN}"
        side_effects:
          - "increments AddressAssignmentRequest.version by 1"
          - "if utility_status == UTILITY_CLEARED then fulfillment_status becomes READY_TO_ASSIGN (derived join)"
      - from: "review_status=PENDING_REVIEW"
        to: "review_status=GIS_REJECTED"
        trigger: "POST /gis/address-assignment-requests/{id}/gis-review with decision=REJECT"
        actor: GisAnalyst
        preconditions:
          - "review_status == PENDING_REVIEW"
          - "fulfillment_status IN {OPEN}"
        side_effects:
          - "fulfillment_status becomes CLOSED_REJECTED regardless of utility_status"
          - "increments AddressAssignmentRequest.version by 1"
      - from: "utility_status=PENDING_UTILITY"
        to: "utility_status=UTILITY_CLEARED"
        trigger: "POST /gis/address-assignment-requests/{id}/utility-clearance with decision=CLEAR"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN}"
        side_effects:
          - "increments AddressAssignmentRequest.version by 1"
          - "if review_status == GIS_APPROVED then fulfillment_status becomes READY_TO_ASSIGN"
      - from: "utility_status=PENDING_UTILITY"
        to: "utility_status=UTILITY_HELD"
        trigger: "POST /gis/address-assignment-requests/{id}/utility-clearance with decision=HOLD"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN}"
        side_effects:
          - "increments AddressAssignmentRequest.version by 1"
          - "fulfillment_status stays OPEN"
      - from: "utility_status=UTILITY_HELD"
        to: "utility_status=UTILITY_CLEARED"
        trigger: "POST /gis/address-assignment-requests/{id}/utility-clearance with decision=CLEAR"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN}"
        side_effects:
          - "increments AddressAssignmentRequest.version by 1"
          - "if review_status == GIS_APPROVED then fulfillment_status becomes READY_TO_ASSIGN"
        note: "The utility dimension cycles: a hold can be lifted, and a clearance can be re-held."
      - from: "utility_status=UTILITY_CLEARED"
        to: "utility_status=UTILITY_HELD"
        trigger: "POST /gis/address-assignment-requests/{id}/utility-clearance with decision=HOLD"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN}"
        side_effects:
          - "increments AddressAssignmentRequest.version by 1"
          - "if fulfillment_status == READY_TO_ASSIGN it demotes to OPEN"
      - from: "fulfillment_status=READY_TO_ASSIGN"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /gis/address-assignment-requests/{id}/assign"
        actor: GisAnalyst
        preconditions:
          - "fulfillment_status == READY_TO_ASSIGN"
          - "the referenced RoadCenterline.status IN {DRAFT, VALIDATED, PUBLISHED}"
          - "the candidate house-number set for (road, side) is non-empty (validations[priority=24])"
          - "when proposed_house_number is set it is a member of the candidate set (validations[priority=23])"
        side_effects:
          - "select assigned_house_number via calculations.next_house_number_selection"
          - "mint one base AddressPoint (status PENDING, source PERMIT, unit_id null, geometry_verified false, postal_city = the road's jurisdiction.postal_city, cell_id = the CoverageCell of that jurisdiction with the lowest cell_code, or null when the jurisdiction holds no cells)"
          - "mint requested_unit_count subaddress AddressPoints (status PENDING, source PERMIT, unit_type UNIT, unit_id = '1'..'N' in ascending numeric order, parent_address_point_id = the base point)"
          - "set assigned_address_point_id, minted_point_count = 1 + requested_unit_count"
          - "increments AddressAssignmentRequest.version by 1"
          - "ROAD_SLOT_REFRESH (the base point consumes exactly one slot; units consume none)"
      - from: "fulfillment_status=OPEN"
        to: "fulfillment_status=VOIDED"
        trigger: "POST /gis/address-assignment-requests/{id}/void"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN, FULFILLED}"
        side_effects:
          - "set void_reason"
          - "increments AddressAssignmentRequest.version by 1"
      - from: "fulfillment_status=READY_TO_ASSIGN"
        to: "fulfillment_status=VOIDED"
        trigger: "POST /gis/address-assignment-requests/{id}/void"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN, FULFILLED}"
        side_effects:
          - "same as OPEN -> VOIDED"
      - from: "fulfillment_status=FULFILLED"
        to: "fulfillment_status=VOIDED"
        trigger: "POST /gis/address-assignment-requests/{id}/void"
        actor: PermitCoordinator
        preconditions:
          - "fulfillment_status IN {OPEN, READY_TO_ASSIGN, FULFILLED}"
        side_effects:
          - "set void_reason"
          - "every AddressPoint minted by this request (the base point and its units), ordered by unit_id ASC with the base point first, transitions to VOIDED with retire_reason = REQUEST_VOIDED"
          - "ROAD_SLOT_REFRESH — the compensating action restores assignable_slot_count_<side> to its pre-assign value exactly"
          - "increments AddressAssignmentRequest.version by 1"
          - "PIN_STALENESS_RULE per voided point"

  - entity: EmergencyServiceBoundary
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /gis/emergency-service-boundaries/{id}/propose"
        actor: AgencyLiaison
        preconditions:
          - "X-User-ID == boundary.agency_id"
          - "assigned_cell_count >= 1"
        side_effects:
          - "increments EmergencyServiceBoundary.version by 1"
        note: "Cell assignments may only be added while the boundary is DRAFT."
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /gis/emergency-service-boundaries/{id}/activate"
        actor: AgencyLiaison
        preconditions:
          - "X-User-ID == boundary.agency_id"
          - "the owning Agency.status == ACTIVE (validations[priority=14])"
          - "for every BoundaryCellAssignment on this boundary, no other ACTIVE BoundaryCellAssignment on the same (cell_id, service_type) has a half-open window intersecting this one (validations[priority=31])"
        side_effects:
          - "every BoundaryCellAssignment on this boundary transitions PENDING -> ACTIVE"
          - "JURISDICTION_COUNTER_REFRESH"
          - "increments EmergencyServiceBoundary.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /gis/emergency-service-boundaries/{id}/retire"
        actor: AgencyLiaison
        preconditions:
          - "X-User-ID == boundary.agency_id"
        side_effects:
          - "set retired_at = clock now, retire_reason = payload retire_reason"
          - "every BoundaryCellAssignment on this boundary transitions ACTIVE -> RETIRED"
          - "JURISDICTION_COUNTER_REFRESH — the compensating action restores covered_cell_count and gap_pair_count to their pre-activation values exactly"
          - "increments EmergencyServiceBoundary.version by 1"
          - "PIN_STALENESS_RULE for this boundary"
      - from: PROPOSED
        to: RETIRED
        trigger: "POST /gis/emergency-service-boundaries/{id}/retire"
        actor: AgencyLiaison
        preconditions:
          - "X-User-ID == boundary.agency_id"
        side_effects:
          - "set retired_at, retire_reason"
          - "every BoundaryCellAssignment on this boundary transitions PENDING -> RETIRED"
          - "JURISDICTION_COUNTER_REFRESH"
          - "increments EmergencyServiceBoundary.version by 1"

  - entity: BoundaryCellAssignment
    initial_state: PENDING
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: parent EmergencyServiceBoundary activated"
        actor: system
        preconditions:
          - "parent boundary passed its activation overlap check"
        side_effects:
          - "increments BoundaryCellAssignment.version by 1"
          - "owning CoverageCell.active_assignment_count refreshed"
      - from: PENDING
        to: RETIRED
        trigger: "system: parent EmergencyServiceBoundary retired from PROPOSED"
        actor: system
        preconditions:
          - "parent boundary transitioned to RETIRED"
        side_effects:
          - "increments BoundaryCellAssignment.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: parent EmergencyServiceBoundary retired from ACTIVE"
        actor: system
        preconditions:
          - "parent boundary transitioned to RETIRED"
        side_effects:
          - "increments BoundaryCellAssignment.version by 1"
          - "owning CoverageCell.active_assignment_count refreshed"

  - entity: QcValidationReport
    initial_state: GENERATED
    terminal_states: [REJECTED, DECERTIFIED]
    transitions:
      - from: GENERATED
        to: CERTIFIED
        trigger: "POST /gis/qc-validation-reports/{id}/certify"
        actor: QcCertifier
        preconditions:
          - "open_blocking_defect_count == 0 (validations[priority=25])"
          - "X-User-ID != report.generated_by_user_id (validations[priority=9])"
        side_effects:
          - "set certified_by_user_id = X-User-ID, certified_at = clock now"
          - "increments QcValidationReport.version by 1"
          - "for every AddressPoint in the report's scope with status IN {PENDING, ACTIVE}, ordered by house_number ASC then created_at ASC: compute certified_confidence_score (CERTIFIED variant), set confidence_basis = CERTIFIED, increment that point's version by 1"
          - "PIN_STALENESS_RULE per mutated AddressPoint"
      - from: GENERATED
        to: REJECTED
        trigger: "POST /gis/qc-validation-reports/{id}/reject"
        actor: QcCertifier
        preconditions:
          - "status == GENERATED"
        side_effects:
          - "set rejection_reason"
          - "increments QcValidationReport.version by 1"
        note: "Rejection is terminal; the analyst generates a fresh report after fixing the data."
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "system: a DiscrepancyCase adoption/arbitration invalidated an AddressPoint in this report's scope (adoption cascade level 4)"
        actor: system
        preconditions:
          - "at least one AddressPoint whose confidence_basis was flipped back to PROVISIONAL by cascade level 3 lies in this report's scope"
        side_effects:
          - "set decertified_reason = SUBJECT_RECORD_CHANGED"
          - "increments QcValidationReport.version by 1"
          - "cascade level 5 (caused by level 4): every ProvisioningPackage with qc_report_id == this report and status IN {DRAFT, SEALED} transitions to INVALIDATED with invalidated_reason = REPORT_DECERTIFIED"

  - entity: QcDefect
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: WAIVED
        trigger: "POST /gis/qc-defects/{id}/waive"
        actor: QcCertifier
        preconditions:
          - "defect.status == OPEN"
          - "the owning report.status == GENERATED"
        side_effects:
          - "set waived_by_user_id, waiver_reason, waived_at"
          - "increments QcDefect.version by 1"
          - "the owning report recomputes open_blocking_defect_count, waived_blocking_count, quality_score, advisory_quality_score, quality_tier, provisioning_eligibility_score, is_provisioning_eligible, and increments its own version by 1"

  - entity: ProvisioningPackage
    initial_state: DRAFT
    terminal_states: [ROLLED_BACK, INVALIDATED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /gis/provisioning-packages/{id}/seal"
        actor: ProvisioningOfficer
        preconditions:
          - "the referenced QcValidationReport.status == CERTIFIED (validations[priority=13])"
          - "report.is_provisioning_eligible == true (validations[priority=28])"
          - "the in-scope record set is non-empty (validations[priority=26])"
        side_effects:
          - "assign package_version via calculations.package_version_assignment"
          - "create one PackageRecord per in-scope record with pinned_version = that record's current version and pin_state = FRESH (calculations.package_record_pin_set)"
          - "set record_count = pinned_record_count = fresh_pin_count = number of pins, stale_pin_count = 0, sealed_at, sealed_by_user_id"
          - "increments ProvisioningPackage.version by 1"
      - from: SEALED
        to: PUBLISHED
        trigger: "POST /gis/provisioning-packages/{id}/publish"
        actor: ProvisioningOfficer
        preconditions:
          - "X-User-ID != report.certified_by_user_id (validations[priority=9])"
          - "when channel == DISPATCH_E911: jurisdiction.forward_gap_pair_count == 0 (validations[priority=11])"
          - "stale_pin_count == 0 (validations[priority=27])"
          - "the cadence window for (channel, jurisdiction_id) is open (validations[priority=32])"
        side_effects:
          - "set published_at = clock now, published_by_user_id"
          - "any other ProvisioningPackage with the same (channel, jurisdiction_id) and status == PUBLISHED transitions to SUPERSEDED"
          - "increments ProvisioningPackage.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a later package on the same (channel, jurisdiction_id) was published"
        actor: system
        preconditions:
          - "a successor package transitioned to PUBLISHED in the same request"
        side_effects:
          - "increments ProvisioningPackage.version by 1"
      - from: PUBLISHED
        to: ROLLED_BACK
        trigger: "POST /gis/provisioning-packages/{id}/rollback"
        actor: ProvisioningOfficer
        preconditions:
          - "status == PUBLISHED"
          - "a SUPERSEDED predecessor exists for the same (channel, jurisdiction_id) (validations[priority=29])"
        side_effects:
          - "set rollback_reason"
          - "the SUPERSEDED package for the same (channel, jurisdiction_id) with the highest package_version, tie-broken by created_at ASC, transitions back to PUBLISHED"
          - "increments ProvisioningPackage.version by 1"
      - from: SUPERSEDED
        to: PUBLISHED
        trigger: "system: the successor package was rolled back"
        actor: system
        preconditions:
          - "the successor package transitioned to ROLLED_BACK in the same request"
          - "this package has the highest package_version among SUPERSEDED packages for the (channel, jurisdiction_id), tie-broken by created_at ASC"
        side_effects:
          - "published_at is left at its original value (the cadence baseline is the restored package's original publication instant)"
          - "increments ProvisioningPackage.version by 1"
      - from: SEALED
        to: INVALIDATED
        trigger: "system: PIN_STALENESS_RULE destructive drift (a pinned record reached a terminal status) or REPORT_DECERTIFIED cascade"
        actor: system
        preconditions:
          - "a pinned record moved into a terminal status (AddressPoint RETIRED/VOIDED, RoadCenterline RETIRED, EmergencyServiceBoundary RETIRED), or the referenced report transitioned to DECERTIFIED"
        side_effects:
          - "set invalidated_reason per INVALIDATED_REASON_FIRST_WRITER"
          - "increments ProvisioningPackage.version by 1"
        note: |
          NON-destructive drift does NOT invalidate: when a pinned record's version advances while
          the record stays live (CONFIDENCE_REFRESH, re-validate, re-publish, QC certification
          stamp, range edit), the package stays SEALED with drift_detected = true and is refused
          at publish by validations[priority=27] (ERR_PACKAGE_PINS_STALE). That is the only path
          to that error code.
      - from: DRAFT
        to: INVALIDATED
        trigger: "system: the referenced QcValidationReport transitioned to DECERTIFIED (adoption cascade level 5)"
        actor: system
        preconditions:
          - "the referenced report transitioned to DECERTIFIED"
        side_effects:
          - "set invalidated_reason = REPORT_DECERTIFIED"
          - "increments ProvisioningPackage.version by 1"

  - entity: DiscrepancyCase
    initial_state: OPEN
    terminal_states: [ADOPTED, ARBITRATED]
    transitions:
      - from: OPEN
        to: PROPOSAL_PENDING
        trigger: "POST /gis/discrepancy-cases/{id}/proposals"
        actor: AgencyLiaison
        preconditions:
          - "expected_case_version equals case.version"
          - "X-User-ID IN {case.opened_by_agency_id, case.counterparty_agency_id}"
          - "case.round_count < MAX_PROPOSAL_ROUNDS"
        side_effects:
          - "append a DiscrepancyProposal with round_number = case.round_count + 1"
          - "set round_count = round_count + 1, current_proposal_id = the new proposal"
          - "increments DiscrepancyCase.version by 1"
      - from: PROPOSAL_PENDING
        to: COUNTERED
        trigger: "POST /gis/discrepancy-cases/{id}/proposals filed by the side that did NOT author current_proposal_id"
        actor: AgencyLiaison
        preconditions:
          - "expected_case_version equals case.version"
          - "the acting agency's side != current_proposal.proposed_by_side"
          - "case.round_count < MAX_PROPOSAL_ROUNDS"
        side_effects:
          - "append a DiscrepancyProposal (the previous proposal's projected status becomes COUNTERED)"
          - "set round_count = round_count + 1, current_proposal_id = the new proposal"
          - "increments DiscrepancyCase.version by 1"
      - from: COUNTERED
        to: PROPOSAL_PENDING
        trigger: "POST /gis/discrepancy-cases/{id}/proposals filed by the side that did NOT author current_proposal_id"
        actor: AgencyLiaison
        preconditions:
          - "expected_case_version equals case.version"
          - "the acting agency's side != current_proposal.proposed_by_side"
          - "case.round_count < MAX_PROPOSAL_ROUNDS"
        side_effects:
          - "append a DiscrepancyProposal; round_count = round_count + 1; current_proposal_id updated"
          - "increments DiscrepancyCase.version by 1"
        note: "COUNTERED -> PROPOSAL_PENDING -> COUNTERED is the negotiation cycle."
      - from: PROPOSAL_PENDING
        to: ESCALATED
        trigger: "POST /gis/discrepancy-cases/{id}/proposals filed while round_count == MAX_PROPOSAL_ROUNDS"
        actor: AgencyLiaison
        preconditions:
          - "expected_case_version equals case.version"
          - "the acting agency's side != current_proposal.proposed_by_side"
          - "case.round_count == MAX_PROPOSAL_ROUNDS"
        side_effects:
          - "append the DiscrepancyProposal (round_number = MAX_PROPOSAL_ROUNDS + 1) and set round_count accordingly"
          - "set escalated_at = clock now; the case leaves the negotiation cycle and only arbitration can resolve it"
          - "increments DiscrepancyCase.version by 1"
      - from: COUNTERED
        to: ESCALATED
        trigger: "POST /gis/discrepancy-cases/{id}/proposals filed while round_count == MAX_PROPOSAL_ROUNDS"
        actor: AgencyLiaison
        preconditions:
          - "expected_case_version equals case.version"
          - "the acting agency's side != current_proposal.proposed_by_side"
          - "case.round_count == MAX_PROPOSAL_ROUNDS"
        side_effects:
          - "same as PROPOSAL_PENDING -> ESCALATED"
      - from: PROPOSAL_PENDING
        to: CONCURRED
        trigger: "POST /gis/discrepancy-cases/{id}/concur"
        actor: AgencyLiaison
        preconditions:
          - "payload proposal_id == case.current_proposal_id and that proposal's projected status == PENDING"
          - "the acting agency's side != current_proposal.proposed_by_side (validations[priority=16])"
        side_effects:
          - "set concurred_by_side to the acting side"
          - "increments DiscrepancyCase.version by 1"
      - from: COUNTERED
        to: CONCURRED
        trigger: "POST /gis/discrepancy-cases/{id}/concur"
        actor: AgencyLiaison
        preconditions:
          - "payload proposal_id == case.current_proposal_id and that proposal's projected status == PENDING"
          - "the acting agency's side != current_proposal.proposed_by_side"
        side_effects:
          - "same as PROPOSAL_PENDING -> CONCURRED"
      - from: CONCURRED
        to: ADOPTED
        trigger: "POST /gis/discrepancy-cases/{id}/adopt"
        actor: SystemAdmin
        preconditions:
          - "status == CONCURRED"
        side_effects:
          - "cascade level 1: set resolved_value = current_proposal.proposed_value, adopted_at = clock now, and increment DiscrepancyCase.version by 1; the subject RoadCenterline's open_discrepancy_case_count drops to 0"
          - "cascade level 2 (caused by level 1): the subject RoadCenterline applies resolved_value (primary_name for ROAD_NAME, the side range for ADDRESS_RANGE), recomputes normalized_name, sets qc_dirty = true, increments its version, and if its status was PUBLISHED it transitions to VALIDATED"
          - "cascade level 3 (caused by level 2): every AddressPoint on that centerline with status IN {PENDING, ACTIVE} has confidence_basis set to PROVISIONAL, certified_confidence_score set to null, confidence_score recomputed, and its version incremented"
          - "cascade level 4 (caused by level 3): every CERTIFIED QcValidationReport whose scope covers at least one of those AddressPoints transitions to DECERTIFIED with decertified_reason = SUBJECT_RECORD_CHANGED"
          - "cascade level 5 (caused by level 4): every ProvisioningPackage referencing such a report with status IN {DRAFT, SEALED} transitions to INVALIDATED with invalidated_reason = REPORT_DECERTIFIED"
          - "PIN_STALENESS_RULE is evaluated after each record mutation inside levels 2 and 3"
      - from: ESCALATED
        to: ARBITRATED
        trigger: "POST /gis/discrepancy-cases/{id}/arbitrate"
        actor: SystemAdmin
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "set resolved_value = payload arbitration_value, adopted_at = clock now"
          - "every filed DiscrepancyProposal on this case projects to VOIDED"
          - "the same levels 2-5 cascade as CONCURRED -> ADOPTED, using the arbitrated value"
          - "increments DiscrepancyCase.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: road-patch-stale-road
    parent_entity: RoadCenterline
    write_endpoint: "PATCH /gis/road-centerlines/{id}"
    occ_field: "expected_road_version"
    description: |
      A centerline edit that carries a road version older than the stored one is rejected. A
      second edit of the same fields would otherwise be accepted on its own merits, so the stale
      version is the only signal that the editor never saw the intervening change (a validate, a
      publish, an adopted discrepancy, or another analyst's range edit) that the new values would
      silently overwrite.
    error_id: ERR_STALE_ROAD_VERSION
    http_status: 412
  - rule_id: cell-assignment-stale-boundary
    parent_entity: EmergencyServiceBoundary
    write_endpoint: "POST /gis/emergency-service-boundaries/{id}/cell-assignments"
    occ_field: "expected_boundary_version"
    description: |
      Adding a cell claim to a boundary whose version has advanced since the client last read it
      is rejected. Claiming the same cell twice with different windows is a legitimate operation
      (the later claim supersedes the earlier one in the agency's intent), so nothing in the state
      machine rejects the second write; the stale version is what tells the server the liaison
      composed the claim against an out-of-date cell set.
    error_id: ERR_STALE_BOUNDARY_VERSION
    http_status: 412
  - rule_id: proposal-create-stale-case
    parent_entity: DiscrepancyCase
    write_endpoint: "POST /gis/discrepancy-cases/{id}/proposals"
    occ_field: "expected_case_version"
    description: |
      Filing a proposal against a case whose version has advanced is rejected. Filing a further
      proposal is itself a legitimate act — each filing supersedes the previous one as the
      current proposal — so the stale version is the only way the server can tell that the
      liaison drafted the counter-offer without seeing the round it is answering.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: normalized_road_name
    applies_to: "RoadCenterline.normalized_name"
    algorithm_type: projection
    trigger: "on RoadCenterline create and whenever primary_name changes"
    formula: |
      1. Uppercase the primary_name.
      2. Delete every character that is not A-Z, 0-9 or a space.
      3. Collapse runs of spaces to a single space and strip leading/trailing spaces.
      4. Split on spaces. If the LAST token is a key of ROAD_TYPE_ABBREVIATIONS, replace it with
         the mapped expansion. Only the last token is expanded; an abbreviation appearing in any
         earlier position (a directional prefix, a name that happens to match) is left alone.
      5. Re-join with single spaces.
    constants:
      ROAD_TYPE_ABBREVIATIONS:
        ST: STREET
        RD: ROAD
        AVE: AVENUE
        DR: DRIVE
        LN: LANE
        HWY: HIGHWAY
        CT: COURT
        BLVD: BOULEVARD
    worked_example: |
      "N. Maple St" -> uppercase "N. MAPLE ST" -> strip punctuation "N MAPLE ST" -> last token ST
      expands -> "N MAPLE STREET". "Oak Ln" and "Oak Lane" both normalize to "OAK LANE", which is
      why they collide in the overlap and duplicate checks. "St Andrews Ct" -> "ST ANDREWS COURT"
      (the leading ST is NOT expanded because it is not the last token).
    precision: "n/a (string result)"

  - name: address_range_overlap_detection
    applies_to: "RoadCenterline validation and QC scanning"
    algorithm_type: interval_merge
    trigger: "POST /gis/road-centerlines/{id}/validate, and during qc_defect_scan"
    formula: |
      A centerline contributes up to two CLOSED integer intervals: left = [from_addr_left,
      to_addr_left] with parity_left, right = [from_addr_right, to_addr_right] with parity_right.
      Two intervals from DIFFERENT centerlines conflict when ALL of:
        (a) same jurisdiction_id,
        (b) same normalized_name,
        (c) same parity value,
        (d) the closed integer intervals intersect: max(from_A, from_B) <= min(to_A, to_B).
      Because both intervals carry the same parity, intervals that touch only across a gap of 1
      (e.g. EVEN [100,198] and EVEN [199,299]) cannot share a number and do NOT conflict; the
      smallest conflicting configuration shares exactly the single endpoint value
      (EVEN [100,198] vs EVEN [198,298] -> 198 is common -> conflict).
      Adjacency with no shared value (EVEN [100,198] vs EVEN [200,298]) is explicitly allowed.
      Left-vs-right intervals of the SAME centerline are never compared with each other.
    constants: {}
    worked_example: |
      R1 "N Maple St" left [100,198] EVEN. Candidate "N. Maple Street" left [150,248] EVEN:
      normalized names match ("N MAPLE STREET"), parity matches, max(100,150)=150 <=
      min(198,248)=198 -> conflict. Candidate left [200,298] EVEN: max=200 > min=198 -> allowed.
    precision: "integer comparison only"

  - name: assignable_slot_count
    applies_to: "RoadCenterline.assignable_slot_count_left / assignable_slot_count_right"
    algorithm_type: aggregation
    trigger: "ROAD_SLOT_REFRESH — road create, road range/parity edit, AddressPoint create, AddressPoint status change"
    formula: |
      For side S in {LEFT, RIGHT}:
        capacity(S) = floor((to_addr_S - from_addr_S) / 2) + 1
        consumed(S) = count of AddressPoint rows where road_centerline_id = this road
                      AND side = S AND unit_id IS NULL AND status IN {PENDING, ACTIVE}
                      AND from_addr_S <= house_number <= to_addr_S
        assignable_slot_count_S = max(0, capacity(S) - consumed(S))
      Subaddress units (unit_id NOT NULL) never consume a slot — they share their parent's
      house_number. RETIRED and VOIDED points release their slot.
    constants: {}
    worked_example: |
      Left range [100,198] EVEN -> capacity = floor(98/2)+1 = 50. One ACTIVE base point at 100
      and one PENDING base point at 102 -> consumed = 2 -> assignable_slot_count_left = 48. Adding
      four units under 100 leaves it at 48. Voiding the 102 point returns it to 49.
    precision: "integer"

  - name: address_point_confidence_score
    applies_to: "AddressPoint.confidence_score (PROVISIONAL) and AddressPoint.certified_confidence_score (CERTIFIED)"
    algorithm_type: weighted_scoring
    variants:
      - name: provisional
        description: |
          Used on AddressPoint create, on activate, and on every CONFIDENCE_REFRESH. Writes
          `confidence_score` and leaves `certified_confidence_score` null with
          confidence_basis = PROVISIONAL.
        formula: |
          raw = BASE_BY_SOURCE[source]
              + (GEOMETRY_VERIFIED_BONUS if geometry_verified else 0)
              + (POSTAL_CITY_MATCH_BONUS if postal_city == jurisdiction.postal_city else 0)
              + (BASE_ADDRESS_BONUS if unit_id IS NULL else 0)
              - ROAD_STATUS_PENALTY[road.status]
          confidence_score = clamp(raw, 0, 100) rounded to 2dp ROUND_HALF_UP
      - name: certified
        description: |
          Computed only inside QcValidationReport GENERATED -> CERTIFIED for in-scope points.
          Writes `certified_confidence_score`, sets confidence_basis = CERTIFIED, and leaves
          `confidence_score` (the provisional number) untouched so the delta stays inspectable.
        formula: |
          raw = <the provisional raw, same terms>
              + FULL_COVERAGE_BONUS   (only when the point's CoverageCell has zero gap pairs at
                                       the logical clock instant, i.e. all three service types
                                       covered; otherwise 0)
              - OPEN_DISCREPANCY_PENALTY (only when road.open_discrepancy_case_count > 0)
          certified_confidence_score = clamp(raw, 0, 100) rounded to 2dp ROUND_HALF_UP
    trigger: "AddressPoint create/activate, CONFIDENCE_REFRESH, QcValidationReport certify"
    constants:
      BASE_BY_SOURCE: { PARCEL: 70, PERMIT: 60, POSTAL: 45, FIELD: 80 }
      GEOMETRY_VERIFIED_BONUS: 12
      POSTAL_CITY_MATCH_BONUS: 8
      BASE_ADDRESS_BONUS: 6
      ROAD_STATUS_PENALTY: { DRAFT: 15, VALIDATED: 5, PUBLISHED: 0 }
      FULL_COVERAGE_BONUS: 10
      OPEN_DISCREPANCY_PENALTY: 20
      SCORE_MIN: 0
      SCORE_MAX: 100
    divergence_note: |
      A PARCEL-sourced, geometry-verified, postal-matching base point on a PUBLISHED road scores
      70+12+8+6-0 = 96.00 provisional. Certified on a fully covered cell it would raise to
      96+10 = 106 -> CLAMPED to 100.00, so the certified variant diverges by +4.00, not +10.00 —
      the clamp is where the two variants stop being a constant offset apart. A FIELD-sourced
      geometry-verified base point on a PUBLISHED road already sits at 80+12+8+6 = 106 -> 100.00
      provisional, and certifies to 100.00 as well (zero delta), while the same point with the
      road under an open discrepancy certifies to clamp(106-20) = 86.00.
    precision: "2 decimal places, ROUND_HALF_UP, clamped to [0, 100] AFTER summation and BEFORE rounding"

  - name: qc_defect_scan
    applies_to: "QcDefect rows created by POST /gis/qc-validation-reports"
    algorithm_type: rule_scan
    trigger: "POST /gis/qc-validation-reports (report generation is the only producer of defects)"
    formula: |
      SCOPE. scope == JURISDICTION covers every RoadCenterline in jurisdiction_id, every
      AddressPoint with status IN {PENDING, ACTIVE} on those centerlines, and every CoverageCell
      of the jurisdiction. scope == ROAD covers the single road_centerline_id and its
      AddressPoints with status IN {PENDING, ACTIVE}, and NO cells at all.
      CONDITIONAL RULE SET. The three BOUNDARY-category rules and ADDRESS_UNCOVERED_CELL are
      evaluated ONLY for scope == JURISDICTION reports — coverage integrity is a jurisdiction-level
      concern and a ROAD-scoped report never emits a BOUNDARY-category or ADDRESS_UNCOVERED_CELL
      defect, so its BOUNDARY category always scores 100. Terminal (RETIRED, VOIDED) address
      points are outside every scope and never produce defects.
      The scan emits ONE QcDefect per offending record per applicable rule:
        ADDRESS_MISSING_GEOMETRY   (BLOCKING, ADDRESS)  geometry_verified == false
        ADDRESS_UNCOVERED_CELL     (BLOCKING, ADDRESS)  JURISDICTION scope only: AddressPoint
                                                        status == ACTIVE whose cell has >= 1 gap
                                                        service type now
        ADDRESS_POSTAL_CITY_MISMATCH (WARNING, ADDRESS)  postal_city != jurisdiction.postal_city
        ADDRESS_UNIT_TYPE_MISSING  (WARNING, ADDRESS)    unit_id IS NOT NULL and unit_type IS NULL
        ADDRESS_LOW_CONFIDENCE     (INFO, ADDRESS)       confidence_score < LOW_CONFIDENCE_CUTOFF
        ROAD_UNVALIDATED           (BLOCKING, ROAD)      road.status == DRAFT
        ROAD_RANGE_OVERLAP         (BLOCKING, ROAD)      road conflicts per
                                                        address_range_overlap_detection with any
                                                        other road in status
                                                        {DRAFT, VALIDATED, PUBLISHED}
        ROAD_NAME_NOT_NORMALIZED   (WARNING, ROAD)       primary_name != normalized_name
        ROAD_QC_DIRTY              (WARNING, ROAD)       road.qc_dirty == true
        ROAD_NO_ADDRESSES          (INFO, ROAD)          road has zero non-terminal AddressPoints
        BOUNDARY_COVERAGE_GAP      (BLOCKING, BOUNDARY)  JURISDICTION scope only: a
                                                        (cell, service_type) pair of the
                                                        jurisdiction is uncovered now — one defect
                                                        per pair, so a jurisdiction holding one
                                                        cell and no active boundaries yields
                                                        exactly three
        PROPOSED_COVERAGE_OVERLAP  (WARNING, BOUNDARY)   JURISDICTION scope only: two
                                                        BoundaryCellAssignment rows on the
                                                        same (cell, service_type) with
                                                        intersecting windows where at least one
                                                        is PENDING (PROPOSED boundaries can
                                                        legally conflict; activation is what
                                                        rejects them)
        BOUNDARY_STALE_WINDOW      (INFO, BOUNDARY)      JURISDICTION scope only: an ACTIVE
                                                        assignment whose effective_end is inside
                                                        [now, now + 30 days)
      Creation order is deterministic: `defect_code ASC, entity_type ASC, subject created_at ASC`.
      Every emitted defect starts with status = OPEN.
    constants:
      LOW_CONFIDENCE_CUTOFF: 70
      BOUNDARY_STALE_WINDOW_DAYS: 30
      SEVERITY_SET: [BLOCKING, WARNING, INFO]
      CATEGORY_SET: [ADDRESS, ROAD, BOUNDARY]
    precision: "integer counts"

  - name: qc_quality_score
    applies_to: "QcValidationReport.quality_score, .advisory_quality_score, .quality_tier"
    algorithm_type: weighted_scoring
    variants:
      - name: strict_certification
        description: |
          Writes `quality_score`. Counts a defect if its status == OPEN; WAIVED defects are
          removed from the deduction base. This is the number the certification threshold and the
          tier are read from.
        formula: |
          For each category C in {ADDRESS, ROAD, BOUNDARY}:
            deduction(C) = sum over OPEN defects d in C of SEVERITY_DEDUCTION[d.severity]
            category_score(C) = max(0, 100 - deduction(C))
            weighted(C) = round(CATEGORY_WEIGHTS[C] * category_score(C), 2)   # per-category round
          quality_score = round(weighted(ADDRESS) + weighted(ROAD) + weighted(BOUNDARY), 2)
      - name: advisory_snapshot
        description: |
          Writes `advisory_quality_score`. Identical arithmetic, but the deduction base is
          restricted to BLOCKING defects only — WARNING and INFO findings are advisory noise that
          the analyst is allowed to publish over — AND waived defects are counted at full weight
          (a waiver is an accepted risk, not a repaired defect, so the advisory view still shows
          it). The two variants therefore move in opposite directions as waivers accumulate.
        formula: |
          deduction(C) = sum over defects d in C with d.severity == BLOCKING
                         (regardless of d.status) of SEVERITY_DEDUCTION[BLOCKING]
          then the same per-category max/round/sum as strict_certification.
    trigger: "report generation, QcDefect waive"
    constants:
      CATEGORY_WEIGHTS: { ADDRESS: 0.45, ROAD: 0.30, BOUNDARY: 0.25 }
      SEVERITY_DEDUCTION: { BLOCKING: 12.5, WARNING: 4.0, INFO: 1.5 }
      QUALITY_TIER_THRESHOLDS: { A: 95, B: 85, C: 70 }
    rounding_order_note: |
      The per-category round-then-sum order is normative and observably different from
      sum-then-round. The divergence appears whenever TWO categories land on a weighted value
      whose third decimal is exactly 5, which happens when the category's deduction is an odd
      multiple of 0.5 (BLOCKING 12.5 and INFO 1.5 each carry a half; WARNING 4.0 does not).
      Worked case — a JURISDICTION-scoped report on one cell with no active boundaries, one DRAFT
      road whose primary_name is not normalized, and one PENDING address point that is neither
      geometry-verified nor postal-matching:
        ADDRESS  1 BLOCKING + 1 WARNING -> deduction 16.5 -> 83.5 -> 0.45*83.5 = 37.575 -> 37.58
        ROAD     1 BLOCKING + 2 WARNING -> deduction 20.5 -> 79.5 -> 0.30*79.5 = 23.850 -> 23.85
        BOUNDARY 3 BLOCKING             -> deduction 37.5 -> 62.5 -> 0.25*62.5 = 15.625 -> 15.63
        quality_score = 37.58 + 23.85 + 15.63 = 77.06
      whereas summing first would give round(37.575 + 23.850 + 15.625, 2) = 77.05.
      The 0.01 difference is the acceptance criterion for this rule. In the same report the
      advisory variant counts only the five BLOCKING defects and rises to 81.26, which is the
      dual-variant divergence.
    tier_formula: |
      quality_tier = A if quality_score >= 95 else B if quality_score >= 85
                     else C if quality_score >= 70 else D
      The tier is read from `quality_score` (the strict variant) only, never from
      `advisory_quality_score`, and it is FROZEN at this base value — see
      provisioning_eligibility_score.
    precision: "2 decimal places, ROUND_HALF_UP, applied once per category and once to the sum"

  - name: provisioning_eligibility_score
    applies_to: "QcValidationReport.provisioning_eligibility_score, .is_provisioning_eligible"
    algorithm_type: threshold
    trigger: "report generation, QcDefect waive"
    formula: |
      base = quality_score (strict variant)
      tier = quality_tier, which is derived from `base` — the tier is pinned to the BASE score and
             is NOT recomputed from the penalised result.
      penalty = waived_blocking_count * WAIVER_PENALTY_BY_TIER[tier]
      provisioning_eligibility_score = round(max(0, base - penalty), 2)
      is_provisioning_eligible = (provisioning_eligibility_score >= PROVISIONING_MIN_SCORE)
                                 AND open_blocking_defect_count == 0
    constants:
      WAIVER_PENALTY_BY_TIER: { A: 1.0, B: 2.5, C: 5.0, D: 8.0 }
      PROVISIONING_MIN_SCORE: 90.00
    pinning_note: |
      Worked example of the pin. A report carries two WARNING and two INFO ADDRESS defects still
      OPEN plus one BLOCKING defect that has been WAIVED:
        ADDRESS deduction (OPEN only) = 2*4.0 + 2*1.5 = 11.0 -> category_score 89
          -> weighted 0.45*89 = 40.05
        ROAD 100 -> 30.00, BOUNDARY 100 -> 25.00
        base = quality_score = 40.05 + 30.00 + 25.00 = 95.05 -> quality_tier = A
        penalty = waived_blocking_count(1) * WAIVER_PENALTY_BY_TIER[A](1.0) = 1.00
        provisioning_eligibility_score = 94.05
      The tier is pinned to the BASE score, so the A-rate penalty applies even though the result
      lands in the B band. Re-deriving the tier from the penalised number (94.05 -> B, rate 2.5)
      would yield 92.55; the 1.50 spread is the acceptance criterion for this rule. Waiving a
      defect always RAISES the strict base (waived defects leave the OPEN deduction base) and then
      lowers the eligibility score by the tier rate — the two movements must not be collapsed.
    boundary_note: |
      PROVISIONING_MIN_SCORE is INCLUSIVE. Worked boundary case on a ROAD-scoped report (so the
      BOUNDARY category scores 100.00): two OPEN WARNING ADDRESS defects, four OPEN INFO ADDRESS
      defects, one OPEN WARNING ROAD defect, and one WAIVED BLOCKING ADDRESS defect ->
      ADDRESS 0.45*(100 - (2*4.0 + 4*1.5)) = 0.45*86 = 38.70, ROAD 0.30*(100-4) = 28.80,
      BOUNDARY 25.00 -> base = 92.50 -> tier B -> penalty 1*2.5 = 2.50 ->
      provisioning_eligibility_score = 90.00, which is EXACTLY the minimum, so
      is_provisioning_eligible = true and the package seals. One additional INFO ADDRESS defect
      (a fifth low-confidence point) drops the base to 91.83 and the eligibility to 89.33 ->
      not eligible.
    precision: "2 decimal places, ROUND_HALF_UP"

  - name: next_house_number_selection
    applies_to: "AddressAssignmentRequest.assigned_house_number"
    algorithm_type: chronological
    trigger: "POST /gis/address-assignment-requests/{id}/assign"
    formula: |
      Let (from, to, parity) be the request side's range on the referenced RoadCenterline.
      candidate_set = every integer n with from <= n <= to (CLOSED, both endpoints included) whose
        parity matches (n % 2 == 0 for EVEN, n % 2 == 1 for ODD)
        AND for which no AddressPoint exists on (road_centerline_id, side) with
        house_number == n, unit_id IS NULL and status IN {PENDING, ACTIVE}.
      If candidate_set is empty -> ERR_NO_ASSIGNABLE_ADDRESS (validations[priority=24]).
      If the request carries proposed_house_number:
        it must be a member of candidate_set, else ERR_HOUSE_NUMBER_UNAVAILABLE
        (validations[priority=23]); when it is a member it is used verbatim.
      Otherwise assigned_house_number = min(candidate_set) — the lowest gap is reused before the
      range is extended, so a retired 102 is handed out again ahead of an untouched 104.
    constants: {}
    worked_example: |
      Left range [100,198] EVEN with ACTIVE base points at 100 and 104: candidate_set starts
      {102, 106, 108, ...}; min = 102. With PENDING points at 100..196 and an ACTIVE point at 198
      the set is empty -> ERR_NO_ASSIGNABLE_ADDRESS. proposed_house_number 198 on an otherwise
      empty range is accepted because the upper bound is inclusive; 200 is not in the range so it
      is not a member -> ERR_HOUSE_NUMBER_UNAVAILABLE.
    precision: "integer"

  - name: coverage_integrity_counters
    applies_to: "Jurisdiction.covered_cell_count / .gap_pair_count / .forward_gap_pair_count, CoverageCell.active_assignment_count, GET /gis/coverage-cells/{id}/coverage-status"
    algorithm_type: forward_looking
    variants:
      - name: instantaneous
        description: |
          Evaluated at the logical clock instant only. Feeds `gap_pair_count`,
          `covered_cell_count`, `active_assignment_count` and the `gap_service_types` /
          `covered_service_types` fields of the coverage-status read.
        formula: |
          A BoundaryCellAssignment covers an instant T when status == ACTIVE and
          effective_start <= T < effective_end (HALF-OPEN; effective_end == null means +infinity).
          For each (cell, service_type) pair: covering = the set of ACTIVE assignments of that
          service_type on that cell covering now.
            len(covering) == 0 -> the pair is a GAP
            len(covering) >= 2 -> the pair is an OVERLAP (only reachable for PENDING rows in
                                 practice, because activation rejects ACTIVE overlaps)
          gap_pair_count = number of GAP pairs across the jurisdiction's cells x 3 service types
          covered_cell_count = number of cells with exactly one covering ACTIVE assignment for
                               ALL THREE service types
          CoverageCell.active_assignment_count = number of ACTIVE assignments on the cell
                               covering now (all service types together)
      - name: forward_window
        description: |
          Evaluated over the horizon [now, now + E911_FORWARD_HORIZON_DAYS). Feeds
          `forward_gap_pair_count`, which is the only counter the DISPATCH_E911 publish gate
          reads. It diverges from the instantaneous view exactly when an assignment is covering
          now but expires inside the horizon, or when the successor assignment starts later than
          its predecessor ends.
        formula: |
          For each (cell, service_type) pair, take the ACTIVE assignments' half-open windows
          clipped to [now, now + 30 days), merge them, and count the pair as a FORWARD GAP when
          the merged union does not cover the whole horizon. Adjacent windows that touch exactly
          (predecessor effective_end == successor effective_start) leave NO gap; a one-second
          separation does.
          forward_gap_pair_count = number of FORWARD GAP pairs.
    trigger: "JURISDICTION_COUNTER_REFRESH; read on GET /gis/coverage-cells/{id}/coverage-status; gate on package publish"
    constants:
      SERVICE_TYPES: [LAW, FIRE, EMS]
      E911_FORWARD_HORIZON_DAYS: 30
    ordering: |
      SERVICE_TYPES is an ORDERED constant. Every service-type array produced by this
      calculation — covered_service_types, gap_service_types,
      proposed_conflict_service_types and forward_gap_service_types on
      GET /gis/coverage-cells/{id}/coverage-status — is emitted by filtering
      [LAW, FIRE, EMS] in that order. Alphabetical order (EMS, FIRE, LAW) and
      assignment-insertion order are both wrong.
    divergence_note: |
      One cell with all three service types covered by open-ended ACTIVE assignments gives
      gap_pair_count = 0 and forward_gap_pair_count = 0. Retire the LAW boundary and both become
      1. Instead give the LAW assignment effective_end = now + 10 days with no successor:
      gap_pair_count stays 0 (it covers this instant) while forward_gap_pair_count becomes 1 —
      the two variants disagree, and only the forward one blocks an E911 publish.
    precision: "integer counts; window comparisons at millisecond resolution"

  - name: package_version_assignment
    applies_to: "ProvisioningPackage.package_version"
    algorithm_type: aggregation
    trigger: "POST /gis/provisioning-packages/{id}/seal"
    formula: |
      package_version = 1 + max(package_version) over ProvisioningPackage rows with the same
      (channel, jurisdiction_id) whose package_version IS NOT NULL, or 1 when there are none.
      INVALIDATED and ROLLED_BACK packages still hold their number, so versions are never reused;
      a DRAFT package has package_version = null and is not counted.
    constants: {}
    worked_example: |
      First DISPATCH_E911 seal for Larimer -> 1. It is invalidated; the next seal -> 2. A MAPPING
      seal for the same jurisdiction is numbered independently -> 1.
    precision: "integer"

  - name: package_record_pin_set
    applies_to: "PackageRecord rows created at seal; ProvisioningPackage.fresh_pin_count / .stale_pin_count / .drift_detected"
    algorithm_type: constraint_propagation
    trigger: "seal (pin creation); every subsequent version bump of a pinned record (PIN_STALENESS_RULE)"
    formula: |
      In-scope record set for a package on jurisdiction J:
        ADDRESS_POINT: every AddressPoint with status == ACTIVE whose road's jurisdiction_id == J
        ROAD_CENTERLINE: every RoadCenterline with status == PUBLISHED and jurisdiction_id == J
        EMERGENCY_SERVICE_BOUNDARY: every EmergencyServiceBoundary with status == ACTIVE
                  holding at least one ACTIVE BoundaryCellAssignment on a cell in J
      One PackageRecord per in-scope record: record_type, record_id, pinned_version = that
      record's `version` at seal time, pin_state = FRESH.
      Freshness rule: a PackageRecord is FRESH while pinned_version == the live record's version;
      the instant the live version advances the record flips to STALE with staled_at = now.
      ProvisioningPackage.fresh_pin_count / stale_pin_count are recounted after every flip and
      drift_detected = (stale_pin_count > 0).
      Records are created ordered by `record_type ASC, record_id ASC`.
    constants:
      RECORD_TYPES: [ADDRESS_POINT, ROAD_CENTERLINE, EMERGENCY_SERVICE_BOUNDARY]
    precision: "integer counts"

  - name: cadence_window_evaluation
    applies_to: "validations[priority=32] on POST /gis/provisioning-packages/{id}/publish"
    algorithm_type: threshold
    trigger: "package publish"
    formula: |
      last = the ProvisioningPackage with the same (channel, jurisdiction_id), status IN
             {PUBLISHED, SUPERSEDED, ROLLED_BACK} and the greatest published_at (tie-break
             created_at ASC). If none exists the window is OPEN.
      elapsed_days = (clock now - last.published_at) expressed in whole and fractional days
      The window is OPEN when elapsed_days >= CHANNEL_CADENCE_DAYS[channel] (INCLUSIVE), else
      ERR_CADENCE_WINDOW_NOT_OPEN.
    constants:
      CHANNEL_CADENCE_DAYS: { DISPATCH_E911: 7, MAPPING: 14, PUBLIC: 30 }
    boundary_note: |
      A DISPATCH_E911 package published at 2026-08-01T00:00:00.000Z reopens its window at exactly
      2026-08-08T00:00:00.000Z (elapsed 7.0 days -> OPEN). At
      2026-08-07T23:59:59.999Z it is still closed.
    precision: "millisecond arithmetic, compared as days"

  - name: discrepancy_proposal_projection
    applies_to: "DiscrepancyProposal.status, DiscrepancyCase.round_count, DiscrepancyCase.current_proposal_id"
    algorithm_type: projection
    trigger: "read of any DiscrepancyProposal; recomputed on every case mutation"
    formula: |
      Proposals are an immutable append-only log. For a proposal P on case C:
        if C.status == ADOPTED and P.id == C.current_proposal_id -> ADOPTED
        elif C.status IN {ESCALATED, ARBITRATED} -> VOIDED
        elif a proposal on C exists with round_number > P.round_number -> COUNTERED
        else -> PENDING
      C.round_count = count of proposals on C; C.current_proposal_id = the proposal with the
      greatest round_number. A filing is refused unless the acting side differs from
      current_proposal.proposed_by_side (the same agency may not counter itself), and the filing
      that would take round_count above MAX_PROPOSAL_ROUNDS is still accepted but drives the case
      to ESCALATED instead of continuing the cycle.
    constants:
      MAX_PROPOSAL_ROUNDS: 3
    worked_example: |
      Rounds 1 (opener), 2 (counterparty), 3 (opener) keep the case cycling
      PROPOSAL_PENDING -> COUNTERED -> PROPOSAL_PENDING. The 4th filing, by the counterparty, is
      recorded as round_number 4 and moves the case to ESCALATED; at that point all four
      proposals project to VOIDED and only arbitration can set resolved_value.
    precision: "integer round numbers"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; first failure returned)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    error_id: ERR_UNAUTHENTICATED
    category: auth
    http_status: 401
    condition: "The X-User-ID header is absent or empty."
    applies_to: "every endpoint"
  - priority: 2
    error_id: ERR_UNAUTHORIZED
    category: auth
    http_status: 403
    condition: "The caller's role is not listed in the endpoint's allowed roles (§1.7)."
    applies_to: "every endpoint"
  - priority: 3
    error_id: ERR_AGENCY_IDENTITY_MISMATCH
    category: auth
    http_status: 403
    condition: |
      An AgencyLiaison acts on a resource bound to a different Agency: X-User-ID != the
      EmergencyServiceBoundary's agency_id (propose / cell-assignments / activate / retire), or
      X-User-ID is neither opened_by_agency_id nor counterparty_agency_id of the DiscrepancyCase
      (proposals / concur), or the boundary/case creation payload names an agency other than the
      caller.
    applies_to: "POST /gis/emergency-service-boundaries, POST /gis/emergency-service-boundaries/{id}/propose, POST /gis/emergency-service-boundaries/{id}/cell-assignments, POST /gis/emergency-service-boundaries/{id}/activate, POST /gis/emergency-service-boundaries/{id}/retire, POST /gis/discrepancy-cases, POST /gis/discrepancy-cases/{id}/proposals, POST /gis/discrepancy-cases/{id}/concur"
  - priority: 4
    error_id: "<ENTITY>_NOT_FOUND (the path entity's own code)"
    category: existence
    http_status: 404
    condition: "A path parameter {id} does not resolve to a stored row of that entity."
    applies_to: "every endpoint with a path parameter"
  - priority: 5
    error_id: "<ENTITY>_NOT_FOUND (the referenced entity's code)"
    category: existence
    http_status: 404
    condition: |
      A foreign-key field in the request body or a query filter does not resolve: jurisdiction_id,
      agency_id, road_centerline_id, cell_id, parent_address_point_id,
      superseded_by_address_point_id, qc_report_id, counterparty_agency_id, proposal_id.
      Polymorphic references (subject_ref_id, entity_ref_id, record_id) are resolved against the
      entity named by the sibling type field and raise that entity's NOT_FOUND code.
    applies_to: "every endpoint accepting a foreign-key field"
  - priority: 6
    error_id: ERR_INVALID_REQUEST
    category: business_constraint
    http_status: 400
    condition: |
      Schema-level failure: a required field is missing or null, a field has the wrong JSON type,
      a string breaks its length bound, an enum value is outside its declared set, an integer is
      negative where non-negative is required, latitude is outside [-90, 90] or longitude outside
      [-180, 180], a datetime is not ISO 8601, `limit` is outside 1..100, `offset` is negative, or
      a mutually-exclusive scope field pair is wrong (scope == JURISDICTION requires
      jurisdiction_id and forbids road_centerline_id; scope == ROAD requires road_centerline_id and
      forbids jurisdiction_id).
    applies_to: "every endpoint accepting a body or query parameters"
  - priority: 7
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    category: state
    http_status: 409
    condition: |
      The target row is not in a state from which the requested transition is defined in §1.2 —
      including a repeat of a transition already performed (idempotency is NOT granted) and any
      action on a terminal state. Codes: ERR_ROAD_INVALID_STATE, ERR_ADDRESS_POINT_INVALID_STATE,
      ERR_BOUNDARY_INVALID_STATE, ERR_REPORT_INVALID_STATE, ERR_DEFECT_INVALID_STATE,
      ERR_PACKAGE_INVALID_STATE, ERR_CASE_INVALID_STATE. For AddressAssignmentRequest the code is
      ERR_REQUEST_NOT_READY when the fulfillment dimension is wrong for the action and
      ERR_REQUEST_INVALID_STATE when the review or utility dimension is.
    applies_to: "every action endpoint"
  - priority: 8
    error_id: "ERR_STALE_<PARENT>_VERSION"
    category: state
    http_status: 412
    condition: |
      The supplied expected_<parent>_version does not equal the stored parent version. Codes:
      ERR_STALE_ROAD_VERSION, ERR_STALE_BOUNDARY_VERSION, ERR_STALE_CASE_VERSION (§1.2.1).
    applies_to: "PATCH /gis/road-centerlines/{id}, POST /gis/emergency-service-boundaries/{id}/cell-assignments, POST /gis/discrepancy-cases/{id}/proposals"
  - priority: 9
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: business_safety
    http_status: 403
    condition: |
      X-User-ID == report.generated_by_user_id on certify, or X-User-ID ==
      report.certified_by_user_id on package publish. One human may not both produce and bless the
      data that routes an emergency call.
    applies_to: "POST /gis/qc-validation-reports/{id}/certify, POST /gis/provisioning-packages/{id}/publish"
  - priority: 10
    error_id: ERR_ROAD_FROZEN_BY_DISCREPANCY
    category: business_safety
    http_status: 409
    condition: |
      The RoadCenterline has open_discrepancy_case_count > 0 and the request would edit, validate,
      publish or retire it, or would activate an AddressPoint on it. A contested centerline is
      frozen until the case is adopted or arbitrated.
    applies_to: "PATCH /gis/road-centerlines/{id}, POST /gis/road-centerlines/{id}/validate, POST /gis/road-centerlines/{id}/publish, POST /gis/road-centerlines/{id}/retire, POST /gis/address-points/{id}/activate"
  - priority: 11
    error_id: ERR_COVERAGE_GAP_BLOCKS_E911
    category: business_safety
    http_status: 409
    condition: |
      Publishing a package whose channel == DISPATCH_E911 while the jurisdiction's
      forward_gap_pair_count > 0 (calculations.coverage_integrity_counters, forward_window
      variant). MAPPING and PUBLIC channels are not gated on coverage.
    applies_to: "POST /gis/provisioning-packages/{id}/publish"
  - priority: 12
    error_id: ERR_SUBADDRESS_PARENT_INVALID
    category: business_referential
    http_status: 422
    condition: |
      Subaddress shape is inconsistent: unit_id is supplied without parent_address_point_id (or
      vice versa); unit_type is supplied without unit_id; the parent has a non-null
      parent_address_point_id (units may not nest); the parent's status is RETIRED or VOIDED; the
      parent's road_centerline_id or side differs from the child's; or the child's house_number
      differs from the parent's.
    applies_to: "POST /gis/address-points"
  - priority: 13
    error_id: ERR_QC_REPORT_NOT_CERTIFIED
    category: business_referential
    http_status: 409
    condition: "Sealing a package whose referenced QcValidationReport.status != CERTIFIED."
    applies_to: "POST /gis/provisioning-packages/{id}/seal"
  - priority: 14
    error_id: ERR_AGENCY_NOT_ACTIVE
    category: business_referential
    http_status: 409
    condition: |
      Activating a boundary whose owning Agency.status == SUSPENDED, or opening a discrepancy case
      whose opened_by or counterparty Agency.status == SUSPENDED.
    applies_to: "POST /gis/emergency-service-boundaries/{id}/activate, POST /gis/discrepancy-cases"
  - priority: 15
    error_id: ERR_COUNTERPARTY_INVALID
    category: business_referential
    http_status: 422
    condition: |
      counterparty_agency_id equals the acting agency, or the counterparty's jurisdiction_id
      differs from the subject record's jurisdiction_id.
    applies_to: "POST /gis/discrepancy-cases"
  - priority: 16
    error_id: ERR_SELF_CONCURRENCE
    category: business_referential
    http_status: 403
    condition: |
      The acting agency's side equals current_proposal.proposed_by_side — on concur (an agency may
      not concur with its own proposal) and on proposals (an agency may not counter itself).
    applies_to: "POST /gis/discrepancy-cases/{id}/concur, POST /gis/discrepancy-cases/{id}/proposals"
  - priority: 17
    error_id: ERR_RANGE_GEOMETRY_INVALID
    category: business_constraint
    http_status: 422
    condition: |
      For either side: from_addr > to_addr, or from_addr / to_addr parity does not match the
      declared parity for that side, or a side supplies only one of its two bounds. Both sides are
      mandatory on create; PATCH is evaluated against the merged result.
    applies_to: "POST /gis/road-centerlines, PATCH /gis/road-centerlines/{id}"
  - priority: 18
    error_id: ERR_ADDRESS_PARITY_MISMATCH
    category: business_constraint
    http_status: 422
    condition: "house_number's parity does not match the referenced road's parity for the given side."
    applies_to: "POST /gis/address-points"
  - priority: 19
    error_id: ERR_ADDRESS_OUTSIDE_RANGE
    category: business_constraint
    http_status: 422
    condition: |
      house_number falls outside the CLOSED interval [from_addr_<side>, to_addr_<side>] of the
      referenced road. Both endpoints are valid addresses.
    applies_to: "POST /gis/address-points"
  - priority: 20
    error_id: "ERR_DUPLICATE_<SUBJECT> (uniqueness family)"
    category: business_constraint
    http_status: 409
    condition: |
      A uniqueness constraint declared in §1.1 is violated. Codes:
        ERR_DUPLICATE_ADDRESS — an AddressPoint already exists with the same
          (road_centerline_id, side, house_number, house_number_suffix, unit_id), treating nulls
          as equal, with status IN {PENDING, ACTIVE}. RETIRED and VOIDED points do NOT block
          reuse, which is what makes historical retention compatible with re-issuing an address.
        ERR_DUPLICATE_JURISDICTION_CODE — Jurisdiction.code is globally unique.
        ERR_DUPLICATE_CELL_CODE — CoverageCell.cell_code is unique within its jurisdiction_id.
        ERR_DUPLICATE_PERMIT_NUMBER — AddressAssignmentRequest.permit_number is globally unique,
          including against voided and rejected requests.
    applies_to: "POST /gis/address-points, POST /gis/jurisdictions, POST /gis/coverage-cells, POST /gis/address-assignment-requests"
  - priority: 21
    error_id: ERR_ROAD_RANGE_OVERLAP
    category: business_constraint
    http_status: 409
    condition: |
      On validate: this centerline conflicts per calculations.address_range_overlap_detection with
      another RoadCenterline whose status IN {VALIDATED, PUBLISHED}. DRAFT peers do not block
      validation (they are caught by the QC scan's ROAD_RANGE_OVERLAP defect instead).
    applies_to: "POST /gis/road-centerlines/{id}/validate"
  - priority: 22
    error_id: ERR_SUBJECT_CASE_ALREADY_OPEN
    category: business_constraint
    http_status: 409
    condition: |
      A DiscrepancyCase already exists on the same (subject_type, subject_ref_id) whose status
      NOT IN {ADOPTED, ARBITRATED}.
    applies_to: "POST /gis/discrepancy-cases"
  - priority: 23
    error_id: ERR_HOUSE_NUMBER_UNAVAILABLE
    category: business_constraint
    http_status: 409
    condition: |
      proposed_house_number is not a member of the candidate set computed by
      calculations.next_house_number_selection (already taken, wrong parity, or out of range).
    applies_to: "POST /gis/address-assignment-requests/{id}/assign"
  - priority: 24
    error_id: ERR_NO_ASSIGNABLE_ADDRESS
    category: business_constraint
    http_status: 409
    condition: "The candidate set for the request's (road, side) is empty — the range is exhausted."
    applies_to: "POST /gis/address-assignment-requests/{id}/assign"
  - priority: 25
    error_id: ERR_QC_BLOCKING_DEFECTS_OPEN
    category: business_constraint
    http_status: 409
    condition: "Certifying a report whose open_blocking_defect_count > 0."
    applies_to: "POST /gis/qc-validation-reports/{id}/certify"
  - priority: 26
    error_id: ERR_PACKAGE_EMPTY
    category: business_constraint
    http_status: 422
    condition: "The in-scope record set at seal time is empty (calculations.package_record_pin_set)."
    applies_to: "POST /gis/provisioning-packages/{id}/seal"
  - priority: 27
    error_id: ERR_PACKAGE_PINS_STALE
    category: business_constraint
    http_status: 409
    condition: "Publishing a package whose stale_pin_count > 0 (drift_detected == true)."
    applies_to: "POST /gis/provisioning-packages/{id}/publish"
  - priority: 28
    error_id: ERR_QC_SCORE_BELOW_THRESHOLD
    category: business_constraint
    http_status: 422
    condition: |
      Sealing a package whose report has is_provisioning_eligible == false — i.e.
      provisioning_eligibility_score < PROVISIONING_MIN_SCORE (90.00, inclusive).
    applies_to: "POST /gis/provisioning-packages/{id}/seal"
  - priority: 29
    error_id: ERR_NO_PUBLISHED_PREDECESSOR
    category: business_constraint
    http_status: 409
    condition: |
      Rolling back a PUBLISHED package for which no SUPERSEDED predecessor exists on the same
      (channel, jurisdiction_id) — there would be nothing left serving dispatch.
    applies_to: "POST /gis/provisioning-packages/{id}/rollback"
  - priority: 30
    error_id: ERR_BOUNDARY_WINDOW_INVALID
    category: business_temporal
    http_status: 422
    condition: |
      effective_end is non-null and effective_end <= effective_start (zero-length and inverted
      windows are rejected), or a cell assignment's window is not contained within its boundary's
      own [effective_start, effective_end) window, or the assigned cell's jurisdiction_id differs
      from the boundary agency's jurisdiction_id.
    applies_to: "POST /gis/emergency-service-boundaries, POST /gis/emergency-service-boundaries/{id}/cell-assignments"
  - priority: 31
    error_id: ERR_COVERAGE_OVERLAP
    category: business_temporal
    http_status: 409
    condition: |
      Activating a boundary would put two ACTIVE BoundaryCellAssignment rows of the same
      service_type on the same cell with intersecting half-open windows. Windows that merely touch
      (predecessor effective_end == successor effective_start) do not intersect and are allowed.
    applies_to: "POST /gis/emergency-service-boundaries/{id}/activate"
  - priority: 32
    error_id: ERR_CADENCE_WINDOW_NOT_OPEN
    category: business_temporal
    http_status: 409
    condition: |
      elapsed_days since the last publication on this (channel, jurisdiction_id) is strictly less
      than CHANNEL_CADENCE_DAYS[channel] (calculations.cadence_window_evaluation).
    applies_to: "POST /gis/provisioning-packages/{id}/publish"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (all paths carry the /gis prefix)
# ---------------------------------------------------------------------------
endpoints:
  # --- Jurisdictions -------------------------------------------------------
  - method: POST
    path: "/gis/jurisdictions"
    description: "Register a jurisdiction (county, municipality or unincorporated area) with its authoritative postal city."
    roles: [SystemAdmin]
    code: 201
    input: [name, code, jurisdiction_type, postal_city]
    output: Jurisdiction
    side_effects:
      - "postal_city stored uppercased"
      - "cell_count, covered_cell_count, gap_pair_count, forward_gap_pair_count initialised to 0"
  - method: GET
    path: "/gis/jurisdictions/{id}"
    description: "Read one jurisdiction including its live coverage counters."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/gis/jurisdictions"
    description: "List jurisdictions."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["jurisdiction_type?", "code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  # --- Agencies ------------------------------------------------------------
  - method: POST
    path: "/gis/agencies"
    description: "Register a responding agency (LAW, FIRE or EMS) inside a jurisdiction."
    roles: [SystemAdmin]
    code: 201
    input: ["name", "agency_type", "jurisdiction_id", "contact_phone?"]
    output: Agency
    side_effects:
      - "status initialised to ACTIVE"
  - method: GET
    path: "/gis/agencies/{id}"
    description: "Read one agency."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/gis/agencies"
    description: "List agencies, filterable by jurisdiction, service type and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["jurisdiction_id?", "agency_type?", "status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []
  - method: POST
    path: "/gis/agencies/{id}/suspend"
    description: "Suspend an agency so it can no longer activate emergency service boundaries or open discrepancy cases."
    roles: [SystemAdmin]
    code: 200
    input: [suspended_reason]
    output: Agency
    side_effects:
      - "status set to SUSPENDED"
      - "increments Agency.version by 1"

  # --- Coverage cells ------------------------------------------------------
  - method: POST
    path: "/gis/coverage-cells"
    description: "Create a coverage cell — the atomic geographic unit that emergency service boundaries claim and that address points are stamped with."
    roles: [SystemAdmin, GisAnalyst]
    code: 201
    input: ["cell_code", "jurisdiction_id", "centroid_lat?", "centroid_lon?"]
    output: CoverageCell
    side_effects:
      - "active_assignment_count initialised to 0"
      - "JURISDICTION_COUNTER_REFRESH (cell_count and the gap counters rise)"
  - method: GET
    path: "/gis/coverage-cells/{id}"
    description: "Read one coverage cell."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: CoverageCell
    side_effects: []
  - method: GET
    path: "/gis/coverage-cells"
    description: "List coverage cells, filterable by jurisdiction."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["jurisdiction_id?", "cell_code?", "limit?", "offset?"]
    output: CoverageCell[]
    side_effects: []
  - method: GET
    path: "/gis/coverage-cells/{id}/coverage-status"
    description: "Computed read: which service types are covered, in gap, or in proposed conflict for this cell at the logical clock instant, plus the assignments responding now (calculations.coverage_integrity_counters, instantaneous variant). Every service-type array in the response is emitted in the fixed order LAW, FIRE, EMS — never insertion or alphabetical order."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: "{ cell_id: string, evaluated_at: datetime, covered_service_types: string[], gap_service_types: string[], proposed_conflict_service_types: string[], responding_assignment_count: integer, forward_gap_service_types: string[] }"
    side_effects: []

  # --- Road centerlines ----------------------------------------------------
  - method: POST
    path: "/gis/road-centerlines"
    description: "Create a road centerline in DRAFT with its left and right address ranges and parities."
    roles: [GisAnalyst]
    code: 201
    input: [primary_name, jurisdiction_id, from_addr_left, to_addr_left, parity_left, from_addr_right, to_addr_right, parity_right]
    output: RoadCenterline
    side_effects:
      - "normalized_name computed (calculations.normalized_road_name)"
      - "status DRAFT, qc_dirty true, open_discrepancy_case_count 0"
      - "ROAD_SLOT_REFRESH sets assignable_slot_count_left/right to full capacity"
  - method: GET
    path: "/gis/road-centerlines/{id}"
    description: "Read one centerline."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: RoadCenterline
    side_effects: []
  - method: GET
    path: "/gis/road-centerlines"
    description: "List centerlines, filterable by jurisdiction, normalized name and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["jurisdiction_id?", "normalized_name?", "status?", "limit?", "offset?"]
    output: RoadCenterline[]
    side_effects: []
  - method: PATCH
    path: "/gis/road-centerlines/{id}"
    description: "Edit a DRAFT or VALIDATED centerline's name and/or ranges under optimistic concurrency; a VALIDATED road is demoted to DRAFT."
    roles: [GisAnalyst]
    code: 200
    input: ["expected_road_version", "primary_name?", "from_addr_left?", "to_addr_left?", "parity_left?", "from_addr_right?", "to_addr_right?", "parity_right?"]
    output: RoadCenterline
    side_effects:
      - "normalized_name recomputed when primary_name changes"
      - "qc_dirty set true; VALIDATED -> DRAFT demotion"
      - "ROAD_SLOT_REFRESH; CONFIDENCE_REFRESH"
      - "increments RoadCenterline.version by 1"
      - "PIN_STALENESS_RULE"
  - method: POST
    path: "/gis/road-centerlines/{id}/validate"
    description: "Validate a DRAFT centerline against its address points and against overlapping ranges on same-named peers."
    roles: [GisAnalyst]
    code: 200
    input: []
    output: RoadCenterline
    side_effects:
      - "status DRAFT -> VALIDATED; qc_dirty set false"
      - "CONFIDENCE_REFRESH (road penalty 15 -> 5)"
      - "increments RoadCenterline.version by 1"
      - "PIN_STALENESS_RULE"
  - method: POST
    path: "/gis/road-centerlines/{id}/publish"
    description: "Publish a VALIDATED centerline so it becomes eligible for provisioning packages."
    roles: [QcCertifier]
    code: 200
    input: []
    output: RoadCenterline
    side_effects:
      - "status VALIDATED -> PUBLISHED"
      - "CONFIDENCE_REFRESH (road penalty 5 -> 0)"
      - "increments RoadCenterline.version by 1"
      - "PIN_STALENESS_RULE"
  - method: POST
    path: "/gis/road-centerlines/{id}/retire"
    description: "Retire a centerline; drives the five-level retirement cascade through address points, subaddress units, package pins and sealed packages."
    roles: [GisAnalyst]
    code: 200
    input: [retire_reason]
    output: RoadCenterline
    side_effects:
      - "status -> RETIRED; retired_at set"
      - "cascade: base AddressPoints -> RETIRED (ROAD_RETIRED), then their subaddress units -> RETIRED (PARENT_RETIRED), then pinning PackageRecords -> STALE, then SEALED packages -> INVALIDATED (PIN_STALE)"
      - "increments RoadCenterline.version by 1"

  # --- Address points ------------------------------------------------------
  - method: POST
    path: "/gis/address-points"
    description: "Create an address point (base address or subaddress unit) in PENDING from a parcel, permit, postal or field source."
    roles: [GisAnalyst]
    code: 201
    input: ["house_number", "road_centerline_id", "side", "source", "postal_city", "cell_id", "house_number_suffix?", "unit_type?", "unit_id?", "parent_address_point_id?", "geometry_verified?", "latitude?", "longitude?"]
    output: AddressPoint
    side_effects:
      - "jurisdiction_id copied from the centerline"
      - "status PENDING; confidence_score computed (PROVISIONAL variant); confidence_basis PROVISIONAL"
      - "geometry_verified defaults to false"
      - "parent's unit_child_count incremented when unit_id is supplied"
      - "ROAD_SLOT_REFRESH"
  - method: GET
    path: "/gis/address-points/{id}"
    description: "Read one address point including both confidence scores."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: AddressPoint
    side_effects: []
  - method: GET
    path: "/gis/address-points"
    description: "List address points. RETIRED and VOIDED points are excluded unless include_retired=true, which is how records research reaches historical addresses."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["road_centerline_id?", "parent_address_point_id?", "superseded_by_address_point_id?", "cell_id?", "jurisdiction_id?", "status?", "side?", "include_retired?", "limit?", "offset?"]
    output: AddressPoint[]
    side_effects: []
  - method: POST
    path: "/gis/address-points/{id}/activate"
    description: "Activate a PENDING address point once its centerline is validated or published."
    roles: [GisAnalyst]
    code: 200
    input: []
    output: AddressPoint
    side_effects:
      - "status PENDING -> ACTIVE"
      - "confidence_score recomputed"
      - "increments AddressPoint.version by 1"
      - "PIN_STALENESS_RULE"
  - method: POST
    path: "/gis/address-points/{id}/retire"
    description: "Retire an address point, optionally recording its successor for records research; subaddress units cascade."
    roles: [GisAnalyst]
    code: 200
    input: ["retire_reason", "superseded_by_address_point_id?"]
    output: AddressPoint
    side_effects:
      - "status -> RETIRED; retired_at set; retire_reason REPLACED when a successor is supplied"
      - "child units with status IN {PENDING, ACTIVE} -> RETIRED (PARENT_RETIRED)"
      - "ROAD_SLOT_REFRESH releases the slot"
      - "increments AddressPoint.version by 1"
      - "PIN_STALENESS_RULE"

  # --- Address assignment requests -----------------------------------------
  - method: POST
    path: "/gis/address-assignment-requests"
    description: "Open an address assignment request for new construction, keyed by permit number."
    roles: [PermitCoordinator]
    code: 201
    input: ["permit_number", "parcel_id", "road_centerline_id", "side", "requested_unit_count?", "proposed_house_number?"]
    output: AddressAssignmentRequest
    side_effects:
      - "review_status PENDING_REVIEW, utility_status PENDING_UTILITY, fulfillment_status OPEN"
      - "requested_unit_count defaults to 0"
  - method: GET
    path: "/gis/address-assignment-requests/{id}"
    description: "Read one assignment request with all three state dimensions."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: AddressAssignmentRequest
    side_effects: []
  - method: GET
    path: "/gis/address-assignment-requests"
    description: "List assignment requests, filterable on each state dimension and on the minted address point."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["road_centerline_id?", "assigned_address_point_id?", "review_status?", "utility_status?", "fulfillment_status?", "permit_number?", "limit?", "offset?"]
    output: AddressAssignmentRequest[]
    side_effects: []
  - method: POST
    path: "/gis/address-assignment-requests/{id}/gis-review"
    description: "Record the GIS review decision on the review dimension."
    roles: [GisAnalyst]
    code: 200
    input: ["decision", "review_note?"]
    output: AddressAssignmentRequest
    side_effects:
      - "review_status -> GIS_APPROVED or GIS_REJECTED"
      - "fulfillment_status recomputed (READY_TO_ASSIGN when utility already cleared; CLOSED_REJECTED on rejection)"
      - "increments AddressAssignmentRequest.version by 1"
  - method: POST
    path: "/gis/address-assignment-requests/{id}/utility-clearance"
    description: "Record or revise the utility coordination decision on the utility dimension; holds may be lifted and clearances re-held."
    roles: [PermitCoordinator]
    code: 200
    input: ["decision", "utility_note?"]
    output: AddressAssignmentRequest
    side_effects:
      - "utility_status -> UTILITY_CLEARED or UTILITY_HELD"
      - "fulfillment_status recomputed (promotes to READY_TO_ASSIGN, or demotes back to OPEN)"
      - "increments AddressAssignmentRequest.version by 1"
  - method: POST
    path: "/gis/address-assignment-requests/{id}/assign"
    description: "Mint the address for a READY_TO_ASSIGN request: one base address point plus one point per requested unit."
    roles: [GisAnalyst]
    code: 200
    input: []
    output: AddressAssignmentRequest
    side_effects:
      - "assigned_house_number selected (calculations.next_house_number_selection)"
      - "creates 1 base AddressPoint (PENDING, source PERMIT, geometry_verified false, postal_city from the jurisdiction, cell_id = the jurisdiction's lowest cell_code CoverageCell) plus requested_unit_count unit points (unit_type UNIT, unit_id '1'..'N')"
      - "sets assigned_address_point_id and minted_point_count; fulfillment_status -> FULFILLED"
      - "ROAD_SLOT_REFRESH"
      - "increments AddressAssignmentRequest.version by 1"
  - method: POST
    path: "/gis/address-assignment-requests/{id}/void"
    description: "Void a request; if it was already fulfilled the minted points are voided and the consumed address slot is restored exactly."
    roles: [PermitCoordinator]
    code: 200
    input: [void_reason]
    output: AddressAssignmentRequest
    side_effects:
      - "fulfillment_status -> VOIDED"
      - "every minted AddressPoint -> VOIDED (REQUEST_VOIDED)"
      - "ROAD_SLOT_REFRESH restores assignable_slot_count_<side> to its pre-assign value"
      - "increments AddressAssignmentRequest.version by 1"
      - "PIN_STALENESS_RULE"

  # --- Emergency service boundaries ----------------------------------------
  - method: POST
    path: "/gis/emergency-service-boundaries"
    description: "Create a DRAFT emergency service boundary for the acting agency over a half-open effective window."
    roles: [AgencyLiaison]
    code: 201
    input: ["agency_id", "effective_start", "effective_end?"]
    output: EmergencyServiceBoundary
    side_effects:
      - "service_type copied from the agency's agency_type"
      - "status DRAFT; assigned_cell_count 0"
      - "effective_end null means open-ended"
  - method: GET
    path: "/gis/emergency-service-boundaries/{id}"
    description: "Read one emergency service boundary."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: EmergencyServiceBoundary
    side_effects: []
  - method: GET
    path: "/gis/emergency-service-boundaries"
    description: "List emergency service boundaries, filterable by agency, service type and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["agency_id?", "service_type?", "status?", "limit?", "offset?"]
    output: EmergencyServiceBoundary[]
    side_effects: []
  - method: POST
    path: "/gis/emergency-service-boundaries/{id}/cell-assignments"
    description: "Claim a coverage cell for a DRAFT boundary under optimistic concurrency on the boundary version."
    roles: [AgencyLiaison]
    code: 201
    input: ["cell_id", "effective_start", "expected_boundary_version", "effective_end?"]
    output: BoundaryCellAssignment
    side_effects:
      - "creates a PENDING BoundaryCellAssignment with service_type copied from the boundary"
      - "boundary.assigned_cell_count incremented"
      - "increments EmergencyServiceBoundary.version by 1"
  - method: GET
    path: "/gis/emergency-service-boundaries/{id}/cell-assignments"
    description: "List the cell claims held by one boundary."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BoundaryCellAssignment[]
    side_effects: []
  - method: POST
    path: "/gis/emergency-service-boundaries/{id}/propose"
    description: "Move a DRAFT boundary with at least one cell claim to PROPOSED, freezing its cell set."
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: EmergencyServiceBoundary
    side_effects:
      - "status DRAFT -> PROPOSED"
      - "increments EmergencyServiceBoundary.version by 1"
  - method: POST
    path: "/gis/emergency-service-boundaries/{id}/activate"
    description: "Activate a PROPOSED boundary; rejected when it would double-cover any (cell, service_type) window."
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: EmergencyServiceBoundary
    side_effects:
      - "status PROPOSED -> ACTIVE; every cell assignment PENDING -> ACTIVE"
      - "JURISDICTION_COUNTER_REFRESH"
      - "increments EmergencyServiceBoundary.version by 1"
  - method: POST
    path: "/gis/emergency-service-boundaries/{id}/retire"
    description: "Retire a boundary; its cell claims retire with it and the jurisdiction's coverage counters return to their pre-activation values."
    roles: [AgencyLiaison]
    code: 200
    input: [retire_reason]
    output: EmergencyServiceBoundary
    side_effects:
      - "status -> RETIRED; retired_at set; every cell assignment -> RETIRED"
      - "JURISDICTION_COUNTER_REFRESH"
      - "increments EmergencyServiceBoundary.version by 1"
      - "PIN_STALENESS_RULE"
  - method: GET
    path: "/gis/boundary-cell-assignments/{id}"
    description: "Read one boundary cell assignment."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: BoundaryCellAssignment
    side_effects: []
  - method: GET
    path: "/gis/boundary-cell-assignments"
    description: "List boundary cell assignments, filterable by boundary, cell and status — the query behind overlap and gap analysis."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["boundary_id?", "cell_id?", "service_type?", "status?", "limit?", "offset?"]
    output: BoundaryCellAssignment[]
    side_effects: []

  # --- QC validation reports and defects ------------------------------------
  - method: POST
    path: "/gis/qc-validation-reports"
    description: "Run the QC scan over a jurisdiction or a single centerline and emit a GENERATED report with its defects and scores."
    roles: [GisAnalyst]
    code: 201
    input: ["scope", "jurisdiction_id?", "road_centerline_id?"]
    output: QcValidationReport
    side_effects:
      - "creates QcDefect rows (calculations.qc_defect_scan) in defect_code ASC, entity_type ASC, subject created_at ASC order"
      - "sets defect_count, blocking/warning/info counts, open_blocking_defect_count, waived_blocking_count = 0"
      - "computes quality_score, advisory_quality_score, quality_tier, provisioning_eligibility_score, is_provisioning_eligible"
      - "generated_by_user_id set to X-User-ID"
  - method: GET
    path: "/gis/qc-validation-reports/{id}"
    description: "Read one QC report with both score variants and the eligibility verdict."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: QcValidationReport
    side_effects: []
  - method: GET
    path: "/gis/qc-validation-reports"
    description: "List QC reports, filterable by scope target and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["jurisdiction_id?", "road_centerline_id?", "scope?", "status?", "limit?", "offset?"]
    output: QcValidationReport[]
    side_effects: []
  - method: GET
    path: "/gis/qc-validation-reports/{id}/defects"
    description: "List the defects emitted by one QC report — the only discovery channel for cascade-created defect rows."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["severity?", "defect_category?", "defect_code?", "status?", "limit?", "offset?"]
    output: QcDefect[]
    side_effects: []
  - method: GET
    path: "/gis/qc-defects/{id}"
    description: "Read one QC defect."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: QcDefect
    side_effects: []
  - method: POST
    path: "/gis/qc-defects/{id}/waive"
    description: "Waive an OPEN defect on a GENERATED report, accepting the risk and re-scoring the report."
    roles: [QcCertifier]
    code: 200
    input: [waiver_reason]
    output: QcDefect
    side_effects:
      - "status OPEN -> WAIVED; waived_by_user_id, waived_at set"
      - "report recomputes open_blocking_defect_count, waived_blocking_count, quality_score, advisory_quality_score, quality_tier, provisioning_eligibility_score, is_provisioning_eligible"
      - "increments QcDefect.version by 1 and QcValidationReport.version by 1"
  - method: POST
    path: "/gis/qc-validation-reports/{id}/certify"
    description: "Certify a GENERATED report with no open blocking defects; certification stamps certified confidence scores onto the in-scope address points."
    roles: [QcCertifier]
    code: 200
    input: []
    output: QcValidationReport
    side_effects:
      - "status GENERATED -> CERTIFIED; certified_by_user_id, certified_at set"
      - "in-scope AddressPoints get certified_confidence_score (CERTIFIED variant) and confidence_basis CERTIFIED"
      - "increments QcValidationReport.version by 1 and each stamped AddressPoint.version by 1"
      - "PIN_STALENESS_RULE"
  - method: POST
    path: "/gis/qc-validation-reports/{id}/reject"
    description: "Reject a GENERATED report; rejection is terminal and a fresh scan must be run after the data is fixed."
    roles: [QcCertifier]
    code: 200
    input: [rejection_reason]
    output: QcValidationReport
    side_effects:
      - "status GENERATED -> REJECTED"
      - "increments QcValidationReport.version by 1"

  # --- Provisioning packages ------------------------------------------------
  - method: POST
    path: "/gis/provisioning-packages"
    description: "Open a DRAFT provisioning package for one channel, jurisdiction and certified QC report."
    roles: [ProvisioningOfficer]
    code: 201
    input: [channel, jurisdiction_id, qc_report_id]
    output: ProvisioningPackage
    side_effects:
      - "status DRAFT; package_version null; all pin counters 0; drift_detected false"
  - method: GET
    path: "/gis/provisioning-packages/{id}"
    description: "Read one provisioning package with its pin freshness counters."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: ProvisioningPackage
    side_effects: []
  - method: GET
    path: "/gis/provisioning-packages"
    description: "List provisioning packages, filterable by channel, jurisdiction, source report and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["channel?", "jurisdiction_id?", "qc_report_id?", "status?", "limit?", "offset?"]
    output: ProvisioningPackage[]
    side_effects: []
  - method: GET
    path: "/gis/provisioning-packages/{id}/records"
    description: "List the version-pinned records captured in a sealed package — the only discovery channel for PackageRecord rows."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["record_type?", "pin_state?", "limit?", "offset?"]
    output: PackageRecord[]
    side_effects: []
  - method: POST
    path: "/gis/provisioning-packages/{id}/seal"
    description: "Seal a DRAFT package: assign its channel-scoped version number and pin every in-scope record at its current version."
    roles: [ProvisioningOfficer]
    code: 200
    input: []
    output: ProvisioningPackage
    side_effects:
      - "status DRAFT -> SEALED; package_version assigned (calculations.package_version_assignment)"
      - "creates PackageRecord pins (calculations.package_record_pin_set) with pin_state FRESH"
      - "sets record_count, pinned_record_count, fresh_pin_count, sealed_at, sealed_by_user_id"
      - "increments ProvisioningPackage.version by 1"
  - method: POST
    path: "/gis/provisioning-packages/{id}/publish"
    description: "Publish a SEALED package to its channel, superseding the channel's previous publication; gated on pin freshness, the cadence window, segregation of duties and (for DISPATCH_E911) forward coverage."
    roles: [ProvisioningOfficer]
    code: 200
    input: []
    output: ProvisioningPackage
    side_effects:
      - "status SEALED -> PUBLISHED; published_at, published_by_user_id set"
      - "the previous PUBLISHED package on the same (channel, jurisdiction_id) -> SUPERSEDED"
      - "increments ProvisioningPackage.version by 1"
  - method: POST
    path: "/gis/provisioning-packages/{id}/rollback"
    description: "Roll a PUBLISHED package back, restoring the highest-versioned superseded predecessor so exactly one package remains published per channel."
    roles: [ProvisioningOfficer]
    code: 200
    input: [rollback_reason]
    output: ProvisioningPackage
    side_effects:
      - "status PUBLISHED -> ROLLED_BACK; rollback_reason set"
      - "the highest-versioned SUPERSEDED predecessor -> PUBLISHED with its original published_at preserved"
      - "increments ProvisioningPackage.version by 1"

  # --- Discrepancy cases and proposals --------------------------------------
  - method: POST
    path: "/gis/discrepancy-cases"
    description: "Open a discrepancy case against a road name, address range or service boundary held by another agency."
    roles: [AgencyLiaison]
    code: 201
    input: [subject_type, subject_ref_id, counterparty_agency_id, description]
    output: DiscrepancyCase
    side_effects:
      - "opened_by_agency_id set to X-User-ID; jurisdiction_id copied from the subject record"
      - "status OPEN; round_count 0; current_proposal_id null"
      - "when subject_type IN {ROAD_NAME, ADDRESS_RANGE}: the subject RoadCenterline's open_discrepancy_case_count is incremented, which freezes it"
  - method: GET
    path: "/gis/discrepancy-cases/{id}"
    description: "Read one discrepancy case."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: []
    output: DiscrepancyCase
    side_effects: []
  - method: GET
    path: "/gis/discrepancy-cases"
    description: "List discrepancy cases, filterable by either party, jurisdiction, subject, current proposal and status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["opened_by_agency_id?", "counterparty_agency_id?", "jurisdiction_id?", "current_proposal_id?", "subject_type?", "subject_ref_id?", "status?", "limit?", "offset?"]
    output: DiscrepancyCase[]
    side_effects: []
  - method: POST
    path: "/gis/discrepancy-cases/{id}/proposals"
    description: "File a proposal (or counter-proposal) on a case under optimistic concurrency on the case version; the filing past the round limit escalates the case."
    roles: [AgencyLiaison]
    code: 201
    input: ["proposed_value", "expected_case_version", "rationale?"]
    output: DiscrepancyProposal
    side_effects:
      - "appends an immutable DiscrepancyProposal with round_number = round_count + 1 and proposed_by_side derived from X-User-ID"
      - "case round_count and current_proposal_id updated; status cycles PROPOSAL_PENDING <-> COUNTERED, or moves to ESCALATED past MAX_PROPOSAL_ROUNDS"
      - "increments DiscrepancyCase.version by 1"
  - method: GET
    path: "/gis/discrepancy-cases/{id}/proposals"
    description: "List the append-only proposal log of one case with each proposal's projected status."
    roles: [SystemAdmin, GisAnalyst, QcCertifier, ProvisioningOfficer, PermitCoordinator, AgencyLiaison]
    code: 200
    input: ["proposed_by_side?", "status?", "limit?", "offset?"]
    output: DiscrepancyProposal[]
    side_effects: []
  - method: POST
    path: "/gis/discrepancy-cases/{id}/concur"
    description: "Concur with the current proposal; only the side that did not author it may concur."
    roles: [AgencyLiaison]
    code: 200
    input: [proposal_id]
    output: DiscrepancyCase
    side_effects:
      - "status -> CONCURRED; concurred_by_side set"
      - "increments DiscrepancyCase.version by 1"
  - method: POST
    path: "/gis/discrepancy-cases/{id}/adopt"
    description: "Adopt a concurred resolution into the authoritative data; drives the five-level adoption cascade through the centerline, its address points, certified QC reports and their packages."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: DiscrepancyCase
    side_effects:
      - "status CONCURRED -> ADOPTED; resolved_value copied from the current proposal; adopted_at set"
      - "the subject RoadCenterline is rewritten, re-normalized, marked qc_dirty and demoted PUBLISHED -> VALIDATED; its open_discrepancy_case_count returns to 0"
      - "its non-terminal AddressPoints lose certified confidence (basis PROVISIONAL, certified_confidence_score null, confidence_score recomputed)"
      - "CERTIFIED QcValidationReports covering those points -> DECERTIFIED (SUBJECT_RECORD_CHANGED)"
      - "DRAFT and SEALED ProvisioningPackages on those reports -> INVALIDATED (REPORT_DECERTIFIED)"
      - "increments DiscrepancyCase.version by 1"
  - method: POST
    path: "/gis/discrepancy-cases/{id}/arbitrate"
    description: "Arbitrate an ESCALATED case with a value of the arbitrator's choosing, voiding every filed proposal and running the same adoption cascade."
    roles: [SystemAdmin]
    code: 200
    input: ["arbitration_value", "rationale?"]
    output: DiscrepancyCase
    side_effects:
      - "status ESCALATED -> ARBITRATED; resolved_value = arbitration_value; adopted_at set"
      - "every filed proposal projects to VOIDED"
      - "the same centerline / address point / report / package cascade as adopt"
      - "increments DiscrepancyCase.version by 1"

  # --- Test-driving endpoint (logical clock) --------------------------------
  - method: POST
    path: "/gis/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, cadence and horizon rule reads. The startup default is exactly 2026-08-01T00:00:00Z and the server never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "all subsequent temporal evaluations (coverage windows, forward horizon, cadence windows, staleness horizons) use the new instant"
      - "no stored entity is mutated and no counter is recomputed by this call alone"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty on any endpoint."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not among the endpoint's declared roles."
  - id: ERR_AGENCY_IDENTITY_MISMATCH
    http: 403
    condition: "An AgencyLiaison acts on a boundary or case that does not belong to the agency in X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The report's generator tries to certify it, or the report's certifier tries to publish a package built on it."
  - id: ERR_SELF_CONCURRENCE
    http: 403
    condition: "An agency tries to concur with, or counter, its own current proposal."
  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, out-of-range enum or number, malformed datetime, bad pagination parameter, or an inconsistent scope field pair."
  # --- not found -----------------------------------------------------------
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction_id in a path, body or filter does not resolve."
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "agency_id, opened_by_agency_id or counterparty_agency_id does not resolve."
  - id: ERR_COVERAGE_CELL_NOT_FOUND
    http: 404
    condition: "cell_id in a path, body or filter does not resolve."
  - id: ERR_ROAD_NOT_FOUND
    http: 404
    condition: "road_centerline_id in a path, body or filter does not resolve, including a ROAD-scoped report or a ROAD_NAME/ADDRESS_RANGE case subject."
  - id: ERR_ADDRESS_POINT_NOT_FOUND
    http: 404
    condition: "An address point id in a path, parent_address_point_id or superseded_by_address_point_id does not resolve."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "An address assignment request id in a path does not resolve."
  - id: ERR_BOUNDARY_NOT_FOUND
    http: 404
    condition: "An emergency service boundary id in a path or a BOUNDARY case subject does not resolve."
  - id: ERR_CELL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "A boundary cell assignment id in a path or boundary_id filter target does not resolve."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "A QC validation report id in a path or qc_report_id does not resolve."
  - id: ERR_DEFECT_NOT_FOUND
    http: 404
    condition: "A QC defect id in a path does not resolve."
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "A provisioning package id in a path does not resolve."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "A discrepancy case id in a path does not resolve."
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "proposal_id supplied to concur does not resolve to a proposal."
  # --- state ---------------------------------------------------------------
  - id: ERR_ROAD_INVALID_STATE
    http: 409
    condition: "The centerline is not in a state from which the requested transition is defined (e.g. validating a PUBLISHED road, patching a PUBLISHED road, any action on a RETIRED road, validating twice) — and also when an address point is activated while its centerline is still DRAFT or already RETIRED, since the blocking state belongs to the road."
  - id: ERR_ADDRESS_POINT_INVALID_STATE
    http: 409
    condition: "Activating a point that is not PENDING, or retiring a RETIRED or VOIDED point."
  - id: ERR_REQUEST_INVALID_STATE
    http: 409
    condition: "The review or utility dimension is wrong for the action — reviewing an already-reviewed request, or clearing/holding utilities on a closed request."
  - id: ERR_REQUEST_NOT_READY
    http: 409
    condition: "Assigning a request whose fulfillment_status is not READY_TO_ASSIGN (review not approved, utility not cleared, or already fulfilled)."
  - id: ERR_BOUNDARY_INVALID_STATE
    http: 409
    condition: "Proposing a non-DRAFT boundary, adding a cell claim to a boundary that has left DRAFT, activating a boundary that is not PROPOSED, or acting on a RETIRED boundary."
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "Certifying or rejecting a report that is not GENERATED, or certifying an already CERTIFIED / DECERTIFIED report."
  - id: ERR_DEFECT_INVALID_STATE
    http: 409
    condition: "Waiving a defect that is already WAIVED, or waiving any defect on a report that has left GENERATED."
  - id: ERR_PACKAGE_INVALID_STATE
    http: 409
    condition: "Sealing a non-DRAFT package, publishing a non-SEALED package, or rolling back a package that is not PUBLISHED (including INVALIDATED and ROLLED_BACK packages)."
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "Filing a proposal on a resolved case, concurring when there is no current proposal, adopting a case that is not CONCURRED, or arbitrating a case that is not ESCALATED."
  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_ROAD_VERSION
    http: 412
    condition: "expected_road_version does not match the stored RoadCenterline.version."
  - id: ERR_STALE_BOUNDARY_VERSION
    http: 412
    condition: "expected_boundary_version does not match the stored EmergencyServiceBoundary.version."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match the stored DiscrepancyCase.version."
  # --- business ------------------------------------------------------------
  - id: ERR_ROAD_FROZEN_BY_DISCREPANCY
    http: 409
    condition: "The centerline has an unresolved discrepancy case, so it cannot be edited, validated, published or retired, and its address points cannot be activated."
  - id: ERR_COVERAGE_GAP_BLOCKS_E911
    http: 409
    condition: "Publishing a DISPATCH_E911 package while the jurisdiction has at least one forward coverage gap pair inside the 30-day horizon."
  - id: ERR_SUBADDRESS_PARENT_INVALID
    http: 422
    condition: "Subaddress shape is inconsistent — partial unit fields, nested units, a terminal parent, or a parent on a different road, side or house number."
  - id: ERR_QC_REPORT_NOT_CERTIFIED
    http: 409
    condition: "Sealing a package whose QC report is not CERTIFIED."
  - id: ERR_AGENCY_NOT_ACTIVE
    http: 409
    condition: "A SUSPENDED agency tries to activate a boundary or is named in a new discrepancy case."
  - id: ERR_COUNTERPARTY_INVALID
    http: 422
    condition: "The counterparty agency is the acting agency itself, or sits in a different jurisdiction from the subject record."
  - id: ERR_RANGE_GEOMETRY_INVALID
    http: 422
    condition: "from_addr > to_addr on a side, a bound's parity contradicts the declared parity, or only one bound of a side is supplied."
  - id: ERR_ADDRESS_PARITY_MISMATCH
    http: 422
    condition: "The house number's parity does not match the road's parity for that side."
  - id: ERR_ADDRESS_OUTSIDE_RANGE
    http: 422
    condition: "The house number falls outside the side's closed address range."
  - id: ERR_DUPLICATE_ADDRESS
    http: 409
    condition: "A non-terminal address point already occupies the same road, side, house number, suffix and unit id."
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "Jurisdiction.code already exists."
  - id: ERR_DUPLICATE_CELL_CODE
    http: 409
    condition: "CoverageCell.cell_code already exists inside the same jurisdiction."
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "AddressAssignmentRequest.permit_number already exists."
  - id: ERR_ROAD_RANGE_OVERLAP
    http: 409
    condition: "Validating a centerline whose same-parity closed address range intersects a same-named VALIDATED or PUBLISHED centerline in the same jurisdiction."
  - id: ERR_SUBJECT_CASE_ALREADY_OPEN
    http: 409
    condition: "An unresolved discrepancy case already exists on the same subject."
  - id: ERR_HOUSE_NUMBER_UNAVAILABLE
    http: 409
    condition: "proposed_house_number is taken, of the wrong parity, or outside the side's range."
  - id: ERR_NO_ASSIGNABLE_ADDRESS
    http: 409
    condition: "The candidate house-number set for the request's road and side is empty."
  - id: ERR_QC_BLOCKING_DEFECTS_OPEN
    http: 409
    condition: "Certifying a report that still has open blocking defects."
  - id: ERR_PACKAGE_EMPTY
    http: 422
    condition: "Sealing a package whose in-scope record set is empty."
  - id: ERR_PACKAGE_PINS_STALE
    http: 409
    condition: "Publishing a package whose pinned records have drifted (stale_pin_count > 0)."
  - id: ERR_QC_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "Sealing a package whose report's provisioning eligibility score is below 90.00."
  - id: ERR_NO_PUBLISHED_PREDECESSOR
    http: 409
    condition: "Rolling back a package with no superseded predecessor to restore."
  - id: ERR_BOUNDARY_WINDOW_INVALID
    http: 422
    condition: "effective_end <= effective_start, a cell window outside its boundary's window, or a cell in a different jurisdiction from the boundary's agency."
  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "Activating a boundary would double-cover a (cell, service_type) pair over intersecting half-open windows."
  - id: ERR_CADENCE_WINDOW_NOT_OPEN
    http: 409
    condition: "Publishing before the channel's cadence interval has elapsed since the last publication for that channel and jurisdiction."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: SystemAdmin
    description: "County GIS administrator: registers jurisdictions, agencies and cells, arbitrates or adopts discrepancy resolutions, and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /gis/jurisdictions"
      - "POST /gis/agencies"
      - "POST /gis/agencies/{id}/suspend"
      - "POST /gis/discrepancy-cases/{id}/adopt"
      - "POST /gis/discrepancy-cases/{id}/arbitrate"
      - "POST /gis/_clock/set_current_utc"
    shared_operations:
      - "POST /gis/coverage-cells (shared with GisAnalyst)"
      - "every GET read endpoint"
  - name: GisAnalyst
    description: "Address authority: maintains centerlines and address points, reviews assignment requests, mints addresses, and runs QC scans."
    identity: opaque
    exclusive_operations:
      - "POST /gis/road-centerlines"
      - "PATCH /gis/road-centerlines/{id}"
      - "POST /gis/road-centerlines/{id}/validate"
      - "POST /gis/road-centerlines/{id}/retire"
      - "POST /gis/address-points"
      - "POST /gis/address-points/{id}/activate"
      - "POST /gis/address-points/{id}/retire"
      - "POST /gis/address-assignment-requests/{id}/gis-review"
      - "POST /gis/address-assignment-requests/{id}/assign"
      - "POST /gis/qc-validation-reports"
    shared_operations:
      - "POST /gis/coverage-cells (shared with SystemAdmin)"
      - "every GET read endpoint"
  - name: QcCertifier
    description: "Quality control officer: publishes centerlines, waives defects, and certifies or rejects QC reports. May never certify a report it generated."
    identity: opaque
    exclusive_operations:
      - "POST /gis/road-centerlines/{id}/publish"
      - "POST /gis/qc-defects/{id}/waive"
      - "POST /gis/qc-validation-reports/{id}/certify"
      - "POST /gis/qc-validation-reports/{id}/reject"
    shared_operations:
      - "every GET read endpoint"
  - name: ProvisioningOfficer
    description: "Data provisioning officer: builds, seals, publishes and rolls back the packages that feed dispatch, mapping and public systems. May never publish a package built on a report it certified."
    identity: opaque
    exclusive_operations:
      - "POST /gis/provisioning-packages"
      - "POST /gis/provisioning-packages/{id}/seal"
      - "POST /gis/provisioning-packages/{id}/publish"
      - "POST /gis/provisioning-packages/{id}/rollback"
    shared_operations:
      - "every GET read endpoint"
  - name: PermitCoordinator
    description: "Permitting and utility liaison: opens assignment requests for new construction, records utility clearances and holds, and voids requests."
    identity: opaque
    exclusive_operations:
      - "POST /gis/address-assignment-requests"
      - "POST /gis/address-assignment-requests/{id}/utility-clearance"
      - "POST /gis/address-assignment-requests/{id}/void"
    shared_operations:
      - "every GET read endpoint"
  - name: AgencyLiaison
    description: "Responding-agency representative. X-User-ID is the Agency.id it acts for; it may only touch boundaries owned by that agency and cases in which that agency is a party."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /gis/emergency-service-boundaries"
      - "POST /gis/emergency-service-boundaries/{id}/cell-assignments"
      - "POST /gis/emergency-service-boundaries/{id}/propose"
      - "POST /gis/emergency-service-boundaries/{id}/activate"
      - "POST /gis/emergency-service-boundaries/{id}/retire"
      - "POST /gis/discrepancy-cases"
      - "POST /gis/discrepancy-cases/{id}/proposals"
      - "POST /gis/discrepancy-cases/{id}/concur"
    shared_operations:
      - "every GET read endpoint"
