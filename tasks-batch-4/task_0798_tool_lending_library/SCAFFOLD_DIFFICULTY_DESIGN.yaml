              captures: { iv2: $.data.version }
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copyB}", expected_item_version: "${iv2}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
