            - { call: "POST /gifted/students", payload: { student_number: "W04", legal_name: "W 04", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-w04" }, as: GiftedCoordinator, captures: { w04: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${w04}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
