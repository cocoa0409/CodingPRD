            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility; patient; PATIENT requester linked to that patient."
            - "Request A: PATIENT_RIGHT_OF_ACCESS, SECURE_PORTAL, one segment dispositioned UNAVAILABLE so its page_count is forced to 0."
