# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Master Gardener Volunteer Program & Help Desk
# Sections follow the claim-extraction-guide taxonomy.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: cycle_create_applies_defaults_and_version
        claim_type: creation
        grounds: [entities.ProgramCycle, state_machines.ProgramCycle]
        distinguishing_aspect: "A freshly created cycle is DRAFT with accepted_count 0, enrolled_count 0, version 1, and echoes all input configuration."
        test_recipe:
          setup: ["empty DB; logical clock at its default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: ["Harford"] }, as: ProgramCoordinator, captures: { cyc: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "captured st == DRAFT and captured v == 1"
            - "ProgramCycle.${cyc}.accepted_count == 0 and enrolled_count == 0"
            - "ProgramCycle.${cyc}.created_at == 2026-08-01T00:00:00Z   (logical clock default, no wall-clock fallback)"

      - name: volunteer_get_unknown_id_returns_404
        claim_type: not_found
        grounds: [entities.Volunteer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent volunteer id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /volunteers/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND and http status == 404"

      - name: application_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Application.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applications without the required email field fails with ERR_INVALID_REQUEST before any existence check."
        test_recipe:
          setup: ["cycle 2026 exists (OPEN)"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
          trigger:
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "No Email", county: "Harford", prior_gardening_years: 2 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST and http status == 400"

      - name: shift_create_invalid_kind_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Shift.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum value outside {HELP_DESK, OUTREACH} is rejected at schema level."
        test_recipe:
          setup: ["cycle 2026 OPEN"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
          trigger:
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "GALA", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST and http status == 400"

      - name: specialist_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Specialist.fields.accepting_referrals, entities.Specialist.fields.rolling_score]
        distinguishing_aspect: "Omitting accepting_referrals defaults it to true; counters start at 0 and both scores at 100."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /specialists", payload: { name: "Dr. Pest", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { spec: $.data.id } }
          assert:
            - "Specialist.${spec}.accepting_referrals == true   (default applied)"
            - "Specialist.${spec}.open_referral_count == 0 and answered_count == 0 and late_referral_count == 0 and returned_count == 0"
            - "Specialist.${spec}.rolling_score == 100 and lifetime_score == 100"

      - name: credit_entry_hours_quantum_and_range_boundaries
        claim_type: type_constraints
        grounds: [entities.CreditEntry.fields.hours, "errors[ERR_INVALID_FIELD_VALUE]"]
        distinguishing_aspect: "hours must be a positive multiple of 0.25 and <= 12.0: 12.0 and 0.25 are accepted, 12.25 (over max) and 0.10 (off quantum) fail with ERR_INVALID_FIELD_VALUE."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
          trigger:
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 12.0 }, as: Volunteer, as_user_id: "${vol}", captures: { ok1: $.data.id } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 12.25 }, as: Volunteer, as_user_id: "${vol}", captures: { err1: $.data.error_id } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 0.25 }, as: Volunteer, as_user_id: "${vol}", captures: { ok2: $.data.id } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 0.10 }, as: Volunteer, as_user_id: "${vol}", captures: { err2: $.data.error_id } }
          assert:
            - "CreditEntry.${ok1}.status == PENDING and CreditEntry.${ok2}.status == PENDING"
            - "captured err1 == ERR_INVALID_FIELD_VALUE   (12.25 > 12.0 maximum)"
            - "captured err2 == ERR_INVALID_FIELD_VALUE   (0.10 is not a multiple of 0.25)"

      - name: volunteers_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Volunteer]
        distinguishing_aspect: "GET /volunteers?limit=1&offset=0 returns one row with total_count 2 and has_more true per the fixed envelope."
        test_recipe:
          setup: ["cycle 2026 OPEN; two accepted applications -> two volunteers"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: $.data.id } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /volunteers?limit=1&offset=0", as: ProgramCoordinator }
          assert:
            - "response data array length == 1"
            - "response pagination total_count == 2 and has_more == true and limit == 1 and offset == 0"

      - name: inquiry_follow_up_self_reference_listing
        claim_type: parent_relationships
        grounds: [entities.Inquiry.fields.follow_up_of_id]
        distinguishing_aspect: "A follow-up inquiry (self-FK) is creatable outside the shift window (window waived), lands LOGGED with follow_up_of_id set, and is discoverable via the filtered list."
        test_recipe:
          setup:
            - "cycle 2026 OPEN; volunteer ACTIVE staffed on shift 2026-08-05 09:00-12:00"
            - "inquiry I1 logged, triaged, and answered at the desk (CLOSED); clock later moved to 2026-08-12 (outside the window)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Tomato wilt", contact_name: "R1", details: "wilting" }, as: Volunteer, as_user_id: "${vol}", captures: { inq1: $.data.id } }
            - { call: "POST /inquiries/${inq1}/triage", payload: { category: "PLANT_DISEASE" }, as: ProgramCoordinator }
            - { call: "POST /inquiries/${inq1}/answer", payload: { answer_text: "Likely fusarium; remove plant" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Tomato wilt follow-up", contact_name: "R1", details: "spread to second plant", follow_up_of_id: "${inq1}" }, as: Volunteer, as_user_id: "${vol}", captures: { inq2: $.data.id } }
            - { call: "GET /inquiries?follow_up_of_id=${inq1}", as: ProgramCoordinator }
          assert:
            - "Inquiry.${inq2}.status == LOGGED and follow_up_of_id == ${inq1}   (window check waived for follow-ups)"
            - "GET filtered list returns exactly 1 inquiry with id ${inq2}"
            - "Inquiry.${inq1}.status == CLOSED and resolution == ANSWERED_AT_DESK"

      - name: application_create_ignores_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Application]
        distinguishing_aspect: "Client-supplied system fields (id, created_at, version) in a create payload are ignored; the server mints its own id."
        test_recipe:
          setup: ["cycle 2026 OPEN"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
          trigger:
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7, id: "client-supplied-id", version: 99 }, as: ProgramCoordinator, captures: { new_id: $.data.id, v: $.data.version } }
          assert:
            - "captured new_id != client-supplied-id   (server mints the UUID)"
            - "captured v == 1   (client-supplied version ignored)"

  # ---------------------------------------------------------------------------
  # State Machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: completed_shift_cannot_be_cancelled_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.Shift, "errors[ERR_SHIFT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel from the terminal-ish COMPLETED state is rejected; the shift stays COMPLETED."
        test_recipe:
          setup: ["cycle 2026 OPEN; shift 2026-08-10 09:00-12:00 created; clock advanced to end_time; shift COMPLETED"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh}/complete", as: ProgramCoordinator }
          trigger:
            - { call: "POST /shifts/${sh}/cancel", as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_SHIFT_NOT_CANCELLABLE"
            - "Shift.${sh}.status == COMPLETED"

      - name: decide_on_terminal_application_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application, "errors[ERR_APPLICATION_NOT_SCORED]"]
        distinguishing_aspect: "A REJECTED application accepts no further decide calls; the terminal state is locked."
        test_recipe:
          setup: ["cycle 2026 OPEN; application SCORED then REJECTED"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "REJECT" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_APPLICATION_NOT_SCORED"
            - "Application.${app}.status == REJECTED   (terminal lockdown)"
            - "ProgramCycle.${cyc}.accepted_count == 0"

      - name: double_approve_credit_entry_rejected
        claim_type: idempotency
        grounds: [state_machines.CreditEntry.PENDING_to_APPROVED, "errors[ERR_ENTRY_NOT_PENDING]"]
        distinguishing_aspect: "Approving an already-APPROVED entry fails with ERR_ENTRY_NOT_PENDING; the second attempt has no side effect on totals."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE; one PENDING 5.0 SERVICE entry"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator }
          assert:
            - "captured err == ERR_ENTRY_NOT_PENDING"
            - "RecertificationRecord.${rec}.official_service_hours == 5.0   (no double-count)"

      - name: signup_complete_before_shift_completed_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.ShiftSignup.SIGNED_UP_to_COMPLETED, "errors[ERR_SHIFT_NOT_COMPLETED]"]
        distinguishing_aspect: "Guarded transition: signup completion requires the parent shift COMPLETED; while the shift is still OPEN the call fails with ERR_SHIFT_NOT_COMPLETED."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE; SIGNED_UP signup on an OPEN shift"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: $.data.id } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-20T09:00:00Z", end_time: "2026-08-20T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: $.data.id } }
