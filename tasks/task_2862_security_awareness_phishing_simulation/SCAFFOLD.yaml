scenario: |
  2862. Security Awareness & Phishing Simulation (enterprise security awareness program): training
  curriculum assignment by role with new hire, annual and role-specific modules, completion tracking
  with reminder cadence, manager escalation and access consequences for non-completion, phishing
  simulation campaign design with difficulty tiers, templates and realistic pretexts avoiding harmful
  themes, click, report and credential submission metrics with department and tenure segmentation,
  repeat clicker intervention with targeted coaching and increasingly frequent simulations, reporting
  culture measurement with report rate as a primary metric alongside click rate, simulation
  communication policy preventing distrust while maintaining realism, program effectiveness
  correlation with real incident volume

domain_name: security-awareness-phishing-simulation
api_prefix: "/awareness"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  # flat: twelve peer entities linked by explicit FK fields; no entity is nested inside another's
  # URL path except for read-only sub-resource discovery of the append-only InteractionEvent log.
  state_machine_shape: cyclic
  # CurriculumAssignment cycles (IN_PROGRESS -> FAILED_ATTEMPT -> IN_PROGRESS, OVERDUE -> IN_PROGRESS,
  # ESCALATED -> ASSIGNED on extension); PhishingCampaign cycles (IN_REVIEW -> REJECTED -> IN_REVIEW,
  # SCHEDULED -> SCHEDULED on reschedule); Employee carries three independent parallel state axes.
  relationship_patterns:
    - one_to_many
    - self_referential      # Employee.manager_id -> Employee.id; CurriculumAssignment.superseded_by_assignment_id
    - cross_aggregate       # AccessConsequence.source_assignment_id crosses the training aggregate into the access aggregate
  role_model: segregation_of_duties
  # A CampaignApprover may never approve or reject a campaign whose author_user_id equals its own
  # X-User-ID; the Learner who completes training is never the ProgramAdmin who assigns or voids it.
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Density, not volume: the report-rate-versus-click-rate classification of one delivery
    (CLICK then REPORT) is deliberately double-counted, the access-consequence severity ladder is
    a circular-looking dependency with a pinned evaluation order, and every escalation side effect
    is a four-hop causal chain (Assignment -> EscalationNotice -> AccessConsequence -> Employee).

entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: work email address; unique across all Employee rows regardless of employment_status
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: display name
      - name: department
        type: enum
        source: input
        description: organizational department used for campaign targeting and metric segmentation
        constraints: "one of {ENGINEERING, FINANCE, SALES, HR, IT, EXECUTIVE}"
      - name: role_code
        type: enum
        source: input
        description: job-role code that drives ROLE_SPECIFIC curriculum eligibility
        constraints: "one of {IC, ENGINEER, FINANCE_APPROVER, IT_ADMIN, EXECUTIVE, MANAGER}"
      - name: manager_id
        type: string
        source: input
        description: "FK -> Employee.id; nullable self-reference to the acting Manager for escalation notices; null means no escalation notice is ever created for this employee"
        default: null
      - name: hire_date
        type: string
        source: input
        description: "calendar hire date in YYYY-MM-DD (UTC midnight); baseline for tenure_band"
        constraints: "YYYY-MM-DD"
      - name: employment_status
        type: enum
        source: system
        description: employment lifecycle axis of the Employee state machine
        default: ACTIVE
        constraints: "one of {ACTIVE, OFFBOARDED}"
      - name: tenure_band
        type: enum
        source: computed
        description: tenure bucket derived from the logical clock and hire_date by calculations.employee_tenure_band
        constraints: "one of {NEW_HIRE, EARLY, ESTABLISHED, VETERAN}"
      - name: compliance_state
        type: enum
        source: computed
        description: training-compliance axis derived from this employee's CurriculumAssignment states by calculations.employee_compliance_state
        default: COMPLIANT
        constraints: "one of {COMPLIANT, AT_RISK, DELINQUENT}"
      - name: access_posture
        type: enum
        source: computed
        description: access-consequence axis derived from ACTIVE AccessConsequence rows by calculations.access_consequence_severity step 4
        default: NONE
        constraints: "one of {NONE, WARNED, ELEVATED_REVIEW, SUSPENDED}"
      - name: active_suspension_count
        type: integer
        source: computed
        description: count of AccessConsequence rows for this employee with state == ACTIVE and consequence_type == SYSTEM_ACCESS_SUSPENSION; the conserved quantity of the access-restriction ledger
        default: 0
      - name: repeat_clicker_tier
        type: integer
        source: computed
        description: rolling-window repeat-clicker tier from calculations.repeat_clicker_tier
        default: 0
        constraints: "0..3"
      - name: consecutive_clean_simulations
        type: integer
        source: computed
        description: number of this employee's non-EXCLUDED SimulationDelivery rows, ordered by delivered_at ASC, that ended REPORTED or NO_INTERACTION after the most recent failure delivery
        default: 0
      - name: reserved_simulation_slots
        type: integer
        source: computed
        description: count of this employee's SimulationDelivery rows in state QUEUED; the conserved quantity of the simulation-reservation ledger
        default: 0
      - name: risk_score_provisional
        type: number
        source: computed
        description: PROVISIONAL variant of calculations.employee_risk_score (includes deliveries of RUNNING campaigns, no NO_INTERACTION credit)
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: risk_score_settled
        type: number
        source: computed
        description: SETTLED variant of calculations.employee_risk_score (CLOSED campaigns only, NO_INTERACTION credit applied)
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"

  - name: TrainingModule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: short unique module code
        constraints: "unique; non-empty"
      - name: title
        type: string
        source: input
        description: human-readable module title
      - name: module_type
        type: enum
        source: input
        description: curriculum bucket this module belongs to
        constraints: "one of {NEW_HIRE, ANNUAL, ROLE_SPECIFIC, REMEDIAL}"
      - name: applies_to_role_codes
        type: array
        source: input
        description: role_code values eligible for this module; empty array means every role_code is eligible; must be non-empty when module_type == ROLE_SPECIFIC
        default: []
      - name: criticality
        type: enum
        source: input
        description: HIGH halves the base due-window per calculations.assignment_due_date
        default: STANDARD
        constraints: "one of {STANDARD, HIGH}"
      - name: passing_score_pct
        type: integer
        source: input
        description: inclusive minimum score that turns a submission into COMPLETED
        default: 80
        constraints: "0..100"
      - name: reminder_offsets_days
        type: array
        source: input
        description: ordered integer offsets in days; reminder i is due at effective_due_at minus offsets[i] days, so negative entries are post-due reminders
        default: [7, 3, 1, -2]
      - name: escalate_after_reminders
        type: integer
        source: input
        description: informational cadence threshold recorded on the module; escalation itself is driven by calculations.escalation_ladder
        default: 3
        constraints: ">= 1"
      - name: max_extension_days
        type: integer
        source: input
        description: cumulative cap on granted_extension_days for assignments of this module
        default: 10
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: module publication lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, RETIRED}"
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of the DRAFT -> PUBLISHED transition
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: logical-clock instant of the PUBLISHED -> RETIRED transition
        default: null

  - name: CurriculumAssignment
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the learner who owns this assignment"
      - name: module_id
        type: string
        source: input
        description: "FK -> TrainingModule.id; the module to be completed"
      - name: assignment_reason
        type: enum
        source: input
        description: why the module was assigned; selects the base due-window in calculations.assignment_due_date
        constraints: "one of {NEW_HIRE, ANNUAL, ROLE_CHANGE, REMEDIAL}"
      - name: assigned_at
        type: datetime
        source: system
        description: logical-clock instant at creation
      - name: due_at
        type: datetime
        source: computed
        description: base deadline from calculations.assignment_due_date, before any extension
      - name: granted_extension_days
        type: integer
        source: system
        description: cumulative extension days granted by Managers
        default: 0
      - name: effective_due_at
        type: datetime
        source: computed
        description: due_at plus granted_extension_days days; the only deadline the sweep reads
      - name: state
        type: enum
        source: system
        description: assignment lifecycle state
        default: ASSIGNED
        constraints: "one of {ASSIGNED, IN_PROGRESS, FAILED_ATTEMPT, COMPLETED, OVERDUE, ESCALATED, VOIDED}"
      - name: attempt_count
        type: integer
        source: system
        description: number of submitted attempts
        default: 0
      - name: last_score_pct
        type: integer
        source: system
        description: score of the most recent submission
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of the transition into COMPLETED
        default: null
      - name: reminders_sent
        type: integer
        source: system
        description: number of cadence reminders emitted by compliance sweeps
        default: 0
      - name: last_reminder_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent reminder
        default: null
      - name: next_reminder_due_at
        type: datetime
        source: computed
        description: instant the next unsent cadence reminder becomes due per calculations.reminder_cadence_schedule; null when reminders_sent has consumed every offset
        default: null
      - name: escalation_level
        type: integer
        source: system
        description: highest escalation rung reached, 0 when never escalated
        default: 0
        constraints: "0..3"
      - name: days_overdue
        type: integer
        source: computed
        description: floor((clock_now - effective_due_at) / 86400 seconds), floored at 0
        default: 0
      - name: superseded_by_assignment_id
        type: string
        source: system
        description: "FK -> CurriculumAssignment.id; set on the older assignment when a same-(employee, module) create supersedes it"
        default: null
      - name: void_reason_code
        type: string
        source: system
        description: reason_code recorded by the void action or by the supersede cascade
        default: null

  - name: EscalationNotice
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: system
        description: "FK -> CurriculumAssignment.id; the overdue assignment that produced this notice"
      - name: manager_id
        type: string
        source: system
        description: "FK -> Employee.id; copied from the learner's manager_id at notice creation"
      - name: level
        type: integer
        source: system
        description: escalation rung this notice announces
        constraints: "1..3"
      - name: sent_at
        type: datetime
        source: system
        description: logical-clock instant the sweep created the notice
      - name: state
        type: enum
        source: system
        description: notice lifecycle
        default: SENT
        constraints: "one of {SENT, ACKNOWLEDGED, EXPIRED}"
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant of the manager acknowledgement
        default: null
      - name: action_plan_note
        type: string
        source: input
        description: free-text remediation plan supplied by the acknowledging Manager
        default: null

  - name: AccessConsequence
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; the employee whose access is constrained"
      - name: source_assignment_id
        type: string
        source: system
        description: "FK -> CurriculumAssignment.id; the delinquent assignment that caused this consequence, null when applied directly by a ProgramAdmin"
        default: null
      - name: consequence_type
        type: enum
        source: system
        description: applied access constraint; taken from the request when supplied, otherwise derived by calculations.access_consequence_severity step 2
        constraints: "one of {WARNING, MFA_REVIEW, SYSTEM_ACCESS_SUSPENSION}"
      - name: severity_rank
        type: integer
        source: computed
        description: "rank of consequence_type: WARNING=1, MFA_REVIEW=2, SYSTEM_ACCESS_SUSPENSION=3"
        constraints: "1..3"
      - name: state
        type: enum
        source: system
        description: consequence lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, LIFTED, VOIDED}"
      - name: reason_code
        type: string
        source: input
        description: why the consequence was applied
      - name: applied_at
        type: datetime
        source: system
        description: logical-clock instant the consequence became ACTIVE
      - name: lifted_at
        type: datetime
        source: system
        description: logical-clock instant of the ACTIVE -> LIFTED or ACTIVE -> VOIDED transition
        default: null
      - name: lift_reason_code
        type: string
        source: system
        description: "reason recorded on exit; the supersede cascade writes SUPERSEDED, the void cascade writes ASSIGNMENT_VOIDED, an extension cascade writes DEADLINE_EXTENDED"
        default: null

  - name: PhishingTemplate
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: template name
      - name: pretext_category
        type: enum
        source: input
        description: realistic pretext family the template imitates
        constraints: "one of {PACKAGE_DELIVERY, IT_PASSWORD_RESET, SHARED_DOCUMENT, INVOICE_APPROVAL, HR_BENEFITS_ENROLLMENT, EXEC_URGENT_REQUEST}"
      - name: difficulty_tier
        type: enum
        source: input
        description: highest campaign tier this template may back
        constraints: "one of {TIER_1_BASIC, TIER_2_TARGETED, TIER_3_SPEAR}"
      - name: theme_tags
        type: array
        source: input
        description: psychological levers used by the pretext; entries drawn from the tag enum, duplicates rejected
        default: []
        constraints: "each entry one of {URGENCY, AUTHORITY, CURIOSITY, REWARD, BONUS_COMPENSATION, LAYOFF_NOTICE, MEDICAL_RESULT, CHARITY_APPEAL, FAMILY_EMERGENCY}"
      - name: credential_capture_enabled
        type: boolean
        source: input
        description: whether the landing page simulates credential capture; required true before any CREDENTIAL_SUBMIT event is accepted on a delivery of a campaign using this template
        default: false
      - name: review_state
        type: enum
        source: system
        description: template review lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED_FOR_USE, BLOCKED}"
      - name: harmful_flag_hits
        type: array
        source: computed
        description: intersection of theme_tags with calculations.harmful_theme_screen constant PROHIBITED_THEME_TAGS, ordered as listed in that constant
        default: []
      - name: blocked_reason
        type: string
        source: system
        description: reason recorded on the transition into BLOCKED
        default: null

  - name: PhishingCampaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: campaign name
      - name: template_id
        type: string
        source: input
        description: "FK -> PhishingTemplate.id; the pretext this campaign sends"
      - name: difficulty_tier
        type: enum
        source: input
        description: base tier every delivery starts from; its rank may not exceed the template's rank
        constraints: "one of {TIER_1_BASIC, TIER_2_TARGETED, TIER_3_SPEAR}"
      - name: target_departments
        type: array
        source: input
        description: department values included in the cohort; empty array means every department
        default: []
      - name: target_tenure_bands
        type: array
        source: input
        description: tenure_band values included in the cohort; empty array means every band
        default: []
      - name: target_min_repeat_tier
        type: integer
        source: input
        description: minimum Employee.repeat_clicker_tier for cohort inclusion, evaluated at schedule time
        default: 0
        constraints: "0..3"
      - name: communication_policy_ack
        type: boolean
        source: input
        description: author's attestation that the pre-announcement and post-campaign debrief policy will be honoured; must be true before the campaign may enter IN_REVIEW
        default: false
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the CampaignAuthor that created the campaign; opaque operator id, never an Employee.id
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the CampaignApprover that most recently approved or rejected the campaign
        default: null
      - name: state
        type: enum
        source: system
        description: campaign lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, APPROVED, REJECTED, SCHEDULED, RUNNING, CLOSED, CANCELLED}"
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded on the IN_REVIEW -> REJECTED transition
        default: null
      - name: scheduled_send_at
        type: datetime
        source: system
        description: instant the cohort is to be delivered; set by the schedule action and overwritten by a reschedule
        default: null
      - name: launched_at
        type: datetime
        source: system
        description: logical-clock instant of the SCHEDULED -> RUNNING transition
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of the RUNNING -> CLOSED transition
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant of the transition into CANCELLED
        default: null
      - name: debrief_note
        type: string
        source: input
        description: debrief text recorded at close; the communication-policy artefact shown to the cohort afterwards
        default: null
      - name: target_count
        type: integer
        source: computed
        description: count of SimulationDelivery rows created for this campaign, including EXCLUDED ones
        default: 0
      - name: evaluable_count
        type: integer
        source: computed
        description: count of this campaign's SimulationDelivery rows whose state != EXCLUDED; the denominator of every rate
        default: 0
      - name: click_rate
        type: number
        source: computed
        description: program-level click rate from calculations.campaign_scorecard_rates; null when evaluable_count == 0
        default: null
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: report_rate
        type: number
        source: computed
        description: program-level report rate from calculations.campaign_scorecard_rates; the primary reporting-culture metric; null when evaluable_count == 0
        default: null
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: credential_rate
        type: number
        source: computed
        description: program-level credential-submission rate from calculations.campaign_scorecard_rates; null when evaluable_count == 0
        default: null
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: resilience_ratio
        type: number
        source: computed
        description: report-versus-click resilience ratio from calculations.campaign_scorecard_rates; null when evaluable_count == 0
        default: null
        constraints: "4 decimal places"

  - name: SimulationDelivery
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> PhishingCampaign.id; the campaign that reserved this delivery"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; the cohort member this delivery targets"
      - name: base_difficulty_tier
        type: enum
        source: system
        description: campaign.difficulty_tier copied at schedule time
        constraints: "one of {TIER_1_BASIC, TIER_2_TARGETED, TIER_3_SPEAR}"
      - name: effective_difficulty_tier
        type: enum
        source: computed
        description: per-employee tier from calculations.simulation_difficulty_escalation, frozen at schedule time
        constraints: "one of {TIER_1_BASIC, TIER_2_TARGETED, TIER_3_SPEAR}"
      - name: state
        type: enum
        source: system
        description: delivery interaction state
        default: QUEUED
        constraints: "one of {QUEUED, DELIVERED, REPORTED, CLICKED, CREDENTIAL_SUBMITTED, NO_INTERACTION, EXCLUDED}"
      - name: queued_at
        type: datetime
        source: system
        description: logical-clock instant the schedule action reserved this delivery
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the QUEUED -> DELIVERED transition
        default: null
      - name: first_click_at
        type: datetime
        source: system
        description: occurred_at of the earliest CLICK InteractionEvent
        default: null
      - name: first_report_at
        type: datetime
        source: system
        description: occurred_at of the earliest REPORT InteractionEvent
        default: null
      - name: credential_submitted_at
        type: datetime
        source: system
        description: occurred_at of the earliest CREDENTIAL_SUBMIT InteractionEvent
        default: null
      - name: excluded_reason
        type: string
        source: system
        description: "reason recorded on the transition into EXCLUDED: QUIET_PERIOD is impossible (the schedule is rejected instead), so one of {CAMPAIGN_CANCELLED, CAMPAIGN_RESCHEDULED, EMPLOYEE_OFFBOARDED, ACCESS_SUSPENDED}"
        default: null
      - name: outcome_class
        type: enum
        source: computed
        description: classification from calculations.campaign_scorecard_rates step 1
        constraints: "one of {PENDING, NO_INTERACTION, REPORTED_ONLY, CLICKED_NO_REPORT, CLICKED_THEN_REPORTED, CREDENTIAL_SUBMITTED, EXCLUDED}"
      - name: time_to_report_minutes
        type: integer
        source: computed
        description: floor((first_report_at - delivered_at) / 60 seconds); null when first_report_at is null
        default: null
      - name: quiet_period_until
        type: datetime
        source: computed
        description: reference instant plus QUIET_PERIOD_DAYS, where the reference instant is delivered_at when set and otherwise the campaign's scheduled_send_at; the exclusive upper bound of the per-employee quiet window
        default: null

  - name: InteractionEvent
    parent: null
    common_fields: false
    fields:
      - name: delivery_id
        type: string
        source: system
        description: "FK -> SimulationDelivery.id; the delivery this immutable event belongs to"
      - name: event_type
        type: enum
        source: input
        description: interaction kind reported by the mail-gateway integration
        constraints: "one of {OPEN, CLICK, REPORT, CREDENTIAL_SUBMIT}"
      - name: occurred_at
        type: datetime
        source: input
        description: instant the interaction happened; must be >= the delivery's delivered_at and <= the logical clock
      - name: source
        type: enum
        source: input
        description: channel that observed the interaction
        constraints: "one of {MAIL_GATEWAY, REPORT_BUTTON, LANDING_PAGE}"
      - name: sequence_index
        type: integer
        source: system
        description: 1-based append order of this event within its delivery, assigned at creation
      - name: superseding_effect
        type: string
        source: system
        description: "the delivery state transition this event caused, or NONE when the delivery state was already terminal-for-this-event-type"
        default: NONE

  - name: RepeatClickerIntervention
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; the repeat clicker under intervention"
      - name: triggering_delivery_id
        type: string
        source: system
        description: "FK -> SimulationDelivery.id; the delivery whose failure pushed repeat_clicker_tier to 2 or higher"
      - name: coaching_assignment_id
        type: string
        source: system
        description: "FK -> CurriculumAssignment.id; the REMEDIAL assignment created by the assign-coaching action"
        default: null
      - name: tier_at_open
        type: integer
        source: system
        description: Employee.repeat_clicker_tier at the instant the intervention was opened
        constraints: "2..3"
      - name: current_tier
        type: integer
        source: computed
        description: the employee's live repeat_clicker_tier, re-read on every response
        constraints: "0..3"
      - name: simulation_frequency_days
        type: integer
        source: computed
        description: "targeted re-simulation cadence from calculations.simulation_difficulty_escalation step 4: 45 when current_tier <= 1, 30 when 2, 14 when 3"
      - name: state
        type: enum
        source: system
        description: intervention lifecycle
        default: OPEN
        constraints: "one of {OPEN, ESCALATED_TO_MANAGER, COACHING_ASSIGNED, COACHING_COMPLETED, CLOSED_RESOLVED}"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the cascade opened the intervention
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of the transition into CLOSED_RESOLVED
        default: null
      - name: resolution_code
        type: string
        source: input
        description: resolution recorded by the closing ProgramAdmin
        default: null
      - name: tier_decay_applied
        type: boolean
        source: system
        description: true when the close action decayed repeat_clicker_tier by one because consecutive_clean_simulations >= CLEAN_STREAK_FOR_DECAY
        default: false

  - name: IncidentRecord
    parent: null
    common_fields: false
    fields:
      - name: incident_type
        type: enum
        source: input
        description: real security incident category
        constraints: "one of {CREDENTIAL_PHISH, BEC, MALWARE_DELIVERY, DATA_LOSS}"
      - name: severity
        type: enum
        source: input
        description: incident severity
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: department
        type: enum
        source: input
        description: department the incident is attributed to
        constraints: "one of {ENGINEERING, FINANCE, SALES, HR, IT, EXECUTIVE}"
      - name: occurred_at
        type: datetime
        source: input
        description: instant the incident occurred; bucketed by calendar month in the effectiveness report
      - name: root_cause_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; nullable initial access vector"
        default: null
      - name: summary
        type: string
        source: input
        description: short incident summary
      - name: phish_related
        type: boolean
        source: computed
        description: true when incident_type is in {CREDENTIAL_PHISH, BEC}; only phish_related incidents enter the effectiveness correlation series

  - name: CommunicationWindow
    parent: null
    common_fields: false
    fields:
      - name: window_type
        type: enum
        source: input
        description: kind of communication restriction
        constraints: "one of {SIMULATION_BLACKOUT, ANNOUNCEMENT_MORATORIUM}"
      - name: start_at
        type: datetime
        source: input
        description: inclusive start of the restricted interval
      - name: end_at
        type: datetime
        source: input
        description: inclusive end of the restricted interval; must be strictly after start_at
      - name: scope_department
        type: enum
        source: input
        description: department the window applies to; null means every department
        default: null
        constraints: "null or one of {ENGINEERING, FINANCE, SALES, HR, IT, EXECUTIVE}"
      - name: reason
        type: string
        source: input
        description: why simulation traffic is restricted in this interval

state_machines:
  - entity: TrainingModule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /awareness/training-modules/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "module_type != ROLE_SPECIFIC OR applies_to_role_codes is non-empty"
        side_effects:
          - "sets published_at = clock_now"
          - "increments TrainingModule.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /awareness/training-modules/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "sets retired_at = clock_now"
          - "increments TrainingModule.version by 1"
        note: "Existing CurriculumAssignment rows are NOT touched; they simply become unstartable (ERR_MODULE_RETIRED)."

  - entity: PhishingTemplate
    initial_state: DRAFT
    terminal_states: [BLOCKED]
    transitions:
      - from: DRAFT
        to: APPROVED_FOR_USE
        trigger: "POST /awareness/phishing-templates/{id}/approve-for-use"
        actor: CampaignApprover
        preconditions:
          - "review_state == DRAFT"
          - "harmful_flag_hits is empty (calculations.harmful_theme_screen)"
        side_effects:
          - "increments PhishingTemplate.version by 1"
      - from: DRAFT
        to: BLOCKED
        trigger: "POST /awareness/phishing-templates/{id}/block"
        actor: ProgramAdmin
        preconditions:
          - "review_state == DRAFT"
        side_effects:
          - "sets blocked_reason from the request"
          - "increments PhishingTemplate.version by 1"
      - from: APPROVED_FOR_USE
        to: BLOCKED
        trigger: "POST /awareness/phishing-templates/{id}/block"
        actor: ProgramAdmin
        preconditions:
          - "review_state == APPROVED_FOR_USE"
        side_effects:
          - "sets blocked_reason from the request"
          - "increments PhishingTemplate.version by 1"
        note: "Blocking does not retroact onto campaigns already APPROVED; it only blocks future approvals."

  - entity: Employee
    initial_state: "employment_status=ACTIVE; compliance_state=COMPLIANT; access_posture=NONE"
    terminal_states: ["employment_status=OFFBOARDED"]
    transitions:
      # ---- axis 1: employment_status (author-driven) ----
      - from: "employment_status=ACTIVE"
        to: "employment_status=OFFBOARDED"
        trigger: "POST /awareness/employees/{id}/offboard"
        actor: ProgramAdmin
        preconditions:
          - "employment_status == ACTIVE"
        side_effects:
          - "every CurriculumAssignment of this employee in state IN {ASSIGNED, IN_PROGRESS, FAILED_ATTEMPT, OVERDUE, ESCALATED} becomes VOIDED with void_reason_code = EMPLOYEE_OFFBOARDED"
          - "every EscalationNotice whose assignment_id is one of those assignments and whose state == SENT becomes EXPIRED"
          - "every AccessConsequence of this employee with state == ACTIVE becomes VOIDED with lift_reason_code = EMPLOYEE_OFFBOARDED and lifted_at = clock_now"
          - "recomputes access_posture (-> NONE) and active_suspension_count (-> 0)"
          - "recomputes compliance_state (-> COMPLIANT)"
          - "every SimulationDelivery of this employee in state QUEUED becomes EXCLUDED with excluded_reason = EMPLOYEE_OFFBOARDED, decrementing reserved_simulation_slots for each"
          - "increments Employee.version by 1"
      # ---- axis 2: compliance_state (system-derived, calculations.employee_compliance_state) ----
      - from: "compliance_state=COMPLIANT"
        to: "compliance_state=AT_RISK"
        trigger: "system: recomputation after any CurriculumAssignment state change or compliance sweep"
        actor: system
        preconditions:
          - "at least one CurriculumAssignment of this employee has state == OVERDUE and none has state == ESCALATED"
        side_effects:
          - "increments Employee.version by 1"
      - from: "compliance_state=AT_RISK"
        to: "compliance_state=DELINQUENT"
        trigger: "system: recomputation after any CurriculumAssignment state change or compliance sweep"
        actor: system
        preconditions:
          - "at least one CurriculumAssignment of this employee has state == ESCALATED"
        side_effects:
          - "increments Employee.version by 1"
      - from: "compliance_state=DELINQUENT"
        to: "compliance_state=COMPLIANT"
        trigger: "system: recomputation after a CurriculumAssignment reaches COMPLETED or VOIDED, or after an extension resets escalation_level"
        actor: system
        preconditions:
          - "no CurriculumAssignment of this employee has state IN {OVERDUE, ESCALATED}"
        side_effects:
          - "increments Employee.version by 1"
        note: "compliance_state moves in both directions and is independent of access_posture: an employee may be COMPLIANT while access_posture is still SUSPENDED until the consequence is lifted."
      # ---- axis 3: access_posture (system-derived, calculations.access_consequence_severity step 4) ----
      - from: "access_posture=NONE"
        to: "access_posture=WARNED"
        trigger: "system: an AccessConsequence with consequence_type == WARNING becomes ACTIVE"
        actor: system
        preconditions:
          - "max severity_rank over this employee's ACTIVE AccessConsequence rows == 1"
        side_effects:
          - "increments Employee.version by 1"
      - from: "access_posture=WARNED"
        to: "access_posture=ELEVATED_REVIEW"
        trigger: "system: an AccessConsequence with consequence_type == MFA_REVIEW becomes ACTIVE"
        actor: system
        preconditions:
          - "max severity_rank over this employee's ACTIVE AccessConsequence rows == 2"
        side_effects:
          - "increments Employee.version by 1"
      - from: "access_posture=ELEVATED_REVIEW"
        to: "access_posture=SUSPENDED"
        trigger: "system: an AccessConsequence with consequence_type == SYSTEM_ACCESS_SUSPENSION becomes ACTIVE"
        actor: system
        preconditions:
          - "max severity_rank over this employee's ACTIVE AccessConsequence rows == 3"
        side_effects:
          - "sets active_suspension_count = count of ACTIVE SYSTEM_ACCESS_SUSPENSION rows"
          - "increments Employee.version by 1"
      - from: "access_posture=SUSPENDED"
        to: "access_posture=NONE"
        trigger: "POST /awareness/access-consequences/{id}/lift, or the void/extension/offboard compensation cascades"
        actor: ProgramAdmin | system
        preconditions:
          - "no AccessConsequence of this employee remains in state ACTIVE"
        side_effects:
          - "sets active_suspension_count = 0"
          - "increments Employee.version by 1"
        note: "Lifting the top consequence while a lower one is still ACTIVE moves access_posture to that lower rank instead of NONE; the posture is always rank_to_posture(max ACTIVE severity_rank)."

  - entity: CurriculumAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/start"
        actor: Learner
        preconditions:
          - "state == ASSIGNED"
          - "X-User-ID == employee_id"
          - "TrainingModule(module_id).status == PUBLISHED"
          - "Employee(employee_id).employment_status == ACTIVE"
        side_effects:
          - "increments CurriculumAssignment.version by 1"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/start"
        actor: Learner
        preconditions:
          - "state == OVERDUE"
          - "X-User-ID == employee_id"
          - "TrainingModule(module_id).status == PUBLISHED"
        side_effects:
          - "increments CurriculumAssignment.version by 1"
        note: "Cycle: an overdue learner re-enters the pipeline without losing escalation_level."
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/start"
        actor: Learner
        preconditions:
          - "state == ESCALATED"
          - "X-User-ID == employee_id"
          - "TrainingModule(module_id).status == PUBLISHED"
        side_effects:
          - "increments CurriculumAssignment.version by 1"
        note: "Cycle: escalation_level and any ACTIVE AccessConsequence survive until the assignment reaches COMPLETED."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /awareness/curriculum-assignments/{id}/submit with score_pct >= TrainingModule.passing_score_pct"
        actor: Learner
        preconditions:
          - "state == IN_PROGRESS"
          - "X-User-ID == employee_id"
          - "score_pct >= TrainingModule(module_id).passing_score_pct"
        side_effects:
          - "sets completed_at = clock_now, last_score_pct = score_pct, attempt_count += 1"
          - "sets next_reminder_due_at = null"
          - "every EscalationNotice of this assignment with state == SENT becomes EXPIRED"
          - "every AccessConsequence with source_assignment_id == this assignment and state == ACTIVE becomes LIFTED with lift_reason_code = TRAINING_COMPLETED and lifted_at = clock_now"
          - "recomputes Employee.access_posture and Employee.active_suspension_count"
          - "recomputes Employee.compliance_state"
          - "when this assignment is the coaching_assignment_id of a RepeatClickerIntervention in state COACHING_ASSIGNED, that intervention becomes COACHING_COMPLETED"
          - "recomputes Employee.risk_score_provisional and Employee.risk_score_settled"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
      - from: IN_PROGRESS
        to: FAILED_ATTEMPT
        trigger: "POST /awareness/curriculum-assignments/{id}/submit with score_pct < TrainingModule.passing_score_pct"
        actor: Learner
        preconditions:
          - "state == IN_PROGRESS"
          - "X-User-ID == employee_id"
          - "score_pct < TrainingModule(module_id).passing_score_pct"
        side_effects:
          - "sets last_score_pct = score_pct, attempt_count += 1"
          - "increments CurriculumAssignment.version by 1"
      - from: FAILED_ATTEMPT
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/retake"
        actor: Learner
        preconditions:
          - "state == FAILED_ATTEMPT"
          - "X-User-ID == employee_id"
          - "TrainingModule(module_id).status == PUBLISHED"
        side_effects:
          - "increments CurriculumAssignment.version by 1"
        note: "Cycle: IN_PROGRESS -> FAILED_ATTEMPT -> IN_PROGRESS may repeat without bound; attempt_count is the only monotone witness."
      - from: ASSIGNED
        to: OVERDUE
        trigger: "POST /awareness/compliance-sweeps (step B)"
        actor: ProgramAdmin
        preconditions:
          - "state == ASSIGNED"
          - "clock_now > effective_due_at (strictly greater)"
        side_effects:
          - "recomputes Employee.compliance_state (COMPLIANT -> AT_RISK when no sibling assignment is ESCALATED)"
          - "recomputes Employee.risk_score_provisional and Employee.risk_score_settled"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "POST /awareness/compliance-sweeps (step B)"
        actor: ProgramAdmin
        preconditions:
          - "state == IN_PROGRESS"
          - "clock_now > effective_due_at (strictly greater)"
        side_effects:
          - "recomputes Employee.compliance_state and both risk scores"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
      - from: FAILED_ATTEMPT
        to: OVERDUE
        trigger: "POST /awareness/compliance-sweeps (step B)"
        actor: ProgramAdmin
        preconditions:
          - "state == FAILED_ATTEMPT"
          - "clock_now > effective_due_at (strictly greater)"
        side_effects:
          - "recomputes Employee.compliance_state and both risk scores"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /awareness/compliance-sweeps (step C) when calculations.escalation_ladder yields target_level >= 2"
        actor: ProgramAdmin
        preconditions:
          - "state == OVERDUE"
          - "days_overdue >= 7 (ESCALATION_L2_DAYS)"
        side_effects:
          - "hop 1: sets escalation_level = target_level (2 or 3)"
          - "hop 2: for each newly reached level L, when Employee(employee_id).manager_id is not null, creates an EscalationNotice(level = L, manager_id = Employee.manager_id, state = SENT, sent_at = clock_now)"
          - "hop 3: the creation of an EscalationNotice with level >= 2 applies an AccessConsequence per calculations.access_consequence_severity, with source_assignment_id = this assignment, state = ACTIVE"
          - "hop 4: the AccessConsequence becoming ACTIVE recomputes Employee.access_posture and Employee.active_suspension_count"
          - "recomputes Employee.compliance_state (-> DELINQUENT)"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
        note: "Four-hop causal chain. When manager_id is null, hop 2 produces nothing, so hops 3 and 4 do not fire and access_posture stays NONE while escalation_level still advances."
      - from: OVERDUE
        to: ASSIGNED
        trigger: "POST /awareness/curriculum-assignments/{id}/extension"
        actor: Manager
        preconditions:
          - "state == OVERDUE"
          - "X-User-ID == Employee(employee_id).manager_id"
          - "granted_extension_days + extension_days <= TrainingModule(module_id).max_extension_days"
          - "escalation_level < 3"
          - "attempt_count == 0"
          - "clock_now <= due_at + (granted_extension_days + extension_days) days"
        side_effects:
          - "sets granted_extension_days += extension_days, recomputes effective_due_at and next_reminder_due_at"
          - "resets escalation_level = 0"
          - "every EscalationNotice of this assignment with state == SENT becomes EXPIRED"
          - "every AccessConsequence with source_assignment_id == this assignment and state == ACTIVE becomes VOIDED with lift_reason_code = DEADLINE_EXTENDED"
          - "recomputes Employee.access_posture, Employee.active_suspension_count and Employee.compliance_state"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
        note: "Cycle back to the pre-deadline state; attempt_count == 0 selects ASSIGNED, otherwise the ESCALATED/OVERDUE -> IN_PROGRESS extension transition applies."
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /awareness/curriculum-assignments/{id}/extension"
        actor: Manager
        preconditions:
          - "state == ESCALATED"
          - "X-User-ID == Employee(employee_id).manager_id"
          - "granted_extension_days + extension_days <= TrainingModule(module_id).max_extension_days"
          - "escalation_level < 3"
          - "attempt_count == 0"
          - "clock_now <= due_at + (granted_extension_days + extension_days) days"
        side_effects:
          - "identical compensation set as the OVERDUE -> ASSIGNED extension transition, including EscalationNotice EXPIRED and AccessConsequence VOIDED"
        note: "Cycle from a deep state back to the initial state; this is the compensating action of the escalation cascade."
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/extension when attempt_count >= 1"
        actor: Manager
        preconditions:
          - "state == ESCALATED"
          - "X-User-ID == Employee(employee_id).manager_id"
          - "attempt_count >= 1"
          - "granted_extension_days + extension_days <= TrainingModule(module_id).max_extension_days"
          - "escalation_level < 3"
        side_effects:
          - "identical compensation set as the ESCALATED -> ASSIGNED extension transition"
      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /awareness/curriculum-assignments/{id}/void, the same-(employee, module) supersede cascade, or the offboard cascade"
        actor: ProgramAdmin | system
        preconditions:
          - "state IN {ASSIGNED, IN_PROGRESS, FAILED_ATTEMPT, OVERDUE, ESCALATED}"
        side_effects:
          - "sets void_reason_code, next_reminder_due_at = null"
          - "every EscalationNotice of this assignment with state == SENT becomes EXPIRED"
          - "every AccessConsequence with source_assignment_id == this assignment and state == ACTIVE becomes VOIDED with lift_reason_code = ASSIGNMENT_VOIDED"
          - "recomputes Employee.access_posture, Employee.active_suspension_count, Employee.compliance_state and both risk scores"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
        note: "Declared once for the whole non-terminal set; the void action is the compensating action that must restore Employee.active_suspension_count to its pre-escalation value."
      - from: ESCALATED
        to: VOIDED
        trigger: "POST /awareness/curriculum-assignments/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "state == ESCALATED"
        side_effects:
          - "identical compensation set as the ASSIGNED -> VOIDED transition; this is the rung that actually has notices and consequences to unwind"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /awareness/curriculum-assignments/{id}/extension when attempt_count >= 1"
        actor: Manager
        preconditions:
          - "state == OVERDUE"
          - "X-User-ID == Employee(employee_id).manager_id"
          - "attempt_count >= 1"
          - "granted_extension_days + extension_days <= TrainingModule(module_id).max_extension_days"
          - "escalation_level < 3"
        side_effects:
          - "identical compensation set as the OVERDUE -> ASSIGNED extension transition"
        note: "Completes the extension target matrix: attempt_count == 0 lands in ASSIGNED, attempt_count >= 1 lands in IN_PROGRESS."
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /awareness/curriculum-assignments/{id}/extension before the deadline passes"
        actor: Manager
        preconditions:
          - "state == ASSIGNED"
          - "X-User-ID == Employee(employee_id).manager_id"
          - "attempt_count == 0"
          - "granted_extension_days + extension_days <= TrainingModule(module_id).max_extension_days"
          - "escalation_level < 3"
          - "clock_now <= due_at + (granted_extension_days + extension_days) days"
        side_effects:
          - "sets granted_extension_days += extension_days, recomputes effective_due_at and next_reminder_due_at"
          - "there are no SENT notices or ACTIVE consequences to compensate at this rung, so the cascade is a no-op"
          - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
        note: "Self-loop that changes fields but not state: a pre-deadline grant is legal, which is why priority 11 does not reject an extension on a not-yet-overdue assignment."

  - entity: PhishingCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /awareness/campaigns/{id}/submit-for-review"
        actor: CampaignAuthor
        preconditions:
          - "state == DRAFT"
          - "X-User-ID == author_user_id"
          - "communication_policy_ack == true"
        side_effects:
          - "increments PhishingCampaign.version by 1"
      - from: REJECTED
        to: IN_REVIEW
        trigger: "POST /awareness/campaigns/{id}/submit-for-review"
        actor: CampaignAuthor
        preconditions:
          - "state == REJECTED"
          - "X-User-ID == author_user_id"
          - "communication_policy_ack == true"
        side_effects:
          - "clears rejection_reason to null"
          - "increments PhishingCampaign.version by 1"
        note: "Cycle: IN_REVIEW -> REJECTED -> IN_REVIEW may repeat without bound."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /awareness/campaigns/{id}/approve"
        actor: CampaignApprover
        preconditions:
          - "state == IN_REVIEW"
          - "X-User-ID != author_user_id (segregation of duties)"
          - "PhishingTemplate(template_id).harmful_flag_hits is empty"
          - "PhishingTemplate(template_id).review_state == APPROVED_FOR_USE"
        side_effects:
          - "sets reviewer_user_id = X-User-ID"
          - "increments PhishingCampaign.version by 1"
        note: "Branch A of the fork; side-effect set is disjoint from branch B (no rejection_reason, no return to the author)."
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /awareness/campaigns/{id}/reject"
        actor: CampaignApprover
        preconditions:
          - "state == IN_REVIEW"
          - "X-User-ID != author_user_id (segregation of duties)"
        side_effects:
          - "sets reviewer_user_id = X-User-ID and rejection_reason from the request"
          - "increments PhishingCampaign.version by 1"
        note: "Branch B of the fork: no template checks run at all, so a campaign on a harmful-theme template can still be rejected but never approved."
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /awareness/campaigns/{id}/schedule"
        actor: CampaignAuthor
        preconditions:
          - "state == APPROVED"
          - "expected_campaign_version == PhishingCampaign.version"
          - "scheduled_send_at > clock_now"
          - "no CommunicationWindow of window_type == SIMULATION_BLACKOUT whose scope_department is null or intersects the resolved cohort's departments contains scheduled_send_at in its closed interval [start_at, end_at]"
          - "for every cohort member, scheduled_send_at is NOT inside the half-open quiet window [reference_instant, quiet_period_until) of any of that employee's SimulationDelivery rows in state != EXCLUDED"
          - "the resolved cohort (calculations.cohort_resolution) is non-empty"
        side_effects:
          - "sets scheduled_send_at from the request"
          - "creates one SimulationDelivery per resolved cohort member in state QUEUED with queued_at = clock_now, base_difficulty_tier = campaign.difficulty_tier and effective_difficulty_tier from calculations.simulation_difficulty_escalation"
          - "creates one SimulationDelivery in state EXCLUDED (excluded_reason = ACCESS_SUSPENDED) for every otherwise-matching employee whose access_posture == SUSPENDED"
          - "increments each targeted Employee.reserved_simulation_slots by 1 and Employee.version by 1"
          - "sets target_count and evaluable_count"
          - "increments PhishingCampaign.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /awareness/campaigns/{id}/schedule (reschedule)"
        actor: CampaignAuthor
        preconditions:
          - "state == SCHEDULED"
          - "expected_campaign_version == PhishingCampaign.version"
          - "scheduled_send_at > clock_now"
          - "the same blackout, quiet-period and non-empty-cohort preconditions as the APPROVED -> SCHEDULED transition, evaluated against the NEW scheduled_send_at and ignoring this campaign's own QUEUED deliveries"
        side_effects:
          - "every SimulationDelivery of this campaign in state QUEUED becomes EXCLUDED with excluded_reason = CAMPAIGN_RESCHEDULED, decrementing that Employee.reserved_simulation_slots by 1"
          - "re-resolves the cohort and creates fresh QUEUED deliveries, incrementing reserved_simulation_slots again"
          - "overwrites scheduled_send_at, recomputes target_count and evaluable_count"
          - "increments PhishingCampaign.version by 1"
        note: "Self-loop: the new reservation set legitimately supersedes the prior one, which is why this endpoint is OCC-guarded (see concurrency_rules.campaign-schedule-stale-campaign)."
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /awareness/campaigns/{id}/launch"
        actor: ProgramAdmin
        preconditions:
          - "state == SCHEDULED"
          - "clock_now >= scheduled_send_at"
        side_effects:
          - "sets launched_at = clock_now"
          - "every SimulationDelivery of this campaign in state QUEUED whose Employee.employment_status == ACTIVE becomes DELIVERED with delivered_at = clock_now and outcome_class = PENDING"
          - "every SimulationDelivery of this campaign in state QUEUED whose Employee.employment_status == OFFBOARDED becomes EXCLUDED with excluded_reason = EMPLOYEE_OFFBOARDED"
          - "decrements each affected Employee.reserved_simulation_slots by 1 and increments Employee.version by 1"
          - "recomputes evaluable_count"
          - "increments PhishingCampaign.version by 1"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /awareness/campaigns/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "state == RUNNING"
          - "debrief_note is a non-empty string in the request (simulation communication policy)"
        side_effects:
          - "sets closed_at = clock_now and debrief_note from the request"
          - "every SimulationDelivery of this campaign in state DELIVERED becomes NO_INTERACTION with outcome_class = NO_INTERACTION"
          - "computes click_rate, report_rate, credential_rate and resilience_ratio per calculations.campaign_scorecard_rates"
          - "recomputes Employee.consecutive_clean_simulations, Employee.repeat_clicker_tier, Employee.risk_score_provisional and Employee.risk_score_settled for every cohort member"
          - "increments PhishingCampaign.version by 1"
        note: "Rates are only frozen here; before close they are recomputed on every read of the campaign."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /awareness/campaigns/{id}/cancel"
        actor: CampaignAuthor
        preconditions:
          - "state IN {DRAFT, IN_REVIEW, REJECTED, APPROVED}"
          - "X-User-ID == author_user_id"
        side_effects:
          - "sets cancelled_at = clock_now"
          - "increments PhishingCampaign.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /awareness/campaigns/{id}/cancel"
        actor: CampaignAuthor
        preconditions:
          - "state == SCHEDULED"
          - "X-User-ID == author_user_id"
        side_effects:
          - "sets cancelled_at = clock_now"
          - "every SimulationDelivery of this campaign in state QUEUED becomes EXCLUDED with excluded_reason = CAMPAIGN_CANCELLED"
          - "decrements each affected Employee.reserved_simulation_slots by 1 and increments Employee.version by 1"
          - "recomputes evaluable_count (-> 0)"
          - "increments PhishingCampaign.version by 1"
        note: "Compensating action of the schedule reservation: the reservation ledger invariant sum(Employee.reserved_simulation_slots) == count(SimulationDelivery where state == QUEUED) must hold before and after."

  - entity: SimulationDelivery
    initial_state: QUEUED
    terminal_states: [CREDENTIAL_SUBMITTED, NO_INTERACTION, EXCLUDED]
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /awareness/campaigns/{id}/launch"
        actor: ProgramAdmin
        preconditions:
          - "state == QUEUED"
          - "Employee(employee_id).employment_status == ACTIVE"
        side_effects:
          - "sets delivered_at = clock_now, quiet_period_until = delivered_at + QUIET_PERIOD_DAYS, outcome_class = PENDING"
          - "decrements Employee.reserved_simulation_slots by 1"
          - "increments SimulationDelivery.version by 1"
      - from: QUEUED
        to: EXCLUDED
        trigger: "POST /awareness/campaigns/{id}/cancel, POST /awareness/campaigns/{id}/schedule (reschedule), POST /awareness/campaigns/{id}/launch with an OFFBOARDED employee, or POST /awareness/employees/{id}/offboard"
        actor: ProgramAdmin | CampaignAuthor | system
        preconditions:
          - "state == QUEUED"
        side_effects:
          - "sets excluded_reason and outcome_class = EXCLUDED"
          - "decrements Employee.reserved_simulation_slots by 1"
          - "increments SimulationDelivery.version by 1"
      - from: DELIVERED
        to: REPORTED
        trigger: "POST /awareness/simulation-deliveries/{id}/interactions with event_type == REPORT"
        actor: ProgramAdmin
        preconditions:
          - "state == DELIVERED"
          - "campaign state == RUNNING"
          - "occurred_at >= delivered_at and occurred_at <= clock_now"
        side_effects:
          - "sets first_report_at = occurred_at, time_to_report_minutes, outcome_class = REPORTED_ONLY"
          - "increments SimulationDelivery.version by 1"
      - from: DELIVERED
        to: CLICKED
        trigger: "POST /awareness/simulation-deliveries/{id}/interactions with event_type == CLICK"
        actor: ProgramAdmin
        preconditions:
          - "state == DELIVERED"
          - "campaign state == RUNNING"
          - "occurred_at >= delivered_at and occurred_at <= clock_now"
        side_effects:
          - "sets first_click_at = occurred_at, outcome_class = CLICKED_NO_REPORT"
          - "recomputes Employee.repeat_clicker_tier and Employee.consecutive_clean_simulations (-> 0)"
          - "when the recomputed repeat_clicker_tier >= 2 and no RepeatClickerIntervention of this employee is in state IN {OPEN, ESCALATED_TO_MANAGER, COACHING_ASSIGNED, COACHING_COMPLETED}, creates a RepeatClickerIntervention (triggering_delivery_id = this delivery)"
          - "recomputes Employee.risk_score_provisional"
          - "increments SimulationDelivery.version by 1 and Employee.version by 1"
      - from: REPORTED
        to: CLICKED
        trigger: "POST /awareness/simulation-deliveries/{id}/interactions with event_type == CLICK after a REPORT"
        actor: ProgramAdmin
        preconditions:
          - "state == REPORTED"
          - "campaign state == RUNNING"
          - "occurred_at >= delivered_at and occurred_at <= clock_now"
        side_effects:
          - "sets first_click_at = occurred_at, outcome_class = CLICKED_THEN_REPORTED"
          - "the same repeat-clicker recomputation and intervention cascade as DELIVERED -> CLICKED"
          - "increments SimulationDelivery.version by 1 and Employee.version by 1"
        note: "A reporter who later clicks is a clicker: any CLICK event dominates the delivery state, which is exactly why report_rate and click_rate can sum above 1."
      - from: CLICKED
        to: CLICKED
        trigger: "POST /awareness/simulation-deliveries/{id}/interactions with event_type == REPORT after a CLICK"
        actor: ProgramAdmin
        preconditions:
          - "state == CLICKED"
          - "campaign state == RUNNING"
          - "occurred_at >= delivered_at and occurred_at <= clock_now"
        side_effects:
          - "sets first_report_at = occurred_at (when still null), time_to_report_minutes, outcome_class = CLICKED_THEN_REPORTED"
          - "sets InteractionEvent.superseding_effect = NONE (the delivery state does not move)"
          - "increments SimulationDelivery.version by 1"
        note: "Self-loop that changes fields but not state; the delivery still counts in the click numerator AND in the report numerator."
      - from: CLICKED
        to: CREDENTIAL_SUBMITTED
        trigger: "POST /awareness/simulation-deliveries/{id}/interactions with event_type == CREDENTIAL_SUBMIT"
        actor: ProgramAdmin
        preconditions:
          - "state == CLICKED"
          - "campaign state == RUNNING"
          - "PhishingTemplate(campaign.template_id).credential_capture_enabled == true"
          - "occurred_at >= first_click_at and occurred_at <= clock_now"
        side_effects:
          - "sets credential_submitted_at = occurred_at, outcome_class = CREDENTIAL_SUBMITTED"
          - "recomputes Employee.repeat_clicker_tier (a delivery counts as at most one failure regardless of how many failure events it carries)"
          - "the intervention cascade of DELIVERED -> CLICKED re-evaluated at the new tier; a tier of exactly 3 opens the intervention in state ESCALATED_TO_MANAGER instead of OPEN"
          - "recomputes Employee.risk_score_provisional"
          - "increments SimulationDelivery.version by 1 and Employee.version by 1"
      - from: DELIVERED
        to: NO_INTERACTION
        trigger: "POST /awareness/campaigns/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "state == DELIVERED"
          - "campaign state == RUNNING"
        side_effects:
          - "sets outcome_class = NO_INTERACTION"
          - "increments Employee.consecutive_clean_simulations by 1"
          - "increments SimulationDelivery.version by 1 and Employee.version by 1"
        note: "REPORTED deliveries also increment consecutive_clean_simulations at close but keep state REPORTED, which is therefore a quasi-terminal state rather than a listed terminal one."

  - entity: EscalationNotice
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, EXPIRED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /awareness/escalation-notices/{id}/acknowledge"
        actor: Manager
        preconditions:
          - "state == SENT"
          - "X-User-ID == manager_id"
          - "action_plan_note is a non-empty string"
        side_effects:
          - "sets acknowledged_at = clock_now and action_plan_note"
          - "increments EscalationNotice.version by 1"
      - from: SENT
        to: EXPIRED
        trigger: "system: the assignment reaches COMPLETED or VOIDED, or an extension resets escalation_level, or the employee is offboarded"
        actor: system
        preconditions:
          - "state == SENT"
        side_effects:
          - "increments EscalationNotice.version by 1"
        note: "An ACKNOWLEDGED notice is never re-expired; the compensation cascade only touches SENT notices."

  - entity: AccessConsequence
    initial_state: ACTIVE
    terminal_states: [LIFTED, VOIDED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /awareness/access-consequences/{id}/lift, the same-type supersede cascade, or the assignment COMPLETED cascade"
        actor: ProgramAdmin | system
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "sets lifted_at = clock_now and lift_reason_code (MANUAL_LIFT, SUPERSEDED or TRAINING_COMPLETED)"
          - "recomputes Employee.access_posture = rank_to_posture(max severity_rank over remaining ACTIVE rows) and Employee.active_suspension_count"
          - "increments AccessConsequence.version by 1 and Employee.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "system: the source assignment is VOIDED, an extension is granted, or the employee is offboarded"
        actor: system
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "sets lifted_at = clock_now and lift_reason_code (ASSIGNMENT_VOIDED, DEADLINE_EXTENDED or EMPLOYEE_OFFBOARDED)"
          - "recomputes Employee.access_posture and Employee.active_suspension_count"
          - "increments AccessConsequence.version by 1 and Employee.version by 1"
        note: "VOIDED is the compensated exit (the consequence should never have existed); LIFTED is the earned exit."

  - entity: RepeatClickerIntervention
    initial_state: OPEN
    terminal_states: [CLOSED_RESOLVED]
    transitions:
      - from: OPEN
        to: COACHING_ASSIGNED
        trigger: "POST /awareness/interventions/{id}/assign-coaching"
        actor: ProgramAdmin
        preconditions:
          - "state IN {OPEN, ESCALATED_TO_MANAGER}"
          - "TrainingModule(module_id).module_type == REMEDIAL"
          - "TrainingModule(module_id).status == PUBLISHED"
        side_effects:
          - "creates a CurriculumAssignment (assignment_reason = REMEDIAL, employee_id = this employee) and sets coaching_assignment_id"
          - "increments Employee.version by 1"
          - "increments RepeatClickerIntervention.version by 1"
      - from: ESCALATED_TO_MANAGER
        to: COACHING_ASSIGNED
        trigger: "POST /awareness/interventions/{id}/assign-coaching"
        actor: ProgramAdmin
        preconditions:
          - "state == ESCALATED_TO_MANAGER"
          - "TrainingModule(module_id).module_type == REMEDIAL"
          - "TrainingModule(module_id).status == PUBLISHED"
        side_effects:
          - "identical side-effect set as the OPEN -> COACHING_ASSIGNED transition"
      - from: COACHING_ASSIGNED
        to: COACHING_COMPLETED
        trigger: "system: the coaching CurriculumAssignment reaches COMPLETED"
        actor: system
        preconditions:
          - "state == COACHING_ASSIGNED"
          - "CurriculumAssignment(coaching_assignment_id).state == COMPLETED"
        side_effects:
          - "increments RepeatClickerIntervention.version by 1"
        note: "Bubble-up: the child assignment's terminal state drives the parent intervention."
      - from: COACHING_COMPLETED
        to: CLOSED_RESOLVED
        trigger: "POST /awareness/interventions/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "state == COACHING_COMPLETED"
        side_effects:
          - "sets closed_at = clock_now and resolution_code"
          - "when Employee.consecutive_clean_simulations >= CLEAN_STREAK_FOR_DECAY, decrements Employee.repeat_clicker_tier by 1 (floor 0) and sets tier_decay_applied = true"
          - "recomputes Employee.risk_score_provisional and Employee.risk_score_settled"
          - "increments RepeatClickerIntervention.version by 1 and Employee.version by 1"
      - from: OPEN
        to: ESCALATED_TO_MANAGER
        trigger: "system: a further failure delivery pushes repeat_clicker_tier to 3 while the intervention is OPEN"
        actor: system
        preconditions:
          - "state == OPEN"
          - "Employee.repeat_clicker_tier == 3"
        side_effects:
          - "increments RepeatClickerIntervention.version by 1"

concurrency_rules:
  - rule_id: assignment-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /awareness/curriculum-assignments"
    occ_field: "expected_employee_version"
    description: |
      Creating a CurriculumAssignment against an Employee whose version has advanced since the
      client last observed it is rejected with a stale-version error. This matters because a
      create for an (employee, module) pair that already has a non-terminal assignment
      legitimately supersedes that assignment (the older row is VOIDED with
      void_reason_code = SUPERSEDED_BY_NEW_ASSIGNMENT), so the second create would otherwise
      succeed and silently discard work the client never saw.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
  - rule_id: access-consequence-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /awareness/employees/{id}/access-consequences"
    occ_field: "expected_employee_version"
    description: |
      Applying an AccessConsequence to an Employee whose version has advanced since the client
      last read it is rejected with a stale-version error. A same-consequence_type ACTIVE row is
      legitimately superseded (LIFTED with lift_reason_code = SUPERSEDED) by the new one, and the
      derived severity in calculations.access_consequence_severity depends on the posture the
      client believed the employee had, so a stale view produces the wrong rung.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
  - rule_id: campaign-schedule-stale-campaign
    parent_entity: PhishingCampaign
    write_endpoint: "POST /awareness/campaigns/{id}/schedule"
    occ_field: "expected_campaign_version"
    description: |
      Scheduling (or rescheduling) a PhishingCampaign whose version has advanced since the client
      last read it is rejected with a stale-version error. Because the SCHEDULED -> SCHEDULED
      self-loop lets a new reservation set legitimately supersede the prior one (releasing every
      QUEUED delivery), a client acting on a stale view would silently destroy the reservation
      set another operator just created.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

calculations:
  - name: employee_tenure_band
    trigger: "on every read or write that surfaces Employee.tenure_band, and at cohort resolution during POST /awareness/campaigns/{id}/schedule"
    algorithm: threshold
    formula: |
      days_since_hire = floor((clock_now - parse_utc(hire_date + "T00:00:00Z")) / 86400 seconds)
      if days_since_hire < 90:      tenure_band = NEW_HIRE
      elif days_since_hire < 365:   tenure_band = EARLY
      elif days_since_hire < 1095:  tenure_band = ESTABLISHED
      else:                         tenure_band = VETERAN
    input_set: "the single Employee row; hire_date is always interpreted at UTC midnight; days_since_hire is floored, never rounded"
    constants:
      NEW_HIRE_MAX_DAYS_EXCLUSIVE: 90
      EARLY_MAX_DAYS_EXCLUSIVE: 365
      ESTABLISHED_MAX_DAYS_EXCLUSIVE: 1095
    precision: "integer days, floor"

  - name: harmful_theme_screen
    trigger: "on POST /awareness/phishing-templates, on POST /awareness/phishing-templates/{id}/approve-for-use, and on POST /awareness/campaigns/{id}/approve"
    algorithm: aggregation
    formula: |
      harmful_flag_hits = [t for t in PROHIBITED_THEME_TAGS if t in template.theme_tags]
      # ordered by PROHIBITED_THEME_TAGS declaration order, NOT by the order the author listed them
      screen_passes = (len(harmful_flag_hits) == 0)
    input_set: "the single PhishingTemplate row's theme_tags array; the screen is advisory at template creation (the row is still created) and blocking at both approval endpoints"
    constants:
      PROHIBITED_THEME_TAGS: [BONUS_COMPENSATION, LAYOFF_NOTICE, MEDICAL_RESULT, CHARITY_APPEAL, FAMILY_EMERGENCY]
    precision: "exact set intersection"
    note: "Realistic pretexts are the point of the program, so URGENCY, AUTHORITY, CURIOSITY and REWARD are always allowed; the five prohibited tags are the themes that cause real harm to the recipient."

  - name: assignment_due_date
    trigger: "on POST /awareness/curriculum-assignments, on the assign-coaching cascade, and re-evaluated (effective_due_at only) on POST /awareness/curriculum-assignments/{id}/extension"
    algorithm: threshold
    formula: |
      base_days = { NEW_HIRE: 14, ANNUAL: 30, ROLE_CHANGE: 21, REMEDIAL: 7 }[assignment_reason]
      if TrainingModule(module_id).criticality == HIGH:
          window_days = max(3, floor(base_days / 2))
      else:
          window_days = base_days
      due_at = assigned_at + window_days days
      effective_due_at = due_at + granted_extension_days days
    input_set: "assignment_reason from the request, criticality from the referenced TrainingModule, assigned_at = clock_now at creation; granted_extension_days starts at 0 and only the extension action changes it"
    constants:
      BASE_DAYS_NEW_HIRE: 14
      BASE_DAYS_ANNUAL: 30
      BASE_DAYS_ROLE_CHANGE: 21
      BASE_DAYS_REMEDIAL: 7
      HIGH_CRITICALITY_FLOOR_DAYS: 3
    precision: "whole days added to the instant; no truncation to midnight, so a 09:00Z assignment is due at 09:00Z"

  - name: reminder_cadence_schedule
    trigger: "on POST /awareness/curriculum-assignments (initial value), on POST /awareness/curriculum-assignments/{id}/extension, and on every POST /awareness/compliance-sweeps (step A)"
    algorithm: chronological
    formula: |
      offsets = TrainingModule(module_id).reminder_offsets_days      # authored order is authoritative
      if reminders_sent >= len(offsets):
          next_reminder_due_at = null
      else:
          next_reminder_due_at = effective_due_at - offsets[reminders_sent] days
      # sweep step A, at most ONE reminder per assignment per sweep:
      if next_reminder_due_at is not null and next_reminder_due_at <= clock_now:   # inclusive boundary
          reminders_sent = reminders_sent + 1
          last_reminder_at = clock_now
          next_reminder_due_at = recomputed with the new reminders_sent
    input_set: "assignments in state IN {ASSIGNED, IN_PROGRESS, FAILED_ATTEMPT, OVERDUE, ESCALATED}, processed in created_at ASC order; COMPLETED and VOIDED assignments have next_reminder_due_at = null and are skipped"
    constants:
      DEFAULT_REMINDER_OFFSETS_DAYS: [7, 3, 1, -2]
      MAX_REMINDERS_PER_SWEEP_PER_ASSIGNMENT: 1
    precision: "instant comparison at second resolution; the boundary is inclusive (<=), so a sweep run exactly at next_reminder_due_at does send the reminder"
    note: "A single sweep never skips ahead: an assignment whose first three reminder instants are all in the past emits exactly one reminder per sweep, so three sweeps are needed to reach reminders_sent == 3."

  - name: escalation_ladder
    trigger: "on POST /awareness/compliance-sweeps (step C)"
    algorithm: threshold
    formula: |
      days_overdue = max(0, floor((clock_now - effective_due_at) / 86400 seconds))
      if   days_overdue >= 14: target_level = 3
      elif days_overdue >= 7:  target_level = 2
      elif days_overdue >= 1:  target_level = 1
      else:                    target_level = 0
      # only forward movement, one rung at a time is NOT required: the sweep walks
      # L from escalation_level + 1 to target_level inclusive, firing the hop-2/hop-3/hop-4
      # cascade for each L, so a sweep run 20 days late creates notices for levels 1, 2 and 3
      # in ascending L order.
      escalation_level = max(escalation_level, target_level)
    input_set: "assignments in state IN {OVERDUE, ESCALATED} after step B has run in the same sweep; ordered by created_at ASC"
    constants:
      ESCALATION_L1_DAYS: 1
      ESCALATION_L2_DAYS: 7
      ESCALATION_L3_DAYS: 14
    precision: "integer days, floor; days_overdue is 0 for the first 23h59m59s after effective_due_at"

  - name: access_consequence_severity
    trigger: "on POST /awareness/employees/{id}/access-consequences and on hop 3 of the escalation cascade (creation of an EscalationNotice with level >= 2)"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER. The severity of the new row depends on the employee's posture,
      # and the posture depends on the set of ACTIVE rows including the new one - the order below
      # breaks that circularity explicitly.
      step 1: pre_rank = max(severity_rank of AccessConsequence rows where employee_id == E
                             and state == ACTIVE), or 0 when the set is empty
              # the row being created is NOT part of this set
      step 2: if request supplies consequence_type:
                  new_rank = rank_of(consequence_type)          # WARNING=1, MFA_REVIEW=2, SYSTEM_ACCESS_SUSPENSION=3
              else:
                  trigger_rank = EscalationNotice.level when the cascade fired this, else 1
                  new_rank = min(3, max(pre_rank + 1, trigger_rank))
      step 3: create AccessConsequence(consequence_type = type_of(new_rank), severity_rank = new_rank,
                                       state = ACTIVE, applied_at = clock_now)
              every prior AccessConsequence row of E with the SAME consequence_type and state == ACTIVE
              becomes LIFTED with lift_reason_code = SUPERSEDED and lifted_at = clock_now
      step 4: post_rank = max(severity_rank over E's rows with state == ACTIVE)   # now includes the new row
              Employee.access_posture = { 0: NONE, 1: WARNED, 2: ELEVATED_REVIEW, 3: SUSPENDED }[post_rank]
      step 5: Employee.active_suspension_count = count of E's rows with state == ACTIVE
                                                  and consequence_type == SYSTEM_ACCESS_SUSPENSION
    input_set: "AccessConsequence rows of the single Employee; only state == ACTIVE rows enter steps 1, 4 and 5; LIFTED and VOIDED rows are excluded from all three"
    constants:
      RANK_WARNING: 1
      RANK_MFA_REVIEW: 2
      RANK_SYSTEM_ACCESS_SUSPENSION: 3
      MAX_RANK: 3
    precision: "integer ranks; step 2's min/max composition is evaluated left to right"
    note: "Because step 1 excludes the new row, applying a second derived consequence to an employee already at WARNED yields MFA_REVIEW, and a third yields SYSTEM_ACCESS_SUSPENSION; a fourth stays at SYSTEM_ACCESS_SUSPENSION (capped) and supersedes the third."

  - name: repeat_clicker_tier
    trigger: "on every InteractionEvent creation that moves a delivery into CLICKED or CREDENTIAL_SUBMITTED, on POST /awareness/campaigns/{id}/close, and on POST /awareness/interventions/{id}/close"
    algorithm: threshold
    formula: |
      window_start = clock_now - REPEAT_WINDOW_DAYS days
      failure_deliveries = distinct SimulationDelivery rows D where
            D.employee_id == E
        and D.state IN {CLICKED, CREDENTIAL_SUBMITTED}
        and PhishingCampaign(D.campaign_id).state IN {RUNNING, CLOSED}
        and D.delivered_at >= window_start                      # inclusive lower bound
      f = count(failure_deliveries)                             # one delivery counts once, however many failure events it carries
      if   f == 0: tier = 0
      elif f == 1: tier = 1
      elif f <= 3: tier = 2
      else:        tier = 3
      tier = max(0, tier - (1 if intervention_close_decay_applied else 0))
    input_set: "the employee's own deliveries only; EXCLUDED, QUEUED, DELIVERED, REPORTED and NO_INTERACTION deliveries never count as failures, and deliveries of DRAFT/IN_REVIEW/APPROVED/SCHEDULED/CANCELLED campaigns are outside the input set"
    constants:
      REPEAT_WINDOW_DAYS: 180
      TIER_2_MIN_FAILURES: 2
      TIER_3_MIN_FAILURES: 4
      CLEAN_STREAK_FOR_DECAY: 3
    precision: "integer counts; the tier-2 threshold is >= 2 (exactly two failures already opens an intervention), the tier-3 threshold is >= 4"

  - name: simulation_difficulty_escalation
    trigger: "on POST /awareness/campaigns/{id}/schedule, once per resolved cohort member; frozen onto SimulationDelivery.effective_difficulty_tier and never recomputed afterwards"
    algorithm: weighted_scoring
    formula: |
      base_rank = { TIER_1_BASIC: 1, TIER_2_TARGETED: 2, TIER_3_SPEAR: 3 }[campaign.difficulty_tier]
      streak_relief = 1 if Employee.consecutive_clean_simulations >= CLEAN_STREAK_FOR_DECAY else 0
      raw_rank = max(base_rank, base_rank + Employee.repeat_clicker_tier - streak_relief)
      capped_rank = min(3, raw_rank)
      if Employee.tenure_band == NEW_HIRE:
          effective_rank = min(capped_rank, 2)        # a brand-new hire is never spear-phished
      else:
          effective_rank = capped_rank
      effective_difficulty_tier = { 1: TIER_1_BASIC, 2: TIER_2_TARGETED, 3: TIER_3_SPEAR }[effective_rank]
      # step 4 - targeted re-simulation cadence, read back by RepeatClickerIntervention:
      simulation_frequency_days = 14 if current_tier == 3 else (30 if current_tier == 2 else 45)
    input_set: "four inputs, all read at schedule time: campaign.difficulty_tier, Employee.repeat_clicker_tier, Employee.consecutive_clean_simulations and Employee.tenure_band"
    constants:
      CLEAN_STREAK_FOR_DECAY: 3
      MAX_RANK: 3
      NEW_HIRE_RANK_CAP: 2
      FREQUENCY_DAYS_TIER_3: 14
      FREQUENCY_DAYS_TIER_2: 30
      FREQUENCY_DAYS_BASELINE: 45
    precision: "integer ranks; the nested max-then-min composition is evaluated exactly as written (max first, then the global cap, then the NEW_HIRE cap)"
    note: "The three-way interaction is non-linear: a repeat_clicker_tier of 2 on a TIER_2 campaign yields TIER_3_SPEAR for a VETERAN but TIER_2_TARGETED for a NEW_HIRE, and a clean streak of 3 pulls the VETERAN back down to TIER_2_TARGETED."

  - name: cohort_resolution
    trigger: "on POST /awareness/campaigns/{id}/schedule, before any SimulationDelivery is created"
    algorithm: aggregation
    formula: |
      candidates = Employee rows E where
            E.employment_status == ACTIVE
        and (campaign.target_departments is empty OR E.department in campaign.target_departments)
        and (campaign.target_tenure_bands is empty OR employee_tenure_band(E) in campaign.target_tenure_bands)
        and E.repeat_clicker_tier >= campaign.target_min_repeat_tier
      # deterministic creation order for the delivery rows:
      cohort = candidates ordered by created_at ASC
      suspended = [E in cohort where E.access_posture == SUSPENDED]     # get EXCLUDED deliveries
      evaluable = [E in cohort where E.access_posture != SUSPENDED]      # get QUEUED deliveries
      target_count = len(cohort)
      evaluable_count = len(evaluable)
      if len(evaluable) == 0: reject with ERR_EMPTY_TARGET_COHORT
    input_set: "every Employee row with employment_status == ACTIVE; OFFBOARDED employees are never candidates; the filters are ANDed and an empty array means 'no constraint on this axis'"
    constants: { QUIET_PERIOD_DAYS: 5 }
    precision: "exact set membership; delivery rows are created in cohort order (created_at ASC), never in id order"

  - name: campaign_scorecard_rates
    trigger: "on GET /awareness/campaigns/{id}, on GET /awareness/campaigns/{id}/scorecard, and frozen on POST /awareness/campaigns/{id}/close"
    algorithm: aggregation
    formula: |
      # ---- step 1: per-delivery classification (chronological, pinned) ----
      events of a delivery are ordered by occurred_at ASC, tie-broken by sequence_index ASC
      outcome_class(D) =
          EXCLUDED               if D.state == EXCLUDED
          CREDENTIAL_SUBMITTED   elif D.credential_submitted_at is not null
          CLICKED_THEN_REPORTED  elif D.first_click_at is not null and D.first_report_at is not null
          CLICKED_NO_REPORT      elif D.first_click_at is not null
          REPORTED_ONLY          elif D.first_report_at is not null
          PENDING                elif D.state == DELIVERED
          NO_INTERACTION         else
      # ---- step 2: raw counts over evaluable deliveries ----
      evaluable      = deliveries of this campaign with state != EXCLUDED
      n              = count(evaluable)
      clicked_n      = count(D in evaluable where D.first_click_at is not null)     # includes CREDENTIAL_SUBMITTED and CLICKED_THEN_REPORTED
      reported_n     = count(D in evaluable where D.first_report_at is not null)     # includes CLICKED_THEN_REPORTED
      credential_n   = count(D in evaluable where D.credential_submitted_at is not null)
      # ---- step 3: rounding order is PINNED - divide raw counts, THEN round ----
      if n == 0:
          click_rate = report_rate = credential_rate = resilience_ratio = null
      else:
          click_rate       = round_half_up(clicked_n / n, 4)
          report_rate      = round_half_up(reported_n / n, 4)
          credential_rate  = round_half_up(credential_n / n, 4)
          resilience_ratio = round_half_up(reported_n / max(1, clicked_n), 4)
      # ---- step 4: segments (department and tenure_band) ----
      for each segment S (grouping key = Employee.department, then Employee.tenure_band frozen at delivery creation):
          n_S = count of evaluable deliveries whose employee is in S
          rates of S are computed from S's OWN raw counts and then rounded to 4 dp
          n_S == 0 -> every rate of S is null (never 0.0000)
      # Program-level rates are NEVER the average of the segment rates: sum-then-round, not
      # round-then-average. With 3 clicks over 7 deliveries split as 2/3 and 1/4, the program
      # click_rate is 0.4286, not (0.6667 + 0.2500) / 2 = 0.4584.
    input_set: "SimulationDelivery rows of the single campaign; state == EXCLUDED rows are outside every numerator AND the denominator; DELIVERED (PENDING) rows are inside the denominator, so the report rate of a RUNNING campaign rises as reports arrive"
    constants:
      RATE_DECIMALS: 4
    precision: "4 decimal places, round_half_up, applied exactly once at the end of each rate"
    note: "report_rate and click_rate are independent primary metrics: a CLICKED_THEN_REPORTED delivery is counted in BOTH numerators, so click_rate + report_rate may exceed 1.0000. That double counting is deliberate - reporting culture is measured even among people who clicked."

  - name: employee_risk_score
    trigger: "on every read of an Employee, and recomputed as a side effect of every delivery state change, assignment state change, compliance sweep and intervention close"
    algorithm: weighted_scoring
    formula: |
      # variant-dependent input set, see variants below
      penalty_units = (CREDENTIAL_WEIGHT * credential_failures)
                    + (CLICK_WEIGHT      * click_failures)
                    + (OVERDUE_WEIGHT    * delinquent_assignments)
      weighted_penalty = penalty_units * (1 + TIER_MULTIPLIER_STEP * Employee.repeat_clicker_tier)
      credit_units = (REPORT_CREDIT * report_deliveries)
                   + (NEW_HIRE_RELIEF if Employee.tenure_band == NEW_HIRE else 0)
                   + (NO_INTERACTION_CREDIT * settled_no_interaction_deliveries)
      raw = weighted_penalty - credit_units
      score = max(0.00, min(100.00, round_half_up(raw, 2)))
      # where, for both variants:
      #   credential_failures      = count of the employee's in-scope deliveries with credential_submitted_at != null
      #   click_failures           = count of the employee's in-scope deliveries with first_click_at != null
      #                              AND credential_submitted_at == null
      #   report_deliveries        = count of the employee's in-scope deliveries with first_report_at != null
      #   delinquent_assignments   = count of the employee's CurriculumAssignment rows in state IN {OVERDUE, ESCALATED}
      #   repeat_clicker_tier      = the single variant-independent value from calculations.repeat_clicker_tier
    input_set: "see variants: the in-scope delivery set is the only thing that differs; delinquent_assignments and repeat_clicker_tier are identical in both variants"
    constants:
      CREDENTIAL_WEIGHT: 18
      CLICK_WEIGHT: 10
      OVERDUE_WEIGHT: 8
      REPORT_CREDIT: 6
      NEW_HIRE_RELIEF: 5
      NO_INTERACTION_CREDIT: 2
      TIER_MULTIPLIER_STEP: 0.10
    precision: "2 decimal places, round_half_up, applied once to raw before clamping to [0.00, 100.00]"
    variants:
      - name: PROVISIONAL
        when: "surfaced as Employee.risk_score_provisional; the in-flight view used for operational triage"
        difference: "in-scope deliveries are those whose campaign state IN {RUNNING, CLOSED}; settled_no_interaction_deliveries is forced to 0, so a clean simulation earns no credit until its campaign closes"
      - name: SETTLED
        when: "surfaced as Employee.risk_score_settled; the audit view used for the effectiveness report"
        difference: "in-scope deliveries are ONLY those whose campaign state == CLOSED, and settled_no_interaction_deliveries = count of those in-scope deliveries with state == NO_INTERACTION, each earning NO_INTERACTION_CREDIT"
    note: "Identical data yields different numbers: an employee who ignored a closed campaign and clicked in a still-running one scores 11.00 provisional versus 0.00 settled."

  - name: program_effectiveness_correlation
    trigger: "on GET /awareness/effectiveness-report"
    algorithm: projection
    formula: |
      buckets = calendar months (UTC) intersecting [period_start, period_end), half-open, ordered ASC
      for each bucket b:
          closed_deliveries(b) = SimulationDelivery rows whose campaign.state == CLOSED,
                                 campaign.closed_at inside b, state != EXCLUDED,
                                 filtered to department when the department query param is supplied
          report_rate(b) = round_half_up(count(D with first_report_at != null) / count(closed_deliveries(b)), 4)
                           or null when count(closed_deliveries(b)) == 0
          incident_count(b) = count of IncidentRecord rows with phish_related == true and
                              occurred_at inside b (and matching department when supplied)
      pairs are formed per variant (see below); buckets whose report_rate is null are dropped
      after pairing, together with their partner
      if len(pairs) < 2 or variance of either series == 0:
          correlation = null and correlation_reason_code = INSUFFICIENT_PAIRS or ZERO_VARIANCE
      else:
          correlation = round_half_up(pearson_r(report_rates, incident_counts), 4)
    input_set: "CLOSED campaigns bucketed by closed_at and phish_related IncidentRecord rows bucketed by occurred_at; MALWARE_DELIVERY and DATA_LOSS incidents are excluded from the incident series entirely"
    constants:
      LAG_MONTHS: 1
      MIN_PAIRS: 2
      CORRELATION_DECIMALS: 4
    precision: "4 decimal places, round_half_up; report_rate per bucket is itself rounded to 4 dp BEFORE entering the correlation, which is the pinned order"
    variants:
      - name: CONCURRENT
        when: "variant == CONCURRENT on the query string"
        difference: "bucket b's report_rate is paired with bucket b's own incident_count; every bucket in the period can form a pair"
      - name: LAGGED
        when: "variant == LAGGED on the query string"
        difference: "bucket b's report_rate is paired with bucket b+1's incident_count (LAG_MONTHS = 1); the final bucket of the period contributes its report_rate to nothing and is dropped, so the pair count is one lower and the correlation differs for identical data"

  - name: employee_compliance_state
    trigger: "as a side effect of every CurriculumAssignment state transition, of every POST /awareness/compliance-sweeps, and of POST /awareness/employees/{id}/offboard"
    algorithm: aggregation
    formula: |
      a = CurriculumAssignment rows where employee_id == E
      if any(x.state == ESCALATED for x in a):        compliance_state = DELINQUENT
      elif any(x.state == OVERDUE for x in a):        compliance_state = AT_RISK
      else:                                          compliance_state = COMPLIANT
    input_set: "every CurriculumAssignment row of the employee regardless of module or reason; COMPLETED, VOIDED, ASSIGNED, IN_PROGRESS and FAILED_ATTEMPT rows contribute nothing"
    constants: {}
    precision: "exact enum selection; ESCALATED dominates OVERDUE"
    note: "This axis is fully independent of access_posture: completing the last escalated module returns compliance_state to COMPLIANT in the same request, while access_posture only moves when the AccessConsequence rows themselves exit ACTIVE."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list in the API endpoint table"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query parameters are well formed: required fields present, enum members valid, arrays free of duplicates, integers inside their declared ranges, score_pct in 0..100, extension_days >= 1, limit in 1..100, offset >= 0, end_at strictly after start_at, period_end strictly after period_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "path-templated resources exist, validated left to right"
    error_id: ERR_EMPLOYEE_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 5
    category: existence
    check: "body-supplied foreign keys resolve: employee_id, module_id, template_id, manager_id, root_cause_employee_id"
    error_id: ERR_EMPLOYEE_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /awareness/employees, POST /awareness/curriculum-assignments, POST /awareness/campaigns, POST /awareness/incidents, POST /awareness/interventions/{id}/assign-coaching"
  - priority: 6
    category: business_constraint
    check: "uniqueness: Employee.email and TrainingModule.code are unique across all rows"
    error_id: ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_MODULE_CODE
    http_status: 409
    applies_to: "POST /awareness/employees, POST /awareness/training-modules"
  - priority: 7
    category: auth
    check: "ownership: a Learner's X-User-ID equals CurriculumAssignment.employee_id"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /awareness/curriculum-assignments/{id}/start, /submit, /retake"
  - priority: 8
    category: auth
    check: "ownership: a Manager's X-User-ID equals Employee(assignment.employee_id).manager_id, or equals EscalationNotice.manager_id"
    error_id: ERR_NOT_DIRECT_REPORT_MANAGER
    http_status: 403
    applies_to: "POST /awareness/curriculum-assignments/{id}/extension, POST /awareness/escalation-notices/{id}/acknowledge"
  - priority: 9
    category: auth
    check: "ownership: a CampaignAuthor's X-User-ID equals PhishingCampaign.author_user_id"
    error_id: ERR_NOT_CAMPAIGN_AUTHOR
    http_status: 403
    applies_to: "POST /awareness/campaigns/{id}/submit-for-review, /schedule, /cancel"
  - priority: 10
    category: business_referential
    check: "OCC: the supplied expected_employee_version or expected_campaign_version equals the current version of the named parent"
    error_id: ERR_STALE_EMPLOYEE_VERSION | ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /awareness/curriculum-assignments, POST /awareness/employees/{id}/access-consequences, POST /awareness/campaigns/{id}/schedule"
  - priority: 11
    category: state
    check: "the target resource is in a state from which the requested transition is declared in the state machine table"
    error_id: ERR_ASSIGNMENT_STATE_INVALID | ERR_CAMPAIGN_STATE_INVALID | ERR_DELIVERY_NOT_INTERACTABLE | ERR_INTERVENTION_STATE_INVALID | ERR_TEMPLATE_STATE_INVALID | ERR_MODULE_STATE_INVALID | ERR_NOTICE_STATE_INVALID | ERR_CONSEQUENCE_ALREADY_LIFTED
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 12
    category: state
    check: "the acting employee is not offboarded: Employee(employee_id).employment_status == ACTIVE"
    error_id: ERR_EMPLOYEE_OFFBOARDED
    http_status: 409
    applies_to: "POST /awareness/curriculum-assignments, POST /awareness/curriculum-assignments/{id}/start, POST /awareness/employees/{id}/offboard, POST /awareness/employees/{id}/access-consequences"
  - priority: 13
    category: business_safety
    check: "the campaign's or template's pretext carries no prohibited theme: PhishingTemplate.harmful_flag_hits is empty (calculations.harmful_theme_screen)"
    error_id: ERR_HARMFUL_PRETEXT_THEME
    http_status: 422
    applies_to: "POST /awareness/phishing-templates/{id}/approve-for-use, POST /awareness/campaigns/{id}/approve"
    note: "Safety outranks segregation of duties and every referential check: a harmful-theme campaign is refused no matter who asks and no matter what state the template is in."
  - priority: 14
    category: business_constraint
    check: "segregation of duties: the acting CampaignApprover's X-User-ID differs from PhishingCampaign.author_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 422
    applies_to: "POST /awareness/campaigns/{id}/approve, POST /awareness/campaigns/{id}/reject"
  - priority: 15
    category: business_referential
    check: "the campaign's template is usable: PhishingTemplate(template_id).review_state == APPROVED_FOR_USE"
    error_id: ERR_TEMPLATE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /awareness/campaigns/{id}/approve"
  - priority: 16
    category: business_referential
    check: "the campaign's base tier does not exceed its template's tier: rank(campaign.difficulty_tier) <= rank(template.difficulty_tier)"
    error_id: ERR_CAMPAIGN_TIER_EXCEEDS_TEMPLATE
    http_status: 422
    applies_to: "POST /awareness/campaigns"
  - priority: 17
    category: business_referential
    check: "the module is startable: TrainingModule(module_id).status == PUBLISHED; a DRAFT module cannot be assigned and a RETIRED module cannot be started or retaken"
    error_id: ERR_MODULE_NOT_PUBLISHED | ERR_MODULE_RETIRED
    http_status: 409
    applies_to: "POST /awareness/curriculum-assignments, POST /awareness/curriculum-assignments/{id}/start, /retake, POST /awareness/interventions/{id}/assign-coaching"
  - priority: 18
    category: business_referential
    check: "coaching modules are remedial: TrainingModule(module_id).module_type == REMEDIAL"
    error_id: ERR_COACHING_MODULE_TYPE_INVALID
    http_status: 422
    applies_to: "POST /awareness/interventions/{id}/assign-coaching"
  - priority: 19
    category: business_referential
    check: "role eligibility: TrainingModule.applies_to_role_codes is empty or contains Employee.role_code"
    error_id: ERR_ROLE_NOT_ELIGIBLE_FOR_MODULE
    http_status: 422
    applies_to: "POST /awareness/curriculum-assignments"
  - priority: 20
    category: business_referential
    check: "credential capture must be enabled on the template before a CREDENTIAL_SUBMIT event is accepted, and the event needs a prior CLICK on the same delivery"
    error_id: ERR_CREDENTIAL_CAPTURE_DISABLED | ERR_CREDENTIAL_WITHOUT_CLICK
    http_status: 422
    applies_to: "POST /awareness/simulation-deliveries/{id}/interactions"
    note: "Scope of the priority-11 state check on this endpoint: ERR_DELIVERY_NOT_INTERACTABLE covers only deliveries whose state is QUEUED or terminal (CREDENTIAL_SUBMITTED, NO_INTERACTION, EXCLUDED). DELIVERED, REPORTED and CLICKED are all interactable, so a CREDENTIAL_SUBMIT on a DELIVERED or REPORTED delivery falls through to this rule and returns ERR_CREDENTIAL_WITHOUT_CLICK, and a CREDENTIAL_SUBMIT on a CLICKED delivery whose template has credential_capture_enabled == false returns ERR_CREDENTIAL_CAPTURE_DISABLED. When both clauses are violated, the capture clause is evaluated first."
  - priority: 21
    category: business_temporal
    check: "an interaction event is not backdated before its delivery and not postdated past the logical clock: delivered_at <= occurred_at <= clock_now"
    error_id: ERR_EVENT_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /awareness/simulation-deliveries/{id}/interactions"
  - priority: 22
    category: business_temporal
    check: "the send instant is in the future: scheduled_send_at > clock_now"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /awareness/campaigns/{id}/schedule"
  - priority: 23
    category: business_temporal
    check: "the send instant is outside every applicable SIMULATION_BLACKOUT CommunicationWindow, treated as a CLOSED interval: scheduled_send_at is rejected when start_at <= scheduled_send_at <= end_at and the window's scope_department is null or intersects the cohort's departments"
    error_id: ERR_COMMUNICATION_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /awareness/campaigns/{id}/schedule"
  - priority: 24
    category: business_temporal
    check: "per-employee simulation quiet period, treated as a HALF-OPEN interval: the schedule is rejected when for any cohort member scheduled_send_at lies in [reference_instant, quiet_period_until) of one of that member's non-EXCLUDED deliveries, where reference_instant is delivered_at when set and otherwise that delivery's campaign scheduled_send_at, and quiet_period_until = reference_instant + QUIET_PERIOD_DAYS; a send exactly at quiet_period_until is allowed"
    error_id: ERR_SIMULATION_QUIET_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /awareness/campaigns/{id}/schedule"
  - priority: 25
    category: business_constraint
    check: "the resolved cohort has at least one evaluable member (calculations.cohort_resolution)"
    error_id: ERR_EMPTY_TARGET_COHORT
    http_status: 422
    applies_to: "POST /awareness/campaigns/{id}/schedule"
  - priority: 26
    category: business_constraint
    check: "communication policy: communication_policy_ack == true before review, and a non-empty debrief_note at close"
    error_id: ERR_COMMUNICATION_POLICY_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /awareness/campaigns/{id}/submit-for-review, POST /awareness/campaigns/{id}/close"
  - priority: 27
    category: business_constraint
    check: "extension budget: granted_extension_days + extension_days <= TrainingModule.max_extension_days"
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /awareness/curriculum-assignments/{id}/extension"
  - priority: 28
    category: business_constraint
    check: "extension window: escalation_level < 3 (an assignment already at the suspension rung can no longer be extended) AND the grant still moves the deadline into the future (clock_now <= due_at + granted_extension_days + extension_days days)"
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /awareness/curriculum-assignments/{id}/extension"
  - priority: 29
    category: business_temporal
    check: "report period sanity: period_end > period_start and the span is at most 24 calendar months"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "GET /awareness/effectiveness-report"
  - priority: 30
    category: business_temporal
    check: "the reserved send instant has arrived: clock_now >= PhishingCampaign.scheduled_send_at"
    error_id: ERR_LAUNCH_BEFORE_SCHEDULE
    http_status: 409
    applies_to: "POST /awareness/campaigns/{id}/launch"

endpoints:
  # ---------------- Employee ----------------
  - method: POST
    path: "/awareness/employees"
    description: "Register an employee in the awareness program."
    roles: [ProgramAdmin]
    code: 201
    input: [email, full_name, department, role_code, hire_date, "manager_id?"]
    output: Employee
    side_effects:
      - "computes tenure_band via calculations.employee_tenure_band"
      - "initialises compliance_state = COMPLIANT, access_posture = NONE, repeat_clicker_tier = 0, reserved_simulation_slots = 0, both risk scores = 0.00"
  - method: GET
    path: "/awareness/employees/{id}"
    description: "Read one employee, including both risk-score variants and all three state axes."
    roles: [ProgramAdmin, SecurityAnalyst, Manager, Learner]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "recomputes tenure_band, repeat_clicker_tier, consecutive_clean_simulations, risk_score_provisional and risk_score_settled on read (no version bump)"
  - method: GET
    path: "/awareness/employees"
    description: "List employees with filters; the reverse-reachability channel for Employee.manager_id."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["manager_id?", "department?", "compliance_state?", "access_posture?", "employment_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: PATCH
    path: "/awareness/employees/{id}/role"
    description: "Change an employee's role_code, which changes ROLE_SPECIFIC module eligibility for future assignments."
    roles: [ProgramAdmin]
    code: 200
    input: [role_code]
    output: Employee
    side_effects:
      - "increments Employee.version by 1"
      - "already-created CurriculumAssignment rows are untouched"
  - method: POST
    path: "/awareness/employees/{id}/offboard"
    description: "Offboard an employee, unwinding every open training obligation, notice, consequence and reservation."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "sets employment_status = OFFBOARDED"
      - "VOIDs every non-terminal CurriculumAssignment, EXPIREs their SENT EscalationNotices, VOIDs every ACTIVE AccessConsequence"
      - "EXCLUDEs every QUEUED SimulationDelivery with excluded_reason = EMPLOYEE_OFFBOARDED and decrements reserved_simulation_slots accordingly"
      - "recomputes compliance_state, access_posture, active_suspension_count and both risk scores"
      - "increments Employee.version by 1"

  # ---------------- AccessConsequence ----------------
  - method: POST
    path: "/awareness/employees/{id}/access-consequences"
    description: "Apply an access consequence to an employee. Omit consequence_type to let calculations.access_consequence_severity derive the next rung. OCC-guarded (concurrency_rules.access-consequence-create-stale-employee)."
    roles: [ProgramAdmin]
    code: 201
    input: [reason_code, expected_employee_version, "consequence_type?"]
    output: AccessConsequence
    side_effects:
      - "runs calculations.access_consequence_severity steps 1-5"
      - "LIFTs any prior ACTIVE consequence of the same consequence_type with lift_reason_code = SUPERSEDED"
      - "recomputes Employee.access_posture and Employee.active_suspension_count"
      - "increments Employee.version by 1"
  - method: GET
    path: "/awareness/access-consequences/{id}"
    description: "Read one access consequence."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: []
    output: AccessConsequence
    side_effects: []
  - method: GET
    path: "/awareness/access-consequences"
    description: "List access consequences; the reverse-reachability channel for employee_id and source_assignment_id."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["employee_id?", "source_assignment_id?", "state?", "consequence_type?", "limit?", "offset?"]
    output: AccessConsequence[]
    side_effects: []
  - method: POST
    path: "/awareness/access-consequences/{id}/lift"
    description: "Lift an active access consequence."
    roles: [ProgramAdmin]
    code: 200
    input: [lift_reason_code]
    output: AccessConsequence
    side_effects:
      - "sets state = LIFTED, lifted_at = clock_now"
      - "recomputes Employee.access_posture to rank_to_posture(max remaining ACTIVE severity_rank) and Employee.active_suspension_count"
      - "increments AccessConsequence.version by 1 and Employee.version by 1"

  # ---------------- TrainingModule ----------------
  - method: POST
    path: "/awareness/training-modules"
    description: "Create a training module in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [code, title, module_type, "applies_to_role_codes?", "criticality?", "passing_score_pct?", "reminder_offsets_days?", "escalate_after_reminders?", "max_extension_days?"]
    output: TrainingModule
    side_effects: []
  - method: GET
    path: "/awareness/training-modules/{id}"
    description: "Read one training module."
    roles: [ProgramAdmin, SecurityAnalyst, Learner]
    code: 200
    input: []
    output: TrainingModule
    side_effects: []
  - method: POST
    path: "/awareness/training-modules/{id}/publish"
    description: "Publish a DRAFT module so it can be assigned and started."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TrainingModule
    side_effects:
      - "sets status = PUBLISHED, published_at = clock_now"
      - "increments TrainingModule.version by 1"
  - method: POST
    path: "/awareness/training-modules/{id}/retire"
    description: "Retire a PUBLISHED module; existing assignments survive but become unstartable."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TrainingModule
    side_effects:
      - "sets status = RETIRED, retired_at = clock_now"
      - "increments TrainingModule.version by 1"

  # ---------------- CurriculumAssignment ----------------
  - method: POST
    path: "/awareness/curriculum-assignments"
    description: "Assign a published module to an employee. A non-terminal assignment for the same (employee_id, module_id) pair is superseded. OCC-guarded (concurrency_rules.assignment-create-stale-employee)."
    roles: [ProgramAdmin]
    code: 201
    input: [employee_id, module_id, assignment_reason, expected_employee_version]
    output: CurriculumAssignment
    side_effects:
      - "computes assigned_at = clock_now, due_at and effective_due_at via calculations.assignment_due_date"
      - "computes next_reminder_due_at via calculations.reminder_cadence_schedule"
      - "any prior non-terminal assignment for the same (employee_id, module_id) becomes VOIDED with void_reason_code = SUPERSEDED_BY_NEW_ASSIGNMENT and superseded_by_assignment_id = the new assignment's id, unwinding its notices and consequences"
      - "recomputes Employee.compliance_state and both risk scores"
      - "increments Employee.version by 1"
  - method: GET
    path: "/awareness/curriculum-assignments/{id}"
    description: "Read one assignment, including effective_due_at, days_overdue and next_reminder_due_at."
    roles: [ProgramAdmin, SecurityAnalyst, Learner, Manager]
    code: 200
    input: []
    output: CurriculumAssignment
    side_effects:
      - "recomputes days_overdue and next_reminder_due_at on read (no version bump)"
  - method: GET
    path: "/awareness/curriculum-assignments"
    description: "List assignments; the reverse-reachability channel for employee_id, module_id and superseded_by_assignment_id."
    roles: [ProgramAdmin, SecurityAnalyst, Manager]
    code: 200
    input: ["employee_id?", "module_id?", "state?", "assignment_reason?", "superseded_by_assignment_id?", "limit?", "offset?"]
    output: CurriculumAssignment[]
    side_effects: []
  - method: POST
    path: "/awareness/curriculum-assignments/{id}/start"
    description: "Learner starts (or resumes) an assignment."
    roles: [Learner]
    code: 200
    input: []
    output: CurriculumAssignment
    side_effects:
      - "sets state = IN_PROGRESS"
      - "increments CurriculumAssignment.version by 1"
  - method: POST
    path: "/awareness/curriculum-assignments/{id}/submit"
    description: "Learner submits an attempt; score_pct >= module.passing_score_pct completes it, otherwise it becomes FAILED_ATTEMPT."
    roles: [Learner]
    code: 200
    input: [score_pct]
    output: CurriculumAssignment
    side_effects:
      - "sets attempt_count += 1, last_score_pct = score_pct"
      - "on pass: state = COMPLETED, completed_at = clock_now, EXPIREs SENT EscalationNotices, LIFTs ACTIVE AccessConsequences with lift_reason_code = TRAINING_COMPLETED, recomputes Employee.access_posture, active_suspension_count, compliance_state and both risk scores, and bubbles a COACHING_ASSIGNED intervention up to COACHING_COMPLETED"
      - "on fail: state = FAILED_ATTEMPT only"
      - "increments CurriculumAssignment.version by 1 and, on pass, Employee.version by 1"
  - method: POST
    path: "/awareness/curriculum-assignments/{id}/retake"
    description: "Learner retakes a failed attempt, returning the assignment to IN_PROGRESS."
    roles: [Learner]
    code: 200
    input: []
    output: CurriculumAssignment
    side_effects:
      - "sets state = IN_PROGRESS"
      - "increments CurriculumAssignment.version by 1"
  - method: POST
    path: "/awareness/curriculum-assignments/{id}/extension"
    description: "The learner's manager grants extra days, resetting escalation and unwinding the consequences that escalation produced."
    roles: [Manager]
    code: 200
    input: [extension_days]
    output: CurriculumAssignment
    side_effects:
      - "sets granted_extension_days += extension_days and recomputes effective_due_at and next_reminder_due_at"
      - "resets escalation_level = 0, EXPIREs SENT EscalationNotices, VOIDs ACTIVE AccessConsequences with lift_reason_code = DEADLINE_EXTENDED"
      - "sets state = ASSIGNED when attempt_count == 0, otherwise IN_PROGRESS"
      - "recomputes Employee.access_posture, active_suspension_count, compliance_state and both risk scores"
      - "increments CurriculumAssignment.version by 1 and Employee.version by 1"
  - method: POST
    path: "/awareness/curriculum-assignments/{id}/void"
    description: "Void an assignment that should never have existed; the compensating action of the escalation cascade."
    roles: [ProgramAdmin]
    code: 200
    input: [void_reason_code]
    output: CurriculumAssignment
    side_effects:
      - "sets state = VOIDED, void_reason_code, next_reminder_due_at = null"
      - "EXPIREs SENT EscalationNotices of this assignment and VOIDs its ACTIVE AccessConsequences with lift_reason_code = ASSIGNMENT_VOIDED"
      - "recomputes Employee.access_posture, active_suspension_count, compliance_state and both risk scores"
      - "increments CurriculumAssignment.version by 1 and Employee.version by 1"

  # ---------------- compliance sweep (ops run) ----------------
  - method: POST
    path: "/awareness/compliance-sweeps"
    description: "Run one compliance sweep at the current logical clock: step A sends at most one cadence reminder per assignment, step B marks strictly-past-due assignments OVERDUE, step C walks the escalation ladder firing the four-hop notice/consequence/posture cascade, step D recomputes every affected employee's derived fields."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { assignments_scanned: integer, reminders_sent_count: integer, overdue_count: integer, escalations_created_count: integer, consequences_applied_count: integer, swept_at: datetime }
    side_effects:
      - "advances reminders_sent / last_reminder_at / next_reminder_due_at per calculations.reminder_cadence_schedule"
      - "moves ASSIGNED, IN_PROGRESS and FAILED_ATTEMPT assignments to OVERDUE when clock_now > effective_due_at"
      - "step C: advances escalation_level per calculations.escalation_ladder; for each newly reached level L it creates an EscalationNotice(level = L, state = SENT) when the employee has a manager_id, and ONLY notices with level >= 2 apply an AccessConsequence (hop 3), so a level-1 escalation is notify-only and leaves access_posture at NONE"
      - "reaching level >= 2 also moves the assignment OVERDUE -> ESCALATED and Employee.compliance_state -> DELINQUENT"
      - "recomputes Employee.compliance_state and both risk scores"

  # ---------------- EscalationNotice ----------------
  - method: GET
    path: "/awareness/escalation-notices/{id}"
    description: "Read one escalation notice."
    roles: [ProgramAdmin, SecurityAnalyst, Manager]
    code: 200
    input: []
    output: EscalationNotice
    side_effects: []
  - method: GET
    path: "/awareness/escalation-notices"
    description: "List escalation notices; the reverse-reachability channel for assignment_id and manager_id."
    roles: [ProgramAdmin, SecurityAnalyst, Manager]
    code: 200
    input: ["assignment_id?", "manager_id?", "state?", "level?", "limit?", "offset?"]
    output: EscalationNotice[]
    side_effects: []
  - method: POST
    path: "/awareness/escalation-notices/{id}/acknowledge"
    description: "The escalated employee's manager acknowledges the notice with a remediation plan."
    roles: [Manager]
    code: 200
    input: [action_plan_note]
    output: EscalationNotice
    side_effects:
      - "sets state = ACKNOWLEDGED, acknowledged_at = clock_now, action_plan_note"
      - "increments EscalationNotice.version by 1"
      - "does NOT lift any AccessConsequence: acknowledgement is not remediation"

  # ---------------- PhishingTemplate ----------------
  - method: POST
    path: "/awareness/phishing-templates"
    description: "Create a pretext template in DRAFT. Prohibited theme tags are recorded in harmful_flag_hits rather than rejected, so the harmful-theme screen bites at approval time."
    roles: [ProgramAdmin, CampaignAuthor]
    code: 201
    input: [name, pretext_category, difficulty_tier, "theme_tags?", "credential_capture_enabled?"]
    output: PhishingTemplate
    side_effects:
      - "computes harmful_flag_hits via calculations.harmful_theme_screen"
  - method: GET
    path: "/awareness/phishing-templates/{id}"
    description: "Read one template."
    roles: [ProgramAdmin, CampaignAuthor, CampaignApprover, SecurityAnalyst]
    code: 200
    input: []
    output: PhishingTemplate
    side_effects: []
  - method: POST
    path: "/awareness/phishing-templates/{id}/approve-for-use"
    description: "Approve a DRAFT template for campaign use; refused when harmful_flag_hits is non-empty."
    roles: [CampaignApprover]
    code: 200
    input: []
    output: PhishingTemplate
    side_effects:
      - "sets review_state = APPROVED_FOR_USE"
      - "increments PhishingTemplate.version by 1"
  - method: POST
    path: "/awareness/phishing-templates/{id}/block"
    description: "Block a template from all future campaign approvals."
    roles: [ProgramAdmin]
    code: 200
    input: [blocked_reason]
    output: PhishingTemplate
    side_effects:
      - "sets review_state = BLOCKED, blocked_reason"
      - "increments PhishingTemplate.version by 1"

  # ---------------- PhishingCampaign ----------------
  - method: POST
    path: "/awareness/campaigns"
    description: "Create a campaign in DRAFT owned by the acting CampaignAuthor."
    roles: [CampaignAuthor]
    code: 201
    input: [name, template_id, difficulty_tier, "target_departments?", "target_tenure_bands?", "target_min_repeat_tier?", "communication_policy_ack?"]
    output: PhishingCampaign
    side_effects:
      - "sets author_user_id = X-User-ID"
  - method: GET
    path: "/awareness/campaigns/{id}"
    description: "Read one campaign, including live click_rate, report_rate, credential_rate and resilience_ratio."
    roles: [ProgramAdmin, CampaignAuthor, CampaignApprover, SecurityAnalyst]
    code: 200
    input: []
    output: PhishingCampaign
    side_effects:
      - "recomputes the four rates via calculations.campaign_scorecard_rates on read (no version bump)"
  - method: GET
    path: "/awareness/campaigns"
    description: "List campaigns; the reverse-reachability channel for template_id."
    roles: [ProgramAdmin, CampaignAuthor, CampaignApprover, SecurityAnalyst]
    code: 200
    input: ["template_id?", "state?", "difficulty_tier?", "limit?", "offset?"]
    output: PhishingCampaign[]
    side_effects: []
  - method: POST
    path: "/awareness/campaigns/{id}/submit-for-review"
    description: "Author submits a DRAFT or REJECTED campaign for approver review."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: PhishingCampaign
    side_effects:
      - "sets state = IN_REVIEW and clears rejection_reason"
      - "increments PhishingCampaign.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/approve"
    description: "Approver approves a campaign under review. Refused for harmful pretexts, for self-approval, and for templates not APPROVED_FOR_USE - in that priority order."
    roles: [CampaignApprover]
    code: 200
    input: []
    output: PhishingCampaign
    side_effects:
      - "sets state = APPROVED, reviewer_user_id = X-User-ID"
      - "increments PhishingCampaign.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/reject"
    description: "Approver rejects a campaign under review, returning it to the author."
    roles: [CampaignApprover]
    code: 200
    input: [rejection_reason]
    output: PhishingCampaign
    side_effects:
      - "sets state = REJECTED, reviewer_user_id = X-User-ID, rejection_reason"
      - "increments PhishingCampaign.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/schedule"
    description: "Reserve the cohort at a future instant. Also reschedules a SCHEDULED campaign, releasing the prior reservation set. OCC-guarded (concurrency_rules.campaign-schedule-stale-campaign)."
    roles: [CampaignAuthor]
    code: 200
    input: [scheduled_send_at, expected_campaign_version]
    output: PhishingCampaign
    side_effects:
      - "resolves the cohort via calculations.cohort_resolution and creates one QUEUED SimulationDelivery per evaluable member with effective_difficulty_tier from calculations.simulation_difficulty_escalation"
      - "creates EXCLUDED deliveries (excluded_reason = ACCESS_SUSPENDED) for suspended members"
      - "on reschedule, EXCLUDEs the prior QUEUED deliveries with excluded_reason = CAMPAIGN_RESCHEDULED"
      - "increments each reserved Employee.reserved_simulation_slots by 1 and Employee.version by 1"
      - "sets state = SCHEDULED, scheduled_send_at, target_count, evaluable_count"
      - "increments PhishingCampaign.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/launch"
    description: "Deliver the reserved cohort once the logical clock has reached scheduled_send_at."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PhishingCampaign
    side_effects:
      - "sets state = RUNNING, launched_at = clock_now"
      - "moves QUEUED deliveries of ACTIVE employees to DELIVERED (delivered_at = clock_now, quiet_period_until = delivered_at + QUIET_PERIOD_DAYS = delivered_at + 5 days, outcome_class = PENDING) and QUEUED deliveries of OFFBOARDED employees to EXCLUDED"
      - "decrements each affected Employee.reserved_simulation_slots by 1 and increments Employee.version by 1"
      - "increments PhishingCampaign.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/close"
    description: "Close a running campaign with the mandatory debrief note; freezes the scorecard and settles every cohort member's derived metrics."
    roles: [ProgramAdmin]
    code: 200
    input: [debrief_note]
    output: PhishingCampaign
    side_effects:
      - "sets state = CLOSED, closed_at = clock_now, debrief_note"
      - "moves every DELIVERED delivery to NO_INTERACTION"
      - "freezes click_rate, report_rate, credential_rate and resilience_ratio"
      - "increments consecutive_clean_simulations for every cohort member whose delivery ended REPORTED or NO_INTERACTION and recomputes repeat_clicker_tier and both risk scores"
      - "increments PhishingCampaign.version by 1 and each cohort Employee.version by 1"
  - method: POST
    path: "/awareness/campaigns/{id}/cancel"
    description: "Cancel a campaign before it runs, releasing every reservation it holds."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: PhishingCampaign
    side_effects:
      - "sets state = CANCELLED, cancelled_at = clock_now"
      - "EXCLUDEs every QUEUED delivery with excluded_reason = CAMPAIGN_CANCELLED and decrements reserved_simulation_slots per affected employee"
      - "increments PhishingCampaign.version by 1 and each affected Employee.version by 1"
  - method: GET
    path: "/awareness/campaigns/{id}/scorecard"
    description: "Computed read: program-level rates plus per-department and per-tenure-band segment rates, each computed from its own raw counts and rounded once."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["segment_by?"]
    output: { campaign_id: string, evaluable_count: integer, excluded_count: integer, click_rate: number, report_rate: number, credential_rate: number, resilience_ratio: number, segments: array }
    side_effects: []

  # ---------------- SimulationDelivery / InteractionEvent ----------------
  - method: GET
    path: "/awareness/simulation-deliveries/{id}"
    description: "Read one delivery, including effective_difficulty_tier, outcome_class and quiet_period_until."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: []
    output: SimulationDelivery
    side_effects: []
  - method: GET
    path: "/awareness/simulation-deliveries"
    description: "List deliveries; the reverse-reachability channel for campaign_id and employee_id."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["campaign_id?", "employee_id?", "state?", "outcome_class?", "limit?", "offset?"]
    output: SimulationDelivery[]
    side_effects: []
  - method: POST
    path: "/awareness/simulation-deliveries/{id}/interactions"
    description: "Mail-gateway integration endpoint: append an immutable interaction event to a delivered simulation."
    roles: [ProgramAdmin]
    code: 201
    input: [event_type, occurred_at, source]
    output: InteractionEvent
    side_effects:
      - "assigns sequence_index = 1 + count of prior events on this delivery"
      - "advances the delivery state per the SimulationDelivery state machine and sets first_click_at / first_report_at / credential_submitted_at / outcome_class"
      - "on CLICK or CREDENTIAL_SUBMIT: recomputes Employee.repeat_clicker_tier, resets consecutive_clean_simulations to 0, opens a RepeatClickerIntervention when the tier reaches 2, and recomputes risk_score_provisional"
      - "increments SimulationDelivery.version by 1 and Employee.version by 1"
  - method: GET
    path: "/awareness/simulation-deliveries/{id}/interaction-events"
    description: "Append-only event log of one delivery, ordered by sequence_index ASC; the reverse-reachability channel for InteractionEvent.delivery_id."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: InteractionEvent[]
    side_effects: []

  # ---------------- RepeatClickerIntervention ----------------
  - method: GET
    path: "/awareness/interventions/{id}"
    description: "Read one repeat-clicker intervention, including the live simulation_frequency_days cadence."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: []
    output: RepeatClickerIntervention
    side_effects:
      - "recomputes current_tier and simulation_frequency_days on read (no version bump)"
  - method: GET
    path: "/awareness/interventions"
    description: "List interventions; the reverse-reachability channel for employee_id, triggering_delivery_id and coaching_assignment_id."
    roles: [ProgramAdmin, SecurityAnalyst]
    code: 200
    input: ["employee_id?", "triggering_delivery_id?", "coaching_assignment_id?", "state?", "limit?", "offset?"]
    output: RepeatClickerIntervention[]
    side_effects: []
  - method: POST
    path: "/awareness/interventions/{id}/assign-coaching"
    description: "Assign targeted remedial coaching to a repeat clicker; creates the REMEDIAL CurriculumAssignment."
    roles: [ProgramAdmin]
    code: 200
    input: [module_id]
    output: RepeatClickerIntervention
    side_effects:
      - "creates a CurriculumAssignment (assignment_reason = REMEDIAL, 7-day base window) and sets coaching_assignment_id"
      - "sets state = COACHING_ASSIGNED"
      - "increments RepeatClickerIntervention.version by 1 and Employee.version by 1"
  - method: POST
    path: "/awareness/interventions/{id}/close"
    description: "Close an intervention whose coaching is complete; decays the repeat-clicker tier only when the clean-simulation streak has been earned."
    roles: [ProgramAdmin]
    code: 200
    input: [resolution_code]
    output: RepeatClickerIntervention
    side_effects:
      - "sets state = CLOSED_RESOLVED, closed_at = clock_now, resolution_code"
      - "when Employee.consecutive_clean_simulations >= 3: decrements Employee.repeat_clicker_tier by 1 (floor 0), sets tier_decay_applied = true and recomputes both risk scores"
      - "increments RepeatClickerIntervention.version by 1 and Employee.version by 1"

  # ---------------- IncidentRecord ----------------
  - method: POST
    path: "/awareness/incidents"
    description: "Record a real security incident; only CREDENTIAL_PHISH and BEC rows enter the effectiveness correlation."
    roles: [SecurityAnalyst]
    code: 201
    input: [incident_type, severity, department, occurred_at, summary, "root_cause_employee_id?"]
    output: IncidentRecord
    side_effects:
      - "computes phish_related"
  - method: GET
    path: "/awareness/incidents/{id}"
    description: "Read one incident record (immutable: no version, no update endpoint)."
    roles: [SecurityAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: IncidentRecord
    side_effects: []
  - method: GET
    path: "/awareness/incidents"
    description: "List incidents; the reverse-reachability channel for root_cause_employee_id."
    roles: [SecurityAnalyst, ProgramAdmin]
    code: 200
    input: ["department?", "incident_type?", "root_cause_employee_id?", "occurred_from?", "occurred_to?", "limit?", "offset?"]
    output: IncidentRecord[]
    side_effects: []

  # ---------------- CommunicationWindow ----------------
  - method: POST
    path: "/awareness/communication-windows"
    description: "Declare a communication window; SIMULATION_BLACKOUT windows block campaign scheduling on a closed interval."
    roles: [ProgramAdmin]
    code: 201
    input: [window_type, start_at, end_at, reason, "scope_department?"]
    output: CommunicationWindow
    side_effects: []
  - method: GET
    path: "/awareness/communication-windows"
    description: "List declared communication windows."
    roles: [ProgramAdmin, CampaignAuthor]
    code: 200
    input: ["window_type?", "scope_department?", "limit?", "offset?"]
    output: CommunicationWindow[]
    side_effects: []

  # ---------------- program effectiveness / clock ----------------
  - method: GET
    path: "/awareness/effectiveness-report"
    description: "Computed read: monthly report-rate series against phish-related incident volume, correlated under the CONCURRENT or LAGGED variant."
    roles: [SecurityAnalyst, ProgramAdmin]
    code: 200
    input: [period_start, period_end, variant, "department?"]
    output: { variant: string, buckets: array, pair_count: integer, mean_report_rate: number, total_incidents: integer, correlation: number, correlation_reason_code: string }
    side_effects: []
  - method: POST
    path: "/awareness/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, quiet window, rolling window and reminder instant is evaluated against this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "moves the logical clock only; no entity is mutated and no sweep is implied"

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles"
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown enum member, wrong JSON type, non-ISO-8601 instant, negative extension_days, or score_pct outside 0..100"
  # ---- not found ----
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee path id or body employee_id / manager_id / root_cause_employee_id does not exist"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "training module path id or body module_id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "curriculum assignment path id does not exist"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "phishing template path id or body template_id does not exist"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign path id does not exist"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "simulation delivery path id does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "path id of an escalation notice, access consequence, repeat-clicker intervention, incident record or communication window does not exist"
  # ---- uniqueness ----
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "POST /awareness/employees with an email already registered (case-insensitive)"
  - id: ERR_DUPLICATE_MODULE_CODE
    http: 409
    condition: "POST /awareness/training-modules with a code already used by another module"
  # ---- ownership / identity ----
  - id: ERR_NOT_ASSIGNMENT_OWNER
    http: 403
    condition: "acting Learner's X-User-Id is not the assignment's employee_id on start, submit or retake"
  - id: ERR_NOT_DIRECT_REPORT_MANAGER
    http: 403
    condition: "acting Manager's X-User-Id is neither the assignment employee's manager_id (extension) nor the notice's manager_id (acknowledge)"
  - id: ERR_NOT_CAMPAIGN_AUTHOR
    http: 403
    condition: "acting CampaignAuthor's X-User-Id is not the campaign's author_user_id on submit-for-review, schedule or cancel"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version does not equal the Employee row's current version on assignment create or access-consequence create"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the PhishingCampaign row's current version on schedule"
  # ---- state machine ----
  - id: ERR_MODULE_STATE_INVALID
    http: 409
    condition: "publish on a non-DRAFT module, or retire on a non-PUBLISHED module"
  - id: ERR_TEMPLATE_STATE_INVALID
    http: 409
    condition: "approve-for-use on a template that is not DRAFT, or block on a template already BLOCKED"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "start / submit / retake / extension / void requested from an assignment state the CurriculumAssignment state machine does not allow (e.g. submit from ASSIGNED, retake from IN_PROGRESS, any trigger from COMPLETED or VOIDED)"
  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "submit-for-review / approve / reject / schedule / launch / close / cancel requested from a campaign state the PhishingCampaign state machine does not allow (e.g. launch from APPROVED, close from SCHEDULED, cancel from CLOSED)"
  - id: ERR_DELIVERY_NOT_INTERACTABLE
    http: 409
    condition: "interaction appended to a delivery that is QUEUED, EXCLUDED, NO_INTERACTION or CREDENTIAL_SUBMITTED"
  - id: ERR_NOTICE_STATE_INVALID
    http: 409
    condition: "acknowledge on an escalation notice that is already ACKNOWLEDGED or EXPIRED"
  - id: ERR_CONSEQUENCE_ALREADY_LIFTED
    http: 409
    condition: "lift on an access consequence whose state is LIFTED or VOIDED"
  - id: ERR_INTERVENTION_STATE_INVALID
    http: 409
    condition: "assign-coaching on an intervention that already has coaching, or close on an intervention whose state is not COACHING_COMPLETED"
  # ---- lifecycle guards ----
  - id: ERR_EMPLOYEE_OFFBOARDED
    http: 409
    condition: "the target employee's employment_status is OFFBOARDED on assignment create, access-consequence create or offboard"
  # ---- program safety and integrity ----
  - id: ERR_HARMFUL_PRETEXT_THEME
    http: 422
    condition: "template approve-for-use, or campaign approve, where the template's harmful_flag_hits is non-empty (any theme_tag in PROHIBITED_THEME_TAGS)"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 422
    condition: "campaign approve or reject where X-User-Id equals the campaign's author_user_id"
  - id: ERR_TEMPLATE_NOT_APPROVED
    http: 409
    condition: "campaign approve where the referenced template's review_state is DRAFT or BLOCKED"
  - id: ERR_CAMPAIGN_TIER_EXCEEDS_TEMPLATE
    http: 422
    condition: "POST /awareness/campaigns where the campaign's difficulty_tier rank is greater than the referenced template's difficulty_tier rank"
  - id: ERR_MODULE_NOT_PUBLISHED
    http: 409
    condition: "assignment create referencing a module whose status is DRAFT"
  - id: ERR_MODULE_RETIRED
    http: 409
    condition: "assignment start or retake on an assignment whose module status is RETIRED"
  - id: ERR_COACHING_MODULE_TYPE_INVALID
    http: 422
    condition: "assign-coaching with a module whose module_type is not REMEDIAL"
  - id: ERR_ROLE_NOT_ELIGIBLE_FOR_MODULE
    http: 422
    condition: "assignment create where the module is ROLE_SPECIFIC and the employee's role_code is absent from applies_to_role_codes"
  - id: ERR_CREDENTIAL_CAPTURE_DISABLED
    http: 422
    condition: "CREDENTIAL_SUBMIT interaction on a delivery whose campaign template has credential_capture_enabled = false"
  - id: ERR_CREDENTIAL_WITHOUT_CLICK
    http: 422
    condition: "CREDENTIAL_SUBMIT interaction on a delivery with no prior CLICK event"
  - id: ERR_EVENT_OUT_OF_ORDER
    http: 422
    condition: "interaction occurred_at is earlier than the delivery's delivered_at or later than the logical clock (validations[priority=21] requires delivered_at <= occurred_at <= clock_now)"
  # ---- temporal ----
  - id: ERR_SCHEDULE_IN_PAST
    http: 422
    condition: "schedule where scheduled_send_at is less than or equal to the logical clock"
  - id: ERR_COMMUNICATION_BLACKOUT_CONFLICT
    http: 409
    condition: "schedule where scheduled_send_at falls inside a SIMULATION_BLACKOUT CommunicationWindow's CLOSED interval [start_at, end_at] whose scope covers a targeted department"
  - id: ERR_SIMULATION_QUIET_PERIOD_CONFLICT
    http: 409
    condition: "schedule where ANY resolved cohort member is still inside the HALF-OPEN quiet interval [reference_instant, quiet_period_until) of one of that member's non-EXCLUDED deliveries at scheduled_send_at"
  - id: ERR_EXTENSION_WINDOW_CLOSED
    http: 409
    condition: "extension requested on an assignment whose escalation_level is already 3 (the suspension rung), or whose new effective_due_at would still be in the past"
  - id: ERR_EXTENSION_LIMIT_EXCEEDED
    http: 422
    condition: "granted_extension_days + extension_days would exceed the module's max_extension_days"
  - id: ERR_REPORT_PERIOD_INVALID
    http: 422
    condition: "effectiveness-report where the requested span exceeds 24 calendar months; a period_end that is not after period_start is caught earlier by priority 3 and returns ERR_INVALID_REQUEST (400)"
  # ---- cohort ----
  - id: ERR_LAUNCH_BEFORE_SCHEDULE
    http: 409
    condition: "launch on a SCHEDULED campaign while the logical clock is still strictly before scheduled_send_at"
  - id: ERR_EMPTY_TARGET_COHORT
    http: 422
    condition: "schedule where the resolved cohort contains no ACTIVE employee at all"
  - id: ERR_COMMUNICATION_POLICY_NOT_ACKNOWLEDGED
    http: 422
    condition: "submit-for-review where the campaign's communication_policy_ack is false, or close with an empty debrief_note"

roles:
  - name: ProgramAdmin
    description: "Owns the awareness program: employee registry, curriculum, sweeps, consequences and campaign execution."
    identity: "opaque"
    exclusive_operations:
      - "create, offboard and role-change employees"
      - "create, publish and retire training modules"
      - "create and void curriculum assignments"
      - "run compliance sweeps"
      - "create and lift access consequences"
      - "block phishing templates"
      - "launch and close campaigns"
      - "ingest simulation interaction events"
      - "assign coaching and close repeat-clicker interventions"
      - "declare communication windows"
      - "set the logical clock"
    shared_operations:
      - "create phishing templates (with CampaignAuthor)"
      - "read employees, modules, assignments, notices, consequences, templates, campaigns, deliveries, interventions, incidents, windows"
      - "read campaign scorecards and the effectiveness report (with SecurityAnalyst)"
  - name: CampaignAuthor
    description: "Designs phishing simulation campaigns and schedules them; may never approve their own work."
    identity: "opaque"
    exclusive_operations:
      - "create campaigns"
      - "submit campaigns for review"
      - "schedule and reschedule campaigns"
      - "cancel campaigns"
    shared_operations:
      - "create phishing templates (with ProgramAdmin)"
      - "read templates and campaigns"
      - "list communication windows"
  - name: CampaignApprover
    description: "Independent reviewer of pretext safety and campaign readiness; segregation-of-duties counterpart to CampaignAuthor."
    identity: "opaque"
    exclusive_operations:
      - "approve templates for use"
      - "approve campaigns"
      - "reject campaigns"
    shared_operations:
      - "read templates and campaigns"
  - name: Manager
    description: "Line manager of the employees who owe training; acknowledges escalations and grants deadline extensions for direct reports only."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "acknowledge escalation notices addressed to them"
      - "grant assignment extensions to direct reports"
    shared_operations:
      - "read employees, assignments and escalation notices"
  - name: Learner
    description: "The employee who owes the training; may only drive their own assignments."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "start their own assignments"
      - "submit attempts on their own assignments"
      - "retake their own failed assignments"
    shared_operations:
      - "read their own employee record, assignments and training modules"
  - name: SecurityAnalyst
    description: "Measures program effectiveness against real incident volume; records incidents and reads all analytics."
    identity: "opaque"
    exclusive_operations:
      - "record incidents"
    shared_operations:
      - "read employees, assignments, notices, consequences, templates, campaigns, deliveries, interventions and incidents"
      - "read campaign scorecards and the effectiveness report (with ProgramAdmin)"
