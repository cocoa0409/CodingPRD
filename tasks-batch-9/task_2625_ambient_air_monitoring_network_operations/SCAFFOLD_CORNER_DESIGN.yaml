            - "immediately after the FAIL: Monitor.${mon_id}.monitor_status == OUT_OF_SERVICE, out_of_service_since == 2026-01-05T00:00:00Z, consecutive_qc_failure_count == 1, last_span_check_at == 2026-01-02T00:00:00Z"
