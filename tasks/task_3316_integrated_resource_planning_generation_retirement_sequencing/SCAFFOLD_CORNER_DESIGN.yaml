      - name: public_commenter_cannot_acknowledge
        claim_type: rbac_denial
        grounds:
          - roles.PublicCommenter
        distinguishing_aspect: "Acknowledge is UtilityPlanner-only: a PublicCommenter caller fails ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P OPEN_FOR_COMMENT with one RECEIVED comment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
