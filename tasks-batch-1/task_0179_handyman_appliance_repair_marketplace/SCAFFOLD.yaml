scenario: |
  179. Handyman & Appliance Repair Marketplace: job category/skill tag, instant quote vs
  in-home estimate, pro background check/license, dispatch/scheduling window, parts markup/truck
  stock, hourly vs flat task pricing, warranty/callback, dispute/refund
domain_name: handyman-appliance-repair-marketplace
api_prefix: /

# ---------------------------------------------------------------------------
# Complexity profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation      # instant-quote price vs in-home-estimate price for same job
    - cascading_side_effects        # dispute -> refund -> warranty void -> pro rating debit
    - optimistic_concurrency        # dispatch-slot booking on a Pro's DispatchWindow.version
    - temporal_windowing            # dispatch windows + travel buffers + truck-stock holds
    - derived_field_reconciliation  # Invoice.balance_due / Pro.callback_rate kept in sync

  entity_topology: flat
  # Peer entities linked by foreign keys: Job references Customer/ServiceCategory/Pro/Quote;
  # PartLine/LaborLine/WorkVisit reference Job; no nesting of business identity in URL paths.

  state_machine_shape: branching
  # Job forks at quoting: INSTANT_QUOTED path vs ESTIMATE path, re-joins at SCHEDULED, then a
  # warranty-callback cycle (COMPLETED -> CALLBACK_OPEN -> SCHEDULED) layered on top.

  relationship_patterns:
    - one_to_many        # Job has many PartLine / LaborLine / WorkVisit
    - flat_references    # Quote, DispatchWindow, Dispute reference Job/Pro by FK
    - cross_aggregate    # Dispute references both Job and Invoice; Callback references prior Job

  role_model: peer_roles
  # Customer owns Jobs/Disputes; Pro owns DispatchWindows/Estimates/Invoices; PlatformAdmin
  # vets background checks and rules disputes; Dispatcher is opaque-operational.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: ServiceCategory
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits
      - name: code
        type: string
        source: input
        description: stable category code, unique
        constraints: "^[A-Z][A-Z0-9_]{1,31}$; unique across ServiceCategory"
      - name: name
        type: string
        source: input
        description: human-readable category name
      - name: requires_license
        type: boolean
        source: input
        description: whether a Pro must hold a verified license to serve this category
        default: false
      - name: pricing_model
        type: enum
        source: input
        description: how labor on jobs of this category is priced
        constraints: "one of {HOURLY, FLAT}"
      - name: flat_task_fee_cents
        type: integer
        source: input
        description: flat task fee in cents; required when pricing_model=FLAT, else must be null
        constraints: ">= 0 when present; null when pricing_model=HOURLY"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: labor rate per hour in cents; required when pricing_model=HOURLY, else null
        constraints: ">= 0 when present; null when pricing_model=FLAT"
      - name: instant_quote_eligible
        type: boolean
        source: input
        description: whether jobs in this category may take the instant-quote path
        default: false
      - name: instant_quote_flat_cents
        type: integer
        source: input
        description: all-in instant quote price in cents; required when instant_quote_eligible=true
        constraints: ">= 0 when present; null otherwise"
      - name: callback_warranty_days
        type: integer
        source: input
        description: warranty window length in days after completion during which callbacks are free
        default: 30
        constraints: ">= 0"
      - name: skill_tags
        type: array
        source: input
        description: list of skill-tag strings a Pro must carry to be eligible for this category
        default: []

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email, unique
        constraints: "unique across Customer"
      - name: full_name
        type: string
        source: input
        description: customer name
      - name: zip_code
        type: string
        source: input
        description: 5-digit service ZIP used for travel-buffer eligibility
        constraints: "^[0-9]{5}$"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: refund/credit balance in cents accumulated from dispute refunds to WALLET
        default: 0
        constraints: ">= 0"

  - name: Pro
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email, unique
        constraints: "unique across Pro"
      - name: full_name
        type: string
        source: input
        description: pro name
      - name: home_zip_code
        type: string
        source: input
        description: 5-digit base ZIP; jobs in the same ZIP incur no travel buffer
        constraints: "^[0-9]{5}$"
      - name: skill_tags
        type: array
        source: input
        description: skill-tag strings this Pro carries; matched against ServiceCategory.skill_tags
        default: []
      - name: background_check_status
        type: enum
        source: computed
        description: vetting posture; gates whether the Pro may be assigned to any Job
        default: PENDING
        constraints: "one of {PENDING, CLEARED, FLAGGED}"
      - name: license_status
        type: enum
        source: computed
        description: license verification posture; gates assignment to requires_license categories
        default: NONE
        constraints: "one of {NONE, VERIFIED, EXPIRED}"
      - name: license_expires_on
        type: datetime
        source: computed
        description: license expiry date (date-only at UTC midnight); null when license_status=NONE
      - name: truck_stock_markup_pct
        type: number
        source: input
        description: per-Pro markup percentage applied to truck-stock parts (e.g. 0.35 = 35%)
        default: 0.25
        constraints: ">= 0 and <= 1"
      - name: completed_job_count
        type: integer
        source: computed
        description: count of Jobs this Pro has driven to COMPLETED (excludes callbacks)
        default: 0
        constraints: ">= 0"
      - name: callback_job_count
        type: integer
        source: computed
        description: count of warranty callbacks opened against this Pro's completed jobs
        default: 0
        constraints: ">= 0"
      - name: callback_rate
        type: number
        source: computed
        description: derived callback_job_count / completed_job_count (0 when no completions)
        default: 0
        constraints: ">= 0; round_half_up to 4 decimals"

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer who requested the job"
      - name: category_id
        type: string
        source: input
        description: "FK -> ServiceCategory.id; the service category / skill tag of the job"
      - name: pro_id
        type: string
        source: computed
        description: "FK -> Pro.id; assigned pro, null until assignment; set by dispatch booking"
      - name: parent_job_id
        type: string
        source: input
        description: "FK -> Job.id; set only on warranty-callback jobs, pointing to the original job; null otherwise"
      - name: status
        type: enum
        source: computed
        description: lifecycle status (see §1.2)
        default: REQUESTED
        constraints: "one of {REQUESTED, INSTANT_QUOTED, ESTIMATE_REQUESTED, ESTIMATED, SCHEDULED, IN_PROGRESS, COMPLETED, CALLBACK_OPEN, CANCELLED}"
      - name: quote_path
        type: enum
        source: computed
        description: which quoting path the job took; null until a quote/estimate is produced
        constraints: "one of {INSTANT, IN_HOME} or null"
      - name: agreed_price_cents
        type: integer
        source: computed
        description: the price the customer accepted (instant-quote all-in, or estimate total); null until acceptance
        constraints: ">= 0 when present"
      - name: is_warranty_callback
        type: boolean
        source: computed
        description: true when parent_job_id is set and callback opened within warranty window
        default: false
      - name: address_zip_code
        type: string
        source: input
        description: 5-digit ZIP where service is performed
        constraints: "^[0-9]{5}$"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this quote belongs to"
      - name: quote_type
        type: enum
        source: input
        description: INSTANT (system-priced flat) or IN_HOME (pro on-site estimate)
        constraints: "one of {INSTANT, IN_HOME}"
      - name: estimated_labor_hours
        type: number
        source: input
        description: pro-estimated labor hours; required for IN_HOME on HOURLY categories, else null
        constraints: ">= 0 when present"
      - name: priced_amount_cents
        type: integer
        source: computed
        description: server-computed quoted total in cents per §1.3 quote_pricing
        constraints: ">= 0"
      - name: accepted
        type: boolean
        source: computed
        description: whether the customer has accepted this quote
        default: false
      - name: superseded
        type: boolean
        source: computed
        description: true when a newer quote on the same job replaced this one
        default: false

  - name: DispatchWindow
    parent: null
    common_fields: true
    fields:
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the pro who owns this availability window"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the availability window (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the availability window (exclusive)
        constraints: "window_end > window_start"
      - name: service_zip_code
        type: string
        source: input
        description: 5-digit ZIP this window serves
        constraints: "^[0-9]{5}$"
      - name: booked_job_id
        type: string
        source: computed
        description: "FK -> Job.id; the job booked into this window, null when free"
      - name: hold_state
        type: enum
        source: computed
        description: occupancy state of the window
        default: FREE
        constraints: "one of {FREE, BOOKED, RELEASED}"

  - name: LaborLine
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this labor line belongs to"
      - name: hours_worked
        type: number
        source: input
        description: actual labor hours recorded on a WorkVisit for HOURLY categories
        constraints: ">= 0"
      - name: rate_cents_per_hour
        type: integer
        source: computed
        description: snapshot of the category hourly rate at line creation
        constraints: ">= 0"
      - name: line_total_cents
        type: integer
        source: computed
        description: computed hours_worked * rate_cents_per_hour, rounded per §1.3
        constraints: ">= 0"

  - name: PartLine
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this part line belongs to"
      - name: description
        type: string
        source: input
        description: part description
      - name: unit_cost_cents
        type: integer
        source: input
        description: pro's wholesale unit cost in cents
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: number of units
        constraints: ">= 1"
      - name: from_truck_stock
        type: boolean
        source: input
        description: true when the part came from the pro's truck stock (markup applies); false for special-order (flat handling fee)
        default: false
      - name: line_total_cents
        type: integer
        source: computed
        description: computed marked-up part total per §1.3 part_line_pricing
        constraints: ">= 0"

  - name: WorkVisit
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this on-site visit serves"
      - name: dispatch_window_id
        type: string
        source: input
        description: "FK -> DispatchWindow.id; the window this visit consumes"
      - name: arrived_at
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp the pro arrived on site
      - name: outcome
        type: enum
        source: computed
        description: visit result; OPEN on creation, RESOLVED when the job is completed
        default: OPEN
        constraints: "one of {OPEN, RESOLVED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job being invoiced"
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: sum of LaborLine.line_total_cents, or flat_task_fee for FLAT categories
        constraints: ">= 0"
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: sum of PartLine.line_total_cents
        constraints: ">= 0"
      - name: trip_fee_cents
        type: integer
        source: computed
        description: travel/dispatch trip fee per §1.3 invoice_total
        constraints: ">= 0"
      - name: total_cents
        type: integer
        source: computed
        description: grand total per §1.3 invoice_total
        constraints: ">= 0"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: amount the customer has paid
        default: 0
        constraints: ">= 0"
      - name: refunded_cents
        type: integer
        source: computed
        description: total refunded against this invoice via disputes
        default: 0
        constraints: ">= 0"
      - name: balance_due_cents
        type: integer
        source: computed
        description: derived total_cents - amount_paid_cents + refunded_cents reconciliation per §1.3
        constraints: "may be negative when over-refunded is blocked; see validations"
      - name: status
        type: enum
        source: computed
        description: invoice lifecycle (see §1.2)
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PAID, REFUNDED, VOID}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the disputed job"
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice under dispute"
      - name: reason
        type: enum
        source: input
        description: dispute reason
        constraints: "one of {WORK_INCOMPLETE, OVERCHARGED, DAMAGE, NO_SHOW}"
      - name: requested_refund_cents
        type: integer
        source: input
        description: refund amount the customer requests in cents
        constraints: ">= 1"
      - name: refund_destination
        type: enum
        source: input
        description: where an approved refund is sent
        default: ORIGINAL
        constraints: "one of {ORIGINAL, WALLET}"
      - name: approved_refund_cents
        type: integer
        source: computed
        description: refund amount the admin approved; <= requested and <= invoice paid; null until resolved
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: computed
        description: dispute lifecycle (see §1.2)
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, APPROVED, DENIED, WITHDRAWN}"

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the pro being vetted"
      - name: check_type
        type: enum
        source: input
        description: kind of vetting
        constraints: "one of {CRIMINAL, IDENTITY, LICENSE}"
      - name: license_expires_on
        type: datetime
        source: input
        description: for check_type=LICENSE, the license expiry date (UTC midnight); null otherwise
      - name: decision
        type: enum
        source: computed
        description: vetting decision
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Job
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: INSTANT_QUOTED
        trigger: "POST /jobs/{id}/instant-quote"
        actor: Customer
        preconditions:
          - "category.instant_quote_eligible == true"
          - "job.is_warranty_callback == false"
        side_effects:
          - "creates a Quote with quote_type=INSTANT, priced_amount_cents = quote_pricing INSTANT variant"
          - "sets Job.quote_path = INSTANT"
        note: "instant-quote branch; only for instant-eligible categories"

      - from: REQUESTED
        to: ESTIMATE_REQUESTED
        trigger: "POST /jobs/{id}/request-estimate"
        actor: Customer
        preconditions: []
        side_effects:
          - "sets Job.quote_path = IN_HOME"

      - from: ESTIMATE_REQUESTED
        to: ESTIMATED
        trigger: "POST /jobs/{id}/quotes (quote_type=IN_HOME)"
        actor: Pro
        preconditions:
          - "acting Pro is assignable to category (background_check_status=CLEARED; license if required; skill_tags superset)"
        side_effects:
          - "creates a Quote with quote_type=IN_HOME, priced_amount_cents = quote_pricing IN_HOME variant"
          - "if a prior non-accepted Quote exists on this job, sets its superseded=true"

      - from: INSTANT_QUOTED
        to: SCHEDULED
        trigger: "POST /jobs/{id}/accept-quote then POST /dispatch-windows/{wid}/book"
        actor: Customer
        preconditions:
          - "the accepted Quote.superseded == false"
          - "target DispatchWindow.hold_state == FREE"
          - "DispatchWindow.pro_id resolves to a Pro assignable to category"
          - "DispatchWindow.service_zip_code == job.address_zip_code"
        side_effects:
          - "sets Quote.accepted=true, Job.agreed_price_cents = Quote.priced_amount_cents"
          - "sets Job.pro_id = window.pro_id, DispatchWindow.hold_state=BOOKED, DispatchWindow.booked_job_id=job.id"
          - "increments DispatchWindow.version by 1"
        note: "accept + book; OCC on DispatchWindow.version (see §1.2.1 window-book-stale)"

      - from: ESTIMATED
        to: SCHEDULED
        trigger: "POST /jobs/{id}/accept-quote then POST /dispatch-windows/{wid}/book"
        actor: Customer
        preconditions:
          - "the accepted Quote.superseded == false"
          - "target DispatchWindow.hold_state == FREE"
          - "DispatchWindow.pro_id resolves to a Pro assignable to category"
          - "DispatchWindow.service_zip_code == job.address_zip_code"
        side_effects:
          - "sets Quote.accepted=true, Job.agreed_price_cents = Quote.priced_amount_cents"
          - "sets Job.pro_id = window.pro_id, DispatchWindow.hold_state=BOOKED, DispatchWindow.booked_job_id=job.id"
          - "increments DispatchWindow.version by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /jobs/{id}/visits (creates WorkVisit)"
        actor: Pro
        preconditions:
          - "acting Pro == Job.pro_id"
          - "the referenced DispatchWindow is the one booked for this job (hold_state=BOOKED, booked_job_id=job.id)"
          - "WorkVisit.arrived_at within [window_start, window_end)"
        side_effects:
          - "creates a WorkVisit with outcome=OPEN"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /jobs/{id}/complete"
        actor: Pro
        preconditions:
          - "acting Pro == Job.pro_id"
          - "an Invoice exists for the job in status ISSUED"
        side_effects:
          - "sets the open WorkVisit.outcome=RESOLVED"
          - "increments Pro.completed_job_count by 1 (only when is_warranty_callback=false)"
          - "recomputes Pro.callback_rate"
          - "sets DispatchWindow.hold_state=RELEASED"
        note: "callback jobs do NOT increment completed_job_count, but DO recompute callback_rate baseline"

      - from: COMPLETED
        to: CALLBACK_OPEN
        trigger: "POST /jobs/{id}/callbacks"
        actor: Customer
        preconditions:
          - "now < job.completed_at + category.callback_warranty_days days"
          - "job.is_warranty_callback == false (cannot callback a callback)"
        side_effects:
          - "creates a NEW Job (the callback job) with parent_job_id=this.id, is_warranty_callback=true, status=SCHEDULED, pro_id=this.pro_id"
          - "increments Pro.callback_job_count by 1"
          - "recomputes Pro.callback_rate"
        note: "callback job re-uses original Pro; it is pre-scheduled, skipping quoting"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Customer
        preconditions:
          - "no Invoice in status PAID for this job"
        side_effects:
          - "sets booked DispatchWindow.hold_state=RELEASED"
          - "voids any DRAFT/ISSUED Invoice (status=VOID)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "sets booked DispatchWindow.hold_state=RELEASED, booked_job_id=null"
          - "clears Job.pro_id"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: Pro
        preconditions:
          - "Job.status == IN_PROGRESS"
          - "acting Pro == Job.pro_id"
        side_effects:
          - "recomputes labor_subtotal_cents, parts_subtotal_cents, trip_fee_cents, total_cents per §1.3 invoice_total"
          - "sets balance_due_cents = total_cents (amount_paid=0, refunded=0)"

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Customer
        preconditions:
          - "amount_cents == invoice.balance_due_cents (full payment only)"
        side_effects:
          - "sets amount_paid_cents += amount_cents"
          - "recomputes balance_due_cents per §1.3 invoice_reconciliation"

      - from: PAID
        to: REFUNDED
        trigger: "system: Dispute APPROVED with approved_refund_cents == invoice.amount_paid_cents"
        actor: system
        preconditions:
          - "approved_refund_cents == invoice.amount_paid_cents (full refund)"
        side_effects:
          - "sets refunded_cents += approved_refund_cents"
          - "recomputes balance_due_cents per §1.3 invoice_reconciliation"
        note: "partial refund keeps status=PAID; only a full refund moves to REFUNDED"

      - from: DRAFT
        to: VOID
        trigger: "system: Job cancelled"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOID
        trigger: "system: Job cancelled before payment"
        actor: system
        preconditions:
          - "amount_paid_cents == 0"
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "Invoice.status IN {PAID, REFUNDED}"
        side_effects: []

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Customer
        preconditions:
          - "acting Customer == Job.customer_id"
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Customer
        preconditions:
          - "acting Customer == Job.customer_id"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /disputes/{id}/resolve (decision=APPROVE)"
        actor: PlatformAdmin
        preconditions:
          - "0 < approved_refund_cents <= invoice.amount_paid_cents - invoice.refunded_cents"
        side_effects:
          - "sets Dispute.approved_refund_cents"
          - "increments Invoice.refunded_cents by approved_refund_cents; recomputes balance_due_cents"
          - "if approved_refund_cents == invoice.amount_paid_cents (cumulative full) -> Invoice transitions PAID->REFUNDED"
          - "if refund_destination=WALLET -> Customer.wallet_credit_cents += approved_refund_cents"
          - "if reason=WORK_INCOMPLETE and a warranty callback exists -> that callback Job is auto-cancelled and Pro.callback_job_count decremented, Pro.callback_rate recomputed"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /disputes/{id}/resolve (decision=DENY)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "sets Dispute.approved_refund_cents = 0"

  - entity: Pro
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system: all required BackgroundCheck rows PASS"
        actor: system
        preconditions:
          - "every BackgroundCheck for this Pro with check_type IN {CRIMINAL, IDENTITY} has decision=PASS"
        side_effects:
          - "sets Pro.background_check_status = CLEARED"
        note: "background_check_status is the dimension; license_status evolves on a parallel axis"

      - from: PENDING
        to: FLAGGED
        trigger: "system: any required BackgroundCheck row FAIL"
        actor: system
        preconditions:
          - "some BackgroundCheck with check_type IN {CRIMINAL, IDENTITY} has decision=FAIL"
        side_effects:
          - "sets Pro.background_check_status = FLAGGED"

      - from: CLEARED
        to: FLAGGED
        trigger: "system: a later BackgroundCheck FAIL after clearance"
        actor: system
        preconditions:
          - "some BackgroundCheck with check_type IN {CRIMINAL, IDENTITY} has decision=FAIL"
        side_effects:
          - "sets Pro.background_check_status = FLAGGED"
          - "cancels all of this Pro's SCHEDULED jobs (status->CANCELLED), releasing their DispatchWindows"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: window-book-stale
    parent_entity: DispatchWindow
    write_endpoint: "POST /dispatch-windows/{id}/book"
    occ_field: "expected_dispatchwindow_version"
    description: |
      Booking a Job into a DispatchWindow whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already booked the same window (legitimately moving it FREE->BOOKED,
      which advances its version), so the current writer's view of the window is
      stale even though, under natural product semantics, a FREE window would accept
      the booking.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: quote_pricing
    trigger: "on POST /jobs/{id}/instant-quote (INSTANT) or POST /jobs/{id}/quotes (IN_HOME)"
    algorithm: forward_looking
    formula: |
      # Two variants price the SAME job differently; this is the dual-variant core.
      # INSTANT variant (system, sight-unseen, all-in flat):
      INSTANT:
        priced_amount_cents = category.instant_quote_flat_cents
        # no parts, no per-hour labor, no trip fee — single sight-unseen flat number.

      # IN_HOME variant (pro on-site estimate, itemized projection):
      IN_HOME:
        if category.pricing_model == FLAT:
            labor = category.flat_task_fee_cents
        else:  # HOURLY
            # round labor per-line first is N/A here (single projected figure):
            labor = round_half_up(quote.estimated_labor_hours * category.hourly_rate_cents)
        trip = trip_fee(job, pro)          # see invoice_total.trip_fee
        priced_amount_cents = labor + trip
        # parts are unknown at estimate time and excluded; they appear only on the Invoice.
    input_set: "single Job + its ServiceCategory + (IN_HOME) the estimating Pro and Quote.estimated_labor_hours"
    constants: {}
    precision: "cents (integer); round_half_up when multiplying hours by rate"
    variants:
      - name: INSTANT
        when: "instant-quote path; category.instant_quote_eligible=true; non-callback job"
        difference: "all-in sight-unseen flat price; ignores estimated hours, parts, and trip fee"
      - name: IN_HOME
        when: "in-home estimate path"
        difference: "itemized projection = labor (flat or hours*rate) + trip fee; excludes parts (deferred to invoice)"

  - name: part_line_pricing
    trigger: "on POST /jobs/{id}/part-lines (PartLine create) and on invoice issue recompute"
    algorithm: tiered_pricing
    formula: |
      base = unit_cost_cents * quantity
      if from_truck_stock:
          # truck-stock parts carry the Pro's markup, capped, with a per-line floor:
          markup = round_half_up(base * pro.truck_stock_markup_pct)
          markup = min(markup, TRUCK_MARKUP_CAP_CENTS)        # cap the absolute markup
          line_total_cents = base + max(markup, TRUCK_MARKUP_FLOOR_CENTS)
      else:
          # special-order parts: flat handling fee per line, no percentage markup:
          line_total_cents = base + SPECIAL_ORDER_HANDLING_CENTS
    input_set: "single PartLine + its Job's assigned Pro (for markup pct)"
    constants:
      TRUCK_MARKUP_CAP_CENTS: 5000
      TRUCK_MARKUP_FLOOR_CENTS: 300
      SPECIAL_ORDER_HANDLING_CENTS: 1500
    precision: "cents (integer); round_half_up on the percentage markup before cap/floor"

  - name: invoice_total
    trigger: "on POST /invoices/{id}/issue (DRAFT->ISSUED)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED: (1) labor_subtotal, (2) parts_subtotal,
      # (3) trip_fee (depends on labor+parts being known for the waiver test),
      # (4) total. Computing trip_fee before subtotals would mis-apply the waiver.
      if category.pricing_model == FLAT:
          labor_subtotal_cents = category.flat_task_fee_cents
      else:  # HOURLY
          # ROUNDING ORDER PINNED: round EACH LaborLine to cents, THEN sum.
          labor_subtotal_cents = sum( round_half_up(ll.hours_worked * ll.rate_cents_per_hour)
                                      for ll in job.labor_lines )    # already integer cents
      parts_subtotal_cents = sum( pl.line_total_cents for pl in job.part_lines )

      trip_fee_cents = trip_fee(job, pro)   # see below

      # WAIVER: warranty-callback jobs and jobs whose labor+parts >= FREE_TRIP_THRESHOLD_CENTS
      # pay no trip fee.
      if job.is_warranty_callback or (labor_subtotal_cents + parts_subtotal_cents) >= FREE_TRIP_THRESHOLD_CENTS:
          trip_fee_cents = 0

      total_cents = labor_subtotal_cents + parts_subtotal_cents + trip_fee_cents

      # trip_fee(job, pro):
      #   if job.address_zip_code == pro.home_zip_code: base_trip = LOCAL_TRIP_FEE_CENTS
      #   else: base_trip = REMOTE_TRIP_FEE_CENTS
      #   return base_trip
    input_set: "the Job, its ServiceCategory, all LaborLine + PartLine rows on the job, the assigned Pro"
    constants:
      LOCAL_TRIP_FEE_CENTS: 2500
      REMOTE_TRIP_FEE_CENTS: 6000
      FREE_TRIP_THRESHOLD_CENTS: 40000
    precision: "cents (integer); round each LaborLine before summing (per-line rounding pinned)"

  - name: invoice_reconciliation
    trigger: "on POST /invoices/{id}/pay and on Dispute APPROVED refund application"
    algorithm: aggregation
    formula: |
      # Derived-field reconciliation; refunds ADD back to balance_due.
      balance_due_cents = total_cents - amount_paid_cents + refunded_cents
      # status transitions are governed by the Invoice state machine, not here:
      #   amount_paid_cents == total_cents (and refunded==0) -> PAID
      #   cumulative refunded_cents == amount_paid_cents (full) -> REFUNDED
    input_set: "single Invoice's total_cents, amount_paid_cents, refunded_cents"
    constants: {}
    precision: "cents (integer)"

  - name: pro_callback_rate
    trigger: "on Job COMPLETED, on callback opened (COMPLETED->CALLBACK_OPEN), and on Dispute APPROVED callback auto-cancel"
    algorithm: weighted_scoring
    formula: |
      if pro.completed_job_count == 0:
          callback_rate = 0
      else:
          callback_rate = round_half_up_4dp(pro.callback_job_count / pro.completed_job_count)
    input_set: "single Pro's completed_job_count and callback_job_count counters"
    constants: {}
    precision: "ratio, round_half_up to 4 decimal places"
    variants:
      - name: base_completion
        when: "Job COMPLETED with is_warranty_callback=false"
        difference: "completed_job_count increments (denominator grows); callback_rate falls or holds"
      - name: callback_event
        when: "callback opened or dispute-driven callback cancel"
        difference: "callback_job_count increments/decrements (numerator changes); completed_job_count untouched"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: existence
    check: "request body is well-formed: all source=input required fields present, enum values legal, types correct (shape/format level, before resource lookup)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers, POST /pros, POST /service-categories"

  - priority: 3
    category: auth
    check: "acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: business_constraint
    check: "body is semantically coherent given the referenced configuration: FLAT category must carry flat_task_fee_cents and HOURLY must carry hourly_rate_cents; instant_quote_flat_cents present when instant_quote_eligible; window_end > window_start; requested_refund_cents >= 1"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /service-categories, POST /dispatch-windows, POST /disputes"

  - priority: 6
    category: business_referential
    check: "acting entity_backed role owns the target resource (Customer owns Job; Pro owns DispatchWindow/Invoice)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped writes"

  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "assigned/estimating Pro has background_check_status == CLEARED"
    error_id: ERR_PRO_NOT_CLEARED
    http_status: 422
    applies_to: "POST /jobs/{id}/quotes, POST /dispatch-windows/{id}/book"

  - priority: 9
    category: business_safety
    check: "if category.requires_license, the Pro's license_status == VERIFIED and license_expires_on is in the future"
    error_id: ERR_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /jobs/{id}/quotes, POST /dispatch-windows/{id}/book"

  - priority: 10
    category: business_constraint
    check: "Pro.skill_tags is a superset of category.skill_tags (every required tag carried)"
    error_id: ERR_SKILL_TAG_MISMATCH
    http_status: 422
    applies_to: "POST /jobs/{id}/quotes, POST /dispatch-windows/{id}/book"

  - priority: 11
    category: business_constraint
    check: "instant-quote path requested only on categories with instant_quote_eligible=true and on non-callback jobs"
    error_id: ERR_INSTANT_QUOTE_INELIGIBLE
    http_status: 422
    applies_to: "POST /jobs/{id}/instant-quote"

  - priority: 12
    category: business_temporal
    check: "DispatchWindow.service_zip_code matches Job.address_zip_code"
    error_id: ERR_ZIP_MISMATCH
    http_status: 422
    applies_to: "POST /dispatch-windows/{id}/book"

  - priority: 13
    category: business_temporal
    check: "WorkVisit.arrived_at falls within [window_start, window_end) of the booked window (half-open)"
    error_id: ERR_VISIT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /jobs/{id}/visits"

  - priority: 14
    category: business_temporal
    check: "a new DispatchWindow for a Pro must not overlap an existing non-RELEASED window of that Pro (intervals are half-open; touching at a boundary is allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /dispatch-windows"

  - priority: 15
    category: business_temporal
    check: "the booked window must leave a gap of at least 60 minutes (TRAVEL_BUFFER_MINUTES) before/after any other BOOKED window of the same Pro when the two windows serve different ZIPs; same-ZIP back-to-back windows need no buffer"
    error_id: ERR_TRAVEL_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /dispatch-windows/{id}/book"

  - priority: 16
    category: business_temporal
    check: "the booking Customer must not already have another SCHEDULED job whose booked window's [start,end] interval touches or overlaps this window's interval (CLOSED intervals: back-to-back/adjacent windows are rejected because a customer cannot be at two sites at once)"
    error_id: ERR_CUSTOMER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dispatch-windows/{id}/book"

  - priority: 17
    category: business_temporal
    check: "callback may only be opened while now < completed_at + category.callback_warranty_days"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /jobs/{id}/callbacks"

  - priority: 18
    category: business_fiscal
    check: "payment amount_cents must equal the invoice balance_due_cents exactly (full payment only)"
    error_id: ERR_PARTIAL_PAYMENT
    http_status: 422
    applies_to: "POST /invoices/{id}/pay"

  - priority: 19
    category: business_fiscal
    check: "approved_refund_cents must be > 0 and <= invoice.amount_paid_cents - invoice.refunded_cents"
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /disputes/{id}/resolve"

  - priority: 20
    category: business_constraint
    check: "FLAT-category invoice/quote requests must not carry LaborLine hours; HOURLY-category must carry LaborLine hours before issue"
    error_id: ERR_PRICING_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /jobs/{id}/labor-lines, POST /invoices/{id}/issue"

  - priority: 21
    category: business_fiscal
    check: "OCC: expected_dispatchwindow_version must equal the live DispatchWindow.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dispatch-windows/{id}/book"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- ServiceCategory ----
  - method: POST
    path: "/service-categories"
    description: "create a service category / skill-tag definition"
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "name", "pricing_model", "requires_license?", "flat_task_fee_cents?", "hourly_rate_cents?", "instant_quote_eligible?", "instant_quote_flat_cents?", "callback_warranty_days?", "skill_tags?"]
    output: ServiceCategory
    side_effects: []
  - method: GET
    path: "/service-categories/{id}"
    description: "fetch a service category"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: ServiceCategory
    side_effects: []
  - method: GET
    path: "/service-categories"
    description: "list service categories"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceCategory[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "register a customer"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, zip_code]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "fetch a customer (includes wallet_credit_cents)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Pro ----
  - method: POST
    path: "/pros"
    description: "register a pro (background_check_status starts PENDING, license_status NONE)"
    roles: [Anonymous]
    code: 201
    input: ["email", "full_name", "home_zip_code", "skill_tags?", "truck_stock_markup_pct?"]
    output: Pro
    side_effects: []
  - method: GET
    path: "/pros/{id}"
    description: "fetch a pro (includes background/license posture, callback_rate)"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: Pro
    side_effects: []
  - method: POST
    path: "/pros/{id}/background-checks"
    description: "submit a background/identity/license check for a pro"
    roles: [PlatformAdmin]
    code: 201
    input: ["check_type", "license_expires_on?"]
    output: BackgroundCheck
    side_effects: ["creates BackgroundCheck with decision=PENDING"]
  - method: GET
    path: "/pros/{id}/background-checks"
    description: "list a pro's background checks (FK reverse-reachability for BackgroundCheck.pro_id)"
    roles: [PlatformAdmin, Pro]
    code: 200
    input: []
    output: BackgroundCheck[]
    side_effects: []
  - method: GET
    path: "/pros/{id}/dispatch-windows"
    description: "list a pro's dispatch windows (FK reverse-reachability for DispatchWindow.pro_id)"
    roles: [PlatformAdmin, Pro, Dispatcher, Customer]
    code: 200
    input: []
    output: DispatchWindow[]
    side_effects: []
  - method: GET
    path: "/pros/{id}/jobs"
    description: "list jobs assigned to a pro (FK reverse-reachability for Job.pro_id)"
    roles: [PlatformAdmin, Pro, Dispatcher]
    code: 200
    input: []
    output: Job[]
    side_effects: []

  # ---- BackgroundCheck decision ----
  - method: POST
    path: "/background-checks/{id}/decide"
    description: "record PASS/FAIL on a background check; may flip Pro background/license posture"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision", "expected_pro_version?"]
    output: BackgroundCheck
    side_effects:
      - "sets BackgroundCheck.decision"
      - "recomputes Pro.background_check_status (PENDING->CLEARED/FLAGGED, CLEARED->FLAGGED)"
      - "for check_type=LICENSE PASS: sets Pro.license_status=VERIFIED, license_expires_on; PASS with past expiry -> EXPIRED"
      - "CLEARED->FLAGGED cancels the Pro's SCHEDULED jobs and releases their windows"

  # ---- Job ----
  - method: POST
    path: "/jobs"
    description: "request a job (status REQUESTED)"
    roles: [Customer]
    code: 201
    input: [customer_id, category_id, address_zip_code]
    output: Job
    side_effects: []
  - method: GET
    path: "/jobs/{id}"
    description: "fetch a job"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: GET
    path: "/jobs"
    description: "list jobs, filterable by customer_id / category_id / parent_job_id"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: ["customer_id?", "category_id?", "parent_job_id?", "limit?", "offset?"]
    output: Job[]
    side_effects: []
  - method: POST
    path: "/jobs/{id}/instant-quote"
    description: "produce an instant quote (REQUESTED->INSTANT_QUOTED)"
    roles: [Customer]
    code: 201
    input: []
    output: Quote
    side_effects:
      - "creates Quote(quote_type=INSTANT, priced_amount_cents per quote_pricing INSTANT)"
      - "sets Job.quote_path=INSTANT, Job.status=INSTANT_QUOTED"
  - method: POST
    path: "/jobs/{id}/request-estimate"
    description: "request an in-home estimate (REQUESTED->ESTIMATE_REQUESTED)"
    roles: [Customer]
    code: 200
    input: []
    output: Job
    side_effects: ["sets Job.quote_path=IN_HOME, Job.status=ESTIMATE_REQUESTED"]
  - method: POST
    path: "/jobs/{id}/quotes"
    description: "a pro submits an in-home estimate (ESTIMATE_REQUESTED->ESTIMATED)"
    roles: [Pro]
    code: 201
    input: ["estimated_labor_hours?"]
    output: Quote
    side_effects:
      - "creates Quote(quote_type=IN_HOME, priced_amount_cents per quote_pricing IN_HOME)"
      - "supersedes prior non-accepted Quote on the job; sets Job.status=ESTIMATED"
  - method: GET
    path: "/jobs/{id}/quotes"
    description: "list quotes for a job (FK reverse-reachability for Quote.job_id)"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/jobs/{id}/accept-quote"
    description: "customer accepts the active quote (marks Quote.accepted, pins agreed_price_cents)"
    roles: [Customer]
    code: 200
    input: [quote_id]
    output: Job
    side_effects:
      - "sets Quote.accepted=true; sets Job.agreed_price_cents = Quote.priced_amount_cents"
    note: "job stays INSTANT_QUOTED/ESTIMATED until a window is booked"
  - method: POST
    path: "/jobs/{id}/cancel"
    description: "cancel a job (REQUESTED/SCHEDULED/IN_PROGRESS -> CANCELLED)"
    roles: [Customer]
    code: 200
    input: []
    output: Job
    side_effects:
      - "releases booked DispatchWindow; voids DRAFT/ISSUED unpaid Invoice; clears Job.pro_id"
  - method: POST
    path: "/jobs/{id}/complete"
    description: "pro marks job complete (IN_PROGRESS->COMPLETED)"
    roles: [Pro]
    code: 200
    input: []
    output: Job
    side_effects:
      - "resolves open WorkVisit; increments Pro.completed_job_count (non-callback); recomputes callback_rate; releases window"
  - method: POST
    path: "/jobs/{id}/callbacks"
    description: "customer opens a warranty callback (COMPLETED->CALLBACK_OPEN; spawns callback Job)"
    roles: [Customer]
    code: 201
    input: []
    output: Job
    side_effects:
      - "creates callback Job(parent_job_id, is_warranty_callback=true, status=SCHEDULED, pro_id=original.pro_id)"
      - "increments Pro.callback_job_count; recomputes callback_rate"
  - method: GET
    path: "/jobs/{id}/visits"
    description: "list a job's work visits (FK reverse-reachability for WorkVisit.job_id)"
    roles: [PlatformAdmin, Customer, Pro, Dispatcher]
    code: 200
    input: []
    output: WorkVisit[]
    side_effects: []
  - method: POST
    path: "/jobs/{id}/visits"
    description: "pro logs arrival, opening a work visit (SCHEDULED->IN_PROGRESS)"
    roles: [Pro]
    code: 201
    input: [dispatch_window_id, arrived_at]
    output: WorkVisit
    side_effects: ["creates WorkVisit(outcome=OPEN); sets Job.status=IN_PROGRESS"]
  - method: GET
    path: "/work-visits/{id}"
    description: "fetch a single work visit"
    roles: [PlatformAdmin, Pro, Dispatcher, Customer]
    code: 200
    input: []
    output: WorkVisit
    side_effects: []
  - method: GET
    path: "/work-visits"
    description: "list work visits, filterable by job_id / dispatch_window_id (FK reverse-reachability for WorkVisit.dispatch_window_id)"
    roles: [PlatformAdmin, Pro, Dispatcher, Customer]
    code: 200
    input: ["job_id?", "dispatch_window_id?", "limit?", "offset?"]
    output: WorkVisit[]
    side_effects: []

  # ---- LaborLine ----
  - method: POST
    path: "/jobs/{id}/labor-lines"
