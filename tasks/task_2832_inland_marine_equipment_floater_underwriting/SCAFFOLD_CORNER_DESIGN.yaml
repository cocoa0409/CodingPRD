            - "after trigger[5]: EquipmentItem.${itm}.rated_premium_cents == 161186 and CoveragePart.${cp}.rated_premium_cents == 161186"

      - name: corner_item_insured_value_versus_per_item_limit
        claim_type: Violation → Error
        grounds:
          - validations[priority=71]
          - errors[ERR_ITEM_VALUE_EXCEEDS_PER_ITEM_LIMIT]
          - calculations.equipment_insured_value
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: |
          The fiscal test is on the DERIVED insured_value_cents, not on
          original_cost_cents: with per_item_limit_cents 8160000 the model_year 2022
          unit whose ACV lands exactly ON 8160000 is accepted while the NEWER
          model_year 2023 unit of identical 12000000 cost depreciates to 9120000 and
          is refused, so the newer machine is the uninsurable one.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart, valuation_basis ACV, per_item_limit_cents 8160000, aggregate_limit_cents 200000000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Per Item Cap Contracting", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 8160000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator at the cap", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { itm_ok: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator over the cap", equipment_type: "EXCAVATOR", model_year: 2023, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 201"
            - "after trigger[0]: EquipmentItem.${itm_ok}.insured_value_cents == 8160000 (exactly the per-item limit, which is inclusive) and rated_premium_cents == 173318"
            - "trigger[2] HTTP status == 422"
            - "trigger[2] response error_id == ERR_ITEM_VALUE_EXCEEDS_PER_ITEM_LIMIT"
            - "after trigger[2]: CoveragePart.${cp}.rated_premium_cents == 173318 (only the accepted item contributes) and the part has exactly one EquipmentItem child"
            - "after trigger[2]: Policy.${pol}.total_insured_value_cents == 8160000 and written_premium_cents == 180251"
            - "the rejected unit's 9120000 would have been derived from the same 12000000 cost, so a check written against original_cost_cents cannot distinguish the two calls"

      - name: corner_transit_declared_value_versus_applicable_limit
        claim_type: Violation → Error
        grounds:
          - validations[priority=73]
          - errors[ERR_TRANSIT_VALUE_EXCEEDS_LIMIT]
          - calculations.transit_applicable_limit
          - entities.TransitShipment.catastrophe_zone
          - endpoints[POST /inland-marine/coverage-parts/{id}/transit-shipments]
        distinguishing_aspect: |
          The limit a shipment is tested against is the three-way minimum, not the
          part's owned limit: an inland run is capped at the 4000000 owned limit, but
          the identical vehicle bound for T1_COASTAL is capped at the 2000000
          catastrophe limit, so 2500000 of declared value is insurable inland and
          uninsurable to the coast.
        test_recipe:
          setup:
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE TRANSIT CoveragePart: valuation_basis ACV, aggregate_limit_cents 200000000, transit_owned_limit_cents 4000000, transit_hired_limit_cents 3000000, catastrophe_limit_cents 2000000."
            - "One PENDING_APPROVAL OWNED Vehicle with per_conveyance_limit_cents 10000000."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Lowboy Logistics", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 4000000, transit_hired_limit_cents: 3000000, catastrophe_limit_cents: 2000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "LOWBOY-1", ownership: "OWNED", per_conveyance_limit_cents: 10000000 }
              as: Underwriter
              captures: { veh: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T00:00:00Z", arrival_at: "2026-08-05T06:00:00Z", declared_value_cents: 5000000 }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T00:00:00Z", arrival_at: "2026-08-05T06:00:00Z", declared_value_cents: 4000000 }
              as: Underwriter
              captures: { shp_inland: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T1_COASTAL", departure_at: "2026-08-05T12:00:00Z", arrival_at: "2026-08-05T18:00:00Z", declared_value_cents: 2500000 }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T1_COASTAL", departure_at: "2026-08-05T12:00:00Z", arrival_at: "2026-08-05T18:00:00Z", declared_value_cents: 2000000 }
              as: Underwriter
              captures: { shp_coastal: $.data.id }
          assert:
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_TRANSIT_VALUE_EXCEEDS_LIMIT"
            - "after trigger[0]: Vehicle.${veh}.in_transit_value_cents == 0 and the part has zero TransitShipment children"
            - "trigger[1] HTTP status == 201"
            - "after trigger[1]: TransitShipment.${shp_inland}.catastrophe_zone == false, applicable_limit_cents == 4000000 and status == PLANNED"
            - "trigger[2] HTTP status == 422"
            - "trigger[2] response error_id == ERR_TRANSIT_VALUE_EXCEEDS_LIMIT"
            - "trigger[3] HTTP status == 201"
            - "after trigger[3]: TransitShipment.${shp_coastal}.catastrophe_zone == true and applicable_limit_cents == 2000000"
            - "after trigger[3]: Vehicle.${veh}.in_transit_value_cents == 0 (planning does not load the conveyance; only departure does)"
            - "the vehicle's own 10000000 per_conveyance_limit_cents never binds, so an implementation that tests declared_value_cents against it alone accepts all four calls"

      - name: corner_reported_value_versus_reporting_limit
