# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: child-support-enforcement (task_2776)
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1–§1.7. Deleting this
# file leaves the declared behaviour identical; it only removes the audit index.
# All numeric literals below were produced by executing the §1.3 formulas and
# their `constants:` as code — none are estimates.

scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc
  # Differentiation: the two instances live in different entity domains —
  # instance 1 is money/ledger on SupportCase + ObligationCharge, instance 2
  # is scoring on Participant.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: interest_variant_divergence_on_case_ledger
        grounds:
          - calculations.arrears_interest_accrual
          - entities.ObligationCharge.fields.interest_accrued_cents
          - entities.SupportCase.fields.interest_receivable_cents
          - endpoints[GET /child-support/cases/{case_id}/ledger]
          - endpoints[POST /child-support/cases/{case_id}/accrual-runs]
        distinguishing_aspect: |
          On one identical set of three OPEN charges the statutory_per_charge
          variant totals 1125 cents while the aggregate_month_end variant
          totals 2250 cents, so ObligationCharge.interest_accrued_cents and
          SupportCase.interest_receivable_cents must differ by exactly 1125 on
          the same request.
        test_recipe:
          setup:
            - "Logical clock starts at the server default 2026-08-01T00:00:00Z."
            - "One DIRECT_APPLICATION case, tanf_assistance false, child_count 2; CP monthly income 200000 and NCP monthly income 300000, both VERIFIED_WAGE_RECORD; NCP locate_status LOCATED."
            - "Paternity resolved on the PRESUMED_MARITAL track so the case reaches ORDER_ESTABLISHMENT with no genetic cost."
            - "One CURRENT_SUPPORT order, origin MN, effective 2026-08-01, ENTERED at the guideline amount 75000."
            - "Three OPEN CURRENT_SUPPORT charges of 75000 each: periods 2026-08-01/2026-09-01, 2026-09-01/2026-10-01 and 2026-10-01/2026-11-01, due 2026-08-15, 2026-09-15 and 2026-10-15. Nothing paid."
            - "Clock advanced to 2026-11-01T00:00:00Z and one accrual run posted."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1111", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2222", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: $.data.monthly_obligation_cents }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch1_id: $.data.id, ch1_amt: $.data.amount_cents }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { ch2_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
              captures: { ch3_id: $.data.id }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
              captures: { receivable_after_run: $.data.interest_receivable_cents }
          trigger:
            - call: "GET /child-support/cases/${case_id}/ledger"
              payload: { as_of_date: "2026-11-01" }
              as: FinanceOfficer
            - call: "GET /child-support/charges/${ch1_id}"
              as: FinanceOfficer
              captures: { i1: $.data.interest_accrued_cents }
            - call: "GET /child-support/charges/${ch2_id}"
              as: FinanceOfficer
              captures: { i2: $.data.interest_accrued_cents }
            - call: "GET /child-support/charges/${ch3_id}"
              as: FinanceOfficer
              captures: { i3: $.data.interest_accrued_cents }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { receivable: $.data.interest_receivable_cents, principal: $.data.arrears_principal_cents }
          assert:
            - "${monthly} == 75000"
            - "${ch1_amt} == 75000"
            - "${i1} == 750  # statutory_per_charge: 2 whole months from 2026-08-15 to 2026-11-01"
            - "${i2} == 375  # 1 whole month from 2026-09-15"
            - "${i3} == 0    # less than one whole month from 2026-10-15"
            - "${i1} + ${i2} + ${i3} == 1125  # statutory_per_charge total"
            - "${receivable} == 2250  # aggregate_month_end total, minus 0 written off, minus 0 collected"
            - "${receivable_after_run} == 2250"
            - "${receivable} - (${i1} + ${i2} + ${i3}) == 1125  # the two variants diverge by exactly 1125 cents on identical data"
            - "${principal} == 225000"
            - "GET /child-support/cases/${case_id}/ledger?as_of_date=2026-11-01 reports interest_receivable_cents == 2250 (aggregate_month_end) and arrears_principal_cents == 225000"

      - name: risk_variant_tier_flip_on_noncustodial_participant
        grounds:
          - calculations.ncp_compliance_risk_score
          - entities.Participant.fields.enforcement_risk_score
          - entities.Participant.fields.enforcement_risk_tier
          - entities.Participant.fields.compromise_risk_score
          - entities.Participant.fields.compromise_risk_tier
          - entities.Participant.fields.total_arrears_certified_cents
          - state_machines.IncomeWithholdingOrder.remittance_status.DELINQUENT_to_DEFAULTED
        distinguishing_aspect: |
          On one Participant row the enforcement_screen variant scores 65
          (MEDIUM) while the compromise_screen variant scores 73 (HIGH) from
          the identical six component sub-scores, so the two variants land in
          different tiers and the HIGH compromise tier alone blocks offer
          creation.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION case, tanf_assistance false, child_count 2; CP income 150000, NCP income 330000, both VERIFIED_WAGE_RECORD; NCP locate_status LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at guideline 82500."
            - "Six OPEN CURRENT_SUPPORT charges of 82500 (monthly periods 2026-08-01 through 2027-02-01, due on the 15th), nothing paid: arrears_principal_cents 495000, total_charged_principal_cents 495000, total_collected_principal_cents 0."
            - "One IWO on an MN employer (remittance_fee_cents 0) SERVED, then two lapses so remittance_status is DEFAULTED."
            - "Clock advanced to 2027-02-01T00:00:00Z with one accrual run posted."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Bree Okafor", ssn_last4: "3131", residence_state_code: "MN", monthly_gross_income_cents: 150000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Cal Okafor", ssn_last4: "3232", residence_state_code: "MN", monthly_gross_income_cents: 330000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: $.data.monthly_obligation_cents }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-11-01", period_end_date: "2026-12-01", due_date: "2026-11-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-12-01", period_end_date: "2027-01-01", due_date: "2026-12-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2027-01-01", period_end_date: "2027-02-01", due_date: "2027-01-15" }
              as: FinanceOfficer
            - call: "POST /child-support/employers"
              payload: { legal_name: "Northshore Foundry", fein: "41-0000001", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "GET /child-support/orders/${order_id}"
              as: CaseWorker
              captures: { order_v: $.data.version }
            - call: "POST /child-support/orders/${order_id}/withholding-orders"
              payload: { employer_id: "${emp_id}", expected_order_version: "${order_v}", reported_disposable_income_cents: 155000 }
              as: CaseWorker
              captures: { iwo_id: $.data.id, wh_amt: $.data.withholding_amount_cents }
            - call: "POST /child-support/withholding-orders/${iwo_id}/service"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/withholding-orders/${iwo_id}/lapse"
              payload: {}
              as: FinanceOfficer
              captures: { rs1: $.data.remittance_status }
            - call: "POST /child-support/withholding-orders/${iwo_id}/lapse"
              payload: {}
              as: FinanceOfficer
              captures: { rs2: $.data.remittance_status, missed: $.data.missed_remittance_count }
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { e_score: $.data.enforcement_risk_score, e_tier: $.data.enforcement_risk_tier, c_score: $.data.compromise_risk_score, c_tier: $.data.compromise_risk_tier, certified: $.data.total_arrears_certified_cents }
          assert:
            - "${monthly} == 82500"
            - "${wh_amt} == 99000"
            - "${rs1} == \"DELINQUENT\""
            - "${rs2} == \"DEFAULTED\""
            - "${missed} == 2"
            - "${e_score} == 65  # (40*50 + 25*100 + 20*100 + 10*0 + 5*0 + 0*0)/100"
            - "${e_tier} == \"MEDIUM\""
            - "${c_score} == 73  # round_half_up((25*50 + 20*100 + 40*100 + 0 + 0 + 15*0)/100) = round_half_up(72.5)"
            - "${c_tier} == \"HIGH\""
            - "${e_tier} != ${c_tier}  # identical components, different tier"
            - "${certified} == 501189  # 495000 principal + 6189 statutory_per_charge interest at 2027-02-01"

  # =====================================================================
  # RULE 2 — combinatorial_formula
  # Differentiation: three distinct modes.
  #   instance 1 = mode (a) four+ inputs combining non-linearly
  #   instance 2 = mode (b) nested rounding where the order of rounding matters
  #   instance 3 = mode (c) circular-looking dependency resolved in one pass
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: withholding_cap_nested_min_state_override
        grounds:
          - calculations.withholding_amount
          - entities.IncomeWithholdingOrder.fields.federal_cap_pct
          - entities.IncomeWithholdingOrder.fields.ccpa_cap_pct
          - entities.IncomeWithholdingOrder.fields.ccpa_cap_amount_cents
          - entities.IncomeWithholdingOrder.fields.jurisdiction_state_code
          - entities.Employer.fields.statutory_cap_pct
          - concurrency_rules[iwo-issue-stale-order]
        distinguishing_aspect: |
          Mode (a): withholding_amount_cents 77300 is produced by five inputs
          interacting non-linearly — reported disposable income 155000, the
          order's monthly obligation 82500, the case's arrears principal
          495000 (which bumps the federal cap from 0.60 to 0.65), the
          EMPLOYER's state TX (whose 0.50 statutory cap wins the min against
          the bumped federal 0.65 even though the case and the order are both
          MN), and the employer's 200-cent remittance fee which is subtracted
          after the floor; changing any one of the five moves the result.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 150000, NCP income 330000, both VERIFIED_WAGE_RECORD, supports_second_family false; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT order, origin_state_code MN, effective 2026-08-01, ENTERED at guideline 82500 with medical_support_monthly_cents 0."
            - "Six OPEN CURRENT_SUPPORT charges of 82500 posted first, so case.arrears_principal_cents is 495000 (>= 3 x 82500 = 247500) at issuance time and the 12-week bump applies."
            - "One employer registered in TX (statutory_cap_pct 0.50 from EMPLOYER_STATE_CAPS) with remittance_fee_cents 200."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Ines Marek", ssn_last4: "4141", residence_state_code: "MN", monthly_gross_income_cents: 150000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Jon Marek", ssn_last4: "4242", residence_state_code: "MN", monthly_gross_income_cents: 330000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01", medical_support_monthly_cents: 0 }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: $.data.monthly_obligation_cents }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-11-01", period_end_date: "2026-12-01", due_date: "2026-11-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-12-01", period_end_date: "2027-01-01", due_date: "2026-12-15" }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2027-01-01", period_end_date: "2027-02-01", due_date: "2027-01-15" }
              as: FinanceOfficer
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { principal_at_issue: $.data.arrears_principal_cents }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Lone Star Rigging", fein: "74-0000002", state_code: "TX", pay_frequency: "MONTHLY", remittance_fee_cents: 200 }
              as: ProgramAdmin
              captures: { emp_tx_id: $.data.id, emp_tx_cap: $.data.statutory_cap_pct }
            - call: "GET /child-support/orders/${order_id}"
              as: CaseWorker
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /child-support/orders/${order_id}/withholding-orders"
              payload: { employer_id: "${emp_tx_id}", expected_order_version: "${order_v}", reported_disposable_income_cents: 155000 }
              as: CaseWorker
              captures: { iwo_id: $.data.id, jur: $.data.jurisdiction_state_code, fed_pct: $.data.federal_cap_pct, ccpa_pct: $.data.ccpa_cap_pct, cap_amt: $.data.ccpa_cap_amount_cents, ar: $.data.arrears_recovery_cents, req: $.data.requested_amount_cents, wh: $.data.withholding_amount_cents, fee: $.data.employer_fee_cents }
          assert:
            - "${monthly} == 82500"
            - "${principal_at_issue} == 495000"
            - "${emp_tx_cap} == 0.50"
            - "${jur} == \"TX\"  # the EMPLOYER's state, not the MN case/order origin state"
            - "${ar} == 16500  # round_half_up(82500 * 0.20)"
            - "${req} == 99000  # 82500 + 0 medical + 16500"
            - "${fed_pct} == 0.65  # 0.60 base + 0.05 arrears bump because 495000 >= 247500"
            - "${ccpa_pct} == 0.50  # min(0.65, TX 0.50)"
            - "${cap_amt} == 77500  # floor(155000 * 0.50)"
            - "${wh} == 77300  # max(0, min(99000, 77500 - 200))"
            - "${fee} == 200"
            - "${wh} != ${req}  # the cap binds, so the order does not get its full request"
            - "${wh} + ${fee} == ${cap_amt}  # the fee shares the single ceiling"

      - name: guideline_ratio_rounded_to_four_dp_before_share
        grounds:
          - calculations.guideline_support_obligation
          - entities.SupportOrder.fields.guideline_basic_obligation_cents
          - entities.SupportOrder.fields.guideline_ncp_share_ratio
          - entities.SupportOrder.fields.guideline_monthly_cents
          - state_machines.SupportOrder.status.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Mode (b): the NCP share ratio 200000/300000 is rounded to exactly
          four decimal places (0.6667) BEFORE it multiplies the basic
          obligation, so guideline_monthly_cents is 56003 and not the 56000
          that an unrounded 2/3 ratio (or a single round at the end) would
          produce — a 3-cent observable that only the declared rounding order
          yields.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false."
            - "CP monthly_gross_income_cents 100000 and NCP monthly_gross_income_cents 200000, both VERIFIED_WAGE_RECORD, NCP supports_second_family false; NCP LOCATED."
            - "Combined income 300000 falls in band 1 (<= 400000) so the two-children rate is 0.28; the NCP's self-support reserve headroom is 200000 - 113200 = 86800, which does not bind."
            - "PRESUMED_MARITAL paternity so the case reaches ORDER_ESTABLISHMENT; one DRAFT CURRENT_SUPPORT order effective 2026-08-01."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
