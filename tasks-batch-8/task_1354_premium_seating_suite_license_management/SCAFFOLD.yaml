  # --- WaitlistEntry ---
  - { method: POST, path: "/api/waitlist-entries", description: "Join the waitlist (WAITING)", roles: [AccountHolder, PremiumSalesRep, StadiumAdmin], code: 201, input: [account_id, desired_tier, "target_season_id?"], output: WaitlistEntry, side_effects: ["status=WAITING"] }
  - { method: GET, path: "/api/waitlist-entries/{id}", description: "Get a waitlist entry (priority_score recomputed on read)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: WaitlistEntry, side_effects: ["priority_score recompute"] }
  - { method: GET, path: "/api/waitlist-entries", description: "List waitlist entries (AccountHolder sees only own)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["account_id?", "desired_tier?", "target_season_id?", "status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: POST, path: "/api/waitlist-entries/{id}/set_status", description: "Waitlist lifecycle (OFFERED w/ suite_id | CONVERTED | DECLINED | WITHDRAWN); promotion enforces priority order", roles: [AccountHolder, PremiumSalesRep, StadiumAdmin], code: 200, input: [target_status, "suite_id?"], output: WaitlistEntry, side_effects: ["see WaitlistEntry machine; CONVERTED creates DRAFT agreement"] }

  # --- Assessment ---
  - { method: POST, path: "/api/assessments", description: "Create an amenity/renovation assessment (DRAFT)", roles: [StadiumAdmin], code: 201, input: [venue_id, name, total_cost_cents, allocation_method], output: Assessment, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/api/assessments/{id}", description: "Get an assessment", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: Assessment, side_effects: [] }
  - { method: GET, path: "/api/assessments", description: "List assessments", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["venue_id?", "status?", "limit?", "offset?"], output: "Assessment[]", side_effects: [] }
  - { method: POST, path: "/api/assessments/{id}/set_status", description: "Assessment review flow (PROPOSED | APPROVED | CANCELLED)", roles: [StadiumAdmin], code: 200, input: [target_status], output: Assessment, side_effects: ["see Assessment machine"] }
  - { method: POST, path: "/api/assessments/{id}/levy", description: "Levy an approved assessment (APPROVED -> LEVIED): allocate shares and issue ASSESSMENT invoices", roles: [FinanceController, StadiumAdmin], code: 200, input: [], output: Assessment, side_effects: ["see Assessment levy transition and assessment_share_allocation"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, malformed, or role not one of the five declared roles" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not in the endpoint's roles list" }
  - { id: ERR_ACCOUNT_SCOPE_VIOLATION, http: 403, condition: "AccountHolder caller's X-User-ID does not match the owning account of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-supplied resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive integer where positivity required, payment amount != sum(allocations), both/neither of agreement_id+rental_id, duplicate tax_id or suite_code, self-transfer (to == from)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource not in a valid from-state for the requested transition (includes terminal-state lockdown)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the linked LicenseAgreement to be ACTIVE (catering confirm, transfer approve)" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED; new commitments (agreement execute, rental hold, catering, credentials, waitlist join) blocked" }
  - { id: ERR_ACCOUNT_CREDIT_HOLD, http: 409, condition: "Account credit_standing == HOLD blocks agreement execute / rental confirm / manual account reinstate" }
  - { id: ERR_EVENT_NOT_SCHEDULED, http: 409, condition: "Operation requires the event in SCHEDULED status (catering place/confirm, credential issue/activate)" }
  - { id: ERR_SEASON_LOCKED, http: 409, condition: "Season is SETTLED; season-scoped writes (execute with settled start season, void of season-tagged invoice) are locked" }
  - { id: ERR_CATERING_CUTOFF_PASSED, http: 409, condition: "Clock strictly after event.starts_at - effective cutoff hours; placement/confirmation no longer accepted (exactly at cutoff passes)" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Clock outside the last covered season's [renewal_window_opens_on, renewal_window_closes_on] (both ends inclusive)" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Rental confirm attempted after hold_expires_at while still HELD" }
  - { id: ERR_HOLD_NOT_EXPIRED, http: 409, condition: "Rental expire attempted at or before hold_expires_at" }
  - { id: ERR_CREDENTIAL_WINDOW, http: 409, condition: "Credential activation outside [event.starts_at - 4h, event.starts_at + duration_hours]" }
  - { id: ERR_SUITE_NOT_AVAILABLE, http: 409, condition: "Suite unavailable for the request: OUT_OF_SERVICE, or (rentals) occupied by a HELD/CONFIRMED rental on the same event, or (REGULAR/RIVALRY events) covered by a non-terminal agreement for that season, or promote/convert naming a non-AVAILABLE suite" }
  - { id: ERR_SUITE_ALREADY_LICENSED, http: 409, condition: "Agreement execute would overlap covered seasons with another agreement in {PENDING_EXECUTION, ACTIVE, SUSPENDED, EXPIRING} on the same suite" }
  - { id: ERR_SUITE_LICENSED, http: 409, condition: "Suite set OUT_OF_SERVICE attempted while LICENSED" }
  - { id: ERR_EVENT_OVERLAP, http: 409, condition: "New event's half-open interval [starts_at, starts_at+duration) intersects another SCHEDULED event on the same venue; adjacency (end == start) allowed" }
  - { id: ERR_CREDENTIAL_CAPACITY_EXCEEDED, http: 409, condition: "Issuing would push credentials in {ISSUED, ACTIVATED} for (event, suite) beyond suite.capacity_seats" }
  - { id: ERR_DUPLICATE_GUEST, http: 409, condition: "guest_email already present on a non-{REVOKED, EXPIRED} credential for the same (event, suite)" }
  - { id: ERR_WAITLIST_DUPLICATE, http: 409, condition: "Non-terminal waitlist entry already exists for (account_id, desired_tier, target_season_id)" }
  - { id: ERR_NOT_NEXT_IN_LINE, http: 409, condition: "Waitlist promotion attempted for an entry that is not the top-ranked eligible WAITING entry for the suite's tier" }
  - { id: ERR_SUITE_OFFER_PENDING, http: 409, condition: "Promote attempted naming a suite with another entry already OFFERED against it" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "Another transfer for the same agreement is in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}" }
  - { id: ERR_TRANSFER_TARGET_INELIGIBLE, http: 409, condition: "to_account not ACTIVE, or SUBLEASE targeting a BROKER account" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Invoice void blocked by allocations from payments in {INITIATED, CLEARED}" }
  - { id: ERR_RENTAL_SETTLEMENT_REQUIRED, http: 409, condition: "CONFIRMED rental cancel blocked because its RENTAL invoice is PARTIALLY_PAID or PAID" }
  - { id: ERR_UNSETTLED_BALANCE, http: 409, condition: "Past-due or open invoices block the operation (agreement terminate/cure, transfer approve/complete with unpaid transfer fee)" }
  - { id: ERR_ALLOCATION_EXCEEDS_DUE, http: 422, condition: "A payment allocation exceeds the target invoice's amount_due_cents" }
  - { id: ERR_ALLOCATION_ACCOUNT_MISMATCH, http: 422, condition: "An allocated invoice does not belong to the payment's account_id" }
  - { id: ERR_NO_LICENSED_SUITES, http: 409, condition: "Assessment levy attempted with zero LICENSED suites in the venue" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: StadiumAdmin
    description: "Stadium operations superuser: venue/suite/season/event configuration, clock control, assessments, expiry sweeps; can perform every staff operation except where a workflow reserves a step to another role"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/venues"
      - "POST /api/suites and POST /api/suites/{id}/set_status"
      - "POST /api/seasons and /publish; POST /api/events and /set_status"
      - "POST /api/assessments and /set_status"
      - "rental EXPIRED transition"
    shared_operations:
      - "All GET endpoints"
      - "accounts create/PATCH/set_status; agreements create/submit/terminate/cure; invoices create/issue/void; payments create/set_status; catering orders create/PATCH/set_status; credentials create/set_status; rentals create/set_status; transfer set_status/complete; renewal offers create/set_status REVISED; waitlist create/set_status OFFERED/CONVERTED; season settle; assessment levy"

  - name: PremiumSalesRep
    description: "Premium sales office account executive: sells and manages license agreements, renewals, waitlist, transfers, and single-event rentals; no finance writes"
    identity: opaque
    exclusive_operations:
      - "POST /api/transfer-requests/{id}/complete"
      - "renewal-offer REVISED transition (rep-side counter negotiation)"
      - "waitlist OFFERED promotion and CONVERTED (shared only with StadiumAdmin)"
    shared_operations:
      - "accounts create/PATCH/set_status (PROSPECT->ACTIVE only; cannot suspend/reinstate... note: suspend/reinstate reserved to FinanceController/StadiumAdmin - rep set_status limited to ACTIVE target)"
      - "agreements create/submit/terminate; rentals create/HELD/CONFIRMED/CANCELLED; transfer set_status review steps; renewal offers create; waitlist create/withdraw"
      - "All GET endpoints"

  - name: FinanceController
    description: "Finance office: invoicing, payments, credit standing, suspensions/reinstatements, season settle, assessment levy, agreement cure"
    identity: opaque
    exclusive_operations:
      - "POST /api/invoices, /issue, /void (shared only with StadiumAdmin)"
      - "POST /api/payments/{id}/set_status (shared only with StadiumAdmin)"
      - "POST /api/agreements/{id}/cure (shared only with StadiumAdmin)"
      - "POST /api/seasons/{id}/settle (shared only with StadiumAdmin)"
      - "POST /api/assessments/{id}/levy (shared only with StadiumAdmin)"
      - "account SUSPENDED/ACTIVE reinstate transitions (shared with StadiumAdmin)"
    shared_operations: ["All GET endpoints", "payments create"]

  - name: EventServicesManager
    description: "Event services desk: catering order confirmation/fulfilment/cancellation and credential issue/activation/revocation"
    identity: opaque
    exclusive_operations:
      - "catering CONFIRMED and FULFILLED transitions (shared only with StadiumAdmin)"
      - "credential ACTIVATED transition (shared only with StadiumAdmin)"
    shared_operations:
      - "catering orders create/PATCH/CANCELLED; credentials create/REVOKED"
      - "All GET endpoints"

  - name: AccountHolder
    description: "The license-holding (or renting) customer: self-service on own agreements, catering, guest credentials, rentals, transfers, renewals, waitlist, and payments"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /api/agreements/{id}/execute (must own the agreement's account)"
      - "POST /api/transfer-requests (from_account must be own)"
      - "transfer INFO_REQUESTED -> UNDER_REVIEW (submit_info) and WITHDRAWN; renewal-offer COUNTERED/ACCEPTED/DECLINED (own agreement)"
    shared_operations:
      - "catering orders create/PATCH/CANCELLED on own agreements/rentals; credentials create/REVOKED on own; rentals create/HELD/CANCELLED on own account; waitlist create/WITHDRAWN/DECLINED on own; payments create on own account"
      - "GET endpoints scoped to own-account resources"
