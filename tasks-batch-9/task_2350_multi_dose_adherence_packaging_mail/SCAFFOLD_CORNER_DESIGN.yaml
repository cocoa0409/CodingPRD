# =============================================================================
# 1.9 Scaffold Corner Design — breadth probe for
#     task_2350 Multi-Dose Adherence Packaging & Mail Pharmacy
# -----------------------------------------------------------------------------
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's §1.1–§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub naming the §1.8 instance that owns them.
# Every `${var}` is bound by an earlier `captures:`; every literal is pre-computed.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: insurance_plan_created_with_every_field_returns_201
        claim_type: creation
        grounds:
          - entities.InsurancePlan
          - endpoints.POST_/pharmacy/insurance-plans
          - response_envelope
        distinguishing_aspect: "A fully specified plan is persisted verbatim and returned inside the §1.0 success envelope with version 1."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id / meta.api_request_timestamp present"
            - "data.id is a bare UUID with no type prefix, and data.version == 1"
            - "every submitted field round-trips: payer_name Northwind PBM, bin_number 610502, generic_copay_cents_per_day 34, brand_copay_cents_per_day 74, specialty_copay_cents_per_day 44, refill_too_soon_threshold_pct 75, max_day_supply_days 90, vacation_overrides_per_year 1, coinsurance_pct 20, allows_payer_vacation_override true"
            - "data.created_at == data.updated_at == 2026-08-10T00:00:00.000Z"

      - name: patient_created_starts_unsynced_with_active_autoship
        claim_type: creation
        grounds:
          - entities.Patient
          - endpoints.POST_/pharmacy/patients
          - state_machines.Patient
        distinguishing_aspect: "A new patient begins UNSYNCED on the sync dimension and ACTIVE on the auto-ship dimension, with a full-marks adherence score and an empty credit balance."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one InsurancePlan exists"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
          assert:
            - "HTTP 201; Patient.${pt_id}.sync_status == UNSYNCED and sync_mode == null and next_cycle_start_date == null"
            - "autoship_status == ACTIVE and pause_reason == null"
            - "adherence_score_pct == 100, consecutive_missed_pickups == 0, credit_balance_cents == 0, vacation_exceptions_used_this_year == 0"
            - "anchor_fill_day == null (it is only pinned by synchronize) and version == 1"

      - name: prescription_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.Prescription
          - endpoints.GET_/pharmacy/prescriptions/{id}
        distinguishing_aspect: "The detail read echoes the persisted prescription, including the dispense-history fields the adjudicator later consumes."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan and patient exist; one prescription recorded"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
          trigger:
            - call: "GET /pharmacy/prescriptions/${rx1}"
              payload: {}
              as: PharmacyOperations
          assert:
            - "HTTP 200, response_type == object, data.id == ${rx1}"
            - "patient_id == ${pt_id}, drug_name Metformin ER, form TABLET, copay_tier GENERIC, dose_times [MORNING], quantity_per_dose 1, days_supply_written 30"
            - "refills_authorized 3, refills_remaining 3, refills_consumed 0, days_dispensed_total 0, status ACTIVE"
            - "last_dispensed_date 2026-07-25 and last_dispensed_days_supply 28, while prior_last_dispensed_date is null and prior_last_dispensed_days_supply is 0"

      - name: fill_cycle_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/pharmacy/fill-cycles
          - response_envelope.pagination_fields
          - entities.FillCycle
        distinguishing_aspect: "Three non-overlapping cycles paginate at limit 2 with total_count 3, has_more true on the first page and false on the second, ordered created_at ASC."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient with one prescription"
            - "three back-to-back cycles created in date order: [2026-08-15, 2026-09-12), [2026-09-12, 2026-10-10), [2026-10-10, 2026-11-07) — touching windows are legal at priority 28"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-09-12", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c2: $.data.id }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-10-10", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", limit: 2, offset: 0 }
              as: PharmacyOperations
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", limit: 2, offset: 2 }
              as: PharmacyOperations
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "call 1: response_type == array, 2 rows, meta/pagination reports limit 2, offset 0, total_count 3, has_more true"
            - "call 1 rows are ${c1} then ${c2} in created_at ASC order, so ${first_page_head} == ${c1}"
            - "call 2: 1 row, limit 2, offset 2, total_count 3, has_more false, and ${second_page_head} == ${c3}"
            - "every returned cycle has packaging_status DRAFT and insurance_status NOT_ADJUDICATED"

      - name: fill_cycle_detail_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4
          - errors.ERR_FILL_CYCLE_NOT_FOUND
          - endpoints.GET_/pharmacy/fill-cycles/{id}
        distinguishing_aspect: "A well-formed UUID that addresses no FillCycle row returns the entity-specific 404, not a generic error."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pharmacy/fill-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PharmacyOperations
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and ${err} == ERR_FILL_CYCLE_NOT_FOUND"
            - "the error envelope carries data.error_id and data.message only"

      - name: prescription_missing_required_dose_times_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
          - entities.Prescription.fields.dose_times
        distinguishing_aspect: "dose_times is a required non-empty array with no default; omitting it fails schema validation before any business rule runs."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan and patient exist"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01" }
              as: Prescriber
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "no Prescription row was created: GET /pharmacy/prescriptions?patient_id=${pt_id} returns total_count 0"
            - "an empty dose_times array ([]) fails the same way, since the field is declared non-empty with no duplicates"

      - name: prescription_optional_flag_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Prescription.fields.refrigerated
          - entities.Prescription.fields.is_controlled
          - entities.Prescription.fields.last_dispensed_days_supply
          - endpoints.POST_/pharmacy/prescriptions
        distinguishing_aspect: "Omitting refrigerated, is_controlled and the dispense-history pair yields false / false / 0, which in turn makes the drug packable and its refill history empty."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan and patient exist"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Lisinopril", ndc: "00093-1036-01", strength: "10mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 2, written_date: "2026-05-01", expiration_date: "2027-05-01" }
              as: Prescriber
              captures: { rx_default: $.data.id }
          assert:
            - "Prescription.${rx_default}.refrigerated == false and is_controlled == false"
            - "last_dispensed_date == null and last_dispensed_days_supply == 0"
            - "packable == true, computed from form TABLET and refrigerated false"
            - "refills_remaining == 2 (mirrors refills_authorized), refills_consumed == 0, days_dispensed_total == 0, status ACTIVE, sync_bridge_days == 0, sync_trim_days == 0"

      - name: insurance_plan_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.InsurancePlan.fields.refill_too_soon_threshold_pct
          - entities.InsurancePlan.fields.max_day_supply_days
          - entities.InsurancePlan.fields.vacation_overrides_per_year
          - entities.InsurancePlan.fields.coinsurance_pct
          - entities.InsurancePlan.fields.allows_payer_vacation_override
        distinguishing_aspect: "A plan created with only the five mandatory fields adopts the declared defaults 75 / 90 / 1 / 20 / false — the exact knobs every downstream calculation reads."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Cascade Health", bin_number: "004336", generic_copay_cents_per_day: 30, brand_copay_cents_per_day: 60, specialty_copay_cents_per_day: 90 }
              as: PlatformAdmin
              captures: { plan_default: $.data.id }
          assert:
            - "InsurancePlan.${plan_default}.refill_too_soon_threshold_pct == 75"
            - "max_day_supply_days == 90"
            - "vacation_overrides_per_year == 1"
            - "coinsurance_pct == 20"
            - "allows_payer_vacation_override == false, so a PAYER_OVERRIDE_APPROVED decision on this plan's patients is refused at priority 39"

      - name: prescription_packable_is_computed_from_form_and_refrigerated
        claim_type: computed_fields
        grounds:
          - entities.Prescription.fields.packable
          - endpoints.POST_/pharmacy/prescriptions
          - entities.CycleLine.fields.packable_route
        distinguishing_aspect: "packable is a computed conjunction (form IN {TABLET, CAPSULE} AND refrigerated == false); a refrigerated tablet is NOT packable even though its form qualifies."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan and patient exist"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01" }
              as: Prescriber
              captures: { rx_tab: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Latanoprost", ndc: "00023-3315-05", strength: "0.005%", form: "TABLET", copay_tier: "GENERIC", dose_times: ["BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", refrigerated: true }
              as: Prescriber
              captures: { rx_cold_tab: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Albuterol", ndc: "00173-0682-20", strength: "90mcg", form: "INHALER", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01" }
              as: Prescriber
              captures: { rx_inhaler: $.data.id }
          assert:
            - "Prescription.${rx_tab}.packable == true"
            - "Prescription.${rx_cold_tab}.packable == false — refrigerated overrides the qualifying TABLET form"
            - "Prescription.${rx_inhaler}.packable == false — INHALER is not a pouchable form"
            - "packable is not an input field: nothing in the request body can set it"

      - name: patient_identity_and_audit_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Patient
          - endpoints.POST_/pharmacy/patients
          - endpoints.POST_/pharmacy/patients/{id}/synchronize
        distinguishing_aspect: "id / created_at / updated_at / version are minted and maintained by the server; the first mutation bumps version to 2 and refreshes updated_at while created_at stays pinned."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan exists; patient created; one ACTIVE prescription so synchronize is legal at priority 43"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id, pt_created: $.data.created_at, pt_ver: $.data.version }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
              captures: { pt_ver_after: $.data.version }
          assert:
            - "${pt_ver} == 1 at creation and ${pt_ver_after} == 2 after the first mutation"
            - "Patient.${pt_id}.created_at == 2026-08-10T00:00:00.000Z is unchanged, while updated_at == 2026-08-11T09:30:00.000Z"
            - "data.id is a bare UUID (no `pat_` style prefix) and is not accepted as an input field on POST /pharmacy/patients"
            - "the synchronize response also shows sync_status SYNCED, sync_mode BRIDGE_TO_START, anchor_fill_day 15 and next_cycle_start_date 2026-08-15"

      - name: synchronize_anchor_day_29_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_42
          - errors.ERR_INVALID_ANCHOR_DAY
          - entities.Patient.fields.anchor_fill_day
        distinguishing_aspect: "29 is a syntactically valid day-of-month but exceeds ANCHOR_DAY_MAX (28), so it is refused by the business rule at priority 42 with 422, not by the schema check at priority 3."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan and patient exist; one ACTIVE prescription"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
