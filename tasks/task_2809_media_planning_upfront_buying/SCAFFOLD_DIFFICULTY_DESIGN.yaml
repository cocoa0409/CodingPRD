            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c14_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
