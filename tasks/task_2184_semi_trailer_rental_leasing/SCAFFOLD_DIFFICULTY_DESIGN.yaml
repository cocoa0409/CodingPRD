              payload: { reason: "driver rejected the load" }
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { ro_status: "$.data.status" }
            - call: "GET /fleet/branches/${b_west_id}"
              payload: {}
              as: FleetAdmin
              captures: { west_post: "$.data.on_hand_count" }
            - call: "GET /fleet/branches/${b_nrw_id}"
              payload: {}
              as: FleetAdmin
              captures: { nrw_post: "$.data.on_hand_count" }
          assert:
            - "${west_pre} == 3"
            - "${west_mid} == 2"
            - "${nrw_mid} == 0"
            - "${west_post} == 3"
            - "${nrw_post} == 0"
            - "${west_post} == ${west_pre}"
            - "${ro_status} == CANCELLED"
            - "Trailer.${tr1_id}.availability_status == AVAILABLE"
            - "Trailer.${tr1_id}.current_branch_id == ${b_west_id}"
            - "RelocationOrder.${ro1_id}.actual_cost_cents == null"
            - "RelocationOrder.${ro1_id}.actual_miles == null"
            - "sum(Branch.on_hand_count) + count(Trailer WHERE availability_status == IN_TRANSIT) + count(Trailer WHERE availability_status IN {ON_RENT, ON_LEASE}) == 3 at all three observation points"

      - name: chargeback_waive_conserves_customer_outstanding_balance_and_damage_points
        grounds:
          - calculations.chargeback_balance_conservation
          - state_machines.Chargeback.status.PENDING_to_WAIVED
          - state_machines.DamageAssessment.status.SUBMITTED_to_REJECTED
          - state_machines.Trailer.service_status.OOS_DAMAGE_to_SERVICEABLE
          - entities.Customer.fields.outstanding_chargeback_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = MONETARY BALANCE IN CENTS, a different kind of quantity from the
          fleet headcount above. Submitting the assessment raises
          Customer.outstanding_chargeback_cents from 0 to exactly 113400 and Trailer.damage_points
          from 0 to 25; waiving the resulting chargeback subtracts exactly the same 113400 and
          exactly the same 25 points, returning the balance to 0, the points to 0 and the trailer
          to SERVICEABLE with zero drift.
        test_recipe:
          setup:
            - "Branch WST-01 with one DRY_VAN_53 trailer T-1001, tier-B customer with a 3,000,000 cent certificate."
            - "Agreement AG1 allocated, activated and returned at WST-01 with hub 42000."
            - "A DRAFT assessment worth exactly 25 damage points and 105000 assessed cents sits on the returned unit."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 1
                start_date: "2026-08-20"
                end_date: "2026-09-10"
              as: FleetAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /fleet/agreements/${ag_id}/submit"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/agreements/${ag_id}/verify-insurance"
              payload: {}
              as: FleetAdmin
              captures: { ag_v3: "$.data.version" }
            - call: "POST /fleet/agreements/${ag_id}/allocate"
              payload: { expected_agreement_version: "${ag_v3}" }
              as: FleetAdmin
            - call: "POST /fleet/agreements/${ag_id}/activate"
              payload: { checkout_date: "2026-08-20" }
              as: FleetAdmin
            - call: "GET /fleet/agreement-units"
              payload: { agreement_id: "${ag_id}" }
              as: FleetAdmin
              captures: { u1_id: "$.data[0].id" }
            - call: "POST /fleet/agreement-units/${u1_id}/return"
              payload:
                return_branch_id: "${b_west_id}"
                return_hub_miles: 42000
                return_date: "2026-09-03"
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { u1_v2: "$.data.version" }
            - call: "GET /fleet/customers/${cust_id}"
              payload: {}
              as: FleetAdmin
              captures: { bal_pre: "$.data.outstanding_chargeback_cents" }
            - call: "POST /fleet/agreement-units/${u1_id}/damage-assessments"
              payload:
                line_items: [{ severity: "MODERATE", quantity: 2, unit_cost_cents: 30000, description: "roof panel" }, { severity: "MINOR", quantity: 3, unit_cost_cents: 10000, description: "scuff" }]
                expected_agreement_unit_version: "${u1_v2}"
              as: Inspector
              as_user_id: "insp-1"
              captures: { as1_id: "$.data.id" }
            - call: "POST /fleet/damage-assessments/${as1_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /fleet/customers/${cust_id}"
              payload: {}
              as: FleetAdmin
              captures: { bal_mid: "$.data.outstanding_chargeback_cents" }
            - call: "GET /fleet/trailers/${tr1_id}"
              payload: {}
              as: FleetAdmin
              captures: { pts_mid: "$.data.damage_points", svc_mid: "$.data.service_status" }
            - call: "GET /fleet/chargebacks"
              payload: { customer_id: "${cust_id}", status: "PENDING" }
              as: FleetAdmin
              captures: { cb1_id: "$.data[0].id", cb1_amount: "$.data[0].amount_cents" }
          trigger:
            - call: "POST /fleet/chargebacks/${cb1_id}/waive"
              payload: { waiver_reason: "pre-existing damage documented at checkout" }
              as: ChargebackApprover
              as_user_id: "appr-1"
              captures: { cb_status: "$.data.status" }
            - call: "GET /fleet/customers/${cust_id}"
              payload: {}
              as: FleetAdmin
              captures: { bal_post: "$.data.outstanding_chargeback_cents" }
            - call: "GET /fleet/trailers/${tr1_id}"
              payload: {}
              as: FleetAdmin
              captures: { pts_post: "$.data.damage_points", svc_post: "$.data.service_status" }
          assert:
            - "${bal_pre} == 0"
            - "${cb1_amount} == 113400"
            - "${bal_mid} == 113400"
            - "${pts_mid} == 25"
            - "${svc_mid} == OOS_DAMAGE"
            - "${cb_status} == WAIVED"
            - "${bal_post} == 0"
            - "${bal_post} == ${bal_pre}"
            - "${pts_post} == 0"
            - "${svc_post} == SERVICEABLE"
            - "DamageAssessment.${as1_id}.status == REJECTED"
            - "Chargeback.${cb1_id}.approver_user_id == appr-1"
