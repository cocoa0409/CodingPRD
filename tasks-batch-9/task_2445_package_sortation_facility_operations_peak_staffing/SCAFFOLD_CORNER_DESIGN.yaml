              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute_id}", jam_reason: "BELT_JAM" }
              as: SortSupervisor
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Hurt Harper", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
            - call: "POST /sortation/injury-reports"
              payload: { sort_center_id: "${center_id}", worker_id: "${w_id}", severity: "SERIOUS", body_part: "ANKLE", occurred_at: "2026-08-03T07:10:00Z", chute_id: "${chute_id}" }
              as: SortSupervisor
              captures: { injury_id: $.data.id }
          trigger:
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 10 }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments/${appt_id}/resume-unload"
              payload: { chute_id: "${chute_id}" }
              as: SortSupervisor
            - call: "POST /sortation/injury-reports/${injury_id}/close"
              payload: { lost_time_days: 3 }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_close: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/close"
              payload: { expected_center_version: "${center_v_close}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "SortCenter.${center_id}.ops_posture == FROZEN before the trigger sequence, with open_jam_count == 1 and open_serious_injury_count == 1"
            - "the scan returns HTTP 409 with data.error_id == ERR_CENTER_FROZEN and OutboundLoad.${load_id}.package_count stays 0 with load_status STAGING"
            - "resume-unload returns HTTP 200 with data.status == UNLOADING; open_jam_count drops to 0 but ops_posture stays FROZEN because the SERIOUS injury is still open"
            - "the injury close returns HTTP 200 and ops_posture becomes OPEN"
            - "the plan close returns HTTP 200 with data.status == CLOSED, data.actual_labor_cents == 0 and data.final_cost_per_package_cents == 12000.00"
            - "SortCenter.${center_id}.flex_pool_available == 20 and flex_pool_reserved == 0"

      - name: corner_validation_priority_load_state_over_freeze
        claim_type: Priority conflict
        grounds:
          - validations.16_ERR_INVALID_LOAD_STATE
          - validations.22_ERR_CENTER_FROZEN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / load_state_beats_center_frozen_on_redispatch
          rationale: "That §1.8 instance is exactly the 16-beats-22 pair on a re-dispatch attempt."

      - name: corner_validation_priority_headcount_over_budget
        claim_type: Priority conflict
        grounds:
          - validations.23_ERR_LINE_HEADCOUNT_EXCEEDED
          - validations.38_ERR_LABOR_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / line_headcount_safety_beats_labor_budget_at_approve
          rationale: "The safety-before-money ordering at approve is the named §1.8 instance."

      - name: corner_validation_priority_readiness_over_center_mismatch
        claim_type: Priority conflict
        grounds:
          - validations.25_ERR_WORKER_NOT_CLEARED
          - validations.35_ERR_WORKER_CENTER_MISMATCH
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / worker_readiness_beats_center_mismatch_on_assignment
          rationale: "A worker who is both un-certified and at the wrong center is the named §1.8 instance."

      - name: corner_validation_temporal_future_door_conflict
        claim_type: Temporal validation
        grounds:
          - validations.27_ERR_DOOR_WINDOW_CONFLICT
          - calculations.door_interval_conflict
        excluded_because:
          difficulty_instance: boundary_precision_check / door_turnaround_buffer_gap_exactly_15_minutes
          rationale: "The buffered-window conflict detected against an already booked future appointment is that instance's subject."

  # ===================================================================
  # 5. Endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: destination_lane_patch_updates_forecast_then_closes_lane
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/sortation/destination-lanes/{id}
          - calculations.lane_pressure
          - calculations.ops_posture_derivation
        distinguishing_aspect: "The lane PATCH is partial in both directions: sending only forecast_hourly_volume leaves status alone, sending only status CLOSED leaves the forecast alone, and each write bumps the version and re-derives the posture because a CLOSED lane leaves the max-pressure input set."
        test_recipe:
          setup:
            - "Center SC1 with chute C1 (1200 pph) and lane L-WEST assigned to C1, so assigned_capacity_pph == 1200"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id, lane_v1: $.data.version }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
          trigger:
            - call: "PATCH /sortation/destination-lanes/${lane_id}"
              payload: { forecast_hourly_volume: 4500 }
              as: FacilityAdmin
            - call: "PATCH /sortation/destination-lanes/${lane_id}"
              payload: { status: "CLOSED" }
              as: FacilityAdmin
            - call: "GET /sortation/destination-lanes/${lane_id}"
              payload: {}
              as: SortSupervisor
          assert:
            - "the first PATCH returns HTTP 200 with data.forecast_hourly_volume == 4500 and data.status still ACTIVE"
            - "the second PATCH returns HTTP 200 with data.status == CLOSED and data.forecast_hourly_volume still 4500"
            - "the final GET agrees with the PATCH bodies and reports assigned_capacity_pph == 1200, lane_pressure_ratio == 0.0000 and backlog_package_count == 0"
            - "DestinationLane.${lane_id}.version == ${lane_v1} + 2 (one bump per PATCH)"
            - "SortCenter.${center_id}.ops_posture stays OPEN after both writes"

      - name: chute_assignment_link_requires_both_endpoints_to_exist
        claim_type: Cross-reference link
        grounds:
          - validations.5_ERR_FACILITY_RESOURCE_NOT_FOUND
          - endpoints.POST_/sortation/chute-assignments
          - concurrency_rules.chute-assignment-create-stale-chute
        distinguishing_aspect: "The link endpoint must resolve BOTH sides before it does anything: an unknown destination lane 404s while the chute's OCC version is left unconsumed, so the very same expected_chute_version still works on the retry."
        test_recipe:
          setup:
            - "Center SC1 with chute C1 (1200 pph) and lane L-WEST; no assignment exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "00000000-0000-0000-0000-0000000000bb", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
              captures: { ca_id: $.data.id }
          assert:
            - "the unknown-lane call returns HTTP 404 with data.error_id == ERR_FACILITY_RESOURCE_NOT_FOUND"
            - "SortChute.${chute_id}.version is still ${chute_v} after the refused call"
            - "the retry with the SAME expected_chute_version returns HTTP 201 with data.status == ACTIVE"
            - "the link is observable from both sides: GET /sortation/chute-assignments filtered by chute_id == ${chute_id} and filtered by destination_lane_id == ${lane_id} each return total_count == 1 containing ${ca_id}"
            - "DestinationLane.${lane_id}.assigned_capacity_pph == 1200 and SortChute.${chute_id}.version == ${chute_v} + 1"

      - name: sort_center_computed_read_matches_package_ledger
        claim_type: Computed read
        grounds:
          - endpoints.GET_/sortation/sort-centers/{id}
          - calculations.package_conservation_invariant
          - entities.SortCenter.fields.wip_package_count
        distinguishing_aspect: "The center read is pure derived state: after an induction, a scan and a lane-sourced exception, its four package counters plus the lane total satisfy the conservation identity exactly, with no rounding slack."
        test_recipe:
          setup:
            - "Center SC1 with chute C1, lane L-WEST assigned to C1, doors IN-1 and OUT-1"
            - "500 packages inducted, 100 SMALL scanned onto a load bound for L-WEST, and a 50-package DAMAGED exception debited from L-WEST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", priority_class: "STANDARD", manifest_package_count: 500 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 100 }
              as: SortSupervisor
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "DAMAGED", package_count: 50, from_destination_lane_id: "${lane_id}" }
              as: SortSupervisor
          trigger:
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/destination-lanes/${lane_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "the center read returns packages_inducted_count == 500, wip_package_count == 400, exception_hold_count == 50, disposed_package_count == 0, missort_corrected_count == 0"
            - "the lane read returns sorted_package_count == 50 (100 scanned minus the 50-package exception debit)"
            - "the conservation identity holds: 500 == 400 + 50 + 0 + 50"
            - "the center read reports ops_posture == OPEN, open_jam_count == 0 and open_serious_injury_count == 0"

      - name: corner_endpoint_action_seal_and_dispatch
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/sortation/outbound-loads/{id}/seal
        excluded_because:
          difficulty_instance: non_linear_state_machine / outbound_load_parallel_load_and_seal_dimensions
          rationale: "Seal, break, re-seal and dispatch as action endpoints with their preconditions are driven end-to-end there."

      - name: corner_endpoint_conditional_action_dispatch_before_cut
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/sortation/outbound-loads/{id}/dispatch
          - validations.33_ERR_DISPATCH_CUT_PASSED
        excluded_because:
          difficulty_instance: boundary_precision_check / dispatch_cut_time_instant_is_strictly_before
          rationale: "The condition (clock strictly before dispatch_cut_time) is pinned at the instant by that instance."

  # ===================================================================
  # 6. Errors
  # ===================================================================
  - section: errors
    instances:
      - name: auth_errors_unauthenticated_forbidden_and_not_owner
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_NOT_ASSIGNMENT_OWNER
        distinguishing_aspect: "Three distinct authorization failures are separated: no/unknown role header is 401, a declared-but-unlisted role is 403 ERR_FORBIDDEN_ROLE, and a Worker acting on someone else's assignment is 403 ERR_NOT_ASSIGNMENT_OWNER."
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with chute C1 and an APPROVED plan for 2026-08-03 (forecast_volume 4000, core 4, budget 100000)"
            - "Two CERTIFIED CORE workers W-1 and W-2; only W-1 has a StaffAssignment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Worker One", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w1_id: $.data.id }
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Worker Two", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w2_id: $.data.id }
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${w1_id}", line_chute_id: "${chute_id}", role_on_line: "PRIMARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: "(no X-User-Role header sent)"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: "YardMarshal (a role that is not one of the six declared roles)"
            - call: "POST /sortation/staff-assignments/${sa_id}/check-in"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments/${sa_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${w2_id}"
          assert:
            - "the header-less call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the undeclared-role call returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the LaborPlanner check-in returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE (check-in is exclusive to Worker)"
            - "the W-2 check-in on W-1's assignment returns HTTP 403 with data.error_id == ERR_NOT_ASSIGNMENT_OWNER"
            - "StaffAssignment.${sa_id}.status stays ASSIGNED with checked_in_at == null after all four calls"

      - name: existence_errors_across_entity_families_not_found
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_SORT_CENTER_NOT_FOUND
          - errors.ERR_FACILITY_RESOURCE_NOT_FOUND
          - errors.ERR_TRAILER_APPOINTMENT_NOT_FOUND
          - errors.ERR_LABOR_RESOURCE_NOT_FOUND
          - errors.ERR_OUTBOUND_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The catalog splits 404s by entity family rather than using one generic code, so each family must be reachable with its own error_id from an unknown UUID."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; every id below is a well-formed UUID that was never issued"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "GET /sortation/sort-centers/00000000-0000-0000-0000-0000000000c1"
              payload: {}
              as: FacilityAdmin
            - call: "GET /sortation/sort-chutes/00000000-0000-0000-0000-0000000000c2"
              payload: {}
              as: FacilityAdmin
            - call: "POST /sortation/trailer-appointments/00000000-0000-0000-0000-0000000000c3/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "GET /sortation/workers/00000000-0000-0000-0000-0000000000c4"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/outbound-loads/00000000-0000-0000-0000-0000000000c5"
              payload: {}
              as: SortSupervisor
          assert:
            - "the center read returns HTTP 404 with data.error_id == ERR_SORT_CENTER_NOT_FOUND"
            - "the chute read returns HTTP 404 with data.error_id == ERR_FACILITY_RESOURCE_NOT_FOUND"
            - "the arrive call returns HTTP 404 with data.error_id == ERR_TRAILER_APPOINTMENT_NOT_FOUND"
            - "the worker read returns HTTP 404 with data.error_id == ERR_LABOR_RESOURCE_NOT_FOUND"
            - "the load read returns HTTP 404 with data.error_id == ERR_OUTBOUND_RESOURCE_NOT_FOUND"
            - "every one of the five responses carries response_type == error with meta.api_request_id present"

      - name: check_out_before_check_in_refused
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_INVALID_ASSIGNMENT_STATE
          - state_machines.StaffAssignment.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "ERR_INVALID_ASSIGNMENT_STATE is reachable only through the assignment's own dimension: an ASSIGNED row cannot be checked out, and worked_hours must stay 0 so the plan's actual labor cost is unaffected."
