            - { call: "POST /claim-documents/${doc_e1}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims", payload: { policy_id: "${pe2}", event_code: "E2", service_date: "2027-03-15T00:00:00Z", diagnosis_code: "E11.9", claimed_occurrences: 1 }, as: ClaimsAdjuster, captures: { cl_late: $.data.id } }
            - { call: "POST /claims/${cl_late}/review", payload: {}, as: ClaimsAdjuster }
