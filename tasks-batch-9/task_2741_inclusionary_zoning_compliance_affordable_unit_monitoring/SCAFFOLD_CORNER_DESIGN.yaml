            - { call: "POST /iz-compliance/projects", payload: { name: "Bedroom Bar", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { px_id: $.data.id } }
