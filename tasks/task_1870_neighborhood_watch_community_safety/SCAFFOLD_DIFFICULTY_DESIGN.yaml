              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B900", full_name: "Officer P", precinct_code: "PCT9" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}"] }
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v2: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-10T12:00:00Z", expected_watch_group_version: "${wg_v2}" }
              as: ProgramCoordinator
              captures: { al: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T23:30:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/alerts/${al}/send"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state p4 beats business_temporal p7; the DRAFT alert has no QUEUED->SENT path)"
            - "Alert remains in distribution_status == DRAFT"

      - name: business_referential_vs_business_constraint_on_member_create
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_REFERENTIAL_INTEGRITY]
          - errors[ERR_CONSTRAINT_VIOLATION]
        distinguishing_aspect: |
          Category pair business_referential (p11) vs business_constraint (p12):
          a member create whose block_id belongs to a DIFFERENT watch group
          violates p11 while (had it been in-group) its street_segment-uniqueness
          is irrelevant here — instead the dual failure is constructed on captain
          assignment: member from a foreign block AND already holding an ACTIVE
          captainship; p11's ERR_REFERENTIAL_INTEGRITY (422) must win over p12's
