        distinguishing_aspect: "After a second forecast for the same (client, tax_year) publishes, the first is SUPERSEDED and stays readable but inert: it keeps needs_regeneration=false and no transition brings it back."
        test_recipe:
          setup: ["Client C exists (no renditions needed; forecasts over an empty input set are legal: component_count 0, liability 0)"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "TermCo", contact_email: "term@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Manager", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_mgr: $.data.id }
          trigger:
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
              payload: { tax_year: 2027, variant: "NOTICE_BASED", as_of_date: "2027-03-01", expected_client_version: "${cl_v}" }
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { f_1: $.data.id }
            - call: "GET /bpp/clients/${cl_id}"
              payload: {}
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { cl_v2: $.data.version }
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
