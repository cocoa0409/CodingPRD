            - call: "POST /courier-networks"
              payload: { code: "N_ECON", name: "EconCourier", network_type: "COURIER", priority_rank: 3, per_delivery_fee_cents: 450, handoff_sla_seconds: 900, dispatch_buffer_seconds: 180, max_concurrent_assignments: 2, is_active: true }
              as: PlatformAdmin
              captures: { net_econ_id: "$.data.id" }
            - call: "POST /orders/${oa_id}/dispatch"
