  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_cents_conservation_through_pay
        grounds:
          - state_machines.RebateApplication.APPROVED_to_PAID
          - entities.ProgramYear.fields.committed_cents
          - entities.ProgramYear.fields.paid_cents
        distinguishing_aspect: |
          Conserved quantity: budget cents. Invariant: for any application
          that reaches SUBMITTED and then PAID, the sum
          committed_cents + paid_cents on the ProgramYear is unchanged by the
          pay transition — the pay action merely moves incentive_total_cents
          from one bucket to the other. Forward action submit (+N committed)
          paired with its compensating action pay (-N committed, +N paid)
          leaves the sum invariant.
        test_recipe:
          setup:
            - "OPEN ProgramYear; application submitted (incentive 10000), verified, approved"
            - "Before pay: committed_cents == 10000, paid_cents == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
