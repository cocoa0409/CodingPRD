              as: MillPlanner
          assert:
            - "the CO-EXACT attempt returns HTTP 201 and CutOrder.${co_ok}.reserved_credit_cents == 513000"
            - "Account.${acct_ok}.credit_used_cents == 513000 and Account.${acct_ok}.status == CREDIT_HOLD"
            - "the CO-SHORT attempt returns HTTP 422 with data.error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "no CutOrder with order_code CO-SHORT exists"
            - "Account.${acct_no}.credit_used_cents == 0 and Account.${acct_no}.status == ACTIVE"

  # =========================================================================
  # RULE 7 — cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_gated_on_certification_status_and_logical_clock
        grounds:
          - validations[priority=11]
          - errors[ERR_FLAMMABILITY_CERT_REQUIRED]
          - state_machines.Certification.ACTIVE_to_LAPSED
          - state_machines.CarpetStyle.ACTIVE_to_SUSPENDED
          - state_machines.CarpetStyle.SUSPENDED_to_ACTIVE
          - state_machines.CutOrder.SUBMITTED_to_ALLOCATED
          - entities.Certification.fields.expires_at_utc
        distinguishing_aspect: |
          Whether POST /mill/cut-orders/{id}/allocate succeeds depends on a THIRD entity — the
          style's Certification — crossed with the logical clock: identical orders on identical
          inventory allocate before 2026-09-01T00:00:00Z and are refused with
          ERR_FLAMMABILITY_CERT_REQUIRED after the certificate lapses, then allocate again once a
          fresh certificate is issued.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard with a DOC_FF_1_70 certificate expiring 2026-09-01T00:00:00Z."
            - "RollGood RG-01 (200.0 yards) qa_status PASSED, inventory_status AVAILABLE."
            - "Account AC-01 (limit 100000000) with CutOrder CO-01 and CO-02, both for 50.0 yards, both SUBMITTED."
            - "Logical clock at 2026-08-05T08:00:00Z."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { cert1: $.data.id }
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 50.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co1: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 50.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co2: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders/${co1}/allocate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
