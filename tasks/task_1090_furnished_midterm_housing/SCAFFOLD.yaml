# =============================================================================
# SCAFFOLD.yaml — Furnished & Mid-Term Housing platform (Furnished Finder /
# travel-nurse style). §1.0–§1.7. Difficulty: Expert.
# =============================================================================

scenario: |
  Furnished & Mid-Term Housing (Furnished Finder/travel-nurse): unit &
  furnished/lease-term (30–90 day), tenant (travel-nurse/relocation) &
  verification, utilities/cleaning-included, deposit & damage, extension &
  turnover, insurance/COI, 30-day tax & compliance, payout

domain_name: furnished-midterm-housing
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FK, no nested URL paths
  state_machine_shape: cyclic      # DamageClaim FILED<->DISPUTED + Verification resubmit; Booking branching
  relationship_patterns:
    - one_to_many
    - flat_with_references
    - cross_aggregate
  role_model: segregation_of_duties  # peer Host/Tenant ownership + maker-checker payout SoD
  consistency_model: immediate

# =============================================================================
# Response Envelope (§1.0 — FIXED, emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Host / property manager display name" }
      - { name: email, type: string, source: input, description: "Host contact email" }
      - { name: payout_account_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | VERIFIED — payout eligibility, flipped by verify-payout", constraints: "UNVERIFIED, VERIFIED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value in this version; set at registration)", constraints: "ACTIVE" }
      - { name: projected_payout_cents, type: integer, source: computed, default: 0, description: "Sum of net_cents over this host's Payout rows in {PENDING, SCHEDULED}" }
      - { name: payout_balance_cents, type: integer, source: computed, default: 0, description: "Sum of net_cents over this host's Payout rows in PAID (REVERSED excluded)" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Tenant full name" }
      - { name: email, type: string, source: input, description: "Tenant contact email" }
      - { name: tenant_type, type: enum, source: input, description: "TRAVEL_NURSE | RELOCATION | OTHER", constraints: "TRAVEL_NURSE, RELOCATION, OTHER" }
      - { name: verification_status, type: enum, source: computed, default: UNVERIFIED, description: "UNVERIFIED | PENDING | VERIFIED | REJECTED — derived from this tenant's Verification rows", constraints: "UNVERIFIED, PENDING, VERIFIED, REJECTED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value in this version; set at registration)", constraints: "ACTIVE" }

  - name: Verification
    parent: Tenant
    common_fields: true
    fields:
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; the tenant this document verifies" }
      - { name: doc_type, type: enum, source: input, description: "GOVERNMENT_ID | EMPLOYMENT_LETTER | ASSIGNMENT_CONTRACT", constraints: "GOVERNMENT_ID, EMPLOYMENT_LETTER, ASSIGNMENT_CONTRACT" }
      - { name: document_ref, type: string, source: input, description: "Opaque reference to the uploaded document" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> APPROVED / REJECTED; REJECTED -> PENDING on resubmit", constraints: "PENDING, APPROVED, REJECTED" }
      - { name: reviewer_note, type: string, source: input, default: null, description: "Optional note supplied by ComplianceReviewer on approve/reject" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; owner of this unit" }
      - { name: title, type: string, source: input, description: "Listing title" }
      - { name: address, type: string, source: input, description: "Unit address" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Monthly rent in cents", constraints: "> 0" }
      - { name: cleaning_fee_cents, type: integer, source: input, default: 0, description: "One-time cleaning fee in cents (charged only when cleaning_included=false)" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Security deposit amount in cents" }
      - { name: utilities_included, type: boolean, source: input, default: false, description: "Whether utilities are bundled; drives platform-fee utilities surcharge" }
      - { name: cleaning_included, type: boolean, source: input, default: false, description: "Whether cleaning is bundled; when true no cleaning_fee_cents is charged" }
      - { name: requires_coi, type: boolean, source: input, default: false, description: "Whether a valid Certificate of Insurance is required to confirm a booking" }
      - { name: min_term_days, type: integer, source: input, default: 30, description: "Minimum lease term in days" }
      - { name: max_term_days, type: integer, source: input, default: 90, description: "Maximum lease term in days" }
      - { name: turnover_buffer_days, type: integer, source: input, default: 2, description: "Cleaning/turnover buffer appended to each booking's occupied window on this unit" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> LISTED <-> SUSPENDED -> DELISTED", constraints: "DRAFT, LISTED, SUSPENDED, DELISTED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; booked unit" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; booking tenant" }
      - { name: start_date, type: string, source: input, description: "Move-in date, YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Move-out date, YYYY-MM-DD (exclusive; occupancy is half-open [start_date, end_date))" }
      - { name: term_days, type: integer, source: computed, description: "end_date - start_date in whole days" }
      - { name: rent_cents, type: integer, source: computed, description: "Prorated rent; PROVISIONAL (30-day convention) at creation, FINAL (calendar per-month) at completion — see calculations.booking_rent" }
      - { name: cleaning_charge_cents, type: integer, source: computed, default: 0, description: "0 if unit.cleaning_included else unit.cleaning_fee_cents" }
      - { name: gross_rent_cents, type: integer, source: computed, description: "rent_cents + cleaning_charge_cents" }
      - { name: rent_basis, type: enum, source: computed, default: PROVISIONAL, description: "PROVISIONAL | FINAL — which booking_rent variant currently stored", constraints: "PROVISIONAL, FINAL" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> {CONFIRMED, DECLINED, CANCELLED}; CONFIRMED -> {ACTIVE, CANCELLED}; ACTIVE -> COMPLETED", constraints: "REQUESTED, CONFIRMED, ACTIVE, COMPLETED, CANCELLED, DECLINED" }

  - name: Extension
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking to extend" }
      - { name: expected_booking_version, type: integer, source: input, description: "OCC guard: the Booking.version the client last observed" }
      - { name: new_end_date, type: string, source: input, description: "Proposed new move-out date, YYYY-MM-DD (exclusive), must be later than current end_date" }
      - { name: added_days, type: integer, source: computed, description: "new_end_date - booking.end_date in whole days" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> {APPROVED, DECLINED, WITHDRAWN}", constraints: "REQUESTED, APPROVED, DECLINED, WITHDRAWN" }

  - name: Deposit
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; one deposit per confirmed booking" }
      - { name: amount_cents, type: integer, source: system, description: "Deposit total, snapshot of unit.deposit_cents at confirmation (conserved: amount = held + refunded + forfeited)" }
      - { name: held_cents, type: integer, source: computed, description: "Portion still held in escrow" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Portion returned to tenant at settlement" }
      - { name: forfeited_cents, type: integer, source: computed, default: 0, description: "Portion forfeited to host via approved damage claims" }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD -> {REFUNDED, PARTIALLY_REFUNDED, FORFEITED}", constraints: "HELD, REFUNDED, PARTIALLY_REFUNDED, FORFEITED" }

  - name: DamageClaim
    parent: Deposit
    common_fields: true
    fields:
      - { name: deposit_id, type: string, source: input, description: "FK -> Deposit.id; deposit charged by this claim" }
      - { name: expected_deposit_version, type: integer, source: input, description: "OCC guard: the Deposit.version the client last observed" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount host claims for damages, in cents" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Amount adjudicated payable to host on approval (<= claimed_cents and <= deposit.held_cents)" }
      - { name: description, type: string, source: input, description: "Damage description" }
      - { name: tenant_response, type: string, source: input, default: null, description: "Tenant rebuttal supplied when disputing" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED <-> DISPUTED; FILED/DISPUTED -> {APPROVED, REJECTED}; FILED -> WITHDRAWN", constraints: "FILED, DISPUTED, APPROVED, REJECTED, WITHDRAWN" }

  - name: CoiPolicy
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking this certificate covers" }
      - { name: coverage_cents, type: integer, source: input, description: "Liability coverage amount in cents" }
      - { name: effective_start, type: string, source: input, description: "Coverage start date, YYYY-MM-DD (inclusive)" }
      - { name: effective_end, type: string, source: input, description: "Coverage end date, YYYY-MM-DD (inclusive)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACTIVE -> {EXPIRED, REVOKED}", constraints: "PENDING, ACTIVE, EXPIRED, REVOKED" }

  - name: Turnover
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit being turned over" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; the completed booking that triggered this turnover" }
      - { name: scheduled_start, type: string, source: system, description: "Turnover start date = booking.end_date, YYYY-MM-DD" }
      - { name: scheduled_end, type: string, source: system, description: "Turnover end date = booking.end_date + unit.turnover_buffer_days, YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> {IN_PROGRESS -> COMPLETED, SKIPPED}", constraints: "SCHEDULED, IN_PROGRESS, COMPLETED, SKIPPED" }

  - name: Payout
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; booking this payout settles" }
      - { name: host_id, type: string, source: system, description: "FK -> Host.id; payee host" }
      - { name: gross_rent_cents, type: integer, source: computed, description: "Snapshot of booking.gross_rent_cents (PROVISIONAL at creation, FINAL at schedule)" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform fee — see calculations.platform_fee" }
      - { name: deposit_adjustment_cents, type: integer, source: computed, default: 0, description: "Deposit forfeiture credited to host = related Deposit.forfeited_cents" }
      - { name: net_cents, type: integer, source: computed, description: "= gross_rent_cents - platform_fee_cents + deposit_adjustment_cents (both bases); PROVISIONAL vs FINAL differ only in which booking rent feeds gross/fee" }
      - { name: payout_basis, type: enum, source: computed, default: PROVISIONAL, description: "PROVISIONAL | FINAL — see calculations.payout_net", constraints: "PROVISIONAL, FINAL" }
      - { name: scheduled_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the PlatformAdmin who scheduled; SoD checkpoint for pay" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> {SCHEDULED -> PAID -> REVERSED, VOIDED}", constraints: "PENDING, SCHEDULED, PAID, REVERSED, VOIDED" }

  - name: TaxAssessment
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; assessed booking" }
      - { name: assessed_term_days, type: integer, source: computed, description: "Snapshot of booking.term_days at assessment time" }
      - { name: taxable, type: boolean, source: computed, description: "false when assessed_term_days >= TAX_EXEMPT_MIN_DAYS (30-day mid-term exemption)" }
      - { name: occupancy_tax_cents, type: integer, source: computed, description: "0 when exempt; else round_half_up(gross_rent_cents * OCCUPANCY_TAX_RATE)" }
      - { name: exempt_reason, type: enum, source: computed, description: "MID_TERM_30_DAY when exempt; NONE when taxable", constraints: "MID_TERM_30_DAY, NONE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Verification
    initial_state: PENDING
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /verifications/{id}/transitions {to_status: APPROVED}"
        actor: ComplianceReviewer
        preconditions: ["Verification is PENDING"]
        side_effects:
          - "Recompute Tenant.verification_status: becomes VERIFIED (>=1 APPROVED Verification exists)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /verifications/{id}/transitions {to_status: REJECTED}"
        actor: ComplianceReviewer
        preconditions: ["Verification is PENDING"]
        side_effects:
          - "Recompute Tenant.verification_status (REJECTED if no APPROVED and no PENDING remain)"
      - from: REJECTED
        to: PENDING
        trigger: "POST /verifications/{id}/transitions {to_status: PENDING}"
        actor: Tenant
        preconditions: ["Verification is REJECTED", "acting Tenant owns the parent tenant_id"]
        side_effects:
          - "Recompute Tenant.verification_status (PENDING)"
        note: "Resubmit loop — cyclic REJECTED->PENDING"

  - entity: Unit
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /units/{id}/transitions {to_status: LISTED}"
        actor: Host
        preconditions: ["monthly_rate_cents > 0", "min_term_days <= max_term_days"]
        side_effects: ["increments Unit.version by 1"]
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /units/{id}/transitions {to_status: SUSPENDED}"
        actor: Host
        preconditions: []
        side_effects: ["increments Unit.version by 1"]
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /units/{id}/transitions {to_status: LISTED}"
        actor: Host
        preconditions: []
        side_effects: ["increments Unit.version by 1"]
      - from: DRAFT
        to: DELISTED
        trigger: "POST /units/{id}/transitions {to_status: DELISTED}"
        actor: Host
        preconditions: ["No Booking on this unit in {REQUESTED, CONFIRMED, ACTIVE} (ERR_UNIT_HAS_ACTIVE_BOOKINGS)"]
        side_effects: ["increments Unit.version by 1"]
      - from: LISTED
        to: DELISTED
        trigger: "POST /units/{id}/transitions {to_status: DELISTED}"
        actor: Host
        preconditions: ["No Booking on this unit in {REQUESTED, CONFIRMED, ACTIVE} (ERR_UNIT_HAS_ACTIVE_BOOKINGS)"]
        side_effects: ["increments Unit.version by 1"]
      - from: SUSPENDED
        to: DELISTED
        trigger: "POST /units/{id}/transitions {to_status: DELISTED}"
        actor: Host
        preconditions: ["No Booking on this unit in {REQUESTED, CONFIRMED, ACTIVE} (ERR_UNIT_HAS_ACTIVE_BOOKINGS)"]
        side_effects: ["increments Unit.version by 1"]

  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, DECLINED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/transitions {to_status: CONFIRMED}"
        actor: Host
        preconditions:
          - "Booking is REQUESTED (ERR_INVALID_STATE)"
          - "Tenant.verification_status == VERIFIED (ERR_TENANT_NOT_VERIFIED) [cross-entity Booking->Tenant]"
          - "Unit.status == LISTED (ERR_UNIT_NOT_LISTED)"
          - "If Unit.requires_coi: a CoiPolicy for this booking is ACTIVE with coverage_cents >= COI_MIN_COVERAGE_CENTS and [effective_start, effective_end] covers [start_date, end_date) (ERR_COI_REQUIRED) [cross-entity Booking->CoiPolicy]"
          - "Host.payout_account_status == VERIFIED (ERR_HOST_PAYOUT_NOT_VERIFIED)"
        side_effects:
          - "Create Deposit {amount_cents = Unit.deposit_cents, held_cents = amount_cents, refunded_cents = 0, forfeited_cents = 0, status = HELD}"
          - "Create Payout {basis = PROVISIONAL, gross_rent_cents = Booking.gross_rent_cents, platform_fee_cents = platform_fee(provisional), deposit_adjustment_cents = 0, net_cents = gross_rent_cents - platform_fee_cents, status = PENDING}"
          - "Recompute Host.projected_payout_cents (add new Payout.net_cents)"
          - "Create TaxAssessment {assessed_term_days = term_days, taxable / occupancy_tax_cents / exempt_reason per calculations.occupancy_tax}"
        note: "Branch REQUESTED -> {CONFIRMED (this, rich side effects), DECLINED, CANCELLED (no side effects)}"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /bookings/{id}/transitions {to_status: DECLINED}"
        actor: Host
        preconditions: ["Booking is REQUESTED"]
        side_effects: ["Unit slot released (booking no longer occupies unit calendar)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /bookings/{id}/transitions {to_status: CANCELLED}"
        actor: Tenant
        preconditions: ["Booking is REQUESTED", "acting Tenant owns Booking.tenant_id"]
        side_effects: ["Unit slot released"]
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /bookings/{id}/transitions {to_status: ACTIVE}"
        actor: PlatformAdmin
        preconditions:
          - "Booking is CONFIRMED"
          - "current_utc >= start_date"
          - "If Unit.requires_coi: covering CoiPolicy still ACTIVE (ERR_COI_REQUIRED)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/transitions {to_status: CANCELLED}"
        actor: Tenant
        preconditions: ["Booking is CONFIRMED", "current_utc < start_date", "acting Tenant owns Booking.tenant_id"]
        side_effects:
          - "Deposit -> REFUNDED {refunded_cents = held_cents, held_cents = 0}"
          - "Payout -> VOIDED"
          - "Recompute Host.projected_payout_cents (remove voided Payout.net_cents)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /bookings/{id}/transitions {to_status: COMPLETED}"
        actor: PlatformAdmin
        preconditions: ["Booking is ACTIVE", "current_utc >= end_date"]
        side_effects:
          - "Recompute Booking rent to FINAL variant: rent_cents, gross_rent_cents, rent_basis = FINAL (calculations.booking_rent FINAL)"
          - "Cascade: Payout.gross_rent_cents := Booking.gross_rent_cents (FINAL); Payout.platform_fee_cents := platform_fee(FINAL); Payout.net_cents recomputed; Payout.payout_basis := FINAL; Host.projected_payout_cents recomputed"
          - "Create Turnover {unit_id, booking_id, scheduled_start = end_date, scheduled_end = end_date + turnover_buffer_days, status = SCHEDULED}"

  - entity: Extension
    initial_state: REQUESTED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /extensions/{id}/transitions {to_status: APPROVED}"
        actor: Host
        preconditions:
          - "Extension is REQUESTED"
          - "Booking.status in {CONFIRMED, ACTIVE} (ERR_INVALID_STATE) [cross-entity Extension->Booking]"
          - "new_end_date > Booking.end_date (ERR_EXTENSION_NOT_LATER)"
          - "New term (start_date .. new_end_date) <= Unit.max_term_days (ERR_TERM_EXCEEDS_MAX)"
          - "Extended window [start_date, new_end_date) + turnover buffer does not overlap another Booking on the unit in {REQUESTED, CONFIRMED, ACTIVE} (ERR_UNIT_UNAVAILABLE)"
        side_effects:
          - "CASCADE (origin Extension.APPROVED): Booking.end_date := new_end_date; Booking.term_days recomputed; Booking.rent_cents / gross_rent_cents recomputed (PROVISIONAL); Booking.version += 1"
          - "Cascade hop 2: related Payout.gross_rent_cents := Booking.gross_rent_cents; Payout.net_cents recomputed; Host.projected_payout_cents recomputed"
          - "Reassess TaxAssessment {assessed_term_days = new term_days, taxable / occupancy_tax_cents / exempt_reason}"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /extensions/{id}/transitions {to_status: DECLINED}"
        actor: Host
        preconditions: ["Extension is REQUESTED"]
        side_effects: []
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /extensions/{id}/transitions {to_status: WITHDRAWN}"
        actor: Tenant
        preconditions: ["Extension is REQUESTED", "acting Tenant owns the parent Booking.tenant_id"]
        side_effects: []

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: DISPUTED
        trigger: "POST /damage-claims/{id}/transitions {to_status: DISPUTED}"
        actor: Tenant
        preconditions: ["DamageClaim is FILED", "acting Tenant owns the deposit's Booking.tenant_id"]
        side_effects: ["tenant_response recorded"]
      - from: DISPUTED
        to: FILED
        trigger: "POST /damage-claims/{id}/transitions {to_status: FILED}"
        actor: Host
        preconditions: ["DamageClaim is DISPUTED"]
        side_effects: ["claimed_cents revised to the value supplied in payload"]
        note: "Cyclic FILED <-> DISPUTED negotiation loop"
      - from: FILED
        to: APPROVED
        trigger: "POST /damage-claims/{id}/transitions {to_status: APPROVED}"
        actor: ComplianceReviewer
        preconditions:
          - "DamageClaim is FILED"
          - "Deposit.status == HELD (ERR_CLAIM_WINDOW_CLOSED)"
          - "approved_cents <= claimed_cents (ERR_APPROVED_EXCEEDS_CLAIMED)"
          - "approved_cents <= Deposit.held_cents (ERR_APPROVED_EXCEEDS_HELD)"
        side_effects:
          - "CASCADE (origin DamageClaim.APPROVED): Deposit.forfeited_cents += approved_cents; Deposit.held_cents -= approved_cents; Deposit.status -> FORFEITED if held_cents == 0 else stays HELD"
          - "Cascade hop 2: related Payout.deposit_adjustment_cents := Deposit.forfeited_cents; Payout.net_cents recomputed"
          - "Cascade hop 3: Host.projected_payout_cents recomputed from updated Payout.net_cents"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /damage-claims/{id}/transitions {to_status: APPROVED}"
        actor: ComplianceReviewer
        preconditions:
          - "DamageClaim is DISPUTED"
          - "Deposit.status == HELD (ERR_CLAIM_WINDOW_CLOSED)"
          - "approved_cents <= claimed_cents (ERR_APPROVED_EXCEEDS_CLAIMED)"
          - "approved_cents <= Deposit.held_cents (ERR_APPROVED_EXCEEDS_HELD)"
        side_effects:
          - "Same depth-3 cascade as FILED->APPROVED (Deposit -> Payout -> Host)"
      - from: FILED
        to: REJECTED
        trigger: "POST /damage-claims/{id}/transitions {to_status: REJECTED}"
        actor: ComplianceReviewer
        preconditions: ["DamageClaim is FILED"]
        side_effects: []
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /damage-claims/{id}/transitions {to_status: REJECTED}"
        actor: ComplianceReviewer
        preconditions: ["DamageClaim is DISPUTED"]
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /damage-claims/{id}/transitions {to_status: WITHDRAWN}"
        actor: Host
        preconditions: ["DamageClaim is FILED"]
        side_effects: []

  - entity: CoiPolicy
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /coi-policies/{id}/transitions {to_status: ACTIVE}"
        actor: ComplianceReviewer
        preconditions:
          - "CoiPolicy is PENDING"
          - "coverage_cents >= COI_MIN_COVERAGE_CENTS (ERR_COI_INSUFFICIENT_COVERAGE)  # COI_MIN_COVERAGE_CENTS = 5000000 (platform-wide minimum liability coverage, $50,000)"
          - "effective_start <= effective_end (ERR_DATE_RANGE_INVALID)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /coi-policies/{id}/transitions {to_status: REVOKED}"
        actor: ComplianceReviewer
        preconditions: ["CoiPolicy is ACTIVE"]
        side_effects: ["If the covered Booking is CONFIRMED and Unit.requires_coi and no other ACTIVE CoiPolicy covers it, the booking can no longer transition to ACTIVE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /coi-policies/{id}/transitions {to_status: EXPIRED}"
        actor: PlatformAdmin
        preconditions: ["CoiPolicy is ACTIVE", "current_utc >= effective_end"]
        side_effects: []

  - entity: Turnover
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /turnovers/{id}/transitions {to_status: IN_PROGRESS}"
        actor: Host
        preconditions: ["Turnover is SCHEDULED", "Booking.status == COMPLETED (ERR_INVALID_STATE) [cross-entity Turnover->Booking]"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /turnovers/{id}/transitions {to_status: COMPLETED}"
        actor: Host
        preconditions: ["Turnover is IN_PROGRESS"]
        side_effects: ["Unit calendar freed after scheduled_end"]
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /turnovers/{id}/transitions {to_status: SKIPPED}"
        actor: Host
        preconditions: ["Turnover is SCHEDULED"]
        side_effects: []

  - entity: Payout
    initial_state: PENDING
    terminal_states: [PAID, REVERSED, VOIDED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /payouts/{id}/transitions {to_status: SCHEDULED}"
        actor: PlatformAdmin
        preconditions:
          - "Payout is PENDING"
          - "Booking.status == COMPLETED (ERR_BOOKING_NOT_COMPLETED) [cross-entity Payout->Booking] — payout is already FINAL once its booking completed"
          - "Host.payout_account_status == VERIFIED (ERR_HOST_PAYOUT_NOT_VERIFIED)"
        side_effects:
          - "scheduled_by_user_id := acting X-User-ID"
        note: "gross/fee/net already finalized (payout_basis FINAL) by the booking COMPLETED cascade; scheduling only records the maker and moves PENDING->SCHEDULED"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /payouts/{id}/transitions {to_status: PAID}"
        actor: PlatformAdmin
        preconditions:
          - "Payout is SCHEDULED"
          - "acting X-User-ID != Payout.scheduled_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Host.payout_balance_cents += net_cents"
          - "Host.projected_payout_cents -= net_cents"
      - from: PAID
        to: REVERSED
        trigger: "POST /payouts/{id}/transitions {to_status: REVERSED}"
        actor: PlatformAdmin
        preconditions: ["Payout is PAID"]
        side_effects:
          - "Host.payout_balance_cents -= net_cents (compensation — restores the invariant sum-of-PAID-net)"
      - from: PENDING
        to: VOIDED
        trigger: "POST /payouts/{id}/transitions {to_status: VOIDED}"
        actor: PlatformAdmin
        preconditions: ["Payout is PENDING"]
        side_effects: ["Recompute Host.projected_payout_cents (remove)"]

  - entity: Deposit
    initial_state: HELD
    terminal_states: [REFUNDED, PARTIALLY_REFUNDED, FORFEITED]
    transitions:
      - from: HELD
        to: REFUNDED
        trigger: "POST /deposits/{id}/settle"
        actor: ComplianceReviewer
        preconditions:
          - "Deposit is HELD"
          - "Booking.status == COMPLETED (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "No DamageClaim for this deposit in {FILED, DISPUTED} (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "forfeited_cents == 0"
        side_effects: ["refunded_cents := held_cents; held_cents := 0; status := REFUNDED"]
      - from: HELD
        to: PARTIALLY_REFUNDED
        trigger: "POST /deposits/{id}/settle"
        actor: ComplianceReviewer
        preconditions:
          - "Deposit is HELD"
          - "Booking.status == COMPLETED (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "No DamageClaim for this deposit in {FILED, DISPUTED} (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "0 < forfeited_cents < amount_cents"
        side_effects: ["refunded_cents := held_cents; held_cents := 0; status := PARTIALLY_REFUNDED"]
      - from: HELD
        to: FORFEITED
        trigger: "POST /deposits/{id}/settle"
        actor: ComplianceReviewer
        preconditions:
          - "Deposit is HELD"
          - "Booking.status == COMPLETED (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "No DamageClaim for this deposit in {FILED, DISPUTED} (ERR_DEPOSIT_NOT_SETTLEABLE)"
          - "forfeited_cents == amount_cents (held_cents already 0)"
        side_effects: ["refunded_cents := 0; status := FORFEITED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: extension-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /extensions"
    occ_field: "expected_booking_version"
    description: |
      Creating an Extension against a Booking whose version has advanced since
      the client last observed it is rejected. A prior write (an earlier
      extension request, which legitimately supersedes the client's view, or a
      cascade that bumped the booking) has moved the version forward, so the
      current writer's expected_booking_version is stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: claim-create-stale-deposit
    parent_entity: Deposit
    write_endpoint: "POST /damage-claims"
    occ_field: "expected_deposit_version"
    description: |
      Creating a DamageClaim against a Deposit whose version has advanced since
      the client last observed it is rejected. Another claim filed against the
      same deposit (which the product allows to coexist) has moved the deposit
      version forward, so the current writer's expected_deposit_version is stale.
    error_id: ERR_STALE_DEPOSIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_term_days
    trigger: "Booking creation; Extension APPROVED"
    algorithm: aggregation
    formula: |
      term_days = (end_date - start_date) in whole calendar days
      # occupancy is half-open [start_date, end_date); e.g. 2026-06-01..2026-07-01 = 30
    precision: "integer days"

  - name: booking_rent
    trigger: "Booking creation (PROVISIONAL); Booking COMPLETED and Payout SCHEDULED (FINAL)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL:
        rent_cents = round_half_up(monthly_rate_cents * term_days / DAYS_PER_MONTH_CONVENTION)
      FINAL (calendar per-month, rounding pinned to round-per-month-then-sum):
        rent_cents = 0
        for each calendar month m intersecting [start_date, end_date):
          covered_days_m = number of days of month m inside [start_date, end_date)
          actual_days_m  = number of days in month m (28/29/30/31)
          rent_cents += round_half_up(monthly_rate_cents * covered_days_m / actual_days_m)
        # PINNED ORDER: round each month's prorated amount THEN sum
        # (sum-then-round is explicitly NOT used and can differ by cents)
    constants:
      DAYS_PER_MONTH_CONVENTION: 30
    precision: "cents, round_half_up"
    variants:
      - name: provisional
        when: "at Booking creation, and while REQUESTED/CONFIRMED/ACTIVE"
        difference: "uses 30-day-month convention (single division by 30)"
      - name: final
        when: "at Booking COMPLETED (and locked into Payout at SCHEDULED)"
        difference: "calendar per-month proration, round each month then sum"

  - name: cleaning_charge
    trigger: "Booking creation"
    algorithm: threshold
    formula: |
      cleaning_charge_cents = 0 if Unit.cleaning_included else Unit.cleaning_fee_cents
      gross_rent_cents = rent_cents + cleaning_charge_cents

  - name: platform_fee
    trigger: "Payout creation (on Booking CONFIRMED); Payout SCHEDULED (finalize)"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (gross_rent_cents, term_days, utilities_included), tiered rate
      # selection + nested min/max floor+cap
      if term_days >= 90:      base_rate = FEE_RATE_TIER3   # 0.08
      elif term_days >= 60:    base_rate = FEE_RATE_TIER2   # 0.10
      else:                    base_rate = FEE_RATE_TIER1   # 0.12  (30..59)
      surcharge = UTILITIES_SURCHARGE_RATE if Unit.utilities_included else 0
      effective_rate = base_rate + surcharge
      raw_fee = round_half_up(gross_rent_cents * effective_rate)
      platform_fee_cents = min(MAX_FEE_CENTS, max(MIN_FEE_CENTS, raw_fee))
    constants:
      FEE_RATE_TIER1: 0.12
      FEE_RATE_TIER2: 0.10
      FEE_RATE_TIER3: 0.08
      UTILITIES_SURCHARGE_RATE: 0.02
      MIN_FEE_CENTS: 5000
      MAX_FEE_CENTS: 200000
    precision: "cents, round_half_up"

  - name: payout_net
    trigger: "Payout creation (PROVISIONAL); Payout SCHEDULED (FINAL)"
    algorithm: aggregation
    formula: |
      net_cents = gross_rent_cents - platform_fee_cents + deposit_adjustment_cents   # both bases
      # deposit_adjustment_cents starts at 0 and is set to Deposit.forfeited_cents by the
      # damage-claim APPROVED cascade, in either basis.
      # The PROVISIONAL vs FINAL divergence comes ONLY from which booking rent feeds
      # gross_rent_cents / platform_fee_cents:
      #   PROVISIONAL (payout PENDING): Booking PROVISIONAL rent (30-day convention)
      #   FINAL (payout after Booking COMPLETED): Booking FINAL rent (calendar per-month)
    precision: "cents"
    variants:
      - name: provisional
        when: "Payout PENDING (created at Booking CONFIRMED, before its booking completes)"
        difference: "gross/fee use the provisional booking rent"
      - name: final
        when: "Payout after Booking COMPLETED (payout_basis FINAL)"
        difference: "gross/fee use the final booking rent; deposit_adjustment (if any) is included the same way in both bases"

  - name: occupancy_tax
    trigger: "Booking CONFIRMED (create TaxAssessment); Extension APPROVED (reassess)"
    algorithm: threshold
    formula: |
      if assessed_term_days >= TAX_EXEMPT_MIN_DAYS:
        taxable = false; occupancy_tax_cents = 0; exempt_reason = MID_TERM_30_DAY
      else:
        taxable = true
        occupancy_tax_cents = round_half_up(gross_rent_cents * OCCUPANCY_TAX_RATE)
        exempt_reason = NONE
    constants:
      TAX_EXEMPT_MIN_DAYS: 30
      OCCUPANCY_TAX_RATE: 0.14
    precision: "cents, round_half_up"

  - name: deposit_settlement
    trigger: "DamageClaim APPROVED (forfeiture); POST /deposits/{id}/settle (refund remainder)"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall over deposit.amount_cents: damage bucket first, refund remainder.
      # On each APPROVED claim: forfeited_cents += approved_cents (bounded by held_cents),
      #   held_cents -= approved_cents
      # On settle: refunded_cents = held_cents; held_cents = 0
      # INVARIANT (conserved): amount_cents == held_cents + refunded_cents + forfeited_cents
    precision: "cents"

  - name: host_ledger
    trigger: "Payout PAID / REVERSED / SCHEDULED / VOIDED"
    algorithm: aggregation
    formula: |
      # source: Payout rows for the host; explicit status filters, no tie-break needed (pure sums)
      payout_balance_cents   = sum(net_cents for Payout where host_id = H and status == PAID)
      projected_payout_cents = sum(net_cents for Payout where host_id = H and status in {PENDING, SCHEDULED})
      # INVARIANT (conserved): pay then reverse leaves payout_balance_cents unchanged
    precision: "cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /hosts, POST /tenants (Anonymous)"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation, and entity_backed roles act on resources they own"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources (path ids and FK body ids) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, dates parse, end_date > start_date"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "expected_<parent>_version matches current parent version (OCC)"
    error_id: "ERR_STALE_BOOKING_VERSION / ERR_STALE_DEPOSIT_VERSION"
    http_status: 412
    applies_to: "POST /extensions, POST /damage-claims"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /transitions and /settle endpoints"

  - priority: 7
    category: business_safety
    check: "Booking confirm requires Tenant.verification_status == VERIFIED"
    error_id: ERR_TENANT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /bookings/{id}/transitions (CONFIRMED)"

  - priority: 8
    category: business_constraint
    check: "Unit is LISTED for confirm; booking term within [min_term_days, max_term_days]; extension term <= max_term_days"
    error_id: "ERR_UNIT_NOT_LISTED / ERR_TERM_TOO_SHORT / ERR_TERM_EXCEEDS_MAX"
    http_status: "409 / 422"
    applies_to: "POST /bookings, POST /bookings/{id}/transitions (CONFIRMED), POST /extensions/{id}/transitions (APPROVED)"

  - priority: 9
    category: business_referential
    check: "Confirm with Unit.requires_coi needs an ACTIVE covering CoiPolicy; payout schedule needs Booking COMPLETED"
    error_id: "ERR_COI_REQUIRED / ERR_BOOKING_NOT_COMPLETED"
    http_status: 409
    applies_to: "POST /bookings/{id}/transitions (CONFIRMED), POST /payouts/{id}/transitions (SCHEDULED)"

  - priority: 10
    category: business_temporal
    check: "Unit availability (half-open + turnover buffer) at booking create/extension; Tenant no double-booking (closed interval) at booking create"
    error_id: "ERR_UNIT_UNAVAILABLE / ERR_TENANT_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /bookings, POST /extensions/{id}/transitions (APPROVED)"

  - priority: 11
    category: business_fiscal
    check: "Host.payout_account_status == VERIFIED for confirm/schedule; damage approved_cents <= claimed_cents and <= held_cents; SoD on payout PAID"
    error_id: "ERR_HOST_PAYOUT_NOT_VERIFIED / ERR_APPROVED_EXCEEDS_CLAIMED / ERR_APPROVED_EXCEEDS_HELD / ERR_SEGREGATION_OF_DUTIES"
    http_status: "409"
    applies_to: "confirm, payout transitions, damage-claim approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Host ----
  - { method: POST, path: "/hosts", description: "Register a host", roles: [Anonymous], code: 201, input: [display_name, email], output: Host, side_effects: ["payout_account_status=UNVERIFIED, status=ACTIVE"] }
  - { method: GET, path: "/hosts/{id}", description: "Get a host", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Host, side_effects: [] }
  - { method: POST, path: "/hosts/{id}/verify-payout", description: "Mark host payout account VERIFIED", roles: [ComplianceReviewer], code: 200, input: [], output: Host, side_effects: ["payout_account_status=VERIFIED"] }

  # ---- Tenant ----
  - { method: POST, path: "/tenants", description: "Register a tenant", roles: [Anonymous], code: 201, input: [full_name, email, tenant_type], output: Tenant, side_effects: ["verification_status=UNVERIFIED, status=ACTIVE"] }
  - { method: GET, path: "/tenants/{id}", description: "Get a tenant", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Tenant, side_effects: [] }

  # ---- Verification ----
  - { method: POST, path: "/verifications", description: "Submit a verification document for a tenant", roles: [Tenant], code: 201, input: [tenant_id, doc_type, document_ref], output: Verification, side_effects: ["status=PENDING; recompute Tenant.verification_status"] }
  - { method: GET, path: "/verifications/{id}", description: "Get a verification", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Verification, side_effects: [] }
  - { method: GET, path: "/verifications", description: "List verifications, filter by tenant", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["tenant_id?", "status?", "limit?", "offset?"], output: "Verification[]", side_effects: [] }
  - { method: POST, path: "/verifications/{id}/transitions", description: "Approve/reject (reviewer) or resubmit (tenant) a verification", roles: [ComplianceReviewer, Tenant], code: 200, input: [to_status, "reviewer_note?"], output: Verification, side_effects: ["recompute Tenant.verification_status"] }

  # ---- Unit ----
  - { method: POST, path: "/units", description: "Create a unit (DRAFT)", roles: [Host], code: 201, input: [host_id, title, address, monthly_rate_cents, "cleaning_fee_cents?", "deposit_cents?", "utilities_included?", "cleaning_included?", "requires_coi?", "min_term_days?", "max_term_days?", "turnover_buffer_days?"], output: Unit, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/units/{id}", description: "Get a unit", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: GET, path: "/units", description: "List units, filter by host/status", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["host_id?", "status?", "limit?", "offset?"], output: "Unit[]", side_effects: [] }
  - { method: POST, path: "/units/{id}/transitions", description: "List/suspend/relist/delist a unit", roles: [Host, PlatformAdmin], code: 200, input: [to_status], output: Unit, side_effects: ["state transition per Unit state machine; increments Unit.version"] }

  # ---- Booking ----
  - { method: POST, path: "/bookings", description: "Request a booking (REQUESTED, reserves the unit slot)", roles: [Tenant], code: 201, input: [unit_id, tenant_id, start_date, end_date], output: Booking, side_effects: ["term_days, rent_cents (PROVISIONAL), cleaning_charge_cents, gross_rent_cents computed; unit availability + tenant double-booking checked"] }
  - { method: GET, path: "/bookings/{id}", description: "Get a booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/bookings", description: "List bookings, filter by unit/tenant/status", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["unit_id?", "tenant_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: POST, path: "/bookings/{id}/transitions", description: "Confirm/decline/cancel/activate/complete a booking", roles: [Host, Tenant, PlatformAdmin], code: 200, input: [to_status], output: Booking, side_effects: ["state transition per Booking state machine incl. Deposit/Payout/TaxAssessment/Turnover cascades"] }

  # ---- Extension ----
  - { method: POST, path: "/extensions", description: "Request a booking extension (OCC on Booking.version)", roles: [Tenant], code: 201, input: [booking_id, expected_booking_version, new_end_date], output: Extension, side_effects: ["added_days computed; status=REQUESTED; increments Booking.version by 1"] }
  - { method: GET, path: "/extensions/{id}", description: "Get an extension", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Extension, side_effects: [] }
  - { method: GET, path: "/extensions", description: "List extensions, filter by booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["booking_id?", "status?", "limit?", "offset?"], output: "Extension[]", side_effects: [] }
  - { method: POST, path: "/extensions/{id}/transitions", description: "Approve/decline/withdraw an extension", roles: [Host, Tenant], code: 200, input: [to_status], output: Extension, side_effects: ["APPROVED cascades Booking -> Payout -> Host and reassesses TaxAssessment"] }

  # ---- Deposit ----
  - { method: GET, path: "/deposits/{id}", description: "Get a deposit", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Deposit, side_effects: [] }
  - { method: GET, path: "/deposits", description: "List deposits, filter by booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["booking_id?", "status?", "limit?", "offset?"], output: "Deposit[]", side_effects: [] }
  - { method: POST, path: "/deposits/{id}/settle", description: "Settle a deposit after booking completion and claim resolution", roles: [ComplianceReviewer], code: 200, input: [], output: Deposit, side_effects: ["refund remainder; status -> REFUNDED / PARTIALLY_REFUNDED / FORFEITED"] }

  # ---- DamageClaim ----
  - { method: POST, path: "/damage-claims", description: "File a damage claim against a deposit (OCC on Deposit.version)", roles: [Host], code: 201, input: [deposit_id, expected_deposit_version, claimed_cents, description], output: DamageClaim, side_effects: ["status=FILED; increments Deposit.version by 1"] }
  - { method: GET, path: "/damage-claims/{id}", description: "Get a damage claim", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: GET, path: "/damage-claims", description: "List damage claims, filter by deposit", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["deposit_id?", "status?", "limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }
  - { method: POST, path: "/damage-claims/{id}/transitions", description: "Dispute/revise/approve/reject/withdraw a damage claim", roles: [Host, Tenant, ComplianceReviewer], code: 200, input: [to_status, "approved_cents?", "claimed_cents?", "tenant_response?"], output: DamageClaim, side_effects: ["APPROVED cascades Deposit -> Payout -> Host (depth 3)"] }

  # ---- CoiPolicy ----
  - { method: POST, path: "/coi-policies", description: "Submit a certificate of insurance for a booking", roles: [Host, Tenant], code: 201, input: [booking_id, coverage_cents, effective_start, effective_end], output: CoiPolicy, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/coi-policies/{id}", description: "Get a COI policy", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: CoiPolicy, side_effects: [] }
  - { method: GET, path: "/coi-policies", description: "List COI policies, filter by booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["booking_id?", "status?", "limit?", "offset?"], output: "CoiPolicy[]", side_effects: [] }
  - { method: POST, path: "/coi-policies/{id}/transitions", description: "Activate/revoke/expire a COI policy", roles: [ComplianceReviewer, PlatformAdmin], code: 200, input: [to_status], output: CoiPolicy, side_effects: ["state transition per CoiPolicy state machine"] }

  # ---- Turnover (cascade-created; discovery via GET) ----
  - { method: GET, path: "/turnovers/{id}", description: "Get a turnover", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Turnover, side_effects: [] }
  - { method: GET, path: "/turnovers", description: "List turnovers, filter by unit/booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["unit_id?", "booking_id?", "status?", "limit?", "offset?"], output: "Turnover[]", side_effects: [] }
  - { method: POST, path: "/turnovers/{id}/transitions", description: "Start/complete/skip a turnover", roles: [Host], code: 200, input: [to_status], output: Turnover, side_effects: ["state transition per Turnover state machine"] }

  # ---- Payout (cascade-created; discovery via GET) ----
  - { method: GET, path: "/payouts/{id}", description: "Get a payout", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: GET, path: "/payouts", description: "List payouts, filter by booking/host", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["booking_id?", "host_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/payouts/{id}/transitions", description: "Schedule/pay/reverse/void a payout (maker-checker SoD on PAID)", roles: [PlatformAdmin], code: 200, input: [to_status], output: Payout, side_effects: ["state transition per Payout state machine incl. host ledger updates"] }

  # ---- TaxAssessment (cascade-created; discovery via GET) ----
  - { method: GET, path: "/tax-assessments/{id}", description: "Get a tax assessment", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: [], output: TaxAssessment, side_effects: [] }
  - { method: GET, path: "/tax-assessments", description: "List tax assessments, filter by booking", roles: [Host, Tenant, ComplianceReviewer, PlatformAdmin], code: 200, input: ["booking_id?", "limit?", "offset?"], output: "TaxAssessment[]", side_effects: [] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["current_utc := to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed actor does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced FK id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, invalid enum, unparseable date, or end_date <= start_date" }
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version != current Booking.version on POST /extensions" }
  - { id: ERR_STALE_DEPOSIT_VERSION, http: 412, condition: "expected_deposit_version != current Deposit.version on POST /damage-claims" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_TENANT_NOT_VERIFIED, http: 409, condition: "Booking confirm attempted while Tenant.verification_status != VERIFIED" }
  - { id: ERR_UNIT_NOT_LISTED, http: 409, condition: "Booking confirm attempted while Unit.status != LISTED" }
  - { id: ERR_TERM_TOO_SHORT, http: 422, condition: "Booking term_days < Unit.min_term_days" }
  - { id: ERR_TERM_EXCEEDS_MAX, http: 422, condition: "Booking or extended term_days > Unit.max_term_days" }
  - { id: ERR_COI_REQUIRED, http: 409, condition: "Confirm/activate requires an ACTIVE CoiPolicy covering the window but none exists" }
  - { id: ERR_COI_INSUFFICIENT_COVERAGE, http: 409, condition: "COI activate with coverage_cents < COI_MIN_COVERAGE_CENTS" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 409, condition: "Payout schedule attempted while Booking.status != COMPLETED" }
  - { id: ERR_UNIT_UNAVAILABLE, http: 409, condition: "Booking window (half-open + turnover buffer) overlaps an existing REQUESTED/CONFIRMED/ACTIVE booking on the unit" }
  - { id: ERR_TENANT_DOUBLE_BOOKED, http: 409, condition: "Booking window (closed interval) intersects another CONFIRMED/ACTIVE booking of the same tenant" }
  - { id: ERR_HOST_PAYOUT_NOT_VERIFIED, http: 409, condition: "Confirm or payout schedule attempted while Host.payout_account_status != VERIFIED" }
  - { id: ERR_APPROVED_EXCEEDS_CLAIMED, http: 422, condition: "Damage claim approved_cents > claimed_cents" }
  - { id: ERR_APPROVED_EXCEEDS_HELD, http: 409, condition: "Damage claim approved_cents > Deposit.held_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Payout PAID attempted by the same X-User-ID that scheduled it" }
  - { id: ERR_DEPOSIT_NOT_SETTLEABLE, http: 409, condition: "Deposit settle attempted before Booking COMPLETED or while open FILED/DISPUTED claims exist" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 409, condition: "Damage claim approve attempted while Deposit.status != HELD" }
  - { id: ERR_EXTENSION_NOT_LATER, http: 422, condition: "Extension new_end_date <= current Booking.end_date" }
  - { id: ERR_DATE_RANGE_INVALID, http: 422, condition: "COI effective_start > effective_end" }
  - { id: ERR_UNIT_HAS_ACTIVE_BOOKINGS, http: 409, condition: "Unit delist attempted while a REQUESTED/CONFIRMED/ACTIVE booking exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-registration surface"
    identity: opaque
    exclusive_operations:
      - "POST /hosts — register host"
      - "POST /tenants — register tenant"
    shared_operations: []

  - name: Host
    description: "Property owner/manager; owns units and the host side of bookings, files damage claims, manages turnovers"
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /units — create own unit"
      - "POST /units/{id}/transitions — list/suspend/relist/delist own unit"
      - "POST /bookings/{id}/transitions (CONFIRMED, DECLINED) — decide requests on own units"
      - "POST /damage-claims — file claim against own booking's deposit"
      - "POST /damage-claims/{id}/transitions (FILED revise, WITHDRAWN) — manage own claims"
      - "POST /extensions/{id}/transitions (APPROVED, DECLINED) — decide extensions on own units"
      - "POST /turnovers/{id}/transitions — run turnovers on own units"
    shared_operations:
      - "GET reads on hosts/tenants/units/bookings/verifications/extensions/deposits/damage-claims/coi-policies/turnovers/payouts/tax-assessments"
      - "POST /coi-policies — submit COI (shared with Tenant)"

  - name: Tenant
    description: "Traveling nurse / relocation renter; requests bookings, submits verification, disputes claims"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /bookings — request a booking for self"
      - "POST /bookings/{id}/transitions (CANCELLED) — cancel own booking"
      - "POST /verifications — submit own verification docs"
      - "POST /verifications/{id}/transitions (PENDING resubmit) — resubmit own rejected verification"
      - "POST /extensions — request extension on own booking"
      - "POST /extensions/{id}/transitions (WITHDRAWN) — withdraw own extension"
      - "POST /damage-claims/{id}/transitions (DISPUTED) — dispute a claim on own deposit"
    shared_operations:
      - "GET reads (same as Host)"
      - "POST /coi-policies — submit COI (shared with Host)"

  - name: ComplianceReviewer
    description: "Platform compliance operator; adjudicates verifications, COI, damage claims, deposit settlement, host payout verification"
    identity: opaque
    exclusive_operations:
      - "POST /hosts/{id}/verify-payout — verify host payout account"
      - "POST /verifications/{id}/transitions (APPROVED, REJECTED)"
      - "POST /coi-policies/{id}/transitions (ACTIVE, REVOKED)"
      - "POST /damage-claims/{id}/transitions (APPROVED, REJECTED)"
      - "POST /deposits/{id}/settle"
    shared_operations:
      - "GET reads (same as Host)"

  - name: PlatformAdmin
    description: "Platform finance/operations operator; drives booking activation/completion, payouts (maker-checker SoD), COI expiry, clock"
    identity: opaque
    exclusive_operations:
      - "POST /bookings/{id}/transitions (ACTIVE, COMPLETED)"
      - "POST /payouts/{id}/transitions — schedule/pay/reverse/void (same operator cannot both schedule and pay)"
      - "POST /coi-policies/{id}/transitions (EXPIRED)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads (same as Host)"
      - "POST /units/{id}/transitions (SUSPENDED) — shared with Host"
