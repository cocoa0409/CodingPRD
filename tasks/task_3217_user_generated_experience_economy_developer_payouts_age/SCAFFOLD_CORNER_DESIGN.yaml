scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: user_create_returns_full_envelope_and_initial_state
        claim_type: Creation
        grounds:
          - entities.User
          - endpoints.POST_/ugc/users
        distinguishing_aspect: "A user POSTed with username/email/date_of_birth returns 201 with status ACTIVE, version 1, computed age_band and chat_filter_level, and zero balances; system fields (id, created_at, updated_at) are populated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/users"
              payload: { username: "u1", email: "u1@x.com", date_of_birth: "1990-06-15" }
              as: Anonymous
              captures: { u1_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "User.${u1_id}.status == ACTIVE"
            - "User.${u1_id}.version == 1"
            - "User.${u1_id}.age_band == ADULT"
            - "User.${u1_id}.chat_filter_level == ADULT"
            - "User.${u1_id}.robux_balance == 0"
            - "User.${u1_id}.earned_robux_lifetime == 0"
            - "User.${u1_id}.is_devex_eligible == false (no identity verification yet)"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: user_create_child_computes_safe_chat_filter
        claim_type: Computed Fields
        grounds:
          - entities.User.fields.age_band
          - entities.User.fields.chat_filter_level
          - calculations.age_band_compute
        distinguishing_aspect: "A user with date_of_birth 2020-05-15 (age 6 at the 2026-09-01 clock) gets age_band == CHILD and chat_filter_level == SAFE without any client input."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/users"
              payload: { username: "kid1", email: "kid1@x.com", date_of_birth: "2020-05-15" }
              as: Anonymous
              captures: { kid_id: $.data.id }
          assert:
            - "User.${kid_id}.age_band == CHILD"
            - "User.${kid_id}.chat_filter_level == SAFE"

      - name: user_get_unknown_id_returns_user_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/ugc/users/{userId}
          - errors.ERR_USER_NOT_FOUND
        distinguishing_aspect: "GET with a syntactically valid but unallocated UUID produces the entity-specific 404 ERR_USER_NOT_FOUND, not a generic 400 or 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /ugc/users/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 404, error_id == ERR_USER_NOT_FOUND"

      - name: user_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.User.fields.email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "email is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the required-field check, distinct from any business-rule error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/users"
              payload: { username: "noemail", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 400, error_id == ERR_INVALID_REQUEST"

      - name: parental_controls_default_chat_mode_is_filtered
        claim_type: Defaults
        grounds:
          - entities.ParentalControls.fields.chat_mode
        distinguishing_aspect: "chat_mode declares default FILTERED; creating ParentalControls without specifying chat_mode stores FILTERED, not null and not OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ADULT parent and CHILD child linked."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "par_pc", email: "par_pc@x.com", date_of_birth: "1985-01-01" }
              as: Anonymous
              captures: { par_id: $.data.id, par_v: $.data.version }
            - call: "POST /ugc/users"
              payload: { username: "kid_pc", email: "kid_pc@x.com", date_of_birth: "2020-01-01", parent_user_id: "${par_id}" }
              as: Anonymous
              captures: { kid_id: $.data.id }
          trigger:
            - call: "POST /ugc/users/${par_id}/parental-controls"
              payload: { child_user_id: "${kid_id}", pin_hash: "h", expected_user_version: "${par_v}" }
              as: Creator
              as_user_id: "${par_id}"
              captures: { pc_id: $.data.id }
          assert:
            - "ParentalControls.${pc_id}.chat_mode == FILTERED"
            - "ParentalControls.${pc_id}.monthly_spend_limit_robux is null"
            - "ParentalControls.${pc_id}.allowed_age_ratings == []"

      - name: experiences_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/ugc/experiences
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three experiences, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One creator with three DRAFT experiences."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "cr_pg", email: "cr_pg@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "A", description: "a" }
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /ugc/experiences"
              payload: { title: "B", description: "b" }
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /ugc/experiences"
              payload: { title: "C", description: "c" }
              as: Creator
              as_user_id: "${cr_id}"
          trigger:
            - call: "GET /ugc/experiences"
              payload: { creator_user_id: "${cr_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response status 200, response_type array"
            - "2 rows returned, total_count == 3, has_more == true"
            - "GET /ugc/experiences?creator_user_id=${cr_id}&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: experience_archive_from_published_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Experience
          - endpoints.POST_/ugc/experiences/{id}/archive
        distinguishing_aspect: "Once an Experience is ARCHIVED, every further action endpoint (submit-for-review, suspend, republish, archive) returns ERR_INVALID_STATE; the terminal state is absorbing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One creator with an ARCHIVED experience."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "cr_ar", email: "cr_ar@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "A", description: "a" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { exp_id: $.data.id }
            - call: "POST /ugc/experiences/${exp_id}/archive"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /ugc/experiences/${exp_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 409, error_id == ERR_INVALID_STATE"
            - "Experience.${exp_id}.status remains ARCHIVED"

      - name: moderation_submission_decide_from_queued_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ModerationSubmission
        distinguishing_aspect: "Calling /decide on a submission still in QUEUED (no automated score yet) is rejected — the human-decision transition is only valid from HUMAN_REVIEW."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One experience submitted for review; submission still QUEUED (no inject_score called)."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "cr_q", email: "cr_q@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "A", description: "a" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { exp_id: $.data.id }
            - call: "POST /ugc/experiences/${exp_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "EXPERIENCE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_id: "$.data[0].id" }
          trigger:
            - call: "POST /ugc/moderation-submissions/${sub_id}/decide"
              payload: { decision: "APPROVE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 409, error_id == ERR_INVALID_STATE"
            - "ModerationSubmission.${sub_id}.status remains QUEUED"

      - name: devex_mark_paid_by_same_officer_who_approved_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DevExchangeRequest
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties: the FinanceOfficer who approved a DevExchangeRequest cannot also mark it paid; the second transition is rejected with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fully eligible creator with SUBMITTED DevEx request, approved by officer-1."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "cr_sod", email: "cr_sod@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /ugc/users/${cr_id}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2030-01-01T00:00:00Z" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /ugc/identity-verifications/${iv_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${cr_id}/tax-documents"
              payload: { form_type: "W9", tin_last4: "1111", legal_name: "Cr Sod", country_of_residence: "US" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { tax_id: $.data.id }
            - call: "POST /ugc/tax-documents/${tax_id}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 2000000, payment_method_token: "tok", idempotency_key: "sod-cur" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { cur_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "GET /ugc/users/${cr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cr_v: $.data.version }
            - call: "POST /ugc/devex-requests"
              payload: { requested_robux: 30000, expected_user_version: "${cr_v}" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { devex_id: $.data.id }
            - call: "POST /ugc/devex-requests/${devex_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /ugc/devex-requests/${devex_id}/mark-paid"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 422, error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DevExchangeRequest.${devex_id}.status remains APPROVED"

      - name: devex_mark_paid_by_different_officer_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.DevExchangeRequest
        distinguishing_aspect: "A different FinanceOfficer CAN mark the approved request paid; the segregation-of-duties check keys on user_id, not role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Same setup as the segregation-of-duties case."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "cr_sod2", email: "cr_sod2@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /ugc/users/${cr_id}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2030-01-01T00:00:00Z" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /ugc/identity-verifications/${iv_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${cr_id}/tax-documents"
              payload: { form_type: "W9", tin_last4: "2222", legal_name: "Cr Sod2", country_of_residence: "US" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { tax_id: $.data.id }
            - call: "POST /ugc/tax-documents/${tax_id}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 2000000, payment_method_token: "tok", idempotency_key: "sod2-cur" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { cur_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "GET /ugc/users/${cr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cr_v: $.data.version }
            - call: "POST /ugc/devex-requests"
              payload: { requested_robux: 30000, expected_user_version: "${cr_v}" }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { devex_id: $.data.id }
            - call: "POST /ugc/devex-requests/${devex_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /ugc/devex-requests/${devex_id}/mark-paid"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-2"
          assert:
            - "response status 200"
            - "DevExchangeRequest.${devex_id}.status == PAID"

  # ===========================================================================
  - section: calculations
    instances:

      - name: marketplace_split_nonlimited_fee_30pct
        claim_type: Correct Result
        grounds:
          - calculations.marketplace_split
        distinguishing_aspect: "For a non-limited item at price 100, platform_fee_robux == 30 and creator_credit_robux == 70 — round_half_up(100*0.30)=30, no rounding ambiguity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Seller with ON_SALE HAT at 100. Buyer with 600 robux."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "s_ms", email: "s_ms@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "b_ms", email: "b_ms@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Cap", item_kind: "HAT", price_robux: 100 }
              as: Creator
              as_user_id: "${s_id}"
              captures: { item_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${s_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_id}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 750, payment_method_token: "tok", idempotency_key: "ms-cur" }
              as: Creator
              as_user_id: "${b_id}"
              captures: { cur_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${b_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_id}", price_robux: 100, idempotency_key: "ms-po" }
              as: Creator
              as_user_id: "${b_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /ugc/purchase-orders/${po_id}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${b_id}"
          assert:
            - "PurchaseOrder.${po_id}.platform_fee_robux == 30"
            - "PurchaseOrder.${po_id}.creator_credit_robux == 70"
            - "Seller earned_robux_lifetime == 70"

      - name: marketplace_split_limited_resale_royalty_waterfall
        claim_type: Correct Result
        grounds:
          - calculations.marketplace_split
        distinguishing_aspect: "For a limited resale at price 1000 with royalty_pct 10, the waterfall is: platform fee round_half_up(1000*0.30)=300; gross seller share 700; royalty round_half_up(700*0.10)=70; reseller receives 630; original creator receives 70. Royalty is computed on the POST-FEE share, not on gross price."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Original creator 'oc', reseller 'rs' (account_age_days >= 7, owns the limited), buyer 'bb' with 2000 robux."
            - "Limited item ON_SALE at original price 500, royalty_pct 10; reseller lists at ask 1000."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "oc", email: "oc@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { oc_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "rs", email: "rs@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { rs_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "bb", email: "bb@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Ltd Hat", item_kind: "LIMITED_HAT", price_robux: 500, total_supply: 5, royalty_pct: 10 }
              as: Creator
              as_user_id: "${oc_id}"
              captures: { item_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${oc_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_id}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 700, payment_method_token: "tok", idempotency_key: "rs-cur" }
              as: Creator
              as_user_id: "${rs_id}"
              captures: { rs_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${rs_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${rs_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_id}", price_robux: 500, idempotency_key: "rs-po" }
              as: Creator
              as_user_id: "${rs_id}"
              captures: { rs_po: $.data.id }
            - call: "POST /ugc/purchase-orders/${rs_po}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${rs_id}"
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 3000, payment_method_token: "tok", idempotency_key: "bb-cur" }
              as: Creator
              as_user_id: "${bb_id}"
              captures: { bb_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${bb_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${bb_id}"
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ugc/marketplace-items/${item_id}"
              payload: {}
              as: Creator
              as_user_id: "${rs_id}"
              captures: { item_v: $.data.version }
