    parent: null
    common_fields: true
    fields:
      - { name: investigator_id, type: string, source: input, description: "FK -> Investigator.id" }
      - { name: required_for_project_id, type: string, source: input, description: "FK -> Project.id; null means an institution-wide requirement", default: null }
      - { name: course_code, type: enum, source: input, description: "RESEARCH_SECURITY_BASE | EXPORT_CONTROL | INSIDER_THREAT | FOREIGN_TRAVEL_BRIEF | CONTROLLED_AREA_SAFETY" }
      - { name: assigned_on, type: datetime, source: system, description: "Logical-clock instant of assignment" }
      - { name: due_on, type: datetime, source: input, description: "Completion deadline; the clock reaching this instant expires the assignment" }
      - { name: completed_on, type: datetime, source: system, description: "Logical-clock instant of completion", default: null }
      - { name: waived_on, type: datetime, source: system, description: "Logical-clock instant of waiver", default: null }
      - { name: status, type: enum, source: computed, description: "WAIVED | COMPLETED | EXPIRED | ASSIGNED — evaluated on every read against the logical clock; see calculations.training_assignment_status" }

  - name: Subaward
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: organization_id, type: string, source: input, description: "FK -> ForeignOrganization.id; the proposed collaborating entity" }
      - { name: scope, type: string, source: input, description: "Statement of work summary" }
      - { name: amount_cents, type: integer, source: input, description: "Subaward amount in cents", constraints: "value > 0" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | FLAGGED | BLOCKED | MITIGATED | EXECUTED | TERMINATED" }
      - { name: applied_screening_variant, type: enum, source: computed, description: "DIRECT_MATCH | OWNERSHIP_TRANSITIVE — variant of the most recent screen", default: null }
      - { name: screening_designation, type: enum, source: computed, description: "The designation the screen resolved to, same enum members as ForeignOrganization.own_designation", default: null }
      - { name: screening_matched_organization_id, type: string, source: computed, description: "Chain member that supplied screening_designation; equals organization_id under DIRECT_MATCH", default: null }
      - { name: screening_match_depth, type: integer, source: computed, description: "Hop distance from organization_id to screening_matched_organization_id", default: null }
      - { name: screening_risk_points, type: integer, source: computed, description: "Risk points produced by the most recent screen", default: null }
      - { name: mitigation_justification, type: string, source: input, description: "Officer justification recorded on a mitigation decision", default: null }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock instant the subaward was executed", default: null }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock instant the subaward was terminated", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # CYCLIC — revision loop UNDER_REVIEW → RETURNED_FOR_REVISION → SUBMITTED
  # ---------------------------------------------------------------------------
  - entity: Disclosure
    dimension: review_status
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /disclosures/{disclosure_id}/submit"
        actor: Investigator
        preconditions:
          - "X-User-ID equals Disclosure.investigator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Investigator.disclosure_posture != SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
          - "No DisclosureItem on this disclosure has status == DISPUTED (else ERR_DISPUTED_ITEMS_OPEN)"
        side_effects:
          - "submitted_at = logical clock"
          - "recompute Disclosure.completeness_score (calculations.disclosure_completeness_score)"
          - "recompute Investigator.risk_score, then Investigator.disclosure_posture (calculations.investigator_disclosure_posture)"
          - "recompute Investigator.outside_effort_pct and total_commitment_pct"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disclosures/{disclosure_id}/review with action BEGIN_REVIEW"
        actor: ResearchSecurityOfficer
        preconditions:
          - "If Disclosure.reviewer_user_id is not null it must equal the caller's X-User-ID (else ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects:
          - "reviewer_user_id = X-User-ID on the first BEGIN_REVIEW only; never overwritten afterwards"

      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /disclosures/{disclosure_id}/review with action RETURN_FOR_REVISION"
        actor: ResearchSecurityOfficer
        preconditions:
          - "X-User-ID equals Disclosure.reviewer_user_id (else ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects:
          - "revision_round += 1"
          - "recompute Disclosure.completeness_score — the REVISION_PENALTY term grows by 6 per round and can move the raw-score tier"

      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /disclosures/{disclosure_id}/submit"
        actor: Investigator
        preconditions:
          - "X-User-ID equals Disclosure.investigator_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Investigator.disclosure_posture != SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
          - "No DisclosureItem on this disclosure has status == DISPUTED (else ERR_DISPUTED_ITEMS_OPEN)"
        side_effects:
          - "submitted_at = logical clock (overwritten each round)"
          - "recompute Disclosure.completeness_score"
          - "recompute Investigator.risk_score then Investigator.disclosure_posture"
        note: "Closes the revision cycle; reviewer_user_id survives the loop so the same officer must resume review."

      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "POST /disclosures/{disclosure_id}/review with action CERTIFY"
        actor: ResearchSecurityOfficer
        preconditions:
          - "X-User-ID equals Disclosure.reviewer_user_id (else ERR_NOT_ASSIGNED_REVIEWER)"
          - "Disclosure.completeness_score >= 60 (else ERR_COMPLETENESS_TOO_LOW)"
          - "Disclosure.plan_status IN {NOT_REQUIRED, PLAN_WAIVED, PLAN_ACKNOWLEDGED} (else ERR_PLAN_NOT_RESOLVED)"
          - "No DisclosureItem on this disclosure has status == DISPUTED (else ERR_DISPUTED_ITEMS_OPEN)"
        side_effects:
          - "certified_at = logical clock"
          - "every DisclosureItem with status == DECLARED transitions to VERIFIED"
          - "because those items became VERIFIED, recompute Investigator.outside_effort_pct, total_commitment_pct and risk_score"
          - "because Investigator.risk_score changed, recompute Investigator.disclosure_posture"
          - "recompute Project.activation_blockers for every Project having an ACTIVE ProjectPersonnel row for this investigator"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disclosures/{disclosure_id}/review with action REJECT"
        actor: ResearchSecurityOfficer
        preconditions:
          - "X-User-ID equals Disclosure.reviewer_user_id (else ERR_NOT_ASSIGNED_REVIEWER)"
          - "Disclosure.revision_round >= 2 (else ERR_REJECT_TOO_EARLY)"
        side_effects:
          - "every DisclosureItem with status IN {DECLARED, DISPUTED} transitions to WITHDRAWN"
          - "because those items left {DECLARED, VERIFIED}, recompute Investigator.outside_effort_pct, total_commitment_pct and risk_score"
          - "because Investigator.risk_score changed, recompute Investigator.disclosure_posture"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system — POST /disclosures creates a newer Disclosure with the same (investigator_id, cycle_label)"
        actor: system
        preconditions:
          - "The superseding create passed its own validations including the OCC check on Investigator.version"
        side_effects:
          - "plan_status is left untouched; the superseded row stops counting toward Project.activation_blockers"
          - "recompute Investigator.risk_score then Investigator.disclosure_posture"

      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system — POST /disclosures creates a newer Disclosure with the same (investigator_id, cycle_label)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Investigator.risk_score then Investigator.disclosure_posture"

      - from: RETURNED_FOR_REVISION
        to: SUPERSEDED
        trigger: "system — POST /disclosures creates a newer Disclosure with the same (investigator_id, cycle_label)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Investigator.risk_score then Investigator.disclosure_posture"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system — POST /disclosures creates a newer Disclosure with the same (investigator_id, cycle_label)"
        actor: system
        preconditions: []
        side_effects:
          - "because the certified record is superseded, recompute Project.activation_blockers for every Project with an ACTIVE ProjectPersonnel row for this investigator — DISCLOSURE_NOT_CERTIFIED reappears"
          - "recompute Investigator.risk_score then Investigator.disclosure_posture"

  # ---------------------------------------------------------------------------
  # PARALLEL dimension on the same Disclosure row
  # ---------------------------------------------------------------------------
  - entity: Disclosure
    dimension: plan_status
    initial_state: NOT_REQUIRED
    terminal_states: [PLAN_TERMINATED]
    transitions:
      - from: NOT_REQUIRED
        to: PLAN_REQUIRED
        trigger: "POST /disclosures/{disclosure_id}/review with action REQUIRE_PLAN"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Disclosure.review_status == UNDER_REVIEW (else ERR_INVALID_DISCLOSURE_TRANSITION)"
          - "X-User-ID equals Disclosure.reviewer_user_id (else ERR_NOT_ASSIGNED_REVIEWER)"
          - "Investigator.total_commitment_pct > 100 OR the disclosure has a DisclosureItem with item_type == TALENT_PROGRAM and status IN {DECLARED, VERIFIED} OR Investigator.risk_score >= 30 (else ERR_PLAN_NOT_WARRANTED)"
        side_effects:
          - "recompute Investigator.disclosure_posture — a PLAN_REQUIRED disclosure forces at least REVIEW_REQUIRED"

      - from: PLAN_REQUIRED
        to: PLAN_ISSUED
        trigger: "POST /disclosures/{disclosure_id}/plan with action ISSUE"
        actor: ConflictReviewOfficial
        preconditions:
          - "X-User-ID != Disclosure.reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "plan_effort_cap_pct, plan_required_actions, plan_effective_from and plan_expires_on are all present (else ERR_INVALID_REQUEST)"
          - "plan_expires_on > plan_effective_from (else ERR_INVALID_PLAN_WINDOW)"
        side_effects:
          - "plan_approver_user_id = X-User-ID; the four plan_* input fields are stored"

      - from: PLAN_ISSUED
        to: PLAN_ACKNOWLEDGED
        trigger: "POST /disclosures/{disclosure_id}/plan with action ACKNOWLEDGE"
        actor: Investigator
        preconditions:
          - "X-User-ID equals Disclosure.investigator_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "plan_acknowledged_at = logical clock"
          - "because an acknowledged plan is now in force, recompute Investigator.risk_score — the PLAN_CREDIT of 20 applies while the clock is before plan_expires_on"
          - "because Investigator.risk_score changed, recompute Investigator.disclosure_posture"

      - from: PLAN_REQUIRED
        to: PLAN_WAIVED
        trigger: "POST /disclosures/{disclosure_id}/plan with action WAIVE"
        actor: ConflictReviewOfficial
        preconditions:
          - "X-User-ID != Disclosure.reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Investigator.total_commitment_pct <= 100 AND the disclosure has no DisclosureItem with item_type == TALENT_PROGRAM in {DECLARED, VERIFIED} (else ERR_PLAN_NOT_WARRANTED)"
        side_effects:
          - "recompute Investigator.disclosure_posture"

      - from: PLAN_ACKNOWLEDGED
        to: PLAN_TERMINATED
        trigger: "POST /disclosures/{disclosure_id}/plan with action TERMINATE"
        actor: ConflictReviewOfficial
        preconditions: []
        side_effects:
          - "because the plan is no longer in force, recompute Investigator.risk_score without the PLAN_CREDIT"
          - "because Investigator.risk_score changed, recompute Investigator.disclosure_posture"

      - from: PLAN_ISSUED
        to: PLAN_TERMINATED
        trigger: "POST /disclosures/{disclosure_id}/plan with action TERMINATE"
        actor: ConflictReviewOfficial
        preconditions: []
        side_effects:
          - "recompute Investigator.risk_score (no PLAN_CREDIT was ever applied) then Investigator.disclosure_posture"

  # ---------------------------------------------------------------------------
  # PARALLEL dimensions on Project — award_status and security_status evolve
  # independently on the same row and only meet at the ACTIVE gate.
  # ---------------------------------------------------------------------------
  - entity: Project
    dimension: award_status
    initial_state: PROPOSED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACTIVATION_PENDING
        trigger: "POST /projects/{project_id}/award-status with to_status ACTIVATION_PENDING"
        actor: SystemAdmin
        preconditions:
          - "At least one ProjectPersonnel row on the project has role_on_project == PI and status == ACTIVE (else ERR_PI_REQUIRED)"
        side_effects:
          - "recompute Project.activation_blockers"

      - from: ACTIVATION_PENDING
        to: ACTIVE
        trigger: "POST /projects/{project_id}/award-status with to_status ACTIVE"
        actor: SystemAdmin
        preconditions:
          - "Project.activation_blockers is empty (else ERR_ACTIVATION_BLOCKED, whose message names the first code in BLOCKER_ORDER)"
        side_effects:
          - "recompute Project.open_incident_count and Project.controlled_area_posture"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /projects/{project_id}/award-status with to_status CLOSED"
        actor: SystemAdmin
        preconditions:
          - "No ControlledAccessGrant on the project has status IN {REQUESTED, ACTIVE, SUSPENDED} (else ERR_ACCESS_GRANTS_OPEN)"
          - "Project.open_incident_count == 0 (else ERR_OPEN_INCIDENTS)"
        side_effects:
          - "every Subaward on the project with status IN {PENDING, CLEARED, FLAGGED, BLOCKED, MITIGATED, EXECUTED} transitions to TERMINATED"
          - "every ProjectPersonnel row on the project with status == ACTIVE transitions to REMOVED"
          - "because those personnel rows left ACTIVE, recompute Investigator.committed_effort_pct and total_commitment_pct for each affected investigator"
          - "because Investigator.committed_effort_pct changed, recompute Investigator.overcommitment_pct and Investigator.disclosure_posture for each affected investigator"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /projects/{project_id}/award-status with to_status WITHDRAWN"
        actor: SystemAdmin
        preconditions: []
        side_effects:
          - "every Subaward on the project transitions to TERMINATED"
          - "every ProjectPersonnel row with status IN {PROPOSED, ACTIVE} transitions to REMOVED; ACTIVE rows additionally trigger the committed_effort_pct recompute chain above"

      - from: ACTIVATION_PENDING
        to: WITHDRAWN
        trigger: "POST /projects/{project_id}/award-status with to_status WITHDRAWN"
        actor: SystemAdmin
        preconditions: []
        side_effects:
          - "same cascade as PROPOSED → WITHDRAWN"

  - entity: Project
    dimension: security_status
    initial_state: PENDING_CLEARANCE
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_CLEARANCE
        to: CLEARED
        trigger: "POST /projects/{project_id}/security-status with to_status CLEARED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "No Subaward on the project has status IN {PENDING, FLAGGED, BLOCKED} (else ERR_SUBAWARD_SCREENING_OPEN)"
          - "No investigator with an ACTIVE ProjectPersonnel row on the project has disclosure_posture == SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
        side_effects:
          - "security_status_reason = OFFICER_ACTION"
          - "recompute Project.activation_blockers and Project.controlled_area_posture"

      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /projects/{project_id}/security-status with to_status SUSPENDED, or system cascade from a BLOCKED Subaward or a SUSPENDED investigator"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "security_status_reason = OFFICER_ACTION for the officer-driven call, SUBAWARD_BLOCKED / INVESTIGATOR_SUSPENDED / INCIDENT_NOTIFICATION for the system cascades"
          - "every ControlledAccessGrant on the project with status IN {REQUESTED, ACTIVE} transitions to SUSPENDED with status_reason PROJECT_SUSPENDED"
          - "because those grants left ACTIVE, recompute Project.active_grant_count"
          - "because Project.active_grant_count changed, recompute Project.controlled_area_posture"
          - "recompute Project.activation_blockers — SECURITY_NOT_CLEARED enters the list"

      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /projects/{project_id}/security-status with to_status CLEARED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "No Subaward on the project has status IN {PENDING, FLAGGED, BLOCKED} (else ERR_SUBAWARD_SCREENING_OPEN)"
          - "Project has no SecurityIncident with status IN {REPORTED, INVESTIGATING, SUBSTANTIATED} (else ERR_OPEN_INCIDENTS)"
          - "No investigator with an ACTIVE ProjectPersonnel row has disclosure_posture == SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
        side_effects:
          - "security_status_reason = OFFICER_ACTION"
          - "conditional cascade — every ControlledAccessGrant with status == SUSPENDED and status_reason == PROJECT_SUSPENDED is restored in created_at ASC order: it returns to ACTIVE when the capacity projection still fits, otherwise it transitions to REVOKED with status_reason CAPACITY_UNAVAILABLE"
          - "because grants returned to ACTIVE, recompute Project.active_grant_count and then Project.controlled_area_posture"
          - "recompute Project.activation_blockers"
        note: "Closes the clearance cycle. Grants suspended for INVESTIGATOR_RESTRICTED or OFFICER_ACTION are NOT restored."

      - from: CLEARED
        to: TERMINATED
        trigger: "POST /projects/{project_id}/security-status with to_status TERMINATED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "every ControlledAccessGrant with status IN {REQUESTED, ACTIVE, SUSPENDED} transitions to REVOKED with status_reason PROJECT_TERMINATED"
          - "because those grants left ACTIVE, recompute Project.active_grant_count then Project.controlled_area_posture"
          - "every Subaward with status != TERMINATED transitions to TERMINATED"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /projects/{project_id}/security-status with to_status TERMINATED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "same cascade as CLEARED → TERMINATED"

  - entity: ProjectPersonnel
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /project-personnel/{personnel_id}/status with to_status ACTIVE"
        actor: SystemAdmin | ResearchSecurityOfficer
        preconditions:
          - "Investigator.disclosure_posture != SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
          - "Project.award_status IN {PROPOSED, ACTIVATION_PENDING, ACTIVE} (else ERR_INVALID_PROJECT_TRANSITION)"
          - "If the investigator has a Disclosure with plan_status == PLAN_ACKNOWLEDGED and the clock is before its plan_expires_on, the investigator's total_commitment_pct after this activation must be <= plan_effort_cap_pct (else ERR_EFFORT_CAP_EXCEEDED)"
        side_effects:
          - "recompute Investigator.committed_effort_pct as the per-row rounded sum over ACTIVE rows, then total_commitment_pct and overcommitment_pct"
          - "because Investigator.committed_effort_pct changed, recompute Investigator.disclosure_posture"
          - "recompute Project.activation_blockers"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /project-personnel/{personnel_id}/status with to_status REMOVED"
        actor: SystemAdmin | ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "recompute Investigator.committed_effort_pct, total_commitment_pct and overcommitment_pct — the conserved quantity returns to its pre-activation value"
          - "every ControlledAccessGrant with this project_id and investigator_id and status IN {REQUESTED, ACTIVE, SUSPENDED} transitions to REVOKED with status_reason PERSONNEL_REMOVED"
          - "because those grants left ACTIVE, recompute Project.active_grant_count then Project.controlled_area_posture"
          - "recompute Project.activation_blockers"

      - from: PROPOSED
        to: REMOVED
        trigger: "POST /project-personnel/{personnel_id}/status with to_status REMOVED"
        actor: SystemAdmin | ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "no effort recompute — a PROPOSED row never contributed to committed_effort_pct"
          - "recompute Project.activation_blockers"

  - entity: DisclosureItem
    initial_state: DECLARED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DECLARED
        to: VERIFIED
        trigger: "POST /disclosure-items/{item_id}/status with to_status VERIFIED"
        actor: ResearchSecurityOfficer | ConflictReviewOfficial
        preconditions:
          - "Parent Disclosure.review_status IN {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_DISCLOSURE_TRANSITION)"
        side_effects:
          - "recompute Investigator.risk_score, then Investigator.disclosure_posture"

      - from: DECLARED
        to: DISPUTED
        trigger: "POST /disclosure-items/{item_id}/status with to_status DISPUTED"
        actor: ResearchSecurityOfficer | ConflictReviewOfficial
        preconditions:
          - "Parent Disclosure.review_status IN {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_DISCLOSURE_TRANSITION)"
        side_effects:
          - "the parent Disclosure can no longer be CERTIFIED while this item is DISPUTED"

      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /disclosure-items/{item_id}/status with to_status VERIFIED"
        actor: ConflictReviewOfficial
        preconditions: []
        side_effects:
          - "recompute Investigator.risk_score, then Investigator.disclosure_posture"

      - from: DECLARED
        to: WITHDRAWN
        trigger: "POST /disclosure-items/{item_id}/status with to_status WITHDRAWN"
        actor: Investigator
        preconditions:
          - "X-User-ID equals the parent Disclosure's investigator user_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Parent Disclosure.review_status IN {DRAFT, RETURNED_FOR_REVISION} (else ERR_INVALID_DISCLOSURE_TRANSITION)"
        side_effects:
          - "recompute the parent Disclosure.completeness_score"
          - "recompute Investigator.risk_score, then Investigator.disclosure_posture"

      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /disclosure-items/{item_id}/status with to_status WITHDRAWN"
        actor: ConflictReviewOfficial
        preconditions: []
        side_effects:
          - "recompute the parent Disclosure.completeness_score, then Investigator.risk_score and disclosure_posture"

  - entity: SupportStatement
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /support-statements/{statement_id}/reconcile when the run yields verdict CONSISTENT"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Investigator has at least one Disclosure with review_status == CERTIFIED (else ERR_NO_CERTIFIED_DISCLOSURE)"
        side_effects:
          - "store applied_variant, institutional_person_months, variance_person_months, omission_count and verdict from support_statement_reconciliation"
          - "recompute Investigator.disclosure_posture"

      - from: SUBMITTED
        to: INCONSISTENT
        trigger: "POST /support-statements/{statement_id}/reconcile when the run yields verdict MINOR_VARIANCE or MATERIAL_DISCREPANCY"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Investigator has at least one Disclosure with review_status == CERTIFIED (else ERR_NO_CERTIFIED_DISCLOSURE)"
        side_effects:
          - "store applied_variant, institutional_person_months, variance_person_months, omission_count and verdict"
          - "recompute Investigator.disclosure_posture — SUPPORT_INCONSISTENT can drive REVIEW_REQUIRED"
          - "recompute Project.activation_blockers for the statement's project — SUPPORT_INCONSISTENT enters the list"

      - from: INCONSISTENT
        to: RECONCILED
        trigger: "POST /support-statements/{statement_id}/reconcile after the underlying disclosures changed and the run now yields CONSISTENT"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "overwrite the stored reconciliation fields"
          - "recompute Investigator.disclosure_posture and Project.activation_blockers"
        note: "Re-runnable both directions — RECONCILED → INCONSISTENT is equally reachable, forming the cycle."

      - from: RECONCILED
        to: INCONSISTENT
        trigger: "POST /support-statements/{statement_id}/reconcile after new evidence makes the run yield a variance"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "overwrite the stored reconciliation fields"
          - "recompute Investigator.disclosure_posture and Project.activation_blockers"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, when a newer SupportStatement is created for the same investigator_id + project_id + agency_code"
        actor: system
        preconditions: []
        side_effects:
          - "the statement stops contributing to Investigator.material_discrepancy_count and to any activation blocker"

      - from: RECONCILED
        to: SUPERSEDED
        trigger: "system, when a newer SupportStatement is created for the same investigator_id + project_id + agency_code"
        actor: system
        preconditions: []
        side_effects:
          - "the statement stops contributing to Investigator.material_discrepancy_count and to any activation blocker"

      - from: INCONSISTENT
        to: SUPERSEDED
        trigger: "system, when a newer SupportStatement is created for the same investigator_id + project_id + agency_code"
        actor: system
        preconditions: []
        side_effects:
          - "the statement stops contributing to Investigator.material_discrepancy_count and to any activation blocker"
          - "recompute Project.activation_blockers — a SUPERSEDED statement no longer contributes SUPPORT_INCONSISTENT"

  - entity: TravelRegistration
    initial_state: DRAFT
    terminal_states: [DENIED, CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status SUBMITTED"
        actor: Investigator
        preconditions:
          - "X-User-ID equals the registration's investigator user_id (else ERR_NOT_RESOURCE_OWNER)"
          - "depart_on < return_on (else ERR_INVALID_TRAVEL_WINDOW)"
          - "No other TravelRegistration for the same investigator with status IN {SUBMITTED, APPROVED} satisfies depart_on <= x.return_on AND return_on >= x.depart_on (else ERR_TRAVEL_WINDOW_CONFLICT)"
        side_effects:
          - "recompute risk_flag_count, device_requirement_tier and briefing_required from travel_device_requirement"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status APPROVED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Investigator.disclosure_posture != SUSPENDED (else ERR_INVESTIGATOR_SUSPENDED)"
          - "If device_requirement_tier IN {LOANER_REQUIRED, LOANER_PLUS_ESCORT}, the investigator has a TrainingAssignment with course_code FOREIGN_TRAVEL_BRIEF and status COMPLETED (else ERR_TRAVEL_BRIEFING_REQUIRED)"
          - "If device_requirement_tier == LOANER_PLUS_ESCORT, the investigator has a Disclosure with plan_status == PLAN_ACKNOWLEDGED (else ERR_MANAGEMENT_PLAN_REQUIRED)"
        side_effects:
          - "device_decision_recorded_at is set to the current logical clock"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status DENIED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status CANCELLED"
        actor: Investigator
        preconditions:
          - "X-User-ID equals the registration's investigator user_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "the window is released, so a previously conflicting registration can now be SUBMITTED"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status CANCELLED"
        actor: Investigator | ResearchSecurityOfficer
        preconditions:
          - "current logical clock is strictly before depart_on (else ERR_TRAVEL_ALREADY_STARTED)"
        side_effects:
          - "the window is released for overlap checks"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status COMPLETED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "current logical clock is on or after return_on (else ERR_TRAVEL_NOT_ENDED)"
        side_effects:
          - "the window is released for overlap checks"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /travel-registrations/{registration_id}/status with to_status CANCELLED"
        actor: Investigator
        preconditions:
          - "X-User-ID equals the registration's investigator user_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

  - entity: ControlledAccessGrant
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status ACTIVE"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Project.security_status == CLEARED (else ERR_PROJECT_NOT_CLEARED)"
          - "The grant's investigator has an ACTIVE ProjectPersonnel row on the grant's project (else ERR_PERSONNEL_NOT_ACTIVE)"
          - "Investigator.disclosure_posture IN {CLEAR, REVIEW_REQUIRED} (else ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS)"
          - "The investigator has a TrainingAssignment with course_code CONTROLLED_AREA_SAFETY and status COMPLETED (else ERR_AREA_TRAINING_INCOMPLETE)"
          - "The capacity projection from controlled_area_capacity_projection does not exceed Project.controlled_area_capacity (else ERR_AREA_CAPACITY_EXCEEDED)"
        side_effects:
          - "activated_at is set to the current logical clock"
          - "Project.active_grant_count increments by 1"
          - "because Project.active_grant_count changed, recompute Project.controlled_area_posture"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status SUSPENDED, or system cascade from project suspension or investigator restriction"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "status_reason = OFFICER_ACTION for the officer call, PROJECT_SUSPENDED / INVESTIGATOR_RESTRICTED for the system cascades"
          - "Project.active_grant_count decrements by 1"
          - "because Project.active_grant_count changed, recompute Project.controlled_area_posture"

      - from: REQUESTED
        to: SUSPENDED
        trigger: "system cascade from project suspension or investigator restriction"
        actor: system
        preconditions: []
        side_effects:
          - "status_reason = PROJECT_SUSPENDED or INVESTIGATOR_RESTRICTED"
          - "Project.active_grant_count is unchanged — a REQUESTED grant was never counted"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status ACTIVE, or the conditional restore cascade on Project SUSPENDED → CLEARED"
        actor: ResearchSecurityOfficer | system
        preconditions:
          - "Project.security_status == CLEARED (else ERR_PROJECT_NOT_CLEARED)"
          - "Investigator.disclosure_posture IN {CLEAR, REVIEW_REQUIRED} (else ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS)"
          - "The capacity projection does not exceed Project.controlled_area_capacity (else ERR_AREA_CAPACITY_EXCEEDED for the officer call; the system restore sends the grant to REVOKED with status_reason CAPACITY_UNAVAILABLE instead of failing)"
        side_effects:
          - "status_reason is reset to NONE"
          - "Project.active_grant_count increments by 1, then recompute Project.controlled_area_posture"
        note: "Closes the suspension cycle — a grant may oscillate ACTIVE ⇄ SUSPENDED any number of times."

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status REVOKED, or system cascade (capacity unavailable on restore, personnel removal, project termination)"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "status_reason = OFFICER_ACTION, CAPACITY_UNAVAILABLE, PERSONNEL_REMOVED or PROJECT_TERMINATED"
          - "revoked_at is set to the current logical clock"
          - "Project.active_grant_count is unchanged — a SUSPENDED grant was already decremented"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status REVOKED, or system cascade from personnel removal or project termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "status_reason = OFFICER_ACTION, PERSONNEL_REMOVED or PROJECT_TERMINATED"
          - "revoked_at is set to the current logical clock"
          - "Project.active_grant_count decrements by 1, then recompute Project.controlled_area_posture"

      - from: REQUESTED
        to: REVOKED
        trigger: "POST /controlled-access-grants/{grant_id}/status with to_status REVOKED, or system cascade from personnel removal or project termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "status_reason = OFFICER_ACTION, PERSONNEL_REMOVED or PROJECT_TERMINATED"
          - "Project.active_grant_count is unchanged"

  # ---------------------------------------------------------------------------
  # BRANCHING with a join — SUBSTANTIATED forks into (agency notification) and
  # (remediation disclosure); CLOSED is the join and requires both legs.
  # ---------------------------------------------------------------------------
  - entity: SecurityIncident
    initial_state: REPORTED
    terminal_states: [CLOSED, UNSUBSTANTIATED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /security-incidents/{incident_id}/status with to_status INVESTIGATING and lead_investigator_user_id"
        actor: ResearchSecurityOfficer
        preconditions:
          - "lead_investigator_user_id is present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "lead_investigator_user_id is stored and locks the segregation-of-duties check on notification"

      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /security-incidents/{incident_id}/status with to_status SUBSTANTIATED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "X-User-ID equals the stored lead_investigator_user_id (else ERR_NOT_INCIDENT_LEAD)"
        side_effects:
          - "finding = SUBSTANTIATED; substantiated_at = current logical clock"
          - "severity_points, severity and notification_due_on are computed by incident_severity_and_deadline and frozen at this point"
          - "Project.open_incident_count is recomputed"
          - "because finding became SUBSTANTIATED, recompute Investigator.disclosure_posture (RESTRICTED, or SUSPENDED when severity == CRITICAL)"
          - "because Investigator.disclosure_posture left CLEAR/REVIEW_REQUIRED, every ControlledAccessGrant of that investigator with status IN {REQUESTED, ACTIVE} transitions to SUSPENDED with status_reason INVESTIGATOR_RESTRICTED"
          - "because those grants left ACTIVE, Project.active_grant_count is recomputed for every affected project, and then Project.controlled_area_posture is recomputed"
          - "when severity == CRITICAL, every Project with an ACTIVE ProjectPersonnel row for that investigator and security_status == CLEARED transitions to SUSPENDED with security_status_reason INCIDENT_NOTIFICATION"

      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /security-incidents/{incident_id}/status with to_status UNSUBSTANTIATED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "X-User-ID equals the stored lead_investigator_user_id (else ERR_NOT_INCIDENT_LEAD)"
        side_effects:
          - "finding = UNSUBSTANTIATED"
          - "Project.open_incident_count is recomputed"
          - "no posture change — an UNSUBSTANTIATED finding never restricts the investigator"

      - from: SUBSTANTIATED
        to: AGENCY_NOTIFIED
        trigger: "POST /security-incidents/{incident_id}/notify with agency_notified_on"
        actor: AgencyLiaison
        preconditions:
          - "X-User-ID differs from the stored lead_investigator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "agency_notified_on is on or after substantiated_at's date (else ERR_INVALID_NOTIFICATION_DATE)"
        side_effects:
          - "agency_notified_on is stored and notified_late is set to (agency_notified_on > notification_due_on)"
          - "because the incident reached AGENCY_NOTIFIED, recompute Investigator.disclosure_posture — it becomes SUSPENDED"
          - "because the investigator became SUSPENDED, every remaining ControlledAccessGrant of that investigator with status IN {REQUESTED, ACTIVE} transitions to SUSPENDED with status_reason INVESTIGATOR_RESTRICTED, and each affected Project.active_grant_count and controlled_area_posture are recomputed"

      - from: AGENCY_NOTIFIED
        to: CLOSED
        trigger: "POST /security-incidents/{incident_id}/status with to_status CLOSED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "The incident's remediation leg is complete — incident.disclosure_id is not null, Disclosure[incident.disclosure_id].review_status == CERTIFIED, and that disclosure carries at least one DisclosureItem with source == INCIDENT_REMEDIATION and status != WITHDRAWN (else ERR_REMEDIATION_INCOMPLETE)"
        side_effects:
          - "finding stays SUBSTANTIATED so the incident keeps contributing PRIOR_INCIDENT_SURCHARGE to later incidents"
          - "Project.open_incident_count is recomputed"
          - "recompute Investigator.disclosure_posture — it stays SUSPENDED because the AGENCY_NOTIFIED history is permanent"
        note: "Join point: both the notification branch and the remediation-disclosure branch must be complete."

      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /security-incidents/{incident_id}/status with to_status CLOSED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Always rejected with ERR_AGENCY_NOTIFICATION_REQUIRED — the notification branch has not completed"
        side_effects: []
        note: "Declared so the join is explicit: a substantiated incident cannot skip agency notification."

      - from: REPORTED
        to: UNSUBSTANTIATED
        trigger: "POST /security-incidents/{incident_id}/status with to_status UNSUBSTANTIATED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "finding = UNSUBSTANTIATED"
          - "Project.open_incident_count is recomputed"

  - entity: Subaward
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /subawards/{subaward_id}/screen when the run yields outcome CLEARED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "store applied_screening_variant, screening_designation, screening_matched_organization_id, screening_match_depth and screening_risk_points"
          - "recompute Project.activation_blockers"

      - from: PENDING
        to: FLAGGED
        trigger: "POST /subawards/{subaward_id}/screen when the run yields outcome FLAGGED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "store the screening result fields"
          - "recompute Project.activation_blockers"

      - from: PENDING
        to: BLOCKED
        trigger: "POST /subawards/{subaward_id}/screen when the run yields outcome BLOCKED"
        actor: ResearchSecurityOfficer
        preconditions: []
        side_effects:
          - "store the screening result fields"
          - "recompute Project.activation_blockers — SUBAWARD_BLOCKED enters the list"
          - "if Project.security_status == CLEARED it transitions to SUSPENDED with security_status_reason SUBAWARD_BLOCKED, which in turn suspends that project's REQUESTED/ACTIVE grants and recomputes active_grant_count and controlled_area_posture"

      - from: CLEARED
        to: BLOCKED
        trigger: "system cascade — a designation change makes the counterparty's effective_designation restricted"
        actor: system
        preconditions: []
        side_effects:
          - "same effects as PENDING → BLOCKED"

      - from: FLAGGED
        to: BLOCKED
        trigger: "system cascade — a designation change makes the counterparty's effective_designation restricted"
        actor: system
        preconditions: []
        side_effects:
          - "same effects as PENDING → BLOCKED"

      - from: FLAGGED
        to: MITIGATED
        trigger: "POST /subawards/{subaward_id}/status with to_status MITIGATED and mitigation_justification"
        actor: ResearchSecurityOfficer
        preconditions:
          - "screening_designation != SDN (else ERR_RESTRICTED_ENTITY_BLOCKED)"
          - "mitigation_justification is present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "recompute Project.activation_blockers"

      - from: BLOCKED
        to: MITIGATED
        trigger: "POST /subawards/{subaward_id}/status with to_status MITIGATED and mitigation_justification"
        actor: ResearchSecurityOfficer
        preconditions:
          - "screening_designation != SDN (else ERR_RESTRICTED_ENTITY_BLOCKED)"
          - "mitigation_justification is present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "recompute Project.activation_blockers — SUBAWARD_BLOCKED leaves the list"

      - from: CLEARED
        to: EXECUTED
        trigger: "POST /subawards/{subaward_id}/status with to_status EXECUTED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Project.security_status == CLEARED (else ERR_PROJECT_NOT_CLEARED)"
        side_effects:
          - "executed_at is set to the current logical clock"

      - from: MITIGATED
        to: EXECUTED
        trigger: "POST /subawards/{subaward_id}/status with to_status EXECUTED"
        actor: ResearchSecurityOfficer
        preconditions:
          - "Project.security_status == CLEARED (else ERR_PROJECT_NOT_CLEARED)"
        side_effects:
          - "executed_at is set to the current logical clock"

      - from: PENDING
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "recompute Project.activation_blockers"

      - from: BLOCKED
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "recompute Project.activation_blockers — SUBAWARD_BLOCKED leaves the list"

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "terminated_at is set to the current logical clock"

      - from: CLEARED
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "recompute Project.activation_blockers"

      - from: FLAGGED
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "recompute Project.activation_blockers"

      - from: MITIGATED
        to: TERMINATED
        trigger: "POST /subawards/{subaward_id}/status with to_status TERMINATED, or system cascade from project closure/withdrawal/termination"
        actor: ResearchSecurityOfficer | system
        preconditions: []
        side_effects:
          - "recompute Project.activation_blockers"

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: disclosure-create-stale-investigator
    parent_entity: Investigator
    write_endpoint: "POST /disclosures"
    occ_field: "expected_investigator_version"
    description: |
      Creating a Disclosure for an Investigator whose version has advanced since the
      client last read it is rejected with 412. A new disclosure for the same
      reporting_cycle legitimately supersedes the prior one, so the write cannot be
      rejected by any state precondition — the second sequential request observes an
      investigator that is still writable and would otherwise succeed while silently
      discarding a disclosure the client never saw. OCC on Investigator.version is the
      only signal that the client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: access-grant-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /controlled-access-grants"
    occ_field: "expected_project_version"
    description: |
      Creating a ControlledAccessGrant against a Project whose version has advanced
      since the client last read it is rejected with 412. Multiple REQUESTED grants on
      the same controlled area are legitimate, so a stale writer's grant would be
      accepted on state grounds alone even though the capacity picture it was sized
      against no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: organization-designate-stale-org
    parent_entity: ForeignOrganization
    write_endpoint: "POST /foreign-organizations/{organization_id}/designate"
    occ_field: "expected_organization_version"
    description: |
      Re-designating a ForeignOrganization whose version has advanced since the client
      last read it is rejected with 412. A designation write is an unconditional
      overwrite of own_designation, so the second sequential request sees a writable
      organization and would clobber a designation change the client never observed
      along with the whole subaward cascade that change produced.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: organization_effective_designation
    trigger: "On ForeignOrganization create, on POST /foreign-organizations/{organization_id}/designate, and on any ancestor's designation change"
    algorithm: constraint_propagation
    formula: |
      # Walks the parent_organization_id chain upward, stopping at the first hop that
      # is not a controlling interest. The strictest designation on the walked path wins.
      DESIGNATION_STRICTNESS = {
        NONE: 0, UNVERIFIED_END_USER: 1, ENTITY_LIST: 2,
        FOREIGN_MILITARY: 3, MALIGN_TALENT_PROGRAM: 4, SDN: 5
      }

      best_designation = org.own_designation
      best_depth       = 0
      visited          = {org.id}
      node             = org
      depth            = 0

      while node.parent_organization_id is not null:
          if node.parent_ownership_pct is null or node.parent_ownership_pct < CONTROL_THRESHOLD_PCT:
              break                       # chain of control is broken; stop walking
          parent = ForeignOrganization[node.parent_organization_id]
          if parent.id in visited:
              raise ERR_OWNERSHIP_CYCLE   # 422
          visited.add(parent.id)
          depth = depth + 1
          if depth > MAX_OWNERSHIP_DEPTH:
              raise ERR_OWNERSHIP_DEPTH_EXCEEDED   # 422
          if DESIGNATION_STRICTNESS[parent.own_designation] > DESIGNATION_STRICTNESS[best_designation]:
              best_designation = parent.own_designation
              best_depth       = depth
          # ties keep the nearer hop already recorded — strictly greater comparison above
          node = parent

      effective_designation       = best_designation
      effective_designation_depth = best_depth
    input_set: "The organization itself plus every ancestor reachable through an unbroken chain of parent_ownership_pct >= CONTROL_THRESHOLD_PCT hops. Ancestors beyond the first sub-threshold hop are excluded even if they are SDN."
    constants:
      CONTROL_THRESHOLD_PCT: 50          # inclusive: exactly 50.00 IS a controlling interest
      MAX_OWNERSHIP_DEPTH: 8
    precision: "parent_ownership_pct compared at 2 decimal places; 50.00 inherits, 49.99 does not"

  - name: subaward_screening_outcome
    trigger: "POST /subawards/{subaward_id}/screen"
    algorithm: threshold
    formula: |
      # `variant` is supplied by the caller and recorded in applied_screening_variant.
      DESIGNATION_STRICTNESS = {
        NONE: 0, UNVERIFIED_END_USER: 1, ENTITY_LIST: 2,
        FOREIGN_MILITARY: 3, MALIGN_TALENT_PROGRAM: 4, SDN: 5
      }
      org = ForeignOrganization[subaward.organization_id]

      if variant == "DIRECT_MATCH":
          designation = org.own_designation
          match_depth = 0
          matched_org = org.id
      else:                                        # OWNERSHIP_TRANSITIVE
          designation = org.effective_designation
          match_depth = org.effective_designation_depth
          matched_org = walk_ancestor_at(org, match_depth).id   # org itself when depth == 0

      strictness = DESIGNATION_STRICTNESS[designation]
      if strictness >= BLOCK_STRICTNESS:            # ENTITY_LIST and above
          outcome     = "BLOCKED"
          risk_points = BLOCK_BASE_POINTS + STRICTNESS_POINT_STEP * strictness
      elif strictness == 1:                         # UNVERIFIED_END_USER
          outcome     = "FLAGGED"
          risk_points = FLAG_POINTS
      else:
          outcome     = "CLEARED"
          risk_points = 0

      screening_designation             = designation
      screening_match_depth             = match_depth
      screening_matched_organization_id = matched_org
      screening_risk_points             = risk_points
    input_set: "Exactly one ForeignOrganization for DIRECT_MATCH; the organization plus its controlling ancestor chain for OWNERSHIP_TRANSITIVE."
    constants:
      BLOCK_STRICTNESS: 2
      BLOCK_BASE_POINTS: 40
      STRICTNESS_POINT_STEP: 10
      FLAG_POINTS: 20
    precision: "risk_points is an integer"
    variants:
      - name: DIRECT_MATCH
        when: "variant == DIRECT_MATCH — the screening only compares the named counterparty against the restricted-entity lists"
        difference: "Reads org.own_designation, always reports screening_match_depth 0, and never inspects ancestors. An organization whose own_designation is NONE always CLEARS with 0 risk points regardless of who owns it."
      - name: OWNERSHIP_TRANSITIVE
        when: "variant == OWNERSHIP_TRANSITIVE — the screening honors ownership imputation through controlling parents"
        difference: "Reads org.effective_designation and reports the hop distance in screening_match_depth. An organization with own_designation NONE owned 60% by an SDN parent yields BLOCKED with 90 risk points and match_depth 1, where DIRECT_MATCH yields CLEARED with 0 points and match_depth 0 for the identical data."

  - name: support_statement_reconciliation
    trigger: "POST /support-statements/{statement_id}/reconcile"
    algorithm: aggregation
    formula: |
      # Compares what the investigator declared on the agency's current-and-pending
      # support page against what the institution's own records imply.
      # `variant` is supplied by the caller and recorded in applied_variant.

      if variant == "STRICT_AGENCY":
          personnel_rows = [ p for p in ProjectPersonnel
                             if p.investigator_id == stmt.investigator_id
                             and p.status == "ACTIVE"
                             and Project[p.project_id].agency_code == stmt.agency_code ]
          candidate_disclosures = [ d for d in Disclosure
                                    if d.investigator_id == stmt.investigator_id
                                    and d.review_status == "CERTIFIED" ]
          # single newest certified disclosure only
          source_disclosures = first(sort(candidate_disclosures,
                                          by=[submitted_at DESC, created_at DESC]))
          counted_item_types = ["FOREIGN_APPOINTMENT"]
          outside_person_months = 0.00
      else:                                    # INSTITUTIONAL_ROLLUP
          personnel_rows = [ p for p in ProjectPersonnel
                             if p.investigator_id == stmt.investigator_id
                             and p.status == "ACTIVE" ]          # every agency
          source_disclosures = [ d for d in Disclosure
                                 if d.investigator_id == stmt.investigator_id
                                 and d.review_status not in ("DRAFT", "REJECTED") ]
          counted_item_types = ["FOREIGN_APPOINTMENT", "TALENT_PROGRAM", "VISITING_SCHOLAR"]
          outside_person_months = round(
              sum(item.annual_effort_hours for item in items_of(source_disclosures)
                  if item.item_type in counted_item_types and item.status != "WITHDRAWN")
              / OUTSIDE_HOURS_PER_PERSON_MONTH, 2)

      institutional_person_months = round(
          sum(p.committed_person_months for p in personnel_rows) + outside_person_months, 2)

      # An omission is a counted, non-WITHDRAWN disclosure item that the document's
      # own headcounts do not account for. Counted by bucket, never negative.
      actual_appointments = count(item for item in items_of(source_disclosures)
                                  if item.item_type in counted_item_types
                                  and item.item_type in ("FOREIGN_APPOINTMENT", "TALENT_PROGRAM", "VISITING_SCHOLAR")
                                  and item.status != "WITHDRAWN")
      actual_support      = count(item for item in items_of(source_disclosures)
                                  if item.item_type in ("OUTSIDE_SUPPORT", "IN_KIND_RESOURCE")
                                  and item.status != "WITHDRAWN") if variant == "INSTITUTIONAL_ROLLUP" else 0
      omission_count = max(0, actual_appointments - stmt.declared_appointment_count) \
                     + max(0, actual_support      - stmt.declared_support_count)

      variance_person_months = round(institutional_person_months - stmt.declared_person_months, 2)

      if omission_count >= 1 or abs(variance_person_months) >= MATERIAL_VARIANCE_PM:
          verdict = "MATERIAL_DISCREPANCY"
      elif abs(variance_person_months) >= MINOR_VARIANCE_PM:
          verdict = "MINOR_VARIANCE"
      else:
          verdict = "CONSISTENT"

      # verdict CONSISTENT drives status RECONCILED; the other two drive INCONSISTENT
    input_set: "ProjectPersonnel rows with status ACTIVE (agency-filtered under STRICT_AGENCY, all agencies under INSTITUTIONAL_ROLLUP) plus DisclosureItem rows with status != WITHDRAWN on the selected source disclosures."
    constants:
      OUTSIDE_HOURS_PER_PERSON_MONTH: 160
      MATERIAL_VARIANCE_PM: 1.00
      MINOR_VARIANCE_PM: 0.25
    precision: "2 decimal places, round_half_up; person_months summed unrounded then rounded once"
    variants:
      - name: STRICT_AGENCY
        when: "variant == STRICT_AGENCY — reconciling against a single sponsor's current-and-pending page"
        difference: "Counts only ACTIVE personnel rows whose Project.agency_code equals the statement's agency_code, draws items from the single newest CERTIFIED disclosure (submitted_at DESC, created_at DESC tie-break), counts only FOREIGN_APPOINTMENT item types, and never converts outside hours to person-months."
      - name: INSTITUTIONAL_ROLLUP
        when: "variant == INSTITUTIONAL_ROLLUP — reconciling against the institution's total-effort view for a biographical-sketch consistency check"
        difference: "Counts ACTIVE personnel rows on every agency, draws items from every disclosure that is not DRAFT or REJECTED, counts FOREIGN_APPOINTMENT, TALENT_PROGRAM and VISITING_SCHOLAR, and adds outside effort at 160 hours per person-month. For identical data this raises institutional_person_months and can flip the verdict from CONSISTENT to MATERIAL_DISCREPANCY."

  - name: investigator_risk_score
    trigger: "On DisclosureItem status change, on Disclosure certification, on SupportStatement reconcile, and on SecurityIncident status change"
    algorithm: weighted_scoring
    formula: |
      ITEM_POINTS = { FOREIGN_APPOINTMENT: 12, TALENT_PROGRAM: 30,
                      OUTSIDE_SUPPORT: 8, IN_KIND_RESOURCE: 6, VISITING_SCHOLAR: 10 }
      DESIGNATION_MULTIPLIER = { NONE: 1.0, UNVERIFIED_END_USER: 1.5, ENTITY_LIST: 2.0,
                                 FOREIGN_MILITARY: 2.5, MALIGN_TALENT_PROGRAM: 3.0, SDN: 3.0 }
      INCIDENT_POINTS = { LOW: 5, MODERATE: 12, HIGH: 25, CRITICAL: 40 }

      # Step 1 — per-item points. Each item is rounded to an integer BEFORE summing.
      item_subtotal = 0
      for item in DisclosureItem where item.status == "VERIFIED"
                  and Disclosure[item.disclosure_id].investigator_id == inv.id
                  and Disclosure[item.disclosure_id].review_status != "REJECTED":
          org  = ForeignOrganization[item.foreign_organization_id]
          base = ITEM_POINTS[item.item_type] * DESIGNATION_MULTIPLIER[org.effective_designation]
          if item.is_paid:
              base = base + PAID_SURCHARGE
          item_subtotal = item_subtotal + round_half_up(base, 0)     # integer per item
      item_subtotal = min(item_subtotal, ITEM_POINT_CAP)

      # Step 2 — incident points from substantiated findings only.
      incident_subtotal = sum(INCIDENT_POINTS[i.severity] for i in SecurityIncident
                              where i.investigator_id == inv.id and i.finding == "SUBSTANTIATED")

      # Step 3 — discrepancy points from live inconsistent statements.
      discrepancy_subtotal = DISCREPANCY_POINTS * count(s for s in SupportStatement
                              where s.investigator_id == inv.id and s.status == "INCONSISTENT")

      # Step 4 — mitigation credit for an acknowledged, unexpired management plan.
      credit = PLAN_CREDIT if exists(d in Disclosure where d.investigator_id == inv.id
                                     and d.plan_status == "PLAN_ACKNOWLEDGED"
                                     and clock_date < d.plan_expires_on) else 0

      subtotal   = item_subtotal + incident_subtotal + discrepancy_subtotal
      risk_score = max(0, min(100, subtotal - credit))
    input_set: "VERIFIED DisclosureItem rows on non-REJECTED disclosures, SecurityIncident rows with finding SUBSTANTIATED, SupportStatement rows with status INCONSISTENT, and Disclosure rows with plan_status PLAN_ACKNOWLEDGED."
    constants:
      PAID_SURCHARGE: 5
      ITEM_POINT_CAP: 60
      DISCREPANCY_POINTS: 15
      PLAN_CREDIT: 20
      SCORE_MIN: 0
      SCORE_MAX: 100
    precision: "Each item's contribution is rounded half-up to an integer BEFORE the sum; the cap is applied to the already-summed integer; the final clamp is applied last. Summing raw floats and rounding once at the end is wrong."

  - name: investigator_commitment_totals
    trigger: "On ProjectPersonnel activation or removal, and on DisclosureItem status change"
    algorithm: aggregation
    formula: |
      # Rounding happens per row / per item, then the already-rounded parts are summed.
      # The order is load-bearing and observable.
      committed_effort_pct = sum( round_half_up(p.committed_person_months / MONTHS_PER_YEAR * 100, 2)
                                  for p in ProjectPersonnel
                                  where p.investigator_id == inv.id and p.status == "ACTIVE" )

      outside_effort_pct   = sum( round_half_up(item.annual_effort_hours / ANNUAL_HOURS_BASE * 100, 2)
                                  for item in DisclosureItem
                                  where item.status == "VERIFIED"
                                  and Disclosure[item.disclosure_id].investigator_id == inv.id
                                  and Disclosure[item.disclosure_id].review_status != "REJECTED" )

      # Already-rounded components only; the sum itself is never re-rounded.
      total_commitment_pct = inv.institutional_base_effort_pct
                           + committed_effort_pct
                           + outside_effort_pct
      overcommitment_pct   = round_half_up(max(0, total_commitment_pct - FULL_COMMITMENT_PCT), 2)
    input_set: "The investigator's own institutional_base_effort_pct, ProjectPersonnel rows with status ACTIVE, and VERIFIED DisclosureItem rows on non-REJECTED disclosures."
    constants:
      MONTHS_PER_YEAR: 12
      ANNUAL_HOURS_BASE: 2080
      FULL_COMMITMENT_PCT: 100
    precision: |
      2 decimal places, round_half_up, applied PER ROW and PER ITEM before summation, and the
      sum of rounded parts is never re-rounded. Three ACTIVE rows of committed_person_months
      1.00 each give round(8.333.., 2) = 8.33 three times = 24.99, NOT
      round(3.00/12*100, 2) = 25.00. Three VERIFIED items of annual_effort_hours 100 each give
      round(4.8076.., 2) = 4.81 three times = 14.43, NOT round(300/2080*100, 2) = 14.42.

  - name: disclosure_completeness_score
    trigger: "On DisclosureItem create or status change, on POST /disclosures/{disclosure_id}/submit, and on every review action"
    algorithm: weighted_scoring
    formula: |
      # Three ordered steps. The tier is selected from the RAW score and the tier penalty
      # is applied once; the tier is never re-derived from the penalized score.
      # Step 1 — raw score.
      undisclosed_items = d.undisclosed_item_count   # items with source INCIDENT_REMEDIATION
      late_items        = d.late_item_count          # items created while d.revision_round >= 1
      raw = BASE_SCORE
            - UNDISCLOSED_PENALTY * undisclosed_items
            - LATE_ITEM_PENALTY   * late_items
            - REVISION_PENALTY    * d.revision_round
      raw = max(0, raw)

      # Step 2 — tier from the RAW score.
      TIER_PENALTY = { A: 0, B: 5, C: 12 }
      tier = "A" if raw >= TIER_A_FLOOR else ("B" if raw >= TIER_B_FLOOR else "C")

      # Step 3 — final score.
      completeness_score = max(0, raw - TIER_PENALTY[tier])
      completeness_tier  = tier
    input_set: "The disclosure's own undisclosed_item_count, late_item_count and revision_round — all three are maintained on the Disclosure row itself, so no item scan is needed at score time."
    constants:
      BASE_SCORE: 100
      UNDISCLOSED_PENALTY: 25
      LATE_ITEM_PENALTY: 8
      REVISION_PENALTY: 6
      TIER_A_FLOOR: 90
      TIER_B_FLOOR: 70
      MIN_CERTIFY_SCORE: 60
    precision: |
      Integers throughout. The step order is observable: 3 late items and 1 revision round give
      raw = 100 - 0 - 24 - 6 = 70, which selects tier B and yields final 65. Re-deriving the tier
      from 65 would give tier C and 58 — a value the API must never return. Because
      MIN_CERTIFY_SCORE is 60, an implementation that re-derives the tier also changes CERTIFY
      outcomes near the boundary.

  - name: investigator_disclosure_posture
    trigger: "Whenever risk_score, a SecurityIncident status/finding, a SupportStatement status, or a Disclosure plan_status changes for the investigator"
    algorithm: threshold
    formula: |
      # Evaluated top-down; the first matching clause wins and no later clause can soften it.
      if exists(i in SecurityIncident where i.investigator_id == inv.id
                and (i.status == "AGENCY_NOTIFIED"
                     or i.agency_notified_on is not null
                     or (i.finding == "SUBSTANTIATED" and i.severity == "CRITICAL"))):
          posture = "SUSPENDED"
      elif inv.substantiated_incident_count >= 1 or inv.risk_score >= RESTRICT_SCORE:
          posture = "RESTRICTED"
      elif inv.risk_score >= REVIEW_SCORE
           or inv.material_discrepancy_count >= 1
           or exists(d in Disclosure where d.investigator_id == inv.id
                     and d.plan_status == "PLAN_REQUIRED"):
          posture = "REVIEW_REQUIRED"
      else:
          posture = "CLEAR"
    input_set: "All SecurityIncident rows for the investigator (including CLOSED ones — an agency notification is permanent), the investigator's own risk_score, material_discrepancy_count and substantiated_incident_count, and all of the investigator's Disclosure rows."
    constants:
      RESTRICT_SCORE: 60
      REVIEW_SCORE: 30
    precision: "Integer comparisons, both thresholds inclusive: risk_score 60 is RESTRICTED, 59 is REVIEW_REQUIRED, 30 is REVIEW_REQUIRED, 29 is CLEAR."

  - name: training_assignment_status
    trigger: "On every read of a TrainingAssignment and on every rule that consults training compliance"
    algorithm: threshold
    formula: |
      # Evaluated against the logical clock at read time, in this exact order.
      if a.waived_on is not null:      status = "WAIVED"
      elif a.completed_on is not null: status = "COMPLETED"
      elif clock >= a.due_on:          status = "EXPIRED"
      else:                            status = "ASSIGNED"
    input_set: "The assignment's own waived_on, completed_on and due_on plus the current logical clock."
    constants:
      DEFAULT_CLOCK: "2026-08-01T00:00:00Z"
    precision: "The due_on comparison is inclusive: clock exactly equal to due_on is EXPIRED, one second earlier is ASSIGNED. A completion recorded before the clock reached due_on stays COMPLETED forever, because completed_on is checked before the deadline."

  - name: project_activation_blockers
    trigger: "On every change to the project's personnel, subawards, disclosures, support statements, training assignments or security_status; the stored list is returned by GET /projects/{project_id}"
    algorithm: aggregation
    formula: |
      # Blockers are emitted in the fixed BLOCKER_ORDER, never in discovery order.
      blockers = []
      if p.security_status != "CLEARED":
          blockers.append("SECURITY_NOT_CLEARED")
      if exists(pp in ProjectPersonnel where pp.project_id == p.id and pp.status == "ACTIVE"
                and not exists(d in Disclosure where d.investigator_id == pp.investigator_id
                               and d.review_status == "CERTIFIED")):
          blockers.append("DISCLOSURE_NOT_CERTIFIED")
      if exists(t in TrainingAssignment where t.required_for_project_id == p.id
                and status_of(t) in ("ASSIGNED", "EXPIRED")):
          blockers.append("TRAINING_INCOMPLETE")
      if exists(s in Subaward where s.project_id == p.id and s.status in ("PENDING", "FLAGGED", "BLOCKED")):
          blockers.append("SUBAWARD_BLOCKED")
      if exists(st in SupportStatement where st.project_id == p.id and st.status == "INCONSISTENT"):
          blockers.append("SUPPORT_INCONSISTENT")
      if not exists(pp in ProjectPersonnel where pp.project_id == p.id
                    and pp.role_on_project == "PI" and pp.status == "ACTIVE"):
          blockers.append("PERSONNEL_MISSING_PI")
      if exists(pp in ProjectPersonnel where pp.project_id == p.id and pp.status == "ACTIVE"
                and Investigator[pp.investigator_id].disclosure_posture == "SUSPENDED"):
          blockers.append("INVESTIGATOR_SUSPENDED")

      activation_blockers = sort(blockers, by=BLOCKER_ORDER)
      ready               = (len(activation_blockers) == 0)
      # ERR_ACTIVATION_BLOCKED's message names activation_blockers[0].
    input_set: "ProjectPersonnel rows with status ACTIVE, TrainingAssignment rows scoped to this project, Subaward rows on this project with status PENDING/FLAGGED/BLOCKED, SupportStatement rows on this project with status INCONSISTENT, and the project's own security_status."
    constants:
      BLOCKER_ORDER: [SECURITY_NOT_CLEARED, DISCLOSURE_NOT_CERTIFIED, TRAINING_INCOMPLETE, SUBAWARD_BLOCKED, SUPPORT_INCONSISTENT, PERSONNEL_MISSING_PI, INVESTIGATOR_SUSPENDED]
    precision: "Order is exactly BLOCKER_ORDER; no code appears twice even when several rows trigger it."

  - name: project_controlled_area_posture
    trigger: "On every change to the project's security_status or active_grant_count"
    algorithm: threshold
    formula: |
      if p.security_status in ("SUSPENDED", "TERMINATED"): posture = "LOCKED_DOWN"
      elif p.controlled_area_capacity == 0:                posture = "LOCKED_DOWN"
      elif p.active_grant_count >= p.controlled_area_capacity: posture = "RESTRICTED"
      else:                                               posture = "OPEN"
    input_set: "The project's own security_status, controlled_area_capacity and active_grant_count."
    constants: {}
    precision: "Integer comparison; active_grant_count exactly equal to controlled_area_capacity is RESTRICTED, not LOCKED_DOWN."

  - name: travel_device_requirement
    trigger: "On TravelRegistration create and on the DRAFT → SUBMITTED transition"
    algorithm: threshold
    formula: |
      DESIGNATION_STRICTNESS = { NONE: 0, UNVERIFIED_END_USER: 1, ENTITY_LIST: 2,
                                 FOREIGN_MILITARY: 3, MALIGN_TALENT_PROGRAM: 4, SDN: 5 }
      flags = 0
      if r.destination_country_code in HIGH_RISK_COUNTRIES:
          flags = flags + 1
      if r.host_organization_id is not null
         and DESIGNATION_STRICTNESS[ForeignOrganization[r.host_organization_id].effective_designation] >= HOST_STRICTNESS_FLOOR:
          flags = flags + 1
      if r.project_id is not null and Project[r.project_id].sensitivity_level in ("CONTROLLED", "RESTRICTED"):
          flags = flags + 1
      if Investigator[r.investigator_id].disclosure_posture in ("RESTRICTED", "SUSPENDED"):
          flags = flags + 1
      risk_flag_count = flags

      # Tier bands evaluated in this order; the no-device short-circuit comes first.
      if r.carries_institutional_device == false and flags == 0: tier = "NONE"
      elif flags <= 1:                                          tier = "STANDARD"
      elif flags <= 3:                                          tier = "LOANER_REQUIRED"
      else:                                                     tier = "LOANER_PLUS_ESCORT"

      device_requirement_tier = tier
      briefing_required       = tier in ("LOANER_REQUIRED", "LOANER_PLUS_ESCORT")
    input_set: "The registration's own destination_country_code, carries_institutional_device, host_organization_id and project_id, plus the host organization's effective_designation, the project's sensitivity_level and the investigator's disclosure_posture at evaluation time."
    constants:
      HIGH_RISK_COUNTRIES: ["CN", "RU", "IR", "KP"]
      HOST_STRICTNESS_FLOOR: 2
    precision: "risk_flag_count is an integer 0..4. Bands are inclusive on both ends: 1 flag is STANDARD, 2 and 3 are LOANER_REQUIRED, 4 is LOANER_PLUS_ESCORT. carries_institutional_device false only reaches tier NONE when flags is exactly 0."

  - name: incident_severity_and_deadline
    trigger: "On the INVESTIGATING → SUBSTANTIATED transition; the result is frozen at that moment"
    algorithm: weighted_scoring
    formula: |
      TYPE_POINTS = { UNDISCLOSED_APPOINTMENT: 20, UNDISCLOSED_TALENT_PROGRAM: 40,
                      UNREPORTED_TRAVEL: 15, RESTRICTED_ENTITY_COLLABORATION: 35,
                      DEVICE_COMPROMISE: 30 }
      NOTIFICATION_DAYS = { LOW: 60, MODERATE: 30, HIGH: 10, CRITICAL: 5 }

      points = TYPE_POINTS[i.incident_type]
      if i.project_id is not null and Project[i.project_id].award_status == "ACTIVE":
          points = points + ACTIVE_AWARD_SURCHARGE
      if i.project_id is not null and Project[i.project_id].sensitivity_level == "RESTRICTED":
          points = points + RESTRICTED_PROJECT_SURCHARGE
      prior = count(x in SecurityIncident where x.investigator_id == i.investigator_id
                    and x.id != i.id and x.finding == "SUBSTANTIATED")
      points = points + min(PRIOR_INCIDENT_SURCHARGE * prior, PRIOR_INCIDENT_CAP)

      severity_points = points
      severity = "LOW"      if points < MODERATE_FLOOR else \
                 "MODERATE" if points < HIGH_FLOOR     else \
                 "HIGH"     if points < CRITICAL_FLOOR else "CRITICAL"
      notification_due_on = substantiated_at + days(NOTIFICATION_DAYS[severity])
      # notified_late is set when the notification lands: agency_notified_on > notification_due_on
    input_set: "The incident's own incident_type and project_id, the linked project's award_status and sensitivity_level at substantiation time, and the investigator's other SecurityIncident rows with finding SUBSTANTIATED."
    constants:
      ACTIVE_AWARD_SURCHARGE: 15
      RESTRICTED_PROJECT_SURCHARGE: 10
      PRIOR_INCIDENT_SURCHARGE: 10
      PRIOR_INCIDENT_CAP: 20
      MODERATE_FLOOR: 20
      HIGH_FLOOR: 40
      CRITICAL_FLOOR: 60
    precision: |
      Integer points; band floors are inclusive so exactly 40 points is HIGH (10-day window) and
      39 is MODERATE (30-day window). Both severity_points and notification_due_on are frozen at
      the SUBSTANTIATED transition — later changes to the project's award_status or to the
      investigator's incident history never move an existing deadline. notification_due_on is
      compared by date; a notification landing exactly on notification_due_on is on time.

  - name: controlled_area_capacity_projection
    trigger: "On ControlledAccessGrant create (informational) and on every transition into ACTIVE (enforcing)"
    algorithm: interval_merge
    formula: |
      # Half-open windows: [valid_from, valid_until). Two grants that merely touch do not overlap.
      occupying = [ x for x in ControlledAccessGrant
                    if x.project_id == g.project_id
                    and x.id != g.id
                    and x.status in OCCUPYING_STATUSES
                    and x.valid_from < g.valid_until
                    and g.valid_from < x.valid_until ]

      # Sweep only the instants where occupancy can rise inside g's own window.
      candidate_instants = [g.valid_from] + sorted(
          [x.valid_from for x in occupying if g.valid_from < x.valid_from < g.valid_until])

      peak = 0
      for t in candidate_instants:
          live = 1 + count(x in occupying where x.valid_from <= t and t < x.valid_until)
          peak = max(peak, live)

      peak_concurrency_at_request = peak
      if peak > Project[g.project_id].controlled_area_capacity:
          raise ERR_AREA_CAPACITY_EXCEEDED      # 409
    input_set: "ControlledAccessGrant rows on the same project whose status is REQUESTED, ACTIVE or SUSPENDED and whose half-open window overlaps the candidate's. REVOKED grants never occupy capacity."
    constants:
      OCCUPYING_STATUSES: [REQUESTED, ACTIVE, SUSPENDED]
    precision: |
      Half-open interval semantics: a grant ending exactly when another begins does NOT overlap.
      The capacity check is exceeded only on strictly greater — peak equal to
      controlled_area_capacity is allowed, peak of capacity + 1 is rejected. The candidate grant
      itself counts as 1 at every swept instant. Sweeping only left endpoints is sufficient
      because occupancy can only increase at a window start.

  - name: travel_overlap_check
    trigger: "On the TravelRegistration DRAFT → SUBMITTED transition"
    algorithm: interval_merge
    formula: |
      # CLOSED windows: [depart_on, return_on]. Adjacency IS a conflict — the traveller
      # cannot return and depart on the same instant.
      conflict = exists(x in TravelRegistration
                        where x.investigator_id == r.investigator_id
                        and x.id != r.id
                        and x.status in BLOCKING_STATUSES
                        and r.depart_on <= x.return_on
                        and r.return_on >= x.depart_on)
      if conflict: raise ERR_TRAVEL_WINDOW_CONFLICT     # 409
    input_set: "TravelRegistration rows for the same investigator with status SUBMITTED or APPROVED. DRAFT, DENIED, CANCELLED and COMPLETED registrations release the window."
    constants:
      BLOCKING_STATUSES: [SUBMITTED, APPROVED]
    precision: |
      Closed-interval semantics, deliberately opposite to controlled_area_capacity_projection:
      a new trip departing exactly on an existing trip's return_on IS rejected, whereas a grant
      starting exactly on another grant's valid_until is accepted. The two rules must not share
      an implementation.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For Investigator-role calls on investigator-owned resources, X-User-ID equals the target Investigator.id (or the owner of the target Disclosure / DisclosureItem / TravelRegistration)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /disclosures, POST /disclosures/{disclosure_id}/items, POST /disclosures/{disclosure_id}/submit, POST /disclosures/{disclosure_id}/plan (ACKNOWLEDGE), POST /disclosure-items/{item_id}/status, POST /travel-registrations, POST /travel-registrations/{registration_id}/status"

  - priority: 4
    category: existence
    check: "Every path id resolves to an existing row, checked left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign-key field in the request body resolves to an existing row, checked in the order the fields are declared in the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input carries a *_id field"

  - priority: 6
    category: business_referential
    check: "Required fields present; enum values within their declared member set; numeric ranges honored (0 <= parent_ownership_pct <= 100, 0 < committed_person_months <= 12, 0 <= annual_effort_hours <= 2080, amount_cents > 0, controlled_area_capacity >= 0); limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2 (including terminal-state lockdown)"
    error_id: "ERR_INVALID_<ENTITY>_TRANSITION"
    http_status: 409
    applies_to: "every status/action endpoint"

  - priority: 8
    category: state
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /disclosures, POST /controlled-access-grants, POST /foreign-organizations/{organization_id}/designate"

  - priority: 9
    category: auth
    check: "Segregation of duties: the management-plan issuer's X-User-ID differs from Disclosure.reviewer_user_id, and the agency notifier's X-User-ID differs from SecurityIncident.lead_investigator_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disclosures/{disclosure_id}/plan (ISSUE, WAIVE), POST /security-incidents/{incident_id}/notify"

  - priority: 10
    category: auth
    check: "The officer acting on a SecurityIncident's SUBSTANTIATED or UNSUBSTANTIATED transition is the stored lead_investigator_user_id"
    error_id: ERR_NOT_INCIDENT_LEAD
    http_status: 403
    applies_to: "POST /security-incidents/{incident_id}/status"

  - priority: 11
    category: business_safety
    check: "Investigator.disclosure_posture permits the operation: SUSPENDED blocks personnel activation, travel approval, project clearance and area access; RESTRICTED additionally blocks area access"
    error_id: "ERR_INVESTIGATOR_SUSPENDED | ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS"
    http_status: 409
    applies_to: "POST /project-personnel/{personnel_id}/status, POST /travel-registrations/{registration_id}/status, POST /projects/{project_id}/security-status, POST /controlled-access-grants/{grant_id}/status"

  - priority: 12
    category: business_safety
    check: "Restricted-entity gate: a Subaward whose screening_designation is SDN can never be MITIGATED, and a project with a PENDING/FLAGGED/BLOCKED subaward cannot be CLEARED"
    error_id: "ERR_RESTRICTED_ENTITY_BLOCKED | ERR_SUBAWARD_SCREENING_OPEN"
    http_status: 409
    applies_to: "POST /subawards/{subaward_id}/status, POST /projects/{project_id}/security-status"

  - priority: 13
    category: business_safety
    check: "Training gate: CONTROLLED_AREA_SAFETY must be COMPLETED before a grant activates, FOREIGN_TRAVEL_BRIEF before a LOANER-tier trip is approved, and no project-scoped assignment may be ASSIGNED or EXPIRED at award activation"
    error_id: "ERR_AREA_TRAINING_INCOMPLETE | ERR_TRAVEL_BRIEFING_REQUIRED"
    http_status: 409
    applies_to: "POST /controlled-access-grants/{grant_id}/status, POST /travel-registrations/{registration_id}/status"

  - priority: 14
    category: business_safety
    check: "Management-plan gate: a LOANER_PLUS_ESCORT trip requires a PLAN_ACKNOWLEDGED disclosure, and CERTIFY requires plan_status in {NOT_REQUIRED, PLAN_WAIVED, PLAN_ACKNOWLEDGED}"
    error_id: "ERR_MANAGEMENT_PLAN_REQUIRED | ERR_PLAN_NOT_RESOLVED"
    http_status: 409
    applies_to: "POST /travel-registrations/{registration_id}/status, POST /disclosures/{disclosure_id}/review"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: Investigator.email is unique; a non-SUPERSEDED Disclosure is unique per (investigator_id, cycle_label); an unrevoked ControlledAccessGrant is unique per (project_id, investigator_id); a non-SUPERSEDED SupportStatement is unique per (investigator_id, project_id, agency_code, document_type)"
    error_id: "ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_DISCLOSURE_CYCLE | ERR_DUPLICATE_ACCESS_GRANT | ERR_DUPLICATE_SUPPORT_STATEMENT"
    http_status: 409
    applies_to: "POST /investigators, POST /disclosures, POST /controlled-access-grants, POST /support-statements"

  - priority: 16
    category: business_referential
    check: "Ownership graph sanity: the parent chain must not revisit a node and must not exceed MAX_OWNERSHIP_DEPTH hops"
    error_id: "ERR_OWNERSHIP_CYCLE | ERR_OWNERSHIP_DEPTH_EXCEEDED"
    http_status: 422
    applies_to: "POST /foreign-organizations, POST /foreign-organizations/{organization_id}/ownership"

  - priority: 17
    category: business_temporal
    check: "Interval sanity: Project.period_end > period_start; ControlledAccessGrant.valid_until > valid_from; TravelRegistration.return_on >= depart_on; plan_expires_on > plan_effective_from"
    error_id: "ERR_INVALID_PERIOD | ERR_INVALID_GRANT_WINDOW | ERR_INVALID_TRAVEL_WINDOW | ERR_INVALID_PLAN_WINDOW"
    http_status: 422
    applies_to: "POST /projects, POST /controlled-access-grants, POST /travel-registrations, POST /disclosures/{disclosure_id}/plan"

  - priority: 18
    category: business_temporal
    check: "Closed-interval travel overlap for the same investigator against SUBMITTED/APPROVED registrations; and a trip cannot be cancelled after departure or completed before return"
    error_id: "ERR_TRAVEL_WINDOW_CONFLICT | ERR_TRAVEL_ALREADY_STARTED | ERR_TRAVEL_NOT_ENDED"
    http_status: 409
    applies_to: "POST /travel-registrations/{registration_id}/status"

  - priority: 19
    category: business_constraint
    check: "Half-open controlled-area capacity projection: the peak concurrent occupancy over the grant's window must not exceed Project.controlled_area_capacity"
    error_id: ERR_AREA_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /controlled-access-grants/{grant_id}/status"

  - priority: 20
    category: business_fiscal
    check: "Effort ceilings and activation readiness: an acknowledged, unexpired management plan caps total_commitment_pct at plan_effort_cap_pct, and a project may only reach ACTIVE with an empty activation_blockers list"
    error_id: "ERR_EFFORT_CAP_EXCEEDED | ERR_ACTIVATION_BLOCKED"
    http_status: 409
    applies_to: "POST /project-personnel/{personnel_id}/status, POST /projects/{project_id}/award-status"

# =============================================================================
# §1.5 API Endpoint Table
# All read endpoints are shared by every role; writes are role-scoped.
# ALL_ROLES = [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
# =============================================================================
endpoints:

  # --- Investigator -----------------------------------------------------------
  - method: POST
    path: "/investigators"
    description: "Register an investigator. disclosure_posture starts at CLEAR and total_commitment_pct starts at institutional_base_effort_pct."
    roles: [SystemAdmin]
    code: 201
    input: [full_name, email, appointment_type, home_department, "institutional_base_effort_pct?"]
    output: Investigator
    side_effects: ["initializes committed_effort_pct 0, outside_effort_pct 0, risk_score 0 and disclosure_posture CLEAR"]

  - method: GET
    path: "/investigators/{investigator_id}"
    description: "Fetch one investigator with every computed commitment, risk and posture field."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: Investigator
    side_effects: []

  - method: GET
    path: "/investigators"
    description: "List investigators."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["appointment_type?", "disclosure_posture?", "limit?", "offset?"]
    output: Investigator[]
    side_effects: []

  # --- ForeignOrganization ----------------------------------------------------
  - method: POST
    path: "/foreign-organizations"
    description: "Register a foreign organization, optionally with an ownership parent. effective_designation is resolved at create time."
    roles: [SystemAdmin, ResearchSecurityOfficer]
    code: 201
    input: [legal_name, country_code, org_type, "parent_organization_id?", "parent_ownership_pct?", "own_designation?", "designated_on?"]
    output: ForeignOrganization
    side_effects: ["runs calculations.organization_effective_designation for the new row"]

  - method: GET
    path: "/foreign-organizations/{organization_id}"
    description: "Fetch one organization with effective_designation and effective_designation_depth."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: ForeignOrganization
    side_effects: []

  - method: GET
    path: "/foreign-organizations"
    description: "List organizations; parent_organization_id filters to one owner's direct holdings."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["country_code?", "own_designation?", "effective_designation?", "parent_organization_id?", "limit?", "offset?"]
    output: ForeignOrganization[]
    side_effects: []

  - method: GET
    path: "/foreign-organizations/{organization_id}/subsidiaries"
    description: "Direct children of this organization in the ownership graph."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["limit?", "offset?"]
    output: ForeignOrganization[]
    side_effects: []

  - method: POST
    path: "/foreign-organizations/{organization_id}/designate"
    description: "Attach or change the organization's own restricted-list designation. Guarded by concurrency_rules[organization-designate-stale-org]."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [own_designation, designated_on, expected_organization_version]
    output: ForeignOrganization
    side_effects:
      - "increments ForeignOrganization.version by 1"
      - "recomputes this organization's effective_designation"
      - "because effective_designation changed, recomputes effective_designation for every descendant reachable through >= 50% ownership hops"
      - "because descendant designations changed, every Subaward on an affected organization with status IN {CLEARED, FLAGGED} transitions to BLOCKED and its screening_designation, screening_matched_organization_id, screening_match_depth and screening_risk_points are re-derived under its stored applied_screening_variant"
      - "because subawards became BLOCKED, each affected Project with security_status CLEARED transitions to SUSPENDED with security_status_reason SUBAWARD_BLOCKED and its activation_blockers gains SUBAWARD_BLOCKED"
      - "because those projects were suspended, their REQUESTED/ACTIVE grants transition to SUSPENDED with status_reason PROJECT_SUSPENDED and active_grant_count plus controlled_area_posture are recomputed"

  - method: POST
    path: "/foreign-organizations/{organization_id}/ownership"
    description: "Set or replace the organization's ownership parent and stake; rejects a chain that revisits a node."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [parent_organization_id, parent_ownership_pct]
    output: ForeignOrganization
    side_effects:
      - "recomputes this organization's effective_designation and every descendant's effective_designation"
      - "cascades to Subaward screening state exactly as the designate endpoint does"

  # --- Project ---------------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Create a sponsored project. award_status starts PROPOSED, security_status starts PENDING_CLEARANCE."
    roles: [SystemAdmin]
    code: 201
    input: [title, agency_code, sensitivity_level, award_amount_cents, period_start, period_end, "controlled_area_capacity?"]
    output: Project
    side_effects: ["computes activation_blockers and controlled_area_posture for the new row"]

  - method: GET
    path: "/projects/{project_id}"
    description: "Fetch one project with activation_blockers, active_grant_count, controlled_area_posture and open_incident_count."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["agency_code?", "award_status?", "security_status?", "sensitivity_level?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/award-status"
    description: "Drive the funding dimension: ACTIVATION_PENDING, ACTIVE, CLOSED or WITHDRAWN."
    roles: [SystemAdmin]
    code: 200
    input: [to_status]
    output: Project
    side_effects:
      - "applies the award_status transition declared in §1.2 including its cascades to Subaward and ProjectPersonnel"
      - "recomputes activation_blockers"

  - method: POST
    path: "/projects/{project_id}/security-status"
    description: "Drive the security dimension: CLEARED, SUSPENDED or TERMINATED."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [to_status]
    output: Project
    side_effects:
      - "applies the security_status transition declared in §1.2 including the grant suspension cascade and the conditional restore on SUSPENDED → CLEARED"
      - "recomputes active_grant_count, controlled_area_posture and activation_blockers"

  # --- ProjectPersonnel ------------------------------------------------------
  - method: POST
    path: "/projects/{project_id}/personnel"
    description: "Add an investigator to a project's personnel roster in PROPOSED status."
    roles: [SystemAdmin]
    code: 201
    input: [investigator_id, role_on_project, committed_person_months]
    output: ProjectPersonnel
    side_effects: ["recomputes Project.activation_blockers — a PROPOSED row does not clear PERSONNEL_MISSING_PI"]

  - method: GET
    path: "/project-personnel/{personnel_id}"
    description: "Fetch one personnel row."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: ProjectPersonnel
    side_effects: []

  - method: GET
    path: "/project-personnel"
    description: "List personnel rows filtered by project or investigator."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["project_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: ProjectPersonnel[]
    side_effects: []

  - method: POST
    path: "/project-personnel/{personnel_id}/status"
    description: "Activate or remove a personnel row."
    roles: [SystemAdmin, ResearchSecurityOfficer]
    code: 200
    input: [to_status]
    output: ProjectPersonnel
    side_effects:
      - "recomputes Investigator.committed_effort_pct, total_commitment_pct and overcommitment_pct"
      - "because Investigator.committed_effort_pct changed, recomputes Investigator.disclosure_posture"
      - "on removal, revokes that investigator's grants on the project with status_reason PERSONNEL_REMOVED and recomputes Project.active_grant_count and controlled_area_posture"
      - "recomputes Project.activation_blockers"

  # --- Disclosure ------------------------------------------------------------
  - method: POST
    path: "/disclosures"
    description: "Open a disclosure in DRAFT. Guarded by concurrency_rules[disclosure-create-stale-investigator]."
    roles: [Investigator, ResearchSecurityOfficer]
    code: 201
    input: [investigator_id, cycle_label, disclosure_type, expected_investigator_version]
    output: Disclosure
    side_effects:
      - "increments Investigator.version by 1"
      - "review_status DRAFT, plan_status NOT_REQUIRED, revision_round 0, completeness_score 100, completeness_tier A"
      - "any prior Disclosure for the same investigator_id and cycle_label with review_status IN {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_REVISION} transitions to SUPERSEDED"

  - method: GET
    path: "/disclosures/{disclosure_id}"
    description: "Fetch one disclosure with review_status, plan_status, completeness_score and completeness_tier."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: Disclosure
    side_effects: []

  - method: GET
    path: "/disclosures"
    description: "List disclosures filtered by investigator or by either status dimension."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["investigator_id?", "review_status?", "plan_status?", "limit?", "offset?"]
    output: Disclosure[]
    side_effects: []

  - method: POST
    path: "/disclosures/{disclosure_id}/submit"
    description: "Move a DRAFT or RETURNED_FOR_REVISION disclosure to SUBMITTED."
    roles: [Investigator]
    code: 200
    input: []
    output: Disclosure
    side_effects:
      - "sets submitted_at to the current logical clock"
      - "recomputes completeness_score and completeness_tier"

  - method: POST
    path: "/disclosures/{disclosure_id}/review"
    description: "Officer review action: BEGIN_REVIEW, RETURN_FOR_REVISION, REQUIRE_PLAN, CERTIFY or REJECT."
    roles: [ResearchSecurityOfficer, ConflictReviewOfficial]
    code: 200
    input: [action, "review_note?"]
    output: Disclosure
    side_effects:
      - "BEGIN_REVIEW stores reviewer_user_id from X-User-ID on the first pass and never overwrites it"
      - "RETURN_FOR_REVISION increments revision_round and recomputes completeness_score and completeness_tier"
      - "REQUIRE_PLAN moves plan_status NOT_REQUIRED → PLAN_REQUIRED and recomputes Investigator.disclosure_posture"
      - "CERTIFY sets certified_at, recomputes Investigator.risk_score, disclosure_posture and commitment totals, and recomputes activation_blockers on every project where the investigator is ACTIVE personnel"

  - method: POST
    path: "/disclosures/{disclosure_id}/plan"
    description: "Management-plan action on the parallel plan_status dimension: ISSUE, ACKNOWLEDGE, WAIVE or TERMINATE."
    roles: [ConflictReviewOfficial, Investigator]
    code: 200
    input: [action, "plan_effort_cap_pct?", "plan_required_actions?", "plan_effective_from?", "plan_expires_on?"]
    output: Disclosure
    side_effects:
      - "ISSUE stores plan_approver_user_id from X-User-ID, which must differ from reviewer_user_id, plus the plan fields"
      - "ACKNOWLEDGE stores plan_acknowledged_at and recomputes Investigator.risk_score (PLAN_CREDIT applies) and disclosure_posture"
      - "WAIVE and TERMINATE recompute Investigator.disclosure_posture"

  # --- DisclosureItem --------------------------------------------------------
  - method: POST
    path: "/disclosures/{disclosure_id}/items"
    description: "Add a reportable relationship to a disclosure in DECLARED status. Permitted only while the parent Disclosure.review_status is DRAFT or RETURNED_FOR_REVISION (else ERR_INVALID_DISCLOSURE_TRANSITION). source defaults to SELF_REPORTED; INCIDENT_REMEDIATION marks an item added to remediate a SecurityIncident and counts toward undisclosed_item_count."
    roles: [Investigator, ResearchSecurityOfficer]
    code: 201
    input: [item_type, foreign_organization_id, start_date, "annual_effort_hours?", "compensation_usd_cents?", "in_kind_value_cents?", "end_date?", "is_paid?", "source?"]
    output: DisclosureItem
    side_effects:
      - "recomputes Disclosure.item_count, late_item_count, undisclosed_item_count, completeness_score and completeness_tier"
      - "computes DisclosureItem.item_risk_points"

  - method: GET
    path: "/disclosure-items/{item_id}"
    description: "Fetch one disclosure item."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: DisclosureItem
    side_effects: []

  - method: GET
    path: "/disclosure-items"
    description: "List disclosure items filtered by disclosure or by referenced organization."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["disclosure_id?", "foreign_organization_id?", "status?", "limit?", "offset?"]
    output: DisclosureItem[]
    side_effects: []

  - method: POST
    path: "/disclosure-items/{item_id}/status"
    description: "Verify, dispute or withdraw a disclosure item."
    roles: [ResearchSecurityOfficer, ConflictReviewOfficial, Investigator]
    code: 200
    input: [to_status]
    output: DisclosureItem
    side_effects:
      - "recomputes Disclosure.item_count, completeness_score and completeness_tier"
      - "because a VERIFIED item enters the scoring set, recomputes Investigator.risk_score, outside_effort_pct, total_commitment_pct and disclosure_posture"

  # --- SupportStatement ------------------------------------------------------
  - method: POST
    path: "/support-statements"
    description: "Record a current-and-pending support page or biographical sketch as SUBMITTED."
    roles: [Investigator, ResearchSecurityOfficer]
    code: 201
    input: [investigator_id, project_id, agency_code, document_type, declared_person_months, declared_appointment_count, declared_support_count]
    output: SupportStatement
    side_effects:
      - "any prior SupportStatement for the same investigator_id, project_id, agency_code and document_type with status IN {SUBMITTED, RECONCILED, INCONSISTENT} transitions to SUPERSEDED"
      - "recomputes Investigator.material_discrepancy_count, disclosure_posture and Project.activation_blockers"

  - method: GET
    path: "/support-statements/{statement_id}"
    description: "Fetch one support statement with its reconciliation verdict."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: SupportStatement
    side_effects: []

  - method: GET
    path: "/support-statements"
    description: "List support statements filtered by investigator or project."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["investigator_id?", "project_id?", "status?", "limit?", "offset?"]
    output: SupportStatement[]
    side_effects: []

  - method: POST
    path: "/support-statements/{statement_id}/reconcile"
    description: "Run the consistency check under the caller-selected variant STRICT_AGENCY or INSTITUTIONAL_ROLLUP."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [variant]
    output: SupportStatement
    side_effects:
      - "stores applied_variant, institutional_person_months, variance_person_months, omission_count and verdict"
      - "moves status to RECONCILED or INCONSISTENT per §1.2"
      - "recomputes Investigator.material_discrepancy_count, risk_score and disclosure_posture"
      - "recomputes Project.activation_blockers"

  # --- TravelRegistration ----------------------------------------------------
  - method: POST
    path: "/travel-registrations"
    description: "Register foreign travel in DRAFT. The device tier is projected at create time and re-projected at submission."
    roles: [Investigator, ResearchSecurityOfficer]
    code: 201
    input: [investigator_id, destination_country_code, depart_on, return_on, purpose, "project_id?", "host_organization_id?", "carries_institutional_device?"]
    output: TravelRegistration
    side_effects: ["computes risk_flag_count, device_requirement_tier and briefing_required"]

  - method: GET
    path: "/travel-registrations/{registration_id}"
    description: "Fetch one travel registration with its device requirement tier."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: TravelRegistration
    side_effects: []

  - method: GET
    path: "/travel-registrations"
    description: "List travel registrations filtered by investigator, project or foreign host."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["investigator_id?", "project_id?", "host_organization_id?", "status?", "limit?", "offset?"]
    output: TravelRegistration[]
    side_effects: []

  - method: POST
    path: "/travel-registrations/{registration_id}/status"
    description: "Submit, approve, deny, cancel or complete a travel registration."
    roles: [Investigator, ResearchSecurityOfficer]
    code: 200
    input: [to_status]
    output: TravelRegistration
    side_effects:
      - "on SUBMITTED, re-runs travel_device_requirement and enforces the closed-interval overlap check"
      - "on APPROVED, sets device_decision_recorded_at and enforces the briefing and management-plan gates"
      - "on CANCELLED or COMPLETED, releases the window for later overlap checks"

  # --- ControlledAccessGrant -------------------------------------------------
  - method: POST
    path: "/controlled-access-grants"
    description: "Request controlled research area access in REQUESTED status. Guarded by concurrency_rules[access-grant-create-stale-project]."
    roles: [ResearchSecurityOfficer]
    code: 201
    input: [project_id, investigator_id, valid_from, valid_until, expected_project_version]
    output: ControlledAccessGrant
    side_effects:
      - "increments Project.version by 1"
      - "stores peak_concurrency_at_request from the informational capacity projection without enforcing it"

  - method: GET
    path: "/controlled-access-grants/{grant_id}"
    description: "Fetch one access grant with status, status_reason and peak_concurrency_at_request."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: ControlledAccessGrant
    side_effects: []

  - method: GET
    path: "/controlled-access-grants"
    description: "List access grants filtered by project or investigator."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["project_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: ControlledAccessGrant[]
    side_effects: []

  - method: POST
    path: "/controlled-access-grants/{grant_id}/status"
    description: "Activate, suspend or revoke an access grant. Activation enforces posture, training and the half-open capacity projection."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [to_status]
    output: ControlledAccessGrant
    side_effects:
      - "on ACTIVE, sets activated_at, stores peak_concurrency_at_request, increments Project.active_grant_count and recomputes Project.controlled_area_posture"
      - "on SUSPENDED, decrements Project.active_grant_count when leaving ACTIVE and recomputes controlled_area_posture"
      - "on REVOKED, sets revoked_at and decrements Project.active_grant_count only when leaving ACTIVE"

  # --- SecurityIncident ------------------------------------------------------
  - method: POST
    path: "/security-incidents"
    description: "Open an incident in REPORTED status. severity_points and notification_due_on stay null until substantiation."
    roles: [ResearchSecurityOfficer]
    code: 201
    input: [investigator_id, incident_type, discovered_on, summary, "disclosure_id?", "project_id?"]
    output: SecurityIncident
    side_effects: ["recomputes Project.open_incident_count when project_id is set"]

  - method: GET
    path: "/security-incidents/{incident_id}"
    description: "Fetch one incident with finding, severity, notification_due_on and notified_late."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: SecurityIncident
    side_effects: []

  - method: GET
    path: "/security-incidents"
    description: "List incidents filtered by investigator, disclosure or project."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["investigator_id?", "disclosure_id?", "project_id?", "status?", "limit?", "offset?"]
    output: SecurityIncident[]
    side_effects: []

  - method: POST
    path: "/security-incidents/{incident_id}/status"
    description: "Drive the incident: INVESTIGATING (requires lead_investigator_user_id), SUBSTANTIATED, UNSUBSTANTIATED or CLOSED."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [to_status, "lead_investigator_user_id?"]
    output: SecurityIncident
    side_effects:
      - "on SUBSTANTIATED, freezes severity_points, severity and notification_due_on and runs the four-hop posture/grant/count cascade declared in §1.2"
      - "on UNSUBSTANTIATED, records finding UNSUBSTANTIATED and leaves posture untouched"
      - "on CLOSED, sets closed_at and recomputes Project.open_incident_count"

  - method: POST
    path: "/security-incidents/{incident_id}/notify"
    description: "Record the sponsor notification for a substantiated incident. The notifier may not be the stored lead."
    roles: [AgencyLiaison]
    code: 200
    input: [agency_notified_on, notification_reference]
    output: SecurityIncident
    side_effects:
      - "moves status SUBSTANTIATED → AGENCY_NOTIFIED and sets notified_late from the frozen notification_due_on"
      - "recomputes Investigator.disclosure_posture to SUSPENDED and suspends that investigator's remaining REQUESTED/ACTIVE grants with status_reason INVESTIGATOR_RESTRICTED"
      - "recomputes each affected Project.active_grant_count, controlled_area_posture and activation_blockers"

  # --- TrainingAssignment ----------------------------------------------------
  - method: POST
    path: "/training-assignments"
    description: "Assign a required course. required_for_project_id null makes it institution-wide; a project-scoped assignment blocks that project's activation until it is COMPLETED or WAIVED."
    roles: [SystemAdmin, ResearchSecurityOfficer]
    code: 201
    input: [investigator_id, course_code, due_on, "required_for_project_id?"]
    output: TrainingAssignment
    side_effects:
      - "sets assigned_on from the current logical clock; computed status is ASSIGNED while the clock is before due_on"
      - "recomputes Investigator.training_compliant and, for a project-scoped assignment, Project.activation_blockers"

  - method: GET
    path: "/training-assignments/{assignment_id}"
    description: "Fetch one training assignment; status is evaluated against the logical clock on every read."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: []

  - method: GET
    path: "/training-assignments"
    description: "List training assignments filtered by investigator, project scope or course."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["investigator_id?", "required_for_project_id?", "course_code?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: []

  - method: POST
    path: "/training-assignments/{assignment_id}/complete"
    description: "Record completion at the current logical clock. Completion after due_on is still recorded and the status becomes COMPLETED, because completed_on is checked before the deadline."
    roles: [Investigator, SystemAdmin]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects:
      - "sets completed_on from the current logical clock"
      - "recomputes Investigator.training_compliant and Project.activation_blockers for a project-scoped assignment"

  - method: POST
    path: "/training-assignments/{assignment_id}/waive"
    description: "Waive a required course. A waiver satisfies the same gates as a completion."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects:
      - "sets waived_on from the current logical clock"
      - "recomputes Investigator.training_compliant and Project.activation_blockers for a project-scoped assignment"

  # --- Subaward --------------------------------------------------------------
  - method: POST
    path: "/subawards"
    description: "Propose a subaward to a foreign organization in PENDING status; screening results stay null until the screen runs."
    roles: [ResearchSecurityOfficer]
    code: 201
    input: [project_id, organization_id, scope, amount_cents]
    output: Subaward
    side_effects: ["recomputes Project.activation_blockers — SUBAWARD_BLOCKED enters the list while the subaward is PENDING"]

  - method: GET
    path: "/subawards/{subaward_id}"
    description: "Fetch one subaward with its screening result fields."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: []
    output: Subaward
    side_effects: []

  - method: GET
    path: "/subawards"
    description: "List subawards filtered by project or counterparty organization."
    roles: [SystemAdmin, ResearchSecurityOfficer, ConflictReviewOfficial, AgencyLiaison, Investigator]
    code: 200
    input: ["project_id?", "organization_id?", "status?", "limit?", "offset?"]
    output: Subaward[]
    side_effects: []

  - method: POST
    path: "/subawards/{subaward_id}/screen"
    description: "Screen the counterparty against the restricted entity lists under the caller-selected variant DIRECT_MATCH or OWNERSHIP_TRANSITIVE."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [variant]
    output: Subaward
    side_effects:
      - "stores applied_screening_variant, screening_designation, screening_matched_organization_id, screening_match_depth and screening_risk_points"
      - "moves status to CLEARED, FLAGGED or BLOCKED per §1.2"
      - "on BLOCKED, suspends a CLEARED project with security_status_reason SUBAWARD_BLOCKED and cascades to that project's grants"
      - "recomputes Project.activation_blockers"

  - method: POST
    path: "/subawards/{subaward_id}/status"
    description: "Officer decision on a screened subaward: MITIGATED, EXECUTED or TERMINATED."
    roles: [ResearchSecurityOfficer]
    code: 200
    input: [to_status, "mitigation_justification?"]
    output: Subaward
    side_effects:
      - "MITIGATED requires mitigation_justification and is refused outright when screening_designation is SDN"
      - "EXECUTED sets executed_at; TERMINATED sets terminated_at"
      - "recomputes Project.activation_blockers"

  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the mandatory startup default — and never falls back to real wall-clock time. Every deadline, expiry and window rule in this scaffold is evaluated against this logical clock."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "all TrainingAssignment.status values are re-evaluated on their next read"
      - "no stored field changes; frozen values such as notification_due_on are untouched"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth -------------------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "X-User-Role is not one of the five declared roles, or is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Investigator-role caller acting on a disclosure, item or travel registration that belongs to a different investigator" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Management plan issued or waived by the disclosure's reviewer_user_id, or agency notification performed by the incident's lead_investigator_user_id" }
  - { id: ERR_NOT_INCIDENT_LEAD, http: 403, condition: "SUBSTANTIATED or UNSUBSTANTIATED transition attempted by an officer other than the stored lead_investigator_user_id" }

  # --- existence --------------------------------------------------------------
  - { id: ERR_INVESTIGATOR_NOT_FOUND, http: 404, condition: "investigator_id in the path or body does not resolve" }
  - { id: ERR_ORGANIZATION_NOT_FOUND, http: 404, condition: "organization_id, parent_organization_id, foreign_organization_id or host_organization_id does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project_id or required_for_project_id does not resolve" }
  - { id: ERR_PERSONNEL_NOT_FOUND, http: 404, condition: "personnel_id in the path does not resolve" }
  - { id: ERR_DISCLOSURE_NOT_FOUND, http: 404, condition: "disclosure_id in the path or body does not resolve" }
  - { id: ERR_DISCLOSURE_ITEM_NOT_FOUND, http: 404, condition: "item_id in the path does not resolve" }
  - { id: ERR_SUPPORT_STATEMENT_NOT_FOUND, http: 404, condition: "statement_id in the path does not resolve" }
  - { id: ERR_TRAVEL_REGISTRATION_NOT_FOUND, http: 404, condition: "registration_id in the path does not resolve" }
  - { id: ERR_ACCESS_GRANT_NOT_FOUND, http: 404, condition: "grant_id in the path does not resolve" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incident_id in the path does not resolve" }
  - { id: ERR_TRAINING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment_id in the path does not resolve" }
  - { id: ERR_SUBAWARD_NOT_FOUND, http: 404, condition: "subaward_id in the path does not resolve" }

  # --- request shape ----------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum member, out-of-range number, or pagination limit outside 1..100" }

  # --- state ------------------------------------------------------------------
  - { id: ERR_INVALID_DISCLOSURE_TRANSITION, http: 409, condition: "Requested review_status or plan_status transition is not declared from the disclosure's current state, including any transition out of CERTIFIED, REJECTED or SUPERSEDED" }
  - { id: ERR_INVALID_ITEM_TRANSITION, http: 409, condition: "Requested DisclosureItem status transition is not declared from its current status, including any transition out of WITHDRAWN" }
  - { id: ERR_INVALID_PROJECT_TRANSITION, http: 409, condition: "Requested award_status or security_status transition is not declared from the project's current state on that dimension" }
  - { id: ERR_INVALID_PERSONNEL_TRANSITION, http: 409, condition: "Requested ProjectPersonnel transition is not declared, including any transition out of REMOVED" }
  - { id: ERR_INVALID_STATEMENT_TRANSITION, http: 409, condition: "Reconcile attempted on a SUPERSEDED support statement" }
  - { id: ERR_INVALID_TRAVEL_TRANSITION, http: 409, condition: "Requested TravelRegistration transition is not declared from its current status, including any transition out of DENIED, CANCELLED or COMPLETED" }
  - { id: ERR_INVALID_GRANT_TRANSITION, http: 409, condition: "Requested ControlledAccessGrant transition is not declared, including any transition out of REVOKED" }
  - { id: ERR_INVALID_INCIDENT_TRANSITION, http: 409, condition: "Requested SecurityIncident transition is not declared from its current status, including any transition out of CLOSED or UNSUBSTANTIATED, and any notify call from a status other than SUBSTANTIATED" }
  - { id: ERR_INVALID_SUBAWARD_TRANSITION, http: 409, condition: "Requested Subaward transition is not declared from its current status, including MITIGATED from EXECUTED and any transition out of TERMINATED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_investigator_version, expected_project_version or expected_organization_version does not match the parent's current version" }

  # --- review / plan workflow -------------------------------------------------
  - { id: ERR_NOT_ASSIGNED_REVIEWER, http: 403, condition: "CERTIFY, REJECT or RETURN_FOR_REVISION attempted by an officer other than the stored reviewer_user_id" }
  - { id: ERR_COMPLETENESS_TOO_LOW, http: 409, condition: "CERTIFY attempted while completeness_score is below MIN_CERTIFY_SCORE (60)" }
  - { id: ERR_DISPUTED_ITEMS_OPEN, http: 409, condition: "CERTIFY attempted while at least one DisclosureItem on the disclosure is DISPUTED" }
  - { id: ERR_PLAN_NOT_RESOLVED, http: 409, condition: "CERTIFY attempted while plan_status is PLAN_REQUIRED, PLAN_ISSUED or PLAN_TERMINATED" }
  - { id: ERR_REJECT_TOO_EARLY, http: 409, condition: "REJECT attempted while revision_round is below 2" }
  - { id: ERR_MANAGEMENT_PLAN_REQUIRED, http: 409, condition: "LOANER_PLUS_ESCORT travel approval attempted without a PLAN_ACKNOWLEDGED disclosure for the traveller" }
  - { id: ERR_PLAN_NOT_WARRANTED, http: 409, condition: "REQUIRE_PLAN attempted when no conflict-of-commitment trigger is present, or WAIVE attempted while a trigger is still present" }
  - { id: ERR_INVALID_PLAN_WINDOW, http: 422, condition: "plan_expires_on is not strictly after plan_effective_from on a plan ISSUE" }

  # --- posture / safety -------------------------------------------------------
  - { id: ERR_INVESTIGATOR_SUSPENDED, http: 409, condition: "Personnel activation, travel approval or project clearance attempted for an investigator whose disclosure_posture is SUSPENDED" }
  - { id: ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS, http: 409, condition: "Access-grant activation attempted while the investigator's disclosure_posture is RESTRICTED or SUSPENDED" }
  - { id: ERR_PROJECT_NOT_CLEARED, http: 409, condition: "Access-grant activation or subaward execution attempted while the project's security_status is not CLEARED" }
  - { id: ERR_PERSONNEL_NOT_ACTIVE, http: 409, condition: "Access-grant activation attempted for an investigator with no ACTIVE ProjectPersonnel row on the grant's project" }
  - { id: ERR_RESTRICTED_ENTITY_BLOCKED, http: 409, condition: "MITIGATED attempted on a subaward whose screening_designation is SDN" }
  - { id: ERR_SUBAWARD_SCREENING_OPEN, http: 409, condition: "Project clearance attempted while a subaward on the project is PENDING, FLAGGED or BLOCKED" }
  - { id: ERR_OPEN_INCIDENTS, http: 409, condition: "Project closure or re-clearance attempted while the project has an incident in REPORTED, INVESTIGATING or SUBSTANTIATED" }
  - { id: ERR_ACCESS_GRANTS_OPEN, http: 409, condition: "Project closure attempted while a grant on the project is REQUESTED, ACTIVE or SUSPENDED" }
  - { id: ERR_AGENCY_NOTIFICATION_REQUIRED, http: 409, condition: "CLOSED attempted directly from SUBSTANTIATED without completing the agency-notification branch" }
  - { id: ERR_REMEDIATION_INCOMPLETE, http: 409, condition: "CLOSED attempted from AGENCY_NOTIFIED without a CERTIFIED disclosure carrying an INCIDENT_REMEDIATION item" }
  - { id: ERR_INVALID_NOTIFICATION_DATE, http: 422, condition: "agency_notified_on precedes the incident's substantiated_at date" }
  - { id: ERR_NO_CERTIFIED_DISCLOSURE, http: 409, condition: "Reconcile attempted for an investigator with no CERTIFIED disclosure" }
  - { id: ERR_PI_REQUIRED, http: 409, condition: "ACTIVATION_PENDING attempted with no ACTIVE PI on the roster" }

  # --- training ---------------------------------------------------------------
  - { id: ERR_AREA_TRAINING_INCOMPLETE, http: 409, condition: "Access-grant activation attempted without a COMPLETED or WAIVED CONTROLLED_AREA_SAFETY assignment for the investigator" }
  - { id: ERR_TRAVEL_BRIEFING_REQUIRED, http: 409, condition: "LOANER_REQUIRED or LOANER_PLUS_ESCORT travel approval attempted without a COMPLETED or WAIVED FOREIGN_TRAVEL_BRIEF assignment" }
  - { id: ERR_TRAINING_ALREADY_RESOLVED, http: 409, condition: "Completion or waiver attempted on an assignment that already has completed_on or waived_on set" }

  # --- uniqueness -------------------------------------------------------------
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Investigator email already registered" }
  - { id: ERR_DUPLICATE_DISCLOSURE_CYCLE, http: 409, condition: "A CERTIFIED or REJECTED disclosure already exists for the same investigator_id and cycle_label" }
  - { id: ERR_DUPLICATE_ACCESS_GRANT, http: 409, condition: "An unrevoked grant already exists for the same project_id and investigator_id" }
  - { id: ERR_DUPLICATE_SUPPORT_STATEMENT, http: 409, condition: "A live statement already exists for the same investigator_id, project_id, agency_code and document_type and the caller is not permitted to supersede it" }

  # --- graph / temporal / capacity / fiscal -----------------------------------
  - { id: ERR_OWNERSHIP_CYCLE, http: 422, condition: "The ownership chain revisits an organization already on the walked path" }
  - { id: ERR_OWNERSHIP_DEPTH_EXCEEDED, http: 422, condition: "The ownership chain exceeds MAX_OWNERSHIP_DEPTH (8) controlling hops" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "Project period_end is not strictly after period_start" }
  - { id: ERR_INVALID_GRANT_WINDOW, http: 422, condition: "Grant valid_until is not strictly after valid_from" }
  - { id: ERR_INVALID_TRAVEL_WINDOW, http: 422, condition: "Travel return_on precedes depart_on" }
  - { id: ERR_TRAVEL_WINDOW_CONFLICT, http: 409, condition: "The closed travel window touches or overlaps another SUBMITTED or APPROVED registration for the same investigator" }
  - { id: ERR_TRAVEL_ALREADY_STARTED, http: 409, condition: "Cancellation attempted on an APPROVED trip once the logical clock has reached depart_on" }
  - { id: ERR_TRAVEL_NOT_ENDED, http: 409, condition: "Completion attempted before the logical clock reaches return_on" }
  - { id: ERR_AREA_CAPACITY_EXCEEDED, http: 409, condition: "Peak projected concurrent holders over the grant's half-open window would exceed the project's controlled_area_capacity" }
  - { id: ERR_EFFORT_CAP_EXCEEDED, http: 409, condition: "Personnel activation would push total_commitment_pct above the acknowledged management plan's plan_effort_cap_pct" }
  - { id: ERR_ACTIVATION_BLOCKED, http: 409, condition: "ACTIVE attempted while activation_blockers is non-empty; the message names activation_blockers[0]" }

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Sponsored-programs administrator: registers investigators, projects and personnel and drives the funding dimension."
    identity: "opaque"
    exclusive_operations:
      - "POST /investigators"
      - "POST /projects"
      - "POST /projects/{project_id}/award-status"
      - "POST /projects/{project_id}/personnel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /foreign-organizations (with ResearchSecurityOfficer)"
      - "POST /project-personnel/{personnel_id}/status (with ResearchSecurityOfficer)"
      - "POST /training-assignments (with ResearchSecurityOfficer)"
      - "POST /training-assignments/{assignment_id}/complete (with Investigator)"
      - "all GET endpoints"

  - name: ResearchSecurityOfficer
    description: "Research security office: screens organizations and subawards, drives the security dimension, manages controlled-area access and opens incidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /foreign-organizations/{organization_id}/designate"
      - "POST /foreign-organizations/{organization_id}/ownership"
      - "POST /projects/{project_id}/security-status"
      - "POST /support-statements/{statement_id}/reconcile"
      - "POST /controlled-access-grants"
      - "POST /controlled-access-grants/{grant_id}/status"
      - "POST /security-incidents"
      - "POST /security-incidents/{incident_id}/status"
      - "POST /subawards"
      - "POST /subawards/{subaward_id}/screen"
      - "POST /subawards/{subaward_id}/status"
      - "POST /training-assignments/{assignment_id}/waive"
    shared_operations:
      - "POST /foreign-organizations (with SystemAdmin)"
      - "POST /project-personnel/{personnel_id}/status (with SystemAdmin)"
      - "POST /disclosures and POST /disclosures/{disclosure_id}/items (with Investigator)"
      - "POST /disclosures/{disclosure_id}/review (with ConflictReviewOfficial)"
      - "POST /disclosure-items/{item_id}/status (with ConflictReviewOfficial and Investigator)"
      - "POST /support-statements (with Investigator)"
      - "POST /travel-registrations and POST /travel-registrations/{registration_id}/status (with Investigator)"
      - "POST /training-assignments (with SystemAdmin)"
      - "all GET endpoints"

  - name: ConflictReviewOfficial
    description: "Conflict of commitment reviewer: adjudicates disclosure items and issues management plans. May not be the same user who took the disclosure under review."
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosures/{disclosure_id}/plan with action ISSUE, WAIVE or TERMINATE"
    shared_operations:
      - "POST /disclosures/{disclosure_id}/review (with ResearchSecurityOfficer)"
      - "POST /disclosure-items/{item_id}/status (with ResearchSecurityOfficer and Investigator)"
      - "all GET endpoints"

  - name: AgencyLiaison
    description: "Sponsor-facing liaison who transmits incident notifications. Deliberately holds no investigative authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /security-incidents/{incident_id}/notify"
    shared_operations:
      - "all GET endpoints"

  - name: Investigator
    description: "The disclosing researcher. X-User-ID is the Investigator.id, so ownership checks compare it directly to the resource's investigator_id."
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "POST /disclosures/{disclosure_id}/submit"
      - "POST /disclosures/{disclosure_id}/plan with action ACKNOWLEDGE"
    shared_operations:
      - "POST /disclosures and POST /disclosures/{disclosure_id}/items (with ResearchSecurityOfficer)"
      - "POST /disclosure-items/{item_id}/status limited to WITHDRAWN on own items"
      - "POST /support-statements (with ResearchSecurityOfficer)"
      - "POST /travel-registrations and POST /travel-registrations/{registration_id}/status (with ResearchSecurityOfficer)"
      - "POST /training-assignments/{assignment_id}/complete (with SystemAdmin)"
      - "all GET endpoints"

