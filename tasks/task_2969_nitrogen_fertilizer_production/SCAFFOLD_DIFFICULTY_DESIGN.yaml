            - "ProductionRun.${run_id}.unallocated_ammonia_tons == 5000.000"

      - name: turnaround_buffer_conflict_outranks_outage_window_too_short_on_approve
        grounds:
          - validations[priority=20]
          - validations[priority=23]
          - errors[ERR_TURNAROUND_BUFFER_CONFLICT]
          - errors[ERR_OUTAGE_WINDOW_TOO_SHORT]
          - calculations.turnaround_task_schedule
          - state_machines.Turnaround.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A third error-category pair — `business_temporal` at priority 20 against
          `business_constraint` at priority 23, both answering 409 — and the conflict is only
          reachable because a task may be appended to an already-SUBMITTED outage: TA-2's critical
          path grows from 7 to 21 days after submission, exceeding its 20-day window, while its
          window also sits only 9 days after APPROVED TA-1, so approval must answer
          ERR_TURNAROUND_BUFFER_CONFLICT and never ERR_OUTAGE_WINDOW_TOO_SHORT.
        test_recipe:
