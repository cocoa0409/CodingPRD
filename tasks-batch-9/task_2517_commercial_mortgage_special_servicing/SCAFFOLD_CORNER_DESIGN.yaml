              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 8.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id", plan_basis: "$.data.npv_basis" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 1000000 }, { period_index: 2, amount_usd: 1000000 }, { period_index: 3, amount_usd: 8000000 }], upfront_cost_usd: 100000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_mod_id: "$.data.id", alt_mod_npv_at_creation: "$.data.npv_usd", alt_mod_rank_at_creation: "$.data.rank" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "NOTE_SALE", projected_cash_flows: [{ period_index: 1, amount_usd: 8500000 }], upfront_cost_usd: 90000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_note_id: "$.data.id", alt_note_status_at_creation: "$.data.status" }
          trigger:
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
