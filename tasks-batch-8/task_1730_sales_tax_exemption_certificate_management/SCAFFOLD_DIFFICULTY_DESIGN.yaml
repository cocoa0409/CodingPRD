              payload: { code: "RES", description: "Resale", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "Cust 1", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /tenants/${tid}/customers/${cid}/certificates"
              payload: { ship_to_state: "CA", form_type: "RESALE", exemption_reason_code: "RES", state_registration_number: "", signed_date: "2026-01-01", effective_date: "2099-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { cert: $.data.id }
            - call: "POST /tenants/${tid}/certificates/${cert}/versions"
              payload: { file_uri: "s3://c.pdf", form_type: "RESALE", signed_date: "2026-01-01", effective_date: "2099-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
          trigger:
            - call: "POST /tenants/${tid}/certificates/${cert}/begin_review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_REVIEWER_IS_UPLOADER"
            - "HTTP status == 409"

      - name: order_submit_state_vs_referential_priority
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_ORDER_EMPTY]
        distinguishing_aspect: |
          state (priority 5, ERR_INVALID_STATE_TRANSITION) beats
          business_referential (priority 15, ERR_ORDER_EMPTY). When an order is
          already SUBMITTED (state wrong for /submit) AND has zero lines, the
          response MUST be ERR_INVALID_STATE_TRANSITION, not ERR_ORDER_EMPTY.
          Different category pair than instance 1 (state vs business_referential
          vs business_safety vs business_constraint).
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction, RESALE reason"
            - "Customer C1 onboarded, no certs (so order will go HELD_FOR_CERT)"
            - "Order O1 created and submitted once successfully (with a line, goes HELD_FOR_CERT). Then line list is irrelevant; the second /submit is the double-failure: state wrong AND would-be empty order."
            - "Alternative simpler setup: create order, submit, then attempt /submit again — but /submit on SUBMITTED violates state machine; to also violate ORDER_EMPTY, we need zero lines. We create a separate order O2 with zero lines, submit it -> ERR_ORDER_EMPTY. Then we attempt /submit on O2 in DRAFT state but with customer.onboarding_completed_at=null AND zero lines: priority 16 (ERR_ONBOARDING_INCOMPLETE) beats 15 (ERR_ORDER_EMPTY)."
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1 Inc", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
