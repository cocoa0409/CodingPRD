              as: ClientAcceptanceCommittee
              captures: { acc_dg: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_dg}/integrity-assessments"
              payload: { source_type: "LITIGATION", severity: "HIGH", score_impact: 20, assessed_on: "2025-10-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
          trigger:
            - call: "GET /audit/client-acceptances/${acc_dg}"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
