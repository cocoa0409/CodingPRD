            - call: "POST /api/licenses/${m_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /api/product-lines"
              payload: { license_id: "${m_lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { i_l1_id: $.data.id, i_line_v: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${i_l1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { i_s1_id: $.data.id, i_s1_v0: $.data.version }
            - call: "POST /api/card-sets/${i_s1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${i_s1_id}/approve"
              payload: { expected_card_set_version: "${i_s1_v0}" }
              as: ProductManager
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${i_l1_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${i_l1_id}", channel: "MASS", quantity_allocated: 15, effective_price_cents: 50000 }
              as: DistributionManager
            - call: "POST /api/card-sets/${i_s1_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 100000, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { i_qc_approved: $.data.id }
            - call: "POST /api/card-sets/${i_s1_id}/quality-claims"
              payload: { claim_type: "DAMAGE", severity: "MAJOR", affected_quantity: 500000, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { i_qc_filed: $.data.id }
            - call: "POST /api/card-sets/${i_s1_id}/quality-claims"
              payload: { claim_type: "MISSING_HIT", severity: "CRITICAL", affected_quantity: 900000, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { i_qc_denied: $.data.id }
            - call: "POST /api/quality-claims/${i_qc_approved}/open-review"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${i_qc_approved}/approve"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${i_qc_denied}/open-review"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${i_qc_denied}/deny"
              payload: {}
              as: QualityAnalyst
          trigger:
            - call: "POST /api/print-run-decisions"
              payload: { card_set_id: "${i_s1_id}", authority: "BRAND_DIRECTIVE", proposed_against_line_version: "${i_line_v}", demand_multiplier: 1.0, declared_quantity: 12000, announced: true, proposed_on: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { i_dec_id: $.data.id }
          assert:
            - "PrintRunDecision.${i_dec_id}.final_quantity == 12000, because BRAND_DIRECTIVE reads no claim data at all"
            - "CardSet.${i_s1_id}.quality_claim_count == 3, since the aggregate counts claims of every status"
            - "only the APPROVED claim raises the verifiable floor: verifiable_quantity is 100000 and not 1500000"
            - "QualityClaim.${i_qc_filed}.status == FILED and QualityClaim.${i_qc_denied}.status == DENIED"
            - "the FILED and DENIED claims contribute nothing to the floor"

      - name: print_run_projection_snaps_up_to_the_tier_quantum
        claim_type: Precision
        grounds:
          - calculations.print_run_projection
          - calculations.tier_snap_aggregate
          - entities.CardSet.fields.set_tier
