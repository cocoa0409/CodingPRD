  - rule_id: combinatorial_formula
    instances:
      - name: shared_savings_cap_corridor_nested_branches
        grounds:
          - calculations.shared_savings_and_loss
          - calculations.settlement_net
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — gross 700,000
          against benchmark 1,800,000 yields rate 3888 bp (>= MSR 200), then
          nested min() binds the savings cap: min(round(700,000 x 5000/10000)
          = 350,000, round(1,800,000 x 1000/10000) = 180,000) = 180,000, and
          the TWO_SIDED loss branch stays inert (shared_losses 0). The cap,
          not the rate share, decides the payable amount.
        test_recipe:
          setup:
            - "Canonical year: M1 (12 mm, PR1) and M2 (6 mm, PR2), benchmark 1,800,000; PAID claims 400,000 (M1) + 700,000 (M2); quality composite 30 (HBA1C 350/1000, MAMMO 50/1000, both LOCKED)"
            - "Year advanced to RECONCILING (clock 2027-01-05)"
          setup_api_calls:
            - { call: "POST /vbc/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PayerAdmin }
            - { call: "POST /vbc/programs", payload: { program_name: "MA Value", line_of_business: MEDICARE_ADVANTAGE }, as: PayerAdmin, captures: { pg: $.data.id } }
            - { call: "POST /vbc/programs/${pg}/activate", payload: {}, as: PayerAdmin }
            - { call: "POST /vbc/practice-groups", payload: { group_name: "G1", tin: "100000001" }, as: PayerAdmin, captures: { g1: $.data.id } }
            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR1", npi: "2000000001" }, as: PayerAdmin, captures: { pr1: $.data.id } }
            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR2", npi: "2000000002" }, as: PayerAdmin, captures: { pr2: $.data.id } }
            - { call: "POST /vbc/contracts", payload: { program_id: "${pg}", practice_group_id: "${g1}", contract_ref: "C-1", effective_start: "2026-01-01", effective_end: "2027-01-01", risk_track: TWO_SIDED, risk_model: PROSPECTIVE, benchmark_pmpm_cents: 100000, shared_savings_rate_bp: 5000, shared_loss_rate_bp: 4000, min_savings_rate_bp: 200, min_loss_rate_bp: 200, savings_cap_bp: 1000, loss_cap_bp: 800, stop_loss_cents: 2000000, withhold_rate_bp: 500, quality_gate_floor_points: 30, quality_gate_excellence_points: 80, estimate_method: ANNUALIZATION, quality_measures: [ { measure_code: HBA1C, weight_bp: 9000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] }, { measure_code: MAMMO, weight_bp: 1000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] } ] }, as: ContractManager, captures: { c1: $.data.id } }
            - { call: "POST /vbc/contracts/${c1}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vbc/performance-years", payload: { contract_id: "${c1}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { y1: $.data.id } }
            - { call: "POST /vbc/performance-years/${y1}/open-attribution", payload: {}, as: PayerAdmin }
