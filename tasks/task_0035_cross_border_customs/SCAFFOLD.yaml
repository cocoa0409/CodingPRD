# =============================================================================
# Cross-Border E-commerce Customs Clearance — Scaffold (v1)
# =============================================================================

scenario: |
  Cross-Border E-commerce Customs Clearance System: commodity classification with HS code library,
  classification rule engine, classification suggestion based on product description, manual override
  review, and multi-country code mapping; customs declaration generation with order data aggregation,
  declaration form by mode (B2C direct mail/bonded warehouse/general trade), required-field
  completeness check, multi-country form template, and amendment handling; tariff calculation with
  dutiable value determination (transaction value/deductive value/computed value), tariff rate
  retrieval by HS code and origin country, exchange rate lookup with effective date, tax composition
  (tariff/VAT/consumption tax), and personal-postal-tax mode; customs review with electronic
  submission, customs-side query and supplementary-document request, manual inspection scheduling,
  query-response workflow, and rejection-and-rework handling; tax payment with payment notice
  generation, multi-channel payment (bank transfer/electronic payment/guarantee deduction), payment
  voucher upload, and payment status tracking; release with release notice receipt, conditional
  release handling, post-release amendment, and goods pickup coordination; tax refund application
  with refund-eligibility identification (return/cancellation/erroneous declaration), supporting
  document preparation, refund declaration submission, refund-amount calculation, and refund
  execution tracking; event-driven synchronization with customs single window, payment, logistics,
  and ERP systems; audit logging for declaration changes and tax records.

domain_name: cross-border-customs
api_prefix: /declarations

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - idempotency

  entity_topology: hybrid
  # Declaration → DeclarationLine is hierarchical;
  # HsCode, ExchangeRate, Order, Payment, Refund, AuditEvent are peer entities with FK references.

  state_machine_shape: cyclic
  # Declaration has revision loops (QUERIED → REVISED → SUBMITTED → UNDER_REVIEW)
  # and branching (APPROVED → RELEASED vs APPROVED → CONDITIONALLY_RELEASED → RELEASED).
  # Refund has branching (SUBMITTED → APPROVED/REJECTED).
  # Payment has compensating reverse path.

  relationship_patterns:
    - one_to_many       # Declaration → DeclarationLine; Declaration → AuditEvent
    - cross_aggregate   # DeclarationLine.hs_code_id → HsCode; Declaration.order_id → Order

  role_model: peer_roles
  # Declarant owns declarations, CustomsOfficer reviews, FinanceOfficer handles payments/refunds,
  # Importer (entity-backed) approves/picks up goods, System emits external events.

  consistency_model: immediate
  # All calculations and state changes are atomic in single requests; no eventual consistency.

# =============================================================================
# Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HsCode
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "10-digit HS classification code (e.g., '6109100020')", constraints: "exactly 10 digits, unique" }
      - { name: description, type: string, source: input, description: "Plain-language commodity description" }
      - { name: keywords, type: array, source: input, description: "Array of lowercase keywords used by classification suggestion engine" }
      - { name: country_code_map, type: object, source: input, description: "Map of destination country ISO-3166 alpha-2 code to local equivalent code (e.g., {\"US\":\"6109.10.0040\",\"EU\":\"61091000\"})" }
      - { name: tariff_rate_bps, type: integer, source: input, description: "Default ad-valorem tariff rate in basis points (1 bps = 0.01%); overridden per origin in TariffRule" }
      - { name: vat_rate_bps, type: integer, source: input, description: "VAT rate in basis points applied to (dutiable_value + tariff)" }
      - { name: consumption_tax_rate_bps, type: integer, source: input, default: 0, description: "Consumption tax rate in basis points; 0 for non-luxury goods" }
      - { name: postal_tax_rate_bps, type: integer, source: input, description: "Personal postal tax rate in basis points used for B2C direct-mail mode" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEPRECATED — DEPRECATED codes can be referenced by historical declarations but reject new classifications", constraints: "ACTIVE, DEPRECATED" }

  - name: TariffRule
    parent: null
    common_fields: false
    fields:
      - { name: hs_code_id, type: string, source: input, description: "FK to HsCode.id" }
      - { name: origin_country, type: string, source: input, description: "ISO-3166 alpha-2 origin country code (e.g., 'CN', 'US')" }
      - { name: destination_country, type: string, source: input, description: "ISO-3166 alpha-2 destination country code" }
      - { name: tariff_rate_bps, type: integer, source: input, description: "Origin-specific override rate in basis points; takes precedence over HsCode.tariff_rate_bps" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC; rule applies when declaration_submitted_at >= effective_from" }
      - { name: effective_to, type: datetime, source: input, description: "ISO 8601 UTC; rule applies when declaration_submitted_at < effective_to. Null = open-ended" }

  - name: ExchangeRate
    parent: null
    common_fields: false
    fields:
      - { name: from_currency, type: string, source: input, description: "Source currency ISO 4217 (e.g., 'USD')" }
      - { name: to_currency, type: string, source: input, description: "Target currency ISO 4217 (e.g., 'CNY')" }
      - { name: rate_micros, type: integer, source: input, description: "Rate expressed as integer micros (1 rate-unit = 1,000,000 micros) — avoids floating-point drift" }
      - { name: effective_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); rate applies to declarations whose effective_date_used == this date" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: external_order_ref, type: string, source: input, description: "Merchant-assigned order ID, unique per importer", constraints: "unique scoped to importer_id" }
      - { name: importer_id, type: string, source: input, description: "FK to Importer entity" }
      - { name: declarant_id, type: string, source: input, description: "FK to Declarant entity (the cross-border platform agent filing on behalf)" }
      - { name: trade_mode, type: enum, source: input, description: "B2C_DIRECT_MAIL | BONDED_WAREHOUSE | GENERAL_TRADE — drives template selection and tax mode", constraints: "B2C_DIRECT_MAIL, BONDED_WAREHOUSE, GENERAL_TRADE" }
      - { name: origin_country, type: string, source: input, description: "ISO-3166 alpha-2 origin country" }
      - { name: destination_country, type: string, source: input, description: "ISO-3166 alpha-2 destination country" }
      - { name: currency, type: string, source: input, description: "Order currency ISO 4217" }
      - { name: line_items, type: array, source: input, description: "Array of {product_description, quantity, unit_price, weight_kg, hs_code_hint?}; product_description feeds the suggestion engine" }
      - { name: total_value_minor, type: integer, source: input, description: "Sum of line items' (quantity * unit_price) expressed in currency minor units (e.g., cents)" }
      - { name: status, type: enum, source: system, default: "PENDING_DECLARATION", description: "PENDING_DECLARATION | DECLARED | RELEASED | CANCELLED | RETURNED — drives refund eligibility", constraints: "PENDING_DECLARATION, DECLARED, RELEASED, CANCELLED, RETURNED" }

  - name: Declaration
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK to Order; one Declaration per Order in non-terminal state" }
      - { name: declarant_id, type: string, source: system, description: "Copied from Order at creation time; pins ownership for RBAC" }
      - { name: trade_mode, type: enum, source: system, description: "Copied from Order; selects form template", constraints: "B2C_DIRECT_MAIL, BONDED_WAREHOUSE, GENERAL_TRADE" }
      - { name: destination_country, type: string, source: system, description: "Copied from Order" }
      - { name: dutiable_value_method, type: enum, source: input, description: "TRANSACTION_VALUE | DEDUCTIVE_VALUE | COMPUTED_VALUE — selected at submission, drives the variant calc", constraints: "TRANSACTION_VALUE, DEDUCTIVE_VALUE, COMPUTED_VALUE" }
      - { name: dutiable_value_cny_minor, type: integer, source: computed, description: "Computed dutiable value in CNY fen (minor units); recomputed on every submit/revise" }
      - { name: tariff_amount_cny_minor, type: integer, source: computed, description: "Computed tariff in CNY fen" }
      - { name: vat_amount_cny_minor, type: integer, source: computed, description: "Computed VAT in CNY fen" }
      - { name: consumption_tax_cny_minor, type: integer, source: computed, description: "Computed consumption tax in CNY fen" }
      - { name: total_tax_cny_minor, type: integer, source: computed, description: "Sum of tariff + VAT + consumption_tax (or postal-tax substitute) in CNY fen" }
      - { name: tax_mode, type: enum, source: computed, description: "STANDARD | PERSONAL_POSTAL — STANDARD applies tariff+VAT+consumption-tax; PERSONAL_POSTAL applies single postal-tax rate (B2C only, value <= 5000 CNY threshold)", constraints: "STANDARD, PERSONAL_POSTAL" }
      - { name: exchange_rate_date_used, type: string, source: computed, description: "YYYY-MM-DD date of ExchangeRate row used (the latest with effective_date <= submission_date)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | UNDER_REVIEW | QUERIED | REVISED | APPROVED | CONDITIONALLY_RELEASED | RELEASED | REJECTED | AMENDED — see state machine", constraints: "DRAFT, SUBMITTED, UNDER_REVIEW, QUERIED, REVISED, APPROVED, CONDITIONALLY_RELEASED, RELEASED, REJECTED, AMENDED" }
      - { name: submission_count, type: integer, source: system, default: 0, description: "Number of times this declaration was submitted (incremented on every DRAFT/REVISED → SUBMITTED transition); enforces rejection-rework limit" }
      - { name: query_id, type: string, source: system, description: "Active Query.id when status==QUERIED; null otherwise" }
      - { name: rejection_reason, type: string, source: system, description: "Set when status transitions to REJECTED" }
      - { name: release_condition, type: string, source: system, description: "Set when status==CONDITIONALLY_RELEASED (e.g., 'guarantee_deposit_required')" }
      - { name: pickup_coordinated_at, type: datetime, source: system, description: "ISO 8601 UTC; set when goods-pickup webhook fires after RELEASED" }

  - name: DeclarationLine
    parent: Declaration
    common_fields: false
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK to Declaration" }
      - { name: order_line_index, type: integer, source: input, description: "Index into Order.line_items[]" }
      - { name: hs_code_id, type: string, source: input, description: "FK to HsCode (must be ACTIVE at submission time)" }
      - { name: classification_source, type: enum, source: system, description: "AUTO_SUGGESTED | MANUAL_OVERRIDE | RULE_ENGINE — pinned when line is added", constraints: "AUTO_SUGGESTED, MANUAL_OVERRIDE, RULE_ENGINE" }
      - { name: override_review_status, type: enum, source: system, default: "NOT_APPLICABLE", description: "NOT_APPLICABLE (auto/rule) | PENDING (manual override awaiting review) | APPROVED | REJECTED. Declaration cannot move to SUBMITTED while any line is PENDING.", constraints: "NOT_APPLICABLE, PENDING, APPROVED, REJECTED" }
      - { name: declared_value_minor, type: integer, source: computed, description: "Per-line value in order currency minor units = quantity * unit_price (from order line)" }
      - { name: line_dutiable_value_cny_minor, type: integer, source: computed, description: "Dutiable value contribution of this line in CNY fen, after applying the chosen dutiable_value_method" }

  - name: Query
    parent: Declaration
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK to Declaration" }
      - { name: question, type: string, source: input, description: "Customs officer's question prompting supplementary documents" }
      - { name: required_documents, type: array, source: input, description: "Array of document type codes expected in response (e.g., ['INVOICE','COA'])" }
      - { name: response_text, type: string, source: input, description: "Declarant's text response; null until response submitted" }
      - { name: response_documents, type: array, source: input, description: "Array of {doc_type, voucher_url} submitted by declarant" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESPONDED | RESOLVED — RESPONDED set on declarant reply; RESOLVED set when officer accepts and declaration moves UNDER_REVIEW", constraints: "OPEN, RESPONDED, RESOLVED" }

  - name: InspectionAppointment
    parent: Declaration
    common_fields: false
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK to Declaration" }
      - { name: scheduled_at, type: datetime, source: input, description: "ISO 8601 UTC; the appointment slot. Slots are 60-minute exclusive intervals at a single inspection bay." }
      - { name: bay_code, type: string, source: input, description: "Inspection bay identifier (e.g., 'BAY-A1')" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "SCHEDULED, COMPLETED, CANCELLED" }

  - name: PaymentNotice
    parent: Declaration
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK to Declaration" }
      - { name: amount_cny_minor, type: integer, source: system, description: "Snapshot of total_tax_cny_minor at notice generation; immutable" }
      - { name: due_at, type: datetime, source: system, description: "ISO 8601 UTC; notice expires 168 hours (7 days) after generation" }
      - { name: payment_channel, type: enum, source: input, description: "BANK_TRANSFER | ELECTRONIC_PAYMENT | GUARANTEE_DEDUCTION — selected when paying", constraints: "BANK_TRANSFER, ELECTRONIC_PAYMENT, GUARANTEE_DEDUCTION" }
      - { name: voucher_url, type: string, source: input, description: "Uploaded payment proof URL; required for BANK_TRANSFER" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | PAID | EXPIRED | REVERSED — PAID confirmed via webhook or manual mark", constraints: "PENDING, PAID, EXPIRED, REVERSED" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key for confirm_payment; rejects duplicate confirms with same key + payload" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: input, description: "FK to Declaration; must be in RELEASED or AMENDED state for the refund to be eligible" }
      - { name: refund_reason, type: enum, source: input, description: "RETURN | ORDER_CANCELLATION | ERRONEOUS_DECLARATION", constraints: "RETURN, ORDER_CANCELLATION, ERRONEOUS_DECLARATION" }
      - { name: supporting_documents, type: array, source: input, description: "Array of {doc_type, voucher_url}; required types depend on refund_reason" }
      - { name: refundable_amount_cny_minor, type: integer, source: computed, description: "Computed refund amount; depends on reason (full vs proportional)" }
      - { name: executed_amount_cny_minor, type: integer, source: system, default: 0, description: "Amount actually disbursed; equals refundable_amount_cny_minor on EXECUTED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | EXECUTED", constraints: "DRAFT, SUBMITTED, APPROVED, REJECTED, EXECUTED" }
      - { name: rejection_reason, type: string, source: system, description: "Set when status==REJECTED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: system, description: "Entity type the event refers to: DECLARATION | PAYMENT_NOTICE | REFUND", constraints: "DECLARATION, PAYMENT_NOTICE, REFUND" }
      - { name: subject_id, type: string, source: system, description: "FK to the subject entity" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the request that produced this event" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the request that produced this event" }
      - { name: event_type, type: enum, source: system, description: "DECLARATION_FIELD_CHANGE | DECLARATION_STATUS_CHANGE | TAX_RECOMPUTED | PAYMENT_CONFIRMED | REFUND_DECISION | EXTERNAL_SYNC", constraints: "DECLARATION_FIELD_CHANGE, DECLARATION_STATUS_CHANGE, TAX_RECOMPUTED, PAYMENT_CONFIRMED, REFUND_DECISION, EXTERNAL_SYNC" }
      - { name: before_value, type: object, source: system, description: "JSON snapshot of changed fields before the action" }
      - { name: after_value, type: object, source: system, description: "JSON snapshot of changed fields after the action" }

  - name: Importer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Importer legal name" }
      - { name: license_number, type: string, source: input, description: "Customs importer license; unique" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new declarations", constraints: "ACTIVE, SUSPENDED" }

  - name: Declarant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cross-border platform / customs broker name" }
      - { name: agent_code, type: string, source: input, description: "Customs-issued agent code; unique" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "ACTIVE, SUSPENDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: PENDING_DECLARATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_DECLARATION
        to: DECLARED
        trigger: "system (automatic when child Declaration enters APPROVED or CONDITIONALLY_RELEASED)"
        actor: system
        preconditions:
          - "Declaration.order_id == Order.id"
          - "Declaration.status IN {APPROVED, CONDITIONALLY_RELEASED}"
        side_effects:
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating ERP-system order-status push"

      - from: DECLARED
        to: RELEASED
        trigger: "system (automatic when child Declaration enters RELEASED)"
        actor: system
        preconditions:
          - "Declaration.status == RELEASED"
        side_effects:
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating logistics-system pickup-coordination push"
          - "Declaration.pickup_coordinated_at set to current clock"

      - from: PENDING_DECLARATION
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: Importer
        preconditions:
          - "No Declaration exists for this order, OR existing Declaration.status == DRAFT (DRAFT will be deleted by side_effect)"
        side_effects:
          - "Any DRAFT Declaration for this order is removed"

      - from: DECLARED
        to: RETURNED
        trigger: "POST /orders/{order_id}/return"
        actor: Importer
        preconditions:
          - "Order.status == DECLARED OR Order.status == RELEASED"
          - "No EXECUTED Refund already exists for this declaration's PaymentNotice"
        side_effects:
          - "Order eligible for RETURN-reason Refund creation"

      - from: RELEASED
        to: RETURNED
        trigger: "POST /orders/{order_id}/return"
        actor: Importer
        preconditions:
          - "Order.status == RELEASED"
        side_effects: []

  - entity: Declaration
    initial_state: DRAFT
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /declarations/{declaration_id}/submit"
        actor: Declarant
        preconditions:
          - "All DeclarationLine.override_review_status NOT IN {PENDING, REJECTED} (ERR_LINES_HAVE_PENDING_OVERRIDE)"
          - "Required-field completeness for trade_mode template passed (ERR_DECLARATION_INCOMPLETE)"
          - "Importer.status == ACTIVE (ERR_IMPORTER_SUSPENDED)"
          - "Declarant.status == ACTIVE"
          - "submission_count < 3 (ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "submission_count += 1"
          - "Recompute tax_mode, dutiable_value_cny_minor, tariff/VAT/consumption-tax/total_tax (calculation: declaration_tax_total)"
          - "exchange_rate_date_used pinned to latest ExchangeRate.effective_date <= submission date"
          - "AuditEvent(DECLARATION_STATUS_CHANGE, TAX_RECOMPUTED) emitted"
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating Customs Single Window push"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /declarations/{declaration_id}/start_review"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "AuditEvent(DECLARATION_STATUS_CHANGE) emitted"

      - from: UNDER_REVIEW
        to: QUERIED
        trigger: "POST /declarations/{declaration_id}/queries (creates Query, transitions declaration)"
        actor: CustomsOfficer
        preconditions:
          - "No SCHEDULED InspectionAppointment for this declaration (ERR_INSPECTION_PENDING)"
        side_effects:
          - "Declaration.query_id = new_query.id"
          - "Query.status = OPEN"

      - from: QUERIED
        to: UNDER_REVIEW
        trigger: "POST /queries/{query_id}/resolve"
        actor: CustomsOfficer
        preconditions:
          - "Query.status == RESPONDED (declarant has answered)"
        side_effects:
          - "Query.status = RESOLVED"
          - "Declaration.query_id = null"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /declarations/{declaration_id}/reject"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "rejection_reason set"
          - "AuditEvent(DECLARATION_STATUS_CHANGE) emitted"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /declarations/{declaration_id}/submit"
        actor: Declarant
        preconditions:
          - "submission_count < 3 (ERR_REWORK_LIMIT_EXCEEDED)"
          - "All standard submit preconditions"
        side_effects:
          - "submission_count += 1"
          - "Recompute taxes (calculation: declaration_tax_total)"
          - "rejection_reason cleared"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /declarations/{declaration_id}/approve"
        actor: CustomsOfficer
        preconditions:
          - "No OPEN Query (Declaration.query_id == null)"
          - "Any SCHEDULED InspectionAppointment must be COMPLETED (ERR_INSPECTION_PENDING)"
        side_effects:
          - "PaymentNotice generated automatically with amount_cny_minor = total_tax_cny_minor (calculation pinned in §1.3)"
          - "Order.status: PENDING_DECLARATION → DECLARED (cascade)"
          - "AuditEvent(DECLARATION_STATUS_CHANGE) emitted"

      - from: APPROVED
        to: RELEASED
        trigger: "system (automatic when child PaymentNotice enters PAID)"
        actor: system
        preconditions:
          - "PaymentNotice.status == PAID"
        side_effects:
          - "Order.status: DECLARED → RELEASED (cascade)"
          - "Order.pickup_coordinated_at on Declaration set to current clock"
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating logistics push"

      - from: APPROVED
        to: CONDITIONALLY_RELEASED
        trigger: "POST /declarations/{declaration_id}/conditional_release"
        actor: CustomsOfficer
        preconditions:
          - "PaymentNotice.payment_channel == GUARANTEE_DEDUCTION (only guarantee channel allows conditional release)"
        side_effects:
          - "release_condition = 'guarantee_deposit_required'"
          - "Order.status: PENDING_DECLARATION → DECLARED (cascade)"

      - from: CONDITIONALLY_RELEASED
        to: RELEASED
        trigger: "system (automatic when PaymentNotice enters PAID)"
        actor: system
        preconditions:
          - "PaymentNotice.status == PAID"
        side_effects:
          - "release_condition cleared"
          - "Order.status: DECLARED → RELEASED (cascade)"

      - from: RELEASED
        to: AMENDED
        trigger: "POST /declarations/{declaration_id}/amend"
        actor: Declarant
        preconditions:
          - "PaymentNotice.status == PAID"
          - "No EXECUTED Refund for this declaration"
        side_effects:
          - "Recompute taxes; if total_tax_cny_minor differs from PaymentNotice.amount_cny_minor, mark amendment_diff_cny_minor for audit"
          - "AuditEvent(DECLARATION_FIELD_CHANGE, TAX_RECOMPUTED) emitted"

      - from: AMENDED
        to: RELEASED
        trigger: "POST /declarations/{declaration_id}/finalize_amendment"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "AuditEvent(DECLARATION_STATUS_CHANGE) emitted"

  - entity: Query
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /queries/{query_id}/respond"
        actor: Declarant
        preconditions:
          - "All required_documents have a matching response_documents entry (ERR_QUERY_DOCUMENTS_INCOMPLETE)"
        side_effects: []

      - from: RESPONDED
        to: RESOLVED
        trigger: "POST /queries/{query_id}/resolve"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "Triggers declaration QUERIED → UNDER_REVIEW"

  - entity: InspectionAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspection_appointments/{appointment_id}/complete"
        actor: CustomsOfficer
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspection_appointments/{appointment_id}/cancel"
        actor: CustomsOfficer
        preconditions: []
        side_effects: []

  - entity: PaymentNotice
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /payment_notices/{notice_id}/confirm_payment"
        actor: FinanceOfficer
        preconditions:
          - "Idempotency-Key header present (ERR_IDEMPOTENCY_KEY_REQUIRED); duplicate key + identical payload returns prior result"
          - "Notice not EXPIRED at request time (ERR_PAYMENT_NOTICE_EXPIRED)"
          - "If payment_channel == BANK_TRANSFER, voucher_url required (ERR_VOUCHER_REQUIRED)"
          - "If payment_channel == GUARANTEE_DEDUCTION, the linked Declaration must be APPROVED or CONDITIONALLY_RELEASED"
        side_effects:
          - "Triggers Declaration APPROVED → RELEASED OR CONDITIONALLY_RELEASED → RELEASED (cascade)"
          - "AuditEvent(PAYMENT_CONFIRMED) emitted"
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating payment-system push"

      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when current clock >= due_at and status still PENDING)"
        actor: system
        preconditions:
          - "now >= due_at"
        side_effects: []

      - from: PAID
        to: REVERSED
        trigger: "POST /payment_notices/{notice_id}/reverse"
        actor: FinanceOfficer
        preconditions:
          - "Linked Declaration not in RELEASED state with EXECUTED Refund (ERR_REFUND_ALREADY_EXECUTED)"
        side_effects:
          - "If Declaration.status == RELEASED, revert to APPROVED (cascade)"
          - "AuditEvent(PAYMENT_CONFIRMED with reverse=true) emitted"

  - entity: Refund
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /refunds/{refund_id}/submit"
        actor: Declarant
        preconditions:
          - "Linked Declaration.status IN {RELEASED, AMENDED}"
          - "Linked PaymentNotice.status == PAID"
          - "supporting_documents satisfies refund_reason requirements (ERR_REFUND_DOCUMENTS_INCOMPLETE)"
          - "If refund_reason == RETURN, Order.status == RETURNED (cross-entity guard, ERR_ORDER_NOT_ELIGIBLE)"
          - "If refund_reason == ORDER_CANCELLATION, Order.status == CANCELLED (ERR_ORDER_NOT_ELIGIBLE)"
        side_effects:
          - "Recompute refundable_amount_cny_minor (calculation: refund_amount)"
          - "AuditEvent(REFUND_DECISION submitted) emitted"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /refunds/{refund_id}/approve"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "AuditEvent(REFUND_DECISION approved) emitted"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /refunds/{refund_id}/reject"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "rejection_reason set"
          - "AuditEvent(REFUND_DECISION rejected) emitted"

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /refunds/{refund_id}/execute"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "executed_amount_cny_minor = refundable_amount_cny_minor"
          - "AuditEvent(REFUND_DECISION executed) emitted"
          - "AuditEvent(EXTERNAL_SYNC) emitted simulating ERP refund posting"
    note: |
      Cross-entity dependencies pinned across state machines:
      (a) Declaration.SUBMITTED requires Importer.ACTIVE (Declaration<->Importer pair).
      (b) Refund.DRAFT->SUBMITTED with refund_reason==RETURN requires Order.RETURNED (Refund<->Order pair).
      (c) PaymentNotice.PENDING->PAID with channel==GUARANTEE_DEDUCTION requires Declaration.APPROVED-or-CONDITIONALLY_RELEASED.

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Declarations created concurrently for the same Order"
    guarantee: "At most one Declaration per Order in non-terminal state; second creation rejected"
    error_id: ERR_DECLARATION_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on (order_id, status NOT IN {REJECTED-and-superseded})"

  - scenario: "Customs officer rejects while declarant submits an amendment simultaneously"
    guarantee: "Exactly one transition wins; loser sees state-mismatch error"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on Declaration.status with version increment"

  - scenario: "Two confirm_payment requests with identical Idempotency-Key but different bodies"
    guarantee: "First request's result is stored; second request rejected"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    serialization: "Idempotency-Key + payload hash; mismatch on second call → reject"

  - scenario: "Two InspectionAppointments scheduled for the same bay overlapping in time"
    guarantee: "At most one SCHEDULED appointment per (bay_code, time-overlap)"
    error_id: ERR_INSPECTION_SLOT_TAKEN
    http_status: 409
    serialization: "First-writer-wins on (bay_code, [scheduled_at, scheduled_at+60min))"

  - scenario: "Refund approve while linked PaymentNotice reverses simultaneously"
    guarantee: "Exactly one wins; if reverse wins first, refund approval fails"
    error_id: ERR_PAYMENT_REVERSED
    http_status: 409
    serialization: "First-writer-wins on PaymentNotice.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: classification_suggestion_score
    trigger: "POST /classification/suggest (and as input to DRAFT line creation when client uses suggestion)"
    algorithm: weighted_scoring
    formula: |
      For each candidate HsCode hc in hc.status==ACTIVE:
        keyword_score = (count of HsCode.keywords appearing as whole-word substring in lowercase(product_description))
                       / max(1, len(HsCode.keywords))
        description_score = 1.0 if HsCode.description.lower() in product_description.lower() else 0.0
        score = round(0.7 * keyword_score + 0.3 * description_score, 6)
      Return top 3 by score DESC, then by HsCode.code ASC (tie-break).
      If top score < 0.20, return empty list (caller must classify manually).
    input_set: "All HsCode rows where status == ACTIVE at request time"
    constants:
      KEYWORD_WEIGHT: 0.7
      DESCRIPTION_WEIGHT: 0.3
      MIN_RELEVANCE_SCORE: 0.20
    precision: "6 decimal places, round_half_up; final ranking compared to MIN_RELEVANCE_SCORE with strict greater-than-or-equal (>=)"

  - name: dutiable_value
    trigger: "Declaration submit (DRAFT→SUBMITTED, REJECTED→SUBMITTED), and amend (RELEASED→AMENDED)"
    algorithm: forward_looking
    formula: |
      Per DeclarationLine, compute line_dutiable_value_cny_minor based on Declaration.dutiable_value_method:

      TRANSACTION_VALUE:
        line_value_minor = Order.line_items[order_line_index].quantity * Order.line_items[order_line_index].unit_price
        line_dutiable_value_cny_minor = floor(line_value_minor * exchange_rate_micros / 1_000_000)

      DEDUCTIVE_VALUE:
        # Start from a presumed retail value (= 1.25 * transaction price), deduct logistics + profit margin.
        retail_value_minor = floor(line_value_minor * 125 / 100)
        deduction_minor = floor(retail_value_minor * DEDUCTION_RATIO_BPS / 10_000)
        deductive_value_minor = retail_value_minor - deduction_minor
        line_dutiable_value_cny_minor = floor(deductive_value_minor * exchange_rate_micros / 1_000_000)

      COMPUTED_VALUE:
        # Cost-plus: weight-based logistics + 10% profit uplift.
        logistics_minor = ceil(Order.line_items[order_line_index].weight_kg * LOGISTICS_PER_KG_MINOR)
        cost_plus_minor = line_value_minor + logistics_minor
        uplifted_minor = floor(cost_plus_minor * (10_000 + COMPUTED_UPLIFT_BPS) / 10_000)
        line_dutiable_value_cny_minor = floor(uplifted_minor * exchange_rate_micros / 1_000_000)

      Declaration.dutiable_value_cny_minor = sum over all DeclarationLines of line_dutiable_value_cny_minor.
      Per-line floor is applied BEFORE summing — "floor per line then sum", NOT "sum then floor".
    input_set: "All DeclarationLine rows of the declaration (order_line_index resolves into Order.line_items[]); excludes lines with override_review_status==REJECTED (those block submission)"
    constants:
      DEDUCTION_RATIO_BPS: 1500       # 15% deduction for logistics+profit (deductive method)
      LOGISTICS_PER_KG_MINOR: 5000    # 50.00 CNY per kg (in fen/minor)
      COMPUTED_UPLIFT_BPS: 1000       # 10% profit uplift (computed method)
    precision: "All intermediate values are integers (minor units / micros); each per-line floor is round-toward-zero. The order — floor-per-line then sum across lines — is pinned and explicit."
    variants:
      - name: TRANSACTION_VALUE
        when: "Declaration.dutiable_value_method == TRANSACTION_VALUE"
        difference: "Uses raw order line price * exchange rate. Yields the lowest value of the three for a given line."
      - name: DEDUCTIVE_VALUE
        when: "Declaration.dutiable_value_method == DEDUCTIVE_VALUE"
        difference: "Marks up to retail (1.25x), deducts logistics-and-profit ratio, then converts. For a 100 CNY line: retail=125, deduction=18 (floor(125*1500/10000)), deductive=107. Different from transaction (100) and computed."
      - name: COMPUTED_VALUE
        when: "Declaration.dutiable_value_method == COMPUTED_VALUE"
        difference: "Adds weight-based logistics, then 10% uplift, then converts. For a 100 CNY line at 1 kg: logistics=ceil(1*5000)=5000 minor=50.00 CNY; cost_plus=150; uplifted=floor(150*11000/10000)=165. Different from transaction (100) and deductive."

  - name: declaration_tax_total
    trigger: "Declaration submit (DRAFT/REJECTED→SUBMITTED), amend (RELEASED→AMENDED), and approve (auto-generates PaymentNotice.amount_cny_minor)"
    algorithm: tiered_pricing
    formula: |
      # First decide tax_mode, which is mode-dependent.
      Step 1 — Determine tax_mode:
        If Declaration.trade_mode == B2C_DIRECT_MAIL AND
           Declaration.dutiable_value_cny_minor <= PERSONAL_POSTAL_THRESHOLD_CNY_MINOR:
            tax_mode = PERSONAL_POSTAL
        Else:
            tax_mode = STANDARD

      Step 2 — Compute taxes per tax_mode.
      STANDARD mode (general/bonded warehouse, or B2C above threshold):
        Per DeclarationLine i:
          rate_bps_i = TariffRule.tariff_rate_bps if a TariffRule matches
                      (hs_code_id_i, origin_country, destination_country, effective_from <= submission_ts < effective_to);
                      else HsCode.tariff_rate_bps
          line_tariff_i = floor(line_dutiable_value_cny_minor_i * rate_bps_i / 10_000)
          line_consumption_i = floor(line_dutiable_value_cny_minor_i * HsCode.consumption_tax_rate_bps / 10_000)
          # VAT base = line dutiable value + line tariff + line consumption.
          line_vat_base_i = line_dutiable_value_cny_minor_i + line_tariff_i + line_consumption_i
          line_vat_i = floor(line_vat_base_i * HsCode.vat_rate_bps / 10_000)

        tariff_amount_cny_minor = sum over i of line_tariff_i           # floor per line, then sum
        consumption_tax_cny_minor = sum over i of line_consumption_i   # floor per line, then sum
        vat_amount_cny_minor = sum over i of line_vat_i                # floor per line, then sum
        total_tax_cny_minor = tariff_amount_cny_minor + vat_amount_cny_minor + consumption_tax_cny_minor

      PERSONAL_POSTAL mode (B2C direct mail at or below threshold):
        Per DeclarationLine i:
          line_postal_i = floor(line_dutiable_value_cny_minor_i * HsCode.postal_tax_rate_bps / 10_000)
        postal_total = sum over i of line_postal_i
        # Statutory exemption: if postal_total <= POSTAL_EXEMPTION_CNY_MINOR, the importer pays 0.
        if postal_total <= POSTAL_EXEMPTION_CNY_MINOR:
            total_tax_cny_minor = 0
        else:
            total_tax_cny_minor = postal_total
        tariff_amount_cny_minor = 0
        vat_amount_cny_minor = 0
        consumption_tax_cny_minor = 0
    input_set: "All DeclarationLine rows; uses each line's resolved HsCode and TariffRule (origin/destination/effective window) at the moment of trigger. exchange_rate_date_used is pinned at the same moment."
    constants:
      PERSONAL_POSTAL_THRESHOLD_CNY_MINOR: 500000  # 5,000.00 CNY in fen
      POSTAL_EXEMPTION_CNY_MINOR: 5000             # 50.00 CNY in fen — statutory waiver below this line
    precision: "Integer minor units throughout. Per-line floor BEFORE summing (the order is pinned; 'sum then floor' would yield different cents). Boundary check on PERSONAL_POSTAL_THRESHOLD is inclusive (<=). Boundary check on POSTAL_EXEMPTION is inclusive (<=)."
    variants:
      - name: STANDARD
        when: "trade_mode != B2C_DIRECT_MAIL OR dutiable_value_cny_minor > PERSONAL_POSTAL_THRESHOLD_CNY_MINOR"
        difference: "Uses three-tax composition (tariff, consumption, VAT) with VAT base = dutiable + tariff + consumption (compounded)."
      - name: PERSONAL_POSTAL
        when: "trade_mode == B2C_DIRECT_MAIL AND dutiable_value_cny_minor <= PERSONAL_POSTAL_THRESHOLD_CNY_MINOR"
        difference: "Uses single postal-tax rate; if total <= 50.00 CNY, statutory exemption sets total to 0."

  - name: refund_amount
    trigger: "Refund DRAFT→SUBMITTED"
    algorithm: chronological
    formula: |
      Let pn = the PaymentNotice for the linked declaration. Refund executes against pn.amount_cny_minor.

      RETURN:
        # Full refund of taxes, since goods do not enter the country.
        refundable_amount_cny_minor = pn.amount_cny_minor

      ORDER_CANCELLATION:
        # Order cancelled before customs released goods → must be from CONDITIONALLY_RELEASED rolled back; full refund.
        refundable_amount_cny_minor = pn.amount_cny_minor

      ERRONEOUS_DECLARATION:
        # Declarant filed an amendment that lowered dutiable value. Refund = original tax minus recomputed tax.
        # Refund only the positive difference; if the amendment raised tax instead, the refund is rejected with ERR_REFUND_NOT_ELIGIBLE before reaching this calc.
        refundable_amount_cny_minor = max(0, pn.amount_cny_minor - Declaration.total_tax_cny_minor)
    input_set: "PaymentNotice.amount_cny_minor (immutable snapshot taken at notice generation) and Declaration.total_tax_cny_minor (current). For RETURN/ORDER_CANCELLATION, only pn.amount_cny_minor matters. For ERRONEOUS_DECLARATION, the latest Declaration.total_tax_cny_minor (set by amend) is the basis of comparison; tie-break: at most one EXECUTED Refund per declaration."
    constants: {}
    precision: "Integer minor units; max() with 0 prevents negative refunds."
    variants:
      - name: full_refund
        when: "refund_reason IN {RETURN, ORDER_CANCELLATION}"
        difference: "Returns the entire paid amount regardless of current declaration tax."
      - name: partial_refund
        when: "refund_reason == ERRONEOUS_DECLARATION"
        difference: "Returns only the positive difference between paid and recomputed tax — order matters (paid was computed against then-current rates; recomputed reflects amended values)."

  - name: query_documents_completeness
    trigger: "POST /queries/{query_id}/respond"
    algorithm: aggregation
    formula: |
      For each doc_type in Query.required_documents:
        if no entry in response_documents has matching doc_type:
            return ERR_QUERY_DOCUMENTS_INCOMPLETE
      Pass: Query.status = RESPONDED.
    input_set: "Query.required_documents (set), response_documents (list of {doc_type, voucher_url}). Empty required_documents passes trivially. Comparison is case-sensitive on doc_type."
    precision: "n/a (set membership)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment IDs (declaration_id, query_id, refund_id, hs_code_id, etc.) must resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all parameterized endpoints

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (order_id on declaration create, declaration_id on refund create, hs_code_id on line) must resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /declarations, POST /declarations/{id}/lines, POST /refunds, POST /declarations/{id}/inspection_appointments"

  - priority: 5
    category: state
    check: "Resource must be in a state where the requested transition is allowed"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "All state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Importer.status must be ACTIVE for declaration creation/submission"
    error_id: ERR_IMPORTER_SUSPENDED
    http_status: 409
    applies_to: "POST /declarations, POST /declarations/{id}/submit"

  - priority: 7
    category: business_referential
    check: "Declaration uniqueness — for a given Order, at most one Declaration in non-terminal state (i.e., not REJECTED-superseded)"
    error_id: ERR_DECLARATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /declarations"

  - priority: 8
    category: business_constraint
    check: "Required-field completeness for the trade_mode template before SUBMITTED. (B2C_DIRECT_MAIL requires importer_id_card_number; BONDED_WAREHOUSE requires bonded_zone_code; GENERAL_TRADE requires contract_number.) Missing → ERR_DECLARATION_INCOMPLETE."
    error_id: ERR_DECLARATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /declarations/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "All DeclarationLines have override_review_status NOT IN {PENDING, REJECTED} before submission"
    error_id: ERR_LINES_HAVE_PENDING_OVERRIDE
    http_status: 409
    applies_to: "POST /declarations/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "submission_count < 3 (rejection-rework limit). When a declaration has been rejected twice and rejected again, the third REJECTED→SUBMITTED attempt fails."
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /declarations/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "InspectionAppointment.scheduled_at must not overlap any other SCHEDULED appointment on same bay_code in a half-open 60-minute window [scheduled_at, scheduled_at + 60min)"
    error_id: ERR_INSPECTION_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /declarations/{id}/inspection_appointments"

  - priority: 12
    category: business_constraint
    check: "Declaration with SCHEDULED inspection cannot transition UNDER_REVIEW → APPROVED (must complete inspection first)"
    error_id: ERR_INSPECTION_PENDING
    http_status: 409
    applies_to: "POST /declarations/{id}/approve, POST /declarations/{id}/queries"

  - priority: 13
    category: business_temporal
    check: "PaymentNotice.due_at must be in the future at confirm_payment request time (current clock < due_at). Clock advance can flip this from PASS to FAIL."
    error_id: ERR_PAYMENT_NOTICE_EXPIRED
    http_status: 409
    applies_to: "POST /payment_notices/{id}/confirm_payment"

  - priority: 14
    category: business_constraint
    check: "Idempotency-Key header required on confirm_payment; duplicate key with mismatched payload → reject"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /payment_notices/{id}/confirm_payment"

  - priority: 15
    category: business_constraint
    check: "BANK_TRANSFER channel requires non-empty voucher_url"
    error_id: ERR_VOUCHER_REQUIRED
    http_status: 422
    applies_to: "POST /payment_notices/{id}/confirm_payment"

  - priority: 16
    category: business_referential
    check: "Refund eligibility — refund_reason==RETURN requires Order.status==RETURNED; refund_reason==ORDER_CANCELLATION requires Order.status==CANCELLED. Cross-entity guard."
    error_id: ERR_ORDER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /refunds/{id}/submit"

  - priority: 17
    category: business_constraint
    check: "Refund supporting_documents satisfy refund_reason requirements (RETURN: ['SHIPMENT_RETURN_RECEIPT']; ORDER_CANCELLATION: ['CANCELLATION_AGREEMENT']; ERRONEOUS_DECLARATION: ['AMENDMENT_DECISION']). Missing any → ERR_REFUND_DOCUMENTS_INCOMPLETE."
    error_id: ERR_REFUND_DOCUMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /refunds/{id}/submit"

  - priority: 18
    category: business_fiscal
    check: "Refund eligibility — for ERRONEOUS_DECLARATION, the post-amendment Declaration.total_tax_cny_minor MUST be strictly less than PaymentNotice.amount_cny_minor (>=  fails). Refunds where amendment raised the tax are rejected at this guard, not later in the calc."
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /refunds/{id}/submit"

  - priority: 19
    category: business_fiscal
    check: "Cannot reverse PaymentNotice if linked declaration has an EXECUTED Refund"
    error_id: ERR_REFUND_ALREADY_EXECUTED
    http_status: 409
    applies_to: "POST /payment_notices/{id}/reverse"

  - priority: 20
    category: business_constraint
    check: "Query response — every doc_type in required_documents must have a matching response_documents entry"
    error_id: ERR_QUERY_DOCUMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /queries/{id}/respond"

  - priority: 21
    category: business_constraint
    check: "HsCode.status must be ACTIVE when added to a DeclarationLine in a DRAFT or SUBMITTED declaration"
    error_id: ERR_HS_CODE_DEPRECATED
    http_status: 409
    applies_to: "POST /declarations/{id}/lines"

  - priority: 22
    category: business_constraint
    check: "manual classification override on a DeclarationLine is allowed only while Declaration.status == DRAFT (override review precedes submission)"
    error_id: ERR_OVERRIDE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /declarations/{id}/lines/{line_id}/override"

  - priority: 23
    category: business_constraint
    check: "Conditional release requires PaymentNotice.payment_channel == GUARANTEE_DEDUCTION (set at confirm_payment, not at notice creation)"
    error_id: ERR_CHANNEL_NOT_GUARANTEE
    http_status: 409
    applies_to: "POST /declarations/{id}/conditional_release"

  - priority: 24
    category: business_temporal
    check: "Two TariffRules for the same (hs_code_id, origin_country, destination_country) cannot have overlapping closed-open intervals [effective_from, effective_to). effective_to == other.effective_from is allowed (back-to-back, no gap, no overlap). Differs from inspection overlap in that TariffRule intervals are arbitrarily long while inspection slots are fixed 60-min."
    error_id: ERR_TARIFF_RULE_OVERLAP
    http_status: 409
    applies_to: "POST /tariff_rules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- HS Code library ---
  - method: POST
    path: "/hs_codes"
    description: "Create an HsCode entry"
    roles: [CustomsOfficer]
    code: 201
    input: ["code", "description", "keywords", "country_code_map", "tariff_rate_bps", "vat_rate_bps", "consumption_tax_rate_bps?", "postal_tax_rate_bps"]
    output: HsCode
    side_effects: ["status=ACTIVE; uniqueness check on code"]

  - method: POST
    path: "/hs_codes/{hs_code_id}/deprecate"
    description: "Mark HsCode as DEPRECATED (blocks new line additions but historical declarations remain valid)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: HsCode
    side_effects: ["status=DEPRECATED"]

  - method: GET
    path: "/hs_codes/{hs_code_id}"
    description: "Get an HsCode (incl. country_code_map for multi-country mapping)"
    roles: [CustomsOfficer, Declarant, Auditor]
    code: 200
    input: []
    output: HsCode
    side_effects: []

  - method: POST
    path: "/classification/suggest"
    description: "Suggest HsCodes for a product description (rule-engine + scoring)"
    roles: [Declarant]
    code: 200
    input: [product_description]
    output: "object {suggestions: HsCode[], scores: number[]}"
    side_effects: ["No DB writes; pure read"]

  # --- Tariff rules & exchange rates ---
  - method: POST
    path: "/tariff_rules"
    description: "Create a TariffRule (origin-specific override)"
    roles: [CustomsOfficer]
    code: 201
    input: ["hs_code_id", "origin_country", "destination_country", "tariff_rate_bps", "effective_from", "effective_to?"]
    output: TariffRule
    side_effects: []

  - method: POST
    path: "/exchange_rates"
    description: "Publish a daily exchange rate"
    roles: [CustomsOfficer]
    code: 201
    input: [from_currency, to_currency, rate_micros, effective_date]
    output: ExchangeRate
    side_effects: ["uniqueness on (from_currency, to_currency, effective_date)"]

  # --- Importers / Declarants ---
  - method: POST
    path: "/importers"
    description: "Create an Importer"
    roles: [CustomsOfficer]
    code: 201
    input: [name, license_number]
    output: Importer
    side_effects: []

  - method: POST
    path: "/importers/{importer_id}/suspend"
    description: "Suspend an importer (blocks new declarations)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Importer
    side_effects: ["status=SUSPENDED"]

  - method: POST
    path: "/declarants"
    description: "Create a Declarant"
    roles: [CustomsOfficer]
    code: 201
    input: [name, agent_code]
    output: Declarant
    side_effects: []

  # --- Orders ---
  - method: POST
    path: "/orders"
    description: "Create an Order (ERP push entry point)"
    roles: [Declarant]
    code: 201
    input: [external_order_ref, importer_id, declarant_id, trade_mode, origin_country, destination_country, currency, line_items, total_value_minor]
    output: Order
    side_effects: ["status=PENDING_DECLARATION"]

  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel an Order"
    roles: [Importer]
    code: 200
    input: []
    output: Order
    side_effects: ["status=CANCELLED; deletes any DRAFT Declaration for this order"]

  - method: POST
    path: "/orders/{order_id}/return"
    description: "Mark order as RETURNED (post-release goods coming back)"
    roles: [Importer]
    code: 200
    input: []
    output: Order
    side_effects: ["status=RETURNED"]

  - method: GET
    path: "/orders/{order_id}"
    description: "Get an Order"
    roles: [Declarant, CustomsOfficer, Importer, Auditor]
    code: 200
    input: []
    output: Order
    side_effects: []

  # --- Declarations ---
  - method: POST
    path: "/declarations"
    description: "Create a draft Declaration for an Order"
    roles: [Declarant]
    code: 201
    input: ["order_id", "dutiable_value_method", "importer_id_card_number?", "bonded_zone_code?", "contract_number?"]
    output: Declaration
    side_effects: ["status=DRAFT, declarant_id and trade_mode copied from Order"]

  - method: POST
    path: "/declarations/{declaration_id}/lines"
    description: "Add a DeclarationLine"
    roles: [Declarant]
    code: 201
    input: [order_line_index, hs_code_id, classification_source]
    output: DeclarationLine
    side_effects: ["override_review_status=PENDING if classification_source==MANUAL_OVERRIDE; else NOT_APPLICABLE"]

  - method: POST
    path: "/declarations/{declaration_id}/lines/{line_id}/override"
    description: "Approve or reject a manual classification override"
    roles: [CustomsOfficer]
    code: 200
    input: [decision]   # APPROVE or REJECT
    output: DeclarationLine
    side_effects: ["override_review_status set"]

  - method: POST
    path: "/declarations/{declaration_id}/submit"
    description: "Submit (or re-submit after rejection) a declaration to customs"
    roles: [Declarant]
    code: 200
    input: []
    output: Declaration
    side_effects:
      - "Recompute taxes (declaration_tax_total) and dutiable_value"
      - "submission_count += 1"
      - "exchange_rate_date_used pinned"
      - "AuditEvent(DECLARATION_STATUS_CHANGE, TAX_RECOMPUTED, EXTERNAL_SYNC) emitted"

  - method: POST
    path: "/declarations/{declaration_id}/start_review"
    description: "Customs officer begins review (SUBMITTED → UNDER_REVIEW)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Declaration
    side_effects: []

  - method: POST
    path: "/declarations/{declaration_id}/queries"
    description: "Customs officer issues a supplementary-document query (UNDER_REVIEW → QUERIED)"
    roles: [CustomsOfficer]
    code: 201
    input: [question, required_documents]
    output: Query
    side_effects: ["Declaration.query_id set; status=QUERIED"]

  - method: POST
    path: "/queries/{query_id}/respond"
    description: "Declarant responds to a query"
    roles: [Declarant]
    code: 200
    input: [response_text, response_documents]
    output: Query
    side_effects: ["Query.status=RESPONDED"]

  - method: POST
    path: "/queries/{query_id}/resolve"
    description: "Customs officer resolves a query (QUERIED → UNDER_REVIEW)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Query
    side_effects: ["Query.status=RESOLVED; Declaration.query_id cleared; declaration UNDER_REVIEW"]

  - method: POST
    path: "/declarations/{declaration_id}/inspection_appointments"
    description: "Schedule a manual inspection"
    roles: [CustomsOfficer]
    code: 201
    input: [scheduled_at, bay_code]
    output: InspectionAppointment
    side_effects: ["status=SCHEDULED; overlap check on bay+time"]

  - method: POST
    path: "/inspection_appointments/{appointment_id}/complete"
    description: "Mark an appointment COMPLETED"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: InspectionAppointment
    side_effects: []

  - method: POST
    path: "/inspection_appointments/{appointment_id}/cancel"
    description: "Cancel an appointment"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: InspectionAppointment
    side_effects: []

  - method: POST
    path: "/declarations/{declaration_id}/reject"
    description: "Customs officer rejects (UNDER_REVIEW → REJECTED)"
    roles: [CustomsOfficer]
    code: 200
    input: [rejection_reason]
    output: Declaration
    side_effects: ["status=REJECTED; rejection_reason set"]

  - method: POST
    path: "/declarations/{declaration_id}/approve"
    description: "Customs officer approves (UNDER_REVIEW → APPROVED); auto-generates PaymentNotice"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Declaration
    side_effects:
      - "PaymentNotice created with amount_cny_minor=total_tax_cny_minor and due_at=now+168h"
      - "Order: PENDING_DECLARATION → DECLARED (cascade)"

  - method: POST
    path: "/declarations/{declaration_id}/conditional_release"
    description: "Customs officer grants conditional release (APPROVED → CONDITIONALLY_RELEASED), pending guarantee deduction"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Declaration
    side_effects: ["release_condition='guarantee_deposit_required'"]

  - method: POST
    path: "/declarations/{declaration_id}/amend"
    description: "Post-release amendment (RELEASED → AMENDED); recomputes taxes"
    roles: [Declarant]
    code: 200
    input: ["lines: array of {line_id, hs_code_id?, dutiable_value_method?}"]
    output: Declaration
    side_effects: ["Recompute dutiable_value and tax; AuditEvent(DECLARATION_FIELD_CHANGE, TAX_RECOMPUTED)"]

  - method: POST
    path: "/declarations/{declaration_id}/finalize_amendment"
    description: "Customs officer finalizes amendment (AMENDED → RELEASED)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Declaration
    side_effects: []

  - method: GET
    path: "/declarations/{declaration_id}"
    description: "Get a declaration with all derived fields (taxes, mode, exchange_rate_date_used)"
    roles: [Declarant, CustomsOfficer, Importer, Auditor]
    code: 200
    input: []
    output: Declaration
    side_effects: []

  - method: GET
    path: "/declarations"
    description: "List declarations with filters"
    roles: [Declarant, CustomsOfficer, Auditor]
    code: 200
    input: ["importer_id?, declarant_id?, status?, trade_mode?, limit?, offset?"]
    output: "Declaration[]"
    side_effects: []

  # --- Payment ---
  - method: GET
    path: "/payment_notices/{notice_id}"
    description: "Get a payment notice"
    roles: [Declarant, FinanceOfficer, Importer, Auditor]
    code: 200
    input: []
    output: PaymentNotice
    side_effects: []

  - method: POST
    path: "/payment_notices/{notice_id}/confirm_payment"
    description: "Confirm payment via channel (idempotent)"
    roles: [FinanceOfficer]
    code: 200
    input: ["payment_channel", "voucher_url?", "idempotency_key"]
    output: PaymentNotice
    side_effects:
      - "status=PAID"
      - "Cascades Declaration APPROVED→RELEASED or CONDITIONALLY_RELEASED→RELEASED"
      - "AuditEvent(PAYMENT_CONFIRMED, EXTERNAL_SYNC) emitted"

  - method: POST
    path: "/payment_notices/{notice_id}/reverse"
    description: "Reverse a confirmed payment (PAID → REVERSED)"
    roles: [FinanceOfficer]
    code: 200
    input: [reverse_reason]
    output: PaymentNotice
    side_effects:
      - "If declaration RELEASED, revert to APPROVED"
      - "AuditEvent(PAYMENT_CONFIRMED with reverse=true)"

  # --- Refunds ---
  - method: POST
    path: "/refunds"
    description: "Create a draft Refund"
    roles: [Declarant]
    code: 201
    input: [declaration_id, refund_reason, supporting_documents]
    output: Refund
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/refunds/{refund_id}/submit"
    description: "Submit a refund declaration"
    roles: [Declarant]
    code: 200
    input: []
    output: Refund
    side_effects:
      - "Recompute refundable_amount_cny_minor (calculation: refund_amount)"
      - "AuditEvent(REFUND_DECISION submitted)"

  - method: POST
    path: "/refunds/{refund_id}/approve"
    description: "Customs officer approves refund"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: POST
    path: "/refunds/{refund_id}/reject"
    description: "Customs officer rejects refund"
    roles: [CustomsOfficer]
    code: 200
    input: [rejection_reason]
    output: Refund
    side_effects: []

  - method: POST
    path: "/refunds/{refund_id}/execute"
    description: "FinanceOfficer disburses refund (APPROVED → EXECUTED)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Refund
    side_effects: ["executed_amount_cny_minor=refundable_amount_cny_minor; AuditEvent(REFUND_DECISION executed, EXTERNAL_SYNC)"]

  - method: GET
    path: "/refunds/{refund_id}"
    description: "Get a refund"
    roles: [Declarant, CustomsOfficer, FinanceOfficer, Auditor]
    code: 200
    input: []
    output: Refund
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit_events"
    description: "List audit events filtered by subject"
    roles: [Auditor, CustomsOfficer]
    code: 200
    input: ["subject_type?, subject_id?, event_type?, limit?, offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test-driving endpoints (clock + external event simulation) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance system clock by N seconds (test-only). Used to trip PaymentNotice.due_at expiry, TariffRule.effective_to windows, ExchangeRate.effective_date selection."
    roles: [CustomsOfficer]
    code: 200
    input: [seconds]
    output: "object {now: ISO8601}"
    side_effects:
      - "Re-evaluates PaymentNotice PENDING→EXPIRED for any notice whose due_at has now passed"

  - method: POST
    path: "/_events/emit"
    description: "Emit a synthetic external-system event (test-only) for synchronization verification."
    roles: [CustomsOfficer]
    code: 200
    input: ["event_type: 'CUSTOMS_SINGLE_WINDOW_ACK' | 'PAYMENT_GATEWAY_PUSH' | 'LOGISTICS_PICKUP_ACK' | 'ERP_ORDER_UPDATE'", "subject_id"]
    output: AuditEvent
    side_effects: ["AuditEvent(EXTERNAL_SYNC) emitted"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or empty"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller's role is not authorized for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or body-referenced ID does not resolve to an existing entity"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body malformed, type mismatch, missing required field, negative quantity"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Resource not in a state that permits the requested action"

  - id: ERR_DECLARATION_ALREADY_EXISTS
    http: 409
    condition: "An Order already has a Declaration in non-terminal state"

  - id: ERR_DECLARATION_INCOMPLETE
    http: 422
    condition: "Required fields for the trade_mode template missing at submit"

  - id: ERR_LINES_HAVE_PENDING_OVERRIDE
    http: 409
    condition: "Declaration cannot be submitted while any line.override_review_status is PENDING or REJECTED"

  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "submission_count would exceed 3 (rejection-rework limit)"

  - id: ERR_HS_CODE_DEPRECATED
    http: 409
    condition: "Cannot reference an HsCode whose status==DEPRECATED on a new DeclarationLine"

  - id: ERR_OVERRIDE_NOT_ALLOWED
    http: 409
    condition: "Override action attempted on a line whose Declaration is no longer DRAFT"

  - id: ERR_IMPORTER_SUSPENDED
    http: 409
    condition: "Importer.status==SUSPENDED blocks declaration creation/submit"

  - id: ERR_INSPECTION_PENDING
    http: 409
    condition: "Operation blocked because a SCHEDULED InspectionAppointment exists for this declaration"

  - id: ERR_INSPECTION_SLOT_TAKEN
    http: 409
    condition: "Bay+time window already occupied by another SCHEDULED appointment"

  - id: ERR_QUERY_DOCUMENTS_INCOMPLETE
    http: 422
    condition: "Required document types in query.required_documents missing from response_documents"

  - id: ERR_PAYMENT_NOTICE_EXPIRED
    http: 409
    condition: "Notice.due_at has passed (current clock >= due_at)"

  - id: ERR_VOUCHER_REQUIRED
    http: 422
    condition: "BANK_TRANSFER channel selected without voucher_url"

  - id: ERR_IDEMPOTENCY_KEY_REQUIRED
    http: 400
    condition: "confirm_payment without Idempotency-Key header"

  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Same idempotency_key reused with different payload"

  - id: ERR_CHANNEL_NOT_GUARANTEE
    http: 409
    condition: "Conditional release requested but PaymentNotice.payment_channel != GUARANTEE_DEDUCTION"

  - id: ERR_PAYMENT_REVERSED
    http: 409
    condition: "Operation blocked because linked PaymentNotice is REVERSED"

  - id: ERR_REFUND_DOCUMENTS_INCOMPLETE
    http: 422
    condition: "Refund.supporting_documents missing required types for refund_reason"

  - id: ERR_REFUND_NOT_ELIGIBLE
    http: 409
    condition: "ERRONEOUS_DECLARATION refund where amended tax is not strictly less than paid tax"

  - id: ERR_REFUND_ALREADY_EXECUTED
    http: 409
    condition: "Cannot reverse PaymentNotice when an EXECUTED Refund exists for the declaration"

  - id: ERR_ORDER_NOT_ELIGIBLE
    http: 409
    condition: "Refund cross-entity guard — Order.status does not match required state for refund_reason"

  - id: ERR_TARIFF_RULE_OVERLAP
    http: 409
    condition: "New TariffRule's effective interval [effective_from, effective_to) overlaps an existing rule for the same (hs_code_id, origin_country, destination_country)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Declarant
    description: "Cross-border platform / customs broker — owns declaration drafting, submission, amendment, and refund initiation. Acts on behalf of an Importer."
    identity: "entity_backed:Declarant"
    exclusive_operations:
      - "POST /classification/suggest"
      - "POST /declarations — Create draft declaration"
      - "POST /declarations/{id}/lines — Add line"
      - "POST /declarations/{id}/submit — Submit/resubmit"
      - "POST /declarations/{id}/amend — Post-release amendment"
      - "POST /queries/{id}/respond — Respond to a query"
      - "POST /refunds — Create draft refund"
      - "POST /refunds/{id}/submit — Submit refund"
      - "POST /orders — Create order (ERP-equivalent push)"
    shared_operations:
      - "GET /hs_codes/{id}, GET /declarations, GET /declarations/{id}, GET /orders/{id}, GET /payment_notices/{id}, GET /refunds/{id}"

  - name: CustomsOfficer
    description: "Government customs reviewer. Reviews declarations, issues queries, schedules inspections, approves/rejects, runs HS code library and tariff rules. Privileged operator role."
    identity: "opaque"
    exclusive_operations:
      - "POST /hs_codes — Create HsCode"
      - "POST /hs_codes/{id}/deprecate — Deprecate HsCode"
      - "POST /tariff_rules, POST /exchange_rates"
      - "POST /importers, POST /importers/{id}/suspend, POST /declarants"
      - "POST /declarations/{id}/lines/{line_id}/override — Approve/reject manual override"
      - "POST /declarations/{id}/start_review"
      - "POST /declarations/{id}/queries — Issue query"
      - "POST /queries/{id}/resolve — Close out query"
      - "POST /declarations/{id}/inspection_appointments, .../complete, .../cancel"
      - "POST /declarations/{id}/reject"
      - "POST /declarations/{id}/approve"
      - "POST /declarations/{id}/conditional_release"
      - "POST /declarations/{id}/finalize_amendment"
      - "POST /refunds/{id}/approve, POST /refunds/{id}/reject"
      - "POST /_clock/advance, POST /_events/emit (test-driving operator)"
    shared_operations:
      - "GET /audit_events, GET /declarations, etc."

  - name: FinanceOfficer
    description: "Treasury role — confirms tax payments, reverses payments, executes refund disbursements."
    identity: "opaque"
    exclusive_operations:
      - "POST /payment_notices/{id}/confirm_payment"
      - "POST /payment_notices/{id}/reverse"
      - "POST /refunds/{id}/execute"
    shared_operations:
      - "GET /payment_notices/{id}, GET /refunds/{id}"

  - name: Importer
    description: "End importer of record. Triggers order cancellation/return; views their own orders/declarations/notices."
    identity: "entity_backed:Importer"
    exclusive_operations:
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/return"
    shared_operations:
      - "GET /orders/{id}, GET /declarations/{id}, GET /payment_notices/{id} — only when X-User-ID matches resource importer_id"

  - name: Auditor
    description: "Read-only role for compliance review. Cannot mutate state."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /audit_events, GET /declarations, GET /declarations/{id}, GET /refunds/{id}, GET /payment_notices/{id}, GET /hs_codes/{id}"
