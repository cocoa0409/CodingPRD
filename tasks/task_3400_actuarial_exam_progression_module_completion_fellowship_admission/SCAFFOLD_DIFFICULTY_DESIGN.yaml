          - entities.ExamWindow.fields.seats_held
          - calculations.waitlist_promotion
          - state_machines.ExamRegistration.REGISTERED_to_CANCELLED
          - state_machines.ExamRegistration.WAITLISTED_to_REGISTERED
        distinguishing_aspect: |
          Conserved quantity = seat occupancy: seats_held == count of REGISTERED
          registrations for the window must hold after every step of the
          register/waitlist/cancel/promote sequence; the cancel+promotion pair is
          compensating (seat count returns to 1, held by a different candidate).
