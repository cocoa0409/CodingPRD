    instances:
      - name: payroll_processor_cannot_confirm_paid_returns_forbidden
        claim_type: segregation_of_duties
        grounds: [roles, state_machines.PayrollBatch.EXPORTED_to_CONFIRMED_PAID]
        distinguishing_aspect: "Segregation of duties on money-out: the PayrollProcessor who prepares a batch cannot confirm payment; only TalentAdmin can. The forbidden attempt returns 403 and leaves the batch EXPORTED."
        test_recipe:
          setup: ["One payroll batch prepared to EXPORTED (empty batch is legal)"]
          setup_api_calls:
            - call: "POST /erp/payroll-batches"
              payload: { period_label: "2026-08A" }
              as: PayrollProcessor
              captures: { batch_id: $.data.id }
            - call: "POST /erp/payroll-batches/${batch_id}/seal"
              as: PayrollProcessor
            - call: "POST /erp/payroll-batches/${batch_id}/export"
              as: PayrollProcessor
          trigger:
            - call: "POST /erp/payroll-batches/${batch_id}/confirm-paid"
              as: PayrollProcessor
              captures: { err: $.data.error_id }
            - call: "POST /erp/payroll-batches/${batch_id}/confirm-paid"
              as: TalentAdmin
              captures: { st: $.data.status }
          assert:
            - "PayrollProcessor confirm: ERR_FORBIDDEN (403)"
            - "TalentAdmin confirm: status == CONFIRMED_PAID"

