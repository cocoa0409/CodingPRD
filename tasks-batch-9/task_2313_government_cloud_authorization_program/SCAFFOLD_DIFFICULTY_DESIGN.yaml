- rule_id: non_linear_state_machine
  instances:
  - name: package_review_cycle_ends_in_rejection_on_the_third_revision_request
    grounds:
    - state_machines.AuthorizationPackage.UNDER_REVIEW_to_REVISION_REQUESTED
    - state_machines.AuthorizationPackage.UNDER_REVIEW_to_REJECTED
    - state_machines.AuthorizationPackage.REVISION_REQUESTED_to_SUBMITTED
    - state_machines.AssessmentEngagement.REPORT_DELIVERED_to_VOIDED
    - entities.AuthorizationPackage.fields.submission_round
    distinguishing_aspect: The SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED loop is traversed three times
      and the same revision-request trigger changes target state on the third pass (REVISION_REQUESTED for submission_round
      1 and 2, REJECTED at submission_round 3), and the REJECTED leg voids the engagement while leaving its two COMPLETED
      slots and their 20.00 allocated hours untouched.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z -> 2026-03-30T00:00:00Z; offering AGENCY_SPONSORED with coverage 100.00 and budget 400000.00.
      - Engagement 200 h / 120000.00 with two test slots (8.00 h and 12.00 h) that both became COMPLETED at report delivery;
        allocated_hours 20.00, unallocated_hours 180.00.
      - Package created, then submitted / reviewed / revision-requested twice, and submitted and reviewed a third time so
        submission_round == 3 and status == UNDER_REVIEW.
