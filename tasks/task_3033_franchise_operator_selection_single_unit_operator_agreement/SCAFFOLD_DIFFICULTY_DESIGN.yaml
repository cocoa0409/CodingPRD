      - name: scorecard_period_overlap_rejected_on_intersection
        grounds:
          - validations[priority=13]
          - errors.ERR_SCORECARD_OVERLAP
          - entities.Scorecard.fields.period_start_on
        distinguishing_aspect: |
          Interval semantics = half-open window intersection on the Operator
          resource: a new PUBLISHED scorecard whose [period_start_on,
