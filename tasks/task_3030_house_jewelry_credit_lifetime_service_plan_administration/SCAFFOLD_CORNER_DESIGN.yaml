            - "CreditApplication.${application_id}.decision_tier == TIER_1 and approved_limit_cents == 400000"
            - "Customer.${customer_id}.account_status == OPEN and standalone_credit_limit_cents == 400000"
            - "credit_tier_from_plan_mix_and_inspection_streak leaves Customer.${customer_id}.credit_tier == TIER_1"

      - name: countered_offer_acceptance_is_refused_for_a_non_owner
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "The same accept call with another customer's id in X-User-ID is refused with ERR_NOT_RESOURCE_OWNER at 403, which outranks the state check it would otherwise pass."
        test_recipe:
          setup:
