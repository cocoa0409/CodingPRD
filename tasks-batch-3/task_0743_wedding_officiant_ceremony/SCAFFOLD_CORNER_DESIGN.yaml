          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /officiants"
              payload: { full_name: "No Auth", email: "na@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_officiant_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[date-hold-stale-officiant]"
          - "errors[ERR_STALE_OFFICIANT_VERSION]"
        distinguishing_aspect: "After a first hold advances Officiant.version, a second POST /date-holds carrying the pre-hold expected_officiant_version is rejected with ERR_STALE_OFFICIANT_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["Officiant ACTIVE (version captured as ${off_v}); two bookings on far-apart dates; hold placed on the first, advancing officiant.version so ${off_v} is now stale"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Gus F", email: "gusf@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Gu", partner_two_name: "Hi", email: "ghi@x.com", phone: "555-0223" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Gap Hall", jurisdiction: "CA", address: "42 Gap" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${b1_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-12-01T15:00:00Z", ceremony_end: "2026-12-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /date-holds"
              payload: { booking_id: "${b2_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_OFFICIANT_VERSION"

      - name: expiry_sweep_expires_stale_hold_and_booking
        claim_type: scheduled_actions
        grounds: [state_machines.DateHold.HELD_to_EXPIRED, state_machines.Booking.HOLD_to_EXPIRED]
        distinguishing_aspect: "After clock passes a hold's expires_at, POST /_expiry/run transitions the HELD DateHold to EXPIRED and its HOLD booking to EXPIRED, and decrements Officiant.active_hold_count to 0."
        test_recipe:
          setup: ["Booking placed to HOLD at 2026-03-01 (expires 2026-03-15); clock advanced to 2026-03-16"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Hal G", email: "halg@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Ha", partner_two_name: "Ij", email: "hij@x.com", phone: "555-0224" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Hub Hall", jurisdiction: "CA", address: "43 Hub" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${bk_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { hold_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /_expiry/run"
              payload: {}
              as: Coordinator
          assert:
            - "DateHold.${hold_id}.status == EXPIRED"
            - "Booking.${bk_id}.status == EXPIRED"
            - "Officiant.${off_id}.active_hold_count == 0"

      - name: cascade_suspend_multi_entity_revert
        claim_type: cascading_side_effects
        grounds: [state_machines.Officiant.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / suspend_cascade_officiant_booking_script_rehearsal_depth3
          rationale: "The suspend cascade (Booking->Script->Rehearsal) is fully asserted by the named §1.8 depth-3 instance."

      - name: cancel_release_hold_slot_restore
        claim_type: derived_field_reconciliation
        grounds: [entities.Officiant.fields.active_hold_count]
        excluded_because:
          difficulty_instance: compensating_invariant / hold_slot_count_conserved_on_release
          rationale: "active_hold_count reconciliation on release is asserted by the named §1.8 invariant instance."

