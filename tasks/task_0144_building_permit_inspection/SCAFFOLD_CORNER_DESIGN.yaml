          - endpoints[POST /permits/{id}/issue]
          - entities.PermitApplication.fields.version
        distinguishing_aspect: "Issue with the correct expected_permit_application_version succeeds (status ISSUED) and increments PermitApplication.version by 1."
        test_recipe:
          setup:
            - "Permit APPROVED + fully paid with verified contractor; client captured version pv."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-o3", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Co3", license_number: "O-3", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "RevO3", cert_number: "OC-3" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "APPROVED" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 165.00 }
              as: Applicant
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: PermitClerk
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
              captures: { new_v: $.data.version, st: $.data.status }
          assert:
            - "PermitApplication.${permit_id}.status == ISSUED"
            - "PermitApplication.${permit_id}.version == ${pv} + 1"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_fee_visible_in_create_response
        claim_type: immediate
        grounds:
          - calculations.total_permit_fee
          - entities.PermitApplication.fields.total_permit_fee
        distinguishing_aspect: "Computed total_permit_fee is present in the same POST /permits 201 response (immediate consistency), not requiring a follow-up read; 7755.00 for declared_valuation 600000."
        test_recipe:
          setup:
            - "A Jurisdiction and Contractor."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-cm1", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ccm1", license_number: "M-1", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "NEW_CONSTRUCTION", fee_method: "VALUATION", declared_valuation: 600000 }
              as: Applicant
              captures: { tot: $.data.total_permit_fee }
          assert:
            - "POST /permits response data.total_permit_fee == 7755.00"
