            - "ProductModel.${pm_id}.version == 1 (the rejected pattern write did not consume the OCC guard)"

      - name: body_foreign_keys_must_reference_existing_rows_on_a_flat_topology
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - validations[5]
          - errors.ERR_PRODUCT_MODEL_NOT_FOUND
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_RECALL_NOT_FOUND
        distinguishing_aspect: |
          The topology is FLAT: every relationship is a body-level foreign key
          rather than a URL ancestor, so parent validation happens at priority 5
          against the BODY. Each dangling key must report the code of the entity it
          failed to find — a notification quoting a bad retailer_id must say
          ERR_RETAILER_NOT_FOUND, not the recall's code — which is the failure mode
          a shared 404 hides.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one Retailer exists; no Recall exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/retailers"
              payload: { name: "MegaMart", channel_type: "BIG_BOX", store_count: 120 }
              as: ProgramAdmin
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "00000000-0000-0000-0000-000000000000", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Report against a model that does not exist." }
              as: IntakeSpecialist
            - call: "POST /product-safety/retailer-notifications"
              payload: { recall_id: "00000000-0000-0000-0000-000000000000", retailer_id: "${ret_id}" }
              as: ComplianceOfficer
            - call: "POST /product-safety/audit-visits"
              payload: { retailer_notification_id: "00000000-0000-0000-0000-000000000000", window_start: "2026-03-17T09:00:00Z", window_end: "2026-03-17T17:00:00Z" }
              as: FieldAuditor
          assert:
            - "call 1 returns HTTP 404 ERR_PRODUCT_MODEL_NOT_FOUND"
            - "call 2 returns HTTP 404 ERR_RECALL_NOT_FOUND (the recall_id is the dangling key; retailer_id is valid)"
            - "call 3 returns HTTP 404 ERR_RETAILER_NOTIFICATION_NOT_FOUND"
            - "Retailer.${ret_id}.open_stop_sale_count == 0 (no partial writes)"

  # ===========================================================================
  - section: State Machines
    instances:

      - name: all_twelve_machines_open_in_their_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines[*].initial_state
        distinguishing_aspect: |
          Twelve machines across eleven entities, and Recall carries TWO of them
          (plan_status and notification_status) that must both open at their own
          initial value on the same row. The probe walks one fresh row per machine
          and checks nothing but the opening state, which is the cheapest guard
          against an implementation that starts a row in the state its first
          transition would reach.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "the canonical fixture chain F1 up to and including the ACCEPTED SectionReport, so every downstream create is legal"
