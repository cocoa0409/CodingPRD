              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio maintained", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"] }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "NU-501", title: "Menus posted for the current week", category: "NUTRITION", default_severity: "MINOR", age_groups_applicable: ["PRESCHOOL", "SCHOOL_AGE"] }
