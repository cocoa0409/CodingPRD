scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — dual_variant_calc
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_after_audit
        grounds:
          - calculations.provisional_premium_calculate
          - calculations.final_premium_calculate
          - entities.Policy.fields.provisional_premium_cents
          - entities.Policy.fields.final_premium_cents
          - state_machines.PayrollAudit.SUBMITTED_to_POSTED
        distinguishing_aspect: |
          Same premium formula, two variants keyed on payroll_basis_cents vs
          audited_payroll_cents — a single production/policy entity domain
          (Policy) exhibits provisional-vs-final dual-variant arithmetic.
        test_recipe:
          setup:
            - "Production P1 ACTIVE with budget_cents=5000000_00"
            - "CastMember cm1 role_tier=STUNT with physical_exam_status=CLEARED, essential_element=false"
            - "CastMember cm2 role_tier=PRINCIPAL with physical_exam_status=CLEARED, essential_element=true"
            - "Policy pol_cast on P1 with coverage_line=CAST, payroll_basis_cents=1000000_00, BOUND with provisional_premium_cents computed"
            - "PayrollAudit scheduled on pol_cast with reported_payroll_cents=1200000_00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-D1"
                title: "Dual Variant Show"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 500000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Stunt One", role_tier: "STUNT", weekly_salary_cents: 500000, essential_element: false }
              as: ProductionManager
              captures: { cm1_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Principal Two", role_tier: "PRINCIPAL", weekly_salary_cents: 800000, essential_element: true }
              as: ProductionManager
              captures: { cm2_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members/${cm1_id}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/cast-members/${cm2_id}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "CAST"
                carrier_code: "CHUBB"
                policy_number: "CHU-CAST-001"
                limit_cents: 10000000
                aggregate_limit_cents: 20000000
                deductible_cents: 50000
                effective_date: "2026-05-15T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 100000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
              captures: { prov_prem: $.data.provisional_premium_cents }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits"
              payload:
                audit_period_start: "2026-05-15T00:00:00Z"
                audit_period_end: "2026-11-30T00:00:00Z"
                auditor_name: "External Audits LLC"
                reported_payroll_cents: 120000000
              as: ExternalAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/submit"
              payload: {}
              as: ExternalAuditor
          trigger:
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/post"
              payload: {}
              as: BrokerAgent
              captures: { final_prem: $.data.id }
            - call: "GET /productions/${prod_id}/policies/${pol_id}"
              payload: {}
              as: BrokerAgent
              captures: { final_premium: $.data.final_premium_cents, prov_premium: $.data.provisional_premium_cents, audited_payroll: $.data.audited_payroll_cents }
          assert:
            - "Policy.${pol_id}.provisional_premium_cents == 4550000"   # 100000000 * 0.0275 * 1.00 * 1.10 * 1.20 = 3630000; see note below
            - "Policy.${pol_id}.audited_payroll_cents == 120000000"
            - "Policy.${pol_id}.final_premium_cents != Policy.${pol_id}.provisional_premium_cents"
            - "PayrollAudit premium_delta_cents == final_premium_cents - provisional_premium_cents"

      - name: posture_derive_varies_with_clearance_vs_claim_states
        grounds:
          - calculations.production_posture_derive
          - calculations.loss_ratio_calculate
          - entities.Production.fields.coverage_posture
        distinguishing_aspect: |
          Two dual-variant computations on different entity domains:
          production_posture_derive on Production varies by claim/clearance
          state, while loss_ratio_calculate on Policy varies by claims-vs-
          premium balance. Different inputs produce different observable outputs.
        test_recipe:
          setup:
            - "Production P1 ACTIVE with all mandatory clearances CLEARED and no open INJURY claims → posture BOUND_FULL"
            - "Production P2 identical except one INJURY claim in UNDER_REVIEW → posture RESTRICTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-D2A"
                title: "Posture Show A"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 50000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { p1_id: $.data.id }
            - call: "POST /productions"
              payload:
                production_code: "PRD-D2B"
                title: "Posture Show B"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 50000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { p2_id: $.data.id }
            # P1: bind GL policy
            - call: "POST /productions/${p1_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-001"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { p1_gl: $.data.id }
            - call: "GET /productions/${p1_id}"
              payload: {}
              as: BrokerAgent
              captures: { p1_v: $.data.version }
            - call: "POST /productions/${p1_id}/policies/${p1_gl}/bind"
              payload: { expected_production_version: "${p1_v}" }
              as: BrokerAgent
            # P1: activate production
            - call: "POST /productions/${p1_id}/activate"
              payload: {}
              as: BrokerAgent
            # P2: same setup, then add an INJURY claim
            - call: "POST /productions/${p2_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-002"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { p2_gl: $.data.id }
            - call: "GET /productions/${p2_id}"
              payload: {}
              as: BrokerAgent
              captures: { p2_v: $.data.version }
            - call: "POST /productions/${p2_id}/policies/${p2_gl}/bind"
              payload: { expected_production_version: "${p2_v}" }
              as: BrokerAgent
            - call: "POST /productions/${p2_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${p2_id}/claims"
              payload:
                policy_id: "${p2_gl}"
                claim_type: "INJURY"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 500000
              as: ProductionManager
              captures: { p2_claim: $.data.id }
            - call: "POST /productions/${p2_id}/claims/${p2_claim}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "GET /productions/${p1_id}"
              payload: {}
              as: BrokerAgent
              captures: { p1_posture: $.data.coverage_posture }
            - call: "GET /productions/${p2_id}"
              payload: {}
              as: BrokerAgent
              captures: { p2_posture: $.data.coverage_posture }
          assert:
            - "Production.${p1_id}.coverage_posture == BOUND_PARTIAL"  # COMMERCIAL only requires GL+EQUIPMENT, EQUIPMENT missing
            - "Production.${p2_id}.coverage_posture == RESTRICTED"
            - "Production.${p2_id}.posture_reasons contains 'OPEN_INJURY_CLAIM'"

  # ============================================================
  # Rule 2 — combinatorial_formula
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cast_premium_combinatorial_loadings
        grounds:
          - calculations.provisional_premium_calculate
          - entities.Policy.fields.provisional_premium_cents
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of ≥3 inputs (base_rate ×
          risk_multiplier × stunt_loading × essential_element_loading)
          with conditional branches on coverage_line and role_tier.
        test_recipe:
          setup:
            - "Production FEATURE with 2 STUNT cast and 1 PRINCIPAL essential_element=true"
            - "CAST policy with payroll_basis_cents=1000000_00, all cast exams CLEARED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-C1"
                title: "Combinatorial Show"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 500000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Stunt A", role_tier: "STUNT", weekly_salary_cents: 500000, essential_element: false }
              as: ProductionManager
              captures: { cm_a: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Stunt B", role_tier: "STUNT", weekly_salary_cents: 500000, essential_element: false }
              as: ProductionManager
              captures: { cm_b: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Principal C", role_tier: "PRINCIPAL", weekly_salary_cents: 1000000, essential_element: true }
              as: ProductionManager
              captures: { cm_c: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members/${cm_a}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/cast-members/${cm_b}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/cast-members/${cm_c}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "CAST"
                carrier_code: "CHUBB"
                policy_number: "CHU-CAST-C1"
                limit_cents: 50000000
                aggregate_limit_cents: 100000000
                deductible_cents: 100000
                effective_date: "2026-05-15T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 100000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
          trigger:
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
              captures: { premium: $.data.provisional_premium_cents }
          assert:
            # premium = round_half_up(100000000 * 0.0275 * 1.00 * 1.20 * 1.20)
            #         = round_half_up(100000000 * 0.0275) = 2750000
            #         then * 1.00 (FEATURE) = 2750000
            #         then * stunt_loading: 2 stunts -> 1.0 + 0.10*2 = 1.20 -> 3300000
            #         then * essential_element_loading 1.20 -> 3960000
            - "Policy.${pol_id}.provisional_premium_cents == 3960000"

      - name: bond_premium_per_tier_rounding
        grounds:
          - calculations.bond_premium_calculate
          - entities.CompletionBond.fields.bond_premium_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters: per-tier round_half_up
          THEN sum; sum-then-round would produce a different cent total.
        test_recipe:
          setup:
            - "Production FEATURE with budget_cents=20000000_00 ($200k) and requires_completion_bond=true"
            - "CompletionBond application with bond_amount_cents=15000000_00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-C2"
                title: "Bond Rounding Show"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 2000000000
                requires_completion_bond: true
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/completion-bond"
              payload:
                surety_company: "SuretyCo"
                bond_amount_cents: 1500000000
              as: ProductionManager
              captures: { bond_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/completion-bond/underwrite"
              payload: {}
              as: SuretyUnderwriter
              captures: { bond_prem: $.data.bond_premium_cents }
          assert:
            # bond_amount = 1500000000 cents
            # Tier 1: 0 .. 100000000 -> base 100000000, rate 0.0200 -> 2000000 cents
            # Tier 2: 100000000 .. 500000000 -> base 400000000, rate 0.0150 -> 6000000 cents
            # Tier 3: 500000000 .. 2500000000 -> base 1000000000, rate 0.0110 -> 11000000 cents
            # bond_amount (1500000000) <= tier3_upper (2500000000), so tier 3 covers 500000000..1500000000 = 1000000000
            # Tier 4 not entered.
            # Sum of per-tier rounded: 2000000 + 6000000 + 11000000 = 19000000
            - "CompletionBond.${bond_id}.bond_premium_cents == 19000000"
            - "CompletionBond.${bond_id}.strike_price_cents == 1500000000"

  # ============================================================
  # Rule 3 — non_linear_state_machine
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_under_review_adjust_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_ADJUSTED
          - state_machines.Claim.ADJUSTED_to_UNDER_REVIEW
          - entities.Claim.fields.reserve_cents
        distinguishing_aspect: |
          Claim entity cycles UNDER_REVIEW ↔ ADJUSTED — a cycle (A→B→A)
          on the Claim entity, demonstrating a revision loop on claims.
        test_recipe:
          setup:
            - "Production P ACTIVE with GL policy BOUND"
            - "Claim c1 SUBMITTED then acknowledged → UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-N1"
                title: "Claim Cycle Show"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-N1"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "DAMAGE"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 5000000
              as: ProductionManager
              captures: { claim_id: $.data.id }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /productions/${prod_id}/claims/${claim_id}/adjust"
              payload: { new_reserve_cents: 3000000 }
              as: ClaimsAdjuster
              captures: { s1: $.data.status }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/adjust"
              payload: { new_reserve_cents: 4500000 }
              as: ClaimsAdjuster
              captures: { s2: $.data.status, r2: $.data.reserve_cents }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/adjust"
              payload: { new_reserve_cents: 2000000 }
              as: ClaimsAdjuster
              captures: { s3: $.data.status, r3: $.data.reserve_cents }
          assert:
            - "Claim.${claim_id} visited UNDER_REVIEW -> ADJUSTED -> UNDER_REVIEW -> ADJUSTED across three consecutive adjust calls"
            - "Final Claim.${claim_id}.reserve_cents == 2000000"
            - "Claim events log includes at least 3 ADJUST_RESERVE entries"

      - name: payroll_audit_dispute_resubmit_cycle
        grounds:
          - state_machines.PayrollAudit.SUBMITTED_to_DISPUTED
          - state_machines.PayrollAudit.DISPUTED_to_SUBMITTED
          - entities.PayrollAudit.fields.status
        distinguishing_aspect: |
          PayrollAudit entity cycles SUBMITTED ↔ DISPUTED — a separate
          cycle on a different entity than Claim, demonstrating revision
          loops on audits.
        test_recipe:
          setup:
            - "Production P ACTIVE with BOUND policy"
            - "PayrollAudit scheduled on policy"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-N2"
                title: "Audit Cycle Show"
                production_type: "EPISODIC"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-N2"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 50000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits"
              payload:
                audit_period_start: "2026-05-01T00:00:00Z"
                audit_period_end: "2026-08-01T00:00:00Z"
                auditor_name: "Auditors R Us"
                reported_payroll_cents: 55000000
              as: ExternalAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/submit"
              payload: {}
              as: ExternalAuditor
          trigger:
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/dispute"
              payload: {}
              as: ProductionManager
              captures: { st1: $.data.status }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/submit"
              payload: {}
              as: ExternalAuditor
              captures: { st2: $.data.status }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/payroll-audits/${audit_id}/dispute"
              payload: {}
              as: ProductionManager
              captures: { st3: $.data.status }
          assert:
            - "PayrollAudit.${audit_id} transitioned SUBMITTED → DISPUTED → SUBMITTED → DISPUTED"
            - "PayrollAudit.${audit_id}.status == DISPUTED at end of trigger chain"

  # ============================================================
  # Rule 4 — transitive_cascade
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: production_cancel_cascade_depth3
        grounds:
          - state_machines.Production.ACTIVE_to_CANCELLED
          - state_machines.Policy.BOUND_to_CANCELLED
          - state_machines.CastEndorsement.ISSUED_to_REVOKED
          - state_machines.Certificate.ISSUED_to_VOIDED
          - calculations.production_posture_derive
        distinguishing_aspect: |
          Production cancel → Policy cancel → CastEndorsement revoke →
          posture recompute: a 4-link transitive cascade from a single
          Production-level trigger.
        test_recipe:
          setup:
            - "Production P ACTIVE with one BOUND CAST policy, one ISSUED endorsement, one ISSUED certificate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-T1"
                title: "Cascade Show"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 500000000
                requires_completion_bond: false
