              captures: { com_b: $.data.id, ver_b: $.data.version }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer C", buyer_user_id: "buyer-3", variety: "STRAWBERRY", volume_commitment_lbs: 300.00, price_cents_per_lb: 380, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com_c: $.data.id, ver_c: $.data.version }
          trigger:
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com_b}", allocated_lbs: 50.00, expected_buyer_commitment_version: "${ver_b}" }
