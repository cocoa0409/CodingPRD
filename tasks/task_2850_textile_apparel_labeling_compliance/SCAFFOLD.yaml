scenario: |
  Textile & Apparel Labeling Compliance (apparel brand regulatory compliance): fiber content
  determination with laboratory testing and tolerance rules for stated percentages, country of
  origin determination under substantial transformation and yarn-forward rules, care instruction
  development with wash testing to substantiate the instructions given, registered identification
  number or company name display requirements, permanent label placement, language and durability
  requirements including for products sold in multiple markets, hangtag and marketing claim
  consistency with the permanent label, imported goods marking at customs with penalty exposure,
  private-label and licensee labeling responsibility allocation, audits and correction of
  mislabeled inventory.
domain_name: "textile-apparel-labeling-compliance"
api_prefix: "/labeling"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Graph constraint"
  difficulty_level: "expert"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Style sits at the centre of a many-to-many web: MaterialInput forms a self-referential
  # supply DAG (FIBER -> YARN -> FABRIC -> CUT_AND_SEW), LabelSpec is itself self-referential
  # (a HANGTAG row points at the PERMANENT_LABEL row it must agree with) and pins two foreign
  # evidence rows (OriginDetermination, LabTest), and AuditFinding joins ComplianceAudit,
  # Style and a corrective LabelSpec across aggregate boundaries.

  state_machine_shape: parallel
  # Style carries two INDEPENDENT state dimensions on the same row
  # (substantiation_state x origin_state), each of which is itself cyclic.
  # LabelSpec is cyclic (PENDING_APPROVAL -> REVISION_REQUESTED -> DRAFT -> PENDING_APPROVAL),
  # LabTest is branching-plus-cyclic (BENCH_RESERVED -> {PASSED, FAILED}, FAILED -> BENCH_RESERVED),
  # ComplianceAudit is compound-plus-cyclic (state derived from child findings, PENDING_CLOSURE
  # falls back to IN_REVIEW when a finding is reopened).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # LabelingSpecialist authors and edits a LabelSpec and records inventory dispositions;
  # LabelingApprover approves / requests revision / publishes / withdraws it and MUST NOT
  # share an X-User-ID with the spec's authored_by_user_id. AccreditedLab is the only role
  # that may post evidence, CustomsOfficer the only role that may assess marking penalties,
  # Auditor the only role that may verify or reopen a finding.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal company name printed on the permanent label when rn_number is absent"
        constraints: "1..120 characters, non-blank after trim"
      - name: party_type
        type: enum
        source: input
        description: "Which kind of trade party this brand is"
        constraints: "BRAND_OWNER | PRIVATE_LABEL_RETAILER | LICENSEE"
      - name: rn_number
        type: string
        source: input
        description: "Registered identification number; null means the label MUST display legal_name instead"
        default: null
        constraints: "matches ^RN[0-9]{5}$ when present, else null"
      - name: licensor_brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the licensor whose marks this LICENSEE prints. Required when party_type == LICENSEE, MUST be null otherwise"
        default: null
      - name: responsibility_mode
        type: enum
        source: input
        description: "Which party is of record for label accuracy and marking-penalty exposure"
        constraints: "SELF_OF_RECORD | LICENSOR_OF_RECORD"
      - name: responsible_brand_id
        type: string
        source: computed
        description: "Brand of record for label accuracy: equals licensor_brand_id when responsibility_mode == LICENSOR_OF_RECORD, else equals this row's own id"
      - name: outstanding_penalty_usd
        type: number
        source: computed
        description: "Marking-penalty ledger of record for this brand; see calculations.brand_penalty_ledger"
        default: 0.00
        constraints: "2 decimal places, >= 0.00"
      - name: critical_audit_finding_count
        type: integer
        source: computed
        description: "Sum of ComplianceAudit.critical_finding_count over every audit whose audited brand resolves through responsible_of() to this row; recomputed by calculations.brand_posture"
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Gate on label publication and on marking-penalty escalation; see calculations.brand_posture"
        default: "OPEN"
        constraints: "OPEN | RESTRICTED | SUSPENDED"

  - name: MarketRequirement
    parent: null
    common_fields: false
    fields:
      - name: market_code
        type: string
        source: input
        description: "Sales market this requirement row governs; unique across all rows"
        constraints: "uppercase A-Z and underscore, 2..8 characters, e.g. US, CA, MX, EU_FR"
      - name: required_languages
        type: array
        source: input
        description: "ISO 639-1 lowercase language codes that MUST all appear in a permanent label sold into this market"
        constraints: "non-empty array of distinct 2-letter lowercase codes"
      - name: fiber_tolerance_pp
        type: number
        source: input
        description: "Allowed absolute deviation, in percentage points, between a declared fiber percentage and the laboratory-measured percentage"
        constraints: "0.0 <= value <= 5.0, one decimal place"
      - name: absolute_claim_tolerance_pp
        type: number
        source: input
        description: "Tolerance that replaces fiber_tolerance_pp when the declaration is an absolute claim (exactly one non-exempt line at 100.0)"
        constraints: "0.0 <= value <= 1.0, one decimal place"
      - name: min_durability_cycles
        type: integer
        source: input
        description: "Minimum number of wash cycles the permanent label must remain legible for in this market"
        constraints: ">= 0"
      - name: marking_duty_rate
        type: number
        source: input
        description: "Ad valorem marking-duty rate applied to an entry found marking-deficient at this market's port"
        constraints: "0.0 <= value <= 0.5, three decimal places"
      - name: requires_identity_disclosure
        type: boolean
        source: input
        description: "Whether the permanent label must disclose an RN or the company legal name"
        default: true
      - name: requires_origin_statement
        type: boolean
        source: input
        description: "Whether the permanent label must carry a country-of-origin statement"
        default: true

  - name: Style
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand that owns this style"
      - name: style_code
        type: string
        source: input
        description: "Brand-facing style number; unique per brand_id"
        constraints: "1..32 characters"
      - name: product_class
        type: enum
        source: input
        description: "Garment class; selects the durability factor in calculations.durability_adequacy"
        constraints: "WOVEN_OUTERWEAR | KNIT_TOP | HOSIERY | HOME_TEXTILE"
      - name: target_market_codes
        type: array
        source: input
        description: "MarketRequirement.market_code values this style will be sold into; every entry MUST resolve to a registered MarketRequirement row"
        constraints: "non-empty array of distinct market codes"
      - name: net_weight_grams
        type: number
        source: input
        description: "Finished-garment net weight used as the denominator in yarn-forward weight checks"
        constraints: "> 0, one decimal place"
      - name: declared_fibers
        type: array
        source: input
        description: "Fiber declaration lines, each an object {fiber_generic_name: string, declared_pct: number (one decimal), ornamentation_exempt: boolean}"
        default: []
        constraints: "fiber_generic_name is uppercase A-Z and spaces, distinct within the array; declared_pct sums to exactly 100.0 when the array is non-empty"
      - name: substantiation_state
        type: enum
        source: system
        description: "Fiber-content dimension of this row's parallel state machine"
        default: "FIBER_DECLARED"
        constraints: "FIBER_DECLARED | FIBER_TEST_PENDING | FIBER_SUBSTANTIATED | FIBER_MISSTATED"
      - name: origin_state
        type: enum
        source: system
        description: "Country-of-origin dimension of this row's parallel state machine; evolves independently of substantiation_state"
        default: "ORIGIN_UNDETERMINED"
        constraints: "ORIGIN_UNDETERMINED | ORIGIN_DRAFTED | ORIGIN_ISSUED"
      - name: label_readiness
        type: enum
        source: computed
        description: "READY when substantiation_state == FIBER_SUBSTANTIATED AND origin_state == ORIGIN_ISSUED, else BLOCKED"
        default: "BLOCKED"
        constraints: "READY | BLOCKED"
      - name: effective_fiber_content_text
        type: string
        source: computed
        description: "Canonical printable fiber string; see calculations.effective_fiber_content_text. Empty string when declared_fibers is empty"
        default: ""

  - name: MaterialInput
    parent: Style
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style whose supply graph this node belongs to"
      - name: parent_input_id
        type: string
        source: input
        description: "FK -> MaterialInput.id; the upstream node this node was made from. Null marks a graph root. MUST reference a node of the same style_id"
        default: null
      - name: stage
        type: enum
        source: input
        description: "Processing stage performed in country_code; STAGE_RANK is FIBER=1, YARN=2, FABRIC=3, CUT_AND_SEW=4, TRIM=0"
        constraints: "FIBER | YARN | FABRIC | CUT_AND_SEW | TRIM"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country where this stage was performed"
        constraints: "exactly 2 uppercase letters"
      - name: value_added_usd
        type: number
        source: input
        description: "Value added at this stage; the ranking metric of the substantial-transformation variant"
        constraints: ">= 0.00, 2 decimal places"
      - name: weight_grams
        type: number
        source: input
        description: "Fiber weight passing through this stage; the ranking metric of the yarn-forward variant"
        constraints: ">= 0.0, one decimal place"
      - name: is_ornamentation
        type: boolean
        source: input
        description: "Ornamentation nodes are excluded from both origin variants"
        default: false
      - name: depth
        type: integer
        source: computed
        description: "0 when parent_input_id is null, else parent.depth + 1"
        default: 0

  - name: LabTest
    parent: Style
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style whose specimen was submitted"
      - name: test_type
        type: enum
        source: input
        description: "FIBER_CONTENT tests substantiate declared_fibers; CARE_PERFORMANCE tests substantiate a label care code set"
        constraints: "FIBER_CONTENT | CARE_PERFORMANCE"
      - name: lab_code
        type: string
        source: input
        description: "Accredited laboratory identifier; (lab_code, method) is the bench resource whose occupancy intervals are capacity-checked"
        constraints: "1..16 characters, uppercase letters, digits and hyphens"
      - name: method
        type: enum
        source: input
        description: "Test method; AATCC_20A and ISO_1833 are FIBER_CONTENT methods, AATCC_135 and ISO_6330 are CARE_PERFORMANCE methods"
        constraints: "AATCC_20A | ISO_1833 | AATCC_135 | ISO_6330"
      - name: specimen_received_at
        type: datetime
        source: input
        description: "Start of the bench occupancy interval. Every datetime field in this scaffold, on input and on output, is an ISO 8601 UTC instant rendered with second precision and a trailing Z, e.g. 2026-08-03T09:00:00Z; no fractional-second digits are ever emitted or accepted"
      - name: results_due_at
        type: datetime
        source: input
        description: "Nominal end of bench work; the occupancy interval extends CONDITIONING_BUFFER_HOURS past this instant. MUST be strictly after specimen_received_at"
      - name: wash_temp_c
        type: integer
        source: input
        description: "Wash temperature in Celsius substantiated by a CARE_PERFORMANCE run; MUST be null for FIBER_CONTENT and non-null for CARE_PERFORMANCE"
        default: null
        constraints: "20 | 30 | 40 | 60 | 95 when present"
      - name: cycles_run
        type: integer
        source: input
        description: "Wash cycles actually run; posted with results, null until then"
        default: null
        constraints: ">= 0 when present"
      - name: measured_fibers
        type: array
        source: input
        description: "Laboratory result lines, each an object {fiber_generic_name: string, measured_pct: number (one decimal)}; posted with results"
        default: null
      - name: dimensional_change_pct
        type: number
        source: input
        description: "Signed dimensional change after cycles_run washes, one decimal place; posted with results"
        default: null
      - name: colorfastness_grade
        type: number
        source: input
        description: "Grey-scale colorfastness grade, one decimal place; posted with results"
        default: null
        constraints: "1.0 <= value <= 5.0 when present"
      - name: legibility_cycles
        type: integer
        source: input
        description: "Number of wash cycles after which the sewn-in label was still legible; posted with results and consumed by calculations.durability_adequacy"
        default: null
        constraints: ">= 0 when present"
      - name: state
        type: enum
        source: system
        description: "Bench and evidence lifecycle of this test row"
        default: "BENCH_RESERVED"
        constraints: "BENCH_RESERVED | PASSED | FAILED | SUPERSEDED"
      - name: attempt_no
        type: integer
        source: system
        description: "1 on the original reservation, incremented by one on every retest of this same row"
        default: 1
      - name: result_delta_pp_max
        type: number
        source: computed
        description: "Largest absolute declared-vs-measured deviation in percentage points; null for CARE_PERFORMANCE and until results are posted"
        default: null
      - name: valid_until
        type: datetime
        source: computed
        description: "specimen_received_at + FIBER_TEST_VALIDITY_DAYS for FIBER_CONTENT, + CARE_TEST_VALIDITY_DAYS for CARE_PERFORMANCE"

  - name: OriginDetermination
    parent: Style
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style whose supply graph was evaluated"
      - name: state
        type: enum
        source: system
        description: "Determination lifecycle"
        default: "DRAFT"
        constraints: "DRAFT | ISSUED | SUPERSEDED | VOID"
      - name: method_pinned
        type: enum
        source: system
        description: "Origin rule selected at issuance; null while DRAFT"
        default: null
        constraints: "SUBSTANTIAL_TRANSFORMATION | YARN_FORWARD when present"
      - name: st_country
        type: string
        source: computed
        description: "Country the substantial-transformation variant selects; frozen at creation time from the style's supply graph"
      - name: yf_country
        type: string
        source: computed
        description: "Country the yarn-forward variant selects; frozen at creation time from the style's supply graph"
      - name: divergent
        type: boolean
        source: computed
        description: "True when st_country != yf_country"
      - name: determined_country
        type: string
        source: computed
        description: "st_country when method_pinned == SUBSTANTIAL_TRANSFORMATION, yf_country when method_pinned == YARN_FORWARD, null while DRAFT"
        default: null
      - name: graph_node_count
        type: integer
        source: computed
        description: "Number of non-ornamentation MaterialInput rows of the style at creation time"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which state became ISSUED; null otherwise"
        default: null

  - name: LabelSpec
    parent: Style
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style this artifact is printed for"
      - name: artifact_type
        type: enum
        source: system
        description: "PERMANENT_LABEL for rows created by POST /labeling/label-specs, HANGTAG for rows created by POST /labeling/label-specs/{id}/hangtags"
        constraints: "PERMANENT_LABEL | HANGTAG"
      - name: parent_label_spec_id
        type: string
        source: input
        description: "FK -> LabelSpec.id; the PERMANENT_LABEL row this HANGTAG must agree with. Null on PERMANENT_LABEL rows"
        default: null
      - name: origin_determination_id
        type: string
        source: input
        description: "FK -> OriginDetermination.id; the determination pinned into this label content. Null on HANGTAG rows, required on PERMANENT_LABEL rows"
        default: null
      - name: care_test_id
        type: string
        source: input
        description: "FK -> LabTest.id; the CARE_PERFORMANCE run substantiating this label care code set. Null on HANGTAG rows, required on PERMANENT_LABEL rows"
        default: null
      - name: market_codes
        type: array
        source: input
        description: "Markets this artifact is printed for; MUST be a subset of the style target_market_codes"
        constraints: "non-empty array of distinct market codes"
      - name: languages
        type: array
        source: input
        description: "ISO 639-1 lowercase codes actually printed on the artifact"
        constraints: "non-empty array of distinct 2-letter lowercase codes"
      - name: placement_code
        type: enum
        source: input
        description: "Where the artifact is affixed; NOT_PERMANENT is only legal on HANGTAG rows"
        constraints: "NECK_CENTER_INSIDE | SIDE_SEAM_INSIDE | WAISTBAND_INSIDE | NOT_PERMANENT"
      - name: durability_cycles_rating
        type: integer
        source: input
        description: "Wash cycles the label stock is rated to stay legible for, as claimed by the specialist"
        constraints: ">= 0"
      - name: wash_temp_c
        type: integer
        source: input
        description: "Care wash temperature printed on the artifact; MUST equal care_test.wash_temp_c at approval"
        default: null
        constraints: "20 | 30 | 40 | 60 | 95 when present"
      - name: bleach_code
        type: enum
        source: input
        description: "Bleach instruction symbol"
        default: "NO_BLEACH"
        constraints: "NO_BLEACH | NON_CHLORINE_ONLY | ANY_BLEACH"
      - name: dry_code
        type: enum
        source: input
        description: "Drying instruction symbol"
        default: "TUMBLE_LOW"
        constraints: "TUMBLE_LOW | TUMBLE_NORMAL | LINE_DRY | FLAT_DRY"
      - name: iron_code
        type: enum
        source: input
        description: "Ironing instruction symbol"
        default: "IRON_LOW"
        constraints: "IRON_LOW | IRON_MEDIUM | DO_NOT_IRON"
      - name: dryclean_code
        type: enum
        source: input
        description: "Dry-cleaning instruction symbol"
        default: "DO_NOT_DRYCLEAN"
        constraints: "DO_NOT_DRYCLEAN | ANY_SOLVENT | PETROLEUM_ONLY"
      - name: identity_display_mode
        type: enum
        source: input
        description: "Whether the artifact discloses identity by RN or by company legal name"
        constraints: "RN | COMPANY_NAME"
      - name: fiber_content_text
        type: string
        source: input
        description: "Fiber content string exactly as it will be printed"
        constraints: "1..200 characters"
      - name: origin_text
        type: string
        source: input
        description: "Country-of-origin statement exactly as it will be printed; canonical form is Made in {country_code}"
        constraints: "1..64 characters"
      - name: marketing_claims
        type: array
        source: input
        description: "Claim codes printed on a HANGTAG; always empty on PERMANENT_LABEL rows"
        default: []
        constraints: "distinct values from MADE_IN_USA | ORGANIC_COTTON | WRINKLE_FREE"
      - name: state
        type: enum
        source: system
        description: "Artifact approval lifecycle; cyclic through REVISION_REQUESTED"
        default: "DRAFT"
        constraints: "DRAFT | PENDING_APPROVAL | REVISION_REQUESTED | APPROVED | PUBLISHED | WITHDRAWN"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabelingSpecialist that created or last edited this row"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabelingApprover that approved this row; null until approval"
        default: null
      - name: revision_note
        type: string
        source: system
        description: "Note supplied with the most recent revision request; null until one is made"
        default: null
      - name: withdrawn_reason
        type: string
        source: system
        description: "Reason recorded on withdrawal: either an operator note, or one of the three cascade literals AUTO_FIBER_MISSTATED, AUTO_ORIGIN_VOIDED, AUTO_PARENT_WITHDRAWN"
        default: null
      - name: effective_from
        type: datetime
        source: system
        description: "Inclusive start of the market occupancy window; set on publication, null before"
        default: null
      - name: effective_to
        type: datetime
        source: system
        description: "Exclusive end of the market occupancy window; set on publication, null before"
        default: null
      - name: content_hash
        type: string
        source: computed
        description: "Canonical content fingerprint; see calculations.label_content_hash"
      - name: consistency_state
        type: enum
        source: computed
        description: "CONSISTENT or INCONSISTENT for HANGTAG rows, NOT_APPLICABLE for PERMANENT_LABEL rows; see calculations.hangtag_consistency"
        default: "NOT_APPLICABLE"
        constraints: "CONSISTENT | INCONSISTENT | NOT_APPLICABLE"

  - name: ImportShipment
    parent: null
    common_fields: true
    fields:
      - name: importer_brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the importer of record that filed this entry"
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style covered by this entry"
      - name: corrective_label_spec_id
        type: string
        source: input
        description: "FK -> LabelSpec.id; the PERMANENT_LABEL row used to re-mark the goods; null until a correction is filed"
        default: null
      - name: entry_number
        type: string
        source: input
        description: "Customs entry number; unique across all shipments"
        constraints: "1..24 characters"
      - name: quantity_units
        type: integer
        source: input
        description: "Number of garment units on the entry"
        constraints: "> 0"
      - name: declared_value_usd
        type: number
        source: input
        description: "Customs declared value of the entry, 2 decimal places"
        constraints: "> 0.00"
      - name: entry_market_code
        type: string
        source: input
        description: "MarketRequirement.market_code of the port of entry; supplies marking_duty_rate"
      - name: marking_state
        type: enum
        source: system
        description: "Customs marking lifecycle"
        default: "ENTRY_FILED"
        constraints: "ENTRY_FILED | MARKING_COMPLIANT | REDELIVERY_ORDERED | MARKING_CORRECTED"
      - name: deficiency_code
        type: enum
        source: system
        description: "Recorded marking deficiency; null unless a deficient review occurred"
        default: null
        constraints: "MISSING_ORIGIN | WRONG_ORIGIN | MISSING_IDENTITY | NON_PERMANENT_PLACEMENT | LANGUAGE_DEFICIENT when present"
      - name: review_decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the marking review; null before review"
        default: null
      - name: redelivery_deadline_at
        type: datetime
        source: computed
        description: "review_decided_at + REDELIVERY_WINDOW_DAYS; null before review"
        default: null
      - name: posture_at_review
        type: enum
        source: system
        description: "Brand posture frozen at review time excluding this shipment own penalty; pins the escalation multiplier"
        default: null
        constraints: "OPEN | RESTRICTED | SUSPENDED when present"
      - name: assessment_basis
        type: enum
        source: system
        description: "Penalty variant actually applied; null before review"
        default: null
        constraints: "AD_VALOREM | STATUTORY_PER_UNIT when present"
      - name: penalty_ad_valorem_usd
        type: number
        source: computed
        description: "Ad valorem variant amount; null before review"
        default: null
      - name: penalty_statutory_usd
        type: number
        source: computed
        description: "Statutory per-unit variant amount; null before review"
        default: null
      - name: penalty_assessed_usd
        type: number
        source: computed
        description: "Amount actually assessed, equal to the variant named by assessment_basis"
        default: 0.00
      - name: penalty_mitigated_usd
        type: number
        source: computed
        description: "Amount abated by an accepted correction filing"
        default: 0.00
      - name: corrected_units
        type: integer
        source: input
        description: "Units actually re-marked in the correction filing; 0 until a correction is filed"
        default: 0

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the audited brand"
      - name: scope
        type: enum
        source: input
        description: "What the audit covers"
        constraints: "STYLE_DOSSIER | MARKET_LABELING | IMPORT_MARKING"
      - name: audit_window_from
        type: datetime
        source: input
        description: "Inclusive start of the audited period"
      - name: audit_window_to
        type: datetime
        source: input
        description: "Exclusive end of the audited period; MUST be strictly after audit_window_from"
      - name: state
        type: enum
        source: system
        description: "Compound audit lifecycle derived from child findings; PENDING_CLOSURE falls back to IN_REVIEW when a finding is reopened"
        default: "OPEN"
        constraints: "OPEN | IN_REVIEW | PENDING_CLOSURE | CLOSED"
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows with audit_id equal to this row and state IN {OPEN, REMEDIATED}"
        default: 0
      - name: critical_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows with audit_id equal to this row, severity == CRITICAL and state IN {OPEN, REMEDIATED}"
        default: 0
      - name: units_in_scope
        type: integer
        source: computed
        description: "Sum of units_affected over every AuditFinding row with audit_id equal to this row regardless of finding state"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of closure; null until state == CLOSED"
        default: null

  - name: AuditFinding
    parent: ComplianceAudit
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> ComplianceAudit.id; the audit that raised this finding"
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the mislabeled style"
      - name: corrective_label_spec_id
        type: string
        source: input
        description: "FK -> LabelSpec.id; the PERMANENT_LABEL row used to re-label the affected units; null until a disposition is recorded"
        default: null
      - name: finding_code
        type: enum
        source: input
        description: "What was found wrong"
        constraints: "FIBER_CONTENT_MISSTATED | ORIGIN_MISSTATED | CARE_UNSUBSTANTIATED | IDENTITY_MISSING | PLACEMENT_NON_PERMANENT | HANGTAG_INCONSISTENT"
      - name: severity
        type: enum
        source: computed
        description: "See calculations.finding_severity; escalates one level at the units_affected breakpoint"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: units_affected
        type: integer
        source: input
        description: "Mislabeled units in inventory covered by this finding; the conserved quantity of the disposition ledger"
        constraints: "> 0"
      - name: units_relabeled
        type: integer
        source: input
        description: "Units re-labeled against corrective_label_spec_id; supplied only on POST /labeling/audit-findings/{id}/disposition and 0 before that call"
        default: 0
      - name: units_destroyed
        type: integer
        source: input
        description: "Units destroyed rather than re-labeled; supplied only on POST /labeling/audit-findings/{id}/disposition and 0 before that call"
        default: 0
      - name: units_released
        type: integer
        source: input
        description: "Units released for sale because the finding did not in fact apply to them; supplied only on POST /labeling/audit-findings/{id}/disposition and 0 before that call"
        default: 0
      - name: units_unresolved
        type: integer
        source: computed
        description: "units_affected - (units_relabeled + units_destroyed + units_released); MUST never be negative"
      - name: state
        type: enum
        source: system
        description: "Finding lifecycle; CLOSED can be reopened, which zeroes the disposition counters"
        default: "OPEN"
        constraints: "OPEN | REMEDIATED | CLOSED"
      - name: disposition_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the disposition was recorded; null while OPEN"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant the disposition was verified; null until CLOSED"
        default: null
      - name: reopen_reason
        type: string
        source: system
        description: "Reason recorded on the most recent reopen; null if never reopened"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Style
    dimension: substantiation_state
    initial_state: FIBER_DECLARED
    terminal_states: []
    note: "First of two INDEPENDENT state dimensions carried on the same Style row. Nothing in this dimension reads or writes origin_state, and vice versa."
    transitions:
      - from: FIBER_DECLARED
        to: FIBER_TEST_PENDING
        trigger: "POST /labeling/lab-tests with test_type == FIBER_CONTENT"
        actor: AccreditedLab
        preconditions:
          - "style.declared_fibers is non-empty"
          - "no LabTest row exists with the same style_id and test_type == FIBER_CONTENT in state BENCH_RESERVED"
          - "fewer than LAB_BENCH_CAPACITY LabTest rows in state BENCH_RESERVED share the requested (lab_code, method) with an overlapping occupancy interval"
        side_effects:
          - "creates a LabTest row in state BENCH_RESERVED with attempt_no = 1"
          - "sets Style.substantiation_state = FIBER_TEST_PENDING"
          - "recomputes Style.label_readiness"
          - "increments Style.version by 1"
      - from: FIBER_SUBSTANTIATED
        to: FIBER_TEST_PENDING
        trigger: "POST /labeling/lab-tests with test_type == FIBER_CONTENT (a re-verification of an already substantiated style)"
        actor: AccreditedLab
        preconditions:
          - "style.declared_fibers is non-empty"
          - "no LabTest row exists with the same style_id and test_type == FIBER_CONTENT in state BENCH_RESERVED"
          - "fewer than LAB_BENCH_CAPACITY LabTest rows in state BENCH_RESERVED share the requested (lab_code, method) with an overlapping occupancy interval"
        side_effects:
          - "creates a LabTest row in state BENCH_RESERVED with attempt_no = 1; the previously PASSED FIBER_CONTENT row is NOT superseded yet, it is superseded only when the new row reaches PASSED"
          - "sets Style.substantiation_state = FIBER_TEST_PENDING; already PUBLISHED labels are left alone, because nothing has been disproved yet"
          - "recomputes Style.label_readiness"
          - "increments Style.version by 1"
      - from: FIBER_TEST_PENDING
        to: FIBER_SUBSTANTIATED
        trigger: "POST /labeling/lab-tests/{id}/results where calculations.fiber_tolerance_evaluation yields PASS"
        actor: AccreditedLab
        preconditions:
          - "labtest.state == BENCH_RESERVED"
          - "labtest.test_type == FIBER_CONTENT"
          - "sum of measured_fibers[].measured_pct is within [99.0, 101.0]"
        side_effects:
          - "sets LabTest.state = PASSED and LabTest.result_delta_pp_max"
          - "any other LabTest row with the same style_id and test_type == FIBER_CONTENT in state PASSED transitions to SUPERSEDED"
          - "sets Style.substantiation_state = FIBER_SUBSTANTIATED"
          - "recomputes Style.label_readiness"
          - "increments Style.version by 1"
      - from: FIBER_TEST_PENDING
        to: FIBER_MISSTATED
        trigger: "POST /labeling/lab-tests/{id}/results where calculations.fiber_tolerance_evaluation yields FAIL"
        actor: AccreditedLab
        preconditions:
          - "labtest.state == BENCH_RESERVED"
          - "labtest.test_type == FIBER_CONTENT"
          - "sum of measured_fibers[].measured_pct is within [99.0, 101.0]"
        side_effects:
          - "HOP 1: sets LabTest.state = FAILED and LabTest.result_delta_pp_max"
          - "HOP 2 (caused by HOP 1): sets Style.substantiation_state = FIBER_MISSTATED and Style.label_readiness = BLOCKED"
          - "HOP 3 (caused by HOP 2): every LabelSpec row with this style_id, artifact_type == PERMANENT_LABEL and state IN {PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_FIBER_MISSTATED, and its effective_from / effective_to stop occupying the market window"
          - "HOP 4 (caused by HOP 3): every LabelSpec row whose parent_label_spec_id is one of the rows withdrawn in HOP 3 and whose state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_PARENT_WITHDRAWN"
          - "increments Style.version by 1 and the version of every LabelSpec row touched in HOP 3 and HOP 4 by 1"
      - from: FIBER_MISSTATED
        to: FIBER_TEST_PENDING
        trigger: "POST /labeling/lab-tests/{id}/retest"
        actor: AccreditedLab
        preconditions:
          - "labtest.state == FAILED"
          - "labtest.test_type == FIBER_CONTENT"
          - "the new (specimen_received_at, results_due_at) interval passes the (lab_code, method) bench-capacity check"
        side_effects:
          - "sets LabTest.state = BENCH_RESERVED, increments LabTest.attempt_no by 1, replaces the occupancy interval, clears measured_fibers and result_delta_pp_max"
          - "sets Style.substantiation_state = FIBER_TEST_PENDING"
          - "increments Style.version by 1"
        note: "A fresh POST /labeling/lab-tests reservation has the same effect on this dimension; the retest form is the one that keeps attempt history on a single row."
      - from: FIBER_DECLARED
        to: FIBER_DECLARED
        trigger: "PUT /labeling/styles/{id}/fiber-declaration (an edit of a declaration that has not been benched yet, including the first declaration on a style created without one)"
        actor: BrandAdmin
        preconditions:
          - "expected_style_version equals Style.version"
          - "no LabelSpec row with this style_id, artifact_type == PERMANENT_LABEL and state IN {PENDING_APPROVAL, APPROVED, PUBLISHED} exists"
          - "the submitted declared_fibers array is non-empty and its percentages sum to exactly 100.0"
        side_effects:
          - "replaces Style.declared_fibers and recomputes Style.effective_fiber_content_text"
          - "no LabTest row is touched, because nothing has been substantiated on this dimension yet"
          - "leaves Style.substantiation_state at FIBER_DECLARED and recomputes Style.label_readiness"
          - "increments Style.version by 1"
      - from: FIBER_SUBSTANTIATED
        to: FIBER_DECLARED
        trigger: "PUT /labeling/styles/{id}/fiber-declaration"
        actor: BrandAdmin
        preconditions:
          - "expected_style_version equals Style.version"
          - "no LabelSpec row with this style_id, artifact_type == PERMANENT_LABEL and state IN {PENDING_APPROVAL, APPROVED, PUBLISHED} exists"
          - "the submitted declared_fibers percentages sum to exactly 100.0"
        side_effects:
          - "replaces Style.declared_fibers and recomputes Style.effective_fiber_content_text"
          - "every LabTest row with this style_id, test_type == FIBER_CONTENT and state == PASSED transitions to SUPERSEDED"
          - "sets Style.substantiation_state = FIBER_DECLARED and Style.label_readiness = BLOCKED"
          - "increments Style.version by 1"
      - from: FIBER_MISSTATED
        to: FIBER_DECLARED
        trigger: "PUT /labeling/styles/{id}/fiber-declaration"
        actor: BrandAdmin
        preconditions:
          - "expected_style_version equals Style.version"
          - "no LabelSpec row with this style_id, artifact_type == PERMANENT_LABEL and state IN {PENDING_APPROVAL, APPROVED, PUBLISHED} exists"
          - "the submitted declared_fibers percentages sum to exactly 100.0"
        side_effects:
          - "replaces Style.declared_fibers and recomputes Style.effective_fiber_content_text"
          - "the FAILED LabTest row is left untouched in FAILED so the audit trail survives"
          - "sets Style.substantiation_state = FIBER_DECLARED"
          - "increments Style.version by 1"

  - entity: Style
    dimension: origin_state
    initial_state: ORIGIN_UNDETERMINED
    terminal_states: []
    note: "Second INDEPENDENT dimension on the same Style row. Both dimensions must sit at their good value for label_readiness to read READY, which is what makes them observable as a pair."
    transitions:
      - from: ORIGIN_UNDETERMINED
        to: ORIGIN_DRAFTED
        trigger: "POST /labeling/origin-determinations"
        actor: LabelingSpecialist
        preconditions:
          - "expected_style_version equals Style.version"
          - "the style has at least one non-ornamentation MaterialInput row with stage IN {YARN, FABRIC, CUT_AND_SEW} and at least one with stage IN {FIBER, YARN}"
        side_effects:
          - "creates an OriginDetermination row in state DRAFT with st_country, yf_country, divergent and graph_node_count frozen from the current graph"
          - "sets Style.origin_state = ORIGIN_DRAFTED"
          - "increments Style.version by 1"
      - from: ORIGIN_DRAFTED
        to: ORIGIN_DRAFTED
        trigger: "POST /labeling/origin-determinations (a second determination while one is still DRAFT)"
        actor: LabelingSpecialist
        preconditions:
          - "expected_style_version equals Style.version"
        side_effects:
          - "the existing DRAFT OriginDetermination row transitions to SUPERSEDED"
          - "creates the new OriginDetermination row in state DRAFT"
          - "increments Style.version by 1"
      - from: ORIGIN_DRAFTED
        to: ORIGIN_ISSUED
        trigger: "POST /labeling/origin-determinations/{id}/issue"
        actor: ComplianceAdmin
        preconditions:
          - "determination.state == DRAFT"
          - "method is SUBSTANTIAL_TRANSFORMATION or YARN_FORWARD"
        side_effects:
          - "sets OriginDetermination.method_pinned, determined_country and issued_at, and state = ISSUED"
          - "any other OriginDetermination row of the same style in state ISSUED transitions to SUPERSEDED"
          - "sets Style.origin_state = ORIGIN_ISSUED"
          - "recomputes Style.label_readiness"
          - "increments Style.version by 1"
      - from: ORIGIN_ISSUED
        to: ORIGIN_DRAFTED
        trigger: "POST /labeling/origin-determinations (a fresh determination is drafted while an ISSUED one still stands)"
        actor: LabelingSpecialist
        preconditions:
          - "expected_style_version equals Style.version"
        side_effects:
          - "creates the new OriginDetermination row in state DRAFT; the ISSUED row keeps standing until the new row is issued"
          - "sets Style.origin_state = ORIGIN_DRAFTED and Style.label_readiness = BLOCKED, so any PERMANENT_LABEL approval is blocked while the re-draft is pending"
          - "increments Style.version by 1"
      - from: ORIGIN_ISSUED
        to: ORIGIN_UNDETERMINED
        trigger: "POST /labeling/styles/{id}/material-inputs (the supply graph changed after issuance)"
        actor: BrandAdmin
        preconditions:
          - "the new node passes the stage-order check against parent_input_id"
        side_effects:
          - "HOP 1: creates the MaterialInput row"
          - "HOP 2 (caused by HOP 1): the ISSUED OriginDetermination row transitions to VOID because its frozen graph no longer matches the style"
          - "HOP 3 (caused by HOP 2): every LabelSpec row whose origin_determination_id is that voided determination and whose state IN {PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_ORIGIN_VOIDED"
          - "HOP 4 (caused by HOP 3): every LabelSpec row whose parent_label_spec_id is one of the rows withdrawn in HOP 3 and whose state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_PARENT_WITHDRAWN"
          - "sets Style.origin_state = ORIGIN_UNDETERMINED and Style.label_readiness = BLOCKED"
          - "increments Style.version by 1"

  - entity: LabTest
    initial_state: BENCH_RESERVED
    terminal_states: [SUPERSEDED]
    note: "Branching (BENCH_RESERVED forks to PASSED or FAILED with different side-effect sets) plus a cycle back from FAILED to BENCH_RESERVED on retest."
    transitions:
      - from: BENCH_RESERVED
        to: PASSED
        trigger: "POST /labeling/lab-tests/{id}/results with a passing evaluation"
        actor: AccreditedLab
        preconditions:
          - "test.state == BENCH_RESERVED"
          - "for test_type == FIBER_CONTENT: measured_fibers is non-empty and its measured_pct values sum to a value within [99.0, 101.0]"
          - "for test_type == CARE_PERFORMANCE: cycles_run, dimensional_change_pct, colorfastness_grade and legibility_cycles are all present"
        side_effects:
          - "for FIBER_CONTENT: sets result_delta_pp_max and drives Style.substantiation_state to FIBER_SUBSTANTIATED"
          - "for CARE_PERFORMANCE: leaves both Style dimensions untouched; the evidence is consumed only when a LabelSpec pinning this test is approved"
          - "releases the (lab_code, method) bench occupancy interval"
          - "increments LabTest.version by 1"
      - from: BENCH_RESERVED
        to: FAILED
        trigger: "POST /labeling/lab-tests/{id}/results with a failing evaluation"
        actor: AccreditedLab
        preconditions:
          - "test.state == BENCH_RESERVED"
          - "the same result-completeness preconditions as the PASSED branch"
        side_effects:
          - "for FIBER_CONTENT: runs the four-hop misstatement cascade described in the Style substantiation dimension"
          - "for CARE_PERFORMANCE: leaves both Style dimensions untouched; any LabelSpec pinning this test can no longer be approved"
          - "releases the (lab_code, method) bench occupancy interval"
          - "increments LabTest.version by 1"
      - from: FAILED
        to: BENCH_RESERVED
        trigger: "POST /labeling/lab-tests/{id}/retest"
        actor: AccreditedLab
        preconditions:
          - "test.state == FAILED"
          - "results_due_at strictly after specimen_received_at"
          - "fewer than LAB_BENCH_CAPACITY other BENCH_RESERVED rows on the same (lab_code, method) overlap the new occupancy interval"
        side_effects:
          - "increments attempt_no by 1, clears measured_fibers, dimensional_change_pct, colorfastness_grade, legibility_cycles, cycles_run and result_delta_pp_max"
          - "recomputes valid_until from the new specimen_received_at"
          - "for FIBER_CONTENT: drives Style.substantiation_state from FIBER_MISSTATED back to FIBER_TEST_PENDING"
          - "increments LabTest.version by 1"
      - from: PASSED
        to: SUPERSEDED
        trigger: "system, when a newer LabTest of the same (style_id, test_type) reaches PASSED or when PUT /labeling/styles/{id}/fiber-declaration replaces the declaration"
        actor: system
        preconditions:
          - "test.state == PASSED"
        side_effects:
          - "any LabelSpec row pinning this test via care_test_id can no longer pass the care-substantiation gate at approval"
          - "increments LabTest.version by 1"

  - entity: OriginDetermination
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /labeling/origin-determinations/{id}/issue"
        actor: ComplianceAdmin
        preconditions:
          - "determination.state == DRAFT"
        side_effects:
          - "pins method_pinned and derives determined_country from the frozen st_country / yf_country pair"
          - "sets Style.origin_state = ORIGIN_ISSUED and increments Style.version by 1"
          - "increments OriginDetermination.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, when POST /labeling/origin-determinations creates a newer determination for the same style"
        actor: system
        preconditions:
          - "determination.state == DRAFT"
        side_effects:
          - "increments OriginDetermination.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, when a newer determination for the same style is issued"
        actor: system
        preconditions:
          - "determination.state == ISSUED"
        side_effects:
          - "LabelSpec rows still pinning this determination keep their pin, so their origin_text is re-checked against the superseded row and no longer matches the style current determination"
          - "increments OriginDetermination.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system, when POST /labeling/styles/{id}/material-inputs changes the supply graph after issuance"
        actor: system
        preconditions:
          - "determination.state == ISSUED"
        side_effects:
          - "runs HOP 3 and HOP 4 of the origin-void cascade described in the Style origin dimension"
          - "increments OriginDetermination.version by 1"

  - entity: LabelSpec
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "Cyclic: PENDING_APPROVAL -> REVISION_REQUESTED -> DRAFT -> PENDING_APPROVAL can repeat any number of times, and every lap re-runs the full approval gate against whatever the Style dimensions now say."
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /labeling/label-specs/{id}"
        actor: LabelingSpecialist
        preconditions:
          - "spec.state IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "overwrites the supplied content fields, recomputes content_hash, sets authored_by_user_id to the acting X-User-ID"
          - "for HANGTAG rows, recomputes consistency_state against the parent PERMANENT_LABEL"
          - "increments LabelSpec.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /labeling/label-specs/{id}"
        actor: LabelingSpecialist
        preconditions:
          - "spec.state == REVISION_REQUESTED"
        side_effects:
          - "clears revision_note, overwrites the supplied content fields, recomputes content_hash"
          - "sets authored_by_user_id to the acting X-User-ID, which re-arms the segregation-of-duties check for the next approval"
          - "increments LabelSpec.version by 1"
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /labeling/label-specs/{id}/submit"
        actor: LabelingSpecialist
        preconditions:
          - "spec.state == DRAFT"
          - "for PERMANENT_LABEL rows: origin_determination_id and care_test_id are both non-null"
        side_effects:
          - "increments LabelSpec.version by 1"
      - from: PENDING_APPROVAL
        to: REVISION_REQUESTED
        trigger: "POST /labeling/label-specs/{id}/request-revision"
        actor: LabelingApprover
        preconditions:
          - "spec.state == PENDING_APPROVAL"
        side_effects:
          - "stores revision_note"
          - "increments LabelSpec.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /labeling/label-specs/{id}/approve"
        actor: LabelingApprover
        preconditions:
          - "spec.state == PENDING_APPROVAL"
          - "acting X-User-ID != spec.authored_by_user_id"
          - "for PERMANENT_LABEL rows: style.substantiation_state == FIBER_SUBSTANTIATED"
          - "for PERMANENT_LABEL rows: style.origin_state == ORIGIN_ISSUED and the pinned determination is the style current ISSUED row"
          - "for PERMANENT_LABEL rows: the pinned care_test is a CARE_PERFORMANCE row of the same style in state PASSED whose wash_temp_c equals spec.wash_temp_c and whose valid_until is at or after the logical clock"
          - "for PERMANENT_LABEL rows: identity, language, placement, market-subset, content-match and durability gates in calculations.label_market_compliance and calculations.durability_adequacy all pass"
          - "for HANGTAG rows: consistency_state == CONSISTENT"
          - "brand.posture != RESTRICTED and brand.posture != SUSPENDED"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "increments LabelSpec.version by 1"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /labeling/label-specs/{id}/publish"
        actor: LabelingApprover
        preconditions:
          - "spec.state == APPROVED"
          - "effective_to strictly after effective_from"
          - "brand.posture != SUSPENDED"
          - "for every market_code shared with another PUBLISHED LabelSpec of the same style, the half-open window [effective_from, effective_to) does not overlap that row window"
        side_effects:
          - "stores effective_from and effective_to and starts occupying the (style_id, market_code) window for every listed market"
          - "increments LabelSpec.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /labeling/label-specs/{id}/withdraw"
        actor: LabelingApprover
        preconditions:
          - "spec.state == APPROVED"
        side_effects:
          - "stores withdrawn_reason"
          - "every LabelSpec row whose parent_label_spec_id is this row and whose state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_PARENT_WITHDRAWN"
          - "increments LabelSpec.version by 1 on this row and on every cascaded child"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /labeling/label-specs/{id}/withdraw"
        actor: LabelingApprover
        preconditions:
          - "spec.state == PUBLISHED"
        side_effects:
          - "stores withdrawn_reason and releases the (style_id, market_code) window occupancy for every listed market"
          - "every LabelSpec row whose parent_label_spec_id is this row and whose state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} transitions to WITHDRAWN with withdrawn_reason = AUTO_PARENT_WITHDRAWN"
          - "increments LabelSpec.version by 1 on this row and on every cascaded child"
      - from: PENDING_APPROVAL
        to: WITHDRAWN
        trigger: "system cascade only, never an operator call: the parent PERMANENT_LABEL of this HANGTAG is withdrawn, or this PERMANENT_LABEL evidence is invalidated by POST /labeling/lab-tests/{id}/results yielding FAIL or by POST /labeling/styles/{id}/material-inputs voiding the pinned determination"
        actor: system
        preconditions:
          - "spec.state == PENDING_APPROVAL"
        side_effects:
          - "stores the cascade withdrawn_reason literal AUTO_FIBER_MISSTATED, AUTO_ORIGIN_VOIDED or AUTO_PARENT_WITHDRAWN"
          - "increments LabelSpec.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system cascade only, never an operator call: the parent PERMANENT_LABEL of this HANGTAG is withdrawn"
        actor: system
        preconditions:
          - "spec.state == DRAFT"
          - "spec.artifact_type == HANGTAG"
        side_effects:
          - "stores withdrawn_reason = AUTO_PARENT_WITHDRAWN"
          - "increments LabelSpec.version by 1"

  - entity: ImportShipment
    initial_state: ENTRY_FILED
    terminal_states: [MARKING_COMPLIANT, MARKING_CORRECTED]
    transitions:
      - from: ENTRY_FILED
        to: MARKING_COMPLIANT
        trigger: "POST /labeling/import-shipments/{id}/marking-review with outcome == COMPLIANT"
        actor: CustomsOfficer
        preconditions:
          - "shipment.marking_state == ENTRY_FILED"
          - "deficiency_code is absent"
        side_effects:
          - "stores review_decided_at from the logical clock, leaves penalty_assessed_usd at 0.00"
          - "increments ImportShipment.version by 1"
      - from: ENTRY_FILED
        to: REDELIVERY_ORDERED
        trigger: "POST /labeling/import-shipments/{id}/marking-review with outcome == DEFICIENT"
        actor: CustomsOfficer
        preconditions:
          - "shipment.marking_state == ENTRY_FILED"
          - "deficiency_code is present"
        side_effects:
          - "freezes posture_at_review from calculations.brand_posture evaluated with this shipment excluded from the ledger"
          - "computes penalty_ad_valorem_usd, penalty_statutory_usd, assessment_basis and penalty_assessed_usd per calculations.marking_penalty_assessment"
          - "stores review_decided_at and derives redelivery_deadline_at"
          - "recomputes Brand.outstanding_penalty_usd and Brand.posture on the responsible brand of record"
          - "increments ImportShipment.version by 1"
      - from: REDELIVERY_ORDERED
        to: MARKING_CORRECTED
        trigger: "POST /labeling/import-shipments/{id}/correct"
        actor: BrandAdmin
        preconditions:
          - "shipment.marking_state == REDELIVERY_ORDERED"
          - "the logical clock is at or before redelivery_deadline_at"
          - "corrective_label_spec_id resolves to a LabelSpec row of the same style with artifact_type == PERMANENT_LABEL in state PUBLISHED"
          - "0 < corrected_units <= quantity_units"
        side_effects:
          - "stores corrective_label_spec_id and corrected_units"
          - "computes penalty_mitigated_usd per calculations.penalty_mitigation"
          - "recomputes Brand.outstanding_penalty_usd and Brand.posture on the responsible brand of record"
          - "increments ImportShipment.version by 1"

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Compound: state is a function of child AuditFinding states, and PENDING_CLOSURE cycles back to IN_REVIEW whenever a finding is reopened."
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "system, on the first successful POST /labeling/compliance-audits/{id}/findings"
        actor: system
        preconditions:
          - "audit.state == OPEN"
        side_effects:
          - "recomputes open_finding_count, critical_finding_count and units_in_scope"
          - "recomputes Brand.posture on the responsible brand of record"
          - "increments ComplianceAudit.version by 1"
      - from: IN_REVIEW
        to: PENDING_CLOSURE
        trigger: "system, when a finding transition drives open_finding_count to 0"
        actor: system
        preconditions:
          - "audit.state == IN_REVIEW"
          - "open_finding_count == 0 and at least one finding exists"
        side_effects:
          - "recomputes critical_finding_count to 0"
          - "recomputes Brand.posture on the responsible brand of record, which can drop RESTRICTED because no audit of that brand is IN_REVIEW with critical_finding_count >= CRITICAL_FINDING_RESTRICT_THRESHOLD any more"
          - "increments ComplianceAudit.version by 1"
      - from: PENDING_CLOSURE
        to: IN_REVIEW
        trigger: "system, on POST /labeling/audit-findings/{id}/reopen"
        actor: system
        preconditions:
          - "audit.state == PENDING_CLOSURE"
        side_effects:
          - "recomputes open_finding_count and critical_finding_count from the reopened finding"
          - "recomputes Brand.posture on the responsible brand of record"
          - "increments ComplianceAudit.version by 1"
      - from: PENDING_CLOSURE
        to: CLOSED
        trigger: "POST /labeling/compliance-audits/{id}/close"
        actor: Auditor
        preconditions:
          - "audit.state == PENDING_CLOSURE"
        side_effects:
          - "stores closed_at from the logical clock"
          - "increments ComplianceAudit.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /labeling/compliance-audits/{id}/close"
        actor: Auditor
        preconditions:
          - "audit.state == OPEN, which can only still hold when no finding was ever raised"
        side_effects:
          - "stores closed_at from the logical clock"
          - "increments ComplianceAudit.version by 1"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: []
    note: "CLOSED is reopenable, so the finding lifecycle is a cycle. Every lap must leave units_affected conserved."
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /labeling/audit-findings/{id}/disposition"
        actor: LabelingSpecialist
        preconditions:
          - "finding.state == OPEN"
          - "units_relabeled + units_destroyed + units_released == finding.units_affected"
          - "when units_relabeled > 0: corrective_label_spec_id resolves to a LabelSpec row with artifact_type == PERMANENT_LABEL, the same style_id as the finding, in state PUBLISHED"
        side_effects:
          - "stores the three disposition counters, corrective_label_spec_id and disposition_recorded_at"
          - "recomputes units_unresolved to 0"
          - "recomputes ComplianceAudit.open_finding_count (the finding is still counted, because REMEDIATED is in the open set) and increments ComplianceAudit.version by 1"
          - "increments AuditFinding.version by 1"
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /labeling/audit-findings/{id}/verify"
        actor: Auditor
        preconditions:
          - "finding.state == REMEDIATED"
        side_effects:
          - "HOP 1: stores verified_at and sets state = CLOSED"
          - "HOP 2 (caused by HOP 1): the parent ComplianceAudit recomputes open_finding_count; when it reaches 0 the audit transitions IN_REVIEW -> PENDING_CLOSURE"
          - "HOP 3 (caused by HOP 2): the responsible Brand recomputes posture; because no ComplianceAudit of that brand is IN_REVIEW with critical_finding_count >= CRITICAL_FINDING_RESTRICT_THRESHOLD any more, posture drops from RESTRICTED to OPEN"
          - "increments AuditFinding.version, ComplianceAudit.version and Brand.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /labeling/audit-findings/{id}/reopen"
        actor: Auditor
        preconditions:
          - "finding.state == CLOSED"
          - "the parent audit state != CLOSED"
        side_effects:
          - "stores reopen_reason, clears verified_at, disposition_recorded_at and corrective_label_spec_id"
          - "resets units_relabeled, units_destroyed and units_released to 0 so units_unresolved returns to units_affected"
          - "the parent ComplianceAudit transitions PENDING_CLOSURE -> IN_REVIEW and recomputes its counters; units_in_scope is unchanged"
          - "recomputes Brand.posture on the responsible brand of record"
          - "increments AuditFinding.version, ComplianceAudit.version and Brand.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent version is the only mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: fiber-declaration-replace-stale-style
    parent_entity: Style
    write_endpoint: "PUT /labeling/styles/{id}/fiber-declaration"
    occ_field: "expected_style_version"
    description: |
      Replacing a style whole fiber declaration is a legitimate supersede: a writer that
      submits the same replacement against an up-to-date style version always succeeds.
      A writer whose expected_style_version is behind Style.version has therefore based its
      replacement on a declaration, test outcome or origin state that has since moved, and
      the replacement is rejected as stale rather than silently discarding the newer facts.
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412

  - rule_id: origin-determination-create-stale-style
    parent_entity: Style
    write_endpoint: "POST /labeling/origin-determinations"
    occ_field: "expected_style_version"
    description: |
      Creating an OriginDetermination legitimately supersedes the style prior DRAFT
      determination, so a create against an unchanged style would itself succeed. A create
      carrying an expected_style_version behind Style.version was computed against a supply
      graph that has since gained or lost a node, and is rejected as stale so the frozen
      st_country / yf_country pair can never disagree with the graph it claims to describe.
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412

  - rule_id: hangtag-create-stale-parent-label
    parent_entity: LabelSpec
    write_endpoint: "POST /labeling/label-specs/{id}/hangtags"
    occ_field: "expected_parent_label_spec_version"
    description: |
      A style carries at most one live HANGTAG per PERMANENT_LABEL, and creating a new one
      legitimately supersedes the prior hangtag, so the create is not blocked by any state
      precondition. A create carrying an expected_parent_label_spec_version behind the parent
      LabelSpec.version was authored against parent content that has since been edited,
      re-approved or withdrawn, and is rejected as stale.
    error_id: ERR_STALE_LABEL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: effective_fiber_content_text
    trigger: "on POST /labeling/styles and on PUT /labeling/styles/{id}/fiber-declaration, both of which list recomputing Style.effective_fiber_content_text in their side_effects"
    algorithm: aggregation
    formula: |
      lines = Style.declared_fibers
      if lines is empty: return ""
      listed = [L for L in lines
                if L.ornamentation_exempt == false
                and L.declared_pct >= ORNAMENTATION_LISTING_THRESHOLD_PCT]
      bucketed = [L for L in lines
                  if L.ornamentation_exempt == true
                  or L.declared_pct < ORNAMENTATION_LISTING_THRESHOLD_PCT]
      sort listed by declared_pct DESC, then fiber_generic_name ASC   # no id, no created_at needed
      parts = [ format_one_decimal(L.declared_pct) + "% " + L.fiber_generic_name for L in listed ]
      if bucketed is non-empty:
          other_pct = round_half_up(sum(L.declared_pct for L in bucketed), 1)
          parts.append(format_one_decimal(other_pct) + "% OTHER FIBER")   # ALWAYS last, whatever its size
      return join(parts, ", ")
    input_set: "Every row of Style.declared_fibers with no status filter; the array is the whole population. Ordering is fully pinned by (declared_pct DESC, fiber_generic_name ASC) so equal percentages resolve alphabetically and never by insertion order or id."
    constants:
      ORNAMENTATION_LISTING_THRESHOLD_PCT: 5.0
    precision: "percentages rendered with exactly one decimal place; the OTHER FIBER bucket sum is rounded to 1 decimal, round_half_up"
    variants: []

  - name: fiber_tolerance_evaluation
    trigger: "on POST /labeling/lab-tests/{id}/results for a test_type == FIBER_CONTENT row, whose side_effects list setting LabTest.result_delta_pp_max and driving Style.substantiation_state"
    algorithm: threshold
    formula: |
      # step 1 - pick the governing tolerance (strictest market wins)
      markets = [ MarketRequirement[m] for m in Style.target_market_codes ]
      non_exempt = [ L for L in Style.declared_fibers if L.ornamentation_exempt == false ]
      is_absolute_claim = (count(non_exempt) == 1 and non_exempt[0].declared_pct == 100.0)
      tolerance_pp = min(m.absolute_claim_tolerance_pp for m in markets) if is_absolute_claim
                     else min(m.fiber_tolerance_pp for m in markets)

      # step 2 - deviation per fiber name, over the UNION of declared and measured names
      names = { L.fiber_generic_name for L in non_exempt }
              UNION { M.fiber_generic_name for M in LabTest.measured_fibers }
      for n in names:
          declared_pct = declared_pct of non_exempt line named n, else 0.0
          measured_pct = measured_pct of measured_fibers line named n, else 0.0
          delta[n] = abs(measured_pct - declared_pct)
      result_delta_pp_max = round_half_up(max(delta.values()), 1)

      # step 3 - inclusive comparison
      verdict = PASS if result_delta_pp_max <= tolerance_pp else FAIL
    input_set: "Only Style.declared_fibers lines with ornamentation_exempt == false enter the declared side; ornamentation lines are ignored entirely. Every measured_fibers line enters the measured side, including fibers absent from the declaration (they compare against a declared 0.0). Markets are exactly Style.target_market_codes."
    constants: {}
    precision: "result_delta_pp_max rounded to 1 decimal, round_half_up; the comparison against tolerance_pp is INCLUSIVE, so a deviation exactly equal to tolerance_pp is a PASS"
    variants:
      - name: standard_tolerance
        when: "the declaration has two or more non-exempt lines, or a single line below 100.0"
        difference: "tolerance_pp is the minimum fiber_tolerance_pp across the style target markets"
      - name: absolute_claim_tolerance
        when: "exactly one non-exempt line declaring 100.0 (an absolute claim such as 100.0% COTTON)"
        difference: "tolerance_pp becomes the minimum absolute_claim_tolerance_pp across the style target markets, which is 0.0 in the US market, so any measured foreign fiber at all fails"

  - name: origin_country_determination
    trigger: "on POST /labeling/origin-determinations, whose side_effects list freezing st_country, yf_country, divergent and graph_node_count onto the new row"
    algorithm: topological
    formula: |
      nodes = [ N for N in MaterialInput where N.style_id == Style.id
                and N.is_ornamentation == false ]
      graph_node_count = count(nodes)

      # variant A - SUBSTANTIAL_TRANSFORMATION
      a_pool = [ N for N in nodes if N.stage IN {YARN, FABRIC, CUT_AND_SEW} ]
      if a_pool is empty: reject with ERR_ORIGIN_GRAPH_INSUFFICIENT
      group a_pool by country_code
      for each country c: a_value[c]     = sum(N.value_added_usd for N in group c)
                          a_top_rank[c]  = max(STAGE_RANK[N.stage] for N in group c)
      st_country = argmax over c of ( a_value[c] )
                   tie-break 1: greater a_top_rank[c]
                   tie-break 2: country_code ASC

      # variant B - YARN_FORWARD
      b_pool = [ N for N in nodes if N.stage == YARN ]
      if b_pool is empty:
          b_pool = [ N for N in nodes if N.stage == FIBER ]     # documented fallback
      if b_pool is empty: reject with ERR_ORIGIN_GRAPH_INSUFFICIENT
      group b_pool by country_code
      for each country c: b_weight[c] = sum(N.weight_grams for N in group c)
      yf_country = argmax over c of ( b_weight[c] )
                   tie-break 1: greater max(STAGE_RANK[N.stage] for N in group c)
                   tie-break 2: country_code ASC

      divergent = (st_country != yf_country)
      determined_country = st_country if method_pinned == SUBSTANTIAL_TRANSFORMATION
                           else yf_country if method_pinned == YARN_FORWARD
                           else null
    input_set: "All MaterialInput rows of the style with is_ornamentation == false, with no state filter (MaterialInput has no lifecycle). Variant A additionally filters to stage IN {YARN, FABRIC, CUT_AND_SEW}; variant B filters to stage == YARN and only falls back to stage == FIBER when no YARN node exists. TRIM nodes never enter either pool."
    constants:
      STAGE_RANK: { TRIM: 0, FIBER: 1, YARN: 2, FABRIC: 3, CUT_AND_SEW: 4 }
    precision: "value_added_usd summed at 2 decimal places, weight_grams summed at 1 decimal place; both comparisons are exact decimal comparisons, no rounding of the ranking key"
    variants:
      - name: SUBSTANTIAL_TRANSFORMATION
        when: "method_pinned == SUBSTANTIAL_TRANSFORMATION at issuance"
        difference: "ranks countries by summed value_added_usd over YARN, FABRIC and CUT_AND_SEW nodes, so the country that performed the most valuable finishing wins"
      - name: YARN_FORWARD
        when: "method_pinned == YARN_FORWARD at issuance"
        difference: "ranks countries by summed weight_grams over YARN nodes only, so the country that spun the majority of the yarn wins even when it added almost no value"

  - name: care_performance_evaluation
    trigger: "on POST /labeling/lab-tests/{id}/results for a test_type == CARE_PERFORMANCE row, whose side_effects list setting LabTest.state to PASSED or FAILED"
    algorithm: threshold
    formula: |
      verdict = PASS if ( cycles_run >= CARE_MIN_CYCLES
                          and abs(dimensional_change_pct) <= CARE_MAX_SHRINKAGE_PCT
                          and colorfastness_grade >= CARE_MIN_COLORFASTNESS )
                else FAIL
      # legibility_cycles is NOT part of the verdict; it is consumed later by durability_adequacy
    input_set: "Only the four result fields posted on this single LabTest row; no other test row and no Style field participates."
    constants:
      CARE_MIN_CYCLES: 5
      CARE_MAX_SHRINKAGE_PCT: 3.0
      CARE_MIN_COLORFASTNESS: 3.5
    precision: "dimensional_change_pct and colorfastness_grade compared at one decimal place; all three comparisons are inclusive"
    variants: []

  - name: durability_adequacy
    trigger: "on POST /labeling/label-specs/{id}/approve for an artifact_type == PERMANENT_LABEL row, whose preconditions list the durability gate"
    algorithm: threshold
    formula: |
      required_base     = max( MarketRequirement[m].min_durability_cycles
                               for m in LabelSpec.market_codes )
      factor            = PRODUCT_CLASS_DURABILITY_FACTOR[ Style.product_class ]
      required_adjusted = ceil( required_base * factor )
      substantiated     = min( LabTest[care_test_id].legibility_cycles,
                               LabelSpec.durability_cycles_rating )
      verdict = PASS if substantiated >= required_adjusted else FAIL
    input_set: "Markets are exactly LabelSpec.market_codes (a subset of Style.target_market_codes), not the style full target list; the evidence side reads only the pinned care_test_id row, which must already be in state PASSED per the approval preconditions."
    constants:
      PRODUCT_CLASS_DURABILITY_FACTOR: { WOVEN_OUTERWEAR: 1.00, KNIT_TOP: 1.25, HOSIERY: 1.50, HOME_TEXTILE: 0.80 }
    precision: "required_adjusted uses ceil on the product, so 25 * 1.25 = 31.25 becomes 32; the final comparison is inclusive (substantiated == required_adjusted passes)"
    variants: []

  - name: label_content_hash
    trigger: "on POST /labeling/label-specs, POST /labeling/label-specs/{id}/hangtags and PATCH /labeling/label-specs/{id}, all of which list recomputing content_hash in their side_effects"
    algorithm: aggregation
    formula: |
      normalize(s) = uppercase( collapse_internal_runs_of_whitespace_to_one_space( trim(s) ) )
      care_code_string = string(wash_temp_c) + "/" + bleach_code + "/" + dry_code
                         + "/" + iron_code + "/" + dryclean_code
      identity_string  = Brand.rn_number            if identity_display_mode == RN
                         else normalize(Brand.legal_name)
      canonical = normalize(fiber_content_text) + "|" + normalize(origin_text) + "|"
                  + care_code_string + "|" + identity_string + "|"
                  + join(sort_ascending(languages), ",")
      content_hash = lowercase_hex( sha256( utf8(canonical) ) )
    input_set: "Only fields of this LabelSpec row plus rn_number / legal_name of the Brand that owns the row Style. For HANGTAG rows the care code fields and identity_display_mode are inherited verbatim from the parent PERMANENT_LABEL at creation time, so two rows that print the same text produce the same hash."
    constants: {}
    precision: "exact string equality after normalization; no locale-dependent casing"
    variants: []

  - name: hangtag_consistency
    trigger: "on POST /labeling/label-specs/{id}/hangtags and PATCH /labeling/label-specs/{id} for HANGTAG rows, both of which list recomputing consistency_state in their side_effects"
    algorithm: constraint_propagation
    formula: |
      if artifact_type == PERMANENT_LABEL: consistency_state = NOT_APPLICABLE ; stop
      parent = LabelSpec[parent_label_spec_id]
      text_ok = ( normalize(fiber_content_text) == normalize(parent.fiber_content_text)
                  and normalize(origin_text)   == normalize(parent.origin_text) )
      claims_ok = every claim in marketing_claims satisfies its CLAIM_RULE below:
        MADE_IN_USA    -> normalize(parent.origin_text) == "MADE IN US"
        ORGANIC_COTTON -> Style.declared_fibers contains a line with
                          fiber_generic_name == "ORGANIC COTTON"
                          and declared_pct >= ORGANIC_CLAIM_MIN_PCT
        WRINKLE_FREE   -> LabTest[parent.care_test_id].state == PASSED
                          and LabTest[parent.care_test_id].dimensional_change_pct <= WRINKLE_FREE_MAX_SHRINKAGE_PCT
      consistency_state = CONSISTENT if (text_ok and claims_ok) else INCONSISTENT
    input_set: "Exactly one parent row, resolved by parent_label_spec_id, plus the parent Style declared_fibers and the parent pinned care_test row. Sibling hangtags are never consulted."
    constants:
      ORGANIC_CLAIM_MIN_PCT: 95.0
      WRINKLE_FREE_MAX_SHRINKAGE_PCT: 2.0
    precision: "string comparisons exact after normalize(); percentage comparisons at one decimal place, inclusive"
    variants: []

  - name: label_market_compliance
    trigger: "on POST /labeling/label-specs/{id}/approve, whose preconditions list the identity, language, placement, market-subset and content-match gates"
    algorithm: constraint_propagation
    formula: |
      # the six steps are evaluated in exactly this order and the FIRST failure decides
      # the error_id; the order is the 1.4 priority ladder order (58, 58, 65, 75, 77, 95),
      # NOT the order a human would narrate the gates in
      1. identity      : for every m in market_codes with
                         MarketRequirement[m].requires_identity_disclosure == true:
                           if identity_display_mode == RN and Brand.rn_number is null
                              -> ERR_IDENTITY_DISCLOSURE_MISSING
                           if identity_display_mode == COMPANY_NAME and trim(Brand.legal_name) == ""
                              -> ERR_IDENTITY_DISCLOSURE_MISSING
      2. placement     : placement_code != NOT_PERMANENT
                         else ERR_PLACEMENT_NOT_PERMANENT
      3. content_match : normalize(fiber_content_text) == normalize(Style.effective_fiber_content_text)
                         and normalize(origin_text) == "MADE IN "
                             + OriginDetermination[origin_determination_id].determined_country
                         else ERR_LABEL_CONTENT_MISMATCH
      4. language      : union over m in market_codes of MarketRequirement[m].required_languages
                         subset_of set(LabelSpec.languages)
                         else ERR_LANGUAGE_REQUIREMENT_UNMET
      5. market_subset : set(LabelSpec.market_codes) subset_of set(Style.target_market_codes)
                         else ERR_MARKET_NOT_TARGETED
      6. durability    : calculations.durability_adequacy verdict == PASS
                         else ERR_DURABILITY_INSUFFICIENT
    input_set: "MarketRequirement rows for exactly the codes in LabelSpec.market_codes; the owning Brand row; the Style effective_fiber_content_text as it stands at approval time (not as it stood when the draft was authored); the pinned OriginDetermination row even if it has since become SUPERSEDED or VOID."
    constants: {}
    precision: "set comparisons are exact; the step order above IS the 1.4 priority order, so when several gates fail at once the answer is the earliest step, never the most obvious defect"
    variants: []

  - name: marking_penalty_assessment
    trigger: "on POST /labeling/import-shipments/{id}/marking-review with outcome == DEFICIENT, whose side_effects list computing penalty_ad_valorem_usd, penalty_statutory_usd, assessment_basis and penalty_assessed_usd"
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS NORMATIVE. The posture that sets the escalation multiplier is derived
      # from a ledger that EXCLUDES this shipment, and this shipment penalty is added to the
      # ledger only after assessment, so the assessment can never re-escalate itself.
      1. posture_at_review = calculations.brand_posture( responsible_brand,
                                                         exclude_shipment_id = this.id )
      2. rate      = MarketRequirement[ this.entry_market_code ].marking_duty_rate
         duty_base = round_half_up( declared_value_usd * rate, 2 )        # ROUND #1
      3. penalty_ad_valorem_usd =
             round_half_up( duty_base * ESCALATION_BY_POSTURE[posture_at_review], 2 )  # ROUND #2
         # The two roundings are ordered: round the duty to cents FIRST, then round the
         # escalated product. Multiplying the unrounded duty by the multiplier and rounding
         # once is a DIFFERENT number and is not the pinned semantics.
      4. penalty_statutory_usd =
             min( round_half_up( quantity_units * PER_UNIT_PENALTY_USD, 2 ),
                  round_half_up( declared_value_usd * STATUTORY_CAP_RATE, 2 ) )
      5. assessment_basis = STATUTORY_PER_UNIT if posture_at_review == SUSPENDED
                            else AD_VALOREM
      6. penalty_assessed_usd  = penalty_statutory_usd if assessment_basis == STATUTORY_PER_UNIT
                                 else penalty_ad_valorem_usd
         penalty_mitigated_usd = 0.00
      7. only NOW does this row enter the ledger, so Brand.outstanding_penalty_usd and
         Brand.posture are recomputed with this shipment included.
    input_set: "One MarketRequirement row (the port of entry), this ImportShipment row, and the ledger of every OTHER ImportShipment row whose responsible brand of record matches, filtered to marking_state IN {REDELIVERY_ORDERED, MARKING_CORRECTED}. This shipment own row is excluded from the ledger in step 1 and included from step 7 onward."
    constants:
      PER_UNIT_PENALTY_USD: 1.25
      STATUTORY_CAP_RATE: 0.80
      ESCALATION_BY_POSTURE: { OPEN: 1.00, RESTRICTED: 1.50, SUSPENDED: 2.00 }
    precision: "2 decimal places, round_half_up, applied twice in the pinned order of step 2 then step 3"
    variants:
      - name: AD_VALOREM
        when: "posture_at_review IN {OPEN, RESTRICTED}"
        difference: "charges the escalated marking duty on declared value, which for a high-value low-count entry is far below the per-unit figure"
      - name: STATUTORY_PER_UNIT
        when: "posture_at_review == SUSPENDED"
        difference: "charges PER_UNIT_PENALTY_USD per garment unit, capped at STATUTORY_CAP_RATE of declared value, which for a high-count low-value entry is far above the ad valorem figure"

  - name: penalty_mitigation
    trigger: "on POST /labeling/import-shipments/{id}/correct, whose side_effects list computing penalty_mitigated_usd"
    algorithm: waterfall_allocation
    formula: |
      if logical_clock > redelivery_deadline_at: reject ERR_REDELIVERY_WINDOW_EXPIRED
      correction_ratio = corrected_units / quantity_units          # exact rational, not rounded
      prompt = logical_clock <= review_decided_at
                                + PROMPT_CORRECTION_WINDOW_DAYS days
      rate   = MITIGATION_RATE_PROMPT_FULL
               if (corrected_units == quantity_units and prompt)
               else MITIGATION_RATE_PARTIAL
      penalty_mitigated_usd = round_half_up( penalty_assessed_usd * rate * correction_ratio, 2 )
    input_set: "This ImportShipment row only. penalty_assessed_usd is read as frozen by the marking review and is never recomputed here."
    constants:
      PROMPT_CORRECTION_WINDOW_DAYS: 10
      MITIGATION_RATE_PROMPT_FULL: 1.00
      MITIGATION_RATE_PARTIAL: 0.50
    precision: "single rounding at the end, 2 decimal places, round_half_up; correction_ratio itself is never rounded"
    variants: []

  - name: brand_penalty_ledger
    trigger: "on every transition whose side_effects say to recompute Brand.outstanding_penalty_usd: the ENTRY_FILED -> REDELIVERY_ORDERED and REDELIVERY_ORDERED -> MARKING_CORRECTED transitions of ImportShipment"
    algorithm: aggregation
    formula: |
      responsible_of(b) = b.licensor_brand_id if b.responsibility_mode == LICENSOR_OF_RECORD
                          else b.id
      Brand[X].outstanding_penalty_usd = round_half_up( sum over S in ImportShipment where
            responsible_of( Brand[S.importer_brand_id] ) == X.id
        and S.marking_state IN { REDELIVERY_ORDERED, MARKING_CORRECTED }
        of ( S.penalty_assessed_usd - S.penalty_mitigated_usd ), 2 )
    input_set: "ImportShipment rows filtered to marking_state IN {REDELIVERY_ORDERED, MARKING_CORRECTED}; ENTRY_FILED and MARKING_COMPLIANT rows contribute nothing. Attribution follows responsible_of() so a LICENSEE with responsibility_mode == LICENSOR_OF_RECORD moves its whole exposure onto the licensor row, and a PRIVATE_LABEL_RETAILER with SELF_OF_RECORD keeps it. The window is all-time; there is no date filter. The sum is order-insensitive so no tie-break is needed."
    constants: {}
    precision: "each term is already at 2 decimal places; the sum is rounded to 2 decimal places, round_half_up"
    variants: []

  - name: brand_posture
    trigger: "on every transition whose side_effects say to recompute Brand.posture: ImportShipment marking review and correction, ComplianceAudit OPEN -> IN_REVIEW, IN_REVIEW -> PENDING_CLOSURE and PENDING_CLOSURE -> IN_REVIEW, and the AuditFinding REMEDIATED -> CLOSED and CLOSED -> OPEN transitions"
    algorithm: threshold
    formula: |
      X.critical_audit_finding_count = sum( A.critical_finding_count for A in ComplianceAudit
                                            where responsible_of( Brand[A.brand_id] ) == X.id )
      ledger = calculations.brand_penalty_ledger( X, exclude_shipment_id )
      restrict = EXISTS a ComplianceAudit A where
                     responsible_of( Brand[A.brand_id] ) == X.id
                 and A.state == IN_REVIEW
                 and A.critical_finding_count >= CRITICAL_FINDING_RESTRICT_THRESHOLD
      if ledger > PENALTY_SUSPEND_LEDGER_USD : posture = SUSPENDED   # STRICTLY greater
      elif restrict                          : posture = RESTRICTED
      else                                   : posture = OPEN
    input_set: "The brand penalty ledger (optionally excluding one shipment, used only by marking_penalty_assessment step 1) plus every ComplianceAudit row whose brand resolves to this brand of record. The RESTRICTED predicate reads the AUDIT state, not the finding rows directly, which is what makes the verify cascade propagate audit -> brand rather than finding -> brand."
    constants:
      PENALTY_SUSPEND_LEDGER_USD: 25000.00
      CRITICAL_FINDING_RESTRICT_THRESHOLD: 3
    precision: "ledger compared at 2 decimal places with a STRICT greater-than, so a ledger of exactly 25000.00 is not SUSPENDED; the finding threshold is INCLUSIVE, so exactly 3 critical findings is RESTRICTED"
    variants: []

  - name: finding_severity
    trigger: "on POST /labeling/compliance-audits/{id}/findings, whose side_effects list deriving AuditFinding.severity"
    algorithm: threshold
    formula: |
      base = CRITICAL if finding_code IN { FIBER_CONTENT_MISSTATED, ORIGIN_MISSTATED }
             else MAJOR if finding_code IN { CARE_UNSUBSTANTIATED, IDENTITY_MISSING,
                                             PLACEMENT_NON_PERMANENT }
             else MINOR
      severity = escalate_one_level(base) if units_affected >= SEVERITY_ESCALATION_UNITS
                 else base
      # escalate_one_level: MINOR -> MAJOR, MAJOR -> CRITICAL, CRITICAL -> CRITICAL
    input_set: "The finding own finding_code and units_affected only; sibling findings never affect severity."
    constants:
      SEVERITY_ESCALATION_UNITS: 5000
    precision: "the escalation breakpoint is INCLUSIVE: 4999 units does not escalate, 5000 units does"
    variants: []

  - name: audit_rollup
    trigger: "on every transition whose side_effects say to recompute the audit counters: AuditFinding OPEN -> REMEDIATED, REMEDIATED -> CLOSED, CLOSED -> OPEN, and ComplianceAudit OPEN -> IN_REVIEW"
    algorithm: aggregation
    formula: |
      open_finding_count     = count( F in AuditFinding where F.audit_id == A.id
                                      and F.state IN { OPEN, REMEDIATED } )
      critical_finding_count = count( F in AuditFinding where F.audit_id == A.id
                                      and F.state IN { OPEN, REMEDIATED }
                                      and F.severity == CRITICAL )
      units_in_scope         = sum( F.units_affected for F in AuditFinding
                                    where F.audit_id == A.id )   # NO state filter at all
      # derived audit state
      if A.state == IN_REVIEW        and open_finding_count == 0 : A.state = PENDING_CLOSURE
      if A.state == PENDING_CLOSURE  and open_finding_count >  0 : A.state = IN_REVIEW
    input_set: "AuditFinding rows of exactly this audit. The two counts filter to state IN {OPEN, REMEDIATED} - a REMEDIATED finding is still open for closure purposes - while units_in_scope deliberately has NO state filter so it is invariant under disposition, verification and reopening. All three are order-insensitive counts and sums, so no tie-break is required."
    constants: {}
    precision: "integer counts and sums, exact"
    variants: []

  - name: finding_unit_conservation
    trigger: "checked on POST /labeling/audit-findings/{id}/disposition and re-established by POST /labeling/audit-findings/{id}/reopen, both of which list recomputing units_unresolved in their side_effects"
    algorithm: aggregation
    formula: |
      units_unresolved = units_affected
                         - ( units_relabeled + units_destroyed + units_released )
      INVARIANT (must hold after every request that touches the finding):
        units_affected == units_relabeled + units_destroyed + units_released + units_unresolved
        and units_unresolved >= 0
      disposition: requires units_relabeled + units_destroyed + units_released == units_affected,
                   which drives units_unresolved to exactly 0
      reopen:      resets the three counters to 0, which restores
                   units_unresolved == units_affected, and leaves
                   ComplianceAudit.units_in_scope byte-identical to its pre-disposition value
    input_set: "This AuditFinding row only. units_affected is immutable after creation, which is what makes it a conserved quantity."
    constants: {}
    precision: "integers, exact; no rounding anywhere"
    variants: []

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-blank, and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 15
    category: auth
    check: "the acting X-User-Role appears in the endpoint roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 20
    category: existence
    check: "every id embedded in the path resolves to a live row, validated left-to-right"
    error_id: ERR_STYLE_NOT_FOUND | ERR_BRAND_NOT_FOUND | ERR_MATERIAL_INPUT_NOT_FOUND | ERR_LAB_TEST_NOT_FOUND | ERR_ORIGIN_DETERMINATION_NOT_FOUND | ERR_LABEL_SPEC_NOT_FOUND | ERR_IMPORT_SHIPMENT_NOT_FOUND | ERR_COMPLIANCE_AUDIT_NOT_FOUND | ERR_AUDIT_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 25
    category: auth
    check: "when the acting role is BrandAdmin, the resource brand chain resolves to X-User-ID: Style.brand_id, MaterialInput.style_id -> Style.brand_id, ImportShipment.importer_brand_id, AuditFinding.style_id -> Style.brand_id must all equal the acting brand id"
    error_id: ERR_BRAND_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /labeling/styles, PUT /labeling/styles/{id}/fiber-declaration, POST /labeling/styles/{id}/material-inputs, POST /labeling/label-specs/{id}/hangtags, POST /labeling/import-shipments, POST /labeling/import-shipments/{id}/correct"

  - priority: 30
    category: existence
    check: "every id supplied in the request body resolves to a live row, validated in the field order declared by the endpoint input list; market codes resolve to a registered MarketRequirement row"
    error_id: ERR_BRAND_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_MATERIAL_INPUT_NOT_FOUND | ERR_LAB_TEST_NOT_FOUND | ERR_ORIGIN_DETERMINATION_NOT_FOUND | ERR_LABEL_SPEC_NOT_FOUND | ERR_MARKET_REQUIREMENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with an id or market code in its body"

  - priority: 35
    category: business_constraint
    check: "request shape: required fields present, enum values are declared members, numbers within their declared ranges, arrays non-empty where required, limit within [1,100] and offset >= 0, method matches test_type (AATCC_20A / ISO_1833 for FIBER_CONTENT, AATCC_135 / ISO_6330 for CARE_PERFORMANCE), wash_temp_c null for FIBER_CONTENT and non-null for CARE_PERFORMANCE, results_due_at strictly after specimen_received_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 38
    category: business_constraint
    check: "party_type == LICENSEE requires a non-null licensor_brand_id, and any other party_type requires licensor_brand_id to be null; responsibility_mode == LICENSOR_OF_RECORD requires a non-null licensor_brand_id"
    error_id: ERR_LICENSOR_REQUIRED
    http_status: 422
    applies_to: "POST /labeling/brands"

  - priority: 40
    category: state
    check: "the OCC field expected_style_version / expected_parent_label_spec_version equals the current version of the named parent row"
    error_id: ERR_STALE_STYLE_VERSION | ERR_STALE_LABEL_VERSION
    http_status: 412
    applies_to: "PUT /labeling/styles/{id}/fiber-declaration, POST /labeling/origin-determinations, POST /labeling/label-specs/{id}/hangtags"

  - priority: 45
    category: state
    check: "the target row is in a state from which the requested transition is declared in the 1.2 table"
    error_id: ERR_LABEL_STATE_INVALID | ERR_LAB_TEST_STATE_INVALID | ERR_ORIGIN_STATE_INVALID | ERR_SHIPMENT_STATE_INVALID | ERR_AUDIT_STATE_INVALID | ERR_FINDING_STATE_INVALID
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 50
    category: auth
    check: "segregation of duties: the acting X-User-ID on an approval MUST differ from LabelSpec.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /labeling/label-specs/{id}/approve"
    note: "Placed after existence and state because the check needs the loaded row; it is still an authorization decision, not a business rule."

  - priority: 55
    category: business_safety
    check: "for artifact_type == PERMANENT_LABEL approval: Style.substantiation_state == FIBER_SUBSTANTIATED"
    error_id: ERR_FIBER_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 56
    category: business_safety
    check: "for artifact_type == PERMANENT_LABEL approval: Style.origin_state == ORIGIN_ISSUED"
    error_id: ERR_ORIGIN_NOT_ISSUED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 57
    category: business_safety
    check: "for artifact_type == PERMANENT_LABEL approval: the pinned care_test wash_temp_c equals LabelSpec.wash_temp_c"
    error_id: ERR_CARE_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 58
    category: business_safety
    check: "steps 1 (identity) and 2 (placement) of calculations.label_market_compliance"
    error_id: ERR_IDENTITY_DISCLOSURE_MISSING | ERR_PLACEMENT_NOT_PERMANENT
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 59
    category: business_safety
    check: "for artifact_type == HANGTAG approval or creation: every entry of marketing_claims satisfies its CLAIM_RULE in calculations.hangtag_consistency"
    error_id: ERR_HANGTAG_CLAIM_UNSUPPORTED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/hangtags, POST /labeling/label-specs/{id}/approve"

  - priority: 60
    category: business_referential
    check: "a referenced row is of the right kind and in an eligible state: origin_determination_id must be an OriginDetermination of the same style; care_test_id must be a CARE_PERFORMANCE LabTest of the same style in state PASSED; corrective_label_spec_id must be a PERMANENT_LABEL LabelSpec of the same style in state PUBLISHED, and on a disposition it is required exactly when units_relabeled > 0 and MUST be omitted when units_relabeled == 0; parent_label_spec_id must be a PERMANENT_LABEL row"
    error_id: ERR_REFERENCE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /labeling/label-specs, PATCH /labeling/label-specs/{id}, POST /labeling/label-specs/{id}/hangtags, POST /labeling/label-specs/{id}/approve, POST /labeling/audit-findings/{id}/disposition, POST /labeling/import-shipments/{id}/correct"

  - priority: 65
    category: business_referential
    check: "step 3 (content_match) of calculations.label_market_compliance: fiber_content_text equals Style.effective_fiber_content_text and origin_text equals Made in {determined_country} of the pinned determination"
    error_id: ERR_LABEL_CONTENT_MISMATCH
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 70
    category: business_temporal
    check: "the pinned care_test valid_until is at or after the logical clock"
    error_id: ERR_TEST_EVIDENCE_EXPIRED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 71
    category: business_temporal
    check: "the logical clock is at or before ImportShipment.redelivery_deadline_at"
    error_id: ERR_REDELIVERY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /labeling/import-shipments/{id}/correct"

  - priority: 72
    category: business_temporal
    check: "effective_to is strictly after effective_from; audit_window_to is strictly after audit_window_from"
    error_id: ERR_INVALID_EFFECTIVE_WINDOW
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/publish, POST /labeling/compliance-audits"

  - priority: 75
    category: business_constraint
    check: "step 4 (language) of calculations.label_market_compliance: the union of required_languages over the label markets is a subset of LabelSpec.languages"
    error_id: ERR_LANGUAGE_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 77
    category: business_constraint
    check: "step 5 (market_subset) of calculations.label_market_compliance: LabelSpec.market_codes is a subset of Style.target_market_codes"
    error_id: ERR_MARKET_NOT_TARGETED
    http_status: 422
    applies_to: "POST /labeling/label-specs, PATCH /labeling/label-specs/{id}, POST /labeling/label-specs/{id}/approve"

  - priority: 78
    category: business_constraint
    check: "when declared_fibers is non-empty its percentages sum to exactly 100.0 after each line is rounded to one decimal place, and fiber_generic_name values are distinct; an omitted or empty array on POST /labeling/styles is accepted and leaves the style undeclared, while PUT /labeling/styles/{id}/fiber-declaration requires a non-empty array (an empty one is a shape violation at priority 35)"
    error_id: ERR_FIBER_PERCENT_SUM
    http_status: 422
    applies_to: "POST /labeling/styles, PUT /labeling/styles/{id}/fiber-declaration"

  - priority: 79
    category: business_constraint
    check: "the style declared_fibers array is non-empty when a PERMANENT_LABEL is created or a FIBER_CONTENT test is reserved"
    error_id: ERR_FIBER_DECLARATION_EMPTY
    http_status: 422
    applies_to: "POST /labeling/label-specs, POST /labeling/lab-tests"

  - priority: 80
    category: business_constraint
    check: "MaterialInput stage order: parent_input_id must reference a node of the same style whose STAGE_RANK is strictly less than the new node STAGE_RANK, and TRIM nodes must have parent_input_id null"
    error_id: ERR_MATERIAL_STAGE_ORDER
    http_status: 422
    applies_to: "POST /labeling/styles/{id}/material-inputs"

  - priority: 81
    category: business_constraint
    check: "uniqueness: (brand_id, style_code) is unique; entry_number is unique; market_code is unique; at most one LabTest per (style_id, test_type) in state BENCH_RESERVED; at most one AuditFinding per (audit_id, style_id, finding_code) in state IN {OPEN, REMEDIATED}"
    error_id: ERR_DUPLICATE_STYLE_CODE | ERR_DUPLICATE_ENTRY_NUMBER | ERR_DUPLICATE_MARKET_CODE | ERR_TEST_ALREADY_RESERVED | ERR_DUPLICATE_OPEN_FINDING
    http_status: 409
    applies_to: "POST /labeling/styles, POST /labeling/import-shipments, POST /labeling/market-requirements, POST /labeling/lab-tests, POST /labeling/compliance-audits/{id}/findings"

  - priority: 82
    category: business_constraint
    check: "a HANGTAG row consistency_state must be CONSISTENT: its normalized fiber_content_text and origin_text equal the parent PERMANENT_LABEL values"
    error_id: ERR_HANGTAG_INCONSISTENT
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/hangtags, POST /labeling/label-specs/{id}/approve"

  - priority: 83
    category: business_constraint
    check: "lab bench occupancy: for the requested (lab_code, method), fewer than LAB_BENCH_CAPACITY (2) other LabTest rows in state BENCH_RESERVED have an occupancy interval overlapping this one. The occupancy interval is [specimen_received_at, results_due_at + CONDITIONING_BUFFER_HOURS] and is CLOSED at both ends, so an interval whose start instant equals another interval end instant DOES collide"
    error_id: ERR_LAB_BENCH_CAPACITY
    http_status: 409
    applies_to: "POST /labeling/lab-tests, POST /labeling/lab-tests/{id}/retest"

  - priority: 84
    category: business_constraint
    check: "market window occupancy: for every market_code this label shares with another PUBLISHED LabelSpec of the same style, the HALF-OPEN window [effective_from, effective_to) must not intersect that row window. Exactly one published label may occupy a (style_id, market_code) pair at any instant, and touching windows (new.effective_from == existing.effective_to) are ALLOWED"
    error_id: ERR_LABEL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /labeling/label-specs/{id}/publish"

  - priority: 85
    category: business_constraint
    check: "disposition completeness: units_relabeled + units_destroyed + units_released == AuditFinding.units_affected, and each of the three is >= 0"
    error_id: ERR_DISPOSITION_INCOMPLETE
    http_status: 422
    applies_to: "POST /labeling/audit-findings/{id}/disposition"

  - priority: 86
    category: business_constraint
    check: "correction sizing: 0 < corrected_units <= ImportShipment.quantity_units"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /labeling/import-shipments/{id}/correct"

  - priority: 87
    category: business_constraint
    check: "origin graph sufficiency: the style has at least one non-ornamentation node with stage IN {YARN, FABRIC, CUT_AND_SEW} for the substantial-transformation pool, and at least one with stage IN {YARN, FABRIC} or a FIBER fallback node for the yarn-forward pool"
    error_id: ERR_ORIGIN_GRAPH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /labeling/origin-determinations"

  - priority: 88
    category: business_constraint
    check: "laboratory result coherence: for FIBER_CONTENT results the measured_pct values sum to a value within [99.0, 101.0]"
    error_id: ERR_LAB_RESULT_INCOHERENT
    http_status: 422
    applies_to: "POST /labeling/lab-tests/{id}/results"

  - priority: 90
    category: business_fiscal
    check: "the owning brand of record posture is not SUSPENDED"
    error_id: ERR_BRAND_POSTURE_SUSPENDED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve, POST /labeling/label-specs/{id}/publish"

  - priority: 92
    category: business_fiscal
    check: "the owning brand of record posture is not RESTRICTED"
    error_id: ERR_BRAND_POSTURE_RESTRICTED
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

  - priority: 95
    category: business_constraint
    check: "step 6 (durability) of calculations.label_market_compliance: min(care_test.legibility_cycles, durability_cycles_rating) >= ceil(max market min_durability_cycles * product class factor)"
    error_id: ERR_DURABILITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /labeling/label-specs/{id}/approve"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving: logical clock ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server logical clock used by every temporal rule (test evidence validity, redelivery windows, label effective windows, lab bench occupancy, audit windows). The server startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ComplianceAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock to current_utc; no stored row is mutated and no recomputation is triggered"

  # --- market requirement registry ----------------------------------------
  - method: POST
    path: "/labeling/market-requirements"
    description: "Registers the labeling regime of one market. Immutable once created (MarketRequirement has common_fields: false, so there is no version field and no update endpoint)."
    roles: [ComplianceAdmin]
    code: 201
    input: [market_code, required_languages, fiber_tolerance_pp, absolute_claim_tolerance_pp, min_durability_cycles, marking_duty_rate, requires_identity_disclosure, requires_origin_statement]
    output: MarketRequirement
    side_effects:
      - "creates the MarketRequirement row with a system-generated id and created_at; no updated_at and no version are emitted"

  - method: GET
    path: "/labeling/market-requirements"
    description: "Lists registered market regimes, ordered by market_code ascending."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, AccreditedLab, CustomsOfficer, Auditor]
    code: 200
    input: ["market_code?", "limit?", "offset?"]
    output: MarketRequirement[]
    side_effects: []

  # --- brands --------------------------------------------------------------
  - method: POST
    path: "/labeling/brands"
    description: "Registers a brand owner, private-label retailer, or licensee, and fixes which party carries labeling responsibility."
    roles: [ComplianceAdmin]
    code: 201
    input: ["legal_name", "party_type", "rn_number?", "licensor_brand_id?", "responsibility_mode"]
    output: Brand
    side_effects:
      - "runs calculations.brand_penalty_ledger with an empty shipment set, so outstanding_penalty_usd starts at 0.00"
      - "runs calculations.brand_posture with an empty audit set, so posture starts at OPEN and critical_audit_finding_count at 0"
      - "resolves computed responsible_brand_id per responsibility_mode: the licensor_brand_id when LICENSOR_OF_RECORD, this row own id when SELF_OF_RECORD"

  - method: GET
    path: "/labeling/brands/{id}"
    description: "Reads one brand including its computed responsibility owner, penalty ledger, and posture."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, CustomsOfficer, Auditor]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: GET
    path: "/labeling/brands"
    description: "Lists brands. licensor_brand_id filters to the licensees of one licensor (self-referential reverse lookup); responsible_brand_id filters to every brand whose responsibility of record resolves to the given brand."
    roles: [ComplianceAdmin, Auditor]
    code: 200
    input: ["party_type?", "licensor_brand_id?", "responsible_brand_id?", "posture?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []

  - method: GET
    path: "/labeling/brands/{id}/styles"
    description: "Lists the styles owned by one brand, ordered by created_at ascending."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, Auditor]
    code: 200
    input: ["substantiation_state?", "origin_state?", "label_readiness?", "limit?", "offset?"]
    output: Style[]
    side_effects: []

  # --- styles and the fiber declaration ------------------------------------
  - method: POST
    path: "/labeling/styles"
    description: "Registers a style with its target markets and its declared fiber content. The style starts at substantiation_state FIBER_DECLARED and origin_state ORIGIN_UNDETERMINED."
    roles: [BrandAdmin, ComplianceAdmin]
    code: 201
    input: [brand_id, style_code, product_class, target_market_codes, net_weight_grams, "declared_fibers?"]
    output: Style
    side_effects:
      - "runs calculations.effective_fiber_content_text and stores effective_fiber_content_text"
      - "sets substantiation_state to FIBER_DECLARED and origin_state to ORIGIN_UNDETERMINED"
      - "sets label_readiness to BLOCKED"

  - method: GET
    path: "/labeling/styles/{id}"
    description: "Reads one style with both of its parallel state dimensions and its computed fiber content text."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, AccreditedLab, CustomsOfficer, Auditor]
    code: 200
    input: []
    output: Style
    side_effects: []

  - method: PUT
    path: "/labeling/styles/{id}/fiber-declaration"
    description: "Replaces the declared fiber content of a style. OCC-guarded on the style itself; a replacement invalidates any prior substantiation."
    roles: [BrandAdmin, ComplianceAdmin]
    code: 200
    input: [declared_fibers, expected_style_version]
    output: Style
    side_effects:
      - "re-runs calculations.effective_fiber_content_text"
      - "resets substantiation_state to FIBER_DECLARED and supersedes any PASSED FIBER_CONTENT LabTest of this style (state PASSED -> SUPERSEDED)"
      - "recomputes label_readiness, which becomes BLOCKED"
      - "increments Style.version by 1"

  - method: POST
    path: "/labeling/styles/{id}/material-inputs"
    description: "Appends one node to the style supply graph. parent_input_id links the node to the upstream node it was made from; a TRIM node must be a root."
    roles: [BrandAdmin, ComplianceAdmin]
    code: 201
    input: ["stage", "country_code", "value_added_usd", "weight_grams", "is_ornamentation", "parent_input_id?"]
    output: MaterialInput
    side_effects:
      - "computes depth as 0 for a root node and parent depth + 1 otherwise"
      - "voids any ISSUED OriginDetermination of this style (state ISSUED -> VOID) and drives Style.origin_state ORIGIN_ISSUED -> ORIGIN_UNDETERMINED, because the graph the determination was computed from has changed"
      - "cascades to every PERMANENT_LABEL LabelSpec of this style whose origin_determination_id is the voided determination and whose state IN {PENDING_APPROVAL, APPROVED, PUBLISHED}, withdrawing it with withdrawn_reason AUTO_ORIGIN_VOIDED, and then to each of their HANGTAG children in state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} with withdrawn_reason AUTO_PARENT_WITHDRAWN"
      - "recomputes Style.label_readiness"
      - "increments Style.version by 1"

  - method: GET
    path: "/labeling/material-inputs/{id}"
    description: "Reads one supply-graph node."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, Auditor]
    code: 200
    input: []
    output: MaterialInput
    side_effects: []

  - method: GET
    path: "/labeling/material-inputs"
    description: "Lists supply-graph nodes, ordered by depth ascending then created_at ascending. style_id finds every node of a style; parent_input_id finds the direct children of one node (self-referential reverse lookup)."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, Auditor]
    code: 200
    input: ["style_id?", "parent_input_id?", "stage?", "country_code?", "limit?", "offset?"]
    output: MaterialInput[]
    side_effects: []

  - method: GET
    path: "/labeling/styles/{id}/compliance-summary"
    description: "Computed read: the current labeling posture of one style, including the derived durability floor and every reason the style is not label-ready. required_durability_cycles is computed over Style.target_market_codes (the widest floor the style could ever have to meet) rather than over any one label market set; substantiated_durability_cycles is the legibility_cycles of the newest PASSED CARE_PERFORMANCE row of the style and reads 0 when there is none; determined_country is null unless the style has an ISSUED determination; blocking_reasons is the list of error_id values for the four style-level gates that are not yet satisfied, in 1.4 priority order: ERR_FIBER_NOT_SUBSTANTIATED while substantiation_state != FIBER_SUBSTANTIATED, ERR_ORIGIN_NOT_ISSUED while origin_state != ORIGIN_ISSUED, ERR_CARE_NOT_SUBSTANTIATED while the style has no PASSED CARE_PERFORMANCE row, and ERR_DURABILITY_INSUFFICIENT while substantiated_durability_cycles < required_durability_cycles. It is empty exactly when all four hold; label-specific gates (market subset, language, placement, content match) are not evaluated here because no label is named in the request."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, Auditor]
    code: 200
    input: []
    output: { style_id: string, substantiation_state: string, origin_state: string, label_readiness: string, effective_fiber_content_text: string, determined_country: string, required_durability_cycles: integer, substantiated_durability_cycles: integer, published_permanent_label_count: integer, blocking_reasons: array }
    side_effects:
      - "runs calculations.durability_adequacy and calculations.label_market_compliance in read-only mode; stores nothing"

  # --- laboratory testing ---------------------------------------------------
  - method: POST
    path: "/labeling/lab-tests"
    description: "Reserves a laboratory bench for one specimen. The reservation occupies [specimen_received_at, results_due_at + 24h] on the (lab_code, method) bench pair, and at most LAB_BENCH_CAPACITY (2) reservations may overlap any instant."
    roles: [AccreditedLab, ComplianceAdmin]
    code: 201
    input: ["style_id", "test_type", "lab_code", "method", "specimen_received_at", "results_due_at", "wash_temp_c?"]
    output: LabTest
    side_effects:
      - "creates the LabTest in state BENCH_RESERVED with attempt_no 1"
      - "for test_type == FIBER_CONTENT, drives Style.substantiation_state FIBER_DECLARED -> FIBER_TEST_PENDING, or FIBER_SUBSTANTIATED -> FIBER_TEST_PENDING when an already substantiated style is re-verified; the prior PASSED row keeps its state until the new row reaches PASSED"
      - "recomputes Style.label_readiness"
      - "increments Style.version by 1"

  - method: POST
    path: "/labeling/lab-tests/{id}/results"
    description: "Records the laboratory outcome. A FIBER_CONTENT result runs calculations.fiber_tolerance_evaluation; a CARE_PERFORMANCE result runs calculations.care_performance_evaluation."
    roles: [AccreditedLab]
    code: 200
    input: ["measured_fibers?", "dimensional_change_pct?", "colorfastness_grade?", "legibility_cycles?", "cycles_run?"]
    output: LabTest
    side_effects:
      - "sets result_delta_pp_max for a FIBER_CONTENT run and drives LabTest BENCH_RESERVED -> PASSED or -> FAILED"
      - "sets valid_until to specimen_received_at plus FIBER_TEST_VALIDITY_DAYS (365) for FIBER_CONTENT or plus CARE_TEST_VALIDITY_DAYS (730) for CARE_PERFORMANCE on a PASSED run, so the horizon depends only on pinned inputs and never on when the result happened to be posted"
      - "supersedes the previously PASSED LabTest of the same (style_id, test_type), if any (PASSED -> SUPERSEDED)"
      - "for FIBER_CONTENT, drives Style.substantiation_state FIBER_TEST_PENDING -> FIBER_SUBSTANTIATED on PASS or -> FIBER_MISSTATED on FAIL"
      - "on FIBER_MISSTATED, cascades to every PERMANENT_LABEL LabelSpec of this style in state IN {PENDING_APPROVAL, APPROVED, PUBLISHED}, withdrawing it with withdrawn_reason AUTO_FIBER_MISSTATED, and then to each of their HANGTAG children in state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED} with withdrawn_reason AUTO_PARENT_WITHDRAWN"
      - "recomputes Style.label_readiness"
      - "increments Style.version by 1"

  - method: POST
    path: "/labeling/lab-tests/{id}/retest"
    description: "Re-reserves the bench for a failed specimen on the same LabTest row, with a fresh occupancy window. Bench capacity is re-checked against the new window."
    roles: [AccreditedLab, ComplianceAdmin]
    code: 200
    input: ["specimen_received_at", "results_due_at", "lab_code?", "method?", "wash_temp_c?"]
    output: LabTest
    side_effects:
      - "drives LabTest FAILED -> BENCH_RESERVED and increments attempt_no by 1"
      - "clears measured_fibers, dimensional_change_pct, colorfastness_grade, legibility_cycles, cycles_run, result_delta_pp_max and valid_until"
      - "for test_type == FIBER_CONTENT, drives Style.substantiation_state FIBER_MISSTATED -> FIBER_TEST_PENDING and increments Style.version by 1"

  - method: GET
    path: "/labeling/lab-tests/{id}"
    description: "Reads one laboratory run with its measurements, evaluation delta, and evidence validity horizon."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, AccreditedLab, Auditor]
    code: 200
    input: []
    output: LabTest
    side_effects: []

  - method: GET
    path: "/labeling/styles/{id}/lab-tests"
    description: "Lists every laboratory run submitted for one style, ordered by created_at ascending."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, AccreditedLab, Auditor]
    code: 200
    input: ["test_type?", "state?", "lab_code?", "method?", "limit?", "offset?"]
    output: LabTest[]
    side_effects: []

  # --- origin determination -------------------------------------------------
  - method: POST
    path: "/labeling/origin-determinations"
    description: "Drafts an origin determination over the current supply graph of a style, computing both the substantial-transformation country and the yarn-forward country. OCC-guarded on the style, because the graph the determination reads is the object being versioned."
    roles: [ComplianceAdmin, LabelingSpecialist]
    code: 201
    input: [style_id, expected_style_version]
    output: OriginDetermination
    side_effects:
      - "runs both variants of calculations.origin_country_determination and stores st_country, yf_country, divergent and graph_node_count"
      - "creates the OriginDetermination in state DRAFT with determined_country and method_pinned still null"
      - "supersedes any other DRAFT determination of this style (DRAFT -> SUPERSEDED)"
      - "drives Style.origin_state ORIGIN_UNDETERMINED -> ORIGIN_DRAFTED, ORIGIN_DRAFTED -> ORIGIN_DRAFTED when one was already drafted, or ORIGIN_ISSUED -> ORIGIN_DRAFTED when a determination already stands issued, in which case Style.label_readiness returns to BLOCKED while the re-draft is pending"
      - "increments Style.version by 1"

  - method: POST
    path: "/labeling/origin-determinations/{id}/issue"
    description: "Issues a drafted determination by pinning the legal method to apply. The pinned method selects which of the two pre-computed countries becomes determined_country."
    roles: [ComplianceAdmin]
    code: 200
    input: [method]
    output: OriginDetermination
    side_effects:
      - "sets method_pinned, sets determined_country to st_country under SUBSTANTIAL_TRANSFORMATION or to yf_country under YARN_FORWARD, sets issued_at to the logical clock, and drives DRAFT -> ISSUED"
      - "supersedes the previously ISSUED determination of this style, if any (ISSUED -> SUPERSEDED)"
      - "drives Style.origin_state ORIGIN_DRAFTED -> ORIGIN_ISSUED"
      - "recomputes Style.label_readiness"
      - "increments Style.version by 1"

  - method: GET
    path: "/labeling/origin-determinations/{id}"
    description: "Reads one determination including both candidate countries and the divergence flag."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, CustomsOfficer, Auditor]
    code: 200
    input: []
    output: OriginDetermination
    side_effects: []

  - method: GET
    path: "/labeling/styles/{id}/origin-determinations"
    description: "Lists every determination drafted for one style, ordered by created_at ascending."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, Auditor]
    code: 200
    input: ["state?", "method_pinned?", "limit?", "offset?"]
    output: OriginDetermination[]
    side_effects: []

  # --- label specifications -------------------------------------------------
  - method: POST
    path: "/labeling/label-specs"
    description: "Drafts a permanent label for a style: the markets it will be sewn into, its languages, its placement, its care code set, and the identity disclosure it carries. artifact_type is fixed to PERMANENT_LABEL; hangtags are created through the hangtags sub-resource."
    roles: [LabelingSpecialist, ComplianceAdmin]
    code: 201
    input: ["style_id", "market_codes", "languages", "placement_code", "durability_cycles_rating", "wash_temp_c", "bleach_code", "dry_code", "iron_code", "dryclean_code", "identity_display_mode", "fiber_content_text", "origin_text", "origin_determination_id", "care_test_id", "marketing_claims?"]
    output: LabelSpec
    side_effects:
      - "creates the LabelSpec in state DRAFT with artifact_type PERMANENT_LABEL, parent_label_spec_id null and consistency_state NOT_APPLICABLE"
      - "sets authored_by_user_id to the acting X-User-ID"
      - "runs calculations.label_content_hash and stores content_hash"

  - method: PATCH
    path: "/labeling/label-specs/{id}"
    description: "Edits a label that is still DRAFT or has been sent back as REVISION_REQUESTED. A REVISION_REQUESTED row returns to DRAFT, clearing revision_note; a DRAFT row self-transitions."
    roles: [LabelingSpecialist, ComplianceAdmin]
    code: 200
    input: ["market_codes?", "languages?", "placement_code?", "durability_cycles_rating?", "wash_temp_c?", "bleach_code?", "dry_code?", "iron_code?", "dryclean_code?", "identity_display_mode?", "fiber_content_text?", "origin_text?", "origin_determination_id?", "care_test_id?", "marketing_claims?"]
    output: LabelSpec
    side_effects:
      - "applies the supplied fields, leaves omitted fields untouched, and re-runs calculations.label_content_hash"
      - "drives DRAFT -> DRAFT, or REVISION_REQUESTED -> DRAFT while clearing revision_note"
      - "for a HANGTAG row, re-runs calculations.hangtag_consistency and updates consistency_state"
      - "increments LabelSpec.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/submit"
    description: "Sends a drafted label to approval. No compliance gate runs here: submission is deliberately cheap so that the full gate ladder is exercised on approval."
    roles: [LabelingSpecialist, ComplianceAdmin]
    code: 200
    input: []
    output: LabelSpec
    side_effects:
      - "drives DRAFT -> PENDING_APPROVAL"
      - "increments LabelSpec.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/approve"
    description: "Approves a pending label. This is the gate: segregation of duties, the six ordered steps of calculations.label_market_compliance, evidence validity, hangtag claim support, and the brand posture checks all fire here in the priority order of 1.4."
    roles: [LabelingApprover]
    code: 200
    input: []
    output: LabelSpec
    side_effects:
      - "drives PENDING_APPROVAL -> APPROVED and sets approved_by_user_id to the acting X-User-ID"
      - "recomputes Style.label_readiness, which becomes READY once an APPROVED permanent label exists for every target market"
      - "increments LabelSpec.version by 1 and Style.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/request-revision"
    description: "Sends a pending label back to the author with a note. The label re-enters the authoring cycle rather than terminating."
    roles: [LabelingApprover, ComplianceAdmin]
    code: 200
    input: [revision_note]
    output: LabelSpec
    side_effects:
      - "drives PENDING_APPROVAL -> REVISION_REQUESTED and stores revision_note"
      - "increments LabelSpec.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/publish"
    description: "Puts an approved label into production for a half-open effective window [effective_from, effective_to). At most one PUBLISHED label may occupy a (style_id, market_code) pair at any instant; windows that merely touch are allowed."
    roles: [LabelingApprover, ComplianceAdmin]
    code: 200
    input: [effective_from, effective_to]
    output: LabelSpec
    side_effects:
      - "drives APPROVED -> PUBLISHED and stores effective_from and effective_to"
      - "recomputes Style.label_readiness"
      - "increments LabelSpec.version by 1 and Style.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/withdraw"
    description: "Withdraws an approved or published label. WITHDRAWN is terminal. Withdrawing a permanent label also withdraws every hangtag hanging off it."
    roles: [LabelingSpecialist, LabelingApprover, ComplianceAdmin]
    code: 200
    input: [withdrawn_reason]
    output: LabelSpec
    side_effects:
      - "drives APPROVED -> WITHDRAWN or PUBLISHED -> WITHDRAWN and stores withdrawn_reason"
      - "cascades to every HANGTAG child of this row in state IN {DRAFT, PENDING_APPROVAL, APPROVED, PUBLISHED}, withdrawing each with withdrawn_reason AUTO_PARENT_WITHDRAWN"
      - "recomputes Style.label_readiness"
      - "increments LabelSpec.version by 1 and Style.version by 1"

  - method: POST
    path: "/labeling/label-specs/{id}/hangtags"
    description: "Creates a hangtag hanging off a permanent label. The hangtag inherits nothing automatically: its fiber and origin text are supplied and then checked against the parent by calculations.hangtag_consistency, and each marketing claim must be supported by substantiated evidence. OCC-guarded on the parent permanent label."
    roles: [LabelingSpecialist, BrandAdmin, ComplianceAdmin]
    code: 201
    input: [market_codes, languages, marketing_claims, fiber_content_text, origin_text, expected_parent_label_spec_version]
    output: LabelSpec
    side_effects:
      - "creates the LabelSpec in state DRAFT with artifact_type HANGTAG, parent_label_spec_id set to the path id, style_id copied from the parent, placement_code NOT_PERMANENT, origin_determination_id null and care_test_id null"
      - "sets authored_by_user_id to the acting X-User-ID"
      - "runs calculations.hangtag_consistency and stores consistency_state, then calculations.label_content_hash"
      - "increments the parent LabelSpec.version by 1"

  - method: GET
    path: "/labeling/label-specs/{id}"
    description: "Reads one label artifact with its state, its pinned evidence references, and its consistency verdict."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, CustomsOfficer, Auditor]
    code: 200
    input: []
    output: LabelSpec
    side_effects: []

  - method: GET
    path: "/labeling/label-specs"
    description: "Lists label artifacts, ordered by created_at ascending. style_id finds every artifact of a style; parent_label_spec_id finds the hangtags of one permanent label; origin_determination_id and care_test_id find the artifacts pinned to a given piece of evidence; market_code matches artifacts whose market_codes array contains the value."
    roles: [ComplianceAdmin, BrandAdmin, LabelingSpecialist, LabelingApprover, CustomsOfficer, Auditor]
    code: 200
    input: ["style_id?", "parent_label_spec_id?", "origin_determination_id?", "care_test_id?", "artifact_type?", "state?", "market_code?", "consistency_state?", "limit?", "offset?"]
    output: LabelSpec[]
    side_effects: []

  # --- imported goods marking at customs ------------------------------------
  - method: POST
    path: "/labeling/import-shipments"
    description: "Files a customs entry for a quantity of one style by an importer of record."
    roles: [BrandAdmin, ComplianceAdmin]
    code: 201
    input: [importer_brand_id, style_id, entry_number, quantity_units, declared_value_usd, entry_market_code]
    output: ImportShipment
    side_effects:
      - "creates the ImportShipment in state ENTRY_FILED with every penalty field 0.00, corrected_units 0, and assessment_basis, posture_at_review, deficiency_code, review_decided_at and redelivery_deadline_at all null"

  - method: POST
    path: "/labeling/import-shipments/{id}/marking-review"
    description: "Records the customs marking decision. A DEFICIENT outcome pins the responsible brand posture, selects the penalty variant from it, assesses the penalty, and opens a redelivery window of REDELIVERY_WINDOW_DAYS (30) from the review instant."
    roles: [CustomsOfficer]
    code: 200
    input: ["outcome", "deficiency_code?"]
    output: ImportShipment
    side_effects:
      - "sets review_decided_at to the logical clock"
      - "on outcome == COMPLIANT, drives ENTRY_FILED -> MARKING_COMPLIANT and leaves every penalty field at 0.00"
      - "on outcome == DEFICIENT, drives ENTRY_FILED -> REDELIVERY_ORDERED, stores deficiency_code, pins posture_at_review from calculations.brand_posture of the responsible brand of record EXCLUDING this shipment own not-yet-assessed penalty, then runs calculations.marking_penalty_assessment to set assessment_basis, penalty_ad_valorem_usd, penalty_statutory_usd and penalty_assessed_usd, and sets redelivery_deadline_at to review_decided_at plus 30 days"
      - "re-runs calculations.brand_penalty_ledger for the responsible brand of record, updating Brand.outstanding_penalty_usd, and then calculations.brand_posture, which may drive Brand.posture to SUSPENDED"
      - "increments ImportShipment.version by 1 and Brand.version by 1"

  - method: POST
    path: "/labeling/import-shipments/{id}/correct"
    description: "Files a corrective re-marking against a published permanent label, inside the redelivery window. Mitigation depends on how promptly and how completely the goods were corrected."
    roles: [BrandAdmin, ComplianceAdmin]
    code: 200
    input: [corrective_label_spec_id, corrected_units]
    output: ImportShipment
    side_effects:
      - "drives REDELIVERY_ORDERED -> MARKING_CORRECTED, stores corrective_label_spec_id and corrected_units"
      - "runs calculations.penalty_mitigation to set penalty_mitigated_usd"
      - "re-runs calculations.brand_penalty_ledger for the responsible brand of record, so Brand.outstanding_penalty_usd drops by the mitigated amount, and then calculations.brand_posture"
      - "increments ImportShipment.version by 1 and Brand.version by 1"

  - method: GET
    path: "/labeling/import-shipments/{id}"
    description: "Reads one customs entry with its pinned posture, both candidate penalty figures, the basis actually applied, and the mitigation recorded."
    roles: [ComplianceAdmin, BrandAdmin, CustomsOfficer, Auditor]
    code: 200
    input: []
    output: ImportShipment
    side_effects: []

  - method: GET
    path: "/labeling/import-shipments"
    description: "Lists customs entries, ordered by created_at ascending. importer_brand_id finds the entries of one importer, style_id the entries covering one style, and corrective_label_spec_id the entries re-marked against one published label."
    roles: [ComplianceAdmin, BrandAdmin, CustomsOfficer, Auditor]
    code: 200
    input: ["importer_brand_id?", "style_id?", "corrective_label_spec_id?", "marking_state?", "entry_market_code?", "limit?", "offset?"]
    output: ImportShipment[]
    side_effects: []

  # --- compliance audits and findings ---------------------------------------
  - method: POST
    path: "/labeling/compliance-audits"
    description: "Opens an audit over one brand for a bounded window and a declared scope."
    roles: [Auditor, ComplianceAdmin]
    code: 201
    input: [brand_id, scope, audit_window_from, audit_window_to]
    output: ComplianceAudit
    side_effects:
      - "creates the ComplianceAudit in state OPEN with open_finding_count 0, critical_finding_count 0 and units_in_scope 0; all three are computed by calculations.audit_rollup from the child findings and are never supplied by the caller"

  - method: POST
    path: "/labeling/compliance-audits/{id}/findings"
    description: "Raises one finding against a style inside an open audit. Severity is escalated by calculations.finding_severity when the affected quantity reaches SEVERITY_ESCALATION_UNITS."
    roles: [Auditor, ComplianceAdmin]
    code: 201
    input: [style_id, finding_code, units_affected]
    output: AuditFinding
    side_effects:
      - "creates the AuditFinding in state OPEN with units_relabeled, units_destroyed and units_released all 0 and units_unresolved equal to units_affected"
      - "runs calculations.finding_severity to derive severity from finding_code alone, then escalates it one level when units_affected >= SEVERITY_ESCALATION_UNITS (5000); the caller never supplies severity"
      - "drives ComplianceAudit OPEN -> IN_REVIEW on the first finding, then re-runs calculations.audit_rollup to update open_finding_count and critical_finding_count"
      - "increments ComplianceAudit.version by 1"

  - method: POST
    path: "/labeling/audit-findings/{id}/disposition"
    description: "Records how the mislabeled units were dispositioned, against the published permanent label used to re-label them. The three disposition buckets must account for every affected unit. corrective_label_spec_id is supplied only when units_relabeled > 0 and MUST be omitted otherwise. Deliberately NOT open to Auditor: the role that verifies a remediation may not perform it."
    roles: [LabelingSpecialist, ComplianceAdmin]
    code: 200
    input: ["corrective_label_spec_id?", units_relabeled, units_destroyed, units_released]
    output: AuditFinding
    side_effects:
      - "stores the three unit buckets, sets units_unresolved to 0 per calculations.finding_unit_conservation, sets disposition_recorded_at to the logical clock, and drives OPEN -> REMEDIATED"
      - "re-runs calculations.audit_rollup, which may drive ComplianceAudit IN_REVIEW -> PENDING_CLOSURE when open_finding_count reaches 0"
      - "increments AuditFinding.version by 1 and ComplianceAudit.version by 1"

  - method: POST
    path: "/labeling/audit-findings/{id}/verify"
    description: "Verifies a remediated finding. This is the third link of the finding -> audit -> brand chain: verification can complete the audit rollup, and the rollup can move the brand posture."
    roles: [Auditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects:
      - "sets verified_at to the logical clock and drives REMEDIATED -> CLOSED"
      - "re-runs calculations.audit_rollup on the parent audit, then calculations.brand_posture on the audited brand"
      - "increments AuditFinding.version by 1, ComplianceAudit.version by 1 and Brand.version by 1"

  - method: POST
    path: "/labeling/audit-findings/{id}/reopen"
    description: "Reopens a closed finding when the correction did not hold. The units that had been relabeled return to unresolved, and the parent audit is pulled back out of PENDING_CLOSURE."
    roles: [Auditor, ComplianceAdmin]
    code: 200
    input: [reopen_reason]
    output: AuditFinding
    side_effects:
      - "drives CLOSED -> OPEN, stores reopen_reason, clears verified_at and disposition_recorded_at, clears corrective_label_spec_id, and resets units_relabeled, units_destroyed and units_released to 0 so calculations.finding_unit_conservation restores units_unresolved to units_affected"
      - "re-runs calculations.audit_rollup, driving ComplianceAudit PENDING_CLOSURE -> IN_REVIEW, then calculations.brand_posture"
      - "increments AuditFinding.version by 1, ComplianceAudit.version by 1 and Brand.version by 1"

  - method: POST
    path: "/labeling/compliance-audits/{id}/close"
    description: "Closes an audit. CLOSED is terminal. An audit with no findings may be closed directly from OPEN; an audit with findings may only be closed from PENDING_CLOSURE."
    roles: [Auditor, ComplianceAdmin]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects:
      - "sets closed_at to the logical clock and drives OPEN -> CLOSED or PENDING_CLOSURE -> CLOSED"
      - "re-runs calculations.brand_posture on the audited brand, so a brand RESTRICTED by this audit returns to OPEN once the audit is closed"
      - "increments ComplianceAudit.version by 1 and Brand.version by 1"

  - method: GET
    path: "/labeling/compliance-audits/{id}"
    description: "Reads one audit with its rolled-up finding counts."
    roles: [ComplianceAdmin, BrandAdmin, Auditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []

  - method: GET
    path: "/labeling/compliance-audits"
    description: "Lists audits, ordered by created_at ascending. brand_id finds the audits of one brand."
    roles: [ComplianceAdmin, BrandAdmin, Auditor]
    code: 200
    input: ["brand_id?", "state?", "scope?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  - method: GET
    path: "/labeling/audit-findings/{id}"
    description: "Reads one finding with its severity, its disposition buckets, and its unresolved remainder."
    roles: [ComplianceAdmin, BrandAdmin, Auditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: GET
    path: "/labeling/audit-findings"
    description: "Lists findings, ordered by created_at ascending. audit_id finds the findings of one audit, style_id the findings against one style, and corrective_label_spec_id the findings remediated against one published label."
    roles: [ComplianceAdmin, BrandAdmin, Auditor]
    code: 200
    input: ["audit_id?", "style_id?", "corrective_label_spec_id?", "state?", "severity?", "finding_code?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing or blank, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting X-User-Role is not listed in the roles of the invoked endpoint"
  - id: ERR_BRAND_SCOPE_VIOLATION
    http: 403
    condition: "a BrandAdmin acts on a resource whose brand chain resolves to a brand other than the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the LabelingApprover approving a label is the same X-User-ID recorded as LabelSpec.authored_by_user_id"

  # --- not found -----------------------------------------------------------
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "a brand id in the path or body does not resolve to a live Brand row"
  - id: ERR_STYLE_NOT_FOUND
    http: 404
    condition: "a style id in the path or body does not resolve to a live Style row"
  - id: ERR_MATERIAL_INPUT_NOT_FOUND
    http: 404
    condition: "a material input id in the path or body does not resolve to a live MaterialInput row"
  - id: ERR_LAB_TEST_NOT_FOUND
    http: 404
    condition: "a lab test id in the path or body does not resolve to a live LabTest row"
  - id: ERR_ORIGIN_DETERMINATION_NOT_FOUND
    http: 404
    condition: "an origin determination id in the path or body does not resolve to a live OriginDetermination row"
  - id: ERR_LABEL_SPEC_NOT_FOUND
    http: 404
    condition: "a label spec id in the path or body does not resolve to a live LabelSpec row"
  - id: ERR_IMPORT_SHIPMENT_NOT_FOUND
    http: 404
    condition: "an import shipment id in the path does not resolve to a live ImportShipment row"
  - id: ERR_COMPLIANCE_AUDIT_NOT_FOUND
    http: 404
    condition: "a compliance audit id in the path or body does not resolve to a live ComplianceAudit row"
  - id: ERR_AUDIT_FINDING_NOT_FOUND
    http: 404
    condition: "an audit finding id in the path does not resolve to a live AuditFinding row"
  - id: ERR_MARKET_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "a market code in target_market_codes, market_codes or entry_market_code has no registered MarketRequirement row"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is absent, an enum value is not a declared member, a number falls outside its declared range, an array required to be non-empty is empty, limit is outside [1,100] or offset is negative, method does not match test_type, wash_temp_c is present on a FIBER_CONTENT reservation or absent on a CARE_PERFORMANCE one, results_due_at is not strictly after specimen_received_at, or corrected_units is not in (0, quantity_units]"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_STYLE_VERSION
    http: 412
    condition: "expected_style_version does not equal the current Style.version on PUT /labeling/styles/{id}/fiber-declaration or POST /labeling/origin-determinations"
  - id: ERR_STALE_LABEL_VERSION
    http: 412
    condition: "expected_parent_label_spec_version does not equal the current version of the parent PERMANENT_LABEL on POST /labeling/label-specs/{id}/hangtags"

  # --- state machine -------------------------------------------------------
  - id: ERR_LAB_TEST_STATE_INVALID
    http: 409
    condition: "results are posted for a LabTest that is not BENCH_RESERVED, or a retest is requested for a LabTest that is not FAILED"
  - id: ERR_ORIGIN_STATE_INVALID
    http: 409
    condition: "an issue is requested for an OriginDetermination that is not DRAFT"
  - id: ERR_LABEL_STATE_INVALID
    http: 409
    condition: "a label action is requested from a state the 1.2 LabelSpec table does not permit: a PATCH on a row that is neither DRAFT nor REVISION_REQUESTED, a submit on a row that is not DRAFT, an approve or request-revision on a row that is not PENDING_APPROVAL, a publish on a row that is not APPROVED, a withdraw on a row that is neither APPROVED nor PUBLISHED, or any action on a WITHDRAWN row"
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "a marking review is requested for an ImportShipment that is not ENTRY_FILED, or a correction is filed for one that is not REDELIVERY_ORDERED"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "a finding is raised on a ComplianceAudit that is CLOSED, or a close is requested for an audit in IN_REVIEW, which still has open findings"
  - id: ERR_FINDING_STATE_INVALID
    http: 409
    condition: "a disposition is recorded for an AuditFinding that is not OPEN, a verify is requested for one that is not REMEDIATED, or a reopen is requested for one that is not CLOSED"

  # --- business: evidence and safety ---------------------------------------
  - id: ERR_FIBER_NOT_SUBSTANTIATED
    http: 422
    condition: "a permanent label is approved while its style substantiation_state is not FIBER_SUBSTANTIATED"
  - id: ERR_ORIGIN_NOT_ISSUED
    http: 422
    condition: "a permanent label is approved while its style origin_state is not ORIGIN_ISSUED"
  - id: ERR_CARE_NOT_SUBSTANTIATED
    http: 422
    condition: "a permanent label is approved whose wash_temp_c does not equal the wash_temp_c of the CARE_PERFORMANCE run pinned as care_test_id, so the printed care instruction was never wash-tested"
  - id: ERR_IDENTITY_DISCLOSURE_MISSING
    http: 422
    condition: "identity_display_mode is RN but the responsible brand of record has a null rn_number, or the mode is COMPANY_NAME in a market whose requires_identity_disclosure is true and the responsible brand legal_name is blank"
  - id: ERR_PLACEMENT_NOT_PERMANENT
    http: 422
    condition: "a PERMANENT_LABEL is approved with placement_code NOT_PERMANENT"
  - id: ERR_HANGTAG_CLAIM_UNSUPPORTED
    http: 422
    condition: "a marketing claim is not supported by substantiated evidence: MADE_IN_USA while the pinned determined_country is not US, ORGANIC_COTTON while the measured COTTON percentage of the PASSED fiber test is below ORGANIC_CLAIM_MIN_PCT (95.0), or WRINKLE_FREE while the PASSED care run dimensional_change_pct exceeds WRINKLE_FREE_MAX_SHRINKAGE_PCT (2.0)"

  # --- business: referential eligibility -----------------------------------
  - id: ERR_REFERENCE_NOT_ELIGIBLE
    http: 422
    condition: "a referenced row exists but is of the wrong kind or in an ineligible state: origin_determination_id belongs to another style, care_test_id is not a CARE_PERFORMANCE run of this style in state PASSED, corrective_label_spec_id is not a PERMANENT_LABEL of the same style in state PUBLISHED, or a hangtag is hung off a row that is itself a HANGTAG"
  - id: ERR_LABEL_CONTENT_MISMATCH
    http: 422
    condition: "on approval, LabelSpec.fiber_content_text does not equal Style.effective_fiber_content_text, or origin_text does not equal the string Made in followed by the determined_country of the pinned determination"

  # --- business: temporal ---------------------------------------------------
  - id: ERR_TEST_EVIDENCE_EXPIRED
    http: 422
    condition: "on approval, the valid_until of the pinned care test or of the style PASSED fiber test is strictly before the logical clock"
  - id: ERR_REDELIVERY_WINDOW_EXPIRED
    http: 422
    condition: "a correction is filed after ImportShipment.redelivery_deadline_at has passed on the logical clock"
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http: 422
    condition: "effective_to is not strictly after effective_from on publish, or audit_window_to is not strictly after audit_window_from on audit creation"

  # --- business: market and content constraints ----------------------------
  - id: ERR_LANGUAGE_REQUIREMENT_UNMET
    http: 422
    condition: "the union of required_languages over the label market_codes is not a subset of LabelSpec.languages"
  - id: ERR_MARKET_NOT_TARGETED
    http: 422
    condition: "LabelSpec.market_codes contains a market that is not in Style.target_market_codes"
  - id: ERR_FIBER_PERCENT_SUM
    http: 422
    condition: "a non-empty declared_fibers array whose percentages do not sum to exactly 100.0 after each line is rounded to one decimal place, or two lines declare the same fiber_generic_name"
  - id: ERR_FIBER_DECLARATION_EMPTY
    http: 422
    condition: "a permanent label is created for, or a FIBER_CONTENT bench is reserved against, a style whose declared_fibers array is empty"
  - id: ERR_MATERIAL_STAGE_ORDER
    http: 422
    condition: "parent_input_id references a node of another style or a node whose STAGE_RANK is not strictly less than the new node STAGE_RANK, or a TRIM node is created with a non-null parent_input_id"
  - id: ERR_ORIGIN_GRAPH_INSUFFICIENT
    http: 422
    condition: "a determination is drafted for a style whose supply graph has no non-ornamentation node usable by one of the two methods"
  - id: ERR_LAB_RESULT_INCOHERENT
    http: 422
    condition: "the measured_pct values of a FIBER_CONTENT result sum to a value outside [99.0, 101.0]"
  - id: ERR_HANGTAG_INCONSISTENT
    http: 422
    condition: "a hangtag normalized fiber_content_text or origin_text differs from the parent permanent label value, so calculations.hangtag_consistency yields INCONSISTENT"
  - id: ERR_DISPOSITION_INCOMPLETE
    http: 422
    condition: "units_relabeled + units_destroyed + units_released does not equal AuditFinding.units_affected, or one of the three is negative"
  - id: ERR_DURABILITY_INSUFFICIENT
    http: 422
    condition: "min(care_test.legibility_cycles, durability_cycles_rating) is strictly less than the required floor computed by calculations.durability_adequacy"
  - id: ERR_LICENSOR_REQUIRED
    http: 422
    condition: "party_type is LICENSEE or responsibility_mode is LICENSOR_OF_RECORD but licensor_brand_id is null, or licensor_brand_id is supplied for a party_type other than LICENSEE"

  # --- business: uniqueness and capacity ------------------------------------
  - id: ERR_DUPLICATE_STYLE_CODE
    http: 409
    condition: "the brand already owns a style with this style_code"
  - id: ERR_DUPLICATE_ENTRY_NUMBER
    http: 409
    condition: "an ImportShipment with this entry_number already exists"
  - id: ERR_DUPLICATE_MARKET_CODE
    http: 409
    condition: "a MarketRequirement with this market_code is already registered"
  - id: ERR_TEST_ALREADY_RESERVED
    http: 409
    condition: "the style already has a LabTest of this test_type in state BENCH_RESERVED"
  - id: ERR_DUPLICATE_OPEN_FINDING
    http: 409
    condition: "the audit already carries a finding with this (style_id, finding_code) in state OPEN or REMEDIATED"
  - id: ERR_LAB_BENCH_CAPACITY
    http: 409
    condition: "two other BENCH_RESERVED runs on the same (lab_code, method) already occupy an interval that overlaps the requested [specimen_received_at, results_due_at + 24h] window, where the interval is closed at both ends"
  - id: ERR_LABEL_WINDOW_OVERLAP
    http: 409
    condition: "another PUBLISHED label of the same style shares a market_code and its half-open window [effective_from, effective_to) intersects the requested one"

  # --- business: fiscal posture --------------------------------------------
  - id: ERR_BRAND_POSTURE_SUSPENDED
    http: 422
    condition: "the responsible brand of record has posture SUSPENDED, which blocks both approval and publication"
  - id: ERR_BRAND_POSTURE_RESTRICTED
    http: 422
    condition: "the responsible brand of record has posture RESTRICTED, which blocks approval but still permits publication of an already approved label"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ComplianceAdmin
    description: "Platform compliance operator. Owns the market-requirement registry, the brand registry, the logical clock, and the legal pinning of an origin determination. Acts across every brand and may stand in for most operational roles, but is deliberately excluded from approving a label and from verifying an audit finding, so that no single role can both author compliance evidence and bless it."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /labeling/market-requirements"
      - "POST /labeling/brands"
      - "POST /labeling/origin-determinations/{id}/issue"
    shared_operations:
      - "POST /labeling/styles"
      - "PUT /labeling/styles/{id}/fiber-declaration"
      - "POST /labeling/styles/{id}/material-inputs"
      - "POST /labeling/lab-tests"
      - "POST /labeling/lab-tests/{id}/retest"
      - "POST /labeling/origin-determinations"
      - "POST /labeling/label-specs"
      - "PATCH /labeling/label-specs/{id}"
      - "POST /labeling/label-specs/{id}/submit"
      - "POST /labeling/label-specs/{id}/request-revision"
      - "POST /labeling/label-specs/{id}/publish"
      - "POST /labeling/label-specs/{id}/withdraw"
      - "POST /labeling/label-specs/{id}/hangtags"
      - "POST /labeling/import-shipments"
      - "POST /labeling/import-shipments/{id}/correct"
      - "POST /labeling/compliance-audits"
      - "POST /labeling/compliance-audits/{id}/findings"
      - "POST /labeling/compliance-audits/{id}/close"
      - "POST /labeling/audit-findings/{id}/disposition"
      - "POST /labeling/audit-findings/{id}/reopen"
      - "every GET in 1.5"

  - name: BrandAdmin
    description: "The brand of record acting for itself. X-User-ID is the id of a Brand row, so every write is scoped to resources whose brand chain resolves to that brand (validation priority 25). A private-label retailer and a licensee both act through this role; which of them carries labeling responsibility is decided by Brand.responsibility_mode, not by RBAC."
    identity: "entity_backed:Brand"
    exclusive_operations: []
    shared_operations:
      - "POST /labeling/styles"
      - "PUT /labeling/styles/{id}/fiber-declaration"
      - "POST /labeling/styles/{id}/material-inputs"
      - "POST /labeling/label-specs/{id}/hangtags"
      - "POST /labeling/import-shipments"
      - "POST /labeling/import-shipments/{id}/correct"
      - "GET /labeling/brands/{id}"
      - "GET /labeling/brands/{id}/styles"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/styles/{id}/compliance-summary"
      - "GET /labeling/material-inputs/{id}"
      - "GET /labeling/material-inputs"
      - "GET /labeling/lab-tests/{id}"
      - "GET /labeling/styles/{id}/lab-tests"
      - "GET /labeling/origin-determinations/{id}"
      - "GET /labeling/styles/{id}/origin-determinations"
      - "GET /labeling/label-specs/{id}"
      - "GET /labeling/label-specs"
      - "GET /labeling/import-shipments/{id}"
      - "GET /labeling/import-shipments"
      - "GET /labeling/compliance-audits/{id}"
      - "GET /labeling/compliance-audits"
      - "GET /labeling/audit-findings/{id}"
      - "GET /labeling/audit-findings"
      - "GET /labeling/market-requirements"

  - name: LabelingSpecialist
    description: "Authors label artwork content. Creates and edits permanent labels and hangtags and submits them for approval; its X-User-ID is stamped into LabelSpec.authored_by_user_id, which is exactly the value the segregation-of-duties check at priority 50 forbids the approver from matching. Cannot approve anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /labeling/label-specs"
      - "POST /labeling/label-specs/{id}/submit"
    shared_operations:
      - "PATCH /labeling/label-specs/{id}"
      - "POST /labeling/label-specs/{id}/withdraw"
      - "POST /labeling/label-specs/{id}/hangtags"
      - "POST /labeling/origin-determinations"
      - "POST /labeling/audit-findings/{id}/disposition"
      - "GET /labeling/brands/{id}"
      - "GET /labeling/brands/{id}/styles"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/styles/{id}/compliance-summary"
      - "GET /labeling/material-inputs/{id}"
      - "GET /labeling/material-inputs"
      - "GET /labeling/lab-tests/{id}"
      - "GET /labeling/styles/{id}/lab-tests"
      - "GET /labeling/origin-determinations/{id}"
      - "GET /labeling/styles/{id}/origin-determinations"
      - "GET /labeling/label-specs/{id}"
      - "GET /labeling/label-specs"
      - "GET /labeling/market-requirements"

  - name: LabelingApprover
    description: "The only role that can bless a label for production. Approval is the single point where the whole gate ladder of 1.4 fires, and the acting X-User-ID MUST differ from the LabelSpec.authored_by_user_id recorded at authoring time. Cannot author or submit a label, so it cannot manufacture the artifact it approves."
    identity: "opaque"
    exclusive_operations:
      - "POST /labeling/label-specs/{id}/approve"
    shared_operations:
      - "POST /labeling/label-specs/{id}/request-revision"
      - "POST /labeling/label-specs/{id}/publish"
      - "POST /labeling/label-specs/{id}/withdraw"
      - "GET /labeling/brands/{id}"
      - "GET /labeling/brands/{id}/styles"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/styles/{id}/compliance-summary"
      - "GET /labeling/lab-tests/{id}"
      - "GET /labeling/styles/{id}/lab-tests"
      - "GET /labeling/origin-determinations/{id}"
      - "GET /labeling/styles/{id}/origin-determinations"
      - "GET /labeling/label-specs/{id}"
      - "GET /labeling/label-specs"
      - "GET /labeling/market-requirements"

  - name: AccreditedLab
    description: "The independent laboratory. Reserves benches and is the only role that may post measurement results, so no brand-side role can write the evidence its own labels depend on."
    identity: "opaque"
    exclusive_operations:
      - "POST /labeling/lab-tests/{id}/results"
    shared_operations:
      - "POST /labeling/lab-tests"
      - "POST /labeling/lab-tests/{id}/retest"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/lab-tests/{id}"
      - "GET /labeling/styles/{id}/lab-tests"
      - "GET /labeling/market-requirements"

  - name: CustomsOfficer
    description: "The border authority. Sole role that may decide a marking review, which is the only path that pins a brand posture into a shipment and assesses a penalty. Cannot file entries, cannot file corrections, and cannot touch labels."
    identity: "opaque"
    exclusive_operations:
      - "POST /labeling/import-shipments/{id}/marking-review"
    shared_operations:
      - "GET /labeling/brands/{id}"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/origin-determinations/{id}"
      - "GET /labeling/label-specs/{id}"
      - "GET /labeling/label-specs"
      - "GET /labeling/import-shipments/{id}"
      - "GET /labeling/import-shipments"
      - "GET /labeling/market-requirements"

  - name: Auditor
    description: "Independent compliance auditor. Sole role that may verify a remediated finding, which is the link that lets a finding roll up into an audit and then into a brand posture. Cannot author, approve or publish labels, cannot record a disposition on the very finding it will verify, and cannot decide a marking review."
    identity: "opaque"
    exclusive_operations:
      - "POST /labeling/audit-findings/{id}/verify"
    shared_operations:
      - "POST /labeling/compliance-audits"
      - "POST /labeling/compliance-audits/{id}/findings"
      - "POST /labeling/compliance-audits/{id}/close"
      - "POST /labeling/audit-findings/{id}/reopen"
      - "GET /labeling/brands/{id}"
      - "GET /labeling/brands"
      - "GET /labeling/brands/{id}/styles"
      - "GET /labeling/styles/{id}"
      - "GET /labeling/styles/{id}/compliance-summary"
      - "GET /labeling/material-inputs/{id}"
      - "GET /labeling/material-inputs"
      - "GET /labeling/lab-tests/{id}"
      - "GET /labeling/styles/{id}/lab-tests"
      - "GET /labeling/origin-determinations/{id}"
      - "GET /labeling/styles/{id}/origin-determinations"
      - "GET /labeling/label-specs/{id}"
      - "GET /labeling/label-specs"
      - "GET /labeling/import-shipments/{id}"
      - "GET /labeling/import-shipments"
      - "GET /labeling/compliance-audits/{id}"
      - "GET /labeling/compliance-audits"
      - "GET /labeling/audit-findings/{id}"
      - "GET /labeling/audit-findings"
      - "GET /labeling/market-requirements"
