            - { call: "POST /api/federated-models/${f1}/freeze-windows", payload: { starts_at: "2026-09-10T00:00:00Z", ends_at: "2026-09-11T00:00:00Z", purpose: COORDINATION_FREEZE }, as: VDCManager, captures: { w1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: VDCManager }
          trigger:
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator, captures: { e1: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: VDCManager }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator, captures: { e2: $.data.error_id } }
