# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# food-safety-traceability — Expert band
# 9 Difficulty Rules x >= 2 instances each (>= 18 instances).
# Every grounds[] ref resolves to SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls /
# trigger call is a structured call against §1.5; ${var} closure holds within
# each instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recall_exposure_provisional_vs_finalized
        grounds:
          - calculations.recall_exposure_quantity
          - state_machines.HoldOrder.ACTIVE_to_DISPOSED
          - endpoints["GET /traceability/lots/{lid}/recall-trace"]
          - entities.Lot.fields.received_qty
        distinguishing_aspect: |
          Two valid exposure algorithms on the Lot-genealogy domain diverge on
          identical data: provisional sums received_qty over ALL downstream
          finished lots (80), finalized excludes DESTROYED downstream lots (50);
          80 != 50.
        test_recipe:
          setup:
            - "Facility with clock 2026-01-01. Ingredient i (shelf 10d). Supplier with coa_required=false."
            - "Raw lot R (qty 100, RELEASED, FREE). Two finished lots F1 (qty 50) and F2 (qty 30) each produced by a FINALIZED run consuming R."
            - "Before disposing: recall-trace on R returns provisional exposure 80. After a hold on F2 is DISPOSED (F2 -> DESTROYED), recall-trace on R returns finalized exposure 50."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-1", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Flour", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 10, declared_allergen_codes: ["WHEAT"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 100, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 50 }
              as: ProductionOperator
              captures: { run1: $.data.id }
            - call: "POST /traceability/production-runs/${run1}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 30 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run1}"
              payload: {}
              as: ProductionOperator
              captures: { run1_v: $.data.version }
            - call: "POST /traceability/production-runs/${run1}/finalize"
              payload: { expected_production_run_version: "${run1_v}" }
              as: ProductionOperator
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 30 }
              as: ProductionOperator
              captures: { run2: $.data.id }
            - call: "POST /traceability/production-runs/${run2}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 20 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run2}"
              payload: {}
              as: ProductionOperator
              captures: { run2_v: $.data.version }
            - call: "POST /traceability/production-runs/${run2}/finalize"
              payload: { expected_production_run_version: "${run2_v}" }
              as: ProductionOperator
          trigger:
            - call: "GET /traceability/lots/${lotR}/recall-trace"
              payload: {}
              as: SafetyAuditor
              captures: { exposure_before: $.data.exposure_qty, variant_before: $.data.exposure_variant }
            - call: "GET /traceability/production-runs/${run2}"
              payload: {}
              as: SafetyAuditor
              captures: { f2_lot: $.data.output_lot_id }
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${f2_lot}", reason: "RECALL" }
              as: QualityManager
              captures: { holdF2: $.data.id, holdF2_v: $.data.version }
            - call: "POST /traceability/hold-orders/${holdF2}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${holdF2_v}" }
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lotR}", reason: "RECALL" }
              as: QualityManager
              captures: { holdR: $.data.id, holdR_v: $.data.version }
            - call: "POST /traceability/hold-orders/${holdR}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${holdR_v}" }
              as: QualityManager
            - call: "GET /traceability/lots/${lotR}/recall-trace"
              payload: {}
              as: SafetyAuditor
              captures: { exposure_after: $.data.exposure_qty, variant_after: $.data.exposure_variant }
          assert:
            - "exposure_before == 80 (provisional: F1 received_qty 50 + F2 received_qty 30)"
            - "variant_before == \"provisional_exposure\""
            - "exposure_after == 50 (finalized: F2 excluded because DESTROYED)"
            - "variant_after == \"finalized_exposure\""

      - name: effective_expiration_provisional_vs_finalized
        grounds:
          - calculations.effective_expiration
          - state_machines.CertificateOfAnalysis.PENDING_to_ACCEPTED
          - entities.Lot.fields.effective_expiration_date
          - entities.CertificateOfAnalysis.fields.declared_shelf_life_days
        distinguishing_aspect: |
          Two valid expiration algorithms on the Lot shelf-life domain (distinct
          from the genealogy-quantity domain of the recall instance): provisional
          gives production_date + ingredient.shelf_life_days (2026-01-11);
          finalized after COA ACCEPT gives production_date + min(10,4)=4 days
          (2026-01-05); the two dates differ.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Ingredient i (shelf 10d). Supplier coa_required=true."
            - "Raw lot L (production_date 2026-01-01); on receipt effective_expiration_date = 2026-01-11. COA attests declared_shelf_life_days=4."
            - "After COA ACCEPT the lot's effective_expiration_date shortens to 2026-01-05."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-2", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Milk", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 10, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 50, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotL: $.data.id, exp_prov: $.data.effective_expiration_date }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${lotL}", measured_allergen_codes: ["MILK"], pathogen_pass: true, declared_shelf_life_days: 4 }
              as: ReceivingClerk
              captures: { coa: $.data.id }
          trigger:
            - call: "POST /traceability/coa/${coa}/decide"
              payload: { decision: "ACCEPT" }
              as: QualityManager
            - call: "GET /traceability/lots/${lotL}"
              payload: {}
              as: QualityManager
              captures: { exp_final: $.data.effective_expiration_date }
          assert:
            - "exp_prov == \"2026-01-11T00:00:00Z\" (provisional: production_date + ingredient.shelf_life_days 10)"
            - "exp_final == \"2026-01-05T00:00:00Z\" (finalized: production_date + min(10,4)=4 days)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: excursion_classification_three_input_nonlinear
        grounds:
          - calculations.excursion_accrual
          - entities.CCPReading.fields.classification
          - entities.CCPReading.fields.excursion_minutes
          - entities.Lot.fields.cumulative_excursion_minutes
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — classification branches on
          abs(measured_value_c - storage_target_c) > storage_tolerance_c, and
          excursion_minutes is a conditional product of (classification==DEVIATION)
          AND (prev exists) AND floor(time-delta); a single reading exercises the
          nested conditional + floor + threshold selection.
        test_recipe:
          setup:
            - "Facility clock advanced to 2026-01-02T03:00. Ingredient target 4, tol 2. Released lot."
            - "Reading r1 (8C DEVIATION, prev none -> 0 min). Reading r2 +30min (9C DEVIATION) -> 30 min. Reading r3 +100min (9C DEVIATION) -> 100 min; cumulative 130."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-3", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-02T03:00:00Z" }
              as: QualityManager
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Cheese", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 365, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "C1", lot_kind: "RAW_MATERIAL", received_qty: 10, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 8, measured_at: "2026-01-02T00:00:00Z" }
              as: ProductionOperator
              captures: { r1_class: $.data.classification, r1_min: $.data.excursion_minutes }
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 9, measured_at: "2026-01-02T00:30:00Z" }
              as: ProductionOperator
              captures: { r2_min: $.data.excursion_minutes }
          trigger:
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 9, measured_at: "2026-01-02T02:10:00Z" }
              as: ProductionOperator
              captures: { r3_class: $.data.classification, r3_min: $.data.excursion_minutes }
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { cum: $.data.cumulative_excursion_minutes }
          assert:
            - "r1_class == \"DEVIATION\" and r1_min == 0 (prev none)"
            - "r2_min == 30"
            - "r3_class == \"DEVIATION\" and r3_min == 100"
            - "cum == 130"

      - name: available_quantity_draw_order_evaluation_pinned
        grounds:
          - calculations.available_quantity
          - state_machines.ProductionRun.OPEN_to_FINALIZED
          - state_machines.Lot.RELEASED_to_CONSUMED
          - entities.Lot.fields.available_qty
        distinguishing_aspect: |
          Mode (c): an explicitly-pinned evaluation order — finalize draws
          ConsumedLot lines in created_at ASC and the RELEASED->CONSUMED auto-
          transition fires the instant a lot's running available_qty hits exactly
          0; lot R received 100, drawn 60 then 40 -> available_qty 0 -> CONSUMED.
          The order is pinned (created_at ASC), never lot id.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot R received_qty 100."
            - "One run with two consumed-lot lines from R: 60 then 40 (created in that order)."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-4", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Sugar", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 100, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 100 }
              as: ProductionOperator
              captures: { run: $.data.id }
            - call: "POST /traceability/production-runs/${run}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 60 }
              as: ProductionOperator
            - call: "POST /traceability/production-runs/${run}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 40 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run}"
              payload: {}
              as: ProductionOperator
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /traceability/production-runs/${run}/finalize"
              payload: { expected_production_run_version: "${run_v}" }
              as: ProductionOperator
            - call: "GET /traceability/lots/${lotR}"
              payload: {}
              as: QualityManager
              captures: { avail: $.data.available_qty, status: $.data.status }
          assert:
            - "avail == 0.0 (100 - 60 - 40)"
            - "status == \"CONSUMED\" (auto-transition when available_qty reaches exactly 0)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hold_order_branch_release_vs_dispose
        grounds:
          - state_machines.HoldOrder.ACTIVE_to_RELEASED
          - state_machines.HoldOrder.ACTIVE_to_DISPOSED
          - entities.HoldOrder.fields.disposition
        distinguishing_aspect: |
          HoldOrder is a branching fork: ACTIVE -> {RELEASED, DISPOSED} with
          divergent side-effect sets — RELEASE recomputes hold_status to FREE
          (lot survives), DISPOSE destroys the covered lot. Verified by driving
          the DISPOSE branch and observing the covered lot DESTROYED.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot L under an ACTIVE hold."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-5", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Beef", storage_target_c: 2, storage_tolerance_c: 2, shelf_life_days: 30, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 40, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lot}", reason: "PATHOGEN" }
              as: QualityManager
              captures: { hold: $.data.id, hold_v: $.data.version }
          trigger:
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
              captures: { disp: $.data.disposition, hstatus: $.data.status }
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { lstatus: $.data.status, lavail: $.data.available_qty }
          assert:
            - "hstatus == \"DISPOSED\" and disp == \"DISPOSED\""
            - "lstatus == \"DESTROYED\" and lavail == 0.0 (DISPOSE branch side effects, not the RELEASE branch)"

      - name: production_run_branch_finalize_vs_abort
        grounds:
          - state_machines.ProductionRun.OPEN_to_FINALIZED
          - state_machines.ProductionRun.OPEN_to_ABORTED
          - entities.Lot.fields.available_qty
        distinguishing_aspect: |
          ProductionRun is a branching fork on a different entity: OPEN ->
          {FINALIZED, ABORTED} with divergent side effects — ABORT draws NO
          inventory (source lot available_qty unchanged), unlike FINALIZE.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot R received 100. OPEN run with a consumed-lot line of 60."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-6", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Oat", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 100, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 60 }
              as: ProductionOperator
              captures: { run: $.data.id }
            - call: "POST /traceability/production-runs/${run}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 60 }
              as: ProductionOperator
          trigger:
            - call: "POST /traceability/production-runs/${run}/abort"
              payload: {}
              as: ProductionOperator
              captures: { rstatus: $.data.status }
            - call: "GET /traceability/lots/${lotR}"
              payload: {}
              as: QualityManager
              captures: { avail: $.data.available_qty, lstatus: $.data.status }
          assert:
            - "rstatus == \"ABORTED\""
            - "avail == 100.0 (ABORT draws no inventory, unlike FINALIZE)"
            - "lstatus == \"RELEASED\" (lot not consumed)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispose_cascade_three_hop_genealogy
        grounds:
          - state_machines.HoldOrder.ACTIVE_to_DISPOSED
          - calculations.hold_propagation
          - state_machines.Lot.RELEASED_to_DESTROYED
          - entities.Lot.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a hold DISPOSE: R DESTROYED (hop1) causes F1
          (which consumed R) DESTROYED (hop2) which causes F2 (which consumed F1)
          DESTROYED (hop3). Each hop is caused by the prior hop's genealogy edge,
          not by the original action directly.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot R (100). Finished F1 consumes R; finished F2 consumes F1. Both runs FINALIZED."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-7", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Base", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 100, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 50 }
              as: ProductionOperator
              captures: { run1: $.data.id }
            - call: "POST /traceability/production-runs/${run1}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 50 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run1}"
              payload: {}
              as: ProductionOperator
              captures: { run1_v: $.data.version }
            - call: "POST /traceability/production-runs/${run1}/finalize"
              payload: { expected_production_run_version: "${run1_v}" }
              as: ProductionOperator
              captures: { f1_lot: $.data.output_lot_id }
            - call: "POST /traceability/lots/${f1_lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 20 }
              as: ProductionOperator
              captures: { run2: $.data.id }
            - call: "POST /traceability/production-runs/${run2}/consumed-lots"
              payload: { source_lot_id: "${f1_lot}", quantity: 20 }
              as: ProductionOperator
            - call: "GET /traceability/production-runs/${run2}"
              payload: {}
              as: ProductionOperator
              captures: { run2_v: $.data.version }
            - call: "POST /traceability/production-runs/${run2}/finalize"
              payload: { expected_production_run_version: "${run2_v}" }
              as: ProductionOperator
              captures: { f2_lot: $.data.output_lot_id }
          trigger:
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lotR}", reason: "RECALL" }
              as: QualityManager
              captures: { hold: $.data.id, hold_v: $.data.version, held_count: $.data.held_lot_count }
            - call: "POST /traceability/hold-orders/${hold}/resolve"
              payload: { disposition: "DISPOSE", expected_hold_order_version: "${hold_v}" }
              as: QualityManager
            - call: "GET /traceability/lots/${f2_lot}"
              payload: {}
              as: QualityManager
              captures: { f2_status: $.data.status }
          assert:
            - "held_count == 3 (R + F1 + F2 in covered_set at issue time)"
            - "f2_status == \"DESTROYED\" (hop3: R->F1->F2 transitive destruction)"

      - name: ccp_excursion_auto_hold_cascade
        grounds:
          - calculations.excursion_accrual
          - entities.Lot.fields.cumulative_excursion_minutes
          - calculations.hold_propagation
          - entities.Lot.fields.hold_status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST ccp-readings): the
          reading bumps lot.cumulative_excursion_minutes past 120 (hop1->mutate
          lot), which auto-issues a TEMPERATURE_EXCURSION HoldOrder (hop2->new
          entity), which sets lot.hold_status = HELD. Originates from a different
          transition than the DISPOSE cascade.
        test_recipe:
          setup:
            - "Facility clock 2026-01-02T05:00. Released lot. Reading r1 (8C dev, 0 min) then r2 +130min (8C dev, 130 min) -> cumulative 130 > 120."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-8", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-02T05:00:00Z" }
              as: QualityManager
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Fish", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 30, declared_allergen_codes: ["FISH"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "FZ", lot_kind: "RAW_MATERIAL", received_qty: 10, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 8, measured_at: "2026-01-02T00:00:00Z" }
              as: ProductionOperator
          trigger:
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 8, measured_at: "2026-01-02T02:10:00Z" }
              as: ProductionOperator
              captures: { r2_min: $.data.excursion_minutes }
            - call: "GET /traceability/lots/${lot}"
              payload: {}
              as: QualityManager
              captures: { cum: $.data.cumulative_excursion_minutes, hold_status: $.data.hold_status }
            - call: "GET /traceability/hold-orders?target_lot_id=${lot}"
              payload: {}
              as: QualityManager
              captures: { autohold_reason: "$.data[0].reason" }
          assert:
            - "r2_min == 130 and cum == 130 (hop1)"
            - "hold_status == \"HELD\" (hop2 auto hold sets lot HELD)"
            - "autohold_reason == \"TEMPERATURE_EXCURSION\""

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_beats_insufficient_qty_on_finalize
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_LOT_ON_HOLD]
          - errors[ERR_INSUFFICIENT_LOT_QTY]
        distinguishing_aspect: |
          Category pair business_safety (p10 ERR_LOT_ON_HOLD) vs business_fiscal
          (p15 ERR_INSUFFICIENT_LOT_QTY): a finalize whose source lot is HELD and
          whose consumed quantity also exceeds available_qty returns the higher-
          priority safety error ERR_LOT_ON_HOLD, not the fiscal one.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. Released raw lot R received 10 (FREE), under an ACTIVE hold so HELD. OPEN run with a consumed line of 999 (> available)."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-9", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Salt", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: [] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "R", lot_kind: "RAW_MATERIAL", received_qty: 10, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lotR: $.data.id }
            - call: "POST /traceability/lots/${lotR}/release"
              payload: {}
              as: QualityManager
            - call: "POST /traceability/production-runs"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", planned_output_qty: 5 }
              as: ProductionOperator
              captures: { run: $.data.id }
            - call: "POST /traceability/production-runs/${run}/consumed-lots"
              payload: { source_lot_id: "${lotR}", quantity: 999 }
              as: ProductionOperator
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lotR}", reason: "ALLERGEN" }
              as: QualityManager
            - call: "GET /traceability/production-runs/${run}"
              payload: {}
              as: ProductionOperator
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /traceability/production-runs/${run}/finalize"
              payload: { expected_production_run_version: "${run_v}" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_LOT_ON_HOLD\" (p10 business_safety beats p15 business_fiscal ERR_INSUFFICIENT_LOT_QTY)"

      - name: coa_gate_beats_expiry_on_release
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_COA_NOT_ACCEPTED]
          - errors[ERR_LOT_EXPIRED]
        distinguishing_aspect: |
          Category pair business_safety (p11 ERR_COA_NOT_ACCEPTED) vs
          business_temporal (p12 ERR_LOT_EXPIRED) — a different pair than the
          first instance: releasing a coa_required lot that is BOTH lacking an
          accepted COA AND past effective_expiration returns the higher-priority
          COA error.
        test_recipe:
          setup:
            - "Facility clock advanced to 2026-01-20 (past 2026-01-11 expiry). coa_required supplier. Raw lot received 2026-01-01 shelf 10 (effective_expiration 2026-01-11), coa_status PENDING (no decision)."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-10", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Cream", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 10, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-20T00:00:00Z" }
              as: QualityManager
          trigger:
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_COA_NOT_ACCEPTED\" (p11 business_safety beats p12 business_temporal ERR_LOT_EXPIRED)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: temperature_tolerance_strict_boundary
        grounds:
          - calculations.excursion_accrual
          - entities.CCPReading.fields.classification
          - entities.Ingredient.fields.storage_tolerance_c
        distinguishing_aspect: |
          Metric: temperature tolerance via POST ccp-readings. abs(measured -
          target) == tolerance (exactly 6 with target 4 tol 2) is IN_SPEC; just
          over (6.5) is DEVIATION. Strict > boundary.
        test_recipe:
          setup:
            - "Facility clock 2026-01-02T01:00. Ingredient target 4 tol 2. Released lot. Reading at exactly tolerance (6C) then just over (6.5C)."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-11", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/facilities/${fid}/clock"
              payload: { to_utc: "2026-01-02T01:00:00Z" }
              as: QualityManager
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Yogurt", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 30, declared_allergen_codes: ["MILK"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "Y", lot_kind: "RAW_MATERIAL", received_qty: 10, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 6, measured_at: "2026-01-02T00:00:00Z" }
              as: ProductionOperator
              captures: { c_at_tol: $.data.classification }
            - call: "POST /traceability/ccp-readings"
              payload: { lot_id: "${lot}", ccp_type: "TEMPERATURE", measured_value_c: 6.5, measured_at: "2026-01-02T00:30:00Z" }
              as: ProductionOperator
              captures: { c_over: $.data.classification }
          assert:
            - "c_at_tol == \"IN_SPEC\" (abs(6-4)==2 == tolerance, not > tolerance)"
            - "c_over == \"DEVIATION\" (abs(6.5-4)=2.5 > 2)"

      - name: supplier_suspend_streak_boundary
        grounds:
          - calculations.supplier_suspension
          - entities.Supplier.fields.approval_status
          - entities.Supplier.fields.failed_coa_streak
        distinguishing_aspect: |
          Metric: integer consecutive-reject streak via POST coa/{cid}/decide
          (different metric and different endpoint from the temperature boundary).
          The 2nd consecutive reject leaves APPROVED (streak 2 < 3); the 3rd
          flips SUSPENDED (streak 3 >= SUSPEND_STREAK).
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. coa_required supplier. Three raw lots each with a PENDING COA, all rejected in turn."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-12", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Nut", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: ["TREE_NUT"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L1", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l1: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l1}", measured_allergen_codes: ["TREE_NUT"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa1: $.data.id }
            - call: "POST /traceability/coa/${coa1}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L2", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l2: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l2}", measured_allergen_codes: ["TREE_NUT"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa2: $.data.id }
            - call: "POST /traceability/coa/${coa2}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
            - call: "GET /traceability/suppliers/${sup}"
              payload: {}
              as: QualityManager
              captures: { status_after_2: $.data.approval_status, streak_after_2: $.data.failed_coa_streak }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L3", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l3: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l3}", measured_allergen_codes: ["TREE_NUT"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa3: $.data.id }
          trigger:
            - call: "POST /traceability/coa/${coa3}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
            - call: "GET /traceability/suppliers/${sup}"
              payload: {}
              as: QualityManager
              captures: { status_after_3: $.data.approval_status, streak_after_3: $.data.failed_coa_streak }
          assert:
            - "status_after_2 == \"APPROVED\" and streak_after_2 == 2 (2 < 3)"
            - "status_after_3 == \"SUSPENDED\" and streak_after_3 == 3 (3 >= SUSPEND_STREAK)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_release_requires_coa_accepted
        grounds:
          - state_machines.Lot.RECEIVED_to_RELEASED
          - state_machines.CertificateOfAnalysis.PENDING_to_ACCEPTED
          - entities.Lot.fields.coa_status
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Lot -> CertificateOfAnalysis: a coa_required RAW_MATERIAL
          lot's RECEIVED->RELEASED transition is gated on the related COA's state
          being ACCEPTED; PENDING blocks release (ERR_COA_NOT_ACCEPTED), ACCEPT
          unblocks it.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. coa_required supplier. Raw lot with a PENDING COA (passes all accept gates)."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-13", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Egg", storage_target_c: 4, storage_tolerance_c: 2, shelf_life_days: 30, declared_allergen_codes: ["EGG"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${lot}", measured_allergen_codes: ["EGG"], pathogen_pass: true, declared_shelf_life_days: 30 }
              as: ReceivingClerk
              captures: { coa: $.data.id }
          trigger:
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
              captures: { err_pending: $.data.error_id }
            - call: "POST /traceability/coa/${coa}/decide"
              payload: { decision: "ACCEPT" }
              as: QualityManager
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
              captures: { status_after: $.data.status }
          assert:
            - "err_pending == \"ERR_COA_NOT_ACCEPTED\" (COA still PENDING)"
            - "status_after == \"RELEASED\" (after the related COA reached ACCEPTED)"

      - name: lot_receive_requires_supplier_approved
        grounds:
          - validations[priority=9]
          - entities.Supplier.fields.approval_status
          - calculations.supplier_suspension
          - errors[ERR_SUPPLIER_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Lot -> Supplier (a different pair): receiving a new
          RAW_MATERIAL lot requires the referenced Supplier in APPROVED; once the
          supplier is SUSPENDED (3 consecutive COA rejects), a new lot from it is
          rejected with ERR_SUPPLIER_NOT_APPROVED.
        test_recipe:
          setup:
            - "Facility clock 2026-01-01. coa_required supplier driven to SUSPENDED via 3 rejected COAs on 3 lots."
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "GLN-14", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "Sup", coa_required: true }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "Soy", storage_target_c: 20, storage_tolerance_c: 5, shelf_life_days: 365, declared_allergen_codes: ["SOY"] }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L1", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l1: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l1}", measured_allergen_codes: ["SOY"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa1: $.data.id }
            - call: "POST /traceability/coa/${coa1}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L2", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l2: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l2}", measured_allergen_codes: ["SOY"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa2: $.data.id }
            - call: "POST /traceability/coa/${coa2}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L3", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { l3: $.data.id }
            - call: "POST /traceability/coa"
              payload: { lot_id: "${l3}", measured_allergen_codes: ["SOY"], pathogen_pass: true, declared_shelf_life_days: 365 }
              as: ReceivingClerk
              captures: { coa3: $.data.id }
            - call: "POST /traceability/coa/${coa3}/decide"
              payload: { decision: "REJECT" }
              as: QualityManager
          trigger:
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L4", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_SUPPLIER_NOT_APPROVED\" (supplier SUSPENDED after 3 rejects)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: storage_zone_aggregate_capacity_overlap
        grounds:
          - calculations.storage_overlap_capacity
          - validations[priority=17]
          - entities.StorageZone.fields.capacity_units
          - errors[ERR_ZONE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource StorageZone, interval semantics = half-open [start,end)
          aggregate-capacity: zone cap 100; booking A=70 over [00:00,06:00),
          booking B=40 over [03:00,09:00) overlaps A (peak 110 > 100) -> rejected.
          Touching endpoints would NOT overlap.
