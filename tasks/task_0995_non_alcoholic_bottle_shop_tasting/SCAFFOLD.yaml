    side_effects: []
  - method: GET
    path: "/nabs/special-orders/{id}"
    description: "Fetch special order"
    roles: [PlatformAdmin, ShopStaff, Member]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/nabs/special-orders/{id}/approve"
    description: "Approve and link to a real SKU"
    roles: [ShopStaff]
    code: 200
    input: ["resolved_sku_id", "approved_by_user_id"]
    output: SpecialOrder
    side_effects: ["Wallet hold -= deposit_cents"]
  - method: POST
    path: "/nabs/special-orders/{id}/decline"
    description: "Decline request"
    roles: [ShopStaff]
    code: 200
    input: ["decline_reason"]
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/nabs/special-orders/{id}/mark-sourced"
    description: "Mark sourced"
    roles: [ShopStaff]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/nabs/special-orders/{id}/receive"
    description: "Mark received; creates InventoryLot"
    roles: [ShopStaff]
    code: 200
