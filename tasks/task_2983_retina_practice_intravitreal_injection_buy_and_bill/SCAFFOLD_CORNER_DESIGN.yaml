            - call: "POST /prior-authorizations/${k_pa_m_id}/submit"
              payload: { clinical_justification: "Neovascular AMD with subretinal fluid" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${k_pa_m_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-2001", approved_injections: 3, effective_date: "2026-08-01T00:00:00Z" }
