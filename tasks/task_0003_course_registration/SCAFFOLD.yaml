# =============================================================================
# Scaffold: course-registration benchmark seed tables (v1)
# University multi-campus joint course registration system
# =============================================================================

scenario: |
  University multi-campus joint course registration system: cross-semester, cross-campus,
  and cross-program student enrollment; multi-level prerequisite dependency graph with
  equivalent course mapping; dynamic credit quota with over-limit application;
  multi-dimensional conflict detection (time / location commute / exam week / lab
  equipment / instructor teaching); waitlist queue with priority weighting and automatic
  promotion; multi-level countersigned professor approval with timeout escalation;
  cross-department bidirectional permission matrix and credit mutual recognition;
  real-time capacity elastic scaling; peak-period rate limiting and anti-fraud fairness
  safeguards; event-driven synchronization with academic affairs, finance, library, and
  dormitory systems; intelligent scheduling recommendation based on degree-plan gap
  analysis.

domain_name: course-registration
api_prefix: /registration

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - dual_variant_calculation
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short department code, unique system-wide (e.g., 'CS', 'MATH')" }
      - { name: name, type: string, source: input, description: "Full department name" }
      - { name: campus_id, type: string, source: input, description: "Primary campus the department lives on" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISSOLVED", default: "ACTIVE", constraints: "values: ACTIVE, DISSOLVED" }

  - name: Campus
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short campus code, unique system-wide (e.g., 'NORTH', 'SOUTH')" }
      - { name: name, type: string, source: input, description: "Full campus name" }
      - { name: commute_minutes_to, type: object, source: input, description: "Map of campus_id → integer minutes of commute time. Symmetric is NOT enforced; the value used in conflict detection is the value stored on the origin campus." }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: program_id, type: string, source: input, description: "FK to DegreeProgram.id (a program is a tuple of department_id + program_code stored on Student)" }
      - { name: program_department_id, type: string, source: input, description: "Student's home department id; equals Department.id" }
      - { name: home_campus_id, type: string, source: input, description: "Student's home campus id; equals Campus.id" }
      - { name: year_in_program, type: integer, source: input, description: "Integer year, 1..6", constraints: "1 <= value <= 6" }
      - { name: gpa, type: number, source: input, description: "0.00–4.00, two decimals", constraints: "0.00 <= gpa <= 4.00" }
      - { name: fraud_score, type: integer, source: computed, description: "Anti-fraud accumulator; starts at 0, increases when suspicious patterns detected", default: 0 }
      - { name: completed_course_ids, type: array, source: input, description: "Array of Course.id strings the student has already completed (used by prereq evaluation and by degree-plan gap analysis)" }
      - { name: status, type: enum, source: system, description: "ENROLLED | SUSPENDED | GRADUATED", default: "ENROLLED", constraints: "values: ENROLLED, SUSPENDED, GRADUATED" }

  - name: Professor
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK to Department.id; the professor's home department" }
      - { name: full_name, type: string, source: input, description: "Professor full name" }
      - { name: rank, type: enum, source: input, description: "ASSISTANT | ASSOCIATE | FULL", constraints: "values: ASSISTANT, ASSOCIATE, FULL" }
      - { name: is_chair, type: boolean, source: input, description: "True if this professor is the chair of department_id; only ASSOCIATE or FULL may be chair", default: false }
      - { name: max_concurrent_teaching_minutes_per_week, type: integer, source: input, description: "Cap on summed scheduled teaching minutes per week across all OPEN+IN_SESSION offerings" }

  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Term code, unique (e.g., '2026-FALL')" }
      - { name: registration_open_at, type: integer, source: input, description: "Unix epoch seconds; registration accepts requests at or after this instant (inclusive)" }
      - { name: registration_close_at, type: integer, source: input, description: "Unix epoch seconds; registration rejects requests at or after this instant (exclusive — registration_close_at itself is closed)" }
      - { name: classes_start_at, type: integer, source: input, description: "Unix epoch seconds; the first instant of instruction" }
      - { name: exam_window_start_at, type: integer, source: input, description: "Unix epoch seconds; first instant of the term's exam week (inclusive)" }
      - { name: exam_window_end_at, type: integer, source: input, description: "Unix epoch seconds; last instant of the term's exam week (exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNING | REGISTRATION_OPEN | REGISTRATION_CLOSED | IN_SESSION | CONCLUDED", default: "PLANNING", constraints: "values: PLANNING, REGISTRATION_OPEN, REGISTRATION_CLOSED, IN_SESSION, CONCLUDED" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Course code unique within owning_department_id (e.g., 'CS-201')" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credits, type: number, source: input, description: "Credit hours, two-decimal precision", constraints: "credits > 0; precision: 2" }
      - { name: owning_department_id, type: string, source: input, description: "FK to Department.id" }
      - { name: prerequisite_course_ids, type: array, source: input, description: "Array of {course_id, mode} where mode ∈ {REQUIRED, RECOMMENDED}; only REQUIRED prereqs gate enrollment", default: [] }
      - { name: equivalent_course_ids, type: array, source: input, description: "Array of Course.id strings; if a student has any of these in completed_course_ids, the course is considered completed for prereq purposes ONLY (not for degree-plan satisfaction)", default: [] }

  - name: CourseOffering
    parent: Term
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK to Term.id" }
      - { name: course_id, type: string, source: input, description: "FK to Course.id" }
      - { name: campus_id, type: string, source: input, description: "FK to Campus.id where the offering meets" }
      - { name: instructor_id, type: string, source: input, description: "FK to Professor.id" }
      - { name: base_capacity, type: integer, source: input, description: "Original seat count at creation; immutable", constraints: "base_capacity >= 1" }
      - { name: capacity, type: integer, source: system, description: "Current effective seat count; mutated by elastic scaling. Must satisfy enrolled_count <= capacity at all times AFTER scaling completes (cascade may cancel low-priority enrollments to restore the invariant)." }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of EnrollmentRequest with academic_status = APPROVED for this offering" }
      - { name: scheduled_meetings, type: array, source: input, description: "Array of {day_of_week (0=MON..6=SUN), start_minute_of_day, end_minute_of_day}; intervals are CLOSED at start, OPEN at end (i.e., [start, end))" }
      - { name: requires_lab_equipment_ids, type: array, source: input, description: "Array of LabEquipment id strings this offering uses during scheduled meetings", default: [] }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED | IN_SESSION | CONCLUDED", default: "PLANNED", constraints: "values: PLANNED, OPEN, CLOSED, IN_SESSION, CONCLUDED" }

  - name: LabEquipment
    parent: Campus
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: input, description: "FK to Campus.id where the equipment is housed" }
      - { name: name, type: string, source: input, description: "Equipment short name (e.g., 'Spectrometer-A')" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Minutes of setup/teardown that must separate two consecutive uses of the same equipment", default: 0, constraints: "setup_buffer_minutes >= 0" }

  - name: EnrollmentRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK to Student.id; must equal X-User-ID when role = Student" }
      - { name: offering_id, type: string, source: input, description: "FK to CourseOffering.id" }
      - { name: term_id, type: string, source: system, description: "Denormalized from offering for query convenience" }
      - { name: priority_score, type: integer, source: computed, description: "Computed at WAITLISTED transition (see calculations.priority_score); used to order WaitlistEntry positions" }
      - { name: provisional_credit_charge, type: number, source: computed, description: "Course.credits debited from student's provisional credit budget; set at SUBMITTED → APPROVED transition" }
      - { name: final_credit_charge, type: number, source: computed, description: "Course.credits at term-close; equals provisional_credit_charge unless an over-limit grant changed during the term", default: null }
      - { name: academic_status, type: enum, source: system, description: "SUBMITTED | APPROVED | WAITLISTED | REJECTED | CANCELED | SETTLED — academic axis", default: "SUBMITTED", constraints: "values: SUBMITTED, APPROVED, WAITLISTED, REJECTED, CANCELED, SETTLED" }
      - { name: financial_status, type: enum, source: system, description: "UNBILLED | BILLED | PAID — financial axis evolves independently from academic_status until SETTLED requires PAID", default: "UNBILLED", constraints: "values: UNBILLED, BILLED, PAID" }

  - name: WaitlistEntry
    parent: CourseOffering
    common_fields: false
    fields:
      - { name: offering_id, type: string, source: system, description: "FK to CourseOffering.id" }
      - { name: enrollment_request_id, type: string, source: system, description: "FK to EnrollmentRequest.id; this is the request whose academic_status = WAITLISTED" }
      - { name: position, type: integer, source: computed, description: "1-indexed position within the offering's waitlist; recomputed on every change to the waitlist set" }
      - { name: priority_score, type: integer, source: system, description: "Snapshot of EnrollmentRequest.priority_score at time of waitlist entry; used as primary sort key (higher first)" }
      - { name: queued_at, type: integer, source: system, description: "Unix epoch seconds; tie-break key when priority_score ties (earlier wins)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PROMOTED | EXPIRED | CANCELED — terminal: PROMOTED, EXPIRED, CANCELED", default: "ACTIVE" }

  - name: OverLimitApplication
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK to Student.id" }
      - { name: term_id, type: string, source: input, description: "FK to Term.id" }
      - { name: requested_extension_credits, type: number, source: input, description: "Extra credits requested above base quota for this term; must be > 0", constraints: "requested_extension_credits > 0" }
      - { name: justification, type: string, source: input, description: "Free-text reason" }
      - { name: primary_signer_id, type: string, source: input, description: "Professor.id of the primary signer (must belong to the student's home department; cannot be is_chair)" }
      - { name: secondary_signer_id, type: string, source: input, description: "Professor.id of the department chair (is_chair == true) of the student's home department" }
      - { name: granted_credits, type: number, source: computed, description: "Equals requested_extension_credits when status = APPROVED; 0 otherwise", default: 0 }
      - { name: timeout_deadline_at, type: integer, source: system, description: "Unix epoch seconds; AWAITING_PRIMARY auto-escalates to AWAITING_SECONDARY when clock >= deadline; AWAITING_SECONDARY auto-EXPIRES when clock >= deadline. The system writes a NEW deadline at every state entry: deadline = entry_time + APPROVAL_TIMEOUT_SECONDS." }
      - { name: status, type: enum, source: system, description: "DRAFT | AWAITING_PRIMARY | AWAITING_SECONDARY | APPROVED | REJECTED | EXPIRED", default: "DRAFT", constraints: "values: DRAFT, AWAITING_PRIMARY, AWAITING_SECONDARY, APPROVED, REJECTED, EXPIRED" }

  - name: CreditEquivalencePolicy
    parent: null
    common_fields: false
    fields:
      - { name: source_program_id, type: string, source: input, description: "Program string the policy maps from" }
      - { name: target_program_id, type: string, source: input, description: "Program string the policy maps to" }
      - { name: source_course_id, type: string, source: input, description: "Course.id from the source program" }
      - { name: target_course_id, type: string, source: input, description: "Course.id in the target program that the source course is recognized as" }
      - { name: transfer_factor, type: number, source: input, description: "Multiplier applied to source course credits when computing transferable credits; 0 < transfer_factor <= 1.00", constraints: "0 < transfer_factor <= 1.00" }

  - name: DepartmentAccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: source_department_id, type: string, source: input, description: "Department whose students gain access" }
      - { name: target_department_id, type: string, source: input, description: "Department whose courses become enrollable by source students" }
      - { name: course_categories_allowed, type: array, source: input, description: "Array of strings naming course categories (free-form tags) that source students may enroll into; empty array means no categories — explicit empty disables this grant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED", default: "ACTIVE", constraints: "values: ACTIVE, REVOKED" }
      - { name: bidirectional, type: boolean, source: input, description: "If true, the grant also implies the symmetric grant target→source for the same categories. If false, asymmetric — only source→target.", default: false }

  - name: SyncEvent
    parent: null
    common_fields: false
    fields:
      - { name: subject_entity, type: string, source: system, description: "Entity type that produced the event (e.g., 'EnrollmentRequest')" }
      - { name: subject_id, type: string, source: system, description: "ID of the subject entity" }
      - { name: event_type, type: string, source: system, description: "Event identifier; one of ENROLLMENT_APPROVED, ENROLLMENT_CANCELED, TUITION_BILLED, TUITION_PAID, OVER_LIMIT_GRANTED, CAPACITY_REDUCED_CANCELED, WAITLIST_PROMOTED" }
      - { name: target_systems, type: array, source: system, description: "Array of strings naming downstream systems to notify, drawn from {ACADEMIC_AFFAIRS, FINANCE, LIBRARY, DORMITORY}" }
      - { name: payload, type: object, source: system, description: "Event-specific payload; structured per event_type" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------- Term ----------------
  - entity: Term
    initial_state: PLANNING
    terminal_states: [CONCLUDED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "system (automatic when clock >= registration_open_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "system (automatic when clock >= registration_close_at)"
        actor: system
        preconditions: []
        side_effects:
          - "All EnrollmentRequest with academic_status = SUBMITTED → REJECTED with error reason TERM_REGISTRATION_CLOSED"
          - "All WaitlistEntry with status = ACTIVE → EXPIRED"
      - from: REGISTRATION_CLOSED
        to: IN_SESSION
        trigger: "system (automatic when clock >= classes_start_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SESSION
        to: CONCLUDED
        trigger: POST /terms/{termId}/conclude
        actor: Registrar
        preconditions:
          - "clock >= exam_window_end_at (ERR_TERM_NOT_READY_FOR_CONCLUDE)"
        side_effects:
          - "All APPROVED EnrollmentRequest with financial_status = PAID → academic_status = SETTLED; final_credit_charge populated per dynamic_credit_quota.variant_final"
          - "All APPROVED EnrollmentRequest with financial_status != PAID → academic_status = REJECTED with reason TUITION_UNPAID; SyncEvent emitted (ENROLLMENT_CANCELED to ACADEMIC_AFFAIRS, FINANCE, LIBRARY, DORMITORY)"

  # ---------------- CourseOffering ----------------
  - entity: CourseOffering
    initial_state: PLANNED
    terminal_states: [CONCLUDED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: POST /course-offerings/{offeringId}/open
        actor: Registrar
        preconditions:
          - "Term.status IN {REGISTRATION_OPEN} (ERR_TERM_NOT_OPEN_FOR_REGISTRATION)"
          - "Instructor's max_concurrent_teaching_minutes_per_week not exceeded by adding this offering's scheduled_meetings (ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: POST /course-offerings/{offeringId}/close
        actor: Registrar
        preconditions: []
        side_effects:
          - "All WaitlistEntry with status = ACTIVE for this offering → EXPIRED"
          - "All EnrollmentRequest with academic_status = SUBMITTED for this offering → REJECTED (reason OFFERING_CLOSED)"
      - from: CLOSED
        to: IN_SESSION
        trigger: "system (automatic on Term IN_SESSION transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SESSION
        to: CONCLUDED
        trigger: "system (automatic on Term CONCLUDED transition)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------- EnrollmentRequest (parallel dimensions: academic_status × financial_status) ----------------
  - entity: EnrollmentRequest
    initial_state: "academic_status=SUBMITTED, financial_status=UNBILLED"
    terminal_states: ["academic_status IN {REJECTED, CANCELED, SETTLED}"]
    transitions:
      # ---- academic axis ----
      - from: "academic_status=SUBMITTED"
        to: "academic_status=APPROVED"
        trigger: "system (automatic at request creation when seat available AND all priority 1-9 validations pass)"
        actor: system
        preconditions:
          - "CourseOffering.enrolled_count < CourseOffering.capacity (ERR_OFFERING_FULL would WAITLIST instead, not error)"
        side_effects:
          - "provisional_credit_charge = Course.credits"
          - "Student's provisional credit usage increments by Course.credits (input to dynamic_credit_quota provisional variant)"
          - "financial_status → BILLED"
          - "SyncEvent emitted: ENROLLMENT_APPROVED to {ACADEMIC_AFFAIRS, FINANCE, LIBRARY, DORMITORY}"
          - "SyncEvent emitted: TUITION_BILLED to {FINANCE}"
      - from: "academic_status=SUBMITTED"
        to: "academic_status=WAITLISTED"
        trigger: "system (automatic at request creation when CourseOffering.enrolled_count >= CourseOffering.capacity)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute priority_score per calculations.priority_score"
          - "Create WaitlistEntry (status=ACTIVE, position assigned per ordering rule)"
      - from: "academic_status=SUBMITTED"
        to: "academic_status=REJECTED"
        trigger: "system (automatic at request creation when any priority 4-9 validation fails)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "academic_status=APPROVED"
        to: "academic_status=CANCELED"
        trigger: POST /enrollment-requests/{requestId}/cancel
        actor: Student
        preconditions:
          - "Term.status IN {REGISTRATION_OPEN, REGISTRATION_CLOSED} and clock < classes_start_at (ERR_TERM_LOCKED_FOR_CANCEL)"
          - "X-User-ID equals EnrollmentRequest.student_id (ERR_NOT_OWNER)"
        side_effects:
          - "CourseOffering.enrolled_count decremented"
          - "Student's provisional credit usage decremented by Course.credits"
          - "Trigger waitlist_promotion sweep on this offering: top WaitlistEntry by (priority_score DESC, queued_at ASC) → status=PROMOTED, EnrollmentRequest.academic_status → APPROVED, financial_status → BILLED, side_effects per APPROVED transition. SyncEvent emitted: WAITLIST_PROMOTED."
          - "SyncEvent emitted: ENROLLMENT_CANCELED to {ACADEMIC_AFFAIRS, FINANCE, LIBRARY, DORMITORY}"
      - from: "academic_status=WAITLISTED"
        to: "academic_status=CANCELED"
        trigger: POST /enrollment-requests/{requestId}/cancel
        actor: Student
        preconditions:
          - "X-User-ID equals EnrollmentRequest.student_id (ERR_NOT_OWNER)"
        side_effects:
          - "WaitlistEntry.status → CANCELED"
      - from: "academic_status=WAITLISTED"
        to: "academic_status=APPROVED"
        trigger: "system (automatic via waitlist promotion sweep — see CANCELED transition above OR /_sweep/run)"
        actor: system
        preconditions:
          - "WaitlistEntry is at the top of its offering's queue and seat is available"
          - "Re-validate priority 4-9 (state, time conflict, equipment conflict, instructor conflict, credit quota) — if any fails, WaitlistEntry → EXPIRED with reason VALIDATION_FAILED_AT_PROMOTION; next entry tried"
        side_effects:
          - "Same as the SUBMITTED→APPROVED side_effects (financial_status → BILLED; SyncEvents)"
      - from: "academic_status=APPROVED"
        to: "academic_status=SETTLED"
        trigger: "system (automatic on Term CONCLUDED transition when financial_status=PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "final_credit_charge populated per dynamic_credit_quota.variant_final"
      # ---- financial axis ----
      - from: "financial_status=BILLED"
        to: "financial_status=PAID"
        trigger: POST /enrollment-requests/{requestId}/settle-tuition
        actor: Finance
        preconditions:
          - "academic_status IN {APPROVED}, NOT IN {CANCELED, REJECTED, SETTLED} (ERR_INVALID_STATE_FOR_SETTLE)"
        side_effects:
          - "SyncEvent emitted: TUITION_PAID to {FINANCE, LIBRARY, DORMITORY}"
      - from: "financial_status=BILLED"
        to: "financial_status=UNBILLED"
        trigger: "system (automatic on academic_status APPROVED → CANCELED transition)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------- OverLimitApplication (branching with revision cycle — non-linear) ----------------
  - entity: OverLimitApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: AWAITING_PRIMARY
        trigger: POST /over-limit-applications/{applicationId}/submit
        actor: Student
        preconditions:
          - "X-User-ID equals OverLimitApplication.student_id (ERR_NOT_OWNER)"
          - "Term.status = REGISTRATION_OPEN (ERR_TERM_NOT_OPEN_FOR_REGISTRATION)"
        side_effects:
          - "timeout_deadline_at = now + APPROVAL_TIMEOUT_SECONDS"
      - from: AWAITING_PRIMARY
        to: AWAITING_SECONDARY
        trigger: POST /over-limit-applications/{applicationId}/sign
        actor: Professor
        preconditions:
          - "X-User-ID equals OverLimitApplication.primary_signer_id (ERR_NOT_DESIGNATED_SIGNER)"
        side_effects:
          - "timeout_deadline_at = now + APPROVAL_TIMEOUT_SECONDS"
      - from: AWAITING_PRIMARY
        to: AWAITING_SECONDARY
        trigger: "system (automatic when clock >= timeout_deadline_at — escalation, primary auto-skipped)"
        actor: system
        preconditions: []
        side_effects:
          - "timeout_deadline_at = now + APPROVAL_TIMEOUT_SECONDS"
      - from: AWAITING_SECONDARY
        to: APPROVED
        trigger: POST /over-limit-applications/{applicationId}/sign
        actor: Professor
        preconditions:
          - "X-User-ID equals OverLimitApplication.secondary_signer_id (ERR_NOT_DESIGNATED_SIGNER)"
        side_effects:
          - "granted_credits = requested_extension_credits"
          - "Re-evaluate all SUBMITTED EnrollmentRequest of this student in this term that previously failed ERR_CREDIT_QUOTA_EXCEEDED: take them out of REJECTED is NOT permitted (terminal); rather, future submissions inherit the new quota"
          - "SyncEvent emitted: OVER_LIMIT_GRANTED to {ACADEMIC_AFFAIRS, FINANCE}"
      - from: AWAITING_PRIMARY
        to: REJECTED
        trigger: POST /over-limit-applications/{applicationId}/reject
        actor: Professor
        preconditions:
          - "X-User-ID equals OverLimitApplication.primary_signer_id (ERR_NOT_DESIGNATED_SIGNER)"
        side_effects: []
      - from: AWAITING_SECONDARY
        to: REJECTED
        trigger: POST /over-limit-applications/{applicationId}/reject
        actor: Professor
        preconditions:
          - "X-User-ID equals OverLimitApplication.secondary_signer_id (ERR_NOT_DESIGNATED_SIGNER)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: POST /over-limit-applications/{applicationId}/revise
        actor: Student
        preconditions:
          - "X-User-ID equals OverLimitApplication.student_id (ERR_NOT_OWNER)"
          - "Term.status = REGISTRATION_OPEN (ERR_TERM_NOT_OPEN_FOR_REGISTRATION)"
        side_effects:
          - "Cycle: application returns to DRAFT and may be re-submitted with revised justification or extension request; previous granted_credits remains 0"
      - from: AWAITING_SECONDARY
        to: EXPIRED
        trigger: "system (automatic when clock >= timeout_deadline_at)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------- WaitlistEntry ----------------
  - entity: WaitlistEntry
    initial_state: ACTIVE
    terminal_states: [PROMOTED, EXPIRED, CANCELED]
    transitions:
      - from: ACTIVE
        to: PROMOTED
        trigger: "system (automatic — see EnrollmentRequest WAITLISTED→APPROVED via cancel cascade or /_sweep/run)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (CourseOffering.status → CLOSED OR Term.status → REGISTRATION_CLOSED OR validation re-check fails at promotion time)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELED
        trigger: "system (EnrollmentRequest WAITLISTED → CANCELED transition)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two students submit the last seat of a CourseOffering simultaneously"
    guarantee: "Exactly one wins APPROVED; the other is WAITLISTED with priority_score computed against the post-decision capacity. No error is returned to the loser — WAITLISTED is a normal outcome of POST /enrollment-requests."
    error_id: ERR_OFFERING_FULL_RACE_LOSER_WAITLISTED
    http_status: 200
    serialization: "First-writer-wins on offering.enrolled_count compare-and-set; this rule yields no client-visible error, but is enumerated for observability and downstream tests"

  - scenario: "Student cancels APPROVED enrollment while waitlist promotion sweep promotes top WaitlistEntry on the same offering"
    guarantee: "Cancel completes; promotion sees post-cancel state and either succeeds or, if seat is no longer available, top WaitlistEntry remains ACTIVE"
    error_id: ERR_PROMOTION_RACE_LOST
    http_status: 409
    serialization: "First-writer-wins on offering.enrolled_count; promotion attempt that loses is silent (no client return), but a duplicate promotion attempt against the same WaitlistEntry returns this error"

  - scenario: "Two professors simultaneously sign and reject the same OverLimitApplication"
    guarantee: "First write wins on OverLimitApplication.status; the loser receives ERR_INVALID_STATE because the application has already left AWAITING_*"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on OverLimitApplication.status"

  - scenario: "Two Registrar requests update the same OverLimitApplication or CourseOffering with stale version"
    guarantee: "First write wins; second receives ERR_VERSION_CONFLICT"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency: client supplies version in body; server rejects if version != server's version"

  - scenario: "Capacity reduction cascade on CourseOffering races with new EnrollmentRequest submission against the same offering"
    guarantee: "Cascade completes first; new submission sees post-cascade state. If the cascade demoted the lowest-priority APPROVED enrollment to make room, the racing submission is evaluated against the new capacity."
    error_id: ERR_CAPACITY_CASCADE_RACE_RETRY
    http_status: 409
    serialization: "First-writer-wins on offering.capacity"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_score
    trigger: "EnrollmentRequest academic_status SUBMITTED → WAITLISTED transition; recomputed at every WaitlistEntry creation"
    algorithm: weighted_scoring
    formula: |
      year_factor = min(student.year_in_program, 5)                       # capped at 5
      gap_count = degree_plan_gap_analysis(student).gap_count_for(course) # 1 if course satisfies an unmet required course, else 0
      prereq_strength = number of distinct Course rows that list course.id in their prerequisite_course_ids[].course_id (downstream count)
      fraud_penalty = max(0, student.fraud_score - FRAUD_GRACE)
      priority_score = (W_YEAR * year_factor) + (W_GAP * gap_count) + (W_PREREQ * prereq_strength) - (W_FRAUD * fraud_penalty)
    input_set: "Inputs are fixed at WAITLISTED transition time; subsequent changes to student.fraud_score or course.prerequisite_course_ids do NOT retroactively update existing WaitlistEntry.priority_score."
    constants:
      W_YEAR: 10
      W_GAP: 15
      W_PREREQ: 8
      W_FRAUD: 2
      FRAUD_GRACE: 10
    precision: "integer (truncate toward zero after summation)"

  - name: degree_plan_gap_analysis
    trigger: "GET /students/{studentId}/degree-plan; recomputed on EnrollmentRequest academic_status → APPROVED, → CANCELED, → SETTLED, → REJECTED, and on Student.completed_course_ids update"
    algorithm: aggregation
    formula: |
      required_course_ids = the set of Course.id strings declared in the student's program degree-plan (program identified by student.program_id; the program-to-required-courses mapping is provided as Course.owning_department_id == student.program_department_id AND a flag is_program_core which is NOT modeled in this scaffold — INSTEAD: the degree plan is the set of all Course.id where course.owning_department_id == student.program_department_id; the gap analysis treats every department-owned course as required for the gap calculation)
      completed_credits = sum(Course.credits for course_id in student.completed_course_ids)
      in_progress_credits = sum(Course.credits for er in EnrollmentRequest where er.student_id = student.id AND er.academic_status IN {APPROVED, WAITLISTED, SETTLED})
      gap_courses = required_course_ids - student.completed_course_ids - {er.offering.course_id for er where er.academic_status IN {APPROVED, SETTLED}}
      gap_count = len(gap_courses)
      total_required_credits = sum(Course.credits for course_id in required_course_ids)
      remaining_credits = total_required_credits - completed_credits - in_progress_credits
    input_set: "Excludes WAITLISTED enrollments from gap_courses (a waitlisted seat is not yet held); INCLUDES WAITLISTED in in_progress_credits as a ceiling estimate."
    precision: "credits to 2 decimal places, round_half_up"

  - name: dynamic_credit_quota
    trigger: "EnrollmentRequest academic_status SUBMITTED transition (provisional variant); Term CONCLUDED (final variant)"
    algorithm: tiered_threshold
    formula: |
      base_quota = TIER[student.year_in_program] where TIER = {1:18, 2:20, 3:22, 4:24, 5:24, 6:24}
      Step 1 (PINNED ORDER): identify any APPROVED OverLimitApplication for (student_id, term_id). If multiple APPROVED applications exist, sum granted_credits.
      Step 2: extension = sum(granted_credits over APPROVED applications) for variant_final; for variant_provisional, treat AWAITING_PRIMARY and AWAITING_SECONDARY applications as zero extension (only APPROVED counts).
      Step 3: effective_quota = base_quota + extension
      Step 4: current_load = sum(Course.credits for er in EnrollmentRequest where er.student_id = s.id AND er.term_id = t.id AND er.academic_status IN {APPROVED, WAITLISTED}) for variant_provisional. For variant_final, current_load uses academic_status IN {APPROVED, SETTLED}.
      Validation gate: a new EnrollmentRequest whose Course.credits would push current_load + Course.credits > effective_quota fails ERR_CREDIT_QUOTA_EXCEEDED.
      Note: WAITLISTED enrollments DO consume provisional quota; they release it only on CANCELED/EXPIRED/REJECTED.
    constants:
      TIER_Y1: 18
      TIER_Y2: 20
      TIER_Y3: 22
      TIER_Y4_PLUS: 24
    precision: "credits to 2 decimal places, round_half_up"
    variants:
      - name: variant_provisional
        when: "Used during enrollment validation (POST /enrollment-requests)"
        difference: "extension counts ONLY APPROVED OverLimitApplication; current_load includes WAITLISTED"
      - name: variant_final
        when: "Used at Term CONCLUDED to populate EnrollmentRequest.final_credit_charge"
        difference: "extension still counts only APPROVED applications, but current_load uses {APPROVED, SETTLED} (excluding WAITLISTED, which by term-close are EXPIRED)"

  - name: transferable_credits
    trigger: "Cross-program enrollment evaluation: when student.program_id differs from CourseOffering.course.owning_department_id's program; computed at GET /students/{studentId}/degree-plan and on EnrollmentRequest validation"
    algorithm: tiered_pricing
    formula: |
      For each Course c in student.completed_course_ids that has a CreditEquivalencePolicy where policy.source_program_id == c.owning_department_id AND policy.target_program_id == student.program_id AND policy.source_course_id == c.id:
        raw_value = c.credits * policy.transfer_factor
        # PINNED ORDER (mode b): per-course rounding first, THEN sum.
        per_course_value = round(raw_value, 2, round_half_up)
      transferable_credits = sum(per_course_value for all matched courses)
      # The other valid order — sum(raw_value) then round — would yield a different total in cents.
      # Pinned to per-course rounding first to make the result deterministic and order-insensitive across course iteration order.
    constants:
      ROUND_DIGITS: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: variant_estimated
        when: "Computed at student-facing GET /degree-plan and at EnrollmentRequest submission preview"
        difference: "Uses CURRENT CreditEquivalencePolicy values; result may change if policies are later updated"
      - name: variant_approved
        when: "Computed and frozen at Term CONCLUDED transition (per-student snapshot, stored on degree-plan history — not in this scaffold's API surface, but the calculation is pinned)"
        difference: "Uses CreditEquivalencePolicy values as of Term.exam_window_end_at; later policy edits do NOT retroactively change approved transfer credits"

  - name: conflict_detection
    trigger: "EnrollmentRequest validation (priority 6, 7, 8 — see §1.4); CourseOffering.scheduled_meetings change is NOT permitted post-OPEN, so this calculation runs only at submission time"
    algorithm: interval_merge
    formula: |
      For the proposed EnrollmentRequest (student S, offering O_new):
        existing_offerings = {er.offering for er in S's EnrollmentRequest where er.term_id = O_new.term_id AND er.academic_status IN {APPROVED, WAITLISTED}}
        # 1. TIME conflict (interval semantics: half-open [start, end))
        For each O_existing in existing_offerings:
          For each meeting m_new in O_new.scheduled_meetings AND each m_existing in O_existing.scheduled_meetings where m_new.day_of_week == m_existing.day_of_week:
            if m_new.start_minute_of_day < m_existing.end_minute_of_day AND m_existing.start_minute_of_day < m_new.end_minute_of_day:
              raise ERR_TIME_CONFLICT
        # 2. COMMUTE conflict (interval semantics: closed [start, end] ON BOTH ENDS plus a buffer derived from Campus.commute_minutes_to)
        For each m_new and m_existing where m_new.day_of_week == m_existing.day_of_week AND O_new.campus_id != O_existing.campus_id:
          buffer = Campus[O_existing.campus_id].commute_minutes_to[O_new.campus_id]   # may be 0
          # Adjacency check: meetings must have a clear gap of at least `buffer` minutes between them
          gap = max(m_new.start_minute_of_day - m_existing.end_minute_of_day, m_existing.start_minute_of_day - m_new.end_minute_of_day)
          if gap < buffer AND meetings DO NOT overlap (the time-overlap case above already handles overlaps):
            raise ERR_COMMUTE_INFEASIBLE
        # 3. EXAM WEEK conflict (interval semantics: closed [start, end] using Term.exam_window dates)
        # An offering's exam time is its first scheduled_meeting on the exam week's day. If two offerings claim the same exam slot:
        For each O_existing where Term[O_new.term_id].exam_window_start_at != null:
          if (O_new.exam_slot.day, O_new.exam_slot.start, O_new.exam_slot.end) overlaps (closed [start, end]) the existing offering's exam slot in the same term:
            raise ERR_EXAM_TIME_CONFLICT
        # 4. LAB EQUIPMENT conflict (interval semantics: half-open [start, end) with PER-EQUIPMENT setup_buffer_minutes)
        For each lab_id in O_new.requires_lab_equipment_ids:
          For each O_existing in {all OPEN+IN_SESSION offerings with lab_id in requires_lab_equipment_ids in the same term, regardless of student}:
            buffer = LabEquipment[lab_id].setup_buffer_minutes
            For each m_new and m_existing where same day_of_week:
              if m_new.start_minute_of_day < m_existing.end_minute_of_day + buffer AND m_existing.start_minute_of_day < m_new.end_minute_of_day + buffer:
                raise ERR_LAB_EQUIPMENT_CONFLICT
        # 5. INSTRUCTOR teaching-load conflict (interval semantics: aggregate-cap, NOT pairwise overlap)
        # Sum scheduled minutes per week of OPEN+IN_SESSION offerings led by O_new.instructor_id (this offering excluded if not yet OPEN):
        weekly_minutes = sum((m.end_minute_of_day - m.start_minute_of_day) for offering in {OPEN+IN_SESSION offerings of O_new.instructor_id} for m in offering.scheduled_meetings)
        # NOTE: this is checked at CourseOffering.PLANNED → OPEN transition, NOT at student enrollment submission
        if weekly_minutes + O_new.scheduled_meetings_total > Professor.max_concurrent_teaching_minutes_per_week:
          raise ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED
    input_set: "Time/Commute/Exam: scoped to single student's APPROVED+WAITLISTED enrollments. Lab equipment: scoped to ALL APPROVED offerings of the term using that equipment (cross-student). Instructor: scoped to a single instructor across all their offerings (cross-student, cross-course)."
    constants: {}
    precision: "minutes (integer)"

  - name: fraud_score
    trigger: "EnrollmentRequest submission (anti-fraud signal aggregation)"
    algorithm: aggregation
    formula: |
      On every EnrollmentRequest submission by student S:
        # Signal 1: more than RAPID_SUBMIT_LIMIT submissions in the last RAPID_SUBMIT_WINDOW_SECONDS
        recent_count = count(EnrollmentRequest where student_id = S AND created_at >= now - RAPID_SUBMIT_WINDOW_SECONDS)
        if recent_count > RAPID_SUBMIT_LIMIT:
          S.fraud_score += RAPID_SUBMIT_PENALTY
        # Signal 2: submission to an offering whose course is in a department NOT permitted by any DepartmentAccessGrant where source = S.program_department_id (and S is not in the offering's owning department)
        if Course.owning_department_id != S.program_department_id AND no ACTIVE DepartmentAccessGrant covers (S.program_department_id, Course.owning_department_id):
          S.fraud_score += UNAUTHORIZED_DEPT_PENALTY
        # Boundary: fraud_score is unbounded above; no decay in this scaffold version.
    constants:
      RAPID_SUBMIT_WINDOW_SECONDS: 60
      RAPID_SUBMIT_LIMIT: 10
      RAPID_SUBMIT_PENALTY: 5
      UNAUTHORIZED_DEPT_PENALTY: 8
    precision: "integer"

  - name: scheduling_recommendation
    trigger: "GET /students/{studentId}/recommendations"
    algorithm: weighted_scoring
    formula: |
      candidate_offerings = {O for O in CourseOffering where O.term_id = next_open_term AND O.status = OPEN AND O.course_id in degree_plan_gap_analysis(student).gap_courses}
      For each candidate O:
        rec_score = (REC_W_GAP * 1) + (REC_W_PREREQ_UNLOCK * downstream_unlock_count(O.course_id, student.completed_course_ids)) - (REC_W_TIME_CONFLICT * time_conflict_count_with(student's other APPROVED enrollments in this term, O))
      Return top REC_TOP_K candidate_offerings ordered by rec_score DESC, then offering.id ASC for tie-break.
    constants:
      REC_W_GAP: 100
      REC_W_PREREQ_UNLOCK: 30
      REC_W_TIME_CONFLICT: 50
      REC_TOP_K: 5
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers must be present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints except GET /healthz" }
  - { priority: 2, category: auth, check: "X-User-Role must be authorized for the endpoint per RBAC matrix §1.7", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path resource ids must exist; validated left-to-right", error_id: "ERR_*_NOT_FOUND (one per resource type, e.g., ERR_STUDENT_NOT_FOUND, ERR_OFFERING_NOT_FOUND)", http_status: 404, applies_to: "all nested resource endpoints" }
  - { priority: 4, category: state, check: "Target resource must be in the correct lifecycle state (Term, CourseOffering, OverLimitApplication, EnrollmentRequest)", error_id: "ERR_INVALID_STATE", http_status: 409, applies_to: "all state-transition endpoints; specific subtypes ERR_TERM_NOT_OPEN_FOR_REGISTRATION, ERR_OFFERING_NOT_OPEN, ERR_TERM_LOCKED_FOR_CANCEL etc." }
  - { priority: 5, category: business_referential, check: "Cross-entity reference integrity: e.g., EnrollmentRequest's offering must belong to a term the student is registered for, OverLimitApplication's signers must belong to the student's home department, primary_signer must NOT be is_chair, secondary_signer MUST be is_chair", error_id: "ERR_REFERENTIAL_INTEGRITY (subtypes: ERR_SIGNER_NOT_IN_HOME_DEPARTMENT, ERR_PRIMARY_SIGNER_IS_CHAIR, ERR_SECONDARY_SIGNER_NOT_CHAIR)", http_status: 422, applies_to: "POST /enrollment-requests, POST /over-limit-applications" }
  - { priority: 6, category: business_safety, check: "Cross-department access: if Course.owning_department_id != Student.program_department_id, an ACTIVE DepartmentAccessGrant covering (S.program_department_id → C.owning_department_id) must exist with the course's category in course_categories_allowed (or its bidirectional symmetric grant)", error_id: ERR_CROSS_DEPARTMENT_ACCESS_DENIED, http_status: 403, applies_to: "POST /enrollment-requests" }
  - { priority: 7, category: business_constraint, check: "Prerequisite satisfaction: every REQUIRED prereq in Course.prerequisite_course_ids must appear in Student.completed_course_ids OR an equivalent (per Course.equivalent_course_ids) must appear", error_id: ERR_PREREQUISITE_NOT_MET, http_status: 422, applies_to: "POST /enrollment-requests" }
  - { priority: 8, category: business_temporal, check: "Time conflict (half-open intervals)", error_id: ERR_TIME_CONFLICT, http_status: 409, applies_to: "POST /enrollment-requests" }
  - { priority: 9, category: business_temporal, check: "Commute infeasibility (closed intervals + per-campus commute buffer)", error_id: ERR_COMMUTE_INFEASIBLE, http_status: 409, applies_to: "POST /enrollment-requests" }
  - { priority: 10, category: business_temporal, check: "Exam week time conflict (closed intervals)", error_id: ERR_EXAM_TIME_CONFLICT, http_status: 409, applies_to: "POST /enrollment-requests" }
  - { priority: 11, category: business_constraint, check: "Lab equipment conflict (half-open intervals + per-equipment setup buffer, cross-student)", error_id: ERR_LAB_EQUIPMENT_CONFLICT, http_status: 409, applies_to: "POST /enrollment-requests" }
  - { priority: 12, category: business_fiscal, check: "Credit quota: provisional current_load + Course.credits must not exceed effective_quota (variant_provisional)", error_id: ERR_CREDIT_QUOTA_EXCEEDED, http_status: 402, applies_to: "POST /enrollment-requests" }
  - { priority: 13, category: business_safety, check: "Anti-fraud rate limit: more than RAPID_SUBMIT_LIMIT submissions by same student in RAPID_SUBMIT_WINDOW_SECONDS triggers rejection of the over-limit submission", error_id: ERR_RATE_LIMITED, http_status: 429, applies_to: "POST /enrollment-requests, POST /over-limit-applications" }
  - { priority: 14, category: business_constraint, check: "Instructor teaching load on PLANNED→OPEN: weekly_minutes + new offering minutes must not exceed Professor.max_concurrent_teaching_minutes_per_week", error_id: ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED, http_status: 409, applies_to: "POST /course-offerings/{id}/open" }
  - { priority: 15, category: business_constraint, check: "Pagination limits: limit between 1 and 100, offset >= 0", error_id: ERR_INVALID_PAGINATION_PARAMETERS, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 16, category: business_constraint, check: "Optimistic concurrency: client-supplied version (when present in body) must match server's current version", error_id: ERR_VERSION_CONFLICT, http_status: 409, applies_to: "all PATCH and PUT endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------- Students ----------------
  - { method: POST, path: "/students", description: "Create a Student", roles: [Registrar], code: 201, input: [full_name, program_id, program_department_id, home_campus_id, year_in_program, gpa, completed_course_ids], output: Student, side_effects: ["status = ENROLLED", "fraud_score = 0"] }
  - { method: GET,  path: "/students", description: "List Students", roles: [Registrar], code: 200, input: ["limit?", "offset?"], output: "Student[]", side_effects: [] }
  - { method: GET,  path: "/students/{studentId}", description: "Get a Student", roles: [Registrar, Student], code: 200, input: [], output: Student, side_effects: ["X-User-ID must equal {studentId} when role = Student (ERR_NOT_OWNER)"] }
  - { method: GET,  path: "/students/{studentId}/degree-plan", description: "Compute and return degree-plan gap analysis (gap_courses, completed_credits, remaining_credits, transferable_credits.variant_estimated)", roles: [Registrar, Student], code: 200, input: [], output: "object", side_effects: ["Triggers degree_plan_gap_analysis and transferable_credits.variant_estimated"] }
  - { method: GET,  path: "/students/{studentId}/recommendations", description: "Return top REC_TOP_K recommended CourseOfferings per scheduling_recommendation", roles: [Registrar, Student], code: 200, input: [], output: "CourseOffering[]", side_effects: ["Triggers scheduling_recommendation"] }
  - { method: GET,  path: "/students/{studentId}/sync-events", description: "Return SyncEvent log for this student (any subject_entity ultimately tied to student_id)", roles: [Registrar, Student], code: 200, input: ["limit?", "offset?"], output: "SyncEvent[]", side_effects: [] }

  # ---------------- Departments / Campuses / Professors / Lab Equipment ----------------
  - { method: POST, path: "/departments", description: "Create a Department", roles: [Registrar], code: 201, input: [code, name, campus_id], output: Department, side_effects: ["status = ACTIVE"] }
  - { method: GET,  path: "/departments/{departmentId}", description: "Get a Department", roles: [Registrar, Student, Professor], code: 200, input: [], output: Department, side_effects: [] }
  - { method: POST, path: "/campuses", description: "Create a Campus", roles: [Registrar], code: 201, input: [code, name, commute_minutes_to], output: Campus, side_effects: [] }
  - { method: POST, path: "/professors", description: "Create a Professor", roles: [Registrar], code: 201, input: [department_id, full_name, rank, is_chair, max_concurrent_teaching_minutes_per_week], output: Professor, side_effects: [] }
  - { method: POST, path: "/lab-equipment", description: "Create a LabEquipment record", roles: [Registrar], code: 201, input: [campus_id, name, setup_buffer_minutes], output: LabEquipment, side_effects: [] }

  # ---------------- Terms ----------------
  - { method: POST, path: "/terms", description: "Create a Term in PLANNING", roles: [Registrar], code: 201, input: [code, registration_open_at, registration_close_at, classes_start_at, exam_window_start_at, exam_window_end_at], output: Term, side_effects: ["status = PLANNING"] }
  - { method: GET,  path: "/terms/{termId}", description: "Get a Term", roles: [Registrar, Student, Professor], code: 200, input: [], output: Term, side_effects: [] }
  - { method: POST, path: "/terms/{termId}/conclude", description: "Manually conclude a Term once exam_window_end_at has passed", roles: [Registrar], code: 200, input: [], output: Term, side_effects: ["status → CONCLUDED", "EnrollmentRequest finalization side-effects per state machine"] }

  # ---------------- Courses ----------------
  - { method: POST, path: "/courses", description: "Create a Course catalog entry", roles: [Registrar], code: 201, input: [code, title, credits, owning_department_id, prerequisite_course_ids, equivalent_course_ids], output: Course, side_effects: [] }
  - { method: GET,  path: "/courses/{courseId}", description: "Get a Course", roles: [Registrar, Student, Professor], code: 200, input: [], output: Course, side_effects: [] }

  # ---------------- Course Offerings ----------------
  - { method: POST, path: "/course-offerings", description: "Create a CourseOffering in PLANNED", roles: [Registrar], code: 201, input: [term_id, course_id, campus_id, instructor_id, base_capacity, scheduled_meetings, requires_lab_equipment_ids], output: CourseOffering, side_effects: ["status = PLANNED", "capacity = base_capacity", "enrolled_count = 0"] }
  - { method: GET,  path: "/course-offerings", description: "List CourseOfferings (filter by term_id, course_id, campus_id, instructor_id, status)", roles: [Registrar, Student, Professor], code: 200, input: ["term_id?", "course_id?", "campus_id?", "instructor_id?", "status?", "limit?", "offset?"], output: "CourseOffering[]", side_effects: [] }
  - { method: GET,  path: "/course-offerings/{offeringId}", description: "Get a CourseOffering", roles: [Registrar, Student, Professor], code: 200, input: [], output: CourseOffering, side_effects: [] }
  - { method: POST, path: "/course-offerings/{offeringId}/open", description: "Transition PLANNED → OPEN", roles: [Registrar], code: 200, input: [], output: CourseOffering, side_effects: ["Validate instructor teaching load (ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED)", "status → OPEN"] }
  - { method: POST, path: "/course-offerings/{offeringId}/close", description: "Transition OPEN → CLOSED", roles: [Registrar], code: 200, input: [], output: CourseOffering, side_effects: ["status → CLOSED", "All ACTIVE WaitlistEntry → EXPIRED", "All SUBMITTED EnrollmentRequest → REJECTED"] }
  - { method: PATCH, path: "/course-offerings/{offeringId}/capacity", description: "Elastic capacity scaling", roles: [Registrar], code: 200, input: [new_capacity, version], output: CourseOffering, side_effects: ["If new_capacity > capacity: capacity = new_capacity; trigger waitlist promotion sweep on this offering up to (new_capacity - enrolled_count) promotions, ordered by (priority_score DESC, queued_at ASC). Each promotion is a transitive cascade: WaitlistEntry → PROMOTED, EnrollmentRequest WAITLISTED → APPROVED, financial_status → BILLED, SyncEvent emitted.", "If new_capacity < capacity AND new_capacity < enrolled_count: cancel (enrolled_count - new_capacity) lowest-priority APPROVED EnrollmentRequest (ordered by priority_score ASC, then created_at DESC). Each canceled request: academic_status → REJECTED with reason CAPACITY_REDUCED, financial_status → UNBILLED if it was BILLED, SyncEvent CAPACITY_REDUCED_CANCELED emitted to {ACADEMIC_AFFAIRS, FINANCE, LIBRARY, DORMITORY}.", "If new_capacity < capacity AND new_capacity >= enrolled_count: capacity reduced; no cancellations.", "version conflict → ERR_VERSION_CONFLICT"] }
  - { method: GET,  path: "/course-offerings/{offeringId}/waitlist", description: "List WaitlistEntry rows for an offering, ordered by position", roles: [Registrar, Student, Professor], code: 200, input: ["limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }

  # ---------------- Enrollment Requests ----------------
  - { method: POST, path: "/enrollment-requests", description: "Submit an enrollment request", roles: [Student], code: 201, input: [student_id, offering_id], output: EnrollmentRequest, side_effects: ["X-User-ID must equal student_id (ERR_NOT_OWNER)", "Run validations priority 4–13", "Determine APPROVED vs WAITLISTED vs REJECTED per state machine", "Update fraud_score per calculations.fraud_score", "Compute priority_score if WAITLISTED"] }
  - { method: GET,  path: "/enrollment-requests/{requestId}", description: "Get an EnrollmentRequest", roles: [Registrar, Student], code: 200, input: [], output: EnrollmentRequest, side_effects: ["X-User-ID must equal student_id when role = Student (ERR_NOT_OWNER)"] }
  - { method: GET,  path: "/enrollment-requests", description: "List EnrollmentRequests (filter by student_id, term_id, offering_id, academic_status, financial_status)", roles: [Registrar, Student], code: 200, input: ["student_id?", "term_id?", "offering_id?", "academic_status?", "financial_status?", "limit?", "offset?"], output: "EnrollmentRequest[]", side_effects: ["When role = Student, student_id filter must equal X-User-ID"] }
  - { method: POST, path: "/enrollment-requests/{requestId}/cancel", description: "Cancel an APPROVED or WAITLISTED EnrollmentRequest", roles: [Student], code: 200, input: [], output: EnrollmentRequest, side_effects: ["Run state-machine cancel transition", "Trigger waitlist promotion cascade if was APPROVED"] }
  - { method: POST, path: "/enrollment-requests/{requestId}/settle-tuition", description: "Mark BILLED → PAID (Finance/webhook)", roles: [Finance], code: 200, input: [], output: EnrollmentRequest, side_effects: ["financial_status → PAID", "SyncEvent TUITION_PAID emitted"] }

  # ---------------- Over-Limit Applications ----------------
  - { method: POST, path: "/over-limit-applications", description: "Create an OverLimitApplication in DRAFT", roles: [Student], code: 201, input: [student_id, term_id, requested_extension_credits, justification, primary_signer_id, secondary_signer_id], output: OverLimitApplication, side_effects: ["X-User-ID must equal student_id (ERR_NOT_OWNER)", "Validate primary_signer in home dept and NOT is_chair (ERR_PRIMARY_SIGNER_IS_CHAIR)", "Validate secondary_signer is is_chair of home dept (ERR_SECONDARY_SIGNER_NOT_CHAIR)"] }
  - { method: GET,  path: "/over-limit-applications/{applicationId}", description: "Get an OverLimitApplication", roles: [Registrar, Student, Professor], code: 200, input: [], output: OverLimitApplication, side_effects: [] }
  - { method: POST, path: "/over-limit-applications/{applicationId}/submit", description: "DRAFT → AWAITING_PRIMARY", roles: [Student], code: 200, input: [], output: OverLimitApplication, side_effects: ["timeout_deadline_at = now + APPROVAL_TIMEOUT_SECONDS"] }
  - { method: POST, path: "/over-limit-applications/{applicationId}/sign", description: "Countersign current step (AWAITING_PRIMARY → AWAITING_SECONDARY, or AWAITING_SECONDARY → APPROVED)", roles: [Professor], code: 200, input: [version], output: OverLimitApplication, side_effects: ["Validate X-User-ID equals current step's signer (ERR_NOT_DESIGNATED_SIGNER)", "Per state machine"] }
  - { method: POST, path: "/over-limit-applications/{applicationId}/reject", description: "Current signer rejects the application", roles: [Professor], code: 200, input: [version], output: OverLimitApplication, side_effects: ["status → REJECTED"] }
  - { method: POST, path: "/over-limit-applications/{applicationId}/revise", description: "REJECTED → DRAFT (cycle)", roles: [Student], code: 200, input: [], output: OverLimitApplication, side_effects: ["status → DRAFT"] }

  # ---------------- Department Access Grants ----------------
  - { method: POST, path: "/department-access-grants", description: "Create a DepartmentAccessGrant", roles: [Registrar], code: 201, input: [source_department_id, target_department_id, course_categories_allowed, bidirectional], output: DepartmentAccessGrant, side_effects: ["status = ACTIVE"] }
  - { method: GET,  path: "/department-access-grants", description: "List DepartmentAccessGrants", roles: [Registrar, Student], code: 200, input: ["source_department_id?", "target_department_id?", "status?", "limit?", "offset?"], output: "DepartmentAccessGrant[]", side_effects: [] }
  - { method: POST, path: "/department-access-grants/{grantId}/revoke", description: "Revoke a grant", roles: [Registrar], code: 200, input: [], output: DepartmentAccessGrant, side_effects: ["status → REVOKED"] }

  # ---------------- Credit Equivalence Policies ----------------
  - { method: POST, path: "/credit-equivalence-policies", description: "Create a CreditEquivalencePolicy", roles: [Registrar], code: 201, input: [source_program_id, target_program_id, source_course_id, target_course_id, transfer_factor], output: CreditEquivalencePolicy, side_effects: [] }
  - { method: GET,  path: "/credit-equivalence-policies", description: "List policies", roles: [Registrar, Student], code: 200, input: ["source_program_id?", "target_program_id?", "limit?", "offset?"], output: "CreditEquivalencePolicy[]", side_effects: [] }

  # ---------------- Test-driving endpoints (testability completeness) ----------------
  - { method: POST, path: "/_clock/advance", description: "Advance the system clock to a specific Unix timestamp; required for testing time-gated transitions (Term auto-transitions, OverLimitApplication timeout escalation)", roles: [Registrar], code: 200, input: [target_unix_seconds], output: "object", side_effects: ["clock advances; all auto-transitions whose preconditions become satisfied fire in canonical order: (1) Term PLANNING→REGISTRATION_OPEN, (2) Term REGISTRATION_OPEN→REGISTRATION_CLOSED with cascades, (3) OverLimitApplication AWAITING_PRIMARY→AWAITING_SECONDARY, (4) OverLimitApplication AWAITING_SECONDARY→EXPIRED, (5) Term REGISTRATION_CLOSED→IN_SESSION"] }
  - { method: POST, path: "/_sweep/run", description: "Run the periodic sweep: waitlist promotion across ALL OPEN offerings (in offering.id ASC order), and OverLimitApplication timeout-deadline checks (any AWAITING_* whose timeout_deadline_at <= now is escalated/expired)", roles: [Registrar], code: 200, input: [], output: "object", side_effects: ["Each OPEN CourseOffering: while enrolled_count < capacity AND ACTIVE WaitlistEntry exists, attempt promotion of top entry per ordering rule; on failed re-validation, that entry → EXPIRED and next is tried", "OverLimitApplication AWAITING_* whose timeout_deadline_at <= now: per state machine"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller's role is not authorized for the endpoint per RBAC" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Student is acting on a resource that does not belong to them (X-User-ID mismatch)" }
  - { id: ERR_NOT_DESIGNATED_SIGNER, http: 403, condition: "Professor attempting to sign an OverLimitApplication is not the designated primary or secondary signer for the current step" }

  # --- Resource Not Found ---
  - { id: ERR_STUDENT_NOT_FOUND,             http: 404, condition: "Student id does not exist" }
  - { id: ERR_PROFESSOR_NOT_FOUND,           http: 404, condition: "Professor id does not exist" }
  - { id: ERR_DEPARTMENT_NOT_FOUND,          http: 404, condition: "Department id does not exist" }
  - { id: ERR_CAMPUS_NOT_FOUND,              http: 404, condition: "Campus id does not exist" }
  - { id: ERR_TERM_NOT_FOUND,                http: 404, condition: "Term id does not exist" }
  - { id: ERR_COURSE_NOT_FOUND,              http: 404, condition: "Course id does not exist" }
  - { id: ERR_OFFERING_NOT_FOUND,            http: 404, condition: "CourseOffering id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND,             http: 404, condition: "EnrollmentRequest id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND,         http: 404, condition: "OverLimitApplication id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND,               http: 404, condition: "DepartmentAccessGrant id does not exist" }
  - { id: ERR_LAB_EQUIPMENT_NOT_FOUND,       http: 404, condition: "LabEquipment id does not exist" }

  # --- State ---
  - { id: ERR_INVALID_STATE,                  http: 409, condition: "Generic state-precondition failure (entity not in a valid state for the attempted transition)" }
  - { id: ERR_TERM_NOT_OPEN_FOR_REGISTRATION, http: 409, condition: "Operation requires Term.status = REGISTRATION_OPEN" }
  - { id: ERR_TERM_LOCKED_FOR_CANCEL,         http: 409, condition: "Cannot cancel after classes_start_at" }
  - { id: ERR_TERM_NOT_READY_FOR_CONCLUDE,    http: 409, condition: "Term cannot be concluded before exam_window_end_at" }
  - { id: ERR_OFFERING_NOT_OPEN,              http: 409, condition: "EnrollmentRequest submitted against a CourseOffering not in OPEN status" }
  - { id: ERR_INVALID_STATE_FOR_SETTLE,       http: 409, condition: "Cannot mark tuition PAID when academic_status NOT IN {APPROVED}" }

  # --- Referential Integrity ---
  - { id: ERR_REFERENTIAL_INTEGRITY,        http: 422, condition: "Generic referential mismatch (e.g., offering's course belongs to a different term)" }
  - { id: ERR_SIGNER_NOT_IN_HOME_DEPARTMENT, http: 422, condition: "Designated signer's department_id != student.program_department_id" }
  - { id: ERR_PRIMARY_SIGNER_IS_CHAIR,       http: 422, condition: "Primary signer of OverLimitApplication is is_chair of the home department (must be a non-chair professor)" }
  - { id: ERR_SECONDARY_SIGNER_NOT_CHAIR,    http: 422, condition: "Secondary signer is not is_chair of the home department" }

  # --- Business Constraints ---
  - { id: ERR_CROSS_DEPARTMENT_ACCESS_DENIED, http: 403, condition: "No ACTIVE DepartmentAccessGrant covers the (student's department → offering's owning department) pair with the course's category in course_categories_allowed" }
  - { id: ERR_PREREQUISITE_NOT_MET,           http: 422, condition: "One or more REQUIRED prerequisite courses are not in student.completed_course_ids and no equivalent is present" }
  - { id: ERR_TIME_CONFLICT,                  http: 409, condition: "Proposed offering's scheduled_meetings overlap (half-open intervals) with one of the student's existing APPROVED/WAITLISTED enrollments in the same term" }
  - { id: ERR_COMMUTE_INFEASIBLE,             http: 409, condition: "Adjacent same-day meetings on different campuses leave less than commute_minutes_to[other_campus] buffer" }
  - { id: ERR_EXAM_TIME_CONFLICT,             http: 409, condition: "Two offerings claim overlapping exam slots in the same term's exam window (closed intervals)" }
  - { id: ERR_LAB_EQUIPMENT_CONFLICT,         http: 409, condition: "Proposed offering's lab_equipment usage overlaps another offering's usage of the same equipment within setup_buffer_minutes (half-open intervals + buffer)" }
  - { id: ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED, http: 409, condition: "Adding this offering would push instructor's weekly minutes over max_concurrent_teaching_minutes_per_week" }
  - { id: ERR_CREDIT_QUOTA_EXCEEDED,          http: 402, condition: "Provisional current_load + Course.credits > effective_quota (variant_provisional)" }
  - { id: ERR_RATE_LIMITED,                   http: 429, condition: "More than RAPID_SUBMIT_LIMIT submissions by same student in RAPID_SUBMIT_WINDOW_SECONDS" }

  # --- Concurrency ---
  - { id: ERR_VERSION_CONFLICT,                       http: 409, condition: "Client-supplied version does not match server's current version" }
  - { id: ERR_OFFERING_FULL_RACE_LOSER_WAITLISTED,    http: 200, condition: "Race-loser of seat allocation is silently WAITLISTED; this id is reserved for observability/test-cross-check, never returned in the error envelope" }
  - { id: ERR_PROMOTION_RACE_LOST,                    http: 409, condition: "Duplicate promotion attempt against an already-PROMOTED WaitlistEntry" }
  - { id: ERR_CAPACITY_CASCADE_RACE_RETRY,            http: 409, condition: "Capacity cascade on offering raced with a competing capacity write; client should retry" }

  # --- Pagination ---
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "Pagination limit out of [1,100] or offset < 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Operational admin: creates Students, Departments, Campuses, Courses, Terms, CourseOfferings; manages capacity, lifecycle transitions, and access grants"
    identity: "opaque"
    exclusive_operations:
      - "POST /students"
      - "GET /students"
      - "POST /departments"
      - "POST /campuses"
      - "POST /professors"
      - "POST /lab-equipment"
      - "POST /terms"
      - "POST /terms/{termId}/conclude"
      - "POST /courses"
      - "POST /course-offerings"
      - "POST /course-offerings/{offeringId}/open"
      - "POST /course-offerings/{offeringId}/close"
      - "PATCH /course-offerings/{offeringId}/capacity"
      - "POST /department-access-grants"
      - "POST /department-access-grants/{grantId}/revoke"
      - "POST /credit-equivalence-policies"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Student
    description: "End user enrolling in courses; can submit enrollment requests, cancel own enrollments, file over-limit applications"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /enrollment-requests"
      - "POST /enrollment-requests/{requestId}/cancel"
      - "POST /over-limit-applications"
      - "POST /over-limit-applications/{applicationId}/submit"
      - "POST /over-limit-applications/{applicationId}/revise"
    shared_operations:
      - "GET /students/{studentId} (own only)"
      - "GET /students/{studentId}/degree-plan (own only)"
      - "GET /students/{studentId}/recommendations (own only)"
      - "GET /students/{studentId}/sync-events (own only)"
      - "GET /enrollment-requests (own only via student_id filter)"
      - "GET /enrollment-requests/{requestId} (own only)"
      - "GET /over-limit-applications/{applicationId}"
      - "GET (catalog reads: courses, course-offerings, terms, departments, department-access-grants, credit-equivalence-policies)"

  - name: Professor
    description: "Faculty member; signs / rejects OverLimitApplications when designated as primary or secondary signer"
    identity: "entity_backed:Professor"
    exclusive_operations:
      - "POST /over-limit-applications/{applicationId}/sign"
      - "POST /over-limit-applications/{applicationId}/reject"
    shared_operations:
      - "GET /over-limit-applications/{applicationId}"
      - "GET /course-offerings (and detail)"
      - "GET /courses (and detail)"
      - "GET /terms (and detail)"
      - "GET /departments (and detail)"

  - name: Finance
    description: "Finance system / operator; flips EnrollmentRequest.financial_status from BILLED to PAID"
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollment-requests/{requestId}/settle-tuition"
    shared_operations: []
