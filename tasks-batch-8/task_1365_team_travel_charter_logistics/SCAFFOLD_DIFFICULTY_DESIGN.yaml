              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "TOR", display_name: "Toronto", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
