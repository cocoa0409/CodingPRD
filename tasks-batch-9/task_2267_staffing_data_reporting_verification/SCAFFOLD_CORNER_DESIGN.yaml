scaffold_corner_design:
  - section: entities
    instances:
      - name: hour_entry_creation_returns_classification_fields_and_success_envelope
        claim_type: creation
        grounds:
          - entities.HourEntry
          - endpoints[POST /hour-entries]
        distinguishing_aspect: "POST /hour-entries with every required field returns 201 inside the success envelope with response_type object, and all computed classification fields are populated on the created row."
        test_recipe:
          setup:
            - "One TX facility, an OPEN 2026Q2 period, RN / RN_ADMIN / ADMIN job categories, and a DRAFT submission at version 1"
          setup_api_calls:
            - &k_fac
              call: "POST /facilities"
              payload: { ccn: "675001", name: "Cedar Grove Care Center", state_code: "TX", certified_bed_count: 120 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { fac: $.data.id }
            - &k_per
              call: "POST /reporting-periods"
              payload: { period_code: "2026Q2", state_code: "TX", start_date: "2026-04-01", end_date: "2026-04-30", submission_deadline: "2026-08-14T23:59:59Z", correction_window_end: "2026-12-31T23:59:59Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { per: $.data.id }
            - &k_jc_rn
              call: "POST /job-categories"
              payload: { code: "RN", cms_job_code: 5, direct_care_class: "DIRECT_CARE", nurse_group: "RN", direct_care_credit_pct: 1.00, weekend_countable: true }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_rn: $.data.id }
            - &k_jc_split
              call: "POST /job-categories"
              payload: { code: "RN_ADMIN", cms_job_code: 3, direct_care_class: "DIRECT_CARE_SPLIT", nurse_group: "RN", direct_care_credit_pct: 0.60, weekend_countable: true }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_split: $.data.id }
            - &k_jc_admin
              call: "POST /job-categories"
              payload: { code: "ADMIN", cms_job_code: 1, direct_care_class: "ADMINISTRATIVE", nurse_group: "NONE", direct_care_credit_pct: 0.00, weekend_countable: false }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_admin: $.data.id }
            - &k_w_coord
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Dana Coordinator", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_admin}", hire_date: "2026-01-01", authorized_roles: ["STAFFING_COORDINATOR"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_coord: $.data.id }
            - &k_w_admin
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Avery Administrator", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_admin}", hire_date: "2026-01-01", authorized_roles: ["FACILITY_ADMINISTRATOR"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_admin: $.data.id }
            - &k_w_rn
              call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Riley Nurse", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_rn}", hire_date: "2026-01-01", authorized_roles: [] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_rn: $.data.id }
            - &k_sub
              call: "POST /submissions"
              payload: { facility_id: "${fac}", reporting_period_id: "${per}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sub: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id }
          assert:
            - "response code is 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "HourEntry.${e1}.raw_hours == 8.00, direct_care_hours == 8.00, excluded_hours == 0.00, rn_hours == 8.00"
            - "HourEntry.${e1}.entry_status == ACTIVE, verification_status == UNVERIFIED, source == DIRECT_ENTRY, is_weekend == false, allocation_revision == 0, version == 1"
            - "HourEntry.${e1}.submission_version == 2 because the create incremented QuarterlySubmission.${sub}.version from 1"

      - name: submission_retrieval_reflects_rollup_from_hour_and_census_writes
        claim_type: retrieval
        grounds:
          - entities.QuarterlySubmission
          - endpoints[GET /submissions/{id}]
        distinguishing_aspect: "GET /submissions/{id} returns the stored row, and its rollup fields reflect the one 8.00-hour entry and one 5-resident census day written before the read."
        test_recipe:
          setup:
            - "A DRAFT submission carrying one payroll-supported 8.00-hour RN shift on 2026-04-01 and one census day with resident_count 5 / mds 5"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - &k_pr_0401
              call: "POST /payroll-records"
              payload: { facility_id: "${fac}", worker_id: "${w_rn}", pay_period_start: "2026-04-01", pay_period_end: "2026-04-01", paid_hours: 8.00, support_type: "TIMECARD", document_ref: "TC-K0401" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pr1: $.data.id }
            - &k_entry_0401
              call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], payroll_record_id: "${pr1}", expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e1: $.data.id, sv2: $.data.submission_version }
            - &k_census_0401
              call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01", resident_count: 5, mds_resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /submissions/${sub}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 200 and data.id == ${sub} with status DRAFT"
            - "data.total_raw_hours == 8.00, total_direct_care_hours == 8.00, total_excluded_hours == 0.00, total_rn_direct_care_hours == 8.00"
            - "data.total_resident_days == 5 and vendor_sourced_hours == 0.00"
            - "data.amendment_index == 0, amendment_surcharge_cents == 0, waived_surcharge_cents == 0, correction_deadline == 2026-12-31T23:59:59Z"

      - name: submissions_listing_filtered_by_status_returns_pagination_fields
        claim_type: listing
        grounds:
          - endpoints[GET /submissions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /submissions with status ACCEPTED and limit 1 returns the pagination quartet and only the accepted row, proving filter and pagination compose."
        test_recipe:
          setup:
            - "One TX facility with an ACCEPTED 2026Q2 submission carrying one SUPPORTED 8.00-hour RN shift and one RECONCILED census day"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - &k_reconcile_c1
              call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - &k_verify_e1
              call: "POST /hour-entries/${e1}/verify"
              payload: { outcome: "SUPPORTED" }
              as: StateAuditor
              as_user_id: "auditor-verify-01"
            - &k_validate
              call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - &k_submit
              call: "POST /submissions/${sub}/submit"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - &k_accept
              call: "POST /submissions/${sub}/accept"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-accept-01"
              captures: { sv_acc: $.data.version }
          trigger:
            - call: "GET /submissions"
              payload: { facility_id: "${fac}", status: "ACCEPTED", limit: 1, offset: 0 }
              as: StateAuditor
              as_user_id: "auditor-read-01"
          assert:
            - "response code is 200 with response_type == array, limit == 1, offset == 0, total_count == 1, has_more == false"
            - "the single returned row has id ${sub} and status ACCEPTED with audit_support_score == 100.00"
            - "GET /submissions with status DRAFT and the same facility_id returns total_count == 0"

      - name: census_day_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CENSUS_DAY_NOT_FOUND]
          - endpoints[GET /census-days/{id}]
        distinguishing_aspect: "Reading a census day id that was never minted returns the 404 error envelope with error_id ERR_CENSUS_DAY_NOT_FOUND rather than an empty 200."
        test_recipe:
          setup:
            - "Empty database; no CensusDay row has ever been created"
          setup_api_calls: []
          trigger:
            - call: "GET /census-days/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "response code is 404 with response_type == error and data.error_id == ERR_CENSUS_DAY_NOT_FOUND"
            - "data.message is present and non-empty"

      - name: census_day_create_missing_required_resident_count_returns_422
        claim_type: required_fields
        grounds:
          - validations[priority 13 ERR_INVALID_REQUEST]
          - endpoints[POST /census-days]
        distinguishing_aspect: "resident_count is declared required with no default, so omitting it returns ERR_INVALID_REQUEST and creates no CensusDay."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission with no census days"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-01" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /census-days with submission_id ${sub} returns total_count == 0"
            - "QuarterlySubmission.${sub}.version is still 1"

      - name: job_category_and_worker_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.JobCategory.fields.weekend_countable
          - entities.Worker.fields.authorized_roles
          - entities.Worker.fields.vendor_id
        distinguishing_aspect: "Omitting weekend_countable yields true, omitting authorized_roles yields the empty array, and omitting vendor_id yields null — the declared defaults, not nulls or absent keys."
        test_recipe:
          setup:
            - "One TX facility exists so a worker can be attached to it"
          setup_api_calls:
            - *k_fac
          trigger:
            - call: "POST /job-categories"
              payload: { code: "LPN", cms_job_code: 7, direct_care_class: "DIRECT_CARE", nurse_group: "LPN", direct_care_credit_pct: 1.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { jc_lpn: $.data.id }
            - call: "POST /workers"
              payload: { facility_id: "${fac}", full_name: "Morgan Practical", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_lpn}", hire_date: "2026-01-01" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_lpn: $.data.id }
          assert:
            - "JobCategory.${jc_lpn}.weekend_countable == true"
            - "Worker.${w_lpn}.authorized_roles == [] and vendor_id == null"
            - "Worker.${w_lpn}.status == ACTIVE and reported_hours_total == 0.00"

      - name: census_day_mds_resident_count_defaults_null_and_blocks_reconcile
        claim_type: defaults
        grounds:
          - entities.CensusDay.fields.mds_resident_count
          - validations[priority 23 ERR_MDS_COUNT_MISSING]
        distinguishing_aspect: "Omitting mds_resident_count stores null rather than copying resident_count, which is observable because reconcile then fails with ERR_MDS_COUNT_MISSING."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - call: "POST /census-days"
              payload: { submission_id: "${sub}", census_date: "2026-04-02", resident_count: 5 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /census-days/${c2}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "CensusDay.${c2}.mds_resident_count == null and variance_pct == null after creation"
            - "response code is 409 with data.error_id == ERR_MDS_COUNT_MISSING"
            - "CensusDay.${c2}.status is still REPORTED"

      - name: hour_entry_computed_classification_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.HourEntry.fields.direct_care_hours
          - entities.HourEntry.fields.raw_hours
        distinguishing_aspect: "direct_care_hours, raw_hours, and rn_hours are source computed; supplying them in the request body must not override the values derived from the shift window and allocations."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission, ADMIN category with direct_care_credit_pct 0.00"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_admin}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_admin}", percent: 100.00 }], expected_submission_version: "${sv}", raw_hours: 99.00, direct_care_hours: 99.00 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_adm: $.data.id }
          assert:
            - "HourEntry.${e_adm}.raw_hours == 8.00, not the supplied 99.00"
            - "HourEntry.${e_adm}.direct_care_hours == 0.00 and excluded_hours == 8.00, because the ADMIN category credits 0.00"
            - "HourEntry.${e_adm}.rn_hours == 0.00, lpn_hours == 0.00, na_hours == 0.00"
            - "QuarterlySubmission.${sub}.total_direct_care_hours == 0.00 and total_excluded_hours == 8.00"

      - name: facility_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Facility
          - endpoints[POST /facilities]
        distinguishing_aspect: "id, created_at, updated_at, and version are server-minted; supplying them on create must be ignored, and version must start at 1."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { ccn: "675003", name: "Rosewood Skilled Nursing", state_code: "TX", certified_bed_count: 60, id: "11111111-1111-4111-8111-111111111111", version: 47 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { fac3: $.data.id }
          assert:
            - "Facility.${fac3}.version == 1, not the supplied 47"
            - "Facility.${fac3}.id != 11111111-1111-4111-8111-111111111111"
            - "Facility.${fac3}.created_at and updated_at are server-generated ISO 8601 UTC values"
            - "Facility.${fac3}.posture == REPORTING_OPEN, outstanding_surcharge_cents == 0, latest_staffing_rating == null"

      - name: job_category_invalid_direct_care_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority 14 ERR_INVALID_ENUM_VALUE]
          - entities.JobCategory.fields.direct_care_class
        distinguishing_aspect: "direct_care_class is a closed enum; a value outside {DIRECT_CARE, DIRECT_CARE_SPLIT, ADMINISTRATIVE, NON_DIRECT_CARE} returns ERR_INVALID_ENUM_VALUE, which is a different error from a missing field."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /job-categories"
              payload: { code: "THERAPY", cms_job_code: 12, direct_care_class: "PARTIAL_CARE", nurse_group: "NONE", direct_care_credit_pct: 0.50 }
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "response code is 422 with data.error_id == ERR_INVALID_ENUM_VALUE"
            - "GET /job-categories with code THERAPY returns total_count == 0"

      - name: payroll_record_is_immutable_with_no_version_and_no_write_back
        claim_type: immutability
        grounds:
          - entities.PayrollRecord
          - endpoints[GET /payroll-records/{id}]
        distinguishing_aspect: "PayrollRecord declares common_fields false, so it carries only id and created_at, exposes no version field, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "One TX facility with one worker and one payroll record for 2026-04-01"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
          trigger:
            - call: "GET /payroll-records/${pr1}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 200 and data carries id and created_at but no version and no updated_at field"
            - "data.paid_hours == 8.00, support_type == TIMECARD, document_ref == TC-K0401"
            - "§1.5 declares no PUT, PATCH, or DELETE endpoint whose path begins /payroll-records"

      - name: hour_entry_unknown_submission_parent_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 12 ERR_SUBMISSION_NOT_FOUND]
          - endpoints[POST /hour-entries]
        distinguishing_aspect: "The submission_id foreign key must resolve before any state or business check runs, so an unknown parent returns 404 ERR_SUBMISSION_NOT_FOUND even though the rest of the payload is valid."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, RN category, and a coordinator worker; the referenced submission id was never minted"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "22222222-2222-4222-8222-222222222222", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 404 with data.error_id == ERR_SUBMISSION_NOT_FOUND"
            - "GET /hour-entries with submission_id ${sub} returns total_count == 0"

      - name: hour_entry_unknown_allocation_job_category_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 12 ERR_JOB_CATEGORY_NOT_FOUND]
          - entities.HourEntry.fields.allocations
        distinguishing_aspect: "Flat topology cross-reference integrity: every allocations[].job_category_id is itself a foreign key, so an unknown id nested inside the array must be caught by the same existence check, not silently dropped."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, DRAFT submission at version 1"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
          trigger:
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-01", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 60.00 }, { job_category_id: "33333333-3333-4333-8333-333333333333", percent: 40.00 }], expected_submission_version: "${sv}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "response code is 404 with data.error_id == ERR_JOB_CATEGORY_NOT_FOUND"
            - "no HourEntry is created and QuarterlySubmission.${sub}.version is still 1"

  - section: state_machines
    instances:
      - name: submission_initial_state_is_draft_with_zeroed_rollups
        claim_type: initial_state
        grounds:
          - state_machines.QuarterlySubmission
          - endpoints[POST /submissions]
        distinguishing_aspect: "A newly created QuarterlySubmission starts in the declared initial_state DRAFT with every rollup, finding count, and surcharge field at its zero value and correction_deadline copied from the period."
        test_recipe:
          setup:
            - "One TX facility and an OPEN 2026Q2 period with correction_window_end 2026-12-31T23:59:59Z"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
          trigger:
            - call: "POST /submissions"
              payload: { facility_id: "${fac}", reporting_period_id: "${per}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { sub_i: $.data.id }
          assert:
            - "QuarterlySubmission.${sub_i}.status == DRAFT and version == 1"
            - "total_raw_hours == 0.00, total_direct_care_hours == 0.00, total_excluded_hours == 0.00, total_resident_days == 0"
            - "hprd_reported == null and weekend_hprd_reported == null because total_resident_days is 0"
            - "open_fatal_finding_count == 0, open_warning_finding_count == 0, audit_support_score == null, correction_deadline == 2026-12-31T23:59:59Z"

      - name: vendor_submission_draft_to_submitted_sets_submitted_at
        claim_type: valid_transition
        grounds:
          - state_machines.VendorHourSubmission.DRAFT_to_SUBMITTED
          - endpoints[POST /vendor-submissions/{id}/submit]
        distinguishing_aspect: "The declared DRAFT -> SUBMITTED trigger moves the batch and stamps submitted_at with the logical clock, which is still the 2026-08-01T00:00:00Z default."
        test_recipe:
          setup:
            - "One TX facility, OPEN 2026Q2 period, an ACTIVE vendor with one AGENCY_CONTRACTOR worker, and a DRAFT vendor batch of one 8.00-hour RN line"
          setup_api_calls:
