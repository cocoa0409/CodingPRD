          against a claim already in state=WON (state violation, priority 5) AND with stale OCC version
          (would be 412) — the higher-priority state check wins. Test: cancel a WON claim with both
          a stale version and the bad state → server returns ERR_INVALID_STATE (state, priority 5),
          NOT ERR_STALE_WAIVER_VERSION (which is checked later as concurrency_rules).
