              payload: { service_location_id: "${loc_irr}", easement_width_ft: 40 }
              as: FieldOpsCoordinator
              captures: { row_irr: $.data.id }
            - call: "POST /coop/right-of-way-agreements/${row_irr}/consent"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/right-of-way-agreements/${row_irr}/record"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-orders/${so_irr}/mark-paid"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/service-orders/${so_irr}/schedule"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-orders/${so_irr}/construct"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/service-locations/${loc_irr}/energize"
              payload: {}
              as: FieldOpsCoordinator
            - call: "POST /coop/load-management-devices"
              payload: { service_location_id: "${loc_res}", device_type: "IRRIGATION_INTERRUPTIBLE" }
              as: MemberServicesRep
              captures: { lmd_res: $.data.id }
            - call: "POST /coop/load-management-devices"
              payload: { service_location_id: "${loc_irr}", device_type: "IRRIGATION_INTERRUPTIBLE" }
              as: MemberServicesRep
              captures: { lmd_irr: $.data.id }
          trigger:
            - call: "POST /coop/load-management-devices/${lmd_res}/activate"
              payload: {}
              as: FieldOpsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /coop/load-management-devices/${lmd_irr}/activate"
              payload: {}
              as: FieldOpsCoordinator
              captures: { ok_status: $.data.status }
          assert:
            - "Activate on the RESIDENTIAL-located IRRIGATION_INTERRUPTIBLE device fails with ERR_LMD_RATE_CLASS_MISMATCH (cross-entity gate on ServiceLocation.rate_class)"
            - "Activate on the IRRIGATION-located device succeeds -> status == ACTIVE"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_effectiveness_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_RATE_OVERLAP]
          - state_machines.RateSchedule.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Half-open [effective_from, effective_to) interval semantics on the
          RateSchedule resource: two PUBLISHED schedules for the same rate_class
          whose windows overlap (even at a single instant) are rejected; adjacency
          (one.effective_to == other.effective_from) is NOT an overlap.
        test_recipe:
          setup:
            - "PUBLISHED schedule RS-A RESIDENTIAL effective [2026-01-01, 2026-07-01)"
            - "DRAFT schedule RS-B RESIDENTIAL effective [2026-06-01, null) — overlaps"
            - "DRAFT schedule RS-C RESIDENTIAL effective [2026-07-01, null) — adjacent, no overlap"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-A", rate_class: "RESIDENTIAL", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", customer_charge_cents: 2000, tiers: [{up_to_kwh: null, cents_per_kwh: 10}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_a: $.data.id }
            - call: "POST /coop/rate-schedules/${rs_a}/publish"
              payload: {}
              as: RateAnalyst
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-B", rate_class: "RESIDENTIAL", effective_from: "2026-06-01T00:00:00Z", customer_charge_cents: 2100, tiers: [{up_to_kwh: null, cents_per_kwh: 11}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_b: $.data.id }
            - call: "POST /coop/rate-schedules"
              payload: { code: "RS-C", rate_class: "RESIDENTIAL", effective_from: "2026-07-01T00:00:00Z", customer_charge_cents: 2200, tiers: [{up_to_kwh: null, cents_per_kwh: 12}], demand_charge_cents_per_kw: 0, irrigation_offseason_discount_pct: 0, load_management_credit_cents: 0 }
              as: RateAnalyst
              captures: { rs_c: $.data.id }
          trigger:
            - call: "POST /coop/rate-schedules/${rs_b}/publish"
              payload: {}
              as: RateAnalyst
              captures: { err_overlap: $.data.error_id }
            - call: "POST /coop/rate-schedules/${rs_c}/publish"
              payload: {}
              as: RateAnalyst
              captures: { status_c: $.data.status }
          assert:
            - "Publishing RS-B (overlap) fails with ERR_RATE_OVERLAP"
            - "Publishing RS-C (adjacent at 2026-07-01 boundary, half-open) succeeds -> status == PUBLISHED"

      - name: ballot_uniqueness_per_member_district
        grounds:
          - errors[ERR_BALLOT_ALREADY_CAST]
          - state_machines.Ballot
        distinguishing_aspect: |
          Set-membership (uniqueness) semantics on the Ballot resource rather
          than geometric intervals: a second ballot for the same
          (election_id, member_id, district) triple collides with the existing
          one, a different interval/overlap semantic than rate-schedule windows.
        test_recipe:
          setup:
            - "Election VOTING_OPEN within window; one ACTIVE member in district 1 has already cast a ballot for district 1"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_id: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_id}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/board-elections"
              payload: { cooperative_id: "${coop_id}", year: 2026, seats: [1], voting_opens_at: "2026-08-01T00:00:00Z", voting_closes_at: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              captures: { el_id: $.data.id }
            - call: "POST /coop/board-elections/${el_id}/open-nominations"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/board-elections/${el_id}/close-nominations"
              payload: { candidate_names: ["Cand A", "Cand B"] }
              as: BoardSecretary
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: BoardSecretary
              captures: { coop_v: $.data.version }
            - call: "POST /coop/board-elections/${el_id}/open-voting"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardSecretary
            - call: "POST /coop/ballots"
              payload: { election_id: "${el_id}", district: 1, candidate_name: "Cand A", is_proxy: false }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /coop/ballots"
              payload: { election_id: "${el_id}", district: 1, candidate_name: "Cand B", is_proxy: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second ballot for same (election, member, district) fails with ERR_BALLOT_ALREADY_CAST"

  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_post_conserves_pool_plus_balances
        grounds:
          - calculations.capital_credit_allocation_shares
          - state_machines.CapitalCreditAllocation.APPROVED_to_POSTED
        distinguishing_aspect: |
          Conserved quantity: Cooperative.capital_credits_pool_cents +
          sum(Member.capital_credit_balance_cents). Posting an allocation moves
          cents from pool to member balances without creating or destroying
          value — pool drops by exactly the sum of balance increments.
        test_recipe:
          setup:
            - "Pool = 100001; three members with effective weights 100/300/600; allocation APPROVED with lines 10000/30000/60001"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 100001 }
              as: MemberServicesRep
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_a: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "B", member_type: "RESIDENTIAL", district_id: 2 }
              as: MemberServicesRep
              captures: { m_b: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "C", member_type: "RESIDENTIAL", district_id: 3 }
              as: MemberServicesRep
              captures: { m_c: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_a: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_b}", address: "2", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_b: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_c}", address: "3", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_c: $.data.id }
            - call: "POST /coop/members/${m_a}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_b}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/members/${m_c}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 100, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_b}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_b}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 300, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_c}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_c}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 600, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_a}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_a: $.data.id }
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_b}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_b: $.data.id }
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_c}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_c: $.data.id }
            - call: "POST /coop/invoices/${inv_a}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/invoices/${inv_b}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/invoices/${inv_c}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "PATRONAGE_WEIGHTED" }
              as: MemberServicesRep
              captures: { alloc_id: $.data.id }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
          trigger:
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v: $.data.version, pool_before: $.data.capital_credits_pool_cents }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/post"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: MemberServicesRep
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { pool_after: $.data.capital_credits_pool_cents }
            - call: "GET /coop/members/${m_a}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_a: $.data.capital_credit_balance_cents }
            - call: "GET /coop/members/${m_b}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_b: $.data.capital_credit_balance_cents }
            - call: "GET /coop/members/${m_c}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_c: $.data.capital_credit_balance_cents }
          assert:
            - "pool_before == 100001 and pool_after == 0"
            - "bal_a + bal_b + bal_c == 100001 (10000 + 30000 + 60001)"
            - "Invariant: pool_after + (bal_a+bal_b+bal_c) == pool_before + 0 — value conserved across the post"

      - name: payout_cash_and_unclaimed_conserve_member_credit
        grounds:
          - state_machines.CapitalCreditPayout
        distinguishing_aspect: |
          Conserved quantity: Member.capital_credit_balance_cents +
          Member.unclaimed_credit_cents + disbursed-to-bank cents. Both the
          CASHED path and the UNCLAIMED path decrement the balance by exactly
          payout_cents; UNCLAIMED moves it to unclaimed_credit_cents, CASHED
          moves it out — no path leaves the balance unchanged or double-counts.
        test_recipe:
          setup:
            - "Member with capital_credit_balance_cents == 10000 from a posted allocation; an executed retirement with one PENDING payout of 5000"
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST", "PRO_RATA_PERCENTAGE"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /coop/cooperatives/${coop_id}/post-margin"
              payload: { fiscal_year: 2025, margin_cents: 10000 }
              as: MemberServicesRep
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_a: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_a: $.data.id }
            - call: "POST /coop/members/${m_a}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 100, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_a}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_a: $.data.id }
            - call: "POST /coop/invoices/${inv_a}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              captures: { alloc_id: $.data.id }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v: $.data.version }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/post"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: MemberServicesRep
            - call: "POST /coop/capital-credit-retirements"
              payload: { cooperative_id: "${coop_id}", method: "PRO_RATA_PERCENTAGE", total_retire_cents: 5000, pro_rata_pct: 0.5 }
              as: MemberServicesRep
              captures: { ret_id: $.data.id }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/board-approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v2: $.data.version }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/execute"
              payload: { expected_cooperative_version: "${coop_v2}" }
              as: MemberServicesRep
            - call: "GET /coop/capital-credit-retirements/${ret_id}/payouts"
              payload: {}
              as: MemberServicesRep
              captures: { pay_id: "$.data[0].id" }
          trigger:
            - call: "POST /coop/capital-credit-payouts/${pay_id}/mark-unclaimed"
              payload: {}
              as: MemberServicesRep
            - call: "GET /coop/members/${m_a}"
              payload: {}
              as: MemberServicesRep
              captures: { bal_after: $.data.capital_credit_balance_cents, uncl_after: $.data.unclaimed_credit_cents }
          assert:
            - "bal_after == 5000 (10000 - 5000 payout)"
            - "uncl_after == 5000"
            - "Invariant: bal_after + uncl_after == 10000 == original balance — mark-unclaimed moves value between buckets without drift"
