scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estray_provisional_vs_final_distribution_diverge
        grounds:
          - calculations.estray_proceeds_distribution
          - state_machines.EstrayCase.IMPOUNDED_to_AUCTION_SCHEDULED
          - state_machines.EstrayCase.AUCTION_SCHEDULED_to_SOLD
          - entities.EstrayCase.fields.distribution_variant
          - entities.EstrayCase.fields.claimant_residual_cents
        distinguishing_aspect: |
          This dual variant lives on the EstrayCase money domain: the PROVISIONAL pass at auction
          scheduling charges exactly STATUTORY_HOLD_DAYS of care against the auctioneer estimate,
          while the FINAL pass at sale charges the inclusive intake-to-sale day count against the
          hammer price, so the same case yields claimant_residual_cents 91200 then 46160.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-05T00:00:00Z."
            - "District T-EST with travel_surcharge_cents 2500 and impound_capacity_head 100, intake_status OPEN."
            - "One InspectionOrder IN_FIELD in T-EST carrying a single 12-head lot with no legible recorded brand."
            - "That lot has been given a NO_LEGIBLE_BRAND finding, so an EstrayCase is IMPOUNDED with head_count 12, impounded_at 2026-08-05T00:00:00Z and statutory_release_on 2026-08-25T00:00:00Z."
            - "Clock advanced to 2026-08-25T00:00:00Z and the auction scheduled with estimated_gross_cents 180000, so the PROVISIONAL buckets are already written."
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Rocking R Cattle Co", mailing_state: "MT", contact_email: "rr@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-EST", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_e: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-201", home_territory_id: "${terr_e}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_e: "$.data.id", insp_e_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_e}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-05T08:00:00Z", requested_window_end_at: "2026-08-05T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_e: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_e}/schedule"
              payload: { inspector_id: "${insp_e}", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T11:00:00Z", expected_inspector_version: "${insp_e_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_e}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_e}"
            - call: "POST /brand-inspection/inspection-orders/${ord_e}/lots"
              payload: { species_class: "CATTLE", head_count: 12 }
              as: FieldInspector
              as_user_id: "${insp_e}"
              captures: { lot_e: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_e}/finding"
              payload: { finding: "NO_LEGIBLE_BRAND" }
              as: FieldInspector
              as_user_id: "${insp_e}"
            - call: "GET /brand-inspection/estray-cases?animal_lot_id=${lot_e}"
              payload: {}
              as: BoardAdmin
              captures: { est_e: "$.data[0].id" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/estray-cases/${est_e}/schedule-auction"
              payload: { estimated_gross_cents: 180000 }
              as: BoardAdmin
            - call: "GET /brand-inspection/estray-cases/${est_e}"
              payload: {}
              as: BoardAdmin
              captures: { prov_care: "$.data.care_cost_cents", prov_handling: "$.data.handling_fee_cents", prov_resid: "$.data.claimant_residual_cents", prov_variant: "$.data.distribution_variant" }
          trigger:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/estray-cases/${est_e}/record-sale"
              payload: { gross_proceeds_cents: 160000 }
              as: BoardAdmin
          assert:
            - "${prov_variant} == PROVISIONAL"
            - "${prov_care} == 66000"
            - "${prov_handling} == 22800"
            - "${prov_resid} == 91200"
            - "EstrayCase.${est_e}.distribution_variant == FINAL"
            - "EstrayCase.${est_e}.care_cost_cents == 102300"
            - "EstrayCase.${est_e}.handling_fee_cents == 11540"
            - "EstrayCase.${est_e}.claimant_residual_cents == 46160"
            - "EstrayCase.${est_e}.status == SOLD"
            - "160000 == 102300 + 11540 + 46160"

      - name: owner_posted_vs_projected_arrears_diverge
        grounds:
          - calculations.owner_arrears_and_standing
          - entities.Owner.fields.posted_arrears_cents
          - entities.Owner.fields.projected_arrears_cents
          - state_machines.InspectionOrder.fee_status.ASSESSED_to_DELINQUENT
          - endpoints["GET /brand-inspection/owners/{id}/statement"]
        distinguishing_aspect: |
          This dual variant lives on the Owner standing domain, not on any EstrayCase money bucket:
          POSTED counts only DELINQUENT fees while PROJECTED counts ASSESSED plus DELINQUENT, so one
          owner holding a swept 7450 fee and an unswept 2500 fee reads 7450 and 9950 in the same
          statement response.
        test_recipe:
          setup:
            - "Owner A with two completed InspectionOrders in district T-A2 (travel_surcharge_cents 2500)."
            - "Order 1 completed while the clock read 2026-08-01T00:00:00Z, one 40-head lot, assessed 7450, fee_due_on 2026-08-31T00:00:00Z."
            - "Order 2 completed while the clock read 2026-08-15T00:00:00Z, no lots at all, assessed 2500, fee_due_on 2026-09-14T00:00:00Z."
            - "Clock advanced to 2026-08-31T00:00:00Z, so only order 1 is past due."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Aspen Draw Ranch", mailing_state: "MT", contact_email: "aspen@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-A2", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_a: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-301", home_territory_id: "${terr_a}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-302", home_territory_id: "${terr_a}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_2: "$.data.id", insp_2_v: "$.data.version" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "7X", position_code: "LEFT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_a}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 40, brand_registration_id: "${reg_a}" }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_1: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_1}/finding"
              payload: { finding: "MATCH_CONFIRMED" }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_a}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-16T08:00:00Z", requested_window_end_at: "2026-08-16T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_2: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/schedule"
              payload: { inspector_id: "${insp_2}", scheduled_start_at: "2026-08-16T09:00:00Z", scheduled_end_at: "2026-08-16T11:00:00Z", expected_inspector_version: "${insp_2_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_2}"
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_2}"
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/_ops/delinquency-sweep"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { swept_delinquent: "$.data.delinquent_order_count" }
            - call: "GET /brand-inspection/owners/${own_a}/statement"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { st_posted: "$.data.posted_arrears_cents", st_projected: "$.data.projected_arrears_cents", st_standing: "$.data.standing" }
          assert:
            - "${swept_delinquent} == 1"
            - "InspectionOrder.${ord_1}.assessed_fee_cents == 7450 and InspectionOrder.${ord_1}.fee_status == DELINQUENT"
            - "InspectionOrder.${ord_2}.assessed_fee_cents == 2500 and InspectionOrder.${ord_2}.fee_status == ASSESSED"
            - "${st_posted} == 7450"
            - "${st_projected} == 9950"
            - "${st_standing} == GOOD"
            - "Owner.${own_a}.posted_arrears_cents == 7450 and Owner.${own_a}.projected_arrears_cents == 9950"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_admin_surcharge_rounded_per_lot_then_summed
        grounds:
          - calculations.inspection_fee_assessment
          - entities.InspectionOrder.fields.assessed_fee_cents
          - state_machines.InspectionOrder.fee_status.UNASSESSED_to_ASSESSED
        distinguishing_aspect: |
          Mode (b) nested rounding: a 30-head lot and a 40-head lot draw marginal band bases of 3300
          and 3900 cents, whose 12.5 percent administrative surcharges both land on a half cent.
          Rounding per lot and then summing yields 10601; summing the bases and rounding once yields
          10600, so the pinned rounding order is the only reading that produces the asserted number.
        test_recipe:
          setup:
            - "District T-ROUND with travel_surcharge_cents 2500."
            - "One InspectionOrder IN_FIELD with two lots created in order: 30 head then 40 head, both carrying the same recorded brand and both given MATCH_CONFIRMED findings."
            - "Scheduled window starts at 09:00Z so the after-hours flat charge does not apply."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Two Dot Livestock", mailing_state: "MT", contact_email: "twodot@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-ROUND", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_r: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-901", home_territory_id: "${terr_r}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "TD", position_code: "LEFT_HIP", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_r}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T13:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 30, brand_registration_id: "${reg_a}" }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_1: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_1}/finding"
              payload: { finding: "MATCH_CONFIRMED" }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 40, brand_registration_id: "${reg_a}" }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_2: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_2}/finding"
              payload: { finding: "MATCH_CONFIRMED" }
              as: FieldInspector
              as_user_id: "${insp_1}"
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { fee: "$.data.assessed_fee_cents", head: "$.data.head_count_presented" }
          assert:
            - "${fee} == 10601"
            - "${fee} != 10600"
            - "${head} == 70"
            - "InspectionOrder.${ord_1}.fee_status == ASSESSED"
            - "InspectionOrder.${ord_1}.fee_due_on == 2026-08-31T00:00:00.000Z"
            - "Owner.${own_a}.projected_arrears_cents == 10601"

      - name: brand_priority_backdating_caps_and_gates_prior_use
        grounds:
          - calculations.brand_priority_ranking
          - entities.BrandApplication.fields.effective_priority_at
          - entities.BrandRegistration.fields.priority_rank
          - validations[priority=60]
          - state_machines.BrandApplication.UNDER_EXAMINATION_to_RECORDED
        distinguishing_aspect: |
          Mode (a) non-linear formula over three inputs on a different axis from the fee rounding
          rule: prior_use_affidavit_on_file gates the credit to zero, PRIOR_USE_CAP_YEARS clips 12
          claimed years to 10, and only the clipped value backdates the filing, so a filing lodged
          2026-08-02 lands at 2016-08-04, outranks the 2026-08-01 incumbent and takes priority_rank 1.
        test_recipe:
          setup:
            - "Owner B recorded brand 'W-BAR' RIGHT_HIP CATTLE MT on the default clock instant 2026-08-01T00:00:00Z with no prior-use affidavit, so its effective_priority_at is 2026-08-01T00:00:00Z and its priority_rank is 1."
            - "Clock advanced to 2026-08-02T00:00:00Z."
            - "Owner A filed the identical conflict-group brand claiming 12 documented prior-use years with an affidavit on file, and that filing is UNDER_EXAMINATION."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Bitterroot Land & Cattle", mailing_state: "MT", contact_email: "bitterroot@example.test" }
              as: BoardAdmin
              captures: { own_b: "$.data.id" }
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Absaroka Angus", mailing_state: "MT", contact_email: "absaroka@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_b}", application_type: "NEW", brand_symbol: "W-BAR", position_code: "RIGHT_HIP", species_class: "CATTLE", state_code: "MT", documented_prior_use_years: 0, prior_use_affidavit_on_file: false }
              as: LivestockOwner
              as_user_id: "${own_b}"
              captures: { app_b: "$.data.id", app_b_eff: "$.data.effective_priority_at" }
            - call: "POST /brand-inspection/brand-applications/${app_b}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_b}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_b: "$.data.id" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "W-BAR", position_code: "RIGHT_HIP", species_class: "CATTLE", state_code: "MT", documented_prior_use_years: 12, prior_use_affidavit_on_file: true }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id", app_a_eff: "$.data.effective_priority_at" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
          trigger:
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id", reg_a_rank: "$.data.priority_rank", reg_a_eff: "$.data.effective_priority_at" }
          assert:
            - "${app_b_eff} == 2026-08-01T00:00:00.000Z"
            - "${app_a_eff} == 2016-08-04T00:00:00.000Z"
            - "${reg_a_eff} == 2016-08-04T00:00:00.000Z"
            - "${reg_a_rank} == 1"
            - "BrandRegistration.${reg_b}.priority_rank == 2"
            - "BrandRegistration.${reg_b}.status == ACTIVE"
            - "BrandRegistration.${reg_a}.status == ACTIVE"
            - "had prior_use_affidavit_on_file been false the filing's effective_priority_at would be 2026-08-02T00:00:00.000Z, the incumbent would outrank it, and the record call would have failed with ERR_BRAND_CONFLICT_EXISTS"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: brand_application_correction_cycle_third_return_rejects
        grounds:
          - state_machines.BrandApplication.UNDER_EXAMINATION_to_RETURNED_FOR_CORRECTION
          - state_machines.BrandApplication.RETURNED_FOR_CORRECTION_to_SUBMITTED
          - state_machines.BrandApplication.UNDER_EXAMINATION_to_REJECTED
          - entities.BrandApplication.fields.correction_rounds
          - entities.BrandApplication.fields.original_filed_at
        distinguishing_aspect: |
          BrandApplication is the cyclic machine: SUBMITTED -> UNDER_EXAMINATION ->
          RETURNED_FOR_CORRECTION -> SUBMITTED is traversed twice and the third return leaves the
          cycle into REJECTED at correction_rounds 3, while original_filed_at never moves.
        test_recipe:
          setup:
            - "Owner A filed a NEW brand application on the default clock instant 2026-08-01T00:00:00Z."
            - "The filing has already been examined, returned, resubmitted, examined and returned a second time, so correction_rounds == 2 and status == RETURNED_FOR_CORRECTION."
            - "The applicant has resubmitted once more and a recorder has taken it up again, so status == UNDER_EXAMINATION with correction_rounds still 2."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Sweet Grass Partners", mailing_state: "MT", contact_email: "sweetgrass@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "SG", position_code: "LEFT_SHOULDER", species_class: "HORSE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id", app_filed: "$.data.original_filed_at" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/return"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/resubmit"
              payload: { brand_symbol: "SG" }
              as: LivestockOwner
