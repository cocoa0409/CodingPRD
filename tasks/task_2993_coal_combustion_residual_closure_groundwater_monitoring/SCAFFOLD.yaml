  - method: GET
    path: "/ccr/statistical-evaluations"
    description: "List statistical evaluations; filters are ANDed. comparison_source_event_id resolves the round a verdict was drawn from"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, StatisticalReviewer, Hydrogeologist]
    code: 200
    input: ["program_id?", "compliance_well_id?", "reviewing_professional_id?", "asd_certifying_professional_id?", "comparison_source_event_id?", "verdict?", "status?", "limit?", "offset?"]
    output: StatisticalEvaluation[]
