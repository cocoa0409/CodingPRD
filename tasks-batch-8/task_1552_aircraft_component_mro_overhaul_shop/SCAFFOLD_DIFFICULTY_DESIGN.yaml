  # =========================================================================
  # Rule 5 — validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_precedes_segregation_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.WorkOrder.TEST_PASSED_to_RELEASED
        distinguishing_aspect: |
          Category pair (state vs business_safety): a release attempted while the work order
          is REPAIR_IN_PROGRESS (post-FAIL retest loop) by the SAME user id as the technician
          violates both the state precondition and segregation-of-duties; the state error
          ERR_WORK_ORDER_INVALID_STATE (409) must win over ERR_SEGREGATION_OF_DUTIES_VIOLATION.
        test_recipe:
          setup:
            - "Work order repaired by tech-1, FAILed by insp-9 (so technician_user_id == 'tech-1' is pinned and status is REPAIR_IN_PROGRESS again)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T00:00:00Z", end_time: "2026-08-03T04:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "FAIL", atp_reference: "ATP-F1" }, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "tech-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_WORK_ORDER_INVALID_STATE' with HTTP 409 — state precondition (priority 5) beats segregation-of-duties (priority 6) even though both are violated"
            - "WorkOrder(${wo}).status remains 'REPAIR_IN_PROGRESS'; no ReleaseCertificate created"
      - name: quote_safety_precedes_credit_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=22]
          - state_machines.WorkOrder.AWAITING_QUOTE_to_QUOTE_SUBMITTED
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal — different pair than the
          state-vs-safety instance): the quote is at once BER without scrap
          acknowledgement AND the customer is on credit hold; ERR_BER_SCRAP_ACK_REQUIRED
          (403, safety) must win over ERR_CUSTOMER_CREDIT_HOLD (402, fiscal).
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 0 (credit_hold true from creation since exposure 0 >= 0); work order torn down to AWAITING_QUOTE; quote estimates sum exactly to the BER threshold (5500000+1000000 == 65% of 10000000) without scrap_option_ack"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "BrokeAir", certificate_number: "AIR-002", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 0 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 5500000, parts_estimate_cents: 1000000 }, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_BER_SCRAP_ACK_REQUIRED' with HTTP 403 — safety (priority 8) beats fiscal (priority 22) although the customer is also on credit hold"
            - "WorkOrder(${wo}).status remains 'AWAITING_QUOTE' and ber_flag is not yet persisted (quote rejected, no version bump)"

  # =========================================================================
  # Rule 6 — boundary precision on DIFFERENT metrics / endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ber_estimate_exactly_at_threshold_is_ber
        grounds:
          - calculations.ber_evaluation_calc
          - entities.WorkOrder.fields.ber_flag
        distinguishing_aspect: |
          Metric: repair-estimate cents vs BER threshold, via POST quote. The comparison is
          INCLUSIVE: estimate sum exactly == round(65% * 10000000) == 6500000 sets ber_flag
          true; one cent below (6499999) leaves it false.
        test_recipe:
          setup:
            - "Customer (high credit), part PN-32-ACT (replacement 10000000, ber_threshold_pct 65 default), unit inducted, teardown complete -> AWAITING_QUOTE"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 5500000, parts_estimate_cents: 1000000, scrap_option_ack: true }, as: CustomerServiceRep, captures: { ber_hi: $.data.ber_flag } }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 5499999, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { ber_lo: $.data.ber_flag } }
          assert:
            - "ber_hi == true (6500000 >= 6500000 — equality IS beyond-economic-repair)"
            - "ber_lo == false (6499999 < 6500000) after the re-quote self-loop supersedes it"
      - name: tat_adjusted_hours_exactly_at_guarantee_zero_penalty
        grounds:
          - calculations.tat_penalty_calc
          - entities.Invoice.fields.penalty_credit_cents
        distinguishing_aspect: |
          Metric: adjusted turnaround hours vs guarantee, via POST invoice (different metric
          and endpoint than the BER instance). Penalty triggers on excess > 0, so adjusted
          hours exactly == 100h guarantee yields penalty_credit_cents == 0, not one hour of
          penalty.
        test_recipe:
          setup:
            - "ADJUSTED customer (100h guarantee, 5000/h, cap 50%); work order with one requisition (2 @ 250000 -> 575000) and one 4h booking (400000); quote at receipt 2026-08-01T00:00:00Z; approval at 2026-08-03T12:00:00Z (delay 60h); release at 2026-08-07T16:00:00Z -> elapsed 160h, adjusted exactly 100h"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: ShopManager }
