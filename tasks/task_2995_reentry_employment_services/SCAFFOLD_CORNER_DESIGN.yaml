          participant_id: ${p1_id}
          disclosure_script_reviewed: true
        as: CaseManager
        as_user_id: cm-1
        captures:
          eb_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-05T14:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /enrollments/${eb_id}/status
        payload:
          to_status: ATTENDED
        as: CaseManager
