  - section: validations
    instances:

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Any endpoint invoked without the X-User-Role or X-User-ID header returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /medicine-relief/sites"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: wrong_role_for_endpoint_returns_forbidden_role
        claim_type: violation_to_error
        grounds:
          - validations.priority_2_auth
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A SiteCoordinator attempting to release a ProductLot (a QAPharmacist-exclusive operation) is rejected with 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, lot L QUARANTINED."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 10, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: SiteCoordinator
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_FORBIDDEN_ROLE"
            - "ProductLot.${lot_id}.lot_posture remains QUARANTINED"

      - name: site_coordinator_cannot_cancel_another_sites_request
        claim_type: violation_to_error
        grounds:
          - validations.priority_4_existence
          - errors.ERR_FORBIDDEN_OWNERSHIP
        distinguishing_aspect: "SiteCoordinator for site A attempting to cancel a request whose requested_by_user_id points to site B is rejected with 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Sites SA and SB both QUALIFIED."
            - "Request R created by SB's coordinator."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
