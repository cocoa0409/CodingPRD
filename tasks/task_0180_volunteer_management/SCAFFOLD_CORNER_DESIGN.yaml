        claim_type: immediate_consistency
        grounds: [state_machines.Opportunity.PUBLISHED_to_CLOSED, state_machines.Shift.OPEN_to_CANCELLED]
        distinguishing_aspect: "Closing an Opportunity returns within one request and its child OPEN shift is already CANCELLED on the immediately-following GET (immediate consistency)."
        test_recipe:
          setup: ["A PUBLISHED Opportunity with one OPEN shift, no signups."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/opportunities/${opp_id}/close"
              payload: {}
              as: ShiftCoordinator
              captures: { pub: $.data.publication_status }
            - call: "GET /vm/shifts/${shift_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { shift_status: $.data.status }
          assert:
            - "Opportunity.${opp_id}.publication_status == CLOSED"
            - "Shift.${shift_id}.status == CANCELLED (cascade visible immediately)"
