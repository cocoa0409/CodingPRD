              payload: { location_id: "${loc1}", start_at: "2027-02-14T14:00:00Z", end_at: "2027-02-14T16:00:00Z" }
              as: CouncilAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOOTH_CONFLICT"

