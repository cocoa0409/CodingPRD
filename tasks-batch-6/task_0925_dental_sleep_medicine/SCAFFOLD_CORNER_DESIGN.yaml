          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_physician_id: "${phys_id}", treating_dentist_id: "00000000-0000-4000-8000-000000000abc", diagnostic_study_id: "${study_id}", cpap_history: "REFUSAL", cpap_nights_used: 0, cpap_documented_on: "2026-03-01" }
              as: SleepPhysician
