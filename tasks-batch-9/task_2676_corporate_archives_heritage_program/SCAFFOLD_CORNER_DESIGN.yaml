            - call: "POST /record-series"
              payload: { title: "Series A Advertising", business_unit: "Marketing", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 10, earliest_record_year: 1970, latest_record_year: 2000 }
              as: Archivist
