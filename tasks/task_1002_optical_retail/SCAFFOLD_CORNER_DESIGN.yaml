  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: pd_below_range_on_capture_returns_pd_out_of_range
        claim_type: Violation → Error
        grounds: ["validations[priority=48]", "errors[ERR_PD_OUT_OF_RANGE]", entities.Prescription.fields.pd_mm]
        distinguishing_aspect: "pd_mm 44.9 is below the [45.0, 80.0] capture range and is rejected with ERR_PD_OUT_OF_RANGE (422) — the boundary value 45.0 is accepted."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "Pip Dee", email: "pip@x.com", dob: "1990-09-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 44.9, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 45.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_ok: $.data.id }
          assert:
            - "The 44.9 attempt returns HTTP 422 and ${err} == ERR_PD_OUT_OF_RANGE"
            - "The 45.0 attempt returns HTTP 201"
            - "Prescription.${rx_ok}.pd_mm == 45.0"
            - "Prescription.${rx_ok}.status == SUBMITTED"

      - name: pd_outside_the_frame_range_on_order_returns_pd_out_of_range
