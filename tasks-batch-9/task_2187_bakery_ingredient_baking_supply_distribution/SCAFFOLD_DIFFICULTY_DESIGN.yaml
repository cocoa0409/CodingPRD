  - rule_id: boundary_precision_check
    instances:
      - name: boundary_min_drop_total_exactly_equal_passes_one_cent_below_fails
        grounds:
          - validations[priority=32]
          - calculations.order_total_settlement
          - calculations.order_line_extended_price
          - entities.Customer.fields.min_drop_cents
          - errors[ERR_MIN_DROP_NOT_MET]
        distinguishing_aspect: |
          Numeric-threshold edge on the >= comparison of priority 32: a 1000 lb emulsifier order
          computes to total_cents 497350 (490000 line + 12250 fuel - 4900 rebate) which is EXACTLY
          min_drop_cents 497350 and must pass, while a 999 lb order computes to 496853 - only 497
          cents lower - and must fail ERR_MIN_DROP_NOT_MET / 422. The pair pins the inclusive side
          of the boundary and forbids an implementation that uses strict >.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Precision Pastry ACTIVE, credit_limit_cents 2000000, min_drop_cents 497350 (set to the exact computed total of the 1000 lb order)."
            - "Emulsifier SKU SPC-EMU-10 (FAT, allergen NONE, list_price_cents_per_lb 490, not bulk capable)."
            - "Two BAGGED orders: order 1 with a 1000 lb line, order 2 with a 999 lb line; neither is submitted yet."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Precision Pastry", allergen_program: "STANDARD", credit_limit_cents: 2000000, min_drop_cents: 497350 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "SPC-EMU-10", category: "FAT", allergen_class: "NONE", bulk_capable: false, shelf_life_days: 90, index_code: "NONE", list_price_cents_per_lb: 490, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { emu_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order1_id}/lines"
              payload: { product_id: "${emu_id}", quantity_lb: 1000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-16T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order2_id}/lines"
              payload: { product_id: "${emu_id}", quantity_lb: 999 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line2_id: $.data.id }
          trigger:
            - call: "POST /bakery-distribution/orders/${order1_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { ps1: $.data.pricing_status, tot1: $.data.total_cents, sub1: $.data.subtotal_cents, fuel1: $.data.fuel_surcharge_cents, reb1: $.data.volume_rebate_cents }
            - call: "POST /bakery-distribution/orders/${order2_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "${ps1} == PROVISIONAL"
            - "${sub1} == 490000"
            - "${fuel1} == 12250"
            - "${reb1} == 4900"
            - "${tot1} == 497350"
            - "${err2} == ERR_MIN_DROP_NOT_MET"
            - "HTTP status of the second submit call is 422"
            - "Order.${order2_id}.pricing_status == UNPRICED"
            - "Order.${order2_id}.total_cents == 0"
            - "the 999 lb order would have computed 489510 + 12238 - 4895 = 496853, which is 497 cents below min_drop_cents"
            - "Customer.${cust_id}.open_exposure_cents == 497350"

      - name: boundary_rotation_eligibility_exactly_min_rotation_days_then_empty_candidate_set
        grounds:
          - calculations.lot_rotation_selector
          - validations[priority=17]
          - entities.Product.fields.min_rotation_days
          - entities.Lot.fields.expires_on
          - errors[ERR_NO_ELIGIBLE_LOT]
        distinguishing_aspect: |
          A different boundary metric (remaining shelf life in days) on a different endpoint
          (allocate): LOT-A expires 2026-09-04, exactly min_rotation_days = 30 days after the
          2026-08-05 clock, so it IS eligible, while the earlier-expiring LOT-B (2026-09-03,
          29 days) is NOT - which means strict FEFO alone would pick the wrong lot. The follow-up
          6000 lb order then drives the candidate set to EMPTY (LOT-A has only 3500 lb left,
          LOT-B is ineligible) and must return ERR_NO_ELIGIBLE_LOT / 409.
