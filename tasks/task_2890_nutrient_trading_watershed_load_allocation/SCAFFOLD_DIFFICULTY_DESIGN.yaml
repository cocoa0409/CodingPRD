# ===========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Task 2890 — Nutrient Trading & Watershed Load Allocation
#   9 rule_ids x 2 instances = 18 instances. Every numeric literal in an
#   `assert:` line was computed with Python Decimal / ROUND_HALF_UP against
#   the §1.3 formula it grounds in.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: allocation_background_variant_provisional_vs_final_divergence
        grounds:
          - calculations.wasteload_allocation_run
          - calculations.monitoring_sample_load
          - entities.AllocationRun.fields.variant
          - entities.TmdlAssessment.fields.effective_background_lbs_yr
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_APPROVED
        distinguishing_aspect: |
          The variant switch is driven by the PARENT ASSESSMENT'S STATUS, not by which
          endpoint was called: the identical POST /tmdl-assessments/{id}/allocation-runs
          call with the identical method and the identical four source rows yields
          allocable_load_lbs_yr 48000.00 under provisional_background (the analyst's
          6000.00 estimate) and 49571.00 under final_monitored_background (the 4429.00
          monitored mean), moving every per-source allocation by exactly the divergence.
        test_recipe:
          setup:
            - "Watershed SCR (OH, TOTAL_PHOSPHORUS, baseline 120000.00, uncertainty 2.0000, retirement 0.1000, equivalence 1.0000, eligible zones Z1/Z2) with four reaches: R_OUT (COMPLIANCE_POINT, df 1.0000, outlet), R_MID (MAINSTEM, df 0.9000 -> R_OUT), R_UP (HEADWATER, df 0.8000 -> R_MID), R_BG (BACKGROUND, df 0.7000 -> R_MID)."
            - "TmdlAssessment TMDL-P-2026 in DRAFT: loading capacity 60000.00, margin_of_safety_pct 0.1000, background estimate 6000.00, period 2026-01-01..2035-12-31."
            - "Four SourceAssessment rows, all INVENTORIED: City WWTP (POINT, R_MID, 20000.00, 0.8000), Village WWTP (POINT, R_OUT, 5000.00, 0.5000), Upper Cropland (NONPOINT, R_UP, 30000.00, 0.4000), Upper Pasture (NONPOINT, R_UP, 10000.00, 0.3000)."
            - "Run 1 is executed while the assessment is still DRAFT, so it takes the PROVISIONAL variant."
            - "Two ACCEPTED BACKGROUND samples on R_BG inside the assessment period compute to 4921.11 and 3936.89 lbs/yr, a mean of 4429.00."
            - "The assessment is then walked DRAFT -> PUBLIC_COMMENT -> APPROVED so that run 2 takes the FINAL variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_BG", trading_zone_code: "Z3", reach_class: "BACKGROUND", delivery_factor: 0.7000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_bg_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p2_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_n1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Pasture", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.3000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_n2_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-PROVISIONAL", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_bg_id}", sample_datetime: "2026-05-01T12:00:00Z", measured_conc_mg_l: 0.0250, flow_cfs: 100.00, qa_status: "ACCEPTED" }
              as: TmdlAnalyst
              captures: { ms_bg1_id: $.data.id }
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_bg_id}", sample_datetime: "2026-05-15T12:00:00Z", measured_conc_mg_l: 0.0200, flow_cfs: 100.00, qa_status: "ACCEPTED" }
              as: TmdlAnalyst
              captures: { ms_bg2_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
            - call: "GET /tmdl-assessments/${t_id}"
              as: TmdlAnalyst
              captures: { t_ver2: $.data.version }
          trigger:
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-FINAL", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver2}" }
              as: TmdlAnalyst
              captures: { run2_id: $.data.id }
          assert:
            - "MonitoringSample.${ms_bg1_id}.computed_load_lbs_yr == 4921.11"
            - "MonitoringSample.${ms_bg2_id}.computed_load_lbs_yr == 3936.89"
            - "AllocationRun.${run1_id}.variant == PROVISIONAL"
            - "AllocationRun.${run1_id}.effective_background_lbs_yr == 6000.00"
            - "AllocationRun.${run1_id}.allocable_load_lbs_yr == 48000.00"
            - "AllocationRun.${run1_id}.point_pool_lbs_yr == 27360.00"
            - "AllocationRun.${run1_id}.nonpoint_pool_lbs_yr == 18240.00"
            - "AllocationRun.${run1_id}.wla_total_lbs_yr == 27360.00"
            - "AllocationRun.${run1_id}.la_total_lbs_yr == 18240.00"
            - "AllocationRun.${run1_id}.reserve_allocation_lbs_yr == 2400.00"
            - "AllocationRun.${run1_id}.status == SUPERSEDED"
            - "AllocationRun.${run2_id}.variant == FINAL"
            - "AllocationRun.${run2_id}.effective_background_lbs_yr == 4429.00"
            - "AllocationRun.${run2_id}.allocable_load_lbs_yr == 49571.00"
            - "AllocationRun.${run2_id}.point_pool_lbs_yr == 28255.47"
            - "AllocationRun.${run2_id}.nonpoint_pool_lbs_yr == 18836.98"
            - "AllocationRun.${run2_id}.wla_total_lbs_yr == 28255.47"
            - "AllocationRun.${run2_id}.la_total_lbs_yr == 18836.99"
            - "AllocationRun.${run2_id}.reserve_allocation_lbs_yr == 2478.54"
            - "AllocationRun.${run2_id}.included_source_count == 4"
            - "SourceAssessment.${sa_p1_id}.allocated_load_lbs_yr == 22604.38 (was 21888.00 under run 1)"
            - "SourceAssessment.${sa_p2_id}.allocated_load_lbs_yr == 5651.09 (was 5472.00 under run 1)"
            - "SourceAssessment.${sa_n1_id}.allocated_load_lbs_yr == 14127.74 (was 13680.00 under run 1)"
            - "SourceAssessment.${sa_n2_id}.allocated_load_lbs_yr == 4709.25 (was 4560.00 under run 1)"
            - "SourceAssessment.${sa_p1_id}.allocation_run_id == ${run2_id}"
            - "Watershed.${w_id}.reserve_pool_lbs == 2478.54"
            - "TmdlAssessment.${t_id}.allocation_variant == FINAL"

      - name: credit_delivery_proposed_vs_settled_variant_divergence
        grounds:
          - calculations.credit_transaction_delivery
          - calculations.credit_batch_serialization
          - entities.CreditBatch.fields.verified_ratio
          - entities.CreditTransaction.fields.proposed_delivered_lbs
          - entities.CreditTransaction.fields.settled_delivered_lbs
          - state_machines.PracticeProject.CERTIFIED_to_PENDING_REVERIFICATION
          - state_machines.CreditTransaction.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          The variant switch here is driven by TIME OF EVALUATION on one unchanged request
          row, not by a parent entity's status: the same CreditTransaction with
          requested_gross_lbs 500.00 records proposed_delivered_lbs 202.50 at proposal and
          settled_delivered_lbs 151.88 at approval, because a REVERIFICATION PARTIAL of
          60.00 of 80.00 acres dropped CreditBatch.verified_ratio to 0.7500 in between and
          the settled variant multiplies the gross by that ratio while the proposed variant
          ignores it entirely.
        test_recipe:
          setup:
            - "Watershed SCR ACTIVE (its TMDL is APPROVED), with R_OUT / R_MID / R_UP as in the base topology; uncertainty_ratio 2.0000, retirement_ratio 0.1000, equivalence_ratio 1.0000."
            - "Permit OH0012345 on the City WWTP point source (R_MID) with INTERIM limits: wla 21888.00, interim limit 23916.00, applicable limit 23916.00."
            - "The permittee has reported 25000.00 lbs for 2026, so compliance_status is SHORTFALL with compliance_gap_lbs 1084.00."
            - "PracticeProject PP-A on tract T-101 (COVER_CROP, R_UP, zone Z1, enrolled 100.00 acres, pre 950.50, post 300.00, vintage 2026) is CERTIFIED with verified_acres 80.00, producing CreditBatch A with gross_reduction 520.40, issued_lbs 520, available_lbs 520.00, verified_ratio 1.0000, and the batch is LISTED."
            - "A transaction for 500.00 gross lbs is PROPOSED against batch A, then a REVERIFICATION PARTIAL for 60.00 acres lowers the batch's verified_ratio before approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Pasture", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.3000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-PROVISIONAL", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
            - call: "POST /permits"
              payload: { watershed_id: "${w_id}", source_assessment_id: "${sa_p1_id}", permit_number: "OH0012345", permittee_user_id: "user-permittee-1", design_flow_mgd: 5.0000, effective_date: "2026-03-01", current_annual_load_lbs: 30000.00 }
              as: PermitWriter
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/derive-limits"
              payload: {}
              as: PermitWriter
            - call: "POST /permits/${permit_id}/annual-report"
              payload: { reported_annual_load_lbs: 25000.00, reporting_period_year: 2026 }
              as: Permittee
              as_user_id: "user-permittee-1"
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-101", practice_type: "COVER_CROP", enrolled_acres: 100.00, baseline_met: true, pre_load_lbs_yr: 950.50, post_load_lbs_yr: 300.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_a_id: $.data.id }
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "BASELINE", outcome: "PASS", narrative: "Baseline soil sampling complete on tract T-101." }
              as: PracticeVerifier
              as_user_id: "verifier-1"
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "IMPLEMENTATION", outcome: "PASS", narrative: "Cover crop stand confirmed on 80 acres.", verified_acres: 80.00 }
              as: PracticeVerifier
              as_user_id: "verifier-2"
            - call: "POST /practice-projects/${pp_a_id}/certify"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_id: $.data.id }
            - call: "POST /credit-batches/${batch_a_id}/list"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
            - call: "GET /credit-batches/${batch_a_id}"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_ver: $.data.version }
            - call: "POST /credit-transactions"
              payload: { credit_batch_id: "${batch_a_id}", permit_id: "${permit_id}", requested_gross_lbs: 500.00, reporting_period_year: 2026, expected_credit_batch_version: "${batch_a_ver}" }
              as: Permittee
              as_user_id: "user-permittee-1"
              captures: { txn_id: $.data.id, proposed_delivered: $.data.proposed_delivered_lbs }
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "REVERIFICATION", outcome: "PARTIAL", narrative: "Only 60 of the 80 verified acres still carry the practice.", verified_acres: 60.00 }
              as: PracticeVerifier
              as_user_id: "verifier-3"
          trigger:
            - call: "POST /credit-transactions/${txn_id}/approve"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
          assert:
            - "CreditBatch.${batch_a_id}.gross_reduction_lbs_yr == 520.40"
            - "CreditBatch.${batch_a_id}.issued_lbs == 520"
            - "CreditBatch.${batch_a_id}.residual_lbs == 0.40"
            - "CreditBatch.${batch_a_id}.verified_ratio == 0.7500"
            - "CreditTransaction.${txn_id}.delivery_ratio == 0.9000"
            - "CreditTransaction.${txn_id}.path_reach_count == 2"
            - "CreditTransaction.${txn_id}.proposed_delivered_lbs == 202.50"
            - "CreditTransaction.${txn_id}.tradable_lbs == 337.50"
            - "CreditTransaction.${txn_id}.settled_gross_lbs == 375.00"
            - "CreditTransaction.${txn_id}.settled_delivered_lbs == 151.88"
            - "CreditTransaction.${txn_id}.retired_to_reserve_lbs == 37.50"
            - "CreditTransaction.${txn_id}.applied_lbs == 151.88"
            - "CreditTransaction.${txn_id}.permit_gap_at_proposal_lbs == 1084.00"
            - "CreditTransaction.${txn_id}.status == APPROVED"
            - "CreditTransaction.${txn_id}.settled_delivered_lbs < CreditTransaction.${txn_id}.proposed_delivered_lbs"
            - "Permit.${permit_id}.credit_applied_lbs == 151.88"
            - "Permit.${permit_id}.compliance_gap_lbs == 932.12"
            - "Permit.${permit_id}.compliance_status == SHORTFALL"
            - "CreditBatch.${batch_a_id}.retired_lbs == 375.00"
            - "CreditBatch.${batch_a_id}.reserved_lbs == 0.00"
            - "CreditBatch.${batch_a_id}.available_lbs == 145.00"

  - rule_id: combinatorial_formula
    instances:
      - name: permit_limit_tier_relief_pinned_evaluation_order_across_three_tiers
        grounds:
          - calculations.permit_effluent_limit_derivation
          - entities.Permit.fields.required_reduction_pct
          - entities.Permit.fields.schedule_tier
          - entities.Permit.fields.interim_limit_lbs_yr
          - entities.Permit.fields.compliance_schedule_end_date
          - state_machines.Permit.DRAFT_LIMITS_to_INTERIM
        distinguishing_aspect: |
          The formula is combinatorial because five quantities interlock in a pinned order
          that LOOKS circular: required_reduction_pct is measured against the FINAL limit,
          the tier is selected from that percentage, the relief fraction and schedule length
          come from the tier, and only then does the interim limit exist. Three permits over
          the same two wasteload allocations sweep all three tiers from the same code path
          (27.04 -> TIER_B -> 23916.00, 8.80 -> TIER_A -> 5472.00, 90.88 -> TIER_C ->
          32736.00), so an implementation that derives the tier from an interim value, or
          applies relief before tier selection, gets every one of them wrong.
        test_recipe:
          setup:
            - "Watershed SCR with equivalence_ratio 1.0000; reaches R_OUT (COMPLIANCE_POINT, df 1.0000) and R_MID (MAINSTEM, df 0.9000 -> R_OUT) and R_UP (HEADWATER, df 0.8000 -> R_MID)."
            - "TmdlAssessment TMDL-P-2026 in DRAFT (LC 60000.00, MOS 0.1000, background 6000.00) with the four standard sources; a PRO_RATA_BY_EXISTING_LOAD run allocates 21888.00 to City WWTP and 5472.00 to Village WWTP."
            - "Three DRAFT_LIMITS permits all effective 2026-03-01: OH0012345 on City WWTP with current load 30000.00; OH0023456 on Village WWTP with current load 6000.00; OH0034567 on Village WWTP with current load 60000.00."
            - "The logical clock sits at 2026-06-15, inside every derived compliance schedule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
