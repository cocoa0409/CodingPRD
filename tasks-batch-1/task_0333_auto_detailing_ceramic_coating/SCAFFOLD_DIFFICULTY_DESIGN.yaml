scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: appointment_provisional_vs_final_total_diverges_on_lapse_and_skip
        grounds:
          - calculations.appointment_total
          - entities.Appointment.fields.provisional_total_cents
          - entities.Appointment.fields.final_total_cents
          - state_machines.Appointment.IN_SERVICE_to_READY
        distinguishing_aspect: >
          Dual-variant on the Appointment entity domain (pricing): provisional uses
          is_member_at_booking + all REQUESTED add-ons; final uses current membership
          (lapsed -> non-member) + only PERFORMED add-ons, so final 19100 != provisional 21260.
        test_recipe:
          setup:
            - "Catalog seeded (WASH/FULL/CERAMIC packages, SEDAN/SUV/TRUCK/XL rates, all 3 add-ons)."
            - "Customer with ACTIVE membership at booking; bay supports work."
            - "FULL/SUV SHOP appointment with ENGINE_BAY + PET_HAIR requested; member-at-booking true => provisional 21260."
            - "Membership lapses before completion; PET_HAIR add-on line set SKIPPED; AFTER photo attached."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SUV", size_multiplier_bps: 13000 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/addons"
              payload: { addon_code: "ENGINE_BAY", price_cents: 3500, extra_minutes: 15 }
              as: Scheduler
            - call: "POST /detailing/addons"
              payload: { addon_code: "PET_HAIR", price_cents: 4500, extra_minutes: 20 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "derek@x.com", full_name: "Derek M" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "B1", supports_ceramic: false }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SUV", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T09:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id, prov: $.data.provisional_total_cents }
            - call: "POST /detailing/appointments/${appt_id}/addons"
              payload: { addon_code: "ENGINE_BAY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/appointments/${appt_id}/addons"
              payload: { addon_code: "PET_HAIR" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "BEFORE", image_url: "s3://before.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/addons/PET_HAIR/set-line-status"
              payload: { line_status: "SKIPPED" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/addons/ENGINE_BAY/set-line-status"
              payload: { line_status: "PERFORMED" }
              as: Detailer
            - call: "POST /detailing/memberships/${mem_id}/mark-past-due"
              payload: {}
              as: Scheduler
            - call: "POST /detailing/memberships/${mem_id}/lapse"
              payload: {}
              as: Scheduler
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "AFTER", image_url: "s3://after.jpg" }
              as: Detailer
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/finish-service"
              payload: {}
              as: Detailer
              captures: { fin: $.data.final_total_cents }
          assert:
            - "Appointment.${appt_id}.provisional_total_cents == 21260"
            - "Appointment.${appt_id}.final_total_cents == 19100"
            - "Appointment.${appt_id}.work_status == READY"

      - name: customer_loyalty_chronological_vs_forward_tier_diverges
        grounds:
          - calculations.customer_loyalty_tier
          - entities.Customer.fields.chronological_lifetime_spend_cents
          - entities.Customer.fields.projected_lifetime_spend_cents
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: >
          Dual-variant on the Customer entity domain (loyalty scoring), a DIFFERENT domain
          from appointment_total: chronological counts only PAID spend (18000 -> BRONZE) while
          forward adds the provisional of an in-flight non-PAID appointment (50000) -> projected
          68000 -> SILVER band; the two variants place the customer in different tiers.
        test_recipe:
          setup:
            - "Catalog seeded; one FULL/TRUCK appointment fully paid+released (chronological 18000)."
            - "A second CERAMIC/SEDAN appointment still BOOKED+UNPAID (provisional 50000) raises projected to 68000."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "CERAMIC", base_price_cents: 50000, prep_minutes: 45, service_minutes: 240, cure_minutes: 1440, guarantee_days: 90 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "TRUCK", size_multiplier_bps: 15000 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "tess@x.com", full_name: "Tess L" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "M1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "TRUCK", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { paid_appt: $.data.id }
            - call: "POST /detailing/appointments/${paid_appt}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/photos"
              payload: { phase: "AFTER", image_url: "s3://a.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/finish-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${paid_appt}/pay"
              payload: { amount_cents: 18000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/appointments/${paid_appt}/release"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-20T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booked_appt: $.data.id }
          trigger:
            - call: "GET /detailing/customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { tier: $.data.loyalty_tier, chrono: $.data.chronological_lifetime_spend_cents, proj: $.data.projected_lifetime_spend_cents }
          assert:
            - "Customer.${cust_id}.chronological_lifetime_spend_cents == 18000"
            - "Customer.${cust_id}.projected_lifetime_spend_cents == 68000"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: appointment_total_nonlinear_tier_size_discount_addon_interaction
        grounds:
          - calculations.appointment_total
          - entities.Appointment.fields.provisional_total_cents
          - entities.VehicleSizeRate.fields.size_multiplier_bps
        distinguishing_aspect: >
          Mode (a) — non-linear interaction of >=3 inputs: tier base, size multiplier (round
          at step 1), conditional member discount (round at step 2), plus flat unscaled add-on
          sum; FULL/SUV member + ENGINE_BAY = 13260 + 3500 = 16760, not a linear scaling.
        test_recipe:
          setup:
            - "Catalog seeded; customer ACTIVE member; FULL/SUV SHOP appointment with ENGINE_BAY."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SUV", size_multiplier_bps: 13000 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/addons"
              payload: { addon_code: "ENGINE_BAY", price_cents: 3500, extra_minutes: 15 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "mae@x.com", full_name: "Mae R" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "B2", supports_ceramic: false }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SUV", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T10:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/addons"
              payload: { addon_code: "ENGINE_BAY" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Appointment.${appt_id}.provisional_total_cents == 16760"

      - name: membership_credit_circular_dependency_evaluation_order_pinned
        grounds:
          - calculations.appointment_total
          - calculations.payment_ledger
          - entities.Appointment.fields.credit_applied_cents
          - entities.Appointment.fields.outstanding_balance_cents
        distinguishing_aspect: >
          Mode (c) — circular-looking dependency with pinned order: credit_applied = min(wash_credit_value,
          pkg_net) where pkg_net depends on the member discount; provisional reports BEFORE credit (10200)
          while outstanding nets the credit (10200 - 3400 = 6800), a DIFFERENT mode from the (a) instance above.
        test_recipe:
          setup:
            - "Customer ACTIVE member (default SEDAN, wash_credit_value 3400, 1 credit)."
            - "FULL/SEDAN SHOP appointment booked WITH use_membership_credit -> credit consumed, credit_applied 3400."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "ivy@x.com", full_name: "Ivy K" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { credit_val: $.data.wash_credit_value_cents }
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "B3", supports_ceramic: false }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T10:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}", use_membership_credit: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          assert:
            - "Membership.${mem_id}.wash_credit_value_cents == 3400"
            - "Appointment.${appt_id}.provisional_total_cents == 10200"
            - "Appointment.${appt_id}.credit_applied_cents == 3400"
            - "Appointment.${appt_id}.outstanding_balance_cents == 6800"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_parallel_work_and_payment_dimensions_evolve_independently
        grounds:
          - state_machines.Appointment.UNPAID_to_DEPOSIT_HELD
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - entities.Appointment.fields.work_status
          - entities.Appointment.fields.payment_status
        distinguishing_aspect: >
          Parallel state dimensions on the Appointment entity: capturing a deposit advances
          payment_status UNPAID->DEPOSIT_HELD while work_status stays BOOKED, proving the two
          axes move independently on one row.
        test_recipe:
          setup:
            - "Catalog seeded; CERAMIC/SEDAN SHOP appointment booked (provisional 50000, deposit 10000)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "CERAMIC", base_price_cents: 50000, prep_minutes: 45, service_minutes: 240, cure_minutes: 1440, guarantee_days: 90 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "ned@x.com", full_name: "Ned P" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "B4", supports_ceramic: true }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T09:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/capture-deposit"
              payload: { deposit_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Appointment.${appt_id}.payment_status == DEPOSIT_HELD"
            - "Appointment.${appt_id}.work_status == BOOKED"
            - "Appointment.${appt_id}.amount_charged_cents == 10000"
            - "Appointment.${appt_id}.outstanding_balance_cents == 40000"

      - name: membership_cyclic_renew_loops_active_to_active
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Membership.fields.cycle_start_utc
          - entities.Membership.fields.credits_granted_total
        distinguishing_aspect: >
          Cyclic shape on the Membership entity (a DIFFERENT entity from the parallel
          Appointment machine): renew loops ACTIVE->ACTIVE, advancing cycle_start_utc by 30 days
          and granting a second credit (credits_granted_total 2).
        test_recipe:
          setup:
            - "Customer with ACTIVE membership activated at 2026-06-01T00:00:00Z (credits_granted_total 1)."
            - "Clock advanced to 2026-07-01T00:00:00Z (>= cycle_start + 30 days) so renew is eligible."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "owen@x.com", full_name: "Owen S" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /detailing/memberships/${mem_id}/renew"
              payload: {}
              as: Scheduler
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.credits_granted_total == 2"
            - "Membership.${mem_id}.cycle_start_utc == 2026-07-01T00:00:00Z"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rework_approve_spawns_appointment_then_forces_paid_depth3
        grounds:
          - state_machines.ReworkClaim.SUBMITTED_to_APPROVED
          - entities.Appointment.fields.spawned_from_rework_claim_id
          - entities.Appointment.fields.payment_status
          - entities.ReworkClaim.fields.rework_appointment_id
        distinguishing_aspect: >
          Depth-3 cascade from the rework-approve trigger: approve (A) mutates the claim and
          CREATES a new Appointment (B); that creation itself forces the spawned Appointment's
          payment_status PAID with outstanding 0 (C); each hop caused by the prior, not by approve directly.
        test_recipe:
          setup:
            - "A CERAMIC/SEDAN SHOP appointment fully completed+paid+RELEASED at 2026-03-02T12:45:00Z."
            - "A rework claim filed within the 90-day window (clock 2026-03-10)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "CERAMIC", base_price_cents: 50000, prep_minutes: 45, service_minutes: 240, cure_minutes: 1440, guarantee_days: 90 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "pam@x.com", full_name: "Pam T" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "B5", supports_ceramic: true }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-03-01T08:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { orig_appt: $.data.id }
            - call: "POST /detailing/appointments/${orig_appt}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${orig_appt}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${orig_appt}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${orig_appt}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${orig_appt}/photos"
              payload: { phase: "AFTER", image_url: "s3://a.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${orig_appt}/finish-service"
              payload: {}
