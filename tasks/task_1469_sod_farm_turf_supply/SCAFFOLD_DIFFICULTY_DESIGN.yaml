  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: confirm_cutoff_exactly_at_deadline
        grounds:
          - calculations.confirm_cutoff
          - endpoints.confirm
        distinguishing_aspect: |
          Metric = TIME. Cutoff comparison is strict (<): confirm at exactly
          2026-08-02T14:00:00Z (the cutoff second) fails ERR_CUTOFF_PASSED, while
          one second earlier (13:59:59) succeeds. Reached via POST
          /orders/{id}/confirm.
        test_recipe:
          setup:
            - "Two identical PLACED orders (10 PREMIUM pallets each, zone split z2=10) created at 2026-08-01T09:00 for delivery 2026-08-03 -> cutoff 2026-08-02T14:00:00Z; field with two PENDING batches of 10 PREMIUM pallets scheduled 2026-08-03"
