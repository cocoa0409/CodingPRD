              as: Customer
              as_user_id: "${cust_id}"
              captures: { b2: $.data.id }
            - call: "POST /opaque/opaque-bids/${b2}/evaluate"
              payload: { expected_customer_version: "${cv1}" }
              as: PlatformAdmin
            - call: "GET /opaque/customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cv2: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB7", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
