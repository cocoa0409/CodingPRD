          - validations.priority_50_ERR_RESERVE_BELOW_FLOOR
        excluded_because:
          difficulty_instance: select_structure_deal_state_error_precedes_reserve_floor_error
          rationale: "That §1.8 instance builds a single request that violates both rules at once - a deal still in DILIGENCE whose latest DILIGENCE_ADJUSTED assessment is below RESERVE_FLOOR_MONTHS - asserts the 409 wins, then closes diligence and shows the same request now surfacing the 422, which is the complete priority-conflict claim."

