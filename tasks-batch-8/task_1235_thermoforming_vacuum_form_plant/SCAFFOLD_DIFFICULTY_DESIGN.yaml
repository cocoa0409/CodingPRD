            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-RV", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "ORV", part_number: "P-RV", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /tools/${tool_id}/revise", as: ToolingEngineer }
          trigger:
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched: $.data.schedule_status } }
          assert:
            - "error_id == ERR_TOOL_NOT_QUALIFIED (captured ${err}) — fresh OCC version and full coverage do not rescue a stage against an UNDER_REVISION tool"
            - "ProductionOrder.${order_id}.schedule_status == QUEUED (captured ${sched}) — no transition occurred"
      - name: pack_task_blocked_by_rejected_packaging_spec
        grounds:
          - state_machines.AssemblyTask.PENDING_to_COMPLETED
          - state_machines.PackagingSpec.PENDING_APPROVAL_to_REJECTED
          - errors[ERR_PACK_SPEC_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair AssemblyTask -> PackagingSpec (distinct from the
          order->tool pair): a PACK task may not complete when the order's
          packaging spec has transitioned to REJECTED, even though the order is
          COMPLETED and quality RELEASED (all order-local gates pass).
        test_recipe:
          setup:
            - "CUSTOM spec PS-C (INDUSTRIAL) created PENDING_APPROVAL; order O-P created referencing it (legal while PENDING_APPROVAL), then spec REJECTED by PlantManager"
            - "Order fully run to COMPLETED with quality RELEASED; TRIM task (seq 1) COMPLETED; PACK task (seq 2) PENDING"
          setup_api_calls:
            - { call: "POST /packaging-specs", payload: { spec_code: "PS-C", spec_type: CUSTOM, cleanliness_grade: INDUSTRIAL, per_pack_cost: 1.10 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /material-lots", payload: { lot_code: "LP", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
