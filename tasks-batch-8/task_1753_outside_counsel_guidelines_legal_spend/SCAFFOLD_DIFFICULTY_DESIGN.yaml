              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_a}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
