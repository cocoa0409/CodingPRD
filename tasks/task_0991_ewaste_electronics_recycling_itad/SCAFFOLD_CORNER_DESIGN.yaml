      - name: close_with_unpaid_settlement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_CLOSE_SETTLEMENT_UNPAID]"]
        distinguishing_aspect: "Close requires every non-SUPERSEDED settlement PAID or VOIDED; a FINALIZED-but-unpaid settlement blocks close."
