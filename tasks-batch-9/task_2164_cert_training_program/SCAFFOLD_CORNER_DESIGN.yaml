      - name: instructor_booked_in_two_overlapping_rooms_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=42]
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Instructor-overlap claim: two genuinely intersecting half-open intervals for the same instructor are refused with ERR_INSTRUCTOR_DOUBLE_BOOKED even when the rooms differ, isolating the instructor rule from the facility buffer rule.
        test_recipe:
          setup:
            - "Session A for CERT-101 runs 2026-08-03T09:00:00Z to 11:30:00Z in EOC-A with Ines Ruiz"
            - "A second facility ANX-B exists so the facility buffer rule cannot fire"
            - "Ines Ruiz has max_daily_contact_hours 8.0 so the day cap cannot fire on 2.5 + 2.5 hours"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
