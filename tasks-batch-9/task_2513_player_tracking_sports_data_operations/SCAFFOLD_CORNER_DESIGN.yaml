              captures: { p1: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { gv1: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "SHOT", clock_ms: 60000, confidence: 0.9, expected_game_version: "${gv1}" }
              as: Statistician
              as_user_id: "stat-01"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "PASS", clock_ms: 70000, confidence: 0.8, expected_game_version: "${gv1}" }
              as: Statistician
              as_user_id: "stat-02"
              captures: { e_stale: $.data.error_id }
            - call: "GET /games/${g_id}"
              as: Statistician
              as_user_id: "stat-02"
              captures: { gv2: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "PASS", clock_ms: 70000, confidence: 0.8, expected_game_version: "${gv2}" }
              as: Statistician
              as_user_id: "stat-02"
              captures: { t2: $.data.id }
          assert:
            - "the first tag carries game_version_at_tag == 3 and the game reads version 3 (create 1 -> open-collection 2 -> tag 3)"
            - "call 1: HTTP 412 error_id \"ERR_STALE_GAME_VERSION\"; GET /games/${g_id} still shows version 3, draft_tag_count 1, total_tag_count 1"
            - "call 2: HTTP 200 with data.version == 3 (${gv2}) - the failed write did not bump the counter"
            - "call 3: HTTP 201 with data.game_version_at_tag == 4 and data.review_status \"DRAFT\""
            - "GET /games/${g_id} shows version 4, draft_tag_count 2, total_tag_count 2, quality_index 0.0000 (no scored tags yet)"

      - name: third_sla_breach_on_one_session_suspends_it_at_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.feed_session_billing.constants.SLA_BREACH_SUSPEND_THRESHOLD
          - entities.FeedSession.fields.sla_breach_count
          - entities.DataLicensee.fields.sla_credit_cents
          - state_machines.FeedSession
        distinguishing_aspect: |
          The suspension trigger is cumulative and fires exactly at the third breach on the same session,
          not the second and not the fourth: after two breaching records the session is still ACTIVE with
          halt_reason null, and the third flips it to SUSPENDED with halt_reason SLA_BREACH_THRESHOLD while
          the credit ledger accumulates 3 x 165 = 495 cents and the reservation stays held.
        test_recipe:
          setup:
            - "Harbor Arena CERTIFIED; game LIVE; GOLD licensee granted_units 5000"
            - "ACTIVE COMMERCIAL_LICENSE window 18:00-21:00 with max_latency_ms 400"
            - "ACTIVE REALTIME session 18:00-18:30 at 20 mbps / 250 ms with reserved_units 900"
