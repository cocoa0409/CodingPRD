              as_user_id: "u_res_1"
            - call: "GET /studies/${study_id}"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
          assert:
            - "Recruitment.${r1_id}.screen_score == 0.00 and status == SCREENED_OUT - X9 is a disqualifying answer, so the 40.00 segment and 20.00 locale points are never added"
            - "Recruitment.${r2_id}.screen_score == 55.00 and status == SCREENED_OUT: 40.00 segment + 0.00 locale (de-DE) + 15.00 for one target hit, one point band under SCREEN_IN_MIN 60.00"
            - "Recruitment.${r3_id}.screen_score == 90.00 and status == SCREENED_IN: 40.00 + 20.00 + min(40.00, 2 hits x 15.00) == 30.00; the non-target answer A7 adds nothing"
            - "The study read shows screened_in_count == 1, invited_count == 3 and recruitment_status still RECRUITING"
            - "All three recruitments still have incentive_state == RESERVED and reserved_cents == 5000 - screening moves no money, not even for the screened-out rows"
      - name: method_recommendation_maps_each_question_type
        claim_type: Constants Applied
        grounds:
          - calculations.method_recommendation
          - endpoints[POST /research-requests/{id}/triage]
        distinguishing_aspect: "Every METHOD_TABLE row is exercised plus the single override branch: a MEASUREMENT question over 4000 impacted users is recommended INTERVIEW because the audience is under SURVEY_MIN_AUDIENCE, while the same question type over 5000 users stays SURVEY - and an explicit method_override beats the recommendation without changing it."
        test_recipe:
          setup:
            - "Decision D1 with 4000 impacted users and decision D2 with exactly 5000, both REVERSIBLE with deadline 2026-10-01"
            - "Five SUBMITTED requests on D1 and one on D2, all with evidence_gap PARTIAL"
