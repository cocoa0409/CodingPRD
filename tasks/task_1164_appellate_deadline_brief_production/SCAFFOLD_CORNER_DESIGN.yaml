              as: Attorney
              as_user_id: "${att_occ}"
              captures: { case_occ: $.data.id, case_occ_v: "$.data.version" }
            - call: "POST /appellate/cases/${case_occ}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_occ}"
              captures: { f_occ: $.data.id }
            - call: "POST /appellate/filings/${f_occ}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_occ}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${att_occ}"
              captures: { sched_occ: "$.data[0].id" }
          trigger:
            # Use stale case version (case_occ_v is pre-filing; filing accept bumped it)
