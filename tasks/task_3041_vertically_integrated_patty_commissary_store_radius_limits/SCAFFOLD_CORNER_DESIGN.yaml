# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3041_vertically_integrated_patty_commissary_store_radius_limits
#
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Shared setup fact: the logical clock defaults to 2026-09-01T00:00:00Z
# (Tuesday) at server start; chains that need another position set it first.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: supplier_create_returns_defaults_and_probation_status
        claim_type: Creation
        grounds:
          - entities.BeefSupplier
          - endpoints.POST_/v1/suppliers
        distinguishing_aspect: "A supplier created with the three required inputs comes back 201 with status PROBATION, days_since_last_passed_audit 0, version 1, and server-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
          trigger:
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-C1", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "BeefSupplier.${sup_id}.status == PROBATION"
            - "BeefSupplier.${sup_id}.days_since_last_passed_audit == 0"
            - "BeefSupplier.${sup_id}.version == 1"
            - "the response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: menu_item_get_round_trips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.MenuItem
          - endpoints.GET_/v1/menu-items/{id}
        distinguishing_aspect: "Every MenuItem field round-trips through GET exactly as posted, including the default active=true that was never supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One menu item created without the active flag."]
          setup_api_calls:
            - call: "POST /v1/menu-items"
              payload: { sku: "GR-CHZ", name: "Grilled Cheese", base_price_cents: 295, patty_count: 0, produce_units: 1 }
              as: SupplyChainDirector
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /v1/menu-items/${item_id}"
              payload: {}
              as: CommissaryPlanner
          assert:
            - "MenuItem.${item_id}.sku == \"GR-CHZ\" and base_price_cents == 295"
            - "MenuItem.${item_id}.patty_count == 0 and produce_units == 1"
            - "MenuItem.${item_id}.active == true (default applied)"

      - name: stores_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/stores
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three stores on one commissary, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "OPERATIONAL commissary; three stores created against it (each create bumps Commissary.version, so OCC versions are chained)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-C3", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "C3 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { v1: $.data.version }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Store A", lat: 34.01, lng: -118.01, expected_commissary_version: "${v1}" }
              as: RealEstatePlanner
            - call: "GET /v1/commissaries/${com_id}"
              payload: {}
              as: SupplyChainDirector
              captures: { v2: $.data.version }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Store B", lat: 34.02, lng: -118.02, expected_commissary_version: "${v2}" }
              as: RealEstatePlanner
            - call: "GET /v1/commissaries/${com_id}"
              payload: {}
              as: SupplyChainDirector
              captures: { v3: $.data.version }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Store C", lat: 34.03, lng: -118.03, expected_commissary_version: "${v3}" }
              as: RealEstatePlanner
          trigger:
            - call: "GET /v1/stores"
              payload: { commissary_id: "${com_id}", limit: 2, offset: 0 }
              as: SupplyChainDirector
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /v1/stores?commissary_id=${com_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: truck_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/v1/trucks/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated truck id produces 404 ERR_NOT_FOUND, not a 400 and not a generic 500."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. No trucks exist."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
          trigger:
            - call: "GET /v1/trucks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CommissaryPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and ${err_id} == ERR_NOT_FOUND"

      - name: store_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/v1/stores
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required lng field on store creation yields 400 ERR_INVALID_REQUEST before any business rule runs (the payload is rejected at shape validation even though expected_commissary_version is present)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. An OPERATIONAL commissary exists so the request reaches shape validation with a real parent version."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-C5", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "C5 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { com_v: $.data.version }
          trigger:
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "No Lng Store", lat: 34.01, expected_commissary_version: "${com_v}" }
              as: RealEstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST (missing lng)"

      - name: order_unknown_modifier_code_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A modifier code outside the unlisted variation set {EXTRA_PATTY, ANIMAL_STYLE, PROTEIN_STYLE, WELL_DONE} is rejected at request-shape validation with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
          trigger:
            - call: "POST /v1/stores/00000000-0000-0000-0000-000000000000/orders"
              payload: { placed_by_associate_id: "00000000-0000-0000-0000-000000000001", lines: [{ menu_item_id: "00000000-0000-0000-0000-000000000002", qty: 1, modifier_codes: ["ANIMAL_STYLE", "SUPER_SIZE_ME"] }] }
              as: Associate
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 4xx with ${err_id} in {ERR_INVALID_REQUEST, ERR_NOT_FOUND} — modifier-code validation (priority 6) runs before FK existence (priority 5) only if the implementation orders shape first; the pinned scaffold order is existence (5) then shape (6), so ${err_id} == ERR_NOT_FOUND for the unknown store id"
            - "the response status is 404 and ${err_id} == ERR_NOT_FOUND"

      - name: commissary_stale_version_on_store_create_returns_412
        claim_type: Computed Fields
        grounds:
          - concurrency_rules[store-create-stale-commissary]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC: a store create carrying the commissary version from before an intervening capacity PATCH is rejected 412 ERR_STALE_VERSION; the same payload with the fresh version succeeds."
        test_recipe:
          setup:
            - "OPERATIONAL commissary; client captured version V, then a PATCH bumped it to V+1."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-C7", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "C7 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { com_v_stale: $.data.version }
            - call: "POST /v1/commissaries/${com_id}/recertify"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { com_v_fresh: $.data.version }
          trigger:
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Stale Store", lat: 34.01, lng: -118.01, expected_commissary_version: "${com_v_stale}" }
              as: RealEstatePlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Fresh Store", lat: 34.01, lng: -118.01, expected_commissary_version: "${com_v_fresh}" }
              as: RealEstatePlanner
              captures: { fresh_store_id: $.data.id }
          assert:
            - "the first create returns 412 with ${err_id} == ERR_STALE_VERSION"
            - "the second create succeeds 201 with Store.${fresh_store_id}.status == SITE_REVIEW"

      - name: audit_immutable_after_recording
        claim_type: Immutability
        grounds:
          - state_machines.Audit
          - errors.ERR_AUDIT_ALREADY_RECORDED
        distinguishing_aspect: "A RECORDED audit cannot be re-recorded or cancelled; both attempts return 409 ERR_AUDIT_ALREADY_RECORDED and leave the stored result untouched."
        test_recipe:
          setup: ["Supplier PROBATION with one RECORDED (PASS) audit."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-C8", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
          trigger:
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "FAIL" }
              as: QualityAuditor
              captures: { err1: $.data.error_id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/cancel"
              payload: {}
              as: QualityAuditor
              captures: { err2: $.data.error_id }
          assert:
            - "both attempts return 409; ${err1} == ERR_AUDIT_ALREADY_RECORDED and ${err2} == ERR_AUDIT_ALREADY_RECORDED"
            - "Audit.${aud_id}.result == PASS (untouched)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: serve_terminal_order_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order
          - errors.ERR_ORDER_INVALID_STATE
        distinguishing_aspect: "From terminal SERVED, a second serve must fail with 409 ERR_ORDER_INVALID_STATE and no side effects fire (no queue or inventory change)."
        test_recipe:
          setup: ["An order that has already been SERVED at an OPEN store."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-SM1", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "SM1 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
              captures: { com_v: $.data.version }
            - call: "POST /v1/stores"
              payload: { commissary_id: "${com_id}", name: "Store SM1", lat: 34.01, lng: -118.01, expected_commissary_version: "${com_v}" }
              as: RealEstatePlanner
              captures: { store_id: $.data.id }
            - call: "POST /v1/associates"
              payload: { full_name: "Mgr SM1", hired_date: "2024-01-01T00:00:00Z", home_store_id: "${store_id}" }
              as: HRDirector
              captures: { mgr_id: $.data.id }
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/stores/${store_id}/shifts"
              payload: { associate_id: "${mgr_id}", shift_start: "2026-09-01T16:00:00Z", shift_end: "2026-09-02T00:00:00Z" }
              as: HRDirector
            - call: "POST /v1/stores/${store_id}/shifts"
              payload: { associate_id: "${mgr_id}", shift_start: "2026-09-02T16:00:00Z", shift_end: "2026-09-03T00:00:00Z" }
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/associates/${mgr_id}/promote"
              payload: {}
              as: HRDirector
            - call: "POST /v1/manager-postings"
              payload: { store_id: "${store_id}" }
              as: HRDirector
              as_user_id: "hr-poster-sm1"
              captures: { posting_id: $.data.id }
            - call: "POST /v1/manager-postings/${posting_id}/applications"
              payload: { candidate_associate_id: "${mgr_id}" }
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/manager-postings/${posting_id}/close"
              payload: { candidate_application_id: "${app_id}" }
              as: HRDirector
              as_user_id: "hr-closer-sm1"
            - call: "POST /v1/stores/${store_id}/approve"
              payload: {}
              as: RealEstatePlanner
            - call: "POST /v1/stores/${store_id}/open"
              payload: {}
              as: RealEstatePlanner
              captures: { store_v_open: $.data.version }
            - call: "POST /v1/menu-items"
              payload: { sku: "HAMB", name: "Hamburger", base_price_cents: 350, patty_count: 1, produce_units: 1 }
              as: SupplyChainDirector
              captures: { item_id: $.data.id }
            - call: "POST /v1/batches"
              payload: { store_id: "${store_id}", delivery_date: "2026-09-02T00:00:00Z", patty_count: 100, bun_count: 60, produce_units: 60, expected_store_version: "${store_v_open}" }
              as: CommissaryPlanner
              captures: { batch_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/production-runs"
              payload: { run_date: "2026-09-01T00:00:00Z", patties_planned: 100, buns_planned: 60, produce_units_planned: 60 }
              as: CommissaryPlanner
              captures: { run_id: $.data.id }
            - call: "POST /v1/production-runs/${run_id}/complete"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/commissaries/${com_id}/trucks"
              payload: { plate: "TRK-SM1", route_type: "PRIMARY", cooler_capacity_cases: 30 }
              as: CommissaryPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { commissary_id: "${com_id}", truck_id: "${truck_id}", service_date: "2026-09-02T00:00:00Z", store_ids: ["${store_id}"] }
              as: CommissaryPlanner
              captures: { route_id: $.data.id }
            - call: "POST /v1/batches/${batch_id}/load"
              payload: { production_run_id: "${run_id}", route_id: "${route_id}" }
              as: CommissaryPlanner
            - call: "POST /v1/routes/${route_id}/finalize"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/batches/${batch_id}/deliver"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/stores/${store_id}/orders"
              payload: { placed_by_associate_id: "${mgr_id}", lines: [{ menu_item_id: "${item_id}", qty: 1, modifier_codes: [] }] }
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { order_id: $.data.id }
            - call: "POST /v1/orders/${order_id}/serve"
              payload: {}
              as: Associate
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /v1/orders/${order_id}/serve"
              payload: {}
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_id} == ERR_ORDER_INVALID_STATE"
            - "Order.${order_id}.status == SERVED (unchanged)"

      - name: begin_surge_twice_returns_surge_already_active
        claim_type: invalid_transition
        grounds:
          - state_machines.Store
          - errors.ERR_SURGE_ALREADY_ACTIVE
        distinguishing_aspect: "begin-opening-surge on a store already in OPENING_SURGE fails with 409 ERR_SURGE_ALREADY_ACTIVE; surge dates from the first call are not moved."
        test_recipe:
          setup: ["OPEN store whose manager already began an opening surge on 2026-09-01."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
