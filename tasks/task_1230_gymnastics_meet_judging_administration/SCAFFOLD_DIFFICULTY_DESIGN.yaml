              captures: { inq_state: $.data.inquiry_state, inq_v_final: $.data.version }
          assert:
            - "Inquiry.${inq_id}.inquiry_state == FILED after two FILED<->UNDER_REVIEW loops"
            - "Inquiry.${inq_id}.version == 5 (1 create + 2 begin-review + 2 return-to-queue)"

      - name: score_parallel_publication_and_inquiry_dimensions
        grounds:
          - state_machines.Score
          - state_machines.Inquiry
        distinguishing_aspect: |
          Entity = Score. Branching fork-join shape: PUBLISHED -> UNDER_INQUIRY
          -> {INQUIRY_RESOLVED, back to PUBLISHED via WITHDRAWN/EXPIRED}. The
          UNDER_INQUIRY -> PUBLISHED branch restores pre-inquiry state
          (deltas NOT applied), while UNDER_INQUIRY -> INQUIRY_RESOLVED keeps
          deltas. Divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two scores SC1 and SC2 both PUBLISHED with identical inputs (D=5.0, E=8.0, ND=0.0)"
            - "Coach files inquiry on both; SC1's inquiry is WITHDRAWN (returns to PUBLISHED); SC2's inquiry is resolved UPHELD with d_score_delta=+0.2 (moves to INQUIRY_RESOLVED then FINAL)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
