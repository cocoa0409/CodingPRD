              as: Consumer
              as_user_id: "${con1_id}"
              captures: { clm_a_id: $.data.id }
            - call: "POST /licensing/recovery-fund-claims"
              payload: { fund_account_id: "${fund_id}", complaint_id: "${cmp2_id}", basis: "COURT_JUDGMENT", claimed_amount_cents: 400000, judgment_amount_cents: 450000, judgment_docket_number: "CV-2026-202", judgment_entered_on: "2026-09-05" }
              as: Consumer
              as_user_id: "${con2_id}"
              captures: { clm_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-04T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/recovery-fund-claims/${clm_a_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: FundAdjudicator
            - call: "POST /licensing/recovery-fund-claims/${clm_b_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: FundAdjudicator
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: FundAdjudicator
              captures: { fund_ver: $.data.version }
          trigger:
            - call: "POST /licensing/recovery-fund-claims/${clm_a_id}/pay"
              payload: { expected_fund_account_version: "${fund_ver}" }
              as: FundAdjudicator
          assert:
