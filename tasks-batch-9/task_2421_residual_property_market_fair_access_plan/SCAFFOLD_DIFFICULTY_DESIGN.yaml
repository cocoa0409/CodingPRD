      - name: member_assessment_liability_reverts_to_zero_when_event_is_cancelled
        grounds:
          - state_machines.AssessmentEvent.ALLOCATED_to_CANCELLED
          - state_machines.AssessmentAllocation.PENDING_to_ABATED
          - entities.MemberInsurer.fields.cumulative_assessed_cents
          - entities.AssessmentEvent.fields.allocated_total_cents
          - calculations.assessment_allocation_shares
        distinguishing_aspect: |
          Conserved quantity: ASSESSMENT LIABILITY across THREE MemberInsurer rows at once, and the
          compensation works by a status change (PENDING -> ABATED) rather than by a paired return field:
          the abated allocation rows are still present and still carry their gross/net amounts, but they
          must drop out of every member's cumulative_assessed_cents and out of the event's
          allocated_total_cents (which is forced to 0). An implementation that recomputes the aggregate
          over all allocations instead of non-ABATED ones leaves 30000000 / 30000000 / 40000001 in place.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers M1 (30.00 / 10.00), M2 (30.00 / 10.00), M3 (40.00 / 80.00), each with cumulative_assessed_cents 0 and takeout_credit_count 0."
            - "One HURRICANE zone; one AssessmentEvent with trigger_loss_cents 200000001 and reserve_balance_cents_at_trigger 100000000, so assessable_amount_cents is 100000001, allocation_basis MARKET_SHARE."
            - "The allocation run has produced gross shares 30000000 / 30000000 / 40000001 (the +1 remainder absorbed by the greatest-weight member M3) with no credits, so cumulative_assessed_cents is 30000000 / 30000000 / 40000001."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-03", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000001, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v}" }
              as: PlanAdmin
            - call: "GET /fair-plan/member-insurers/${m3_id}"
              payload: {}
              as: PlanAdmin
              captures: { m3_assessed_after_run: $.data.cumulative_assessed_cents }
          trigger:
            - call: "POST /fair-plan/assessment-events/${ev_id}/cancellation"
              payload: { reason: "loss estimate revised below reserves" }
              as: PlanAdmin
          assert:
            - "${m3_assessed_after_run} == 40000001"
            - "AssessmentEvent.${ev_id}.status == CANCELLED"
            - "AssessmentEvent.${ev_id}.assessable_amount_cents == 100000001"
            - "AssessmentEvent.${ev_id}.allocated_total_cents == 0"
            - "AssessmentEvent.${ev_id}.cancellation_reason == loss estimate revised below reserves"
            - "count(AssessmentAllocation where assessment_event_id == ${ev_id} and status == ABATED) == 3"
            - "count(AssessmentAllocation where assessment_event_id == ${ev_id} and status == PENDING) == 0"
            - "AssessmentAllocation for ${m3_id}.gross_share_cents == 40000001 (row retained, not deleted)"
            - "MemberInsurer.${m1_id}.cumulative_assessed_cents == 0"
            - "MemberInsurer.${m2_id}.cumulative_assessed_cents == 0"
            - "MemberInsurer.${m3_id}.cumulative_assessed_cents == 0"
            - "MemberInsurer.${m3_id}.takeout_credit_count == 0"
