              as: MoldingOperator
              as_user_id: ""
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the header-less read returns status 401 with data.error_id 'ERR_MISSING_AUTH_HEADERS'"
            - "the blank X-User-ID read returns status 401 with data.error_id 'ERR_MISSING_AUTH_HEADERS' — a present-but-empty identity is not an identity"
            - "the unknown role string returns status 401 with data.error_id 'ERR_INVALID_ROLE', not 403: an unrecognised role is an authentication failure at priority 2, not a permission failure at priority 3"
            - "the header-less read of a nonexistent model id returns 401 'ERR_MISSING_AUTH_HEADERS', NOT 404 'ERR_PRODUCT_MODEL_NOT_FOUND'"
            - "the header-less create returns 401 and GET /product-models (as PlantAdmin) still returns total_count 1 — PM-CD-H1 was never created"
            - "the blank-identity mould create returns 401 'ERR_MISSING_AUTH_HEADERS', NOT 403 'ERR_ROLE_NOT_PERMITTED', even though MoldingOperator is not permitted to register a mould: priority 1 precedes priority 3"
            - "GET /molds returns total_count 0 after that refusal"
            - "the final fully-headed read returns 200 with response_type 'object' and data.id == ${pm}, proving the four refusals were caused by the headers alone"

      # SCAFFOLD GAP (reported, not silently dropped): ERR_SEGREGATION_OF_DUTIES
      # (403, §1.4 priority 57) is STRUCTURALLY UNREACHABLE. The inspect gate
      # forbids the acting inspector from being the cycle's
      # operator_technician_id or the hull's outfitted_by_technician_id, but
      # priority 5 forces the operator's Technician.role_code to be
      # MOLDING_OPERATOR and the outfitter's to be ASSEMBLY_TECH, a Technician
      # row carries exactly one role_code, and §1.5 exposes no PATCH
      # /technicians, so a QUALITY_INSPECTOR-coded technician can never appear in
      # either field. This instance asserts the maximal reachable near-miss: both
      # attempts to make the inspector the operator or the outfitter are refused
      # by priority 5 instead, and a second inspector is accepted.
      - name: rbac_role_code_identity_shadows_the_segregation_of_duties_gate
        claim_type: "Segregation of duties"
        grounds:
          - roles.QualityInspector.description
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_ROLE_IDENTITY_MISMATCH
          - validations.priority_5
          - validations.priority_57
        distinguishing_aspect: |
          The plant's compliance rule is enforced one gate EARLIER than its own
          error code: making the QUALITY_INSPECTOR technician the cycle operator
          or the hull outfitter is refused 403 ERR_ROLE_IDENTITY_MISMATCH by
          priority 5, so ERR_SEGREGATION_OF_DUTIES can never be provoked, while a
          second, independent QUALITY_INSPECTOR technician inspects the same hull
          successfully.
