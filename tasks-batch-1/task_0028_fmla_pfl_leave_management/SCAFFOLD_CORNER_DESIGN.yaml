      - name: error_stale_version_on_employee_health_enrollment
        claim_type: violation_to_error
        grounds: ["concurrency_rules[employee-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: |
          PATCH /leave/employees/{id}/health-enrollment with a stale
          expected_employee_version returns ERR_STALE_VERSION (412).
          Different OCC parent (Employee) from the LeaveCase OCC.
        test_recipe:
          setup:
            - "Employee exists with version=1 after creation."
            - "First PATCH bumps version to 2."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "OCC Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { e_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${e_id}", email: "occ@x.com", full_name: "OCC", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { w_id: $.data.id, w_v0: $.data.version }
            - call: "PATCH /leave/employees/${w_id}/health-enrollment"
              payload: { health_plan_enrolled: false, expected_employee_version: "${w_v0}" }
              as: HRAdmin
              captures: { w_after_p1: $.data }
          trigger:
            - call: "PATCH /leave/employees/${w_id}/health-enrollment"
              payload: { health_plan_enrolled: true, expected_employee_version: "${w_v0}" }
              as: HRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "w_after_p1.version == 2 (first PATCH bumped version)"
            - "HTTP status == 412"
            - "err == ERR_STALE_VERSION (second PATCH carrying stale w_v0=1 is rejected)"

