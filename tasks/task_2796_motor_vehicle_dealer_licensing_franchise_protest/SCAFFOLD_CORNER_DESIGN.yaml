              as: Dealer
              as_user_id: "${dlr_l1_id}"
              captures: { pro_l1_id: $.data.id }
          assert:
            - "the amendment advanced the version: ${fil_l1_v_fresh} == ${fil_l1_v_stale} + 1, amendment_count == 1, notice_served_on == 2026-09-10 and protest_window_ends_on == 2026-10-10"
            - "trigger 1: HTTP 412 with error_id ERR_STALE_FILING_VERSION and no Protest row created"
