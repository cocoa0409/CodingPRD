            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 50000.00, baseline_units: 20000, planned_incremental_units: 10000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Denial Matrix Event", window_start: "2026-08-03", window_end: "2026-08-10", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 4000, window_start: "2026-08-03", window_end: "2026-08-10", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_id}", claim_reference: "MM-CLAIM-0041", claimed_amount: 400.00, deduction_date: "2026-08-03" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_id: $.data.id }
            - call: "GET /trade-marketing/promotions/${promo_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { promo_v: $.data.version }
          trigger:
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2027, name: "Shadow Fund", total_budget_amount: 100000.00, accrual_method_default: "CONSUMPTION" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { err_prog: $.data.error_id }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Analyst Planned Event", window_start: "2026-08-17", window_end: "2026-08-24", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { err_promo: $.data.error_id }
            - call: "POST /trade-marketing/deductions/${ded_id}/validate"
              payload: { expected_promotion_version: "${promo_v}" }
