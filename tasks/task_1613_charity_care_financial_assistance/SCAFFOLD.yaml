scenario: |
  Charity Care & Financial Assistance Screening (nonprofit hospital financial assistance): policy eligibility by federal poverty level & asset test, application intake & document verification, presumptive eligibility scoring for non-responders, discount tier calculation & account adjustment, retroactive application window & refund of payments, plain-language summary & notification requirements, 501(r) compliance & extraordinary-collection-action rules, community benefit reporting

domain_name: charity-care-financial-assistance
api_prefix: /charity-care

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FinancialAssistancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_code, type: string, source: input, description: "Unique policy code; duplicates rejected (ERR_DUPLICATE_POLICY_CODE)" }
      - { name: fpl_base_cents, type: integer, source: input, description: "Federal poverty guideline annual income for household size 1, integer cents" }
      - { name: fpl_increment_cents, type: integer, source: input, description: "Additional FPL amount per additional household member, integer cents" }
      - { name: full_discount_max_fpl_pct, type: integer, source: input, description: "FPL percentage at or below which a 100% discount applies (boundary is inclusive: fpl_pct <= this value)" }
      - { name: partial_discount_max_fpl_pct, type: integer, source: input, description: "FPL percentage above which the applicant is INELIGIBLE (fpl_pct > this value => ineligible; exactly equal => still eligible)" }
      - { name: partial_discount_floor_pct, type: number, source: input, description: "Discount percentage granted at exactly partial_discount_max_fpl_pct (sliding-scale floor)" }
      - { name: asset_limit_cents, type: integer, source: input, description: "Countable liquid asset cap; verified assets strictly greater than this value force INELIGIBLE regardless of income (exactly equal passes)" }
      - { name: retroactive_window_days, type: integer, source: input, description: "501(r) application period: days from an account's first_statement_at during which refunds of excess payments are owed (240)" }
      - { name: notification_period_days, type: integer, source: input, description: "501(r) notification period: days after first_statement_at before any ECA may begin (120); boundary inclusive" }
      - { name: eca_notice_days, type: integer, source: input, description: "Days an ECA_WARNING notice must precede an ECA (30); boundary inclusive" }
      - { name: doc_response_days, type: integer, source: input, description: "Days an applicant has to supply requested documents before the application EXPIRES (30)" }
      - { name: presumptive_partial_score_threshold, type: number, source: input, description: "Presumptive score >= this value yields ELIGIBLE_PARTIAL (flat partial discount)" }
      - { name: presumptive_full_score_threshold, type: number, source: input, description: "Presumptive score >= this value yields ELIGIBLE_FULL (flat 100% discount)" }
      - { name: effective_from, type: datetime, source: input, description: "Start of policy effective window; half-open [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "End of policy effective window (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED", constraints: "values: DRAFT, ACTIVE, SUPERSEDED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD" }
      - { name: ssn_last4, type: string, source: input, description: "Last four SSN digits, exactly 4 numeric chars" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique (ERR_DUPLICATE_MRN)" }
      - { name: contact_email, type: string, source: input, required: false, description: "Optional contact email" }

  - name: PatientAccount
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; guarantor patient for this encounter account" }
      - { name: encounter_date, type: string, source: input, description: "ISO date of service" }
      - { name: total_charges_cents, type: integer, source: input, description: "Gross charges, integer cents, must be > 0" }
      - { name: insurance_paid_cents, type: integer, source: input, description: "Insurance payment applied, integer cents, 0 <= insurance_paid_cents <= total_charges_cents (ERR_INSURANCE_EXCEEDS_CHARGES)" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "= total_charges_cents - insurance_paid_cents, fixed at creation" }
      - { name: adjusted_balance_cents, type: integer, source: computed, description: "= patient_responsibility_cents - sum(amount_cents of AccountAdjustment with adjustment_type=WRITE_OFF and status=POSTED for this account)" }
      - { name: effective_payments_cents, type: integer, source: computed, description: "= sum(amount_cents - refunded_cents) over ALL AccountPayment rows of this account (FULLY_REFUNDED contribute 0)" }
      - { name: amount_outstanding_cents, type: integer, source: computed, description: "= max(0, adjusted_balance_cents - effective_payments_cents)" }
      - { name: overpayment_cents, type: integer, source: computed, description: "= max(0, effective_payments_cents - adjusted_balance_cents)" }
      - { name: first_statement_at, type: datetime, source: system, description: "Logical-clock timestamp when FIRST_STATEMENT notice issued; null until then; starts the 120-day notification and 240-day application windows" }
      - { name: collection_posture, type: enum, source: system, description: "NOT_IN_COLLECTIONS -> NOTICE_PERIOD -> ECA_ELIGIBLE -> ECA_ACTIVE; guarded ASSISTANCE_HOLD; RESOLVED when amount_outstanding_cents = 0", constraints: "values: NOT_IN_COLLECTIONS, NOTICE_PERIOD, ECA_ELIGIBLE, ECA_ACTIVE, ASSISTANCE_HOLD, RESOLVED" }

  - name: AccountPayment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; account receiving the payment" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount, integer cents > 0 (ERR_NONPOSITIVE_AMOUNT)" }
      - { name: paid_at, type: datetime, source: input, description: "ISO 8601 timestamp the payment was made (drives refund waterfall ordering)" }
      - { name: method, type: enum, source: input, description: "Tender type", constraints: "values: CARD, CHECK, ACH, CASH" }
      - { name: refunded_cents, type: integer, source: system, default: 0, description: "Cumulative amount refunded from this payment by the refund waterfall" }
      - { name: status, type: enum, source: system, description: "POSTED -> PARTIALLY_REFUNDED -> FULLY_REFUNDED (POSTED -> FULLY_REFUNDED allowed)", constraints: "values: POSTED, PARTIALLY_REFUNDED, FULLY_REFUNDED" }

  - name: AssistanceApplication
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; applicant patient" }
      - { name: screening_source, type: enum, source: input, description: "STANDARD (patient-initiated, document-verified) or PRESUMPTIVE (hospital-initiated for non-responders)", constraints: "values: STANDARD, PRESUMPTIVE" }
      - { name: reported_annual_income_cents, type: integer, source: input, description: "Self-reported annual household income, integer cents >= 0" }
      - { name: reported_liquid_assets_cents, type: integer, source: input, description: "Self-reported countable liquid assets, integer cents >= 0" }
      - { name: policy_id, type: string, source: system, description: "FK -> FinancialAssistancePolicy.id; pinned at submit to the policy with status=ACTIVE" }
      - { name: policy_version, type: integer, source: system, description: "Version integer of the pinned policy at submit time; determination math MUST use this pinned snapshot even if the policy is later SUPERSEDED" }
      - { name: household_size, type: integer, source: computed, description: "= count of HouseholdMember rows for this application" }
      - { name: annualized_verified_income_cents, type: integer, source: computed, description: "Output of verified_household_financials: annualized sum over VERIFIED income documents" }
      - { name: verified_liquid_assets_cents, type: integer, source: computed, description: "Output of verified_household_financials: sum of VERIFIED BANK_STATEMENT amounts" }
      - { name: requested_doc_types, type: array, source: system, default: [], description: "Document types outstanding, set by request-documents or by a document rejection" }
      - { name: doc_response_deadline, type: datetime, source: system, description: "Logical-clock timestamp of request-documents + policy.doc_response_days; null unless PENDING_DOCUMENTS" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit; drives retroactive-window eligibility per covered account" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> PENDING_DOCUMENTS (cycle back to UNDER_REVIEW) -> APPROVED / DENIED; EXPIRED / WITHDRAWN; APPROVED -> UNDER_REVIEW on determination reversal", constraints: "values: DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS, APPROVED, DENIED, EXPIRED, WITHDRAWN" }

  - name: HouseholdMember
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; owning application" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: relationship, type: enum, source: input, description: "Relationship to patient; exactly one SELF row required before submit", constraints: "values: SELF, SPOUSE, CHILD, OTHER_DEPENDENT" }
      - { name: age, type: integer, source: input, description: "Age in years, 0 <= age <= 130" }

  - name: VerificationDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; owning application" }
      - { name: household_member_id, type: string, source: input, required: false, description: "FK -> HouseholdMember.id; member the document evidences; optional for IDENTITY docs of the applicant" }
      - { name: doc_type, type: enum, source: input, description: "Document category", constraints: "values: PAY_STUB, TAX_RETURN, BENEFIT_LETTER, BANK_STATEMENT, IDENTITY" }
      - { name: period_start, type: string, source: input, description: "ISO date; start of the evidenced period (closed interval)" }
      - { name: period_end, type: string, source: input, description: "ISO date; end of the evidenced period (closed interval; must be >= period_start, ERR_INVALID_PERIOD)" }
      - { name: amount_cents, type: integer, source: input, description: "Amount evidenced: per-period income for PAY_STUB (biweekly), BENEFIT_LETTER (monthly), TAX_RETURN (annual); statement balance for BANK_STATEMENT; 0 for IDENTITY" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on rejection; null otherwise" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the FinancialCounselor who verified; consumed by segregation-of-duties check at determination finalize" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED / REJECTED", constraints: "values: SUBMITTED, VERIFIED, REJECTED" }

  - name: PresumptiveScreening
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; 1:1 with application (ERR_SCREENING_ALREADY_EXISTS)" }
      - { name: income_band_score, type: integer, source: input, required: false, description: "Third-party estimated income band score 0-100; null = factor unavailable" }
      - { name: payment_history_score, type: integer, source: input, required: false, description: "Prior payment behavior score 0-100; null = factor unavailable" }
      - { name: utilization_score, type: integer, source: input, required: false, description: "Utilization pattern score 0-100; null = factor unavailable" }
      - { name: public_benefit_score, type: integer, source: input, required: false, description: "Public-benefit enrollment indicator score 0-100; null = factor unavailable" }
      - { name: housing_stability_score, type: integer, source: input, required: false, description: "Housing stability score 0-100; null = factor unavailable" }
      - { name: present_factor_count, type: integer, source: computed, description: "Count of non-null factor scores; must be >= 3 (ERR_INSUFFICIENT_FACTORS)" }
      - { name: thin_file, type: boolean, source: computed, description: "True when present_factor_count < 5" }
      - { name: propensity_score, type: number, source: computed, description: "Output of presumptive_eligibility_score, 2 decimal places" }
      - { name: outcome, type: enum, source: computed, description: "ELIGIBLE_FULL / ELIGIBLE_PARTIAL / NOT_ELIGIBLE from propensity_score vs policy thresholds", constraints: "values: ELIGIBLE_FULL, ELIGIBLE_PARTIAL, NOT_ELIGIBLE" }
      - { name: screened_by_user_id, type: string, source: system, description: "X-User-ID of the counselor who ran the screening; consumed by segregation-of-duties check" }
      - { name: model_version, type: string, source: system, default: "PRES-V1", description: "Scoring model version constant" }

  - name: DiscountDetermination
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AssistanceApplication.id; application being decided" }
      - { name: basis, type: enum, source: input, description: "VERIFIED_APPLICATION uses document-verified financials; PRESUMPTIVE_SCORE uses the screening outcome (flat discount)", constraints: "values: VERIFIED_APPLICATION, PRESUMPTIVE_SCORE" }
      - { name: covered_account_ids, type: array, source: input, description: "PatientAccount ids covered by this determination; every id must belong to application.patient_id (ERR_ACCOUNT_PATIENT_MISMATCH)" }
      - { name: policy_id, type: string, source: system, description: "FK -> FinancialAssistancePolicy.id; copied from application pinned policy" }
      - { name: policy_version, type: integer, source: system, description: "Copied from application.policy_version; all math uses this snapshot" }
      - { name: fpl_pct_snapshot, type: number, source: computed, description: "FPL percentage computed at creation, 4 decimal places; null for PRESUMPTIVE_SCORE basis" }
      - { name: tier, type: enum, source: computed, description: "TIER_FULL (100%) / TIER_PARTIAL (sliding or flat) / INELIGIBLE (0%)", constraints: "values: TIER_FULL, TIER_PARTIAL, INELIGIBLE" }
      - { name: discount_pct, type: number, source: computed, description: "Output of discount_tier_assignment, 2 decimal places, 0..100" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the reviewer who finalized; segregation-of-duties compared against document verifiers and screening runner" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalize; membership key for community-benefit reporting year" }
      - { name: status, type: enum, source: system, description: "PRELIMINARY -> FINAL -> REVERSED", constraints: "values: PRELIMINARY, FINAL, REVERSED" }

  - name: AccountAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; account being adjusted" }
      - { name: determination_id, type: string, source: input, description: "FK -> DiscountDetermination.id; must be status=FINAL (ERR_DETERMINATION_NOT_FINAL) and cover this account (ERR_ACCOUNT_NOT_COVERED)" }
      - { name: adjustment_type, type: enum, source: system, description: "WRITE_OFF reduces adjusted_balance; REFUND records a refund of collected payments; WRITE_OFF reversals set status=REVERSED", constraints: "values: WRITE_OFF, REFUND" }
      - { name: amount_cents, type: integer, source: computed, description: "WRITE_OFF: round_half_up(account.patient_responsibility_cents * discount_pct / 100) to integer cents (per-account rounding, see account_adjustment_computation). REFUND: amount refunded from one payment" }
      - { name: payment_id, type: string, source: system, required: false, description: "FK -> AccountPayment.id; set on REFUND adjustments: the payment this refund draws from" }
      - { name: reversed_at, type: datetime, source: system, description: "Logical-clock timestamp when reversed; null while POSTED" }
      - { name: status, type: enum, source: system, description: "POSTED -> REVERSED; REFUND adjustments are never reversible (ERR_REFUND_NOT_REVERSIBLE)", constraints: "values: POSTED, REVERSED" }

  - name: NotificationRecord
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, required: false, description: "FK -> PatientAccount.id; set for FIRST_STATEMENT / PLAIN_LANGUAGE_SUMMARY / ECA_WARNING account notices; null for application letters" }
      - { name: application_id, type: string, source: system, required: false, description: "FK -> AssistanceApplication.id; set for DOC_REQUEST and DETERMINATION_LETTER; null for account notices" }
      - { name: notice_type, type: enum, source: system, description: "FIRST_STATEMENT and DETERMINATION_LETTER and DOC_REQUEST are system-created; PLAIN_LANGUAGE_SUMMARY and ECA_WARNING are staff-issued via POST notices", constraints: "values: FIRST_STATEMENT, PLAIN_LANGUAGE_SUMMARY, ECA_WARNING, DETERMINATION_LETTER, DOC_REQUEST" }
      - { name: delivery_channel, type: enum, source: system, description: "MAIL or PORTAL or EMAIL", constraints: "values: MAIL, PORTAL, EMAIL" }
      - { name: is_plain_language, type: boolean, source: system, default: true, description: "501(r) plain-language flag; always true for FIRST_STATEMENT, PLAIN_LANGUAGE_SUMMARY, DETERMINATION_LETTER" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance; ECA_WARNING.issued_at drives the 30-day ECA gate" }

  - name: CollectionAction
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> PatientAccount.id; account subject to the extraordinary collection action" }
      - { name: action_type, type: enum, source: input, description: "ECA type", constraints: "values: CREDIT_REPORT, LAWSUIT, WAGE_GARNISHMENT, LIEN, SALE_TO_AGENCY" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical-clock timestamp of initiation" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the CollectionsAgent" }
      - { name: halted_at, type: datetime, source: system, description: "Logical-clock timestamp of halt; null while INITIATED or after COMPLETED" }
      - { name: halt_reason, type: string, source: system, required: false, description: "Free-text reason recorded on halt" }
      - { name: status, type: enum, source: system, description: "INITIATED -> HALTED / COMPLETED", constraints: "values: INITIATED, HALTED, COMPLETED" }

  - name: CommunityBenefitReport
    parent: null
    common_fields: true
    fields:
      - { name: reporting_year, type: integer, source: input, description: "Calendar year; unique across all reports (ERR_REPORT_YEAR_DUPLICATE)" }
      - { name: total_write_offs_cents, type: integer, source: computed, description: "Sum of amount_cents over AccountAdjustment rows with adjustment_type=WRITE_OFF, status=POSTED, whose determination finalized_at falls in [year-01-01T00:00:00Z, (year+1)-01-01T00:00:00Z)" }
      - { name: total_standard_write_offs_cents, type: integer, source: computed, description: "Same sweep restricted to determinations with basis=VERIFIED_APPLICATION" }
      - { name: total_presumptive_write_offs_cents, type: integer, source: computed, description: "Same sweep restricted to determinations with basis=PRESUMPTIVE_SCORE" }
      - { name: total_refunds_cents, type: integer, source: computed, description: "Same year sweep over adjustment_type=REFUND, status=POSTED" }
      - { name: accounts_assisted_count, type: integer, source: computed, description: "Count of distinct account_id with at least one POSTED WRITE_OFF in the year sweep" }
      - { name: totals_stale, type: boolean, source: system, default: false, description: "Set true by reopen and by any reversal touching the year; cleared only by recompute; FILED requires totals_stale=false" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent file transition" }
      - { name: status, type: enum, source: system, description: "OPEN -> FILED -> REOPENED -> FILED (amendment cycle)", constraints: "values: OPEN, FILED, REOPENED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FinancialAssistancePolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /charity-care/policies/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Policy must be DRAFT (ERR_POLICY_NOT_DRAFT)"
          - "Half-open window [effective_from, effective_to) must not intersect the window of any other policy with status in {ACTIVE, SUPERSEDED}: conflict iff new.effective_from < existing.effective_to AND existing.effective_from < new.effective_to; adjacency (new.from == existing.to) is allowed (ERR_POLICY_WINDOW_OVERLAP)"
          - "effective_from < effective_to (ERR_INVALID_PERIOD)"
        side_effects:
          - "Any other policy with status=ACTIVE transitions to SUPERSEDED (activation supersedes)"
          - "increments FinancialAssistancePolicy.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: activation of another policy"
        actor: system
        preconditions: []
        side_effects:
          - "increments the superseded FinancialAssistancePolicy.version by 1"
        note: "Applications already submitted keep their pinned (policy_id, policy_version); supersession never rewrites pinned snapshots."

  - entity: AssistanceApplication
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /charity-care/applications/{id}/submit"
        actor: "Patient (own) or FinancialCounselor"
        preconditions:
          - "Application must be DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "At least one HouseholdMember with relationship=SELF exists (ERR_HOUSEHOLD_SELF_REQUIRED)"
          - "A FinancialAssistancePolicy with status=ACTIVE exists (ERR_NO_ACTIVE_POLICY)"
        side_effects:
          - "Pins policy_id and policy_version to the currently ACTIVE policy"
          - "Sets submitted_at to logical clock now; household_size = count(HouseholdMember)"
          - "Creates NotificationRecord notice_type=PLAIN_LANGUAGE_SUMMARY with application_id set, is_plain_language=true"
          - "Every PatientAccount of this patient with collection_posture in {NOTICE_PERIOD, ECA_ELIGIBLE, ECA_ACTIVE} transitions to ASSISTANCE_HOLD (ECA freeze during pending application)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /charity-care/applications/{id}/begin-review"
        actor: FinancialCounselor
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: PENDING_DOCUMENTS
        trigger: "POST /charity-care/applications/{id}/request-documents"
        actor: FinancialCounselor
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
        side_effects:
          - "Sets requested_doc_types to the request list; sets doc_response_deadline = now + pinned policy.doc_response_days"
          - "Creates NotificationRecord notice_type=DOC_REQUEST with application_id set"
      - from: UNDER_REVIEW
        to: PENDING_DOCUMENTS
        trigger: "system: a VerificationDocument of this application is rejected while the application is UNDER_REVIEW"
        actor: system
        preconditions: []
        side_effects:
          - "Adds the rejected document's doc_type to requested_doc_types (union, deduplicated)"
          - "Sets doc_response_deadline = now + pinned policy.doc_response_days (reset on each rejection)"
          - "Creates NotificationRecord notice_type=DOC_REQUEST with application_id set"
        note: "Cascade link 1 of the document-rejection chain: the rejection forces the application back to document collection."
      - from: PENDING_DOCUMENTS
        to: UNDER_REVIEW
        trigger: "POST /charity-care/applications/{id}/resume-review"
        actor: FinancialCounselor
        preconditions:
          - "Application must be PENDING_DOCUMENTS (ERR_APPLICATION_NOT_PENDING_DOCUMENTS)"
          - "For every doc_type in requested_doc_types, at least one VerificationDocument of this application with that doc_type has status=VERIFIED (ERR_DOCS_OUTSTANDING)"
        side_effects:
          - "Clears requested_doc_types to []; clears doc_response_deadline to null"
      - from: PENDING_DOCUMENTS
        to: EXPIRED
        trigger: "POST /charity-care/applications/{id}/expire"
        actor: FinancialCounselor
        preconditions:
          - "Application must be PENDING_DOCUMENTS (ERR_APPLICATION_NOT_PENDING_DOCUMENTS)"
          - "Logical clock now > doc_response_deadline (ERR_DOC_DEADLINE_NOT_REACHED)"
        side_effects:
          - "Every PatientAccount of this patient in ASSISTANCE_HOLD transitions to NOTICE_PERIOD (hold released)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system: a DiscountDetermination of this application is finalized with tier != INELIGIBLE"
        actor: system
        preconditions: []
        side_effects:
          - "Accounts remain in ASSISTANCE_HOLD until their own WRITE_OFF adjustment posts"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: a DiscountDetermination of this application is finalized with tier == INELIGIBLE"
        actor: system
        preconditions: []
        side_effects:
          - "Every PatientAccount of this patient in ASSISTANCE_HOLD transitions to NOTICE_PERIOD (hold released)"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "system: the FINAL DiscountDetermination of this application is reversed"
        actor: system
        preconditions: []
        side_effects:
          - "Application returns to UNDER_REVIEW for re-determination (revision loop)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{id}/withdraw"
        actor: "Patient (own) or FinancialCounselor"
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "If patient accounts are in ASSISTANCE_HOLD they transition to NOTICE_PERIOD"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{id}/withdraw"
        actor: "Patient (own) or FinancialCounselor"
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "Every PatientAccount of this patient in ASSISTANCE_HOLD transitions to NOTICE_PERIOD"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{id}/withdraw"
        actor: "Patient (own) or FinancialCounselor"
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "Every PatientAccount of this patient in ASSISTANCE_HOLD transitions to NOTICE_PERIOD"
      - from: PENDING_DOCUMENTS
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{id}/withdraw"
        actor: "Patient (own) or FinancialCounselor"
        preconditions:
          - "Application must be in {DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "Every PatientAccount of this patient in ASSISTANCE_HOLD transitions to NOTICE_PERIOD"

  - entity: VerificationDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /charity-care/documents/{id}/verify"
        actor: FinancialCounselor
        preconditions:
          - "Document must be SUBMITTED (ERR_DOCUMENT_NOT_SUBMITTED)"
          - "Owning application must be in {SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
          - "For doc_type=BANK_STATEMENT with household_member_id set: no other VERIFIED BANK_STATEMENT for the same household_member_id may have a closed-period overlap: conflict iff new.period_start <= existing.period_end AND existing.period_start <= new.period_end; touching dates count as overlap (ERR_DOC_PERIOD_OVERLAP)"
        side_effects:
          - "Sets verified_by_user_id = X-User-ID"
          - "Recomputes application.annualized_verified_income_cents and application.verified_liquid_assets_cents (verified_household_financials)"
          - "increments VerificationDocument.version by 1 and bumps owning AssistanceApplication.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /charity-care/documents/{id}/reject"
        actor: FinancialCounselor
        preconditions:
          - "Document must be SUBMITTED (ERR_DOCUMENT_NOT_SUBMITTED)"
          - "Owning application must be in {SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "Sets rejection_reason from input"
          - "If owning application is UNDER_REVIEW: application transitions to PENDING_DOCUMENTS (adds doc_type to requested_doc_types, sets doc_response_deadline, creates DOC_REQUEST NotificationRecord) — cascade link 1"
          - "increments VerificationDocument.version by 1 and bumps owning AssistanceApplication.version by 1"

  - entity: DiscountDetermination
    initial_state: PRELIMINARY
    terminal_states: [REVERSED]
    transitions:
      - from: PRELIMINARY
        to: FINAL
        trigger: "POST /charity-care/determinations/{id}/finalize"
        actor: AssistanceReviewer
        preconditions:
          - "Determination must be PRELIMINARY (ERR_DETERMINATION_NOT_PRELIMINARY)"
          - "Owning application must be UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "Segregation of duties: X-User-ID must not equal verified_by_user_id of any VERIFIED VerificationDocument of the application and must not equal the PresumptiveScreening.screened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Sets decided_by_user_id = X-User-ID and finalized_at = logical clock now"
          - "If tier != INELIGIBLE: application transitions UNDER_REVIEW -> APPROVED; else application transitions UNDER_REVIEW -> DENIED (which releases ASSISTANCE_HOLD on patient accounts to NOTICE_PERIOD)"
          - "Creates NotificationRecord notice_type=DETERMINATION_LETTER with application_id set, is_plain_language=true"
          - "increments DiscountDetermination.version by 1 and bumps owning AssistanceApplication.version by 1"
      - from: FINAL
        to: REVERSED
        trigger: "POST /charity-care/determinations/{id}/reverse"
        actor: "AssistanceReviewer or ComplianceOfficer"
        preconditions:
          - "Determination must be FINAL (ERR_DETERMINATION_NOT_FINAL)"
        side_effects:
          - "Every POSTED AccountAdjustment with adjustment_type=WRITE_OFF of this determination transitions to REVERSED with reversed_at set (REFUND adjustments are left POSTED) — cascade link 1"
          - "Each affected PatientAccount recomputes adjusted_balance_cents; if an account was RESOLVED and its amount_outstanding_cents is now > 0 it transitions back to NOTICE_PERIOD — cascade link 2"
          - "Application transitions APPROVED -> UNDER_REVIEW"
          - "If a CommunityBenefitReport with status=FILED exists whose reporting_year contains finalized_at: it transitions to REOPENED with totals_stale=true — cascade link 3"
          - "increments DiscountDetermination.version by 1 and bumps owning AssistanceApplication.version by 1"

  - entity: PatientAccount
    initial_state: NOT_IN_COLLECTIONS
    terminal_states: []
    transitions:
      - from: NOT_IN_COLLECTIONS
        to: NOTICE_PERIOD
        trigger: "POST /charity-care/accounts/{id}/statements (issues FIRST_STATEMENT)"
        actor: BillingAdministrator
        preconditions:
          - "first_statement_at must be null (ERR_FIRST_STATEMENT_ALREADY_ISSUED)"
        side_effects:
          - "Sets first_statement_at = logical clock now"
          - "Creates NotificationRecord notice_type=FIRST_STATEMENT with account_id set, is_plain_language=true"
          - "increments PatientAccount.version by 1"
      - from: NOT_IN_COLLECTIONS
        to: RESOLVED
        trigger: "system: amount_outstanding_cents becomes 0 at creation (insurance covers all) or via payment/adjustment"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_PERIOD
        to: ECA_ELIGIBLE
        trigger: "POST /charity-care/accounts/{id}/evaluate-posture"
        actor: "CollectionsAgent, BillingAdministrator, or ComplianceOfficer"
        preconditions:
          - "Account must be NOTICE_PERIOD or ASSISTANCE_HOLD (ERR_POSTURE_NOT_EVALUABLE)"
          - "eca_clearance_window: logical clock now >= first_statement_at + pinned ACTIVE policy.notification_period_days AND exists an ECA_WARNING NotificationRecord for this account with issued_at <= now - policy.eca_notice_days (ERR_ECA_NOTIFICATION_WINDOW_UNMET)"
          - "No AssistanceApplication of this patient in {SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_ASSISTANCE_HOLD_ACTIVE)"
        side_effects:
          - "increments PatientAccount.version by 1"
      - from: ASSISTANCE_HOLD
        to: ECA_ELIGIBLE
        trigger: "POST /charity-care/accounts/{id}/evaluate-posture"
        actor: "CollectionsAgent, BillingAdministrator, or ComplianceOfficer"
        preconditions:
          - "Same temporal gates as NOTICE_PERIOD -> ECA_ELIGIBLE (ERR_ECA_NOTIFICATION_WINDOW_UNMET)"
          - "No AssistanceApplication of this patient in {SUBMITTED, UNDER_REVIEW, PENDING_DOCUMENTS} (ERR_ASSISTANCE_HOLD_ACTIVE)"
        side_effects:
          - "increments PatientAccount.version by 1"
      - from: ECA_ELIGIBLE
        to: ECA_ACTIVE
        trigger: "system: first CollectionAction created for this account"
        actor: system
        preconditions: []
        side_effects:
          - "increments PatientAccount.version by 1"
      - from: NOTICE_PERIOD
        to: ASSISTANCE_HOLD
        trigger: "system: an AssistanceApplication for this patient is submitted"
        actor: system
        preconditions: []
        side_effects: []
      - from: ECA_ELIGIBLE
        to: ASSISTANCE_HOLD
        trigger: "system: an AssistanceApplication for this patient is submitted"
        actor: system
        preconditions: []
        side_effects: []
      - from: ECA_ACTIVE
        to: ASSISTANCE_HOLD
        trigger: "system: an AssistanceApplication for this patient is submitted"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSISTANCE_HOLD
        to: NOTICE_PERIOD
        trigger: "system: the open AssistanceApplication for this patient reaches a terminal state (DENIED / EXPIRED / WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSISTANCE_HOLD
        to: RESOLVED
        trigger: "system: a WRITE_OFF adjustment posts and amount_outstanding_cents becomes 0"
        actor: system
        preconditions: []
        side_effects:
          - "Every CollectionAction of this account with status=INITIATED transitions to HALTED with halt_reason='ACCOUNT_RESOLVED' — cascade link 3 of the adjustment chain"
      - from: ASSISTANCE_HOLD
        to: NOTICE_PERIOD
        trigger: "system: a WRITE_OFF adjustment posts and amount_outstanding_cents remains > 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_PERIOD
        to: RESOLVED
        trigger: "system: a payment posts and amount_outstanding_cents becomes 0"
        actor: system
        preconditions: []
        side_effects:
          - "Every CollectionAction of this account with status=INITIATED transitions to HALTED with halt_reason='ACCOUNT_RESOLVED'"
      - from: RESOLVED
        to: NOTICE_PERIOD
        trigger: "system: a determination reversal re-establishes amount_outstanding_cents > 0"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AccountPayment
    initial_state: POSTED
    terminal_states: [FULLY_REFUNDED]
    transitions:
      - from: POSTED
        to: PARTIALLY_REFUNDED
        trigger: "system: retroactive_refund_waterfall partially refunds this payment"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents increases; account effective_payments_cents recomputed"
      - from: POSTED
        to: FULLY_REFUNDED
        trigger: "system: retroactive_refund_waterfall fully refunds this payment"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents = amount_cents; account effective_payments_cents recomputed"
      - from: PARTIALLY_REFUNDED
        to: FULLY_REFUNDED
        trigger: "system: retroactive_refund_waterfall completes the refund of this payment"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents = amount_cents; account effective_payments_cents recomputed"

  - entity: AccountAdjustment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "system: owning DiscountDetermination is reversed (WRITE_OFF only)"
        actor: system
        preconditions:
          - "adjustment_type must be WRITE_OFF (REFUND adjustments reject reversal attempts with ERR_REFUND_NOT_REVERSIBLE)"
        side_effects:
          - "Sets reversed_at = logical clock now"
          - "Account adjusted_balance_cents recomputed"

  - entity: CollectionAction
    initial_state: INITIATED
    terminal_states: [HALTED, COMPLETED]
    transitions:
      - from: INITIATED
        to: HALTED
        trigger: "POST /charity-care/collection-actions/{id}/halt OR system cascade when account RESOLVED"
        actor: "ComplianceOfficer (explicit) or system (cascade)"
        preconditions:
          - "CollectionAction must be INITIATED (ERR_ACTION_NOT_INITIATED)"
        side_effects:
          - "Sets halted_at = logical clock now; halt_reason from input or 'ACCOUNT_RESOLVED'"
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /charity-care/collection-actions/{id}/complete"
        actor: CollectionsAgent
        preconditions:
          - "CollectionAction must be INITIATED (ERR_ACTION_NOT_INITIATED)"
          - "Owning account must be in ECA_ACTIVE or ECA_ELIGIBLE (ERR_ACCOUNT_NOT_IN_COLLECTIONS)"
        side_effects: []

  - entity: CommunityBenefitReport
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /charity-care/community-benefit-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Report must be OPEN or REOPENED (ERR_REPORT_NOT_FILEABLE)"
          - "totals_stale must be false (ERR_REPORT_TOTALS_STALE)"
        side_effects:
          - "Sets filed_at = logical clock now"
      - from: REOPENED
        to: FILED
        trigger: "POST /charity-care/community-benefit-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Report must be OPEN or REOPENED (ERR_REPORT_NOT_FILEABLE)"
          - "totals_stale must be false (ERR_REPORT_TOTALS_STALE)"
        side_effects:
          - "Sets filed_at = logical clock now"
      - from: FILED
        to: REOPENED
        trigger: "POST /charity-care/community-benefit-reports/{id}/reopen OR system: a determination reversal touches this reporting year"
        actor: "ComplianceOfficer (explicit) or system (cascade)"
        preconditions:
          - "Report must be FILED (ERR_REPORT_NOT_FILED)"
        side_effects:
          - "Sets totals_stale = true (requires recompute before refiling)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: determination-create-stale-application
    parent_entity: AssistanceApplication
    write_endpoint: "POST /charity-care/determinations"
    occ_field: "expected_application_version"
    description: |
      Creating a DiscountDetermination against an AssistanceApplication whose
      version has advanced since the client last observed it is rejected.
      Determinations legitimately supersede one another across the
      APPROVED -> UNDER_REVIEW revision loop, so a stale application view
      must fail the OCC check rather than silently stack a second
      determination on a changed application.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adjustment-create-stale-account
    parent_entity: PatientAccount
    write_endpoint: "POST /charity-care/accounts/{id}/adjustments"
    occ_field: "expected_account_version"
    description: |
      Posting an AccountAdjustment against a PatientAccount whose version has
      advanced since the client last observed it is rejected. Payments,
      statements, and prior adjustments all advance the account ledger, so a
      stale account view must fail the OCC check rather than post against a
      changed ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: verified_household_financials
    trigger: "whenever a VerificationDocument of the application transitions to VERIFIED or a VERIFIED document's application recomputes (document verify side effect)"
    algorithm: aggregation
    formula: |
      income = 0
      for doc in VerificationDocument where doc.application_id == application.id
              and doc.status == VERIFIED
              and doc.doc_type in {PAY_STUB, BENEFIT_LETTER, TAX_RETURN}:
          income += doc.amount_cents * ANNUALIZATION[doc.doc_type]
      assets = sum(doc.amount_cents for VERIFIED BANK_STATEMENT docs of this application)
      application.annualized_verified_income_cents = income
      application.verified_liquid_assets_cents = assets
    input_set: "Only VerificationDocument rows of this application with status=VERIFIED; SUBMITTED and REJECTED documents are excluded"
    constants:
      ANNUALIZATION: { PAY_STUB: 26, BENEFIT_LETTER: 12, TAX_RETURN: 1 }
    precision: "integer cents; no rounding"
    variants: []

  - name: fpl_percentage
    trigger: "at DiscountDetermination creation when basis=VERIFIED_APPLICATION"
    algorithm: threshold
    formula: |
      fpl_amount = policy.fpl_base_cents + (application.household_size - 1) * policy.fpl_increment_cents
      fpl_pct = round_half_up(application.annualized_verified_income_cents * 100 / fpl_amount, 4)
    input_set: "application.annualized_verified_income_cents, application.household_size, pinned policy constants"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: discount_tier_assignment
    trigger: "at DiscountDetermination creation (tier and discount_pct are frozen on the PRELIMINARY record)"
    algorithm: tiered_pricing
    formula: |
      if basis == VERIFIED_APPLICATION:
          if application.verified_liquid_assets_cents > policy.asset_limit_cents:
              tier = INELIGIBLE; discount_pct = 0.00        # asset test overrides income (strict >)
          elif fpl_pct <= policy.full_discount_max_fpl_pct:                  # inclusive boundary
              tier = TIER_FULL; discount_pct = 100.00
          elif fpl_pct <= policy.partial_discount_max_fpl_pct:               # inclusive boundary
              tier = TIER_PARTIAL
              discount_pct = round_half_up(
                  policy.partial_discount_floor_pct
                  + (policy.partial_discount_max_fpl_pct - fpl_pct)
                    * (100 - policy.partial_discount_floor_pct)
                    / (policy.partial_discount_max_fpl_pct - policy.full_discount_max_fpl_pct),
                  2)
          else:
              tier = INELIGIBLE; discount_pct = 0.00
      else:  # PRESUMPTIVE_SCORE
          screening = the PresumptiveScreening of this application
          if screening.outcome == ELIGIBLE_FULL:   tier = TIER_FULL;    discount_pct = PRESUMPTIVE_FULL_DISCOUNT_PCT
          elif screening.outcome == ELIGIBLE_PARTIAL: tier = TIER_PARTIAL; discount_pct = PRESUMPTIVE_PARTIAL_DISCOUNT_PCT
          else: tier = INELIGIBLE; discount_pct = 0.00
    input_set: "basis, verified financials + pinned policy (VERIFIED_APPLICATION) or PresumptiveScreening outcome (PRESUMPTIVE_SCORE)"
    constants:
      PRESUMPTIVE_FULL_DISCOUNT_PCT: 100.00
      PRESUMPTIVE_PARTIAL_DISCOUNT_PCT: 50.00
    precision: "discount_pct 2 decimal places, round_half_up"
    variants:
      - name: verified_sliding_scale
        when: "basis=VERIFIED_APPLICATION"
        difference: "Continuous sliding scale between full_discount_max_fpl_pct and partial_discount_max_fpl_pct; asset test can override to INELIGIBLE"
      - name: presumptive_flat
        when: "basis=PRESUMPTIVE_SCORE"
        difference: "Flat 100.00 or 50.00 driven only by screening outcome; income, assets, and household size are NOT consulted — identical accounts receive different discount_pct than under verified_sliding_scale"

  - name: presumptive_eligibility_score
    trigger: "on POST /charity-care/applications/{id}/presumptive-screening"
    algorithm: weighted_scoring
    formula: |
      WEIGHTS = { income_band: 0.35, payment_history: 0.25, utilization: 0.15,
                  public_benefit: 0.15, housing_stability: 0.10 }
      present = factors with non-null scores
      if len(present) < 3: reject ERR_INSUFFICIENT_FACTORS
      raw = sum(WEIGHTS[f] * score[f] for f in present)
      if thin_file (len(present) < 5):
          propensity_score = round_half_up(raw / sum(WEIGHTS[f] for f in present), 2)
      else:
          propensity_score = round_half_up(raw, 2)   # full file: sum of all weights == 1.00
      outcome = ELIGIBLE_FULL    if propensity_score >= policy.presumptive_full_score_threshold
                ELIGIBLE_PARTIAL if propensity_score >= policy.presumptive_partial_score_threshold
                NOT_ELIGIBLE     otherwise
    input_set: "The five factor scores on the screening request; null factors are excluded and trigger thin-file renormalization"
    constants:
      WEIGHT_INCOME_BAND: 0.35
      WEIGHT_PAYMENT_HISTORY: 0.25
      WEIGHT_UTILIZATION: 0.15
      WEIGHT_PUBLIC_BENEFIT: 0.15
      WEIGHT_HOUSING_STABILITY: 0.10
    precision: "propensity_score 2 decimal places, round_half_up; weight sum for full file is exactly 1.00"
    variants:
      - name: full_file
        when: "all five factor scores present (thin_file=false)"
        difference: "Score = raw weighted sum, weights sum to 1.00"
      - name: thin_file
        when: "3 or 4 factor scores present (thin_file=true)"
        difference: "Score = raw weighted sum divided by the sum of the PRESENT factors' weights (renormalization) — the same present scores yield a different propensity_score than treating absent factors as zero"

  - name: account_adjustment_computation
    trigger: "on POST /charity-care/accounts/{id}/adjustments with adjustment_type derived from a FINAL determination (WRITE_OFF leg)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per account FIRST, then sum.
      for each covered account:
          write_off[account] = round_half_up(account.patient_responsibility_cents * determination.discount_pct / 100, 0)
      determination_total_write_off = sum(write_off[account])   # sum of already-rounded integers; NO second rounding
      # FORBIDDEN alternative: round_half_up(sum(patient_responsibility) * discount_pct / 100, 0)
      # The two orders differ whenever per-account fractional cents cross an integer boundary in aggregate.
    input_set: "Each PatientAccount in determination.covered_account_ids at adjustment-creation time; uses patient_responsibility_cents (creation-fixed), NOT adjusted_balance_cents"
    constants: {}
    precision: "integer cents; round_half_up applied per account BEFORE summation"
    variants: []

  - name: refund_due_derivation
    trigger: "during POST /charity-care/accounts/{id}/adjustments, after the WRITE_OFF leg, for retro-eligible accounts"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED (the fields form a circular-looking dependency):
      # (1) adjusted_balance_cents = patient_responsibility_cents - sum(POSTED WRITE_OFF amounts)
      # (2) effective_payments_cents = sum(amount_cents - refunded_cents) over ALL AccountPayment rows
      # (3) overpayment_cents = max(0, effective_payments_cents - adjusted_balance_cents)
      # (4) refund_due = overpayment_cents when retro-eligible else 0
      # Refunds mutate refunded_cents (hence effective_payments_cents) but NEVER adjusted_balance_cents,
      # so evaluating in this order terminates in one pass.
    input_set: "The target account only"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: retroactive_refund_waterfall
    trigger: "during POST /charity-care/accounts/{id}/adjustments when refund_due > 0"
    algorithm: chronological
    formula: |
      eligible = (application.submitted_at <= account.first_statement_at + policy.retroactive_window_days)
      if account.first_statement_at is null: eligible = true   # window has not started
      if not eligible: refund_due = 0                          # write-off still applies to balance
      remaining = refund_due
      for payment in account payments sorted by paid_at DESC, tie-break created_at ASC:
          if remaining == 0: break
          room = payment.amount_cents - payment.refunded_cents
          grant = min(room, remaining)
          payment.refunded_cents += grant
          payment.status = FULLY_REFUNDED if payment.refunded_cents == payment.amount_cents else PARTIALLY_REFUNDED
          create AccountAdjustment(adjustment_type=REFUND, amount_cents=grant, payment_id=payment.id, determination_id=determination.id)
          remaining -= grant
    input_set: "All AccountPayment rows of the account regardless of status; FULLY_REFUNDED rows contribute room=0"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: chronological_newest_first
        when: "canonical rule"
        difference: "Refunds consume the most recent payments first (paid_at DESC, created_at ASC tie-break); last touched payment may be PARTIALLY_REFUNDED"
      - name: proportional_allocation
        when: "REJECTED alternative interpretation documented for contrast"
        difference: "Refunds would be prorated across all payments by amount; produces different per-payment refunded_cents for identical inputs — implementations MUST NOT use it"

  - name: eca_clearance_window
    trigger: "on POST /charity-care/accounts/{id}/evaluate-posture and on POST /charity-care/accounts/{id}/collection-actions"
    algorithm: threshold
    formula: |
      policy = the FinancialAssistancePolicy with status=ACTIVE at evaluation time
      notification_met = (now >= account.first_statement_at + policy.notification_period_days)   # inclusive
      warning = latest ECA_WARNING NotificationRecord for account (by issued_at DESC)
      notice_met = warning exists and warning.issued_at <= now - policy.eca_notice_days          # inclusive
      cleared = notification_met and notice_met
    input_set: "account.first_statement_at, ECA_WARNING NotificationRecord rows of this account, ACTIVE policy constants, logical clock now"
    constants: {}
    precision: "second-precision timestamps; both boundaries inclusive (>= and <=)"
    variants: []

  - name: community_benefit_aggregation
    trigger: "on POST /charity-care/community-benefit-reports (initial totals) and POST /charity-care/community-benefit-reports/{id}/recompute"
    algorithm: aggregation
    formula: |
      year_window = [DATE(reporting_year,1,1), DATE(reporting_year+1,1,1))   # half-open
      sweep = AccountAdjustment rows with status=POSTED whose determination.finalized_at in year_window
      total_write_offs_cents            = sum(amount_cents for sweep where adjustment_type=WRITE_OFF)
      total_standard_write_offs_cents   = same, determination.basis=VERIFIED_APPLICATION
      total_presumptive_write_offs_cents= same, determination.basis=PRESUMPTIVE_SCORE
      total_refunds_cents               = sum(amount_cents for sweep where adjustment_type=REFUND)
      accounts_assisted_count           = count(distinct account_id for sweep WRITE_OFF rows)
      totals_stale = false
    input_set: "AccountAdjustment rows with status=POSTED only (REVERSED excluded); year window half-open [Jan 1, next Jan 1)"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-templated resources exist, validated left-to-right", error_id: "ERR_PATIENT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ACTION_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_PAYMENT_NOT_FOUND", http_status: 404, applies_to: "all path-parameterized endpoints" }
  - { priority: 4, category: auth, check: "When X-User-Role=Patient, the X-User-ID must equal the patient_id of the targeted resource (account.patient_id / application.patient_id / document.application.patient_id / determination.application.patient_id); staff roles are exempt", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "all patient-scoped endpoints" }
  - { priority: 5, category: state, check: "Target entity is in the required state for the operation (per state machine preconditions): ERR_APPLICATION_NOT_DRAFT, ERR_APPLICATION_NOT_SUBMITTED, ERR_APPLICATION_NOT_UNDER_REVIEW, ERR_APPLICATION_NOT_PENDING_DOCUMENTS, ERR_APPLICATION_TERMINAL, ERR_DOCUMENT_NOT_SUBMITTED, ERR_DETERMINATION_NOT_PRELIMINARY, ERR_DETERMINATION_NOT_FINAL, ERR_POLICY_NOT_DRAFT, ERR_POSTURE_NOT_EVALUABLE, ERR_ACCOUNT_NOT_ECA_ELIGIBLE, ERR_ASSISTANCE_HOLD_ACTIVE, ERR_ACCOUNT_RESOLVED, ERR_ACTION_NOT_INITIATED, ERR_ACCOUNT_NOT_IN_COLLECTIONS, ERR_REPORT_NOT_FILEABLE, ERR_REPORT_NOT_FILED", error_id: ERR_INVALID_STATE_FAMILY, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Segregation of duties at determination finalize: X-User-ID differs from every VERIFIED document's verified_by_user_id and from the screening's screened_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /charity-care/determinations/{id}/finalize"] }
  - { priority: 7, category: business_safety, check: "501(r) notification window: now >= first_statement_at + notification_period_days AND an ECA_WARNING with issued_at <= now - eca_notice_days exists", error_id: ERR_ECA_NOTIFICATION_WINDOW_UNMET, http_status: 422, applies_to: ["POST /charity-care/accounts/{id}/evaluate-posture", "POST /charity-care/accounts/{id}/collection-actions"] }
  - { priority: 8, category: business_temporal, check: "Document-deadline gate on expire: logical clock now > doc_response_deadline", error_id: ERR_DOC_DEADLINE_NOT_REACHED, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/expire"] }
  - { priority: 9, category: business_temporal, check: "Policy effective window sanity: effective_from < effective_to", error_id: ERR_INVALID_PERIOD, http_status: 422, applies_to: ["POST /charity-care/policies", "POST /charity-care/policies/{id}/activate"] }
  - { priority: 10, category: business_constraint, check: "Half-open policy window overlap vs policies in {ACTIVE, SUPERSEDED}", error_id: ERR_POLICY_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /charity-care/policies/{id}/activate"] }
  - { priority: 11, category: business_constraint, check: "Closed-interval BANK_STATEMENT period overlap for same household_member_id against VERIFIED documents", error_id: ERR_DOC_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /charity-care/documents/{id}/verify"] }
  - { priority: 12, category: business_constraint, check: "Uniqueness: mrn, policy_code, reporting_year, one open application per patient (status in DRAFT/SUBMITTED/UNDER_REVIEW/PENDING_DOCUMENTS), one screening per application, one first statement per account", error_id: "ERR_DUPLICATE_MRN | ERR_DUPLICATE_POLICY_CODE | ERR_REPORT_YEAR_DUPLICATE | ERR_DUPLICATE_OPEN_APPLICATION | ERR_SCREENING_ALREADY_EXISTS | ERR_FIRST_STATEMENT_ALREADY_ISSUED", http_status: 409, applies_to: ["POST /charity-care/patients", "POST /charity-care/policies", "POST /charity-care/community-benefit-reports", "POST /charity-care/applications", "POST /charity-care/applications/{id}/presumptive-screening", "POST /charity-care/accounts/{id}/statements"] }
  - { priority: 13, category: business_constraint, check: "Required input fields present and well-typed; enum values in declared sets", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 14, category: business_constraint, check: "At least one HouseholdMember with relationship=SELF before submit", error_id: ERR_HOUSEHOLD_SELF_REQUIRED, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/submit"] }
  - { priority: 15, category: business_constraint, check: "A FinancialAssistancePolicy with status=ACTIVE exists at submit", error_id: ERR_NO_ACTIVE_POLICY, http_status: 409, applies_to: ["POST /charity-care/applications/{id}/submit"] }
  - { priority: 16, category: business_constraint, check: "All requested_doc_types have a VERIFIED document before resume-review", error_id: ERR_DOCS_OUTSTANDING, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/resume-review"] }
  - { priority: 17, category: business_constraint, check: "period_end >= period_start on document upload", error_id: ERR_INVALID_PERIOD, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/documents"] }
  - { priority: 18, category: business_constraint, check: "Presumptive screening has at least 3 non-null factor scores", error_id: ERR_INSUFFICIENT_FACTORS, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/presumptive-screening"] }
  - { priority: 19, category: business_referential, check: "household_member_id on document upload belongs to the same application", error_id: ERR_MEMBER_APPLICATION_MISMATCH, http_status: 422, applies_to: ["POST /charity-care/applications/{id}/documents"] }
  - { priority: 20, category: business_referential, check: "Every covered_account_ids entry belongs to application.patient_id", error_id: ERR_ACCOUNT_PATIENT_MISMATCH, http_status: 422, applies_to: ["POST /charity-care/determinations"] }
  - { priority: 21, category: business_referential, check: "basis=VERIFIED_APPLICATION requires >=1 VERIFIED income document (PAY_STUB/TAX_RETURN/BENEFIT_LETTER) and >=1 VERIFIED IDENTITY document", error_id: ERR_VERIFIED_DOCS_REQUIRED, http_status: 422, applies_to: ["POST /charity-care/determinations"] }
  - { priority: 22, category: business_referential, check: "basis=PRESUMPTIVE_SCORE requires a PresumptiveScreening with outcome != NOT_ELIGIBLE", error_id: ERR_PRESCREEN_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /charity-care/determinations"] }
  - { priority: 23, category: business_referential, check: "Adjustment's determination_id exists, is FINAL, and covers the account", error_id: "ERR_DETERMINATION_NOT_FOUND | ERR_DETERMINATION_NOT_FINAL | ERR_ACCOUNT_NOT_COVERED", http_status: 422, applies_to: ["POST /charity-care/accounts/{id}/adjustments"] }
  - { priority: 24, category: business_referential, check: "No other POSTED WRITE_OFF adjustment exists for (account, determination)", error_id: ERR_DUPLICATE_ADJUSTMENT, http_status: 409, applies_to: ["POST /charity-care/accounts/{id}/adjustments"] }
  - { priority: 25, category: business_fiscal, check: "insurance_paid_cents <= total_charges_cents and both >= 0", error_id: ERR_INSURANCE_EXCEEDS_CHARGES, http_status: 422, applies_to: ["POST /charity-care/accounts"] }
  - { priority: 26, category: business_fiscal, check: "Payment amount_cents > 0 (ERR_NONPOSITIVE_AMOUNT); account not RESOLVED (ERR_ACCOUNT_RESOLVED, state-class, evaluated here because payments are a fiscal write)", error_id: "ERR_NONPOSITIVE_AMOUNT | ERR_ACCOUNT_RESOLVED", http_status: 422, applies_to: ["POST /charity-care/accounts/{id}/payments"] }
  - { priority: 27, category: business_fiscal, check: "At determination creation at least one covered account has adjusted_balance_cents > 0; at adjustment creation the account has adjusted_balance_cents > 0", error_id: ERR_NO_COLLECTIBLE_BALANCE, http_status: 422, applies_to: ["POST /charity-care/determinations", "POST /charity-care/accounts/{id}/adjustments"] }
  - { priority: 28, category: business_fiscal, check: "Collection action target has amount_outstanding_cents > 0", error_id: ERR_NO_COLLECTIBLE_BALANCE, http_status: 422, applies_to: ["POST /charity-care/accounts/{id}/collection-actions"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: /charity-care/_clock/set_current_utc
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All 'now' references in state machines, calculations, and window checks read this clock."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # ---- policies ----
  - method: POST
    path: /charity-care/policies
    description: "Create a FinancialAssistancePolicy in DRAFT"
    roles: [ComplianceOfficer]
    code: 201
    input: [policy_code, fpl_base_cents, fpl_increment_cents, full_discount_max_fpl_pct, partial_discount_max_fpl_pct, partial_discount_floor_pct, asset_limit_cents, retroactive_window_days, notification_period_days, eca_notice_days, doc_response_days, presumptive_partial_score_threshold, presumptive_full_score_threshold, effective_from, effective_to]
    output: FinancialAssistancePolicy
    side_effects: []
  - method: GET
    path: /charity-care/policies/{id}
    description: "Fetch one policy"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: FinancialAssistancePolicy
    side_effects: []
  - method: POST
    path: /charity-care/policies/{id}/activate
    description: "Activate a DRAFT policy; supersedes the currently ACTIVE policy; half-open window overlap check"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FinancialAssistancePolicy
    side_effects: ["policy DRAFT -> ACTIVE", "prior ACTIVE policy -> SUPERSEDED", "increments both policies' version"]

  # ---- patients ----
  - method: POST
    path: /charity-care/patients
    description: "Register a patient"
    roles: [FinancialCounselor, ComplianceOfficer]
    code: 201
    input: [full_name, date_of_birth, ssn_last4, mrn, "contact_email?"]
    output: Patient
    side_effects: []
  - method: GET
    path: /charity-care/patients/{id}
    description: "Fetch one patient"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: /charity-care/patients/{id}/accounts
    description: "List accounts of a patient (FK reverse reachability for PatientAccount.patient_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: PatientAccount[]
    side_effects: []
  - method: GET
    path: /charity-care/patients/{id}/applications
    description: "List applications of a patient (FK reverse reachability for AssistanceApplication.patient_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AssistanceApplication[]
    side_effects: []

  # ---- accounts ----
  - method: POST
    path: /charity-care/accounts
    description: "Create a patient account (encounter charges)"
    roles: [BillingAdministrator]
    code: 201
    input: [patient_id, encounter_date, total_charges_cents, insurance_paid_cents]
    output: PatientAccount
    side_effects: ["computes patient_responsibility_cents; if 0 the account enters RESOLVED"]
  - method: GET
    path: /charity-care/accounts/{id}
    description: "Fetch one account"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: PatientAccount
    side_effects: []
  - method: POST
    path: /charity-care/accounts/{id}/statements
    description: "Issue the FIRST_STATEMENT notice exactly once; starts the 120-day notification and 240-day application windows; posture NOT_IN_COLLECTIONS -> NOTICE_PERIOD"
    roles: [BillingAdministrator]
    code: 201
    input: []
    output: NotificationRecord
    side_effects: ["sets account.first_statement_at = now", "creates NotificationRecord FIRST_STATEMENT", "account posture -> NOTICE_PERIOD", "increments PatientAccount.version by 1"]
  - method: POST
    path: /charity-care/accounts/{id}/payments
    description: "Post a patient payment; recompute derived fields; payment may bring amount_outstanding to 0 (-> RESOLVED)"
    roles: [BillingAdministrator, Patient]
    code: 201
    input: [amount_cents, paid_at, method]
    output: AccountPayment
    side_effects: ["creates AccountPayment POSTED", "recomputes effective_payments_cents / amount_outstanding_cents / overpayment_cents", "if amount_outstanding_cents becomes 0: posture -> RESOLVED and INITIATED CollectionActions -> HALTED", "increments PatientAccount.version by 1"]
  - method: GET
    path: /charity-care/accounts/{id}/payments
    description: "List payments of an account"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AccountPayment[]
    side_effects: []
  - method: POST
    path: /charity-care/accounts/{id}/adjustments
    description: "Post the WRITE_OFF adjustment (and, when retro-eligible, the refund waterfall) for a FINAL determination covering this account. OCC-guarded on the account version."
    roles: [BillingAdministrator]
    code: 201
    input: [determination_id, expected_account_version]
    output: AccountAdjustment
    side_effects: ["creates WRITE_OFF AccountAdjustment POSTED with per-account rounded amount", "recomputes adjusted_balance_cents", "retro-eligible: runs retroactive_refund_waterfall creating REFUND adjustments and updating payments", "posture: ASSISTANCE_HOLD -> RESOLVED if amount_outstanding_cents == 0 (halting INITIATED CollectionActions) else ASSISTANCE_HOLD -> NOTICE_PERIOD", "increments PatientAccount.version by 1"]
  - method: GET
    path: /charity-care/accounts/{id}/adjustments
    description: "List adjustments of an account"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AccountAdjustment[]
    side_effects: []
  - method: POST
    path: /charity-care/accounts/{id}/notices
    description: "Issue a PLAIN_LANGUAGE_SUMMARY or ECA_WARNING notice on the account"
    roles: [BillingAdministrator]
    code: 201
    input: [notice_type, "delivery_channel?"]
    output: NotificationRecord
    side_effects: ["creates NotificationRecord with issued_at = now"]
  - method: GET
    path: /charity-care/accounts/{id}/notices
    description: "List notices of an account (FK reverse reachability for NotificationRecord.account_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: NotificationRecord[]
    side_effects: []
  - method: POST
    path: /charity-care/accounts/{id}/collection-actions
    description: "Initiate an extraordinary collection action; gated by posture ECA_ELIGIBLE and 501(r) windows"
    roles: [CollectionsAgent]
    code: 201
    input: [action_type]
    output: CollectionAction
    side_effects: ["creates CollectionAction INITIATED", "account posture ECA_ELIGIBLE -> ECA_ACTIVE", "increments PatientAccount.version by 1"]
  - method: GET
    path: /charity-care/accounts/{id}/collection-actions
    description: "List collection actions of an account"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: CollectionAction[]
    side_effects: []
  - method: POST
    path: /charity-care/accounts/{id}/evaluate-posture
    description: "Evaluate temporal gates; NOTICE_PERIOD or ASSISTANCE_HOLD -> ECA_ELIGIBLE when 501(r) windows are met and no open application exists"
    roles: [CollectionsAgent, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: PatientAccount
    side_effects: ["posture transition when gates met", "increments PatientAccount.version by 1 on transition"]
  - method: POST
    path: /charity-care/collection-actions/{id}/halt
    description: "Compliance halt of an INITIATED collection action"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: CollectionAction
    side_effects: ["INITIATED -> HALTED, halted_at set"]
  - method: POST
    path: /charity-care/collection-actions/{id}/complete
    description: "Mark an INITIATED collection action completed"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: CollectionAction
    side_effects: ["INITIATED -> COMPLETED"]

  # ---- applications ----
  - method: POST
    path: /charity-care/applications
    description: "Create an assistance application in DRAFT (Patient creates own; counselor on behalf). One open application per patient."
    roles: [Patient, FinancialCounselor]
    code: 201
    input: [patient_id, screening_source, reported_annual_income_cents, reported_liquid_assets_cents]
    output: AssistanceApplication
    side_effects: []
  - method: GET
    path: /charity-care/applications
    description: "List applications with pagination and filters (FK reverse reachability for AssistanceApplication.policy_id)"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: AssistanceApplication[]
    side_effects: []
  - method: GET
    path: /charity-care/applications/{id}
    description: "Fetch one application"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: []
  - method: POST
    path: /charity-care/applications/{id}/submit
    description: "Submit a DRAFT application; pins ACTIVE policy snapshot; freezes ECA posture on patient accounts; issues PLAIN_LANGUAGE_SUMMARY"
    roles: [Patient, FinancialCounselor]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["DRAFT -> SUBMITTED", "pins policy_id/policy_version", "sets submitted_at", "creates PLAIN_LANGUAGE_SUMMARY notice", "patient accounts in {NOTICE_PERIOD, ECA_ELIGIBLE, ECA_ACTIVE} -> ASSISTANCE_HOLD", "increments AssistanceApplication.version by 1"]
  - method: POST
    path: /charity-care/applications/{id}/withdraw
    description: "Withdraw a non-terminal application"
    roles: [Patient, FinancialCounselor]
    code: 200
    input: ["reason?"]
    output: AssistanceApplication
    side_effects: ["-> WITHDRAWN", "ASSISTANCE_HOLD accounts -> NOTICE_PERIOD"]
  - method: POST
    path: /charity-care/applications/{id}/begin-review
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: []
  - method: POST
    path: /charity-care/applications/{id}/request-documents
    description: "UNDER_REVIEW -> PENDING_DOCUMENTS with required doc types and response deadline"
    roles: [FinancialCounselor]
    code: 200
    input: [required_doc_types]
    output: AssistanceApplication
    side_effects: ["sets requested_doc_types and doc_response_deadline", "creates DOC_REQUEST notice"]
  - method: POST
    path: /charity-care/applications/{id}/resume-review
    description: "PENDING_DOCUMENTS -> UNDER_REVIEW when all requested doc types are VERIFIED"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["clears requested_doc_types and doc_response_deadline"]
  - method: POST
    path: /charity-care/applications/{id}/expire
    description: "PENDING_DOCUMENTS -> EXPIRED when the doc response deadline has passed"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: AssistanceApplication
    side_effects: ["-> EXPIRED", "ASSISTANCE_HOLD accounts -> NOTICE_PERIOD"]
  - method: POST
    path: /charity-care/applications/{id}/members
    description: "Add a household member to a DRAFT application"
    roles: [Patient, FinancialCounselor]
    code: 201
    input: [full_name, relationship, age]
    output: HouseholdMember
    side_effects: ["recomputes application.household_size"]
  - method: GET
    path: /charity-care/applications/{id}/members
    description: "List household members of an application"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: HouseholdMember[]
    side_effects: []
  - method: POST
    path: /charity-care/applications/{id}/documents
    description: "Upload a verification document to a non-terminal application"
    roles: [Patient, FinancialCounselor]
    code: 201
    input: [doc_type, period_start, period_end, amount_cents, "household_member_id?"]
    output: VerificationDocument
    side_effects: []
  - method: GET
    path: /charity-care/applications/{id}/notices
    description: "List notices of an application (FK reverse reachability for NotificationRecord.application_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: NotificationRecord[]
    side_effects: []
  - method: POST
    path: /charity-care/applications/{id}/presumptive-screening
    description: "Run presumptive eligibility scoring for a non-responder application (1:1 per application)"
    roles: [FinancialCounselor]
    code: 201
    input: ["income_band_score?", "payment_history_score?", "utilization_score?", "public_benefit_score?", "housing_stability_score?"]
    output: PresumptiveScreening
    side_effects: ["computes propensity_score and outcome (presumptive_eligibility_score)"]
  - method: GET
    path: /charity-care/applications/{id}/presumptive-screening
    description: "Fetch the screening of an application (array of 0 or 1)"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: PresumptiveScreening[]
    side_effects: []

  # ---- documents ----
  - method: GET
    path: /charity-care/documents/{id}
    description: "Fetch one verification document"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: VerificationDocument
    side_effects: []
  - method: GET
    path: /charity-care/documents
    description: "List documents filtered by application and/or household member (FK reverse reachability for VerificationDocument.application_id and .household_member_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: ["application_id?", "household_member_id?", "status?", "limit?", "offset?"]
    output: VerificationDocument[]
    side_effects: []
  - method: POST
    path: /charity-care/documents/{id}/verify
    description: "Verify a SUBMITTED document; BANK_STATEMENT closed-interval overlap check; recomputes verified financials"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: VerificationDocument
    side_effects: ["SUBMITTED -> VERIFIED", "sets verified_by_user_id", "recomputes annualized_verified_income_cents and verified_liquid_assets_cents", "bumps AssistanceApplication.version by 1"]
  - method: POST
    path: /charity-care/documents/{id}/reject
    description: "Reject a SUBMITTED document; cascades UNDER_REVIEW application to PENDING_DOCUMENTS"
    roles: [FinancialCounselor]
    code: 200
    input: [rejection_reason]
    output: VerificationDocument
    side_effects: ["SUBMITTED -> REJECTED", "application UNDER_REVIEW -> PENDING_DOCUMENTS with requested_doc_types += doc_type, deadline reset, DOC_REQUEST notice", "bumps AssistanceApplication.version by 1"]

  # ---- determinations ----
  - method: POST
    path: /charity-care/determinations
    description: "Create a PRELIMINARY determination (computes tier and discount_pct, freezes fpl_pct_snapshot). OCC-guarded on the application version."
    roles: [AssistanceReviewer]
    code: 201
    input: [application_id, basis, covered_account_ids, expected_application_version]
    output: DiscountDetermination
    side_effects: ["computes tier/discount_pct via discount_tier_assignment", "increments AssistanceApplication.version by 1"]
  - method: GET
    path: /charity-care/determinations
    description: "List determinations (FK reverse reachability for DiscountDetermination.application_id and .policy_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: ["application_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: DiscountDetermination[]
    side_effects: []
  - method: GET
    path: /charity-care/determinations/{id}
    description: "Fetch one determination"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: DiscountDetermination
    side_effects: []
  - method: POST
    path: /charity-care/determinations/{id}/finalize
    description: "PRELIMINARY -> FINAL; segregation-of-duties check; application -> APPROVED or DENIED; issues DETERMINATION_LETTER"
    roles: [AssistanceReviewer]
    code: 200
    input: []
    output: DiscountDetermination
    side_effects: ["application UNDER_REVIEW -> APPROVED (tier != INELIGIBLE) or DENIED (INELIGIBLE, hold released)", "creates DETERMINATION_LETTER notice", "sets decided_by_user_id and finalized_at"]
  - method: POST
    path: /charity-care/determinations/{id}/reverse
    description: "FINAL -> REVERSED; reverses POSTED WRITE_OFF adjustments (refunds kept); reopens APPROVED application and any FILED report of the year"
    roles: [AssistanceReviewer, ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: DiscountDetermination
    side_effects: ["WRITE_OFF adjustments POSTED -> REVERSED", "account balances recomputed; RESOLVED accounts with balance > 0 -> NOTICE_PERIOD", "application APPROVED -> UNDER_REVIEW", "FILED CommunityBenefitReport of finalized_at year -> REOPENED with totals_stale=true"]
  - method: GET
    path: /charity-care/determinations/{id}/adjustments
    description: "List adjustments spawned by a determination (FK reverse reachability for AccountAdjustment.determination_id)"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: AccountAdjustment[]
    side_effects: []

  # ---- adjustments ----
  - method: GET
    path: /charity-care/adjustments/{id}
    description: "Fetch one adjustment"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: AccountAdjustment
    side_effects: []
  - method: GET
    path: /charity-care/adjustments
    description: "List adjustments filtered by account / determination / payment (FK reverse reachability for AccountAdjustment.payment_id)"
    roles: [Patient, FinancialCounselor, AssistanceReviewer, BillingAdministrator, ComplianceOfficer]
    code: 200
    input: ["account_id?", "determination_id?", "payment_id?", "adjustment_type?", "limit?", "offset?"]
    output: AccountAdjustment[]
    side_effects: []

  # ---- community benefit reports ----
  - method: POST
    path: /charity-care/community-benefit-reports
    description: "Create an OPEN report for a reporting year; initial totals computed"
    roles: [ComplianceOfficer]
    code: 201
    input: [reporting_year]
    output: CommunityBenefitReport
    side_effects: ["computes totals via community_benefit_aggregation", "totals_stale=false"]
  - method: GET
    path: /charity-care/community-benefit-reports/{id}
    description: "Fetch one report"
    roles: [FinancialCounselor, AssistanceReviewer, BillingAdministrator, CollectionsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: CommunityBenefitReport
    side_effects: []
  - method: POST
    path: /charity-care/community-benefit-reports/{id}/file
    description: "OPEN or REOPENED -> FILED; requires totals_stale=false"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityBenefitReport
    side_effects: ["sets filed_at"]
  - method: POST
    path: /charity-care/community-benefit-reports/{id}/reopen
    description: "FILED -> REOPENED for amendment; sets totals_stale=true"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityBenefitReport
    side_effects: ["sets totals_stale=true"]
  - method: POST
    path: /charity-care/community-benefit-reports/{id}/recompute
    description: "Recompute totals from the POSTED adjustment ledger; clears totals_stale"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityBenefitReport
    side_effects: ["recomputes totals via community_benefit_aggregation", "totals_stale=false"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Patient role acting on a resource whose patient_id != X-User-ID" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "PatientAccount id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "AssistanceApplication id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "FinancialAssistancePolicy id does not exist" }
  - { id: ERR_DETERMINATION_NOT_FOUND, http: 404, condition: "DiscountDetermination id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "VerificationDocument id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "HouseholdMember id does not exist" }
  - { id: ERR_ACTION_NOT_FOUND, http: 404, condition: "CollectionAction id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "CommunityBenefitReport id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "AccountPayment id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, or enum value outside the declared set" }
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "submit requires application in DRAFT" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "begin-review requires SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "request-documents / determination create / finalize require UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_PENDING_DOCUMENTS, http: 409, condition: "resume-review / expire require PENDING_DOCUMENTS" }
  - { id: ERR_APPLICATION_TERMINAL, http: 409, condition: "Operation targets an application in WITHDRAWN, EXPIRED, DENIED (or APPROVED for member/document upload)" }
  - { id: ERR_DOCUMENT_NOT_SUBMITTED, http: 409, condition: "verify/reject require document in SUBMITTED" }
  - { id: ERR_DETERMINATION_NOT_PRELIMINARY, http: 409, condition: "finalize requires PRELIMINARY" }
  - { id: ERR_DETERMINATION_NOT_FINAL, http: 409, condition: "reverse / adjustment creation require FINAL determination" }
  - { id: ERR_POLICY_NOT_DRAFT, http: 409, condition: "activate requires policy in DRAFT" }
  - { id: ERR_POSTURE_NOT_EVALUABLE, http: 409, condition: "evaluate-posture requires NOTICE_PERIOD or ASSISTANCE_HOLD" }
  - { id: ERR_ACCOUNT_NOT_ECA_ELIGIBLE, http: 409, condition: "collection-action creation requires posture ECA_ELIGIBLE" }
  - { id: ERR_ASSISTANCE_HOLD_ACTIVE, http: 409, condition: "An application of the patient is open (SUBMITTED/UNDER_REVIEW/PENDING_DOCUMENTS); ECA posture evaluation and collection actions are frozen" }
  - { id: ERR_ACCOUNT_RESOLVED, http: 409, condition: "Payments not accepted on a RESOLVED account" }
  - { id: ERR_ACTION_NOT_INITIATED, http: 409, condition: "halt/complete require CollectionAction INITIATED" }
  - { id: ERR_ACCOUNT_NOT_IN_COLLECTIONS, http: 409, condition: "complete requires owning account in ECA_ACTIVE or ECA_ELIGIBLE" }
  - { id: ERR_REPORT_NOT_FILEABLE, http: 409, condition: "file requires report OPEN or REOPENED" }
  - { id: ERR_REPORT_NOT_FILED, http: 409, condition: "reopen requires report FILED" }
  - { id: ERR_REPORT_TOTALS_STALE, http: 409, condition: "file blocked until recompute clears totals_stale" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Finalizing reviewer verified a document or ran the screening on the same application" }
  - { id: ERR_ECA_NOTIFICATION_WINDOW_UNMET, http: 422, condition: "Fewer than notification_period_days since first_statement_at, or no ECA_WARNING at least eca_notice_days old" }
  - { id: ERR_DOC_DEADLINE_NOT_REACHED, http: 422, condition: "expire attempted before doc_response_deadline" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "effective_from >= effective_to, or document period_end < period_start" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "Half-open effective window intersects an ACTIVE or SUPERSEDED policy window" }
  - { id: ERR_DOC_PERIOD_OVERLAP, http: 409, condition: "Closed-interval BANK_STATEMENT period overlaps a VERIFIED statement of the same household member" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "mrn already registered" }
  - { id: ERR_DUPLICATE_POLICY_CODE, http: 409, condition: "policy_code already exists" }
  - { id: ERR_REPORT_YEAR_DUPLICATE, http: 409, condition: "A report for reporting_year already exists" }
  - { id: ERR_DUPLICATE_OPEN_APPLICATION, http: 409, condition: "Patient already has an application in DRAFT/SUBMITTED/UNDER_REVIEW/PENDING_DOCUMENTS" }
  - { id: ERR_SCREENING_ALREADY_EXISTS, http: 409, condition: "Application already has a PresumptiveScreening" }
  - { id: ERR_FIRST_STATEMENT_ALREADY_ISSUED, http: 409, condition: "first_statement_at already set" }
  - { id: ERR_HOUSEHOLD_SELF_REQUIRED, http: 422, condition: "No HouseholdMember with relationship=SELF at submit" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "No FinancialAssistancePolicy with status=ACTIVE at submit" }
  - { id: ERR_DOCS_OUTSTANDING, http: 422, condition: "A requested_doc_types entry lacks any VERIFIED document at resume-review" }
  - { id: ERR_INSUFFICIENT_FACTORS, http: 422, condition: "Fewer than 3 non-null presumptive factor scores" }
  - { id: ERR_MEMBER_APPLICATION_MISMATCH, http: 422, condition: "household_member_id belongs to a different application" }
  - { id: ERR_ACCOUNT_PATIENT_MISMATCH, http: 422, condition: "covered_account_ids entry belongs to a different patient" }
  - { id: ERR_VERIFIED_DOCS_REQUIRED, http: 422, condition: "VERIFIED_APPLICATION basis lacks required VERIFIED income and IDENTITY documents" }
  - { id: ERR_PRESCREEN_BELOW_THRESHOLD, http: 422, condition: "PRESUMPTIVE_SCORE basis without a screening, or screening outcome NOT_ELIGIBLE" }
  - { id: ERR_ACCOUNT_NOT_COVERED, http: 422, condition: "Adjustment targets an account not in determination.covered_account_ids" }
  - { id: ERR_DUPLICATE_ADJUSTMENT, http: 409, condition: "A POSTED WRITE_OFF already exists for this (account, determination)" }
  - { id: ERR_INSURANCE_EXCEEDS_CHARGES, http: 422, condition: "insurance_paid_cents > total_charges_cents or negative amounts" }
  - { id: ERR_NONPOSITIVE_AMOUNT, http: 422, condition: "Payment amount_cents <= 0" }
  - { id: ERR_NO_COLLECTIBLE_BALANCE, http: 422, condition: "Target balance is zero (determination coverage, adjustment, or collection action)" }
  - { id: ERR_REFUND_NOT_REVERSIBLE, http: 409, condition: "Reversal attempted on a REFUND adjustment" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "Guarantor patient; acts only on own resources (ownership check priority 4)"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations: ["create/submit/withdraw own application", "add own household members and documents", "post payments to own account", "read own patients/accounts/applications/documents/determinations/notices/payments/adjustments"]
  - name: FinancialCounselor
    description: "Intake staff; shepherds applications and verifies documents; cannot finalize determinations (segregation of duties)"
    identity: "opaque"
    exclusive_operations: ["begin-review", "request-documents", "resume-review", "expire", "document verify/reject", "presumptive-screening", "register patients"]
    shared_operations: ["create/submit/withdraw applications on behalf", "add members and documents on behalf", "read access"]
  - name: AssistanceReviewer
    description: "Determination authority; cannot touch documents or screenings (segregation of duties)"
    identity: "opaque"
    exclusive_operations: ["create determinations", "finalize determinations"]
    shared_operations: ["reverse determinations", "read access"]
  - name: BillingAdministrator
    description: "Ledger staff; owns accounts, statements, notices, payments posting, adjustments"
    identity: "opaque"
    exclusive_operations: ["create accounts", "issue first statement", "issue notices", "post account adjustments"]
    shared_operations: ["post payments", "evaluate-posture", "read access"]
  - name: CollectionsAgent
    description: "Collections staff; initiates and completes ECAs under 501(r) gates"
    identity: "opaque"
    exclusive_operations: ["create collection actions", "complete collection actions"]
    shared_operations: ["evaluate-posture", "read access"]
  - name: ComplianceOfficer
    description: "Compliance owner; policies, reports, ECA halt, logical clock, determination reversal override"
    identity: "opaque"
    exclusive_operations: ["create/activate policies", "halt collection actions", "community benefit report lifecycle", "set logical clock"]
    shared_operations: ["reverse determinations", "register patients", "read access"]
