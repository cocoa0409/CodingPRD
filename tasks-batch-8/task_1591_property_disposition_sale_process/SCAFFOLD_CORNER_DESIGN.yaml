    instances:
      - name: hold_sell_dcf_variant_literal
        claim_type: correct_result
        grounds:
          - "calculations.hold_sell_valuation"
        distinguishing_aspect: "with selected_method DCF on Alpha inputs (noi 250,000,000; g 300bps; d 800bps; exit 600bps; 5y), hold_value_dcf_cents == 4472790059 while hold_value_direct_cap_cents == 4545454545 — both variants computed, selection picks DCF, recommendation SELL."
        test_recipe:
          setup: ["Alpha asset exists"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 3000000000, loan_rate_bps: 650, loan_maturity_date: "2030-06-30T00:00:00Z", monthly_debt_service_cents: 19000000, remaining_term_months: 46, prepayment_type: YIELD_MAINTENANCE, prepayment_lockout_until: "2026-01-01T00:00:00Z", defeasance_allowed: true, defeasance_fee_cents: 50000000 }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
          trigger:
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 550, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DCF, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id, h_dcf: $.data.hold_value_dcf_cents, h_dc: $.data.hold_value_direct_cap_cents, h_sel: $.data.hold_value_cents, rec: $.data.recommendation, gap: $.data.value_gap_cents } }
          assert:
            - "hold_value_direct_cap_cents == 4545454545 (250,000,000 x 10000 / 550, round_half_up)"
            - "hold_value_dcf_cents == 4472790059 (float accumulation, single final rounding)"
            - "hold_value_cents == 4472790059 (DCF selected); value_gap_cents == 527209941 (sell_net 5,000,000,000 - hold)"
            - "recommendation == SELL (sell_net x 100 >= hold x 105: 500000000000 >= 469642956195)"

      - name: recommendation_hysteresis_band_boundaries
        claim_type: constants_applied
        grounds:
          - "calculations.hold_sell_valuation"
        distinguishing_aspect: "on a round-number asset (hold_value 2,000,000,000) the band edges are inclusive: sell_net == 2,100,000,000 -> SELL; == 1,900,000,000 -> HOLD; == 2,000,000,000 -> MARGINAL — three sequential superseding analyses pin both edges and the interior."
        test_recipe:
          setup: ["Gamma asset (noi 100,000,000, cap 500bps -> hold 2,000,000,000); analyses created in sequence, each superseding the prior DRAFT via fresh OCC version"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Gamma", market: "Denver", asset_type: MULTIFAMILY, noi_cents: 100000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 2000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { g_id: $.data.id, g_v: $.data.version } }
          trigger:
