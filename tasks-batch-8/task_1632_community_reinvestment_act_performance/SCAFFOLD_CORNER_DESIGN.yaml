              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/appeal"
              payload: { appeal_reason: "new CD evidence submitted" }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles/${ex_id}/reopen-fieldwork"
