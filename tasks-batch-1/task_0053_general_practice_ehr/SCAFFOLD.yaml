scenario: "53. General Practice EHR & Visit: patient record, primary care provider binding, consultation/physical/vaccination, CPT billing codes, electronic prescription EPCS, referral, patient portal, HEDIS quality metrics"
domain_name: general-practice-ehr
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Patient, Provider, Visit, Prescription, Referral, HedisMeasure,
  # PortalAccount) linked by foreign keys in request bodies, not URL nesting.
  # CptCode is shared reference configuration. ChargeLine is the one nested child
  # (under Visit) because a charge line has no identity outside its visit.

  state_machine_shape: branching
  # Visit: SCHEDULED forks to CHECKED_IN / CANCELLED / NO_SHOW; CODED reverts to
  # IN_PROGRESS (reopen). Prescription: PENDING_SIGNATURE reverts to DRAFT (revise).
  # Referral: REQUESTED forks to AUTHORIZED / DENIED. PortalAccount: ACTIVE<->SUSPENDED
  # cycle. Non-linear on four different entities.

  relationship_patterns:
    - one_to_many        # Provider -> Patients (panel); Visit -> ChargeLines; Patient -> Visits/Prescriptions/Referrals/HedisMeasures
    - cross_aggregate    # Prescription.visit_id and Referral references span aggregate roots
    - self_referential   # Referral.referring_provider_id and Visit.provider_id both point at Provider

  role_model: peer_roles
  # Provider owns clinical acts (visit conduct, coding, EPCS); FrontDesk owns
  # registration/scheduling/panel binding; Biller owns billing finalization;
  # Patient owns portal self-service; QualityAnalyst owns HEDIS evaluation.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: 10-digit National Provider Identifier
        constraints: required; exactly 10 digits; unique across Providers
      - name: full_name
        type: string
        source: input
        description: Provider display name
        constraints: required, non-empty
      - name: specialty
        type: enum
        source: input
        description: Provider specialty
        default: FAMILY_MEDICINE
        constraints: one of {FAMILY_MEDICINE, INTERNAL_MEDICINE, PEDIATRICS}
      - name: dea_number
        type: string
        source: input
        description: DEA registration number; required to sign controlled-substance EPCS prescriptions
        default: null
        constraints: when present, 9 chars (2 letters + 7 digits)
      - name: epcs_enrolled
        type: boolean
        source: input
        description: Whether provider has completed EPCS two-factor identity proofing
        default: false
      - name: panel_capacity
        type: integer
        source: input
        description: Maximum number of ACTIVE patients that may be bound to this provider as PCP
        default: 2000
        constraints: integer >= 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state (see §1.2)
        default: ACTIVE
        constraints: one of {ACTIVE, INACTIVE}
      - name: panel_size
        type: integer
        source: computed
        description: Count of Patients whose pcp_id == this Provider.id AND Patient.status == ACTIVE (derived; see §1.3 panel_size)
      - name: controlled_rx_count
        type: integer
        source: computed
        description: Count of this provider's Prescriptions with schedule in {C_II,C_III,C_IV,C_V} currently in {SIGNED,TRANSMITTED,DISPENSED}
        default: 0

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: first_name
        type: string
        source: input
        description: Patient given name
        constraints: required, non-empty
      - name: last_name
        type: string
        source: input
        description: Patient family name
        constraints: required, non-empty
      - name: date_of_birth
        type: string
        source: input
        description: Date of birth, ISO date YYYY-MM-DD
        constraints: required; must be on or before current clock date
      - name: sex
        type: enum
        source: input
        description: Administrative sex used for HEDIS sex-specific measures
        constraints: required; one of {M, F}
      - name: pcp_id
        type: string
        source: system
        description: "FK -> Provider.id; the bound primary care provider; null when unassigned. Set only via panel-bind endpoint."
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state (see §1.2)
        default: ACTIVE
        constraints: one of {ACTIVE, INACTIVE}
      - name: lifetime_charges_cents
        type: integer
        source: computed
        description: Running sum of billed_total_cents over this patient's FINALIZED Visits (derived; see §1.3 patient_lifetime_charges)
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: lifetime_charges_cents minus total payments recorded for this patient (derived; see §1.3 patient_outstanding_balance)
        default: 0
      - name: active_medication_count
        type: integer
        source: computed
        description: Count of this patient's Prescriptions currently in DISPENSED (derived)
        default: 0
      - name: open_care_gaps
        type: integer
        source: computed
        description: Count of this patient's HedisMeasures with status == GAP for the current measurement_year (derived; see §1.3 open_care_gaps)
        default: 0

  - name: CptCode
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: CPT/HCPCS billing code
        constraints: required; 5 chars; unique across CptCodes
      - name: short_description
        type: string
        source: input
        description: Human-readable code description
        constraints: required, non-empty
      - name: category
        type: enum
        source: input
        description: Billing category controlling fee selection
        constraints: required; one of {EM, PREVENTIVE, VACCINE_ADMIN, PROCEDURE}
      - name: base_fee_cents
        type: integer
        source: input
        description: Base fee in cents before units and modifier adjustment
        constraints: required; integer >= 0
      - name: requires_em_level
        type: boolean
        source: input
        description: When true, the charge line must supply an em_level (1-5) that selects a tiered multiplier
        default: false

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being seen"
        constraints: required
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the rendering provider"
        constraints: required
      - name: visit_type
        type: enum
        source: input
        description: Visit type
        constraints: required; one of {CONSULTATION, PHYSICAL, VACCINATION}
      - name: scheduled_start
        type: datetime
        source: input
        description: Half-open slot start (inclusive), ISO 8601 UTC
        constraints: required
      - name: scheduled_end
        type: datetime
        source: input
        description: Half-open slot end (exclusive), ISO 8601 UTC
        constraints: required; must be strictly after scheduled_start
      - name: vaccine_code
        type: string
        source: input
        description: For VACCINATION visits, the immunization product code (e.g., FLU, MMR); null otherwise
        default: null
        constraints: required when visit_type == VACCINATION
      - name: status
        type: enum
        source: system
        description: Lifecycle state (see §1.2)
        default: SCHEDULED
        constraints: one of {SCHEDULED, CHECKED_IN, IN_PROGRESS, CODED, FINALIZED, CANCELLED, NO_SHOW}
      - name: billed_total_cents
        type: integer
        source: computed
        description: Sum of ChargeLine.amount_cents at FINALIZED; provisional preview at CODED (see §1.3 visit_billed_total)
        default: 0

  - name: ChargeLine
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: system
        description: "FK -> Visit.id; the owning visit (from path)"
        constraints: required
      - name: cpt_code
        type: string
        source: input
        description: "Natural-key reference to CptCode.code (the billing code string, not a server id); the billed code"
        constraints: required; must reference an existing CptCode.code
      - name: units
        type: integer
        source: input
        description: Number of units billed
        default: 1
        constraints: integer >= 1
      - name: em_level
        type: integer
        source: input
        description: Evaluation & Management level 1-5; required when the referenced CptCode.requires_em_level is true
        default: null
        constraints: when present, integer in [1,5]
      - name: amount_cents
        type: integer
        source: computed
        description: Computed line amount (see §1.3 charge_line_amount); input value ignored
        default: 0

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient prescribed to"
        constraints: required
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the prescriber"
        constraints: required
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the encounter the prescription was written during"
        constraints: required
      - name: drug_name
        type: string
        source: input
        description: Prescribed medication name
        constraints: required, non-empty
      - name: schedule
        type: enum
        source: input
        description: DEA controlled-substance schedule; NON_CONTROLLED for ordinary drugs
        default: NON_CONTROLLED
        constraints: one of {NON_CONTROLLED, C_II, C_III, C_IV, C_V}
      - name: two_factor_token
        type: string
        source: input
        description: Two-factor authentication token supplied at signing; required for controlled-substance EPCS signing
        default: null
      - name: status
        type: enum
        source: system
        description: EPCS lifecycle state (see §1.2)
        default: DRAFT
        constraints: one of {DRAFT, PENDING_SIGNATURE, SIGNED, TRANSMITTED, DISPENSED, VOIDED}

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient referred"
        constraints: required
      - name: referring_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider creating the referral"
        constraints: required
      - name: target_specialty
        type: enum
        source: input
        description: Specialty the patient is referred to
        constraints: required; one of {CARDIOLOGY, DERMATOLOGY, ORTHOPEDICS, ENDOCRINOLOGY}
      - name: priority
        type: enum
        source: input
        description: Referral urgency controlling authorization window
        default: ROUTINE
        constraints: one of {ROUTINE, URGENT}
      - name: status
        type: enum
        source: system
        description: Lifecycle state (see §1.2)
        default: REQUESTED
        constraints: one of {REQUESTED, AUTHORIZED, SCHEDULED, COMPLETED, DENIED, EXPIRED, CANCELLED}
      - name: authorization_expires_at
        type: datetime
        source: system
        description: When set at AUTHORIZED, the UTC instant after which an unscheduled referral EXPIRES (see §1.3 referral_auth_window)
        default: null

  - name: PortalAccount
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the owning patient (one portal account per patient)"
        constraints: required; unique across PortalAccounts
      - name: login_email
        type: string
        source: input
        description: Portal login email
        constraints: required; unique across PortalAccounts
      - name: status
        type: enum
        source: system
        description: Lifecycle state (see §1.2)
        default: INVITED
        constraints: one of {INVITED, ACTIVE, SUSPENDED, DEACTIVATED}
      - name: activation_token
        type: string
        source: system
        description: Server-issued token consumed to move INVITED -> ACTIVE
      - name: failed_login_count
        type: integer
        source: system
        description: Count of failed activations; at threshold the account auto-SUSPENDS
        default: 0

  - name: HedisMeasure
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the measured patient"
        constraints: required
      - name: measure_type
        type: enum
        source: input
        description: HEDIS measure
        constraints: required; one of {CIS_FLU, BCS_MAMMOGRAM, CBP_BP_CONTROL, MED_ADHERENCE}
      - name: measurement_year
        type: integer
        source: input
        description: Measurement year (calendar year)
        constraints: required; integer >= 2000
      - name: method
        type: enum
        source: input
        description: Measurement method; ADMINISTRATIVE uses claims only, HYBRID supplements with chart-confirmed events
        default: ADMINISTRATIVE
        constraints: one of {ADMINISTRATIVE, HYBRID}
      - name: eligible
        type: boolean
        source: computed
        description: Whether the patient is in the eligible population (see §1.3 hedis_eligibility); age/sex windowed
        default: false
      - name: status
        type: enum
        source: system
        description: Measure status (see §1.2)
        default: GAP
        constraints: one of {GAP, NUMERATOR_COMPLIANT, EXCLUDED}
      - name: chart_confirmed
        type: boolean
        source: input
        description: For HYBRID method, whether a chart review confirmed the qualifying event (counts toward numerator even without a claim)
        default: false

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Provider
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /providers/{id}/deactivate"
        actor: FrontDesk
        preconditions:
          - "Provider.status == ACTIVE"
        side_effects:
          - "Every Patient with pcp_id == this Provider.id has pcp_id set to null and is thereby unbound"
          - "Provider.panel_size recomputed to 0"
          - "increments Provider.version by 1"

  - entity: Patient
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /patients/{id}/deactivate"
        actor: FrontDesk
        preconditions:
          - "Patient.status == ACTIVE"
          - "Patient has no Visit in {SCHEDULED, CHECKED_IN, IN_PROGRESS, CODED}"
        side_effects:
          - "If pcp_id was non-null, that Provider.panel_size is recomputed (decremented by 1)"
          - "Patient.pcp_id set to null"
          - "increments Patient.version by 1"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /visits/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Visit.status == SCHEDULED"
          - "Provider (Visit.provider_id).status == ACTIVE  [cross-entity: Visit depends on Provider]"
          - "Patient (Visit.patient_id).status == ACTIVE"
        side_effects:
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Visit.status == SCHEDULED"
        side_effects:
          - "Provider time slot [scheduled_start, scheduled_end) is released"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /visits/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Visit.status == SCHEDULED"
          - "current clock >= scheduled_end"
        side_effects:
          - "Provider time slot is released"
          - "increments Visit.version by 1"
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /visits/{id}/start"
        actor: Provider
        preconditions:
          - "Visit.status == CHECKED_IN"
          - "acting Provider.id == Visit.provider_id"
        side_effects:
          - "increments Visit.version by 1"
      - from: IN_PROGRESS
        to: CODED
        trigger: "POST /visits/{id}/code"
        actor: Provider
        preconditions:
          - "Visit.status == IN_PROGRESS"
          - "Visit has at least one ChargeLine"
        side_effects:
          - "Visit.billed_total_cents set to the PROVISIONAL variant of visit_billed_total (§1.3)"
          - "increments Visit.version by 1"
      - from: CODED
        to: IN_PROGRESS
        trigger: "POST /visits/{id}/reopen"
        actor: Provider
        preconditions:
          - "Visit.status == CODED"
        side_effects:
          - "Visit.billed_total_cents reset to 0"
          - "increments Visit.version by 1"
        note: "Revert edge — lets a provider add/correct charge lines after coding."
      - from: CODED
        to: FINALIZED
        trigger: "POST /visits/{id}/finalize"
        actor: Biller
        preconditions:
          - "Visit.status == CODED"
        side_effects:
          - "CHAIN-1 link 1: Visit.billed_total_cents set to the FINAL variant of visit_billed_total (§1.3); all ChargeLine.amount_cents locked"
          - "CHAIN-1 link 2: Patient.lifetime_charges_cents and Patient.outstanding_balance_cents recomputed (now include this visit's billed_total_cents)"
          - "CHAIN-1 link 2 (cont.): if visit_type == PHYSICAL or VACCINATION and a matching GAP HedisMeasure exists for the patient and current measurement_year, that HedisMeasure.status flips to NUMERATOR_COMPLIANT"
          - "CHAIN-1 link 3: the flip of that HedisMeasure causes Patient.open_care_gaps to be recomputed (decremented)"
          - "increments Visit.version by 1"
        note: "Origin of transitive cascade CHAIN-1 (depth 3): ChargeLine totals -> Patient ledger + HedisMeasure flip -> Patient.open_care_gaps recompute."

  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [DISPENSED, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /prescriptions/{id}/submit"
        actor: Provider
        preconditions:
          - "Prescription.status == DRAFT"
          - "Visit (Prescription.visit_id).status in {IN_PROGRESS, CODED, FINALIZED}  [cross-entity: Prescription depends on Visit]"
        side_effects:
          - "increments Prescription.version by 1"
      - from: PENDING_SIGNATURE
        to: DRAFT
        trigger: "POST /prescriptions/{id}/revise"
        actor: Provider
        preconditions:
          - "Prescription.status == PENDING_SIGNATURE"
        side_effects:
          - "increments Prescription.version by 1"
        note: "Revert edge — return to DRAFT to correct drug/schedule before signing."
      - from: PENDING_SIGNATURE
        to: SIGNED
        trigger: "POST /prescriptions/{id}/sign"
        actor: Provider
        preconditions:
          - "Prescription.status == PENDING_SIGNATURE"
          - "acting Provider.id == Prescription.provider_id"
          - "If schedule != NON_CONTROLLED: prescriber Provider.epcs_enrolled == true AND Provider.dea_number present AND a non-empty two_factor_token supplied [EPCS safety]"
        side_effects:
          - "Provider.controlled_rx_count recomputed if schedule != NON_CONTROLLED"
          - "increments Prescription.version by 1"
      - from: SIGNED
        to: TRANSMITTED
        trigger: "POST /prescriptions/{id}/transmit"
        actor: Provider
        preconditions:
          - "Prescription.status == SIGNED"
        side_effects:
          - "increments Prescription.version by 1"
      - from: TRANSMITTED
        to: DISPENSED
        trigger: "POST /prescriptions/{id}/dispense"
        actor: Provider
        preconditions:
          - "Prescription.status == TRANSMITTED"
        side_effects:
          - "CHAIN-2 link 1: Patient.active_medication_count recomputed (incremented)"
          - "CHAIN-2 link 2: if a GAP MED_ADHERENCE HedisMeasure exists for the patient in the current measurement_year and active_medication_count >= MED_ADHERENCE_MIN_FILLS (= 1), that HedisMeasure.status flips to NUMERATOR_COMPLIANT and Patient.open_care_gaps is recomputed"
          - "increments Prescription.version by 1"
        note: "Origin of transitive cascade CHAIN-2 (depth 2): Patient.active_medication_count -> HedisMeasure flip + open_care_gaps recompute."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /prescriptions/{id}/void"
        actor: Provider
        preconditions:
          - "Prescription.status in {DRAFT, PENDING_SIGNATURE, SIGNED, TRANSMITTED}"
        side_effects:
          - "Provider.controlled_rx_count recomputed if schedule != NON_CONTROLLED"
          - "increments Prescription.version by 1"
        note: "Void edge reachable from any non-terminal state; modeled here from DRAFT, condition lists the full from-set."

  - entity: Referral
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED, EXPIRED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /referrals/{id}/authorize"
        actor: FrontDesk
        preconditions:
          - "Referral.status == REQUESTED"
          - "Patient (Referral.patient_id).pcp_id is non-null  [cross-entity: Referral depends on Patient PCP binding]"
        side_effects:
          - "Referral.authorization_expires_at set per §1.3 referral_auth_window"
          - "increments Referral.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /referrals/{id}/deny"
        actor: FrontDesk
        preconditions:
          - "Referral.status == REQUESTED"
        side_effects:
          - "increments Referral.version by 1"
      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "POST /referrals/{id}/schedule"
        actor: FrontDesk
        preconditions:
          - "Referral.status == AUTHORIZED"
          - "current clock < authorization_expires_at"
        side_effects:
          - "increments Referral.version by 1"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "POST /referrals/{id}/expire"
        actor: system
        preconditions:
          - "Referral.status == AUTHORIZED"
          - "current clock >= authorization_expires_at"
        side_effects:
          - "increments Referral.version by 1"
        note: "System sweep (invoked via the expire endpoint) once the auth window has elapsed."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /referrals/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "Referral.status == SCHEDULED"
        side_effects:
          - "increments Referral.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: Provider
        preconditions:
          - "Referral.status in {REQUESTED, AUTHORIZED}"
          - "acting Provider.id == Referral.referring_provider_id"
        side_effects:
          - "increments Referral.version by 1"
        note: "Cancel reachable from REQUESTED or AUTHORIZED; condition lists the from-set."

  - entity: PortalAccount
    initial_state: INVITED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /portal-accounts/{id}/activate"
        actor: Patient
        preconditions:
          - "PortalAccount.status == INVITED"
          - "supplied activation_token == PortalAccount.activation_token"
        side_effects:
          - "PortalAccount.failed_login_count reset to 0"
          - "increments PortalAccount.version by 1"
      - from: INVITED
        to: SUSPENDED
        trigger: "POST /portal-accounts/{id}/activate (failed token)"
        actor: system
        preconditions:
          - "PortalAccount.status == INVITED"
          - "supplied activation_token != PortalAccount.activation_token"
          - "failed_login_count + 1 >= PORTAL_LOCKOUT_THRESHOLD (= 3)"
        side_effects:
          - "PortalAccount.failed_login_count incremented; on reaching threshold the auto-SUSPEND fires"
          - "increments PortalAccount.version by 1"
        note: "Auto-transition: an activation attempt with a wrong token that pushes failed_login_count to the threshold suspends the account."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /portal-accounts/{id}/suspend"
        actor: FrontDesk
        preconditions:
          - "PortalAccount.status == ACTIVE"
        side_effects:
          - "increments PortalAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /portal-accounts/{id}/reinstate"
        actor: FrontDesk
        preconditions:
          - "PortalAccount.status == SUSPENDED"
        side_effects:
          - "PortalAccount.failed_login_count reset to 0"
          - "increments PortalAccount.version by 1"
        note: "Cyclic edge — SUSPENDED returns to ACTIVE; pairs with ACTIVE->SUSPENDED."
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /portal-accounts/{id}/deactivate"
        actor: FrontDesk
        preconditions:
          - "PortalAccount.status in {ACTIVE, SUSPENDED, INVITED}"
        side_effects:
          - "increments PortalAccount.version by 1"
        note: "Terminal deactivate reachable from any non-terminal state; condition lists the from-set."

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: panel-bind-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /providers/{id}/panel"
    occ_field: "expected_provider_version"
    description: |
      Binding a Patient to a Provider as PCP against a Provider whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just bound a different patient (consuming an
      open panel slot and advancing panel_size toward panel_capacity), so the
      current writer's view of the provider — including its remaining capacity —
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: charge_line_amount
    trigger: "Computed when a ChargeLine is created and re-evaluated whenever the visit is coded or finalized"
    algorithm: tiered_pricing
    formula: |
      base = CptCode(cpt_code).base_fee_cents
      if CptCode.requires_em_level:
          # E/M tiered multiplier selected by em_level (combinatorial mode (a)):
          mult = EM_LEVEL_MULTIPLIER[em_level]   # >=3 inputs: base, em_level tier, units
      else:
          mult = 1.0
      raw = base * mult * units
      amount_cents = round_half_up(raw)          # round THIS line to whole cents
    input_set: "Single ChargeLine plus its referenced CptCode"
    constants:
      EM_LEVEL_MULTIPLIER: { 1: 0.5, 2: 0.8, 3: 1.0, 4: 1.4, 5: 2.0 }
    precision: "whole cents, round_half_up at the per-line level"
    variants:
      - name: standard
        when: "always"
        difference: "single algorithm; the per-line rounding here is the pinned inner step consumed by visit_billed_total mode (b)"

  - name: visit_billed_total
    trigger: "PROVISIONAL on POST /visits/{id}/code; FINAL on POST /visits/{id}/finalize"
    algorithm: aggregation
    formula: |
      # Mode (b): rounding order is pinned. Each ChargeLine.amount_cents is ALREADY
      # rounded per-line by charge_line_amount. visit_billed_total sums those
      # already-rounded line amounts (round-per-line THEN sum), NOT sum-then-round.
      lines = ChargeLines of this Visit
      provisional = sum(line.amount_cents for line in lines)
      # FINAL applies the network contractual adjustment AFTER summing:
      final = round_half_up(provisional * (1 - CONTRACTUAL_ADJ_RATE))
    input_set: "All ChargeLines belonging to the Visit (no status filter — a visit has no partial lines)"
    constants:
      CONTRACTUAL_ADJ_RATE: 0.10
    precision: "whole cents, round_half_up; sum of per-line-rounded amounts, then single adjustment rounding at finalize"
    variants:
      - name: provisional
        when: "Visit coded (status SCHEDULED..CODED preview)"
        difference: "Pure sum of per-line-rounded amounts; no contractual adjustment applied. Written to billed_total_cents at CODED."
      - name: final
        when: "Visit finalized"
        difference: "Provisional sum multiplied by (1 - CONTRACTUAL_ADJ_RATE) then rounded once. Differs from provisional by the contractual write-down. Written to billed_total_cents at FINALIZE."

  - name: hedis_compliance_rate
    trigger: "GET /hedis/rate computed on demand over the eligible population for a measure_type + measurement_year"
    algorithm: aggregation
    formula: |
      # Different entity domain from visit_billed_total: aggregates HedisMeasure rows
      # across Patients, not ChargeLines on one Visit.
      denominator = count(HedisMeasure m where m.measure_type==T and m.measurement_year==Y
                          and m.eligible==true and m.status != EXCLUDED)
      if method == ADMINISTRATIVE:
          numerator = count(such m where m.status == NUMERATOR_COMPLIANT)
      elif method == HYBRID:
          # HYBRID also counts chart-confirmed events even if status is still GAP
          numerator = count(such m where m.status == NUMERATOR_COMPLIANT
                            OR (m.status == GAP and m.chart_confirmed == true))
      rate = 0 if denominator == 0 else round_half_up(numerator * 10000 / denominator) / 100.0
    input_set: "HedisMeasure rows filtered by measure_type, measurement_year, eligible==true, status != EXCLUDED"
    constants:
      EXCLUDED_FROM_DENOMINATOR: ["EXCLUDED"]
    precision: "rate as a percentage with 2 decimals, round_half_up; integer 0 when denominator == 0 (empty-set boundary)"
    variants:
      - name: administrative
        when: "method == ADMINISTRATIVE"
        difference: "Numerator counts only NUMERATOR_COMPLIANT rows (claims-confirmed)."
      - name: hybrid
        when: "method == HYBRID"
        difference: "Numerator additionally counts GAP rows whose chart_confirmed==true; yields a higher rate than administrative on identical data."

  - name: hedis_eligibility
    trigger: "Computed when a HedisMeasure is created and re-evaluated on read"
    algorithm: threshold
    formula: |
      age = floor( (Dec31_of_measurement_year - Patient.date_of_birth) / 365.25 days )
      window = MEASURE_AGE_WINDOW[measure_type]   # {min_age, max_age} inclusive both ends
      sex_ok = (measure_type != BCS_MAMMOGRAM) or (Patient.sex == 'F')
      eligible = sex_ok and (window.min_age <= age <= window.max_age)
    input_set: "Single HedisMeasure plus its Patient (age at Dec 31 of measurement_year)"
    constants:
      MEASURE_AGE_WINDOW:
        CIS_FLU: { min_age: 0, max_age: 18 }
        BCS_MAMMOGRAM: { min_age: 50, max_age: 74 }
        CBP_BP_CONTROL: { min_age: 18, max_age: 85 }
        MED_ADHERENCE: { min_age: 18, max_age: 120 }
    precision: "age in whole years; both window bounds inclusive (>= min AND <= max)"

  - name: panel_size
    trigger: "Recomputed on panel bind, patient deactivate, provider deactivate"
    algorithm: aggregation
    formula: |
      panel_size = count(Patient p where p.pcp_id == Provider.id and p.status == ACTIVE)
    input_set: "Patients bound to this Provider with status ACTIVE only (INACTIVE excluded)"
    precision: "integer count"

  - name: patient_lifetime_charges
    trigger: "Recomputed on Visit finalize (CHAIN-1 link 2)"
    algorithm: aggregation
    formula: |
      lifetime_charges_cents = sum(v.billed_total_cents for v in Patient's Visits where v.status == FINALIZED)
    input_set: "FINALIZED Visits of this Patient only"
    precision: "integer cents"

  - name: patient_outstanding_balance
    trigger: "Recomputed on Visit finalize and on payment recording"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = lifetime_charges_cents - sum(payment.amount_cents recorded for this Patient)
    input_set: "Patient.lifetime_charges_cents minus all recorded payments"
    precision: "integer cents; may be negative if overpaid (credit)"

  - name: open_care_gaps
    trigger: "Recomputed whenever a HedisMeasure status changes (CHAIN-1 link 3, CHAIN-2 link 2)"
    algorithm: aggregation
    formula: |
      open_care_gaps = count(HedisMeasure m for this Patient where m.status == GAP
                             and m.measurement_year == CURRENT_MEASUREMENT_YEAR and m.eligible == true)
    input_set: "Eligible GAP HedisMeasures of this Patient in the current measurement_year"
    constants:
      CURRENT_MEASUREMENT_YEAR: 2026
    precision: "integer count"

  - name: referral_auth_window
    trigger: "Set on POST /referrals/{id}/authorize"
    algorithm: threshold
    formula: |
      days = URGENT_AUTH_DAYS if priority == URGENT else ROUTINE_AUTH_DAYS
      authorization_expires_at = authorize_clock_time + days (as whole days)
    input_set: "Single Referral at authorization, plus current clock"
    constants:
      ROUTINE_AUTH_DAYS: 90
      URGENT_AUTH_DAYS: 14
    precision: "datetime; expiry strictly compared (scheduling requires clock < expires_at; expire requires clock >= expires_at)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /providers, POST /patients, POST /cpt-codes (which still require headers but are open to the listed roles)"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resource exists (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (patient_id, provider_id, visit_id, cpt_code) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /visits, POST /visits/{id}/charge-lines, POST /prescriptions, POST /referrals, POST /providers/{id}/panel, POST /hedis-measures, POST /portal-accounts"

  - priority: 5
    category: existence
    check: "Required input fields present and well-typed; enum values within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Acting entity_backed user owns / is authorized over the resource (Provider.id == Visit.provider_id for start/code; == Prescription.provider_id for sign; Patient owns PortalAccount)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /visits/{id}/start, POST /visits/{id}/code, POST /prescriptions/{id}/sign, POST /portal-accounts/{id}/activate"

  - priority: 8
    category: business_safety
    check: "EPCS signing of a controlled substance requires prescriber epcs_enrolled==true, dea_number present, and a non-empty two_factor_token"
    error_id: ERR_EPCS_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /prescriptions/{id}/sign"

  - priority: 9
    category: business_safety
    check: "A VACCINATION visit's check-in is rejected if the same patient already has a CHECKED_IN-or-later visit for the same vaccine_code whose scheduled_start is within VACCINE_MIN_INTERVAL_DAYS (= 28) before this visit's scheduled_start (minimum-spacing/gap semantics)"
    error_id: ERR_VACCINE_INTERVAL_VIOLATION
    http_status: 409
    applies_to: "POST /visits/{id}/check-in"

  - priority: 10
    category: business_temporal
    check: "Visit scheduling rejected if [scheduled_start, scheduled_end) overlaps any non-cancelled, non-no-show Visit of the same provider (half-open overlap: touching endpoints do NOT overlap)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /visits"

  - priority: 11
    category: business_constraint
    check: "Referral authorization rejected when the patient has no bound PCP (pcp_id is null)"
    error_id: ERR_NO_PCP_BOUND
    http_status: 409
    applies_to: "POST /referrals/{id}/authorize"

  - priority: 12
    category: business_fiscal
    check: "Panel bind rejected when binding would make Provider.panel_size >= panel_capacity (capacity is a hard ceiling: at-capacity rejects)"
    error_id: ERR_PANEL_AT_CAPACITY
    http_status: 409
    applies_to: "POST /providers/{id}/panel"

  - priority: 13
    category: business_constraint
    check: "Optimistic concurrency: expected_provider_version must equal the live Provider.version on panel bind"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /providers/{id}/panel"

  - priority: 14
    category: state
    check: "Patient deactivation rejected while the patient has any Visit in a non-terminal state {SCHEDULED, CHECKED_IN, IN_PROGRESS, CODED}"
    error_id: ERR_PATIENT_HAS_OPEN_VISITS
    http_status: 409
    applies_to: "POST /patients/{id}/deactivate"

  - priority: 15
    category: business_temporal
    check: "Scheduling an AUTHORIZED referral is rejected when the current clock has reached authorization_expires_at (clock >= expiry)"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 409
    applies_to: "POST /referrals/{id}/schedule"

  - priority: 16
    category: business_constraint
    check: "Uniqueness: provider npi, cpt code, portal account per patient, and portal login_email must be unique"
    error_id: ERR_DUPLICATE_NPI
    http_status: 409
    applies_to: "POST /providers, POST /cpt-codes, POST /portal-accounts"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Register a provider"
    roles: [FrontDesk]
    code: 201
    input: [npi, full_name, "specialty?", "dea_number?", "epcs_enrolled?", "panel_capacity?"]
    output: Provider
    side_effects: ["Provider created in ACTIVE with panel_size 0"]
  - method: GET
    path: "/providers/{id}"
    description: "Fetch a provider"
    roles: [FrontDesk, Provider, Biller, QualityAnalyst]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers"
    description: "List providers"
    roles: [FrontDesk, Provider, Biller, QualityAnalyst]
    code: 200
    input: ["specialty?", "status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: POST
    path: "/providers/{id}/deactivate"
    description: "Deactivate a provider; unbinds its panel"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Provider
    side_effects: ["All bound Patients have pcp_id cleared", "panel_size -> 0", "increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/panel"
    description: "Bind a patient to this provider as PCP (CREATE-with-supersede on shrinking capacity)"
    roles: [FrontDesk]
    code: 200
    input: [patient_id, expected_provider_version]
    output: Provider
    side_effects: ["Patient.pcp_id set to this provider", "Provider.panel_size recomputed", "increments Provider.version by 1"]
  - method: GET
    path: "/providers/{id}/patients"
    description: "List patients whose pcp_id == this provider (FK reverse-reachability for Patient.pcp_id)"
    roles: [FrontDesk, Provider, QualityAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/providers/{id}/referrals"
    description: "List referrals whose referring_provider_id == this provider (FK reverse-reachability for Referral.referring_provider_id)"
    roles: [FrontDesk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [FrontDesk]
    code: 201
    input: [first_name, last_name, date_of_birth, sex]
    output: Patient
    side_effects: ["Patient created in ACTIVE with pcp_id null and computed counters 0"]
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient (includes computed ledger and care-gap fields)"
    roles: [FrontDesk, Provider, Biller, QualityAnalyst, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients"
    roles: [FrontDesk, Provider, Biller, QualityAnalyst]
    code: 200
    input: ["pcp_id?", "status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: POST
    path: "/patients/{id}/deactivate"
    description: "Deactivate a patient"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Patient
    side_effects: ["pcp_id cleared", "former PCP panel_size recomputed", "increments Patient.version by 1"]
  - method: POST
    path: "/patients/{id}/payments"
    description: "Record a payment against the patient ledger"
    roles: [Biller]
    code: 201
    input: [amount_cents]
    output: Patient
    side_effects: ["Patient.outstanding_balance_cents recomputed (decremented)"]
  - method: GET
    path: "/patients/{id}/visits"
    description: "List visits for a patient (FK reverse-reachability for Visit.patient_id)"
    roles: [FrontDesk, Provider, Biller, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/prescriptions"
    description: "List prescriptions for a patient (FK reverse-reachability for Prescription.patient_id)"
    roles: [FrontDesk, Provider, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/referrals"
    description: "List referrals for a patient (FK reverse-reachability for Referral.patient_id)"
    roles: [FrontDesk, Provider, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/hedis-measures"
    description: "List HEDIS measures for a patient (FK reverse-reachability for HedisMeasure.patient_id)"
    roles: [QualityAnalyst, Provider, FrontDesk]
    code: 200
    input: ["measure_type?", "measurement_year?", "status?", "limit?", "offset?"]
    output: HedisMeasure[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/portal-account"
    description: "Fetch the patient's portal account (FK reverse-reachability for PortalAccount.patient_id; array of 0-1)"
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: PortalAccount[]
    side_effects: []

  # ---- CptCode ----
  - method: POST
    path: "/cpt-codes"
    description: "Create a CPT/HCPCS billing code"
    roles: [Biller]
    code: 201
    input: [code, short_description, category, base_fee_cents, "requires_em_level?"]
    output: CptCode
    side_effects: []
  - method: GET
    path: "/cpt-codes/{id}"
    description: "Fetch a CPT code by its server id"
    roles: [Biller, Provider, FrontDesk]
    code: 200
    input: []
    output: CptCode
    side_effects: []
  - method: GET
    path: "/cpt-codes"
    description: "List CPT codes"
    roles: [Biller, Provider, FrontDesk]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: CptCode[]
    side_effects: []

  # ---- Visit ----
  - method: POST
    path: "/visits"
    description: "Schedule a visit (overlap-checked against provider schedule)"
    roles: [FrontDesk]
    code: 201
    input: [patient_id, provider_id, visit_type, scheduled_start, scheduled_end, "vaccine_code?"]
    output: Visit
    side_effects: ["Visit created in SCHEDULED", "Provider slot [scheduled_start, scheduled_end) occupied"]
  - method: GET
    path: "/visits/{id}"
    description: "Fetch a visit"
    roles: [FrontDesk, Provider, Biller, Patient]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List visits"
    roles: [FrontDesk, Provider, Biller]
    code: 200
    input: ["patient_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/charge-lines"
    description: "Add a charge line to a visit (visit must be IN_PROGRESS)"
    roles: [Provider]
    code: 201
    input: [cpt_code, "units?", "em_level?"]
    output: ChargeLine
    side_effects: ["ChargeLine.amount_cents computed via charge_line_amount (§1.3)"]
  - method: GET
    path: "/visits/{id}/charge-lines"
    description: "List charge lines for a visit (FK reverse-reachability for ChargeLine.visit_id)"
    roles: [Provider, Biller, FrontDesk]
    code: 200
    input: ["limit?", "offset?"]
    output: ChargeLine[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/check-in"
    description: "Check a patient in (cross-entity guard on Provider/Patient; vaccine-interval guard)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/start"
    description: "Begin the encounter"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/code"
    description: "Code the visit; writes provisional billed_total_cents"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["billed_total_cents = provisional visit_billed_total", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/reopen"
    description: "Reopen a coded visit back to IN_PROGRESS"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["billed_total_cents reset to 0", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/finalize"
    description: "Finalize billing (origin of CHAIN-1 cascade)"
    roles: [Biller]
    code: 200
    input: []
    output: Visit
    side_effects: ["billed_total_cents = final visit_billed_total", "Patient ledger recomputed", "matching HedisMeasure may flip to NUMERATOR_COMPLIANT", "Patient.open_care_gaps recomputed", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a scheduled visit"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Visit
    side_effects: ["Provider slot released", "increments Visit.version by 1"]
  - method: POST
    path: "/visits/{id}/no-show"
    description: "Mark a scheduled visit as no-show after its end time"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Visit
    side_effects: ["Provider slot released", "increments Visit.version by 1"]

  # ---- Prescription ----
