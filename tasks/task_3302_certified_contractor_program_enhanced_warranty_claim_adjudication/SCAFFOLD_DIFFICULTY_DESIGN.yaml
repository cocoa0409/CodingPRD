            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cl_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cl_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cl_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H L", property_postal_code: "30011", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cl_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cl_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cl_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cl_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cl_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2027-09-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "bad flashing", claim_labor_cost_cents: 10000 }, as: Claimant, captures: { claim_id: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "x" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "y" }, as: Claimant, captures: { cv: $.data.version } }
          trigger:
            - { call: "GET /program/contractors/${cl_id}", payload: {}, as: ProgramAdmin, captures: { liab0: $.data.outstanding_liability_cents } }
            - { call: "POST /program/warranty-claims/${claim_id}/adjudicate", payload: { determination: "INSTALLATION_ERROR", expected_claim_version: "${cv}" }, as: ProgramAdmin }
            - { call: "GET /program/contractors/${cl_id}", payload: {}, as: ProgramAdmin, captures: { liab1: $.data.outstanding_liability_cents } }
            - { call: "POST /program/warranty-claims/${claim_id}/reopen", payload: { reason: "disputed finding" }, as: ProgramAdmin }
            - { call: "GET /program/contractors/${cl_id}", payload: {}, as: ProgramAdmin, captures: { liab2: $.data.outstanding_liability_cents, score2: $.data.workmanship_score } }
          assert:
            - "outstanding_liability_cents == 0 before adjudication"
            - "outstanding_liability_cents == 110000 after adjudicate (round_half_up((1-0.0) * (100000 + 10000) * 1.00))"
            - "outstanding_liability_cents == 0 after reopen (compensating action fully reverses the ledger)"
            - "workmanship_score == 100 after reopen (the -10 delta is refunded; no drift)"
