# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Public Land Grazing Permit Administration
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked row-by-row against
# references/claim-extraction-guide.md. Sections and claim_type values are taken
# verbatim from that guide; nothing is invented here.
#
# Fixture conventions (shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * The logical clock starts at 2026-08-01T00:00:00Z and moves forward only.
#   * Opaque actors: u_officer_1 / u_officer_2 (AuthorizedOfficer),
#     u_spec_1 / u_spec_2 (RangeSpecialist), u_judge_1 / u_judge_2
#     (AppealsAdjudicator), u_admin_1 (SystemAdmin).
#   * Permittee actors are entity-backed: as_user_id is the captured Permittee id.
#   * admin_unit_code literals use the NV-1xx block so they never collide with the
#     NV-0xx block used by §1.8.
#   * The literal 00000000-0000-4000-8000-0000000000xx is a well-formed id that is
#     never minted by any call in the chain, so it always resolves to NOT_FOUND.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_allotment_creation_populates_ledger_and_posture_fields
        claim_type: creation
        grounds:
          - entities.Allotment
          - calculations.aum_allocation_ledger
          - endpoints.POST_/allotments
        distinguishing_aspect: "POST /allotments with every required field returns 201 and the response already carries the four computed ledger fields and both computed enums — effective_capacity_aums 1500, allocated_aums 0, open_aums 1500, stocking_adjustment_pct 0.0, allotment_status OPEN, health_determination NOT_ASSESSED, current_grazing_year 2026."
        test_recipe:
          setup:
            - "Empty database at the default logical clock 2026-08-01T00:00:00Z"
            - "One unrelated allotment already exists so the assertion cannot pass by accident on a single-row table"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Baseline Allotment", admin_unit_code: "NV-101", acres: 12000, total_permitted_aums: 400, season_start: "03-01", season_end: "10-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a1_id: "$.data.id" }
          trigger:
            - call: "POST /allotments"
              payload: { name: "Creation Probe Allotment", admin_unit_code: "NV-102", acres: 48000, total_permitted_aums: 1500, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 3 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a2_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "Allotment.${c_a2_id}.name == \"Creation Probe Allotment\" and admin_unit_code == \"NV-102\" and acres == 48000 and total_permitted_aums == 1500"
            - "Allotment.${c_a2_id}.season_start == \"01-01\" and season_end == \"12-31\" and required_pasture_rotation_count == 3"
            - "Allotment.${c_a2_id}.stocking_adjustment_pct == 0.0"
            - "Allotment.${c_a2_id}.effective_capacity_aums == 1500 and allocated_aums == 0 and open_aums == 1500"
            - "Allotment.${c_a2_id}.allotment_status == \"OPEN\" and health_determination == \"NOT_ASSESSED\""
            - "Allotment.${c_a2_id}.current_grazing_year == 2026 (calendar year of the logical clock, not of wall-clock time)"
            - "id, created_at, updated_at and version are all present; version is an integer >= 1"
            - "Allotment.${c_a1_id}.open_aums is still 400 — creating a second allotment does not touch the first"

      - name: corner_allotment_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/allotments/{allotmentId}
          - entities.Allotment
        distinguishing_aspect: "GET /allotments/{allotmentId} returns exactly the row POST /allotments persisted, field for field, with no recomputation drift."
        test_recipe:
          setup:
            - "One allotment created with 900 permitted AUMs"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Retrieval Probe", admin_unit_code: "NV-103", acres: 21000, total_permitted_aums: 900, season_start: "04-01", season_end: "09-30", required_pasture_rotation_count: 2 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a3_id: "$.data.id" }
          trigger:
            - call: "GET /allotments/${c_a3_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "HTTP 200 and data.id == ${c_a3_id}"
            - "data.total_permitted_aums == 900, effective_capacity_aums == 900, open_aums == 900, allocated_aums == 0"
            - "data.season_start == \"04-01\" and data.season_end == \"09-30\""
            - "data.allotment_status == \"OPEN\" and data.health_determination == \"NOT_ASSESSED\""

      - name: corner_allotment_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints.GET_/allotments
          - response_envelope.pagination_fields
          - state_machines.Allotment.OPEN_to_CLOSED
        distinguishing_aspect: "GET /allotments with limit 2 returns exactly 2 rows out of 3 with total_count 3 and has_more true, and the allotment_status=CLOSED filter narrows the same collection to the single allotment carrying an ACTIVE FULL_CLOSURE order."
        test_recipe:
          setup:
            - "Three allotments; the third receives a FULL_CLOSURE order so its allotment_status is CLOSED"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "List Probe One", admin_unit_code: "NV-104", acres: 10000, total_permitted_aums: 300, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a4_id: "$.data.id" }
            - call: "POST /allotments"
              payload: { name: "List Probe Two", admin_unit_code: "NV-105", acres: 11000, total_permitted_aums: 320, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a5_id: "$.data.id" }
            - call: "POST /allotments"
              payload: { name: "List Probe Three", admin_unit_code: "NV-106", acres: 12500, total_permitted_aums: 340, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a6_id: "$.data.id" }
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a6_id}", order_type: "FULL_CLOSURE", effective_start_date: "2026-08-05", effective_end_date: "2026-11-30", justification: "Administrative full closure pending allotment boundary resurvey." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co1_id: "$.data.id" }
          trigger:
            - call: "GET /allotments"
              payload: { limit: 2, offset: 0 }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "GET /allotments"
              payload: { allotment_status: "CLOSED" }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
          assert:
            - "first trigger: HTTP 200, response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0 and exactly 2 rows are returned"
            - "second trigger: total_count == 1, has_more == false and the single row is ${c_a6_id}"
            - "Allotment.${c_a6_id}.allotment_status == \"CLOSED\" with stocking_adjustment_pct 1.0 and effective_capacity_aums 0"
            - "Allotment.${c_a4_id} and Allotment.${c_a5_id} are still \"OPEN\" — the closure order is scoped to its own allotment"

      - name: corner_allotment_get_unknown_id_returns_allotment_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_ALLOTMENT_NOT_FOUND
          - validations.priority_5
        distinguishing_aspect: "GET /allotments/{allotmentId} with a well-formed id no call ever minted returns HTTP 404 ERR_ALLOTMENT_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "One allotment exists so the table is non-empty"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "NotFound Probe", admin_unit_code: "NV-107", acres: 9000, total_permitted_aums: 260, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a7_id: "$.data.id" }
          trigger:
            - call: "GET /allotments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_ALLOTMENT_NOT_FOUND\""
            - "the existing Allotment.${c_a7_id} is unaffected and still retrievable"

      - name: corner_allotment_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_1
          - errors.ERR_VALIDATION
          - endpoints.POST_/allotments
        distinguishing_aspect: "Omitting total_permitted_aums — a field §1.5 declares required with no default — returns HTTP 400 ERR_VALIDATION and persists no Allotment row."
        test_recipe:
          setup:
            - "One allotment exists so the list assertion has a known baseline of exactly 1"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Required Field Baseline", admin_unit_code: "NV-108", acres: 8000, total_permitted_aums: 240, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a8_id: "$.data.id" }
          trigger:
            - call: "POST /allotments"
              payload: { name: "Incomplete Allotment", admin_unit_code: "NV-109", acres: 8000, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /allotments"
              payload: { limit: 100, offset: 0 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "first trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "second trigger: total_count == 1 and the only row is ${c_a8_id} — the rejected request wrote nothing"

      - name: corner_allotment_rotation_count_defaults_to_two
        claim_type: defaults
        grounds:
          - entities.Allotment.required_pasture_rotation_count
          - validations.priority_20
        distinguishing_aspect: "Omitting the optional required_pasture_rotation_count yields exactly 2, and that default is the value the AOI rotation gate then enforces — an AOI scheduling one distinct pasture is refused with ERR_ROTATION_REQUIREMENT_NOT_MET."
        test_recipe:
          setup:
            - "One allotment created WITHOUT required_pasture_rotation_count, with two pastures"
            - "A permittee with a 200-AUM LAND base property and an ISSUED 200-AUM permit"
            - "A DRAFT 2026 AOI for 100 AUMs scheduling only the first pasture"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Default Rotation Allotment", admin_unit_code: "NV-110", acres: 15000, total_permitted_aums: 600, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a9_id: "$.data.id", c_a9_ver: "$.data.version" }
            - call: "POST /allotments/${c_a9_id}/pastures"
              payload: { name: "Pasture One", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p1_id: "$.data.id" }
            - call: "POST /allotments/${c_a9_id}/pastures"
              payload: { name: "Pasture Two", pasture_aum_capacity: 300, sequence_order: 2, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p2_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Default Rotation Ranch", contact_email: "rotation@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m1_id: "$.data.id" }
            - call: "POST /permittees/${c_m1_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T41N R63E Sec 04 SW", carrying_capacity_aums: 200, controlled_since_date: "2014-03-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp1_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a9_id}", permittee_id: "${c_m1_id}", base_property_id: "${c_bp1_id}", requested_aums: 200, term_start_date: "2026-01-01", term_end_date: "2031-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g1_id: "$.data.id" }
            - call: "POST /grazing-permits/${c_g1_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${c_g1_id}", grazing_year: 2026, authorized_aums: 100, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_aoi1_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${c_aoi1_id}/use-records"
              payload: { pasture_id: "${c_p1_id}", planned_entry_date: "2026-05-01", planned_exit_date: "2026-06-01", planned_head_count: 60, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_ur1_id: "$.data.id" }
          trigger:
            - call: "POST /annual-operating-instructions/${c_aoi1_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "Allotment.${c_a9_id}.required_pasture_rotation_count == 2 even though the create request omitted the field"
            - "AnnualOperatingInstruction.${c_aoi1_id}.distinct_pasture_count == 1"
            - "PastureUseRecord.${c_ur1_id}.planned_aums == 62.00 (60 head x CATTLE 1.0 x 31 days / 30)"
            - "trigger returns HTTP 422 with data.error_id == \"ERR_ROTATION_REQUIREMENT_NOT_MET\""
            - "AnnualOperatingInstruction.${c_aoi1_id}.aoi_status is still \"DRAFT\" and no PRELIMINARY_USE bill exists for it"
            - "control: after a second use record on ${c_p2_id} for 2026-06-05..2026-07-06 with 60 CATTLE, distinct_pasture_count == 2 and POST /annual-operating-instructions/${c_aoi1_id}/issue returns HTTP 200 with aoi_status \"ISSUED\""

      - name: corner_base_property_qualified_aums_computed_by_type_factor
        claim_type: computed_fields
        grounds:
          - entities.BaseProperty.qualified_aums
          - calculations.base_property_qualification
          - endpoints.POST_/permittees/{permitteeId}/base-properties
        distinguishing_aspect: "qualified_aums is computed from base_property_type, not copied from carrying_capacity_aums: a LAND property with 400 carrying capacity qualifies 400 AUMs while a LIVESTOCK property with the same 400 qualifies 300."
        test_recipe:
          setup:
            - "One permittee holding two base properties with identical carrying_capacity_aums 400 but different base_property_type"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Qualification Ranch", contact_email: "qual@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m2_id: "$.data.id" }
          trigger:
            - call: "POST /permittees/${c_m2_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T44N R61E Sec 22 all", carrying_capacity_aums: 400, controlled_since_date: "2010-06-15" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp2_id: "$.data.id" }
            - call: "POST /permittees/${c_m2_id}/base-properties"
              payload: { base_property_type: "LIVESTOCK", legal_description: "Brand-inspected herd of 400 head, Elko County", carrying_capacity_aums: 400, controlled_since_date: "2010-06-15" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp3_id: "$.data.id" }
          assert:
            - "BaseProperty.${c_bp2_id}.qualified_aums == 400 (LAND_QUALIFICATION_FACTOR 1.0)"
            - "BaseProperty.${c_bp3_id}.qualified_aums == 300 (LIVESTOCK_QUALIFICATION_FACTOR 0.75 applied to 400)"
            - "both rows keep carrying_capacity_aums == 400 — the factor is applied to the derived field only"
            - "GET /permittees/${c_m2_id}/base-properties with base_property_type LIVESTOCK returns total_count 1 and only ${c_bp3_id}"

      - name: corner_grazing_permit_system_fields_stamped_by_server
        claim_type: system_fields
        grounds:
          - entities.GrazingPermit.permit_status
          - entities.GrazingPermit.account_status
          - entities.GrazingPermit.predecessor_permit_id
        distinguishing_aspect: "POST /grazing-permits accepts none of the lifecycle fields in its §1.5 input, yet the created row carries permit_status PENDING_REVIEW, account_status CURRENT, predecessor_permit_id null, consecutive_nonuse_years 0 and preference_priority 2 — all server-stamped."
        test_recipe:
          setup:
            - "An allotment with 500 permitted AUMs and a permittee with a 300-AUM LAND base property"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "System Fields Allotment", admin_unit_code: "NV-111", acres: 14000, total_permitted_aums: 500, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a10_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "System Fields Ranch", contact_email: "sysfields@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m3_id: "$.data.id" }
            - call: "POST /permittees/${c_m3_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T38N R59E Sec 31 NW", carrying_capacity_aums: 300, controlled_since_date: "2016-02-20" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp4_id: "$.data.id" }
          trigger:
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a10_id}", permittee_id: "${c_m3_id}", base_property_id: "${c_bp4_id}", requested_aums: 300, term_start_date: "2026-03-01", term_end_date: "2032-02-28", livestock_kind: "SHEEP" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g2_id: "$.data.id" }
          assert:
            - "HTTP 201 and GrazingPermit.${c_g2_id}.permit_status == \"PENDING_REVIEW\""
            - "GrazingPermit.${c_g2_id}.account_status == \"CURRENT\""
            - "GrazingPermit.${c_g2_id}.predecessor_permit_id is null"
            - "GrazingPermit.${c_g2_id}.consecutive_nonuse_years == 0 and preference_priority == 2 and suspension_reason is null"
            - "GrazingPermit.${c_g2_id}.livestock_kind == \"SHEEP\" and permitted_aums == 300 (the request field requested_aums lands in permitted_aums)"
            - "Allotment.${c_a10_id}.allocated_aums is still 0 — a PENDING_REVIEW permit reserves no AUMs"

      - name: corner_use_record_actual_fields_null_until_reported
        claim_type: system_fields
        grounds:
          - entities.PastureUseRecord.actual_entry_date
          - entities.PastureUseRecord.actual_aums
          - entities.PastureUseRecord.record_status
        distinguishing_aspect: "A freshly scheduled PastureUseRecord has record_status SCHEDULED with actual_entry_date, actual_exit_date, actual_head_count and actual_aums all null; only report-actual-use populates them."
        test_recipe:
          setup:
            - "An allotment with one pasture, an ISSUED permit and a DRAFT 2026 AOI"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Actuals Allotment", admin_unit_code: "NV-112", acres: 9000, total_permitted_aums: 400, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a11_id: "$.data.id" }
            - call: "POST /allotments/${c_a11_id}/pastures"
              payload: { name: "Actuals Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p3_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Actuals Ranch", contact_email: "actuals@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m4_id: "$.data.id" }
            - call: "POST /permittees/${c_m4_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T37N R58E Sec 09 SE", carrying_capacity_aums: 200, controlled_since_date: "2013-08-08" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp5_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a11_id}", permittee_id: "${c_m4_id}", base_property_id: "${c_bp5_id}", requested_aums: 200, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g3_id: "$.data.id" }
            - call: "POST /grazing-permits/${c_g3_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${c_g3_id}", grazing_year: 2026, authorized_aums: 120, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_aoi2_id: "$.data.id" }
          trigger:
            - call: "POST /annual-operating-instructions/${c_aoi2_id}/use-records"
              payload: { pasture_id: "${c_p3_id}", planned_entry_date: "2026-05-01", planned_exit_date: "2026-06-01", planned_head_count: 60, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_ur2_id: "$.data.id" }
          assert:
            - "PastureUseRecord.${c_ur2_id}.record_status == \"SCHEDULED\""
            - "PastureUseRecord.${c_ur2_id}.actual_entry_date, actual_exit_date, actual_head_count and actual_aums are all null"
            - "PastureUseRecord.${c_ur2_id}.planned_aums == 62.00"
            - "AnnualOperatingInstruction.${c_aoi2_id}.planned_aums_total == 62.00 and actual_aums_total == 0"
            - "Pasture.${c_p3_id}.scheduled_aums == 62.00"

      - name: corner_permittee_aggregates_initialised_to_zero
        claim_type: computed_fields
        grounds:
          - entities.Permittee.outstanding_balance_cents
          - entities.Permittee.billed_trespass_incident_count
          - entities.Permittee.permittee_status
        distinguishing_aspect: "A brand-new Permittee reports outstanding_balance_cents 0, billed_trespass_incident_count 0 and permittee_status IN_GOOD_STANDING — the debt aggregate starts empty rather than null."
        test_recipe:
          setup:
            - "Empty database at the default logical clock"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Zero Aggregate Ranch", contact_email: "zero@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m5_id: "$.data.id" }
          trigger:
            - call: "GET /permittees/${c_m5_id}"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 200 with data.outstanding_balance_cents == 0"
            - "data.billed_trespass_incident_count == 0"
            - "data.permittee_status == \"IN_GOOD_STANDING\""
            - "data.name == \"Zero Aggregate Ranch\" and data.contact_email == \"zero@example.com\""

      - name: corner_allotment_type_constraints_on_code_and_season
        claim_type: type_constraints
        grounds:
          - entities.Allotment.admin_unit_code
          - entities.Allotment.season_start
          - validations.priority_1
          - errors.ERR_VALIDATION
        distinguishing_aspect: "admin_unit_code must match ^[A-Z]{2}-[0-9]{3}$ and season_start must be a valid MM-DD string: \"BLM-NV-047\" and \"13-01\" are each rejected with HTTP 400 ERR_VALIDATION, and an unknown livestock_kind enum member is the same failure class."
        test_recipe:
          setup:
            - "An allotment, permittee and LAND base property exist so the third trigger fails only on its enum member"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Constraint Probe", admin_unit_code: "NV-113", acres: 7000, total_permitted_aums: 250, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a12_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Constraint Ranch", contact_email: "constraint@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m6_id: "$.data.id" }
            - call: "POST /permittees/${c_m6_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T36N R57E Sec 15 NE", carrying_capacity_aums: 150, controlled_since_date: "2018-01-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp6_id: "$.data.id" }
          trigger:
            - call: "POST /allotments"
              payload: { name: "Bad Code Allotment", admin_unit_code: "BLM-NV-047", acres: 7000, total_permitted_aums: 250, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /allotments"
              payload: { name: "Bad Season Allotment", admin_unit_code: "NV-114", acres: 7000, total_permitted_aums: 250, season_start: "13-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a12_id}", permittee_id: "${c_m6_id}", base_property_id: "${c_bp6_id}", requested_aums: 150, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "GOATS" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "first trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\" — \"BLM-NV-047\" has a three-letter prefix and fails ^[A-Z]{2}-[0-9]{3}$"
            - "second trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\" — month 13 is not a valid MM-DD"
            - "third trigger: HTTP 400 with data.error_id == \"ERR_VALIDATION\" — GOATS is not a member of CATTLE | SHEEP | HORSES"
            - "GET /allotments returns total_count 1 (only ${c_a12_id}) and GET /grazing-permits returns total_count 0"

      - name: corner_pasture_create_under_unknown_allotment_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Pasture.allotment_id
          - validations.priority_5
          - errors.ERR_ALLOTMENT_NOT_FOUND
        distinguishing_aspect: "A nested create resolves its path parent first: POST /allotments/{unknown}/pastures returns HTTP 404 ERR_ALLOTMENT_NOT_FOUND rather than ERR_VALIDATION, even when the body is otherwise perfect."
        test_recipe:
          setup:
            - "One real allotment exists, so the failure cannot be an empty-table artifact"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Parent Probe", admin_unit_code: "NV-115", acres: 6000, total_permitted_aums: 210, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a13_id: "$.data.id" }
          trigger:
            - call: "POST /allotments/00000000-0000-4000-8000-000000000002/pastures"
              payload: { name: "Orphan Pasture", pasture_aum_capacity: 100, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ALLOTMENT_NOT_FOUND\""
            - "GET /allotments/${c_a13_id}/pastures returns total_count 0 — no orphan Pasture row was created anywhere"

  - section: state_machines
    instances:
      - name: corner_assessment_draft_to_field_review_on_submit
        claim_type: valid_transition
        grounds:
          - state_machines.RangelandHealthAssessment.DRAFT_to_FIELD_REVIEW
          - endpoints.POST_/rangeland-health-assessments/{assessmentId}/submit
        distinguishing_aspect: "POST /rangeland-health-assessments/{assessmentId}/submit moves assessment_status DRAFT -> FIELD_REVIEW and nothing else: composite_score and determination stay unset because scoring only happens on CONCUR review."
        test_recipe:
          setup:
            - "One allotment and one DRAFT 2026 assessment authored by u_spec_1"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Submit Probe Allotment", admin_unit_code: "NV-116", acres: 20000, total_permitted_aums: 700, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a14_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a14_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 62, riparian_score: 44, water_quality_score: 51, standards_not_met: ["UPLAND_HEALTH"], causal_factor_is_livestock: true }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as1_id: "$.data.id" }
          trigger:
            - call: "POST /rangeland-health-assessments/${c_as1_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "HTTP 200 and RangelandHealthAssessment.${c_as1_id}.assessment_status == \"FIELD_REVIEW\""
            - "RangelandHealthAssessment.${c_as1_id}.author_user_id == \"u_spec_1\" and remand_count == 0"
            - "RangelandHealthAssessment.${c_as1_id}.determination is null and recommended_reduction_pct == 0"
            - "Allotment.${c_a14_id}.health_determination is still \"NOT_ASSESSED\" — submission writes nothing to the allotment"

      - name: corner_assessment_submit_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.RangelandHealthAssessment.DRAFT_to_FIELD_REVIEW
          - validations.priority_8
          - errors.ERR_ASSESSMENT_STATE_INVALID
        distinguishing_aspect: "The second POST .../submit on the same assessment returns HTTP 409 ERR_ASSESSMENT_STATE_INVALID and leaves remand_count at 0 — submit is not idempotent, it is state-guarded."
        test_recipe:
          setup:
            - "One assessment already in FIELD_REVIEW"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Double Submit Allotment", admin_unit_code: "NV-117", acres: 18000, total_permitted_aums: 650, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a15_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a15_id}", assessment_year: 2026, monitoring_method: "UTILIZATION_MAPPING", upland_score: 70, riparian_score: 70, water_quality_score: 70, observed_utilization_pct: 40, standards_not_met: [], causal_factor_is_livestock: false }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as2_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${c_as2_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          trigger:
            - call: "POST /rangeland-health-assessments/${c_as2_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "HTTP 409 with data.error_id == \"ERR_ASSESSMENT_STATE_INVALID\""
            - "RangelandHealthAssessment.${c_as2_id}.assessment_status is still \"FIELD_REVIEW\" and remand_count == 0"

      - name: corner_assessment_remand_only_increments_counter
        claim_type: side_effect_execution
        grounds:
          - state_machines.RangelandHealthAssessment.FIELD_REVIEW_to_DRAFT
          - endpoints.POST_/rangeland-health-assessments/{assessmentId}/review
        distinguishing_aspect: "A REMAND review sends the assessment back to DRAFT and increments remand_count to 1 while writing NOTHING else — composite_score and determination stay null and the allotment's health_determination stays NOT_ASSESSED."
        test_recipe:
          setup:
            - "One assessment in FIELD_REVIEW authored by u_spec_1 on an allotment whose health_determination is NOT_ASSESSED"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Remand Probe Allotment", admin_unit_code: "NV-118", acres: 17000, total_permitted_aums: 600, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a16_id: "$.data.id", c_a16_ver: "$.data.version" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a16_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 62, riparian_score: 44, water_quality_score: 51, standards_not_met: ["UPLAND_HEALTH"], causal_factor_is_livestock: true }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as3_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${c_as3_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          trigger:
            - call: "POST /rangeland-health-assessments/${c_as3_id}/review"
              payload: { review_outcome: "REMAND", review_notes: "Riparian transects were not re-read after the July storm; resample reach two." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 200 and RangelandHealthAssessment.${c_as3_id}.assessment_status == \"DRAFT\""
            - "RangelandHealthAssessment.${c_as3_id}.remand_count == 1"
            - "RangelandHealthAssessment.${c_as3_id}.composite_score is unset/null and determination is null and recommended_reduction_pct == 0"
            - "Allotment.${c_a16_id}.health_determination == \"NOT_ASSESSED\" and Allotment.${c_a16_id}.version == ${c_a16_ver} — a REMAND performs no allotment write, so the version does NOT move"

      - name: corner_assessment_concur_finalizes_and_writes_allotment_determination
        claim_type: side_effect_execution
        grounds:
          - state_machines.RangelandHealthAssessment.FIELD_REVIEW_to_FINALIZED
          - calculations.rangeland_health_determination
          - calculations.stocking_adjustment_recommendation
        distinguishing_aspect: "A CONCUR review finalizes the assessment and executes both calculations in one hop: composite_score 52.95, determination MEETING_WITH_PROBLEMS, recommended_reduction_pct 0.2000, and the allotment's health_determination is overwritten from NOT_ASSESSED to MEETING_WITH_PROBLEMS with its version bumped by exactly 1."
        test_recipe:
          setup:
            - "One assessment in FIELD_REVIEW with upland 62, riparian 44, water quality 51, one standard not met and livestock as the causal factor"
            - "The reviewing officer u_officer_1 is not the author u_spec_1, so segregation of duties is satisfied"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Concur Probe Allotment", admin_unit_code: "NV-119", acres: 16000, total_permitted_aums: 560, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a17_id: "$.data.id", c_a17_ver: "$.data.version" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a17_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 62, riparian_score: 44, water_quality_score: 51, standards_not_met: ["UPLAND_HEALTH"], causal_factor_is_livestock: true }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as4_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${c_as4_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          trigger:
            - call: "POST /rangeland-health-assessments/${c_as4_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "Concur with the interdisciplinary team findings." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "HTTP 200 and RangelandHealthAssessment.${c_as4_id}.assessment_status == \"FINALIZED\""
            - "RangelandHealthAssessment.${c_as4_id}.composite_score == 52.95 (62*0.4 + 44*0.35 + 51*0.25 = 24.8 + 15.4 + 12.75)"
            - "RangelandHealthAssessment.${c_as4_id}.determination == \"MEETING_WITH_PROBLEMS\" (50 <= 52.95 < 70)"
            - "RangelandHealthAssessment.${c_as4_id}.recommended_reduction_pct == 0.2000 (PROPORTIONAL_STANDARDS: 0.1 x 1 standard + 0.1 livestock adder)"
            - "RangelandHealthAssessment.${c_as4_id}.remand_count == 0"
            - "Allotment.${c_a17_id}.health_determination == \"MEETING_WITH_PROBLEMS\" and Allotment.${c_a17_id}.version == ${c_a17_ver} + 1"
            - "Allotment.${c_a17_id}.stocking_adjustment_pct is still 0.0 — a finalized assessment recommends, it never reduces stocking on its own"

      - name: corner_permit_decision_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.PermitDecision.initial_state_DRAFT
          - endpoints.POST_/permit-decisions
        distinguishing_aspect: "A newly created PermitDecision is DRAFT with nepa_status PENDING, nepa_findings_summary null, deciding_officer_id null and authoring_officer_id stamped from the acting X-User-ID; the allotment's version is bumped by exactly 1."
