              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/nutrient-plans/${pl_id}/approve"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-07-05T00:00:00Z", gallons_applied: 300000, acres_treated: 30, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ev_first_id: $.data.id }
          trigger:
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-07-25T00:00:00Z", gallons_applied: 50000, acres_treated: 10, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
