              captures: { err_topic: $.data.error_id }
            - call: "POST /content-edits"
              payload: { title_id: "${ttl_id}", state_id: "${st_ga_id}", edit_type: "ADD_REQUIRED_TOPIC", topic_code: "FINANCIAL_LITERACY", pages_delta: 0, rationale: "Adds the Georgia financial literacy unit required by the state." }
              as: PublisherEditor
