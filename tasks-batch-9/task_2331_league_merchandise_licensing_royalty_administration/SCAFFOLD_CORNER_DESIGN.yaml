          two FILED reports and one DRAFT report on the same agreement, a
          status=FILED page of limit 1 reports total_count 2 and has_more true,
          the next page reports has_more false, and status=DRAFT reports
          total_count 1. Implementations that count before filtering, or that
          compute has_more from the page length, get one of the three answers
          wrong.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_T3 ACTIVE with an ACTIVE agreement AGR_T3 (term 2026-01-01..2027-12-31) and an AUTHORIZED DEPARTMENT authorization"
            - "reports for 2026Q1 and 2026Q2 are FILED; a report for 2026Q3 stays DRAFT (its quarter has not ended)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "JERSEY products", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Tallgrass Sportswear", contact_email: "ops@tallgrass.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_t3: $.data.id }
            - call: "POST /licensing/licensees/${lic_t3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_t3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_t3: $.data.id }
            - call: "POST /licensing/agreements/${agr_t3}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_t3}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_t3}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_t3}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_t3}"
              as: LeagueLicensingManager
              captures: { lic_t3_v1: $.data.version }
            - call: "POST /licensing/licensees/${lic_t3}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_t3_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_t3: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_t3}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_t3}"
              as: FinanceController
              captures: { agr_t3_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_t3}", period_quarter: "2026Q1", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_t3}", gross_sales_cents: 1000000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_t3_v1}" }
              as: Licensee
              as_user_id: "${lic_t3}"
              captures: { rpt_t3_q1: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_t3_q1}/file"
              as: Licensee
              as_user_id: "${lic_t3}"
            - call: "GET /licensing/agreements/${agr_t3}"
              as: FinanceController
              captures: { agr_t3_v2: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_t3}", period_quarter: "2026Q2", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_t3}", gross_sales_cents: 900000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_t3_v2}" }
              as: Licensee
              as_user_id: "${lic_t3}"
              captures: { rpt_t3_q2: $.data.id }
            - call: "POST /licensing/royalty-reports/${rpt_t3_q2}/file"
              as: Licensee
              as_user_id: "${lic_t3}"
            - call: "GET /licensing/agreements/${agr_t3}"
              as: FinanceController
              captures: { agr_t3_v3: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_t3}", period_quarter: "2026Q3", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_t3}", gross_sales_cents: 700000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_t3_v3}" }
              as: Licensee
              as_user_id: "${lic_t3}"
              captures: { rpt_t3_q3: $.data.id }
          trigger:
            - call: "GET /licensing/royalty-reports?agreement_id=${agr_t3}&status=FILED&limit=1&offset=0"
              as: FinanceController
            - call: "GET /licensing/royalty-reports?agreement_id=${agr_t3}&status=FILED&limit=1&offset=1"
              as: FinanceController
            - call: "GET /licensing/royalty-reports?agreement_id=${agr_t3}&status=DRAFT&limit=10&offset=0"
              as: FinanceController
          assert:
            - "the first call returns 200 with exactly 1 item, total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "the second call returns 200 with exactly 1 item, total_count == 2, offset == 1 and has_more == false"
            - "the two FILED pages together return the 2026Q1 and 2026Q2 report ids with no duplicates"
            - "the third call returns 200 with exactly 1 item (the 2026Q3 report), total_count == 1 and has_more == false"

      - name: audit_settlement_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_SETTLED
        excluded_because:
          difficulty_instance: transitive_cascade / audit_settlement_five_hop_cascade_to_review_hold
          rationale: "The named §1.8 instance verifies all five hops of the settlement cascade in one trigger."

      - name: risk_index_dual_variant_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.compliance_risk_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_index_rolling_monitor_vs_strict_assessment
          rationale: "The named §1.8 instance pins both variants on one factor set and the delta between them."

      - name: club_distribution_totals_reconcile_with_the_run
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.central_pool_distribution
          - entities.Club.fields.lifetime_distributed_cents
        excluded_because:
          difficulty_instance: compensating_invariant / central_pool_conserved_exactly_by_largest_remainder_split
          rationale: "The named §1.8 instance asserts that the ClubDistribution rows sum exactly to club_pool_cents with no drift."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: accepted_report_ledger_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.RoyaltyReport.FILED_to_ACCEPTED
          - calculations.advance_recoupment_and_payable
        distinguishing_aspect: |
          The system is immediately consistent: the ledger effects of ACCEPT are
          readable in the acceptance response itself and in the very next GET,
          with no retry, no polling and no intermediate 'pending' state. Every
          cascaded counter — the agreement ledger and the report's own accepted
          fields — is final when the 200 arrives, so a test that reads once
          straight after the call must already see 120000 recouped.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_U3 ACTIVE with an ACTIVE agreement AGR_U3 (advance 250000 paid) and a FILED 2026Q2 report of gross 1000000"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "JERSEY products", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Uplands Team Retail", contact_email: "ops@uplands.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_u3: $.data.id }
            - call: "POST /licensing/licensees/${lic_u3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_u3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_u3: $.data.id }
            - call: "POST /licensing/agreements/${agr_u3}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_u3}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_u3}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_u3}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_u3}"
              as: LeagueLicensingManager
              captures: { lic_u3_v1: $.data.version }
            - call: "POST /licensing/licensees/${lic_u3}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_u3_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_u3: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_u3}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_u3}"
              as: FinanceController
              captures: { agr_u3_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_u3}", period_quarter: "2026Q2", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_u3}", gross_sales_cents: 1000000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_u3_v1}" }
              as: Licensee
