            - { call: "POST /drivers", payload: { cdl_number: "CDL-CF2", full_name: "C F Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T15:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Driver, as_user_id: "${d1}", captures: { f1: $.data.fee_cents, w1: $.data.billing_status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T15:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b2}/cancel", payload: {}, as: Driver, as_user_id: "${d2}", captures: { f2: $.data.fee_cents, w2: $.data.billing_status } }
          assert:
            - "B1 at the exact boundary: fee_cents == 0, billing_status == WAIVED"
            - "B2 one second later: fee_cents == 2250, billing_status == UNBILLED, final_total_cents == 2250"

      - name: loyalty_tier_twelve_nights_boundary_discount
        claim_type: correct_result
        grounds: [calculations.loyalty_tier_eval, calculations.booking_settlement, calculations.loyalty_points_ledger]
        distinguishing_aspect: "Exactly 12 settled nights (INCLUSIVE threshold) yields SILVER: the next quote applies 5% off parking (4500 - 225 = 4275); points earned 120 = 10 x 12."
        test_recipe:
          setup: ["site (base 5000) with 1 reservable stall; driver books 12 nights arrival 2026-08-10 (9 nights at 4500 plus peak nights 08-14/08-15/08-21 at 5400, occupancy 0%), checks in/out, pays exact 56700"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-LT", full_name: "L Tee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 12, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, q1: $.data.quoted_total_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}", captures: { fin: $.data.final_total_cents } }
            - { call: "POST /bookings/${b1}/payments", payload: { amount_cents: 56700 }, as: Driver, as_user_id: "${d1}", captures: { bs: $.data.billing_status } }
          trigger:
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { tier: $.data.loyalty_tier, nights: $.data.settled_nights_90d, pts: $.data.loyalty_points_balance } }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-25", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { q2: $.data.quoted_total_cents } }
          assert:
            - "first booking quoted_total_cents == 56700 and final_total_cents == 56700 (9 non-peak nights x 4500 + 3 peak nights 08-14/08-15/08-21 x 5400, STANDARD at both evaluations)"
            - "after payment: billing_status == PAID, settled_nights_90d == 12, loyalty_tier == SILVER (>= 12 inclusive), loyalty_points_balance == 120"
            - "next booking quote == 4275 (4500 - rhu(4500 * 5%))"

      - name: forecast_excludes_terminal_bookings
        claim_type: input_set_filtering
        grounds: [calculations.demand_forecast]
        distinguishing_aspect: "Input-set filtering: a CANCELLED booking drops out of the confirmed variant (50.0 -> 0.0 with 2 stalls)."
        test_recipe:
          setup: ["site with 2 ACTIVE stalls; one booking for night 2026-08-10, then cancelled"]
          setup_api_calls:
