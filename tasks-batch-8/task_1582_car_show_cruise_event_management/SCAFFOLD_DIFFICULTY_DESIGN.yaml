scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: entry_fee_prereg_vs_day_of_divergence
        grounds:
          - calculations.entry_fee_calc
          - entities.Registration.fields.pricing_tier
          - entities.Registration.fields.fee_cents
        distinguishing_aspect: |
          Entity domain Registration: identical class (prereg_fee_cents 3000 / day_of_fee_cents 4500)
          and identical member+multi-vehicle inputs produce 2025 under the PREREG variant
          (3000 * 0.9 * 0.75) but a flat 4500 under the DAY_OF variant, because the day-of
          variant applies neither the member nor the multi-vehicle discount.
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN with class MUSCLE (prereg 3000, day_of 4500, capacity 40, JUDGED, depth 2) and one SHOW_FIELD zone"
            - "Registrant Alice (club_member=true) with three eligible vehicles (1970, 1971, 1974)"
            - "Logical clock starts at the default 2026-08-01T00:00:00Z (before prereg_deadline 2026-08-14T23:59:59Z)"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Summer Cruise Night", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "MUSCLE", name: "Muscle Pre-1976", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Show Field A", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Alice Member", email: "alice@example.com", club_member: true, is_minor: false }, as: Organizer, captures: { ra: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1974, make: "Datsun", model: "260Z" }, as: Organizer, captures: { v3: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id, r1_fee: $.data.fee_cents, r1_tier: $.data.pricing_tier } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id, r2_fee: $.data.fee_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:30:00Z" }, as: Organizer }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v3}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r3: $.data.id, r3_fee: $.data.fee_cents, r3_tier: $.data.pricing_tier } }
          trigger:
            - { call: "GET /registrations/${r3}", payload: {}, as: RegistrationDesk }
          assert:
            - "Registration.${r1}.fee_cents == 2700 and pricing_tier == PREREG (3000 * 0.9 member)"
            - "Registration.${r2}.fee_cents == 2025 (3000 * 0.9 * 0.75 member + second-vehicle)"
            - "Registration.${r3}.fee_cents == 4500 and pricing_tier == DAY_OF (flat; no member or multi discount)"
            - "r2_fee 2025 != r3_fee 4500 although class, registrant and member status are identical"

      - name: judged_tabulation_straight_vs_drop_extremes
        grounds:
          - calculations.judged_score_tabulation
          - entities.Event.fields.tabulation_method
          - entities.Award.fields.winner_score
        distinguishing_aspect: |
          Entity domain Award tabulation (distinct from Registration pricing): the identical
          three sheets 55.0 / 49.3 / 51.3 yield class_score 51.87 under STRAIGHT_AVERAGE but
          51.30 under DROP_EXTREMES (one highest and one lowest sheet dropped).
        test_recipe:
          setup:
            - "Two events EA (STRAIGHT_AVERAGE) and EB (DROP_EXTREMES), each with class MUSCLE (cap 40, JUDGED, depth 2), zone FIELD_A, registration open"
            - "Each event: one non-member registrant with a 1970 vehicle, waiver signed, registration paid 3000 and checked in at 08:30"
            - "Each event: three judges J1/J2/J3 assigned to MUSCLE; clock advanced to 12:30 (inside judging window); event locked and judging started"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Show A", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ea: $.data.id } }
            - { call: "POST /events/${ea}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { cla: $.data.id } }
            - { call: "POST /events/${ea}/zones", payload: { name: "Field A", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zna: $.data.id } }
            - { call: "POST /events/${ea}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ea}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Entrant A", email: "ea@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { pa: $.data.id } }
            - { call: "POST /registrants/${pa}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { va: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ea}", registrant_id: "${pa}", signature_name: "Entrant A" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ea}", registrant_id: "${pa}", vehicle_id: "${va}", class_id: "${cla}" }, as: RegistrationDesk, captures: { rega: $.data.id } }
            - { call: "POST /registrations/${rega}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${rega}/check-in", payload: { zone_id: "${zna}" }, as: RegistrationDesk }
            - { call: "POST /events/${ea}/judges", payload: { name: "J1", email: "j1a@example.com", assigned_class_ids: ["${cla}"] }, as: Organizer, captures: { j1a: $.data.id } }
            - { call: "POST /events/${ea}/judges", payload: { name: "J2", email: "j2a@example.com", assigned_class_ids: ["${cla}"] }, as: Organizer, captures: { j2a: $.data.id } }
            - { call: "POST /events/${ea}/judges", payload: { name: "J3", email: "j3a@example.com", assigned_class_ids: ["${cla}"] }, as: Organizer, captures: { j3a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: Organizer }
            - { call: "POST /events/${ea}/lock-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ea}/start-judging", payload: {}, as: Organizer }
            - { call: "POST /score-sheets", payload: { registration_id: "${rega}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1a}", captures: { s1a: $.data.id } }
            - { call: "POST /score-sheets", payload: { registration_id: "${rega}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 7 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 7 }] }, as: Judge, as_user_id: "${j2a}", captures: { s2a: $.data.id } }
            - { call: "POST /score-sheets", payload: { registration_id: "${rega}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 7 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j3a}", captures: { s3a: $.data.id } }
            - { call: "POST /score-sheets/${s1a}/submit", payload: {}, as: Judge, as_user_id: "${j1a}" }
            - { call: "POST /score-sheets/${s2a}/submit", payload: {}, as: Judge, as_user_id: "${j2a}" }
            - { call: "POST /score-sheets/${s3a}/submit", payload: {}, as: Judge, as_user_id: "${j3a}" }
            - { call: "POST /events", payload: { name: "Show B", event_date: "2026-08-22", gates_open_at: "2026-08-22T09:00:00Z", judging_start_at: "2026-08-22T12:00:00Z", judging_end_at: "2026-08-22T14:00:00Z", ballot_close_at: "2026-08-22T14:30:00Z", prereg_deadline: "2026-08-21T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "DROP_EXTREMES" }, as: Organizer, captures: { eb: $.data.id } }
            - { call: "POST /events/${eb}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { clb: $.data.id } }
            - { call: "POST /events/${eb}/zones", payload: { name: "Field A", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-22T08:00:00Z", arrival_window_end: "2026-08-22T10:00:00Z" }, as: Organizer, captures: { znb: $.data.id } }
            - { call: "POST /events/${eb}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${eb}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Entrant B", email: "eb@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { pb: $.data.id } }
            - { call: "POST /registrants/${pb}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { vb: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${eb}", registrant_id: "${pb}", signature_name: "Entrant B" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${eb}", registrant_id: "${pb}", vehicle_id: "${vb}", class_id: "${clb}" }, as: RegistrationDesk, captures: { regb: $.data.id } }
            - { call: "POST /registrations/${regb}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${regb}/check-in", payload: { zone_id: "${znb}" }, as: RegistrationDesk }
            - { call: "POST /events/${eb}/judges", payload: { name: "K1", email: "j1b@example.com", assigned_class_ids: ["${clb}"] }, as: Organizer, captures: { j1b: $.data.id } }
            - { call: "POST /events/${eb}/judges", payload: { name: "K2", email: "j2b@example.com", assigned_class_ids: ["${clb}"] }, as: Organizer, captures: { j2b: $.data.id } }
            - { call: "POST /events/${eb}/judges", payload: { name: "K3", email: "j3b@example.com", assigned_class_ids: ["${clb}"] }, as: Organizer, captures: { j3b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T12:30:00Z" }, as: Organizer }
            - { call: "POST /events/${eb}/lock-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${eb}/start-judging", payload: {}, as: Organizer }
            - { call: "POST /score-sheets", payload: { registration_id: "${regb}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1b}", captures: { s1b: $.data.id } }
            - { call: "POST /score-sheets", payload: { registration_id: "${regb}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 7 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 7 }] }, as: Judge, as_user_id: "${j2b}", captures: { s2b: $.data.id } }
            - { call: "POST /score-sheets", payload: { registration_id: "${regb}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 7 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j3b}", captures: { s3b: $.data.id } }
            - { call: "POST /score-sheets/${s1b}/submit", payload: {}, as: Judge, as_user_id: "${j1b}" }
            - { call: "POST /score-sheets/${s2b}/submit", payload: {}, as: Judge, as_user_id: "${j2b}" }
            - { call: "POST /score-sheets/${s3b}/submit", payload: {}, as: Judge, as_user_id: "${j3b}" }
          trigger:
            - { call: "GET /events/${ea}", payload: {}, as: Organizer, captures: { ea_v: $.data.version } }
            - { call: "POST /events/${ea}/tabulations/finalize", payload: { expected_event_version: "${ea_v}" }, as: Organizer }
            - { call: "GET /events/${eb}", payload: {}, as: Organizer, captures: { eb_v: $.data.version } }
            - { call: "POST /events/${eb}/tabulations/finalize", payload: { expected_event_version: "${eb_v}" }, as: Organizer }
            - { call: "GET /awards", payload: {}, as: Organizer }
          assert:
            - "GET /awards?event_id=${ea} first row (CLASS_PLACE place 1): winner_registration_id == ${rega}, winner_score == 51.87"
            - "GET /awards?event_id=${eb} first row (CLASS_PLACE place 1): winner_registration_id == ${regb}, winner_score == 51.30"
            - "51.87 != 51.30 for byte-identical criteria inputs; the tabulation_method variant alone drives the divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: entry_fee_member_multi_interaction
        grounds:
          - calculations.entry_fee_calc
          - entities.ShowClass.fields.prereg_fee_cents
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction: pricing_tier x
          club_member x multi-vehicle ordinal multiply conditionally (member 2nd vehicle
          2025 = 3000*0.9*0.75 vs non-member 2nd vehicle 2250 = 3000*0.75 vs member 1st
          2700); no additive decomposition reproduces all four outcomes.
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN, class MUSCLE prereg 3000, clock at default 2026-08-01 (PREREG tier)"
            - "Alice (member) with vehicles V1/V2; Bob (non-member) with vehicles V3/V4"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Fee Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Alice", email: "a@example.com", club_member: true, is_minor: false }, as: Organizer, captures: { ra: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /registrants", payload: { full_name: "Bob", email: "b@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { rb: $.data.id } }
            - { call: "POST /registrants/${rb}/vehicles", payload: { year: 1969, make: "Chevrolet", model: "Camaro" }, as: Organizer, captures: { v3: $.data.id } }
            - { call: "POST /registrants/${rb}/vehicles", payload: { year: 1972, make: "Pontiac", model: "GTO" }, as: Organizer, captures: { v4: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${rb}", vehicle_id: "${v3}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r3: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${rb}", vehicle_id: "${v4}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r4: $.data.id } }
          assert:
            - "Registration.${r1}.fee_cents == 2700 (member, first vehicle)"
            - "Registration.${r2}.fee_cents == 2025 (member, second vehicle: 3000*0.9*0.75)"
            - "Registration.${r3}.fee_cents == 3000 (non-member, first vehicle)"
            - "Registration.${r4}.fee_cents == 2250 (non-member, second vehicle: 3000*0.75)"

      - name: tabulation_per_sheet_rounding_order
        grounds:
          - calculations.judged_score_tabulation
          - entities.ScoreSheet.fields.sheet_total
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-sheet rounding to 1 decimal FIRST
          (49.25 -> 49.3, 51.25 -> 51.3) and only then averages and rounds to 2 decimals,
          yielding 51.87; the forbidden round-once order over raw weighted sums yields 51.83.
        test_recipe:
          setup:
            - "STRAIGHT_AVERAGE event in JUDGING with class MUSCLE, one checked-in registration, three assigned judges"
            - "Sheets with raw weighted sums 55.0, 49.25, 51.25"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Rounding Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 2 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Eve", email: "eve@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { ra: $.data.id } }
            - { call: "POST /registrants/${ra}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${ra}", signature_name: "Eve" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${ra}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk }
            - { call: "POST /events/${ev}/judges", payload: { name: "J1", email: "j1@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j1: $.data.id } }
            - { call: "POST /events/${ev}/judges", payload: { name: "J2", email: "j2@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j2: $.data.id } }
            - { call: "POST /events/${ev}/judges", payload: { name: "J3", email: "j3@example.com", assigned_class_ids: ["${cl}"] }, as: Organizer, captures: { j3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: Organizer }
            - { call: "POST /events/${ev}/lock-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/start-judging", payload: {}, as: Organizer }
          trigger:
