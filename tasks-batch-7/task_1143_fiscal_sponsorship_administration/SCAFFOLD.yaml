# =============================================================================
# SCAFFOLD.yaml — Fiscal Sponsorship Administration (harder-than-expert)
# Sections §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  generate task hard than expert level! 1143. Fiscal Sponsorship Administration (fiscal sponsor organization): project application & mission alignment review, sponsorship model (comprehensive vs pre-approved grant relationship) selection, administrative fee & fund accounting per project, donation processing & receipting under sponsor's tax status, project spending approval & compliance oversight, employment vs contractor arrangements for project staff, project exit/spin-off to independent status, liability & risk management

domain_name: fiscal-sponsorship-administration
api_prefix: /fsa

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency        # OCC on FundAccount.version and SponsorshipAgreement.version
    - cascading_side_effects        # escalate -> suspend -> auto-reject -> release -> recompute
    - dual_variant_calculation      # fee by sponsorship model; settled vs forward-looking spend basis
    - derived_field_reconciliation  # available/committed/reserved, risk posture, contractor YTD
  entity_topology: flat             # all entities top-level under /fsa, joined by FK references
  state_machine_shape: cyclic       # revision loops (application, engagement), fork-join (exit signoffs), branching refunds
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # disbursement -> staff engagement / grant tranche; receipt -> donation
  role_model: segregation_of_duties # submitter != compliance approver != payer != sponsor approver; exit signers pairwise distinct
  consistency_model: immediate      # every mutation visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All money is integer cents. All dates are ISO8601 date (YYYY-MM-DD) unless
# suffixed _at (ISO8601 datetime UTC, logical clock — see POST /_clock/set_current_utc).
# common_fields: true => id (UUID, identity only, never a decision input),
# created_at, updated_at, version (starts 1, +1 per mutation).
# =============================================================================
entities:
  - name: ProjectApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_user_id, type: string, source: system, description: "X-User-ID of the Applicant who created the application; ownership anchor" }
      - { name: project_name, type: string, source: input, description: "Proposed project name" }
      - { name: mission_statement, type: string, source: input, description: "Charitable mission statement for alignment review" }
      - { name: requested_model, type: enum, source: input, default: COMPREHENSIVE, description: "Requested sponsorship model", constraints: "COMPREHENSIVE | PRE_APPROVED_GRANT" }
      - { name: budget_estimate_cents, type: integer, source: input, description: "Estimated annual budget in cents; must be >= 0" }
      - { name: contact_email, type: string, source: input, description: "Applicant contact email" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | COMPLIANCE_REVIEW | RETURNED | APPROVED | REJECTED | WITHDRAWN" }
      - { name: purpose_pts, type: number, source: input, description: "Mission scorecard: charitable purpose points 0..100, set by mission-score call" }
      - { name: benefit_pts, type: number, source: input, description: "Mission scorecard: community benefit points 0..100" }
      - { name: capacity_pts, type: number, source: input, description: "Mission scorecard: organizational capacity points 0..100" }
      - { name: risk_pts, type: number, source: input, description: "Mission scorecard: risk points 0..100 (higher = riskier; inverted in score)" }
      - { name: mission_score, type: number, source: computed, description: "Weighted alignment score per calculations.mission_alignment_score; null until scored" }
      - { name: review_note, type: string, source: input, description: "Reviewer note captured on the latest mission-score or compliance-decision call", constraints: "optional" }
      - { name: decided_model, type: enum, source: system, description: "Model actually granted at compliance-decision APPROVE (may differ from requested_model)", constraints: "COMPREHENSIVE | PRE_APPROVED_GRANT; null until approved" }
      - { name: submit_count, type: integer, source: system, description: "Number of times submitted; starts 0, +1 per successful submit (revision loop counter)" }
      - { name: project_id, type: string, source: system, description: "Project id minted on APPROVED; null otherwise" }
      - { name: agreement_id, type: string, source: system, description: "SponsorshipAgreement id minted on APPROVED; null otherwise" }
      - { name: fund_account_id, type: string, source: system, description: "FundAccount id minted on APPROVED; null otherwise" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: source_application_id, type: string, source: system, description: "FK -> ProjectApplication.id; application this project was approved from" }
      - { name: name, type: string, source: system, description: "Copied from ProjectApplication.project_name at approval" }
      - { name: mission_statement, type: string, source: system, description: "Copied from ProjectApplication.mission_statement at approval" }
      - { name: lead_user_id, type: string, source: system, description: "Copied from ProjectApplication.applicant_user_id; audit anchor for the project lead" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SUSPENDED | SPUN_OFF | TERMINATED" }
      - { name: risk_score, type: integer, source: computed, description: "Open-incident weighted score per calculations.risk_posture_score" }
      - { name: oversight_posture, type: enum, source: computed, description: "NORMAL | RESTRICTED | SEVERE; derived from risk_score bands 25 / 50" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded on the latest suspend; null while ACTIVE", constraints: "optional" }

  - name: SponsorshipAgreement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; 1:1 with Project" }
      - { name: model, type: enum, source: system, description: "COMPREHENSIVE | PRE_APPROVED_GRANT; copied from application decided_model" }
      - { name: status, type: enum, source: system, description: "PENDING_COUNTERSIGN | ACTIVE | SUPERSEDED_BY_INDEPENDENCE | TERMINATED" }
      - { name: spending_basis, type: enum, source: system, default: SETTLED, description: "SETTLED | FORWARD_LOOKING; selects calculations.available_spend_balance variant; FORWARD_LOOKING legal only under COMPREHENSIVE" }
      - { name: amendment_note, type: string, source: input, description: "Note from latest amend call", constraints: "optional" }
      - { name: effective_date, type: string, source: input, description: "ISO date the agreement terms take effect, set at amend/countersign", constraints: "optional" }

  - name: FundAccount
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; 1:1 with Project" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | FROZEN | CLOSED" }
      - { name: currency, type: string, source: system, default: "USD", description: "ISO currency; fixed USD" }
      - { name: total_received_cents, type: integer, source: computed, description: "Sum of donation amounts moved PLEDGED->RECEIVED" }
      - { name: total_refunded_cents, type: integer, source: computed, description: "Sum of approved refund amounts" }
      - { name: total_fees_charged_cents, type: integer, source: computed, description: "Per-receipt admin fees + grant annual fees + exit fee" }
      - { name: total_fees_reversed_cents, type: integer, source: computed, description: "Fee reversals posted at period close" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum of PAID disbursement amounts (incl. exit-settled payouts)" }
      - { name: total_adjustments_cents, type: integer, source: computed, description: "Signed sum of manual adjustments" }
      - { name: total_transferred_out_cents, type: integer, source: computed, description: "Exit transfer + termination sweep amounts" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of disbursement amounts in SUBMITTED | PENDING_SPONSOR | APPROVED_FOR_PAYMENT" }
      - { name: reserved_cents, type: integer, source: computed, description: "Compliance reserve held at exit; 0 until exit execute" }
      - { name: available_cents, type: integer, source: computed, description: "received - refunded - fees_charged + fees_reversed - disbursed - transferred + adjustments - committed - reserved" }
      - { name: forward_available_cents, type: integer, source: computed, description: "available_cents + round_half_up(0.8 * sum of PLEDGED donation amounts) per calculations.available_spend_balance" }

  - name: FundLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: fund_account_id, type: string, source: system, description: "FK -> FundAccount.id; owning fund" }
      - { name: entry_type, type: enum, source: system, description: "DONATION_CREDIT | FEE_DEBIT | DONATION_REFUND_DEBIT | FEE_REVERSAL_CREDIT | COMMITMENT_HOLD | COMMITMENT_RELEASE | DISBURSEMENT_DEBIT | ADJUSTMENT | RESERVE_HOLD | EXIT_TRANSFER_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; credits positive, debits negative" }
      - { name: donation_id, type: string, source: system, description: "FK -> Donation.id; set for donation-linked entries, else null", constraints: "nullable" }
      - { name: disbursement_id, type: string, source: system, description: "FK -> DisbursementRequest.id; set for disbursement-linked entries, else null", constraints: "nullable" }
      - { name: memo, type: string, source: system, description: "Human-readable posting memo" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project receiving the gift" }
      - { name: fund_account_id, type: string, source: system, description: "FK -> FundAccount.id; fund credited on receive" }
      - { name: amount_cents, type: integer, source: input, description: "Gross gift amount; must be >= 100" }
      - { name: donor_name, type: string, source: input, description: "Donor legal name for receipting under the sponsor's tax status" }
      - { name: donor_email, type: string, source: input, description: "Donor email" }
      - { name: donor_tax_id, type: string, source: input, description: "Donor tax id captured for receipting", constraints: "optional" }
      - { name: anonymous, type: boolean, source: input, default: false, description: "Suppress donor name on public listings" }
      - { name: payment_method, type: enum, source: input, description: "CARD | ACH | CHECK | WIRE" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | RECEIPTED | REFUND_REQUESTED | REFUNDED" }
      - { name: fee_cents, type: integer, source: computed, description: "Admin fee assessed at receive per calculations.admin_fee_on_receipt" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative approved refunds against this donation" }
      - { name: pending_refund_amount_cents, type: integer, source: system, description: "Amount frozen by the open refund request; null unless REFUND_REQUESTED", constraints: "nullable" }
      - { name: status_before_refund, type: enum, source: system, description: "RECEIVED | RECEIPTED; restore target on refund approve/reject", constraints: "nullable" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of PLEDGED->RECEIVED; null until received", constraints: "nullable" }
      - { name: refunded_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest approved refund; null until any refund", constraints: "nullable" }

  - name: TaxReceipt
    parent: null
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: system, description: "FK -> Donation.id; donation this receipt acknowledges" }
      - { name: receipt_number, type: string, source: system, description: "FS-<tax_year>-<6-digit sequence>; sequence is per tax_year, assigned in issuance order" }
      - { name: tax_year, type: integer, source: system, description: "Calendar year of the logical clock at issuance" }
      - { name: amount_cents, type: integer, source: system, description: "Receipted amount; on reissue after partial refund equals amount - refunded" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }
      - { name: void_reason, type: enum, source: system, description: "PARTIAL_REFUND | FULL_REFUND | null", constraints: "nullable" }

  - name: DisbursementRequest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; spending project" }
      - { name: fund_account_id, type: string, source: system, description: "FK -> FundAccount.id; fund debited" }
      - { name: staff_engagement_id, type: string, source: input, description: "FK -> StaffEngagement.id; required when payee_type == STAFF, else must be omitted", constraints: "nullable" }
      - { name: grant_tranche_id, type: string, source: system, description: "FK -> GrantTranche.id; covering tranche resolved at submit under PRE_APPROVED_GRANT, else null", constraints: "nullable" }
      - { name: amount_cents, type: integer, source: input, description: "Spend amount; must be >= 1" }
      - { name: purpose, type: string, source: input, description: "Charitable-purpose justification for the spend" }
      - { name: payee_type, type: enum, source: input, description: "VENDOR | STAFF | OTHER" }
      - { name: payee_name, type: string, source: input, description: "Payee display name" }
      - { name: spend_date, type: string, source: input, description: "ISO date the spend is incurred; used for tranche coverage under PRE_APPROVED_GRANT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PENDING_SPONSOR | APPROVED_FOR_PAYMENT | PAID | REJECTED | CANCELLED" }
      - { name: high_value, type: boolean, source: computed, description: "amount_cents >= 1000000 (HIGH_VALUE_THRESHOLD_CENTS); routes through sponsor approval" }
      - { name: exit_settled, type: boolean, source: system, default: false, description: "True when paid as part of exit waterfall" }
      - { name: auto_reject_reason, type: string, source: system, description: "Set when auto-rejected by project suspension cascade", constraints: "nullable" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID recorded at submit; segregation-of-duties anchor" }
      - { name: compliance_approved_by_user_id, type: string, source: system, description: "X-User-ID recorded at compliance APPROVE", constraints: "nullable" }
      - { name: sponsor_approved_by_user_id, type: string, source: system, description: "X-User-ID recorded at sponsor-approve", constraints: "nullable" }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID recorded at pay", constraints: "nullable" }

  - name: StaffEngagement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; engaging project" }
      - { name: worker_name, type: string, source: input, description: "Worker legal name" }
      - { name: worker_email, type: string, source: input, description: "Worker email; identity key for overlap/duplicate rules" }
      - { name: engagement_type, type: enum, source: input, description: "EMPLOYEE | CONTRACTOR; EMPLOYEE legal only under COMPREHENSIVE model" }
      - { name: classification_overridden, type: boolean, source: system, default: false, description: "True when classification-review approved a type different from the proposed one" }
      - { name: compensation_type, type: enum, source: input, description: "HOURLY | SALARY | FIXED" }
      - { name: rate_cents, type: integer, source: input, description: "Rate in cents (per hour / per period / fixed); must be >= 1" }
      - { name: start_date, type: string, source: input, description: "ISO engagement start date (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO engagement end date (exclusive); null = open-ended", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VETTED | ACTIVE | CLASSIFICATION_REVIEW | TERMINATED" }
      - { name: contractor_ytd_cents, type: integer, source: computed, description: "Calendar-year PAID disbursement total to this contractor; resets on year change per calculations.contractor_ytd_accumulation" }
      - { name: ytd_year, type: integer, source: system, description: "Calendar year contractor_ytd_cents currently accumulates; null until first payment", constraints: "nullable" }
      - { name: requires_1099, type: boolean, source: computed, description: "contractor_ytd_cents >= 60000 (CONTRACTOR_REPORT_THRESHOLD_CENTS)" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; reviewed project" }
      - { name: review_type, type: enum, source: input, description: "SCHEDULED | TRIGGERED" }
      - { name: status, type: enum, source: system, description: "OPEN | FINDINGS_ISSUED | REMEDIATED | CLOSED | ESCALATED" }
      - { name: findings_count, type: integer, source: system, default: 0, description: "Total findings issued" }
      - { name: open_findings_count, type: integer, source: system, default: 0, description: "Findings not yet remediated" }
      - { name: severity_max, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL; max severity across findings", constraints: "set on issue-findings" }
      - { name: note, type: string, source: input, description: "Reviewer note", constraints: "optional" }

  - name: RiskIncident
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; affected project" }
      - { name: category, type: enum, source: input, description: "LIABILITY | FINANCIAL | REPUTATIONAL | REGULATORY | SAFETY" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Incident narrative" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | MITIGATING | RESOLVED | DISMISSED" }
      - { name: resolution_note, type: string, source: input, description: "Note captured on RESOLVE or DISMISS", constraints: "optional" }

  - name: ExitPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; exiting project" }
      - { name: successor_entity_name, type: string, source: input, description: "Independent entity the project spins off into" }
      - { name: successor_ein, type: string, source: input, description: "Successor EIN (tax id) for the asset transfer record" }
      - { name: reason, type: string, source: input, description: "Exit rationale" }
      - { name: status, type: enum, source: system, description: "PROPOSED | DUE_DILIGENCE | APPROVED | COMPLETED | ABANDONED" }
      - { name: signoffs, type: array, source: system, description: "Collected signoff entries {party, signer_user_id, signed_at}; parties SPONSOR_BOARD | PROJECT_LEAD | SUCCESSOR_REP" }
      - { name: committed_payout_cents, type: integer, source: computed, description: "Exit waterfall bucket 1: committed obligations paid at execute" }
      - { name: reserve_cents, type: integer, source: computed, description: "Exit waterfall bucket 2: 250000 x open findings (RESERVE_PER_OPEN_FINDING_CENTS)" }
      - { name: exit_fee_cents, type: integer, source: computed, description: "Exit waterfall bucket 3: max(50000, round_half_up(0.02 x base))" }
      - { name: transfer_cents, type: integer, source: computed, description: "Exit waterfall bucket 4: remainder transferred to successor" }

  - name: GrantTranche
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> SponsorshipAgreement.id; granting agreement (PRE_APPROVED_GRANT only)" }
      - { name: amount_cents, type: integer, source: input, description: "Tranche budget; must be >= 1" }
      - { name: period_start, type: string, source: input, description: "ISO coverage start date (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO coverage end date (INCLUSIVE — closed-interval semantics)" }
      - { name: purpose, type: string, source: input, description: "Restricted purpose of the tranche" }
      - { name: status, type: enum, source: system, description: "ISSUED | CLOSED" }
      - { name: committed_cents, type: integer, source: computed, description: "Non-terminal submitted disbursement amounts charged against this tranche" }
      - { name: spent_cents, type: integer, source: computed, description: "PAID disbursement amounts charged against this tranche" }
      - { name: report_note, type: string, source: input, description: "Grant report note required at close", constraints: "set on close" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: fund_account_id, type: string, source: system, description: "FK -> FundAccount.id; assessed fund" }
      - { name: period_start, type: string, source: input, description: "ISO period start date (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO period end date (inclusive)" }
      - { name: status, type: enum, source: system, description: "FINAL (assessments are only persisted once finalized at period close)" }
      - { name: provisional_fees_cents, type: integer, source: computed, description: "Sum of per-donation fee_cents for donations received in the period" }
      - { name: refund_reversals_cents, type: integer, source: computed, description: "Proportional fee reversals for period donations with refunds; COMPREHENSIVE only" }
      - { name: annual_platform_fee_cents, type: integer, source: computed, description: "25000 annual fee when first FINAL close in a receipt-bearing calendar year under PRE_APPROVED_GRANT; else 0" }
      - { name: final_fees_cents, type: integer, source: computed, description: "provisional - refund_reversals + annual_platform_fee" }
      - { name: delta_cents, type: integer, source: computed, description: "final - provisional; posted as FEE_REVERSAL_CREDIT (negative delta) or FEE_DEBIT (positive delta)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProjectApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fsa/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID == applicant_user_id (ownership)"
        side_effects:
          - "submit_count += 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /fsa/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID == applicant_user_id (ownership)"
        side_effects:
          - "submit_count += 1"
          - "prior mission scorecard points are retained until re-scored"
      - from: SUBMITTED
        to: COMPLIANCE_REVIEW
        trigger: "POST /fsa/applications/{id}/mission-score (action=ADVANCE)"
        actor: ProgramOfficer
        preconditions:
          - "mission_score >= 70.00 (MISSION_SCORE_THRESHOLD) with per-component rounding order pinned in calculations.mission_alignment_score"
        side_effects:
          - "mission_score computed and persisted"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /fsa/applications/{id}/mission-score (action=RETURN)"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "mission_score computed and persisted"
      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /fsa/applications/{id}/compliance-decision (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions:
          - "sponsorship_model present in request"
        side_effects:
          - "decided_model := request sponsorship_model"
          - "Project created: status=PROPOSED, name/mission/lead copied from application, source_application_id set (cascade hop 1)"
          - "SponsorshipAgreement created: status=PENDING_COUNTERSIGN, model=decided_model, project_id set (cascade hop 2, caused by hop 1)"
          - "FundAccount created: status=PENDING, all totals 0, project_id set (cascade hop 3, caused by hop 1)"
          - "application.project_id / agreement_id / fund_account_id set"
      - from: COMPLIANCE_REVIEW
        to: REJECTED
        trigger: "POST /fsa/applications/{id}/compliance-decision (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: COMPLIANCE_REVIEW
        to: RETURNED
        trigger: "POST /fsa/applications/{id}/compliance-decision (decision=RETURN)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /fsa/applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == applicant_user_id"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /fsa/applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == applicant_user_id"]
        side_effects: []
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /fsa/applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == applicant_user_id"]
        side_effects: []
      - from: COMPLIANCE_REVIEW
        to: WITHDRAWN
        trigger: "POST /fsa/applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == applicant_user_id"]
        side_effects: []
    note: "Revision loop SUBMITTED -> RETURNED -> SUBMITTED may repeat; submit_count tracks iterations. Approval mints Project + Agreement + FundAccount in one atomic cascade."

  - entity: Project
    initial_state: PROPOSED
    terminal_states: [SPUN_OFF, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /fsa/agreements/{id}/countersign (on the project's agreement)"
        actor: Applicant
        preconditions: ["agreement status == PENDING_COUNTERSIGN"]
        side_effects:
          - "FundAccount PENDING -> ACTIVE (cascade hop 2, caused by activation of the project)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fsa/projects/{id}/suspend OR ComplianceReview escalate cascade"
        actor: ComplianceOfficer | SponsorAdmin | system
        preconditions: []
        side_effects:
          - "FundAccount ACTIVE -> FROZEN (cascade hop 2)"
          - "Every DisbursementRequest in SUBMITTED | PENDING_SPONSOR | APPROVED_FOR_PAYMENT -> REJECTED with auto_reject_reason=SUSPENSION (cascade hop 3)"
          - "Each auto-rejected disbursement releases its commitment: FundAccount.committed_cents -= amount, COMMITMENT_RELEASE ledger entry posted, grant_tranche.committed_cents -= amount when grant_tranche_id set (cascade hop 4)"
          - "available_cents recomputed after releases"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fsa/projects/{id}/reinstate"
        actor: SponsorAdmin
        preconditions:
          - "no ComplianceReview for the project in ESCALATED"
          - "no RiskIncident for the project with severity=CRITICAL in REPORTED | TRIAGED | MITIGATING"
        side_effects:
          - "FundAccount FROZEN -> ACTIVE (cascade hop 2)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fsa/projects/{id}/terminate"
        actor: SponsorAdmin
        preconditions:
          - "fund available_cents == 0 AND committed_cents == 0 AND reserved_cents == 0 (ERR_FUNDS_REMAIN otherwise)"
        side_effects:
          - "SponsorshipAgreement ACTIVE -> TERMINATED (cascade hop 2)"
          - "FundAccount -> CLOSED (cascade hop 3)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /fsa/projects/{id}/terminate"
        actor: SponsorAdmin
        preconditions:
          - "fund available_cents == 0 AND committed_cents == 0 AND reserved_cents == 0"
        side_effects:
          - "SponsorshipAgreement ACTIVE -> TERMINATED"
          - "FundAccount FROZEN -> CLOSED"
      - from: ACTIVE
        to: SPUN_OFF
        trigger: "POST /fsa/exit-plans/{id}/execute (exit waterfall completes)"
        actor: system
        preconditions: ["exit plan APPROVED"]
        side_effects:
          - "SponsorshipAgreement ACTIVE -> SUPERSEDED_BY_INDEPENDENCE"
          - "FundAccount -> CLOSED (available 0; reserved_cents retains the reserve held by sponsor)"
    note: "oversight_posture (NORMAL/RESTRICTED/SEVERE) is a computed orthogonal gate, not a status: RESTRICTED blocks staff activate and exit due-diligence; SEVERE additionally blocks donation receive and disbursement submit."

  - entity: SponsorshipAgreement
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [SUPERSEDED_BY_INDEPENDENCE, TERMINATED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /fsa/agreements/{id}/countersign"
        actor: Applicant
        preconditions: ["X-User-ID == source application's applicant_user_id"]
        side_effects:
          - "Project PROPOSED -> ACTIVE"
          - "FundAccount PENDING -> ACTIVE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fsa/agreements/{id}/amend"
        actor: SponsorAdmin
        preconditions:
          - "expected_agreement_version == current version (OCC, concurrency_rules[agreement-amend-stale-version])"
          - "spending_basis=FORWARD_LOOKING only when model == COMPREHENSIVE (ERR_MODEL_MISMATCH)"
        side_effects:
          - "version increments by 1"
          - "spending_basis / effective_date / amendment_note updated"
      - from: ACTIVE
        to: SUPERSEDED_BY_INDEPENDENCE
        trigger: "POST /fsa/exit-plans/{id}/execute"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fsa/projects/{id}/terminate"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FundAccount
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /fsa/agreements/{id}/countersign"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FROZEN
        trigger: "project suspend (manual or escalate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /fsa/projects/{id}/reinstate"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "exit execute OR project terminate"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: CLOSED
        trigger: "project terminate"
        actor: system
        preconditions: []
        side_effects: []
    note: "All balance movements post FundLedgerEntry rows; the fund conservation invariant is pinned in calculations (see compensating invariants, §1.8 rule compensating_invariant)."

  - entity: Donation
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /fsa/donations/{id}/receive"
        actor: FinanceOfficer
        preconditions:
          - "project status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "fund status == ACTIVE (ERR_FUND_NOT_ACTIVE)"
          - "project oversight_posture != SEVERE (ERR_SEVERE_POSTURE_BLOCKS_SPEND)"
        side_effects:
          - "fee_cents := calculations.admin_fee_on_receipt (variant by agreement.model)"
          - "fund.total_received_cents += amount_cents; fund.total_fees_charged_cents += fee_cents"
          - "ledger DONATION_CREDIT +amount_cents and FEE_DEBIT -fee_cents (two entries, donation_id set)"
          - "received_at := logical clock"
      - from: RECEIVED
        to: RECEIPTED
        trigger: "POST /fsa/donations/{id}/issue-receipt"
        actor: FinanceOfficer
        preconditions: ["agreement status == ACTIVE"]
        side_effects:
          - "TaxReceipt created ISSUED: receipt_number FS-<tax_year>-<seq>, amount_cents == donation.amount_cents (cascade hop 2)"
      - from: RECEIVED
        to: REFUND_REQUESTED
        trigger: "POST /fsa/donations/{id}/request-refund"
        actor: Donor | FinanceOfficer
        preconditions: ["amount_cents(request) >= 1 AND <= donation.amount_cents - donation.refunded_cents (ERR_REFUND_EXCEEDS_REMAINING)"]
        side_effects:
          - "pending_refund_amount_cents := request amount; status_before_refund := RECEIVED"
      - from: RECEIPTED
        to: REFUND_REQUESTED
        trigger: "POST /fsa/donations/{id}/request-refund"
        actor: Donor | FinanceOfficer
        preconditions: ["amount_cents(request) >= 1 AND <= donation.amount_cents - donation.refunded_cents"]
        side_effects:
          - "pending_refund_amount_cents := request amount; status_before_refund := RECEIPTED"
      - from: REFUND_REQUESTED
        to: RECEIVED
        trigger: "POST /fsa/donations/{id}/decide-refund (decision=APPROVE, partial refund, status_before_refund == RECEIVED)"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "refunded_cents += pending; total_refunded_cents += pending; DONATION_REFUND_DEBIT ledger entry"
          - "pending_refund_amount_cents := null; refunded_at := logical clock"
      - from: REFUND_REQUESTED
        to: RECEIPTED
        trigger: "POST /fsa/donations/{id}/decide-refund (decision=APPROVE, partial refund, status_before_refund == RECEIPTED)"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "refunded_cents += pending; total_refunded_cents += pending; DONATION_REFUND_DEBIT ledger entry (cascade hop 1 effect)"
          - "existing ISSUED receipt -> VOIDED with void_reason=PARTIAL_REFUND (cascade hop 2, caused by the refund posting)"
          - "replacement TaxReceipt ISSUED with amount_cents == amount_cents - refunded_cents and a new receipt_number (cascade hop 3, caused by hop 2)"
      - from: REFUND_REQUESTED
        to: REFUNDED
        trigger: "POST /fsa/donations/{id}/decide-refund (decision=APPROVE, refund covers full remaining amount)"
        actor: SponsorAdmin
        preconditions: []
        side_effects:
          - "refunded_cents := amount_cents; total_refunded_cents += pending; DONATION_REFUND_DEBIT entry"
          - "ISSUED receipt (if any) -> VOIDED with void_reason=FULL_REFUND (cascade hop 2)"
      - from: REFUND_REQUESTED
        to: RECEIVED
        trigger: "POST /fsa/donations/{id}/decide-refund (decision=REJECT, status_before_refund == RECEIVED)"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["pending_refund_amount_cents := null; no fund movement"]
      - from: REFUND_REQUESTED
        to: RECEIPTED
        trigger: "POST /fsa/donations/{id}/decide-refund (decision=REJECT, status_before_refund == RECEIPTED)"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["pending_refund_amount_cents := null; no fund movement"]
    note: "Fees are NOT reversed at refund time; reversal happens at period close per calculations.fee_period_reconciliation (COMPREHENSIVE only)."

  - entity: TaxReceipt
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "refund approve cascade (PARTIAL_REFUND | FULL_REFUND)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Receipt numbers are never reused; a voided receipt remains queryable."

  - entity: DisbursementRequest
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fsa/disbursement-requests/{id}/submit"
        actor: ProjectLead
        preconditions:
          - "X-User-ID == project_id of the request's project (ProjectLead ownership)"
          - "project status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "project oversight_posture != SEVERE (ERR_SEVERE_POSTURE_BLOCKS_SPEND)"
          - "agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "fund status == ACTIVE (ERR_FUND_NOT_ACTIVE)"
          - "payee_type == STAFF implies staff engagement exists, belongs to the project, and status == ACTIVE (ERR_STAFF_ENGAGEMENT_REQUIRED)"
          - "under PRE_APPROVED_GRANT: exactly one tranche whose closed period covers spend_date (ERR_NO_COVERING_TRANCHE)"
          - "amount_cents <= fund balance per agreement.spending_basis variant (ERR_INSUFFICIENT_FUNDS)"
          - "under PRE_APPROVED_GRANT: tranche.amount_cents - spent_cents - committed_cents >= amount_cents (ERR_TRANCHE_BUDGET_EXCEEDED)"
        side_effects:
          - "fund.committed_cents += amount_cents; COMMITMENT_HOLD ledger entry (disbursement_id set)"
          - "grant_tranche.committed_cents += amount_cents when grant_tranche_id set (cascade hop 2)"
          - "submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /fsa/disbursement-requests/{id}/compliance-review (decision=APPROVE, high_value == false)"
        actor: ComplianceOfficer
        preconditions: ["X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["compliance_approved_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: PENDING_SPONSOR
        trigger: "POST /fsa/disbursement-requests/{id}/compliance-review (decision=APPROVE, high_value == true)"
        actor: ComplianceOfficer
        preconditions: ["X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["compliance_approved_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /fsa/disbursement-requests/{id}/compliance-review (decision=RETURN)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "commitment released: committed_cents -= amount, COMMITMENT_RELEASE entry, tranche.committed_cents -= amount when set"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fsa/disbursement-requests/{id}/compliance-review (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["commitment released (as RETURN)"]
      - from: PENDING_SPONSOR
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /fsa/disbursement-requests/{id}/sponsor-approve (decision=APPROVE)"
        actor: SponsorAdmin
        preconditions: ["X-User-ID != submitted_by_user_id AND X-User-ID != compliance_approved_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["sponsor_approved_by_user_id := X-User-ID"]
      - from: PENDING_SPONSOR
        to: REJECTED
        trigger: "POST /fsa/disbursement-requests/{id}/sponsor-approve (decision=REJECT)"
        actor: SponsorAdmin
        preconditions: []
        side_effects: ["commitment released"]
      - from: APPROVED_FOR_PAYMENT
        to: PAID
        trigger: "POST /fsa/disbursement-requests/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id AND != compliance_approved_by_user_id AND != sponsor_approved_by_user_id when set (ERR_SOD_VIOLATION)"
          - "no RiskIncident for the project with severity=CRITICAL in REPORTED | TRIAGED | MITIGATING (ERR_CRITICAL_INCIDENT_OPEN)"
        side_effects:
          - "fund.committed_cents -= amount; fund.total_disbursed_cents += amount"
          - "COMMITMENT_RELEASE + DISBURSEMENT_DEBIT ledger entries"
          - "grant_tranche.committed_cents -= amount; grant_tranche.spent_cents += amount when set (cascade hop 2)"
          - "STAFF payee: contractor_ytd_cents accumulation per calculations.contractor_ytd_accumulation; requires_1099 recomputed (cascade hop 3, caused by hop 2's payment posting)"
          - "paid_by_user_id := X-User-ID"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fsa/disbursement-requests/{id}/cancel"
        actor: ProjectLead
        preconditions: ["X-User-ID == project_id"]
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /fsa/disbursement-requests/{id}/cancel"
        actor: ProjectLead
        preconditions: ["X-User-ID == project_id"]
        side_effects: ["commitment released"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system cascade on project suspend"
        actor: system
        preconditions: []
        side_effects: ["auto_reject_reason=SUSPENSION; commitment released"]
      - from: PENDING_SPONSOR
        to: REJECTED
        trigger: "system cascade on project suspend"
        actor: system
        preconditions: []
        side_effects: ["auto_reject_reason=SUSPENSION; commitment released"]
      - from: APPROVED_FOR_PAYMENT
        to: REJECTED
        trigger: "system cascade on project suspend"
        actor: system
        preconditions: []
        side_effects: ["auto_reject_reason=SUSPENSION; commitment released"]
    note: "Approval chain DRAFT -> SUBMITTED -> (PENDING_SPONSOR when high_value) -> APPROVED_FOR_PAYMENT -> PAID, with a RETURN revision loop back to DRAFT. Commitment is taken at submit and released on every non-PAID exit."

  - entity: StaffEngagement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: VETTED
        trigger: "POST /fsa/staff-engagements/{id}/classification-review"
        actor: ComplianceOfficer
        preconditions:
          - "approved_type == EMPLOYEE implies agreement.model == COMPREHENSIVE (ERR_MODEL_FORBIDS_EMPLOYMENT)"
        side_effects:
          - "engagement_type := approved_type; classification_overridden := (approved_type != proposed type)"
      - from: CLASSIFICATION_REVIEW
        to: VETTED
        trigger: "POST /fsa/staff-engagements/{id}/classification-review"
        actor: ComplianceOfficer
        preconditions:
          - "approved_type == EMPLOYEE implies agreement.model == COMPREHENSIVE"
        side_effects:
          - "engagement_type := approved_type; classification_overridden recomputed"
      - from: VETTED
        to: ACTIVE
        trigger: "POST /fsa/staff-engagements/{id}/activate"
        actor: ProjectLead
        preconditions:
          - "agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "project oversight_posture != RESTRICTED and != SEVERE (ERR_SEVERE_POSTURE_BLOCKS_SPEND)"
          - "no other ACTIVE engagement on same project with same worker_email whose half-open [start_date, end_date) interval overlaps (ERR_ENGAGEMENT_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: CLASSIFICATION_REVIEW
        trigger: "POST /fsa/staff-engagements/{id}/flag-misclassification"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fsa/staff-engagements/{id}/terminate"
        actor: ProjectLead | ComplianceOfficer
        preconditions: []
        side_effects: ["end_date := request end_date when provided"]
      - from: VETTED
        to: TERMINATED
        trigger: "POST /fsa/staff-engagements/{id}/terminate"
        actor: ProjectLead | ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: CLASSIFICATION_REVIEW
        to: TERMINATED
        trigger: "POST /fsa/staff-engagements/{id}/terminate"
        actor: ProjectLead | ComplianceOfficer
        preconditions: []
        side_effects: []
    note: "Reclassification cycle ACTIVE -> CLASSIFICATION_REVIEW -> VETTED -> ACTIVE may repeat; each pass may flip engagement_type."

  - entity: ComplianceReview
    initial_state: OPEN
    terminal_states: [CLOSED, ESCALATED]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /fsa/compliance-reviews/{id}/issue-findings"
        actor: ComplianceOfficer
        preconditions: ["findings_count >= 1"]
        side_effects:
          - "findings_count := input; open_findings_count := input; severity_max := input"
          - "project risk_score and oversight_posture recomputed (cascade hop 2)"
      - from: FINDINGS_ISSUED
        to: FINDINGS_ISSUED
        trigger: "POST /fsa/compliance-reviews/{id}/remediate (remediated_count < open_findings_count)"
        actor: ComplianceOfficer
        preconditions: ["remediated_count >= 1 AND <= open_findings_count (ERR_REMEDIATION_EXCEEDS_OPEN)"]
        side_effects:
          - "open_findings_count -= remediated_count"
          - "project risk_score recomputed"
      - from: FINDINGS_ISSUED
        to: REMEDIATED
        trigger: "POST /fsa/compliance-reviews/{id}/remediate (remediated_count == open_findings_count)"
        actor: ComplianceOfficer
        preconditions: ["remediated_count >= 1 AND <= open_findings_count"]
        side_effects:
          - "open_findings_count := 0"
          - "project risk_score recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /fsa/compliance-reviews/{id}/close"
        actor: ComplianceOfficer
        preconditions: ["findings_count == 0"]
        side_effects: []
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /fsa/compliance-reviews/{id}/close"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: FINDINGS_ISSUED
        to: ESCALATED
        trigger: "POST /fsa/compliance-reviews/{id}/escalate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "project ACTIVE -> SUSPENDED with suspension_reason=ESCALATED_REVIEW (cascade hop 2)"
          - "fund ACTIVE -> FROZEN (cascade hop 3, caused by project suspension)"
          - "in-flight disbursements auto-REJECTED with commitment release (cascade hop 4, caused by project suspension)"
    note: "ESCALATED is terminal for the review; project reinstatement is a separate manual action."

  - entity: RiskIncident
    initial_state: REPORTED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=TRIAGE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed (status set participates in the open set)"]
      - from: TRIAGED
        to: MITIGATING
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=MITIGATE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=RESOLVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed"]
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=RESOLVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed"]
      - from: MITIGATING
        to: RESOLVED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=RESOLVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed"]
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=DISMISS)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed"]
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /fsa/risk-incidents/{id}/transition (action=DISMISS)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["project risk_score recomputed"]

  - entity: ExitPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: DUE_DILIGENCE
        trigger: "POST /fsa/exit-plans/{id}/begin-due-diligence"
        actor: SponsorAdmin
        preconditions:
          - "no ComplianceReview for the project in OPEN | ESCALATED (ERR_OPEN_COMPLIANCE_BLOCKS_EXIT); FINDINGS_ISSUED reviews do NOT block — their open findings are covered by the exit reserve bucket"
          - "no RiskIncident for the project with severity=CRITICAL in REPORTED | TRIAGED | MITIGATING (ERR_CRITICAL_INCIDENT_OPEN)"
          - "project oversight_posture != RESTRICTED and != SEVERE (ERR_SEVERE_POSTURE_BLOCKS_SPEND)"
        side_effects: []
      - from: DUE_DILIGENCE
        to: DUE_DILIGENCE
        trigger: "POST /fsa/exit-plans/{id}/signoff (fewer than 3 distinct parties collected)"
        actor: SponsorAdmin | ProjectLead
        preconditions:
          - "party not already present in signoffs (ERR_SIGNOFF_PARTY_REPEATED)"
          - "X-User-ID not already present as signer_user_id in signoffs (ERR_SIGNER_REUSED)"
          - "party PROJECT_LEAD requires role ProjectLead with X-User-ID == project_id; parties SPONSOR_BOARD and SUCCESSOR_REP require role SponsorAdmin"
        side_effects: ["signoff entry appended"]
      - from: DUE_DILIGENCE
        to: APPROVED
        trigger: "POST /fsa/exit-plans/{id}/signoff (third distinct party collected)"
        actor: SponsorAdmin | ProjectLead
        preconditions: ["same as collecting signoff"]
        side_effects: ["signoff entry appended; all three parties present"]
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /fsa/exit-plans/{id}/execute"
        actor: SponsorAdmin
        preconditions:
          - "settlement base >= 0 AND transfer >= 0 per calculations.exit_settlement_waterfall (ERR_EXIT_INSOLVENT)"
        side_effects:
          - "SUBMITTED disbursements auto-REJECTED with commitment release (cascade hop 2, caused by execute); DRAFT disbursements auto-CANCELLED"
          - "PENDING_SPONSOR and APPROVED_FOR_PAYMENT disbursements -> PAID with exit_settled=true (committed_payout bucket)"
          - "RESERVE_HOLD ledger entry for reserve_cents; fund.reserved_cents := reserve_cents"
          - "FEE_DEBIT ledger entry for exit_fee_cents; fund.total_fees_charged_cents += exit_fee_cents"
          - "EXIT_TRANSFER_DEBIT ledger entry for transfer_cents; fund.total_transferred_out_cents += transfer_cents"
          - "FundAccount -> CLOSED; SponsorshipAgreement ACTIVE -> SUPERSEDED_BY_INDEPENDENCE; Project ACTIVE -> SPUN_OFF (cascade hop 3, caused by the settlement postings)"
      - from: PROPOSED
        to: ABANDONED
        trigger: "POST /fsa/exit-plans/{id}/abandon"
        actor: SponsorAdmin | ProjectLead
        preconditions: []
        side_effects: []
      - from: DUE_DILIGENCE
        to: ABANDONED
        trigger: "POST /fsa/exit-plans/{id}/abandon"
        actor: SponsorAdmin | ProjectLead
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ABANDONED
        trigger: "POST /fsa/exit-plans/{id}/abandon"
        actor: SponsorAdmin | ProjectLead
        preconditions: []
        side_effects: []
    note: "Fork-join signoff collection: three distinct parties with pairwise-distinct signer user ids; the join fires on the third valid signoff."

  - entity: GrantTranche
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: CLOSED
        trigger: "POST /fsa/grant-tranches/{id}/close"
        actor: SponsorAdmin
        preconditions:
          - "logical clock date > period_end (reporting is due only after the closed period ends; ERR_TRANCHE_STATE_INVALID otherwise)"
          - "report_note present in request"
        side_effects: []
    note: "Tranche periods use CLOSED-interval semantics: [period_start, period_end] inclusive; two tranches on one agreement may not share a single calendar day (ERR_TRANCHE_PERIOD_OVERLAP)."

  - entity: FeeAssessment
    initial_state: FINAL
    terminal_states: []
    transitions: []
    note: "Append-only: created in FINAL state by close-period; never transitions."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: fund-adjustment-stale-version
    parent_entity: FundAccount
    write_endpoint: "POST /fsa/fund-accounts/{id}/adjustments"
    occ_field: "expected_fund_account_version"
    description: |
      Posting a manual adjustment against a FundAccount whose version has
      advanced since the client last observed it is rejected. Each successful
      adjustment legitimately succeeds on its own; the OCC check forces the
      second writer to re-read the fund before basing a signed amount on a
      balance view that an earlier adjustment already changed.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
  - rule_id: agreement-amend-stale-version
    parent_entity: SponsorshipAgreement
    write_endpoint: "POST /fsa/agreements/{id}/amend"
    occ_field: "expected_agreement_version"
    description: |
      Amending a SponsorshipAgreement whose version has advanced since the
      client last observed it is rejected. Amendments supersede the prior
      terms as a whole, so a writer holding a stale version must re-read the
      current terms before its amendment may replace them.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All rounding is round_half_up at 2-decimal-cent granularity on integer-cent
# arithmetic unless stated otherwise. Exact decimal arithmetic is normative.
# =============================================================================
calculations:
  - name: admin_fee_on_receipt
    trigger: "Donation PLEDGED -> RECEIVED"
    algorithm: tiered_pricing
    formula: |
      inputs: amount_cents, fund.total_received_cents BEFORE this receipt (cum_before), agreement.model
      if model == COMPREHENSIVE:
        remaining = amount_cents; cum = cum_before; fee = 0
        tier loop (in order):
          tier1: capacity = max(0, TIER1_CAP_CENTS - cum); seg = min(remaining, capacity)
                 fee += round_half_up(seg * 0.08); cum += seg; remaining -= seg
          tier2: capacity = max(0, TIER2_CAP_CENTS - TIER1_CAP_CENTS - max(0, cum - TIER1_CAP_CENTS))
                 seg = min(remaining, capacity)
                 fee += round_half_up(seg * 0.06); cum += seg; remaining -= seg
          tier3: seg = remaining; fee += round_half_up(seg * 0.04)
        fee = max(MIN_FEE_CENTS, fee)   # per-donation minimum, COMPREHENSIVE only
      if model == PRE_APPROVED_GRANT:
        fee = round_half_up(amount_cents * 0.03)   # flat; no per-donation minimum
      Per-segment rounding THEN sum is the pinned rounding order.
    input_set: "the receiving donation; fund totals as of before the receive; agreement.model"
    constants:
      TIER1_CAP_CENTS: 10000000      # first $100,000 cumulative received at 8%
      TIER2_CAP_CENTS: 50000000      # next $400,000 at 6%
      TIER3_BPS: 400                 # 4% beyond $500,000
      MIN_FEE_CENTS: 50              # comprehensive per-donation minimum
      GRANT_FLAT_BPS: 300            # 3% flat under pre-approved grant
    precision: "integer cents; per-segment round_half_up, then sum; exact decimal"
    variants:
      - name: comprehensive_tiered
        when: "agreement.model == COMPREHENSIVE"
        difference: "marginal tiers on cumulative receipts with per-donation minimum 50 cents"
      - name: grant_flat
        when: "agreement.model == PRE_APPROVED_GRANT"
        difference: "flat 3% per donation, no minimum, no cumulative input; annual platform fee settled separately at period close"

  - name: mission_alignment_score
    trigger: "POST /fsa/applications/{id}/mission-score"
    algorithm: weighted_scoring
    formula: |
      components (exact decimal):
        c1 = 0.335 * purpose_pts
        c2 = 0.265 * benefit_pts
        c3 = 0.215 * capacity_pts
        c4 = 0.185 * (100 - risk_pts)
      PINNED ROUNDING ORDER: round each component to 2 decimals round_half_up FIRST,
      then sum: score = r2(c1) + r2(c2) + r2(c3) + r2(c4).
      (Sum-then-round is a rejected alternative; it yields different totals, e.g.
      inputs 73/63/61/67 -> 60.39 pinned vs 60.37 sum-first.)
      ADVANCE additionally requires score >= 70.00 (>=, inclusive boundary).
    input_set: "the application's four scorecard point inputs"
    constants:
      W_PURPOSE: 0.335
      W_BENEFIT: 0.265
      W_CAPACITY: 0.215
      W_RISK_INVERSE: 0.185
      MISSION_SCORE_THRESHOLD: 70.00
    precision: "2 decimals per component, round_half_up, components rounded before summing"

  - name: available_spend_balance
    trigger: "DisbursementRequest submit fiscal check; project summary read"
    algorithm: aggregation
    formula: |
      settled_available = total_received_cents - total_refunded_cents
                          - total_fees_charged_cents + total_fees_reversed_cents
                          - total_disbursed_cents - total_transferred_out_cents
                          + total_adjustments_cents - committed_cents - reserved_cents
      forward_available = settled_available
                          + round_half_up(PLEDGE_CREDIT_FACTOR * sum(amount_cents of
                            donations of this project with status == PLEDGED))
      Variant used at submit: agreement.spending_basis == SETTLED -> settled_available;
      FORWARD_LOOKING -> forward_available.
    input_set: "fund totals (all statuses folded in per field definitions); PLEDGED donations only for the forward variant"
    constants:
      PLEDGE_CREDIT_FACTOR: 0.8
    precision: "integer cents; pledge credit rounded once after aggregation"
    variants:
      - name: settled_basis
        when: "agreement.spending_basis == SETTLED (default, and only legal value under PRE_APPROVED_GRANT)"
        difference: "counts only funds actually received"
      - name: forward_looking_basis
        when: "agreement.spending_basis == FORWARD_LOOKING (COMPREHENSIVE only)"
        difference: "adds 80% credit for PLEDGED donations; identical data yields a larger spendable balance than settled"

  - name: exit_settlement_waterfall
    trigger: "POST /fsa/exit-plans/{id}/execute"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (the fee base looks circular — fee is a percent of the
      transfer base while the base excludes the fee — so the order is normative):
        G        = fund.available_cents + fund.committed_cents        # total net assets
        bucket1  = committed_payout_cents = committed_cents of requests in
                   PENDING_SPONSOR | APPROVED_FOR_PAYMENT (SUBMITTED are auto-rejected first)
        bucket2  = reserve_cents = RESERVE_PER_OPEN_FINDING_CENTS
                   * sum(open_findings_count of reviews in FINDINGS_ISSUED | ESCALATED)
        base     = G - bucket1 - bucket2          # if base < 0 -> ERR_EXIT_INSOLVENT
        bucket3  = exit_fee_cents = max(MIN_EXIT_FEE_CENTS, round_half_up(base * EXIT_FEE_RATE))
        bucket4  = transfer_cents = base - exit_fee_cents   # if < 0 -> ERR_EXIT_INSOLVENT
      Invariant: bucket1 + bucket2 + bucket3 + bucket4 == G exactly (no drift).
    input_set: "the exiting project's fund; non-terminal disbursements; open findings"
    constants:
      RESERVE_PER_OPEN_FINDING_CENTS: 250000
      EXIT_FEE_RATE: 0.02
      MIN_EXIT_FEE_CENTS: 50000
    precision: "integer cents; exit fee rounded once, round_half_up"

  - name: contractor_ytd_accumulation
    trigger: "DisbursementRequest -> PAID with payee_type == STAFF and engagement_type == CONTRACTOR"
    algorithm: threshold
    formula: |
      year = calendar year of the logical clock at pay time
      if engagement.ytd_year != year: contractor_ytd_cents = 0; ytd_year = year   # reset first
      contractor_ytd_cents += disbursement.amount_cents
      requires_1099 = (contractor_ytd_cents >= CONTRACTOR_REPORT_THRESHOLD_CENTS)  # >= inclusive
      EMPLOYEE engagements never accumulate (W-2 path).
    input_set: "the PAID disbursement; its staff engagement"
    constants:
      CONTRACTOR_REPORT_THRESHOLD_CENTS: 60000
    precision: "integer cents; boundary at exactly 60000 sets requires_1099 true"

  - name: fee_period_reconciliation
    trigger: "POST /fsa/fund-accounts/{id}/close-period"
    algorithm: chronological
    formula: |
      period donations = donations with received_at date in [period_start, period_end] inclusive,
                         processed in received_at order (created_at ASC tie-break; ids never used)
      provisional_fees_cents = sum(fee_cents of period donations)
      if model == COMPREHENSIVE:
        per donation with refunded_cents > 0:
          final_i = round_half_up(fee_cents * (amount_cents - refunded_cents) / amount_cents)
          reversal_i = fee_cents - final_i
        refund_reversals_cents = sum(reversal_i)   # per-donation rounding THEN sum (pinned)
        annual_platform_fee_cents = 0
      if model == PRE_APPROVED_GRANT:
        refund_reversals_cents = 0                  # grant fees are not reversed
        annual_platform_fee_cents = ANNUAL_PLATFORM_FEE_CENTS if this is the first FINAL
          assessment whose period_end falls in calendar year Y and the fund had any
          donation received in year Y, else 0
      final_fees_cents = provisional - refund_reversals + annual_platform_fee
      delta_cents = final - provisional
      post FEE_REVERSAL_CREDIT +(-delta) when delta < 0; FEE_DEBIT -delta when delta > 0
      fund.total_fees_reversed_cents += refund_reversals_cents
      fund.total_fees_charged_cents += annual_platform_fee_cents
    input_set: "donations of the fund received inside the closed period; prior FINAL assessments (for the annual-fee first-close rule)"
    constants:
      ANNUAL_PLATFORM_FEE_CENTS: 25000
    precision: "integer cents; per-donation reversal rounded round_half_up before summing"
    variants:
      - name: provisional_view
        when: "between receives and period close; fee_cents on each donation is assessed on gross"
        difference: "gross-of-refund fees; same receipts data yields a higher fee total than the final view whenever any period donation was refunded"
      - name: final_view
        when: "at close-period"
        difference: "net-of-refund proportional fees (COMPREHENSIVE) or gross plus annual fee (PRE_APPROVED_GRANT)"

  - name: risk_posture_score
    trigger: "RiskIncident create/transition; ComplianceReview issue-findings/remediate/close/escalate"
    algorithm: weighted_scoring
    formula: |
      open incidents = incidents of the project with status in {REPORTED, TRIAGED, MITIGATING}
      score = sum(severity_weight) + FINDING_WEIGHT * sum(open_findings_count of reviews
              with status in {FINDINGS_ISSUED, ESCALATED})
      severity_weight: CRITICAL 40, HIGH 20, MEDIUM 8, LOW 3
      oversight_posture: score >= SEVERE_BAND (50) -> SEVERE;
                         score >= RESTRICTED_BAND (25) -> RESTRICTED; else NORMAL
      bands are inclusive at the lower edge (exactly 25 -> RESTRICTED, exactly 50 -> SEVERE)
      gates: RESTRICTED blocks staff activate and exit begin-due-diligence;
             SEVERE additionally blocks donation receive and disbursement submit
    input_set: "project's incidents and reviews filtered by the status sets above (RESOLVED, DISMISSED, CLOSED, REMEDIATED, OPEN-with-no-findings excluded)"
    constants:
      SEV_CRITICAL: 40
      SEV_HIGH: 20
      SEV_MEDIUM: 8
      SEV_LOW: 3
      FINDING_WEIGHT: 5
      RESTRICTED_BAND: 25
      SEVERE_BAND: 50
    precision: "integer score; inclusive band boundaries"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body schema: required fields present (including conditional-required sponsorship_model when compliance-decision decision=APPROVE), JSON types correct, integer cents fields integral", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Enum fields carry a declared member (status/action/party/model/payee_type/etc.)", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role name", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 4, category: auth, check: "X-User-Role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 5, category: auth, check: "Ownership: Applicant X-User-ID == application.applicant_user_id for submit/withdraw/countersign; ProjectLead X-User-ID == path project_id for project-scoped writes", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "submit, withdraw, countersign, project-scoped ProjectLead writes" }
  - { priority: 6, category: existence, check: "Path ids resolve left-to-right to existing resources", error_id: ERR_APPLICATION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_FUND_ACCOUNT_NOT_FOUND | ERR_DONATION_NOT_FOUND | ERR_RECEIPT_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_EXIT_PLAN_NOT_FOUND | ERR_TRANCHE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND, http_status: 404, applies_to: "all id-bearing paths" }
  - { priority: 7, category: state, check: "Target resource is in a from-state of the requested transition (per-machine state errors)", error_id: ERR_APPLICATION_NOT_ACTIONABLE | ERR_AGREEMENT_NOT_ACTIVE | ERR_PROJECT_NOT_ACTIVE | ERR_FUND_NOT_ACTIVE | ERR_DONATION_STATE_INVALID | ERR_RECEIPT_ALREADY_VOIDED | ERR_DISBURSEMENT_STATE_INVALID | ERR_ENGAGEMENT_STATE_INVALID | ERR_REVIEW_STATE_INVALID | ERR_INCIDENT_STATE_INVALID | ERR_EXIT_STATE_INVALID | ERR_TRANCHE_STATE_INVALID, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Employment classification: EMPLOYEE engagement (proposed or approved_type) under PRE_APPROVED_GRANT model is forbidden", error_id: ERR_MODEL_FORBIDS_EMPLOYMENT, http_status: 422, applies_to: ["POST /fsa/projects/{id}/staff-engagements", "POST /fsa/staff-engagements/{id}/classification-review"] }
  - { priority: 9, category: business_safety, check: "Segregation of duties: disbursement reviewer/approver/payer user ids must differ from each prior actor's; exit signoff signer ids pairwise distinct", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: ["POST /fsa/disbursement-requests/{id}/compliance-review", "POST /fsa/disbursement-requests/{id}/sponsor-approve", "POST /fsa/disbursement-requests/{id}/pay"] }
  - { priority: 10, category: business_safety, check: "Open CRITICAL incident blocks disbursement pay and exit due-diligence", error_id: ERR_CRITICAL_INCIDENT_OPEN, http_status: 422, applies_to: ["POST /fsa/disbursement-requests/{id}/pay", "POST /fsa/exit-plans/{id}/begin-due-diligence"] }
  - { priority: 11, category: business_safety, check: "Compliance review in OPEN | ESCALATED blocks exit due-diligence (FINDINGS_ISSUED does not block; open findings are reserved for at execute)", error_id: ERR_OPEN_COMPLIANCE_BLOCKS_EXIT, http_status: 422, applies_to: ["POST /fsa/exit-plans/{id}/begin-due-diligence"] }
  - { priority: 12, category: business_safety, check: "Oversight posture gates: RESTRICTED blocks staff activate and exit due-diligence; SEVERE additionally blocks donation receive and disbursement submit", error_id: ERR_SEVERE_POSTURE_BLOCKS_SPEND, http_status: 422, applies_to: ["POST /fsa/donations/{id}/receive", "POST /fsa/disbursement-requests/{id}/submit", "POST /fsa/staff-engagements/{id}/activate", "POST /fsa/exit-plans/{id}/begin-due-diligence"] }
  - { priority: 13, category: business_constraint, check: "Mission score threshold: action=ADVANCE requires mission_score >= 70.00", error_id: ERR_MISSION_SCORE_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /fsa/applications/{id}/mission-score"] }
  - { priority: 14, category: business_constraint, check: "One non-terminal engagement per worker per project: same worker_email with status PROPOSED | VETTED | CLASSIFICATION_REVIEW already exists", error_id: ERR_DUPLICATE_ENGAGEMENT, http_status: 409, applies_to: ["POST /fsa/projects/{id}/staff-engagements"] }
  - { priority: 15, category: business_constraint, check: "Half-open interval overlap: new ACTIVE engagement [start_date, end_date) overlaps an existing ACTIVE engagement for the same worker_email on the same project; null end_date is open-ended; touching endpoints (end == start) do NOT overlap", error_id: ERR_ENGAGEMENT_OVERLAP, http_status: 409, applies_to: ["POST /fsa/staff-engagements/{id}/activate"] }
  - { priority: 16, category: business_constraint, check: "Closed-interval overlap: grant tranche periods on one agreement are day-inclusive; any shared calendar day between two ISSUED tranches is a conflict; period_end + 1 day adjacency is legal", error_id: ERR_TRANCHE_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /fsa/agreements/{id}/grant-tranches"] }
  - { priority: 17, category: business_constraint, check: "One non-terminal exit plan (PROPOSED | DUE_DILIGENCE | APPROVED) per project", error_id: ERR_ACTIVE_EXIT_PLAN_EXISTS, http_status: 409, applies_to: ["POST /fsa/projects/{id}/exit-plans"] }
  - { priority: 18, category: business_constraint, check: "Exit signoff party not already collected", error_id: ERR_SIGNOFF_PARTY_REPEATED, http_status: 409, applies_to: ["POST /fsa/exit-plans/{id}/signoff"] }
  - { priority: 19, category: business_constraint, check: "Exit signoff signer user id not already used for any party", error_id: ERR_SIGNER_REUSED, http_status: 409, applies_to: ["POST /fsa/exit-plans/{id}/signoff"] }
  - { priority: 20, category: business_constraint, check: "Model-gated features: grant tranches only under PRE_APPROVED_GRANT; spending_basis FORWARD_LOOKING only under COMPREHENSIVE", error_id: ERR_MODEL_MISMATCH, http_status: 422, applies_to: ["POST /fsa/agreements/{id}/grant-tranches", "POST /fsa/agreements/{id}/amend"] }
  - { priority: 21, category: business_temporal, check: "Interval sanity: tranche period_end >= period_start; engagement end_date > start_date when provided; close-period period_end >= period_start", error_id: ERR_TRANCHE_PERIOD_INVALID | ERR_ENGAGEMENT_DATES_INVALID | ERR_CLOSE_PERIOD_INVALID, http_status: 422, applies_to: ["POST /fsa/agreements/{id}/grant-tranches", "POST /fsa/projects/{id}/staff-engagements", "POST /fsa/fund-accounts/{id}/close-period"] }
  - { priority: 22, category: business_referential, check: "STAFF payee: staff_engagement_id present, belongs to the project, status == ACTIVE", error_id: ERR_STAFF_ENGAGEMENT_REQUIRED, http_status: 422, applies_to: ["POST /fsa/disbursement-requests/{id}/submit"] }
  - { priority: 23, category: business_referential, check: "PRE_APPROVED_GRANT: a tranche whose closed period covers spend_date exists (uniqueness guaranteed by rule 16)", error_id: ERR_NO_COVERING_TRANCHE, http_status: 422, applies_to: ["POST /fsa/disbursement-requests/{id}/submit"] }
  - { priority: 24, category: business_fiscal, check: "Donation amount_cents >= 100 (MIN_DONATION_CENTS); disbursement amount_cents >= 1", error_id: ERR_AMOUNT_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /fsa/projects/{id}/donations", "POST /fsa/projects/{id}/disbursement-requests"] }
  - { priority: 25, category: business_fiscal, check: "Disbursement amount <= balance per agreement.spending_basis variant (settled_available or forward_available)", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 422, applies_to: ["POST /fsa/disbursement-requests/{id}/submit"] }
  - { priority: 26, category: business_fiscal, check: "Tranche remaining (amount - spent - committed) >= disbursement amount", error_id: ERR_TRANCHE_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /fsa/disbursement-requests/{id}/submit"] }
  - { priority: 27, category: business_fiscal, check: "Refund amount >= 1 and <= amount_cents - refunded_cents", error_id: ERR_REFUND_EXCEEDS_REMAINING, http_status: 422, applies_to: ["POST /fsa/donations/{id}/request-refund"] }
  - { priority: 28, category: business_fiscal, check: "Exit settlement: base >= 0 and transfer >= 0", error_id: ERR_EXIT_INSOLVENT, http_status: 422, applies_to: ["POST /fsa/exit-plans/{id}/execute"] }
  - { priority: 29, category: business_fiscal, check: "Project terminate requires available == 0 AND committed == 0 AND reserved == 0", error_id: ERR_FUNDS_REMAIN, http_status: 422, applies_to: ["POST /fsa/projects/{id}/terminate"] }
  - { priority: 30, category: business_constraint, check: "remediate remediated_count >= 1 and <= open_findings_count", error_id: ERR_REMEDIATION_EXCEEDS_OPEN, http_status: 422, applies_to: ["POST /fsa/compliance-reviews/{id}/remediate"] }

# =============================================================================
# §1.5 API Endpoint Table
# GET endpoints share the internal read roles; Donor is write-only on its two
# endpoints. All list endpoints accept limit?/offset? and return paginated arrays.
# =============================================================================
endpoints:
  # --- ProjectApplication ---
  - { method: POST, path: "/fsa/applications", description: "Create a project application in DRAFT", roles: [Applicant], code: 201, input: [project_name, mission_statement, "requested_model?", budget_estimate_cents, contact_email], output: ProjectApplication, side_effects: ["status=DRAFT, submit_count=0, applicant_user_id := X-User-ID"] }
  - { method: GET, path: "/fsa/applications", description: "List applications", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "applicant_user_id?", "limit?", "offset?"], output: "ProjectApplication[]", side_effects: [] }
  - { method: GET, path: "/fsa/applications/{id}", description: "Get one application", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: ProjectApplication, side_effects: [] }
  - { method: POST, path: "/fsa/applications/{id}/submit", description: "Submit or resubmit (DRAFT|RETURNED -> SUBMITTED)", roles: [Applicant], code: 200, input: [], output: ProjectApplication, side_effects: ["submit_count += 1"] }
  - { method: POST, path: "/fsa/applications/{id}/mission-score", description: "Record mission alignment scorecard; ADVANCE or RETURN", roles: [ProgramOfficer], code: 200, input: [purpose_pts, benefit_pts, capacity_pts, risk_pts, action, "review_note?"], output: ProjectApplication, side_effects: ["mission_score computed; SUBMITTED -> COMPLIANCE_REVIEW or RETURNED"] }
  - { method: POST, path: "/fsa/applications/{id}/compliance-decision", description: "Compliance decision; APPROVE mints Project + Agreement + FundAccount", roles: [ComplianceOfficer], code: 200, input: [decision, "sponsorship_model?", "rationale?"], output: ProjectApplication, side_effects: ["on APPROVE: Project(PROPOSED) + SponsorshipAgreement(PENDING_COUNTERSIGN) + FundAccount(PENDING) created; ids back-linked on the application"] }
  - { method: POST, path: "/fsa/applications/{id}/withdraw", description: "Withdraw a non-terminal application", roles: [Applicant], code: 200, input: [], output: ProjectApplication, side_effects: ["status -> WITHDRAWN"] }
  - { method: GET, path: "/fsa/applications/{id}/projects", description: "Reverse reachability: projects minted from an application (0 or 1)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: "Project[]", side_effects: [] }

  # --- Project ---
  - { method: GET, path: "/fsa/projects", description: "List projects", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}", description: "Get one project", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: Project, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/summary", description: "Computed read: fund balances, posture, risk score, counts", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: { available_cents: integer, forward_available_cents: integer, committed_cents: integer, reserved_cents: integer, risk_score: integer, oversight_posture: string, open_findings_count: integer, open_incident_count: integer }, side_effects: [] }
  - { method: POST, path: "/fsa/projects/{id}/suspend", description: "Suspend an ACTIVE project (cascade: fund FROZEN, in-flight disbursements auto-rejected with release)", roles: [ComplianceOfficer, SponsorAdmin], code: 200, input: [reason], output: Project, side_effects: ["Project ACTIVE -> SUSPENDED; FundAccount -> FROZEN; SUBMITTED/PENDING_SPONSOR/APPROVED_FOR_PAYMENT disbursements -> REJECTED (auto_reject_reason=SUSPENSION) with commitment release"] }
  - { method: POST, path: "/fsa/projects/{id}/reinstate", description: "Reinstate a SUSPENDED project", roles: [SponsorAdmin], code: 200, input: [], output: Project, side_effects: ["Project SUSPENDED -> ACTIVE; FundAccount FROZEN -> ACTIVE"] }
  - { method: POST, path: "/fsa/projects/{id}/terminate", description: "Terminate a zero-balance project", roles: [SponsorAdmin], code: 200, input: [reason], output: Project, side_effects: ["Project -> TERMINATED; Agreement -> TERMINATED; FundAccount -> CLOSED"] }

  # --- SponsorshipAgreement ---
  - { method: GET, path: "/fsa/agreements", description: "List agreements", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["project_id?", "status?", "limit?", "offset?"], output: "SponsorshipAgreement[]", side_effects: [] }
  - { method: GET, path: "/fsa/agreements/{id}", description: "Get one agreement", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: SponsorshipAgreement, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/agreements", description: "Reverse reachability: agreement of a project (0 or 1)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: "SponsorshipAgreement[]", side_effects: [] }
  - { method: POST, path: "/fsa/agreements/{id}/countersign", description: "Applicant countersigns; activates agreement, project, fund", roles: [Applicant], code: 200, input: [], output: SponsorshipAgreement, side_effects: ["Agreement -> ACTIVE; Project PROPOSED -> ACTIVE; FundAccount PENDING -> ACTIVE"] }
  - { method: POST, path: "/fsa/agreements/{id}/amend", description: "Amend agreement terms (OCC on agreement version)", roles: [SponsorAdmin], code: 200, input: [expected_agreement_version, "spending_basis?", "effective_date?", "note?"], output: SponsorshipAgreement, side_effects: ["increments SponsorshipAgreement.version by 1; spending_basis update gated by model (ERR_MODEL_MISMATCH)"] }

  # --- GrantTranche ---
  - { method: POST, path: "/fsa/agreements/{id}/grant-tranches", description: "Issue a grant tranche (PRE_APPROVED_GRANT only; closed-interval overlap enforced)", roles: [SponsorAdmin], code: 201, input: [amount_cents, period_start, period_end, purpose], output: GrantTranche, side_effects: ["status=ISSUED, committed=0, spent=0"] }
  - { method: GET, path: "/fsa/agreements/{id}/grant-tranches", description: "List tranches of an agreement", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "GrantTranche[]", side_effects: [] }
  - { method: GET, path: "/fsa/grant-tranches/{id}", description: "Get one tranche", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: GrantTranche, side_effects: [] }
  - { method: POST, path: "/fsa/grant-tranches/{id}/close", description: "Close a tranche after its period ends; report required", roles: [SponsorAdmin], code: 200, input: [report_note], output: GrantTranche, side_effects: ["ISSUED -> CLOSED"] }

  # --- Donation ---
  - { method: POST, path: "/fsa/projects/{id}/donations", description: "Record a donation pledge (PLEDGED); project must be ACTIVE (ERR_PROJECT_NOT_ACTIVE)", roles: [Donor], code: 201, input: [amount_cents, donor_name, donor_email, "donor_tax_id?", "anonymous?", payment_method], output: Donation, side_effects: ["status=PLEDGED; fund_account_id resolved from project"] }
  - { method: GET, path: "/fsa/donations", description: "List/filter donations (multi-FK reverse reachability)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["project_id?", "fund_account_id?", "status?", "donor_email?", "limit?", "offset?"], output: "Donation[]", side_effects: [] }
  - { method: GET, path: "/fsa/donations/{id}", description: "Get one donation", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: Donation, side_effects: [] }
  - { method: POST, path: "/fsa/donations/{id}/receive", description: "Mark pledge received; assess admin fee; credit fund with ledger entries", roles: [FinanceOfficer], code: 200, input: [], output: Donation, side_effects: ["PLEDGED -> RECEIVED; fee per calculations.admin_fee_on_receipt; totals updated; DONATION_CREDIT + FEE_DEBIT ledger entries"] }
  - { method: POST, path: "/fsa/donations/{id}/issue-receipt", description: "Issue tax receipt under the sponsor's tax status", roles: [FinanceOfficer], code: 200, input: [], output: Donation, side_effects: ["RECEIVED -> RECEIPTED; TaxReceipt ISSUED created with sequential receipt_number"] }
  - { method: POST, path: "/fsa/donations/{id}/request-refund", description: "Request a full or partial refund", roles: [Donor, FinanceOfficer], code: 200, input: [amount_cents, reason], output: Donation, side_effects: ["-> REFUND_REQUESTED; pending_refund_amount_cents and status_before_refund set"] }
  - { method: POST, path: "/fsa/donations/{id}/decide-refund", description: "Approve or reject the open refund request", roles: [SponsorAdmin], code: 200, input: [decision, "note?"], output: Donation, side_effects: ["APPROVE: refund posted, receipt void/reissue cascade, status per partial/full; REJECT: restore prior status"] }

  # --- TaxReceipt ---
  - { method: GET, path: "/fsa/receipts/{id}", description: "Get one receipt", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: TaxReceipt, side_effects: [] }
  - { method: GET, path: "/fsa/donations/{id}/receipts", description: "List receipts of a donation (voided included)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "TaxReceipt[]", side_effects: [] }

  # --- DisbursementRequest ---
  - { method: POST, path: "/fsa/projects/{id}/disbursement-requests", description: "Draft a spending request", roles: [ProjectLead], code: 201, input: [amount_cents, purpose, payee_type, payee_name, spend_date, "staff_engagement_id?"], output: DisbursementRequest, side_effects: ["status=DRAFT; fund_account_id resolved; high_value computed"] }
  - { method: GET, path: "/fsa/disbursement-requests", description: "List/filter disbursements (multi-FK reverse reachability)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["project_id?", "fund_account_id?", "staff_engagement_id?", "grant_tranche_id?", "status?", "limit?", "offset?"], output: "DisbursementRequest[]", side_effects: [] }
  - { method: GET, path: "/fsa/disbursement-requests/{id}", description: "Get one disbursement", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: DisbursementRequest, side_effects: [] }
  - { method: POST, path: "/fsa/disbursement-requests/{id}/submit", description: "Submit for review; commits funds", roles: [ProjectLead], code: 200, input: [], output: DisbursementRequest, side_effects: ["DRAFT -> SUBMITTED; committed_cents += amount; COMMITMENT_HOLD entry; tranche commitment under grant model"] }
  - { method: POST, path: "/fsa/disbursement-requests/{id}/compliance-review", description: "Compliance APPROVE (routes high-value to sponsor) / RETURN / REJECT", roles: [ComplianceOfficer], code: 200, input: [decision, "note?"], output: DisbursementRequest, side_effects: ["APPROVE -> APPROVED_FOR_PAYMENT or PENDING_SPONSOR by high_value; RETURN -> DRAFT with release; REJECT -> REJECTED with release"] }
  - { method: POST, path: "/fsa/disbursement-requests/{id}/sponsor-approve", description: "Sponsor decision on high-value requests", roles: [SponsorAdmin], code: 200, input: [decision, "note?"], output: DisbursementRequest, side_effects: ["APPROVE -> APPROVED_FOR_PAYMENT; REJECT -> REJECTED with release"] }
  - { method: POST, path: "/fsa/disbursement-requests/{id}/pay", description: "Pay an approved request; SoD enforced; staff YTD accumulation; tranche spend", roles: [FinanceOfficer], code: 200, input: [], output: DisbursementRequest, side_effects: ["-> PAID; committed->disbursed; COMMITMENT_RELEASE + DISBURSEMENT_DEBIT; tranche committed/spent update; contractor YTD + requires_1099 recompute"] }
  - { method: POST, path: "/fsa/disbursement-requests/{id}/cancel", description: "Cancel a DRAFT or SUBMITTED request", roles: [ProjectLead], code: 200, input: [], output: DisbursementRequest, side_effects: ["-> CANCELLED; commitment released when SUBMITTED"] }

  # --- StaffEngagement ---
  - { method: POST, path: "/fsa/projects/{id}/staff-engagements", description: "Propose a staff engagement (employment vs contractor)", roles: [ProjectLead], code: 201, input: [worker_name, worker_email, engagement_type, compensation_type, rate_cents, start_date, "end_date?"], output: StaffEngagement, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/fsa/staff-engagements/{id}", description: "Get one engagement", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: StaffEngagement, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/staff-engagements", description: "List engagements of a project", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "worker_email?", "limit?", "offset?"], output: "StaffEngagement[]", side_effects: [] }
  - { method: POST, path: "/fsa/staff-engagements/{id}/classification-review", description: "Vet classification; may override engagement_type", roles: [ComplianceOfficer], code: 200, input: [approved_type, rationale], output: StaffEngagement, side_effects: ["PROPOSED|CLASSIFICATION_REVIEW -> VETTED; engagement_type := approved_type; classification_overridden recomputed"] }
  - { method: POST, path: "/fsa/staff-engagements/{id}/activate", description: "Activate a vetted engagement; half-open overlap enforced", roles: [ProjectLead], code: 200, input: [], output: StaffEngagement, side_effects: ["VETTED -> ACTIVE"] }
  - { method: POST, path: "/fsa/staff-engagements/{id}/flag-misclassification", description: "Re-open classification on an ACTIVE engagement", roles: [ComplianceOfficer], code: 200, input: [reason], output: StaffEngagement, side_effects: ["ACTIVE -> CLASSIFICATION_REVIEW"] }
  - { method: POST, path: "/fsa/staff-engagements/{id}/terminate", description: "Terminate a non-terminal engagement", roles: [ProjectLead, ComplianceOfficer], code: 200, input: ["end_date?", "reason?"], output: StaffEngagement, side_effects: ["-> TERMINATED"] }

  # --- ComplianceReview ---
  - { method: POST, path: "/fsa/projects/{id}/compliance-reviews", description: "Open a compliance review", roles: [ComplianceOfficer], code: 201, input: [review_type, "note?"], output: ComplianceReview, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/fsa/compliance-reviews/{id}", description: "Get one review", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: ComplianceReview, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/compliance-reviews", description: "List reviews of a project", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ComplianceReview[]", side_effects: [] }
  - { method: POST, path: "/fsa/compliance-reviews/{id}/issue-findings", description: "Issue findings; recomputes project risk posture", roles: [ComplianceOfficer], code: 200, input: [findings_count, severity_max], output: ComplianceReview, side_effects: ["OPEN -> FINDINGS_ISSUED; open_findings_count := findings_count; risk recompute"] }
  - { method: POST, path: "/fsa/compliance-reviews/{id}/remediate", description: "Remediate findings; zero open findings -> REMEDIATED", roles: [ComplianceOfficer], code: 200, input: [remediated_count], output: ComplianceReview, side_effects: ["open_findings_count -= remediated_count; auto REMEDIATED at zero; risk recompute"] }
  - { method: POST, path: "/fsa/compliance-reviews/{id}/close", description: "Close an OPEN(no findings) or REMEDIATED review", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceReview, side_effects: ["-> CLOSED"] }
  - { method: POST, path: "/fsa/compliance-reviews/{id}/escalate", description: "Escalate: suspends the project with full cascade", roles: [ComplianceOfficer], code: 200, input: [reason], output: ComplianceReview, side_effects: ["FINDINGS_ISSUED -> ESCALATED; project SUSPENDED; fund FROZEN; in-flight disbursements auto-rejected with release"] }

  # --- RiskIncident ---
  - { method: POST, path: "/fsa/projects/{id}/risk-incidents", description: "Report a liability/risk incident", roles: [ComplianceOfficer, ProjectLead], code: 201, input: [category, severity, description], output: RiskIncident, side_effects: ["status=REPORTED; risk recompute"] }
  - { method: GET, path: "/fsa/risk-incidents/{id}", description: "Get one incident", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: RiskIncident, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/risk-incidents", description: "List incidents of a project", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "severity?", "limit?", "offset?"], output: "RiskIncident[]", side_effects: [] }
  - { method: POST, path: "/fsa/risk-incidents/{id}/transition", description: "TRIAGE | MITIGATE | RESOLVE | DISMISS an incident", roles: [ComplianceOfficer], code: 200, input: [action, "note?"], output: RiskIncident, side_effects: ["status transition per machine; risk recompute"] }

  # --- ExitPlan ---
  - { method: POST, path: "/fsa/projects/{id}/exit-plans", description: "Propose a spin-off exit plan", roles: [ProjectLead, SponsorAdmin], code: 201, input: [successor_entity_name, successor_ein, reason], output: ExitPlan, side_effects: ["status=PROPOSED; signoffs=[]"] }
  - { method: GET, path: "/fsa/exit-plans/{id}", description: "Get one exit plan", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: ExitPlan, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/exit-plans", description: "List exit plans of a project", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ExitPlan[]", side_effects: [] }
  - { method: POST, path: "/fsa/exit-plans/{id}/begin-due-diligence", description: "Enter due diligence (gated on open compliance/risk)", roles: [SponsorAdmin], code: 200, input: [], output: ExitPlan, side_effects: ["PROPOSED -> DUE_DILIGENCE"] }
  - { method: POST, path: "/fsa/exit-plans/{id}/signoff", description: "Record one party signoff; third distinct party approves", roles: [SponsorAdmin, ProjectLead], code: 200, input: [party], output: ExitPlan, side_effects: ["signoff appended; -> APPROVED when all three parties present"] }
  - { method: POST, path: "/fsa/exit-plans/{id}/execute", description: "Run the settlement waterfall; transfer assets; spin off", roles: [SponsorAdmin], code: 200, input: [], output: ExitPlan, side_effects: ["waterfall per calculations.exit_settlement_waterfall; disbursement settlements; ledger postings; Fund CLOSED; Agreement SUPERSEDED_BY_INDEPENDENCE; Project SPUN_OFF"] }
  - { method: POST, path: "/fsa/exit-plans/{id}/abandon", description: "Abandon a non-terminal exit plan", roles: [SponsorAdmin, ProjectLead], code: 200, input: [reason], output: ExitPlan, side_effects: ["-> ABANDONED"] }

  # --- FundAccount / ledger / assessments ---
  - { method: GET, path: "/fsa/fund-accounts/{id}", description: "Get one fund account", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: FundAccount, side_effects: [] }
  - { method: GET, path: "/fsa/projects/{id}/fund-accounts", description: "Reverse reachability: fund of a project (0 or 1)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: "FundAccount[]", side_effects: [] }
  - { method: POST, path: "/fsa/fund-accounts/{id}/adjustments", description: "Manual signed adjustment (OCC on fund version)", roles: [FinanceOfficer], code: 200, input: [expected_fund_account_version, amount_cents, memo], output: FundAccount, side_effects: ["ADJUSTMENT ledger entry; total_adjustments_cents += amount; increments FundAccount.version by 1"] }
  - { method: POST, path: "/fsa/fund-accounts/{id}/close-period", description: "Close a fee period; reconcile provisional vs final fees", roles: [FinanceOfficer], code: 200, input: [period_start, period_end], output: FeeAssessment, side_effects: ["FeeAssessment FINAL created; delta posted as FEE_REVERSAL_CREDIT or FEE_DEBIT; totals updated"] }
  - { method: GET, path: "/fsa/fund-accounts/{id}/ledger-entries", description: "List ledger entries of a fund (chronological)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "FundLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/fsa/fund-ledger-entries", description: "Filtered ledger list (multi-FK reverse reachability)", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["fund_account_id?", "donation_id?", "disbursement_id?", "entry_type?", "limit?", "offset?"], output: "FundLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/fsa/fund-ledger-entries/{id}", description: "Get one ledger entry", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: FundLedgerEntry, side_effects: [] }
  - { method: GET, path: "/fsa/fund-accounts/{id}/fee-assessments", description: "List fee assessments of a fund", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: ["limit?", "offset?"], output: "FeeAssessment[]", side_effects: [] }
  - { method: GET, path: "/fsa/fee-assessments/{id}", description: "Get one fee assessment", roles: [Applicant, ProjectLead, ProgramOfficer, ComplianceOfficer, FinanceOfficer, SponsorAdmin], code: 200, input: [], output: FeeAssessment, side_effects: [] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time. Drives received_at/tax_year/YTD-year/tranche-close eligibility deterministically.", roles: [SponsorAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced; no entity mutation"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, wrong JSON type, or non-integral cents field" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or unrecognized role name" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "X-User-ID does not match the resource's ownership anchor (applicant_user_id / project_id)" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id does not exist" }
  - { id: ERR_FUND_ACCOUNT_NOT_FOUND, http: 404, condition: "fund account id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "donation id does not exist" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "receipt id does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "disbursement id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "staff engagement id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "compliance review id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "risk incident id does not exist" }
  - { id: ERR_EXIT_PLAN_NOT_FOUND, http: 404, condition: "exit plan id does not exist" }
  - { id: ERR_TRANCHE_NOT_FOUND, http: 404, condition: "grant tranche id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "fee assessment id does not exist" }
  - { id: ERR_LEDGER_ENTRY_NOT_FOUND, http: 404, condition: "ledger entry id does not exist" }
  - { id: ERR_APPLICATION_NOT_ACTIONABLE, http: 409, condition: "Application not in a from-state of the requested transition" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement not ACTIVE where required (or not PENDING_COUNTERSIGN for countersign)" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Project not ACTIVE where required (includes SUSPENDED)" }
  - { id: ERR_FUND_NOT_ACTIVE, http: 409, condition: "FundAccount not ACTIVE where required (includes FROZEN/CLOSED)" }
  - { id: ERR_DONATION_STATE_INVALID, http: 409, condition: "Donation not in the required state for receive/issue-receipt/request-refund/decide-refund" }
  - { id: ERR_DISBURSEMENT_STATE_INVALID, http: 409, condition: "Disbursement not in the required state for submit/review/approve/pay/cancel" }
  - { id: ERR_ENGAGEMENT_STATE_INVALID, http: 409, condition: "Engagement not in the required state for classification/activate/flag/terminate" }
  - { id: ERR_REVIEW_STATE_INVALID, http: 409, condition: "Compliance review not in the required state" }
  - { id: ERR_INCIDENT_STATE_INVALID, http: 409, condition: "Risk incident not in a from-state of the requested action" }
  - { id: ERR_EXIT_STATE_INVALID, http: 409, condition: "Exit plan not in the required state" }
  - { id: ERR_TRANCHE_STATE_INVALID, http: 409, condition: "Tranche already CLOSED, or close attempted before period_end" }
  - { id: ERR_MODEL_FORBIDS_EMPLOYMENT, http: 422, condition: "EMPLOYEE engagement proposed or approved under PRE_APPROVED_GRANT model" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: actor user id equals a prior actor's on the same disbursement chain" }
  - { id: ERR_CRITICAL_INCIDENT_OPEN, http: 422, condition: "Open CRITICAL incident blocks disbursement pay or exit due-diligence" }
  - { id: ERR_OPEN_COMPLIANCE_BLOCKS_EXIT, http: 422, condition: "Compliance review in OPEN | FINDINGS_ISSUED | ESCALATED blocks exit due-diligence" }
  - { id: ERR_SEVERE_POSTURE_BLOCKS_SPEND, http: 422, condition: "oversight_posture gate: RESTRICTED blocks staff activate / exit due-diligence; SEVERE also blocks donation receive / disbursement submit" }
  - { id: ERR_MISSION_SCORE_BELOW_THRESHOLD, http: 422, condition: "action=ADVANCE with mission_score < 70.00" }
  - { id: ERR_DUPLICATE_ENGAGEMENT, http: 409, condition: "Same worker_email already has a non-terminal (PROPOSED|VETTED|CLASSIFICATION_REVIEW) engagement on the project" }
  - { id: ERR_ENGAGEMENT_OVERLAP, http: 409, condition: "Half-open engagement interval overlaps an existing ACTIVE engagement for the same worker on the project" }
  - { id: ERR_TRANCHE_PERIOD_OVERLAP, http: 409, condition: "Closed-interval tranche periods share at least one calendar day" }
  - { id: ERR_ACTIVE_EXIT_PLAN_EXISTS, http: 409, condition: "A non-terminal exit plan already exists for the project" }
  - { id: ERR_SIGNOFF_PARTY_REPEATED, http: 409, condition: "Signoff party already recorded on the exit plan" }
  - { id: ERR_SIGNER_REUSED, http: 409, condition: "Same signer user id already recorded under another party" }
  - { id: ERR_MODEL_MISMATCH, http: 422, condition: "Model-gated feature used on the wrong sponsorship model" }
  - { id: ERR_TRANCHE_PERIOD_INVALID, http: 422, condition: "Tranche period_end < period_start" }
  - { id: ERR_ENGAGEMENT_DATES_INVALID, http: 422, condition: "Engagement end_date <= start_date" }
  - { id: ERR_CLOSE_PERIOD_INVALID, http: 422, condition: "close-period period_end < period_start" }
  - { id: ERR_STAFF_ENGAGEMENT_REQUIRED, http: 422, condition: "payee_type STAFF without an ACTIVE engagement of this project (missing, wrong project, or not ACTIVE)" }
  - { id: ERR_NO_COVERING_TRANCHE, http: 422, condition: "PRE_APPROVED_GRANT submit: no ISSUED tranche period covers spend_date" }
  - { id: ERR_TRANCHE_BUDGET_EXCEEDED, http: 422, condition: "Tranche remaining (amount - spent - committed) below disbursement amount" }
  - { id: ERR_AMOUNT_BELOW_MINIMUM, http: 422, condition: "Donation amount_cents < 100, or disbursement amount_cents < 1" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Disbursement amount exceeds spendable balance under the agreement's basis variant" }
  - { id: ERR_REFUND_EXCEEDS_REMAINING, http: 422, condition: "Refund amount < 1 or > amount_cents - refunded_cents" }
  - { id: ERR_EXIT_INSOLVENT, http: 422, condition: "Exit waterfall base or transfer below zero" }
  - { id: ERR_FUNDS_REMAIN, http: 422, condition: "Terminate with non-zero available/committed/reserved" }
  - { id: ERR_REMEDIATION_EXCEEDS_OPEN, http: 422, condition: "remediated_count < 1 or > open_findings_count" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_fund_account_version mismatch on adjustment (OCC)" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version mismatch on amend (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "External organizer who files and shepherds the project application; countersigns the agreement"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/applications"
      - "POST /fsa/applications/{id}/submit"
      - "POST /fsa/applications/{id}/withdraw"
      - "POST /fsa/agreements/{id}/countersign"
    shared_operations: ["GET reads on applications/projects/agreements/funds/donations/disbursements/engagements/reviews/incidents/exit plans/receipts/ledger/assessments"]
  - name: ProjectLead
    description: "Leader of an approved project; X-User-ID equals the Project.id they act for"
    identity: "entity_backed:Project"
    exclusive_operations:
      - "POST /fsa/projects/{id}/disbursement-requests"
      - "POST /fsa/disbursement-requests/{id}/submit"
      - "POST /fsa/disbursement-requests/{id}/cancel"
      - "POST /fsa/projects/{id}/staff-engagements"
      - "POST /fsa/staff-engagements/{id}/activate"
    shared_operations:
      - "POST /fsa/projects/{id}/exit-plans (with SponsorAdmin)"
      - "POST /fsa/projects/{id}/risk-incidents (with ComplianceOfficer)"
      - "POST /fsa/exit-plans/{id}/signoff party=PROJECT_LEAD (with SponsorAdmin for other parties)"
      - "POST /fsa/exit-plans/{id}/abandon (with SponsorAdmin)"
      - "POST /fsa/staff-engagements/{id}/terminate (with ComplianceOfficer)"
      - "GET reads"
  - name: ProgramOfficer
    description: "Sponsor program staff performing mission alignment review"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/applications/{id}/mission-score"
    shared_operations: ["GET reads"]
  - name: ComplianceOfficer
    description: "Sponsor compliance staff: application compliance decisions, spending review, classification, reviews, incidents"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/applications/{id}/compliance-decision"
      - "POST /fsa/disbursement-requests/{id}/compliance-review"
      - "POST /fsa/staff-engagements/{id}/classification-review"
      - "POST /fsa/staff-engagements/{id}/flag-misclassification"
      - "POST /fsa/projects/{id}/compliance-reviews"
      - "POST /fsa/compliance-reviews/{id}/issue-findings"
      - "POST /fsa/compliance-reviews/{id}/remediate"
      - "POST /fsa/compliance-reviews/{id}/close"
      - "POST /fsa/compliance-reviews/{id}/escalate"
      - "POST /fsa/risk-incidents/{id}/transition"
    shared_operations:
      - "POST /fsa/projects/{id}/suspend (with SponsorAdmin)"
      - "POST /fsa/projects/{id}/risk-incidents (with ProjectLead)"
      - "POST /fsa/staff-engagements/{id}/terminate (with ProjectLead)"
      - "GET reads"
  - name: FinanceOfficer
    description: "Sponsor finance staff: donation receipting, refunds intake, payment, fund adjustments, period close"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/donations/{id}/receive"
      - "POST /fsa/donations/{id}/issue-receipt"
      - "POST /fsa/disbursement-requests/{id}/pay"
      - "POST /fsa/fund-accounts/{id}/adjustments"
      - "POST /fsa/fund-accounts/{id}/close-period"
    shared_operations:
      - "POST /fsa/donations/{id}/request-refund (with Donor)"
      - "GET reads"
  - name: SponsorAdmin
    description: "Sponsor executive administrator: amendments, tranches, refunds decisions, high-value approval, exits, lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/agreements/{id}/amend"
      - "POST /fsa/agreements/{id}/grant-tranches"
      - "POST /fsa/grant-tranches/{id}/close"
      - "POST /fsa/donations/{id}/decide-refund"
      - "POST /fsa/disbursement-requests/{id}/sponsor-approve"
      - "POST /fsa/projects/{id}/reinstate"
      - "POST /fsa/projects/{id}/terminate"
      - "POST /fsa/exit-plans/{id}/begin-due-diligence"
      - "POST /fsa/exit-plans/{id}/execute"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fsa/projects/{id}/suspend (with ComplianceOfficer)"
      - "POST /fsa/projects/{id}/exit-plans (with ProjectLead)"
      - "POST /fsa/exit-plans/{id}/signoff parties SPONSOR_BOARD, SUCCESSOR_REP (with ProjectLead)"
      - "POST /fsa/exit-plans/{id}/abandon (with ProjectLead)"
      - "GET reads"
  - name: Donor
    description: "External donor making gifts to sponsored projects"
    identity: opaque
    exclusive_operations:
      - "POST /fsa/projects/{id}/donations"
    shared_operations:
      - "POST /fsa/donations/{id}/request-refund (with FinanceOfficer)"
