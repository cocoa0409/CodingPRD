  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: resource_halfopen_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_RESOURCE_WINDOW_CONFLICT]
          - entities.ResourceAssignment.fields.window_start
          - entities.ResourceAssignment.fields.window_end
        distinguishing_aspect: |
          Resource interval semantics = half-open [start,end), NO buffer:
          assignment B [11:00,13:00) is ACCEPTED adjacent to A ending at 11:00,
          but C [10:00,12:00) overlapping A [09:00,11:00) is REJECTED — proving
          endpoint-touching is allowed, interior overlap is not.
        test_recipe:
          setup:
            - "Resource with assignment A [09:00,11:00) and adjacent assignment B [11:00,13:00) both RESERVED."
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Overlap Res", incident_type: "AIR_SEARCH", ics_incident_number: "OR-2026-0015" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "AIR_RECON", segment_area_sqkm: 20.0, planned_searcher_hours: 4, planned_start: "2026-05-02T06:00:00Z", planned_end: "2026-05-02T20:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/resources"
              payload: { name: "Drone D1", resource_type: "DRONE" }
              as: Coordinator
              captures: { res_id: $.data.id, r_v0: $.data.version }
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z", expected_resource_version: "${r_v0}" }
              as: Coordinator
            - call: "GET /sar/resources/${res_id}"
              payload: {}
              as: Coordinator
              captures: { r_v1: $.data.version }
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T11:00:00Z", window_end: "2026-05-02T13:00:00Z", expected_resource_version: "${r_v1}" }
              as: Coordinator
              captures: { b_status: $.data.status }
            - call: "GET /sar/resources/${res_id}"
              payload: {}
              as: Coordinator
              captures: { r_v2: $.data.version }
          trigger:
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z", expected_resource_version: "${r_v2}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
