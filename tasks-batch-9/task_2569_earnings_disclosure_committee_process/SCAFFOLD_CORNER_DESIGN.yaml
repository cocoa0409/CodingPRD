      # `reconciliation` (the dual-variant delta-on-switch row) is intentionally omitted: neither
      # dual-variant calculation in this scaffold ever switches variant on a persisted row.
      # cycle_milestone_slack surfaces both variants side by side as separate fields, and
      # correction_materiality_classification fixes `method` once at ASSESS — RESCIND clears it and
      # RESCINDED is terminal, so no re-assessment with the other method is reachable and there is no
      # ledger delta to reconcile.
      - name: variant_divergence_on_identical_correction_inputs
        claim_type: variant_divergence
        grounds: [calculations.correction_materiality_classification]
        excluded_because:
          difficulty_instance: correction_materiality_rollover_versus_iron_curtain_variant_divergence
          rationale: |
            Both dual-variant calculations already have dedicated §1.8 divergence instances:
            correction_materiality_rollover_versus_iron_curtain_variant_divergence drives 4.00/REVISION
            against 5.83/RESTATEMENT from byte-identical stored data, and
            milestone_slack_calendar_versus_business_day_variant_divergence separates the CALENDAR_DAY
            and BUSINESS_DAY readings of the same milestone window and asserts the delta.
      - name: aggregation_over_the_declared_status_filtered_input_set
        claim_type: aggregation
        grounds: [calculations.certification_coverage_pct]
        excluded_because:
          difficulty_instance: certification_coverage_weighted_sum_before_division_not_average_of_percentages
          rationale: |
            The aggregation row's three claims — correct after add, correct after reversal, ordering
            irrelevant — are covered at greater depth by that §1.8 instance (pinned sum-then-divide order
            with the forbidden average-of-percentages result stated as a counter-value) together with
            subcertification_withdrawal_restores_both_conserved_cycle_aggregates_with_zero_drift, which
            is the reversal half.
      - name: weighted_scoring_with_multiplier_nesting_and_a_cap_applied_last
        claim_type: weighted_scoring
        grounds: [calculations.subcert_scope_weight]
        excluded_because:
          difficulty_instance: subcert_scope_weight_officer_escalation_nesting_with_cap_applied_last
          rationale: |
            That §1.8 instance is exactly the weighted_scoring row: it pins the nesting of the officer
            multiplier and the exception escalation, proves the cap is applied AFTER the single rounding
            step (a capped row reading exactly 45.00), and re-scores the row on SUBMIT so the
            weight-change claim is covered too.
      - name: interval_merge_geometry_on_the_milestone_calendar
        claim_type: interval_merge
        grounds: [calculations.milestone_window_conflict]
        excluded_because:
          difficulty_instance: milestone_calendar_half_open_windows_admit_touching_ends_and_reject_a_one_second_intrusion
          rationale: |
            Both interval calculations already have dedicated §1.8 resource_temporal_overlap instances
            with opposite geometry: that instance covers milestone_window_conflict's half-open windows
            (touching ends admitted, a one-second intrusion rejected), and
            subcertification_prep_windows_are_closed_intervals_with_an_aggregate_capacity_of_two covers
            member_concurrent_subcert_load's closed intervals with capacity 2.
      - name: constraint_propagation_from_the_document_tier_to_every_sibling_line
        claim_type: constraint_propagation
        grounds: [calculations.tie_out_variance_and_tolerance_escalation]
        excluded_because:
          difficulty_instance: tie_out_tier_multiplier_recomputed_from_snapshot_total_across_whole_item_set
          rationale: |
            tie_out_variance_and_tolerance_escalation is the only constraint_propagation calculation, and
            that §1.8 instance walks its normative STEP 1-5 order, shows the change propagating through
            the whole non-WAIVED item set to a fixed point, and asserts that STEP 4 statuses do not feed
            back into the STEP 2 snapshot total.

  # ===================================================================
  # SECTION 4 — VALIDATIONS (§1.4)
  # Guide table: Violation -> Error / Satisfaction -> Pass / Priority Ordering,
  # plus the six validation PATTERNS (priority conflict, cross-entity, temporal,
  # aggregate, conditional, cascading).
  #
  # `violation_to_error` is NOT written as an instance here: the guide's Table 6
  # requirement ("verify every error code is triggerable") is discharged wholesale by
  # the `errors` section below, which walks all 57 catalog codes and names, for each
  # one, the instance that raises it. Writing 45 one-per-rule violation instances here
  # would restate that section row for row.
  # ===================================================================
  - section: validations
    instances:

      - name: fully_satisfied_cycle_reports_an_empty_blocking_set_and_declares_filing_ready
        claim_type: satisfaction_to_pass
        grounds:
          - endpoints[GET /disclosure/reporting-cycles/{id}/readiness]
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=28]
          - validations[priority=30]
          - validations[priority=33]
          - validations[priority=44]
          - validations[priority=45]
          - state_machines.ReportingCycle.CERTIFICATION_OPEN_to_FILING_READY
        distinguishing_aspect: |
          The satisfaction half of the seven DECLARE_FILING_READY gates, probed through a single
          readiness read whose `blocking_error_ids` must be exactly the empty list and whose
          `filing_ready_eligible` must be true, immediately before the transition is taken and succeeds.
          Every numeric gate is pinned at its narrowest satisfying value rather than at a comfortable
          margin: min_slack_days_business is exactly 1 (the REQUIRED_FILING_SLACK_BUSINESS_DAYS floor),
          certification_coverage_pct is exactly 100.00, the ACTIVE voting count is exactly the charter's
          min_quorum_count of 2, unresolved_deficiency_weight is exactly 0.00 and
          open_material_event_count is exactly 0. An implementation that flips any comparison from
          inclusive to exclusive fails here while still passing a generous happy path.
        test_recipe:
          setup:
            - "The canonical charter, four seats, cycle FY2026-Q2 and the CLOSE / REVIEW / FILING milestones, carried as far as CERTIFICATION_OPEN with both officer certifications SIGNED but DECLARE_FILING_READY not yet attempted."
            - "The logical clock stays at 2026-08-01T00:00:00Z throughout, so no milestone can breach."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
