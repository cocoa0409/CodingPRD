          setup: ["case in EXTERNAL_REVIEW; inv1 window [2026-08-03, 2026-08-05] (letter window closes fast); inv2 window [2026-08-10, 2026-09-10]; both created at 2026-08-01 (response_deadline 2026-08-15)"]
