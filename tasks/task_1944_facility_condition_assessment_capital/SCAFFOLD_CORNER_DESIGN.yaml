            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 1, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v_pre: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "S1", annual_budget_cents: 10000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "S2", annual_budget_cents: 10000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { s2: "$.data.id" }
          trigger:
            - call: "POST /fca/funding-scenarios/${s1}/run"
              payload: { expected_capital_plan_version: "${plan_v_pre}" }
