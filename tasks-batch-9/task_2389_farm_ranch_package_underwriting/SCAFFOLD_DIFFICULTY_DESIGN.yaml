# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_2389_farm_ranch_package_underwriting
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric literal
# in `assert:` was computed by executing the pinned §1.3 formulas.
# Bootstrap calls are shared through YAML anchors defined on first use.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: scheduled_item_rc_vs_acv_valuation_divergence
        grounds:
          - calculations.scheduled_item_insured_value
          - entities.ScheduledItem.fields.valuation_basis
          - entities.ScheduledItem.fields.insured_value_cents
          - calculations.property_premium
          - state_machines.FarmPolicy.DRAFT_to_RATED
        distinguishing_aspect: |
          Two ScheduledItem rows on the SAME policy carrying byte-identical
          item_class, stated_value_cents, age_years and condition_grade diverge
          purely on valuation_basis: the RC row is insured at 30001000 while the
          ACV row is insured at 11040368, a delta of 18960632 cents that flows
          into two different property premium lines (243008 vs 89427).
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T00:00:00Z"
            - "one Agent with a 5000000-cent authority limit, one FarmAccount in catastrophe zone ZN-1 with 1200 acres"
            - "three OPEN CatCapacityPool rows for ZN-1 (HAIL 0.50, WIND 0.30, WILDFIRE 0.20), each with 200000000 cents of capacity and nothing reserved"
            - "one DRAFT FarmPolicy with deductible_cents 500000 (deductible credit 0.90) and no exposures yet"
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - &c_agent
              call: "POST /agents"
              payload: { agency_name: "Prairie Risk Partners", license_state: "KS", appointment_status: "ACTIVE", authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - &c_pool_hail
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_hail: $.data.id }
            - &c_pool_wind
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_wind: $.data.id }
            - &c_pool_fire
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_fire: $.data.id }
            - &c_acct
              call: "POST /farm-accounts"
              payload: { legal_name: "Kestrel Creek Farms", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_id: $.data.id }
            - &c_policy
              call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine harvester (RC election)", valuation_basis: "RC", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_rc: $.data.id, iv_rc: $.data.insured_value_cents }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine harvester (ACV election)", valuation_basis: "ACV", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_acv: $.data.id, iv_acv: $.data.insured_value_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
          assert:
            - "ScheduledItem.${it_rc}.insured_value_cents == 30001000"
            - "ScheduledItem.${it_acv}.insured_value_cents == 11040368"
            - "ScheduledItem.${it_rc}.insured_value_cents - ScheduledItem.${it_acv}.insured_value_cents == 18960632"
            - "ScheduledItem.${it_rc}.valuation_basis == RC and ScheduledItem.${it_acv}.valuation_basis == ACV; every other input field of the two rows is equal"
            - "FarmPolicy.${pol_id}.property_premium_cents == 332435 (243008 for the RC line + 89427 for the ACV line)"
            - "FarmPolicy.${pol_id}.exposed_tiv_cents == 41041368"
            - "FarmPolicy.${pol_id}.cat_load_cents == 128459"
            - "FarmPolicy.${pol_id}.total_premium_cents == 460894"
            - "FarmPolicy.${pol_id}.uw_status == RATED"

      - name: livestock_per_head_vs_blanket_limit_divergence
        grounds:
          - calculations.livestock_covered_limit
          - calculations.livestock_premium
          - entities.LivestockGroup.fields.limit_basis
          - entities.LivestockGroup.fields.covered_limit_cents
          - calculations.exposed_tiv
        distinguishing_aspect: |
          The SAME herd (170 head at 150000 cents per head, blanket limit set to
          the identical 25500000 aggregate) is insured for 25500000 under the
          PER_HEAD election but only 20400000 under the BLANKET election because
          BLANKET applies the 0.80 coinsurance factor, so the livestock premium
          diverges 286875 vs 229500 and the divergence propagates into
          exposed_tiv_cents and the catastrophe load.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap of scheduled_item_rc_vs_acv_valuation_divergence"
            - "two DRAFT policies on the SAME account with non-overlapping terms (2026-09-01..2027-08-31 and 2027-09-01..2028-08-31), each deductible 500000"
            - "each policy carries one identical RC DWELLING item insured at 40000000"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_ph: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2027-09-01", term_end_date: "2028-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_bl: $.data.id }
            - call: "POST /farm-policies/${pol_ph}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies/${pol_bl}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /farm-policies/${pol_ph}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "PER_HEAD", peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { grp_ph: $.data.id, cov_ph: $.data.covered_limit_cents }
            - call: "POST /farm-policies/${pol_bl}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "BLANKET", blanket_limit_cents: 25500000, peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { grp_bl: $.data.id, cov_bl: $.data.covered_limit_cents }
            - call: "GET /farm-policies/${pol_ph}"
              as: Underwriter
              captures: { ph_v1: $.data.version }
            - call: "POST /farm-policies/${pol_ph}/rate"
              payload: { expected_policy_version: "${ph_v1}" }
              as: Underwriter
            - call: "GET /farm-policies/${pol_bl}"
              as: Underwriter
              captures: { bl_v1: $.data.version }
            - call: "POST /farm-policies/${pol_bl}/rate"
              payload: { expected_policy_version: "${bl_v1}" }
              as: Underwriter
          assert:
            - "LivestockGroup.${grp_ph}.covered_limit_cents == 25500000"
            - "LivestockGroup.${grp_bl}.covered_limit_cents == 20400000"
            - "FarmPolicy.${pol_ph}.livestock_premium_cents == 286875"
            - "FarmPolicy.${pol_bl}.livestock_premium_cents == 229500"
            - "FarmPolicy.${pol_ph}.livestock_premium_cents - FarmPolicy.${pol_bl}.livestock_premium_cents == 57375"
            - "FarmPolicy.${pol_ph}.exposed_tiv_cents == 65500000 and FarmPolicy.${pol_bl}.exposed_tiv_cents == 60400000"
            - "FarmPolicy.${pol_ph}.cat_load_cents == 205015 and FarmPolicy.${pol_bl}.cat_load_cents == 189052"
            - "FarmPolicy.${pol_ph}.total_premium_cents == 635890 and FarmPolicy.${pol_bl}.total_premium_cents == 562552"
            - "LivestockGroup.${grp_bl}.head_count == 170 and LivestockGroup.${grp_bl}.per_head_value_cents == 150000 — recorded but excluded from the BLANKET limit"

  - rule_id: combinatorial_formula
    instances:

      - name: property_premium_per_line_rounding_then_sum
        grounds:
          - calculations.property_premium
          - calculations.scheduled_item_insured_value
          - calculations.premium_rollup
          - entities.FarmPolicy.fields.deductible_cents
        distinguishing_aspect: |
          Mode (b) — order of rounding versus aggregation. The pinned order
          rounds each of the five property lines and then sums them, yielding
          424367; summing the five unrounded products and rounding once yields
          424366, so the two orders are one cent apart on this exact fixture and
          the STORED_CROP line lands on an exact .50 that only half-up resolves
          to 59450.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z (valuation month 8)"
            - "one DRAFT policy with deductible_cents 500000 -> deductible credit exactly 0.90"
            - "five scheduled items: RC DWELLING 40000000; ACV FARM_STRUCTURE 12000000 age 18 grade C; ACV EQUIPMENT 30001000 age 12 grade B; RC STORED_CROP 6005000 with peak 18000000 for season 10..2; RC HAY 2760000 with peak 8280000 for season 6..9"
            - "one CATTLE PER_HEAD group of 170 head at 150000 and three liability exposures (GENERAL_FARM, AGRITOURISM 800 visitors / 4000000 receipts, CUSTOM_FARMING 15000000 receipts)"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - &c_item_dwelling
              call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_dw: $.data.id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "FARM_STRUCTURE", description: "Machine shed", valuation_basis: "ACV", stated_value_cents: 12000000, age_years: 18, condition_grade: "C" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_fs: $.data.id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine harvester", valuation_basis: "ACV", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_eq: $.data.id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "STORED_CROP", description: "Milo in bin 4", valuation_basis: "RC", stated_value_cents: 6005000, age_years: 0, condition_grade: "A", peak_season_value_cents: 18000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_sc: $.data.id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "HAY", description: "Alfalfa stack", valuation_basis: "RC", stated_value_cents: 2760000, age_years: 0, condition_grade: "A", peak_season_value_cents: 8280000, peak_season_start_month: 6, peak_season_end_month: 9 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_hay: $.data.id }
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "PER_HEAD", peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies/${pol_id}/liability-exposures"
              payload: { exposure_type: "GENERAL_FARM", annual_receipts_cents: 0 }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies/${pol_id}/liability-exposures"
              payload: { exposure_type: "AGRITOURISM", annual_receipts_cents: 4000000, annual_visitor_count: 800 }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies/${pol_id}/liability-exposures"
              payload: { exposure_type: "CUSTOM_FARMING", annual_receipts_cents: 15000000 }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { prop_prem: $.data.property_premium_cents }
          assert:
            - "ScheduledItem insured values are 40000000, 5280000, 11040368, 6005000 (off peak in month 8) and 8280000 (in peak in month 8)"
            - "FarmPolicy.${pol_id}.property_premium_cents == 424367"
            - "FarmPolicy.${pol_id}.property_premium_cents != 424366 — the sum-then-round order is one cent lower and is wrong"
            - "the STORED_CROP line is 6005000 * 0.0110 * 0.90 = 59449.50 exactly and rounds half-up to 59450"
            - "FarmPolicy.${pol_id}.livestock_premium_cents == 286875"
            - "FarmPolicy.${pol_id}.liability_premium_cents == 402500 (133000 + 112000 + 157500)"
            - "FarmPolicy.${pol_id}.base_premium_cents == 1113742"
            - "FarmPolicy.${pol_id}.exposed_tiv_cents == 96105368"
            - "FarmPolicy.${pol_id}.cat_load_cents == 300810"
            - "FarmPolicy.${pol_id}.total_premium_cents == 1414552"
            - "FarmPolicy.${pol_id}.uw_status == RATED (tiv 96105368 <= 250000000, 800 visitors <= 2000, every utilization <= 0.90, no completed inspection)"

      - name: cat_load_unrounded_utilization_tier_then_scarcity
        grounds:
          - calculations.cat_load
          - entities.CatReservation.fields.utilization_at_rating
          - entities.CatReservation.fields.scarcity_factor
          - entities.CatCapacityPool.fields.total_capacity_cents
          - state_machines.CatReservation.RESERVED_to_COMMITTED
        distinguishing_aspect: |
          Mode (c) — order of the tier lookup relative to rounding and of the
          scarcity factor relative to the rate. With a HAIL pool of 39999999
          cents the exact ratio is 20000000/39999999 = 0.5000000125, which is
          strictly above the 0.50 tier edge and therefore selects factor 1.15
          (load 73600), while the value STORED on the reservation rounds to
          0.500000 — so an implementation that looks the tier up from the stored
          6-decimal figure produces 64000 instead.
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z; one Agent and one FarmAccount in zone ZN-3"
            - "ZN-3 pools: HAIL participation 0.50 with total_capacity_cents 39999999, WIND 0.30 and WILDFIRE 0.20 both with 200000000; all OPEN and empty"
            - "one DRAFT policy, deductible 500000, carrying a single RC DWELLING item insured at 40000000"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 39999999, status: "OPEN" }
              as: PlatformAdmin
              captures: { p3_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { p3_wind: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { p3_fire: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Dry Ridge Ranch", state_code: "KS", county_name: "Barber", cat_zone_code: "ZN-3", acreage: 1200, operation_type: "RANCH" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct3_id: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct3_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol3_id: $.data.id }
            - call: "POST /farm-policies/${pol3_id}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /farm-policies/${pol3_id}"
              as: Underwriter
              captures: { pol3_v1: $.data.version }
            - call: "POST /farm-policies/${pol3_id}/rate"
              payload: { expected_policy_version: "${pol3_v1}" }
              as: Underwriter
            - call: "GET /cat-reservations"
              payload: { policy_id: "${pol3_id}", peril: "HAIL" }
              as: Underwriter
              captures: { hail_factor: "$.data[0].scarcity_factor", hail_load: "$.data[0].load_cents" }
          assert:
            - "the HAIL CatReservation has amount_cents == 20000000"
            - "the HAIL CatReservation has utilization_at_rating == 0.500000 (the exact ratio 0.5000000125 stored to 6 decimal places)"
            - "the HAIL CatReservation has scarcity_factor == 1.15 — the tier is chosen from the UNROUNDED ratio, so the stored 0.500000 must not be read back as the 1.00 tier"
            - "the HAIL CatReservation has load_cents == 73600, not 64000"
            - "the WIND CatReservation has scarcity_factor == 1.00 and load_cents == 25200"
            - "the WILDFIRE CatReservation has scarcity_factor == 1.00 and load_cents == 36000"
            - "FarmPolicy.${pol3_id}.cat_load_cents == 134800"
            - "FarmPolicy.${pol3_id}.property_premium_cents == 144000 and total_premium_cents == 278800"

      - name: acv_salvage_floor_nested_inside_class_cap
        grounds:
          - calculations.scheduled_item_insured_value
          - entities.ScheduledItem.fields.condition_grade
          - entities.ScheduledItem.fields.age_years
          - calculations.property_premium
        distinguishing_aspect: |
          Mode (a) — nesting order of the min and the max. For an ACV EQUIPMENT
          item stated at 300000000 the depreciated value is 54000000, the 20%
          salvage floor is 60000000 and the class cap is 40000000: applying the
          floor first and the cap last yields 40000000, whereas capping first
          and flooring last yields 60000000, i.e. an item insured 50% above its
          own class cap.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one DRAFT policy, deductible 500000, with no exposures yet"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Self-propelled sprayer fleet", valuation_basis: "ACV", stated_value_cents: 300000000, age_years: 12, condition_grade: "D" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_big: $.data.id, iv_big: $.data.insured_value_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
          assert:
            - "ScheduledItem.${it_big}.insured_value_cents == 40000000"
            - "ScheduledItem.${it_big}.insured_value_cents != 60000000 — capping before flooring would escape the EQUIPMENT class cap"
            - "ScheduledItem.${it_big}.insured_value_cents != 54000000 — the depreciated value alone ignores the salvage floor"
            - "the depreciation percentage is capped at 0.60 even though 0.070 * 12 = 0.84"
            - "FarmPolicy.${pol_id}.exposed_tiv_cents == 40000000"
            - "FarmPolicy.${pol_id}.property_premium_cents == 324000"
            - "FarmPolicy.${pol_id}.cat_load_cents == 125200 and total_premium_cents == 449200"

  - rule_id: non_linear_state_machine
    instances:

      - name: policy_uw_and_compliance_axes_move_independently
        grounds:
          - state_machines.FarmPolicy.DRAFT_to_RATED
          - state_machines.FarmPolicy.NOT_INSPECTED_to_RECS_OPEN
          - state_machines.FarmPolicy.RECS_OPEN_to_COMPLIANT
          - state_machines.FarmPolicy.RATED_to_BOUND
          - state_machines.Recommendation.OPEN_to_SUBMITTED
          - state_machines.Recommendation.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          FarmPolicy carries two orthogonal status axes: an inspection
          completion drives compliance_status NOT_INSPECTED -> RECS_OPEN ->
          COMPLIANT while uw_status stays RATED for the whole sequence, and the
          later bind moves uw_status RATED -> BOUND without touching
          compliance_status — neither axis is derivable from the other.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one ACTIVE Inspector with the default 480-minute daily capacity"
            - "one policy carrying a single RC DWELLING item, a zero-headcount LaborProfile (coordination_status NOT_REQUIRED) and uw_status RATED with total_premium_cents 269200"
            - "one SCHEDULED INITIAL inspection on 2026-08-16T09:00:00Z for 120 minutes"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - &c_inspector
              call: "POST /inspectors"
              payload: { full_name: "Dana Reyes", region_code: "KS-CENTRAL", status: "ACTIVE", daily_capacity_minutes: 480 }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - &c_labor_zero
              call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 0, seasonal_count: 0, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab_id: $.data.id }
            - &c_rate_ok
              call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - &c_rate_call
              call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
            - &c_inspection_1
              call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp1_id}/complete"
              payload: { findings_summary: "Guard missing on PTO shaft", findings: [ { severity: "MAJOR", description: "Install PTO shield", due_date: "2026-09-30" } ] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { hz1: $.data.hazard_score }
            - call: "GET /inspections/${insp1_id}/recommendations"
              as: ComplianceOfficer
              captures: { rec1_id: "$.data[0].id" }
            - call: "POST /recommendations/${rec1_id}/evidence"
              payload: { evidence_note: "Shield installed, photo attached", completed_date: "2026-08-18" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /recommendations/${rec1_id}/review"
              payload: { decision: "ACCEPT", review_note: "Verified from photo" }
              as: ComplianceOfficer
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Underwriter
          assert:
            - "immediately after the completion: FarmPolicy.${pol_id}.compliance_status == RECS_OPEN AND uw_status == RATED"
            - "Inspection.${insp1_id}.hazard_score == 22 and recommendation_count == 1"
            - "Recommendation.${rec1_id}.status moves OPEN -> SUBMITTED -> VERIFIED"
            - "after the ACCEPT review: FarmPolicy.${pol_id}.compliance_status == COMPLIANT AND uw_status is still RATED"
            - "after the bind: FarmPolicy.${pol_id}.uw_status == BOUND AND compliance_status is still COMPLIANT"
            - "FarmPolicy.${pol_id}.total_premium_cents == 269200 at every one of the three checkpoints — neither axis change touches premium"
            - "FarmPolicy.${pol_id}.bound_at is set and bound_by_user_id is the binding underwriter"

      - name: labor_profile_pending_verified_lapsed_cycle
        grounds:
          - state_machines.LaborProfile.NOT_REQUIRED_to_PENDING_PROOF
          - state_machines.LaborProfile.PENDING_PROOF_to_VERIFIED
          - state_machines.LaborProfile.VERIFIED_to_LAPSED
          - state_machines.LaborProfile.LAPSED_to_PENDING_PROOF
          - calculations.labor_exposure_units
          - validations[priority=9]
        distinguishing_aspect: |
          coordination_status traverses the closed cycle
          NOT_REQUIRED -> PENDING_PROOF -> VERIFIED -> LAPSED -> PENDING_PROOF
          -> VERIFIED, so the same state is legitimately re-entered twice and a
          second wc-verification against an already VERIFIED row is rejected
          with ERR_WC_STATE_INVALID rather than being idempotent.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one DRAFT policy with a zero-headcount LaborProfile whose coordination_status is NOT_REQUIRED"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_labor_zero
          trigger:
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Heartland Mutual", wc_policy_number: "WC-77120", wc_expiry_date: "2026-08-20" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { units_1: $.data.labor_exposure_units }
            - call: "POST /labor-profiles/${lab_id}/wc-verification"
              payload: { note: "Certificate on file" }
              as: ComplianceOfficer
              captures: { verified_at_1: $.data.verified_at }
            - call: "POST /labor-profiles/${lab_id}/wc-verification"
              payload: { note: "Duplicate verification attempt" }
              as: ComplianceOfficer
              captures: { err_dup: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-sweeps"
              payload: { policy_id: "${pol_id}" }
              as: ComplianceOfficer
              captures: { lapsed_n: $.data.labor_profiles_lapsed }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Heartland Mutual", wc_policy_number: "WC-88431", wc_expiry_date: "2027-08-20" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /labor-profiles/${lab_id}/wc-verification"
              payload: { note: "Renewal certificate on file" }
              as: ComplianceOfficer
          assert:
            - "after the first PUT: LaborProfile.${lab_id}.labor_exposure_units == 6.00, wc_required == true, coordination_status == PENDING_PROOF"
            - "after the first verification: coordination_status == VERIFIED and verified_at == 2026-08-15T00:00:00Z"
            - "the duplicate verification returns ERR_WC_STATE_INVALID with HTTP 409 and leaves coordination_status == VERIFIED"
            - "after the sweep at clock 2026-08-21: coordination_status == LAPSED, verified_at is null, verified_by_user_id is null, and labor_profiles_lapsed == 1"
            - "after the second PUT: coordination_status == PENDING_PROOF again with wc_policy_number == WC-88431"
            - "after the second verification: coordination_status == VERIFIED and verified_at == 2026-08-21T00:00:00Z"
            - "LaborProfile.${lab_id}.version increased on every one of the six mutating steps"

  - rule_id: transitive_cascade
    instances:

      - name: inspection_completion_suspends_endorsement_and_ledger
        grounds:
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
          - state_machines.FarmPolicy.COMPLIANT_to_RECS_OPEN
          - state_machines.Endorsement.APPROVED_to_SUSPENDED
          - calculations.premium_ledger_projection
          - calculations.endorsement_premium
          - entities.PremiumTransaction.fields.reason_code
        distinguishing_aspect: |
          Depth-4 chain from a single call: POST /inspections/{id}/complete ->
          (1) Inspection COMPLETED with one Recommendation per finding ->
          (2) FarmPolicy.compliance_status COMPLIANT -> RECS_OPEN ->
          (3) the APPROVED POLLUTION_BUYBACK endorsement becomes SUSPENDED ->
          (4) an ENDORSEMENT_REMOVE PremiumTransaction of -150000 is appended and
          total_premium_cents falls from 419200 back to 269200.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z, one ACTIVE Inspector"
            - "one RATED policy with a single RC DWELLING item: property 144000, cat load 125200, total 269200, ledger sequence_no 1..2"
            - "a first INITIAL inspection already COMPLETED with an EMPTY findings array, so hazard_score is 10 and compliance_status is COMPLIANT"
            - "one POLLUTION_BUYBACK endorsement with sublimit 10000000 already APPROVED for 150000, so total_premium_cents is 419200 and the ledger holds sequence_no 1..3"
            - "a second INITIAL inspection SCHEDULED for 2026-08-17T09:00:00Z"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_inspector
            - *c_rate_ok
            - *c_rate_call
            - *c_inspection_1
            - call: "POST /inspections/${insp1_id}/complete"
              payload: { findings_summary: "No deficiencies observed", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v2}", form_code: "POLLUTION_BUYBACK", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_id: $.data.id }
            - call: "POST /endorsements/${end_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Clean initial inspection" }
              as: Underwriter
              captures: { end_prem: $.data.premium_cents }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-17T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { insp2_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp2_id}/complete"
              payload: { findings_summary: "Chemical storage deficiencies found", findings: [ { severity: "MAJOR", description: "Bund the chemical store", due_date: "2026-09-30" }, { severity: "MINOR", description: "Post spray-record log", due_date: "2026-09-30" } ] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { hz2: $.data.hazard_score }
          assert:
            - "HOP 1: Inspection.${insp2_id}.status == COMPLETED, hazard_score == 26, recommendation_count == 2, and two Recommendation rows exist with sequence_no 1 and 2 in findings-array order"
            - "HOP 2: FarmPolicy.${pol_id}.compliance_status == RECS_OPEN (it was COMPLIANT before the call)"
            - "HOP 3: Endorsement.${end_id}.status == SUSPENDED while premium_cents stays 150000 on the row for later reinstatement"
            - "HOP 4: a PremiumTransaction with txn_type == ENDORSEMENT_REMOVE, reason_code == COMPLIANCE_SUSPENSION, amount_cents == -150000 and sequence_no == 4 is appended"
            - "FarmPolicy.${pol_id}.endorsement_premium_cents == 0, base_premium_cents == 144000, total_premium_cents == 269200"
            - "FarmPolicy.${pol_id}.cat_load_cents is still 125200 — the cascade never re-rates the catastrophe load"
            - "the ledger of ${pol_id} holds exactly 4 rows and sum(amount_cents) == 269200 == total_premium_cents"
            - "FarmPolicy.${pol_id}.uw_status is still RATED — only the compliance axis moved"

      - name: policy_cancel_releases_committed_capacity_to_pool
        grounds:
          - state_machines.FarmPolicy.BOUND_to_CANCELLED
          - state_machines.CatReservation.COMMITTED_to_RELEASED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - entities.CatCapacityPool.fields.committed_cents
          - entities.CatCapacityPool.fields.available_cents
          - calculations.premium_ledger_projection
        distinguishing_aspect: |
          A different trigger and a different chain from the inspection cascade:
          POST /farm-policies/{id}/cancel -> (1) uw_status BOUND -> CANCELLED ->
          (2) all three COMMITTED CatReservation rows -> RELEASED ->
          (3) each CatCapacityPool recomputes committed_cents to 0 and
          available_cents back to 200000000 and bumps its version to 4, with a
          parallel fan-out that cancels the still-SCHEDULED inspection.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z, one ACTIVE Inspector"
            - "one BOUND policy with a single RC DWELLING item: total_premium_cents 269200, ledger sequence_no 1..2"
            - "three COMMITTED CatReservation rows of 20000000 / 12000000 / 8000000 cents"
            - "one still-SCHEDULED inspection on 2026-08-16T09:00:00Z"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_inspector
            - *c_labor_zero
            - *c_rate_ok
            - *c_rate_call
            - *c_inspection_1
            - &c_bind_ok
              call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - &c_bind_call
              call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Underwriter
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v3}", closure_reason: "Insured sold the operation" }
              as: Underwriter
          assert:
            - "HOP 1: FarmPolicy.${pol_id}.uw_status == CANCELLED with closure_reason == 'Insured sold the operation'"
            - "HOP 2: all three CatReservation rows of ${pol_id} have status == RELEASED"
            - "HOP 3: CatCapacityPool.${pool_hail} has committed_cents == 0, reserved_cents == 0, available_cents == 200000000 and version == 4"
            - "HOP 3: CatCapacityPool.${pool_wind} and CatCapacityPool.${pool_fire} likewise report 0 / 0 / 200000000 and version == 4"
            - "parallel fan-out: Inspection.${insp1_id}.status == CANCELLED"
            - "two REVERSAL PremiumTransaction rows are appended at sequence_no 3 and 4 with amount_cents -144000 and -125200 and reason_code POLICY_CANCELLATION, mirroring sequence_no 1 and 2 in ascending order"
            - "FarmPolicy.${pol_id}.total_premium_cents == 0 and sum(amount_cents) over the 4 ledger rows == 0"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: bind_state_conflict_outranks_authority_limit
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - state_machines.FarmPolicy.RATED_to_BOUND
          - entities.Agent.fields.authority_limit_cents
          - errors.ERR_POLICY_NOT_RATED
        distinguishing_aspect: |
          Category pair state (priority 9, ERR_POLICY_NOT_RATED, 409) versus
          business_fiscal (priority 15, ERR_AGENT_AUTHORITY_EXCEEDED, 422): an
          already-BOUND policy whose producer authority was cut to 100000 while
          the premium stands at 269200 violates both, and the ladder must return
          the priority-9 state error.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one BOUND policy with total_premium_cents 269200 and a NOT_REQUIRED LaborProfile"
            - "the owning Agent's authority_limit_cents patched down to 100000 AFTER the bind"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_labor_zero
            - *c_rate_ok
            - *c_rate_call
            - *c_bind_ok
            - *c_bind_call
            - call: "PATCH /agents/${ag_id}"
              payload: { authority_limit_cents: 100000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v3}" }
              as: Underwriter
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 409 with error_id == ERR_POLICY_NOT_RATED"
            - "error_id != ERR_AGENT_AUTHORITY_EXCEEDED even though 269200 > 100000"
            - "FarmPolicy.${pol_id}.uw_status is still BOUND and version is unchanged from ${pol_v3}"
            - "no PremiumTransaction row is appended and CatCapacityPool.${pool_hail}.committed_cents is still 20000000"

      - name: bind_compliance_suspension_outranks_wc_coordination
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - state_machines.FarmPolicy.RECS_OVERDUE_to_SUSPENDED
          - state_machines.LaborProfile.NOT_REQUIRED_to_PENDING_PROOF
          - errors.ERR_COMPLIANCE_SUSPENDED
        distinguishing_aspect: |
          A different category pair from the state/fiscal instance:
          business_safety (priority 11, ERR_COMPLIANCE_SUSPENDED, 409) versus
          business_referential (priority 13, ERR_WC_COORDINATION_UNVERIFIED,
          422). The policy is compliance-SUSPENDED with a CRITICAL overdue
          recommendation AND its labor profile is PENDING_PROOF, and the first
          check of priority 11 must win over both the second check of the same
          priority and the priority-13 referential check.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z, one ACTIVE Inspector"
            - "one RATED policy with a single RC DWELLING item and a NOT_REQUIRED LaborProfile"
            - "an INITIAL inspection COMPLETED with one CRITICAL finding due 2026-08-10, so hazard_score is 40 and compliance_status is RECS_OPEN"
            - "one compliance sweep run at clock 2026-08-15, which ages the CRITICAL recommendation to OVERDUE and escalates the policy through RECS_OVERDUE to SUSPENDED"
            - "the LaborProfile then re-PUT at 4 full-time and 4 seasonal workers with no proof, so labor_exposure_units is 6.00 and coordination_status is PENDING_PROOF"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_inspector
            - *c_labor_zero
            - *c_rate_ok
            - *c_rate_call
            - *c_inspection_1
            - call: "POST /inspections/${insp1_id}/complete"
              payload: { findings_summary: "Anhydrous nurse tank unsecured", findings: [ { severity: "CRITICAL", description: "Secure and placard the nurse tank", due_date: "2026-08-10" } ] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
            - call: "POST /compliance-sweeps"
              payload: { policy_id: "${pol_id}" }
              as: ComplianceOfficer
              captures: { susp_n: $.data.policies_suspended }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v4: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v4}" }
              as: Underwriter
              captures: { err_id2: $.data.error_id }
          assert:
            - "the sweep reported policies_suspended == 1 and FarmPolicy.${pol_id}.compliance_status == SUSPENDED"
            - "Inspection.${insp1_id}.hazard_score == 40 and its single Recommendation has severity CRITICAL and status OVERDUE"
            - "LaborProfile of ${pol_id} has labor_exposure_units == 6.00 and coordination_status == PENDING_PROOF"
            - "the bind response is HTTP 409 with error_id == ERR_COMPLIANCE_SUSPENDED"
            - "error_id != ERR_CRITICAL_REC_OVERDUE (same priority 11 but a later check) and != ERR_WC_COORDINATION_UNVERIFIED (priority 13)"
            - "FarmPolicy.${pol_id}.uw_status is still RATED and its three CatReservation rows are still RESERVED"

  - rule_id: boundary_precision_check
    instances:

      - name: cat_utilization_exactly_half_holds_base_scarcity_tier
        grounds:
          - calculations.cat_load
          - entities.CatReservation.fields.scarcity_factor
          - entities.CatCapacityPool.fields.total_capacity_cents
          - entities.FarmPolicy.fields.cat_load_cents
        distinguishing_aspect: |
          Metric: pool utilization ratio at the upper edge of the first scarcity
          tier, measured on POST /farm-policies/{id}/rate. The tier is
          `utilization <= 0.50 -> 1.00`, so a HAIL pool of exactly 40000000
          cents (utilization exactly 0.500000) must keep factor 1.00 and load
          64000, while a HAIL pool one single cent smaller (39999999) is
          strictly above the edge and jumps to 1.15 / 73600 — a 9600-cent step
          in total premium caused by one cent of capacity.
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent with a 5000000-cent authority limit"
            - "zone ZN-E pools: HAIL 0.50 with total_capacity_cents exactly 40000000, WIND 0.30 and WILDFIRE 0.20 with 200000000; all OPEN and empty"
            - "zone ZN-F pools: identical except HAIL total_capacity_cents 39999999"
            - "one DRAFT policy per zone, deductible 500000, each with a single RC DWELLING item stated at 40000000 (exposed_tiv 40000000, HAIL share 20000000)"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-E", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 40000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pe_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-E", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-E", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-F", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 39999999, status: "OPEN" }
              as: PlatformAdmin
              captures: { pf_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-F", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-F", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /farm-accounts"
              payload: { legal_name: "Edge Acres E", state_code: "KS", county_name: "Rice", cat_zone_code: "ZN-E", acreage: 1200, operation_type: "CROP" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_e: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Edge Acres F", state_code: "KS", county_name: "Rice", cat_zone_code: "ZN-F", acreage: 1200, operation_type: "CROP" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_f: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_e}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_e: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_f}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_f: $.data.id }
            - call: "POST /farm-policies/${pol_e}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies/${pol_f}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /farm-policies/${pol_e}"
              as: Underwriter
              captures: { e_v1: $.data.version }
            - call: "POST /farm-policies/${pol_e}/rate"
              payload: { expected_policy_version: "${e_v1}" }
              as: Underwriter
              captures: { e_cat: $.data.cat_load_cents }
            - call: "GET /farm-policies/${pol_f}"
              as: Underwriter
              captures: { f_v1: $.data.version }
            - call: "POST /farm-policies/${pol_f}/rate"
              payload: { expected_policy_version: "${f_v1}" }
              as: Underwriter
              captures: { f_cat: $.data.cat_load_cents }
          assert:
            - "the HAIL CatReservation of ${pol_e} has utilization_at_rating == 0.500000 and scarcity_factor == 1.00 (the tier bound is inclusive) and load_cents == 64000"
            - "the HAIL CatReservation of ${pol_f} has scarcity_factor == 1.15 and load_cents == 73600"
            - "FarmPolicy.${pol_e}.cat_load_cents == 125200 and total_premium_cents == 269200"
            - "FarmPolicy.${pol_f}.cat_load_cents == 134800 and total_premium_cents == 278800"
            - "the two totals differ by exactly 9600 while the two schedules are byte-identical"
            - "both policies reach uw_status RATED — utilization 0.50 and 0.5000000125 are both <= the 0.90 referral trigger"

      - name: labor_exposure_units_exactly_six_requires_wc
        grounds:
          - calculations.labor_exposure_units
          - entities.LaborProfile.fields.wc_required
          - state_machines.LaborProfile.NOT_REQUIRED_to_PENDING_PROOF
        distinguishing_aspect: |
          Metric: labor_exposure_units at the 6.00 workers-compensation
          threshold, measured on PUT /farm-policies/{id}/labor-profile. Three
          full-time plus four seasonal workers score exactly 5.00 and stay
          NOT_REQUIRED, four plus four score exactly 6.00 and the `>= 6.00`
          comparison must fire (PENDING_PROOF), so an implementation using a
          strict `> 6.00` leaves the profile bindable without proof.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one DRAFT policy with no LaborProfile row yet"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
          trigger:
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 3, seasonal_count: 4, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab_id: $.data.id, units_lo: $.data.labor_exposure_units }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { units_hi: $.data.labor_exposure_units }
          assert:
            - "after the first PUT: labor_exposure_units == 5.00, wc_required == false, coordination_status == NOT_REQUIRED"
            - "after the second PUT: labor_exposure_units == 6.00, wc_required == true, coordination_status == PENDING_PROOF"
            - "the threshold comparison is `>= 6.00`, so exactly 6.00 requires proof"
            - "labor_exposure_units is reported with 2 decimal places (5.00, not 5)"
            - "LaborProfile.${lab_id}.version == 2 after the second PUT — the PUT upserts the same row rather than creating a second profile"

      - name: stored_crop_wraparound_season_february_boundary
        grounds:
          - calculations.scheduled_item_insured_value
          - entities.ScheduledItem.fields.peak_season_start_month
          - entities.ScheduledItem.fields.peak_season_end_month
          - entities.ScheduledItem.fields.valued_at
        distinguishing_aspect: |
          Metric: calendar-month membership in a year-wrapping peak season
          (start 10, end 2), measured on POST
          /farm-policies/{id}/scheduled-items and again on PATCH
          /scheduled-items/{id}. The last instant of February
          (2026-02-28T23:59:59Z) is still INSIDE the season and must value the
          bin at 18000000, while 2026-03-01T00:00:00Z is outside and must value
          it at 6005000 — a naive `start <= month <= end` test excludes
          February entirely.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap with the logical clock parked at 2026-02-28T23:59:59Z"
            - "one DRAFT policy for the 2026-09-01..2027-08-31 term with no exposures yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-28T23:59:59Z" }
              as: PlatformAdmin
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "STORED_CROP", description: "Milo in bin 4", valuation_basis: "RC", stated_value_cents: 6005000, age_years: 0, condition_grade: "A", peak_season_value_cents: 18000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_sc: $.data.id, iv_feb: $.data.insured_value_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "PATCH /scheduled-items/${it_sc}"
              payload: { peak_season_value_cents: 18000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { iv_mar: $.data.insured_value_cents }
          assert:
            - "at 2026-02-28T23:59:59Z: ScheduledItem.${it_sc}.insured_value_cents == 18000000 and valued_at == 2026-02-28T23:59:59Z"
            - "the wrap-around membership test is `month >= 10 OR month <= 2`, so month 2 is inside the season"
            - "at 2026-03-01T00:00:00Z the same row, re-PATCHed with the identical peak-season triple, re-values to insured_value_cents == 6005000 with valued_at == 2026-03-01T00:00:00Z"
            - "the RC election means no depreciation is applied on either side of the boundary"
            - "ScheduledItem.${it_sc}.peak_season_value_cents is still 18000000 and stated_value_cents is still 6005000 — only the derived value moved"
            - "FarmPolicy.${pol_id}.uw_status is still DRAFT (the policy was never rated, so no revert cascade fires)"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: bind_blocked_by_suspended_producer_appointment
        grounds:
          - validations[priority=13]
          - entities.Agent.fields.appointment_status
          - state_machines.FarmPolicy.RATED_to_BOUND
          - errors.ERR_AGENT_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair FarmPolicy <-> Agent. The bindability of a policy depends
          on the appointment_status of the Agent reached through
          FarmAccount.agent_id — nothing on the policy itself changes when the
          producer is suspended, yet the bind flips from allowed to
          ERR_AGENT_NOT_ACTIVE and back purely on the remote row's state.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one RATED policy with a single RC DWELLING item, total_premium_cents 269200, and a NOT_REQUIRED LaborProfile"
            - "the owning Agent's appointment_status patched to SUSPENDED after rating"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_labor_zero
            - *c_rate_ok
            - *c_rate_call
            - call: "PATCH /agents/${ag_id}"
              payload: { appointment_status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { err_susp: $.data.error_id }
            - call: "PATCH /agents/${ag_id}"
              payload: { appointment_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v3}" }
              as: Underwriter
          assert:
            - "the first bind returns HTTP 422 with error_id == ERR_AGENT_NOT_ACTIVE"
            - "after the failed bind: FarmPolicy.${pol_id}.uw_status == RATED, version == ${pol_v2}, bound_at is null, and its three CatReservation rows are still RESERVED"
            - "CatCapacityPool.${pool_hail}.committed_cents == 0 after the failed bind"
            - "the second bind succeeds: uw_status == BOUND, bound_at == 2026-08-15T00:00:00Z"
            - "after the successful bind CatCapacityPool.${pool_hail}.committed_cents == 20000000 and reserved_cents == 0"
            - "the policy's own fields were identical at both attempts — only Agent.${ag_id}.appointment_status differed"

      - name: buyback_approval_gated_by_latest_inspection_hazard
        grounds:
          - validations[priority=11]
          - calculations.inspection_hazard_score
          - state_machines.Endorsement.REQUESTED_to_APPROVED
          - state_machines.Inspection.COMPLETED_to_SCHEDULED
          - errors.ERR_BUYBACK_INSPECTION_REQUIRED
          - errors.ERR_BUYBACK_HAZARD_TOO_HIGH
        distinguishing_aspect: |
          A different entity pair: Endorsement <-> Inspection. The same
          POLLUTION_BUYBACK request is rejected three different ways depending
          only on the remote inspection record — no COMPLETED inspection gives
          ERR_BUYBACK_INSPECTION_REQUIRED, a completed one with hazard_score 40
          gives ERR_BUYBACK_HAZARD_TOO_HIGH, and after a re-inspection scores 9
          the identical call succeeds and prices at 150000.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z, one ACTIVE Inspector"
            - "one RATED policy with a single RC DWELLING item (total 269200) and one REQUESTED POLLUTION_BUYBACK endorsement with sublimit 10000000"
            - "one INITIAL inspection SCHEDULED for 2026-08-16T09:00:00Z for 120 minutes"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_inspector
            - *c_rate_ok
            - *c_rate_call
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v2}", form_code: "POLLUTION_BUYBACK", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_id: $.data.id, req_insp: $.data.requires_inspection }
            - *c_inspection_1
          trigger:
            - call: "POST /endorsements/${end_id}/decision"
              payload: { decision: "APPROVE", decision_note: "First attempt, no inspection on file" }
              as: Underwriter
              captures: { err_no_insp: $.data.error_id }
            - call: "POST /inspections/${insp1_id}/complete"
              payload: { findings_summary: "Anhydrous nurse tank unsecured", findings: [ { severity: "CRITICAL", description: "Secure and placard the nurse tank", due_date: "2026-09-30" } ] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { hz_bad: $.data.hazard_score }
            - call: "POST /endorsements/${end_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Second attempt, hazard still high" }
              as: Underwriter
              captures: { err_hazard: $.data.error_id }
            - call: "POST /inspections/${insp1_id}/reinspection"
              payload: { scheduled_for: "2026-08-18T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
            - call: "POST /inspections/${insp1_id}/complete"
              payload: { findings_summary: "Nurse tank secured; minor housekeeping only", findings: [ { severity: "MINOR", description: "Sweep the chemical shed floor", due_date: "2026-09-30" } ] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { hz_ok: $.data.hazard_score }
            - call: "POST /endorsements/${end_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Re-inspection clean enough" }
              as: Underwriter
              captures: { end_prem: $.data.premium_cents }
          assert:
            - "Endorsement.${end_id}.requires_inspection == true for form_code POLLUTION_BUYBACK"
            - "attempt 1 returns HTTP 422 with error_id == ERR_BUYBACK_INSPECTION_REQUIRED and leaves status == REQUESTED"
            - "the first completion yields Inspection.${insp1_id}.hazard_score == 40 (10 base for INITIAL + 30 for the CRITICAL finding)"
            - "attempt 2 returns HTTP 422 with error_id == ERR_BUYBACK_HAZARD_TOO_HIGH because 40 > 35, and status is still REQUESTED"
            - "the re-inspection completion yields hazard_score == 9 (5 base for RE_INSPECTION + 4 for the MINOR finding) and recommendation_count == 1 for that call"
            - "the second completion's Recommendation carries sequence_no == 2, continuing after the CRITICAL row's sequence_no == 1"
            - "FarmPolicy.${pol_id}.compliance_status == RECS_OPEN after both completions — the second completion finds the axis already at RECS_OPEN and leaves it there"
            - "attempt 3 succeeds: Endorsement.${end_id}.status == APPROVED with premium_cents == 150000"
            - "FarmPolicy.${pol_id}.endorsement_premium_cents == 150000 and total_premium_cents == 419200 while cat_load_cents stays 125200"

  - rule_id: resource_temporal_overlap
    instances:

      - name: inspector_half_open_window_with_travel_buffer
        grounds:
          - validations[priority=12]
          - calculations.inspector_day_load
          - entities.Inspection.fields.scheduled_for
          - entities.Inspection.fields.duration_minutes
          - errors.ERR_INSPECTOR_WINDOW_CONFLICT
        distinguishing_aspect: |
          Resource: Inspector time. Interval semantics: HALF-OPEN
          [scheduled_for, scheduled_for + duration) extended by a 90-minute
          travel buffer appended AFTER the end instant, so an existing
          09:00 + 120min booking blocks up to 12:30. A request starting 12:00
          conflicts, while a request starting exactly at the buffer edge 12:30
          is accepted — touching is allowed, and the buffer is one-sided.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z, one ACTIVE Inspector with daily_capacity_minutes 480"
            - "one RATED policy with a single RC DWELLING item"
            - "one SCHEDULED INITIAL inspection at 2026-08-16T09:00:00Z for 120 minutes (window ends 11:00, buffered to 12:30)"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_inspector
            - *c_rate_ok
            - *c_rate_call
            - *c_inspection_1
          trigger:
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-16T12:00:00Z", duration_minutes: 60 }
              as: Underwriter
              captures: { err_window: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-16T12:30:00Z", duration_minutes: 60 }
              as: Underwriter
              captures: { insp3_id: $.data.id }
          assert:
            - "the 12:00 request returns HTTP 409 with error_id == ERR_INSPECTOR_WINDOW_CONFLICT (12:00 is strictly before the existing buffered end 12:30)"
            - "no Inspection row is created by the rejected request — GET /inspections filtered on inspector_id returns exactly 1 row at that point"
            - "the 12:30 request succeeds with status SCHEDULED, so exact contact with the buffer edge is allowed"
            - "Inspection.${insp3_id}.scheduled_for == 2026-08-16T12:30:00Z and duration_minutes == 60"
            - "booked SCHEDULED minutes for the inspector on 2026-08-16 total 180, still within daily_capacity_minutes 480, so ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED does not fire"
            - "the buffer is appended only AFTER a window: a booking that ENDS exactly at 09:00 would be accepted with no leading buffer"

      - name: policy_term_closed_closed_overlap_on_account
        grounds:
          - validations[priority=12]
          - entities.FarmPolicy.fields.term_start_date
          - entities.FarmPolicy.fields.term_end_date
          - errors.ERR_OVERLAPPING_POLICY_TERM
          - state_machines.FarmPolicy.DRAFT_to_RATED
        distinguishing_aspect: |
          A different resource (FarmAccount coverage period rather than
          inspector time) with the OPPOSITE interval semantics: policy terms are
          CLOSED-CLOSED date intervals with no buffer, so a sibling term that
          merely shares the single boundary date 2027-08-31 DOES overlap and is
          rejected, while starting one day later is accepted. Only siblings in
          {RATED, REFERRED, BOUND} occupy the period — DRAFT siblings do not.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "policy A on the account for 2026-09-01..2027-08-31, RATED, with a single RC DWELLING item"
            - "policy B on the SAME account for 2027-08-31..2028-08-30 (sharing exactly one boundary date), DRAFT, with its own RC DWELLING item"
            - "policy C on the SAME account for 2027-09-01..2028-08-31, DRAFT, with its own RC DWELLING item"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_rate_ok
            - *c_rate_call
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2027-08-31", term_end_date: "2028-08-30", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_b: $.data.id }
            - call: "POST /farm-policies/${pol_b}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Second ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2027-09-01", term_end_date: "2028-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_c: $.data.id }
            - call: "POST /farm-policies/${pol_c}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Third ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /farm-policies/${pol_b}"
              as: Underwriter
              captures: { b_v1: $.data.version }
            - call: "POST /farm-policies/${pol_b}/rate"
              payload: { expected_policy_version: "${b_v1}" }
              as: Underwriter
              captures: { err_term: $.data.error_id }
            - call: "GET /farm-policies/${pol_c}"
              as: Underwriter
              captures: { c_v1: $.data.version }
            - call: "POST /farm-policies/${pol_c}/rate"
              payload: { expected_policy_version: "${c_v1}" }
              as: Underwriter
          assert:
            - "rating policy B returns HTTP 409 with error_id == ERR_OVERLAPPING_POLICY_TERM — sharing the single date 2027-08-31 with RATED policy A is an overlap"
            - "policy B stays DRAFT with version == ${b_v1}, no CatReservation rows and no PremiumTransaction rows"
            - "CatCapacityPool.${pool_hail}.reserved_cents is still 20000000 (only policy A's share) after the rejected rating"
            - "rating policy C succeeds: uw_status == RATED, property_premium_cents == 144000, cat_load_cents == 125200, total_premium_cents == 269200"
            - "policy A and policy C coexist as RATED on the same account because 2027-09-01 > 2027-08-31"
            - "policy B, still DRAFT, does not itself block anything — the exclusion set is {RATED, REFERRED, BOUND}"

  - rule_id: compensating_invariant
    instances:

      - name: cat_pool_capacity_conserved_across_reserve_commit_release
        grounds:
          - entities.CatCapacityPool.fields.reserved_cents
          - entities.CatCapacityPool.fields.committed_cents
          - entities.CatCapacityPool.fields.available_cents
          - state_machines.CatReservation.RESERVED_to_COMMITTED
          - state_machines.CatReservation.COMMITTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: catastrophe capacity. total_capacity_cents ==
          available_cents + reserved_cents + committed_cents must hold on every
          pool at every checkpoint of the rate -> bind -> cancel lifecycle, with
          the 20000000-cent HAIL share migrating from available to reserved to
          committed and all the way back — the pool must never gain or lose a
          cent, and the released capacity must be re-usable afterwards.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z: three OPEN pools of 200000000 each, all fully available"
            - "one DRAFT policy with a single RC DWELLING item stated at 40000000 and a NOT_REQUIRED LaborProfile"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_labor_zero
          trigger:
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: Underwriter
              captures: { h_av0: $.data.available_cents, h_v0: $.data.version }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: Underwriter
              captures: { h_res1: $.data.reserved_cents, h_av1: $.data.available_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Underwriter
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: Underwriter
              captures: { h_com2: $.data.committed_cents, h_av2: $.data.available_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v3}", closure_reason: "Insured moved the operation" }
              as: Underwriter
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: Underwriter
              captures: { h_av3: $.data.available_cents, h_v3: $.data.version }
          assert:
            - "checkpoint 0 (created): HAIL pool reserved 0, committed 0, available 200000000; 200000000 == 0 + 0 + 200000000"
            - "checkpoint 1 (RATED): HAIL pool reserved 20000000, committed 0, available 180000000; 200000000 == 180000000 + 20000000 + 0"
            - "checkpoint 2 (BOUND): HAIL pool reserved 0, committed 20000000, available 180000000; 200000000 == 180000000 + 0 + 20000000"
            - "checkpoint 3 (CANCELLED): HAIL pool reserved 0, committed 0, available 200000000; the pool is exactly whole again"
            - "the same identity holds at all four checkpoints for the WIND pool (12000000 share) and the WILDFIRE pool (8000000 share)"
            - "CatCapacityPool.${pool_hail}.version == 4 — one bump per lifecycle event (create, reserve, commit, release), never a silent recompute"
            - "the policy's three CatReservation rows end at status RELEASED with amount_cents still 20000000 / 12000000 / 8000000 for audit"

      - name: premium_ledger_sum_equals_total_after_reversal
        grounds:
          - calculations.premium_ledger_projection
          - entities.PremiumTransaction.fields.sequence_no
          - entities.PremiumTransaction.fields.reverses_sequence_no
          - state_machines.FarmPolicy.RATED_to_DRAFT
          - state_machines.Endorsement.APPROVED_to_SUSPENDED
          - calculations.endorsement_premium
        distinguishing_aspect: |
          A different conserved quantity: money. FarmPolicy.total_premium_cents
          must always equal the sum of the append-only PremiumTransaction
          ledger. A rating, an endorsement approval and then an exposure edit
          that reverts the policy to DRAFT produce three positive and three
          negative entries, so the ledger must sum to exactly 0 while retaining
          all six rows — the reversal replays sequence_no 1,2,3 in ascending
          order and never mutates or deletes an original entry.
        test_recipe:
          setup:
            - "the ZN-1 bootstrap, clock 2026-08-15T00:00:00Z"
            - "one RATED policy with a single RC DWELLING item stated at 40000000: property 144000, cat load 125200, total 269200, ledger sequence_no 1 (BASE_PROPERTY 144000) and 2 (CAT_LOAD 125200)"
            - "one APPROVED PEAK_SEASON_INCREASE endorsement with sublimit 12000000 priced at 132000, giving total 401200 and ledger sequence_no 3"
          setup_api_calls:
            - *c_clock
            - *c_agent
            - *c_pool_hail
            - *c_pool_wind
            - *c_pool_fire
            - *c_acct
            - *c_policy
            - *c_item_dwelling
            - *c_rate_ok
            - *c_rate_call
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v2}", form_code: "PEAK_SEASON_INCREASE", sublimit_cents: 12000000, requested_effective_date: "2026-10-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_id: $.data.id }
            - call: "POST /endorsements/${end_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Harvest peak accepted" }
              as: Underwriter
              captures: { end_prem: $.data.premium_cents }
          trigger:
            - call: "PATCH /scheduled-items/${it_dw}"
              payload: { stated_value_cents: 45000000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { iv_new: $.data.insured_value_cents }
          assert:
            - "immediately before the trigger the policy stood at total_premium_cents == 401200 with 3 ledger rows summing to 401200"
            - "Endorsement.${end_id}.premium_cents == 132000 and its ENDORSEMENT_ADD entry sat at sequence_no 3"
            - "the PATCH drives FarmPolicy.${pol_id}.uw_status from RATED back to DRAFT"
            - "three REVERSAL rows are appended at sequence_no 4, 5 and 6 with amount_cents -144000, -125200 and -132000 and reverses_sequence_no 1, 2 and 3 respectively — the replay is in sequence_no ASC order"
            - "every REVERSAL row carries reason_code == RATING_REVERT"
            - "the ledger holds exactly 6 rows and sum(amount_cents) == 0"
            - "FarmPolicy.${pol_id}: property_premium_cents, livestock_premium_cents, liability_premium_cents, endorsement_premium_cents, base_premium_cents, cat_load_cents, total_premium_cents and exposed_tiv_cents are all 0, and quote_expires_at is null"
            - "Endorsement.${end_id}.status == SUSPENDED with premium_cents still 132000 on the row (the money was reversed in the ledger, not erased from the endorsement)"
            - "all three CatReservation rows are RELEASED and CatCapacityPool.${pool_hail}.available_cents == 200000000"
            - "ScheduledItem.${it_dw}.insured_value_cents == 45000000 — the RC election passes the new stated value straight through"
            - "no original PremiumTransaction row was mutated or deleted: sequence_no 1, 2 and 3 still read 144000, 125200 and 132000"
