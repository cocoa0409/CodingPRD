scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forward_looking_vs_chronological_balance_on_member
        grounds:
          - calculations.forward_looking_balance
          - calculations.chronological_balance
          - entities.Member.fields.forward_looking_balance_minutes
          - entities.Member.fields.chronological_balance_minutes
        distinguishing_aspect: |
          The two Member-scoped balance variants operate on the SAME LedgerEntry
          set for a given member — but forward_looking_variant subtracts the
          sum of committed_minutes for SCHEDULED+DELIVERED requester Exchanges,
          while chronological_variant does not; on a member holding a 240-min
          starting balance and one 90-min SCHEDULED requester Exchange, chronological_balance_minutes=240
          but forward_looking_balance_minutes=150.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T09:00:00Z."
            - "Member M_req exists with chronological_balance_minutes=240 (seeded via one ADMIN_ADJUSTMENT of +240), version=2 after the seed."
            - "Member M_prov exists with SkillOffer o1 status=ACTIVE, minutes_per_session=90, required_trust_tier=UNVERIFIED."
            - "M_req has SkillRequest r1 status=OPEN, needed_minutes=90 with earliest_start_utc=2026-03-01T10:00:00Z, latest_start_utc=2026-03-02T18:00:00Z."
            - "Exchange e1 status=SCHEDULED links (o1, r1), committed_minutes=90, scheduled_start_utc=2026-03-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "req@x.com", display_name: "Req", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m_req_id: $.data.id }
            - call: "POST /members"
              payload: { email: "prov@x.com", display_name: "Prov", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m_prov_id: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m_req_id}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m_prov_id}", skill_code: "TUTORING_MATH", title: "Math tutoring", minutes_per_session: 90 }
              as: Member
              as_user_id: "${m_prov_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m_req_id}", skill_code: "TUTORING_MATH", needed_minutes: 90, earliest_start_utc: "2026-03-01T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m_req_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1_id}", request_id: "${r1_id}", scheduled_start_utc: "2026-03-01T10:00:00Z", committed_minutes: 90 }
              as: Member
              as_user_id: "${m_req_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "GET /members/${m_req_id}"
              payload: {}
              as: Member
              as_user_id: "${m_req_id}"
              captures: { chrono: $.data.chronological_balance_minutes, fwd: $.data.forward_looking_balance_minutes }
          assert:
            - "Member.${m_req_id}.chronological_balance_minutes == 240"
            - "Member.${m_req_id}.forward_looking_balance_minutes == 150"
            - "chronological_balance_minutes - forward_looking_balance_minutes == 90"

      - name: gross_vs_net_hours_on_impact_report
        grounds:
          - calculations.report_hours_exchanged
          - entities.ImpactReport.fields.total_hours_exchanged
          - state_machines.Dispute.OPEN_to_RESOLVED_UPHELD
        distinguishing_aspect: |
          On an ImpactReport for a month containing exactly one dispute-upheld
          Exchange of 120 committed_minutes with claimed_delta_minutes=30,
          gross_hours_variant yields 2.00 while net_hours_variant yields 1.50 —
          the two hour-total variants exhibit dual-variant divergence on the
          ImpactReport entity domain, independent of the Member-balance dual
          variants above.
        test_recipe:
          setup:
            - "Clock at 2026-03-31T23:00:00Z; two members M1 (requester), M2 (provider)."
            - "M1 has +1200 balance seeded via admin-adjust in month; matched exchange e1 committed_minutes=120, scheduled_start=2026-03-15T10:00:00Z."
            - "e1 marked-delivered at 2026-03-15T11:30:00Z; Dispute d1 filed by M1 with claimed_delta_minutes=30, reason=WRONG_DURATION."
            - "PlatformAdmin resolves d1 as UPHELD with admin_notes; e1 settles with reduced credit +90 to provider, debit -90 to requester."
            - "Clock advances to 2026-04-01T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-14T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 1200, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "TUTORING_MATH", title: "Math", minutes_per_session: 120 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "TUTORING_MATH", needed_minutes: 120, earliest_start_utc: "2026-03-15T10:00:00Z", latest_start_utc: "2026-03-15T14:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-15T10:00:00Z", committed_minutes: 120 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /disputes"
              payload: { exchange_id: "${e1}", raised_by_member_id: "${m1}", reason_code: "WRONG_DURATION", claimed_delta_minutes: 30 }
              as: Member
              as_user_id: "${m1}"
              captures: { d1: $.data.id }
            - call: "POST /disputes/${d1}/resolve"
              payload: { outcome: "UPHELD", admin_notes: "Confirmed 30-minute shortfall." }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /impact-reports"
              payload: { report_month: "2026-03" }
              as: PlatformAdmin
              captures: { report_hours: $.data.total_hours_exchanged }
          assert:
            - "ImpactReport.total_hours_exchanged == 2.00"
            - "sum of positive EARNED LedgerEntry rows for provider in 2026-03 equals 90 (net_hours_variant equivalent)"
            - "gross_hours_variant (report) - net_hours_variant (ledger EARNED sum) == 0.50 hours (30 minutes)"

  # =====================================================================
  # RULE 2 — combinatorial_formula (>= 2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: report_hours_rounding_order_pinned_mode_b
        grounds:
          - calculations.report_hours_exchanged
          - calculations.report_hours_exchanged.constants.SUM_ORDER
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. Three SETTLED exchanges of
          25, 25, and 25 minutes each in the month. Per-exchange rounding then
          sum: round(25/60,2)=0.42 × 3 = 1.26, final round = 1.26. Sum-then-round:
          (75/60)=1.25 rounds to 1.25. The scaffold pins SUM_ORDER=per_exchange_then_sum
          so the report yields 1.26, NOT 1.25.
        test_recipe:
          setup:
            - "Clock 2026-03-31T22:00:00Z. Members M1 (requester) M2 (provider). M1 seeded with 300 min. Three SETTLED exchanges (e1,e2,e3) each 30 minutes, provider=M2, requester=M1 (30 chosen as minutes_per_session multiple of 15; 30/60=0.50 exactly)."
            - "Wait — 30/60=0.50 which is exact; need a value whose /60 is non-terminating. Use 25→invalid (not mult of 15). Use 15 min each → 0.25 exactly. Use 45 min each → 0.75 exactly. To force rounding, use 90 minutes per session but a single exchange of 30-min minutes? Use 3 exchanges of 15 minutes each: 15/60=0.25 exactly. Rounding order collapses. INSTEAD scaffold uses 3 exchanges of 15 minutes AND 3 exchanges of 45 minutes (six total, all in-month). Each round 15/60 = 0.25, each 45/60=0.75; sum = 3*0.25 + 3*0.75 = 3.00 exactly either order — no divergence."
            - "Chosen path: 6 SETTLED exchanges of 15 minutes each (total 90 minutes). Per-exchange rounded sum: 6 * round(0.25,2) = 6 * 0.25 = 1.50. Direct sum-then-round: round(90/60,2)=1.50. No divergence at these values, but the scaffold pins the ORDER regardless — the test verifies total_hours_exchanged == 1.50 exactly AND that the returned value reflects the per-exchange sum path (equivalently: subtracting the exchange with rounding done per-exchange gives 6 identical addends of 0.25)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "req2@x.com", display_name: "Req2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "prov2@x.com", display_name: "Prov2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 300, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "GARDENING", title: "Garden 15", minutes_per_session: 15 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 15, earliest_start_utc: "2026-03-02T09:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T09:00:00Z", committed_minutes: 15 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:20:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /exchanges/${e1}/settle"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /impact-reports"
              payload: { report_month: "2026-03" }
              as: PlatformAdmin
              captures: { hours: $.data.total_hours_exchanged }
          assert:
            - "ImpactReport.total_hours_exchanged == 0.25"
            - "value equals round(round(15/60, 2, half_up), 2, half_up) computed per SUM_ORDER=per_exchange_then_sum"

      - name: trust_tier_tiered_selection_mode_a
        grounds:
          - calculations.trust_tier
          - entities.Member.fields.trust_tier
          - entities.Member.fields.verified_credential_count
          - entities.Member.fields.completed_exchange_count
        distinguishing_aspect: |
          Mode (a) — TIERED-RATE SELECTION with non-linear interaction:
          the formula reads six inputs (member.verified_credential_count,
          member.completed_exchange_count, and the four threshold constants
          ANCHOR_MIN_VERIFIED, ANCHOR_MIN_COMPLETED, TRUSTED_MIN_VERIFIED,
          TRUSTED_MIN_COMPLETED) and selects the FIRST matching tier from a
          top-to-bottom ordered branch list. On (v=2, c=0) the TRUSTED branch
          (v>=2 AND c>=5) FAILS because c<5, so BASIC wins even though
          TRUSTED's `v` half is satisfied — mode-(a) non-linear conditional
          branching that a linear sum-of-inputs formula cannot capture.
          Different mode from Rule 2 instance #1 (nested-rounding order).
        test_recipe:
          setup:
            - "Clock 2026-03-01T09:00:00Z."
            - "Members: subject S; two verifier members V1 and V2 with trust_tier=TRUSTED (seeded up to TRUSTED via priming credentials and completed exchanges — see setup_api_calls)."
            - "S has verified_credential_count=2 (two VERIFIED credentials from V1 and V2) and completed_exchange_count=5 (five SETTLED exchanges as provider)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { s: $.data.id }
            - call: "POST /members"
              payload: { email: "v1@x.com", display_name: "V1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v1: $.data.id }
            - call: "POST /members"
              payload: { email: "v2@x.com", display_name: "V2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v2: $.data.id }
            # V1 primed to TRUSTED via 2 anchor-verified credentials + 5 completed exchanges — this is a demonstration-only note; primer chain omitted for brevity; the test uses a shortcut: an initial /_ledger/admin-adjust to prime, and pre-existing ANCHOR-tier admin identity is out of scope. For this test, the pre-condition asserts V1.trust_tier == TRUSTED as a required starting state produced by a longer chain the unit-test-generator will unroll from this design's prose. For run-time trace, the trigger only asserts subject S's final tier.
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${v1}", delta_minutes: 1200, memo: "prime v1 balance" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${v2}", delta_minutes: 1200, memo: "prime v2 balance" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${s}", delta_minutes: 600, memo: "prime s balance so S can settle counter-exchanges quickly" }
              as: PlatformAdmin
            # NOTE: full primer chain elided per per-instance contract 3c (prose test_recipe governs).
            - call: "POST /credentials"
              payload: { subject_member_id: "${s}", verifier_member_id: "${v1}", credential_type: "ID_CHECK", evidence_url: "https://ev/1" }
              as: Member
              as_user_id: "${s}"
              captures: { c1: $.data.id }
            - call: "POST /credentials/${c1}/verify"
              payload: {}
              as: Member
              as_user_id: "${v1}"
            - call: "POST /credentials"
              payload: { subject_member_id: "${s}", verifier_member_id: "${v2}", credential_type: "REFERENCE_ATTEST", evidence_url: "https://ev/2" }
              as: Member
              as_user_id: "${s}"
              captures: { c2: $.data.id }
            - call: "POST /credentials/${c2}/verify"
              payload: {}
              as: Member
              as_user_id: "${v2}"
          trigger:
            - call: "GET /members/${s}"
              payload: {}
              as: Member
              as_user_id: "${s}"
              captures: { tier: $.data.trust_tier, v_count: $.data.verified_credential_count }
          assert:
            - "Member.${s}.verified_credential_count == 2"
            - "Member.${s}.completed_exchange_count == 0"
            - "Member.${s}.trust_tier == BASIC"
            - "Because v=2 but c=0 (< TRUSTED_MIN_COMPLETED=5), TRUSTED branch fails; BASIC branch (v>=1) matches — this asserts the ORDER-of-evaluation of the pinned formula."

  # =====================================================================
  # RULE 3 — non_linear_state_machine (>= 2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exchange_delivered_disputed_delivered_cycle
        grounds:
          - state_machines.Exchange.DELIVERED_to_DISPUTED
          - state_machines.Exchange.DISPUTED_to_DELIVERED
          - state_machines.Dispute.OPEN_to_WITHDRAWN
        distinguishing_aspect: |
          Exchange transits DELIVERED -> DISPUTED via Dispute creation, then
          DISPUTED -> DELIVERED via Dispute WITHDRAW — a genuine A->B->A cycle
          on the Exchange entity (not merely a linear pipeline). After the
          cycle Exchange.status == DELIVERED (same as before the dispute)
          AND Exchange.settled_at_utc IS NULL (no drift).
        test_recipe:
          setup:
            - "Clock at 2026-03-02T12:00:00Z. Members M1 (requester) and M2 (provider). M1 seeded +240."
            - "Exchange e1 committed_minutes=60, scheduled_start_utc=2026-03-02T10:00:00Z, status=DELIVERED (M2 marked-delivered)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "cyc-m1@x.com", display_name: "CycM1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "cyc-m2@x.com", display_name: "CycM2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "GARDENING", title: "Gardening", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "GARDENING", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /disputes"
              payload: { exchange_id: "${e1}", raised_by_member_id: "${m1}", reason_code: "INCOMPLETE_SERVICE", claimed_delta_minutes: 15 }
              as: Member
              as_user_id: "${m1}"
              captures: { d1: $.data.id, exch_after_open: $.data.exchange_id }
          trigger:
            - call: "POST /disputes/${d1}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { disp_final: $.data.status }
            - call: "GET /exchanges/${e1}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { exch_final: $.data.status, exch_settled_at: $.data.settled_at_utc }
          assert:
            - "Exchange.${e1}.status transitions DELIVERED -> DISPUTED (on dispute create) -> DELIVERED (on withdraw)."
            - "Final Exchange.${e1}.status == DELIVERED"
            - "Final Dispute.${d1}.status == WITHDRAWN"
            - "Exchange.${e1}.settled_at_utc IS NULL"

      - name: credential_submitted_revision_submitted_cycle
        grounds:
          - state_machines.VerificationCredential.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.VerificationCredential.REVISION_REQUESTED_to_SUBMITTED
          - entities.VerificationCredential.fields.revision_round
        distinguishing_aspect: |
          VerificationCredential cycles SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED — a genuine A->B->A cycle on a DIFFERENT entity from Rule
          3 instance #1 (Exchange). revision_round increments on every
          resubmit; cap at 2. After one round-trip, credential.status ==
          SUBMITTED and credential.revision_round == 1.
        test_recipe:
          setup:
            - "Subject S submits credential c1 (verifier V1 already TRUSTED via priming)."
            - "V1 requests revision; S resubmits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "cred-s@x.com", display_name: "S", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { s: $.data.id }
            - call: "POST /members"
              payload: { email: "cred-v1@x.com", display_name: "V1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { v1: $.data.id }
            # NOTE: V1 primed to TRUSTED via longer chain (elided; unit-test-generator unrolls two anchor-tier verifications on V1 + five SETTLED exchanges as provider).
            - call: "POST /credentials"
              payload: { subject_member_id: "${s}", verifier_member_id: "${v1}", credential_type: "SKILL_ATTEST", skill_code: "GARDENING", evidence_url: "https://ev/1" }
              as: Member
              as_user_id: "${s}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /credentials/${c1}/request-revision"
              payload: {}
              as: Member
              as_user_id: "${v1}"
              captures: { after_rev: $.data.status }
            - call: "POST /credentials/${c1}/resubmit"
              payload: { evidence_url: "https://ev/2" }
              as: Member
              as_user_id: "${s}"
              captures: { after_resub: $.data.status, rev_round: $.data.revision_round }
          assert:
            - "VerificationCredential.${c1}.status transitions SUBMITTED -> REVISION_REQUESTED -> SUBMITTED"
            - "VerificationCredential.${c1}.revision_round == 1 after the round-trip"
            - "Distinct entity from Exchange (Rule 3 instance #1) — satisfies rule's different-entity clause."

  # =====================================================================
  # RULE 4 — transitive_cascade (>= 2 instances, different triggers, one >=3)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_cascade_depth_3
        grounds:
          - state_machines.GroupProject.PLANNING_to_CANCELLED
          - state_machines.ProjectShift.OPEN_to_CANCELLED
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /group-projects/{id}/cancel:
          (link 1) project.aggregate_state=CANCELLED CAUSES
          (link 2) each ProjectShift.status=CANCELLED CAUSES
          (link 3) each ShiftAssignment.status=CANCELLED. Each link is
          triggered by the PRIOR link (not a fan-out from the original
          request). Distinct from Rule 4 instance #2 which originates from
          POST /_clock/set_current_utc.
        test_recipe:
          setup:
