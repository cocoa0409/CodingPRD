      - name: oral_notification_on_an_incident_that_needs_none_is_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=14]
          - errors.ERR_INCIDENT_STATE_INVALID
          - state_machines.IncidentReport.OPEN_to_NOTIFIED
          - calculations.incident_notification_deadlines
        distinguishing_aspect: |
          The OPEN -> NOTIFIED edge is guarded by requires_oral_notification == true; with
          head_count 300 the mortality threshold is max(2, ceil(3.0)) == 3, so a 2-head loss
          needs no notification and the record-oral-notification call must be rejected, while
          close from OPEN is legal for exactly the same reason.
