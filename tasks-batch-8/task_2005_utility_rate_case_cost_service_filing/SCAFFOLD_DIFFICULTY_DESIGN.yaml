  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_lock_blocked_by_disputed_adjustment
        grounds:
          - state_machines.TestYearEntry.SUBMITTED_to_LOCKED
          - state_machines.Adjustment.VERIFIED_to_DISPUTED
          - errors[ERR_UNRESOLVED_ENTRY_ADJUSTMENTS]
        distinguishing_aspect: |
          Entity pair = TestYearEntry gated by Adjustment. The lock transition
          reads a DIFFERENT entity's state set: an Adjustment of this entry in
          DISPUTED blocks locking, while PROPOSED or VERIFIED adjustments do
          not (the canonical chains lock entries carrying a VERIFIED
          adjustment). The blocker is produced by another role's action
          (CommissionStaff dispute) and cleared by the proposer's withdraw —
          the entry itself is never edited.
        test_recipe:
          setup:
            - "Case DRAFT; E1 (O_AND_M 1,000,000,000) SUBMITTED; adjustment A1 +50,000,000 VERIFIED on E1"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
          trigger:
            - { call: "POST /api/v1/adjustments/${a1}/dispute", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/adjustments/${a1}/withdraw", payload: {}, as: UtilityFiler, as_user_id: "uf_alice" }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler, captures: { st_fin: $.data.status } }
          assert:
            - "After CommissionStaff disputes A1 (VERIFIED -> DISPUTED), locking the still-SUBMITTED entry is rejected: ${err} == ERR_UNRESOLVED_ENTRY_ADJUSTMENTS and the entry stays SUBMITTED"
            - "After the proposer withdraws the disputed A1 (DISPUTED -> WITHDRAWN): ${st_fin} == LOCKED (guard cleared by the other entity's transition)"
            - "TestYearEntry.${e1}.adjusted_amount_cents == 1000000000 after the withdraw (DISPUTED amount no longer counted)"

      - name: hearing_gate_blocked_by_overruled_then_overdue_request
        grounds:
          - state_machines.RateCase.DISCOVERY_to_HEARING
          - state_machines.DataRequest.RESPOND_REQUIRED_to_OVERDUE
          - errors[ERR_OVERDUE_DATA_REQUESTS_EXIST]
        distinguishing_aspect: |
          Entity pair = RateCase gated by DataRequest (different pair from
          TestYearEntry/Adjustment). The blocking OVERDUE state is reached
          through the objection path (ISSUED -> OBJECTED -> RESPOND_REQUIRED
          -> OVERDUE via the 5-day extended window), proving the case-level
          guard reads the swept child state regardless of which deadline arm
          produced it.
        test_recipe:
          setup:
            - "Canonical case in DISCOVERY; I1's DR objected and OVERRULED at default clock (extended_due_at 2026-08-06); clock advanced to 2026-08-07 so the request is OVERDUE"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "AAA Industrial Group", representative_name: "Rae Torres", contact_email: "rae@aaa.example" }, as: IntervenorRep, captures: { i1: $.data.id } }
            - { call: "POST /api/v1/data-requests", payload: { rate_case_id: "${rc}", subject: "Pension normalization", body: "Produce workpapers supporting adjustment A1", issuing_intervenor_id: "${i1}" }, as: IntervenorRep, as_user_id: "${i1}", captures: { dr1: $.data.id } }
            - { call: "POST /api/v1/data-requests/${dr1}/object", payload: { objection_reason: "Overly broad and unduly burdensome" }, as: UtilityFiler }
            - { call: "POST /api/v1/data-requests/${dr1}/rule", payload: { ruling: "OVERRULED" }, as: ALJ }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: CommissionStaff }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-hearing", payload: {}, as: ALJ, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/data-requests/${dr1}/respond", payload: { response_text: "Workpapers attached as Exhibit U-7" }, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-hearing", payload: {}, as: ALJ, captures: { final_st: $.data.status } }
          assert:
            - "${err} == ERR_OVERDUE_DATA_REQUESTS_EXIST (RateCase transition reads DataRequest.OVERDUE set)"
            - "After the late respond: ${final_st} == HEARING"

      - name: proposal_create_requires_settlement_phase
        grounds:
          - state_machines.SettlementProposal.DRAFT_to_UNDER_NEGOTIATION
          - errors[ERR_INVALID_CASE_STATE]
          - endpoints["POST /api/v1/settlement-proposals"]
        distinguishing_aspect: |
          Entity pair = SettlementProposal gated by RateCase (different from
          both pairs above). Creating a round while the case is in HEARING is
          rejected with ERR_INVALID_CASE_STATE; the identical payload succeeds
          after open-settlement-window flips the case to SETTLEMENT, and the
          success path bumps RateCase.version (observable via OCC on a third
          create).
        test_recipe:
          setup:
            - "Canonical case advanced to HEARING (not yet SETTLEMENT)"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-hearing", payload: {}, as: ALJ }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v: $.data.version } }
          trigger:
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1850000000, terms: "Black-box settlement", expected_rate_case_version: "${rc_v}" }, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/rate-cases/${rc}/open-settlement-window", payload: {}, as: ALJ }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v2: $.data.version } }
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1850000000, terms: "Black-box settlement", expected_rate_case_version: "${rc_v2}" }, as: UtilityFiler, captures: { sp1: $.data.id, sp1_st: $.data.status, sp1_round: $.data.round_number } }
          assert:
            - "While case is HEARING: ${err} == ERR_INVALID_CASE_STATE"
            - "After open-settlement-window: ${sp1_st} == DRAFT, ${sp1_round} == 1"
            - "RateCase version advanced between the two reads (${rc_v2} > ${rc_v}); the successful create consumed the fresh version"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tariff_windows_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_TARIFF_WINDOW_OVERLAP]
          - entities.TariffRate.fields.effective_start
          - entities.TariffRate.fields.effective_end
        distinguishing_aspect: |
          Resource = CustomerClass tariff timeline; interval semantics =
          HALF-OPEN [start, end). T1 [2027-01-01, 2028-01-01) and T2
          [2028-01-01, 2029-01-01) touch at 2028-01-01 with zero gap and BOTH
          are accepted (adjacency is not overlap under half-open semantics);
          T3 [2027-06-01, 2028-06-01) shares interior with T1 and is rejected.
          All three proposals individually pass the anti-subsidy floor (p7)
          so the temporal rule (p8) is the deciding check for T3.
