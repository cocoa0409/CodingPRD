  - section: calculations
    instances:
      - name: out_of_grade_band_standard_is_stored_but_excluded_from_coverage
        claim_type: input_set_filtering
        grounds:
          - calculations.correlation_coverage.input_set
          - calculations.correlation_coverage.formula
        distinguishing_aspect: |
          Citing TN.M.8.1, a real MATH framework code whose 8-8 band does not overlap the title's
          6-6 band, must store effective_weight 5.00 on the entry yet leave
          self_reported_coverage_pct at 70.00, because the 8th-grade weight enters neither the
          numerator nor the denominator.
        test_recipe:
          setup:
            - "State TN is OPEN_TERRITORY with min_verified_coverage_pct 50.00 and two MATH standards: TN.M.6.1 at grades 6-6 weight 4 and TN.M.8.1 at grades 8-8 weight 5"
            - "The DRAFT submission of a grades 6-6 title cites TN.M.6.1 at PRACTICE depth, so self_reported_coverage_pct is 70.00"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TN", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_tn_id: $.data.id }
            - call: "POST /state-profiles/${st_tn_id}/standards"
              payload: { subject: "MATH", standard_code: "TN.M.6.1", grade_low: 6, grade_high: 6, weight: 4 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tn_id}"
            - call: "POST /state-profiles/${st_tn_id}/standards"
              payload: { subject: "MATH", standard_code: "TN.M.8.1", grade_low: 8, grade_high: 8, weight: 5 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tn_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_tn_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tn_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000011301", subject: "MATH", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["RATIO_REASONING"], page_count: 320, signature_page_capacity: 384, list_price_cents: 9100 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TN.M.6.1", depth_level: "PRACTICE", page_reference: "pp. 20-52", evidence_citation: "Unit 2 gives sustained practice on the standard." }
              as: PublisherEditor
              captures: { ce_in_band_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TN.M.8.1", depth_level: "MASTERY", page_reference: "pp. 300-318", evidence_citation: "The stretch appendix develops the 8th-grade standard to mastery." }
              as: PublisherEditor
              captures: { ce_out_of_band_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CorrelationEntry.${ce_out_of_band_id}.effective_weight == 5.00"
            - "CorrelationEntry.${ce_in_band_id}.effective_weight == 2.80"
            - "Submission.${sub_id}.self_reported_coverage_pct == 70.00"
            - "Submission.${sub_id}.verified_coverage_pct == 0.00"
            - "GET /submissions/${sub_id}/correlations returns total_count 2"

      - name: sampling_status_walks_pending_partial_shipped_with_ledger
        claim_type: aggregation
        grounds:
          - calculations.sampling_fulfilment
          - endpoints[POST /submissions/{id}/sampling-shipments]
        distinguishing_aspect: |
          With sampling_copies_required 30, the running total steps PENDING -> PARTIAL at 10 units and
          -> SHIPPED at exactly 30 units (inclusive), while the title's on_hand_units falls 100 -> 70
          and sample_reserved_units rises 0 -> 30.
        test_recipe:
          setup:
            - "State KS is OPEN_TERRITORY, requires 30 sample copies and has min_verified_coverage_pct 50.00"
            - "Title KS-E-2 is ACTIVE with 100 print units on hand and a DRAFT submission whose sampling_status is PENDING"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "KS", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 30, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ks_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_ks_id}", subject: "ELA", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ks_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000011401", subject: "ELA", grade_low: 2, grade_high: 2, copyright_year: 2026, content_tags: ["PHONICS"], page_count: 260, signature_page_capacity: 384, list_price_cents: 8300 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles/${ttl_id}/inventory-adjustments"
              payload: { adjustment_type: "RECEIPT", units: 100, reason: "First print run." }
              as: PlatformAdmin
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/sampling-shipments"
              payload: { units: 10, carrier_ref: "KS-BOX-1" }
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/sampling-shipments"
              payload: { units: 20, carrier_ref: "KS-BOX-2" }
              as: PublisherEditor
          assert:
            - "after the first shipment: Submission.${sub_id}.sample_copies_shipped == 10 and Submission.${sub_id}.sampling_status == PARTIAL"
            - "after the second shipment: Submission.${sub_id}.sample_copies_shipped == 30 and Submission.${sub_id}.sampling_status == SHIPPED"
            - "Title.${ttl_id}.on_hand_units == 70"
            - "Title.${ttl_id}.sample_reserved_units == 30"
            - "Title.${ttl_id}.total_received_units == 100"

      - name: member_revote_supersedes_earlier_ballot_and_flips_outcome
        claim_type: projection
        grounds:
          - calculations.committee_tally.formula
          - endpoints[POST /presentation-slots/{id}/votes]
        distinguishing_aspect: |
          Four members vote RECOMMEND, RECOMMEND, RECOMMEND, REJECT (ratio would be 0.7500 and the
          outcome RECOMMEND), then member cm-1 recasts REJECT; the projection must count only the
          latest ballot per member, marking the first one superseded, yielding
          counted_vote_count 4, recommend_ratio 0.5000 and tally_outcome REJECT.
        test_recipe:
          setup:
            - "State ID is OPEN_TERRITORY with min_verified_coverage_pct 50.00 and one MATH standard ID.M.3.1 at weight 3"
            - "The submission is FILED and PRESENTED in a 14:00-14:30 slot on panel ID-A, whose member_count is 4 and quorum_required is 3"
            - "The clock stands at 2026-10-20T14:00:00Z and the panel is IN_SESSION"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "ID", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_id_id: $.data.id }
            - call: "POST /state-profiles/${st_id_id}/standards"
