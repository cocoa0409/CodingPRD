        distinguishing_aspect: |
          The denormalised counter on SpaceUnit must move in lockstep with the child's
          own space_days_committed, and it must accumulate across bookings: two bookings
          of 6 closed-interval days each on the same space leave the space at 12 while
          each booking keeps its own figure of 6.
        test_recipe:
          setup:
