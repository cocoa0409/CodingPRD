        captures:
          stale_err: $.data.error_id
      assert:
      - A's activation succeeded (Market.version now 2)
      - stale_err == ERR_STALE_MARKET_VERSION with http 412 (B's payment carried the pre-activation version 1)
      - resubmitting B's payment with expected_market_version 2 succeeds and ShareOrder.${oo2}.order_status == ACTIVE
