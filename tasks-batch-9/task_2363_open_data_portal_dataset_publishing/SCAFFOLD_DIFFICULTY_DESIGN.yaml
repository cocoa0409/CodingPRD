      - name: escrow_release_on_decommission_restores_credit_conservation
        grounds:
          - calculations.pipeline_credit_escrow
          - state_machines.PublicationPipeline.DRAFT_to_ARMED
          - state_machines.PublicationPipeline.ARMED_to_DECOMMISSIONED
          - entities.Department.fields.credits_escrowed_units
          - endpoints.GET /open-data/departments/{departmentId}/scorecard
        distinguishing_aspect: |
          The invariant credit_balance_units + credits_escrowed_units + credits_consumed_units ==
          credits_issued_units holds after arming (90 + 10 + 0 == 100) and after decommissioning
          (100 + 0 + 0 == 100): the compensating release returns the escrow to the exact bucket it came
          from, leaving credits_issued_units untouched and no residue in the pipeline row.
