# =============================================================================
# Task 1116: Hazmat Transportation Compliance & Placarding — §1.8
# Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids, 20 instances. All chains replay from empty DB using §1.5 only.
# Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: registration_fee_provisional_vs_final
        grounds:
          - calculations.registration_fee
          - entities.RegistrationInvoice.fields.provisional_total_cents
          - entities.RegistrationInvoice.fields.final_total_cents
        distinguishing_aspect: |
          Carrier/RegistrationInvoice domain: the provisional variant (declared
          fleet, no discount) yields 27500 while the final variant (verified
          fleet + safety discount at rating 100) yields 26250 for the SAME
          invoice — two valid algorithms, two different totals on one subject.
        test_recipe:
          setup:
            - "Carrier created (fleet 5 declared, FLAMMABLE_LIQUID only => security_plan_required false), registration submitted then approved with verified_fleet_size 5"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Acme Hazmat LLC", usdot_number: "USDOT-2001", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"], accepts_dangerous_placard_substitution: false }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
              captures: { inv_id: "$.data.id", inv_prov: "$.data.provisional_total_cents" }
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "GET /hazmat/carriers/${c_id}/registration-invoices"
              as: Regulator
              captures: { inv_final: "$.data[0].final_total_cents", inv_due: "$.data[0].total_due_cents", inv_prov2: "$.data[0].provisional_total_cents" }
          trigger:
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { c_out: "$.data.outstanding_balance_cents" }
          assert:
            - "captured inv_prov2 == 27500 (base 25000 + flat processing 2500; subtotal 25000 < 100000)"
            - "captured inv_final == 26250 (base 25000 - discount 1250 = subtotal 23750; flat processing 2500)"
            - "captured inv_due == 26250"
            - "inv_prov2 != inv_final (divergence 1250)"
            - "captured c_out == 26250"

      - name: incident_penalty_reported_vs_confirmed
        grounds:
          - calculations.incident_penalty
          - calculations.safety_rating_update
        distinguishing_aspect: |
          IncidentReport domain (different entity domain than the registration
          fee instance): reported variant at file-written yields 90000; the
          confirmed variant at close (CATASTROPHIC + 10% adjustment) yields
          209000 for the SAME incident.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE with fees paid; one DRAFT shipment exists"
            - "Incident occurred 2026-06-01T00:00:00Z reported MAJOR; phone report recorded at clock 2026-06-02T00:00:00Z (12h deadline missed); written filed at clock 2026-07-04T00:00:00Z (3 days past the 2026-07-01T00:00:00Z deadline)"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Bruin Carriers", usdot_number: "USDOT-2002", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3", "CLASS_8", "CLASS_5_1"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 100.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh_id}/incident-reports"
              payload: { occurred_at: "2026-06-01T00:00:00Z", severity: "MAJOR" }
              as: ShipperComplianceOfficer
              captures: { i_id: "$.data.id", i_pd: "$.data.phone_deadline", i_wd: "$.data.written_report_deadline", i_pr: "$.data.phone_report_required" }
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Regulator
            - call: "POST /hazmat/incident-reports/${i_id}/record-phone-report"
              payload: {}
              as: ShipperComplianceOfficer
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: Regulator
            - call: "POST /hazmat/incident-reports/${i_id}/file-written"
              payload: {}
              as: ShipperComplianceOfficer
              captures: { pen_reported: "$.data.penalty_cents", i_wl: "$.data.is_written_late", i_pl: "$.data.is_phone_late" }
          trigger:
            - call: "POST /hazmat/incident-reports/${i_id}/close"
              payload: { confirmed_severity: "CATASTROPHIC", adjustment_percent: 10 }
              as: Regulator
              captures: { pen_confirmed: "$.data.penalty_cents" }
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { c_rating: "$.data.safety_rating" }
          assert:
            - "captured i_pr == true and i_pd == '2026-06-01T12:00:00Z' and i_wd == '2026-07-01T00:00:00Z'"
            - "captured pen_reported == 90000 (50000 base + 25000 late phone + 5000*3 late written)"
            - "captured i_wl == true and i_pl == true"
            - "captured pen_confirmed == 209000 (round_half_up((150000+25000+15000)*1.10))"
            - "captured c_rating == 75 (100 - 25 CATASTROPHIC)"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_tiered_surcharge_late
        grounds:
          - calculations.registration_fee
        distinguishing_aspect: |
          Mode (a): tiered rate with >= 3 interacting inputs (fleet tier,
          security_plan_required surcharge, months_late) — an EXPLOSIVE carrier
          renewing 2 started months late on fleet 5 yields provisional 47500
          (25000 base + 12500 surcharge + 7500 late + 2500 flat processing).
        test_recipe:
          setup:
            - "Carrier with hazmat_categories [EXPLOSIVE] (security_plan_required true), fleet 5, approved 2026-05-01 then EXPIRED by clock advance to 2027-06-20 (2 started months past 2027-05-01 expiry)"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Pyro Haulers", usdot_number: "USDOT-2003", fleet_size_declared: 5, hazmat_categories: ["EXPLOSIVE"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 38750 }
              as: CarrierAdmin
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-20T00:00:00Z" }
              as: Regulator
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { c_v2: "$.data.version", c_status: "$.data.registration_status" }
          trigger:
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v2}" }
              as: CarrierAdmin
              captures: { inv_kind: "$.data.kind", inv_prov: "$.data.provisional_total_cents" }
          assert:
            - "captured c_status == 'EXPIRED' (clock sweep past 2027-05-01T00:00:00Z)"
            - "captured inv_kind == 'RENEWAL'"
            - "captured inv_prov == 47500 (base 25000 + surcharge 12500 + late round((25000+12500)*0.20)=7500 => subtotal 45000; flat processing 2500 since 45000 < 100000)"
            - "INITIAL registration math check: provisional was 40000 (37500 subtotal + 2500), final 38750 (discount 1250 => subtotal 36250 + 2500), so the 38750 payment zeroed the balance"

      - name: load_handling_fee_per_line_rounding
        grounds:
          - calculations.load_handling_fee
          - calculations.placard_determination
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned per-line-then-sum — three items
          at 333 cents each: per-line round_half_up(333*0.0625)=21 thrice = 63,
          plus one placard 725 => 788; the rejected sum-then-round reading gives
          round(999*0.0625)=62 + 725 = 787.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE, fees paid; material UN1993 (CLASS_3, TABLE_2); spec UN4G cap 500; three DOCUMENTED shipments each quantity 200.0 kg and declared_value_cents 333"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Cascade Chemical", usdot_number: "USDOT-2004", fleet_size_declared: 5, hazmat_categories: ["FLAMMABLE_LIQUID"] }
              as: CarrierAdmin
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 5 }
              as: Regulator
            - call: "POST /hazmat/carriers/${c_id}/payments"
              payload: { amount_cents: 26250 }
              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3", "CLASS_8", "CLASS_5_1"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/vehicles"
              payload: { plate_number: "PLT-2004", vehicle_class: "VAN" }
              as: CarrierAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /hazmat/routes"
              payload: { route_code: "R-2004", allowed_hazard_classes: ["CLASS_3"], is_restricted_corridor: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: Regulator
              captures: { r_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 200.0, declared_value_cents: 333 }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { sh1: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh1}/classify"
