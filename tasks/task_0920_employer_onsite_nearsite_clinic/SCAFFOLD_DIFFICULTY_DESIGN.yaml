          assert:
            - "The OCC_HEALTH disclosure returns disclosure_status FITNESS_RELEASED with fitness_conclusion == FIT_WITH_RESTRICTIONS and participation_recorded == true"
            - "The WELLNESS disclosure returns disclosure_status PARTICIPATION_RELEASED with fitness_conclusion == null and participation_recorded == true"
            - "Both disclosure bodies report clinical_detail_included == false and contain no clinical_note key"
            - "Visit.${visit_occ}.disclosure_status == FITNESS_RELEASED"
            - "Visit.${visit_well}.disclosure_status == PARTICIPATION_RELEASED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: roi_rounds_each_visit_type_category_before_summing
        grounds:
          - calculations.avoided_cost_and_roi
          - endpoints[GET /reporting-periods/{period_id}/utilization-report]
          - state_machines.ReportingPeriod.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Mode (b), nested rounding where the order matters: with one visit of each type the three
          category values round to 11490 + 9604 + 1351 = 22445 cents, while summing the raw products
          first (22445.91) and rounding once gives 22446 cents. The scaffold pins round-per-category-
          then-sum, so 22445 is the only correct answer.
        test_recipe:
          setup:
            - "Employer ROI Co with a PER_VISIT contract at per_visit_fee_cents 9500 and minimum_guarantee_cents 100000."
            - "One participant with exactly one COMPLETED visit of each visit_type on 2026-06-08, and the June 2026 period FINALIZED on 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "ROI Co", employer_code: "ROI", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 500000, tobacco_program_enabled: false }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /reporting-periods"
