# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3442_site_industrial_gas_plants_take_or_pay
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints.POST_/gas-supply/customers
        distinguishing_aspect: "A customer created with only name and segment returns 201 with credit_standing STANDARD, blackout_windows [], version 1, and server-minted id/created_at/updated_at — no client-supplied system fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_cust_fab
              call: "POST /gas-supply/customers"
              payload: { name: "Fabrikam Chips", segment: "ELECTRONICS" }
              as: PlatformAdmin
              captures: { c_fab: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Customer.${c_fab}.credit_standing == STANDARD (default applied)"
            - "Customer.${c_fab}.blackout_windows == [] (default applied)"
            - "Customer.${c_fab}.version == 1 and id / created_at / updated_at are non-null"

      - name: customer_get_roundtrips_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.Customer
          - endpoints.GET_/gas-supply/customers/{customerId}
        distinguishing_aspect: "Every stored field, including a two-window blackout_windows array, round-trips through GET unchanged."
        test_recipe:
          setup:
            - "Logical clock set. Customer with two blackout windows exists."
          setup_api_calls:
            - *k_clock
            - call: "POST /gas-supply/customers"
              payload: { name: "Fabrikam Chips", segment: "ELECTRONICS", credit_standing: "PRIME", blackout_windows: [{ start_iso: "2027-03-10T00:00:00Z", end_iso: "2027-03-20T00:00:00Z" }, { start_iso: "2027-09-01T00:00:00Z", end_iso: "2027-09-05T00:00:00Z" }] }
              as: PlatformAdmin
              captures: { c_rt: $.data.id }
          trigger:
            - call: "GET /gas-supply/customers/${c_rt}"
              payload: {}
              as: SupplyPlanner
          assert:
            - "Customer.${c_rt}.name == \"Fabrikam Chips\" and segment == ELECTRONICS and credit_standing == PRIME"
            - "Customer.${c_rt}.blackout_windows has exactly 2 entries, first start_iso == \"2027-03-10T00:00:00Z\""

      - name: customer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_CUSTOMER_NOT_FOUND, not a 500 or null envelope."
        test_recipe:
          setup:
            - "Logical clock set. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /gas-supply/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and ${err_nf} == ERR_CUSTOMER_NOT_FOUND"

      - name: evaluation_missing_customer_id_returns_400
        claim_type: Required Fields
        grounds:
          - entities.SupplyModeEvaluation.fields.customer_id
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required customer_id from an otherwise valid evaluation body is rejected with 400 ERR_VALIDATION before any recommendation is computed."
        test_recipe:
          setup:
            - "Logical clock set. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { site_label: "FAB-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 7000, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { err_rq: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_rq} == ERR_VALIDATION"

      - name: evaluation_peak_below_average_rejected
        claim_type: Type Constraints
        grounds:
          - entities.SupplyModeEvaluation.fields.demand_peak_nm3h
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "demand_peak_nm3h 4000 with demand_avg_nm3h 5000 violates peak >= avg and is rejected with 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Logical clock set. Customer Fabrikam exists."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 4000, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { err_pv: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_pv} == ERR_VALIDATION"

      - name: telemetry_reading_is_immutable_append_only
        claim_type: Immutability
        grounds:
          - entities.TelemetryReading
        distinguishing_aspect: "TelemetryReading (common_fields: false) carries id and created_at but no updated_at or version, and no update/delete endpoint exists for it; the list is strictly chronological."
        test_recipe:
          setup:
            - "Customer Fabrikam; tank T_IM capacity 50,000, reorder 20,000, safety 5,000; two readings posted in order."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - &k_tank_std
              call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.999, max_impurity_ppm: 10 }
              as: PlantOperator
              captures: { t_std: $.data.id }
            - &k_rd1
              call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 25000 }
              as: TelemetryGateway
            - &k_rd2
              call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
          trigger:
            - call: "GET /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: {}
              as: TelemetryGateway
          assert:
            - "the list has 2 readings in measured_at order: 2026-10-01T00:00:00Z then 2026-10-01T05:00:00Z"
            - "each reading has id and created_at but no version and no updated_at field"
            - "readings echo level_liters 25000 and 20000"

      - name: contract_computed_end_date_and_defaults
        claim_type: Computed Fields
        grounds:
          - entities.SupplyContract.fields.end_date
          - entities.SupplyContract.fields.makeup_credit_balance_cents
        distinguishing_aspect: "end_date is computed as start_date + term_months (2026-10-01 + 120 = 2036-10-01), makeup_credit_cap_pct defaults to 0.10, makeup_credit_balance_cents initializes to 0, and mode/product/site_label are copied from the evaluation."
        test_recipe:
          setup:
            - "Customer Fabrikam with ACCEPTED ONSITE_PLANT evaluation."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - &k_eval_fab
              call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", demand_avg_nm3h: 5000, demand_peak_nm3h: 7000, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_fab: $.data.id }
            - &k_accept_fab
              call: "POST /gas-supply/supply-mode-evaluations/${e_fab}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
          trigger:
            - &k_contract_fab
              call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_fab: $.data.id }
          assert:
            - "SupplyContract.${k_fab}.end_date == \"2036-10-01\""
            - "SupplyContract.${k_fab}.mode == ONSITE_PLANT and product == N2 and site_label == \"FAB-1\" (copied, not input)"
            - "SupplyContract.${k_fab}.makeup_credit_cap_pct == 0.10 and makeup_credit_balance_cents == 0 and failover_active == false"
            - "SupplyContract.${k_fab}.status == DRAFT and version == 1"

      - name: contracts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/gas-supply/supply-contracts
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three contracts on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Customer Fabrikam; one ACCEPTED evaluation; three contracts created against it (each create references the same evaluation while it stays ACCEPTED)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab}", term_months: 60, start_date: "2027-01-01", min_monthly_volume_nm3: 2100000, unit_price_cents_per_nm3: 13, monthly_facility_fee_cents: 510000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab}", term_months: 180, start_date: "2027-06-01", min_monthly_volume_nm3: 2200000, unit_price_cents_per_nm3: 14, monthly_facility_fee_cents: 520000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
          trigger:
            - call: "GET /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", limit: 2, offset: 0 }
              as: SupplyPlanner
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "a second call with limit=2, offset=2 returns 1 row with total_count == 3 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: evaluation_accept_supersedes_evaluated_sibling
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SupplyModeEvaluation.EVALUATED_to_ACCEPTED
          - state_machines.SupplyModeEvaluation.EVALUATED_to_SUPERSEDED
        distinguishing_aspect: "Creating a second evaluation for the same (customer, site) supersedes the first while still EVALUATED; accepting the second then succeeds and the first stays SUPERSEDED."
        test_recipe:
          setup:
            - "Customer Fabrikam; evaluation E1 created (EVALUATED)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", demand_avg_nm3h: 5200, demand_peak_nm3h: 7200, required_purity_percent: 99.999, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_fab2: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_fab2}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
          assert:
            - "SupplyModeEvaluation.${e_fab2}.status == ACCEPTED"
            - "SupplyModeEvaluation.${e_fab}.status == SUPERSEDED (observed via GET /gas-supply/customers/${c_fab}/supply-mode-evaluations)"
            - "a newly created evaluation starts in EVALUATED (initial state)"

      - name: evaluation_accept_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SupplyModeEvaluation.EVALUATED_to_ACCEPTED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Accepting an already-ACCEPTED evaluation is rejected 409 ERR_INVALID_STATE_TRANSITION; acceptance is not idempotent."
        test_recipe:
          setup:
            - "Customer Fabrikam; evaluation accepted once."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations/${e_fab}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
              captures: { err_aa: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_aa} == ERR_INVALID_STATE_TRANSITION"
            - "SupplyModeEvaluation.${e_fab}.status remains ACCEPTED"

      - name: contract_terminate_full_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_TERMINATED
        distinguishing_aspect: "One terminate call fans out per §1.2: plant DECOMMISSIONED, AGREED turnaround CANCELLED, ACTIVE BACKUP connection RELEASED (network reservation refunded), SCHEDULED delivery CANCELLED — all in the same request."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; P_FAB OPERATING; AGREED turnaround; BACKUP connection 4,000 on N_MAIN 10,000; tank with SCHEDULED TELEMETRY delivery."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - &k_activate_fab
              call: "POST /gas-supply/supply-contracts/${k_fab}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { kfab_v0: $.data.version }
            - &k_plant_fab
              call: "POST /gas-supply/onsite-plants"
              payload: { contract_id: "${k_fab}", name: "FAB-1 ASU", nameplate_capacity_nm3h: 6000, capital_cost_cents: 120000000, power_kwh_per_nm3: 0.42 }
              as: PlantOperator
              captures: { p_fab: $.data.id }
            - &k_adv1
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
            - &k_adv2
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
            - &k_adv3
              call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
            - &k_network
              call: "POST /gas-supply/pipeline-networks"
              payload: { name: "Gulf Coast N2", nameplate_capacity_nm3h: 10000 }
              as: PlatformAdmin
              captures: { n_main: $.data.id }
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 4000, purpose: "BACKUP" }
              as: PipelineDispatcher
              captures: { cn_tc: $.data.id }
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_tc: "$.data[0].id" }
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", scope: "TA cascade check" }
              as: PlantOperator
              captures: { ta_tc: $.data.id, ta_tc_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_tc}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_tc_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/terminate"
              payload: {}
              as: SupplyPlanner
          assert:
            - "SupplyContract.${k_fab}.status == TERMINATED"
            - "OnsitePlant.${p_fab}.status == DECOMMISSIONED and effective_capacity_nm3h == 0"
            - "Turnaround.${ta_tc}.status == CANCELLED"
            - "PipelineConnection.${cn_tc}.status == RELEASED and PipelineNetwork.${n_main}.reserved_capacity_nm3h == 0 and available_capacity_nm3h == 10000"
            - "Delivery.${d_tc}.transport_status == CANCELLED"

      - name: contract_expires_after_unrenewed_window
        claim_type: Valid Transition
        grounds:
          - state_machines.SupplyContract.RENEWAL_OPEN_to_EXPIRED
        distinguishing_aspect: "The clock sweep at 2036-10-02 (past end_date 2036-10-01 with no renewal) moves RENEWAL_OPEN to EXPIRED, a terminal state."
        test_recipe:
          setup:
            - "K_FAB ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2036-07-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2036-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /gas-supply/supply-contracts/${k_fab}"
              payload: {}
              as: SupplyPlanner
              captures: { k_exp: $.data.status }
          assert:
            - "SupplyContract.${k_fab}.status == EXPIRED"
            - "a subsequent terminate attempt is rejected 409 ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: plant_advance_ladder_then_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.OnsitePlant
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Three advances walk PROPOSED -> UNDER_CONSTRUCTION -> COMMISSIONING -> OPERATING; a fourth advance on OPERATING is rejected 409."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; P_FAB created (PROPOSED)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_plant_fab
          trigger:
            - *k_adv1
            - *k_adv2
            - call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
              captures: { p_op: $.data.status, p_cap: $.data.effective_capacity_nm3h }
            - call: "POST /gas-supply/onsite-plants/${p_fab}/advance"
              payload: {}
              as: PlantOperator
              captures: { err_adv: $.data.error_id }
          assert:
            - "after 3 advances: status == OPERATING and effective_capacity_nm3h == 6000"
            - "4th advance: 409 ${err_adv} == ERR_INVALID_STATE_TRANSITION and status stays OPERATING"

      - name: connection_release_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PipelineConnection.ACTIVE_to_RELEASED
        distinguishing_aspect: "Releasing an already-RELEASED connection is rejected 409 and does not double-refund network capacity."
        test_recipe:
          setup:
            - "N_MAIN 10,000; K_FAB ACTIVE; BACKUP connection 4,000 released once (reserved back to 0)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_network
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 4000, purpose: "BACKUP" }
              as: PipelineDispatcher
              captures: { cn_rr: $.data.id }
            - call: "POST /gas-supply/pipeline-connections/${cn_rr}/release"
              payload: {}
              as: PipelineDispatcher
          trigger:
            - call: "POST /gas-supply/pipeline-connections/${cn_rr}/release"
              payload: {}
              as: PipelineDispatcher
              captures: { err_rr: $.data.error_id }
          assert:
            - "second release: 409 ${err_rr} == ERR_INVALID_STATE_TRANSITION"
            - "PipelineNetwork.${n_main}.reserved_capacity_nm3h == 0 (no double refund)"

      - name: tank_critical_posture_then_recovery
        claim_type: Valid Transition
        grounds:
          - state_machines.StorageTank
        distinguishing_aspect: "Level at exactly safety_stock 5,000 yields CRITICAL (<= semantics); a later reading back above reorder_point 20,000 returns the posture to NORMAL."
        test_recipe:
          setup:
            - "Tank T_CR capacity 50,000, reorder 20,000, safety 5,000; readings 25,000 then 20,000 (REORDER_DUE, delivery created)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T09:00:00Z", level_liters: 5000 }
              as: TelemetryGateway
              captures: { st_crit: $.data.status }
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-02T00:00:00Z", level_liters: 45000 }
              as: TelemetryGateway
              captures: { st_norm: $.data.status }
          assert:
            - "at exactly 5000: status == CRITICAL (<= safety_stock triggers)"
            - "after refill to 45000: status == NORMAL (CRITICAL -> NORMAL recovery)"
            - "exactly 1 TELEMETRY delivery exists for the tank (open-delivery suppression held during the CRITICAL entry)"

      - name: telemetry_out_of_order_reading_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=6]
          - errors[ERR_READING_OUT_OF_ORDER]
        distinguishing_aspect: "A reading whose measured_at equals the latest reading's timestamp (not strictly later) is rejected 422 ERR_READING_OUT_OF_ORDER; the tank level is unchanged."
        test_recipe:
          setup:
            - "Tank with one reading at 2026-10-01T00:00:00Z level 25,000."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 24000 }
              as: TelemetryGateway
              captures: { err_oo: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_oo} == ERR_READING_OUT_OF_ORDER (equal timestamps fail strict ordering)"
            - "StorageTank.${t_std}.current_level_liters remains 25000"

      - name: delivery_completed_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Delivery
        distinguishing_aspect: "After COMPLETED/CERTIFIED, a second confirm-delivery is rejected 409 ERR_INVALID_STATE_TRANSITION; the recorded quantity is unchanged."
        test_recipe:
          setup:
            - "Tank-triggered delivery confirmed 30,000 and certified CERTIFIED (analyst qa-1, certifier qc-9)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_lk: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_lk}/confirm-delivery"
