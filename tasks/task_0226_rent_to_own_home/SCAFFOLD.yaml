# =============================================================================
# Rent-to-Own / Lease-Purchase Home — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: "Rent-to-Own / Lease-Purchase Home: option fee & rent-credit accrual, lease + purchase-option term, payment split (rent/credit), maintenance responsibility, option exercise/expiration, purchase-price lock, default/forfeiture, conversion to mortgage"

domain_name: rent-to-own-home
api_prefix: /

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Agreement is the central contract; Property/Tenant/Landlord are peers referenced
  # by FK; RentPayment / MaintenanceTicket / OptionExercise / Mortgage are children
  # of Agreement linked by FK (no deep URL nesting beyond one parent collection).

  state_machine_shape: branching
  # Agreement: ACTIVE forks into {EXERCISED → CONVERTED} or {DEFAULTED, EXPIRED}
  # with divergent forfeiture/credit side-effect sets per branch.
  # RentPayment carries a revert loop (LATE → PAID via cure).

  relationship_patterns:
    - one_to_many        # Agreement has many RentPayment / MaintenanceTicket
    - cross_aggregate    # Agreement references Property, Tenant, Landlord
    - self_referential   # RentPayment.supersedes_payment_id (re-bill of a cured period)

  role_model: peer_roles
  # Landlord owns Property + Agreement issuance + maintenance disposition;
  # Tenant owns payments + option exercise; EscrowAgent finalizes conversion.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Landlord / seller legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Landlord" }
      - { name: payout_account_ref, type: string, source: input, description: "Opaque external payout reference" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Tenant / buyer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Tenant" }
      - { name: credit_score, type: integer, source: input, description: "FICO-style score 300-850; gates mortgage conversion eligibility (MIN_CONVERSION_SCORE = 620)", constraints: "300 <= credit_score <= 850" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: landlord_id, type: string, source: input, description: "FK -> Landlord.id; the owner offering this home" }
      - { name: address, type: string, source: input, description: "Street address; unique among Property" }
      - { name: list_price_cents, type: integer, source: input, description: "Owner asking price in integer cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | UNDER_AGREEMENT | SOLD — lifecycle gate for new agreements", default: "AVAILABLE", constraints: "AVAILABLE|UNDER_AGREEMENT|SOLD" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; subject home" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; buyer-in-waiting" }
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; copied from Property.landlord_id at creation" }
      - { name: locked_price_cents, type: integer, source: input, description: "Purchase price locked for the option term, in cents", constraints: "> 0" }
      - { name: option_fee_cents, type: integer, source: input, description: "Up-front non-refundable option fee in cents", constraints: ">= 0" }
      - { name: option_fee_creditable, type: boolean, source: input, description: "Whether option_fee credits toward purchase at exercise", default: true }
      - { name: monthly_payment_cents, type: integer, source: input, description: "Total monthly amount the tenant pays (rent + credit)", constraints: "> 0" }
      - { name: credit_pct, type: number, source: input, description: "Fraction of each monthly payment that accrues as purchase credit (0..1)", constraints: "0 <= credit_pct <= 1" }
      - { name: max_credit_pct, type: number, source: input, description: "Cap on total applied credit as a fraction of locked_price_cents (0..1)", default: 0.20, constraints: "0 < max_credit_pct <= 1" }
      - { name: grace_days, type: integer, source: input, description: "Days after due_date within which a payment still earns credit", default: 5, constraints: ">= 0" }
      - { name: maintenance_threshold_cents, type: integer, source: input, description: "Per-ticket cost split point: tenant bears up to this, landlord bears the excess", default: 50000, constraints: ">= 0" }
      - { name: lease_start, type: datetime, source: input, description: "ISO8601 UTC lease commencement (option clock anchor)" }
      - { name: option_term_months, type: integer, source: input, description: "Months the purchase option remains exercisable from lease_start", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXERCISED | CONVERTED | DEFAULTED | EXPIRED", default: "DRAFT", constraints: "DRAFT|ACTIVE|EXERCISED|CONVERTED|DEFAULTED|EXPIRED" }
      - { name: missed_payment_count, type: integer, source: computed, description: "Count of child RentPayment rows in FORFEITED status (drives default; MAX_MISSED_PAYMENTS = 3)", default: 0 }
      - { name: gross_credit_accrued_cents, type: integer, source: computed, description: "Provisional credit: sum of credit_portion_cents over RentPayment rows in {PENDING, PAID, LATE} (forfeited excluded)" }
      - { name: available_credit_cents, type: integer, source: computed, description: "Final credit: sum of credit_portion_cents over RentPayment rows in PAID only (LATE/FORFEITED earn nothing)" }
      - { name: option_deadline, type: datetime, source: computed, description: "lease_start + option_term_months; exercise after this is rejected" }

  - name: RentPayment
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the contract this payment belongs to" }
      - { name: period_index, type: integer, source: input, description: "1-based month index within the lease; unique per (agreement_id, period_index) among non-superseded rows", constraints: ">= 1" }
      - { name: due_date, type: datetime, source: input, description: "ISO8601 UTC date this period's payment is due" }
      - { name: amount_cents, type: integer, source: system, description: "Copied from Agreement.monthly_payment_cents at creation", constraints: "> 0" }
      - { name: paid_at, type: datetime, source: input, description: "ISO8601 UTC timestamp the tenant remits; set on record-payment", required: false }
      - { name: rent_portion_cents, type: integer, source: computed, description: "amount_cents - credit_portion_cents" }
      - { name: credit_portion_cents, type: integer, source: computed, description: "round_half_up(amount_cents * Agreement.credit_pct); the credit this period earns when PAID on time" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee assessed when paid_at is past due_date by more than grace_days", default: 0 }
      - { name: supersedes_payment_id, type: string, source: input, description: "FK -> RentPayment.id; set when this row re-bills a cured/forfeited period", required: false }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | LATE | FORFEITED — PAID=on-time credit earned; LATE=paid within grace stretch but credit still pending cure; FORFEITED=missed past grace, credit lost", default: "PENDING", constraints: "PENDING|PAID|LATE|FORFEITED" }

  - name: MaintenanceTicket
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the contract this ticket is filed under" }
      - { name: summary, type: string, source: input, description: "Short description of the maintenance issue" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Initial estimated repair cost in cents", constraints: ">= 0" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Final repair cost in cents, supplied at resolution", required: false, constraints: ">= 0" }
      - { name: tenant_share_cents, type: integer, source: computed, description: "min(cost, Agreement.maintenance_threshold_cents) — tenant's portion" }
      - { name: landlord_share_cents, type: integer, source: computed, description: "max(0, cost - Agreement.maintenance_threshold_cents) — landlord's portion" }
      - { name: status, type: enum, source: system, description: "OPEN | APPROVED | RESOLVED | REJECTED", default: "OPEN", constraints: "OPEN|APPROVED|RESOLVED|REJECTED" }

  - name: OptionExercise
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the contract whose option is being exercised" }
      - { name: exercised_at, type: datetime, source: input, description: "ISO8601 UTC timestamp the tenant exercises; must be <= Agreement.option_deadline" }
      - { name: locked_price_snapshot_cents, type: integer, source: system, description: "Copy of Agreement.locked_price_cents at exercise time" }
      - { name: max_credit_cap_cents, type: integer, source: computed, description: "round_half_up(locked_price_snapshot_cents * Agreement.max_credit_pct)" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(Agreement.available_credit_cents, max_credit_cap_cents)" }
      - { name: option_fee_credit_cents, type: integer, source: computed, description: "Agreement.option_fee_cents when option_fee_creditable else 0" }
      - { name: net_due_at_closing_cents, type: integer, source: computed, description: "locked_price_snapshot_cents - credit_applied_cents - option_fee_credit_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | VOIDED", default: "PENDING", constraints: "PENDING|SETTLED|VOIDED" }

  - name: Mortgage
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the converted contract" }
      - { name: option_exercise_id, type: string, source: input, description: "FK -> OptionExercise.id; the SETTLED exercise this mortgage closes" }
      - { name: principal_cents, type: integer, source: system, description: "Copied from OptionExercise.net_due_at_closing_cents at conversion" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Annual interest rate in basis points (100 bps = 1%)", constraints: ">= 0" }
      - { name: term_months, type: integer, source: input, description: "Mortgage amortization term in months", constraints: ">= 1" }
      - { name: monthly_installment_cents, type: integer, source: computed, description: "Amortized monthly payment from principal, annual_rate_bps, term_months" }
      - { name: status, type: enum, source: system, description: "ACTIVE — created in ACTIVE on conversion", default: "ACTIVE", constraints: "ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: AVAILABLE
    terminal_states: [SOLD]
    transitions:
      - from: AVAILABLE
        to: UNDER_AGREEMENT
        trigger: "POST /agreements/{id}/activate (cascade from Agreement activation)"
        actor: Landlord
        preconditions: ["Property.status == AVAILABLE"]
        side_effects: ["Property.status = UNDER_AGREEMENT", "increments Property.version by 1"]
      - from: UNDER_AGREEMENT
        to: AVAILABLE
        trigger: "system (cascade from Agreement DEFAULTED or EXPIRED)"
        actor: system
        preconditions: ["Owning Agreement transitioned to DEFAULTED or EXPIRED"]
        side_effects: ["Property.status = AVAILABLE", "increments Property.version by 1"]
      - from: UNDER_AGREEMENT
        to: SOLD
        trigger: "system (cascade from Mortgage conversion / Agreement CONVERTED)"
        actor: system
        preconditions: ["Owning Agreement transitioned to CONVERTED"]
        side_effects: ["Property.status = SOLD", "increments Property.version by 1"]

  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [CONVERTED, DEFAULTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: Landlord
        preconditions:
          - "Agreement.status == DRAFT"
          - "Property.status == AVAILABLE (ERR_PROPERTY_NOT_AVAILABLE)"
          - "expected_property_version matches Property.version (ERR_STALE_VERSION)"
        side_effects:
          - "Agreement.status = ACTIVE"
          - "option_deadline computed = lease_start + option_term_months"
          - "CASCADE: Property.status AVAILABLE -> UNDER_AGREEMENT (which itself bumps Property.version)"
          - "increments Agreement.version by 1"
      - from: ACTIVE
        to: EXERCISED
        trigger: "POST /agreements/{id}/option-exercises (creates OptionExercise then settles)"
        actor: Tenant
        preconditions:
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "exercised_at <= option_deadline (ERR_OPTION_EXPIRED)"
          - "missed_payment_count == 0 (ERR_OPTION_BLOCKED_BY_DEFAULT)"
        side_effects:
          - "Agreement.status = ACTIVE -> EXERCISED"
          - "OptionExercise created in PENDING then SETTLED with credit_applied / net_due_at_closing computed"
          - "available_credit_cents frozen into OptionExercise.credit_applied_cents"
          - "increments Agreement.version by 1"
      - from: EXERCISED
        to: CONVERTED
        trigger: "POST /agreements/{id}/mortgage"
        actor: EscrowAgent
        preconditions:
          - "Agreement.status == EXERCISED (ERR_AGREEMENT_NOT_EXERCISED)"
          - "A SETTLED OptionExercise exists for this Agreement"
          - "Tenant.credit_score >= MIN_CONVERSION_SCORE (ERR_CREDIT_SCORE_TOO_LOW)"
        side_effects:
          - "Mortgage created in ACTIVE with principal = OptionExercise.net_due_at_closing_cents"
          - "Agreement.status = EXERCISED -> CONVERTED"
          - "CASCADE: Property.status UNDER_AGREEMENT -> SOLD (which itself bumps Property.version)"
          - "increments Agreement.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /agreements/{id}/default (manual) OR system on missed_payment_count >= MAX_MISSED_PAYMENTS"
        actor: Landlord
        preconditions:
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "missed_payment_count >= MAX_MISSED_PAYMENTS for manual default (ERR_DEFAULT_THRESHOLD_NOT_MET)"
        side_effects:
          - "Agreement.status = ACTIVE -> DEFAULTED"
          - "All non-terminal RentPayment rows (PENDING/LATE) -> FORFEITED (credit lost)"
          - "available_credit_cents recomputed to 0 (all earned credit forfeited on default)"
          - "CASCADE: Property.status UNDER_AGREEMENT -> AVAILABLE (which itself bumps Property.version)"
          - "increments Agreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /agreements/{id}/expire (now > option_deadline and not exercised)"
        actor: Landlord
        preconditions:
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "current clock > option_deadline (ERR_OPTION_NOT_YET_EXPIRED)"
        side_effects:
          - "Agreement.status = ACTIVE -> EXPIRED"
          - "All non-terminal RentPayment rows (PENDING/LATE) -> FORFEITED"
          - "CASCADE: Property.status UNDER_AGREEMENT -> AVAILABLE (which itself bumps Property.version)"
          - "increments Agreement.version by 1"

  - entity: RentPayment
    initial_state: PENDING
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /rent-payments/{id}/record (paid_at within due_date + grace_days)"
        actor: Tenant
        preconditions:
          - "RentPayment.status == PENDING (ERR_PAYMENT_NOT_PENDING)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "paid_at <= due_date + grace_days"
        side_effects:
          - "RentPayment.status = PAID; credit_portion_cents earned"
          - "Agreement.available_credit_cents += credit_portion_cents"
          - "Agreement.gross_credit_accrued_cents unchanged (already counted while PENDING)"
          - "increments RentPayment.version by 1"
      - from: PENDING
        to: LATE
        trigger: "POST /rent-payments/{id}/record (paid_at after due_date + grace_days, within cure window)"
        actor: Tenant
        preconditions:
          - "RentPayment.status == PENDING (ERR_PAYMENT_NOT_PENDING)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "paid_at > due_date + grace_days"
        side_effects:
          - "RentPayment.status = LATE; late_fee_cents assessed; credit_portion NOT yet earned"
          - "Agreement.available_credit_cents unchanged (LATE earns no final credit)"
          - "increments RentPayment.version by 1"
      - from: LATE
        to: PAID
        trigger: "POST /rent-payments/{id}/cure"
        actor: Landlord
        preconditions:
          - "RentPayment.status == LATE (ERR_PAYMENT_NOT_LATE)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "RentPayment.status = LATE -> PAID; credit_portion_cents now earned"
          - "Agreement.available_credit_cents += credit_portion_cents (compensates the LATE->PAID cure)"
          - "increments RentPayment.version by 1"
      - from: PENDING
        to: FORFEITED
        trigger: "POST /rent-payments/{id}/forfeit (period missed past cure)"
        actor: Landlord
        preconditions:
          - "RentPayment.status == PENDING (ERR_PAYMENT_NOT_PENDING)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "RentPayment.status = FORFEITED; credit_portion lost"
          - "Agreement.missed_payment_count += 1"
          - "Agreement.gross_credit_accrued_cents -= credit_portion_cents (forfeited row leaves the provisional pool)"
          - "increments RentPayment.version by 1"
      - from: LATE
        to: FORFEITED
        trigger: "POST /rent-payments/{id}/forfeit (cure window lapsed)"
        actor: Landlord
        preconditions:
          - "RentPayment.status == LATE (ERR_PAYMENT_NOT_LATE)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "RentPayment.status = FORFEITED; credit_portion lost"
          - "Agreement.missed_payment_count += 1"
          - "Agreement.gross_credit_accrued_cents -= credit_portion_cents"
          - "increments RentPayment.version by 1"

  - entity: MaintenanceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /maintenance-tickets/{id}/approve"
        actor: Landlord
        preconditions:
          - "MaintenanceTicket.status == OPEN (ERR_TICKET_NOT_OPEN)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "MaintenanceTicket.status = APPROVED"
          - "tenant_share/landlord_share computed on estimated_cost_cents (estimate variant)"
          - "increments MaintenanceTicket.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /maintenance-tickets/{id}/reject"
        actor: Landlord
        preconditions: ["MaintenanceTicket.status == OPEN (ERR_TICKET_NOT_OPEN)"]
        side_effects: ["MaintenanceTicket.status = REJECTED", "increments MaintenanceTicket.version by 1"]
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /maintenance-tickets/{id}/resolve (supplies actual_cost_cents)"
        actor: Landlord
        preconditions: ["MaintenanceTicket.status == APPROVED (ERR_TICKET_NOT_APPROVED)"]
        side_effects:
          - "MaintenanceTicket.status = RESOLVED"
          - "tenant_share/landlord_share recomputed on actual_cost_cents (actual variant) — overrides estimate split"
          - "increments MaintenanceTicket.version by 1"

  - entity: OptionExercise
    initial_state: PENDING
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system (within POST /agreements/{id}/option-exercises, immediately after PENDING create)"
        actor: system
        preconditions: ["OptionExercise.status == PENDING"]
        side_effects:
          - "credit_applied_cents / option_fee_credit_cents / net_due_at_closing_cents computed and frozen"
          - "OptionExercise.status = SETTLED"
          - "increments OptionExercise.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system (cascade when owning Agreement is DEFAULTED before settlement)"
        actor: system
        preconditions: ["Owning Agreement transitioned to DEFAULTED while OptionExercise PENDING"]
        side_effects: ["OptionExercise.status = VOIDED", "increments OptionExercise.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: activate-stale-property
    parent_entity: Property
    write_endpoint: "POST /agreements/{id}/activate"
    occ_field: "expected_property_version"
    description: |
      Activating an Agreement flips its Property AVAILABLE -> UNDER_AGREEMENT.
      If the Property's version has advanced since the activating client last
      observed it (another Agreement on the same Property was already activated
      and legitimately took the property under agreement), the activation is
      rejected as operating on a stale view of the Property.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payment_split
    trigger: "RentPayment creation (POST /agreements/{id}/rent-payments) and any status change"
    algorithm: aggregation
    formula: |
      credit_portion_cents = round_half_up(amount_cents * Agreement.credit_pct)
      rent_portion_cents   = amount_cents - credit_portion_cents
      # Rounding order is pinned: round PER PAYMENT first (each period independently),
      # THEN sum the already-rounded per-period credit_portion_cents into accruals.
      # We NEVER sum raw amount*pct across periods and round once at the end.
    input_set: "Single RentPayment row; amount_cents copied from Agreement.monthly_payment_cents"
    constants: {}
    precision: "integer cents, round_half_up at the per-payment step"

  - name: rent_credit_accrual
    trigger: "RentPayment record/cure/forfeit transitions; read on GET /agreements/{id}"
    algorithm: aggregation
    formula: |
      # Per-payment credit_portion_cents are ALREADY rounded by payment_split.
      # Accrual sums the rounded per-period values (round-then-sum order pinned).
      gross_credit_accrued_cents = SUM(credit_portion_cents) over RentPayment
                                   WHERE status IN {PENDING, PAID, LATE}        # forfeited excluded
      available_credit_cents     = SUM(credit_portion_cents) over RentPayment
                                   WHERE status == PAID                          # only on-time-or-cured earn final credit
    input_set: "All RentPayment children of the Agreement, partitioned by status; superseded rows excluded"
    constants: {}
    precision: "integer cents; sum of already-rounded per-payment values (round-then-sum)"
    variants:
      - name: gross_provisional
        when: "Displayed any time before exercise; optimistic — counts PENDING+PAID+LATE as if all will earn"
        difference: "Includes PENDING and LATE rows whose credit is not yet finalized"
      - name: available_final
        when: "Frozen at option exercise into OptionExercise.credit_applied_cents"
        difference: "Counts only PAID rows; LATE and FORFEITED contribute zero"

  - name: maintenance_cost_split
    trigger: "MaintenanceTicket OPEN->APPROVED (estimate) and APPROVED->RESOLVED (actual)"
    algorithm: threshold
    formula: |
      cost = (variant == actual) ? actual_cost_cents : estimated_cost_cents
      tenant_share_cents   = min(cost, Agreement.maintenance_threshold_cents)
      landlord_share_cents = max(0, cost - Agreement.maintenance_threshold_cents)
      # tenant_share + landlord_share == cost  (conserved: full cost is allocated, no drift)
    input_set: "Single MaintenanceTicket and its Agreement.maintenance_threshold_cents"
    constants: {}
    precision: "integer cents (no rounding; pure split at the threshold breakpoint)"
    variants:
      - name: estimate_split
        when: "Computed at OPEN->APPROVED on estimated_cost_cents"
        difference: "Uses estimated_cost_cents; provisional shares"
      - name: actual_split
        when: "Recomputed at APPROVED->RESOLVED on actual_cost_cents"
        difference: "Uses actual_cost_cents; overrides the estimate split"

  - name: purchase_settlement
    trigger: "OptionExercise PENDING->SETTLED within POST /agreements/{id}/option-exercises"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned (each line depends only on prior lines):
      locked_price_snapshot_cents = Agreement.locked_price_cents              # (1) snapshot
      max_credit_cap_cents        = round_half_up(locked_price_snapshot_cents * Agreement.max_credit_pct)  # (2)
      credit_applied_cents        = min(Agreement.available_credit_cents, max_credit_cap_cents)            # (3) nested min
      option_fee_credit_cents     = Agreement.option_fee_creditable ? Agreement.option_fee_cents : 0       # (4) conditional branch
      net_due_at_closing_cents    = locked_price_snapshot_cents - credit_applied_cents - option_fee_credit_cents  # (5)
    input_set: "Agreement (locked_price_cents, max_credit_pct, option_fee_cents, option_fee_creditable, available_credit_cents at exercise instant)"
    constants: {}
    precision: "integer cents, round_half_up at the cap step"

  - name: late_fee_assessment
    trigger: "RentPayment PENDING->LATE on POST /rent-payments/{id}/record"
    algorithm: threshold
    formula: |
      days_late = floor((paid_at - due_date) / 1 day)
      IF days_late <= Agreement.grace_days:
          late_fee_cents = 0                          # still on time (PAID branch, not LATE)
      ELSE:
          late_fee_cents = round_half_up(amount_cents * LATE_FEE_PCT)
      # Boundary: days_late == grace_days -> PAID (fee 0); days_late == grace_days + 1 -> LATE (fee assessed).
    input_set: "Single RentPayment (paid_at, due_date, amount_cents) and Agreement.grace_days"
    constants:
      LATE_FEE_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: mortgage_amortization
    trigger: "Mortgage creation on POST /agreements/{id}/mortgage"
    algorithm: aggregation
    formula: |
      P = principal_cents              # = OptionExercise.net_due_at_closing_cents
      r = annual_rate_bps / 10000 / 12 # monthly rate as a fraction
      n = term_months
      IF r == 0:
          monthly_installment_cents = round_half_up(P / n)
      ELSE:
          monthly_installment_cents = round_half_up( P * r * (1+r)^n / ((1+r)^n - 1) )
    input_set: "Single Mortgage (principal_cents, annual_rate_bps, term_months)"
    constants: {}
    precision: "integer cents, round_half_up on the final installment"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC; entity_backed role must own the targeted resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in allowed set; numeric ranges (credit_pct in 0..1, credit_score 300..850, *_cents >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: business_referential
    check: "Property.landlord_id of agreement's property must match acting Landlord on issuance; OptionExercise.agreement_id must match the path Agreement on conversion"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 409
    applies_to: "POST /agreements, POST /agreements/{id}/mortgage"

  - priority: 6
    category: business_fiscal
    check: "OCC: expected_property_version must equal current Property.version on activate (checked BEFORE the property-availability and agreement-state business checks so a stale-version request fails with 412 even when the property is already UNDER_AGREEMENT)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /agreements/{id}/activate"

  - priority: 7
    category: state
    check: "Target resource in correct state for the transition (Agreement/RentPayment/MaintenanceTicket/OptionExercise status preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_temporal
    check: "Property must be AVAILABLE when activating an Agreement on it (checked after the OCC version match)"
    error_id: ERR_PROPERTY_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /agreements/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "Option exercise allowed only when exercised_at <= option_deadline"
    error_id: ERR_OPTION_EXPIRED
    http_status: 409
    applies_to: "POST /agreements/{id}/option-exercises"

  - priority: 10
    category: business_temporal
    check: "Manual expire allowed only when current clock > option_deadline"
    error_id: ERR_OPTION_NOT_YET_EXPIRED
    http_status: 409
    applies_to: "POST /agreements/{id}/expire"

  - priority: 11
    category: business_safety
    check: "Option may not be exercised while missed_payment_count > 0 (outstanding default risk)"
    error_id: ERR_OPTION_BLOCKED_BY_DEFAULT
    http_status: 409
    applies_to: "POST /agreements/{id}/option-exercises"

  - priority: 12
    category: business_safety
    check: "Manual default requires missed_payment_count >= MAX_MISSED_PAYMENTS"
    error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /agreements/{id}/default"

  - priority: 13
    category: business_constraint
    check: "Tenant.credit_score >= MIN_CONVERSION_SCORE to convert to mortgage"
    error_id: ERR_CREDIT_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /agreements/{id}/mortgage"

  - priority: 14
    category: business_constraint
    check: "(agreement_id, period_index) unique among non-superseded RentPayment rows"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /agreements/{id}/rent-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Landlord ----
  - method: POST
    path: "/landlords"
    description: "Register a landlord/seller"
    roles: [Landlord]
    code: 201
    input: [legal_name, email, payout_account_ref]
    output: Landlord
    side_effects: ["Landlord created"]
  - method: GET
    path: "/landlords/{id}"
    description: "Fetch a landlord"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: Landlord
    side_effects: []

  # ---- Tenant ----
  - method: POST
    path: "/tenants"
    description: "Register a tenant/buyer"
    roles: [Tenant]
    code: 201
    input: [legal_name, email, credit_score]
    output: Tenant
    side_effects: ["Tenant created"]
  - method: GET
    path: "/tenants/{id}"
    description: "Fetch a tenant"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "List a property for rent-to-own"
    roles: [Landlord]
    code: 201
    input: [landlord_id, address, list_price_cents]
    output: Property
    side_effects: ["Property created in AVAILABLE"]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List properties (filterable by landlord)"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["landlord_id?", "status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # ---- Agreement ----
  - method: POST
    path: "/agreements"
    description: "Draft a lease-purchase agreement; landlord_id is copied from the property"
    roles: [Landlord]
    code: 201
    input: [property_id, tenant_id, locked_price_cents, option_fee_cents, "option_fee_creditable?", monthly_payment_cents, credit_pct, "max_credit_pct?", "grace_days?", "maintenance_threshold_cents?", lease_start, option_term_months]
    output: Agreement
    side_effects: ["Agreement created in DRAFT; landlord_id copied from Property.landlord_id; option_deadline computed"]
  - method: GET
    path: "/agreements/{id}"
    description: "Fetch an agreement with computed accrual fields"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: Agreement
    side_effects: ["recompute gross_credit_accrued_cents / available_credit_cents for read"]
  - method: GET
    path: "/agreements"
    description: "List agreements (filterable by property, tenant, landlord)"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["property_id?", "tenant_id?", "landlord_id?", "status?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []
  - method: POST
    path: "/agreements/{id}/activate"
    description: "Activate a DRAFT agreement; takes the property under agreement (OCC on Property.version)"
    roles: [Landlord]
    code: 200
    input: [expected_property_version]
    output: Agreement
    side_effects: ["Agreement DRAFT->ACTIVE", "Property AVAILABLE->UNDER_AGREEMENT (bumps Property.version)", "increments Agreement.version by 1"]
  - method: POST
    path: "/agreements/{id}/default"
    description: "Declare default once missed payments reach threshold"
    roles: [Landlord]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement ACTIVE->DEFAULTED", "non-terminal RentPayments->FORFEITED", "available_credit_cents->0", "Property->AVAILABLE", "PENDING OptionExercise->VOIDED"]
  - method: POST
    path: "/agreements/{id}/expire"
    description: "Expire an unexercised agreement past its option_deadline"
    roles: [Landlord]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement ACTIVE->EXPIRED", "non-terminal RentPayments->FORFEITED", "Property->AVAILABLE"]

  # ---- RentPayment ----
  - method: POST
    path: "/agreements/{id}/rent-payments"
    description: "Schedule a monthly rent payment row for a period; amount copied from agreement"
    roles: [Landlord]
    code: 201
    input: [period_index, due_date, "supersedes_payment_id?"]
    output: RentPayment
    side_effects: ["RentPayment created PENDING; amount_cents copied; credit_portion/rent_portion computed; gross_credit_accrued_cents += credit_portion_cents"]
  - method: GET
    path: "/rent-payments/{id}"
    description: "Fetch a rent payment"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: RentPayment
    side_effects: []
  - method: GET
    path: "/rent-payments"
    description: "List rent payments, filterable by agreement or supersession source"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["agreement_id?", "supersedes_payment_id?", "status?", "limit?", "offset?"]
    output: RentPayment[]
    side_effects: []
  - method: POST
    path: "/rent-payments/{id}/record"
    description: "Tenant records payment; on-time->PAID, past grace->LATE with late fee"
    roles: [Tenant]
    code: 200
    input: [paid_at]
    output: RentPayment
    side_effects: ["PENDING->PAID (credit earned, available_credit += credit_portion) or PENDING->LATE (late_fee assessed, no credit)", "increments RentPayment.version by 1"]
  - method: POST
    path: "/rent-payments/{id}/cure"
    description: "Landlord cures a LATE payment, restoring its credit"
    roles: [Landlord]
    code: 200
    input: []
    output: RentPayment
    side_effects: ["LATE->PAID; available_credit_cents += credit_portion_cents", "increments RentPayment.version by 1"]
  - method: POST
    path: "/rent-payments/{id}/forfeit"
    description: "Landlord forfeits a missed PENDING/LATE payment"
    roles: [Landlord]
    code: 200
    input: []
    output: RentPayment
    side_effects: ["PENDING/LATE->FORFEITED; missed_payment_count += 1; gross_credit_accrued_cents -= credit_portion_cents", "increments RentPayment.version by 1"]

  # ---- MaintenanceTicket ----
  - method: POST
    path: "/agreements/{id}/maintenance-tickets"
    description: "File a maintenance ticket against an agreement"
    roles: [Tenant]
    code: 201
    input: [summary, estimated_cost_cents]
    output: MaintenanceTicket
    side_effects: ["MaintenanceTicket created OPEN"]
  - method: GET
    path: "/maintenance-tickets/{id}"
    description: "Fetch a maintenance ticket"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []
  - method: GET
    path: "/maintenance-tickets"
    description: "List maintenance tickets, filterable by agreement"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: MaintenanceTicket[]
    side_effects: []
  - method: POST
    path: "/maintenance-tickets/{id}/approve"
    description: "Landlord approves a ticket; computes estimate split"
    roles: [Landlord]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: ["OPEN->APPROVED; tenant_share/landlord_share computed on estimate"]
  - method: POST
    path: "/maintenance-tickets/{id}/reject"
    description: "Landlord rejects a ticket"
    roles: [Landlord]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: ["OPEN->REJECTED"]
  - method: POST
    path: "/maintenance-tickets/{id}/resolve"
    description: "Landlord resolves an approved ticket with actual cost; recomputes split"
    roles: [Landlord]
    code: 200
    input: [actual_cost_cents]
    output: MaintenanceTicket
    side_effects: ["APPROVED->RESOLVED; tenant_share/landlord_share recomputed on actual cost"]

  # ---- OptionExercise ----
  - method: POST
    path: "/agreements/{id}/option-exercises"
    description: "Tenant exercises the purchase option; creates+settles an OptionExercise, moves Agreement to EXERCISED"
    roles: [Tenant]
    code: 201
    input: [exercised_at]
    output: OptionExercise
    side_effects: ["OptionExercise PENDING then SETTLED; settlement amounts frozen; Agreement ACTIVE->EXERCISED"]
  - method: GET
    path: "/option-exercises/{id}"
    description: "Fetch an option exercise"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: OptionExercise
    side_effects: []
  - method: GET
    path: "/option-exercises"
    description: "List option exercises, filterable by agreement"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: OptionExercise[]
    side_effects: []

  # ---- Mortgage ----
  - method: POST
    path: "/agreements/{id}/mortgage"
    description: "EscrowAgent converts a SETTLED exercise into a mortgage; Agreement->CONVERTED, Property->SOLD"
    roles: [EscrowAgent]
    code: 201
    input: [option_exercise_id, annual_rate_bps, term_months]
    output: Mortgage
    side_effects: ["Mortgage created ACTIVE; principal=net_due_at_closing; monthly_installment computed; Agreement EXERCISED->CONVERTED; Property UNDER_AGREEMENT->SOLD"]
  - method: GET
    path: "/mortgages/{id}"
    description: "Fetch a mortgage"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: []
    output: Mortgage
    side_effects: []
  - method: GET
    path: "/mortgages"
    description: "List mortgages, filterable by agreement"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: ["agreement_id?", "option_exercise_id?", "status?", "limit?", "offset?"]
    output: Mortgage[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; controls expire/exercise temporal checks)"
    roles: [Landlord, Tenant, EscrowAgent]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed actor does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, or out-of-range numeric (credit_pct, credit_score, *_cents)" }
  - { id: ERR_REFERENCE_MISMATCH, http: 409, condition: "FK references inconsistent (e.g., OptionExercise.agreement_id != path agreement, property landlord mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the required state for the requested transition" }
  - { id: ERR_PROPERTY_NOT_AVAILABLE, http: 409, condition: "Property is not AVAILABLE at agreement activation" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement is not ACTIVE for the requested operation" }
  - { id: ERR_AGREEMENT_NOT_EXERCISED, http: 409, condition: "Agreement is not EXERCISED when conversion to mortgage is attempted" }
  - { id: ERR_OPTION_EXPIRED, http: 409, condition: "exercised_at is after option_deadline" }
  - { id: ERR_OPTION_NOT_YET_EXPIRED, http: 409, condition: "Manual expire attempted while current clock <= option_deadline" }
  - { id: ERR_OPTION_BLOCKED_BY_DEFAULT, http: 409, condition: "Option exercise blocked because missed_payment_count > 0" }
  - { id: ERR_DEFAULT_THRESHOLD_NOT_MET, http: 409, condition: "Manual default attempted with missed_payment_count < MAX_MISSED_PAYMENTS" }
  - { id: ERR_CREDIT_SCORE_TOO_LOW, http: 409, condition: "Tenant.credit_score below MIN_CONVERSION_SCORE at conversion" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "A non-superseded RentPayment with the same (agreement_id, period_index) already exists" }
  - { id: ERR_PAYMENT_NOT_PENDING, http: 409, condition: "record/forfeit attempted on a RentPayment not in PENDING" }
  - { id: ERR_PAYMENT_NOT_LATE, http: 409, condition: "cure attempted on a RentPayment not in LATE" }
  - { id: ERR_TICKET_NOT_OPEN, http: 409, condition: "approve/reject attempted on a MaintenanceTicket not OPEN" }
  - { id: ERR_TICKET_NOT_APPROVED, http: 409, condition: "resolve attempted on a MaintenanceTicket not APPROVED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_property_version does not match current Property.version on activate" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Landlord
    description: "Seller/owner; lists properties, drafts and activates agreements, manages payments lifecycle and maintenance disposition, declares default/expire"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /landlords — register self"
      - "POST /properties — list property (must own via landlord_id)"
      - "POST /agreements — draft agreement on own property"
      - "POST /agreements/{id}/activate — activate agreement"
      - "POST /agreements/{id}/default — declare default"
      - "POST /agreements/{id}/expire — expire agreement"
      - "POST /agreements/{id}/rent-payments — schedule period"
      - "POST /rent-payments/{id}/cure — cure a LATE payment"
      - "POST /rent-payments/{id}/forfeit — forfeit a missed payment"
      - "POST /maintenance-tickets/{id}/approve — approve ticket"
      - "POST /maintenance-tickets/{id}/reject — reject ticket"
      - "POST /maintenance-tickets/{id}/resolve — resolve ticket"
    shared_operations:
      - "GET endpoints (landlords, tenants, properties, agreements, rent-payments, maintenance-tickets, option-exercises, mortgages)"
      - "POST /_clock/set_current_utc"

  - name: Tenant
    description: "Buyer-in-waiting; registers, records own payments, files maintenance tickets, exercises the option"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /tenants — register self"
      - "POST /rent-payments/{id}/record — record own payment"
      - "POST /agreements/{id}/maintenance-tickets — file ticket on own agreement"
      - "POST /agreements/{id}/option-exercises — exercise own option"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: EscrowAgent
    description: "Neutral closer; converts a settled exercise into a mortgage at closing"
    identity: "opaque"
    exclusive_operations:
      - "POST /agreements/{id}/mortgage — convert to mortgage"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"
