        distinguishing_aspect: "Three distinct pull-test gates: FIRST_ARTICLE while a setup is still OPEN (ERR_FIRST_ARTICLE_PREREQUISITE); LOT_SAMPLE before qualification (ERR_APPLICATOR_NOT_QUALIFIED); LOT_SAMPLE for a program other than the applicator's current program (ERR_APPLICATOR_PROGRAM_MISMATCH)."
        test_recipe:
          setup: ["Class-2 released drawing; applicator; program P1; certified inspector; setup S1 created but still OPEN"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S10", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-S10", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-S10A", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr1: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI S10", badge_no: "B-QI-S10" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr1}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
          trigger:
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr1}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { err1: $.data.error_id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr1}", sample_kind: "LOT_SAMPLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { err2: $.data.error_id } }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr1}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-S10B", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr2: $.data.id } }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr2}", sample_kind: "LOT_SAMPLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { err3: $.data.error_id } }
          assert:
            - "captured err1 == ERR_FIRST_ARTICLE_PREREQUISITE   # setup still OPEN, applicator IN_SETUP"
            - "captured err2 == ERR_APPLICATOR_NOT_QUALIFIED     # AVAILABLE but never qualified"
            - "captured err3 == ERR_APPLICATOR_PROGRAM_MISMATCH  # current_program is P1, test referenced P2"

      - name: c_cert_revoke_then_reissue_allows_overlap
        claim_type: side_effect_execution
        grounds: [state_machines.OperatorCertification.ACTIVE_to_REVOKED, "validations[priority=9]", "errors[ERR_OPERATOR_NOT_CERTIFIED]"]
        distinguishing_aspect: "Revoking the only cert blocks the operator's test sign-off (ERR_OPERATOR_NOT_CERTIFIED); a REVOKED cert is excluded from the overlap check, so re-issuing the identical window succeeds and testing resumes."
        test_recipe:
          setup: ["Qualified flow; order qty 1; kit delivered; unit U1 BUILT; inspector QI with class-2 cert C1"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-S11", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
