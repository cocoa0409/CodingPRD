            - "the second program read shows assigned_pool_fte 0.00, reducible_fte 0.00, staffing_liability_cents 0 and deferred_fte 0.00, with faculty_fte_baseline and active_fte_total both still 1.00 — retention shields the fte instead of paying it out"
            - "the EFFECTUATE that follows returns 200: decision state EFFECTUATED with effectuated_at 2026-09-15T10:00:00Z, and the program moves TEACH_OUT_PENDING -> TEACH_OUT_ACTIVE with catalog_status ADMISSIONS_CLOSED"
            - "the decision read confirms notification_count 2 and unacknowledged_notification_count 0"

  # ==========================================================================
  # §1.7 RBAC — role_model: segregation_of_duties
  # ==========================================================================
  - section: rbac
    instances:
      - name: blank_and_unknown_identity_headers_are_rejected_before_anything_else
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADER]
          - errors[ERR_INVALID_ROLE]
        distinguishing_aspect: |
          Whitespace is not a credential: an X-User-Role or X-User-ID of "" or
          "   " is treated as absent, not as a value that then fails the
          role-membership check. Both auth checks are evaluated before path
          resolution, so every probe below aims at an id that does not exist and
          still reports 401 rather than 404 — and role names are matched
          case-sensitively against the six declared in §1.7, so "registrar" is
          as unknown as "Dean".
        test_recipe:
          setup:
            - "Empty database. In the calls below `as:` carries the literal X-User-Role value and `as_user_id:` the literal X-User-ID value; \"\" means the header is sent with an empty value and \"   \" means it is sent with three spaces."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ""
              as_user_id: "coordinator-1"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: "   "
              as_user_id: "coordinator-1"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ReviewCoordinator
              as_user_id: ""
              captures: { e_no_id: $.data.error_id }
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ReviewCoordinator
              as_user_id: "   "
              captures: { e_blank_id: $.data.error_id }
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Dean
              as_user_id: "dean-1"
              captures: { e_unknown_role: $.data.error_id }
            - call: "GET /provost/academic-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: registrar
              as_user_id: "registrar-1"
              captures: { e_case: $.data.error_id }
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ""
              as_user_id: ""
              captures: { e_write: $.data.error_id }
          assert:
            - "${e_no_role} == ERR_MISSING_AUTH_HEADER with HTTP 401 and NOT ERR_PROGRAM_NOT_FOUND — priority 1 runs before priority 7"
            - "${e_blank_role} == ERR_MISSING_AUTH_HEADER with HTTP 401 and NOT ERR_INVALID_ROLE — a whitespace-only role counts as absent, so priority 1 answers before priority 2"
            - "${e_no_id} == ERR_MISSING_AUTH_HEADER with HTTP 401"
            - "${e_blank_id} == ERR_MISSING_AUTH_HEADER with HTTP 401 — the role is valid and permitted, but the identity is blank"
            - "${e_unknown_role} == ERR_INVALID_ROLE with HTTP 401 and NOT ERR_ROLE_NOT_PERMITTED (403) — an unknown role never reaches the endpoint's roles list"
            - "${e_case} == ERR_INVALID_ROLE with HTTP 401 — role matching is case-sensitive"
            - "${e_write} == ERR_MISSING_AUTH_HEADER with HTTP 401 and no AcademicProgram is created: a follow-up GET /provost/academic-programs as ReviewCoordinator returns total_count == 0"

      - name: no_role_may_perform_another_roles_exclusive_write
        claim_type: exclusive_operations
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.ReviewCoordinator.exclusive_operations
          - roles.Registrar.exclusive_operations
          - roles.HRPartner.exclusive_operations
          - roles.ProgramChair.exclusive_operations
        distinguishing_aspect: |
          Six roles, six exclusive surfaces, and no seniority: the Provost cannot
          register a program, the Registrar cannot propose a decision, the
          HRPartner cannot touch the seat ledger, the ReviewCoordinator cannot
          suppress the catalog, and the ExternalReviewer can read nothing outside
          its own visit. Every refusal is 403 with the same error id, and none of
          them leaves a trace on the target entity.
        test_recipe:
          setup:
            - "One program with a review cycle, so the probes below aim at real ids and cannot be answered with a 404."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /provost/academic-programs"
              payload: { code: "PHIL-BA", name: "Philosophy BA", degree_level: "UNDERGRADUATE", department_code: "PHIL" }
              as: Provost
              as_user_id: "provost-1"
              captures: { e1: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: HRPartner
              as_user_id: "hr-1"
              captures: { e2: $.data.error_id }
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "CONTINUE", rationale: "Looks fine to me.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e3: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "Coordinators do not run the catalog." }
              as: ReviewCoordinator
              as_user_id: "coordinator-1"
              captures: { e4: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-1", tenure_status: "TENURED", fte: 1.00, annual_salary_cents: 12000000 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { e5: $.data.error_id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Not my job.", section_codes: ["S1"] }
              as: ReviewCoordinator
              as_user_id: "coordinator-1"
              captures: { e6: $.data.error_id }
            - call: "GET /provost/academic-programs"
              payload: { limit: 10, offset: 0 }
              as: ExternalReviewer
              as_user_id: "reviewer-1"
              captures: { e7: $.data.error_id }
            - call: "POST /provost/compliance-sweeps"
              payload: {}
              as: HRPartner
              as_user_id: "hr-1"
              captures: { e8: $.data.error_id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs"
              payload: { limit: 10, offset: 0 }
              as: ReviewCoordinator
          assert:
            - "all eight probes return HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED: ${e1}, ${e2}, ${e3}, ${e4}, ${e5}, ${e6}, ${e7} and ${e8} are each ERR_ROLE_NOT_PERMITTED"
            - "${e3} is 403 and NOT 201 — the body is otherwise flawless (a real cycle, a legal outcome, and an expected_cycle_version echoed straight from the cycle), so the only reason for the refusal is the caller's role"
            - "${e7} is 403 and NOT 200 — GET /provost/academic-programs is not in ExternalReviewer's shared_operations, so the reviewer cannot enumerate the portfolio"
            - "the program read shows lifecycle_state ACTIVE, catalog_status LISTED, snapshot_count 0, faculty_fte_baseline 0.00 and version still ${prog_v0} — not one refused write bumped the version"
            - "the program list returns total_count == 1: no PHIL-BA program was created"

      - name: action_scoped_grants_split_one_transitions_endpoint_between_roles
        claim_type: approval_chain
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.Provost.exclusive_operations
          - roles.ReviewCoordinator.exclusive_operations
          - roles.ProgramChair.exclusive_operations
        distinguishing_aspect: |
          Being listed on an endpoint is not the same as owning an action.
          Provost and ReviewCoordinator both appear on the decision transitions
          endpoint, and all three of ProgramChair, Provost and ReviewCoordinator
          appear on the plan transitions endpoint, yet propose, ratify, effectuate,
          submit, approve and activate each belong to exactly one role. The
          refusals are 403 at priority 3, ahead of every state precondition, so a
          wrong-role call on a legally-transitionable row still fails on the role.
        test_recipe:
          setup:
            - "A cycle in RESPONSE_SUBMITTED with a PROPOSED DISCONTINUATION decision proposed by provost-proposer, and a DRAFT teach-out plan is created only after the decision is ratified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
          trigger:
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ReviewCoordinator
              as_user_id: "coordinator-1"
              captures: { e_submit: $.data.error_id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { e_accept: $.data.error_id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
