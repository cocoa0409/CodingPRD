          - entities.PreOrder.fields.deposit_forfeited_cents
        distinguishing_aspect: "The refund branch pivots on a strict comparison against pickup_window_start_at: cancelling at 13:59Z (before a 14:00Z window) refunds the whole 2687-cent deposit, while cancelling at exactly 15:00Z on a 15:00Z window refunds round_half_up(2149 * 0.5) == 1075 and forfeits the 1074-cent residual, and the deposit itself is a ceil (2687 from 2686.25)."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (deposit_rate 0.25); clock at 2026-08-05T08:00:00Z."
            - "RIB01 is PROPOSED at 2149; PO1 is CONFIRMED for 5.0 lb with window 14:00Z..15:00Z; PO2 is CONFIRMED for 4.0 lb with window 15:00Z..16:00Z."
