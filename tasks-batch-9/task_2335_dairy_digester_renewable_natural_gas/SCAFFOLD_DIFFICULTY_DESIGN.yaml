      - name: rto_land_unit_setback_is_leading_edge_only_and_keyed_on_dairy_land_unit_pair
        grounds:
          - calculations.nutrient_window_setback
          - "validations[priority=150]"
          - entities.NutrientApplication.fields.land_unit_code
          - entities.NutrientApplication.fields.application_start_date
          - errors.ERR_LAND_UNIT_SETBACK_CONFLICT
        distinguishing_aspect: |
          A different resource - the (dairy_id, land_unit_code) pair rather than an
          interconnect - and deliberately different interval semantics: CLOSED calendar-day
          intervals with an ASYMMETRIC, leading-edge-only 21-day setback. An application
          starting 2026-09-05 after an existing window ending 2026-08-21 is refused, an
          application placed entirely BEFORE that window (2026-08-08 to 2026-08-09) is
          accepted because the setback has no trailing mirror, 2026-09-12 clears the
          2026-09-11 setback edge, and the same refused dates on land unit LU-102 are
          accepted because the resource key includes the land unit.
        test_recipe:
          setup:
            - "One dairy with annual_nitrogen_budget_kg 18000.000 and one facility with an ACTIVE agreement."
            - "One CLOSED operations day 2026-08-03 with a 150.000 t delivery and separation recorded at 65.0 percent capture, 70.0 percent bedding recovery and 1150.0 mg/L laboratory nitrogen."
            - "Application A on land unit LU-101 covers 2026-08-20 to 2026-08-21 and stays PLANNED, so it still holds its window."
