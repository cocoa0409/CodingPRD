              as: CenterAdmin
              payload: { category: "POWER", model_name: "Tour Power Distro 200A", on_hand_qty: 5, daily_rate_cents: 25000, replacement_value_cents: 900000 }
              captures: { item_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { clear_client: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Coastline Touring Co", contact_email: "ap@coastline.example", credit_rating: "A", is_nonprofit: false, outstanding_balance_cents: 5000 }
              captures: { arrears_client: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${clear_client}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { eng_clear: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${arrears_client}", title: "Coastline Rental", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { eng_arrears: "$.data.id" }
