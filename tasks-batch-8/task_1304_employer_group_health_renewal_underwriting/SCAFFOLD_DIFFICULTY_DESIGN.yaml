          - errors[ERR_NO_MODELED_PLAN]
        distinguishing_aspect: |
          Entity pair Quote x BenefitPlanDesign: quote creation is rejected with
          ERR_NO_MODELED_PLAN when the case (in RATING_IN_PROGRESS, OCC version fresh) has only
