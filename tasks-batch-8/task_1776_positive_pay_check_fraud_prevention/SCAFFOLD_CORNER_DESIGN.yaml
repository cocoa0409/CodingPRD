      - name: fee_statement_empty_period
        claim_type: correct_result
        grounds: [calculations.monthly_statement]
        distinguishing_aspect: "Empty-set edge: a period with no entries reports all-zero components and entry_count 0, not an error."
        test_recipe:
          setup: ["Enrollment exists (no activity)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "EmptyCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
