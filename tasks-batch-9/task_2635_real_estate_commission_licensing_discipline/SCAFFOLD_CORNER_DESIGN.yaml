  - section: validations
    instances:
      - name: reactivation_is_refused_for_a_ce_deficit_before_the_fee_is_ever_checked
        claim_type: cascading_validation
        grounds:
          - validations[priority=37]
          - validations[priority=51]
          - errors.ERR_CE_HOURS_INSUFFICIENT
          - errors.ERR_REINSTATEMENT_FEE_MISMATCH
        distinguishing_aspect: |
          Two independent gates on one call in a fixed order: the CE deficit (priority 37) is decided
          before the fee arithmetic (priority 51), so a licensee who is both short of hours AND paying
          the wrong fee must see ERR_CE_HOURS_INSUFFICIENT. Only once the hours are there does the fee
          comparison run, and it is exact - 15001 cents fails just as 14999 would.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and Sam Sales INACTIVE since 2026-08-01T00:00:00Z with ce_hours_valid == 0"
            - "Coastal Institute is APPROVED with APPROVED instructor Ivy Teach"
            - "the clock is moved to 2026-08-20T00:00:00Z: 19 days inactive, so late_periods == 0 and ce_hours_required == 12 (0 full 6-month blocks), making the exact fee 15000"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
