        grounds:
          - state_machines.Domain.ACTIVE_to_TRANSFERRING
          - errors.ERR_TRANSFER_WINDOW_CLOSED
        distinguishing_aspect: "Integer-day boundary on the 60-day initial transfer restriction via POST /transfers: a request at created_at + 59 days fails with ERR_TRANSFER_WINDOW_CLOSED; at exactly +60 days it succeeds (>= semantics on the window opening)."
        test_recipe:
          setup:
