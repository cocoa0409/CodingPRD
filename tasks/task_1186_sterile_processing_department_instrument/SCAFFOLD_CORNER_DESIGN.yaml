      - name: certification_expiry_sweep_blocks_and_renewal_restores
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Technician.ACTIVE_to_CERTIFICATION_EXPIRED"
          - "state_machines.Technician.CERTIFICATION_EXPIRED_to_ACTIVE"
          - "errors[ERR_CERTIFICATION_EXPIRED]"
        distinguishing_aspect: "The lazy sweep flips the technician to CERTIFICATION_EXPIRED once the logical clock passes certification_expires_at (blocking load start with ERR_CERTIFICATION_EXPIRED); a PUT renewing the expiry beyond now restores ACTIVE."
        test_recipe:
          setup: ["template, technician A (certification_expires_at 2026-05-01T01:00:00Z), sterilizer; tray ASSEMBLED; load LOADING with the tray; clock advanced to 2026-05-01T02:00:00Z"]
