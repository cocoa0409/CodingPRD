      - name: corner_account_created_with_the_glycol_flag_cascade_creates_exactly_one_loop
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ServiceAccount.ABSENT_to_ACTIVE
          - endpoints.POST_accounts
          - endpoints.GET_glycol_loops
          - entities.GlycolLoop
          - calculations.glycol_health_score
        distinguishing_aspect: |
          The ABSENT_to_ACTIVE side effect is conditional on one input flag and
          produces a row on a different entity that no path segment exposes:
          glycol_system_present true yields exactly one GlycolLoop seeded
          glycol_pct 35.0 / pump_psi 12.0 / bath_temp_f 28.0 / health_score
          100.00 / status NORMAL / window_avg_cooler_temp_f null, while the
          sibling account created with the flag false yields zero loops.
        test_recipe:
          setup:
            - "Clock at the startup default 2026-08-01T00:00:00Z so last_serviced_at is predictable."
            - "Two accounts created back to back: 'Chiller House' with glycol_system_present true and 'Dry Room' with glycol_system_present false."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Chiller House", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct_g: $.data.id }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Dry Room", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct_d: $.data.id }
            - call: "GET /draft-service/glycol-loops?account_id=${acct_g}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { g_total: $.total_count, loop: "$.data[0].id", loop_pct: "$.data[0].glycol_pct", loop_psi: "$.data[0].pump_psi", loop_bath: "$.data[0].bath_temp_f", loop_score: "$.data[0].health_score", loop_status: "$.data[0].status", loop_avg: "$.data[0].window_avg_cooler_temp_f", loop_serviced: "$.data[0].last_serviced_at" }
            - call: "GET /draft-service/glycol-loops?account_id=${acct_d}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { d_total: $.total_count }
          assert:
            - "both POST /draft-service/accounts calls return HTTP 201"
            - "${g_total} == 1 — exactly one loop, not zero and not one per line"
            - "${d_total} == 0"
            - "${loop_pct} == 35.0 and ${loop_psi} == 12.0 and ${loop_bath} == 28.0"
            - "${loop_score} == 100.00 and ${loop_status} == NORMAL"
            - "${loop_avg} == null — a loop with no CoolerReading has no window average"
            - "${loop_serviced} == 2026-08-01T00:00:00Z (initialised to the loop's created_at)"
            - "GlycolLoop.${loop}.account_id == ${acct_g}"

