            - "Sale.${sale_107}.fulfillment_status == VOIDED"
            - "Sale.${sale_107}.duty_status == REVERSED"
            - "Sale.${sale_107}.voided_at == 2026-08-01T00:00:00Z"
            - "all four triggers return HTTP 409 with error_id ERR_SALE_ALREADY_TERMINAL"
            - "Sale.${sale_107}.version == ${sale_107_v1} after all four refusals"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 10 - a CART void never touched the ledger"
            - "GET /bonded-movements filtered by stock_item_id ${si_whisky} returns exactly 1 movement"

      - claim_type: idempotency
        name: repeating_a_completed_lifecycle_trigger_is_refused_per_entity
        grounds:
          - validations[priority=62]
          - validations[priority=63]
          - errors.ERR_AGREEMENT_ALREADY_ACTIVE
          - errors.ERR_PRODUCT_NOT_PENDING
          - errors.ERR_GRANT_NOT_ACTIVE
        distinguishing_aspect: |
          None of the lifecycle actions is idempotent: a second activate answers
          ERR_AGREEMENT_ALREADY_ACTIVE, a second list answers ERR_PRODUCT_NOT_PENDING, a second revoke
          answers ERR_GRANT_NOT_ACTIVE, and each refusal MUST leave version and the *_at timestamps at
          their first-call values rather than re-stamping them with the current clock.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one ACTIVE LIQUOR brand"
            - "A DRAFT agreement, a PENDING product and an ACTIVE CATEGORY_PREFERRED grant"
            - "The clock is advanced between the first and second call so a re-stamp would be visible"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_sin: $.data.id }
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_aurora}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "CATEGORY_PREFERRED", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_sin: $.data.id }
          trigger:
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /exclusivity-grants/${g_sin}/revoke"
              payload: {}
              as: TerminalAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /exclusivity-grants/${g_sin}/revoke"
              payload: {}
              as: TerminalAdmin
          assert:
            - "the first activate, list and revoke each return HTTP 200"
            - "the second activate returns HTTP 409 with error_id ERR_AGREEMENT_ALREADY_ACTIVE"
            - "the second list returns HTTP 409 with error_id ERR_PRODUCT_NOT_PENDING"
            - "the second revoke returns HTTP 409 with error_id ERR_GRANT_NOT_ACTIVE"
            - "ConcessionAgreement.${ag_sin}.status == ACTIVE"
            - "Product.${p_whisky}.assortment_status == LISTED"
            - "Product.${p_whisky}.listed_at == 2026-08-01T00:00:00Z - not re-stamped to 2026-08-02"
            - "ExclusivityGrant.${g_sin}.status == REVOKED"
            - "ExclusivityGrant.${g_sin}.revoked_at == 2026-08-01T00:00:00Z"

      - claim_type: guarded_transition
        name: preorder_conversion_requires_scan_window_agreement_and_listing_together
        grounds:
          - state_machines.PreOrder.RESERVED_to_CONVERTED
          - validations[priority=61]
          - validations[priority=72]
          - errors.ERR_RESERVATION_WINDOW_INVALID
        distinguishing_aspect: |
          Conversion is guarded by FOUR separate cross-entity conditions at once. Converting while the
          clock sits before reservation_window_start MUST fail with ERR_RESERVATION_WINDOW_INVALID even
          though the pre-order is perfectly RESERVED, and converting on an unscanned itinerary MUST fail
          with ERR_ITINERARY_NOT_SCANNED. Once inside the window with the itinerary scanned, conversion
          creates a PRE_ORDER-channel Sale in CART with the line priced from the Product and releases the
          reservation - it does NOT issue stock, which happens only at pickup.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product with 10 units, AU/LIQUOR allowance 5"
            - "ConcessionAgreement 2026-08 for SIN, ACTIVE"
            - "An UNSCANNED itinerary departing 2026-08-20 and a RESERVED PreOrder of qty 4 with window [2026-08-10, 2026-08-12]"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 5, advisory_text: "Australia: 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_sin: $.data.id }
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0108", nationality_code: "CN", boarding_pass_barcode: "BP-0108", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T00:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_108: $.data.id }
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
              captures: { si_v0: $.data.version }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_108}", stock_item_id: "${si_whisky}", qty: 4, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${si_v0}" }
              as: Passenger
              as_user_id: "${it_108}"
              captures: { po_108: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_108}/convert"
              payload: {}
              as: StockController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /pre-orders/${po_108}/convert"
              payload: {}
              as: StockController
            - call: "POST /itineraries/${it_108}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0108" }
              as: SalesAssociate
            - call: "POST /pre-orders/${po_108}/convert"
              payload: {}
              as: StockController
          assert:
            - "the first convert returns HTTP 422 with error_id ERR_RESERVATION_WINDOW_INVALID (clock 2026-08-01 is before the window start)"
            - "the second convert returns HTTP 409 with error_id ERR_ITINERARY_NOT_SCANNED"
            - "PreOrder.${po_108}.status == RESERVED after both refusals"
            - "BondedStockItem.${si_whisky}.reserved_qty == 4 after both refusals"
            - "the third convert returns HTTP 200"
            - "PreOrder.${po_108}.status == CONVERTED"
            - "PreOrder.${po_108}.closed_at == 2026-08-11T00:00:00Z"
            - "PreOrder.${po_108}.converted_sale_id is non-null"
            - "the created Sale has channel PRE_ORDER, fulfillment_status CART, duty_status SUSPENDED, terminal_id ${t_sin} and gross_amount_cents 32000"
            - "the created SaleLine has qty 4, unit_price_cents 8000 and line_total_cents 32000"
            - "BondedStockItem.${si_whisky}.reserved_qty == 0"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 10 - conversion releases the hold but issues no stock"
            - "BondedStockItem.${si_whisky}.available_qty == 10"
            - "GET /bonded-movements filtered by stock_item_id ${si_whisky} and movement_type RESERVATION_RELEASE returns exactly 1 movement with qty_delta -4"

      - name: customs_audit_info_request_loop_re_snapshots_the_expected_quantity
        claim_type: cyclic_shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.CustomsAudit.SUBMITTED_to_INFO_REQUESTED
          - state_machines.CustomsAudit.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / customs_audit_info_request_cycle_retakes_expected_quantity_snapshot
          rationale: "That instance drives the SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle, the round_count increment and the re-taken expected_qty snapshot end to end, which is the whole cyclic-shape claim."

      - name: itinerary_amend_rescan_cycle_reverts_cleared_sales
        claim_type: cyclic_shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PassengerItinerary.SCANNED_to_AMENDED
          - state_machines.PassengerItinerary.AMENDED_to_SCANNED
        excluded_because:
          difficulty_instance: non_linear_state_machine / itinerary_amend_rescan_cycle_reverts_and_reprices_cleared_sale
          rationale: "That instance covers the SCANNED -> AMENDED -> SCANNED loop, the amend_count increment and the ELIGIBILITY_CLEARED -> CART revert cascade with literal repriced amounts."

      - name: sale_till_and_duty_dimensions_move_independently
        claim_type: parallel_shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Sale.fulfillment_status
          - state_machines.Sale.duty_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / sale_parallel_dimensions_tamper_advances_duty_status_only
          rationale: "That instance proves a TAMPERED verification advances duty_status while fulfillment_status stays at ELIGIBILITY_CLEARED, i.e. the two dimensions move independently."

      - name: brand_suspension_delists_only_listed_products
        claim_type: side_effect_cascade_down
        grounds:
          - state_machines.Brand.ACTIVE_to_SUSPENDED
          - entities.Product.fields.assortment_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / product_listing_gated_on_brand_suspension_state
          rationale: "That instance asserts the suspension cascade delists the LISTED sibling and leaves the PENDING product untouched - the cascade-down claim including the non-terminal-children-only restriction."

      - name: pickup_syncs_the_ledger_and_the_concession_gross_sales
        claim_type: side_effect_ledger_sync
        grounds:
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
          - entities.ConcessionAgreement.fields.gross_sales_cents
        excluded_because:
          difficulty_instance: transitive_cascade / pickup_cascade_depth_four_duty_status_to_ledger_to_rent_to_basis
          rationale: "That instance verifies the four-link pickup chain from duty_status through the bonded ledger to the agreement gross_sales and the derived rent_basis, reconciling before and after."

      - name: void_and_reversal_undo_every_original_side_effect
        claim_type: side_effect_compensation
        grounds:
          - state_machines.Sale.PICKED_UP_to_VOIDED
          - state_machines.BondedMovement.reversal
        excluded_because:
          difficulty_instance: compensating_invariant / void_of_picked_up_sale_conserves_concession_gross_sales_and_rent_basis
          rationale: "That instance covers the money compensation path with no drift; compensating_invariant / receipt_reversal_conserves_physical_units_and_duty_suspended_value covers the physical-unit path."

  # =====================================================================
  # SECTION 3 - From Table 3 (Calculations)
  # =====================================================================
  - section: calculations
    instances:
      - claim_type: waterfall_allocation_chronological_and_per_category
        name: allowance_waterfall_is_scoped_per_category_and_consumed_in_created_at_order
        grounds:
          - calculations.duty_exemption_accounting
          - entities.SaleLine.fields.allowance_excess_qty
          - entities.AllowanceRule.fields.allowance_units
        distinguishing_aspect: |
          The allowance waterfall is keyed on (destination country, CATEGORY): a TOBACCO line MUST NOT
          consume the LIQUOR allowance, and within a category the consumed_before running total MUST
          follow SaleLine.created_at ASC so the LATER liquor line carries the excess even though the
          earlier one is cheaper to tax. The rounding is round_half_up per line, so a 62.5-cent duty
          becomes 63, never 62.
        test_recipe:
          setup:
            - "Terminal SIN in SG (regime NONE)"
            - "A LIQUOR product at 8000 cents / 2400 bps and a TOBACCO product at 500 cents / 1250 bps, both LISTED with 10 units each"
