            - "data.error_id == ERR_CLIENT_SUSPENDED"

      - name: temporal_vs_referential_independent_firing
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_CONSULTANT_DOUBLE_BOOKED]
          - errors[ERR_ACA_PREVENTIVE_DISABLED]
        distinguishing_aspect: |
          A DIFFERENT category pair business_temporal (priority 10, ERR_CONSULTANT_DOUBLE_BOOKED)
          vs business_referential (priority 11, ERR_ACA_PREVENTIVE_DISABLED). The two rules sit on
          different endpoints (consult create vs superbill create); the design pins each fires with
          its own error and never bleeds into the other — the temporal rule on POST /consults, the
          referential rule on POST /superbills.
        test_recipe:
          setup:
            - "Practice with aca_preventive_enabled false; a consultant already booked TELEHEALTH 15:00-16:00; one COMPLETED consult for an ACA superbill attempt."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "No ACA Practice", aca_preventive_enabled: false }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent B", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            # A SCHEDULED (non-terminal) consult on cons_id at 15:00-16:00 — stays SCHEDULED so the
            # consultant-calendar overlap can fire on the first trigger.
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { booked_id: $.data.id }
            # A separate COMPLETED consult on a SECOND consultant at a non-overlapping time — billed in
            # the second trigger.
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Bea IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons2_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons2_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T17:00:00Z", scheduled_end_utc: "2026-06-10T18:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { completed_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${completed_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons2_id}"
            - call: "POST /consults/${completed_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons2_id}"
            - call: "POST /consults/${completed_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons2_id}"
          trigger:
            # First trigger: a new IN_HOME consult on cons_id at 15:30-16:30 overlaps the SCHEDULED
            # booked_id (15:00-16:00) -> ERR_CONSULTANT_DOUBLE_BOOKED.
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_b_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:30:00Z", scheduled_end_utc: "2026-06-10T16:30:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
            # Second trigger: ACA superbill on a practice with aca_preventive_enabled false -> ERR_ACA_PREVENTIVE_DISABLED.
            - call: "POST /superbills"
              payload: { consult_id: "${completed_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
          assert:
            - "first trigger (consult create) response status == 409 with data.error_id == ERR_CONSULTANT_DOUBLE_BOOKED"
            - "second trigger (superbill create) response status == 409 with data.error_id == ERR_ACA_PREVENTIVE_DISABLED"

