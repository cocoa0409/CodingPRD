      - "Recompute Member.credit_balance and lifetime_paid_cents"

  - method: POST
    path: "/subscriptions/{subscription_id}/freeze"
    description: "Freeze the subscription for N upcoming cycles"
    roles: [Member, LocationManager]
    code: 200
    input: [freeze_cycles]
    output: Subscription
    side_effects: ["status ACTIVE -> FROZEN; freeze_cycles_remaining=freeze_cycles; granted_credits_remaining -> 0; Member.credit_balance recomputed"]

  - method: POST
    path: "/subscriptions/{subscription_id}/unfreeze"
    description: "Manually unfreeze a frozen subscription, re-anchoring the cycle to now"
    roles: [Member, LocationManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status FROZEN -> ACTIVE; freeze_cycles_remaining -> 0; cycle re-anchored; granted_credits_remaining=plan.monthly_credit_grant; Member.credit_balance recomputed"]

  - method: POST
    path: "/subscriptions/{subscription_id}/cancel"
    description: "Cancel the subscription"
    roles: [Member, LocationManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELLED; granted_credits_remaining -> 0; Member.credit_balance recomputed"]

  - method: GET
    path: "/invoices"
    description: "List invoices, filterable (reverse-reachability for Invoice.subscription_id)"
    roles: [PlatformAdmin, LocationManager, Member]
    code: 200
    input: ["subscription_id?", "kind?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [PlatformAdmin, LocationManager, Member]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # ---- Credit packs (reverse-reachability for CreditPack.member_id) ----
  - method: POST
    path: "/members/{member_id}/credit-packs"
    description: "Purchase a credit pack (intro or standard); computes price and 180-day expiry"
    roles: [Member, LocationManager]
    code: 201
    input: [total_credits, is_intro]
    output: CreditPack
    side_effects:
      - "status=ACTIVE; remaining_credits=total_credits; price_paid_cents=credit_pack_price; expires_at=clock+180d"
      - "If is_intro=true: Member.intro_offer_used -> true"
      - "Recompute Member.credit_balance"

  - method: GET
    path: "/credit-packs"
    description: "List credit packs, filterable (reverse-reachability for CreditPack.member_id)"
    roles: [PlatformAdmin, LocationManager, Member]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: CreditPack[]
    side_effects: []

  - method: GET
    path: "/credit-packs/{pack_id}"
    description: "Get a credit pack"
    roles: [PlatformAdmin, LocationManager, Member]
    code: 200
    input: []
    output: CreditPack
    side_effects: []

  - method: POST
    path: "/members/{member_id}/credit-packs/{pack_id}/refund"
    description: "Refund an ACTIVE credit pack's unused credits (manager action)"
    roles: [LocationManager]
    code: 200
    input: []
    output: CreditPack
    side_effects: ["Compute credit_pack_refund; remaining_credits -> 0; status -> REFUNDED; Member.credit_balance recomputed"]

  # ---- Bookings (reverse-reachability for Booking.member_id, .room_id, .service_type_id, .location_id) ----
  - method: POST
    path: "/bookings"
    description: "Book a session into a room (OCC-guarded on room version); debits credits via waterfall; enforces waiver, contraindication, staffing, and overlap gates"
    roles: [Member, LocationManager]
    code: 201
    input: [member_id, location_id, room_id, starts_at, expected_room_version]
    output: Booking
    side_effects:
      - "service_type_id copied from room; occupies_until_at computed; credits_charged + credit_source via booking_credit_debit"
      - "status=BOOKED; Location.open_booking_count incremented"
      - "increments Room.version by 1"
      - "Recompute Member.credit_balance; CreditPack -> DEPLETED if its last credit was taken"

  - method: GET
    path: "/bookings"
    description: "List bookings, filterable (reverse-reachability for Booking.member_id, Booking.room_id, Booking.service_type_id, Booking.location_id)"
    roles: [PlatformAdmin, LocationManager, Technician, Member]
    code: 200
    input: ["member_id?", "location_id?", "room_id?", "service_type_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{booking_id}"
    description: "Get a booking"
    roles: [PlatformAdmin, LocationManager, Technician, Member]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{booking_id}/cancel"
    description: "Member cancels a future booking; refunds credits to source and assesses late-cancel fee"
    roles: [Member, LocationManager]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status BOOKED -> CANCELLED; fee_charged_cents via cancellation_fee CANCEL mode"
      - "Refund credits_charged to source; Member.credit_balance recomputed; Location.open_booking_count decremented"

  - method: POST
    path: "/bookings/{booking_id}/complete"
    description: "Technician marks a session completed (must be on a covering shift)"
    roles: [Technician, LocationManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["status BOOKED -> COMPLETED; Location.open_booking_count decremented"]

  - method: POST
    path: "/bookings/{booking_id}/no-show"
    description: "Technician marks a member no-show; forfeits credits and assesses no-show fee"
    roles: [Technician, LocationManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["status BOOKED -> NO_SHOW; fee_charged_cents via cancellation_fee NO_SHOW mode; credits forfeited; Location.open_booking_count decremented"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor does not own the targeted member/technician resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A FK field in the request body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, integer out of declared range" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid state for the requested transition" }
  - { id: ERR_CONTRAINDICATION_BLOCK, http: 422, condition: "Booking a medical-clearance service while Member.contraindication_flag is true" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Booking any service without an ACTIVE waiver on file for the member" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Requested booking interval overlaps an existing BOOKED interval (incl. cleaning buffer) on the same room" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "A new technician shift overlaps an existing SCHEDULED shift of the same technician" }
  - { id: ERR_NO_TECHNICIAN_ON_DUTY, http: 409, condition: "No SCHEDULED technician shift fully covers the booking interval at the location" }
  - { id: ERR_INTRO_ALREADY_USED, http: 409, condition: "Member has already purchased the one-time intro pack" }
  - { id: ERR_NOT_AN_UPGRADE, http: 409, condition: "Target plan fee is not strictly greater than the current plan fee" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 422, condition: "Credit waterfall cannot cover the service credit cost" }
  - { id: ERR_LOCATION_CLOSED, http: 409, condition: "Operation attempted against a CLOSED location (booking/room creation)" }
  - { id: ERR_SERVICE_INACTIVE, http: 409, condition: "Booking a room whose service type is active=false" }
  - { id: ERR_FREEZE_CYCLES_INVALID, http: 400, condition: "freeze_cycles not in [1, MAX_FREEZE_CYCLES]" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of allowed bounds" }
  - { id: ERR_DUPLICATE_SUBSCRIPTION, http: 409, condition: "Member already has a non-CANCELLED subscription when starting a new one" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the platform: locations, service menu, membership plans, logical clock, and billing runs."
    identity: opaque
    exclusive_operations:
      - "POST /locations — create location"
      - "POST /service-types — create service type"
      - "POST /membership-plans — create membership plan"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /_billing/run — advance recurring billing"
    shared_operations:
      - "GET reads across locations, service-types, plans, members, subscriptions, packs, bookings, invoices"

  - name: LocationManager
    description: "Runs a lounge: rooms, technicians, shifts, member onboarding, waiver revocation, pack refunds, and may act on behalf of members for booking/subscription operations."
    identity: opaque
    exclusive_operations:
      - "POST /members/{member_id}/waivers/{waiver_id}/revoke — revoke waiver"
      - "POST /members/{member_id}/credit-packs/{pack_id}/refund — refund pack"
      - "POST /shifts/{shift_id}/cancel — cancel shift"
    shared_operations:
      - "POST /locations/{id}/rooms, POST /locations/{id}/technicians, POST /technicians/{id}/shifts — operational setup (with PlatformAdmin)"
      - "POST /members, POST /members/{id}/subscription, POST /subscriptions/{id}/{upgrade,freeze,unfreeze,cancel}, POST /members/{id}/credit-packs, POST /bookings, POST /bookings/{id}/cancel — member-proxy operations (with Member)"
      - "POST /bookings/{id}/complete, POST /bookings/{id}/no-show — session disposition (with Technician)"

  - name: Member
    description: "An end customer. Acts only on own resources (X-User-ID == Member.id): waivers, subscription, credit packs, and bookings."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /members/{member_id}/waivers — sign waiver (own)"
      - "POST /members/{member_id}/subscription, POST /subscriptions/{id}/{upgrade,freeze,unfreeze,cancel} — manage own subscription"
      - "POST /members/{member_id}/credit-packs — buy own pack"
      - "POST /bookings and POST /bookings/{id}/cancel — book/cancel own sessions"
      - "GET own member, subscription, packs, waivers, bookings, invoices"

  - name: Technician
    description: "Front-line staff. Acts on own dispositions (X-User-ID == Technician.id) for completing/no-showing sessions on a covering shift."
    identity: "entity_backed:Technician"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings/{id}/complete — complete session (with LocationManager)"
      - "POST /bookings/{id}/no-show — mark no-show (with LocationManager)"
      - "GET locations, service-types, rooms, technicians, shifts, bookings"
