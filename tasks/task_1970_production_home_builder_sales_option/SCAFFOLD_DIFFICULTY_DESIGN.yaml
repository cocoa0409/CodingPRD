          - state_machines.Lot.SOLD_to_RELEASED
          - calculations.lot_release_pricing
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (agreement cancellation, not
          milestone completion): cancellation (hop 1) flips the lot SOLD ->
          RELEASED (hop 2), and the re-release itself triggers the re-release
          pricing variant, raising release_price_cents by 2% and bumping
          release_count (hop 3 observable end-state on the lot).
