# =============================================================================
# PRD Benchmark Scaffold — Judgment Enforcement & Asset Search
# Task 2115 · difficulty band: Expert+ (see complexity_profile.difficulty_level)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2115. Judgment Enforcement & Asset Search (judgment recovery firm):
  judgment docketing & lien filing by county, asset investigation (property/bank/employment) & skip tracing,
  garnishment & levy execution process, debtor examination & subpoena, exemption claim response,
  installment agreement & settlement negotiation, judgment renewal before expiration,
  interest accrual & payoff calculation

domain_name: judgment-enforcement
api_prefix: ""   # flat topology: every collection is a root-level peer resource; no nesting in URL paths

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Eleven peer entities linked purely by foreign keys declared on the child.
  # No URL nesting anywhere: /judgments, /county-filings, /asset-findings, ... are all root collections,
  # and every child is discovered through a filtered list (GET /<children>?<fk_field>=...).

  state_machine_shape: cyclic
  # Non-linear shapes present:
  #   - Judgment carries TWO independent state dimensions (status x enforcement_posture) on the same row.
  #   - Judgment.enforcement_posture cycles ENFORCING -> STAYED -> ENFORCING and ENFORCING -> LIEN_PERFECTED -> ENFORCING.
  #   - CountyFiling cycles SUBMITTED -> REJECTED -> SUBMITTED (re-file after clerk rejection).
  #   - DebtorExamination cycles SCHEDULED -> SERVED -> SCHEDULED (continuance).
  #   - EnforcementAction cycles SERVED -> SUSPENDED -> SERVED (stay and resume).
  #   - InstallmentAgreement cycles ACTIVE -> DEFAULTED -> ACTIVE (reinstatement).
  #   - ExemptionClaim branches FILED -> {OPPOSED, DEFAULTED} -> {SUSTAINED, OVERRULED} with divergent side effects.

  relationship_patterns:
    - one_to_many          # Judgment -> CountyFiling / AssetFinding / EnforcementAction / SettlementOffer / Payment
    - self_referential     # SettlementOffer.responds_to_offer_id -> SettlementOffer.id (counter-offer chain)
    - cross_aggregate      # ExemptionClaim (under EnforcementAction) mutates Judgment.enforcement_posture and AssetFinding custody
    - polymorphic          # Payment.installment_agreement_id XOR Payment.enforcement_action_id attributes the same money to different producers

  role_model: segregation_of_duties
  # Two segregation rules keyed on X-User-ID (not on role): the investigator who VERIFIED an asset finding
  # may not be the officer who requests the writ against it; the officer who OPPOSED an exemption claim
  # may not be the compliance officer who rules on it.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Creditor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the judgment creditor (the recovery firm's client)
      - name: contact_email
        type: string
        source: input
        description: notification address for payoff quotes and settlement decisions
      - name: active_judgment_count
        type: integer
        source: computed
        default: 0
        description: >-
          count of Judgment rows whose creditor_id equals this Creditor.id and whose status == ACTIVE;
          recomputed on every Judgment create and on every Judgment status transition

  - name: Debtor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: judgment debtor's legal name
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the debtor's state of residence; drives the garnishment cap and the perfected-lien check
        constraints: "exactly 2 uppercase letters"
      - name: head_of_household
        type: boolean
        source: input
        default: false
        description: head-of-household declaration; combined with state_code == FL it lowers the garnishment cap to 1000 bps
      - name: weekly_disposable_earnings_cents
        type: integer
        source: input
        default: 0
        description: weekly disposable earnings in cents; overwritten by an EMPLOYMENT AssetFinding that carries weekly_disposable_earnings_cents
        constraints: ">= 0"
      - name: locate_status
        type: enum
        source: computed
        default: UNLOCATED
        description: skip-trace locate state
        constraints: "one of: UNLOCATED, LOCATED, STALE"
      - name: last_skip_trace_on
        type: datetime
        source: computed
        description: logical-clock date of the most recent skip trace; null before the first trace
      - name: skip_trace_count
        type: integer
        source: computed
        default: 0
        description: number of skip traces run against this debtor
      - name: no_show_count
        type: integer
        source: computed
        default: 0
        description: number of DebtorExamination rows on this debtor's judgments whose outcome was recorded as NO_SHOW
      - name: recoverability_score
        type: integer
        source: computed
        default: 0
        description: PRELIMINARY variant of calculations.debtor_recoverability_score (0..100)
      - name: certified_recoverability_score
        type: integer
        source: computed
        description: >-
          CERTIFIED variant of calculations.debtor_recoverability_score (0..100); null until the first
          POST /enforcement-actions/{id}/request-writ stamps it

  - name: Judgment
    parent: null
    common_fields: true
    fields:
      - name: creditor_id
        type: string
        source: input
        description: "FK -> Creditor.id; the judgment creditor of record"
      - name: debtor_id
        type: string
        source: input
        description: "FK -> Debtor.id; the judgment debtor of record"
      - name: court_case_number
        type: string
        source: input
        description: docket number assigned by the entering court
        constraints: "unique within state_code"
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the state whose court entered the judgment
        constraints: "exactly 2 uppercase letters"
      - name: original_principal_cents
        type: integer
        source: input
        description: principal amount as entered by the court, in cents
        constraints: "> 0"
      - name: interest_rate_bps
        type: integer
        source: input
        description: statutory post-judgment simple interest rate in basis points per annum
        constraints: "0 <= interest_rate_bps <= 3000"
      - name: entered_on
        type: datetime
        source: input
        description: calendar date (YYYY-MM-DD) the judgment was entered; interest accrual starts here
      - name: filing_costs_cents
        type: integer
        source: input
        default: 0
        description: recoverable court costs taxed at entry, in cents; seeds costs_balance_cents
        constraints: ">= 0"
      - name: expires_on
        type: datetime
        source: computed
        description: entered_on + 10 calendar years; each granted renewal pushes it a further 10 calendar years
      - name: principal_balance_cents
        type: integer
        source: computed
        description: unpaid principal after chronological replay through accrued_through_on
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: unpaid statutory interest after chronological replay through accrued_through_on
      - name: costs_balance_cents
        type: integer
        source: computed
        description: unpaid taxed costs (filing costs + recorded county filing fees + sheriff fees + renewal fees) after replay
      - name: total_payoff_cents
        type: integer
        source: computed
        description: principal_balance_cents + accrued_interest_cents + costs_balance_cents as of accrued_through_on
      - name: accrued_through_on
        type: datetime
        source: computed
        description: logical-clock date through which the stored balances were replayed
      - name: collected_to_date_cents
        type: integer
        source: computed
        default: 0
        description: sum of amount_cents over Payment rows on this judgment whose status == APPLIED
      - name: forgiven_cents
        type: integer
        source: computed
        default: 0
        description: balance written off when an InstallmentAgreement reaches COMPLETED for less than the then-current payoff
      - name: gross_exposure_cents
        type: integer
        source: computed
        description: >-
          principal_balance_cents + accrued_interest_cents + costs_balance_cents + collected_to_date_cents;
          the conserved quantity of the payment/reversal compensating pair
      - name: contingency_fee_cents
        type: integer
        source: computed
        default: 0
        description: recovery firm's fee from calculations.settlement_net_recovery
      - name: net_to_creditor_cents
        type: integer
        source: computed
        default: 0
        description: collected_to_date_cents - contingency_fee_cents - filing_costs_cents
      - name: application_order
        type: enum
        source: computed
        default: STATUTORY_ORDER
        description: which variant of calculations.judgment_payoff_replay applies to this judgment's payments
        constraints: "one of: STATUTORY_ORDER, PRINCIPAL_FIRST"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: lifecycle dimension of the judgment
        constraints: "one of: ACTIVE, SATISFIED, EXPIRED"
      - name: enforcement_posture
        type: enum
        source: computed
        default: NONE
        description: second, independent state dimension gating every enforcement child operation
        constraints: "one of: NONE, LIEN_PERFECTED, ENFORCING, STAYED"
      - name: renewal_count
        type: integer
        source: computed
        default: 0
        description: number of granted renewals; capped at MAX_RENEWALS
      - name: renewal_dates
        type: array
        source: system
        default: []
        description: ascending list of YYYY-MM-DD renewal dates; each one is an interest-capitalization boundary in the replay
      - name: active_enforcement_count
        type: integer
        source: computed
        default: 0
        description: count of EnforcementAction rows on this judgment whose status IN (WRIT_REQUESTED, SERVED, SUSPENDED)
      - name: open_offer_count
        type: integer
        source: computed
        default: 0
        description: count of SettlementOffer rows on this judgment whose status == OPEN
      - name: perfected_county_count
        type: integer
        source: computed
        default: 0
        description: count of CountyFiling rows on this judgment whose status == RECORDED

  - name: CountyFiling
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment being docketed/liened in this county"
      - name: county_code
        type: string
        source: input
        description: county recorder code, e.g. CA-LOS-ANGELES
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the county's state
        constraints: "exactly 2 uppercase letters"
      - name: filing_type
        type: enum
        source: input
        description: instrument being recorded
        constraints: "one of: ABSTRACT_OF_JUDGMENT, JUDGMENT_LIEN"
      - name: fee_cents
        type: integer
        source: input
        description: recorder fee in cents; added to Judgment.costs_balance_cents when the filing is RECORDED
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: filing lifecycle
        constraints: "one of: DRAFT, SUBMITTED, RECORDED, REJECTED, RELEASED, LAPSED"
      - name: submitted_on
        type: datetime
        source: computed
        description: logical-clock date of the most recent submission to the recorder
      - name: recorded_on
        type: datetime
        source: computed
        description: recorder's acceptance date supplied at adjudication
      - name: lien_expires_on
        type: datetime
        source: computed
        description: recorded_on + 10 calendar years
      - name: priority_rank
        type: integer
        source: computed
        description: 1-based lien position from calculations.lien_priority_rank; null until RECORDED
      - name: rejection_count
        type: integer
        source: computed
        default: 0
        description: number of times the recorder rejected this filing
      - name: rejection_reason
        type: string
        source: computed
        description: recorder's stated reason on the most recent rejection

  - name: AssetFinding
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment this asset was investigated for"
      - name: asset_type
        type: enum
        source: input
        description: class of asset discovered
        constraints: "one of: REAL_PROPERTY, BANK_ACCOUNT, EMPLOYMENT, VEHICLE"
      - name: institution_name
        type: string
        source: input
        description: bank, employer, county recorder, or DMV holding the asset
      - name: identifier_last4
        type: string
        source: input
        description: last four characters of the account/parcel/plate identifier
      - name: estimated_value_cents
        type: integer
        source: input
        description: investigator's valuation in cents; the custody total that available_cents + frozen_cents must always equal
        constraints: ">= 0"
      - name: available_cents
        type: integer
        source: computed
        description: portion of estimated_value_cents not currently under levy hold; initialised to estimated_value_cents
      - name: frozen_cents
        type: integer
        source: computed
        default: 0
        description: portion of estimated_value_cents currently held by a served BANK_LEVY
      - name: swept_cents
        type: integer
        source: computed
        default: 0
        description: >-
          portion of estimated_value_cents permanently removed from the asset by collected levies; the
          three-way custody identity available_cents + frozen_cents + swept_cents == estimated_value_cents
          holds at every instant
      - name: source
        type: enum
        source: input
        description: investigative channel that produced the finding
        constraints: "one of: SKIP_TRACE, PUBLIC_RECORD, CREDIT_HEADER, DEBTOR_EXAM"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: evidentiary state of the finding
        constraints: "one of: OPEN, VERIFIED, STALE, EXHAUSTED"
      - name: verified_by_user_id
        type: string
        source: computed
        description: >-
          opaque X-User-ID of the AssetInvestigator who verified this finding (NOT a foreign key to any
          persisted entity); compared against the writ requester's X-User-ID by the segregation-of-duties rule
      - name: verified_on
        type: datetime
        source: computed
        description: logical-clock date of verification
      - name: weekly_disposable_earnings_cents
        type: integer
        source: input
        description: >-
          for asset_type == EMPLOYMENT only, the weekly disposable earnings this finding establishes;
          copied onto Debtor.weekly_disposable_earnings_cents on creation
        constraints: ">= 0 when asset_type == EMPLOYMENT; must be omitted otherwise"

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment being enforced"
      - name: asset_finding_id
        type: string
        source: input
        description: "FK -> AssetFinding.id; the asset this writ reaches"
      - name: action_type
        type: enum
        source: input
        description: enforcement instrument
        constraints: "one of: WAGE_GARNISHMENT, BANK_LEVY"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: enforcement lifecycle
        constraints: "one of: DRAFT, WRIT_REQUESTED, SERVED, SUSPENDED, COLLECTED, RELEASED, QUASHED"
      - name: writ_requested_on
        type: datetime
        source: computed
        description: logical-clock date the writ was requested
      - name: writ_requested_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the EnforcementOfficer who requested the writ (NOT a foreign key)
      - name: served_on
        type: datetime
        source: computed
        description: calendar date of service supplied at serve time; start of the half-open occupation interval
      - name: expires_on
        type: datetime
        source: computed
        description: served_on + LEVY_TERM_DAYS; exclusive end of the half-open occupation interval
      - name: levy_hold_cents
        type: integer
        source: computed
        default: 0
        description: funds frozen on the linked BANK_ACCOUNT finding, from calculations.bank_levy_hold
      - name: weekly_withholding_cents
        type: integer
        source: computed
        default: 0
        description: weekly wage withholding from calculations.wage_garnishment_withholding
      - name: collected_cents
        type: integer
        source: computed
        default: 0
        description: sum of amount_cents over APPLIED Payment rows whose enforcement_action_id is this action
      - name: sheriff_fee_cents
        type: integer
        source: computed
        default: 0
        description: SHERIFF_FEE_CENTS charged to Judgment.costs_balance_cents at service; never refunded on release

  - name: ExemptionClaim
    parent: null
    common_fields: true
    fields:
      - name: enforcement_action_id
        type: string
        source: input
        description: "FK -> EnforcementAction.id; the served writ this claim attacks"
      - name: claim_type
        type: enum
        source: input
        description: statutory exemption asserted
        constraints: "one of: HEAD_OF_HOUSEHOLD, SOCIAL_SECURITY, WAGE_CAP, HOMESTEAD"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: amount the debtor asserts is exempt, in cents
        constraints: "> 0"
      - name: filed_on
        type: datetime
        source: computed
        description: logical-clock date the claim was filed
      - name: filing_deadline_on
        type: datetime
        source: computed
        description: EnforcementAction.served_on + EXEMPTION_RESPONSE_DAYS; inclusive last day to file
      - name: opposition_deadline_on
        type: datetime
        source: computed
        description: filed_on + OPPOSITION_RESPONSE_DAYS; inclusive last day for the creditor to oppose
      - name: opposed_on
        type: datetime
        source: computed
        description: logical-clock date the creditor opposed
      - name: opposed_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the EnforcementOfficer who opposed (NOT a foreign key)
      - name: ruled_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the ComplianceOfficer who ruled (NOT a foreign key)
      - name: status
        type: enum
        source: computed
        default: FILED
        description: claim lifecycle
        constraints: "one of: FILED, OPPOSED, SUSTAINED, OVERRULED, DEFAULTED"

  - name: DebtorExamination
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment under which the debtor is examined (the debtor is Judgment.debtor_id)"
      - name: scheduled_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the debtor must appear
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: examination lifecycle
        constraints: "one of: SCHEDULED, SERVED, HELD, NO_SHOW"
      - name: served_on
        type: datetime
        source: computed
        description: calendar date the appearance order was served on the debtor
      - name: continuance_count
        type: integer
        source: computed
        default: 0
        description: number of times the examination was continued to a new date; capped at MAX_CONTINUANCES
      - name: outcome_recorded_on
        type: datetime
        source: computed
        description: logical-clock date the terminal outcome (HELD or NO_SHOW) was recorded
      - name: subpoena_status
        type: enum
        source: computed
        default: NOT_ISSUED
        description: second, independent state dimension on the same row, tracking the duces-tecum subpoena
        constraints: "one of: NOT_ISSUED, ISSUED, SERVED, EXPIRED"
      - name: subpoena_recipient_type
        type: enum
        source: computed
        description: who the subpoena commands
        constraints: "one of: DEBTOR, THIRD_PARTY_BANK, EMPLOYER"
      - name: subpoena_recipient_name
        type: string
        source: computed
        description: named recipient of the subpoena
      - name: subpoena_service_deadline_on
        type: datetime
        source: computed
        description: calendar date of scheduled_at minus SUBPOENA_LEAD_DAYS; the subpoena must be issued on or before this date

  - name: SettlementOffer
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment being negotiated"
      - name: responds_to_offer_id
        type: string
        source: input
        description: "FK -> SettlementOffer.id; the offer this one counters; null for the opening offer of a negotiation"
      - name: offered_by
        type: enum
        source: input
        description: which side tendered this offer; must alternate down the counter chain
        constraints: "one of: CREDITOR, DEBTOR"
      - name: kind
        type: enum
        source: input
        description: settlement structure
        constraints: "one of: LUMP_SUM, INSTALLMENT"
      - name: amount_cents
        type: integer
        source: input
        description: total settlement amount tendered, in cents
        constraints: "> 0"
      - name: installment_count
        type: integer
        source: input
        default: 1
        description: number of monthly installments; forced to 1 when kind == LUMP_SUM
        constraints: ">= 1 and <= 60"
      - name: application_order_concession
        type: enum
        source: input
        default: STATUTORY_ORDER
        description: the payment-application order the creditor concedes if this offer is accepted
        constraints: "one of: STATUTORY_ORDER, PRINCIPAL_FIRST"
      - name: expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant after which the clock sweep expires this offer
      - name: round_number
        type: integer
        source: computed
        description: 1 for an opening offer, otherwise responds_to_offer.round_number + 1; capped at MAX_NEGOTIATION_ROUNDS
      - name: monthly_cents
        type: integer
        source: computed
        description: ceil(amount_cents / installment_count)
      - name: min_acceptable_cents
        type: integer
        source: computed
        description: floor(Judgment.total_payoff_cents * MIN_SETTLEMENT_PCT_BPS / 10000) snapshotted at creation
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: offer lifecycle
        constraints: "one of: OPEN, COUNTERED, ACCEPTED, REJECTED, EXPIRED"
      - name: decided_at
        type: datetime
        source: computed
        description: logical-clock instant the offer left OPEN

  - name: InstallmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment the agreement settles"
      - name: settlement_offer_id
        type: string
        source: input
        description: "FK -> SettlementOffer.id; the accepted offer that produced this agreement"
      - name: total_cents
        type: integer
        source: computed
        description: copied from the accepted SettlementOffer.amount_cents
      - name: installment_count
        type: integer
        source: computed
        description: copied from the accepted SettlementOffer.installment_count
      - name: monthly_cents
        type: integer
        source: computed
        description: ceil(total_cents / installment_count)
      - name: final_installment_cents
        type: integer
        source: computed
        description: total_cents - monthly_cents * (installment_count - 1)
      - name: first_due_on
        type: datetime
        source: computed
        description: acceptance date + INSTALLMENT_FIRST_DUE_DAYS
      - name: paid_to_date_cents
        type: integer
        source: computed
        default: 0
        description: sum of amount_cents over APPLIED Payment rows whose installment_agreement_id is this agreement
      - name: missed_count
        type: integer
        source: computed
        default: 0
        description: recorded missed installments; reaching MAX_MISSES defaults the agreement
      - name: reinstatement_count
        type: integer
        source: computed
        default: 0
        description: number of times a DEFAULTED agreement was reinstated; capped at MAX_REINSTATEMENTS
      - name: application_order_concession
        type: enum
        source: computed
        description: copied from the accepted SettlementOffer; drives Judgment.application_order while ACTIVE
        constraints: "one of: STATUTORY_ORDER, PRINCIPAL_FIRST"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: agreement lifecycle
        constraints: "one of: ACTIVE, COMPLETED, DEFAULTED, TERMINATED"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: judgment_id
        type: string
        source: input
        description: "FK -> Judgment.id; the judgment credited"
      - name: installment_agreement_id
        type: string
        source: input
        description: "FK -> InstallmentAgreement.id; set when the payment is an installment; null otherwise"
      - name: enforcement_action_id
        type: string
        source: input
        description: "FK -> EnforcementAction.id; set when the payment is a garnishment or levy remittance; null otherwise"
      - name: amount_cents
        type: integer
        source: input
        description: gross amount received, in cents
        constraints: "> 0"
      - name: received_on
        type: datetime
        source: input
        description: calendar date the money was received; the chronological replay key (payments may be recorded out of order)
      - name: source
        type: enum
        source: input
        description: channel the money arrived through
        constraints: "one of: DEBTOR_DIRECT, GARNISHMENT, LEVY, SETTLEMENT"
      - name: status
        type: enum
        source: computed
        default: APPLIED
        description: whether this payment participates in the replay
        constraints: "one of: APPLIED, REVERSED"
      - name: applied_to_costs_cents
        type: integer
        source: computed
        description: portion of amount_cents absorbed by costs in the replay
      - name: applied_to_interest_cents
        type: integer
        source: computed
        description: portion of amount_cents absorbed by accrued interest in the replay
      - name: applied_to_principal_cents
        type: integer
        source: computed
        description: portion of amount_cents absorbed by principal in the replay
      - name: contingency_fee_cents
        type: integer
        source: computed
        description: this payment's own rounded contingency slice from calculations.settlement_net_recovery
      - name: reversal_reason
        type: string
        source: computed
        description: reason recorded when the payment was reversed
      - name: reversed_on
        type: datetime
        source: computed
        description: logical-clock date of reversal

# =============================================================================
# 1.2 State Machine Table
# Nine machines. Judgment and DebtorExamination each carry TWO independent state
# dimensions on the same row (parallel dimensions); CountyFiling, EnforcementAction,
# InstallmentAgreement and Judgment.enforcement_posture contain cycles.
# =============================================================================
state_machines:

  # --- Judgment, dimension 1 of 2 ------------------------------------------
  - entity: Judgment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SATISFIED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SATISFIED
        trigger: "system, at the end of POST /payments or POST /payments/{payment_id}/reverse, when the replayed total_payoff_cents reaches 0"
        actor: system
        preconditions:
          - "after replay, principal_balance_cents == 0 AND accrued_interest_cents == 0 AND costs_balance_cents == 0"
        side_effects:
          - "sets Judgment.enforcement_posture = NONE"
          - "hop 1: every CountyFiling with judgment_id == this judgment and status == RECORDED moves to RELEASED (processed in created_at ASC order)"
          - "hop 2: because those filings left RECORDED, Judgment.perfected_county_count is recomputed to 0"
          - "every EnforcementAction with judgment_id == this judgment and status IN (WRIT_REQUESTED, SERVED, SUSPENDED) moves to RELEASED (created_at ASC), each releasing its levy_hold_cents back to its AssetFinding"
          - "every InstallmentAgreement with judgment_id == this judgment and status == ACTIVE moves to COMPLETED"
          - "Creditor.active_judgment_count decremented by 1"
          - "increments Judgment.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — sweep step 1, for every ACTIVE judgment whose expires_on <= the new clock date"
        actor: system
        preconditions:
          - "Judgment.expires_on <= new logical-clock calendar date"
        side_effects:
          - "sets Judgment.enforcement_posture = NONE"
          - "hop 1: every CountyFiling with status == RECORDED moves to LAPSED (created_at ASC)"
          - "hop 2: every EnforcementAction with status IN (WRIT_REQUESTED, SERVED, SUSPENDED) moves to RELEASED (created_at ASC); DRAFT actions are left untouched"
          - "hop 3: each such release credits its levy_hold_cents back to AssetFinding.available_cents and zeroes AssetFinding.frozen_cents contribution, then sets Judgment.active_enforcement_count = 0"
          - "every InstallmentAgreement with status == ACTIVE moves to TERMINATED"
          - "Creditor.active_judgment_count decremented by 1"
          - "increments Judgment.version by 1"
        note: "renewal is the only way to avoid this; see POST /judgments/{judgment_id}/renew"

  # --- Judgment, dimension 2 of 2 (independent axis on the same row) --------
  - entity: Judgment
    state_field: enforcement_posture
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: LIEN_PERFECTED
        trigger: "POST /county-filings/{county_filing_id}/adjudicate with outcome == RECORDED"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
          - "the filing's state_code equals the Debtor.state_code reached through Judgment.debtor_id"
        side_effects:
          - "Judgment.perfected_county_count incremented by 1"
          - "Judgment.costs_balance_cents increased by CountyFiling.fee_cents, then balances replayed to the current clock date"
          - "increments Judgment.version by 1"
      - from: LIEN_PERFECTED
        to: ENFORCING
        trigger: "POST /enforcement-actions/{enforcement_action_id}/serve"
        actor: EnforcementOfficer
        preconditions:
          - "Judgment.enforcement_posture == LIEN_PERFECTED"
        side_effects:
          - "Judgment.active_enforcement_count incremented by 1"
          - "increments Judgment.version by 1"
      - from: ENFORCING
        to: STAYED
        trigger: "POST /settlement-offers/{settlement_offer_id}/accept, or POST /installment-agreements/{installment_agreement_id}/reinstate"
        actor: system
        preconditions:
          - "an InstallmentAgreement on this judgment has just entered status ACTIVE"
        side_effects:
          - "every EnforcementAction on this judgment with status == SERVED moves to SUSPENDED (created_at ASC); levy holds are NOT released while suspended"
          - "Judgment.application_order is set to the agreement's application_order_concession"
          - "increments Judgment.version by 1"
        note: >-
          The stay fires ONLY from ENFORCING. A judgment whose posture is NONE or LIEN_PERFECTED when an
          InstallmentAgreement activates keeps that posture unchanged (no EnforcementAction on it is in status SERVED),
          but Judgment.application_order still switches to the agreement's concession.
      - from: STAYED
        to: ENFORCING
        trigger: "POST /installment-agreements/{installment_agreement_id}/record-miss that drives missed_count to MAX_MISSES"
        actor: system
        preconditions:
          - "the judgment's only ACTIVE InstallmentAgreement has just entered status DEFAULTED"
        side_effects:
          - "every EnforcementAction on this judgment with status == SUSPENDED returns to SERVED (created_at ASC)"
          - "Judgment.application_order reverts to STATUTORY_ORDER"
          - "increments Judgment.version by 1"
      - from: ENFORCING
        to: LIEN_PERFECTED
        trigger: "system, whenever an EnforcementAction on this judgment reaches COLLECTED, RELEASED or QUASHED"
        actor: system
        preconditions:
          - "Judgment.active_enforcement_count reaches 0 after the transition"
          - "Judgment.perfected_county_count >= 1"
        side_effects:
          - "increments Judgment.version by 1"
      - from: LIEN_PERFECTED
        to: NONE
        trigger: "system, on Judgment.status ACTIVE -> SATISFIED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Judgment.status has just left ACTIVE"
        side_effects:
          - "Judgment.perfected_county_count recomputed to 0"
      - from: ENFORCING
        to: NONE
        trigger: "system, on Judgment.status ACTIVE -> SATISFIED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Judgment.status has just left ACTIVE"
        side_effects:
          - "Judgment.active_enforcement_count recomputed to 0"
      - from: STAYED
        to: NONE
        trigger: "system, on Judgment.status ACTIVE -> SATISFIED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Judgment.status has just left ACTIVE"
        side_effects:
          - "the ACTIVE InstallmentAgreement moves to COMPLETED (on SATISFIED) or TERMINATED (on EXPIRED)"

  # --- CountyFiling: cyclic (SUBMITTED -> REJECTED -> SUBMITTED) ------------
  - entity: CountyFiling
    state_field: status
    initial_state: DRAFT
    terminal_states: [RELEASED, LAPSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /county-filings/{county_filing_id}/submit"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
          - "no other CountyFiling with the same judgment_id, county_code and filing_type is in status DRAFT, SUBMITTED or RECORDED"
        side_effects:
          - "sets submitted_on to the current logical-clock calendar date"
      - from: SUBMITTED
        to: RECORDED
        trigger: "POST /county-filings/{county_filing_id}/adjudicate with outcome == RECORDED"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
          - "recorded_on is supplied and lies in [submitted_on, current clock date]"
        side_effects:
          - "renumbers every RECORDED CountyFiling sharing this filing's (county_code, state_code) via calculations.lien_priority_rank, which may demote a peer recorded earlier on the same date"
          - "sets lien_expires_on = recorded_on + 10 calendar years"
          - "hop 1: adds fee_cents to Judgment.costs_balance_cents and replays Judgment balances to the current clock date"
          - "hop 2: because Judgment.perfected_county_count rises from 0 to 1, Judgment.enforcement_posture moves NONE -> LIEN_PERFECTED"
          - "increments Judgment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /county-filings/{county_filing_id}/adjudicate with outcome == REJECTED"
        actor: CaseManager
        preconditions:
          - "rejection_reason is supplied"
        side_effects:
          - "rejection_count incremented by 1"
          - "records rejection_reason; Judgment.costs_balance_cents is NOT changed"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /county-filings/{county_filing_id}/submit (re-file after correcting the defect)"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
        side_effects:
          - "sets submitted_on to the current logical-clock calendar date"
        note: "the cycle: a filing may bounce between SUBMITTED and REJECTED any number of times"
      - from: RECORDED
        to: RELEASED
        trigger: "system, on Judgment.status ACTIVE -> SATISFIED"
        actor: system
        preconditions:
          - "Judgment.status has just become SATISFIED"
        side_effects:
          - "Judgment.perfected_county_count decremented by 1"
      - from: RECORDED
        to: LAPSED
        trigger: "POST /_clock/set_current_utc — sweep step 1, on Judgment.status ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Judgment.status has just become EXPIRED"
        side_effects:
          - "Judgment.perfected_county_count decremented by 1"

  # --- AssetFinding --------------------------------------------------------
  - entity: AssetFinding
    state_field: status
    initial_state: OPEN
    terminal_states: [EXHAUSTED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /asset-findings/{asset_finding_id}/verify"
        actor: AssetInvestigator
        preconditions:
          - "AssetFinding.status == OPEN"
          - "Judgment.status == ACTIVE"
        side_effects:
          - "stamps verified_by_user_id with the caller's X-User-ID and verified_on with the clock date"
          - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"
      - from: OPEN
        to: STALE
        trigger: "POST /debtors/{debtor_id}/skip-trace (supersede sweep)"
        actor: system
        preconditions:
          - "AssetFinding.source == SKIP_TRACE"
          - "the finding hangs off a Judgment whose debtor_id is the traced debtor"
        side_effects:
          - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"
      - from: VERIFIED
        to: STALE
        trigger: "POST /debtors/{debtor_id}/skip-trace (supersede sweep)"
        actor: system
        preconditions:
          - "AssetFinding.source == SKIP_TRACE"
          - "the finding hangs off a Judgment whose debtor_id is the traced debtor"
        side_effects:
          - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"
      - from: VERIFIED
        to: EXHAUSTED
        trigger: "POST /exemption-claims/{exemption_claim_id}/rule with outcome == SUSTAINED, or the clock sweep defaulting the claim, when claim_type == HEAD_OF_HOUSEHOLD or HOMESTEAD"
        actor: system
        preconditions:
          - "the linked EnforcementAction has just moved to QUASHED"
          - "ExemptionClaim.claim_type IN (HEAD_OF_HOUSEHOLD, HOMESTEAD)"
        side_effects:
          - "recomputes Debtor.recoverability_score (PRELIMINARY variant); an EXHAUSTED finding contributes 0"
      - from: STALE
        to: VERIFIED
        trigger: "POST /asset-findings/{asset_finding_id}/verify (re-verification after a superseding trace)"
        actor: AssetInvestigator
        preconditions:
          - "AssetFinding.status == STALE"
          - "Judgment.status == ACTIVE"
        side_effects:
          - "re-stamps verified_by_user_id with the caller's X-User-ID and verified_on with the clock date"
          - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"

  # --- EnforcementAction: cyclic (SERVED -> SUSPENDED -> SERVED) ------------
  - entity: EnforcementAction
    state_field: status
    initial_state: DRAFT
    terminal_states: [COLLECTED, RELEASED, QUASHED]
    transitions:
      - from: DRAFT
        to: WRIT_REQUESTED
        trigger: "POST /enforcement-actions/{enforcement_action_id}/request-writ"
        actor: EnforcementOfficer
        preconditions:
          - "Judgment.status == ACTIVE"
          - "caller's X-User-ID != AssetFinding.verified_by_user_id (segregation of duties)"
          - "Judgment.enforcement_posture IN (LIEN_PERFECTED, ENFORCING)"
          - "AssetFinding.status == VERIFIED"
          - "for WAGE_GARNISHMENT: calculations.wage_garnishment_withholding yields > 0"
          - "for BANK_LEVY: calculations.bank_levy_hold yields > 0"
        side_effects:
          - "stamps writ_requested_on and writ_requested_by_user_id"
          - "stores weekly_withholding_cents (WAGE_GARNISHMENT) or leaves levy_hold_cents at 0 until service (BANK_LEVY)"
          - "stamps Debtor.certified_recoverability_score with the CERTIFIED variant of calculations.debtor_recoverability_score"
          - "Judgment.active_enforcement_count incremented by 1"
      - from: WRIT_REQUESTED
        to: SERVED
        trigger: "POST /enforcement-actions/{enforcement_action_id}/serve"
        actor: EnforcementOfficer
        preconditions:
          - "Judgment.status == ACTIVE"
          - "Judgment.enforcement_posture != STAYED"
          - "served_on lies in [writ_requested_on, current clock date]"
          - "no other EnforcementAction on the same asset_finding_id in status SERVED or SUSPENDED has a half-open interval [served_on, expires_on) overlapping [this.served_on, this.served_on + LEVY_TERM_DAYS)"
        side_effects:
          - "sets expires_on = served_on + LEVY_TERM_DAYS"
          - "for BANK_LEVY: sets levy_hold_cents from calculations.bank_levy_hold, evaluated against the payoff as of the current clock date BEFORE the sheriff fee is added, then moves that many cents from AssetFinding.available_cents into AssetFinding.frozen_cents"
          - "only afterwards sets sheriff_fee_cents = SHERIFF_FEE_CENTS, adds it to Judgment.costs_balance_cents and replays Judgment balances"
          - "hop: if Judgment.enforcement_posture == LIEN_PERFECTED it moves to ENFORCING"
          - "increments Judgment.version by 1"
      - from: SERVED
        to: SUSPENDED
        trigger: "system, when Judgment.enforcement_posture moves ENFORCING -> STAYED"
        actor: system
        preconditions:
          - "an InstallmentAgreement on the same judgment has just entered status ACTIVE"
        side_effects:
          - "levy_hold_cents and the AssetFinding custody split are left exactly as they are"
      - from: SUSPENDED
        to: SERVED
        trigger: "system, when Judgment.enforcement_posture moves STAYED -> ENFORCING"
        actor: system
        preconditions:
          - "the judgment's InstallmentAgreement has just entered status DEFAULTED"
        side_effects:
          - "no custody change"
        note: "the cycle: a levy may be stayed and resumed repeatedly as agreements default and are reinstated"
      - from: SERVED
        to: COLLECTED
        trigger: "POST /payments carrying this enforcement_action_id"
        actor: CaseManager
        preconditions:
          - "no ExemptionClaim on this action is in status FILED or OPPOSED"
          - "Payment.amount_cents plus collected_cents reaches levy_hold_cents (BANK_LEVY) or the payment source is GARNISHMENT"
        side_effects:
          - "collected_cents increased by the payment amount"
          - "for BANK_LEVY: AssetFinding.frozen_cents is reduced by levy_hold_cents and AssetFinding.swept_cents is increased by the same amount; available_cents is untouched, so available + frozen + swept still equals estimated_value_cents"
          - "EnforcementAction.levy_hold_cents is set to 0"
          - "hop 1: Judgment.active_enforcement_count decremented by 1"
          - "hop 2: if active_enforcement_count reaches 0, Judgment.enforcement_posture moves ENFORCING -> LIEN_PERFECTED"
      - from: SERVED
        to: RELEASED
        trigger: "POST /enforcement-actions/{enforcement_action_id}/release"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementAction.status IN (WRIT_REQUESTED, SERVED, SUSPENDED)"
        side_effects:
          - "returns levy_hold_cents from AssetFinding.frozen_cents to AssetFinding.available_cents and sets levy_hold_cents = 0"
          - "sheriff_fee_cents already charged to Judgment.costs_balance_cents is NOT refunded"
          - "hop 1: Judgment.active_enforcement_count decremented by 1"
          - "hop 2: if active_enforcement_count reaches 0, Judgment.enforcement_posture moves ENFORCING -> LIEN_PERFECTED"
      - from: WRIT_REQUESTED
        to: RELEASED
        trigger: "POST /enforcement-actions/{enforcement_action_id}/release"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementAction.status == WRIT_REQUESTED"
        side_effects:
          - "Judgment.active_enforcement_count decremented by 1"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /enforcement-actions/{enforcement_action_id}/release"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementAction.status == SUSPENDED"
        side_effects:
          - "returns levy_hold_cents from AssetFinding.frozen_cents to AssetFinding.available_cents and sets levy_hold_cents = 0"
          - "Judgment.active_enforcement_count decremented by 1"
      - from: SERVED
        to: QUASHED
        trigger: "POST /exemption-claims/{exemption_claim_id}/rule with outcome == SUSTAINED, or POST /_clock/set_current_utc sweep step 2 defaulting an unopposed claim"
        actor: system
        preconditions:
          - "an ExemptionClaim on this action has just reached SUSTAINED or DEFAULTED"
        side_effects:
          - "returns levy_hold_cents from AssetFinding.frozen_cents to AssetFinding.available_cents and sets levy_hold_cents = 0"
          - "sets weekly_withholding_cents = 0"
          - "hop 1: the linked AssetFinding moves VERIFIED -> EXHAUSTED when claim_type IN (HEAD_OF_HOUSEHOLD, HOMESTEAD), otherwise it stays VERIFIED"
          - "hop 2: Judgment.active_enforcement_count decremented by 1"
          - "hop 3: if active_enforcement_count reaches 0, Judgment.enforcement_posture moves ENFORCING -> LIEN_PERFECTED"
      - from: SUSPENDED
        to: QUASHED
        trigger: "POST /exemption-claims/{exemption_claim_id}/rule with outcome == SUSTAINED"
        actor: system
        preconditions:
          - "an ExemptionClaim on this action has just reached SUSTAINED"
        side_effects:
          - "returns levy_hold_cents from AssetFinding.frozen_cents to AssetFinding.available_cents and sets levy_hold_cents = 0"
          - "Judgment.active_enforcement_count decremented by 1"

  # --- ExemptionClaim: branching fork with divergent side-effect sets -------
  - entity: ExemptionClaim
    state_field: status
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED, DEFAULTED]
    transitions:
      - from: FILED
        to: OPPOSED
        trigger: "POST /exemption-claims/{exemption_claim_id}/oppose"
        actor: EnforcementOfficer
        preconditions:
          - "ExemptionClaim.status == FILED — the clock sweep (step 2) has already moved every claim whose opposition_deadline_on has passed to DEFAULTED, so reaching this transition at all proves the window is still open"
          - "the linked EnforcementAction status IN (SERVED, SUSPENDED)"
        side_effects:
          - "stamps opposed_on and opposed_by_user_id with the caller's X-User-ID"
      - from: FILED
        to: DEFAULTED
        trigger: "POST /_clock/set_current_utc — sweep step 2, for every FILED claim whose opposition_deadline_on < the new clock date"
        actor: system
        preconditions:
          - "opposition_deadline_on < new logical-clock calendar date"
        side_effects:
          - "hop 1: the linked EnforcementAction moves SERVED -> QUASHED"
          - "hop 2: that quash returns levy_hold_cents to AssetFinding.available_cents and, for claim_type IN (HEAD_OF_HOUSEHOLD, HOMESTEAD), moves the AssetFinding VERIFIED -> EXHAUSTED"
          - "hop 3: Judgment.active_enforcement_count decremented by 1 and, when it reaches 0, Judgment.enforcement_posture moves ENFORCING -> LIEN_PERFECTED"
        note: "an unopposed claim is granted by default — same outcome as SUSTAINED"
      - from: OPPOSED
        to: SUSTAINED
        trigger: "POST /exemption-claims/{exemption_claim_id}/rule with outcome == SUSTAINED"
        actor: ComplianceOfficer
        preconditions:
          - "caller's X-User-ID != ExemptionClaim.opposed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps ruled_by_user_id"
          - "hop 1: the linked EnforcementAction moves SERVED (or SUSPENDED) -> QUASHED"
          - "hop 2: the quash returns levy_hold_cents to AssetFinding.available_cents and, for claim_type IN (HEAD_OF_HOUSEHOLD, HOMESTEAD), moves the AssetFinding VERIFIED -> EXHAUSTED"
          - "hop 3: Judgment.active_enforcement_count decremented by 1 and, when it reaches 0, Judgment.enforcement_posture moves ENFORCING -> LIEN_PERFECTED"
      - from: OPPOSED
        to: OVERRULED
        trigger: "POST /exemption-claims/{exemption_claim_id}/rule with outcome == OVERRULED"
        actor: ComplianceOfficer
        preconditions:
          - "caller's X-User-ID != ExemptionClaim.opposed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps ruled_by_user_id"
          - "the linked EnforcementAction keeps its status, its levy_hold_cents and the AssetFinding custody split unchanged"
          - "no change to Judgment.active_enforcement_count or Judgment.enforcement_posture"
        note: "divergent branch: SUSTAINED unwinds the levy end-to-end, OVERRULED touches nothing but this row"

  # --- DebtorExamination, dimension 1 of 2: cyclic SCHEDULED -> SERVED -> SCHEDULED
  - entity: DebtorExamination
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: SERVED
        trigger: "POST /debtor-examinations/{examination_id}/serve"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
          - "the Debtor reached through Judgment.debtor_id has locate_status == LOCATED"
          - "served_on lies in [current clock date - 30 days, current clock date]"
        side_effects:
          - "stamps served_on"
          - "if subpoena_status == ISSUED it moves to SERVED on the same call"
      - from: SERVED
        to: HELD
        trigger: "POST /debtor-examinations/{examination_id}/record-outcome with outcome == HELD"
        actor: CaseManager
        preconditions:
          - "DebtorExamination.status == SERVED"
        side_effects:
          - "stamps outcome_recorded_on"
      - from: SERVED
        to: NO_SHOW
        trigger: "POST /debtor-examinations/{examination_id}/record-outcome with outcome == NO_SHOW"
        actor: CaseManager
        preconditions:
          - "DebtorExamination.status == SERVED"
        side_effects:
          - "stamps outcome_recorded_on"
          - "hop 1: Debtor.no_show_count incremented by 1"
          - "hop 2: because no_show_count changed, Debtor.recoverability_score is recomputed (PRELIMINARY variant)"
      - from: SERVED
        to: SCHEDULED
        trigger: "POST /debtor-examinations/{examination_id}/record-outcome with outcome == CONTINUED and a new_scheduled_at"
        actor: CaseManager
        preconditions:
          - "continuance_count < MAX_CONTINUANCES"
          - "new_scheduled_at is at least EXAM_COOLING_DAYS away from the scheduled_at of every OTHER DebtorExamination on the same debtor whose status IN (SCHEDULED, SERVED)"
        side_effects:
          - "scheduled_at replaced by new_scheduled_at; continuance_count incremented by 1; served_on cleared"
          - "subpoena_service_deadline_on recomputed as date(new_scheduled_at) - SUBPOENA_LEAD_DAYS"
        note: "the cycle: SCHEDULED -> SERVED -> SCHEDULED, at most MAX_CONTINUANCES times"

  # --- DebtorExamination, dimension 2 of 2 (independent axis on the same row)
  - entity: DebtorExamination
    state_field: subpoena_status
    initial_state: NOT_ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: NOT_ISSUED
        to: ISSUED
        trigger: "POST /debtor-examinations/{examination_id}/subpoena"
        actor: CaseManager
        preconditions:
          - "DebtorExamination.status == SCHEDULED"
          - "current clock date <= subpoena_service_deadline_on"
        side_effects:
          - "stamps subpoena_recipient_type and subpoena_recipient_name"
      - from: ISSUED
        to: SERVED
        trigger: "POST /debtor-examinations/{examination_id}/serve"
        actor: CaseManager
        preconditions:
          - "the examination's own status dimension moves SCHEDULED -> SERVED on the same call"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — sweep step 4"
        actor: system
        preconditions:
          - "the examination's status dimension is still SCHEDULED"
          - "subpoena_service_deadline_on < new logical-clock calendar date"
        side_effects: []

  # --- SettlementOffer: negotiation rounds ---------------------------------
  - entity: SettlementOffer
    state_field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, COUNTERED]
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /settlement-offers with responds_to_offer_id pointing at this offer"
        actor: system
        preconditions:
          - "this offer's status == OPEN"
          - "the new offer's offered_by differs from this offer's offered_by"
          - "the new offer's round_number <= MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "stamps decided_at; Judgment.open_offer_count is left unchanged (one closes, one opens)"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /settlement-offers/{settlement_offer_id}/accept"
        actor: CaseManager
        preconditions:
          - "Judgment.status == ACTIVE"
          - >-
            the accepting side is the side that did NOT tender the offer. Side is fixed by role:
            CaseManager, ComplianceOfficer and Creditor act for the CREDITOR side; Debtor acts for the
            DEBTOR side. An offer with offered_by == CREDITOR may therefore only be accepted by the
            Debtor role, and an offer with offered_by == DEBTOR only by CaseManager, ComplianceOfficer
            or Creditor. A violation is ERR_INVALID_STATE.
          - "amount_cents >= min_acceptable_cents, unless the acting role is ComplianceOfficer"
        side_effects:
          - "stamps decided_at; Judgment.open_offer_count decremented by 1"
          - "hop 1: creates an InstallmentAgreement in status ACTIVE with total_cents = amount_cents, installment_count = this offer's installment_count, first_due_on = clock date + INSTALLMENT_FIRST_DUE_DAYS"
          - "hop 2: because that agreement is ACTIVE, Judgment.enforcement_posture moves ENFORCING -> STAYED and Judgment.application_order becomes the agreement's application_order_concession"
          - "hop 3: because the posture became STAYED, every EnforcementAction on the judgment in status SERVED moves to SUSPENDED (created_at ASC)"
          - "every OTHER SettlementOffer on the same judgment still in status OPEN moves to REJECTED (created_at ASC)"
          - "increments Judgment.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /settlement-offers/{settlement_offer_id}/reject, or a sibling offer on the same judgment being accepted"
        actor: CaseManager
        preconditions:
          - "this offer's status == OPEN"
        side_effects:
          - "stamps decided_at; Judgment.open_offer_count decremented by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — sweep step 3, for every OPEN offer whose expires_at <= the new clock instant"
        actor: system
        preconditions:
          - "expires_at <= new logical-clock instant"
        side_effects:
          - "stamps decided_at; Judgment.open_offer_count decremented by 1"

  # --- InstallmentAgreement: cyclic ACTIVE -> DEFAULTED -> ACTIVE ----------
  - entity: InstallmentAgreement
    state_field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /installment-agreements/{installment_agreement_id}/record-miss driving missed_count to MAX_MISSES"
        actor: CaseManager
        preconditions:
          - "missed_count + 1 >= MAX_MISSES"
        side_effects:
          - "hop 1: Judgment.enforcement_posture moves STAYED -> ENFORCING and Judgment.application_order reverts to STATUTORY_ORDER"
          - "hop 2: because the posture returned to ENFORCING, every EnforcementAction on the judgment in status SUSPENDED returns to SERVED (created_at ASC)"
          - "hop 3: Judgment balances are replayed under the reverted application_order, changing principal_balance_cents and accrued_interest_cents"
          - "increments Judgment.version by 1"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /installment-agreements/{installment_agreement_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "reinstatement_count < MAX_REINSTATEMENTS"
          - "Judgment.status == ACTIVE"
        side_effects:
          - "missed_count reset to 0; reinstatement_count incremented by 1"
          - "hop 1: Judgment.enforcement_posture moves ENFORCING -> STAYED and Judgment.application_order becomes application_order_concession again"
          - "hop 2: every EnforcementAction on the judgment in status SERVED moves to SUSPENDED (created_at ASC)"
          - "increments Judgment.version by 1"
        note: "the cycle: ACTIVE -> DEFAULTED -> ACTIVE, at most MAX_REINSTATEMENTS times"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, at the end of POST /payments when paid_to_date_cents reaches total_cents"
        actor: system
        preconditions:
          - "paid_to_date_cents >= total_cents"
        side_effects:
          - "Judgment.forgiven_cents set to the replayed total_payoff_cents remaining at that instant"
          - "hop: Judgment.status moves ACTIVE -> SATISFIED, which releases county filings and enforcement actions"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /_clock/set_current_utc — sweep step 1, on Judgment.status ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "the owning judgment has just become EXPIRED"
        side_effects: []

  # --- Payment -------------------------------------------------------------
  - entity: Payment
    state_field: status
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /payments/{payment_id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "Payment.status == APPLIED"
          - "Judgment.status == ACTIVE"
        side_effects:
          - "hop 1: the payment leaves the replay input set, so Judgment balances are replayed from entered_on over the remaining APPLIED payments to the current clock date"
          - "hop 2: because collected_to_date_cents drops, Judgment.contingency_fee_cents and net_to_creditor_cents are recomputed from scratch"
          - "hop 3: if the payment carried an enforcement_action_id, that action's collected_cents is reduced and, if it had reached COLLECTED, it returns to SERVED and Judgment.active_enforcement_count is incremented by 1"
          - "if the payment carried an installment_agreement_id, that agreement's paid_to_date_cents is reduced"
          - "increments Judgment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-judgment
    parent_entity: Judgment
    write_endpoint: "POST /settlement-offers"
    occ_field: "expected_judgment_version"
    description: |
      Tendering a SettlementOffer against a Judgment whose version has advanced since the client last
      read it is rejected. A new offer legitimately supersedes the currently OPEN offer on the same
      judgment (the superseded offer moves OPEN -> COUNTERED or OPEN -> REJECTED under §1.2), so a writer
      whose view of the judgment predates that supersede is negotiating against a balance and an offer
      chain that no longer exist. The check is a stale-version comparison, not a timing question.
    error_id: ERR_STALE_JUDGMENT_VERSION
    http_status: 412

  - rule_id: enforcement-action-create-stale-judgment
    parent_entity: Judgment
    write_endpoint: "POST /enforcement-actions"
    occ_field: "expected_judgment_version"
    description: |
      Drafting an EnforcementAction against a Judgment whose version has advanced since the client last read
      it is rejected. Nothing in §1.2 or §1.4 forbids a second action on the same judgment or even the same
      asset finding, so a writer working from a stale read would legitimately succeed while sizing the levy
      against a payoff, an enforcement_posture and an application_order that have already moved (a recorded
      county filing, a served sibling levy, an accepted settlement, or a renewal all bump the version). The
      check is a stale-version comparison, not a timing question.
    error_id: ERR_STALE_JUDGMENT_VERSION
    http_status: 412

  - rule_id: skip-trace-stale-debtor
    parent_entity: Debtor
    write_endpoint: "POST /debtors/{debtor_id}/skip-trace"
    occ_field: "expected_debtor_version"
    description: |
      Running a skip trace against a Debtor whose version has advanced since the client last read it is
      rejected. A completed trace legitimately supersedes the debtor's earlier SKIP_TRACE-sourced asset
      findings (they move OPEN/VERIFIED -> STALE) and rewrites locate_status and recoverability_score, so a
      second trace built on a stale read would re-stale findings that a newer trace already refreshed.
      The check is a stale-version comparison, not a timing question.
      Debtor.version is bumped by exactly these operations: POST /debtors/{debtor_id}/skip-trace;
      POST /asset-findings and POST /asset-findings/{asset_finding_id}/verify (both recompute
      recoverability_score); and POST /debtor-examinations/{examination_id}/record-outcome with
      outcome == NO_SHOW (which also bumps no_show_count). Read the debtor immediately before the trace.
    error_id: ERR_STALE_DEBTOR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: judgment_payoff_replay
    trigger: >-
      GET /judgments/{judgment_id}/payoff (non-persisting quote), and as a persisting recompute at the end of
      POST /payments, POST /payments/{payment_id}/reverse, POST /judgments/{judgment_id}/renew,
      POST /county-filings/{county_filing_id}/adjudicate with outcome == RECORDED,
      POST /enforcement-actions/{enforcement_action_id}/serve, and
      POST /installment-agreements/{installment_agreement_id}/record-miss that defaults the agreement
    algorithm: chronological
    formula: |
      # ---- inputs -----------------------------------------------------------
      #   ref_date  = `as_of` when supplied on the payoff endpoint, else the current logical-clock
      #               calendar date. Persisting recomputes always use the current clock date and
      #               write the result into Judgment.accrued_through_on.
      #   order     = `application_order` query parameter when supplied on the payoff endpoint,
      #               else Judgment.application_order.
      #
      # ---- event list -------------------------------------------------------
      # events = [ (p.received_on, 0, p.amount_cents) for p in Payment
      #              where p.judgment_id == J.id and p.status == APPLIED ]
      #        + [ (d, 1, null) for d in J.renewal_dates ]
      # DROP every event whose event_date > ref_date — a quote as of an earlier date must ignore money
      #   that arrived later, which is what makes validations[priority=43] a point-in-time check.
      # sort events by (event_date ASC, kind ASC, created_at ASC)
      #   kind 0 = payment, kind 1 = renewal  ->  on a shared date payments apply BEFORE capitalization
      #   created_at ASC breaks ties between two payments received on the same date (never `id`)
      #
      # ---- replay -----------------------------------------------------------
      # principal = J.original_principal_cents
      # costs     = J.filing_costs_cents + (recorded county filing fees) + (sheriff fees) + (renewal fees)
      # interest  = 0
      # cursor    = J.entered_on
      # for (event_date, kind, amount) in events:
      #     days = (event_date - cursor).days                 # half-open [cursor, event_date)
      #     if days > 0:
      #         interest += ROUND_HALF_UP(principal * J.interest_rate_bps * days
      #                                   / (10000 * INTEREST_DAY_BASIS))   # <-- ROUND PER SEGMENT
      #         cursor = event_date
      #     if kind == 0:                                     # payment
      #         remaining = amount
      #         buckets = ["costs","interest","principal"] if order == "STATUTORY_ORDER"
      #                   else ["principal","interest","costs"]
      #         for b in buckets:
      #             take = min(remaining, balance_of(b)); balance_of(b) -= take; remaining -= take
      #         # remaining must be 0 — guaranteed by validations[priority=42]
      #     else:                                             # renewal capitalization
      #         principal += interest ; interest = 0 ; costs += RENEWAL_FEE_CENTS
      # days = (ref_date - cursor).days
      # if days > 0:
      #     interest += ROUND_HALF_UP(principal * J.interest_rate_bps * days
      #                               / (10000 * INTEREST_DAY_BASIS))       # <-- ROUND PER SEGMENT
      #
      # total_payoff_cents = principal + interest + costs
      # gross_exposure_cents = principal + interest + costs + collected_to_date_cents
      #
      # ROUNDING ORDER IS PINNED: each segment's interest is rounded to whole cents with ROUND_HALF_UP
      # BEFORE it is added to the running interest balance. Summing exact fractional segment interest and
      # rounding once at the end is a DIFFERENT, WRONG answer and is explicitly rejected.
      # Interest accrues on principal only — never on costs, never on unpaid interest except through a
      # renewal capitalization event.
    input_set: >-
      Payment rows with judgment_id == J.id AND status == APPLIED (REVERSED payments are excluded entirely
      and the replay is rerun from entered_on, never patched by an inverse delta), plus every date in
      J.renewal_dates. Segment boundaries are ONLY those events plus entered_on and ref_date; adding taxed
      costs never opens a segment because costs earn no interest.
    constants:
      INTEREST_DAY_BASIS: 365
      RENEWAL_FEE_CENTS: 5000
      SHERIFF_FEE_CENTS: 12500
    precision: "whole cents, ROUND_HALF_UP, applied once per interest segment"
    variants:
      - name: STATUTORY_ORDER
        when: "Judgment.application_order == STATUTORY_ORDER (the default, and the value restored whenever no InstallmentAgreement is ACTIVE)"
        difference: "each payment is applied costs -> accrued interest -> principal, so principal falls slowest and later segments accrue more interest"
      - name: PRINCIPAL_FIRST
        when: "Judgment.application_order == PRINCIPAL_FIRST, which holds exactly while an InstallmentAgreement with application_order_concession == PRINCIPAL_FIRST is ACTIVE"
        difference: >-
          each payment is applied principal -> accrued interest -> costs, so principal falls fastest and later
          segments accrue less interest, but the unpaid interest and costs survive; identical payments therefore
          produce a different total_payoff_cents under the two variants

  - name: debtor_recoverability_score
    trigger: >-
      PRELIMINARY variant recomputed on POST /asset-findings, POST /asset-findings/{asset_finding_id}/verify,
      POST /debtors/{debtor_id}/skip-trace, and POST /debtor-examinations/{examination_id}/record-outcome;
      CERTIFIED variant computed and stamped only by POST /enforcement-actions/{enforcement_action_id}/request-writ
    algorithm: weighted_scoring
    formula: |
      # findings(D) = AssetFinding rows whose judgment_id belongs to a Judgment with debtor_id == D.id
      #
      # PRELIMINARY:
      #   weighted = sum over findings with status IN (OPEN, VERIFIED) of
      #                estimated_value_cents * (1.00 if status == VERIFIED else 0.60)
      #   asset_component       = min(60, floor(60 * weighted / TARGET_ASSET_VALUE_CENTS))
      #   locate_component      = 20 if D.locate_status == LOCATED else 0
      #   cooperation_component = 20 - 10 * min(2, D.no_show_count)
      #
      # CERTIFIED:
      #   weighted = sum over findings with status == VERIFIED of estimated_value_cents
      #              (OPEN and STALE findings are excluded outright, not discounted)
      #   asset_component       = min(60, floor(60 * weighted / TARGET_ASSET_VALUE_CENTS))
      #   locate_component      = 20 if D.locate_status == LOCATED else 0
      #   cooperation_component = 20 - 20 * min(1, D.no_show_count)
      #
      # score = clamp(asset_component + locate_component + cooperation_component, 0, 100)
      # `weighted` is carried as an exact decimal; only the floor() inside asset_component rounds.
    input_set: >-
      AssetFinding rows reachable as findings(D) above with status IN (OPEN, VERIFIED) for PRELIMINARY and
      status == VERIFIED for CERTIFIED; STALE and EXHAUSTED findings contribute 0 to both variants
    constants:
      TARGET_ASSET_VALUE_CENTS: 5000000
      PRELIM_UNVERIFIED_WEIGHT: 0.60
    precision: "integer 0..100; floor() on the asset component, no other rounding"
    variants:
      - name: PRELIMINARY
        when: "written to Debtor.recoverability_score on every investigation event"
        difference: "counts OPEN findings at 60% weight and softens no-shows at 10 points each, capped at 2"
      - name: CERTIFIED
        when: "written to Debtor.certified_recoverability_score only when a writ is requested"
        difference: >-
          drops OPEN findings entirely and charges the full 20-point cooperation penalty on the first no-show,
          so identical asset and examination data yield a strictly lower (and different) score

  - name: wage_garnishment_withholding
    trigger: "POST /enforcement-actions/{enforcement_action_id}/request-writ when action_type == WAGE_GARNISHMENT"
    algorithm: threshold
    formula: |
      # D = Debtor reached through EnforcementAction.judgment_id -> Judgment.debtor_id
      # disposable = D.weekly_disposable_earnings_cents
      #
      # cap_bps = HOH_FL_GARNISH_CAP_BPS  if (D.head_of_household == true AND D.state_code == "FL")
      #           else DEFAULT_GARNISH_CAP_BPS
      #
      # cap_a = floor(disposable * cap_bps / 10000)                       # percentage cap
      # cap_b = max(0, disposable - FED_MIN_WAGE_CENTS * GARNISH_FLOOR_MULTIPLIER)   # federal floor
      # cap_c = judgment_payoff_replay(J, ref_date = current clock date).total_payoff_cents
      #
      # weekly_withholding_cents = min(cap_a, cap_b, cap_c)
      #
      # Boundary is exact: disposable == 21750 gives cap_b == 0, hence 0, hence
      # ERR_GARNISHMENT_BELOW_FLOOR. disposable == 21751 gives cap_b == 1, hence 1, hence a valid writ.
      # Three inputs interact non-linearly: the binding constraint switches between cap_a, cap_b and cap_c
      # depending on the debtor's earnings, the head-of-household branch, and the outstanding payoff.
    input_set: "the single Debtor row reached through the action's judgment, plus the live payoff replay of that judgment"
    constants:
      FED_MIN_WAGE_CENTS: 725
      GARNISH_FLOOR_MULTIPLIER: 30
      DEFAULT_GARNISH_CAP_BPS: 2500
      HOH_FL_GARNISH_CAP_BPS: 1000
    precision: "whole cents; floor() on the percentage cap, no other rounding"

  - name: bank_levy_hold
    trigger: >-
      POST /enforcement-actions/{enforcement_action_id}/request-writ (feasibility check) and again at
      POST /enforcement-actions/{enforcement_action_id}/serve (the amount actually frozen)
    algorithm: threshold
    formula: |
      # F = the linked AssetFinding (asset_type must be BANK_ACCOUNT)
      # remaining = judgment_payoff_replay(J, ref_date = current clock date).total_payoff_cents
      #
      # levy_hold_cents = max(0, min(F.available_cents - BANK_AUTO_EXEMPT_CENTS, remaining))
      #
      # On serve:         F.available_cents -= levy_hold_cents ; F.frozen_cents  += levy_hold_cents
      # On release/quash:  F.frozen_cents    -= levy_hold_cents ; F.available_cents += levy_hold_cents
      # On collection:     F.frozen_cents    -= levy_hold_cents ; F.swept_cents     += levy_hold_cents
      # INVARIANT (conserved quantity):
      #   F.available_cents + F.frozen_cents + F.swept_cents == F.estimated_value_cents
      # holds at every instant. The serve/release pair is therefore compensating: it returns
      # available_cents and frozen_cents to their exact pre-serve values with swept_cents still 0,
      # even though the SHERIFF_FEE_CENTS charged to the judgment at serve is never refunded.
    input_set: "the single AssetFinding row named by asset_finding_id, plus the live payoff replay of the owning judgment"
    constants:
      BANK_AUTO_EXEMPT_CENTS: 175000
      LEVY_TERM_DAYS: 120
    precision: "whole cents; no rounding (all terms are integers)"

  - name: settlement_net_recovery
    trigger: "POST /payments and POST /payments/{payment_id}/reverse; recomputed from scratch, never incremented"
    algorithm: tiered_pricing
    formula: |
      # applied = Payment rows with judgment_id == J.id and status == APPLIED,
      #           ordered by (received_on ASC, created_at ASC)
      # gross_collected_cents = sum(p.amount_cents for p in applied)      # == J.collected_to_date_cents
      #
      # STEP 1 — pick the tier, keyed on gross_collected_cents BEFORE any cost reimbursement:
      #   tier_bps = TIER_1_BPS  if gross_collected_cents <  TIER_1_MAX_CENTS
      #              TIER_2_BPS  if gross_collected_cents <  TIER_2_MAX_CENTS
      #              TIER_3_BPS  otherwise                                # >= TIER_2_MAX_CENTS
      #
      # STEP 2 — round PER PAYMENT, then sum:
      #   for p in applied: p.contingency_fee_cents = ROUND_HALF_UP(p.amount_cents * tier_bps / 10000)
      #   J.contingency_fee_cents = sum(p.contingency_fee_cents for p in applied)
      #
      # STEP 3 — reimburse advanced costs last:
      #   J.net_to_creditor_cents = gross_collected_cents - J.contingency_fee_cents - J.filing_costs_cents
      #
      # EVALUATION ORDER IS PINNED and the dependency only LOOKS circular: the tier appears to depend on
      # the net, and the net on the fee, and the fee on the tier. It does not. The tier is keyed on
      # gross_collected_cents (STEP 1) and nothing downstream feeds back into it. Keying the tier on
      # (gross - filing_costs_cents) is a DIFFERENT, WRONG answer.
      # ROUNDING ORDER IS PINNED: ROUND_HALF_UP per payment then sum (STEP 2). Multiplying the aggregate
      # gross by tier_bps and rounding once is a DIFFERENT, WRONG answer.
      # Tier boundaries are inclusive-below/exclusive-above on the lower tier: gross == 5000000 is TIER_3.
    input_set: >-
      Payment rows on this judgment with status == APPLIED only; REVERSED payments leave both the tier
      selection and every per-payment fee slice, which are recomputed from scratch on each reversal
    constants:
      TIER_1_MAX_CENTS: 1000000
      TIER_2_MAX_CENTS: 5000000
      TIER_1_BPS: 4000
      TIER_2_BPS: 3300
      TIER_3_BPS: 2500
    precision: "whole cents, ROUND_HALF_UP, applied once per payment"

  - name: lien_priority_rank
    trigger: "POST /county-filings/{county_filing_id}/adjudicate with outcome == RECORDED"
    algorithm: aggregation
    formula: |
      # cohort = every CountyFiling row F2 (across ALL judgments) where
      #            F2.county_code == F.county_code
      #        AND F2.state_code  == F.state_code
      #        AND F2.status      == "RECORDED"      # including F itself, which has just been recorded
      #
      # sort cohort by (recorded_on ASC, created_at ASC)      # tie-break is created_at, never `id`
      # for k, F2 in enumerate(cohort, start=1):
      #     F2.priority_rank = k                              # the WHOLE cohort is renumbered
      #
      # Recording renumbers the entire county cohort rather than only stamping the new row. This matters
      # when the recording order differs from the creation order: a filing created earlier but recorded
      # later still takes the senior position on a shared recorded_on, and the previously-senior filing is
      # demoted in the same request. Filings that leave RECORDED (RELEASED or LAPSED) drop out of the
      # cohort but the survivors are NOT renumbered until the next recording.
    input_set: "CountyFiling rows across ALL judgments whose (county_code, state_code) match and whose status is exactly RECORDED immediately after this recording"
    constants: {}
    precision: "integer, 1-based"

  - name: renewal_capitalization
    trigger: "POST /judgments/{judgment_id}/renew"
    algorithm: aggregation
    formula: |
      # renewal_date = current logical-clock calendar date
      # replay judgment_payoff_replay(J, ref_date = renewal_date) first, so `interest` is current
      #
      # J.principal_balance_cents += J.accrued_interest_cents      # capitalize
      # J.accrued_interest_cents   = 0
      # J.costs_balance_cents     += RENEWAL_FEE_CENTS
      # J.renewal_dates.append(renewal_date)                       # becomes a permanent replay boundary
      # J.expires_on               = J.expires_on + RENEWAL_TERM_YEARS calendar years
      # J.renewal_count           += 1
      # J.accrued_through_on       = renewal_date
      #
      # Window: renewal is permitted only while
      #   J.expires_on - RENEWAL_WINDOW_DAYS <= renewal_date < J.expires_on
      # The lower bound is INCLUSIVE (exactly 180 days before expiry is the first legal day) and the upper
      # bound is EXCLUSIVE — but note that the clock sweep has already moved the judgment to EXPIRED by the
      # time renewal_date == expires_on, so that case surfaces as ERR_JUDGMENT_EXPIRED, not as a window error.
      # Capitalization conserves principal + interest: the sum is identical immediately before and after,
      # only its split changes.
      # Calendar-year arithmetic: same month and day n years later; 02-29 maps to 02-28.
    input_set: "the single Judgment row plus its full replay event list"
    constants:
      RENEWAL_TERM_YEARS: 10
      RENEWAL_WINDOW_DAYS: 180
      MAX_RENEWALS: 2
      RENEWAL_FEE_CENTS: 5000
    precision: "whole cents; capitalization is an exact integer move, no rounding"

  - name: settlement_floor_and_schedule
    trigger: "POST /settlement-offers (snapshot) and POST /settlement-offers/{settlement_offer_id}/accept (enforcement)"
    algorithm: threshold
    formula: |
      # At creation, snapshot the floor against the live payoff:
      #   payoff = judgment_payoff_replay(J, ref_date = current clock date).total_payoff_cents
      #   O.min_acceptable_cents = floor(payoff * MIN_SETTLEMENT_PCT_BPS / 10000)
      #
      # installments (LUMP_SUM is modelled as installment_count == 1):
      #   O.monthly_cents = ceil(O.amount_cents / O.installment_count)
      #
      # At acceptance the created agreement carries:
      #   A.monthly_cents            = O.monthly_cents
      #   A.final_installment_cents  = A.total_cents - A.monthly_cents * (A.installment_count - 1)
      #   A.first_due_on             = current clock date + INSTALLMENT_FIRST_DUE_DAYS
      #
      # Acceptance is rejected with ERR_SETTLEMENT_BELOW_FLOOR when
      #   O.amount_cents < O.min_acceptable_cents AND the acting role is not ComplianceOfficer.
      # The floor is the snapshot taken at CREATION, not a fresh quote at acceptance — interest accrued
      # between tender and acceptance does not move the floor.
    input_set: "the single SettlementOffer row and the payoff replay of its judgment as of the offer's creation date"
    constants:
      MIN_SETTLEMENT_PCT_BPS: 6000
      INSTALLMENT_FIRST_DUE_DAYS: 30
      MAX_NEGOTIATION_ROUNDS: 4
      MAX_MISSES: 3
      MAX_REINSTATEMENTS: 1
    precision: "whole cents; floor() on the settlement floor, ceil() on the monthly installment"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST rule that fails determines the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header is present whenever the acting role is entity_backed (Creditor, Debtor)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: >-
      entity_backed ownership: when the acting role is Creditor, X-User-ID must equal Judgment.creditor_id;
      when the acting role is Debtor, X-User-ID must equal Judgment.debtor_id. The judgment is resolved by
      following the target resource's own FK chain — ExemptionClaim.enforcement_action_id ->
      EnforcementAction.judgment_id; SettlementOffer.judgment_id; Payment.judgment_id; Judgment.id itself
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list contains Creditor or Debtor"

  - priority: 5
    category: existence
    check: "every id embedded in the path resolves, validated left to right"
    error_id: ERR_JUDGMENT_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints; the emitted id is the per-entity code from §1.6 (ERR_DEBTOR_NOT_FOUND, ERR_COUNTY_FILING_NOT_FOUND, ERR_ASSET_FINDING_NOT_FOUND, ERR_ENFORCEMENT_ACTION_NOT_FOUND, ERR_EXEMPTION_CLAIM_NOT_FOUND, ERR_EXAMINATION_NOT_FOUND, ERR_SETTLEMENT_OFFER_NOT_FOUND, ERR_INSTALLMENT_AGREEMENT_NOT_FOUND, ERR_PAYMENT_NOT_FOUND)"

  - priority: 6
    category: existence
    check: >-
      every foreign key supplied in the request body resolves, validated in the order the fields are listed
      in the endpoint's input: creditor_id, debtor_id, judgment_id, asset_finding_id, enforcement_action_id,
      responds_to_offer_id, installment_agreement_id
    error_id: ERR_CREDITOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /judgments, POST /county-filings, POST /asset-findings, POST /enforcement-actions, POST /exemption-claims, POST /debtor-examinations, POST /settlement-offers, POST /payments"

  - priority: 7
    category: business_constraint
    check: "every non-optional field in the endpoint's input is present and of the declared type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: business_constraint
    check: "every enum-typed field carries a value from that field's declared constraint set"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all write endpoints with enum inputs"

  - priority: 9
    category: business_constraint
    check: >-
      monetary and count inputs that must be strictly positive are: original_principal_cents, amount_cents,
      claimed_amount_cents, installment_count, hits_count. fee_cents, filing_costs_cents,
      estimated_value_cents, weekly_disposable_earnings_cents and interest_rate_bps must be >= 0
    error_id: ERR_NON_POSITIVE_AMOUNT
    http_status: 400
    applies_to: "all write endpoints carrying monetary or count inputs"

  - priority: 10
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 11
    category: business_temporal
    check: "to_iso8601 on the clock endpoint is not earlier than the current logical clock"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 12
    category: state
    check: "expected_judgment_version equals the current Judgment.version (OCC, rule offer-create-stale-judgment)"
    error_id: ERR_STALE_JUDGMENT_VERSION
    http_status: 412
    applies_to: "POST /settlement-offers, POST /enforcement-actions"

  - priority: 13
    category: state
    check: "expected_debtor_version equals the current Debtor.version (OCC, rule skip-trace-stale-debtor)"
    error_id: ERR_STALE_DEBTOR_VERSION
    http_status: 412
    applies_to: "POST /debtors/{debtor_id}/skip-trace"

  - priority: 14
    category: state
    check: "the target resource is in one of the from-states declared for the requested transition in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 15
    category: state
    check: "the owning Judgment.status is not EXPIRED"
    error_id: ERR_JUDGMENT_EXPIRED
    http_status: 409
    applies_to: "all write endpoints that touch a judgment or any of its children"

  - priority: 16
    category: state
    check: "the owning Judgment.status is not SATISFIED"
    error_id: ERR_JUDGMENT_SATISFIED
    http_status: 409
    applies_to: "all write endpoints that touch a judgment or any of its children"

  - priority: 17
    category: business_safety
    check: "the writ requester's X-User-ID differs from AssetFinding.verified_by_user_id on the linked finding"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/request-writ"

  - priority: 18
    category: business_safety
    check: "the ruling officer's X-User-ID differs from ExemptionClaim.opposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exemption-claims/{exemption_claim_id}/rule"

  - priority: 19
    category: business_safety
    check: "Judgment.enforcement_posture is not STAYED"
    error_id: ERR_ENFORCEMENT_STAYED
    http_status: 409
    applies_to: "POST /enforcement-actions, POST /enforcement-actions/{enforcement_action_id}/request-writ, POST /enforcement-actions/{enforcement_action_id}/serve"

  - priority: 20
    category: business_safety
    check: "no ExemptionClaim on the referenced EnforcementAction is in status FILED or OPPOSED"
    error_id: ERR_EXEMPTION_PENDING
    http_status: 409
    applies_to: "POST /payments when enforcement_action_id is supplied"

  - priority: 21
    category: business_temporal
    check: "the claim is filed on or before EnforcementAction.served_on + EXEMPTION_RESPONSE_DAYS (inclusive), and not before served_on"
    error_id: ERR_EXEMPTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /exemption-claims"

  - priority: 23
    category: business_temporal
    check: "current clock date >= Judgment.expires_on - RENEWAL_WINDOW_DAYS (inclusive lower bound)"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /judgments/{judgment_id}/renew"

  - priority: 24
    category: business_temporal
    check: >-
      abs(candidate_scheduled_at - other.scheduled_at) >= EXAM_COOLING_DAYS * 24 hours, measured on the raw
      ISO 8601 instants, against every OTHER DebtorExamination on the same debtor (reached via
      DebtorExamination.judgment_id -> Judgment.debtor_id) whose status IN (SCHEDULED, SERVED); a separation of
      exactly EXAM_COOLING_DAYS * 24 hours is PERMITTED (the bound is inclusive), one second less is rejected
    error_id: ERR_EXAM_COOLING_PERIOD
    http_status: 409
    applies_to: "POST /debtor-examinations, POST /debtor-examinations/{examination_id}/record-outcome with outcome == CONTINUED"

  - priority: 25
    category: business_temporal
    check: >-
      the half-open interval [served_on, served_on + LEVY_TERM_DAYS) does not overlap the half-open interval
      [served_on, expires_on) of any OTHER EnforcementAction on the same asset_finding_id whose status IN
      (SERVED, SUSPENDED); touching endpoints do not overlap, so a new levy starting exactly on a prior
      levy's expires_on is permitted
    error_id: ERR_LEVY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/serve"

  - priority: 26
    category: business_temporal
    check: "current clock date <= DebtorExamination.subpoena_service_deadline_on (inclusive)"
    error_id: ERR_SUBPOENA_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /debtor-examinations/{examination_id}/subpoena"

  - priority: 27
    category: business_temporal
    check: "received_on lies in [Judgment.entered_on, current clock date] inclusive on both ends"
    error_id: ERR_PAYMENT_DATE_INVALID
    http_status: 422
    applies_to: "POST /payments"

  - priority: 28
    category: business_referential
    check: >-
      Judgment.enforcement_posture IN (LIEN_PERFECTED, ENFORCING), which requires at least one CountyFiling on
      the judgment in status RECORDED whose state_code equals the Debtor.state_code reached through
      Judgment.debtor_id
    error_id: ERR_NO_PERFECTED_LIEN
    http_status: 409
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/request-writ"

  - priority: 29
    category: business_referential
    check: "the referenced AssetFinding.status == VERIFIED at enforcement-action creation"
    error_id: ERR_FINDING_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /enforcement-actions"

  - priority: 30
    category: business_referential
    check: "the linked AssetFinding.status is not STALE at writ time (a superseding skip trace may have staled it since creation)"
    error_id: ERR_FINDING_STALE
    http_status: 409
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/request-writ"

  - priority: 31
    category: business_referential
    check: "the Debtor reached through Judgment.debtor_id has locate_status == LOCATED"
    error_id: ERR_DEBTOR_NOT_LOCATED
    http_status: 409
    applies_to: "POST /debtor-examinations/{examination_id}/serve"

  - priority: 32
    category: business_referential
    check: "a counter-offer's offered_by differs from responds_to_offer.offered_by"
    error_id: ERR_SAME_PARTY_COUNTER
    http_status: 409
    applies_to: "POST /settlement-offers when responds_to_offer_id is supplied"

  - priority: 33
    category: business_referential
    check: "action_type == WAGE_GARNISHMENT requires AssetFinding.asset_type == EMPLOYMENT; action_type == BANK_LEVY requires AssetFinding.asset_type == BANK_ACCOUNT"
    error_id: ERR_ACTION_ASSET_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /enforcement-actions"

  - priority: 34
    category: business_constraint
    check: "court_case_number is unique within state_code across all judgments"
    error_id: ERR_DUPLICATE_CASE_NUMBER
    http_status: 409
    applies_to: "POST /judgments"

  - priority: 35
    category: business_constraint
    check: "no other CountyFiling shares (judgment_id, county_code, filing_type) while in status DRAFT, SUBMITTED or RECORDED"
    error_id: ERR_DUPLICATE_COUNTY_FILING
    http_status: 409
    applies_to: "POST /county-filings"

  - priority: 36
    category: business_constraint
    check: "the new offer's round_number (responds_to_offer.round_number + 1) is <= MAX_NEGOTIATION_ROUNDS"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /settlement-offers when responds_to_offer_id is supplied"

  - priority: 37
    category: business_constraint
    check: "DebtorExamination.continuance_count < MAX_CONTINUANCES"
    error_id: ERR_CONTINUANCE_LIMIT
    http_status: 409
    applies_to: "POST /debtor-examinations/{examination_id}/record-outcome with outcome == CONTINUED"

  - priority: 38
    category: business_constraint
    check: "Judgment.renewal_count < MAX_RENEWALS"
    error_id: ERR_RENEWAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /judgments/{judgment_id}/renew"

  - priority: 39
    category: business_constraint
    check: "InstallmentAgreement.reinstatement_count < MAX_REINSTATEMENTS"
    error_id: ERR_REINSTATEMENT_LIMIT
    http_status: 409
    applies_to: "POST /installment-agreements/{installment_agreement_id}/reinstate"

  - priority: 40
    category: business_fiscal
    check: "SettlementOffer.amount_cents >= SettlementOffer.min_acceptable_cents, waived when the acting role is ComplianceOfficer"
    error_id: ERR_SETTLEMENT_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /settlement-offers/{settlement_offer_id}/accept"

  - priority: 41
    category: business_fiscal
    check: "calculations.wage_garnishment_withholding yields a strictly positive weekly amount"
    error_id: ERR_GARNISHMENT_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/request-writ when action_type == WAGE_GARNISHMENT"

  - priority: 42
    category: business_fiscal
    check: "calculations.bank_levy_hold yields a strictly positive hold"
    error_id: ERR_NO_LEVIABLE_FUNDS
    http_status: 422
    applies_to: "POST /enforcement-actions/{enforcement_action_id}/request-writ and POST /enforcement-actions/{enforcement_action_id}/serve when action_type == BANK_LEVY"

  - priority: 43
    category: business_fiscal
    check: "amount_cents <= judgment_payoff_replay(J, ref_date = received_on).total_payoff_cents"
    error_id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http_status: 422
    applies_to: "POST /payments"

# =============================================================================
# 1.5 API Endpoint Table
# Flat topology: every collection is a root-level peer; children are discovered
# exclusively through filtered lists (GET /<children>?<fk_field>=...).
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint, §1.5 ladder rung 3) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z
      and MUST NOT fall back to real wall-clock time. Advancing the clock runs the ops sweep in this pinned
      order — step 1: ACTIVE judgments whose expires_on <= the new date become EXPIRED (cascading their county
      filings to LAPSED, their WRIT_REQUESTED/SERVED/SUSPENDED enforcement actions to RELEASED, and their ACTIVE
      installment agreements to TERMINATED); step 2: FILED exemption claims whose opposition_deadline_on < the new
      date become DEFAULTED (cascading their enforcement action to QUASHED); step 3: OPEN settlement offers whose
      expires_at <= the new instant become EXPIRED; step 4: ISSUED subpoenas past subpoena_service_deadline_on
      become EXPIRED. Within each step, rows are processed in created_at ASC order.
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, expired_judgment_count: integer, defaulted_claim_count: integer, expired_offer_count: integer, expired_subpoena_count: integer, terminated_agreement_count: integer }
    side_effects:
      - "sweep steps 1-4 exactly as described above, each step completing fully before the next begins"

  # ---- Creditor -----------------------------------------------------------
  - method: POST
    path: "/creditors"
    description: "Onboards a judgment creditor (the recovery firm's client)."
    roles: [CaseManager]
    code: 201
    input: [name, contact_email]
    output: Creditor
    side_effects: []

  # ---- Debtor -------------------------------------------------------------
  - method: POST
    path: "/debtors"
    description: "Registers a judgment debtor with the earnings and household facts that drive the garnishment cap."
    roles: [CaseManager]
    code: 201
    input: ["full_name", "state_code", "head_of_household?", "weekly_disposable_earnings_cents?"]
    output: Debtor
    side_effects:
      - "sets locate_status = UNLOCATED and recoverability_score = 20 (cooperation component only)"

  - method: GET
    path: "/debtors/{debtor_id}"
    description: "Reads one debtor, including both recoverability score variants and the current version for OCC."
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer, Debtor]
    code: 200
    input: []
    output: Debtor
    side_effects: []

  - method: POST
    path: "/debtors/{debtor_id}/skip-trace"
    description: >-
      Records the result of a vendor skip trace. A completed trace supersedes the debtor's earlier
      SKIP_TRACE-sourced findings. Guarded by OCC rule skip-trace-stale-debtor.
    roles: [AssetInvestigator]
    code: 200
    input: ["vendor", "located", "hits_count", "current_state_code?", "expected_debtor_version"]
    output: Debtor
    side_effects:
      - "located == true sets locate_status = LOCATED; located == false sets STALE if the previous value was LOCATED, otherwise UNLOCATED"
      - "current_state_code, when supplied, replaces Debtor.state_code"
      - "every AssetFinding with source == SKIP_TRACE hanging off a judgment of this debtor and status IN (OPEN, VERIFIED) moves to STALE (created_at ASC)"
      - "skip_trace_count incremented by 1; last_skip_trace_on set to the clock date"
      - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"
      - "increments Debtor.version by 1"

  # ---- Judgment -----------------------------------------------------------
  - method: POST
    path: "/judgments"
    description: "Dockets a money judgment and opens its interest clock."
    roles: [CaseManager]
    code: 201
    input: ["creditor_id", "debtor_id", "court_case_number", "state_code", "original_principal_cents", "interest_rate_bps", "entered_on", "filing_costs_cents?"]
    output: Judgment
    side_effects:
      - "sets expires_on = entered_on + 10 calendar years, status = ACTIVE, enforcement_posture = NONE, application_order = STATUTORY_ORDER"
      - "seeds principal_balance_cents = original_principal_cents and costs_balance_cents = filing_costs_cents, then replays balances to the current clock date"
      - "Creditor.active_judgment_count incremented by 1"

  - method: GET
    path: "/judgments"
    description: "Lists judgments; Creditor callers see only their own, Debtor callers only their own."
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: ["creditor_id?", "debtor_id?", "status?", "enforcement_posture?", "limit?", "offset?"]
    output: Judgment[]
    side_effects: []

  - method: GET
    path: "/judgments/{judgment_id}"
    description: "Reads one judgment, including both state dimensions and the version used for OCC."
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: Judgment
    side_effects: []

  - method: GET
    path: "/judgments/{judgment_id}/payoff"
    description: >-
      Non-persisting payoff quote from calculations.judgment_payoff_replay. `as_of` defaults to the current
      logical-clock date; `application_order` defaults to Judgment.application_order and lets a caller price
      the other variant against identical payment history.
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: ["as_of?", "application_order?"]
    output: { as_of: datetime, application_order: string, principal_balance_cents: integer, accrued_interest_cents: integer, costs_balance_cents: integer, total_payoff_cents: integer, collected_to_date_cents: integer, gross_exposure_cents: integer, segment_count: integer }
    side_effects: []

  - method: POST
    path: "/judgments/{judgment_id}/renew"
    description: "Renews the judgment before it expires, capitalizing accrued interest into principal."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Judgment
    side_effects:
      - "runs calculations.renewal_capitalization: capitalizes accrued_interest_cents into principal_balance_cents, appends the renewal date to renewal_dates, adds RENEWAL_FEE_CENTS to costs_balance_cents, pushes expires_on out RENEWAL_TERM_YEARS calendar years, increments renewal_count"
      - "increments Judgment.version by 1"

  # ---- CountyFiling -------------------------------------------------------
  - method: POST
    path: "/county-filings"
    description: "Drafts an abstract of judgment or judgment lien for one county recorder."
    roles: [CaseManager]
    code: 201
    input: [judgment_id, county_code, state_code, filing_type, fee_cents]
    output: CountyFiling
    side_effects: []

  - method: GET
    path: "/county-filings"
    description: "Lists county filings; the reverse-reachability channel for CountyFiling.judgment_id."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Creditor]
    code: 200
    input: ["judgment_id?", "county_code?", "status?", "limit?", "offset?"]
    output: CountyFiling[]
    side_effects: []

  - method: GET
    path: "/county-filings/{county_filing_id}"
    description: "Reads one county filing, including its assigned lien priority_rank."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Creditor]
    code: 200
    input: []
    output: CountyFiling
    side_effects: []

  - method: POST
    path: "/county-filings/{county_filing_id}/submit"
    description: "Submits (or re-submits after a rejection) the filing to the county recorder."
    roles: [CaseManager]
    code: 200
    input: []
    output: CountyFiling
    side_effects:
      - "sets submitted_on to the current clock date"

  - method: POST
    path: "/county-filings/{county_filing_id}/adjudicate"
    description: "Records the recorder's decision. outcome == RECORDED perfects the lien; outcome == REJECTED sends it back for re-filing."
    roles: [CaseManager]
    code: 200
    input: ["outcome", "recorded_on?", "rejection_reason?"]
    output: CountyFiling
    side_effects:
      - "RECORDED: renumbers the whole (county_code, state_code) RECORDED cohort via calculations.lien_priority_rank, sets lien_expires_on, adds fee_cents to Judgment.costs_balance_cents, increments Judgment.perfected_county_count, moves Judgment.enforcement_posture NONE -> LIEN_PERFECTED on the first perfected filing, increments Judgment.version by 1"
      - "REJECTED: increments rejection_count, stores rejection_reason, leaves Judgment untouched"

  # ---- AssetFinding -------------------------------------------------------
  - method: POST
    path: "/asset-findings"
    description: "Records a discovered asset (property, bank account, employment or vehicle) against a judgment."
    roles: [AssetInvestigator]
    code: 201
    input: ["judgment_id", "asset_type", "institution_name", "identifier_last4", "estimated_value_cents", "source", "weekly_disposable_earnings_cents?"]
    output: AssetFinding
    side_effects:
      - "sets available_cents = estimated_value_cents and frozen_cents = 0"
      - "for asset_type == EMPLOYMENT, copies weekly_disposable_earnings_cents onto the Debtor reached through the judgment and increments Debtor.version by 1"
      - "recomputes Debtor.recoverability_score (PRELIMINARY variant)"

  - method: GET
    path: "/asset-findings"
    description: "Lists asset findings; the reverse-reachability channel for AssetFinding.judgment_id."
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: ["judgment_id?", "asset_type?", "status?", "source?", "limit?", "offset?"]
    output: AssetFinding[]
    side_effects: []

  - method: GET
    path: "/asset-findings/{asset_finding_id}"
    description: "Reads one asset finding, including its available/frozen custody split and verifier id."
    roles: [CaseManager, AssetInvestigator, EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: AssetFinding
    side_effects: []

  - method: POST
    path: "/asset-findings/{asset_finding_id}/verify"
    description: "Verifies (or re-verifies a staled) finding, stamping the caller's X-User-ID as verified_by_user_id."
    roles: [AssetInvestigator]
    code: 200
    input: []
    output: AssetFinding
    side_effects:
      - "stamps verified_by_user_id and verified_on; recomputes Debtor.recoverability_score (PRELIMINARY variant)"

  # ---- EnforcementAction --------------------------------------------------
  - method: POST
    path: "/enforcement-actions"
    description: "Drafts a wage garnishment or bank levy against a verified asset. Guarded by OCC rule offer-create-stale-judgment's sibling check on Judgment.version."
    roles: [CaseManager]
    code: 201
    input: [judgment_id, asset_finding_id, action_type, expected_judgment_version]
    output: EnforcementAction
    side_effects:
      - "creates the action in status DRAFT"
      - "increments Judgment.version by 1"

  - method: GET
    path: "/enforcement-actions"
    description: "Lists enforcement actions; the reverse-reachability channel for both judgment_id and asset_finding_id."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Creditor]
    code: 200
    input: ["judgment_id?", "asset_finding_id?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: GET
    path: "/enforcement-actions/{enforcement_action_id}"
    description: "Reads one enforcement action, including levy_hold_cents and weekly_withholding_cents."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Creditor]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: POST
    path: "/enforcement-actions/{enforcement_action_id}/request-writ"
    description: "Requests the writ. Enforces segregation of duties against the finding's verifier and the fiscal feasibility of the instrument."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "stamps writ_requested_on and writ_requested_by_user_id"
      - "WAGE_GARNISHMENT: stores weekly_withholding_cents from calculations.wage_garnishment_withholding"
      - "stamps Debtor.certified_recoverability_score with the CERTIFIED variant of calculations.debtor_recoverability_score"
      - "Judgment.active_enforcement_count incremented by 1"

  - method: POST
    path: "/enforcement-actions/{enforcement_action_id}/serve"
    description: "Serves the writ on the garnishee or bank, freezing funds and starting the LEVY_TERM_DAYS occupation window."
    roles: [EnforcementOfficer]
    code: 200
    input: [served_on]
    output: EnforcementAction
    side_effects:
      - "sets expires_on = served_on + LEVY_TERM_DAYS"
      - "BANK_LEVY: sets levy_hold_cents from calculations.bank_levy_hold (evaluated BEFORE the sheriff fee lands on the judgment) and moves that amount from AssetFinding.available_cents into AssetFinding.frozen_cents"
      - "only afterwards sets sheriff_fee_cents = SHERIFF_FEE_CENTS, adds it to Judgment.costs_balance_cents and replays Judgment balances"
      - "moves Judgment.enforcement_posture LIEN_PERFECTED -> ENFORCING when applicable; increments Judgment.version by 1"

  - method: POST
    path: "/enforcement-actions/{enforcement_action_id}/release"
    description: "Releases the writ. The compensating action for serve: it restores the asset custody split exactly, but never refunds the sheriff fee."
    roles: [EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "returns levy_hold_cents from AssetFinding.frozen_cents to AssetFinding.available_cents, leaves AssetFinding.swept_cents untouched, and zeroes levy_hold_cents"
      - "decrements Judgment.active_enforcement_count and, at 0, moves enforcement_posture ENFORCING -> LIEN_PERFECTED"

  # ---- ExemptionClaim -----------------------------------------------------
  - method: POST
    path: "/exemption-claims"
    description: "The debtor claims a statutory exemption against a served writ."
    roles: [Debtor]
    code: 201
    input: [enforcement_action_id, claim_type, claimed_amount_cents]
    output: ExemptionClaim
    side_effects:
      - "sets filed_on to the clock date, filing_deadline_on = action.served_on + EXEMPTION_RESPONSE_DAYS, opposition_deadline_on = filed_on + OPPOSITION_RESPONSE_DAYS"

  - method: GET
    path: "/exemption-claims"
    description: "Lists exemption claims; the reverse-reachability channel for ExemptionClaim.enforcement_action_id."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Debtor]
    code: 200
    input: ["enforcement_action_id?", "status?", "limit?", "offset?"]
    output: ExemptionClaim[]
    side_effects: []

  - method: GET
    path: "/exemption-claims/{exemption_claim_id}"
    description: "Reads one exemption claim, including both deadline dates and the opposing/ruling user ids."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer, Debtor]
    code: 200
    input: []
    output: ExemptionClaim
    side_effects: []

  - method: POST
    path: "/exemption-claims/{exemption_claim_id}/oppose"
    description: "The creditor opposes the claim within the opposition window, stamping the opposing officer's X-User-ID."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: ExemptionClaim
    side_effects:
      - "stamps opposed_on and opposed_by_user_id"

  - method: POST
    path: "/exemption-claims/{exemption_claim_id}/rule"
    description: "The compliance officer rules on an opposed claim. Enforces segregation of duties against the opposing officer."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ExemptionClaim
    side_effects:
      - "SUSTAINED: quashes the linked EnforcementAction, returns its levy hold to the AssetFinding, exhausts the finding for HEAD_OF_HOUSEHOLD/HOMESTEAD claims, decrements Judgment.active_enforcement_count and steps the posture back to LIEN_PERFECTED at 0"
      - "OVERRULED: stamps ruled_by_user_id only; nothing outside this row changes"

  # ---- DebtorExamination --------------------------------------------------
  - method: POST
    path: "/debtor-examinations"
    description: "Schedules a judgment-debtor examination, honouring the EXAM_COOLING_DAYS separation on the same debtor."
    roles: [CaseManager]
    code: 201
    input: [judgment_id, scheduled_at]
    output: DebtorExamination
    side_effects:
      - "sets subpoena_service_deadline_on = date(scheduled_at) - SUBPOENA_LEAD_DAYS"

  - method: GET
    path: "/debtor-examinations"
    description: "Lists examinations; the reverse-reachability channel for DebtorExamination.judgment_id."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: ["judgment_id?", "status?", "subpoena_status?", "limit?", "offset?"]
    output: DebtorExamination[]
    side_effects: []

  - method: GET
    path: "/debtor-examinations/{examination_id}"
    description: "Reads one examination, including both of its state dimensions."
    roles: [CaseManager, EnforcementOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: DebtorExamination
    side_effects: []

  - method: POST
    path: "/debtor-examinations/{examination_id}/subpoena"
    description: "Issues a duces-tecum subpoena on the second state dimension of the examination row."
    roles: [CaseManager]
    code: 200
    input: [recipient_type, recipient_name]
    output: DebtorExamination
    side_effects:
      - "moves subpoena_status NOT_ISSUED -> ISSUED and stamps subpoena_recipient_type and subpoena_recipient_name"

  - method: POST
    path: "/debtor-examinations/{examination_id}/serve"
    description: "Serves the appearance order (and, if issued, the subpoena) on a located debtor."
    roles: [CaseManager]
    code: 200
    input: [served_on]
    output: DebtorExamination
    side_effects:
      - "moves status SCHEDULED -> SERVED and, when subpoena_status == ISSUED, moves it to SERVED as well"

  - method: POST
    path: "/debtor-examinations/{examination_id}/record-outcome"
    description: "Records HELD, NO_SHOW, or CONTINUED (which re-arms the examination at new_scheduled_at)."
    roles: [CaseManager]
    code: 200
    input: ["outcome", "new_scheduled_at?"]
    output: DebtorExamination
    side_effects:
      - "HELD: stamps outcome_recorded_on"
      - "NO_SHOW: stamps outcome_recorded_on, increments Debtor.no_show_count, recomputes Debtor.recoverability_score"
      - "CONTINUED: replaces scheduled_at with new_scheduled_at, increments continuance_count, clears served_on, recomputes subpoena_service_deadline_on, returns status to SCHEDULED"

  # ---- SettlementOffer ----------------------------------------------------
  - method: POST
    path: "/settlement-offers"
    description: >-
      Tenders an opening offer or a counter-offer. Guarded by OCC rule offer-create-stale-judgment.
      A counter both closes the parent (OPEN -> COUNTERED) and opens a new round.
    roles: [CaseManager, Creditor, Debtor]
    code: 201
    input: ["judgment_id", "offered_by", "kind", "amount_cents", "expires_at", "expected_judgment_version", "installment_count?", "application_order_concession?", "responds_to_offer_id?"]
    output: SettlementOffer
    side_effects:
      - "computes round_number, monthly_cents and min_acceptable_cents via calculations.settlement_floor_and_schedule"
      - "when responds_to_offer_id is supplied, that offer moves OPEN -> COUNTERED"
      - "Judgment.open_offer_count recomputed; increments Judgment.version by 1"

  - method: GET
    path: "/settlement-offers"
    description: "Lists offers; the reverse-reachability channel for both judgment_id and the self-referential responds_to_offer_id."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: ["judgment_id?", "responds_to_offer_id?", "status?", "limit?", "offset?"]
    output: SettlementOffer[]
    side_effects: []

  - method: GET
    path: "/settlement-offers/{settlement_offer_id}"
    description: "Reads one offer, including its round_number and snapshotted min_acceptable_cents."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []

  - method: POST
    path: "/settlement-offers/{settlement_offer_id}/accept"
    description: "The opposing side accepts. Creates the InstallmentAgreement and stays enforcement. ComplianceOfficer may accept below the floor."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects:
      - "creates an InstallmentAgreement in status ACTIVE (discoverable only through GET /installment-agreements?settlement_offer_id=...)"
      - "moves Judgment.enforcement_posture ENFORCING -> STAYED, sets Judgment.application_order to the concession, and suspends every SERVED enforcement action"
      - "rejects every other OPEN offer on the judgment; increments Judgment.version by 1"

  - method: POST
    path: "/settlement-offers/{settlement_offer_id}/reject"
    description: "Declines an offer whose status is OPEN, without countering it."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects:
      - "stamps decided_at and decrements Judgment.open_offer_count"

  # ---- InstallmentAgreement (created only by cascade) ---------------------
  - method: GET
    path: "/installment-agreements"
    description: "Lists agreements; the ONLY discovery channel for the cascade-created agreement, and the reverse-reachability channel for judgment_id and settlement_offer_id."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: ["judgment_id?", "settlement_offer_id?", "status?", "limit?", "offset?"]
    output: InstallmentAgreement[]
    side_effects: []

  - method: GET
    path: "/installment-agreements/{installment_agreement_id}"
    description: "Reads one installment agreement, including its schedule and miss/reinstatement counters."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects: []

  - method: POST
    path: "/installment-agreements/{installment_agreement_id}/record-miss"
    description: "Records a missed installment; the MAX_MISSES-th miss defaults the agreement and resumes enforcement."
    roles: [CaseManager]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects:
      - "increments missed_count; at MAX_MISSES moves the agreement to DEFAULTED, returns Judgment.enforcement_posture STAYED -> ENFORCING, reverts Judgment.application_order to STATUTORY_ORDER, resumes every SUSPENDED enforcement action, replays Judgment balances and increments Judgment.version by 1"

  - method: POST
    path: "/installment-agreements/{installment_agreement_id}/reinstate"
    description: "Reinstates a defaulted agreement once, re-staying enforcement."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects:
      - "resets missed_count to 0, increments reinstatement_count, returns the agreement to ACTIVE, moves Judgment.enforcement_posture ENFORCING -> STAYED, re-applies the application_order concession, suspends every SERVED enforcement action and increments Judgment.version by 1"

  # ---- Payment ------------------------------------------------------------
  - method: POST
    path: "/payments"
    description: "Records money received and re-runs the chronological payoff replay from entered_on."
    roles: [CaseManager, Debtor]
    code: 201
    input: ["judgment_id", "amount_cents", "received_on", "source", "installment_agreement_id?", "enforcement_action_id?"]
    output: Payment
    side_effects:
      - "replays calculations.judgment_payoff_replay from entered_on and writes applied_to_costs_cents / applied_to_interest_cents / applied_to_principal_cents on this row"
      - "recomputes Judgment.collected_to_date_cents, contingency_fee_cents and net_to_creditor_cents from scratch via calculations.settlement_net_recovery"
      - "when enforcement_action_id is supplied, credits EnforcementAction.collected_cents, moves it SERVED -> COLLECTED and shifts the levy hold from AssetFinding.frozen_cents into AssetFinding.swept_cents"
      - "when installment_agreement_id is supplied, credits InstallmentAgreement.paid_to_date_cents and moves it ACTIVE -> COMPLETED once total_cents is reached"
      - "moves Judgment.status ACTIVE -> SATISFIED when the replayed total_payoff_cents reaches 0; increments Judgment.version by 1"

  - method: GET
    path: "/payments"
    description: "Lists payments; the reverse-reachability channel for judgment_id, installment_agreement_id and enforcement_action_id."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: ["judgment_id?", "installment_agreement_id?", "enforcement_action_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/payments/{payment_id}"
    description: "Reads one payment, including its three allocation buckets and its own contingency slice."
    roles: [CaseManager, ComplianceOfficer, Creditor, Debtor]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/payments/{payment_id}/reverse"
    description: >-
      Reverses a payment (NSF, misapplied funds). The compensating action for POST /payments: the payment
      leaves the replay input set and every balance is recomputed from entered_on — never patched by an
      inverse delta, which would leave the interest segments wrong.
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Payment
    side_effects:
      - "sets status = REVERSED, stamps reversal_reason and reversed_on"
      - "replays Judgment balances from entered_on over the remaining APPLIED payments and recomputes contingency_fee_cents and net_to_creditor_cents from scratch"
      - "restores the linked EnforcementAction (COLLECTED -> SERVED) and/or reduces InstallmentAgreement.paid_to_date_cents"
      - "increments Judgment.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the six declared roles, or X-User-ID missing for an entity_backed role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Creditor caller's X-User-ID is not the judgment's creditor_id, or a Debtor caller's X-User-ID is not the judgment's debtor_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the writ requester is the finding's verifier, or the ruling compliance officer is the opposing officer"
  - id: ERR_CREDITOR_NOT_FOUND
    http: 404
    condition: "creditor_id in the body names no Creditor"
  - id: ERR_DEBTOR_NOT_FOUND
    http: 404
    condition: "debtor_id in the path or body names no Debtor"
  - id: ERR_JUDGMENT_NOT_FOUND
    http: 404
    condition: "judgment_id in the path or body names no Judgment"
  - id: ERR_COUNTY_FILING_NOT_FOUND
    http: 404
    condition: "county_filing_id in the path names no CountyFiling"
  - id: ERR_ASSET_FINDING_NOT_FOUND
    http: 404
    condition: "asset_finding_id in the path or body names no AssetFinding"
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "enforcement_action_id in the path or body names no EnforcementAction"
  - id: ERR_EXEMPTION_CLAIM_NOT_FOUND
    http: 404
    condition: "exemption_claim_id in the path names no ExemptionClaim"
  - id: ERR_EXAMINATION_NOT_FOUND
    http: 404
    condition: "examination_id in the path names no DebtorExamination"
  - id: ERR_SETTLEMENT_OFFER_NOT_FOUND
    http: 404
    condition: "settlement_offer_id in the path, or responds_to_offer_id in the body, names no SettlementOffer"
  - id: ERR_INSTALLMENT_AGREEMENT_NOT_FOUND
    http: 404
    condition: "installment_agreement_id in the path or body names no InstallmentAgreement"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id in the path names no Payment"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or carries the wrong JSON type"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-typed input carries a value outside that field's declared constraint set"
  - id: ERR_NON_POSITIVE_AMOUNT
    http: 400
    condition: "a monetary or count input violates its > 0 or >= 0 constraint"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset < 0"
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock"
  - id: ERR_STALE_JUDGMENT_VERSION
    http: 412
    condition: "expected_judgment_version does not equal the current Judgment.version"
  - id: ERR_STALE_DEBTOR_VERSION
    http: 412
    condition: "expected_debtor_version does not equal the current Debtor.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a from-state declared for the requested transition"
  - id: ERR_JUDGMENT_EXPIRED
    http: 409
    condition: "the owning judgment has status EXPIRED"
  - id: ERR_JUDGMENT_SATISFIED
    http: 409
    condition: "the owning judgment has status SATISFIED"
  - id: ERR_ENFORCEMENT_STAYED
    http: 409
    condition: "the owning judgment has enforcement_posture STAYED because an InstallmentAgreement is ACTIVE"
  - id: ERR_EXEMPTION_PENDING
    http: 409
    condition: "an ExemptionClaim on the referenced enforcement action is still FILED or OPPOSED"
  - id: ERR_EXEMPTION_WINDOW_CLOSED
    http: 422
    condition: "the claim is filed before served_on or after served_on + EXEMPTION_RESPONSE_DAYS"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "renewal attempted more than RENEWAL_WINDOW_DAYS before expires_on"
  - id: ERR_EXAM_COOLING_PERIOD
    http: 409
    condition: "the candidate examination instant is strictly closer than EXAM_COOLING_DAYS * 24 hours to the scheduled_at of another DebtorExamination on the same debtor whose status IN (SCHEDULED, SERVED)"
  - id: ERR_LEVY_WINDOW_CONFLICT
    http: 409
    condition: "the new half-open interval [served_on, served_on + LEVY_TERM_DAYS) overlaps the [served_on, expires_on) interval of another EnforcementAction on the same asset_finding_id whose status IN (SERVED, SUSPENDED)"
  - id: ERR_SUBPOENA_DEADLINE_PASSED
    http: 422
    condition: "the subpoena is issued after subpoena_service_deadline_on"
  - id: ERR_PAYMENT_DATE_INVALID
    http: 422
    condition: "received_on is before the judgment's entered_on or after the current clock date"
  - id: ERR_NO_PERFECTED_LIEN
    http: 409
    condition: "no CountyFiling in status RECORDED exists in the debtor's state, so enforcement_posture is still NONE"
  - id: ERR_FINDING_NOT_VERIFIED
    http: 409
    condition: "the referenced AssetFinding is not in status VERIFIED at enforcement-action creation"
  - id: ERR_FINDING_STALE
    http: 409
    condition: "the linked AssetFinding was staled by a superseding skip trace before the writ was requested"
  - id: ERR_DEBTOR_NOT_LOCATED
    http: 409
    condition: "the debtor's locate_status is not LOCATED when the examination order is served"
  - id: ERR_SAME_PARTY_COUNTER
    http: 409
    condition: "a counter-offer carries the same offered_by as the offer it responds to"
  - id: ERR_ACTION_ASSET_TYPE_MISMATCH
    http: 409
    condition: "WAGE_GARNISHMENT against a non-EMPLOYMENT finding, or BANK_LEVY against a non-BANK_ACCOUNT finding"
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "court_case_number already exists within the same state_code"
  - id: ERR_DUPLICATE_COUNTY_FILING
    http: 409
    condition: "another CountyFiling with the same (judgment_id, county_code, filing_type) is in status DRAFT, SUBMITTED or RECORDED"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "the counter-offer's round_number would exceed MAX_NEGOTIATION_ROUNDS"
  - id: ERR_CONTINUANCE_LIMIT
    http: 409
    condition: "a continuance is requested when continuance_count already equals MAX_CONTINUANCES"
  - id: ERR_RENEWAL_LIMIT_REACHED
    http: 409
    condition: "renewal requested when renewal_count already equals MAX_RENEWALS"
  - id: ERR_REINSTATEMENT_LIMIT
    http: 409
    condition: "reinstatement requested when reinstatement_count already equals MAX_REINSTATEMENTS"
  - id: ERR_SETTLEMENT_BELOW_FLOOR
    http: 422
    condition: "a non-ComplianceOfficer accepts an offer whose amount_cents is below the snapshotted min_acceptable_cents"
  - id: ERR_GARNISHMENT_BELOW_FLOOR
    http: 422
    condition: "the computed weekly withholding is 0 because disposable earnings do not exceed 30x the federal minimum wage"
  - id: ERR_NO_LEVIABLE_FUNDS
    http: 422
    condition: "the computed bank levy hold is 0 because available funds do not exceed the automatic exemption"
  - id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http: 422
    condition: "amount_cents exceeds the judgment's total payoff as of received_on"

# =============================================================================
# 1.7 RBAC Matrix — segregation of duties keyed on X-User-ID, not on role
# =============================================================================
roles:
  - name: CaseManager
    description: "Owns docketing, county filings, examinations, subpoenas, negotiation on the creditor's behalf, and money-in recording."
    identity: "opaque"
    exclusive_operations:
      - "POST /creditors"
      - "POST /debtors"
      - "POST /judgments"
      - "POST /county-filings"
      - "POST /county-filings/{county_filing_id}/submit"
      - "POST /county-filings/{county_filing_id}/adjudicate"
      - "POST /debtor-examinations"
      - "POST /debtor-examinations/{examination_id}/subpoena"
      - "POST /debtor-examinations/{examination_id}/serve"
      - "POST /debtor-examinations/{examination_id}/record-outcome"
      - "POST /enforcement-actions"
      - "POST /installment-agreements/{installment_agreement_id}/record-miss"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /settlement-offers"
      - "POST /settlement-offers/{settlement_offer_id}/accept"
      - "POST /settlement-offers/{settlement_offer_id}/reject"
      - "POST /payments"
      - "all GET endpoints except GET /asset-findings scoped reads shared with AssetInvestigator"

  - name: AssetInvestigator
    description: "Runs skip traces and records/verifies asset findings. Never touches enforcement instruments."
    identity: "opaque"
    exclusive_operations:
      - "POST /debtors/{debtor_id}/skip-trace"
      - "POST /asset-findings"
      - "POST /asset-findings/{asset_finding_id}/verify"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /debtors/{debtor_id}"
      - "GET /judgments"
      - "GET /judgments/{judgment_id}"
      - "GET /asset-findings"
      - "GET /asset-findings/{asset_finding_id}"

  - name: EnforcementOfficer
    description: "Requests, serves and releases writs, and opposes exemption claims. May never verify the finding a writ rests on (segregation of duties, keyed on X-User-ID)."
    identity: "opaque"
    exclusive_operations:
      - "POST /enforcement-actions/{enforcement_action_id}/request-writ"
      - "POST /enforcement-actions/{enforcement_action_id}/serve"
      - "POST /exemption-claims/{exemption_claim_id}/oppose"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /enforcement-actions/{enforcement_action_id}/release"
      - "GET /judgments"
      - "GET /judgments/{judgment_id}"
      - "GET /judgments/{judgment_id}/payoff"
      - "GET /debtors/{debtor_id}"
      - "GET /county-filings"
      - "GET /county-filings/{county_filing_id}"
      - "GET /asset-findings"
      - "GET /asset-findings/{asset_finding_id}"
      - "GET /enforcement-actions"
      - "GET /enforcement-actions/{enforcement_action_id}"
      - "GET /exemption-claims"
      - "GET /exemption-claims/{exemption_claim_id}"
      - "GET /debtor-examinations"
      - "GET /debtor-examinations/{examination_id}"

  - name: ComplianceOfficer
    description: "Rules on exemption claims, renews judgments, reinstates defaulted agreements, reverses payments, and may accept settlements below the floor. May never rule on a claim they themselves opposed."
    identity: "opaque"
    exclusive_operations:
      - "POST /exemption-claims/{exemption_claim_id}/rule"
      - "POST /judgments/{judgment_id}/renew"
      - "POST /installment-agreements/{installment_agreement_id}/reinstate"
      - "POST /payments/{payment_id}/reverse"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /enforcement-actions/{enforcement_action_id}/release"
      - "POST /settlement-offers/{settlement_offer_id}/accept"
      - "POST /settlement-offers/{settlement_offer_id}/reject"
      - "all GET endpoints"

  - name: Creditor
    description: "The judgment creditor acting through the client portal. Sees and negotiates only its own judgments."
    identity: "entity_backed:Creditor"
    exclusive_operations: []
    shared_operations:
      - "POST /settlement-offers"
      - "POST /settlement-offers/{settlement_offer_id}/accept"
      - "POST /settlement-offers/{settlement_offer_id}/reject"
      - "GET /judgments"
      - "GET /judgments/{judgment_id}"
      - "GET /judgments/{judgment_id}/payoff"
      - "GET /county-filings"
      - "GET /county-filings/{county_filing_id}"
      - "GET /enforcement-actions"
      - "GET /enforcement-actions/{enforcement_action_id}"
      - "GET /settlement-offers"
      - "GET /settlement-offers/{settlement_offer_id}"
      - "GET /installment-agreements"
      - "GET /installment-agreements/{installment_agreement_id}"
      - "GET /payments"
      - "GET /payments/{payment_id}"

  - name: Debtor
    description: "The judgment debtor acting through the debtor portal. Files exemption claims, tenders offers and pays."
    identity: "entity_backed:Debtor"
    exclusive_operations:
      - "POST /exemption-claims"
    shared_operations:
      - "POST /settlement-offers"
      - "POST /settlement-offers/{settlement_offer_id}/accept"
      - "POST /settlement-offers/{settlement_offer_id}/reject"
      - "POST /payments"
