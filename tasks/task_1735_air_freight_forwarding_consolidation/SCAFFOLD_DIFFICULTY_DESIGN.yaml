            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-B", origin_code: "SFO", destination_code: "NRT", pieces: 20, gross_weight_kg: 400.0, declared_volume_m3: 1.0, dg_flag: false }, as: ForwarderOps, captures: { hwb: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwb}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwb}/screening-records", as: ForwarderOps, captures: { srb: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srb}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { tot_a: "$.data.total_charge_amount" } }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv2: "$.data.version", mb_after_a: "$.data.total_freight_amount" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwb}", expected_master_waybill_version: "${mv2}" }, as: ForwarderOps }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mb_after_ab: "$.data.total_freight_amount" } }
            - { call: "DELETE /air-freight/master-waybills/${mb1}/house-waybills/${hwb}", as: ForwarderOps, captures: { b_zeroed: "$.data.total_charge_amount", b_basis: "$.data.weight_basis" } }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mb_after_decon: "$.data.total_freight_amount" } }
          assert:
            - "A alone: total_freight_amount == 475.00 (captured ${mb_after_a}); A's total_charge_amount == 475.00 (${tot_a})"
            - "A+B: total_freight_amount == 2300.00 == 475.00 + 1825.00 (captured ${mb_after_ab})"
            - "deconsolidate B: response shows B zeroed — total_charge_amount == 0 and weight_basis == UNRATED (captured ${b_zeroed}, ${b_basis})"
            - "after removal: total_freight_amount == 475.00 == the surviving waybill's total (captured ${mb_after_decon}) — no drift in the money invariant"
