              as_user_id: "U-AGENT-AB"
            - call: "POST /insurance-determinations/${co_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-AB"
            - call: "POST /insurance-determinations/${co_det_id}/certify"
