            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_a_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "MEDICATION", acuity: "URGENT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
