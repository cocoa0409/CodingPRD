  - name: storage_provisional_accrual_on_read
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.storage_charge
    - entities.StoragePlacement.fields.accrued_storage_charge_cents
    distinguishing_aspect: 'The provisional accrual tracks the logical clock: a STORED placement from 2026-08-01 read at 2026-08-04
      shows accrued_storage_charge_cents == 1001 (3 days), then release on the same date lands the identical final 1001.'
    test_recipe:
