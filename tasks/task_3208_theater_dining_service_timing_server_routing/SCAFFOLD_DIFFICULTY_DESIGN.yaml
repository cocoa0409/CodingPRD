              payload: { station: "hot_line" }
              as: KitchenLead
              captures: { hot_ticket_id: "$.data[0].id" }
            - call: "POST /order-slips/${slip_id}/prepare"
              payload: {}
              as: Server
              as_user_id: "${srv1_id}"
