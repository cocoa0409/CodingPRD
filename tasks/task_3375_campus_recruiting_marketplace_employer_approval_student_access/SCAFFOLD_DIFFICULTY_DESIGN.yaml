            - "HOP 2: GET /applications/${app_id} shows status == AUTO_WITHDRAWN"
            - "HOP 3: GET /applications/${app_id}/interviews returns Interview.${iv1_id} with status == CANCELLED"
            - "conditional exclusion: GET /applications/${app2_id} shows status == OFFER_EXTENDED (not AUTO_WITHDRAWN)"
            - "GET /job-postings/${post_id} shows active_application_count == 1 (only the OFFER_EXTENDED application remains active)"

      - name: student_withdrawal_cascades_applications_and_promotes_waitlist
