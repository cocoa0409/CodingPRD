        distinguishing_aspect: "Seeding an OPEN event whose accepted_entry_count has reached min_entries_to_stage moves it to SEEDED, stamps seeded_at_utc with the logical clock (not wall time), and bumps version — while accepted_entry_count and available_slots are left untouched by the seeding itself."
        test_recipe:
          setup:
            - "Standard fixture: REGISTRATION_OPEN edition, TRACK sport, T100M 60-64 event with capacity 8 and min_entries_to_stage 1, one athlete born 1966-03-02 paid up and one entry driven to ACCEPTED. The logical clock stays at its 2026-08-01T00:00:00Z default."
