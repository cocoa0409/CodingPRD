            - "HotelBlock.${block_id}.status == DRAFT"
            - "HotelBlock.${block_id}.revision_round == 0"
            - "HotelBlock.${block_id}.contracted_room_nights == 40"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 0"
            - "HotelBlock.${block_id}.released_rooms_per_night == 0"
            - "HotelBlock.${block_id}.attrition_liability_cents == 0"
            - "${block_v1} == 1"

