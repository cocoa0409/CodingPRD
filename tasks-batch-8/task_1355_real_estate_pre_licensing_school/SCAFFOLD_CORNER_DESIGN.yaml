  # ---------------------------------------------------------- validations ---
  - section: validations
    instances:
      - name: cn_existence_beats_business_rules
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_OFFERING_NOT_FOUND]"]
        distinguishing_aspect: "A nonexistent offering_id fails at existence (priority 4) with ERR_OFFERING_NOT_FOUND before any state or capacity rule could fire — even though no valid offering exists to be 'full'."
        test_recipe:
          setup: ["LICENSED school with one student; the referenced offering id does not exist"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /enrollments", payload: { offering_id: "00000000-0000-0000-0000-000000000000", student_id: "${st}" }, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OFFERING_NOT_FOUND (http 404)"

      - name: cn_director_scope_other_school
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_SCOPE]", "roles[SchoolDirector]"]
        distinguishing_aspect: "SchoolDirector B (X-User-ID dir-b) creating a course under director A's school is rejected ERR_FORBIDDEN_SCOPE — director_user_id ownership is enforced."
        test_recipe:
          setup: ["school created by director dir-a, LICENSED"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, as_user_id: "dir-a", captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
          trigger:
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30 }, as: SchoolDirector, as_user_id: "dir-b", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_SCOPE (http 403)   # dir-b does not own school ${sch}"

