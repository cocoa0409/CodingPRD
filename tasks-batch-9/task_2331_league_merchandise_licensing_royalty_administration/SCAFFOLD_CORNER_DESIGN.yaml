      - name: term_bound_outranks_the_closeout_limit
        claim_type: priority_conflict
        grounds:
          - validations.priority_25
          - validations.priority_30
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / period_outside_term_outranks_closeout_limit
          rationale: "The named §1.8 instance sends one payload that violates both rules and pins the lower-priority error_id."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: patch_draft_agreement_updates_only_the_editable_fields
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/licensing/agreements/{agreementId}
          - validations.priority_26
          - validations.priority_27
        distinguishing_aspect: |
          PATCH accepts exactly five fields and is legal only while
          contract_status == DRAFT; the fiscal floors are re-checked on the NEW
          values, so raising the guarantee to 1200000 forces the advance to at
          least floor(1200000 * 2500 / 10000) == 300000 — the payload sits exactly
          on that boundary and must pass. Omitted fields keep their stored values,
          contract_status stays DRAFT and version goes 1 -> 2.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_D3 ACTIVE with a DRAFT agreement AGR_D3 (MG 1000000, advance 250000, term 2026-01-01..2027-12-31, central_licensing_flag false)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "JERSEY products", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Deerpath Sport", contact_email: "ops@deerpath.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_d3: $.data.id }
            - call: "POST /licensing/licensees/${lic_d3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_d3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_d3: $.data.id }
          trigger:
            - call: "PATCH /licensing/agreements/${agr_d3}"
              payload: { minimum_guarantee_cents: 1200000, required_advance_cents: 300000, term_end_date: "2027-06-30" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          assert:
            - "response status is 200 with data.minimum_guarantee_cents == 1200000, data.required_advance_cents == 300000, data.term_end_date == '2027-06-30'"
            - "data.exclusivity_mode is still 'NON_EXCLUSIVE' and data.central_licensing_flag is still false (omitted fields are untouched)"
            - "data.contract_status == 'DRAFT' and data.version == 2"
            - "no ERR_ADVANCE_BELOW_FLOOR: 300000 == floor(1200000 * 2500 / 10000) exactly"

      - name: risk_index_read_computes_without_storing
        claim_type: computed_read
        grounds:
          - endpoints.GET_/licensing/licensees/{licenseeId}/risk-index
          - calculations.compliance_risk_index
          - entities.Licensee.fields.compliance_risk_index
        distinguishing_aspect: |
          This read returns a projection object, not the Licensee row: it defaults
          variant to ROLLING_MONITOR and as_of_quarter to QUARTER_OF(clock) ==
          2026Q3, and it exposes raw_weighted_total_milli so the single rounding
          step is observable. For a licensee with no factors the index is 0 in the
          CLEAR band with factor_count 0, and the read must leave
          Licensee.compliance_risk_index and Licensee.version untouched.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_E3 is ACTIVE (version 2 after activation) with no sample failures, rejections, returns, audits or seizures"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Eastvale Team Shop", contact_email: "ops@eastvale.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_e3: $.data.id }
            - call: "POST /licensing/licensees/${lic_e3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /licensing/licensees/${lic_e3}/risk-index"
              as: LeagueLicensingManager
          assert:
            - "response status is 200 with data.licensee_id == '${lic_e3}'"
            - "data.variant == 'ROLLING_MONITOR' and data.as_of_quarter == '2026Q3' (both defaulted)"
            - "data.index == 0, data.factor_count == 0, data.raw_weighted_total_milli == 0, data.posture_band == 'CLEAR'"
            - "Licensee.${lic_e3}.compliance_risk_index == 0 and Licensee.${lic_e3}.version is still 2 — the read stored nothing"

      - name: quarter_close_reports_counters_and_refuses_a_second_close
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/licensing/ops/quarter-close
          - validations.priority_42
          - errors.ERR_QUARTER_ALREADY_CLOSED
        distinguishing_aspect: |
          The operations endpoint returns a counter object rather than an entity,
          and each counter has its own population: one ACTIVE agreement is
          assessed for an interim shortfall (shortfalls_assessed 1) and one ACTIVE
          licensee is re-indexed (risk_indexes_recomputed 1), while nothing
          expires (term runs to 2027-12-31), no posture moves (index 0 stays in
          CLEAR) and no submission is held or released. Running it twice for
          2026Q3 is a 409 ERR_QUARTER_ALREADY_CLOSED, so the counters cannot be
          double-applied.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z, so QUARTER_OF(clock) == 2026Q3"
            - "exactly one ACTIVE licensee LIC_F3 with exactly one ACTIVE agreement AGR_F3 (term 2026-01-01..2027-12-31) and no product submissions"
            - "2026Q3 has not been closed yet"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "JERSEY products", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Fairmount Licensing", contact_email: "ops@fairmount.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_f3: $.data.id }
            - call: "POST /licensing/licensees/${lic_f3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_f3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_f3: $.data.id }
            - call: "POST /licensing/agreements/${agr_f3}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_f3}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_f3}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_f3}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/ops/quarter-close"
              payload: { as_of_quarter: "2026Q3" }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/ops/quarter-close"
              payload: { as_of_quarter: "2026Q3" }
              as: FinanceController
              as_user_id: "u_fin_1"
          assert:
            - "the first call returns 200 with data.as_of_quarter == '2026Q3'"
            - "data.agreements_expired == 0, data.shortfalls_assessed == 1, data.risk_indexes_recomputed == 1"
            - "data.postures_changed == 0, data.submissions_held == 0, data.submissions_released == 0"
            - "LicenseAgreement.${agr_f3}.contract_status is still 'ACTIVE' and compliance_posture is still 'CLEAR'"
            - "the second call returns 409 with data.error_id == 'ERR_QUARTER_ALREADY_CLOSED'"

      - name: unlock_returns_a_locked_run_to_open_and_clears_locked_at
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/licensing/distribution-runs/{runId}/unlock
          - state_machines.DistributionRun.LOCKED_to_OPEN
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          unlock is conditional on status == LOCKED and takes NO body — unlike
          lock and distribute it carries no expected_run_version, so it must not
          demand one. It clears locked_at back to null and still increments
          version (1 -> 2 on lock, 2 -> 3 on unlock); firing it again on the now
          OPEN run is a 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "a DistributionRun for 2026Q2 exists and has been LOCKED (version 2, locked_at set)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/distribution-runs"
              payload: { period_quarter: "2026Q2", league_admin_rate_bps: 800 }
              as: FinanceController
              as_user_id: "u_fin_1"
              captures: { run_g3: $.data.id }
            - call: "GET /licensing/distribution-runs/${run_g3}"
              as: FinanceController
              captures: { run_g3_v1: $.data.version }
            - call: "POST /licensing/distribution-runs/${run_g3}/lock"
              payload: { expected_run_version: "${run_g3_v1}" }
              as: FinanceController
              as_user_id: "u_fin_1"
          trigger:
            - call: "POST /licensing/distribution-runs/${run_g3}/unlock"
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/distribution-runs/${run_g3}/unlock"
              as: FinanceController
              as_user_id: "u_fin_1"
          assert:
            - "the first unlock returns 200 with data.status == 'OPEN', data.locked_at is null and data.version == 3"
            - "data.distributed_at is null and data.pool_gross_cents == 0 (unlocking pools nothing)"
            - "the second unlock returns 409 with data.error_id == 'ERR_INVALID_STATE' and the run stays at version 3"

  # ===========================================================================
  - section: errors
    instances:

      - name: mutation_without_the_x_user_id_header_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_3
          - errors.ERR_MISSING_USER_ID
        distinguishing_aspect: |
          A recognised X-Role with NO X-User-ID is a 400 ERR_MISSING_USER_ID, a
          different code and status from the 403 ERR_UNAUTHORIZED used for a bad
          role — the two must not be collapsed. The rule sits at priority 3, ahead
          of every payload check, so an otherwise perfectly valid create is still
          rejected and no Licensee row appears.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "no licensee named 'Headwater Team Sports' exists"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Headwater Team Sports", contact_email: "ops@headwater.example", home_country_code: "US" }
              as: LeagueLicensingManager
          assert:
            - "the request is sent with header X-Role: LeagueLicensingManager and NO X-User-ID header"
            - "response status is 400 with data.error_id == 'ERR_MISSING_USER_ID' (not 403 ERR_UNAUTHORIZED)"
            - "GET /licensing/licensees returns total_count == 0 — nothing was created"

      - name: distributing_a_run_with_no_eligible_reports_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_37
          - errors.ERR_EMPTY_DISTRIBUTION_POOL
          - state_machines.DistributionRun.LOCKED_to_DISTRIBUTED
        distinguishing_aspect: |
          An empty pool is an error, not a zero-value distribution: with an ACTIVE
          club present but no ACCEPTED central report for 2026Q2 the distribute
          call is a 409 ERR_EMPTY_DISTRIBUTION_POOL, the run stays LOCKED with
          distributed_at null, and no ClubDistribution row is written. An
          implementation that happily distributes 0 cents to every club would
          create rows that later reconciliation cannot explain.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "one ACTIVE club ATL with revenue_share_units 100"
            - "no RoyaltyReport exists at all"
            - "a DistributionRun for 2026Q2 exists and has been LOCKED"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/clubs"
              payload: { club_code: "ATL", market_name: "Atlanta", revenue_share_units: 100, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { club_atl: $.data.id }
            - call: "POST /licensing/distribution-runs"
              payload: { period_quarter: "2026Q2", league_admin_rate_bps: 800 }
              as: FinanceController
              as_user_id: "u_fin_1"
              captures: { run_i3: $.data.id }
            - call: "GET /licensing/distribution-runs/${run_i3}"
              as: FinanceController
              captures: { run_i3_v1: $.data.version }
            - call: "POST /licensing/distribution-runs/${run_i3}/lock"
