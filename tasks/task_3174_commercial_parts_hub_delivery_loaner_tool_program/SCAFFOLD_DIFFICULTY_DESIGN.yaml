    - state_machines.ToolLoan.field.status.transitions
    - calculations.replacement_selection
    distinguishing_aspect: 'A second cyclic machine on a different entity from the sibling

      instance: ToolCatalog loops LEVEL_1 through LEVEL_5 and back to LEVEL_1

      through the reset edge, which is reachable from every higher band,

      while ToolLoan carries a genuine CHECKED_OUT to CHECKED_OUT

      self-transition that must be observed in a reachable non-terminal

      state rather than at creation.

      '
