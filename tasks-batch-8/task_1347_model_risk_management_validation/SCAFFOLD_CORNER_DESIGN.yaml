              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_NO_COMPLETED_VALIDATION"

