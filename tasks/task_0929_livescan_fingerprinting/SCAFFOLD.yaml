scenario: "929. Livescan Fingerprinting & Background Service: appointment & service type (agency/ORI), fingerprint capture & quality/reject, submission (state/FBI) & result routing, fee & agency billing, rap-back subscription, mobile/onsite, re-print & rejection, retention"
domain_name: "livescan-fingerprinting-background-service"
api_prefix: "/livescan"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    The Originating Agency Identifier (Ori) is the parameterizing spine: its statutory_authority
    fixes destination_requirement, dissemination_tier, retention_permitted and rapback_authority,
    so the same FingerprintCard produces different required destinations, different fee totals,
    different response projections and a different rap-back eligibility per Ori. Submission carries
    three independent state axes on one row (state_status x fbi_status x retention_status) plus a
    derived composite_disposition, so the interesting cases are destination disagreements.
    Agency.billing_status is a global write gate over every Ori the Agency owns, with an
    enumerated exclusion list. Device calibration expiry is retroactive: a lapse audit supersedes
    every card captured after the last valid calibration.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Datetime rendering (applies to every datetime this API emits)
# ---------------------------------------------------------------------------
datetime_rendering: |
  Every datetime field the API returns — created_at, updated_at, transmitted_at,
  checked_in_at, calibration_expires_at, term_end, first_capture_at, routed_at,
  purge_requested_at and every other datetime — is rendered as ISO 8601 UTC with
  exactly three fractional-second digits and a trailing Z, e.g.
  "2026-06-02T10:00:00.000Z". This holds regardless of how the value was supplied
  on input: a request carrying "2026-06-02T10:00:00Z" is stored as that instant and
  read back as "2026-06-02T10:00:00.000Z". Date-only fields (issued_on, due_on,
  date_of_birth, id_document_expires_on, event_date, period_key) stay plain strings
  in their declared format and are never widened to datetimes. Every instant comes
  from the logical clock (§1.5 POST /livescan/_clock/set_current_utc), never from
  wall-clock time.

# ---------------------------------------------------------------------------
# Domain constants — every ALL_CAPS identifier used anywhere in this scaffold
# has its numeric value declared here (values are also repeated in the
# calculations[].constants block that consumes them).
# ---------------------------------------------------------------------------
domain_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

  # Appointment / site capacity
  SITE_WALKIN_RESERVE_PCT: 0.20
  APPOINTMENT_RESCHEDULE_WINDOW_HOURS: 24
  APPOINTMENT_MAX_RESCHEDULES: 2
  CHECKIN_EARLY_WINDOW_MINUTES: 30
  CHECKIN_LATE_GRACE_MINUTES: 10
  NO_SHOW_FEE_CENTS: 1500

  # Capture quality
  POSITION_COUNT: 10
  POSITION_PASS_THRESHOLD: 60
  POSITION_ATTEMPT_CEILING: 3
  EXCEPTION_POSITION_MAX: 2
  EXCEPTION_POSITION_HARD_MAX: 4
  CARD_MEAN_QUALITY_MIN: 65

  # Devices / onsite events
  DEVICE_CALIBRATION_VALID_DAYS: 180
  DEVICE_ASSIGNMENT_BUFFER_MINUTES: 30
  ONSITE_SHORTFALL_RATE_CENTS: 2200

  # Fees (cents unless noted)
  VENDOR_CONVENIENCE_FEE_CENTS: 995
  VENDOR_TAX_PCT: 0.0725
  PROCESSING_SURCHARGE_PCT: 0.035
  TRIP_SURCHARGE_PER_CARD_CENTS: 500
  REPRINT_FEE_CENTS: 1800
  AGENCY_DISCOUNT_TIER1_FLOOR_CENTS: 40000
  AGENCY_DISCOUNT_TIER1_PCT: 0.03
  AGENCY_DISCOUNT_TIER2_FLOOR_CENTS: 200000
  AGENCY_DISCOUNT_TIER2_PCT: 0.06

  # Invoicing / delinquency
  INVOICE_TERMS_DAYS: 30
  INVOICE_BUSINESS_TERMS_DAYS: 21
  AGENCY_SUSPENSION_AGING_DAYS: 45
  INVOICE_LATE_FEE_PCT: 0.015

  # Rejection / reprint / TCN
  FREE_REPRINT_WINDOW_DAYS: 30
  FREE_REPRINT_ALT_WINDOW_DAYS: 45
  REPRINT_MAX_PER_SUBMISSION: 3
  FREE_REPRINT_MAX_PER_SUBMISSION: 2
  TCN_PRESERVATION_WINDOW_DAYS: 90
  TCN_SUFFIX_MAX: 2

  # Rap-back
  RAPBACK_TERM_DAYS: 365
  RAPBACK_RENEWAL_WINDOW_DAYS: 60

  # Fitness determination / challenge
  CHALLENGE_FILING_WINDOW_DAYS: 21
  CHALLENGE_MAX_CYCLES: 2

  # Retention purge
  PURGE_DECISION_WINDOW_DAYS: 14

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the requesting agency
      - name: account_code
        type: string
        source: input
        description: vendor billing account code
        constraints: unique across Agency
      - name: billing_status
        type: enum
        source: computed
        description: billing posture; SUSPENDED freezes new submissions for every Ori of this Agency
        default: CURRENT
        constraints: one of {CURRENT, PAST_DUE, SUSPENDED}
      - name: payer_regime_default
        type: enum
        source: input
        description: payer regime applied to FeeAssessment rows created for this Agency's Oris
        default: APPLICANT_PAID
        constraints: one of {APPLICANT_PAID, AGENCY_BILLED, FEE_WAIVED}
      - name: invoice_terms_days
        type: integer
        source: input
        description: calendar-day payment terms stamped onto each Invoice at issue
        default: 30
        constraints: 1..90
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: sum of Invoice.total_cents - Invoice.paid_cents over invoices with status IN {ISSUED, PAST_DUE}
        default: 0
      - name: max_aging_days
        type: integer
        source: computed
        description: max Invoice.aging_days over invoices with status IN {ISSUED, PAST_DUE}; 0 when that set is empty
        default: 0
      - name: mtd_billed_cents
        type: integer
        source: computed
        description: month-to-date AGENCY_BILLED base for the volume-discount tier lookup; see calculations.agency_volume_discount
        default: 0
      - name: suspended_at
        type: datetime
        source: system
        description: logical-clock instant billing_status last became SUSPENDED; null when never suspended

  - name: Ori
    parent: Agency
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; the Agency that owns this ORI and is billed for it
      - name: ori_code
        type: string
        source: input
        description: nine-character Originating Agency Identifier
        constraints: unique across Ori; length 9
      - name: statutory_authority
        type: enum
        source: input
        description: statute the ORI submits under; drives the whole authority profile per calculations.ori_authority_profile
        constraints: one of {CRIMINAL_JUSTICE, NONCRIMINAL_STATUTORY, NONCRIMINAL_NOFED}
      - name: destination_requirement
        type: enum
        source: computed
        description: required destination set; CRIMINAL_JUSTICE and NONCRIMINAL_STATUTORY yield STATE_AND_FBI, NONCRIMINAL_NOFED yields STATE_ONLY
        constraints: one of {STATE_ONLY, STATE_AND_FBI}
      - name: dissemination_tier
        type: enum
        source: computed
        description: CRIMINAL_JUSTICE yields FULL_CHR; both NONCRIMINAL_* yield FITNESS_CODE_ONLY
        constraints: one of {FULL_CHR, FITNESS_CODE_ONLY}
      - name: retention_permitted
        type: boolean
        source: computed
        description: true for CRIMINAL_JUSTICE and NONCRIMINAL_STATUTORY, false for NONCRIMINAL_NOFED
      - name: rapback_authority
        type: boolean
        source: computed
        description: true for CRIMINAL_JUSTICE and NONCRIMINAL_STATUTORY, false for NONCRIMINAL_NOFED
      - name: authority_status
        type: enum
        source: computed
        description: ACTIVE or SUSPENDED; SUSPENDED blocks transmission for this ORI only
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}
      - name: fee_waiver_eligible
        type: boolean
        source: input
        description: whether statutory fee waiver may be elected for submissions under this ORI
        default: false
      - name: tcn_consumed_count
        type: integer
        source: computed
        description: count of transaction control numbers consumed by this ORI's transmissions (one per destination per transmission)
        default: 0
      - name: tcn_released_count
        type: integer
        source: computed
        description: count of transaction control numbers released back by purge reconciliation
        default: 0

  - name: ServiceType
    parent: Ori
    common_fields: true
    fields:
      - name: ori_id
        type: string
        source: input
        description: FK -> Ori.id; the ORI this service type submits under
      - name: code
        type: string
        source: input
        description: short service code
        constraints: unique within Ori
      - name: applicant_type
        type: enum
        source: input
        description: statutory applicant category
        constraints: one of {TEACHER, VOLUNTEER, HEALTHCARE, FIREARMS, EMPLOYMENT_OTHER}
      - name: slot_duration_minutes
        type: integer
        source: input
        description: appointment length this service type occupies at a CaptureSite
        constraints: one of {15, 30, 45}
      - name: required_document_codes
        type: array
        source: input
        description: document codes the applicant must present at check-in; every code must appear in Appointment.presented_documents
        constraints: non-empty subset of {PHOTO_ID, SSN_CARD, AGENCY_AUTH_FORM, LIVESCAN_REQUEST_FORM}
      - name: accepted_id_document_types
        type: array
        source: input
        description: identity document types accepted for this service type at check-in
        constraints: non-empty subset of {DRIVER_LICENSE, PASSPORT, STATE_ID, MILITARY_ID}
      - name: state_fee_cents
        type: integer
        source: input
        description: statutory state processing fee component
        constraints: 0..20000
      - name: federal_fee_cents
        type: integer
        source: input
        description: statutory federal fee component; charged only when the transmission includes the FBI destination
        constraints: 0..20000
      - name: retention_offered
        type: boolean
        source: input
        description: whether retention may be elected for this service type; retention needs BOTH this flag and Ori.retention_permitted
        default: false
      - name: status
        type: enum
        source: computed
        description: ACTIVE or RETIRED; RETIRED service types reject new appointments
        default: ACTIVE
        constraints: one of {ACTIVE, RETIRED}

  - name: CaptureSite
    parent: null
    common_fields: true
    fields:
      - name: site_kind
        type: enum
        source: input
        description: FIXED vendor storefront, or MOBILE_EVENT onsite session hosted at an agency address
        constraints: one of {FIXED, MOBILE_EVENT}
      - name: name
        type: string
        source: input
        description: site or event name
      - name: concurrent_capacity
        type: integer
        source: input
        description: maximum number of Appointment intervals that may overlap any instant at this site
        constraints: 1..50
      - name: walkin_usable_capacity
        type: integer
        source: computed
        description: concurrent_capacity - ceil(concurrent_capacity * SITE_WALKIN_RESERVE_PCT); ceiling of the walk-in channel only
      - name: host_agency_id
        type: string
        source: input
        description: FK -> Agency.id; required when site_kind == MOBILE_EVENT, must be null when site_kind == FIXED
      - name: event_window_start
        type: datetime
        source: input
        description: onsite event window start; required iff site_kind == MOBILE_EVENT
      - name: event_window_end
        type: datetime
        source: input
        description: onsite event window end; required iff site_kind == MOBILE_EVENT; must be strictly after event_window_start
      - name: min_billable_prints
        type: integer
        source: input
        description: contracted minimum billable prints for the event; required iff site_kind == MOBILE_EVENT
        constraints: 1..500
      - name: billable_print_count
        type: integer
        source: computed
        description: count of FingerprintCard rows at this site with status IN {SUBMITTED, CLOSED, REJECTED_CLOSED}; SUPERSEDED cards are excluded
        default: 0
      - name: reconciliation_status
        type: enum
        source: computed
        description: NOT_APPLICABLE for FIXED sites; PENDING then RECONCILED for MOBILE_EVENT sites
        default: NOT_APPLICABLE
        constraints: one of {NOT_APPLICABLE, PENDING, RECONCILED}
      - name: shortfall_charge_cents
        type: integer
        source: computed
        description: onsite shortfall charge stamped at reconciliation; see calculations.onsite_shortfall_charge
        default: 0

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: livescan scanner serial number
        constraints: unique across Device
      - name: home_site_id
        type: string
        source: input
        description: FK -> CaptureSite.id; the site the device normally lives at
      - name: last_calibrated_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent accepted calibration; set at create from the supplied calibrated_at
      - name: calibration_expires_at
        type: datetime
        source: computed
        description: last_calibrated_at + DEVICE_CALIBRATION_VALID_DAYS days
      - name: calibration_status
        type: enum
        source: computed
        description: CALIBRATED while clock <= calibration_expires_at; EXPIRED once the clock passes it; QUARANTINED after a lapse audit until re-calibrated
        default: CALIBRATED
        constraints: one of {CALIBRATED, EXPIRED, QUARANTINED}
      - name: capture_count
        type: integer
        source: computed
        description: count of FingerprintCard rows whose device_id is this device, any status
        default: 0
      - name: tainted_card_count
        type: integer
        source: computed
        description: count of FingerprintCard rows this device's lapse audits have moved to SUPERSEDED
        default: 0

  - name: DeviceAssignment
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the rostered device
      - name: site_id
        type: string
        source: input
        description: FK -> CaptureSite.id; the site (usually a MOBILE_EVENT) the device is rostered to
      - name: window_start
        type: datetime
        source: input
        description: assignment window start
      - name: window_end
        type: datetime
        source: input
        description: assignment window end; must be strictly after window_start
      - name: status
        type: enum
        source: computed
        description: SCHEDULED at create, ACTIVE once the clock is inside the window, RELEASED on release, REVOKED_TAINTED when a lapse audit invalidates it
        default: SCHEDULED
        constraints: one of {SCHEDULED, ACTIVE, RELEASED, REVOKED_TAINTED}
      - name: calibration_expires_at_snapshot
        type: datetime
        source: computed
        description: copy of Device.calibration_expires_at taken at assignment creation; the audit compares captures against the device's live value, not this snapshot
      - name: billable_print_count
        type: integer
        source: computed
        description: count of FingerprintCard rows at this site on this device with status IN {SUBMITTED, CLOSED, REJECTED_CLOSED}
        default: 0
      - name: tainted_print_count
        type: integer
        source: computed
        description: count of FingerprintCard rows on this device at this site moved to SUPERSEDED by a lapse audit
        default: 0

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: applicant legal name
      - name: date_of_birth
        type: string
        source: input
        description: ISO date (YYYY-MM-DD)
      - name: sex
        type: enum
        source: input
        description: demographic sex code required on every submission
        constraints: one of {M, F, X}
      - name: place_of_birth
        type: string
        source: input
        description: state or country of birth; optional at create, and its absence is what a destination rejects as REJECTED_ADMIN
      - name: id_document_type
        type: enum
        source: input
        description: identity document the applicant intends to present
        constraints: one of {DRIVER_LICENSE, PASSPORT, STATE_ID, MILITARY_ID}
      - name: id_document_expires_on
        type: string
        source: input
        description: ISO date the identity document expires; valid at check-in iff id_document_expires_on >= clock date (inclusive)
      - name: demographics_complete
        type: boolean
        source: computed
        description: true iff full_name, date_of_birth, sex and place_of_birth are all non-null and non-empty
        default: false

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the person being printed
      - name: site_id
        type: string
        source: input
        description: FK -> CaptureSite.id; where the capture happens
      - name: service_type_id
        type: string
        source: input
        description: FK -> ServiceType.id; fixes duration, document set, fee components and ORI
      - name: booking_channel
        type: enum
        source: input
        description: BOOKED consumes full concurrent_capacity; WALK_IN is capped at walkin_usable_capacity
        default: BOOKED
        constraints: one of {BOOKED, WALK_IN}
      - name: scheduled_start
        type: datetime
        source: input
        description: appointment interval start
      - name: scheduled_end
        type: datetime
        source: computed
        description: scheduled_start + ServiceType.slot_duration_minutes minutes; intervals are half-open [start, end)
      - name: status
        type: enum
        source: computed
        description: booking lifecycle
        default: BOOKED
        constraints: one of {BOOKED, CHECKED_IN, IN_CAPTURE, COMPLETED, NO_SHOW, CANCELLED}
      - name: reschedule_count
        type: integer
        source: computed
        description: number of accepted reschedules; capped at APPOINTMENT_MAX_RESCHEDULES
        default: 0
      - name: presented_document_type
        type: enum
        source: computed
        description: identity document type actually presented at check-in; null before check-in
        constraints: one of {DRIVER_LICENSE, PASSPORT, STATE_ID, MILITARY_ID}
      - name: presented_documents
        type: array
        source: computed
        description: document codes presented at check-in; must cover ServiceType.required_document_codes
      - name: checked_in_at
        type: datetime
        source: computed
        description: logical-clock instant of a successful check-in; null otherwise
      - name: no_show_fee_assessed
        type: boolean
        source: computed
        description: true once a NO_SHOW FeeAssessment has been created for this appointment; the assessment is discoverable via GET /livescan/fee-assessments?appointment_id=
        default: false

  - name: FingerprintCard
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the checked-in appointment this card was opened under
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the scanner every position on this card is captured on
      - name: site_id
        type: string
        source: computed
        description: FK -> CaptureSite.id; copied from the appointment at card creation, used for onsite billable-print accounting
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the LivescanTechnician that created the card; the exception override actor must differ from it
      - name: status
        type: enum
        source: computed
        description: capture lifecycle
        default: OPEN
        constraints: one of {OPEN, CAPTURING, READY_FOR_SUBMISSION, SUBMITTED, CLOSED, REJECTED_CLOSED, SUPERSEDED}
      - name: positions_passed_count
        type: integer
        source: computed
        description: count of PositionCapture rows on this card with status == PASSED
        default: 0
      - name: positions_exception_count
        type: integer
        source: computed
        description: count of PositionCapture rows on this card with status == EXCEPTION_CODED
        default: 0
      - name: mean_quality_score
        type: number
        source: computed
        description: mean best_score over PASSED positions only, 2 decimal places, round_half_up; 0.00 when no position has passed
        default: 0
      - name: worst_position_score
        type: integer
        source: computed
        description: minimum best_score over PASSED positions; null when no position has passed
      - name: submittable
        type: boolean
        source: computed
        description: pinned governing rule per calculations.card_quality_aggregate — every position PASSED or EXCEPTION_CODED, positions_exception_count <= the applicable exception ceiling, and mean_quality_score >= CARD_MEAN_QUALITY_MIN
        default: false
      - name: exception_override_by_user_id
        type: string
        source: computed
        description: X-User-ID of the SiteSupervisor that authorized exceeding EXCEPTION_POSITION_MAX; null when no override was granted
      - name: superseded_by_card_id
        type: string
        source: computed
        description: FK -> FingerprintCard.id; the replacement card when this one was superseded by a reprint or a calibration lapse audit
      - name: reprint_of_submission_id
        type: string
        source: input
        description: FK -> Submission.id; set only on cards created by a reprint authorization, null on first-print cards
      - name: free_reprint_granted
        type: boolean
        source: computed
        description: entitlement decided by calculations.reprint_entitlement at the authorization instant and stamped here; the transmission's FeeAssessment reads this flag rather than re-evaluating the window
        default: false
      - name: taint_reason
        type: enum
        source: computed
        description: why the card was superseded; null unless status == SUPERSEDED
        constraints: one of {CALIBRATION_LAPSE, PURGED_RECORD}
      - name: first_capture_at
        type: datetime
        source: computed
        description: logical-clock instant of the first scored attempt on this card; null before any attempt
      - name: last_capture_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent scored attempt or exception on this card

  - name: PositionCapture
    parent: FingerprintCard
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> FingerprintCard.id; the card this finger position belongs to
      - name: position_code
        type: enum
        source: system
        description: which of the ten finger positions; all ten rows are created by card creation
        constraints: one of {R_THUMB, R_INDEX, R_MIDDLE, R_RING, R_LITTLE, L_THUMB, L_INDEX, L_MIDDLE, L_RING, L_LITTLE}
      - name: attempt_count
        type: integer
        source: computed
        description: number of scored attempts recorded against this position
        default: 0
      - name: best_score
        type: integer
        source: computed
        description: maximum score over all attempts on this position; null before the first attempt
        constraints: 0..100
      - name: status
        type: enum
        source: computed
        description: per-position lifecycle
        default: PENDING
        constraints: one of {PENDING, PASSED, FAILED_RETRYABLE, CEILING_REACHED, EXCEPTION_CODED}
      - name: exception_code
        type: enum
        source: computed
        description: closure reason when the position cannot be scored; null unless status == EXCEPTION_CODED
        constraints: one of {AMPUTATED, BANDAGED, UNCLASSIFIABLE}
      - name: closed_at
        type: datetime
        source: computed
        description: logical-clock instant the position reached PASSED or EXCEPTION_CODED; null otherwise

  - name: Submission
    parent: FingerprintCard
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> FingerprintCard.id; the card transmitted
      - name: ori_id
        type: string
        source: computed
        description: FK -> Ori.id; resolved from the card's appointment service type at transmission
      - name: original_submission_id
        type: string
        source: computed
        description: FK -> Submission.id; the first-print submission this one reprints, null on a first print
      - name: reprint_sequence
        type: integer
        source: computed
        description: 0 on a first print, then 1, 2, 3 for successive reprints of the same original
        default: 0
      - name: transmitted_at
        type: datetime
        source: computed
        description: logical-clock instant of transmission
      - name: destinations
        type: array
        source: computed
        description: destination codes actually transmitted; equals [STATE] for STATE_ONLY ORIs and [STATE, FBI] for STATE_AND_FBI ORIs
        constraints: subset of {STATE, FBI}
      - name: state_status
        type: enum
        source: computed
        description: state destination axis; advances independently of fbi_status
        default: PENDING
        constraints: one of {PENDING, ACCEPTED, REJECTED_TECHNICAL, REJECTED_ADMIN}
      - name: fbi_status
        type: enum
        source: computed
        description: FBI destination axis; NOT_REQUIRED when the ORI is STATE_ONLY
        default: PENDING
        constraints: one of {NOT_REQUIRED, PENDING, ACCEPTED, REJECTED_TECHNICAL, REJECTED_ADMIN}
      - name: composite_disposition
        type: enum
        source: computed
        description: derived from both destination axes per calculations.submission_composite_disposition
        default: INCOMPLETE
        constraints: one of {INCOMPLETE, CLEARED, HIT, REJECTED, MIXED}
      - name: retention_requested
        type: boolean
        source: input
        description: irrevocable retention election supplied at transmission; may never be changed afterwards
        default: false
      - name: retention_status
        type: enum
        source: computed
        description: retention axis, independent of both destination axes
        default: NOT_REQUESTED
        constraints: one of {NOT_REQUESTED, GRANTED, PURGE_REQUESTED, PURGE_DENIED, PURGED}
      - name: tcn_root
        type: string
        source: computed
        description: transaction control number root minted at first transmission and preserved by reprints inside TCN_PRESERVATION_WINDOW_DAYS
      - name: tcn_suffix
        type: integer
        source: computed
        description: 0 on a first print; 1..TCN_SUFFIX_MAX on reprints that preserve the root
        default: 0
      - name: tcn_full
        type: string
        source: computed
        description: tcn_root when tcn_suffix == 0, otherwise tcn_root + "-" + tcn_suffix
      - name: state_resulted_at
        type: datetime
        source: computed
        description: logical-clock instant the state destination returned a result; anchors the free-reprint window
      - name: fbi_resulted_at
        type: datetime
        source: computed
        description: logical-clock instant the FBI destination returned a result
      - name: reprint_count
        type: integer
        source: computed
        description: number of reprint authorizations issued against this submission
        default: 0
      - name: free_reprint_count
        type: integer
        source: computed
        description: number of no-fee reprints already granted against this submission
        default: 0
      - name: purge_requested_at
        type: datetime
        source: computed
        description: logical-clock instant a purge was requested; null otherwise
      - name: purge_requested_by_user_id
        type: string
        source: computed
        description: X-User-ID that requested the purge
      - name: purge_decided_by_user_id
        type: string
        source: computed
        description: X-User-ID that granted or denied the purge; must differ from purge_requested_by_user_id

  - name: ChrResponse
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> Submission.id; the transmission this response answers
      - name: destination
        type: enum
        source: input
        description: which destination produced this response
        constraints: one of {STATE, FBI}
      - name: record_count
        type: integer
        source: input
        description: number of criminal-history records returned by the destination
        constraints: 0..99
      - name: disqualifying_offense_count
        type: integer
        source: input
        description: number of returned records that are statutorily disqualifying; must be <= record_count
        constraints: 0..99
      - name: record_detail
        type: string
        source: input
        description: verbatim rap-sheet text; disclosed only to FULL_CHR recipients, never projected for FITNESS_CODE_ONLY ORIs
      - name: fitness_code
        type: enum
        source: computed
        description: derived per calculations.fitness_code_derivation from record_count and disqualifying_offense_count
        constraints: one of {ELIGIBLE, ELIGIBLE_WITH_NOTICE, INELIGIBLE}
      - name: routing_status
        type: enum
        source: computed
        description: RECEIVED at creation, ROUTED once projected to entitled recipients, VOIDED by a purge, SUPERSEDED when a reprint replaces the transmission
        default: RECEIVED
        constraints: one of {RECEIVED, ROUTED, VOIDED, SUPERSEDED}
      - name: routed_at
        type: datetime
        source: computed
        description: logical-clock instant routing_status became ROUTED
      - name: routed_recipient_roles
        type: array
        source: computed
        description: role names the response was routed to; AgencyAdjudicator always, Applicant only for the fitness-code projection
        constraints: subset of {AgencyAdjudicator, Applicant}

  - name: FitnessDetermination
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> Submission.id; the transmission adjudicated
      - name: ori_id
        type: string
        source: computed
        description: FK -> Ori.id; copied from the submission at issuance
      - name: basis_response_id
        type: string
        source: computed
        description: FK -> ChrResponse.id; the STATE response the determination was based on; purging it vacates this determination
      - name: outcome
        type: enum
        source: input
        description: adjudicated fitness outcome
        constraints: one of {FIT, NOT_FIT, FIT_WITH_CONDITIONS}
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyAdjudicator that issued it; may not resolve its own challenge
      - name: resolved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the AgencyAdjudicator that resolved the latest challenge; null before any resolution
      - name: status
        type: enum
        source: computed
        description: adjudication lifecycle with a capped challenge cycle
        default: ISSUED
        constraints: one of {ISSUED, CHALLENGED, REAFFIRMED, AMENDED, VACATED}
      - name: challenge_count
        type: integer
        source: computed
        description: number of challenges filed against this determination; capped at CHALLENGE_MAX_CYCLES
        default: 0
      - name: challenge_filed_at
        type: datetime
        source: computed
        description: logical-clock instant of the currently open challenge; null when none is open
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant of issuance; anchors CHALLENGE_FILING_WINDOW_DAYS

  - name: RapbackSubscription
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: FK -> Submission.id; the retained transmission the subscription hangs off
      - name: ori_id
        type: string
        source: computed
        description: FK -> Ori.id; copied from the submission at subscribe time
      - name: term_start
        type: datetime
        source: computed
        description: logical-clock instant of the subscribe or renew that opened the current term
      - name: term_end
        type: datetime
        source: computed
        description: term_start + RAPBACK_TERM_DAYS days per calculations.rapback_term_expiry
      - name: status
        type: enum
        source: computed
        description: subscription lifecycle; LAPSED is terminal and cannot be renewed
        default: ACTIVE
        constraints: one of {ACTIVE, RENEWAL_DUE, LAPSED, CANCELLED, TERMINATED}
      - name: renewal_count
        type: integer
        source: computed
        description: number of accepted renewals
        default: 0
      - name: notifications_received_count
        type: integer
        source: computed
        description: count of RapbackNotification rows bound to this subscription, any status
        default: 0
      - name: notifications_routed_count
        type: integer
        source: computed
        description: count of bound notifications with status IN {ROUTED, ACKNOWLEDGED}
        default: 0
      - name: notifications_voided_count
        type: integer
        source: computed
        description: count of bound notifications with status == VOIDED
        default: 0

  - name: RapbackNotification
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: computed
        description: FK -> RapbackSubscription.id; the ACTIVE or RENEWAL_DUE subscription the notification bound to, null when it could not bind
      - name: ori_code
        type: string
        source: input
        description: ORI code the destination stamped on the notification; plain value, not a foreign key
      - name: subject_submission_tcn
        type: string
        source: input
        description: tcn_full of the retained transmission the notification concerns; used to locate the subscription
      - name: event_type
        type: enum
        source: input
        description: rap-back event class
        constraints: one of {ARREST, DISPOSITION, WARRANT}
      - name: event_date
        type: string
        source: input
        description: ISO date of the criminal-justice event
      - name: status
        type: enum
        source: computed
        description: ROUTED when bound to a routable subscription, ORPHANED when no routable subscription exists, VOIDED when a purge kills its subscription
        default: ROUTED
        constraints: one of {ROUTED, ACKNOWLEDGED, ORPHANED, VOIDED}
      - name: acknowledged_by_user_id
        type: string
        source: computed
        description: X-User-ID of the AgencyAdjudicator that acknowledged it; null before acknowledgment

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: computed
        description: FK -> Agency.id; the agency that owns the ORI or hosted the event
      - name: submission_id
        type: string
        source: computed
        description: FK -> Submission.id; null for NO_SHOW and ONSITE_SHORTFALL assessments
      - name: appointment_id
        type: string
        source: computed
        description: FK -> Appointment.id; set for SUBMISSION, REPRINT and NO_SHOW assessments, null for ONSITE_SHORTFALL
      - name: invoice_id
        type: string
        source: computed
        description: FK -> Invoice.id; set when the assessment is attached to an agency invoice, null for APPLICANT_PAID
      - name: assessment_kind
        type: enum
        source: computed
        description: what generated the assessment
        constraints: one of {SUBMISSION, REPRINT, NO_SHOW, ONSITE_SHORTFALL}
      - name: payer_regime
        type: enum
        source: computed
        description: payer regime in force for this assessment; copied from Agency.payer_regime_default at creation
        constraints: one of {APPLICANT_PAID, AGENCY_BILLED, FEE_WAIVED}
      - name: state_fee_cents
        type: integer
        source: computed
        description: statutory state component before waiver
        default: 0
      - name: federal_fee_cents
        type: integer
        source: computed
        description: statutory federal component before waiver; 0 when the transmission has no FBI destination
        default: 0
      - name: processing_surcharge_cents
        type: integer
        source: computed
        description: PROCESSING_SURCHARGE_PCT of (state_fee_cents + federal_fee_cents), rounded per-component
        default: 0
      - name: vendor_convenience_fee_cents
        type: integer
        source: computed
        description: VENDOR_CONVENIENCE_FEE_CENTS; never covered by a statutory waiver
        default: 0
      - name: vendor_tax_cents
        type: integer
        source: computed
        description: VENDOR_TAX_PCT of vendor_convenience_fee_cents, rounded per-component
        default: 0
      - name: trip_surcharge_cents
        type: integer
        source: computed
        description: TRIP_SURCHARGE_PER_CARD_CENTS when the capture site is a MOBILE_EVENT, else 0
        default: 0
      - name: reprint_fee_cents
        type: integer
        source: computed
        description: REPRINT_FEE_CENTS on a chargeable reprint, 0 on a free reprint or a first print
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: sum of the components a FEE_WAIVED regime removes (state, federal, processing surcharge only)
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: agency volume discount applied after the waiver per calculations.fee_assessment_total
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: payable total after waiver, discount and the pinned rounding order
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: cash received against this assessment
        default: 0
      - name: credited_cents
        type: integer
        source: computed
        description: vendor-borne credit issued against this assessment (calibration-lapse reprints)
        default: 0
      - name: status
        type: enum
        source: computed
        description: assessment lifecycle
        default: ASSESSED
        constraints: one of {ASSESSED, INVOICED, PAID, CREDITED}

  - name: Invoice
    parent: Agency
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; the billed agency
      - name: period_key
        type: string
        source: input
        description: billing period label, format YYYY-MM
        constraints: unique per Agency among invoices with status != WRITTEN_OFF
      - name: issued_on
        type: string
        source: computed
        description: ISO date the invoice was issued; null while DRAFT
      - name: due_on
        type: string
        source: computed
        description: issued_on + Agency.invoice_terms_days calendar days; null while DRAFT
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of total_cents over attached FeeAssessment rows with status IN {INVOICED, PAID}
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: accumulated late fees added by aging runs
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + late_fee_cents
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: cash received against this invoice
        default: 0
      - name: aging_days
        type: integer
        source: computed
        description: calendar days past due_on as of the logical clock, 0 while not yet past due; see calculations.invoice_aging_days
        default: 0
      - name: status
        type: enum
        source: computed
        description: invoice lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, PAST_DUE, PAID, WRITTEN_OFF}

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# 17 axes over 13 entities. Submission carries three independent axes on one
# row (state_status x fbi_status x retention_status); composite_disposition is
# derived from the first two by calculations.submission_composite_disposition.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Agency
    axis: billing_status
    initial_state: CURRENT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /livescan/_ops/aging-run — an invoice of this agency crossed its terms"
        actor: VendorAdmin
        preconditions:
          - "Agency.max_aging_days >= 1 after the run recomputed every ISSUED/PAST_DUE invoice"
          - "Agency.max_aging_days < AGENCY_SUSPENSION_AGING_DAYS (45)"
        side_effects:
          - "sets Agency.outstanding_balance_cents to the recomputed sum over invoices with status IN {ISSUED, PAST_DUE}"
          - "increments Agency.version by 1"
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /livescan/_ops/aging-run — aging crossed the suspension threshold"
        actor: VendorAdmin
        preconditions:
          - "Agency.max_aging_days >= AGENCY_SUSPENSION_AGING_DAYS (45)"
        side_effects:
          - "stamps Agency.suspended_at with the logical clock"
          - "CASCADE hop 3: because the agency is suspended, every Appointment with status == BOOKED whose site is a MOBILE_EVENT CaptureSite with host_agency_id == this agency moves to CANCELLED (conditional leg: appointments at FIXED sites are untouched)"
          - "freezes the write set enumerated in validations[priority=6]; the exclusion list there stays allowed"
          - "increments Agency.version by 1"
      - from: SUSPENDED
        to: CURRENT
        trigger: "POST /livescan/invoices/{id}/payments — final payment clears every past-due invoice"
        actor: VendorAdmin
        preconditions:
          - "after the payment, no Invoice of this agency has status IN {ISSUED, PAST_DUE} with total_cents > paid_cents"
        side_effects:
          - "clears Agency.suspended_at to null"
          - "sets Agency.outstanding_balance_cents to 0 and Agency.max_aging_days to 0"
          - "lifts the submission freeze for every Ori of this agency"
          - "increments Agency.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /livescan/invoices/{id}/payments — payment clears the aging invoice before suspension"
        actor: VendorAdmin
        preconditions:
          - "after the payment, no Invoice of this agency has status IN {ISSUED, PAST_DUE} with total_cents > paid_cents"
        side_effects:
          - "sets Agency.max_aging_days to 0 and Agency.outstanding_balance_cents to 0"
          - "increments Agency.version by 1"

  - entity: Invoice
    axis: status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    shape: branching_with_cycle
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /livescan/invoices/{id}/issue"
        actor: VendorAdmin
        preconditions:
          - "at least one FeeAssessment with status == ASSESSED, payer_regime == AGENCY_BILLED and agency_id == Invoice.agency_id exists"
        side_effects:
          - "attaches every FeeAssessment with status == ASSESSED, payer_regime == AGENCY_BILLED and agency_id == Invoice.agency_id, ordered by created_at ASC, setting their invoice_id and status to INVOICED"
          - "stamps issued_on with the logical-clock date and due_on with issued_on + Agency.invoice_terms_days calendar days"
          - "recomputes subtotal_cents and total_cents"
          - "increments Agency.outstanding_balance_cents by total_cents"
      - from: ISSUED
        to: PAST_DUE
        trigger: "POST /livescan/_ops/aging-run"
        actor: VendorAdmin
        preconditions:
          - "calculations.invoice_aging_days yields aging_days >= 1 (clock date strictly after due_on)"
          - "paid_cents < total_cents"
        side_effects:
          - "sets aging_days per calculations.invoice_aging_days"
          - "CASCADE hop 2: because the invoice went past due, late_fee_cents increases by round_half_up(INVOICE_LATE_FEE_PCT * (total_cents - paid_cents)) and total_cents is recomputed as subtotal_cents + late_fee_cents"
          - "CASCADE hop 3: because total_cents grew, Agency.outstanding_balance_cents and Agency.max_aging_days are recomputed, which may drive Agency.billing_status to PAST_DUE or SUSPENDED"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /livescan/invoices/{id}/payments"
        actor: VendorAdmin
        preconditions:
          - "paid_cents + amount_cents >= total_cents"
        side_effects:
          - "sets paid_cents, sets aging_days to 0"
          - "sets every attached FeeAssessment with status == INVOICED to PAID"
          - "recomputes Agency.outstanding_balance_cents and Agency.max_aging_days, which may lift Agency.billing_status"
      - from: ISSUED
        to: PAID
        trigger: "POST /livescan/invoices/{id}/payments"
        actor: VendorAdmin
        preconditions:
          - "paid_cents + amount_cents >= total_cents"
        side_effects:
          - "sets paid_cents"
          - "sets every attached FeeAssessment with status == INVOICED to PAID"
          - "recomputes Agency.outstanding_balance_cents"
      - from: PAST_DUE
        to: WRITTEN_OFF
        trigger: "POST /livescan/_ops/aging-run with write_off_over_days supplied"
        actor: VendorAdmin
        preconditions:
          - "aging_days >= write_off_over_days"
        side_effects:
          - "zeroes the unpaid balance out of Agency.outstanding_balance_cents"
          - "sets every attached FeeAssessment with status == INVOICED to CREDITED with credited_cents = total_cents"
          - "recomputes Agency.max_aging_days, which may lift Agency.billing_status to CURRENT"

  - entity: Ori
    axis: authority_status
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /livescan/oris/{id}/authority-status with to_status SUSPENDED"
        actor: VendorAdmin
        preconditions:
          - "Ori.authority_status == ACTIVE"
        side_effects:
          - "blocks POST /livescan/submissions for this ORI with ERR_ORI_AUTHORITY_SUSPENDED while leaving other ORIs of the same agency usable"
          - "increments Ori.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /livescan/oris/{id}/authority-status with to_status ACTIVE"
        actor: VendorAdmin
        preconditions:
          - "Ori.authority_status == SUSPENDED"
        side_effects:
          - "restores transmission eligibility for this ORI"
          - "increments Ori.version by 1"

  - entity: CaptureSite
    axis: reconciliation_status
    initial_state: NOT_APPLICABLE
    terminal_states: [RECONCILED]
    shape: linear
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING
        trigger: "POST /livescan/sites — creating a site with site_kind == MOBILE_EVENT"
        actor: VendorAdmin
        preconditions:
          - "site_kind == MOBILE_EVENT"
          - "host_agency_id, event_window_start, event_window_end and min_billable_prints are all supplied"
        side_effects:
          - "sets walkin_usable_capacity to concurrent_capacity - ceil(concurrent_capacity * SITE_WALKIN_RESERVE_PCT)"
        note: "FIXED sites stay at NOT_APPLICABLE forever, which is why NOT_APPLICABLE is not listed as terminal"
      - from: PENDING
        to: RECONCILED
        trigger: "POST /livescan/sites/{id}/event-reconciliation"
        actor: VendorAdmin
        preconditions:
          - "site_kind == MOBILE_EVENT"
          - "logical clock >= event_window_end"
          - "reconciliation_status == PENDING"
        side_effects:
          - "recomputes billable_print_count as the count of FingerprintCard rows at this site with status IN {SUBMITTED, CLOSED, REJECTED_CLOSED}"
          - "sets shortfall_charge_cents per calculations.onsite_shortfall_charge"
          - "creates one FeeAssessment with assessment_kind ONSITE_SHORTFALL and payer_regime AGENCY_BILLED when shortfall_charge_cents > 0, and creates none when it is 0"
          - "sets every DeviceAssignment at this site with status IN {SCHEDULED, ACTIVE} to RELEASED"

  - entity: Device
    axis: calibration_status
    initial_state: CALIBRATED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: CALIBRATED
        to: EXPIRED
        trigger: "system — the logical clock passes Device.calibration_expires_at; evaluated on every read and on every capture attempt"
        actor: system
        preconditions:
          - "logical clock > Device.calibration_expires_at"
        side_effects:
          - "further POST /livescan/cards/{id}/positions/{position_code}/attempts on this device are refused with ERR_DEVICE_CALIBRATION_EXPIRED"
      - from: CALIBRATED
        to: QUARANTINED
        trigger: "POST /livescan/devices/{id}/calibration-audit with corrected_last_calibrated_at"
        actor: VendorAdmin
        preconditions:
          - "corrected_last_calibrated_at <= Device.last_calibrated_at — an audit may only move the true calibration instant BACKWARDS, otherwise ERR_INVALID_REQUEST"
          - "logical clock > corrected_last_calibrated_at + DEVICE_CALIBRATION_VALID_DAYS (180) days, i.e. the corrected certificate had already lapsed"
        side_effects:
          - "CASCADE hop 1 of the calibration-lapse chain: rewrites last_calibrated_at to corrected_last_calibrated_at, recomputes calibration_expires_at, and sets calibration_status to QUARANTINED"
          - "CASCADE hop 2: because the device is quarantined, every DeviceAssignment on it with status IN {SCHEDULED, ACTIVE} moves to REVOKED_TAINTED"
          - "CASCADE hop 3: because those assignments are revoked, every FingerprintCard on this device with first_capture_at > the RECOMPUTED Device.calibration_expires_at and status IN {OPEN, CAPTURING, READY_FOR_SUBMISSION, SUBMITTED, CLOSED, REJECTED_CLOSED} moves to SUPERSEDED with taint_reason CALIBRATION_LAPSE, processed in first_capture_at ASC then created_at ASC order"
          - "CASCADE hop 4: because those cards are void, each superseded card's ChrResponse rows move to SUPERSEDED"
          - "CASCADE hop 5: because the prints must be redone at vendor cost, each superseded card's SUBMISSION or REPRINT FeeAssessment with status IN {ASSESSED, INVOICED} moves to CREDITED with credited_cents = total_cents"
          - "CASCADE hop 6: because the billable set shrank, CaptureSite.billable_print_count is recomputed and each revoked DeviceAssignment's tainted_print_count is set"
          - "sets Device.tainted_card_count to the number of cards moved in hop 3"
      - from: QUARANTINED
        to: CALIBRATED
        trigger: "POST /livescan/devices/{id}/calibration"
        actor: VendorAdmin
        preconditions:
          - "calibration_status IN {EXPIRED, QUARANTINED}"
          - "calibrated_at is not earlier than Device.last_calibrated_at"
        side_effects:
          - "sets last_calibrated_at to the supplied calibrated_at and calibration_expires_at to that value + DEVICE_CALIBRATION_VALID_DAYS days"
          - "increments Device.version by 1"
      - from: EXPIRED
        to: CALIBRATED
        trigger: "POST /livescan/devices/{id}/calibration"
        actor: VendorAdmin
        preconditions:
          - "calibration_status IN {EXPIRED, QUARANTINED}"
        side_effects:
          - "sets last_calibrated_at and calibration_expires_at as above without touching any already-superseded card"

  - entity: DeviceAssignment
    axis: status
    initial_state: SCHEDULED
    terminal_states: [RELEASED, REVOKED_TAINTED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system — the logical clock enters [window_start, window_end)"
        actor: system
        preconditions:
          - "window_start <= logical clock < window_end"
        side_effects:
          - "captures on this device at this site become permitted"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /livescan/device-assignments/{id}/release"
        actor: SiteSupervisor
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "recomputes billable_print_count over FingerprintCard rows on this device at this site with status IN {SUBMITTED, CLOSED, REJECTED_CLOSED}"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /livescan/device-assignments/{id}/release"
        actor: SiteSupervisor
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "frees the device window so a later overlapping assignment is accepted"
      - from: ACTIVE
        to: REVOKED_TAINTED
        trigger: "POST /livescan/devices/{id}/calibration-audit"
        actor: VendorAdmin
        preconditions:
          - "the parent Device moved to QUARANTINED in this request"
        side_effects:
          - "sets tainted_print_count to the number of cards on this device at this site that hop 3 of the calibration-lapse cascade superseded"
      - from: SCHEDULED
        to: REVOKED_TAINTED
        trigger: "POST /livescan/devices/{id}/calibration-audit"
        actor: VendorAdmin
        preconditions:
          - "the parent Device moved to QUARANTINED in this request"
        side_effects:
          - "leaves tainted_print_count at 0 because a SCHEDULED assignment has no captures yet (conditional leg)"

  - entity: Appointment
    axis: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    shape: branching_with_cycle
    transitions:
      - from: BOOKED
        to: BOOKED
        trigger: "POST /livescan/appointments/{id}/reschedule"
        actor: Applicant
        preconditions:
          - "status == BOOKED"
          - "logical clock <= scheduled_start - APPOINTMENT_RESCHEDULE_WINDOW_HOURS hours (24h), otherwise ERR_RESCHEDULE_WINDOW_CLOSED"
          - "reschedule_count < APPOINTMENT_MAX_RESCHEDULES (2)"
          - "the new interval passes calculations.site_concurrent_load for the target site, excluding this appointment's own current interval"
        side_effects:
          - "sets scheduled_start to the new value and scheduled_end to new start + ServiceType.slot_duration_minutes"
          - "increments reschedule_count by 1"
          - "increments Appointment.version by 1"
        note: "self-loop; this is the cycle in the appointment axis"
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /livescan/appointments/{id}/check-in"
        actor: LivescanTechnician
        preconditions:
          - "status == BOOKED"
          - "scheduled_start - CHECKIN_EARLY_WINDOW_MINUTES (30) <= logical clock <= scheduled_start + CHECKIN_LATE_GRACE_MINUTES (10)"
          - "presented_document_type is in ServiceType.accepted_id_document_types"
          - "Applicant.id_document_expires_on >= the logical-clock date (inclusive)"
          - "presented_documents covers every code in ServiceType.required_document_codes"
        side_effects:
          - "stamps checked_in_at, presented_document_type and presented_documents"
          - "unlocks POST /livescan/cards for this appointment"
      - from: CHECKED_IN
        to: IN_CAPTURE
        trigger: "POST /livescan/cards"
        actor: LivescanTechnician
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "creates one FingerprintCard in OPEN plus ten PositionCapture rows in PENDING"
      - from: IN_CAPTURE
        to: COMPLETED
        trigger: "POST /livescan/submissions"
        actor: LivescanTechnician
        preconditions:
          - "the card of this appointment reached READY_FOR_SUBMISSION and is transmitted in this request"
        side_effects:
          - "increments CaptureSite.billable_print_count by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /livescan/appointments/{id}/no-show"
        actor: LivescanTechnician
        preconditions:
          - "status == BOOKED"
          - "logical clock > scheduled_start + CHECKIN_LATE_GRACE_MINUTES (10)"
        side_effects:
          - "creates one FeeAssessment with assessment_kind NO_SHOW, total_cents NO_SHOW_FEE_CENTS (1500) and payer_regime copied from Agency.payer_regime_default"
          - "sets no_show_fee_assessed to true"
          - "releases the interval from calculations.site_concurrent_load"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /livescan/appointments/{id}/cancel"
        actor: Applicant
        preconditions:
          - "status == BOOKED"
        side_effects:
          - "releases the interval from calculations.site_concurrent_load"
          - "creates no FeeAssessment (conditional leg: only the NO_SHOW path bills)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /livescan/appointments/{id}/cancel"
        actor: LivescanTechnician
        preconditions:
          - "status == CHECKED_IN"
          - "no FingerprintCard exists for this appointment"
        side_effects:
          - "releases the interval from calculations.site_concurrent_load"

  - entity: FingerprintCard
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED, REJECTED_CLOSED, SUPERSEDED]
    shape: branching_with_cycle
    transitions:
      - from: OPEN
        to: CAPTURING
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts — first scored attempt — or POST /livescan/cards/{id}/positions/{position_code}/exception — first exception-coded position when no attempt was ever scored"
        actor: LivescanTechnician
        preconditions:
          - "status == OPEN"
          - "Device.calibration_status == CALIBRATED"
          - "when the card's site_kind == MOBILE_EVENT, an ACTIVE DeviceAssignment binds this device to this site"
        side_effects:
          - "stamps first_capture_at and last_capture_at with the logical clock on the attempt path; on the exception-only path first_capture_at stays null and only last_capture_at is stamped, which is why an exception-only card is never swept by calculations.taint_sweep_scope"
          - "recomputes mean_quality_score, worst_position_score and submittable per calculations.card_quality_aggregate"
      - from: CAPTURING
        to: CAPTURING
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts, POST /livescan/cards/{id}/positions/{position_code}/exception, or POST /livescan/cards/{id}/exception-override"
        actor: LivescanTechnician
        preconditions:
          - "status == CAPTURING"
          - "for the override call the actor's X-User-ID differs from captured_by_user_id and positions_exception_count > EXCEPTION_POSITION_MAX (2)"
        side_effects:
          - "recomputes positions_passed_count, positions_exception_count, mean_quality_score, worst_position_score and submittable"
          - "the override call sets exception_override_by_user_id to the SiteSupervisor's X-User-ID"
        note: "self-loop; this is the cycle in the card axis"
      - from: CAPTURING
        to: READY_FOR_SUBMISSION
        trigger: "POST /livescan/cards/{id}/finalize"
        actor: LivescanTechnician
        preconditions:
          - "every PositionCapture row is PASSED or EXCEPTION_CODED, otherwise ERR_CARD_NOT_SUBMITTABLE"
          - "positions_exception_count <= EXCEPTION_POSITION_MAX (2) or exception_override_by_user_id is not null, otherwise ERR_EXCEPTION_LIMIT_EXCEEDED"
          - "mean_quality_score >= CARD_MEAN_QUALITY_MIN (65) per calculations.card_quality_aggregate, otherwise ERR_CARD_NOT_SUBMITTABLE"
        side_effects:
          - "freezes every PositionCapture row against further attempts"
      - from: READY_FOR_SUBMISSION
        to: SUBMITTED
        trigger: "POST /livescan/submissions"
        actor: LivescanTechnician
        preconditions:
          - "status == READY_FOR_SUBMISSION"
          - "expected_card_version matches FingerprintCard.version per concurrency_rules[submission-transmit-stale-card]"
        side_effects:
          - "creates the Submission, mints or extends the TCN per calculations.tcn_allocation"
          - "increments FingerprintCard.version by 1"
      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /livescan/submissions/{id}/destination-results — every required destination reached a non-rejection result"
        actor: StateRepository
        preconditions:
          - "the submission's composite_disposition became CLEARED or HIT"
        side_effects:
          - "no further capture is possible on this card"
      - from: SUBMITTED
        to: REJECTED_CLOSED
        trigger: "POST /livescan/submissions/{id}/reprints"
        actor: SiteSupervisor
        preconditions:
          - "the submission has at least one destination in REJECTED_TECHNICAL or REJECTED_ADMIN"
        side_effects:
          - "sets superseded_by_card_id to the replacement card created by the reprint authorization"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /livescan/devices/{id}/calibration-audit or POST /livescan/submissions/{id}/purge-decisions"
        actor: VendorAdmin
        preconditions:
          - "status IN {OPEN, CAPTURING, READY_FOR_SUBMISSION, SUBMITTED, CLOSED, REJECTED_CLOSED}"
          - "for the audit path, first_capture_at > the Device.calibration_expires_at recomputed from corrected_last_calibrated_at"
        side_effects:
          - "sets taint_reason to CALIBRATION_LAPSE for the audit path and PURGED_RECORD for the purge path"
          - "removes the card from CaptureSite.billable_print_count"
      - from: CAPTURING
        to: SUPERSEDED
        trigger: "POST /livescan/devices/{id}/calibration-audit"
        actor: VendorAdmin
        preconditions:
          - "first_capture_at > the Device.calibration_expires_at recomputed from corrected_last_calibrated_at"
        side_effects:
          - "sets taint_reason to CALIBRATION_LAPSE; the in-flight capture cannot be finalized"
          - "does NOT create a credit FeeAssessment because no submission fee was ever assessed (conditional leg)"

  - entity: PositionCapture
    axis: status
    initial_state: PENDING
    terminal_states: [PASSED, EXCEPTION_CODED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts with score >= POSITION_PASS_THRESHOLD (60)"
        actor: LivescanTechnician
        preconditions:
          - "status IN {PENDING, FAILED_RETRYABLE}"
          - "attempt_count < POSITION_ATTEMPT_CEILING (3)"
        side_effects:
          - "increments attempt_count, sets best_score to max(best_score, score), stamps closed_at"
          - "recomputes the parent card's positions_passed_count, mean_quality_score, worst_position_score and submittable"
      - from: PENDING
        to: FAILED_RETRYABLE
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts with score < 60 while attempt_count + 1 < 3"
        actor: LivescanTechnician
        preconditions:
          - "attempt_count + 1 < POSITION_ATTEMPT_CEILING (3)"
        side_effects:
          - "increments attempt_count and sets best_score to max(best_score, score)"
      - from: FAILED_RETRYABLE
        to: FAILED_RETRYABLE
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts with score < 60 while attempt_count + 1 < 3"
        actor: LivescanTechnician
        preconditions:
          - "attempt_count + 1 < POSITION_ATTEMPT_CEILING (3)"
        side_effects:
          - "increments attempt_count and sets best_score to max(best_score, score)"
        note: "self-loop; only reachable when POSITION_ATTEMPT_CEILING >= 3"
      - from: FAILED_RETRYABLE
        to: PASSED
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts with score >= 60"
        actor: LivescanTechnician
        preconditions:
          - "attempt_count < POSITION_ATTEMPT_CEILING (3)"
        side_effects:
          - "stamps closed_at and recomputes the parent card aggregates"
      - from: FAILED_RETRYABLE
        to: CEILING_REACHED
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/attempts with score < 60 where attempt_count + 1 == 3"
        actor: LivescanTechnician
        preconditions:
          - "attempt_count + 1 == POSITION_ATTEMPT_CEILING (3)"
        side_effects:
          - "increments attempt_count to 3; further attempts are refused with ERR_POSITION_ATTEMPT_CEILING_REACHED"
          - "leaves the parent card unsubmittable until this position is exception-coded"
      - from: CEILING_REACHED
        to: EXCEPTION_CODED
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/exception"
        actor: LivescanTechnician
        preconditions:
          - "status IN {PENDING, FAILED_RETRYABLE, CEILING_REACHED}"
          - "the card's positions_exception_count + 1 <= EXCEPTION_POSITION_HARD_MAX (4), otherwise ERR_EXCEPTION_LIMIT_EXCEEDED"
        side_effects:
          - "sets exception_code, stamps closed_at, clears best_score contribution from the mean"
          - "increments the parent card's positions_exception_count and recomputes submittable"
      - from: PENDING
        to: EXCEPTION_CODED
        trigger: "POST /livescan/cards/{id}/positions/{position_code}/exception with exception_code AMPUTATED before any attempt"
        actor: LivescanTechnician
        preconditions:
          - "attempt_count == 0"
          - "the card's positions_exception_count + 1 <= EXCEPTION_POSITION_HARD_MAX (4)"
        side_effects:
          - "sets exception_code and closed_at without ever scoring the position"

  - entity: Submission
    axis: state_status
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED_TECHNICAL, REJECTED_ADMIN]
    shape: branching
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /livescan/submissions/{id}/destination-results with destination STATE and result_code ACCEPTED"
        actor: StateRepository
        preconditions:
          - "state_status == PENDING"
          - "STATE is in Submission.destinations"
        side_effects:
          - "stamps state_resulted_at with the logical clock"
          - "creates one ChrResponse with destination STATE, computes fitness_code per calculations.fitness_code_derivation and routes it per calculations.dissemination_projection"
          - "recomputes composite_disposition per calculations.submission_composite_disposition"
      - from: PENDING
        to: REJECTED_TECHNICAL
        trigger: "POST /livescan/submissions/{id}/destination-results with destination STATE and result_code REJECTED_TECHNICAL"
        actor: StateRepository
        preconditions:
          - "state_status == PENDING"
        side_effects:
          - "stamps state_resulted_at, which anchors calculations.reprint_entitlement"
          - "creates no ChrResponse (conditional leg: only ACCEPTED yields a response row)"
          - "recomputes composite_disposition"
      - from: PENDING
        to: REJECTED_ADMIN
        trigger: "POST /livescan/submissions/{id}/destination-results with destination STATE and result_code REJECTED_ADMIN"
        actor: StateRepository
        preconditions:
          - "state_status == PENDING"
        side_effects:
          - "stamps state_resulted_at"
          - "marks the submission ineligible for a no-fee reprint regardless of how soon the reprint is authorized"
          - "recomputes composite_disposition"

  - entity: Submission
    axis: fbi_status
    initial_state: PENDING
    terminal_states: [NOT_REQUIRED, ACCEPTED, REJECTED_TECHNICAL, REJECTED_ADMIN]
    shape: parallel
    transitions:
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /livescan/submissions — the ORI's destination_requirement is STATE_ONLY"
        actor: LivescanTechnician
        preconditions:
          - "Ori.destination_requirement == STATE_ONLY"
        side_effects:
          - "sets destinations to [STATE] and consumes exactly one TCN"
          - "sets FeeAssessment.federal_fee_cents to 0 for the submission's assessment"
        note: "evaluated at creation; this axis never leaves NOT_REQUIRED for a STATE_ONLY ORI"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /livescan/submissions/{id}/destination-results with destination FBI and result_code ACCEPTED"
        actor: StateRepository
        preconditions:
          - "fbi_status == PENDING"
          - "FBI is in Submission.destinations, otherwise ERR_DESTINATION_NOT_AUTHORIZED"
        side_effects:
          - "stamps fbi_resulted_at"
          - "creates one ChrResponse with destination FBI"
          - "recomputes composite_disposition, which stays INCOMPLETE while state_status is still PENDING"
      - from: PENDING
        to: REJECTED_TECHNICAL
        trigger: "POST /livescan/submissions/{id}/destination-results with destination FBI and result_code REJECTED_TECHNICAL"
        actor: StateRepository
        preconditions:
          - "fbi_status == PENDING"
          - "FBI is in Submission.destinations"
        side_effects:
          - "stamps fbi_resulted_at"
          - "recomputes composite_disposition to MIXED when state_status == ACCEPTED with a hit, or to REJECTED when both destinations rejected"
      - from: PENDING
        to: REJECTED_ADMIN
        trigger: "POST /livescan/submissions/{id}/destination-results with destination FBI and result_code REJECTED_ADMIN"
        actor: StateRepository
        preconditions:
          - "fbi_status == PENDING"
        side_effects:
          - "stamps fbi_resulted_at and blocks the no-fee reprint entitlement for the FBI leg"

  - entity: Submission
    axis: retention_status
    initial_state: NOT_REQUESTED
    terminal_states: [PURGED]
    shape: parallel_with_cycle
    transitions:
      - from: NOT_REQUESTED
        to: GRANTED
        trigger: "POST /livescan/submissions with retention_requested true"
        actor: LivescanTechnician
        preconditions:
          - "Ori.retention_permitted == true, otherwise ERR_RETENTION_NOT_PERMITTED"
          - "ServiceType.retention_offered == true, otherwise ERR_RETENTION_NOT_PERMITTED"
        side_effects:
          - "records the election irrevocably; transmitting a reprint of this submission with a different retention_requested is refused with ERR_RETENTION_IMMUTABLE"
          - "unlocks POST /livescan/rapback-subscriptions for this submission"
      - from: GRANTED
        to: PURGE_REQUESTED
        trigger: "POST /livescan/submissions/{id}/purge-requests"
        actor: Applicant
        preconditions:
          - "retention_status IN {GRANTED, PURGE_DENIED}"
        side_effects:
          - "stamps purge_requested_at and purge_requested_by_user_id"
      - from: PURGE_DENIED
        to: PURGE_REQUESTED
        trigger: "POST /livescan/submissions/{id}/purge-requests — a fresh request after a denial"
        actor: Applicant
        preconditions:
          - "retention_status == PURGE_DENIED"
        side_effects:
          - "re-stamps purge_requested_at and purge_requested_by_user_id, clears purge_decided_by_user_id"
        note: "this is the cycle in the retention axis"
      - from: PURGE_REQUESTED
        to: PURGED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "retention_status == PURGE_REQUESTED"
          - "the deciding X-User-ID differs from purge_requested_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "CASCADE hop 1: sets retention_status to PURGED and stamps purge_decided_by_user_id"
          - "CASCADE hop 2: because retention was revoked, every ChrResponse of this submission with routing_status IN {RECEIVED, ROUTED} moves to VOIDED and its record_detail is cleared to null"
          - "CASCADE hop 3: because the retained responses are void, the RapbackSubscription of this submission with status IN {ACTIVE, RENEWAL_DUE} moves to TERMINATED (conditional leg: a CANCELLED or LAPSED subscription is left untouched)"
          - "CASCADE hop 4: because the subscription terminated, every RapbackNotification bound to it with status == ROUTED moves to VOIDED (conditional leg: notifications already ACKNOWLEDGED stay ACKNOWLEDGED) and notifications_voided_count is updated"
          - "CASCADE hop 5: because its basis response is VOIDED, the FitnessDetermination whose basis_response_id is that response and whose status IN {ISSUED, CHALLENGED, REAFFIRMED, AMENDED} moves to VACATED (conditional leg: an already-VACATED determination is untouched)"
          - "CASCADE hop 6: because the record is gone, Ori.tcn_released_count increases by len(destinations) per calculations.tcn_conservation, and the submission's FingerprintCard moves to SUPERSEDED with taint_reason PURGED_RECORD"
      - from: PURGE_REQUESTED
        to: PURGE_DENIED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision DENY"
        actor: VendorAdmin
        preconditions:
          - "retention_status == PURGE_REQUESTED"
          - "the deciding X-User-ID differs from purge_requested_by_user_id"
        side_effects:
          - "stamps purge_decided_by_user_id and leaves every response, subscription, notification and determination untouched"
      - from: PURGE_REQUESTED
        to: PURGE_DENIED
        trigger: "POST /livescan/_ops/aging-run — the decision window elapsed"
        actor: system
        preconditions:
          - "logical clock > purge_requested_at + PURGE_DECISION_WINDOW_DAYS (14) days"
        side_effects:
          - "sets purge_decided_by_user_id to null to mark an automatic denial"

  - entity: ChrResponse
    axis: routing_status
    initial_state: RECEIVED
    terminal_states: [VOIDED, SUPERSEDED]
    shape: branching
    transitions:
      - from: RECEIVED
        to: ROUTED
        trigger: "POST /livescan/submissions/{id}/destination-results — routing runs inside the same request that creates the response"
        actor: StateRepository
        preconditions:
          - "the parent Submission is not in retention_status PURGED"
        side_effects:
          - "sets routed_recipient_roles per calculations.dissemination_projection and stamps routed_at"
      - from: ROUTED
        to: VOIDED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "the parent Submission moved PURGE_REQUESTED -> PURGED in this request"
        side_effects:
          - "clears record_detail to null; subsequent GET /livescan/chr-responses/{id} returns record_count 0 and no detail"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "POST /livescan/devices/{id}/calibration-audit"
        actor: VendorAdmin
        preconditions:
          - "the parent Submission's card was superseded with taint_reason CALIBRATION_LAPSE in this request"
        side_effects:
          - "the response no longer supports any fitness determination"
      - from: ROUTED
        to: SUPERSEDED
        trigger: "POST /livescan/submissions/{id}/reprints or POST /livescan/devices/{id}/calibration-audit"
        actor: SiteSupervisor
        preconditions:
          - "a replacement card was created for the parent submission in this request"
        side_effects:
          - "the reprint's own responses become the only routable ones"

  - entity: FitnessDetermination
    axis: status
    initial_state: ISSUED
    terminal_states: [AMENDED, VACATED]
    shape: cyclic
    transitions:
      - from: ISSUED
        to: CHALLENGED
        trigger: "POST /livescan/fitness-determinations/{id}/challenges"
        actor: Applicant
        preconditions:
          - "status IN {ISSUED, REAFFIRMED}"
          - "logical clock <= issued_at + CHALLENGE_FILING_WINDOW_DAYS (21) days, otherwise ERR_CHALLENGE_WINDOW_CLOSED"
          - "challenge_count < CHALLENGE_MAX_CYCLES (2), otherwise ERR_CHALLENGE_LIMIT_REACHED"
        side_effects:
          - "increments challenge_count, stamps challenge_filed_at and suspends the determination's effect"
      - from: CHALLENGED
        to: REAFFIRMED
        trigger: "POST /livescan/fitness-determinations/{id}/challenge-resolutions with resolution REAFFIRM"
        actor: AgencyAdjudicator
        preconditions:
          - "status == CHALLENGED"
          - "the resolving X-User-ID differs from issued_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets resolved_by_user_id, clears challenge_filed_at and re-opens the challenge cycle while challenge_count < 2"
      - from: REAFFIRMED
        to: CHALLENGED
        trigger: "POST /livescan/fitness-determinations/{id}/challenges — second cycle"
        actor: Applicant
        preconditions:
          - "status == REAFFIRMED"
          - "challenge_count < CHALLENGE_MAX_CYCLES (2)"
          - "logical clock <= issued_at + CHALLENGE_FILING_WINDOW_DAYS (21) days"
        side_effects:
          - "increments challenge_count to 2 and re-stamps challenge_filed_at"
        note: "this is the cycle in the determination axis"
      - from: CHALLENGED
        to: AMENDED
        trigger: "POST /livescan/fitness-determinations/{id}/challenge-resolutions with resolution AMEND"
        actor: AgencyAdjudicator
        preconditions:
          - "status == CHALLENGED"
          - "the resolving X-User-ID differs from issued_by_user_id"
        side_effects:
          - "overwrites outcome with the supplied amended_outcome and sets resolved_by_user_id"
      - from: ISSUED
        to: VACATED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "the determination's basis_response_id moved to VOIDED in this request"
        side_effects:
          - "clears outcome to null because the determination lost its evidentiary basis"
      - from: CHALLENGED
        to: VACATED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "the determination's basis_response_id moved to VOIDED in this request"
        side_effects:
          - "abandons the open challenge without a resolution and clears challenge_filed_at"

  - entity: RapbackSubscription
    axis: status
    initial_state: ACTIVE
    terminal_states: [LAPSED, CANCELLED, TERMINATED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system — the logical clock enters the renewal window; evaluated on every read and on every renew attempt"
        actor: system
        preconditions:
          - "logical clock >= term_end - RAPBACK_RENEWAL_WINDOW_DAYS (60) days"
          - "logical clock <= term_end"
        side_effects:
          - "unlocks POST /livescan/rapback-subscriptions/{id}/renew"
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /livescan/rapback-subscriptions/{id}/renew"
        actor: AgencyAdjudicator
        preconditions:
          - "status == RENEWAL_DUE, otherwise ERR_RENEWAL_WINDOW_CLOSED"
          - "Ori.rapback_authority == true"
          - "the parent Submission's retention_status == GRANTED"
        side_effects:
          - "sets term_start to the logical clock and term_end per calculations.rapback_term_expiry"
          - "increments renewal_count by 1"
        note: "this is the cycle in the subscription axis"
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "POST /livescan/_ops/aging-run or any read after the term ended"
        actor: system
        preconditions:
          - "logical clock > term_end"
        side_effects:
          - "renewal is refused from here on; a fresh print and a new submission are required"
          - "later notifications for this submission land as ORPHANED"
      - from: ACTIVE
        to: LAPSED
        trigger: "system — the term ended without any read or renew attempt ever landing inside the renewal window"
        actor: system
        preconditions:
          - "logical clock > term_end"
          - "status == ACTIVE (the RENEWAL_DUE window was never observed)"
        side_effects:
          - "renewal is refused from here on; later notifications for this submission land as ORPHANED"
        note: "without this leg a subscription that is never read inside its 60-day window could never lapse"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /livescan/rapback-subscriptions/{id}/cancel"
        actor: AgencyAdjudicator
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE}"
        side_effects:
          - "leaves already-ROUTED notifications untouched; later notifications land as ORPHANED"
      - from: RENEWAL_DUE
        to: CANCELLED
        trigger: "POST /livescan/rapback-subscriptions/{id}/cancel"
        actor: AgencyAdjudicator
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE}"
        side_effects:
          - "closes the subscription before the renewal decision"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "hop 2 of the purge cascade voided the parent submission's responses in this request"
        side_effects:
          - "CASCADE hop 4 follows: every bound RapbackNotification with status == ROUTED moves to VOIDED"
      - from: RENEWAL_DUE
        to: TERMINATED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "hop 2 of the purge cascade voided the parent submission's responses in this request"
        side_effects:
          - "the pending renewal is abandoned"

  - entity: RapbackNotification
    axis: status
    initial_state: ROUTED
    terminal_states: [ACKNOWLEDGED, ORPHANED, VOIDED]
    shape: branching
    transitions:
      - from: ROUTED
        to: ORPHANED
        trigger: "POST /livescan/rapback-notifications — binding evaluated at creation"
        actor: StateRepository
        preconditions:
          - "no RapbackSubscription with status IN {ACTIVE, RENEWAL_DUE} exists whose parent Submission.tcn_full equals subject_submission_tcn and whose Ori.ori_code equals ori_code"
        side_effects:
          - "leaves subscription_id null; the notification is retained for audit and can never be acknowledged (ERR_NOTIFICATION_UNROUTABLE)"
        note: "creation-time fork; a notification is stamped ROUTED or ORPHANED in the same request that creates it"
      - from: ROUTED
        to: ACKNOWLEDGED
        trigger: "POST /livescan/rapback-notifications/{id}/acknowledge"
        actor: AgencyAdjudicator
        preconditions:
          - "status == ROUTED"
          - "subscription_id is not null"
        side_effects:
          - "sets acknowledged_by_user_id and increments the subscription's notifications_routed_count contribution"
          - "remains permitted while Agency.billing_status == SUSPENDED (named exclusion in validations[priority=6])"
      - from: ROUTED
        to: VOIDED
        trigger: "POST /livescan/submissions/{id}/purge-decisions with decision GRANT"
        actor: VendorAdmin
        preconditions:
          - "the bound subscription moved to TERMINATED in this request"
        side_effects:
          - "increments the subscription's notifications_voided_count"

  - entity: FeeAssessment
    axis: status
    initial_state: ASSESSED
    terminal_states: [PAID, CREDITED]
    shape: branching
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /livescan/fee-assessments/{id}/payments"
        actor: LivescanTechnician
        preconditions:
          - "payer_regime == APPLICANT_PAID, otherwise ERR_PAYER_REGIME_MISMATCH"
          - "amount_cents == total_cents exactly"
        side_effects:
          - "sets paid_cents to total_cents"
      - from: ASSESSED
        to: INVOICED
        trigger: "POST /livescan/invoices/{id}/issue"
        actor: VendorAdmin
        preconditions:
          - "payer_regime == AGENCY_BILLED"
          - "agency_id == Invoice.agency_id"
        side_effects:
          - "sets invoice_id and contributes total_cents to Invoice.subtotal_cents"
      - from: INVOICED
        to: PAID
        trigger: "POST /livescan/invoices/{id}/payments — the parent invoice was paid in full"
        actor: VendorAdmin
        preconditions:
          - "the parent Invoice reached PAID in this request"
        side_effects:
          - "sets paid_cents to total_cents"
      - from: ASSESSED
        to: CREDITED
        trigger: "POST /livescan/devices/{id}/calibration-audit"
        actor: VendorAdmin
        preconditions:
          - "the assessment's submission's card was superseded with taint_reason CALIBRATION_LAPSE in this request"
        side_effects:
          - "CASCADE hop 5 of the calibration-lapse chain: sets credited_cents to total_cents so the applicant or agency owes nothing for the vendor-borne reprint"
      - from: INVOICED
        to: CREDITED
        trigger: "POST /livescan/devices/{id}/calibration-audit or POST /livescan/_ops/aging-run write-off"
        actor: VendorAdmin
        preconditions:
          - "the assessment's card was superseded by a lapse audit, or its invoice was written off"
        side_effects:
          - "sets credited_cents to total_cents and reduces Invoice.subtotal_cents and Invoice.total_cents by that amount"
          - "CASCADE hop 6: because the invoice total dropped, Agency.outstanding_balance_cents is recomputed"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: submission-transmit-stale-card
    parent_entity: FingerprintCard
    write_endpoint: "POST /livescan/submissions"
    occ_field: "expected_card_version"
    description: |
      Transmitting a FingerprintCard whose version has advanced since the client
      last observed it is rejected. A card legitimately accepts more than one
      transmission over its life (a reprint authorization opens a replacement
      card and the original card's exception override, aggregate recompute and
      first transmission each bump its version), so a second create against a
      stale view of the card would otherwise mint a duplicate TCN for the same
      print.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: determination-issue-stale-submission
    parent_entity: Submission
    write_endpoint: "POST /livescan/fitness-determinations"
    occ_field: "expected_submission_version"
    description: |
      Issuing a FitnessDetermination against a Submission whose version has
      advanced since the client last read it is rejected. A submission's version
      advances when a destination result lands, when retention moves toward a
      purge, and when a reprint supersedes its responses — all of which change
      which ChrResponse may serve as basis_response_id, so an adjudicator acting
      on a stale read would pin the wrong basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /livescan/invoices"
    occ_field: "expected_agency_version"
    description: |
      Creating an Invoice against an Agency whose version has advanced since the
      client last read it is rejected. A new invoice legitimately supersedes the
      agency's open DRAFT invoice for the same period, and the agency's version
      advances on every aging run, payment and posture change, so a create built
      on a stale agency view would attach assessments to the wrong period.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# 21 rules; six carry a rejected variant (`variants:`) on six different entity
# domains. round_half_up means Decimal quantize to whole cents, ties away from
# zero. All day arithmetic is on the logical clock (§1.5 /_clock/set_current_utc).
# ---------------------------------------------------------------------------
calculations:
  - name: fee_assessment_total
    trigger: "POST /livescan/submissions, POST /livescan/submissions/{id}/reprints, POST /livescan/appointments/{id}/no-show, POST /livescan/sites/{id}/event-reconciliation — each creates one FeeAssessment and stamps its total_cents"
    algorithm: tiered_pricing
    formula: |
      # ---- component stage (percentages are rounded PER COMPONENT, pinned) ----
      # A free reprint re-transmits a rejected transaction: the destinations do not re-charge it,
      # but the vendor still did the work, so ONLY the statutory components are dropped.
      free_reprint           = (kind == "REPRINT" and FingerprintCard.free_reprint_granted == true)
      state_fee_cents        = 0 if free_reprint else (ServiceType.state_fee_cents   if kind IN {SUBMISSION, REPRINT} else 0)
      federal_fee_cents      = 0 if free_reprint else (ServiceType.federal_fee_cents if kind IN {SUBMISSION, REPRINT} and "FBI" in Submission.destinations else 0)
      processing_surcharge_cents = round_half_up(PROCESSING_SURCHARGE_PCT * (state_fee_cents + federal_fee_cents))
      vendor_convenience_fee_cents = VENDOR_CONVENIENCE_FEE_CENTS               if kind IN {SUBMISSION, REPRINT} else 0
      vendor_tax_cents       = round_half_up(VENDOR_TAX_PCT * vendor_convenience_fee_cents)
      trip_surcharge_cents   = TRIP_SURCHARGE_PER_CARD_CENTS                     if CaptureSite.site_kind == "MOBILE_EVENT" and kind IN {SUBMISSION, REPRINT} else 0
      reprint_fee_cents      = REPRINT_FEE_CENTS                                 if kind == "REPRINT" and free_reprint == false else 0
      # NO_SHOW carries only a flat fee; ONSITE_SHORTFALL only the shortfall charge.
      # Both skip steps 1-4 (no statutory component, no waiver, no discount) but they
      # STILL run step 5, so an agency-side flat charge does move the discount tier.
      if kind == "NO_SHOW":           total_cents = NO_SHOW_FEE_CENTS ; goto step 5
      if kind == "ONSITE_SHORTFALL":  total_cents = CaptureSite.shortfall_charge_cents ; goto step 5

      # ---- step 1: statutory waiver (order is pinned: waiver BEFORE discount) ----
      statutory_cents = state_fee_cents + federal_fee_cents + processing_surcharge_cents
      waived_cents    = statutory_cents if payer_regime == "FEE_WAIVED" else 0
      statutory_after_waiver = statutory_cents - waived_cents
      # ---- step 2: invoiceable base ----
      base_cents = statutory_after_waiver + vendor_convenience_fee_cents + vendor_tax_cents
                   + trip_surcharge_cents + reprint_fee_cents
      # ---- step 3: agency volume discount (only for agency-side regimes) ----
      discount_pct   = calculations.agency_volume_discount(Agency.mtd_billed_cents)   # tier read BEFORE this row is added
      discount_cents = round_half_up(discount_pct * base_cents) if payer_regime IN {"AGENCY_BILLED", "FEE_WAIVED"} else 0
      # ---- step 4: total ----
      total_cents = base_cents - discount_cents
      # ---- step 5: ledger ----
      if payer_regime IN {"AGENCY_BILLED", "FEE_WAIVED"}: Agency.mtd_billed_cents += total_cents
    input_set: "one FeeAssessment row; ServiceType fees, Submission.destinations, CaptureSite.site_kind, Agency.payer_regime_default and Agency.mtd_billed_cents as they stand at the instant the assessment is created"
    constants:
      PROCESSING_SURCHARGE_PCT: 0.035
      VENDOR_CONVENIENCE_FEE_CENTS: 995
      VENDOR_TAX_PCT: 0.0725
      TRIP_SURCHARGE_PER_CARD_CENTS: 500
      REPRINT_FEE_CENTS: 1800
      NO_SHOW_FEE_CENTS: 1500
    precision: "whole cents, round_half_up, applied per percentage component before summing"
    worked_example: |
      ServiceType(state 3289, federal 1350), STATE_AND_FBI ORI, FIXED site, first print:
        processing = round_half_up(0.035 * 4639) = round_half_up(162.365) = 162
        vendor_tax = round_half_up(0.0725 * 995) = round_half_up(72.1375) = 72
        APPLICANT_PAID -> total = 3289 + 1350 + 162 + 995 + 72 = 5868
        AGENCY_BILLED with Agency.mtd_billed_cents = 60000 -> discount_pct 0.03
              -> discount = round_half_up(0.03 * 5868) = round_half_up(176.04) = 176 -> total = 5692
        FEE_WAIVED with Agency.mtd_billed_cents = 60000 -> waived = 4801, base = 1067
              -> discount = round_half_up(0.03 * 1067) = round_half_up(32.01) = 32 -> total = 1035
      REPRINT of that submission, APPLICANT_PAID, FIXED site:
        free_reprint_granted true  -> statutory components 0, total = 995 + 72 = 1067
        free_reprint_granted false -> total = 3289 + 1350 + 162 + 995 + 72 + 1800 = 7668
    variants:
      - name: per_component_rounding_then_sum
        when: "PINNED — this is the rule the API implements"
        difference: "each percentage component is rounded to whole cents before entering the sum"
      - name: sum_then_round
        when: "REJECTED — the reading that adds the unrounded percentage products and rounds once"
        difference: "for the APPLICANT_PAID example it yields round_half_up(162.365 + 72.1375) = 235 instead of 162 + 72 = 234, so total 5869 instead of 5868"
      - name: discount_before_waiver
        when: "REJECTED — the reading that applies the volume discount to the pre-waiver base"
        difference: "for the FEE_WAIVED example it yields discount = round_half_up(0.03 * 5868) = 176 and total = 995 + 72 - 176 = 891 instead of 1035"

  - name: agency_volume_discount
    trigger: "evaluated inside calculations.fee_assessment_total step 3, before the new assessment is added to Agency.mtd_billed_cents"
    algorithm: threshold
    formula: |
      # Circular-looking by construction: the tier is keyed on a running total that
      # this very assessment will join. The evaluation order is pinned:
      #   (1) read Agency.mtd_billed_cents as it stands (EXCLUDING this assessment)
      #   (2) select the tier
      #   (3) compute total_cents
      #   (4) only then add total_cents to Agency.mtd_billed_cents
      if   mtd_billed_cents >= AGENCY_DISCOUNT_TIER2_FLOOR_CENTS: return AGENCY_DISCOUNT_TIER2_PCT
      elif mtd_billed_cents >= AGENCY_DISCOUNT_TIER1_FLOOR_CENTS: return AGENCY_DISCOUNT_TIER1_PCT
      else:                                                       return 0.0
    input_set: "Agency.mtd_billed_cents — the sum of total_cents over FeeAssessment rows of this agency with payer_regime IN {AGENCY_BILLED, FEE_WAIVED} created in the current calendar month of the logical clock, excluding CREDITED rows"
    constants:
      AGENCY_DISCOUNT_TIER1_FLOOR_CENTS: 40000
      AGENCY_DISCOUNT_TIER1_PCT: 0.03
      AGENCY_DISCOUNT_TIER2_FLOOR_CENTS: 200000
      AGENCY_DISCOUNT_TIER2_PCT: 0.06
    precision: "tier comparison is inclusive at the floor: exactly 40000 selects tier 1, exactly 200000 selects tier 2"

  - name: invoice_aging_days
    trigger: "POST /livescan/_ops/aging-run and every read of Invoice.aging_days"
    algorithm: threshold
    formula: |
      if status NOT IN {ISSUED, PAST_DUE} or due_on is null: return 0
      aging_days = max(0, (clock_date - due_on).days)          # PINNED: calendar days
      past_due   = aging_days >= 1                             # exactly due_on is NOT past due
    input_set: "invoices with status IN {ISSUED, PAST_DUE}; due_on = issued_on + Agency.invoice_terms_days calendar days"
    constants:
      INVOICE_TERMS_DAYS: 30
      INVOICE_BUSINESS_TERMS_DAYS: 21
      AGENCY_SUSPENSION_AGING_DAYS: 45
    precision: "whole days on the UTC date part of the logical clock"
    variants:
      - name: calendar_day_terms
        when: "PINNED — due_on = issued_on + 30 calendar days, aging counted in calendar days"
        difference: "an invoice issued 2026-06-01 is due 2026-07-01 and has aging_days 0 on 2026-07-01"
      - name: business_day_terms
        when: "REJECTED — the reading that counts 21 business days (Mon-Fri) for both the term and the aging"
        difference: "the same invoice would be due 2026-06-30, so on 2026-07-01 it would already show 1 day of aging and a late fee"

  - name: card_quality_aggregate
    trigger: "every POST /livescan/cards/{id}/positions/{position_code}/attempts, every .../exception, and POST /livescan/cards/{id}/finalize"
    algorithm: aggregation
    formula: |
      passed              = [p for p in PositionCapture where p.card_id == card.id and p.status == "PASSED"]
      positions_passed_count    = len(passed)
      positions_exception_count = count(p.status == "EXCEPTION_CODED")
      mean_quality_score  = round_half_up_2dp(sum(p.best_score for p in passed) / len(passed)) if passed else 0.00
      worst_position_score= min(p.best_score for p in passed) if passed else null
      all_closed          = every one of the POSITION_COUNT (10) rows has status IN {"PASSED", "EXCEPTION_CODED"}
      exception_ceiling   = EXCEPTION_POSITION_HARD_MAX if card.exception_override_by_user_id is not null else EXCEPTION_POSITION_MAX
      submittable         = all_closed
                            and positions_exception_count <= exception_ceiling
                            and mean_quality_score >= CARD_MEAN_QUALITY_MIN      # PINNED governing rule
    input_set: "the ten PositionCapture rows of one card; EXCEPTION_CODED positions are excluded from both the mean's numerator and its divisor"
    constants:
      POSITION_COUNT: 10
      POSITION_PASS_THRESHOLD: 60
      CARD_MEAN_QUALITY_MIN: 65
      EXCEPTION_POSITION_MAX: 2
      EXCEPTION_POSITION_HARD_MAX: 4
    precision: "mean to 2 decimal places, round_half_up"
    worked_example: |
      8 positions PASSED at 68 and 2 EXCEPTION_CODED -> mean_quality_score = 68.00 (divisor 8, not 10) -> submittable true.
      10 positions PASSED at 62 -> mean_quality_score = 62.00 -> submittable false (ERR_CARD_NOT_SUBMITTABLE on finalize).
    variants:
      - name: mean_over_passed_positions
        when: "PINNED — the mean over PASSED positions must reach CARD_MEAN_QUALITY_MIN (65)"
        difference: "ten positions passing at 62 leave the card unsubmittable even though every single position cleared 60"
      - name: worst_position_governs
        when: "REJECTED — the reading in which the minimum PASSED score must reach POSITION_PASS_THRESHOLD (60)"
        difference: "that reading is trivially satisfied by every PASSED position and would call the ten-at-62 card submittable"

  - name: rapback_term_expiry
    trigger: "POST /livescan/rapback-subscriptions and POST /livescan/rapback-subscriptions/{id}/renew"
    algorithm: interval_merge
    formula: |
      term_start = logical clock at subscribe or renew
      term_end   = term_start + RAPBACK_TERM_DAYS days                       # PINNED: fixed day count
      renewal_window_opens_at = term_end - RAPBACK_RENEWAL_WINDOW_DAYS days
      status transitions to RENEWAL_DUE when renewal_window_opens_at <= clock <= term_end
      status transitions to LAPSED      when clock > term_end
    input_set: "one RapbackSubscription; renewal restarts the term from the renew instant, it does not extend from the old term_end"
    constants:
      RAPBACK_TERM_DAYS: 365
      RAPBACK_RENEWAL_WINDOW_DAYS: 60
    precision: "instant arithmetic on the logical clock; boundaries are inclusive at renewal_window_opens_at and at term_end"
    worked_example: |
      term_start 2027-03-01T00:00:00Z -> term_end 2028-02-29T00:00:00Z, renewal window opens 2027-12-31T00:00:00Z.
    variants:
      - name: fixed_day_count
        when: "PINNED — term_end = term_start + 365 days"
        difference: "a term started 2027-03-01 ends 2028-02-29 because 2028 is a leap year"
      - name: calendar_anniversary
        when: "REJECTED — the reading that sets term_end to the same month and day one year later"
        difference: "the same term would end 2028-03-01, so a renewal attempted on 2028-02-29T12:00:00Z is inside the window under this reading and LAPSED under the pinned one"

  - name: onsite_shortfall_charge
    trigger: "POST /livescan/sites/{id}/event-reconciliation"
    algorithm: aggregation
    formula: |
      billable_print_count = count(FingerprintCard where site_id == site.id
                                   and status IN {"SUBMITTED", "CLOSED", "REJECTED_CLOSED"})
      shortfall_prints     = max(0, site.min_billable_prints - billable_print_count)   # PINNED: per-event
      shortfall_charge_cents = shortfall_prints * ONSITE_SHORTFALL_RATE_CENTS
    input_set: "cards at this MOBILE_EVENT site; SUPERSEDED cards (calibration lapse or purge) are excluded, which is what makes a lapse audit able to create a shortfall after the fact"
    constants:
      ONSITE_SHORTFALL_RATE_CENTS: 2200
    precision: "whole cents; no proration"
    worked_example: |
      min_billable_prints 25 with 26 billable cards -> 0 cents.
      min_billable_prints 25 with 18 billable cards -> 7 * 2200 = 15400 cents.
    variants:
      - name: per_event_minimum
        when: "PINNED — one shortfall computed against the event's own minimum"
        difference: "26 prints across two devices (20 and 6) clears a minimum of 25 and charges nothing"
      - name: per_device_pro_rata
        when: "REJECTED — the reading that splits the minimum across rostered devices as ceil(25 / 2) = 13 each"
        difference: "the same 20/6 split would charge (13 - 6) * 2200 = 15400 cents for the under-used device"

  - name: reprint_entitlement
    trigger: "POST /livescan/submissions/{id}/reprints"
    algorithm: threshold
    formula: |
      technical = state_status == "REJECTED_TECHNICAL" or fbi_status == "REJECTED_TECHNICAL"
      anchor    = the *_resulted_at of the earliest destination that returned REJECTED_TECHNICAL
                  (state_resulted_at when both did, because STATE is evaluated first)
      inside_free_window = technical and clock <= anchor + FREE_REPRINT_WINDOW_DAYS days   # PINNED anchor
      free_reprint = inside_free_window and free_reprint_count < FREE_REPRINT_MAX_PER_SUBMISSION
      # an administrative rejection never earns a free reprint, however fast the reprint is authorized
      if not technical and (state_status == "REJECTED_ADMIN" or fbi_status == "REJECTED_ADMIN"):
          free_reprint = false
      if state_status == "ACCEPTED" and fbi_status IN {"ACCEPTED", "NOT_REQUIRED"}: raise ERR_REPRINT_NOT_ENTITLED
      if reprint_count >= REPRINT_MAX_PER_SUBMISSION: raise ERR_REPRINT_LIMIT_REACHED
    input_set: "one Submission and its two destination axes"
    constants:
      FREE_REPRINT_WINDOW_DAYS: 30
      FREE_REPRINT_ALT_WINDOW_DAYS: 45
      FREE_REPRINT_MAX_PER_SUBMISSION: 2
      REPRINT_MAX_PER_SUBMISSION: 3
    precision: "whole days on the logical clock; the boundary is inclusive (a reprint exactly 30 days after the rejection is still free)"
    variants:
      - name: from_rejection_receipt
        when: "PINNED — the free window runs from the destination's *_resulted_at"
        difference: "a card captured on day 0 and rejected on day 40 is still free to reprint on day 50"
      - name: from_original_capture
        when: "REJECTED — the reading that runs 45 days from FingerprintCard.first_capture_at"
        difference: "the same day-50 reprint would be chargeable at REPRINT_FEE_CENTS because 50 > 0 + 45"

  - name: ori_authority_profile
    trigger: "POST /livescan/oris — the four computed authority fields are derived once at creation and never change"
    algorithm: constraint_propagation
    formula: |
      # The whole mapping, stated exhaustively. No other combination exists.
      CRIMINAL_JUSTICE       -> destination_requirement STATE_AND_FBI, dissemination_tier FULL_CHR,
                                retention_permitted true,  rapback_authority true
      NONCRIMINAL_STATUTORY  -> destination_requirement STATE_AND_FBI, dissemination_tier FITNESS_CODE_ONLY,
                                retention_permitted true,  rapback_authority true
      NONCRIMINAL_NOFED      -> destination_requirement STATE_ONLY,    dissemination_tier FITNESS_CODE_ONLY,
                                retention_permitted false, rapback_authority false
    input_set: "the single statutory_authority value supplied at ORI creation"
    constants: {}
    precision: "exact enum mapping; supplying any of the four derived fields in the request body is ignored"

  - name: submission_composite_disposition
    trigger: "every POST /livescan/submissions/{id}/destination-results and every read of Submission.composite_disposition"
    algorithm: projection
    formula: |
      required_fbi = "FBI" in destinations
      if state_status == "PENDING" or (required_fbi and fbi_status == "PENDING"):
          return "INCOMPLETE"
      state_rejected = state_status IN {"REJECTED_TECHNICAL", "REJECTED_ADMIN"}
      fbi_rejected   = required_fbi and fbi_status IN {"REJECTED_TECHNICAL", "REJECTED_ADMIN"}
      if state_rejected and (fbi_rejected or not required_fbi):
          return "REJECTED"
      if state_rejected != fbi_rejected:                 # exactly one destination rejected
          return "MIXED"
      hit = any(r.record_count >= 1 for r in ChrResponse
                where r.submission_id == submission.id and r.routing_status IN {"RECEIVED", "ROUTED"})
      return "HIT" if hit else "CLEARED"
    input_set: "both destination axes plus the non-voided ChrResponse rows of this submission; VOIDED and SUPERSEDED responses are excluded from the hit test"
    constants: {}
    precision: "record_count >= 1 is a hit; record_count == 0 is CLEARED even when the destination returned a response row"
    worked_example: |
      STATE_AND_FBI ORI, state ACCEPTED with record_count 0, FBI REJECTED_TECHNICAL -> MIXED.
      STATE_AND_FBI ORI, state ACCEPTED with record_count 2, FBI ACCEPTED with record_count 0 -> HIT.
      STATE_ONLY ORI, state ACCEPTED with record_count 0, fbi_status NOT_REQUIRED -> CLEARED.

  - name: fitness_code_derivation
    trigger: "creation of a ChrResponse inside POST /livescan/submissions/{id}/destination-results"
    algorithm: threshold
    formula: |
      if disqualifying_offense_count >= 1: return "INELIGIBLE"
      if record_count >= 1:                return "ELIGIBLE_WITH_NOTICE"
      return "ELIGIBLE"
    input_set: "one ChrResponse's own record_count and disqualifying_offense_count"
    constants: {}
    precision: "both boundaries are at 1: zero records means ELIGIBLE, one record with zero disqualifying offences means ELIGIBLE_WITH_NOTICE"

  - name: dissemination_projection
    trigger: "GET /livescan/chr-responses/{id}, and routing at ChrResponse RECEIVED -> ROUTED"
    algorithm: projection
    formula: |
      tier = Ori.dissemination_tier of the response's submission
      routed_recipient_roles = ["AgencyAdjudicator", "Applicant"]      # both tiers route to both
      # projection of the READ, by caller role:
      if role == "AgencyAdjudicator" and tier == "FULL_CHR":
          expose fitness_code, record_count, disqualifying_offense_count; expose record_detail only when include_detail is true
      if role == "AgencyAdjudicator" and tier == "FITNESS_CODE_ONLY":
          expose fitness_code only; record_count, disqualifying_offense_count and record_detail are null;
          include_detail true raises ERR_DISSEMINATION_NOT_ENTITLED
      if role == "Applicant":
          expose fitness_code only, for either tier; include_detail true raises ERR_DISSEMINATION_NOT_ENTITLED
      if role == "VendorAdmin":
          expose destination, routing_status and routed_at only; fitness_code is null; include_detail true raises ERR_DISSEMINATION_NOT_ENTITLED
      if routing_status == "VOIDED": record_detail is null and record_count reads 0 for every role
    input_set: "one ChrResponse, the ORI's dissemination_tier, the caller's role and the optional include_detail flag"
    constants: {}
    precision: "the same stored response projects differently per recipient; the stored row is never mutated by a read"

  - name: tcn_allocation
    trigger: "POST /livescan/submissions (first print) and POST /livescan/submissions/{id}/reprints"
    algorithm: waterfall_allocation
    formula: |
      if this is a first print (no original_submission_id):
          seq       = count(Submission where ori_id == ori.id and tcn_suffix == 0) + 1
          tcn_root  = ori.ori_code + "-" + zero_pad(seq, 6)
          tcn_suffix= 0
          ori.tcn_consumed_count += len(destinations)
      else:
          original      = the root submission (original_submission_id chain head, the row with tcn_suffix == 0)
          inside_window = clock <= original.transmitted_at + TCN_PRESERVATION_WINDOW_DAYS days
          next_suffix   = original.reprint_count               # already incremented at authorization time,
                                                               # so the first reprint takes suffix 1
          if inside_window and next_suffix <= TCN_SUFFIX_MAX:
              tcn_root  = original.tcn_root
              tcn_suffix= next_suffix
              # a preserved root consumes no new TCN allocation
          else:
              seq       = count(Submission where ori_id == ori.id and tcn_suffix == 0) + 1
              tcn_root  = ori.ori_code + "-" + zero_pad(seq, 6)
              tcn_suffix= 0
              ori.tcn_consumed_count += len(destinations)
      tcn_full = tcn_root if tcn_suffix == 0 else tcn_root + "-" + str(tcn_suffix)
    input_set: "the ORI's existing root submissions and the original submission of the reprint chain"
    constants:
      TCN_PRESERVATION_WINDOW_DAYS: 90
      TCN_SUFFIX_MAX: 2
    precision: "the preservation boundary is inclusive: a reprint exactly 90 days after the original transmission still preserves the root"
    worked_example: |
      Original transmitted 2026-06-01 by ORI CA0111111 as CA0111111-000001.
      Technical rejection received 2026-07-11 (day 40); reprint authorized 2026-07-21 (day 50):
        free per calculations.reprint_entitlement (50 <= 40 + 30) AND inside the 90-day TCN window
        -> tcn_full CA0111111-000001-1, no new TCN consumed.
      Reprint authorized 2026-09-10 (day 101) instead: outside the 90-day window
        -> a fresh root CA0111111-000002 with suffix 0 and len(destinations) more TCNs consumed.

  - name: tcn_conservation
    trigger: "invariant checked after every POST /livescan/submissions, every reprint and every granted purge"
    algorithm: aggregation
    formula: |
      Ori.tcn_consumed_count - Ori.tcn_released_count
        == sum(len(s.destinations) for s in Submission
               where s.ori_id == ori.id and s.tcn_suffix == 0 and s.retention_status != "PURGED")
      # hop 6 of the purge cascade releases len(destinations) ONLY for a root submission
      # (tcn_suffix == 0); purging a suffix reprint releases 0 because it never consumed any.
    input_set: "all submissions of one ORI; suffix reprints never enter either side of the equation"
    constants: {}
    precision: "exact integer equality; the ledger is reconciled inside the same request as the purge"

  - name: billable_print_conservation
    trigger: "invariant checked after every transmission, every calibration audit and every event reconciliation"
    algorithm: aggregation
    formula: |
      CaptureSite.billable_print_count
        + sum(DeviceAssignment.tainted_print_count for a in DeviceAssignment where a.site_id == site.id)
        == count(FingerprintCard where site_id == site.id
                 and (status IN {"SUBMITTED", "CLOSED", "REJECTED_CLOSED"}
                      or (status == "SUPERSEDED" and taint_reason == "CALIBRATION_LAPSE")))
    input_set: "one CaptureSite, its device assignments and its cards"
    constants: {}
    precision: "a lapse audit moves each tainted card from the billable side to the tainted side, so the sum is unchanged"

  - name: fee_component_conservation
    trigger: "invariant checked after every FeeAssessment creation, payment and credit"
    algorithm: aggregation
    formula: |
      total_cents == state_fee_cents + federal_fee_cents + processing_surcharge_cents
                     + vendor_convenience_fee_cents + vendor_tax_cents
                     + trip_surcharge_cents + reprint_fee_cents
                     - waived_cents - discount_cents
      and, once status IN {"PAID", "CREDITED"}:  paid_cents + credited_cents == total_cents
    input_set: "one FeeAssessment row"
    constants: {}
    precision: "exact integer cents; a vendor-borne credit must equal total_cents exactly so the payer's net is zero"

  - name: notification_routing_conservation
    trigger: "invariant checked after every rap-back notification arrival, acknowledgment and purge"
    algorithm: aggregation
    formula: |
      RapbackSubscription.notifications_received_count
        == RapbackSubscription.notifications_routed_count + RapbackSubscription.notifications_voided_count
      where notifications_routed_count counts bound notifications with status IN {"ROUTED", "ACKNOWLEDGED"}
      and ORPHANED notifications (subscription_id null) are counted on NEITHER side of the equation
    input_set: "the RapbackNotification rows bound to one subscription"
    constants: {}
    precision: "exact integer equality; the purge cascade moves ROUTED rows to VOIDED, leaving the sum unchanged"

  - name: site_concurrent_load
    trigger: "POST /livescan/appointments and POST /livescan/appointments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # half-open intervals [scheduled_start, scheduled_end); no buffer
      occupying = [a for a in Appointment
                   where a.site_id == site.id
                     and a.status IN {"BOOKED", "CHECKED_IN", "IN_CAPTURE"}
                     and a.id != candidate.id
                     and a.scheduled_start < candidate.scheduled_end
                     and a.scheduled_end   > candidate.scheduled_start]
      load = len(occupying)
      walkin_usable_capacity = concurrent_capacity - ceil(concurrent_capacity * SITE_WALKIN_RESERVE_PCT)
      if candidate.booking_channel == "BOOKED"  and load + 1 > concurrent_capacity:      raise ERR_SLOT_CAPACITY_EXCEEDED
      if candidate.booking_channel == "WALK_IN" and load + 1 > walkin_usable_capacity:   raise ERR_SLOT_CAPACITY_EXCEEDED
    input_set: "appointments at one site with status IN {BOOKED, CHECKED_IN, IN_CAPTURE}; CANCELLED, NO_SHOW and COMPLETED intervals are released"
    constants:
      SITE_WALKIN_RESERVE_PCT: 0.20
    precision: "adjacency is free: an appointment ending exactly at the candidate's start does not occupy it"
    worked_example: |
      concurrent_capacity 5 -> walkin_usable_capacity = 5 - ceil(1.0) = 4.
      Four booked 30-minute appointments overlapping 10:00-10:30 leave load 4: a fifth BOOKED
      appointment is accepted (5 <= 5) but a WALK_IN is refused (5 > 4).

  - name: device_assignment_overlap
    trigger: "POST /livescan/device-assignments"
    algorithm: interval_merge
    formula: |
      # buffered exclusive occupancy: a device may serve one site at a time and needs
      # DEVICE_ASSIGNMENT_BUFFER_MINUTES of travel time between windows
      conflict = exists a in DeviceAssignment
                 where a.device_id == candidate.device_id
                   and a.status IN {"SCHEDULED", "ACTIVE"}
                   and candidate.window_start <  a.window_end   + DEVICE_ASSIGNMENT_BUFFER_MINUTES minutes
                   and candidate.window_end   +  DEVICE_ASSIGNMENT_BUFFER_MINUTES minutes > a.window_start
      if conflict: raise ERR_DEVICE_ASSIGNMENT_CONFLICT
    input_set: "assignments of the same device with status IN {SCHEDULED, ACTIVE}; RELEASED and REVOKED_TAINTED windows are free"
    constants:
      DEVICE_ASSIGNMENT_BUFFER_MINUTES: 30
    precision: "the buffer is strict: a gap of exactly 30 minutes is accepted, a gap of 29 minutes is refused"

  - name: agency_delinquency_posture
    trigger: "POST /livescan/_ops/aging-run, POST /livescan/invoices/{id}/payments, POST /livescan/invoices/{id}/issue"
    algorithm: aggregation
    formula: |
      open_invoices = [i for i in Invoice where i.agency_id == agency.id and i.status IN {"ISSUED", "PAST_DUE"}]
      max_aging_days           = max([i.aging_days for i in open_invoices], default=0)
      outstanding_balance_cents= sum(i.total_cents - i.paid_cents for i in open_invoices)
      if   max_aging_days >= AGENCY_SUSPENSION_AGING_DAYS: billing_status = "SUSPENDED"
      elif max_aging_days >= 1:                            billing_status = "PAST_DUE"
      else:                                                billing_status = "CURRENT"
    input_set: "invoices of one agency with status IN {ISSUED, PAST_DUE}; DRAFT, PAID and WRITTEN_OFF invoices are excluded"
    constants:
      AGENCY_SUSPENSION_AGING_DAYS: 45
    precision: "the suspension boundary is inclusive: aging_days exactly 45 suspends, 44 does not"

  - name: invoice_late_fee_accrual
    trigger: "POST /livescan/_ops/aging-run, once per invoice per run"
    algorithm: decay_function
    formula: |
      if status IN {"ISSUED", "PAST_DUE"} and aging_days >= 1 and paid_cents < total_cents:
          late_fee_cents += round_half_up(INVOICE_LATE_FEE_PCT * (total_cents - paid_cents))
          total_cents     = subtotal_cents + late_fee_cents
    input_set: "one Invoice per aging run; a run never charges the same invoice twice"
    constants:
      INVOICE_LATE_FEE_PCT: 0.015
    precision: "whole cents, round_half_up; the fee is charged on the unpaid balance including previously accrued late fees"
    worked_example: "an invoice with subtotal 5692 and no payment accrues round_half_up(0.015 * 5692) = 85 cents on its first past-due run, making total_cents 5777"

  - name: taint_sweep_scope
    trigger: "POST /livescan/devices/{id}/calibration-audit"
    algorithm: chronological
    formula: |
      device.last_calibrated_at   = corrected_last_calibrated_at          # the audit rewrites it first
      device.calibration_expires_at = corrected_last_calibrated_at + DEVICE_CALIBRATION_VALID_DAYS days
      tainted = [c for c in FingerprintCard
                 where c.device_id == device.id
                   and c.first_capture_at is not null
                   and c.first_capture_at > device.calibration_expires_at
                   and c.status IN {"OPEN", "CAPTURING", "READY_FOR_SUBMISSION",
                                    "SUBMITTED", "CLOSED", "REJECTED_CLOSED"}]
      process tainted ordered by first_capture_at ASC, then created_at ASC
    input_set: "every card ever captured on this device; cards with no scored attempt (first_capture_at null) and already-SUPERSEDED cards are excluded"
    constants:
      DEVICE_CALIBRATION_VALID_DAYS: 180
    precision: "strictly after: a card whose first_capture_at equals calibration_expires_at exactly is NOT tainted"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# 40 rungs. Ordering notes that matter downstream:
#   - the billing freeze (6) pre-empts every state, temporal and fiscal rung
#   - OCC (9) pre-empts state preconditions (10)
#   - segregation of duties (11) is checked after state, so an invalid state on a
#     self-decided purge reports the state error, not the SoD error
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND that role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-segment resource exists, validated left to right; a missing FingerprintCard raises ERR_CARD_NOT_FOUND, a missing Submission raises ERR_SUBMISSION_NOT_FOUND, and every other missing path resource (Agency, Ori, ServiceType, CaptureSite, Device, DeviceAssignment, Applicant, Appointment, PositionCapture, ChrResponse, FitnessDetermination, RapbackSubscription, RapbackNotification, FeeAssessment, Invoice) raises ERR_REFERENCE_NOT_FOUND"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /livescan/oris, POST /livescan/service-types, POST /livescan/sites, POST /livescan/devices, POST /livescan/device-assignments, POST /livescan/appointments, POST /livescan/cards, POST /livescan/submissions, POST /livescan/fitness-determinations, POST /livescan/rapback-subscriptions, POST /livescan/invoices"

  - priority: 5
    category: business_constraint
    check: "every required body field is present with the declared type; numeric ranges hold (quality score 0..100, concurrent_capacity 1..50, min_billable_prints 1..500, record_count 0..99, disqualifying_offense_count <= record_count, amount_cents >= 1); window_end > window_start; a MOBILE_EVENT site supplies host_agency_id, event_window_start, event_window_end and min_billable_prints while a FIXED site supplies none of them. This rung never checks whether a payment amount MATCHES an outstanding balance — that is rung 40"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "enum membership. This list is exhaustive and closed — exactly these request fields route here: Agency.payer_regime_default, Ori.statutory_authority, ServiceType.applicant_type, ServiceType.required_document_codes members, ServiceType.accepted_id_document_types members, CaptureSite.site_kind, Appointment.booking_channel, Appointment.presented_document_type, Applicant.sex, Applicant.id_document_type, PositionCapture exception_code, destination-results destination and result_code, FitnessDetermination outcome and amended_outcome, challenge-resolution resolution, purge-decision decision, RapbackNotification event_type, Ori authority-status to_status. No other field routes to ERR_INVALID_ENUM; an unknown value in any other field is ERR_INVALID_REQUEST"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 7
    category: business_safety
    check: "the Agency that owns the target ORI (or hosts the target MOBILE_EVENT site) does not have billing_status == SUSPENDED. FROZEN write set: POST /livescan/service-types, POST /livescan/appointments, POST /livescan/cards, POST /livescan/cards/{id}/positions/{position_code}/attempts, POST /livescan/cards/{id}/positions/{position_code}/exception, POST /livescan/cards/{id}/exception-override, POST /livescan/cards/{id}/finalize, POST /livescan/submissions, POST /livescan/submissions/{id}/reprints, POST /livescan/rapback-subscriptions, POST /livescan/rapback-subscriptions/{id}/renew, POST /livescan/fitness-determinations, POST /livescan/device-assignments. EXPLICIT EXCLUSION LIST — these stay allowed while suspended: every GET, POST /livescan/rapback-notifications, POST /livescan/rapback-notifications/{id}/acknowledge, POST /livescan/fitness-determinations/{id}/challenges, POST /livescan/fitness-determinations/{id}/challenge-resolutions, POST /livescan/submissions/{id}/purge-requests, POST /livescan/submissions/{id}/purge-decisions, POST /livescan/submissions/{id}/destination-results, POST /livescan/rapback-subscriptions/{id}/cancel, POST /livescan/appointments/{id}/cancel, POST /livescan/appointments/{id}/no-show, POST /livescan/appointments/{id}/check-in, POST /livescan/device-assignments/{id}/release, POST /livescan/sites/{id}/event-reconciliation, POST /livescan/invoices, POST /livescan/invoices/{id}/issue, POST /livescan/invoices/{id}/payments, POST /livescan/fee-assessments/{id}/payments, POST /livescan/devices/{id}/calibration, POST /livescan/devices/{id}/calibration-audit, POST /livescan/oris/{id}/authority-status, POST /livescan/_ops/aging-run, POST /livescan/_clock/set_current_utc"
    error_id: ERR_AGENCY_BILLING_SUSPENDED
    http_status: 403
    applies_to: "the FROZEN write set enumerated in this check"

  - priority: 8
    category: business_safety
    check: "the ORI the operation transmits under has authority_status == ACTIVE"
    error_id: ERR_ORI_AUTHORITY_SUSPENDED
    http_status: 409
    applies_to: "POST /livescan/submissions, POST /livescan/submissions/{id}/reprints, POST /livescan/rapback-subscriptions, POST /livescan/rapback-subscriptions/{id}/renew"

  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version — expected_card_version on transmit, expected_submission_version on determination issuance, expected_agency_version on invoice creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /livescan/submissions, POST /livescan/fitness-determinations, POST /livescan/invoices"

  - priority: 10
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2; Appointment violations raise ERR_APPOINTMENT_STATE_INVALID, FingerprintCard violations raise ERR_CARD_STATE_INVALID, and Submission, ChrResponse, FitnessDetermination, RapbackSubscription, RapbackNotification, DeviceAssignment, FeeAssessment and Invoice violations raise ERR_RECORD_STATE_INVALID. TWO NAMED CARVE-OUTS so the rungs below stay reachable: (a) on POST /livescan/submissions/{id}/destination-results this rung ignores an fbi_status of NOT_REQUIRED and fires only when the named axis is already terminal (a second result for the same destination) — a destination that is not in Submission.destinations at all is priority 27's business; (b) on POST /livescan/rapback-subscriptions/{id}/renew this rung fires only for status IN {LAPSED, CANCELLED, TERMINATED} — a still-ACTIVE subscription outside its renewal window is priority 32's business"
    error_id: ERR_RECORD_STATE_INVALID
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 11
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from the recorded first actor — exception-override actor vs FingerprintCard.captured_by_user_id, challenge resolver vs FitnessDetermination.issued_by_user_id, purge decider vs Submission.purge_requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /livescan/cards/{id}/exception-override, POST /livescan/fitness-determinations/{id}/challenge-resolutions, POST /livescan/submissions/{id}/purge-decisions"

  - priority: 12
    category: business_temporal
    check: "the logical clock is inside [scheduled_start - CHECKIN_EARLY_WINDOW_MINUTES (30), scheduled_start + CHECKIN_LATE_GRACE_MINUTES (10)], inclusive at both ends"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /livescan/appointments/{id}/check-in"

  - priority: 13
    category: business_temporal
    check: "the logical clock is at or before scheduled_start - APPOINTMENT_RESCHEDULE_WINDOW_HOURS (24) hours"
    error_id: ERR_RESCHEDULE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /livescan/appointments/{id}/reschedule"

  - priority: 14
    category: business_constraint
    check: "reschedule_count < APPOINTMENT_MAX_RESCHEDULES (2)"
    error_id: ERR_APPOINTMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /livescan/appointments/{id}/reschedule"

  - priority: 15
    category: business_referential
    check: "presented_document_type is a member of the appointment's ServiceType.accepted_id_document_types"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /livescan/appointments/{id}/check-in"

  - priority: 16
    category: business_temporal
    check: "Applicant.id_document_expires_on >= the logical-clock UTC date (a document expiring exactly today is still valid)"
    error_id: ERR_IDENTITY_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /livescan/appointments/{id}/check-in"

  - priority: 17
    category: business_referential
    check: "presented_documents contains every code in the appointment's ServiceType.required_document_codes"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /livescan/appointments/{id}/check-in"

  - priority: 18
    category: business_constraint
    check: "calculations.site_concurrent_load admits the candidate interval for its booking_channel"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /livescan/appointments, POST /livescan/appointments/{id}/reschedule"

  - priority: 19
    category: business_safety
    check: "the capture device has calibration_status == CALIBRATED, i.e. the logical clock is at or before Device.calibration_expires_at"
    error_id: ERR_DEVICE_CALIBRATION_EXPIRED
    http_status: 409
    applies_to: "POST /livescan/cards, POST /livescan/cards/{id}/positions/{position_code}/attempts"

  - priority: 20
    category: business_referential
    check: "when the card's site has site_kind == MOBILE_EVENT, a DeviceAssignment with status IN {SCHEDULED, ACTIVE} binds that device to that site and the logical clock is inside its window"
    error_id: ERR_DEVICE_ASSIGNMENT_CONFLICT
    http_status: 409
    applies_to: "POST /livescan/cards, POST /livescan/cards/{id}/positions/{position_code}/attempts"

  - priority: 21
    category: business_temporal
    check: "calculations.device_assignment_overlap finds no conflicting window on the same device"
    error_id: ERR_DEVICE_ASSIGNMENT_CONFLICT
    http_status: 409
    applies_to: "POST /livescan/device-assignments"

  - priority: 22
    category: state
    check: "the target PositionCapture is not already closed (status NOT IN {PASSED, EXCEPTION_CODED})"
    error_id: ERR_POSITION_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /livescan/cards/{id}/positions/{position_code}/attempts, POST /livescan/cards/{id}/positions/{position_code}/exception"

  - priority: 23
    category: business_constraint
    check: "attempt_count < POSITION_ATTEMPT_CEILING (3)"
    error_id: ERR_POSITION_ATTEMPT_CEILING_REACHED
    http_status: 409
    applies_to: "POST /livescan/cards/{id}/positions/{position_code}/attempts"

  - priority: 24
    category: business_constraint
    check: "the card's positions_exception_count + 1 <= EXCEPTION_POSITION_HARD_MAX (4) — no override can lift this"
    error_id: ERR_EXCEPTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /livescan/cards/{id}/positions/{position_code}/exception"

  - priority: 25
    category: business_constraint
    check: "positions_exception_count <= EXCEPTION_POSITION_MAX (2) OR exception_override_by_user_id is not null"
    error_id: ERR_EXCEPTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /livescan/cards/{id}/finalize"

  - priority: 26
    category: business_constraint
    check: "every PositionCapture row is PASSED or EXCEPTION_CODED and mean_quality_score >= CARD_MEAN_QUALITY_MIN (65)"
    error_id: ERR_CARD_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /livescan/cards/{id}/finalize"

  - priority: 27
    category: business_referential
    check: "the destination named in the request is a member of Submission.destinations"
    error_id: ERR_DESTINATION_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /livescan/submissions/{id}/destination-results"

  - priority: 28
    category: business_safety
    check: "retention_requested true requires Ori.retention_permitted == true AND ServiceType.retention_offered == true"
    error_id: ERR_RETENTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /livescan/submissions"

  - priority: 29
    category: business_safety
    check: "when the transmitted card carries reprint_of_submission_id, the supplied retention_requested must equal the original submission's retention_requested — the election is irrevocable once the original was transmitted"
    error_id: ERR_RETENTION_IMMUTABLE
    http_status: 409
    applies_to: "POST /livescan/submissions (only when FingerprintCard.reprint_of_submission_id is not null)"

  - priority: 30
    category: business_safety
    check: "the submission's Ori has rapback_authority == true. This rung sits ABOVE the retention rung on purpose: a NONCRIMINAL_NOFED ORI can never reach retention_status GRANTED, so ordering retention first would make this error unreachable"
    error_id: ERR_RAPBACK_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /livescan/rapback-subscriptions, POST /livescan/rapback-subscriptions/{id}/renew"

  - priority: 31
    category: business_safety
    check: "the subscribed Submission has retention_status IN {GRANTED, PURGE_REQUESTED, PURGE_DENIED}"
    error_id: ERR_RAPBACK_REQUIRES_RETENTION
    http_status: 409
    applies_to: "POST /livescan/rapback-subscriptions"

  - priority: 32
    category: business_temporal
    check: "the subscription is inside its renewal window (status RENEWAL_DUE, i.e. term_end - RAPBACK_RENEWAL_WINDOW_DAYS (60) <= clock <= term_end)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /livescan/rapback-subscriptions/{id}/renew"

  - priority: 33
    category: business_referential
    check: "the notification is bound to a subscription (subscription_id is not null and status == ROUTED)"
    error_id: ERR_NOTIFICATION_UNROUTABLE
    http_status: 409
    applies_to: "POST /livescan/rapback-notifications/{id}/acknowledge"

  - priority: 34
    category: business_safety
    check: "include_detail true is honoured only for an AgencyAdjudicator reading a response whose Ori.dissemination_tier == FULL_CHR; every other role-tier combination is refused"
    error_id: ERR_DISSEMINATION_NOT_ENTITLED
    http_status: 403
    applies_to: "GET /livescan/chr-responses/{id}"

  - priority: 35
    category: business_temporal
    check: "the logical clock is at or before FitnessDetermination.issued_at + CHALLENGE_FILING_WINDOW_DAYS (21) days"
    error_id: ERR_CHALLENGE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /livescan/fitness-determinations/{id}/challenges"

  - priority: 36
    category: business_constraint
    check: "challenge_count < CHALLENGE_MAX_CYCLES (2)"
    error_id: ERR_CHALLENGE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /livescan/fitness-determinations/{id}/challenges"

  - priority: 37
    category: business_constraint
    check: "the submission has at least one destination in REJECTED_TECHNICAL or REJECTED_ADMIN"
    error_id: ERR_REPRINT_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /livescan/submissions/{id}/reprints"

  - priority: 38
    category: business_constraint
    check: "reprint_count < REPRINT_MAX_PER_SUBMISSION (3)"
    error_id: ERR_REPRINT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /livescan/submissions/{id}/reprints"

  - priority: 39
    category: business_fiscal
    check: "the assessment's payer_regime is APPLICANT_PAID; AGENCY_BILLED and FEE_WAIVED assessments are settled through their invoice"
    error_id: ERR_PAYER_REGIME_MISMATCH
    http_status: 422
    applies_to: "POST /livescan/fee-assessments/{id}/payments"

  - priority: 40
    category: business_fiscal
    check: "amount_cents equals FeeAssessment.total_cents - paid_cents exactly for an assessment payment, or Invoice.total_cents - paid_cents exactly for an invoice payment"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /livescan/fee-assessments/{id}/payments, POST /livescan/invoices/{id}/payments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table — 73 endpoints, all under the /livescan prefix
# ---------------------------------------------------------------------------
endpoints:
  # ---- Agencies, ORIs, service types -------------------------------------
  - method: POST
    path: "/livescan/agencies"
    description: "register a billing agency"
    roles: [VendorAdmin]
    code: 201
    input: [name, account_code, "payer_regime_default?", "invoice_terms_days?"]
    output: Agency
    side_effects: ["billing_status starts at CURRENT", "mtd_billed_cents starts at 0"]

  - method: GET
    path: "/livescan/agencies/{id}"
    description: "read one agency including its billing posture"
    roles: [VendorAdmin, AgencyAdjudicator, SiteSupervisor]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/livescan/oris"
    description: "register an ORI under an agency; the four authority fields are derived, never supplied"
    roles: [VendorAdmin]
    code: 201
    input: [agency_id, ori_code, statutory_authority, "fee_waiver_eligible?"]
    output: Ori
    side_effects: ["applies calculations.ori_authority_profile to set destination_requirement, dissemination_tier, retention_permitted and rapback_authority"]

  - method: GET
    path: "/livescan/oris/{id}"
    description: "read one ORI including its TCN ledger counters"
    roles: [VendorAdmin, AgencyAdjudicator, SiteSupervisor, LivescanTechnician]
    code: 200
    input: []
    output: Ori
    side_effects: []

  - method: GET
    path: "/livescan/oris"
    description: "list ORIs, filterable by agency"
    roles: [VendorAdmin, AgencyAdjudicator, SiteSupervisor, LivescanTechnician]
    code: 200
    input: ["agency_id?", "authority_status?", "limit?", "offset?"]
    output: Ori[]
    side_effects: []

  - method: POST
    path: "/livescan/oris/{id}/authority-status"
    description: "suspend or reinstate an ORI's transmission authority"
    roles: [VendorAdmin]
    code: 200
    input: [to_status]
    output: Ori
    side_effects: ["moves Ori.authority_status per §1.2", "increments Ori.version by 1"]

  - method: POST
    path: "/livescan/service-types"
    description: "define a service type under an ORI"
    roles: [VendorAdmin]
    code: 201
    input: [ori_id, code, applicant_type, slot_duration_minutes, required_document_codes, accepted_id_document_types, state_fee_cents, federal_fee_cents, "retention_offered?"]
    output: ServiceType
    side_effects: ["status starts at ACTIVE"]

  - method: GET
    path: "/livescan/service-types/{id}"
    description: "read one service type"
    roles: [VendorAdmin, AgencyAdjudicator, LivescanTechnician, Applicant]
    code: 200
    input: []
    output: ServiceType
    side_effects: []

  - method: GET
    path: "/livescan/service-types"
    description: "list service types, filterable by ORI"
    roles: [VendorAdmin, AgencyAdjudicator, LivescanTechnician, Applicant]
    code: 200
    input: ["ori_id?", "status?", "limit?", "offset?"]
    output: ServiceType[]
    side_effects: []

  # ---- Sites, devices, rosters -------------------------------------------
  - method: POST
    path: "/livescan/sites"
    description: "create a FIXED storefront or a MOBILE_EVENT onsite session"
    roles: [VendorAdmin]
    code: 201
    input: [site_kind, name, concurrent_capacity, "host_agency_id?", "event_window_start?", "event_window_end?", "min_billable_prints?"]
    output: CaptureSite
    side_effects: ["computes walkin_usable_capacity", "sets reconciliation_status to PENDING for MOBILE_EVENT and NOT_APPLICABLE for FIXED"]

  - method: GET
    path: "/livescan/sites/{id}"
    description: "read one capture site including its billable-print counter"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician, AgencyAdjudicator]
    code: 200
    input: []
    output: CaptureSite
    side_effects: []

  - method: GET
    path: "/livescan/sites"
    description: "list capture sites, filterable by host agency"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician, AgencyAdjudicator, Applicant]
    code: 200
    input: ["host_agency_id?", "site_kind?", "limit?", "offset?"]
    output: CaptureSite[]
    side_effects: []

  - method: POST
    path: "/livescan/sites/{id}/event-reconciliation"
    description: "close out a MOBILE_EVENT and charge any shortfall"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: CaptureSite
    side_effects: ["recomputes billable_print_count", "applies calculations.onsite_shortfall_charge", "creates an ONSITE_SHORTFALL FeeAssessment only when the charge is above 0", "releases every SCHEDULED or ACTIVE DeviceAssignment at this site"]

  - method: POST
    path: "/livescan/devices"
    description: "register a livescan scanner with its last calibration instant"
    roles: [VendorAdmin]
    code: 201
    input: [serial_number, home_site_id, calibrated_at]
    output: Device
    side_effects: ["sets calibration_expires_at to calibrated_at + DEVICE_CALIBRATION_VALID_DAYS (180) days"]

  - method: GET
    path: "/livescan/devices/{id}"
    description: "read one device including its calibration posture"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/livescan/devices"
    description: "list devices, filterable by home site"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician]
    code: 200
    input: ["home_site_id?", "calibration_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: POST
    path: "/livescan/devices/{id}/calibration"
    description: "record a new calibration, clearing EXPIRED or QUARANTINED"
    roles: [VendorAdmin]
    code: 200
    input: [calibrated_at]
    output: Device
    side_effects: ["resets last_calibrated_at and calibration_expires_at", "never un-supersedes a card an earlier audit tainted", "increments Device.version by 1"]

  - method: POST
    path: "/livescan/devices/{id}/calibration-audit"
    description: "retroactive lapse sweep: restate the device's true last valid calibration instant, quarantine it, and supersede every card captured after the corrected expiry"
    roles: [VendorAdmin]
    code: 200
    input: [corrected_last_calibrated_at]
    output: Device
    side_effects: ["cascade hops 1-6 of the calibration-lapse chain per §1.2 Device CALIBRATED -> QUARANTINED", "applies calculations.taint_sweep_scope", "credits the tainted cards' FeeAssessment rows", "recomputes CaptureSite.billable_print_count"]

  - method: POST
    path: "/livescan/device-assignments"
    description: "roster a device to a site for a window"
    roles: [VendorAdmin, SiteSupervisor]
    code: 201
    input: [device_id, site_id, window_start, window_end]
    output: DeviceAssignment
    side_effects: ["applies calculations.device_assignment_overlap", "snapshots calibration_expires_at_snapshot"]

  - method: GET
    path: "/livescan/device-assignments/{id}"
    description: "read one roster entry"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician]
    code: 200
    input: []
    output: DeviceAssignment
    side_effects: []

  - method: GET
    path: "/livescan/device-assignments"
    description: "list roster entries, filterable by device or site"
    roles: [VendorAdmin, SiteSupervisor, LivescanTechnician]
    code: 200
    input: ["device_id?", "site_id?", "status?", "limit?", "offset?"]
    output: DeviceAssignment[]
    side_effects: []

  - method: POST
    path: "/livescan/device-assignments/{id}/release"
    description: "release a rostered device before or during its window"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: DeviceAssignment
    side_effects: ["recomputes billable_print_count", "frees the window for a later overlapping assignment"]

  # ---- Applicants and appointments ---------------------------------------
  - method: POST
    path: "/livescan/applicants"
    description: "register an applicant; place_of_birth may be omitted, which is what an administrative rejection later cites"
    roles: [Applicant, LivescanTechnician]
    code: 201
    input: [full_name, date_of_birth, sex, id_document_type, id_document_expires_on, "place_of_birth?"]
    output: Applicant
    side_effects: ["computes demographics_complete"]

  - method: GET
    path: "/livescan/applicants/{id}"
    description: "read one applicant"
    roles: [Applicant, LivescanTechnician, VendorAdmin, AgencyAdjudicator]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: PATCH
    path: "/livescan/applicants/{id}"
    description: "correct demographics or identity document details"
    roles: [Applicant, LivescanTechnician]
    code: 200
    input: ["place_of_birth?", "id_document_type?", "id_document_expires_on?"]
    output: Applicant
    side_effects: ["recomputes demographics_complete", "increments Applicant.version by 1"]

  - method: POST
    path: "/livescan/appointments"
    description: "book a slot or record a walk-in at a capture site"
    roles: [Applicant, LivescanTechnician]
    code: 201
    input: [applicant_id, site_id, service_type_id, scheduled_start, "booking_channel?"]
    output: Appointment
    side_effects: ["sets scheduled_end from ServiceType.slot_duration_minutes", "applies calculations.site_concurrent_load"]

  - method: GET
    path: "/livescan/appointments/{id}"
    description: "read one appointment"
    roles: [Applicant, LivescanTechnician, SiteSupervisor, VendorAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/livescan/appointments"
    description: "list appointments, filterable by applicant, site or service type"
    roles: [Applicant, LivescanTechnician, SiteSupervisor, VendorAdmin]
    code: 200
    input: ["applicant_id?", "site_id?", "service_type_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/livescan/appointments/{id}/reschedule"
    description: "move a booked appointment to a new start"
    roles: [Applicant, LivescanTechnician]
    code: 200
    input: [scheduled_start]
    output: Appointment
    side_effects: ["increments reschedule_count", "re-applies calculations.site_concurrent_load excluding this appointment's own current interval"]

  - method: POST
    path: "/livescan/appointments/{id}/cancel"
    description: "cancel a booked or checked-in appointment"
    roles: [Applicant, LivescanTechnician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["releases the interval", "creates no FeeAssessment"]

  - method: POST
    path: "/livescan/appointments/{id}/check-in"
    description: "verify identity documents and unlock capture"
    roles: [LivescanTechnician]
    code: 200
    input: [presented_document_type, presented_documents]
    output: Appointment
    side_effects: ["stamps checked_in_at", "records the presented document set"]

  - method: POST
    path: "/livescan/appointments/{id}/no-show"
    description: "mark a booked appointment as a no-show and charge the flat fee"
    roles: [LivescanTechnician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["creates a NO_SHOW FeeAssessment of NO_SHOW_FEE_CENTS (1500)", "sets no_show_fee_assessed to true", "releases the interval"]

  # ---- Capture ------------------------------------------------------------
  - method: POST
    path: "/livescan/cards"
    description: "open a fingerprint card on a device for a checked-in appointment; ten PositionCapture rows are created with it"
    roles: [LivescanTechnician]
    code: 201
    input: [appointment_id, device_id, "reprint_of_submission_id?"]
    output: FingerprintCard
    side_effects: ["creates ten PositionCapture rows in PENDING", "copies site_id from the appointment", "stamps captured_by_user_id from X-User-ID", "moves the appointment to IN_CAPTURE"]

  - method: GET
    path: "/livescan/cards/{id}"
    description: "read one card with its quality aggregates"
    roles: [LivescanTechnician, SiteSupervisor, VendorAdmin, AgencyAdjudicator]
    code: 200
    input: []
    output: FingerprintCard
    side_effects: []

  - method: GET
    path: "/livescan/cards"
    description: "list cards, filterable by appointment, device, site, supersede link or reprint origin"
    roles: [LivescanTechnician, SiteSupervisor, VendorAdmin, AgencyAdjudicator]
    code: 200
    input: ["appointment_id?", "device_id?", "site_id?", "status?", "superseded_by_card_id?", "reprint_of_submission_id?", "limit?", "offset?"]
    output: FingerprintCard[]
    side_effects: []

  - method: GET
    path: "/livescan/cards/{id}/positions"
    description: "read the ten finger positions of a card"
    roles: [LivescanTechnician, SiteSupervisor, VendorAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PositionCapture[]
    side_effects: []

  - method: POST
    path: "/livescan/cards/{id}/positions/{position_code}/attempts"
    description: "record one scored capture attempt on a finger position"
    roles: [LivescanTechnician]
    code: 201
    input: [score]
    output: PositionCapture
    side_effects: ["increments attempt_count and best_score", "moves the position per §1.2", "recomputes the card aggregates per calculations.card_quality_aggregate"]

  - method: POST
    path: "/livescan/cards/{id}/positions/{position_code}/exception"
    description: "close a finger position with an exception code instead of a score"
    roles: [LivescanTechnician]
    code: 200
    input: [exception_code]
    output: PositionCapture
    side_effects: ["sets exception_code and closed_at", "increments the card's positions_exception_count", "recomputes submittable"]

  - method: POST
    path: "/livescan/cards/{id}/exception-override"
    description: "supervisor authorization to finalize a card carrying more than EXCEPTION_POSITION_MAX exception-coded positions"
    roles: [SiteSupervisor]
    code: 200
    input: [justification]
    output: FingerprintCard
    side_effects: ["sets exception_override_by_user_id to the acting X-User-ID", "raises the applicable exception ceiling to EXCEPTION_POSITION_HARD_MAX (4)", "increments FingerprintCard.version by 1"]

  - method: POST
    path: "/livescan/cards/{id}/finalize"
    description: "close capture and mark the card ready for transmission"
    roles: [LivescanTechnician]
    code: 200
    input: []
    output: FingerprintCard
    side_effects: ["moves the card to READY_FOR_SUBMISSION", "freezes every position", "increments FingerprintCard.version by 1"]

  # ---- Submission, destinations, responses --------------------------------
  - method: POST
    path: "/livescan/submissions"
    description: "transmit a finalized card to its required destinations and record the irrevocable retention election"
    roles: [LivescanTechnician]
    code: 201
    input: [card_id, retention_requested, expected_card_version]
    output: Submission
    side_effects: ["mints or extends the TCN per calculations.tcn_allocation", "sets destinations from Ori.destination_requirement", "sets fbi_status to NOT_REQUIRED for a STATE_ONLY ORI", "creates one SUBMISSION or REPRINT FeeAssessment per calculations.fee_assessment_total", "moves the card to SUBMITTED and the appointment to COMPLETED", "increments CaptureSite.billable_print_count", "increments FingerprintCard.version by 1"]

  - method: GET
    path: "/livescan/submissions/{id}"
    description: "read one submission with both destination axes and the composite disposition"
    roles: [LivescanTechnician, SiteSupervisor, VendorAdmin, AgencyAdjudicator, Applicant]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/livescan/submissions"
    description: "list submissions, filterable by card, ORI or reprint origin"
    roles: [LivescanTechnician, SiteSupervisor, VendorAdmin, AgencyAdjudicator]
    code: 200
    input: ["card_id?", "ori_id?", "original_submission_id?", "state_status?", "composite_disposition?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: POST
    path: "/livescan/submissions/{id}/destination-results"
    description: "destination posts its result for one axis; an acceptance also creates and routes the criminal-history response"
    roles: [StateRepository]
    code: 201
    input: [destination, result_code, "record_count?", "disqualifying_offense_count?", "record_detail?", "rejection_reason?"]
    output: Submission
    side_effects: ["advances only the named axis", "creates one ChrResponse on ACCEPTED and routes it per calculations.dissemination_projection", "recomputes composite_disposition", "increments Submission.version by 1"]

  - method: GET
    path: "/livescan/submissions/{id}/responses"
    description: "list the criminal-history responses of a submission"
    roles: [AgencyAdjudicator, VendorAdmin, StateRepository]
    code: 200
    input: ["destination?", "limit?", "offset?"]
    output: ChrResponse[]
    side_effects: []

  - method: GET
    path: "/livescan/chr-responses/{id}"
    description: "read one response projected for the caller's role and the ORI's dissemination tier"
    roles: [AgencyAdjudicator, Applicant, VendorAdmin]
    code: 200
    input: ["include_detail?"]
    output: ChrResponse
    side_effects: ["no mutation; the projection is computed per calculations.dissemination_projection"]

  - method: POST
    path: "/livescan/submissions/{id}/reprints"
    description: "authorize a reprint after a rejection; creates the replacement card and decides the fee entitlement at this instant"
    roles: [SiteSupervisor]
    code: 201
    input: [device_id]
    output: FingerprintCard
    side_effects: ["evaluates calculations.reprint_entitlement and stamps free_reprint_granted on the new card", "stamps captured_by_user_id on the replacement card with the acting SiteSupervisor's X-User-ID, so a later exception override on that card needs a third actor", "increments Submission.reprint_count and, when free, free_reprint_count", "moves the original card to REJECTED_CLOSED when it is still SUBMITTED (a no-op on the second and third reprint) and re-points its superseded_by_card_id at the NEWEST replacement card", "moves the original submission's ChrResponse rows to SUPERSEDED", "creates the replacement card in OPEN with ten PENDING positions, reusing the original appointment"]

  - method: POST
    path: "/livescan/submissions/{id}/purge-requests"
    description: "request destruction of a retained record"
    roles: [Applicant, AgencyAdjudicator]
    code: 200
    input: [reason]
    output: Submission
    side_effects: ["stamps purge_requested_at and purge_requested_by_user_id", "moves retention_status to PURGE_REQUESTED"]

  - method: POST
    path: "/livescan/submissions/{id}/purge-decisions"
    description: "grant or deny a purge; a grant runs the six-hop retention cascade"
    roles: [VendorAdmin]
    code: 200
    input: [decision]
    output: Submission
    side_effects: ["cascade hops 1-6 per §1.2 Submission retention_status PURGE_REQUESTED -> PURGED", "reconciles the ORI TCN ledger per calculations.tcn_conservation", "increments Submission.version by 1"]

  # ---- Fitness determination and challenge --------------------------------
  - method: POST
    path: "/livescan/fitness-determinations"
    description: "adjudicate a completed submission to a fitness outcome"
    roles: [AgencyAdjudicator]
    code: 201
    input: [submission_id, outcome, expected_submission_version]
    output: FitnessDetermination
    side_effects: ["pins basis_response_id to the submission's STATE ChrResponse with routing_status ROUTED", "stamps issued_by_user_id and issued_at", "increments Submission.version by 1"]

  - method: GET
    path: "/livescan/fitness-determinations/{id}"
    description: "read one determination"
    roles: [AgencyAdjudicator, Applicant, VendorAdmin]
    code: 200
    input: []
    output: FitnessDetermination
    side_effects: []

  - method: GET
    path: "/livescan/fitness-determinations"
    description: "list determinations, filterable by submission, ORI or basis response"
    roles: [AgencyAdjudicator, Applicant, VendorAdmin]
    code: 200
    input: ["submission_id?", "ori_id?", "basis_response_id?", "status?", "limit?", "offset?"]
    output: FitnessDetermination[]
    side_effects: []

  - method: POST
    path: "/livescan/fitness-determinations/{id}/challenges"
    description: "applicant challenges the accuracy of the record the determination rests on"
    roles: [Applicant]
    code: 200
    input: [grounds]
    output: FitnessDetermination
    side_effects: ["increments challenge_count", "stamps challenge_filed_at", "suspends the determination's effect", "remains allowed while the agency is billing-suspended"]

  - method: POST
    path: "/livescan/fitness-determinations/{id}/challenge-resolutions"
    description: "a different adjudicator resolves the open challenge"
    roles: [AgencyAdjudicator]
    code: 200
    input: [resolution, "amended_outcome?"]
    output: FitnessDetermination
    side_effects: ["sets resolved_by_user_id", "REAFFIRM returns to REAFFIRMED and re-opens the cycle, AMEND overwrites outcome and is terminal"]

  # ---- Rap-back -----------------------------------------------------------
  - method: POST
    path: "/livescan/rapback-subscriptions"
    description: "subscribe to rap-back for a retained submission"
    roles: [AgencyAdjudicator]
    code: 201
    input: [submission_id]
    output: RapbackSubscription
    side_effects: ["sets term_start and term_end per calculations.rapback_term_expiry", "copies ori_id from the submission"]

  - method: GET
    path: "/livescan/rapback-subscriptions/{id}"
    description: "read one subscription with its notification counters"
    roles: [AgencyAdjudicator, VendorAdmin, StateRepository]
    code: 200
    input: []
    output: RapbackSubscription
    side_effects: ["re-evaluates ACTIVE -> RENEWAL_DUE and RENEWAL_DUE -> LAPSED against the logical clock"]

  - method: GET
    path: "/livescan/rapback-subscriptions"
    description: "list subscriptions, filterable by submission or ORI"
    roles: [AgencyAdjudicator, VendorAdmin, StateRepository]
    code: 200
    input: ["submission_id?", "ori_id?", "status?", "limit?", "offset?"]
    output: RapbackSubscription[]
    side_effects: []

  - method: POST
    path: "/livescan/rapback-subscriptions/{id}/renew"
    description: "renew a subscription inside its renewal window"
    roles: [AgencyAdjudicator]
    code: 200
    input: []
    output: RapbackSubscription
    side_effects: ["restarts the term from the renew instant", "increments renewal_count"]

  - method: POST
    path: "/livescan/rapback-subscriptions/{id}/cancel"
    description: "cancel a subscription; later notifications for the submission become orphans"
    roles: [AgencyAdjudicator]
    code: 200
    input: []
    output: RapbackSubscription
    side_effects: ["leaves already-routed notifications untouched"]

  - method: POST
    path: "/livescan/rapback-notifications"
    description: "destination delivers a rap-back event; binding to a routable subscription is decided here"
    roles: [StateRepository]
    code: 201
    input: [ori_code, subject_submission_tcn, event_type, event_date]
    output: RapbackNotification
    side_effects: ["binds to the subscription whose submission tcn_full matches and whose status IN {ACTIVE, RENEWAL_DUE}, else lands ORPHANED with subscription_id null", "increments the subscription's notifications_received_count"]

  - method: GET
    path: "/livescan/rapback-notifications/{id}"
    description: "read one rap-back notification"
    roles: [AgencyAdjudicator, VendorAdmin, StateRepository]
    code: 200
    input: []
    output: RapbackNotification
    side_effects: []

  - method: GET
    path: "/livescan/rapback-notifications"
    description: "list rap-back notifications, filterable by subscription"
    roles: [AgencyAdjudicator, VendorAdmin, StateRepository]
    code: 200
    input: ["subscription_id?", "status?", "ori_code?", "limit?", "offset?"]
    output: RapbackNotification[]
    side_effects: []

  - method: POST
    path: "/livescan/rapback-notifications/{id}/acknowledge"
    description: "agency acknowledges a routed rap-back event"
    roles: [AgencyAdjudicator]
    code: 200
    input: []
    output: RapbackNotification
    side_effects: ["sets acknowledged_by_user_id", "remains allowed while the agency is billing-suspended"]

  # ---- Fees and invoices ---------------------------------------------------
  - method: GET
    path: "/livescan/fee-assessments/{id}"
    description: "read one fee assessment with every component"
    roles: [VendorAdmin, AgencyAdjudicator, LivescanTechnician, Applicant]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: GET
    path: "/livescan/fee-assessments"
    description: "list fee assessments, filterable by agency, submission, appointment or invoice"
    roles: [VendorAdmin, AgencyAdjudicator, LivescanTechnician, Applicant]
    code: 200
    input: ["agency_id?", "submission_id?", "appointment_id?", "invoice_id?", "assessment_kind?", "status?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  - method: POST
    path: "/livescan/fee-assessments/{id}/payments"
    description: "take payment at point of service for an applicant-paid assessment"
    roles: [LivescanTechnician, Applicant]
    code: 200
    input: [amount_cents]
    output: FeeAssessment
    side_effects: ["sets paid_cents and moves the assessment to PAID"]

  - method: POST
    path: "/livescan/invoices"
    description: "open a billing-period invoice for an agency"
    roles: [VendorAdmin]
    code: 201
    input: [agency_id, period_key, expected_agency_version]
    output: Invoice
    side_effects: ["starts at DRAFT", "increments Agency.version by 1"]

  - method: GET
    path: "/livescan/invoices/{id}"
    description: "read one invoice with its aging"
    roles: [VendorAdmin, AgencyAdjudicator]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/livescan/invoices"
    description: "list invoices, filterable by agency"
    roles: [VendorAdmin, AgencyAdjudicator]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/livescan/invoices/{id}/issue"
    description: "issue a draft invoice, attaching every open agency-billed assessment"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["attaches assessments ordered by created_at ASC and moves them to INVOICED", "stamps issued_on and due_on", "recomputes Agency.outstanding_balance_cents"]

  - method: POST
    path: "/livescan/invoices/{id}/payments"
    description: "record a payment against an invoice"
    roles: [VendorAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["moves the invoice to PAID and its assessments to PAID", "recomputes Agency.max_aging_days and billing_status, which can lift a suspension"]

  # ---- Operations ----------------------------------------------------------
  - method: POST
    path: "/livescan/_ops/aging-run"
    description: "nightly batch: age invoices, accrue late fees, recompute agency posture, lapse expired rap-back subscriptions and auto-deny stale purge requests"
    roles: [VendorAdmin]
    code: 200
    input: ["write_off_over_days?"]
    output: "{ invoices_aged: integer, agencies_suspended: integer, subscriptions_lapsed: integer, purges_auto_denied: integer }"
    side_effects: ["applies calculations.invoice_aging_days, calculations.invoice_late_fee_accrual and calculations.agency_delinquency_posture", "moves RENEWAL_DUE subscriptions past term_end to LAPSED", "moves PURGE_REQUESTED submissions past PURGE_DECISION_WINDOW_DAYS to PURGE_DENIED"]

  - method: POST
    path: "/livescan/_clock/set_current_utc"
    description: "set the server's logical clock; before any call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time"
    roles: [VendorAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent window, expiry and aging computation uses this instant"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 38 codes, each reachable from at least one endpoint
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed for this endpoint in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing or mistyped body field, out-of-range number, window_end not after window_start, MOBILE_EVENT fields supplied on a FIXED site or missing on a MOBILE_EVENT site, or a payment amount that does not equal the outstanding balance exactly"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "a value outside the declared members of one of the enum request fields exhaustively listed in validations[priority=6]"
  - id: ERR_CARD_NOT_FOUND
    http: 404
    condition: "the FingerprintCard named in the path does not exist"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "the Submission named in the path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "any other referenced row does not exist, whether named in the path or in a request body foreign key"
  - id: ERR_AGENCY_BILLING_SUSPENDED
    http: 403
    condition: "the owning Agency has billing_status SUSPENDED and the endpoint is in the frozen write set of validations[priority=6..7]"
  - id: ERR_ORI_AUTHORITY_SUSPENDED
    http: 409
    condition: "the ORI the operation transmits under has authority_status SUSPENDED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_card_version, expected_submission_version or expected_agency_version does not match the parent's current version"
  - id: ERR_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "the appointment is not in a state this operation is declared from, or its reschedule budget is exhausted"
  - id: ERR_CARD_STATE_INVALID
    http: 409
    condition: "the fingerprint card is not in a state this operation is declared from, including any write against a SUPERSEDED card"
  - id: ERR_RECORD_STATE_INVALID
    http: 409
    condition: "a Submission, ChrResponse, FitnessDetermination, RapbackSubscription, RapbackNotification, DeviceAssignment, FeeAssessment or Invoice is not in a state this operation is declared from — including renewing a LAPSED subscription"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the recorded first actor for an override, a challenge resolution or a purge decision"
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "the candidate appointment interval would push concurrent load past concurrent_capacity, or past walkin_usable_capacity for a WALK_IN"
  - id: ERR_RESCHEDULE_WINDOW_CLOSED
    http: 422
    condition: "the reschedule is attempted later than 24 hours before scheduled_start"
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 422
    condition: "check-in is attempted more than 30 minutes early or more than 10 minutes late"
  - id: ERR_IDENTITY_DOCUMENT_EXPIRED
    http: 422
    condition: "the applicant's identity document expired before the logical-clock date"
  - id: ERR_REQUIRED_DOCUMENT_MISSING
    http: 422
    condition: "the presented identity document type is not accepted for the service type, or the presented document set does not cover required_document_codes"
  - id: ERR_POSITION_ALREADY_CLOSED
    http: 409
    condition: "an attempt or exception is posted against a position already PASSED or EXCEPTION_CODED"
  - id: ERR_POSITION_ATTEMPT_CEILING_REACHED
    http: 409
    condition: "an attempt is posted against a position that already recorded POSITION_ATTEMPT_CEILING (3) attempts"
  - id: ERR_EXCEPTION_LIMIT_EXCEEDED
    http: 422
    condition: "exception-coding would push the card past EXCEPTION_POSITION_HARD_MAX (4), or finalize is attempted with more than EXCEPTION_POSITION_MAX (2) exceptions and no supervisor override"
  - id: ERR_CARD_NOT_SUBMITTABLE
    http: 409
    condition: "finalize is attempted with an open position or with mean_quality_score below CARD_MEAN_QUALITY_MIN (65)"
  - id: ERR_DEVICE_CALIBRATION_EXPIRED
    http: 409
    condition: "a capture is attempted on a device whose calibration_expires_at has passed"
  - id: ERR_DEVICE_ASSIGNMENT_CONFLICT
    http: 409
    condition: "a roster window collides with another window of the same device inside the 30-minute buffer, or a capture at a MOBILE_EVENT site runs on a device with no SCHEDULED or ACTIVE assignment covering the clock"
  - id: ERR_DESTINATION_NOT_AUTHORIZED
    http: 422
    condition: "a destination result is posted for a destination that is not in Submission.destinations"
  - id: ERR_RETENTION_NOT_PERMITTED
    http: 422
    condition: "retention_requested is true while Ori.retention_permitted or ServiceType.retention_offered is false"
  - id: ERR_RETENTION_IMMUTABLE
    http: 409
    condition: "a reprint card is transmitted with a retention_requested value that differs from its original submission's election"
  - id: ERR_REPRINT_NOT_ENTITLED
    http: 422
    condition: "a reprint is authorized for a submission with no destination in REJECTED_TECHNICAL or REJECTED_ADMIN"
  - id: ERR_REPRINT_LIMIT_REACHED
    http: 409
    condition: "reprint_count already equals REPRINT_MAX_PER_SUBMISSION (3)"
  - id: ERR_DISSEMINATION_NOT_ENTITLED
    http: 403
    condition: "include_detail is requested by a role or for a dissemination tier that is not entitled to the full criminal-history detail"
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 422
    condition: "a challenge is filed more than CHALLENGE_FILING_WINDOW_DAYS (21) days after issuance"
  - id: ERR_CHALLENGE_LIMIT_REACHED
    http: 409
    condition: "challenge_count already equals CHALLENGE_MAX_CYCLES (2)"
  - id: ERR_RAPBACK_NOT_AUTHORIZED
    http: 403
    condition: "the submission's ORI has rapback_authority false"
  - id: ERR_RAPBACK_REQUIRES_RETENTION
    http: 409
    condition: "a subscription is attempted for a submission whose retention_status is NOT_REQUESTED or PURGED"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "renewal is attempted while the subscription is still ACTIVE and outside its 60-day renewal window"
  - id: ERR_NOTIFICATION_UNROUTABLE
    http: 409
    condition: "an acknowledgment is attempted for an ORPHANED or VOIDED notification, which has no subscription to route to"
  - id: ERR_PAYER_REGIME_MISMATCH
    http: 422
    condition: "a point-of-service payment is attempted for an assessment whose payer_regime is AGENCY_BILLED or FEE_WAIVED"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# ---------------------------------------------------------------------------
roles:
  - name: VendorAdmin
    description: "vendor operations: agencies, ORIs, service types, sites, devices, invoices, purge decisions, batch runs and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /livescan/agencies"
      - "POST /livescan/oris"
      - "POST /livescan/oris/{id}/authority-status"
      - "POST /livescan/service-types"
      - "POST /livescan/sites"
      - "POST /livescan/sites/{id}/event-reconciliation"
      - "POST /livescan/devices"
      - "POST /livescan/devices/{id}/calibration"
      - "POST /livescan/devices/{id}/calibration-audit"
      - "POST /livescan/submissions/{id}/purge-decisions"
      - "POST /livescan/invoices"
      - "POST /livescan/invoices/{id}/issue"
      - "POST /livescan/invoices/{id}/payments"
      - "POST /livescan/_ops/aging-run"
      - "POST /livescan/_clock/set_current_utc"
    shared_operations:
      - "POST /livescan/device-assignments"
      - "GET on every collection except /livescan/cards/{id}/positions filtering by technician"

  - name: LivescanTechnician
    description: "front-counter operator: check-in, capture, finalize, transmit and point-of-service payment; X-User-ID is the operator badge id recorded on the card"
    identity: "opaque"
    exclusive_operations:
      - "POST /livescan/appointments/{id}/check-in"
      - "POST /livescan/appointments/{id}/no-show"
      - "POST /livescan/cards"
      - "POST /livescan/cards/{id}/positions/{position_code}/attempts"
      - "POST /livescan/cards/{id}/positions/{position_code}/exception"
      - "POST /livescan/cards/{id}/finalize"
      - "POST /livescan/submissions"
    shared_operations:
      - "POST /livescan/applicants"
      - "PATCH /livescan/applicants/{id}"
      - "POST /livescan/appointments"
      - "POST /livescan/appointments/{id}/reschedule"
      - "POST /livescan/appointments/{id}/cancel"
      - "POST /livescan/fee-assessments/{id}/payments"

  - name: SiteSupervisor
    description: "site supervisor: exception overrides, reprint authorizations and device rosters; may never be the technician that captured the card"
    identity: "opaque"
    exclusive_operations:
      - "POST /livescan/cards/{id}/exception-override"
      - "POST /livescan/submissions/{id}/reprints"
      - "POST /livescan/device-assignments/{id}/release"
    shared_operations:
      - "POST /livescan/device-assignments"

  - name: AgencyAdjudicator
    description: "agency staff that adjudicates results, resolves challenges and manages rap-back; X-User-ID is the staff id used for segregation of duties"
    identity: "opaque"
    exclusive_operations:
      - "POST /livescan/fitness-determinations"
      - "POST /livescan/fitness-determinations/{id}/challenge-resolutions"
      - "POST /livescan/rapback-subscriptions"
      - "POST /livescan/rapback-subscriptions/{id}/renew"
      - "POST /livescan/rapback-subscriptions/{id}/cancel"
      - "POST /livescan/rapback-notifications/{id}/acknowledge"
    shared_operations:
      - "POST /livescan/submissions/{id}/purge-requests"
      - "GET /livescan/chr-responses/{id}"

  - name: StateRepository
    description: "the state and federal destinations: posts destination results and delivers rap-back notifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /livescan/submissions/{id}/destination-results"
      - "POST /livescan/rapback-notifications"
    shared_operations:
      - "GET /livescan/submissions/{id}/responses"
      - "GET /livescan/rapback-subscriptions"

  - name: Applicant
    description: "the person being printed; books, reschedules, pays, challenges a determination and may request a purge of their own retained record"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /livescan/fitness-determinations/{id}/challenges"
    shared_operations:
      - "POST /livescan/applicants"
      - "PATCH /livescan/applicants/{id}"
      - "POST /livescan/appointments"
      - "POST /livescan/appointments/{id}/reschedule"
      - "POST /livescan/appointments/{id}/cancel"
      - "POST /livescan/submissions/{id}/purge-requests"
      - "POST /livescan/fee-assessments/{id}/payments"
      - "GET /livescan/chr-responses/{id}"
