            - "PermitDecision.${c_d1_id}.nepa_status == \"PENDING\" and nepa_findings_summary is null"
            - "PermitDecision.${c_d1_id}.authoring_officer_id == \"u_spec_1\" and deciding_officer_id is null"
            - "PermitDecision.${c_d1_id}.adjustment_pct == 0.2 and pre_decision_adjustment_pct is null"
            - "Allotment.${c_a18_id}.version == ${c_a18_ver} + 1 and Allotment.${c_a18_id}.stocking_adjustment_pct is still 0.0"

      - name: corner_decision_finalize_without_rationale_on_ea_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PermitDecision.PROPOSED_to_FINAL
          - validations.priority_11
          - errors.ERR_ENVIRONMENTAL_REVIEW_INCOMPLETE
        distinguishing_aspect: "PROPOSED -> FINAL on a decision whose nepa_level is EA requires a rationale of at least 20 characters: finalizing with no rationale returns HTTP 409 ERR_ENVIRONMENTAL_REVIEW_INCOMPLETE even though nepa_status is already COMPLETE, and the same call with a 63-character rationale succeeds."
        test_recipe:
          setup:
