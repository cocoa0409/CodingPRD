          trigger:
            - call: "POST /lsl/verification-appointments/${appt}/complete"
              payload: { observed_side: "UTILITY", observed_material: "COPPER" }
              as: FieldTechnician
              as_user_id: "${crew}"
              captures: { emitted: $.data.emitted_evidence_item_id, appt_state: $.data.state }
          assert:
            - "${cls_before} == UNKNOWN"
            - "${cert_before} == 0.00"
            - "${inv_before} == CLASSIFIED_PROVISIONAL"
            - "${rep_before} == ELIGIBLE"
            - "${prio_before} == 40.00"
            - "${status_before} == PUBLISHED"
            - "${unknown_before} == 1"
            - "${outstanding_before} == 0"
            - "${appt_state} == COMPLETED"
            - "LINK 1 — ${emitted} is not null and EvidenceItem.${emitted} has origin == APPOINTMENT_CASCADE, source_type == POTHOLE, side == UTILITY, observed_material == COPPER, retracted == false"
            - "LINK 2 — ServiceLine.${l1}.inventory_state == CLASSIFIED_VERIFIED and ServiceLine.${l1}.certainty_basis == FIELD_BASIS"
            - "LINK 2 — ServiceLine.${l1}.utility_side_material == COPPER and ServiceLine.${l1}.customer_side_material == COPPER and ServiceLine.${l1}.classification == NON_LEAD"
            - "LINK 2 — ServiceLine.${l1}.certainty_score == 100.00"
            - "LINK 2 — ServiceLine.${l1}.replacement_state == NOT_REQUIRED and ServiceLine.${l1}.replacement_priority_score == 0.00 (the axis-B ELIGIBLE -> NOT_REQUIRED edge zeroes the score after the recompute)"
            - "LINK 3 — WaterSystem.${ws}.unknown_count == 0, non_lead_count == 1, lead_count == 0, total_service_line_count == 1, unknown_share_pct == 0.00"
            - "LINK 4 — WaterSystem.${ws}.inventory_status == AMENDMENT_PENDING and WaterSystem.${ws}.program_posture == RESTRICTED (without LINK 4 the system would read PUBLISHED / OPEN, since unknown_share_pct and outstanding_notification_count are now both 0)"
            - "VerificationCrew.${crew}.scheduled_appointment_count == 0"

