# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every instance grounds in elements already declared in SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: in_kind_conservative_versus_audited_recognition
        grounds:
          - calculations.in_kind_recognized_valuation
          - calculations.contract_value_rollup
          - entities.Contract.fields.in_kind_recognized_value_cents
          - entities.Contract.fields.total_recognized_value_cents
          - state_machines.Contract.SUBMITTED_to_COUNTERSIGNED
          - state_machines.Contract.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          The trade leg of one Contract is valued twice from identical inputs — CONSERVATIVE
          haircuts 1200000 down to 780000 and then caps it at 776250, while AUDITED caps the
          raw 1200000 at 776250 first and then haircuts it to 504563 — so the same contract's
          in_kind_recognized_value_cents falls by 271687 cents between countersign and close.
        test_recipe:
          setup:
            - "Property 'Metro FC' with seasonality_index 1.20, season 2026-09-01 .. 2026-12-31, inventory target 50000000 cents, status IN_SEASON"
            - "One PUBLISHED rate card carrying a DIGITAL_BOARD line (base 250000, breaks at 10 -> 225000 and 25 -> 200000, exclusivity multiplier 1.25) and a SIGNAGE line"
            - "Contract for sponsor 'Zephyr Cola' with CATEGORY exclusivity, in_kind_declared_value_cents 1200000 of category PRODUCT, one entitlement of 10 DIGITAL_BOARD units, countersigned and then activated"
            - "No bookings exist, so the contract delivers nothing before it is closed"
            - "Logical clock advanced past term_end to 2027-01-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/lines"
              payload: { asset_class: "DIGITAL_BOARD", base_unit_price_cents: 250000, tier_breaks: [{ min_units: 10, unit_price_cents: 225000 }, { min_units: 25, unit_price_cents: 200000 }], exclusivity_multiplier: 1.25 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /rate-cards/${rc_id}/lines"
              payload: { asset_class: "SIGNAGE", base_unit_price_cents: 100000, exclusivity_multiplier: 1.10 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /rate-cards/${rc_id}/publish"
              payload: {}
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "SELLING" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "North LED Ribbon", asset_class: "DIGITAL_BOARD", capacity_units: 6, changeover_buffer_minutes: 30 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { asset_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { sponsor_id: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${sponsor_id}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", exclusivity_scope: "CATEGORY", in_kind_declared_value_cents: 1200000, in_kind_category: "PRODUCT" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/entitlements"
              payload: { inventory_asset_id: "${asset_id}", clause_ref: "4.2(a)", promised_units: 10 }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { ent_id: $.data.id }
            - call: "POST /contracts/${contract_id}/submit"
              payload: {}
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "GET /properties/${prop_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { prop_v: $.data.version }
            - call: "POST /contracts/${contract_id}/countersign"
              payload: { expected_property_version: "${prop_v}" }
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { ik_at_sign: $.data.in_kind_recognized_value_cents, total_at_sign: $.data.total_recognized_value_cents, cash_at_sign: $.data.cash_value_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "IN_SEASON" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractApprover
              as_user_id: "u-approver-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "POST /contracts/${contract_id}/close"
              payload: {}
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { ik_at_close: $.data.in_kind_recognized_value_cents, total_at_close: $.data.total_recognized_value_cents }
          assert:
            - "${cash_at_sign} == 3105000"
            - "${ik_at_sign} == 776250"
            - "${total_at_sign} == 3881250"
            - "${ik_at_close} == 504563"
            - "${total_at_close} == 3609563"
            - "Contract.${contract_id}.cash_value_cents == 3105000 (unchanged by the AUDITED re-valuation)"
            - "Contract.${contract_id}.status == CLOSED"

      - name: renewal_score_survey_weighted_versus_delivery_only
        grounds:
          - calculations.renewal_likelihood_scoring
          - entities.Sponsor.fields.renewal_likelihood_score
          - entities.Sponsor.fields.renewal_band
          - entities.SponsorSurvey.fields.composite_score
          - endpoints[POST /contracts/{id}/surveys]
        distinguishing_aspect: |
          Renewal likelihood is a Sponsor-domain score in points, not a Contract money field —
          the identical closed contract (delivery_factor 40.00, penalty 15.00) scores 51.25 / MEDIUM
          under DELIVERY_ONLY and 72.25 / HIGH the moment one survey exists, because the survey
          composite takes 50% of the weight and delivery drops from 75% to 35%.
        test_recipe:
          setup:
            - "Same property, rate card, asset, sponsor and 10-unit contract as instance in_kind_conservative_versus_audited_recognition, countersigned and activated"
            - "One booking of 4 units on 2026-09-10T18:00Z..21:00Z delivered, so the entitlement is PARTIAL at 40.00 pct"
            - "Contract closed at 2027-01-02T00:00:00Z with makegood_credit_cents 465750, leaving the sponsor scored by the DELIVERY_ONLY variant"
            - "No SponsorSurvey exists yet"
          setup_api_calls:
