      - name: ramped_fill_rate_floor_inclusive_at_the_boundary
        grounds:
          - calculations.fill_rate_shipment_gate
          - calculations.fill_rate_shipment_gate.constants[DUE_DAYS_TOTAL]
          - validations[priority=11]
          - errors[ERR_FILL_RATE_BELOW_FLOOR]
        distinguishing_aspect: |
          A numeric threshold crossing on the shipment metric: at elapsed day 14 the effective floor is
          exactly 0.8500, a cumulative 1699 of 2000 is refused at 0.8495 while a cumulative 1700 is
          admitted at exactly 0.8500 — the comparison is inclusive, so the boundary value passes.
