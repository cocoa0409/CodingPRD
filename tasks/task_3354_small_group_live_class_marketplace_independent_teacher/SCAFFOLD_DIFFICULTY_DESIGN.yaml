  - rule_id: compensating_invariant
    instances:
      - name: teacher_fault_refund_conserves_section_gross
        grounds:
          - calculations.expected_payout_gross_cents
          - calculations.posted_payout_fee_cents
          - state_machines.TeacherPayout.REQUESTED_to_FAILED
          - entities.TeacherPayout.fields.teacher_liability_cents
