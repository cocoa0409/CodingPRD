scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: flex_fee_provisional_vs_final_defer_cycle
        grounds:
          - calculations.flex_fee
          - entities.BillingCycle.fields.fee_provisional_cents
          - entities.BillingCycle.fields.fee_final_cents
          - state_machines.BillingCycle.REMITTED_to_SETTLED
        distinguishing_aspect: |
          Same deferred principal (60000 cents), two valid defer_days inputs: provisional uses
          planned_defer_days=20 -> fee 5600; final uses actual outstanding days=12 -> fee 4160.
          The divergence lives on BillingCycle (fee), a different entity domain than the
          DelinquencyCase payoff dual-variant.
        test_recipe:
          setup:
            - "Clock at 2026-07-01. Property ACTIVE, full_rent 120000. Renter portion 100000, ENROLLED risk_band LOW (limit 150000)."
            - "DEFER cycle: deferred_amount 60000, planned_defer_days 20; remitted (fee_provisional 5600 charged)."
            - "Immediate installment (40000) paid on day 0; deferred installment (60000) paid on day 12 (2026-07-13); outstanding 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada Owner", unit_label: "Maple #1", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_1", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r1@x.com", full_name: "Rey Renter", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "DEFER", split_count: 2, deferred_amount_cents: 60000, planned_defer_days: 20 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id, fee_prov: $.data.fee_provisional_cents }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst_imm: "$.data[0].id", inst_def: "$.data[1].id" }
            - call: "POST /api/installments/${inst_imm}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/installments/${inst_def}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { fee_final: $.data.fee_final_cents }
          assert:
            - "BillingCycle.${cyc_id}.fee_provisional_cents == 5600"
            - "BillingCycle.${cyc_id}.fee_final_cents == 4160"
            - "BillingCycle.${cyc_id}.status == SETTLED"
            - "fee_provisional_cents - fee_final_cents == 1440 (refunded via LedgerEntry FEE_REFUND)"

      - name: delinquency_reinstatement_vs_settlement_payoff
        grounds:
          - calculations.delinquency_payoff
          - entities.DelinquencyCase.fields.reinstatement_amount_cents
          - entities.DelinquencyCase.fields.settlement_amount_cents
          - state_machines.BillingCycle.REMITTED_to_DELINQUENT
        distinguishing_aspect: |
          Same case (principal_outstanding 50000, accrued_late_fee 2500): reinstatement adds the
          full late fee -> 52500; settlement waives it and adds SETTLEMENT_ADMIN_FEE 1500 -> 51500.
          The divergence lives on DelinquencyCase, a different entity domain than the BillingCycle fee.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Property ACTIVE. Renter ENROLLED LOW portion 100000."
            - "SPLIT n=2 cycle (installments 50000 due day0, 50000 due day14) remitted; installment1 paid; installment2 unpaid."
            - "Clock advanced to 2026-07-21 (installment2 6 days overdue); assess-delinquency opens the case with flat late fee 2500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada Owner", unit_label: "Maple #2", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_2", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r2@x.com", full_name: "Rey Two", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/assess-delinquency"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /api/delinquency-cases?cycle_id=${cyc_id} returns one case with principal_outstanding_cents == 50000"
            - "DelinquencyCase.accrued_late_fee_cents == 2500"
            - "DelinquencyCase.reinstatement_amount_cents == 52500"
            - "DelinquencyCase.settlement_amount_cents == 51500"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: installment_rounding_floor_then_remainder
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount_cents
          - entities.Installment.fields.sequence_no
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: portion 100000 over 3 installments must floor equal
          shares (33333) FIRST then hand the single leftover cent to sequence_no 1 -> [33334,33333,33333].
          Rounding each share independently would drop a cent (sum 99999). Order is pinned.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT cycle with split_count 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #3", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_3", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r3@x.com", full_name: "Rey Three", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 3, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 3 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
          assert:
            - "GET /api/billing-cycles/${cyc_id}/installments returns 3 installments"
            - "installment[sequence_no=1].amount_cents == 33334"
            - "installment[sequence_no=2].amount_cents == 33333"
            - "installment[sequence_no=3].amount_cents == 33333"
            - "sum(installment.amount_cents) == 100000"

      - name: underwriting_weighted_tiered_score
        grounds:
          - calculations.underwriting_risk_score
          - entities.Application.fields.risk_score
          - entities.Application.fields.risk_band
          - entities.Application.fields.approved_limit_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: ratio 2.0 (score 70), split 3 (score 70),
          delinquencies 1 (score 60) combine as round(0.5*70+0.2*70+0.3*60)=67 -> MEDIUM band,
          approved_limit = min(100000*2, round(200000*0.5)) = 100000. Tiered sub-scores + weighting.
        test_recipe:
          setup:
            - "Renter portion 100000 exists; application submitted with income 200000, split 3, prior_delinquency 1."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #4", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_4", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r4@x.com", full_name: "Rey Four", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
          trigger:
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 200000, requested_split_count: 3, prior_delinquency_count: 1 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.risk_score == 67"
            - "Application.${app_id}.risk_band == MEDIUM"
            - "Application.${app_id}.approved_limit_cents == 100000"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: installment_retry_cycle_scheduled_failed_scheduled
        grounds:
          - state_machines.Installment.SCHEDULED_to_FAILED
          - state_machines.Installment.FAILED_to_SCHEDULED
          - entities.Installment.fields.attempt_count
        distinguishing_aspect: |
          Installment loops SCHEDULED->FAILED->SCHEDULED->FAILED via /charge(FAIL) then /retry then
          /charge(FAIL); attempt_count reaches 2 while the same installment revisits SCHEDULED. This
          cycle sits on Installment, a different entity than the DelinquencyCase recovery cycle.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle remitted; installment1 SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #5", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_5", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r5@x.com", full_name: "Rey Five", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
          trigger:
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "FAIL" }
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/retry"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "FAIL" }
              as: PlatformAdmin
          assert:
            - "Installment.${inst1}.status == FAILED"
            - "Installment.${inst1}.attempt_count == 2"

      - name: delinquency_recovery_cycle_promise_broken_outreach
        grounds:
          - state_machines.DelinquencyCase.PROMISE_TO_PAY_to_BROKEN_PROMISE
          - state_machines.DelinquencyCase.BROKEN_PROMISE_to_IN_OUTREACH
          - entities.DelinquencyCase.fields.recovery_round
          - entities.DelinquencyCase.fields.accrued_late_fee_cents
        distinguishing_aspect: |
          DelinquencyCase loops IN_OUTREACH->PROMISE_TO_PAY->BROKEN_PROMISE->IN_OUTREACH; the second
          IN_OUTREACH entry bumps recovery_round to 1 and the broken promise adds LATE_FEE_ROUND 1000
          (accrued 2500->3500). This cycle sits on DelinquencyCase, distinct from the Installment loop.
        test_recipe:
          setup:
            - "Delinquent case OPEN at 2026-07-21 (accrued late fee 2500) as in the payoff instance."
            - "Agent A records OUTREACH (IN_OUTREACH) then PROMISE_SET promise_date 2026-07-28; clock advanced to 2026-08-01 (promise broken)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #6", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_6", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r6@x.com", full_name: "Rey Six", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-cycles/${cyc_id}/assess-delinquency"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/delinquency-cases?cycle_id=${cyc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/delinquency-cases/${case_id}/recovery-actions"
              payload: { action_type: "OUTREACH", note: "left voicemail" }
              as: CollectionsAgent
              as_user_id: "agent_a"
            - call: "POST /api/delinquency-cases/${case_id}/recovery-actions"
              payload: { action_type: "PROMISE_SET", promise_date: "2026-07-28T00:00:00Z" }
              as: CollectionsAgent
              as_user_id: "agent_a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/delinquency-cases/${case_id}/assess"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/delinquency-cases/${case_id}/recovery-actions"
              payload: { action_type: "OUTREACH", note: "round 2" }
              as: CollectionsAgent
              as_user_id: "agent_a"
          assert:
            - "DelinquencyCase.${case_id}.status == IN_OUTREACH"
            - "DelinquencyCase.${case_id}.recovery_round == 1"
            - "DelinquencyCase.${case_id}.accrued_late_fee_cents == 3500"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assess_delinquency_cascade_cycle_case_ledger_reminder
        grounds:
          - state_machines.BillingCycle.REMITTED_to_DELINQUENT
          - entities.DelinquencyCase.fields.accrued_late_fee_cents
          - entities.LedgerEntry.fields.entry_type
          - entities.Reminder.fields.kind
        distinguishing_aspect: |
          Depth-3 chain from ONE assess-delinquency call: (1) cycle REMITTED->DELINQUENT, which causes
          (2) a DelinquencyCase(OPEN) to be created, whose opening causes (3) a LedgerEntry(LATE_FEE,+2500)
          and an OVERDUE Reminder. Each hop is caused by the previous, not by the original call.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle remitted; NO installments paid."
            - "Clock advanced to 2026-07-21 (installment1 20 days overdue, installment2 6 days overdue)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #7", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_7", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r7@x.com", full_name: "Rey Seven", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/assess-delinquency"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BillingCycle.${cyc_id}.status == DELINQUENT"
            - "GET /api/delinquency-cases?cycle_id=${cyc_id} returns one case with status OPEN and accrued_late_fee_cents == 2500"
            - "GET /api/billing-cycles/${cyc_id}/ledger contains an entry entry_type == LATE_FEE with amount_cents == 2500"
            - "GET /api/billing-cycles/${cyc_id}/reminders contains an entry kind == OVERDUE"

      - name: application_approval_cascade_renter_mandate
        grounds:
          - state_machines.Application.SUBMITTED_to_APPROVED
          - entities.Renter.fields.status
          - entities.Renter.fields.approved_limit_cents
          - entities.AutopayMandate.fields.status
        distinguishing_aspect: |
          Depth-2 chain from ONE decision(APPROVE) call: (1) Application->APPROVED cascades Renter.status
          ->ENROLLED with approved_limit 150000 and risk_band LOW, which in turn causes (2) an
          AutopayMandate(PAUSED) to be minted for that renter. Different trigger than assess-delinquency.
        test_recipe:
          setup:
            - "Property ACTIVE; Renter PROSPECT portion 100000; Application SUBMITTED (income 300000, split 2, no prior delinquency, risk LOW)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #8", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_8", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r8@x.com", full_name: "Rey Eight", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          assert:
            - "Renter.${renter_id}.status == ENROLLED"
            - "Renter.${renter_id}.approved_limit_cents == 150000"
            - "Renter.${renter_id}.risk_band == LOW"
            - "GET /api/renters/${renter_id}/autopay-mandate returns exactly one mandate with status == PAUSED"

  # =================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_create_referential_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - errors[ERR_RENTER_NOT_ENROLLED]
          - errors[ERR_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          On cycle creation a SUSPENDED (declined) renter has approved_limit 0, so BOTH the
          business_referential check (Renter not ENROLLED, priority 9) and the business_fiscal
          check (portion 100000 > limit 0, priority 18) fail; priority 9 wins ->
          ERR_RENTER_NOT_ENROLLED. Category pair: business_referential vs business_fiscal.
        test_recipe:
          setup:
            - "Property ACTIVE; Renter portion 100000; Application DECLINED (income 120000, split 4, prior_delinquency 2 -> score 19, ratio 1.2) leaving Renter SUSPENDED with approved_limit 0."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #9", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_9", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r9@x.com", full_name: "Rey Nine", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 120000, requested_split_count: 4, prior_delinquency_count: 2 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "DECLINE" }
              as: Underwriter
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_RENTER_NOT_ENROLLED (priority 9, not ERR_LIMIT_EXCEEDED priority 18)"

      - name: chargeoff_sod_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_RECOVERY_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: |
          A charge-off by a CollectionsManager whose X-User-ID equals case.last_recovery_agent_id
          (SoD, priority 8) attempted before opened_at+RECOVERY_MIN_DAYS (temporal, priority 14) fails
          BOTH; priority 8 wins -> ERR_SOD_VIOLATION. Category pair: business_safety vs business_temporal.
        test_recipe:
          setup:
            - "Delinquent case OPEN at 2026-07-21; agent_x records OUTREACH (case IN_OUTREACH, last_recovery_agent_id=agent_x); clock left at 2026-07-21 (well before +30 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #10", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_10", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r10@x.com", full_name: "Rey Ten", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-cycles/${cyc_id}/assess-delinquency"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/delinquency-cases?cycle_id=${cyc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/delinquency-cases/${case_id}/recovery-actions"
              payload: { action_type: "OUTREACH", note: "first contact" }
              as: CollectionsAgent
              as_user_id: "agent_x"
          trigger:
            - call: "POST /api/delinquency-cases/${case_id}/charge-off"
              payload: {}
