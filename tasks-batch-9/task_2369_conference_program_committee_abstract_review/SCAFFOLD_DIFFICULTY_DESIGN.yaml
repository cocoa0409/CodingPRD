  - rule_id: cross_entity_state_dependency
    instances:

      - name: abstract_confirmation_depends_on_author_registration_state
        grounds:
          - state_machines.Abstract.ACCEPTED_to_CONFIRMED
          - validations[priority=20]
          - entities.Author.fields.is_registered
          - entities.Author.fields.registered_at
        distinguishing_aspect: |
          The Abstract transition ACCEPTED -> CONFIRMED is gated on a field of a
          DIFFERENT entity: Author.is_registered. The identical request fails with
          ERR_AUTHOR_NOT_REGISTERED (422) before registration and succeeds
          afterwards, with nothing about the abstract itself changing in between.
