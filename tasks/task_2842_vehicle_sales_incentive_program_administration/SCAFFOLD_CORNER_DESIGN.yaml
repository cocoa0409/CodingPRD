              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { edge_a: $.data.program_a_id, edge_b: $.data.program_b_id, edge_mode: $.data.mode, edge_cap: $.data.cap_amount_cents }
            - call: "GET /incentives/programs/${g1}/stackability-constraints"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { from_a_mode: "$.data[0].mode" }
            - call: "GET /incentives/programs/${g2}/stackability-constraints"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { from_b_mode: "$.data[0].mode", from_b_a_id: "$.data[0].program_a_id" }
            - call: "POST /incentives/programs/${g2}/stackability-constraints"
              payload: { program_b_id: "${g1}", mode: "FORBIDDEN" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { dup_err: $.data.error_id }
            - call: "POST /incentives/programs/${g1}/stackability-constraints"
