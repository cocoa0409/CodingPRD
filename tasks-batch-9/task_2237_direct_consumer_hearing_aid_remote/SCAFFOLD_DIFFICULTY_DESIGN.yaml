    - name: cascade_b_red_flag_screening_four_hop_fanout
      grounds:
        - "state_machines.ScreeningSession.SUBMITTED_to_SCORED"
        - "state_machines.Patient.SCREENING_IN_PROGRESS_to_REFERRAL_REQUIRED"
        - "state_machines.DeviceOrder.PENDING_FIT_CONFIRM_to_MEDICAL_HOLD"
        - "state_machines.RemoteFittingSession.SCHEDULED_to_CANCELLED"
        - "calculations.red_flag_referral_trigger"
        - "calculations.provider_daily_capacity"
      distinguishing_aspect: >-
        DEPTH 4 from a COMPLETELY DIFFERENT trigger than CASCADE-A: a single
        screening submit opens a ProviderReferral (hop 1), which is what puts the
        patient's PENDING_FIT_CONFIRM order on MEDICAL_HOLD with
        medical_hold_reason MANDATORY_RED_FLAG (hop 2), which is what cancels the
        SCHEDULED INITIAL_FIT session bound to that order with
        no_show_charged_cents 0 (hop 3), which is what forces the provider capacity
        recompute back to booked_minutes_on_focus_date 0 / utilization_pct 0.0
        (hop 4). payment_status is untouched throughout, proving the fan-out follows
        the fulfillment dimension only.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with referral_validity_days 180 and min_age_years 18."
          - "One TELECARE_FITTER Provider licensed in CA, daily_capacity_minutes 480, buffer_minutes 10."
          - "Patient age 65 places an order FIRST (fulfillment_status PENDING_FIT_CONFIRM, payment_status PENDING_AUTH) and only then starts a screening, so the cascade has something to hit."
          - "A SCHEDULED INITIAL_FIT session for 2026-08-10T10:00:00Z-11:00:00Z (duration_minutes 60) is bound to that order, leaving the provider at booked_minutes_on_focus_date 60 and utilization_pct 12.5 before the trigger."
          - "The screening is PATCHed with symptom_codes ['VERTIGO'], pure_tone_avg_db 45.0 and asymmetry_db 5.0 so exactly one MANDATORY_REFERRAL finding (code VERTIGO, weight 0.0) is emitted and no advisory findings."
