scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_entity_creation_season_episode_cluster
        claim_type: Creation
        grounds:
          - endpoints["POST /seasons"]
          - endpoints["POST /episodes"]
          - endpoints["POST /capacity-clusters"]
          - entities.Season
        distinguishing_aspect: |
          Creation with every required field returns 201 and echoes each stored input verbatim
          alongside the seeded enum defaults (Season PLANNED/HEALTHY/ON_TRACK, Episode DRAFT,
          CapacityCluster ACTIVE with reserved_ccu 0).
        test_recipe:
          setup:
            - "Clock at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000, maintenance_buffer_minutes: 30 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
          assert:
            - "POST /seasons returns HTTP 201"
            - "Season.${season_id}.code == S7"
            - "Season.${season_id}.status == PLANNED"
            - "Season.${season_id}.economy_health == HEALTHY"
            - "Season.${season_id}.content_posture == ON_TRACK"
            - "Season.${season_id}.version == 1"
            - "POST /episodes returns HTTP 201"
            - "Episode.${ep1_id}.status == DRAFT"
            - "Episode.${ep1_id}.rollback_count == 0"
            - "POST /capacity-clusters returns HTTP 201"
            - "CapacityCluster.${cluster_id}.status == ACTIVE"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 0"

      - name: corner_entity_retrieval_offer_matches_stored_state
        claim_type: Retrieval
        grounds:
          - endpoints["GET /offers/{offer_id}"]
          - entities.Offer.fields.fairness_index_bp
        distinguishing_aspect: |
          GET /offers/{offer_id} returns the same field values that the create response reported,
          including both status dimensions and the derived fairness index, with no recomputation
          drift between the two reads.
        test_recipe:
            setup:
              - "Clock at 2026-08-01T00:00:00Z; season S7 exists in PLANNED."
              - "Offer AUG_BUNDLE authored with two line items (499 + 1299 = 1798)."
            setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { to_iso8601: "2026-08-01T00:00:00Z" }
                as: LiveOpsCommander
              - call: "POST /seasons"
                payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
                as: ContentProducer
                captures: { season_id: $.data.id }
              - call: "POST /offers"
                payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "AUG_BUNDLE", price_tier: "T3", list_price_minor: 1798, line_items: [{ sku: "COIN_PACK", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "EVENT_TOKEN", granted_amount_minor: 600 }, { sku: "SKIN_A", base_price_minor: 1299, declared_value_minor: 1700, granted_currency_code: "EVENT_TOKEN", granted_amount_minor: 600 }], personalization_discount_bp: 1500, minor_purchasable: false, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
                as: EconomyDesigner
                as_user_id: "u_designer_1"
                captures: { bundle_id: $.data.id }
            trigger:
              - call: "GET /offers/${bundle_id}"
                payload: {}
                as: EconomyDesigner
                as_user_id: "u_designer_1"
            assert:
              - "GET returns HTTP 200"
              - "Offer.${bundle_id}.sku == AUG_BUNDLE"
              - "Offer.${bundle_id}.approval_status == DRAFT"
              - "Offer.${bundle_id}.availability_status == OFFLINE"
              - "Offer.${bundle_id}.fairness_index_bp == 13048"
              - "Offer.${bundle_id}.disclosure_state == NOT_REQUIRED"
              - "Offer.${bundle_id}.units_sold == 0"
              - "Offer.${bundle_id}.version == 1"

      - name: corner_entity_listing_offers_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints["GET /offers"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          A three-offer season listed with limit 2 and offset 0 returns exactly 2 rows with
          total_count 3 and has_more true, and offset 2 returns the final row with has_more
          false; the season_id filter and the offer_type filter narrow the same collection.
        test_recipe:
          setup:
            - "Season S7 holds three DRAFT offers: PACK_A and PACK_B (BUNDLE) and CRATE_A (LOOT_BOX)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "PACK_A", price_tier: "T1", list_price_minor: 499, line_items: [{ sku: "COIN_PACK_A", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "SOFT_COIN", granted_amount_minor: 700 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "PACK_B", price_tier: "T1", list_price_minor: 499, line_items: [{ sku: "COIN_PACK_B", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "SOFT_COIN", granted_amount_minor: 700 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX", sku: "CRATE_A", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "CRATE_KEY", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          trigger:
            - call: "GET /offers"
              payload: { season_id: "${season_id}", limit: 2, offset: 0 }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "GET /offers"
              payload: { season_id: "${season_id}", limit: 2, offset: 2 }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "GET /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          assert:
            - "first page returns 2 items with total_count 3 and has_more true"
            - "first page reports limit 2 and offset 0"
            - "second page returns 1 item with total_count 3 and has_more false"
            - "LOOT_BOX filter returns 1 item with total_count 1 and has_more false"
            - "LOOT_BOX filter response data[0].sku == CRATE_A"
            - "unpaginated LOOT_BOX read applies the default limit 10 and offset 0"

      - name: corner_entity_not_found_codes_per_collection
        claim_type: Not Found
        grounds:
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_PURCHASE_NOT_FOUND]
          - errors[ERR_MONITORING_RUN_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          Each collection maps an unresolvable path id to its own 404 code — a syntactically
          valid but unknown id on /seasons, /offers, /purchases and /monitoring-runs returns
          ERR_SEASON_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_PURCHASE_NOT_FOUND and
          ERR_MONITORING_RUN_NOT_FOUND respectively, never a generic 404.
        test_recipe:
          setup:
            - "An empty database apart from the logical clock; no entity of any type exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "GET /seasons/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: LiveOpsCommander
              captures: { season_404: $.data.error_id }
            - call: "GET /offers/00000000-0000-0000-0000-0000000000bb"
              payload: {}
              as: LiveOpsCommander
              captures: { offer_404: $.data.error_id }
            - call: "GET /purchases/00000000-0000-0000-0000-0000000000cc"
              payload: {}
              as: LiveOpsCommander
              captures: { purchase_404: $.data.error_id }
            - call: "GET /monitoring-runs/00000000-0000-0000-0000-0000000000dd"
              payload: {}
              as: LiveOpsCommander
              captures: { run_404: $.data.error_id }
          assert:
            - "${season_404} == ERR_SEASON_NOT_FOUND with HTTP 404"
            - "${offer_404} == ERR_OFFER_NOT_FOUND with HTTP 404"
            - "${purchase_404} == ERR_PURCHASE_NOT_FOUND with HTTP 404"
            - "${run_404} == ERR_MONITORING_RUN_NOT_FOUND with HTTP 404"
            - "every 404 body carries the error envelope keys error_id and message"

      - name: corner_entity_required_fields_missing_rejected
        claim_type: Required Fields
        grounds:
          - endpoints["POST /seasons"]
          - endpoints["POST /offers"]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: |
          Omitting a non-optional input key (Season.target_xp_total, Offer.line_items) yields
          ERR_INVALID_REQUEST (400) and creates nothing, while every key marked optional in the
          same endpoint contract may be omitted freely.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 exists so the offer body's season_id resolves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /seasons"
              payload: { code: "S8", title: "Season 8", starts_at: "2026-11-01T00:00:00Z", ends_at: "2027-01-30T00:00:00Z", planned_episode_count: 6, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { missing_required_err: $.data.error_id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "NO_LINES", price_tier: "T1", list_price_minor: 499, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { missing_lines_err: $.data.error_id }
          assert:
            - "${missing_required_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "${missing_lines_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "no Season with code S8 exists after the rejected call"
            - "no Offer with sku NO_LINES exists after the rejected call"

      - name: corner_entity_defaults_applied_when_optionals_omitted
        claim_type: Defaults
        grounds:
          - entities.CapacityCluster.fields.maintenance_buffer_minutes
          - entities.Offer.fields.personalization_discount_bp
          - entities.Offer.fields.minor_purchasable
          - entities.Player.fields.is_minor
          - entities.BalanceChange.fields.canary_cohort_pct
        distinguishing_aspect: |
          Every optional input key falls back to its declared default in one sweep:
          maintenance_buffer_minutes 30, personalization_discount_bp 0, minor_purchasable false,
          is_minor false, guardian_verified false and canary_cohort_pct 5.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 exists in PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /capacity-clusters"
              payload: { name: "EU-1", region_code: "EU", ccu_capacity: 8000 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "PACK_A", price_tier: "T1", list_price_minor: 499, line_items: [{ sku: "COIN_PACK_A", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "SOFT_COIN", granted_amount_minor: 700 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /players"
              payload: { handle: "tide_default", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { player_id: $.data.id }
            - call: "POST /balance-changes"
              payload: { season_id: "${season_id}", target_kind: "DROP_RATE", delta_bp: -250, rationale: "Drop rate is 3 percent above target" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { bc_id: $.data.id }
          assert:
            - "CapacityCluster.${cluster_id}.maintenance_buffer_minutes == 30"
            - "Offer.${offer_id}.personalization_discount_bp == 0"
            - "Offer.${offer_id}.minor_purchasable == false"
            - "Player.${player_id}.is_minor == false"
            - "Player.${player_id}.guardian_verified == false"
            - "Player.${player_id}.spend_state == UNRESTRICTED"
            - "Player.${player_id}.pacing_bp_realized == 10000"
            - "Player.${player_id}.retention_band == HEALTHY"
            - "BalanceChange.${bc_id}.canary_cohort_pct == 5"
            - "BalanceChange.${bc_id}.comms_state == MISSING"
            - "Season.${season_id}.lifetime_ratio_bp == 10000"
            - "Season.${season_id}.effective_sink_rate_bp == 10000"

      - name: corner_entity_computed_fields_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.Offer.fields.fairness_index_bp
          - entities.ProbabilityDisclosure.fields.total_probability_bp
          - entities.ProbabilityDisclosure.fields.expected_value_minor
          - calculations.offer_fairness_index_bp
        distinguishing_aspect: |
          fairness_index_bp, total_probability_bp and expected_value_minor appear in no endpoint
          input contract, so they can only originate from the formulas: the disclosure created
          here reports total_probability_bp 10000 and expected_value_minor 470 from its entries
          alone.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 exists; LOOT_BOX offer CRATE_A (list 300, declared 400) authored."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX", sku: "CRATE_A", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "CRATE_KEY", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { crate_id: $.data.id }
          trigger:
            - call: "POST /offers/${crate_id}/disclosures"
              payload: { entries: [{ item_sku: "C_COMMON", probability_bp: 8500, item_value_minor: 200, is_rare: false }, { item_sku: "C_RARE", probability_bp: 1400, item_value_minor: 1500, is_rare: false }, { item_sku: "C_MYTHIC", probability_bp: 100, item_value_minor: 9000, is_rare: true }] }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { disc_id: $.data.id }
          assert:
            - "ProbabilityDisclosure.${disc_id}.total_probability_bp == 10000"
            - "ProbabilityDisclosure.${disc_id}.expected_value_minor == 470"
            - "ProbabilityDisclosure.${disc_id}.status == DRAFT"
            - "ProbabilityDisclosure.${disc_id}.published_at == null"
            - "Offer.${crate_id}.fairness_index_bp == 13333"
            - "Offer.${crate_id}.disclosure_state == REQUIRED_MISSING"

      - name: corner_entity_system_fields_generated_by_server
        claim_type: System Fields
        grounds:
          - entities.Season.fields.created_at
          - entities.Offer.fields.created_by_user_id
          - entities.EconomyLedgerEntry.fields.occurred_at
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          id, created_at, updated_at and version are absent from every input contract and are
          issued by the server; created_at and EconomyLedgerEntry.occurred_at both read the
          logical clock (set here to 2026-08-04T00:00:00Z, not real wall time), and
          Offer.created_by_user_id is taken from the acting X-User-ID rather than the body.
        test_recipe:
          setup:
            - "Logical clock moved to 2026-08-04T00:00:00Z before any entity is created."
            - "Player p1 with a SOFT_COIN account receives one operator faucet of 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "PACK_A", price_tier: "T1", list_price_minor: 499, line_items: [{ sku: "COIN_PACK_A", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "SOFT_COIN", granted_amount_minor: 700 }], window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-14T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /currency-accounts/${p1_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 1000, source_kind: "EVENT_REWARD" }
              as: LiveOpsCommander
            - call: "GET /ledger-entries"
              payload: { currency_account_id: "${p1_soft_id}" }
              as: LiveOpsCommander
              captures: { entry_id: "$.data[0].id" }
          assert:
            - "Offer.${offer_id}.id is server-issued and non-empty"
            - "Offer.${offer_id}.created_at == 2026-08-04T00:00:00Z"
            - "Offer.${offer_id}.updated_at == 2026-08-04T00:00:00Z"
            - "Offer.${offer_id}.version == 1"
            - "Offer.${offer_id}.created_by_user_id == u_designer_1"
            - "Offer.${offer_id}.reviewed_by_user_id == null"
            - "EconomyLedgerEntry.${entry_id}.occurred_at == 2026-08-04T00:00:00Z"
            - "EconomyLedgerEntry.${entry_id}.season_id == ${season_id}"

      - name: corner_entity_type_constraints_enums_ranges_windows
        claim_type: Type Constraints
        grounds:
          - entities.Player.fields.region_code
          - entities.Offer.fields.personalization_discount_bp
          - entities.BalanceChange.fields.delta_bp
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Four distinct schema constraints all collapse onto ERR_INVALID_REQUEST (400): an
          unknown enum member (region_code MENA), an out-of-range integer
          (personalization_discount_bp 2500 above the 2000 ceiling), a zero delta_bp, and a
          non-positive window (window_end == window_start).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 exists in PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /players"
              payload: { handle: "tide_bad_region", region_code: "MENA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { enum_err: $.data.error_id }
            - call: "POST /offers"
