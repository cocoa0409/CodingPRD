# =============================================================================
# SCAFFOLD: Private Wireless Network Deployment & Spectrum Coordination
# (Verizon Business) — max-difficulty expert scaffold
# =============================================================================

scenario: |
  Private Wireless Network Deployment & Spectrum Coordination (Verizon Business): site survey and radio frequency design for a campus, factory or venue with coverage and capacity targets, spectrum selection across licensed, shared and unlicensed bands with coordination and registration requirements, device and subscriber identity module provisioning for enterprise-owned equipment, network slicing and quality of service policy for critical applications, integration with the enterprise network, security policy and identity systems, edge compute placement for latency-sensitive workloads, service level agreements, monitoring and on-site support arrangements, expansion and coverage remediation after operational feedback

domain_name: private-wireless-deployment
api_prefix: /private-wireless

complexity_profile:
  primary_archetype: compliance_audit        # spectrum coordination, SAS registration, segregation of duties
  secondary_archetype: quota_allocation      # finite spectrum pool, device/SIM pools, cell capacity
  complexity_layers:
    - optimistic_concurrency                 # OCC on Site.version for design edits; on SpectrumCoordinationRequest for approval
    - cascading_side_effects                 # remediate → re-survey → redesign → re-coordinate spectrum
    - dual_variant_calculation               # provisional vs final capacity estimate; optimistic vs conservative interference budget
    - derived_field_reconciliation           # Site.spectrum_utilization, CoverageDesign.capacity_shortfall, SLA health
    - rate_threshold_triggers                # SLA breach thresholds, interference margin breakpoints
    - scheduled_actions                      # SAS registration renewals, spectrum lease expirations
    - soft_delete                            # decommissioned devices/cells remain queryable

  entity_topology: hybrid                    # Site → CellSector → Device tree; SpectrumLease / ServiceContract flat peers cross-referencing
  state_machine_shape: compound              # posture-driven Site + branching CoordinationRequest + cyclic Remediation

  relationship_patterns:
    - one_to_many                            # Site→CellSector, CellSector→Device
    - many_to_many                           # NetworkSlice ↔ Device (via SliceBinding); Site ↔ ServiceContract (via SiteSLA)
    - cross_aggregate                        # CoverageDesign references SpectrumLease across aggregates
    - self_referential                       # CoverageRemediation.supersedes_remediation_id forms a chain

  role_model: segregation_of_duties          # RFEngineer designs, SpectrumCoordinator requests, Regulator approves, FieldTechnician activates
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Enterprise
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the enterprise customer" }
      - { name: erp_account_code, type: string, source: input, description: "External billing reference; unique across Enterprises" }
      - { name: industry_vertical, type: enum, source: input, description: "CAMPUS | FACTORY | VENUE | LOGISTICS | ENERGY" }
      - { name: security_posture, type: enum, source: input, default: "STANDARD", description: "STANDARD | ELEVATED | CRITICAL — gates identity and slicing defaults" }
      - { name: status, type: enum, source: system, description: "ONBOARDING → ACTIVE → SUSPENDED → OFFBOARDED" }
      - { name: sla_credit_balance_cents, type: integer, source: computed, default: 0, description: "Running SLA credit balance; debited/credited by MonitoringAlert resolution" }
      - { name: active_site_count, type: integer, source: computed, default: 0, description: "Count of Sites with status ACTIVE" }

  - name: Site
    parent: Enterprise
    common_fields: true
    fields:
      - { name: enterprise_id, type: string, source: system, description: "FK -> Enterprise.id; owning enterprise" }
      - { name: site_code, type: string, source: input, description: "Human site code, unique within Enterprise" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: geo_latitude, type: number, source: input, description: "Site centroid latitude, decimal degrees" }
      - { name: geo_longitude, type: number, source: input, description: "Site centroid longitude, decimal degrees" }
      - { name: site_area_sqm, type: number, source: input, description: "Covered area in square meters" }
      - { name: target_capacity_mbps, type: integer, source: input, description: "Contractual aggregate downlink capacity target (Mbps)" }
      - { name: target_availability_pct, type: number, source: input, description: "Contractual availability percent, e.g. 99.95" }
      - { name: posture, type: enum, source: computed, default: "DORMANT", description: "Derived: DORMANT | DESIGNING | COORDINATING | DEPLOYING | OPERATIONAL | REMEDIATING — gates all child ops" }
      - { name: spectrum_utilization_mhz, type: integer, source: computed, default: 0, description: "Sum of ACTIVE SpectrumAssignment.bandwidth_mhz across all Cells" }
      - { name: device_count, type: integer, source: computed, default: 0, description: "Count of non-decommissioned Devices under this Site" }
      - { name: status, type: enum, source: system, description: "PLANNED → SURVEYED → DESIGNED → COORDINATED → DEPLOYED → OPERATIONAL → REMEDIATION_REQUIRED → DECOMMISSIONED" }

  - name: SiteSurvey
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: surveyor_id, type: string, source: input, description: "FK -> FieldTechnician.id; who performed the survey" }
      - { name: survey_date, type: datetime, source: input, description: "Date of physical survey (ISO8601)" }
      - { name: measured_rsrp_dbm, type: integer, source: input, description: "Median reference signal received power" }
      - { name: measured_sinr_db, type: integer, source: input, description: "Median signal-to-interference-plus-noise ratio" }
      - { name: floor_plan_area_sqm, type: number, source: input, description: "Measured indoor floor area" }
      - { name: building_material_class, type: enum, source: input, description: "OPEN | WOOD | CONCRETE | STEEL | MIXED" }
      - { name: attenuation_factor_db, type: integer, source: computed, description: "Derived from building_material_class: OPEN=3, WOOD=6, CONCRETE=12, STEEL=18, MIXED=10" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → REJECTED → SUPERSEDED" }

  - name: CoverageDesign
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: design_revision, type: integer, source: system, description: "Monotonic integer, increments on each new design for same site" }
      - { name: based_on_survey_id, type: string, source: input, description: "FK -> SiteSurvey.id; must be APPROVED" }
      - { name: predicted_capacity_mbps, type: integer, source: computed, description: "Sum over proposed cells of capacity formula; provisional variant" }
      - { name: final_capacity_mbps, type: integer, source: computed, description: "Computed at ACTIVATED time using final variant; null until then" }
      - { name: capacity_shortfall_mbps, type: integer, source: computed, description: "max(0, Site.target_capacity_mbps - predicted_capacity_mbps)" }
      - { name: required_cell_count, type: integer, source: computed, description: "ceil(site_area_sqm / CELL_COVERAGE_SQM) adjusted by attenuation_factor_db" }
      - { name: edge_compute_required, type: boolean, source: input, description: "True if any latency-critical application present" }
      - { name: edge_compute_placement, type: enum, source: input, default: "NONE", description: "NONE | ON_PREMISE | NEAR_EDGE | FAR_EDGE" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → REJECTED → SUPERSEDED" }

  - name: CellSector
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: sector_label, type: string, source: input, description: "e.g. NE-A, SW-B; unique within Site" }
      - { name: azimuth_degrees, type: integer, source: input, description: "Antenna azimuth 0..359" }
      - { name: height_m, type: number, source: input, description: "Antenna height above ground" }
      - { name: max_eirp_dbm, type: integer, source: input, description: "Maximum permitted EIRP" }
      - { name: cell_radius_m, type: integer, source: computed, description: "Derived from height_m and max_eirp_dbm via propagation model" }
      - { name: interference_margin_db, type: integer, source: computed, default: 6, description: "Reserved margin against co-channel neighbors; optimistic variant 6dB, conservative 9dB" }
      - { name: status, type: enum, source: system, description: "PLANNED → CONFIGURED → ON_AIR → DEGRADED → OFF_AIR → DECOMMISSIONED" }

  - name: SpectrumLease
    parent: Enterprise
    common_fields: true
    fields:
      - { name: enterprise_id, type: string, source: system, description: "FK -> Enterprise.id" }
      - { name: band_class, type: enum, source: input, description: "LICENSED_C_BAND | SHARED_CBRS | UNLICENSED_5GHZ | UNLICENSED_6GHZ" }
      - { name: center_frequency_mhz, type: number, source: input, description: "Center frequency" }
      - { name: bandwidth_mhz, type: integer, source: input, description: "Total leased bandwidth" }
      - { name: lease_start_utc, type: datetime, source: input, description: "Inclusive start of lease window" }
      - { name: lease_end_utc, type: datetime, source: input, description: "Exclusive end of lease window; must be > start" }
      - { name: priority_access_tier, type: enum, source: input, default: "GAA", description: "PAL | GAA — only for SHARED_CBRS; PAL = priority access license" }
      - { name: monthly_cost_cents, type: integer, source: input, description: "Cost per month of lease" }
      - { name: status, type: enum, source: system, description: "PENDING → ACTIVE → SUSPENDED → EXPIRED → CANCELLED" }

  - name: SpectrumCoordinationRequest
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: requesting_coordinator_id, type: string, source: input, description: "FK -> SpectrumCoordinator.id; who filed the request" }
      - { name: band_class, type: enum, source: input, description: "LICENSED_C_BAND | SHARED_CBRS | UNLICENSED_5GHZ | UNLICENSED_6GHZ" }
      - { name: requested_bandwidth_mhz, type: integer, source: input, description: "Amount of spectrum needed" }
      - { name: requested_start_utc, type: datetime, source: input, description: "Start of coordination window" }
      - { name: requested_end_utc, type: datetime, source: input, description: "End of coordination window" }
      - { name: sas_registration_id, type: string, source: computed, description: "Returned by SAS upon approval; null until APPROVED" }
      - { name: interference_report, type: object, source: computed, description: "{ aggregate_margin_db, worst_case_margin_db, neighbor_cells_checked }" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → COORDINATING → APPROVED → REGISTERED → REJECTED → WITHDRAWN" }

  - name: SpectrumAssignment
    parent: CellSector
    common_fields: true
    fields:
      - { name: cell_sector_id, type: string, source: system, description: "FK -> CellSector.id" }
      - { name: coordination_request_id, type: string, source: input, description: "FK -> SpectrumCoordinationRequest.id; must be REGISTERED" }
      - { name: spectrum_lease_id, type: string, source: input, description: "FK -> SpectrumLease.id; must be ACTIVE" }
      - { name: assigned_bandwidth_mhz, type: integer, source: input, description: "Portion of lease used by this cell; <= lease.bandwidth_mhz" }
      - { name: assignment_start_utc, type: datetime, source: input, description: "Start of usage window" }
      - { name: assignment_end_utc, type: datetime, source: input, description: "End of usage window" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RELEASED → REVOKED" }

  - name: Device
    parent: CellSector
    common_fields: true
    fields:
      - { name: cell_sector_id, type: string, source: system, description: "FK -> CellSector.id" }
      - { name: site_id, type: string, source: system, description: "FK -> Site.id (denormalized for filtering)" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique globally" }
      - { name: device_type, type: enum, source: input, description: "CPE | SENSOR | HANDSET | AGV | CAMERA | GATEWAY" }
      - { name: imei, type: string, source: input, description: "15-digit IMEI, unique" }
      - { name: sim_profile_id, type: string, source: system, description: "FK -> SIMProfile.id; bound at provisioning time" }
      - { name: provisioned_at_utc, type: datetime, source: computed, description: "Set when SIM bound and device activated" }
      - { name: status, type: enum, source: system, description: "INVENTORY → PROVISIONING → ACTIVE → SUSPENDED → DECOMMISSIONED" }

  - name: SIMProfile
    parent: Enterprise
    common_fields: true
    fields:
      - { name: enterprise_id, type: string, source: system, description: "FK -> Enterprise.id" }
      - { name: iccid, type: string, source: input, description: "19-20 digit ICCID; unique" }
      - { name: imsi, type: string, source: computed, description: "Server-minted 15-digit IMSI; unique" }
      - { name: ki_key_ref, type: string, source: system, description: "Reference into HSM vault; never returned raw" }
      - { name: subscription_profile, type: enum, source: input, default: "STANDARD", description: "STANDARD | IOT_NBIOT | IOT_CATM | PREMIUM_5G" }
      - { name: monthly_quota_mb, type: integer, source: input, default: 10240, description: "Monthly data quota" }
      - { name: status, type: enum, source: system, description: "UNASSIGNED → BOUND → ACTIVE → SUSPENDED → RETIRED" }

  - name: NetworkSlice
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: slice_name, type: string, source: input, description: "Unique within Site" }
      - { name: slice_type, type: enum, source: input, description: "EMBB | URLLC | MMTC" }
      - { name: guaranteed_bandwidth_mbps, type: integer, source: input, description: "Reserved throughput for the slice" }
      - { name: max_latency_ms, type: integer, source: input, description: "SLA latency bound for the slice" }
      - { name: max_devices, type: integer, source: input, description: "Upper bound on concurrently bound devices" }
      - { name: bound_device_count, type: integer, source: computed, default: 0, description: "Current count of Devices bound to this slice" }
      - { name: status, type: enum, source: system, description: "DEFINED → ACTIVATED → SUSPENDED → RETIRED" }

  - name: SliceBinding
    parent: NetworkSlice
    common_fields: false
    fields:
      - { name: slice_id, type: string, source: system, description: "FK -> NetworkSlice.id" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id" }
      - { name: bound_at_utc, type: datetime, source: system, description: "Bind timestamp" }
      - { name: unbound_at_utc, type: datetime, source: computed, description: "Set when binding torn down; null while active" }

  - name: ServiceContract
    parent: Enterprise
    common_fields: true
    fields:
      - { name: enterprise_id, type: string, source: system, description: "FK -> Enterprise.id" }
      - { name: contract_code, type: string, source: input, description: "Unique contract identifier" }
      - { name: sla_tier, type: enum, source: input, description: "STANDARD | ENHANCED | MISSION_CRITICAL" }
      - { name: contracted_availability_pct, type: number, source: input, description: "e.g. 99.9, 99.95, 99.99" }
      - { name: contracted_max_outage_minutes_per_month, type: integer, source: input, description: "Max outage minutes per calendar month" }
      - { name: onsite_support_window, type: enum, source: input, description: "NEXT_BUSINESS_DAY | FOUR_HOUR | TWO_HOUR" }
      - { name: contract_start_utc, type: datetime, source: input, description: "Inclusive" }
      - { name: contract_end_utc, type: datetime, source: input, description: "Exclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → BREACHED → RENEWED → TERMINATED" }

  - name: MonitoringAlert
    parent: Site
    common_fields: false
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: alert_class, type: enum, source: input, description: "OUTAGE | DEGRADATION | INTERFERENCE | CAPACITY | SECURITY" }
      - { name: severity, type: enum, source: input, description: "INFO | MINOR | MAJOR | CRITICAL" }
      - { name: raised_at_utc, type: datetime, source: system, description: "Timestamp when alert fired" }
      - { name: resolved_at_utc, type: datetime, source: computed, description: "Set on resolution; null while open" }
      - { name: sla_credit_applied_cents, type: integer, source: computed, default: 0, description: "Credit applied to Enterprise SLA balance on resolution if breach" }
      - { name: status, type: enum, source: system, description: "OPEN → ACKNOWLEDGED → MITIGATING → RESOLVED → FALSE_ALARM" }

  - name: CoverageRemediation
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: triggered_by_alert_id, type: string, source: input, description: "FK -> MonitoringAlert.id; the alert that triggered remediation" }
      - { name: supersedes_remediation_id, type: string, source: input, default: null, description: "FK -> CoverageRemediation.id; chains re-remediations; null for first" }
      - { name: remediation_plan, type: string, source: input, description: "Free-form plan text" }
      - { name: additional_cells_planned, type: integer, source: input, description: "How many cells to add" }
      - { name: additional_spectrum_mhz, type: integer, source: input, default: 0, description: "New spectrum required" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED → IN_PROGRESS → VERIFYING → COMPLETED → REOPENED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Enterprise
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: POST /private-wireless/enterprises/{enterpriseId}/activate
        actor: NetworkArchitect
        preconditions:
          - "Enterprise has at least one Site in any non-terminal state"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /private-wireless/enterprises/{enterpriseId}/suspend
        actor: NetworkArchitect
        preconditions: []
        side_effects:
          - "All Sites → DEPLOYED cells transition to OFF_AIR"
          - "All Devices under suspended Sites → SUSPENDED"
          - "All ACTIVE SpectrumLeases → SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /private-wireless/enterprises/{enterpriseId}/resume
        actor: NetworkArchitect
        preconditions: []
        side_effects:
          - "Sites that were OPERATIONAL return to OPERATIONAL"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: POST /private-wireless/enterprises/{enterpriseId}/offboard
        actor: NetworkArchitect
        preconditions:
          - "All Sites DECOMMISSIONED"
          - "All ServiceContracts TERMINATED or RENEWED"
        side_effects:
          - "All SIMProfiles → RETIRED"

  - entity: Site
    initial_state: PLANNED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PLANNED
        to: SURVEYED
        trigger: POST /private-wireless/sites/{siteId}/surveys/{surveyId}/approve
        actor: RFEngineer
        preconditions:
          - "The approved SiteSurvey must belong to this Site and be in SUBMITTED"
        side_effects:
          - "Site.posture := DESIGNING"
      - from: SURVEYED
        to: DESIGNED
        trigger: POST /private-wireless/sites/{siteId}/designs/{designId}/approve
        actor: RFEngineer
        preconditions:
          - "CoverageDesign.capacity_shortfall_mbps == 0 (ERR_CAPACITY_SHORTFALL)"
          - "CoverageDesign.based_on_survey_id points to an APPROVED survey for this site"
        side_effects:
          - "Site.posture := COORDINATING"
      - from: DESIGNED
        to: COORDINATED
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/register
        actor: SpectrumCoordinator
        preconditions:
          - "At least one SpectrumCoordinationRequest for this site reaches REGISTERED"
        side_effects:
          - "Site.posture := DEPLOYING"
      - from: COORDINATED
        to: DEPLOYED
        trigger: POST /private-wireless/sites/{siteId}/cells/{cellId}/on-air
        actor: FieldTechnician
        preconditions:
          - "Every PLANNED CellSector under Site either has an ACTIVE SpectrumAssignment or is DECOMMISSIONED"
          - "At least one CellSector is ON_AIR after this transition"
        side_effects: []
      - from: DEPLOYED
        to: OPERATIONAL
        trigger: POST /private-wireless/sites/{siteId}/activate
        actor: NetworkArchitect
        preconditions:
          - "Enterprise.status == ACTIVE"
          - "At least one ACTIVE ServiceContract covers this site"
        side_effects:
          - "Site.posture := OPERATIONAL"
          - "Enterprise.active_site_count incremented by 1"
      - from: OPERATIONAL
        to: REMEDIATION_REQUIRED
        trigger: POST /private-wireless/sites/{siteId}/alerts/{alertId}/acknowledge
        actor: FieldTechnician
        preconditions:
          - "MonitoringAlert.severity IN {MAJOR, CRITICAL}"
        side_effects:
          - "Site.posture := REMEDIATING"
      - from: REMEDIATION_REQUIRED
        to: OPERATIONAL
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/complete
        actor: NetworkArchitect
        preconditions:
          - "CoverageRemediation.status == VERIFYING"
        side_effects:
          - "Site.posture := OPERATIONAL"
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: POST /private-wireless/sites/{siteId}/decommission
        actor: NetworkArchitect
        preconditions:
          - "All CellSectors OFF_AIR or DECOMMISSIONED"
          - "All Devices DECOMMISSIONED"
        side_effects:
          - "All ACTIVE SpectrumAssignments → RELEASED"
          - "Site.posture := DORMANT"
          - "Enterprise.active_site_count decremented by 1"

  - entity: SiteSurvey
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /private-wireless/sites/{siteId}/surveys/{surveyId}/submit
        actor: FieldTechnician
        preconditions:
          - "surveyor_id must equal X-User-ID"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /private-wireless/sites/{siteId}/surveys/{surveyId}/approve
        actor: RFEngineer
        preconditions:
          - "No other SiteSurvey for this site already APPROVED"
          - "measured_rsrp_dbm >= -110 (ERR_SURVEY_SIGNAL_TOO_WEAK)"
        side_effects:
          - "Site transitions PLANNED → SURVEYED"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /private-wireless/sites/{siteId}/surveys/{surveyId}/reject
        actor: RFEngineer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer SiteSurvey for same Site is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Any CoverageDesign based on the superseded survey → REJECTED"

  - entity: CoverageDesign
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /private-wireless/sites/{siteId}/designs/{designId}/submit
        actor: RFEngineer
        preconditions:
          - "based_on_survey_id refers to an APPROVED SiteSurvey"
          - "required_cell_count >= 1"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /private-wireless/sites/{siteId}/designs/{designId}/approve
        actor: NetworkArchitect
        preconditions:
          - "capacity_shortfall_mbps == 0 (ERR_CAPACITY_SHORTFALL)"
        side_effects:
          - "Site transitions SURVEYED → DESIGNED"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /private-wireless/sites/{siteId}/designs/{designId}/reject
        actor: NetworkArchitect
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (when a newer design for the same site is APPROVED, or when its base survey is superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "All CellSectors still in PLANNED under this design → DECOMMISSIONED"

  - entity: SpectrumCoordinationRequest
    initial_state: DRAFT
    terminal_states: [REGISTERED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/submit
        actor: SpectrumCoordinator
        preconditions:
          - "requesting_coordinator_id == X-User-ID"
          - "Site.status == DESIGNED"
        side_effects: []
      - from: SUBMITTED
        to: COORDINATING
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/begin-coordination
        actor: SpectrumCoordinator
        preconditions: []
        side_effects:
          - "Compute interference_report across all ON_AIR CellSectors within coordination radius"
      - from: COORDINATING
        to: APPROVED
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve
        actor: SpectrumRegulator
        preconditions:
          - "interference_report.worst_case_margin_db >= 0 (ERR_INTERFERENCE_MARGIN_EXCEEDED)"
          - "For SHARED_CBRS + PAL tier: lease window must not overlap another PAL lease on same band_class + center_frequency_mhz bucket (ERR_SPECTRUM_OVERLAP)"
          - "OCC: expected_site_version must equal Site.version at time of submission"
        side_effects:
          - "Server-minted sas_registration_id assigned (SAS-XXXXXX)"
      - from: COORDINATING
        to: REJECTED
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/reject
        actor: SpectrumRegulator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REGISTERED
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/register
        actor: SpectrumCoordinator
        preconditions:
          - "sas_registration_id present"
          - "An ACTIVE SpectrumLease exists for this Enterprise covering the requested band_class with lease window covering requested window"
        side_effects:
          - "Site transitions DESIGNED → COORDINATED (first REGISTERED request only)"
      - from: { DRAFT, SUBMITTED, COORDINATING, APPROVED }
        to: WITHDRAWN
        trigger: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/withdraw
        actor: SpectrumCoordinator
        preconditions:
          - "Only requesting_coordinator_id may withdraw"
        side_effects: []

  - entity: SpectrumAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, REVOKED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: POST /private-wireless/cells/{cellId}/spectrum-assignments/{assignmentId}/release
        actor: FieldTechnician
        preconditions:
          - "CellSector must be OFF_AIR or PLANNED (cannot release while ON_AIR without re-tuning)"
        side_effects:
          - "Site.spectrum_utilization_mhz -= assigned_bandwidth_mhz"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (automatic when underlying SpectrumLease expires or is CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "CellSector → DEGRADED"
          - "Site.spectrum_utilization_mhz -= assigned_bandwidth_mhz"
          - "Raises MonitoringAlert(alert_class=OUTAGE, severity=MAJOR) on the parent Site"

  - entity: Device
    initial_state: INVENTORY
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: INVENTORY
        to: PROVISIONING
        trigger: POST /private-wireless/cells/{cellId}/devices/{deviceId}/bind-sim
        actor: FieldTechnician
        preconditions:
          - "SIMProfile.status == UNASSIGNED"
          - "SIMProfile.enterprise_id == Site.enterprise_id"
          - "CellSector.status IN {CONFIGURED, ON_AIR}"
        side_effects:
          - "SIMProfile → BOUND"
          - "Device.sim_profile_id := sim_profile_id"
      - from: PROVISIONING
        to: ACTIVE
        trigger: POST /private-wireless/cells/{cellId}/devices/{deviceId}/activate
        actor: FieldTechnician
        preconditions:
          - "Site.status IN {DEPLOYED, OPERATIONAL}"
          - "CellSector.status == ON_AIR"
        side_effects:
          - "SIMProfile → ACTIVE"
          - "Device.provisioned_at_utc := now"
          - "Site.device_count += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /private-wireless/cells/{cellId}/devices/{deviceId}/suspend
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "SIMProfile → SUSPENDED"
          - "Any SliceBinding active → unbound_at_utc := now; NetworkSlice.bound_device_count -= 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /private-wireless/cells/{cellId}/devices/{deviceId}/resume
        actor: FieldTechnician
        preconditions:
          - "Site.status IN {DEPLOYED, OPERATIONAL, REMEDIATION_REQUIRED}"
        side_effects:
          - "SIMProfile → ACTIVE"
      - from: { INVENTORY, PROVISIONING, ACTIVE, SUSPENDED }
        to: DECOMMISSIONED
        trigger: POST /private-wireless/cells/{cellId}/devices/{deviceId}/decommission
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "SIMProfile → RETIRED"
          - "If Device was ACTIVE: Site.device_count -= 1"
          - "Any active SliceBinding torn down"

  - entity: NetworkSlice
    initial_state: DEFINED
    terminal_states: [RETIRED]
    transitions:
      - from: DEFINED
        to: ACTIVATED
        trigger: POST /private-wireless/sites/{siteId}/slices/{sliceId}/activate
        actor: NetworkArchitect
        preconditions:
          - "Site.status == OPERATIONAL"
          - "Sum of ACTIVATED slice guaranteed_bandwidth_mbps + this slice's guaranteed_bandwidth_mbps <= Site.target_capacity_mbps (ERR_SLICE_BANDWIDTH_EXCEEDED)"
          - "If slice_type == URLLC, the Site's approved CoverageDesign must have edge_compute_placement IN {ON_PREMISE, NEAR_EDGE} (ERR_URLLC_REQUIRES_EDGE)"
        side_effects: []
      - from: ACTIVATED
        to: SUSPENDED
        trigger: POST /private-wireless/sites/{siteId}/slices/{sliceId}/suspend
        actor: NetworkArchitect
        preconditions: []
        side_effects:
          - "All active SliceBindings torn down; bound_device_count := 0"
      - from: SUSPENDED
        to: ACTIVATED
        trigger: POST /private-wireless/sites/{siteId}/slices/{sliceId}/activate
        actor: NetworkArchitect
        preconditions: []
        side_effects: []
      - from: { DEFINED, ACTIVATED, SUSPENDED }
        to: RETIRED
        trigger: POST /private-wireless/sites/{siteId}/slices/{sliceId}/retire
        actor: NetworkArchitect
        preconditions:
          - "bound_device_count == 0"
        side_effects: []

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [RENEWED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /private-wireless/enterprises/{enterpriseId}/contracts/{contractId}/activate
        actor: NetworkArchitect
        preconditions:
          - "Enterprise.status == ACTIVE"
          - "No other ACTIVE ServiceContract with overlapping [contract_start_utc, contract_end_utc) and same sla_tier (ERR_CONTRACT_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: BREACHED
        trigger: "system (automatic when cumulative CRITICAL outage minutes in current calendar month > contracted_max_outage_minutes_per_month)"
        actor: system
        preconditions: []
        side_effects:
          - "Apply SLA credit to Enterprise.sla_credit_balance_cents per sla_tier table (STANDARD 5%, ENHANCED 10%, MISSION_CRITICAL 20% of monthly fee)"
      - from: ACTIVE
        to: RENEWED
        trigger: POST /private-wireless/enterprises/{enterpriseId}/contracts/{contractId}/renew
        actor: NetworkArchitect
        preconditions:
          - "current_utc >= contract_end_utc - 30 days"
        side_effects:
          - "A new ServiceContract is created in DRAFT with start = old.end"
      - from: { DRAFT, ACTIVE, BREACHED }
        to: TERMINATED
        trigger: POST /private-wireless/enterprises/{enterpriseId}/contracts/{contractId}/terminate
        actor: NetworkArchitect
        preconditions: []
        side_effects:
          - "If no other ACTIVE contract covers a Site in OPERATIONAL → those Sites transition to REMEDIATION_REQUIRED"

  - entity: MonitoringAlert
    initial_state: OPEN
    terminal_states: [RESOLVED, FALSE_ALARM]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: POST /private-wireless/sites/{siteId}/alerts/{alertId}/acknowledge
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "If severity IN {MAJOR, CRITICAL} AND Site.status == OPERATIONAL: Site → REMEDIATION_REQUIRED"
      - from: ACKNOWLEDGED
        to: MITIGATING
        trigger: POST /private-wireless/sites/{siteId}/alerts/{alertId}/mitigate
        actor: FieldTechnician
        preconditions: []
        side_effects: []
      - from: MITIGATING
        to: RESOLVED
        trigger: POST /private-wireless/sites/{siteId}/alerts/{alertId}/resolve
        actor: FieldTechnician
        preconditions:
          - "If a CoverageRemediation is open (status IN {PROPOSED, APPROVED, IN_PROGRESS, VERIFYING}) referencing this alert, it must be COMPLETED first (ERR_REMEDIATION_OPEN)"
        side_effects:
          - "If alert_class == OUTAGE and severity == CRITICAL: compute downtime minutes from raised_at_utc to resolved_at_utc; if cumulative CRITICAL outage minutes in month > contracted_max_outage_minutes_per_month, contract → BREACHED with SLA credit"
      - from: { OPEN, ACKNOWLEDGED }
        to: FALSE_ALARM
        trigger: POST /private-wireless/sites/{siteId}/alerts/{alertId}/mark-false-alarm
        actor: FieldTechnician
        preconditions: []
        side_effects: []

  - entity: CoverageRemediation
    initial_state: PROPOSED
    terminal_states: [COMPLETED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/approve
        actor: NetworkArchitect
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/start
        actor: RFEngineer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: VERIFYING
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/verify
        actor: FieldTechnician
        preconditions:
          - "additional_cells_planned == number of newly added ON_AIR CellSectors since remediation start (ERR_REMEDIATION_CELLS_MISSING)"
        side_effects: []
      - from: VERIFYING
        to: COMPLETED
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/complete
        actor: NetworkArchitect
        preconditions: []
        side_effects:
          - "Site REMEDIATION_REQUIRED → OPERATIONAL"
      - from: VERIFYING
        to: REOPENED
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/reopen
        actor: NetworkArchitect
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: IN_PROGRESS
        trigger: POST /private-wireless/sites/{siteId}/remediations/{remediationId}/start
        actor: RFEngineer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: design-edit-stale-site
    parent_entity: Site
    write_endpoint: POST /private-wireless/sites/{siteId}/designs
    occ_field: expected_site_version
    description: |
      Creating a CoverageDesign against a Site whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      newer SiteSurvey was just APPROVED (bumping Site.version), so the
      existing DRAFT design's survey baseline is stale.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

  - rule_id: coordination-approval-stale-request
    parent_entity: SpectrumCoordinationRequest
    write_endpoint: POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve
    occ_field: expected_request_version
    description: |
      Approving a SpectrumCoordinationRequest whose version has advanced since
      the regulator last observed it is rejected. Captures the case where the
      coordinator re-submitted or modified the request after the regulator's
      review snapshot.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: predicted_capacity_provisional
    trigger: "When CoverageDesign is submitted (DRAFT → SUBMITTED)"
    algorithm: forward_looking
    description: |
      Provisional estimate of total downlink capacity for the design, summed
      across proposed CellSectors. Optimistic per-cell formula assumes clear
      line-of-sight and no co-channel interference.
    formula: |
      predicted_capacity_mbps = sum over proposed CellSectors of:
        CELL_BASE_MBPS[slice_type_of_intended_use]
        * min(1.0, (max_eirp_dbm / EIRP_REF_DBM))
        * (1.0 - attenuation_factor_db / ATTENUATION_FULL_LOSS_DB)
      Where slice_type_of_intended_use defaults to EMBB for capacity estimation.
      Round each per-cell contribution to integer BEFORE summing (per-cell rounding, then sum).
    input_set: "All CellSectors under the parent Site with status IN {PLANNED, CONFIGURED}; EXCLUDES DECOMMISSIONED."
    constants:
      CELL_BASE_MBPS_EMBB: 900
      CELL_BASE_MBPS_URLLC: 300
      CELL_BASE_MBPS_MMTC: 60
      EIRP_REF_DBM: 40
      ATTENUATION_FULL_LOSS_DB: 30
    precision: "Integer Mbps, per-cell round-half-up before summation"
    variants:
      - name: provisional
        when: "At CoverageDesign submission; uses optimistic interference margin"
        difference: "Uses interference_margin_db = 6 and no neighbor-cell penalty"
      - name: final
        when: "At CoverageDesign approval when ACTIVATED cells exist; uses conservative interference margin"
        difference: "Uses interference_margin_db = 9 AND subtracts 5% per ON_AIR neighbor cell within 500m (compounding multiplicatively, up to 3 neighbors)"

  - name: final_capacity_conservative
    trigger: "When CoverageDesign is APPROVED"
    algorithm: forward_looking
    description: |
      Final capacity uses conservative interference margin (9 dB) and applies a
      5% multiplicative penalty per ON_AIR neighbor within 500m, capped at 3
      neighbors. Rounded per-cell then summed, same as provisional.
    formula: |
      per_cell = round_half_up(
        CELL_BASE_MBPS[slice] * min(1.0, eirp/EIRP_REF) * (1 - att/30)
        * (0.95 ** min(3, neighbor_count_within_500m))
      )
      final_capacity_mbps = sum(per_cell)
      Round per-cell BEFORE summation.
    input_set: "Same as provisional: PLANNED + CONFIGURED cells, excludes DECOMMISSIONED"
    constants:
      CONSERVATIVE_MARGIN_DB: 9
      NEIGHBOR_PENALTY_PCT: 5
      NEIGHBOR_RADIUS_M: 500
      NEIGHBOR_CAP: 3
    precision: "Integer Mbps, per-cell round-half-up before summation"

  - name: attenuation_factor_derivation
    trigger: "When SiteSurvey is created or its building_material_class changes"
    algorithm: aggregation
    description: "Map building_material_class to a fixed attenuation value."
    formula: |
      attenuation_factor_db = {
        OPEN: 3, WOOD: 6, CONCRETE: 12, STEEL: 18, MIXED: 10
      }[building_material_class]
    input_set: "Single SiteSurvey"
    constants:
      OPEN_DB: 3
      WOOD_DB: 6
      CONCRETE_DB: 12
      STEEL_DB: 18
      MIXED_DB: 10
    precision: "Integer dB"

  - name: required_cell_count
    trigger: "When CoverageDesign is submitted"
    algorithm: threshold
    description: |
      Cells required = ceil( site_area_sqm / (CELL_COVERAGE_SQM * material_penalty_factor) )
      where material_penalty_factor = max(0.25, 1.0 - attenuation_factor_db / 30).
      Result must be >= 1.
    formula: |
      factor = max(0.25, 1.0 - att_db / 30)
      required_cell_count = max(1, ceil(site_area_sqm / (CELL_COVERAGE_SQM * factor)))
    input_set: "Site + base SiteSurvey"
    constants:
      CELL_COVERAGE_SQM: 5000
    precision: "Integer"

  - name: sla_breach_credit
    trigger: "When MonitoringAlert (OUTAGE, CRITICAL) is RESOLVED, AND when cumulative monthly CRITICAL outage minutes exceed contract cap (system trigger)"
    algorithm: tiered_pricing
    description: |
      SLA credit awarded to the Enterprise. Tiered by sla_tier. Credit is
      computed as a percentage of monthly contract fee (assumed flat 100_000
      cents/month for benchmark purposes), rounded half-up per breach event
      THEN summed across events in the month.
    formula: |
      monthly_fee_cents = 100_000
      rate = { STANDARD: 0.05, ENHANCED: 0.10, MISSION_CRITICAL: 0.20 }[sla_tier]
      per_event_credit = round_half_up(monthly_fee_cents * rate)
      monthly_total_credit = sum(per_event_credit for breach events in month)
    input_set: "All MonitoringAlerts resolved in the same UTC calendar month on sites covered by the contract"
    constants:
      STANDARD_RATE: 0.05
      ENHANCED_RATE: 0.10
      MISSION_CRITICAL_RATE: 0.20
      MONTHLY_FEE_CENTS: 100000
    precision: "Integer cents, round_half_up per event then sum"

  - name: site_spectrum_utilization
    trigger: "When SpectrumAssignment is created, released, or revoked"
    algorithm: aggregation
    description: |
      Site.spectrum_utilization_mhz = sum of assigned_bandwidth_mhz over all
      SpectrumAssignments in status ACTIVE whose cell_sector_id belongs to a
      CellSector of this Site.
    formula: |
      utilization = sum(a.assigned_bandwidth_mhz for a in assignments
                        where a.status == ACTIVE
                        and parent_cell(a).site_id == site.id)
    input_set: "All SpectrumAssignments with status ACTIVE under this Site's cells"
    precision: "Integer MHz"
    variants:
      - name: incremental
        when: "On individual SpectrumAssignment create/release/revoke"
        difference: "Adds/subtracts the delta"
      - name: full_recompute
        when: "On Site decommission or periodic audit"
        difference: "Recomputes from scratch over the full input_set; must equal incremental result"

  - name: interference_report_worst_case
    trigger: "When SpectrumCoordinationRequest enters COORDINATING"
    algorithm: weighted_scoring
    description: |
      Computes worst-case interference margin against ON_AIR neighbor cells
      within the coordination radius. Each neighbor contributes a margin based
      on distance and EIRP overlap. The report aggregates worst_case and
      arithmetic mean.
    formula: |
      for each ON_AIR CellSector c within COORDINATION_RADIUS_M of any PLANNED cell in this design:
        path_loss_db = 20 * log10(distance_m) + 20 * log10(center_frequency_mhz) + FSPL_CONST_DB
        received_interference_dbm = c.max_eirp_dbm - path_loss_db
        margin_db = -(received_interference_dbm) - c.interference_margin_db
      worst_case_margin_db = min(all margin_db values, default = +99 if no neighbors)
      aggregate_margin_db = round_half_up(mean(all margin_db values))
    input_set: "ON_AIR CellSectors within COORDINATION_RADIUS_M of any PLANNED/CONFIGURED cell of this Site"
    constants:
      COORDINATION_RADIUS_M: 1000
      FSPL_CONST_DB: 32.44
    precision: "1 decimal place dB"

  - name: remediation_completion_check
    trigger: "When CoverageRemediation transitions IN_PROGRESS → VERIFYING"
    algorithm: aggregation
    description: |
      Counts CellSectors created ON or AFTER the remediation's transition to
      IN_PROGRESS that are in ON_AIR. Must equal additional_cells_planned.
    formula: |
      new_on_air = count(CellSector c where c.site_id == remediation.site_id
                          and c.created_at >= remediation.in_progress_started_at_utc
                          and c.status == ON_AIR)
      ok = (new_on_air == remediation.additional_cells_planned)
    input_set: "CellSectors under remediation's site created after IN_PROGRESS began"
    precision: "Integer count"

  - name: slice_bandwidth_reservation_check
    trigger: "When NetworkSlice is activated"
    algorithm: threshold
    description: |
      Sum of guaranteed_bandwidth_mbps across ACTIVATED slices on the Site,
      PLUS the slice being activated, MUST be <= Site.target_capacity_mbps.
      Boundary: equal is allowed; exceeding by 1 Mbps is rejected.
    formula: |
      projected_total = sum(s.guaranteed_bandwidth_mbps for s in slices
                            where s.site_id == site.id and s.status == ACTIVATED)
                      + this.guaranteed_bandwidth_mbps
      allowed = (projected_total <= site.target_capacity_mbps)
    input_set: "All ACTIVATED NetworkSlices under this Site"
    precision: "Integer Mbps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path parameters reference existing resources (validated left-to-right: enterprise, site, survey/design/contract, cell, device)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All body-supplied FK references (based_on_survey_id, spectrum_lease_id, coordination_request_id, sim_profile_id, supersedes_remediation_id, triggered_by_alert_id) exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints that accept FK references"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is valid"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Target resource is not in a terminal state (DECOMMISSIONED, RETIRED, TERMINATED, RESOLVED, etc.)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all mutating endpoints on stateful resources"

  - priority: 7
    category: business_safety
    check: "Interference report worst_case_margin_db >= 0 when approving a SpectrumCoordinationRequest"
    error_id: ERR_INTERFERENCE_MARGIN_EXCEEDED
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve"

  - priority: 8
    category: business_safety
    check: "Survey measured_rsrp_dbm >= -110 dBm at approval"
    error_id: ERR_SURVEY_SIGNAL_TOO_WEAK
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/surveys/{surveyId}/approve"

  - priority: 9
    category: business_safety
    check: "URLLC slice requires CoverageDesign.edge_compute_placement IN {ON_PREMISE, NEAR_EDGE}"
    error_id: ERR_URLLC_REQUIRES_EDGE
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/slices/{sliceId}/activate"

  - priority: 10
    category: business_safety
    check: "For SHARED_CBRS + PAL tier leases, no overlapping lease window on the same band_class and center_frequency bucket (center_frequency within ±10 MHz)"
    error_id: ERR_SPECTRUM_OVERLAP
    http_status: 409
    applies_to: "POST /private-wireless/enterprises/{enterpriseId}/spectrum-leases, POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve"

  - priority: 11
    category: business_temporal
    check: "Time window end > start (lease_start_utc < lease_end_utc; requested_start < requested_end; assignment_start < assignment_end; contract_start < contract_end)"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 400
    applies_to: "endpoints accepting time windows"

  - priority: 12
    category: business_temporal
    check: "Requested coordination window is fully inside an ACTIVE SpectrumLease window for the same band_class and enterprise"
    error_id: ERR_NO_ACTIVE_LEASE
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/register"

  - priority: 13
    category: business_temporal
    check: "CellSector assignments do not overlap on the same CellSector: assignment windows must be half-open [start, end) and disjoint"
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /private-wireless/cells/{cellId}/spectrum-assignments"

  - priority: 14
    category: business_temporal
    check: "ServiceContract activation: no other ACTIVE contract on same Enterprise with overlapping [start, end) and same sla_tier"
    error_id: ERR_CONTRACT_OVERLAP
    http_status: 409
    applies_to: "POST /private-wireless/enterprises/{enterpriseId}/contracts/{contractId}/activate"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: Site.site_code unique within Enterprise; Device.serial_number, Device.imei, SIMProfile.iccid globally unique; NetworkSlice.slice_name unique within Site; CellSector.sector_label unique within Site; Enterprise.erp_account_code globally unique"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 16
    category: business_constraint
    check: "CoverageDesign.capacity_shortfall_mbps == 0 before approval"
    error_id: ERR_CAPACITY_SHORTFALL
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/designs/{designId}/approve"

  - priority: 17
    category: business_constraint
    check: "Slice bandwidth reservation: sum of ACTIVATED slices + new slice <= Site.target_capacity_mbps"
    error_id: ERR_SLICE_BANDWIDTH_EXCEEDED
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/slices/{sliceId}/activate"

  - priority: 18
    category: business_constraint
    check: "NetworkSlice.bound_device_count < NetworkSlice.max_devices before binding"
    error_id: ERR_SLICE_DEVICE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/slices/{sliceId}/bind-device"

  - priority: 19
    category: business_constraint
    check: "CoverageRemediation VERIFYING requires newly added ON_AIR CellSectors count == additional_cells_planned"
    error_id: ERR_REMEDIATION_CELLS_MISSING
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/remediations/{remediationId}/verify"

  - priority: 20
    category: business_constraint
    check: "MonitoringAlert resolution requires no open CoverageRemediation referencing this alert"
    error_id: ERR_REMEDIATION_OPEN
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/alerts/{alertId}/resolve"

  - priority: 21
    category: business_referential
    check: "Device bind-sim requires SIMProfile.enterprise_id == parent Site's enterprise_id (cross-aggregate referential integrity)"
    error_id: ERR_CROSS_ENTERPRISE_REFERENCE
    http_status: 422
    applies_to: "POST /private-wireless/cells/{cellId}/devices/{deviceId}/bind-sim"

  - priority: 22
    category: business_referential
    check: "Site decommission requires all CellSectors OFF_AIR/DECOMMISSIONED and all Devices DECOMMISSIONED"
    error_id: ERR_CHILDREN_ACTIVE
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/decommission"

  - priority: 23
    category: business_referential
    check: "Enterprise offboard requires all Sites DECOMMISSIONED and all ServiceContracts TERMINATED or RENEWED"
    error_id: ERR_ENTERPRISE_CHILDREN_ACTIVE
    http_status: 422
    applies_to: "POST /private-wireless/enterprises/{enterpriseId}/offboard"

  - priority: 24
    category: business_fiscal
    check: "SpectrumAssignment creation requires SpectrumLease.remaining_bandwidth_mhz >= assigned_bandwidth_mhz (sum of ACTIVE assignments on the lease + new <= lease.bandwidth_mhz)"
    error_id: ERR_LEASE_BANDWIDTH_EXCEEDED
    http_status: 422
    applies_to: "POST /private-wireless/cells/{cellId}/spectrum-assignments"

  - priority: 25
    category: business_fiscal
    check: "CoverageDesign submission requires Site.target_capacity_mbps >= 100 (minimum viable capacity)"
    error_id: ERR_TARGET_CAPACITY_TOO_LOW
    http_status: 422
    applies_to: "POST /private-wireless/sites/{siteId}/designs/{designId}/submit"

  - priority: 26
    category: state
    check: "OCC: expected_site_version equals Site.version on design creation; expected_request_version equals SpectrumCoordinationRequest.version on approve"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /private-wireless/sites/{siteId}/designs"

  - priority: 27
    category: state
    check: "OCC: expected_request_version equals SpectrumCoordinationRequest.version on approve"
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve"

  - priority: 28
    category: business_safety
    check: "Segregation of duties: the actor who submits a SiteSurvey (FieldTechnician) cannot approve it; the actor who submits a SpectrumCoordinationRequest (SpectrumCoordinator) cannot approve it (must be SpectrumRegulator)"
    error_id: ERR_SEGREGATION_OF_DUTY
    http_status: 403
    applies_to: "POST /private-wireless/sites/{siteId}/surveys/{surveyId}/approve, POST /private-wireless/sites/{siteId}/coordination-requests/{requestId}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock / test-driving ----
  - method: POST
    path: "/private-wireless/_clock/set_current_utc"
    description: "Set the logical clock (default before any set: 2026-09-01T00:00:00Z). The server MUST NOT consult wall-clock time."
    roles: [NetworkArchitect]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "All time-derived state transitions re-evaluated (lease expiry, contract breach detection, remediation windows)"

  # ---- Enterprise ----
  - method: POST
    path: "/private-wireless/enterprises"
    description: "Create an Enterprise"
    roles: [NetworkArchitect]
    code: 201
    input: [legal_name, erp_account_code, industry_vertical, "security_posture?"]
    output: Enterprise
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises"
    description: "List enterprises with pagination + filters"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "industry_vertical?"]
    output: Enterprise[]
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises/{id}"
    description: "Get one enterprise"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: []
    output: Enterprise
    side_effects: []

  - method: POST
    path: "/private-wireless/enterprises/{id}/activate"
    description: "ONBOARDING → ACTIVE"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Enterprise
    side_effects: ["increments Enterprise.version by 1"]

  - method: POST
    path: "/private-wireless/enterprises/{id}/suspend"
    description: "ACTIVE → SUSPENDED (cascades to children)"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Enterprise
    side_effects: ["cascade to Sites, Devices, SpectrumLeases", "increments Enterprise.version by 1"]

  - method: POST
    path: "/private-wireless/enterprises/{id}/resume"
    description: "SUSPENDED → ACTIVE"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Enterprise
    side_effects: ["increments Enterprise.version by 1"]

  - method: POST
    path: "/private-wireless/enterprises/{id}/offboard"
    description: "ACTIVE → OFFBOARDED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Enterprise
    side_effects: ["All SIMProfiles → RETIRED", "increments Enterprise.version by 1"]

  # ---- Sites ----
  - method: POST
    path: "/private-wireless/enterprises/{id}/sites"
    description: "Create a Site under an Enterprise"
    roles: [NetworkArchitect]
    code: 201
    input: [site_code, address, geo_latitude, geo_longitude, site_area_sqm, target_capacity_mbps, target_availability_pct]
    output: Site
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises/{id}/sites"
    description: "List sites for an enterprise"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "posture?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}"
    description: "Get one Site"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/activate"
    description: "Site DEPLOYED → OPERATIONAL"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Site
    side_effects: ["posture := OPERATIONAL", "Enterprise.active_site_count += 1", "increments Site.version by 1"]

  - method: POST
    path: "/private-wireless/sites/{id}/decommission"
    description: "Site → DECOMMISSIONED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: Site
    side_effects: ["All ACTIVE SpectrumAssignments → RELEASED", "posture := DORMANT", "increments Site.version by 1"]

  # ---- SiteSurvey ----
  - method: POST
    path: "/private-wireless/sites/{id}/surveys"
    description: "Create a SiteSurvey in DRAFT"
    roles: [FieldTechnician]
    code: 201
    input: [surveyor_id, survey_date, measured_rsrp_dbm, measured_sinr_db, floor_plan_area_sqm, building_material_class]
    output: SiteSurvey
    side_effects: ["attenuation_factor_db computed from building_material_class"]

  - method: GET
    path: "/private-wireless/sites/{id}/surveys"
    description: "List surveys for a site"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SiteSurvey[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/surveys/{id2}"
    description: "Get one survey"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
    code: 200
    input: []
    output: SiteSurvey
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/surveys/{id2}/submit"
    description: "DRAFT → SUBMITTED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: SiteSurvey
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/surveys/{id2}/approve"
    description: "SUBMITTED → APPROVED; drives Site PLANNED → SURVEYED"
    roles: [RFEngineer]
    code: 200
    input: []
    output: SiteSurvey
    side_effects: ["Site transitions PLANNED → SURVEYED", "increments Site.version by 1", "supersedes prior APPROVED survey for this site if any"]

  - method: POST
    path: "/private-wireless/sites/{id}/surveys/{id2}/reject"
    description: "SUBMITTED → REJECTED"
    roles: [RFEngineer]
    code: 200
    input: []
    output: SiteSurvey
    side_effects: []

  # ---- CoverageDesign ----
  - method: POST
    path: "/private-wireless/sites/{id}/designs"
    description: "Create a CoverageDesign in DRAFT (OCC-guarded)"
    roles: [RFEngineer]
    code: 201
    input: [based_on_survey_id, edge_compute_required, "edge_compute_placement?", expected_site_version]
    output: CoverageDesign
    side_effects:
      - "design_revision = (max existing for site) + 1"
      - "increments Site.version by 1"
      - "predicted_capacity_mbps computed via provisional variant"

  - method: GET
    path: "/private-wireless/sites/{id}/designs"
    description: "List designs for a site"
    roles: [NetworkArchitect, RFEngineer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CoverageDesign[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/designs/{id2}"
    description: "Get one design"
    roles: [NetworkArchitect, RFEngineer]
    code: 200
    input: []
    output: CoverageDesign
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/designs/{id2}/submit"
    description: "DRAFT → SUBMITTED"
    roles: [RFEngineer]
    code: 200
    input: []
    output: CoverageDesign
    side_effects: ["required_cell_count computed", "capacity_shortfall_mbps computed"]

  - method: POST
    path: "/private-wireless/sites/{id}/designs/{id2}/approve"
    description: "SUBMITTED → APPROVED; drives Site SURVEYED → DESIGNED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: CoverageDesign
    side_effects:
      - "Site transitions SURVEYED → DESIGNED"
      - "final_capacity_mbps computed via final variant"
      - "supersedes prior APPROVED design for the site if any"
      - "increments Site.version by 1"

  - method: POST
    path: "/private-wireless/sites/{id}/designs/{id2}/reject"
    description: "SUBMITTED → REJECTED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: CoverageDesign
    side_effects: []

  # ---- CellSector ----
  - method: POST
    path: "/private-wireless/sites/{id}/cells"
    description: "Create a CellSector in PLANNED"
    roles: [RFEngineer]
    code: 201
    input: [sector_label, azimuth_degrees, height_m, max_eirp_dbm]
    output: CellSector
    side_effects: ["cell_radius_m computed"]

  - method: GET
    path: "/private-wireless/sites/{id}/cells"
    description: "List cells for a site"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CellSector[]
    side_effects: []

  - method: GET
    path: "/private-wireless/cells/{id}"
    description: "Get one cell"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
    code: 200
    input: []
    output: CellSector
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/cells/{id2}/configure"
    description: "PLANNED → CONFIGURED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: CellSector
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/cells/{id2}/on-air"
    description: "CONFIGURED → ON_AIR; drives Site COORDINATED → DEPLOYED if last cell"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: CellSector
    side_effects:
      - "Requires an ACTIVE SpectrumAssignment on this cell"
      - "If all cells now ON_AIR and Site COORDINATED: Site → DEPLOYED"

  - method: POST
    path: "/private-wireless/sites/{id}/cells/{id2}/off-air"
    description: "ON_AIR → OFF_AIR"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: CellSector
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/cells/{id2}/decommission"
    description: "Any non-terminal → DECOMMISSIONED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: CellSector
    side_effects: ["ACTIVE SpectrumAssignments on this cell → RELEASED"]

  # ---- SpectrumLease ----
  - method: POST
    path: "/private-wireless/enterprises/{id}/spectrum-leases"
    description: "Create a SpectrumLease (PENDING)"
    roles: [SpectrumCoordinator]
    code: 201
    input: [band_class, center_frequency_mhz, bandwidth_mhz, lease_start_utc, lease_end_utc, "priority_access_tier?", monthly_cost_cents]
    output: SpectrumLease
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises/{id}/spectrum-leases"
    description: "List leases for an enterprise"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator]
    code: 200
    input: ["limit?", "offset?", "status?", "band_class?"]
    output: SpectrumLease[]
    side_effects: []

  - method: GET
    path: "/private-wireless/spectrum-leases/{id}"
    description: "Get one lease"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator]
    code: 200
    input: []
    output: SpectrumLease
    side_effects: []

  - method: POST
    path: "/private-wireless/spectrum-leases/{id}/activate"
    description: "PENDING → ACTIVE"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumLease
    side_effects: []

  - method: POST
    path: "/private-wireless/spectrum-leases/{id}/cancel"
    description: "Any non-terminal → CANCELLED"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumLease
    side_effects: ["ACTIVE SpectrumAssignments on this lease → REVOKED; parent cells → DEGRADED"]

  # ---- SpectrumCoordinationRequest ----
  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests"
    description: "Create a SpectrumCoordinationRequest in DRAFT"
    roles: [SpectrumCoordinator]
    code: 201
    input: [requesting_coordinator_id, band_class, requested_bandwidth_mhz, requested_start_utc, requested_end_utc]
    output: SpectrumCoordinationRequest
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/coordination-requests"
    description: "List coordination requests"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator]
    code: 200
    input: ["limit?", "offset?", "status?", "band_class?"]
    output: SpectrumCoordinationRequest[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}"
    description: "Get one coordination request"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/submit"
    description: "DRAFT → SUBMITTED"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: ["increments SpectrumCoordinationRequest.version by 1"]

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/begin-coordination"
    description: "SUBMITTED → COORDINATING; computes interference report"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: ["interference_report computed", "increments SpectrumCoordinationRequest.version by 1"]

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/approve"
    description: "COORDINATING → APPROVED (OCC-guarded)"
    roles: [SpectrumRegulator]
    code: 200
    input: [expected_request_version]
    output: SpectrumCoordinationRequest
    side_effects:
      - "sas_registration_id server-minted"
      - "increments SpectrumCoordinationRequest.version by 1"

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/reject"
    description: "COORDINATING → REJECTED"
    roles: [SpectrumRegulator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: ["increments SpectrumCoordinationRequest.version by 1"]

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/register"
    description: "APPROVED → REGISTERED; drives Site DESIGNED → COORDINATED on first registration"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects:
      - "If first REGISTERED for the site: Site DESIGNED → COORDINATED"
      - "increments SpectrumCoordinationRequest.version by 1"
      - "increments Site.version by 1 (only when transitioning)"

  - method: POST
    path: "/private-wireless/sites/{id}/coordination-requests/{id2}/withdraw"
    description: "DRAFT|SUBMITTED|COORDINATING|APPROVED → WITHDRAWN"
    roles: [SpectrumCoordinator]
    code: 200
    input: []
    output: SpectrumCoordinationRequest
    side_effects: ["increments SpectrumCoordinationRequest.version by 1"]

  # ---- SpectrumAssignment ----
  - method: POST
    path: "/private-wireless/cells/{id}/spectrum-assignments"
    description: "Create a SpectrumAssignment (immediately ACTIVE)"
    roles: [SpectrumCoordinator]
    code: 201
    input: [coordination_request_id, spectrum_lease_id, assigned_bandwidth_mhz, assignment_start_utc, assignment_end_utc]
    output: SpectrumAssignment
    side_effects: ["Site.spectrum_utilization_mhz += assigned_bandwidth_mhz"]

  - method: GET
    path: "/private-wireless/cells/{id}/spectrum-assignments"
    description: "List assignments for a cell"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, SpectrumRegulator, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SpectrumAssignment[]
    side_effects: []

  - method: POST
    path: "/private-wireless/cells/{id}/spectrum-assignments/{id2}/release"
    description: "ACTIVE → RELEASED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: SpectrumAssignment
    side_effects: ["Site.spectrum_utilization_mhz -= assigned_bandwidth_mhz"]

  # ---- SIMProfile ----
  - method: POST
    path: "/private-wireless/enterprises/{id}/sim-profiles"
    description: "Create a SIMProfile in UNASSIGNED"
    roles: [FieldTechnician]
    code: 201
    input: [iccid, "subscription_profile?", "monthly_quota_mb?"]
    output: SIMProfile
    side_effects: ["imsi server-minted", "ki_key_ref server-minted"]

  - method: GET
    path: "/private-wireless/enterprises/{id}/sim-profiles"
    description: "List SIM profiles for an enterprise"
    roles: [NetworkArchitect, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SIMProfile[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sim-profiles/{id}"
    description: "Get one SIM profile"
    roles: [NetworkArchitect, FieldTechnician]
    code: 200
    input: []
    output: SIMProfile
    side_effects: []

  # ---- Device ----
  - method: POST
    path: "/private-wireless/cells/{id}/devices"
    description: "Register a Device in INVENTORY"
    roles: [FieldTechnician]
    code: 201
    input: [serial_number, device_type, imei]
    output: Device
    side_effects: ["site_id denormalized from parent cell's site"]

  - method: GET
    path: "/private-wireless/cells/{id}/devices"
    description: "List devices for a cell"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "device_type?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/devices"
    description: "List devices for a site (cross-cell)"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "device_type?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/private-wireless/devices/{id}"
    description: "Get one device"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/private-wireless/cells/{id}/devices/{id2}/bind-sim"
    description: "Device INVENTORY → PROVISIONING; SIM UNASSIGNED → BOUND"
    roles: [FieldTechnician]
    code: 200
    input: [sim_profile_id]
    output: Device
    side_effects: ["SIMProfile → BOUND"]

  - method: POST
    path: "/private-wireless/cells/{id}/devices/{id2}/activate"
    description: "PROVISIONING → ACTIVE"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["SIMProfile → ACTIVE", "Site.device_count += 1", "provisioned_at_utc := now"]

  - method: POST
    path: "/private-wireless/cells/{id}/devices/{id2}/suspend"
    description: "ACTIVE → SUSPENDED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["SIMProfile → SUSPENDED", "SliceBindings torn down"]

  - method: POST
    path: "/private-wireless/cells/{id}/devices/{id2}/resume"
    description: "SUSPENDED → ACTIVE"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["SIMProfile → ACTIVE"]

  - method: POST
    path: "/private-wireless/cells/{id}/devices/{id2}/decommission"
    description: "Any non-terminal → DECOMMISSIONED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["SIMProfile → RETIRED", "if was ACTIVE: Site.device_count -= 1"]

  # ---- NetworkSlice & SliceBinding ----
  - method: POST
    path: "/private-wireless/sites/{id}/slices"
    description: "Create a NetworkSlice in DEFINED"
    roles: [NetworkArchitect]
    code: 201
    input: [slice_name, slice_type, guaranteed_bandwidth_mbps, max_latency_ms, max_devices]
    output: NetworkSlice
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/slices"
    description: "List slices for a site"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "slice_type?"]
    output: NetworkSlice[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/slices/{id2}"
    description: "Get one slice"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: NetworkSlice
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/slices/{id2}/activate"
    description: "DEFINED|SUSPENDED → ACTIVATED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: NetworkSlice
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/slices/{id2}/suspend"
    description: "ACTIVATED → SUSPENDED; tears down bindings"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: NetworkSlice
    side_effects: ["Active SliceBindings unbound", "bound_device_count := 0"]

  - method: POST
    path: "/private-wireless/sites/{id}/slices/{id2}/retire"
    description: "DEFINED|ACTIVATED|SUSPENDED → RETIRED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: NetworkSlice
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/slices/{id2}/bind-device"
    description: "Bind an ACTIVE Device to the slice (creates SliceBinding)"
    roles: [FieldTechnician]
    code: 201
    input: [device_id]
    output: SliceBinding
    side_effects:
      - "SliceBinding created (bound_at_utc := now)"
      - "NetworkSlice.bound_device_count += 1"
      - "Device must belong to same Site"

  - method: POST
    path: "/private-wireless/sites/{id}/slices/{id2}/unbind-device"
    description: "Tear down a SliceBinding"
    roles: [FieldTechnician]
    code: 200
    input: [device_id]
    output: SliceBinding
    side_effects: ["SliceBinding.unbound_at_utc := now", "NetworkSlice.bound_device_count -= 1"]

  - method: GET
    path: "/private-wireless/sites/{id}/slices/{id2}/bindings"
    description: "List bindings for a slice"
    roles: [NetworkArchitect, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "active_only?"]
    output: SliceBinding[]
    side_effects: []

  # ---- ServiceContract ----
  - method: POST
    path: "/private-wireless/enterprises/{id}/contracts"
    description: "Create a ServiceContract in DRAFT"
    roles: [NetworkArchitect]
    code: 201
    input: [contract_code, sla_tier, contracted_availability_pct, contracted_max_outage_minutes_per_month, onsite_support_window, contract_start_utc, contract_end_utc]
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises/{id}/contracts"
    description: "List contracts for an enterprise"
    roles: [NetworkArchitect, SpectrumRegulator]
    code: 200
    input: ["limit?", "offset?", "status?", "sla_tier?"]
    output: ServiceContract[]
    side_effects: []

  - method: GET
    path: "/private-wireless/enterprises/{id}/contracts/{id2}"
    description: "Get one contract"
    roles: [NetworkArchitect, SpectrumRegulator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: POST
    path: "/private-wireless/enterprises/{id}/contracts/{id2}/activate"
    description: "DRAFT → ACTIVE"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: POST
    path: "/private-wireless/enterprises/{id}/contracts/{id2}/renew"
    description: "ACTIVE → RENEWED; creates a new DRAFT contract chained at end"
    roles: [NetworkArchitect]
    code: 201
    input: [new_contract_end_utc]
    output: ServiceContract
    side_effects: ["New contract created in DRAFT with start = old.end"]

  - method: POST
    path: "/private-wireless/enterprises/{id}/contracts/{id2}/terminate"
    description: "DRAFT|ACTIVE|BREACHED → TERMINATED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["Sites without other ACTIVE contract → REMEDIATION_REQUIRED"]

  # ---- MonitoringAlert ----
  - method: POST
    path: "/private-wireless/sites/{id}/alerts"
    description: "Raise a MonitoringAlert in OPEN"
    roles: [FieldTechnician]
    code: 201
    input: [alert_class, severity]
    output: MonitoringAlert
    side_effects: ["raised_at_utc := now"]

  - method: GET
    path: "/private-wireless/sites/{id}/alerts"
    description: "List alerts for a site"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?", "alert_class?"]
    output: MonitoringAlert[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/alerts/{id2}"
    description: "Get one alert"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/alerts/{id2}/acknowledge"
    description: "OPEN → ACKNOWLEDGED"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: ["If severity IN {MAJOR, CRITICAL}: Site OPERATIONAL → REMEDIATION_REQUIRED"]

  - method: POST
    path: "/private-wireless/sites/{id}/alerts/{id2}/mitigate"
    description: "ACKNOWLEDGED → MITIGATING"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/alerts/{id2}/resolve"
    description: "MITIGATING → RESOLVED; may trigger SLA credit + contract breach"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects:
      - "resolved_at_utc := now"
      - "If OUTAGE+CRITICAL: cumulative monthly minutes evaluated; contract may flip to BREACHED; SLA credit applied to Enterprise.sla_credit_balance_cents"

  - method: POST
    path: "/private-wireless/sites/{id}/alerts/{id2}/mark-false-alarm"
    description: "OPEN|ACKNOWLEDGED → FALSE_ALARM"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []

  # ---- CoverageRemediation ----
  - method: POST
    path: "/private-wireless/sites/{id}/remediations"
    description: "Create a CoverageRemediation in PROPOSED"
    roles: [RFEngineer]
    code: 201
    input: [triggered_by_alert_id, "supersedes_remediation_id?", remediation_plan, additional_cells_planned, "additional_spectrum_mhz?"]
    output: CoverageRemediation
    side_effects: ["in_progress_started_at_utc := null (set on start)"]

  - method: GET
    path: "/private-wireless/sites/{id}/remediations"
    description: "List remediations for a site"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CoverageRemediation[]
    side_effects: []

  - method: GET
    path: "/private-wireless/sites/{id}/remediations/{id2}"
    description: "Get one remediation"
    roles: [NetworkArchitect, RFEngineer, FieldTechnician]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/remediations/{id2}/approve"
    description: "PROPOSED → APPROVED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: []

  - method: POST
    path: "/private-wireless/sites/{id}/remediations/{id2}/start"
    description: "APPROVED|REOPENED → IN_PROGRESS"
    roles: [RFEngineer]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: ["in_progress_started_at_utc := now"]

  - method: POST
    path: "/private-wireless/sites/{id}/remediations/{id2}/verify"
    description: "IN_PROGRESS → VERIFYING"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: ["Validates additional_cells_planned == new ON_AIR cell count"]

  - method: POST
    path: "/private-wireless/sites/{id}/remediations/{id2}/complete"
    description: "VERIFYING → COMPLETED; Site → OPERATIONAL"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: ["Site REMEDIATION_REQUIRED → OPERATIONAL"]

  - method: POST
    path: "/private-wireless/sites/{id}/remediations/{id2}/reopen"
    description: "VERIFYING → REOPENED"
    roles: [NetworkArchitect]
    code: 200
    input: []
    output: CoverageRemediation
    side_effects: []

  # ---- Computed reads ----
  - method: GET
    path: "/private-wireless/sites/{id}/summary"
    description: "Computed site summary: posture, capacity shortfall, spectrum utilization, device count, open alerts, active slices"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
    code: 200
    input: []
    output: object
    side_effects: []

  # ---- Flat single-resource GETs (FK reverse-reachability) ----
  - method: GET
    path: "/private-wireless/surveys/{id}"
    description: "Get one SiteSurvey by id"
    roles: [NetworkArchitect, RFEngineer, SpectrumCoordinator, FieldTechnician]
