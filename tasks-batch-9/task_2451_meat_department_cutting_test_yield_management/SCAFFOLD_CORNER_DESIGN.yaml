# =============================================================================
# §1.9 Scaffold Corner Design — Meat Department Cutting Test & Yield Management
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml, walked section-by-section
# against references/claim-extraction-guide.md. Depth (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners it already asserts appear here as
# `excluded_because:` stubs citing the covering instance by name.
#
# Shared fixture vocabulary (identical to §1.8 so the two files compose):
#   Department  "Meat 41" / store_code S041, every optional config left at its
#               default: target_margin_pct 0.32, shelf lives 2/5/14 days,
#               max_safe_case_temp_c 4.4, critical_case_temp_c 7.0,
#               pickup_slot_capacity 2, grind_sanitation_buffer_min 30,
#               markdown_floor_pct 0.10, shrink_tolerance_pct 0.015,
#               deposit_rate 0.25.
#   Clock       pinned to 2026-08-05T08:00:00Z unless an instance moves it.
#   P1          BEEF_RIBEYE_LIP_ON, WHOLE_MUSCLE, USA, gross 100.0 lb,
#               receiving_shrink 1.5 lb, invoice 84000, freight 2500,
#               allowance 500  ->  net 98.5 lb, landed 86000 cents,
#               landed_cost_per_lb 873.0964 cents.
#   T1 lines    seq1 SALABLE_CUT RIBEYE_STEAK 62.0 lb @1450 -> RIB01,
#               seq2 GRIND_TRIM 12.0 lb @420 lean 78.0,
#               seq3 GRIND_TRIM 6.5 lb @520 lean 92.0,
#               seq4 FAT_BONE_LOSS 18.0 lb @0        (total 98.5 lb).
#   RIB01       WHOLE_MUSCLE retail item; GRD80 GROUND retail item.
#   Unknown id  "00000000-0000-0000-0000-0000000000ff" is used wherever a
#               deliberately non-existent UUID is needed.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: department_creation_applies_every_optional_config_default
        claim_type: defaults
        grounds:
          - entities.Department.fields.target_margin_pct
          - entities.Department.fields.shelf_life_days_ground
          - entities.Department.fields.max_safe_case_temp_c
          - entities.Department.fields.pickup_slot_capacity
          - entities.Department.fields.grind_sanitation_buffer_min
          - entities.Department.fields.markdown_floor_pct
          - entities.Department.fields.shrink_tolerance_pct
          - entities.Department.fields.deposit_rate
          - entities.Department.fields.case_posture
          - endpoints[POST /meat-ops/departments]
        distinguishing_aspect: "POST /meat-ops/departments with only name and store_code returns 201 and every omitted optional config field carries its declared default, including case_posture SALES_OPEN and all three counters at 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object and meta.api_request_id present"
            - "Department.${dept_id}.target_margin_pct == 0.32"
            - "Department.${dept_id}.shelf_life_days_ground == 2, shelf_life_days_whole_muscle == 5, shelf_life_days_vac_packed == 14"
            - "Department.${dept_id}.max_safe_case_temp_c == 4.4 and critical_case_temp_c == 7.0"
            - "Department.${dept_id}.pickup_slot_capacity == 2 and grind_sanitation_buffer_min == 30"
            - "Department.${dept_id}.markdown_floor_pct == 0.10 and shrink_tolerance_pct == 0.015 and deposit_rate == 0.25"
            - "Department.${dept_id}.case_posture == SALES_OPEN with open_case_failure_count == 0, contained_case_failure_count == 0, consecutive_out_of_spec_readings == 0"

      - name: primal_purchase_creation_returns_full_landed_cost_ledger
        claim_type: creation
        grounds:
          - endpoints[POST /meat-ops/primal-purchases]
          - entities.PrimalPurchase.fields.net_weight_lb
          - entities.PrimalPurchase.fields.landed_cost_total_cents
          - entities.PrimalPurchase.fields.landed_cost_per_lb_cents
          - entities.PrimalPurchase.fields.status
          - calculations.landed_cost_derivation
        distinguishing_aspect: "POST /meat-ops/primal-purchases with all required fields returns 201 and the response already carries the derived ledger: net_weight_lb 98.50, landed_cost_total_cents 86000, landed_cost_per_lb_cents 873.0964, allocated 0, unallocated 86000, status RECEIVED."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists at default config."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "PrimalPurchase.${p1_id}.net_weight_lb == 98.50 (100.0 - 1.5)"
            - "PrimalPurchase.${p1_id}.landed_cost_total_cents == 86000 (84000 + 2500 - 500)"
            - "PrimalPurchase.${p1_id}.landed_cost_per_lb_cents == 873.0964 (86000 / 98.5 rounded half-up to 4dp)"
            - "PrimalPurchase.${p1_id}.allocated_cost_cents == 0 and unallocated_cost_cents == 86000"
            - "PrimalPurchase.${p1_id}.status == RECEIVED"

      - name: primal_purchase_retrieval_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /meat-ops/primal-purchases/{id}]
          - entities.PrimalPurchase.fields.vendor_name
          - entities.PrimalPurchase.fields.country_of_origin
        distinguishing_aspect: "GET /meat-ops/primal-purchases/{id} returns 200 with exactly the stored row — same id, vendor_name 'Prairie Packing', country_of_origin USA, net_weight_lb 98.50 — and does not recompute or mutate anything."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists; PrimalPurchase P1 was created as described in the shared fixture."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "GET /meat-ops/primal-purchases/${p1_id}"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-01"
          assert:
            - "HTTP 200 with data.id == ${p1_id}"
            - "data.vendor_name == 'Prairie Packing', data.country_of_origin == USA, data.primal_code == 'BEEF_RIBEYE_LIP_ON'"
            - "data.net_weight_lb == 98.50 and data.landed_cost_total_cents == 86000"
            - "data.version == ${p1_v} (a read does not bump the version)"

      - name: temperature_log_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /meat-ops/departments/{id}/temperature-logs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With five in-spec readings recorded, GET /meat-ops/departments/{id}/temperature-logs?limit=2&offset=2 returns exactly 2 rows with total_count 5 and has_more true; the same call at offset 4 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Five in-spec readings of 2.0 C on CASE-A were posted in order, so posture stays SALES_OPEN and no CaseFailure exists."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
          trigger:
            - call: "GET /meat-ops/departments/${dept_id}/temperature-logs"
              payload: { limit: 2, offset: 2 }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "GET /meat-ops/departments/${dept_id}/temperature-logs"
              payload: { limit: 2, offset: 4 }
              as: MeatManager
              as_user_id: "mgr-01"
          assert:
            - "First call: HTTP 200, response_type array, len(data) == 2, meta/pagination total_count == 5, has_more == true, limit == 2, offset == 2"
            - "Second call: len(data) == 1, total_count == 5, has_more == false"
            - "Every returned row has out_of_spec == false and consecutive_index == 0"

      - name: retail_item_defaults_leave_it_unpriced
        claim_type: defaults
        grounds:
          - endpoints[POST /meat-ops/retail-items]
          - entities.RetailItem.fields.price_status
          - entities.RetailItem.fields.active_price_per_lb_cents
          - entities.RetailItem.fields.country_of_origin_label
          - entities.RetailItem.fields.shelf_life_days
          - entities.RetailItem.fields.pricing_yield_pct_snapshot
        distinguishing_aspect: "POST /meat-ops/retail-items without target_margin_pct returns 201 with price_status UNPRICED, all four price fields 0, pricing_yield_pct_snapshot 0, shelf_life_days 0 and country_of_origin_label PENDING — shelf life is stamped by the price proposal, not by creation."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists at default config."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
          assert:
            - "HTTP 201 and RetailItem.${ri1_id}.price_status == UNPRICED"
            - "RetailItem.${ri1_id}.provisional_price_per_lb_cents == 0, final_price_per_lb_cents == 0, active_price_per_lb_cents == 0, price_variance_pct == 0"
            - "RetailItem.${ri1_id}.pricing_yield_pct_snapshot == 0 and yield_adjusted_cost_per_lb_cents == 0"
            - "RetailItem.${ri1_id}.shelf_life_days == 0 and country_of_origin_label == PENDING"
            - "RetailItem.${ri1_id}.target_margin_pct is null, so pricing falls back to Department.target_margin_pct 0.32"

      - name: retail_item_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.RetailItem
          - endpoints[POST /meat-ops/retail-items]
        distinguishing_aspect: "The 201 response for a retail item carries server-minted id, created_at, updated_at and version == 1; none of those four names appears in the endpoint's declared input:, so a client value for them cannot be honoured."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists at default config; clock at 2026-08-05T08:00:00Z."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { ri2_id: $.data.id, ri2_v: $.data.version }
          assert:
            - "HTTP 201 with data.id a server-generated identifier != 'GRD80'"
            - "${ri2_v} == 1 on creation"
            - "data.created_at == 2026-08-05T08:00:00Z and data.updated_at == 2026-08-05T08:00:00Z (both stamped from the logical clock)"
            - "GET /meat-ops/retail-items/${ri2_id} returns the same id, created_at and version"

      - name: temperature_log_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.TemperatureLog
          - endpoints[POST /meat-ops/temperature-logs]
          - endpoints[GET /meat-ops/departments/{id}/temperature-logs]
        distinguishing_aspect: "TemperatureLog is declared common_fields: false, so its 201 response exposes no version field and §1.5 declares no update endpoint for it; posting a second reading on the same case_code appends a new row (total_count 2) instead of revising the first."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z; no readings yet."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 2.0 }
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { tlog1_id: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 3.0 }
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { tlog2_id: $.data.id }
            - call: "GET /meat-ops/departments/${dept_id}/temperature-logs"
              payload: { case_code: "CASE-A" }
              as: ServiceClerk
              as_user_id: "clerk-01"
          assert:
            - "Both POSTs return 201 and ${tlog1_id} != ${tlog2_id}"
            - "Neither response carries a version field (TemperatureLog is common_fields: false)"
            - "TemperatureLog.${tlog1_id}.reading_c == 2.0 is unchanged after the second post"
            - "The listing returns total_count == 2 with recorded_by_user_id == 'clerk-01' and taken_at == 2026-08-05T08:00:00Z on both rows"

      - name: retail_item_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /meat-ops/retail-items/{id}]
          - validations[priority=3]
          - errors[ERR_RETAIL_ITEM_NOT_FOUND]
        distinguishing_aspect: "GET /meat-ops/retail-items/00000000-0000-0000-0000-0000000000ff returns ERR_RETAIL_ITEM_NOT_FOUND with HTTP 404 and an error envelope (response_type error), not an empty object with 200."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists; no retail item has been created."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "GET /meat-ops/retail-items/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_nf: $.data.error_id }
          assert:
            - "${err_nf} == ERR_RETAIL_ITEM_NOT_FOUND with HTTP 404"
            - "response_type == error and data.message is a non-empty string"

      - name: case_plan_line_creation_under_unknown_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /meat-ops/case-plans/{id}/lines]
          - validations[priority=3]
          - errors[ERR_CASE_PLAN_NOT_FOUND]
        distinguishing_aspect: "Path ids are validated left to right before the body, so POST /meat-ops/case-plans/{unknown}/lines with an otherwise valid body returns ERR_CASE_PLAN_NOT_FOUND (404) and creates no CasePlanLine."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists with RIB01 PROPOSED; no CasePlan exists."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "POST /meat-ops/case-plans/00000000-0000-0000-0000-0000000000ff/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_plan: $.data.error_id }
          assert:
            - "${err_plan} == ERR_CASE_PLAN_NOT_FOUND with HTTP 404"
            - "GET /meat-ops/case-plan-lines filtered by retail_item_id ${ri1_id} returns total_count == 0"

      - name: grind_input_with_unknown_trim_lot_fk_returns_not_found
        claim_type: graph
        grounds:
          - endpoints[POST /meat-ops/grind-runs/{id}/inputs]
          - validations[priority=5]
          - errors[ERR_TRIM_LOT_NOT_FOUND]
          - entities.GrindInput
        distinguishing_aspect: "GrindInput is the many-to-many junction between GrindRun and TrimLot, so a body FK that does not resolve is caught by the priority-5 existence rule: ERR_TRIM_LOT_NOT_FOUND (404) with the run's batch_weight_lb still 0.00."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; GRD80 (GROUND) exists UNPRICED."
            - "GrindRun GR1 is SCHEDULED for [2026-08-06T06:00:00Z, 2026-08-06T07:00:00Z) with declared_coo USA; no TrimLot exists."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:00:00Z", scheduled_end_at: "2026-08-06T07:00:00Z", target_lean_pct: 80.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/grind-runs/${gr1_id}/inputs"
              payload: { trim_lot_id: "00000000-0000-0000-0000-0000000000ff", input_seq: 1, weight_lb: 5.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_lot: $.data.error_id }
          assert:
            - "${err_lot} == ERR_TRIM_LOT_NOT_FOUND with HTTP 404"
            - "GrindRun.${gr1_id}.batch_weight_lb == 0.00 and coo_label == PENDING and status == SCHEDULED"
            - "GET /meat-ops/grind-inputs filtered by grind_run_id ${gr1_id} returns total_count == 0"

      - name: cutting_test_line_missing_market_value_is_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /meat-ops/cutting-tests/{id}/lines]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "market_value_per_lb_cents is a non-optional member of the endpoint's input list, so omitting it returns ERR_INVALID_REQUEST (400) at priority 4 — before any yield or disposition rule is evaluated — and no line is created."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; PrimalPurchase P1 is RECEIVED; CuttingTest T1 exists in DRAFT with no lines."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
