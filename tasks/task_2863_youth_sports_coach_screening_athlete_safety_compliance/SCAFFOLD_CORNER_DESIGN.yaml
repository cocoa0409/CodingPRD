              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { dz_lodging_error: $.data.error_id }
          assert:
            - "${dz_screen} == DISQUALIFYING_RECORD"
            - "${dz_posture} == OPEN"
            - "${dz_restricted} == 0"
            - "${dz_club_version} >= 2"
            - "${dz_training_error} == ERR_MEMBER_DISQUALIFIED"
            - "${dz_placement_error} == ERR_MEMBER_DISQUALIFIED"
            - "${dz_lodging_error} == ERR_MEMBER_DISQUALIFIED"
            - "HTTP status is 409 on all three triggers"
            - "Member.${m_dz_id}.screening_status == DISQUALIFIED"
            - "Member.${m_dz_id}.membership_status == REVOKED"
            - "GET /safesport/members/${m_dz_id}/screening-orders reports total_count 1"
      - name: lodging_safety_outranks_room_capacity
        claim_type: priority_conflict
        grounds:
          - validations[priority=15]
          - validations[priority=24]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lodging_safety_check_outranks_room_capacity_check
          rationale: "A single request violating both rules is asserted there to return ERR_MINOR_ADULT_LODGING_PROHIBITED."
      - name: occ_check_outranks_the_training_currency_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=18]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_member_version_outranks_the_training_currency_gate
          rationale: "The two simultaneous violations are asserted there to collapse to ERR_STALE_MEMBER_VERSION 412."
      - name: posture_gate_outranks_the_currency_gates
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_club_posture_outranks_screening_currency_gate
          rationale: "A FROZEN club plus an UNSCREENED member is asserted there to return ERR_CLUB_POSTURE_FROZEN."
      - name: caseload_ceiling_is_an_aggregate_over_routed_cases
        claim_type: aggregate_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_BODY_CASELOAD_EXCEEDED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_routing_depends_on_investigating_body_caseload_counter
          rationale: "The at-ceiling refusal and the post-closure success are both asserted there."
      - name: activation_gates_on_the_members_training_dimension
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=18]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coach_assignment_activation_depends_on_member_training_dimension
          rationale: "ERR_TRAINING_NOT_CURRENT and the post-completion success are asserted there."
      - name: measure_window_conflict_is_a_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_MEASURE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / interim_measure_window_closed_buffer_end_is_still_a_conflict
          rationale: "The buffered conflict and the day-after acceptance are both asserted there."

  - section: endpoints
    instances:
      - name: projection_read_defaults_to_audit_snapshot_and_reports_blocking_reasons
        claim_type: computed_read
        grounds:
          - endpoints[GET /safesport/members/{member_id}/eligibility-projection]
          - calculations.member_eligibility_projection.variants
          - entities.Member.fields.contact_eligibility
        distinguishing_aspect: |
          variant is an optional query input, so omitting it must select AUDIT_SNAPSHOT rather
          than erroring or returning the forward-looking view, and for a brand-new member the
          computed read is a pure function of stored state: every expiry null, risk_points 10,
          required_tier TIER_1, and blocking_reasons carrying exactly the two open gates
          (screening and training) rather than an empty array.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists with course SS101 published"
            - "member m_cr was just registered and has no screening order and no training assignment"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Cara Reed", email: "cara.reed@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1997-03-26", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_cr_id: $.data.id }
          trigger:
            - call: "GET /safesport/members/${m_cr_id}/eligibility-projection"
              payload: {}
              as: ComplianceAuditor
              captures: { cr_variant: $.data.variant, cr_projected: $.data.projected_eligible_through, cr_screen_exp: $.data.screening_expiry, cr_train_exp: $.data.training_expiry, cr_screen: $.data.screening_status, cr_train: $.data.training_status, cr_member: $.data.membership_status, cr_contact: $.data.contact_eligibility, cr_tier: $.data.required_tier, cr_points: $.data.risk_points }
            - call: "GET /safesport/members/${m_cr_id}/eligibility-projection"
              payload: { variant: "RENEWAL_FORWARD" }
              as: ComplianceAuditor
              captures: { cr_variant_2: $.data.variant, cr_projected_2: $.data.projected_eligible_through }
          assert:
            - "${cr_variant} == AUDIT_SNAPSHOT"
            - "${cr_projected} == null"
            - "${cr_screen_exp} == null"
            - "${cr_train_exp} == null"
            - "${cr_screen} == UNSCREENED"
            - "${cr_train} == NEVER"
            - "${cr_member} == PENDING"
            - "${cr_contact} == RESTRICTED"
            - "${cr_tier} == TIER_1"
            - "${cr_points} == 10"
            - "the default read's blocking_reasons array has exactly 2 entries, one naming the missing screening and one naming the missing SS101 training"
            - "${cr_variant_2} == RENEWAL_FORWARD"
            - "${cr_projected_2} == null"
      - name: finding_decision_is_bounded_by_the_acting_role_in_both_directions
        claim_type: conditional_action
        grounds:
          - endpoints[POST /safesport/audit-findings/{audit_finding_id}/decision]
          - validations[priority=26]
          - errors[ERR_DECISION_ROLE_MISMATCH]
        distinguishing_aspect: |
          The same endpoint is shared by two roles with disjoint permitted decision values, so
          it must fail in BOTH directions with ERR_DECISION_ROLE_MISMATCH 403 - the
          ClubAdministrator cannot WAIVE and the ComplianceAuditor cannot submit a remediation -
          while each role's own decision succeeds on the very same finding and moves the audit's
          partition counters.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_dr in the sample"
            - "audit audit_dr is FINDINGS_ISSUED with one OPEN MAJOR finding f_dr"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Dara Ruiz", email: "dara.ruiz@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-04-27", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_dr_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_dr_id}"] }
              as: ComplianceAuditor
              captures: { audit_dr_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_dr_id}/findings"
              payload: { finding_code: "TRAINING_OVERDUE", severity: "MAJOR", member_id: "${m_dr_id}", is_repeat: false }
              as: ComplianceAuditor
              captures: { f_dr_id: $.data.id, f_dr_status_0: $.data.status }
            - call: "POST /safesport/club-audits/${audit_dr_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { dr_audit_status: $.data.status }
          trigger:
            - call: "POST /safesport/audit-findings/${f_dr_id}/decision"
              payload: { decision: "WAIVED", note: "club tries to waive its own finding" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { dr_club_waive_error: $.data.error_id }
            - call: "POST /safesport/audit-findings/${f_dr_id}/decision"
              payload: { decision: "REMEDIATION_SUBMITTED", note: "auditor tries to remediate on the club's behalf" }
              as: ComplianceAuditor
              captures: { dr_auditor_remediate_error: $.data.error_id }
            - call: "POST /safesport/audit-findings/${f_dr_id}/decision"
              payload: { decision: "REMEDIATION_SUBMITTED", note: "training records uploaded for the sampled member" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { dr_remediated: $.data.status }
            - call: "POST /safesport/audit-findings/${f_dr_id}/decision"
              payload: { decision: "REMEDIATION_REJECTED", note: "uploaded records do not cover the audit period" }
              as: ComplianceAuditor
              captures: { dr_reopened: $.data.status }
          assert:
            - "${f_dr_status_0} == OPEN"
            - "${dr_audit_status} == FINDINGS_ISSUED"
            - "${dr_club_waive_error} == ERR_DECISION_ROLE_MISMATCH"
            - "${dr_auditor_remediate_error} == ERR_DECISION_ROLE_MISMATCH"
            - "HTTP status is 403 on both refusals"
            - "${dr_remediated} == REMEDIATED"
            - "${dr_reopened} == OPEN"
            - "ClubAudit.${audit_dr_id}.open_finding_count == 1"
            - "ClubAudit.${audit_dr_id}.remediated_finding_count == 0"
            - "ClubAudit.${audit_dr_id}.finding_total_count == 1"
      - name: room_stay_is_reachable_from_both_its_club_and_its_member
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /safesport/clubs/{club_id}/room-stays]
          - endpoints[GET /safesport/members/{member_id}/room-stays]
          - validations[priority=6]
        distinguishing_aspect: |
          An ADULT_MEMBER stay is a link row between Club and Member and must appear in both
          listings for the same id, whereas a MINOR_ATHLETE stay carries no member_id and appears
          only under the club; the same endpoint also enforces the occupant pairing rule, so an
          ADULT_MEMBER payload carrying minor_athlete_age is rejected at priority 6 with
          ERR_VALIDATION 422.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_lk"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Lena Koss", email: "lena.koss@alpha.test", role_type: "CHAPERONE", has_minor_athlete_contact: false, date_of_birth: "1982-05-28", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_lk_id: $.data.id }
          trigger:
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "ADULT_MEMBER", member_id: "${m_lk_id}", trip_label: "SUMMER_CAMP", room_number: "402", check_in: "2026-08-10T15:00:00Z", check_out: "2026-08-12T11:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_lk_id: $.data.id, rs_lk_club: $.data.club_id, rs_lk_member: $.data.member_id, rs_lk_age: $.data.minor_athlete_age }
            - call: "POST /safesport/clubs/${club_a_id}/room-stays"
              payload: { occupant_kind: "ADULT_MEMBER", member_id: "${m_lk_id}", trip_label: "SUMMER_CAMP", room_number: "404", check_in: "2026-08-10T15:00:00Z", check_out: "2026-08-12T11:00:00Z", minor_athlete_age: 15 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_pair_error: $.data.error_id }
            - call: "GET /safesport/members/${m_lk_id}/room-stays"
              payload: { status: "BOOKED" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_member_list_first_id: "$.data[0].id", rs_member_list_first_room: "$.data[0].room_number" }
            - call: "GET /safesport/clubs/${club_a_id}/room-stays"
              payload: { trip_label: "SUMMER_CAMP" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rs_club_list_first_id: "$.data[0].id", rs_club_list_first_room: "$.data[0].room_number" }
          assert:
            - "${rs_lk_club} == ${club_a_id}"
            - "${rs_lk_member} == ${m_lk_id}"
            - "${rs_lk_age} == null"
            - "${rs_pair_error} == ERR_VALIDATION"
            - "HTTP status is 422 on the mismatched occupant pairing"
            - "${rs_member_list_first_id} == ${rs_lk_id}"
            - "${rs_member_list_first_room} == 402"
            - "${rs_club_list_first_id} == ${rs_lk_id}"
            - "${rs_club_list_first_room} == 402"
            - "both listings report total_count 1, so the rejected second booking created nothing"
      - name: repositioning_the_clock_expires_the_screen_and_blocks_activation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /safesport/_clock/set_current_utc]
          - state_machines.Member.screening.CLEARED_to_EXPIRED
          - validations[priority=17]
          - errors[ERR_SCREENING_NOT_CURRENT]
        distinguishing_aspect: |
          The clock endpoint is the only way to observe the lazy CLEARED -> EXPIRED screening
          transition: nothing is written at 2028-07-31 except the clock, yet the member's
          screening dimension reads EXPIRED and the pending placement's activation is refused
          with ERR_SCREENING_NOT_CURRENT 409 - the screening gate at priority 17 outranks the
          training gate at 18 even though the training expiry lapsed a year earlier.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow 500000 and course SS101 (validity_days 365) required for all tiers"
            - "member m_cx was adjudicated CLEAR, so screening_expires_at is 2028-07-31T00:00:00.000Z, and completed SS101 on 2026-08-01, so the training leg expires 2027-08-01T00:00:00.000Z"
            - "m_cx holds one PENDING CoachAssignment ca_cx that has never been activated, so it does not count toward Club.restricted_member_count and the posture stays OPEN"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Cleo Xander", email: "cleo.xander@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1993-06-29", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_cx_id: $.data.id }
            - call: "POST /safesport/members/${m_cx_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_cx_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_cx_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_cx_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
              captures: { cx_expires: $.data.expires_at }
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_cx_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_cx_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta_cx_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments/${ta_cx_id}/complete"
              payload: { score: 85 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/coach-assignments"
              payload: { member_id: "${m_cx_id}", club_id: "${club_a_id}", team_name: "Masters Group", season_start: "2028-09-01T00:00:00Z", season_end: "2029-05-31T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ca_cx_id: $.data.id }
          trigger:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-31T00:00:00Z" }
              as: NgbAdmin
              captures: { cx_clock: $.data.current_utc }
            - call: "GET /safesport/members/${m_cx_id}"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { cx_screen: $.data.screening_status, cx_train: $.data.training_status, cx_member: $.data.membership_status, cx_contact: $.data.contact_eligibility, cx_version: $.data.version }
            - call: "POST /safesport/coach-assignments/${ca_cx_id}/activate"
              payload: { expected_member_version: "${cx_version}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { cx_error: $.data.error_id }
          assert:
            - "${cx_expires} == 2028-07-31T00:00:00.000Z"
            - "${cx_clock} == 2028-07-31T00:00:00.000Z"
            - "${cx_screen} == EXPIRED"
            - "${cx_train} == LAPSED"
            - "${cx_member} == LAPSED"
            - "${cx_contact} == RESTRICTED"
            - "${cx_error} == ERR_SCREENING_NOT_CURRENT"
            - "HTTP status is 409"
            - "CoachAssignment.${ca_cx_id}.status == PENDING"
            - "CoachAssignment.${ca_cx_id}.activated_at == null"
      - name: interim_measure_creation_side_effects_are_fully_asserted
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /safesport/cases/{case_id}/interim-measures].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / interim_measure_four_hop_restriction_cascade
          rationale: "Every declared side effect of that endpoint, across all four hops, is asserted there."
      - name: void_is_the_compensating_action_for_a_screening_order
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /safesport/screening-orders/{screening_order_id}/void].side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_conservation_across_screening_order_and_void
          rationale: "The escrow credit, the retained charged_cents and the reverted screening dimension are all asserted there."
      - name: projection_read_selects_the_requested_variant
        claim_type: computed_read
        grounds:
          - endpoints[GET /safesport/members/{member_id}/eligibility-projection]
        excluded_because:
          difficulty_instance: dual_variant_calc / eligibility_projection_audit_snapshot_vs_renewal_forward
          rationale: "Both variants are requested there over identical rows and produce different projected_eligible_through values."
      - name: activation_is_a_conditional_action_over_three_gates
        claim_type: conditional_action
        grounds:
          - endpoints[POST /safesport/coach-assignments/{coach_assignment_id}/activate]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coach_assignment_activation_depends_on_member_training_dimension
          rationale: "The refusal and the post-completion success of the same activation call are asserted there."
      - name: audit_close_with_sanction_stamps_fines_and_freezes_the_club
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /safesport/club-audits/{club_audit_id}/close].side_effects
        excluded_because:
          difficulty_instance: combinatorial_formula / sanction_fine_rounds_per_finding_before_sum
          rationale: "The SANCTION branch's per-finding fine stamping, the audit total and the club sanction_status are asserted there."

      - name: governing_body_wide_filtered_lists_resolve_every_foreign_key
        claim_type: standard_crud
        grounds:
          - endpoints[GET /safesport/members]
          - endpoints[GET /safesport/screening-orders]
          - endpoints[GET /safesport/training-assignments]
          - endpoints[GET /safesport/room-stays]
          - endpoints[GET /safesport/club-audits]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The governing body reads across clubs, so each cross-club collection must filter on the
          foreign key rather than return everything: club_id partitions the member roster into
          exactly one row per club, member_id partitions the screening orders and training
          assignments, and the read-one form of each child returns the same row the filtered list
          selected - so a list that ignores its filter is caught by the club B assertion.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "clubs 'Alpha Aquatics' (club_a) and 'Beta Bears' (club_b), one member each"
            - "member m_ga of club_a has one screening order, one training assignment and one room stay; club_a has one audit"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
