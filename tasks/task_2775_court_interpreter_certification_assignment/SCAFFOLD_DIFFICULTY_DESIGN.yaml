            - call: "GET /pay-claims"
              payload: { assignment_id: "${a4}" }
              as: FiscalOfficer
              captures: { pc4: "$.data[0].id", pc4_prov: "$.data[0].provisional_total_cents", pc4_travel: "$.data[0].travel_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assignments/${a3}/check-in"
              payload: {}
              as: Interpreter
              as_user_id: "${i1}"
          trigger:
            - call: "POST /assignments/${a3}/complete"
              payload: { actual_end_utc: "2026-09-12T09:45:00.000Z", one_way_miles: 30.0 }
              as: Interpreter
              as_user_id: "${i1}"
          assert:
            - "${h3_score} == 65 and ${h3_class} == B"
            - "${pc3_prov} == 17500 (billable_hours 2.00 from the minimum-call floor x 8750, travel_cents 0 because 30.0 <= 30.0)"
            - "${pc3_travel} == 0"
            - "${pc4_prov} == 21564 (17500 service + round_half_up(2 * 30.1 * 67.5) = 4064 travel)"
            - "${pc4_travel} == 4064 — the 0.1-mile step past the radius bills the whole round trip, not the excess (a one-way or excess-only reading would give 2032 or 14)"
            - "GET /pay-claims/${pc3} returns status == FINALIZED, variant == FINAL"
            - "GET /pay-claims/${pc3} returns billable_hours == 2.00 (raw served window 0.75 h, quarter-hour rounding 0.75, floored up to the 2.00 minimum call)"
            - "GET /pay-claims/${pc3} returns service_cents == 17500, travel_cents == 0, rare_premium_cents == 0, final_total_cents == 17500"
            - "GET /pay-claims/${pc3} returns provisional_total_cents == 17500 — FINAL equals PROVISIONAL exactly, so the ledger delta is 0"
            - "Courthouse.${ch_main}.obligated_pay_cents == 17500 and encumbered_pay_cents == 21564 (only A4 remains encumbered)"
            - "Courthouse.${ch_main}.available_pay_cents == 4960936"
            - "Hearing.${h3}.status == SERVED"

      - name: empty_resolved_pool_reports_coverage_100_while_zero_served_reports_0
        grounds:
          - calculations.language_access_coverage
          - calculations.language_access_coverage.constants
          - entities.UnmetNeedReport.coverage_rate_pct
          - entities.UnmetNeedReport.compliance_status
          - validations[priority=37]
          - endpoints[POST /ops/daily-sweep]
        distinguishing_aspect: |
          Division-by-zero corner: an empty resolved pool is pinned to
          coverage_rate_pct 100.00 / COMPLIANT (not 0.00 and not an error), and a
          CONTINUED hearing plus a still-SCHEDULED hearing are both invisible to the
          pool. After the daily sweep turns the SCHEDULED hearing into UNMET the very
          same window reports 0.00 / NON_COMPLIANT. The window is half-open, and
          period_end == the logical clock instant is accepted while period_end one
          day later is rejected at priority 37.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language spa; courthouse CH_MAIN."
            - "Hearing H6 at CH_MAIN 2026-08-15T09:00-10:00Z, spa, CIVIL_MOTION — CONTINUED (permanently excluded from every counter)."
            - "Hearing H7 at CH_MAIN 2026-08-16T09:00-10:00Z, spa, CIVIL_MOTION — left SCHEDULED and never covered."
            - "Clock then advanced to 2026-09-01T00:00:00Z, exactly the exclusive end of the report window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CV-2026-0601", hearing_type: "CIVIL_MOTION", in_custody: false, scheduled_start: "2026-08-15T09:00:00.000Z", scheduled_end: "2026-08-15T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h6: "$.data.id" }
            - call: "POST /hearings/${h6}/continue"
              payload: { reason_code: "COURT_CONGESTION" }
              as: SchedulingCoordinator
              captures: { h6_status: "$.data.status" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CV-2026-0602", hearing_type: "CIVIL_MOTION", in_custody: false, scheduled_start: "2026-08-16T09:00:00.000Z", scheduled_end: "2026-08-16T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h7: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /unmet-need-reports"
              payload: { courthouse_id: "${ch_main}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: QualityReviewer
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /unmet-need-reports"
              payload: { courthouse_id: "${ch_main}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: QualityReviewer
            - call: "POST /unmet-need-reports"
              payload: { courthouse_id: "${ch_main}", period_start: "2026-08-01", period_end: "2026-09-02" }
              as: QualityReviewer
          assert:
            - "${h6_status} == CONTINUED"
            - "first trigger returns HTTP 201 with resolved_hearing_count == 0, served_hearing_count == 0, unmet_hearing_count == 0, rare_language_unmet_count == 0"
            - "first trigger returns coverage_rate_pct == 100.00 and compliance_status == COMPLIANT (empty-pool convention, not a divide-by-zero error and not 0.00)"
            - "first trigger returns by_language == {} (no Language appears in an empty pool)"
            - "first trigger is accepted although period_end T00:00:00Z equals the logical clock exactly (priority 37 is inclusive at the boundary)"
            - "second trigger (daily sweep) returns unmet_hearing_ids containing exactly ${h7} — the CONTINUED hearing ${h6} is not swept"
            - "third trigger returns resolved_hearing_count == 1, served_hearing_count == 0, unmet_hearing_count == 1, rare_language_unmet_count == 0"
            - "third trigger returns coverage_rate_pct == 0.00 and compliance_status == NON_COMPLIANT"
            - "third trigger returns by_language == { spa: { resolved: 1, served: 0, unmet: 1 } }"
            - "fourth trigger returns HTTP 422 with data.error_id == ERR_REPORT_PERIOD_INVALID (period_end 2026-09-02 is one day past the clock)"
            - "Hearing.${h6}.status == CONTINUED and Hearing.${h7}.status == UNMET"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: credential_activation_gated_on_interpreter_ethics_field_not_on_credential_state
        grounds:
          - state_machines.Credential.PENDING_ETHICS_to_ACTIVE
          - state_machines.Interpreter.CANDIDATE_to_ACTIVE
          - validations[priority=17]
          - errors[ERR_ETHICS_TRAINING_INCOMPLETE]
          - entities.Interpreter.ethics_training_status
          - endpoints[POST /interpreters/{id}/ethics-training]
        distinguishing_aspect: |
          The Credential is in the correct source state PENDING_ETHICS and both
          examinations are passed, yet PENDING_ETHICS -> ACTIVE is refused because a
          field on a DIFFERENT entity (Interpreter.ethics_training_status) is
          NOT_STARTED. The failed attempt must leave the credential in
          PENDING_ETHICS with an unchanged version; recording ethics on the
          interpreter then makes the identical call succeed and bubbles the
          interpreter from CANDIDATE to ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language spa (oral examination available)."
            - "Interpreter Cy Okonkwo created with NO ethics training (ethics_training_status NOT_STARTED)."
            - "Credential targeting CERTIFIED spa: written 86 (>= 80) then oral 74 (>= 70) both passed, so status has reached PENDING_ETHICS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /interpreters"
