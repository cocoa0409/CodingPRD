      - name: not_assigned_reviewer_beats_open_corrections_on_decide
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_NOT_ASSIGNED_REVIEWER]
          - errors[ERR_OPEN_CORRECTIONS]
        distinguishing_aspect: |
          Category pair BUSINESS_REFERENTIAL vs BUSINESS_CONSTRAINT (a different pair from the
          state/fiscal instance): a reviewer who is NOT the assigned PlanReview.reviewer_id
          attempts decision=APPROVED while one OPEN correction exists; both p8 (wrong reviewer,
          403) and p12 (open corrections block APPROVED, 409) would fire, but the
          lower-priority-number referential check wins -> ERR_NOT_ASSIGNED_REVIEWER (403).
        test_recipe:
          setup:
