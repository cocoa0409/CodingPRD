            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
