              captures: { r_f1: $.data.id }
            - call: "POST /nkr/recipients"
              payload: { external_ref: "FR2", home_center_id: "${ctr_f1}", abo_type: "B", cpra_percent: 30, unacceptable_antigens: [] }
              as: CenterCoordinator
              as_user_id: "${ctr_f1}"
              captures: { r_f2: $.data.id }
            - call: "POST /nkr/recipients"
              payload: { external_ref: "FR3", home_center_id: "${ctr_f1}", abo_type: "O", cpra_percent: 10, unacceptable_antigens: [] }
              as: CenterCoordinator
              as_user_id: "${ctr_f1}"
              captures: { r_f3: $.data.id }
            - call: "POST /nkr/recipients/${r_f3}/medical-hold"
              payload: {}
              as: CenterCoordinator
              as_user_id: "${ctr_f1}"
          trigger:
            - call: "GET /nkr/recipients"
              payload: { medical_status: "ON_HOLD" }
              as: RegistryAdmin
          assert:
            - "returned array length == 1"
            - "returned[0].id == ${r_f3}"

      - name: filter_donors_by_donor_kind
        claim_type: standard_crud
        grounds:
          - "endpoints.GET /nkr/donors"
        distinguishing_aspect: "Filter donor_kind=ALTRUISTIC returns only altruistic donors."
        test_recipe:
          setup: ["2 PAIRED donors + 1 ALTRUISTIC donor"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "FD-001", name: "FD1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_fd1: $.data.id }
            - call: "POST /nkr/donors"
              payload: { external_ref: "FDP1", home_center_id: "${ctr_fd1}", abo_type: "A", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_fd1}"
            - call: "POST /nkr/donors"
              payload: { external_ref: "FDP2", home_center_id: "${ctr_fd1}", abo_type: "B", hla_a: "A01,A03", hla_b: "B08,B15", hla_drb1: "DRB1*01,DRB1*03", kdri_score: 90, age_at_registration: 32, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_fd1}"
            - call: "POST /nkr/donors"
              payload: { external_ref: "FDA1", home_center_id: "${ctr_fd1}", abo_type: "O", hla_a: "A11,A26", hla_b: "B35,B51", hla_drb1: "DRB1*11,DRB1*13", kdri_score: 50, age_at_registration: 28, donor_kind: "ALTRUISTIC" }
              as: CenterCoordinator
              as_user_id: "${ctr_fd1}"
              captures: { d_fda: $.data.id }
          trigger:
            - call: "GET /nkr/donors"
              payload: { donor_kind: "ALTRUISTIC" }
              as: RegistryAdmin
          assert:
            - "returned array length == 1"
            - "returned[0].id == ${d_fda}"

  # =========================================================================
  # Section: errors (continued)
  # =========================================================================
  - section: errors
    instances:
      - name: review_deadline_passed_error_triggered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REVIEW_DEADLINE_PASSED]"
        distinguishing_aspect: "Crossmatch review submitted after crossmatch_deadline_utc returns ERR_REVIEW_DEADLINE_PASSED."
        test_recipe:
          setup: ["Offer PENDING_CROSSMATCH; logical clock advanced past deadline"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_REVIEW_DEADLINE_PASSED"

      - name: pair_not_incompatible_error_triggered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PAIR_NOT_INCOMPATIBLE]"
        distinguishing_aspect: "ABO-compatible pair with no antigen sensitization and no opt-in -> ERR_PAIR_NOT_INCOMPATIBLE."
        test_recipe:
          setup: ["Pair with O-donor and A-recipient (compatible), no unacceptable antigens, no opt-in"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_PAIR_NOT_INCOMPATIBLE"

      - name: segregation_of_duties_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Same RegistryAdmin who submitted claim cannot adjudicate it."
        test_recipe:
          setup: ["Claim submitted by user U; U attempts to approve"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: chain_locked_error_on_supersede
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CHAIN_LOCKED]"
        distinguishing_aspect: "Chain run supersede rejected when child chain is LOCKED."
        test_recipe:
          setup: ["Chain run EXECUTED -> PUBLISHED; one chain LOCKED"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_CHAIN_LOCKED"

  # =========================================================================
  # Section: rbac (continued)
  # =========================================================================
  - section: rbac
    instances:
      - name: registry_admin_cannot_complete_nephrectomy
        claim_type: role_denial
        grounds:
          - "roles.RegistryAdmin"
          - "endpoints.POST /nkr/donors/{donor_id}/complete-nephrectomy"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "RegistryAdmin lacks permission to mark nephrectomy complete (CenterCoordinator exclusive)."
        test_recipe:
          setup: ["Donor in SURGERY_SCHEDULED"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: center_coordinator_cannot_release_slot
        claim_type: role_denial
        grounds:
          - "roles.CenterCoordinator"
          - "endpoints.POST /nkr/slots/{slot_id}/release"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Slot release is MatchOperator exclusive."
        test_recipe:
          setup: ["Center A; reserved slot"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: logistics_cannot_run_chain
        claim_type: role_denial
        grounds:
          - "roles.LogisticsCoordinator"
          - "endpoints.POST /nkr/chain-runs"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "LogisticsCoordinator cannot create chain runs."
        test_recipe:
          setup: ["Empty"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /nkr/chain-runs"
              payload: { run_label: "test" }
              as: LogisticsCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

  # =========================================================================
  # Section: cross_cutting_layers (continued)
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_correct_version_succeeds
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[chain-lock-stale-version]"
        distinguishing_aspect: "Chain lock with correct expected_chain_version succeeds."
        test_recipe:
          setup: ["Chain in ACCEPTING, all offers CENTER_ACCEPTED; client reads version V"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "POST /nkr/chains/{c}/lock with expected_chain_version=V succeeds -> 200"
            - "Chain.version incremented to V+1"

      - name: pagination_with_filtering_interaction
        claim_type: pagination_with_filtering
        grounds:
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "List endpoints honor limit/offset while applying filters."
        test_recipe:
          setup: ["Multiple donors, filter by medical_status=CLEARED, paginate limit=1 offset=1"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/donors"
              payload: { medical_status: "CLEARED", limit: 1, offset: 1 }
              as: RegistryAdmin
          assert:
            - "filtered + paginated list returned"
            - "has_more reflects remaining filtered count"
