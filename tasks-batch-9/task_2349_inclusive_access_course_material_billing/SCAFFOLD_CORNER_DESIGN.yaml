      - name: calc_constants_rebate_threshold_and_pct_applied
        claim_type: constants_applied
        grounds:
          - calculations.settlement_amount
          - calculations.settlement_amount.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_rebate_threshold_tested_on_gross_then_subtracted
          rationale: "That §1.8 instance pins rebate_threshold_cents, rebate_pct and VARIANCE_TOLERANCE_CENTS against literal invoice figures on both sides of the threshold."

      - name: calc_waterfall_gross_then_rebate_then_settlement
        claim_type: waterfall_allocation
        grounds:
          - calculations.settlement_amount
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_rebate_threshold_tested_on_gross_then_subtracted
          rationale: "The pinned evaluation order (gross -> rebate on gross -> settlement = gross - rebate, never re-tested) is exactly what that §1.8 instance falsifies."

      - name: calc_variant_divergence_between_reconciliation_methods
        claim_type: variant_divergence
        grounds:
          - calculations.reconciliation_totals.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_reconciliation_enrollment_snapshot_versus_access_days_weighted
          rationale: "Both methods are run over identical stored data there and the literal delta between the two invoices is asserted."

      - name: calc_variant_selection_of_tier_basis_by_context
        claim_type: variant_selection
        grounds:
          - calculations.per_student_negotiated_price.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_tier_basis_posting_snapshot_versus_census_date
          rationale: "That instance asserts the production path uses the frozen posting snapshot while the billing-summary read exposes the census basis, for one section whose headcount crossed a band edge."

      - name: calc_reconciliation_delta_when_method_switches
        claim_type: reconciliation
        grounds:
          - calculations.reconciliation_totals.variants
          - endpoints[POST /reconciliation-runs]
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_reconciliation_enrollment_snapshot_versus_access_days_weighted
          rationale: "The superseding second run with the other method is issued there and the SUPERSEDED prior run plus the invoice delta are asserted."

      - name: calc_chronological_processing_order_of_run_scope
        claim_type: chronological
        grounds:
          - calculations.reconciliation_totals
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_reconciliation_enrollment_snapshot_versus_access_days_weighted
          rationale: "Order sensitivity (created_at ASC, then Student.external_id ASC) is exercised there over a mixed-status charge set; per-line rounding independence makes the sum order-invariant, which that instance asserts."

      - name: calc_aggregation_participation_rate_recomputed
        claim_type: aggregation
        grounds:
          - calculations.section_participation_rate
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_participation_rate_exactly_at_min_stays_billed
          rationale: "The aggregation and its >= comparison at exactly 0.5000 are asserted there, including the AT_RISK flip one seat below the boundary."

      - name: calc_weighted_scoring_affordability_savings_pct
        claim_type: weighted_scoring
        grounds:
          - calculations.affordability_metrics
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_state_savings_pct_exactly_at_min_threshold_is_compliant
          rationale: "savings_pct at exactly STATE_MIN_SAVINGS_PCT and one cent either side of it is asserted there with literal totals."

      - name: calc_constraint_propagation_of_rebill_delta
        claim_type: constraint_propagation
        grounds:
          - calculations.rebill_delta
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_title_change_rebill_four_hops_after_billing
          rationale: "The rebill credit/charge pair, the preserved proration_pct and the frozen tier basis are all asserted along that four-hop cascade."

      - name: calc_projection_of_conservation_invariants
        claim_type: projection
        grounds:
          - calculations.bursar_money_conservation_invariant
          - calculations.entitlement_conservation_invariant
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_grant_then_rescind_conserves_bursar_money
          rationale: "Ledger replay against net_billed_cents and bursar_balance_cents with zero drift is the assertion core of that instance and of compensating_rebill_conserves_entitlement_seats_while_money_moves."

  - section: validations
    instances:
      - name: validation_term_workflow_gate_blocks_flagging_and_submission
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - validations[priority=48]
          - errors[ERR_TERM_NOT_OPEN]
          - errors[ERR_TERM_BILLING_LOCKED]
        distinguishing_aspect: |
          The term gates are two different rules with two different admissible sets: adoption submit
          and approve accept PLANNING as well as OPEN, while flagging demands OPEN outright, and once
          the term is BILLING_LOCKED the money endpoints report ERR_TERM_BILLING_LOCKED (48) whereas
          the workflow endpoints report ERR_TERM_NOT_OPEN (50). Flagging is refused in PLANNING both
          before and after the adoption is approved, proving gate 50 is independent of gate 67.
        test_recipe:
          setup:
            - "Term FA26 left in PLANNING; PUB-A ACTIVE with tiered titles T1 and T5; section ECON-101-001 (fac-1) with a DRAFT adoption on T1. Clock 2026-07-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000005-0", title: "Economics Essentials", list_price_cents: 12000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t5_id: $.data.id }
            - call: "POST /titles/${t5_id}/pricing-tiers"
              payload: { min_enrollment: 1, per_student_price_cents: 6000 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt1_id: $.data.id }
          trigger:
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /adoptions/${adopt1_id}/submit"
              as: Faculty
              as_user_id: "fac-1"
            - call: "POST /adoptions/${adopt1_id}/approve"
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /sections/${sec_id}/flag-inclusive-access"
              as: ProgramAdmin
              captures: { sec_v2: $.data.version }
            - call: "POST /terms/${term_id}/lock-billing"
              as: ProgramAdmin
            - call: "POST /sections/${sec_id}/post-charges"
              as: BursarOfficer
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t5_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v2}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { adopt5_id: $.data.id }
            - call: "POST /adoptions/${adopt5_id}/submit"
              as: Faculty
              as_user_id: "fac-1"
          assert:
            - "Trigger call 1 -> HTTP 409 ERR_TERM_NOT_OPEN: flagging requires term.status == OPEN and FA26 is PLANNING"
            - "Trigger call 2 -> HTTP 200 and trigger call 3 -> HTTP 200: submit and approve accept PLANNING (gate 50 admits {PLANNING, OPEN} for those two endpoints)"
            - "Trigger call 4 -> HTTP 409 ERR_TERM_NOT_OPEN even though the adoption is now APPROVED - the term gate is not satisfied by satisfying gate 67"
            - "Trigger call 6 -> HTTP 200: CourseSection.${sec_id}.ia_status == FLAGGED and AcademicTerm.${term_id}.ia_section_count == 1"
            - "Trigger call 7 -> HTTP 200: AcademicTerm.${term_id}.status == BILLING_LOCKED"
            - "Trigger call 8 -> HTTP 409 ERR_TERM_BILLING_LOCKED - the money gate (48) fires, not ERR_TERM_NOT_OPEN"
            - "Trigger call 9 -> HTTP 201 (authoring a DRAFT adoption is never term-gated) but trigger call 10 -> HTTP 409 ERR_TERM_NOT_OPEN because BILLING_LOCKED is outside {PLANNING, OPEN}"
            - "Adoption.${adopt5_id}.status is still DRAFT and CourseSection.${sec_id}.ia_status is still FLAGGED with billing_basis_enrollment_count == null"

      - name: validation_posting_requires_flagged_section_and_approved_adoption
        claim_type: violation_to_error
        grounds:
          - validations[priority=52]
          - validations[priority=67]
          - errors[ERR_SECTION_NOT_FLAGGED]
          - errors[ERR_ADOPTION_NOT_APPROVED]
        distinguishing_aspect: |
          Posting and flagging guard different halves of the same posture: posting a NOT_FLAGGED
          section reports ERR_SECTION_NOT_FLAGGED (52) even though the deeper cause is the missing
          approval, while flagging that same section reports ERR_ADOPTION_NOT_APPROVED (67). Once the
          adoption is approved and the section flagged, the identical posting call succeeds.
        test_recipe:
          setup:
            - "Term FA26 OPEN; PUB-A ACTIVE with tiered title T1; sections ECON-101-001 (fac-1, DRAFT adoption on T1) and ECON-101-002 (fac-2, no adoption at all); one student enrolled in ECON-101-001 on 2026-08-24. Clock 2026-08-24T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
