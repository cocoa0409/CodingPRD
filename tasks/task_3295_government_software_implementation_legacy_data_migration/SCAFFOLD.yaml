scenario: 'Government Software Implementation & Legacy Data Migration (Tyler Technologies): contract award through public procurement with implementation phases, milestone payments and acceptance criteria,
  business process analysis with agency workflow mapping and configuration decisions documented for audit, legacy data extraction, cleansing and migration with reconciliation reports and historical record
  fidelity requirements, interface development to state systems, courts, payment processors and reporting repositories, user acceptance testing with agency staff availability constraints and parallel operations,
  go-live scheduling around statutory deadlines, election calendars and fiscal year boundaries, training delivery and change management for long-tenured staff, post-implementation support transition and
  annual maintenance

  '
domain_name: gov-implementation-migration
api_prefix: /programs
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Agency
  parent: null
  common_fields: true
  fields:
  - name: agency_code
    type: string
    source: input
    description: Unique agency identifier (e.g. REV, COURT, FIN)
  - name: display_name
    type: string
    source: input
    description: Agency display name
  - name: primary_time_zone
    type: string
    source: input
    default: America/Chicago
    description: IANA zone used to localize statutory calendar windows
  - name: status
    type: enum
    source: system
    description: ACTIVE | ARCHIVED; ARCHIVED agencies reject all new child creation
- name: StatutoryCalendarWindow
  parent: null
  common_fields: true
  fields:
  - name: agency_id
    type: string
    source: input
    description: FK -> Agency.id; window belongs to exactly one agency
  - name: kind
    type: enum
    source: input
    description: STATUTORY_DEADLINE | ELECTION_FREEZE | FISCAL_YEAR_END
  - name: starts_on
    type: string
    source: input
    description: ISO date, inclusive
  - name: ends_on
    type: string
    source: input
    description: ISO date, inclusive (closed interval)
  - name: blackout
    type: boolean
    source: input
    description: true = go-live forbidden inside window; false = informational only
  - name: description
    type: string
    source: input
    description: Human-readable statutory citation
- name: StaffMember
  parent: null
  common_fields: true
  fields:
  - name: agency_id
    type: string
    source: input
    description: FK -> Agency.id
  - name: full_name
    type: string
    source: input
    description: Staff display name
  - name: email
    type: string
    source: input
    description: Unique per agency
  - name: tenure_years
    type: integer
    source: input
    description: Years of service; >= 10 flags long-tenured change-management path
  - name: staff_function
    type: enum
    source: input
    description: SUBJECT_MATTER_EXPERT | UAT_TESTER | TRAINEE | PROJECT_SPONSOR
  - name: status
    type: enum
    source: system
    description: ACTIVE | INACTIVE
- name: ProcurementContract
  parent: null
  common_fields: true
  fields:
  - name: agency_id
    type: string
    source: input
    description: FK -> Agency.id; owning agency
  - name: solicitation_number
    type: string
    source: input
    description: Unique RFP/bid number
  - name: vendor_name
    type: string
    source: input
    description: Awarded vendor legal name
  - name: contract_value_cents
    type: integer
    source: input
    description: Total awarded value in cents; milestone billable amounts may never exceed this
  - name: status
    type: enum
    source: system
    description: DRAFT | POSTED | Q&A_OPEN | Q&A_CLOSED | EVALUATION | AWARD_PENDING | AWARDED | IMPLEMENTATION | CLOSED | PROTESTED | CANCELLED
  - name: awarded_at
    type: datetime
    source: system
    default: null
    description: Set on EVALUATION -> AWARDED transition
  - name: version
    type: integer
    source: system
    description: OCC token for award/milestone mutations
- name: ContractPhase
  parent: ProcurementContract
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: sequence_no
    type: integer
    source: input
    description: Strictly increasing per contract starting at 1; no gaps
  - name: name
    type: string
    source: input
    description: e.g. ANALYSIS, CONFIGURATION, MIGRATION, INTERFACES, UAT, TRAINING, GO_LIVE, SUPPORT_TRANSITION
  - name: planned_start_on
    type: string
    source: input
    description: ISO date
  - name: planned_end_on
    type: string
    source: input
    description: ISO date; >= planned_start_on
  - name: status
    type: enum
    source: system
    description: PLANNED | ACTIVE | COMPLETED | CANCELLED
- name: Milestone
  parent: ContractPhase
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id (denormalized for cross-entity gates)
  - name: phase_id
    type: string
    source: system
    description: FK -> ContractPhase.id
  - name: code
    type: string
    source: input
    description: Unique per contract (e.g. M1-DISCOVERY)
  - name: description
    type: string
    source: input
    description: Milestone narrative
  - name: billable_amount_cents
    type: integer
    source: input
    description: Payment released on acceptance
  - name: billing_variant
    type: enum
    source: input
    default: PAYMENT_ON_ACCEPTANCE
    description: "PAYMENT_ON_ACCEPTANCE | RETAINAGE_HELD \u2014 retainage variant withholds RETAINAGE_PCT until go-live"
  - name: status
    type: enum
    source: system
    description: PLANNED | READY_FOR_REVIEW | ACCEPTED | REJECTED | INVOICED | PAID
  - name: rejection_count
    type: integer
    source: system
    default: 0
    description: Increments on each ACCEPTED->REJECTED loop
  - name: accepted_at
    type: datetime
    source: system
    default: null
    description: Timestamp of most recent acceptance
- name: AcceptanceCriterion
  parent: Milestone
  common_fields: true
  fields:
  - name: milestone_id
    type: string
    source: system
    description: FK -> Milestone.id
  - name: code
    type: string
    source: input
    description: Unique per milestone (e.g. AC-01)
  - name: narrative
    type: string
    source: input
    description: Auditable criterion text
  - name: result
    type: enum
    source: system
    description: PENDING | SATISFIED | FAILED | WAIVED
  - name: waiver_reason
    type: string
    source: system
    default: null
    description: Required when result == WAIVED; empty otherwise
- name: WorkflowProcess
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: name
    type: string
    source: input
    description: Agency business process name (e.g. Business-License-Issuance)
  - name: as_is_summary
    type: string
    source: input
    description: Current-state narrative from business process analysis
  - name: to_be_summary
    type: string
    source: input
    description: Future-state narrative
  - name: map_revision
    type: integer
    source: system
    default: 1
    description: Increments on every MAP->REVIEW->REWORK->MAP cycle
  - name: status
    type: enum
    source: system
    description: DRAFT | MAPPED | IN_REVIEW | REWORK | APPROVED | RETIRED
- name: ConfigurationDecision
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: workflow_process_id
    type: string
    source: input
    description: FK -> WorkflowProcess.id; decision must belong to a MAPPED or APPROVED process
  - name: decision_key
    type: string
    source: input
    description: Unique per contract (e.g. GL-SEGMENT-DELIMITER)
  - name: chosen_value
    type: string
    source: input
    description: Selected configuration value
  - name: rationale
    type: string
    source: input
    description: Audit rationale
  - name: recorded_by_role
    type: string
    source: system
    description: Role that proposed the decision; segregation-of-duties input
  - name: status
    type: enum
    source: system
    description: PROPOSED | RATIFIED | REJECTED | SUPERSEDED
  - name: supersedes_decision_id
    type: string
    source: input
    default: null
    description: FK -> ConfigurationDecision.id; when set, the referenced decision moves to SUPERSEDED on ratification
- name: MigrationBatch
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: domain
    type: enum
    source: input
    description: ACCOUNTS_RECEIVABLE | PROPERTY_TAX | COURT_CASES | LICENSES | PAYROLL
  - name: source_system_label
    type: string
    source: input
    description: Legacy system of record label
  - name: expected_record_count
    type: integer
    source: input
    description: Declared legacy row count for reconciliation
  - name: expected_net_value_cents
    type: integer
    source: input
    description: Declared legacy signed net value for reconciliation
  - name: status
    type: enum
    source: system
    description: DEFINED | EXTRACTED | CLEANSED | LOADED | RECONCILED | RECONCILE_FAILED | ACCEPTED
  - name: extracted_at
    type: datetime
    source: system
    default: null
  - name: loaded_at
    type: datetime
    source: system
    default: null
- name: MigrationRecord
  parent: null
  common_fields: false
  fields:
  - name: batch_id
    type: string
    source: system
    description: FK -> MigrationBatch.id
  - name: legacy_primary_key
    type: string
    source: input
    description: Original system key; unique per batch; historical fidelity anchor
  - name: field_payload
    type: object
    source: input
    description: Raw legacy row
  - name: issue_code
    type: enum
    source: system
    default: null
    description: null | DUPLICATE_KEY | MISSING_REQUIRED_FIELD | OUT_OF_RANGE_DATE | ORPHAN_REFERENCE | INVALID_CODE_VALUE
  - name: resolution
    type: enum
    source: system
    default: null
    description: null | QUARANTINED | CORRECTED | EXCLUDED
  - name: signed_value_cents
    type: integer
    source: input
    default: 0
    description: Signed ledger value feeding reconciliation
  - name: loaded
    type: boolean
    source: system
    default: false
    description: true once CLEANSE resolves and batch moves to LOADED
- name: ReconciliationReport
  parent: null
  common_fields: false
  fields:
  - name: batch_id
    type: string
    source: system
    description: FK -> MigrationBatch.id; exactly one report per reconciliation run set
  - name: run_variant
    type: enum
    source: system
    description: "FORWARD | CHRONOLOGICAL \u2014 which matching variant produced this report"
  - name: expected_record_count
    type: integer
    source: system
    description: Snapshot of batch expectation at run time
  - name: loaded_record_count
    type: integer
    source: system
    description: Count of MigrationRecord with loaded == true
  - name: expected_net_value_cents
    type: integer
    source: system
  - name: loaded_net_value_cents
    type: integer
    source: system
  - name: count_delta
    type: integer
    source: computed
    description: loaded_record_count - expected_record_count
  - name: value_delta_cents
    type: integer
    source: computed
    description: loaded_net_value_cents - expected_net_value_cents
  - name: within_tolerance
    type: boolean
    source: computed
    description: true iff |count_delta| == 0 AND |value_delta_cents| <= tolerance for the batch domain
- name: InterfaceEndpoint
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: name
    type: string
    source: input
    description: e.g. State-Revenue-Gateway
  - name: direction
    type: enum
    source: input
    description: OUTBOUND | INBOUND
  - name: endpoint_kind
    type: enum
    source: input
