    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: ["batch_id?", "check_type?", "limit?", "offset?"]
    output: CCPCheck[]
    side_effects: []
  - method: GET
    path: "/plant/production-batches/{batchId}/ccp-checks"
