        test_recipe:
          setup:
            - "Base fixture; a GENERAL item stored in G-01, transferred to L-200 for lab analysis and released, so custody_state == CHECKED_OUT and G-01.occupied_slots == 1."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_lab
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Swab kit for typing", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 1500, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-10T09:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { transfer_id: $.data.id }
            - call: "POST /custody-transfers/${transfer_id}/release"
              payload: { released_signature: "sig-release-1" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /custody-transfers/${transfer_id}/report-lost"
              payload: { reason: "Not returned by the laboratory courier" }
              as: PropertyRoomManager
              captures: { transfer_status: $.data.status, denial: $.data.denial_reason }
          assert:
            - "${transfer_status} == 'LOST' and ${denial} == 'Not returned by the laboratory courier'"
            - "GET /evidence-items/${item_id} shows custody_state == 'MISSING' and current_holder_id == null, while disposition_state is still 'RETAINED' (the other dimension is untouched)"
            - "GET /storage-locations/${loc_g_id} shows occupied_slots == 0: the MISSING item releases its slot per calculations.location_occupied_slots"
            - "GET /discrepancies?evidence_item_id=${item_id} returns total_count == 1 with kind == 'MISSING', status == 'OPEN' and audit_session_id == null (a standalone discrepancy, raised outside any audit)"
            - "GET /property-rooms/${room_id} shows open_discrepancy_count == 1, missing_high_risk_count == 0 (category GENERAL is not FIREARM/CURRENCY/NARCOTICS) and posture == 'RESTRICTED'"
            - "GET /chain-events?evidence_item_id=${item_id} returns total_count == 4 with sequence_no 4 carrying event_type == 'DISCREPANCY_RAISED'"

      - name: evidence_item_parallel_dimensions_change_independently
        claim_type: Independent state dimensions change independently (shape parallel)
        excluded_because:
          difficulty_instance: evidence_item_parallel_custody_and_disposition_dimensions_advance_independently
          rationale: "The §1.8 instance already walks custody_state LOGGED->STORED->CHECKED_OUT->STORED while disposition_state independently walks RETAINED->DISPOSAL_ELIGIBLE->ORDER_PENDING->RETAINED, asserting the combined state after every step; a breadth duplicate would test the same pair of dimensions on the same entity."

      - name: case_cycles_between_adjudicated_and_appeal_pending
        claim_type: Entity can loop back (shape cyclic)
        excluded_because:
          difficulty_instance: case_adjudicated_appeal_pending_cycle_recomputes_retention_twice
          rationale: "The §1.8 instance drives ADJUDICATED -> APPEAL_PENDING -> ADJUDICATED and pins the retention rewrite on each pass of the loop, which is exactly the cyclic-shape claim."

      - name: adjudicate_cascades_down_to_child_items
        claim_type: Cascade down (side effect pattern)
        excluded_because:
          difficulty_instance: case_adjudicate_cascades_to_disposal_eligibility_counter
          rationale: "The §1.8 transitive cascade already verifies that a single adjudicate rewrites every child item's retention, flips the matured ones to DISPOSAL_ELIGIBLE and re-derives the room counter, covering both the cascade-down and the ledger-sync patterns for this transition."

      - name: missing_discrepancy_resolution_compensates_slot_ledger
        claim_type: Compensation (side effect pattern)
        excluded_because:
          difficulty_instance: missing_then_found_restores_location_occupied_slots
          rationale: "The §1.8 compensating-invariant instance asserts occupied_slots 1 -> 0 -> 1 with no drift across the MISSING/FOUND round trip, which is the compensation claim for this machine."

      - name: retention_determination_guarded_by_case_state
        claim_type: guarded transitions (cross-entity precondition)
        excluded_because:
          difficulty_instance: final_retention_requires_case_adjudicated
          rationale: "The §1.8 cross-entity dependency instance already tests that a FINAL determination is refused unless the parent Case is ADJUDICATED, and succeeds immediately after adjudication."

  # ===========================================================================
  - section: calculations
    instances:

      - name: barcode_check_digit_sequence_within_case
        claim_type: Correct Result (projection)
        grounds:
          - "calculations.barcode_assignment"
          - "entities.EvidenceItem.fields.barcode"
          - "entities.EvidenceItem.fields.item_sequence"
          - "entities.PropertyRoom.fields.agency_code"
        test_recipe:
          setup:
            - "Base fixture plus a second room MPD 'North District Annex' with its own bin, technician and case 26-90001."
            - "Three items are logged into CPD case 26-00001 and one into MPD case 26-90001."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_case1
            - &c_room2
              call: "POST /property-rooms"
              payload: { name: "North District Annex", agency_code: "MPD" }
              as: PropertyRoomManager
              captures: { room2_id: $.data.id, room2_v: $.data.version }
            - &c_loc_g2
              call: "POST /storage-locations"
              payload: { property_room_id: "${room2_id}", code: "G-01", category: "GENERAL", capacity_slots: 4 }
              as: PropertyRoomManager
              captures: { loc_g2_id: $.data.id, loc_g2_v: $.data.version }
            - &c_tech_m
              call: "POST /custodians"
              payload: { property_room_id: "${room2_id}", badge_number: "T-100", full_name: "Mara Diaz", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { tech_m_id: $.data.id }
            - &c_case_m
              call: "POST /cases"
              payload: { property_room_id: "${room2_id}", case_number: "26-90001", offense_statute_id: "${th3_id}" }
              as: PropertyRoomManager
              captures: { case_m_id: $.data.id }
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Sequence one", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { b1: $.data.barcode }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Sequence two", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { b2: $.data.barcode }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Sequence three", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { b3: $.data.barcode }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_m_id}", item_description: "Other agency item", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_m_id}"
              captures: { bm: $.data.barcode }
          assert:
            - "${b1} == 'CPD-26-00001-0001-2' (weighted sum 18 over the digits 2 6 0 0 0 0 1 0 0 0 1, check digit (10 - 8) mod 10 == 2)"
            - "${b2} == 'CPD-26-00001-0002-9' (weighted sum 21, check digit 9)"
            - "${b3} == 'CPD-26-00001-0003-6' (weighted sum 24, check digit 6)"
            - "item_sequence is 1, 2, 3 in creation order and is scoped to the case, not to the room"
            - "${bm} == 'MPD-26-90001-0001-5': the same sequence 0001 yields a different check digit because the agency_code and case_number digits feed the weighted sum"
            - "All four barcodes are distinct and each carries exactly one check digit character after the final hyphen"

      - name: storage_autoselect_picks_tightest_fit_location
        claim_type: waterfall_allocation (first bucket fills before second)
        grounds:
          - "calculations.storage_location_autoselect"
          - "endpoints[POST /evidence-items/{itemId}/storage-assignment]"
          - "entities.StorageLocation.fields.occupied_slots"
        test_recipe:
          setup:
            - "Base fixture; G-01 (capacity 2) and G-09 (capacity 1) are both empty and OPEN, and two GENERAL items are logged into case 26-00001."
            - "G-09 is created after G-01, so created_at ASC would favour G-01 if free-slot ranking did not decide first."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_loc_g9
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Autoselect item one", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 1000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Autoselect item two", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 1000, seized_at: "2026-07-31T12:05:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item2_id: $.data.id }
          trigger:
            - call: "POST /evidence-items/${item1_id}/storage-assignment"
              payload: {}
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { first_choice: $.data.storage_location_id }
            - call: "POST /evidence-items/${item2_id}/storage-assignment"
              payload: {}
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { second_choice: $.data.storage_location_id }
          assert:
            - "${first_choice} == ${loc_g9_id}: with 1 free slot G-09 is tighter than G-01's 2 free slots, so the smaller bucket fills first"
            - "${second_choice} == ${loc_g_id}: G-09 is now full (occupied_slots == capacity_slots == 1) and drops out of the eligible pool, so the overflow lands in G-01"
            - "GET /storage-locations/${loc_g9_id} shows occupied_slots == 1 and GET /storage-locations/${loc_g_id} shows occupied_slots == 1"
            - "Both items report custody_state == 'STORED'; neither response cites an id-based tiebreak, the ranking is (free slots ASC, capacity ASC, created_at ASC)"

      - name: settled_commission_tier_boundary_at_fifty_thousand
        claim_type: tiered_pricing (each tier boundary tested)
        grounds:
          - "calculations.disposition_proceeds"
          - "entities.DispositionOrder.fields.commission_cents"
          - "entities.DispositionOrder.fields.settled_net_proceeds_cents"
          - "state_machines.DispositionOrder.EXECUTED_to_SETTLED"
        test_recipe:
          setup:
            - "Base fixture; two GENERAL items appraised 40000 and 60000 are logged into case 26-00002 (statute AB-1, 0/0) at clock 2026-08-01 and stored in G-01 (capacity 2)."
            - "The case is charged, the clock advanced to 2026-10-30 and the case adjudicated, so the FINAL retention floor intake + 90 days has matured and both items become DISPOSAL_ELIGIBLE."
            - "Two AUCTION orders with reserve 10000 are created, court-authorized and executed at 2026-10-30, giving exactly 90 storage days at the GENERAL rate of 25 cents/day."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_ab1
            - *c_loc_g
            - *c_tech
            - *c_tech2
            - *c_inv
            - *c_aud
            - *c_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Auction lot at the tier edge", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 40000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemA_id: $.data.id }
            - call: "POST /evidence-items/${itemA_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Auction lot one cent above the edge", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 60000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemB_id: $.data.id }
            - call: "POST /evidence-items/${itemB_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${itemA_id}", type: "AUCTION", requested_by_custodian_id: "${tech_id}", reserve_price_cents: 10000 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { orderA_id: $.data.id, estA: $.data.estimated_net_proceeds_cents }
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${itemB_id}", type: "AUCTION", requested_by_custodian_id: "${tech_id}", reserve_price_cents: 10000 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { orderB_id: $.data.id, estB: $.data.estimated_net_proceeds_cents }
            - call: "POST /disposition-orders/${orderA_id}/authorize"
              payload: { court_order_number: "CO-2026-0101" }
              as: CourtClerk
            - call: "POST /disposition-orders/${orderB_id}/authorize"
              payload: { court_order_number: "CO-2026-0102" }
              as: CourtClerk
            - call: "POST /disposition-orders/${orderA_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${aud_id}" }
              as: PropertyRoomManager
            - call: "POST /disposition-orders/${orderB_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${aud_id}" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /disposition-orders/${orderA_id}/settle"
              payload: { gross_sale_cents: 50000 }
              as: PropertyRoomManager
              captures: { commA: $.data.commission_cents, recA: $.data.storage_recovery_cents, netA: $.data.settled_net_proceeds_cents }
            - call: "POST /disposition-orders/${orderB_id}/settle"
              payload: { gross_sale_cents: 50001 }
              as: PropertyRoomManager
              captures: { commB: $.data.commission_cents, recB: $.data.storage_recovery_cents, netB: $.data.settled_net_proceeds_cents }
          assert:
            - "At the inclusive tier edge gross == 50000 the LOW rate 0.15 applies: ${commA} == 7500, subtotal 42500, raw recovery 90 * 25 == 2250, cap floor(42500 * 0.30) == 12750, so ${recA} == 2250 and ${netA} == 40250"
            - "One cent above the edge gross == 50001 the MID rate 0.10 applies: ${commB} == 5000 (round_half_up(5000.1)), subtotal 45001, ${recB} == 2250 and ${netB} == 42751"
            - "The commission is NOT monotone in gross across the boundary: selling one cent more yields 2500 cents LESS commission and 2501 cents MORE net, which is only correct if the tier test is the inclusive <= 50000 form"
            - "Both estimates were computed from the appraisal, not the sale: ${estA} == 36000 (40000 - 4000) and ${estB} == 54000 (60000 - 6000)"
            - "Both orders report settlement_status == 'HELD' and status == 'SETTLED'; GET /property-rooms/${room_id} shows escrow_balance_cents == 83001 (40250 + 42751)"

      - name: owner_claim_deadline_publication_extends_window
        claim_type: Constants Applied
        grounds:
          - "calculations.owner_claim_deadline"
          - "entities.OwnerClaim.fields.claim_deadline_at"
          - "entities.OwnerClaim.fields.notice_method"
          - "entities.EvidenceItem.fields.is_found_property"
        test_recipe:
          setup:
            - "Base fixture; three items are logged into case 26-00001 — two flagged is_found_property true, one left at the default false."
            - "The clock is advanced to 2026-08-05T00:00:00Z so every notified_at is that instant."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Found bicycle for publication notice", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 30000, seized_at: "2026-07-31T12:00:00Z", is_found_property: true }
