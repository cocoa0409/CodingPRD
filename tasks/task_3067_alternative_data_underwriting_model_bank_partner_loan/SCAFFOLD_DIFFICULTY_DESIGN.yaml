              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b1_id: $.data.id }
            - call: "POST /platform/partners/${t_id}/credit-boxes/${b1_id}/activate"
              payload: { expected_partner_version: "${t_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${t_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b2_id: $.data.id }
