            - call: "POST /loyalty/hotels"
              payload: { name: "Initial State Inn", brand_code: "ISI", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
