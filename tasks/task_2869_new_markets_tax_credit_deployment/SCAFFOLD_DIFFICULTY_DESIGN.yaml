            - "The follow-up does NOT return \"ERR_DEPLOYMENT_WINDOW_CLOSED\" (2027-08-15 is still before the 2027-09-01 deadline, so the temporal rule is genuinely satisfied)"
            - "QEI.${qei_id}.uninvested_cash_cents == 10000000, deployment_status == DEPLOYING and compliance_status == COMPLIANT (unchanged by the refusal)"
            - "QALICB.${qalicb_id}.funding_qlici_count == 1"

