              as: UtilityPlanner
            - call: "POST /plans/${p1}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP W2", cycle_year: 2026, planning_horizon_years: 15 }
