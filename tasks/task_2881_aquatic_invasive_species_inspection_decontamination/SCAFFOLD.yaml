scenario: |
  2881. Aquatic Invasive Species Inspection & Decontamination (state watercraft inspection program): inspection station siting at high-risk water bodies and highway corridors with hours of operation, mandatory inspection requirements, boater compliance and refusal handling with enforcement referral, watercraft risk screening by prior water body, residual water presence and standing time, decontamination procedures with hot water pressure treatment and documented dry time requirements, quarantine and seal programs for high-risk vessels with release verification, inspector training, data collection and detection reporting to the state database, interstate coordination and reciprocity of inspection seals, public education campaigns and effectiveness evaluation

domain_name: ais-inspection-decontamination
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked exclusively by foreign keys; no nesting in URL
  # paths except the two reverse-reachability sub-resources
  # (/inspection-stations/{id}/hours, /inspectors/{id}/training-records).

  state_machine_shape: cyclic
  # DeconOrder (TREATED -> RETREAT_REQUIRED -> TREATED), QuarantineOrder
  # (SEALED -> RELEASE_REQUESTED -> SEALED), DetectionReport (SUBMITTED ->
  # REJECTED -> SUBMITTED) and InspectionStation (OPEN -> SUSPENDED -> OPEN)
  # all loop. InspectionRecord additionally carries two independent state
  # dimensions (inspection_status and enforcement_status) that advance on
  # their own transition sets.

  relationship_patterns:
    - one_to_many
    - self_referential      # WaterBody.downstream_of_water_body_id -> WaterBody.id
    - cross_aggregate       # DeconOrder / QuarantineOrder both reach InspectionRecord, Watercraft and InspectionStation
    - polymorphic: false

  role_model: segregation_of_duties
  # The Inspector who issues a QuarantineOrder may not verify its release; the
  # DeconTechnician who performs a treatment may not sign its dry verification.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: WaterBody
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Public name of the lake, reservoir, river or canal.
        constraints: non-empty, max 120 chars
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code the water body sits in.
        constraints: exactly 2 uppercase letters
      - name: water_body_class
        type: enum
        source: input
        description: Physical class of the water body.
        constraints: one of {LAKE, RESERVOIR, RIVER, CANAL}
      - name: risk_tier
        type: enum
        source: input
        description: Program risk tier driving screening points; escalated to HIGH by the detection cascade.
        default: MODERATE
        constraints: one of {HIGH, MODERATE, LOW}
      - name: infestation_status
        type: enum
        source: input
        description: Infestation posture; escalated CLEAN -> SUSPECT -> CONFIRMED_INFESTED by accepted DetectionReports.
        default: CLEAN
        constraints: one of {CLEAN, SUSPECT, CONFIRMED_INFESTED}
      - name: downstream_of_water_body_id
        type: string
        source: input
        description: "FK -> WaterBody.id; nullable self-reference naming the water body immediately upstream. Chains must stay acyclic."
        default: null
      - name: detection_count
        type: integer
        source: computed
        description: Count of DetectionReport rows for this water body whose status is ACCEPTED.
        default: 0
      - name: live_detection_count
        type: integer
        source: computed
        description: Count of DetectionReport rows for this water body with status ACCEPTED and detection_class LIVE_ORGANISM.
        default: 0

  - name: InspectionStation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Station name as posted to the public.
        constraints: non-empty, max 120 chars
      - name: station_type
        type: enum
        source: input
        description: Siting class - a water-body access point or a highway corridor checkpoint.
        constraints: one of {WATERBODY_ACCESS, HIGHWAY_CORRIDOR}
      - name: water_body_id
        type: string
        source: input
        description: "FK -> WaterBody.id; required and non-null when station_type is WATERBODY_ACCESS, MUST be null when station_type is HIGHWAY_CORRIDOR."
        default: null
      - name: corridor_route_code
        type: string
        source: input
        description: Highway route code; required and non-null when station_type is HIGHWAY_CORRIDOR, MUST be null when station_type is WATERBODY_ACCESS.
        default: null
      - name: status
        type: enum
        source: system
        description: Station lifecycle state; see the InspectionStation state machine.
        default: PLANNED
        constraints: one of {PLANNED, OPEN, SUSPENDED, CLOSED}
      - name: mandatory_inspection
        type: boolean
        source: input
        description: True when inspection at this station is mandatory rather than voluntary; forced true by the detection cascade.
        default: false
      - name: decon_bay_count
        type: integer
        source: input
        description: Number of decontamination bays; aggregate capacity for overlapping DeconOrder bay occupations.
        default: 0
        constraints: integer >= 0
      - name: hot_water_capable
        type: boolean
        source: input
        description: True when the station has a hot-water pressure unit; required for any decon treatment.
        default: false
      - name: seal_stock_initial_count
        type: integer
        source: input
        description: Seals physically delivered to the station at commissioning; the conserved total of the seal inventory invariant.
        default: 0
        constraints: integer >= 0
      - name: seal_stock_count
        type: integer
        source: computed
        description: Seals still on the shelf; initialised to seal_stock_initial_count and decremented on each QuarantineOrder issuance.
        default: 0
      - name: seals_in_circulation_count
        type: integer
        source: computed
        description: Seals affixed to vessels under an active quarantine hold (QuarantineOrder status in {SEALED, RELEASE_REQUESTED}).
        default: 0
      - name: seals_retired_count
        type: integer
        source: computed
        description: Seals consumed permanently - cut on approved release or forfeited on a breach report.
        default: 0
      - name: certified_inspector_count
        type: integer
        source: computed
        description: Count of Inspector rows whose home_station_id is this station, status is ACTIVE and certification_level is in {LEVEL_2, DECON_CERTIFIED}.
        default: 0
      - name: decon_service_available
        type: boolean
        source: computed
        description: True exactly when certified_inspector_count >= CERTIFIED_INSPECTOR_DECON_THRESHOLD and hot_water_capable is true.
        default: false
      - name: collected_fees_cents
        type: integer
        source: computed
        description: Running station fee ledger; equals the sum over this station's InspectionRecords of (total_fee_cents - fee_refunded_cents).
        default: 0
      - name: refunded_fees_cents
        type: integer
        source: computed
        description: Running total of decon fee reversals booked at this station.
        default: 0
      - name: campaign_allocated_cents
        type: integer
        source: computed
        description: Education-campaign budget currently allocated to this station by launched campaigns.
        default: 0

  - name: StationHours
    parent: InspectionStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> InspectionStation.id; the station this operating window belongs to."
      - name: opens_at
        type: datetime
        source: input
        description: Inclusive start of the operating window (ISO 8601 UTC, three fractional digits).
      - name: closes_at
        type: datetime
        source: input
        description: Exclusive end of the operating window (ISO 8601 UTC, three fractional digits).
        constraints: strictly greater than opens_at
      - name: staffing_level
        type: enum
        source: input
        description: Crew size posted for this window; upgraded to DOUBLE by the detection cascade.
        default: SINGLE
        constraints: one of {SINGLE, DOUBLE}

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Inspector legal name.
        constraints: non-empty, max 120 chars
      - name: home_station_id
        type: string
        source: input
        description: "FK -> InspectionStation.id; the station whose certified_inspector_count this inspector contributes to."
      - name: decon_endorsement
        type: boolean
        source: input
        description: True when the hiring packet includes the hot-water decon endorsement; combined with LEVEL_2 hours it yields DECON_CERTIFIED.
        default: false
      - name: training_hours_total
        type: number
        source: computed
        description: Sum of TrainingRecord.hours for this inspector over rows with passed == true. Two decimal places, round_half_up.
        default: 0
      - name: certification_level
        type: enum
        source: computed
        description: Derived from training_hours_total and decon_endorsement by the inspector_certification_level calculation.
        default: TRAINEE
        constraints: one of {TRAINEE, LEVEL_1, LEVEL_2, DECON_CERTIFIED}
      - name: certification_expires_at
        type: datetime
        source: computed
        description: Logical-clock instant at the first promotion out of TRAINEE plus CERT_VALID_HOURS, recomputed as clock plus CERT_VALID_HOURS on every EXPIRED -> ACTIVE renewal; null while TRAINEE.
        default: null
      - name: status
        type: enum
        source: system
        description: Inspector lifecycle state; see the Inspector state machine.
        default: PROBATIONARY
        constraints: one of {PROBATIONARY, ACTIVE, SUSPENDED, EXPIRED}

  - name: TrainingRecord
    parent: Inspector
    common_fields: false
    fields:
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; the trainee the module was logged against."
      - name: module_code
        type: string
        source: input
        description: State training curriculum module code.
        constraints: non-empty, max 32 chars
      - name: hours
        type: number
        source: input
        description: Credited classroom/field hours for the module.
        constraints: number > 0, at most 2 decimal places
      - name: passed
        type: boolean
        source: input
        description: True when the trainee passed the module; failed modules credit zero hours.
      - name: completed_at
        type: datetime
        source: input
        description: Instant the module was completed (ISO 8601 UTC, three fractional digits).

  - name: Watercraft
    parent: null
    common_fields: true
    fields:
      - name: registration_number
        type: string
        source: input
        description: State registration number; unique across the whole registry.
        constraints: non-empty, max 32 chars, unique
      - name: home_state_code
        type: string
        source: input
        description: Two-letter state code the vessel is registered in; matched against ReciprocityAgreement.partner_state_code for fee waivers.
        constraints: exactly 2 uppercase letters
      - name: vessel_type
        type: enum
        source: input
        description: Hull class; PONTOON_MULTI_CHAMBER and BALLASTED_WAKEBOAT carry the elevated vessel factor.
        constraints: one of {OPEN_HULL, PONTOON_MULTI_CHAMBER, BALLASTED_WAKEBOAT, PERSONAL_WATERCRAFT}
      - name: hull_length_ft
        type: number
        source: input
        description: Hull length in feet.
        constraints: number > 0
      - name: last_water_body_id
        type: string
        source: input
        description: "FK -> WaterBody.id; nullable last water body the vessel was launched in per the owner declaration."
        default: null
      - name: last_removed_at
        type: datetime
        source: input
        description: Nullable instant the vessel was last pulled from the water; the standing-time baseline for the dry credit.
        default: null
      - name: compliance_strikes
        type: integer
        source: computed
        description: Count of enforcement referrals recorded against this vessel by the referral cascade.
        default: 0
      - name: watchlist_status
        type: enum
        source: computed
        description: Flips CLEAR -> WATCHLISTED once compliance_strikes >= WATCHLIST_STRIKE_THRESHOLD.
        default: CLEAR
        constraints: one of {CLEAR, WATCHLISTED}
      - name: mandatory_decon_flag
        type: boolean
        source: computed
        description: True while the vessel is WATCHLISTED; forces DECON_REQUIRED at disposition regardless of risk band. Cleared by a VERIFIED DeconOrder.
        default: false
      - name: last_decon_verified_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent DeconOrder that reached VERIFIED for this vessel.
        default: null
      - name: quarantine_hold_until
        type: datetime
        source: computed
        description: hold_until of this vessel's QuarantineOrder whose status is in {SEALED, RELEASE_REQUESTED}; null when no hold is in force.
        default: null

  - name: ReciprocityAgreement
    parent: null
    common_fields: true
    fields:
      - name: partner_state_code
        type: string
        source: input
        description: Two-letter partner state code; unique across agreements.
        constraints: exactly 2 uppercase letters, unique
      - name: honors_our_seals
        type: boolean
        source: input
        description: True when the partner state honors seals issued by this program (interstate coordination flag; informational for reporting).
        default: true
      - name: max_seal_age_hours
        type: integer
        source: input
        description: Maximum age in hours of a partner-state seal that this program will still honor at screening.
        default: 72
        constraints: integer > 0
      - name: accepted_seal_prefix
        type: string
        source: input
        description: Required leading prefix of a partner-state seal number for it to be recognised.
        constraints: non-empty, max 8 chars
      - name: fee_waiver
        type: boolean
        source: input
        description: True when an honored partner seal also waives the base inspection fee.
        default: false
      - name: status
        type: enum
        source: system
        description: Agreement state; only ACTIVE agreements are consulted at screening.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}

  - name: InspectionRecord
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> InspectionStation.id; the station performing the inspection."
      - name: inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; copied from the acting Inspector's X-User-ID at creation."
      - name: watercraft_id
        type: string
        source: input
        description: "FK -> Watercraft.id; the vessel presented for inspection."
      - name: prior_water_body_id
        type: string
        source: input
        description: "FK -> WaterBody.id; the water body the boater declares the vessel last launched in."
      - name: honored_agreement_id
        type: string
        source: computed
        description: "FK -> ReciprocityAgreement.id; the agreement under which a presented partner seal was honored at screening, null when no seal was honored."
        default: null
      - name: arrived_at
        type: datetime
        source: input
        description: Instant the boater arrived at the station; the operating-hours window and dry-credit baseline both use this value.
      - name: residual_water_present
        type: boolean
        source: input
        description: Inspector observation - any residual water found in the hull, bilge, ballast or livewell.
      - name: standing_water_ml
        type: integer
        source: input
        description: Measured residual water volume in millilitres.
        default: 0
        constraints: integer >= 0
      - name: presented_seal_number
        type: string
        source: input
        description: Nullable seal number presented by the boater from a prior out-of-state inspection.
        default: null
      - name: presented_seal_state_code
        type: string
        source: input
        description: Nullable two-letter state code that issued the presented seal.
        default: null
      - name: presented_seal_issued_at
        type: datetime
        source: input
        description: Nullable instant the presented seal was issued; the seal-age basis for reciprocity.
        default: null
      - name: screening_completed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful screening call.
        default: null
      - name: reciprocity_seal_honored
        type: boolean
        source: computed
        description: True exactly when the presented seal cleared the reciprocity_seal_decision calculation.
        default: false
      - name: reciprocity_credit_points
        type: integer
        source: computed
        description: RECIPROCITY_CREDIT_POINTS when reciprocity_seal_honored is true, otherwise 0.
        default: 0
      - name: dry_credit_points
        type: integer
        source: computed
        description: Standing-time credit computed on the arrival basis by watercraft_risk_score.
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: Authoritative screening score from watercraft_risk_score under the arrival_basis variant, 0..100.
        default: 0
      - name: advisory_risk_score
        type: integer
        source: computed
        description: Same formula under the screening_basis variant; recorded for audit and never used for gating.
        default: 0
      - name: risk_band
        type: enum
        source: computed
        description: Band derived from risk_score by the watercraft_risk_band calculation.
        default: LOW
        constraints: one of {LOW, MODERATE, HIGH, EXTREME}
      - name: decon_mandatory
        type: boolean
        source: computed
        description: True when risk_band is in {HIGH, EXTREME}, or watercraft.mandatory_decon_flag is true, or risk_band is MODERATE and residual_water_present is true.
        default: false
      - name: quarantine_warranted
        type: boolean
        source: computed
        description: True when risk_band is EXTREME or the prior water body's infestation_status is CONFIRMED_INFESTED.
        default: false
      - name: inspection_status
        type: enum
        source: system
        description: First independent state dimension; see the InspectionRecord state machine, dimension inspection_status.
        default: INITIATED
        constraints: one of {INITIATED, SCREENED, PASSED, DECON_REQUIRED, DECON_COMPLETED, DECON_FAILED_ABANDONED, REFUSED}
      - name: enforcement_status
        type: enum
        source: system
        description: Second independent state dimension; advances on its own transition set regardless of inspection_status.
        default: NONE
        constraints: one of {NONE, REFERRED, CITED, DISMISSED}
      - name: referral_reason
        type: enum
        source: system
        description: Why the record was referred to enforcement; null while enforcement_status is NONE.
        default: null
        constraints: one of {INSPECTION_REFUSAL, QUARANTINE_RELEASE_FAILURE, SEAL_TAMPER, DECON_EVASION}
      - name: agency_code
        type: string
        source: system
        description: Enforcement agency that accepted the referral; set by the enforcement endpoint.
        default: null
      - name: penalty_cents
        type: integer
        source: computed
        description: Civil penalty booked when enforcement_status becomes CITED; PENALTY_BASE_CENTS plus PENALTY_STRIKE_STEP_CENTS per prior strike on the vessel.
        default: 0
      - name: inspection_fee_cents
        type: integer
        source: computed
        description: Base inspection fee component from inspection_total_fee_cents; zero when the reciprocity fee waiver applies.
        default: 0
      - name: decon_fee_cents
        type: integer
        source: computed
        description: Hot-water treatment component from inspection_total_fee_cents; zero until a treatment is recorded.
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: Program surcharge selected from the pre-surcharge subtotal tier by inspection_total_fee_cents.
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: inspection_fee_cents + decon_fee_cents + surcharge_cents.
        default: 0
      - name: fee_refunded_cents
        type: integer
        source: computed
        description: Portion of total_fee_cents reversed by the decon abandonment compensation.
        default: 0

  - name: DeconOrder
    parent: null
    common_fields: true
    fields:
      - name: inspection_record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the record whose disposition demanded decontamination."
      - name: station_id
        type: string
        source: system
        description: "FK -> InspectionStation.id; copied from the parent InspectionRecord.station_id at creation."
      - name: treated_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the DeconTechnician's X-User-ID recorded on the most recent treatment, null before the first treatment."
        default: null
      - name: verified_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the ReleaseVerifier's X-User-ID recorded on the most recent dry verification, null before the first verification."
        default: null
      - name: status
        type: enum
        source: system
        description: DeconOrder lifecycle state; see the DeconOrder state machine.
        default: ORDERED
        constraints: one of {ORDERED, TREATED, RETREAT_REQUIRED, VERIFIED, ABANDONED}
      - name: attempt_count
        type: integer
        source: computed
        description: Number of treatments recorded against this order; capped by MAX_DECON_ATTEMPTS.
        default: 0
      - name: band_at_order
        type: enum
        source: system
        description: InspectionRecord.risk_band frozen at order creation; the dry-time and dwell tables are keyed on this value, not on any later re-screen.
        constraints: one of {LOW, MODERATE, HIGH, EXTREME}
      - name: water_temp_f
        type: number
        source: system
        description: Hot-water delivery temperature in degrees Fahrenheit from the most recent treatment.
        default: null
      - name: pressure_psi
        type: number
        source: system
        description: Delivery pressure in PSI from the most recent treatment.
        default: null
      - name: dwell_seconds
        type: integer
        source: system
        description: Nozzle dwell time in seconds from the most recent treatment.
        default: null
      - name: treatment_started_at
        type: datetime
        source: system
        description: Logical-clock instant the most recent treatment began; the inclusive start of this order's bay occupation.
        default: null
      - name: treated_at
        type: datetime
        source: system
        description: Logical-clock instant the most recent treatment finished; equals treatment_started_at plus dwell_seconds.
        default: null
      - name: bay_released_at
        type: datetime
        source: computed
        description: treated_at plus BAY_BUFFER_MINUTES; the inclusive end of this order's bay occupation interval.
        default: null
      - name: treatment_effectiveness_pct
        type: number
        source: computed
        description: Output of decon_treatment_effectiveness for the most recent treatment, 0.00..100.00.
        default: null
      - name: base_dry_hours
        type: integer
        source: computed
        description: BASE_DRY_HOURS keyed on band_at_order; step 1 of decon_required_dry_hours.
        default: null
      - name: required_dry_hours
        type: integer
        source: computed
        description: Documented dry-time requirement in whole hours from decon_required_dry_hours.
        default: null
      - name: dry_until
        type: datetime
        source: computed
        description: treated_at plus required_dry_hours hours; dry verification before this instant is rejected.
        default: null

  - name: QuarantineOrder
    parent: null
    common_fields: true
    fields:
      - name: inspection_record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the record that warranted the quarantine."
      - name: watercraft_id
        type: string
        source: system
        description: "FK -> Watercraft.id; copied from the parent InspectionRecord.watercraft_id at creation."
      - name: station_id
        type: string
        source: system
        description: "FK -> InspectionStation.id; copied from the parent InspectionRecord.station_id; the station whose seal inventory is debited."
      - name: issued_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the issuing Inspector's X-User-ID. Segregation of duties forbids this inspector from verifying the release."
      - name: release_verified_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the ReleaseVerifier who signed the most recent release decision, null before any decision."
        default: null
      - name: seal_number
        type: string
        source: input
        description: Physical seal number affixed to the vessel; unique across all QuarantineOrders.
        constraints: non-empty, max 32 chars, unique
      - name: seal_state_code
        type: string
        source: system
        description: Two-letter state code of the issuing program; copied from the station's WaterBody.state_code for WATERBODY_ACCESS stations and from PROGRAM_STATE_CODE for HIGHWAY_CORRIDOR stations.
      - name: status
        type: enum
        source: system
        description: QuarantineOrder lifecycle state; see the QuarantineOrder state machine.
        default: SEALED
        constraints: one of {SEALED, RELEASE_REQUESTED, RELEASED, VOIDED_BREACH}
      - name: band_at_issue
        type: enum
        source: system
        description: InspectionRecord.risk_band frozen at issuance; BASE_HOLD_HOURS is keyed on this value. LOW occurs when quarantine_warranted was raised by a CONFIRMED_INFESTED prior water body on an otherwise low-scoring vessel.
        constraints: one of {LOW, MODERATE, HIGH, EXTREME}
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance; inclusive start of the vessel's quarantine hold interval.
      - name: hold_hours_required
        type: integer
        source: computed
        description: Output of quarantine_hold_hours; recomputed on every rejected release.
        default: 0
      - name: hold_until
        type: datetime
        source: computed
        description: issued_at plus hold_hours_required hours; inclusive end of the vessel's quarantine hold interval.
        default: null
      - name: rejected_release_count
        type: integer
        source: computed
        description: Number of release decisions rejected on this order; drives the hold extension and the enforcement referral cascade.
        default: 0

  - name: DetectionReport
    parent: null
    common_fields: true
    fields:
      - name: inspection_record_id
        type: string
        source: input
        description: "FK -> InspectionRecord.id; the inspection during which the organism or fragment was found."
      - name: water_body_id
        type: string
        source: system
        description: "FK -> WaterBody.id; copied from the parent InspectionRecord.prior_water_body_id at creation."
      - name: reported_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the reporting Inspector's X-User-ID at creation."
      - name: species_code
        type: string
        source: input
        description: State species code for the detected organism or fragment.
        constraints: non-empty, max 32 chars
      - name: detection_class
        type: enum
        source: input
        description: What was found; only LIVE_ORGANISM increments live_detection_count.
        constraints: one of {LIVE_ORGANISM, DEAD_ORGANISM, PLANT_FRAGMENT}
      - name: observed_at
        type: datetime
        source: input
        description: Instant of the observation (ISO 8601 UTC, three fractional digits).
      - name: status
        type: enum
        source: system
        description: Reporting state; see the DetectionReport state machine.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED}
      - name: submission_count
        type: integer
        source: computed
        description: Number of times this report has been pushed to the state database.
        default: 0
      - name: state_db_ack_id
        type: string
        source: system
        description: Acknowledgement identifier returned by the state database on acceptance.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Free-text reason recorded on the most recent rejection.
        default: null

  - name: EducationCampaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Campaign name.
        constraints: non-empty, max 120 chars
      - name: target_water_body_id
        type: string
        source: input
        description: "FK -> WaterBody.id; the water body whose boater compliance the campaign targets."
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the campaign window.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the campaign window.
        constraints: strictly greater than start_at
      - name: budget_cents
        type: integer
        source: input
        description: Total campaign budget in cents; conserved by the campaign budget invariant.
        constraints: integer > 0 and <= CAMPAIGN_BUDGET_CAP_CENTS
      - name: impressions
        type: integer
        source: input
        description: Reported public impressions; feeds the impressions bonus in campaign_effectiveness_score.
        default: 0
        constraints: integer >= 0
      - name: status
        type: enum
        source: system
        description: Campaign lifecycle state; see the EducationCampaign state machine.
        default: PLANNED
        constraints: one of {PLANNED, RUNNING, EVALUATED, CANCELLED}
      - name: evaluation_method
        type: enum
        source: system
        description: The variant selected on the evaluation call; null until evaluated.
        default: null
        constraints: one of {PRE_POST, CONTROL_CORRIDOR}
      - name: window_compliance_rate
        type: number
        source: computed
        description: Compliance rate inside [start_at, end_at) for the target water body, 4 decimal places.
        default: null
      - name: baseline_compliance_rate
        type: number
        source: computed
        description: The comparison rate for the selected variant - the preceding equal-length window for PRE_POST, the statewide rate over the same window for CONTROL_CORRIDOR.
        default: null
      - name: effectiveness_score
        type: number
        source: computed
        description: campaign_effectiveness_score under the selected evaluation_method, 0.00..100.00.
        default: null
      - name: alternate_effectiveness_score
        type: number
        source: computed
        description: The same score under the variant that was NOT selected; recorded so the divergence is observable.
        default: null
      - name: station_allocations
        type: array
        source: computed
        description: Array of objects { station_id, allocated_cents } produced by campaign_station_allocation_cents at launch; empty array while PLANNED or after cancellation.
        default: []

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: InspectionStation
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /inspection-stations/{id}/status with target_status OPEN"
        actor: ProgramAdmin
        preconditions:
          - "station.status == PLANNED"
          - "at least one StationHours row exists with station_id == station.id, otherwise the call is rejected with ERR_INVALID_STATION_STATE (409)"
        side_effects:
          - "sets InspectionStation.status = OPEN"
          - "initialises InspectionStation.seal_stock_count = seal_stock_initial_count when status leaves PLANNED for the first time"
          - "recomputes InspectionStation.decon_service_available"
          - "increments InspectionStation.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /inspection-stations/{id}/status with target_status SUSPENDED"
        actor: ProgramAdmin
        preconditions:
          - "station.status == OPEN"
        side_effects:
          - "sets InspectionStation.status = SUSPENDED"
          - "increments InspectionStation.version by 1"
        note: "Suspension blocks new InspectionRecord creation but leaves in-flight records and their DeconOrders alone."
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /inspection-stations/{id}/status with target_status OPEN"
        actor: ProgramAdmin
        preconditions:
          - "station.status == SUSPENDED"
        side_effects:
          - "sets InspectionStation.status = OPEN"
          - "increments InspectionStation.version by 1"
        note: "Closes the OPEN -> SUSPENDED -> OPEN loop; a station may be suspended and resumed any number of times."
      - from: PLANNED
        to: CLOSED
        trigger: "POST /inspection-stations/{id}/status with target_status CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "station.status == PLANNED"
        side_effects:
          - "sets InspectionStation.status = CLOSED"
          - "increments InspectionStation.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /inspection-stations/{id}/status with target_status CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "station.status == OPEN"
          - "no InspectionRecord exists with station_id == station.id and inspection_status IN {INITIATED, SCREENED, DECON_REQUIRED}"
        side_effects:
          - "sets InspectionStation.status = CLOSED"
          - "increments InspectionStation.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /inspection-stations/{id}/status with target_status CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "station.status == SUSPENDED"
          - "no InspectionRecord exists with station_id == station.id and inspection_status IN {INITIATED, SCREENED, DECON_REQUIRED}"
        side_effects:
          - "sets InspectionStation.status = CLOSED"
          - "increments InspectionStation.version by 1"
      - from: CLOSED
        to: CLOSED
        trigger: "POST /inspection-stations/{id}/status with any target_status"
        actor: ProgramAdmin
        preconditions:
          - "REJECTED: CLOSED is terminal"
        side_effects: []
        note: "Any status call against a CLOSED station is rejected with ERR_INVALID_STATION_STATE (409); no field changes and version is not bumped."

  - entity: Inspector
    initial_state: PROBATIONARY
    terminal_states: []
    transitions:
      - from: PROBATIONARY
        to: ACTIVE
        trigger: "POST /inspectors/{id}/training-records (system auto-transition inside the training cascade)"
        actor: system
        preconditions:
          - "inspector.status == PROBATIONARY"
          - "the inspector_certification_level calculation lifts certification_level above TRAINEE after this record is credited"
        side_effects:
          - "sets Inspector.status = ACTIVE"
          - "sets Inspector.certification_expires_at = logical_now + CERT_VALID_HOURS hours"
          - "recomputes InspectionStation.certified_inspector_count for home_station_id when certification_level lands in {LEVEL_2, DECON_CERTIFIED}"
          - "recomputes InspectionStation.decon_service_available for home_station_id"
          - "increments Inspector.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /inspectors/{id}/status with target_status SUSPENDED"
        actor: ProgramAdmin
        preconditions:
          - "inspector.status IN {PROBATIONARY, ACTIVE}"
        side_effects:
          - "sets Inspector.status = SUSPENDED"
          - "decrements InspectionStation.certified_inspector_count for home_station_id when certification_level IN {LEVEL_2, DECON_CERTIFIED}"
          - "recomputes InspectionStation.decon_service_available for home_station_id"
          - "increments Inspector.version by 1"
      - from: PROBATIONARY
        to: SUSPENDED
        trigger: "POST /inspectors/{id}/status with target_status SUSPENDED"
        actor: ProgramAdmin
        preconditions:
          - "inspector.status == PROBATIONARY"
        side_effects:
          - "sets Inspector.status = SUSPENDED"
          - "increments Inspector.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /inspectors/{id}/status with target_status ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "inspector.status == SUSPENDED"
          - "inspector.certification_level != TRAINEE"
          - "logical_now < inspector.certification_expires_at"
        side_effects:
          - "sets Inspector.status = ACTIVE"
          - "recomputes InspectionStation.certified_inspector_count and decon_service_available for home_station_id"
          - "increments Inspector.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE loop."
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /inspectors/{id}/status with target_status ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "inspector.status == EXPIRED"
          - "inspector.certification_level != TRAINEE"
        side_effects:
          - "sets Inspector.status = ACTIVE"
          - "sets Inspector.certification_expires_at = logical_now + CERT_VALID_HOURS hours"
          - "recomputes InspectionStation.certified_inspector_count and decon_service_available for home_station_id"
          - "increments Inspector.version by 1"
        note: |
          Administrative renewal. Unlike SUSPENDED -> ACTIVE this transition
          carries NO logical_now < certification_expires_at precondition - the
          whole point is that the certification has already lapsed - and it is
          the one transition that re-stamps the expiry from the status endpoint.
          The training-record path below renews the same edge from the other
          direction; both are declared so neither file implies an undeclared
          transition.
      - from: ACTIVE
        to: EXPIRED
        trigger: "system re-evaluation on any endpoint where this inspector is the acting principal or the treatment/verification subject"
        actor: system
        preconditions:
          - "inspector.status == ACTIVE"
          - "logical_now >= inspector.certification_expires_at"
        side_effects:
          - "sets Inspector.status = EXPIRED"
          - "decrements InspectionStation.certified_inspector_count for home_station_id when certification_level IN {LEVEL_2, DECON_CERTIFIED}"
          - "recomputes InspectionStation.decon_service_available for home_station_id"
          - "increments Inspector.version by 1"
          - "the triggering request itself is then rejected with ERR_INSPECTOR_NOT_ACTIVE (409)"
        note: "Lazy expiry: the transition is evaluated before the request's own state preconditions, so the expiry persists even though the request fails."
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /inspectors/{id}/training-records with passed == true"
        actor: system
        preconditions:
          - "inspector.status == EXPIRED"
          - "the credited record keeps certification_level above TRAINEE"
        side_effects:
          - "sets Inspector.status = ACTIVE"
          - "sets Inspector.certification_expires_at = logical_now + CERT_VALID_HOURS hours"
          - "recomputes InspectionStation.certified_inspector_count and decon_service_available for home_station_id"
          - "increments Inspector.version by 1"

  - entity: InspectionRecord
    dimension: inspection_status
    initial_state: INITIATED
    terminal_states: [PASSED, DECON_COMPLETED, DECON_FAILED_ABANDONED, REFUSED]
    note: |
      First of two independent state dimensions on InspectionRecord. This
      dimension tracks the physical inspection; the enforcement_status
      dimension below advances on a disjoint transition set and neither
      dimension gates the other. A record may sit in terminal PASSED while
      its enforcement dimension is still NONE -> REFERRED -> CITED, and a
      record may be CITED while its inspection dimension is still
      DECON_REQUIRED.
    transitions:
      - from: INITIATED
        to: SCREENED
        trigger: "POST /inspection-records/{id}/screening"
        actor: Inspector
        preconditions:
          - "record.inspection_status == INITIATED"
          - "record.inspector_id == X-User-ID"
          - "acting Inspector.status == ACTIVE after lazy expiry re-evaluation"
          - "payload.expected_watercraft_version == Watercraft.version (OCC)"
        side_effects:
          - "runs reciprocity_seal_decision; sets reciprocity_seal_honored, reciprocity_credit_points, honored_agreement_id"
          - "runs watercraft_risk_score under both variants; sets dry_credit_points, risk_score (arrival_basis) and advisory_risk_score (screening_basis)"
          - "runs watercraft_risk_band; sets risk_band"
          - "recomputes decon_mandatory and quarantine_warranted"
          - "sets screening_completed_at = logical_now"
          - "sets InspectionRecord.inspection_status = SCREENED"
          - "increments Watercraft.version by 1"
          - "increments InspectionRecord.version by 1"
      - from: SCREENED
        to: SCREENED
        trigger: "POST /inspection-records/{id}/screening (re-screen)"
        actor: Inspector
        preconditions:
          - "record.inspection_status == SCREENED"
          - "record.inspector_id == X-User-ID"
          - "acting Inspector.status == ACTIVE after lazy expiry re-evaluation"
          - "payload.expected_watercraft_version == Watercraft.version (OCC)"
        side_effects:
          - "overwrites residual_water_present and standing_water_ml when supplied in the payload"
          - "re-runs reciprocity_seal_decision, watercraft_risk_score, watercraft_risk_band; overwrites risk_score, advisory_risk_score, risk_band, decon_mandatory, quarantine_warranted"
          - "sets screening_completed_at = logical_now"
          - "increments Watercraft.version by 1"
          - "increments InspectionRecord.version by 1"
        note: |
          A later screening legitimately supersedes the earlier one - the
          observations are corrected on the spot. Because a second sequential
          screening observes the same inspection_status, no state precondition
          can separate the two writers; the OCC check on Watercraft.version is
          the sanctioned resolution (see concurrency_rules).
      - from: SCREENED
        to: PASSED
        trigger: "POST /inspection-records/{id}/disposition with disposition PASS"
        actor: Inspector
        preconditions:
          - "record.inspection_status == SCREENED"
          - "record.inspector_id == X-User-ID"
          - "record.decon_mandatory == false"
        side_effects:
          - "sets InspectionRecord.inspection_status = PASSED"
          - "runs inspection_total_fee_cents with decon_fee_cents = 0; sets inspection_fee_cents, surcharge_cents, total_fee_cents"
          - "adds the resulting total_fee_cents to InspectionStation.collected_fees_cents"
          - "increments InspectionStation.version by 1"
          - "increments InspectionRecord.version by 1"
      - from: SCREENED
        to: DECON_REQUIRED
        trigger: "POST /inspection-records/{id}/disposition with disposition DECON"
        actor: Inspector
        preconditions:
          - "record.inspection_status == SCREENED"
          - "record.inspector_id == X-User-ID"
        side_effects:
          - "sets InspectionRecord.inspection_status = DECON_REQUIRED"
          - "runs inspection_total_fee_cents with decon_fee_cents = 0; sets inspection_fee_cents, surcharge_cents, total_fee_cents"
          - "adds the resulting total_fee_cents to InspectionStation.collected_fees_cents"
          - "increments InspectionStation.version by 1"
          - "increments InspectionRecord.version by 1"
      - from: SCREENED
        to: REFUSED
        trigger: "POST /inspection-records/{id}/disposition with disposition REFUSE"
        actor: Inspector
        preconditions:
          - "record.inspection_status == SCREENED"
          - "record.inspector_id == X-User-ID"
        side_effects:
          - "sets InspectionRecord.inspection_status = REFUSED"
          - "runs inspection_total_fee_cents with decon_fee_cents = 0; sets inspection_fee_cents, surcharge_cents, total_fee_cents"
          - "adds the resulting total_fee_cents to InspectionStation.collected_fees_cents"
          - "drives the enforcement dimension NONE -> REFERRED with referral_reason = INSPECTION_REFUSAL (system actor)"
          - "increments InspectionStation.version by 1"
          - "increments InspectionRecord.version by 1"
        note: "Boater refusal at a station whose mandatory_inspection is true is the enforcement-referral path required by the program."
      - from: DECON_REQUIRED
        to: DECON_COMPLETED
        trigger: "POST /decon-orders/{id}/dry-verification with outcome VERIFIED (system cascade hop 2)"
        actor: system
        preconditions:
          - "record.inspection_status == DECON_REQUIRED"
          - "the DeconOrder reached VERIFIED on this call"
        side_effects:
          - "sets InspectionRecord.inspection_status = DECON_COMPLETED"
          - "sets Watercraft.last_decon_verified_at = logical_now and clears Watercraft.mandatory_decon_flag"
          - "increments Watercraft.version by 1"
          - "increments InspectionRecord.version by 1"
      - from: DECON_REQUIRED
        to: DECON_FAILED_ABANDONED
        trigger: "POST /decon-orders/{id}/dry-verification with outcome ABANDON (system cascade hop 2)"
        actor: system
        preconditions:
          - "record.inspection_status == DECON_REQUIRED"
          - "the DeconOrder reached ABANDONED on this call"
        side_effects:
          - "sets InspectionRecord.inspection_status = DECON_FAILED_ABANDONED"
          - "sets InspectionRecord.fee_refunded_cents = decon_fee_cents + surcharge_cents (the treatment-attributable portion of the ledger)"
          - "subtracts that same amount from InspectionStation.collected_fees_cents and adds it to InspectionStation.refunded_fees_cents"
          - "increments InspectionStation.version by 1"
          - "increments InspectionRecord.version by 1"
        note: "Compensating action for the treatment fee booked at POST /decon-orders/{id}/treatment; see the fee_ledger_conservation invariant."

  - entity: InspectionRecord
    dimension: enforcement_status
    initial_state: NONE
    terminal_states: [CITED, DISMISSED]
    note: "Second independent state dimension on the same row; advances with no reference to inspection_status and never blocks it."
    transitions:
      - from: NONE
        to: REFERRED
        trigger: "POST /inspection-records/{id}/enforcement with action REFER, or the system cascade from a REFUSE disposition or a second rejected quarantine release"
        actor: EnforcementOfficer
        preconditions:
          - "record.enforcement_status == NONE"
        side_effects:
          - "sets InspectionRecord.enforcement_status = REFERRED"
          - "sets InspectionRecord.referral_reason (payload value for the EnforcementOfficer call; INSPECTION_REFUSAL or QUARANTINE_RELEASE_FAILURE for the system cascades)"
          - "sets InspectionRecord.agency_code from the payload when supplied"
          - "increments Watercraft.compliance_strikes by 1 (cascade hop)"
          - "flips Watercraft.watchlist_status CLEAR -> WATCHLISTED when compliance_strikes >= WATCHLIST_STRIKE_THRESHOLD (cascade hop, caused by the strike increment)"
          - "sets Watercraft.mandatory_decon_flag = true because watchlist_status became WATCHLISTED (cascade hop, caused by the watchlist flip)"
          - "increments Watercraft.version by 1"
          - "increments InspectionRecord.version by 1"
      - from: REFERRED
        to: CITED
        trigger: "POST /inspection-records/{id}/enforcement with action CITE"
        actor: EnforcementOfficer
        preconditions:
          - "record.enforcement_status == REFERRED"
        side_effects:
          - "sets InspectionRecord.enforcement_status = CITED"
          - "runs enforcement_penalty_cents; sets InspectionRecord.penalty_cents"
          - "increments InspectionRecord.version by 1"
      - from: REFERRED
        to: DISMISSED
        trigger: "POST /inspection-records/{id}/enforcement with action DISMISS"
        actor: EnforcementOfficer
        preconditions:
          - "record.enforcement_status == REFERRED"
        side_effects:
          - "sets InspectionRecord.enforcement_status = DISMISSED"
          - "sets InspectionRecord.penalty_cents = 0"
          - "decrements Watercraft.compliance_strikes by 1 and re-derives watchlist_status and mandatory_decon_flag from the new count"
          - "increments Watercraft.version by 1"
          - "increments InspectionRecord.version by 1"
        note: "Compensating action for the strike booked on NONE -> REFERRED; see the compliance_strike_conservation invariant."

  - entity: DeconOrder
    initial_state: ORDERED
    terminal_states: [VERIFIED, ABANDONED]
    note: |
      Cyclic machine - TREATED -> RETREAT_REQUIRED -> TREATED repeats until
      the dry verification passes or MAX_DECON_ATTEMPTS is exhausted. A record
      may carry more than one DeconOrder (see concurrency_rules); the record
      cascade on VERIFIED / ABANDONED fires from whichever order the call
      targets, and is skipped outright when the parent record has already left
      DECON_REQUIRED - the DeconOrder transition itself still completes.
    transitions:
      - from: ORDERED
        to: TREATED
        trigger: "POST /decon-orders/{id}/treatment"
        actor: DeconTechnician
        preconditions:
          - "decon_order.status == ORDERED"
          - "acting Inspector.status == ACTIVE after lazy expiry re-evaluation"
          - "acting Inspector.certification_level == DECON_CERTIFIED"
          - "InspectionStation.hot_water_capable == true for decon_order.station_id"
          - "payload.water_temp_f >= MIN_TREATMENT_TEMP_F and payload.pressure_psi >= MIN_TREATMENT_PSI"
          - "the bay occupation [logical_now, logical_now + dwell_seconds + BAY_BUFFER_MINUTES] collides with fewer than InspectionStation.decon_bay_count other occupations at the same station"
        side_effects:
          - "sets water_temp_f, pressure_psi, dwell_seconds from the payload"
          - "sets treatment_started_at = logical_now and treated_at = logical_now + dwell_seconds seconds"
          - "sets bay_released_at = treated_at + BAY_BUFFER_MINUTES minutes"
          - "increments DeconOrder.attempt_count by 1"
          - "sets treated_by_inspector_id = X-User-ID"
          - "runs decon_treatment_effectiveness; sets treatment_effectiveness_pct"
          - "runs decon_required_dry_hours; sets base_dry_hours, required_dry_hours and dry_until = treated_at + required_dry_hours hours"
          - "sets DeconOrder.status = TREATED"
          - "re-runs inspection_total_fee_cents on the parent InspectionRecord with the new dwell_seconds; overwrites decon_fee_cents, surcharge_cents, total_fee_cents"
          - "applies the total_fee_cents delta to InspectionStation.collected_fees_cents"
          - "increments InspectionRecord.version by 1"
          - "increments InspectionStation.version by 1"
          - "increments DeconOrder.version by 1"
      - from: RETREAT_REQUIRED
        to: TREATED
        trigger: "POST /decon-orders/{id}/treatment (retreatment)"
        actor: DeconTechnician
        preconditions:
          - "decon_order.status == RETREAT_REQUIRED"
          - "decon_order.attempt_count < MAX_DECON_ATTEMPTS"
          - "acting Inspector.status == ACTIVE and certification_level == DECON_CERTIFIED"
          - "InspectionStation.hot_water_capable == true for decon_order.station_id"
          - "payload.water_temp_f >= MIN_TREATMENT_TEMP_F and payload.pressure_psi >= MIN_TREATMENT_PSI"
          - "the bay occupation collides with fewer than InspectionStation.decon_bay_count other occupations at the same station"
        side_effects:
          - "same side effects as ORDERED -> TREATED, overwriting the previous treatment fields"
          - "sets DeconOrder.status = TREATED"
          - "increments DeconOrder.attempt_count by 1"
          - "increments DeconOrder.version by 1"
        note: "Closes the retreat loop. attempt_count is monotonic across the loop, so the MAX_DECON_ATTEMPTS cap is what terminates it: the fourth treatment on the same order is rejected with ERR_DECON_ATTEMPTS_EXHAUSTED while the order stays in RETREAT_REQUIRED."
      - from: TREATED
        to: VERIFIED
        trigger: "POST /decon-orders/{id}/dry-verification with outcome VERIFIED"
        actor: ReleaseVerifier
        preconditions:
          - "decon_order.status == TREATED"
          - "logical_now >= decon_order.dry_until"
          - "X-User-ID != decon_order.treated_by_inspector_id (segregation of duties)"
          - "acting Inspector.status == ACTIVE"
        side_effects:
          - "sets DeconOrder.status = VERIFIED and verified_by_inspector_id = X-User-ID"
          - "drives the parent InspectionRecord DECON_REQUIRED -> DECON_COMPLETED (cascade hop 2)"
          - "the record transition in turn sets Watercraft.last_decon_verified_at and clears Watercraft.mandatory_decon_flag (cascade hop 3)"
          - "increments DeconOrder.version by 1"
      - from: TREATED
        to: RETREAT_REQUIRED
        trigger: "POST /decon-orders/{id}/dry-verification with outcome RETREAT"
        actor: ReleaseVerifier
        preconditions:
          - "decon_order.status == TREATED"
          - "logical_now >= decon_order.dry_until"
          - "X-User-ID != decon_order.treated_by_inspector_id (segregation of duties)"
        side_effects:
          - "sets DeconOrder.status = RETREAT_REQUIRED and verified_by_inspector_id = X-User-ID"
          - "leaves the parent InspectionRecord in DECON_REQUIRED"
          - "increments DeconOrder.version by 1"
      - from: TREATED
        to: ABANDONED
        trigger: "POST /decon-orders/{id}/dry-verification with outcome ABANDON"
        actor: ReleaseVerifier
        preconditions:
          - "decon_order.status == TREATED"
          - "X-User-ID != decon_order.treated_by_inspector_id (segregation of duties)"
        side_effects:
          - "sets DeconOrder.status = ABANDONED and verified_by_inspector_id = X-User-ID"
          - "drives the parent InspectionRecord DECON_REQUIRED -> DECON_FAILED_ABANDONED (cascade hop 2)"
          - "the record transition in turn reverses the treatment-attributable fee on InspectionStation.collected_fees_cents (cascade hop 3)"
          - "increments DeconOrder.version by 1"

  - entity: QuarantineOrder
    initial_state: SEALED
    terminal_states: [RELEASED, VOIDED_BREACH]
    note: "Cyclic machine - SEALED -> RELEASE_REQUESTED -> SEALED repeats on every rejected release, each pass extending the hold."
    transitions:
      - from: SEALED
        to: RELEASE_REQUESTED
        trigger: "POST /quarantine-orders/{id}/release-request"
        actor: Inspector
        preconditions:
          - "quarantine_order.status == SEALED"
          - "quarantine_order.issued_by_inspector_id == X-User-ID"
          - "logical_now >= quarantine_order.hold_until"
        side_effects:
          - "sets QuarantineOrder.status = RELEASE_REQUESTED"
          - "increments QuarantineOrder.version by 1"
      - from: RELEASE_REQUESTED
        to: RELEASED
        trigger: "POST /quarantine-orders/{id}/release with outcome APPROVED"
        actor: ReleaseVerifier
        preconditions:
          - "quarantine_order.status == RELEASE_REQUESTED"
          - "acting Inspector.status == ACTIVE"
          - "logical_now >= quarantine_order.hold_until"
          - "when InspectionRecord.decon_mandatory == true for quarantine_order.inspection_record_id, some DeconOrder of that record has status VERIFIED; when decon_mandatory is false this precondition is vacuous and no DeconOrder need exist"
          - "X-User-ID != quarantine_order.issued_by_inspector_id (segregation of duties)"
        side_effects:
          - "sets QuarantineOrder.status = RELEASED and release_verified_by_inspector_id = X-User-ID"
          - "decrements InspectionStation.seals_in_circulation_count by 1 and increments seals_retired_count by 1"
          - "clears Watercraft.quarantine_hold_until"
          - "increments InspectionStation.version by 1"
          - "increments Watercraft.version by 1"
          - "increments QuarantineOrder.version by 1"
        note: "Compensating action for the seal consumed at issuance; see the seal_inventory_conservation invariant."
      - from: RELEASE_REQUESTED
        to: SEALED
        trigger: "POST /quarantine-orders/{id}/release with outcome REJECTED"
        actor: ReleaseVerifier
        preconditions:
          - "quarantine_order.status == RELEASE_REQUESTED"
          - "acting Inspector.status == ACTIVE"
          - "X-User-ID != quarantine_order.issued_by_inspector_id (segregation of duties)"
        side_effects:
          - "sets QuarantineOrder.status = SEALED and release_verified_by_inspector_id = X-User-ID"
          - "increments QuarantineOrder.rejected_release_count by 1"
          - "re-runs quarantine_hold_hours; overwrites hold_hours_required and hold_until = issued_at + hold_hours_required hours (cascade hop 2, caused by the rejected_release_count increment)"
          - "sets Watercraft.quarantine_hold_until = the new hold_until (cascade hop 2)"
          - "when rejected_release_count reaches REJECTED_RELEASE_REFERRAL_THRESHOLD, drives the parent InspectionRecord enforcement dimension NONE -> REFERRED with referral_reason = QUARANTINE_RELEASE_FAILURE (cascade hop 2, caused by the same increment)"
          - "the referral in turn increments Watercraft.compliance_strikes and flips watchlist_status to WATCHLISTED at the threshold (cascade hop 3)"
          - "the watchlist flip in turn sets Watercraft.mandatory_decon_flag = true (cascade hop 4)"
          - "increments Watercraft.version by 1"
          - "increments QuarantineOrder.version by 1"
        note: "Closes the release loop; each rejection extends the hold by REJECTION_EXTENSION_HOURS."
      - from: SEALED
        to: VOIDED_BREACH
        trigger: "POST /quarantine-orders/{id}/breach-report"
        actor: EnforcementOfficer
        preconditions:
          - "quarantine_order.status == SEALED"
        side_effects:
          - "sets QuarantineOrder.status = VOIDED_BREACH"
          - "decrements InspectionStation.seals_in_circulation_count by 1 and increments seals_retired_count by 1"
          - "clears Watercraft.quarantine_hold_until"
          - "drives the parent InspectionRecord enforcement dimension NONE -> REFERRED with referral_reason = SEAL_TAMPER when enforcement_status == NONE"
          - "increments InspectionStation.version by 1"
          - "increments Watercraft.version by 1"
          - "increments QuarantineOrder.version by 1"
      - from: RELEASE_REQUESTED
        to: VOIDED_BREACH
        trigger: "POST /quarantine-orders/{id}/breach-report"
        actor: EnforcementOfficer
        preconditions:
          - "quarantine_order.status == RELEASE_REQUESTED"
        side_effects:
          - "same side effects as SEALED -> VOIDED_BREACH"
          - "increments QuarantineOrder.version by 1"

  - entity: DetectionReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    note: "Cyclic machine - SUBMITTED -> REJECTED -> SUBMITTED repeats until the state database accepts the report."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /detection-reports/{id}/submission"
        actor: Inspector
        preconditions:
          - "detection_report.status == DRAFT"
          - "detection_report.reported_by_inspector_id == X-User-ID"
          - "acting Inspector.status == ACTIVE"
        side_effects:
          - "sets DetectionReport.status = SUBMITTED"
          - "increments DetectionReport.submission_count by 1"
          - "increments DetectionReport.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /detection-reports/{id}/submission (resubmission)"
        actor: Inspector
        preconditions:
          - "detection_report.status == REJECTED"
          - "detection_report.reported_by_inspector_id == X-User-ID"
        side_effects:
          - "sets DetectionReport.status = SUBMITTED and clears rejection_reason"
          - "increments DetectionReport.submission_count by 1"
          - "increments DetectionReport.version by 1"
        note: "Closes the resubmission loop."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /detection-reports/{id}/state-acknowledgement with verdict ACCEPTED"
        actor: StateDataSteward
        preconditions:
          - "detection_report.status == SUBMITTED"
        side_effects:
          - "sets DetectionReport.status = ACCEPTED and state_db_ack_id from the payload"
          - "increments WaterBody.detection_count by 1, and live_detection_count by 1 when detection_class == LIVE_ORGANISM (cascade hop 2)"
          - "when live_detection_count >= INFESTATION_CONFIRM_LIVE_THRESHOLD sets WaterBody.infestation_status = CONFIRMED_INFESTED and risk_tier = HIGH; otherwise when detection_count >= 1 and infestation_status == CLEAN sets infestation_status = SUSPECT (cascade hop 2, caused by the counter increment)"
          - "because the WaterBody became CONFIRMED_INFESTED, every InspectionStation with water_body_id == that water body and status IN {PLANNED, OPEN, SUSPENDED} and mandatory_inspection == false has mandatory_inspection set to true (cascade hop 3)"
          - "because those stations flipped mandatory_inspection false -> true, every StationHours row of each such station with staffing_level == SINGLE is upgraded to DOUBLE (cascade hop 4)"
          - "increments WaterBody.version by 1, and the version of every station and hours row touched by hops 3 and 4"
          - "increments DetectionReport.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /detection-reports/{id}/state-acknowledgement with verdict REJECTED"
        actor: StateDataSteward
        preconditions:
          - "detection_report.status == SUBMITTED"
        side_effects:
          - "sets DetectionReport.status = REJECTED and rejection_reason from the payload"
          - "no WaterBody counter changes"
          - "increments DetectionReport.version by 1"

  - entity: EducationCampaign
    initial_state: PLANNED
    terminal_states: [EVALUATED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /education-campaigns/{id}/status with target_status RUNNING"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == PLANNED"
          - "at least one InspectionStation exists with water_body_id == campaign.target_water_body_id and status IN {PLANNED, OPEN, SUSPENDED}"
        side_effects:
          - "sets EducationCampaign.status = RUNNING"
          - "runs campaign_station_allocation_cents; sets station_allocations"
          - "adds each allocation to the corresponding InspectionStation.campaign_allocated_cents"
          - "increments the version of every allocated InspectionStation by 1"
          - "increments EducationCampaign.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /education-campaigns/{id}/status with target_status CANCELLED"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == PLANNED"
        side_effects:
          - "sets EducationCampaign.status = CANCELLED"
          - "increments EducationCampaign.version by 1"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /education-campaigns/{id}/status with target_status CANCELLED"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == RUNNING"
        side_effects:
          - "sets EducationCampaign.status = CANCELLED"
          - "subtracts each station_allocations entry's allocated_cents from the corresponding InspectionStation.campaign_allocated_cents"
          - "sets EducationCampaign.station_allocations = []"
          - "increments the version of every de-allocated InspectionStation by 1"
          - "increments EducationCampaign.version by 1"
        note: "Compensating action for the launch allocation; see the campaign_budget_conservation invariant."
      - from: RUNNING
        to: EVALUATED
        trigger: "POST /education-campaigns/{id}/evaluation"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == RUNNING"
          - "logical_now >= campaign.end_at"
          - "the evaluation window denominator is non-empty (see campaign_effectiveness_score input_set)"
        side_effects:
          - "sets EducationCampaign.evaluation_method from the payload"
          - "runs campaign_effectiveness_score under both variants; sets window_compliance_rate, baseline_compliance_rate, effectiveness_score and alternate_effectiveness_score"
          - "sets EducationCampaign.status = EVALUATED"
          - "leaves station_allocations and every InspectionStation.campaign_allocated_cents untouched"
          - "increments EducationCampaign.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: rescreen-stale-watercraft
    parent_entity: Watercraft
    write_endpoint: "POST /inspection-records/{id}/screening"
    occ_field: "expected_watercraft_version"
    description: |
      Screening a watercraft whose version has advanced since the client last
      observed it is rejected. Re-screening is a legitimate supersede under the
      InspectionRecord SCREENED -> SCREENED transition, so no state precondition
      separates a writer holding a stale view of the vessel from one holding a
      fresh view; the stale-version check is the only deterministic resolution.
      The vessel's version also advances whenever an enforcement referral books
      a compliance strike or a verified decon clears the mandatory_decon_flag,
      so a client that read the vessel before either cascade holds a stale
      version even though it never issued a screening of its own.
    error_id: ERR_STALE_WATERCRAFT_VERSION
    http_status: 412

  - rule_id: decon-order-create-stale-record
    parent_entity: InspectionRecord
    write_endpoint: "POST /decon-orders"
    occ_field: "expected_inspection_record_version"
    description: |
      Creating a DeconOrder against an InspectionRecord whose version has
      advanced since the client last observed it is rejected. A record in
      DECON_REQUIRED may legitimately carry more than one DeconOrder - a fresh
      order re-books the vessel for a new treatment cycle and supersedes the
      earlier one, which stops gating the record - so a second sequential
      create observes exactly the same inspection_status as the first and would
      otherwise succeed on the product's own semantics. The stale-version check
      pins which view of the record the new order was written against.
    error_id: ERR_STALE_INSPECTION_RECORD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: inspector_certification_level
    trigger: "On POST /inspectors/{id}/training-records, after the record row is persisted; also re-evaluated on the Inspector SUSPENDED -> ACTIVE transition."
    algorithm: aggregation + threshold
    formula: |
      training_hours_total = round_half_up(
          sum of TrainingRecord.hours over rows with inspector_id == inspector.id
          AND passed == true, 2)
      if training_hours_total < CERT_LEVEL1_HOURS:            certification_level = TRAINEE
      elif training_hours_total < CERT_LEVEL2_HOURS:          certification_level = LEVEL_1
      elif inspector.decon_endorsement == false:              certification_level = LEVEL_2
      else:                                                   certification_level = DECON_CERTIFIED
    input_set: "TrainingRecord rows for this inspector with passed == true only; rows with passed == false credit zero hours and are excluded from the sum."
    constants:
      CERT_LEVEL1_HOURS: 8
      CERT_LEVEL2_HOURS: 40
      CERT_VALID_HOURS: 8760
      CERTIFIED_INSPECTOR_DECON_THRESHOLD: 2
    precision: "training_hours_total to 2 decimal places, round_half_up; thresholds compared with >= (a total of exactly 40.00 reaches LEVEL_2/DECON_CERTIFIED)."

  - name: reciprocity_seal_decision
    trigger: "On POST /inspection-records/{id}/screening, before watercraft_risk_score runs."
    algorithm: threshold
    formula: |
      if record.presented_seal_number is null:
          reciprocity_seal_honored = false; reciprocity_credit_points = 0
          honored_agreement_id = null; STOP
      agreement = the ReciprocityAgreement with partner_state_code == record.presented_seal_state_code
      if no such agreement:                       REJECT ERR_RECIPROCITY_AGREEMENT_NOT_FOUND (404)
      if agreement.status == SUSPENDED:
          reciprocity_seal_honored = false; reciprocity_credit_points = 0
          honored_agreement_id = null; STOP        # not an error - the seal is simply not honored
      if record.presented_seal_number does not start with agreement.accepted_seal_prefix:
                                                  REJECT ERR_SEAL_PREFIX_MISMATCH (422)
      seal_age_hours = floor((record.arrived_at - record.presented_seal_issued_at) in hours)
      if seal_age_hours > agreement.max_seal_age_hours:
                                                  REJECT ERR_SEAL_RECIPROCITY_EXPIRED (422)
      reciprocity_seal_honored = true
      honored_agreement_id = agreement.id
      reciprocity_credit_points = RECIPROCITY_CREDIT_POINTS
    input_set: "Exactly one ReciprocityAgreement is consulted - the row whose partner_state_code equals presented_seal_state_code (partner_state_code is unique, so the selector is total and needs no ranking or tie-break). Only status ACTIVE agreements honor a seal."
    constants:
      RECIPROCITY_CREDIT_POINTS: 20
      PROGRAM_STATE_CODE: "MT"
    precision: "seal_age_hours is floored to whole hours; the age test rejects only when strictly greater than max_seal_age_hours, so an age of exactly max_seal_age_hours is honored."

  - name: watercraft_risk_score
    trigger: "On POST /inspection-records/{id}/screening (both the INITIATED -> SCREENED and the SCREENED -> SCREENED transitions)."
    algorithm: weighted_scoring
    formula: |
      wb = WaterBody with id == record.prior_water_body_id
      wc = Watercraft with id == record.watercraft_id

      tier_points        = RISK_TIER_POINTS[wb.risk_tier]
      infestation_points = INFESTATION_POINTS[wb.infestation_status]

      water_points = 0
      if record.residual_water_present == true:
          water_points = RESIDUAL_WATER_BASE_POINTS
                         + min(RESIDUAL_WATER_ML_CAP_POINTS,
                               floor(record.standing_water_ml / RESIDUAL_WATER_ML_DIVISOR))

      if wc.last_removed_at is null:
          standing_hours = 0
      else:
          standing_hours = max(0, floor((basis_instant - wc.last_removed_at) in hours))
      dry_credit_points = min(DRY_CREDIT_CAP_POINTS,
                              floor(standing_hours / 24) * DRY_CREDIT_POINTS_PER_DAY)

      reciprocity_credit_points = RECIPROCITY_CREDIT_POINTS
                                  if record.reciprocity_seal_honored else 0

      vessel_factor = VESSEL_FACTOR_ELEVATED
                      if wc.vessel_type IN {PONTOON_MULTI_CHAMBER, BALLASTED_WAKEBOAT}
                      else VESSEL_FACTOR_STANDARD

      # PINNED ORDER: sum the point terms, multiply by vessel_factor, round ONCE,
      # then clamp. Rounding each term before the multiplication yields a
      # different integer whenever vessel_factor != 1.00.
      raw   = (tier_points + infestation_points + water_points
               - dry_credit_points - reciprocity_credit_points) * vessel_factor
      score = min(RISK_SCORE_MAX, max(RISK_SCORE_MIN, round_half_up(raw, 0)))
    input_set: |
      Exactly one WaterBody (record.prior_water_body_id) and one Watercraft
      (record.watercraft_id). No aggregation over sibling records. The
      reciprocity term reads the boolean already fixed by
      reciprocity_seal_decision earlier in the same request.
    constants:
      RISK_TIER_POINTS: { HIGH: 40, MODERATE: 20, LOW: 5 }
      INFESTATION_POINTS: { CONFIRMED_INFESTED: 30, SUSPECT: 15, CLEAN: 0 }
      RESIDUAL_WATER_BASE_POINTS: 20
      RESIDUAL_WATER_ML_DIVISOR: 100
      RESIDUAL_WATER_ML_CAP_POINTS: 15
      DRY_CREDIT_POINTS_PER_DAY: 5
      DRY_CREDIT_CAP_POINTS: 25
      RECIPROCITY_CREDIT_POINTS: 20
      VESSEL_FACTOR_ELEVATED: 1.25
      VESSEL_FACTOR_STANDARD: 1.00
      RISK_SCORE_MIN: 0
      RISK_SCORE_MAX: 100
    precision: "score is a whole number, round_half_up on the product, then clamped to [0, 100]. dry_credit_points and water_points are whole numbers by construction."
    variants:
      - name: arrival_basis
        when: "Always. This is the authoritative variant; its output is written to InspectionRecord.risk_score and its dry credit to InspectionRecord.dry_credit_points, and every gate (risk_band, decon_mandatory, quarantine_warranted, BASE_DRY_HOURS, BASE_HOLD_HOURS) reads it."
        difference: "basis_instant = record.arrived_at - the instant the boater reached the station."
      - name: screening_basis
        when: "Always, in the same request. Its output is written to InspectionRecord.advisory_risk_score and is never used for gating."
        difference: "basis_instant = the logical clock at the screening call. Because the boater waits in the queue between arrival and screening, the standing time is longer, the dry credit is larger or equal, and the two variants produce different integers whenever the extra wait crosses a 24-hour boundary."

  - name: watercraft_risk_band
    trigger: "On POST /inspection-records/{id}/screening, immediately after watercraft_risk_score's arrival_basis output is written."
    algorithm: threshold
    formula: |
      if   record.risk_score <  BAND_MODERATE_MIN:  risk_band = LOW
      elif record.risk_score <  BAND_HIGH_MIN:      risk_band = MODERATE
      elif record.risk_score <  BAND_EXTREME_MIN:   risk_band = HIGH
      else:                                         risk_band = EXTREME

      decon_mandatory = (risk_band IN {HIGH, EXTREME})
                        OR (Watercraft.mandatory_decon_flag == true)
                        OR (risk_band == MODERATE AND record.residual_water_present == true)
      quarantine_warranted = (risk_band == EXTREME)
                             OR (WaterBody[record.prior_water_body_id].infestation_status
                                 == CONFIRMED_INFESTED)
    input_set: "record.risk_score (arrival_basis only), record.residual_water_present, the vessel's mandatory_decon_flag, and the prior water body's infestation_status."
    constants:
      BAND_MODERATE_MIN: 25
      BAND_HIGH_MIN: 50
      BAND_EXTREME_MIN: 75
    precision: "Boundaries are half-open on the low side: a score of exactly 50 is HIGH (not MODERATE) and a score of exactly 75 is EXTREME (not HIGH)."

  - name: decon_treatment_effectiveness
    trigger: "On POST /decon-orders/{id}/treatment, after the sub-minimum temperature/pressure validation has passed."
    algorithm: weighted_scoring
    formula: |
      # water_temp_f >= MIN_TREATMENT_TEMP_F and pressure_psi >= MIN_TREATMENT_PSI are
      # already guaranteed by validation priority 20, so no zero branch exists here.
      temp_factor  = 0.5 if payload.water_temp_f  <  HIGH_TREATMENT_TEMP_F else 1.0
      psi_factor   = 0.6 if payload.pressure_psi  <  HIGH_TREATMENT_PSI    else 1.0
      dwell_factor = min(1.0, payload.dwell_seconds
                              / REQUIRED_DWELL_SECONDS[decon_order.band_at_order])
      treatment_effectiveness_pct = round_half_up(
          temp_factor * psi_factor * dwell_factor * 100, 2)
    input_set: "Only the three payload measurements of the treatment being recorded plus decon_order.band_at_order (frozen at order creation, never re-read from the record)."
    constants:
      MIN_TREATMENT_TEMP_F: 120
      HIGH_TREATMENT_TEMP_F: 140
      MIN_TREATMENT_PSI: 1500
      HIGH_TREATMENT_PSI: 3000
      REQUIRED_DWELL_SECONDS: { LOW: 30, MODERATE: 60, HIGH: 120, EXTREME: 180 }
    precision: "2 decimal places, round_half_up. Both factor thresholds use >=: exactly 140 F gives temp_factor 1.0 and exactly 3000 PSI gives psi_factor 1.0."

  - name: decon_required_dry_hours
    trigger: "On POST /decon-orders/{id}/treatment, immediately after decon_treatment_effectiveness in the same request."
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED 1 -> 5. required_dry_hours is NEVER back-derived
      # from dry_until, and base_dry_hours is NEVER re-keyed on a later re-screen.
      STEP 1: base_dry_hours = BASE_DRY_HOURS[decon_order.band_at_order]
      STEP 2: e = decon_order.treatment_effectiveness_pct   (from the step above)
      STEP 3: credit_hours = floor(base_dry_hours * (e / 100) * MAX_CREDIT_FRACTION)
      STEP 4: required_dry_hours = max(MIN_DRY_HOURS, base_dry_hours - credit_hours)
      STEP 5: dry_until = decon_order.treated_at + required_dry_hours hours
    input_set: "decon_order.band_at_order, decon_order.treatment_effectiveness_pct and decon_order.treated_at of the treatment just recorded. No sibling DeconOrder is consulted."
    constants:
      BASE_DRY_HOURS: { LOW: 12, MODERATE: 36, HIGH: 72, EXTREME: 120 }
      MAX_CREDIT_FRACTION: 0.75
      MIN_DRY_HOURS: 6
      BAY_BUFFER_MINUTES: 30
      MAX_DECON_ATTEMPTS: 3
    precision: "credit_hours is floored to whole hours; required_dry_hours is a whole number of hours and never drops below MIN_DRY_HOURS."

  - name: inspection_total_fee_cents
    trigger: "On every InspectionRecord SCREENED -> {PASSED, DECON_REQUIRED, REFUSED} disposition (with decon_fee_cents forced to 0), and re-run on every DeconOrder treatment (ORDERED -> TREATED and RETREAT_REQUIRED -> TREATED) with the dwell of that treatment."
    algorithm: tiered_pricing
    formula: |
      # The statute keys the program surcharge on "the total fee", but the total is
      # itself subtotal + surcharge - a circular-looking definition. THE ORDER IS
      # PINNED: the waiver is applied first, the subtotal is formed second, the tier
      # is selected from the PRE-surcharge subtotal_cents third, and total_cents is
      # formed last. The tier is NEVER re-selected from total_cents.
      STEP 1: fee_waiver_applies = record.reciprocity_seal_honored == true
                    AND ReciprocityAgreement[record.honored_agreement_id].fee_waiver == true
              inspection_fee_cents = 0 if fee_waiver_applies else BASE_INSPECTION_FEE_CENTS
      STEP 2: decon_fee_cents = 0 on a disposition call;
                                DECON_RATE_CENTS_PER_MINUTE * ceil(dwell_seconds / 60)
                                on a treatment call, where dwell_seconds is the value
                                just recorded on the targeted DeconOrder
      STEP 3: subtotal_cents = inspection_fee_cents + decon_fee_cents
      STEP 4: surcharge_pct = 0.00 if subtotal_cents <  SURCHARGE_TIER_1_THRESHOLD_CENTS
                         else 0.05 if subtotal_cents <  SURCHARGE_TIER_2_THRESHOLD_CENTS
                         else 0.10
      STEP 5: surcharge_cents = round_half_up(subtotal_cents * surcharge_pct, 0)
      STEP 6: total_fee_cents = subtotal_cents + surcharge_cents
      STEP 7: InspectionStation.collected_fees_cents += (new total_fee_cents
                                                        - previous total_fee_cents)
    input_set: "One InspectionRecord and, on a treatment call, exactly the DeconOrder the call targets. Sibling DeconOrders of the same record never contribute; each treatment overwrites the decon component."
    constants:
      BASE_INSPECTION_FEE_CENTS: 2500
      DECON_RATE_CENTS_PER_MINUTE: 450
      SURCHARGE_TIER_1_THRESHOLD_CENTS: 10000
      SURCHARGE_TIER_2_THRESHOLD_CENTS: 25000
    precision: "Whole cents. Tier boundaries use >=: a subtotal of exactly 25000 cents lands in the 10 percent tier, not the 5 percent tier. dwell minutes are rounded UP (ceil) before multiplication."

  - name: quarantine_hold_hours
    trigger: "On POST /quarantine-orders (issuance) and re-run on every QuarantineOrder RELEASE_REQUESTED -> SEALED rejected release."
    algorithm: threshold
    formula: |
      hold_hours_required = BASE_HOLD_HOURS[quarantine_order.band_at_issue]
                            + REJECTION_EXTENSION_HOURS
                              * quarantine_order.rejected_release_count
      hold_until = quarantine_order.issued_at + hold_hours_required hours
      Watercraft.quarantine_hold_until = hold_until
    input_set: "band_at_issue frozen at issuance and the order's own rejected_release_count after the increment for this rejection. No sibling QuarantineOrder is consulted."
    constants:
      BASE_HOLD_HOURS: { LOW: 24, MODERATE: 48, HIGH: 72, EXTREME: 120 }
      REJECTION_EXTENSION_HOURS: 24
      REJECTED_RELEASE_REFERRAL_THRESHOLD: 2
      WATCHLIST_STRIKE_THRESHOLD: 2
    precision: "Whole hours. hold_until is always recomputed from issued_at, never from the previous hold_until, so two rejections give issued_at + base + 48 h exactly."

  - name: enforcement_penalty_cents
    trigger: "On the InspectionRecord enforcement transition REFERRED -> CITED."
    algorithm: threshold
    formula: |
      prior_strikes = max(0, Watercraft.compliance_strikes - 1)
      # -1 excludes the strike this record's own referral booked.
      penalty_cents = PENALTY_BASE_CENTS + PENALTY_STRIKE_STEP_CENTS * prior_strikes
    input_set: "Watercraft.compliance_strikes as it stands at the CITE call, on the vessel named by record.watercraft_id."
    constants:
      PENALTY_BASE_CENTS: 15000
      PENALTY_STRIKE_STEP_CENTS: 7500
    precision: "Whole cents; no rounding is needed because every term is an integer."

  - name: campaign_station_allocation_cents
    trigger: "On the EducationCampaign transition PLANNED -> RUNNING."
    algorithm: waterfall_allocation
    formula: |
      candidates = InspectionStation rows with water_body_id == campaign.target_water_body_id
                   AND status IN {PLANNED, OPEN, SUSPENDED}     # CLOSED stations excluded
      ORDER = created_at ASC, then name ASC (byte-order) as the tie-break.
              InspectionStation.id is never consulted for ordering.
      if candidates is empty:  REJECT ERR_NO_STATIONS_FOR_CAMPAIGN (422)

      weight_i = 1 + count of InspectionRecord with station_id == candidate_i.id
                     AND arrived_at >= campaign.start_at
                     AND arrived_at <  campaign.end_at          # half-open window
      total_weight = sum over candidates of weight_i

      # ROUNDING ORDER IS PINNED: floor PER STATION first, then hand the remainder
      # out one cent at a time in the pinned ORDER. Summing the exact fractional
      # shares and rounding once at the end distributes different cents; that
      # alternative is explicitly NOT this scaffold's rule.
      allocated_i = floor(campaign.budget_cents * weight_i / total_weight)
      remainder   = campaign.budget_cents - sum over candidates of allocated_i
      for k in 0 .. remainder - 1:
          allocated_(candidates[k]) += 1        # k indexes the pinned ORDER
      station_allocations = [ { station_id: candidate_i.id,
                                allocated_cents: allocated_i } ]
                            emitted in the pinned ORDER
    input_set: "Candidate stations are filtered by the explicit status set {PLANNED, OPEN, SUSPENDED}. The traffic weight counts InspectionRecord rows of any inspection_status whose arrived_at falls in the half-open campaign window."
    constants:
      CAMPAIGN_BUDGET_CAP_CENTS: 5000000
    precision: "Whole cents; sum of station_allocations[].allocated_cents == campaign.budget_cents exactly, by construction (0 <= remainder < candidate count)."

  - name: campaign_effectiveness_score
    trigger: "On the EducationCampaign transition RUNNING -> EVALUATED."
    algorithm: weighted_scoring
    formula: |
      window_len = campaign.end_at - campaign.start_at

      compliance_rate(scope, from_ts, to_ts):
          numerator   = count InspectionRecord matching scope
                          AND inspection_status IN {PASSED, DECON_COMPLETED}
                          AND arrived_at >= from_ts AND arrived_at < to_ts
          denominator = count InspectionRecord matching scope
                          AND inspection_status IN {PASSED, DECON_COMPLETED,
                                                    REFUSED, DECON_FAILED_ABANDONED}
                          AND arrived_at >= from_ts AND arrived_at < to_ts
          # records still in INITIATED or SCREENED are excluded from BOTH counts
          return null if denominator == 0 else numerator / denominator

      scope TARGET    = prior_water_body_id == campaign.target_water_body_id
      scope STATEWIDE = every InspectionRecord, regardless of prior_water_body_id

      w = compliance_rate(TARGET, campaign.start_at, campaign.end_at)
      if w is null:  REJECT ERR_NO_INSPECTIONS_IN_WINDOW (422)
      window_compliance_rate = round_half_up(w, 4)

      b_pre_post = compliance_rate(TARGET, campaign.start_at - window_len,
                                           campaign.start_at)
      if b_pre_post is null: b_pre_post = 0.0000
      b_control  = compliance_rate(STATEWIDE, campaign.start_at, campaign.end_at)
      # b_control is never null here: the TARGET denominator is a subset of the
      # STATEWIDE denominator and it is already known to be non-zero.

      impressions_bonus = min(CAMPAIGN_IMPRESSIONS_BONUS_CAP,
                              floor(campaign.impressions
                                    / CAMPAIGN_IMPRESSIONS_BONUS_DIVISOR))

      score(b) = min(100.00, max(0.00, round_half_up(
                     50 + (window_compliance_rate - round_half_up(b, 4)) * 100
                        + impressions_bonus, 2)))

      chosen    = b_pre_post if evaluation_method == PRE_POST else b_control
      alternate = b_control  if evaluation_method == PRE_POST else b_pre_post
      baseline_compliance_rate      = round_half_up(chosen, 4)
      effectiveness_score           = score(chosen)
      alternate_effectiveness_score = score(alternate)
    input_set: |
      Both counts are restricted to terminal-disposition InspectionRecords only -
      numerator statuses {PASSED, DECON_COMPLETED}, denominator statuses
      {PASSED, DECON_COMPLETED, REFUSED, DECON_FAILED_ABANDONED}. Windows are
      half-open [from, to) on arrived_at. The PRE_POST baseline window is the
      equal-length interval immediately preceding start_at; the CONTROL_CORRIDOR
      baseline is the same window widened from the target water body to every
      water body in the program.
    constants:
      CAMPAIGN_IMPRESSIONS_BONUS_DIVISOR: 5000
      CAMPAIGN_IMPRESSIONS_BONUS_CAP: 10
    precision: "Rates to 4 decimal places, scores to 2 decimal places, round_half_up, clamped to [0.00, 100.00]."
    variants:
      - name: pre_post
        when: "evaluation_method == PRE_POST on the evaluation call."
        difference: "Baseline is the SAME water body over the equal-length window immediately before start_at - a before/after comparison. Its result lands in effectiveness_score and the control result lands in alternate_effectiveness_score."
      - name: control_corridor
        when: "evaluation_method == CONTROL_CORRIDOR on the evaluation call."
        difference: "Baseline is EVERY water body in the program over the SAME window as the campaign - a synthetic-control comparison. On identical data the two baselines differ whenever the target water body's compliance history differs from the statewide contemporaneous rate, so the two variants report different effectiveness_score values for the same campaign."

  - name: water_body_infestation_status
    trigger: "On the DetectionReport transition SUBMITTED -> ACCEPTED, immediately after the water body counters are incremented."
    algorithm: threshold
    formula: |
      # Runs on the counters AS THEY STAND AFTER this acceptance's increments.
      if water_body.live_detection_count >= INFESTATION_CONFIRM_LIVE_THRESHOLD:
          infestation_status = CONFIRMED_INFESTED
          risk_tier          = HIGH
      elif water_body.detection_count >= INFESTATION_SUSPECT_DETECTION_THRESHOLD
           AND water_body.infestation_status == CLEAN:
          infestation_status = SUSPECT
          risk_tier          = unchanged
      else:
          infestation_status = unchanged
          risk_tier          = unchanged
      # Escalation is one-way: CONFIRMED_INFESTED is never walked back to
      # SUSPECT or CLEAN, and SUSPECT is never walked back to CLEAN, by any
      # endpoint in this scaffold.
    input_set: "Only the two counters on the single WaterBody named by the accepted report. Reports still in DRAFT, SUBMITTED or REJECTED contribute nothing, and a REJECTED acknowledgement never touches the counters."
    constants:
      INFESTATION_CONFIRM_LIVE_THRESHOLD: 2
      INFESTATION_SUSPECT_DETECTION_THRESHOLD: 1
    precision: "Integer counter comparisons with >=. The live threshold is checked first, so the second accepted LIVE_ORGANISM report jumps a CLEAN water body straight to CONFIRMED_INFESTED without passing through SUSPECT on that call."

# =============================================================================
# 1.3.1 Compensating-Action Invariants (named conserved quantities)
# =============================================================================
invariants:
  - name: seal_inventory_conservation
    conserved_quantity: "physical seal count at a station"
    formula: |
      For every InspectionStation whose status has ever left PLANNED:
        seal_stock_count + seals_in_circulation_count + seals_retired_count
          == seal_stock_initial_count
    forward_action: "POST /quarantine-orders - debits seal_stock_count by 1 and credits seals_in_circulation_count by 1."
    compensating_action: "POST /quarantine-orders/{id}/release with outcome APPROVED (or POST /quarantine-orders/{id}/breach-report) - debits seals_in_circulation_count by 1 and credits seals_retired_count by 1."
    note: "The three counters move between each other only; no path adds to or subtracts from the total, so the sum is unchanged by the forward action, by the compensating action, and by any number of rejected-release loops in between."

  - name: campaign_budget_conservation
    conserved_quantity: "allocated campaign money in cents"
    formula: |
      sum over InspectionStation of campaign_allocated_cents
        == sum over EducationCampaign with status IN {RUNNING, EVALUATED} of budget_cents
      AND for every campaign with status IN {RUNNING, EVALUATED}:
        sum over station_allocations of allocated_cents == budget_cents
    forward_action: "EducationCampaign PLANNED -> RUNNING - credits each candidate station's campaign_allocated_cents with its allocation."
    compensating_action: "EducationCampaign RUNNING -> CANCELLED - debits each station by exactly the allocation recorded in station_allocations and empties the array."
    note: "RUNNING -> EVALUATED deliberately leaves both sides untouched, so evaluating a campaign cannot drift the ledger."

  - name: fee_ledger_conservation
    conserved_quantity: "station fee ledger in cents"
    formula: |
      For every InspectionStation:
        collected_fees_cents
          == sum over InspectionRecord with station_id == station.id
             of (total_fee_cents - fee_refunded_cents)
      AND refunded_fees_cents == sum over the same records of fee_refunded_cents
    forward_action: "POST /decon-orders/{id}/treatment - books the decon fee delta onto collected_fees_cents."
    compensating_action: "The DeconOrder TREATED -> ABANDONED cascade sets fee_refunded_cents = decon_fee_cents + surcharge_cents and subtracts the same amount from collected_fees_cents."
    note: "The refund reverses the treatment-attributable portion exactly, so after an abandonment the ledger equals what it would have been had the record been disposed with no treatment at all."

  - name: compliance_strike_conservation
    conserved_quantity: "enforcement strike count on a vessel"
    formula: |
      For every Watercraft:
        compliance_strikes
          == count of InspectionRecord with watercraft_id == watercraft.id
             AND enforcement_status IN {REFERRED, CITED}
      AND watchlist_status == WATCHLISTED exactly when
             compliance_strikes >= WATCHLIST_STRIKE_THRESHOLD
      AND mandatory_decon_flag is true only while watchlist_status == WATCHLISTED
             and no DeconOrder has reached VERIFIED since the flag was set
    forward_action: "InspectionRecord enforcement NONE -> REFERRED - increments compliance_strikes."
    compensating_action: "InspectionRecord enforcement REFERRED -> DISMISSED - decrements compliance_strikes and re-derives watchlist_status and mandatory_decon_flag from the new count."
    note: "A referral that is later dismissed leaves the vessel exactly as it was: same strike count, same watchlist status, same mandatory_decon_flag."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header consisting only of whitespace counts as absent)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "For the entity_backed roles Inspector, DeconTechnician and ReleaseVerifier, X-User-ID resolves to an existing Inspector row."
    error_id: ERR_INSPECTOR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose roles include Inspector, DeconTechnician or ReleaseVerifier"

  - priority: 5
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints (GET collections)"

  - priority: 6
    category: business_constraint
    check: "Every required body field is present; every field's type, enum membership and numeric range matches the entity constraints (hours > 0, standing_water_ml >= 0, decon_bay_count >= 0, seal_stock_initial_count >= 0, hull_length_ft > 0, budget_cents > 0, impressions >= 0, max_seal_age_hours > 0, water_temp_f > 0, pressure_psi > 0, dwell_seconds > 0, closes_at > opens_at, end_at > start_at). Unknown fields and computed/system fields supplied by the client are ignored, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 7
    category: existence
    check: "Every resource named in the path exists, validated left to right."
    error_id: "ERR_WATER_BODY_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_WATERCRAFT_NOT_FOUND | ERR_INSPECTION_RECORD_NOT_FOUND | ERR_DECON_ORDER_NOT_FOUND | ERR_QUARANTINE_ORDER_NOT_FOUND | ERR_DETECTION_REPORT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_RECIPROCITY_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 8
    category: existence
    check: "Every foreign key supplied in the body exists (station_id, watercraft_id, prior_water_body_id, home_station_id, last_water_body_id, target_water_body_id, inspection_record_id, downstream_of_water_body_id, water_body_id); and on screening, when presented_seal_number is non-null, presented_seal_state_code resolves to a ReciprocityAgreement."
    error_id: "ERR_WATER_BODY_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_WATERCRAFT_NOT_FOUND | ERR_INSPECTION_RECORD_NOT_FOUND | ERR_RECIPROCITY_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all POST and PATCH endpoints carrying foreign keys"

  - priority: 9
    category: business_referential
    check: "station_type WATERBODY_ACCESS requires a non-null water_body_id and a null corridor_route_code; station_type HIGHWAY_CORRIDOR requires a non-null corridor_route_code and a null water_body_id."
    error_id: ERR_STATION_SITING_INVALID
    http_status: 422
    applies_to: "POST /inspection-stations"

  - priority: 10
    category: business_referential
    check: "Following downstream_of_water_body_id from the new or updated water body must not revisit the same water body; self-reference is also rejected."
    error_id: ERR_WATER_BODY_CYCLE
    http_status: 422
    applies_to: "POST /water-bodies, PATCH /water-bodies/{id}"

  - priority: 11
    category: business_constraint
    check: "Watercraft.registration_number is unique across the registry; ReciprocityAgreement.partner_state_code is unique across agreements."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /watercraft, POST /reciprocity-agreements"

  - priority: 12
    category: business_constraint
    check: "QuarantineOrder.seal_number is unique across all quarantine orders, including terminal ones."
    error_id: ERR_SEAL_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /quarantine-orders"

  - priority: 13
    category: auth
    check: "For Inspector-acted operations on an existing record, X-User-ID equals the owning foreign key: InspectionRecord.inspector_id for screening and disposition, DetectionReport.reported_by_inspector_id for submission, QuarantineOrder.issued_by_inspector_id for the release request."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /inspection-records/{id}/screening, POST /inspection-records/{id}/disposition, POST /detection-reports/{id}/submission, POST /quarantine-orders/{id}/release-request"

  - priority: 14
    category: state
    check: "The target resource is in a state from which the requested transition is declared in the state machine table (including the dimension-specific transition set for InspectionRecord)."
    error_id: "ERR_INVALID_STATION_STATE | ERR_STATION_NOT_OPEN | ERR_INVALID_INSPECTOR_STATE | ERR_RECORD_NOT_SCREENED | ERR_RECORD_ALREADY_DISPOSED | ERR_RECORD_NOT_AWAITING_DECON | ERR_INVALID_ENFORCEMENT_STATE | ERR_DECON_NOT_TREATED | ERR_DECON_ALREADY_TERMINAL | ERR_QUARANTINE_NOT_SEALED | ERR_QUARANTINE_RELEASE_NOT_REQUESTED | ERR_REPORT_INVALID_STATE | ERR_INVALID_CAMPAIGN_STATE"
    http_status: 409
    applies_to: "all state-transition POST endpoints"

  - priority: 15
    category: state
    check: "expected_watercraft_version equals Watercraft.version (screening); expected_inspection_record_version equals InspectionRecord.version (decon order creation)."
    error_id: "ERR_STALE_WATERCRAFT_VERSION | ERR_STALE_INSPECTION_RECORD_VERSION"
    http_status: 412
    applies_to: "POST /inspection-records/{id}/screening, POST /decon-orders"

  - priority: 16
    category: business_safety
    check: "Every Inspector referenced by the request (the acting inspector and any inspector_id in the body) is re-evaluated against the logical clock first: an ACTIVE inspector whose certification_expires_at is at or before the current logical time is moved to EXPIRED, and the request is then rejected unless the inspector's status is ACTIVE."
    error_id: ERR_INSPECTOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /inspection-records, POST /inspection-records/{id}/screening, POST /inspection-records/{id}/disposition, POST /decon-orders, POST /decon-orders/{id}/treatment, POST /decon-orders/{id}/dry-verification, POST /quarantine-orders, POST /quarantine-orders/{id}/release, POST /detection-reports/{id}/submission"

  - priority: 17
    category: business_safety
    check: "The treating inspector has certification_level DECON_CERTIFIED and decon_endorsement true; the verifying inspector has certification_level LEVEL_2 or DECON_CERTIFIED."
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /decon-orders/{id}/treatment, POST /decon-orders/{id}/dry-verification, POST /quarantine-orders/{id}/release"

  - priority: 18
    category: business_safety
    check: "The station carrying out a hot-water pressure treatment has hot_water_capable true and decon_bay_count >= 1."
    error_id: ERR_STATION_NOT_HOT_WATER_CAPABLE
    http_status: 409
    applies_to: "POST /decon-orders/{id}/treatment"

  - priority: 19
    category: business_safety
    check: "water_temp_f >= MIN_TREATMENT_TEMP_F and pressure_psi >= MIN_TREATMENT_PSI and dwell_seconds >= REQUIRED_DWELL_SECONDS[band_at_order]. Values exactly equal to a minimum are accepted."
    error_id: ERR_TREATMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /decon-orders/{id}/treatment"

  - priority: 20
    category: business_safety
    check: "For outcome VERIFIED and outcome RETREAT - both of which are judgements about the documented dry period - the current logical time is at or after DeconOrder.dry_until. A time exactly equal to dry_until satisfies the requirement. Outcome ABANDON is exempt: a vessel may be abandoned at any point after treatment."
    error_id: ERR_DRY_TIME_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /decon-orders/{id}/dry-verification"

  - priority: 21
    category: business_safety
    check: "The current logical time is at or after QuarantineOrder.hold_until. A time exactly equal to hold_until satisfies the requirement."
    error_id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /quarantine-orders/{id}/release-request"

  - priority: 22
    category: business_safety
    check: "When the quarantined vessel's inspection record has decon_mandatory true, a DeconOrder for that record must have reached VERIFIED before the release can be approved."
    error_id: ERR_DECON_REQUIRED_BEFORE_RELEASE
    http_status: 409
    applies_to: "POST /quarantine-orders/{id}/release"

  - priority: 23
    category: business_safety
    check: "disposition PASSED is refused when the record has decon_mandatory true, and also when the vessel carries mandatory_decon_flag true, unless a DeconOrder for the record has reached VERIFIED."
    error_id: ERR_DECON_REQUIRED_BEFORE_PASS
    http_status: 409
    applies_to: "POST /inspection-records/{id}/disposition"

  - priority: 24
    category: business_constraint
    check: "Segregation of duties on X-User-ID: the treating inspector of a DeconOrder may not be its dry-time verifier; the issuing inspector of a QuarantineOrder may not verify its release; the inspector who filed a DetectionReport may not acknowledge it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /decon-orders/{id}/dry-verification, POST /quarantine-orders/{id}/release, POST /detection-reports/{id}/state-acknowledgement"

  - priority: 25
    category: business_constraint
    check: "DeconOrder.attempt_count is below MAX_DECON_ATTEMPTS before a further treatment is booked."
    error_id: ERR_DECON_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /decon-orders/{id}/treatment"

  - priority: 26
    category: business_constraint
    check: "The new [opens_at, closes_at) window must not overlap any existing StationHours window at the same station. Overlap means new.opens_at < existing.closes_at AND existing.opens_at < new.closes_at; windows that merely touch at an endpoint are accepted."
    error_id: ERR_HOURS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /inspection-stations/{id}/hours"

  - priority: 27
    category: business_constraint
    check: "The vessel must not already be under an unexpired hold: reject when a QuarantineOrder exists for the same watercraft_id with status IN {SEALED, RELEASE_REQUESTED} and the current logical time is at or before its hold_until. The closed upper endpoint means an order whose hold_until equals the current logical time still blocks a new order."
    error_id: ERR_WATERCRAFT_ALREADY_QUARANTINED
    http_status: 409
    applies_to: "POST /quarantine-orders"

  - priority: 28
    category: business_constraint
    check: "Counting OTHER DeconOrders at the same station - the order being treated is always excluded from its own collision count - with treatment_started_at non-null and status IN {TREATED, RETREAT_REQUIRED} whose closed occupation interval [treatment_started_at, bay_released_at] intersects the new closed occupation interval [now, now + dwell_seconds + BAY_BUFFER_MINUTES], the number of intersections must be strictly less than station.decon_bay_count. Intervals that touch at a single instant do intersect."
    error_id: ERR_DECON_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /decon-orders/{id}/treatment"

  - priority: 29
    category: business_constraint
    check: "The inspection record has quarantine_warranted true."
    error_id: ERR_QUARANTINE_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /quarantine-orders"

  - priority: 30
    category: business_temporal
    check: "arrived_at falls inside at least one StationHours window of the station, evaluated as the half-open interval [opens_at, closes_at): an arrival exactly at opens_at is inside, an arrival exactly at closes_at is not. A station with no hours rows rejects every arrival."
    error_id: ERR_STATION_OUTSIDE_OPERATING_HOURS
    http_status: 409
    applies_to: "POST /inspection-records"

  - priority: 31
    category: business_temporal
    check: "When a seal is presented, presented_seal_number starts with the agreement's accepted_seal_prefix and the agreement status is ACTIVE with honors_our_seals true."
    error_id: ERR_SEAL_PREFIX_MISMATCH
    http_status: 422
    applies_to: "POST /inspection-records/{id}/screening"

  - priority: 32
    category: business_temporal
    check: "The presented seal's age in whole hours from presented_seal_issued_at to the record's arrived_at - the same basis reciprocity_seal_decision pins, never the current logical time - must not exceed the agreement's max_seal_age_hours. An age exactly equal to max_seal_age_hours is honored."
    error_id: ERR_SEAL_RECIPROCITY_EXPIRED
    http_status: 422
    applies_to: "POST /inspection-records/{id}/screening"

  - priority: 33
    category: business_temporal
    check: "The current logical time is at or after EducationCampaign.end_at."
    error_id: ERR_EVALUATION_WINDOW_NOT_ENDED
    http_status: 409
    applies_to: "POST /education-campaigns/{id}/evaluation"

  - priority: 34
    category: business_referential
    check: "prior_water_body_id, when supplied on screening, must equal the vessel's last_water_body_id when the vessel has one recorded."
    error_id: ERR_PRIOR_WATER_BODY_MISMATCH
    http_status: 422
    applies_to: "POST /inspection-records/{id}/screening"

  - priority: 35
    category: business_referential
    check: "At least one InspectionStation qualifies for the campaign, using exactly the candidate filter pinned in campaign_station_allocation_cents: water_body_id equal to the campaign's target_water_body_id and status IN {PLANNED, OPEN, SUSPENDED}. CLOSED stations never qualify."
    error_id: ERR_NO_STATIONS_FOR_CAMPAIGN
    http_status: 422
    applies_to: "POST /education-campaigns/{id}/status with target_status RUNNING"

  - priority: 36
    category: business_referential
    check: "The TARGET-scope denominator of campaign_effectiveness_score is non-empty: at least one InspectionRecord with prior_water_body_id equal to the campaign's target_water_body_id, inspection_status IN {PASSED, DECON_COMPLETED, REFUSED, DECON_FAILED_ABANDONED}, and arrived_at inside the half-open window [start_at, end_at). An empty denominator is rejected rather than scored as zero."
    error_id: ERR_NO_INSPECTIONS_IN_WINDOW
    http_status: 422
    applies_to: "POST /education-campaigns/{id}/evaluation"

  - priority: 37
    category: business_fiscal
    check: "The issuing station has seal_stock_count >= 1."
    error_id: ERR_STATION_SEAL_STOCK_EXHAUSTED
    http_status: 409
    applies_to: "POST /quarantine-orders"

  - priority: 38
    category: business_fiscal
    check: "budget_cents does not exceed CAMPAIGN_BUDGET_CAP_CENTS, and the campaign's budget must be at least 1 cent per qualifying station so every station receives a non-zero allocation."
    error_id: ERR_CAMPAIGN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /education-campaigns, POST /education-campaigns/{id}/status with target_status RUNNING"

# =============================================================================
# 1.5 API Endpoint Table (api_prefix is "/", so paths are collection-rooted)
# =============================================================================
endpoints:
  # --- WaterBody ---------------------------------------------------------
  - method: POST
    path: "/water-bodies"
    description: "Register a water body in the state inventory, optionally declaring the water body it drains into."
    roles: [ProgramAdmin]
    code: 201
    input: [name, state_code, water_body_class, "risk_tier?", "infestation_status?", "downstream_of_water_body_id?"]
    output: WaterBody
    side_effects: ["Rejects a downstream_of_water_body_id chain that would revisit this water body (ERR_WATER_BODY_CYCLE)", "detection_count and live_detection_count start at 0"]

  - method: GET
    path: "/water-bodies/{id}"
    description: "Fetch one water body with its detection counters and current infestation status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: WaterBody
    side_effects: []

  - method: GET
    path: "/water-bodies"
    description: "List water bodies, filterable by drainage parent, risk tier and infestation status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["downstream_of_water_body_id?", "risk_tier?", "infestation_status?", "state_code?", "limit?", "offset?"]
    output: WaterBody[]
    side_effects: []

  - method: PATCH
    path: "/water-bodies/{id}"
    description: "Correct a water body's drainage parent or its published risk tier after a survey. This is the only path that changes downstream_of_water_body_id once the row exists; infestation_status is deliberately NOT updatable here, because the detection-report acknowledgement is its single writer."
    roles: [ProgramAdmin]
    code: 200
    input: ["downstream_of_water_body_id?", "risk_tier?"]
    output: WaterBody
    side_effects: ["Re-runs the drainage cycle check from this water body; a chain that revisits it, including a self-reference, is rejected with ERR_WATER_BODY_CYCLE", "Leaves detection_count, live_detection_count and infestation_status untouched", "increments WaterBody.version by 1"]

  # --- InspectionStation -------------------------------------------------
  - method: POST
    path: "/inspection-stations"
    description: "Site an inspection station either at a water body access point or on a highway corridor."
    roles: [ProgramAdmin]
    code: 201
    input: [name, station_type, "water_body_id?", "corridor_route_code?", "mandatory_inspection?", "decon_bay_count?", "hot_water_capable?", "seal_stock_initial_count?"]
    output: InspectionStation
    side_effects: ["Enforces the siting coherence rule (ERR_STATION_SITING_INVALID)", "seal_stock_count is initialised to seal_stock_initial_count; seals_in_circulation_count, seals_retired_count, certified_inspector_count, collected_fees_cents, refunded_fees_cents and campaign_allocated_cents start at 0", "decon_service_available is derived as false at creation because no certified inspector is posted yet", "status starts at PLANNED"]

  - method: GET
    path: "/inspection-stations/{id}"
    description: "Fetch one station with seal inventory, staffing derivation and fee ledger."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: InspectionStation
    side_effects: []

  - method: GET
    path: "/inspection-stations"
    description: "List stations, filterable by the water body they guard and by operational status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["water_body_id?", "station_type?", "status?", "hot_water_capable?", "limit?", "offset?"]
    output: InspectionStation[]
    side_effects: []

  - method: POST
    path: "/inspection-stations/{id}/status"
    description: "Move a station along its lifecycle: open it for the season, suspend it, re-open it after suspension, or close it permanently."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status, "reason?"]
    output: InspectionStation
    side_effects: ["PLANNED -> OPEN requires at least one StationHours window", "OPEN -> SUSPENDED and SUSPENDED -> OPEN form the operating cycle; CLOSED is terminal and any further call is rejected with ERR_INVALID_STATION_STATE"]

  - method: POST
    path: "/inspection-stations/{id}/hours"
    description: "Declare one non-overlapping hours-of-operation window for the station."
    roles: [ProgramAdmin]
    code: 201
    input: [opens_at, closes_at, "staffing_level?"]
    output: StationHours
    side_effects: ["Overlap against existing windows uses the half-open interval [opens_at, closes_at); touching endpoints are allowed (ERR_HOURS_WINDOW_OVERLAP)"]

  - method: GET
    path: "/inspection-stations/{id}/hours"
    description: "List the hours-of-operation windows declared for a station."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: StationHours[]
    side_effects: []

  # --- Inspector ---------------------------------------------------------
  - method: POST
    path: "/inspectors"
    description: "Enroll an inspector at a home station as a PROBATIONARY trainee."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, home_station_id, "decon_endorsement?"]
    output: Inspector
    side_effects: ["training_hours_total starts at 0, certification_level starts at TRAINEE, certification_expires_at starts null, status starts at PROBATIONARY", "decon_endorsement is taken from the hiring packet and defaults to false"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Fetch one inspector with training total, derived certification level and status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: GET
    path: "/inspectors"
    description: "List inspectors, filterable by home station, certification level and status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["home_station_id?", "certification_level?", "status?", "decon_endorsement?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []

  - method: POST
    path: "/inspectors/{id}/status"
    description: "Suspend an inspector, reinstate a suspended inspector, or renew an expired certification."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status, "reason?"]
    output: Inspector
    side_effects: ["Reinstatement to ACTIVE and renewal from EXPIRED both re-run the station staffing cascade", "EXPIRED -> ACTIVE resets certification_expires_at to the logical clock plus CERT_VALID_HOURS", "The inspector state machine has no terminal state, so SUSPENDED -> ACTIVE and EXPIRED -> ACTIVE are both legal loops"]

  - method: POST
    path: "/inspectors/{id}/training-records"
    description: "Record a completed training module for an inspector; passing modules accumulate credited hours."
    roles: [TrainingOfficer]
    code: 201
    input: [module_code, hours, passed, "completed_at?"]
    output: TrainingRecord
    side_effects: ["Recomputes inspector_certification_level: credited hours and certification_level, and stamps certification_expires_at at the first promotion out of TRAINEE", "PROBATIONARY -> ACTIVE fires automatically once the inspector first reaches LEVEL_1 or above", "Cascades to the home station's certified_inspector_count and decon_service_available", "TrainingRecord is immutable: no version field and no update endpoint"]

  - method: GET
    path: "/inspectors/{id}/training-records"
    description: "List the training modules recorded for an inspector."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  # --- Watercraft --------------------------------------------------------
  - method: POST
    path: "/watercraft"
    description: "Register a vessel in the watercraft registry with its declared last water body and removal time."
    roles: [ProgramAdmin, Inspector]
    code: 201
    input: [registration_number, home_state_code, vessel_type, hull_length_ft, "last_water_body_id?", "last_removed_at?"]
    output: Watercraft
    side_effects: ["registration_number must be unique (ERR_DUPLICATE_IDENTIFIER)", "compliance_strikes starts at 0, watchlist_status starts CLEAR, mandatory_decon_flag starts false"]

  - method: GET
    path: "/watercraft/{id}"
    description: "Fetch one vessel with strike count, watchlist status, mandatory decon flag and current hold expiry."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: Watercraft
    side_effects: []

  - method: GET
    path: "/watercraft"
    description: "List vessels, filterable by declared last water body, watchlist status and vessel type."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["last_water_body_id?", "watchlist_status?", "vessel_type?", "registration_number?", "limit?", "offset?"]
    output: Watercraft[]
    side_effects: []

  # --- ReciprocityAgreement ----------------------------------------------
  - method: POST
    path: "/reciprocity-agreements"
    description: "Establish an interstate seal-reciprocity agreement with a partner state."
    roles: [ProgramAdmin]
    code: 201
    input: [partner_state_code, accepted_seal_prefix, "honors_our_seals?", "max_seal_age_hours?", "fee_waiver?"]
    output: ReciprocityAgreement
    side_effects: ["partner_state_code must be unique (ERR_DUPLICATE_IDENTIFIER)", "status starts ACTIVE"]

  - method: GET
    path: "/reciprocity-agreements/{id}"
    description: "Fetch one reciprocity agreement with its seal-age ceiling and prefix rule."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: ReciprocityAgreement
    side_effects: []

  - method: GET
    path: "/reciprocity-agreements"
    description: "List reciprocity agreements, filterable by partner state and status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["partner_state_code?", "status?", "limit?", "offset?"]
    output: ReciprocityAgreement[]
    side_effects: []

  - method: POST
    path: "/reciprocity-agreements/{id}/status"
    description: "Suspend or reinstate an interstate reciprocity agreement."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status, "reason?"]
    output: ReciprocityAgreement
    side_effects: ["A SUSPENDED agreement stops honoring presented seals from that state; already-issued inspection records keep the credit they were granted"]

  # --- InspectionRecord --------------------------------------------------
  - method: POST
    path: "/inspection-records"
    description: "Open an inspection at a station for an arriving vessel. The acting inspector is taken from X-User-ID."
    roles: [Inspector]
    code: 201
    input: [station_id, watercraft_id, arrived_at]
    output: InspectionRecord
    side_effects: ["Station must be OPEN (ERR_STATION_NOT_OPEN) and arrived_at must land inside a half-open StationHours window (ERR_STATION_OUTSIDE_OPERATING_HOURS)", "inspector_id is copied from X-User-ID; the acting inspector must be ACTIVE (ERR_INSPECTOR_NOT_ACTIVE)", "No scoring and no fee runs here: risk_score, advisory_risk_score and every fee field stay at their declared defaults until screening and disposition respectively", "inspection_status starts INITIATED, enforcement_status starts NONE"]

  - method: GET
    path: "/inspection-records/{id}"
    description: "Fetch one inspection record with both risk scores, both status dimensions and the full fee breakdown."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []

  - method: GET
    path: "/inspection-records"
    description: "List inspection records, filterable by station, inspector, vessel, prior water body and honored agreement."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["station_id?", "inspector_id?", "watercraft_id?", "prior_water_body_id?", "honored_agreement_id?", "inspection_status?", "enforcement_status?", "risk_band?", "limit?", "offset?"]
    output: InspectionRecord[]
    side_effects: []

  - method: POST
    path: "/inspection-records/{id}/screening"
    description: "Record the risk screening: prior water body, residual water findings, dry standing time and any presented out-of-state seal. May be re-run to supersede an earlier screening while the record is still SCREENED."
    roles: [Inspector]
    code: 200
    input: [expected_watercraft_version, residual_water_present, "standing_water_ml?", "prior_water_body_id?", "presented_seal_number?", "presented_seal_state_code?", "presented_seal_issued_at?"]
    output: InspectionRecord
    side_effects: ["Requires expected_watercraft_version to equal Watercraft.version, otherwise ERR_STALE_WATERCRAFT_VERSION (412)", "Increments Watercraft.version by 1 and writes the vessel's last_water_body_id from the screened prior water body", "prior_water_body_id defaults to the vessel's last_water_body_id when omitted; when the vessel has none recorded and none is supplied the call is rejected with ERR_INVALID_REQUEST", "Runs reciprocity_seal_decision, then watercraft_risk_score in the screening_basis variant into advisory_risk_score, then re-derives risk_score, risk_band, decon_mandatory and quarantine_warranted", "Sets screening_completed_at and moves inspection_status INITIATED -> SCREENED, or SCREENED -> SCREENED on a supersede"]

  - method: POST
    path: "/inspection-records/{id}/disposition"
    description: "Dispose a screened inspection: pass the vessel, require decontamination, or record the boater's refusal to be inspected."
    roles: [Inspector]
    code: 200
    input: [disposition, "notes?"]
    output: InspectionRecord
    side_effects: ["PASSED is refused while decon is mandatory (ERR_DECON_REQUIRED_BEFORE_PASS)", "REFUSED immediately drives enforcement_status NONE -> REFERRED with referral_reason INSPECTION_REFUSAL and the full strike cascade onto the vessel", "DECON_REQUIRED opens the decontamination pathway and leaves the fee open for the decon charge"]

  - method: POST
    path: "/inspection-records/{id}/enforcement"
    description: "Advance the independent enforcement dimension of a record: refer it, cite it with a penalty, or dismiss the referral."
    roles: [EnforcementOfficer]
    code: 200
    input: [action, "referral_reason?", "agency_code?", "notes?"]
    output: InspectionRecord
    side_effects: ["REFER increments Watercraft.compliance_strikes, flips watchlist_status at WATCHLIST_STRIKE_THRESHOLD and raises mandatory_decon_flag while watchlisted", "CITE computes enforcement_penalty_cents from the strike count at citation time", "DISMISS decrements compliance_strikes and re-derives watchlist_status and mandatory_decon_flag, restoring the vessel to its pre-referral posture", "The enforcement dimension moves independently of inspection_status: a PASSED record can still be referred and cited"]

  # --- DeconOrder --------------------------------------------------------
  - method: POST
    path: "/decon-orders"
    description: "Order decontamination for a record that requires it. A fresh order re-books the vessel for a new treatment cycle."
    roles: [Inspector]
    code: 201
    input: [inspection_record_id, expected_inspection_record_version]
    output: DeconOrder
    side_effects: ["Requires expected_inspection_record_version to equal InspectionRecord.version, otherwise ERR_STALE_INSPECTION_RECORD_VERSION (412)", "Increments InspectionRecord.version by 1", "Record must be in inspection_status DECON_REQUIRED (ERR_RECORD_NOT_AWAITING_DECON)", "station_id is copied from the record; band_at_order freezes the record's risk_band; base_dry_hours is read from BASE_DRY_HOURS[band_at_order]", "status starts ORDERED with attempt_count 0"]

  - method: GET
    path: "/decon-orders/{id}"
    description: "Fetch one decontamination order with treatment parameters, effectiveness and dry-time obligation."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: DeconOrder
    side_effects: []

  - method: GET
    path: "/decon-orders"
    description: "List decontamination orders, filterable by record, station, treating technician and verifier."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["inspection_record_id?", "station_id?", "treated_by_inspector_id?", "verified_by_inspector_id?", "status?", "limit?", "offset?"]
    output: DeconOrder[]
    side_effects: []

  - method: POST
    path: "/decon-orders/{id}/treatment"
    description: "Perform a hot-water pressure treatment. Usable both on a fresh ORDERED order and on an order sent back for re-treatment."
    roles: [DeconTechnician]
    code: 200
    input: [water_temp_f, pressure_psi, dwell_seconds]
    output: DeconOrder
    side_effects: ["Station must be hot_water_capable (ERR_STATION_NOT_HOT_WATER_CAPABLE) and treatment parameters must meet the band minimums (ERR_TREATMENT_BELOW_MINIMUM)", "Bay occupation is checked as a closed interval against station.decon_bay_count (ERR_DECON_BAY_UNAVAILABLE); bay_released_at is set to treatment_started_at plus dwell_seconds plus BAY_BUFFER_MINUTES", "Increments attempt_count, refused once MAX_DECON_ATTEMPTS is reached (ERR_DECON_ATTEMPTS_EXHAUSTED)", "Computes decon_treatment_effectiveness then decon_required_dry_hours, writing required_dry_hours and dry_until", "Books the decon charge: decon_fee_cents, then re-runs inspection_total_fee_cents including the surcharge tier, and credits the station's collected_fees_cents by the delta", "treated_by_inspector_id is taken from X-User-ID; status moves ORDERED -> TREATED or RETREAT_REQUIRED -> TREATED"]

  - method: POST
    path: "/decon-orders/{id}/dry-verification"
    description: "Judge a treated order: accept it once its documented dry time has elapsed, send it back for re-treatment, or abandon the vessel. outcome is one of VERIFIED, RETREAT or ABANDON."
    roles: [ReleaseVerifier]
    code: 200
    input: [outcome, "notes?"]
    output: DeconOrder
    side_effects: ["outcome VERIFIED requires the logical clock to have reached dry_until (ERR_DRY_TIME_NOT_ELAPSED) and clears the vessel's mandatory_decon_flag while stamping last_decon_verified_at, then moves the parent record DECON_REQUIRED -> DECON_COMPLETED", "outcome RETREAT also requires the dry period to have elapsed; it returns the order to RETREAT_REQUIRED and vacates the bay, leaving the parent record in DECON_REQUIRED", "outcome ABANDON is exempt from the dry-time gate; it refunds decon_fee_cents plus surcharge_cents into fee_refunded_cents, debits the station's collected_fees_cents by the same amount, and moves the parent record DECON_REQUIRED -> DECON_FAILED_ABANDONED", "The verifier in X-User-ID may not be the treating technician (ERR_SEGREGATION_OF_DUTIES)", "The parent-record cascade fires from whichever order the call targets and is skipped outright when the parent record has already left DECON_REQUIRED"]

  # --- QuarantineOrder ---------------------------------------------------
  - method: POST
    path: "/quarantine-orders"
    description: "Seal a high-risk vessel under quarantine, consuming one physical seal from the station's stock."
    roles: [Inspector]
    code: 201
    input: [inspection_record_id, seal_number, "seal_state_code?"]
    output: QuarantineOrder
    side_effects: ["Record must have quarantine_warranted true (ERR_QUARANTINE_NOT_WARRANTED) and the vessel must not already sit under an unexpired closed-interval hold (ERR_WATERCRAFT_ALREADY_QUARANTINED)", "seal_number must be globally unique (ERR_SEAL_NUMBER_DUPLICATE) and the station must have seal stock (ERR_STATION_SEAL_STOCK_EXHAUSTED)", "Debits station.seal_stock_count by 1 and credits seals_in_circulation_count by 1, conserving seal_inventory_conservation", "band_at_issue freezes the record's risk_band; quarantine_hold_hours computes hold_hours_required and hold_until and writes Watercraft.quarantine_hold_until", "status starts SEALED with rejected_release_count 0"]

  - method: GET
    path: "/quarantine-orders/{id}"
    description: "Fetch one quarantine order with its seal, hold window and rejected-release history."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: QuarantineOrder
    side_effects: []

  - method: GET
    path: "/quarantine-orders"
    description: "List quarantine orders, filterable by record, vessel, station, issuing inspector and release verifier."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["inspection_record_id?", "watercraft_id?", "station_id?", "issued_by_inspector_id?", "release_verified_by_inspector_id?", "status?", "seal_number?", "limit?", "offset?"]
    output: QuarantineOrder[]
    side_effects: []

  - method: POST
    path: "/quarantine-orders/{id}/release-request"
    description: "Request release of a sealed vessel once the hold period has elapsed."
    roles: [Inspector]
    code: 200
    input: ["notes?"]
    output: QuarantineOrder
    side_effects: ["The logical clock must have reached hold_until (ERR_HOLD_PERIOD_NOT_ELAPSED)", "Only the issuing inspector may raise the request (ERR_NOT_RESOURCE_OWNER)", "status moves SEALED -> RELEASE_REQUESTED"]

  - method: POST
    path: "/quarantine-orders/{id}/release"
    description: "Verify a requested release: approve it and retire the seal, or reject it and send the vessel back under an extended hold."
    roles: [ReleaseVerifier]
    code: 200
    input: [outcome, "notes?"]
    output: QuarantineOrder
    side_effects: ["The verifier in X-User-ID may not be the issuing inspector (ERR_SEGREGATION_OF_DUTIES) and must hold LEVEL_2 or DECON_CERTIFIED (ERR_INSPECTOR_NOT_CERTIFIED)", "outcome APPROVED requires a VERIFIED DeconOrder whenever the record's decon is mandatory (ERR_DECON_REQUIRED_BEFORE_RELEASE), then debits seals_in_circulation_count and credits seals_retired_count, clears Watercraft.quarantine_hold_until and moves status RELEASE_REQUESTED -> RELEASED", "outcome REJECTED increments rejected_release_count, re-runs quarantine_hold_hours to extend hold_until by REJECTION_EXTENSION_HOURS per rejection, returns status to SEALED, and at REJECTED_RELEASE_REFERRAL_THRESHOLD drives the parent record's enforcement NONE -> REFERRED with referral_reason QUARANTINE_RELEASE_FAILURE and the full strike cascade"]

  - method: POST
    path: "/quarantine-orders/{id}/breach-report"
    description: "Report a tampered or broken seal, voiding the quarantine and referring the vessel for enforcement."
    roles: [ReleaseVerifier, EnforcementOfficer]
    code: 200
    input: ["notes?"]
    output: QuarantineOrder
    side_effects: ["Debits seals_in_circulation_count and credits seals_retired_count, keeping the seal inventory conserved", "Clears Watercraft.quarantine_hold_until because a voided order is no longer in {SEALED, RELEASE_REQUESTED} and therefore holds nothing", "Drives the parent record's enforcement NONE -> REFERRED with referral_reason SEAL_TAMPER", "status moves SEALED -> VOIDED_BREACH or RELEASE_REQUESTED -> VOIDED_BREACH"]

  # --- DetectionReport ---------------------------------------------------
  - method: POST
    path: "/detection-reports"
    description: "Draft a detection report for organisms or plant fragments found during an inspection."
    roles: [Inspector]
    code: 201
    input: [inspection_record_id, species_code, detection_class, "observed_at?"]
    output: DetectionReport
    side_effects: ["water_body_id is copied from the parent record's prior_water_body_id; reported_by_inspector_id is taken from X-User-ID", "status starts DRAFT with submission_count 0; nothing is reported to the state database yet"]

  - method: GET
    path: "/detection-reports/{id}"
    description: "Fetch one detection report with its submission count and state-database acknowledgement."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: DetectionReport
    side_effects: []

  - method: GET
    path: "/detection-reports"
    description: "List detection reports, filterable by record, water body, reporting inspector and status."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["inspection_record_id?", "water_body_id?", "reported_by_inspector_id?", "status?", "detection_class?", "limit?", "offset?"]
    output: DetectionReport[]
    side_effects: []

  - method: POST
    path: "/detection-reports/{id}/submission"
    description: "Submit a drafted or previously rejected report to the state database queue."
    roles: [Inspector]
    code: 200
    input: ["notes?"]
    output: DetectionReport
    side_effects: ["Only the reporting inspector may submit (ERR_NOT_RESOURCE_OWNER)", "Increments submission_count and clears rejection_reason", "status moves DRAFT -> SUBMITTED or REJECTED -> SUBMITTED, so a rejected report can be corrected and resubmitted any number of times"]

  - method: POST
    path: "/detection-reports/{id}/state-acknowledgement"
    description: "Record the state database's verdict on a submitted report: accept it into the official record or reject it. verdict is one of ACCEPTED or REJECTED."
    roles: [StateDataSteward]
    code: 200
    input: [verdict, "state_db_ack_id?", "rejection_reason?"]
    output: DetectionReport
    side_effects: ["The acknowledging steward may not be the reporting inspector (ERR_SEGREGATION_OF_DUTIES)", "ACCEPTED increments the water body's detection_count and, for detection_class LIVE_ORGANISM, live_detection_count, then escalates infestation_status, which flips mandatory_inspection on every OPEN station guarding that water body, which in turn raises those stations' StationHours staffing_level to DOUBLE", "REJECTED stores rejection_reason and leaves every water body counter untouched"]

  # --- EducationCampaign -------------------------------------------------
  - method: POST
    path: "/education-campaigns"
    description: "Plan a public education campaign aimed at a water body over a fixed window with a fixed budget."
    roles: [ProgramAdmin]
    code: 201
    input: [name, target_water_body_id, start_at, end_at, budget_cents, "evaluation_method?", "impressions?"]
    output: EducationCampaign
    side_effects: ["budget_cents must not exceed CAMPAIGN_BUDGET_CAP_CENTS (ERR_CAMPAIGN_BUDGET_EXCEEDED)", "status starts PLANNED with an empty station_allocations array and no money allocated"]

  - method: GET
    path: "/education-campaigns/{id}"
    description: "Fetch one campaign with its per-station allocations, measured compliance rates and effectiveness scores."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: []
    output: EducationCampaign
    side_effects: []

  - method: GET
    path: "/education-campaigns"
    description: "List campaigns, filterable by target water body, status and evaluation method."
    roles: [ProgramAdmin, Inspector, DeconTechnician, ReleaseVerifier, EnforcementOfficer, StateDataSteward, TrainingOfficer]
    code: 200
    input: ["target_water_body_id?", "status?", "evaluation_method?", "limit?", "offset?"]
    output: EducationCampaign[]
    side_effects: []

  - method: POST
    path: "/education-campaigns/{id}/status"
    description: "Launch a planned campaign, allocating its budget across candidate stations, or cancel it and return the money. target_status is one of RUNNING or CANCELLED."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status, "reason?"]
    output: EducationCampaign
    side_effects: ["PLANNED -> RUNNING requires at least one candidate station under the pinned filter water_body_id == target_water_body_id AND status IN {PLANNED, OPEN, SUSPENDED} (ERR_NO_STATIONS_FOR_CAMPAIGN) and a budget large enough for a non-zero allocation each (ERR_CAMPAIGN_BUDGET_EXCEEDED); it runs campaign_station_allocation_cents, writes station_allocations and credits every candidate station's campaign_allocated_cents", "RUNNING -> CANCELLED debits each station by exactly the amount recorded in station_allocations and empties the array, restoring campaign_budget_conservation", "PLANNED -> CANCELLED touches no station because nothing was ever allocated"]

  - method: POST
    path: "/education-campaigns/{id}/evaluation"
    description: "Evaluate a finished campaign's effectiveness under both the pre/post and control-corridor methods. evaluation_method selects which one lands in effectiveness_score; when omitted the value stored at campaign creation is used."
    roles: [ProgramAdmin]
    code: 200
    input: ["evaluation_method?", "impressions?"]
    output: EducationCampaign
    side_effects: ["The logical clock must have reached end_at (ERR_EVALUATION_WINDOW_NOT_ENDED) and the TARGET-scope denominator must be non-empty (ERR_NO_INSPECTIONS_IN_WINDOW)", "Measures window_compliance_rate, then computes campaign_effectiveness_score under the campaign's declared evaluation_method into effectiveness_score and under the other method into alternate_effectiveness_score", "status moves RUNNING -> EVALUATED and leaves every station allocation exactly as it was"]

  # --- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by every dry-time, hold-period, seal-age, certification-expiry and campaign-window rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Advancing the clock does not itself mutate any entity; every expiry and elapsed-time rule is evaluated lazily on the next request that touches the affected entity"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth --------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty or whitespace-only, or X-User-Role is not one of the seven declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "X-User-ID does not match the owning inspector foreign key of the targeted record, report or quarantine order."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same X-User-ID attempts both halves of a segregated pair: treating and dry-verifying a decon order, issuing and release-verifying a quarantine, or filing and acknowledging a detection report."
  - id: ERR_INSPECTOR_NOT_CERTIFIED
    http: 403
    condition: "The treating inspector is not DECON_CERTIFIED with decon_endorsement true, or the verifying inspector holds neither LEVEL_2 nor DECON_CERTIFIED."

  # --- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, or a field violates its declared type, enum membership, numeric range or ordering constraint."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative or non-integer."

  # --- existence ---------------------------------------------------------
  - id: ERR_WATER_BODY_NOT_FOUND
    http: 404
    condition: "A water body id in the path or body does not exist."
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "An inspection station id in the path or body does not exist."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "An inspector id in the path or body does not exist, or X-User-ID for an entity-backed role resolves to no inspector."
  - id: ERR_WATERCRAFT_NOT_FOUND
    http: 404
    condition: "A watercraft id in the path or body does not exist."
  - id: ERR_INSPECTION_RECORD_NOT_FOUND
    http: 404
    condition: "An inspection record id in the path or body does not exist."
  - id: ERR_RECIPROCITY_AGREEMENT_NOT_FOUND
    http: 404
    condition: "A reciprocity agreement id in the path does not exist, or the presented seal's state code matches no agreement."
  - id: ERR_DECON_ORDER_NOT_FOUND
    http: 404
    condition: "A decon order id in the path does not exist."
  - id: ERR_QUARANTINE_ORDER_NOT_FOUND
    http: 404
    condition: "A quarantine order id in the path does not exist."
  - id: ERR_DETECTION_REPORT_NOT_FOUND
    http: 404
    condition: "A detection report id in the path does not exist."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "An education campaign id in the path does not exist."

  # --- uniqueness --------------------------------------------------------
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "A watercraft registration_number or a reciprocity partner_state_code is already registered."
  - id: ERR_SEAL_NUMBER_DUPLICATE
    http: 409
    condition: "The requested seal_number is already recorded on some quarantine order, including terminal ones."

  # --- state -------------------------------------------------------------
  - id: ERR_INVALID_STATION_STATE
    http: 409
    condition: "The requested station transition is not declared from the station's current status, including any transition out of the terminal CLOSED state."
  - id: ERR_STATION_NOT_OPEN
    http: 409
    condition: "An inspection is opened while the station's status is not OPEN."
  - id: ERR_INVALID_INSPECTOR_STATE
    http: 409
    condition: "The requested inspector transition is not declared from the inspector's current status."
  - id: ERR_RECORD_NOT_SCREENED
    http: 409
    condition: "A disposition is requested on a record whose inspection_status is still INITIATED."
  - id: ERR_RECORD_ALREADY_DISPOSED
    http: 409
    condition: "Screening or disposition is requested on a record whose inspection_status has already left SCREENED."
  - id: ERR_RECORD_NOT_AWAITING_DECON
    http: 409
    condition: "A decon order or quarantine order is created for a record whose inspection_status is not DECON_REQUIRED."
  - id: ERR_INVALID_ENFORCEMENT_STATE
    http: 409
    condition: "The requested enforcement action is not declared from the record's current enforcement_status - for example citing a record still at NONE, or dismissing one already CITED."
  - id: ERR_DECON_NOT_TREATED
    http: 409
    condition: "Dry verification is requested on a decon order whose status is ORDERED or RETREAT_REQUIRED. The two terminal statuses VERIFIED and ABANDONED return ERR_DECON_ALREADY_TERMINAL instead, so the two 409s never both apply to the same call."
  - id: ERR_DECON_ALREADY_TERMINAL
    http: 409
    condition: "Treatment or verification is requested on a decon order already in VERIFIED or ABANDONED."
  - id: ERR_QUARANTINE_NOT_SEALED
    http: 409
    condition: "A release request or breach report targets a quarantine order that is not in a state permitting it."
  - id: ERR_QUARANTINE_RELEASE_NOT_REQUESTED
    http: 409
    condition: "Release verification is requested on a quarantine order whose status is not RELEASE_REQUESTED."
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "Submission targets a report that is not DRAFT or REJECTED, or acknowledgement targets a report that is not SUBMITTED."
  - id: ERR_INVALID_CAMPAIGN_STATE
    http: 409
    condition: "The requested campaign transition is not declared from its current status, including evaluating a campaign that is not RUNNING."

  # --- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_WATERCRAFT_VERSION
    http: 412
    condition: "expected_watercraft_version does not equal the vessel's current version at screening time."
  - id: ERR_STALE_INSPECTION_RECORD_VERSION
    http: 412
    condition: "expected_inspection_record_version does not equal the record's current version at decon-order creation time."

  # --- business safety ---------------------------------------------------
  - id: ERR_INSPECTOR_NOT_ACTIVE
    http: 409
    condition: "An inspector referenced by the request is PROBATIONARY, SUSPENDED, or lazily moved to EXPIRED because the logical clock has reached certification_expires_at."
  - id: ERR_STATION_NOT_HOT_WATER_CAPABLE
    http: 409
    condition: "A hot-water pressure treatment is attempted at a station with hot_water_capable false or no decon bay."
  - id: ERR_TREATMENT_BELOW_MINIMUM
    http: 422
    condition: "water_temp_f, pressure_psi or dwell_seconds falls below the minimum required for the order's band_at_order."
  - id: ERR_DRY_TIME_NOT_ELAPSED
    http: 409
    condition: "Dry verification is accepted before the logical clock reaches dry_until."
  - id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http: 409
    condition: "A release is requested before the logical clock reaches hold_until."
  - id: ERR_DECON_REQUIRED_BEFORE_RELEASE
    http: 409
    condition: "A quarantine release is approved while the parent record's decon is mandatory and no decon order has reached VERIFIED."
  - id: ERR_DECON_REQUIRED_BEFORE_PASS
    http: 409
    condition: "A record is dispositioned PASSED while decon_mandatory or the vessel's mandatory_decon_flag is set and no decon order has reached VERIFIED."

  # --- business constraints ---------------------------------------------
  - id: ERR_DECON_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "A further treatment is booked on a RETREAT_REQUIRED order whose attempt_count has already reached MAX_DECON_ATTEMPTS."
  - id: ERR_HOURS_WINDOW_OVERLAP
    http: 409
    condition: "A new hours window strictly overlaps an existing window at the same station under half-open interval semantics."
  - id: ERR_WATERCRAFT_ALREADY_QUARANTINED
    http: 409
    condition: "A quarantine order is issued for a vessel already under an unexpired hold, where the hold interval is closed at both ends."
  - id: ERR_DECON_BAY_UNAVAILABLE
    http: 409
    condition: "The number of intersecting closed bay occupations held by other decon orders at the station has reached decon_bay_count."
  - id: ERR_QUARANTINE_NOT_WARRANTED
    http: 409
    condition: "A quarantine order is issued for a record whose quarantine_warranted is false."
  - id: ERR_STATION_SEAL_STOCK_EXHAUSTED
    http: 409
    condition: "A quarantine order is issued at a station whose seal_stock_count is zero."
  - id: ERR_STATION_OUTSIDE_OPERATING_HOURS
    http: 409
    condition: "arrived_at falls in no half-open hours window of the station, including the case where the station has declared no windows at all."
  - id: ERR_EVALUATION_WINDOW_NOT_ENDED
    http: 409
    condition: "A campaign is evaluated before the logical clock reaches its end_at."

  # --- referential and fiscal -------------------------------------------
  - id: ERR_STATION_SITING_INVALID
    http: 422
    condition: "A WATERBODY_ACCESS station omits water_body_id or supplies corridor_route_code, or a HIGHWAY_CORRIDOR station omits corridor_route_code or supplies water_body_id."
  - id: ERR_WATER_BODY_CYCLE
    http: 422
    condition: "The declared drainage parent would create a cycle in the water body graph, including direct self-reference."
  - id: ERR_SEAL_PREFIX_MISMATCH
    http: 422
    condition: "The presented seal number does not start with the partner agreement's accepted_seal_prefix, or the agreement is SUSPENDED or does not honor our seals."
  - id: ERR_SEAL_RECIPROCITY_EXPIRED
    http: 422
    condition: "The presented seal's age in whole hours exceeds the agreement's max_seal_age_hours."
  - id: ERR_PRIOR_WATER_BODY_MISMATCH
    http: 422
    condition: "The screened prior_water_body_id contradicts the vessel's recorded last_water_body_id."
  - id: ERR_NO_STATIONS_FOR_CAMPAIGN
    http: 422
    condition: "No station with water_body_id equal to the campaign's target_water_body_id and status IN {PLANNED, OPEN, SUSPENDED} exists."
  - id: ERR_NO_INSPECTIONS_IN_WINDOW
    http: 422
    condition: "No terminally dispositioned inspection of the target water body falls inside the campaign's half-open window, leaving the TARGET compliance-rate denominator empty."
  - id: ERR_CAMPAIGN_BUDGET_EXCEEDED
    http: 422
    condition: "budget_cents exceeds CAMPAIGN_BUDGET_CAP_CENTS, or is too small to give every qualifying station at least one cent."

# =============================================================================
# 1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "State program office: builds the inventory of water bodies, sites and operates stations, enrolls inspectors, negotiates interstate reciprocity, runs education campaigns, and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /water-bodies"
      - "PATCH /water-bodies/{id}"
      - "POST /inspection-stations"
      - "POST /inspection-stations/{id}/status"
      - "POST /inspection-stations/{id}/hours"
      - "POST /inspectors"
      - "POST /inspectors/{id}/status"
      - "POST /reciprocity-agreements"
      - "POST /reciprocity-agreements/{id}/status"
      - "POST /education-campaigns"
      - "POST /education-campaigns/{id}/status"
      - "POST /education-campaigns/{id}/evaluation"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /watercraft"
      - "all GET reads across every collection"

  - name: Inspector
    description: "Field inspector at a station: opens inspections, performs risk screening including reciprocity seal checks, dispositions inspections, orders decontamination, seals vessels under quarantine, requests their release, and files detection reports."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection-records"
      - "POST /inspection-records/{id}/screening"
      - "POST /inspection-records/{id}/disposition"
      - "POST /decon-orders"
      - "POST /quarantine-orders"
      - "POST /quarantine-orders/{id}/release-request"
      - "POST /detection-reports"
      - "POST /detection-reports/{id}/submission"
    shared_operations:
      - "POST /watercraft"
      - "all GET reads across every collection"

  - name: DeconTechnician
    description: "Certified decontamination technician: performs the hot water pressure treatment itself. Backed by an Inspector row so certification and endorsement can be checked, but structurally barred from verifying its own work."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /decon-orders/{id}/treatment"
    shared_operations:
      - "all GET reads across every collection"

  - name: ReleaseVerifier
    description: "Independent verifier: signs off documented dry time on treated vessels and verifies quarantine releases. Backed by an Inspector row; may never verify work performed or quarantines issued under its own X-User-ID."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /decon-orders/{id}/dry-verification"
      - "POST /quarantine-orders/{id}/release"
    shared_operations:
      - "POST /quarantine-orders/{id}/breach-report"
      - "all GET reads across every collection"

  - name: EnforcementOfficer
    description: "Enforcement liaison: receives refusal and quarantine-failure referrals, issues citations with penalties, and dismisses unfounded referrals."
    identity: opaque
    exclusive_operations:
      - "POST /inspection-records/{id}/enforcement"
    shared_operations:
      - "POST /quarantine-orders/{id}/breach-report"
      - "all GET reads across every collection"

  - name: StateDataSteward
    description: "State database custodian: accepts or rejects submitted detection reports, which is the only path that mutates water body infestation status."
    identity: opaque
    exclusive_operations:
      - "POST /detection-reports/{id}/state-acknowledgement"
    shared_operations:
      - "all GET reads across every collection"

  - name: TrainingOfficer
    description: "Training coordinator: records completed inspector training modules, which is the only path that raises an inspector's certification level."
    identity: opaque
    exclusive_operations:
      - "POST /inspectors/{id}/training-records"
    shared_operations:
      - "all GET reads across every collection"
