        grounds:
          - state_machines.SurgeryCase.clinical_status=CONSENTED_to_clinical_status=OPERATED
          - entities.ConsentForm.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          SurgeryCase clinical_status CONSENTED->OPERATED depends on a sibling ConsentForm being SIGNED (not REVOKED): the operate
          precondition reads the ConsentForm entity. Entity pair SurgeryCase<-ConsentForm, distinct from the RefundClaim<-EnhancementRequest pair below.
        test_recipe:
          setup:
            - "A case advanced to CONSENTED but whose ConsentForm was then REVOKED (via cancelling and re-... ) — simplest reachable: a SCHEDULED case with no consent yet, so operate finds no SIGNED consent and clinical_status is not CONSENTED."
