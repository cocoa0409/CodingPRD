          assert:
            - "before the trigger: TransactionMonitoringProfile.${j_anchor}.calibration_state == CALIBRATED with corridor_thresholds [{jurisdiction_code: DE, usd_threshold: 5720000.00, count_threshold: 215}], aggregate_usd_threshold 6292000.00 and hold_threshold_usd 629200.00"
            - "trigger call 2 HTTP status == 409 and data.error_id == ERR_MONITORING_INTERVAL_OVERLAP   # effective_from == anchor.effective_to: touching the closed right endpoint IS an overlap"
            - "trigger call 3 HTTP status == 409 and data.error_id == ERR_MONITORING_INTERVAL_OVERLAP   # effective_to == anchor.effective_from: the closed LEFT endpoint collides too"
            - "trigger call 4 HTTP status == 201 and TransactionMonitoringProfile.${j_right}.calibration_state == PROVISIONAL and corridor_thresholds == []   # one second past the anchor's end is clear, and a create never calibrates"
