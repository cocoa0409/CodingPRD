  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_lot_test_state_beats_safety
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - calculations.lot_test_result
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the posted value
          9.99 ppm WOULD be an adulterant FAIL (safety), but the lot is already
          REJECTED — the state guard ERR_LOT_TERMINAL fires and the safety
          evaluation never happens (no SafetyTest row is created).
        test_recipe:
          setup:
            - "supplier S; lot X (GARLIC_POWDER, 100 kg, flavor 70.0, moisture 7.0, cost 120, NONE) moved RECEIVED -> IN_TEST -> REJECTED (quantity_wasted_kg == 100)"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Gilroy Garlic", origin_country: "US" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: GARLIC_POWDER, origin_region: "Gilroy", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 70.0, moisture_pct: 7.0, cost_per_kg_cents: 120, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lot: $.data.id } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 80000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: REJECT, reason: "off-spec color" }, as: QualityManager, as_user_id: "qm-1", captures: { st: $.data.status, wasted: $.data.quantity_wasted_kg } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 9.99, lab_code: "LAB-B" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { err: $.data.error_id } }
            - { call: "GET /spice/lots/${lot}/tests", payload: {}, as: QualityManager }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st2: $.data.status, wasted2: $.data.quantity_wasted_kg } }
          assert:
            - "${st} == REJECTED and ${wasted} == 100 (reject moved remaining mass to waste)"
            - "trigger rejected with ${err} == ERR_LOT_TERMINAL (state priority), NOT an adulterant/safety outcome, HTTP 409"
            - "GET tests returns data array of length 1 — the safety evaluation never ran, no new SafetyTest row"
            - "${st2} == REJECTED and ${wasted2} == 100 (no partial side effects)"

