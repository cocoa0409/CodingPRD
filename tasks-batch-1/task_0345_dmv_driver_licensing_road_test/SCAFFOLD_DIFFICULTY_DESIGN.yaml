# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: road_test_provisional_vs_final_diverge
        grounds:
          - calculations.road_test_score
          - state_machines.RoadTestAppointment.BOOKED_to_PROCTORED
          - state_machines.RoadTestAppointment.PROCTORED_to_SCORED
          - entities.RoadTestAppointment.fields.provisional_score
          - entities.RoadTestAppointment.fields.final_score
        distinguishing_aspect: |
          On a RoadTestAppointment, the provisional weighted score (auto_score inputs) is 82.5
          while the examiner-adjusted final weighted score is 79.17 for the SAME maneuver set —
          provisional is advisory, final alone sets outcome=FAIL. Dual-variant lives on the
          RoadTestAppointment entity domain.
        test_recipe:
          setup:
            - "A DriverRecord with knowledge_test_passed==true; an Examiner certified for class D; a BOOKED appointment whose slot has started."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Ann Driver", date_of_birth: "1986-03-02", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex One", certified_classes: ["D"], opaque_user_id: "exu-1" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "PARALLEL", weight: 3, auto_score: 90 }, { maneuver: "MERGE", weight: 2, auto_score: 70 }, { maneuver: "STOP", weight: 1, auto_score: 85 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
              captures: { prov: $.data.provisional_score }
          trigger:
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "PARALLEL", weight: 3, score: 90 }, { maneuver: "MERGE", weight: 2, score: 60 }, { maneuver: "STOP", weight: 1, score: 85 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
              captures: { fin: $.data.final_score, outcome: $.data.outcome }
          assert:
            - "RoadTestAppointment.${appt_id}.provisional_score == 82.5"
            - "RoadTestAppointment.${appt_id}.final_score == 79.17"
            - "RoadTestAppointment.${appt_id}.outcome == FAIL"
            - "provisional_score != final_score"

      - name: reinstatement_fee_per_component_vs_sum_then_round
        grounds:
          - calculations.reinstatement_fee
          - state_machines.Suspension.SERVED_to_LIFTED_BY_REINSTATEMENT
          - entities.Suspension.fields.reinstatement_fee
          - entities.Suspension.fields.point_balance_at_reinstatement
        distinguishing_aspect: |
          On a Suspension at point_balance_at_reinstatement==12, the PINNED per-component rounding
          yields reinstatement_fee==188.13, whereas the naive sum-then-round yields 188.12 — a
          one-cent divergence proving the order is pinned. This calc lives on the Suspension/fee
          domain (distinct from the road_test_score instance on RoadTestAppointment).
        test_recipe:
          setup:
            - "A DriverRecord ACTIVE with a license; one ACTIVE violation worth 12 points pushes it to SUSPENDED at clock=0 (point_balance_at_start=12, duration=30); clock advanced to 30 so the suspension is SERVED; point_balance still 12; a REINSTATEMENT fee of 18813 cents captured."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Bob Rein", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Two", certified_classes: ["D"], opaque_user_id: "exu-2" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { v_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { by_periods: 30 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "GET /driver-records/${dr_id}/suspensions"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { susp_id: "$.data[0].id" }
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "REINSTATEMENT", amount_cents: 18813 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /suspensions/${susp_id}/reinstate"
              payload: { expected_driver_record_version: "${dr_v}" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { fee: $.data.reinstatement_fee }
          assert:
            - "Suspension.${susp_id}.point_balance_at_reinstatement == 12"
            - "Suspension.${susp_id}.reinstatement_fee == 188.13"
            - "Suspension.${susp_id}.status == LIFTED_BY_REINSTATEMENT"
            - "DriverRecord.${dr_id}.licensing_status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_fee_nested_minmax_branches
        grounds:
          - calculations.renewal_fee
          - state_machines.DriverRecord.ELIGIBLE_to_ACTIVE
          - entities.License.fields.fee_cents
        distinguishing_aspect: |
          renewal_fee is mode (a): >=3 inputs (license_class, age, is_real_id, days_late) with
          nested max(base - senior_discount, 0), conditional senior/real-id branches, and a
          min-capped late penalty. For class D, age 70 (senior), is_real_id=true, days_late=0 the
          fee is max(4000-2000,0)+3000+0 == 5000 cents.
        test_recipe:
          setup:
            - "A senior (DOB 1956 -> age 70) DriverRecord, REAL ID APPROVED, ELIGIBLE after passing knowledge + road test; a RENEWAL fee of 5000 cents captured."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Cara Senior", date_of_birth: "1956-05-05", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /driver-records/${dr_id}/real-id-submit"
              payload: { documents: [ { doc_type: "PASSPORT", category: "IDENTITY" }, { doc_type: "LEASE", category: "RESIDENCY" }, { doc_type: "SSN_CARD", category: "SSN" } ] }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /driver-records/${dr_id}/real-id-adjudicate"
              payload: { decision: "APPROVE" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Three", certified_classes: ["D"], opaque_user_id: "exu-3" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 5000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D", is_real_id: true }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { lic_id: $.data.id, fee: $.data.fee_cents }
          assert:
            - "License.${lic_id}.fee_cents == 5000"
            - "License.${lic_id}.is_real_id == true"
            - "DriverRecord.${dr_id}.licensing_status == ACTIVE"

      - name: reinstatement_fee_rounding_order_pinned
        grounds:
          - calculations.reinstatement_fee
          - state_machines.Suspension.SERVED_to_LIFTED_BY_REINSTATEMENT
          - entities.Suspension.fields.reinstatement_fee
        distinguishing_aspect: |
          reinstatement_fee is mode (b): per-component rounding where order matters. At
          point_balance_at_reinstatement==12 the pinned per-component order gives 188.13 while
          sum-then-round gives 188.12. This is a DIFFERENT mode (nested rounding) than the
          renewal_fee instance (mode a, nested min/max).
        test_recipe:
          setup:
            - "Same shape as reinstatement_fee_per_component_vs_sum_then_round: a SERVED suspension with point_balance_at_reinstatement==12 and an 18813-cent REINSTATEMENT fee captured."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Dan Round", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Four", certified_classes: ["D"], opaque_user_id: "exu-4" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/advance"
              payload: { by_periods: 30 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "GET /driver-records/${dr_id}/suspensions"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { susp_id: "$.data[0].id" }
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "REINSTATEMENT", amount_cents: 18813 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /suspensions/${susp_id}/reinstate"
              payload: { expected_driver_record_version: "${dr_v}" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { fee: $.data.reinstatement_fee }
          assert:
            - "Suspension.${susp_id}.reinstatement_fee == 188.13"
            - "Suspension.${susp_id}.reinstatement_fee != 188.12"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: driver_record_suspension_reinstatement_cycle
        grounds:
          - state_machines.DriverRecord.ACTIVE_to_SUSPENDED
          - state_machines.DriverRecord.SUSPENDED_to_ACTIVE
          - entities.DriverRecord.fields.licensing_status
        distinguishing_aspect: |
          DriverRecord.licensing_status forms a CYCLE ACTIVE -> SUSPENDED -> ACTIVE: the same row
          returns to ACTIVE after the reinstatement, with prior_suspension_count incremented to 1.
          Cycle lives on the DriverRecord entity (distinct from the KnowledgeTest revert loop).
        test_recipe:
          setup:
            - "An ACTIVE licensed DriverRecord; a 12-point violation drives it to SUSPENDED at clock=0 (duration 30); clock advanced to 30 (SERVED); REINSTATEMENT fee captured."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Eve Cycle", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Five", certified_classes: ["D"], opaque_user_id: "exu-5" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/advance"
              payload: { by_periods: 30 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "GET /driver-records/${dr_id}/suspensions"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { susp_id: "$.data[0].id" }
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "REINSTATEMENT", amount_cents: 18813 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /suspensions/${susp_id}/reinstate"
              payload: { expected_driver_record_version: "${dr_v}" }
              as: LicenseClerk
              as_user_id: "clerk-1"
          assert:
            - "DriverRecord.${dr_id}.licensing_status == ACTIVE"
            - "DriverRecord.${dr_id}.prior_suspension_count == 1"
            - "Suspension.${susp_id}.status == LIFTED_BY_REINSTATEMENT"

      - name: knowledge_test_fail_reschedule_revert_loop
        grounds:
          - state_machines.KnowledgeTest.SCHEDULED_to_FAILED
          - state_machines.KnowledgeTest.FAILED_to_SCHEDULED
          - entities.KnowledgeTest.fields.status
        distinguishing_aspect: |
          KnowledgeTest forms a revert loop SCHEDULED -> FAILED -> SCHEDULED: after a failing grade
          (31/40 == 77.5%) the test reschedules back to SCHEDULED with score_pct cleared. Revert
          loop lives on the KnowledgeTest entity (distinct from the DriverRecord cycle).
        test_recipe:
          setup:
            - "A DriverRecord; a SCHEDULED knowledge test at period 0; clock at 0."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Finn Retry", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 31 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { sp1: $.data.score_pct, st1: $.data.status }
          trigger:
            - call: "POST /knowledge-tests/${kt_id}/reschedule"
              payload: { scheduled_period: 7 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { st2: $.data.status }
          assert:
            - "KnowledgeTest.${kt_id}.score_pct after grade == 77.5"
            - "KnowledgeTest.${kt_id}.status after grade == FAILED"
            - "KnowledgeTest.${kt_id}.status after reschedule == SCHEDULED"
            - "KnowledgeTest.${kt_id}.scheduled_period == 7"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: medical_expiry_cascades_downgrade_then_endorsement_suspend
        grounds:
          - state_machines.MedicalCard.VALID_to_EXPIRED
          - state_machines.DriverRecord.ACTIVE_to_MEDICALLY_DOWNGRADED
          - entities.CdlEndorsement.fields.status
          - entities.DriverRecord.fields.cdl_status
        distinguishing_aspect: |
          Depth-3 TRANSITIVE cascade off POST /_clock/advance: the clock advance expires the
          MedicalCard (hop 1, VALID -> EXPIRED); that expiry itself flips DriverRecord.cdl_status
          ACTIVE -> MEDICALLY_DOWNGRADED (hop 2, caused by hop 1); that downgrade itself suspends the
          GRANTED CdlEndorsement -> SUSPENDED (hop 3, caused by hop 2). Each link is caused by the
          previous, not by the clock advance directly.
        test_recipe:
          setup:
            - "An ACTIVE class-A licensed DriverRecord at clock 0 with cdl_status ACTIVE, holding a VALID MedicalCard valid_through_period==5 and one GRANTED endorsement; clock then advanced to 6 so the card lapses."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Gail Med", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Cas", certified_classes: ["A"], opaque_user_id: "exu-cas" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "A", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
