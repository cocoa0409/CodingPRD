  # ===========================================================================
  # RULE 9 - Compensating invariants on two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_restores_committed_guarantee_and_stage_posture
        grounds:
          - state_machines.Offer.SENT_to_WITHDRAWN
          - calculations.edition_committed_guarantee_total
          - calculations.stage_hold_ledger
          - entities.FairEdition.fields.committed_guarantee_total_cents
          - entities.Stage.fields.held_show_count
          - entities.FairEdition.fields.open_stage_count
        distinguishing_aspect: |
          CONSERVED QUANTITY: encumbered money (committed_guarantee_total_cents), plus the
          slot-count ledger that rides on it. The send encumbers exactly 12500000 and
          saturates the stage; the withdraw must return the edition to exactly 0 - not to
          "about 0" and not to a lingering SATURATED posture. The round trip is
          value-restoring on an aggregate that was recomputed twice, so a stale-increment or
          delta-drift implementation leaves a non-zero residue.
        test_recipe:
          setup:
            - "Edition with one stage whose slot_soft_cap is 1, so a single hold both saturates the stage and empties open_stage_count."
            - "Before the trigger: committed_guarantee_total_cents 0, held_show_count 0, booking_posture OPEN, open_stage_count 1."
            - "One DRAFT offer at guarantee 12500000."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Encumbrance Round Trip Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 1 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "GET /grandstand/fair-editions/${ed}"
              payload: {}
              as: TalentBuyer
              captures: { committed_before: "$.data.committed_guarantee_total_cents", open_before: "$.data.open_stage_count" }
