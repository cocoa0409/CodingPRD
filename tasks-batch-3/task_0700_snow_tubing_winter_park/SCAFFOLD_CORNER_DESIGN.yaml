              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_WAIVER_MISSING"
            - "Waiver.${waiver_id}.status == REVOKED"

  # =====================================================================
  # Cross-cutting complexity layers — OCC, derived-field reconciliation
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_time_block_version_on_confirm_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ticket-confirm-stale-block]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Confirming ticket B with expected_time_block_version one less than the block's current version (after ticket A's confirm bumped it) returns ERR_STALE_VERSION (412); B stays RESERVED."
        test_recipe:
          setup:
            - "OPEN park, OPEN lane cap 5, ACTIVE block; two waivered patrons each with a RESERVED ticket; patron A confirms first (bumping TimeBlock.version)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "OccPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
