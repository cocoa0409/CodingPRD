  - rule_id: boundary_precision_check
    instances:
      - name: waiting_period_exact_date_eligible
        grounds:
          - calculations.record_eligibility
          - state_machines.CriminalRecord.UNSCREENED_to_ELIGIBLE
          - entities.CriminalRecord.fields.status
        distinguishing_aspect: |
          A record whose eligible_on equals the clock (2026-05-01) screens ELIGIBLE (inclusive
          >=), while one whose eligible_on is one day later (2026-05-02) screens INELIGIBLE —
          the exact-date boundary on the screen endpoint.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. R_at: MISDEMEANOR/CONVICTED sentence 2024-05-01 (eligible_on 2026-05-01). R_after: MISDEMEANOR/CONVICTED sentence 2024-05-02 (eligible_on 2026-05-02)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Bo Day", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-A", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2023-01-01T00:00:00Z", sentence_completion_date: "2024-05-01T00:00:00Z" }, as: Clerk, captures: { rat: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-B", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2023-01-01T00:00:00Z", sentence_completion_date: "2024-05-02T00:00:00Z" }, as: Clerk, captures: { raf: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records/${rat}/screen", payload: {}, as: Clerk, captures: { s1: "$.data.status" } }
            - { call: "POST /expungement/criminal-records/${raf}/screen", payload: {}, as: Clerk, captures: { s2: "$.data.status", rr: "$.data.ineligible_reason" } }
          assert:
            - "CriminalRecord.${rat}.status == ELIGIBLE (clock == eligible_on 2026-05-01, inclusive)"
            - "CriminalRecord.${raf}.status == INELIGIBLE with ineligible_reason == WAITING_PERIOD (eligible_on 2026-05-02 > clock)"

      - name: file_zero_eligible_records_empty_set
        grounds:
          - state_machines.Petition.SCREENED_to_FILED
          - validations[priority=10]
          - errors[ERR_NO_ELIGIBLE_RECORDS]
        distinguishing_aspect: |
          A SCREENED petition whose ELIGIBLE-item count is exactly 0 (its only record is a
          NEVER_ELIGIBLE VIOLENT_FELONY) is rejected on FILED with ERR_NO_ELIGIBLE_RECORDS — an
          empty-collection boundary on the petition FILE endpoint (distinct metric/endpoint from
          the waiting-period date threshold).
        test_recipe:
          setup:
            - "Petition with a single VIOLENT_FELONY record screened INELIGIBLE (NEVER_ELIGIBLE); petition SCREENED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Vi Nel", date_of_birth: "1970-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-V", offense_class: "VIOLENT_FELONY", disposition: "CONVICTED", disposition_date: "2018-01-01T00:00:00Z", sentence_completion_date: "2019-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_NO_ELIGIBLE_RECORDS (eligible-item count == 0)"

  - rule_id: cross_entity_state_dependency
    instances:
