            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${rl_a_id}", coil_lot_id: "${cl_match_id}", dealer_order_id: "${o1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", planned_kg: 6600.0 }
