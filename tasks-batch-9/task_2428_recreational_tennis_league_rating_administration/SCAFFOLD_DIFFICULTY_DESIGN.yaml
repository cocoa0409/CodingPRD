      - name: auto_grant_threshold_clamped_max_min_with_strike_penalty
        grounds:
          - calculations.appeal_auto_grant_evaluation
          - entities.RatingAppeal.fields.auto_grant_eligible
          - entities.RatingAppeal.fields.strike_count_at_filing
          - validations[priority=58]
          - state_machines.RatingAppeal.UNDER_REVIEW_to_GRANTED
        distinguishing_aspect: |
          threshold combines three inputs non-linearly as max(0.20, min(0.50, 0.10*3 -
          0.05*min(2,3))) == 0.20 against gap 0.250, so auto_grant_eligible is true and DENY
          is refused with ERR_AUTO_GRANT_MUST_BE_GRANTED; dropping the strike term would give
          threshold 0.30 > 0.250, making the appeal a quorum case in which DENY would succeed.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with default strike_limit 3, and one SECTION league at ntrp_level 4.0 (band 3.0..4.0)."
            - "Player h1 is COMPUTER_RATED at 3.5 (so required_matches == COMPUTER_REQUIRED_MATCHES == 3); every other player is COMPUTER_RATED at 4.0."
            - "Three identical VERIFIED matches (2026-08-15, 2026-08-20, 2026-08-25). On every one, line 1 pairs h1+h2 against a1+a2 and is lost 2-6 2-6."
            - "Each of h1's three lines therefore scores opp_level_avg 4.000, game_diff_ratio (4-12)/16 = -0.5, line_rating round(4.000 - 0.250, 3) = 3.750; in_season_provisional over three equal lines gives dynamic_rating 3.750 and gap round(3.750 - 3.5, 3) = 0.250."
            - "One INELIGIBLE_LINEUP strike (weight 2) is issued to h1 after the third match, leaving strike_count 2 (< strike_limit 3, so h1 stays ACTIVE and playable)."
            - "h1 then files an UP appeal to 4.0; at filing the appeal pins rating_level_at_filing 3.5, dynamic_rating_at_filing 3.750, verified_match_count_at_filing 3, strike_count_at_filing 2."
            - "The chair opens the review; no committee vote is ever cast, so support_vote_count stays 0."
