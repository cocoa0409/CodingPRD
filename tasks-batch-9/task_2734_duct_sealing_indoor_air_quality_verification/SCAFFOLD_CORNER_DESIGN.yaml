            - "Call 3 (seq 1 replayed): HTTP 422 ERR_SAMPLE_SEQUENCE_INVALID — an accepted position cannot be overwritten"
            - "Call 4 (seq 2): HTTP 201, accepted because the two rejected calls did not advance sample_count"
            - "${final_count} == 2 and ${final_leak} == 200.0"
            - "GET /duct-sealing/seal-jobs/${job_id}/leakage-samples returns exactly 2 rows with sample_seq 1 and 2; the seq-1 row still carries instantaneous_leakage_cfm 300.0 (the replay did not mutate it)"
            - "SealJob.${job_id}.status == INJECTING and target_reached == false (200.0 > 60.0)"

      - name: reading_seq_is_unique_per_room_not_per_complaint
        claim_type: violation_to_error
        grounds:
          - validations[priority=100]
          - errors.ERR_DUPLICATE_READING_SEQ
          - entities.AirflowReading.reading_seq
        distinguishing_aspect: "The uniqueness key is the PAIR (comfort_complaint_id, room_label): reading_seq 1 is rejected as a duplicate for the same room yet accepted for a second room under the same complaint, and balanced_room_count is recomputed over the LATEST reading per distinct room rather than over all rows."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; program, technician and project exist; one comfort complaint on the project diagnosed with tolerance_pct 10.00"
          setup_api_calls:
