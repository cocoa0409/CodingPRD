              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b2: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /tour-bookings/${b1}/reschedule-requests"
              payload: { reason: "Prospect asked for an afternoon tour" }
              as: MarketingManager
            - call: "POST /tour-bookings/${b1}/reschedule"
              payload: { new_scheduled_start_utc: "2026-08-16T13:00:00Z" }
              as: MarketingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-bookings/${b2}/no-show"
              payload: {}
              as: MarketingManager
            - call: "POST /tour-bookings/${b3}/cancel"
              payload: { reason: "Prospect cancelled by phone" }
              as: MarketingManager
          assert:
            - "before trigger 1: SalesGallery.${g1}.booked_slot_count == 3"
            - "after trigger 1: TourBooking.${b1}.status == RESCHEDULE_PENDING and SalesGallery.${g1}.booked_slot_count == 3 (RESCHEDULE_PENDING still occupies its slot)"
            - "after trigger 2: TourBooking.${b1}.status == SCHEDULED with scheduled_start_utc 2026-08-16T13:00:00Z, scheduled_end_utc 2026-08-16T15:00:00Z, reschedule_count == 1, and SalesGallery.${g1}.booked_slot_count == 3"
            - "after trigger 4: TourBooking.${b2}.status == NO_SHOW and SalesGallery.${g1}.booked_slot_count == 2"
            - "after trigger 4: TourChannel.${ch1}.no_show_count == 1 and historical_no_show_rate == 1.0000 but status == ACTIVE (booked_count 3 < NO_SHOW_MIN_SAMPLE 4)"
            - "after trigger 5: TourBooking.${b3}.status == CANCELLED and SalesGallery.${g1}.booked_slot_count == 1"
            - "at every step SalesGallery.${g1}.booked_slot_count equals the count of that gallery's bookings in status SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN or TOURED"
            - "TourChannel.${ch1}.booked_count == 3 throughout (the ledger and the lifetime counter are independent quantities)"
