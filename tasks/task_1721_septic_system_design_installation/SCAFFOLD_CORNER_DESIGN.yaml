  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_response_reflects_mutation
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, response_envelope]
        distinguishing_aspect: "immediate model: the mutation response body itself carries the post-mutation state (e.g. freeze returns the site with status FROZEN and seasonal_freeze_until set) — no re-read is needed to observe the change, and a re-read returns the identical values."
        test_recipe:
          setup: ["Company/manager/customer/site S"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/freeze"
              payload: { freeze_until_period: 5 }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { st: $.data.status, frz: $.data.seasonal_freeze_until, v: $.data.version }
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { st2: $.data.status, frz2: $.data.seasonal_freeze_until, v2: $.data.version }
          assert:
            - "Mutation response: status == FROZEN, seasonal_freeze_until == 5, version bumped by 1 from the create-time value"
            - "Immediate re-read returns identical status/seasonal_freeze_until/version (no eventual lag)"
