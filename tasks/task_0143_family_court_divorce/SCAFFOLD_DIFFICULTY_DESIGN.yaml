# =============================================================================
# Family Court / Divorce Case — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# from prd-bench-scaffold-generator §0.5.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations on different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: child_support_income_shares_vs_percent_obligor
        grounds:
          - calculations.child_support_amount
          - entities.Case.fields.jurisdiction_state
          - entities.SupportOrder.fields.guideline_model
          - entities.SupportOrder.fields.monthly_amount_cents
        distinguishing_aspect: |
          Same petitioner net 300000 c, respondent net 600000 c, overnights 100/265, and addons=0
          on a SupportOrder of support_type=CHILD produce monthly_amount_cents=55265 under the
          INCOME_SHARES variant (Case.jurisdiction_state=CA) and monthly_amount_cents=150000 under
          the PERCENT_OBLIGOR variant (Case.jurisdiction_state=TX) — different entity (Case) drives
          which formula runs.
        test_recipe:
          setup:
            - "Reset clock to 2026-05-18T00:00:00Z"
            - "Create CaseA: jurisdiction_state=CA, marriage 2010-01-01, separation 2025-01-01, has_minor_children=true; both parties have FinancialDisclosure ACCEPTED with petitioner gross=300000+taxes=0 (net 300000), respondent gross=600000+taxes=0 (net 600000), addon fields = 0"
            - "Create CaseB: jurisdiction_state=TX, otherwise identical inputs to CaseA"
            - "On each case create a ParentingPlan (PROPOSED) with petitioner_overnights=100, respondent_overnights=265, accept by other party so plan AGREED"
          trigger:
            - "POST /cases/{CaseA}/support-orders {support_type:CHILD, order_kind:TEMPORARY, parenting_plan_id:<planA>}"
            - "POST /cases/{CaseB}/support-orders {support_type:CHILD, order_kind:TEMPORARY, parenting_plan_id:<planB>}"
          assert:
            - "SupportOrder on CaseA: guideline_model == 'INCOME_SHARES' AND monthly_amount_cents == 55265"
            - "SupportOrder on CaseB: guideline_model == 'PERCENT_OBLIGOR' AND monthly_amount_cents == 150000"
            - "Assert 55265 != 150000 — same inputs, different SupportOrder.monthly_amount_cents per jurisdiction"

      - name: asset_division_community_vs_equitable
        grounds:
          - calculations.asset_division
          - entities.FinalJudgment.fields.division_model
          - entities.FinalJudgment.fields.petitioner_asset_share_cents
          - entities.FinalJudgment.fields.respondent_asset_share_cents
        distinguishing_aspect: |
          Same disclosure inputs (P_assets=1000000 c, R_assets=2000000 c, no debts; P_net=300000,
          R_net=600000) produce petitioner_asset_share_cents=1500000 under COMMUNITY_PROPERTY
          (Case.jurisdiction_state=CA) and petitioner_asset_share_cents=2000000 under
          EQUITABLE_DISTRIBUTION (Case.jurisdiction_state=NY) — operates on FinalJudgment, a
          different entity than SupportOrder, satisfying the cross-domain requirement.
        test_recipe:
          setup:
            - "CaseA jurisdiction CA, CaseB jurisdiction NY; both has_minor_children=false to skip parenting plans"
            - "On each: both FinancialDisclosures ACCEPTED with assets_total_cents=1000000 (P) and 2000000 (R), debts=0, P_net=300000, R_net=600000"
            - "Advance each case to AWAITING_JUDGMENT via answer + accepted disclosures"
          trigger:
            - "POST /cases/{CaseA}/final-judgments {} (no child or spousal)"
            - "POST /cases/{CaseB}/final-judgments {}"
          assert:
            - "FinalJudgment(CaseA).division_model == 'COMMUNITY_PROPERTY' AND petitioner_asset_share_cents == 1500000 AND respondent_asset_share_cents == 1500000"
            - "FinalJudgment(CaseB).division_model == 'EQUITABLE_DISTRIBUTION' AND petitioner_asset_share_cents == 2000000 AND respondent_asset_share_cents == 1000000"
            - "1500000 != 2000000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas in different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: child_support_tiered_overnight_blended_formula  # mode (a)
        grounds:
          - calculations.child_support_amount
          - entities.Case.fields.jurisdiction_state
          - entities.ParentingPlan.fields.petitioner_overnights_per_year
          - entities.ParentingPlan.fields.respondent_overnights_per_year
          - entities.FinancialDisclosure.fields.net_monthly_income_cents
        distinguishing_aspect: |
          Mode (a) — formula has 4 inputs (P_net, R_net, P_overnights, R_overnights) with
          non-linear interaction: tier selection on combined income, then conditional branching on
          which party is obligor (R_net >= P_net), then a per-tier marginal-rate accumulation, then
          a blended apportionment (income_share - 0.5*overnight_share). With P_net=300000,
          R_net=600000, overnights 100/265 in CA, the pinned result is monthly_amount_cents=55265.
        test_recipe:
          setup:
            - "CaseA jurisdiction=CA, has_minor_children=true; both disclosures ACCEPTED at P_net=300000, R_net=600000; ParentingPlan with overnights 100/265 created"
          trigger:
            - "POST /cases/{CaseA}/support-orders {support_type:CHILD, order_kind:TEMPORARY, parenting_plan_id:<plan>}"
          assert:
            - "SupportOrder.monthly_amount_cents == 55265 (single round_half_up at end, NOT rounded intermediate percentages)"
            - "SupportOrder.guideline_model == 'INCOME_SHARES'"

      - name: asset_division_equitable_pinned_integer_rounding_order  # mode (b)
        grounds:
          - calculations.asset_division
          - entities.FinalJudgment.fields.petitioner_asset_share_cents
          - entities.FinalJudgment.fields.respondent_asset_share_cents
        distinguishing_aspect: |
          Mode (b) — multi-step rounding/integer-division order matters. Formula is
          (net_pool * R_inc) // (P_inc + R_inc) — multiply BEFORE divide. With net_pool=1000003 c,
          R_inc=500000, P_inc=500000, multiply-first yields (1000003*500000)//1000000 = 500001 c,
          while the wrong divide-first order ((R_inc//(P_inc+R_inc))*net_pool) yields 0 c. The
          scaffold PINS multiply-first order, and the invariant P_share + R_share == net_pool must
          hold exactly to the cent.
        test_recipe:
          setup:
            - "CaseA jurisdiction=NY (triggers EQUITABLE_DISTRIBUTION), has_minor_children=false"
            - "Both disclosures ACCEPTED: P assets=500003, R assets=500000, no debts; P_net=500000, R_net=500000"
            - "Advance to AWAITING_JUDGMENT"
          trigger:
            - "POST /cases/{CaseA}/final-judgments {}"
          assert:
            - "FinalJudgment.petitioner_asset_share_cents == 500001 (multiply-before-divide pinned order)"
            - "FinalJudgment.respondent_asset_share_cents == 500002"
            - "FinalJudgment.petitioner_asset_share_cents + FinalJudgment.respondent_asset_share_cents == 1000003 (net_pool conserved exactly)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shapes on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_mediation_cyclic_loop
        grounds:
          - state_machines.Case.MEDIATION_to_MEDIATION
          - entities.Case.fields.mediation_round
          - state_machines.MediationSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Case has a cyclic transition MEDIATION -> MEDIATION (self-loop) gated by mediation_round.
          A session COMPLETED with outcome=IMPASSE while mediation_round < 3 leaves Case.status at
          MEDIATION and increments Case.mediation_round, allowing another session — true cycle on
          the Case entity, not a linear pipeline.
        test_recipe:
          setup:
            - "CaseA in MEDIATION status with Case.mediation_round == 0, both disclosures ACCEPTED, ParentingPlan PROPOSED"
            - "Schedule MediationSession-1 (mediator M1) and complete with outcome=IMPASSE"
          trigger:
            - "POST /cases/{CaseA}/mediation-sessions {mediator_user_id:M1, ...}"
            - "POST /cases/{CaseA}/mediation-sessions/{s1}/start"
            - "POST /cases/{CaseA}/mediation-sessions/{s1}/complete {outcome:IMPASSE}"
            - "POST /cases/{CaseA}/mediation-sessions {mediator_user_id:M1, scheduled_start_at: later, ...}"
          assert:
            - "After first complete: Case.status == 'MEDIATION' AND Case.mediation_round == 1"
            - "Second schedule succeeds (HTTP 201) — proves cycle re-entry is permitted"

      - name: parenting_plan_branching_agreed_vs_contested
        grounds:
          - state_machines.ParentingPlan.PROPOSED_to_AGREED
          - state_machines.ParentingPlan.PROPOSED_to_CONTESTED
          - state_machines.ParentingPlan.CONTESTED_to_COURT_IMPOSED
          - entities.ParentingPlan.fields.status
        distinguishing_aspect: |
          ParentingPlan is a different entity than Case, and its state graph branches: from PROPOSED
          it can go to AGREED (consensual fork) OR to CONTESTED (mediation-impasse fork after round
          >= 3), with different downstream side-effect sets (pin disclosure versions vs await court
          imposition). Branch divergence on the SAME from-state distinguishes this from a linear
          pipeline.
        test_recipe:
          setup:
            - "CaseA in MEDIATION, mediation_round==2, ParentingPlan-P1 in PROPOSED, both disclosures ACCEPTED"
            - "MediationSession-3 IN_PROGRESS"
          trigger:
            - "POST /cases/{CaseA}/mediation-sessions/{s3}/complete {outcome:IMPASSE} — pushes mediation_round to 3, cascades P1 PROPOSED -> CONTESTED"
            - "POST /cases/{CaseA}/parenting-plans/{P1}/impose (as Judge)"
          assert:
            - "After IMPASSE complete: ParentingPlan(P1).status == 'CONTESTED'"
            - "After impose: ParentingPlan(P1).status == 'COURT_IMPOSED' (different terminal than AGREED)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: final_judgment_cascade_depth_3
        grounds:
          - state_machines.FinalJudgment.DRAFT_to_EFFECTIVE
          - state_machines.TemporaryOrder.EFFECTIVE_to_SUPERSEDED
          - state_machines.SupportOrder.ISSUED_to_SUPERSEDED
          - state_machines.Case.AWAITING_JUDGMENT_to_FINALIZED
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /cases/{id}/issue-final-judgment:
          (link 1) FinalJudgment DRAFT -> EFFECTIVE,
          (link 2 caused by link 1) TemporaryOrder EFFECTIVE -> SUPERSEDED,
          (link 3 caused by link 2) the temp order's TEMPORARY SupportOrders ISSUED -> SUPERSEDED.
          Each link is caused by the previous link, not a fan-out from the original action.
        test_recipe:
          setup:
            - "CaseA in TEMP_ORDERED with TemporaryOrder T1 EFFECTIVE; T1.child_support_order_id=S1, T1.spousal_support_order_id=S2 — both ISSUED"
            - "FinalJudgment FJ1 DRAFT exists referencing new FINAL SupportOrders S3 (CHILD), S4 (SPOUSAL); both DRAFT"
            - "Case in AWAITING_JUDGMENT, all disclosures ACCEPTED"
          trigger:
            - "POST /cases/{CaseA}/issue-final-judgment {final_judgment_id: FJ1}"
          assert:
            - "FinalJudgment(FJ1).status == 'EFFECTIVE' (link 1)"
            - "TemporaryOrder(T1).status == 'SUPERSEDED' AND TemporaryOrder(T1).superseded_at != null (link 2, caused by link 1)"
            - "SupportOrder(S1).status == 'SUPERSEDED' AND SupportOrder(S2).status == 'SUPERSEDED' (link 3, caused by link 2)"
            - "Case.status == 'FINALIZED'"

      - name: temp_order_issuance_cascade_depth_2
        grounds:
          - state_machines.TemporaryOrder.DRAFT_to_EFFECTIVE
          - state_machines.SupportOrder.DRAFT_to_ISSUED
          - state_machines.Case.DISCLOSURE_to_TEMP_ORDERED
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger (POST /cases/{id}/issue-temp-order):
          (link 1) TemporaryOrder DRAFT -> EFFECTIVE,
          (link 2 caused by link 1) referenced TEMPORARY SupportOrders DRAFT -> ISSUED.
          Different trigger than the final-judgment cascade above; this captures the temp-order
          propagation pattern.
        test_recipe:
          setup:
            - "CaseA in DISCLOSURE, both disclosures ACCEPTED, ParentingPlan AGREED"
            - "DRAFT TemporaryOrder T1 with child_support_order_id=S1 (DRAFT), spousal_support_order_id=S2 (DRAFT)"
          trigger:
            - "POST /cases/{CaseA}/issue-temp-order {temporary_order_id: T1}"
          assert:
            - "TemporaryOrder(T1).status == 'EFFECTIVE' (link 1)"
            - "SupportOrder(S1).status == 'ISSUED' AND SupportOrder(S2).status == 'ISSUED' (link 2, caused by link 1)"
            - "Case.status == 'TEMP_ORDERED'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_default_pair
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_ANSWER_WINDOW_OPEN
        distinguishing_aspect: |
          Pair (state vs business_temporal): POST /cases/{id}/default on a Case in status FINALIZED
          (long past AWAITING_ANSWER) when the deadline has not been pushed — state check at
          priority 5 fires FIRST with ERR_INVALID_STATE; business_temporal check at priority 7
          (ERR_ANSWER_WINDOW_OPEN) would also have failed but is never reached.
        test_recipe:
          setup:
            - "CaseA fully finalized (status=FINALIZED, answer_deadline_at in the past)"
          trigger:
            - "POST /cases/{CaseA}/default"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE' (priority-5 wins over priority-7)"

      - name: state_vs_business_constraint_impose_pair
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors.ERR_INVALID_STATE
          - errors.ERR_MEDIATION_NOT_EXHAUSTED
        distinguishing_aspect: |
          DIFFERENT pair (state vs business_constraint): POST .../parenting-plans/{id}/impose on a
          plan that is AGREED (already terminal-ish) with Case.mediation_round==0 — priority-5
          ERR_INVALID_STATE fires before priority-16 ERR_MEDIATION_NOT_EXHAUSTED. The losing
          category here (business_constraint) differs from the losing category above
          (business_temporal), giving a second distinct category pair.
        test_recipe:
          setup:
            - "CaseA in MEDIATION, ParentingPlan P1 in AGREED (via the proper accept flow), Case.mediation_round == 0"
          trigger:
            - "POST /cases/{CaseA}/parenting-plans/{P1}/impose (Judge)"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE' (priority-5 wins over priority-16)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics / endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spousal_eligibility_5_year_boundary
        grounds:
          - calculations.marriage_duration_years
          - calculations.spousal_support_amount
          - validations[priority=13]
          - errors.ERR_NOT_ELIGIBLE_FOR_SPOUSAL
        distinguishing_aspect: |
          Boundary on a NUMERIC threshold (marriage_duration_years >= 5) at the
          POST /cases/{id}/support-orders endpoint. With marriage_date=2020-01-01,
          separation_date=2024-12-31: delta=1826 days, floor(1826/365.25)=4 -> ineligible. With
          separation_date=2025-01-02: delta=1828 days, floor(1828/365.25)=5 -> eligible. Two
          adjacent inputs straddle the >= 5 cutoff and produce opposite outcomes.
        test_recipe:
          setup:
            - "CaseA: marriage 2020-01-01, separation 2024-12-31, both disclosures ACCEPTED with P_net=300000, R_net=600000"
            - "CaseB: marriage 2020-01-01, separation 2025-01-02, otherwise identical to CaseA"
          trigger:
            - "POST /cases/{CaseA}/support-orders {support_type:SPOUSAL, order_kind:TEMPORARY}"
            - "POST /cases/{CaseB}/support-orders {support_type:SPOUSAL, order_kind:TEMPORARY}"
          assert:
            - "CaseA: HTTP 422 with error_id == 'ERR_NOT_ELIGIBLE_FOR_SPOUSAL' (4 years floor)"
            - "CaseB: HTTP 201, SupportOrder created (5 years floor)"

      - name: answer_window_inclusive_deadline_boundary
        grounds:
          - calculations.answer_deadline
          - state_machines.Case.AWAITING_ANSWER_to_ANSWERED
          - state_machines.Case.AWAITING_ANSWER_to_DEFAULTED
          - validations[priority=7]
        distinguishing_aspect: |
          DIFFERENT metric (datetime inclusive vs strict) reachable via DIFFERENT endpoints
          (POST .../answer vs POST .../default). answer_deadline_at is filed_at + 30 days; Answer
          allowed when now() <= deadline (inclusive); Default only when now() > deadline (strict).
          Exactly at the deadline instant, Answer succeeds and Default fails — distinct precision
          rule from the numeric tier above.
        test_recipe:
          setup:
            - "CaseA filed at 2026-05-01T00:00:00Z; Case.answer_deadline_at == 2026-05-31T00:00:00Z"
            - "POST /_clock/advance {to_timestamp: 2026-05-31T00:00:00Z}"
          trigger:
            - "POST /cases/{CaseA}/answer (Respondent)"
          assert:
            - "Answer succeeds — Case.status transitions to 'ANSWERED' (inclusive boundary)"
            - "If instead Default attempted at same instant: HTTP 409 with error_id == 'ERR_ANSWER_WINDOW_OPEN' (strict boundary)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_start_mediation_depends_on_both_disclosures_accepted
        grounds:
          - state_machines.Case.DISCLOSURE_to_MEDIATION
          - entities.FinancialDisclosure.fields.status
          - validations[priority=6]
          - errors.ERR_DISCLOSURE_INCOMPLETE
        distinguishing_aspect: |
          Entity pair (Case, FinancialDisclosure): Case can transition DISCLOSURE -> MEDIATION only
          if BOTH parties' FinancialDisclosure records are in status ACCEPTED. A single party's
          disclosure stuck in SUBMITTED blocks the transition.
        test_recipe:
          setup:
            - "CaseA in DISCLOSURE; Petitioner FinancialDisclosure ACCEPTED; Respondent FinancialDisclosure SUBMITTED (not yet ACCEPTED)"
          trigger:
            - "POST /cases/{CaseA}/start-mediation"
          assert:
            - "HTTP 409 with error_id == 'ERR_DISCLOSURE_INCOMPLETE'"
            - "Case.status remains 'DISCLOSURE'"

      - name: parenting_plan_accept_depends_on_disclosure_acceptance
        grounds:
          - state_machines.ParentingPlan.PROPOSED_to_AGREED
          - state_machines.ParentingPlan.COUNTERED_to_AGREED
          - entities.FinancialDisclosure.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          DIFFERENT entity pair (ParentingPlan, FinancialDisclosure) than the (Case,
          FinancialDisclosure) pair above. ParentingPlan PROPOSED/COUNTERED -> AGREED is blocked
          when either party's FinancialDisclosure is not yet ACCEPTED, even though the plan and
          accept flow are otherwise valid. This forces reasoning about a second cross-entity
          relationship.
        test_recipe:
          setup:
            - "CaseA in DISCLOSURE; ParentingPlan-P1 PROPOSED by Petitioner; Petitioner disclosure ACCEPTED; Respondent disclosure SUBMITTED"
          trigger:
            - "POST /cases/{CaseA}/parenting-plans/{P1}/accept (Respondent)"
          assert:
            - "HTTP 409 with error_id == 'ERR_DISCLOSURE_INCOMPLETE'"
            - "ParentingPlan(P1).status remains 'PROPOSED'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mediator_half_open_interval_overlap
        grounds:
          - concurrency_rules[mediator double-booked]
          - validations[priority=8]
          - errors.ERR_MEDIATOR_DOUBLE_BOOKED
          - entities.MediationSession.fields.scheduled_start_at
          - entities.MediationSession.fields.scheduled_end_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end). Two MediationSession rows for the same
          mediator_user_id collide when their [start, end) intervals intersect strictly. Adjacent
          back-to-back sessions where session-2.start == session-1.end are PERMITTED (no overlap
          on a half-open interval at the boundary). Sits on MediationSession resource keyed by
          mediator_user_id.
        test_recipe:
          setup:
            - "CaseA and CaseB both in DISCLOSURE/MEDIATION; mediator M1 has SCHEDULED MediationSession on CaseA from 2026-06-01T10:00:00Z to 2026-06-01T11:00:00Z"
          trigger:
            - "POST /cases/{CaseB}/mediation-sessions {mediator_user_id:M1, scheduled_start_at:2026-06-01T10:30:00Z, scheduled_end_at:2026-06-01T11:30:00Z}"
            - "POST /cases/{CaseB}/mediation-sessions {mediator_user_id:M1, scheduled_start_at:2026-06-01T11:00:00Z, scheduled_end_at:2026-06-01T12:00:00Z}"
          assert:
            - "First attempt: HTTP 409 with error_id == 'ERR_MEDIATOR_DOUBLE_BOOKED' (strict overlap)"
            - "Second attempt: HTTP 201 — back-to-back at boundary is permitted (half-open semantics)"

      - name: answer_window_inclusive_closed_interval
        grounds:
          - calculations.answer_deadline
          - state_machines.Case.AWAITING_ANSWER_to_ANSWERED
          - validations[priority=7]
          - entities.Case.fields.answer_deadline_at
        distinguishing_aspect: |
          DIFFERENT interval semantics: INCLUSIVE-CLOSED. The Answer window is closed at the upper
          end: now() <= answer_deadline_at allows Answer. This differs geometrically from the
          half-open mediation interval above (adjacency permitted there; equality permitted here),
          and sits on the Case resource keyed by docket — distinct from the MediationSession
          resource keyed by mediator.
        test_recipe:
          setup:
            - "CaseA filed at 2026-05-01T00:00:00Z (answer_deadline_at == 2026-05-31T00:00:00Z)"
            - "POST /_clock/advance {to_timestamp: 2026-05-31T00:00:00Z}"
          trigger:
            - "POST /cases/{CaseA}/answer (Respondent at exact boundary)"
            - "POST /_clock/advance {to_timestamp: 2026-05-31T00:00:01Z}"
            - "(in a sibling CaseB filed at same time:) POST /cases/{CaseB}/answer"
          assert:
            - "CaseA: HTTP 200 — Answer accepted at exact deadline (closed upper boundary)"
            - "CaseB: HTTP 409 with error_id == 'ERR_ANSWER_WINDOW_EXPIRED' — one second past deadline rejects"

  # =========================================================================
  # Rule 9 — Compensating-action invariants on different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: asset_division_net_pool_conserved
        grounds:
          - calculations.asset_division
          - entities.FinalJudgment.fields.petitioner_asset_share_cents
          - entities.FinalJudgment.fields.respondent_asset_share_cents
          - entities.FinancialDisclosure.fields.assets_total_cents
          - entities.FinancialDisclosure.fields.debts_total_cents
        distinguishing_aspect: |
          Conserved quantity: NET MARITAL POOL (cents). Invariant pinned as an explicit formula:
          FJ.petitioner_asset_share_cents + FJ.respondent_asset_share_cents ==
          (P_disclosure.assets_total_cents + R_disclosure.assets_total_cents
           - P_disclosure.debts_total_cents - R_disclosure.debts_total_cents).
          The integer-division rounding rule in asset_division (remainder to respondent in
          equitable, extra cent to petitioner in community) is the compensating mechanism that
          prevents drift. With P_assets=500003, R_assets=500000, no debts: net_pool=1000003,
          P_share+R_share must equal 1000003 to the cent.
        test_recipe:
          setup:
            - "CaseA jurisdiction=NY, has_minor_children=false, both disclosures ACCEPTED with P assets=500003, R assets=500000, debts=0; P_net=500000, R_net=500000"
            - "Advance Case to AWAITING_JUDGMENT"
          trigger:
            - "POST /cases/{CaseA}/final-judgments {}"
          assert:
            - "FinalJudgment.petitioner_asset_share_cents + FinalJudgment.respondent_asset_share_cents == 1000003 (== assets_total_cents sum - debts_total_cents sum, no drift)"

      - name: support_order_swap_temp_to_final_amount_independence
        grounds:
          - calculations.child_support_amount
          - state_machines.SupportOrder.ISSUED_to_SUPERSEDED
          - state_machines.TemporaryOrder.EFFECTIVE_to_SUPERSEDED
          - state_machines.FinalJudgment.DRAFT_to_EFFECTIVE
          - entities.SupportOrder.fields.monthly_amount_cents
          - entities.SupportOrder.fields.superseded_by_id
        distinguishing_aspect: |
          DIFFERENT conserved quantity: THE COUNT OF EFFECTIVE CHILD SUPPORT ORDERS PER CASE.
          Invariant pinned: at any instant the cardinality
            |{SupportOrder where case_id=C AND support_type=CHILD AND status=='ISSUED'}|
          equals 1 immediately before AND immediately after the cascade triggered by
          POST /cases/{id}/issue-final-judgment (which SUPERSEDES the temp child order and ISSUES
          the final child order). The compensating SUPERSEDED / ISSUED pair leaves the count of
          ISSUED rows unchanged.
        test_recipe:
          setup:
            - "CaseA in TEMP_ORDERED with TemporaryOrder T1 EFFECTIVE; temporary child SupportOrder S1 ISSUED with monthly_amount_cents = X (computed)"
            - "DRAFT FinalJudgment FJ1 referencing FINAL child SupportOrder S2 (DRAFT, computed monthly_amount_cents = X2)"
