            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G Ten", email: "g10@x.com", phone: "1010" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15", allergies: ["MILK"] }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 1 } ], child_ids: ["${c1}"], points_to_redeem: 99999 }, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLERGEN_CONFLICT (safety p5 wins over insufficient-points fiscal p8)"
            - "no CafeOrder is persisted"

  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_exactly_1000_promotes
        grounds:
          - calculations.loyalty_tier_assignment
          - entities.Guardian.fields.loyalty_tier
        distinguishing_aspect: |
          Numeric >= boundary on lifetime_points: exactly 1000 promotes to
          SILVER while 999 stays BRONZE — the inclusive threshold, exercised
          via loyalty-adjustments + ops-runs.
        test_recipe:
          setup:
            - "guardian A adjusted +1000 lifetime points; guardian B adjusted +999"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G A", email: "ga@x.com", phone: "201" }, as: Anonymous, captures: { ga: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G B", email: "gb@x.com", phone: "202" }, as: Anonymous, captures: { gb: $.data.id } }
            - { call: "POST /guardians/${ga}/loyalty-adjustments", payload: { points: 1000, note: "promo" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians/${gb}/loyalty-adjustments", payload: { points: 999, note: "promo" }, as: Manager, as_user_id: "${mgr}" }
          trigger:
