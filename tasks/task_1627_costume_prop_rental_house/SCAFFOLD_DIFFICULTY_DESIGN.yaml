# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Costume & Prop Rental House
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: damage_valuation_agreed_vs_depreciated
        grounds:
          - calculations.damage_valuation
          - entities.DamageClaim.fields.valuation_method
          - entities.DamageClaim.fields.assessed_value_cents
        distinguishing_aspect: |
          Two DAMAGE claims with identical unit economics (acquisition_cost 60000 on 2024-08-01,
          grade drop B->C at assessment on 2026-09-10) diverge purely by the RENTER's insurance
          posture: renter A (VERIFIED coverage 600000 >= replacement 100000) gets AGREED_VALUE =
          round(100000 * 0.60) = 60000, while renter B (VERIFIED coverage 50000 < 100000) gets
          DEPRECIATED_REPLACEMENT = round(max(60000*(1-2/5), 10000) * 0.60) = 21600 — the dual
          variant lives in the claims/valuation domain.
        test_recipe:
          setup:
            - "Rate card RC published (threshold 8, discounts 0.20/0.30, late 0.10)"
            - "Item I: COSTUME, replacement 100000, daily 1000, weekly 5000; two grade-B units U1/U2 acquired 2024-08-01 at 60000"
            - "Renter A THEATRE with VERIFIED cert coverage 600000 (>= item replacement); renter B INDIVIDUAL with VERIFIED cert coverage 50000 (== INDIVIDUAL minimum, < replacement)"
            - "Both have a CONFIRMED short-run production (closing 2026-09-20), a CONFIRMED reservation qty 1 window 2026-09-01..2026-09-10, pull lists dispatched at 2026-08-31"
            - "Clock at 2026-09-10 (on due_back_date, late_days = 0)"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Victorian tailcoat", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-001", condition_grade: B, acquisition_date: "2024-08-01", acquisition_cost_cents: 60000 }, as: HouseAdmin, captures: { u1: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-002", condition_grade: B, acquisition_date: "2024-08-01", acquisition_cost_cents: 60000 }, as: HouseAdmin, captures: { u2: $.data.id } }
            - { call: "POST /rental-house/renters", payload: { name: "Renter A", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { ra_id: $.data.id } }
            - { call: "POST /rental-house/renters/${ra_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PA-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_a: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_a}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter B", renter_type: INDIVIDUAL, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { rb_id: $.data.id } }
            - { call: "POST /rental-house/renters/${rb_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PB-1", coverage_cents: 50000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_b: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_b}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${ra_id}", title: "Prod A", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-09-20" }, as: RenterContact, as_user_id: "${ra_id}", captures: { pa_id: $.data.id } }
            - { call: "POST /rental-house/productions/${pa_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${ra_id}", captures: { pa_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${pa_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${pa_v}" }, as: RenterContact, as_user_id: "${ra_id}", captures: { res_a: $.data.id } }
            - { call: "POST /rental-house/reservations/${res_a}/confirm", payload: {}, as: RenterContact, as_user_id: "${ra_id}" }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${rb_id}", title: "Prod B", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-09-20" }, as: RenterContact, as_user_id: "${rb_id}", captures: { pb_id: $.data.id } }
            - { call: "POST /rental-house/productions/${pb_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${rb_id}", captures: { pb_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${pb_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${pb_v}" }, as: RenterContact, as_user_id: "${rb_id}", captures: { res_b: $.data.id } }
            - { call: "POST /rental-house/reservations/${res_b}/confirm", payload: {}, as: RenterContact, as_user_id: "${rb_id}" }
            - { call: "GET /rental-house/productions/${pa_id}", payload: {}, as: HouseAdmin, captures: { pa_v2: $.data.version } }
            - { call: "POST /rental-house/pull-lists", payload: { production_id: "${pa_id}", expected_production_version: "${pa_v2}" }, as: RenterContact, as_user_id: "${ra_id}", captures: { pl_a: $.data.id } }
            - { call: "POST /rental-house/pull-lists/${pl_a}/submit", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/pull-list-lines?pull_list_id=${pl_a}", payload: {}, as: WardrobeStaff, captures: { line_a: "$.data[0].id" } }
            - { call: "POST /rental-house/pull-list-lines/${line_a}/pick", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: HouseAdmin }
            - { call: "POST /rental-house/pull-lists/${pl_a}/dispatch", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/productions/${pb_id}", payload: {}, as: HouseAdmin, captures: { pb_v2: $.data.version } }
            - { call: "POST /rental-house/pull-lists", payload: { production_id: "${pb_id}", expected_production_version: "${pb_v2}" }, as: RenterContact, as_user_id: "${rb_id}", captures: { pl_b: $.data.id } }
            - { call: "POST /rental-house/pull-lists/${pl_b}/submit", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/pull-list-lines?pull_list_id=${pl_b}", payload: {}, as: WardrobeStaff, captures: { line_b: "$.data[0].id" } }
            - { call: "POST /rental-house/pull-list-lines/${line_b}/pick", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/pull-lists/${pl_b}/dispatch", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: HouseAdmin }
            - { call: "POST /rental-house/pull-list-lines/${line_a}/check-in", payload: { condition_grade_after: C, damage_severity: MINOR, restoration_complete: true }, as: WardrobeStaff, as_user_id: "ws-1" }
            - { call: "GET /rental-house/pull-list-lines/${line_a}/assessment", payload: {}, as: WardrobeStaff, captures: { asm_a: "$.data[0].id" } }
            - { call: "POST /rental-house/pull-list-lines/${line_b}/check-in", payload: { condition_grade_after: C, damage_severity: MINOR, restoration_complete: true }, as: WardrobeStaff, as_user_id: "ws-1" }
            - { call: "GET /rental-house/pull-list-lines/${line_b}/assessment", payload: {}, as: WardrobeStaff, captures: { asm_b: "$.data[0].id" } }
          trigger:
            - { call: "POST /rental-house/damage-claims", payload: { pull_list_line_id: "${line_a}", claim_type: DAMAGE, return_assessment_id: "${asm_a}" }, as: WardrobeStaff, as_user_id: "ws-1", captures: { claim_a: $.data.id, claim_a_val: $.data.assessed_value_cents, claim_a_method: $.data.valuation_method } }
            - { call: "POST /rental-house/damage-claims", payload: { pull_list_line_id: "${line_b}", claim_type: DAMAGE, return_assessment_id: "${asm_b}" }, as: WardrobeStaff, as_user_id: "ws-1", captures: { claim_b: $.data.id, claim_b_val: $.data.assessed_value_cents, claim_b_method: $.data.valuation_method } }
          assert:
            - "DamageClaim.${claim_a}.valuation_method == AGREED_VALUE"
            - "DamageClaim.${claim_a}.assessed_value_cents == 60000"
            - "DamageClaim.${claim_b}.valuation_method == DEPRECIATED_REPLACEMENT"
            - "DamageClaim.${claim_b}.assessed_value_cents == 21600"
            - "60000 != 21600 — identical unit economics diverge by renter insurance posture"

      - name: rental_rate_long_run_vs_weekly
        grounds:
          - calculations.rental_quote
          - entities.Reservation.fields.rate_variant
          - entities.Production.fields.long_run
        distinguishing_aspect: |
          Identical item (weekly 5000) and identical 10-day window produce different quotes purely
          from the PRODUCTION's pinned long_run flag: a 2-week-run production gets WEEKLY =
          1 * 5000 * ceil(10/7) = 10000, while an 8-week-run production gets LONG_RUN =
          10000 * (1 - 0.20) = 8000 — the dual variant lives in the reservation/pricing domain,
          a different entity domain from damage_valuation.
        test_recipe:
          setup:
            - "Rate card RC published (threshold 8 / discount 0.20 / deep 16 / 0.30 / late 0.10)"
            - "Item I weekly 5000 daily 1000 with 2 grade-B units"
            - "Renter R ACTIVE (THEATRE, VERIFIED cert 600000, expiry 2027-06-30)"
            - "Production P_SHORT closing 2026-09-20 (run_weeks 2, long_run false); production P_LONG closing 2026-10-26 (56 days -> run_weeks 8, long_run true); both CONFIRMED"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Flapper dress", period: TWENTIES, category: COSTUME, size_class: S, alteration_policy: REVERSIBLE_ONLY, replacement_value_cents: 80000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-101", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-102", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PR-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_r}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "Short Run", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-09-20" }, as: RenterContact, as_user_id: "${r_id}", captures: { ps_id: $.data.id } }
            - { call: "POST /rental-house/productions/${ps_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { ps_v: $.data.version, ps_lr: $.data.long_run } }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "Long Run", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /rental-house/productions/${pl_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { pl_v: $.data.version, pl_lr: $.data.long_run } }
          trigger:
            - { call: "POST /rental-house/reservations", payload: { production_id: "${ps_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${ps_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { res_s: $.data.id, q_s: $.data.quoted_charge_cents, v_s: $.data.rate_variant } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${pl_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${pl_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { res_l: $.data.id, q_l: $.data.quoted_charge_cents, v_l: $.data.rate_variant } }
          assert:
            - "Production.${ps_id}.long_run == false"
            - "Production.${pl_id}.long_run == true"
            - "Reservation.${res_s}.rate_variant == WEEKLY and .quoted_charge_cents == 10000"
            - "Reservation.${res_l}.rate_variant == LONG_RUN and .quoted_charge_cents == 8000"
            - "Same item, same window, same quantity: 10000 != 8000 driven only by production long_run"

  - rule_id: combinatorial_formula
    instances:
      - name: rental_quote_three_tier_stacking
        grounds:
          - calculations.rental_quote
          - calculations.production_dates
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — window_days, run_weeks against TWO
          thresholds (8 / 16 weeks), quantity and nested discount selection: the same 10-day
          qty-1 window on the same item prices 10000 (WEEKLY, run 2w), 8000 (LONG_RUN, run 8w,
          discount 0.20), and 7000 (deep tier, run 16w, discount 0.30).
        test_recipe:
          setup:
            - "RC published (8/0.20/16/0.30/0.10); item weekly 5000 daily 1000, 3 grade-B units"
            - "Renter ACTIVE with VERIFIED cert 600000 exp 2027-06-30"
            - "Three CONFIRMED productions: P2 closing 2026-09-20 (run_weeks 2), P8 closing 2026-10-26 (run_weeks 8), P16 closing 2026-12-21 (112 days -> run_weeks 16)"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Tailcoat", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-201", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-202", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-203", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PR-2", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_r}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P2", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-09-20" }, as: RenterContact, as_user_id: "${r_id}", captures: { p2: $.data.id } }
            - { call: "POST /rental-house/productions/${p2}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p2_v: $.data.version } }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P8", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p8: $.data.id } }
            - { call: "POST /rental-house/productions/${p8}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p8_v: $.data.version } }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P16", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-12-21" }, as: RenterContact, as_user_id: "${r_id}", captures: { p16: $.data.id } }
            - { call: "POST /rental-house/productions/${p16}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p16_v: $.data.version } }
          trigger:
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p2}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p2_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { q2: $.data.quoted_charge_cents, v2: $.data.rate_variant } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p8}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p8_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { q8: $.data.quoted_charge_cents, v8: $.data.rate_variant } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p16}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p16_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { q16: $.data.quoted_charge_cents, v16: $.data.rate_variant } }
          assert:
            - "P2 reservation: rate_variant == WEEKLY, quoted_charge_cents == 10000"
            - "P8 reservation: rate_variant == LONG_RUN, quoted_charge_cents == 8000"
            - "P16 reservation: rate_variant == LONG_RUN, quoted_charge_cents == 7000"
            - "Three distinct prices 10000 > 8000 > 7000 from one window via nested tier selection"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.line_rental_charge
          - calculations.invoice_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — a LONG_RUN reservation on an item with
          weekly rate 3333 produces a raw per-line charge of 3333 * 1 week * 0.8 = 2666.4, pinned
          to round per line (2666) then sum (2 lines -> 5332); the sum-then-round reading yields
          round(5332.8) = 5333. The invoice MUST read 5332.
        test_recipe:
          setup:
            - "RC published (8/0.20/16/0.30/0.10); item 'Deco vase' PROP weekly 3333 daily 1000, 2 grade-B units"
            - "Renter ACTIVE (FILM, cert 500000 exp 2027-06-30); long-run production PLR (closing 2026-10-26) CONFIRMED"
            - "Two CONFIRMED reservations qty 1: Sep 1-7 and Sep 8-14 (adjacent, non-overlapping)"
            - "Pull list submitted + dispatched at 2026-08-31; both lines OUT with rental_charge_cents 2666 each"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Deco vase", period: TWENTIES, category: PROP, size_class: NONE, alteration_policy: PROHIBITED, replacement_value_cents: 20000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 3333 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-301", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 12000 }, as: HouseAdmin }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-302", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 12000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter F", renter_type: FILM, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PF-1", coverage_cents: 500000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_r}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "LR", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-07", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}" }
            - { call: "GET /rental-house/productions/${p_id}", payload: {}, as: HouseAdmin, captures: { p_v2: $.data.version } }
