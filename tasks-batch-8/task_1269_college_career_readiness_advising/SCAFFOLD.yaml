    side_effects: []

  # --- Placements ---
  - method: POST
    path: "/ccr/students/{id}/placements"
    description: "Offer a WBL placement (OFFERED); term_end must be after term_start; site must be ACTIVE"
    roles: [WblCoordinator]
    code: 201
    input: [site_id, term_start, term_end, hours_per_week]
    output: Placement
    side_effects: ["Requires student ENROLLED"]
  - method: GET
    path: "/ccr/students/{id}/placements"
    description: "Reverse lookup: placements of a student"
    roles: [DistrictAdmin, Advisor, Student, WblCoordinator]
    code: 200
    input: ["status?"]
    output: "Placement[]"
    side_effects: []
  - method: GET
    path: "/ccr/placements/{id}"
    description: "Get one placement"
    roles: [DistrictAdmin, Advisor, Student, WblCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: POST
    path: "/ccr/placements/{id}/transition"
    description: "Placement machine: CONFIRMED (pairwise student overlap + site aggregate capacity), ACTIVE (term started), COMPLETED (hours_logged), DECLINED, TERMINATED"
    roles: [WblCoordinator]
    code: 200
    input: [to_status, "hours_logged?"]
    output: Placement
    side_effects: ["Placement transitions incl. site count recompute, plan wbl/readiness recompute, audit AUTO_DRIFT"]

  # --- Senior audits ---
  - method: POST
    path: "/ccr/students/{id}/senior-audits"
    description: "Open a senior audit (DRAFT) naming the auditor advisor; student must be grade_level 12"
    roles: [DistrictAdmin]
    code: 201
    input: [auditor_advisor_id]
    output: SeniorAudit
    side_effects: ["required_credits snapshot = 24; computed fields refresh"]
  - method: GET
    path: "/ccr/students/{id}/senior-audits"
    description: "Reverse lookup: audits of a student"
    roles: [DistrictAdmin, Advisor, Student]
    code: 200
    input: []
    output: "SeniorAudit[]"
    side_effects: []
  - method: GET
    path: "/ccr/senior-audits/{id}"
    description: "Get one audit with computed requirement flags"
    roles: [DistrictAdmin, Advisor, Student]
    code: 200
    input: []
    output: SeniorAudit
    side_effects: []
  - method: POST
    path: "/ccr/senior-audits/{id}/transition"
    description: "Audit machine: IN_REVIEW (auditor), FLAGGED (auditor, needs flag_reason), CERTIFIED (auditor; SoD + all graduation gates)"
    roles: [Advisor]
    code: 200
    input: [to_status, "flag_reason?"]
    output: SeniorAudit
    side_effects: ["SeniorAudit transitions incl. certify gates and certified_at"]

  # --- Outcome records ---
  - method: POST
    path: "/ccr/students/{id}/outcome-records"
    description: "Record a postsecondary outcome (UNVERIFIED); student must be GRADUATED; at most one per student"
    roles: [DistrictAdmin]
    code: 201
    input: [outcome_type, reported_at, "institution_name?"]
    output: OutcomeRecord
    side_effects: []
  - method: GET
    path: "/ccr/students/{id}/outcome-records"
    description: "Reverse lookup: outcome records of a student"
    roles: [DistrictAdmin, Advisor]
    code: 200
    input: []
    output: "OutcomeRecord[]"
    side_effects: []
  - method: GET
    path: "/ccr/outcome-records/{id}"
    description: "Get one outcome record"
    roles: [DistrictAdmin, Advisor]
    code: 200
    input: []
    output: OutcomeRecord
    side_effects: []
  - method: POST
    path: "/ccr/outcome-records/{id}/transition"
    description: "Verification machine: VERIFIED | DISPUTED"
    roles: [DistrictAdmin]
    code: 200
    input: [to_status]
    output: OutcomeRecord
    side_effects: ["OutcomeRecord transitions"]

  # --- Ops runs ---
  - method: POST
    path: "/ccr/ops-runs"
    description: "Execute the deadline sweep at the current logical clock: overdue PENDING/READY milestones -> MISSED (due_at ASC, created_at ASC), READY applications with a newly-MISSED required milestone regress to DRAFT, reminders stamped for milestones due in [now, now+7d) with last_reminder_sent_at null or older than 24h, all ACTIVE/REVISING plans recompute"
    roles: [DistrictAdmin]
    code: 201
    input: []
    output: OpsRun
    side_effects: ["run_index = previous + 1 (starts at 1); executed_at = current clock; sweep cascades per milestone/application"]
  - method: GET
    path: "/ccr/ops-runs/{id}"
    description: "Get one ops-run with sweep counters"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: OpsRun
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown field, invalid enum member, or out-of-range scalar (grade_level outside 9..12, max_caseload < 1, credits <= 0, hours_per_week <= 0, exam_at not future, hours_logged missing on COMPLETED, flag_reason empty on FLAGGED)" }
  - { id: ERR_INVALID_TERM, http: 422, condition: "Placement create with term_end <= term_start" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership rule violated (student touching another's resource, advisor verifying a letter for a non-advisee)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_REQUEST_NOT_ROUTED_TO_YOU, http: 403, condition: "Teacher acts on a RecommendationRequest whose teacher_id is someone else" }
  - { id: ERR_NOT_AUDITOR, http: 403, condition: "Audit transition attempted by an advisor other than auditor_advisor_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state for the requested transition, or terminal lockdown" }
  - { id: ERR_MILESTONE_NOT_ACTIONABLE, http: 409, condition: "Milestone completion attempted from a non-READY state (PENDING/MISSED/COMPLETED/WAIVED)" }
  - { id: ERR_DECISION_NOT_ALLOWED, http: 409, condition: "Decision recorded while submission_status not in {SUBMITTED, CONFIRMED}, or illegal decision transition" }
  - { id: ERR_AUDITOR_IS_ASSIGNED_ADVISOR, http: 409, condition: "Segregation of duties: certifying auditor equals the student's assigned advisor" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Unique code collision (student_ref, advisor email, pathway_code, site_code)" }
  - { id: ERR_OUTCOME_EXISTS, http: 409, condition: "Second OutcomeRecord for the same student" }
  - { id: ERR_NOT_SENIOR, http: 409, condition: "Senior audit opened for a student whose grade_level != 12" }
  - { id: ERR_PREREQUISITE_INCOMPLETE, http: 409, condition: "Milestone depends_on references another application's milestone or a WAIVED/MISSED milestone" }
  - { id: ERR_DUE_DATE_PAST, http: 409, condition: "Milestone create or rec-request create/reroute with due_at <= now" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Application DRAFT->READY or READY->SUBMITTED after deadline_at" }
  - { id: ERR_TERM_NOT_STARTED, http: 409, condition: "Placement CONFIRMED->ACTIVE before term_start" }
  - { id: ERR_PLACEMENT_OVERLAP, http: 409, condition: "New CONFIRMED placement half-open-overlaps the student's existing CONFIRMED/ACTIVE placement" }
  - { id: ERR_PATHWAY_NOT_ACTIVE, http: 409, condition: "Plan create/activate/PATCH targets a RETIRED pathway" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Enrollment create or replan against a plan that is not ACTIVE" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Plan/application/rec/cert/placement creation for a non-ENROLLED student" }
  - { id: ERR_CROSS_STUDENT_REFERENCE, http: 409, condition: "RecommendationRequest.application_id belongs to a different student" }
  - { id: ERR_STUDENT_NOT_GRADUATED, http: 409, condition: "OutcomeRecord created for a non-GRADUATED student" }
  - { id: ERR_NO_CERTIFIED_AUDIT, http: 409, condition: "Graduation without a CERTIFIED senior audit" }
  - { id: ERR_MILESTONES_INCOMPLETE, http: 409, condition: "Application DRAFT->READY while a required milestone is not COMPLETED or WAIVED" }
  - { id: ERR_PENDING_REC_LETTERS, http: 409, condition: "Application READY->SUBMITTED while a linked RecommendationRequest is REQUESTED or ACCEPTED" }
  - { id: ERR_OPEN_ENROLLMENTS, http: 409, condition: "Audit certify with PLANNED/ENROLLED enrollments remaining" }
  - { id: ERR_CREDITS_SHORTFALL, http: 409, condition: "Audit certify with credits_earned < required_credits" }
  - { id: ERR_PATHWAY_INCOMPLETE, http: 409, condition: "Audit certify with a required course not COMPLETED" }
  - { id: ERR_CERTIFICATION_MISSING, http: 409, condition: "Audit certify without the pathway's required certification PASSED" }
  - { id: ERR_WORK_HOURS_SHORTFALL, http: 409, condition: "Audit certify with verified WBL hours below pathway.required_work_hours" }
  - { id: ERR_CASELOAD_FULL, http: 409, condition: "Student assigned to an advisor whose active_caseload_count >= max_caseload (equality rejects)" }
  - { id: ERR_TEACHER_CAPACITY_EXCEEDED, http: 409, condition: "Letter request create/reroute to a teacher whose open_request_count >= max_active_letters (equality rejects)" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Placement confirm would push the site's interval overlap maximum above max_concurrent_placements" }
  - { id: ERR_NO_ADVISOR_AVAILABLE, http: 409, condition: "Advisor selector pool empty (no ACTIVE advisor with spare capacity) on student create or deactivation rehoming" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District college & career center operator; owns configuration, sweeps, decisions, audits creation, outcome verification"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc; POST /ccr/ops-runs; GET /ccr/ops-runs/{id}"
      - "POST /ccr/advisors; POST /ccr/teachers; POST /ccr/pathways; POST /ccr/placement-sites; PATCH /ccr/placement-sites/{id}"
      - "POST /ccr/advisors/{id}/deactivate; POST /ccr/advisors/{id}/reassignments"
      - "POST /ccr/students; POST /ccr/students/{id}/graduate; POST /ccr/students/{id}/withdraw"
      - "POST /ccr/applications/{id}/decision; POST /ccr/applications/{id}/transition to CONFIRMED"
      - "POST /ccr/students/{id}/senior-audits; POST /ccr/students/{id}/outcome-records; POST /ccr/outcome-records/{id}/transition"
    shared_operations:
      - "GET reads across students, advisors, teachers, pathways, plans, enrollments, applications, milestones, requests, certifications, sites, placements, audits, outcomes"
  - name: Advisor
    description: "College & career advisor; owns plans, enrollments, milestone waivers, letter verification/reroute, and audits where they are the named auditor"
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /ccr/students/{id}/plans; PATCH /ccr/plans/{id}; POST /ccr/plans/{id}/activate; POST /ccr/plans/{id}/revise"
      - "POST /ccr/students/{id}/enrollments; POST /ccr/enrollments/{id}/transition"
      - "POST /ccr/senior-audits/{id}/transition (as auditor)"
      - "RecommendationRequest VERIFIED (assigned advisor) and reroute REQUESTED"
    shared_operations:
      - "POST /ccr/milestones/{id}/transition to WAIVED (shared with no other role for that target)"
      - "GET reads incl. GET /ccr/advisors/{id}/equity-report"
  - name: Student
    description: "Advisee; owns applications, milestones completion, letter requests, placement visibility"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /ccr/students/{id}/applications; POST /ccr/applications/{id}/milestones"
      - "POST /ccr/applications/{id}/transition to READY/SUBMITTED/WITHDRAWN"
      - "POST /ccr/milestones/{id}/transition to COMPLETED"
      - "POST /ccr/students/{id}/recommendation-requests; WITHDRAWN on own requests"
    shared_operations:
      - "GET own students/{id}, plans, enrollments, applications, milestones, requests, certifications, placements, audits, pathways"
  - name: Teacher
    description: "Letter writer; accepts/declines/submits routed recommendation requests"
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "RecommendationRequest ACCEPTED / DECLINED / SUBMITTED on requests routed to them"
    shared_operations:
      - "GET /ccr/teachers/{id}; GET /ccr/teachers/{id}/recommendation-requests; GET single requests routed to them"
  - name: WblCoordinator
    description: "Career-technical education coordinator; owns certifications and work-based learning placements"
    identity: opaque
    exclusive_operations:
      - "POST /ccr/students/{id}/certifications; POST /ccr/certifications/{id}/transition"
      - "POST /ccr/students/{id}/placements; POST /ccr/placements/{id}/transition"
    shared_operations:
      - "GET placements, sites, certifications, pathways"

# =============================================================================
# Cross-cutting semantics notes (normative companions to §1.1–§1.7)
# =============================================================================
notes:
  version_bump_discipline: |
    Student.version increments ONLY on: plan creation (POST /ccr/students/{id}/plans),
    advisor reassignment of that student, graduate, withdraw.
    Advisor.version increments ONLY on: deactivate/reactivate and reassignments
    (both source and target advisors). Every other entity's version increments on
    its own declared state transitions and explicit PATCH writes.
    Pure recomputation of derived fields (active_caseload_count, readiness_*,
    equity_gap_index, target_caseload, open_request_count, confirmed_active_count,
    audit computed flags) never increments any entity's version.
  clock_default: |
    The logical clock defaults to exactly 2026-05-01T00:00:00Z at server startup
    (before any POST /_clock/set_current_utc call) and never falls back to
    wall-clock time. All due_at/deadline_at/term comparisons read this clock.
  selector_determinism: |
    Advisor auto-assignment (POST /ccr/students without advisor_id) and deactivation
    rehoming: eligibility Advisor.status == ACTIVE AND active_caseload_count <
    max_caseload (and, for rehoming, id != the deactivated advisor); ranking
    active_caseload_count ASC; tie-break created_at ASC; empty pool ->
    ERR_NO_ADVISOR_AVAILABLE (deactivation fails atomically, no advisee moves).
    Site capacity-reduction survivors: rank CONFIRMED/ACTIVE placements by
    created_at ASC, keep the first max_concurrent_placements, terminate the tail
    (terminated_reason=SITE_CAPACITY_REDUCTION).
    Ops-run sweep order: due_at ASC, then created_at ASC.
    No selector, ranking, tie-break, or sweep order ever uses random ids.
