    input: []
    output: CodeViolation
    side_effects: []

  - method: GET
    path: "/preservation/code-violations"
    description: "List violations with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "cure_work_order_id?", "status?", "limit?", "offset?"]
    output: CodeViolation[]
    side_effects: []

  - method: POST
    path: "/preservation/code-violations/{violationId}/start-cure"
    description: "Link a CODE_CURE work order and begin cure"
    roles: [VendorAdmin]
    code: 200
    input: ["work_order_id"]
    output: CodeViolation
    side_effects: []

  - method: POST
    path: "/preservation/code-violations/{violationId}/submit-cure"
