  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flock_placement_requires_house_empty
        grounds:
          - state_machines.House.EMPTY_to_OCCUPIED
          - validations[priority=8]
          - entities.Flock.fields.house_id
        distinguishing_aspect: |
          Entity pair Flock -> House: POST /api/flocks is legal only while the target House is
          EMPTY. The first placement flips the house to OCCUPIED, and a second placement into
          the same house is rejected ERR_HOUSE_NOT_EMPTY until the full turnover cycle
          (DEPOPULATING -> CLEANING -> RESTING -> EMPTY) completes.
        test_recipe:
          setup:
            - "Farm; house H1 EMPTY; flock F1 placed into H1 (house becomes OCCUPIED)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Gate Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 800, pullet_cost_cents: 336000 }
              as: FarmManager
              captures: { flock1: $.data.id }
          trigger:
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "ISA_WHITE", breed_peak_rate_pct: 94.0, placement_date: "2026-08-01", initial_hen_count: 500, pullet_cost_cents: 210000 }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_HOUSE_NOT_EMPTY — Flock creation is gated by House.status (Flock->House dependency)"
            - "House.${house_id}.status remains OCCUPIED with current_flock_id == ${flock1}; no second flock created"

      - name: lot_release_requires_farm_not_suspended
        grounds:
          - state_machines.EggLot.FRESH_to_RELEASED
          - state_machines.ComplianceAudit.FINDINGS_RECORDED_to_CLOSED_FAILED
          - calculations.compliance_posture_derivation
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair EggLot -> Farm (different pair from the sibling's Flock->House): release
          is gated by the farm's derived compliance_posture. A FAILED audit flips the farm to
          SUSPENDED and the lot release is rejected ERR_FARM_SUSPENDED even though the lot
          itself is FRESH/CLEAR and its flock is not quarantined.
        test_recipe:
          setup:
            - "Farm; house; LAYING flock; production 240 eggs; confirmed run -> one FRESH/CLEAR lot"
            - "Compliance audit run to FAILED (scheduled 2026-08-01, started, findings recorded with 0 open corrective actions, closed FAILED)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "AuditGate Farm", certification_program: "CAGE_FREE", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "AVIARY", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: $.data.id }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /api/compliance-audits"
              payload: { farm_id: "${farm_id}", standard: "USDA_CAGE_FREE", audit_date: "2026-08-01" }
              as: ComplianceOfficer
              captures: { audit_id: $.data.id }
            - call: "POST /api/compliance-audits/${audit_id}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/compliance-audits/${audit_id}/record-findings"
              payload: { findings_count: 2, corrective_actions_open: 0 }
              as: ComplianceOfficer
            - call: "POST /api/compliance-audits/${audit_id}/close"
              payload: { outcome: "FAILED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
              captures: { err: $.data.error_id }
          assert:
            - "Farm.${farm_id}.compliance_posture == SUSPENDED after the FAILED audit"
            - "err == ERR_FARM_SUSPENDED — EggLot release gated by Farm state (EggLot->Farm dependency)"
            - "EggLot.${lot_id}.lifecycle_status remains FRESH"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_windows_half_open_touching_allowed
        grounds:
          - validations[priority=10]
          - entities.RetailerContract.fields.effective_start
          - entities.RetailerContract.fields.effective_end
        distinguishing_aspect: |
          Resource = RetailerContract coverage on a farm; interval semantics = HALF-OPEN
          [effective_start, effective_end): a new window starting exactly at an existing
          window's end (2026-03-01) is legal, while one starting a day earlier (2026-02-28)
          collides -> ERR_CONTRACT_WINDOW_OVERLAP. Sibling uses a different resource with
          buffer semantics.
        test_recipe:
          setup:
            - "Farm; contract C1 [2026-01-01, 2026-03-01) DRAFT exists"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Window Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "A", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-03-01", weekly_min_dozen: 10, max_open_dozen: 100 }
              as: ContractManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "B", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-03-01", effective_end: "2026-06-01", weekly_min_dozen: 10, max_open_dozen: 100 }
              as: ContractManager
              captures: { c2: $.data.id }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "C", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-02-28", effective_end: "2026-05-01", weekly_min_dozen: 10, max_open_dozen: 100 }
              as: ContractManager
              captures: { err: $.data.error_id }
          assert:
            - "C2 created (201): [2026-03-01, 2026-06-01) touches C1's end — half-open adjacency is not an overlap"
            - "C3 rejected: err == ERR_CONTRACT_WINDOW_OVERLAP (2026-02-28 < 2026-03-01 intersects C1)"

      - name: audit_calendar_minimum_30_day_buffer
        grounds:
          - validations[priority=10]
          - entities.ComplianceAudit.fields.audit_date
        distinguishing_aspect: |
          Resource = ComplianceAudit calendar on a farm; interval semantics = MINIMUM GAP BUFFER
          (different from the sibling's half-open adjacency): even disjoint point events must be
          >= 30 days apart — 2026-05-09 (29 days after 2026-04-10) is rejected
          ERR_AUDIT_INTERVAL_TOO_SOON while 2026-05-10 (exactly 30) is accepted.
        test_recipe:
          setup:
            - "Farm; audit A1 scheduled at 2026-04-10 (status SCHEDULED, non-terminal)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "AuditCal Farm", certification_program: "PASTURE", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/compliance-audits"
              payload: { farm_id: "${farm_id}", standard: "PASTURE_RAISED", audit_date: "2026-04-10" }
              as: ComplianceOfficer
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /api/compliance-audits"
              payload: { farm_id: "${farm_id}", standard: "FDA_EGG_SAFETY", audit_date: "2026-05-09" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/compliance-audits"
              payload: { farm_id: "${farm_id}", standard: "FDA_EGG_SAFETY", audit_date: "2026-05-10" }
              as: ComplianceOfficer
              captures: { a3: $.data.id }
          assert:
            - "29-day gap rejected: err == ERR_AUDIT_INTERVAL_TOO_SOON"
            - "exactly-30-day gap accepted: A3 created (201), status SCHEDULED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: disposition_complete_then_void_preserves_hen_balance
        grounds:
          - calculations.hen_balance_invariant
          - state_machines.SpentHenDisposition.PLANNED_to_COMPLETED
          - state_machines.SpentHenDisposition.COMPLETED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = HEN HEADCOUNT: initial_hen_count == current_hen_count +
          mortality + disposed. Forward complete (200 hens out) moves current to 797; the
          compensating void restores current to exactly 997 — the pair leaves the named
          quantity drift-free. Sibling conserves a different quantity (gradable eggs).
        test_recipe:
          setup:
            - "Farm; house; LAYING flock 1000 hens; one production day with mortality_count 3 (current 997); flock DEPOPULATING; disposition of 200 hens PLANNED"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "HenBalance Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 100, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 3 }
              as: FarmManager
            - call: "POST /api/flocks/${flock_id}/depopulate"
              payload: {}
              as: FarmManager
            - call: "POST /api/dispositions"
              payload: { flock_id: "${flock_id}", method: "LIVE_SALE", hen_count: 200, revenue_cents: 1000 }
              as: FarmManager
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /api/dispositions/${disp_id}/complete"
              payload: {}
              as: FarmManager
            - call: "POST /api/dispositions/${disp_id}/void"
              payload: {}
              as: FarmManager
          assert:
            - "after complete: Flock.current_hen_count == 797 and invariant holds (1000 == 797 + 3 + 200)"
            - "after void: SpentHenDisposition.status == VOIDED and Flock.current_hen_count == 997"
            - "after the pair: invariant restored exactly (1000 == 997 + 3 + 0) — zero drift in hen headcount"

      - name: grading_confirm_then_void_preserves_gradable_egg_balance
        grounds:
          - calculations.egg_pool_balance_invariant
          - calculations.size_distribution_materialization
          - state_machines.GradingRun.CONFIRMED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = GRADABLE EGGS (different from hens): sum(eggs_collected -
          rejected_eggs) == ungraded_egg_pool + sum(eggs_to_grade of CONFIRMED non-VOIDED runs).
          Confirm moves 480 eggs from pool to lots; the compensating void returns exactly 480
          and expires the unshipped lots — zero drift in the gradable-egg ledger.
        test_recipe:
          setup:
            - "Farm; house; LAYING flock; production day 2026-07-31: 500 eggs, 20 rejects -> pool 480"
            - "Grading run of 480 eggs: 240 LARGE + 216 JUMBO + 24 undergrades (12 cracked, 8 dirty, 4 blood spot); CONFIRMED -> JUMBO 18 dozen + LARGE 20 dozen lots, pool 0, loose 0"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "EggBalance Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 500, rejected_eggs: 20, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 480 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: $.data.id }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 216, cracked_count: 12, dirty_count: 8, blood_spot_count: 4 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
          trigger:
            - call: "POST /api/grading-runs/${run_id}/void"
              payload: {}
              as: QAManager
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
            - call: "GET /api/lots?grading_run_id=${run_id}"
              payload: {}
              as: QAManager
          assert:
            - "after confirm: ungraded_egg_pool == 0 and balance holds (500 - 20 == 0 + 480)"
            - "after void: GradingRun.status == VOIDED; ungraded_egg_pool == 480 and balance restored (480 == 480 + 0)"
            - "both child lots lifecycle_status == EXPIRED (void compensation); loose_egg_pool == 0"
