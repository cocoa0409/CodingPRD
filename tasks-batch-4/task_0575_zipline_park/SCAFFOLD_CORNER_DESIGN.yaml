  - section: cross_cutting_complexity_layers
    instances:
      - name: season_pass_occ_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[season-pass-create-stale-participant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first pass create advances Participant.version 1->2, a second create still carrying expected_participant_version 1 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Participant created (version 1); first season pass created successfully (version now 2)"]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /participants/${p_id}/season-passes"
              payload: { tier: "STANDARD", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z", total_uses: 5, expected_participant_version: "${p_v}" }
              as: Operator
              captures: { sp_a: $.data.id }
          trigger:
            - call: "POST /participants/${p_id}/season-passes"
              payload: { tier: "PREMIUM", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z", total_uses: 10, expected_participant_version: "${p_v}" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response HTTP status == 412"

