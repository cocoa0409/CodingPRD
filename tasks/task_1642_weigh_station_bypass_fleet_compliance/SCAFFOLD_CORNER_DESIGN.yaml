        test_recipe:
          setup: ["clock 2026-08-01; carrier ACTIVE"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "GET /api/vehicles"
