  - section: validations
    instances:
      - name: unauthenticated_call_outranks_role_and_schema_errors
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no role identity at all, a role-restricted target endpoint and a malformed body returns 401 ERR_UNAUTHENTICATED - not the 403 the role rule would give nor the 400 the schema rule would give - because priority 1 is evaluated before 2 and 3, and nothing is written."
        test_recipe:
          setup:
            - "an empty database at clock 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: RiskAnalyst
          trigger:
            - call: "POST /monitoring-runs"
              payload: { as_of_date: "not-a-date" }
              as: "<request sent with no X-Role header>"
              captures: { err_v1: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "${err_v1} == ERR_UNAUTHENTICATED"
            - "the response envelope has response_type == error and data contains error_id and message"
            - "the portfolio is untouched: GET /merchants (as RiskAnalyst) returns meta.total_count == 0"
      - name: role_check_outranks_the_schema_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - roles.Applicant
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "An Applicant posting a monitoring run with a malformed as_of_date gets 403 ERR_ROLE_NOT_PERMITTED rather than 400 ERR_INVALID_REQUEST: authorisation is settled at priority 2, before the body is ever parsed at priority 3."
        test_recipe:
          setup:
            - "one DRAFT application so an Applicant identity exists, clock 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
