# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Petition & Civic Advocacy — Expert. 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: signature_tally_official_vs_provisional
        grounds:
          - calculations.signature_tally
          - entities.Petition.fields.verified_signature_count
          - entities.Petition.fields.pending_signature_count
          - state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: "On the Petition domain: the official variant counts only status=VERIFIED (=1) while the provisional variant includes PENDING_VERIFICATION (=2), so a single unconfirmed signature inflates one variant and not the other."
        test_recipe:
          setup:
            - "Petition PUBLISHED (goal 5) with an ACTIVE target."
            - "Signer A signed and VERIFIED; Signer B signed but left PENDING_VERIFICATION."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "author1@x.com", full_name: "Author One", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Clean Rivers", summary: "s", body: "b", category: "ENVIRONMENT", goal: 5 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Mayor", title: "Mayor", office: "City Hall", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "signerA@x.com", full_name: "Signer A", jurisdiction: "US-CA-12" }, as: Guest, captures: { signerA_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signerA_id}", captures: { sigA_id: "$.data.id", tokA: "$.data.verification_token" } }
            - { call: "POST /signatures/${sigA_id}/verify", payload: { verification_token: "${tokA}" }, as: Member, as_user_id: "${signerA_id}" }
            - { call: "POST /users", payload: { email: "signerB@x.com", full_name: "Signer B", jurisdiction: "US-CA-12" }, as: Guest, captures: { signerB_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signerB_id}", captures: { sigB_id: "$.data.id" } }
          trigger:
            - { call: "GET /petitions/${pet_id}", payload: {}, as: Member, as_user_id: "${author_id}", captures: { verified: "$.data.verified_signature_count", pending: "$.data.pending_signature_count" } }
          assert:
            - "Petition.${pet_id}.verified_signature_count == 1"
            - "Petition.${pet_id}.pending_signature_count == 1"

      - name: campaign_funds_gross_vs_net
        grounds:
          - calculations.campaign_funds
          - entities.Campaign.fields.gross_pledged_cents
          - entities.Campaign.fields.funds_raised_cents
          - state_machines.Donation.PENDING_to_SETTLED
        distinguishing_aspect: "On the Campaign domain (distinct from signature counts): gross_pledged_cents includes a PENDING donation at full 10000 while funds_raised_cents only reflects the one SETTLED donation net of fee (9680)."
        test_recipe:
          setup:
            - "Campaign ACTIVE with donation D1 (10000) SETTLED and donation D2 (10000) left PENDING."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth2@x.com", full_name: "A2", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Fund Park", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/campaign", payload: { goal_cents: 100000 }, as: Member, as_user_id: "${author_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /users", payload: { email: "donor1@x.com", full_name: "D1", jurisdiction: "US-CA-12" }, as: Guest, captures: { donor_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 10000 }, as: Member, as_user_id: "${donor_id}", captures: { d1_id: "$.data.id" } }
            - { call: "POST /donations/${d1_id}/transition", payload: { to_status: "SETTLED" }, as: Admin }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 10000 }, as: Member, as_user_id: "${donor_id}", captures: { d2_id: "$.data.id" } }
          trigger:
            - { call: "GET /campaigns/${camp_id}", payload: {}, as: Member, as_user_id: "${author_id}", captures: { gross: "$.data.gross_pledged_cents", net: "$.data.funds_raised_cents" } }
          assert:
            - "Campaign.${camp_id}.gross_pledged_cents == 20000"
            - "Campaign.${camp_id}.funds_raised_cents == 9680"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: promotion_price_clamp_mode_a
        grounds:
          - calculations.promotion_price
          - entities.Promotion.fields.price_cents
          - entities.Promotion.fields.duration_days
        distinguishing_aspect: "Mode (a): 3 inputs (placement_tier=SPOTLIGHT, duration_days=10, category=POLITICS) with nested min/max clamp — raw 25000*10*2.0=500000 is clamped to MAX 200000 BEFORE the flat 1500 listing fee, giving 201500 (not 501500)."
        test_recipe:
          setup:
            - "A PUBLISHED POLITICS petition exists so it is promotable."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth3@x.com", full_name: "A3", jurisdiction: "US-NY-01" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Reform Now", summary: "s", body: "b", category: "POLITICS", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Gov", title: "Governor", office: "State", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
          trigger:
            - { call: "POST /promotions", payload: { petition_id: "${pet_id}", placement_tier: "SPOTLIGHT", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-11T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promo_id: "$.data.id", price: "$.data.price_cents" } }
          assert:
            - "Promotion.${promo_id}.duration_days == 10"
            - "Promotion.${promo_id}.price_cents == 201500"

      - name: donation_fee_rounding_order_mode_b
        grounds:
          - calculations.donation_fee_split
          - entities.Donation.fields.platform_fee_cents
          - entities.Campaign.fields.funds_raised_cents
        distinguishing_aspect: "Mode (b): rounding order pinned to round-per-donation-then-sum — settling amounts 3450 (net 3320) and 3455 (net 3325) yields funds_raised_cents 6645, whereas sum-then-round (round(6905*0.029)+30 on the sum) would give 6675."
        test_recipe:
          setup:
            - "Campaign ACTIVE with two donations 3450 and 3455 both PENDING, ready to settle."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth4@x.com", full_name: "A4", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Round Test", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/campaign", payload: { goal_cents: 50000 }, as: Member, as_user_id: "${author_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /users", payload: { email: "donor2@x.com", full_name: "D2", jurisdiction: "US-CA-12" }, as: Guest, captures: { donor_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 3450 }, as: Member, as_user_id: "${donor_id}", captures: { d1_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 3455 }, as: Member, as_user_id: "${donor_id}", captures: { d2_id: "$.data.id" } }
            - { call: "POST /donations/${d1_id}/transition", payload: { to_status: "SETTLED" }, as: Admin }
          trigger:
            - { call: "POST /donations/${d2_id}/transition", payload: { to_status: "SETTLED" }, as: Admin, captures: { d2_fee: "$.data.platform_fee_cents", d2_net: "$.data.net_to_campaign_cents" } }
          assert:
            - "Donation.${d1_id}.platform_fee_cents == 130"
            - "Donation.${d2_id}.platform_fee_cents == 130"
            - "Campaign.${camp_id}.funds_raised_cents == 6645"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: petition_moderation_revision_cycle
        grounds:
          - state_machines.Petition.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Petition.CHANGES_REQUESTED_to_UNDER_REVIEW
          - entities.Petition.fields.status
        distinguishing_aspect: "Cyclic shape on the Petition entity: CHANGES_REQUESTED -> UNDER_REVIEW re-enters a state already visited, so after request-changes then resubmit the petition returns to UNDER_REVIEW (a true loop, not a linear pipeline)."
        test_recipe:
          setup:
            - "Petition with ACTIVE target, submitted to UNDER_REVIEW, then moderator REQUEST_CHANGES -> CHANGES_REQUESTED."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth5@x.com", full_name: "A5", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Loop", summary: "s", body: "b", category: "EDUCATION", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Dean", title: "Dean", office: "Uni", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "REQUEST_CHANGES" }, as: Moderator }
          trigger:
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}", captures: { st: "$.data.status" } }
          assert:
            - "Petition.${pet_id}.status == UNDER_REVIEW"

      - name: comment_flag_dismiss_branch_return
        grounds:
          - state_machines.Comment.APPROVED_to_FLAGGED
          - state_machines.Comment.FLAGGED_to_APPROVED
          - state_machines.Comment.FLAGGED_to_REMOVED
          - entities.Petition.fields.approved_comment_count
        distinguishing_aspect: "Branching-with-return on the Comment entity (distinct from Petition): from FLAGGED the two branches DISMISS->APPROVED and REMOVE->REMOVED carry divergent side effects — DISMISS restores approved_comment_count to 1, REMOVE would leave it at 0."
        test_recipe:
          setup:
            - "PUBLISHED petition; a COMMENT posted, APPROVED (count=1), then FLAGGED (count=0)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth6@x.com", full_name: "A6", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Cmt", summary: "s", body: "b", category: "HEALTH", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Sec", title: "Secretary", office: "Health", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "cmtr@x.com", full_name: "C", jurisdiction: "US-CA-12" }, as: Guest, captures: { cmtr_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/comments", payload: { body: "great" }, as: Member, as_user_id: "${cmtr_id}", captures: { cmt_id: "$.data.id" } }
            - { call: "POST /comments/${cmt_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /comments/${cmt_id}/flag", payload: {}, as: Member, as_user_id: "${cmtr_id}" }
          trigger:
            - { call: "POST /comments/${cmt_id}/moderate", payload: { decision: "DISMISS" }, as: Moderator, captures: { st: "$.data.status" } }
          assert:
            - "Comment.${cmt_id}.status == APPROVED"
            - "Petition.${pet_id}.approved_comment_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_closure_refund_chain_depth3
        grounds:
          - state_machines.Petition.PUBLISHED_to_CLOSED_WITHDRAWN
          - state_machines.Campaign.ACTIVE_to_CLOSED
          - state_machines.Donation.PENDING_to_REFUNDED
          - entities.Campaign.fields.funds_raised_cents
        distinguishing_aspect: "Depth-3 chain from petition close: link1 Petition->CLOSED_WITHDRAWN closes the Campaign, link2 Campaign->CLOSED refunds each PENDING donation, link3 each refund recomputes funds_raised_cents — the SETTLED donation is untouched so funds stay 9680 while the pending one becomes REFUNDED."
        test_recipe:
          setup:
            - "PUBLISHED petition with a Campaign; donation D1 (10000) SETTLED (funds 9680), donation D2 (5000) PENDING."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth7@x.com", full_name: "A7", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Cascade", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Rep", title: "Rep", office: "House", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /petitions/${pet_id}/campaign", payload: { goal_cents: 100000 }, as: Member, as_user_id: "${author_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /users", payload: { email: "donor3@x.com", full_name: "D3", jurisdiction: "US-CA-12" }, as: Guest, captures: { donor_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 10000 }, as: Member, as_user_id: "${donor_id}", captures: { d1_id: "$.data.id" } }
            - { call: "POST /donations/${d1_id}/transition", payload: { to_status: "SETTLED" }, as: Admin }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${donor_id}", captures: { d2_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/close", payload: { outcome: "WITHDRAWN" }, as: Member, as_user_id: "${author_id}", captures: { pst: "$.data.status" } }
          assert:
            - "Petition.${pet_id}.status == CLOSED_WITHDRAWN"
            - "Campaign.${camp_id}.status == CLOSED"
            - "Donation.${d2_id}.status == REFUNDED"
            - "Donation.${d1_id}.status == SETTLED"
            - "Campaign.${camp_id}.funds_raised_cents == 9680"

      - name: target_deactivation_cancels_meetings_depth2
        grounds:
          - state_machines.Target.ACTIVE_to_UNREACHABLE
          - state_machines.DeliveryMeeting.REQUESTED_to_CANCELLED
          - entities.DeliveryMeeting.fields.status
        distinguishing_aspect: "Depth-2 chain from a different trigger (target deactivation, not petition close): link1 Target->UNREACHABLE, link2 that mutation cancels each non-terminal DeliveryMeeting for the target (REQUESTED->CANCELLED)."
        test_recipe:
          setup:
            - "Petition with an ACTIVE target and one REQUESTED delivery meeting on that target."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth8@x.com", full_name: "A8", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Deliver", summary: "s", body: "b", category: "POLITICS", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "Senator", title: "Senator", office: "Senate", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /delivery-meetings", payload: { petition_id: "${pet_id}", target_id: "${target_id}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { meet_id: "$.data.id" } }
          trigger:
            - { call: "POST /targets/${target_id}/deactivate", payload: {}, as: Admin, captures: { tst: "$.data.status" } }
          assert:
            - "Target.${target_id}.status == UNREACHABLE"
            - "DeliveryMeeting.${meet_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_duplicate_on_sign
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors[ERR_PETITION_NOT_PUBLISHED]
          - errors[ERR_DUPLICATE_SIGNATURE]
        distinguishing_aspect: "Category pair state(prio 8, ERR_PETITION_NOT_PUBLISHED) vs business_constraint(prio 16, ERR_DUPLICATE_SIGNATURE): a signer who already holds a PENDING signature signs again after the petition was REMOVED — both checks fail, the lower-priority state error wins."
        test_recipe:
          setup:
            - "Petition was PUBLISHED; signer S signed (PENDING). Moderator then REMOVED the petition (status REMOVED), leaving S's signature non-terminal."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "auth9@x.com", full_name: "A9", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Prio", summary: "s", body: "b", category: "OTHER", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "sigS@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "REMOVE" }, as: Moderator }
          trigger:
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PETITION_NOT_PUBLISHED"
            - "HTTP status == 409"

      - name: safety_beats_slot_capacity_on_promote
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_PETITION_NOT_PROMOTABLE]
          - errors[ERR_PROMO_SLOT_UNAVAILABLE]
        distinguishing_aspect: "Category pair business_safety(prio 9, ERR_PETITION_NOT_PROMOTABLE) vs business_temporal(prio 14, ERR_PROMO_SLOT_UNAVAILABLE): promoting a DRAFT petition into an ENVIRONMENT window already holding 2 overlapping promotions fails both, and the safety error wins."
        test_recipe:
          setup:
            - "ENVIRONMENT category has 2 overlapping SCHEDULED promotions (from PUBLISHED petitions B and C), filling capacity 2 for the window around 2026-04-03."
            - "Petition D is DRAFT ENVIRONMENT (not promotable)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "pauth@x.com", full_name: "PA", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "B", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petB_id: "$.data.id", petB_v: "$.data.version" } }
            - { call: "POST /petitions/${petB_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${petB_v}" }, as: Member, as_user_id: "${author_id}", captures: { tB_id: "$.data.id" } }
            - { call: "POST /petitions/${petB_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${petB_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /promotions", payload: { petition_id: "${petB_id}", placement_tier: "STANDARD", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-05T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promoB_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "C", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petC_id: "$.data.id", petC_v: "$.data.version" } }
            - { call: "POST /petitions/${petC_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${petC_v}" }, as: Member, as_user_id: "${author_id}", captures: { tC_id: "$.data.id" } }
            - { call: "POST /petitions/${petC_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${petC_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /promotions", payload: { petition_id: "${petC_id}", placement_tier: "STANDARD", window_start: "2026-04-02T00:00:00Z", window_end: "2026-04-06T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promoC_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "D", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petD_id: "$.data.id" } }
          trigger:
            - { call: "POST /promotions", payload: { petition_id: "${petD_id}", placement_tier: "STANDARD", window_start: "2026-04-03T00:00:00Z", window_end: "2026-04-04T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PETITION_NOT_PROMOTABLE"
            - "HTTP status == 403"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: goal_reached_ge_boundary_on_verify
        grounds:
          - calculations.milestone_ladder
          - entities.Petition.fields.goal_reached
          - entities.Petition.fields.verified_signature_count
          - state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: ">= boundary on verified_signature_count vs goal (metric: signature count, endpoint: verify): at 2 verified (goal 3) goal_reached is false; the verify that brings it to exactly 3 flips goal_reached to true."
        test_recipe:
          setup:
            - "PUBLISHED petition goal=3 (ladder [2,3]); two signers already VERIFIED (verified_signature_count==2, goal_reached==false); a third signer holds a PENDING signature ready to verify."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ba@x.com", full_name: "BA", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Goal3", summary: "s", body: "b", category: "OTHER", goal: 3 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "s1@x.com", full_name: "S1", jurisdiction: "US-CA-12" }, as: Guest, captures: { s1_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${s1_id}", captures: { sig1_id: "$.data.id", tok1: "$.data.verification_token" } }
            - { call: "POST /signatures/${sig1_id}/verify", payload: { verification_token: "${tok1}" }, as: Member, as_user_id: "${s1_id}" }
            - { call: "POST /users", payload: { email: "s2@x.com", full_name: "S2", jurisdiction: "US-CA-12" }, as: Guest, captures: { s2_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${s2_id}", captures: { sig2_id: "$.data.id", tok2: "$.data.verification_token" } }
            - { call: "POST /signatures/${sig2_id}/verify", payload: { verification_token: "${tok2}" }, as: Member, as_user_id: "${s2_id}" }
            - { call: "POST /users", payload: { email: "s3@x.com", full_name: "S3", jurisdiction: "US-CA-12" }, as: Guest, captures: { s3_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${s3_id}", captures: { sig3_id: "$.data.id", tok3: "$.data.verification_token" } }
          trigger:
            - { call: "POST /signatures/${sig3_id}/verify", payload: { verification_token: "${tok3}" }, as: Member, as_user_id: "${s3_id}" }
          assert:
            - "Petition.${pet_id}.verified_signature_count == 3"
            - "Petition.${pet_id}.goal_reached == true"
            - "Petition.${pet_id}.milestones_reached == [2, 3]"

      - name: victory_requires_nonempty_delivery_boundary
        grounds:
          - validations[priority=17]
          - errors[ERR_NO_DELIVERY]
          - entities.Petition.fields.delivered_meeting_count
          - state_machines.Petition.PUBLISHED_to_CLOSED_VICTORY
        distinguishing_aspect: "Empty-collection boundary (metric: delivered_meeting_count==0, endpoint: close) distinct from the numeric goal threshold: with 1 verified signature but zero DELIVERED meetings, VICTORY closure is rejected with ERR_NO_DELIVERY."
        test_recipe:
          setup:
            - "PUBLISHED petition with exactly 1 VERIFIED signature and delivered_meeting_count == 0 (no delivered meeting)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "bb@x.com", full_name: "BB", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Vic", summary: "s", body: "b", category: "OTHER", goal: 1 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "vs@x.com", full_name: "VS", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id", tok: "$.data.verification_token" } }
            - { call: "POST /signatures/${sig_id}/verify", payload: { verification_token: "${tok}" }, as: Member, as_user_id: "${signer_id}" }
          trigger:
            - { call: "POST /petitions/${pet_id}/close", payload: { outcome: "VICTORY" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_DELIVERY"
            - "HTTP status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sign_requires_petition_published
        grounds:
          - state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED
          - validations[priority=8]
          - entities.Petition.fields.status
          - errors[ERR_PETITION_NOT_PUBLISHED]
        distinguishing_aspect: "Entity pair Signature x Petition: creating a Signature is gated on the parent Petition.status == PUBLISHED — an UNDER_REVIEW petition rejects the sign attempt with ERR_PETITION_NOT_PUBLISHED."
        test_recipe:
          setup:
            - "Petition with ACTIVE target, submitted (status UNDER_REVIEW), never approved."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ce1@x.com", full_name: "CE1", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "NR", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /users", payload: { email: "ce1s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PETITION_NOT_PUBLISHED"
            - "HTTP status == 409"

      - name: schedule_delivery_requires_target_active
        grounds:
          - validations[priority=13]
          - entities.Target.fields.status
          - errors[ERR_TARGET_UNREACHABLE]
          - state_machines.Target.ACTIVE_to_UNREACHABLE
        distinguishing_aspect: "Entity pair DeliveryMeeting x Target (distinct from Signature x Petition): scheduling a DeliveryMeeting is gated on Target.status == ACTIVE — after the target is deactivated (UNREACHABLE) a new schedule attempt is rejected with ERR_TARGET_UNREACHABLE."
        test_recipe:
          setup:
            - "Petition with a target that has been deactivated to UNREACHABLE (no meetings existed at deactivation)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ce2@x.com", full_name: "CE2", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "TD", summary: "s", body: "b", category: "POLITICS", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /targets/${target_id}/deactivate", payload: {}, as: Admin }
          trigger:
            - { call: "POST /delivery-meetings", payload: { petition_id: "${pet_id}", target_id: "${target_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TARGET_UNREACHABLE"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_category_slot_aggregate_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_PROMO_SLOT_UNAVAILABLE]
          - entities.Promotion.fields.window_start
          - entities.Promotion.fields.category
        distinguishing_aspect: "Aggregate-capacity interval semantics on the Promotion/category resource: half-open [start,end) windows, reject only when >= 2 other SCHEDULED promotions in the same category already overlap — a 3rd overlapping ENVIRONMENT promotion is rejected."
        test_recipe:
          setup:
            - "ENVIRONMENT category holds 2 overlapping SCHEDULED promotions covering 2026-04-03 (from PUBLISHED petitions B and C)."
            - "A 3rd PUBLISHED ENVIRONMENT petition E is ready to promote."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "to1@x.com", full_name: "TO", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "B", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petB_id: "$.data.id", petB_v: "$.data.version" } }
            - { call: "POST /petitions/${petB_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${petB_v}" }, as: Member, as_user_id: "${author_id}", captures: { tB_id: "$.data.id" } }
            - { call: "POST /petitions/${petB_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${petB_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /promotions", payload: { petition_id: "${petB_id}", placement_tier: "STANDARD", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-05T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promoB_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "C", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petC_id: "$.data.id", petC_v: "$.data.version" } }
            - { call: "POST /petitions/${petC_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${petC_v}" }, as: Member, as_user_id: "${author_id}", captures: { tC_id: "$.data.id" } }
            - { call: "POST /petitions/${petC_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${petC_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /promotions", payload: { petition_id: "${petC_id}", placement_tier: "STANDARD", window_start: "2026-04-02T00:00:00Z", window_end: "2026-04-06T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promoC_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "E", summary: "s", body: "b", category: "ENVIRONMENT", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { petE_id: "$.data.id", petE_v: "$.data.version" } }
            - { call: "POST /petitions/${petE_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${petE_v}" }, as: Member, as_user_id: "${author_id}", captures: { tE_id: "$.data.id" } }
            - { call: "POST /petitions/${petE_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${petE_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
          trigger:
            - { call: "POST /promotions", payload: { petition_id: "${petE_id}", placement_tier: "STANDARD", window_start: "2026-04-03T00:00:00Z", window_end: "2026-04-04T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PROMO_SLOT_UNAVAILABLE"
            - "HTTP status == 409"

      - name: delivery_meeting_buffer_conflict
        grounds:
          - validations[priority=15]
          - errors[ERR_MEETING_CONFLICT]
          - entities.DeliveryMeeting.fields.window_start
          - entities.DeliveryMeeting.fields.target_id
        distinguishing_aspect: "Single-occupancy + 15-minute buffer interval semantics on the Target resource (distinct from promotion aggregate capacity): a second meeting starting 10 minutes after the first ends (gap < 15 min) is rejected with ERR_MEETING_CONFLICT."
        test_recipe:
          setup:
            - "Petition with ACTIVE target and one REQUESTED meeting 10:00-11:00 on 2026-05-01."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "to2@x.com", full_name: "TO2", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "MB", summary: "s", body: "b", category: "POLITICS", goal: 100 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /delivery-meetings", payload: { petition_id: "${pet_id}", target_id: "${target_id}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T11:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { meet1_id: "$.data.id" } }
          trigger:
            - { call: "POST /delivery-meetings", payload: { petition_id: "${pet_id}", target_id: "${target_id}", window_start: "2026-05-01T11:10:00Z", window_end: "2026-05-01T12:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_MEETING_CONFLICT"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: signature_count_conserved_on_revoke
        grounds:
          - state_machines.Signature.VERIFIED_to_REVOKED
          - state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED
          - entities.Petition.fields.verified_signature_count
          - calculations.signature_tally
        distinguishing_aspect: "Conserved quantity = signature count (integer): verify (+1) then revoke (-1) leaves verified_signature_count back at 0, so it still equals COUNT(Signature status=VERIFIED)=0 with no drift."
        test_recipe:
          setup:
            - "PUBLISHED petition; one signer VERIFIED (verified_signature_count==1)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ci1@x.com", full_name: "CI1", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Rev", summary: "s", body: "b", category: "OTHER", goal: 5 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "ci1s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id", tok: "$.data.verification_token" } }
            - { call: "POST /signatures/${sig_id}/verify", payload: { verification_token: "${tok}" }, as: Member, as_user_id: "${signer_id}" }
          trigger:
            - { call: "POST /signatures/${sig_id}/revoke", payload: { reason: "fraud" }, as: Moderator, captures: { sst: "$.data.status" } }
          assert:
            - "Signature.${sig_id}.status == REVOKED"
            - "Petition.${pet_id}.verified_signature_count == 0"
            - "Petition.${pet_id}.goal_reached == false"

      - name: campaign_funds_conserved_on_refund
        grounds:
          - state_machines.Donation.SETTLED_to_REFUNDED
          - state_machines.Donation.PENDING_to_SETTLED
          - entities.Campaign.fields.funds_raised_cents
          - calculations.donation_fee_split
        distinguishing_aspect: "Conserved quantity = money (cents), distinct from signature count: settling a 5000 donation raises funds_raised_cents by net 4825, and refunding it decreases funds_raised_cents by exactly 4825 back to 0 (no drift)."
        test_recipe:
          setup:
            - "Campaign ACTIVE with one donation 5000 SETTLED (funds_raised_cents==4825)."
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ci2@x.com", full_name: "CI2", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Rf", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/campaign", payload: { goal_cents: 50000 }, as: Member, as_user_id: "${author_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /users", payload: { email: "ci2d@x.com", full_name: "D", jurisdiction: "US-CA-12" }, as: Guest, captures: { donor_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${donor_id}", captures: { don_id: "$.data.id" } }
            - { call: "POST /donations/${don_id}/transition", payload: { to_status: "SETTLED" }, as: Admin }
          trigger:
            - { call: "POST /donations/${don_id}/transition", payload: { to_status: "REFUNDED" }, as: Admin, captures: { dst: "$.data.status" } }
          assert:
            - "Donation.${don_id}.status == REFUNDED"
            - "Campaign.${camp_id}.funds_raised_cents == 0"
