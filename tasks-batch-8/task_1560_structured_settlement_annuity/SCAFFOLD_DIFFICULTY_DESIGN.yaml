            - "tracked sum after finalize: ${t1_paid} + ${t1_out} + ${t1_esch} == 0 + 90000 + 80000 == 170000 (conserved across the sweep)"
            - "reclaim: ${p1_reclaimed} == PAYABLE"
            - "tracked sum after reclaim: ${t2_paid} + ${t2_out} + ${t2_esch} == 0 + 170000 + 0 == 170000 (compensating action restores exactly)"
