      - name: block_reference_guards_reject_unallocated_and_foreign_blocks
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_41
          - validations.priority_43
          - errors[ERR_BLOCK_NOT_ALLOCATED]
          - errors[ERR_BLOCK_GROWER_MISMATCH]
        distinguishing_aspect: |
          Two different referential guards on the same field: a block that exists and belongs
          to the right producer but was never allocated to THIS contract (409 NOT_ALLOCATED),
          versus a block that belongs to a different producer or is RETIRED (409
          GROWER_MISMATCH). Both must be distinguished from the 404 that an unknown block id
          returns, which is the mistake an implementation makes when it collapses the checks.
        test_recipe:
          setup:
            - "Producer A with an allocated block B-12 and an unallocated block B-13 plus a RETIRED block B-99; producer B with block BX-1. One ACTIVE contract for producer A."
