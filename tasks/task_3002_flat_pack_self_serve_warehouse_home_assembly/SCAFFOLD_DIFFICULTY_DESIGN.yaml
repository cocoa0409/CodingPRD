              payload: { carton_seq: 1, aisle: "FS", bin: "40", weight_kg: 40, volume_m3: 0.8 }
              as: PlatformAdmin
              captures: { c40: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c40}", on_hand: 2 }
              as: StoreOps
            - call: "POST /api/articles"
