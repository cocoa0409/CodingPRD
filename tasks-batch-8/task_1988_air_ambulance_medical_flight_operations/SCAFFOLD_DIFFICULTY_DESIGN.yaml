# =============================================================================
# Task 1988 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x instances; every setup chain drives empty-DB -> precondition state
# using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_totals
        grounds:
          - calculations.mission_transport_charge
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.final_total_cents
        distinguishing_aspect: |
          Billing-domain dual variant: the SAME mission (est 100 mi, ALS tier,
          one ground leg) bills 4089352 cents under the provisional variant
          (padded miles ceil(100*1.15)=115, SCHEDULED leg included) but
          3679842 cents under the final variant (actual 92 mi, COMPLETED legs
          only) — two valid algorithms, two different totals on one Invoice.
        test_recipe:
          setup:
            - "Base with a CCT_CAPABLE ROTOR_WING aircraft, PILOT + NURSE crew, ALS-tier EMERGENCY_INTERFACILITY request accepted into a PLANNING mission (est 100 loaded miles), one DESTINATION ground leg SCHEDULED, invoice created while mission is PLANNING"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Alpha", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N911AM", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 100, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 180 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "${m_id}", leg_type: "DESTINATION", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T09:00:00Z", estimated_ground_miles: 12 }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /air-ambulance/invoices", payload: { mission_id: "${m_id}" }, as: BillingSpecialist, captures: { inv_id: "$.data.id", prov_total: "$.data.provisional_total_cents" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "PUT /air-ambulance/ground-legs/${leg_id}", payload: { status: "ENROUTE" }, as: Dispatcher }
            - { call: "PUT /air-ambulance/ground-legs/${leg_id}", payload: { status: "AT_BEDSIDE" }, as: Dispatcher }
            - { call: "PUT /air-ambulance/ground-legs/${leg_id}", payload: { status: "COMPLETED" }, as: Dispatcher }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
          trigger:
            - { call: "POST /air-ambulance/invoices/${inv_id}/finalize", payload: { actual_loaded_miles: 92 }, as: BillingSpecialist }
          assert:
            - "Invoice.${inv_id}.provisional_total_cents == 4089352 (base 1800000 + mileage 1840000 + fuel 128800 + acuity 120000 = subtotal 3888800 >= 2500000 -> logistics 155552 + ground 45000)"
            - "Invoice.${inv_id}.final_total_cents == 3679842 (base 1800000 + mileage 1472000 + fuel 103040 + acuity 120000 = subtotal 3495040 -> logistics 139802 + ground 45000)"
            - "Invoice.${inv_id}.provisional_total_cents != Invoice.${inv_id}.final_total_cents"
            - "Invoice.${inv_id}.claim_status == FINALIZED"

      - name: acuity_triage_vs_acceptance_score_divergence
        grounds:
          - calculations.patient_acuity_score
          - entities.MissionRequest.fields.triage_acuity_score
          - entities.MissionRequest.fields.acceptance_acuity_score
        distinguishing_aspect: |
          Clinical-domain dual variant (different entity domain from
          invoice_provisional_vs_final_totals): identical subscales 8/6/5/3
          score 5.80 under the triage weights {0.30,0.30,0.20,0.20} but 7.80
          under the acceptance weights {0.25,0.35,0.25,0.15} plus the 2.0
          deterioration bonus (onset 60 min < 120 min window) — the variant
          choice flips acuity_tier from ALS to CCT.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a patient; a mission request with reported subscales 8/6/5/3 and onset 60 minutes before logical now"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Amy Acute", date_of_birth: "1975-11-02", weight_kg: 65 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Mile 42 I-10", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T23:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id", triage_score: "$.data.triage_acuity_score" } }
          trigger:
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
          assert:
            - "MissionRequest.${req_id}.triage_acuity_score == 5.8 (8*.30+6*.30+5*.20+3*.20, no bonus)"
            - "MissionRequest.${req_id}.acceptance_acuity_score == 7.8 (8*.25+6*.35+5*.25+3*.15 = 5.8, + 2.0 deterioration bonus)"
            - "MissionRequest.${req_id}.acuity_tier == CCT (7.8 >= 7.0) while the triage variant alone would map 5.8 to ALS"

      - name: duty_window_rolling_vs_calendar_day
        grounds:
          - calculations.crew_duty_fatigue_window
          - entities.CrewMember.fields.duty_minutes_calendar_day
        distinguishing_aspect: |
          Crew-fatigue-domain dual variant (third distinct entity domain): a
          closed 720-minute shift crossing midnight (20:00-08:00) reports
          duty_minutes_calendar_day == 480 on the next UTC date, while the
          rolling-24h gate counts the full 720 minutes and rejects a 240-min
          follow-up shift (720+240=960 > 840) — same shift history, two valid
          accounting methods, two different numbers.
        test_recipe:
          setup:
            - "Clock 2026-08-01T20:00:00Z; base with one PILOT; shift planned 2026-08-01T20:00:00Z -> 2026-08-02T08:00:00Z created, then closed at clock 2026-08-02T08:00:00Z"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T20:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Beta", region: "NW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Chris Cross", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T20:00:00Z", planned_end_iso: "2026-08-02T08:00:00Z" }, as: OpsAdmin, captures: { shift1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: OpsAdmin }
            - { call: "PUT /air-ambulance/crew-shifts/${shift1_id}", payload: { status: "CLOSED" }, as: OpsAdmin }
            - { call: "GET /air-ambulance/crew-members/${pilot_id}", as: OpsAdmin, captures: { cal_minutes: "$.data.duty_minutes_calendar_day" } }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-02T10:30:00Z", planned_end_iso: "2026-08-02T14:30:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUTY_LIMIT_EXCEEDED (rolling window [2026-08-01T14:30, 2026-08-02T14:30] counts all 720 minutes of shift1 + 240 candidate = 960 > 840)"
            - "cal_minutes == 480 (calendar-day variant counts only 2026-08-02 00:00-08:00) — the calendar variant would report 480 while the rolling gate computed 960"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: weather_decision_matrix_multifactor
        grounds:
          - calculations.weather_minimums_decision
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the decision
          branches on aircraft_class x day_night lookup, adds a conditional
          terrain bonus, then applies a nested 1.2x ceiling factor and a +0.5
          visibility pad for the MARGINAL band; ceiling 590 (just under
          500*1.2=600) yields MARGINAL while 600/1.5/20kt yields GO.
        test_recipe:
          setup:
            - "PLANNING mission on a ROTOR_WING aircraft (accepted ALS request, pilot + nurse assigned)"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Gamma", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N222WX", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 60, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 590, visibility_sm: 1.2, wind_kt: 21, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d1: "$.data.decision" } }
            - { call: "GET /air-ambulance/missions/${m_id}", as: Dispatcher, captures: { m_v2: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 600, visibility_sm: 1.5, wind_kt: 20, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v2}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d2: "$.data.decision" } }
          assert:
            - "d1 == MARGINAL (ceiling 590 < 500*1.2=600 marginal band; wind 21 > 25-5=20 also marginal)"
            - "d2 == GO (600 !< 600 strictly-less band fails; 1.5 !< 1.0+0.5; 20 !> 20)"
            - "Mission.${m_id}.last_weather_decision == GO after the second assessment"

      - name: invoice_rounding_order_per_line_then_sum
        grounds:
          - calculations.invoice_aggregation_rounding
          - entities.Invoice.fields.fuel_line_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode from
          weather_decision_matrix_multifactor): actual 16.6666 ROTOR miles
          rounds the mileage line to 266666 FIRST, then computes fuel as
          round(266666*0.07)=18667, total 2085333; the forbidden sum-then-
          round order yields 2085332 — a one-cent falsifiable difference.
        test_recipe:
          setup:
            - "BLS-tier EMERGENCY_INTERFACILITY mission flown to COMPLETED on a ROTOR_WING aircraft; no ground legs; invoice in DRAFT"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Delta", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N333BL", aircraft_class: "ROTOR_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Bill Stable", date_of_birth: "1990-01-01", weight_kg: 90 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 10, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 90 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/invoices", payload: { mission_id: "${m_id}" }, as: BillingSpecialist, captures: { inv_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/invoices/${inv_id}/finalize", payload: { actual_loaded_miles: 16.6666 }, as: BillingSpecialist }
          assert:
            - "Invoice.${inv_id}.mileage_line_cents == 266666 (round_half_up(16.6666*16000) = round_half_up(266665.6))"
            - "Invoice.${inv_id}.fuel_line_cents == 18667 (round_half_up(266666*0.07) = round_half_up(18666.62), computed from the ROUNDED mileage line)"
            - "Invoice.${inv_id}.logistics_line_cents == 0 (subtotal 2085333 < 2500000)"
            - "Invoice.${inv_id}.final_total_cents == 2085333 (sum-then-round order would yield 2085332)"

      - name: logistics_surcharge_subtotal_tier_order
        grounds:
          - calculations.logistics_surcharge_tier
          - entities.Invoice.fields.logistics_line_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order
          (third distinct mode): the logistics tier is keyed on the
          PRE-LOGISTICS subtotal, never the post-surcharge total; a subtotal
          of exactly 2450000 (< 2500000) produces logistics 0 and total
          2450000, whereas an implementation keying on the would-be total
          (2450000*1.04 = 2548000 >= 2500000) wrongly adds 98000.
        test_recipe:
          setup:
            - "BLS-tier EMERGENCY_INTERFACILITY mission flown to COMPLETED on a ROTOR_WING aircraft; no ground legs; invoice in DRAFT"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Epsilon", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N444LG", aircraft_class: "ROTOR_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Laura Long", date_of_birth: "1988-06-30", weight_kg: 70 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 33, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
