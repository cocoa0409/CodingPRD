            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Legacy House", address_line: "11 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: true }
              as: MembershipChair
              captures: { h_leg_id: $.data.id }
            - call: "POST /swim-club/households"
