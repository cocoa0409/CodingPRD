      - name: dealer_b_cannot_submit_dealer_a_order
        claim_type: ownership_denial
        grounds: ["roles[Dealer]", "validations[priority=3]", "errors[ERR_RESOURCE_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Entity-backed identity: Dealer B's X-User-ID != order.dealer_id -> ERR_RESOURCE_OWNERSHIP_MISMATCH (403), proving ownership compares against the persisted Dealer id."
        test_recipe:
          setup: ["Dealers A and B; order owned by A with one BOX line"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer A", dealer_code: "DA", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { da_id: $.data.id }
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer B", dealer_code: "DB", price_level: "L1", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { db_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${da_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${da_id}
          trigger:
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${db_id}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESOURCE_OWNERSHIP_MISMATCH, http 403; order stays DRAFT"

      - name: planner_cannot_dispatch_route
        claim_type: role_denial
        grounds: ["roles[ShippingCoordinator]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Dispatch is ShippingCoordinator-exclusive; ProductionPlanner gets ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["PLANNED route"]
          setup_api_calls:
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-R", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
          trigger:
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"

      - name: plant_admin_cannot_create_order
        claim_type: role_denial
        grounds: ["roles[Dealer]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Order creation is Dealer-exclusive (peer roles, no hierarchical override); PlantAdmin gets ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/orders"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-assign-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "After a successful assign bumps Order.version, a second assign carrying the previously observed version is rejected 412 ERR_STALE_ORDER_VERSION — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["Dealer L1; finish; SUBMITTED BOX order (cube 5.0); routes R1, R2 PLANNED"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L1", dealer_code: "DL1", price_level: "L1", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-1", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-2", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { r2_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${r1_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
          trigger:
            - call: "POST /kcma/delivery-routes/${r2_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_ORDER_VERSION, http 412 (version advanced by the first assign)"
            - "order remains on R1: R1.reserved_cu_ft == 5.0, R2.reserved_cu_ft == 0.0"

      - name: occ_current_version_accepted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-assign-stale-order]"]
        excluded_because:
          difficulty_instance: route_cube_conserved_under_reassignment
          rationale: "Every successful assign-order in §1.8 passes a freshly captured version — the positive OCC path."

      - name: receipt_recovers_overdraft_releases_hold
        claim_type: derived_field_reconciliation
        grounds: [calculations.component_availability, state_machines.OrderHold.PLACED_to_RELEASED]
        distinguishing_aspect: "Derived-field reconciliation: receipt of 10 sheets lifts available_qty from -8 to 2 (>= 0), which auto-RELEASES the shortage hold and flips order.hold_status back to NONE in the same request's side effects."
        test_recipe:
          setup:
            - "Component 96x48 on_hand 0; SUBMITTED door order (line 30x20 qty 50 -> sheets 8)"
            - "run released -> available -8, hold PLACED shortfall 8, order ON_HOLD"
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L3", dealer_code: "DL3", price_level: "L3", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SLAB", name: "Slab", construction: "SLAB", base_list_price_cents: 15000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-ZERO", color_name: "Natural", sheen: "MATTE", upcharge_pct: 0.0, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/components"
              payload: { sku: "PLY-48X96", description: "Plywood sheet", kind: "SHEET_GOODS", sheet_width_in: 96, sheet_height_in: 48, on_hand_qty: 0 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 30, height_in: 20, depth_in: 1, qty: 50, unit_list_price_cents: 15000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/nesting-stations"
              payload: { station_code: "ST-1", changeover_minutes: 0 }
              as: PlantAdmin
              captures: { st_id: $.data.id }
            - call: "POST /kcma/nesting-runs"
              payload: { station_id: "${st_id}", sheet_component_id: "${c_id}", door_line_ids: ["${ol_id}"], scheduled_date: "2026-05-02", start_minute: 60, end_minute: 240 }
              as: ProductionPlanner
              captures: { nr_id: $.data.id }
            - call: "POST /kcma/nesting-runs/${nr_id}/release"
              as: ProductionPlanner
          trigger:
            - call: "POST /kcma/components/${c_id}/receipts"
              payload: { qty: 10 }
              as: ProductionPlanner
              captures: { c_avail: $.data.available_qty, c_onhand: $.data.on_hand_qty }
            - call: "GET /kcma/orders/${o_id}"
              as: ProductionPlanner
              captures: { o_hold: $.data.hold_status }
            - call: "GET /kcma/orders/${o_id}/holds"
              as: ProductionPlanner
              captures: { h_status: "$.data[0].status" }
          assert:
            - "Component.${c_id}.on_hand_qty == 10, reserved_qty == 8, available_qty == 2"
            - "OrderHold[0].status == RELEASED (auto-release on recovery to >= 0)"
            - "Order.${o_id}.hold_status == NONE"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: nesting_release_shortage_hold_cascade
          rationale: "§1.8 covers the depth-4 release cascade; batch_qc_fail_unassign_hold_cascade covers the second pattern."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: order_pricing_provisional_vs_final_variant
          rationale: "§1.8 covers both dual-variant domains (order pricing, claim credit)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: submit_response_contains_computed_totals_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /kcma/orders/{orderId}/submit]"]
        distinguishing_aspect: "Immediate consistency: the submit 200 response itself carries the computed provisional totals (1,430,000 = round(2,200,000 x 0.65)) — no re-read or delay required."
        test_recipe:
          setup: ["Dealer L2 (0.65) credit high; DRAFT order with BOX line unit 200,000 qty 10 on finish upcharge 0.10 (list 2,000,000 + upcharge 200,000)"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L2", dealer_code: "DL2", price_level: "L2", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 10, unit_list_price_cents: 200000 }
              as: Dealer
              as_user_id: ${d_id}
          trigger:
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_status: $.data.status, o_merch: $.data.provisional_merchandise_cents, o_total: $.data.provisional_total_cents, o_subat: $.data.submitted_at }
          assert:
            - "submit response: status == SUBMITTED"
            - "submit response: provisional_merchandise_cents == 1430000 and provisional_total_cents == 1430000"
            - "submit response: submitted_at == 2026-05-01T00:00:00Z (logical clock default)"

      - name: dispatch_side_effects_visible_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: order_pricing_provisional_vs_final_variant
          rationale: "§1.8 instance reads final pricing via GET immediately after dispatch — the immediate-visibility claim."
