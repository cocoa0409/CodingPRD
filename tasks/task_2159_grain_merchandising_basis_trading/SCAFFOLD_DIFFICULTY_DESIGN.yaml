          setup:
            - "Desk, rail-served elevator, SHORT 2026-12 hedge with 10 lots at 448 and an ACTIVE basis -32 bid."
            - "One 20,000-bushel CASH contract and one 60-car fleet homed at the elevator."
            - "One REQUESTED booking occupying 2026-11-05T00:00:00Z through release 2026-11-07T00:00:00Z, so occupancy_end_at is 2026-11-09T00:00:00Z."
