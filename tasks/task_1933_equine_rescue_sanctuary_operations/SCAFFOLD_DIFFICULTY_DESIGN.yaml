  - rule_id: boundary_precision_check
    instances:
      - name: quarantine_clearance_exam_exactly_48h
        grounds:
          - calculations.quarantine_release_timing
          - validations[priority=18]
        distinguishing_aspect: |
          Metric: exam age in hours, endpoint POST /quarantine-protocols/{id}/clear.
          A MEDICAL evaluation completed exactly 48h before the clear instant
          (evaluation_date == now - 48h, inclusive boundary) permits clearance;
          combined here with now == start + min_days (equality) also passing.
        test_recipe:
          setup:
            - "Horse H in QUARANTINE (start 2026-08-01T00:00:00Z, min_days 14, no extensions, no fever logs)"
            - "MEDICAL evaluation COMPLETED with evaluation_date 2026-08-13T00:00:00Z"
            - "clock at 2026-08-15T00:00:00Z: exam age exactly 48h; quarantine age exactly 14 days"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-13T00:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
          trigger:
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}", captures: { q_status: $.data.status, q_cleared_at: $.data.cleared_at } }
          assert:
            - "q_status == CLEARED at the exact 48h exam-age boundary (inclusive) and exact 14-day release boundary"
            - "q_cleared_at == 2026-08-15T00:00:00Z"

      - name: care_plan_funding_exactly_at_monthly_cost
        grounds:
          - entities.SanctuaryCarePlan.fields.funding_status
          - entities.SanctuaryCarePlan.fields.funding_coverage_cents
        distinguishing_aspect: |
          Metric: coverage in integer cents, endpoint POST
          /sponsorships/{id}/activate. 20000 + 18499 = 38499 (one cent below
          38500) stays PARTIALLY_FUNDED; cancelling the 18499 pledge and
          activating an 18500 pledge lands coverage exactly at 38500 ==
          monthly_cost_cents and flips funding_status to FUNDED (>= boundary).
        test_recipe:
          setup:
            - "Horse H in SANCTUARY; APPROVED STRAIGHT_LINE care plan (monthly_cost_cents=38500)"
            - "S1 20000 ACTIVE; S2 18499 ACTIVE (below-boundary probe); S2 then cancelled; S3 18500 PLEDGED"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 10, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses/${h}/designate-sanctuary", payload: { reason: "permanent resident" }, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_v: $.data.version } }
            - { call: "POST /rescue-ops/sanctuary-care-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v}", variant: STRAIGHT_LINE }, as: SanctuaryDirector, captures: { plan: $.data.id } }
            - { call: "POST /rescue-ops/sanctuary-care-plans/${plan}/approve", payload: {}, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP1", contact_email: "s1@x.com" }, as: Sponsor, captures: { sp1: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp1}", horse_id: "${h}", monthly_pledge_cents: 20000 }, as: Sponsor, as_user_id: "${sp1}", captures: { s1: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships/${s1}/activate", payload: {}, as: Sponsor, as_user_id: "${sp1}" }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP2", contact_email: "s2@x.com" }, as: Sponsor, captures: { sp2: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp2}", horse_id: "${h}", monthly_pledge_cents: 18499 }, as: Sponsor, as_user_id: "${sp2}", captures: { s2: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships/${s2}/activate", payload: {}, as: Sponsor, as_user_id: "${sp2}" }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov_below: $.data.funding_coverage_cents, fs_below: $.data.funding_status } }
            - { call: "POST /rescue-ops/sponsorships/${s2}/cancel", payload: {}, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp2}", horse_id: "${h}", monthly_pledge_cents: 18500 }, as: Sponsor, as_user_id: "${sp2}", captures: { s3: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/sponsorships/${s3}/activate", payload: {}, as: Sponsor, as_user_id: "${sp2}" }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov_eq: $.data.funding_coverage_cents, fs_eq: $.data.funding_status } }
          assert:
            - "cov_below == 38499 AND fs_below == PARTIALLY_FUNDED (one cent below monthly_cost_cents does not fund)"
            - "cov_eq == 38500 AND fs_eq == FUNDED (exact equality funds: >= boundary, metric in integer cents)"

      - name: cooling_off_exactly_72h_finalize
        grounds:
