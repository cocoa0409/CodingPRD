      - name: overage_tier_snapshot_excludes_the_reservations_own_accrual
        grounds:
          - calculations.entitlement_split
          - calculations.reservation_charge_money
          - state_machines.Reservation.OFFERED_to_CONFIRMED
          - state_machines.Reservation.IN_SERVICE_to_COMPLETED
          - entities.Employer.fields.accrued_overage_cents_current_period
          - entities.Reservation.fields.overage_tier_multiplier
          - validations[priority=715]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by a pinned evaluation order:
          overage_tier_multiplier is selected from Employer.accrued_overage_cents_current_period,
          which is itself grown by overage_cents computed FROM that multiplier; step 6 of
          entitlement_split reads the accrual BEFORE this reservation's own OVERAGE_ACCRUE entry, so
