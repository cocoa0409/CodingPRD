      - name: rollback_cooldown_one_sided_strict_buffer
        grounds:
          - calculations.rollout_window_exclusivity
          - constants.ROLLBACK_COOLDOWN_HOURS
          - state_machines.RolloutPlan.PHASE_ACTIVE_to_ROLLED_BACK
          - state_machines.AppRecord.distribution_state.PHASED_ROLLOUT_to_ROLLED_BACK
          - entities.RolloutPlan.fields.terminated_at
          - entities.AppRecord.fields.rollback_count
          - errors.ERR_ROLLOUT_WINDOW_CONFLICT
        distinguishing_aspect: |
          For a ROLLED_BACK predecessor the interval test is REPLACED by a one-sided strict buffer:
          a plan starting 2026-08-05T11:00:00Z is refused (1h short of terminated_at 2026-08-02T12:00:00Z
          + 72h) while one starting exactly 2026-08-05T12:00:00Z is accepted even though that instant
          still lies inside the rolled-back plan's original closed interval ending 2026-08-08T00:00:00Z —
          and the very same instant becomes illegal again once a SCHEDULED plan occupies it.
