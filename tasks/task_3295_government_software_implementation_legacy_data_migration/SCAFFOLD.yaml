  - name: coverage_start_on
    type: string
    source: input
    description: ISO date; must equal SupportTransition.warranty_end_on + 1 day at activation
  - name: status
    type: enum
    source: system
    description: DRAFT | ACTIVE | SUSPENDED | LAPSED | RENEWED
  - name: renewal_index
    type: integer
    source: system
    default: 0
    description: 0 at first activation; increments on each renewal
  - name: escalated_fee_cents
    type: integer
    source: computed
    description: annual_fee_cents compounded by ESCALATOR_PCT per renewal_index, rounded once at the end
- name: AuditLogEntry
  parent: null
  common_fields: false
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id
  - name: actor_role
    type: string
    source: system
    description: X-User-Role of the mutating call
  - name: actor_id
    type: string
    source: system
    description: X-User-ID of the mutating call
  - name: action
    type: string
    source: system
    description: Endpoint + transition descriptor
  - name: entity_kind
    type: string
    source: system
  - name: entity_id
    type: string
    source: system
  - name: detail
    type: string
    source: system
    description: Before/after summary for audit
  - name: entry_hash
    type: string
    source: system
    description: SHA-256 of (previous entry_hash for this contract ++ canonical detail); empty string seeds the chain
state_machines:
- entity: ProcurementContract
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: POSTED
    trigger: POST /programs/contracts/{id}/transition (target=POSTED)
    actor: ProcurementOfficer
    preconditions:
    - contract_value_cents > 0
    side_effects:
    - append AuditLogEntry for contract
  - from: POSTED
    to: Q&A_OPEN
    trigger: POST /programs/contracts/{id}/transition (target=Q&A_OPEN)
    actor: ProcurementOfficer
    preconditions: []
    side_effects: []
  - from: Q&A_OPEN
    to: Q&A_CLOSED
    trigger: POST /programs/contracts/{id}/transition (target=Q&A_CLOSED)
    actor: ProcurementOfficer
    preconditions: []
    side_effects: []
  - from: Q&A_CLOSED
    to: EVALUATION
    trigger: POST /programs/contracts/{id}/transition (target=EVALUATION)
    actor: ProcurementOfficer
    preconditions: []
    side_effects: []
  - from: EVALUATION
    to: AWARD_PENDING
    trigger: POST /programs/contracts/{id}/transition (target=AWARD_PENDING)
    actor: ProcurementOfficer
    preconditions: []
    side_effects: []
  - from: AWARD_PENDING
    to: AWARDED
    trigger: POST /programs/contracts/{id}/award
    actor: ProcurementOfficer
    preconditions:
    - expected_contract_version matches current version (OCC)
    - vendor_name non-empty
    side_effects:
    - set awarded_at to logical clock
    - "create ContractPhase rows? no \u2014 phases are created explicitly; increment version"
    - append AuditLogEntry
  - from: EVALUATION
    to: PROTESTED
    trigger: POST /programs/contracts/{id}/transition (target=PROTESTED, note=protest_note)
    actor: ProcurementOfficer
    preconditions: []
    side_effects: []
  - from: PROTESTED
    to: EVALUATION
    trigger: POST /programs/contracts/{id}/transition (target=EVALUATION, note=resolution_note)
    actor: ProcurementOfficer
    preconditions: []
    side_effects:
    - "append AuditLogEntry (cycle back into evaluation \u2014 cyclic shape)"
  - from: AWARDED
    to: IMPLEMENTATION
    trigger: POST /programs/contracts/{id}/start-implementation
    actor: ImplementationManager
    preconditions:
    - at least one ContractPhase with status PLANNED exists
    side_effects:
    - first ContractPhase (sequence_no == 1) auto-transitions PLANNED -> ACTIVE
  - from: IMPLEMENTATION
    to: CLOSED
    trigger: POST /programs/contracts/{id}/close
    actor: ImplementationManager
    preconditions:
    - all Milestones in {PAID}
    - SupportTransition exists and status == STEADY_STATE
    - MaintenanceAgreement status == ACTIVE
    side_effects:
    - append AuditLogEntry
  - from: ANY
    to: CANCELLED
    trigger: POST /programs/contracts/{id}/cancel
    actor: ProcurementOfficer
    preconditions:
    - status not in {CLOSED, CANCELLED}
    - no Milestone in {INVOICED, PAID}
    side_effects:
    - 'cascade: all non-terminal Milestones -> REJECTED; all non-terminal ContractPhases -> CANCELLED'
- entity: Milestone
  initial_state: PLANNED
  terminal_states:
  - PAID
  transitions:
  - from: PLANNED
    to: READY_FOR_REVIEW
    trigger: POST /programs/milestones/{id}/submit
    actor: VendorProjectManager
    preconditions:
    - parent ContractPhase status == ACTIVE
    - contract status == IMPLEMENTATION
    side_effects: []
  - from: READY_FOR_REVIEW
    to: ACCEPTED
    trigger: POST /programs/milestones/{id}/accept
    actor: AgencyProjectManager
    preconditions:
    - every AcceptanceCriterion of this milestone has result in {SATISFIED, WAIVED}
    - 'segregation of duties: accepting user id != submitting user id recorded on milestone (milestone stores last_submitted_by)'
    side_effects:
    - set accepted_at to logical clock
    - compute payment via milestone_payment calculation (variant by billing_variant)
    - 'cascade hop 1: if every Milestone of the parent phase is ACCEPTED or beyond -> phase status ACTIVE -> COMPLETED'
    - 'cascade hop 2: when a phase completes, next phase (sequence_no + 1) auto-transitions PLANNED -> ACTIVE'
    - append AuditLogEntry
  - from: READY_FOR_REVIEW
    to: REJECTED
    trigger: POST /programs/milestones/{id}/reject
    actor: AgencyProjectManager
    preconditions:
    - payload rejection_note non-empty
    side_effects:
    - increment rejection_count
  - from: REJECTED
    to: READY_FOR_REVIEW
    trigger: POST /programs/milestones/{id}/resubmit
    actor: VendorProjectManager
    preconditions:
    - rejection_count < 3 (ERR_MILESTONE_REJECTION_LIMIT at 3)
    side_effects: []
  - from: ACCEPTED
    to: INVOICED
    trigger: POST /programs/milestones/{id}/invoice
    actor: VendorProjectManager
    preconditions:
    - logical clock date >= accepted_at date
    side_effects:
    - sum of INVOICED+PAID billable amounts on contract must remain <= contract_value_cents (ERR_CONTRACT_VALUE_EXCEEDED)
  - from: INVOICED
    to: PAID
    trigger: POST /programs/milestones/{id}/mark-paid
    actor: FinanceOfficer
    preconditions: []
    side_effects:
    - 'retainage release: if milestone.billing_variant == RETAINAGE_HELD and a GoLiveEvent for the contract is EXECUTED, retained portion becomes payable and is added to this payment record'
    - append AuditLogEntry
- entity: WorkflowProcess
  initial_state: DRAFT
  terminal_states:
  - APPROVED
  - RETIRED
  transitions:
  - from: DRAFT
    to: MAPPED
    trigger: POST /programs/workflow-processes/{id}/map
    actor: BusinessAnalyst
    preconditions:
    - as_is_summary and to_be_summary non-empty
    side_effects: []
  - from: MAPPED
    to: IN_REVIEW
    trigger: POST /programs/workflow-processes/{id}/submit-review
    actor: BusinessAnalyst
    preconditions: []
    side_effects: []
  - from: IN_REVIEW
    to: APPROVED
    trigger: POST /programs/workflow-processes/{id}/approve
    actor: AgencyProjectManager
    preconditions:
    - every ConfigurationDecision linked to this process has status in {RATIFIED, SUPERSEDED}
    side_effects:
    - 'cascade: GoLiveEvent.readiness_score recompute for the contract''s non-terminal GoLiveEvent'
  - from: IN_REVIEW
    to: REWORK
    trigger: POST /programs/workflow-processes/{id}/send-rework
    actor: AgencyProjectManager
    preconditions: []
    side_effects: []
  - from: REWORK
    to: MAPPED
    trigger: POST /programs/workflow-processes/{id}/remap
    actor: BusinessAnalyst
    preconditions: []
    side_effects:
    - increment map_revision (cyclic loop MAPPED->IN_REVIEW->REWORK->MAPPED)
  - from: APPROVED
    to: RETIRED
    trigger: POST /programs/workflow-processes/{id}/retire
    actor: AgencyProjectManager
    preconditions:
    - contract status == CLOSED
    side_effects: []
- entity: MigrationBatch
  initial_state: DEFINED
  terminal_states:
  - ACCEPTED
  transitions:
  - from: DEFINED
    to: EXTRACTED
    trigger: POST /programs/migration-batches/{id}/extract
    actor: DataMigrationLead
    preconditions: []
    side_effects:
    - set extracted_at
  - from: EXTRACTED
    to: CLEANSED
    trigger: POST /programs/migration-batches/{id}/cleanse
    actor: DataMigrationLead
    preconditions:
    - records ingested via POST /programs/migration-batches/{id}/records
    side_effects:
    - 'every MigrationRecord with issue_code == null has resolution := null and loaded := true candidate; every record with issue_code != null must have resolution set by cleanse payload rule: QUARANTINED/CORRECTED/EXCLUDED'
  - from: CLEANSED
    to: LOADED
    trigger: POST /programs/migration-batches/{id}/load
    actor: DataMigrationLead
    preconditions:
    - no MigrationRecord in this batch has issue_code != null AND resolution == null
    side_effects:
    - set loaded := true on every record with resolution in {null, CORRECTED}
    - set loaded_at
  - from: LOADED
    to: RECONCILED
    trigger: POST /programs/migration-batches/{id}/reconcile
    actor: DataMigrationLead
    preconditions: []
    side_effects:
    - create two ReconciliationReport rows (FORWARD and CHRONOLOGICAL variants) per reconciliation_variance calculation
    - both variants must be within_tolerance; else transition goes to RECONCILE_FAILED instead
  - from: LOADED
    to: RECONCILE_FAILED
    trigger: POST /programs/migration-batches/{id}/reconcile (tolerance breach in either variant)
    actor: system
    preconditions: []
    side_effects: []
  - from: RECONCILE_FAILED
    to: CLEANSED
    trigger: POST /programs/migration-batches/{id}/recleanse
    actor: DataMigrationLead
    preconditions: []
    side_effects:
    - loaded := false reset on all records (cycle back for correction)
  - from: RECONCILED
    to: ACCEPTED
    trigger: POST /programs/migration-batches/{id}/accept
    actor: AgencyProjectManager
    preconditions:
    - 'segregation of duties: accepting user id != user id recorded as last reconciler on batch'
    side_effects:
    - 'cascade: GoLiveEvent.readiness_score recompute'
- entity: InterfaceCertification
  initial_state: SCHEDULED
  terminal_states:
  - PASSED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /programs/interface-certifications/{id}/begin
    actor: InterfaceEngineer
    preconditions:
    - parent InterfaceEndpoint status == IN_TESTING
    - logical clock date within [window_starts_on, window_ends_on]
    side_effects:
    - no other certification of the same interface may be IN_PROGRESS (overlap exclusion)
  - from: IN_PROGRESS
    to: PASSED
    trigger: POST /programs/interface-certifications/{id}/pass
    actor: AgencyProjectManager
    preconditions: []
    side_effects:
    - 'cascade hop 1: parent InterfaceEndpoint -> CERTIFIED when this is its first PASSED certification'
    - 'cascade hop 2: GoLiveEvent.readiness_score recompute'
  - from: IN_PROGRESS
    to: FAILED
    trigger: POST /programs/interface-certifications/{id}/fail
    actor: AgencyProjectManager
    preconditions: []
    side_effects: []
  - from: FAILED
    to: SCHEDULED
    trigger: POST /programs/interface-certifications/{id}/retry
    actor: InterfaceEngineer
    preconditions:
    - payload supplies new window not overlapping any non-CANCELLED certification window of the same interface except adjacency (contiguous touch allowed)
    side_effects:
    - increment attempt_no (retry loop)
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /programs/interface-certifications/{id}/cancel
    actor: InterfaceEngineer
    preconditions: []
    side_effects: []
- entity: UatCycle
  initial_state: PLANNED
  terminal_states:
  - PASSED
  - FAILED
  transitions:
  - from: PLANNED
    to: IN_PROGRESS
    trigger: POST /programs/uat-cycles/{id}/start
    actor: AgencyProjectManager
    preconditions:
    - at least one UatSession with result == SCHEDULED
    side_effects: []
  - from: IN_PROGRESS
    to: PASSED
    trigger: POST /programs/uat-cycles/{id}/complete
    actor: AgencyProjectManager
    preconditions:
    - every UatSession result in {PASSED, SKIPPED}
    - count(result == PASSED) >= ceil(0.8 * total sessions)
    side_effects:
    - 'cascade: GoLiveEvent.readiness_score recompute'
  - from: IN_PROGRESS
    to: FAILED
    trigger: POST /programs/uat-cycles/{id}/complete (pass threshold not met)
    actor: system
    preconditions: []
    side_effects: []
  - from: IN_PROGRESS
    to: BLOCKED
    trigger: POST /programs/uat-cycles/{id}/block (toggle; block_reason required)
    actor: AgencyProjectManager
    preconditions: []
    side_effects: []
  - from: BLOCKED
    to: IN_PROGRESS
    trigger: POST /programs/uat-cycles/{id}/block (toggle; no reason needed when leaving BLOCKED)
    actor: AgencyProjectManager
    preconditions: []
    side_effects: []
- entity: GoLiveEvent
  initial_state: PROPOSED
  terminal_states:
  - EXECUTED
  - CANCELLED
  transitions:
  - from: PROPOSED
    to: READINESS_CHECKED
    trigger: POST /programs/go-live-events/{id}/readiness-check
    actor: ImplementationManager
    preconditions:
    - planned_date not inside any blackout StatutoryCalendarWindow for the contract's agency (ERR_GO_LIVE_IN_BLACKOUT)
    side_effects:
    - compute readiness_score via readiness_score calculation and persist
  - from: READINESS_CHECKED
    to: APPROVED
    trigger: POST /programs/go-live-events/{id}/approve
    actor: AgencyProjectManager
    preconditions:
    - readiness_score >= READINESS_THRESHOLD (80)
    - contract status == IMPLEMENTATION
    side_effects:
    - append AuditLogEntry
  - from: READINESS_CHECKED
    to: PROPOSED
    trigger: POST /programs/go-live-events/{id}/revise
    actor: ImplementationManager
    preconditions: []
    side_effects:
    - payload may set new planned_date; blackout rule re-validated on next readiness-check
  - from: APPROVED
    to: EXECUTED
    trigger: POST /programs/go-live-events/{id}/execute
    actor: ImplementationManager
    preconditions:
    - logical clock date == planned_date
    - no other GoLiveEvent for the contract in EXECUTED
    side_effects:
    - 'cascade hop 1: create SupportTransition (status WARRANTY, warranty_end_on = planned_date + WARRANTY_DAYS) for the contract'
    - 'cascade hop 2: RETAINAGE_HELD milestones'' retained portions become payable'
    - "cascade hop 3: all MigrationBatches must be ACCEPTED \u2014 enforced as precondition instead; see validations"
  - from: EXECUTED
    to: ROLLED_BACK
    trigger: POST /programs/go-live-events/{id}/rollback
    actor: ImplementationManager
    preconditions:
    - logical clock date <= planned_date + ROLLBACK_WINDOW_DAYS (14)
    side_effects:
    - 'cascade: SupportTransition for contract -> SUSPENDED-equivalent: status stays WARRANTY but open_sev1_count gating freezes STEADY_STATE promotion; MaintenanceAgreement activation blocked while rolled
      back'
    - append AuditLogEntry
  - from: ROLLED_BACK
    to: PROPOSED
    trigger: POST /programs/go-live-events/{id}/replan
    actor: ImplementationManager
    preconditions:
    - payload new planned_date strictly after logical clock date
    side_effects: []
  - from: PROPOSED
    to: CANCELLED
    trigger: POST /programs/go-live-events/{id}/cancel
    actor: ImplementationManager
    preconditions: []
    side_effects: []
- entity: SupportTransition
  initial_state: WARRANTY
  terminal_states:
  - SUNSET
  transitions:
  - from: WARRANTY
    to: STABILIZATION
    trigger: POST /programs/support-transitions/{id}/advance
    actor: SupportManager
    preconditions:
    - logical clock date > warranty_end_on
    - open_sev1_count == 0
    side_effects: []
  - from: STABILIZATION
    to: STEADY_STATE
    trigger: POST /programs/support-transitions/{id}/advance
    actor: SupportManager
    preconditions:
    - open_sev1_count == 0
    - sla_breach_count <= SLA_BREACH_ALLOWANCE (2)
    side_effects:
    - 'cascade: MaintenanceAgreement for contract may be activated (gate opens)'
  - from: STEADY_STATE
    to: SUNSET
    trigger: POST /programs/support-transitions/{id}/sunset
    actor: SupportManager
    preconditions:
    - contract status == CLOSED
    side_effects: []
- entity: MaintenanceAgreement
  initial_state: DRAFT
  terminal_states:
  - RENEWED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /programs/maintenance-agreements/{id}/activate
    actor: FinanceOfficer
    preconditions:
    - SupportTransition status == STEADY_STATE
    - coverage_start_on == SupportTransition.warranty_end_on + 1 day
    - no GoLiveEvent for contract in ROLLED_BACK
    side_effects:
    - compute escalated_fee_cents via maintenance_fee_escalation (renewal_index == 0 => equals annual_fee_cents)
  - from: ACTIVE
    to: RENEWED
    trigger: POST /programs/maintenance-agreements/{id}/renew
    actor: FinanceOfficer
    preconditions:
    - expected_agreement_version matches current version (OCC)
    side_effects:
    - create successor MaintenanceAgreement in DRAFT with renewal_index = this.renewal_index + 1 and escalated_fee_cents recomputed; this agreement closes as RENEWED
    - append AuditLogEntry
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /programs/maintenance-agreements/{id}/suspend (ACTIVE -> SUSPENDED)
    actor: FinanceOfficer
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /programs/maintenance-agreements/{id}/suspend (SUSPENDED -> ACTIVE)
    actor: FinanceOfficer
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: LAPSED
    trigger: system (logical clock date > coverage_start_on + 365 days while still SUSPENDED, evaluated on any read/advance)
    actor: system
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: award-stale-contract-version
  parent_entity: ProcurementContract
  write_endpoint: POST /programs/contracts/{id}/award
  occ_field: expected_contract_version
  description: 'Awarding a contract whose version has advanced since the client last

    observed it is rejected: another writer may have recorded a protest

    resolution or amended the solicitation, making the client''s award basis

    stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: renewal-stale-agreement-version
  parent_entity: MaintenanceAgreement
  write_endpoint: POST /programs/maintenance-agreements/{id}/renew
  occ_field: expected_agreement_version
  description: 'Renewing a MaintenanceAgreement whose version has advanced since the

    client last observed it is rejected: a renewal creates a successor row

    and supersedes the current agreement, so acting on a stale view would

    fork the renewal chain.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: milestone_payment
  trigger: Milestone READY_FOR_REVIEW -> ACCEPTED
  algorithm: tiered_pricing
  formula: '# Dual variant, chosen by milestone.billing_variant.

    # Variant PAYMENT_ON_ACCEPTANCE:

    #   payable_cents = billable_amount_cents

    #   retained_cents = 0

    # Variant RETAINAGE_HELD:

    #   retained_cents = floor(billable_amount_cents * RETAINAGE_PCT / 100)

    #   payable_cents  = billable_amount_cents - retained_cents

    # Rounding: single floor on the retained portion; payable is the exact

    # complement so payable + retained == billable (conservation).

    '
  input_set: the accepting Milestone; constants RETAINAGE_PCT
  constants:
    RETAINAGE_PCT: 10
  precision: integer cents; floor on retained portion only
  variants:
  - name: payment_on_acceptance
    when: milestone.billing_variant == PAYMENT_ON_ACCEPTANCE
    difference: full billable amount payable immediately; nothing retained
  - name: retainage_held
    when: milestone.billing_variant == RETAINAGE_HELD
    difference: RETAINAGE_PCT withheld until a GoLiveEvent for the contract reaches EXECUTED, then released on the next mark-paid
- name: reconciliation_variance
  trigger: MigrationBatch LOADED -> reconcile
  algorithm: aggregation
  formula: '# Two matching variants computed over the same loaded records.

    # Shared aggregates:

    #   loaded_record_count  = count(MigrationRecord r in batch where r.loaded == true)

    #   loaded_net_value_cents = sum(r.signed_value_cents for r loaded)

    # Variant FORWARD (forward-looking):

    #   expected set = batch.expected_record_count / expected_net_value_cents

    #   PLUS records with resolution == CORRECTED are counted at their corrected value

    # Variant CHRONOLOGICAL:

    #   records replayed in (legacy_primary_key ASC) order with a running signed

    #   accumulator; any record whose inclusion would flip the running total''s

    #   sign relative to the final total is flagged, and flagged records are

    #   EXCLUDED from loaded_net_value_cents in this variant.

    # count_delta = loaded_record_count - expected_record_count

    # value_delta_cents = loaded_net_value_cents - expected_net_value_cents

    # within_tolerance = (count_delta == 0) AND (abs(value_delta_cents) <= tolerance_cents(domain))

    # tolerance_cents: PROPERTY_TAX -> 0; COURT_CASES -> 0; ACCOUNTS_RECEIVABLE -> 100; LICENSES -> 50; PAYROLL -> 0

    '
  input_set: MigrationRecord rows of the batch with loaded == true; batch expectations
  constants:
    TOL_AR_CENTS: 100
    TOL_LICENSES_CENTS: 50
    TOL_ZERO_CENTS: 0
  precision: integer cents; no rounding
  variants:
  - name: forward
    when: always computed
    difference: includes corrected records at corrected value; no sign-flip exclusion
  - name: chronological
    when: always computed
    difference: replays in legacy_primary_key ASC order and excludes sign-flipping records from the value aggregate, so identical loaded data can reconcile under FORWARD but fail under CHRONOLOGICAL
- name: readiness_score
  trigger: GoLiveEvent readiness-check and on every gate-affecting mutation (milestone accepted, batch accepted, certification passed, uat cycle completed, workflow approved)
  algorithm: weighted_scoring
  formula: "# Components (each 0..100, weights in constants):\n#   C_milestones = 100 * (# milestones in {ACCEPTED, INVOICED, PAID}) / (total milestones)        [0 if none]\n#   C_migration  = 100 * (#\
    \ batches ACCEPTED) / (total batches)                                    [0 if none]\n#   C_interfaces = 100 * (# endpoints CERTIFIED) / (total endpoints)                               [0 if none]\n\
    #   C_uat        = 100 * (# cycles PASSED) / (total cycles)                                        [0 if none]\n#   C_process    = 100 * (# workflow processes APPROVED) / (total workflow processes)\
    \              [0 if none]\n#   C_training   = min(100, 100 * (seat_weight of enrollments with outcome == COMPLETED) / (seat_weight of enrollments with outcome in {ENROLLED, COMPLETED}))   [0 if no\
    \ enrollments]\n# score = floor( (W_M*C_milestones + W_G*C_migration + W_I*C_interfaces + W_U*C_uat + W_P*C_process + W_T*C_training) / 100 )\n# Weights sum to 100. Division happens ONCE at the end\
    \ (never per component),\n# and the final value is floored \u2014 pinned order to avoid per-component rounding drift.\n"
  input_set: all Milestones, MigrationBatches, InterfaceEndpoints, UatCycles, WorkflowProcesses, TrainingEnrollments of the contract; excludes entities whose parent contract is CANCELLED
  constants:
    W_M: 25
    W_G: 25
    W_I: 20
    W_U: 15
    W_P: 10
    W_T: 5
    READINESS_THRESHOLD: 80
  precision: integer 0..100; floor once at final division
  variants: []
- name: maintenance_fee_escalation
  trigger: MaintenanceAgreement DRAFT -> ACTIVE and on renew (successor creation)
  algorithm: threshold
  formula: '# escalated_fee_cents(renewal_index n) =

    #   round_half_up( annual_fee_cents * (1 + ESCALATOR_PCT/100)^n )

    # compounded per renewal, rounded ONCE at the end (not per year).

    # n == 0 => escalated_fee_cents == annual_fee_cents exactly.

    '
  input_set: the agreement's annual_fee_cents and renewal_index
  constants:
    ESCALATOR_PCT: 3
  precision: integer cents; round_half_up applied once to the final product
  variants: []
- name: training_capacity_consumption
  trigger: TrainingEnrollment creation
  algorithm: waterfall_allocation
  formula: '# seat_weight = 2 if staff.tenure_years >= LONG_TENURE_YEARS else 1

    # consumed = sum(seat_weight over enrollments with outcome in {ENROLLED, COMPLETED})

    # enrolment allowed iff consumed + seat_weight <= session.capacity

    # boundary: exactly-equal consumption is allowed (<=, not <).

    # In a UatCycle with parallel_operations == true, each assigned tester''s

    # effective session load doubles for capacity checks on overlapping dates.

    '
  input_set: TrainingEnrollment rows of the session with outcome in {ENROLLED, COMPLETED}; enrolling StaffMember
  constants:
    LONG_TENURE_YEARS: 10
  precision: integer seats
  variants: []
- name: certification_window_overlap
  trigger: InterfaceCertification create and retry
  algorithm: interval_merge
  formula: '# Closed-interval semantics [start, end]. A new certification window for an

    # interface REJECTS iff it strictly overlaps any non-CANCELLED certification

    # window of the same interface:

    #   overlap(a,b) = a.start <= b.end AND b.start <= a.end AND NOT adjacent

    #   adjacent(a,b) = (a.end + 1 day == b.start) OR (b.end + 1 day == a.start)

    # Adjacency (contiguous touch) is ALLOWED; shared interior dates are not.

    # Contrast with UnavailabilityWindow checks on UatSession scheduling, which

    # use pure closed-interval overlap where touching endpoints DO collide.

    '
  input_set: non-CANCELLED InterfaceCertification rows of the same InterfaceEndpoint
  constants: {}
  precision: whole ISO days
  variants: []
- name: tester_availability_conflict
  trigger: UatSession create/schedule
  algorithm: interval_merge
  formula: '# A session on date D for tester T conflicts iff any UnavailabilityWindow w

    # of T satisfies w.starts_on <= D <= w.ends_on (closed interval; a session

    # landing exactly on w.starts_on or w.ends_on DOES conflict).

    # Also conflicts with another UatSession for T on the same date D; when the

    # parent cycle has parallel_operations == true the tester may carry at most

    # 1 session on D, otherwise at most 2.

    '
  input_set: UnavailabilityWindow rows of the tester; UatSession rows of the tester on D in non-terminal results
  constants: {}
  precision: whole ISO days
  variants: []
- name: sla_breach_evaluation
  trigger: SupportTicket resolution and SupportTransition advance
  algorithm: chronological
  formula: '# sla_days(SEV1)=1, sla_days(SEV2)=5, sla_days(SEV3)=20 (whole days).

    # breached_sla = (resolved_on - raised_on) > sla_days(severity)

    # open tickets past SLA count as breached when the transition advances.

    # sla_breach_count = count(tickets with breached_sla == true).

    # Chronological: tickets are evaluated in raised_on ASC order; the

    # STEADY_STATE gate compares sla_breach_count <= SLA_BREACH_ALLOWANCE.

    '
  input_set: SupportTicket rows of the transition
  constants:
    SLA_SEV1_DAYS: 1
    SLA_SEV2_DAYS: 5
    SLA_SEV3_DAYS: 20
    SLA_BREACH_ALLOWANCE: 2
    WARRANTY_DAYS: 90
    ROLLBACK_WINDOW_DAYS: 14
  precision: whole ISO days; strict > at boundary
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and in roles catalog; X-User-ID present
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: "role permitted for this endpoint per \xA71.7"
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: path-templated resources exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: body-referenced FK ids exist (staff, workflow process, decision to supersede, etc.)
  error_id: ERR_REFERENCE_NOT_FOUND
  http_status: 404
  applies_to: endpoints with FK inputs
- priority: 5
  category: state
  check: target resource in a from-state of the requested transition
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: business_safety
  check: 'segregation of duties: milestone accept requires accepting X-User-ID != recorded submitter; migration batch accept requires acceptor != last reconciler'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 422
  applies_to: POST /programs/milestones/{id}/accept, POST /programs/migration-batches/{id}/accept
- priority: 7
  category: business_safety
  check: go-live planned_date not inside any blackout StatutoryCalendarWindow (closed interval) of the contract's agency
  error_id: ERR_GO_LIVE_IN_BLACKOUT
  http_status: 422
  applies_to: POST /programs/go-live-events, POST /programs/go-live-events/{id}/readiness-check
- priority: 8
  category: business_constraint
  check: certification windows of one interface must not share interior dates (adjacency allowed)
  error_id: ERR_CERTIFICATION_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /programs/interfaces/{id}/certifications, POST /programs/interface-certifications/{id}/retry
- priority: 9
  category: business_constraint
  check: UatSession date must not fall inside tester UnavailabilityWindow (closed) nor exceed per-day session cap (1 under parallel_operations, else 2)
  error_id: ERR_TESTER_UNAVAILABLE
  http_status: 422
  applies_to: POST /programs/uat-cycles/{id}/sessions
- priority: 10
  category: business_constraint
  check: configuration decision's workflow process must be in {MAPPED, APPROVED}
  error_id: ERR_PROCESS_NOT_MAPPED
  http_status: 422
  applies_to: POST /programs/workflow-processes/{id}/decisions
- priority: 11
  category: business_constraint
  check: 'training enrollment capacity: consumed seat_weight + new seat_weight <= capacity (exact fit allowed)'
  error_id: ERR_SESSION_FULL
  http_status: 422
  applies_to: POST /programs/training-sessions/{id}/enrollments
- priority: 12
  category: business_constraint
  check: 'uniqueness: milestone.code per contract; decision_key per contract; legacy_primary_key per batch; solicitation_number global'
  error_id: ERR_DUPLICATE_KEY
  http_status: 409
  applies_to: creation endpoints
- priority: 13
  category: business_temporal
  check: phase planned_end_on >= planned_start_on; window ends_on >= starts_on; session/scheduled dates parse as ISO dates
  error_id: ERR_INVALID_DATE_RANGE
  http_status: 422
  applies_to: endpoints taking date ranges
- priority: 14
  category: business_temporal
  check: go-live execute requires logical clock date == planned_date; rollback requires clock date <= planned_date + 14
  error_id: ERR_GO_LIVE_DATE_MISMATCH
  http_status: 422
  applies_to: POST /programs/go-live-events/{id}/execute, POST /programs/go-live-events/{id}/rollback
- priority: 15
  category: business_referential
  check: go-live execute requires every MigrationBatch of contract ACCEPTED and every InterfaceEndpoint CERTIFIED
  error_id: ERR_GO_LIVE_PREREQUISITE
  http_status: 422
  applies_to: POST /programs/go-live-events/{id}/execute
- priority: 16
  category: business_referential
  check: milestone accept requires all AcceptanceCriteria in {SATISFIED, WAIVED} with waiver_reason non-empty when WAIVED
  error_id: ERR_ACCEPTANCE_CRITERIA_OPEN
  http_status: 422
  applies_to: POST /programs/milestones/{id}/accept
- priority: 17
  category: business_referential
  check: migration load requires no record with issue_code != null and resolution == null
  error_id: ERR_UNRESOLVED_RECORDS
  http_status: 422
  applies_to: POST /programs/migration-batches/{id}/load
- priority: 18
  category: business_fiscal
  check: sum of milestone billable_amount_cents in {ACCEPTED, INVOICED, PAID} + new <= contract_value_cents
  error_id: ERR_CONTRACT_VALUE_EXCEEDED
  http_status: 422
  applies_to: POST /programs/phases/{id}/milestones, POST /programs/milestones/{id}/invoice
- priority: 19
  category: business_fiscal
  check: maintenance activation requires coverage_start_on == warranty_end_on + 1 day
  error_id: ERR_COVERAGE_GAP
  http_status: 422
  applies_to: POST /programs/maintenance-agreements/{id}/activate
- priority: 20
  category: business_constraint
  check: 'OCC: expected_*_version matches parent''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /programs/contracts/{id}/award, POST /programs/maintenance-agreements/{id}/renew
endpoints:
