            - "Appointment.${ap_near}.cancellation_fee_cents == 2925"
            - "Appointment.${ap_exact}.scheduling_status == CANCELLED and fulfillment_status == ABORTED"
            - "RouteDay.${rd4_id}.committed_minutes == 0 and stop_count == 0 after the first trigger call"
            - "Client.${cl_id}.account_credit_cents == -2925 after both trigger calls"

  # =========================================================================
  # RULE 7 - cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: rebuild_start_requires_instrument_custody_in_shop
        grounds:
          - validations[priority=37]
          - state_machines.ServiceOrder.status.PENDING_to_IN_PROGRESS
          - state_machines.Instrument.custody_status.IN_TRANSIT_to_IN_SHOP
          - entities.Instrument.fields.custody_status
          - errors[ERR_INVALID_CUSTODY_STATE]
        distinguishing_aspect: |
          The entity pair is ServiceOrder -> Instrument: a REBUILD order's PENDING to
          IN_PROGRESS edge is gated by a field on a DIFFERENT entity, Instrument.custody_status,
          and the identical request flips from 409 to 201-equivalent success purely because
          the instrument reached IN_SHOP.
        test_recipe:
          setup:
            - "One INDIVIDUAL client, one ZONE_A location, one UPRIGHT instrument still at custody_status AT_CLIENT_SITE."
            - "A MASTER technician exists."
            - "An approved REBUILD quote for 1363000 cents has produced a PENDING service order with four 340750-cent milestones and 545200 cents of deposit charged."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Vance Estate", email: "vance@example.com", phone: "555-0220", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Music Room", zone_code: "ZONE_A", address_key: "31-vance-drive", distance_miles_from_shop: 11.0, stair_flights: 1 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Steinway", model: "K52", serial_number: "SN-D13-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech M13", certification_level: "MASTER", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 48.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "REBUILD_REQUIRED", note: "soundboard cracked" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REBUILD", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
          trigger:
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
              captures: { err_custody: "$.data.error_id" }
            - call: "POST /instruments/${inst_id}/custody-transitions"
              payload: { to_custody_status: "IN_TRANSIT" }
              as: MoveCoordinator
            - call: "POST /instruments/${inst_id}/custody-transitions"
              payload: { to_custody_status: "IN_SHOP" }
              as: MoveCoordinator
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_INVALID_CUSTODY_STATE"
            - "after the first trigger call ServiceOrder.${so_id}.status is still PENDING and every milestone is still PENDING"
            - "Instrument.${inst_id}.pitch_raise_tier == TIER_3 and planned_visit_count == 2"
            - "after the fourth trigger call ServiceOrder.${so_id}.status == IN_PROGRESS and all four milestones have status READY"
            - "the four milestone amount_cents are 340750, 340750, 340750 and 340750, summing to ServiceOrder.${so_id}.contract_total_cents == 1363000"
            - "ServiceOrder.${so_id}.deposit_held_cents == 545200"

      - name: milestone_release_requires_service_order_in_progress
        grounds:
          - validations[priority=24]
          - state_machines.Milestone.status.READY_to_RELEASED
          - state_machines.ServiceOrder.status.IN_PROGRESS_to_ON_HOLD
          - state_machines.ServiceOrder.status.ON_HOLD_to_IN_PROGRESS
          - state_machines.Appointment.fulfillment_status.EN_ROUTE_to_NO_SHOW
        distinguishing_aspect: |
          The entity pair is Milestone -> ServiceOrder, a different pair from the
          ServiceOrder -> Instrument dependency: the milestone's OWN state is a perfectly
          valid READY, and only the parent order's ON_HOLD status blocks the release; a
          resume on the ORDER unblocks the identical milestone request.
        test_recipe:
          setup:
            - "One INDIVIDUAL client funded with 200000 cents, one UPRIGHT instrument at SERVICEABLE."
            - "A VOICE service order for 42000 cents is IN_PROGRESS with two READY milestones and 25000 cents of deposit held."
            - "A VOICE appointment linked to that order sits on a DISPATCHED route day and has been marked NO_SHOW, driving the order to ON_HOLD."
