              as: SortationAgent
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
            - call: "GET /baggage/stations/${st}"
              payload: {}
              as: AcceptanceAgent
              captures: { st_v: $.data.version }
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: LoadAgent
              captures: { bag_v_loaded: $.data.version }
          trigger:
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
              captures: { err1: $.data.error_id }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.5 }
