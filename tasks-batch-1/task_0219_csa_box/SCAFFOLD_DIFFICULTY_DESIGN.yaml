              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "m12a@x.com", full_name: "M 12A", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_a_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m12b@x.com", full_name: "M 12B", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_b_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_a_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_a_id}"
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_b_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_b_id}"
              captures: { sub_b_id: $.data.id }
            - call: "POST /subscription-add-ons"
              payload: { subscription_id: "${sub_a_id}", add_on_id: "${addon_id}" }
              as: Member
              as_user_id: "${member_a_id}"
          trigger:
            - call: "POST /subscription-add-ons"
              payload: { subscription_id: "${sub_b_id}", add_on_id: "${addon_id}" }
              as: Member
              as_user_id: "${member_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ADDON_SUPPLY_EXHAUSTED (committed_count 1 not < weekly_supply_cap 1)"
            - "AddOn.${addon_id}.committed_count == 1 (unchanged by the rejected attach)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_season_open_subscription_vs_season
        grounds:
          - state_machines.Subscription.PENDING_PAYMENT_to_CONFIRMED
          - state_machines.Season.OPEN_to_CLOSED
          - validations[priority=6]
        distinguishing_aspect: |
          Subscription→Season dependency: a Subscription confirm is rejected with ERR_INVALID_STATE when the parent
          Season.status is CLOSED rather than OPEN — the subscription's valid transition depends on the Season's state.
        test_recipe:
          setup:
            - "Season has a PENDING_PAYMENT subscription, then the season is CLOSED"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S13", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-12-30T00:00:00Z", total_share_capacity: 100 }
