  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_rework_cycle_returns_from_qc_failed_to_repair
        grounds:
          - state_machines.RepairOrder.READY_FOR_QC_to_QC_FAILED
          - state_machines.RepairOrder.QC_FAILED_to_REPAIR
          - state_machines.StageAssignment.SCHEDULED_to_ACTIVE
          - entities.RepairOrder.fields.qc_inspection_count
          - entities.QcInspection.fields.failure_reason
          - validations.priority_38
        distinguishing_aspect: |
          The stage dimension is not a ladder: a failing inspection sends READY_FOR_QC back to
          QC_FAILED and then to REPAIR, so the same order occupies REPAIR twice, needs a second
          SCHEDULED REPAIR assignment to re-enter it, and the second inspection carries
          sequence_number 2. This is the RepairOrder entity's cycle.
        test_recipe:
          setup:
            - "One customer, one insurer, one repair order (deductible 25000, initial authorisation 400000) locked with a single BODY 4.5 h line, so posture is OPEN throughout."
            - "A BODY stall and a PAINT stall, both with the default 30-minute cleanup buffer."
            - "The order is walked ESTIMATE_LOCKED -> PARTS_STAGED -> REPAIR -> REFINISH_CALIBRATION -> READY_FOR_QC with one REPAIR assignment (08:00-12:00, 240 min) and one REFINISH_CALIBRATION assignment (13:00-15:00, 120 min)."
            - "A second REPAIR assignment on the body stall for the next day (08:00-10:00, 120 min) is booked so the rework hop has somewhere to go."
            - "No procedure records exist, so both safety gates are vacuously satisfied; the blueprint was signed by est-001 and the inspector is qc-001."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Nia Patel", phone: "555-0144", email: "nia@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-5", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
