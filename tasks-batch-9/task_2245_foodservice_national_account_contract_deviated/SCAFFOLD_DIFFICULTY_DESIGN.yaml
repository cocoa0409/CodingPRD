  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispute_credit_cascade_line_period_contract_manufacturer
        grounds:
          - state_machines.PricingDispute.UPHELD_to_CREDIT_ISSUED
          - state_machines.OrderLine.INVOICED_to_CREDITED
          - state_machines.RebatePeriod.CLOSED_to_OPEN
          - entities.RebatePeriod.fields.reopen_count
          - entities.Contract.fields.rebate_payable_cents
          - entities.Manufacturer.fields.rebate_funding_payable_cents
          - calculations.rebate_accrual_split
          - calculations.contract_compliance_posture
        distinguishing_aspect: |
          Cascade originating at POST /nac/pricing-disputes/{id}/issue-credit, four
          hops deep and terminating in two ledger counters: the credit rewrites the
          OrderLine (hop 2) BECAUSE the dispute was credited; the RebatePeriod
          reopens (hop 3) BECAUSE that line's invoiced value changed; and the
          Contract and Manufacturer rebate accruals unwind (hop 4) BECAUSE the
          period's computed metrics were cleared — no hop is a direct fan-out of the
          issue-credit call.
        test_recipe:
          setup:
            - "ACTIVE contract HLG-2026, PROTEIN tiers 12.50 on [0,500) and 9.00 on [500, unbounded), in-market DC, product P-CHKN at last_cost 4200."
