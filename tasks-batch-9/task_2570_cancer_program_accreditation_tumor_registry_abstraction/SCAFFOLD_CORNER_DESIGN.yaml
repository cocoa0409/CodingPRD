              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_1}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_1_v2}", stage_source: "PATHOLOGIC", t_category: "T3", n_category: "N1", m_category: "M0", stage_group: "STAGE_III", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_WITH_DISEASE", last_contact_date: "2026-07-20", supersedes_abstraction_id: "${abst_1}" }
