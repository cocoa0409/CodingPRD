            - call: POST /invitations/${invB_id}/offer
              payload: { appearance_fee_cents: 400000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${invA_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${invB_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
