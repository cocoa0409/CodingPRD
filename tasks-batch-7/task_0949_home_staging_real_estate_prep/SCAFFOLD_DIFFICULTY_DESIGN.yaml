scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: contract_value_diverges_by_pipeline_on_project_cost_accounting
        grounds:
          - calculations.contract_value
          - entities.Project.fields.pipeline
          - entities.Consultation.fields.pipeline
          - entities.PackageTier.fields.monthly_rent_rate
        distinguishing_aspect: |
          This dual variant lives on PROJECT COST ACCOUNTING: the VACANT_STAGING arm adds
          MIN_LEASE_CYCLES cycles of projected package rent (950.00 * 3 = 2850.00) and zero
          labour, while the OCCUPIED_PREP arm adds zero lease projection and prices the
          consultant's estimated hours plus the first-visit surcharge — two different
          numbers from one calculation on one entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "PackageTier SIGNATURE (rank 2, room_cap 3, accessory 2, photo 2, base 4200.00, rent 950.00)."
            - "A VACANT property 22.0 miles out with 4 PACKAGE_ROOM scope rooms and 3 accessory sets, consultation SCOPE_APPROVED."
            - "Project created against that consultation with payer_type SELLER."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/package-tiers"
              payload: { tier_code: "SIGNATURE", tier_rank: 2, room_cap: 3, included_accessory_sets: 2, included_photo_sessions: 2, base_price: 4200.00, monthly_rent_rate: 950.00 }
              as: PlatformAdmin
              captures: { tier_sig: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Dana Reyes", email: "dana@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Milo Park", email: "milo@ex.com", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "18 Larch Ct", city: "Bend", state_code: "OR", distance_miles: 22.0, occupancy: "VACANT", room_count: 4 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
            - call: "POST /staging/listings"
              payload: { property_id: "${prop_id}", listing_agent_client_id: "${agent_id}", mls_number: "MLS-9001", list_price: 749000.00 }
              as: StagingCoordinator
              captures: { listing_id: "$.data.id" }
            - call: "POST /staging/consultations"
              payload: { property_id: "${prop_id}", requested_by_client_id: "${agent_id}", scheduled_at: "2026-06-01T00:00:00Z" }
              as: StagingCoordinator
              captures: { cons_id: "$.data.id" }
            - call: "POST /staging/consultations/${cons_id}/hold"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Living", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Primary Bed", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Dining", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Office", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 0 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "SIGNATURE" }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/approve-scope"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /staging/projects"
              payload: { property_id: "${prop_id}", consultation_id: "${cons_id}", listing_id: "${listing_id}", package_tier_id: "${tier_sig}", payer_client_id: "${seller_id}", payer_type: "SELLER" }
              as: StagingCoordinator
              captures: { proj_id: "$.data.id" }
          assert:
            - "Project.${proj_id}.pipeline == VACANT_STAGING"
            - "Project.${proj_id}.room_count == 4"
            - "Project.${proj_id}.accessory_set_count == 3"
            - "Project.${proj_id}.contract_value == 7690.00"
            - "Project.${proj_id}.workflow_state == DRAFT"

      - name: contract_value_occupied_arm_prices_hours_not_lease
        grounds:
          - calculations.contract_value
          - calculations.travel_fee
          - entities.Consultation.fields.estimated_hours
          - entities.Project.fields.contract_value
        distinguishing_aspect: |
          The same calculation on the same entity domain returns 4265.00 for an
          OCCUPIED_PREP project (2400.00 base + 0.00 room overage + 120.00 accessory
          overage + 0.00 travel + 165.00 * 10 hours + 95.00 surcharge) with NO lease
          projection at all — proving the fork is in the algorithm, not in the inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "PackageTier ESSENTIAL (rank 1, room_cap 2, accessory 1, photo 1, base 2400.00, rent 600.00)."
            - "An OCCUPIED property 8.0 miles out, 2 EDIT rooms plus one ACCESSORY_ONLY room, 2 accessory sets total, estimated_hours 10."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/package-tiers"
              payload: { tier_code: "ESSENTIAL", tier_rank: 1, room_cap: 2, included_accessory_sets: 1, included_photo_sessions: 1, base_price: 2400.00, monthly_rent_rate: 600.00 }
              as: PlatformAdmin
              captures: { tier_ess: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Ada Fenn", email: "ada@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Rio Vance", email: "rio@ex.com", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "4 Fir Ln", city: "Bend", state_code: "OR", distance_miles: 8.0, occupancy: "OCCUPIED", room_count: 3 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
            - call: "POST /staging/listings"
              payload: { property_id: "${prop_id}", listing_agent_client_id: "${agent_id}", mls_number: "MLS-9002", list_price: 512000.00 }
              as: StagingCoordinator
              captures: { listing_id: "$.data.id" }
            - call: "POST /staging/consultations"
              payload: { property_id: "${prop_id}", requested_by_client_id: "${agent_id}", scheduled_at: "2026-06-01T00:00:00Z" }
              as: StagingCoordinator
              captures: { cons_id: "$.data.id" }
            - call: "POST /staging/consultations/${cons_id}/hold"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Living", action: "EDIT", estimated_hours: 4.0, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Kitchen", action: "DECLUTTER", estimated_hours: 6.0, accessory_set_count: 0 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Entry", action: "ACCESSORY_ONLY", estimated_hours: 0.0, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "ESSENTIAL", estimated_hours: 10.0 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/approve-scope"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /staging/projects"
              payload: { property_id: "${prop_id}", consultation_id: "${cons_id}", listing_id: "${listing_id}", package_tier_id: "${tier_ess}", payer_client_id: "${agent_id}", payer_type: "AGENT" }
              as: StagingCoordinator
              captures: { proj_id: "$.data.id" }
          assert:
            - "Project.${proj_id}.pipeline == OCCUPIED_PREP"
            - "Project.${proj_id}.room_count == 2"
            - "Project.${proj_id}.accessory_set_count == 2"
            - "Project.${proj_id}.contract_value == 4265.00"

      - name: depreciated_replacement_value_diverges_by_stock_pool_on_item_valuation
        grounds:
          - calculations.depreciated_replacement_value
          - calculations.item_age_band
          - entities.PullLine.fields.source
          - entities.InventoryItem.fields.acquired_at
        distinguishing_aspect: |
          A DIFFERENT entity domain from contract_value: this dual variant is INVENTORY
          VALUATION. The OWNED arm depreciates the unit's own replacement_value by its age
          band (1200.00 * 0.70 = 840.00 at 33 months), while the VENDOR arm ignores age
          entirely and returns 900.00 * quantity * 1.15 — the vendor's schedule, not ours.
        test_recipe:
          setup:
            - "A fully staged VACANT project whose pickup is IN_PROGRESS at 2026-10-13T09:00:00Z."
            - "One OWNED line on a SOFA acquired 2024-01-05 with replacement_value 1200.00 (33 months old, band 2 factor 0.70)."
            - "One VENDOR line of quantity 10 against Metro Rentals."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/package-tiers"
              payload: { tier_code: "SIGNATURE", tier_rank: 2, room_cap: 3, included_accessory_sets: 2, included_photo_sessions: 2, base_price: 4200.00, monthly_rent_rate: 950.00 }
              as: PlatformAdmin
              captures: { tier_sig: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Dana Reyes", email: "dana@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Milo Park", email: "milo@ex.com", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "18 Larch Ct", city: "Bend", state_code: "OR", distance_miles: 22.0, occupancy: "VACANT", room_count: 4 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
            - call: "POST /staging/listings"
              payload: { property_id: "${prop_id}", listing_agent_client_id: "${agent_id}", mls_number: "MLS-9001", list_price: 749000.00 }
              as: StagingCoordinator
              captures: { listing_id: "$.data.id" }
            - call: "POST /staging/consultations"
              payload: { property_id: "${prop_id}", requested_by_client_id: "${agent_id}", scheduled_at: "2026-06-01T00:00:00Z" }
              as: StagingCoordinator
              captures: { cons_id: "$.data.id" }
            - call: "POST /staging/consultations/${cons_id}/hold"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Living", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Office", action: "PACKAGE_ROOM", requires_rental: true, accessory_set_count: 2 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "SIGNATURE" }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/approve-scope"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/projects"
              payload: { property_id: "${prop_id}", consultation_id: "${cons_id}", listing_id: "${listing_id}", package_tier_id: "${tier_sig}", payer_client_id: "${seller_id}", payer_type: "SELLER" }
              as: StagingCoordinator
              captures: { proj_id: "$.data.id" }
            - call: "POST /staging/projects/${proj_id}/authorize"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /staging/deposits?project_id=${proj_id}"
              payload: {}
              as: BillingClerk
              captures: { dep_id: "$.data[0].id" }
            - call: "POST /staging/deposits/${dep_id}/collect"
              payload: {}
              as: BillingClerk
            - call: "POST /staging/vendors"
              payload: { name: "Metro Rentals", lead_time_days: 7, min_lease_cycles: 6, cancel_cutoff_days: 4, rate_multiplier: 1.35 }
              as: WarehouseManager
              captures: { vendor_id: "$.data.id" }
            - call: "POST /staging/rental-orders"
              payload: { project_id: "${proj_id}", vendor_id: "${vendor_id}", unit_count: 10 }
              as: WarehouseManager
              captures: { ro_id: "$.data.id" }
            - call: "POST /staging/rental-orders/${ro_id}/place"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/rental-orders/${ro_id}/confirm"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /staging/inventory-items"
              payload: { sku: "SOFA-1", category: "SOFA", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
              as: WarehouseManager
              captures: { item_a: "$.data.id" }
            - call: "POST /staging/projects/${proj_id}/pulls"
              payload: {}
              as: WarehouseManager
              captures: { pull_id: "$.data.id" }
            - call: "POST /staging/pulls/${pull_id}/lines"
              payload: { source: "OWNED", category: "SOFA", room_label: "Living", quantity: 1 }
              as: WarehouseManager
              captures: { line_a: "$.data.id" }
            - call: "POST /staging/pulls/${pull_id}/lines"
              payload: { source: "VENDOR", category: "CHAIR", room_label: "Office", quantity: 10, rental_order_id: "${ro_id}" }
              as: WarehouseManager
              captures: { line_v: "$.data.id" }
            - call: "POST /staging/pulls/${pull_id}/submit"
              payload: {}
              as: WarehouseManager
            - call: "GET /staging/projects/${proj_id}"
              payload: {}
              as: WarehouseManager
              captures: { proj_v: "$.data.version" }
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v}" }
              as: WarehouseManager
            - call: "POST /staging/projects/${proj_id}/installs"
              payload: { scheduled_at: "2026-06-10T09:00:00Z", crew_size: 3, initial_cycles: 4 }
              as: StagingCoordinator
              captures: { install_id: "$.data.id" }
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/installs/${install_id}/start"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/installs/${install_id}/complete"
              payload: {}
              as: StagingCoordinator
            - call: "GET /staging/leases?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { lease_id: "$.data[0].id" }
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/leases/${lease_id}/mark-term-complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
            - call: "POST /staging/pickups/${pickup_id}/start"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/pickups/${pickup_id}/damage-assessments"
              payload: { pull_line_id: "${line_a}", condition_at_pickup: "MISSING" }
              as: WarehouseManager
              captures: { as_owned: "$.data.id" }
            - call: "POST /staging/pickups/${pickup_id}/damage-assessments"
              payload: { pull_line_id: "${line_v}", condition_at_pickup: "MISSING" }
              as: WarehouseManager
              captures: { as_vendor: "$.data.id" }
          trigger:
            - call: "POST /staging/damage-assessments/${as_owned}/assess"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/damage-assessments/${as_vendor}/assess"
              payload: {}
              as: WarehouseManager
          assert:
            - "DamageAssessment.${as_owned}.depreciated_replacement_value == 840.00"
            - "DamageAssessment.${as_owned}.charge_amount == 840.00"
            - "DamageAssessment.${as_vendor}.depreciated_replacement_value == 10350.00"
            - "DamageAssessment.${as_owned}.depreciated_replacement_value != DamageAssessment.${as_vendor}.depreciated_replacement_value"

      - name: tax_amount_diverges_by_payer_on_billing_domain
        grounds:
          - calculations.tax_amount
          - entities.Project.fields.payer_type
          - entities.Invoice.fields.subtotal
          - entities.Invoice.fields.tax_amount
        distinguishing_aspect: |
          A THIRD entity domain — invoice taxation. A SELLER-payer invoice taxes ONLY the
          rental components at 6.25% while every other non-exempt payer taxes the whole
          subtotal at 8.25%, so two invoices with byte-identical line_summary values carry
          different tax_amount.
        test_recipe:
          setup:
            - "A BROKERAGE-payer OCCUPIED project whose brokerage carries tax_exempt true."
            - "Its closeout invoice has subtotal 2825.00 with no rental components at all."
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/package-tiers"
              payload: { tier_code: "ESSENTIAL", tier_rank: 1, room_cap: 2, included_accessory_sets: 1, included_photo_sessions: 1, base_price: 2400.00, monthly_rent_rate: 600.00 }
              as: PlatformAdmin
              captures: { tier_ess: "$.data.id" }
            - call: "POST /staging/brokerages"
              payload: { name: "Cedar Realty", license_code: "BR-4410", authorization_cap: 15000.00, tax_exempt: true, billing_email: "ap@cedar.example" }
              as: PlatformAdmin
              captures: { brk_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Ada Fenn", email: "ada@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "BROKERAGE_ADMIN", full_name: "Kit Yardley", email: "kit@cedar.example", brokerage_id: "${brk_id}" }
              as: PlatformAdmin
              captures: { badmin_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Rio Vance", email: "rio@ex.com", brokerage_id: "${brk_id}", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "4 Fir Ln", city: "Bend", state_code: "OR", distance_miles: 8.0, occupancy: "OCCUPIED", room_count: 2 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
            - call: "POST /staging/listings"
              payload: { property_id: "${prop_id}", listing_agent_client_id: "${agent_id}", mls_number: "MLS-9002", list_price: 512000.00 }
              as: StagingCoordinator
              captures: { listing_id: "$.data.id" }
            - call: "POST /staging/consultations"
              payload: { property_id: "${prop_id}", requested_by_client_id: "${agent_id}", scheduled_at: "2026-06-01T00:00:00Z" }
              as: StagingCoordinator
              captures: { cons_id: "$.data.id" }
            - call: "POST /staging/consultations/${cons_id}/hold"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/scope-items"
              payload: { room_label: "Living", action: "EDIT", estimated_hours: 2.0, accessory_set_count: 1 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/submit-scope"
              payload: { recommended_tier_code: "ESSENTIAL", estimated_hours: 0.0 }
              as: StagingCoordinator
            - call: "POST /staging/consultations/${cons_id}/approve-scope"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/projects"
              payload: { property_id: "${prop_id}", consultation_id: "${cons_id}", listing_id: "${listing_id}", package_tier_id: "${tier_ess}", payer_client_id: "${badmin_id}", payer_type: "BROKERAGE", brokerage_id: "${brk_id}" }
              as: StagingCoordinator
              captures: { proj_id: "$.data.id" }
            - call: "POST /staging/projects/${proj_id}/authorize"
              payload: {}
              as: BrokerageAdmin
              as_user_id: "${brk_id}"
            - call: "GET /staging/deposits?project_id=${proj_id}"
              payload: {}
              as: BillingClerk
              captures: { dep_id: "$.data[0].id" }
            - call: "POST /staging/deposits/${dep_id}/collect"
              payload: {}
              as: BillingClerk
            - call: "POST /staging/projects/${proj_id}/visits"
              payload: { scheduled_at: "2026-06-02T09:00:00Z" }
              as: StagingCoordinator
              captures: { visit_id: "$.data.id" }
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/visits/${visit_id}/complete"
              payload: { hours_logged: 0.0 }
              as: StagingCoordinator
          trigger:
            - call: "POST /staging/projects/${proj_id}/invoices"
              payload: {}
              as: BillingClerk
              captures: { inv_id: "$.data.id" }
          assert:
            - "Project.${proj_id}.contract_value == 2495.00"
            - "Deposit.${dep_id}.amount == 0.00"
            - "Invoice.${inv_id}.subtotal == 2825.00"
            - "Invoice.${inv_id}.tax_amount == 0.00"
            - "Invoice.${inv_id}.state == DRAFT"

  - rule_id: combinatorial_formula
    instances:

      - name: lease_monthly_rent_rounds_per_line_before_summing
        grounds:
          - calculations.lease_monthly_rent
          - calculations.line_monthly_rate
          - calculations.vendor_order_monthly_rate
