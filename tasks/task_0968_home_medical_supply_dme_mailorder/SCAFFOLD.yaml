scenario: |
  generate task hard than expert level! 968. Home Medical Supply & DME Mail-Order (ostomy/incontinence/wound): eligibility & Rx, formulary & sizing, recurring resupply & adherence, prior-auth & Medicare DMEPOS, shipping & backorder, sample/fitting, reorder & denial, HSA

domain_name: home-medical-supply-dme-mailorder
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, derived_field_reconciliation]
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All money is in cents, number, 2 decimal places, round_half_up.
# All dates are ISO dates (YYYY-MM-DD); datetimes ISO 8601 UTC.
# =============================================================================
entities:
  - name: PayerPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: plan_type, type: enum, source: input, description: "MEDICARE_DMEPOS | COMMERCIAL | CASH_HSA" }
      - { name: coinsurance_pct, type: number, source: input, description: "Patient share of allowed amount for insured plans (0.20 = 20%); must be 1.00 for CASH_HSA" }
      - { name: cycle_months, type: integer, source: input, description: "Months of supply per resupply cycle (Medicare DMEPOS = 3, others typically 1)" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the plan accepts new patients" }

  - name: FormularyItem
    parent: null
    common_fields: true
    fields:
      - { name: hcpcs_code, type: string, source: input, description: "HCPCS billing code, e.g. A4419" }
      - { name: name, type: string, source: input, description: "Item display name" }
      - { name: category, type: enum, source: input, description: "OSTOMY | INCONTINENCE | WOUND" }
      - { name: covered_plan_ids, type: array, source: input, description: "Array of PayerPlan.id values whose formulary includes this item" }
      - { name: pack_fee_cents, type: number, source: input, description: "Payer fee-schedule amount per pack, in cents" }
      - { name: pack_size, type: integer, source: input, description: "Billable units per pack; must be >= 1" }
      - { name: unit_allowance_cents, type: number, source: computed, description: "= round_half_up(pack_fee_cents / pack_size, 2); may carry fractional cents" }
      - { name: retail_price_cents, type: number, source: input, description: "Cash/retail unit price in cents, used by CASH_HSA pricing variant" }
      - { name: max_units_per_cycle, type: integer, source: input, description: "Formulary cap on units per resupply cycle" }
      - { name: requires_pa, type: boolean, source: input, default: false, description: "True when shipment release requires an APPROVED PriorAuthorization" }
      - { name: size_codes, type: array, source: input, description: "Offered size codes, e.g. [45MM, 57MM]" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: payer_plan_id, type: string, source: input, description: "FK -> PayerPlan.id; coverage plan" }
      - { name: status, type: enum, source: system, default: PENDING_VERIFICATION, description: "PENDING_VERIFICATION | ACTIVE | INELIGIBLE" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; prescribed patient" }
      - { name: hcpcs_code, type: string, source: input, description: "HCPCS code this Rx authorizes" }
      - { name: prescriber_npi, type: string, source: input, description: "Prescriber NPI identifier" }
      - { name: diagnosis_codes, type: array, source: input, description: "ICD-10 codes; at least 1 required when patient's plan is MEDICARE_DMEPOS" }
      - { name: monthly_quantity, type: integer, source: input, description: "Authorized units per month" }
      - { name: effective_date, type: string, source: input, description: "Window start (inclusive), ISO date" }
      - { name: expiration_date, type: string, source: input, description: "Window end (exclusive), ISO date; half-open [effective_date, expiration_date)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED | EXPIRED; EXPIRED is system-applied when current date >= expiration_date" }

  - name: FitProfile
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; measured patient" }
      - { name: category, type: enum, source: input, description: "OSTOMY | INCONTINENCE | WOUND" }
      - { name: size_code, type: string, source: input, description: "Measured size, e.g. 45MM stoma, 4X4 dressing" }
      - { name: measured_on, type: string, source: input, description: "ISO date of measurement" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUPERSEDED; creating a new profile for same patient+category supersedes the prior CURRENT one" }

  - name: ResupplyProgram
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; enrolled patient" }
      - { name: category, type: enum, source: input, description: "OSTOMY | INCONTINENCE | WOUND" }
      - { name: frequency_days, type: integer, source: input, description: "Days between eligible resupply shipments" }
      - { name: start_date, type: string, source: input, description: "Program start, ISO date; first cycle eligible on this date" }
      - { name: next_eligible_date, type: string, source: computed, description: "= start_date initially; after a delivery, last_delivered_date + frequency_days" }
      - { name: last_delivered_date, type: string, source: system, description: "ISO date of most recent DELIVERED program shipment; null until first delivery" }
      - { name: adherence_score_provisional, type: number, source: computed, description: "Forward-looking adherence: (delivered + in-transit cycles) / cycles_due, 2dp round_half_up" }
      - { name: adherence_score_final, type: number, source: computed, description: "Chronological adherence: delivered cycles / cycles_due, 2dp round_half_up" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: suspend_reason, type: string, source: system, description: "Set on auto/manual suspend; null when ACTIVE" }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; ordering patient (copied from request or program)" }
      - { name: resupply_program_id, type: string, source: system, description: "FK -> ResupplyProgram.id; null for MANUAL_REORDER" }
      - { name: origin, type: enum, source: system, description: "PROGRAM_CYCLE | MANUAL_REORDER" }
      - { name: fulfillment_status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | IN_FULFILLMENT | FULFILLED | CANCELLED (parallel dimension 1)" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | CLAIM_DRAFT | CLAIM_SUBMITTED | CLAIM_DENIED | APPEAL_PENDING | PAID_SETTLED | PATIENT_BILLED (parallel dimension 2)" }
      - { name: total_allowed_cents, type: number, source: computed, default: 0, description: "Sum of line_allowed_cents over lines (insured basis)" }
      - { name: total_patient_resp_cents, type: number, source: computed, default: 0, description: "Estimated patient responsibility at submit; finalized on claim adjudication" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> SupplyOrder.id; parent order (from path)" }
      - { name: formulary_item_id, type: string, source: input, description: "FK -> FormularyItem.id; ordered item" }
      - { name: hcpcs_code, type: string, source: system, description: "Copied from FormularyItem at line creation" }
      - { name: size_code, type: string, source: input, description: "Selected size; must equal the patient's CURRENT FitProfile size for the item category" }
      - { name: quantity, type: integer, source: input, description: "Units ordered; >= 1" }
      - { name: unit_allowance_cents, type: number, source: computed, description: "Copied from FormularyItem.unit_allowance_cents at line creation" }
      - { name: line_allowed_cents, type: number, source: computed, description: "= round_half_up(unit_allowance_cents * quantity, 2); per-unit-first rounding is pinned" }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; authorized patient" }
      - { name: hcpcs_code, type: string, source: input, description: "HCPCS code covered by this authorization" }
      - { name: approved_units, type: integer, source: input, description: "Units the payer approves per cycle" }
      - { name: valid_from, type: string, source: input, description: "Window start (inclusive), ISO date; CLOSED interval" }
      - { name: valid_to, type: string, source: input, description: "Window end (inclusive), ISO date; CLOSED interval [valid_from, valid_to]" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED | APPEALED | EXPIRED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of times this PA has been appealed" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SupplyOrder.id; shipped order" }
      - { name: status, type: enum, source: system, description: "CREATED | BACKORDERED | READY | SHIPPED | DELIVERED | RETURNED | CANCELLED" }
      - { name: shipped_date, type: string, source: system, description: "ISO date set on ship transition; null before" }
      - { name: delivered_date, type: string, source: system, description: "ISO date set on deliver transition; null before" }

  - name: StockLevel
    parent: null
    common_fields: true
    fields:
      - { name: formulary_item_id, type: string, source: input, description: "FK -> FormularyItem.id; exactly one StockLevel per item" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical units on hand" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units reserved by open shipments/backorder allocations" }
      - { name: available_qty, type: integer, source: computed, description: "= on_hand_qty - reserved_qty" }

  - name: BackorderReservation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line awaiting stock" }
      - { name: quantity_pending, type: integer, source: system, description: "Units still awaiting allocation" }
      - { name: quantity_allocated, type: integer, source: system, default: 0, description: "Units allocated so far via restock" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PARTIALLY_ALLOCATED | ALLOCATED | CANCELLED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SupplyOrder.id; billed order" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | PAID | DENIED | APPEALED | DENIED_FINAL" }
      - { name: total_allowed_cents, type: number, source: computed, description: "Sum of line allowed amounts (insured basis: allowance; CASH_HSA basis: retail)" }
      - { name: insurer_paid_cents, type: number, source: computed, description: "Payer payment; 0 for CASH_HSA and after DENIED_FINAL" }
      - { name: patient_resp_cents, type: number, source: computed, description: "Final patient responsibility per pricing variant" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Timestamp of last adjudication; null before" }

  - name: HSAAccount
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; exactly one account per patient, created with the patient" }
      - { name: initial_credit_cents, type: number, source: system, description: "Opening credit from patient creation" }
      - { name: balance_cents, type: number, source: computed, description: "= initial_credit_cents + sum(CREDIT and REVERSAL entries) - sum(DEBIT entries), POSTED entries only" }

  - name: HSALedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: hsa_account_id, type: string, source: system, description: "FK -> HSAAccount.id; owning account (from path)" }
      - { name: entry_type, type: enum, source: system, description: "DEBIT | CREDIT | REVERSAL" }
      - { name: amount_cents, type: number, source: input, description: "Entry amount; must be > 0" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: related_order_id, type: string, source: input, description: "Optional order reference string (not an FK)" }
      - { name: reverses_entry_id, type: string, source: input, description: "For REVERSAL: id of the POSTED DEBIT entry being reversed" }
      - { name: status, type: enum, source: system, default: POSTED, description: "Always POSTED (append-only ledger)" }

  - name: FittingSample
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; sample recipient" }
      - { name: category, type: enum, source: input, description: "OSTOMY | INCONTINENCE | WOUND" }
      - { name: size_code, type: string, source: input, description: "Sample size code" }
      - { name: item_name, type: string, source: input, description: "Free-text sample product name (samples are never billed)" }
      - { name: unit_price_cents, type: number, source: system, default: 0, description: "Always 0; samples are free and non-billable" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SHIPPED | OUTCOME_RECORDED" }
      - { name: outcome, type: enum, source: system, description: "CONVERTED | NOT_CONVERTED; null until record-outcome" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patient
    initial_state: PENDING_VERIFICATION
    terminal_states: [INELIGIBLE]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /api/patients/{id}/verify-eligibility with eligible=true"
        actor: IntakeCoordinator
        preconditions: ["patient.status == PENDING_VERIFICATION", "patient.payer_plan_id references a PayerPlan with is_active == true"]
        side_effects: ["increments Patient.version by 1"]
      - from: PENDING_VERIFICATION
        to: INELIGIBLE
        trigger: "POST /api/patients/{id}/verify-eligibility with eligible=false"
        actor: IntakeCoordinator
        preconditions: ["patient.status == PENDING_VERIFICATION"]
        side_effects: ["increments Patient.version by 1"]

  - entity: Prescription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/prescriptions/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["prescription.status == ACTIVE"]
        side_effects: ["increments Prescription.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy evaluation whenever the prescription is read or referenced by a validation and current_date >= expiration_date"
        actor: system
        preconditions: ["prescription.status == ACTIVE", "current logical date >= prescription.expiration_date"]
        side_effects: ["increments Prescription.version by 1"]

  - entity: FitProfile
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system: POST /api/fit-profiles creates a new profile for the same patient_id + category"
        actor: system
        preconditions: ["an existing FitProfile with status == CURRENT for the same patient_id and category"]
        side_effects: ["prior profile status -> SUPERSEDED", "new profile status == CURRENT", "increments Patient.version by 1 (OCC parent)"]

  - entity: ResupplyProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/resupply-programs/{id}/confirm-cycle"
        actor: [Patient, IntakeCoordinator]
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_SUSPENDED)"
          - "patient.status == ACTIVE (else ERR_PATIENT_NOT_ACTIVE)"
          - "current logical date >= program.next_eligible_date (else ERR_RESUPPLY_WINDOW_NOT_OPEN)"
          - "item selector pool non-empty (else ERR_NO_ELIGIBLE_ITEM); selector: FormularyItem where status == ACTIVE, category == program.category, patient.payer_plan_id IN covered_plan_ids, current FitProfile size_code IN item.size_codes, and (requires_pa == false OR an APPROVED PriorAuthorization for patient+hcpcs with valid_from <= today <= valid_to exists); ranking unit_allowance_cents ASC, tie-break FormularyItem.created_at ASC"
        side_effects:
          - "creates SupplyOrder (origin=PROGRAM_CYCLE, resupply_program_id=program.id, fulfillment DRAFT -> SUBMITTED immediately)"
          - "creates one OrderLine on that order: selected item, size = CURRENT FitProfile size_code, quantity = resupply_quantity_allowance"
          - "increments ResupplyProgram.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/resupply-programs/{id}/suspend (manual) OR system cascade (adherence final < 0.50 after a return, or HSA balance < REORDER_FLOOR_CENTS after a denial debit)"
        actor: [IntakeCoordinator, system]
        preconditions: ["program.status == ACTIVE"]
        side_effects: ["suspend_reason set (manual reason | LOW_ADHERENCE | HSA_FLOOR_BREACH)", "increments ResupplyProgram.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/resupply-programs/{id}/resume"
        actor: IntakeCoordinator
        preconditions: ["program.status == SUSPENDED (else ERR_PROGRAM_NOT_SUSPENDED)"]
        side_effects: ["suspend_reason cleared to null", "increments ResupplyProgram.version by 1"]

  - entity: SupplyOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    note: "Two parallel state dimensions on one row: fulfillment_status (DRAFT|SUBMITTED|IN_FULFILLMENT|FULFILLED|CANCELLED) and billing_status (UNBILLED|CLAIM_DRAFT|CLAIM_SUBMITTED|CLAIM_DENIED|APPEAL_PENDING|PAID_SETTLED|PATIENT_BILLED) evolve independently."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/orders/{id}/submit"
        actor: [Patient, IntakeCoordinator]
        preconditions:
          - "fulfillment_status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "at least one OrderLine exists (else ERR_INVALID_REQUEST)"
          - "every line hcpcs_code covered by a Prescription with status == ACTIVE and effective_date <= today < expiration_date (else ERR_NO_VALID_PRESCRIPTION)"
          - "for CASH_HSA plan: estimated patient responsibility (sum of retail_price_cents * quantity) <= HSAAccount.balance_cents (else ERR_INSUFFICIENT_HSA)"
        side_effects: ["recomputes total_allowed_cents and total_patient_resp_cents", "increments SupplyOrder.version by 1"]
      - from: SUBMITTED
        to: IN_FULFILLMENT
        trigger: "POST /api/shipments (creates shipment for this order)"
        actor: FulfillmentAgent
        preconditions: ["fulfillment_status == SUBMITTED"]
        side_effects:
          - "reserves stock per line: reserved_qty += min(line.quantity, available); shortage creates BackorderReservation(PENDING, quantity_pending = shortage)"
          - "shipment status = CREATED if fully reserved else BACKORDERED"
          - "increments SupplyOrder.version by 1"
      - from: IN_FULFILLMENT
        to: FULFILLED
        trigger: "system: bubble-up when at least one shipment is DELIVERED and no shipment of the order is in CREATED|BACKORDERED|READY|SHIPPED"
        actor: system
        preconditions: ["fulfillment_status == IN_FULFILLMENT"]
        side_effects: ["increments SupplyOrder.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: [Patient, IntakeCoordinator]
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED}"]
        side_effects: ["no shipments exist yet in DRAFT; from SUBMITTED none either (shipment creation moves to IN_FULFILLMENT)", "increments SupplyOrder.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: [Patient, IntakeCoordinator]
        preconditions: ["fulfillment_status IN {DRAFT, SUBMITTED}"]
        side_effects: ["increments SupplyOrder.version by 1"]
      - from: IN_FULFILLMENT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: [Patient, IntakeCoordinator]
        preconditions: ["fulfillment_status == IN_FULFILLMENT", "every shipment of the order is in CREATED|BACKORDERED (none READY or beyond)"]
        side_effects:
          - "each CREATED|BACKORDERED shipment -> CANCELLED"
          - "each cancelled shipment releases its reservations: reserved_qty -= (reserved + allocated-for-that-line), PENDING|PARTIALLY_ALLOCATED BackorderReservations -> CANCELLED"
          - "increments SupplyOrder.version by 1"
    # billing_status transitions (parallel dimension, same rows keyed by trigger):
    #   UNBILLED -> CLAIM_DRAFT        on POST /api/claims
    #   CLAIM_DRAFT -> CLAIM_SUBMITTED on POST /api/claims/{id}/submit
    #   CLAIM_SUBMITTED -> PAID_SETTLED on adjudicate PAID
    #   CLAIM_SUBMITTED -> CLAIM_DENIED on adjudicate DENIED
    #   CLAIM_DENIED -> APPEAL_PENDING  on POST /api/claims/{id}/appeal
    #   APPEAL_PENDING -> PAID_SETTLED  on adjudicate PAID
    #   APPEAL_PENDING -> PATIENT_BILLED on adjudicate DENIED (final)

  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [APPROVED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/prior-authorizations/{id}/decision with outcome=APPROVED"
        actor: PriorAuthSpecialist
        preconditions: ["pa.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["increments PriorAuthorization.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/prior-authorizations/{id}/decision with outcome=DENIED"
        actor: PriorAuthSpecialist
        preconditions: ["pa.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["increments PriorAuthorization.version by 1"]
      - from: APPEALED
        to: APPROVED
        trigger: "POST /api/prior-authorizations/{id}/decision with outcome=APPROVED"
        actor: PriorAuthSpecialist
        preconditions: ["pa.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["increments PriorAuthorization.version by 1"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /api/prior-authorizations/{id}/decision with outcome=DENIED"
        actor: PriorAuthSpecialist
        preconditions: ["pa.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["increments PriorAuthorization.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /api/prior-authorizations/{id}/appeal"
        actor: PriorAuthSpecialist
        preconditions: ["pa.status == DENIED"]
        side_effects: ["appeal_count += 1", "increments PriorAuthorization.version by 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: lazy evaluation when read or referenced and current_date > valid_to"
        actor: system
        preconditions: ["pa.status == APPROVED", "current logical date > pa.valid_to"]
        side_effects: ["increments PriorAuthorization.version by 1"]

  - entity: Shipment
    initial_state: CREATED
    terminal_states: [DELIVERED, RETURNED, CANCELLED]
    transitions:
      - from: BACKORDERED
        to: CREATED
        trigger: "system: restock allocation fully covers every BackorderReservation of the order's lines"
        actor: system
        preconditions: ["shipment.status == BACKORDERED", "all lines' reservations status == ALLOCATED"]
        side_effects: ["increments Shipment.version by 1"]
      - from: CREATED
        to: READY
        trigger: "POST /api/shipments/{id}/release"
        actor: FulfillmentAgent
        preconditions:
          - "shipment.status == CREATED (BACKORDERED -> ERR_SHIPMENT_BACKORDERED)"
          - "for every order line whose item requires_pa == true, evaluated against stored PA rows (lazy EXPIRED flip applies only on direct PA reads, not here): pass if an APPROVED PA for (patient, hcpcs_code) has valid_from <= today <= valid_to; else if an APPROVED PA exists but today > valid_to -> ERR_PRIOR_AUTH_EXPIRED; else (no APPROVED PA at all) -> ERR_PRIOR_AUTH_REQUIRED"
        side_effects: ["increments Shipment.version by 1"]
      - from: READY
        to: SHIPPED
        trigger: "POST /api/shipments/{id}/ship"
        actor: FulfillmentAgent
        preconditions: ["shipment.status == READY"]
        side_effects: ["shipped_date = current logical date", "physical dispatch: for each shipped line, StockLevel.on_hand_qty -= line reserved units and reserved_qty -= same (available_qty unchanged by the ship itself)", "program adherence recompute (in-transit counts in provisional)", "increments Shipment.version by 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/deliver"
        actor: FulfillmentAgent
        preconditions: ["shipment.status == SHIPPED"]
        side_effects:
          - "delivered_date = current logical date"
          - "if order.resupply_program_id is not null: program.last_delivered_date = delivered_date; program.next_eligible_date = delivered_date + frequency_days; adherence scores recomputed; increments ResupplyProgram.version by 1"
          - "order bubble-up FULFILLED check"
          - "increments Shipment.version by 1"
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /api/shipments/{id}/return"
        actor: FulfillmentAgent
        preconditions: ["shipment.status IN {SHIPPED, DELIVERED}"]
        side_effects:
          - "returned cycle counts as NON-adherent; program adherence scores recomputed"
          - "cascade: if program.adherence_score_final < 0.50 then program -> SUSPENDED with suspend_reason=LOW_ADHERENCE"
          - "order bubble-up FULFILLED check (RETURNED counts as closed)"
          - "increments Shipment.version by 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /api/shipments/{id}/return"
        actor: FulfillmentAgent
        preconditions: ["shipment.status IN {SHIPPED, DELIVERED}"]
        side_effects:
          - "returned cycle counts as NON-adherent; program adherence scores recomputed (last_delivered_date and next_eligible_date are NOT rolled back)"
          - "cascade: if program.adherence_score_final < 0.50 then program -> SUSPENDED with suspend_reason=LOW_ADHERENCE"
          - "increments Shipment.version by 1"
      - from: CREATED
        to: CANCELLED
        trigger: "system: parent order cancelled"
        actor: system
        preconditions: ["shipment.status IN {CREATED, BACKORDERED}"]
        side_effects: ["releases reserved stock and cancels open BackorderReservations", "increments Shipment.version by 1"]
      - from: BACKORDERED
        to: CANCELLED
        trigger: "system: parent order cancelled"
        actor: system
        preconditions: ["shipment.status IN {CREATED, BACKORDERED}"]
        side_effects: ["releases reserved stock and cancels open BackorderReservations", "increments Shipment.version by 1"]

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED_FINAL]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions: ["claim.status == DRAFT"]
        side_effects: ["order.billing_status CLAIM_DRAFT -> CLAIM_SUBMITTED", "increments Claim.version by 1", "increments SupplyOrder.version by 1"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /api/claims/{id}/adjudicate with outcome=PAID"
        actor: BillingSpecialist
        preconditions: ["claim.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["insurer_paid_cents = total_allowed_cents - patient_resp_cents", "adjudicated_at set", "order.billing_status -> PAID_SETTLED", "increments Claim.version by 1", "increments SupplyOrder.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/claims/{id}/adjudicate with outcome=DENIED"
        actor: BillingSpecialist
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["adjudicated_at set", "order.billing_status -> CLAIM_DENIED", "increments Claim.version by 1", "increments SupplyOrder.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /api/claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions: ["claim.status == DENIED (PAID -> ERR_INVALID_STATE)"]
        side_effects: ["order.billing_status -> APPEAL_PENDING", "increments Claim.version by 1", "increments SupplyOrder.version by 1"]
      - from: APPEALED
        to: PAID
        trigger: "POST /api/claims/{id}/adjudicate with outcome=PAID"
        actor: BillingSpecialist
        preconditions: ["claim.status IN {SUBMITTED, APPEALED}"]
        side_effects: ["insurer_paid_cents = total_allowed_cents - patient_resp_cents", "adjudicated_at set", "order.billing_status -> PAID_SETTLED", "increments Claim.version by 1", "increments SupplyOrder.version by 1"]
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /api/claims/{id}/adjudicate with outcome=DENIED"
        actor: BillingSpecialist
        preconditions: ["claim.status == APPEALED"]
        side_effects:
          - "patient_resp_cents recomputed as total_allowed_cents (full allowed amount shifts to patient)"
          - "order.billing_status -> PATIENT_BILLED"
          - "posts HSALedgerEntry DEBIT amount = patient_resp_cents on the patient's HSAAccount (requires sufficient balance, else ERR_INSUFFICIENT_HSA)"
          - "cascade: if post-debit HSAAccount.balance_cents < REORDER_FLOOR_CENTS (500), every ACTIVE ResupplyProgram of the patient -> SUSPENDED with suspend_reason=HSA_FLOOR_BREACH"
          - "adjudicated_at set; increments Claim.version by 1; increments SupplyOrder.version by 1"

  - entity: BackorderReservation
    initial_state: PENDING
    terminal_states: [ALLOCATED, CANCELLED]
    transitions:
      - from: PENDING
        to: PARTIALLY_ALLOCATED
        trigger: "system: POST /api/stock-levels/{id}/restock allocates fewer units than quantity_pending"
        actor: system
        preconditions: ["reservation.status IN {PENDING, PARTIALLY_ALLOCATED}"]
        side_effects: ["quantity_pending -= alloc", "quantity_allocated += alloc", "StockLevel.reserved_qty += alloc"]
      - from: PENDING
        to: ALLOCATED
        trigger: "system: restock allocation covers remaining quantity_pending"
        actor: system
        preconditions: ["reservation.status IN {PENDING, PARTIALLY_ALLOCATED}"]
        side_effects: ["quantity_pending = 0", "StockLevel.reserved_qty += alloc", "shipment BACKORDERED -> CREATED when all reservations allocated"]
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "system: restock allocation covers remaining quantity_pending"
        actor: system
        preconditions: ["reservation.status IN {PENDING, PARTIALLY_ALLOCATED}"]
        side_effects: ["quantity_pending = 0", "StockLevel.reserved_qty += alloc", "shipment BACKORDERED -> CREATED when all reservations allocated"]
      - from: PENDING
        to: CANCELLED
        trigger: "system: parent order cancelled"
        actor: system
        preconditions: ["reservation.status IN {PENDING, PARTIALLY_ALLOCATED}"]
        side_effects: ["StockLevel.reserved_qty -= quantity_allocated (release what had been reserved for this line)"]
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "system: parent order cancelled"
        actor: system
        preconditions: ["reservation.status IN {PENDING, PARTIALLY_ALLOCATED}"]
        side_effects: ["StockLevel.reserved_qty -= quantity_allocated"]

  - entity: FittingSample
    initial_state: REQUESTED
    terminal_states: [OUTCOME_RECORDED]
    transitions:
      - from: REQUESTED
        to: SHIPPED
        trigger: "POST /api/fitting-samples/{id}/ship"
        actor: FulfillmentAgent
        preconditions: ["sample.status == REQUESTED"]
        side_effects: ["increments FittingSample.version by 1"]
      - from: SHIPPED
        to: OUTCOME_RECORDED
        trigger: "POST /api/fitting-samples/{id}/record-outcome"
        actor: IntakeCoordinator
        preconditions: ["sample.status == SHIPPED"]
        side_effects: ["outcome set to input (CONVERTED | NOT_CONVERTED)", "increments FittingSample.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: fit-profile-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /api/fit-profiles"
    occ_field: "expected_patient_version"
    description: |
      Creating a FitProfile against a Patient whose version has advanced since
      the client last observed it is rejected. Creating a profile legitimately
      supersedes the prior CURRENT profile for that patient+category, so a
      writer holding a stale view of the patient must be refused rather than
      allowed to supersede blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-line-add-stale-order
    parent_entity: SupplyOrder
    write_endpoint: "POST /api/orders/{id}/lines"
    occ_field: "expected_order_version"
    description: |
      Adding an OrderLine to a SupplyOrder whose version has advanced since
      the client last observed it is rejected. A stale writer would otherwise
      price and validate its line against an out-of-date line set.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_allowance_proration
    trigger: "FormularyItem creation; OrderLine creation (line_allowed_cents)"
    algorithm: tiered_pricing
    formula: |
      step 1: unit_allowance_cents = round_half_up(pack_fee_cents / pack_size, 2)
      step 2: line_allowed_cents    = round_half_up(unit_allowance_cents * quantity, 2)
      PINNED ORDER: the per-unit proration is rounded FIRST, then multiplied.
      The alternative order round_half_up(pack_fee_cents * quantity / pack_size, 2)
      is FORBIDDEN because it yields different cents (e.g. 999/8 -> 124.88, *3 =
      374.64 pinned vs 374.63 under the forbidden single-round order).
    input_set: "FormularyItem.pack_fee_cents, pack_size; OrderLine.quantity"
    constants:
      ROUNDING: round_half_up
      SCALE: 2
    precision: "2 decimal places, round_half_up"

  - name: resupply_quantity_allowance
    trigger: "POST /api/resupply-programs/{id}/confirm-cycle (sets the created OrderLine.quantity)"
    algorithm: constraint_propagation
    formula: |
      rx_cap      = rx.monthly_quantity * plan.cycle_months
                    (rx = the ACTIVE Prescription covering the selected item's
                     hcpcs_code with effective_date <= today < expiration_date)
      item_cap    = item.max_units_per_cycle
      pa_cap      = (item.requires_pa == true) ? pa.approved_units : +infinity
                    (pa = APPROVED PriorAuthorization for patient+hcpcs whose
                     closed window [valid_from, valid_to] contains today)
      qty_allowed = min(rx_cap, item_cap, pa_cap)
      If qty_allowed < 1 -> the confirm fails with ERR_QUANTITY_EXCEEDS_ALLOWANCE.
    input_set: "selected FormularyItem, covering Prescription (status ACTIVE), patient's PayerPlan, APPROVED PriorAuthorization when required"
    constants: {}
    precision: "integer units"

  - name: claim_patient_responsibility
    trigger: "POST /api/claims (initial pricing); re-priced on adjudicate DENIED from APPEALED (DENIED_FINAL)"
    algorithm: aggregation
    formula: |
      total_allowed_cents = sum over lines of line basis:
        INSURED basis: line.line_allowed_cents
        CASH_HSA basis: round_half_up(item.retail_price_cents * line.quantity, 2)
      patient_resp_cents:
        variant INSURED (plan_type MEDICARE_DMEPOS | COMMERCIAL):
          per line: round_half_up(line_allowed_cents * plan.coinsurance_pct, 2);
          patient_resp_cents = sum of per-line coinsurance (round per line, THEN sum)
        variant CASH_HSA (plan_type CASH_HSA):
          patient_resp_cents = total_allowed_cents (coinsurance_pct is 1.00 on retail basis)
        variant DENIED_FINAL (any plan, claim adjudicated DENIED from APPEALED):
          patient_resp_cents = total_allowed_cents; insurer pays 0
      insurer_paid_cents = total_allowed_cents - patient_resp_cents (PAID only; else 0)
    input_set: "SupplyOrder lines (all statuses of line count; order must be FULFILLED), patient PayerPlan"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: INSURED
        when: "patient plan_type IN {MEDICARE_DMEPOS, COMMERCIAL} and claim not DENIED_FINAL"
        difference: "allowed basis = fee-schedule allowance; patient pays per-line coinsurance rounded then summed; insurer pays the remainder"
      - name: CASH_HSA
        when: "patient plan_type == CASH_HSA"
        difference: "allowed basis = retail price; patient pays 100%; insurer_paid_cents == 0"

  - name: adherence_scores
    trigger: "Shipment ship / deliver / return transitions; read of ResupplyProgram"
    algorithm: forward_looking
    formula: |
      cycles_due  = floor((current_date - start_date) / frequency_days) + 1
                    (evaluated only when current_date >= start_date)
      delivered   = count of program orders with a shipment in DELIVERED status
      in_transit  = count of program orders with a shipment in SHIPPED status
      returned    = counts toward NEITHER delivered nor in_transit
      adherence_score_final       = round_half_up(delivered / cycles_due, 2)
      adherence_score_provisional = round_half_up((delivered + in_transit) / cycles_due, 2)
      SUSPENSION RULE: program auto-suspends when adherence_score_final < 0.50
      (a final score of exactly 0.50 does NOT suspend).
    input_set: "SupplyOrders where resupply_program_id == program.id, origin == PROGRAM_CYCLE, fulfillment_status != CANCELLED, and their shipments"
    constants:
      SUSPEND_THRESHOLD: 0.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "forward-looking monitoring view"
        difference: "in-transit (SHIPPED) cycles count as adherent"
      - name: final
        when: "suspension gating"
        difference: "only DELIVERED cycles count; same data yields a lower score whenever any cycle is in transit"

  - name: next_eligible_date
    trigger: "ResupplyProgram creation; Shipment deliver transition for a program order"
    algorithm: chronological
    formula: |
      at creation:          next_eligible_date = start_date
      after each delivery:  next_eligible_date = delivered_date + frequency_days
      ELIGIBILITY: confirm-cycle is allowed iff current_date >= next_eligible_date
      (equality IS eligible; one day before is not).
    input_set: "ResupplyProgram start_date, frequency_days, last_delivered_date"
    constants: {}
    precision: "whole days"

  - name: backorder_allocation
    trigger: "POST /api/stock-levels/{id}/restock"
    algorithm: waterfall_allocation
    formula: |
      remaining = qty_added (added to on_hand_qty first)
      candidate set: BackorderReservations of this item's order lines with
        status IN {PENDING, PARTIALLY_ALLOCATED}
      processing order: reservation.created_at ASC; tie-break: parent
        SupplyOrder.created_at ASC
      for each reservation in order while remaining > 0:
        alloc = min(quantity_pending, remaining)
        quantity_pending -= alloc; quantity_allocated += alloc
        StockLevel.reserved_qty += alloc; remaining -= alloc
        status -> ALLOCATED when quantity_pending == 0 else PARTIALLY_ALLOCATED
      when every reservation of a BACKORDERED shipment is ALLOCATED:
        shipment -> CREATED
    input_set: "BackorderReservations joined via OrderLine.formulary_item_id == stock.formulary_item_id"
    constants: {}
    precision: "integer units"

  - name: hsa_balance
    trigger: "POST /api/hsa-accounts/{id}/debits and /credits; claim DENIED_FINAL cascade"
    algorithm: aggregation
    formula: |
      balance_cents = initial_credit_cents
                      + sum(amount_cents of POSTED entries with entry_type IN {CREDIT, REVERSAL})
                      - sum(amount_cents of POSTED entries with entry_type == DEBIT)
      DEBIT acceptance: amount_cents <= balance_cents (equality is allowed and
      leaves balance 0.00); amount > balance -> ERR_INSUFFICIENT_HSA.
      REVERSAL acceptance: reverses_entry_id must reference a POSTED DEBIT entry
      of the same account, else ERR_HSA_ENTRY_NOT_REVERSIBLE.
    input_set: "HSALedgerEntries where hsa_account_id == account.id, status == POSTED"
    constants:
      REORDER_FLOOR_CENTS: 500
    precision: "2 decimal places, round_half_up"

  - name: sample_window_count
    trigger: "POST /api/fitting-samples"
    algorithm: threshold
    formula: |
      window = [current_date - 90 days, current_date]  (CLOSED lookback: a sample
      created exactly 90 days ago still counts)
      count = FittingSamples for patient_id + category with created_at date IN window
      create is rejected with ERR_SAMPLE_LIMIT_EXCEEDED when count >= 2
      (the 2nd sample succeeds; the 3rd fails).
    input_set: "FittingSamples for the patient and category, all statuses"
    constants:
      SAMPLE_WINDOW_DAYS: 90
      MAX_SAMPLES_PER_CATEGORY_PER_90D: 2
    precision: "whole days"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is in the endpoint's roles; for role Patient, resource.patient_id must equal X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids resolve left-to-right; body FK ids (patient_id, formulary_item_id, payer_plan_id, resupply_program_id, order_id) resolve", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "generic invalid state-machine transition (from-state has no such trigger; terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "order fulfillment_status == DRAFT for line-add and submit", error_id: ERR_ORDER_NOT_DRAFT, http_status: 409, applies_to: ["POST /api/orders/{id}/lines", "POST /api/orders/{id}/submit"] }
  - { priority: 4, category: state, check: "program.status == ACTIVE for confirm-cycle", error_id: ERR_PROGRAM_SUSPENDED, http_status: 409, applies_to: ["POST /api/resupply-programs/{id}/confirm-cycle"] }
  - { priority: 4, category: state, check: "program.status == SUSPENDED for resume", error_id: ERR_PROGRAM_NOT_SUSPENDED, http_status: 409, applies_to: ["POST /api/resupply-programs/{id}/resume"] }
  - { priority: 4, category: state, check: "patient.status == ACTIVE for program creation, order creation, confirm-cycle, sample creation", error_id: ERR_PATIENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /api/resupply-programs", "POST /api/orders", "POST /api/resupply-programs/{id}/confirm-cycle", "POST /api/fitting-samples"] }
  - { priority: 4, category: state, check: "shipment.status == CREATED for release (BACKORDERED has its own error)", error_id: ERR_SHIPMENT_BACKORDERED, http_status: 409, applies_to: ["POST /api/shipments/{id}/release"] }
  - { priority: 4, category: state, check: "claim creatable: order FULFILLED, billing UNBILLED, no existing claim for the order", error_id: ERR_CLAIM_NOT_SUBMITTABLE, http_status: 409, applies_to: ["POST /api/claims"] }
  - { priority: 4, category: state, check: "credits with reverses_entry_id reference a POSTED DEBIT of the same account", error_id: ERR_HSA_ENTRY_NOT_REVERSIBLE, http_status: 409, applies_to: ["POST /api/hsa-accounts/{id}/credits"] }
  - { priority: 5, category: business_safety, check: "Rx creation for a MEDICARE_DMEPOS patient requires >= 1 diagnosis code", error_id: ERR_DIAGNOSIS_REQUIRED, http_status: 422, applies_to: ["POST /api/prescriptions"] }
  - { priority: 5, category: business_safety, check: "line hcpcs covered by an ACTIVE, currently-valid Prescription (line-add: existence of covering Rx; submit: window contains today)", error_id: ERR_NO_VALID_PRESCRIPTION, http_status: 422, applies_to: ["POST /api/orders/{id}/lines", "POST /api/orders/{id}/submit", "POST /api/resupply-programs/{id}/confirm-cycle"] }
  - { priority: 5, category: business_safety, check: "every requires_pa line has an APPROVED PA for (patient, hcpcs) at shipment release", error_id: ERR_PRIOR_AUTH_REQUIRED, http_status: 422, applies_to: ["POST /api/shipments/{id}/release"] }
  - { priority: 5, category: business_safety, check: "sample count in rolling 90-day closed window < 2 per patient+category", error_id: ERR_SAMPLE_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /api/fitting-samples"] }
  - { priority: 6, category: business_constraint, check: "patient.payer_plan_id IN item.covered_plan_ids", error_id: ERR_ITEM_NOT_ON_FORMULARY, http_status: 422, applies_to: ["POST /api/orders/{id}/lines"] }
  - { priority: 6, category: business_constraint, check: "line size_code IN item.size_codes AND equals the CURRENT FitProfile size_code for the item category (missing profile also fails)", error_id: ERR_SIZE_MISMATCH, http_status: 422, applies_to: ["POST /api/orders/{id}/lines"] }
  - { priority: 6, category: business_constraint, check: "at most one ACTIVE ResupplyProgram per patient+category", error_id: ERR_DUPLICATE_PROGRAM, http_status: 409, applies_to: ["POST /api/resupply-programs"] }
  - { priority: 6, category: business_constraint, check: "at most one StockLevel per formulary_item_id", error_id: ERR_DUPLICATE_STOCK_LEVEL, http_status: 409, applies_to: ["POST /api/stock-levels"] }
  - { priority: 6, category: business_constraint, check: "no overlapping ACTIVE Prescription for same patient+hcpcs; half-open [effective_date, expiration_date); adjacency (new.effective == existing.expiration) is ALLOWED", error_id: ERR_PRESCRIPTION_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/prescriptions"] }
  - { priority: 6, category: business_constraint, check: "no overlapping PriorAuthorization for same patient+hcpcs among statuses {SUBMITTED, APPEALED, APPROVED}; CLOSED [valid_from, valid_to]; adjacency (new.valid_from == existing.valid_to) IS an overlap", error_id: ERR_AUTH_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/prior-authorizations"] }
  - { priority: 6, category: business_constraint, check: "line quantity <= resupply_quantity_allowance for the patient's plan/Rx/item[/PA]", error_id: ERR_QUANTITY_EXCEEDS_ALLOWANCE, http_status: 422, applies_to: ["POST /api/orders/{id}/lines", "POST /api/resupply-programs/{id}/confirm-cycle"] }
  - { priority: 7, category: business_temporal, check: "current logical date >= program.next_eligible_date", error_id: ERR_RESUPPLY_WINDOW_NOT_OPEN, http_status: 422, applies_to: ["POST /api/resupply-programs/{id}/confirm-cycle"] }
  - { priority: 7, category: business_temporal, check: "APPROVED PA window contains release date; APPROVED but today > valid_to fails here", error_id: ERR_PRIOR_AUTH_EXPIRED, http_status: 422, applies_to: ["POST /api/shipments/{id}/release"] }
  - { priority: 8, category: business_fiscal, check: "HSA sufficiency: debit amount <= balance; CASH_HSA order submit: estimated patient responsibility <= balance", error_id: ERR_INSUFFICIENT_HSA, http_status: 422, applies_to: ["POST /api/hsa-accounts/{id}/debits", "POST /api/orders/{id}/submit", "POST /api/claims/{id}/adjudicate"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- config ----
  - { method: POST, path: "/api/payer-plans", description: "Create a payer plan", roles: [PlatformAdmin], code: 201, input: [name, plan_type, coinsurance_pct, cycle_months, "is_active?"], output: PayerPlan, side_effects: [] }
  - { method: GET, path: "/api/payer-plans/{id}", description: "Read one plan", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: [], output: PayerPlan, side_effects: [] }
  - { method: GET, path: "/api/payer-plans/{id}/patients", description: "Patients on a plan (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator], code: 200, input: ["limit?", "offset?"], output: "Patient[]", side_effects: [] }
  - { method: POST, path: "/api/formulary-items", description: "Create a formulary item; computes unit_allowance_cents", roles: [PlatformAdmin], code: 201, input: [hcpcs_code, name, category, covered_plan_ids, pack_fee_cents, pack_size, retail_price_cents, max_units_per_cycle, "requires_pa?", size_codes], output: FormularyItem, side_effects: ["computes unit_allowance_cents per unit_allowance_proration"] }
  - { method: GET, path: "/api/formulary-items/{id}", description: "Read one item", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: [], output: FormularyItem, side_effects: [] }
  - { method: GET, path: "/api/formulary-items", description: "List items with optional category filter and pagination", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: ["category?", "limit?", "offset?"], output: "FormularyItem[]", side_effects: [] }
  - { method: GET, path: "/api/formulary-items/{id}/order-lines", description: "Lines referencing an item (FK reverse)", roles: [PlatformAdmin, FulfillmentAgent, BillingSpecialist], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/api/formulary-items/{id}/stock-levels", description: "Stock row for an item (FK reverse; array of 0-1)", roles: [PlatformAdmin, FulfillmentAgent], code: 200, input: [], output: "StockLevel[]", side_effects: [] }

  # ---- patients ----
  - { method: POST, path: "/api/patients", description: "Enroll a patient; auto-creates the HSAAccount with the opening credit", roles: [IntakeCoordinator], code: 201, input: [full_name, date_of_birth, payer_plan_id, hsa_initial_credit_cents], output: Patient, side_effects: ["creates HSAAccount (initial_credit_cents = hsa_initial_credit_cents, balance = same)"] }
  - { method: GET, path: "/api/patients/{id}", description: "Read one patient", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: [], output: Patient, side_effects: [] }
  - { method: GET, path: "/api/patients", description: "List patients with filters and pagination envelope", roles: [PlatformAdmin, IntakeCoordinator, BillingSpecialist], code: 200, input: ["payer_plan_id?", "status?", "limit?", "offset?"], output: "Patient[]", side_effects: [] }
  - { method: POST, path: "/api/patients/{id}/verify-eligibility", description: "Verify coverage eligibility: PENDING_VERIFICATION -> ACTIVE (eligible=true) or INELIGIBLE (false)", roles: [IntakeCoordinator], code: 200, input: [eligible, "reason?"], output: Patient, side_effects: ["increments Patient.version by 1"] }
  - { method: GET, path: "/api/patients/{id}/prescriptions", description: "Patient's prescriptions (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: ["status?", "limit?", "offset?"], output: "Prescription[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/fit-profiles", description: "Patient's fit profiles (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: ["category?", "status?", "limit?", "offset?"], output: "FitProfile[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/resupply-programs", description: "Patient's programs (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: ["status?", "limit?", "offset?"], output: "ResupplyProgram[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/orders", description: "Patient's orders (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, BillingSpecialist, Patient], code: 200, input: ["fulfillment_status?", "limit?", "offset?"], output: "SupplyOrder[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/prior-authorizations", description: "Patient's PAs (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, Patient], code: 200, input: ["hcpcs_code?", "status?", "limit?", "offset?"], output: "PriorAuthorization[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/hsa-accounts", description: "Patient's HSA account (FK reverse; array of 0-1)", roles: [PlatformAdmin, IntakeCoordinator, BillingSpecialist, Patient], code: 200, input: [], output: "HSAAccount[]", side_effects: [] }
  - { method: GET, path: "/api/patients/{id}/fitting-samples", description: "Patient's samples (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: ["category?", "limit?", "offset?"], output: "FittingSample[]", side_effects: [] }

  # ---- prescriptions ----
  - { method: POST, path: "/api/prescriptions", description: "Create an ACTIVE prescription; half-open window overlap with an ACTIVE same-hcpcs Rx is rejected", roles: [IntakeCoordinator], code: 201, input: [patient_id, hcpcs_code, prescriber_npi, "diagnosis_codes?", monthly_quantity, effective_date, expiration_date], output: Prescription, side_effects: [] }
  - { method: GET, path: "/api/prescriptions/{id}", description: "Read one prescription (lazy EXPIRED evaluation)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: [], output: Prescription, side_effects: [] }
  - { method: POST, path: "/api/prescriptions/{id}/cancel", description: "Cancel an ACTIVE prescription", roles: [IntakeCoordinator], code: 200, input: [], output: Prescription, side_effects: ["increments Prescription.version by 1"] }

  # ---- fit profiles (OCC create-with-supersede) ----
  - { method: POST, path: "/api/fit-profiles", description: "Create a fit profile; supersedes the prior CURRENT profile for the same patient+category; OCC on Patient.version", roles: [IntakeCoordinator], code: 201, input: [patient_id, category, size_code, measured_on, expected_patient_version], output: FitProfile, side_effects: ["prior CURRENT FitProfile for patient+category -> SUPERSEDED", "increments Patient.version by 1"] }
  - { method: GET, path: "/api/fit-profiles/{id}", description: "Read one fit profile", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: [], output: FitProfile, side_effects: [] }

  # ---- resupply programs ----
  - { method: POST, path: "/api/resupply-programs", description: "Enroll patient in a recurring resupply program; one ACTIVE per patient+category", roles: [IntakeCoordinator], code: 201, input: [patient_id, category, frequency_days, start_date], output: ResupplyProgram, side_effects: ["next_eligible_date = start_date"] }
  - { method: GET, path: "/api/resupply-programs/{id}", description: "Read one program (recomputes adherence scores)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: [], output: ResupplyProgram, side_effects: [] }
  - { method: POST, path: "/api/resupply-programs/{id}/confirm-cycle", description: "Confirm the due cycle; selects item per selector policy, creates a SUBMITTED program order with one allowance-quantity line", roles: [Patient, IntakeCoordinator], code: 201, input: [], output: SupplyOrder, side_effects: ["creates SupplyOrder + OrderLine per resupply_quantity_allowance and item selector", "increments ResupplyProgram.version by 1"] }
  - { method: POST, path: "/api/resupply-programs/{id}/suspend", description: "Manually suspend an ACTIVE program", roles: [IntakeCoordinator], code: 200, input: [reason], output: ResupplyProgram, side_effects: ["suspend_reason = reason", "increments ResupplyProgram.version by 1"] }
  - { method: POST, path: "/api/resupply-programs/{id}/resume", description: "Resume a SUSPENDED program", roles: [IntakeCoordinator], code: 200, input: [], output: ResupplyProgram, side_effects: ["suspend_reason = null", "increments ResupplyProgram.version by 1"] }
  - { method: GET, path: "/api/resupply-programs/{id}/orders", description: "Program's orders (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: ["limit?", "offset?"], output: "SupplyOrder[]", side_effects: [] }

  # ---- orders ----
  - { method: POST, path: "/api/orders", description: "Create a DRAFT manual reorder (origin=MANUAL_REORDER)", roles: [Patient, IntakeCoordinator], code: 201, input: [patient_id, "resupply_program_id?"], output: SupplyOrder, side_effects: [] }
  - { method: GET, path: "/api/orders/{id}", description: "Read one order (both status dimensions + totals)", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: [], output: SupplyOrder, side_effects: [] }
  - { method: POST, path: "/api/orders/{id}/lines", description: "Add a line to a DRAFT order; OCC on SupplyOrder.version; computes line_allowed_cents with per-unit-first rounding", roles: [Patient, IntakeCoordinator], code: 201, input: [formulary_item_id, size_code, quantity, expected_order_version], output: OrderLine, side_effects: ["computes unit_allowance_cents copy and line_allowed_cents", "recomputes order totals", "increments SupplyOrder.version by 1"] }
  - { method: GET, path: "/api/orders/{id}/lines", description: "Order's lines (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/api/order-lines/{id}", description: "Read one line", roles: [PlatformAdmin, IntakeCoordinator, FulfillmentAgent, BillingSpecialist, Patient], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: POST, path: "/api/orders/{id}/submit", description: "Submit a DRAFT order after Rx/formulary/size/HSA validation", roles: [Patient, IntakeCoordinator], code: 200, input: [], output: SupplyOrder, side_effects: ["fulfillment DRAFT -> SUBMITTED", "recomputes totals", "increments SupplyOrder.version by 1"] }
  - { method: POST, path: "/api/orders/{id}/cancel", description: "Cancel an order; cascades to non-terminal shipments and releases reserved stock", roles: [Patient, IntakeCoordinator], code: 200, input: [], output: SupplyOrder, side_effects: ["shipments CREATED|BACKORDERED -> CANCELLED", "reservations released (reserved_qty decremented, BackorderReservations -> CANCELLED)", "increments SupplyOrder.version by 1"] }

  # ---- shipments & stock ----
  - { method: POST, path: "/api/shipments", description: "Create a shipment for a SUBMITTED order; reserves stock, opens backorder reservations on shortage", roles: [FulfillmentAgent], code: 201, input: [order_id], output: Shipment, side_effects: ["order SUBMITTED -> IN_FULFILLMENT", "stock reservation + BackorderReservation creation per backorder_allocation", "increments SupplyOrder.version by 1"] }
  - { method: GET, path: "/api/shipments/{id}", description: "Read one shipment", roles: [PlatformAdmin, IntakeCoordinator, FulfillmentAgent, Patient], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/api/orders/{id}/shipments", description: "Order's shipments (FK reverse)", roles: [PlatformAdmin, IntakeCoordinator, FulfillmentAgent, Patient], code: 200, input: [], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/release", description: "Release a CREATED shipment; enforces the prior-auth gate", roles: [FulfillmentAgent], code: 200, input: [], output: Shipment, side_effects: ["increments Shipment.version by 1"] }
  - { method: POST, path: "/api/shipments/{id}/ship", description: "Mark READY shipment SHIPPED; stamps shipped_date; adherence recompute", roles: [FulfillmentAgent], code: 200, input: [], output: Shipment, side_effects: ["shipped_date = today", "adherence_scores recompute", "increments Shipment.version by 1"] }
  - { method: POST, path: "/api/shipments/{id}/deliver", description: "Mark SHIPPED shipment DELIVERED; advances program window and adherence", roles: [FulfillmentAgent], code: 200, input: [], output: Shipment, side_effects: ["delivered_date = today", "program last_delivered_date/next_eligible_date/adherence updated", "order FULFILLED bubble-up", "increments Shipment.version by 1"] }
  - { method: POST, path: "/api/shipments/{id}/return", description: "Mark SHIPPED|DELIVERED shipment RETURNED; adherence penalty and possible auto-suspension", roles: [FulfillmentAgent], code: 200, input: [], output: Shipment, side_effects: ["adherence_scores recompute (cycle non-adherent)", "LOW_ADHERENCE auto-suspend cascade when final < 0.50", "increments Shipment.version by 1"] }
  - { method: POST, path: "/api/stock-levels", description: "Create the stock row for an item (one per item)", roles: [PlatformAdmin], code: 201, input: [formulary_item_id, on_hand_qty], output: StockLevel, side_effects: [] }
  - { method: GET, path: "/api/stock-levels/{id}", description: "Read one stock row", roles: [PlatformAdmin, FulfillmentAgent], code: 200, input: [], output: StockLevel, side_effects: [] }
  - { method: POST, path: "/api/stock-levels/{id}/restock", description: "Add on-hand units and run FIFO backorder allocation", roles: [PlatformAdmin], code: 200, input: [qty_added], output: StockLevel, side_effects: ["on_hand_qty += qty_added", "backorder_allocation waterfall", "fully-allocated BACKORDERED shipments -> CREATED"] }
  - { method: GET, path: "/api/order-lines/{id}/backorder-reservations", description: "Line's backorder reservations (FK reverse)", roles: [PlatformAdmin, FulfillmentAgent], code: 200, input: [], output: "BackorderReservation[]", side_effects: [] }

  # ---- prior authorizations ----
  - { method: POST, path: "/api/prior-authorizations", description: "Create a SUBMITTED PA; closed-window overlap with an open PA is rejected", roles: [PriorAuthSpecialist], code: 201, input: [patient_id, hcpcs_code, approved_units, valid_from, valid_to], output: PriorAuthorization, side_effects: [] }
  - { method: GET, path: "/api/prior-authorizations/{id}", description: "Read one PA (lazy EXPIRED evaluation)", roles: [PlatformAdmin, IntakeCoordinator, PriorAuthSpecialist, Patient], code: 200, input: [], output: PriorAuthorization, side_effects: [] }
  - { method: POST, path: "/api/prior-authorizations/{id}/decision", description: "Payer decision: SUBMITTED|APPEALED -> APPROVED|DENIED", roles: [PriorAuthSpecialist], code: 200, input: [outcome, "note?"], output: PriorAuthorization, side_effects: ["increments PriorAuthorization.version by 1"] }
  - { method: POST, path: "/api/prior-authorizations/{id}/appeal", description: "Appeal a DENIED PA (cycle: DENIED -> APPEALED)", roles: [PriorAuthSpecialist], code: 200, input: [], output: PriorAuthorization, side_effects: ["appeal_count += 1", "increments PriorAuthorization.version by 1"] }

  # ---- claims & HSA ----
  - { method: POST, path: "/api/claims", description: "Create a DRAFT claim for a FULFILLED, UNBILLED order; prices per claim_patient_responsibility variant", roles: [BillingSpecialist], code: 201, input: [order_id], output: Claim, side_effects: ["order.billing_status UNBILLED -> CLAIM_DRAFT", "computes total_allowed/insurer_paid/patient_resp", "increments SupplyOrder.version by 1"] }
  - { method: GET, path: "/api/claims/{id}", description: "Read one claim", roles: [PlatformAdmin, BillingSpecialist], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/api/orders/{id}/claims", description: "Order's claims (FK reverse)", roles: [PlatformAdmin, BillingSpecialist], code: 200, input: [], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/api/claims/{id}/submit", description: "Submit a DRAFT claim", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["billing CLAIM_DRAFT -> CLAIM_SUBMITTED"] }
  - { method: POST, path: "/api/claims/{id}/adjudicate", description: "Adjudicate: PAID or DENIED; DENIED from APPEALED -> DENIED_FINAL with HSA debit + floor cascade", roles: [BillingSpecialist], code: 200, input: [outcome], output: Claim, side_effects: ["per Claim state machine; DENIED_FINAL cascade posts HSA DEBIT and may suspend programs"] }
  - { method: POST, path: "/api/claims/{id}/appeal", description: "Appeal a DENIED claim", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["billing CLAIM_DENIED -> APPEAL_PENDING"] }
  - { method: GET, path: "/api/hsa-accounts/{id}", description: "Read one HSA account (recomputed balance)", roles: [PlatformAdmin, IntakeCoordinator, BillingSpecialist, Patient], code: 200, input: [], output: HSAAccount, side_effects: [] }
  - { method: POST, path: "/api/hsa-accounts/{id}/debits", description: "Post a DEBIT entry; amount must be <= balance (equality allowed)", roles: [BillingSpecialist], code: 201, input: [amount_cents, reason, "related_order_id?"], output: HSALedgerEntry, side_effects: ["recomputes HSAAccount.balance_cents"] }
  - { method: POST, path: "/api/hsa-accounts/{id}/credits", description: "Post a CREDIT or REVERSAL entry; REVERSAL requires reverses_entry_id of a POSTED DEBIT", roles: [BillingSpecialist], code: 201, input: [amount_cents, reason, "reverses_entry_id?"], output: HSALedgerEntry, side_effects: ["recomputes HSAAccount.balance_cents"] }
  - { method: GET, path: "/api/hsa-accounts/{id}/entries", description: "Ledger entries (FK reverse)", roles: [PlatformAdmin, BillingSpecialist, Patient], code: 200, input: ["limit?", "offset?"], output: "HSALedgerEntry[]", side_effects: [] }

  # ---- fitting samples ----
  - { method: POST, path: "/api/fitting-samples", description: "Request a free, non-billable fitting sample; rolling 90-day limit of 2 per patient+category", roles: [IntakeCoordinator], code: 201, input: [patient_id, category, size_code, item_name], output: FittingSample, side_effects: [] }
  - { method: GET, path: "/api/fitting-samples/{id}", description: "Read one sample", roles: [PlatformAdmin, IntakeCoordinator, Patient], code: 200, input: [], output: FittingSample, side_effects: [] }
  - { method: POST, path: "/api/fitting-samples/{id}/ship", description: "Ship a REQUESTED sample", roles: [FulfillmentAgent], code: 200, input: [], output: FittingSample, side_effects: ["increments FittingSample.version by 1"] }
  - { method: POST, path: "/api/fitting-samples/{id}/record-outcome", description: "Record fitting outcome for a SHIPPED sample", roles: [IntakeCoordinator], code: 200, input: [outcome], output: FittingSample, side_effects: ["increments FittingSample.version by 1"] }

  # ---- test-driving clock ----
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; lazy EXPIRED evaluations observe the new date on next access"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum value, quantity < 1, malformed date" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or Patient role acting on another patient's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine transition not available from current state; terminal-state lockdown" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Line add or submit on an order whose fulfillment_status != DRAFT" }
  - { id: ERR_PROGRAM_SUSPENDED, http: 409, condition: "confirm-cycle on a SUSPENDED program" }
  - { id: ERR_PROGRAM_NOT_SUSPENDED, http: 409, condition: "resume on a program that is not SUSPENDED" }
  - { id: ERR_PATIENT_NOT_ACTIVE, http: 409, condition: "Operation requires patient.status == ACTIVE" }
  - { id: ERR_DUPLICATE_PROGRAM, http: 409, condition: "An ACTIVE ResupplyProgram already exists for patient+category" }
  - { id: ERR_DUPLICATE_STOCK_LEVEL, http: 409, condition: "A StockLevel already exists for the formulary_item_id" }
  - { id: ERR_PRESCRIPTION_WINDOW_OVERLAP, http: 409, condition: "New Rx half-open window overlaps an ACTIVE Rx for same patient+hcpcs (adjacency allowed)" }
  - { id: ERR_AUTH_WINDOW_OVERLAP, http: 409, condition: "New PA closed window overlaps an open PA (SUBMITTED/APPEALED/APPROVED) for same patient+hcpcs (adjacency counts as overlap)" }
  - { id: ERR_SHIPMENT_BACKORDERED, http: 409, condition: "release on a BACKORDERED shipment" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE, http: 409, condition: "Claim creation when order not FULFILLED, billing not UNBILLED, or a claim already exists for the order" }
  - { id: ERR_HSA_ENTRY_NOT_REVERSIBLE, http: 409, condition: "REVERSAL credit whose reverses_entry_id is not a POSTED DEBIT of the same account" }
  - { id: ERR_NO_VALID_PRESCRIPTION, http: 422, condition: "No ACTIVE, currently-valid Prescription covers the line's hcpcs_code" }
  - { id: ERR_DIAGNOSIS_REQUIRED, http: 422, condition: "Rx for a MEDICARE_DMEPOS patient without diagnosis codes" }
  - { id: ERR_SAMPLE_LIMIT_EXCEEDED, http: 422, condition: "3rd fitting sample for patient+category within the closed rolling 90-day window" }
  - { id: ERR_PRIOR_AUTH_REQUIRED, http: 422, condition: "Shipment release with a requires_pa line lacking any APPROVED PA for (patient, hcpcs)" }
  - { id: ERR_PRIOR_AUTH_EXPIRED, http: 422, condition: "Shipment release where the covering APPROVED PA's closed window does not contain today" }
  - { id: ERR_ITEM_NOT_ON_FORMULARY, http: 422, condition: "Item's covered_plan_ids does not include the patient's plan" }
  - { id: ERR_SIZE_MISMATCH, http: 422, condition: "Line size not offered by item, or not equal to the CURRENT FitProfile size for the category (profile missing also fails)" }
  - { id: ERR_QUANTITY_EXCEEDS_ALLOWANCE, http: 422, condition: "Requested quantity exceeds min(Rx cap, formulary cap, PA cap)" }
  - { id: ERR_RESUPPLY_WINDOW_NOT_OPEN, http: 422, condition: "confirm-cycle before next_eligible_date (current date < next_eligible_date)" }
  - { id: ERR_NO_ELIGIBLE_ITEM, http: 422, condition: "confirm-cycle item selector pool is empty" }
  - { id: ERR_INSUFFICIENT_HSA, http: 422, condition: "HSA debit (or CASH order submit / DENIED_FINAL debit) exceeds balance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_patient_version does not match Patient.version" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match SupplyOrder.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "Enrolled patient; acts only on own resources (resource.patient_id == X-User-ID)"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations: ["confirm own resupply cycles", "create/submit/cancel own orders", "add lines to own DRAFT orders", "read own resources"]
  - name: IntakeCoordinator
    description: "Enrollment, eligibility, prescriptions, fit profiles, programs, samples"
    identity: "opaque"
    exclusive_operations: ["create/verify patients", "create/cancel prescriptions", "create fit profiles", "create/suspend/resume programs", "request samples and record outcomes"]
    shared_operations: ["confirm cycles and manage orders on behalf of a patient", "read resources"]
  - name: PriorAuthSpecialist
    description: "Prior authorization lifecycle"
    identity: "opaque"
    exclusive_operations: ["create PAs", "record PA decisions", "appeal PAs"]
    shared_operations: ["read resources"]
  - name: FulfillmentAgent
    description: "Warehouse fulfillment: shipments, stock reads, sample shipping"
    identity: "opaque"
    exclusive_operations: ["create/release/ship/deliver/return shipments", "ship samples"]
    shared_operations: ["read stock, lines, reservations"]
  - name: BillingSpecialist
    description: "Claims and HSA ledger"
    identity: "opaque"
    exclusive_operations: ["create/submit/adjudicate/appeal claims", "post HSA debits and credits"]
    shared_operations: ["read orders, claims, accounts"]
  - name: PlatformAdmin
    description: "Configuration and test-driving operations"
    identity: "opaque"
    exclusive_operations: ["manage payer plans and formulary items", "create/restock stock levels", "set the logical clock"]
    shared_operations: ["read all resources"]
