  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_deficiency_resubmission_cycle_returns_to_submitted
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_DEFICIENT
          - state_machines.PermitApplication.DEFICIENT_to_SUBMITTED
          - entities.PermitApplication.fields.resubmission_count
          - state_machines.Milestone.BLOCKED_to_IN_PROGRESS
        distinguishing_aspect: |
          Cycle on the PermitApplication entity: SUBMITTED -> DEFICIENT -> SUBMITTED re-enters a state
          the row already occupied, with resubmission_count 1 proving the loop was traversed rather
          than the row having stayed put, and blocked_days_accrued 21 retained across the loop.
        test_recipe:
          setup:
            - "Program with construction_start_date 2026-09-01, target_opening_date 2027-02-01, licensing_buffer_days 14, slip_tolerance_days 10, and one 60-day CONSTRUCTION_COMPLETE milestone."
            - "Milestone run to COMPLETE over 2026-09-01..2026-11-05; logical clock at 2026-11-05."
            - "FOOD_SERVICE permit (review_days 21) gated on that milestone, SUBMITTED and then found DEFICIENT, which drove the milestone to BLOCKED with blocked_days_accrued 21 and the posture to FROZEN."
