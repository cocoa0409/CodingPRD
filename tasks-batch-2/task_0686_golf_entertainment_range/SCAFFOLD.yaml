      - { name: available_bay_count, type: integer, source: computed, description: "bay_count minus count of Bay rows with status=OCCUPIED or OUT_OF_SERVICE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 each mutation" }

