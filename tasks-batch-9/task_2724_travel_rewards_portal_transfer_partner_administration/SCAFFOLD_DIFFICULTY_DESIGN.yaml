              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/bonus-events"
              payload: { partner_agreement_id: "${pa_id}", event_code: "SEP-EARLY-30", bonus_bps: 3000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", cap_points_per_account: 6000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ev_first_id: $.data.id }
          trigger:
            - call: "POST /rewards/bonus-events"
              payload: { partner_agreement_id: "${pa_id}", event_code: "SEP-EXACT-BUFFER", bonus_bps: 2000, window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-15T00:00:00Z", cap_points_per_account: 6000 }
              as: ProgramAdmin
