      - name: val_event_not_cancellable_after_redemption
        claim_type: violation_to_error
        grounds: ["validations[priority=10.1]", "errors[ERR_EVENT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an event after any REDEEMED credit entry exists yields ERR_EVENT_NOT_CANCELLABLE — the conservation ledger forbids cancel-with-redemptions."
        test_recipe:
          setup: ["event E INTAKE_OPEN; member M earned 2 credits (SEED_PACKET GOOD accepted) and redeemed 2"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-11-21T10:00:00Z", end_at: "2026-11-21T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "SEED_PACKET", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it: "$.data.id" }
            - call: "POST /api/intake-items/${it}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/redeem-credits"
              payload: { member_id: "${m_id}", credits: 2 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/swap-events/${e_id}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_EVENT_NOT_CANCELLABLE"

      - name: val_session_capacity_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=11.4]", "errors[ERR_SESSION_CAPACITY_FULL]"]
        distinguishing_aspect: "Session with capacity 2 accepts the 2nd signup (live count 1 < 2) and rejects the 3rd (count 2 == capacity): '<' admission pinned."
        test_recipe:
          setup: ["session PS capacity 2; three ACTIVE volunteers V1 V2 V3"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/packing-sessions"
              payload: { site_id: "${s_id}", title: "PS", start_at: "2026-10-25T09:00:00Z", end_at: "2026-10-25T11:00:00Z", capacity: 2 }
              as: ProgramAdmin
              captures: { ps: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v1@x.com", full_name: "V1" }
              as: ProgramAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /api/volunteers/${v1}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/volunteers"
              payload: { email: "v2@x.com", full_name: "V2" }
              as: ProgramAdmin
              captures: { v2: "$.data.id" }
            - call: "POST /api/volunteers/${v2}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/volunteers"
              payload: { email: "v3@x.com", full_name: "V3" }
              as: ProgramAdmin
              captures: { v3: "$.data.id" }
            - call: "POST /api/volunteers/${v3}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/packing-sessions/${ps}/assignments"
              payload: { volunteer_id: "${v1}" }
              as: Volunteer
              as_user_id: "${v1}"
          trigger:
            - call: "POST /api/packing-sessions/${ps}/assignments"
              payload: { volunteer_id: "${v2}" }
              as: Volunteer
              as_user_id: "${v2}"
              captures: { a2_st: "$.data.status" }
            - call: "POST /api/packing-sessions/${ps}/assignments"
              payload: { volunteer_id: "${v3}" }
              as: Volunteer
              as_user_id: "${v3}"
              captures: { err: "$.data.error_id" }
          assert:
            - "a2_st == SIGNUP                     # 2nd admitted (1 < 2)"
            - "err == ERR_SESSION_CAPACITY_FULL    # 3rd rejected (2 == capacity)"

      - name: val_insufficient_credits_on_redeem
        claim_type: violation_to_error
        grounds: ["validations[priority=11.3]", "errors[ERR_INSUFFICIENT_CREDITS]"]
        distinguishing_aspect: "Redeeming 3 credits when the member earned only 2 at the event yields ERR_INSUFFICIENT_CREDITS; redeeming exactly 2 succeeds and drains the balance (boundary)."
        test_recipe:
          setup: ["event E INTAKE_OPEN; member M earned 2 (SEED_PACKET GOOD accepted)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-12-05T10:00:00Z", end_at: "2026-12-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "SEED_PACKET", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it: "$.data.id" }
            - call: "POST /api/intake-items/${it}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/swap-events/${e_id}/redeem-credits"
              payload: { member_id: "${m_id}", credits: 3 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /api/swap-events/${e_id}/redeem-credits"
              payload: { member_id: "${m_id}", credits: 2 }
              as: Member
              as_user_id: "${m_id}"
              captures: { bal: "$.data.credits_balance" }
          assert:
            - "err == ERR_INSUFFICIENT_CREDITS   # 3 > 2 event-scoped redeemable"
            - "bal == 0                          # exact-amount redemption drains the balance"

