            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week18_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week18_id}/avail-units"
