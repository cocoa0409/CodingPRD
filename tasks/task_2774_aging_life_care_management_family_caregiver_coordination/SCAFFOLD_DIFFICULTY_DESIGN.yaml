            - call: "POST /care/service-authorizations/${auth}/coi-events"
              payload: { action: "ACKNOWLEDGE", acknowledged_by_contact_id: "${fc_alice}" }
              as: FamilyDecisionMaker
              as_user_id: "${fc_alice}"
              captures: { coi2: $.data.coi_status }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "ACTIVE" }
