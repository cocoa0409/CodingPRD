          - entities.Shipper.fields.credit_status
          - state_machines.Nomination.transitions.CONFIRMED_to_CURTAILED
        distinguishing_aspect: |
          The cash-out on contract CD is priced from CD's own ledger (55605.38 USD) but the cascade lands on a
          different contract: the shipper's outstanding penalty reaches its 50000.00 threshold, credit_status
          flips to SUSPENDED, and BOTH contracts move ACTIVE -> SUSPENDED, which curtails CE's CONFIRMED
          nomination for gas day 2026-08-25 to zero with a -50000.000 CURTAILMENT_CREDIT on CE — while CD's own
          gas-day-2026-08-05 nomination is spared because it already carries a CONFIRMED ticket. Three levels
