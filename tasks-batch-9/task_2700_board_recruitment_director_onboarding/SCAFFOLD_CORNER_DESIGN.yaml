      - name: committee_vote_tally_keeps_a_recused_ballot_in_quorum_and_out_of_approval
        claim_type: correct_result
        grounds:
          - calculations.committee_vote_tally
          - endpoints.POST_/governance/slates/{slate_id}/votes
          - validations.priority_65.ERR_APPROVAL_THRESHOLD_NOT_MET
        distinguishing_aspect: |
          Four CAST ballots of FOR, FOR, AGAINST and RECUSED give quorum 4 against the default quorum_size 3
          and an approval_pct of round_half_up(100 * 2 / 3) == 66.67 over the three non-recused ballots. That
          exactly meets the 66.67 floor, so the APPROVE decision succeeds; an implementation that divides by
          all four ballots gets 50.00 and wrongly rejects.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with the default quorum_size 3 and approval_threshold_pct 66.67."
            - "Five SEATED independent directors: a chair, two ordinary members, one member who is also a nominee on the slate, and one director who is only a nominee."
            - "A slate for cycle 2026 in COMMITTEE_REVIEW carrying two independent incumbent nominees."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cora Chair", email: "cora@issuer.example", birth_date: "1962-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
