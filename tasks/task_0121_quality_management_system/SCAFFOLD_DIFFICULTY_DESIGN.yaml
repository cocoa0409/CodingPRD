            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /deviations"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${sup_id}", part_number: "P-C72", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-01T00:00:00Z", max_qty: 5 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
