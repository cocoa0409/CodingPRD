              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/accept"
              payload: { audited_gross_revenue_cents: 5000000, audited_on_airport_transaction_days: 4000 }
