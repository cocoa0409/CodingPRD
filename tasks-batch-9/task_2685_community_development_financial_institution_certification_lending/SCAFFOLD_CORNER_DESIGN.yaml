  - section: validations
    instances:
      - name: duplicate_ein_on_a_second_institution_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=70]
          - errors.ERR_DUPLICATE_EIN
        distinguishing_aspect: |
          EIN uniqueness is global across Institution rows and is a 409 business_constraint, not
          a 400 shape error: the second create must fail with ERR_DUPLICATE_EIN while the first
          institution keeps version 1 and no second row is created.
        test_recipe:
          setup:
            - "One institution already registered with ein 210000026."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000026", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Second Fund With The Same EIN", ein: "210000026", entity_type: "BANK_HOLDING_COMPANY", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 100000000, reserve_method: "STATIC_POOL", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { dup_status: $.status, dup_code: $.data.error_id }
          assert:
            - "${dup_status} == 409"
            - "${dup_code} == ERR_DUPLICATE_EIN"
            - "Institution.${inst_id}.version == 1"
            - "Institution.${inst_id}.legal_name == Harborline Community Fund"
            - "count(GET /cdfi/institutions) == 1"
      - name: fiscal_ceilings_reject_approval_disbursement_and_payment_overruns
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - validations[priority=81]
          - validations[priority=82]
          - entities.LoanProduct.fields.committed_principal_cents
        distinguishing_aspect: |
          Three separate fiscal ceilings are checked against three different accumulators on the
          same loan: the product's committed_principal_cents at approval, approved_principal_cents
          at disbursement, and principal_outstanding_cents at payment. Each rejection must leave
          its accumulator untouched, so the product's committed principal is 1,000,000 - not
          2,000,000 and not 3,000,000 - after the whole sequence. requires_ta_completion is false
          so the priority-60 safety rung can never pre-empt the priority-80 fiscal rung.
        test_recipe:
          setup:
            - "One institution with a product capped at 1,000,000 cents (base_rate_bps 900, term 60, requires_ta_completion false)."
            - "One GEOCODED borrower with credit score 740."
            - "One loan requesting 2,000,000 cents, underwritten with income 1,000,000 and debt 100,000 to dti 14.83 grade A."
