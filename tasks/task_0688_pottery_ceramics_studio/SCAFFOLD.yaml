# =============================================================================
# PRD-bench seed tables — Paint-Your-Own Pottery & Ceramics Studio
# Difficulty: Expert
# =============================================================================

scenario: |
  Paint-Your-Own Pottery & Ceramics Studio (Color Me Mine style): walk-in &
  studio-fee + bisque-piece pricing, glaze/kiln batch & firing turnaround,
  ready-for-pickup notification, party/event package & deposit, class/wheel
  series, to-go kit, paint-bar inventory, loyalty

domain_name: pottery-ceramics-studio
api_prefix: /
# Flat topology: many peer top-level collections (no single nesting root),
# so api_prefix is the bare root "/"; every collection path sits directly under it.

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation        # KilnBatch firing capacity is a finite pool
  complexity_layers:
    - optimistic_concurrency                    # OCC on KilnBatch.version for piece loading
    - cascading_side_effects                    # batch firing cascades to pieces → visit → loyalty
    - dual_variant_calculation                  # provisional vs settled visit charge; estimate vs actual loyalty
    - derived_field_reconciliation              # visit running total, batch occupied slots, member point balance

  entity_topology: flat
  # Peer entities linked by FK (StudioVisit, BisquePiece, KilnBatch, PartyBooking,
  # ClassSeries, Enrollment, PaintBarItem, LoyaltyMember, LoyaltyLedgerEntry).
  # No deep URL nesting — pieces, batches, bookings are first-class collections.

  state_machine_shape: branching
  # StudioVisit forks OPEN -> {SETTLED via checkout, VOIDED via abandon}; BisquePiece
  # has a revision-loop (PAINTED -> LOADED -> FIRING -> READY, with LOADED -> PAINTED
  # un-load); PartyBooking branches DEPOSIT_PENDING -> {CONFIRMED, EXPIRED}.

  relationship_patterns:
    - one_to_many        # KilnBatch has many BisquePiece; ClassSeries has many Enrollment
    - cross_aggregate    # BisquePiece references both StudioVisit and KilnBatch
    - polymorphic        # LoyaltyLedgerEntry.source_ref_id points at visit | enrollment | booking

  role_model: peer_roles
  # StudioStaff (front counter + kiln ops), StudioManager (pricing/inventory/void/comp),
  # LoyaltyMember (own visits/enrollments/points), Anonymous (walk-in registration).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: LoyaltyMember
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: email, type: string, source: input, description: "Unique login email; lowercased on store" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: phone, type: string, source: input, description: "Contact phone for pickup notifications" }
      - { name: tier, type: enum, source: computed, default: "BRONZE", description: "BRONZE | SILVER | GOLD; derived from lifetime_points_earned thresholds" }
      - { name: point_balance, type: integer, source: computed, default: 0, description: "Spendable loyalty points; earned on SETTLED visits/enrollments, debited on redemption" }
      - { name: lifetime_points_earned, type: integer, source: computed, default: 0, description: "Monotonic sum of all points ever earned; never decreases on redemption; drives tier" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED; SUSPENDED members cannot redeem or enroll" }

  - name: PaintBarItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping code, e.g. GLZ-COBALT" }
      - { name: name, type: string, source: input, description: "Display name, e.g. Cobalt Glaze 4oz" }
      - { name: category, type: enum, source: input, description: "GLAZE | UNDERGLAZE | TOOL | TOGO_KIT" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail price per unit in cents; >= 0" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Current stock; decremented on consumption, restocked via adjustment; floor 0" }
      - { name: reorder_threshold, type: integer, source: input, default: 0, description: "Low-stock alert level; on_hand_qty <= threshold sets low_stock flag" }
      - { name: low_stock, type: boolean, source: computed, default: false, description: "True when on_hand_qty <= reorder_threshold" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCONTINUED; DISCONTINUED items cannot be consumed" }

  - name: StudioVisit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, default: null, description: "FK -> LoyaltyMember.id; null for anonymous walk-in" }
      - { name: party_size, type: integer, source: input, description: "Number of painters in this visit; >= 1; each pays a studio fee" }
      - { name: visit_type, type: enum, source: input, default: "WALK_IN", description: "WALK_IN | PARTY; PARTY visits are spawned by a confirmed PartyBooking and waive studio fee" }
      - { name: party_booking_id, type: string, source: input, default: null, description: "FK -> PartyBooking.id; set only when visit_type=PARTY" }
      - { name: studio_fee_cents, type: integer, source: computed, default: 0, description: "party_size * STUDIO_FEE_PER_PAINTER_CENTS for WALK_IN; 0 for PARTY" }
      - { name: bisque_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of bisque_price_cents over non-VOIDED BisquePiece rows on this visit" }
      - { name: supplies_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of consumed PaintBarItem line charges on this visit" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Live running estimate while OPEN: studio_fee + bisque_subtotal + supplies_subtotal (no discount/loyalty applied yet)" }
      - { name: points_redeemed, type: integer, source: input, default: 0, description: "Points the member elected to redeem at checkout; 0 for anonymous; validated against balance" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Total of redemption value + tier discount; pinned at checkout only" }
      - { name: settled_total_cents, type: integer, source: computed, default: 0, description: "Final amount charged; pinned at checkout via two-variant settlement; 0 while OPEN" }
      - { name: points_earned, type: integer, source: computed, default: 0, description: "Loyalty points credited at checkout; 0 while OPEN; 0 for anonymous" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SETTLED | VOIDED; OPEN accepts pieces/supplies, SETTLED/VOIDED are terminal" }

  - name: BisquePiece
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: studio_visit_id, type: string, source: input, description: "FK -> StudioVisit.id; visit MUST be OPEN at piece creation" }
      - { name: kiln_batch_id, type: string, source: system, default: null, description: "FK -> KilnBatch.id; set when LOADED, cleared on un-load" }
      - { name: sku, type: string, source: input, description: "Bisqueware catalog code, e.g. MUG-12OZ" }
      - { name: name, type: string, source: input, description: "Piece display name" }
      - { name: bisque_price_cents, type: integer, source: input, description: "Catalog price of the bisque blank in cents; >= 1" }
      - { name: firing_temp, type: enum, source: input, default: "CONE_06", description: "CONE_06 | CONE_6; a piece may only join a batch of matching firing_temp" }
      - { name: status, type: enum, source: system, default: "PAINTED", description: "PAINTED | LOADED | FIRING | READY | PICKED_UP | VOIDED" }
      - { name: ready_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when piece entered READY; basis for pickup notification" }

  - name: KilnBatch
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: kiln_name, type: string, source: input, description: "Physical kiln label, e.g. Kiln A" }
      - { name: firing_temp, type: enum, source: input, default: "CONE_06", description: "CONE_06 | CONE_6; only pieces of equal firing_temp may load" }
      - { name: capacity_slots, type: integer, source: input, description: "Max BisquePiece this batch holds; >= 1" }
      - { name: occupied_slots, type: integer, source: computed, default: 0, description: "Count of BisquePiece with status in {LOADED, FIRING, READY, PICKED_UP} that point at this batch" }
      - { name: turnaround_hours, type: integer, source: input, default: 48, description: "Hours from FIRING start to scheduled READY; firing_completes_at = started_at + turnaround_hours" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Logical-clock time the batch entered FIRING" }
      - { name: firing_completes_at, type: datetime, source: system, default: null, description: "started_at + turnaround_hours; pieces become READY at completion sweep" }
      - { name: status, type: enum, source: system, default: "LOADING", description: "LOADING | FIRING | COMPLETED | CANCELLED" }

  - name: PartyBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; the booking host (must exist, ACTIVE)" }
      - { name: package_tier, type: enum, source: input, description: "BASIC | DELUXE; sets per-head price and min guests" }
      - { name: guest_count, type: integer, source: input, description: "Confirmed headcount; >= package min; drives package_total and deposit" }
      - { name: scheduled_for, type: datetime, source: input, description: "Event start time; MUST be strictly after current logical clock at creation" }
      - { name: package_total_cents, type: integer, source: computed, default: 0, description: "guest_count * per-head rate for package_tier" }
      - { name: deposit_due_cents, type: integer, source: computed, default: 0, description: "round_half_up(package_total_cents * DEPOSIT_RATE) pinned at creation" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Amount recorded by pay-deposit action; 0 until paid" }
      - { name: status, type: enum, source: system, default: "DEPOSIT_PENDING", description: "DEPOSIT_PENDING | CONFIRMED | EXPIRED | CANCELLED" }

  - name: ClassSeries
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: title, type: string, source: input, description: "Series title, e.g. Wheel Throwing 101" }
      - { name: session_count, type: integer, source: input, description: "Number of weekly sessions; >= 1" }
      - { name: seat_capacity, type: integer, source: input, description: "Max enrollments; >= 1" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of Enrollment rows with status in {ENROLLED, ATTENDED}" }
      - { name: price_cents, type: integer, source: input, description: "Full-series price per seat in cents; >= 1" }
      - { name: starts_at, type: datetime, source: input, description: "First session time; enrollment closes once clock >= starts_at" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULL | STARTED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: class_series_id, type: string, source: input, description: "FK -> ClassSeries.id; series MUST be OPEN" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; member MUST be ACTIVE; unique (series, member) while non-cancelled" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "ClassSeries.price_cents snapshotted at enrollment" }
      - { name: points_earned, type: integer, source: computed, default: 0, description: "Loyalty points credited on enrollment settlement" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "ENROLLED | ATTENDED | WITHDRAWN | REFUNDED" }

  - name: LoyaltyLedgerEntry
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, description: "FK -> LoyaltyMember.id; owner of this ledger row" }
      - { name: entry_type, type: enum, source: system, description: "EARN | REDEEM | REVERSAL; EARN/REDEEM from settlements, REVERSAL from compensations" }
      - { name: points_delta, type: integer, source: system, description: "Signed change to point_balance: positive EARN, negative REDEEM, signed REVERSAL" }
      - { name: source_ref_type, type: enum, source: system, description: "VISIT | ENROLLMENT | BOOKING; the polymorphic source kind" }
      - { name: source_ref_id, type: string, source: system, description: "Id of the StudioVisit/Enrollment/PartyBooking that produced this entry" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC logical-clock time; chronological ordering key for replay" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StudioVisit
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /studio-visits/{id}/checkout"
        actor: StudioStaff
        preconditions:
          - "visit.status == OPEN"
          - "every BisquePiece on this visit has status in {READY, PICKED_UP, VOIDED} (no piece still PAINTED/LOADED/FIRING)"
          - "if points_redeemed > 0: member_id is not null AND member.status == ACTIVE AND points_redeemed <= member.point_balance"
        side_effects:
          - "compute settled_total_cents via calc settle_visit_charge (settled variant)"
          - "compute and pin discount_cents = redemption_value + tier_discount"
          - "if member_id not null: compute points_earned via calc visit_points_earned (actual variant); credit member.point_balance += points_earned; member.lifetime_points_earned += points_earned"
          - "if points_redeemed > 0: debit member.point_balance -= points_redeemed; append LoyaltyLedgerEntry(REDEEM, -points_redeemed, VISIT)"
          - "if points_earned > 0: append LoyaltyLedgerEntry(EARN, +points_earned, VISIT)"
          - "recompute member.tier from lifetime_points_earned"
          - "all PICKED_UP/READY pieces remain; status -> SETTLED"
      - from: OPEN
        to: VOIDED
        trigger: "POST /studio-visits/{id}/void"
        actor: StudioManager
        preconditions:
          - "visit.status == OPEN"
        side_effects:
          - "every non-terminal BisquePiece on this visit (status in {PAINTED, LOADED, FIRING, READY}) -> VOIDED"
          - "for each piece un-loaded from a batch (LOADED/FIRING/READY): batch.occupied_slots -= 1; batch.updated_at refreshed; batch.version += 1"
          - "restore on_hand_qty for every PaintBarItem consumed on this visit (compensation, see calc supplies_charge)"
          - "settled_total_cents stays 0; status -> VOIDED"

  - entity: BisquePiece
    initial_state: PAINTED
    terminal_states: [PICKED_UP, VOIDED]
    transitions:
      - from: PAINTED
        to: LOADED
        trigger: "POST /kiln-batches/{id}/load"
        actor: StudioStaff
        preconditions:
          - "piece.status == PAINTED"
          - "batch.status == LOADING"
          - "batch.firing_temp == piece.firing_temp"
          - "batch.occupied_slots < batch.capacity_slots"
          - "the piece's StudioVisit.status == OPEN"
          - "expected_kiln_batch_version matches batch.version (OCC)"
        side_effects:
          - "piece.kiln_batch_id = batch.id; piece.status -> LOADED"
          - "batch.occupied_slots += 1"
          - "increments KilnBatch.version by 1"
      - from: LOADED
        to: PAINTED
        trigger: "POST /bisque-pieces/{id}/unload"
        actor: StudioStaff
        preconditions:
          - "piece.status == LOADED"
          - "batch.status == LOADING"
        side_effects:
          - "batch.occupied_slots -= 1 (compensates the load); batch.version += 1"
          - "piece.kiln_batch_id = null; piece.status -> PAINTED"
      - from: LOADED
        to: FIRING
        trigger: "POST /kiln-batches/{id}/start-firing (cascade)"
        actor: StudioStaff
        preconditions:
          - "piece.status == LOADED"
          - "parent batch transitions LOADING -> FIRING"
        side_effects:
          - "piece.status -> FIRING"
      - from: FIRING
        to: READY
        trigger: "POST /kiln-batches/{id}/complete-firing (cascade) — also auto via clock sweep"
        actor: system
        preconditions:
          - "piece.status == FIRING"
          - "current_clock >= batch.firing_completes_at OR manual complete by StudioStaff"
        side_effects:
          - "piece.status -> READY; piece.ready_at = current_clock"
          - "the piece is now eligible for pickup notification"
      - from: READY
        to: PICKED_UP
        trigger: "POST /bisque-pieces/{id}/pickup"
        actor: StudioStaff
        preconditions:
          - "piece.status == READY"
        side_effects:
          - "piece.status -> PICKED_UP"
      - from: PAINTED
        to: VOIDED
        trigger: "via StudioVisit void cascade"
        actor: system
        preconditions:
          - "piece.status in {PAINTED, LOADED, FIRING, READY}"
          - "parent StudioVisit transitions OPEN -> VOIDED"
        side_effects:
          - "if piece was LOADED/FIRING/READY: batch.occupied_slots -= 1; batch.version += 1"
          - "piece.kiln_batch_id = null; piece.status -> VOIDED"

  - entity: KilnBatch
    initial_state: LOADING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: LOADING
        to: FIRING
        trigger: "POST /kiln-batches/{id}/start-firing"
        actor: StudioStaff
        preconditions:
          - "batch.status == LOADING"
          - "batch.occupied_slots >= 1 (cannot fire an empty kiln)"
        side_effects:
          - "batch.started_at = current_clock"
          - "batch.firing_completes_at = current_clock + turnaround_hours"
          - "cascade: every LOADED piece on this batch -> FIRING"
          - "batch.status -> FIRING"
      - from: FIRING
        to: COMPLETED
        trigger: "POST /kiln-batches/{id}/complete-firing OR clock sweep when current_clock >= firing_completes_at"
        actor: StudioStaff | system
        preconditions:
          - "batch.status == FIRING"
        side_effects:
          - "cascade: every FIRING piece on this batch -> READY with ready_at = current_clock"
          - "batch.status -> COMPLETED"
      - from: LOADING
        to: CANCELLED
        trigger: "POST /kiln-batches/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "batch.status == LOADING"
        side_effects:
          - "cascade: every LOADED piece on this batch -> PAINTED with kiln_batch_id=null"
          - "batch.occupied_slots = 0; batch.status -> CANCELLED"

  - entity: PartyBooking
    initial_state: DEPOSIT_PENDING
    terminal_states: [CONFIRMED, EXPIRED, CANCELLED]
    transitions:
      - from: DEPOSIT_PENDING
        to: CONFIRMED
        trigger: "POST /party-bookings/{id}/pay-deposit"
        actor: StudioStaff
        preconditions:
          - "booking.status == DEPOSIT_PENDING"
          - "current_clock < booking.scheduled_for (not past event time)"
          - "amount_cents == booking.deposit_due_cents (exact deposit)"
        side_effects:
          - "booking.deposit_paid_cents = amount_cents; booking.status -> CONFIRMED"
      - from: DEPOSIT_PENDING
        to: EXPIRED
        trigger: "POST /party-bookings/{id}/expire OR clock sweep when current_clock >= scheduled_for"
        actor: StudioManager | system
        preconditions:
          - "booking.status == DEPOSIT_PENDING"
          - "current_clock >= booking.scheduled_for"
        side_effects:
          - "booking.status -> EXPIRED (deposit window missed)"
      - from: DEPOSIT_PENDING
        to: CANCELLED
        trigger: "POST /party-bookings/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "booking.status == DEPOSIT_PENDING"
        side_effects:
          - "booking.status -> CANCELLED"

  - entity: ClassSeries
    initial_state: OPEN
    terminal_states: [STARTED, CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "via Enrollment create cascade (bubble-up)"
        actor: system
        preconditions:
          - "series.status == OPEN"
          - "after the new Enrollment, enrolled_count == seat_capacity"
        side_effects:
          - "series.status -> FULL"
      - from: FULL
        to: OPEN
        trigger: "via Enrollment withdraw cascade (bubble-up)"
        actor: system
        preconditions:
          - "series.status == FULL"
          - "a non-cancelled Enrollment withdraws, dropping enrolled_count below seat_capacity"
        side_effects:
          - "series.status -> OPEN (a seat reopened)"
      - from: OPEN
        to: STARTED
        trigger: "POST /class-series/{id}/start OR clock sweep when current_clock >= starts_at"
        actor: StudioManager | system
        preconditions:
          - "series.status in {OPEN, FULL}"
          - "current_clock >= series.starts_at"
        side_effects:
          - "series.status -> STARTED; further enrollment is rejected"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /class-series/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "series.status in {OPEN, FULL}"
        side_effects:
          - "cascade: every ENROLLED Enrollment -> REFUNDED; for each settled enrollment reverse its EARN ledger entry and decrement member.point_balance/lifetime_points_earned by points_earned (compensating REVERSAL)"
          - "series.status -> CANCELLED"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [ATTENDED, WITHDRAWN, REFUNDED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/mark-attended"
        actor: StudioStaff
        preconditions:
          - "enrollment.status == ENROLLED"
          - "parent ClassSeries.status == STARTED"
        side_effects:
          - "enrollment.status -> ATTENDED"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: LoyaltyMember | StudioStaff
        preconditions:
          - "enrollment.status == ENROLLED"
          - "parent ClassSeries.status in {OPEN, FULL} (cannot withdraw after series started)"
        side_effects:
          - "reverse the EARN ledger entry for this enrollment: member.point_balance -= points_earned; member.lifetime_points_earned -= points_earned; append LoyaltyLedgerEntry(REVERSAL, -points_earned, ENROLLMENT)"
          - "decrement ClassSeries.enrolled_count by 1; bubble-up FULL -> OPEN if applicable"
          - "enrollment.status -> WITHDRAWN"
      - from: ENROLLED
        to: REFUNDED
        trigger: "via ClassSeries cancel cascade"
        actor: system
        preconditions:
          - "enrollment.status == ENROLLED"
          - "parent ClassSeries transitions OPEN/FULL -> CANCELLED"
        side_effects:
          - "reverse the EARN ledger entry: member.point_balance -= points_earned; member.lifetime_points_earned -= points_earned; append LoyaltyLedgerEntry(REVERSAL, -points_earned, ENROLLMENT)"
          - "enrollment.status -> REFUNDED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only; serial-observability filtered)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: load-piece-stale-batch
    parent_entity: KilnBatch
    write_endpoint: "POST /kiln-batches/{id}/load"
    occ_field: "expected_kiln_batch_version"
    description: |
      Loading a BisquePiece into a KilnBatch whose version has advanced since
      the client last observed it is rejected. A prior load (or un-load) has
      already moved occupied_slots and bumped the batch version; the current
      writer's view of remaining capacity is therefore stale. The loser carries
      a version older than the batch's current version and is rejected on the
      stale-version check before any slot is consumed.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: settle_visit_charge
    trigger: "StudioVisit OPEN -> SETTLED (POST /studio-visits/{id}/checkout)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED (mode (c): fee depends on tier discount keyed
      # off subtotal_before_discount, which itself feeds the total).
      # Step 1 — base components (sum line items first; each line is already integer cents):
      studio_fee     = (visit_type == WALK_IN) ? party_size * STUDIO_FEE_PER_PAINTER_CENTS : 0
      bisque_subtotal   = sum(piece.bisque_price_cents for piece on visit where status != VOIDED)
      supplies_subtotal = sum(line.charge_cents for supply line on visit)   # see supplies_charge
      subtotal_before_discount = studio_fee + bisque_subtotal + supplies_subtotal
      # Step 2 — tier discount on bisque only, keyed off member tier at checkout time:
      tier_pct       = TIER_DISCOUNT_PCT[member.tier] if member_id else 0   # BRONZE 0, SILVER 0.05, GOLD 0.10
      tier_discount  = round_half_up(bisque_subtotal * tier_pct)            # round the single product, NOT per piece
      # Step 3 — redemption value (100 points = 100 cents, 1:1):
      redemption_value = points_redeemed * POINT_REDEEM_VALUE_CENTS
      discount_cents = tier_discount + redemption_value
      # Step 4 — settled total, floored at 0:
      settled_total_cents = max(0, subtotal_before_discount - discount_cents)
    input_set: "BisquePiece rows on visit with status in {READY, PICKED_UP} (VOIDED excluded); all supply lines on the visit; member.tier read at checkout"
    constants:
      STUDIO_FEE_PER_PAINTER_CENTS: 1000
      TIER_DISCOUNT_PCT: { BRONZE: 0.0, SILVER: 0.05, GOLD: 0.10 }
      POINT_REDEEM_VALUE_CENTS: 1
    precision: "integer cents; round_half_up applied once to tier_discount only; total floored at 0"
    variants:
      - name: provisional_total
        when: "while visit.status == OPEN, read on GET /studio-visits/{id}"
        difference: "provisional_total_cents = studio_fee + bisque_subtotal + supplies_subtotal ONLY; NO tier discount, NO redemption applied (live estimate). settled_total subtracts discount_cents."
      - name: settled_total
        when: "at checkout, pinned into settled_total_cents"
        difference: "Applies Steps 2-4; differs from provisional by exactly discount_cents."

  - name: visit_points_earned
    trigger: "StudioVisit OPEN -> SETTLED (member visits only)"
    algorithm: threshold
    formula: |
      # Points earned on the post-discount net, with a GOLD bonus threshold.
      net_spend_cents = settled_total_cents          # already net of discount
      base_points = floor(net_spend_cents / POINTS_PER_CENT_DIVISOR)   # 1 pt per 100 cents
      # Bonus tier multiplier applies ONLY when net_spend >= GOLD_BONUS_THRESHOLD_CENTS:
      if net_spend_cents >= GOLD_BONUS_THRESHOLD_CENTS:
          points_earned = floor(base_points * BONUS_MULTIPLIER)
      else:
          points_earned = base_points
    input_set: "settled_total_cents of the SETTLED visit; anonymous visits earn 0"
    constants:
      POINTS_PER_CENT_DIVISOR: 100
      GOLD_BONUS_THRESHOLD_CENTS: 10000
      BONUS_MULTIPLIER: 1.5
    precision: "integer points; floor at each step; >= threshold (>=) triggers bonus, threshold-1 does not"
    variants:
      - name: estimate
        when: "GET /studio-visits/{id}/points-preview while OPEN"
        difference: "Estimate uses provisional_total_cents (pre-discount) as net_spend, so estimate >= actual when any discount applies; actual uses settled_total_cents."
      - name: actual
        when: "pinned into points_earned at checkout"
        difference: "Uses settled_total_cents; this is the value credited to the ledger."

  - name: supplies_charge
    trigger: "POST /studio-visits/{id}/consume (paint-bar item consumption) and its reversal on visit void"
    algorithm: aggregation
    formula: |
      # Per-line charge with a bulk-break on quantity (mode (a): >=3 inputs, nested branch):
      line_charge = qty * item.unit_price_cents
      if qty >= BULK_QTY_THRESHOLD:
          line_charge = round_half_up(line_charge * (1 - BULK_DISCOUNT_PCT))
      # Inventory invariant: forward consume decrements on_hand_qty by qty;
      # compensating restore (visit void) increments on_hand_qty by qty.
      supplies_subtotal_cents = sum(line_charge over all consume lines on visit, VOID lines excluded)
    input_set: "All consume lines on the visit; on visit void every line's qty is added back to PaintBarItem.on_hand_qty"
    constants:
      BULK_QTY_THRESHOLD: 3
      BULK_DISCOUNT_PCT: 0.10
    precision: "integer cents; round_half_up per line AFTER bulk multiplier; lines summed without further rounding"

  - name: party_deposit
    trigger: "POST /party-bookings (creation)"
    algorithm: tiered_pricing
    formula: |
      per_head = PACKAGE_RATE_CENTS[package_tier]      # BASIC 4500, DELUXE 8000
      package_total_cents = guest_count * per_head
      deposit_due_cents   = round_half_up(package_total_cents * DEPOSIT_RATE)
    input_set: "package_tier and guest_count supplied at creation; guest_count >= PACKAGE_MIN_GUESTS[tier]"
    constants:
      PACKAGE_RATE_CENTS: { BASIC: 4500, DELUXE: 8000 }
      PACKAGE_MIN_GUESTS: { BASIC: 6, DELUXE: 10 }
      DEPOSIT_RATE: 0.25
    precision: "integer cents; round_half_up applied once to deposit_due_cents"

  - name: enrollment_points_earned
    trigger: "POST /class-series/{id}/enroll (Enrollment created -> EARN ledger)"
    algorithm: threshold
    formula: |
      # Distinct domain from visit_points_earned: per-session loyalty on class spend.
      per_session_cents = floor(amount_paid_cents / session_count)
      base_points = floor(amount_paid_cents / POINTS_PER_CENT_DIVISOR)
      # Long-series bonus: series with session_count >= LONG_SERIES_THRESHOLD earn +LONG_SERIES_BONUS flat points:
      if session_count >= LONG_SERIES_THRESHOLD:
          points_earned = base_points + LONG_SERIES_BONUS
      else:
          points_earned = base_points
    input_set: "amount_paid_cents (= series.price_cents) and series.session_count at enrollment"
    constants:
      POINTS_PER_CENT_DIVISOR: 100
      LONG_SERIES_THRESHOLD: 6
      LONG_SERIES_BONUS: 50
    precision: "integer points; floor before bonus; >= threshold (>=) on session_count triggers flat bonus"

  - name: member_tier
    trigger: "recomputed whenever lifetime_points_earned changes (visit checkout, enrollment, reversals)"
    algorithm: threshold
    formula: |
      if lifetime_points_earned >= GOLD_THRESHOLD:   tier = GOLD
      elif lifetime_points_earned >= SILVER_THRESHOLD: tier = SILVER
      else:                                           tier = BRONZE
    input_set: "member.lifetime_points_earned (monotone non-decreasing on EARN, decreased only by REVERSAL of unsettled-then-cancelled credit)"
    constants:
      SILVER_THRESHOLD: 500
      GOLD_THRESHOLD: 2000
    precision: "exact integer comparison; >= boundary inclusive (exactly 500 -> SILVER, exactly 2000 -> GOLD)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /loyalty-members (Anonymous) and POST /studio-visits (Anonymous walk-in)"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed role acting on own resource: X-User-ID matches the resource's member_id (LoyaltyMember on own visit/enrollment/points)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "LoyaltyMember-scoped reads/writes"

  - priority: 4
    category: existence
    check: "Every path/body id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state permitting the requested transition (state-machine from: clause)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_referential
    check: "BisquePiece.firing_temp must equal target KilnBatch.firing_temp on load"
    error_id: ERR_FIRING_TEMP_MISMATCH
    http_status: 409
    applies_to: "POST /kiln-batches/{id}/load"

  - priority: 7
    category: business_referential
    check: "A BisquePiece may only be created against a StudioVisit whose status == OPEN"
    error_id: ERR_VISIT_NOT_OPEN
    http_status: 409
    applies_to: "POST /studio-visits/{id}/pieces, POST /studio-visits/{id}/consume"

  - priority: 8
    category: business_safety
    check: "Checkout requires EVERY piece on the visit to be in {READY, PICKED_UP, VOIDED}; an in-kiln piece (PAINTED/LOADED/FIRING) blocks settlement"
    error_id: ERR_PIECES_NOT_READY
    http_status: 409
    applies_to: "POST /studio-visits/{id}/checkout"

  - priority: 9
    category: business_constraint
    check: "PaintBarItem must be ACTIVE and have on_hand_qty >= requested qty to be consumed"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /studio-visits/{id}/consume"

  - priority: 10
    category: business_constraint
    check: "KilnBatch.occupied_slots < capacity_slots before a load (capacity overflow guard)"
    error_id: ERR_KILN_AT_CAPACITY
    http_status: 409
    applies_to: "POST /kiln-batches/{id}/load"

  - priority: 11
    category: business_constraint
    check: "Enrollment rejected when ClassSeries.enrolled_count == seat_capacity (series full)"
    error_id: ERR_SERIES_FULL
    http_status: 409
    applies_to: "POST /class-series/{id}/enroll"

  - priority: 12
    category: business_constraint
    check: "Duplicate enrollment: member already has a non-cancelled Enrollment in this series"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /class-series/{id}/enroll"

  - priority: 13
    category: business_temporal
    check: "PartyBooking.scheduled_for must be strictly after current logical clock at creation"
    error_id: ERR_BOOKING_DATE_PAST
    http_status: 422
    applies_to: "POST /party-bookings"

  - priority: 14
    category: business_temporal
    check: "Enrollment rejected once current_clock >= series.starts_at (enrollment window closed)"
    error_id: ERR_ENROLLMENT_CLOSED
    http_status: 409
    applies_to: "POST /class-series/{id}/enroll"

  - priority: 15
    category: business_fiscal
    check: "Deposit payment amount_cents must equal booking.deposit_due_cents exactly"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /party-bookings/{id}/pay-deposit"

  - priority: 16
    category: business_fiscal
    check: "points_redeemed at checkout must not exceed member.point_balance"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /studio-visits/{id}/checkout"

  - priority: 17
    category: business_constraint
    check: "Suspended member (status==SUSPENDED) may not enroll or redeem points"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /class-series/{id}/enroll, POST /studio-visits/{id}/checkout (when points_redeemed>0)"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_kiln_batch_version must equal current KilnBatch.version on load"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /kiln-batches/{id}/load"

  - priority: 19
    category: business_constraint
    check: "Field-level: required fields present, enums valid, integers non-negative where required, party_size>=1, guest_count>=package min"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- LoyaltyMember ----
  - { method: POST, path: "/loyalty-members", description: "Register a loyalty member", roles: [Anonymous, StudioStaff, StudioManager], code: 201, input: [email, full_name, phone], output: LoyaltyMember, side_effects: ["status=ACTIVE, tier=BRONZE, point_balance=0, lifetime_points_earned=0"] }
  - { method: GET, path: "/loyalty-members/{id}", description: "Fetch a member", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: LoyaltyMember, side_effects: [] }
  - { method: GET, path: "/loyalty-members", description: "List members (paginated; filter by email)", roles: [StudioStaff, StudioManager], code: 200, input: ["email?", "limit?", "offset?"], output: "LoyaltyMember[]", side_effects: [] }
  - { method: POST, path: "/loyalty-members/{id}/suspend", description: "Suspend a member", roles: [StudioManager], code: 200, input: [], output: LoyaltyMember, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/loyalty-members/{id}/reactivate", description: "Reactivate a suspended member", roles: [StudioManager], code: 200, input: [], output: LoyaltyMember, side_effects: ["status -> ACTIVE"] }
  - { method: GET, path: "/loyalty-members/{id}/ledger", description: "List the member's loyalty ledger entries (FK reverse-reachability for LoyaltyLedgerEntry.member_id; chronological)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "LoyaltyLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/visits", description: "List visits for a member (FK reverse-reachability for StudioVisit.member_id)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "StudioVisit[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/enrollments", description: "List enrollments for a member (FK reverse-reachability for Enrollment.member_id)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/party-bookings", description: "List bookings hosted by a member (FK reverse-reachability for PartyBooking.member_id)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "PartyBooking[]", side_effects: [] }

  # ---- PaintBarItem ----
  - { method: POST, path: "/paint-bar-items", description: "Add a paint-bar inventory item", roles: [StudioManager], code: 201, input: [sku, name, category, unit_price_cents, reorder_threshold], output: PaintBarItem, side_effects: ["on_hand_qty=0, status=ACTIVE"] }
  - { method: GET, path: "/paint-bar-items/{id}", description: "Fetch an inventory item", roles: [StudioStaff, StudioManager], code: 200, input: [], output: PaintBarItem, side_effects: [] }
  - { method: GET, path: "/paint-bar-items", description: "List inventory (paginated; filter by category, low_stock)", roles: [StudioStaff, StudioManager], code: 200, input: ["category?", "low_stock?", "limit?", "offset?"], output: "PaintBarItem[]", side_effects: [] }
  - { method: POST, path: "/paint-bar-items/{id}/restock", description: "Increase on-hand quantity", roles: [StudioManager], code: 200, input: [qty], output: PaintBarItem, side_effects: ["on_hand_qty += qty; recompute low_stock"] }
  - { method: POST, path: "/paint-bar-items/{id}/discontinue", description: "Mark item discontinued", roles: [StudioManager], code: 200, input: [], output: PaintBarItem, side_effects: ["status -> DISCONTINUED"] }

  # ---- StudioVisit ----
  - { method: POST, path: "/studio-visits", description: "Open a walk-in or party visit", roles: [Anonymous, StudioStaff, StudioManager], code: 201, input: ["member_id?", party_size, "visit_type?", "party_booking_id?"], output: StudioVisit, side_effects: ["status=OPEN; compute studio_fee_cents (0 if PARTY); provisional_total_cents=studio_fee"] }
  - { method: GET, path: "/studio-visits/{id}", description: "Fetch a visit with live provisional_total_cents", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: StudioVisit, side_effects: ["recompute provisional_total_cents (provisional variant)"] }
  - { method: GET, path: "/studio-visits", description: "List visits (paginated; filter by status, member_id, party_booking_id)", roles: [StudioStaff, StudioManager], code: 200, input: ["status?", "member_id?", "party_booking_id?", "limit?", "offset?"], output: "StudioVisit[]", side_effects: [] }
  - { method: GET, path: "/studio-visits/{id}/points-preview", description: "Estimate points earned for the visit at current provisional total (estimate variant)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: StudioVisit, side_effects: ["returns estimated points_earned (estimate variant); does not pin"] }
  - { method: POST, path: "/studio-visits/{id}/pieces", description: "Add a bisque piece to an OPEN visit", roles: [StudioStaff, StudioManager], code: 201, input: [sku, name, bisque_price_cents, "firing_temp?"], output: BisquePiece, side_effects: ["piece.status=PAINTED; recompute visit.bisque_subtotal_cents & provisional_total_cents"] }
  - { method: POST, path: "/studio-visits/{id}/consume", description: "Consume a paint-bar item on an OPEN visit (supplies line)", roles: [StudioStaff, StudioManager], code: 201, input: [paint_bar_item_id, qty], output: StudioVisit, side_effects: ["calc supplies_charge; item.on_hand_qty -= qty; recompute supplies_subtotal_cents & provisional_total_cents"] }
  - { method: POST, path: "/studio-visits/{id}/checkout", description: "Settle the visit (OPEN -> SETTLED); apply discount/loyalty", roles: [StudioStaff, StudioManager], code: 200, input: ["points_redeemed?"], output: StudioVisit, side_effects: ["calc settle_visit_charge (settled); calc visit_points_earned (actual); ledger EARN/REDEEM; member tier recompute; status -> SETTLED"] }
  - { method: POST, path: "/studio-visits/{id}/void", description: "Void an OPEN visit (StudioManager only)", roles: [StudioManager], code: 200, input: [], output: StudioVisit, side_effects: ["cascade non-terminal pieces -> VOIDED; un-load from batches (occupied_slots -=, version +1); restore consumed inventory; status -> VOIDED"] }

  # ---- BisquePiece ----
  - { method: GET, path: "/bisque-pieces/{id}", description: "Fetch a piece", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: BisquePiece, side_effects: [] }
  - { method: GET, path: "/bisque-pieces", description: "List pieces (paginated; filter by studio_visit_id, kiln_batch_id, status)", roles: [StudioStaff, StudioManager], code: 200, input: ["studio_visit_id?", "kiln_batch_id?", "status?", "limit?", "offset?"], output: "BisquePiece[]", side_effects: [] }
  - { method: POST, path: "/bisque-pieces/{id}/unload", description: "Un-load a LOADED piece back to PAINTED", roles: [StudioStaff, StudioManager], code: 200, input: [], output: BisquePiece, side_effects: ["batch.occupied_slots -=1; batch.version +1; piece.kiln_batch_id=null; status -> PAINTED"] }
  - { method: POST, path: "/bisque-pieces/{id}/pickup", description: "Mark a READY piece picked up", roles: [StudioStaff, StudioManager], code: 200, input: [], output: BisquePiece, side_effects: ["status -> PICKED_UP"] }
  - { method: GET, path: "/bisque-pieces/{id}/notification", description: "Pickup-notification payload for a READY/PICKED_UP piece (ready_at + member contact)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: BisquePiece, side_effects: [] }

  # ---- KilnBatch ----
  - { method: POST, path: "/kiln-batches", description: "Create a kiln batch in LOADING", roles: [StudioStaff, StudioManager], code: 201, input: [kiln_name, "firing_temp?", capacity_slots, "turnaround_hours?"], output: KilnBatch, side_effects: ["status=LOADING; occupied_slots=0; version=1"] }
  - { method: GET, path: "/kiln-batches/{id}", description: "Fetch a batch", roles: [StudioStaff, StudioManager], code: 200, input: [], output: KilnBatch, side_effects: [] }
  - { method: GET, path: "/kiln-batches", description: "List batches (paginated; filter by status, firing_temp)", roles: [StudioStaff, StudioManager], code: 200, input: ["status?", "firing_temp?", "limit?", "offset?"], output: "KilnBatch[]", side_effects: [] }
  - { method: GET, path: "/kiln-batches/{id}/pieces", description: "List pieces in a batch (FK reverse-reachability for BisquePiece.kiln_batch_id)", roles: [StudioStaff, StudioManager], code: 200, input: ["limit?", "offset?"], output: "BisquePiece[]", side_effects: [] }
  - { method: POST, path: "/kiln-batches/{id}/load", description: "Load a PAINTED piece into the batch (OCC on batch.version)", roles: [StudioStaff, StudioManager], code: 200, input: [bisque_piece_id, expected_kiln_batch_version], output: BisquePiece, side_effects: ["piece -> LOADED; batch.occupied_slots +=1; increments KilnBatch.version by 1"] }
  - { method: POST, path: "/kiln-batches/{id}/start-firing", description: "Begin firing (LOADING -> FIRING); cascade pieces LOADED -> FIRING", roles: [StudioStaff, StudioManager], code: 200, input: [], output: KilnBatch, side_effects: ["started_at=clock; firing_completes_at=clock+turnaround; pieces LOADED -> FIRING; status -> FIRING"] }
  - { method: POST, path: "/kiln-batches/{id}/complete-firing", description: "Complete firing (FIRING -> COMPLETED); cascade pieces FIRING -> READY", roles: [StudioStaff, StudioManager], code: 200, input: [], output: KilnBatch, side_effects: ["pieces FIRING -> READY with ready_at=clock; status -> COMPLETED"] }
  - { method: POST, path: "/kiln-batches/{id}/cancel", description: "Cancel a LOADING batch; return pieces to PAINTED", roles: [StudioManager], code: 200, input: [], output: KilnBatch, side_effects: ["pieces LOADED -> PAINTED, kiln_batch_id=null; occupied_slots=0; status -> CANCELLED"] }

  # ---- PartyBooking ----
  - { method: POST, path: "/party-bookings", description: "Create a party booking with computed deposit", roles: [StudioStaff, StudioManager], code: 201, input: [member_id, package_tier, guest_count, scheduled_for], output: PartyBooking, side_effects: ["calc party_deposit; status=DEPOSIT_PENDING; deposit_paid_cents=0"] }
  - { method: GET, path: "/party-bookings/{id}", description: "Fetch a booking", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: PartyBooking, side_effects: [] }
  - { method: GET, path: "/party-bookings", description: "List bookings (paginated; filter by status, member_id)", roles: [StudioStaff, StudioManager], code: 200, input: ["status?", "member_id?", "limit?", "offset?"], output: "PartyBooking[]", side_effects: [] }
  - { method: POST, path: "/party-bookings/{id}/pay-deposit", description: "Record exact deposit payment (DEPOSIT_PENDING -> CONFIRMED)", roles: [StudioStaff, StudioManager], code: 200, input: [amount_cents], output: PartyBooking, side_effects: ["deposit_paid_cents=amount_cents; status -> CONFIRMED"] }
  - { method: POST, path: "/party-bookings/{id}/expire", description: "Expire an overdue pending booking (clock >= scheduled_for)", roles: [StudioManager], code: 200, input: [], output: PartyBooking, side_effects: ["status -> EXPIRED"] }
  - { method: POST, path: "/party-bookings/{id}/cancel", description: "Cancel a pending booking", roles: [StudioManager], code: 200, input: [], output: PartyBooking, side_effects: ["status -> CANCELLED"] }

  # ---- ClassSeries / Enrollment ----
  - { method: POST, path: "/class-series", description: "Create a class/wheel series", roles: [StudioManager], code: 201, input: [title, session_count, seat_capacity, price_cents, starts_at], output: ClassSeries, side_effects: ["status=OPEN; enrolled_count=0"] }
  - { method: GET, path: "/class-series/{id}", description: "Fetch a series", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: ClassSeries, side_effects: [] }
  - { method: GET, path: "/class-series", description: "List series (paginated; filter by status)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: ["status?", "limit?", "offset?"], output: "ClassSeries[]", side_effects: [] }
  - { method: POST, path: "/class-series/{id}/enroll", description: "Enroll a member (bubble-up FULL when last seat taken)", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 201, input: [member_id], output: Enrollment, side_effects: ["snapshot amount_paid_cents; calc enrollment_points_earned; credit member; ledger EARN; enrolled_count +=1; series OPEN -> FULL if full; member tier recompute"] }
  - { method: POST, path: "/class-series/{id}/start", description: "Start the series (OPEN/FULL -> STARTED)", roles: [StudioManager], code: 200, input: [], output: ClassSeries, side_effects: ["status -> STARTED; enrollment closed"] }
  - { method: POST, path: "/class-series/{id}/cancel", description: "Cancel a series; refund and reverse points for all ENROLLED", roles: [StudioManager], code: 200, input: [], output: ClassSeries, side_effects: ["cascade enrollments -> REFUNDED; reverse EARN ledger entries; member tier recompute; status -> CANCELLED"] }
  - { method: GET, path: "/class-series/{id}/enrollments", description: "List enrollments in a series (FK reverse-reachability for Enrollment.class_series_id)", roles: [StudioStaff, StudioManager], code: 200, input: ["limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}", description: "Fetch an enrollment", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{id}/mark-attended", description: "Mark an enrollment attended (series STARTED)", roles: [StudioStaff, StudioManager], code: 200, input: [], output: Enrollment, side_effects: ["status -> ATTENDED"] }
  - { method: POST, path: "/enrollments/{id}/withdraw", description: "Withdraw before series starts; reverse points, reopen seat", roles: [StudioStaff, StudioManager, LoyaltyMember], code: 200, input: [], output: Enrollment, side_effects: ["reverse EARN ledger; member tier recompute; enrolled_count -=1; series FULL -> OPEN if applicable; status -> WITHDRAWN"] }

  # ---- Test-driving (logical clock) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock to a given ISO 8601 UTC instant. Startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock. Setting the clock forward triggers sweeps (firing completion, booking expiry, series start).", roles: [StudioManager], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock updated; run completion/expiry/start sweeps"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "LoyaltyMember acting on a resource whose member_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_FIRING_TEMP_MISMATCH, http: 409, condition: "Piece.firing_temp != target batch.firing_temp on load" }
  - { id: ERR_VISIT_NOT_OPEN, http: 409, condition: "Adding a piece/supply line to a visit not in OPEN" }
  - { id: ERR_PIECES_NOT_READY, http: 409, condition: "Checkout while some piece is still PAINTED/LOADED/FIRING" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Consume qty exceeds PaintBarItem.on_hand_qty, or item DISCONTINUED" }
  - { id: ERR_KILN_AT_CAPACITY, http: 409, condition: "Load when batch.occupied_slots == capacity_slots" }
  - { id: ERR_SERIES_FULL, http: 409, condition: "Enroll when ClassSeries.enrolled_count == seat_capacity" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Member already has a non-cancelled enrollment in this series" }
  - { id: ERR_ENROLLMENT_CLOSED, http: 409, condition: "Enroll when current_clock >= series.starts_at" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Suspended member attempts to enroll or redeem points" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_kiln_batch_version != current KilnBatch.version on load (OCC)" }
  - { id: ERR_BOOKING_DATE_PAST, http: 422, condition: "PartyBooking.scheduled_for not strictly after current logical clock" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "Deposit amount_cents != booking.deposit_due_cents" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "points_redeemed > member.point_balance at checkout" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, negative where non-negative required, party_size<1, guest_count below package min" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated walk-in; can self-register as a member and open a walk-in visit"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /loyalty-members"
      - "POST /studio-visits (walk-in, member_id omitted)"

  - name: StudioStaff
    description: "Front-counter and kiln operator; manages visits, pieces, batches, deposits, enrollments"
    identity: "opaque"
    exclusive_operations:
      - "POST /kiln-batches/{id}/load"
      - "POST /kiln-batches/{id}/start-firing"
      - "POST /kiln-batches/{id}/complete-firing"
      - "POST /bisque-pieces/{id}/pickup"
      - "POST /party-bookings/{id}/pay-deposit"
      - "POST /enrollments/{id}/mark-attended"
    shared_operations:
      - "POST /studio-visits, /studio-visits/{id}/pieces, /studio-visits/{id}/consume, /studio-visits/{id}/checkout"
      - "POST /bisque-pieces/{id}/unload"
      - "POST /kiln-batches, /class-series/{id}/enroll, /enrollments/{id}/withdraw"
      - "GET reads on visits, pieces, batches, members, items, bookings, series, enrollments, ledger"

  - name: StudioManager
    description: "Studio manager; pricing, inventory, voids, comps, cancellations, member suspension, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /paint-bar-items, /paint-bar-items/{id}/restock, /paint-bar-items/{id}/discontinue"
      - "POST /studio-visits/{id}/void"
      - "POST /kiln-batches/{id}/cancel"
      - "POST /party-bookings/{id}/expire, /party-bookings/{id}/cancel"
      - "POST /class-series, /class-series/{id}/start, /class-series/{id}/cancel"
      - "POST /loyalty-members/{id}/suspend, /loyalty-members/{id}/reactivate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all StudioStaff shared_operations and StudioStaff exclusive_operations (manager superset over operational actions)"

  - name: LoyaltyMember
    description: "Registered member acting on own visits, enrollments, points, bookings"
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations: []
    shared_operations:
      - "POST /class-series/{id}/enroll (member_id == X-User-ID)"
      - "POST /enrollments/{id}/withdraw (own enrollment)"
      - "GET own member, ledger, visits, enrollments, party-bookings, points-preview"
