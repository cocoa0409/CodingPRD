        distinguishing_aspect: "For a PARTNERSHIP_YEAR_END gain the 180-day clock starts at the pass-through year end, which can be in the FUTURE relative to the realization date. An election filed between realization and that basis date yields days_from_basis < 0 and is 422 ERR_180_DAY_WINDOW_NOT_OPEN — the mirror image of the closed-window error, and unreachable for a SALE_DATE gain."
