  - PaymentMilestones → DEFAULTED
  - ProductionObligations → SHORTFALL_DECLARED
  - SublicenseRequests PENDING → REJECTED, APPROVED → REVOKED
  - Broadcaster → SUSPENDED
- method: POST
  path: /deals/{dealId}/terminate-convenience
  description: Terminate a deal for convenience
