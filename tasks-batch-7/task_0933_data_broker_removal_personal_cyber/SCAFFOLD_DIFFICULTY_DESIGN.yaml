            - "FAMILY plan (removal_quota_per_cycle 60, per_member_removal_subcap 25), ACTIVE account, ACTIVE profile with one identifier."
            - "Two ACTIVE brokers, one exposure at each, both discovered by a completed INITIAL scan."
            - "RemovalRequest A on exposure A is still DRAFTED; RemovalRequest B on exposure B has been submitted and acknowledged."
