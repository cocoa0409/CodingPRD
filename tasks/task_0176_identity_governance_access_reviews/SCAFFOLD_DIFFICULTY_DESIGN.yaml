  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: access_request_returned_resubmit_cycle
        grounds:
          - state_machines.AccessRequest.SUBMITTED_to_RETURNED
          - state_machines.AccessRequest.RETURNED_to_SUBMITTED
          - entities.AccessRequest.fields.status
        distinguishing_aspect: |
          AccessRequest is cyclic: SUBMITTED->RETURNED->SUBMITTED forms a revision loop on the
          AccessRequest entity; the same request reaches SUBMITTED twice without a new resource.
        test_recipe:
          setup:
            - "An AccessRequest is SUBMITTED, then RETURNED by an approver, then resubmitted."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntLoop", system_code: "EL", risk_weight: 10 }
              as: CatalogAdmin
              captures: { el: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleLoop", entitlement_ids: ["${el}"] }
              as: CatalogAdmin
              captures: { rl: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Loopy", email: "loop@x.com" }
              as: AccessManager
              captures: { il: $.data.id }
            - call: "POST /access-requests"
              payload: { identity_id: "${il}", role_id: "${rl}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-9"
              captures: { arl: $.data.id }
            - call: "POST /access-requests/${arl}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-9"
            - call: "POST /access-requests/${arl}/return"
              payload: {}
              as: AccessApprover
              as_user_id: "apr-9"
          trigger:
            - call: "POST /access-requests/${arl}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-9"
              captures: { st: $.data.status }
          assert:
            - "AccessRequest.${arl}.status == SUBMITTED after the second submit (cycle traversed)"

      - name: grant_parallel_lifecycle_and_review_dimensions
        grounds:
          - state_machines.Grant.PROVISIONING_to_ACTIVE
          - state_machines.Grant.NOT_DUE_to_UNDER_REVIEW
          - state_machines.Grant.UNDER_REVIEW_to_CERTIFIED
          - entities.Grant.fields.lifecycle_status
          - entities.Grant.fields.review_status
        distinguishing_aspect: |
          Grant carries two independent state dimensions: certifying an item advances review_status
          UNDER_REVIEW->CERTIFIED while lifecycle_status stays ACTIVE — the dimensions move
          independently on the same Grant row (parallel, not linear).
        test_recipe:
          setup:
            - "A grant is ACTIVE; a campaign enrolls it (review_status UNDER_REVIEW); the item is certified."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntPar", system_code: "EP", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ep: $.data.id }
            - call: "POST /roles"
              payload: { name: "RolePar", entitlement_ids: ["${ep}"] }
              as: CatalogAdmin
              captures: { rp: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Par", email: "par@x.com" }
              as: AccessManager
              captures: { ip: $.data.id, ipv: $.data.version }
            - call: "POST /identities/${ip}/grants"
              payload: { entitlement_id: "${ep}", expected_identity_version: "${ipv}" }
              as: AccessManager
              captures: { gp: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "CampPar", scope_role_id: "${rp}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { cp: $.data.id }
            - call: "POST /certification-campaigns/${cp}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "GET /certification-items?grant_id=${gp}"
              payload: {}
              as: Certifier
              captures: { ip_item: $.data.0.id }
          trigger:
            - call: "POST /certification-items/${ip_item}/certify"
              payload: {}
              as: Certifier
            - call: "GET /grants/${gp}"
              payload: {}
              as: Certifier
              captures: { lc: $.data.lifecycle_status, rv: $.data.review_status }
          assert:
            - "Grant.${gp}.review_status == CERTIFIED"
            - "Grant.${gp}.lifecycle_status == ACTIVE (unchanged by certify — parallel dimension)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approval_to_grant_to_activation_to_riskflag   # depth >= 3
        grounds:
          - state_machines.AccessRequest.SUBMITTED_to_APPROVED
          - state_machines.Grant.PROVISIONING_to_ACTIVE
          - calculations.effective_risk_score
          - entities.Grant.fields.review_status
        distinguishing_aspect: |
          Depth-3 chain from a SINGLE approve trigger: approve -> creates Grant(PROVISIONING) ->
          that grant auto-advances to ACTIVE -> activation recomputes Identity.effective_risk_score
          to 100, crossing HIGH_RISK_THRESHOLD, which flags the new privileged grant
          (review_status=FLAGGED). Each hop is caused by the prior hop, not by the approve directly.
        test_recipe:
          setup:
            - "Role bundles a single privileged entitlement of risk_weight 75; approving lands effective risk at exactly 100."
            - "Identity starts with no grants; request submitted and ready to approve."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "BigPriv", system_code: "BP", is_privileged: true, risk_weight: 75 }
              as: CatalogAdmin
              captures: { bp: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleBig", entitlement_ids: ["${bp}"] }
              as: CatalogAdmin
              captures: { rb: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Risky", email: "risky@x.com" }
              as: AccessManager
              captures: { ir: $.data.id }
            - call: "POST /access-requests"
              payload: { identity_id: "${ir}", role_id: "${rb}", justification: "need" }
              as: AccessManager
              as_user_id: "mgr-7"
              captures: { arb: $.data.id }
            - call: "POST /access-requests/${arb}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-7"
          trigger:
            - call: "POST /access-requests/${arb}/approve"
              payload: { second_approver_confirmed: true }
              as: AccessApprover
              as_user_id: "apr-7"
            - call: "GET /grants?identity_id=${ir}"
              payload: {}
              as: AccessApprover
              captures: { gflag_lc: $.data.0.lifecycle_status, gflag_rv: $.data.0.review_status }
          assert:
            - "Grant for ${ir} (role RoleBig) has lifecycle_status == ACTIVE"
            - "Grant for ${ir} has review_status == FLAGGED (HIGH_RISK auto-flag fired)"
            - "Identity.${ir}.effective_risk_score == 100"

      - name: identity_disable_to_revoke_to_counter_reset   # depth >= 2
        grounds:
          - state_machines.Identity.ACTIVE_to_DISABLED
          - state_machines.Grant.ACTIVE_to_REVOKED
          - entities.Identity.fields.active_grant_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (identity disable, not approval): disable -> every
          ACTIVE grant transitions to REVOKED -> each revoke decrements active_grant_count, ending
          at 0. The counter reset is a consequence of the cascaded revokes, not of the disable directly.
        test_recipe:
          setup:
            - "Identity holds 2 ACTIVE grants before disable."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "D1", system_code: "D1", risk_weight: 10 }
              as: CatalogAdmin
              captures: { d1: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "D2", system_code: "D2", risk_weight: 10 }
              as: CatalogAdmin
              captures: { d2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Dis", email: "dis@x.com" }
              as: AccessManager
              captures: { idd: $.data.id, idd_v0: $.data.version }
            - call: "POST /identities/${idd}/grants"
              payload: { entitlement_id: "${d1}", expected_identity_version: "${idd_v0}" }
              as: AccessManager
            - call: "GET /identities/${idd}"
              payload: {}
              as: AccessManager
              captures: { idd_v1: $.data.version }
            - call: "POST /identities/${idd}/grants"
              payload: { entitlement_id: "${d2}", expected_identity_version: "${idd_v1}" }
              as: AccessManager
            - call: "GET /identities/${idd}"
              payload: {}
              as: AccessManager
              captures: { idd_v2: $.data.version }
          trigger:
            - call: "POST /identities/${idd}/disable"
              payload: { expected_identity_version: "${idd_v2}" }
              as: AccessManager
              captures: { dstat: $.data.status, dcount: $.data.active_grant_count }
          assert:
            - "Identity.${idd}.status == DISABLED"
            - "Identity.${idd}.active_grant_count == 0"
            - "Identity.${idd}.effective_risk_score == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_sod_on_approve   # state vs business_constraint
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_constraint/SoD (priority 8): an already-APPROVED
          request that ALSO has a HARD SoD conflict re-approved returns ERR_INVALID_STATE (state wins),
          not ERR_SOD_CONFLICT.
        test_recipe:
          setup:
            - "A request with a HARD SoD conflict is already APPROVED; a second approve is attempted."
            - "Identity already holds entitlement A; request adds a role bundling entitlement B; HARD policy A/B exists."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntA", system_code: "EA", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ea: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "EntB", system_code: "EB", risk_weight: 10 }
              as: CatalogAdmin
              captures: { eb: $.data.id }
            - call: "POST /sod-policies"
              payload: { name: "AB", entitlement_a_id: "${ea}", entitlement_b_id: "${eb}", severity: "SOFT" }
              as: CatalogAdmin
              captures: { sod_ab: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleB", entitlement_ids: ["${eb}"] }
              as: CatalogAdmin
              captures: { rb2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Sd", email: "sd@x.com" }
              as: AccessManager
              captures: { isd: $.data.id, isd_v: $.data.version }
            - call: "POST /identities/${isd}/grants"
              payload: { entitlement_id: "${ea}", expected_identity_version: "${isd_v}" }
              as: AccessManager
            - call: "POST /access-requests"
              payload: { identity_id: "${isd}", role_id: "${rb2}", justification: "j", sod_override_justification: "approved exception" }
              as: AccessManager
              as_user_id: "mgr-5"
              captures: { arsd: $.data.id }
            - call: "POST /access-requests/${arsd}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-5"
            - call: "POST /access-requests/${arsd}/approve"
              payload: { sod_override_justification: "approved exception" }
              as: AccessApprover
              as_user_id: "apr-5"
          trigger:
            - call: "POST /access-requests/${arsd}/approve"
              payload: { sod_override_justification: "approved exception" }
              as: AccessApprover
              as_user_id: "apr-5"
              captures: { err: $.data.error_id }
          assert:
            - "second approve returns 409 ERR_INVALID_STATE (state precondition beats SoD business rule)"

      - name: dual_approval_beats_sod_override   # business_safety vs business_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair business_safety/dual-approval (priority 6) vs business_constraint/SoD (priority 8):
          approving a privileged role with a SOFT SoD conflict but WITHOUT second_approver_confirmed
          returns ERR_DUAL_APPROVAL_REQUIRED (safety, priority 6), not ERR_SOD_OVERRIDE_REQUIRED.
        test_recipe:
          setup:
            - "Role bundles a privileged entitlement P (requires_dual_approval). Identity holds entitlement A; a SOFT policy A/P exists; request omits second_approver_confirmed and override justification."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntA2", system_code: "EA2", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ea2: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "PrivP", system_code: "PP", is_privileged: true, risk_weight: 30 }
              as: CatalogAdmin
              captures: { pp2: $.data.id }
            - call: "POST /sod-policies"
              payload: { name: "A2P", entitlement_a_id: "${ea2}", entitlement_b_id: "${pp2}", severity: "SOFT" }
              as: CatalogAdmin
            - call: "POST /roles"
              payload: { name: "RolePriv", entitlement_ids: ["${pp2}"] }
              as: CatalogAdmin
              captures: { rpriv: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Da", email: "da@x.com" }
              as: AccessManager
              captures: { ida2: $.data.id, ida2_v: $.data.version }
            - call: "POST /identities/${ida2}/grants"
              payload: { entitlement_id: "${ea2}", expected_identity_version: "${ida2_v}" }
              as: AccessManager
            - call: "POST /access-requests"
              payload: { identity_id: "${ida2}", role_id: "${rpriv}", justification: "j", sod_override_justification: "ok" }
              as: AccessManager
              as_user_id: "mgr-6"
              captures: { ar6: $.data.id }
            - call: "POST /access-requests/${ar6}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-6"
          trigger:
            - call: "POST /access-requests/${ar6}/approve"
              payload: { sod_override_justification: "ok" }
              as: AccessApprover
              as_user_id: "apr-6"
              captures: { err: $.data.error_id }
          assert:
            - "approve returns 422 ERR_DUAL_APPROVAL_REQUIRED (priority 6 beats priority 8 SoD override)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: high_risk_threshold_ge_boundary   # numeric threshold metric, grants endpoint
        grounds:
          - calculations.effective_risk_score
          - entities.Grant.fields.review_status
          - entities.Entitlement.fields.risk_weight
        distinguishing_aspect: |
          Numeric boundary metric on POST /identities/{id}/grants: effective_risk_score == 100 (>=
          HIGH_RISK_THRESHOLD 100) FLAGS the privileged grant; 99 does NOT. The >= boundary is exact.
        test_recipe:
          setup:
            - "Identity granted one privileged entitlement of risk_weight 75 → effective 100 (75 base + 25 surcharge) crosses the >= boundary."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Edge75", system_code: "E75", is_privileged: true, risk_weight: 75 }
              as: CatalogAdmin
              captures: { e75: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Edge", email: "edge@x.com" }
              as: AccessManager
              captures: { ie: $.data.id, iev: $.data.version }
          trigger:
            - call: "POST /identities/${ie}/grants"
              payload: { entitlement_id: "${e75}", expected_identity_version: "${iev}" }
              as: AccessManager
              captures: { ge_rv: $.data.review_status, ge_lc: $.data.lifecycle_status }
          assert:
            - "Identity.${ie}.effective_risk_score == 100"
            - "Grant.review_status == FLAGGED at exactly 100 (>= boundary inclusive)"

      - name: campaign_close_with_zero_items_empty_set   # empty-collection metric, campaign close endpoint
        grounds:
          - calculations.campaign_completion_pct
          - calculations.campaign_posture
          - state_machines.CertificationCampaign.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Empty-set boundary on POST /certification-campaigns/{id}/close: a campaign whose scope role
          had ZERO in-scope ACTIVE grants launches with item_count==0, closes cleanly, and reports
          completion_pct==100.00 with realized_revocation_count==0 (no divide-by-zero).
        test_recipe:
          setup:
            - "A role with an entitlement that nobody currently holds is the scope of a launched campaign (0 items)."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Unused", system_code: "UNU", risk_weight: 10 }
              as: CatalogAdmin
              captures: { unu: $.data.id }
            - call: "POST /roles"
              payload: { name: "EmptyRole", entitlement_ids: ["${unu}"] }
              as: CatalogAdmin
              captures: { er: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "EmptyCamp", scope_role_id: "${er}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { ecamp: $.data.id }
            - call: "POST /certification-campaigns/${ecamp}/launch"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /certification-campaigns/${ecamp}/close"
              payload: {}
              as: CampaignAdmin
              captures: { ecp_pct: $.data.completion_pct, ecp_rr: $.data.realized_revocation_count }
          assert:
            - "CertificationCampaign.${ecamp}.item_count == 0"
            - "CertificationCampaign.${ecamp}.completion_pct == 100.00"
            - "CertificationCampaign.${ecamp}.realized_revocation_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_blocked_when_identity_not_active   # AccessRequest -> Identity
        grounds:
          - state_machines.AccessRequest.SUBMITTED_to_APPROVED
          - entities.Identity.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair AccessRequest->Identity: a SUBMITTED request cannot be approved when the target
          Identity.status is DISABLED — ERR_IDENTITY_NOT_ACTIVE. The request's own state is valid; the
          block comes from the linked Identity's state.
        test_recipe:
          setup:
            - "A request is SUBMITTED, then the target identity is disabled before approval."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntX", system_code: "EX", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ex: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleX", entitlement_ids: ["${ex}"] }
              as: CatalogAdmin
              captures: { rx: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Xi", email: "xi@x.com" }
              as: AccessManager
              captures: { ix: $.data.id, ix_v: $.data.version }
            - call: "POST /access-requests"
              payload: { identity_id: "${ix}", role_id: "${rx}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-3"
              captures: { arx: $.data.id }
            - call: "POST /access-requests/${arx}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-3"
            - call: "POST /identities/${ix}/disable"
              payload: { expected_identity_version: "${ix_v}" }
              as: AccessManager
          trigger:
            - call: "POST /access-requests/${arx}/approve"
              payload: { second_approver_confirmed: true }
              as: AccessApprover
              as_user_id: "apr-3"
              captures: { err: $.data.error_id }
          assert:
            - "approve returns 409 ERR_IDENTITY_NOT_ACTIVE (depends on linked Identity.status)"

      - name: certify_blocked_when_campaign_not_active   # CertificationItem -> CertificationCampaign
        grounds:
          - state_machines.Grant.UNDER_REVIEW_to_CERTIFIED
          - entities.CertificationCampaign.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair CertificationItem->CertificationCampaign: certifying an item is rejected with
          ERR_CAMPAIGN_NOT_ACTIVE once the owning campaign is CLOSED. The item is the subject but the
          gate is the campaign's state — a different entity pair than the Identity case.
        test_recipe:
          setup:
            - "A campaign with 2 items is launched, then closed; an item certify is attempted post-close."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntCc", system_code: "ECC", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ecc: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleCc", entitlement_ids: ["${ecc}"] }
              as: CatalogAdmin
              captures: { rcc: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Cci", email: "cci@x.com" }
              as: AccessManager
              captures: { icc: $.data.id, icc_v: $.data.version }
            - call: "POST /identities/${icc}/grants"
              payload: { entitlement_id: "${ecc}", expected_identity_version: "${icc_v}" }
              as: AccessManager
              captures: { gcc: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "CampCc", scope_role_id: "${rcc}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { ccc: $.data.id }
            - call: "POST /certification-campaigns/${ccc}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "GET /certification-items?grant_id=${gcc}"
              payload: {}
              as: Certifier
              captures: { icc_item: $.data.0.id }
            - call: "POST /certification-campaigns/${ccc}/close"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /certification-items/${icc_item}/certify"
              payload: {}
              as: Certifier
              captures: { err: $.data.error_id }
          assert:
            - "certify returns 409 ERR_CAMPAIGN_NOT_ACTIVE (or ERR_INVALID_STATE if item already REVOKED by close) — depends on linked CertificationCampaign.status"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: jit_grant_window_half_open_overlap   # half-open [from,until), touching allowed
        grounds:
          - validations[priority=9]
          - entities.Grant.fields.effective_from
          - entities.Grant.fields.effective_until
          - errors[ERR_JIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_until). A second JIT grant of the
          SAME (identity, entitlement) starting strictly inside an existing window is rejected, but one
          starting exactly at the prior window's effective_until (touching) is allowed — adjacency OK.
        test_recipe:
          setup:
            - "Identity holds a JIT privileged grant of entitlement P over [10:00, 12:00); a second JIT grant of the same P over [11:00, 13:00) is attempted."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "JitP", system_code: "JP", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { jp: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Jit", email: "jit@x.com" }
              as: AccessManager
              captures: { ij: $.data.id, ij_v0: $.data.version }
            - call: "POST /identities/${ij}/grants"
              payload: { entitlement_id: "${jp}", expected_identity_version: "${ij_v0}", is_just_in_time: true, effective_from: "2026-06-01T10:00:00Z", effective_until: "2026-06-01T12:00:00Z" }
              as: AccessManager
            - call: "GET /identities/${ij}"
              payload: {}
              as: AccessManager
              captures: { ij_v1: $.data.version }
          trigger:
            - call: "POST /identities/${ij}/grants"
              payload: { entitlement_id: "${jp}", expected_identity_version: "${ij_v1}", is_just_in_time: true, effective_from: "2026-06-01T11:00:00Z", effective_until: "2026-06-01T13:00:00Z" }
              as: AccessManager
              captures: { err: $.data.error_id }
          assert:
            - "second JIT grant returns 409 ERR_JIT_WINDOW_OVERLAP (11:00 falls inside [10:00,12:00))"

      - name: campaign_window_buffer_gap_overlap   # closed interval + mandatory 1-day buffer
        grounds:
          - validations[priority=10]
          - state_machines.CertificationCampaign.DRAFT_to_ACTIVE
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics from the JIT case: campaign windows are CLOSED with a mandatory
          1-day buffer — a new campaign for the same scope_role_id whose review_window_start is less
          than the prior CLOSED campaign's review_window_end + 1 day is rejected (buffer, not mere
          adjacency). Different resource entity (Role scope) than the per-(identity,entitlement) JIT case.
        test_recipe:
          setup:
            - "Prior campaign for role R ran [2026-06-01, 2026-06-30] and is CLOSED; a new campaign for R starts 2026-06-30 (inside the +1 day buffer)."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "BufE", system_code: "BE", risk_weight: 10 }
              as: CatalogAdmin
              captures: { be: $.data.id }
            - call: "POST /roles"
              payload: { name: "BufRole", entitlement_ids: ["${be}"] }
              as: CatalogAdmin
              captures: { br: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "Prior", scope_role_id: "${br}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { prior: $.data.id }
            - call: "POST /certification-campaigns/${prior}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "POST /certification-campaigns/${prior}/close"
              payload: {}
              as: CampaignAdmin
            - call: "POST /certification-campaigns"
              payload: { name: "Next", scope_role_id: "${br}", review_window_start: "2026-06-30T00:00:00Z", review_window_end: "2026-07-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { nxt: $.data.id }
          trigger:
            - call: "POST /certification-campaigns/${nxt}/launch"
              payload: {}
              as: CampaignAdmin
              captures: { err: $.data.error_id }
          assert:
            - "second campaign launch returns 409 ERR_CAMPAIGN_WINDOW_OVERLAP (start 2026-06-30 < 2026-06-30 + 1 day buffer)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_then_revoke_conserves_active_grant_count
        grounds:
          - state_machines.Grant.PROVISIONING_to_ACTIVE
          - state_machines.Grant.ACTIVE_to_REVOKED
          - entities.Identity.fields.active_grant_count
        distinguishing_aspect: |
          Conserved quantity #1 = Identity.active_grant_count. Direct-granting an entitlement then
          revoking it leaves active_grant_count exactly equal to its pre-grant value (0 -> 1 -> 0);
          forward action + compensating action net to zero on the named counter.
        test_recipe:
          setup:
            - "Fresh identity with active_grant_count 0; one direct grant then revoke."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Inv1", system_code: "I1", risk_weight: 10 }
              as: CatalogAdmin
              captures: { inv1: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Inva", email: "inva@x.com" }
              as: AccessManager
              captures: { iia: $.data.id, iia_v: $.data.version }
            - call: "POST /identities/${iia}/grants"
              payload: { entitlement_id: "${inv1}", expected_identity_version: "${iia_v}" }
              as: AccessManager
              captures: { ginv1: $.data.id }
          trigger:
            - call: "POST /grants/${ginv1}/revoke"
              payload: {}
              as: AccessManager
            - call: "GET /identities/${iia}"
              payload: {}
              as: AccessManager
              captures: { agc: $.data.active_grant_count }
          assert:
            - "Identity.${iia}.active_grant_count == 0 (equals pre-grant baseline; grant+revoke conserves it)"

      - name: grant_then_revoke_conserves_privileged_count_and_risk
        grounds:
          - state_machines.Grant.PROVISIONING_to_ACTIVE
          - state_machines.Grant.ACTIVE_to_REVOKED
          - entities.Identity.fields.privileged_entitlement_count
          - calculations.effective_risk_score
        distinguishing_aspect: |
          Conserved quantity #2 = Identity.privileged_entitlement_count AND effective_risk_score
          (different quantity than the grant-count invariant). Granting a privileged entitlement
          (count 0->1, risk 0->55) then revoking it returns both to baseline (count 1->0, risk 55->0).
        test_recipe:
          setup:
            - "Fresh identity; one direct privileged grant (risk_weight 30 → effective 55) then revoke."
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Inv2", system_code: "I2", is_privileged: true, risk_weight: 30 }
              as: CatalogAdmin
              captures: { inv2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Invb", email: "invb@x.com" }
              as: AccessManager
              captures: { iib: $.data.id, iib_v: $.data.version }
            - call: "POST /identities/${iib}/grants"
              payload: { entitlement_id: "${inv2}", expected_identity_version: "${iib_v}" }
              as: AccessManager
              captures: { ginv2: $.data.id, iib_eff: $.data.risk_contribution }
          trigger:
            - call: "POST /grants/${ginv2}/revoke"
              payload: {}
              as: AccessManager
            - call: "GET /identities/${iib}"
              payload: {}
              as: AccessManager
              captures: { pec: $.data.privileged_entitlement_count, eff: $.data.effective_risk_score }
          assert:
            - "before revoke: Identity.${iib}.privileged_entitlement_count == 1 and effective_risk_score == 55"
            - "Identity.${iib}.privileged_entitlement_count == 0 after revoke (conserved to baseline)"
            - "Identity.${iib}.effective_risk_score == 0 after revoke (conserved to baseline)"
