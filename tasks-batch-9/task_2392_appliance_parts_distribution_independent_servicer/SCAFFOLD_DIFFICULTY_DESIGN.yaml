# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Task 2392 — Appliance Parts Distribution & Independent Servicer Network
#   Every rule_id below is verbatim from §0.5. All money literals were computed
#   by executing the §1.3 formulas with their declared constants.
#   Shared fixture vocabulary used across instances:
#     PricingTier GOLD  — electrical 0.15 / mechanical 0.20 / cosmetic 0.25 / sealed 0.10
#     Branch STL        — overnight_surcharge_cents 300, cutoff_hour_utc 20
#     Branch DAL        — overnight_surcharge_cents 100, cutoff_hour_utc 18
#     Part P1  W10-PUMP   MECHANICAL     12999  5200 g
#     Part P1B W10-PUMP-B MECHANICAL     13500  5200 g   (in-variance substitute)
#     Part P2  W10-COMP   SEALED_SYSTEM 320000 12000 g   core_required, deposit 8500
#     Part P3  GE-BOARD   ELECTRICAL    128000   400 g   (non-returnable)
#     Part P4  W10-MOTOR  MECHANICAL    128000  9000 g
#   Logical clock starts at 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_pricing_quoted_at_order_date_vs_invoiced_at_ship_date
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.invoiced_unit_price_cents
          - entities.PartOrder.fields.price_variance_cents
          - entities.PartOrder.fields.pricing_basis
          - state_machines.PartOrder.ALLOCATED_to_FULFILLED
        distinguishing_aspect: |
          This instance's dual variant is money accounting on a PartOrder/OrderLine: the
          quoted_at_order_date variant locks 10399 per unit from the pre-publish list price
          while the invoiced_at_ship_date variant re-reads the published 15999 list price and
          yields 12799, so identical line data produces a 7200-cent price_variance_cents.
        test_recipe:
          setup:
            - "PricingTier GOLD with mechanical discount 0.20; Branch STL; Part P1 W10-PUMP MECHANICAL list 12999."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "InventoryRecord (STL, P1) with on_hand_units 10, reserved_units 0."
            - "A WILL_CALL order for 3 units of P1 is credit-approved and allocated at STL; subtotal 31197, freight 0, total 31197."
            - "A price file raising P1's list price to 15999 is published BEFORE the order ships; the order's quoted line price is untouched by the publish."
            - "Logical clock stays at its 2026-08-01T00:00:00Z default, so the price file's effective_at is exactly now."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-1001" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "within limit" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /price-files"
              payload: { file_version: "2026-08-A", effective_at: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /price-files/${pf_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 15999 }
              as: PricingAdmin
            - call: "POST /price-files/${pf_id}/publish"
              payload: {}
              as: PricingAdmin
          trigger:
            - call: "POST /part-orders/${order_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-1001" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
          assert:
            - "Part.${part_p1_id}.list_price_cents == 15999"
            - "OrderLine.${line_id}.unit_price_cents == 10399"
            - "OrderLine.${line_id}.extended_price_cents == 31197"
            - "OrderLine.${line_id}.invoiced_unit_price_cents == 12799"
            - "PartOrder.${order_id}.subtotal_cents == 31197"
            - "PartOrder.${order_id}.freight_cents == 0"
            - "PartOrder.${order_id}.total_cents == 31197"
            - "PartOrder.${order_id}.invoiced_total_cents == 38397"
            - "PartOrder.${order_id}.price_variance_cents == 7200"
            - "PartOrder.${order_id}.pricing_basis == SHIP_DATE"
            - "PartOrder.${order_id}.settlement_status == INVOICED"

      - name: delinquency_score_rolling_window_vs_lifetime_divergence
        grounds:
          - calculations.servicer_delinquency_score
          - entities.ServicerAccount.fields.delinquency_score
          - endpoints.GET_/servicer-accounts/{id}/credit-summary
          - state_machines.WarrantyClaim.SUBMITTED_to_OEM_DENIED
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
        distinguishing_aspect: |
          This instance's dual variant is risk scoring on a ServicerAccount — a different entity
          domain and a different metric from the money-accounting variant above: with one denied
          claim 31 days old, one denied claim 203 days old and one NO_LONGER_NEEDED return credited
          198 days ago, rolling_recent scores 65 while lifetime scores 37 on the same data.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Parts P1 (12999 MECHANICAL) and P4 (128000 MECHANICAL)."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL, with one WHIRLPOOL SEALED_SYSTEM certification effective 2026-01-01 through 2027-01-01."
            - "Order J shipped 2026-01-10 with line J1 (P1 x1, invoiced 10399) and line J2 (P4 x1, invoiced 102400); invoiced_total 112799, paid in full so it is never overdue."
            - "A NO_LONGER_NEEDED return of line J1 is credited on 2026-01-15 (198 days before the observation instant)."
            - "A warranty claim on line J2 is submitted 2026-01-15 and DENIED (203 days before the observation instant, measured from its 2026-01-10-window submit)."
            - "Order K shipped and paid 2026-07-01 with line K1 (P1 x1); its warranty claim is submitted 2026-07-01 and DENIED (31 days before the observation instant)."
            - "Clock is finally moved to 2026-08-01T00:00:00Z, so exactly one of the two denied claims and none of the returns fall inside the 180-day rolling window."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_s_id}", technician_name: "Dana Ruiz", oem_code: "WHIRLPOOL", cert_level: "SEALED_SYSTEM", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p4_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-J" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_j_id: $.data.id, order_j_v0: $.data.version }
            - call: "POST /part-orders/${order_j_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_j_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_j1_id: $.data.id }
            - call: "GET /part-orders/${order_j_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_j_v1: $.data.version }
            - call: "POST /part-orders/${order_j_id}/lines"
              payload: { requested_part_id: "${part_p4_id}", quantity: 1, expected_part_order_version: "${order_j_v1}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_j2_id: $.data.id }
            - call: "POST /part-orders/${order_j_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_j_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_j_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-J" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_j_id}/payments"
              payload: { amount_cents: 112799, payment_reference: "ACH-J" }
              as: CreditManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-authorizations"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_j1_id}", quantity: 1, reason_code: "NO_LONGER_NEEDED", return_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { ra_j1_id: $.data.id }
            - call: "POST /return-authorizations/${ra_j1_id}/decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /return-authorizations/${ra_j1_id}/receive"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /warranty-claims"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_j2_id}", defect_code: "BEARING_NOISE", appliance_model_number: "WRF535SWHZ" }
              as: WarrantyAdmin
              captures: { claim_j_id: $.data.id }
            - call: "POST /warranty-claims/${claim_j_id}/submit"
              payload: { oem_reference: "WP-J-001" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim_j_id}/oem-response"
              payload: { outcome: "DENIED", oem_note: "wear item" }
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-K" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_k_id: $.data.id, order_k_v0: $.data.version }
            - call: "POST /part-orders/${order_k_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_k_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_k1_id: $.data.id }
            - call: "POST /part-orders/${order_k_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_k_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_k_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-K" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_k_id}/payments"
              payload: { amount_cents: 10399, payment_reference: "ACH-K" }
              as: CreditManager
            - call: "POST /warranty-claims"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_k1_id}", defect_code: "SEIZED_PUMP", appliance_model_number: "WRF535SWHZ" }
              as: WarrantyAdmin
              captures: { claim_k_id: $.data.id }
            - call: "POST /warranty-claims/${claim_k_id}/submit"
              payload: { oem_reference: "WP-K-001" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim_k_id}/oem-response"
              payload: { outcome: "DENIED", oem_note: "no defect found" }
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /servicer-accounts/${acct_s_id}/credit-summary"
              payload: {}
              as: CreditManager
          assert:
            - "response data.delinquency_score_rolling == 65"
            - "response data.delinquency_score_lifetime == 37"
            - "response data.credit_used_cents == 0"
            - "response data.core_liability_cents == 0"
            - "response data.effective_cert_count == 1"
            - "response data.open_order_count == 0"
            - "ReturnAuthorization.${ra_j1_id}.credit_amount_cents == 9359"
            - "ReturnAuthorization.${ra_j1_id}.restocking_fee_cents == 1040"
            - "WarrantyClaim.${claim_j_id}.claim_status == OEM_DENIED"
            - "WarrantyClaim.${claim_k_id}.claim_status == OEM_DENIED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: line_pricing_rounds_per_unit_before_multiplying_mode_b
        grounds:
          - calculations.order_line_pricing
          - calculations.order_totals
          - entities.OrderLine.fields.extended_price_cents
          - entities.PartOrder.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order instance: the scaffold pins round-per-unit-then-multiply,
          so 3 x round_half_up(12999*0.80) == 31197 and the order subtotal is 133597, whereas the
          rejected sum-then-round order would give 31198 and a subtotal of 133598.
        test_recipe:
          setup:
            - "PricingTier GOLD with mechanical discount 0.20; Branch STL; Parts P1 (12999) and P4 (128000), both MECHANICAL."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "A DRAFT WILL_CALL order at STL with no lines yet; the clock stays at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_1_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v1: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p4_id}", quantity: 1, expected_part_order_version: "${order_v1}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_2_id: $.data.id }
          assert:
            - "OrderLine.${line_1_id}.unit_price_cents == 10399"
            - "OrderLine.${line_1_id}.extended_price_cents == 31197"
            - "OrderLine.${line_2_id}.unit_price_cents == 102400"
            - "OrderLine.${line_2_id}.extended_price_cents == 102400"
            - "PartOrder.${order_id}.subtotal_cents == 133597"
            - "PartOrder.${order_id}.subtotal_cents != 133598"
            - "PartOrder.${order_id}.total_cents == 133597"
            - "ServicerAccount.${acct_s_id}.credit_used_cents == 133597"

      - name: restocking_fee_tier_keyed_on_gross_not_net_mode_c
        grounds:
          - calculations.restocking_fee_and_credit
          - entities.ReturnAuthorization.fields.restocking_fee_pct
          - entities.ReturnAuthorization.fields.credit_amount_cents
          - state_machines.ReturnAuthorization.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) circular-looking-dependency instance: the fee percentage is keyed on the
          pre-fee gross of 102400, which clears LARGE_RETURN_GROSS_CENTS and yields pct 0.25,
          fee 25600 and credit 76800 — whereas keying the large-return adder on the post-fee
          net (81920, below the 100000 threshold) would yield fee 20480 and credit 81920.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P4 W10-MOTOR MECHANICAL list 128000, weight 9000 g."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "A WILL_CALL order for 1 unit of P4 is fulfilled at STL on 2026-08-01 with invoiced_unit_price_cents 102400."
            - "The clock is advanced to 2026-08-21, so the return is requested on day 20 — past RESTOCK_TIER1_MAX_DAYS (15) but inside RETURN_WINDOW_DAYS (30)."
            - "The return authorization exists in REQUESTED with reason_code WRONG_PART, quantity 1, gross_return_cents 102400, and no fee waiver."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p4_id}", on_hand_units: 5, reorder_point: 1 }
              as: PlatformAdmin
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
