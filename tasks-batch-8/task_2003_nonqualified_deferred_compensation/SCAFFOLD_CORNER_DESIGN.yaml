        grounds: ["validations[priority=9.2]", "errors[ERR_CROSS_PLAN_REFERENCE]", "errors[ERR_ACCOUNT_REQUIRED]", "errors[ERR_NO_VERIFIED_CIC]", "errors[ERR_NEGATIVE_TRUST_ASSETS]"]
        distinguishing_aspect: "Referential integrity across aggregates: an election cannot reference another plan's fund; an account cannot pair a participant with a different plan; a deferral cannot post without an account; CIC funding requires a VERIFIED CIC; a valuation adjustment may not drive trust assets negative."
