              captures: { h53b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h53a_id}", meter_type: "TV_TUNER", serial_no: "MT-002057" }
              as: FieldTechnician
              captures: { mt53a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h53b_id}", meter_type: "TV_TUNER", serial_no: "MT-002058" }
              as: FieldTechnician
              captures: { mt53b_id: "$.data.id" }
            - call: "POST /meters/${mt53a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt53b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h53a_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c53_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households/${h53b_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c53_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 2: data.fill_rate == 0.3333 exactly four decimal places (1/3 == 0.33333... rounds DOWN at the 4th place), data.quota_status == UNDER_TARGET"
            - "Trigger call 4: data.fill_rate == 0.6667 (2/3 == 0.66666... rounds UP at the 4th place under round_half_up), still UNDER_TARGET because 0.6667 < 0.8000"
            - "Trigger call 4: data.intab_count == 2 and data.incentive_boost_active == true throughout - neither rate reached ON_TARGET"

      - name: posture_frozen_outranks_closed_and_a_cell_less_market_is_restricted
        claim_type: constraint_propagation
        grounds:
          - calculations.market_recruitment_posture
          - calculations.market_recruitment_posture.note
        distinguishing_aspect: "All four clauses of the posture ladder are walked in one market, including the two that are easy to get wrong: a market with NO cells is RESTRICTED (clause 3 fires on an empty count, not clause 4), and an open audit outranks a fully filled panel (clause 1 beats clause 2) and then hands the posture back to CLOSED when the audit closes."
        test_recipe:
          setup:
            - "An empty database at the startup clock 2026-08-01T00:00:00Z. Everything below is built inside the trigger so each posture evaluation is observed as it happens."
          setup_api_calls:
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C54", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs54_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs54_id}/publish"
              payload: {}
              as: MethodologyStatistician
          trigger:
            - call: "POST /markets"
              payload: { name: "Metro Ladder", market_code: "DMA-654", dma_rank: 154, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m54_id: "$.data.id" }
            - call: "POST /markets/${m54_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c54_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m54_id}", quota_cell_id: "${c54_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h54_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h54_id}", meter_type: "TV_TUNER", serial_no: "MT-002059" }
              as: FieldTechnician
              captures: { mt54_id: "$.data.id" }
            - call: "POST /meters/${mt54_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h54_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /markets/${m54_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m54_id}", scope_edit_rule_set_id: "${rs54_id}", auditor_note: "Methodology review of DMA-654" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-54"
              captures: { au54_id: "$.data.id" }
            - call: "GET /markets/${m54_id}"
              payload: {}
              as: AccreditationAuditor
            - call: "POST /accreditation-audits/${au54_id}/finalize"
              payload: { outcome: "DENIED", limitation_disclosures: ["PANEL_TOO_SMALL"] }
              as: AccreditationAuditor
              as_user_id: "auditor-finalizer-54"
            - call: "GET /markets/${m54_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: quota_cell_count == 0, so under_target_cell_count == 0 and clause 3 fires on the EMPTY cell set: data.recruitment_posture == RESTRICTED (never OPEN) with data.posture_changed_at == 2026-08-01T00:00:00Z"
            - "Trigger call 2: the new cell is UNDER_TARGET, so under_target_cell_count == 1 and clause 4 fires: data.recruitment_posture == OPEN"
            - "Trigger call 6: the household reaches ACTIVE, fill_rate 1/1 == 1.0000 -> FILLED, so quota_cell_count == filled_cell_count == 1 and clause 2 fires"
            - "Trigger call 7: data.recruitment_posture == CLOSED, data.filled_cell_count == 1, data.under_target_cell_count == 0, data.incentive_budget_reserved_cents == 0 (the boost disarmed on the way past ON_TARGET)"
            - "Trigger call 8: HTTP 201 with data.state == OPEN; open_audit_count becomes 1"
            - "Trigger call 9: data.recruitment_posture == FROZEN and data.open_audit_count == 1 - clause 1 outranks the still-true clause 2, and data.filled_cell_count is still 1"
