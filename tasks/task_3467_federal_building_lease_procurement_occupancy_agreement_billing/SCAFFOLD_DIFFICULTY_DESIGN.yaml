          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "Kitchenette", description: "Break room upgrade", scope_sf: 400 }, as: AgencyManager, as_user_id: "${ag}", captures: { err: $.data.error_id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "Kitchenette", description: "Break room upgrade", scope_sf: 400 }, as: AgencyManager, as_user_id: "${ag}", captures: { alt: $.data.id } }
          assert:
            - "Create on DRAFT OA fails with ${err} == ERR_OA_NOT_ACTIVE"
            - "After activation the identical create succeeds: AlterationRequest ${alt}.status == REQUESTED and oa_id == ${oa}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: owned_building_aggregate_capacity_overlapping_oas
        grounds:
          - calculations.space_inventory_reconciliation
          - validations[priority=11]
          - errors[ERR_BUILDING_CAPACITY_EXCEEDED]
          - entities.Building.fields.available_sf
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY over concurrent intervals:
          Concurrent OAs on the same owned building are window-blind inventory
          allocations and must sum to <= total_sf. 30,000 + 25,000 > 50,000 is rejected even though
          each OA is individually legal; 30,000 + 20,000 == 50,000 (exactly
          full) is accepted. Different semantics and different resource from
          the alteration-window buffer instance.
        test_recipe:
          setup:
            - "Owned building total_sf 50,000; OA-A created in DRAFT for 30,000 sf spanning 2027-01-01..2030-12-31 (available_sf 20,000)"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-230", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 30000, start_date: "2027-01-01", end_date: "2030-12-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa_a: $.data.id } }
          trigger:
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 25000, start_date: "2028-06-01", end_date: "2031-05-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 20000, start_date: "2028-06-01", end_date: "2031-05-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa_c: $.data.id } }
          assert:
            - "25,000-sf OA rejected with ${err} == ERR_BUILDING_CAPACITY_EXCEEDED (aggregate 55,000 > 50,000)"
            - "20,000-sf OA accepted: ${oa_c} created with status DRAFT (aggregate exactly 50,000 == total_sf is allowed)"
            - "Building ${bld}.available_sf == 0 after the accepted creation"

      - name: alteration_work_windows_buffer_exclusion
        grounds:
          - state_machines.AlterationRequest.REQUESTED_to_ESTIMATED
          - validations[priority=9]
          - errors[ERR_ALTERATION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = POINT EXCLUSION WITH BUFFER DAYS on the OA's
          alteration calendar: a second work window starting 10 days after the
          first window's end (gap 10 < 14 clear days) conflicts, while a gap
          of exactly 14 days passes. Different interval arithmetic and
          different resource entity from the aggregate-capacity instance.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf; alteration A1 ESTIMATED with work window 2028-03-01..2028-03-31"
            - "Alteration A2 created (REQUESTED)"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-240", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "Phase one", description: "East wing", scope_sf: 30000 }, as: AgencyManager, as_user_id: "${ag}", captures: { alt1: $.data.id } }
            - { call: "POST /leasing/alteration-requests/${alt1}/estimate", payload: { estimated_cost_cents: 5000000, work_start_date: "2028-03-01", work_end_date: "2028-03-31" }, as: GSAPropertyManager }
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "Phase two", description: "West wing", scope_sf: 30000 }, as: AgencyManager, as_user_id: "${ag}", captures: { alt2: $.data.id } }
          trigger:
            - { call: "POST /leasing/alteration-requests/${alt2}/estimate", payload: { estimated_cost_cents: 4000000, work_start_date: "2028-04-10", work_end_date: "2028-04-20" }, as: GSAPropertyManager, captures: { err: $.data.error_id } }
            - { call: "POST /leasing/alteration-requests/${alt2}/estimate", payload: { estimated_cost_cents: 4000000, work_start_date: "2028-04-14", work_end_date: "2028-04-20" }, as: GSAPropertyManager }
          assert:
            - "Window starting 2028-04-10 fails with ${err} == ERR_ALTERATION_WINDOW_CONFLICT (gap 10 days < 14)"
            - "A2 remains REQUESTED after the rejected estimate (failed validation does not transition)"
            - "Window starting 2028-04-14 succeeds: A2 ESTIMATED (gap exactly 14 days is allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: oa_create_then_terminate_restores_space_inventory
        grounds:
          - calculations.space_inventory_reconciliation
          - state_machines.OccupancyAgreement.ACTIVE_to_TERMINATED
          - entities.Building.fields.available_sf
        distinguishing_aspect: |
          Conserved quantity = SQUARE FEET on an owned building: OA creation
          commits 20,000 sf (available 50,000 -> 30,000) and its termination
          is the compensating action that returns available_sf to exactly
          50,000, so assigned + available == total_sf holds before, between,
          and after the pair. Different conserved quantity from the
          lump-sum receivable instance.
        test_recipe:
          setup:
            - "Owned building total_sf 50,000, available_sf 50,000"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-250", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 20000, start_date: "2026-11-01", end_date: "2036-10-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "GET /leasing/buildings/${bld}", as: GSAAdmin, captures: { avail_mid: $.data.available_sf } }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/terminate", as: GSALeasingOfficer }
            - { call: "GET /leasing/buildings/${bld}", as: GSAAdmin, captures: { avail_end: $.data.available_sf } }
          assert:
            - "${avail_mid} == 30000 (create committed 20,000 of 50,000)"
            - "${avail_end} == 50000 (terminate restored the full inventory: no drift)"
            - "OA ${oa}.status == TERMINATED"
            - "Invariant: sum(assigned_sf over non-terminal OAs) + available_sf == total_sf holds at every probe (0 + 50,000 == 50,000 at the end)"

      - name: lump_sum_approve_then_cancel_nets_zero_billing
        grounds:
          - calculations.receivable_ledger
          - state_machines.AlterationRequest.ESTIMATED_to_APPROVED
          - state_machines.AlterationRequest.APPROVED_to_CANCELLED
          - entities.RentBill.fields.lump_sum_charges_cents
          - entities.OccupancyAgreement.fields.receivable_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (cents) in the OA's receivable ledger:
          approving a 12,000,000-cent LUMP_SUM alteration stages a PENDING
          charge, and the compensating cancel flips it to REVERSED before any
          bill can pick it up, so the next bill's lump_sum_charges_cents == 0
          and receivable_outstanding_cents equals the rent-only total
          24,347,894 — identical to a world where the alteration never
          existed. Different conserved quantity from the space instance.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf; 2027 tax statement actual 460 recorded"
            - "Alteration estimated 12,000,000 (work 2028-03-01..2028-03-31), approved LUMP_SUM, then cancelled before completion"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-260", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/leases/${lease}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 460 }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements/${oa}/alteration-requests", payload: { title: "Lobby refresh", description: "Cosmetic lobby work", scope_sf: 1500 }, as: AgencyManager, as_user_id: "${ag}", captures: { alt: $.data.id } }
            - { call: "POST /leasing/alteration-requests/${alt}/estimate", payload: { estimated_cost_cents: 12000000, work_start_date: "2028-03-01", work_end_date: "2028-03-31" }, as: GSAPropertyManager }
            - { call: "POST /leasing/alteration-requests/${alt}/approve", payload: { funding_method: "LUMP_SUM" }, as: AgencyManager, as_user_id: "${ag}" }
          trigger:
            - { call: "POST /leasing/alteration-requests/${alt}/cancel", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/occupancy-agreements/${oa}/bills", payload: { billing_month: "2028-05" }, as: GSAPropertyManager }
            - { call: "GET /leasing/occupancy-agreements/${oa}", as: GSAAdmin, captures: { recv: $.data.receivable_outstanding_cents } }
          assert:
            - "Alteration ${alt}.status == CANCELLED and lump_charge_status == REVERSED"
            - "Bill 2028-05: lump_sum_charges_cents == 0 (the reversed charge never reaches a bill)"
            - "Bill 2028-05: total_cents == 24347894 (identical to the no-alteration rent-only bill)"
            - "${recv} == 24347894 (receivable equals the single unpaid bill: approve+cancel left zero net billing effect)"
