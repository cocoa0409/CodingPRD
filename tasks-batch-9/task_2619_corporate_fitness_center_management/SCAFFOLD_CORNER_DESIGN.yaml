      - name: submit_a_withdrawn_contract_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClientContract.terminal_states
          - state_machines.ClientContract.DRAFT_to_WITHDRAWN
          - validations[priority 13].ERR_TERMINAL_STATE
        distinguishing_aspect: |
          WITHDRAWN is terminal, so every action endpoint on that contract must
          answer 409 ERR_TERMINAL_STATE — including submit (which has a
          DRAFT-only transition) and service-status RESUME — rather than the
          state-specific ERR_INVALID_STATE_TRANSITION from priority 12.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a DRAFT contract with an ACTIVE_DUTY SITE_MANAGER, terminated while still DRAFT so it lands in WITHDRAWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/service-status"
              payload: { action: "TERMINATE", reason: "Client cancelled before signature" }
              as: OperatorAdmin
          trigger:
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/service-status"
              payload: { action: "RESUME" }
              as: OperatorAdmin
          assert:
            - "Setup TERMINATE -> HTTP 200 AND ClientContract.${c_id}.status == \"WITHDRAWN\""
            - "submit -> HTTP 409 AND data.error_id == \"ERR_TERMINAL_STATE\" (priority 13 outranks priority 12)"
            - "service-status RESUME -> HTTP 409 AND data.error_id == \"ERR_TERMINAL_STATE\""
            - "ClientContract.${c_id}.status == \"WITHDRAWN\" AND revision_round == 0 after both rejections"
            - "A second contract may now take site_code \"NWM-01\" — WITHDRAWN releases the uniqueness claim (errors.ERR_SITE_CODE_CONFLICT)"

      - name: second_verify_on_a_verified_credential_returns_409
        claim_type: idempotency
        grounds:
          - state_machines.StaffCredential.PENDING_VERIFICATION_to_VERIFIED
          - validations[priority 12].ERR_CREDENTIAL_NOT_PENDING
          - errors.ERR_CREDENTIAL_NOT_RENEWABLE
        distinguishing_aspect: |
          verify is not idempotent: replaying ACCEPT on an already VERIFIED
          credential is 409 ERR_CREDENTIAL_NOT_PENDING, and renew on the same
          VERIFIED credential is 409 ERR_CREDENTIAL_NOT_RENEWABLE (renew accepts
          only EXPIRED or REJECTED). The credential's verified_at must not be
          re-stamped by the rejected replay.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a DRAFT contract with a SITE_MANAGER whose CPR_AED credential has already been ACCEPTed once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
