      - name: aggregate_onsite_concurrency_cap_counts_overlaps_across_all_sessions
        grounds:
          - validations[priority=13]
          - errors.ERR_SITE_CONCURRENCY_EXCEEDED
          - state_machines.GroupSession.session_status.SCHEDULED_to_CANCELED
        distinguishing_aspect: |
          A third interval semantics on a third resource: the facility itself. The cap is an
          AGGREGATE count of half-open overlaps across every non-canceled ONSITE session
