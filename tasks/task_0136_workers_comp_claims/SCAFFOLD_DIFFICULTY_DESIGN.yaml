              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /ime-orders"
              payload: { claim_id: "${claim_a}", scheduled_start: "2026-03-10T10:00:00Z", scheduled_end: "2026-03-10T11:00:00Z", examiner_name: "Dr First" }
              as: ClaimsAdjuster
              captures: { ime_1: $.data.id }
          trigger:
            - call: "POST /ime-orders"
              payload: { claim_id: "${claim_a}", scheduled_start: "2026-03-10T11:00:00Z", scheduled_end: "2026-03-10T12:00:00Z", examiner_name: "Dr Second" }
              as: ClaimsAdjuster
              captures: { ime_2: $.data.id }
          assert:
            - "Response status == 201; IMEOrder.${ime_2}.status == SCHEDULED (touching endpoints at 11:00 do not overlap)"
            - "A window starting at 2026-03-10T10:59:59Z instead would be rejected with ERR_IME_WINDOW_CONFLICT (409)."

