              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_ex_id: $.data.id }
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_ex_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_ex_id: $.data.id, ex_status_0: $.data.status, ex_assigned_at: $.data.assigned_at }
          trigger:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
