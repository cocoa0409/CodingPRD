  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_pay_deposit
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - state_machines.Booking.transitions.RESERVED_to_CONFIRMED
        distinguishing_aspect: |
          A pay-deposit call on a booking that is ALREADY CONFIRMED (state p5 fails:
          ERR_BOOKING_NOT_RESERVED) AND carries amount_cents below deposit_due (fiscal p12
          fails: ERR_DEPOSIT_UNDERPAID) returns the state error, proving state outranks
          business_fiscal — the category pair is state vs business_fiscal.
        test_recipe:
          setup:
            - "Charter DRAFT; a booking (base 10000 party 2 -> deposit_due 5000) already paid and CONFIRMED."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Pri Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Priboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Pri Cust", email: "pri@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2026-11-10T12:00:00Z", return_at: "2026-11-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 100 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BOOKING_NOT_RESERVED"

      - name: referential_before_safety_on_crew_assignment
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.CrewAssignment.transitions.TENTATIVE_to_LOCKED
        distinguishing_aspect: |
          A crew assignment whose captain is BOTH at a different marina (referential, p6)
          AND below the grade required for OFFSHORE (safety, p7) returns the referential
          error ERR_CROSS_MARINA_MISMATCH, proving business_referential outranks
          business_safety — a different category pair than the state-vs-safety conflict.
        test_recipe:
          setup:
            - "OFFSHORE charter at marina X; a captain at marina Y (cross-marina) holding only OUPV grade (insufficient for OFFSHORE)."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Marina X", slot_count: 2 }
              as: DockMaster
              captures: { marina_x_id: $.data.id }
            - call: "POST /marinas"
              payload: { name: "Marina Y", slot_count: 2 }
              as: DockMaster
              captures: { marina_y_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_x_id}", name: "Offboat", length_ft: 40, passenger_capacity: 8, offshore_rated: true }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /permits"
              payload: { permit_kind: "FEDERAL_OFFSHORE", permit_number: "F-1", valid_through: "2030-01-01T00:00:00Z", daily_bag_limit: 20 }
              as: FleetManager
              captures: { permit_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_y_id}", full_name: "Cap Y", uscg_license_grade: "OUPV", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_y_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_x_id}", boat_id: "${boat_id}", permit_id: "${permit_id}", trip_type: "OFFSHORE", depart_at: "2026-11-10T06:00:00Z", return_at: "2026-11-10T18:00:00Z", base_seat_price_cents: 30000, seats_total: 8 }
              as: FleetManager
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_y_id}" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CROSS_MARINA_MISMATCH"

