# =============================================================================
# Task 1249 — Mushroom Farm & Substrate Production
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Sections and claim_types follow references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: variety_create_applies_computed_defaults
        claim_type: defaults
        grounds: [entities.Variety.fields.active_committed_kg, entities.Variety.fields.planned_production_kg, "endpoints.POST /api/varieties"]
        distinguishing_aspect: "A freshly created variety carries computed supply/demand fields at 0.0 and version 1."
        test_recipe:
          setup: ["Empty database; logical clock at its default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
          assert:
            - "201 with Variety.${v_id}.version == 1"
            - "Variety.${v_id}.active_committed_kg == 0.0 and planned_production_kg == 0.0 (computed defaults, client input for them would be ignored)"
            - "Variety.${v_id}.id and created_at are server-minted"

      - name: variety_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Variety.fields.substrate_recipe, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "substrate_recipe outside {PHASE_II_COMPOST, STRAW_SAWDUST} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/varieties"
              payload: { variety_code: "XX1", display_name: "Bad", substrate_recipe: "GOLDEN_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }
              as: CompostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 400)"
            - "no Variety persisted (GET /api/varieties/{anyId} would 404)"

      - name: batch_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.SubstrateBatch.fields.tonnage, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field tonnage on batch creation yields ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/substrate-batches"
              payload: { recipe: "PHASE_II_COMPOST" }
              as: CompostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: room_create_extra_id_field_input_ignored
        claim_type: system_fields
        grounds: [entities.GrowingRoom, "endpoints.POST /api/rooms"]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored; the server mints its own id and starts version at 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0, id: "11111111-1111-1111-1111-111111111111", version: 99 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
          assert:
            - "201 with GrowingRoom id != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "GrowingRoom.${r_id}.version == 1 (client version 99 ignored)"
            - "occupancy_status == IDLE and health_status == CLEAR"

      - name: flush_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FLUSH_NOT_FOUND]", "endpoints.GET /api/flushes/{flushId}"]
        distinguishing_aspect: "GET on a non-existent flush id yields the flush-specific 404 code."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/flushes/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FLUSH_NOT_FOUND (HTTP 404)"

  - section: state_machines
    instances:
      - name: batch_spawn_before_conditioned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SubstrateBatch.CONDITIONED_to_SPAWNED, "errors[ERR_BATCH_NOT_CONDITIONED]"]
        distinguishing_aspect: "Spawning a MIXED batch (pasteurization never run) is rejected; only CONDITIONED may spawn."
        test_recipe:
          setup: ["Variety WB1 exists; batch b1 (40t) created and still MIXED"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
          trigger:
            - call: "POST /api/substrate-batches/${b_id}/spawn"
              payload: { variety_id: "${v_id}", spawn_kg: 280.0 }
              as: CompostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BATCH_NOT_CONDITIONED (HTTP 409)"
            - "SubstrateBatch.${b_id}.status == MIXED and variety_id == null"

      - name: pasteurization_threshold_and_state_edges
        claim_type: precondition_enforcement
        grounds: [state_machines.PasteurizationCycle.RUNNING_to_COMPLETED, calculations.pasteurization_completion, "errors[ERR_CYCLE_INVALID_STATE]", "errors[ERR_PASTEURIZATION_INCOMPLETE]"]
        distinguishing_aspect: "Complete on a SCHEDULED cycle fails state; 5.9 hours fails the inclusive >= 6.0 threshold; exactly 6.0 completes."
        test_recipe:
          setup: ["Tunnel t1; batch b1 (40t); cycle pc1 SCHEDULED for 2026-05-01..2026-05-02"]
          setup_api_calls:
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
          trigger:
            - call: "POST /api/pasteurization-cycles/${pc_id}/complete"
              payload: { hours_at_target_temp: 8.0 }
              as: CompostSupervisor
              captures: { err1: $.data.error_id }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - call: "POST /api/pasteurization-cycles/${pc_id}/complete"
              payload: { hours_at_target_temp: 5.9 }
              as: CompostSupervisor
              captures: { err2: $.data.error_id }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 6.0 }, as: CompostSupervisor }
          assert:
            - "Complete while SCHEDULED: err1 == ERR_CYCLE_INVALID_STATE"
            - "Complete with 5.9 h while RUNNING: err2 == ERR_PASTEURIZATION_INCOMPLETE and cycle stays RUNNING"
            - "Complete with exactly 6.0 h succeeds (inclusive boundary): PasteurizationCycle.${pc_id}.status == COMPLETED"
            - "SubstrateBatch.${b_id}.status == CONDITIONED"

      - name: rcycle_place_before_window_rejected
        claim_type: temporal_validation
        grounds: [state_machines.RoomCycle.SCHEDULED_to_SPAWN_RUN, "errors[ERR_CYCLE_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "Placement at clock 2026-05-01 when planned_start is 2026-05-03 is rejected; the cycle stays SCHEDULED and the room stays IDLE."
        test_recipe:
          setup: ["Batch b1 SPAWNED; cycle rc1 booked for 2026-05-03..2026-06-14; logical clock still at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
          trigger:
            - call: "POST /api/room-cycles/${rc_id}/place"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CYCLE_WINDOW_NOT_OPEN (HTTP 409)"
            - "RoomCycle.${rc_id}.status == SCHEDULED and GrowingRoom.${r_id}.occupancy_status == IDLE"

      - name: rcycle_advance_colonization_boundary
        claim_type: temporal_validation
        grounds: [state_machines.RoomCycle.SPAWN_RUN_to_CASING, "errors[ERR_COLONIZATION_INCOMPLETE]"]
        distinguishing_aspect: "Advance at placed_at + 2 days (spawn_run_days = 3) fails; advance at exactly placed_at + 3 days succeeds (inclusive >=)."
        test_recipe:
          setup: ["Batch SPAWNED; cycle rc1 placed at 2026-05-03T00:00:00Z (SPAWN_RUN)"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: FarmManager }
            - call: "POST /api/room-cycles/${rc_id}/advance"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
          assert:
            - "At +2 days: err == ERR_COLONIZATION_INCOMPLETE and cycle stays SPAWN_RUN"
            - "At exactly +3 days: advance succeeds and RoomCycle.${rc_id}.status == CASING"

      - name: flush_record_beyond_max_flushes_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_FLUSH_LIMIT_REACHED]", "endpoints.POST /api/room-cycles/{roomCycleId}/flushes"]
        distinguishing_aspect: "With max_flushes = 3 and three flushes already recorded (still ungraded), the fourth record is rejected even though the cycle is still FRUITING."
        test_recipe:
          setup: ["Batch SPAWNED; cycle rc1 FRUITING at clock 2026-05-08; flushes f1, f2, f3 recorded (10.0 kg each) and NOT graded"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 10.0 }, as: FarmManager, captures: { f1_id: $.data.id, f1_no: $.data.flush_number } }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 10.0 }, as: FarmManager, captures: { f2_id: $.data.id, f2_no: $.data.flush_number } }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 10.0 }, as: FarmManager, captures: { f3_id: $.data.id, f3_no: $.data.flush_number } }
          trigger:
            - call: "POST /api/room-cycles/${rc_id}/flushes"
              payload: { total_kg: 10.0 }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "flush_number auto-assignment produced 1, 2, 3 for f1..f3"
            - "Fourth record: err == ERR_FLUSH_LIMIT_REACHED (HTTP 409)"
            - "RoomCycle.${rc_id}.status == FRUITING (limit rejection triggers no turnover; only grading does)"

      - name: flush_grade_split_mismatch_rejected
        claim_type: violation_to_error
        grounds: [calculations.flush_grade_shares, "errors[ERR_GRADE_SPLIT_MISMATCH]"]
        distinguishing_aspect: "Grade split 60.0 + 30.0 + 9.99 = 99.99 != total_kg 100.0 is rejected at 2-decimal exactness and the flush stays RECORDED."
        test_recipe:
          setup: ["Batch SPAWNED; cycle rc1 FRUITING at clock 2026-05-08; flush f1 RECORDED with total_kg 100.0"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 100.0 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - call: "POST /api/flushes/${f_id}/grade"
              payload: { grade_a_kg: 60.0, grade_b_kg: 30.0, cull_kg: 9.99 }
              as: GradingInspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GRADE_SPLIT_MISMATCH (HTTP 422)"
            - "FlushHarvest.${f_id}.status == RECORDED with grade fields still null"
            - "RoomCycle.${rc_id}.flush_count == 0 and harvested_kg == 0.0"

      - name: flush_reopen_reverses_grading_effects
        claim_type: side_effect_execution
        grounds: [state_machines.FlushHarvest.GRADED_to_RECORDED]
        distinguishing_aspect: "Reopen is the compensation transition: grade fields null out and the cycle's flush_count/harvested_kg roll back to 0."
        test_recipe:
          setup: ["Batch SPAWNED; cycle rc1 FRUITING at clock 2026-05-08; flush f1 (100.0 kg) GRADED 60/30/10; no pieces or packaged lots"]
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
