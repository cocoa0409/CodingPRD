            - "Second call: HTTP 200; Show.${sh1}.status == SETTLED and compliance_signoff_by_user_id == 'co-signoff-1'"
            - "Product.${p1}.substantiated_by_user_id == 'co-claims-1' throughout"

      - name: replay_marker_offset_at_the_aired_duration_accepted_one_second_past_rejected
        claim_type: violation_and_satisfaction
