# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x >=2 instances. Grounds resolve into SCAFFOLD.yaml
# §1.1-§1.7. All formula-derived asserts pre-computed as integer-cent literals.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: repricing_in_network_ppo_vs_out_of_network_ucr
        grounds:
          - calculations.claim_repricing
          - entities.Claim.fields.allowed_amount_cents
          - entities.Provider.fields.in_network
          - entities.Provider.fields.ppo_discount_pct
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: |
          For identical billed charges (100000 cents) the in-network PPO variant yields
          allowed 60000 (round(billed*(1-0.40))) while the out-of-network UCR variant yields
          allowed 70000 (min(billed, ucr 70000)) — same input, two algorithms, different result.
        test_recipe:
          setup:
            - "Plan (ded 100000, oop 500000, coins 0.80) with one in-network provider (40% PPO) and one out-of-network provider; one member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet Clinic", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov_in: $.data.id }
            - call: "POST /providers"
              payload: { name: "OON Clinic", tax_id: "33-3333333", npi: "2222222222", in_network: false }
              as: TPAAdmin
              captures: { prov_oon: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "Nguyen", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov_in}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { claim_in: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov_oon}", service_date: "2026-03-05", billed_lines: [{ billed_cents: 100000 }], ucr_amount_cents: 70000 }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { claim_oon: $.data.id }
          trigger:
            - call: "POST /claims/${claim_in}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /claims/${claim_oon}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${claim_in}.allowed_amount_cents == 60000"
            - "Claim.${claim_oon}.allowed_amount_cents == 70000"
            - "Claim.${claim_in}.allowed_amount_cents != Claim.${claim_oon}.allowed_amount_cents"

      - name: aggregate_stop_loss_paid_basis_vs_incurred_basis
        grounds:
          - calculations.aggregate_stop_loss
          - entities.StopLossPolicy.fields.contract_basis
          - state_machines.StopLossPolicy.ACTIVE_to_SETTLED
          - validations[priority=10]
        distinguishing_aspect: |
          For one claim incurred 2026-06-01 (plan_paid 5500000) but paid 2026-08-01, the INCURRED-basis
          policy recognizes an aggregate reimbursement of 500000 (net 5500000 over attachment 5000000),
          while the PAID-basis policy sees zero qualifying claims (paid after 2026-07-01 window) and returns
          ERR_AGGREGATE_NOT_REACHED — same claim, two bases, divergent settlement on StopLossPolicy.
        test_recipe:
          setup:
            - "Plan A with an ACTIVE INCURRED-basis policy [2026-01-01,2026-07-01), attachment 5000000, specific 100000000 (no specific interference); one adjudicated big claim (plan_paid 5500000, service 2026-06-01)."
            - "Plan B with an ACTIVE PAID-basis policy same window/attachment; one identical claim adjudicated then PAID via a check-run released 2026-08-01."
          setup_api_calls:
            - call: "POST /providers"
              payload: { name: "Hospital", tax_id: "44-4444444", npi: "3333333333", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            # ----- Plan A: INCURRED basis -----
            - call: "POST /plans"
              payload: { sponsor_name: "PlanA", sponsor_tax_id: "50-0000001", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_a}", carrier_name: "ReCarrier", contract_basis: "INCURRED", effective_date: "2026-01-01", expiry_date: "2026-07-01", specific_deductible_cents: 100000000, aggregate_attachment_cents: 5000000 }
              as: TPAAdmin
              captures: { pol_a: $.data.id }
            - call: "POST /stop-loss-policies/${pol_a}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /members"
              payload: { plan_id: "${plan_a}", first_name: "Al", last_name: "A", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: TPAAdmin
            - call: "POST /claims"
              payload: { member_id: "${mem_a}", provider_id: "${prov}", service_date: "2026-06-01", billed_lines: [{ billed_cents: 10000000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { claim_a: $.data.id }
            - call: "POST /claims/${claim_a}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            # ----- Plan B: PAID basis -----
            - call: "POST /plans"
              payload: { sponsor_name: "PlanB", sponsor_tax_id: "50-0000002", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_b}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2026-07-01", specific_deductible_cents: 100000000, aggregate_attachment_cents: 5000000 }
              as: TPAAdmin
              captures: { pol_b: $.data.id }
            - call: "POST /stop-loss-policies/${pol_b}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /members"
              payload: { plan_id: "${plan_b}", first_name: "Bo", last_name: "B", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { mem_b: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${mem_b}", provider_id: "${prov}", service_date: "2026-06-01", billed_lines: [{ billed_cents: 10000000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { claim_b: $.data.id }
            - call: "POST /claims/${claim_b}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_b}" }
              as: FundManager
              captures: { fa_b: $.data.id }
            - call: "POST /fund-accounts/${fa_b}/deposit"
              payload: { amount_cents: 5500000 }
              as: FundManager
              captures: { fa_b_v: $.data.version }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa_b}", claim_ids: ["${claim_b}"] }
              as: FundManager
              captures: { cr_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TPAAdmin
            - call: "POST /check-runs/${cr_b}/release"
              payload: { expected_fund_account_version: "${fa_b_v}" }
              as: FundManager
          trigger:
            - call: "POST /stop-loss-policies/${pol_a}/settle-aggregate"
              payload: {}
              as: Auditor
              captures: { reimb_a: $.data.id }
            - call: "POST /stop-loss-policies/${pol_b}/settle-aggregate"
              payload: {}
              as: Auditor
          assert:
            - "settle-aggregate on ${pol_a} (INCURRED) returns 201 with StopLossReimbursement.${reimb_a}.amount_cents == 500000 and reimbursement_type == AGGREGATE"
            - "StopLossPolicy.${pol_a}.total_aggregate_reimbursed_cents == 500000"
            - "settle-aggregate on ${pol_b} (PAID) returns 422 ERR_AGGREGATE_NOT_REACHED"

  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_nested_deductible_coinsurance_oop_mode_a
        grounds:
          - calculations.member_cost_share
          - entities.Claim.fields.deductible_applied_cents
          - entities.Claim.fields.member_coinsurance_cents
          - entities.Claim.fields.plan_paid_cents
          - entities.Member.fields.deductible_met_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input nested min/max split. With deductible_met 60000 (from a prior 100000 claim),
          a 200000 in-network claim (allowed 120000) yields deductible_applied 40000, coinsurance 16000,
          member_responsibility 56000, plan_paid 64000 — the deductible-then-coinsurance-then-OOP waterfall.
        test_recipe:
          setup:
            - "Plan (ded 100000, oop 500000, coins 0.80), in-network provider (40%), one member; first claim (billed 100000) adjudicated so deductible_met_cents==60000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-02", billed_lines: [{ billed_cents: 200000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /claims/${c2}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${c2}.allowed_amount_cents == 120000"
            - "Claim.${c2}.deductible_applied_cents == 40000"
            - "Claim.${c2}.member_coinsurance_cents == 16000"
            - "Claim.${c2}.member_responsibility_cents == 56000"
            - "Claim.${c2}.plan_paid_cents == 64000"
            - "Member.${member_id}.deductible_met_cents == 100000"

      - name: per_line_repricing_rounding_order_mode_b
        grounds:
          - calculations.claim_repricing
          - entities.Claim.fields.billed_lines
          - entities.Claim.fields.allowed_amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order. With a 37.5% PPO discount and two lines of 100 cents each,
          round-per-line-then-sum gives 63+63=126, whereas sum-then-round gives round(200*0.625)=125.
          The scaffold pins per-line rounding, so allowed_amount_cents == 126.
        test_recipe:
          setup:
            - "Plan; in-network provider with ppo_discount_pct 0.375; one member; a claim with two 100-cent lines."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Frac Clinic", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.375 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Ivy", last_name: "R", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100 }, { billed_cents: 100 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${c}.allowed_amount_cents == 126"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_reverse_then_readjudicate_cycle
        grounds:
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - state_machines.Claim.REVERSED_to_ADJUDICATED
          - entities.Member.fields.deductible_met_cents
        distinguishing_aspect: |
          Claim exhibits a cycle ADJUDICATED -> REVERSED -> ADJUDICATED on the same entity; after the
          round trip the claim is ADJUDICATED again and the member's deductible_met_cents is back to 60000
          (reversal decremented it to 0, re-adjudication restored it), proving the loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Plan; in-network provider (40%); member; one claim (billed 100000) adjudicated (deductible_met 60000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          trigger:
            - call: "POST /claims/${c}/reverse"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${c}.status == ADJUDICATED"
            - "Member.${member_id}.deductible_met_cents == 60000"

      - name: check_run_branch_release_vs_void
        grounds:
          - state_machines.CheckRun.DRAFT_to_RELEASED
          - state_machines.CheckRun.DRAFT_to_VOIDED
          - entities.FundAccount.fields.balance_cents
        distinguishing_aspect: |
          CheckRun forks from DRAFT into two divergent branches with different side-effect sets: RELEASED
          debits the fund by total_amount_cents and marks its claim PAID, while VOIDED leaves the fund and
          the other claim untouched — a branching machine on CheckRun (distinct entity from Claim's cycle).
        test_recipe:
          setup:
            - "Plan (ded 0); provider (40%); member; two adjudicated claims (each billed 100000, allowed 60000, plan_paid 48000); fund with 100000 deposited; two DRAFT check-runs (cr_release over c2, cr_void over c1)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 0, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-02", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: FundManager
              captures: { fa: $.data.id }
            - call: "POST /fund-accounts/${fa}/deposit"
              payload: { amount_cents: 100000 }
              as: FundManager
              captures: { fa_v: $.data.version }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c2}"] }
              as: FundManager
              captures: { cr_release: $.data.id }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c1}"] }
              as: FundManager
              captures: { cr_void: $.data.id }
          trigger:
            - call: "POST /check-runs/${cr_release}/release"
              payload: { expected_fund_account_version: "${fa_v}" }
              as: FundManager
            - call: "POST /check-runs/${cr_void}/void"
              payload: {}
              as: FundManager
          assert:
            - "CheckRun.${cr_release}.status == RELEASED"
            - "CheckRun.${cr_void}.status == VOIDED"
            - "FundAccount.${fa}.balance_cents == 52000"
            - "FundAccount.${fa}.total_disbursed_cents == 48000"
            - "Claim.${c2}.status == PAID"
            - "Claim.${c1}.status == ADJUDICATED"

  - rule_id: transitive_cascade
    instances:
      - name: adjudicate_cascades_member_accumulator_to_specific_reimbursement_depth3
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - calculations.member_cost_share
          - calculations.specific_stop_loss
          - entities.Member.fields.member_plan_paid_ytd_cents
          - entities.StopLossReimbursement.fields.amount_cents
          - entities.StopLossPolicy.fields.total_specific_reimbursed_cents
        distinguishing_aspect: |
          Depth-3 chain from a single adjudicate: (1) claim -> member accumulators
          (member_plan_paid_ytd_cents = 5500000); (2) that accumulator crossing the specific deductible
          5000000 -> a SPECIFIC StopLossReimbursement of 500000 is created; (3) that reimbursement
          -> StopLossPolicy.total_specific_reimbursed_cents = 500000. Each hop is caused by the previous.
        test_recipe:
          setup:
            - "Plan; in-network provider (40%); member; ACTIVE stop-loss policy (specific 5000000, aggregate 100000000); one submitted big claim (billed 10000000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Hospital", tax_id: "44-4444444", npi: "3333333333", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Sam", last_name: "H", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol: $.data.id }
            - call: "POST /stop-loss-policies/${pol}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-04-01", billed_lines: [{ billed_cents: 10000000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${c}.plan_paid_cents == 5500000"
            - "Member.${member_id}.member_plan_paid_ytd_cents == 5500000"
            - "GET /stop-loss-reimbursements?claim_id=${c} returns exactly 1 reimbursement with reimbursement_type == SPECIFIC and amount_cents == 500000"
            - "StopLossPolicy.${pol}.total_specific_reimbursed_cents == 500000"

      - name: checkrun_release_cascades_claim_paid_to_provider_ytd_depth2
        grounds:
          - state_machines.CheckRun.DRAFT_to_RELEASED
          - entities.Claim.fields.status
          - entities.Provider.fields.ytd_paid_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (check-run release, not adjudicate): (1) release ->
