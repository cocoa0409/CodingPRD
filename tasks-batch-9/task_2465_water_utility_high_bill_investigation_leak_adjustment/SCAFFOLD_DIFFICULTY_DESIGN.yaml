      # -------- pair: PaymentArrangement <- LeakAdjustment (through Bill) --------
      - name: cross_entity_arrangement_amount_tracks_posted_adjustment_on_the_bill
        grounds:
          - validations[ERR_ARRANGEMENT_AMOUNT_MISMATCH]
          - calculations.payment_arrangement_schedule
          - entities.Bill.fields.adjusted_total_cents
          - entities.LeakAdjustment.fields.net_credit_cents
          - concurrency_rules[arrangement-create-stale-account]
          - endpoints[POST /payment-arrangements]
        distinguishing_aspect: |
          ENTITY PAIR: PaymentArrangement depends on LeakAdjustment, reached through Bill — a
          third distinct pair. The financed amount must equal Bill.adjusted_total_cents, and that
          derived field is a function of the LeakAdjustment's STATE, not of any field the
          arrangement caller controls. 44939 is the correct amount while the adjustment is merely
          PENDING_APPROVAL; the moment the adjustment reaches POSTED the same 44939 request is
