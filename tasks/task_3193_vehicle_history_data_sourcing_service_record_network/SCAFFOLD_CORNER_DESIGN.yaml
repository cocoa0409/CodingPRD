            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id, r1: $.data.id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-2" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "flood", event_date: "2026-09-01", payload_ref: "t3", idempotency_key: "k-3" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { r3: $.data.id }
            - call: "GET /records/${r1}"
              as: Any
              captures: { r1_st: $.data.status }
          assert:
            - "Identical content, new key -> HTTP 409 ERR_DUPLICATE_RECORD"
            - "Changed raw_brand_text -> supersede: r3 minted and r1_st == 'SUPERSEDED'"

      - name: cross_source_same_date_accident_accepted
        claim_type: satisfaction_pass
        grounds:
          - calculations.dedupe_grouping
          - calculations.accident_confidence
        distinguishing_aspect: "The same accident reported by a DIFFERENT source is not a duplicate — it is accepted as corroboration and scores with the cross-type bonus at ingest."
        test_recipe:
          setup: ["network; MVA and INSURER ACTIVE; MVA accident on V 2026-09-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
