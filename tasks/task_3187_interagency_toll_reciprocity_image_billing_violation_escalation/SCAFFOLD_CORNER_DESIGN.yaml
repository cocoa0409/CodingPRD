# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3187_interagency_toll_reciprocity_image_billing_violation_escalation
#
# Breadth probe. Every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as excluded_because stubs with no test_recipe.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: agency_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/toll/agencies
        distinguishing_aspect: "Creating an agency with only required fields returns 201 with status ACTIVE, version 1, default settlement_currency USD, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at server default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /toll/agencies"
              payload: { agency_code: "MTA", name: "Metro Toll Alliance", home_state: "NY", reciprocity_fee_bps: 125 }
              as: SettlementOfficer
              captures: { ag: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Agency.${ag}.settlement_currency == \"USD\" (default applied)"
            - "Agency.${ag}.status == ACTIVE and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: account_get_round_trips_computed_and_input_fields
        claim_type: Retrieval
        grounds:
          - entities.Account
          - endpoints.GET_/toll/accounts/{accountId}
        distinguishing_aspect: "Every Account field round-trips through GET exactly as created, including computed balance_cents initialized to the opening balance and replenishment_fail_count 0."
        test_recipe:
          setup:
            - "Agency HOME ACTIVE; plan STD (discount 0); account created with threshold 1500, replenishment 3000, opening balance 7000."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Rita Round", holder_email: "rita@example.com", discount_plan_id: "${plan_id}", low_balance_threshold_cents: 1500, replenishment_amount_cents: 3000, opening_balance_cents: 7000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
          trigger:
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: ViolationsOfficer
          assert:
            - "the response status is 200"
            - "Account.${acct}.balance_cents == 7000 and replenishment_fail_count == 0"
            - "Account.${acct}.low_balance_threshold_cents == 1500 and replenishment_amount_cents == 3000"
            - "Account.${acct}.status == ACTIVE and suspended_reason is null"
            - "Account.${acct}.discount_used_today_cents == 0 and trips_this_month == 0"

      - name: agencies_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/toll/agencies
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three agencies, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Three agencies A1, A2, A3 registered."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "A1", name: "Agency One", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
            - call: "POST /toll/agencies"
              payload: { agency_code: "A2", name: "Agency Two", home_state: "NJ", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
            - call: "POST /toll/agencies"
              payload: { agency_code: "A3", name: "Agency Three", home_state: "PA", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
          trigger:
            - call: "GET /toll/agencies"
              payload: { limit: 2, offset: 0 }
              as: AgencyOperations
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows returned with total_count == 3 and has_more == true"
            - "GET /toll/agencies with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: transponder_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/toll/transponders/{transponderId}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the transponder path segment produces ERR_NOT_FOUND with 404, not 400 or a generic 500."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /toll/transponders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "error_id == ERR_NOT_FOUND"

      - name: account_create_missing_holder_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Account.fields.holder_email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required holder_email on account creation fails fast with 400 ERR_INVALID_REQUEST before any state is persisted."
        test_recipe:
          setup:
            - "Agency HOME and plan STD exist."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "No Email", discount_plan_id: "${plan_id}" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /toll/accounts returns 0 rows (nothing persisted)"

      - name: account_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Account.fields.low_balance_threshold_cents
          - entities.Account.fields.replenishment_amount_cents
        distinguishing_aspect: "Omitting low_balance_threshold_cents and replenishment_amount_cents applies the documented defaults 1000 and 2500; omitting opening_balance_cents starts balance at 0."
        test_recipe:
          setup:
            - "Agency HOME and plan STD exist."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Dee Fault", holder_email: "dee@example.com", discount_plan_id: "${plan_id}" }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
          assert:
            - "Account.${acct}.low_balance_threshold_cents == 1000"
            - "Account.${acct}.replenishment_amount_cents == 2500"
            - "Account.${acct}.balance_cents == 0"

      - name: toll_transaction_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.TollTransaction.fields.charged_amount_cents
          - entities.TollTransaction.fields.detection_method
        distinguishing_aspect: "Client cannot smuggle charged_amount_cents or detection_method into the post payload — they are computed; a tag-resolved trip is TRANSPONDER and priced by the schedule, not by any client amount."
        test_recipe:
          setup:
            - "Agencies HOME/AWAY; AWAY P1 CLASS_2 base 800; plan discount 0; account balance 5000, TAG-Z ACTIVE."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Sam Comp", holder_email: "sam@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-Z", vehicle_class: "CLASS_2", plate_number: "CMP100", plate_state: "NY" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-Z", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-12T09:00:00Z", is_peak: false, idempotency_key: "z1" }
              as: AgencyOperations
              captures: { txn: "$.data.id" }
          assert:
            - "TollTransaction.${txn}.detection_method == TRANSPONDER"
            - "TollTransaction.${txn}.charged_amount_cents == 800 (schedule-derived; no client amount field exists)"
            - "TollTransaction.${txn}.status == POSTED"

      - name: transponder_invalid_vehicle_class_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Transponder.fields.vehicle_class
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "vehicle_class outside {CLASS_2, CLASS_5, CLASS_7} is a 400 enum violation, distinct from a missing-field 400."
        test_recipe:
          setup:
            - "Agency HOME, plan STD, account exist."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Enu Mer", holder_email: "enu@example.com", discount_plan_id: "${plan_id}" }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
          trigger:
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-9", vehicle_class: "CLASS_9", plate_number: "ENUM99", plate_state: "NY" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: transponder_lost_found_cycle_and_terminal_retire
        claim_type: Valid Transition
        grounds:
          - state_machines.Transponder.ACTIVE_to_REPORTED_LOST
          - state_machines.Transponder.REPORTED_LOST_to_ACTIVE
          - state_machines.Transponder.ACTIVE_to_RETIRED
        distinguishing_aspect: "The full Transponder loop works: ACTIVE -> REPORTED_LOST -> ACTIVE -> RETIRED, each hop reflected in status; RETIRED is terminal."
        test_recipe:
          setup:
            - "Agency HOME, plan STD, account, transponder TAG-L ACTIVE."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Lou Lost", holder_email: "lou@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-L", vehicle_class: "CLASS_2", plate_number: "LST100", plate_state: "NY" }
              as: AgencyOperations
              captures: { tag: "$.data.id" }
          trigger:
            - call: "POST /toll/transponders/${tag}/report_lost"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
            - call: "POST /toll/transponders/${tag}/report_found"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
            - call: "POST /toll/transponders/${tag}/retire"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "after report_lost: Transponder.${tag}.status == REPORTED_LOST"
            - "after report_found: status == ACTIVE"
            - "after retire: status == RETIRED"

      - name: retire_from_terminal_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.Transponder
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "RETIRED is terminal: retire on an already-RETIRED transponder fails 409 and no transition fires."
        test_recipe:
          setup:
            - "Account with transponder TAG-T2 already RETIRED."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ted Term", holder_email: "ted@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-T2", vehicle_class: "CLASS_2", plate_number: "TRM100", plate_state: "NY" }
              as: AgencyOperations
              captures: { tag: "$.data.id" }
            - call: "POST /toll/transponders/${tag}/retire"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
          trigger:
            - call: "POST /toll/transponders/${tag}/retire"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "Transponder.${tag}.status == RETIRED"

      - name: fourth_notice_rejected_at_limit
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Violation.NOTICED_to_NOTICED
          - errors.ERR_NOTICE_LIMIT_REACHED
        distinguishing_aspect: "notice_count caps at 3; the fourth issue_notice on a NOTICED violation is rejected with ERR_NOTICE_LIMIT_REACHED and admin_fees_cents stays at 8000."
        test_recipe:
          setup:
            - "Unregistered-plate violation (toll 800), three notices issued at days 0, 30, 60 (admin fees 500+2500+5000 = 8000)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "UNREG7", plate_state: "PA", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:00:00Z", is_peak: false, idempotency_key: "u7" }
              as: AgencyOperations
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { b7: "$.data[0].id" }
            - call: "POST /toll/image-bills/${b7}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "GET /toll/violations"
              payload: {}
              as: ViolationsOfficer
              captures: { v7: "$.data[0].id" }
            - call: "POST /toll/violations/${v7}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${v7}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${v7}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/violations/${v7}/issue_notice"
              payload: {}
              as: ViolationsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_NOTICE_LIMIT_REACHED"
            - "Violation.${v7}.notice_count == 3 and admin_fees_cents == 8000"
            - "Violation.${v7}.total_outstanding_cents == 9600"

      - name: dispute_auto_reject_after_thirty_days_unreviewed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispute.FILED_to_REJECTED
          - calculations.violation_admin_fee_schedule
        distinguishing_aspect: "A FILED dispute with no begin_review is auto-REJECTED by advance_day once 30 days elapse, and its transaction returns DISPUTED -> POSTED without any repricing."
        test_recipe:
          setup:
            - "Account with TAG-D CLASS_5; AWAY P3 CLASS_5 (base 475 axle 2.5) and CLASS_2 (base 300) schedules; trip charged 1188; classification dispute FILED claiming CLASS_2, never reviewed."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P3", vehicle_class: "CLASS_5", base_rate_cents: 475, axle_multiplier: 2.5, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P3", vehicle_class: "CLASS_2", base_rate_cents: 300, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ann Auto", holder_email: "ann@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 50000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-D", vehicle_class: "CLASS_5", plate_number: "AUT100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-D", away_agency_id: "${away_id}", plaza_code: "P3", trip_timestamp: "2026-09-02T09:00:00Z", is_peak: false, idempotency_key: "d1" }
              as: AgencyOperations
              captures: { txn: "$.data.id" }
            - call: "POST /toll/disputes"
              payload: { account_id: "${acct}", dispute_type: "VEHICLE_CLASSIFICATION", toll_transaction_id: "${txn}", claimed_vehicle_class: "CLASS_2" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { disp: "$.data.id" }
          trigger:
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
          assert:
            - "Dispute.${disp}.status == REJECTED (auto-rejected at 30 days unreviewed)"
            - "TollTransaction.${txn}.status == POSTED and billed_vehicle_class == CLASS_5 and charged_amount_cents == 1188 (no repricing on auto-reject)"
            - "Account.${acct}.balance_cents == 48812 (50000 - 1188; no credit)"

      - name: account_close_cascades_transponder_retirement
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - state_machines.Transponder.ACTIVE_to_RETIRED
        distinguishing_aspect: "Closing a clean account cascades: every ACTIVE transponder retires and balance pays out to 0."
        test_recipe:
          setup:
            - "Account with zero balance, no violations, no POSTED transactions; two transponders TAG-C1 (ACTIVE) and TAG-C2 (REPORTED_LOST)."
          setup_api_calls:
            - call: "POST /toll/agencies"
