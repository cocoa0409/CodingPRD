# Scaffold Corner Design — task_2421 Residual Property Market & Fair Access Plan
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml, walked row-by-row against
# references/claim-extraction-guide.md. Depth corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs.
#
# Conventions shared by every recipe below:
#   * the logical clock is set explicitly as the first call of every chain (default 2026-08-01T00:00:00Z),
#     so no recipe depends on wall-clock time;
#   * money literals were produced by executing the §1.3 formulas with Decimal / ROUND_HALF_UP;
#   * `as_user_id` is only meaningful for entity-backed roles (Producer -> Producer.id,
#     MemberInsurerUser -> MemberInsurer.id, Policyholder -> Applicant.id) and for the three
#     segregation-of-duties separations, which are keyed on X-User-ID rather than on role.
scaffold_corner_design:

  - section: entities
    instances:
      - name: member_insurer_created_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.MemberInsurer
          - endpoints[POST /fair-plan/member-insurers]
        distinguishing_aspect: "POST with the four required fields returns 201 and echoes name, naic_code, market_share_pct and written_premium_share_pct exactly as submitted."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
          assert:
            - "response status == 201"
            - "response.response_type == object"
            - "MemberInsurer.${m1_id}.name == Carrier One"
            - "MemberInsurer.${m1_id}.naic_code == 10001"
            - "MemberInsurer.${m1_id}.market_share_pct == 30.00"
            - "MemberInsurer.${m1_id}.written_premium_share_pct == 10.00"

      - name: cat_zone_retrieved_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.CatastropheZone
          - endpoints[GET /fair-plan/cat-zones/{id}]
        distinguishing_aspect: "GET /cat-zones/{id} returns the same code, peril and exposure_cap_cents that were stored at creation, with status OPEN and concentration_ratio 0.0000."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one HURRICANE zone HUR-01 with exposure_cap_cents 100000000."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 100000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "GET /fair-plan/cat-zones/${zone_id}"
              payload: {}
              as: Regulator
          assert:
            - "response status == 200"
            - "CatastropheZone.${zone_id}.code == HUR-01"
            - "CatastropheZone.${zone_id}.peril == HURRICANE"
            - "CatastropheZone.${zone_id}.exposure_cap_cents == 100000000"
            - "CatastropheZone.${zone_id}.aggregate_insured_value_cents == 0"
            - "CatastropheZone.${zone_id}.concentration_ratio == 0.0000"
            - "CatastropheZone.${zone_id}.status == OPEN"

      - name: member_insurer_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /fair-plan/member-insurers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three rows stored, limit 2 / offset 0 returns 2 items with total_count 3 and has_more true; limit 2 / offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; exactly three ACTIVE member insurers 10001, 10002, 10003 created in that order."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
          trigger:
            - call: "GET /fair-plan/member-insurers"
              payload: { limit: 2, offset: 0 }
              as: PlanAdmin
            - call: "GET /fair-plan/member-insurers"
              payload: { limit: 2, offset: 2 }
              as: PlanAdmin
          assert:
            - "first response.response_type == array"
            - "first response len(data) == 2"
            - "first response.total_count == 3"
            - "first response.has_more == true"
            - "second response len(data) == 1"
            - "second response.total_count == 3"
            - "second response.has_more == false"

      - name: member_insurer_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /fair-plan/member-insurers/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /member-insurers/{id} returns 404 ERR_NOT_FOUND and the message names the member insurer resource."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no member insurers exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "GET /fair-plan/member-insurers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdmin
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "response status == 404"
            - "response.response_type == error"
            - "response.error_id == ERR_NOT_FOUND"
            - "response.message names the member insurer resource"

      - name: producer_create_missing_commission_tier_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Producer.fields.commission_tier
          - endpoints[POST /fair-plan/producers]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "commission_tier has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Producer row is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no producers exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "count(Producer) == 0"

      - name: applicant_created_without_phone_defaults_to_null
        claim_type: defaults
        grounds:
          - entities.Applicant.fields.phone
          - endpoints[POST /fair-plan/applicants]
        distinguishing_aspect: "phone is optional with default null, so an applicant created without it stores phone == null rather than an empty string."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPOINTED producer so the Producer-role call is authorised."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { appl_id: $.data.id }
          assert:
            - "response status == 201"
            - "Applicant.${appl_id}.full_name == Ann Owner"
            - "Applicant.${appl_id}.email == ann@example.com"
            - "Applicant.${appl_id}.phone == null"

      - name: cat_zone_created_without_restricted_min_condition_score_defaults_to_seventy
        claim_type: defaults
        grounds:
          - entities.CatastropheZone.fields.restricted_min_condition_score
          - validations[priority=28]
        distinguishing_aspect: "Omitting restricted_min_condition_score stores exactly 70, which is the threshold the RESTRICTED-zone eligibility check later compares the rating condition score against."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no zones exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "WF-01", peril: "WILDFIRE", exposure_cap_cents: 100000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
          assert:
            - "response status == 201"
            - "CatastropheZone.${zone_id}.restricted_min_condition_score == 70"

      - name: producer_commission_rate_bps_computed_from_commission_tier
        claim_type: computed_fields
        grounds:
          - entities.Producer.fields.commission_rate_bps
          - calculations.producer_commission.constants
          - state_machines.Producer.PENDING_to_APPOINTED
        distinguishing_aspect: "commission_rate_bps is derived from commission_tier at appointment: the STANDARD producer holds 1000 and the PREFERRED producer holds 1250, and both are 0 while agreement_status is PENDING."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two producers created, one STANDARD (P-1001) and one PREFERRED (P-1002), both still PENDING with commission_rate_bps 0."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_std_id: $.data.id, bps_pending: $.data.commission_rate_bps }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Dana Agent", license_number: "P-1002", commission_tier: "PREFERRED", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_pref_id: $.data.id }
          trigger:
            - call: "POST /fair-plan/producers/${prod_std_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/producers/${prod_pref_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
          assert:
            - "${bps_pending} == 0"
            - "Producer.${prod_std_id}.agreement_status == APPOINTED"
            - "Producer.${prod_std_id}.commission_rate_bps == 1000"
            - "Producer.${prod_std_id}.agreement_effective_date == 2026-08-01"
            - "Producer.${prod_pref_id}.commission_rate_bps == 1250"

      - name: application_create_with_client_supplied_declination_count_rejected
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.declination_count
          - endpoints[POST /fair-plan/applications].input
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "declination_count is source computed and absent from the endpoint's input list, so supplying it returns 400 ERR_INVALID_REQUEST instead of being silently accepted or silently ignored."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one HURRICANE zone, one APPOINTED producer, one applicant and one FRAME property with replacement_cost_cents 100000000."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "1 Shore Rd", zip_code: "33101", construction_type: "FRAME", roof_age_years: 12, replacement_cost_cents: 100000000, condition_score: 88, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 54000000, requested_peril_package: "BASIC_FIRE_EO", declination_count: 3 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "count(Application) == 0"

      - name: member_insurer_system_fields_are_server_minted_with_version_one
        claim_type: system_fields
        grounds:
          - entities.MemberInsurer.common_fields
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on create: version is exactly 1, created_at equals updated_at, and both equal the logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id, m1_created: $.data.created_at, m1_v: $.data.version }
          assert:
            - "${m1_v} == 1"
            - "${m1_created} == 2026-08-01T00:00:00Z"
            - "MemberInsurer.${m1_id}.updated_at == 2026-08-01T00:00:00Z"
            - "MemberInsurer.${m1_id}.id is a server-generated UUID not supplied by the client"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present"

      - name: cat_zone_create_with_unknown_peril_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.CatastropheZone.fields.peril
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "peril accepts only HURRICANE, WILDFIRE or EARTHQUAKE, so FLOOD returns 400 ERR_INVALID_REQUEST and no zone row is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no zones exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "FL-01", peril: "FLOOD", exposure_cap_cents: 100000000 }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "count(CatastropheZone) == 0"

      - name: property_create_with_condition_score_above_one_hundred_rejected
        claim_type: type_constraints
        grounds:
          - entities.Property.fields.condition_score
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "condition_score is constrained to 0..100 inclusive, so 101 returns 400 ERR_INVALID_REQUEST while the same payload at 100 would be accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one HURRICANE zone and one APPOINTED producer."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "1 Shore Rd", zip_code: "33101", construction_type: "FRAME", roof_age_years: 12, replacement_cost_cents: 100000000, condition_score: 101, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "count(Property) == 0"

      - name: declination_record_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.DeclinationRecord.common_fields
          - endpoints[GET /fair-plan/applications/{id}/declinations]
        distinguishing_aspect: "DeclinationRecord is declared common_fields false: §1.5 exposes no PATCH or DELETE for it and the row returned by the declinations list carries no version and no updated_at field, only id and created_at."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one member insurer, one APPOINTED producer, one applicant, one property and one DRAFT application with a single declination on it."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /fair-plan/properties"
              payload: { cat_zone_id: "${zone_id}", address_line: "1 Shore Rd", zip_code: "33101", construction_type: "FRAME", roof_age_years: 12, replacement_cost_cents: 100000000, condition_score: 88, occupancy: "OWNER_OCCUPIED" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 54000000, requested_peril_package: "BASIC_FIRE_EO" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { app_id: $.data.id }
            - call: "POST /fair-plan/applications/${app_id}/declinations"
              payload: { member_insurer_id: "${m1_id}", declined_on: "2026-07-15", reason_code: "CAT_EXPOSURE", evidence_reference: "DEC-1" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "GET /fair-plan/applications/${app_id}/declinations"
              payload: {}
              as: Underwriter
          assert:
            - "response status == 200"
            - "len(data) == 1"
            - "DeclinationRecord.${dec_id} exposes id and created_at but no version field"
            - "DeclinationRecord.${dec_id} exposes no updated_at field"
            - "DeclinationRecord.${dec_id}.verified == true"
            - "no PATCH or DELETE endpoint for DeclinationRecord exists in §1.5"

      - name: inspection_order_on_unknown_application_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Inspection.parent
          - endpoints[POST /fair-plan/applications/{id}/inspections]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Inspection is a child of Application, so ordering one against an unused UUID returns 404 ERR_NOT_FOUND and creates no Inspection row — the parent is resolved before the state precondition is evaluated."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no applications exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /fair-plan/applications/00000000-0000-4000-8000-000000000000/inspections"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.error_id == ERR_NOT_FOUND"
            - "count(Inspection) == 0"

      - name: property_create_with_unknown_cat_zone_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Property.fields.cat_zone_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "The graph topology validates lateral foreign keys, not only path parents: a body cat_zone_id that resolves to no CatastropheZone returns 404 ERR_NOT_FOUND rather than 400."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPOINTED producer; no zones exist."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
