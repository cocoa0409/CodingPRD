            - "AllocationEvent.${evc_id}: the ${wx_id} assignment is RELEASED, released_qty == 120, pending_qty == 0, committed_qty == 0, unassigned_remainder == 180 (link 3)"
            - "AllocationEvent.${evc_id}.status == CLOSED (zero PENDING after the cascade release)"

