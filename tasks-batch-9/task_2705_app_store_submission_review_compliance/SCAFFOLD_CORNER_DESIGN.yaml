      - name: accept_no_change_on_a_two_code_privacy_assessment_returns_impact_too_severe
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ImpactAssessment.transitions.IN_ASSESSMENT_to_ACCEPTED_NO_CHANGE
          - calculations.impact_severity
          - errors.ERR_IMPACT_TOO_SEVERE
        distinguishing_aspect: "Two staled feature codes push impact_severity to 4 * 2 * 1.0 = 8.00, above the inclusive 6.00 ceiling, so the identical ACCEPT_NO_CHANGE call that succeeds on a one-code assessment returns 409 ERR_IMPACT_TOO_SEVERE."
        test_recipe:
          setup:
            - "Northwind Wallet has two PASSED mappings against PRIVACY rule 5.1.1 (ACCOUNT_DELETION created first, DATA_EXPORT second); publishing superseding rule 5.1.2 stales both and opens one assessment with affected_feature_codes [ACCOUNT_DELETION, DATA_EXPORT]."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
