  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-Role header fails priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any resource lookup — even a well-formed path 404s never get that far."
        test_recipe:
          setup:
            - "Empty database; the logical clock still at its startup default 2026-09-01T00:00:00Z (no clock call needed)."
          setup_api_calls: []
          trigger:
            - call: "GET /issuers"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type is error and data carries both error_id and message"

      - name: nested_unknown_application_returns_application_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_APPLICATION_NOT_FOUND
        distinguishing_aspect: "With the issuer real but the application id unknown, the left-to-right existence walk passes the issuer segment and fails on the application with ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered, no applications."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "GET /issuers/${issuer_id}/listing-applications/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_APPLICATION_NOT_FOUND"

      - name: second_pending_application_returns_multiple_pending
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_MULTIPLE_PENDING_APPLICATIONS
        distinguishing_aspect: "An issuer may carry at most one SUBMITTED application: with the first already submitted, submitting the second fails 409 ERR_MULTIPLE_PENDING_APPLICATIONS and the second stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer with application A SUBMITTED and application B DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "GLOBAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_b_id: $.data.id }
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications/${app_b_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MULTIPLE_PENDING_APPLICATIONS"
            - "ListingApplication.${app_b_id}.status == DRAFT (unchanged)"

      - name: readmission_for_non_delisted_issuer_is_barred
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_READMISSION_BARRED
        distinguishing_aspect: "READMISSION requires the issuer to be DELISTED; filing one for a PRE_LISTING issuer fails 422 ERR_READMISSION_BARRED at priority 6."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered (PRE_LISTING)."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", readmission: true, board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_READMISSION_BARRED"
            - "GET /issuers/${issuer_id}/listing-applications returns 0 rows"

      - name: snapshot_with_wrong_trade_date_returns_date_mismatch
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_SNAPSHOT_DATE_MISMATCH
        distinguishing_aspect: "A snapshot whose trade_date differs from the logical clock's current date is rejected 422 ERR_SNAPSHOT_DATE_MISMATCH — the same error id as the duplicate-day slot collision but a distinct trigger (clock mismatch vs occupied slot)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers/${issuer_id}/market-data-snapshots"
              payload: { trade_date: "2026-09-02", closing_bid_cents: 150, market_value_publicly_held_cents: 500000000, market_value_listed_securities_cents: 600000000000, round_lot_holders: 400, total_shareholders: 400 }
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SNAPSHOT_DATE_MISMATCH"
            - "GET /issuers/${issuer_id}/market-data-snapshots returns 0 rows"

      - name: duplicate_ticker_symbol_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - endpoints.POST_/issuers
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ticker_symbol is unique across issuers regardless of status; a second issuer reusing CCRT fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer registered with ticker CCRT."
          setup_api_calls:
            - *c_clock
            - *c_issuer
          trigger:
            - call: "POST /issuers"
              payload: { legal_name: "Copycat Corp", ticker_symbol: "CCRT" }
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /issuers returns exactly 1 row"

      - name: annual_fee_second_run_same_year_returns_already_assessed
        claim_type: Violation → Error
        grounds:
          - validations[priority=17]
          - errors.ERR_FEE_ALREADY_ASSESSED
        distinguishing_aspect: "One ANNUAL fee per issuer per clock year: the second run-annual-fees in the same year (with a fresh OCC version) fails 409 ERR_FEE_ALREADY_ASSESSED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer LISTED on CAPITAL; the 2026 annual fee already assessed."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
            - *c_approve
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v2: $.data.version }
            - call: "POST /issuers/${issuer_id}/fee-assessments/run-annual-fees"
              payload: { shares_outstanding: 3000000, expected_issuer_version: "${issuer_v2}" }
              as: FinanceOfficer
          trigger:
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v3: $.data.version }
            - call: "POST /issuers/${issuer_id}/fee-assessments/run-annual-fees"
              payload: { shares_outstanding: 3000000, expected_issuer_version: "${issuer_v3}" }
              as: FinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FEE_ALREADY_ASSESSED"
            - "GET /issuers/${issuer_id}/fee-assessments with fee_kind ANNUAL returns exactly 1 row"

