              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-09-01T10:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
