      - name: credential_compliance_expires_on_boundary_is_inclusive
        claim_type: precision
        grounds:
          - calculations.credential_compliance_pct
          - endpoints[POST /qris/expiry-runs]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The expires_on window is inclusive at the boundary and exclusive one day later: with the clock at 2026-08-01 the DIRECTOR credential expiring 2026-08-01 counts (compliance 50.00), and moving the clock to 2026-08-02 drops it, so the expiry run recomputes compliance to exactly 25.00."
        test_recipe:
          setup:
            - "Clock 2026-08-01. Provider with active_staff_fte 4.00 holding one VERIFIED DIRECTOR level 4 fte 1.00 expiring 2026-08-01 and one VERIFIED ASSISTANT level 1 fte 1.00 expiring 2030-01-01; compliance already read as 50.00."
