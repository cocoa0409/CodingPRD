  # ---------------------------------------------------------------------------
  # Section: calculations — corner results, input-set filtering, constants,
  # precision, reconciliation (variant-divergence lives in §1.8 -> stubs)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: deferment_ineligible_for_less_than_half_time
        claim_type: correct_result
        grounds:
          - calculations.deferment_determination
          - entities.ServicerNotification.fields.notification_type
        distinguishing_aspect: "An UNDERGRAD row with 3.0 credits computes status_code LESS_THAN_HALF_TIME, which maps to DEFERMENT_INELIGIBLE (not a withdrawal state), and the generated notification mirrors that type with grace_end_date null."
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall period; file with one UNDERGRAD 3.0-credit entry carrying servicer_ref SVC-100; certified at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Part Timer", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 3.0, term_start: "2026-09-01", term_end: "2026-12-15", servicer_ref: "SVC-100" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
          trigger:
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1: "$.data[0].id", e_code: "$.data[0].status_code", e_defer: "$.data[0].deferment_status" } }
            - { call: "GET /servicer-notifications", payload: { enrollment_entry_id: "${e1}" }, as: ClearinghouseOps, captures: { n_type: "$.data[0].notification_type", n_grace: "$.data[0].grace_end_date" } }
          assert:
            - "captured e_code == LESS_THAN_HALF_TIME (3.0 < HT_UG 6.0)"
            - "captured e_defer == DEFERMENT_INELIGIBLE"
            - "captured n_type == DEFERMENT_INELIGIBLE and n_grace is null"

      - name: deferment_repayment_due_at_grace_end_boundary
        claim_type: precision
        grounds:
          - calculations.deferment_determination
        distinguishing_aspect: "The grace comparison is strict <: withdrawal 2026-09-10 gives grace_end 2027-03-09, and a certification whose as-of date D equals grace_end exactly (2027-03-09) yields REPAYMENT_DUE, not WITHDRAWN_GRACE."
        test_recipe:
          setup:
            - "Compliant institution, Fall period; file uploaded at 2026-11-15 with one entry (UNDERGRAD 12.0, withdrawal_date 2026-09-10, servicer_ref SVC-100); file still UPLOADED while the clock advances to the grace boundary"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Withdrawn Early", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15", withdrawal_date: "2026-09-10", servicer_ref: "SVC-100" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-09T00:00:00Z" }, as: ClearinghouseOps }
          trigger:
