          - validations[priority=50]
          - calculations.mls_delivery_gate
          - errors[ERR_SHOOT_AFTER_DESTAGE]
        distinguishing_aspect: |
          ENTITY PAIR (PhotoShoot, Pickup) — a DIFFERENT pair from (Pickup,
          DamageAssessment). Creating a shoot is legal for the whole staged life of the
          project and becomes illegal the instant a SIBLING entity, the Pickup, enters
          IN_PROGRESS; nothing about the PhotoShoot itself changed.
        test_recipe:
          setup:
            - "The canonical VACANT project with its pickup already IN_PROGRESS at 2026-10-13T09:00:00Z."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
