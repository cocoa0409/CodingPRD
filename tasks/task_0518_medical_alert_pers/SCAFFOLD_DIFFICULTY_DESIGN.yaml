              as: Subscriber
              as_user_id: "${sub_f}"
            - call: "POST /pers/devices/${dev_f}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_f}"
            - call: "POST /pers/contracts/${ctr_f}/activate"
