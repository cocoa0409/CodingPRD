            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-G3", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /resin-batches/${batch_id}/quench", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
          trigger:
