            - { call: "POST /dock-tickets/${t_id}/land", payload: {}, as: DockBuyer, captures: { t_v2: $.data.version } }
            - { call: "POST /landing-lines", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", declared_grade: "GRADE_A", landed_weight_kg: 50.00, expected_dock_ticket_version: "${t_v2}" }, as: DockBuyer, captures: { l_id: $.data.id } }
            - { call: "POST /grade-assessments", payload: { landing_line_id: "${l_id}", assessed_grade: "GRADE_A", yield_pct: 1.00 }, as: GradingInspector, captures: { ga_id: $.data.id } }
            - { call: "POST /grade-assessments/${ga_id}/finalize", payload: {}, as: GradingInspector }
            - { call: "GET /inventory-lots", payload: { landing_line_id: "${l_id}" }, as: OperationsManager, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /inspection-holds", payload: { inventory_lot_id: "${lot_id}", reason: "audit" }, as: ComplianceOfficer, as_user_id: "off_1", captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /inspection-holds/${h_id}/release", payload: {}, as: ComplianceOfficer, as_user_id: "off_1", captures: { err: $.data.error_id } }
            - { call: "POST /inspection-holds/${h_id}/release", payload: {}, as: ComplianceOfficer, as_user_id: "off_2", captures: { ok_status: $.data.status } }
          assert:
            - "off_1 release: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403); hold stays PLACED, lot stays ON_HOLD"
            - "off_2 release: status == RELEASED, resolved_by_user_id == off_2, lot hold_status == CLEAR"

      - name: rbac_sod_import_clear_covered_by_difficulty
        claim_type: rbac_denial
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - entities.ImportDocument.fields.submitted_by_user_id
        excluded_because:
