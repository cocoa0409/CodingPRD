            - "${err} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "AssetTest.${at_id}.status == MEASURED, result == PASS, ratio_pct == 100.0000, version == 2 (the refused call did not re-measure or re-version)"
            - "AssetTest.${at_id}.measured_by_user_id == co-measurer-1 and certified_by_user_id == null"
