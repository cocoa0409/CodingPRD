          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GX ACTIVE (minimum_count 0, pct 0.0, DAILY); counselor CX; campaign CX-CAM OPEN 2026-09-01..2026-09-10 guaranteed_issue; clock to 2026-09-10; locked; closed (zero applications, required 0 -> MET branch); closed again (MET -> CLOSED)."
