        excluded_because:
          difficulty_instance: transaction_commission_provisional_vs_settlement_final_tier_basis
          rationale: "Variant selection (QUOTE_PROVISIONAL at creation, SETTLEMENT_FINAL at settle) and the reconciliation delta written to price_adjustment_cents are what that §1.8 dual_variant_calc instance asserts, with the same-day prior settlement pulling the deal into a cheaper tier and price_adjustment_cents -357."

