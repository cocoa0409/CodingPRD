            - "${posture} == RESTRICTED"
            - "${reason} == RESCUE_READINESS"
            - "Course.${course_id}.daily_open_index == 1"
            - "Course.${course_id}.last_daily_open_date == 2026-08-10"
            - "Course.${course_id}.rescue_ready_facilitator_count == 0"
            - "Course.${course_id}.rescue_readiness_ok == false"

