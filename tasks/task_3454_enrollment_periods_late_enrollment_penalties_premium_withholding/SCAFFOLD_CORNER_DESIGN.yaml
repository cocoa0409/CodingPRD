  # =========================================================================
  # Section: complexity_layers
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_election_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-create-stale-beneficiary]", "validations[priority=14]", "errors[ERR_STALE_BENEFICIARY_VERSION]"]
        distinguishing_aspect: "After election E1 bumps Beneficiary.version 1 -> 2, a second election carrying the stale expected version 1 is rejected 412 — two strictly sequential requests, no overlap."
        test_recipe:
          setup: ["beneficiary DOB 1960-01-15; PART_B enrolled 2025-01-10; clock 2026-10-20 (AEP); version captured at 1"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Occ Stale", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { b_v1: "$.data.version" }
            - call: "POST /medicare/elections"
              payload: { beneficiary_id: "${b_id}", election_window: "AEP", target_coverage: "MA", expected_beneficiary_version: "${b_v1}" }
              as: Beneficiary
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /medicare/elections"
              payload: { beneficiary_id: "${b_id}", election_window: "AEP", target_coverage: "MA", expected_beneficiary_version: "${b_v1}" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "http 412, error_id == ERR_STALE_BENEFICIARY_VERSION (expected ${b_v1} == 1, actual now 2)"
            - "the superseding election from setup remains the only GOVERNING one"
      - name: occ_positive_path_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-create-stale-beneficiary]"]
        excluded_because:
          difficulty_instance: aep_supersede_conserves_single_governing_election
          rationale: "Two successful OCC-guarded elections with freshly captured versions are the positive path, asserted there."
      - name: withholding_shortfall_triggers_suspension_cascade
        claim_type: cascading_side_effects
        grounds: [calculations.calc_withholding_waterfall, state_machines.WithholdingArrangement.ACTIVE_to_SUSPENDED, entities.PremiumInvoice.fields.is_arrears]
        distinguishing_aspect: "One cycle runs the waterfall end-to-end: benefit 21000 covers PART_B 18500 fully then PART_D partially (2500), the 950 shortfall suspends the arrangement, flips BOTH enrollments to DIRECT_BILL, and mints a single arrears invoice — conservation sum(pay) == min(benefit, total_due) == 21000."
        test_recipe:
          setup:
            - "rate schedule 2026; beneficiary DOB 1961-04-12; PART_B + PART_D enrolled at 2026-05-10 (both effective 2026-06, fallback premiums 18500 + 3450)"
            - "withholding arrangement 21000 created before activation"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Water Fall", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { eb_id: "$.data.id" }
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ed_id: "$.data.id" }
            - call: "POST /medicare/withholding-arrangements"
              payload: { beneficiary_id: "${b_id}", monthly_benefit_cents: 21000 }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}/withholding-arrangements"
              as: BenefitAdministrator
              captures: { wa_status: "$.data[0].status" }
            - call: "GET /medicare/enrollments/${eb_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { eb_coll: "$.data.collection_status", eb_stat: "$.data.enrollment_status" }
            - call: "GET /medicare/enrollments/${ed_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ed_coll: "$.data.collection_status" }
            - call: "GET /medicare/beneficiaries/${b_id}/invoices"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { inv_part: "$.data[0].part", inv_amount: "$.data[0].amount_cents", inv_arrears: "$.data[0].is_arrears", inv_due: "$.data[0].due_date" }
          assert:
            - "arrangement status == SUSPENDED"
            - "both enrollments: enrollment_status == ACTIVE, collection_status == DIRECT_BILL (flipped by the cascade, not by any direct call)"
            - "exactly ONE invoice: part == PART_D, amount_cents == 950 (3450 - 2500), is_arrears == true, due_date == \"2026-07-05\" (issue 2026-06-05 + 30 days)"
            - "waterfall conservation: PART_B received 18500 (full) and PART_D received 2500; 18500 + 2500 == min(21000, 21950) == 21000"
      - name: delinquency_termination_after_third_past_due
        claim_type: cascading_side_effects
        grounds: [calculations.calc_delinquency, state_machines.CoverageEnrollment.ACTIVE_to_TERMINATED, state_machines.PremiumInvoice.status]
        distinguishing_aspect: "Three consecutive past-due invoices terminate the enrollment at the fourth monthly cycle boundary and write off the unpaid bills; invoices were priced by the no-determination fallback (18500 flat)."
        test_recipe:
          setup:
            - "rate schedule 2026; beneficiary DOB 1961-04-12; PART_B enrolled 2026-05-10 (effective 2026-06), DIRECT_BILL (no arrangement, no determination)"
            - "cycles at 2026-06-15 (activate + invoice 06), 2026-07-15 (inv06 PAST_DUE + invoice 07), 2026-08-15 (inv07 PAST_DUE + invoice 08)"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Del Inquent", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
              captures: { cyc_term: "$.data.enrollments_terminated" }
            - call: "GET /medicare/enrollments/${e_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_stat: "$.data.enrollment_status", e_end: "$.data.end_month", e_coll: "$.data.collection_status" }
            - call: "GET /medicare/beneficiaries/${b_id}/invoices"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { i0: "$.data[0].status", i1: "$.data[1].status", i2: "$.data[2].status", i0_amt: "$.data[0].amount_cents" }
          assert:
            - "cycle response: enrollments_terminated >= 1"
            - "enrollment: enrollment_status == TERMINATED, end_month == \"2026-09\", collection_status == CLOSED"
            - "exactly 3 invoices exist, all WRITTEN_OFF; invoice[0].amount_cents == 18500 (fallback: base + lep, no IRMAA without a determination)"
      - name: cure_past_due_restores_direct_bill
        claim_type: side_effect_execution
        grounds: [calculations.calc_delinquency, state_machines.CoverageEnrollment.DELINQUENT_to_DIRECT_BILL]
        distinguishing_aspect: "Paying all past-due invoices mid-delinquency flips collection back to DIRECT_BILL at payment time (no cycle needed); the enrollment is never terminated."
        test_recipe:
          setup: ["same path as delinquency_termination_after_third_past_due but only through the 2026-08-15 cycle (2 past-due invoices, collection DELINQUENT)"]
          setup_api_calls:
