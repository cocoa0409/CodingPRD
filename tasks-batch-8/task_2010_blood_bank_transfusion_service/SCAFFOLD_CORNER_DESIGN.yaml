          assert:
            - "summary bucket RBC:O:NEG: wasted_count == 1, received_count == 3, wastage_rate == 0.3333 (round_half_up at 4dp)"
            - "excessive == true (0.3333 >= 0.05, inclusive)"
      - name: reserved_until_min_of_three_clocks
        claim_type: correct_result
        grounds:
          - "calculations.crossmatch_reserved_until"
