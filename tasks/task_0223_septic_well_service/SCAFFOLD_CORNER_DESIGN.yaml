# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints
        distinguishing_aspect: "POST /accounts with name+billing_email -> 201; standing=GOOD, outstanding_balance_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          assert:
            - "response status == 201"
            - "Account.${acct_id}.standing == GOOD"
            - "Account.${acct_id}.outstanding_balance_cents == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_not_found
        claim_type: Not Found
        grounds:
          - entities.Account
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /accounts/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: create_site_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Site
          - "validations[priority=12]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /sites without county_code -> 400 ERR_INVALID_REQUEST (required field absent)."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: create_site_default_service_minutes_applied
        claim_type: Defaults
        grounds:
          - entities.Site.fields.service_minutes
        distinguishing_aspect: "POST /sites omitting service_minutes -> default 60 applied."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING" }
              as: Dispatcher
              captures: { site_id: $.data.id }
          assert:
            - "Site.${site_id}.service_minutes == 60"

      - name: create_site_bad_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Site.fields.account_id
          - "validations[priority=11]"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "POST /sites with non-existent account_id -> 422 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { account_id: "00000000-0000-4000-8000-000000000001", address: "1 Pine", county_code: "KING" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "$.data.error_id == ERR_FK_NOT_FOUND"

      - name: work_order_computed_cost_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.WorkOrder.fields.estimated_cost_cents
          - entities.WorkOrder.fields.status
        distinguishing_aspect: "POST /work-orders starts status=DRAFT, billing_status=UNBILLED, estimated_cost_cents=0 regardless of input."
        test_recipe:
          setup: ["Account + Site exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-01", window_start_minute: 540, estimated_gallons: 800 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == DRAFT"
            - "WorkOrder.${wo_id}.billing_status == UNBILLED"
            - "WorkOrder.${wo_id}.estimated_cost_cents == 0"

      - name: create_asset_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Asset.fields.asset_type
          - "validations[priority=12]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /assets with asset_type='LAGOON' (not in SEPTIC_TANK|WELL) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Account + Site exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { site_id: "${site_id}", asset_type: "LAGOON", capacity_gallons: 1000, install_year: 2010 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: technician_shift_end_before_start_validation
        claim_type: Type Constraints
        grounds:
          - entities.Technician.fields.shift_end_minute
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /technicians with shift_end_minute <= shift_start_minute -> 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 1020, shift_end_minute: 480 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "$.data.error_id == ERR_VALIDATION"

      - name: reminder_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Reminder
        distinguishing_aspect: "Reminder has common_fields:false -> carries id+created_at only; no version field; status mutated only via acknowledge."
        test_recipe:
          setup: ["A Reminder exists via PUMPING completion (PUMP_DUE)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /service-plans"
              payload: { site_id: "${site_id}", frequency_months: 36, estimated_gallons: 800, expected_site_version: "${site_v}" }
              as: Dispatcher
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-02" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-02", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { measured_gallons: 900 }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /sites/${site_id}/reminders"
              payload: {}
              as: Dispatcher
          assert:
            - "GET /sites/${site_id}/reminders returns array length 1 with reminder_type==PUMP_DUE"
            - "the Reminder object has no 'version' field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispatch_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
          - "validations[priority=20]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /work-orders/{id}/dispatch on a DRAFT (never scheduled) WO -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT PUMPING WO, never scheduled."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-03", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: cancel_completed_work_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkOrder
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cancel_completed_state_beats_account_hold_fiscal
          rationale: "Cancel-from-COMPLETED rejection with ERR_INVALID_STATE is the asserted outcome of that §1.8 instance."

      - name: dispatch_suspended_technician_returns_tech_suspended
        claim_type: guarded transitions
        grounds:
          - "validations[priority=31]"
          - state_machines.Technician.ACTIVE_to_SUSPENDED
          - "errors[ERR_TECH_SUSPENDED]"
        distinguishing_aspect: "Dispatch when the route's Technician.status==SUSPENDED -> 409 ERR_TECH_SUSPENDED."
        test_recipe:
          setup: ["SCHEDULED WO on a route whose technician was then SUSPENDED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-04" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-04", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /technicians/${tech_id}/suspend"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_TECH_SUSPENDED"

      - name: finalize_report_on_incomplete_work_order_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InspectionReport.DRAFT_to_FINALIZED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Finalize a report whose linked INSPECTION WO is not COMPLETED -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT report opened against an INSPECTION WO that is only IN_PROGRESS (not completed)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-05" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "INSPECTION", scheduled_date: "2026-07-05", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /inspection-reports"
              payload: { work_order_id: "${wo_id}", defect_count: 0 }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /inspection-reports/${rep_id}/finalize"
              payload: { result: "PASS" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: edit_finalized_report_returns_immutable
        claim_type: Invalid Transitions
        grounds:
          - "validations[priority=21]"
          - state_machines.InspectionReport.DRAFT_to_FINALIZED
          - "errors[ERR_IMMUTABLE]"
        distinguishing_aspect: "PATCH /inspection-reports/{id} on a FINALIZED report -> 409 ERR_IMMUTABLE."
        test_recipe:
          setup: ["FINALIZED PASS report on a COMPLETED INSPECTION WO."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-02" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "INSPECTION", scheduled_date: "2026-06-02", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /inspection-reports"
              payload: { work_order_id: "${wo_id}", defect_count: 0 }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/finalize"
              payload: { result: "PASS" }
              as: ComplianceOfficer
          trigger:
            - call: "PATCH /inspection-reports/${rep_id}"
              payload: { defect_count: 9 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_IMMUTABLE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: schedule_pumping_estimate_defaults_gallons_from_plan
        claim_type: Correct Result
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.estimated_cost_cents
          - entities.ServicePlan.fields.estimated_gallons
        distinguishing_aspect: "PUMPING WO scheduled with estimated_gallons omitted defaults to plan.estimated_gallons=800 -> estimated_cost_cents 29000."
        test_recipe:
          setup: ["Site with ACTIVE plan estimated_gallons=800; ACTIVE tech; OPEN route; DRAFT PUMPING WO with estimated_gallons omitted."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /service-plans"
              payload: { site_id: "${site_id}", frequency_months: 36, estimated_gallons: 800, expected_site_version: "${site_v}" }
              as: Dispatcher
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-06" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-06", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
          assert:
            - "WorkOrder.${wo_id}.estimated_gallons == 800"
            - "WorkOrder.${wo_id}.estimated_cost_cents == 29000"

      - name: route_optimize_orders_by_window_then_created_at
        claim_type: Correct Result
        grounds:
          - calculations.route_optimize
          - entities.Route.fields.optimized_sequence
        distinguishing_aspect: "Two SCHEDULED WOs (windows 600 then 540) optimize to [wo_540, wo_600] by window_start_minute ASC; never by id."
        test_recipe:
          setup: ["One route; WO_late at window 600 scheduled first, WO_early at window 540 scheduled second."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "21a Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site1_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "21b Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site2_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-07" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site1_id}", work_type: "PUMPING", scheduled_date: "2026-07-07", window_start_minute: 600, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_late_id: $.data.id }
            - call: "POST /work-orders/${wo_late_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { site_id: "${site2_id}", work_type: "PUMPING", scheduled_date: "2026-07-07", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_early_id: $.data.id }
            - call: "POST /work-orders/${wo_early_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /routes/${route_id}/optimize"
              payload: {}
              as: Dispatcher
          assert:
            - "Route.${route_id}.optimized_sequence == [${wo_early_id}, ${wo_late_id}]"
            - "Route.${route_id}.assigned_stop_count == 2"

      - name: complete_pumping_without_measured_gallons_returns_measurement_required
        claim_type: Input Set Filtering
        grounds:
          - "validations[priority=50]"
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - "errors[ERR_MEASUREMENT_REQUIRED]"
        distinguishing_aspect: "Completing a PUMPING WO without measured_gallons -> 422 ERR_MEASUREMENT_REQUIRED."
        test_recipe:
          setup: ["PUMPING WO scheduled/dispatched/started."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-07-08" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-07-08", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
