            - "err2 == ERR_DUPLICATE_TIMESHEET (409) — resubmission must go through PUT on the existing row"

      - name: timesheet_out_of_range_and_weekend_work_date
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - validations[priority=12]
          - errors[ERR_TIMESHEET_OUT_OF_RANGE]
        distinguishing_aspect: "A weekday outside the assignment range hits ERR_TIMESHEET_OUT_OF_RANGE (priority 17), while a weekend date is caught earlier by ERR_INVALID_DATE_RANGE (priority 12) — same endpoint, different layers."
