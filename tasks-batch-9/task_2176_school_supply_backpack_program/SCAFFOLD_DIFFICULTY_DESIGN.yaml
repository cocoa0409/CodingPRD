            - "TeacherRequest.${tr_id}.status == SUBMITTED"
            - "TeacherRequest.${tr_id}.request_cost_cents == 25000"
            - "DriveCycle.${cycle_id}.supplemental_cap_cents == 7500"

  - rule_id: boundary_precision_check
    instances:

      - name: supplemental_cap_equality_passes_then_one_more_pack_is_rejected
        grounds:
          - calculations.teacher_supplemental_budget
          - validations[priority=31]
          - errors[ERR_SUPPLEMENTAL_CAP_EXCEEDED]
          - entities.DriveCycle.fields.supplemental_cap_cents
        distinguishing_aspect: |
          Boundary #1 sits on a monetary threshold reached through
          POST /teacher-requests/{id}/transitions: approved_spend + cost == cap (7500)
          is accepted, and the very next 250-cent request, which lands one unit above
          the cap, is rejected — the comparison is `<=`, not `<`.
        test_recipe:
          setup:
            - "Lincoln Elementary is ACTIVE and is the only active partner, so the per-school sub-cap is dormant."
            - "The COLLECTING cycle has a single 50000-cent UNRESTRICTED gift, giving supplemental_cap_cents 7500."
            - "Two SUBMITTED teacher requests exist: 30 pencils (7500 cents) and 1 pencil (250 cents)."
