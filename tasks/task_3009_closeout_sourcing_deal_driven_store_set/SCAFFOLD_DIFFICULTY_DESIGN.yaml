            - call: "POST /lots/${lot1}/allocations/${al1}/release"
              payload: {}
              as: AllocationManager
            - call: "GET /lots/${lot1}/summary"
              payload: {}
              as: Admin
              captures: { pool2: $.data.qty_pool, out2: $.data.qty_allocated_outstanding, sold2: $.data.qty_sold, liq2: $.data.qty_liquidated, scrap2: $.data.qty_scrapped }
          assert:
            - "${pool0} == 100 and ${out0} == 0 (100 == 100 + 0 + 0 + 0 + 0)"
            - "${pool1} == 40 and ${out1} == 60 (100 == 40 + 60 + 0 + 0 + 0)"
            - "${pool2} == 100 and ${out2} == 0 and ${sold2} == 0 and ${liq2} == 0 and ${scrap2} == 0 (release fully compensates the commit)"
            - "Allocation.${al1}.status == RELEASED"

      - name: refund_restores_sales_ledger_and_stock
        grounds:
          - calculations.refund_restoration
          - state_machines.Purchase.COMPLETED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: the sales ledger (qty_sold, completed line totals)
          and store stock — a different conserved quantity than the allocation
          pool. A purchase of 2 followed by its refund returns qty_sold to 0,
          store_on_hand_qty to 60, and completed line totals to 0.
        test_recipe:
          setup:
            - "Lot ON_SALE at S1 with 60 on hand, retail 4000, signage limit 10; GOLD member M1"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 100, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 1000 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
            - call: "POST /members"
              payload: { member_code: "M-GOLD", tier: "GOLD", home_store_id: "${st1}" }
              as: Anonymous
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 2, member_id: "${mem1}" }
              as: ClubMember
              as_user_id: "${mem1}"
              captures: { pur1: $.data.id, total_p: $.data.line_total_cents }
            - call: "GET /lots/${lot1}/summary"
              payload: {}
              as: Admin
              captures: { sold_mid: $.data.qty_sold }
            - call: "POST /purchases/${pur1}/refund"
              payload: {}
              as: StoreManager
              captures: { status_ref: $.data.status }
            - call: "GET /lots/${lot1}/summary"
              payload: {}
              as: Admin
              captures: { sold_post: $.data.qty_sold }
            - call: "GET /stores/${st1}/allocations"
              payload: {}
              as: Admin
              captures: { onhand_post: "$.data[0].store_on_hand_qty" }
          assert:
            - "${total_p} == 6800 (GOLD standard 3400 * 2)"
            - "${sold_mid} == 2 (purchase moved the ledger)"
            - "${status_ref} == REFUNDED"
            - "${sold_post} == 0 and ${onhand_post} == 60 (refund fully compensates: sales ledger and stock return to pre-purchase values)"
            - "sum of line_total_cents over COMPLETED purchases of the lot == 0 after the refund"
