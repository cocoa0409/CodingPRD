        grounds: [endpoints: "POST /_clock/set_current_utc"]
        distinguishing_aspect: "The test-driving clock endpoint echoes the installed logical time; the startup default is 2026-05-01T00:00:00Z (stated in the endpoint description)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:30:00Z" }, as: TurnaroundManager, captures: { now: "$.data.current_utc" } }
          assert:
            - "response current_utc == 2026-06-01T12:30:00Z"

