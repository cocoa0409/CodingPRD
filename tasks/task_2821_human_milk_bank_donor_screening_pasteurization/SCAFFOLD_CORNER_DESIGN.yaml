            - "Prescription.${rx2}.status == PARTIALLY_FILLED and Prescription.${rx2}.remaining_ml == 100 and Prescription.${rx2}.waitlist_position == 1"
            - "third response: http_status == 200 and data.status == CANCELLED and data.waitlist_position == null"
            - "${e2} == ERR_PRESCRIPTION_STATE_INVALID with http_status 409"
            - "${e3} == ERR_PRESCRIPTION_STATE_INVALID with http_status 409"
            - "${e4} == ERR_LOT_STATE_INVALID with http_status 409"
            - "MilkLot.${l1}.available_ml == 1100 and MilkLot.${l1}.release_status == RELEASED and MilkLot.${l1}.released_by_user_id == u-qa-2"
            - "GET /milk-bank/prescriptions?status=CANCELLED returns total_count == 1 with the RX-5003 row only"

      - name: priority_conflict_donor_qualification_outranks_the_pool_donor_cap
        claim_type: priority_conflict
        grounds:
          - validations[priority=44]
          - validations[priority=63]
          - errors[ERR_DONOR_NOT_QUALIFIED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_over_constraint_on_component_add
          rationale: "The named §1.8 instance violates the safety rule and the capacity rule in the same component add and asserts that the lower-numbered safety error is the one returned, then removes the safety violation and shows the capacity error surfacing from the identical request."

      - name: priority_conflict_lot_expiry_outranks_the_subsidy_cap_on_the_same_fill
        claim_type: priority_conflict
        grounds:
          - validations[priority=55]
          - validations[priority=81]
          - errors[ERR_LOT_EXPIRED]
          - errors[ERR_SUBSIDY_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_over_fiscal_on_dispense
          rationale: "The named §1.8 instance builds one dispense that is both past the lot's expiration date and beyond the program's headroom, asserts ERR_LOT_EXPIRED, then repairs only the temporal defect so the fiscal error appears from the same payload."

      - name: cross_entity_validation_run_schedule_reads_the_pools_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=23]
          - state_machines.Pool.transitions[BALANCED->COMMITTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_schedule_requires_pool_committed
          rationale: "The named §1.8 instance schedules a run against the same pool in DRAFT, in BALANCED and in COMMITTED, so the cross-entity precondition is exercised in both directions with the pool as the only variable."

      - name: aggregate_validation_pool_nutrition_upper_bound_is_closed
        claim_type: aggregate_validation
        grounds:
          - validations[priority=66]
          - calculations.pool_projected_kcal_per_oz
          - errors[ERR_POOL_NUTRITION_OUT_OF_RANGE]
        excluded_because:
          difficulty_instance: boundary_precision_check / pool_nutrition_closed_upper_bound_21_00
          rationale: "The named §1.8 instance commits a pool whose weighted average lands exactly on 21.00 and then one that lands on 21.01, which is precisely the aggregate-validation claim for this rule."

  # ==========================================================================
  - section: endpoints
    instances:

      - name: donation_pool_components_cross_reference_lists_every_draw_in_order
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /milk-bank/donations/{id}/pool-components]
          - entities.PoolComponent.fields.donation_id
          - entities.Donation.fields.remaining_ml
        distinguishing_aspect: "One donation drawn into two different DRAFT pools is reachable from the donation side: the reverse-reachability endpoint returns both PoolComponent rows in created_at ASC order with their own allocated volumes, the donation's remaining_ml reflects the sum of both draws, and a component id that belongs to another donation is not listed."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED and shipment TRK-0001 was received, carrying donation C1 of 1200 ml TERM at 20.0 expressed 2026-07-10."
            - "Two DRAFT pools exist: POOL-0001 (TERM) and POOL-0002 (TERM), both created by u-tech-1."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 1200, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 0, arrival_max_temp_celsius: -18.0, verified_volume_ml: 1200 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv1: "$.data.version" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C1", expressed_on: "2026-07-10", volume_ml: 1200, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn1: "$.data.id" } }
            - { call: "POST /milk-bank/pools", payload: { pool_code: "POOL-0001", target_milk_class: "TERM" }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { p1: "$.data.id" } }
            - { call: "POST /milk-bank/pools", payload: { pool_code: "POOL-0002", target_milk_class: "TERM" }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { p2: "$.data.id" } }
            - { call: "GET /milk-bank/pools/${p1}", payload: {}, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { pv1: "$.data.version" } }
            - { call: "GET /milk-bank/pools/${p2}", payload: {}, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { qv1: "$.data.version" } }
          trigger:
            - { call: "POST /milk-bank/pools/${p1}/components", payload: { donation_id: "${dn1}", allocated_volume_ml: 400, expected_pool_version: "${pv1}" }, as: ProcessingTechnician, as_user_id: "u-tech-1" }
            - { call: "POST /milk-bank/pools/${p2}/components", payload: { donation_id: "${dn1}", allocated_volume_ml: 300, expected_pool_version: "${qv1}" }, as: ProcessingTechnician, as_user_id: "u-tech-1" }
            - { call: "GET /milk-bank/donations/${dn1}/pool-components", payload: {}, as: ProcessingTechnician, as_user_id: "u-tech-1" }
          assert:
            - "third response: http_status == 200 and total_count == 2 and has_more == false"
            - "the rows come back created_at ASC: data[0].pool_id == ${p1} with allocated_volume_ml 400, then data[1].pool_id == ${p2} with allocated_volume_ml 300"
            - "data[0].component_kcal_per_oz == 20.0 and data[0].status == ALLOCATED and data[1].status == ALLOCATED"
            - "every returned row has donation_id == ${dn1}"
            - "Donation.${dn1}.remaining_ml == 500 and Donation.${dn1}.status == ELIGIBLE (700 ml drawn across two pools leaves the donation eligible for more draws)"
            - "Pool.${p1}.total_volume_ml == 400 and Pool.${p2}.total_volume_ml == 300"
            - "GET /milk-bank/donations/${dn1}/pool-components?limit=1&offset=0 returns only the ${p1} component row with total_count == 2 and has_more == true"

      - name: prescription_cancel_action_recomputes_only_its_own_tier_bucket
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /milk-bank/prescriptions/{id}/cancel]
          - state_machines.Prescription.transitions[QUEUED->CANCELLED]
          - entities.Prescription.fields.waitlist_position
        distinguishing_aspect: "Cancelling the middle outpatient order closes that row (status CANCELLED, waitlist_position null) and renumbers the tier 3 bucket to 1 and 2 by created_at ASC, while the tier 1 order keeps waitlist_position 1 because positions are ranked inside a bucket, not across the whole waitlist."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; no milk exists, so nothing can be filled and every prescription stays QUEUED."
            - "Prescriber u-presc-1 wrote, in this order, RX-7001, RX-7002 and RX-7003 - all OUTPATIENT/STANDARD, 500 ml, needed_by 2026-09-01 - and then RX-7004 (NICU_INPATIENT/CRITICAL, 500 ml)."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-7001", patient_reference: "OP-A", patient_type: "OUTPATIENT", clinical_acuity: "STANDARD", requires_preterm_milk: false, subsidy_required: false, prescribed_ml: 500, needed_by_date: "2026-09-01" }, as: Prescriber, as_user_id: "u-presc-1", captures: { rx1: "$.data.id" } }
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-7002", patient_reference: "OP-B", patient_type: "OUTPATIENT", clinical_acuity: "STANDARD", requires_preterm_milk: false, subsidy_required: false, prescribed_ml: 500, needed_by_date: "2026-09-01" }, as: Prescriber, as_user_id: "u-presc-1", captures: { rx2: "$.data.id" } }
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-7003", patient_reference: "OP-C", patient_type: "OUTPATIENT", clinical_acuity: "STANDARD", requires_preterm_milk: false, subsidy_required: false, prescribed_ml: 500, needed_by_date: "2026-09-01" }, as: Prescriber, as_user_id: "u-presc-1", captures: { rx3: "$.data.id" } }
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-7004", patient_reference: "NICU-A", patient_type: "NICU_INPATIENT", clinical_acuity: "CRITICAL", requires_preterm_milk: false, subsidy_required: false, prescribed_ml: 500, needed_by_date: "2026-09-01" }, as: Prescriber, as_user_id: "u-presc-1", captures: { rx4: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/prescriptions/${rx2}/cancel", payload: {}, as: Prescriber, as_user_id: "u-presc-1" }
          assert:
            - "response: http_status == 200 and data.status == CANCELLED and data.waitlist_position == null and data.version == 2"
            - "Prescription.${rx1}.waitlist_position == 1 and Prescription.${rx1}.priority_tier == 3 and Prescription.${rx1}.status == QUEUED"
            - "Prescription.${rx3}.waitlist_position == 2 and Prescription.${rx3}.priority_tier == 3 and Prescription.${rx3}.status == QUEUED"
            - "Prescription.${rx4}.waitlist_position == 1 and Prescription.${rx4}.priority_tier == 1"
            - "a fresh GET /milk-bank/prescriptions/${rx3} in the same request cycle already reports waitlist_position 2"
            - "GET /milk-bank/prescriptions?priority_tier=3&status=QUEUED returns total_count == 2 with the RX-7001 row before the RX-7003 row"
            - "GET /milk-bank/prescriptions?status=CANCELLED returns total_count == 1"

      - name: conditional_action_lot_release_only_when_the_run_is_eligible
        claim_type: conditional_action
        grounds:
          - endpoints[POST /milk-bank/milk-lots/{id}/release]
          - validations[priority=46]
          - entities.PasteurizationRun.fields.release_eligibility
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_release_requires_run_release_eligible
          rationale: "The named §1.8 instance is exactly the conditional-action claim for this endpoint: the release is refused while the run's release_eligibility is BLOCKED and allowed once the passing culture flips it to ELIGIBLE, with no other field changed between the two attempts."

      - name: allocation_cycle_bulk_run_fills_tier_one_then_leaves_a_tier_three_remainder
