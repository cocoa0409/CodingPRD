      - name: monitoring_writes_and_treasury_writes_exclude_each_other
        claim_type: exclusive_operation
        grounds:
          - rbac.RiskAnalyst.exclusive_operations
          - rbac.PortfolioController.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The two operational seats are mutually exclusive in both directions: the controller cannot ingest activity, run the detectors or place a funding hold, and the analyst cannot create a settlement batch, pay one or execute a termination - six 403s that leave the merchant with no activity rows, no batches and last_monitoring_run_date null."
        test_recipe:
          setup:
            - "standard merchant onboarded at clock 2026-08-04"
