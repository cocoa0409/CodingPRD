              captures: { err_overlap: $.data.error_id }
            - call: "POST /delivery-attempts"
              payload: { order_id: "${order_2}", courier_id: "${courier}", started_at: "2026-08-20T16:20:00Z" }
              as: Courier
              as_user_id: "${courier}"
              captures: { att_2: $.data.id }
          assert:
            - "the first trigger call returns 409 and ${err_overlap} == ERR_COURIER_SLOT_CONFLICT"
            - "the count of DeliveryAttempt rows with order_id == ${order_2} after the first trigger call is 0"
            - "the second trigger call returns 201 because exact adjacency at the excluded end 16:20 is permitted"
            - "DeliveryAttempt.${att_2}.state == INITIATED and DeliveryAttempt.${att_2}.started_at == 2026-08-20T16:20:00Z"
            - "DeliveryAttempt.${att_1}.state == INITIATED, untouched"
            - "Order.${order_2}.fulfillment_state == OUT_FOR_DELIVERY"

      - name: policy_effective_period_is_closed_closed_so_touching_dates_collide
        grounds:
          - validations[priority=62]
          - endpoints[POST /restriction-policies]
          - entities.RestrictionPolicy.fields.effective_from
          - entities.RestrictionPolicy.fields.effective_to
          - errors.ERR_POLICY_PERIOD_OVERLAP
        distinguishing_aspect: |
          A different resource entity (RestrictionPolicy, not Courier) with deliberately
          INVERTED adjacency geometry: effective periods are CLOSED-CLOSED on calendar
          dates, so a new period beginning on 2026-08-31 — the resident period's final day —
          shares exactly one date and is rejected, whereas beginning on 2026-09-01 is
          accepted. The scope is (jurisdiction_id, restriction_type), which a TOBACCO_VAPE policy
          spanning the identical August dates demonstrates by not colliding at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY holding one ALCOHOL policy effective 2026-08-01..2026-08-31"
            - "the same jurisdiction also holds a TOBACCO_VAPE policy effective 2026-08-01..2026-08-31, which shares every date but a different restriction_type"
