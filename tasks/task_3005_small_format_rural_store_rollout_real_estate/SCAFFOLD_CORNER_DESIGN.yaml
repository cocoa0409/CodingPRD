      - name: dc_capacity_exhausted_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DC_CAPACITY_EXCEEDED]
        distinguishing_aspect: "DC with store_capacity 1 accepts one assignment; the second store's assignment to the same DC fails with ERR_DC_CAPACITY_EXCEEDED."
