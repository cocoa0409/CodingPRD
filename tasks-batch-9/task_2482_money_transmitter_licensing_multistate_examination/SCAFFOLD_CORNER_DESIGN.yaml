        claim_type: Violation → Error
        grounds:
          - validations[priority=110]
          - errors[ERR_NET_WORTH_INSUFFICIENT]
        distinguishing_aspect: "The net-worth test is applied at APPROVE against the Jurisdiction minimum, not at submit: a licensee with 50000000 of tangible net worth passes CA's 50000000 floor but is refused by TX's 100000000 floor with ERR_NET_WORTH_INSUFFICIENT (422), leaving the application UNDER_REVIEW."
        test_recipe:
          setup: ["Jurisdiction TX (min_net_worth_cents 100000000); licensee with 50000000 of net worth; TX application UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas DOB", min_net_worth_cents: 100000000, base_bond_cents: 30000000, per_delegate_bond_cents: 250000, bond_cap_cents: 60000000, response_window_days: 10, renewal_fee_cents: 750000, assessment_rate_bps: 40, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Thinly Capitalised Pay LLC", ein: "74-1100002", reported_tangible_net_worth_cents: 50000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${tx_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_tx: "$.data.id" }
            - call: "POST /license-applications/${app_tx}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_tx}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${tx_id}"
          trigger:
            - call: "POST /license-applications/${app_tx}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${tx_id}"
