  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_review_and_anonymity_dimensions_move_independently
        grounds:
          - state_machines.Application.anonymity_status.SEALED_to_BREACHED
          - state_machines.Application.anonymity_status.BREACHED_to_REDACTED
          - state_machines.WorkSample.PENDING_SCREEN_to_FLAGGED
          - state_machines.Review.SUBMITTED_to_INVALIDATED
        distinguishing_aspect: |
          Flagging one work sample must drive the anonymity dimension SEALED -> BREACHED ->
          REDACTED while Application.status stays UNDER_REVIEW throughout, and redaction must
          clear the cycle freeze without resurrecting the invalidated reviews; collapsing the
          two dimensions into one status column, or treating redaction as a compensation for
          the review invalidation, changes at least four asserted fields.
        test_recipe:
          setup:
            - "CycleMain panel SCORING with five SUBMITTED reviews on the single UNDER_REVIEW application"
            - "Both of the application's work samples are still PENDING_SCREEN"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
          trigger:
            - { call: "POST /grants/work-samples/${ws1a}/screen", payload: { disposition: FLAGGED_IDENTIFYING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews", payload: { application_id: "${app1}" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/work-samples/${ws1a}/redact", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${pan}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { err_close: "$.data.error_id" } }
          assert:
            - "After the flag: WorkSample ws1a status == FLAGGED while ws1b stays PENDING_SCREEN"
            - "Application.anonymity_status == BREACHED but Application.status is still UNDER_REVIEW — the review dimension did not move"
            - "All five reviews are INVALIDATED with invalidation_reason == ANONYMITY_BREACH"
            - "valid_review_count == 0 and provisional_composite_score, final_composite_score and score_spread are all null"
            - "cycle.unresolved_breach_count == 1 and cycle.posture == FROZEN"
            - "After the redaction: ws1a status == REDACTED, contains_identifying_metadata == false, anonymity_status == REDACTED"
            - "cycle.unresolved_breach_count == 0 and cycle.posture returns to OPEN, while Application.status is still UNDER_REVIEW"
            - "The reviews remain INVALIDATED — redaction is not a compensation — so close-round returns 409 ERR_INSUFFICIENT_REVIEWS with valid_review_count 0 < quorum_min_reviews 3"

      - name: panel_loops_deliberating_back_to_scoring_for_a_bounded_second_round
        grounds:
          - state_machines.Panel.DELIBERATING_to_SCORING
          - state_machines.Panel.SCORING_to_DELIBERATING
          - state_machines.Review.SUBMITTED_to_SUPERSEDED
          - calculations.application_composite_score
        distinguishing_aspect: |
          A score_spread of 2.60 must set reopen_required, block the cycle's advance to
          BOARD_REVIEW, allow exactly one loop back to SCORING that supersedes every round-1
          review and nulls the provisional score, and then refuse a third round once
          round_number reaches max_review_rounds 2 — an implementation with a linear panel
          machine, or one that keeps round-1 reviews countable in round 2, diverges on the
          round-2 composite score.
        test_recipe:
          setup:
            - "CycleMain with the fifth review scoring (9,9,8,7) = 8.60 instead of 8.50, giving score_spread 2.60 > SPREAD_REOPEN_THRESHOLD 2.50"
            - "cycle.max_review_rounds is 2"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl5}", artistic_excellence: 9, work_sample_quality: 9, career_impact: 8, public_value: 7, comments: "Far and away the best submission." }, as: Panelist, as_user_id: "${pl5}", captures: { rv5: "$.data.id" } }
            - *k_srev5
          trigger:
            - { call: "POST /grants/panels/${pan}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: BOARD_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1", captures: { err_board: "$.data.error_id" } }
            - { call: "POST /grants/panels/${pan}/open-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl1}", artistic_excellence: 8, work_sample_quality: 8, career_impact: 8, public_value: 8, comments: "Round two: consistent." }, as: Panelist, as_user_id: "${pl1}", captures: { r2a: "$.data.id" } }
            - { call: "POST /grants/reviews/${r2a}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl2}", artistic_excellence: 7, work_sample_quality: 7, career_impact: 7, public_value: 7, comments: "Round two: solid." }, as: Panelist, as_user_id: "${pl2}", captures: { r2b: "$.data.id" } }
            - { call: "POST /grants/reviews/${r2b}/submit", payload: {}, as: Panelist, as_user_id: "${pl2}" }
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl3}", artistic_excellence: 6, work_sample_quality: 6, career_impact: 6, public_value: 6, comments: "Round two: adequate." }, as: Panelist, as_user_id: "${pl3}", captures: { r2c: "$.data.id" } }
