      - name: standing_boundary_07500_is_probation_not_suspension
        grounds:
          - calculations.turn_time_scorecard
        distinguishing_aspect: |
          Metric: on_time_rate ratio on the scorecard endpoint. With the first
          rated scorecard (completed_count exactly 4), rate exactly 0.7500 (3 of
          4 on time) is PROBATION — suspension requires strictly < 0.75 — while
          rate 0.5000 (2 of 4) is PANEL_SUSPENDED; this instance asserts the
          0.7500 edge plus the below-threshold case for the same appraiser after
          a hypothetical additional late order is NOT used (two separate
          appraisers are built instead).
        test_recipe:
          setup:
            - "Appraiser A: 4 desktop orders, 3 delivered on time (2026-08-05T12:00, due 2026-08-08T00:00) and 1 delivered late (2026-08-09T00:00)"
