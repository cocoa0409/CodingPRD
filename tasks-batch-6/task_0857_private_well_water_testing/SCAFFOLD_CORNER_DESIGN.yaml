# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_well_success_returns_proposed
        claim_type: Creation
        grounds: [entities.Well, endpoints]
        distinguishing_aspect: "POST /wells with all required fields returns 201; registry_status == PROPOSED, potability_status == UNKNOWN, active_advisory_count == 0."
        test_recipe:
          setup: ["An aquifer and an applicant exist."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-E1", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ent One", email: "e1@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
          trigger:
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.0, longitude: -117.0, parcel_apn: "APN-E1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
          assert:
            - "Well.${well}.registry_status == PROPOSED"
            - "Well.${well}.potability_status == UNKNOWN"
            - "Well.${well}.active_advisory_count == 0"

      - name: get_well_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Well, "errors[ERR_WELL_NOT_FOUND]"]
        distinguishing_aspect: "GET /wells/{unknown-uuid} returns ERR_WELL_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /wells/00000000-0000-0000-0000-000000000000", payload: {}, as: HealthOfficer }
          assert:
            - "response.error_id == ERR_WELL_NOT_FOUND"

      - name: create_well_missing_required_intended_use_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Well.fields.intended_use, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /wells omitting the required intended_use field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["An aquifer and applicant exist."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-E2", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ent Two", email: "e2@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
          trigger:
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.1, longitude: -117.1, parcel_apn: "APN-E2" }, as: Applicant, as_user_id: "${app}" }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: create_well_bad_enum_intended_use_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Well.fields.intended_use, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /wells with intended_use == 'MINING' (not in enum) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["An aquifer and applicant exist."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-E3", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ent Three", email: "e3@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
          trigger:
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.2, longitude: -117.2, parcel_apn: "APN-E3", intended_use: "MINING" }, as: Applicant, as_user_id: "${app}" }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: create_well_unknown_aquifer_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Well.fields.aquifer_id, "errors[ERR_AQUIFER_NOT_FOUND]"]
        distinguishing_aspect: "POST /wells with a non-existent aquifer_id FK returns ERR_AQUIFER_NOT_FOUND (404)."
        test_recipe:
          setup: ["An applicant exists; no aquifer with the referenced id."]
          setup_api_calls:
            - { call: "POST /applicants", payload: { full_name: "Ent Four", email: "e4@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
          trigger:
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "00000000-0000-0000-0000-000000000000", latitude: 33.3, longitude: -117.3, parcel_apn: "APN-E4", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}" }
          assert:
            - "response.error_id == ERR_AQUIFER_NOT_FOUND"

      - name: list_wells_pagination_envelope
        claim_type: Listing
        grounds: [entities.Well, endpoints]
        distinguishing_aspect: "GET /wells returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["At least one well exists."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-E5", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ent Five", email: "e5@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.4, longitude: -117.4, parcel_apn: "APN-E5", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
          trigger:
            - { call: "GET /wells", payload: { applicant_id: "${app}" }, as: HealthOfficer }
          assert:
            - "response_type == array"
            - "meta/pagination includes total_count and has_more"

      - name: aquifer_is_immutable_config_no_version
        claim_type: Immutability
        grounds: [entities.Aquifer]
        distinguishing_aspect: "Aquifer has common_fields:false: its create response exposes id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /aquifers", payload: { name: "Basin-E6", sensitivity: "MODERATE", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
          assert:
            - "Aquifer.${aq} has no version field"

      - name: panel_fee_computed_field
        claim_type: Computed Fields
        grounds: [entities.WaterSample.fields.panel_fee_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / panel_fee_round_per_analyte_then_sum_mode_b
          rationale: "panel_fee_cents computed-field correctness is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: approve_already_denied_permit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ConstructionPermit.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a permit already in DENIED returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A DENIED permit."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-S1", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Sm One", email: "s1@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-S1", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.5, longitude: -117.5, parcel_apn: "APN-S1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/deny", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: contamination_self_close_returns_forbidden
        claim_type: guarded transitions
        grounds: [state_machines.ContaminationCase.RESOLVED_to_CLOSED, "validations[priority=46]", "errors[ERR_SELF_CLOSE_FORBIDDEN]"]
        distinguishing_aspect: "The officer who opened a case (X-User-ID officer-A) attempting to close it after RESOLVED is rejected ERR_SELF_CLOSE_FORBIDDEN (403); segregation of duties."
        test_recipe:
          setup: ["A manually-opened (by officer-A) case advanced to RESOLVED."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-S2", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Sm Two", email: "s2@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.6, longitude: -117.6, parcel_apn: "APN-S2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /contamination-cases", payload: { well_id: "${well}", severity: "MODERATE" }, as: HealthOfficer, as_user_id: "officer-A", captures: { cc: "$.data.id" } }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "INVESTIGATING" }, as: HealthOfficer, as_user_id: "officer-A" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "MITIGATION" }, as: HealthOfficer, as_user_id: "officer-A" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "RESOLVED" }, as: HealthOfficer, as_user_id: "officer-A" }
          trigger:
            - { call: "POST /contamination-cases/${cc}/close", payload: { resolution_notes: "self close" }, as: HealthOfficer, as_user_id: "officer-A" }
          assert:
            - "response.error_id == ERR_SELF_CLOSE_FORBIDDEN"

      - name: driller_log_with_suspended_driller_returns_license_invalid
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=51]", entities.Driller.fields.status, "errors[ERR_DRILLER_LICENSE_INVALID]"]
        distinguishing_aspect: "Filing a driller log with a SUSPENDED driller against an ISSUED permit returns ERR_DRILLER_LICENSE_INVALID (422)."
        test_recipe:
          setup: ["An ISSUED permit whose assigned driller is then SUSPENDED."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-S3", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Sm Three", email: "s3@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-S3", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.7, longitude: -117.7, parcel_apn: "APN-S3", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /drillers/${dr}/suspend", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 300, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "CEMENT", completed_on: "2026-05-12T00:00:00Z" }, as: Driller, as_user_id: "${dr}" }
          assert:
            - "response.error_id == ERR_DRILLER_LICENSE_INVALID"

      - name: abandonment_complete_decommissions_well
        claim_type: Side Effect Execution
        grounds: [state_machines.AbandonmentPermit.APPROVED_to_COMPLETED, state_machines.Well.ACTIVE_to_DECOMMISSIONED]
        distinguishing_aspect: "Completing an APPROVED abandonment sets AbandonmentPermit.status COMPLETED and Well.registry_status DECOMMISSIONED."
        test_recipe:
          setup: ["An ACTIVE well with an APPROVED abandonment permit."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-S4", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Sm Four", email: "s4@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-S4", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 33.8, longitude: -117.8, parcel_apn: "APN-S4", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /abandonment-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", reason: "REPLACED", method: "OVERDRILL" }, as: Applicant, as_user_id: "${app}", captures: { ap: "$.data.id" } }
            - { call: "POST /abandonment-permits/${ap}/approve", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /abandonment-permits/${ap}/complete", payload: {}, as: Driller, as_user_id: "${dr}" }
          assert:
            - "AbandonmentPermit.${ap}.status == COMPLETED"
            - "Well.${well}.registry_status == DECOMMISSIONED"

      - name: unsafe_result_cascade_family
        claim_type: Side Effect Execution
        grounds: [state_machines.WaterSample.IN_ANALYSIS_to_RESULTED]
        excluded_because:
          difficulty_instance: transitive_cascade / unsafe_result_cascade_result_sample_case_well_advisory
          rationale: "The result -> sample -> case -> well/advisory side-effect chain is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: unauthenticated_request_returns_unauthenticated
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid X-User-Role header returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB; request sent without valid auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "GET /wells/00000000-0000-0000-0000-000000000000", payload: {}, as: HealthOfficer }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"

      - name: applicant_approve_permit_returns_unauthorized
        claim_type: Priority Ordering
        grounds: ["validations[priority=20]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Applicant calling POST /construction-permits/{id}/approve (HealthOfficer-only) returns ERR_UNAUTHORIZED (403); authz (20) precedes existence (30) so even a bogus id yields 403."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /construction-permits/00000000-0000-0000-0000-000000000000/approve", payload: {}, as: Applicant, as_user_id: "someone" }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: permit_applicant_mismatch_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=61]", "errors[ERR_APPLICANT_MISMATCH]"]
        distinguishing_aspect: "POST /construction-permits whose applicant_id differs from Well.applicant_id returns ERR_APPLICANT_MISMATCH (409)."
        test_recipe:
          setup: ["A well owned by applicant A; a second applicant B."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-V3", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Owner A", email: "va@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { appA: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Owner B", email: "vb@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { appB: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-V3", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${appA}", aquifer_id: "${aq}", latitude: 33.9, longitude: -117.9, parcel_apn: "APN-V3", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${appA}", captures: { well: "$.data.id" } }
          trigger:
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${appB}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${appB}" }
          assert:
            - "response.error_id == ERR_APPLICANT_MISMATCH"

      - name: sample_result_negative_nitrate_returns_out_of_range
        claim_type: Violation → Error
        grounds: ["validations[priority=26]", "errors[ERR_ANALYTE_OUT_OF_RANGE]"]
        distinguishing_aspect: "POST /sample-results with nitrate_mg_l == -1.0 returns ERR_ANALYTE_OUT_OF_RANGE (400)."
        test_recipe:
          setup: ["An ACTIVE well with a sample in IN_ANALYSIS."]
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-V4", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Owner V4", email: "v4@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-V4", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.01, longitude: -118.01, parcel_apn: "APN-V4", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["NITRATE"], collected_on: "2026-05-12T00:00:00Z", chain_of_custody_id: "COC-V4" }, as: Applicant, as_user_id: "${app}", captures: { ws: "$.data.id" } }
            - { call: "POST /water-samples/${ws}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws}/begin-analysis", payload: {}, as: LabAnalyst }
          trigger:
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws}", bacteria_coliform: "ABSENT", ecoli: "ABSENT", nitrate_mg_l: -1.0, lead_ppb: 2.0, analyzed_on: "2026-05-13T00:00:00Z" }, as: LabAnalyst }
          assert:
            - "response.error_id == ERR_ANALYTE_OUT_OF_RANGE"

      - name: link_sample_outside_window_91_days_returns_error
        claim_type: Temporal validation
