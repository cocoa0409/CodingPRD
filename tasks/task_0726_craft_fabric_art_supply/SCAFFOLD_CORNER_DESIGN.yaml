scaffold_corner_design:
  # ===========================================================================
  - section: endpoints
    instances:
      - name: create_order_success_envelope_shape
        claim_type: response_envelope
        grounds:
          - endpoints
          - entities.Order
        distinguishing_aspect: "POST /orders returns 201 with response_type=object and data carrying fulfillment_status=BUILDING, payment_status=UNPAID, version=1."
        test_recipe:
          setup:
            - "A registered customer C."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc1@x.com", full_name: "CC One", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, fs: $.data.fulfillment_status, ps: $.data.payment_status, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Order.${o_id}.fulfillment_status == BUILDING"
            - "Order.${o_id}.payment_status == UNPAID"
            - "Order.${o_id}.version == 1"

      - name: list_products_pagination_defaults
        claim_type: pagination
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /products returns response_type=array with pagination fields limit=10, offset=0, has_more when >10 products exist."
        test_recipe:
          setup:
            - "No products created."
          setup_api_calls: []
          trigger:
            - call: "GET /products"
              payload: {}
              as: StoreManager
              captures: { rtype: $.response_type }
          assert:
            - "HTTP status == 200"
            - "response_type == array"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_context_header_rejected
        claim_type: auth_missing_header
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-Role header to POST /products is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "X", name: "X", sell_mode: "UNIT", unit_price_cents: 100 }
              as: NONE
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: create_product_wrong_role_forbidden
        claim_type: rbac_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - roles
        distinguishing_aspect: "Customer calling POST /products (StoreManager-exclusive) is denied with ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup:
            - "A customer C exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc2@x.com", full_name: "CC Two", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "P1", name: "Glue", sell_mode: "UNIT", unit_price_cents: 100 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: get_missing_order_not_found
        claim_type: existence_not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{id} for a non-existent id returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "No order with the queried id."
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_ORDER_NOT_FOUND"

      - name: add_line_unknown_product_referenced_not_found
        claim_type: referential_integrity
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - entities.OrderLine.fields.product_id
        distinguishing_aspect: "POST /orders/{id}/lines with a body product_id that does not resolve returns 404 ERR_REFERENCED_ENTITY_NOT_FOUND."
        test_recipe:
          setup:
            - "Order O in BUILDING; product_id in body does not exist."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc3@x.com", full_name: "CC Three", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"

      - name: cut_increment_violation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_CUT_INCREMENT]
          - entities.Product.fields.min_cut_increment_yards
        distinguishing_aspect: "Adding a BY_YARD line with requested_yards=0.3 to a product with min_cut_increment_yards=0.25 (not a multiple) returns 422 ERR_INVALID_CUT_INCREMENT."
        test_recipe:
          setup:
            - "Product P BY_YARD, min_cut_increment_yards=0.25; Order O BUILDING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc4@x.com", full_name: "CC Four", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-Q", name: "Silk", sell_mode: "BY_YARD", unit_price_cents: 400, min_cut_increment_yards: 0.25 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 0.3 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_CUT_INCREMENT"

      - name: coupon_min_basket_not_met
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_COUPON_MIN_NOT_MET]
          - entities.Coupon.fields.min_basket_cents
        distinguishing_aspect: "Applying a coupon with min_basket_cents=10000 to an order whose subtotal is 500 returns 422 ERR_COUPON_MIN_NOT_MET."
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Order O with one UNIT line subtotal=500. Coupon BIG with min_basket_cents=10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "cc5@x.com", full_name: "CC Five", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-500b", name: "Tape", sell_mode: "UNIT", unit_price_cents: 500 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "BIG", discount_type: "FIXED", value: 100, min_basket_cents: 10000, priority: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "BIG", expected_order_version: "${ov0}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_COUPON_MIN_NOT_MET"

      - name: submit_insufficient_inventory
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: "Submitting an order whose BY_YARD line requests 20 yards against a lot with available_yards=5 returns 409 ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup:
            - "Product P BY_YARD, lot on_hand_yards=5; Order O with a line requesting 20 yards."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc6@x.com", full_name: "CC Six", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-S", name: "Felt", sell_mode: "BY_YARD", unit_price_cents: 100, min_cut_increment_yards: 1 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 5 }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 20 }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INSUFFICIENT_INVENTORY"

      - name: ready_requires_paid_order
        claim_type: violation_to_error
        grounds:
          - state_machines.Order.SUBMITTED_to_READY_FOR_PICKUP
          - errors[ERR_ORDER_NOT_PAID]
        distinguishing_aspect: "Marking a SUBMITTED but UNPAID order ready returns 409 ERR_ORDER_NOT_PAID."
        test_recipe:
          setup:
            - "Order O SUBMITTED, payment UNPAID, cut recorded."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc7@x.com", full_name: "CC Seven", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-Y", name: "Bead", sell_mode: "UNIT", unit_price_cents: 300 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 10 }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StoreAssociate
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ORDER_NOT_PAID"

      - name: registration_closed_after_session_start
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_REGISTRATION_CLOSED]
        distinguishing_aspect: "Registering after clock now >= session.starts_at returns 422 ERR_REGISTRATION_CLOSED."
        test_recipe:
          setup:
            - "OPEN workshop with a session starting 2026-08-10T10:00Z; clock advanced to 2026-08-10T11:00Z (past start)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "cc8@x.com", full_name: "CC Eight", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "RC" }
              as: StoreManager
              captures: { r_id: $.data.id }
            - call: "POST /workshops"
              payload: { title: "Late" }
              as: StoreManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${r_id}", instructor_code: "I1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { s_id: $.data.id }
            - call: "POST /workshops/${w_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s_id}", customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_REGISTRATION_CLOSED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_order_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an order already CANCELLED returns 409 ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup:
            - "Order O already CANCELLED (created then cancelled while BUILDING)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc9@x.com", full_name: "CC Nine", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: open_workshop_with_no_sessions_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Workshop.DRAFT_to_OPEN
          - errors[ERR_NO_SESSIONS]
        distinguishing_aspect: "Opening a DRAFT workshop that has zero sessions returns 409 ERR_NO_SESSIONS."
        test_recipe:
          setup:
            - "Workshop W in DRAFT with no sessions."
          setup_api_calls:
            - call: "POST /workshops"
              payload: { title: "Empty" }
              as: StoreManager
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /workshops/${w_id}/open"
              payload: {}
              as: StoreManager
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_NO_SESSIONS"

      - name: confirm_special_order_from_requested_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a SpecialOrder still in REQUESTED (not QUOTED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "SpecialOrder SO in REQUESTED (never quoted)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc10@x.com", full_name: "CC Ten", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SP-1", name: "Rare Ink", sell_mode: "UNIT", unit_price_cents: 5000, special_order_only: true }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", quantity: 2 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: special_order_deposit_fifty_percent
        claim_type: computed_field_correctness
        grounds:
          - calculations.special_order_deposit
          - entities.SpecialOrder.fields.deposit_cents
        distinguishing_aspect: "Quoting a SpecialOrder qty=2 at 5000c/unit sets deposit_cents = round_half_up(10000*0.5) = 5000."
        test_recipe:
          setup:
            - "SpecialOrder SO in REQUESTED, quantity=2."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc11@x.com", full_name: "CC Eleven", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SP-2", name: "Special Pigment", sell_mode: "UNIT", unit_price_cents: 5000, special_order_only: true }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", quantity: 2 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_unit_price_cents: 5000 }
              as: StoreManager
              captures: { dep: $.data.deposit_cents }
          assert:
            - "SpecialOrder.${so_id}.deposit_cents == 5000"
            - "SpecialOrder.${so_id}.status == QUOTED"

      - name: percent_coupon_excludes_clearance_base
        claim_type: computed_field_correctness
        grounds:
          - calculations.coupon_discount
          - entities.Coupon.fields.excludes_clearance
          - entities.Product.fields.is_clearance
        distinguishing_aspect: "A 10% coupon with excludes_clearance=true against subtotal 2000 (1000 clearance + 1000 regular) discounts only the 1000 regular base -> discount 100, provisional_total_cents = 1900."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Order with two UNIT lines: clearance product 1000c and regular product 1000c. Coupon TEN (PERCENT 0.1, excludes_clearance=true)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "cc12@x.com", full_name: "CC Twelve", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CLR-1", name: "Clearance Yarn", sell_mode: "UNIT", unit_price_cents: 1000, is_clearance: true }
              as: StoreManager
              captures: { clr_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "REG-1", name: "Regular Yarn", sell_mode: "UNIT", unit_price_cents: 1000, is_clearance: false }
              as: StoreManager
              captures: { reg_id: $.data.id }
            - call: "POST /products/${clr_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /products/${reg_id}/inventory-lots"
              payload: { on_hand_yards: 50 }
              as: StoreManager
            - call: "POST /coupons"
              payload: { code: "TEN", discount_type: "PERCENT", value: 0.1, excludes_clearance: true, priority: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: StoreManager
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${clr_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${reg_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/coupons"
              payload: { code: "TEN", expected_order_version: "${ov0}" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Order.${o_id}.provisional_total_cents == 1900"

      - name: framing_quote_large_tier
        claim_type: computed_field_correctness
        grounds:
          - calculations.framing_quote
        distinguishing_aspect: "width=50,height=50 -> united_inches=100 selects LARGE rate 40; quote = 2000 + 40*200 = 10000 cents."
        test_recipe:
          setup:
            - "Customer C with a BUILDING order O."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc13@x.com", full_name: "CC Thirteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /framing-orders"
              payload: { order_id: "${o_id}", customer_id: "${c_id}", width_in: 50, height_in: 50 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { f_id: $.data.id, qp: $.data.quoted_price_cents }
          assert:
            - "FramingOrder.${f_id}.quoted_price_cents == 10000"

  # ===========================================================================
  - section: entities
    instances:
      - name: bundle_materialization_creates_lines
        claim_type: computed_field_correctness
        grounds:
          - entities.ProjectBundle.fields.bom
          - endpoints
          - entities.Order.fields.project_bundle_id
        distinguishing_aspect: "Creating an order from a ProjectBundle with a 2-entry BOM produces exactly 2 DRAFT OrderLines, discoverable via GET /orders/{id}/lines."
        test_recipe:
          setup:
            - "ProjectBundle B for customer C with bom of two products."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc14@x.com", full_name: "CC Fourteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "B1", name: "Paint", sell_mode: "UNIT", unit_price_cents: 500 }
              as: StoreManager
              captures: { p1_id: $.data.id }
