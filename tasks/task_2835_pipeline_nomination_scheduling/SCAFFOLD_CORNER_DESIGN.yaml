          difficulty_instance: non_linear_state_machine / nomination_revision_loop_returns_to_submitted_and_then_locks
          rationale: "The cyclic ACCEPTED/PRORATED -> REVISION_REQUESTED -> SUBMITTED -> PRORATED loop, its revision_count accumulation and its terminal lock are asserted hop-by-hop by the named §1.8 instance."

