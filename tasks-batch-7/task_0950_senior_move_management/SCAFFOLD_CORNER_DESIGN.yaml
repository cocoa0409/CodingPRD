            - "the second create responds 409 and ${r2} == ERR_FREEZE_WINDOW_ENTERED"
            - "MoveDayPlan.${mdp}.status == DRAFT and crew_confirmed_count == 0"
            - "GET /crew-assignments filtered by move_day_plan_id returns total_count == 0"

  - section: validations
    instances:
      - name: positivity_rung_rejects_a_zero_quoted_cents_vendor_assignment
        claim_type: Violation to Error
        grounds: ['validations[priority=5]', 'errors[ERR_VALIDATION]', 'endpoints["POST /vendor-assignments"]']
        distinguishing_aspect: "quoted_cents is one of the fields rung 5 names as domain-positive, so a vendor assignment quoted at exactly 0 is refused 400 ERR_VALIDATION; this is the just-outside half of the positivity boundary."
        test_recipe:
          setup: ["One engagement and one JUNK_HAUL vendor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /vendors"
              payload: { name: "Bayside Junk Haul", vendor_type: "JUNK_HAUL", coi_expires_on: "2026-12-31" }
              as: PLATFORM_ADMIN
              captures: { vj: "$.data.id" }
          trigger:
            - call: "POST /vendor-assignments"
              payload: { engagement_id: "${eng}", vendor_id: "${vj}", service_kind: "HAUL_AWAY", service_date: "2026-06-15", quoted_cents: 0 }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
          assert:
            - "the trigger responds 400 and ${r1} == ERR_VALIDATION"
            - "GET /vendor-assignments filtered by engagement_id returns total_count == 0"

      - name: positivity_rung_admits_a_one_cent_quoted_vendor_assignment
        claim_type: Satisfaction to Pass
        grounds: ['validations[priority=5]', 'state_machines.VendorAssignment.status.REQUESTED_to_ACCEPTED', 'endpoints["POST /vendor-assignments"]']
        distinguishing_aspect: "One cent is the smallest value rung 5 admits, so the identical create with quoted_cents 1 succeeds with 201 and lands in status REQUESTED; this is the just-inside half of the positivity boundary."
        test_recipe:
          setup: ["One engagement and one JUNK_HAUL vendor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /vendors"
              payload: { name: "Bayside Junk Haul", vendor_type: "JUNK_HAUL", coi_expires_on: "2026-12-31" }
              as: PLATFORM_ADMIN
              captures: { vj: "$.data.id" }
          trigger:
            - call: "POST /vendor-assignments"
              payload: { engagement_id: "${eng}", vendor_id: "${vj}", service_kind: "HAUL_AWAY", service_date: "2026-06-15", quoted_cents: 1 }
              as: MOVE_MANAGER
              captures: { va: "$.data.id" }
          assert:
            - "the trigger responds 201"
            - "VendorAssignment.${va}.status == REQUESTED"
            - "VendorAssignment.${va}.quoted_cents == 1"
            - "VendorAssignment.${va}.paid_cents == 0 and holdback_cents == 0"

      - name: pagination_limit_one_is_the_inclusive_lower_bound
        claim_type: Satisfaction to Pass
        grounds: ['validations[priority=7]', 'response_envelope.pagination_defaults', 'endpoints["GET /engagements"]']
        distinguishing_aspect: "limit 1 and limit 100 are both inside the declared 1..100 window, so both reads succeed with 200 and the limit-1 read returns exactly one of the two engagements with has_more true."
        test_recipe:
          setup: ["Two engagements for the same client."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { e1: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "ONE_BED", scheduled_move_start_utc: "2026-07-20T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { e2: "$.data.id" }
          trigger:
            - call: "GET /engagements"
              payload: { client_id: "${cl}", limit: 1, offset: 0 }
              as: MOVE_MANAGER
            - call: "GET /engagements"
              payload: { client_id: "${cl}", limit: 100, offset: 0 }
              as: MOVE_MANAGER
          assert:
            - "the limit-1 read responds 200 with total_count == 2, has_more == true and exactly one row"
            - "the limit-100 read responds 200 with total_count == 2, has_more == false and exactly two rows"
            - "Client.${cl}.engagement_count == 2"

      - name: pagination_limit_zero_and_negative_offset_are_outside_the_range
        claim_type: Violation to Error
        grounds: ['validations[priority=7]', 'errors[ERR_VALIDATION]', 'response_envelope.pagination_defaults']
        distinguishing_aspect: "limit 0 sits one below the declared minimum of 1 and offset -1 sits one below the declared minimum of 0, so each read is refused 400 ERR_VALIDATION; this is the just-outside half of the pagination boundary."
        test_recipe:
          setup: ["One engagement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "GET /engagements"
              payload: { client_id: "${cl}", limit: 0 }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
            - call: "GET /engagements"
              payload: { client_id: "${cl}", offset: -1 }
              as: MOVE_MANAGER
              captures: { r2: "$.data.error_id" }
          assert:
            - "the limit-0 read responds 400 and ${r1} == ERR_VALIDATION"
            - "the offset-minus-one read responds 400 and ${r2} == ERR_VALIDATION"

      - name: authority_ceiling_exactly_equal_to_the_item_value_permits_the_designation
        claim_type: Satisfaction to Pass
        grounds: ['validations[priority=30]', 'calculations.authority_approval_ceiling_check', 'state_machines.InventoryItem.disposition.UNDECIDED_to_DONATE']
        distinguishing_aspect: "The ceiling comparison is greater-than-or-equal, so a POA whose approval_ceiling_cents is exactly 100000 may designate an item appraised at exactly 100000 and the designation succeeds; this is the just-inside half of the ceiling boundary."
        test_recipe:
