# =============================================================================
# task_2133_crane_rigging_lift — Crane & Rigging Services with Lift Planning
# Seed tables §1.0–§1.7  (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#                          corner design   → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2133. Crane & Rigging Services with Lift Planning
  (Maxim Crane style operator): crane selection & load chart verification, critical-lift plan
  & engineering review, ground bearing/matting & site survey, operator certification & rigger
  qualification, permit/road closure & escort, weather/wind hold & standby time, rigging gear
  inspection & retirement, hourly vs lump-sum with travel

domain_name: crane-rigging-lift
api_prefix: "/"          # flat topology — every collection is a top-level path segment

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel
  # LiftPlan carries two independent dimensions (plan_status × field_status);
  # EngineeringReview and Permit are cyclic; Crane is cyclic; RiggingGear is cyclic.

  relationship_patterns:
    - one_to_many          # Customer→Site→LiftPlan, Crane→LoadChartEntry, RiggingGear→GearInspection
    - many_to_many         # LiftPlan ↔ RiggingGear through GearAssignment
    - polymorphic          # Personnel.role_type ∈ {OPERATOR, RIGGER, ENGINEER}; LiftPlan.operator_id and
                           # LiftPlan.rigger_id and EngineeringReview.author_personnel_id all point at Personnel
    - cross_aggregate      # Invoice ledger touches Customer; gear retirement touches LiftPlan and EngineeringReview

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  difficulty_notes: |
    Density, not volume, carries the difficulty: (1) load-chart ceiling lookup feeding a nested
    min() capacity formula feeding a tiered lift-class threshold at an exact 75.00 boundary;
    (2) the SAME ground-bearing inputs producing two legally different psf/mat answers depending
    on which variant the workflow is in; (3) an invoice whose subtotal must be round-per-line-
    then-sum (sum-then-round differs by exactly 1 cent on the canonical fixture) and whose
    discount tier must be keyed on the PRE-surcharge subtotal even though the surcharge would
    push it over the tier boundary; (4) two 4-hop cascades from different triggers; (5) three
    validation-priority pairs that only resolve correctly if the checker runs in the declared
    order.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Legal account name of the lift customer" }
      - { name: billing_terms, type: enum, source: input, default: "NET_30", description: "Payment terms", constraints: "NET_15 | NET_30 | NET_45" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "True while the account is blocked from new releases and invoice issuance; toggled by POST /customers/{id}/credit-status" }
      - { name: credit_hold_reason, type: string, source: system, default: null, description: "Free text reason recorded when credit_hold was last set to true; null when credit_hold is false" }
      - { name: open_receivable_cents, type: integer, source: computed, default: 0, description: "Conserved money ledger. Equals SUM(Invoice.total_cents) over Invoices whose customer_id equals this Customer.id AND whose status IN {ISSUED, DISPUTED}. Recomputed on every Invoice status change." }
      - { name: invoice_count, type: integer, source: computed, default: 0, description: "Count of Invoices whose customer_id equals this Customer.id, any status" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the account that owns this site" }
      - { name: address_label, type: string, source: input, description: "Human label for the lift location" }
      - { name: jurisdiction_code, type: string, source: input, description: "Permitting authority code, e.g. NJ-BERGEN; Permit.jurisdiction_code must equal this value" }
      - { name: soil_bearing_capacity_psf, type: integer, source: input, description: "Allowable soil bearing pressure in lb per square foot", constraints: "integer > 0" }
      - { name: proximity_to_energized_lines_ft, type: integer, source: input, default: 999, description: "Distance from the nearest energized power line in feet", constraints: "integer >= 0" }
      - { name: over_water, type: boolean, source: input, default: false, description: "True when the lift is staged over open water" }
      - { name: survey_status, type: enum, source: system, default: "NOT_SURVEYED", description: "Flips to SURVEYED the first time any LiftPlan on this Site completes POST /lift-plans/{id}/site-survey", constraints: "NOT_SURVEYED | SURVEYED" }
      - { name: last_surveyed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent site-survey call touching this Site" }
      - { name: access_notes, type: string, source: system, default: null, description: "Access notes captured by the most recent site-survey call" }
      - { name: mat_inventory_available, type: boolean, source: system, default: false, description: "Whether crane mats are stocked on site, recorded by the most recent site-survey call" }

  - name: Crane
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Manufacturer model designation" }
      - { name: class_tons, type: integer, source: input, description: "Nominal crane capacity class in US tons; drives escort_required at the 200-ton boundary and the operator endorsement check", constraints: "integer > 0" }
      - { name: gross_weight_lb, type: integer, source: input, description: "Machine weight without counterweight, in lb", constraints: "integer > 0" }
      - { name: counterweight_lb, type: integer, source: input, description: "Installed counterweight in lb", constraints: "integer >= 0" }
      - { name: outrigger_pad_area_sqft, type: number, source: input, description: "Bearing area of ONE outrigger float in square feet", constraints: "number > 0" }
      - { name: max_line_pull_lb, type: integer, source: input, description: "Single-part hoist line pull limit in lb", constraints: "integer > 0" }
      - { name: rated_max_wind_mph, type: integer, source: input, description: "Manufacturer rated maximum in-service wind speed in mph", constraints: "integer > 0" }
      - { name: annual_inspection_expires_on, type: datetime, source: input, description: "ISO 8601 UTC instant at which the annual crane inspection lapses" }
      - { name: mob_demob_cents, type: integer, source: input, description: "Flat round-trip mobilization plus demobilization charge in cents", constraints: "integer >= 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Bare-rental hourly rate in cents used by every HOURLY invoice line and by the standby multiplier", constraints: "integer > 0" }
      - { name: out_of_service_flag, type: boolean, source: system, default: false, description: "Set true by POST /cranes/{id}/out-of-service, cleared by POST /cranes/{id}/return-to-service" }
      - { name: status, type: enum, source: computed, default: "AVAILABLE", description: "Derived posture, evaluated in this precedence: OUT_OF_SERVICE if out_of_service_flag is true OR logical_now >= annual_inspection_expires_on; else IN_SERVICE if any LiftPlan on this crane has field_status IN {MOBILIZED, LIFTING, WIND_HOLD, SECURED}; else RESERVED if reserved_hours_total > 0; else AVAILABLE", constraints: "AVAILABLE | RESERVED | IN_SERVICE | OUT_OF_SERVICE" }
      - { name: reserved_hours_total, type: number, source: computed, default: 0, description: "Conserved reservation ledger. Equals SUM over LiftPlan where crane_id equals this Crane.id AND plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED} of (window_end - window_start) expressed in hours, rounded half-up to 2 decimals" }
      - { name: active_plan_count, type: integer, source: computed, default: 0, description: "Count of LiftPlan rows contributing to reserved_hours_total" }

  - name: LoadChartEntry
    parent: null
    common_fields: false
    fields:
      - { name: crane_id, type: string, source: input, description: "FK -> Crane.id; the machine this chart row belongs to" }
      - { name: configuration, type: enum, source: input, description: "Boom configuration this row is charted for", constraints: "MAIN_BOOM | LUFFING_JIB | FIXED_JIB" }
      - { name: boom_length_ft, type: integer, source: input, description: "Charted boom length in feet; matched EXACTLY during lookup", constraints: "integer > 0" }
      - { name: radius_ft, type: integer, source: input, description: "Charted working radius in feet; matched by smallest-radius-not-less-than (ceiling) lookup", constraints: "integer > 0" }
      - { name: gross_capacity_lb, type: integer, source: input, description: "Gross charted capacity at this configuration/boom/radius, in lb", constraints: "integer > 0" }

  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Person name" }
      - { name: role_type, type: enum, source: input, description: "Discriminator; LiftPlan.operator_id must reference OPERATOR, LiftPlan.rigger_id must reference RIGGER, EngineeringReview.author_personnel_id and stamped_by_personnel_id must reference ENGINEER", constraints: "OPERATOR | RIGGER | ENGINEER" }
      - { name: certification_number, type: string, source: input, description: "NCCCO / NCCER / PE certificate number" }
      - { name: certification_expires_on, type: datetime, source: input, description: "ISO 8601 UTC instant at which the certification lapses" }
      - { name: endorsement_class_tons, type: integer, source: input, default: 0, description: "Largest Crane.class_tons this person may operate; only meaningful for role_type OPERATOR", constraints: "integer >= 0" }
      - { name: rigger_level, type: enum, source: input, default: "NONE", description: "Rigger qualification ladder, ordered NONE < BASIC < INTERMEDIATE < ADVANCED < MASTER; only meaningful for role_type RIGGER", constraints: "NONE | BASIC | INTERMEDIATE | ADVANCED | MASTER" }
      - { name: pe_license_state, type: string, source: input, default: null, description: "Professional-engineer license state; only meaningful for role_type ENGINEER" }
      - { name: status, type: enum, source: computed, default: "ACTIVE", description: "EXPIRED when logical_now >= certification_expires_on, otherwise ACTIVE", constraints: "ACTIVE | EXPIRED" }
      - { name: peak_daily_assigned_hours, type: number, source: computed, default: 0, description: "Maximum, over every UTC calendar day touched by this person's assignments, of the summed clipped hours that LiftPlans where operator_id equals this Personnel.id AND plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED} occupy on that day; rounded half-up to 2 decimals" }

  - name: RiggingGear
    parent: null
    common_fields: true
    fields:
      - { name: gear_tag, type: string, source: input, description: "Asset tag; globally unique across all RiggingGear", constraints: "unique" }
      - { name: gear_type, type: enum, source: input, description: "Gear family", constraints: "SLING | SHACKLE | SPREADER_BAR" }
      - { name: rated_wll_lb, type: integer, source: input, description: "Manufacturer rated working load limit in lb", constraints: "integer > 0" }
      - { name: weight_lb, type: integer, source: input, description: "Dead weight of the gear itself in lb; enters LiftPlan.rigging_weight_lb", constraints: "integer >= 0" }
      - { name: inspection_interval_days, type: integer, source: input, default: 30, description: "Days between periodic inspections", constraints: "integer > 0" }
      - { name: last_inspection_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent GearInspection on this gear" }
      - { name: next_inspection_due_at, type: datetime, source: computed, default: null, description: "last_inspection_at plus inspection_interval_days; null while last_inspection_at is null" }
      - { name: repair_count, type: integer, source: system, default: 0, description: "Number of GearInspection rows on this gear whose result is REPAIR_PASS; drives the WLL derate" }
      - { name: effective_wll_lb, type: integer, source: computed, default: 0, description: "Derated working load limit, floor(rated_wll_lb * max(1 - 0.05 * repair_count, 0.70)); equals rated_wll_lb while repair_count is 0" }
      - { name: status, type: enum, source: computed, default: "DUE_INSPECTION", description: "Lifecycle posture; newly created gear starts at DUE_INSPECTION and must pass an inspection before it may be assigned", constraints: "DUE_INSPECTION | SERVICEABLE | QUARANTINED | RETIRED" }
      - { name: committed_assignment_count, type: integer, source: computed, default: 0, description: "Conserved commitment ledger. Count of GearAssignment rows whose gear_id equals this RiggingGear.id AND whose status is ACTIVE" }

  - name: GearInspection
    parent: null
    common_fields: false
    fields:
      - { name: gear_id, type: string, source: input, description: "FK -> RiggingGear.id; the gear that was inspected" }
      - { name: result, type: enum, source: input, description: "Inspection outcome", constraints: "PASS | FAIL | REPAIR_PASS | RETIRE" }
      - { name: inspector_note, type: string, source: input, description: "Free-text finding recorded by the SafetyManager" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock instant at which the inspection was recorded" }
      - { name: resulting_status, type: enum, source: system, description: "RiggingGear.status this inspection drove the gear to: PASS and REPAIR_PASS produce SERVICEABLE, FAIL produces QUARANTINED, RETIRE produces RETIRED", constraints: "SERVICEABLE | QUARANTINED | RETIRED" }
      - { name: repair_count_after, type: integer, source: system, description: "RiggingGear.repair_count immediately after this inspection was applied" }

  - name: LiftPlan
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; where the lift happens" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; copied from Site.customer_id at creation and never changed afterwards" }
      - { name: crane_id, type: string, source: system, default: null, description: "FK -> Crane.id; null until POST /lift-plans/{id}/configure assigns a machine" }
      - { name: operator_id, type: string, source: system, default: null, description: "FK -> Personnel.id; the assigned OPERATOR, null until configure" }
      - { name: rigger_id, type: string, source: system, default: null, description: "FK -> Personnel.id; the assigned RIGGER, null until configure" }
      - { name: job_reference, type: string, source: input, description: "Customer-facing job number" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the on-site crane window" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the on-site crane window; must be strictly after window_start" }
      - { name: load_weight_lb, type: integer, source: input, description: "Weight of the load itself in lb, excluding rigging", constraints: "integer > 0" }
      - { name: sail_area_sqft, type: number, source: input, default: 0, description: "Projected wind sail area of the load in square feet", constraints: "number >= 0" }
      - { name: personnel_lift, type: boolean, source: input, default: false, description: "True when the lift suspends personnel; forces lift_class to ENGINEERED_CRITICAL" }
      - { name: multi_crane, type: boolean, source: input, default: false, description: "True for tandem/multi-crane picks; forces lift_class to at least ENGINEERED_CRITICAL" }
      - { name: road_closure_requested, type: boolean, source: input, default: false, description: "True when the job needs a lane or road closure; forces permit_required" }
      - { name: configuration, type: enum, source: system, default: null, description: "Boom configuration chosen at configure; matched against LoadChartEntry.configuration", constraints: "MAIN_BOOM | LUFFING_JIB | FIXED_JIB" }
      - { name: boom_length_ft, type: integer, source: system, default: null, description: "Boom length selected at configure, matched EXACTLY against the load chart" }
      - { name: radius_ft, type: integer, source: system, default: null, description: "Working radius selected at configure, resolved by ceiling lookup against the load chart" }
      - { name: parts_of_line, type: integer, source: system, default: null, description: "Number of hoist rope parts reeved, selected at configure", constraints: "integer >= 1" }
      - { name: block_weight_lb, type: integer, source: system, default: 0, description: "Hook block weight deduction in lb, set at configure" }
      - { name: jib_weight_lb, type: integer, source: system, default: 0, description: "Erected jib weight deduction in lb, set at configure" }
      - { name: aux_head_weight_lb, type: integer, source: system, default: 0, description: "Auxiliary head weight deduction in lb, set at configure" }
      - { name: chart_gross_capacity_lb, type: integer, source: computed, default: 0, description: "gross_capacity_lb of the LoadChartEntry resolved by the ceiling lookup" }
      - { name: hoist_line_capacity_lb, type: integer, source: computed, default: 0, description: "Crane.max_line_pull_lb multiplied by parts_of_line" }
      - { name: net_capacity_lb, type: integer, source: computed, default: 0, description: "min(chart_gross_capacity_lb, hoist_line_capacity_lb) minus (block_weight_lb + jib_weight_lb + aux_head_weight_lb)" }
      - { name: rigging_weight_lb, type: integer, source: computed, default: 0, description: "SUM of RiggingGear.weight_lb over GearAssignment rows on this plan whose status is ACTIVE" }
      - { name: total_load_lb, type: integer, source: computed, default: 0, description: "load_weight_lb plus rigging_weight_lb" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "total_load_lb divided by net_capacity_lb times 100, rounded half-up to 2 decimals" }
      - { name: lift_class, type: enum, source: computed, default: "NOT_CLASSIFIED", description: "Tiered classification written by configure", constraints: "NOT_CLASSIFIED | STANDARD | CRITICAL | ENGINEERED_CRITICAL" }
      - { name: bearing_variant, type: enum, source: computed, default: "NONE", description: "Which ground-bearing algorithm produced the currently stored bearing figures", constraints: "NONE | PROVISIONAL_SURVEY | FINAL_ENGINEERED" }
      - { name: per_outrigger_load_lb, type: number, source: computed, default: 0, description: "Vertical load carried by the governing outrigger under the active bearing_variant, rounded half-up to 2 decimals" }
      - { name: bearing_pressure_psf, type: number, source: computed, default: 0, description: "per_outrigger_load_lb divided by Crane.outrigger_pad_area_sqft, rounded half-up to 2 decimals" }
      - { name: matting_required, type: boolean, source: computed, default: false, description: "True when bearing_pressure_psf is strictly greater than Site.soil_bearing_capacity_psf" }
      - { name: mat_area_required_sqft, type: integer, source: computed, default: 0, description: "ceil(per_outrigger_load_lb / Site.soil_bearing_capacity_psf); 0 when matting_required is false" }
      - { name: mat_count, type: integer, source: computed, default: 0, description: "4 * ceil(mat_area_required_sqft / 32); 0 when matting_required is false" }
      - { name: allowable_wind_mph, type: integer, source: computed, default: 0, description: "Derated in-service wind limit for this pick; a WIND standby event at or above this value forces a wind hold" }
      - { name: escort_required, type: boolean, source: computed, default: false, description: "True when the assigned Crane.class_tons is greater than or equal to 200; false while no crane is assigned" }
      - { name: permit_required, type: boolean, source: computed, default: false, description: "road_closure_requested OR escort_required" }
      - { name: rigging_verified, type: boolean, source: computed, default: false, description: "True only while the plan has at least one ACTIVE GearAssignment and every one of them passed the sling-tension check at the most recent configure" }
      - { name: standby_hours_billable, type: number, source: computed, default: 0, description: "Merged CLOSED standby duration for this plan, rounded UP to the next 0.25 hour" }
      - { name: invoice_count, type: integer, source: computed, default: 0, description: "Count of Invoice rows whose lift_plan_id equals this LiftPlan.id, any status" }
      - { name: plan_status, type: enum, source: system, default: "DRAFT", description: "Readiness dimension of the parallel state machine", constraints: "DRAFT | SURVEYED | CONFIGURED | PENDING_ENGINEERING | APPROVED | RELEASED | CLOSED | CANCELLED" }
      - { name: field_status, type: enum, source: system, default: "NOT_MOBILIZED", description: "Operational dimension of the parallel state machine; evolves independently of plan_status once the plan is RELEASED", constraints: "NOT_MOBILIZED | MOBILIZED | LIFTING | WIND_HOLD | SECURED | DEMOBILIZED" }
      - { name: cancellation_reason, type: string, source: system, default: null, description: "Reason recorded by POST /lift-plans/{id}/cancel" }

  - name: GearAssignment
    parent: null
    common_fields: true
    fields:
      - { name: lift_plan_id, type: string, source: input, description: "FK -> LiftPlan.id; the plan this gear is committed to" }
      - { name: gear_id, type: string, source: input, description: "FK -> RiggingGear.id; the committed gear" }
      - { name: leg_count, type: integer, source: input, description: "Number of sling legs sharing the load", constraints: "integer between 1 and 4 inclusive" }
      - { name: sling_angle_deg, type: integer, source: input, description: "Horizontal sling angle in degrees; only the four tabulated angles are accepted", constraints: "one of 30 | 45 | 60 | 90" }
      - { name: load_angle_factor, type: number, source: computed, default: 0, description: "Tabulated factor for sling_angle_deg: 90 gives 1.000, 60 gives 1.155, 45 gives 1.414, 30 gives 2.000" }
      - { name: leg_tension_lb, type: integer, source: computed, default: 0, description: "Per-leg tension recomputed on every configure; 0 until the owning plan has been configured" }
      - { name: effective_wll_lb, type: integer, source: computed, default: 0, description: "Snapshot of RiggingGear.effective_wll_lb taken when this assignment was created" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE while committed; RELEASED when withdrawn by POST /gear-assignments/{id}/release; VOIDED when the gear was quarantined or retired underneath it", constraints: "ACTIVE | RELEASED | VOIDED" }

  - name: EngineeringReview
    parent: null
    common_fields: true
    fields:
      - { name: lift_plan_id, type: string, source: input, description: "FK -> LiftPlan.id; the critical lift under review" }
      - { name: author_personnel_id, type: string, source: input, description: "FK -> Personnel.id; the ENGINEER who prepared and submitted the analysis" }
      - { name: stamped_by_personnel_id, type: string, source: system, default: null, description: "FK -> Personnel.id; the ENGINEER who applied the stamp, null until STAMPED" }
      - { name: analysis_notes, type: string, source: input, description: "Engineering narrative submitted with the review" }
      - { name: revision_round, type: integer, source: system, default: 1, description: "Starts at 1; each accepted resubmit increments it; a resubmit that would carry it past 3 is refused and the review is auto-rejected" }
      - { name: change_request_note, type: string, source: system, default: null, description: "Note recorded by the most recent REQUEST_CHANGES decision" }
      - { name: decision_note, type: string, source: system, default: null, description: "Note recorded by the most recent STAMP or REJECT decision" }
      - { name: final_bearing_pressure_psf, type: number, source: computed, default: 0, description: "FINAL_ENGINEERED ground bearing pressure written onto this review and onto the LiftPlan at stamp time" }
      - { name: final_mat_count, type: integer, source: computed, default: 0, description: "FINAL_ENGINEERED mat count written at stamp time" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "Cyclic review lifecycle", constraints: "UNDER_REVIEW | CHANGES_REQUESTED | STAMPED | REJECTED | SUPERSEDED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: lift_plan_id, type: string, source: input, description: "FK -> LiftPlan.id; the plan this permit clears" }
      - { name: permit_type, type: enum, source: input, description: "Kind of authorization sought", constraints: "ROAD_CLOSURE | CRANE_PLACEMENT | OVERSIZE_ESCORT" }
      - { name: jurisdiction_code, type: string, source: input, description: "Authority the application is filed with; must equal the Site.jurisdiction_code of the plan's site at submit time" }
      - { name: escort_required, type: boolean, source: computed, default: false, description: "Snapshot of LiftPlan.escort_required taken at permit creation" }
      - { name: required_lead_days, type: integer, source: computed, default: 0, description: "Base lead days for permit_type (ROAD_CLOSURE 10, OVERSIZE_ESCORT 7, CRANE_PLACEMENT 3) plus 5 when escort_required" }
      - { name: permit_fee_cents, type: integer, source: computed, default: 0, description: "Base fee for permit_type (ROAD_CLOSURE 85000, OVERSIZE_ESCORT 45000, CRANE_PLACEMENT 25000) plus 60000 when escort_required" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Charged only when an APPROVED permit is voided by a plan cancellation; equals round_half_up(permit_fee_cents * 0.40), otherwise 0" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent submit" }
      - { name: decision_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent recorded agency decision" }
      - { name: agency_reference, type: string, source: system, default: null, description: "Agency tracking number recorded with the decision" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded with a DENY decision" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Permit lifecycle; DENIED and SUSPENDED both re-enter SUBMITTED through submit", constraints: "DRAFT | SUBMITTED | APPROVED | DENIED | SUSPENDED | VOIDED" }

  - name: StandbyEvent
    parent: null
    common_fields: true
    fields:
      - { name: lift_plan_id, type: string, source: input, description: "FK -> LiftPlan.id; the plan that was held" }
      - { name: cause, type: enum, source: input, description: "Why the crew stood by", constraints: "WIND | WEATHER | CUSTOMER_DELAY | SITE_ACCESS" }
      - { name: wind_speed_mph, type: number, source: input, default: 0, description: "Measured sustained wind speed in mph; only consulted when cause is WIND", constraints: "number >= 0" }
      - { name: started_at, type: datetime, source: input, description: "ISO 8601 UTC instant the standby clock started" }
      - { name: ended_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC instant recorded by POST /standby-events/{id}/close; must be strictly after started_at" }
      - { name: raw_duration_hours, type: number, source: computed, default: 0, description: "(ended_at - started_at) in hours rounded half-up to 4 decimals; 0 while OPEN" }
      - { name: forced_wind_hold, type: boolean, source: computed, default: false, description: "True when this event drove the plan's field_status from LIFTING to WIND_HOLD" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN until closed", constraints: "OPEN | CLOSED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: lift_plan_id, type: string, source: input, description: "FK -> LiftPlan.id; the job being billed" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; copied from LiftPlan.customer_id at creation" }
      - { name: billing_mode, type: enum, source: input, description: "Which billing algorithm applies", constraints: "HOURLY | LUMP_SUM" }
      - { name: on_site_hours, type: number, source: input, default: 0, description: "Portal-to-portal on-site hours claimed", constraints: "number >= 0" }
      - { name: travel_hours, type: number, source: input, default: 0, description: "Portal-to-portal travel hours claimed", constraints: "number >= 0" }
      - { name: travel_miles, type: number, source: input, default: 0, description: "Round-trip travel miles claimed", constraints: "number >= 0" }
      - { name: lump_sum_cents, type: integer, source: input, default: 0, description: "Agreed fixed price in cents; must be greater than 0 when billing_mode is LUMP_SUM and is ignored when billing_mode is HOURLY", constraints: "integer >= 0" }
      - { name: standby_hours_source, type: number, source: computed, default: 0, description: "Snapshot of LiftPlan.standby_hours_billable taken at invoice creation" }
      - { name: billable_hours, type: number, source: computed, default: 0, description: "HOURLY only: max(on_site_hours + travel_hours, 4.0); always 0 for LUMP_SUM" }
      - { name: regular_hours, type: number, source: computed, default: 0, description: "HOURLY only: min(billable_hours, 8.0)" }
      - { name: overtime_hours, type: number, source: computed, default: 0, description: "HOURLY only: max(billable_hours - 8.0, 0)" }
      - { name: line_regular_cents, type: integer, source: computed, default: 0, description: "Rounded line: round_half_up(regular_hours * Crane.hourly_rate_cents); 0 for LUMP_SUM" }
      - { name: line_overtime_cents, type: integer, source: computed, default: 0, description: "Rounded line: round_half_up(overtime_hours * Crane.hourly_rate_cents * 1.5); 0 for LUMP_SUM" }
      - { name: line_standby_cents, type: integer, source: computed, default: 0, description: "Rounded line over the mode-specific billable standby hours at 0.75 of the hourly rate" }
      - { name: line_travel_cents, type: integer, source: computed, default: 0, description: "Rounded line: round_half_up(travel_miles * 285)" }
      - { name: line_mobdemob_cents, type: integer, source: computed, default: 0, description: "Crane.mob_demob_cents for HOURLY; 0 for LUMP_SUM because mobilization is inside the fixed price" }
      - { name: line_lump_sum_cents, type: integer, source: computed, default: 0, description: "lump_sum_cents for LUMP_SUM; 0 for HOURLY" }
      - { name: line_permit_cancellation_cents, type: integer, source: computed, default: 0, description: "SUM of Permit.cancellation_fee_cents over VOIDED permits on this plan; non-zero only on the system-generated cancellation invoice" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of the SEVEN already-rounded line fields; the scaffold pins round-per-line-then-sum" }
      - { name: discount_pct, type: number, source: computed, default: 0, description: "Volume tier keyed on subtotal_cents BEFORE any surcharge" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * discount_pct)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, default: 0, description: "round_half_up((subtotal_cents - discount_cents) * 0.07)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents - discount_cents + fuel_surcharge_cents" }
      - { name: system_generated, type: boolean, source: computed, default: false, description: "True only for the cancellation invoice minted by the plan-cancel cascade" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Billing lifecycle", constraints: "DRAFT | ISSUED | DISPUTED | PAID | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
#   Six machines. LiftPlan carries TWO independent dimensions (parallel shape).
#   EngineeringReview, Permit, Crane and RiggingGear are cyclic.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- LiftPlan A
  - entity: LiftPlan
    dimension: plan_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:

      - from: DRAFT
        to: SURVEYED
        trigger: "POST /lift-plans/{id}/site-survey"
        actor: Dispatcher
        preconditions:
          - "plan_status == DRAFT"
        side_effects:
          - "Site.soil_bearing_capacity_psf := confirmed_soil_bearing_capacity_psf"
          - "Site.access_notes := access_notes; Site.mat_inventory_available := mat_inventory_available"
          - "Site.survey_status := SURVEYED; Site.last_surveyed_at := logical_now"
          - "increments LiftPlan.version by 1"

      - from: SURVEYED
        to: CONFIGURED
        trigger: "POST /lift-plans/{id}/configure when the resulting lift_class == STANDARD"
        actor: Dispatcher
        preconditions:
          - "plan_status IN {SURVEYED, CONFIGURED, PENDING_ENGINEERING}"
          - "expected_lift_plan_version == LiftPlan.version"
          - "Crane.status != OUT_OF_SERVICE"
          - "Personnel(operator_id).role_type == OPERATOR AND Personnel(rigger_id).role_type == RIGGER"
          - "at least one GearAssignment on this plan has status == ACTIVE"
          - "a LoadChartEntry exists for (crane_id, configuration, boom_length_ft) with radius_ft >= radius_ft requested"
          - "utilization_pct <= 100.00"
          - "every ACTIVE GearAssignment satisfies leg_tension_lb <= its effective_wll_lb"
          - "no crane effective-window conflict (see validations priority 15)"
          - "operator daily hour cap not exceeded (see validations priority 16)"
        side_effects:
          - "runs calculations.net_capacity_and_utilization -> chart_gross_capacity_lb, hoist_line_capacity_lb, net_capacity_lb, rigging_weight_lb, total_load_lb, utilization_pct"
          - "runs calculations.lift_class_determination -> lift_class = STANDARD"
          - "runs calculations.ground_bearing_pressure variant PROVISIONAL_SURVEY -> bearing_variant, per_outrigger_load_lb, bearing_pressure_psf, matting_required, mat_area_required_sqft, mat_count"
          - "runs calculations.allowable_wind_speed -> allowable_wind_mph"
          - "runs calculations.sling_leg_tension for every ACTIVE GearAssignment -> load_angle_factor, leg_tension_lb"
          - "escort_required := (Crane.class_tons >= 200); permit_required := road_closure_requested OR escort_required"
          - "rigging_verified := true"
          - "releases any previously reserved crane, then recomputes Crane.reserved_hours_total, Crane.active_plan_count and Crane.status for the newly assigned crane"
          - "recomputes Personnel(operator_id).peak_daily_assigned_hours"
          - "increments LiftPlan.version by 1"
        note: "Re-configuring an already CONFIGURED or PENDING_ENGINEERING plan is legal and supersedes the prior configuration."

      - from: SURVEYED
        to: PENDING_ENGINEERING
        trigger: "POST /lift-plans/{id}/configure when the resulting lift_class IN {CRITICAL, ENGINEERED_CRITICAL}"
        actor: Dispatcher
        preconditions:
          - "same preconditions as SURVEYED -> CONFIGURED"
        side_effects:
          - "identical calculation set to SURVEYED -> CONFIGURED, except lift_class resolves to CRITICAL or ENGINEERED_CRITICAL"
          - "any EngineeringReview on this plan with status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED} is moved to SUPERSEDED"
          - "increments LiftPlan.version by 1"
        note: "Divergent branch of the configure fork: the STANDARD branch skips engineering entirely, the CRITICAL branch requires a stamped EngineeringReview before APPROVED is reachable."

      - from: CONFIGURED
        to: APPROVED
        trigger: "POST /lift-plans/{id}/approve"
        actor: LiftDirector
        preconditions:
          - "plan_status == CONFIGURED"
          - "lift_class == STANDARD"
          - "rigging_verified == true"
        side_effects:
          - "increments LiftPlan.version by 1"

      - from: PENDING_ENGINEERING
        to: APPROVED
        trigger: "system event: EngineeringReview on this plan reaches STAMPED"
        actor: system
        preconditions:
          - "plan_status == PENDING_ENGINEERING"
        side_effects:
          - "runs calculations.ground_bearing_pressure variant FINAL_ENGINEERED and OVERWRITES bearing_variant, per_outrigger_load_lb, bearing_pressure_psf, matting_required, mat_area_required_sqft, mat_count"
          - "increments LiftPlan.version by 1"

      - from: APPROVED
        to: RELEASED
        trigger: "POST /lift-plans/{id}/release"
        actor: LiftDirector
        preconditions:
          - "plan_status == APPROVED"
          - "Crane.status != OUT_OF_SERVICE"
          - "every GearAssignment on this plan with status == ACTIVE references a RiggingGear whose status == SERVICEABLE"
          - "permit_required == false OR at least one Permit on this plan has status == APPROVED"
          - "Personnel(operator_id).certification_expires_on > LiftPlan.window_start"
          - "Personnel(operator_id).endorsement_class_tons >= Crane.class_tons"
          - "Personnel(rigger_id).rigger_level rank >= required rank for lift_class (STANDARD needs BASIC, CRITICAL needs ADVANCED, ENGINEERED_CRITICAL needs MASTER)"
          - "Customer.credit_hold == false"
        side_effects:
          - "increments LiftPlan.version by 1"

      - from: RELEASED
        to: CLOSED
        trigger: "system event: field_status reaches DEMOBILIZED"
        actor: system
        preconditions:
          - "plan_status == RELEASED"
          - "field_status transitions SECURED -> DEMOBILIZED"
        side_effects:
          - "recomputes Crane.reserved_hours_total, Crane.active_plan_count and Crane.status (the plan leaves the reserving set)"
          - "recomputes Personnel(operator_id).peak_daily_assigned_hours"
          - "increments LiftPlan.version by 1"

      - from: APPROVED
        to: CONFIGURED
        trigger: "system event: the assigned Crane becomes OUT_OF_SERVICE while field_status == NOT_MOBILIZED"
        actor: system
        preconditions:
          - "plan_status IN {APPROVED, RELEASED}"
          - "field_status == NOT_MOBILIZED"
        side_effects:
          - "every Permit on this plan whose status == APPROVED is moved to SUSPENDED"
          - "increments LiftPlan.version by 1"
        note: "Hop 2 of the crane-out-of-service cascade. The RELEASED -> CONFIGURED edge is the same rule with a different from-state."

      - from: RELEASED
        to: CONFIGURED
        trigger: "system event: the assigned Crane becomes OUT_OF_SERVICE while field_status == NOT_MOBILIZED"
        actor: system
        preconditions:
          - "plan_status == RELEASED"
          - "field_status == NOT_MOBILIZED"
        side_effects:
          - "every Permit on this plan whose status == APPROVED is moved to SUSPENDED"
          - "increments LiftPlan.version by 1"

      - from: CONFIGURED
        to: SURVEYED
        trigger: "system event: an ACTIVE GearAssignment on this plan is VOIDED because its gear left SERVICEABLE"
        actor: system
        preconditions:
          - "plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED}"
          - "field_status == NOT_MOBILIZED"
        side_effects:
          - "rigging_verified := false"
          - "lift_class := NOT_CLASSIFIED; utilization_pct := 0; net_capacity_lb := 0; chart_gross_capacity_lb := 0; hoist_line_capacity_lb := 0; total_load_lb := 0; rigging_weight_lb recomputed over the surviving ACTIVE assignments"
          - "bearing_variant := NONE; per_outrigger_load_lb := 0; bearing_pressure_psf := 0; matting_required := false; mat_area_required_sqft := 0; mat_count := 0"
          - "crane_id, operator_id and rigger_id are cleared to null; Crane.reserved_hours_total, Crane.active_plan_count and Crane.status recomputed"
          - "any EngineeringReview on this plan with status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED} is moved to SUPERSEDED"
          - "increments LiftPlan.version by 1"
        note: "Hop 3 of the gear-quarantine cascade; the EngineeringReview supersede is hop 4. Plans whose field_status is not NOT_MOBILIZED are deliberately left untouched (conditional cascade)."

      - from: PENDING_ENGINEERING
        to: SURVEYED
        trigger: "system event: an ACTIVE GearAssignment on this plan is VOIDED because its gear left SERVICEABLE"
        actor: system
        preconditions:
          - "plan_status == PENDING_ENGINEERING"
          - "field_status == NOT_MOBILIZED"
        side_effects:
          - "identical side-effect set to CONFIGURED -> SURVEYED"

      - from: APPROVED
        to: SURVEYED
        trigger: "system event: an ACTIVE GearAssignment on this plan is VOIDED because its gear left SERVICEABLE"
        actor: system
        preconditions:
          - "plan_status == APPROVED"
          - "field_status == NOT_MOBILIZED"
        side_effects:
          - "identical side-effect set to CONFIGURED -> SURVEYED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lift-plans/{id}/cancel"
        actor: Dispatcher | LiftDirector
        preconditions:
          - "plan_status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "cancellation_reason := reason"
          - "every ACTIVE GearAssignment on this plan is moved to RELEASED and each gear's committed_assignment_count is recomputed"
          - "Crane.reserved_hours_total, Crane.active_plan_count and Crane.status recomputed"
          - "increments LiftPlan.version by 1"

      - from: RELEASED
        to: CANCELLED
        trigger: "POST /lift-plans/{id}/cancel"
        actor: Dispatcher | LiftDirector
        preconditions:
          - "plan_status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "cancellation_reason := reason"
          - "every ACTIVE GearAssignment on this plan is moved to RELEASED and each gear's committed_assignment_count is recomputed"
          - "every EngineeringReview on this plan with status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED} is moved to SUPERSEDED"
          - "HOP 2: every Permit on this plan with status IN {SUBMITTED, APPROVED, SUSPENDED} is moved to VOIDED; a permit that was APPROVED at that instant also gets cancellation_fee_cents := round_half_up(permit_fee_cents * 0.40)"
          - "HOP 3: because at least one Permit was voided carrying cancellation_fee_cents > 0, the system mints exactly one Invoice for this plan with system_generated=true, billing_mode=LUMP_SUM, lump_sum_cents=0, line_permit_cancellation_cents := SUM of those fees, and moves it straight to ISSUED"
          - "HOP 4: because that Invoice reached ISSUED, Customer.open_receivable_cents and Customer.invoice_count are recomputed"
          - "Crane.reserved_hours_total, Crane.active_plan_count and Crane.status recomputed"
          - "increments LiftPlan.version by 1"
        note: "Depth-4 transitive cascade: LiftPlan -> Permit -> Invoice -> Customer. Each hop is caused by the preceding hop, not by the cancel call directly."

  # ---------------------------------------------------------------- LiftPlan B
  - entity: LiftPlan
    dimension: field_status
    initial_state: NOT_MOBILIZED
    terminal_states: [DEMOBILIZED]
    transitions:

      - from: NOT_MOBILIZED
        to: MOBILIZED
        trigger: "POST /lift-plans/{id}/field-status with action MOBILIZE"
        actor: Operator
        preconditions:
          - "field_status == NOT_MOBILIZED"
          - "plan_status == RELEASED"
          - "X-User-ID == LiftPlan.operator_id"
          - "Crane.status != OUT_OF_SERVICE"
        side_effects:
          - "Crane.status recomputed to IN_SERVICE"
          - "increments LiftPlan.version by 1"

      - from: MOBILIZED
        to: LIFTING
        trigger: "POST /lift-plans/{id}/field-status with action START_LIFT"
        actor: Operator
        preconditions:
          - "field_status == MOBILIZED"
          - "X-User-ID == LiftPlan.operator_id"
          - "no StandbyEvent on this plan has status == OPEN"
        side_effects:
          - "increments LiftPlan.version by 1"

      - from: LIFTING
        to: WIND_HOLD
        trigger: "system event: POST /standby-events opens an event on this plan"
        actor: system
        preconditions:
          - "field_status == LIFTING"
        side_effects:
          - "StandbyEvent.forced_wind_hold := true when cause == WIND"
          - "increments LiftPlan.version by 1"

      - from: WIND_HOLD
        to: LIFTING
        trigger: "POST /lift-plans/{id}/field-status with action RESUME"
        actor: Operator
        preconditions:
          - "field_status == WIND_HOLD"
          - "X-User-ID == LiftPlan.operator_id"
          - "no StandbyEvent on this plan has status == OPEN"
        side_effects:
          - "increments LiftPlan.version by 1"
        note: "LIFTING -> WIND_HOLD -> LIFTING is a genuine cycle and may repeat any number of times."

      - from: LIFTING
        to: SECURED
        trigger: "POST /lift-plans/{id}/field-status with action SECURE"
        actor: Operator
        preconditions:
          - "field_status == LIFTING"
          - "X-User-ID == LiftPlan.operator_id"
          - "no StandbyEvent on this plan has status == OPEN"
        side_effects:
          - "increments LiftPlan.version by 1"

      - from: SECURED
        to: DEMOBILIZED
        trigger: "POST /lift-plans/{id}/field-status with action DEMOBILIZE"
        actor: Operator
        preconditions:
          - "field_status == SECURED"
          - "X-User-ID == LiftPlan.operator_id"
        side_effects:
          - "plan_status RELEASED -> CLOSED (see the plan_status machine)"
          - "recomputes LiftPlan.standby_hours_billable from every CLOSED StandbyEvent on the plan"
          - "Crane.reserved_hours_total, Crane.active_plan_count and Crane.status recomputed"
          - "increments LiftPlan.version by 1"

  # -------------------------------------------------------- EngineeringReview
  - entity: EngineeringReview
    initial_state: UNDER_REVIEW
    terminal_states: [STAMPED, REJECTED, SUPERSEDED]
    transitions:

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /engineering-reviews/{id}/decision with action REQUEST_CHANGES"
        actor: Engineer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != author_personnel_id"
          - "Personnel(X-User-ID).role_type == ENGINEER"
        side_effects:
          - "change_request_note := note"
          - "increments EngineeringReview.version by 1"

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /engineering-reviews/{id}/resubmit"
        actor: Engineer
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "X-User-ID == author_personnel_id"
          - "revision_round < 3"
        side_effects:
          - "revision_round := revision_round + 1"
          - "analysis_notes := analysis_notes from the request"
          - "increments EngineeringReview.version by 1"
        note: "Cycle. A resubmit attempted while revision_round == 3 is refused with ERR_REVISION_LIMIT_EXCEEDED and the review is moved to REJECTED in the same request."

      - from: CHANGES_REQUESTED
        to: REJECTED
        trigger: "POST /engineering-reviews/{id}/resubmit when revision_round == 3"
        actor: Engineer
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "X-User-ID == author_personnel_id"
          - "revision_round == 3"
        side_effects:
          - "decision_note := 'revision limit exceeded'"
          - "the request still fails with ERR_REVISION_LIMIT_EXCEEDED (409) but the review is persisted as REJECTED"
          - "increments EngineeringReview.version by 1"

      - from: UNDER_REVIEW
        to: STAMPED
        trigger: "POST /engineering-reviews/{id}/decision with action STAMP"
        actor: Engineer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != author_personnel_id  (segregation of duties)"
          - "Personnel(X-User-ID).role_type == ENGINEER"
          - "LiftPlan(lift_plan_id).plan_status == PENDING_ENGINEERING"
        side_effects:
          - "stamped_by_personnel_id := X-User-ID; decision_note := note"
          - "runs calculations.ground_bearing_pressure variant FINAL_ENGINEERED; writes final_bearing_pressure_psf and final_mat_count on the review"
          - "cascades onto the LiftPlan: PENDING_ENGINEERING -> APPROVED and the FINAL_ENGINEERED bearing figures overwrite the PROVISIONAL_SURVEY ones"
          - "increments EngineeringReview.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /engineering-reviews/{id}/decision with action REJECT"
        actor: Engineer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != author_personnel_id"
          - "Personnel(X-User-ID).role_type == ENGINEER"
        side_effects:
          - "decision_note := note"
          - "increments EngineeringReview.version by 1"

      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system event: the owning LiftPlan is re-configured, demoted to SURVEYED, or cancelled"
        actor: system
        preconditions:
          - "status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED}"
        side_effects:
          - "increments EngineeringReview.version by 1"

      - from: STAMPED
        to: SUPERSEDED
        trigger: "system event: the owning LiftPlan is re-configured, demoted to SURVEYED, or cancelled"
        actor: system
        preconditions:
          - "status == STAMPED"
        side_effects:
          - "increments EngineeringReview.version by 1"
        note: "Hop 4 of the gear-quarantine cascade."

  # ------------------------------------------------------------------- Permit
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "status IN {DRAFT, DENIED, SUSPENDED}"
          - "Permit.jurisdiction_code == Site(LiftPlan(lift_plan_id).site_id).jurisdiction_code"
          - "LiftPlan.window_start - logical_now >= required_lead_days * 24 hours"
        side_effects:
          - "submitted_at := logical_now"
          - "increments Permit.version by 1"

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "status == DENIED"
          - "same jurisdiction and lead-time preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "denial_reason := null; submitted_at := logical_now"
          - "increments Permit.version by 1"
        note: "Cycle: DRAFT -> SUBMITTED -> DENIED -> SUBMITTED."

      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "status == SUSPENDED"
          - "same jurisdiction and lead-time preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "submitted_at := logical_now"
          - "increments Permit.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permits/{id}/record-decision with decision APPROVE"
        actor: Dispatcher
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decision_at := logical_now; agency_reference := agency_reference"
          - "increments Permit.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /permits/{id}/record-decision with decision DENY"
        actor: Dispatcher
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decision_at := logical_now; denial_reason := reason"
          - "increments Permit.version by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "system event: the plan's assigned Crane becomes OUT_OF_SERVICE and the plan is demoted out of APPROVED/RELEASED"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "increments Permit.version by 1"
        note: "Hop 3 of the crane-out-of-service cascade."

      - from: APPROVED
        to: VOIDED
        trigger: "system event: the owning LiftPlan is cancelled"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, APPROVED, SUSPENDED}"
        side_effects:
          - "cancellation_fee_cents := round_half_up(permit_fee_cents * 0.40) when the prior status was APPROVED, otherwise 0"
          - "increments Permit.version by 1"

      - from: SUBMITTED
        to: VOIDED
        trigger: "system event: the owning LiftPlan is cancelled"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "cancellation_fee_cents stays 0 because the permit had not been granted"
          - "increments Permit.version by 1"

  # -------------------------------------------------------------------- Crane
  - entity: Crane
    initial_state: AVAILABLE
    terminal_states: []
    transitions:

      - from: AVAILABLE
        to: RESERVED
        trigger: "system event: a LiftPlan configure assigns this crane"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "reserved_hours_total becomes greater than 0"
        side_effects:
          - "reserved_hours_total and active_plan_count recomputed"
          - "increments Crane.version by 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "system event: the last reserving LiftPlan is cancelled, closed, or demoted"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "reserved_hours_total becomes 0"
        side_effects:
          - "reserved_hours_total and active_plan_count recomputed"
          - "increments Crane.version by 1"
        note: "Cycle: AVAILABLE -> RESERVED -> AVAILABLE."

      - from: RESERVED
        to: IN_SERVICE
        trigger: "system event: a LiftPlan on this crane reaches field_status MOBILIZED"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "increments Crane.version by 1"

      - from: IN_SERVICE
        to: AVAILABLE
        trigger: "system event: the last LiftPlan on this crane reaches field_status DEMOBILIZED"
        actor: system
        preconditions:
          - "status == IN_SERVICE"
          - "no LiftPlan on this crane has field_status IN {MOBILIZED, LIFTING, WIND_HOLD, SECURED}"
          - "reserved_hours_total becomes 0"
        side_effects:
          - "increments Crane.version by 1"

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /cranes/{id}/out-of-service, or the logical clock reaching annual_inspection_expires_on"
        actor: SafetyManager | system
        preconditions:
          - "status IN {AVAILABLE, RESERVED}"
        side_effects:
          - "out_of_service_flag := true when the transition came from the endpoint"
          - "HOP 2: every LiftPlan on this crane with plan_status IN {APPROVED, RELEASED} and field_status == NOT_MOBILIZED is demoted to CONFIGURED"
          - "HOP 3: every Permit on those demoted plans whose status == APPROVED is moved to SUSPENDED"
          - "increments Crane.version by 1"
        note: "Depth-3 transitive cascade: Crane -> LiftPlan -> Permit."

      - from: RESERVED
        to: OUT_OF_SERVICE
        trigger: "POST /cranes/{id}/out-of-service"
        actor: SafetyManager
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "identical side-effect set to AVAILABLE -> OUT_OF_SERVICE"

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /cranes/{id}/return-to-service"
        actor: SafetyManager
        preconditions:
          - "status == OUT_OF_SERVICE"
          - "new_annual_inspection_expires_on > logical_now"
        side_effects:
          - "out_of_service_flag := false; annual_inspection_expires_on := new_annual_inspection_expires_on"
          - "status recomputed by the posture precedence, so a crane that still holds reservations lands on RESERVED instead of AVAILABLE"
          - "increments Crane.version by 1"

  # -------------------------------------------------------------- RiggingGear
  - entity: RiggingGear
    initial_state: DUE_INSPECTION
    terminal_states: [RETIRED]
    transitions:

      - from: DUE_INSPECTION
        to: SERVICEABLE
        trigger: "POST /gear-inspections with result PASS or REPAIR_PASS"
        actor: SafetyManager
        preconditions:
          - "status IN {DUE_INSPECTION, SERVICEABLE, QUARANTINED} (any non-RETIRED posture; a PASS or REPAIR_PASS recorded on already-SERVICEABLE gear is a legal re-inspection and leaves it SERVICEABLE)"
        side_effects:
          - "last_inspection_at := logical_now; next_inspection_due_at := last_inspection_at + inspection_interval_days"
          - "repair_count += 1 when result == REPAIR_PASS, which lowers effective_wll_lb by 5 percent per repair down to a 70 percent floor"
          - "increments RiggingGear.version by 1"

      - from: QUARANTINED
        to: SERVICEABLE
        trigger: "POST /gear-inspections with result REPAIR_PASS"
        actor: SafetyManager
        preconditions:
          - "status == QUARANTINED"
        side_effects:
          - "identical side-effect set to DUE_INSPECTION -> SERVICEABLE"
        note: "Cycle: SERVICEABLE -> QUARANTINED -> SERVICEABLE."

      - from: SERVICEABLE
        to: QUARANTINED
        trigger: "POST /gear-inspections with result FAIL"
        actor: SafetyManager
        preconditions:
          - "status IN {SERVICEABLE, DUE_INSPECTION, QUARANTINED} (any non-RETIRED posture)"
        side_effects:
          - "last_inspection_at := logical_now"
          - "HOP 2: every GearAssignment referencing this gear with status == ACTIVE is moved to VOIDED and committed_assignment_count is recomputed"
          - "HOP 3: every LiftPlan that owned one of those assignments and whose field_status == NOT_MOBILIZED is demoted to SURVEYED with rigging_verified := false"
          - "HOP 4: every EngineeringReview on those demoted plans with status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED} is moved to SUPERSEDED"
          - "increments RiggingGear.version by 1"
        note: "Depth-4 transitive cascade: RiggingGear -> GearAssignment -> LiftPlan -> EngineeringReview."

      - from: SERVICEABLE
        to: DUE_INSPECTION
        trigger: "system event: the logical clock reaches next_inspection_due_at"
        actor: system
        preconditions:
          - "status == SERVICEABLE"
          - "logical_now >= next_inspection_due_at"
        side_effects:
          - "no cascade; the gear simply stops being assignable and stops satisfying the release gate"

      - from: SERVICEABLE
        to: RETIRED
        trigger: "POST /rigging-gear/{id}/retire, or POST /gear-inspections with result RETIRE"
        actor: SafetyManager
        preconditions:
          - "status IN {DUE_INSPECTION, SERVICEABLE, QUARANTINED}"
        side_effects:
          - "every GearAssignment referencing this gear with status == ACTIVE is moved to VOIDED and committed_assignment_count is recomputed"
          - "every LiftPlan that owned one of those assignments and whose field_status == NOT_MOBILIZED is demoted to SURVEYED with rigging_verified := false"
          - "every EngineeringReview on those demoted plans with status IN {UNDER_REVIEW, CHANGES_REQUESTED, STAMPED} is moved to SUPERSEDED"
          - "increments RiggingGear.version by 1"

      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /rigging-gear/{id}/retire"
        actor: SafetyManager
        preconditions:
          - "status == QUARANTINED"
        side_effects:
          - "identical side-effect set to SERVICEABLE -> RETIRED"

  # ------------------------------------------------------------------ Invoice
  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:

      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "status == DRAFT"
          - "Customer.credit_hold == false"
        side_effects:
          - "Customer.open_receivable_cents += total_cents"
          - "increments Invoice.version by 1"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: Customer
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == Invoice.customer_id"
        side_effects:
          - "Customer.open_receivable_cents unchanged (DISPUTED remains inside the open set)"
          - "increments Invoice.version by 1"

      - from: DISPUTED
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "status == DISPUTED"
          - "Customer.credit_hold == false"
        side_effects:
          - "Customer.open_receivable_cents unchanged"
          - "increments Invoice.version by 1"
        note: "Cycle: ISSUED -> DISPUTED -> ISSUED."

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingClerk
        preconditions:
          - "status IN {ISSUED, DISPUTED}"
        side_effects:
          - "Customer.open_receivable_cents -= total_cents"
          - "increments Invoice.version by 1"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "status IN {DRAFT, ISSUED, DISPUTED}"
        side_effects:
          - "Customer.open_receivable_cents -= total_cents when the prior status was ISSUED or DISPUTED, and is left alone when the prior status was DRAFT"
          - "increments Invoice.version by 1"
        note: "Compensating action for DRAFT -> ISSUED: issue then void must leave Customer.open_receivable_cents at its pre-issue value exactly."

      - from: DRAFT
        to: VOIDED
        trigger: "system event: a newer Invoice is created for the same LiftPlan"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "increments Invoice.version by 1"
        note: "Create-with-supersede: the newest invoice for a plan retires any prior DRAFT invoice on that plan."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the ONLY mechanism)
# =============================================================================
concurrency_rules:

  - rule_id: plan-configure-stale-version
    parent_entity: LiftPlan
    write_endpoint: "POST /lift-plans/{id}/configure"
    occ_field: "expected_lift_plan_version"
    description: |
      Configuring a LiftPlan whose version has advanced since the client last read it is
      rejected. A configure legitimately supersedes the plan's prior configuration (releasing
      the old crane reservation and superseding any engineering review), so a writer holding a
      stale view would silently discard a configuration it never saw.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-plan-version
    parent_entity: LiftPlan
    write_endpoint: "POST /invoices"
    occ_field: "expected_lift_plan_version"
    description: |
      Creating an Invoice against a LiftPlan whose version has advanced since the client last
      read it is rejected. A new invoice legitimately supersedes any prior DRAFT invoice on the
      same plan, so a writer holding a stale view would void an invoice it never observed.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: gear-assign-stale-gear-version
    parent_entity: RiggingGear
    write_endpoint: "POST /gear-assignments"
    occ_field: "expected_gear_version"
    description: |
      Committing RiggingGear to a LiftPlan while holding a stale view of that gear is rejected.
      The gear's derate, inspection posture and committed_assignment_count all move its version,
      and the assignment snapshots effective_wll_lb, so a stale writer would freeze an obsolete
      working load limit onto the plan.
    error_id: ERR_STALE_GEAR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: net_capacity_and_utilization
    trigger: "POST /lift-plans/{id}/configure (both the SURVEYED -> CONFIGURED and SURVEYED -> PENDING_ENGINEERING branches)"
    algorithm: constraint_propagation
    formula: |
      # --- step 1: load chart CEILING lookup (order-sensitive, exact-then-ceiling) ---
      candidates = LoadChartEntry rows WHERE crane_id == LiftPlan.crane_id
                                         AND configuration == LiftPlan.configuration
                                         AND boom_length_ft == LiftPlan.boom_length_ft   # EXACT match, no interpolation
                                         AND radius_ft >= LiftPlan.radius_ft             # conservative ceiling
      if candidates is empty: raise ERR_LOAD_CHART_NO_ROW
      chart_row = the candidate with the SMALLEST radius_ft
                  tie-break (identical radius_ft, which the uniqueness constraint forbids but the
                  implementation must still order deterministically): created_at ASC
      chart_gross_capacity_lb = chart_row.gross_capacity_lb

      # --- step 2: nested min() over two independent capacity ceilings ---
      hoist_line_capacity_lb = Crane.max_line_pull_lb * LiftPlan.parts_of_line
      deductions_lb          = block_weight_lb + jib_weight_lb + aux_head_weight_lb
      net_capacity_lb        = min(chart_gross_capacity_lb, hoist_line_capacity_lb) - deductions_lb
      if net_capacity_lb <= 0: raise ERR_CAPACITY_EXCEEDED

      # --- step 3: load side ---
      rigging_weight_lb = SUM(RiggingGear.weight_lb) over GearAssignment rows
                          WHERE lift_plan_id == LiftPlan.id AND status == ACTIVE
      if that set is empty: raise ERR_NO_RIGGING_ASSIGNED
      total_load_lb = load_weight_lb + rigging_weight_lb

      # --- step 4: utilization ---
      utilization_pct = round_half_up(total_load_lb / net_capacity_lb * 100, 2)
      if utilization_pct > 100.00: raise ERR_CAPACITY_EXCEEDED
    input_set: "GearAssignment rows on the plan with status == ACTIVE only; RELEASED and VOIDED assignments contribute neither weight nor a tension check"
    constants:
      MAX_UTILIZATION_PCT: 100.00
    precision: "utilization_pct 2 decimal places, round_half_up; all lb quantities are integers"
    variants: []
    note: "Combinatorial mode (a): four inputs (chart row, line pull, parts of line, deduction sum) interacting through a nested min() and a conditional ceiling lookup."

  - name: lift_class_determination
    trigger: "POST /lift-plans/{id}/configure, immediately after net_capacity_and_utilization"
    algorithm: threshold
    formula: |
      base = "STANDARD"
      if utilization_pct >= 90.00: base = "ENGINEERED_CRITICAL"
      elif utilization_pct >= 75.00: base = "CRITICAL"

      categorical_forced = (LiftPlan.personnel_lift == true)
                        OR (LiftPlan.multi_crane == true)
                        OR (Site.over_water == true)
      proximity_forced   = (Site.proximity_to_energized_lines_ft < 20)

      if categorical_forced: lift_class = "ENGINEERED_CRITICAL"
      elif proximity_forced: lift_class = max(base, "CRITICAL")   # ranked NOT_CLASSIFIED < STANDARD < CRITICAL < ENGINEERED_CRITICAL
      else: lift_class = base
    input_set: "the plan's own flags plus its Site's over_water and proximity_to_energized_lines_ft"
    constants:
      CRITICAL_UTILIZATION_PCT: 75.00
      ENGINEERED_UTILIZATION_PCT: 90.00
      ENERGIZED_LINE_PROXIMITY_FT: 20
    precision: "comparisons are on the already-rounded utilization_pct, never on the unrounded quotient"
    variants: []
    note: "Boundary metric #1. utilization_pct == 75.00 exactly is CRITICAL; 74.99 is STANDARD. The comparison uses the ROUNDED value, so a raw quotient of 74.996 rounds to 75.00 and IS critical."

  - name: ground_bearing_pressure
    trigger: "POST /lift-plans/{id}/configure writes the PROVISIONAL_SURVEY variant; POST /engineering-reviews/{id}/decision with action STAMP overwrites it with the FINAL_ENGINEERED variant"
    algorithm: weighted_scoring
    formula: |
      total_vertical_load_lb = Crane.gross_weight_lb + Crane.counterweight_lb + LiftPlan.total_load_lb

      # variant-specific outrigger distribution (this is the ONLY divergence)
      if variant == "PROVISIONAL_SURVEY":
          per_outrigger_load_lb = round_half_up(total_vertical_load_lb / 4, 2)
      if variant == "FINAL_ENGINEERED":
          per_outrigger_load_lb = round_half_up(total_vertical_load_lb
                                                * WORST_CASE_OUTRIGGER_SHARE
                                                * DYNAMIC_FACTOR, 2)

      bearing_pressure_psf = round_half_up(per_outrigger_load_lb / Crane.outrigger_pad_area_sqft, 2)
      matting_required     = bearing_pressure_psf > Site.soil_bearing_capacity_psf      # STRICT greater-than
      if matting_required:
          mat_area_required_sqft = ceil(per_outrigger_load_lb / Site.soil_bearing_capacity_psf)
          mat_count              = 4 * ceil(mat_area_required_sqft / MAT_PANEL_AREA_SQFT)
      else:
          mat_area_required_sqft = 0
          mat_count              = 0
    input_set: "the crane's own weights plus the plan's total_load_lb and the site's soil_bearing_capacity_psf as most recently confirmed by a site survey"
    constants:
      WORST_CASE_OUTRIGGER_SHARE: 0.60
      DYNAMIC_FACTOR: 1.10
      MAT_PANEL_AREA_SQFT: 32
    precision: "per_outrigger_load_lb and bearing_pressure_psf 2 decimal places round_half_up; mat areas and counts are integer ceilings"
    variants:
      - name: PROVISIONAL_SURVEY
        when: "written at configure time, before any engineering stamp; bearing_variant := PROVISIONAL_SURVEY"
        difference: "assumes the machine sits level and all four outriggers share the vertical load equally (divide by 4), with no dynamic amplification"
      - name: FINAL_ENGINEERED
        when: "written when an EngineeringReview on the plan reaches STAMPED; bearing_variant := FINAL_ENGINEERED and the provisional figures are overwritten in place"
        difference: "assumes the governing outrigger carries 60 percent of the whole vertical load and applies a 1.10 dynamic/impact factor, so the same inputs yield a materially higher psf and a larger mat_count"
    note: "Dual-variant instance #1 — physical/geotechnical domain, on the LiftPlan+Site pair."

  - name: sling_leg_tension
    trigger: "POST /lift-plans/{id}/configure recomputes leg_tension_lb and load_angle_factor for every ACTIVE GearAssignment on the plan"
    algorithm: weighted_scoring
    formula: |
      load_angle_factor = LOAD_ANGLE_FACTORS[GearAssignment.sling_angle_deg]
      leg_tension_lb    = round_half_up(LiftPlan.total_load_lb / GearAssignment.leg_count
                                        * load_angle_factor, 0)
      if leg_tension_lb > GearAssignment.effective_wll_lb: raise ERR_SLING_WLL_EXCEEDED   # STRICT greater-than
    input_set: "every GearAssignment on the plan whose status == ACTIVE; the check is aggregate — a single violating leg fails the whole configure and no field on the plan is persisted"
    constants:
      LOAD_ANGLE_FACTORS: { 90: 1.000, 60: 1.155, 45: 1.414, 30: 2.000 }
    precision: "leg_tension_lb rounded half-up to a whole pound"
    variants: []

  - name: gear_effective_wll
    trigger: "recomputed on RiggingGear whenever POST /gear-inspections changes repair_count; snapshotted onto GearAssignment.effective_wll_lb at POST /gear-assignments"
    algorithm: decay_function
    formula: |
      derate_multiplier = max(1 - WLL_DERATE_PER_REPAIR * RiggingGear.repair_count, WLL_DERATE_FLOOR)
      effective_wll_lb  = floor(RiggingGear.rated_wll_lb * derate_multiplier)
    input_set: "RiggingGear.repair_count counts only GearInspection rows on that gear with result == REPAIR_PASS; PASS, FAIL and RETIRE inspections never move it"
    constants:
      WLL_DERATE_PER_REPAIR: 0.05
      WLL_DERATE_FLOOR: 0.70
    precision: "floor to a whole pound"
    variants: []
    note: "The floor bites at repair_count == 6 and never moves again; GearAssignment.effective_wll_lb is a SNAPSHOT, so a later repair does not retroactively change an existing assignment's stored limit."

  - name: allowable_wind_speed
    trigger: "POST /lift-plans/{id}/configure writes LiftPlan.allowable_wind_mph"
    algorithm: tiered_pricing
    formula: |
      if LiftPlan.load_weight_lb == 0: sail_area_ratio = 0.00
      else: sail_area_ratio = round_half_up(LiftPlan.sail_area_sqft * 1000 / LiftPlan.load_weight_lb, 2)

      if   sail_area_ratio <= 1.00: derate = 1.00
      elif sail_area_ratio <= 2.00: derate = 0.85
      elif sail_area_ratio <= 3.00: derate = 0.70
      else:                          derate = 0.55

      allowable_wind_mph = floor(Crane.rated_max_wind_mph * derate)
    input_set: "the plan's own sail_area_sqft and load_weight_lb plus the assigned crane's rated_max_wind_mph"
    constants:
      WIND_DERATE_TIERS: "ratio <= 1.00 -> 1.00 | <= 2.00 -> 0.85 | <= 3.00 -> 0.70 | > 3.00 -> 0.55"
    precision: "sail_area_ratio 2 decimals round_half_up; allowable_wind_mph floored to a whole mph"
    variants: []
    note: "Tier selection uses the ROUNDED ratio, so a raw ratio of 2.004 rounds to 2.00 and stays in the 0.85 tier."

  - name: standby_interval_merge
    trigger: "POST /standby-events/{id}/close and the SECURED -> DEMOBILIZED field transition both recompute LiftPlan.standby_hours_billable"
    algorithm: interval_merge
    formula: |
      intervals = [ [started_at, ended_at) for every StandbyEvent on this plan with status == CLOSED ]
      sort intervals by started_at ASC, tie-break created_at ASC
      merge two neighbours when next.started_at <= current.ended_at      # zero-gap ADJACENCY merges
      merged_hours = SUM over merged intervals of (end - start) in hours, rounded half-up to 4 decimals
      standby_hours_billable = ceil(merged_hours / STANDBY_ROUNDING_INCREMENT_HOURS)
                               * STANDBY_ROUNDING_INCREMENT_HOURS
    input_set: "CLOSED StandbyEvents only; an OPEN event contributes nothing until it is closed. Every cause value (WIND, WEATHER, CUSTOMER_DELAY, SITE_ACCESS) is included."
    constants:
      STANDBY_ROUNDING_INCREMENT_HOURS: 0.25
    precision: "merged_hours 4 decimals round_half_up, then rounded UP to the next 0.25 hour"
    variants: []
    note: "Interval semantics: half-open [start, end) with ADJACENCY (gap == 0) merging. Contrast with the crane reservation rule, which is half-open plus a trailing buffer."

  - name: crane_reserved_hours
    trigger: "recomputed on the assigned Crane by every configure, cancel, demobilize and gear-quarantine demotion"
    algorithm: aggregation
    formula: |
      reserving_plans = LiftPlan rows WHERE crane_id == Crane.id
                                        AND plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED}
      reserved_hours_total = round_half_up(SUM over reserving_plans of
                                           (window_end - window_start) in hours, 2)
      active_plan_count    = COUNT(reserving_plans)
    input_set: "plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED}; DRAFT, SURVEYED, CLOSED and CANCELLED plans are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "Conserved quantity #1 (reservation hours). configure then cancel MUST return reserved_hours_total to its exact pre-configure value."

  - name: operator_daily_hours
    trigger: "evaluated during POST /lift-plans/{id}/configure and written back to Personnel.peak_daily_assigned_hours"
    algorithm: aggregation
    formula: |
      candidate_plans = LiftPlan rows WHERE operator_id == Personnel.id
                                        AND plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED}
      for each UTC calendar day D touched by any candidate plan:
          day_open  = D at 00:00:00Z          # CLOSED lower boundary
          day_close = D at 24:00:00Z          # OPEN upper boundary
          day_hours[D] = SUM over candidate_plans of
                         max(0, min(window_end, day_close) - max(window_start, day_open)) in hours
      peak_daily_assigned_hours = round_half_up(max(day_hours.values(), default 0), 2)
      if any day_hours[D] > OPERATOR_DAILY_HOUR_CAP: raise ERR_OPERATOR_HOURS_EXCEEDED   # STRICT greater-than
    input_set: "same status filter as crane_reserved_hours; a plan spanning midnight contributes only its CLIPPED portion to each day"
    constants:
      OPERATOR_DAILY_HOUR_CAP: 12.0
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "Interval semantics: aggregate per-day capacity over CLIPPED windows on a [00:00, 24:00) day. Two plans that never overlap each other can still be rejected together."

  - name: invoice_line_rounding
    trigger: "POST /invoices computes every line field, billable_hours, regular_hours, overtime_hours and subtotal_cents"
    algorithm: waterfall_allocation
    formula: |
      rate = Crane.hourly_rate_cents of the plan's assigned crane
      standby_source = LiftPlan.standby_hours_billable   # snapshotted as Invoice.standby_hours_source

      if billing_mode == "HOURLY":
          billable_hours  = max(on_site_hours + travel_hours, MINIMUM_BILLABLE_HOURS)
          regular_hours   = min(billable_hours, REGULAR_HOURS_PER_DAY)
          overtime_hours  = max(billable_hours - REGULAR_HOURS_PER_DAY, 0)
          standby_billable_hours = standby_source                       # no free allowance
          line_regular_cents   = round_half_up(regular_hours  * rate)
          line_overtime_cents  = round_half_up(overtime_hours * rate * OVERTIME_MULTIPLIER)
          line_mobdemob_cents  = Crane.mob_demob_cents
          line_lump_sum_cents  = 0
      else:  # LUMP_SUM
          billable_hours = 0 ; regular_hours = 0 ; overtime_hours = 0
          standby_billable_hours = max(standby_source - FREE_STANDBY_HOURS, 0)
          line_regular_cents  = 0
          line_overtime_cents = 0
          line_mobdemob_cents = 0                                        # mobilization is inside the fixed price
          line_lump_sum_cents = lump_sum_cents

      line_standby_cents = round_half_up(standby_billable_hours * rate * STANDBY_MULTIPLIER)
      line_travel_cents  = round_half_up(travel_miles * MILEAGE_RATE_CENTS_PER_MILE)
      line_permit_cancellation_cents = SUM(Permit.cancellation_fee_cents) over Permits on this plan
                                       with status == VOIDED

      # PINNED ORDER: round EACH of the seven lines to whole cents FIRST, THEN sum.
      # Summing the unrounded lines and rounding once at the end is WRONG and is off by
      # one cent on the canonical fixture (945546 vs 945545).
      subtotal_cents = line_regular_cents + line_overtime_cents + line_standby_cents
                     + line_travel_cents + line_mobdemob_cents + line_lump_sum_cents
                     + line_permit_cancellation_cents
    input_set: "hours and miles come from the request body; standby hours come from the plan's merged CLOSED standby events; the rate and mob/demob come from the plan's assigned crane"
    constants:
      MINIMUM_BILLABLE_HOURS: 4.0
      REGULAR_HOURS_PER_DAY: 8.0
      OVERTIME_MULTIPLIER: 1.5
      STANDBY_MULTIPLIER: 0.75
      FREE_STANDBY_HOURS: 2.0
      MILEAGE_RATE_CENTS_PER_MILE: 285
    precision: "each line independently rounded half-up to whole cents, then summed"
    variants:
      - name: HOURLY
        when: "billing_mode == HOURLY"
        difference: "portal-to-portal hours with a 4.0 hour minimum, 1.5x overtime past 8.0 hours, mobilization billed separately, and NO free standby allowance"
      - name: LUMP_SUM
        when: "billing_mode == LUMP_SUM"
        difference: "fixed price replaces every hour line, mobilization is absorbed, and the first 2.0 standby hours are free — the same job data therefore produces a different subtotal and total"
    note: "Dual-variant instance #2 — financial domain, on the Invoice entity. Also combinatorial mode (b): the rounding ORDER is pinned and observable."

  - name: invoice_discount_and_surcharge_order
    trigger: "POST /invoices, immediately after invoice_line_rounding produces subtotal_cents"
    algorithm: tiered_pricing
    formula: |
      # The tier and the surcharge look mutually dependent — the surcharge is charged on the
      # DISCOUNTED subtotal, while the discount tier is a function of "the bill". The scaffold
      # pins the evaluation order so the value is well defined:
      #
      #   step 1  subtotal_cents                       (from invoice_line_rounding)
      #   step 2  discount_pct = tier(subtotal_cents)  <-- keyed on the PRE-surcharge subtotal
      #   step 3  discount_cents = round_half_up(subtotal_cents * discount_pct)
      #   step 4  fuel_surcharge_cents = round_half_up((subtotal_cents - discount_cents) * 0.07)
      #   step 5  total_cents = subtotal_cents - discount_cents + fuel_surcharge_cents
      #
      # Keying the tier on (subtotal + surcharge) instead is WRONG and changes the answer
      # whenever the surcharge alone carries the bill across a tier boundary.
      if   subtotal_cents >= 6000000: discount_pct = 0.08
      elif subtotal_cents >= 2500000: discount_pct = 0.05
      elif subtotal_cents >= 1000000: discount_pct = 0.02
      else:                            discount_pct = 0.00
      discount_cents       = round_half_up(subtotal_cents * discount_pct)
      fuel_surcharge_cents = round_half_up((subtotal_cents - discount_cents) * FUEL_SURCHARGE_PCT)
      total_cents          = subtotal_cents - discount_cents + fuel_surcharge_cents
    input_set: "subtotal_cents only; no other entity participates"
    constants:
      FUEL_SURCHARGE_PCT: 0.07
      DISCOUNT_TIER_1_CENTS: 1000000
      DISCOUNT_TIER_2_CENTS: 2500000
      DISCOUNT_TIER_3_CENTS: 6000000
    precision: "whole cents, round_half_up, applied at step 3 and step 4 independently"
    variants: []
    note: "Combinatorial mode (c): circular-looking fee/discount dependency resolved by an explicitly pinned evaluation order."

  - name: permit_fee_and_lead_days
    trigger: "POST /permits writes escort_required, required_lead_days and permit_fee_cents"
    algorithm: tiered_pricing
    formula: |
      escort_required     = LiftPlan.escort_required        # snapshot; true when Crane.class_tons >= 200
      base_lead_days      = { ROAD_CLOSURE: 10, OVERSIZE_ESCORT: 7, CRANE_PLACEMENT: 3 }[permit_type]
      required_lead_days  = base_lead_days + (ESCORT_LEAD_DAYS_ADDER if escort_required else 0)
      base_fee_cents      = { ROAD_CLOSURE: 85000, OVERSIZE_ESCORT: 45000, CRANE_PLACEMENT: 25000 }[permit_type]
      permit_fee_cents    = base_fee_cents + (ESCORT_FEE_CENTS if escort_required else 0)
      cancellation_fee_cents = 0 at creation; set to round_half_up(permit_fee_cents * PERMIT_CANCELLATION_PCT)
                               only when an APPROVED permit is voided by a plan cancellation
    input_set: "permit_type from the request body plus the owning plan's escort_required snapshot"
    constants:
      ESCORT_LEAD_DAYS_ADDER: 5
      ESCORT_FEE_CENTS: 60000
      ESCORT_CLASS_TONS_THRESHOLD: 200
      PERMIT_CANCELLATION_PCT: 0.40
    precision: "whole cents, round_half_up; lead days are whole days compared as required_lead_days * 24 hours"
    variants: []

  - name: customer_open_receivable
    trigger: "recomputed on Customer by every Invoice status change (issue, dispute, pay, void, and the cancellation invoice minted by a plan cancel)"
    algorithm: aggregation
    formula: |
      open_receivable_cents = SUM(Invoice.total_cents) over Invoice rows
                              WHERE customer_id == Customer.id AND status IN {ISSUED, DISPUTED}
      invoice_count         = COUNT(Invoice rows WHERE customer_id == Customer.id)   # any status
    input_set: "status IN {ISSUED, DISPUTED} only; DRAFT, PAID and VOIDED invoices are excluded from the open receivable but still counted by invoice_count"
    constants: {}
    precision: "whole cents"
    variants: []
    note: "Conserved quantity #2 (money). issue then void MUST return open_receivable_cents to its exact pre-issue value, with invoice_count left at its post-create value."

# =============================================================================
# §1.4 Validation Rules Table (evaluated STRICTLY in ascending priority order;
#      the FIRST rule that fails determines the response error_id and status)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of Dispatcher, LiftDirector, Engineer, Operator, SafetyManager, BillingClerk, Customer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The supplied role appears in the §1.5 roles list of the endpoint being called"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id embedded in the URL path resolves to a stored row, validated left-to-right"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_CRANE_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_GEAR_NOT_FOUND | ERR_LIFT_PLAN_NOT_FOUND | ERR_GEAR_ASSIGNMENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_STANDBY_EVENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_SITE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 5
    category: business_constraint
    check: "Request body schema: every required field present; types correct; enum members legal; leg_count between 1 and 4; sling_angle_deg in {30,45,60,90}; hours and miles >= 0; soil_bearing_capacity_psf > 0; parts_of_line >= 1; pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints and every list endpoint's query parameters"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_CRANE_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_GEAR_NOT_FOUND | ERR_LIFT_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sites, POST /load-chart-entries, POST /gear-inspections, POST /lift-plans, POST /lift-plans/{id}/configure, POST /gear-assignments, POST /engineering-reviews, POST /permits, POST /standby-events, POST /invoices"

  - priority: 7
    category: auth
    check: "entity_backed identity and segregation of duties: a Customer caller's X-User-ID equals the resource's customer_id; an Operator caller's X-User-ID equals LiftPlan.operator_id; an Engineer stamping, requesting changes on, or rejecting a review has X-User-ID different from that review's author_personnel_id, and an Engineer resubmitting has X-User-ID equal to it"
    error_id: "ERR_CUSTOMER_SCOPE_VIOLATION | ERR_NOT_ASSIGNED_OPERATOR | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "GET /customers/{id}, GET /invoices/{id}, POST /invoices/{id}/dispute, POST /lift-plans/{id}/field-status, POST /engineering-reviews/{id}/decision, POST /engineering-reviews/{id}/resubmit"

  - priority: 8
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version (optimistic concurrency, §1.2.1)"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_GEAR_VERSION"
    http_status: 412
    applies_to: "POST /lift-plans/{id}/configure, POST /invoices, POST /gear-assignments"

  - priority: 9
    category: state
    check: "The target resource's own current state is a declared `from:` state for the requested transition"
    error_id: "ERR_INVALID_PLAN_STATE | ERR_INVALID_FIELD_STATE | ERR_INVALID_GEAR_STATE | ERR_INVALID_REVIEW_STATE | ERR_INVALID_PERMIT_STATE | ERR_INVALID_INVOICE_STATE"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 10
    category: state
    check: "Cross-entity state gates: the assigned Crane is not OUT_OF_SERVICE; every ACTIVE GearAssignment's gear is SERVICEABLE; a permit-requiring plan has an APPROVED Permit; a review may only be stamped while its LiftPlan is PENDING_ENGINEERING; gear may only be assigned while its status is SERVICEABLE"
    error_id: "ERR_CRANE_OUT_OF_SERVICE | ERR_GEAR_NOT_SERVICEABLE | ERR_PERMIT_NOT_APPROVED | ERR_PLAN_NOT_PENDING_ENGINEERING"
    http_status: 409
    applies_to: "POST /lift-plans/{id}/configure, POST /lift-plans/{id}/release, POST /lift-plans/{id}/field-status, POST /gear-assignments, POST /engineering-reviews/{id}/decision"

  - priority: 11
    category: business_safety
    check: "Personnel discriminator match: operator_id references role_type OPERATOR, rigger_id references role_type RIGGER, author_personnel_id references role_type ENGINEER"
    error_id: ERR_PERSONNEL_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /lift-plans/{id}/configure, POST /engineering-reviews"

  - priority: 12
    category: business_safety
    check: "Certification and qualification at release: Personnel(operator_id).certification_expires_on is strictly after LiftPlan.window_start; endorsement_class_tons >= Crane.class_tons; Personnel(rigger_id).rigger_level rank is at least the rank the lift_class demands (STANDARD needs BASIC, CRITICAL needs ADVANCED, ENGINEERED_CRITICAL needs MASTER)"
    error_id: "ERR_OPERATOR_CERT_EXPIRED | ERR_OPERATOR_ENDORSEMENT_INSUFFICIENT | ERR_RIGGER_QUALIFICATION_INSUFFICIENT"
    http_status: 422
    applies_to: "POST /lift-plans/{id}/release"

  - priority: 13
    category: business_safety
    check: "Rigging and capacity at configure: at least one ACTIVE GearAssignment exists; a load-chart row satisfies the ceiling lookup; utilization_pct <= 100.00 and net_capacity_lb > 0; every ACTIVE assignment's leg_tension_lb <= its effective_wll_lb"
    error_id: "ERR_NO_RIGGING_ASSIGNED | ERR_LOAD_CHART_NO_ROW | ERR_CAPACITY_EXCEEDED | ERR_SLING_WLL_EXCEEDED"
    http_status: 422
    applies_to: "POST /lift-plans/{id}/configure"

  - priority: 14
    category: business_safety
    check: "A StandbyEvent whose cause is WIND is only accepted when wind_speed_mph >= LiftPlan.allowable_wind_mph; causes other than WIND skip this check entirely"
    error_id: ERR_WIND_BELOW_HOLD_THRESHOLD
    http_status: 422
    applies_to: "POST /standby-events"

  - priority: 15
    category: business_constraint
    check: "Crane effective-window exclusivity: the new plan's [window_start, window_end) must not intersect [other.window_start, other.window_end + 12 hours) for any other LiftPlan on the same crane with plan_status IN {CONFIGURED, PENDING_ENGINEERING, APPROVED, RELEASED}"
    error_id: ERR_CRANE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lift-plans/{id}/configure"

  - priority: 16
    category: business_constraint
    check: "Operator daily hour cap: for every UTC calendar day, the clipped assigned hours summed across the operator's reserving plans must not exceed 12.0 (strict greater-than rejects)"
    error_id: ERR_OPERATOR_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /lift-plans/{id}/configure"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: RiggingGear.gear_tag is globally unique; (crane_id, configuration, boom_length_ft, radius_ft) is unique across LoadChartEntry; a LiftPlan may hold at most one non-terminal GearAssignment per gear (status ACTIVE)"
    error_id: "ERR_DUPLICATE_GEAR_TAG | ERR_DUPLICATE_CHART_ROW | ERR_DUPLICATE_GEAR_ASSIGNMENT"
    http_status: 409
    applies_to: "POST /rigging-gear, POST /load-chart-entries, POST /gear-assignments"

  - priority: 18
    category: business_referential
    check: "Permit.jurisdiction_code equals the jurisdiction_code of the Site owning the permit's LiftPlan"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /permits/{id}/submit"

  - priority: 19
    category: business_temporal
    check: "Permit lead time: LiftPlan.window_start minus the logical clock is at least required_lead_days * 24 hours (inclusive at exactly the lead time)"
    error_id: ERR_PERMIT_LEAD_TIME_SHORT
    http_status: 422
    applies_to: "POST /permits/{id}/submit"

  - priority: 20
    category: business_temporal
    check: "Lift window sanity: window_end is strictly after window_start, and window_start is at or after the logical clock"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /lift-plans"

  - priority: 21
    category: business_constraint
    check: "EngineeringReview revision limit: a resubmit is refused once revision_round has reached 3, and the review is persisted as REJECTED in the same request"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /engineering-reviews/{id}/resubmit"

  - priority: 22
    category: business_fiscal
    check: "The owning Customer.credit_hold is false"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /lift-plans/{id}/release, POST /invoices/{id}/issue"

  - priority: 23
    category: business_fiscal
    check: "billing_mode LUMP_SUM requires lump_sum_cents strictly greater than 0"
    error_id: ERR_LUMP_SUM_REQUIRED
    http_status: 422
    applies_to: "POST /invoices"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology; every collection is top-level)
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ Customer
  - method: POST
    path: "/customers"
    description: "Register a lift customer account"
    roles: [Dispatcher]
    code: 201
    input: [account_name, "billing_terms?"]
    output: Customer
    side_effects: ["credit_hold=false, open_receivable_cents=0, invoice_count=0, version=1"]

  - method: GET
    path: "/customers/{id}"
    description: "Read one customer; a Customer caller may only read its own row"
    roles: [Dispatcher, LiftDirector, BillingClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers, paginated"
    roles: [Dispatcher, LiftDirector, BillingClerk]
    code: 200
    input: ["credit_hold?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/credit-status"
    description: "Place the account on credit hold or clear the hold"
    roles: [BillingClerk]
    code: 200
    input: [credit_hold, "reason?"]
    output: Customer
    side_effects: ["sets credit_hold and credit_hold_reason", "increments Customer.version by 1"]

  # ---------------------------------------------------------------------- Site
  - method: POST
    path: "/sites"
    description: "Register a lift site under a customer"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, address_label, jurisdiction_code, soil_bearing_capacity_psf, "proximity_to_energized_lines_ft?", "over_water?"]
    output: Site
    side_effects: ["survey_status=NOT_SURVEYED, mat_inventory_available=false"]

  - method: GET
    path: "/sites/{id}"
    description: "Read one site"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager, Customer]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites"
    description: "List sites, optionally filtered by owning customer"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["customer_id?", "survey_status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  # --------------------------------------------------------------------- Crane
  - method: POST
    path: "/cranes"
    description: "Register a crane in the fleet"
    roles: [Dispatcher]
    code: 201
    input: [model_code, class_tons, gross_weight_lb, counterweight_lb, outrigger_pad_area_sqft, max_line_pull_lb, rated_max_wind_mph, annual_inspection_expires_on, mob_demob_cents, hourly_rate_cents]
    output: Crane
    side_effects: ["status=AVAILABLE, out_of_service_flag=false, reserved_hours_total=0, active_plan_count=0"]

  - method: GET
    path: "/cranes/{id}"
    description: "Read one crane including its derived posture and reservation ledger"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager, BillingClerk]
    code: 200
    input: []
    output: Crane
    side_effects: []

  - method: GET
    path: "/cranes"
    description: "List cranes, optionally filtered by derived status"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Crane[]
    side_effects: []

  - method: POST
    path: "/cranes/{id}/out-of-service"
    description: "Pull a crane out of service; triggers the depth-3 Crane -> LiftPlan -> Permit cascade"
    roles: [SafetyManager]
    code: 200
    input: [reason]
    output: Crane
    side_effects:
      - "out_of_service_flag=true and status recomputed to OUT_OF_SERVICE"
      - "HOP 2: APPROVED/RELEASED plans on this crane with field_status NOT_MOBILIZED demote to CONFIGURED"
      - "HOP 3: APPROVED permits on those plans move to SUSPENDED"
      - "recomputes reserved_hours_total and active_plan_count"
      - "increments Crane.version by 1"

  - method: POST
    path: "/cranes/{id}/return-to-service"
    description: "Return a crane to service with a fresh annual inspection date"
    roles: [SafetyManager]
    code: 200
    input: [new_annual_inspection_expires_on]
    output: Crane
    side_effects: ["out_of_service_flag=false; annual_inspection_expires_on updated; status recomputed by the posture precedence", "increments Crane.version by 1"]

  # ----------------------------------------------------------- LoadChartEntry
  - method: POST
    path: "/load-chart-entries"
    description: "Add one row to a crane's load chart"
    roles: [Dispatcher]
    code: 201
    input: [crane_id, configuration, boom_length_ft, radius_ft, gross_capacity_lb]
    output: LoadChartEntry
    side_effects: ["immutable once created; no update or delete endpoint exists"]

  - method: GET
    path: "/cranes/{id}/load-chart-entries"
    description: "List every charted row for one crane (FK reverse-reachability for LoadChartEntry.crane_id)"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["configuration?", "boom_length_ft?", "limit?", "offset?"]
    output: LoadChartEntry[]
    side_effects: []

  # ----------------------------------------------------------------- Personnel
  - method: POST
    path: "/personnel"
    description: "Register an operator, rigger or engineer"
    roles: [Dispatcher]
    code: 201
    input: [full_name, role_type, certification_number, certification_expires_on, "endorsement_class_tons?", "rigger_level?", "pe_license_state?"]
    output: Personnel
    side_effects: ["status derived from the logical clock against certification_expires_on", "peak_daily_assigned_hours=0"]

  - method: GET
    path: "/personnel/{id}"
    description: "Read one person including derived certification status and peak daily hours"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  - method: GET
    path: "/personnel"
    description: "List personnel, optionally filtered by discriminator or derived status"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["role_type?", "status?", "limit?", "offset?"]
    output: Personnel[]
    side_effects: []

  - method: POST
    path: "/personnel/{id}/certifications"
    description: "Record a recertification, refreshing the expiry, endorsement and rigger ladder"
    roles: [Dispatcher]
    code: 200
    input: [certification_number, certification_expires_on, "endorsement_class_tons?", "rigger_level?"]
    output: Personnel
    side_effects: ["status recomputed against the logical clock", "increments Personnel.version by 1"]

  # --------------------------------------------------------------- RiggingGear
  - method: POST
    path: "/rigging-gear"
    description: "Register a piece of rigging gear; it starts DUE_INSPECTION and cannot be assigned until it passes an inspection"
    roles: [SafetyManager]
    code: 201
    input: [gear_tag, gear_type, rated_wll_lb, weight_lb, "inspection_interval_days?"]
    output: RiggingGear
    side_effects: ["status=DUE_INSPECTION, repair_count=0, effective_wll_lb=rated_wll_lb, committed_assignment_count=0"]

  - method: GET
    path: "/rigging-gear/{id}"
    description: "Read one gear item including its derate, inspection posture and commitment ledger"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager]
    code: 200
    input: []
    output: RiggingGear
    side_effects: []

  - method: GET
    path: "/rigging-gear"
    description: "List rigging gear, optionally filtered by posture or family"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["status?", "gear_type?", "limit?", "offset?"]
    output: RiggingGear[]
    side_effects: []

  - method: POST
    path: "/rigging-gear/{id}/retire"
    description: "Permanently retire a gear item and void every ACTIVE assignment that held it"
    roles: [SafetyManager]
    code: 200
    input: [reason]
    output: RiggingGear
    side_effects:
      - "status=RETIRED (terminal)"
      - "ACTIVE GearAssignments referencing it move to VOIDED; committed_assignment_count recomputed"
      - "owning LiftPlans with field_status NOT_MOBILIZED demote to SURVEYED with rigging_verified=false"
      - "EngineeringReviews on those plans move to SUPERSEDED"
      - "increments RiggingGear.version by 1"

  # ------------------------------------------------------------- GearInspection
  - method: POST
    path: "/gear-inspections"
    description: "Record a periodic or for-cause gear inspection; a FAIL result launches the depth-4 cascade"
    roles: [SafetyManager]
    code: 201
    input: [gear_id, result, inspector_note]
    output: GearInspection
    side_effects:
      - "RiggingGear.last_inspection_at=logical_now; next_inspection_due_at recomputed"
      - "PASS/REPAIR_PASS -> SERVICEABLE (REPAIR_PASS also increments repair_count and re-runs gear_effective_wll); FAIL -> QUARANTINED; RETIRE -> RETIRED"
      - "HOP 2 (FAIL/RETIRE): ACTIVE GearAssignments on this gear move to VOIDED"
      - "HOP 3: their LiftPlans with field_status NOT_MOBILIZED demote to SURVEYED"
      - "HOP 4: EngineeringReviews on those plans move to SUPERSEDED"
      - "increments RiggingGear.version by 1"

  - method: GET
    path: "/rigging-gear/{id}/inspections"
    description: "List the inspection log for one gear item, newest first (FK reverse-reachability for GearInspection.gear_id)"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: GearInspection[]
    side_effects: []

  # ------------------------------------------------------------------ LiftPlan
  - method: POST
    path: "/lift-plans"
    description: "Open a lift plan against a site"
    roles: [Dispatcher]
    code: 201
    input: [site_id, job_reference, window_start, window_end, load_weight_lb, "sail_area_sqft?", "personnel_lift?", "multi_crane?", "road_closure_requested?"]
    output: LiftPlan
    side_effects: ["plan_status=DRAFT, field_status=NOT_MOBILIZED, lift_class=NOT_CLASSIFIED, bearing_variant=NONE", "customer_id copied from Site.customer_id"]

  - method: GET
    path: "/lift-plans/{id}"
    description: "Read one lift plan with every derived capacity, bearing, wind and billing field"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager, BillingClerk, Customer]
    code: 200
    input: []
    output: LiftPlan
    side_effects: []

  - method: GET
    path: "/lift-plans"
    description: "List lift plans with filters (FK reverse-reachability for site_id, customer_id, crane_id, operator_id and rigger_id)"
    roles: [Dispatcher, LiftDirector, Engineer, Operator, SafetyManager, BillingClerk]
    code: 200
    input: ["site_id?", "customer_id?", "crane_id?", "operator_id?", "rigger_id?", "plan_status?", "field_status?", "limit?", "offset?"]
    output: LiftPlan[]
    side_effects: []

  - method: POST
    path: "/lift-plans/{id}/site-survey"
    description: "Record the site survey and confirm the allowable soil bearing capacity"
    roles: [Dispatcher]
    code: 200
    input: [confirmed_soil_bearing_capacity_psf, access_notes, mat_inventory_available]
    output: LiftPlan
    side_effects: ["plan_status DRAFT -> SURVEYED", "Site.soil_bearing_capacity_psf, access_notes, mat_inventory_available, survey_status and last_surveyed_at updated", "increments LiftPlan.version by 1"]

  - method: POST
    path: "/lift-plans/{id}/configure"
    description: "Select the crane, boom configuration, radius, reeving and crew; verifies the load chart and classifies the lift"
    roles: [Dispatcher]
    code: 200
    input: [crane_id, operator_id, rigger_id, configuration, boom_length_ft, radius_ft, parts_of_line, expected_lift_plan_version, "block_weight_lb?", "jib_weight_lb?", "aux_head_weight_lb?"]
    output: LiftPlan
    side_effects:
      - "runs calculations.net_capacity_and_utilization, lift_class_determination, ground_bearing_pressure (PROVISIONAL_SURVEY), allowable_wind_speed and sling_leg_tension"
      - "plan_status SURVEYED -> CONFIGURED when lift_class==STANDARD, SURVEYED -> PENDING_ENGINEERING otherwise"
      - "supersedes any prior configuration and any prior EngineeringReview on the plan"
      - "runs calculations.crane_reserved_hours and operator_daily_hours"
      - "increments LiftPlan.version by 1"

  - method: POST
    path: "/lift-plans/{id}/approve"
    description: "Approve a STANDARD lift plan without engineering review"
    roles: [LiftDirector]
    code: 200
    input: []
    output: LiftPlan
    side_effects: ["plan_status CONFIGURED -> APPROVED", "increments LiftPlan.version by 1"]

  - method: POST
    path: "/lift-plans/{id}/release"
    description: "Release the plan to the field once every certification, permit, gear and credit gate passes"
    roles: [LiftDirector]
    code: 200
    input: []
    output: LiftPlan
    side_effects: ["plan_status APPROVED -> RELEASED", "increments LiftPlan.version by 1"]

  - method: POST
    path: "/lift-plans/{id}/cancel"
    description: "Cancel a lift plan; triggers the depth-4 LiftPlan -> Permit -> Invoice -> Customer cascade"
    roles: [Dispatcher, LiftDirector]
    code: 200
    input: [reason]
    output: LiftPlan
    side_effects:
      - "plan_status -> CANCELLED and cancellation_reason recorded"
      - "ACTIVE GearAssignments move to RELEASED; each gear's committed_assignment_count recomputed"
      - "HOP 2: SUBMITTED/APPROVED/SUSPENDED permits move to VOIDED, with cancellation_fee_cents charged on the ones that were APPROVED"
      - "HOP 3: a system-generated Invoice carrying line_permit_cancellation_cents is minted and issued"
      - "HOP 4: calculations.customer_open_receivable recomputes Customer.open_receivable_cents and invoice_count"
      - "runs calculations.crane_reserved_hours"
      - "increments LiftPlan.version by 1"

  - method: POST
    path: "/lift-plans/{id}/field-status"
    description: "Advance the operational dimension of the plan (MOBILIZE, START_LIFT, RESUME, SECURE, DEMOBILIZE)"
    roles: [Operator]
    code: 200
    input: [action]
    output: LiftPlan
    side_effects:
      - "moves field_status along the NOT_MOBILIZED -> MOBILIZED -> LIFTING <-> WIND_HOLD -> SECURED -> DEMOBILIZED machine"
      - "DEMOBILIZE also drives plan_status RELEASED -> CLOSED, recomputes standby_hours_billable via calculations.standby_interval_merge and re-runs calculations.crane_reserved_hours"
      - "increments LiftPlan.version by 1"

  # ------------------------------------------------------------ GearAssignment
  - method: POST
    path: "/gear-assignments"
    description: "Commit a serviceable piece of rigging gear to a lift plan"
    roles: [Dispatcher]
    code: 201
    input: [lift_plan_id, gear_id, leg_count, sling_angle_deg, expected_gear_version]
    output: GearAssignment
    side_effects:
      - "status=ACTIVE; effective_wll_lb snapshotted from RiggingGear.effective_wll_lb; load_angle_factor resolved; leg_tension_lb stays 0 until the next configure"
      - "RiggingGear.committed_assignment_count recomputed"
      - "increments RiggingGear.version by 1"

  - method: GET
    path: "/gear-assignments/{id}"
    description: "Read one gear assignment"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: []
    output: GearAssignment
    side_effects: []

  - method: GET
    path: "/gear-assignments"
    description: "List gear assignments (FK reverse-reachability for lift_plan_id and gear_id)"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["lift_plan_id?", "gear_id?", "status?", "limit?", "offset?"]
    output: GearAssignment[]
    side_effects: []

  - method: POST
    path: "/gear-assignments/{id}/release"
    description: "Withdraw a gear assignment from a plan"
    roles: [Dispatcher]
    code: 200
    input: []
    output: GearAssignment
    side_effects:
      - "status ACTIVE -> RELEASED"
      - "RiggingGear.committed_assignment_count recomputed"
      - "owning LiftPlan.rigging_weight_lb is NOT recomputed until the next configure"
      - "increments GearAssignment.version by 1"

  # -------------------------------------------------------- EngineeringReview
  - method: POST
    path: "/engineering-reviews"
    description: "Submit an engineering analysis for a critical lift"
    roles: [Engineer]
    code: 201
    input: [lift_plan_id, author_personnel_id, analysis_notes]
    output: EngineeringReview
    side_effects: ["status=UNDER_REVIEW, revision_round=1"]

  - method: GET
    path: "/engineering-reviews/{id}"
    description: "Read one engineering review"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: []
    output: EngineeringReview
    side_effects: []

  - method: GET
    path: "/engineering-reviews"
    description: "List engineering reviews (FK reverse-reachability for lift_plan_id, author_personnel_id and stamped_by_personnel_id)"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager]
    code: 200
    input: ["lift_plan_id?", "author_personnel_id?", "stamped_by_personnel_id?", "status?", "limit?", "offset?"]
    output: EngineeringReview[]
    side_effects: []

  - method: POST
    path: "/engineering-reviews/{id}/decision"
    description: "Record a second engineer's decision (REQUEST_CHANGES, STAMP or REJECT); the caller may never be the author"
    roles: [Engineer]
    code: 200
    input: [action, "note?"]
    output: EngineeringReview
    side_effects:
      - "REQUEST_CHANGES -> CHANGES_REQUESTED; REJECT -> REJECTED"
      - "STAMP -> STAMPED, writes stamped_by_personnel_id, runs calculations.ground_bearing_pressure variant FINAL_ENGINEERED into final_bearing_pressure_psf and final_mat_count, and cascades the LiftPlan PENDING_ENGINEERING -> APPROVED while overwriting the plan's bearing fields"
      - "increments EngineeringReview.version by 1"

  - method: POST
    path: "/engineering-reviews/{id}/resubmit"
    description: "Author resubmits a revised analysis after changes were requested"
    roles: [Engineer]
    code: 200
    input: [analysis_notes]
    output: EngineeringReview
    side_effects: ["status CHANGES_REQUESTED -> UNDER_REVIEW and revision_round incremented", "a resubmit attempted at revision_round 3 fails with ERR_REVISION_LIMIT_EXCEEDED and persists the review as REJECTED", "increments EngineeringReview.version by 1"]

  # -------------------------------------------------------------------- Permit
  - method: POST
    path: "/permits"
    description: "Open a permit application for a lift plan"
    roles: [Dispatcher]
    code: 201
    input: [lift_plan_id, permit_type, jurisdiction_code]
    output: Permit
    side_effects: ["status=DRAFT", "runs calculations.permit_fee_and_lead_days to write escort_required, required_lead_days and permit_fee_cents"]

  - method: GET
    path: "/permits/{id}"
    description: "Read one permit"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager, BillingClerk]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits (FK reverse-reachability for lift_plan_id)"
    roles: [Dispatcher, LiftDirector, Engineer, SafetyManager, BillingClerk]
    code: 200
    input: ["lift_plan_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/submit"
    description: "File the application with the jurisdiction; enforces jurisdiction match then lead time"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Permit
    side_effects: ["status DRAFT/DENIED/SUSPENDED -> SUBMITTED and submitted_at stamped", "increments Permit.version by 1"]

  - method: POST
    path: "/permits/{id}/record-decision"
    description: "Record the jurisdiction's written response"
    roles: [Dispatcher]
    code: 200
    input: [decision, "agency_reference?", "reason?"]
    output: Permit
    side_effects: ["status SUBMITTED -> APPROVED or DENIED; decision_at stamped", "increments Permit.version by 1"]

  # -------------------------------------------------------------- StandbyEvent
  - method: POST
    path: "/standby-events"
    description: "Open a standby/hold window against a lift plan; a WIND cause at or above the plan's allowable wind forces a wind hold"
    roles: [SafetyManager]
    code: 201
    input: [lift_plan_id, cause, started_at, "wind_speed_mph?"]
    output: StandbyEvent
    side_effects: ["status=OPEN", "when the plan's field_status is LIFTING it moves to WIND_HOLD and forced_wind_hold is set for WIND causes", "increments LiftPlan.version by 1"]

  - method: GET
    path: "/standby-events/{id}"
    description: "Read one standby event"
    roles: [Dispatcher, LiftDirector, Operator, SafetyManager, BillingClerk]
    code: 200
    input: []
    output: StandbyEvent
    side_effects: []

  - method: GET
    path: "/standby-events"
    description: "List standby events (FK reverse-reachability for lift_plan_id)"
    roles: [Dispatcher, LiftDirector, Operator, SafetyManager, BillingClerk]
    code: 200
    input: ["lift_plan_id?", "status?", "cause?", "limit?", "offset?"]
    output: StandbyEvent[]
    side_effects: []

  - method: POST
    path: "/standby-events/{id}/close"
    description: "Close a standby window and re-merge the plan's billable standby hours"
    roles: [SafetyManager]
    code: 200
    input: [ended_at]
    output: StandbyEvent
    side_effects: ["status OPEN -> CLOSED, raw_duration_hours computed", "runs calculations.standby_interval_merge to refresh LiftPlan.standby_hours_billable", "increments StandbyEvent.version by 1"]

  # ------------------------------------------------------------------- Invoice
  - method: POST
    path: "/invoices"
    description: "Draft an invoice for a closed job in either HOURLY or LUMP_SUM mode"
    roles: [BillingClerk]
    code: 201
    input: [lift_plan_id, billing_mode, expected_lift_plan_version, "on_site_hours?", "travel_hours?", "travel_miles?", "lump_sum_cents?"]
    output: Invoice
    side_effects:
      - "status=DRAFT; customer_id copied from LiftPlan.customer_id; standby_hours_source snapshotted"
      - "runs calculations.invoice_line_rounding then calculations.invoice_discount_and_surcharge_order"
      - "any prior DRAFT Invoice on the same plan moves to VOIDED (create-with-supersede)"
      - "LiftPlan.invoice_count recomputed and increments LiftPlan.version by 1"

  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice; a Customer caller may only read its own"
    roles: [Dispatcher, LiftDirector, BillingClerk, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices (FK reverse-reachability for lift_plan_id and customer_id)"
    roles: [Dispatcher, LiftDirector, BillingClerk]
    code: 200
    input: ["lift_plan_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a drafted or disputed invoice to the customer"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status DRAFT/DISPUTED -> ISSUED", "runs calculations.customer_open_receivable", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an invoice; the compensating action for issue"
    roles: [BillingClerk]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["status -> VOIDED", "runs calculations.customer_open_receivable so open_receivable_cents returns to its pre-issue value", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Customer disputes an issued invoice"
    roles: [Customer]
    code: 200
    input: [dispute_reason]
    output: Invoice
    side_effects: ["status ISSUED -> DISPUTED", "open_receivable_cents unchanged", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Record payment against an issued or disputed invoice"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID", "runs calculations.customer_open_receivable", "increments Invoice.version by 1"]

  # --------------------------------------------------------- test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock starts at exactly 2026-08-01T00:00:00Z on server startup and NEVER falls back to wall-clock time; every expiry, lead-time and inspection-due rule reads this clock."
    roles: [Dispatcher, LiftDirector, SafetyManager, BillingClerk, Engineer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "re-derives Personnel.status against certification_expires_on"
      - "re-derives RiggingGear.status SERVICEABLE -> DUE_INSPECTION once logical_now >= next_inspection_due_at"
      - "re-derives Crane.status -> OUT_OF_SERVICE once logical_now >= annual_inspection_expires_on"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED,             http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the seven declared roles" }
  - { id: ERR_FORBIDDEN_ROLE,              http: 403, condition: "The authenticated role is not listed in the §1.5 roles for the endpoint being called" }
  - { id: ERR_CUSTOMER_SCOPE_VIOLATION,    http: 403, condition: "A Customer caller targets a Customer row or an Invoice whose customer_id is not the caller's X-User-ID" }
  - { id: ERR_NOT_ASSIGNED_OPERATOR,       http: 403, condition: "An Operator caller drives field-status on a LiftPlan whose operator_id is not the caller's X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES,       http: 403, condition: "An Engineer decides on a review they authored, or resubmits a review they did not author" }

  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND,          http: 404, condition: "Referenced Customer id does not exist" }
  - { id: ERR_SITE_NOT_FOUND,              http: 404, condition: "Referenced Site id does not exist" }
  - { id: ERR_CRANE_NOT_FOUND,             http: 404, condition: "Referenced Crane id does not exist" }
  - { id: ERR_PERSONNEL_NOT_FOUND,         http: 404, condition: "Referenced Personnel id does not exist" }
  - { id: ERR_GEAR_NOT_FOUND,              http: 404, condition: "Referenced RiggingGear id does not exist" }
  - { id: ERR_LIFT_PLAN_NOT_FOUND,         http: 404, condition: "Referenced LiftPlan id does not exist" }
  - { id: ERR_GEAR_ASSIGNMENT_NOT_FOUND,   http: 404, condition: "Referenced GearAssignment id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND,            http: 404, condition: "Referenced EngineeringReview id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND,            http: 404, condition: "Referenced Permit id does not exist" }
  - { id: ERR_STANDBY_EVENT_NOT_FOUND,     http: 404, condition: "Referenced StandbyEvent id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND,           http: 404, condition: "Referenced Invoice id does not exist" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST,             http: 400, condition: "Missing required body field, wrong type, illegal enum member, leg_count outside 1..4, sling_angle_deg outside {30,45,60,90}, negative hours or miles, non-positive soil bearing capacity, parts_of_line below 1, or pagination limit outside 1..100" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_PLAN_VERSION,          http: 412, condition: "expected_lift_plan_version does not equal the LiftPlan's current version on configure or invoice creation" }
  - { id: ERR_STALE_GEAR_VERSION,          http: 412, condition: "expected_gear_version does not equal the RiggingGear's current version on gear assignment" }

  # --- own-state preconditions ---
  - { id: ERR_INVALID_PLAN_STATE,          http: 409, condition: "The LiftPlan's plan_status is not a declared from-state for the requested transition" }
  - { id: ERR_INVALID_FIELD_STATE,         http: 409, condition: "The LiftPlan's field_status is not a declared from-state for the requested field-status action, or an OPEN StandbyEvent blocks START_LIFT, RESUME or SECURE" }
  - { id: ERR_INVALID_GEAR_STATE,          http: 409, condition: "An inspection or retirement targets a RETIRED RiggingGear, or a GearAssignment is released while its status is not ACTIVE" }
  - { id: ERR_INVALID_REVIEW_STATE,        http: 409, condition: "The EngineeringReview's status is not a declared from-state for the requested decision or resubmit" }
  - { id: ERR_INVALID_PERMIT_STATE,        http: 409, condition: "The Permit's status is not a declared from-state for submit or record-decision" }
  - { id: ERR_INVALID_INVOICE_STATE,       http: 409, condition: "The Invoice's status is not a declared from-state for issue, void, dispute or pay" }

  # --- cross-entity state gates ---
  - { id: ERR_CRANE_OUT_OF_SERVICE,        http: 409, condition: "The crane referenced by a configure, release or mobilize is OUT_OF_SERVICE" }
  - { id: ERR_GEAR_NOT_SERVICEABLE,        http: 409, condition: "Gear is assigned while its status is not SERVICEABLE, or a plan is released while one of its ACTIVE assignments holds gear that is not SERVICEABLE" }
  - { id: ERR_PERMIT_NOT_APPROVED,         http: 409, condition: "A plan whose permit_required is true is released without any Permit in status APPROVED" }
  - { id: ERR_PLAN_NOT_PENDING_ENGINEERING, http: 409, condition: "A review is stamped while its LiftPlan is not in PENDING_ENGINEERING" }

  # --- safety / certification ---
  - { id: ERR_PERSONNEL_ROLE_MISMATCH,     http: 422, condition: "operator_id does not reference role_type OPERATOR, rigger_id does not reference role_type RIGGER, or author_personnel_id does not reference role_type ENGINEER" }
  - { id: ERR_OPERATOR_CERT_EXPIRED,       http: 422, condition: "The assigned operator's certification_expires_on is not strictly after the plan's window_start at release time" }
  - { id: ERR_OPERATOR_ENDORSEMENT_INSUFFICIENT, http: 422, condition: "The assigned operator's endorsement_class_tons is below the assigned crane's class_tons at release time" }
  - { id: ERR_RIGGER_QUALIFICATION_INSUFFICIENT, http: 422, condition: "The assigned rigger's rigger_level rank is below the rank the plan's lift_class demands at release time" }
  - { id: ERR_NO_RIGGING_ASSIGNED,         http: 422, condition: "A configure is attempted while the plan holds zero GearAssignment rows in status ACTIVE" }
  - { id: ERR_LOAD_CHART_NO_ROW,           http: 422, condition: "No LoadChartEntry matches the crane, configuration and exact boom length with a radius at or beyond the requested radius" }
  - { id: ERR_CAPACITY_EXCEEDED,           http: 422, condition: "net_capacity_lb is not positive, or utilization_pct exceeds 100.00" }
  - { id: ERR_SLING_WLL_EXCEEDED,          http: 422, condition: "Any ACTIVE assignment's computed leg_tension_lb is strictly greater than its snapshotted effective_wll_lb" }
  - { id: ERR_WIND_BELOW_HOLD_THRESHOLD,   http: 422, condition: "A StandbyEvent with cause WIND reports wind_speed_mph strictly below the plan's allowable_wind_mph" }

  # --- scheduling / uniqueness constraints ---
  - { id: ERR_CRANE_WINDOW_CONFLICT,       http: 409, condition: "The requested lift window intersects another plan's window plus its 12-hour trailing release buffer on the same crane" }
  - { id: ERR_OPERATOR_HOURS_EXCEEDED,     http: 409, condition: "The operator's clipped assigned hours on any UTC calendar day would exceed 12.0" }
  - { id: ERR_DUPLICATE_GEAR_TAG,          http: 409, condition: "gear_tag already exists on another RiggingGear row" }
  - { id: ERR_DUPLICATE_CHART_ROW,         http: 409, condition: "A LoadChartEntry already exists for the same crane, configuration, boom length and radius" }
  - { id: ERR_DUPLICATE_GEAR_ASSIGNMENT,   http: 409, condition: "The plan already holds an ACTIVE GearAssignment for the same gear" }

  # --- referential / temporal ---
  - { id: ERR_JURISDICTION_MISMATCH,       http: 422, condition: "Permit.jurisdiction_code differs from the Site.jurisdiction_code of the permit's lift plan at submit time" }
  - { id: ERR_PERMIT_LEAD_TIME_SHORT,      http: 422, condition: "window_start minus the logical clock is less than required_lead_days * 24 hours at submit time" }
  - { id: ERR_INVALID_WINDOW,              http: 422, condition: "window_end is not strictly after window_start, or window_start is before the logical clock" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED,     http: 409, condition: "A resubmit is attempted while the review's revision_round already equals 3" }

  # --- fiscal ---
  - { id: ERR_CUSTOMER_CREDIT_HOLD,        http: 402, condition: "The owning customer's credit_hold is true at release or at invoice issuance" }
  - { id: ERR_LUMP_SUM_REQUIRED,           http: 422, condition: "billing_mode is LUMP_SUM but lump_sum_cents is missing or not greater than 0" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:

  - name: Dispatcher
    description: "Sales/scheduling desk. Owns the setup surface: customers, sites, cranes, load charts, personnel records, lift plans, gear assignments and permit paperwork."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /sites"
      - "POST /cranes"
      - "POST /load-chart-entries"
      - "POST /personnel"
      - "POST /personnel/{id}/certifications"
      - "POST /lift-plans"
      - "POST /lift-plans/{id}/site-survey"
      - "POST /lift-plans/{id}/configure"
      - "POST /gear-assignments"
      - "POST /gear-assignments/{id}/release"
      - "POST /permits"
      - "POST /permits/{id}/submit"
      - "POST /permits/{id}/record-decision"
    shared_operations:
      - "POST /lift-plans/{id}/cancel (shared with LiftDirector)"
      - "POST /_clock/set_current_utc (shared with LiftDirector, SafetyManager, BillingClerk, Engineer)"
      - "every GET except GET /invoices, which is shared with LiftDirector and BillingClerk only"

  - name: LiftDirector
    description: "Signs off standard lifts and releases every plan to the field. Cannot configure, cannot stamp, cannot inspect gear."
    identity: "opaque"
    exclusive_operations:
      - "POST /lift-plans/{id}/approve"
      - "POST /lift-plans/{id}/release"
    shared_operations:
      - "POST /lift-plans/{id}/cancel (shared with Dispatcher)"
      - "POST /_clock/set_current_utc"
      - "read access across plans, permits, reviews, gear, cranes, sites and invoices"

  - name: Engineer
    description: "Licensed professional engineer. Authors critical-lift analyses and decides on OTHER engineers' analyses. Segregation of duties: the author of a review can never be the engineer who requests changes on it, stamps it, or rejects it, and only the author may resubmit it."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /engineering-reviews"
      - "POST /engineering-reviews/{id}/decision"
      - "POST /engineering-reviews/{id}/resubmit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "read access across plans, sites, cranes, load charts, gear, assignments, reviews and permits"

  - name: Operator
    description: "Certified crane operator. Drives the field_status dimension of the plan they are assigned to and nothing else."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /lift-plans/{id}/field-status"
    shared_operations:
      - "read access to plans, cranes, gear, personnel and standby events"

  - name: SafetyManager
    description: "Owns gear integrity and site/weather holds: registers gear, records inspections and retirements, opens and closes standby windows, and pulls cranes out of service."
    identity: "opaque"
    exclusive_operations:
      - "POST /rigging-gear"
      - "POST /rigging-gear/{id}/retire"
      - "POST /gear-inspections"
      - "POST /standby-events"
      - "POST /standby-events/{id}/close"
      - "POST /cranes/{id}/out-of-service"
      - "POST /cranes/{id}/return-to-service"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "read access to gear, inspections, cranes, sites, plans, assignments, reviews, permits and standby events"

  - name: BillingClerk
    description: "Owns the money surface: credit holds, invoice drafting, issuance, voiding and payment."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers/{id}/credit-status"
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/void"
      - "POST /invoices/{id}/pay"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "read access to customers, cranes, plans, permits, standby events and invoices"

  - name: Customer
    description: "The paying account. Reads only its own customer row, its own lift plans and its own invoices, and may dispute an issued invoice."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /invoices/{id}/dispute"
    shared_operations:
      - "GET /customers/{id} restricted to the caller's own row"
      - "GET /invoices/{id} restricted to invoices whose customer_id is the caller"
      - "GET /lift-plans/{id} and GET /sites/{id}"
