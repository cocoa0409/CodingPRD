        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_CROSS_PROGRAM_REFERENCE]
        distinguishing_aspect: "POST /pack-boms under program A referencing a lot from program B returns ERR_CROSS_PROGRAM_REFERENCE."
