        grounds:
          - validations.priority_12
          - errors[ERR_BILLING_PERIOD_INVALID]
          - endpoints.POST_/colocation/contracts/{contract_id}/billing-close
        distinguishing_aspect: "period_end must be STRICTLY after period_start, so an equal pair is refused with 422 and last_closed_period_end is left null — no lines are appended by the failed close."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with one RESERVED cabinet and no meter intervals."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
