  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_status_and_refresh_axes_move_independently
        grounds:
          - state_machines.Subscription.status.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.refresh_state.GRACE_to_OVERDUE
          - state_machines.Subscription.refresh_state.OVERDUE_to_CURRENT
          - state_machines.Household.write_gate_state.OPEN_to_RESTRICTED
          - entities.Subscription.fields.refresh_state
        distinguishing_aspect: |
          Non-linearity here is PARALLEL STATE DIMENSIONS on the Subscription entity:
          status and refresh_state sit on the same row and change without touching each
          other, so the row passes through (ACTIVE, OVERDUE), then (PAST_DUE, OVERDUE),
          then (PAST_DUE, CURRENT) - a combination no single linear pipeline can express.
        test_recipe:
          setup:
            - "A PLUS subscription created at 2026-05-01 and driven to ACTIVE, refresh_state CURRENT, household write_gate_state OPEN."
            - "Clock advanced to 2027-06-01, which is past refresh_due_at (2027-05-01) plus REFRESH_GRACE_DAYS (30), so refresh_state collapses to OVERDUE while status stays ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "owner.e@example.com", full_name: "Owner E" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Elm House", address_label: "9 Elm Rd" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_FAILED" }
              as: PlatformAdmin
            - call: "POST /vault/subscriptions/${sub_id}/attest-refresh"
              payload: { attestation_note: "annual walkthrough done" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "AFTER SETUP, before the trigger: Subscription.${sub_id}.status == ACTIVE"
            - "AFTER SETUP, before the trigger: Subscription.${sub_id}.refresh_state == OVERDUE"
            - "AFTER SETUP, before the trigger: Household.${hh_id}.write_gate_state == RESTRICTED"
            - "AFTER the first trigger call: Subscription.${sub_id}.status == PAST_DUE and refresh_state == OVERDUE"
            - "AFTER the second trigger call: Subscription.${sub_id}.status == PAST_DUE"
            - "AFTER the second trigger call: Subscription.${sub_id}.refresh_state == CURRENT"
            - "AFTER the second trigger call: Household.${hh_id}.write_gate_state == OPEN"
            - "Subscription.${sub_id}.past_due_since_at == 2027-06-01T00:00:00.000Z"

