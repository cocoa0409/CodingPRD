scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc: two valid algorithms, different results,
  # on DIFFERENT entity domains.
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: identity_resolution_strict_fhir_vs_default
        grounds:
          - calculations.identity_resolution
          - entities.RosterRow.fields.status
        distinguishing_aspect: |
          Entity domain = RosterRow identity resolution. The default variant
          MATCHES a row scoring in [70,99], while the strict_exact_only variant
          (RosterSource.format == FHIR) forces the same row into CONFLICT —
          identical input, different row status and different downstream
          commit behavior.
        test_recipe:
          setup:
            - "Two roster sources exist: SRC_CSV (format CSV, rank 1) and SRC_FHIR (format FHIR, rank 2)"
            - "An ACTIVE provider P exists with npi=1234567893, tin=123456789, location_key=LOC1"
            - "Two roster files (one per source) each carry one row with npi=1234567893, tin=123456789, location_key=LOC2 (location mismatch => match_score 80)"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_CSV", display_name: "CSV Feed", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_csv_id: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_FHIR", display_name: "FHIR Feed", format: "FHIR", precedence_rank: 2, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_fhir_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_id: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_csv_id}", external_file_ref: "csv-001", declared_row_count: 1, checksum: "aaa001" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { file_csv_id: $.data.id }
            - call: "POST /pdm/roster-files/${file_csv_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${file_csv_id}/normalize"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_fhir_id}", external_file_ref: "fhir-001", declared_row_count: 1, checksum: "bbb001" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { file_fhir_id: $.data.id }
            - call: "POST /pdm/roster-files/${file_fhir_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${file_fhir_id}/normalize"
              payload: {}
              as: IntakeOperator
          trigger:
            - call: "POST /pdm/roster-files/${file_csv_id}/validate"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${file_fhir_id}/validate"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${file_csv_id}/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { csv_row_status: "$.data[0].status" }
            - call: "GET /pdm/roster-files/${file_fhir_id}/roster-rows"
              payload: {}
              as: IntakeOperator
              captures: { fhir_row_status: "$.data[0].status" }
          assert:
            - "RosterRow(CSV file).status == MATCHED (score 80 in [70,99] under default variant)"
            - "RosterRow(FHIR file).status == CONFLICT (same score 80 but strict_exact_only requires 100)"
            - "CSV file becomes committable while FHIR file remains blocked by ERR_UNRESOLVED_ROW_CONFLICTS"

      - name: data_quality_directory_strict_vs_stored_score
        grounds:
          - calculations.data_quality_scoring
          - calculations.distribution_snapshot_selection
          - entities.DataQualityScore.fields.total_score
        distinguishing_aspect: |
          Entity domain = Provider quality scoring (distinct from RosterRow
          identity resolution). The stored total_score uses 5 points per open
          conflict, while the directory_strict_scoring variant charges 10
          points per ESCALATED conflict; a provider can therefore pass a
          CLAIMS floor while failing a DIRECTORY floor at the same instant.
        test_recipe:
          setup:
            - "Provider P with one ESCALATED AttributeConflict, otherwise complete+fresh attributes and clean attestation history"
            - "CLAIMS target floor 70; DIRECTORY target floor 70"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_A", display_name: "A", format: "CSV", precedence_rank: 5, freshness_sla_days: 3650 }
              as: DataSteward
              captures: { src_a_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_id: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://claims", required_quality_floor: 70 }
              as: DistributionOperator
              captures: { tgt_claims_id: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "DIRECTORY", endpoint_uri: "sftp://dir", required_quality_floor: 70 }
              as: DistributionOperator
              captures: { tgt_dir_id: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${prov_id}/quality-scores/recompute"
              payload: {}
              as: DataSteward
              captures: { score_id: $.data.id, stored_total: $.data.total_score }
            - call: "GET /pdm/providers/${prov_id}"
              payload: {}
              as: DataSteward
          assert:
            - "stored DataQualityScore.total_score uses 5-per-open-conflict arithmetic (conflict_component = 20 - 5*1 = 15 when 1 open conflict)"
            - "directory eligibility score for the same provider = total - 10 (ESCALATED charged double) and therefore the provider appears in a CLAIMS snapshot but is excluded from a DIRECTORY snapshot at the same floor"

  # ===================================================================
  # Rule 2 — combinatorial_formula: ≥2 instances in DIFFERENT modes
  # (a >=3-input nonlinear, b nested rounding order, c circular-looking
  # evaluation order).
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quality_score_four_component_weighted_sum
        grounds:
          - calculations.data_quality_scoring
          - entities.DataQualityScore.fields.total_score
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction —
          completeness (round_half_up on 40*present/10), freshness
          (6*fresh_groups with 5 group-staleness predicates), conflict
          (max(0, 20-5*open_conflicts)), attestation (max(0, 10-5*consec)).
          The four components clamp independently before summing.
        test_recipe:
          setup:
            - "Provider with 8 of 10 required keys ACTIVE, 3 of 5 groups fresh, 1 open conflict, 1 consecutive expiry"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_Q", display_name: "Q", format: "CSV", precedence_rank: 1, freshness_sla_days: 30 }
              as: DataSteward
              captures: { src_q_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_q_id: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${prov_q_id}/quality-scores/recompute"
              payload: {}
              as: DataSteward
              captures: { q_total: $.data.total_score, q_completeness: $.data.completeness_component, q_freshness: $.data.freshness_component, q_conflict: $.data.conflict_component, q_attest: $.data.attestation_component }
          assert:
            - "completeness_component == round_half_up(40*8/10) == 32"
            - "freshness_component == 6*3 == 18"
            - "conflict_component == max(0, 20-5*1) == 15"
            - "attestation_component == max(0, 10-5*1) == 5"
            - "total_score == 32+18+15+5 == 70"

      - name: effective_dating_truncation_then_conflict_order
        grounds:
          - calculations.attribute_effective_dating
          - calculations.conflicting_source_precedence
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — interval truncation (step
          3b) mutates the very intervals whose source-precedence comparison
          (step 5) then decides conflict outcomes; the scaffold pins the
          evaluation order (truncate first, then precedence adjudication over
          the survivors), and reversing the order changes which attribute
          value is effective.
        test_recipe:
          setup:
            - "Provider P; source S1 rank 1; source S2 rank 2"
            - "Existing ACTIVE attribute A1 (group CONTACT, key phone, value V1, effective 2026-01-01, open-ended) from S1"
            - "Incoming row from S2 asserts phone=V2 effective 2026-06-01 (lands inside A1)"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S1", display_name: "S1", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { s1_id: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S2", display_name: "S2", format: "CSV", precedence_rank: 2, freshness_sla_days: 90 }
              as: DataSteward
              captures: { s2_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_e_id: $.data.id }
            - call: "POST /pdm/providers/${prov_e_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01" }
              as: DataSteward
              captures: { attr_a1_id: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${prov_e_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-06-01" }
              as: DataSteward
              captures: { attr_a2_id: $.data.id }
          assert:
            - "A1.term_date == 2026-06-01 (truncated at incoming start, NOT superseded)"
            - "A2.status == ACTIVE and A2.effective_date == 2026-06-01"
            - "Because sources differ and S1.rank < S2.rank, conflicting_source_precedence VOIDs the challenger: A2 transitions to VOIDED and A1 restores open-ended term_date=null"
            - "The pinned order (truncate-then-adjudicate) leaves exactly one ACTIVE interval [2026-01-01, +inf) with value V1"

  # ===================================================================
  # Rule 3 — non_linear_state_machine: two machines on DIFFERENT
  # entities, each non-linear (cycle / parallel dims / fork-join).
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: attestation_request_cyclic_escalation
        grounds:
          - state_machines.AttestationRequest
          - state_machines.Provider
        distinguishing_aspect: |
          AttestationRequest exhibits a non-linear path DRAFT->SENT->EXPIRED
          ->ESCALATED (with EXPIRED reachable repeatedly across consecutive
          requests for the same provider) AND the provider-level cycle
          ACTIVE->SUSPENDED->ACTIVE is driven by the second consecutive
          expiry; the two machines interact (escalation can suspend the
          provider, reinstate re-opens future attestation).
        test_recipe:
          setup:
            - "Campaign C (window_days=10) OPEN; provider P ACTIVE"
            - "Two consecutive attestation requests R1, R2 both expire without response"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_a_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "Q3", window_days: 10 }
              as: DataSteward
              captures: { camp_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_id}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_id}/attestation-requests"
              payload: { provider_id: "${prov_a_id}" }
              as: DataSteward
              captures: { req1_id: $.data.id }
            - call: "POST /pdm/attestation-requests/${req1_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/attestation-requests/sweep"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /pdm/attestation-requests/${req1_id}/escalate"
              payload: {}
              as: DataSteward
            - call: "GET /pdm/providers/${prov_a_id}"
              payload: {}
              as: DataSteward
              captures: { prov_status: $.data.lifecycle_status }
          assert:
            - "AttestationRequest.${req1_id}.status == ESCALATED"
            - "Provider.lifecycle_status == SUSPENDED (second consecutive expiry crosses SUSPEND_THRESHOLD=2)"

      - name: roster_file_branching_reject_paths
        grounds:
          - state_machines.RosterFile
        distinguishing_aspect: |
          RosterFile has a branching (fork) shape — REJECT is reachable from
          FOUR distinct from-states (RECEIVED, PARSED, NORMALIZED, VALIDATED)
          each with divergent side-effect sets (row cleanup only from PARSED
          onward), unlike AttestationRequest's linear-with-cycle shape on a
          different entity.
        test_recipe:
          setup:
            - "Two files F1 (still RECEIVED) and F2 (advanced to NORMALIZED with 1 malformed row)"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_B", display_name: "B", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_b_id: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_b_id}", external_file_ref: "f1", declared_row_count: 1, checksum: "c001" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { f1_id: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_b_id}", external_file_ref: "f2", declared_row_count: 2, checksum: "c002" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { f2_id: $.data.id }
            - call: "POST /pdm/roster-files/${f2_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${f2_id}/normalize"
              payload: {}
              as: IntakeOperator
          trigger:
            - call: "POST /pdm/roster-files/${f1_id}/reject"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${f2_id}/reject"
              payload: {}
              as: IntakeOperator
          assert:
            - "F1 transitions RECEIVED->REJECTED with zero row side effects"
            - "F2 transitions NORMALIZED->REJECTED and every non-terminal RosterRow transitions to REJECTED (rejected_row_count == parsed_row_count)"

  # ===================================================================
  # Rule 4 — transitive_cascade: ≥2 cascades from DIFFERENT triggers,
  # one depth ≥3, the other depth ≥2.
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: commit_to_attribute_to_conflict_to_quality
        grounds:
          - state_machines.RosterFile.transitions (VALIDATED->COMMITTED)
          - state_machines.AttributeConflict
          - calculations.data_quality_scoring
        distinguishing_aspect: |
          Depth-3 chain: RosterFile COMMIT -> ProviderAttribute interval
          SUPERSEDE (link 1) -> AttributeConflict auto-created when sources
          tie on precedence (link 2) -> DataQualityScore recompute mutates
          Provider.current_quality_score (link 3). Each hop is caused by the
          previous mutation, not by the commit directly.
        test_recipe:
          setup:
            - "Provider P ACTIVE with phone=V1 from S1 (rank 1); two more sources S2 and S3 both at rank 5 (tie)"
            - "File from S2 asserts phone=V2 effective today; a second file from S3 asserts phone=V3 same effective date"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S1C", display_name: "S1", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { s1c_id: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S2C", display_name: "S2", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
              captures: { s2c_id: $.data.id }
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "S3C", display_name: "S3", format: "CSV", precedence_rank: 5, freshness_sla_days: 90 }
              as: DataSteward
              captures: { s3c_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_c_id: $.data.id }
            - call: "POST /pdm/providers/${prov_c_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/providers/${prov_c_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${prov_c_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V3", effective_date: "2026-08-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${prov_c_id}/quality-scores/recompute"
              payload: {}
              as: DataSteward
              captures: { post_total: $.data.total_score }
          assert:
            - "An AttributeConflict was created for (phone) with status OPEN (equal-rank tie between S2 and S3)"
            - "Provider.current_quality_score dropped by 5 relative to the pre-conflict score (conflict_component 20 -> 15)"

      - name: attestation_expiry_to_suspend_to_distribution
        grounds:
          - state_machines.AttestationRequest.transitions (SENT->EXPIRED, EXPIRED->ESCALATED)
          - state_machines.Provider.transitions (ACTIVE->SUSPENDED)
          - calculations.distribution_snapshot_selection
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (attestation sweep, not file
          commit): sweep EXPIRES the request -> escalation suspends provider
          -> next DistributionBatch publish excludes the provider and emits
          QUALITY_DROP_EXCLUDED / omits the provider entirely.
        test_recipe:
          setup:
            - "Provider P ACTIVE included in a prior ACKED CLAIMS batch"
            - "Two consecutive EXPIRED attestation requests; escalate the second"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_d_id: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://claims", required_quality_floor: 0 }
              as: DistributionOperator
              captures: { tgt_d_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "C2", window_days: 5 }
              as: DataSteward
              captures: { camp_d_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_d_id}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_d_id}/attestation-requests"
              payload: { provider_id: "${prov_d_id}" }
              as: DataSteward
              captures: { reqd1_id: $.data.id }
            - call: "POST /pdm/attestation-requests/${reqd1_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/attestation-requests/sweep"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-requests/${reqd1_id}/escalate"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_d_id}/attestation-requests"
              payload: { provider_id: "${prov_d_id}" }
              as: DataSteward
              captures: { reqd2_id: $.data.id }
          trigger:
            - call: "POST /pdm/attestation-requests/${reqd2_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/attestation-requests/sweep"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-requests/${reqd2_id}/escalate"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_d_id}" }
              as: DistributionOperator
              captures: { batch_d_id: $.data.id }
            - call: "POST /pdm/distribution-batches/${batch_d_id}/publish"
              payload: {}
              as: DistributionOperator
            - call: "GET /pdm/distribution-batches/${batch_d_id}/items"
              payload: {}
              as: DistributionOperator
          assert:
            - "Provider.lifecycle_status == SUSPENDED after the second escalation"
            - "DistributionBatch item list contains no ADD/UPDATE item for provider P (suspended providers are excluded)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure
  # scenarios on DIFFERENT error-category pairs.
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_vs_stale_version_on_commit
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Category pair = business_safety (SoD) vs business_constraint
          (OCC). A commit attempt that BOTH violates SoD (same user) AND
          carries a stale expected_roster_file_version MUST return
          ERR_SOD_SAME_USER (priority 5 < 7), not ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "File F registered by op_intake_1, driven to VALIDATED"
            - "F.version advanced by a prior successful supersede (so caller's captured version is stale)"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_P", display_name: "P", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_p_id: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_p_id}", external_file_ref: "pf1", declared_row_count: 0, checksum: "p001" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /pdm/roster-files/${pf_id}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${pf_id}/normalize"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${pf_id}/validate"
              payload: {}
              as: IntakeOperator
          trigger:
            - call: "POST /pdm/roster-files/${pf_id}/commit"
              payload: { expected_roster_file_version: "${pf_v} - 1" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
          assert:
            - "response error_id == ERR_SOD_SAME_USER (business_safety wins over business_constraint)"
            - "RosterFile.status remains VALIDATED"

      - name: window_closed_vs_correction_payload_on_respond
        grounds:
          - validations[priority=15]
          - validations[priority=30]
        distinguishing_aspect: |
          Category pair = business_temporal (window closed) vs
          business_constraint (missing corrected_payload) — a different pair
          from instance 1. Responding after due_at AND omitting the required
          corrected_payload MUST return ERR_ATTESTATION_WINDOW_CLOSED
          (priority 15 < 30).
        test_recipe:
          setup:
            - "Sent attestation request R; logical clock advanced past due_at"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_t_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CT", window_days: 5 }
              as: DataSteward
              captures: { camp_t_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_t_id}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_t_id}/attestation-requests"
              payload: { provider_id: "${prov_t_id}" }
              as: DataSteward
              captures: { reqt_id: $.data.id }
            - call: "POST /pdm/attestation-requests/${reqt_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/attestation-requests/${reqt_id}/respond"
              payload: { attestation_outcome: "CORRECTED" }
              as: ProviderContact
          assert:
            - "response error_id == ERR_ATTESTATION_WINDOW_CLOSED (temporal outranks missing-payload constraint)"
            - "AttestationRequest.status remains SENT (sweep not yet run)"

  # ===================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT
  # metrics reached through DISTINCT endpoints.
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: attestation_suspend_threshold_exactly_two
        grounds:
          - calculations.attestation_escalation
          - state_machines.Provider.transitions
        distinguishing_aspect: |
          Metric = consecutive expiry count; boundary is inclusive >= 2.
          Escalating after exactly ONE expiry leaves provider ACTIVE;
          escalating after exactly TWO suspends. Reached via
          POST /pdm/attestation-requests/{id}/escalate.
        test_recipe:
          setup:
            - "Provider P; first request expired and escalated (count=1)"
            - "Second request expired but not yet escalated"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_b_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CB", window_days: 5 }
              as: DataSteward
              captures: { camp_b_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_b_id}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_b_id}/attestation-requests"
              payload: { provider_id: "${prov_b_id}" }
              as: DataSteward
              captures: { reqb1_id: $.data.id }
            - call: "POST /pdm/attestation-requests/${reqb1_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/attestation-requests/sweep"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-requests/${reqb1_id}/escalate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /pdm/providers/${prov_b_id}"
              payload: {}
              as: DataSteward
              captures: { prov_b_status: $.data.lifecycle_status }
          assert:
            - "Provider.lifecycle_status == ACTIVE after exactly ONE escalation (boundary not yet crossed)"

      - name: distribution_floor_exactly_at_threshold
        grounds:
          - calculations.distribution_snapshot_selection
          - calculations.data_quality_scoring
        distinguishing_aspect: |
          Metric = quality score vs required_quality_floor (inclusive >=).
          A provider whose score equals the floor IS included; one point
          below is excluded. Distinct endpoint
          (POST /pdm/distribution-batches/{id}/publish) and distinct metric
          (score, not expiry count).
        test_recipe:
          setup:
            - "Provider P1 with current_quality_score == floor (70) and provider P2 with 69"
            - "CLAIMS target floor=70"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_f1_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { prov_f2_id: $.data.id }
            - call: "POST /pdm/distribution-targets"
              payload: { target_code: "CLAIMS", endpoint_uri: "sftp://c", required_quality_floor: 70 }
              as: DistributionOperator
              captures: { tgt_f_id: $.data.id }
          trigger:
            - call: "POST /pdm/distribution-batches"
              payload: { distribution_target_id: "${tgt_f_id}" }
              as: DistributionOperator
              captures: { batch_f_id: $.data.id }
            - call: "POST /pdm/distribution-batches/${batch_f_id}/publish"
              payload: {}
              as: DistributionOperator
            - call: "GET /pdm/distribution-batches/${batch_f_id}/items"
              payload: {}
              as: DistributionOperator
          assert:
            - "Provider at exactly score==floor appears as ADD item (inclusive boundary)"
            - "Provider at floor-1 is absent from the item list"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across
  # DIFFERENT entity pairs.
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: roster_file_parse_depends_on_source_active
        grounds:
          - state_machines.RosterFile.transitions (RECEIVED->PARSED)
          - entities.RosterSource.fields.status
        distinguishing_aspect: |
          Pair = RosterFile -> RosterSource. Parse is rejected with
          ERR_SOURCE_NOT_ACTIVE when the source is SUSPENDED; the file
          itself is in a perfectly valid from-state.
        test_recipe:
          setup:
            - "Source S SUSPENDED; file F in RECEIVED naming S"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_X", display_name: "X", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_x_id: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_x_id}", external_file_ref: "xf1", declared_row_count: 0, checksum: "x001" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { xf_id: $.data.id }
            - call: "POST /pdm/roster-files/${xf_id}/reject"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-sources/${src_x_id}/suspend"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_x_id}", external_file_ref: "xf2", declared_row_count: 0, checksum: "x002" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
          trigger:
            - call: "POST /pdm/roster-files/${xf_id}/parse"
              payload: {}
              as: IntakeOperator
              captures: { parse_err: $.data.error_id }
          assert:
            - "Registering the second file failed with ERR_SOURCE_NOT_ACTIVE (source not ACTIVE)"
            - "RosterFile.${xf_id}.status remains RECEIVED"

      - name: attestation_send_depends_on_campaign_open
        grounds:
          - state_machines.AttestationRequest.transitions (DRAFT->SENT)
          - entities.AttestationCampaign.fields.status
        distinguishing_aspect: |
          Pair = AttestationRequest -> AttestationCampaign (different pair
          from instance 1). Send is rejected with ERR_CAMPAIGN_NOT_OPEN when
          the campaign is DRAFT or CLOSED even though the request itself is
          DRAFT and the provider ACTIVE.
        test_recipe:
          setup:
            - "Campaign in DRAFT (never opened); request created against an ACTIVE provider"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_s_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CS", window_days: 5 }
              as: DataSteward
              captures: { camp_s_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_s_id}/attestation-requests"
              payload: { provider_id: "${prov_s_id}" }
              as: DataSteward
              captures: { reqs_id: $.data.id }
          trigger:
            - call: "POST /pdm/attestation-requests/${reqs_id}/send"
              payload: {}
              as: DataSteward
              captures: { send_err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAMPAIGN_NOT_OPEN"
            - "AttestationRequest.status remains DRAFT"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with
  # DIFFERENT interval semantics on DIFFERENT resources.
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: attribute_interval_adjacency_no_supersede
        grounds:
          - calculations.attribute_effective_dating
          - entities.ProviderAttribute.fields.term_date
        distinguishing_aspect: |
          Interval semantics = half-open [effective, term) with ADJACENCY
          allowed: incoming effective_date == existing term_date is NOT an
          overlap (no supersede, no conflict). Resource = ProviderAttribute
          timeline for a (provider, group, key).
        test_recipe:
          setup:
            - "Provider P; attribute A1 [2026-01-01, 2026-06-01) ACTIVE"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_O", display_name: "O", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_o_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_o_id: $.data.id }
            - call: "POST /pdm/providers/${prov_o_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01", term_date: "2026-06-01" }
              as: DataSteward
              captures: { attr_o1_id: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${prov_o_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-06-01" }
              as: DataSteward
              captures: { attr_o2_id: $.data.id }
          assert:
            - "A1 remains ACTIVE with term_date 2026-06-01 (NOT superseded)"
            - "A2 ACTIVE with effective_date 2026-06-01 — adjacency accepted"

      - name: attestation_inflight_window_overlap_rejected
        grounds:
          - validations[priority=22]
          - state_machines.AttestationRequest
        distinguishing_aspect: |
          Interval semantics = OCCUPANCY window (not geometric half-open
          merge): while ANY AttestationRequest for the provider is in SENT
          or ESCALATED, the entire logical time span until it terminates is
          'occupied' — a second send is rejected regardless of dates. This
          is aggregate-capacity semantics (capacity=1), different from the
          half-open interval arithmetic in instance 1. Resource = provider's
          attestation channel.
        test_recipe:
          setup:
            - "Provider P with request R1 in SENT"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_w_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CW", window_days: 5 }
              as: DataSteward
              captures: { camp_w_id: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_w_id}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_w_id}/attestation-requests"
              payload: { provider_id: "${prov_w_id}" }
              as: DataSteward
              captures: { reqw1_id: $.data.id }
            - call: "POST /pdm/attestation-requests/${reqw1_id}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_w_id}/attestation-requests"
              payload: { provider_id: "${prov_w_id}" }
              as: DataSteward
              captures: { reqw2_id: $.data.id }
          trigger:
            - call: "POST /pdm/attestation-requests/${reqw2_id}/send"
              payload: {}
              as: DataSteward
              captures: { send2_err: $.data.error_id }
          assert:
            - "response error_id == ERR_ATTESTATION_ALREADY_INFLIGHT"
            - "AttestationRequest.${reqw2_id}.status remains DRAFT"

  # ===================================================================
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT
  # conserved quantities.
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: attribute_timeline_no_gap_no_overlap
        grounds:
          - calculations.attribute_effective_dating
          - entities.ProviderAttribute
        distinguishing_aspect: |
          Conserved quantity = timeline coverage. Any forward insert plus
          its compensating supersede/void MUST leave the multiset of ACTIVE
          intervals for a (provider, group, key) with zero overlap and zero
          unintended gap: sum of interval lengths is preserved modulo the
          inserted span, and no two ACTIVE intervals overlap.
        test_recipe:
          setup:
            - "Provider P; A1 [2026-01-01, +inf) value V1 ACTIVE"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "SRC_I", display_name: "I", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_i_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_i_id: $.data.id }
            - call: "POST /pdm/providers/${prov_i_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01" }
              as: DataSteward
              captures: { attr_i1_id: $.data.id }
          trigger:
            - call: "POST /pdm/providers/${prov_i_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-06-01" }
              as: DataSteward
              captures: { attr_i2_id: $.data.id }
            - call: "GET /pdm/providers/${prov_i_id}/attributes"
              payload: {}
              as: DataSteward
          assert:
            - "Exactly two ACTIVE intervals exist: [2026-01-01, 2026-06-01) V1 and [2026-06-01, +inf) V2"
            - "The union covers [2026-01-01, +inf) with no overlap and no gap"

      - name: merge_preserves_provider_count_minus_one
        grounds:
          - state_machines.Provider.transitions (ACTIVE->MERGED)
          - entities.ProviderMergeRecord
        distinguishing_aspect: |
          Conserved quantity = provider population accountability (distinct
          from timeline coverage). A merge plus its compensating survivor
          re-score MUST leave count(ACTIVE) + count(SUSPENDED) + count(MERGED)
          + count(TERMINATED) unchanged AND count(ACTIVE) reduced by exactly
          1; no attribute, alias, or conflict record is dropped — only
          re-pointed.
        test_recipe:
          setup:
            - "Two ACTIVE providers A (survivor) and B (merged candidate), each with one attribute"
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { prov_m1_id: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { prov_m2_id: $.data.id, prov_m2_v: $.data.version }
            - call: "POST /pdm/providers/${prov_m1_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "A1", effective_date: "2026-01-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${prov_m2_id}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "B1", effective_date: "2026-01-01" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/provider-merges"
              payload: { survivor_provider_id: "${prov_m1_id}", merged_provider_id: "${prov_m2_id}", rationale: "dup", expected_provider_version: "${prov_m2_v}" }
              as: DataSteward
              captures: { merge_rec_id: $.data.id }
            - call: "GET /pdm/providers/${prov_m1_id}/attributes"
              payload: {}
              as: DataSteward
          assert:
            - "Provider.${prov_m2_id}.lifecycle_status == MERGED and merged_into_provider_id == ${prov_m1_id}"
            - "Survivor attribute list now contains both A1 and B1 (count == 2; nothing dropped)"
            - "Total provider rows in the system unchanged (2) — MERGED is a status, not a deletion"
