            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
