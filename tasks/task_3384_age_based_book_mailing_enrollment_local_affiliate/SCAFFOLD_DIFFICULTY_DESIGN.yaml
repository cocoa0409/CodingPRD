              payload: { new_address: { line1: "9 Maple Ave", city: "Nashville", region: "TN", postal_code: "37210", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { ac1_id: $.data.id }
          trigger:
            - call: "POST /library/address-changes/${ac1_id}/decide"
              payload: { outcome: "APPROVE" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          assert:
            - "before the trigger: Child.${c1_id}.enrollment_status == UNDELIVERABLE_HOLD and consecutive_returns == 1"
            - "AddressChange.${ac1_id}.status == APPLIED_IN_AREA (prefix 37210 -> 372 is in affiliate prefixes)"
            - "after: Child.${c1_id}.enrollment_status == ACTIVE and consecutive_returns == 0"
            - "after: Child.${c1_id}.mailing_address.line1 == \"9 Maple Ave\" and postal_prefix == \"372\""
            - "Affiliate.${aff_a_id}.enrolled_count == 3 throughout (hold never removes the child from enrollment)"

