              payload: {}
              as: OfficeManager
              captures: { l2: "$.data[0].id" }
            - call: "POST /brokerage/disbursement-legs/${l2}/authorize"
              payload: {}
              as: OfficeManager
              as_user_id: "om-1"
            - call: "POST /brokerage/disbursement-legs/${l2}/release"
              payload: {}
