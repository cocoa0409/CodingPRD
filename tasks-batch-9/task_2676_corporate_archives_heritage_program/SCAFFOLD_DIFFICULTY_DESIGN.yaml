  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: migration_approve_state_priority_beats_budget_fiscal_priority
        grounds:
          - validations[priority=20]
          - validations[priority=50]
          - errors.ERR_JOB_STATE_INVALID
          - errors.ERR_PRESERVATION_BUDGET_EXCEEDED
          - calculations.preservation_budget_conservation
        distinguishing_aspect: |
          Pits category `state` (priority 20, 409) against category `business_fiscal`
          (priority 50, 422) on POST /migration-jobs/{id}/approve. The plan's budget is
          exactly the job's cost, so the first approval consumes it entirely; a second
          approval of the SAME job violates both rules at once — the job is no longer
          PENDING_APPROVAL and committing again would take the plan to 350532 against a
          175266 ceiling. Only ERR_JOB_STATE_INVALID (409) may surface. The paired
          categories here are state/business_fiscal; the partner instance pairs
          business_referential/business_constraint, so no category repeats.
        test_recipe:
          setup:
            - "An ACTIVE PreservationPlan with budget_cents exactly 175266."
            - "One MigrationJob for MAGNETIC_TAPE, 40 units, FAIR condition, committed_cost_cents 175266, requested by preserv-a."
            - "The job has already been approved once by preserv-b, so job.status == APPROVED and plan.budget_committed_cents == 175266 (equality is permitted by priority 50)."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "PRI-01", retention_years: 18, disposition_action: "TRANSFER", legal_citation: "Preservation Policy 5.9", min_appraisal_score_for_permanent: 71.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Broadcast Master Tapes", business_unit: "COMMS", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 22, earliest_record_year: 1984, latest_record_year: 2003 }
              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "AV-COLD-2", temperature_c: 10.5, relative_humidity_pct: 33.0, max_overlapping_migration_jobs: 3 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Broadcast Unit", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 40 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "MASTER-PALLET", unit_count: 40, condition_grade: "FAIR", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Broadcast unit transfer with master log", transfer_instrument_reference: "IT-2026-083" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /preservation-plans"
              payload: { storage_zone_id: "${zone_id}", plan_name: "Master Tape Reformatting", budget_cents: 175266 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { plan_id: $.data.id }
            - call: "POST /preservation-plans/${plan_id}/activate"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${item_id}", target_format: "PRESERVATION_MKV", units: 40, window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { job_id: $.data.id }
            - call: "POST /migration-jobs/${job_id}/approve"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
          trigger:
            - call: "POST /migration-jobs/${job_id}/approve"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_JOB_STATE_INVALID"
            - "error_id != ERR_PRESERVATION_BUDGET_EXCEEDED"
            - "MigrationJob.${job_id}.status == APPROVED"
            - "PreservationPlan.${plan_id}.budget_committed_cents == 175266"
            - "PreservationPlan.${plan_id}.budget_spent_cents == 0"

      - name: access_approve_referential_priority_beats_risk_threshold_constraint
        grounds:
          - validations[priority=33]
          - validations[priority=48]
          - errors.ERR_FINDING_AID_NOT_PUBLISHED
          - errors.ERR_RISK_THRESHOLD_REQUIRES_REDACTION
          - calculations.confidentiality_risk_score
        distinguishing_aspect: |
          Pits category `business_referential` (priority 33) against category
          `business_constraint` (priority 48) on POST /access-requests/{id}/approve —
          two rules that share HTTP 422, so the discriminator is the error_id alone and
          a naive implementation that checks the risk score first is caught. The request
          cites a DRAFT finding aid AND its POST_SCREEN score is 45 + 35 = 80, at or
          above RISK_REDACTION_THRESHOLD 75, so FULL scope is doubly illegal; only
          ERR_FINDING_AID_NOT_PUBLISHED may surface. Different category pair from the
          partner instance, which contrasts state against business_fiscal across two
          different HTTP statuses.
        test_recipe:
          setup:
            - "A RecordSeries with sensitivity_ceiling CONFIDENTIAL holding one ACCESSIONED ArchivalItem with sensitivity_level CONFIDENTIAL."
            - "A FindingAid on the same accession left in DRAFT (never submitted for review, never published)."
            - "A MEDIA-class Requester with nda_on_file false."
