              as: Public
              captures: { c2: $.data.id }
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Hana Ito", speaker_affiliation: "COMMUNITY", requested_minutes: 1 }
              as: Public
              captures: { c3: $.data.id }
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Iris Vega", speaker_affiliation: "STUDENT", requested_minutes: 1 }
              as: Public
              captures: { c4: $.data.id }
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
