scenario: "Physician Compensation & wRVU Plan Administration (medical group compensation office): production capture & wRVU crediting rules by CPT, base salary vs productivity tier & threshold, quality/citizenship bonus components & measurement, advanced-practice-provider supervision credit allocation, fair-market-value & regulatory compliance review, mid-year true-up & reconciliation, plan change communication & modeling, dispute & data-correction process"

domain_name: physician-comp-wrvu
api_prefix: /comp

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - version_pinning_on_approval
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Physician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier; unique across all physicians"
        constraints: "exactly 10 digits; unique"
      - name: full_name
        type: string
        source: input
        description: "Physician or APP display name"
      - name: specialty
        type: string
        source: input
        description: "Primary specialty code (free-form, e.g. FM, IM, APP-NP)"
      - name: provider_type
        type: enum
        source: input
        description: "PHYSICIAN (can supervise, holds comp agreement) or APP (advanced-practice provider; production can generate supervision credits)"
        constraints: "one of {PHYSICIAN, APP}"
      - name: fte
        type: number
        source: input
        description: "Clinical full-time-equivalent fraction used to prorate tier thresholds"
        constraints: "0 < fte <= 1.0"
      - name: hire_date
        type: string
        source: input
        description: "Hire date, ISO 8601 date (YYYY-MM-DD)"

  - name: CompPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Plan display name, e.g. 'FY2026 Physician Productivity Plan'"
      - name: fiscal_year_start
        type: string
        source: input
        description: "Fiscal year start date (YYYY-MM-DD), inclusive"
      - name: fiscal_year_end
        type: string
        source: input
        description: "Fiscal year end date (YYYY-MM-DD), inclusive; must be after fiscal_year_start"
      - name: credit_attribution_mode
        type: enum
        source: input
        description: "Which date assigns a validated capture's credited_period"
        default: SERVICE_DATE
        constraints: "one of {SERVICE_DATE, POSTING_DATE}"
      - name: quality_model
        type: enum
        source: input
        description: "Quality bonus scoring variant applied at scorecard finalization"
        default: ALL_OR_NOTHING
        constraints: "one of {ALL_OR_NOTHING, SLIDING_SCALE}"
      - name: tiers
        type: array
        source: input
        description: "Ordered productivity tiers; each element {tier_code: string, threshold_wrvu: number, conversion_factor_cents: integer, tier_bonus_cents: integer}. Thresholds are annual wRVU at FTE 1.0 and are prorated by physician fte at calculation time."
        constraints: "at least one tier; first threshold_wrvu must be 0; thresholds strictly increasing"
      - name: quality_pool_cents
        type: integer
        source: input
        description: "Per-period quality bonus pool in cents; a finalized scorecard pays pool x earned_weight / total_weight"
        constraints: ">= 0"
      - name: fmv_cap_cents
        type: integer
        source: input
        description: "Fair-market-value cap on projected annual total compensation (base salary + projected productivity at current YTD pace); enforced at agreement activation"
        constraints: "> 0"
      - name: supersedes_plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; set when this plan is drafted as the successor of an ACTIVE plan. At most one non-terminal successor (status in {DRAFT, PENDING_REVIEW, FMV_APPROVED}) may exist per superseded plan."
        default: null
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state"
        constraints: "one of {DRAFT, PENDING_REVIEW, FMV_APPROVED, ACTIVE, SUPERSEDED, CLOSED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of activation; null until ACTIVE"

  - name: CptRate
    parent: CompPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; owning plan (path-scoped at creation)"
      - name: cpt_code
        type: string
        source: input
        description: "CPT/HCPCS procedure code this rate row prices"
      - name: wrvu_value
        type: number
        source: input
        description: "wRVU value per unit of this CPT code"
        constraints: ">= 0; up to 3 decimal places"
      - name: effective_from
        type: string
        source: input
        description: "Window start date (YYYY-MM-DD), inclusive; half-open interval [effective_from, effective_to) matched against capture service_date"
      - name: effective_to
        type: string
        source: input
        description: "Window end date (YYYY-MM-DD), exclusive; must be strictly after effective_from"

  - name: PhysicianAgreement
    parent: null
    common_fields: true
    fields:
      - name: physician_id
        type: string
        source: input
        description: "FK -> Physician.id; the employed physician (provider_type PHYSICIAN or APP)"
      - name: plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; the compensation plan this agreement enrolls the physician into"
      - name: pinned_plan_version
        type: integer
        source: system
        description: "Snapshot of CompPlan.version at agreement creation; version-pinning on approval. Re-pinned to the successor plan's version by repin."
      - name: base_salary_cents
        type: integer
        source: input
        description: "Annual base salary (guarantee) in cents"
        constraints: "> 0"
      - name: period_draw_cents
        type: integer
        source: input
        description: "Monthly guarantee draw paid regardless of productivity; subtracted in statement net settlement"
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: "First date (YYYY-MM-DD) on which production may be captured under this agreement"
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle state"
        constraints: "one of {DRAFT, PENDING_FMV, FMV_APPROVED, EFFECTIVE, AMENDMENT_REQUIRED, TERMINATED}"
      - name: fmv_reviewed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the latest FMV APPROVED decision; null until first approval"
      - name: fmv_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who performed the latest FMV decision"
      - name: fmv_benchmark_percentile
        type: integer
        source: system
        description: "Benchmark percentile recorded at the latest FMV review (0-100)"
      - name: last_fmv_rejected_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the latest FMV REJECTED decision; drives the 30-day cooling-off rule; null if never rejected"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompAnalyst who created the agreement; used for segregation-of-duties checks"
      - name: compliance_hold
        type: boolean
        source: computed
        description: "true when status == EFFECTIVE and logical clock is strictly later than fmv_reviewed_at + 12 months (stale FMV); blocks production capture posting"
      - name: ytd_wrvu_credited
        type: number
        source: computed
        description: "Sum of credited_wrvu over this agreement's captures with credit_status == CREDITED; 2 decimal places"
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of net_payment_cents over this agreement's statements with status == FINALIZED (VOIDED excluded)"
      - name: pending_trueup_adjustment_cents
        type: integer
        source: system
        description: "True-up adjustment waiting to be consumed by the next generated statement; set by TrueUpRun post, reset to 0 at statement generation"
        default: 0

  - name: ProductionCapture
    parent: PhysicianAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PhysicianAgreement.id; agreement the production is posted against (path-scoped)"
      - name: capture_kind
        type: enum
        source: system
        description: "CLINICAL for analyst-posted production; SUPERVISION_CREDIT for system-created allocation copies on a supervisor's agreement"
        constraints: "one of {CLINICAL, SUPERVISION_CREDIT}"
      - name: cpt_code
        type: string
        source: input
        description: "CPT code of the service; 'SUPV' on system-created supervision-credit captures"
      - name: units
        type: integer
        source: input
        description: "Units of service"
        constraints: ">= 1"
      - name: service_date
        type: string
        source: input
        description: "Date of service (YYYY-MM-DD); rate resolution and SERVICE_DATE attribution use this"
      - name: posting_date
        type: string
        source: input
        description: "Date the charge was posted (YYYY-MM-DD); POSTING_DATE attribution uses this; defaults to logical clock date at creation"
      - name: wrvu_value_applied
        type: number
        source: system
        description: "CptRate.wrvu_value resolved at validation (rate row covering service_date); snapshot; null on SUPERVISION_CREDIT captures"
      - name: credited_wrvu
        type: number
        source: computed
        description: "round_half_up(units x wrvu_value_applied, 2) for CLINICAL; allocation amount for SUPERVISION_CREDIT; null while credit_status == UNCREDITED"
      - name: credited_period
        type: string
        source: computed
        description: "YYYY-MM bucket assigned per the plan's credit_attribution_mode (service_date month or posting_date month); null while UNCREDITED"
      - name: capture_status
        type: enum
        source: system
        description: "Documentation lifecycle axis, independent of credit_status"
        constraints: "one of {POSTED, VALIDATED, LOCKED, VOIDED}"
      - name: credit_status
        type: enum
        source: system
        description: "Crediting lifecycle axis, independent of capture_status"
        constraints: "one of {UNCREDITED, CREDITED, REVERSED}"
      - name: reversal_of_capture_id
        type: string
        source: system
        description: "FK -> ProductionCapture.id; on a correction replacement capture, the id of the reversed original; null otherwise"
        default: null
      - name: source_capture_id
        type: string
        source: system
        description: "FK -> ProductionCapture.id; on a SUPERVISION_CREDIT capture, the APP clinical capture it was allocated from; null on CLINICAL captures"
        default: null
      - name: reversed_reason
        type: string
        source: system
        description: "Free-text reason recorded when credit_status flips to REVERSED"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompAnalyst who posted the capture (null for system-created SUPERVISION_CREDIT rows); used for segregation-of-duties checks"

  - name: SupervisionAssignment
    parent: null
    common_fields: true
    fields:
      - name: supervisor_physician_id
        type: string
        source: input
        description: "FK -> Physician.id; supervising physician (provider_type must be PHYSICIAN)"
      - name: app_physician_id
        type: string
        source: input
        description: "FK -> Physician.id; supervised advanced-practice provider (provider_type must be APP); must differ from supervisor_physician_id"
      - name: start_date
        type: string
        source: input
        description: "Assignment window start (YYYY-MM-DD), inclusive; closed interval [start_date, end_date]"
      - name: end_date
        type: string
        source: input
        description: "Assignment window end (YYYY-MM-DD), inclusive; must be >= start_date"
      - name: credit_pct
        type: number
        source: input
        description: "Fraction of the APP's credited wRVU allocated to this supervisor per qualifying capture"
        constraints: "0 < credit_pct <= 1; up to 4 decimal places; overlapping windows for the same APP must have credit_pct sums <= 1.0"
      - name: supervised_fte
        type: number
        source: input
        description: "APP FTE counted against the supervisor's supervision capacity"
        constraints: "0 < supervised_fte <= 1.0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE until explicitly ended early; window end alone does not change status but bounds allocation"
        constraints: "one of {ACTIVE, ENDED}"

  - name: QualityScorecard
    parent: PhysicianAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PhysicianAgreement.id; owning agreement (path-scoped)"
      - name: period
        type: string
        source: input
        description: "Measurement period, format YYYY-MM; unique per agreement"
      - name: measures
        type: array
        source: input
        description: "Array of {measure_code: string, weight: integer (>0), threshold_score: number (0-100), score: number (0-100)}"
        constraints: "at least one measure; measure_code unique within the scorecard"
      - name: quality_bonus_cents
        type: integer
        source: computed
        description: "Bonus computed at finalization per the plan's quality_model; null while DRAFT"
      - name: status
        type: enum
        source: system
        description: "DRAFT until finalized; finalization is irreversible"
        constraints: "one of {DRAFT, FINALIZED}"

  - name: CompStatement
    parent: PhysicianAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PhysicianAgreement.id; owning agreement (path-scoped)"
      - name: period_year
        type: integer
        source: input
        description: "Statement period year (e.g. 2026); with period_month forms the period bucket; unique per agreement"
      - name: period_month
        type: integer
        source: input
        description: "Statement period month 1-12"
        constraints: "1 <= period_month <= 12"
      - name: capture_ids
        type: array
        source: computed
        description: "Ids of CREDITED captures included in period_wrvu (credited_period == this period)"
      - name: period_wrvu
        type: number
        source: computed
        description: "Sum of credited_wrvu over included captures; 2 decimal places"
      - name: ytd_wrvu_at_close
        type: number
        source: computed
        description: "Sum of credited_wrvu over CREDITED captures with credited_period <= this period; tier attainment basis"
      - name: tier_attained
        type: string
        source: computed
        description: "tier_code of the highest tier whose fte-prorated threshold_wrvu <= ytd_wrvu_at_close (inclusive >=)"
      - name: tier_bonus_cents
        type: integer
        source: computed
        description: "Flat bonus of the attained tier, paid only if no prior non-VOIDED statement for this agreement attained the same or a higher tier; else 0"
      - name: productivity_earned_ytd_cents
        type: integer
        source: computed
        description: "Marginal tiered earnings on ytd_wrvu_at_close at fte-prorated thresholds"
      - name: period_productivity_cents
        type: integer
        source: computed
        description: "productivity_earned_ytd_cents minus sum of period_productivity_cents over all prior non-VOIDED statements (chronological cumulative delta; may go negative after reversals)"
      - name: quality_bonus_cents
        type: integer
        source: computed
        description: "quality_bonus_cents of the FINALIZED QualityScorecard whose period matches this statement period; 0 when none exists"
      - name: period_draw_cents
        type: integer
        source: computed
        description: "Snapshot of agreement.period_draw_cents at generation"
      - name: trueup_adjustment_cents
        type: integer
        source: computed
        description: "Snapshot of agreement.pending_trueup_adjustment_cents at generation (never recomputed from this statement's own fields)"
      - name: net_payment_cents
        type: integer
        source: computed
        description: "period_productivity_cents + tier_bonus_cents + quality_bonus_cents + trueup_adjustment_cents - period_draw_cents; negative allowed (receivable)"
      - name: status
        type: enum
        source: system
        description: "Statement approval-chain state"
        constraints: "one of {DRAFT, UNDER_REVIEW, FINALIZED, VOIDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompAnalyst who generated the statement; finalize requires a different user"

  - name: TrueUpRun
    parent: CompPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; plan being reconciled (path-scoped)"
      - name: as_of_period
        type: string
        source: input
        description: "Reconciliation cutoff, format YYYY-MM; captures and statements with period <= this are replayed"
      - name: adjustments
        type: array
        source: computed
        description: "Per-agreement variance list [{agreement_id, variance_cents}] computed at creation; variance = recomputed earned YTD minus recognized period productivity"
      - name: status
        type: enum
        source: system
        description: "COMPUTED at creation; POSTED applies adjustments; VOIDED discards them"
        constraints: "one of {COMPUTED, POSTED, VOIDED}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: filer_physician_id
        type: string
        source: system
        description: "FK -> Physician.id; taken from the Physician role's X-User-ID header at creation"
      - name: agreement_id
        type: string
        source: system
        description: "FK -> PhysicianAgreement.id; resolved from the disputed subject's owning agreement"
      - name: subject_type
        type: enum
        source: input
        description: "Which entity kind is disputed (polymorphic subject)"
        constraints: "one of {CAPTURE, STATEMENT}"
      - name: subject_capture_id
        type: string
        source: input
        description: "FK -> ProductionCapture.id; required iff subject_type == CAPTURE; capture must belong to the filer's agreement"
        default: null
      - name: subject_statement_id
        type: string
        source: input
        description: "FK -> CompStatement.id; required iff subject_type == STATEMENT; statement must belong to the filer's agreement"
        default: null
      - name: reason
        type: string
        source: input
        description: "Filer's free-text dispute reason"
      - name: corrected_units
        type: integer
        source: input
        description: "Corrected unit count, recorded when review requests a data correction"
      - name: corrected_cpt_code
        type: string
        source: input
        description: "Corrected CPT code, recorded when review requests a data correction"
      - name: status
        type: enum
        source: system
        description: "Dispute workflow state; DATA_CORRECTION may cycle back to UNDER_REVIEW"
        constraints: "one of {FILED, UNDER_REVIEW, DATA_CORRECTION, RESOLVED_ACCEPTED, RESOLVED_REJECTED}"
      - name: resolution
        type: enum
        source: system
        description: "Recorded decision at resolve time"
        constraints: "one of {ACCEPTED, REJECTED}"
      - name: resolver_user_id
        type: string
        source: system
        description: "X-User-ID of the CompCommittee member who resolved the dispute"

  - name: PlanChangeRequest
    parent: CompPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; the ACTIVE plan being changed"
      - name: successor_plan_id
        type: string
        source: input
        description: "FK -> CompPlan.id; replacement plan, must be FMV_APPROVED and have supersedes_plan_id == plan_id"
      - name: effective_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) on which the change may be activated; communicate requires it to be strictly after the logical clock date"
      - name: summary
        type: string
        source: input
        description: "Physician-facing description of the plan change"
      - name: status
        type: enum
        source: system
        description: "Plan-change workflow state; COMMUNICATED may revert to MODELED via revise (which clears acknowledgments)"
        constraints: "one of {PROPOSED, MODELED, COMMUNICATED, EFFECTIVE, WITHDRAWN}"
      - name: modeled_delta_cents
        type: integer
        source: computed
        description: "What-if projection computed at model time: sum over the plan's EFFECTIVE/AMENDMENT_REQUIRED agreements of (projected annual comp under successor config minus under current config), using annualized average period_wrvu over each agreement's FINALIZED statements (agreements with no FINALIZED statement contribute 0 delta)"
      - name: acknowledged_physician_ids
        type: array
        source: system
        description: "Physician ids that have acknowledged the communicated change; cleared on revise"

state_machines:
  - entity: CompPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /comp/comp-plans/{id}/submit-review"
        actor: CompAnalyst
        preconditions:
          - "plan.status == DRAFT"
          - "plan has at least one CptRate row"
        side_effects:
          - "increments CompPlan.version by 1"
      - from: PENDING_REVIEW
        to: FMV_APPROVED
        trigger: "POST /comp/comp-plans/{id}/review-decision with decision=APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == PENDING_REVIEW"
        side_effects:
          - "increments CompPlan.version by 1"
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /comp/comp-plans/{id}/review-decision with decision=REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == PENDING_REVIEW"
        side_effects:
          - "increments CompPlan.version by 1"
        note: "Review rejection reverts the plan to DRAFT for editing (branching with revert)."
      - from: FMV_APPROVED
        to: ACTIVE
        trigger: "POST /comp/comp-plans/{id}/activate"
        actor: CompCommittee
        preconditions:
          - "plan.status == FMV_APPROVED"
          - "plan has at least one CptRate row"
        side_effects:
          - "sets plan.activated_at to the logical clock timestamp"
          - "increments CompPlan.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from POST /comp/plan-change-requests/{id}/activate"
        actor: system
        preconditions:
          - "a PlanChangeRequest referencing this plan as plan_id transitions to EFFECTIVE"
        side_effects:
          - "every PhysicianAgreement with plan_id == this plan and status == EFFECTIVE transitions to AMENDMENT_REQUIRED (hop 2)"
          - "each agreement that flipped to AMENDMENT_REQUIRED voids its own CompStatements with status == DRAFT (hop 3: DRAFT -> VOIDED, no cash impact since DRAFT statements never paid)"
          - "increments CompPlan.version by 1 and increments each touched PhysicianAgreement.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /comp/comp-plans/{id}/close"
        actor: CompCommittee
        preconditions:
          - "plan.status == ACTIVE"
          - "no PhysicianAgreement with plan_id == this plan has status in {DRAFT, PENDING_FMV, FMV_APPROVED, EFFECTIVE, AMENDMENT_REQUIRED}"
        side_effects:
          - "increments CompPlan.version by 1"

  - entity: PhysicianAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_FMV
        trigger: "POST /comp/physician-agreements/{id}/submit-fmv"
        actor: CompAnalyst
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.last_fmv_rejected_at is null or the logical clock date is at least 30 days after it (FMV cooling-off)"
        side_effects:
          - "increments PhysicianAgreement.version by 1"
      - from: EFFECTIVE
        to: PENDING_FMV
        trigger: "POST /comp/physician-agreements/{id}/submit-fmv (re-review cycle)"
        actor: CompAnalyst
        preconditions:
          - "agreement.status == EFFECTIVE"
          - "agreement.last_fmv_rejected_at is null or the logical clock date is at least 30 days after it"
        side_effects:
          - "increments PhysicianAgreement.version by 1"
        note: "Re-review loop: an EFFECTIVE agreement re-enters FMV review (e.g., to cure a compliance hold); while PENDING_FMV it cannot accept new production captures."
      - from: PENDING_FMV
        to: FMV_APPROVED
        trigger: "POST /comp/physician-agreements/{id}/fmv-review with decision=APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == PENDING_FMV"
          - "reviewer X-User-ID != agreement.created_by_user_id (segregation of duties)"
        side_effects:
          - "sets agreement.fmv_reviewed_at to the logical clock timestamp, fmv_reviewer_user_id to the reviewer id, fmv_benchmark_percentile from the request"
          - "increments PhysicianAgreement.version by 1"
      - from: PENDING_FMV
        to: DRAFT
        trigger: "POST /comp/physician-agreements/{id}/fmv-review with decision=REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "agreement.status == PENDING_FMV"
          - "reviewer X-User-ID != agreement.created_by_user_id (segregation of duties)"
        side_effects:
          - "sets agreement.last_fmv_rejected_at to the logical clock timestamp (starts the 30-day cooling-off window)"
          - "increments PhysicianAgreement.version by 1"
      - from: FMV_APPROVED
        to: EFFECTIVE
        trigger: "POST /comp/physician-agreements/{id}/activate"
        actor: CompCommittee
        preconditions:
          - "agreement.status == FMV_APPROVED"
          - "referenced CompPlan.status == ACTIVE (cross-entity dependency)"
          - "logical clock <= agreement.fmv_reviewed_at + 12 months (FMV freshness)"
          - "base_salary_cents + projected annual productivity at current YTD pace <= plan.fmv_cap_cents (fiscal cap)"
        side_effects:
          - "increments PhysicianAgreement.version by 1"
      - from: EFFECTIVE
        to: AMENDMENT_REQUIRED
        trigger: "system cascade: referenced CompPlan transitions ACTIVE -> SUPERSEDED"
        actor: system
        preconditions:
          - "agreement.status == EFFECTIVE and agreement.plan_id == the superseded plan"
        side_effects:
          - "voids this agreement's CompStatements with status == DRAFT (downstream hop)"
          - "increments PhysicianAgreement.version by 1"
      - from: AMENDMENT_REQUIRED
        to: EFFECTIVE
        trigger: "POST /comp/physician-agreements/{id}/repin"
        actor: CompAnalyst
        preconditions:
          - "agreement.status == AMENDMENT_REQUIRED"
          - "an ACTIVE CompPlan exists whose supersedes_plan_id == agreement.plan_id (the successor)"
        side_effects:
          - "sets agreement.plan_id to the successor plan id and agreement.pinned_plan_version to the successor plan's current version"
          - "increments PhysicianAgreement.version by 1"
      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /comp/physician-agreements/{id}/terminate"
        actor: CompCommittee
        preconditions:
          - "agreement.status in {EFFECTIVE, AMENDMENT_REQUIRED}"
        side_effects:
          - "voids this agreement's CompStatements with status == DRAFT"
          - "increments PhysicianAgreement.version by 1"
      - from: AMENDMENT_REQUIRED
        to: TERMINATED
        trigger: "POST /comp/physician-agreements/{id}/terminate"
        actor: CompCommittee
        preconditions:
          - "agreement.status in {EFFECTIVE, AMENDMENT_REQUIRED}"
        side_effects:
          - "voids this agreement's CompStatements with status == DRAFT"
          - "increments PhysicianAgreement.version by 1"

  - entity: ProductionCapture
    initial_state: "capture_status=POSTED, credit_status=UNCREDITED"
    terminal_states: ["capture_status=VOIDED", "credit_status=REVERSED (terminal for the credit axis)"]
    transitions:
      - from: "capture_status=POSTED"
        to: "capture_status=VALIDATED (and credit_status UNCREDITED -> CREDITED)"
        trigger: "POST /comp/production-captures/{id}/validate"
        actor: CompAnalyst
        preconditions:
          - "capture.capture_status == POSTED and capture.credit_status == UNCREDITED"
          - "for CLINICAL captures: a CptRate row exists on the agreement's plan covering (cpt_code, service_date) under half-open [effective_from, effective_to)"
        side_effects:
          - "resolves and snapshots wrvu_value_applied; computes credited_wrvu = round_half_up(units x wrvu_value_applied, 2)"
          - "computes credited_period per the plan's credit_attribution_mode (service_date month for SERVICE_DATE, posting_date month for POSTING_DATE)"
          - "recomputes agreement.ytd_wrvu_credited (ledger sync, bubble up)"
          - "if the agreement's physician has provider_type == APP: for each SupervisionAssignment with app_physician_id == that physician, status == ACTIVE, and start_date <= service_date <= end_date, creates one SUPERVISION_CREDIT ProductionCapture on the supervisor's agreement (capture_status=VALIDATED, credit_status=CREDITED, credited_wrvu = round_half_up(app capture credited_wrvu x credit_pct, 2), source_capture_id = this capture); each created supervisor credit then recomputes the supervisor agreement's ytd_wrvu_credited (second cascade hop)"
          - "increments ProductionCapture.version by 1 and agreement.version by 1"
      - from: "capture_status=POSTED"
        to: "capture_status=VOIDED"
        trigger: "POST /comp/production-captures/{id}/void"
        actor: CompAnalyst
        preconditions:
          - "capture.capture_status == POSTED and capture.credit_status == UNCREDITED"
        side_effects:
          - "increments ProductionCapture.version by 1"
        note: "Voiding is documentation-only; an UNCREDITED capture never entered the ledger, so no compensation is needed."
      - from: "credit_status=CREDITED"
        to: "credit_status=REVERSED"
        trigger: "system cascade from POST /comp/disputes/{id}/resolve with resolution=ACCEPTED on a CAPTURE dispute"
        actor: system
        preconditions:
          - "capture.credit_status == CREDITED"
        side_effects:
          - "sets reversed_reason from the dispute resolution"
          - "recomputes owning agreement.ytd_wrvu_credited (bubble up)"
          - "if this capture is CLINICAL and has SUPERVISION_CREDIT children (source_capture_id == this id): flips each child's credit_status CREDITED -> REVERSED (conditional cascade, hop 2), and each child reversal recomputes the supervisor agreement's ytd_wrvu_credited (hop 3)"
          - "triggers recomputation of any DRAFT CompStatement on the owning agreement whose period matches credited_period"
          - "increments ProductionCapture.version by 1 and owning agreement.version by 1"
      - from: "capture_status=VALIDATED"
        to: "capture_status=LOCKED"
        trigger: "system cascade from POST /comp/comp-statements/{id}/finalize"
        actor: system
        preconditions:
          - "capture is included in the finalized statement (capture_ids)"
        side_effects:
          - "increments ProductionCapture.version by 1"
        note: "LOCKED freezes documentation while credit_status remains CREDITED; the two axes evolve independently (parallel dimensions)."
      - from: "capture_status=LOCKED"
        to: "capture_status=VALIDATED"
        trigger: "system cascade from POST /comp/comp-statements/{id}/void"
        actor: system
        preconditions:
          - "capture is included in the voided statement and credit_status == CREDITED"
        side_effects:
          - "increments ProductionCapture.version by 1"

  - entity: SupervisionAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /comp/supervision-assignments/{id}/end"
        actor: CompAnalyst
        preconditions:
          - "assignment.status == ACTIVE"
          - "payload end_date >= assignment.start_date"
        side_effects:
          - "sets end_date to the payload end_date (early termination shrinks the closed window)"
          - "increments SupervisionAssignment.version by 1"

  - entity: QualityScorecard
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /comp/quality-scorecards/{id}/finalize"
        actor: CompAnalyst
        preconditions:
          - "scorecard.status == DRAFT"
        side_effects:
          - "computes quality_bonus_cents per the plan's quality_model (calculation quality_bonus)"
          - "increments QualityScorecard.version by 1"

  - entity: CompStatement
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /comp/comp-statements/{id}/submit-review"
        actor: CompAnalyst
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "increments CompStatement.version by 1"
      - from: UNDER_REVIEW
        to: FINALIZED
        trigger: "POST /comp/comp-statements/{id}/finalize"
        actor: CompCommittee
        preconditions:
          - "statement.status == UNDER_REVIEW"
          - "no Dispute with agreement_id == statement.agreement_id has status in {FILED, UNDER_REVIEW, DATA_CORRECTION} (cross-entity dependency)"
          - "finalizer X-User-ID != statement.created_by_user_id (segregation of duties)"
        side_effects:
          - "locks each included capture: capture_status VALIDATED -> LOCKED (cascade down)"
          - "recomputes agreement.lifetime_paid_cents to include this statement's net_payment_cents"
          - "increments CompStatement.version by 1 and agreement.version by 1"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /comp/comp-statements/{id}/void (or system cascade: plan supersede / agreement terminate voids only DRAFT statements; ACCEPTED statement dispute voids a FINALIZED statement)"
        actor: CompCommittee
        preconditions:
          - "statement.status == FINALIZED (committee void) or statement.status == DRAFT (system cascade)"
        side_effects:
          - "unlocks included captures with credit_status == CREDITED: capture_status LOCKED -> VALIDATED (compensation)"
          - "recomputes agreement.lifetime_paid_cents to exclude this statement (cash rollback; lifetime_paid returns to its pre-finalize value)"
          - "increments CompStatement.version by 1 and agreement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system cascade: agreement enters AMENDMENT_REQUIRED or TERMINATED"
        actor: system
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "increments CompStatement.version by 1"
        note: "DRAFT statements never paid, so voiding them carries no cash compensation."

  - entity: TrueUpRun
    initial_state: COMPUTED
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: COMPUTED
        to: POSTED
        trigger: "POST /comp/true-up-runs/{id}/post"
        actor: CompCommittee
        preconditions:
          - "run.status == COMPUTED"
        side_effects:
          - "for each adjustment: sets the referenced PhysicianAgreement.pending_trueup_adjustment_cents to variance_cents (overwrite, not accumulate) and increments that agreement.version by 1"
          - "increments TrueUpRun.version by 1"
      - from: COMPUTED
        to: VOIDED
        trigger: "POST /comp/true-up-runs/{id}/void"
        actor: CompAnalyst
        preconditions:
          - "run.status == COMPUTED"
        side_effects:
          - "increments TrueUpRun.version by 1"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /comp/disputes/{id}/start-review"
        actor: CompAnalyst
        preconditions:
          - "dispute.status in {FILED, DATA_CORRECTION}"
        side_effects:
          - "increments Dispute.version by 1"
      - from: DATA_CORRECTION
        to: UNDER_REVIEW
        trigger: "POST /comp/disputes/{id}/start-review (cycle back)"
        actor: CompAnalyst
        preconditions:
          - "dispute.status in {FILED, DATA_CORRECTION}"
        side_effects:
          - "clears corrected_units and corrected_cpt_code"
          - "increments Dispute.version by 1"
        note: "Revision loop: a correction request can be walked back and re-issued any number of times before resolution."
      - from: UNDER_REVIEW
        to: DATA_CORRECTION
        trigger: "POST /comp/disputes/{id}/request-correction"
        actor: CompAnalyst
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "dispute.subject_type == CAPTURE (data corrections apply to captures only)"
        side_effects:
          - "records corrected_units / corrected_cpt_code on the dispute"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_ACCEPTED
        trigger: "POST /comp/disputes/{id}/resolve with resolution=ACCEPTED"
        actor: CompCommittee
        preconditions:
          - "dispute.status in {UNDER_REVIEW, DATA_CORRECTION}"
          - "if subject_type == CAPTURE: resolver X-User-ID != subject capture.created_by_user_id (segregation of duties)"
          - "if resolving from DATA_CORRECTION with a corrected_cpt_code: a CptRate row covers (corrected_cpt_code, original service_date)"
        side_effects:
          - "CAPTURE subject: flips the subject capture CREDITED -> REVERSED (cascade hop 1; its own side effects then recompute the agreement ledger, reverse SUPERVISION_CREDIT children, and refresh DRAFT statements)"
          - "CAPTURE subject resolved from DATA_CORRECTION: additionally creates a replacement CLINICAL capture (capture_status=VALIDATED, credit_status=CREDITED, corrected units/cpt, same service_date/posting_date, reversal_of_capture_id = subject id), which recomputes agreement.ytd_wrvu_credited and, for APP physicians, re-runs supervision allocation"
          - "STATEMENT subject: voids the subject statement FINALIZED -> VOIDED (cash rollback cascade)"
          - "sets resolution=ACCEPTED and resolver_user_id"
          - "increments Dispute.version by 1"
      - from: DATA_CORRECTION
        to: RESOLVED_ACCEPTED
        trigger: "POST /comp/disputes/{id}/resolve with resolution=ACCEPTED"
        actor: CompCommittee
        preconditions:
          - "dispute.status in {UNDER_REVIEW, DATA_CORRECTION}"
          - "resolver X-User-ID != subject capture.created_by_user_id (segregation of duties)"
          - "a CptRate row covers (corrected_cpt_code, original service_date)"
        side_effects:
          - "same cascade as UNDER_REVIEW -> RESOLVED_ACCEPTED, including replacement-capture creation"
          - "sets resolution=ACCEPTED and resolver_user_id"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /comp/disputes/{id}/resolve with resolution=REJECTED"
        actor: CompCommittee
        preconditions:
          - "dispute.status in {UNDER_REVIEW, DATA_CORRECTION}"
        side_effects:
          - "sets resolution=REJECTED and resolver_user_id; no compensation side effects"
          - "increments Dispute.version by 1"
      - from: DATA_CORRECTION
        to: RESOLVED_REJECTED
        trigger: "POST /comp/disputes/{id}/resolve with resolution=REJECTED"
        actor: CompCommittee
        preconditions:
          - "dispute.status in {UNDER_REVIEW, DATA_CORRECTION}"
        side_effects:
          - "sets resolution=REJECTED and resolver_user_id; correction fields remain recorded but are never applied"
          - "increments Dispute.version by 1"

  - entity: PlanChangeRequest
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: MODELED
        trigger: "POST /comp/plan-change-requests/{id}/model"
        actor: CompAnalyst
        preconditions:
          - "pcr.status in {PROPOSED, COMMUNICATED}"
        side_effects:
          - "computes modeled_delta_cents (what-if projection, calculation plan_change_modeling)"
          - "when entered from COMMUNICATED via revise: clears acknowledged_physician_ids (compensation)"
          - "increments PlanChangeRequest.version by 1"
      - from: COMMUNICATED
        to: MODELED
        trigger: "POST /comp/plan-change-requests/{id}/revise"
        actor: CompAnalyst
        preconditions:
          - "pcr.status == COMMUNICATED"
        side_effects:
          - "clears acknowledged_physician_ids (prior acknowledgments are invalidated by the revision)"
          - "increments PlanChangeRequest.version by 1"
      - from: MODELED
        to: COMMUNICATED
        trigger: "POST /comp/plan-change-requests/{id}/communicate"
        actor: CompAnalyst
        preconditions:
          - "pcr.status == MODELED"
          - "pcr.effective_date is strictly after the logical clock date (scheduled action must be future-dated)"
        side_effects:
          - "increments PlanChangeRequest.version by 1"
      - from: COMMUNICATED
        to: COMMUNICATED
        trigger: "POST /comp/plan-change-requests/{id}/acknowledge"
        actor: Physician
        preconditions:
          - "pcr.status == COMMUNICATED"
          - "the acting Physician has a PhysicianAgreement with plan_id == pcr.plan_id and status == EFFECTIVE"
          - "the acting Physician id is not already in acknowledged_physician_ids"
        side_effects:
          - "appends the physician id to acknowledged_physician_ids"
          - "increments PlanChangeRequest.version by 1"
        note: "Self-transition records acknowledgment; the state value does not change."
      - from: COMMUNICATED
        to: EFFECTIVE
        trigger: "POST /comp/plan-change-requests/{id}/activate"
        actor: CompCommittee
        preconditions:
          - "pcr.status == COMMUNICATED"
          - "logical clock date >= pcr.effective_date (scheduled action reached)"
          - "every Physician with an EFFECTIVE agreement on pcr.plan_id appears in acknowledged_physician_ids"
          - "successor plan status == FMV_APPROVED"
        side_effects:
          - "successor plan transitions FMV_APPROVED -> ACTIVE (hop 1a)"
          - "the changed plan transitions ACTIVE -> SUPERSEDED (hop 1b), whose own side effects flip its EFFECTIVE agreements to AMENDMENT_REQUIRED (hop 2) and void their DRAFT statements (hop 3)"
          - "increments PlanChangeRequest.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /comp/plan-change-requests/{id}/withdraw (or system: creating a newer PlanChangeRequest for the same plan)"
        actor: CompAnalyst
        preconditions:
          - "pcr.status in {PROPOSED, MODELED, COMMUNICATED}"
        side_effects:
          - "increments PlanChangeRequest.version by 1"
      - from: MODELED
        to: WITHDRAWN
        trigger: "POST /comp/plan-change-requests/{id}/withdraw"
        actor: CompAnalyst
        preconditions:
          - "pcr.status in {PROPOSED, MODELED, COMMUNICATED}"
        side_effects:
          - "increments PlanChangeRequest.version by 1"
      - from: COMMUNICATED
        to: WITHDRAWN
        trigger: "POST /comp/plan-change-requests/{id}/withdraw"
        actor: CompAnalyst
        preconditions:
          - "pcr.status in {PROPOSED, MODELED, COMMUNICATED}"
        side_effects:
          - "increments PlanChangeRequest.version by 1"

concurrency_rules:
  - rule_id: plan-update-stale-version
    parent_entity: CompPlan
    write_endpoint: "PUT /comp/comp-plans/{id}"
    occ_field: "expected_comp_plan_version"
    description: |
      Updating a CompPlan whose version has advanced since the client last
      observed it is rejected. The loser's view of the plan configuration is
      stale, so the update is refused with 412 rather than applied over
      changes the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pcr-create-stale-plan
    parent_entity: CompPlan
    write_endpoint: "POST /comp/plan-change-requests"
    occ_field: "expected_comp_plan_version"
    description: |
      Creating a PlanChangeRequest against a plan whose version has advanced
      since the client last observed it is rejected. Creating a PCR
      legitimately withdraws any existing PROPOSED/MODELED PCRs for the same
      plan (a create-with-supersede), so a client holding a stale plan
      version would silently supersede a change request it never saw; the
      stale version is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: wrvu_credit
    description: "Per-capture wRVU crediting: rate resolution by service_date, then units x rate; the credited_period bucket is attribution-mode dependent."
    trigger: "POST /comp/production-captures/{id}/validate (also applied synchronously to replacement captures created by dispute resolution and to SUPERVISION_CREDIT captures, which skip rate resolution)"
    algorithm: rate_resolution
    formula: |
      rate = the unique CptRate row r where r.plan_id == agreement.plan_id,
             r.cpt_code == capture.cpt_code,
             and r.effective_from <= capture.service_date < r.effective_to   # half-open
      if no such row: reject with ERR_RATE_NOT_FOUND
      wrvu_value_applied = rate.wrvu_value
      credited_wrvu = round_half_up(capture.units * wrvu_value_applied, 2)
      if plan.credit_attribution_mode == SERVICE_DATE:
          credited_period = capture.service_date[0:7]     # "YYYY-MM"
      else:                                                # POSTING_DATE
          credited_period = capture.posting_date[0:7]
    input_set: "The single capture being validated; rate rows of the owning agreement's plan only"
    constants:
      WRVU_DECIMALS: 2
      ROUNDING: round_half_up
    precision: "credited_wrvu pinned to 2 decimal places, round_half_up, computed per capture (never aggregated before rounding)"
    variants:
      - name: service_date_accrual
        when: "plan.credit_attribution_mode == SERVICE_DATE"
        difference: "credited_period derives from service_date; a capture served 2026-02-10 and posted 2026-03-02 lands in period 2026-02"
      - name: posting_date_cash
        when: "plan.credit_attribution_mode == POSTING_DATE"
        difference: "credited_period derives from posting_date; the identical capture lands in period 2026-03, shifting tier attainment and statement inclusion by one month"

  - name: productivity_payout
    description: "Marginal tiered productivity earnings on YTD credited wRVU, with tier thresholds prorated by physician FTE."
    trigger: "CompStatement generation (POST /comp/physician-agreements/{id}/comp-statements) and TrueUpRun creation"
    algorithm: tiered_pricing
    formula: |
      F = agreement.physician.fte
      Y = ytd_wrvu_at_close   # LOCKED BASIS: sum of period_wrvu over this agreement's FINALIZED
      # statements (locked at their finalized values, immune to later reversals)
      # PLUS credited_wrvu of captures with credit_status == CREDITED whose
      # credited_period is NOT covered by any FINALIZED statement and <= this period
      earned_ytd = 0
      for i, tier in enumerate(plan.tiers ordered by threshold_wrvu ASC):
          floor_i = tier.threshold_wrvu * F
          cap_i   = (tiers[i+1].threshold_wrvu * F) if i+1 < len(tiers) else +infinity
          wrvu_in_tier = max(0, min(Y, cap_i) - floor_i)
          earned_ytd += wrvu_in_tier * tier.conversion_factor_cents
      productivity_earned_ytd_cents = round_half_up(earned_ytd, 0)
      # marginal, not average: only wRVUs inside a tier earn that tier's conversion factor
      tier_attained = the tier_code of the highest tier with floor_i <= Y   (inclusive >=)
      tier_bonus_cents = tier_attained.tier_bonus_cents
                         if no prior non-VOIDED statement of this agreement attained
                         the same or higher tier, else 0
      period_productivity_cents = productivity_earned_ytd_cents
          - sum(prior.period_productivity_cents for prior in statements of this agreement
                with status != VOIDED and (period_year, period_month) < this period)
    input_set: "Locked basis = period_wrvu of this agreement's FINALIZED statements (frozen; later reversals in those periods do NOT alter them) + captures with credit_status == CREDITED in periods with no FINALIZED statement (REVERSED and UNCREDITED excluded); prior statements with status in {DRAFT, UNDER_REVIEW, FINALIZED} (VOIDED excluded) for the cumulative delta"
    constants:
      TIER_ORDER: "thresholds strictly increasing; first threshold 0"
      BONUS_RULE: "flat tier bonus paid once per attained tier level per agreement"
    precision: "integer cents; wRVU inputs carry 2 decimals; round_half_up to whole cents at the end"
    variants:
      - name: fte_prorated
        when: "physician.fte < 1.0"
        difference: "tier floors and caps scale by F (e.g. F=0.8 turns a 5000-wRVU threshold into 4000); conversion factors and bonuses are NOT prorated"

  - name: quality_bonus
    description: "Quality/citizenship bonus from a scorecard's weighted measures; two scoring models produce different payouts for identical scores."
    trigger: "POST /comp/quality-scorecards/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      total_weight = sum(m.weight for m in scorecard.measures)
      if plan.quality_model == ALL_OR_NOTHING:
          earned_weight = sum(m.weight for m in measures if m.score >= m.threshold_score)
      else:  # SLIDING_SCALE
          earned_weight = sum(m.weight * min(1.0, m.score / m.threshold_score) for m in measures)
      quality_bonus_cents = round_half_up(plan.quality_pool_cents * earned_weight / total_weight, 0)
    input_set: "The scorecard being finalized and its agreement's plan quality_model and quality_pool_cents"
    constants:
      SCORE_RANGE: "0-100 per measure"
      POOL_BASIS: "quality_pool_cents is a PER-PERIOD pool (not annualized)"
    precision: "integer cents, round_half_up, computed once at finalization and frozen"
    variants:
      - name: all_or_nothing
        when: "plan.quality_model == ALL_OR_NOTHING"
        difference: "a measure contributes its full weight only when score >= threshold_score, else 0"
      - name: sliding_scale
        when: "plan.quality_model == SLIDING_SCALE"
        difference: "a measure contributes weight x min(1, score/threshold_score), so a half-met measure earns half weight; identical scores yield a strictly larger bonus whenever any measure is partially met"

  - name: supervision_credit_allocation
    description: "Allocates fractions of an APP's validated clinical capture to supervising physicians as SUPERVISION_CREDIT captures. Rounding order is pinned: round per assignment, then sum; sum-then-round is explicitly rejected."
    trigger: "cascade from ProductionCapture validation when the owning physician has provider_type == APP"
    algorithm: waterfall_allocation
    formula: |
      eligible = [a for a in SupervisionAssignment
                  where a.app_physician_id == capture.agreement.physician_id
                  and a.status == ACTIVE
                  and a.start_date <= capture.service_date <= a.end_date]
      process eligible in order: start_date ASC, then created_at ASC   # pinned order; id never used
      for a in eligible:
          allocation_wrvu = round_half_up(capture.credited_wrvu * a.credit_pct, 2)   # per-assignment rounding
          create SUPERVISION_CREDIT capture on a.supervisor's EFFECTIVE agreement:
              credited_wrvu = allocation_wrvu
              credited_period = per supervisor plan's credit_attribution_mode
      # NO remainder redistribution: rounding dust stays with the APP.
      # Rejected alternative: sum(capture.credited_wrvu * pct) rounded once — produces
      # different totals (e.g. 0.97 x 0.3333 twice => 0.32+0.32=0.64, not 0.65).
    input_set: "The APP capture being validated; SupervisionAssignments filtered as in the formula; supervisor must hold an EFFECTIVE agreement on the same plan (enforced at assignment creation)"
    constants:
      WRVU_DECIMALS: 2
      ROUNDING: round_half_up
      CAPACITY_FTE_CAP: 4.0
    precision: "each allocation independently rounded to 2 decimals, round_half_up; allocations then summed per supervisor agreement"

  - name: statement_net_settlement
    description: "Statement payable amount. Evaluation order is pinned to break the circular-looking dependency between the true-up adjustment and the statement's own computed fields."
    trigger: "CompStatement generation"
    algorithm: aggregation
    formula: |
      # EVALUATION ORDER (pinned; do not reorder):
      # 1. trueup_adjustment_cents = agreement.pending_trueup_adjustment_cents   (SNAPSHOT ONLY)
      #    - never recomputed from this statement's own fields;
      #    - reset agreement.pending_trueup_adjustment_cents = 0 after snapshot.
      # 2. period_wrvu / ytd_wrvu_at_close from current CREDITED captures (calculation productivity_payout).
      # 3. productivity_earned_ytd_cents, tier_attained, tier_bonus_cents, period_productivity_cents.
      # 4. quality_bonus_cents from the FINALIZED scorecard matching this period, else 0.
      # 5. period_draw_cents = agreement.period_draw_cents (snapshot).
      # 6. net_payment_cents = period_productivity_cents + tier_bonus_cents
      #                      + quality_bonus_cents + trueup_adjustment_cents
      #                      - period_draw_cents
      # Negative net_payment_cents is allowed (a receivable from the physician); no floor at zero.
    input_set: "Locked period_wrvu of FINALIZED statements + live CREDITED captures in non-finalized periods (per productivity_payout), prior non-VOIDED statements for the cumulative delta, FINALIZED scorecard for the period, agreement pending adjustment"
    constants:
      NEGATIVE_ALLOWED: true
    precision: "integer cents throughout"
    variants:
      - name: with_pending_trueup
        when: "agreement.pending_trueup_adjustment_cents != 0 at generation"
        difference: "the snapshot adjustment is folded into net_payment_cents and the pending field resets to 0; a statement generated without a posted true-up shows trueup_adjustment_cents == 0"

  - name: trueup_variance
    description: "Mid-year true-up: recompute each agreement's earned productivity YTD from current state and compare against what prior statements recognized; the difference becomes the pending adjustment."
    trigger: "POST /comp/comp-plans/{id}/true-up-runs (computed synchronously at creation)"
    algorithm: chronological
    formula: |
      for each PhysicianAgreement a with a.plan_id == plan.id
          and a.status in {EFFECTIVE, AMENDMENT_REQUIRED}:
          # closed periods: periods with a FINALIZED statement, <= as_of_period
          closed = [s for s in a.statements
                    where s.status == FINALIZED
                    and (s.period_year, s.period_month) <= as_of_period]
          order closed by (period_year ASC, period_month ASC)
          # recompute what those closed periods SHOULD have earned from live captures:
          caps = [c for c in a.captures
                  where c.credit_status == CREDITED
                  and c.credited_period is one of the closed periods]
          order caps by (service_date ASC, created_at ASC)   # tie-break created_at; id never used
          Y = round_half_up(sum(c.credited_wrvu for c in caps), 2)
          recomputed = productivity_payout tier formula over Y at a.physician.fte
          recognized = sum(s.period_productivity_cents for s in closed)
          variance_cents = recomputed - recognized           # negative = clawback
          # drift source: a capture reversed by dispute AFTER its period's statement
          # finalized leaves the FINALIZED statement untouched (locked basis), so the
          # live ledger and the recognized cash diverge by exactly this variance.
          run.adjustments.append({agreement_id: a.id, variance_cents: variance_cents})
    input_set: "Agreements of the plan in status EFFECTIVE or AMENDMENT_REQUIRED; FINALIZED statements with period <= as_of_period (closed periods); CREDITED captures whose credited_period is one of those closed periods"
    constants:
      ADJUSTMENT_APPLICATION: "POST sets agreement.pending_trueup_adjustment_cents = variance_cents (overwrite semantics)"
    precision: "integer cents"
    variants:
      - name: post_reversal_recompute
        when: "a capture in a FINALIZED period was reversed by dispute resolution after the statement locked"
        difference: "recomputed drops the reversed wRVUs while recognized stays locked, producing a negative variance the next statement carries as a negative trueup_adjustment_cents; without a locked-period reversal the variance is 0"

  - name: plan_change_modeling
    description: "What-if projection behind plan change communication: per affected agreement, project annual compensation under the current plan config vs the successor plan config using annualized actual productivity."
    trigger: "POST /comp/plan-change-requests/{id}/model (and revise, which recomputes)"
    algorithm: forward_looking
    formula: |
      for each PhysicianAgreement a with a.plan_id == pcr.plan_id
          and a.status in {EFFECTIVE, AMENDMENT_REQUIRED}:
          fin = [s for s in a.statements where s.status == FINALIZED]
          if fin is empty:
              delta_a = 0
          else:
              avg_period_wrvu = sum(s.period_wrvu for s in fin) / len(fin)
              annualized_wrvu = avg_period_wrvu * 12
              proj_current  = tiered earnings of annualized_wrvu under CURRENT plan tiers at a.physician.fte
              proj_successor = tiered earnings of annualized_wrvu under SUCCESSOR plan tiers at a.physician.fte
              delta_a = proj_successor - proj_current
      modeled_delta_cents = sum(delta_a)
    input_set: "Agreements of the changed plan in status EFFECTIVE or AMENDMENT_REQUIRED; FINALIZED statements only (DRAFT/UNDER_REVIEW/VOIDED excluded)"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up per agreement before summing"
    variants:
      - name: empty_history
        when: "an affected agreement has no FINALIZED statements"
        difference: "contributes exactly 0 to modeled_delta_cents (no imputation); the projection only reflects physicians with finalized payment history"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed role Physician, X-User-ID must be the id of an existing Physician"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: a Physician-role caller may only read their own Physician record, their own agreements/statements/captures, list their own disputes, file disputes on their own agreement's subjects, and acknowledge PCRs for plans they are enrolled in"
    error_id: ERR_NOT_OWN_RESOURCE
    http_status: 403
    applies_to: "GET /comp/physicians/{id}, GET /comp/physician-agreements(+/{id}), GET /comp/comp-statements/{id}, GET /comp/production-captures/{id}, GET /comp/disputes, POST /comp/disputes, POST /comp/plan-change-requests/{id}/acknowledge"
  - priority: 4
    category: existence
    check: "Path parameters and body FK references resolve to existing resources, validated left-to-right along the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "State-machine precondition: the target resource's current state permits the requested transition (per state_machines); generic guard for all action endpoints"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "CompPlan configuration and rate mutations require plan.status in {DRAFT, PENDING_REVIEW}"
    error_id: ERR_PLAN_IMMUTABLE
    http_status: 409
    applies_to: "PUT /comp/comp-plans/{id}, POST /comp/comp-plans/{id}/cpt-rates, DELETE /comp/cpt-rates/{id}"
  - priority: 7
    category: state
    check: "Plan activation requires plan.status == FMV_APPROVED"
    error_id: ERR_PLAN_NOT_FMV_APPROVED
    http_status: 409
    applies_to: "POST /comp/comp-plans/{id}/activate"
  - priority: 8
    category: state
    check: "Agreement creation requires the referenced plan.status in {FMV_APPROVED, ACTIVE}; agreement activation requires plan.status == ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /comp/physician-agreements, POST /comp/physician-agreements/{id}/activate"
  - priority: 9
    category: state
    check: "Production capture posting requires agreement.status == EFFECTIVE"
    error_id: ERR_AGREEMENT_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /comp/physician-agreements/{id}/production-captures"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: FMV reviewer X-User-ID != agreement.created_by_user_id; statement finalizer X-User-ID != statement.created_by_user_id; dispute resolver accepting a CAPTURE dispute X-User-ID != subject capture.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /comp/physician-agreements/{id}/fmv-review, POST /comp/comp-statements/{id}/finalize, POST /comp/disputes/{id}/resolve"
  - priority: 11
    category: business_safety
    check: "FMV cooling-off: submit-fmv rejected when agreement.last_fmv_rejected_at is within 30 days before the logical clock date"
    error_id: ERR_FMV_COOLING_OFF
    http_status: 422
    applies_to: "POST /comp/physician-agreements/{id}/submit-fmv"
  - priority: 12
    category: business_safety
    check: "Compliance hold: capture posting and capture validation rejected when agreement.compliance_hold is true (status EFFECTIVE and logical clock later than fmv_reviewed_at + 12 months)"
    error_id: ERR_COMPLIANCE_HOLD
    http_status: 422
    applies_to: "POST /comp/physician-agreements/{id}/production-captures, POST /comp/production-captures/{id}/validate"
  - priority: 13
    category: business_safety
    check: "FMV freshness at activation: agreement activation rejected when logical clock is later than fmv_reviewed_at + 12 months"
    error_id: ERR_FMV_STALE
    http_status: 422
    applies_to: "POST /comp/physician-agreements/{id}/activate"
  - priority: 14
    category: business_constraint
    check: "Payload shape: required fields present, types correct, enums in range, scores 0-100, units >= 1, fte in (0, 1.0], dates well-formed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 15
    category: business_constraint
    check: "Plan tiers: at least one tier, first threshold_wrvu == 0, thresholds strictly increasing"
    error_id: ERR_TIER_ORDER_INVALID
    http_status: 422
    applies_to: "POST /comp/comp-plans, PUT /comp/comp-plans/{id}"
  - priority: 16
    category: business_constraint
    check: "CptRate window overlap: no two rate rows on the same plan with the same cpt_code may have overlapping half-open [effective_from, effective_to) windows; adjacency (prior.effective_to == next.effective_from) is allowed"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /comp/comp-plans/{id}/cpt-rates"
  - priority: 17
    category: business_constraint
    check: "At most one non-terminal successor plan (status in {DRAFT, PENDING_REVIEW, FMV_APPROVED}) per superseded plan"
    error_id: ERR_SUCCESSOR_EXISTS
    http_status: 409
    applies_to: "POST /comp/comp-plans"
  - priority: 18
    category: business_constraint
    check: "Supervision parties: supervisor must have provider_type PHYSICIAN, app must have provider_type APP, and supervisor_physician_id != app_physician_id"
    error_id: ERR_PROVIDER_TYPE_INVALID
    http_status: 422
    applies_to: "POST /comp/supervision-assignments"
  - priority: 19
    category: business_constraint
    check: "Supervision requires both supervisor and APP to hold EFFECTIVE agreements on the same plan"
    error_id: ERR_NO_EFFECTIVE_AGREEMENT
    http_status: 422
    applies_to: "POST /comp/supervision-assignments"
  - priority: 20
    category: business_constraint
    check: "Supervision overlap: for the same (supervisor, app) pair, closed [start_date, end_date] windows must not overlap (overlap allowed across different pairs); for the same APP across overlapping windows, sum of credit_pct must be <= 1.0 (inclusive); for the same supervisor, sum of supervised_fte over any overlapping day must be <= 4.0"
    error_id: ERR_SUPERVISION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /comp/supervision-assignments, POST /comp/supervision-assignments/{id}/end"
  - priority: 21
    category: business_constraint
    check: "Uniqueness: one non-terminal agreement per (physician_id, plan_id); one scorecard per (agreement_id, period); one statement per (agreement_id, period_year, period_month)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /comp/physician-agreements, POST /comp/physician-agreements/{id}/quality-scorecards, POST /comp/physician-agreements/{id}/comp-statements"
  - priority: 22
    category: business_constraint
    check: "Statement finalize blocked while any dispute on the same agreement is in {FILED, UNDER_REVIEW, DATA_CORRECTION}"
    error_id: ERR_OPEN_DISPUTES
    http_status: 409
    applies_to: "POST /comp/comp-statements/{id}/finalize"
  - priority: 23
    category: business_constraint
    check: "TrueUpRun creation blocked while any agreement of the plan has a statement in UNDER_REVIEW, or another TrueUpRun for the plan is still COMPUTED"
    error_id: ERR_TRUEUP_GUARD
    http_status: 409
    applies_to: "POST /comp/comp-plans/{id}/true-up-runs"
  - priority: 24
    category: business_constraint
    check: "PCR linkage: successor plan's supersedes_plan_id must equal plan_id, successor must be FMV_APPROVED at creation and activation"
    error_id: ERR_SUCCESSOR_MISMATCH
    http_status: 422
    applies_to: "POST /comp/plan-change-requests, POST /comp/plan-change-requests/{id}/activate"
  - priority: 25
    category: business_temporal
    check: "Period locked: capture posting rejected when service_date falls inside a period covered by a FINALIZED statement on the same agreement"
    error_id: ERR_PERIOD_LOCKED
    http_status: 422
    applies_to: "POST /comp/physician-agreements/{id}/production-captures"
  - priority: 26
    category: business_temporal
    check: "Statement chronology: a new statement's (period_year, period_month) must be strictly later than every existing statement period on the same agreement"
    error_id: ERR_STATEMENT_PERIOD_ORDER
    http_status: 409
    applies_to: "POST /comp/physician-agreements/{id}/comp-statements"
  - priority: 27
    category: business_temporal
    check: "PCR scheduling: communicate requires effective_date strictly after the logical clock date; activate requires the logical clock date >= effective_date"
    error_id: ERR_PCR_TIMING
    http_status: 422
    applies_to: "POST /comp/plan-change-requests/{id}/communicate, POST /comp/plan-change-requests/{id}/activate"
  - priority: 28
    category: business_referential
    check: "Capture rate resolution: a CptRate row covering (cpt_code, service_date) must exist at validation (and at dispute-accept with a corrected_cpt_code)"
    error_id: ERR_RATE_NOT_FOUND
    http_status: 422
    applies_to: "POST /comp/production-captures/{id}/validate, POST /comp/disputes/{id}/resolve"
  - priority: 29
    category: business_referential
    check: "Dispute subject consistency: subject_capture_id / subject_statement_id must exist, match subject_type, and belong to the filer's own agreement"
    error_id: ERR_DISPUTE_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /comp/disputes"
  - priority: 30
    category: business_fiscal
    check: "FMV cap: agreement activation rejected when base_salary_cents + projected annual productivity (current YTD pace: ytd_wrvu_credited annualized by months elapsed since effective_date, run through the plan's marginal tier formula at the physician's fte) exceeds plan.fmv_cap_cents"
    error_id: ERR_FMV_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /comp/physician-agreements/{id}/activate"

endpoints:
  - method: POST
    path: "/comp/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server clock used by every date/deadline rule. Startup default (before any set_current_utc call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["recomputes every EFFECTIVE agreement's compliance_hold flag"]

  - method: POST
    path: "/comp/physicians"
    description: "Register a physician or APP in the roster"
    roles: [SystemAdmin]
    code: 201
    input: [npi, full_name, specialty, provider_type, fte, hire_date]
    output: Physician
    side_effects: []
  - method: GET
    path: "/comp/physicians/{id}"
    description: "Read one physician; Physician role may only read its own record"
    roles: [SystemAdmin, CompAnalyst, CompCommittee, ComplianceOfficer, Physician]
    code: 200
    input: []
    output: Physician
    side_effects: []

  - method: POST
    path: "/comp/comp-plans"
    description: "Draft a compensation plan (optionally as successor of an ACTIVE plan)"
    roles: [CompAnalyst]
    code: 201
    input: [name, fiscal_year_start, fiscal_year_end, tiers, quality_pool_cents, fmv_cap_cents, "credit_attribution_mode?", "quality_model?", "supersedes_plan_id?"]
    output: CompPlan
    side_effects: ["initializes status=DRAFT, version=1"]
  - method: GET
    path: "/comp/comp-plans/{id}"
    description: "Read one plan (includes version for OCC)"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer]
    code: 200
    input: []
    output: CompPlan
    side_effects: []
  - method: GET
    path: "/comp/comp-plans/{id}/successor-plans"
    description: "List plans whose supersedes_plan_id == this plan (reverse reachability for the self-referential FK)"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CompPlan[]
    side_effects: []
  - method: PUT
    path: "/comp/comp-plans/{id}"
    description: "Edit plan configuration; only while DRAFT or PENDING_REVIEW; OCC-guarded"
    roles: [CompAnalyst]
    code: 200
    input: [expected_comp_plan_version, "name?", "credit_attribution_mode?", "quality_model?", "tiers?", "quality_pool_cents?", "fmv_cap_cents?"]
    output: CompPlan
    side_effects: ["increments CompPlan.version by 1"]
  - method: POST
    path: "/comp/comp-plans/{id}/submit-review"
    description: "Submit plan for compliance review (DRAFT -> PENDING_REVIEW)"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["transition DRAFT -> PENDING_REVIEW; increments CompPlan.version by 1"]
  - method: POST
    path: "/comp/comp-plans/{id}/review-decision"
    description: "Compliance review of a plan; APPROVED -> FMV_APPROVED, REJECTED -> DRAFT"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: CompPlan
    side_effects: ["transition per decision; increments CompPlan.version by 1"]
  - method: POST
    path: "/comp/comp-plans/{id}/activate"
    description: "Activate an FMV_APPROVED plan"
    roles: [CompCommittee]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["transition FMV_APPROVED -> ACTIVE; sets activated_at; increments CompPlan.version by 1"]
  - method: POST
    path: "/comp/comp-plans/{id}/close"
    description: "Close an ACTIVE plan once no non-terminal agreements reference it"
    roles: [CompCommittee]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["transition ACTIVE -> CLOSED; increments CompPlan.version by 1"]

  - method: POST
    path: "/comp/comp-plans/{id}/cpt-rates"
    description: "Add a wRVU rate window for a CPT code; half-open overlap with same-code rows rejected"
    roles: [CompAnalyst]
    code: 201
    input: [cpt_code, wrvu_value, effective_from, effective_to]
    output: CptRate
    side_effects: []
  - method: GET
    path: "/comp/comp-plans/{id}/cpt-rates"
    description: "List rate rows of a plan (reverse reachability CptRate -> CompPlan)"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer]
    code: 200
    input: ["cpt_code?", "limit?", "offset?"]
    output: CptRate[]
    side_effects: []
  - method: DELETE
    path: "/comp/cpt-rates/{id}"
    description: "Delete a rate row; only while the owning plan is DRAFT or PENDING_REVIEW"
    roles: [CompAnalyst]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/comp/physician-agreements"
    description: "Create an agreement enrolling a physician into a plan; pins the plan's current version"
    roles: [CompAnalyst]
    code: 201
    input: [physician_id, plan_id, base_salary_cents, period_draw_cents, effective_date]
    output: PhysicianAgreement
    side_effects: ["sets pinned_plan_version = plan.version at creation", "records created_by_user_id from X-User-ID"]
  - method: GET
    path: "/comp/physician-agreements"
    description: "List agreements; reverse reachability for physician_id and plan_id FKs"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer, Physician]
    code: 200
    input: ["physician_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: PhysicianAgreement[]
    side_effects: []
  - method: GET
    path: "/comp/physician-agreements/{id}"
    description: "Read one agreement"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer, Physician]
    code: 200
    input: []
    output: PhysicianAgreement
    side_effects: []
  - method: POST
    path: "/comp/physician-agreements/{id}/submit-fmv"
    description: "Submit for FMV review from DRAFT, or re-enter review from EFFECTIVE (re-review cycle); 30-day cooling-off after a rejection"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PhysicianAgreement
    side_effects: ["transition -> PENDING_FMV; increments agreement.version by 1"]
  - method: POST
    path: "/comp/physician-agreements/{id}/fmv-review"
    description: "Record FMV decision; reviewer must differ from agreement creator (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, benchmark_percentile]
    output: PhysicianAgreement
    side_effects: ["APPROVED -> FMV_APPROVED (sets fmv_reviewed_at/reviewer/percentile); REJECTED -> DRAFT (sets last_fmv_rejected_at); increments agreement.version by 1"]
  - method: POST
    path: "/comp/physician-agreements/{id}/activate"
    description: "Activate an FMV_APPROVED agreement; requires plan ACTIVE, FMV fresh, FMV cap satisfied"
    roles: [CompCommittee]
    code: 200
    input: []
    output: PhysicianAgreement
    side_effects: ["transition FMV_APPROVED -> EFFECTIVE; increments agreement.version by 1"]
  - method: POST
    path: "/comp/physician-agreements/{id}/terminate"
    description: "Terminate an EFFECTIVE or AMENDMENT_REQUIRED agreement; voids its DRAFT statements"
    roles: [CompCommittee]
    code: 200
    input: []
    output: PhysicianAgreement
    side_effects: ["transition -> TERMINATED; voids DRAFT statements; increments agreement.version by 1"]
  - method: POST
    path: "/comp/physician-agreements/{id}/repin"
    description: "Re-pin an AMENDMENT_REQUIRED agreement onto the ACTIVE successor plan"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PhysicianAgreement
    side_effects: ["sets plan_id and pinned_plan_version to the successor plan; transition -> EFFECTIVE; increments agreement.version by 1"]

  - method: POST
    path: "/comp/physician-agreements/{id}/production-captures"
    description: "Post a clinical production capture (POSTED/UNCREDITED); blocked by compliance hold, non-EFFECTIVE agreement, or a FINALIZED statement covering service_date"
    roles: [CompAnalyst]
    code: 201
    input: [cpt_code, units, service_date, "posting_date?"]
    output: ProductionCapture
    side_effects: ["records created_by_user_id from X-User-ID"]
  - method: GET
    path: "/comp/physician-agreements/{id}/production-captures"
    description: "List captures of an agreement (reverse reachability ProductionCapture -> PhysicianAgreement)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: ProductionCapture[]
    side_effects: []
  - method: GET
    path: "/comp/production-captures/{id}"
    description: "Read one capture"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: []
    output: ProductionCapture
    side_effects: []
  - method: GET
    path: "/comp/production-captures/{id}/corrections"
    description: "List replacement captures whose reversal_of_capture_id == this capture (reverse reachability for the self-referential correction FK)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionCapture[]
    side_effects: []
  - method: GET
    path: "/comp/production-captures/{id}/supervision-credits"
    description: "List SUPERVISION_CREDIT captures allocated from this APP capture (reverse reachability for source_capture_id)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionCapture[]
    side_effects: []
  - method: GET
    path: "/comp/production-captures/{id}/disputes"
    description: "List disputes whose subject_capture_id == this capture (reverse reachability for the polymorphic FK)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/comp/production-captures/{id}/validate"
    description: "Validate a POSTED capture: resolves rate, computes credited wRVU and period, credits the ledger, and allocates supervision credits for APP production"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: ProductionCapture
    side_effects: ["capture POSTED -> VALIDATED, credit UNCREDITED -> CREDITED; recomputes agreement.ytd_wrvu_credited; creates SUPERVISION_CREDIT captures for APP production"]
  - method: POST
    path: "/comp/production-captures/{id}/void"
    description: "Void a POSTED (never credited) capture"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: ProductionCapture
    side_effects: ["capture POSTED -> VOIDED"]

  - method: POST
    path: "/comp/supervision-assignments"
    description: "Create an APP supervision assignment; enforces provider types, same-plan EFFECTIVE agreements, per-pair window overlap, per-APP credit_pct sum <= 1.0, supervisor FTE capacity <= 4.0"
    roles: [CompAnalyst]
    code: 201
    input: [supervisor_physician_id, app_physician_id, start_date, end_date, credit_pct, supervised_fte]
    output: SupervisionAssignment
    side_effects: []
  - method: GET
    path: "/comp/supervision-assignments"
    description: "List supervision assignments; reverse reachability for both Physician FKs"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer]
    code: 200
    input: ["supervisor_physician_id?", "app_physician_id?", "status?", "limit?", "offset?"]
    output: SupervisionAssignment[]
    side_effects: []
  - method: GET
    path: "/comp/supervision-assignments/{id}"
    description: "Read one supervision assignment"
    roles: [CompAnalyst, CompCommittee, ComplianceOfficer]
    code: 200
    input: []
    output: SupervisionAssignment
    side_effects: []
  - method: POST
    path: "/comp/supervision-assignments/{id}/end"
    description: "End an assignment early; new end_date must be >= start_date"
    roles: [CompAnalyst]
    code: 200
    input: [end_date]
    output: SupervisionAssignment
    side_effects: ["transition ACTIVE -> ENDED; sets end_date"]

  - method: POST
    path: "/comp/physician-agreements/{id}/quality-scorecards"
    description: "Record a quality measurement scorecard for a period (one per agreement+period)"
    roles: [CompAnalyst]
    code: 201
    input: [period, measures]
    output: QualityScorecard
    side_effects: []
  - method: GET
    path: "/comp/physician-agreements/{id}/quality-scorecards"
    description: "List scorecards of an agreement (reverse reachability)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["limit?", "offset?"]
    output: QualityScorecard[]
    side_effects: []
  - method: POST
    path: "/comp/quality-scorecards/{id}/finalize"
    description: "Finalize a scorecard; computes and freezes quality_bonus_cents per the plan's quality_model"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: QualityScorecard
    side_effects: ["computes quality_bonus_cents (calculation quality_bonus); transition DRAFT -> FINALIZED"]

  - method: POST
    path: "/comp/physician-agreements/{id}/comp-statements"
    description: "Generate a period statement: runs productivity_payout + statement_net_settlement; periods must be generated in chronological order"
    roles: [CompAnalyst]
    code: 201
    input: [period_year, period_month]
    output: CompStatement
    side_effects: ["computes all derived statement fields; snapshots and resets agreement.pending_trueup_adjustment_cents; records created_by_user_id"]
  - method: GET
    path: "/comp/physician-agreements/{id}/comp-statements"
    description: "List statements of an agreement (reverse reachability)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CompStatement[]
    side_effects: []
  - method: GET
    path: "/comp/comp-statements/{id}"
    description: "Read one statement"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: []
    output: CompStatement
    side_effects: []
  - method: POST
    path: "/comp/comp-statements/{id}/submit-review"
    description: "Move a DRAFT statement to UNDER_REVIEW"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: CompStatement
    side_effects: ["transition DRAFT -> UNDER_REVIEW"]
  - method: POST
    path: "/comp/comp-statements/{id}/finalize"
    description: "Finalize an UNDER_REVIEW statement; blocked by open disputes and by same-user finalize (segregation of duties)"
    roles: [CompCommittee]
    code: 200
    input: []
    output: CompStatement
    side_effects: ["locks included captures VALIDATED -> LOCKED; agreement.lifetime_paid_cents += net_payment_cents"]
  - method: POST
    path: "/comp/comp-statements/{id}/void"
    description: "Void a FINALIZED statement; rolls back lifetime_paid and unlocks captures (compensation)"
    roles: [CompCommittee]
    code: 200
    input: [reason]
    output: CompStatement
    side_effects: ["transition FINALIZED -> VOIDED; unlocks captures LOCKED -> VALIDATED; lifetime_paid rollback"]
  - method: GET
    path: "/comp/comp-statements/{id}/disputes"
    description: "List disputes whose subject_statement_id == this statement (reverse reachability)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/comp/comp-plans/{id}/true-up-runs"
    description: "Create a mid-year true-up run; computes per-agreement variances synchronously; blocked by UNDER_REVIEW statements or another COMPUTED run"
    roles: [CompAnalyst]
    code: 201
    input: [as_of_period]
    output: TrueUpRun
    side_effects: ["computes adjustments (calculation trueup_variance); initial status COMPUTED"]
  - method: GET
    path: "/comp/comp-plans/{id}/true-up-runs"
    description: "List true-up runs of a plan (reverse reachability)"
    roles: [CompAnalyst, CompCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: TrueUpRun[]
    side_effects: []
  - method: POST
    path: "/comp/true-up-runs/{id}/post"
    description: "Post a COMPUTED true-up run; overwrites each adjusted agreement's pending_trueup_adjustment_cents"
    roles: [CompCommittee]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["sets pending_trueup_adjustment_cents per adjustment; transition COMPUTED -> POSTED"]
  - method: POST
    path: "/comp/true-up-runs/{id}/void"
    description: "Void a COMPUTED true-up run without applying adjustments"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: TrueUpRun
    side_effects: ["transition COMPUTED -> VOIDED"]

  - method: POST
    path: "/comp/disputes"
    description: "Physician files a dispute on an own capture or statement (polymorphic subject); filer id taken from X-User-ID"
    roles: [Physician]
    code: 201
    input: [subject_type, reason, "subject_capture_id?", "subject_statement_id?"]
    output: Dispute
    side_effects: ["resolves agreement_id from the subject", "initial status FILED"]
  - method: GET
    path: "/comp/disputes"
    description: "List disputes (Physician sees only own); reverse reachability for agreement_id"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["agreement_id?", "filer_physician_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/comp/disputes/{id}"
    description: "Read one dispute; Physician role limited to own filings"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/comp/disputes/{id}/start-review"
    description: "Move FILED -> UNDER_REVIEW; also cycles DATA_CORRECTION -> UNDER_REVIEW (clears recorded correction)"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: Dispute
    side_effects: ["transition -> UNDER_REVIEW; clears corrected_units/corrected_cpt_code when cycling"]
  - method: POST
    path: "/comp/disputes/{id}/request-correction"
    description: "Record a data correction request (CAPTURE subjects only): UNDER_REVIEW -> DATA_CORRECTION"
    roles: [CompAnalyst]
    code: 200
    input: ["corrected_units?", "corrected_cpt_code?"]
    output: Dispute
    side_effects: ["records correction fields; transition -> DATA_CORRECTION"]
  - method: POST
    path: "/comp/disputes/{id}/resolve"
    description: "Resolve a dispute; ACCEPTED reverses the capture (and replaces it when a correction was recorded) or voids the statement; segregation of duties enforced against the capture's creator"
    roles: [CompCommittee]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects: ["ACCEPTED on CAPTURE: subject CREDITED -> REVERSED, ledger recompute, supervision children reversed, DRAFT statements refreshed; from DATA_CORRECTION also creates the corrected replacement capture; ACCEPTED on STATEMENT: statement FINALIZED -> VOIDED"]

  - method: POST
    path: "/comp/plan-change-requests"
    description: "Propose a plan change against an ACTIVE plan; OCC-guarded on the plan's version; creating it withdraws existing PROPOSED/MODELED PCRs for the same plan (create-with-supersede)"
    roles: [CompAnalyst]
    code: 201
    input: [plan_id, successor_plan_id, effective_date, summary, expected_comp_plan_version]
    output: PlanChangeRequest
    side_effects: ["withdraws sibling PCRs in PROPOSED/MODELED for the same plan", "increments CompPlan(plan_id).version by 1"]
  - method: GET
    path: "/comp/comp-plans/{id}/plan-change-requests"
    description: "List PCRs of a plan (reverse reachability for plan_id)"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanChangeRequest[]
    side_effects: []
  - method: GET
    path: "/comp/plan-change-requests/{id}"
    description: "Read one PCR"
    roles: [CompAnalyst, CompCommittee, Physician]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: []
  - method: POST
    path: "/comp/plan-change-requests/{id}/model"
    description: "Run the what-if projection (PROPOSED -> MODELED); recomputes on revise"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["computes modeled_delta_cents (calculation plan_change_modeling)"]
  - method: POST
    path: "/comp/plan-change-requests/{id}/communicate"
    description: "Communicate a MODELED change to affected physicians; requires effective_date in the future"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["transition MODELED -> COMMUNICATED"]
  - method: POST
    path: "/comp/plan-change-requests/{id}/revise"
    description: "Revise a COMMUNICATED change back to MODELED; clears acknowledgments"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["clears acknowledged_physician_ids; transition COMMUNICATED -> MODELED"]
  - method: POST
    path: "/comp/plan-change-requests/{id}/acknowledge"
    description: "Physician acknowledges a communicated change; must hold an EFFECTIVE agreement on the changed plan; acknowledging twice rejected"
    roles: [Physician]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["appends physician id to acknowledged_physician_ids"]
  - method: POST
    path: "/comp/plan-change-requests/{id}/activate"
    description: "Activate a communicated change at/after its effective_date with full acknowledgment; fires the supersede cascade"
    roles: [CompCommittee]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["successor plan FMV_APPROVED -> ACTIVE; changed plan ACTIVE -> SUPERSEDED; agreements EFFECTIVE -> AMENDMENT_REQUIRED; their DRAFT statements VOIDED"]
  - method: POST
    path: "/comp/plan-change-requests/{id}/withdraw"
    description: "Withdraw a non-terminal PCR"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PlanChangeRequest
    side_effects: ["transition -> WITHDRAWN"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID, or Physician-role id not matching an existing Physician"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Role not listed in the endpoint's roles (e.g., Physician attempting POST /comp/comp-plans)"
  - id: ERR_NOT_OWN_RESOURCE
    http: 403
    condition: "Physician-role caller touches a resource belonging to a different physician"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK reference does not resolve to an existing resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed payload: missing required field, wrong type, enum out of range, units < 1, fte outside (0, 1.0], score outside 0-100, malformed date, effective_to <= effective_from"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine guard: the resource's current state does not permit the requested transition (e.g., validating an already-VALIDATED capture, resolving a terminal dispute)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_comp_plan_version does not equal the plan's current version (plan PUT or PCR create)"
  - id: ERR_PLAN_IMMUTABLE
    http: 409
    condition: "Plan configuration or rate mutation attempted while plan status is not in {DRAFT, PENDING_REVIEW}"
  - id: ERR_PLAN_NOT_FMV_APPROVED
    http: 409
    condition: "Plan activation attempted from a state other than FMV_APPROVED"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "Agreement activation attempted while the referenced plan is not ACTIVE"
  - id: ERR_AGREEMENT_NOT_EFFECTIVE
    http: 409
    condition: "Production capture posted against an agreement whose status is not EFFECTIVE"
  - id: ERR_RATE_COVERAGE_INCOMPLETE
    http: 422
    condition: "Plan submit-review or activate attempted with zero CptRate rows"
  - id: ERR_TIER_ORDER_INVALID
    http: 422
    condition: "tiers empty, first threshold_wrvu != 0, or thresholds not strictly increasing"
  - id: ERR_RATE_WINDOW_OVERLAP
    http: 422
    condition: "New rate row's half-open [effective_from, effective_to) window overlaps an existing row with the same plan and cpt_code"
  - id: ERR_RATE_NOT_FOUND
    http: 422
    condition: "No CptRate row covers (cpt_code, service_date) at validation or at correction resolution"
  - id: ERR_SUCCESSOR_EXISTS
    http: 409
    condition: "A non-terminal successor plan already exists for the supersedes_plan_id plan"
  - id: ERR_SUCCESSOR_MISMATCH
    http: 422
    condition: "PCR successor plan's supersedes_plan_id != pcr.plan_id, or successor not FMV_APPROVED at PCR creation/activation"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violation: second non-terminal agreement for (physician, plan); second scorecard for (agreement, period); second statement for (agreement, period_year, period_month)"
  - id: ERR_FMV_COOLING_OFF
    http: 422
    condition: "submit-fmv within 30 days after the agreement's last FMV rejection"
  - id: ERR_FMV_STALE
    http: 422
    condition: "Agreement activation attempted when logical clock is later than fmv_reviewed_at + 12 months"
  - id: ERR_FMV_CAP_EXCEEDED
    http: 422
    condition: "Projected annual total compensation at activation exceeds the plan's fmv_cap_cents"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID on both sides of a segregated step (FMV reviewer == agreement creator; statement finalizer == statement creator; dispute resolver == subject capture creator)"
  - id: ERR_COMPLIANCE_HOLD
    http: 422
    condition: "Capture posting blocked because the EFFECTIVE agreement's FMV review is older than 12 months (compliance_hold)"
  - id: ERR_PERIOD_LOCKED
    http: 422
    condition: "Capture service_date falls inside a period covered by a FINALIZED statement on the same agreement"
  - id: ERR_STATEMENT_PERIOD_ORDER
    http: 409
    condition: "Statement generated for a period earlier than or equal to an existing statement period on the agreement"
  - id: ERR_OPEN_DISPUTES
    http: 409
    condition: "Statement finalize attempted while a dispute on the same agreement is in {FILED, UNDER_REVIEW, DATA_CORRECTION}"
  - id: ERR_TRUEUP_GUARD
    http: 409
    condition: "TrueUpRun creation attempted while an agreement of the plan has an UNDER_REVIEW statement or another COMPUTED run exists"
  - id: ERR_PROVIDER_TYPE_INVALID
    http: 422
    condition: "Supervision assignment with supervisor not PHYSICIAN, app not APP, or supervisor == app"
  - id: ERR_NO_EFFECTIVE_AGREEMENT
    http: 422
    condition: "Supervision assignment requires supervisor and APP to each hold an EFFECTIVE agreement on the same plan"
  - id: ERR_SUPERVISION_WINDOW_INVALID
    http: 422
    condition: "Supervision window violation: overlapping closed windows for the same (supervisor, app) pair; overlapping windows for the same APP with credit_pct sum > 1.0; supervisor aggregate supervised_fte > 4.0 on any overlapping day; end earlier than start"
  - id: ERR_DISPUTE_SUBJECT_MISMATCH
    http: 422
    condition: "Dispute subject missing for subject_type, or subject belongs to a different physician's agreement"
  - id: ERR_PCR_TIMING
    http: 422
    condition: "communicate with effective_date not strictly after the clock date; or activate before effective_date is reached"
  - id: ERR_ACK_INCOMPLETE
    http: 422
    condition: "PCR activation attempted before every physician with an EFFECTIVE agreement on the plan has acknowledged"

roles:
  - name: SystemAdmin
    description: "Platform operator: owns the logical clock and the physician roster"
    identity: opaque
    exclusive_operations:
      - "POST /comp/_clock/set_current_utc"
      - "POST /comp/physicians"
    shared_operations:
      - "GET /comp/physicians/{id}"
  - name: CompAnalyst
    description: "Compensation office analyst: drafts plans/rates/agreements, posts and validates production, runs statements and true-ups, triages disputes, drafts plan changes. Never approves compliance artifacts or finalizes payments."
    identity: opaque
    exclusive_operations:
      - "POST /comp/comp-plans, PUT /comp/comp-plans/{id}, POST /comp/comp-plans/{id}/submit-review"
      - "POST /comp/comp-plans/{id}/cpt-rates, DELETE /comp/cpt-rates/{id}"
      - "POST /comp/physician-agreements, POST /comp/physician-agreements/{id}/submit-fmv, POST /comp/physician-agreements/{id}/repin"
      - "POST /comp/physician-agreements/{id}/production-captures, POST /comp/production-captures/{id}/validate, POST /comp/production-captures/{id}/void"
      - "POST /comp/supervision-assignments, POST /comp/supervision-assignments/{id}/end"
      - "POST /comp/physician-agreements/{id}/quality-scorecards, POST /comp/quality-scorecards/{id}/finalize"
      - "POST /comp/physician-agreements/{id}/comp-statements, POST /comp/comp-statements/{id}/submit-review"
      - "POST /comp/comp-plans/{id}/true-up-runs, POST /comp/true-up-runs/{id}/void"
      - "POST /comp/disputes/{id}/start-review, POST /comp/disputes/{id}/request-correction"
      - "POST /comp/plan-change-requests, POST /comp/plan-change-requests/{id}/model, POST /comp/plan-change-requests/{id}/communicate, POST /comp/plan-change-requests/{id}/revise, POST /comp/plan-change-requests/{id}/withdraw"
    shared_operations:
      - "GET endpoints for plans, agreements, captures, assignments, scorecards, statements, true-up runs, disputes, plan-change-requests"
  - name: ComplianceOfficer
    description: "Independent reviewer: plan review decisions and agreement FMV reviews. Segregated from the agreement's creator."
    identity: opaque
    exclusive_operations:
      - "POST /comp/comp-plans/{id}/review-decision"
      - "POST /comp/physician-agreements/{id}/fmv-review"
    shared_operations:
      - "GET endpoints for plans, agreements, supervision assignments"
  - name: CompCommittee
    description: "Compensation committee: activation/finalization authority — plan activation and closure, agreement activation/termination, statement finalize/void, true-up posting, dispute resolution, plan-change activation. Segregated from the artifact's creator."
    identity: opaque
    exclusive_operations:
      - "POST /comp/comp-plans/{id}/activate, POST /comp/comp-plans/{id}/close"
      - "POST /comp/physician-agreements/{id}/activate, POST /comp/physician-agreements/{id}/terminate"
      - "POST /comp/comp-statements/{id}/finalize, POST /comp/comp-statements/{id}/void"
      - "POST /comp/true-up-runs/{id}/post"
      - "POST /comp/disputes/{id}/resolve"
      - "POST /comp/plan-change-requests/{id}/activate"
    shared_operations:
      - "GET endpoints for plans, agreements, captures, assignments, scorecards, statements, true-up runs, disputes, plan-change-requests"
  - name: Physician
    description: "Employed physician or APP: reads own compensation data, files disputes on own captures/statements, acknowledges communicated plan changes"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /comp/disputes"
      - "POST /comp/plan-change-requests/{id}/acknowledge"
    shared_operations:
      - "GET own physician record, own agreements, own captures, own statements, own disputes, plan-change-requests of plans they are enrolled in"
