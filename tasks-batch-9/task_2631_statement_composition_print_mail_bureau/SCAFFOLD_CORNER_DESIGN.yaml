            - "HTTP 200 with ${c12_integrity} == BREACHED and ${c12_job_status} == INTEGRITY_HELD"
            - "${c12_matched} == 0, ${c12_missing} == 0 and ${c12_duplicate} == 1: the piece was never rewritten to SCAN_MISSING even though it never completed all three stages"
            - "${c12_piece_integrity} == DUPLICATE_SCAN and ${c12_piece_status} == PRINTED — reconciliation left the duplicate verdict alone"
            - "GET /bureau/mail-pieces/${c12_piece_id}/scan-events?accepted=false returns total_count == 1"

      - name: variable_content_rules_accumulate_sheets_across_every_met_threshold
        claim_type: correct_result
        grounds: [calculations.variable_content_sheet_composition, entities.CompositionTemplate.fields.variable_content_rules]
        distinguishing_aspect: "Rules are cumulative rather than first-match: a 50000-cent statement clears both thresholds and collects 3 add_sheets plus both inserts, while a 10000-cent statement clears only the inclusive lower threshold and a 9999-cent statement clears none."
        test_recipe:
          setup:
            - "Insert stocks INS-C17A (sheets_per_insert 2, received 10) and INS-C17B (sheets_per_insert 1, received 10), both effective from 2026-01-01."
            - "Client CL-C17 (dr_readiness_required false) with ACTIVE template T-C17: sheets_per_document 1, color_pages_per_document 4, required_insert_codes ['INS-C17A'], rules R1 (threshold 10000, add_sheets 1, no insert) and R2 (threshold 50000, add_sheets 2, insert INS-C17B)."
            - "Three records of 50000, 10000 and 9999 cents, all fully addressed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-C17A", description: "Annual privacy notice", jurisdiction_code: "US", effective_from: "2026-01-01T00:00:00Z", sheets_per_insert: 2, received_count: 10 }
              as: BureauAdmin
              captures: { c17_insert_a: "$.data.id" }
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-C17B", description: "High balance disclosure", jurisdiction_code: "US", effective_from: "2026-01-01T00:00:00Z", sheets_per_insert: 1, received_count: 10 }
              as: BureauAdmin
              captures: { c17_insert_b: "$.data.id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-C17", name: "Cumulative Rules Credit Union", dr_readiness_required: false }
              as: BureauAdmin
              captures: { c17_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${c17_client_id}", template_code: "T-C17", version_no: 1, duplex_required: true, sheets_per_document: 1, color_pages_per_document: 4, mail_class_preference: "FIRST_CLASS", required_insert_codes: ["INS-C17A"], variable_content_rules: [{ rule_code: "R1", threshold_amount_cents: 10000, add_sheets: 1, required_insert_code: null }, { rule_code: "R2", threshold_amount_cents: 50000, add_sheets: 2, required_insert_code: "INS-C17B" }] }
              as: BureauAdmin
              captures: { c17_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${c17_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${c17_client_id}", file_name: "c17.csv", format_spec_code: "DELIMITED", declared_record_count: 3, declared_control_total_cents: 69999 }
              as: ClientLiaison
              captures: { c17_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${c17_file_id}", account_ref: "ABC2101", sequence_no: 1, statement_amount_cents: 50000, address_line1: "2600 Threshold Trace", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2601" }
              as: ClientLiaison
              captures: { c17_rec_high: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${c17_file_id}", account_ref: "ABC2102", sequence_no: 2, statement_amount_cents: 10000, address_line1: "2602 Threshold Trace", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2602" }
              as: ClientLiaison
              captures: { c17_rec_edge: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${c17_file_id}", account_ref: "ABC2103", sequence_no: 3, statement_amount_cents: 9999, address_line1: "2604 Threshold Trace", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2603" }
              as: ClientLiaison
              captures: { c17_rec_low: "$.data.id" }
            - call: "POST /bureau/data-files/${c17_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${c17_file_id}/control-check"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${c17_file_id}", template_id: "${c17_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { c17_job_id: "$.data.id", c17_sheets: "$.data.total_sheet_count", c17_insert_sheets: "$.data.insert_sheet_total", c17_color: "$.data.color_page_count" }
            - call: "GET /bureau/statement-records/${c17_rec_high}"
              payload: {}
              as: CompositionOperator
              captures: { c17_high_sheets: "$.data.computed_sheet_count" }
            - call: "GET /bureau/statement-records/${c17_rec_edge}"
              payload: {}
              as: CompositionOperator
              captures: { c17_edge_sheets: "$.data.computed_sheet_count" }
            - call: "GET /bureau/statement-records/${c17_rec_low}"
              payload: {}
              as: CompositionOperator
              captures: { c17_low_sheets: "$.data.computed_sheet_count" }
            - call: "GET /bureau/insert-stocks/${c17_insert_b}"
              payload: {}
              as: BureauAdmin
              captures: { c17_b_reserved: "$.data.reserved_count", c17_b_on_hand: "$.data.on_hand_count" }
          assert:
            - "HTTP 201 with ${c17_high_sheets} == 7 == 1 base + (1 + 2) add_sheets + (2 + 1) insert sheets — both rules fired and both insert codes were collected"
            - "${c17_edge_sheets} == 4 == 1 + 1 + 2: 10000 >= 10000 fires R1 inclusively but not R2"
            - "${c17_low_sheets} == 3 == 1 + 0 + 2: 9999 fires no rule, yet the template's required insert still applies"
            - "${c17_sheets} == 14 == 7 + 4 + 3, ${c17_insert_sheets} == 7 == 3 + 2 + 2 and ${c17_color} == 12 == 3 pieces * min(4, sheet_count * 2)"
            - "${c17_b_reserved} == 1 and ${c17_b_on_hand} == 9 — INS-C17B was reserved for the single qualifying piece only, while INS-C17A reserved 3 copies leaving on_hand 7"

      - name: postage_estimate_and_manifest_variants_are_covered_by_the_difficulty_design
        claim_type: variant_divergence
        grounds: [calculations.postage_cost.variants]
        excluded_because:
          difficulty_instance: postage_estimate_and_manifest_variants_diverge_on_one_batch
          rationale: "That instance seals and manifests the same batch and asserts both variants plus the negative manifest_postage_variance_cents delta, which is exactly the variant-divergence claim for this rule."

      - name: sla_variant_selection_between_scheduling_and_close_is_covered_by_the_difficulty_design
        claim_type: variant_selection
        grounds: [calculations.sla_penalty.variants]
        excluded_because:
          difficulty_instance: sla_projected_and_assessed_variants_diverge_on_one_job
          rationale: "That instance reads the projected variant at manifest time and the assessed variant at close on the same job, proving the context-dependent variant selection and the hold-minute delta."

      - name: billing_tier_boundaries_are_covered_by_the_difficulty_design
        claim_type: tiered_pricing
        grounds: [calculations.job_billing_total]
        excluded_because:
          difficulty_instance: billing_discount_tier_keyed_on_pre_discount_subtotal
          rationale: "That instance pins a subtotal on the 200-sheet tier edge and shows the neighbouring tier for the same job shape, covering tier boundary selection and the marginal-versus-average distinction."

      - name: press_selector_weighted_scoring_is_covered_by_the_difficulty_design
        claim_type: weighted_scoring
        grounds: [calculations.press_line_selection]
        excluded_because:
          difficulty_instance: press_line_selection_scores_headroom_speed_and_capability_surplus
          rationale: "That instance computes all three candidate scores to two decimals with the 6000/4000 basis-point weights and the 500-point surplus penalty and asserts the winner, covering weight application and rounding."

      - name: control_total_tolerance_threshold_edges_are_covered_by_the_difficulty_design
        claim_type: threshold
        grounds: [calculations.data_file_control_reconciliation]
        excluded_because:
          difficulty_instance: control_total_variance_bp_at_the_exact_client_tolerance_edge
          rationale: "That instance probes variance_bp at tolerance-1, exactly at tolerance and at tolerance+1 for the same client, which is the full threshold boundary triple for this rule."

      - name: machinability_screen_boundary_is_covered_by_the_difficulty_design
        claim_type: threshold
        grounds: [calculations.presort_qualification_waterfall.constants]
        excluded_because:
          difficulty_instance: machinability_screen_at_the_exact_max_sheet_boundary
          rationale: "That instance places one piece at exactly MAX_MACHINABLE_SHEETS and one at one sheet over, covering the strict greater-than screen that diverts pieces to NONMACHINABLE."

  - section: validations
    instances:

      - name: suspended_client_cannot_receive_a_new_data_file_while_an_active_client_can
        claim_type: violation_to_error
        grounds: [validations.ERR_CLIENT_SUSPENDED, entities.Client.fields.status]
        distinguishing_aspect: "The suspension gate is evaluated per client on intake, so the same POST body is rejected with ERR_CLIENT_SUSPENDED for a SUSPENDED client and accepted for an ACTIVE one."
        test_recipe:
          setup:
            - "Client CL-V1S created with status SUSPENDED and client CL-V1A created with the default ACTIVE status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V1S", name: "Suspended Statements Bank", status: "SUSPENDED", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v1_suspended_id: "$.data.id", v1_suspended_status: "$.data.status" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V1A", name: "Active Statements Bank", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v1_active_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v1_suspended_id}", file_name: "v1.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v1_error: "$.data.error_id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v1_active_id}", file_name: "v1.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v1_accepted_file: "$.data.id", v1_accepted_status: "$.data.status" }
            - call: "POST /bureau/clients/${v1_suspended_id}/postage-deposits"
              payload: { amount_cents: 10000, reference: "wire-v1" }
              as: PostageController
              captures: { v1_deposit_error: "$.data.error_id" }
          assert:
            - "${v1_suspended_status} == SUSPENDED — status is an input on create only, so this client can never be reactivated through PATCH"
            - "HTTP 409 with ${v1_error} == ERR_CLIENT_SUSPENDED and no DataFile row is created for that client"
            - "HTTP 201 for the ACTIVE client with ${v1_accepted_status} == RECEIVED, proving the rule is not a blanket intake block"
            - "HTTP 409 with ${v1_deposit_error} == ERR_CLIENT_SUSPENDED — the same priority-20 gate also covers postage deposits"
            - "GET /bureau/clients/${v1_suspended_id}/data-files returns total_count == 0"

      - name: composition_job_with_a_template_from_another_client_returns_client_mismatch
        claim_type: cross_entity_validation
        grounds: [validations.ERR_CLIENT_MISMATCH]
        distinguishing_aspect: "Both referenced rows exist and are individually valid, so the failure can only come from the cross-entity ownership check: the template belongs to a different client than the data file."
        test_recipe:
          setup:
            - "Clients CL-V2A and CL-V2B, each with an ACTIVE template (T-V2A, T-V2B), FIRST_CLASS, sheets_per_document 1, no inserts."
            - "An ACCEPTED single-record DataFile belonging to CL-V2A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V2A", name: "Owner A Financial", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v2_client_a: "$.data.id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V2B", name: "Owner B Financial", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v2_client_b: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v2_client_a}", template_code: "T-V2A", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { v2_template_a: "$.data.id" }
            - call: "POST /bureau/composition-templates/${v2_template_a}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v2_client_b}", template_code: "T-V2B", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { v2_template_b: "$.data.id" }
            - call: "POST /bureau/composition-templates/${v2_template_b}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v2_client_a}", file_name: "v2.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v2_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v2_file_id}", account_ref: "ABC2201", sequence_no: 1, statement_amount_cents: 5000, address_line1: "2700 Ownership Way", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2701" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v2_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${v2_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { v2_file_status: "$.data.status" }
          trigger:
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v2_file_id}", template_id: "${v2_template_b}", rush_requested: false }
              as: CompositionOperator
              captures: { v2_error: "$.data.error_id" }
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v2_file_id}", template_id: "${v2_template_a}", rush_requested: false }
              as: CompositionOperator
              captures: { v2_job_id: "$.data.id", v2_job_status: "$.data.status" }
          assert:
            - "${v2_file_status} == ACCEPTED, so the priority-21 file-state gate is satisfied and cannot mask the mismatch"
            - "HTTP 422 with ${v2_error} == ERR_CLIENT_MISMATCH — not a NOT_FOUND, because both the file and the template resolve"
            - "HTTP 201 for the same file with the client's own template: ${v2_job_status} == COMPOSED"
            - "GET /bureau/composition-jobs?template_id=${v2_template_b} returns total_count == 0"

      - name: scheduling_a_window_that_starts_before_the_clock_is_rejected
        claim_type: temporal_validation
        grounds: [validations.ERR_WINDOW_IN_PAST]
        distinguishing_aspect: "The window is compared against the logical clock, so the identical payload is rejected before the clock is advanced and accepted after: only the requested start instant relative to now decides."
        test_recipe:
          setup:
            - "Client CL-V3 (dr_readiness_required false), ACTIVE template T-V3, press line PL-V3 (600 sheets/hour, capacity 2000)."
