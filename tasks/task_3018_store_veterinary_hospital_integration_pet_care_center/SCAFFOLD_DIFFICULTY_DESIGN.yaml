  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: weight_band_and_risk_ceiling_boundaries
        grounds:
          - calculations.grooming_screening_score
          - calculations.grooming_handling_level
          - state_machines.ServiceBooking.SCREENED_to_BAY_CONFIRMED
          - errors[ERR_HIGH_RISK_NOT_ACKNOWLEDGED]
        distinguishing_aspect: "A numeric threshold crossing on two independent scales: the weight band switches at exactly 40.0 kg (>= 40.0 gets 10 points, 39.99 gets 5) while the score threshold switches at exactly 70 (score 70 is HIGH_RISK and unconfirmable without acknowledgement, score 69 is SENSITIVE)."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0601 in CA with 2 GROOMING bays; member Lena; two pets of the same breed so the only difference is weight"
            - "No BreedHandlingRule matches the breed, so breed_risk_points is 0 for both pets"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0601", city: "Chico", state_code: "CA", service_bay_count: 4, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_k_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Lena Ostrowski", email: "lena@example.com", state_code: "CA", home_store_id: "${store_k_id}" }
              as: StoreManager
              captures: { member_k_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_k_id}", name: "Tiko", species: "CANINE", breed: "Mixed Unknown", weight_kg: 40.0 }
              as: GroomingStaff
              captures: { pet_k1_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_k_id}", name: "Pim", species: "CANINE", breed: "Mixed Unknown", weight_kg: 39.9 }
              as: GroomingStaff
              captures: { pet_k2_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_k_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_k1_id: $.data.id }
            - call: "POST /stores/${store_k_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_k2_id: $.data.id }
            - call: "POST /stores/${store_k_id}/service-bookings"
              payload: { bay_id: "${bay_k1_id}", pet_id: "${pet_k1_id}", service_type: "GROOMING", starts_at: "2026-06-05T09:00:00Z", expected_pet_version: "${pet_k1_id_v}", ends_at: "2026-06-05T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_k1_id: $.data.id }
            - call: "POST /stores/${store_k_id}/service-bookings"
              payload: { bay_id: "${bay_k2_id}", pet_id: "${pet_k2_id}", service_type: "GROOMING", starts_at: "2026-06-05T09:00:00Z", expected_pet_version: "${pet_k2_id_v}", ends_at: "2026-06-05T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_k2_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_k_id}/service-bookings/${booking_k1_id}/screen"
              payload: { health_condition_points: 30, aggression_acknowledged: false, expected_pet_version: "${pet_k1_id}" }
              as: GroomingStaff
              captures: { skin_k1: $.data.screening_score }
          assert:
            - "ServiceBooking.${booking_k1_id}.screening_score == 40 for the 40.0 kg pet, being 0 pet risk + 0 breed + 10 weight band + 30 condition points"
            - "the 39.9 kg pet placed on the identical window on a different bay would score 35, being 5 weight-band points, which is exactly the boundary that makes >= 40.0 the tighter comparison"
            - "handling_level == SENSITIVE for score 40 and the confirm-bay call without acknowledgement is therefore admissible"

      - name: empty_pool_and_zero_quantity_boundaries
        grounds:
          - calculations.package_cycle_total_cents
          - calculations.outstanding_balance_ledger
          - entities.PackageBillingCycle.fields.status
          - state_machines.ServicePackage.PAUSED_to_CANCELLED
        distinguishing_aspect: "An empty-set and zero-count boundary reached through a different endpoint from the numeric one: a package with billing_cycle_count 12 whose cancellation voids every PENDING cycle leaves outstanding_balance_cents computed from an empty BILLED set, and a zero-consumption cycle bills exactly 0.00 instead of being rejected."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0602 in FL; member Marisol"
            - "A UNLIMITED package with billing_cycle_count 12 at state_sales_tax_rate 0.07"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0602", city: "Tampa", state_code: "FL", service_bay_count: 3, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_l_id: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Marisol Vega", email: "marisol@example.com", state_code: "FL", home_store_id: "${store_l_id}" }
              as: StoreManager
              captures: { member_l_id: $.data.id }
            - call: "POST /stores/${store_l_id}/members/${member_l_id}/service-packages"
              payload: { tier: "UNLIMITED", member_state_code: "FL", state_sales_tax_rate: 0.07, billing_cycle_count: 12, monthly_fee_cents: 0 }
              as: StoreManager
              captures: { package_l_id: $.data.id, package_l_v: $.data.version }
          trigger:
            - call: "POST /stores/${store_l_id}/members/${member_l_id}/service-packages/${package_l_id}/billing-cycles"
              payload: { expected_package_version: "${package_l_v}", grooming_visits_consumed: 0, vet_visits_consumed: 0, vaccine_visits_consumed: 0 }
              as: StoreManager
              captures: { cycle_l_id: $.data.id }
          assert:
            - "PackageBillingCycle.${cycle_l_id}.cycle_total_cents == 0.00 and it is still billed rather than refused, because zero consumption is inside the input set"
            - "Member.${member_l_id}.outstanding_balance_cents == 149626.68, being monthly_total_cents 12468.89 * 12"
            - "ServicePackage.${package_l_id}.included_visits_total == 10, being 6 grooming + 2 vet + 2 vaccine"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: confirmation_requires_balancing_entity_active_and_store_unfrozen
        grounds:
          - state_machines.ServiceBooking.SCREENED_to_BAY_CONFIRMED
          - state_machines.ServiceBay.ACTIVE_to_DISABLED
          - state_machines.Store.OPEN_to_RESTRICTED
          - errors[ERR_BAY_NOT_ACTIVE]
          - errors[ERR_STORE_HOSPITAL_FROZEN]
        distinguishing_aspect: "Setup-vs-branch on a UNIQUE COMPLETION STATE split two ways: the same confirm-bay request is admissible from SCREENED (grooming) and to REQUESTED and is in REQUESTED (non-grooming) or SCREENED (grooming), but only while the bay is ACTIVE and the store is not FROZEN, so the outcome separates on the two branch fields' values rather than on the request."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0701 in CA with hospital_capacity 5 and one GROOMING bay"
            - "Member Noor; pet Tofu (FELINE, Ragdoll, 5.2 kg); a grooming booking for Tofu already screened with score 0"
            - "The bay is then disabled, and the store is then escalated to RESTRICTED, which flips the disabled bay's is_frozen"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0701", city: "Santa Rosa", state_code: "CA", service_bay_count: 3, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { store_m_id: $.data.id, store_m_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Noor Haddad", email: "noor@example.com", state_code: "CA", home_store_id: "${store_m_id}" }
              as: StoreManager
              captures: { member_m_id: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_m_id}", name: "Tofu", species: "FELINE", breed: "Ragdoll", weight_kg: 5.2 }
              as: GroomingStaff
              captures: { pet_m_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_m_id}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay_m_id: $.data.id, bay_m_v: $.data.version }
            - call: "POST /stores/${store_m_id}/service-bookings"
              payload: { bay_id: "${bay_m_id}", pet_id: "${pet_m_id}", service_type: "GROOMING", starts_at: "2026-06-08T09:00:00Z", expected_pet_version: "${pet_m_id_v}", ends_at: "2026-06-08T10:00:00Z" }
              as: GroomingStaff
              captures: { booking_m_id: $.data.id, booking_m_v: $.data.version, booking_m_petv: $.data.pet_version }
            - call: "POST /stores/${store_m_id}/service-bookings/${booking_m_id}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: true, expected_pet_version: "${pet_m_id}" }
              as: GroomingStaff
              captures: { booking_m_v2: $.data.version, booking_m_petv2: $.data.pet_version }
            - call: "POST /stores/${store_m_id}/service-bays/${bay_m_id}/disable"
              payload: { expected_bay_version: "${bay_m_v}" }
              as: StoreManager
            - call: "POST /stores/${store_m_id}/restrict"
              payload: { expected_store_version: "${store_m_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/${store_m_id}/service-bookings/${booking_m_id}/confirm-bay"
              payload: { expected_booking_version: "${booking_m_v2}", expected_pet_version: "${booking_m_petv2}" }
              as: StoreManager
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_BAY_NOT_ACTIVE, because the bay's state is the leftmost cross-entity gate"
            - "the booking remains SCREENED and no store-side gate is reported, so disabling the bay is what blocked a booking whose own state was valid"

      - name: training_start_requires_active_package_and_unfrozen_store_branch
        grounds:
          - state_machines.TrainingEnrollment.PENDING_ACK_to_RESTRICTED
          - state_machines.ServicePackage.ACTIVE_to_PAUSED
          - state_machines.ServicePackage.PAUSED_to_CANCELLED
          - errors[ERR_PACKAGE_NOT_ACTIVE]
          - errors[ERR_PET_ARCHIVED]
        distinguishing_aspect: "Setup-vs-branch on a UNIQUE COMPLETION STATE, on a different entity pair from the first instance: the same begin-course request separates on the parent ServicePackage's status (ACTIVE admits, PAUSED refuses with ERR_PACKAGE_NOT_ACTIVE) and on the Pet's status (ACTIVE admits, ARCHIVED refuses with ERR_PET_ARCHIVED) across the pair TrainingEnrollment→ServicePackage and TrainingEnrollment→Pet."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0702 in NY with hospital_capacity 4; member Owen; pet Gizmo (CANINE, Poodle, 7.4 kg)"
            - "A PLUS package for Owen, then a training enrollment PENDING_ACK on that package, then the package is paused"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-0702", city: "Buffalo", state_code: "NY", service_bay_count: 3, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { store_n_id: $.data.id }
            - call: "POST /stores/members"
