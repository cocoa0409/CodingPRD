  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ppvc_lot_not_open_outranks_bid_below_reserve
        grounds:
          - validations[priority=32]
          - validations[priority=80]
          - errors.ERR_LOT_NOT_OPEN
          - errors.ERR_BID_BELOW_RESERVE
          - endpoints[POST /auction-lots/{id}/bids]
        distinguishing_aspect: |
          Priority 32 (category state) versus priority 80 (category business_fiscal). One bid of 1000 on a
          DRAFT lot whose reserve is 7524 violates both rules at once, and the state rule wins with 409
          ERR_LOT_NOT_OPEN; only after the lot is opened does the same bid surface the fiscal rule as 422
          ERR_BID_BELOW_RESERVE, which proves the lower-priority rule was genuinely violated the first time.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-09-01T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in holding a de-minimis furniture lot"
            - "asset A: FURNITURE, cost 104500, acquired 2024-05-20, assessed C6 / functional / repair 0 -> fair_market_value_cents 12540, which is under the 25000 de-minimis threshold so it lists straight from ASSESSED"
            - "one DRAFT lot at AUS-01 with window [2026-09-01, 2026-09-05), computed reserve 7524 and required_deposit_cents 0"
            - "one REGISTERED bidder holding no deposit — with required_deposit_cents 0 the deposit rule is satisfied, so exactly two rules are in play"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
