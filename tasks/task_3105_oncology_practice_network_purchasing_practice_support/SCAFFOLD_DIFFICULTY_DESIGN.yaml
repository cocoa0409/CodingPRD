          - entities.DrugShortage.fields.unallocated_units
        distinguishing_aspect: "The conserved quantity is UNIT supply: issuing a departure notice revokes a grant and returns its units to unallocated_units, and completing the unwind keeps the sum of non-revoked allocated_units plus unallocated_units pinned at supply_available_units."
        test_recipe:
