      - name: llpa_grid_sums_matching_rows_with_inclusive_fico_and_exclusive_lower_ltv_bounds
        claim_type: input_set_filtering
        grounds:
          - calculations.commitment_price_pct.formula
          - calculations.commitment_price_pct.input_set
          - entities.PricingAdjustment.fields.status
        distinguishing_aspect: |
          Three locks on the same product and the same 30-day tier separate the
          four selection rules: fico 700 / ltv 85.0 hits the -50 row (fico
          lower bound INCLUSIVE, ltv upper bound INCLUSIVE) giving 100.880;
          fico 740 / ltv 80.0 hits NOTHING (fico 740 is past the 739 upper
          bound and ltv 80.0 fails the EXCLUSIVE lower bound) giving 101.380;
          fico 740 / ltv 90.0 hits only the -15 row giving 101.230. A RETIRED
          -200 row that would match all three never contributes, so no price
          drops by 2.000.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1}"
            - "product GRID30F base 101.250 with rows: LLPA-F700-L85 (-50, fico 700-739, ltv 80.0-85.0), LLPA-F740-L90 (-15, fico 740-779, ltv 85.0-90.0), LLPA-RETIRED (-200, fico 700-779, ltv 0.0-100.0, status RETIRED)"
