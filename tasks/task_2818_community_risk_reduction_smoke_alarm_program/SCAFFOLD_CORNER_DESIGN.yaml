      - name: dual_variant_divergence_on_both_money_and_score
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: zone_risk_score_provisional_demographic_vs_validated_field_diverges
          rationale: "The §1.8 dual_variant_calc instances already run both variants over identical data and assert the exact divergent literals - zone_risk_score PROVISIONAL vs VALIDATED, and installation_reimbursement UNIT_RATE vs ACTUAL_COST in installation_reimbursement_unit_rate_vs_actual_cost_diverges."

      - name: reimbursement_basis_selection_and_reconciliation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: installation_reimbursement_unit_rate_vs_actual_cost_diverges
          rationale: "That instance already covers which basis the grant selects and how the reserved / committed money ledger reconciles when the installation moves, so no separate reconciliation corner is needed."

      - name: score_precision_and_tier_boundary
        claim_type: precision
        excluded_because:
          difficulty_instance: risk_tier_boundary_at_exactly_seventy_points_is_tier_1
          rationale: "The §1.8 boundary_precision_check instance already pins the 2-decimal round_half_up behaviour of zone_risk_score at 69.99 vs 70.00 and the inclusive TIER_1 lower bound."

      - name: aggregate_null_versus_zero
        claim_type: aggregation
        excluded_because:
          difficulty_instance: retention_rate_is_null_not_zero_when_no_eligible_contact_exists
          rationale: "The §1.8 boundary_precision_check instance already asserts the empty-set result of education_retention_rate is null rather than 0.00, which is the aggregation edge for that rule."

      - name: nested_max_then_grid_ceiling_in_visit_demand
        claim_type: correct_result
        excluded_because:
          difficulty_instance: visit_demand_minutes_nested_max_then_grid_ceiling
          rationale: "The §1.8 combinatorial_formula instance already asserts the exact demand_minutes literals for the nested max, the tier multiplier and the 5-minute ceiling grid, which is the correct-result claim for that calculation."

