      - name: export_control_or_branch_fires_at_a_figure_of_merit_of_exactly_four_thousand
        claim_type: constants_applied
        grounds:
          - calculations.export_control_classification
          - calculations.export_control_classification.constants.CONTROLLED_FIGURE_OF_MERIT
          - calculations.export_control_classification.constants.CONTROLLED_APERTURE_MM
          - entities.ExportClassification.fields.eccn
        distinguishing_aspect: |
          The OR branch must fire on its own: an 80 mm design with 0.0200-wave RMS is far below the 100 mm
          aperture threshold, yet figure_of_merit 80.0/0.0200 == 4000.00 hits CONTROLLED_FIGURE_OF_MERIT
          exactly and inclusively, so it is controlled and licence-required for DE; the neighbouring 79 mm
          design gives 3950.00, misses both branches, and comes out EAR99 / EXEMPT_CLEARED for the same
          destination.
        test_recipe:
          setup:
            - "Two DRAFT designs: OD-2540-FOM (aperture 80.0 mm, required RMS 0.0200) and OD-2540-SUB (aperture 79.0 mm, required RMS 0.0200)."
            - "Neither design needs to be released: POST /optics/export-classifications has no design-state precondition."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-FOM", aperture_mm: 80.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0200, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-SUB", aperture_mm: 79.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0200, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d2}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x2: $.data.id }
          assert:
            - "both creates return HTTP 201"
            - "ExportClassification.${x1}.figure_of_merit == 4000.00"
            - "ExportClassification.${x1}.eccn == 6A004.A.1"
            - "ExportClassification.${x1}.license_required == true"
            - "ExportClassification.${x1}.classification_status == LICENSE_REQUIRED"
            - "ExportClassification.${x2}.figure_of_merit == 3950.00"
            - "ExportClassification.${x2}.eccn == EAR99"
            - "ExportClassification.${x2}.license_required == false"
            - "ExportClassification.${x2}.classification_status == EXEMPT_CLEARED"

