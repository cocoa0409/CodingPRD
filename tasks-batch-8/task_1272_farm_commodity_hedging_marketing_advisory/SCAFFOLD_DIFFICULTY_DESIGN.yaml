            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
          trigger:
            - { call: "GET /advisory/operations/${op_id}/performance-report", as: Grower, as_user_id: "${op_id}", captures: { wap: $.data.weighted_avg_sale_price, bench: $.data.benchmark_price, bps: $.data.outperformance_bps, n: $.data.priced_contract_count, tn: $.data.benchmark_tick_count } }
          assert:
            - "HTTP 200 with priced_contract_count == 0 and benchmark_tick_count == 0"
            - "weighted_avg_sale_price is null, benchmark_price is null, outperformance_bps is null — empty set is reported, not errored and not zero-filled"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_create_blocked_by_suspended_buyer
        grounds:
          - state_machines.Buyer.APPROVED_to_SUSPENDED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair = SalesContract -> Buyer. A contract naming a SUSPENDED buyer
          is rejected ERR_BUYER_NOT_APPROVED; re-approving the same buyer
          (APPROVED<->SUSPENDED cycle) makes the identical request succeed — the
          contract's creatability is a function of Buyer state alone.
        test_recipe:
          setup:
            - "AGGRESSIVE operation with ACTIVE plan; buyer approved then suspended"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Dep Farm 1", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Flip Buyer", buyer_type: PROCESSOR, credit_rating: B }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/buyers/${buyer_id}/suspend", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 5000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer, captures: { bst: $.data.status } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 5000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id } }
          assert:
            - "While Buyer SUSPENDED: contract create rejected with ERR_BUYER_NOT_APPROVED"
            - "After re-approve (SUSPENDED -> APPROVED): identical payload succeeds (201), contract id returned"
      - name: recommendation_execute_blocked_by_margin_call
        grounds:
          - state_machines.HedgeRecommendation.ACCEPTED_to_EXECUTED
          - state_machines.MarginAccount.FUNDED_to_CALL_OUTSTANDING
        distinguishing_aspect: |
          Entity pair = HedgeRecommendation execution -> MarginAccount state
          (different pair from SalesContract -> Buyer). An ACCEPTED recommendation
          cannot execute while its operation's MarginAccount is CALL_OUTSTANDING;
          funding exactly to initial margin (equality cures) unblocks execution.
        test_recipe:
          setup:
            - "BALANCED operation expected 200000, ACTIVE plan, margin account funded 15000.00; position 50000 bu OPEN at 4.50 (IM 15000, MM 11000); tick 4.70 drives equity to 5000.00 -> CALL_OUTSTANDING (call 10000.00); second recommendation 1000 bu ACCEPTED"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Dep Farm 2", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/margin-accounts", payload: { operation_id: "${op_id}", initial_funding: 15000 }, as: CommodityAdvisor, captures: { acct: $.data.id } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.50, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 50000 }, as: CommodityAdvisor, captures: { rec1: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations/${rec1}/accept", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/hedge-recommendations/${rec1}/execute", as: CommodityAdvisor, captures: { pos1: $.data.id } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.70, kind: SETTLEMENT, price_date: "2026-07-01" }, as: PlatformAdmin }
            - { call: "GET /advisory/margin-accounts/${acct}", as: CommodityAdvisor, captures: { st_call: $.data.status, call_amt: $.data.margin_call_amount } }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 1000 }, as: CommodityAdvisor, captures: { rec2: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations/${rec2}/accept", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/hedge-recommendations/${rec2}/execute", as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/margin-accounts/${acct}/fund", payload: { amount: 10000 }, as: Grower, as_user_id: "${op_id}", captures: { st_cured: $.data.status } }
            - { call: "POST /advisory/hedge-recommendations/${rec2}/execute", as: CommodityAdvisor, captures: { pos2: $.data.id, entry2: $.data.entry_price } }
          assert:
            - "After 4.70 tick: account CALL_OUTSTANDING with margin_call_amount == 10000.00"
            - "Execute during call rejected with ERR_MARGIN_CALL_OUTSTANDING"
            - "Funding 10000.00 cures exactly: post-fund equity 15000.00 >= initial 15000.00 -> status FUNDED (equality cures)"
            - "Retry execute succeeds; new position entry_price == 4.70 (latest SETTLEMENT tick)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: buyer_delivery_windows_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_DELIVERY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on SalesContract delivery
