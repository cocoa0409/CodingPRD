            - call: "POST /om/crews"
              payload: { crew_code: "L-10", crew_type: "LINE", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr10: $.data.id }
            - { call: "POST /om/crews/${cr9}/start_shift", payload: {}, as: Dispatcher }
            - { call: "POST /om/crews/${cr10}/start_shift", payload: {}, as: Dispatcher }
