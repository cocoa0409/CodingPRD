  # =========================================================================
  # RULE 9 — compensating invariants over DIFFERENT conserved quantities
  #   instance 1: money — outstanding + paid + vacated == total_assessed
  #   instance 2: capacity — reserved + available == total_bench_hours
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: vacated_penalty_restores_manufacturer_penalty_ledger
        conserved_quantity: "Manufacturer penalty currency: outstanding_penalty_cents + paid_penalty_cents + vacated_penalty_cents == total_assessed_penalty_cents, with total_assessed_penalty_cents itself never decreasing"
        grounds:
          - state_machines.EnforcementCase.transitions.ADJUDICATED_UPHELD_to_VACATED
          - calculations.manufacturer_penalty_ledger
          - state_machines.LabelGrant.transitions.SUSPENDED_to_ACTIVE
          - entities.Manufacturer.fields.vacated_penalty_cents
        distinguishing_aspect: |
          Vacating an upheld case reverses the money and the standing cascade without rewriting history:
          28980 cents move from outstanding to vacated, total_assessed stays 28980, upheld_case_count
          drops back to 0, standing returns to GOOD and the SPONSOR_DELINQUENT suspension is lifted —
          yet the withdrawn display authorization is deliberately NOT reinstated, so the compensation is
          exact for the conserved quantity and explicitly partial for the retailer-side side effect.
