scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_zone_creation_returns_derived_defaults
        claim_type: creation
        grounds:
          - entities.Zone.fields.posture
          - entities.Zone.fields.rodent_index
          - endpoints[POST /vector-control/zones]
        distinguishing_aspect: "A freshly created Zone answers 201 with posture NORMAL, rodent_index 0.00, all four counters 0, version 1 and last_index_recomputed_at null."
        test_recipe:
          setup:
            - "Empty database, logical clock still at its 2026-05-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id, v: $.data.version }
          assert:
            - "HTTP 201 and Zone.${zone_id}.posture == NORMAL"
            - "Zone.${zone_id}.rodent_index == 0.00"
            - "Zone.${zone_id}.open_complaint_count == 0 and chronic_property_count == 0 and active_station_count == 0"
            - "Zone.${zone_id}.version == 1 and last_index_recomputed_at == null"
            - "Zone.${zone_id}.created_at == 2026-05-04T09:00:00.000Z"

      - name: corner_property_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints[GET /vector-control/properties/{id}]
        distinguishing_aspect: "A GET on a syntactically valid but unknown parcel UUID answers 404 with error_id ERR_PROPERTY_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /vector-control/properties/11111111-2222-3333-4444-555555555555"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_PROPERTY_NOT_FOUND"

      - name: corner_complaint_missing_description_rejected
        claim_type: required_fields
        grounds:
          - entities.Complaint.fields.description
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "description has source input and no default, so omitting it answers 400 ERR_VALIDATION and no Complaint row is created."
        test_recipe:
          setup:
            - "Zone, owner and parcel APN-1001 exist"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION"
            - "GET /vector-control/complaints?property_id=${prop_id} returns an empty array with total_count 0"

      - name: corner_property_unit_count_and_owner_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Property.fields.unit_count
          - entities.PropertyOwner.fields.notice_preference
          - entities.PropertyOwner.fields.hardship_certified
        distinguishing_aspect: "Omitting unit_count yields 1, omitting notice_preference yields CERTIFIED_MAIL and omitting hardship_certified yields false."
        test_recipe:
          setup:
            - "A zone exists"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id, pref: $.data.notice_preference }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "VACANT_LOT" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id, uc: $.data.unit_count }
          assert:
            - "PropertyOwner.${owner_id}.notice_preference == CERTIFIED_MAIL"
            - "PropertyOwner.${owner_id}.hardship_certified == false"
            - "PropertyOwner.${owner_id}.outstanding_balance_cents == 0 and lifetime_paid_cents == 0"
            - "Property.${prop_id}.unit_count == 1"
            - "Property.${prop_id}.chronic_score == 0.00 and provisional_chronic_score == 0.00 and chronic_flag == false"

      - name: corner_complaint_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Complaint.fields.complaint_type
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "complaint_type BIRD_NUISANCE is not a member of the declared enum, so the intake answers 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Zone, owner and parcel APN-1001 exist"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "BIRD_NUISANCE", reporter_type: "RESIDENT", description: "Pigeons on the roof" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION"
            - "Zone.${zone_id}.open_complaint_count == 0"

      - name: corner_assessment_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.Assessment
          - endpoints[GET /vector-control/inspections/{id}/assessments]
        distinguishing_aspect: "Assessment is declared common_fields false, so its response exposes id and created_at but no version and no updated_at, and no endpoint mutates it."
        test_recipe:
          setup:
            - "An IN_PROGRESS inspection on APN-1001 has recorded one assessment"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/inspections/${visit_id}/assessments"
              payload: { harborage_score: 4, attractant_score: 4, sanitation_score: 3, burrow_count: 0 }
              as: Inspector
              as_user_id: "${insp1_id}"
          trigger:
            - call: "GET /vector-control/inspections/${visit_id}/assessments"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { first_idx: "$.data[0].infestation_index" }
          assert:
            - "The array holds exactly 1 element with total_count 1"
            - "Assessment[0].infestation_index == 37.50 and infestation_tier == MODERATE"
            - "Assessment[0] exposes id and created_at but no version and no updated_at field"

      - name: corner_property_rejects_unknown_zone_id
        claim_type: parent_relationships
        grounds:
          - entities.Property.fields.zone_id
          - errors[ERR_ZONE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Foreign-key integrity on a flat topology: a parcel referencing an unknown zone_id answers 404 ERR_ZONE_NOT_FOUND and creates nothing."
        test_recipe:
          setup:
            - "An owner exists but no zone with the referenced id"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /vector-control/properties"
              payload: { zone_id: "99999999-8888-7777-6666-555555555555", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_ZONE_NOT_FOUND"

      - name: corner_duplicate_parcel_number_rejected
        claim_type: type_constraints
        grounds:
          - entities.Property.fields.parcel_number
          - validations[priority=10]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "parcel_number is unique across all properties, so a second parcel with APN-1001 answers 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup:
            - "Parcel APN-1001 already exists in zone Riverside"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "16 Elm St", parcel_number: "APN-1001", property_type: "COMMERCIAL_OTHER" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_DUPLICATE_CODE"
            - "GET /vector-control/properties?zone_id=${zone_id} returns exactly 1 row"

      - name: corner_bait_station_copies_zone_from_property
        claim_type: computed_fields
        grounds:
          - entities.BaitStation.fields.zone_id
          - entities.Zone.fields.active_station_count
          - endpoints[POST /vector-control/bait-stations]
        distinguishing_aspect: "BaitStation.zone_id is system-sourced from Property.zone_id at installation and the zone's active_station_count rises to 1; a zone_id supplied by the client has no effect because it is not an accepted input field."
        test_recipe:
          setup:
            - "Zone Riverside contains parcel APN-1001 and a certified inspector exists"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /vector-control/bait-stations"
              payload: { property_id: "${prop_id}", station_code: "BS-01", bait_type: "SNAP_TRAP" }
              as: Inspector
              as_user_id: "${insp1_id}"
              captures: { station_id: $.data.id, sz: $.data.zone_id }
            - call: "GET /vector-control/zones/${zone_id}"
              as: ProgramAdmin
              captures: { asc: $.data.active_station_count }
          assert:
            - "BaitStation.${station_id}.zone_id == ${zone_id}"
            - "BaitStation.${station_id}.status == ACTIVE with installed_at == 2026-05-04T09:00:00.000Z"
            - "BaitStation.${station_id}.reading_count == 0 and cumulative_take_pct == 0 and last_reading_at == null"
            - "Zone.${zone_id}.active_station_count == 1"
            - "GET /vector-control/bait-stations?zone_id=${zone_id} returns exactly 1 row"

      - name: corner_complaints_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /vector-control/complaints]
          - response_envelope.pagination_fields
        distinguishing_aspect: "A filtered complaint list with limit 2 and offset 2 returns 1 row, total_count 3 and has_more false under the declared pagination envelope."
        test_recipe:
          setup:
            - "Three complaints on parcel APN-1001 exist, all in RECEIVED"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence" }
              as: IntakeClerk
              captures: { c1: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "GARBAGE_ACCUMULATION", reporter_type: "AGENCY", description: "Refuse piled behind the building" }
              as: IntakeClerk
              captures: { c2: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "DEAD_ANIMAL", reporter_type: "ANONYMOUS", description: "Dead rat by the gate" }
              as: IntakeClerk
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /vector-control/complaints?property_id=${prop_id}&limit=2&offset=2"
              as: IntakeClerk
              captures: { first_id: "$.data[0].id" }
          assert:
            - "The response carries limit 2, offset 2, total_count 3 and has_more false"
            - "The data array holds exactly 1 element"
            - "Zone.${zone_id}.open_complaint_count == 3 and Zone.${zone_id}.rodent_index == 12.00"

  - section: state_machines
    instances:
      - name: corner_triage_of_already_triaged_complaint_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Complaint.RECEIVED_to_TRIAGED
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: "Triage is only defined from RECEIVED, so a second triage on the same complaint answers 409 ERR_INVALID_STATE and leaves severity, priority_score and triaged_at untouched."
        test_recipe:
          setup:
            - "A ROUTINE HARBORAGE complaint on APN-1001 was triaged once at 2026-05-04T09:00:00Z with severity HIGH"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "ROUTINE" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "CRITICAL" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Complaint.${comp_id}.severity == HIGH (not CRITICAL)"
            - "Complaint.${comp_id}.priority_score == 55.00 (base 40 for HIGH plus 15 for HARBORAGE, no chronic bonus, NORMAL posture)"
            - "Complaint.${comp_id}.response_due_at == 2026-05-07T09:00:00.000Z (72 hours after created_at)"

      - name: corner_start_inspection_twice_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Inspection.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Start is defined only from SCHEDULED, so the second start on an IN_PROGRESS visit answers 409 ERR_INVALID_STATE and started_at keeps its first value."
        test_recipe:
          setup:
            - "An inspection on APN-1001 was started at 2026-05-05T09:00:00Z"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
