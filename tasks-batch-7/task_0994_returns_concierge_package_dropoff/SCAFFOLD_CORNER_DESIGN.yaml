        claim_type: violation_to_error
        grounds: ["errors[ERR_ADJUSTMENT_EXCEEDS_PAYABLE]"]
        distinguishing_aspect: "An ADJUSTMENT of -20000 against payable 10000 fails with ERR_ADJUSTMENT_EXCEEDS_PAYABLE (payable floor at 0)."
        test_recipe:
