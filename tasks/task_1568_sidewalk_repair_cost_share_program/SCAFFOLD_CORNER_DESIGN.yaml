            - { call: "GET /bid-batches/${batch_id}", as: ProgramCoordinator, captures: { batch_v2: "$.data.version" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v2}" }, as: Contractor, as_user_id: "${contractor_l1}", captures: { bid_l1: "$.data.id", eval_l1: "$.data.evaluated_total_cents" } }
