              as: PressOfficer
              captures: { emb1: "$.data.embargo_status" }
          trigger:
            - call: "POST /abstracts/${ab1_id}/press-actions"
              payload: { action: "RELEASE", outlet_name: "Northline Daily" }
              as: PressOfficer
              captures: { emb2: "$.data.embargo_status", outlet: "$.data.press_outlet_name" }
            - call: "GET /authors/${au_ada_id}"
              as: ConferenceAdmin
              captures: { breaches: "$.data.embargo_breach_count", sanction: "$.data.sanction_status" }
          assert:
            - "HTTP 200"
            - "after SET_EMBARGO Abstract.${ab1_id}.embargo_status == EMBARGOED"
            - "Abstract.${ab1_id}.embargo_status == BREACHED (the clock 2026-01-05T00:00:00Z is before 2026-08-20T00:00:00Z, so RELEASE cannot land in RELEASED)"
            - "Abstract.${ab1_id}.press_outlet_name == Northline Daily"
            - "Abstract.${ab1_id}.status == ACCEPTED — the status dimension is untouched"
            - "Author.${au_ada_id}.embargo_breach_count == 1"
            - "Author.${au_ada_id}.no_show_strikes == 0"
            - "Author.${au_ada_id}.sanction_status == WARNED"

      - name: cascade_down_from_member_suspension_to_voided_reviews
        claim_type: cascade_down
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_SUSPENDED
          - state_machines.Review.ASSIGNED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / member_suspension_cascades_three_links_and_reassigns_the_review
          rationale: "CASCADE-C's three links - review VOIDED, load recomputed, replacement review created - are asserted end-to-end by the named §1.8 instance."

      - name: compensation_reverses_the_capacity_ledger_on_rescission
        claim_type: compensation
        grounds:
          - state_machines.Abstract.ACCEPTED_to_SCORED
          - calculations.format_capacity_waterfall
        excluded_because:
          difficulty_instance: compensating_invariant / format_capacity_ledger_is_conserved_across_rescission_and_promotion
          rationale: "The undo path and the absence of ledger drift are the whole subject of the named §1.8 instance."

      - name: cyclic_back_edge_bounds_the_cfa_extension_count
        claim_type: cyclic
        grounds:
          - state_machines.Conference.CFA_CLOSED_to_CFA_OPEN
          - entities.Conference.fields.cfa_extension_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / conference_cfa_reopen_cycle_is_bounded_at_one_extension
          rationale: "The loop, its bound at cfa_extension_count 1 and ERR_CFA_EXTENSION_LIMIT are asserted by the named §1.8 instance."

      - name: parallel_status_and_embargo_dimensions_are_independent
        claim_type: parallel
        grounds:
          - entities.Abstract.fields.status
          - entities.Abstract.fields.embargo_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / abstract_status_and_embargo_dimensions_advance_independently
          rationale: "The two-dimension independence claim is exactly what the named §1.8 instance walks."

  # ===========================================================================
  # SECTION 3 — Calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: weighted_score_applies_the_reviewers_negative_calibration_bias
        claim_type: correct_result
        grounds:
          - calculations.review_weighted_score
          - entities.CommitteeMember.fields.calibration_bias
          - entities.Review.fields.weighted_score
        distinguishing_aspect: |
          Scores 5 / 4 / 3 (relevance) / 3 (clarity) weight to
          0.40*5 + 0.30*4 + 0.15*3 + 0.15*3 = 4.10, and the reviewer's
          calibration_bias of -0.35 is added AFTER the weighting, giving 3.75.
          An implementation that biases the individual rubric scores, or applies
          the bias to the abstract mean instead of the review, lands elsewhere.
          With one of two required reviews in, provisional_score mirrors the
          single weighted value and score_spread stays null.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN, category GEN with min_reviews_required 2 and discrepancy_threshold 4.00."
            - "Reviewer Rui has calibration_bias -0.35 and holds one ASSIGNED review on Ada's abstract, which is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
