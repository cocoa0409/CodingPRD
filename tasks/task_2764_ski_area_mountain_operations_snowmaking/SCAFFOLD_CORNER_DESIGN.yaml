              payload: { decision: "OPEN", note: "probe" }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: -5.0, measured_at: "2026-08-01T00:00:01Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:01Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: {  }
              as: GroomingLead
          assert:
            - "Trigger 1: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - base_depth_policy 'MEDIAN_OF_STAKES' is outside the declared domain, and the coverage gap at priority 7 is NOT reported."
            - "Trigger 2: HTTP 422 with data.error_id == 'ERR_ENERGY_WINDOW_COVERAGE_GAP' - the identical windows with a legal policy now surface the business rule, which is what proves trigger 1 masked it."
            - "Trigger 3: HTTP 201 - the same season_label is still free, so neither rejection persisted a row; season_state == 'PRESEASON'."
            - "Trigger 4: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - decision 'MAYBE' is outside the enum, even though the season is PRESEASON (11) and the area is CLOSED (12) and would fail anyway."
            - "Trigger 5: HTTP 409 with data.error_id == 'ERR_SEASON_NOT_OPERATING' - with a legal decision the lowest surviving business rule reports, confirming trigger 4 outranked both 11 and 12."
            - "Trigger 6: HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - depth_in must be >= 0, and the future measured_at at priority 9 is not reported."
            - "Trigger 7: HTTP 422 with data.error_id == 'ERR_READING_TIMESTAMP_FUTURE' - the same timestamp with a legal depth now surfaces priority 9."
            - "Trigger 8: HTTP 201 - measured_at exactly at the logical clock is accepted."
            - "Trigger 9: total_count == 1, so neither the 400 nor the 422 persisted a reading."

  - section: rbac
    instances:
      - name: the_terrain_opening_decision_is_exclusive_to_the_mountain_ops_director
        claim_type: exclusive_operations
        grounds:
          - roles[MountainOpsDirector]
          - endpoints[POST /mountain-ops/terrain-areas/{id}/opening-decision]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: |
          The opening decision is the single most consequential write in the domain and exactly one of
          the six roles may issue it. All five other roles are exercised against a mountain that is fully
          ready, so the ONLY reason each is refused is the role header - if any of them were merely
          rejected by a business rule the response would be a 409 or a 422 instead of a 403. The five
          refusals must also be side-effect free, which the final GET pins by showing the area still READY
          with the day plan version unmoved.
        test_recipe:
          setup:
            - "A season OPERATING with an OPEN lift, a PUBLISHED_PARTIAL day plan and one READY area that satisfies every opening gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
