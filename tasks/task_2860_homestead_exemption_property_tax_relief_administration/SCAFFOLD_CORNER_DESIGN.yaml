            - "GET /parcels/${p3_id} finally shows exempt_value_cents == 200000, taxable_value_cents == 800000 and version == 3, the controlling freeze still being ${child1_id} (equal priority_rank 20, earlier created_at)"

      - name: substantiation_risk_threshold_rejects_at_fifty_five_and_passes_at_seventy
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.fraud_risk_score
          - validations[priority=34]
          - errors[ERR_RISK_SCORE_BELOW_THRESHOLD]
          - endpoints[POST /fraud-cases/{id}/decide]
          - endpoints[POST /exemption-applications/{id}/verification-checks]
          - calculations.recovery_assessment_total
        distinguishing_aspect: "RISK_SUBSTANTIATION_THRESHOLD 60 is probed from both sides on ONE case: the weight lattice (3500/3000/1500/2000) makes exactly 60 unreachable, so the tightest reachable neighbours are 55 (f1+f4) which is refused with ERR_RISK_SCORE_BELOW_THRESHOLD and 70 (f1+f3+f4) which passes after a single additional USPS_NCOA mismatch — and the refused attempt leaves investigation_status OPEN so the second attempt is not blocked by ERR_CASE_ALREADY_ADJUDICATED."
        test_recipe:
          setup:
            - "A HOMESTEAD_BASIC grant on P1 with benefit_amount_cents 8400000, approved from a VerificationCheck log that contains a corrected VOTER_REGISTRY mismatch and an uncorrected INCOME_DOR mismatch."
            - "SCREENING_SNAPSHOT at case opening sees only the LATEST row per source: VOTER MATCH -> f1 = 0, INCOME_DOR MISMATCH -> f4 = 100, one homestead parcel -> f2 = 0, no USPS_NCOA row -> f3 = 0, score = 2000 * 100 / 10000 = 20."
            - "ADJUDICATION_REPLAY latches the historical VOTER mismatch: f1 = f4 = 100 -> (3500 + 2000) * 100 / 10000 = 55, one point short of a two-factor pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /income-certifications"
              payload: { taxpayer_id: "${t_id}", certification_year: 2026, household_income_cents: 5000000, countable_asset_cents: 2000000, household_size: 2, recertification_due_date: "2027-06-30" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { cert_id: $.data.id }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "900 FAR AWAY RD SOUTHPORT ST 10099" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-10", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "INCOME_DOR", record_effective_date: "2026-01-15", reported_income_cents: 9000000 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app_id: $.data.id }
            - call: "POST /exemption-applications/${app_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { vc1_result: $.data.result }
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "INCOME_DOR" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { vc_income_result: $.data.result }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-02-10", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { vc2_result: $.data.result }
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { g1_id: $.data.resulting_grant_id }
          trigger:
            - call: "POST /fraud-cases"
              payload: { taxpayer_id: "${t_id}", grant_id: "${g1_id}", improper_start_tax_year: 2024, improper_end_tax_year: 2025, assessment_tax_year: 2026 }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { case_id: $.data.id, screening: $.data.screening_risk_score }
            - call: "POST /fraud-cases/${case_id}/decide"
              payload: { action: "SUBSTANTIATE", findings: "two-factor replay" }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { e_threshold: $.data.error_id }
            - call: "GET /fraud-cases/${case_id}"
              payload: {}
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { inv_after_422: $.data.investigation_status, rec_after_422: $.data.recovery_status, assessed_after_422: $.data.total_assessed_cents }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "USPS_NCOA", record_effective_date: "2026-03-01", address_normalized: "900 FAR AWAY RD SOUTHPORT ST 10099" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "USPS_NCOA" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { vc_ncoa_result: $.data.result }
            - call: "POST /fraud-cases/${case_id}/decide"
              payload: { action: "SUBSTANTIATE", findings: "three-factor replay" }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { replay2: $.data.adjudication_risk_score, total2: $.data.total_assessed_cents }
          assert:
            - "${vc1_result} == MISMATCH, ${vc2_result} == MATCH and ${vc_income_result} == MISMATCH (5000000 certified versus 9000000 reported)"
            - "${screening} == 20 — SCREENING_SNAPSHOT hides the corrected VOTER mismatch behind the later MATCH"
            - "${e_threshold} == ERR_RISK_SCORE_BELOW_THRESHOLD with HTTP 422: the ADJUDICATION_REPLAY score is 55, strictly below 60"
            - "${inv_after_422} == OPEN, ${rec_after_422} == NONE and ${assessed_after_422} == 0 — the refused adjudication wrote no score and no assessment"
            - "GET /exemption-grants/${g1_id} after the refusal still shows benefit_status SUSPENDED with suspension_reason FRAUD_INVESTIGATION (case opening already suspended it) and NOT REVOKED"
            - "${vc_ncoa_result} == MISMATCH — the forwarding address differs from the situs address"
            - "the second SUBSTANTIATE returns HTTP 200 with ${replay2} == 70 = (3500 + 1500 + 2000) * 100 / 10000 and investigation_status SUBSTANTIATED"
            - "${total2} == 246750 with back_tax_cents == 210000 (2 x 105000), penalty_cents == 21000 (2 x 10500) and interest_cents == 15750 (10500 + 5250), recovery_status ASSESSED"
            - "GET /exemption-grants/${g1_id} now shows benefit_status REVOKED, GET /taxpayer-accounts/${t_id} shows status BARRED, and the IncomeCertification ${cert_id} is untouched at PENDING because it was never CERTIFIED"

      - name: cascading_side_effect_chain_of_a_port_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ExemptionGrant[ACTIVE -> TRANSFERRED]
          - calculations.portable_freeze_allocation
          - calculations.parcel_value_decomposition
          - endpoints[POST /exemption-grants/{id}/port]
        excluded_because:
          difficulty_instance: full_port_cascade_reprices_source_and_destination_parcels_from_one_transfer
          rationale: "The §1.8 cascade_depth instance already walks the three declared cascade levels of a whole-balance port end-to-end and asserts both parcels' rewritten decompositions and both version increments, which subsumes any shallower cascade probe."

      - name: dual_variant_refund_calculation_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.retroactive_refund_amount.variants[GROSS_PROVISIONAL]
          - calculations.retroactive_refund_amount.variants[NET_FINAL]
        excluded_because:
          difficulty_instance: refund_gross_provisional_versus_net_final_on_retroactive_claim
          rationale: "The §1.8 dual_variant_divergence instance drives both variants over one claim with a live outstanding recovery balance and asserts the exact delta, so an isolated variant probe would add no discrimination."

      - name: dual_variant_risk_scoring_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.fraud_risk_score.variants[SCREENING_SNAPSHOT]
          - calculations.fraud_risk_score.variants[ADJUDICATION_REPLAY]
        excluded_because:
          difficulty_instance: fraud_risk_screening_snapshot_versus_adjudication_replay
          rationale: "The §1.8 dual_variant_divergence instance pins the snapshot-versus-replay divergence on one VerificationCheck log with a corrected mismatch; the threshold instance above reuses that divergence only as a means to reach the 55/70 boundary."

  # ===========================================================================
  # CONSISTENCY MODEL — §0.2 declares consistency_model: immediate, so the only
  # claim to generate is that all changes are visible in the same request's
  # response (no lag, no re-read delay).
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: determination_response_already_carries_the_grant_and_the_repriced_parcel
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.ExemptionApplication.fields.resulting_grant_id
          - calculations.parcel_value_decomposition
          - endpoints[POST /exemption-applications/{id}/determine]
          - endpoints[GET /exemption-grants]
        distinguishing_aspect: "Nothing is deferred: the determine response itself already exposes resulting_grant_id, and the immediately next reads — with no intervening call, no clock advance and no retry — already show the minted grant with applied_exempt_value_cents 8400000, the parcel at version 2 with exempt 8400000 / taxable 25200000, the taxpayer's derived net_relief_cents at 0 and the list endpoint's total_count at 1."
        test_recipe:
          setup:
            - "One fully verifiable HOMESTEAD_BASIC application on P1 sitting at UNDER_REVIEW; no grant exists yet, so GET /exemption-grants?parcel_id=P1 returns total_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-10", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app_id: $.data.id }
            - call: "POST /exemption-applications/${app_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
          trigger:
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { g1_id: $.data.resulting_grant_id, st_now: $.data.status }
            - call: "GET /exemption-grants"
              payload: { parcel_id: "${p1_id}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
              captures: { first_grant_id: "$.data[0].id", first_applied: "$.data[0].applied_exempt_value_cents" }
            - call: "GET /parcels/${p1_id}"
              payload: {}
