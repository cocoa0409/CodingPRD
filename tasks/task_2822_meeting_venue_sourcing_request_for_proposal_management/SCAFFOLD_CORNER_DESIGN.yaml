      claim_type: Computed read
      grounds:
      - endpoints[GET /sourcing/events/{event_id}/cost-comparison]
      - calculations.proposal_total_cost_model.variants
      - entities.MeetingEvent.fields.budget_ceiling_usd
      - calculations.rate_benchmark_compliance
      distinguishing_aspect: 'The comparison is a pure read that recomputes BOTH variants on the fly - it writes no BidEvaluation row - and it is not a fixed haircut off the contracted total: Harborline''s actualized figure 422797.82 books zero attrition damages because the 12%-shrunken 517 nights still exceed its 469-night allowance, while Cascade Bay''s shrunken 344 nights fall below its 370-night allowance and add 5148.00 of damages, so the two deltas differ (25047.02 vs 9844.90). Rows are ordered by contracted total ASC, so Cascade Bay leads, and the WITHDRAWN 34320.00 bid - the cheapest of all - is excluded because only live bids are compared.'
