  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (two dependencies on DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_verify_depends_on_tenant_credit_state
        grounds:
          - state_machines.Lease.DRAFT_to_VERIFIED
          - validations[priority=8]
          - errors[ERR_TENANT_CREDIT_NOT_APPROVED]
        distinguishing_aspect: |
          Cross-entity dependency on the LEASE -> TENANT pair: Lease.verify is
          valid only when the referenced Tenant.credit_assessment_status ==
          APPROVED. Verifying against an ANALYZED-but-not-approved tenant fails
          ERR_TENANT_CREDIT_NOT_APPROVED; approving the tenant unblocks the
          same call with no change to the lease payload.
        test_recipe:
          setup:
            - "Deal + property + tenant in ANALYZED (not APPROVED); lease DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "CrossEntDeal1", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 15000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties"
              payload: { address: "31 Cross Rd", property_type: "QSR", rentable_sqft: 3000, year_built: 2016 }
              as: AcquisitionsAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "CrossTenant", credit_rating: "NON_INVESTMENT_GRADE", credit_score: 650, annual_revenue_cents: 30000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /tenants/${t_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t_id}", lease_type: "NNN", annual_base_rent_cents: 900000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2035-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /tenants/${t_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { ok_status: $.data.status }
          assert:
            - "First verify returns ERR_TENANT_CREDIT_NOT_APPROVED (tenant ANALYZED, not APPROVED)"
            - "After tenant approval, identical verify call succeeds: Lease.${lease_id}.status == VERIFIED"

      - name: closing_statement_finalize_depends_on_deal_closed_state
        grounds:
          - state_machines.ClosingStatement.ACKNOWLEDGED_to_TRUED_UP
          - validations[priority=24]
          - errors[ERR_DEAL_NOT_CLOSED]
        distinguishing_aspect: |
          Cross-entity dependency on the CLOSING_STATEMENT -> DEAL pair
