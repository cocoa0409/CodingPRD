          - errors[ERR_REPLENISHMENT_ORDER_NOT_FOUND]
          - errors[ERR_RETURN_NOT_FOUND]
          - errors[ERR_APPLICABILITY_NOT_FOUND]
        distinguishing_aspect: "Each collection answers its own domain-specific 404 for an unknown UUID; a single shared ERR_NOT_FOUND for all ten would fail every assertion below."
