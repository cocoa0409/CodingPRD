          setup:
            - "A referral received 2026-03-02 in CNT_A at EVALUATION_PENDING with a coordinator assigned."
            - "An INITIAL_EVALUATION assessment listing all five domains has been COMPLETED on 2026-03-18 with 0 family-unavailable days."
            - "A FAMILY_ASSESSMENT assessment exists but is still SCHEDULED."
            - "Logical clock at 2026-03-20T09:00:00Z, and Referral.version captured immediately before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
