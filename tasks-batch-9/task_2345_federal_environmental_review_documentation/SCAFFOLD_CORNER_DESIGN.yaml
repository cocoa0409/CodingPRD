        distinguishing_aspect: "The feasibility gate applies to non-NO_ACTION alternatives only: Alternative C at 16.25 is refused with ERR_ALTERNATIVE_NOT_FEASIBLE while Alternative A, a NO_ACTION row scoring 35.00 — also below the 60.0 minimum — is screened in."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is CLASSIFIED with statement v1 ADOPTED and office.min_alternative_feasibility is the default 60.0."
            - "Alternative A is NO_ACTION scoring 35.00 and Alternative C is REASONABLE_RANGE scoring 16.25."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
