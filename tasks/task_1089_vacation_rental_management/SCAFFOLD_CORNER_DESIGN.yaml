          setup: ["A completed OWNER work order cost 60000 (requires_owner_approval true)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Ov", email: "ov@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { ov: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${ov}", address: "V", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pv: "$.data.id" } }
            - { call: "POST /work-orders", payload: { property_id: "${pv}", description: "roof", cost_cents: 60000, billable_to: "OWNER" }, as: PropertyManager, captures: { wv: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Mv", vendor_type: "MAINTENANCE", email: "mv@x.com" }, as: PropertyManager, captures: { vv: "$.data.id" } }
            - { call: "POST /work-orders/${wv}/assign", payload: { vendor_id: "${vv}" }, as: PropertyManager }
            - { call: "POST /work-orders/${wv}/start", payload: {}, as: Vendor, as_user_id: "${vv}" }
            - { call: "POST /work-orders/${wv}/complete", payload: {}, as: Vendor, as_user_id: "${vv}" }
          trigger:
            - { call: "POST /work-orders/${wv}/approve", payload: {}, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_OWNER_APPROVAL_REQUIRED"

