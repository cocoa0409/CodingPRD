        claim_type: correct_result
        grounds: [calculations.refill_allocation_waterfall]
        distinguishing_aspect: "Waterfall picks the earliest-expiring batch (FEFO) and allows partial allocation: task requesting 500 against a batch with 300 available allocates exactly 300 and still becomes READY."
        test_recipe:
          setup:
            - "Restaurant R1; line L1; ingredient ING shelf 240; hopper H1 cap 500 loaded 0->DEPLETED with queued order (FORECAST demand 100) — simpler: STANDARD manual request 500 (mode STANDARD); batches B_old (300 g, expires 02:00) and B_new (1000 g, expires 06:00) both READY"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
