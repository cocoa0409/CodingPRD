  # ===========================================================================
  - section: errors
    instances:

      - name: a_request_whose_role_header_is_not_a_declared_role_is_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "X-User-Role carrying a value that is not one of the seven declared roles is rejected at priority 2 with ERR_UNAUTHENTICATED 401, before any existence check runs, so a non-existent recipe id still answers 401 rather than 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /recipes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NoRoleHeader
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_UNAUTHENTICATED with HTTP 401, not ERR_PRODUCTION_RESOURCE_NOT_FOUND"

      - name: packaging_and_commercial_resource_not_found_use_their_own_error_ids
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PACKAGING_RESOURCE_NOT_FOUND]
          - errors[ERR_COMMERCIAL_RESOURCE_NOT_FOUND]
          - validations[priority=13]
          - validations[priority=16]
        distinguishing_aspect: "The catalog partitions 404s by aggregate: an unknown finished-lot id answers ERR_PACKAGING_RESOURCE_NOT_FOUND while an unknown shipment id answers ERR_COMMERCIAL_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /finished-lots/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: SalesRep
              captures: { err_pkg: $.data.error_id }
            - call: "GET /shipments/66666666-7777-4888-8999-000000000000"
              payload: {}
              as: SalesRep
              captures: { err_com: $.data.error_id }
          assert:
            - "the first trigger's error_id is ERR_PACKAGING_RESOURCE_NOT_FOUND with HTTP 404"
            - "the second trigger's error_id is ERR_COMMERCIAL_RESOURCE_NOT_FOUND with HTTP 404"

      - name: vessel_headspace_boundary_admits_exactly_ninety_percent_and_refuses_one_liter_more
        claim_type: Violation → Error
        grounds:
          - validations[priority=69]
          - constants.VESSEL_HEADSPACE_PCT
          - errors[ERR_VESSEL_CAPACITY_EXCEEDED]
        distinguishing_aspect: "On a 100 L vessel a 91.0 L pitch is refused with ERR_VESSEL_CAPACITY_EXCEEDED while a 90.0 L pitch, exactly the headspace limit, is accepted."
        test_recipe:
          setup: ["Two 100 L vessels, both freshly sanitised at the default clock, and one ACTIVE culture."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "Small Batch Yuzu", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
