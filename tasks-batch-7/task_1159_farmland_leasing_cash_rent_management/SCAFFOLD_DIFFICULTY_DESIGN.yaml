  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: flex_bonus_zero_at_exact_trigger
        grounds:
          - calculations.flex_rent_computation
          - endpoints: POST /settlements
        distinguishing_aspect: |
          Metric: gross-revenue threshold. At gross_revenue_cents EXACTLY equal
          to revenue_trigger_cents (9000000 == 9000000) the bonus is 0 — the
          rule is strict inequality (revenue > trigger), so the boundary value
          itself yields landlord_amount_cents == 2000000 (base only).
        test_recipe:
          setup:
            - "FLEX lease ACTIVE: 100 acres, base 20000/acre, bonus 20%, cap 500000, trigger 9000000; lease.version == 2"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Bnd", contact_email: "lb@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Bnd", years_experience: 10 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F11", acres: 100, soil_csr2: 86 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "FLEX", flex_base_per_acre_cents: 20000, flex_bonus_pct: 0.2, flex_cap_cents: 500000, revenue_trigger_cents: 9000000, cash_equivalent_bid_cents_per_acre: 22000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "GET /leases/${lse}"
              as: FarmManager
              captures:
                lv: "$.data.version"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${lse}", crop_year: 2027, price_source: "ACTUAL", yield_bu_per_acre: 180, harvest_price_cents_per_bu: 500, expected_lease_version: "${lv}" }
              as: FarmManager
              captures:
                s_id: "$.data.id"
                amt: "$.data.landlord_amount_cents"
          assert:
            - "settlement ${s_id}.gross_revenue_cents == 9000000 (180*500*100 == trigger exactly)"
            - "settlement ${s_id}.landlord_amount_cents == 2000000 (bonus 0 at equality: strict > semantics)"

      - name: exact_full_payment_marks_paid
        grounds:
          - calculations.late_fee_and_allocation
          - state_machines.PaymentInstallment.OPEN_to_PAID
          - endpoints: POST /installments/{installmentId}/record_payment
        distinguishing_aspect: |
          Metric: zero-remaining-balance quantity. Paying exactly the
          outstanding amount (paid_cents == amount_cents, >= boundary at
          equality) flips the installment to PAID and drives the landlord's
          pending_receivable_cents to exactly 0; one cent less would leave it
          OPEN.
        test_recipe:
          setup:
            - "CASH lease ACTIVE; clock 2027-03-01; I1 1250000 OPEN, I2 SCHEDULED"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Pay", contact_email: "lpy@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
            - call: "POST /tenants"
              payload: { name: "T Pay", years_experience: 2 }
              as: FarmManager
              captures:
                tn: "$.data.id"
            - call: "POST /tenants/${tn}/approve"
              as: FarmManager
            - call: "POST /fields"
              payload: { landlord_id: "${ld}", name: "F12", acres: 100, soil_csr2: 75 }
              as: FarmManager
              captures:
                fld: "$.data.id"
            - call: "POST /offerings"
              payload: { field_id: "${fld}", term_years: 1, term_start_date: "2027-03-01T00:00:00Z", min_bid_per_acre_cents: 20000, reference_yield_bu_per_acre: 200, reference_price_cents_per_bu: 500, bid_deadline: "2026-06-15T00:00:00Z" }
              as: FarmManager
              captures:
                off: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
            - call: "POST /leases/${lse}/activate"
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: FarmManager
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                i1: "$.data[0].id"
          trigger:
            - call: "POST /installments/${i1}/record_payment"
              payload: { amount_cents: 1250000 }
              as: FarmManager
              as_user_id: "mgr-1"
              captures:
                i1_st: "$.data.status"
                i1_paid: "$.data.paid_cents"
            - call: "GET /landlords/${ld}"
              as: FarmManager
              captures:
                pend: "$.data.pending_receivable_cents"
          assert:
            - "installment ${i1}.status == PAID at exact full coverage (paid_cents == amount_cents, >= boundary)"
            - "installment ${i1}.paid_cents == 1250000"
            - "landlord ${ld}.pending_receivable_cents == 0 (I1 PAID excluded, I2 SCHEDULED excluded)"

      - name: empty_report_window_yields_zero_aggregates
        grounds:
          - calculations.owner_report_aggregation
          - endpoints: POST /reports
        distinguishing_aspect: |
          Metric: empty-set aggregation. A report window matching zero payments,
          zero expenses, zero non-compliance events yields literal 0 for all
          three aggregates (not null, not an error) — a different metric
          (collection emptiness) and endpoint (POST /reports) than the
          money-threshold instances.
        test_recipe:
          setup:
            - "Landlord exists but has no leases, payments, expenses, or compliance events at all"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Empty", contact_email: "le@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
          trigger:
            - call: "POST /reports"
              payload: { landlord_id: "${ld}", report_type: "QUARTERLY", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: FarmManager
              captures:
                r_id: "$.data.id"
          assert:
            - "report ${r_id}.rent_collected_cents == 0"
            - "report ${r_id}.expenses_approved_cents == 0"
            - "report ${r_id}.noncompliant_count == 0"
            - "report ${r_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_activation_blocked_by_suspended_tenant
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - validations[priority=6]
          - errors[ERR_TENANT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Lease <- Tenant: the DRAFT -> ACTIVE transition on Lease
          is gated on the TENANT entity's status field; a SUSPENDED tenant
          forces ERR_TENANT_NOT_APPROVED even though every lease-local
          precondition holds.
        test_recipe:
          setup:
            - "Awarded bid and DRAFT lease exist; tenant was APPROVED at award time but is SUSPENDED before activation"
          setup_api_calls:
            - call: "POST /landlords"
