            - "no other status action is an edge either: CHECK_IN, TERMINATE and WITHDRAW each return 409 ERR_RESIDENCY_STATE_INVALID from COMPLETED"
            - "the lockdown crosses to the compliance axis: POST /residencies/${res}/compliance with action 'SUSPEND' returns 409 ERR_RESIDENCY_STATE_INVALID, because that edge requires status IN {SCHEDULED, IN_RESIDENCE}"
            - "and to facility writes: POST /studio-assignments for this residency returns 409 ERR_RESIDENCY_STATE_INVALID (P27 covers that endpoint), while POST /residencies/${res}/schedule returns 409 ERR_RESIDENCY_NOT_SCHEDULED (P26 requires status SCHEDULED)"
            - "reads remain fully available after lockdown: GET /residencies/${res} and GET /residencies/${res}/tax-report both return 200"

      - name: visa_case_docs_submit_before_a_request_is_not_an_edge
