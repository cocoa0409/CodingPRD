# =============================================================================
# §1.9 Scaffold Corner Design — task_3077 MERS
# Breadth probe: every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered by
# a §1.8 instance appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: member_create_returns_declared_fields_and_pending_activation
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/registry/members
        distinguishing_aspect: "A member created with the four required inputs returns 201 with status PENDING_ACTIVATION, version 1, null termination_effective_date, and system-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z (no set call). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/members"
              payload: { legal_name: "First Registry Bank", org_id: "2000000", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Member.${m}.legal_name == \"First Registry Bank\" and org_id == \"2000000\""
            - "Member.${m}.status == PENDING_ACTIVATION and version == 1"
            - "Member.${m}.termination_effective_date is null"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id is present"

      - name: member_get_returns_stored_entity_and_unknown_id_is_404
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/registry/members/{memberId}
          - errors.ERR_MEMBER_NOT_FOUND
        distinguishing_aspect: "GET returns the exact stored member; a well-formed but unknown id returns 404 ERR_MEMBER_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup:
            - "One member exists."
          setup_api_calls:
            - call: "POST /registry/members"
              payload: { legal_name: "First Registry Bank", org_id: "2000000", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "GET /registry/members/${m}"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-reader"
            - call: "GET /registry/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-reader"
              captures: { err: $.data.error_id }
          assert:
            - "the first GET returns 200 with Member.${m}.org_id == \"2000000\""
            - "the second GET returns 404 and err == ERR_MEMBER_NOT_FOUND"
            - "the 404 body has response_type error and data carries error_id and message"

      - name: members_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/registry/members
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 3 members, limit=2 returns 2 rows, total_count 3, has_more true; offset=2 returns the last row with has_more false; no params defaults to limit 10 offset 0."
        test_recipe:
          setup:
            - "Three members created."
          setup_api_calls:
            - call: "POST /registry/members"
              payload: { legal_name: "M1", org_id: "2000001", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "M2", org_id: "2000002", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "M3", org_id: "2000003", org_id_type: "CHARTER_NUMBER", member_type: "CUSTODIAN" }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/members"
              payload: { limit: 2, offset: 0 }
              as: RegistryAdmin
          assert:
            - "response_type is array with exactly 2 rows, total_count == 3, has_more == true"
            - "GET /registry/members with limit 2 offset 2 returns 1 row, total_count 3, has_more false"
            - "GET /registry/members?status=PENDING_ACTIVATION returns all 3 rows"

      - name: member_create_missing_org_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.org_id
          - validations[priority=0]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "org_id is required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the required-field gate, before any uniqueness check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/members"
              payload: { legal_name: "No Org Id Bank", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /registry/members returns 0 rows"

      - name: signer_create_omitting_effective_until_defaults_to_null_open_ended
        claim_type: Defaults
        grounds:
          - entities.AuthorizedSigner.fields.effective_until
        distinguishing_aspect: "effective_until declares default null (open-ended); omitting it stores null, and the signer is usable for foreclosure at any clock after effective_from."
        test_recipe:
          setup:
            - "Member A ACTIVE; signer created without effective_until."
          setup_api_calls:
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { sig: $.data.id }
          trigger:
            - call: "GET /registry/members/${m_a}/signers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "AuthorizedSigner.${sig}.effective_until is null"
            - "AuthorizedSigner.${sig}.status == ACTIVE and role_scope == ALL"

      - name: loan_min_and_foreclosure_mode_are_computed_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.RegisteredLoan.fields.min
          - entities.RegisteredLoan.fields.foreclosure_mode
          - entities.RegisteredLoan.fields.current_investor_id
        distinguishing_aspect: "min, serial, foreclosure_mode, current_investor_id and current_servicer_id are server-computed: a registration for org 1000000's first TX loan mints min 100000000000000016, serial 1, mode IN_REGISTRY_ALLOWED, and both rights on the registering member."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A (org 1000000) ACTIVE with signer."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 12345678, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
          assert:
            - "RegisteredLoan.${loan}.min == \"100000000000000016\""
            - "RegisteredLoan.${loan}.serial == 1"
            - "RegisteredLoan.${loan}.foreclosure_mode == IN_REGISTRY_ALLOWED"
            - "RegisteredLoan.${loan}.current_investor_id == ${m_a} and current_servicer_id == ${m_a}"
            - "RegisteredLoan.${loan}.status == ACTIVE and version == 1"

      - name: ny_property_state_derives_assign_out_required_mode
        claim_type: Computed Fields
        grounds:
          - entities.RegisteredLoan.fields.foreclosure_mode
          - calculations.min_check_digit
        distinguishing_aspect: "property_state NY (in the pinned {NY, CA} set) derives foreclosure_mode ASSIGN_OUT_REQUIRED while an otherwise identical TX loan derives IN_REGISTRY_ALLOWED — the derivation is by state set membership, not by an input flag."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A (org 1000000) ACTIVE with signer."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "NY", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan_ny: $.data.id }
          assert:
            - "RegisteredLoan.${loan_ny}.foreclosure_mode == ASSIGN_OUT_REQUIRED"

      - name: loan_serial_is_per_member_and_never_reused
        claim_type: System Fields
        grounds:
          - entities.RegisteredLoan.fields.serial
        distinguishing_aspect: "Serial is per-registering-member: member A's first two loans get serials 1 and 2 (MINs …016, …024); member B's first loan restarts at serial 1 (MIN 100000100000000014)."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Members A (org 1000000) and B (org 1000001) ACTIVE with signers."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { a1: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { a2: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_b}"
              captures: { b1: $.data.id }
          assert:
            - "RegisteredLoan.${a1}.serial == 1 and min == \"100000000000000016\""
            - "RegisteredLoan.${a2}.serial == 2 and min == \"100000000000000024\""
            - "RegisteredLoan.${b1}.serial == 1 and min == \"100000100000000014\""

      - name: invalid_enum_member_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.member_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "member_type outside {ORIGINATOR, SERVICER, INVESTOR, SUBSERVICER, CUSTODIAN} is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/members"
              payload: { legal_name: "Bad Type Co", org_id: "2000009", org_id_type: "TAX_ID", member_type: "HEDGE_FUND" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: loan_create_by_suspended_member_rejected_and_by_pending_member_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_MEMBER_NOT_ACTIVE
          - entities.Member.fields.status
        distinguishing_aspect: "Registration is gated on acting member status: a PENDING_ACTIVATION member (never activated) and a SUSPENDED member both get 409 ERR_MEMBER_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member P exists PENDING_ACTIVATION (has signer but not activated); member S ACTIVE then suspended."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Pending Co", org_id: "2000010", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_p: $.data.id }
            - call: "POST /registry/members/${m_p}/signers"
              payload: { full_name: "Pat Signer", email: "pat@pending.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Suspended Co", org_id: "2000011", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_s: $.data.id }
            - call: "POST /registry/members/${m_s}/signers"
              payload: { full_name: "Sue Signer", email: "sue@suspended.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_s}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members/${m_s}/suspend"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_p}"
              captures: { err_p: $.data.error_id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_s}"
              captures: { err_s: $.data.error_id }
          assert:
            - "err_p == ERR_MEMBER_NOT_ACTIVE (409)"
            - "err_s == ERR_MEMBER_NOT_ACTIVE (409)"
            - "GET /registry/loans returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: member_activation_requires_active_signer
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Member.PENDING_ACTIVATION_to_ACTIVE
          - errors.ERR_NO_AUTHORIZED_SIGNER
        distinguishing_aspect: "A member with zero signers cannot activate: 409 ERR_NO_AUTHORIZED_SIGNER; after designating one signer activation succeeds."
        test_recipe:
          setup:
            - "Member A exists with no signers."
          setup_api_calls:
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
          trigger:
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
          assert:
            - "the first activate returns 409 err == ERR_NO_AUTHORIZED_SIGNER"
            - "the second activate returns 200 and Member.${m_a}.status == ACTIVE"

      - name: revoke_last_active_signer_of_active_member_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AuthorizedSigner.ACTIVE_to_REVOKED
          - errors.ERR_NO_AUTHORIZED_SIGNER
        distinguishing_aspect: "Revoking the only ACTIVE signer of an ACTIVE member is rejected with ERR_NO_AUTHORIZED_SIGNER; the same revocation is legal while the member is SUSPENDED."
        test_recipe:
          setup:
            - "Member A ACTIVE with exactly one ACTIVE signer."
          setup_api_calls:
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { sig: $.data.id }
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/members/${m_a}/signers/${sig}/revoke"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /registry/members/${m_a}/suspend"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/signers/${sig}/revoke"
              payload: {}
              as: RegistryAdmin
          assert:
            - "the first revoke returns 409 err == ERR_NO_AUTHORIZED_SIGNER and signer stays ACTIVE"
            - "after suspending the member the same revoke returns 200 and signer status == REVOKED"

      - name: loan_foreclose_from_terminal_assigned_out_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RegisteredLoan.ACTIVE_to_INACTIVE_ASSIGNED_OUT
          - errors.ERR_LOAN_NOT_ACTIVE
        distinguishing_aspect: "Once a NY loan assigns out (INACTIVE_ASSIGNED_OUT, terminal), any further foreclose/satisfy/transfer attempt on it is rejected — foreclose gets 409 ERR_LOAN_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with ALL signer; one NY loan registered and foreclosed with assignment_out=true (loan now INACTIVE_ASSIGNED_OUT)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { sig: $.data.id }
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "NY", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
            - call: "POST /registry/loans/${loan}/foreclose"
              payload: { signer_id: "${sig}", assignment_out: true }
              as: MemberRep
              as_user_id: "${m_a}"
          trigger:
            - call: "POST /registry/loans/${loan}/satisfy"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the loan left the registry: status == INACTIVE_ASSIGNED_OUT and assigned_out_at == 2026-01-05T00:00:00Z"
            - "satisfy on the terminal loan returns 409 err == ERR_LOAN_NOT_ACTIVE"

      - name: rescind_from_active_loan_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RegisteredLoan.FORECLOSING_to_ACTIVE
          - errors.ERR_LOAN_NOT_FORECLOSING
        distinguishing_aspect: "rescind-foreclosure is only valid from FORECLOSING; calling it on an ACTIVE loan returns 409 ERR_LOAN_NOT_FORECLOSING."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with signer; one ACTIVE TX loan."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /registry/loans/${loan}/rescind-foreclosure"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_LOAN_NOT_FORECLOSING"
            - "RegisteredLoan.${loan}.status is still ACTIVE"

      - name: transfer_match_confirm_by_wrong_member_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TransferMatch.PENDING_to_MATCHED
          - errors.ERR_NOT_MATCH_PARTY
        distinguishing_aspect: "Only the transfer's from-side member may confirm the match; the to-side member (now the servicer) gets 403 ERR_NOT_MATCH_PARTY, then the from-side succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Members A, B ACTIVE with signers; A's TX loan transferred A->B SERVICING on time (CONFIRMED, match PENDING to A)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
