              payload: { order_id: "${order_k2_id}", delivery_center_id: "${center_bay1_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T16:30:00Z", scheduled_end: "2026-09-22T17:30:00Z", expected_order_version: "${order_k2_v}" }
              as: DeliveryAdvisor
