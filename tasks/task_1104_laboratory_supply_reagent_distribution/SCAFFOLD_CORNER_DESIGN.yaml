  - section: cross_cutting_layers
    instances:
      - name: occ_lot_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lot-adjust-stale-lot]", "errors[ERR_STALE_LOT_VERSION]"]
        distinguishing_aspect: "First adjustment with the observed version succeeds (version 1 -> 2); a second adjustment carrying the same observed version is rejected 412 ERR_STALE_LOT_VERSION."
        test_recipe:
          setup: ["warehouse, zone, product; lot of 20 (version 1)"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id", lot_v: "$.data.version" } }
          trigger:
            - { call: "POST /lab/lots/${lot_id}/adjustments", payload: { delta: 5, reason: "cycle count surplus", expected_lot_version: "${lot_v}" }, as: InventoryClerk, captures: { qoh_after: "$.data.quantity_on_hand", v_after: "$.data.version" } }
            - { call: "POST /lab/lots/${lot_id}/adjustments", payload: { delta: 5, reason: "cycle count surplus again", expected_lot_version: "${lot_v}" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "first adjustment: captured qoh_after == 25 and v_after == 2"
            - "second adjustment with the stale version: captured err == ERR_STALE_LOT_VERSION and HTTP status == 412"
            - "ReagentLot.${lot_id}.quantity_on_hand remains 25 and adjustment_total == 5"

      - name: occ_reallocate_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-reallocate-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "Reallocate is legal from ALLOCATED, so the only guard against a stale re-plan is OCC: the first reallocate with the observed version succeeds; a repeat with the same version gets 412 ERR_STALE_ORDER_VERSION."
        test_recipe:
          setup: ["warehouse, zone, product, lot of 20; customer; order qty 8 submitted ALLOCATED (order version 2 after submit)"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 8, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { ord_v: "$.data.version" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/reallocate", payload: { expected_order_version: "${ord_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { st1: "$.data.status", v1: "$.data.version" } }
            - { call: "POST /lab/orders/${order_id}/reallocate", payload: { expected_order_version: "${ord_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "first reallocate: captured st1 == ALLOCATED and v1 == ord_v + 1"
            - "second reallocate with the stale version: captured err == ERR_STALE_ORDER_VERSION and HTTP status == 412"

      - name: occ_customer_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[customer-update-stale-customer]", "errors[ERR_STALE_CUSTOMER_VERSION]"]
        distinguishing_aspect: "PATCH with the observed version succeeds (1 -> 2); a second PATCH with the same observed version gets 412 ERR_STALE_CUSTOMER_VERSION and changes nothing."
        test_recipe:
          setup: ["customer created with credit_limit 100000 (version 1)"]
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 100000 }, as: AccountManager, captures: { cust_id: "$.data.id", cust_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /lab/customers/${cust_id}", payload: { credit_limit_cents: 200000, expected_customer_version: "${cust_v}" }, as: AccountManager, captures: { lim: "$.data.credit_limit_cents", v2: "$.data.version" } }
            - { call: "PATCH /lab/customers/${cust_id}", payload: { credit_limit_cents: 300000, expected_customer_version: "${cust_v}" }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "first PATCH: captured lim == 200000 and v2 == 2"
            - "second PATCH: captured err == ERR_STALE_CUSTOMER_VERSION and HTTP status == 412; CustomerAccount.${cust_id}.credit_limit_cents remains 200000"

      - name: sequential_mode_allocates_consecutive_run
        claim_type: selector_policy
        grounds: [calculations.sequential_lot_run_selection]
        distinguishing_aspect: "A SEQUENTIAL line of 5 units allocates across the consecutive run {seq 1, seq 2} (3 + 2), draining lot 1 to DEPLETED and leaving lot 2 with 1."
        test_recipe:
          setup: ["warehouse, REFRIGERATED FEFO zone, cold-chain product; lot seq 1 qty 3 and lot seq 2 qty 3; customer; order qty 5 SEQUENTIAL"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 300, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 3, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot1: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 3, manufacture_date: "2026-02-15" }, as: InventoryClerk, captures: { lot2: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 5, fulfillment_mode: "SEQUENTIAL" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st: "$.data.status" } }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { alloc: "$.data[0].allocated_quantity", line_id: "$.data[0].id" } }
            - { call: "GET /lab/reservations", payload: { order_line_id: "${line_id}" }, as: OpsAdmin, captures: { r0_lot: "$.data[0].lot_id", r0_qty: "$.data[0].quantity", r1_lot: "$.data[1].lot_id", r1_qty: "$.data[1].quantity" } }
          assert:
            - "captured st == ALLOCATED and alloc == 5"
            - "reservations: ${lot1} x 3 and ${lot2} x 2 (run {1, 2} filled lowest sequence first)"
            - "ReagentLot.${lot1}.status == DEPLETED and ReagentLot.${lot2}.quantity_on_hand == 1"

      - name: sequential_no_consecutive_run_backorders_empty_pool
        claim_type: selector_policy
        grounds: [calculations.sequential_lot_run_selection]
        distinguishing_aspect: "With lot seq 2 quarantined, the eligible lots {seq 1 (qty 2), seq 3 (qty 4)} form no consecutive run covering 5 units: the SEQUENTIAL line receives ZERO reservations and the order lands BACKORDERED."
        test_recipe:
          setup: ["as sequential_mode_allocates_consecutive_run but lots qty 2 / 5 / 4 with the middle lot quarantined before ordering, so eligible runs are {seq 1} (2) and {seq 3} (4) — neither reaches 5"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 300, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 2, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot1: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-02-15" }, as: InventoryClerk, captures: { lot2: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 4, manufacture_date: "2026-03-15" }, as: InventoryClerk, captures: { lot3: "$.data.id" } }
            - { call: "POST /lab/lots/${lot2}/quarantine", payload: {}, as: QualityManager }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 5, fulfillment_mode: "SEQUENTIAL" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st: "$.data.status" } }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { alloc: "$.data[0].allocated_quantity", line_st: "$.data[0].status", line_id: "$.data[0].id" } }
            - { call: "GET /lab/reservations", payload: { order_line_id: "${line_id}" }, as: OpsAdmin }
          assert:
            - "captured st == BACKORDERED and alloc == 0 and line_st == PENDING"
            - "the reservations list for the line is empty (sequential lines never partially allocate)"
