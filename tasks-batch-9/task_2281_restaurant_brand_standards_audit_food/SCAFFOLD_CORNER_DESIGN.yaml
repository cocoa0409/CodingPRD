        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-2, section: FOOD_SAFETY, max_points: 20, is_critical: true, display_order: 2}
          as: BrandAdmin
          captures: {fs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-1, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 3}
          as: BrandAdmin
          captures: {bs1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-2, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 4}
          as: BrandAdmin
          captures: {bs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-1, section: FACILITY, max_points: 12, is_critical: false, display_order: 5}
          as: BrandAdmin
          captures: {fc1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-2, section: FACILITY, max_points: 8, is_critical: false, display_order: 6}
          as: BrandAdmin
          captures: {fc2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/publish
          payload: {}
          as: BrandAdmin
          captures: {rv_status: $.data.status}
        - call: POST /audit-visits
          payload: {location_id: '${loc_id}', auditor_id: '${aud_id}', rubric_version_id: '${rv_id}', visit_type: UNANNOUNCED, scheduled_start_at: '2026-08-05T09:00:00Z', scheduled_end_at: '2026-08-05T13:00:00Z'}
          as: BrandAdmin
          captures: {v1_id: $.data.id}
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-05T09:00:00Z'}
          as: BrandAdmin
        - call: POST /audit-visits/${v1_id}/start
          payload: {}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fs1_id}', points_awarded: 27}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fs2_id}', points_awarded: 20}
