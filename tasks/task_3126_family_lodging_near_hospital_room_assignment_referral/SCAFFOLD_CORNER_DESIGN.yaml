  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_defaults_to_2026_09_01_and_sets
        claim_type: conditional_action
        grounds: [endpoints.POST_/_clock/set_current_utc]
        distinguishing_aspect: "Before any set call the logical clock reads exactly 2026-09-01T00:00:00Z (not wall-clock), and the set call moves it deterministically."
        test_recipe:
          setup: ["Empty database; clock never set."]
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id, house_created: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/houses"
              payload: { name: "Maple House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house2_id: $.data.id, house2_created: $.data.created_at }
          assert:
            - "House.${house_id}.created_at == \"2026-09-01T00:00:00.000Z\"  (default logical clock, not wall-clock)"
            - "House.${house2_id}.created_at == \"2026-09-10T12:00:00.000Z\"  (set clock honored)"

