      - name: minor_incidental_release_without_guardian_signature_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_31
          - errors.ERR_GUARDIAN_SIGNATURE_REQUIRED
          - entities.Release.fields.guardian_signature
          - endpoints.POST_/casting/shoot-blocks/{id}/releases
        distinguishing_aspect: |
          Violation claim on a conditional required field. guardian_signature defaults to
          false and is perfectly acceptable on an INCIDENTAL_CROWD release, but a
          MINOR_INCIDENTAL release with the default is refused with
          ERR_GUARDIAN_SIGNATURE_REQUIRED at 422 — the requirement is triggered by
          subject_kind, not by the block or the head count. The refused attempt leaves
          covered_head_count untouched, proving the coverage rollup runs only on an
          accepted write.
        test_recipe:
          setup:
            - "One production; one permitted venue; one PUBLIC_SPACE block with no called participants, an expected crowd of 200, an ACTIVE duty-of-care protocol and status ROLLING."
