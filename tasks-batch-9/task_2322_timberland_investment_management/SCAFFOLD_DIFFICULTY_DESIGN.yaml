      - name: closed_harvest_window_versus_half_open_lease_blackout
        grounds:
          - "validations[priority=64]"
          - calculations.lease_rent_and_coverage
          - state_machines.HarvestBlock.RESERVED_to_COMMITTED
          - entities.HarvestBlock.fields.planned_end_date
        distinguishing_aspect: |
          The two intervals close differently. Against an ACTIVE blackout
          [2027-06-01, 2027-12-01), block P [2027-12-01, 2027-12-31] commits because the
          blackout's end date is EXCLUDED, while block Q [2027-03-01, 2027-06-01] is
          rejected because the block's own end date is INCLUDED and the blackout's start
          date is INCLUDED. Treating either interval as fully closed or fully half-open
          flips exactly one of the two answers.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Canonical fund and 'Piney Creek Tract' acquired (OWNED, CERTIFIED)."
