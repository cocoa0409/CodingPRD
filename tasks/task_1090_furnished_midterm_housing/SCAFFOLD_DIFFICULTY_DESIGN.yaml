              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse M", email: "nurseM@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docM" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U13", address: "13 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "trigger[0] captured err == ERR_TENANT_NOT_VERIFIED (tenant PENDING)"
            - "trigger[2] captured ok_status == CONFIRMED (after Verification APPROVED -> tenant VERIFIED)"

      - name: payout_schedule_requires_booking_completed
        grounds:
          - state_machines.Payout.PENDING_to_SCHEDULED
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Entity pair Payout<-Booking (different from Booking<-Tenant): a PENDING
          payout can move to SCHEDULED only when its Booking is COMPLETED;
          scheduling while the booking is ACTIVE yields ERR_BOOKING_NOT_COMPLETED.
        test_recipe:
          setup:
            - "Verified host/tenant, LISTED unit; booking [2026-06-01,2026-07-01] confirmed then ACTIVE at clock 2026-06-15; Payout PENDING"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host N", email: "hostN@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse N", email: "nurseN@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docN" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U14", address: "14 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id" }
          trigger:
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ok_status: $.data.status }
          assert:
            - "trigger[0] captured err == ERR_BOOKING_NOT_COMPLETED (booking still ACTIVE)"
            - "trigger[3] captured ok_status == SCHEDULED (after booking COMPLETED)"

