scenario: "Consumption Credit Pricing, Warehouse Sizing & Data Sharing Governance (Snowflake): compute credits consumed per second by virtual warehouse size with auto-suspend and auto-resume behavior, capacity purchase contracts with credit drawdown, rollover rules and overage pricing, warehouse sizing and multi-cluster scaling decisions balancing query latency against credit burn, storage billing separate from compute with time travel and fail-safe retention costs, secure data sharing with consumers who query a provider's data without copying it and consumption attribution, marketplace listings with paid data products and usage-based provider payouts, resource monitors and quota enforcement to prevent runaway spend, cross-region and cross-cloud replication costs"
domain_name: "consumption-credit-warehouse-governance"
api_prefix: "/v1"
complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "optimistic_concurrency"
    - "dual_variant_calculation"
    - "derived_field_reconciliation"
    - "rate_threshold_triggers"
    - "idempotency"
    - "bulk_operations"
  entity_topology: "hybrid"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "self_referential"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Legal organization name of the account that owns warehouses and contracts."
      - name: account_locator
        type: string
        source: input
        description: "Globally unique account locator; the identity key for the account's data products."
        constraints: "unique across all accounts; regex ^[a-z0-9]{2}[0-9]{4}$"
      - name: region
        type: enum
        source: input
        description: "Deployment region the account's warehouses and storage are provisioned in; a replication target region equal to this value is refused."
        constraints: "one of {us-east-1, us-west-2, eu-central-1, ap-southeast-1}; set at creation and immutable thereafter"
      - name: region_factor
        type: number
        source: computed
        description: "Replication factor for this account's own region, reported for comparison against a configured target_region."
        constraints: ">= 1.0"
      - name: cloud_provider
        type: enum
        source: input
        description: "Underlying cloud the account runs on; drives replication cloud_factor."
        constraints: "one of {SAME_CLOUD, CROSS_CLOUD}"
      - name: monitor_scope
        type: enum
        source: input
        description: "Whether resource monitors declared on this account bind to it or are also inherited by its consumers."
        constraints: "one of {ACCOUNT_ONLY, INCLUDE_CONSUMERS}"
        default: "ACCOUNT_ONLY"
      - name: posted_consumption_credits_reconciled
        type: number
        source: computed
        description: "Denormalized running sum of compute credits already consumed by this account; reconciled from AccountLedgerEntry rows of buckets {CONSUMPTION, SHARE_CONSUMPTION}. Always derived, never written by a client."
        default: 0.0
      - name: posted_storage_dollars_reconciled
        type: number
        source: computed
        description: "Denormalized running sum of storage dollars posted for this account; reconciled from AccountLedgerEntry rows."
        default: 0.0
      - name: account_state
        type: enum
        source: computed
        description: "Derived posture of the account, re-derived after every ledger posting and every monitor evaluation."
        constraints: "one of {OPEN, RESTRICTED, DRAINING}"
        default: "OPEN"

  - name: VirtualWarehouse
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account that owns this warehouse and is billed for its credits."
      - name: name
        type: string
        source: input
        description: "Warehouse identifier unique within the owning account."
        constraints: "unique within account_id"
      - name: size
        type: enum
        source: input
        description: "T-shirt size that sets credits_per_hour via warehouse_credit_burn."
        constraints: "one of {XSMALL, SMALL, MEDIUM, LARGE, XLARGE, XXLARGE, XXXLARGE, X4LARGE}"
        default: "XSMALL"
      - name: credits_per_hour
        type: number
        source: computed
        description: "Credit rate per hour for a single cluster at the current size, derived from warehouse_credit_burn SIZE_FACTORS. Recomputed on every resize."
      - name: auto_suspend_seconds
        type: integer
        source: input
        description: "Idle seconds before the warehouse auto-suspends; also the billed floor applied to each session by warehouse_credit_burn."
        constraints: ">= 60 and <= 3600"
        default: 600
      - name: auto_resume
        type: boolean
        source: input
        description: "Whether a query against a suspended warehouse auto-resumes it (XSMALL size, clusters_min) or is rejected."
        default: true
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the warehouse; OP has two independent state dimensions (status x cluster_count)."
        constraints: "one of {SUSPENDED, STARTING, RUNNING, RESIZING, DRAINING}"
        default: "SUSPENDED"
      - name: cluster_count
        type: integer
        source: computed
        description: "Current number of running clusters; the second, independent state dimension on this entity."
        constraints: ">= 0"
        default: 0
      - name: clusters_min
        type: integer
        source: input
        description: "Lower bound the multi-cluster scaling rule may not go below."
        constraints: ">= 1"
        default: 1
      - name: clusters_max
        type: integer
        source: input
        description: "Upper bound the multi-cluster scaling rule may not go above."
        constraints: ">= clusters_min and <= 10"
        default: 1
      - name: multi_cluster_queued_queries
        type: integer
        source: computed
        description: "Queries concurrently queued against this warehouse; the demand input to warehouse_cluster_scaling."
        default: 0
      - name: latency_slo_ms
        type: integer
        source: input
        description: "Latency target the scaling rule tries to meet; used only for the reported scaling rationale, never to mutate cluster_count."
        constraints: ">= 1"
        default: 1000

  - name: WarehouseSession
    parent: VirtualWarehouse
    common_fields: true
    fields:
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> VirtualWarehouse.id; the warehouse that served the session."
      - name: size
        type: enum
        source: system
        description: "Snapshot of the warehouse size in force for the whole session; frozen at start so a mid-session resize cannot re-price an open session."
        constraints: "one of {XSMALL, SMALL, MEDIUM, LARGE, XLARGE, XXLARGE, XXXLARGE, X4LARGE}"
      - name: clusters
        type: integer
        source: system
        description: "Snapshot of cluster_count in force for the whole session."
        constraints: ">= 1"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the session started; the ordering key for every chronological rollup."
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock instant the session ended; null while the session is open."
      - name: elapsed_seconds
        type: integer
        source: system
        description: "Wall-clock seconds between started_at and ended_at on the logical clock; stored explicitly so billing never re-derives it from drifting timestamps."
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: "Session lifecycle; a session stuck in RESUMING immediately ends with billed_seconds 0."
        constraints: "one of {OPEN, CLOSING, CLOSED, RESUMING}"
        default: "OPEN"
      - name: metered_credits
        type: number
        source: computed
        description: "Credits charged by the METERED variant of warehouse_credit_burn; rounded to 6 decimals at session close and frozen."
        default: 0.0
      - name: billed_credits
        type: number
        source: computed
        description: "Credits charged by the BILLED_FLOOR variant of warehouse_credit_burn; rounded to 6 decimals at session close and frozen. Always >= metered_credits."
        default: 0.0
      - name: billed_seconds
        type: integer
        source: computed
        description: "Seconds actually billed: elapsed_seconds raised to auto_suspend_seconds when the session closed while RUNNING below the floor, and exactly 0 for a session that closed from RESUMING."
        default: 0

  - name: CapacityContract
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account that purchased the capacity."
      - name: term_start
        type: datetime
        source: input
        description: "Start of the contract term on the logical clock; inclusive."
      - name: term_end
        type: datetime
        source: input
        description: "End of the contract term on the logical clock; exclusive. term_end MUST be strictly after term_start."
      - name: base_credits
        type: number
        source: input
        description: "Contracted credit quantity for the term."
        constraints: "> 0"
      - name: overage_rate_per_credit
        type: number
        source: input
        description: "Dollar price per credit drawn beyond base_credits that is not covered by rollover_credits."
        constraints: "> 0"
      - name: rollover_cap_credits
        type: number
        source: input
        description: "Absolute credit ceiling on what may roll into this contract, and the divisor basis for rollover_utilization_pct."
        constraints: "> 0"
      - name: currency
        type: enum
        source: input
        description: "Billing currency code stamped on every drawdown, overage and expiry posting for this contract."
        constraints: "one of {USD, EUR, GBP, JPY}"
        default: "USD"
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle; overage accumulates while ACTIVE and stops the instant the term is closed."
        constraints: "one of {DRAFT, ACTIVE, EXHAUSTED, EXPIRED, CLOSED}"
        default: "DRAFT"
      - name: drawdown_count
        type: integer
        source: computed
        description: "Number of drawdowns posted against this contract; the idempotency key namespace for POST /credit-drawdowns."
        default: 0
      - name: remaining_credits
        type: number
        source: computed
        description: "base_credits + rolled_over_credits - drawn_credits, floored at 0. NOT decremented while the contract is DRAFT."
        default: 0.0
      - name: drawn_credits
        type: number
        source: computed
        description: "Sum of ACTIVE CreditDrawdown rows bound to this contract, plus consumption_credits of ATTRIBUTED usage records bound to it."
        default: 0.0
      - name: rolled_over_credits
        type: number
        source: computed
        description: "Credits carried in from prior terms, booked to the ROLLOVER bucket by the EXPIRED->ACTIVE RENEW transition."
        default: 0.0
      - name: base_consumed_credits
        type: number
        source: computed
        description: "Portion of base_credits already consumed; the segment cursor that contract_credit_drawdown advances so the BASE segment can never be over-consumed."
        default: 0.0
      - name: term_end_remaining_credits
        type: number
        source: computed
        description: "remaining_credits frozen at the instant the term ended; the basis contract_rollover_utilization AT_RENEWAL uses, so a renewal cannot be inflated by the AT_EXPIRY booking that preceded it."
        default: 0.0
      - name: activated_by_user_id
        type: string
        source: system
        description: "Opaque operator id of the FinanceController who activated this contract; the segregation-of-duties key that forbids the same operator from closing it."
        default: null

  - name: CreditDrawdown
    parent: CapacityContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> CapacityContract.id; the contract being drawn down."
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> VirtualWarehouse.id; the warehouse whose sessions created this consumption."
      - name: amount_credits
        type: number
        source: input
        description: "Credits drawn in this drawdown."
        constraints: "> 0 and <= 1000"
      - name: source_kind
        type: enum
        source: input
        description: "Which downstream consumption produced this drawdown; selects which AccountLedgerEntry bucket receives the mirror posting."
        constraints: "one of {SESSION, SHARE_CONSUMPTION, REPLICATION}"
      - name: status
        type: enum
        source: input
        description: "Drawdown lifecycle."
        constraints: "one of {ACTIVE, REVERSED}"
        default: "ACTIVE"
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied key; unique within the contract. A second POST with the same key returns the first drawdown unchanged instead of drawing again."
      - name: outcome
        type: enum
        source: computed
        description: "Which bucket the drawdown ultimately settled into on the contract."
        constraints: "one of {BASE, ROLLOVER, OVERAGE}"
      - name: overage_usd
        type: number
        source: computed
        description: "Dollars posted to the OVERAGE bucket for the over-allowance portion of this drawdown; 0.00 when outcome is BASE or ROLLOVER."
        default: 0.0

  - name: StorageUsageRecord
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account whose data is stored."
      - name: usage_date
        type: datetime
        source: input
        description: "Logical-clock instant the daily storage snapshot was captured."
      - name: active_tb
        type: number
        source: input
        description: "Terabytes of live data, billed at the ACTIVE storage rate."
        constraints: ">= 0"
      - name: time_travel_tb
        type: number
        source: input
        description: "Terabytes held for time-travel retention."
        constraints: ">= 0"
      - name: fail_safe_tb
        type: number
        source: input
        description: "Terabytes held beyond time travel for fail-safe recovery."
        constraints: ">= 0"
      - name: time_travel_days
        type: integer
        source: input
        description: "Configured time-travel retention window in days."
        constraints: ">= 0 and <= 90"
      - name: fail_safe_days
        type: integer
        source: system
        description: "Fail-safe retention window; fixed at 7 days and not settable by clients."
        default: 7
      - name: billable_storage_tb
        type: number
        source: computed
        description: "Derived billable volume from storage_billable_volume; not the raw sum of the three components."
      - name: storage_cost_dollars
        type: number
        source: computed
        description: "Total dollars for this snapshot per storage_billing_time_travel_fail_safe; exact formula differs between the TWO components declared in that rule."
        default: 0.0
      - name: snapshot_state
        type: enum
        source: computed
        description: "Snapshot lifecycle; a REVISED snapshot's prior dollars are reversed through the STORAGE_ADJUST bucket."
        constraints: "one of {FINALIZED, REVISED}"
        default: "FINALIZED"

  - name: DataShare
    parent: Account
    common_fields: true
    fields:
      - name: provider_account_id
        type: string
        source: input
        description: "FK -> Account.id; the account exposing the data. The share's provider is this account."
      - name: name
        type: string
        source: input
        description: "Share name unique within the provider account."
        constraints: "unique within provider_account_id"
      - name: objects_exposed
        type: integer
        source: input
        description: "Number of database objects exposed to consumers without copying."
        constraints: ">= 1"
      - name: consumer_account_ids
        type: array
        source: input
        description: "Accounts allowed to mount this share. Each list member MUST be the id of an existing Account and MUST differ from provider_account_id."
      - name: status
        type: enum
        source: input
        description: "Share lifecycle; a DRAFT share cannot be mounted, so it admits no consumer attribution."
        constraints: "one of {DRAFT, PUBLISHED, SUSPENDED}"
        default: "DRAFT"
      - name: consumer_query_count
        type: integer
        source: computed
        description: "Denormalized count of consumer queries run against this share; reconciled from ShareUsageEvent rows."
        default: 0
      - name: consumer_credits
        type: number
        source: computed
        description: "Denormalized sum of charged_credits for consumer queries through this share; a query that returned zero rows is counted in consumer_query_count but contributes 0.0 here."
        default: 0.0

  - name: ShareUsageEvent
    parent: DataShare
    common_fields: true
    fields:
      - name: share_id
        type: string
        source: input
        description: "FK -> DataShare.id; the share the consumer queried."
      - name: consumer_account_id
        type: string
        source: input
        description: "FK -> Account.id; the account that ran the query. MUST differ from the share's provider_account_id."
      - name: queried_at
        type: datetime
        source: system
        description: "Logical-clock instant of the query; the ordering key for share attribution rollups."
      - name: credits_consumed
        type: number
        source: input
        description: "Credits burned by the consumer's query. Charges the CONSUMER, never the provider."
        constraints: "> 0"
      - name: row_count
        type: integer
        source: input
        description: "Rows the consumer's query returned. Copied verbatim into attributed_row_count; 0 means the query matched nothing."
        constraints: ">= 0"
      - name: attribution
        type: enum
        source: computed
        description: "Attribution outcome produced by data_share_consumption_attribution; only the CONSUMER bucket is reachable in v1, and row_count distinguishes the two CONSUMER probes."
        constraints: "one of {CONSUMER, UNATTRIBUTED}"
        default: "CONSUMER"
      - name: attributed_row_count
        type: integer
        source: computed
        description: "Denormalized row count billed to the consumer, copied from the input row_count; 0 means the query returned no rows."
        default: 0
      - name: credited_account_id
        type: string
        source: computed
        description: "Account charged for this query, which is always the consumer account and never the provider account."
        default: null

  - name: Listing
    parent: DataShare
    common_fields: true
    fields:
      - name: share_id
        type: string
        source: input
        description: "FK -> DataShare.id; the share this listing packages for sale."
      - name: title
        type: string
        source: input
        description: "Marketplace listing title."
      - name: pricing_model
        type: enum
        source: input
        description: "How buyers are charged for the listing."
        constraints: "one of {FREE, FLAT, USAGE_BASED}"
      - name: flat_price_usd
        type: number
        source: input
        description: "One-time price; for USAGE_BASED listings this freezes on the first provider payout and is ignored by every later payout."
        constraints: ">= 0"
      - name: listing_state
        type: enum
        source: input
        description: "Listing lifecycle; a WITHDRAWN listing is terminal and its earnings remain payable but are no longer accruing."
        constraints: "one of {DRAFT, PUBLISHED, WITHDRAWN}"
        default: "DRAFT"
      - name: gross_credit_volume
        type: number
        source: computed
        description: "PaidShareUsage rows bound to this listing, valued at their price_per_credit; the raw earnings basis before the commission split."
        default: 0.0
      - name: provider_payout_usd
        type: number
        source: computed
        description: "Provider share of gross_credit_volume per provider_payout_split; frozen at the value in force for the listing's first payout if the listing is USAGE_BASED and frozen_price_usd is non-null."
        default: 0.0
      - name: platform_fee_usd
        type: number
        source: computed
        description: "Platform commission on gross_credit_volume; provider_payout_usd + platform_fee_usd equals gross_credit_volume exactly."
        default: 0.0
      - name: frozen_price_usd
        type: number
        source: system
        description: "Price locked at the first provider payout of a USAGE_BASED listing; null until then and never overwritten afterwards."
        default: null

  - name: PaidShareUsage
    parent: Listing
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; the paid listing whose data the buyer queried."
      - name: buyer_account_id
        type: string
        source: input
        description: "FK -> Account.id; the account that bought and queried the listing. MUST be distinct from the listing's provider account."
      - name: credits_used
        type: number
        source: input
        description: "Credits the buyer spent on this paid query."
        constraints: "> 0"
      - name: price_per_credit
        type: number
        source: computed
        description: "Dollar price applied per credit for this usage row. On the first payout it is set from the listing's flat_price_usd and thereafter frozen, so a subsequent price change cannot retroactively alter it."
        constraints: ">= 0"
      - name: usage_state
        type: enum
        source: input
        description: "Buyer-side settlement of the row; only SETTLED rows count toward a payout."
        constraints: "one of {PENDING, SETTLED, DISPUTED}"
        default: "PENDING"
      - name: disputed_by_user_id
        type: string
        source: system
        description: "Opaque operator id of the PlatformOperator who raised the dispute; the segregation-of-duties key that forbids the same operator from resolving it."
        default: null

  - name: ResourceMonitor
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account whose consumption this monitor watches."
      - name: name
        type: string
        source: input
        description: "Monitor name unique within the account."
        constraints: "unique within account_id"
      - name: credit_quota
        type: number
        source: input
        description: "Credit allowance for the current interval."
        constraints: "> 0"
      - name: interval
        type: enum
        source: input
        description: "Reset cadence of the monitor on the logical clock."
        constraints: "one of {DAILY, WEEKLY, MONTHLY}"
        default: "MONTHLY"
      - name: action
        type: enum
        source: input
        description: "Behaviour at each threshold crossing."
        constraints: "one of {NOTIFY, SUSPEND, SUSPEND_IMMEDIATE}"
        default: "NOTIFY"
      - name: monitor_state
        type: enum
        source: computed
        description: "Threshold posture; a SUSPEND monitor whose scope is INCLUDE_CONSUMERS suspends every consumer warehouse in the same sweep."
        constraints: "one of {OK, NOTIFY_SENT, SUSPENDED}"
        default: "OK"
      - name: interval_consumption_credits
        type: number
        source: computed
        description: "Credits consumed in the current interval window, recomputed by resource_monitor_threshold from AccountLedgerEntry rows."
        default: 0.0
      - name: used_pct
        type: number
        source: computed
        description: "interval_consumption_credits / credit_quota * 100, rounded to 6 decimals; the metric the monitor_notify and monitor_suspend crossing rules compare against."
        default: 0.0
      - name: last_reset_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent interval reset; the exclusive lower bound of the current interval window."

  - name: ReplicationConfiguration
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account owning the primary data being replicated."
      - name: name
        type: string
        source: input
        description: "Replication group name unique within the account."
        constraints: "unique within account_id"
      - name: target_region
        type: enum
        source: input
        description: "Destination region; selects region_factor in replication_transfer_cost."
        constraints: "one of {us-east-1, us-west-2, eu-central-1, ap-southeast-1}"
      - name: target_cloud
        type: enum
        source: input
        description: "Destination cloud; selects cloud_factor."
        constraints: "one of {SAME_CLOUD, CROSS_CLOUD}"
      - name: replicated_tb
        type: number
        source: input
        description: "Terabytes transferred in the most recent replication refresh."
        constraints: ">= 0 and <= 500"
      - name: refresh_count
        type: integer
        source: computed
        description: "Number of refreshes applied; each refresh recomputes transfer_cost_dollars."
        default: 0
      - name: transfer_cost_dollars
        type: number
        source: computed
        description: "Dollars for the latest refresh per replication_transfer_cost; the COST_PER_TB mode of combinatorial formula rule 2."
        default: 0.0
      - name: last_refresh_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent refresh."
      - name: replication_state
        type: enum
        source: input
        description: "Replication lifecycle."
        constraints: "one of {CONFIGURED, REFRESHING, REFRESHED, FAILED}"
        default: "CONFIGURED"

  - name: AccountLedgerEntry
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account this ledger row is posted against."
      - name: bucket
        type: enum
        source: system
        description: "Which running balance the row moves; non-compensable buckets are untouched by any reversal."
        constraints: "one of {CONSUMPTION, OVERAGE, ROLLOVER, REPLICATION, SHARE_CONSUMPTION, STORAGE, STORAGE_ADJUST, PAYOUT, PAYOUT_ADJUST}"
      - name: source_entity
        type: string
        source: system
        description: "Name of the entity whose transition posted this row (WarehouseSession, CreditDrawdown, StorageUsageRecord, ReplicationConfiguration, ShareUsageEvent, Listing, CapacityContract)."
      - name: source_entity_id
        type: string
        source: system
        description: "Id of the specific source row; together with source_entity and bucket this is the posting's uniqueness key."
      - name: amount_credits
        type: number
        source: system
        description: "Signed credit delta for credit-denominated buckets; always 0 for STORAGE, OVERAGE, REPLICATION and PAYOUT rows."
        default: 0.0
      - name: amount_usd
        type: number
        source: system
        description: "Signed dollar delta for dollar-denominated buckets; always 0 for CONSUMPTION, ROLLOVER and SHARE_CONSUMPTION rows."
        default: 0.0
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the row was posted; the ordering key for chronological rollups."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a role declared in §1.7; for a role whose identity is entity_backed, X-User-ID is also required and MUST equal the id of an existing instance of that entity. Opaque roles need no particular X-User-ID value."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 3
    category: existence
    check: "Every referenced resource exists, validated left to right along the path: the owning Account, then the VirtualWarehouse, CapacityContract, DataShare, Listing, StorageUsageRecord or ReplicationConfiguration itself."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-bearing endpoints"
  - priority: 4
    category: business_referential
    check: "Body-supplied foreign keys resolve: CreditDrawdown.warehouse_id must be a VirtualWarehouse owned by the drawdown's contract account, CreditDrawdown.contract_id must exist, ShareUsageEvent.consumer_account_id must exist, and ReplicationConfiguration.target_region targets a region other than the account's own region."
    error_id: ERR_REFERENCE_INVALID
    http_status: 422
    applies_to: ["POST /credit-drawdowns", "POST /shares/{id}/usage-events", "POST /replication-configurations", "PATCH /replication-configurations/{id}"]
  - priority: 5
    category: business_referential
    check: "A body-supplied reference must agree with the resource named in the path: a CreditDrawdown whose warehouse_id names a warehouse owned by a different account than contract_id is refused, and a StorageUsageRecord named in a revise or finalize path must exist under the account the client asserts."
    error_id: ERR_REFERENCE_INVALID
    http_status: 422
    applies_to: ["POST /credit-drawdowns", "POST /storage-usage-records/{id}/revise", "POST /storage-usage-records/{id}/finalize"]
  - priority: 6
    category: state
    check: "The target resource is in a state that admits the requested transition, per the from: clause of the matching §1.2 entry: warehouse status IN {RUNNING, RESIZING} to scale, SUSPENDED to resume, RUNNING to suspend or resize, DRAINING to complete a drain; session state OPEN to close; contract status DRAFT to activate, EXPIRED to renew, ACTIVE or EXPIRED or EXHAUSTED to close; storage snapshot FINALIZED to revise and REVISED to finalize; share PUBLISHED to suspend or revoke; listing DRAFT to publish and PUBLISHED to withdraw; usage PENDING to settle is system-only, SETTLED to dispute and DISPUTED to resolve; replication CONFIGURED or REFRESHED or FAILED to refresh. Body-level reference errors are handled at priority 4 and are not part of this state check."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_fiscal
    check: "The owning Account.account_state is not DRAINING. A DRAINING account rejects new CreditDrawdown rows, new WarehouseSession rows, warehouse resume and replication refresh; it does not reject the compensating close and withdraw actions, so an in-flight resource can still be wound down."
    error_id: ERR_ACCOUNT_DRAINING
    http_status: 422
    applies_to: ["POST /credit-drawdowns", "POST /warehouse-sessions", "POST /warehouses/{id}/resume", "POST /replication-configurations/{id}/refresh"]
  - priority: 8
    category: business_fiscal
    check: "Segregation of duties on the contract path: a CapacityContract whose activated_by_user_id equals the acting X-User-ID cannot be closed by that same operator."
    error_id: ERR_ROLE_CONFLICT
    http_status: 422
    applies_to: ["POST /capacity-contracts/{id}/close"]
  - priority: 9
    category: business_fiscal
    check: "The drawdown fits inside the contract's allowance plus its rollover ceiling: contract.drawn_credits + amount_credits must not exceed base_credits + rolled_over_credits + credit_quota_ceiling, where credit_quota_ceiling is the rollover_cap_credits of the contract's ACTIVE term. A drawdown that would breach the ceiling is refused outright instead of being silently clipped."
    error_id: ERR_CONTRACT_CREDIT_EXHAUSTED
    http_status: 422
    applies_to: ["POST /credit-drawdowns"]
  - priority: 10
    category: business_safety
    check: "A DataShare's consumer_account_ids MUST NOT contain provider_account_id, and a ShareUsageEvent.consumer_account_id MUST differ from the provider account of the share it queries. Self-consumption is refused rather than being billed to anyone."
    error_id: ERR_SHARE_SELF_CONSUMPTION
    http_status: 422
    applies_to: ["POST /data-shares", "PATCH /data-shares/{id}", "POST /shares/{id}/usage-events"]
  - priority: 11
    category: business_constraint
    check: "No temporal-overlap conflict exists. Two CapacityContract rows of the same account must not have overlapping half-open [term_start, term_end) windows — adjacency where one term_end equals the next term_start is allowed, and a zero-width term is refused. Two StorageUsageRecord rows of the same account must not have overlapping half-open daily windows [usage_date, usage_date + 1 day), so a snapshot covering a day already covered is refused while a gap of unbilled days is permitted."
    error_id: ERR_TERM_OVERLAP
    http_status: 409
    applies_to: ["POST /capacity-contracts", "POST /capacity-contracts/{id}/renew", "POST /warehouse-sessions"]
  - priority: 12
    category: business_constraint
    check: "Per-account uniqueness: VirtualWarehouse.name, CapacityContract.idempotency_key namespace, ResourceMonitor.name and ReplicationConfiguration.name are unique within their account, DataShare.name is unique within its provider account, and Listing.title is unique within its share."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "all create endpoints, plus the idempotency_key namespace on POST /credit-drawdowns"
  - priority: 13
    category: business_constraint
    check: "Field-level shape and range: clusters_min <= clusters_max <= 10 raises ERR_CLUSTER_RANGE and requested_clusters below parallel_intent_min raises ERR_CLUSTER_RANGE; auto_suspend_seconds outside [60, 3600] raises ERR_AUTO_SUSPEND_RANGE; time_travel_days outside [0, 90] raises ERR_STORAGE_DAYS_RANGE; amount_credits not strictly positive or above 1000 raises ERR_DRAWDOWN_AMOUNT_RANGE; replicated_tb negative or above 500 raises ERR_REPLICATION_SIZE_RANGE; everything else (absent required field, unknown enum member) raises ERR_INVALID_REQUEST."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["POST /warehouses", "PATCH /warehouses/{id}", "POST /warehouses/{id}/cluster-scaling"]

  - priority: 14
    category: business_safety
    check: "A usage event, a listing create, a listing publish or a paid usage row may only reference a DataShare whose status is PUBLISHED; a DRAFT or SUSPENDED share admits no consumer attribution."
    error_id: ERR_SHARE_NOT_PUBLISHED
    http_status: 422
    applies_to: ["POST /shares/{id}/usage-events", "POST /listings", "POST /listings/{id}/publish", "POST /paid-share-usage"]
  - priority: 15
    category: business_safety
    check: "A DataShare.monitor_scope of INCLUDE_CONSUMERS requires at least one PUBLISHED DataShare of the account and at least one ResourceMonitor bound to the account; a monitor-driven sweep with no monitor to drive it is refused."
    error_id: ERR_MONITOR_MISSING
    http_status: 422
    applies_to: ["POST /resource-monitors/{id}/reset", "POST /warehouses/{id}/resume"]
  - priority: 16
    category: business_fiscal
    check: "A warehouse resume or a session open is refused while any ResourceMonitor of the owning account is in monitor_state SUSPENDED with action SUSPEND_IMMEDIATE; the same attempt against a SUSPEND monitor is admitted because the SUSPEND action has already drained the warehouse itself."
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: ["POST /warehouses/{id}/resume", "POST /warehouse-sessions"]
  - priority: 17
    category: state
    check: "An operation that needs a running warehouse is refused when status IN {SUSPENDED, DRAINING} and auto_resume is false; with auto_resume true the same operation instead drives SUSPENDED through STARTING to RUNNING."
    error_id: ERR_WAREHOUSE_SUSPENDED
    http_status: 409
    applies_to: ["POST /warehouse-sessions", "PATCH /warehouses/{id}"]
  - priority: 18
    category: state
    check: "A WarehouseSession operation requires the session's own state to be the transition's from: state; a second close of an already CLOSED session is refused here rather than being silently ignored."
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: ["POST /warehouse-sessions/{id}/close"]
  - priority: 19
    category: state
    check: "Paid usage may only be recorded against, and a payout only reported for, a Listing whose listing_state is PUBLISHED; a DRAFT or WITHDRAWN listing is closed to new buyer usage."
    error_id: ERR_LISTING_NOT_PUBLISHED
    http_status: 409
    applies_to: ["POST /paid-share-usage", "GET /listings/{id}/provider-payout"]
  - priority: 20
    category: business_fiscal
    check: "A payout is refused against a Listing whose pricing_model is FREE; a free listing has no credit volume to split."
    error_id: ERR_FREE_LISTING_NOT_PAYABLE
    http_status: 422
    applies_to: ["POST /paid-share-usage", "GET /listings/{id}/provider-payout"]
  - priority: 21
    category: business_temporal
    check: "A buyer usage row may only be settled while its usage_state is PENDING; settling an already SETTLED or DISPUTED row is refused."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /paid-share-usage/{id}/settle"]
  - priority: 22
    category: business_fiscal
    check: "Segregation of duties on the payout path: a PaidShareUsage row whose disputed_by_user_id equals the acting X-User-ID cannot be resolved by that same operator, which is a different error surface from the contract-path conflict at priority 8."
    error_id: ERR_DISPUTE_SELF_RESOLVE
    http_status: 422
    applies_to: ["POST /paid-share-usage/{id}/resolve"]
  - priority: 23
    category: business_referential
    check: "A ReplicationConfiguration whose target_region equals its owning account's own region is refused: a same-region refresh is not a replication at all and would be priced at a fictional factor."
    error_id: ERR_REPLICATION_REGION_INVALID
    http_status: 422
    applies_to: ["POST /replication-configurations", "PATCH /replication-configurations/{id}"]

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that pins the server's logical clock. The server's startup default logical time is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before the first call to this endpoint."
    roles: [PlatformOperator]
    code: 200
    input:
      - to_iso8601
    output: null
    side_effects:
      - "every subsequent metering, idle-timeout, interval-window and term evaluation reads the new logical time"
      - "every CapacityContract whose status is ACTIVE and whose term_end is at or before the new logical time moves ACTIVE to EXPIRED through contract_rollover_utilization AT_EXPIRY, and its term_end_remaining_credits is frozen at that moment"
      - "every ResourceMonitor recomputes interval_consumption_credits and used_pct against the new logical time, so the 50 and 100 crossing rules are re-evaluated at every clock advance"
  - method: POST
    path: "/v1/accounts"
    description: "Register an account that owns warehouses, contracts, shares and monitors. account_locator is the globally unique identity key for the account's data products."
    roles: [PlatformOperator]
    code: 201
    input:
      - org_name
      - account_locator
      - cloud_provider
      - region
      - monitor_scope?
    output: Account
    side_effects: []
  - method: GET
    path: "/v1/accounts"
    description: "List accounts, filterable by region and cloud_provider, with pagination."
    roles: [PlatformOperator]
    code: 200
    input:
      - region?
      - cloud_provider?
      - limit?
      - offset?
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/v1/accounts/{id}"
    description: "Read one account, including the reconciled credit figure, the reconciled storage figure and the derived account_state posture."
    roles: [PlatformOperator, FinanceController, ShareAdmin, DataEngineer]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/v1/warehouses"
    description: "Create a warehouse in SUSPENDED state with credits_per_hour derived from warehouse_credit_burn for the requested size."
    roles: [DataEngineer]
    code: 201
    input:
      - account_id
      - name
      - size
      - auto_suspend_seconds?
      - auto_resume?
      - clusters_min?
      - clusters_max?
      - latency_slo_ms?
    output: VirtualWarehouse
    side_effects: ["credits_per_hour is recomputed from warehouse_credit_burn SIZE_FACTORS; status starts SUSPENDED with cluster_count 0"]
  - method: GET
    path: "/v1/warehouses"
    description: "List warehouses, filterable by parent account."
    roles: [DataEngineer, PlatformOperator, FinanceController, ShareAdmin]
    code: 200
    input:
      - account_id?
      - size?
      - status?
      - limit?
      - offset?
    output: "VirtualWarehouse[]"
    side_effects: []
  - method: GET
    path: "/v1/warehouses/{id}"
    description: "Read one warehouse including the parallel cluster dimension: status and cluster_count are reported independently."
    roles: [DataEngineer, PlatformOperator, FinanceController, ShareAdmin]
    code: 200
    input: []
    output: VirtualWarehouse
    side_effects: []
  - method: PATCH
    path: "/v1/warehouses/{id}"
    description: "Change size, auto-suspend, auto-resume or cluster bounds; a running warehouse moves RUNNING to RESIZING and every open session keeps its frozen size snapshot."
    roles: [DataEngineer]
    code: 200
    input:
      - size?
      - auto_suspend_seconds?
      - auto_resume?
      - clusters_min?
      - clusters_max?
      - latency_slo_ms?
    output: VirtualWarehouse
    side_effects: ["status moves RUNNING to RESIZING", "credits_per_hour is recomputed from warehouse_credit_burn SIZE_FACTORS for the new size"]
  - method: POST
    path: "/v1/warehouses/{id}/resume"
    description: "Resume a suspended warehouse, moving SUSPENDED through STARTING to RUNNING and arming auto-resume. When auto_resume is false this endpoint reports the projection POST /warehouse-sessions would produce."
    roles: [DataEngineer, PlatformOperator]
    code: 200
    input:
      - requested_clusters?
    output: VirtualWarehouse
    side_effects: ["status moves SUSPENDED to STARTING then RUNNING", "cluster_count is set to clusters_min when no requested_clusters is supplied", "credits_per_hour is recomputed"]
  - method: POST
    path: "/v1/warehouses/{id}/suspend"
    description: "Suspend a running warehouse, closing every open session in one sweep and posting one CONSUMPTION ledger row per closed session."
    roles: [DataEngineer, PlatformOperator]
    code: 200
    input: []
    output: VirtualWarehouse
    side_effects:
      - "every open WarehouseSession closes and posts an AccountLedgerEntry with bucket CONSUMPTION"
      - "Account.posted_consumption_credits_reconciled is reconciled and Account.account_state is re-derived"
      - "every ResourceMonitor of the account recomputes interval_consumption_credits and used_pct"
      - "cluster_count is set to 0 and status to SUSPENDED"
  - method: POST
    path: "/v1/warehouses/{id}/cluster-scaling"
    description: "Apply warehouse_cluster_scaling to set cluster_count, honouring request.clusters as an upper intent and shrinking to fit contract.remaining_credits when the BUDGET_BOUND variant applies. queued_queries is the dispatcher-observed queue depth at scaling time and is stored on multi_cluster_queued_queries."
    roles: [DataEngineer]
    code: 200
    input:
      - clusters
      - queued_queries
      - expected_warehouse_version
      - parallel_intent_min?
    output: VirtualWarehouse
    side_effects: ["cluster_count is set by warehouse_cluster_scaling", "status moves RUNNING or RESIZING to RUNNING", "increments VirtualWarehouse.version by 1"]
  - method: POST
    path: "/v1/warehouse-sessions"
    description: "Open a metering session on a warehouse, auto-resuming it when auto_resume is true; the session records the size and cluster snapshot that will price it."
    roles: [DataEngineer]
    code: 201
    input:
      - warehouse_id
      - originating_query_id?
    output: WarehouseSession
    side_effects: ["the warehouse auto-resumes when auto_resume is true, moving SUSPENDED to STARTING to RUNNING", "cluster_count is set to clusters_min on the auto-resume path", "the session snapshots the warehouse size and cluster_count"]
  - method: GET
    path: "/v1/warehouse-sessions"
    description: "List sessions, filterable by warehouse and state, with pagination."
    roles: [DataEngineer, PlatformOperator, FinanceController]
    code: 200
    input:
      - warehouse_id?
      - state?
      - limit?
      - offset?
    output: "WarehouseSession[]"
    side_effects: []
  - method: GET
    path: "/v1/warehouse-sessions/{id}"
    description: "Read one session including the frozen size and cluster snapshot, the METERED and BILLED_FLOOR credit figures and the billed_seconds actually charged."
    roles: [DataEngineer, PlatformOperator, FinanceController]
    code: 200
    input: []
    output: WarehouseSession
    side_effects: []
  - method: POST
    path: "/v1/warehouse-sessions/{id}/close"
    description: "Close an open session, freezing elapsed_seconds and computing metered_credits, billed_credits and billed_seconds under warehouse_credit_burn."
    roles: [DataEngineer]
    code: 200
    input:
      - expected_warehouse_version
    output: WarehouseSession
    side_effects:
      - "state moves OPEN to CLOSING then CLOSED"
      - "metered_credits, billed_credits and billed_seconds are computed from the frozen size and clusters snapshot"
      - "an AccountLedgerEntry is posted with bucket CONSUMPTION and amount_credits equal to billed_credits"
      - "Account.posted_consumption_credits_reconciled is reconciled and every ResourceMonitor of the account recomputes used_pct"
      - "increments VirtualWarehouse.version by 1"
  - method: POST
    path: "/v1/capacity-contracts"
    description: "Create a capacity purchase contract. Must be activated before it holds or draws credits."
    roles: [FinanceController]
    code: 201
    input:
      - account_id
      - term_start
      - term_end
      - base_credits
      - overage_rate_per_credit
      - rollover_cap_credits
      - currency
    output: CapacityContract
    side_effects: ["status starts DRAFT with remaining_credits 0, so a DRAFT contract draws nothing"]
  - method: GET
    path: "/v1/capacity-contracts"
    description: "List contracts, filterable by parent account and status, with pagination."
    roles: [FinanceController, PlatformOperator, DataEngineer]
    code: 200
    input:
      - account_id?
      - status?
      - limit?
      - offset?
    output: "CapacityContract[]"
    side_effects: []
  - method: GET
    path: "/v1/capacity-contracts/{id}"
    description: "Read one contract including the BASE, ROLLOVER and OVERAGE segment cursors and the current remaining_credits."
    roles: [FinanceController, PlatformOperator, DataEngineer]
    code: 200
    input: []
    output: CapacityContract
    side_effects: []
  - method: POST
    path: "/v1/capacity-contracts/{id}/activate"
    description: "Move a DRAFT contract to ACTIVE so its allowance becomes drawable; stamps the activating operator for segregation of duties."
    roles: [FinanceController]
    code: 200
    input: []
    output: CapacityContract
    side_effects: ["status moves DRAFT to ACTIVE", "remaining_credits is recomputed as base_credits plus rolled_over_credits minus drawn_credits, floored at 0", "activated_by_user_id is stamped from X-User-ID"]
  - method: POST
    path: "/v1/capacity-contracts/{id}/renew"
    description: "Renew an expired contract with adjacent terms, booking the AT_RENEWAL rollover and resetting the drawdown idempotency namespace."
    roles: [FinanceController]
    code: 200
    input:
      - new_term_start
      - new_term_end
      - base_credits
      - overage_rate_per_credit?
    output: CapacityContract
    side_effects: ["status moves EXPIRED to ACTIVE", "rolled_over_credits is booked by contract_rollover_utilization AT_RENEWAL and a ROLLOVER ledger row is posted", "drawdown_count is reset to 0", "remaining_credits is recomputed"]
  - method: POST
    path: "/v1/capacity-contracts/{id}/close"
    description: "Close a contract so no further drawdown may bind to it; refuses when the acting operator is the one who activated it."
    roles: [FinanceController]
    code: 200
    input: []
    output: CapacityContract
    side_effects: ["status moves ACTIVE, EXPIRED or EXHAUSTED to CLOSED", "overage accrual stops"]
  - method: POST
    path: "/v1/credit-drawdowns"
    description: "Draw credits against an active contract; idempotent on idempotency_key within the contract, and priced through the BASE, ROLLOVER, OVERAGE waterfall."
    roles: [DataEngineer, FinanceController]
    code: 201
    input:
      - contract_id
      - warehouse_id
      - amount_credits
      - source_kind
      - idempotency_key
      - expected_contract_version
    output: CreditDrawdown
    side_effects:
      - "contract.drawn_credits advances, base_consumed_credits advances by the BASE portion and remaining_credits is recomputed"
      - "the drawdown is segmented by contract_credit_drawdown into BASE, then ROLLOVER, then OVERAGE"
      - "an AccountLedgerEntry is posted with bucket CONSUMPTION and amount_credits equal to the within-allowance portion, which is amount_credits minus the overage portion"
      - "an AccountLedgerEntry is posted with bucket OVERAGE and amount_usd equal to CreditDrawdown.overage_usd when the overage segment is non-empty"
      - "the contract moves ACTIVE to EXHAUSTED when remaining_credits reaches 0"
      - "Account.posted_consumption_credits_reconciled is reconciled and every ResourceMonitor of the account recomputes used_pct"
      - "increments CapacityContract.version by 1"
  - method: GET
    path: "/v1/credit-drawdowns"
    description: "List drawdowns, filterable by parent contract, warehouse, source_kind and status, supporting cursor pagination."
    roles: [DataEngineer, FinanceController, PlatformOperator]
    code: 200
    input:
      - contract_id?
      - warehouse_id?
      - source_kind?
      - status?
      - cursor?
      - limit?
    output: "CreditDrawdown[]"
    side_effects: []
  - method: GET
    path: "/v1/credit-drawdowns/{id}"
    description: "Read one drawdown including its settled outcome segment and its overage_usd."
    roles: [DataEngineer, FinanceController, PlatformOperator]
    code: 200
    input: []
    output: CreditDrawdown
    side_effects: []
  - method: POST
    path: "/v1/credit-drawdowns/{id}/reverse"
    description: "Reverse an active drawdown, restoring the credited volume to its original segment bucket."
    roles: [FinanceController]
    code: 200
    input: []
    output: CreditDrawdown
    side_effects:
      - "status moves ACTIVE to REVERSED"
      - "contract.drawn_credits is reduced by the reversed amount and remaining_credits is recomputed"
      - "the contract moves EXHAUSTED back to ACTIVE when the restored credits lift remaining_credits above 0"
      - "a CONSUMPTION ledger row with the negated amount is posted and Account.posted_consumption_credits_reconciled is reconciled"
  - method: POST
    path: "/v1/storage-usage-records"
    description: "Capture a daily storage snapshot, pricing time-travel and fail-safe retention separately from compute."
    roles: [DataEngineer]
    code: 201
    input:
      - account_id
      - usage_date
      - active_tb
      - time_travel_tb
      - fail_safe_tb
      - time_travel_days
    output: StorageUsageRecord
    side_effects: ["billable_storage_tb is computed by storage_billable_volume and storage_cost_dollars by storage_billing_time_travel_fail_safe", "an AccountLedgerEntry is posted with bucket STORAGE", "Account.posted_storage_dollars_reconciled is reconciled"]
  - method: GET
    path: "/v1/storage-usage-records"
    description: "List storage snapshots, filterable by parent account and snapshot state, with pagination."
    roles: [DataEngineer, FinanceController, PlatformOperator]
    code: 200
    input:
      - account_id?
      - snapshot_state?
      - limit?
      - offset?
    output: "StorageUsageRecord[]"
    side_effects: []
  - method: GET
    path: "/v1/storage-usage-records/{id}"
    description: "Read one storage snapshot with its three component volumes and their individually priced contributions."
    roles: [DataEngineer, FinanceController, PlatformOperator]
    code: 200
    input: []
    output: StorageUsageRecord
    side_effects: []
  - method: GET
    path: "/v1/storage-usage-records/{id}/billing-summary"
    description: "Report the snapshot's storage cost under the SUM_THEN_ROUND variant, the documented reporting figure, together with the PER_COMPONENT stored value so the one-cent divergence is observable."
    roles: [FinanceController, PlatformOperator]
    code: 200
    input: []
    output: "{ storage_cost_dollars_reported: number, storage_cost_dollars_stored: number, rounding_mode: string, per_component: object }"
    side_effects: []
  - method: POST
    path: "/v1/storage-usage-records/{id}/revise"
    description: "Revise a finalized snapshot with corrected component volumes, posting a STORAGE_ADJUST delta for the difference."
    roles: [DataEngineer]
    code: 200
    input:
      - time_travel_days
      - active_tb
      - time_travel_tb
      - fail_safe_tb
      - expected_storage_usage_record_version
    output: StorageUsageRecord
    side_effects: ["snapshot_state moves FINALIZED to REVISED", "an AccountLedgerEntry is posted with bucket STORAGE_ADJUST and amount_usd equal to the signed difference", "Account.posted_storage_dollars_reconciled is reconciled", "increments StorageUsageRecord.version by 1"]
  - method: POST
    path: "/v1/storage-usage-records/{id}/finalize"
    description: "Re-finalize a revised snapshot and post the full recomputed STORAGE figure."
    roles: [FinanceController]
    code: 200
    input: []
    output: StorageUsageRecord
    side_effects: ["snapshot_state moves REVISED to FINALIZED", "an AccountLedgerEntry is posted with bucket STORAGE_ADJUST and amount_usd equal to the signed difference against the prior stored value, 0.00 when unchanged", "Account.posted_storage_dollars_reconciled is reconciled"]
  - method: POST
    path: "/v1/data-shares"
    description: "Create a secure data share naming the consumer accounts that may query the provider's data without copying it."
    roles: [ShareAdmin]
    code: 201
    input:
      - provider_account_id
      - name
      - objects_exposed
      - consumer_account_ids
      - status?
    output: DataShare
    side_effects: ["status starts DRAFT, so no consumer attribution is possible until publish"]
  - method: GET
    path: "/v1/data-shares"
    description: "List data shares, filterable by provider account and status, with pagination."
    roles: [ShareAdmin, PlatformOperator, FinanceController, DataEngineer]
    code: 200
    input:
      - provider_account_id?
      - status?
      - limit?
      - offset?
    output: "DataShare[]"
    side_effects: []
  - method: GET
    path: "/v1/data-shares/{id}"
    description: "Read one share with its consumer query count and consumer credit total."
    roles: [ShareAdmin, PlatformOperator, FinanceController, DataEngineer]
    code: 200
    input: []
    output: DataShare
    side_effects: []
  - method: PATCH
    path: "/v1/data-shares/{id}"
    description: "Amend a share's exposed object count or consumer list; adding a consumer is refused when the share is not PUBLISHED."
    roles: [ShareAdmin]
    code: 200
    input:
      - objects_exposed?
      - consumer_account_ids?
    output: DataShare
    side_effects: ["consumer_account_ids is replaced wholesale when supplied"]
  - method: POST
    path: "/v1/data-shares/{id}/publish"
    description: "Publish or re-publish a share; the DRAFT to PUBLISHED and SUSPENDED to PUBLISHED edges are both handled here."
    roles: [ShareAdmin]
    code: 200
    input: []
    output: DataShare
    side_effects: ["status moves DRAFT or SUSPENDED to PUBLISHED"]
  - method: POST
    path: "/v1/data-shares/{id}/suspend"
    description: "Suspend a published share so further consumer queries are refused while already-posted usage rows are retained."
    roles: [ShareAdmin]
    code: 200
    input: []
    output: DataShare
    side_effects: ["status moves PUBLISHED to SUSPENDED", "every Listing bound to this share is left PUBLISHED, but no new ShareUsageEvent may be posted"]
  - method: POST
    path: "/v1/data-shares/{id}/revoke"
    description: "Return a published share to draft, cascading every published listing bound to it to WITHDRAWN."
    roles: [ShareAdmin]
    code: 200
    input:
      - expected_account_version
    output: DataShare
    side_effects:
      - "status moves PUBLISHED to DRAFT"
      - "every Listing bound to this share with listing_state PUBLISHED moves PUBLISHED to WITHDRAWN and has provider_payout_usd and platform_fee_usd frozen"
      - "consumer_query_count and consumer_credits are reset to 0"
      - "increments Account.version by 1"
  - method: POST
    path: "/v1/shares/{id}/usage-events"
    description: "Record a consumer query against a published share; the credits are attributed to the consumer account, never to the provider."
    roles: [DataEngineer, ShareAdmin]
    code: 201
    input:
      - consumer_account_id
      - credits_consumed
      - row_count
    output: ShareUsageEvent
    side_effects:
      - "attribution is set to CONSUMER and credited_account_id to the consumer account by data_share_consumption_attribution"
      - "the share's consumer_query_count and consumer_credits are recomputed"
      - "an AccountLedgerEntry is posted on the consumer account with bucket SHARE_CONSUMPTION and amount_credits equal to credits_consumed"
      - "the consumer account's posted_consumption_credits_reconciled is reconciled and the provider's is left untouched"
  - method: GET
    path: "/v1/shares/{id}/usage-events"
    description: "List the consumer queries attributed to one share, with pagination."
    roles: [DataEngineer, ShareAdmin, FinanceController, PlatformOperator]
    code: 200
    input:
      - consumer_account_id?
      - limit?
      - offset?
    output: "ShareUsageEvent[]"
    side_effects: []
  - method: GET
    path: "/v1/share-usage-events"
    description: "List consumer attribution rows across shares, filterable by share, consumer account and attribution outcome, with pagination."
    roles: [PlatformOperator, FinanceController, ShareAdmin, DataEngineer]
    code: 200
    input:
      - share_id?
      - consumer_account_id?
      - attribution?
      - limit?
      - offset?
    output: "ShareUsageEvent[]"
    side_effects: []
  - method: GET
    path: "/v1/share-usage-events/{id}"
    description: "Read one consumer attribution row with the account it was charged to."
    roles: [PlatformOperator, FinanceController, ShareAdmin, DataEngineer]
    code: 200
    input: []
    output: ShareUsageEvent
    side_effects: []
  - method: POST
    path: "/v1/listings"
    description: "Create a marketplace listing that packages a published share as a free, flat-priced or usage-based data product."
    roles: [ShareAdmin]
    code: 201
    input:
      - share_id
      - title
      - pricing_model
      - flat_price_usd
    output: Listing
    side_effects: ["listing_state starts DRAFT with provider_payout_usd 0 and frozen_price_usd null"]
  - method: GET
    path: "/v1/listings"
    description: "List listings, filterable by parent share and listing state, with pagination."
    roles: [ShareAdmin, PlatformOperator, FinanceController]
    code: 200
    input:
      - share_id?
      - listing_state?
      - pricing_model?
      - limit?
      - offset?
    output: "Listing[]"
    side_effects: []
  - method: GET
    path: "/v1/listings/{id}"
    description: "Read one listing with its gross credit volume, provider payout, platform fee and the price frozen at first payout."
    roles: [ShareAdmin, PlatformOperator, FinanceController]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: POST
    path: "/v1/listings/{id}/publish"
    description: "Publish a draft listing whose bound share is already published."
    roles: [ShareAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["listing_state moves DRAFT to PUBLISHED"]
  - method: POST
    path: "/v1/listings/{id}/withdraw"
    description: "Withdraw a published listing; frozen earnings stay payable but no further buyer usage may bind."
    roles: [ShareAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["listing_state moves PUBLISHED to WITHDRAWN with no further cascade"]
  - method: GET
    path: "/v1/listings/{id}/provider-payout"
    description: "Report the provider payout split for a listing, using the frozen price when one has already been set."
    roles: [FinanceController, PlatformOperator, ShareAdmin]
    code: 200
    input: []
    output: "{ gross_credit_volume: number, provider_payout_usd: number, platform_fee_usd: number, frozen_price_usd: number, price_source: string }"
    side_effects: []
  - method: POST
    path: "/v1/paid-share-usage"
    description: "Record usage of a priced data product; on the first settlement the listing's price is frozen from flat_price_usd and thereafter honoured unchanged."
    roles: [DataEngineer, ShareAdmin]
    code: 201
    input:
      - listing_id
      - buyer_account_id
      - credits_used
      - expected_listing_version
    output: PaidShareUsage
    side_effects:
      - "usage_state starts PENDING and price_per_credit is set from the listing at first settlement"
      - "provider_payout_split recomputes gross_credit_volume, provider_payout_usd and platform_fee_usd on the listing and freezes frozen_price_usd at the first payout"
      - "an AccountLedgerEntry is posted on the provider account with bucket PAYOUT"
      - "increments Listing.version by 1"
  - method: GET
    path: "/v1/paid-share-usage"
    description: "List paid usage rows, filterable by parent listing and usage state, with pagination."
    roles: [DataEngineer, ShareAdmin, FinanceController, PlatformOperator]
    code: 200
    input:
      - listing_id?
      - usage_state?
      - buyer_account_id?
      - limit?
      - offset?
    output: "PaidShareUsage[]"
    side_effects: []
  - method: GET
    path: "/v1/paid-share-usage/{id}"
    description: "Read one paid usage row with its frozen price_per_credit and current settlement state."
    roles: [DataEngineer, ShareAdmin, FinanceController, PlatformOperator]
    code: 200
    input: []
    output: PaidShareUsage
    side_effects: []
  - method: POST
    path: "/v1/paid-share-usage/{id}/settle"
    description: "Back-office action that advances a buyer usage row from PENDING to SETTLED, applying provider_payout_split and freezing the listing price on the listing's first payout."
    roles: [FinanceController, PlatformOperator]
    code: 200
    input: []
    output: PaidShareUsage
    side_effects:
      - "usage_state moves PENDING to SETTLED"
      - "price_per_credit is set from the listing's flat_price_usd on the listing's first payout and preserved thereafter"
      - "the listing's gross_credit_volume, provider_payout_usd and platform_fee_usd are recomputed and frozen_price_usd is set when it was null"
      - "an AccountLedgerEntry is posted on the provider account with bucket PAYOUT and amount_usd equal to provider_payout_usd"
  - method: POST
    path: "/v1/paid-share-usage/{id}/dispute"
    description: "Dispute a settled buyer row, stripping its contribution out of the listing's payout."
    roles: [PlatformOperator]
    code: 200
    input:
      - expected_listing_version
    output: PaidShareUsage
    side_effects: ["usage_state moves SETTLED to DISPUTED", "the listing's gross_credit_volume, provider_payout_usd and platform_fee_usd are reduced by the row's contribution", "an AccountLedgerEntry is posted on the provider account with bucket PAYOUT_ADJUST", "disputed_by_user_id is stamped from X-User-ID", "increments Listing.version by 1"]
  - method: POST
    path: "/v1/paid-share-usage/{id}/resolve"
    description: "Resolve a dispute so the row counts toward payout again; refused when the resolving operator raised the dispute."
    roles: [PlatformOperator]
    code: 200
    input: []
    output: PaidShareUsage
    side_effects: ["usage_state moves DISPUTED to SETTLED", "the row's contribution is restored to the listing's payout figures", "an AccountLedgerEntry is posted on the provider account with bucket PAYOUT"]
  - method: POST
    path: "/v1/resource-monitors"
    description: "Create a resource monitor that watches an account's interval consumption and enforces a quota."
    roles: [FinanceController]
    code: 201
    input:
      - account_id
      - name
      - credit_quota
      - interval
      - action
    output: ResourceMonitor
    side_effects: ["monitor_state starts OK with used_pct 0 and last_reset_at stamped from the logical clock"]
  - method: GET
    path: "/v1/resource-monitors"
    description: "List resource monitors, filterable by parent account, monitor state and action, with pagination."
    roles: [FinanceController, PlatformOperator, DataEngineer]
    code: 200
    input:
      - account_id?
      - monitor_state?
      - action?
      - limit?
      - offset?
    output: "ResourceMonitor[]"
    side_effects: []
  - method: GET
    path: "/v1/resource-monitors/{id}"
    description: "Read one monitor with its interval consumption, used percentage and derived threshold posture."
    roles: [FinanceController, PlatformOperator, DataEngineer]
    code: 200
    input: []
    output: ResourceMonitor
    side_effects: []
  - method: POST
    path: "/v1/resource-monitors/{id}/reset"
    description: "Reset the monitor's interval, clearing consumption and re-deriving the account posture."
    roles: [FinanceController]
    code: 200
    input: []
    output: ResourceMonitor
    side_effects: ["monitor_state moves SUSPENDED or NOTIFY_SENT to OK", "interval_consumption_credits and used_pct are zeroed and last_reset_at is stamped from the logical clock", "Account.account_state is re-derived"]
  - method: POST
    path: "/v1/replication-configurations"
    description: "Configure cross-region or cross-cloud replication of an account's primary data."
    roles: [DataEngineer]
    code: 201
    input:
      - account_id
      - name
      - target_region
      - target_cloud
      - replicated_tb
    output: ReplicationConfiguration
    side_effects: ["replication_state starts CONFIGURED with transfer_cost_dollars 0"]
  - method: GET
    path: "/v1/replication-configurations"
    description: "List replication configurations, filterable by parent account and state, with pagination."
    roles: [DataEngineer, PlatformOperator, FinanceController]
    code: 200
    input:
      - account_id?
      - replication_state?
      - target_region?
      - limit?
      - offset?
    output: "ReplicationConfiguration[]"
    side_effects: []
  - method: GET
    path: "/v1/replication-configurations/{id}"
    description: "Read one replication configuration with its latest transfer cost and factor breakdown."
    roles: [DataEngineer, PlatformOperator, FinanceController]
    code: 200
    input: []
    output: ReplicationConfiguration
    side_effects: []
  - method: POST
    path: "/v1/replication-configurations/{id}/refresh"
    description: "Start a replication refresh that will price the transferred volume once it completes."
    roles: [DataEngineer]
    code: 200
    input: []
    output: ReplicationConfiguration
    side_effects: ["replication_state moves CONFIGURED, REFRESHED or FAILED to REFRESHING", "refresh_count increments and transfer_cost_dollars is recomputed by replication_transfer_cost on completion", "an AccountLedgerEntry is posted with bucket REPLICATION and amount_credits 0", "Account.posted_consumption_credits_reconciled is left unchanged because the posting is dollar-denominated"]
  - method: GET
    path: "/v1/accounts/{id}/ledger-entries"
    description: "List the account's ledger rows across every bucket, with pagination; this is the reversal-invariant read surface."
    roles: [FinanceController, PlatformOperator, DataEngineer]
    code: 200
    input:
      - bucket?
      - source_entity?
      - limit?
      - offset?
    output: "AccountLedgerEntry[]"
    side_effects: []
  - method: GET
    path: "/v1/accounts/{id}/billing-summary"
    description: "Report the account's reconciled credit figure, reconciled storage figure and dollar balance, each summed over its own bucket set."
    roles: [FinanceController, PlatformOperator, ShareAdmin]
    code: 200
    input:
      - as_of?
    output: "{ posted_consumption_credits_reconciled: number, posted_storage_dollars_reconciled: number, account_dollars_balance: number, bucket_totals: object }"
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is absent, or X-User-Role names a role not declared in §1.7, or an entity_backed role's X-User-ID does not match any instance id."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is authenticated but is not listed in the endpoint's roles."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A resource named in the path does not exist; path ids are validated left to right, so an unknown owning account is reported before an unknown child."
  - id: ERR_REFERENCE_INVALID
    http: 422
    condition: "A body foreign key does not resolve, or targets an entity that does not belong to the same owning account as the parent, or a replication target region equals the account's own region."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that admits the requested transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_*_version does not match the parent's current version; this is the OCC rejection used by every §1.2.1 rule."
  - id: ERR_ACCOUNT_DRAINING
    http: 422
    condition: "The owning account's account_state is DRAINING and the endpoint is one of the charged-open operations; compensating close and withdraw actions are still admitted."
  - id: ERR_ROLE_CONFLICT
    http: 422
    condition: "Segregation of duties violated: the contract closer is the operator who activated the contract, or the dispute resolver is the operator who raised the dispute."
  - id: ERR_CONTRACT_CREDIT_EXHAUSTED
    http: 422
    condition: "The requested drawdown would push contract.drawn_credits past base_credits plus rolled_over_credits plus rollover_cap_credits of the ACTIVE term."
  - id: ERR_SHARE_SELF_CONSUMPTION
    http: 422
    condition: "A share's consumer_account_ids contains its provider account, or a usage event's consumer account is the share's provider account."
  - id: ERR_SHARE_NOT_PUBLISHED
    http: 422
    condition: "A usage event, listing create or listing publish references a share whose status is not PUBLISHED; a DRAFT or SUSPENDED share admits no consumer attribution."
  - id: ERR_TERM_OVERLAP
    http: 409
    condition: "Two capacity contract terms of the same account overlap on half-open [term_start, term_end) windows, or two sessions of the same warehouse overlap, or a term has zero width."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness constraint within the owning account is violated: warehouse name, monitor name, replication name, share name within provider, listing title within share, or a repeated drawdown idempotency_key."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is absent, an enum value is unknown, a numeric range is violated, or clusters_max exceeds 10."
  - id: ERR_WAREHOUSE_SUSPENDED
    http: 409
    condition: "An operation requiring a running warehouse is attempted while status IN {SUSPENDED, DRAINING} and auto_resume is false."
  - id: ERR_AUTO_SUSPEND_RANGE
    http: 400
    condition: "auto_suspend_seconds falls outside [60, 3600]."
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "A close or reopen is attempted on a WarehouseSession whose state is not the required from: state, including a second close of an already CLOSED session."
  - id: ERR_CLUSTER_RANGE
    http: 400
    condition: "clusters_min exceeds clusters_max, clusters_max exceeds 10, or requested_clusters is below parallel_intent_min."
  - id: ERR_STORAGE_DAYS_RANGE
    http: 400
    condition: "time_travel_days falls outside [0, 90]; the fail-safe window is fixed at 7 days and is not client-settable."
  - id: ERR_MONITOR_MISSING
    http: 422
    condition: "A monitor-driven action is attempted on an account that has no ResourceMonitor, so no quota governs the sweep."
  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "A warehouse resume or session open is attempted while a ResourceMonitor of the owning account is in monitor_state SUSPENDED with action SUSPEND_IMMEDIATE."
  - id: ERR_LISTING_NOT_PUBLISHED
    http: 409
    condition: "Paid usage is recorded against, or a payout is requested for, a listing whose listing_state is not PUBLISHED."
  - id: ERR_FREE_LISTING_NOT_PAYABLE
    http: 422
    condition: "A payout or paid usage is requested against a listing whose pricing_model is FREE."
  - id: ERR_REPLICATION_REGION_INVALID
    http: 422
    condition: "target_region equals the owning account's own region, so the configuration would not be a cross-region replication at all."
  - id: ERR_REPLICATION_SIZE_RANGE
    http: 400
    condition: "replicated_tb is negative or exceeds 500."
  - id: ERR_DISPUTE_SELF_RESOLVE
    http: 422
    condition: "The resolving operator's X-User-ID equals the disputed_by_user_id, which is the segregation-of-duties conflict for the payout path."
  - id: ERR_DRAWDOWN_AMOUNT_RANGE
    http: 400
    condition: "amount_credits is not strictly positive or exceeds the single-drawdown ceiling of 1000 credits."

roles:
  - name: PlatformOperator
    description: "Opaque operations role: registers accounts, drives the logical clock, resolves disputes and force-suspends failed warehouses across every account."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /_clock/set_current_utc"
      - "GET /accounts/{id}/billing-summary for any account"
    shared_operations:
      - "GET /accounts, GET /warehouses/{id}, GET /warehouse-sessions/{id}"
      - "GET /accounts/{id}/ledger-entries, GET /accounts/{id}/billing-summary"
  - name: FinanceController
    description: "Entity-free finance operator who owns contract lifecycle, storage finalization, resource monitors and the segregation-of-duties counterpart to activation."
    identity: "opaque"
    exclusive_operations:
      - "POST /capacity-contracts/{id}/activate"
      - "POST /capacity-contracts/{id}/renew"
      - "POST /capacity-contracts/{id}/close"
      - "POST /credit-drawdowns/{id}/reverse"
      - "POST /storage-usage-records/{id}/finalize"
      - "POST /resource-monitors"
      - "POST /resource-monitors/{id}/reset"
    shared_operations:
      - "POST /credit-drawdowns"
      - "GET /capacity-contracts, GET /storage-usage-records/{id}, GET /listings/{id}/provider-payout"
  - name: ShareAdmin
    description: "Provider-side operator backed by the providing account: publishes shares, publishes listings, records consumer usage and revokes exposure."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /data-shares/{id}/publish"
      - "POST /data-shares/{id}/suspend"
      - "POST /data-shares/{id}/revoke"
      - "POST /listings/{id}/publish"
      - "POST /listings/{id}/withdraw"
      - "PATCH /data-shares/{id}"
    shared_operations:
      - "POST /data-shares, POST /listings, POST /shares/{id}/usage-events, POST /paid-share-usage"
      - "GET /data-shares/{id}, GET /listings/{id}, GET /shares/{id}/usage-events"
  - name: DataEngineer
    description: "Entity-free engineering operator who sizes, starts, scales and measures warehouses and configures replication, but may never publish a share or activate a contract."
    identity: "opaque"
    exclusive_operations:
      - "POST /warehouses"
      - "PATCH /warehouses/{id}"
      - "POST /warehouses/{id}/cluster-scaling"
      - "POST /warehouse-sessions"
      - "POST /warehouse-sessions/{id}/close"
      - "POST /storage-usage-records"
      - "POST /storage-usage-records/{id}/revise"
      - "POST /replication-configurations"
      - "POST /replication-configurations/{id}/refresh"
    shared_operations:
      - "POST /warehouses/{id}/resume, POST /warehouses/{id}/suspend"
      - "GET /warehouses, GET /warehouse-sessions, GET /credit-drawdowns"

state_machines:
  - entity: VirtualWarehouse
    initial_state: SUSPENDED
    terminal_states: []
    note: "Two independent state dimensions on one entity: the lifecycle `status` and the parallel `cluster_count` dimension. cluster_count may move between clusters_min and clusters_max while status stays RUNNING, so the two axes are not derivable from each other."
    transitions:
      - from: SUSPENDED
        to: STARTING
        trigger: "POST /warehouses/{id}/resume"
        actor: DataEngineer
        preconditions:
          - "status == SUSPENDED"
          - "auto_resume == true OR the acting role is PlatformOperator"
          - "the owning Account.account_state IN {OPEN, RESTRICTED}; a DRAINING account rejects the resume"
        side_effects:
          - "status = STARTING"
          - "Account.version unchanged by this transition"
      - from: STARTING
        to: RUNNING
        trigger: "system event: cluster bootstrap complete"
        actor: system
        preconditions:
          - "status == STARTING"
        side_effects:
          - "status = RUNNING"
          - "cluster_count = clusters_min (the parallel cluster dimension is reset to its lower bound)"
          - "credits_per_hour is recomputed from warehouse_credit_burn SIZE_FACTORS for the current size"
      - from: RUNNING
        to: SUSPENDED
        trigger: "POST /warehouses/{id}/suspend"
        actor: DataEngineer
        preconditions:
          - "status == RUNNING"
          - "multi_cluster_queued_queries == 0"
        side_effects:
          - "every WarehouseSession of this warehouse whose state == OPEN moves OPEN -> CLOSING and then CLOSING -> CLOSED in one sweep"
          - "each closed session sets metered_credits, billed_credits and billed_seconds using the frozen session size/clusters snapshot and that warehouse's auto_suspend_seconds; a session that closed from RESUMING instead bills 0"
          - "each closed session posts one AccountLedgerEntry on the owning Account with bucket CONSUMPTION and amount_credits == session.billed_credits; bucket STORAGE and bucket REPLICATION are untouched by this posting"
          - "Account.posted_consumption_credits_reconciled is reconciled to the sum of amount_credits over AccountLedgerEntry rows of buckets {CONSUMPTION, SHARE_CONSUMPTION}"
          - "the reconcile above raises Account.account_state to DRAINING when the account has a ResourceMonitor in monitor_state SUSPENDED, which in turn moves every other VirtualWarehouse of that account still in RUNNING to DRAINING"
          - "every ResourceMonitor bound to the owning Account recomputes interval_consumption_credits and used_pct"
          - "cluster_count = 0"
          - "status = SUSPENDED"
      - from: RUNNING
        to: SUSPENDED
        trigger: "system event: auto-suspend idle timeout"
        actor: system
        preconditions:
          - "status == RUNNING"
          - "no WarehouseSession of this warehouse has state == OPEN, and multi_cluster_queued_queries == 0, for auto_suspend_seconds of logical-clock time"
        side_effects:
          - "the same side-effect set as POST /warehouses/{id}/suspend; an idle warehouse has no open sessions, so this sweep posts no AccountLedgerEntry row"
          - "cluster_count = 0"
          - "status = SUSPENDED"
      - from: RUNNING
        to: DRAINING
        trigger: "system event: resource monitor sweep suspends"
        actor: system
        preconditions:
          - "status == RUNNING"
          - "the owning Account has a ResourceMonitor whose monitor_state == SUSPENDED"
        side_effects:
          - "every WarehouseSession of this warehouse whose state == OPEN moves OPEN -> CLOSING and then CLOSING -> CLOSED in one sweep"
          - "each closed session posts one AccountLedgerEntry with bucket CONSUMPTION and amount_credits == session.billed_credits per warehouse_credit_burn"
          - "Account.posted_consumption_credits_reconciled is reconciled, after which Account.account_state is re-derived and stays DRAINING"
          - "cluster_count = 0"
          - "status = DRAINING"
      - from: DRAINING
        to: SUSPENDED
        trigger: "system event: drain complete"
        actor: system
        preconditions:
          - "status == DRAINING"
          - "multi_cluster_queued_queries == 0"
        side_effects:
          - "status = SUSPENDED"
          - "cluster_count stays 0"
      - from: RUNNING
        to: RESIZING
        trigger: "PATCH /warehouses/{id}"
        actor: DataEngineer
        preconditions:
          - "status == RUNNING"
          - "the request changes size, clusters_min, clusters_max, auto_suspend_seconds or auto_resume"
        side_effects:
          - "status = RESIZING"
          - "every WarehouseSession already OPEN keeps its frozen size and clusters snapshot, so the resize cannot re-price a session that is already running"
          - "credits_per_hour is recomputed from warehouse_credit_burn SIZE_FACTORS for the new size"
      - from: RESIZING
        to: RUNNING
        trigger: "PATCH /warehouses/{id}/cluster-scaling"
        actor: DataEngineer
        preconditions:
          - "status IN {RUNNING, RESIZING}"
        side_effects:
          - "status = RUNNING"
          - "cluster_count = warehouse_cluster_scaling demand DEFAULT(min(requested_clusters, desired_clusters))"
          - "Account.posted_consumption_credits_reconciled is untouched — scaling changes the burn rate of future sessions only"

  - entity: WarehouseSession
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /warehouse-sessions/{id}/close"
        actor: DataEngineer
        preconditions:
          - "state == OPEN"
          - "expected_warehouse_version matches VirtualWarehouse.version (OCC on the parent warehouse)"
        side_effects:
          - "state = CLOSING"
          - "ended_at is stamped from the logical clock and elapsed_seconds is frozen as the logical-clock second difference between started_at and ended_at"
          - "metered_credits, billed_credits and billed_seconds are computed by warehouse_credit_burn against the frozen session size and clusters; the session's own size/clusters are never re-read from the warehouse"
          - "VirtualWarehouse.version increments by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "system event: session finalize"
        actor: system
        preconditions:
          - "state == CLOSING"
        side_effects:
          - "state = CLOSED"
          - "one AccountLedgerEntry is posted on the owning Account with bucket CONSUMPTION, source_entity WarehouseSession, source_entity_id == this session id, amount_credits == billed_credits"
          - "Account.posted_consumption_credits_reconciled is reconciled over buckets {CONSUMPTION, SHARE_CONSUMPTION}"
          - "every ResourceMonitor bound to the owning Account recomputes interval_consumption_credits and used_pct, which re-evaluates used_pct against the 50 and 100 crossing rules"
      - from: OPEN
        to: RESUMING
        trigger: "system event: parent warehouse entered DRAINING with work still queued"
        actor: system
        preconditions:
          - "state == OPEN"
          - "the parent VirtualWarehouse.status == DRAINING"
          - "the parent VirtualWarehouse.multi_cluster_queued_queries > 0, so the session cannot be closed cleanly and is abandoned instead"
        side_effects:
          - "state = RESUMING"
          - "the session is excluded from the parent's ordinary close sweep; it closes through the RESUMING edge instead"
      - from: RESUMING
        to: CLOSED
        trigger: "system event: session abandoned"
        actor: system
        preconditions:
          - "state == RESUMING"
        side_effects:
          - "state = CLOSED"
          - "billed_seconds = 0, metered_credits = 0 and billed_credits = 0"
          - "no AccountLedgerEntry row is posted; floor billing never applies to an abandoned session (the BILLED_FLOOR branch of warehouse_credit_burn is skipped)"

  - entity: CapacityContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Cyclic: EXPIRED -> ACTIVE (renew with rollover) -> EXHAUSTED (allowance consumed) -> EXPIRED (next term end) can repeat without bound."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /capacity-contracts/{id}/activate"
        actor: FinanceController
        preconditions:
          - "status == DRAFT"
          - "term_end is strictly after term_start on the logical clock"
          - "base_credits > 0 and rollover_cap_credits > 0"
        side_effects:
          - "status = ACTIVE"
          - "remaining_credits = base_credits + rolled_over_credits - drawn_credits, floored at 0"
          - "no AccountLedgerEntry row is posted by activation; a DRAFT contract holds no credits"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system event: remaining allowance fully consumed"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "remaining_credits == 0 immediately after the drawdown that consumed it"
        side_effects:
          - "status = EXHAUSTED"
          - "the causing CreditDrawdown row's credits are segmented into BASE, then ROLLOVER, then OVERAGE buckets in that order, and its outcome is set to the last non-empty bucket"
          - "one AccountLedgerEntry is posted with bucket OVERAGE and amount_usd == CreditDrawdown.overage_usd, the portion of the drawdown exceeding base_credits + rolled_over_credits priced at overage_rate_per_credit"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system event: rollover credits booked"
        actor: system
        preconditions:
          - "status IN {EXHAUSTED, ACTIVE, EXPIRED}"
          - "rolled_over_credits < rollover_cap_credits"
        side_effects:
          - "rolled_over_credits = min(rollover_utilization_pct basis rollover_cap_credits multiplied by rollover_cap_credits, rollover_cap_credits)"
          - "one AccountLedgerEntry is posted with bucket ROLLOVER, amount_usd == 0, amount_credits == the newly booked amount"
          - "status = ACTIVE"
          - "remaining_credits is recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: term_end reached on the logical clock"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "logical clock is at or past term_end"
        side_effects:
          - "status = EXPIRED"
          - "rolled_over_credits for the NEXT term = min(rollover_utilization_pct basis rollover_cap_credits multiplied by rollover_cap_credits, rollover_cap_credits); the basis here is rollover_cap_credits, NOT remaining_credits"
          - "one AccountLedgerEntry is posted with bucket ROLLOVER, amount_usd == 0"
          - "drawn_credits and drawdown_count are left intact until the contract is renewed, so the expired credits remain auditable"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /capacity-contracts/{id}/renew"
        actor: FinanceController
        preconditions:
          - "status == EXPIRED"
          - "the supplied new term_end is strictly after the contract's current term_end"
          - "the supplied new term_start equals the contract's current term_end (adjacent, non-overlapping terms)"
        side_effects:
          - "rolled_over_credits = min(rollover_utilization_pct basis term_end_remaining_credits multiplied by rollover_cap_credits, rollover_cap_credits); the basis here is term_end_remaining_credits, NOT the current remaining_credits and NOT rollover_cap_credits"
          - "base_credits is replaced by the supplied base_credits and remaining_credits is recomputed"
          - "drawdown_count, drawn_credits and base_consumed_credits are all reset to 0, arming a fresh idempotency namespace and a fresh BASE segment for the next term"
          - "status = ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /capacity-contracts/{id}/close"
        actor: FinanceController
        preconditions:
          - "status IN {ACTIVE, EXPIRED, EXHAUSTED}"
        side_effects:
          - "status = CLOSED"
          - "overage accrual stops; no further CreditDrawdown may bind to this contract"
          - "no AccountLedgerEntry row is posted by the close itself (closing is not a compensating action)"

  - entity: StorageUsageRecord
    initial_state: FINALIZED
    terminal_states: []
    note: "Cyclic: FINALIZED -> REVISED -> FINALIZED can repeat; each cycle posts a further STORAGE_ADJUST or STORAGE row."
    transitions:
      - from: FINALIZED
        to: REVISED
        trigger: "POST /storage-usage-records/{id}/revise"
        actor: DataEngineer
        preconditions:
          - "snapshot_state == FINALIZED"
          - "expected_storage_usage_record_version matches StorageUsageRecord.version"
        side_effects:
          - "snapshot_state = REVISED"
          - "billable_storage_tb is recomputed by storage_billable_volume"
          - "storage_cost_dollars is recomputed, and only the ACTIVE and TIME_TRAVEL components contribute — the fail-safe component is billed at a zero rate"
          - "one AccountLedgerEntry is posted with bucket STORAGE_ADJUST and amount_usd == the signed difference between the recomputed storage_cost_dollars and the prior stored value"
          - "Account.posted_storage_dollars_reconciled is reconciled to the sum of amount_usd over buckets {STORAGE, STORAGE_ADJUST}"
      - from: REVISED
        to: FINALIZED
        trigger: "POST /storage-usage-records/{id}/finalize"
        actor: FinanceController
        preconditions:
          - "snapshot_state == REVISED"
        side_effects:
          - "snapshot_state = FINALIZED"
          - "billable_storage_tb and storage_cost_dollars are recomputed from the current component volumes"
          - "one AccountLedgerEntry is posted with bucket STORAGE_ADJUST and amount_usd == the signed difference between the recomputed storage_cost_dollars and the prior stored value, which is exactly 0.00 when the volumes are unchanged; the STORAGE plus STORAGE_ADJUST sum therefore always equals the current stored storage_cost_dollars"

  - entity: DataShare
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: DRAFT -> PUBLISHED -> DRAFT (revoke) and PUBLISHED -> SUSPENDED -> PUBLISHED (re-publish) are both legal and repeatable."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /data-shares/{id}/publish"
        actor: ShareAdmin
        preconditions:
          - "status IN {DRAFT, SUSPENDED}"
          - "every member of consumer_account_ids is the id of an existing Account"
          - "no member of consumer_account_ids equals provider_account_id"
          - "objects_exposed >= 1"
        side_effects:
          - "status = PUBLISHED"
          - "consumer accounts may now post ShareUsageEvent rows against this share"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /data-shares/{id}/suspend"
        actor: ShareAdmin
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "status = SUSPENDED"
          - "every ShareUsageEvent posted after this transition is rejected with ERR_SHARE_NOT_PUBLISHED; rows already posted are retained and still counted in consumer_query_count"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /data-shares/{id}/revoke"
        actor: ShareAdmin
        preconditions:
          - "status == PUBLISHED"
          - "the share has no ShareUsageEvent with attributed_row_count > 0"
        side_effects:
          - "status = DRAFT"
          - "consumer_query_count and consumer_credits are reset to 0"
          - "every Listing bound to this share whose listing_state == PUBLISHED moves PUBLISHED -> WITHDRAWN through the system transition 'bound DataShare left PUBLISHED'; that Listing transition is what freezes provider_payout_usd and platform_fee_usd"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /data-shares/{id}/publish"
        actor: ShareAdmin
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "status = PUBLISHED"
          - "consumer_account_ids in force at suspend time are preserved unchanged"

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /listings/{id}/publish"
        actor: ShareAdmin
        preconditions:
          - "listing_state == DRAFT"
          - "the bound DataShare.status == PUBLISHED"
          - "pricing_model == USAGE_BASED implies flat_price_usd > 0"
        side_effects:
          - "listing_state = PUBLISHED"
          - "frozen_price_usd stays null until the first provider payout"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /listings/{id}/withdraw"
        actor: ShareAdmin
        preconditions:
          - "listing_state == PUBLISHED"
        side_effects:
          - "listing_state = WITHDRAWN"
          - "provider_payout_usd and platform_fee_usd are frozen at their current values and remain payable"
          - "no further PaidShareUsage row may bind to this listing"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system event: bound DataShare left PUBLISHED"
        actor: system
        preconditions:
          - "listing_state == PUBLISHED"
          - "the bound DataShare.status != PUBLISHED"
        side_effects:
          - "listing_state = WITHDRAWN"
          - "provider_payout_usd and platform_fee_usd are frozen at their current values"

  - entity: PaidShareUsage
    initial_state: PENDING
    terminal_states: []
    note: "Cyclic: PENDING -> SETTLED -> DISPUTED -> SETTLED can repeat."
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system event: buyer settlement"
        actor: system
        preconditions:
          - "usage_state == PENDING"
        side_effects:
          - "usage_state = SETTLED"
          - "price_per_credit is set from the listing's flat_price_usd when the listing has no prior payout row, and is preserved unchanged otherwise"
          - "Listing.gross_credit_volume is recomputed and provider_payout_usd and platform_fee_usd are recomputed by provider_payout_split"
          - "one AccountLedgerEntry is posted on the provider account with bucket PAYOUT, amount_usd == provider_payout_usd, amount_credits == 0"
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /paid-share-usage/{id}/dispute"
        actor: PlatformOperator
        preconditions:
          - "usage_state == SETTLED"
          - "expected_listing_version matches Listing.version"
        side_effects:
          - "usage_state = DISPUTED"
          - "the row's contribution is removed from Listing.gross_credit_volume, provider_payout_usd and platform_fee_usd"
          - "one AccountLedgerEntry is posted on the provider account with bucket PAYOUT_ADJUST and amount_usd == the negation of the provider share that was just removed"
          - "Listing.version increments by 1"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /paid-share-usage/{id}/resolve"
        actor: PlatformOperator
        preconditions:
          - "usage_state == DISPUTED"
        side_effects:
          - "usage_state = SETTLED"
          - "the row's contribution is added back to Listing.gross_credit_volume, provider_payout_usd and platform_fee_usd"
          - "one AccountLedgerEntry is posted on the provider account with bucket PAYOUT and amount_usd == the restored provider share"

  - entity: ReplicationConfiguration
    initial_state: CONFIGURED
    terminal_states: []
    note: "Cyclic: CONFIGURED -> REFRESHING -> FAILED -> REFRESHING -> REFRESHED can repeat."
    transitions:
      - from: CONFIGURED
        to: REFRESHING
        trigger: "POST /replication-configurations/{id}/refresh"
        actor: DataEngineer
        preconditions:
          - "replication_state IN {CONFIGURED, REFRESHED, FAILED}"
          - "replicated_tb is greater than 0 and at most 500"
        side_effects:
          - "replication_state = REFRESHING"
          - "refresh_count increments by 1"
      - from: REFRESHING
        to: REFRESHED
        trigger: "system event: transfer complete"
        actor: system
        preconditions:
          - "replication_state == REFRESHING"
        side_effects:
          - "replication_state = REFRESHED"
          - "transfer_cost_dollars is recomputed by replication_transfer_cost"
          - "one AccountLedgerEntry is posted with bucket REPLICATION and amount_usd == transfer_cost_dollars; amount_credits == 0 because replication is dollar-denominated"
          - "Account.posted_consumption_credits_reconciled is deliberately NOT changed by a dollar-denominated bucket, so the account's credit balance is unaffected"
          - "every ResourceMonitor bound to the account recomputes interval_consumption_credits from the credit-denominated buckets only, so used_pct stays unchanged"
      - from: REFRESHING
        to: FAILED
        trigger: "system event: transfer failed"
        actor: system
        preconditions:
          - "replication_state == REFRESHING"
          - "the owning Account.account_state == DRAINING"
        side_effects:
          - "replication_state = FAILED"
          - "no AccountLedgerEntry row is posted; a failed transfer adds exactly 0 dollars"

  - entity: ResourceMonitor
    initial_state: OK
    terminal_states: []
    note: "Cyclic: OK -> NOTIFY_SENT -> SUSPENDED -> OK across interval resets."
    transitions:
      - from: OK
        to: NOTIFY_SENT
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "monitor_state == OK"
          - "used_pct >= 50.0 and used_pct < 100.0"
        side_effects:
          - "monitor_state = NOTIFY_SENT"
          - "Account.account_state is left unchanged"
      - from: NOTIFY_SENT
        to: NOTIFY_SENT
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "monitor_state == NOTIFY_SENT"
          - "used_pct >= 50.0"
        side_effects:
          - "monitor_state stays NOTIFY_SENT"
          - "no second notification is emitted; the notification edge is a one-shot per crossing of 50.0"
      - from: OK
        to: SUSPENDED
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "monitor_state == OK"
          - "used_pct >= 100.0"
          - "action IN {SUSPEND, SUSPEND_IMMEDIATE}"
        side_effects:
          - "monitor_state = SUSPENDED"
          - "Account.account_state = DRAINING, which is the second step of the chain and not a direct consequence of the ledger posting that triggered the sweep"
          - "every VirtualWarehouse of the account still in RUNNING moves RUNNING -> DRAINING, which in turn closes that warehouse's open sessions per warehouse_credit_burn and posts a CONSUMPTION AccountLedgerEntry for each"
          - "when monitor_scope == INCLUDE_CONSUMERS, every VirtualWarehouse owned by an account listed in consumer_account_ids of a PUBLISHED DataShare of this account also moves RUNNING -> DRAINING"
      - from: NOTIFY_SENT
        to: SUSPENDED
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "monitor_state == NOTIFY_SENT"
          - "used_pct >= 100.0"
          - "action IN {SUSPEND, SUSPEND_IMMEDIATE}"
        side_effects:
          - "the same side-effect set as the OK -> SUSPENDED crossing; SUSPEND and SUSPEND_IMMEDIATE differ only in whether the notify edge is emitted first, and the skip is the only difference between the two edges"
      - from: SUSPENDED
        to: OK
        trigger: "POST /resource-monitors/{id}/reset"
        actor: FinanceController
        preconditions:
          - "monitor_state == SUSPENDED"
        side_effects:
          - "monitor_state = OK"
          - "interval_consumption_credits = 0 and used_pct = 0"
          - "last_reset_at is stamped from the logical clock, which is the exclusive lower bound of the new interval window"
          - "Account.account_state is re-derived and returns to OPEN when no other ResourceMonitor bound to the account is in monitor_state SUSPENDED and every VirtualWarehouse of the account is in SUSPENDED"

  - entity: CreditDrawdown
    initial_state: ACTIVE
    terminal_states: [REVERSED]
    note: "Forward-and-compensate pair: a drawdown is posted through the create endpoint in ACTIVE, and only the compensating reverse leaves it terminal, so the pair is what restores the account's reconciled credit figure."
    transitions:
      - from: ACTIVE
        to: REVERSED
        trigger: "POST /credit-drawdowns/{id}/reverse"
        actor: FinanceController
        preconditions:
          - "status == ACTIVE"
          - "the contract's status IN {ACTIVE, EXHAUSTED, CLOSED}"
        side_effects:
          - "status = REVERSED"
          - "contract.drawn_credits is reduced by amount_credits and base_consumed_credits is reduced by the drawdown's BASE portion, clamped at 0"
          - "contract.remaining_credits is recomputed, and the contract moves EXHAUSTED back to ACTIVE when the restored credits lift it above 0"
          - "one AccountLedgerEntry is posted with bucket CONSUMPTION and amount_credits equal to the negation of the drawdown's within-allowance portion; a compensating reversal of a full-allowance drawdown therefore restores the account's reconciled credit figure exactly"
          - "Account.posted_consumption_credits_reconciled is reconciled and every ResourceMonitor of the account recomputes used_pct"
  - entity: Account
    initial_state: OPEN
    terminal_states: []
    note: "Posture-driven machine: account_state is derived by account_posture_derivation after every ledger posting, monitor crossing and monitor reset rather than being set by a client, and it gates every charged-open operation on its children."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "account_state == OPEN"
          - "the account's maximum used_pct across its ResourceMonitor rows is >= 50.0 and < 100.0"
        side_effects:
          - "account_state = RESTRICTED"
          - "warehouse resume and drawdown remain admitted in this posture"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /resource-monitors/{id}/reset"
        actor: FinanceController
        preconditions:
          - "account_state == RESTRICTED"
          - "no ResourceMonitor of the account is in monitor_state SUSPENDED and every used_pct is below 50.0"
        side_effects:
          - "account_state = OPEN"
      - from: RESTRICTED
        to: DRAINING
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "account_state == RESTRICTED"
          - "at least one ResourceMonitor of the account reached monitor_state SUSPENDED"
        side_effects:
          - "account_state = DRAINING"
          - "every VirtualWarehouse of the account still in RUNNING moves RUNNING -> DRAINING as a separate hop"
      - from: OPEN
        to: DRAINING
        trigger: "system event: monitor sweep after a ledger posting"
        actor: system
        preconditions:
          - "account_state == OPEN"
          - "at least one ResourceMonitor of the account reached monitor_state SUSPENDED without ever passing through the notify edge"
        side_effects:
          - "account_state = DRAINING"
          - "every VirtualWarehouse of the account still in RUNNING moves RUNNING -> DRAINING as a separate hop, closing that warehouse's open sessions through warehouse_credit_burn"
      - from: DRAINING
        to: OPEN
        trigger: "POST /resource-monitors/{id}/reset"
        actor: FinanceController
        preconditions:
          - "account_state == DRAINING"
          - "no ResourceMonitor of the account is in monitor_state SUSPENDED and every VirtualWarehouse of the account is in SUSPENDED"
        side_effects:
          - "account_state = OPEN"

concurrency_rules:
  - rule_id: session-close-stale-warehouse
    parent_entity: VirtualWarehouse
    write_endpoint: "POST /warehouse-sessions/{id}/close"
    occ_field: "expected_warehouse_version"
    description: |
      Closing a WarehouseSession against a VirtualWarehouse whose version has
      advanced since the client last observed it is rejected with 412. The
      version advances legitimately through resize, cluster scaling and any
      sibling session close, so the closing client's view of the warehouse is
      stale even though the session itself is still OPEN.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: drawdown-stale-contract
    parent_entity: CapacityContract
    write_endpoint: "POST /credit-drawdowns"
    occ_field: "expected_contract_version"
    description: |
      Posting a CreditDrawdown against a CapacityContract whose version has
      advanced since the client last observed it is rejected with 412. Any
      concurrent drawdown, rollover booking or renewal legitimately advances
      the contract version, so a client that still carries the older version
      is drawing against a stale allowance picture.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: scaling-stale-warehouse
    parent_entity: VirtualWarehouse
    write_endpoint: "POST /warehouses/{id}/cluster-scaling"
    occ_field: "expected_warehouse_version"
    description: |
      Re-scaling a VirtualWarehouse whose version has advanced since the
      client last observed it is rejected with 412. A resize, a suspend sweep
      or a monitor-driven drain all legitimately advance the version, so the
      scaling decision was computed against a stale view of the warehouse.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: paid-usage-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /paid-share-usage"
    occ_field: "expected_listing_version"
    description: |
      Recording PaidShareUsage against a Listing whose version has advanced
      since the client last observed it is rejected with 412. A provider
      payout or a dispute resolution legitimately advances the listing
      version, and the frozen price attached to the new usage row would
      otherwise be computed from a stale listing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: revise-stale-storage-snapshot
    parent_entity: StorageUsageRecord
    write_endpoint: "POST /storage-usage-records/{id}/revise"
    occ_field: "expected_storage_usage_record_version"
    description: |
      Revising a StorageUsageRecord whose version has advanced since the
      client last observed it is rejected with 412. A prior revise or a
      finalize legitimately advances the snapshot version, so the revision
      would otherwise post a STORAGE_ADJUST delta computed against superseded
      volumes.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: warehouse_credit_burn
    trigger: "WarehouseSession moves CLOSING -> CLOSED (also evaluated, without persistence, when POST /warehouses/{id}/resume returns its auto_resume projection)"
    algorithm: tiered_pricing
    formula: |
      SIZE_FACTORS = {XSMALL: 1, SMALL: 2, MEDIUM: 4, LARGE: 8, XLARGE: 16,
                      XXLARGE: 32, XXXLARGE: 64, X4LARGE: 128}
      raw_credits    = SIZE_FACTORS[session.size] * session.clusters * session.elapsed_seconds / 3600
      raw_billed_sec = session.elapsed_seconds MONOTONIC_RAISE session.warehouse.auto_suspend_seconds

      # Segment order is pinned: the RESUMING guard is applied FIRST, before the
      # floor. Apply the floor first and an abandoned session bills its size
      # factor for a full minute instead of zero.
      IF session.state == RESUMING:
          billed_seconds = 0
      ELSE:
          billed_seconds = raw_billed_sec
      metered_credits = ROUND_6(raw_credits)
      billed_credits  = ROUND_6(SIZE_FACTORS[session.size] * session.clusters * billed_seconds / 3600)
    input_set: "Sessions in state CLOSED only. OPEN, CLOSING and RESUMING sessions contribute nothing; sessions of a warehouse in DRAINING are included once their own state reaches CLOSED, because the drain transition closes them before the drain completes."
    constants:
      SECONDS_PER_HOUR: 3600
      SIZE_FACTORS: "{XSMALL: 1, SMALL: 2, MEDIUM: 4, LARGE: 8, XLARGE: 16, XXLARGE: 32, XXXLARGE: 64, X4LARGE: 128}"
      RESUMING_GUARD_PRECEDENCE: "applied before the floor"
    precision: "6 decimal places, round_half_up, applied once per session at close; never summed then rounded"
    variants:
      - name: METERED
        when: "Provider analytics and the consumption breakdown report; the raw per-second measurement."
        difference: "Uses session.elapsed_seconds with no floor, so a 47-second MEDIUM session meters 0.052222 credits."
      - name: BILLED_FLOOR
        when: "Contract drawdown and every AccountLedgerEntry posting; the value the customer is actually charged."
        difference: "Raises billed_seconds to the warehouse's auto_suspend_seconds before multiplying, but a RESUMING session is exempt from the floor and bills 0, so the same 47-second MEDIUM session bills 0.066667 credits while a 61-second one meters and bills the same 0.067778."
  - name: warehouse_cluster_scaling
    trigger: "PATCH /warehouses/{id}/cluster-scaling"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned and MUST NOT be reordered:
      #   (1) demand  -> (2) clamp -> (3) budget shrink -> (4) budget floor
      desired_clusters = CEILING(warehouse.multi_cluster_queued_queries / 8)
      desired_clusters = CLAMP(desired_clusters,
                               lower = warehouse.clusters_min,
                               upper = warehouse.clusters_max)
      requested_clusters = request.clusters
      candidate = MIN(requested_clusters, desired_clusters)
      candidate = MAX(candidate, warehouse.clusters_min)        # the min floor is re-applied AFTER clamping
      projected_burn = warehouse.size_factor * candidate * projected_seconds / 3600
      WHILE projected_burn > contract.remaining_credits AND candidate > warehouse.clusters_min:
          candidate = candidate - 1
          projected_burn = warehouse.size_factor * candidate * projected_seconds / 3600
      cluster_count = candidate
    input_set: "Only warehouses whose status IN {RUNNING, RESIZING}; a warehouse in SUSPENDED, STARTING or DRAINING rejects the scaling request with ERR_INVALID_STATE. multi_cluster_queued_queries counts queued queries regardless of originating account."
    constants:
      QUERIES_PER_CLUSTER: 8
      PROJECTED_SECONDS: 900
      SHRINK_STEP: 1
      MIN_FLOOR_REAPPLIED: true
    precision: "cluster_count is an integer; projected_burn is compared as an exact decimal and is not rounded before the comparison"
    variants:
      - name: DEMAND_ONLY
        when: "The warehouse's owning account has no ACTIVE CapacityContract, or every ACTIVE contract already has remaining_credits == 0."
        difference: "Skips steps (3) and (4), so cluster_count follows demand and clamping alone — 19 queued queries with clusters_max 3 yields 3 clusters."
      - name: BUDGET_BOUND
        when: "At least one ACTIVE CapacityContract with remaining_credits > 0 exists for the warehouse's owning account."
        difference: "Steps (3) and (4) shrink the result until the projected 900-second burn fits inside contract.remaining_credits — the same 19 queued queries against a LARGE warehouse with remaining_credits 5.0 yields 2 clusters instead of 3, because 3 clusters would project 6.00 credits and 2 project 4.00."
  - name: contract_credit_drawdown
    trigger: "POST /credit-drawdowns and system event: remaining allowance fully consumed"
    algorithm: waterfall_allocation
    formula: |
      # Segment order is pinned: BASE is consumed first, residual flows to
      # ROLLOVER, and only what remains after both is OVERAGE.
      drawdownable = contract.base_credits + contract.rolled_over_credits
      overage_credits = MAX(0, contract.drawn_credits + drawdown.amount_credits - drawdownable)
      base_portion    = MIN(drawdown.amount_credits, MAX(0, contract.base_credits - contract.base_consumed_credits))
      rollover_portion = drawdown.amount_credits - base_portion - overage_credits
      outcome = OVERAGE if overage_credits > 0
                else ROLLOVER if rollover_portion > 0
                else BASE
      overage_usd = ROUND_2(overage_credits * contract.overage_rate_per_credit)
      contract.remaining_credits = MAX(0, contract.base_credits + contract.rolled_over_credits - contract.drawn_credits)
    input_set: "CreditDrawdown rows with status ACTIVE bound to a contract with status ACTIVE, EXHAUSTED or CLOSED. REVERSED rows are excluded, and a drawdown bound to a contract whose status is DRAFT is rejected before this rule runs."
    constants:
      SEGMENT_ORDER: "[BASE, ROLLOVER, OVERAGE]"
      REMAINING_FLOOR: 0
      OVERAGE_ROUNDING: "round_half_up to 2 decimals, applied to the dollar figure only"
    precision: "credits to 6 decimal places; the overage dollar figure to 2 decimal places"
    variants:
      - name: WITHIN_ALLOWANCE
        when: "contract.drawn_credits + drawdown.amount_credits <= base_credits + rolled_over_credits."
        difference: "overage_credits is 0, so no OVERAGE AccountLedgerEntry is posted and remaining_credits stays above 0."
      - name: OVER_ALLOWANCE
        when: "contract.drawn_credits + drawdown.amount_credits > base_credits + rolled_over_credits."
        difference: "The excess is priced at overage_rate_per_credit and posted to the OVERAGE bucket — a contract with base_credits 1000 and no rollover receiving a 1200-credit drawdown posts 600.00 dollars of overage, and the contract moves to EXHAUSTED with remaining_credits 0."
  - name: contract_rollover_utilization
    trigger: "CapacityContract moves to EXPIRED, and again on the EXPIRED -> ACTIVE RENEW transition"
    algorithm: threshold
    formula: |
      # Two formulas, two different bases, two different outcomes for the same
      # contract. Which one runs is decided purely by the direction of the
      # transition, never by a flag on the contract.
      AT_EXPIRY:               # AT_EXPIRY variant; runs on the ACTIVE -> EXPIRED transition
          contract.term_end_remaining_credits = contract.remaining_credits   # frozen FIRST
          basis = contract.rollover_cap_credits      # the CAP, not what is left
          rollover_utilization_pct = ROUND_6(basis / contract.rollover_cap_credits * 100)   # identically 100.000000
          rolled_over_credits = ROUND_6(MIN(rollover_utilization_pct * contract.rollover_cap_credits / 100,
                                            contract.rollover_cap_credits))                # identically the cap
      AT_RENEWAL:              # AT_RENEWAL variant; runs on the EXPIRED -> ACTIVE transition
          basis = contract.term_end_remaining_credits   # frozen at expiry, NOT the current remaining_credits
          rollover_utilization_pct = ROUND_6(basis / contract.rollover_cap_credits * 100)
          rolled_over_credits = ROUND_6(MIN(rollover_utilization_pct * contract.rollover_cap_credits / 100,
                                            contract.rollover_cap_credits))
          # AT_RENEWAL re-computes rolled_over_credits from scratch and posts a
          # ROLLOVER ledger row for the signed difference from the AT_EXPIRY value.
      days_in_term = (term_end - term_start) in whole logical-clock days
    input_set: "Only contracts whose status is ACTIVE (for expiry) or EXPIRED (for renewal). A CLOSED contract never rolls anything into the following term."
    constants:
      ROLLOVER_CAP_ABSOLUTE: "rollover_cap_credits, from the contract itself"
      DAYS_DIVISOR: "days_in_term, the whole-day span of the term"
    precision: "percent to 6 decimal places, credits to 6 decimal places"
    variants:
      - name: AT_EXPIRY
        when: "The term end is reached while the contract is ACTIVE."
        difference: "Bases the rollover on rollover_cap_credits, so a 1000-credit contract with rollover_cap_credits 200 and only 150 credits left always books exactly 200.00 credits."
      - name: AT_RENEWAL
        when: "The contract is EXPIRED and POST /capacity-contracts/{id}/renew succeeds."
        difference: "Bases the rollover on term_end_remaining_credits, so the same contract re-books down to 150.00 credits and posts a minus 50.00 ROLLOVER correction, while remaining_credits 700 would book 200.00 because the cap binds."
  - name: storage_billable_volume
    trigger: "StorageUsageRecord create, revise and finalize"
    algorithm: aggregation
    formula: |
      storage_billable_tb = active_tb + time_travel_tb + fail_safe_tb
      time_travel_retained = time_travel_days >= 1
      fail_safe_retained   = fail_safe_days >= 1
    input_set: "Every component volume is included regardless of its retention window; a zero-day retention window reports its volume but the per-component dollar rate is what changes in storage_billing_time_travel_fail_safe, not the volume itself."
    constants:
      FAIL_SAFE_DAYS: 7
      TIME_TRAVEL_DAYS_MIN: 0
      TIME_TRAVEL_DAYS_MAX: 90
    precision: "6 decimal places, round_half_up"
    variants:
      - name: ALL_COMPONENTS
        when: "Every snapshot, including one whose time_travel_days is 0."
        difference: "Billable volume sums all three components even when a component's retention window is zero, so the reported billable volume never varies with retention settings."
      - name: RETENTION_RANGE_PRICED
        when: "The two snapshot read endpoints, which price the components on the versioned TIME_TRAVEL and FAIL_SAFE rate ranges instead of the point rates."
        difference: "Billable volume is identical, but a time_travel_tb of 3.33 contributes 0.00 dollars at time_travel_days 0 and 83.92 dollars at time_travel_days 30, so the retention window changes the bill without changing the volume."
  - name: storage_billing_time_travel_fail_safe
    trigger: "StorageUsageRecord create, revise, finalize and the storage snapshot read endpoints"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round each component to 2 decimals, THEN sum.
      # Summing the raw products and rounding once yields 402.27 for the
      # fixture below, one cent below the pinned 402.28. Never reorder.
      BILLABLE_RATE = {ACTIVE: 0.77, TIME_TRAVEL: 0.84, FAIL_SAFE: 1.01}
      components = [
        ("ACTIVE",      active_tb),
        ("TIME_TRAVEL", time_travel_tb if time_travel_days >= 1 else 0),
        ("FAIL_SAFE",   fail_safe_tb   if fail_safe_days   >= 1 else 0)
      ]
      per_component = [ ROUND_2(tb * BILLABLE_RATE[k] * days_in_month) for (k, tb) in components ]
      storage_cost_dollars = ROUND_2(SUM(per_component))
      days_in_month = 30
    input_set: "All three components participate, but a component whose retention window is zero multiplies by a zero rate, so its contribution is exactly 0.00 rather than being dropped from the list."
    constants:
      BILLABLE_RATE: "{ACTIVE: 0.77, TIME_TRAVEL: 0.84, FAIL_SAFE: 1.01}"
      DAYS_IN_MONTH: 30
      ROUNDING_ORDER: "per-component-then-sum"
    precision: "2 decimal places, round_half_up, per component and then again on the sum"
    variants:
      - name: SUM_THEN_ROUND
        when: "The GET /storage-usage-records/{id}/billing-summary read endpoint, which is the documented reporting figure."
        difference: "Rounds once over the summed raw products: the fixture (active_tb 12.47, time_travel_tb 3.33, time_travel_days 30, fail_safe_tb 1.0, fail_safe_days 7) yields 402.27 here versus 402.28 for PER_COMPONENT — a one-cent gap that exists only because of rounding order."
      - name: PER_COMPONENT
        when: "The stored StorageUsageRecord.storage_cost_dollars written on create, revise and finalize, and therefore every STORAGE and STORAGE_ADJUST ledger posting."
        difference: "Rounds each of the three components before summing: 288.06 + 83.92 + 30.30 = 402.28, which is the value the ledger carries."
  - name: data_share_consumption_attribution
    trigger: "POST /shares/{id}/usage-events and the DataShare read endpoints"
    algorithm: aggregation
    formula: |
      # The attribution rule is the point: the credits land on the CONSUMER.
      attribution = CONSUMER if event.consumer_account_id != share.provider_account_id
                    else UNATTRIBUTED
      attributed_row_count = event.row_count
      charged_account_id = event.consumer_account_id if attribution == CONSUMER else null
      # Empty-result boundary: a query that returned zero rows is counted but
      # draws no credits, so charged_credits is 0 whenever row_count is 0.
      charged_credits = event.credits_consumed if event.row_count > 0 else 0
      consumer_query_count = COUNT(ShareUsageEvent WHERE share_id == share.id)
      consumer_credits     = ROUND_6(SUM(charged_credits OVER ShareUsageEvent WHERE share_id == share.id))
    input_set: "ShareUsageEvent rows whose share is PUBLISHED or SUSPENDED; a row against a DRAFT share is rejected before this rule runs, and a row whose consumer_account_id equals the provider is rejected with ERR_SHARE_SELF_CONSUMPTION."
    constants:
      PROVIDER_CHARGED: false
      ATTRIBUTION_BUCKETS: "[CONSUMER, PROVIDER, UNATTRIBUTED]"
    precision: "credits to 6 decimal places; counts are integers"
    variants:
      - name: ROWS_RETURNED
        when: "The share usage event carried attributed_row_count > 0."
        difference: "Credits are attributed to the consumer account and a SHARE_CONSUMPTION AccountLedgerEntry is posted with amount_credits == credits_consumed, so the provider's posted_consumption_credits_reconciled is unchanged."
      - name: ZERO_ROWS
        when: "The share usage event carried attributed_row_count == 0 (query matched no rows)."
        difference: "The consumer query is still counted in consumer_query_count, but charged_credits is 0 and no SHARE_CONSUMPTION ledger row is posted — so a 2.0-credit event with row_count 0 moves the query count while leaving the consumer's reconciled credit figure untouched."
  - name: provider_payout_split
    trigger: "PaidShareUsage moves PENDING -> SETTLED, SETTLED -> DISPUTED and DISPUTED -> SETTLED; also evaluated by the provider payout read endpoint"
    algorithm: weighted_scoring
    formula: |
      # COMMISSION_FIRST mode: the commission rate is applied to the gross,
      # and the provider receives the remainder. The remainder is NOT rounded
      # independently — it is derived by subtraction, so the two parts always
      # sum back to the gross exactly.
      gross_credit_volume = ROUND_6(SUM(usage.credits_used * usage.price_per_credit
                                        WHERE usage.usage_state == SETTLED
                                        AND usage.listing_id == listing.id))
      candidate_price = listing.frozen_price_usd if listing.frozen_price_usd != null
                        else listing.flat_price_usd
      platform_fee_usd   = ROUND_2(gross_credit_volume * PLATFORM_COMMISSION_PCT)
      provider_payout_usd = ROUND_2(gross_credit_volume) - platform_fee_usd
    input_set: "Only PaidShareUsage rows with usage_state SETTLED. PENDING rows contribute nothing; DISPUTED rows contribute nothing while disputed and contribute again on resolve."
    constants:
      PLATFORM_COMMISSION_PCT: 0.15
      FREE_LISTING_COMMISSION_PCT: 0.0
    precision: "2 decimal places, round_half_up, with the provider share defined as gross minus commission so no rounding remainder is lost"
    variants:
      - name: COMMISSION_FIRST
        when: "The listing is USAGE_BASED and frozen_price_usd is null (this is the listing's first payout)."
        difference: "Sets frozen_price_usd from flat_price_usd and then splits the gross — 150 credits at 0.50 dollars with a 15 percent commission pays the provider 63.75 dollars and the platform 11.25."
      - name: PRICE_FROZEN_FIRST
        when: "The listing is USAGE_BASED and frozen_price_usd is already non-null (any later payout), or the listing is FLAT."
        difference: "Prices the new usage at the frozen value even if flat_price_usd has since changed, so a provider who raises the price after the first payout earns nothing extra on the already-frozen rows."
  - name: replication_transfer_cost
    trigger: "ReplicationConfiguration moves REFRESHING -> REFRESHED"
    algorithm: tiered_pricing
    formula: |
      region_factor = REGION_FACTOR[config.target_region]
      cloud_factor  = CLOUD_FACTOR[config.target_cloud]
      transfer_cost_dollars = ROUND_2(config.replicated_tb * COST_PER_TB * region_factor * cloud_factor)
    input_set: "The latest REFRESHING -> REFRESHED cycle only; a FAILED refresh posts 0 dollars and leaves transfer_cost_dollars at its prior value."
    constants:
      COST_PER_TB: 5.00
      REGION_FACTOR: "{us-east-1: 1.00, us-west-2: 1.10, eu-central-1: 1.20, ap-southeast-1: 1.30}"
      CLOUD_FACTOR: "{SAME_CLOUD: 1.00, CROSS_CLOUD: 1.35}"
    precision: "2 decimal places, round_half_up, applied once to the product of all four inputs"
    variants:
      - name: COST_PER_TB
        when: "Always; this is the only mode in force in v1 and it prices the raw terabyte transfer."
        difference: "Prices terabytes transferred, so 4.5 TB to us-west-2 across clouds costs 4.5 * 5.00 * 1.10 * 1.35 = 33.41 dollars and posts a REPLICATION AccountLedgerEntry with amount_credits 0, which leaves the account's credit-denominated consumption untouched."
      - name: BYTES_TRANSFERRED
        when: "Reserved for the byte-granularity replication mode; no endpoint in v1 selects it."
        difference: "Would price bytes rather than terabytes, so the same 4.5 TB would be 4.5e12 bytes at the per-byte rate and land on a materially larger figure; no request field selects this mode, so COST_PER_TB is the only observable behaviour."
  - name: resource_monitor_threshold
    trigger: "Every AccountLedgerEntry posting, and POST /resource-monitors/{id}/reset"
    algorithm: threshold
    formula: |
      window = (monitor.last_reset_at, logical_clock]     # last_reset_at EXCLUSIVE, now INCLUSIVE
      interval_consumption_credits = ROUND_6(SUM(ledger.amount_credits
                                        WHERE ledger.account_id == monitor.account_id
                                        AND ledger.bucket IN {CONSUMPTION, SHARE_CONSUMPTION}
                                        AND ledger.posted_at >  monitor.last_reset_at
                                        AND ledger.posted_at <= logical_clock))
      used_pct = ROUND_6(interval_consumption_credits / monitor.credit_quota * 100)
      crossing = NOTIFY  if used_pct >= 50.0 and prev_used_pct < 50.0
                 SUSPEND if used_pct >= 100.0
                 NONE    otherwise
    input_set: "Only credit-denominated consumption buckets {CONSUMPTION, SHARE_CONSUMPTION}. The ROLLOVER bucket grants credits rather than consuming them, and STORAGE, STORAGE_ADJUST, OVERAGE, REPLICATION, PAYOUT and PAYOUT_ADJUST rows are dollar-denominated, so none of them move used_pct."
    constants:
      NOTIFY_PCT: 50.0
      SUSPEND_PCT: 100.0
      BUCKET_SET: "[CONSUMPTION, SHARE_CONSUMPTION]"
      WINDOW_LOWER_BOUND: exclusive
      WINDOW_UPPER_BOUND: inclusive
    precision: "percent to 6 decimal places, round_half_up, compared against the thresholds AFTER rounding"
    variants:
      - name: ROUND_FIRST
        when: "The monitor sweep and every monitor read endpoint; the persisted monitor_state is decided by this comparison."
        difference: "Rounds used_pct to 6 decimals before comparing, so interval_consumption_credits 999.999999 against credit_quota 1000 yields used_pct 99.999999 and does NOT suspend."
      - name: ROUND_LAST
        when: "Reserved for an unrounded reporting mode; no endpoint in v1 selects it."
        difference: "Would compare the unrounded ratio, on which the same 999.999999 input would still not cross 100.0 but a value of 999.9999999 would; no request field selects this mode, so ROUND_FIRST is the only observable behaviour."
  - name: account_ledger_reconciliation
    trigger: "Every AccountLedgerEntry posting"
    algorithm: aggregation
    formula: |
      posted_consumption_credits_reconciled = ROUND_6(SUM(ledger.amount_credits
                                              WHERE ledger.account_id == account.id
                                              AND ledger.bucket IN {CONSUMPTION, SHARE_CONSUMPTION}))
      posted_storage_dollars_reconciled     = ROUND_2(SUM(ledger.amount_usd
                                              WHERE ledger.account_id == account.id
                                              AND ledger.bucket IN {STORAGE, STORAGE_ADJUST}))
      account_dollars_balance               = ROUND_2(SUM(ledger.amount_usd
                                              WHERE ledger.account_id == account.id
                                              AND ledger.bucket IN {STORAGE, STORAGE_ADJUST, OVERAGE, REPLICATION, PAYOUT, PAYOUT_ADJUST}))
    input_set: "Every AccountLedgerEntry row for the account, including rows posted by cascaded transitions. A REVERSED CreditDrawdown contributes a negative CONSUMPTION row and ROLLOVER rows are excluded from the credit figure; neither exclusion is optional."
    constants:
      CREDIT_BUCKETS: "[CONSUMPTION, SHARE_CONSUMPTION]"
      STORAGE_BUCKETS: "[STORAGE, STORAGE_ADJUST]"
      DOLLAR_BUCKETS: "[STORAGE, STORAGE_ADJUST, OVERAGE, REPLICATION, PAYOUT, PAYOUT_ADJUST]"
    precision: "credits to 6 decimal places; dollars to 2 decimal places; each bucket set summed independently before rounding"
    variants:
      - name: CREDIT_DENOMINATED
        when: "Read through Account.posted_consumption_credits_reconciled and the monitor sweep."
        difference: "Sums only the three credit-denominated buckets, so a replication refresh that posts a REPLICATION row with amount_usd 33.41 and amount_credits 0 leaves this figure exactly unchanged."
      - name: DOLLAR_DENOMINATED
        when: "Read through Account.posted_storage_dollars_reconciled and the account billing read endpoint."
        difference: "Sums only the two storage buckets, so a warehouse session close that posts a CONSUMPTION row moves the credit figure but leaves the dollar figure exactly unchanged — the two reconcilers must stay independent."
  - name: account_posture_derivation
    trigger: "Every AccountLedgerEntry posting, every ResourceMonitor crossing and POST /resource-monitors/{id}/reset"
    algorithm: constraint_propagation
    formula: |
      DRAINING   if EXISTS ResourceMonitor(account_id == account.id AND monitor_state == SUSPENDED)
      RESTRICTED if NOT DRAINING
                 AND EXISTS CreditDrawdown(ACTIVE, bound to a contract of this account)
                     with MAX(used_pct over monitors of the account) >= 50.0
      OPEN       otherwise
    input_set: "Evaluated against every ResourceMonitor bound to the account and every ACTIVE CreditDrawdown bound to one of its contracts; a monitor whose interval was just reset contributes used_pct 0 and therefore cannot hold the account in RESTRICTED."
    constants:
      POSTURE_PRECEDENCE: "[DRAINING, RESTRICTED, OPEN]"
    precision: "integer percent comparison; no rounding"
    variants:
      - name: MONITOR_DRIVEN
        when: "At least one ResourceMonitor with monitor_state SUSPENDED exists for the account."
        difference: "The account becomes DRAINING, which is what forces every RUNNING warehouse into DRAINING and makes a resume attempt fail into SUSPEND_FAILED."
      - name: THRESHOLD_DRIVEN
        when: "No monitor is suspended but the account's maximum used_pct is at or above 50.0."
        difference: "The account becomes RESTRICTED, which still admits resume and drawdown but is the state the monitor notification edge reports; DRAINING outranks RESTRICTED whenever both conditions hold."