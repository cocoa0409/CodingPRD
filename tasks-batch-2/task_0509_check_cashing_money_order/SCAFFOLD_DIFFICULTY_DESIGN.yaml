  # =========================================================================
  # RULE 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_drawer_expected_cash
        grounds:
          - state_machines.Transaction.lifecycle_POSTED_to_lifecycle_VOIDED
          - calculations.drawer_expected_cash
          - entities.CashDrawer.fields.expected_cash_cents
        distinguishing_aspect: |
          Conserved quantity = CashDrawer.expected_cash_cents. Forward action POST /transactions (MONEY_ORDER
          face=50000 -> expected 1050349) paired with its compensating POST /transactions/{id}/void MUST
          restore expected_cash_cents to the exact pre-post value 1000000 (opening_float). Invariant:
          expected_cash_cents == opening_float_cents when no POSTED txns remain.
        test_recipe:
          setup:
            - "A VERIFIED customer; an OPEN drawer with opening_float_cents=1000000 and no other transactions."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cole Cash", id_type: "DRIVERS_LICENSE", id_number: "DL-17", date_of_birth: "1989-09-19" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /cash-drawers"
              payload: { store_code: "S17", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "MONEY_ORDER", face_amount_cents: 50000, payee_name: "Acme" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "before void: CashDrawer.${drawer_id}.expected_cash_cents == 1050349"
            - "after void: CashDrawer.${drawer_id}.expected_cash_cents == 1000000"

      - name: void_conserves_customer_velocity_counters
        grounds:
          - state_machines.Transaction.lifecycle_POSTED_to_lifecycle_VOIDED
          - calculations.velocity_window
          - entities.Customer.fields.daily_transaction_count
          - entities.Customer.fields.daily_cashed_amount_cents
        distinguishing_aspect: |
          Conserved quantity = Customer velocity counters (daily_transaction_count + daily_cashed_amount_cents),
          DIFFERENT from drawer cash. Forward POST /transactions (CHECK_CASH face=100000 -> count 1,
          cashed 100000) paired with its compensating void MUST restore BOTH counters to 0. Invariant:
          daily_transaction_count == 0 AND daily_cashed_amount_cents == 0 when the only posting is voided.
        test_recipe:
          setup:
            - "A VERIFIED customer; GOVT schedule; an OPEN drawer; a single POSTED CHECK_CASH face=100000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Vee Counter", id_type: "PASSPORT", id_number: "P-18", date_of_birth: "1994-04-24" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S18", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
