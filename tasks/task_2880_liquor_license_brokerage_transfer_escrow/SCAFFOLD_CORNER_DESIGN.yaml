        distinguishing_aspect: "WITHDRAWN is terminal for Listing, so a later activate is refused with 409 ERR_ALREADY_TERMINAL - priority 34, not the ERR_INVALID_LISTING_STATE that priority 32 returns for a non-terminal wrong state."
