              as: CoopAdmin
              captures: { f1_status: $.data.vetting_status }
          assert:
            - "Member.${f1_id}.vetting_status == SUSPENDED after the second suspend (cycle re-entered)"
            - "After reinstate, Member.${f1_id}.suspension_reason was null and vetting_status was VETTED"
            - "Member.${f1_id}.credit_balance_hours == 10.00 and reliability_score == 50 throughout the cycle (suspend/reinstate carry no fiscal or score side effects)"

