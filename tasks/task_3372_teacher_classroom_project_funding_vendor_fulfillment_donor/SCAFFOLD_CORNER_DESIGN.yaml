      - name: second_live_project_returns_active_project_exists
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors.ERR_ACTIVE_PROJECT_EXISTS
        distinguishing_aspect: "A verified teacher holding a DRAFT project cannot open a second one; the pipeline gate ERR_ACTIVE_PROJECT_EXISTS fires regardless of the second project's content."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Verified teacher with one DRAFT project."
