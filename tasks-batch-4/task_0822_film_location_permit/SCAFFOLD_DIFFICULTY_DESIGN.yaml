            - "RoadClosureBooking.${b1_id}.status == RELEASED (hop 2)"
            - "RoadClosureBooking.${b2_id}.status == RELEASED (hop 2)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_state_beats_fiscal
        grounds:
          - validations[priority=40]
          - validations[priority=60]
          - errors[ERR_REVIEWS_INCOMPLETE]
          - errors[ERR_FEE_UNPAID]
        distinguishing_aspect: "state (ERR_REVIEWS_INCOMPLETE, priority 40) vs business_fiscal (ERR_FEE_UNPAID, priority 60): with the review PENDING and no fee paid, issue returns the state error, not the fiscal one."
        test_recipe:
          setup:
            - "Company + POLICE(ALL) dept; clock 2026-05-01."
            - "Application UNDER_REVIEW with a VERIFIED COI but the single review still PENDING and no permit fee paid; version captured for a valid OCC token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "P5a", contact_email: "5a@x.test", primary_contact: "D" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "P5a", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 P5a", geo_zone: "Z9", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { v1: $.data.version }
            - call: "POST /applications/${app_id}/insurance-certificates"
              payload: { policy_number: "POL-5a", coverage_amount_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_application_version: "${v1}" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /insurance-certificates/${coi_id}/verify"
              payload: { decision: "VERIFY" }
              as: FilmOfficeCoordinator
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: FilmOfficeCoordinator
              captures: { v_issue: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${v_issue}" }
              as: FilmOfficeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "issue is rejected with HTTP 409 and error_id == ERR_REVIEWS_INCOMPLETE"
            - "error_id is NOT ERR_FEE_UNPAID even though the permit fee is also unpaid (state priority 40 < fiscal priority 60)"

      - name: rider_safety_beats_temporal
        grounds:
          - validations[priority=50]
          - validations[priority=55]
          - errors[ERR_AVIATION_COVERAGE_MISSING]
          - errors[ERR_FLIGHT_WINDOW_OUTSIDE_SHOOT]
        distinguishing_aspect: "business_safety (ERR_AVIATION_COVERAGE_MISSING, priority 50) vs business_temporal (ERR_FLIGHT_WINDOW_OUTSIDE_SHOOT, priority 55): a DRONE rider with no aviation COI AND a flight window outside the shoot returns the safety error — a different category pair than issue_state_beats_fiscal."
        test_recipe:
          setup:
            - "Company; clock 2026-05-01. A DRAFT application with shoot window 2026-06-01T08:00..18:00 and NO verified aviation COI."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "P5b", contact_email: "5b@x.test", primary_contact: "E" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "P5b", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
