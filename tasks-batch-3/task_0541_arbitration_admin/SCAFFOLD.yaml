# =============================================================================
# PRD Benchmark Seed Tables — task_0541_arbitration_admin (Expert)
# =============================================================================

scenario: |
  Mediation & Arbitration Case Administration (AAA/JAMS style): case filing & fee tier,
  arbitrator/mediator selection & disclosure, conflict-check & strike list, hearing
  scheduling & exchange, deposit/retainer against neutral fees, award/settlement issuance,
  appeal/vacatur, panel roster management

domain_name: arbitration-admin
# Flat topology: many peer top-level collections. Empty prefix ("/") keeps every
# collection at the root so the FK reverse-reachability GETs resolve uniformly.
api_prefix: "/"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation      # neutral selection via strike/rank + quorum-style appointment
  secondary_archetype: compliance_audit           # disclosure / conflict-check / vacatur gating
  complexity_layers:
    - optimistic_concurrency                       # OCC on Case.version for list regeneration + fee posting
    - cascading_side_effects                       # appoint & vacatur propagate across 3 entities
    - dual_variant_calculation                     # provisional-vs-final fee; estimated-vs-actual neutral comp
    - selector_policy                              # server auto-selects appointed neutral from ranked pool
    - temporal_windowing                           # hearing overlap + neutral buffer + notice window

  entity_topology: flat                            # peer entities linked by FK; no nested ownership URLs
  state_machine_shape: cyclic                      # Case & Award both loop back on vacatur
  relationship_patterns:
    - one_to_many                                  # Case -> Party/Candidate/Hearing/...
    - many_to_many                                 # Ranking is the Party x Candidate junction
    - cross_aggregate                              # Candidate references Neutral; Hearing gated on Case posture
  role_model: peer_roles                           # CaseAdministrator / Party / Neutral own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: case_type, type: enum, source: input, description: "ARBITRATION | MEDIATION", constraints: "one of {ARBITRATION, MEDIATION}" }
      - { name: title, type: string, source: input, description: "Case caption" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Amount in controversy at filing, integer cents; >= 0" }
      - { name: panel_size, type: integer, source: input, description: "Number of neutrals; 1 or 3", default: 1, constraints: "1 or 3; MEDIATION must be 1" }
      - { name: strikes_per_party, type: integer, source: input, description: "Strike allowance granted to each party against the candidate list", default: 2, constraints: ">= 0" }
      - { name: fee_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | TIER_4 derived from claim_amount_cents (see calc case_fee_tier)" }
      - { name: filing_fee_cents, type: integer, source: computed, description: "Provisional administrative fee computed from claim_amount_cents at filing (see calc filing_fee)" }
      - { name: final_admin_fee_cents, type: integer, source: computed, description: "Final administrative fee recomputed from award_amount_cents at award issuance (see calc final_admin_fee); 0 until an Award is ISSUED" }
      - { name: appointed_neutral_id, type: string, source: computed, description: "Neutral id appointed to this case, set by the appoint selector; null until APPOINTED. Plain reference, not an owned FK." }
      - { name: paid_deposit_cents, type: integer, source: computed, description: "Sum of Deposit.amount_cents WHERE status=PAID for this case" }
      - { name: posted_fee_cents, type: integer, source: computed, description: "Sum of FeeCharge.amount_cents WHERE status=POSTED for this case" }
      - { name: deposit_balance_cents, type: integer, source: computed, description: "= paid_deposit_cents - posted_fee_cents - (final_admin_fee_cents if status in {AWARD_ISSUED, CLOSED} else 0) (see calc deposit_balance)" }
      - { name: estimated_neutral_fee_cents, type: integer, source: computed, description: "Projected neutral compensation over SCHEDULED hearings (see calc neutral_estimated_comp)" }
      - { name: actual_neutral_fee_cents, type: integer, source: computed, description: "= posted_fee_cents; realized neutral compensation from POSTED FeeCharges (see calc neutral_actual_comp)" }
      - { name: status, type: enum, source: system, description: "FILED | SELECTION | APPOINTED | HEARING | AWARD_ISSUED | CLOSED | WITHDRAWN", default: "FILED" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: role, type: enum, source: input, description: "CLAIMANT | RESPONDENT" }
      - { name: display_name, type: string, source: input, description: "Party name" }
      - { name: share_pct, type: integer, source: input, description: "Whole-percent share of neutral fees allocated to this party; parties on a case should sum to 100", constraints: "0..100 integer" }
      - { name: strikes_used, type: integer, source: computed, description: "Count of Ranking rows by this party with action=STRIKE and status=ACTIVE" }
      - { name: strikes_remaining, type: integer, source: computed, description: "= Case.strikes_per_party - strikes_used" }
      - { name: allocated_fee_share_cents, type: integer, source: computed, description: "This party's allocated portion of Case.posted_fee_cents (see calc party_fee_allocation)" }

  - name: Neutral
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Neutral (arbitrator/mediator) name" }
      - { name: neutral_type, type: enum, source: input, description: "ARBITRATOR | MEDIATOR | BOTH" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Billing rate per hour in cents; > 0" }
      - { name: roster_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED", default: "ACTIVE" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: neutral_id, type: string, source: input, description: "FK -> Neutral.id" }
      - { name: disclosure_text, type: string, source: input, description: "Free-text disclosure supplied by the neutral on the disclose action; null until DISCLOSED" }
      - { name: has_conflict, type: boolean, source: input, description: "Neutral-declared conflict flag supplied on the disclose action", default: false }
      - { name: aggregate_rank_score, type: integer, source: computed, description: "Sum of Ranking.rank_value (preference points) over ACTIVE RANK rows on this candidate; higher is more preferred; 0 when none" }
      - { name: is_struck, type: boolean, source: computed, description: "True when any ACTIVE Ranking with action=STRIKE targets this candidate" }
      - { name: status, type: enum, source: system, description: "PROPOSED | DISCLOSED | CLEARED | OBJECTED | DISQUALIFIED | APPOINTED | NOT_SELECTED", default: "PROPOSED" }

  - name: Ranking
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: party_id, type: string, source: input, description: "FK -> Party.id" }
      - { name: action, type: enum, source: input, description: "STRIKE | RANK" }
      - { name: rank_value, type: integer, source: input, description: "Preference points supplied when action=RANK (HIGHER = more preferred); ignored/null when action=STRIKE", constraints: ">= 1 when action=RANK" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN", default: "ACTIVE" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: hearing_type, type: enum, source: input, description: "PREHEARING | EVIDENTIARY | MEDIATION_SESSION" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (ISO 8601 UTC); half-open [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (ISO 8601 UTC); must be strictly after start_at" }
      - { name: location, type: string, source: input, description: "Venue label" }
      - { name: duration_hours, type: number, source: computed, description: "= (end_at - start_at) in hours, used by neutral compensation estimate" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED", default: "SCHEDULED" }

  - name: Exchange
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: exchange_type, type: enum, source: input, description: "EXHIBITS | WITNESS_LIST | BRIEFS" }
      - { name: due_at, type: datetime, source: input, description: "Submission deadline (ISO 8601 UTC)" }
      - { name: submitted_at, type: datetime, source: computed, description: "Logical-clock timestamp when the submit action ran; null until submitted" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | LATE", default: "PENDING" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: amount_cents, type: integer, source: input, description: "Retainer amount in cents; > 0" }
      - { name: paid_at, type: datetime, source: computed, description: "Logical-clock timestamp when the deposit was paid; null until PAID" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PAID | REFUNDED", default: "REQUESTED" }

  - name: FeeCharge
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: neutral_id, type: string, source: input, description: "FK -> Neutral.id; must equal Case.appointed_neutral_id" }
      - { name: hours, type: number, source: input, description: "Logged neutral hours for this charge; > 0" }
      - { name: amount_cents, type: integer, source: computed, description: "= round_half_up(hours * Neutral.hourly_rate_cents) (see calc neutral_actual_comp)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", default: "POSTED" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: award_type, type: enum, source: input, description: "MONETARY | SETTLEMENT | DISMISSAL" }
      - { name: award_amount_cents, type: integer, source: input, description: "Awarded amount in cents; 0 for DISMISSAL; >= 0", default: 0 }
      - { name: issued_at, type: datetime, source: computed, description: "Logical-clock timestamp when the award moved to ISSUED; null until ISSUED; anchors the appeal window" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | FINAL | VACATED", default: "DRAFT" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id" }
      - { name: ground, type: enum, source: input, description: "EVIDENT_PARTIALITY | EXCEEDED_POWERS | PROCEDURAL" }
      - { name: filed_by_party_id, type: string, source: system, description: "Party id (X-User-ID) that filed the appeal; plain reference, not an owned FK" }
      - { name: filed_at, type: datetime, source: computed, description: "Logical-clock timestamp at filing" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | GRANTED | DENIED", default: "FILED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: FILED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: SELECTION
        trigger: "POST /cases/{id}/transition (to_status=SELECTION)"
        actor: CaseAdministrator
        preconditions:
          - "At least one Party with role=CLAIMANT AND at least one Party with role=RESPONDENT exist for the case (else ERR_PARTIES_INCOMPLETE)"
        side_effects: ["increments Case.version by 1"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/transition (to_status=WITHDRAWN)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: ["increments Case.version by 1"]
      - from: SELECTION
        to: WITHDRAWN
        trigger: "POST /cases/{id}/transition (to_status=WITHDRAWN)"
        actor: CaseAdministrator
        preconditions: []
        side_effects:
          - "All Candidates in {PROPOSED, DISCLOSED, CLEARED, OBJECTED} -> NOT_SELECTED"
          - "increments Case.version by 1"
      - from: SELECTION
        to: APPOINTED
        trigger: "POST /cases/{id}/appoint"
        actor: CaseAdministrator
        preconditions:
          - "The appoint selector resolves to exactly one eligible Candidate (status=CLEARED AND is_struck=false); empty eligible set -> ERR_NO_ELIGIBLE_CANDIDATE"
        side_effects:
          - "selected Candidate -> APPOINTED (cascade link 1)"
          - "Case.appointed_neutral_id = selected Candidate.neutral_id"
          - "all other Candidates on the case in {PROPOSED, DISCLOSED, CLEARED, OBJECTED} -> NOT_SELECTED (cascade link 2)"
          - "increments Case.version by 1"
      - from: APPOINTED
        to: HEARING
        trigger: "POST /cases/{id}/transition (to_status=HEARING)"
        actor: CaseAdministrator
        preconditions:
          - "Case.appointed_neutral_id is not null"
        side_effects: ["increments Case.version by 1"]
      - from: HEARING
        to: AWARD_ISSUED
        trigger: "POST /awards/{id}/transition (to_status=ISSUED) — bubble-up from Award"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Case.final_admin_fee_cents from Award.award_amount_cents"
          - "recompute Case.deposit_balance_cents (now debits final_admin_fee_cents)"
          - "increments Case.version by 1"
      - from: AWARD_ISSUED
        to: HEARING
        trigger: "POST /appeals/{id}/transition (to_status=GRANTED) — bubble-up from Award vacatur"
        actor: system
        preconditions: []
        note: "Cyclic revert: vacatur returns the case to the hearing phase for re-arbitration."
        side_effects:
          - "recompute Case.deposit_balance_cents (final_admin_fee no longer debited) (cascade link 3)"
          - "increments Case.version by 1"
      - from: AWARD_ISSUED
        to: CLOSED
        trigger: "POST /awards/{id}/transition (to_status=FINAL) — bubble-up from Award"
        actor: system
        preconditions:
          - "No Appeal on the case's Award in {FILED, UNDER_REVIEW}"
        side_effects: ["increments Case.version by 1"]

  - entity: Candidate
    initial_state: PROPOSED
    terminal_states: [APPOINTED, DISQUALIFIED, NOT_SELECTED]
    transitions:
      - from: PROPOSED
        to: DISCLOSED
        trigger: "POST /candidates/{id}/disclose"
        actor: Neutral
        preconditions:
          - "Acting Neutral owns this candidate: X-User-ID == Candidate.neutral_id"
          - "Neutral.roster_status == ACTIVE (else ERR_NEUTRAL_NOT_ACTIVE) [cross-entity dep Candidate->Neutral]"
        side_effects: ["set disclosure_text and has_conflict from request body"]
      - from: DISCLOSED
        to: CLEARED
        trigger: "POST /candidates/{id}/transition (to_status=CLEARED)"
        actor: CaseAdministrator
        preconditions:
          - "Candidate.has_conflict == false (else ERR_CANDIDATE_HAS_CONFLICT)"
        side_effects: []
      - from: DISCLOSED
        to: OBJECTED
        trigger: "POST /candidates/{id}/transition (to_status=OBJECTED)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: []
      - from: OBJECTED
        to: CLEARED
        trigger: "POST /candidates/{id}/transition (to_status=CLEARED)"
        actor: CaseAdministrator
        preconditions:
          - "Candidate.has_conflict == false (else ERR_CANDIDATE_HAS_CONFLICT)"
        note: "Branch re-join: an objection can be cured back to CLEARED."
        side_effects: []
      - from: OBJECTED
        to: DISQUALIFIED
        trigger: "POST /candidates/{id}/transition (to_status=DISQUALIFIED)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: []
      - from: DISCLOSED
        to: NOT_SELECTED
        trigger: "system cascade from POST /cases/{id}/appoint or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: APPOINTED
        trigger: "system cascade from POST /cases/{id}/appoint (selected candidate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: NOT_SELECTED
        trigger: "system cascade from POST /cases/{id}/appoint (non-selected) or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: NOT_SELECTED
        trigger: "system cascade from POST /cases/{id}/appoint or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: OBJECTED
        to: NOT_SELECTED
        trigger: "system cascade from POST /cases/{id}/appoint or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Ranking
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /rankings/{id}/withdraw"
        actor: Party
        preconditions:
          - "Acting Party owns this ranking: X-User-ID == Ranking.party_id"
        side_effects:
          - "recompute target Candidate.aggregate_rank_score and is_struck"
          - "recompute Party.strikes_used / strikes_remaining (compensating: a withdrawn STRIKE returns the allowance)"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/transition (to_status=HELD)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/transition (to_status=CANCELLED)"
        actor: CaseAdministrator
        preconditions: []
        side_effects:
          - "recompute Case.estimated_neutral_fee_cents (cancelled hearing leaves the SCHEDULED set)"

  - entity: Exchange
    initial_state: PENDING
    terminal_states: [SUBMITTED, LATE]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /exchanges/{id}/submit (logical clock <= due_at)"
        actor: Party
        preconditions: []
        side_effects: ["set submitted_at = logical clock now"]
      - from: PENDING
        to: LATE
        trigger: "POST /exchanges/{id}/submit (logical clock > due_at)"
        actor: Party
        preconditions: []
        note: "Same endpoint; target state is chosen by comparing the logical clock to due_at."
        side_effects: ["set submitted_at = logical clock now"]

  - entity: Deposit
    initial_state: REQUESTED
    terminal_states: [REFUNDED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /deposits/{id}/pay"
        actor: Party
        preconditions: []
        side_effects:
          - "set paid_at = logical clock now"
          - "recompute Case.paid_deposit_cents and Case.deposit_balance_cents"
      - from: PAID
        to: REFUNDED
        trigger: "POST /deposits/{id}/refund"
        actor: CaseAdministrator
        preconditions:
          - "Case.status == CLOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "recompute Case.paid_deposit_cents and Case.deposit_balance_cents"

  - entity: FeeCharge
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /fee-charges/{id}/reverse"
        actor: CaseAdministrator
        preconditions: []
        side_effects:
          - "recompute Case.posted_fee_cents, Case.actual_neutral_fee_cents, Case.deposit_balance_cents (compensating: balance returns to pre-charge value)"
          - "recompute affected Party.allocated_fee_share_cents"

  - entity: Award
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /awards/{id}/transition (to_status=ISSUED)"
        actor: CaseAdministrator
        preconditions:
          - "Case.status == HEARING (else ERR_INVALID_STATE) [cross-entity dep Award->Case]"
        side_effects:
          - "set issued_at = logical clock now"
          - "bubble up: Case HEARING -> AWARD_ISSUED (computes final_admin_fee, debits deposit_balance)"
      - from: ISSUED
        to: FINAL
        trigger: "POST /awards/{id}/transition (to_status=FINAL)"
        actor: CaseAdministrator
        preconditions:
          - "No Appeal on this Award in {FILED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
        side_effects: ["bubble up: Case AWARD_ISSUED -> CLOSED"]
      - from: ISSUED
        to: VACATED
        trigger: "system cascade from POST /appeals/{id}/transition (to_status=GRANTED)"
        actor: system
        preconditions: []
        side_effects: ["bubble up: Case AWARD_ISSUED -> HEARING (cascade link 2)"]
      - from: VACATED
        to: DRAFT
        trigger: "POST /awards/{id}/transition (to_status=DRAFT)"
        actor: CaseAdministrator
        preconditions:
          - "Case.status == HEARING"
        note: "Cyclic re-draft after vacatur so a fresh award can be issued."
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/transition (to_status=UNDER_REVIEW)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/{id}/transition (to_status=GRANTED)"
        actor: CaseAdministrator
        preconditions: []
        side_effects:
          - "linked Award (award_id) ISSUED -> VACATED (cascade link 1)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/transition (to_status=DENIED)"
        actor: CaseAdministrator
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Case.version — CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: candidate-add-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/candidates"
    occ_field: "expected_case_version"
    description: |
      Adding a Candidate to a Case whose version has advanced since the client last
      observed it is rejected. A second sequential add still carrying the stale
      version is refused, capturing the case where the candidate list was legitimately
      regenerated (another candidate added / a strike posted / an appointment made)
      between the client's read and this write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fee-charge-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/fee-charges"
    occ_field: "expected_case_version"
    description: |
      Posting a neutral FeeCharge against a Case whose version has advanced since the
      client last read the deposit balance is rejected. Both charges would otherwise
      post legitimately; the stale-version guard forces the loser to re-read the
      current balance before it double-spends against a superseded view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_fee_tier
    trigger: "POST /cases (filing)"
    algorithm: threshold
    formula: |
      let c = claim_amount_cents
      if c < 1_000_000:                fee_tier = TIER_1
      elif c < 7_500_000:              fee_tier = TIER_2   # 1_000_000 <= c < 7_500_000
      elif c < 50_000_000:             fee_tier = TIER_3   # 7_500_000 <= c < 50_000_000
      else:                            fee_tier = TIER_4   # c >= 50_000_000
    input_set: "single Case, claim_amount_cents"
    constants:
      TIER_2_FLOOR_CENTS: 1000000
      TIER_3_FLOOR_CENTS: 7500000
      TIER_4_FLOOR_CENTS: 50000000
    precision: "integer cents; tier floors are inclusive (>=)"

  - name: filing_fee
    trigger: "POST /cases (filing)"
    algorithm: tiered_pricing
    formula: |
      base = { TIER_1: 75000, TIER_2: 175000, TIER_3: 400000, TIER_4: 700000 }[fee_tier]
      case_type_mult = 1.0 if case_type == ARBITRATION else 0.5   # MEDIATION
      panel_mult     = 1.5 if panel_size == 3 else 1.0
      filing_fee_cents = round_half_up(base * case_type_mult * panel_mult)
    input_set: "single Case: fee_tier, case_type, panel_size"
    constants:
      BASE_TIER_1: 75000
      BASE_TIER_2: 175000
      BASE_TIER_3: 400000
      BASE_TIER_4: 700000
      MEDIATION_MULT: 0.5
      PANEL_3_MULT: 1.5
    precision: "2 inputs multiplied then round_half_up to integer cents (round once, after both multipliers)"
    variants:
      - name: provisional_filing_fee
        when: "at filing; input is claim_amount_cents"
        difference: "tier selected from the amount in controversy claimed"

  - name: final_admin_fee
    trigger: "POST /awards/{id}/transition (to_status=ISSUED)"
    algorithm: tiered_pricing
    formula: |
      # SAME tier table and multipliers as filing_fee, but the tier is selected from
      # the AWARDED amount, not the claimed amount.
      tier = case_fee_tier(award_amount_cents)
      base = { TIER_1: 75000, TIER_2: 175000, TIER_3: 400000, TIER_4: 700000 }[tier]
      case_type_mult = 1.0 if case_type == ARBITRATION else 0.5
      panel_mult     = 1.5 if panel_size == 3 else 1.0
      final_admin_fee_cents = round_half_up(base * case_type_mult * panel_mult)
    input_set: "single Case + its ISSUED Award: award_amount_cents, case_type, panel_size"
    precision: "integer cents; round_half_up after multipliers"
    variants:
      - name: final_vs_provisional
        when: "at award issuance; input is award_amount_cents"
        difference: "identical formula, tier keyed on the awarded amount so the fee diverges from filing_fee_cents whenever the award falls in a different tier than the claim"

  - name: neutral_estimated_comp
    trigger: "POST /cases/{id}/hearings, POST /hearings/{id}/transition (CANCELLED)"
    algorithm: aggregation
    formula: |
      rate = Neutral[Case.appointed_neutral_id].hourly_rate_cents
      hours = sum( (h.end_at - h.start_at) in hours for h in Hearings
                   WHERE h.case_id == Case.id AND h.status == SCHEDULED )
      estimated_neutral_fee_cents = round_half_up(rate * hours)
    input_set: "SCHEDULED hearings of the case; excludes HELD and CANCELLED"
    precision: "hours are exact from the interval; multiply then round_half_up to integer cents"
    variants:
      - name: estimate_at_scheduling
        when: "projection over SCHEDULED hearings before any hours are logged"
        difference: "uses planned interval durations, not logged hours"

  - name: neutral_actual_comp
    trigger: "POST /cases/{id}/fee-charges, POST /fee-charges/{id}/reverse"
    algorithm: aggregation
    formula: |
      # per-charge amount:
      amount_cents = round_half_up(FeeCharge.hours * Neutral[FeeCharge.neutral_id].hourly_rate_cents)
      # case rollup:
      actual_neutral_fee_cents = sum( fc.amount_cents for fc in FeeCharges
                                      WHERE fc.case_id == Case.id AND fc.status == POSTED )
    input_set: "POSTED FeeCharges of the case; excludes REVERSED"
    precision: "each charge rounded independently (round per charge, then sum)"
    variants:
      - name: actual_from_logged_hours
        when: "when a neutral fee is posted from logged hours"
        difference: "uses actually logged hours per charge, diverging from the estimate whenever logged hours differ from planned durations"

  - name: party_fee_allocation
    trigger: "POST /cases/{id}/fee-charges, POST /fee-charges/{id}/reverse"
    algorithm: waterfall_allocation
    formula: |
      total = Case.posted_fee_cents
      parties = Parties WHERE case_id == Case.id, ordered by created_at ASC
      # STEP 1 — floor each party's share (round DOWN per party first):
      base[p] = floor(total * p.share_pct / 100)
      # STEP 2 — distribute the leftover cents one-by-one, earliest party first:
      remainder = total - sum(base[p] for p in parties)
      for p in parties ordered by created_at ASC (take first `remainder` parties):
          base[p] += 1
      allocated_fee_share_cents[p] = base[p]
    input_set: "all Parties of the case; total = posted (non-reversed) fees"
    precision: "PINNED ORDER: floor per party THEN distribute remainder cents by created_at ASC. (Divide-then-round-each would drift; this order is authoritative.)"

  - name: deposit_balance
    trigger: "deposit pay/refund, fee-charge post/reverse, award issue/finalize, vacatur"
    algorithm: aggregation
    formula: |
      paid   = sum(d.amount_cents for d in Deposits WHERE case_id==Case.id AND status==PAID)
      posted = sum(fc.amount_cents for fc in FeeCharges WHERE case_id==Case.id AND status==POSTED)
      admin  = Case.final_admin_fee_cents if Case.status in {AWARD_ISSUED, CLOSED} else 0
      deposit_balance_cents = paid - posted - admin
    input_set: "PAID deposits and POSTED fee charges of the case, plus admin fee when an award stands"
    precision: "integer cents"

  - name: appoint_selector
    trigger: "POST /cases/{id}/appoint"
    algorithm: weighted_scoring
    formula: |
      eligible = Candidates WHERE case_id==Case.id AND status==CLEARED AND is_struck==false
      if eligible is empty: raise ERR_NO_ELIGIBLE_CANDIDATE
      # RANK: HIGHEST aggregate_rank_score wins (most preference points across parties)
      # TIE-BREAK: earliest created_at ASC (a fully unranked pool ties at 0 -> earliest wins)
      winner = max(eligible, key=(aggregate_rank_score DESC, created_at ASC))
    input_set: "CLEARED, non-struck candidates of the case"
    precision: "integer scores; deterministic sort key (aggregate_rank_score DESC, created_at ASC); id is never used as a tie-break"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the operation; entity_backed roles must own the target resource (party_id / neutral.id ownership)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path ids and body FK references resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: validation
    check: "Required fields present, types/enums valid, pagination in range, end_at > start_at, panel_size in {1,3}, MEDIATION => panel_size 1"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 4.5
    category: validation
    check: "Enum member out of its declared set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "endpoints with enum inputs"
  - priority: 5
    category: concurrency
    check: "expected_case_version equals current Case.version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/candidates, POST /cases/{id}/fee-charges"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition / action endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: neutral roster ACTIVE for disclosure; no unresolved conflict before CLEARED; candidate neutral_type compatible with case_type"
    error_id: "ERR_NEUTRAL_NOT_ACTIVE / ERR_CANDIDATE_HAS_CONFLICT / ERR_NEUTRAL_TYPE_MISMATCH"
    http_status: 409
    applies_to: "POST /candidates/{id}/disclose, POST /candidates/{id}/transition, POST /cases/{id}/candidates"
  - priority: 8
    category: business_temporal
    check: "Time-window gates: hearing start_at >= clock now + HEARING_NOTICE_DAYS (7); appeal filed within APPEAL_WINDOW_DAYS (30) of Award.issued_at. Constants: HEARING_NOTICE_DAYS=7, APPEAL_WINDOW_DAYS=30, NEUTRAL_BUFFER_MINUTES=30."
    error_id: "ERR_HEARING_NOTICE_TOO_SHORT / ERR_APPEAL_WINDOW_CLOSED"
    http_status: 422
    applies_to: "POST /cases/{id}/hearings, POST /appeals"
  - priority: 9
    category: business_constraint
    check: "Structural gates: parties complete; case-hearing interval overlap; neutral buffer; duplicate/over-budget strikes; eligible-candidate presence; single standing award; party belongs to case"
    error_id: "ERR_PARTIES_INCOMPLETE / ERR_HEARING_OVERLAP / ERR_NEUTRAL_UNAVAILABLE / ERR_DUPLICATE_RANKING / ERR_STRIKE_BUDGET_EXCEEDED / ERR_NO_ELIGIBLE_CANDIDATE / ERR_AWARD_EXISTS / ERR_NOT_CASE_PARTY"
    http_status: 409
    applies_to: "selection, ranking, hearing, appoint, award endpoints"
  - priority: 10
    category: business_fiscal
    check: "A posted neutral fee charge must not exceed the current deposit_balance_cents"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 402
    applies_to: "POST /cases/{id}/fee-charges"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Case ----
  - method: POST
    path: "/cases"
    description: "File a new case; computes fee_tier and provisional filing_fee_cents"
    roles: [CaseAdministrator]
    code: 201
    input: [case_type, title, claim_amount_cents, panel_size?, strikes_per_party?]
    output: Case
    side_effects: ["status=FILED", "compute fee_tier, filing_fee_cents", "deposit_balance_cents=0"]
  - method: GET
    path: "/cases/{id}"
    description: "Get a case"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases (paginated); optional status filter"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/transition"
    description: "Administrator-driven case status change (SELECTION, WITHDRAWN, HEARING)"
    roles: [CaseAdministrator]
    code: 200
    input: [to_status]
    output: Case
    side_effects: ["per Case state machine, including candidate NOT_SELECTED cascade on WITHDRAWN"]
  - method: POST
    path: "/cases/{id}/appoint"
    description: "Auto-select and appoint the top-ranked eligible candidate (selector); OCC on case version"
    roles: [CaseAdministrator]
    code: 200
    input: [expected_case_version]
    output: Case
    side_effects:
      - "appoint_selector picks winner; winner Candidate -> APPOINTED"
      - "Case SELECTION -> APPOINTED; set appointed_neutral_id"
      - "sibling candidates -> NOT_SELECTED"
      - "increments Case.version by 1"

  # ---- Party ----
  - method: POST
    path: "/parties"
    description: "Add a party to a case"
    roles: [CaseAdministrator]
    code: 201
    input: [case_id, role, display_name, share_pct]
    output: Party
    side_effects: ["strikes_used=0", "strikes_remaining=Case.strikes_per_party"]
  - method: GET
    path: "/cases/{id}/parties"
    description: "List parties of a case (FK reverse: Party.case_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Party[]
    side_effects: []

  # ---- Neutral (roster) ----
  - method: POST
    path: "/neutrals"
    description: "Add a neutral to the panel roster"
    roles: [CaseAdministrator]
    code: 201
    input: [full_name, neutral_type, hourly_rate_cents]
    output: Neutral
    side_effects: ["roster_status=ACTIVE"]
  - method: GET
    path: "/neutrals/{id}"
    description: "Get a neutral"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Neutral
    side_effects: []
  - method: GET
    path: "/neutrals"
    description: "List roster (paginated); optional roster_status filter"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["roster_status?", "limit?", "offset?"]
    output: Neutral[]
    side_effects: []
  - method: POST
    path: "/neutrals/{id}/transition"
    description: "Roster management: change roster_status (ACTIVE/SUSPENDED/RETIRED)"
    roles: [CaseAdministrator]
    code: 200
    input: [roster_status]
    output: Neutral
    side_effects: []

  # ---- Candidate ----
  - method: POST
    path: "/cases/{id}/candidates"
    description: "Add a neutral to the case's candidate list (OCC on case version)"
    roles: [CaseAdministrator]
    code: 201
    input: [neutral_id, expected_case_version]
    output: Candidate
    side_effects: ["status=PROPOSED", "increments Case.version by 1"]
  - method: GET
    path: "/cases/{id}/candidates"
    description: "List candidates of a case (FK reverse: Candidate.case_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Candidate[]
    side_effects: []
  - method: GET
    path: "/neutrals/{id}/candidates"
    description: "List candidacies of a neutral (FK reverse: Candidate.neutral_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Candidate[]
    side_effects: []
  - method: POST
    path: "/candidates/{id}/disclose"
    description: "Neutral submits disclosure (PROPOSED -> DISCLOSED)"
    roles: [Neutral]
    code: 200
    input: [disclosure_text, has_conflict]
    output: Candidate
    side_effects: ["set disclosure_text, has_conflict"]
  - method: POST
    path: "/candidates/{id}/transition"
    description: "Administrator clears/objects/disqualifies a candidate"
    roles: [CaseAdministrator]
    code: 200
    input: [to_status]
    output: Candidate
    side_effects: ["per Candidate state machine"]

  # ---- Ranking (strike list) ----
  - method: POST
    path: "/rankings"
    description: "Party strikes or ranks a candidate"
    roles: [Party]
    code: 201
    input: [candidate_id, party_id, action, rank_value?]
    output: Ranking
    side_effects: ["recompute Candidate.aggregate_rank_score / is_struck", "recompute Party.strikes_used / strikes_remaining"]
  - method: GET
    path: "/rankings/{id}"
    description: "Get a ranking"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Ranking
    side_effects: []
  - method: GET
    path: "/rankings"
    description: "List rankings (FK reverse: Ranking.candidate_id and Ranking.party_id); paginated"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["candidate_id?", "party_id?", "limit?", "offset?"]
    output: Ranking[]
    side_effects: []
  - method: POST
    path: "/rankings/{id}/withdraw"
    description: "Party withdraws its strike/rank (compensating; returns strike allowance)"
    roles: [Party]
    code: 200
    input: []
    output: Ranking
    side_effects: ["status=WITHDRAWN", "recompute Candidate and Party derived fields"]

  # ---- Hearing ----
  - method: POST
    path: "/cases/{id}/hearings"
    description: "Schedule a hearing (notice + case-overlap + neutral-buffer checks)"
    roles: [CaseAdministrator]
    code: 201
    input: [hearing_type, start_at, end_at, location]
    output: Hearing
    side_effects: ["status=SCHEDULED", "compute duration_hours", "recompute Case.estimated_neutral_fee_cents"]
  - method: GET
    path: "/cases/{id}/hearings"
    description: "List hearings of a case (FK reverse: Hearing.case_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/transition"
    description: "Mark a hearing HELD or CANCELLED"
    roles: [CaseAdministrator]
    code: 200
    input: [to_status]
    output: Hearing
    side_effects: ["per Hearing state machine; CANCELLED recomputes estimate"]

  # ---- Exchange ----
  - method: POST
    path: "/cases/{id}/exchanges"
    description: "Create a document-exchange deadline"
    roles: [CaseAdministrator]
    code: 201
    input: [exchange_type, due_at]
    output: Exchange
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/cases/{id}/exchanges"
    description: "List exchanges of a case (FK reverse: Exchange.case_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Exchange[]
    side_effects: []
  - method: POST
    path: "/exchanges/{id}/submit"
    description: "Submit an exchange; SUBMITTED if clock <= due_at else LATE"
    roles: [Party, CaseAdministrator]
    code: 200
    input: []
    output: Exchange
    side_effects: ["set submitted_at", "status=SUBMITTED or LATE by clock vs due_at"]

  # ---- Deposit ----
  - method: POST
    path: "/deposits"
    description: "Request a retainer deposit for a case"
    roles: [CaseAdministrator]
    code: 201
    input: [case_id, amount_cents]
    output: Deposit
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/deposits/{id}"
    description: "Get a deposit"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: GET
    path: "/deposits"
    description: "List deposits (FK reverse: Deposit.case_id); paginated"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: POST
    path: "/deposits/{id}/pay"
    description: "Pay a requested deposit (credits case deposit_balance)"
    roles: [Party]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status=PAID", "set paid_at", "recompute Case.paid_deposit_cents / deposit_balance_cents"]
  - method: POST
    path: "/deposits/{id}/refund"
    description: "Refund a paid deposit (only after case CLOSED)"
    roles: [CaseAdministrator]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status=REFUNDED", "recompute Case.paid_deposit_cents / deposit_balance_cents"]

  # ---- FeeCharge ----
  - method: POST
    path: "/cases/{id}/fee-charges"
    description: "Post a neutral fee charge against the deposit (OCC on case version; fiscal gate)"
    roles: [CaseAdministrator]
    code: 201
    input: [neutral_id, hours, expected_case_version]
    output: FeeCharge
    side_effects:
      - "status=POSTED"
      - "compute amount_cents = round_half_up(hours * neutral.hourly_rate_cents)"
      - "recompute Case.posted_fee_cents / actual_neutral_fee_cents / deposit_balance_cents"
      - "recompute Party.allocated_fee_share_cents"
      - "increments Case.version by 1"
  - method: GET
    path: "/fee-charges/{id}"
    description: "Get a fee charge"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: FeeCharge
    side_effects: []
  - method: GET
    path: "/fee-charges"
    description: "List fee charges (FK reverse: FeeCharge.case_id and FeeCharge.neutral_id); paginated"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["case_id?", "neutral_id?", "limit?", "offset?"]
    output: FeeCharge[]
    side_effects: []
  - method: POST
    path: "/fee-charges/{id}/reverse"
    description: "Reverse a posted fee charge (compensating; restores deposit_balance)"
    roles: [CaseAdministrator]
    code: 200
    input: []
    output: FeeCharge
    side_effects: ["status=REVERSED", "recompute Case.posted_fee_cents / deposit_balance_cents", "recompute Party.allocated_fee_share_cents"]

  # ---- Award ----
  - method: POST
    path: "/cases/{id}/awards"
    description: "Draft an award/settlement for a case in HEARING"
    roles: [CaseAdministrator]
    code: 201
    input: [award_type, award_amount_cents?]
    output: Award
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/cases/{id}/awards"
    description: "List awards of a case (FK reverse: Award.case_id)"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Award[]
    side_effects: []
  - method: POST
    path: "/awards/{id}/transition"
    description: "Issue / finalize / re-draft an award (ISSUED bubbles Case to AWARD_ISSUED)"
    roles: [CaseAdministrator]
    code: 200
    input: [to_status]
    output: Award
    side_effects: ["per Award state machine, including Case bubble-up and final_admin_fee computation"]

  # ---- Appeal ----
  - method: POST
    path: "/appeals"
    description: "File an appeal/vacatur petition against an ISSUED award (within appeal window)"
    roles: [Party]
    code: 201
    input: [award_id, ground]
    output: Appeal
    side_effects: ["status=FILED", "set filed_by_party_id = X-User-ID", "set filed_at"]
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals (FK reverse: Appeal.award_id); paginated"
    roles: [CaseAdministrator, Party, Neutral]
    code: 200
    input: ["award_id?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/transition"
    description: "Advance an appeal (UNDER_REVIEW / GRANTED / DENIED); GRANTED vacates the award"
    roles: [CaseAdministrator]
    code: 200
    input: [to_status]
    output: Appeal
    side_effects: ["per Appeal state machine; GRANTED cascades Award VACATED -> Case HEARING -> deposit_balance recompute"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. All notice/appeal-window/due-date rules read this clock."
    roles: [CaseAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to the given instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity-backed role does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, pagination out of range, end_at<=start_at, panel_size not in {1,3}, MEDIATION with panel_size!=1" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum value outside its declared set" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition/action" }
  - { id: ERR_PARTIES_INCOMPLETE, http: 409, condition: "Opening SELECTION without at least one CLAIMANT and one RESPONDENT party" }
  - { id: ERR_NEUTRAL_NOT_ACTIVE, http: 409, condition: "Disclosure attempted while the neutral's roster_status is not ACTIVE" }
  - { id: ERR_NEUTRAL_TYPE_MISMATCH, http: 409, condition: "Candidate neutral_type incompatible with case_type (ARBITRATION needs ARBITRATOR/BOTH; MEDIATION needs MEDIATOR/BOTH)" }
  - { id: ERR_CANDIDATE_HAS_CONFLICT, http: 409, condition: "Attempt to CLEAR a candidate whose has_conflict is true" }
  - { id: ERR_NO_ELIGIBLE_CANDIDATE, http: 422, condition: "appoint selector's eligible set (CLEARED, non-struck) is empty" }
  - { id: ERR_STRIKE_BUDGET_EXCEEDED, http: 409, condition: "Party strike would exceed Case.strikes_per_party allowance" }
  - { id: ERR_DUPLICATE_RANKING, http: 409, condition: "Party already has an ACTIVE ranking on this candidate" }
  - { id: ERR_NOT_CASE_PARTY, http: 409, condition: "Ranking party_id does not belong to the candidate's case" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 402, condition: "Posted fee charge amount exceeds current deposit_balance_cents" }
  - { id: ERR_HEARING_END_BEFORE_START, http: 400, condition: "Hearing end_at is not strictly after start_at" }
  - { id: ERR_HEARING_NOTICE_TOO_SHORT, http: 422, condition: "Hearing start_at is earlier than clock now + HEARING_NOTICE_DAYS" }
  - { id: ERR_HEARING_OVERLAP, http: 409, condition: "Hearing interval overlaps another non-cancelled hearing on the same case (half-open)" }
  - { id: ERR_NEUTRAL_UNAVAILABLE, http: 409, condition: "Hearing is within NEUTRAL_BUFFER_MINUTES of another hearing on a case sharing the same appointed neutral" }
  - { id: ERR_AWARD_EXISTS, http: 409, condition: "Case already has an Award not in {VACATED} when drafting a new one" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed after Award.issued_at + APPEAL_WINDOW_DAYS" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit or offset outside allowed bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CaseAdministrator
    description: "AAA/JAMS case administrator; operates the case lifecycle and the panel roster."
    identity: opaque
    exclusive_operations:
      - "POST /cases (file case)"
      - "POST /cases/{id}/transition"
      - "POST /cases/{id}/appoint"
      - "POST /parties"
      - "POST /neutrals, POST /neutrals/{id}/transition (roster management)"
      - "POST /cases/{id}/candidates"
      - "POST /candidates/{id}/transition"
      - "POST /cases/{id}/hearings, POST /hearings/{id}/transition"
      - "POST /cases/{id}/exchanges"
      - "POST /deposits, POST /deposits/{id}/refund"
      - "POST /cases/{id}/fee-charges, POST /fee-charges/{id}/reverse"
      - "POST /cases/{id}/awards, POST /awards/{id}/transition"
      - "POST /appeals/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
      - "POST /exchanges/{id}/submit (shared with Party)"

  - name: Party
    description: "A claimant or respondent to a case. X-User-ID equals a Party.id."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /rankings, POST /rankings/{id}/withdraw (owns party_id)"
      - "POST /deposits/{id}/pay"
      - "POST /appeals (files as X-User-ID)"
    shared_operations:
      - "All GET reads"
      - "POST /exchanges/{id}/submit (shared with CaseAdministrator)"

  - name: Neutral
    description: "A rostered arbitrator/mediator. X-User-ID equals a Neutral.id."
    identity: "entity_backed:Neutral"
    exclusive_operations:
      - "POST /candidates/{id}/disclose (owns candidate.neutral_id)"
    shared_operations:
      - "All GET reads"
