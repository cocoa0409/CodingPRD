        grounds:
          - calculations.appraisal_reference_value
          - validations.priority_43_ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
          - entities.AppraisalSchedule.fields.effective_to
          - endpoints.POST_tdr_clock_set_current_utc
        distinguishing_aspect: |
          A DIFFERENT metric (an instant on the logical clock, at one-second resolution)
          and a DIFFERENT endpoint (POST /tdr/market-transactions) from instance A's unit
          cap at finalize. The window [effective_from, effective_to) is half-open, so
          2026-08-31T23:59:59Z is inside it and 2026-09-01T00:00:00Z — the effective_to
          instant itself — makes the applicable set EMPTY, which is a rejection rather
          than a fallback to the nearest schedule.
