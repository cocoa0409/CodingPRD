scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: client_created_with_default_margin_floor
        claim_type: defaults
        grounds: ["entities.Client.fields.margin_floor_pct", "endpoints[POST /clients]"]
        distinguishing_aspect: "Omitting margin_floor_pct on POST /clients stores the declared default 20.0, and the response carries outstanding_balance_cents == 0 and paid_to_date_cents == 0."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Default Co" }
              as: AccountManager
              captures: { client_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.margin_floor_pct == 20.0"
            - "Client.${client_id}.outstanding_balance_cents == 0"
            - "Client.${client_id}.paid_to_date_cents == 0"
            - "Client.${client_id}.version == 1"

      - name: guard_created_with_initial_state_and_scores
        claim_type: creation
        grounds:
          - entities.Guard.fields.employment_status
          - entities.Guard.fields.license_status
          - entities.Guard.fields.reliability_score
          - entities.Guard.fields.committed_hours
        distinguishing_aspect: "A newly created Guard starts at employment_status APPLICANT, license_status UNLICENSED, reliability_score 100.0, verified_reliability_score 100.0, committed_hours 0.0 and strike_waiver_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /guards"
              payload: { full_name: "Nia Ford", employee_code: "C-001", pay_rate_cents_per_hour: 2100 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Guard.${guard_id}.employment_status == APPLICANT"
            - "Guard.${guard_id}.license_status == UNLICENSED"
            - "Guard.${guard_id}.reliability_score == 100.0"
            - "Guard.${guard_id}.verified_reliability_score == 100.0"
            - "Guard.${guard_id}.committed_hours == 0.0"
            - "Guard.${guard_id}.strike_waiver_count == 0"

      - name: guard_read_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_GUARD_NOT_FOUND]", "endpoints[GET /guards/{id}]"]
        distinguishing_aspect: "GET /guards/{id} with a syntactically valid but unknown UUID returns 404 ERR_GUARD_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /guards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_GUARD_NOT_FOUND'"

      - name: shift_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]", "endpoints[POST /shifts]"]
        distinguishing_aspect: "POST /shifts without scheduled_end_at is rejected with 422 ERR_VALIDATION and no CoverageShift row is created."
        test_recipe:
          setup: ["A client, site and post exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Req Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Req Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Req Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z" }
              as: Scheduler
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /shifts?post_id=${post_id} returns total_count == 0"

      - name: shift_end_before_start_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]", "entities.CoverageShift.fields.scheduled_end_at"]
        distinguishing_aspect: "POST /shifts with scheduled_end_at <= scheduled_start_at is rejected with 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A client, site and post exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Rev Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Rev Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Rev Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T16:00:00Z", scheduled_end_at: "2026-05-04T08:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"

      - name: duplicate_employee_code_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE_EMPLOYEE_CODE]", "entities.Guard.fields.employee_code"]
        distinguishing_aspect: "A second POST /guards carrying an employee_code already in use is rejected with 409 ERR_DUPLICATE_EMPLOYEE_CODE."
        test_recipe:
          setup: ["Guard with employee_code 'C-777' already exists."]
          setup_api_calls:
            - call: "POST /guards"
              payload: { full_name: "First Holder", employee_code: "C-777", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /guards"
              payload: { full_name: "Second Holder", employee_code: "C-777", pay_rate_cents_per_hour: 2400 }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_EMPLOYEE_CODE'"

      - name: shift_system_fields_ignored_on_create
        claim_type: system_fields
        grounds:
          - entities.CoverageShift.fields.status
          - entities.CoverageShift.fields.bill_rate_cents_per_hour
          - entities.CoverageShift.fields.provisional_billable_cents
        distinguishing_aspect: "POST /shifts ignores any client-supplied status/guard_id/rate: the shift is minted OPEN_UNFILLED with guard_id null, bill_rate snapshotted from the post (4500) and provisional_billable_cents computed as 33750."
        test_recipe:
          setup: ["A post exists at bill_rate 4500 c/h."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Sys Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Sys Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Sys Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id }
          assert:
            - "CoverageShift.${shift_id}.status == OPEN_UNFILLED"
            - "CoverageShift.${shift_id}.guard_id == null"
            - "CoverageShift.${shift_id}.bill_rate_cents_per_hour == 4500"
            - "CoverageShift.${shift_id}.pay_rate_cents_per_hour == null"
            - "CoverageShift.${shift_id}.scheduled_hours == 7.5"
            - "CoverageShift.${shift_id}.provisional_billable_cents == 33750"
            - "CoverageShift.${shift_id}.final_billable_cents == null"
            - "CoverageShift.${shift_id}.version == 1"

      - name: post_default_capacity_and_empty_tour
        claim_type: defaults
        grounds:
          - entities.Post.fields.max_concurrent_guards
          - entities.Post.fields.checkpoint_tag_uids
          - entities.Post.fields.required_cert_codes
          - entities.Post.fields.tour_compliance_floor_pct
        distinguishing_aspect: "Omitting max_concurrent_guards, required_cert_codes, checkpoint_tag_uids and tour_compliance_floor_pct on POST /posts yields 1, [], [] and 80.0 respectively."
        test_recipe:
          setup: ["A client and site exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Def Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Def Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Bare Post", bill_rate_cents_per_hour: 3000 }
              as: AccountManager
              captures: { post_id: $.data.id }
          assert:
            - "Post.${post_id}.max_concurrent_guards == 1"
            - "Post.${post_id}.required_cert_codes == []"
            - "Post.${post_id}.checkpoint_tag_uids == []"
            - "Post.${post_id}.tour_compliance_floor_pct == 80.0"

      - name: site_creation_with_unknown_client_returns_not_found
        claim_type: parent_relationships
        grounds: ["errors[ERR_CLIENT_NOT_FOUND]", "entities.Site.fields.client_id", "validations[priority=4]"]
        distinguishing_aspect: "POST /sites with a client_id that does not resolve returns 404 ERR_CLIENT_NOT_FOUND and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { client_id: "00000000-0000-4000-8000-000000000001", name: "Orphan Site" }
              as: AccountManager
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_CLIENT_NOT_FOUND'"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: clock_in_from_scheduled_without_confirm_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.CoverageShift.CONFIRMED_to_IN_PROGRESS", "errors[ERR_INVALID_STATE]", "validations[priority=7]"]
        distinguishing_aspect: "A SCHEDULED (never CONFIRMED) shift rejects POST /shifts/{id}/clock-in with 409 ERR_INVALID_STATE; actual_clock_in_at stays null."
        test_recipe:
          setup: ["Guard Rio is ACTIVE and LICENSED and is SCHEDULED (not confirmed) on a shift."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Rio Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Rio Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Rio Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Rio Vance", employee_code: "C-010", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-010", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shifts/${shift_id}/clock-in"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"
            - "CoverageShift.${shift_id}.status == SCHEDULED"
            - "CoverageShift.${shift_id}.actual_clock_in_at == null"

      - name: confirm_on_unassigned_shift_returns_shift_not_assigned
        claim_type: precondition_enforcement
        grounds: ["state_machines.CoverageShift.SCHEDULED_to_CONFIRMED", "errors[ERR_SHIFT_NOT_ASSIGNED]", "validations[priority=8]"]
        distinguishing_aspect: "CONFIRM on an OPEN_UNFILLED shift (guard_id null) returns 409 ERR_SHIFT_NOT_ASSIGNED, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["An OPEN_UNFILLED shift exists on a post that has a PUBLISHED post order."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Una Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Una Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Una Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Stay awake.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "CONFIRM" }
              as: Scheduler
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_SHIFT_NOT_ASSIGNED'"
            - "CoverageShift.${shift_id}.status == OPEN_UNFILLED"

      - name: no_show_before_grace_window_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.CoverageShift.SCHEDULED_to_NO_SHOW", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "NO_SHOW declared at scheduled_start_at + 14 minutes (one minute short of the 15-minute grace) is rejected with 409 ERR_INVALID_STATE; at +15 minutes exactly it succeeds."
        test_recipe:
          setup: ["Guard Faye is SCHEDULED on a shift starting 2026-05-04T08:00:00Z; the clock reads 2026-05-04T08:14:00Z."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Faye Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Faye Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Faye Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Faye Orr", employee_code: "C-020", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-020", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:14:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "NO_SHOW" }
              as: FieldSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:15:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "NO_SHOW" }
              as: FieldSupervisor
          assert:
            - "First NO_SHOW: HTTP status == 409 and data.error_id == 'ERR_INVALID_STATE'"
            - "Second NO_SHOW (at exactly +15 min): HTTP status == 200"
            - "CoverageShift.${shift_id}.status == NO_SHOW"
            - "Guard.${guard_id}.no_show_count == 1"
            - "Guard.${guard_id}.reliability_score == 70.00"
            - "Guard.${guard_id}.employment_status == ACTIVE"

      - name: second_clock_out_on_completed_shift_rejected
        claim_type: idempotency
        grounds: ["state_machines.CoverageShift.IN_PROGRESS_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /shifts/{id}/clock-out on a COMPLETED shift returns 409 ERR_INVALID_STATE and leaves final_billable_cents and pay_cents unchanged at 54000 and 26400."
        test_recipe:
          setup: ["Guard Dax completed a 12h shift 2026-05-04T08:00Z→20:00Z (no break, no checkpoints) at bill_rate 4500 and pay_rate 2200."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Dax Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Dax Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Dax Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Standard orders.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Dax Poe", employee_code: "C-030", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "CL-030", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T20:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "CONFIRM" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-in"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-out"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
          trigger:
            - call: "POST /shifts/${shift_id}/clock-out"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"
            - "CoverageShift.${shift_id}.status == COMPLETED"
            - "CoverageShift.${shift_id}.final_billable_cents == 54000"
            - "CoverageShift.${shift_id}.pay_cents == 26400"
            - "CoverageShift.${shift_id}.tour_compliance_pct == 100.00"

      - name: cancel_on_verified_terminal_shift_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CoverageShift.COMPLETED_to_VERIFIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal: CANCEL on a VERIFIED shift returns 409 ERR_INVALID_STATE and the shift keeps status VERIFIED."
        test_recipe:
          setup: ["The shift from second_clock_out_on_completed_shift_rejected has additionally been VERIFIED by a FieldSupervisor."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Term Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Term Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Term Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Standard orders.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Tess Lo", employee_code: "C-040", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
