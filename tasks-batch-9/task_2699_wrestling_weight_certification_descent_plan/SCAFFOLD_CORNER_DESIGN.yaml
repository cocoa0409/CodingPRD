      - name: lowest_eligible_class_hard_floor_clamp_survives_growth_allowance
        claim_type: constraint_propagation
        grounds:
          - calculations.lowest_eligible_class_at_date
          - entities.GrowthAllowance.fields.effective_date
          - entities.EligibilityCheck.fields.growth_allowance_lbs
          - entities.Wrestler.fields.min_weight_class_lbs
        distinguishing_aspect: "The change propagates one hop and then stops at the hard floor: publishing a second growth allowance on 2026-12-12 lifts G from 1.0 to 4.0, which drags the candidate class down from 150 to 144, but the clamp against the wrestler's unadjusted min_weight_class_lbs 150 holds the answer at 150 on BOTH dates. The propagation reaches a fixed point instead of iterating the allowance back into the certified minimum."
