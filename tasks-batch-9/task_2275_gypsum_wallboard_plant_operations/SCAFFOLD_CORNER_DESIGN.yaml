              captures: { bq_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bq_id}/feeds"
              payload: { lot_id: "${lot_q}", tons_fed: 47.409, measured_free_moisture_pct: 0.00, expected_lot_version: "${lot_q_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${bq_id}/close-feed"
              payload: {}
              as: MaterialsController
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bp_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
              as_user_id: "u_qi_1"
            - call: "POST /plant-ops/calciner-batches/${bq_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
              as_user_id: "u_qi_1"
          assert:
            - "CalcinerBatch.${bp_id}.stucco_yield_actual_tons == 40.000 and CalcinerBatch.${bq_id}.stucco_yield_actual_tons == 39.999"
            - "Plant.${plant_id}.stucco_available_tons == 40.000 and production_posture == OPEN"
            - "Plant.${plant_b_id}.stucco_available_tons == 39.999 and production_posture == RESTRICTED"
            - "both plants have stucco_committed_tons == 0.000 and held_run_count == 0"

      - name: retained_stucco_failure_cascades_through_four_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / retained_stucco_fail_cascades_batch_run_plant_load
          rationale: "That instance verifies the batch -> run -> plant -> load-order chain end to end from a single FAIL stucco sample."

      - name: freight_dual_variant_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / freight_quoted_vs_settled_diverge_on_load
          rationale: "That instance computes both freight variants on one load order and pins the +4.74 delta on the switch to SETTLED."

      - name: calciner_rate_threshold_at_the_capacity_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / calciner_aggregate_rate_over_overlapping_subinterval
          rationale: "That instance sits an aggregate feed rate exactly on 60.0 tph (accepted) and one step above it (refused)."

  - section: consistency_model
    instances:

      - name: schedule_response_already_reflects_the_new_silo_commitment
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - state_machines.ProductionRun.status.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Consistency is immediate, so the mutation response itself carries the derived figures rather than
          promising them later: the schedule response reports stucco_reserved_tons 202.500 and an
          immediately following plant read already shows committed 202.500, available 2.030 and the posture
          flipped to RESTRICTED, with no re-read delay anywhere.
        test_recipe:
          setup:
            - "Plant GYP-1 with silo 204.530 t (posture OPEN) and run R1 drafted at 300.000 MSF."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_a_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_a_id}/assay"
              payload: { free_moisture_pct: 9.40, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
              captures: { lot_a_v: $.data.version }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "NATURAL", supplier_name: "Loveland Quarry", received_tons: 200.000, declared_free_moisture_pct: 2.80, declared_purity_pct: 91.5 }
              as: MaterialsController
              captures: { lot_b_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_b_id}/assay"
              payload: { free_moisture_pct: 2.60, purity_pct: 91.5, chloride_ppm: 80 }
              as: MaterialsController
              captures: { lot_b_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 230.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 120.000, measured_free_moisture_pct: 10.20, expected_lot_version: "${lot_a_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_b_id}", tons_fed: 80.000, measured_free_moisture_pct: 3.10, expected_lot_version: "${lot_b_v}" }
              as: MaterialsController
            - call: "GET /plant-ops/gypsum-lots/${lot_a_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_a_v2: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 60.000, measured_free_moisture_pct: 9.80, expected_lot_version: "${lot_a_v2}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/close-feed"
              payload: {}
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 300.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r1_id: $.data.id }
          trigger:
            - call: "GET /plant-ops/plants/${plant_id}"
              payload: {}
              as: ProductionScheduler
              captures: { p_v: $.data.version }
            - call: "POST /plant-ops/production-runs/${r1_id}/schedule"
              payload: { expected_plant_version: "${p_v}" }
              as: ProductionScheduler
            - call: "GET /plant-ops/plants/${plant_id}"
              payload: {}
              as: ProductionScheduler
            - call: "GET /plant-ops/production-runs/${r1_id}"
              payload: {}
              as: ProductionScheduler
          assert:
            - "the plant read before the schedule reported production_posture == OPEN and stucco_available_tons == 204.530"
            - "the schedule response body itself reports status == SCHEDULED, effective_planned_msf == 300.000 and stucco_reserved_tons == 202.500"
            - "the immediately following plant read reports stucco_committed_tons == 202.500, stucco_available_tons == 2.030 and production_posture == RESTRICTED"
            - "the run read agrees with the schedule response field for field, including kiln_energy_mmbtu == 518.018"
            - "no second read was needed for any value to settle"
