          rationale: "The deepest cascade in the domain - SUBSTANTIATE raises the exposure score past REMEDIATION_EXPOSURE_THRESHOLD, which suspends the program, which quarantines its ENFORCING terminals and recomputes the merchant census - is already exercised end to end with pre-computed literals at every level by that difficulty instance, including the ordering sensitivity between the score recomputation and the suspension."

      - name: law_change_prohibition_cascade_is_covered_in_the_difficulty_design
