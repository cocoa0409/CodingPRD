          - entities.RenewalTask.fields.requote_count
          - entities.RenewalTask.fields.stage
        distinguishing_aspect: |
          RenewalTask cycle OFFERED->REVIEW (re-quote loop) returns the machine to
          a prior stage and increments requote_count; a pure linear pipeline cannot.
        test_recipe:
          setup:
            - "An ACTIVE policy in its renewal window with clock 2026-11-15; a RenewalTask advanced IDENTIFIED->REVIEW->QUOTED->OFFERED."
          setup_api_calls:
