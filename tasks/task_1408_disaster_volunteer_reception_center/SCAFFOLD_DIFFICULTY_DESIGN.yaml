            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Quinn Qadri", phone: "555-1717", email: "quinn@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol1: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol1}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred1: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol1}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol1}" }, as: VettingOfficer, captures: { bg1: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg1}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred1}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol1}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol1}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol1}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Rhea Ryu", phone: "555-1818", email: "rhea@x.com", home_locality: "Hillview" }, as: IntakeCoordinator, as_user_id: "intake-2", captures: { vol2: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol2}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred2: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol2}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol2}" }, as: VettingOfficer, captures: { bg2: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg2}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred2}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol2}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol2}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol2}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "East Lot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 2, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "East Lot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 4 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol1}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /vrc/assignments/${a1}/accept", payload: {}, as: Volunteer, as_user_id: "${vol1}" }
            - { call: "POST /vrc/assignments/${a1}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol2}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /vrc/assignments/${a2}/accept", payload: {}, as: Volunteer, as_user_id: "${vol2}" }
            - { call: "POST /vrc/assignments/${a2}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/trips", payload: { incident_id: "${inc}", site_shift_id: "${sh}", vehicle_id: "VAN-2", seat_capacity: 3, depart_at: "2026-08-10T07:00:00Z", arrive_estimate_at: "2026-08-10T07:45:00Z" }, as: LogisticsCoordinator, captures: { trip: $.data.id } }
          trigger:
            - { call: "POST /vrc/seat-bookings", payload: { trip_id: "${trip}", assignment_id: "${a1}" }, as: LogisticsCoordinator, captures: { bk1: $.data.id } }
            - { call: "POST /vrc/seat-bookings", payload: { trip_id: "${trip}", assignment_id: "${a2}" }, as: LogisticsCoordinator, captures: { bk2: $.data.id } }
            - { call: "GET /vrc/trips/${trip}", payload: {}, as: VRCManager, captures: { seats_two: $.data.booked_seats } }
            - { call: "POST /vrc/seat-bookings/${bk1}/cancel", payload: {}, as: LogisticsCoordinator }
            - { call: "GET /vrc/trips/${trip}", payload: {}, as: VRCManager, captures: { seats_one: $.data.booked_seats } }
            - { call: "POST /vrc/seat-bookings", payload: { trip_id: "${trip}", assignment_id: "${a1}" }, as: LogisticsCoordinator, captures: { bk3: $.data.id } }
            - { call: "GET /vrc/trips/${trip}", payload: {}, as: VRCManager, captures: { seats_rebooked: $.data.booked_seats } }
          assert:
            - "seats_two == 2 (two BOOKED bookings)"
            - "seats_one == 1 (cancel compensated the first booking exactly; invariant booked_seats == COUNT({BOOKED, BOARDED}) holds)"
            - "bk3 captured (re-book for the same assignment+trip allowed after cancellation) and seats_rebooked == 2"

      - name: confirm_then_cancel_restores_committed_hours_ledger
        grounds:
          - calculations.volunteer_committed_hours
          - state_machines.DeploymentAssignment.ACCEPTED_to_CONFIRMED
          - state_machines.DeploymentAssignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: the volunteer's committed-hours ledger (a
          different quantity from trip seats). Pinned invariant:
          committed_hours == SUM(shift.duration_hours over assignments in
          {CONFIRMED, CHECKED_IN}) — PROPOSED/ACCEPTED contribute nothing, a
          confirm adds exactly 8.00, and its compensating cancel subtracts
          exactly 8.00, returning the ledger to 0.0 with no drift.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY; request (headcount 1) and shift S (2026-08-10 08:00-16:00, 8.00h) OPEN_FOR_ROSTER"
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire Sigma", ppe_stock: { GLOVES: 5, MASK: 5, HARD_HAT: 5, VEST: 5, GOGGLES: 5 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Sara Sun", phone: "555-1919", email: "sara@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "North Depot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { c_accepted: $.data.committed_hours } }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { c_confirmed: $.data.committed_hours } }
            - { call: "POST /vrc/assignments/${asg}/cancel", payload: {}, as: IntakeCoordinator }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { c_cancelled: $.data.committed_hours } }
          assert:
            - "c_accepted == 0.0 (ACCEPTED is outside the {CONFIRMED, CHECKED_IN} input set)"
            - "c_confirmed == 8.0 (confirm debits exactly the shift's duration_hours)"
            - "c_cancelled == 0.0 (cancel compensates exactly; ledger returns to its pre-confirm value)"
