# =============================================================================
# SCAFFOLD.yaml — §1.0 through §1.7
# Task: task_3239_digital_preservation_crawls_controlled_lending_rights_requests
# Domain: Digital Preservation Crawls, Controlled Lending & Rights Requests
#         (Internet Archive-style)
# =============================================================================

scenario: |
  Digital Preservation Crawls, Controlled Lending & Rights Requests (Internet Archive): web crawling at scale with politeness rules, exclusion directives and capture scheduling for at-risk sites, snapshot storage, deduplication and playback of historical pages with dynamic content limitations, physical book scanning operations and metadata cataloging with condition handling, controlled digital lending with a one-copy-one-user model, waitlists and time-limited loans, rights holder removal requests and legal challenges affecting collection availability, patron accounts, accessibility services for print-disabled users with qualification verification, partner library collection deposits and long-term storage commitments, donation-based funding and infrastructure cost planning

domain_name: digital-preservation-lending
api_prefix: /archive

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Patron email; unique across patrons, case-insensitive" }
      - { name: full_name, type: string, source: input, description: "Patron display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; starts ACTIVE; SUSPENDED when strike_count reaches 3; CLOSED only via admin close on a patron with no ACTIVE loans", constraints: "ACTIVE|SUSPENDED|CLOSED" }
      - { name: active_loan_count, type: integer, source: computed, description: "Count of this patron's Loans in status ACTIVE; maintained by every loan lifecycle transition", default: 0 }
      - { name: strike_count, type: integer, source: computed, description: "Count of this patron's loans that reached EXPIRED; incremented by sweeper only, never decremented", default: 0 }
      - { name: max_concurrent_loans, type: integer, source: computed, description: "50 while this patron holds any AccessibilityCredential in VERIFIED status, else 5", default: 5 }

  - name: AccessibilityCredential
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the patron whose print-disabled qualification is being verified" }
      - { name: certifier_reference, type: string, source: input, description: "Opaque reference code from the qualifying authority" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | VERIFIED | REJECTED | REVOKED; starts PENDING_REVIEW", constraints: "PENDING_REVIEW|VERIFIED|REJECTED|REVOKED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding AccessibilityOfficer; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of decision; null until decided" }

  - name: PartnerLibrary
    parent: null
    common_fields: true
    fields:
      - { name: library_code, type: string, source: input, description: "Short unique code, e.g. BPL-MA; unique across partner libraries" }
      - { name: display_name, type: string, source: input, description: "Human-readable library name" }
      - { name: storage_commitment_years, type: integer, source: input, description: "Long-term storage commitment in whole years", constraints: ">= 5" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN; starts ACTIVE; single atomic transition via the withdraw endpoint", constraints: "ACTIVE|WITHDRAWN" }

  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Bibliographic title" }
      - { name: author, type: string, source: input, description: "Primary author" }
      - { name: publication_year, type: integer, source: input, description: "Year of first publication", constraints: "1450..2100" }
      - { name: availability, type: enum, source: computed, description: "AVAILABLE | EMBARGOED | WITHDRAWN; recomputed after every RightsRequest transition touching this work (see calculations.work_availability_recompute)", constraints: "AVAILABLE|EMBARGOED|WITHDRAWN" }

  - name: ScanBatch
    parent: null
    common_fields: true
    fields:
      - { name: operator_code, type: string, source: input, description: "Scan-center operator identifier" }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED | REJECTED; starts OPEN", constraints: "OPEN|SEALED|REJECTED" }
      - { name: item_count, type: integer, source: computed, description: "Count of ScanItems in this batch; maintained on item deposit and batch events", default: 0 }
      - { name: page_count, type: integer, source: computed, description: "Sum of page_count over the batch's ScanItems", default: 0 }

  - name: ScanItem
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ScanBatch.id; batch receiving this item; batch must be OPEN at deposit time" }
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the cataloged work this physical item embodies" }
      - { name: owning_library_id, type: string, source: input, description: "FK -> PartnerLibrary.id; library depositing the physical original" }
      - { name: page_count, type: integer, source: input, description: "Pages in the scanned artifact", constraints: ">= 1" }
      - { name: condition_grade, type: enum, source: input, description: "FINE | GOOD | FAIR | FRAGILE; physical condition observed at scan time", constraints: "FINE|GOOD|FAIR|FRAGILE" }
      - { name: status, type: enum, source: system, description: "DEPOSITED | LENDABLE | ON_LOAN | RETIRED; starts DEPOSITED; becomes LENDABLE when its batch is SEALED and the work is lendable", constraints: "DEPOSITED|LENDABLE|ON_LOAN|RETIRED" }
      - { name: lendable, type: boolean, source: computed, description: "true iff status == LENDABLE AND work.availability == AVAILABLE AND owning library status == ACTIVE" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> ScanItem.id; exactly one ACTIVE loan per item at any time (one-copy-one-user)" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; borrower" }
      - { name: loan_kind, type: enum, source: input, description: "STANDARD | SHORT_READ; SHORT_READ requires the patron to hold a VERIFIED AccessibilityCredential at checkout", constraints: "STANDARD|SHORT_READ" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETURNED | EXPIRED | REVOKED; starts ACTIVE", constraints: "ACTIVE|RETURNED|EXPIRED|REVOKED" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock timestamp of checkout" }
      - { name: due_at, type: datetime, source: system, description: "checked_out_at + 14 days for STANDARD; checked_out_at + 1 hour for SHORT_READ" }
      - { name: renewed, type: boolean, source: system, description: "true after the loan's single permitted renewal", default: false }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; waitlists are per-work, not per-copy" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; at most one entry per (work_id, patron_id) pair in status OPEN or OFFERED" }
      - { name: status, type: enum, source: system, description: "OPEN | OFFERED | CLAIMED | EXPIRED_OFFER | CANCELLED; starts OPEN", constraints: "OPEN|OFFERED|CLAIMED|EXPIRED_OFFER|CANCELLED" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock time the entry was promoted to OFFERED; null while OPEN" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + 48 hours; null while OPEN" }

  - name: CrawlJob
    parent: null
    common_fields: true
    fields:
      - { name: seed_url, type: string, source: input, description: "Seed URL of the site to crawl" }
      - { name: at_risk, type: boolean, source: input, description: "true marks the site at-risk: scheduled with double capture frequency intent; the politeness cap still applies", default: false }
      - { name: scheduled_at, type: datetime, source: input, description: "Logical-clock time the crawl may start; must be strictly after the current logical clock at creation" }
      - { name: requests_per_minute, type: integer, source: input, description: "Politeness limit applied to the crawl", constraints: "1 <= requests_per_minute <= 120" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RUNNING | COMPLETED | BLOCKED | CANCELLED; starts SCHEDULED", constraints: "SCHEDULED|RUNNING|COMPLETED|BLOCKED|CANCELLED" }
      - { name: captures_produced, type: integer, source: computed, description: "Count of Capture rows recorded against this job (post-dedupe)", default: 0 }
      - { name: duplicates_skipped, type: integer, source: computed, description: "Count of capture-record calls suppressed by the (url, content_hash) dedupe rule", default: 0 }
      - { name: storage_cost_cents, type: integer, source: computed, description: "Tiered storage cost of this job's unique captures per calculations.capture_dedupe_and_storage_cost", default: 0 }

  - name: Capture
    parent: null
    common_fields: false
    fields:
      - { name: crawl_job_id, type: string, source: system, description: "FK -> CrawlJob.id; the job that produced this capture" }
      - { name: url, type: string, source: input, description: "Captured page URL" }
      - { name: content_hash, type: string, source: input, description: "SHA-256 hex of normalized content; dedupe key together with url" }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock time of capture" }
      - { name: has_dynamic_content, type: boolean, source: input, description: "true if the page requires client-side scripting; playback of such captures reports DEGRADED mode" }
      - { name: playback_status, type: enum, source: system, description: "PLAYABLE | SUPPRESSED; PLAYABLE at record time; SUPPRESSED when an ACTIVE PLAYBACK_ONLY/BOTH ExclusionDirective or an upheld CAPTURE_URL_PREFIX RightsRequest covers the url", constraints: "PLAYABLE|SUPPRESSED" }

  - name: ExclusionDirective
    parent: null
    common_fields: true
    fields:
      - { name: url_prefix, type: string, source: input, description: "URL prefix to exclude; matching is string-prefix on the full URL" }
      - { name: scope, type: enum, source: input, description: "CRAWL_ONLY | PLAYBACK_ONLY | BOTH", constraints: "CRAWL_ONLY|PLAYBACK_ONLY|BOTH" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETRACTED; starts ACTIVE", constraints: "ACTIVE|RETRACTED" }
      - { name: reason, type: string, source: input, description: "Free-text audit reason" }

  - name: RightsRequest
    parent: null
    common_fields: true
    fields:
      - { name: subject_kind, type: enum, source: input, description: "WORK | CAPTURE_URL_PREFIX; what the removal request targets", constraints: "WORK|CAPTURE_URL_PREFIX" }
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; required iff subject_kind == WORK; null otherwise" }
      - { name: url_prefix, type: string, source: input, description: "URL prefix; required iff subject_kind == CAPTURE_URL_PREFIX; null otherwise" }
      - { name: claimant_name, type: string, source: input, description: "Rights-holder name" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of the LegalReviewer who filed the request" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | LEGAL_HOLD | UPHELD_REMOVED | DISMISSED; starts FILED", constraints: "FILED|UNDER_REVIEW|LEGAL_HOLD|UPHELD_REMOVED|DISMISSED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the LegalReviewer who began review; must differ from filed_by (segregation of duties)" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the LegalReviewer who issued the final decision; must differ from reviewed_by (two-person rule)" }

  - name: FundingGrant
    parent: null
    common_fields: true
    fields:
      - { name: donor_name, type: string, source: input, description: "Donor or foundation name" }
      - { name: amount_cents, type: integer, source: input, description: "Total grant amount in cents", constraints: "> 0" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of budget_reservation_cents over this grant's BudgetLines in status OPEN", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "Sum of actual_spend_cents over this grant's BudgetLines in status SETTLED", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED; OPEN->EXHAUSTED when reserved_cents + spent_cents == amount_cents; EXHAUSTED->OPEN when it drops below; ->CLOSED via admin close when reserved_cents == 0", constraints: "OPEN|EXHAUSTED|CLOSED" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> FundingGrant.id; grant funding this infrastructure line" }
      - { name: category, type: enum, source: input, description: "STORAGE | BANDWIDTH | SCAN_LABOR | PETABYTE_INSURANCE", constraints: "STORAGE|BANDWIDTH|SCAN_LABOR|PETABYTE_INSURANCE" }
      - { name: budget_reservation_cents, type: integer, source: input, description: "Reserved amount in cents", constraints: "> 0" }
      - { name: actual_spend_cents, type: integer, source: input, description: "Final spend in cents; required on settle; ignored at create", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | RELEASED; starts OPEN", constraints: "OPEN|SETTLED|RELEASED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patron
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: loan-expiry sweep raises patron.strike_count to exactly 3"
        actor: system
        preconditions:
          - "patron.strike_count reaches 3 as a consequence of a Loan -> EXPIRED transition"
        side_effects:
          - "Every OFFERED WaitlistEntry of this patron -> CANCELLED (side effect of patron suspension, hop 4 of the expiry cascade)"
      # CLOSED is a declared terminal lifecycle state for the domain (account
      # closure by the platform) but is not exercised by any endpoint in this
      # scaffold's surface; it is unreachable by design in v1 and no test may
      # target it.
      - from: ACTIVE
        to: CLOSED
        trigger: "system: platform account closure (no endpoint in v1; declared for enum completeness only)"
        actor: system
        preconditions:
          - "patron has no Loan in status ACTIVE"
        side_effects:
          - "All OPEN or OFFERED WaitlistEntries of this patron -> CANCELLED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system: platform account closure (no endpoint in v1; declared for enum completeness only)"
        actor: system
        preconditions:
          - "patron has no Loan in status ACTIVE"
        side_effects:
          - "All OPEN or OFFERED WaitlistEntries of this patron -> CANCELLED"

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [RETURNED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /archive/loans/{id}/renew (self-transition extending due_at)"
        actor: Patron
        preconditions:
          - "loan.status == ACTIVE"
          - "X-User-ID == loan.patron_id"
          - "loan.renewed == false"
          - "loan.loan_kind == STANDARD (SHORT_READ loans are never renewable)"
          - "current logical clock < loan.due_at"
          - "No WaitlistEntry exists for the loan's work in status OPEN or OFFERED"
          - "current logical clock + 14 days <= loan.due_at + 14 days is implied; renewal sets due_at := current_clock + 14 days, and the new due_at must not exceed checked_out_at + 42 days"
        side_effects:
          - "loan.renewed := true"
          - "loan.due_at := current logical clock + 14 days"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /archive/loans/{id}/return"
        actor: Patron
        preconditions:
          - "loan.status == ACTIVE"
          - "X-User-ID == loan.patron_id"
        side_effects:
          - "item.status: ON_LOAN -> LENDABLE"
          - "patron.active_loan_count -= 1"
          - "run waitlist promotion for the loan item's work (calculations.waitlist_promotion)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /archive/_sweeps/run with loan.due_at <= current logical clock"
        actor: system
        preconditions:
          - "loan.status == ACTIVE"
          - "current logical clock >= loan.due_at"
        side_effects:
          - "item.status: ON_LOAN -> LENDABLE"
          - "patron.active_loan_count -= 1"
          - "patron.strike_count += 1"
          - "if patron.strike_count == 3 after the increment: patron.status -> SUSPENDED (cascade hop 3)"
          - "patron suspension then cancels that patron's OFFERED waitlist entries (cascade hop 4)"
          - "run waitlist promotion for the loan item's work"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: rights cascade (work becomes WITHDRAWN) or library-withdrawal cascade or item retirement while this loan is ACTIVE"
        actor: system
        preconditions:
          - "loan.status == ACTIVE"
        side_effects:
          - "item.status: ON_LOAN -> LENDABLE (unless the trigger was item retirement, in which case item proceeds to RETIRED)"
          - "patron.active_loan_count -= 1"
          - "run waitlist promotion for the loan item's work"

  - entity: WaitlistEntry
    initial_state: OPEN
    terminal_states: [CLAIMED, EXPIRED_OFFER, CANCELLED]
    transitions:
      - from: OPEN
        to: OFFERED
        trigger: "system: waitlist promotion when a lendable copy of the work exists"
        actor: system
        preconditions:
          - "entry is the earliest-created (created_at ASC) entry for its work_id in status OPEN whose patron is eligible (status ACTIVE and active_loan_count < max_concurrent_loans); earlier entries with ineligible patrons are skipped or cancelled per calculations.waitlist_promotion"
          - "at least one ScanItem of the work has lendable == true"
          - "entry patron.status == ACTIVE"
          - "entry patron.active_loan_count < patron.max_concurrent_loans"
        side_effects:
          - "entry.offered_at := current logical clock"
          - "entry.offer_expires_at := offered_at + 48 hours"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /archive/waitlist-entries/{id}/claim"
        actor: Patron
        preconditions:
          - "entry.status == OFFERED"
          - "current logical clock < entry.offer_expires_at"
          - "X-User-ID == entry.patron_id"
          - "patron.status == ACTIVE"
          - "patron.active_loan_count < patron.max_concurrent_loans"
          - "expected_entry_version == entry.version (OCC)"
        side_effects:
          - "select the claiming item: among ScanItems of the work with lendable == true, pick the one whose work_id matches, ordered by created_at ASC (never id)"
          - "create Loan (loan_kind STANDARD, due_at = clock + 14 days) on that item; item.status: LENDABLE -> ON_LOAN"
          - "patron.active_loan_count += 1"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: EXPIRED_OFFER
        trigger: "system: POST /archive/_sweeps/run with offer_expires_at <= current logical clock"
        actor: system
        preconditions:
          - "entry.status == OFFERED"
          - "current logical clock >= entry.offer_expires_at"
        side_effects:
          - "run waitlist promotion for the same work (the next OPEN entry may be offered)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /archive/waitlist-entries/{id}/cancel"
        actor: Patron
        preconditions:
          - "entry.status == OPEN"
          - "X-User-ID == entry.patron_id"
        side_effects: []

  - entity: ScanItem
    initial_state: DEPOSITED
    terminal_states: [RETIRED]
    transitions:
      - from: DEPOSITED
        to: LENDABLE
        trigger: "system: POST /archive/scan-batches/{id}/seal seals the item's batch while work.availability == AVAILABLE and owning library status == ACTIVE; or availability-recovery re-evaluation"
        actor: system
        preconditions:
          - "item.status == DEPOSITED"
          - "batch.status == SEALED"
          - "work.availability == AVAILABLE"
          - "owning library.status == ACTIVE"
        side_effects:
          - "run waitlist promotion for item.work_id (a newly lendable copy may satisfy a waiting patron)"
      - from: LENDABLE
        to: ON_LOAN
        trigger: "system: a Loan is created against this item (direct checkout or waitlist claim)"
        actor: system
        preconditions:
          - "item.lendable == true"
        side_effects: []
      - from: ON_LOAN
        to: LENDABLE
        trigger: "system: the ACTIVE loan on this item reaches RETURNED, EXPIRED, or REVOKED (non-retirement triggers)"
        actor: system
        preconditions: []
        side_effects:
          - "run waitlist promotion for item.work_id"
      - from: LENDABLE
        to: RETIRED
        trigger: "POST /archive/items/{id}/retire"
        actor: LibraryAdmin
        preconditions:
          - "item.status == LENDABLE"
        side_effects: []
      - from: ON_LOAN
        to: RETIRED
        trigger: "POST /archive/items/{id}/retire"
        actor: LibraryAdmin
        preconditions:
          - "item.status == ON_LOAN"
        side_effects:
          - "the ACTIVE loan on this item transitions ACTIVE -> REVOKED"
          - "patron.active_loan_count -= 1"

  - entity: ScanBatch
    initial_state: OPEN
    terminal_states: [SEALED, REJECTED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /archive/scan-batches/{id}/seal"
        actor: ScanOperator
        preconditions:
          - "batch.status == OPEN"
          - "batch.item_count >= 1"
        side_effects:
          - "every ScanItem in the batch with status DEPOSITED is evaluated: if work.availability == AVAILABLE and owning library ACTIVE, item -> LENDABLE (which itself runs waitlist promotion per item)"
      - from: OPEN
        to: REJECTED
        trigger: "POST /archive/scan-batches/{id}/reject"
        actor: ScanOperator
        preconditions:
          - "batch.status == OPEN"
        side_effects:
          - "every ScanItem in the batch with status DEPOSITED -> RETIRED"

  - entity: PartnerLibrary
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /archive/partner-libraries/{id}/withdraw"
        actor: LibraryAdmin
        preconditions:
          - "library.status == ACTIVE"
          - "no ScanItem owned by this library is in status ON_LOAN"
        side_effects:
          - "every ScanItem owned by this library in status LENDABLE or DEPOSITED -> RETIRED"

  - entity: RightsRequest
    initial_state: FILED
    terminal_states: [UPHELD_REMOVED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /archive/rights-requests/{id}/begin-review"
        actor: LegalReviewer
        preconditions:
          - "request.status == FILED"
          - "X-User-ID != request.filed_by (segregation of duties: the filer may never review their own filing)"
        side_effects:
          - "request.reviewed_by := X-User-ID"
          - "if subject_kind == WORK: work.availability := EMBARGOED; lendable of the work's LENDABLE items flips false; promotion skips embargoed works"
      - from: UNDER_REVIEW
        to: LEGAL_HOLD
        trigger: "POST /archive/rights-requests/{id}/escalate-hold"
        actor: LegalReviewer
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == request.reviewed_by (only the assigned reviewer may escalate)"
        side_effects:
          - "if subject_kind == WORK: work.availability := WITHDRAWN; every ACTIVE loan on the work's items -> REVOKED (cascade: RightsRequest -> Work.availability -> Loan revocation -> item LENDABLE + patron counter decrements + waitlist promotion per affected work)"
          - "if subject_kind == CAPTURE_URL_PREFIX: every Capture whose url starts with url_prefix gets playback_status := SUPPRESSED"
      - from: UNDER_REVIEW
        to: UPHELD_REMOVED
        trigger: "POST /archive/rights-requests/{id}/decide with decision == UPHOLD"
        actor: LegalReviewer
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.reviewed_by (two-person rule: decider differs from reviewer)"
        side_effects:
          - "request.decided_by := X-User-ID"
          - "same availability/suppression cascades as LEGAL_HOLD escalation"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /archive/rights-requests/{id}/decide with decision == DISMISS"
        actor: LegalReviewer
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.reviewed_by"
        side_effects:
          - "request.decided_by := X-User-ID"
          - "run calculations.work_availability_recompute for the subject work; if availability recovers to AVAILABLE, re-evaluate DEPOSITED items in sealed batches for promotion to LENDABLE"
      - from: LEGAL_HOLD
        to: UPHELD_REMOVED
        trigger: "POST /archive/rights-requests/{id}/decide with decision == UPHOLD"
        actor: LegalReviewer
        preconditions:
          - "request.status == LEGAL_HOLD"
          - "X-User-ID != request.reviewed_by"
        side_effects:
          - "request.decided_by := X-User-ID"
      - from: LEGAL_HOLD
        to: DISMISSED
        trigger: "POST /archive/rights-requests/{id}/decide with decision == DISMISS"
        actor: LegalReviewer
        preconditions:
          - "request.status == LEGAL_HOLD"
          - "X-User-ID != request.reviewed_by"
        side_effects:
          - "request.decided_by := X-User-ID"
          - "same availability-recovery recompute as UNDER_REVIEW -> DISMISSED"

  - entity: CrawlJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, BLOCKED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /archive/crawl-jobs/{id}/start"
        actor: CrawlOperator
        preconditions:
          - "job.status == SCHEDULED"
          - "current logical clock >= job.scheduled_at"
          - "no ACTIVE ExclusionDirective with scope in {CRAWL_ONLY, BOTH} whose url_prefix is a string prefix of job.seed_url"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /archive/crawl-jobs/{id}/complete"
        actor: CrawlOperator
        preconditions:
          - "job.status == RUNNING"
        side_effects:
          - "job.captures_produced recomputed from recorded Capture rows"
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: an ExclusionDirective with scope in {CRAWL_ONLY, BOTH} matching the seed_url prefix is created while the job is SCHEDULED"
        actor: system
        preconditions:
          - "job.status == SCHEDULED"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /archive/crawl-jobs/{id}/cancel"
        actor: CrawlOperator
        preconditions:
          - "job.status == SCHEDULED"
        side_effects: []

  - entity: ExclusionDirective
    initial_state: ACTIVE
    terminal_states: [RETRACTED]
    transitions:
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /archive/exclusion-directives/{id}/retract"
        actor: CrawlOperator
        preconditions:
          - "directive.status == ACTIVE"
        side_effects:
          - "Captures suppressed solely by this directive: playback_status := PLAYABLE if no other ACTIVE directive (PLAYBACK_ONLY/BOTH) or upheld CAPTURE_URL_PREFIX RightsRequest still covers the url"

  - entity: AccessibilityCredential
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /archive/accessibility-credentials/{id}/decide with decision == VERIFY"
        actor: AccessibilityOfficer
        preconditions:
          - "credential.status == PENDING_REVIEW"
          - "X-User-ID != credential.patron_id (an officer may not verify their own credential)"
        side_effects:
          - "credential.decided_by := X-User-ID; credential.decided_at := current logical clock"
          - "patron.max_concurrent_loans recomputed (becomes 50)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /archive/accessibility-credentials/{id}/decide with decision == REJECT"
        actor: AccessibilityOfficer
        preconditions:
          - "credential.status == PENDING_REVIEW"
        side_effects:
          - "credential.decided_by := X-User-ID; credential.decided_at := current logical clock"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /archive/accessibility-credentials/{id}/decide with decision == REVOKE"
        actor: AccessibilityOfficer
        preconditions:
          - "credential.status == VERIFIED"
        side_effects:
          - "patron.max_concurrent_loans recomputed (drops to 5 unless another VERIFIED credential exists); existing ACTIVE loans are NOT closed; the cap gates only new checkouts and claims"

  - entity: FundingGrant
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system: any BudgetLine create/settle/release that drives reserved_cents + spent_cents == amount_cents"
        actor: system
        preconditions:
          - "grant.status == OPEN"
        side_effects: []
      - from: EXHAUSTED
        to: OPEN
        trigger: "system: a BudgetLine release or a settle with actual_spend_cents < budget_reservation_cents drops reserved_cents + spent_cents below amount_cents (cycle)"
        actor: system
        preconditions:
          - "grant.status == EXHAUSTED"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /archive/funding-grants/{id}/close"
        actor: FinanceAdmin
        preconditions:
          - "grant.status == OPEN"
          - "grant.reserved_cents == 0"
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /archive/funding-grants/{id}/close"
        actor: FinanceAdmin
        preconditions:
          - "grant.status == EXHAUSTED"
          - "grant.reserved_cents == 0"
        side_effects: []

  - entity: BudgetLine
    initial_state: OPEN
    terminal_states: [SETTLED, RELEASED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /archive/budget-lines/{id}/settle"
        actor: FinanceAdmin
        preconditions:
          - "line.status == OPEN"
          - "expected_grant_version == grant.version (OCC)"
        side_effects:
          - "grant.reserved_cents -= line.budget_reservation_cents"
          - "grant.spent_cents += line.actual_spend_cents"
          - "grant.status recomputed (OPEN <-> EXHAUSTED)"
          - "increments FundingGrant.version by 1"
      - from: OPEN
        to: RELEASED
        trigger: "POST /archive/budget-lines/{id}/release"
        actor: FinanceAdmin
        preconditions:
          - "line.status == OPEN"
          - "expected_grant_version == grant.version (OCC)"
        side_effects:
          - "grant.reserved_cents -= line.budget_reservation_cents"
          - "grant.status recomputed"
          - "increments FundingGrant.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only — serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: waitlist-claim-stale-entry
    parent_entity: WaitlistEntry
    write_endpoint: "POST /archive/waitlist-entries/{id}/claim"
    occ_field: "expected_entry_version"
    description: |
      Claiming a WaitlistEntry whose version has advanced since the claimant
      last observed it is rejected. The sweeper may have expired and the
      promotion re-offered the entry, bumping its version; the claimant's
      view of the offer window is stale even though the entry is OFFERED
      again and a claim would otherwise legitimately succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-write-stale-grant
    parent_entity: FundingGrant
    write_endpoint: "POST /archive/budget-lines/{id}/settle"
    occ_field: "expected_grant_version"
    description: |
      Settling (or releasing) a BudgetLine against a FundingGrant whose
      version has advanced since the finance admin last observed it is
      rejected, because grant counters (reserved_cents, spent_cents) may
      have moved under them and the resulting EXHAUSTED/OPEN recomputation
      would be based on a stale baseline. Applies equally to
      POST /archive/budget-lines/{id}/release.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: waitlist_promotion
    trigger: "Runs after any of: (a) a Loan reaches RETURNED / EXPIRED / REVOKED; (b) a ScanItem becomes LENDABLE (batch seal, availability recovery); (c) an OFFERED entry expires (offer window lapse)"
    algorithm: selector_policy
    formula: |
      promotion(work):
        candidates = ScanItems where work_id == work.id AND lendable == true
        if candidates is empty: return (no offer)
        # Walk OPEN entries oldest-first; the first eligible patron wins the
        # offer. Skipping is transient: a skipped entry stays OPEN and is
        # reconsidered on the next promotion run.
        for entry in WaitlistEntries with work_id == work.id AND status == OPEN
                    ordered by created_at ASC (millisecond-unique; no tie-break
                    on id is ever used):
          p = entry.patron
          if p.status != ACTIVE:      # terminal ineligibility: suspension/closure
            entry.status := CANCELLED # cascade source: patron standing, not the promotion itself
            continue
          if p.active_loan_count >= p.max_concurrent_loans:
            continue                  # transient skip: entry stays OPEN
          entry.status := OFFERED
          entry.offered_at := current logical clock
          entry.offer_expires_at := offered_at + 48h
          return (one offer per promotion run per work)
        return (no eligible entry)
    input_set: "WaitlistEntries in status OPEN for the work; ScanItems of the work with lendable == true"
    constants:
      OFFER_WINDOW_HOURS: 48
    precision: "timestamps at millisecond precision; no rounding"

  - name: work_availability_recompute
    trigger: "After every RightsRequest transition that touches a work (begin-review, escalate-hold, decide UPHOLD/DISMISS), and after a RightsRequest subject's terminal decision"
    algorithm: aggregation
    formula: |
      requests = RightsRequests with subject_kind == WORK and work_id == work.id
      if any request in {LEGAL_HOLD, UPHELD_REMOVED}: availability := WITHDRAWN
      elif any request in {UNDER_REVIEW}: availability := EMBARGOED
      else: availability := AVAILABLE
      # Note: FILED and DISMISSED requests do not affect availability.
    input_set: "All RightsRequests for the work, regardless of status"
    constants: {}
    precision: "n/a (enum derivation)"
    variants:
      - name: provisional_embargo
        when: "RightsRequest in UNDER_REVIEW only"
        difference: "Blocks new checkouts (lendable flips false) but ACTIVE loans are untouched and playback of the catalog record remains visible"
      - name: hard_withdrawal
        when: "Any request in LEGAL_HOLD or UPHELD_REMOVED"
        difference: "Blocks new checkouts AND revokes every ACTIVE loan on the work's items (cascade into Loan -> REVOKED, item status flip, patron counters, waitlist promotion)"

  - name: playback_resolution
    trigger: "GET /archive/playback is called for a url"
    algorithm: projection
    formula: |
      # Step 1: candidate set
      candidates = Captures where url == requested url AND playback_status == PLAYABLE
      # Step 2: suppression overrides (evaluated live, not cached)
      if exists ACTIVE ExclusionDirective d with d.scope in {PLAYBACK_ONLY, BOTH}
         and d.url_prefix is a string prefix of url:
        return { mode: "SUPPRESSED", capture: null }
      if exists RightsRequest r with r.subject_kind == CAPTURE_URL_PREFIX,
         r.status in {LEGAL_HOLD, UPHELD_REMOVED}, and r.url_prefix prefixes url:
        return { mode: "SUPPRESSED", capture: null }
      # Step 3: pick the snapshot nearest to requested_at (half-open tie rule)
      if requested_at is null: pick = candidate with max captured_at
      else: pick = candidate minimizing abs(captured_at - requested_at);
            on an exact tie between an earlier and a later capture, the EARLIER
            capture wins (closed on the past side); further ties by created_at ASC
      if pick is null: return { mode: "NOT_FOUND", capture: null }
      if pick.has_dynamic_content: return { mode: "DEGRADED", capture: pick }
      return { mode: "FULL", capture: pick }
    input_set: "All Capture rows whose url exactly equals the requested url"
    constants: {}
    precision: "millisecond timestamp comparison; abs() distance in milliseconds"
    variants:
      - name: nearest_past_or_future
        when: "requested_at supplied"
        difference: "Chooses the capture nearest in absolute time to requested_at; ties resolved toward the earlier capture"
      - name: latest_default
        when: "requested_at omitted"
        difference: "Chooses the capture with the maximum captured_at; the tie rule never fires because captured_at is millisecond-unique per (url) insertion order via created_at"

  - name: capture_dedupe_and_storage_cost
    trigger: "POST /archive/captures records a capture"
    algorithm: tiered_pricing
    formula: |
      # Dedupe: a Capture row is created ONLY IF no existing Capture has the same
      # (url, content_hash) pair. Duplicates are counted in the job's
      # duplicates_skipped metric (reported on the job) but create no row and do
      # not increment captures_produced.
      # Storage cost of a job (cents) uses a tiered rate on UNIQUE bytes stored:
      #   bytes = sum over unique captures of estimated_bytes
      #   estimated_bytes = 524288 per capture (512 KiB fixed estimate)
      #   tier 1: first 1_000_000_000 bytes  -> 3 cents per 1_000_000 bytes
      #   tier 2: bytes beyond tier 1        -> 1 cent  per 1_000_000 bytes
      # Rounding: cost is computed per tier, each tier rounded to whole cents
      # (round_half_up), then summed. NEVER sum bytes first and round once.
      cost_cents(tier1_bytes) = round_half_up(tier1_bytes * 3 / 1_000_000)
      cost_cents(tier2_bytes) = round_half_up(tier2_bytes * 1 / 1_000_000)
      job_storage_cost_cents = cost(min(bytes, T1_CAP)) + cost(max(0, bytes - T1_CAP))
    input_set: "Capture rows recorded against the crawl job (post-dedupe)"
    constants:
      ESTIMATED_BYTES_PER_CAPTURE: 524288
      TIER1_CAP_BYTES: 1000000000
      TIER1_CENTS_PER_MB: 3
      TIER2_CENTS_PER_MB: 1
    precision: "whole cents, round_half_up, per-tier rounding pinned (round each tier then sum)"

  - name: grant_utilization
    trigger: "Every BudgetLine create, settle, or release; also read on GET /archive/funding-grants/{id}"
    algorithm: threshold
    formula: |
      reserved_cents = sum(budget_reservation_cents for lines in OPEN)
      spent_cents    = sum(actual_spend_cents for lines in SETTLED)
      utilization = reserved_cents + spent_cents
      # grant status is a pure function of utilization vs amount_cents:
      #   utilization < amount_cents  -> OPEN
      #   utilization == amount_cents -> EXHAUSTED  (boundary: >= amount triggers,
      #   but utilization can never exceed amount because creation rejects overflow)
      #   CLOSED is reachable only via the manual close transition.
      # Create-time gate: a new BudgetLine is rejected iff
      #   utilization + new_reservation > amount_cents   (strictly greater)
      #   -> equality is ALLOWED and drives the grant to EXHAUSTED.
    input_set: "BudgetLines of the grant in status OPEN or SETTLED (RELEASED lines contribute nothing)"
    constants: {}
    precision: "integer cents; exact equality at the EXHAUSTED boundary"

  - name: patron_loan_cap
    trigger: "Checkout, waitlist claim, and promotion eligibility"
    algorithm: aggregation
    formula: |
      active_loan_count = count(Loans of patron in status ACTIVE)
      has_verified_credential = exists AccessibilityCredential of patron in VERIFIED
      max_concurrent_loans = 50 if has_verified_credential else 5
      checkout_allowed = (patron.status == ACTIVE) and (active_loan_count < max_concurrent_loans)
      # Boundary: active_loan_count == max_concurrent_loans blocks (strict <).
    input_set: "Patron's loans (ACTIVE only) and credentials (VERIFIED only)"
    constants:
      BASE_CAP: 5
      ACCESSIBLE_CAP: 50
      SUSPENSION_STRIKE_THRESHOLD: 3
    precision: "integer counts"

  - name: renewal_window
    trigger: "POST /archive/loans/{id}/renew"
    algorithm: constraint_propagation
    formula: |
      # Renewal is legal iff ALL of:
      #   1. loan.renewed == false
      #   2. loan.loan_kind == STANDARD
      #   3. current_clock < loan.due_at                      (not yet expired)
      #   4. no OPEN or OFFERED WaitlistEntry for the work    (nobody waiting)
      #   5. current_clock + 14d <= loan.checked_out_at + 42d (absolute cap:
      #      total possession may not exceed 42 days from checkout)
      # On success: due_at := current_clock + 14 days (NOT due_at + 14 days;
      # renewing early does not bank unused time).
    input_set: "The loan, its work's waitlist entries (OPEN/OFFERED only), current logical clock"
    constants:
      RENEWAL_TERM_DAYS: 14
      ABSOLUTE_POSSESSION_CAP_DAYS: 42
    precision: "millisecond timestamps; boundary 3 and 5 use strict < and <= as written"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role (Anonymous calls carry no X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; for entity_backed ownership endpoints (Patron acting on own loans, waitlist entries, credentials, patron record), X-User-ID must equal the owning patron id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids and body foreign-key ids reference existing resources, validated left-to-right as declared in the endpoint input list"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body ids"
  - priority: 4
    category: state
    check: "Target resource is in a from-state that permits the requested transition (loan ACTIVE for return/renew; entry OFFERED for claim; job SCHEDULED for start, RUNNING for complete; request FILED/UNDER_REVIEW/LEGAL_HOLD as the transition demands; credential PENDING_REVIEW for VERIFY/REJECT and VERIFIED for REVOKE; batch OPEN for seal/item deposit; line OPEN for settle/release)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: rights-request begin-review requires X-User-ID != filed_by; rights-request decide requires X-User-ID != reviewed_by; credential decide requires X-User-ID != credential.patron_id"
    error_id: ERR_SO_DUTY_VIOLATION
    http_status: 403
    applies_to: "POST /archive/rights-requests/{id}/begin-review, POST /archive/rights-requests/{id}/decide, POST /archive/accessibility-credentials/{id}/decide"
  - priority: 6
    category: business_constraint
    check: "Schema-level input validity: required fields present, types correct, enum members valid, requests_per_minute in 1..120, publication_year in 1450..2100, storage_commitment_years >= 5, page_count >= 1, amount_cents > 0, budget_reservation_cents > 0, actual_spend_cents >= 0, scheduled_at strictly after current logical clock, subject_kind field consistency (work_id set iff WORK, url_prefix set iff CAPTURE_URL_PREFIX)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/action endpoints with input fields"
  - priority: 7
    category: business_constraint
    check: "Patron standing: checkout, waitlist join, and waitlist claim require patron.status == ACTIVE"
    error_id: ERR_PATRON_SUSPENDED
    http_status: 403
    applies_to: "POST /archive/loans, POST /archive/waitlist-entries, POST /archive/waitlist-entries/{id}/claim"
  - priority: 8
    category: business_constraint
    check: "Work availability gate: the loan's or waitlist entry's work must have availability == AVAILABLE (EMBARGOED or WITHDRAWN blocks new loans and new waitlist joins)"
    error_id: ERR_WORK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /archive/loans, POST /archive/waitlist-entries"
  - priority: 9
    category: business_constraint
    check: "Item lendability: item.status == LENDABLE and owning library status == ACTIVE; on claim, a lendable item of the work must still exist at claim time"
    error_id: ERR_ITEM_NOT_LENDABLE
    http_status: 409
    applies_to: "POST /archive/loans, POST /archive/waitlist-entries/{id}/claim"
  - priority: 10
    category: business_constraint
    check: "Waitlist priority: direct checkout is rejected when any WaitlistEntry for the item's work is in status OPEN or OFFERED; queue wins over walk-up"
    error_id: ERR_WAITLIST_PRIORITY
    http_status: 409
    applies_to: "POST /archive/loans"
  - priority: 11
    category: business_constraint
    check: "Duplicate possession: the patron must not already hold an ACTIVE loan on any item of the same work (aggregate one-copy-per-patron-per-work rule)"
    error_id: ERR_WORK_ALREADY_BORROWED
    http_status: 409
    applies_to: "POST /archive/loans"
  - priority: 12
    category: business_constraint
    check: "Loan cap: patron.active_loan_count < patron.max_concurrent_loans (boundary: equal blocks); SHORT_READ additionally requires a VERIFIED AccessibilityCredential"
    error_id: ERR_LOAN_CAP_REACHED
    http_status: 409
    applies_to: "POST /archive/loans, POST /archive/waitlist-entries/{id}/claim"
  - priority: 13
    category: business_constraint
    check: "SHORT_READ credential gate: loan_kind == SHORT_READ requires the patron to hold an AccessibilityCredential in status VERIFIED"
    error_id: ERR_ACCESS_CREDENTIAL_REQUIRED
    http_status: 403
    applies_to: "POST /archive/loans"
  - priority: 14
    category: business_temporal
    check: "Crawl start due: current logical clock >= job.scheduled_at"
    error_id: ERR_SCHEDULE_NOT_DUE
    http_status: 409
    applies_to: "POST /archive/crawl-jobs/{id}/start"
  - priority: 15
    category: business_temporal
    check: "Crawl exclusion gate: no ACTIVE ExclusionDirective with scope in {CRAWL_ONLY, BOTH} whose url_prefix prefixes the job's seed_url (checked at job creation AND at start)"
    error_id: ERR_CRAWL_EXCLUDED
    http_status: 409
    applies_to: "POST /archive/crawl-jobs, POST /archive/crawl-jobs/{id}/start"
  - priority: 16
    category: business_temporal
    check: "Offer window: claim requires current logical clock < offer_expires_at (expiry exactly at offer_expires_at is rejected; the sweep also flips it)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /archive/waitlist-entries/{id}/claim"
  - priority: 17
    category: business_temporal
    check: "Renewal rules: loan not yet renewed, loan_kind STANDARD, current clock < due_at, no OPEN/OFFERED waitlist entry for the work"
    error_id: ERR_LOAN_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST /archive/loans/{id}/renew"
  - priority: 18
    category: business_temporal
    check: "Renewal absolute cap: current logical clock + 14 days <= loan.checked_out_at + 42 days"
    error_id: ERR_RENEWAL_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /archive/loans/{id}/renew"
  - priority: 19
    category: business_fiscal
    check: "Grant capacity: grant.utilization + new budget_reservation_cents <= grant.amount_cents; equality is allowed and flips the grant to EXHAUSTED; strictly greater is rejected"
    error_id: ERR_GRANT_EXHAUSTED
    http_status: 409
    applies_to: "POST /archive/budget-lines"
  - priority: 20
    category: business_constraint
    check: "Library withdrawal gate: no ScanItem owned by the library is in status ON_LOAN"
    error_id: ERR_LIBRARY_HAS_ACTIVE_LOANS
    http_status: 409
    applies_to: "POST /archive/partner-libraries/{id}/withdraw"
  - priority: 21
    category: business_constraint
    check: "Uniqueness: patron email (case-insensitive), partner library_code, one OPEN/OFFERED waitlist entry per (work_id, patron_id)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /archive/patrons, POST /archive/partner-libraries, POST /archive/waitlist-entries"
  - priority: 22
    category: business_constraint
    check: "Batch seal requires item_count >= 1"
    error_id: ERR_SEAL_EMPTY_BATCH
    http_status: 409
    applies_to: "POST /archive/scan-batches/{id}/seal"
  - priority: 23
    category: business_constraint
    check: "OCC: expected_entry_version == WaitlistEntry.version on claim; expected_grant_version == FundingGrant.version on settle/release"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /archive/waitlist-entries/{id}/claim, POST /archive/budget-lines/{id}/settle, POST /archive/budget-lines/{id}/release"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- test-driving / system ---
  - method: POST
    path: "/archive/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time. All due_at/offer/schedule comparisons read this clock."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/archive/_sweeps/run"
    description: "Run the expiry sweep at the current logical clock: expire ACTIVE loans with due_at <= clock (by due_at ASC, then created_at ASC), then expire OFFERED waitlist entries with offer_expires_at <= clock (by offer_expires_at ASC), applying all cascades (strikes, suspension, promotions) after each individual expiry."
    roles: [Admin]
    code: 200
    input: []
    output: "{ expired_loan_ids: string[], expired_offer_ids: string[], suspended_patron_ids: string[], offered_entry_ids: string[] }"
    side_effects:
      - "Loan ACTIVE -> EXPIRED for each due loan (with item/patron/strike/suspension cascades)"
      - "WaitlistEntry OFFERED -> EXPIRED_OFFER for each lapsed offer (with re-promotion)"

  # --- patrons & accessibility ---
  - method: POST
    path: "/archive/patrons"
    description: "Register a patron account (self-service)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Patron
    side_effects: []
  - method: GET
    path: "/archive/patrons/{id}"
    description: "Read a patron. Patron role may read only its own record (X-User-ID == id)."
    roles: [Admin, Patron]
    code: 200
    input: []
    output: Patron
    side_effects: []
  - method: POST
    path: "/archive/accessibility-credentials"
    description: "Submit a print-disabled qualification credential for review; patron_id must equal X-User-ID"
    roles: [Patron]
    code: 201
    input: [patron_id, certifier_reference]
    output: AccessibilityCredential
    side_effects: []
  - method: GET
    path: "/archive/patrons/{id}/accessibility-credentials"
    description: "List a patron's accessibility credentials (sub-resource reverse read of AccessibilityCredential.patron_id), filterable by status"
    roles: [Admin, AccessibilityOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccessibilityCredential[]
    side_effects: []
  - method: GET
    path: "/archive/accessibility-credentials/{id}"
    description: "Read a single credential"
    roles: [Admin, AccessibilityOfficer]
    code: 200
    input: []
    output: AccessibilityCredential
    side_effects: []
  - method: POST
    path: "/archive/accessibility-credentials/{id}/decide"
    description: "Decide a credential: VERIFY or REJECT from PENDING_REVIEW; REVOKE from VERIFIED (decision enum: VERIFY | REJECT | REVOKE)"
    roles: [AccessibilityOfficer]
    code: 200
    input: [decision]
    output: AccessibilityCredential
    side_effects:
      - "VERIFY: patron.max_concurrent_loans recomputed to 50"
      - "REVOKE: patron.max_concurrent_loans recomputed (5 unless another VERIFIED credential exists)"

  # --- partner libraries ---
  - method: POST
    path: "/archive/partner-libraries"
    description: "Register a partner library with a long-term storage commitment (>= 5 years)"
    roles: [LibraryAdmin]
    code: 201
    input: [library_code, display_name, storage_commitment_years]
    output: PartnerLibrary
    side_effects: []
  - method: GET
    path: "/archive/partner-libraries/{id}"
    description: "Read a partner library"
    roles: [Admin, LibraryAdmin]
    code: 200
    input: []
    output: PartnerLibrary
    side_effects: []
  - method: POST
    path: "/archive/partner-libraries/{id}/withdraw"
    description: "Withdraw a partner library: allowed only when none of its items is ON_LOAN; retires all its LENDABLE and DEPOSITED items"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: PartnerLibrary
    side_effects:
      - "library.status -> WITHDRAWN"
      - "every owned ScanItem in LENDABLE or DEPOSITED -> RETIRED"

  # --- works ---
  - method: POST
    path: "/archive/works"
    description: "Catalog a bibliographic work"
    roles: [Admin]
    code: 201
    input: [title, author, publication_year]
    output: Work
    side_effects:
      - "work.availability initialized to AVAILABLE"
  - method: GET
    path: "/archive/works/{id}"
    description: "Read a work including its computed availability"
    roles: [Admin, LibraryAdmin, Patron]
    code: 200
    input: []
    output: Work
    side_effects: []

  # --- scan batches & items ---
  - method: POST
    path: "/archive/scan-batches"
    description: "Open a physical scanning batch"
    roles: [ScanOperator]
    code: 201
    input: [operator_code]
    output: ScanBatch
    side_effects: []
  - method: GET
    path: "/archive/scan-batches/{id}"
    description: "Read a scan batch including item_count and page_count"
    roles: [Admin, ScanOperator]
    code: 200
    input: []
    output: ScanBatch
    side_effects: []
  - method: POST
    path: "/archive/scan-batches/{id}/seal"
    description: "Seal a non-empty batch; evaluates every DEPOSITED item for promotion to LENDABLE"
    roles: [ScanOperator]
    code: 200
    input: []
    output: ScanBatch
    side_effects:
      - "batch.status -> SEALED"
      - "per item: DEPOSITED -> LENDABLE when work AVAILABLE and library ACTIVE, then waitlist promotion per affected work"
  - method: POST
    path: "/archive/items"
    description: "Deposit a scanned item into an OPEN batch (condition grade recorded at intake)"
    roles: [ScanOperator]
    code: 201
    input: [batch_id, work_id, owning_library_id, page_count, condition_grade]
    output: ScanItem
    side_effects:
      - "batch.item_count += 1; batch.page_count += page_count"
  - method: GET
    path: "/archive/items/{id}"
    description: "Read a single scan item including its computed lendable flag"
    roles: [Admin, LibraryAdmin, ScanOperator, Patron]
    code: 200
    input: []
    output: ScanItem
    side_effects: []
  - method: GET
    path: "/archive/works/{id}/items"
    description: "List a work's scan items (sub-resource reverse read of ScanItem.work_id), filterable by batch_id, owning_library_id, status"
    roles: [Admin, LibraryAdmin, ScanOperator, Patron]
    code: 200
    input: ["batch_id?", "owning_library_id?", "status?", "limit?", "offset?"]
    output: ScanItem[]
    side_effects: []
  - method: GET
    path: "/archive/scan-batches/{id}/items"
    description: "List a batch's scan items (sub-resource reverse read of ScanItem.batch_id), filterable by status"
    roles: [Admin, ScanOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScanItem[]
    side_effects: []
  - method: GET
    path: "/archive/partner-libraries/{id}/items"
    description: "List a library's scan items (sub-resource reverse read of ScanItem.owning_library_id), filterable by status"
    roles: [Admin, LibraryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScanItem[]
    side_effects: []
  # --- loans ---
  - method: POST
    path: "/archive/loans"
    description: "Direct checkout of a lendable item (blocked when the work has a live waitlist)"
    roles: [Patron]
    code: 201
    input: [item_id, patron_id, loan_kind]
    output: Loan
    side_effects:
      - "item.status: LENDABLE -> ON_LOAN"
      - "patron.active_loan_count += 1"
      - "due_at := clock + 14 days (STANDARD) or clock + 1 hour (SHORT_READ)"
  - method: GET
    path: "/archive/patrons/{id}/loans"
    description: "List a patron's loans (sub-resource reverse read of Loan.patron_id), filterable by status. Patron role may list only its own loans (path id must equal X-User-ID)."
    roles: [Admin, Patron]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/archive/items/{id}/loans"
    description: "List an item's loans (sub-resource reverse read of Loan.item_id), filterable by status"
    roles: [Admin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/archive/loans/{id}"
    description: "Read a single loan. Patron role may read only its own loans."
    roles: [Admin, Patron]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/archive/loans/{id}/return"
    description: "Return an ACTIVE loan (borrower only)"
    roles: [Patron]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan ACTIVE -> RETURNED with item/patron/promotion side effects"
  - method: POST
    path: "/archive/loans/{id}/renew"
    description: "Renew an ACTIVE STANDARD loan once: due_at := clock + 14 days, capped at checked_out_at + 42 days"
    roles: [Patron]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "loan.renewed := true; loan.due_at recomputed"

  # --- waitlist ---
  - method: POST
    path: "/archive/waitlist-entries"
    description: "Join the waitlist for a work; patron_id must equal X-User-ID"
    roles: [Patron]
    code: 201
    input: [work_id, patron_id]
    output: WaitlistEntry
    side_effects:
      - "run waitlist promotion for the work (a lendable copy may already exist)"
  - method: GET
    path: "/archive/works/{id}/waitlist-entries"
    description: "List a work's waitlist entries ordered by created_at ASC (sub-resource reverse read of WaitlistEntry.work_id), filterable by patron_id and status. Patron role may filter only to its own entries (patron_id must equal X-User-ID when role is Patron)."
    roles: [Admin, Patron]
    code: 200
    input: ["patron_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/archive/patrons/{id}/waitlist-entries"
    description: "List a patron's waitlist entries (sub-resource reverse read of WaitlistEntry.patron_id), filterable by status. Patron role may list only its own entries."
    roles: [Admin, Patron]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/archive/waitlist-entries/{id}"
    description: "Read a single waitlist entry including offer timestamps and OCC version. Patron role may read only its own entries."
    roles: [Admin, Patron]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: POST
    path: "/archive/waitlist-entries/{id}/claim"
    description: "Claim an OFFERED waitlist entry; creates a STANDARD loan on the earliest-created lendable item of the work (OCC on entry version)"
    roles: [Patron]
    code: 201
    input: [expected_entry_version]
    output: Loan
    side_effects:
      - "entry OFFERED -> CLAIMED; increments WaitlistEntry.version by 1"
      - "selected item LENDABLE -> ON_LOAN; patron.active_loan_count += 1"
      - "run waitlist promotion for the work (remaining lendable copies feed the queue)"

  # --- crawl jobs, captures, playback, exclusions ---
  - method: POST
    path: "/archive/crawl-jobs"
    description: "Schedule a crawl job; scheduled_at must be strictly in the future; rejected outright when an ACTIVE crawl-scoped exclusion covers the seed_url"
    roles: [CrawlOperator]
    code: 201
    input: [seed_url, scheduled_at, requests_per_minute, "at_risk?"]
    output: CrawlJob
    side_effects: []
  - method: GET
    path: "/archive/crawl-jobs/{id}"
    description: "Read a crawl job including captures_produced, duplicates_skipped, storage_cost_cents"
    roles: [Admin, CrawlOperator]
    code: 200
    input: []
    output: CrawlJob
    side_effects: []
  - method: POST
    path: "/archive/crawl-jobs/{id}/start"
    description: "Start a SCHEDULED job once the logical clock reaches scheduled_at and no crawl-scoped exclusion covers the seed"
    roles: [CrawlOperator]
    code: 200
    input: []
    output: CrawlJob
    side_effects:
      - "job.status -> RUNNING"
  - method: POST
    path: "/archive/crawl-jobs/{id}/complete"
    description: "Complete a RUNNING job; recomputes captures_produced and storage_cost_cents"
    roles: [CrawlOperator]
    code: 200
    input: []
    output: CrawlJob
    side_effects:
      - "job.status -> COMPLETED"
      - "recompute captures_produced and storage_cost_cents (capture_dedupe_and_storage_cost)"
  - method: POST
    path: "/archive/captures"
    description: "Record a capture against a RUNNING crawl job. Dedupe: if a Capture with the same (url, content_hash) already exists, no row is created, that job's duplicates_skipped += 1, and the pre-existing Capture is returned with code 200 (new rows return 201)."
    roles: [CrawlOperator]
    code: 201
    input: [crawl_job_id, url, content_hash, has_dynamic_content]
    output: Capture
    side_effects:
      - "on new row: the job's captures_produced += 1"
      - "on dedupe hit: the job's duplicates_skipped += 1"
  - method: GET
    path: "/archive/crawl-jobs/{id}/captures"
    description: "List a crawl job's captures (sub-resource reverse read of Capture.crawl_job_id), filterable by url and playback_status"
    roles: [Admin, CrawlOperator]
    code: 200
    input: ["url?", "playback_status?", "limit?", "offset?"]
    output: Capture[]
    side_effects: []
  - method: GET
    path: "/archive/captures/{id}"
    description: "Read a single capture"
    roles: [Admin, CrawlOperator]
    code: 200
    input: []
    output: Capture
    side_effects: []
  - method: GET
    path: "/archive/playback"
    description: "Resolve playback for a url per calculations.playback_resolution; returns mode FULL | DEGRADED | SUPPRESSED | NOT_FOUND"
    roles: [Admin, CrawlOperator, Patron, LibraryAdmin]
    code: 200
    input: [url, "requested_at?"]
    output: "{ mode: string, capture_id: string|null, captured_at: datetime|null, has_dynamic_content: boolean|null }"
    side_effects: []
  - method: POST
    path: "/archive/exclusion-directives"
    description: "Create an exclusion directive; immediately blocks matching SCHEDULED crawl jobs and suppresses matching captures when scope covers playback"
    roles: [CrawlOperator]
    code: 201
    input: [url_prefix, scope, reason]
    output: "{ directive_id: string, blocked_job_ids: string[], suppressed_capture_count: integer }"
    side_effects:
      - "SCHEDULED CrawlJobs whose seed_url starts with url_prefix and scope in {CRAWL_ONLY, BOTH}: -> BLOCKED"
      - "scope in {PLAYBACK_ONLY, BOTH}: Captures whose url starts with url_prefix -> playback_status SUPPRESSED"
  - method: POST
    path: "/archive/exclusion-directives/{id}/retract"
    description: "Retract an ACTIVE directive; restores playback for captures no longer covered by any other ACTIVE directive or upheld rights request"
    roles: [CrawlOperator]
    code: 200
    input: []
    output: ExclusionDirective
    side_effects:
      - "directive.status -> RETRACTED"
      - "per state_machines.ExclusionDirective.ACTIVE_to_RETRACTED: captures no longer covered flip playback_status back to PLAYABLE"

  # --- rights requests ---
  - method: POST
    path: "/archive/rights-requests"
    description: "File a rights-holder removal request against a work or a capture URL prefix; filed_by := X-User-ID"
    roles: [LegalReviewer]
    code: 201
    input: [subject_kind, "work_id?", "url_prefix?", claimant_name]
    output: RightsRequest
    side_effects: []
  - method: GET
    path: "/archive/works/{id}/rights-requests"
    description: "List a work's rights requests (sub-resource reverse read of RightsRequest.work_id), filterable by status and subject_kind"
    roles: [Admin, LegalReviewer]
    code: 200
    input: ["status?", "subject_kind?", "limit?", "offset?"]
    output: RightsRequest[]
    side_effects: []
  - method: GET
    path: "/archive/rights-requests/{id}"
    description: "Read a single rights request including filed_by, reviewed_by, decided_by"
    roles: [Admin, LegalReviewer]
    code: 200
    input: []
    output: RightsRequest
    side_effects: []
  - method: POST
    path: "/archive/rights-requests/{id}/begin-review"
    description: "Move FILED -> UNDER_REVIEW; reviewer must differ from filer; WORK subjects embargo the work"
    roles: [LegalReviewer]
    code: 200
    input: []
    output: RightsRequest
    side_effects:
      - "WORK subject: work.availability -> EMBARGOED"
  - method: POST
    path: "/archive/rights-requests/{id}/escalate-hold"
    description: "Move UNDER_REVIEW -> LEGAL_HOLD (assigned reviewer only); triggers the hard-withdrawal cascade"
    roles: [LegalReviewer]
    code: 200
    input: []
    output: RightsRequest
    side_effects:
      - "WORK subject: work.availability -> WITHDRAWN; ACTIVE loans on the work's items -> REVOKED with full item/patron/promotion cascades"
      - "CAPTURE_URL_PREFIX subject: matching captures -> SUPPRESSED"
  - method: POST
    path: "/archive/rights-requests/{id}/decide"
    description: "Final decision UPHOLD or DISMISS from UNDER_REVIEW or LEGAL_HOLD; decider must differ from reviewer"
    roles: [LegalReviewer]
    code: 200
    input: [decision]
    output: RightsRequest
    side_effects:
      - "UPHOLD: -> UPHELD_REMOVED with the same cascades as escalate-hold"
      - "DISMISS: -> DISMISSED with work availability recompute and possible item re-lendability"

  # --- funding grants & budget lines ---
  - method: POST
    path: "/archive/funding-grants"
    description: "Record a donation grant for infrastructure funding"
    roles: [FinanceAdmin]
    code: 201
    input: [donor_name, amount_cents]
    output: FundingGrant
    side_effects: []
  - method: GET
    path: "/archive/funding-grants/{id}"
    description: "Read a grant including reserved_cents, spent_cents, status, and OCC version"
    roles: [FinanceAdmin, Admin]
    code: 200
    input: []
    output: FundingGrant
    side_effects: []
  - method: POST
    path: "/archive/budget-lines"
    description: "Reserve infrastructure budget against a grant; rejected when it would push utilization above amount_cents"
    roles: [FinanceAdmin]
    code: 201
    input: [grant_id, category, budget_reservation_cents]
    output: BudgetLine
    side_effects:
      - "grant.reserved_cents += budget_reservation_cents"
      - "grant.status recomputed (OPEN <-> EXHAUSTED); increments FundingGrant.version by 1"
  - method: GET
    path: "/archive/funding-grants/{id}/budget-lines"
    description: "List a grant's budget lines (sub-resource reverse read of BudgetLine.grant_id), filterable by status and category"
    roles: [FinanceAdmin, Admin]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []
  - method: GET
    path: "/archive/budget-lines/{id}"
    description: "Read a single budget line"
    roles: [FinanceAdmin, Admin]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []
  - method: POST
    path: "/archive/budget-lines/{id}/settle"
    description: "Settle an OPEN line at its actual spend (OCC on grant version)"
    roles: [FinanceAdmin]
    code: 200
    input: [actual_spend_cents, expected_grant_version]
    output: BudgetLine
    side_effects:
      - "line OPEN -> SETTLED"
      - "grant.reserved_cents -= budget_reservation_cents; grant.spent_cents += actual_spend_cents"
      - "grant.status recomputed; increments FundingGrant.version by 1"
  - method: POST
    path: "/archive/budget-lines/{id}/release"
    description: "Release an OPEN line, returning its reservation to the grant (OCC on grant version)"
    roles: [FinanceAdmin]
    code: 200
    input: [expected_grant_version]
    output: BudgetLine
    side_effects:
      - "line OPEN -> RELEASED"
      - "grant.reserved_cents -= budget_reservation_cents"
      - "grant.status recomputed; increments FundingGrant.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership mismatch (patron acting on another patron's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Schema/enum/range/timestamp/subject-consistency violation on input fields" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a from-state that permits the requested transition" }
  - { id: ERR_SO_DUTY_VIOLATION, http: 403, condition: "Segregation-of-duties breach: filer reviewing own rights request, reviewer deciding own review, or officer deciding own credential" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PATRON_SUSPENDED, http: 403, condition: "Checkout, waitlist join, or claim attempted by a SUSPENDED patron" }
  - { id: ERR_WORK_UNAVAILABLE, http: 409, condition: "Work availability is EMBARGOED or WITHDRAWN; new loans and waitlist joins blocked" }
  - { id: ERR_ITEM_NOT_LENDABLE, http: 409, condition: "Item not in LENDABLE status, owning library WITHDRAWN, or no lendable item of the work remains at claim time" }
  - { id: ERR_WAITLIST_PRIORITY, http: 409, condition: "Direct checkout blocked because an OPEN or OFFERED waitlist entry exists for the work" }
  - { id: ERR_WORK_ALREADY_BORROWED, http: 409, condition: "Patron already holds an ACTIVE loan on another item of the same work" }
  - { id: ERR_LOAN_CAP_REACHED, http: 409, condition: "patron.active_loan_count == patron.max_concurrent_loans at checkout or claim" }
  - { id: ERR_ACCESS_CREDENTIAL_REQUIRED, http: 403, condition: "SHORT_READ loan without a VERIFIED AccessibilityCredential" }
  - { id: ERR_SCHEDULE_NOT_DUE, http: 409, condition: "Crawl start before scheduled_at per the logical clock" }
  - { id: ERR_CRAWL_EXCLUDED, http: 409, condition: "ACTIVE crawl-scoped ExclusionDirective covers the seed_url at create or start" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Claim at or after offer_expires_at" }
  - { id: ERR_LOAN_NOT_RENEWABLE, http: 409, condition: "Renewal denied: already renewed, SHORT_READ kind, loan overdue, or live waitlist for the work" }
  - { id: ERR_RENEWAL_WINDOW_EXCEEDED, http: 409, condition: "Renewal would extend possession beyond checked_out_at + 42 days" }
  - { id: ERR_GRANT_EXHAUSTED, http: 409, condition: "Budget reservation would push grant utilization strictly above amount_cents" }
  - { id: ERR_LIBRARY_HAS_ACTIVE_LOANS, http: 409, condition: "Library withdrawal blocked by ON_LOAN items" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Duplicate patron email, duplicate library_code, or duplicate live waitlist entry for (work_id, patron_id)" }
  - { id: ERR_SEAL_EMPTY_BATCH, http: 409, condition: "Sealing a batch with item_count == 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-service caller"
    identity: opaque
    exclusive_operations:
      - "POST /archive/patrons"
    shared_operations: []
  - name: Admin
    description: "Platform administrator; operates the logical clock and sweeps, catalogs works, reads anything"
    identity: opaque
    exclusive_operations:
      - "POST /archive/_clock/set_current_utc"
      - "POST /archive/_sweeps/run"
      - "POST /archive/works"
    shared_operations:
      - "GET reads shared with operator roles (patrons, credentials, items, loans, waitlist, captures, rights-requests, grants, budget-lines, playback)"
  - name: Patron
    description: "Registered patron; borrows, returns, renews, joins/claims waitlists, submits own credential"
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /archive/loans"
      - "POST /archive/loans/{id}/return"
      - "POST /archive/loans/{id}/renew"
      - "POST /archive/waitlist-entries"
      - "POST /archive/waitlist-entries/{id}/claim"
      - "POST /archive/accessibility-credentials"
    shared_operations:
      - "GET /archive/patrons/{id} (self only)"
      - "GET /archive/patrons/{id}/loans, GET /archive/patrons/{id}/waitlist-entries, GET /archive/works/{id}/waitlist-entries (own records only)"
      - "GET /archive/works/{id}, GET /archive/works/{id}/items, GET /archive/items/{id}, GET /archive/playback"
  - name: AccessibilityOfficer
    description: "Verifies print-disabled qualification credentials; may never decide their own"
    identity: opaque
    exclusive_operations:
      - "POST /archive/accessibility-credentials/{id}/decide"
    shared_operations:
      - "GET /archive/patrons/{id}/accessibility-credentials, GET /archive/accessibility-credentials/{id}"
  - name: LibraryAdmin
    description: "Partner-library administrator; registers libraries, executes withdrawals, retires nothing directly"
    identity: opaque
    exclusive_operations:
      - "POST /archive/partner-libraries"
      - "POST /archive/partner-libraries/{id}/withdraw"
    shared_operations:
      - "GET /archive/works/{id}, GET /archive/works/{id}/items, GET /archive/partner-libraries/{id}/items, GET /archive/items/{id}, GET /archive/playback"
  - name: ScanOperator
    description: "Scan-center operator; opens/seals batches and deposits scanned items"
    identity: opaque
    exclusive_operations:
      - "POST /archive/scan-batches"
      - "POST /archive/scan-batches/{id}/seal"
      - "POST /archive/items"
    shared_operations:
      - "GET /archive/scan-batches/{id}, GET /archive/scan-batches/{id}/items, GET /archive/items/{id}"
  - name: CrawlOperator
    description: "Web-crawl operator; schedules, starts, completes crawls; records captures; manages exclusion directives"
    identity: opaque
    exclusive_operations:
      - "POST /archive/crawl-jobs"
      - "POST /archive/crawl-jobs/{id}/start"
      - "POST /archive/crawl-jobs/{id}/complete"
      - "POST /archive/captures"
      - "POST /archive/exclusion-directives"
      - "POST /archive/exclusion-directives/{id}/retract"
    shared_operations:
      - "GET /archive/crawl-jobs/{id}, GET /archive/crawl-jobs/{id}/captures, GET /archive/captures/{id}, GET /archive/playback"
  - name: LegalReviewer
    description: "Rights desk; files, reviews, escalates, and decides rights requests under segregation-of-duties rules"
    identity: opaque
    exclusive_operations:
      - "POST /archive/rights-requests"
      - "POST /archive/rights-requests/{id}/begin-review"
