          Each rung of the clawback ladder enforces its own precondition independently: ordering recovery before
          analysis is ERR_EVENT_STATE_INVALID, recovering a CALCULATED determination is ERR_DETERMINATION_STATE_INVALID,
          recovering a NOTICED determination that the officer has not acknowledged is ERR_DETERMINATION_NOT_ACKNOWLEDGED,
