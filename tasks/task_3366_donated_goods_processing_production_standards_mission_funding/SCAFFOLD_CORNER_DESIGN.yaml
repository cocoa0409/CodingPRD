  # ===========================================================================
  - section: calculations
    instances:

      - name: markdown_event_same_week_rerun_rejected
        claim_type: "Violation → Error"
        grounds: [calculations.markdown_pricing, errors.ERR_MARKDOWN_WEEK_ALREADY_RUN, "validations[priority=9]"]
        distinguishing_aspect: "One markdown event per org per week: with last_markdown_week == current week_index, a second event in the same week is rejected with ERR_MARKDOWN_WEEK_ALREADY_RUN; an empty org may still run its first event."
        test_recipe:
          setup: ["Clock at 2026-01-05 (week 0). Fresh org with no items."]
          setup_api_calls:
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org MW", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first event succeeds with applied_week == 0, marked_down_count == 0, pulled_count == 0"
            - "second event in the same week rejected with ERR_MARKDOWN_WEEK_ALREADY_RUN (${err})"

      - name: markdown_event_leaves_same_week_items_untouched
        claim_type: Input Set Filtering
        grounds: [calculations.markdown_pricing, entities.DonatedItem.fields.floor_week]
        distinguishing_aspect: "The markdown sweep only touches ON_FLOOR items with age >= 1 week: an item priced in the event's own week keeps markdown_step 0 and its full price."
        test_recipe:
          setup: ["Clock at 2026-01-05 (week 0). Org with standard; one grade-A item priced in week 0 (price 1000, floor_week 0)."]
          setup_api_calls:
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SW", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site SW", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DW", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          assert:
            - "event reports applied_week == 0, marked_down_count == 0, pulled_count == 0"
            - "DonatedItem.${it} remains ON_FLOOR with markdown_step == 0 and current_selling_price_cents == 1000"

      - name: textile_bale_minimum_weight_boundary
        claim_type: Correct Result
        grounds: [calculations.salvage_pricing, errors.ERR_BALE_UNDERWEIGHT, "validations[priority=14]"]
        distinguishing_aspect: "The 50-lb bale minimum is inclusive: a 49-lb TEXTILE_BALE sale is rejected with ERR_BALE_UNDERWEIGHT while a 50-lb bale sells for exactly 600 cents (50 * 12)."
        test_recipe:
