              as: StationAdmin
              captures: { drv12_id: $.data.id, drv12_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv12_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv12_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv12_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv12_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor12_id}", membership_id: "${mem12_id}", drive_id: "${drv12_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug4_id}" }
              as: PhoneVolunteer
              captures: { plg12a_id: $.data.id }
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor12_id}", membership_id: "${mem12_id}", drive_id: "${drv12_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug4_id}" }
