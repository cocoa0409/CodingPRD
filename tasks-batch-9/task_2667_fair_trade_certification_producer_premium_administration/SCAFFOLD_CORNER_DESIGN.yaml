            - "GET /fairtrade/supply-chain-nodes?holder_id=${prod_id} returns exactly 1 row, ${ok_node_id}"

  # ===================================================================
  - section: state_machines
    instances:
      - name: certify_moves_pending_holder_to_certified_and_activates_registered_nodes
        claim_type: valid_transition
        grounds:
          - state_machines.CertificateHolder.PENDING_to_CERTIFIED
          - state_machines.SupplyChainNode.REGISTERED_to_ACTIVE
          - endpoints.POST_/fairtrade/certificate-holders/{id}/certify
        distinguishing_aspect: "The certify trigger moves the holder PENDING -> CERTIFIED, stamps certified_at from the logical clock, and cascades REGISTERED -> ACTIVE onto the node that was registered while the holder was still PENDING."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PENDING PRODUCER_ORG holder with one REGISTERED cooperative node"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: CertificationOfficer
              captures: { node_id: $.data.id, node_v0: $.data.version }
          trigger:
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
          assert:
            - "HTTP 200 and CertificateHolder.${prod_id}.certificate_status == CERTIFIED"
            - "CertificateHolder.${prod_id}.certified_at == 2026-08-01T00:00:00Z"
            - "SupplyChainNode.${node_id}.status == ACTIVE, cascaded by the certify transition"
            - "SupplyChainNode.${node_id}.version == ${node_v0} + 1, because the cascade is a write on the node"
            - "SupplyChainNode.${node_id}.certified_input_kg == 0.000 and available_credit_kg == 0.000, untouched by the status cascade"

      - name: holder_node_and_audit_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.CertificateHolder.initial_state
          - state_machines.SupplyChainNode.initial_state
          - state_machines.Audit.initial_state
        distinguishing_aspect: "A freshly created holder is PENDING, a node created under a PENDING holder is REGISTERED rather than ACTIVE, and a freshly scheduled audit is SCHEDULED with both nonconformity counters at 0."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: CertificationOfficer
              captures: { node_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${prod_id}", auditor_user_id: "auditor-1", audit_type: "INITIAL", window_start: "2026-08-05", window_end: "2026-08-07" }
              as: CertificationOfficer
              captures: { audit_id: $.data.id }
          assert:
            - "immediately after the create, CertificateHolder.${prod_id}.certificate_status == PENDING, the declared initial_state"
            - "immediately after the create, SupplyChainNode.${node_id}.status == REGISTERED, because the owning holder was PENDING"
            - "Audit.${audit_id}.status == SCHEDULED with nonconformity_count == 0, open_nonconformity_count == 0, started_at == null and closed_at == null"
            - "Audit.${audit_id}.auditor_user_id == auditor-1 and audit_type == INITIAL"
            - "CertificateHolder.${prod_id}.next_audit_due_at == null after the audit is scheduled, because no audit of this holder is CLOSED yet"

      - name: decertified_holder_cannot_be_certified_suspended_or_reinstated
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CertificateHolder.terminal_states
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations.priority_11
        distinguishing_aspect: "From the terminal DECERTIFIED state all five holder triggers — certify, suspend, reinstate, transition and decertify — return 409 ERR_INVALID_STATE_TRANSITION and leave the holder's version untouched."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one holder decertified straight out of PENDING"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/decertify"
              payload: { reason: "MANUAL" }
              as: CertificationOfficer
              captures: { dead_v: $.data.version }
          trigger:
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/suspend"
              payload: { reason: "MANUAL" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/reinstate"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/transition"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/decertify"
              payload: { reason: "MANUAL" }
              as: CertificationOfficer
          assert:
            - "all five calls return HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "CertificateHolder.${prod_id}.certificate_status == DECERTIFIED throughout"
            - "CertificateHolder.${prod_id}.version == ${dead_v} after all five refusals, so no refused trigger wrote anything"
            - "CertificateHolder.${prod_id}.label_license_status == TERMINATED, set once by the decertify that reached the terminal state"

