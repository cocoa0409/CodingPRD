            - "Invoice.${inv_id}.invoice_state == VOID at the end"

      - name: expansion_sizing_and_approval_reject_infeasible_and_uneconomic_candidates
        claim_type: Violation → Error
        grounds:
          - validations[priority 16 ERR_NO_FEASIBLE_PIPE_SIZE]
          - validations[priority 17 ERR_PROJECT_NPV_NEGATIVE]
          - calculations.expansion_sizing_and_npv
          - state_machines.ExpansionProject
        distinguishing_aspect: "Two different fiscal and physical guards fire on the same lifecycle: a 40000.0 kW request at a 10.0 K delta-T needs 3439.381 cubic metres per hour, which busts both the velocity and pressure-drop limits at every standard diameter and leaves the project in SCREENING with a 422; a long 4500.0 m route for only 300.0 kW sizes fine at 80 mm but yields a -3870030.24 net present value, so approval is refused with a different 422 and only REJECT is available."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-X and RateSchedule RS-C."
            - "ExpansionProject P3 (40000.0 kW, delta-T 10.0, route 600.0 m) and P2 (300.0 kW, delta-T 30.0, route 4500.0 m, 500.0 MWh a year at 55.00 marginal cost), both SCREENING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-X", name: "Expansion Loop X", service_mode: "HEATING", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 12000.0 }
              as: SystemController
              captures: { loop_x_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/expansion-projects"
              payload: { loop_id: "${loop_x_id}", rate_schedule_id: "${rs_c_id}", candidate_customer_name: "Mega Process Park", customer_class: "COMMERCIAL_OFFICE", requested_capacity_kw: 40000.0, route_length_m: 600.0, assumed_annual_energy_mwh: 9000.0, assumed_marginal_cost_per_mwh: 40.00, design_delta_t_c: 10.0 }
              as: NetworkEngineer
              captures: { proj_p3_id: $.data.id }
            - call: "POST /district-energy/expansion-projects"
              payload: { loop_id: "${loop_x_id}", rate_schedule_id: "${rs_c_id}", candidate_customer_name: "Far Meadow Lodge", customer_class: "COMMERCIAL_OFFICE", requested_capacity_kw: 300.0, route_length_m: 4500.0, assumed_annual_energy_mwh: 500.0, assumed_marginal_cost_per_mwh: 55.00, design_delta_t_c: 30.0 }
              as: NetworkEngineer
              captures: { proj_p2_id: $.data.id }
          trigger:
            - call: "POST /district-energy/expansion-projects/${proj_p3_id}/size"
              payload: {}
              as: NetworkEngineer
              captures: { e_no_pipe: $.data.error_id }
            - call: "POST /district-energy/expansion-projects/${proj_p2_id}/size"
              payload: {}
              as: NetworkEngineer
              captures: { p2_flow: $.data.design_flow_m3_per_h, p2_diam: $.data.selected_diameter_mm, p2_capex: $.data.estimated_capex, p2_margin: $.data.annual_net_margin, p2_npv: $.data.npv }
            - call: "POST /district-energy/expansion-projects/${proj_p2_id}/decision"
              payload: { decision: "APPROVE", decision_note: "trying to force it through" }
              as: SystemController
              captures: { e_npv: $.data.error_id }
            - call: "POST /district-energy/expansion-projects/${proj_p2_id}/decision"
              payload: { decision: "REJECT", decision_note: "route cost cannot be recovered" }
              as: SystemController
              captures: { p2_state: $.data.project_state }
          assert:
            - "the P3 size response status is 422 and ${e_no_pipe} == ERR_NO_FEASIBLE_PIPE_SIZE"
            - "ExpansionProject.${proj_p3_id}.project_state == SCREENING with selected_diameter_mm still null and npv still 0.0"
            - "the P2 size response status is 200 with ${p2_flow} == 8.598 and ${p2_diam} == 80"
            - "${p2_capex} == 3505000.00 and ${p2_margin} == -31825.00"
            - "${p2_npv} == -3870030.24"
            - "the APPROVE response status is 422 and ${e_npv} == ERR_PROJECT_NPV_NEGATIVE"
            - "ExpansionProject.${proj_p2_id}.project_state == SIZED after the refused approval"
            - "the REJECT response status is 200 and ${p2_state} == REJECTED"

      - name: approval_refuses_a_plan_that_leans_on_a_single_fuel_even_with_ample_reserve
        claim_type: Violation → Error
        grounds:
          - validations[priority 12 ERR_FUEL_DIVERSITY_BREACH]
