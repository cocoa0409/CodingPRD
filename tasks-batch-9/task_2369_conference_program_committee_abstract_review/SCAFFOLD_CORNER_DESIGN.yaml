      - name: exclusive_operations_are_rejected_for_every_other_role
        claim_type: role_denied_other_roles_exclusive_operations
        grounds:
          - roles.ConferenceAdmin.exclusive_operations
          - roles.ProgramChair.exclusive_operations
          - roles.Author.exclusive_operations
          - roles.PressOfficer.exclusive_operations
          - validations.p2
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Every role's exclusive list is probed from a role that must not hold it,
          including the two directions people get wrong: a ConferenceAdmin is the
          most privileged actor for setup yet still cannot touch the press lane, and
          a ProgramChair cannot create the conference it chairs. The role model is
          segregation_of_duties, not hierarchical_override, so no role inherits
          another's writes. Each rejection is checked to be p2 (403) and to leave no
          trace, which distinguishes a genuine authorization gate from an
          implementation that performs the write and then reports 403.
