  - rule_id: non_linear_state_machine
    instances:
      - name: registration_parallel_state_axes
        grounds:
          - state_machines.Registration
          - state_machines.RegistrationPaymentAxis
          - entities.Registration.fields.enrollment_status
          - entities.Registration.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: a payment transition (PENDING -> PAID) leaves the
          enrollment axis untouched (ENROLLED), and a waitlist promotion moves the enrollment axis
          (WAITLISTED -> ENROLLED) while the payment axis stays PENDING with a fresh 48h deadline —
          the two axes evolve independently except at pinned interaction points.
