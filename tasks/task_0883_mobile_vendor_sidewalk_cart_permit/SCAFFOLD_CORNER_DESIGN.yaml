  # Validations — required auth, ownership, eligibility, payment, insufficient coverage
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role/X-User-ID -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
          trigger:
            - { call: "POST /vendors", payload: { legal_name: "X", contact_email: "x@x.com", seniority_years: 0 }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response code 401; error_id == ERR_UNAUTHENTICATED"

      - name: vendor_creates_cart_for_other_vendor_ownership
        claim_type: Violation → Error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP]"]
        distinguishing_aspect: "Vendor A (X-User-ID=va) POSTing a cart with vendor_id=vb -> ERR_OWNERSHIP (403)."
        test_recipe:
          setup: ["Two vendors va and vb; commissary c1."]
