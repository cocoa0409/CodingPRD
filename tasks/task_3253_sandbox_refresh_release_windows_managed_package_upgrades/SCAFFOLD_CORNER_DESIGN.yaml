              captures: { env_sod_s_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "SoD Target One", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_sod_t1_id: $.data.id, env_sod_t1_v: $.data.version }
            - call: "POST /platform/environments"
              payload: { name: "SoD Target Two", type: "DEVELOPER", aperture_limit: 5 }
