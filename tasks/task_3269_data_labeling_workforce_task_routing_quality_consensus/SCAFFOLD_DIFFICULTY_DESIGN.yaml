            - "the dispatch is therefore rejected with ERR_INVALID_STATE at status 409 purely because the parent unit is not ACTIVE, even though the piece itself is RELEASED"
            - "activating the unit directly is rejected with ERR_COVERAGE_WINDOW_OVERLAP at status 409, so the piece is unreachable until the window is corrected at creation time"
            - "a second unit whose coverage window ends exactly at 2026-09-20T00:00:00Z activates successfully, proving the interval rule is half-open"

