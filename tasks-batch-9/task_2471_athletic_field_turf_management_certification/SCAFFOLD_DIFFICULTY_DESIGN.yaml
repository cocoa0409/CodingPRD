# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2471 - Athletic Field Turf Management & Certification
#
# Every literal in every `assert:` line below was produced by executing the
# corresponding §1.3 `formula:` as Decimal code with ROUND_HALF_UP, against the
# inputs pinned in the same instance's `setup:`. Nothing here is an estimate.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: condition_index_agronomic_vs_certification_variant_divergence
        grounds:
          - calculations.field_condition_index
          - entities.Field.fields.condition_index_agronomic
          - entities.CertificationPacket.fields.condition_index_certification
          - concurrency_rules[cert-packet-create-stale-field]
        distinguishing_aspect: |
          The variant pair lives on the Field/CertificationPacket condition index: the
          AGRONOMIC variant weights wear 0.50 / age 0.20 / safety 0.30 uncapped and scores
          54.09, while the CERTIFICATION variant weights wear 0.20 / age 0.20 / safety 0.60
          and then caps at safety_component, collapsing to 13.64 - a 40.45-point divergence
          on identical field data, produced by the cap rather than by the weights alone.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01 (so warranty_status is EXPIRED and age_years is 10.17, giving age_component 0.00)."
            - "One RECORDED IMPACT_ATTENUATION assessment on that field with three readings of 185.0, so gmax_mean_value is 185.0, result is ADVISORY and Field.latest_gmax_mean_value is 185.0 (safety_component 13.64)."
            - "Field.cumulative_wear_units is 0.00, so wear_component is 100.00."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Cyril Okafor", roles: ["CertificationOfficer"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_cert: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [185.0, 185.0, 185.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_imp: $.data.id, a_imp_mean: $.data.gmax_mean_value }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { f_sy_ver: $.data.version }
          trigger:
            - call: "POST /turf/certification-packets"
              payload: { field_id: "${f_sy}", governing_assessment_id: "${a_imp}", competition_season_label: "2026-FALL", expected_field_version: "${f_sy_ver}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { pkt: $.data.id }
            - call: "POST /turf/certification-packets/${pkt}/submit"
              payload: { submitted_by_staff_member_id: "${s_cert}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
          assert:
            - "SafetyAssessment.${a_imp}.gmax_mean_value == 185.0 and SafetyAssessment.${a_imp}.result == \"ADVISORY\""
            - "Field.${f_sy}.condition_index_agronomic == 54.09"
            - "CertificationPacket.${pkt}.condition_index_certification == 13.64"
            - "CertificationPacket.${pkt}.condition_index_certification != Field.${f_sy}.condition_index_agronomic (13.64 vs 54.09)"
            - "CertificationPacket.${pkt}.condition_index_certification == 13.64 equals the field's safety_component exactly, proving the CERTIFICATION cap fired: the unmapped weighted value would have been 28.18"
            - "Field.${f_sy}.condition_index_agronomic is unchanged by the submission and remains 54.09"

      - name: replacement_priority_score_remaining_life_vs_condition_risk_divergence
        grounds:
          - calculations.replacement_priority_score
          - entities.ReplacementPlan.fields.priority_basis
          - entities.ReplacementPlan.fields.replacement_priority_score
          - validations[priority=68]
          - concurrency_rules[replacement-plan-create-stale-field]
        distinguishing_aspect: |
          This variant pair lives on ReplacementPlan (not Field) and is behavioural rather
          than merely numeric: on one and the same field the REMAINING_LIFE basis scores
          9.02 - below MIN_APPROVAL_PRIORITY_SCORE 20.00, so approval is refused with
          ERR_PLAN_PRIORITY_BELOW_THRESHOLD - while CONDITION_RISK scores 44.73 on the
          identical field and clears the same gate.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01: age_years 10.17, warranty_status EXPIRED, cumulative_wear_units 0.00."
            - "One RECORDED IMPACT_ATTENUATION assessment with three readings of 185.0, so Field.condition_index_agronomic is 54.09."
            - "One OPEN CapitalBudget for fiscal_year 2027 with total_authorized_amount_cents 5825556."
            - "Two staff members hold FacilitiesDirector so submit and decide can be split."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Marcus Hale", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_dir2: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [185.0, 185.0, 185.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2027, total_authorized_amount_cents: 5825556 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud: $.data.id }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ver1: $.data.version, ci_agro: $.data.condition_index_agronomic }
          trigger:
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_sy}", capital_budget_id: "${bud}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "REMAINING_LIFE", planned_install_year: 2028, expected_field_version: "${f_ver1}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p_rl: $.data.id, score_rl: $.data.replacement_priority_score }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ver2: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_sy}", capital_budget_id: "${bud}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2028, expected_field_version: "${f_ver2}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p_cr: $.data.id, score_cr: $.data.replacement_priority_score }
          assert:
            - "Field.${f_sy}.condition_index_agronomic == 54.09"
            - "ReplacementPlan.${p_rl}.replacement_priority_score == 9.02"
            - "ReplacementPlan.${p_cr}.replacement_priority_score == 44.73"
            - "ReplacementPlan.${p_rl}.plan_funding_amount_cents == 5243000 and ReplacementPlan.${p_cr}.plan_funding_amount_cents == 5243000 - the two plans are priced identically, so only the variant differs"
            - "ReplacementPlan.${p_rl}.replacement_priority_score < 20.00 while ReplacementPlan.${p_cr}.replacement_priority_score >= 20.00"
            - "POST /turf/replacement-plans/${p_rl}/submit followed by POST /turf/replacement-plans/${p_rl}/decide with decision APPROVE and decided_by_staff_member_id ${s_dir2} returns 422 ERR_PLAN_PRIORITY_BELOW_THRESHOLD"
            - "POST /turf/replacement-plans/${p_cr}/submit followed by POST /turf/replacement-plans/${p_cr}/decide with decision APPROVE and decided_by_staff_member_id ${s_dir2} returns 200 and ReplacementPlan.${p_cr}.funding_status == \"APPROVED\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: wear_load_units_capped_crowd_surcharge_nested_in_multiplier_product
        grounds:
          - calculations.wear_load_units
          - entities.UsageBooking.fields.wear_load_units
          - entities.Field.fields.cumulative_wear_units
          - state_machines.UsageBooking.CONFIRMED_to_PLAYED
        distinguishing_aspect: |
          MODE (a) - non-linear interaction of four independent inputs: a crowd surcharge
          that saturates at CROWD_FACTOR_CAP 0.50 is nested inside a product of activity,
          surface and weather multipliers, so a 200-person game scores 10.80 rather than
          the 18.72 an uncapped surcharge would give, while a 60-person game on the same
          field and duration scores 8.64.
        test_recipe:
          setup:
            - "One NATURAL_GRASS field installed 2018-04-15, expected_life_years 12, area 80000, sanctioned_level STATE, warranty_expires_on 2026-04-15."
            - "Booking A: GAME, 2026-08-02T19:00:00Z to 2026-08-02T23:00:00Z, expected_participant_count 60, CONFIRMED while the field is OPEN."
            - "Booking B: GAME, 2026-08-03T19:00:00Z to 2026-08-03T23:00:00Z, expected_participant_count 200, CONFIRMED while the field is OPEN (both confirmations happen at the default clock, before either window opens, and the two windows are a day apart so the 30-minute changeover buffer is not in play)."
            - "Clock advanced to 2026-08-02T23:00:00Z and booking A closed out PLAYED, 4.00 hours, 60 participants, DRY, giving wear_load_units 8.64 and Field.cumulative_wear_units 8.64."
            - "Clock advanced to 2026-08-03T23:00:00Z (booking A's rest window ended at 2026-08-03T04:38:24Z, so Field.rest_debt_hours is back to 0.00 and play_status is OPEN)."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ng: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_ng}", requested_by_staff_member_id: "${s_ops}", activity_type: "GAME", window_start_utc: "2026-08-02T19:00:00Z", window_end_utc: "2026-08-02T23:00:00Z", expected_participant_count: 60 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b_a: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_ng}", requested_by_staff_member_id: "${s_ops}", activity_type: "GAME", window_start_utc: "2026-08-03T19:00:00Z", window_end_utc: "2026-08-03T23:00:00Z", expected_participant_count: 200 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b_b: $.data.id }
            - call: "POST /turf/usage-bookings/${b_a}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /turf/usage-bookings/${b_b}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T23:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/usage-bookings/${b_a}/close-out"
              payload: { outcome: "PLAYED", actual_duration_hours: 4.00, actual_participant_count: 60, weather_condition: "DRY" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T23:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          trigger:
            - call: "POST /turf/usage-bookings/${b_b}/close-out"
              payload: { outcome: "PLAYED", actual_duration_hours: 4.00, actual_participant_count: 200, weather_condition: "DRY" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { wear_b: $.data.wear_load_units }
          assert:
            - "UsageBooking.${b_a}.wear_load_units == 8.64"
            - "UsageBooking.${b_b}.wear_load_units == 10.80"
            - "UsageBooking.${b_b}.wear_load_units != 18.72 - the value an uncapped crowd surcharge (1.00 + 160 * 0.01) would produce"
            - "UsageBooking.${b_b}.rest_requirement_hours == 7.80"
            - "Field.${f_ng}.cumulative_wear_units == 19.44"
            - "Field.${f_ng}.usage_hours_ytd == 8.00"

      - name: certification_completeness_rounds_each_component_before_summation
        grounds:
          - calculations.certification_document_completeness_score
          - entities.CertificationPacket.fields.documentation_completeness_score
          - state_machines.CertificationPacket.DRAFT_to_SUBMITTED
          - concurrency_rules[cert-packet-create-stale-field]
        distinguishing_aspect: |
          MODE (b) - the combinatorial content is the ROUNDING ORDER, not a factor product:
          two components land on repeating thirds (20 * 1/3 and 10 * 34/51), so rounding
          each weighted component to 2dp before summing yields exactly 83.34 whereas summing
          at full precision and rounding once yields 83.33.
        test_recipe:
          setup:
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0 (so spec_ratio is 34.0/51.0 = 2/3), warranty_expires_on 2024-06-01, sanctioned_level REGIONAL."
            - "Three MaintenanceTasks on that field with planned_for_certification_window true, disjoint non-touching windows on 2026-08-01, all assigned to the same agronomist: GROOMING 06:00-07:00, INFILL_REDISTRIBUTION 08:00-09:00, SEAM_INSPECTION 10:00-11:00. Exactly one (GROOMING) reaches COMPLETED, so agronomic_ratio is 1/3."
            - "Three RECORDED assessments dated 2026-08-01T00:00:00Z: IMPACT_ATTENUATION with readings 120.0/120.0/120.0 (result PASS), STRIPING_LAYOUT declared PASS, GOAL_ANCHORING declared PASS - so safety_ratio, striping_ratio and goal_ratio are all 1.00."
            - "No RemediationOrder has ever been opened on the field, so remediation_ratio is the vacuous 1.00."
            - "Clock at 2026-08-02T00:00:00Z when the packet is submitted, so the 180-day window is [2026-02-03, 2026-08-02] and every artefact above falls inside it."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Cyril Okafor", roles: ["CertificationOfficer"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_cert: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "GROOMING", scheduled_start_utc: "2026-08-01T06:00:00Z", scheduled_end_utc: "2026-08-01T07:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_groom: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "INFILL_REDISTRIBUTION", scheduled_start_utc: "2026-08-01T08:00:00Z", scheduled_end_utc: "2026-08-01T09:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_infill: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "SEAM_INSPECTION", scheduled_start_utc: "2026-08-01T10:00:00Z", scheduled_end_utc: "2026-08-01T11:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_seam: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [120.0, 120.0, 120.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_imp: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "STRIPING_LAYOUT", assessed_at_utc: "2026-08-01T00:00:00Z", declared_result: "PASS" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "GOAL_ANCHORING", assessed_at_utc: "2026-08-01T00:00:00Z", declared_result: "PASS" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/maintenance-tasks/${t_groom}/transition"
              payload: { action: "START" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/maintenance-tasks/${t_groom}/transition"
              payload: { action: "COMPLETE", completed_at_utc: "2026-08-01T07:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { f_sy_ver: $.data.version }
          trigger:
            - call: "POST /turf/certification-packets"
              payload: { field_id: "${f_sy}", governing_assessment_id: "${a_imp}", competition_season_label: "2026-FALL", expected_field_version: "${f_sy_ver}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { pkt: $.data.id }
            - call: "POST /turf/certification-packets/${pkt}/submit"
              payload: { submitted_by_staff_member_id: "${s_cert}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { score: $.data.documentation_completeness_score }
          assert:
            - "CertificationPacket.${pkt}.documentation_completeness_score == 83.34"
            - "CertificationPacket.${pkt}.documentation_completeness_score != 83.33 - the value produced by summing 30.00 + 6.666667 + 15.00 + 15.00 + 6.666667 + 10.00 at full precision and rounding once"
            - "CertificationPacket.${pkt}.condition_index_certification == 63.64"
            - "CertificationPacket.${pkt}.status == \"SUBMITTED\" and CertificationPacket.${pkt}.return_count == 0"
            - "Field.${f_sy}.certification_status == \"PENDING_REVIEW\""

      - name: plan_contingency_tier_selected_on_pre_contingency_subtotal
        grounds:
          - calculations.plan_funding_amount_cents
          - entities.ReplacementPlan.fields.pre_contingency_subtotal_cents
          - entities.ReplacementPlan.fields.contingency_rate
          - entities.ReplacementPlan.fields.plan_funding_amount_cents
          - concurrency_rules[replacement-plan-create-stale-field]
        distinguishing_aspect: |
          MODE (c) - the combinatorial content is EVALUATION ORDER around an apparent
          self-reference: contingency is part of the plan total, yet its tier must be read
          off the pre-contingency subtotal 4900000 (rate 0.07 -> 5243000). Reading the tier
          off the final total instead crosses the 5000000 boundary into rate 0.05 and yields
          5145000, so the two orderings are 98000 cents apart.
        test_recipe:
          setup:
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01."
            - "One OPEN CapitalBudget for fiscal_year 2027 with total_authorized_amount_cents 5825556."
