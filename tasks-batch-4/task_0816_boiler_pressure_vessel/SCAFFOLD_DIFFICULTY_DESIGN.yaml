# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Nine §0.5 Difficulty Rules, >= 2 grounded instances each (18 total).
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; all
# formula-derived asserts are pre-computed literals.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_diverge_on_certificate_domain
        grounds:
          - calculations.certificate_fee
          - entities.Inspection.fields.provisional_fee_cents
          - entities.FeeInvoice.fields.amount_cents
        distinguishing_aspect: "Same inspection: PROVISIONAL fee (scheduling, 0 deficiencies) = 26338 cents while FINAL fee (invoice, 1 NON_CRITICAL deficiency) = 29026 cents — a Certificate/fee-domain divergence distinct from the Vessel-domain risk divergence."
        test_recipe:
          setup:
            - "Registered POWER_BOILER (MAWP 120) in jurisdiction CA (admin_fee_pct default 0.075); inspection scheduled then given PASS_WITH_DEFICIENCIES with one NON_CRITICAL deficiency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id", prov: "$.data.provisional_fee_cents" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "sight glass corrosion" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS_WITH_DEFICIENCIES" }
              as: Inspector
              as_user_id: "${insp_a}"
          trigger:
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id", fee_amt: "$.data.amount_cents" }
          assert:
            - "Inspection.${insp1}.provisional_fee_cents == 26338"
            - "FeeInvoice.${fee1}.amount_cents == 29026"
            - "FeeInvoice.${fee1}.amount_cents != Inspection.${insp1}.provisional_fee_cents"

      - name: risk_standard_vs_forecast_diverge_on_vessel_domain
        grounds:
          - calculations.vessel_risk_score
          - entities.Vessel.fields.risk_score_standard
          - entities.Vessel.fields.risk_score_forecast
          - state_machines.Deficiency.UNDER_REPAIR_to_REINSPECTION
        distinguishing_aspect: "Same vessel with one CRITICAL deficiency in REINSPECTION scores risk_score_standard == 40 (REINSPECTION excluded) versus risk_score_forecast == 48 (REINSPECTION included) — a Vessel-domain divergence distinct from the Certificate-fee divergence."
        test_recipe:
          setup:
            - "POWER_BOILER installed 2016-01-01 (age 10 -> tier 10); one CRITICAL deficiency driven to REINSPECTION via a completed repair order; clock 2026-06-01; vessel not SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2016-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "CRITICAL", description: "cracked weld seam" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "FAIL" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /repair-orders"
              payload: { vessel_id: "${vessel}", deficiency_ids: ["${d1}"], description: "reweld seam" }
              as: Owner
              as_user_id: "${owner}"
              captures: { ro1: "$.data.id" }
          trigger:
            - call: "POST /repair-orders/${ro1}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
          assert:
            - "Vessel.${vessel}.risk_score_standard == 40"
            - "Vessel.${vessel}.risk_score_forecast == 48"
            - "Vessel.${vessel}.risk_score_forecast > Vessel.${vessel}.risk_score_standard"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_round_per_line_then_sum_mode_b
        grounds:
          - calculations.certificate_fee
          - entities.FeeInvoice.fields.amount_cents
        distinguishing_aspect: "Mode (b): admin surcharge is rounded PER LINE then summed — round([20000,4500,2500]*1.075) = 21500+4838+2688 = 29026, whereas sum-then-round would give 29025; the scaffold pins per-line-then-sum."
        test_recipe:
          setup:
            - "POWER_BOILER MAWP 120 (MEDIUM tier 4500), one NON_CRITICAL deficiency (surcharge 2500), admin_fee_pct 0.075; FINAL fee computed at invoice creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "loose fitting" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS_WITH_DEFICIENCIES" }
              as: Inspector
              as_user_id: "${insp_a}"
          trigger:
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
          assert:
            - "FeeInvoice.${fee1}.amount_cents == 29026"

      - name: risk_nonlinear_clamped_with_suspended_conditional_mode_a
        grounds:
          - calculations.vessel_risk_score
          - state_machines.Vessel.IN_SERVICE_to_SUSPENDED
          - entities.Vessel.fields.risk_score_standard
        distinguishing_aspect: "Mode (a): risk = min(100, base 30 + age_tier 35 + incident_penalty 25 - clean_bonus 10 + SUSPENDED_PENALTY 40) = min(100,120) = 100 — >=3 inputs, a state-conditional +40 branch, and a nested min clamp; a different combinatorial mode from the fee rounding."
        test_recipe:
          setup:
            - "POWER_BOILER installed 1990-01-01 (age 36 -> tier 35), certified IN_SERVICE (insp1 PASS, clean_bonus 10), then a CRITICAL incident (2026-05-15) suspends it (+40) and adds one incident penalty (25); clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "1990-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
            - call: "POST /fee-invoices/${fee1}/pay"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
            - call: "GET /vessels/${vessel}"
              payload: {}
              as: JurisdictionAdmin
              captures: { v_ver: "$.data.version" }
            - call: "POST /certificates"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}", fee_invoice_id: "${fee1}", expected_vessel_version: "${v_ver}" }
              as: JurisdictionAdmin
              captures: { cert1: "$.data.id" }
          trigger:
            - call: "POST /vessels/${vessel}/incidents"
              payload: { severity: "CRITICAL", occurred_at: "2026-05-15T00:00:00Z", narrative: "tube rupture" }
              as: Owner
              as_user_id: "${owner}"
              captures: { inc1: "$.data.id" }
          assert:
            - "Vessel.${vessel}.service_status == SUSPENDED"
            - "Vessel.${vessel}.risk_score_standard == 100"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: vessel_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Vessel.DRAFT_to_REGISTERED
          - state_machines.Vessel.NOT_IN_SERVICE_to_IN_SERVICE
          - entities.Vessel.fields.registration_status
          - entities.Vessel.fields.service_status
        distinguishing_aspect: "On Vessel: registration reaches REGISTERED while service_status is still NOT_IN_SERVICE, then a certificate flips service_status to IN_SERVICE while registration_status stays REGISTERED — two independent parallel dimensions on one entity."
        test_recipe:
          setup:
            - "POWER_BOILER registered but not yet certified, then certified after a PASS inspection and paid fee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
              captures: { reg_status: "$.data.registration_status", svc_status: "$.data.service_status" }
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}" }
              as: JurisdictionAdmin
              captures: { fee1: "$.data.id" }
            - call: "POST /fee-invoices/${fee1}/pay"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
            - call: "GET /vessels/${vessel}"
              payload: {}
              as: JurisdictionAdmin
              captures: { v_ver: "$.data.version" }
          trigger:
            - call: "POST /certificates"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}", fee_invoice_id: "${fee1}", expected_vessel_version: "${v_ver}" }
              as: JurisdictionAdmin
              captures: { cert1: "$.data.id" }
          assert:
            - "Vessel.${vessel}.registration_status == REGISTERED"
            - "Vessel.${vessel}.service_status == IN_SERVICE"

      - name: deficiency_reinspect_cycle_returns_to_open
        grounds:
          - state_machines.Deficiency.REINSPECTION_to_OPEN
          - state_machines.Deficiency.UNDER_REPAIR_to_REINSPECTION
          - entities.Deficiency.fields.status
        distinguishing_aspect: "On Deficiency: a FAIL reinspection sends REINSPECTION -> OPEN (a cycle back), and repair_order_id is cleared to null — a non-linear cyclic edge, on a different entity than the Vessel parallel dimensions."
        test_recipe:
          setup:
            - "One NON_CRITICAL deficiency taken OPEN -> UNDER_REPAIR (repair order) -> REINSPECTION (complete); reinspected by a SECOND inspector with outcome FAIL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspectors"
              payload: { name: "Insp B", commission_number: "NBC-B", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_b: "$.data.id" }
            - call: "POST /inspectors/${insp_b}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /inspections/${insp1}/deficiencies"
              payload: { severity: "NON_CRITICAL", description: "gasket wear" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { d1: "$.data.id" }
            - call: "POST /inspections/${insp1}/result"
              payload: { result: "PASS_WITH_DEFICIENCIES" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /repair-orders"
              payload: { vessel_id: "${vessel}", deficiency_ids: ["${d1}"], description: "replace gasket" }
              as: Owner
              as_user_id: "${owner}"
              captures: { ro1: "$.data.id" }
            - call: "POST /repair-orders/${ro1}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /deficiencies/${d1}/reinspect"
              payload: { outcome: "FAIL" }
              as: Inspector
              as_user_id: "${insp_b}"
          assert:
            - "Deficiency.${d1}.status == OPEN"
            - "Deficiency.${d1}.repair_order_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_suspend_revoke_cancel_scheduled_depth3
        grounds:
          - state_machines.Vessel.IN_SERVICE_to_SUSPENDED
          - state_machines.Certificate.ACTIVE_to_REVOKED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from POST /vessels/{id}/incidents (CRITICAL): incident -> Vessel SUSPENDED (link1) -> ACTIVE Certificate REVOKED (link2, caused by suspension) -> the vessel's SCHEDULED non-SPECIAL Inspection CANCELLED (link3, caused by revocation)."
        test_recipe:
          setup:
            - "IN_SERVICE vessel with ACTIVE cert1 and a separate SCHEDULED routine inspection insp2; then a CRITICAL incident is filed."
          setup_api_calls:
