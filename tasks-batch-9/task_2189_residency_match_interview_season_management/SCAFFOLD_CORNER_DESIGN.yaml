      - name: accepting_at_exactly_the_invitation_expiry_instant_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_INVITATION_EXPIRED
          - validations.priority 9
          - constants.INVITATION_RESPONSE_WINDOW_HOURS
        distinguishing_aspect: >
          expires_at is the earlier of the wave's 2026-10-08T12:00:00Z deadline and issued_at plus the
          120-hour response window, which is 2026-10-06T12:00:00Z - so the window, not the deadline, binds.
          The comparison is strict (clock < expires_at), so the acceptance at exactly 2026-10-06T12:00:00Z
          fails. Per the priority-5 scope boundary the reported id is the specific
          ERR_INVITATION_EXPIRED at priority 9, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "a RELEASED wave holding one ISSUED invitation issued at 2026-10-01T12:00:00Z, with the clock wound to the expiry instant"
          setup_api_calls:
