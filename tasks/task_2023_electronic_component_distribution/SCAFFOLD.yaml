# =============================================================================
# Task 2023 — Electronic Component Distribution & Franchise Lines (Arrow/Avnet)
# PRD Benchmark Scaffold (seed tables §1.0–§1.7)
# =============================================================================

scenario: |
  2023. Electronic Component Distribution & Franchise Lines (Arrow/Avnet):
  franchised vs open-market sourcing & authenticity, date-code/lot control &
  moisture-sensitivity handling, allocation during shortage & fair-share rules,
  ship-and-debit & design-registration claims, scheduled order &
  reschedule/cancel window, non-cancellable/non-returnable terms,
  cross-reference & alternate part approval, excess & shortage buy-back

domain_name: electronic-component-distribution
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # shortage allocation with fair-share waterfall
  secondary_archetype: ledger_reconciliation # ship-and-debit provisional vs settled claims
  complexity_layers:
    - optimistic_concurrency        # OCC on Part.version (run supersede) and CustomerOrder.version (reschedule)
    - cascading_side_effects        # clock sweep -> lot quarantine -> line deallocation -> order recompute (depth 3)
    - dual_variant_calculation      # allocation basis variants; provisional vs audited claim; request vs receipt buy-back credit
    - rate_threshold_triggers       # MSL floor-life, cancel/reschedule windows, buy-back % cap, credit limit
    - derived_field_reconciliation  # lot qty buckets, part availability, order exposure/allocated value
  entity_topology: flat                     # peer resources joined by FK fields in bodies
  state_machine_shape: cyclic               # lot quarantine<->bake cycle; claim dispute<->resubmit cycle; registration exhausted->approved restore
  relationship_patterns:
    - cross_aggregate                 # claims reference registrations and order lines; buy-backs reference order lines
    - one_to_many                     # order->lines, lot->exposures
  role_model: segregation_of_duties         # lot receiver cannot inspect the same lot; peer roles own distinct surfaces
  consistency_model: immediate              # every mutation (incl. cascades) visible in the same response/read-after-write

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs declared on children)
# =============================================================================
entities:
  - name: ManufacturerLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique distributor line code", constraints: "unique across all ManufacturerLine rows (ERR_DUPLICATE_LINE_CODE)" }
      - { name: name, type: string, source: input, description: "Human-readable manufacturer/line name" }
      - { name: sourcing_channel, type: enum, source: input, description: "FRANCHISED | OPEN_MARKET — whether this line is an authorized franchise line" }
      - { name: ncnr, type: boolean, source: input, default: false, description: "Non-cancellable/non-returnable terms apply to all parts on this line" }
      - { name: cancel_window_days, type: integer, source: input, default: 30, description: "Order lines on this line may be cancelled only while now < ship_date - cancel_window_days" }
      - { name: reschedule_window_days, type: integer, source: input, default: 20, description: "Order lines on this line may be rescheduled only while now < ship_date - reschedule_window_days" }
      - { name: allocation_policy, type: enum, source: input, default: "BACKLOG_BASIS", description: "BACKLOG_BASIS | USAGE_BASIS — fair-share weighting used by allocation runs" }
      - { name: open_debit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_final_cents over SETTLED claims on this line's parts minus amount_final_cents over REVERSED claims" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_line_id, type: string, source: input, description: "FK -> ManufacturerLine.id; the franchise line this part belongs to" }
      - { name: part_number, type: string, source: input, description: "Manufacturer part number", constraints: "unique within manufacturer_line_id (ERR_DUPLICATE_PART_NUMBER)" }
      - { name: msl_level, type: integer, source: input, description: "JEDEC moisture sensitivity level 1-6" }
      - { name: floor_life_hours, type: integer, source: input, description: "Allowed cumulative ambient exposure hours since last bake before the lot must be re-baked" }
      - { name: date_code_limit_months, type: integer, source: input, description: "Maximum date-code age in months at ship time; stale iff months_elapsed > limit" }
      - { name: standard_cost_cents, type: integer, source: input, description: "Distributor standard buy cost per unit (supplier debit baseline)" }
      - { name: book_price_cents, type: integer, source: input, description: "Default sell price per unit; snapshotted onto order lines at acknowledge" }
      - { name: qty_on_hand, type: integer, source: computed, default: 0, description: "Sum of qty_on_hand over lots of this part with status AVAILABLE" }
      - { name: qty_reserved, type: integer, source: computed, default: 0, description: "Sum of qty_reserved over lots of this part with status AVAILABLE" }
      - { name: open_demand_qty, type: integer, source: computed, default: 0, description: "Sum of quantity over OrderLine rows of this part with status OPEN whose order is ACKNOWLEDGED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer account name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed open_balance_cents after a ship; ship rejected when the result would exceed it" }
      - { name: open_balance_cents, type: integer, source: input, default: 0, description: "Externally maintained AR open balance; incremented by ship value at ship time" }
      - { name: trailing_12mo_purchases_cents, type: integer, source: input, default: 0, description: "CRM-maintained trailing-12-month purchases; basis of the excess buy-back 15% cap" }
      - { name: trailing_12mo_component_usage_units, type: integer, source: input, default: 0, description: "CRM-maintained trailing-12-month component consumption in units; USAGE_BASIS fair-share weight" }
      - { name: status, type: enum, source: input, default: "GOOD_STANDING", description: "GOOD_STANDING | CREDIT_HOLD — CREDIT_HOLD blocks order create and acknowledge" }

  - name: DesignRegistration
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; distributor's direct customer on the registration" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; registered part" }
      - { name: end_customer_name, type: string, source: input, description: "End OEM/customer where the design win occurred" }
      - { name: registered_cost_cents, type: integer, source: input, description: "Supplier-approved special cost per unit; ship-and-debit baseline" }
      - { name: max_registered_qty, type: integer, source: input, description: "Maximum units coverable by this registration" }
      - { name: registered_qty_remaining, type: integer, source: system, description: "Initialized to max_registered_qty at approval; decremented by claim qty at claim creation; restored on claim REJECT or REVERSE" }
      - { name: valid_from, type: string, source: input, description: "ISO date; registration validity window start (inclusive)" }
      - { name: valid_to, type: string, source: input, description: "ISO date; registration validity window end (inclusive); windows are CLOSED intervals — touching windows conflict" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | EXPIRED | EXHAUSTED" }

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer account" }
      - { name: note, type: string, source: input, default: "", description: "Optional free-text note" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACKNOWLEDGED | ON_HOLD | PARTIALLY_SHIPPED | COMPLETED | CANCELLED" }
      - { name: open_exposure_cents, type: integer, source: computed, default: 0, description: "Sum over lines in {OPEN, ALLOCATED} of (quantity - shipped_qty) * unit_price_cents" }
      - { name: allocated_value_cents, type: integer, source: computed, default: 0, description: "Sum over lines of allocated_qty * unit_price_cents" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CustomerOrder.id; set at order creation (lines are created inline with the order)" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; ordered part" }
      - { name: quantity, type: integer, source: input, description: "Ordered units (> 0)" }
      - { name: ship_date, type: string, source: input, description: "ISO date; requested scheduled ship date for this release" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of Part.book_price_cents at order acknowledge" }
      - { name: ncnr_snapshot, type: boolean, source: system, description: "Snapshot of ManufacturerLine.ncnr at order acknowledge; NCNR lines can never be cancelled" }
      - { name: cancel_window_days_snapshot, type: integer, source: system, description: "Snapshot of ManufacturerLine.cancel_window_days at order acknowledge" }
      - { name: reschedule_window_days_snapshot, type: integer, source: system, description: "Snapshot of ManufacturerLine.reschedule_window_days at order acknowledge" }
      - { name: cancel_by_date, type: string, source: computed, description: "= ship_date - cancel_window_days_snapshot (ISO date); recomputed on reschedule" }
      - { name: allocated_qty, type: integer, source: system, default: 0, description: "Units reserved for this line by the latest PUBLISHED allocation run; released on quarantine cascade or cancel" }
      - { name: shipped_qty, type: integer, source: system, default: 0, description: "Units shipped so far" }
      - { name: returned_qty, type: integer, source: system, default: 0, description: "Units received back via buy-back receipts" }
      - { name: last_shipped_at, type: datetime, source: system, description: "Timestamp of the most recent ship action on this line; null until first ship" }
      - { name: status, type: enum, source: system, description: "OPEN | ALLOCATED | SHIPPED | CANCELLED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; part stocked in this lot" }
      - { name: date_code, type: string, source: input, description: "Lot date code, format YYYYMM (month precision)" }
      - { name: qty_received, type: integer, source: input, description: "Units received into this lot (> 0)" }
      - { name: qty_on_hand, type: integer, source: system, description: "Unreserved, unshipped units; initialized to qty_received" }
      - { name: qty_reserved, type: integer, source: system, default: 0, description: "Units reserved by PUBLISHED allocation runs, not yet shipped" }
      - { name: qty_shipped, type: integer, source: system, default: 0, description: "Units shipped out of this lot" }
      - { name: source_type, type: enum, source: input, description: "FRANCHISED | OPEN_MARKET; FRANCHISED requires the part's line sourcing_channel == FRANCHISED" }
      - { name: authenticity, type: enum, source: system, description: "NOT_REQUIRED (franchised) | PENDING_INSPECTION | AUTHENTICATED | REJECTED (open-market)" }
      - { name: msl_exposure_hours, type: integer, source: computed, default: 0, description: "Cumulative exposure hours since last_baked_at; sealed intervals contribute their full duration, an open interval contributes (now - opened_at)" }
      - { name: last_baked_at, type: datetime, source: system, description: "Timestamp of last bake; null until first bake; intervals opened before this are excluded from msl_exposure_hours" }
      - { name: received_by_user_id, type: string, source: system, description: "X-User-ID of the WarehouseOps user who received the lot; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_INSPECTION | QUARANTINED | REJECTED | DEPLETED" }

  - name: MoistureExposure
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot whose dry pack was opened (from path)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp at open" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock timestamp at seal; null while open" }
      - { name: note, type: string, source: input, default: "", description: "Optional note" }

  - name: AlternatePartApproval
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer who may receive the alternate" }
      - { name: primary_part_id, type: string, source: input, description: "FK -> Part.id; originally ordered part" }
      - { name: alternate_part_id, type: string, source: input, description: "FK -> Part.id; proposed substitute (must differ from primary_part_id)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | REVOKED" }

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; part being allocated" }
      - { name: basis, type: enum, source: system, description: "Snapshot of the part's line allocation_policy at run creation: BACKLOG_BASIS | USAGE_BASIS" }
      - { name: total_supply_qty, type: integer, source: system, description: "Sum of qty_on_hand over AVAILABLE lots of the part at run creation" }
      - { name: total_demand_qty, type: integer, source: system, description: "Sum of quantity over eligible OPEN order lines at run creation" }
      - { name: lines, type: array, source: system, description: "Computed fair-share result: array of { order_line_id, allocated_qty } sorted by order line created_at ASC" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | PUBLISHED | SUPERSEDED" }

  - name: ShipAndDebitClaim
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> DesignRegistration.id; registration covering this claim (resolved at ship time)" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line whose shipment generated the claim" }
      - { name: qty, type: integer, source: system, description: "Units covered by the claim: min(ship qty, registration.registered_qty_remaining at ship)" }
      - { name: standard_cost_cents, type: integer, source: system, description: "Snapshot of Part.standard_cost_cents at claim creation" }
      - { name: registered_cost_cents, type: integer, source: system, description: "Snapshot of DesignRegistration.registered_cost_cents at claim creation" }
      - { name: amount_provisional_cents, type: integer, source: computed, description: "= qty * (standard_cost_cents - registered_cost_cents); pinned at claim creation" }
      - { name: audited_cost_cents, type: integer, source: input, description: "Supplier-audited cost per unit, provided on supplier-decision APPROVE; defaults to registered_cost_cents when omitted" }
      - { name: amount_final_cents, type: integer, source: computed, description: "= qty * (standard_cost_cents - audited_cost_cents); set at supplier approval, null before" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SUPPLIER_APPROVED | SUPPLIER_REJECTED | DISPUTED | SETTLED | REVERSED" }

  - name: BuyBackRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer returning excess / selling back shortage stock" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; original purchase line the units came from" }
      - { name: kind, type: enum, source: input, description: "EXCESS_RETURN | SHORTAGE_BUYBACK" }
      - { name: qty, type: integer, source: input, description: "Units offered (> 0)" }
      - { name: price_basis_cents, type: integer, source: computed, description: "EXCESS_RETURN: min(order line unit_price_cents, current part book_price_cents); SHORTAGE_BUYBACK: current part book_price_cents" }
      - { name: fee_pct, type: number, source: computed, description: "Restocking fee fraction by days since line.last_shipped_at at request time: <= 90 days -> 0.10, 91-180 -> 0.25; always 0 for SHORTAGE_BUYBACK" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "= round_half_up(qty * price_basis_cents * (1 - fee_pct)); computed at request time" }
      - { name: received_qty, type: integer, source: input, description: "Actually received units at receive time (1..qty)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "= round_half_up(received_qty * price_basis_cents * (1 - fee_pct_at_receipt)); set at receive, null before; tier uses days since last_shipped_at measured at RECEIVE date" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | RECEIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InventoryLot
    initial_state: "AVAILABLE when source_type=FRANCHISED, IN_INSPECTION when source_type=OPEN_MARKET (auto-advanced synchronously at creation)"
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: IN_INSPECTION
        to: AVAILABLE
        trigger: "POST /lots/{lotId}/inspect with disposition=AUTHENTICATE"
        actor: QualityInspector
        preconditions:
          - "lot.status == IN_INSPECTION (ERR_INSPECTION_NOT_PENDING)"
          - "X-User-ID != lot.received_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "authenticity = AUTHENTICATED"
          - "recompute part.qty_on_hand (calculation: part_availability)"

      - from: IN_INSPECTION
        to: REJECTED
        trigger: "POST /lots/{lotId}/inspect with disposition=REJECT"
        actor: QualityInspector
        preconditions:
          - "lot.status == IN_INSPECTION (ERR_INSPECTION_NOT_PENDING)"
          - "X-User-ID != lot.received_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "authenticity = REJECTED"

      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system sweep inside POST /_clock/set_current_utc (calculation: msl_exposure_accrual)"
        actor: system
        preconditions:
          - "recomputed msl_exposure_hours >= part.floor_life_hours (boundary: >=, equality breaches)"
        side_effects:
          - "reservation release cascade (calculation: quarantine_release): qty_on_hand += qty_reserved; qty_reserved = 0"
          - "deallocate ALLOCATED order lines of this part, newest first (OrderLine.created_at DESC, tie ship_date DESC): allocated_qty decremented by the released amount in order; a line reaching allocated_qty == 0 transitions ALLOCATED -> OPEN"
          - "recompute each touched order's allocated_value_cents and open_exposure_cents (calculation: order_exposure); bump each touched order's version and updated_at"
          - "recompute part.qty_on_hand / qty_reserved (calculation: part_availability)"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /lots/{lotId}/bake"
        actor: WarehouseOps
        preconditions:
          - "lot.status == QUARANTINED (ERR_LOT_NOT_QUARANTINED)"
          - "no MoistureExposure of this lot has sealed_at == null (ERR_EXPOSURE_ALREADY_OPEN)"
        side_effects:
          - "last_baked_at = now; msl_exposure_hours = 0"
          - "recompute part.qty_on_hand (calculation: part_availability)"

      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic after a ship action leaves qty_on_hand == 0 and qty_reserved == 0 and qty_shipped == qty_received)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute part.qty_on_hand (calculation: part_availability)"

  - entity: CustomerOrder
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /orders/{orderId}/acknowledge"
        actor: SalesRep
        preconditions:
          - "order.status == SUBMITTED (ERR_ORDER_NOT_SUBMITTED)"
          - "customer.status == GOOD_STANDING (ERR_CUSTOMER_CREDIT_HOLD)"
        side_effects:
          - "per line: snapshot unit_price_cents = part.book_price_cents, ncnr_snapshot, cancel_window_days_snapshot, reschedule_window_days_snapshot; cancel_by_date = ship_date - cancel_window_days_snapshot"
          - "recompute order.open_exposure_cents (calculation: order_exposure)"
          - "increments CustomerOrder.version by 1"

      - from: ACKNOWLEDGED
        to: ON_HOLD
        trigger: "system (automatic on a ship action rejected by credit_check_at_ship)"
        actor: system
        preconditions: []
        side_effects:
          - "order.status = ON_HOLD; the ship action itself is rejected with ERR_CREDIT_LIMIT_EXCEEDED"

      - from: ON_HOLD
        to: ACKNOWLEDGED
        trigger: "POST /orders/{orderId}/release-hold"
        actor: SalesRep | DistributorAdmin
        preconditions:
          - "order.status == ON_HOLD (ERR_ORDER_ON_HOLD is NOT raised here; from any other state -> ERR_ORDER_NOT_ACKNOWLEDGED)"
        side_effects:
          - "increments CustomerOrder.version by 1"

      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: SalesRep | CustomerBuyer (own orders only)
        preconditions:
          - "order.status == ACKNOWLEDGED (ERR_ORDER_NOT_ACKNOWLEDGED)"
          - "no line with shipped_qty > 0 (ERR_ORDER_HAS_SHIPPED_LINES)"
          - "every line in {OPEN, ALLOCATED}: ncnr_snapshot == false (ERR_LINE_NCNR) and now < cancel_by_date (ERR_CANCEL_WINDOW_CLOSED)"
        side_effects:
          - "all lines in {OPEN, ALLOCATED} -> CANCELLED"
          - "release reservations: for each cancelled ALLOCATED line, lot.qty_reserved -= released, lot.qty_on_hand += released walking lots of the part with qty_reserved > 0 by (date_code ASC, created_at ASC) (calculation: lot_reservation_fefo, reverse direction)"
          - "order.open_exposure_cents = 0, allocated_value_cents = 0"
          - "increments CustomerOrder.version by 1"

      - from: ACKNOWLEDGED
        to: PARTIALLY_SHIPPED
        trigger: "system (automatic on the first successful ship of any line)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute order.open_exposure_cents and allocated_value_cents (calculation: order_exposure)"

      - from: PARTIALLY_SHIPPED
        to: COMPLETED
        trigger: "system (automatic when every line is in {SHIPPED, CANCELLED} and at least one line is SHIPPED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "system (automatic when every line is CANCELLED and no line has shipped_qty > 0 — e.g. the last open line is cancelled individually)"
        actor: system
        preconditions: []
        side_effects:
          - "order.open_exposure_cents = 0, allocated_value_cents = 0"

  - entity: OrderLine
    initial_state: OPEN
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /allocation-runs/{runId}/publish"
        actor: DistributorAdmin
        preconditions:
          - "run.status == PROVISIONAL (ERR_ALLOCATION_RUN_NOT_PROVISIONAL)"
          - "current supply (sum of qty_on_hand over AVAILABLE lots) >= sum of run lines' allocated_qty (ERR_QUANTITY_EXCEEDS_AVAILABLE)"
        side_effects:
          - "line.allocated_qty = run-line allocated_qty"
          - "lot reservations: walk AVAILABLE lots of the part by (date_code ASC, created_at ASC), moving qty_on_hand -> qty_reserved until all allocated units are reserved (calculation: lot_reservation_fefo)"
          - "recompute each touched order's allocated_value_cents (calculation: order_exposure); bump order version/updated_at"
          - "recompute part.qty_on_hand / qty_reserved / open_demand_qty (calculation: part_availability)"

      - from: ALLOCATED
        to: OPEN
        trigger: "system (quarantine_release cascade from lot quarantine)"
        actor: system
        preconditions: []
        side_effects:
          - "line.allocated_qty = 0"
          - "recompute order.allocated_value_cents (calculation: order_exposure)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /orders/{orderId}/lines/{lineId}/cancel or order cancel"
        actor: SalesRep | CustomerBuyer (own orders only)
        preconditions:
          - "order.status == ACKNOWLEDGED or PARTIALLY_SHIPPED (ERR_ORDER_NOT_ACKNOWLEDGED)"
          - "line.status in {OPEN, ALLOCATED} (ERR_LINE_NOT_OPEN_OR_ALLOCATED)"
          - "line.ncnr_snapshot == false (ERR_LINE_NCNR)"
          - "now < line.cancel_by_date (ERR_CANCEL_WINDOW_CLOSED; boundary: strict <, at exactly cancel_by_date the window is closed)"
        side_effects:
          - "recompute order.open_exposure_cents (calculation: order_exposure); bump order version/updated_at"

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/lines/{lineId}/cancel or order cancel"
        actor: SalesRep | CustomerBuyer (own orders only)
        preconditions:
          - "same as OPEN -> CANCELLED"
        side_effects:
          - "release this line's allocated_qty from lot reservations (date_code ASC, created_at ASC among lots with qty_reserved > 0)"
          - "recompute order.open_exposure_cents and allocated_value_cents (calculation: order_exposure); bump order version/updated_at"

      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /orders/{orderId}/lines/{lineId}/ship (when shipped_qty reaches quantity)"
        actor: WarehouseOps
        preconditions:
          - "line.status == ALLOCATED (ERR_LINE_NOT_ALLOCATED)"
          - "order.status != ON_HOLD (ERR_ORDER_ON_HOLD)"
          - "qty >= 1 and qty <= line.allocated_qty - line.shipped_qty (ERR_QUANTITY_EXCEEDS_AVAILABLE)"
          - "if substitute_part_id given: an AlternatePartApproval exists with customer_id == order.customer_id, primary_part_id == line.part_id, alternate_part_id == substitute_part_id, status == APPROVED (ERR_ALTERNATE_NOT_APPROVED)"
          - "date_code freshness of every picked lot: months_elapsed(lot.date_code, now) <= part.date_code_limit_months (ERR_DATE_CODE_TOO_OLD)"
          - "credit_check_at_ship passes: customer.open_balance_cents + qty * line.unit_price_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED; on failure the order transitions ACKNOWLEDGED/PARTIALLY_SHIPPED -> ON_HOLD)"
        side_effects:
          - "pick lots FEFO (date_code ASC, created_at ASC) among lots of the shipped part with qty_reserved > 0 (or qty_on_hand > 0 for substitute shipments): qty_reserved -> qty_shipped (substitute: qty_on_hand -> qty_shipped)"
          - "line.shipped_qty += qty; line.allocated_qty -= qty; line.last_shipped_at = now"
          - "customer.open_balance_cents += qty * line.unit_price_cents"
          - "ship-and-debit: resolve covering registration (customer_id == order.customer_id, part_id == shipped part, status == APPROVED, valid_from <= today <= valid_to, registered_qty_remaining > 0; selector: valid_from ASC, tie created_at ASC); covered = min(qty, registered_qty_remaining); if covered > 0 create ShipAndDebitClaim (status SUBMITTED, qty = covered) and decrement registration.registered_qty_remaining by covered; when remaining reaches 0 registration -> EXHAUSTED (calculation: ship_debit_claim_amounts)"
          - "lot depletion check: lot with qty_on_hand == 0 and qty_reserved == 0 and qty_shipped == qty_received -> DEPLETED"
          - "order auto-transitions: first ship ACKNOWLEDGED -> PARTIALLY_SHIPPED; when all lines in {SHIPPED, CANCELLED} with >= 1 SHIPPED -> COMPLETED"
          - "recompute order.open_exposure_cents and allocated_value_cents; bump order version/updated_at"
          - "recompute part.qty_on_hand / qty_reserved / open_demand_qty"

  - entity: DesignRegistration
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /design-registrations/{registrationId}/decision with decision=APPROVE"
        actor: SupplierAdmin
        preconditions:
          - "registration.status == SUBMITTED (ERR_REGISTRATION_NOT_SUBMITTED)"
        side_effects:
          - "registered_qty_remaining = max_registered_qty"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /design-registrations/{registrationId}/decision with decision=REJECT"
        actor: SupplierAdmin
        preconditions:
          - "registration.status == SUBMITTED (ERR_REGISTRATION_NOT_SUBMITTED)"
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when now > valid_to"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when now > valid_to"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic at claim creation when registered_qty_remaining reaches 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXHAUSTED
        to: APPROVED
        trigger: "system (automatic when a claim REJECT or REVERSE restores registered_qty_remaining above 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShipAndDebitClaim
    initial_state: SUBMITTED
    terminal_states: [SUPPLIER_REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: SUPPLIER_APPROVED
        trigger: "POST /claims/{claimId}/supplier-decision with decision=APPROVE"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "audited_cost_cents = payload audited_cost_cents if provided else registered_cost_cents"
          - "amount_final_cents = qty * (standard_cost_cents - audited_cost_cents) (calculation: ship_debit_claim_amounts, final variant)"

      - from: SUBMITTED
        to: SUPPLIER_REJECTED
        trigger: "POST /claims/{claimId}/supplier-decision with decision=REJECT"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "registration.registered_qty_remaining += claim.qty; if registration was EXHAUSTED and remaining > 0 -> APPROVED (compensation)"

      - from: DISPUTED
        to: SUPPLIER_REJECTED
        trigger: "POST /claims/{claimId}/supplier-decision with decision=REJECT"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == DISPUTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "registration.registered_qty_remaining += claim.qty; if registration was EXHAUSTED and remaining > 0 -> APPROVED (compensation)"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /claims/{claimId}/supplier-decision with decision=DISPUTE"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects: []

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /claims/{claimId}/resubmit"
        actor: SalesRep
        preconditions:
          - "claim.status == DISPUTED (ERR_CLAIM_INVALID_STATE)"
        side_effects: []

      - from: SUPPLIER_APPROVED
        to: SETTLED
        trigger: "POST /claims/{claimId}/settle"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == SUPPLIER_APPROVED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "manufacturer_line.open_debit_balance_cents += amount_final_cents (ledger sync, calculation: debit_balance_reconciliation)"

      - from: SETTLED
        to: REVERSED
        trigger: "POST /claims/{claimId}/reverse"
        actor: SupplierAdmin
        preconditions:
          - "claim.status == SETTLED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "manufacturer_line.open_debit_balance_cents -= amount_final_cents (compensation, calculation: debit_balance_reconciliation)"
          - "registration.registered_qty_remaining += claim.qty"
          - "if registration was EXHAUSTED and registered_qty_remaining > 0 -> registration APPROVED (cascade link caused by the remaining-qty restore)"

  - entity: BuyBackRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, RECEIVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /buy-backs/{buyBackId}/decision with decision=APPROVE"
        actor: DistributorAdmin
        preconditions:
          - "buy_back.status == REQUESTED (ERR_BUYBACK_INVALID_STATE)"
        side_effects: []

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /buy-backs/{buyBackId}/decision with decision=REJECT"
        actor: DistributorAdmin
        preconditions:
          - "buy_back.status == REQUESTED (ERR_BUYBACK_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: RECEIVED
        trigger: "POST /buy-backs/{buyBackId}/receive"
        actor: WarehouseOps
        preconditions:
          - "buy_back.status == APPROVED (ERR_BUYBACK_INVALID_STATE)"
          - "1 <= received_qty <= buy_back.qty (ERR_BUYBACK_QTY_EXCEEDED)"
        side_effects:
          - "final_credit_cents = round_half_up(received_qty * price_basis_cents * (1 - fee_pct_at_receipt)) where the tier is re-selected from days since line.last_shipped_at measured at RECEIVE date (calculation: buyback_credit, final variant)"
          - "order_line.returned_qty += received_qty"
          - "create InventoryLot for the returned units: source_type = OPEN_MARKET, authenticity = PENDING_INSPECTION, status = IN_INSPECTION, qty_received = received_qty, date_code = payload lot_date_code (cascade-created child; discoverable via GET /lots?part_id=)"

  - entity: AlternatePartApproval
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /alternate-approvals/{approvalId}/decision with decision=APPROVE"
        actor: CustomerBuyer (own customer_id only)
        preconditions:
          - "approval.status == PROPOSED (ERR_ALTERNATE_APPROVAL_INVALID_STATE)"
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /alternate-approvals/{approvalId}/decision with decision=REJECT"
        actor: CustomerBuyer (own customer_id only)
        preconditions:
          - "approval.status == PROPOSED (ERR_ALTERNATE_APPROVAL_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: REVOKED
        trigger: "POST /alternate-approvals/{approvalId}/decision with decision=REVOKE"
        actor: CustomerBuyer (own customer_id only)
        preconditions:
          - "approval.status == APPROVED (ERR_ALTERNATE_APPROVAL_INVALID_STATE)"
        side_effects: []

  - entity: AllocationRun
    initial_state: PROVISIONAL
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (automatic when a new AllocationRun is created for the same part)"
        actor: system
        preconditions: []
        side_effects:
          - "prior PROVISIONAL run for the same part -> SUPERSEDED (at most one PROVISIONAL run per part)"

      - from: PROVISIONAL
        to: PUBLISHED
        trigger: "POST /allocation-runs/{runId}/publish"
        actor: DistributorAdmin
        preconditions:
          - "run.status == PROVISIONAL (ERR_ALLOCATION_RUN_NOT_PROVISIONAL)"
          - "current supply >= sum of run lines' allocated_qty (ERR_QUANTITY_EXCEEDS_AVAILABLE)"
        side_effects:
          - "apply OrderLine OPEN -> ALLOCATED transitions per run lines (see OrderLine machine)"
          - "lot reservations per lot_reservation_fefo"
          - "increments Part.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-run-create-stale-part
    parent_entity: Part
    write_endpoint: "POST /allocation-runs"
    occ_field: "expected_part_version"
    description: |
      Creating an AllocationRun against a Part whose version has advanced
      since the client last observed it is rejected. Creating a run legitimately
      supersedes the prior PROVISIONAL run for the same part, so a writer
      holding a stale part version would supersede on the basis of an
      out-of-date supply/demand view.
    error_id: ERR_STALE_PART_VERSION
    http_status: 412

  - rule_id: order-line-reschedule-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /orders/{orderId}/lines/{lineId}/reschedule"
    occ_field: "expected_order_version"
    description: |
      Rescheduling an order line against a CustomerOrder whose version has
      advanced since the client last observed it is rejected. Rescheduling
      remains a legitimate, repeatable operation on an ACKNOWLEDGED order, so a
      writer holding a stale order version would move the ship date from an
      out-of-date view of the order (e.g. unaware of a prior reschedule or a
      line cancellation that recomputed exposures).
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fair_share_allocation
    trigger: "POST /allocation-runs (run creation)"
    algorithm: waterfall_allocation
    formula: |
      Eligibility filter: OrderLine.status == OPEN AND order.status == ACKNOWLEDGED
        AND line.part_id == run.part_id.
      supply = sum of qty_on_hand over InventoryLot rows of the part with status AVAILABLE.
      demand = sum of quantity over eligible lines.
      If supply == 0 -> ERR_NO_ALLOCATABLE_SUPPLY. If demand == 0 -> ERR_NO_OPEN_DEMAND.
      If supply >= demand: every eligible line gets allocated_qty = quantity.
      Else (shortage):
        weight_i = line.quantity                          (BACKLOG_BASIS)
                 | line.order.customer.trailing_12mo_component_usage_units (USAGE_BASIS)
        W = sum of weight_i over eligible lines.
        raw_i = floor(supply * weight_i / W)
        alloc_i = min(line.quantity, raw_i)
        remainder R = supply - sum(alloc_i)
        Distribute R one unit per pass: iterate eligible lines with alloc_i < quantity
        ordered by (created_at ASC, ship_date ASC, quantity DESC), give +1 each,
        repeat passes until R == 0.
      Run.lines sorted by order line created_at ASC.
    constants:
      ROUNDING: "floor per line first, then one-unit remainder passes; never exact-split rounding"
    precision: "integer units; floor for raw shares"
    variants:
      - name: backlog_basis
        when: "part's line allocation_policy == BACKLOG_BASIS"
        difference: "weights are booked line quantities; identical quantities split equally"
      - name: usage_basis
        when: "part's line allocation_policy == USAGE_BASIS"
        difference: "weights are customers' trailing-12-month usage units; identical booked quantities split proportionally to usage and can diverge sharply from backlog_basis"

  - name: lot_reservation_fefo
    trigger: "allocation publish (reserve), order/line cancel (release), quarantine release (release)"
    algorithm: waterfall_allocation
    formula: |
      Reserve: walk lots of the part with status == AVAILABLE ordered by
      (date_code ASC, created_at ASC); move min(needed, lot.qty_on_hand) from
      qty_on_hand to qty_reserved until the allocation total is met.
      Release: walk lots of the part with qty_reserved > 0 ordered by
      (date_code ASC, created_at ASC); move min(release_amount, lot.qty_reserved)
      from qty_reserved back to qty_on_hand.
    precision: "integer units"

  - name: ship_debit_claim_amounts
    trigger: "claim auto-creation at ship (provisional) and supplier-decision APPROVE (final)"
    algorithm: aggregation
    formula: |
      Registration selector at ship: customer_id == order.customer_id AND
      part_id == shipped part AND status == APPROVED AND valid_from <= today <= valid_to
      AND registered_qty_remaining > 0; order candidates by (valid_from ASC, created_at ASC), take first.
      covered_qty = min(ship qty, registration.registered_qty_remaining)
      amount_provisional_cents = covered_qty * (standard_cost_cents - registered_cost_cents)
      amount_final_cents     = covered_qty * (standard_cost_cents - audited_cost_cents)
      (audited_cost_cents defaults to registered_cost_cents when supplier omits it)
    precision: "integer cents; exact multiplication, no rounding needed"
    variants:
      - name: provisional
        when: "claim creation (ship time)"
        difference: "uses the registered cost snapshot; produced before supplier audit"
      - name: final
        when: "supplier-decision APPROVE"
        difference: "uses supplier-audited cost; when audited differs from registered the final amount diverges from provisional"

  - name: msl_exposure_accrual
    trigger: "POST /_clock/set_current_utc sweep (also evaluated on read)"
    algorithm: chronological
    formula: |
      For each lot: exposure = sum over MoistureExposure intervals of the lot with
      opened_at > lot.last_baked_at (null last_baked_at counts all intervals):
        sealed interval: (sealed_at - opened_at) in whole hours (floor)
        open interval:   (now - opened_at) in whole hours (floor)
      Breach: exposure >= part.floor_life_hours (boundary: equality breaches).
      On breach and lot.status == AVAILABLE: lot -> QUARANTINED with
      quarantine_release cascade (see InventoryLot machine).
    precision: "whole hours, floor"

  - name: date_code_freshness
    trigger: "POST /orders/{orderId}/lines/{lineId}/ship (per picked lot)"
    algorithm: threshold
    formula: |
      months_elapsed = (now.year - dc.year) * 12 + (now.month - dc.month)
        where dc is the lot date_code parsed as YYYYMM.
      Lot is shippable iff months_elapsed <= part.date_code_limit_months.
      Boundary: months_elapsed == limit is STILL FRESH; limit + 1 is stale.
    precision: "whole months"

  - name: buyback_credit
    trigger: "POST /buy-backs (provisional) and POST /buy-backs/{id}/receive (final)"
    algorithm: tiered_pricing
    formula: |
      price_basis_cents = min(line.unit_price_cents, part.book_price_cents)  [EXCESS_RETURN]
                        = part.book_price_cents                              [SHORTAGE_BUYBACK]
      days = whole days between line.last_shipped_at and the evaluation timestamp
      fee_pct(days) = 0.10 when days <= 90; 0.25 when 91 <= days <= 180; 0 for SHORTAGE_BUYBACK
      provisional_credit_cents = round_half_up(qty * price_basis_cents * (1 - fee_pct(days_at_request)))
      final_credit_cents       = round_half_up(received_qty * price_basis_cents * (1 - fee_pct(days_at_receipt)))
    constants:
      FEE_TIER_1_MAX_DAYS: 90
      FEE_TIER_1_PCT: 0.10
      FEE_TIER_2_MAX_DAYS: 180
      FEE_TIER_2_PCT: 0.25
      WINDOW_DAYS: 180
    precision: "integer cents, round_half_up after the full product"
    variants:
      - name: provisional
        when: "request creation"
        difference: "fee tier selected from days-since-ship at the REQUEST date"
      - name: final
        when: "receive"
        difference: "fee tier re-selected from days-since-ship at the RECEIVE date; a receipt landing in a later tier produces a smaller credit than the provisional"

  - name: buyback_cap_check
    trigger: "POST /buy-backs with kind == EXCESS_RETURN"
    algorithm: threshold
    formula: |
      cap_cents = floor(0.15 * customer.trailing_12mo_purchases_cents)
      used_cents = sum over the customer's BuyBackRequest rows with
        kind == EXCESS_RETURN, status in {REQUESTED, APPROVED, RECEIVED},
        created_at >= now - 365 days, of (final_credit_cents if RECEIVED else provisional_credit_cents)
      Allowed iff used_cents + new provisional_credit_cents <= cap_cents.
      Boundary: exactly at cap is ALLOWED (inclusive <=).
    constants:
      CAP_PCT: 0.15
      CAP_WINDOW_DAYS: 365
    precision: "integer cents, floor for cap"

  - name: credit_check_at_ship
    trigger: "POST /orders/{orderId}/lines/{lineId}/ship"
    algorithm: threshold
    formula: |
      ship_value = qty * line.unit_price_cents
      Rejected iff customer.open_balance_cents + ship_value > customer.credit_limit_cents.
      Boundary: equality is ALLOWED.
      On rejection: order transitions to ON_HOLD and the response is ERR_CREDIT_LIMIT_EXCEEDED.
    precision: "integer cents"

  - name: order_exposure
    trigger: "order acknowledge, line cancel, allocation publish, quarantine release cascade, ship"
    algorithm: aggregation
    formula: |
      open_exposure_cents = sum over lines with status in {OPEN, ALLOCATED} of
        (quantity - shipped_qty) * unit_price_cents
      allocated_value_cents = sum over lines of allocated_qty * unit_price_cents
      Recomputed on every line mutation; order.updated_at and version bump with each recompute.
    precision: "integer cents"

  - name: part_availability
    trigger: "lot receipt, inspection, quarantine, bake, order acknowledge (open_demand_qty), publish reserve, cancel release, ship"
    algorithm: aggregation
    formula: |
      part.qty_on_hand = sum of lot.qty_on_hand over lots with status == AVAILABLE
      part.qty_reserved = sum of lot.qty_reserved over lots with status == AVAILABLE
      part.open_demand_qty = sum of quantity over OrderLine rows with status == OPEN
        whose order status == ACKNOWLEDGED
    precision: "integer units"

  - name: debit_balance_reconciliation
    trigger: "claim settle (add) and claim reverse (subtract)"
    algorithm: aggregation
    formula: |
      manufacturer_line.open_debit_balance_cents =
        sum of amount_final_cents over SETTLED claims on parts of this line
        minus sum of amount_final_cents over REVERSED claims on parts of this line.
      Settle + its compensating reverse leave the balance unchanged (net zero drift).
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role allowed for endpoint; CustomerBuyer ownership: body customer_id or target resource's customer_id must equal X-User-ID"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request shape first (missing required fields, invalid enum members, non-positive quantities, empty lines array -> ERR_INVALID_REQUEST, http 400); then path ids validated left-to-right and body FK fields (manufacturer_line_id, customer_id, part_id, order_line_id, primary/alternate_part_id) must reference existing resources (http 404)"
    error_id: "ERR_INVALID_REQUEST | ERR_MANUFACTURER_LINE_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_EXPOSURE_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_BUYBACK_NOT_FOUND | ERR_ALLOCATION_RUN_NOT_FOUND | ERR_ALTERNATE_APPROVAL_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target entity state precondition for the operation (order SUBMITTED/ACKNOWLEDGED/ON_HOLD, line OPEN/ALLOCATED, claim state, registration SUBMITTED, run PROVISIONAL, lot AVAILABLE/QUARANTINED/IN_INSPECTION, buy-back REQUESTED/APPROVED, customer GOOD_STANDING)"
    error_id: "ERR_ORDER_NOT_SUBMITTED | ERR_ORDER_NOT_ACKNOWLEDGED | ERR_ORDER_ON_HOLD | ERR_LINE_NOT_ALLOCATED | ERR_LINE_NOT_OPEN_OR_ALLOCATED | ERR_CLAIM_INVALID_STATE | ERR_REGISTRATION_NOT_SUBMITTED | ERR_ALLOCATION_RUN_NOT_PROVISIONAL | ERR_LOT_NOT_AVAILABLE | ERR_LOT_NOT_QUARANTINED | ERR_INSPECTION_NOT_PENDING | ERR_BUYBACK_INVALID_STATE | ERR_ALTERNATE_APPROVAL_INVALID_STATE | ERR_CUSTOMER_CREDIT_HOLD"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: inspector X-User-ID must differ from lot.received_by_user_id; date-code freshness of every picked lot at ship (months_elapsed <= date_code_limit_months)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_DATE_CODE_TOO_OLD"
    http_status: 403
    applies_to: "POST /lots/{lotId}/inspect; POST /orders/{orderId}/lines/{lineId}/ship"
    note: "ERR_DATE_CODE_TOO_OLD uses http 409 (see errors table); safety beats fiscal when both fail"

  - priority: 6
    category: business_constraint
    check: "Uniqueness (line_code, part_number within line); channel match (FRANCHISED lot requires FRANCHISED line); one open exposure interval per lot; seal requires an open interval; registration window overlap for same (customer_id, part_id) among SUBMITTED/APPROVED registrations (CLOSED intervals — touching conflicts); buy-back qty <= shipped - already returned/requested; publish supply sufficiency; allocation supply/demand non-zero"
    error_id: "ERR_DUPLICATE_LINE_CODE | ERR_DUPLICATE_PART_NUMBER | ERR_CHANNEL_MISMATCH | ERR_EXPOSURE_ALREADY_OPEN | ERR_EXPOSURE_NOT_OPEN | ERR_REGISTRATION_WINDOW_OVERLAP | ERR_BUYBACK_QTY_EXCEEDED | ERR_QUANTITY_EXCEEDS_AVAILABLE | ERR_NO_ALLOCATABLE_SUPPLY | ERR_NO_OPEN_DEMAND"
    http_status: 409
    applies_to: "create/publish/exposure/buy-back endpoints"

  - priority: 7
    category: business_temporal
    check: "Cancel window (now < cancel_by_date, strict); reschedule window (now < ship_date - reschedule_window_days, strict); new ship_date must be after today; NCNR line cancellation; buy-back window (now <= last_shipped_at + 180 days, inclusive)"
    error_id: "ERR_CANCEL_WINDOW_CLOSED | ERR_RESCHEDULE_WINDOW_CLOSED | ERR_SHIP_DATE_IN_PAST | ERR_LINE_NCNR | ERR_BUYBACK_WINDOW_CLOSED"
    http_status: 409
    applies_to: "cancel/reschedule/buy-back endpoints"
    note: "ERR_LINE_NCNR is listed under temporal-window checks because NCNR and window checks are evaluated as one cancellation-terms group; within the group NCNR is checked before the window"

  - priority: 8
    category: business_referential
    check: "Substitute part must have an APPROVED AlternatePartApproval for (customer, primary, alternate); SHORTAGE_BUYBACK requires a PUBLISHED allocation run for the part with total_demand_qty > total_supply_qty; order cancel requires zero shipped lines"
    error_id: "ERR_ALTERNATE_NOT_APPROVED | ERR_SHORTAGE_NOT_IN_EFFECT | ERR_ORDER_HAS_SHIPPED_LINES"
    http_status: 409
    applies_to: "ship, buy-back create, order cancel"

  - priority: 9
    category: business_fiscal
    check: "Credit limit at ship (open_balance + ship value <= credit_limit); excess buy-back 15% trailing-purchases cap (inclusive)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_BUYBACK_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /orders/{orderId}/lines/{lineId}/ship; POST /buy-backs"
    note: "ERR_BUYBACK_CAP_EXCEEDED uses http 422 (see errors table); fiscal checks run last"

# =============================================================================
# §1.5 API Endpoint Table (flat resources; roles explicit)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default time is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly that default and never falls back to wall-clock time. Setting the clock runs the system sweep: (a) registration expiry (SUBMITTED/APPROVED with valid_to < now -> EXPIRED); (b) MSL accrual and quarantine cascade per msl_exposure_accrual."
    roles: [DistributorAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: "datetime" }
    side_effects: ["registration expiry sweep", "msl_exposure_accrual sweep with quarantine cascade"]

  # --- ManufacturerLine ---
  - method: POST
    path: "/manufacturer-lines"
    description: "Create a franchise/open-market manufacturer line"
    roles: [DistributorAdmin]
    code: 201
    input: [line_code, name, sourcing_channel, "ncnr?", "cancel_window_days?", "reschedule_window_days?", "allocation_policy?"]
    output: ManufacturerLine
    side_effects: ["open_debit_balance_cents initialized to 0"]

  - method: GET
    path: "/manufacturer-lines"
    description: "List manufacturer lines"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManufacturerLine[]"
    side_effects: []

  - method: GET
    path: "/manufacturer-lines/{lineId}"
    description: "Get one manufacturer line (includes open_debit_balance_cents)"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: ManufacturerLine
    side_effects: []

  # --- Part ---
  - method: POST
    path: "/parts"
    description: "Create a catalog part on a line"
    roles: [DistributorAdmin]
    code: 201
    input: [manufacturer_line_id, part_number, msl_level, floor_life_hours, date_code_limit_months, standard_cost_cents, book_price_cents]
    output: Part
    side_effects: []

  - method: GET
    path: "/parts"
    description: "List parts, filterable by line"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["manufacturer_line_id?", "limit?", "offset?"]
    output: "Part[]"
    side_effects: []

  - method: GET
    path: "/parts/{partId}"
    description: "Get one part (includes computed qty_on_hand / qty_reserved / open_demand_qty and version for OCC)"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: Part
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer account"
    roles: [DistributorAdmin]
    code: 201
    input: [name, credit_limit_cents, "open_balance_cents?", "trailing_12mo_purchases_cents?", "trailing_12mo_component_usage_units?", "status?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get one customer"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- DesignRegistration ---
  - method: POST
    path: "/design-registrations"
    description: "Submit a design registration; validity window must not overlap another SUBMITTED/APPROVED registration for the same (customer_id, part_id) — CLOSED interval semantics, touching windows conflict"
    roles: [SalesRep, CustomerBuyer]
    code: 201
    input: [customer_id, part_id, end_customer_name, registered_cost_cents, max_registered_qty, valid_from, valid_to]
    output: DesignRegistration
    side_effects: ["status = SUBMITTED; registered_qty_remaining = 0 until approval"]

  - method: GET
    path: "/design-registrations"
    description: "List design registrations with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["customer_id?", "part_id?", "status?", "limit?", "offset?"]
    output: "DesignRegistration[]"
    side_effects: []

  - method: GET
    path: "/design-registrations/{registrationId}"
    description: "Get one design registration"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: DesignRegistration
    side_effects: []

  - method: POST
    path: "/design-registrations/{registrationId}/decision"
    description: "Supplier decision on a SUBMITTED registration"
    roles: [SupplierAdmin]
    code: 200
    input: [decision, "reason?"]
    output: DesignRegistration
    side_effects: ["APPROVE: status -> APPROVED and registered_qty_remaining = max_registered_qty; REJECT: status -> REJECTED"]

  # --- CustomerOrder / OrderLine ---
  - method: POST
    path: "/orders"
    description: "Create an order with inline scheduled lines; order starts SUBMITTED"
    roles: [SalesRep, CustomerBuyer]
    code: 201
    input: [customer_id, lines, "note?"]
    output: CustomerOrder
    side_effects: ["lines created with status OPEN", "customer.status must be GOOD_STANDING (ERR_CUSTOMER_CREDIT_HOLD)"]

  - method: GET
    path: "/orders"
    description: "List orders with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "CustomerOrder[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get one order (includes version for OCC)"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/acknowledge"
    description: "Acknowledge a SUBMITTED order; snapshots NCNR/window terms and unit prices onto lines"
    roles: [SalesRep]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["per-line snapshots per CustomerOrder state machine", "increments CustomerOrder.version by 1", "recompute open_exposure_cents"]

  - method: POST
    path: "/orders/{orderId}/release-hold"
    description: "Release an ON_HOLD order back to ACKNOWLEDGED"
    roles: [SalesRep, DistributorAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status ON_HOLD -> ACKNOWLEDGED", "increments CustomerOrder.version by 1"]

  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Cancel an ACKNOWLEDGED order; fails if any line is NCNR, past its cancel window, or already shipped"
    roles: [SalesRep, CustomerBuyer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["OPEN/ALLOCATED lines -> CANCELLED", "reservations released", "exposure/allocated value zeroed", "increments CustomerOrder.version by 1"]

  - method: POST
    path: "/orders/{orderId}/lines/{lineId}/reschedule"
    description: "Reschedule a line's ship_date; allowed while now < ship_date - reschedule_window_days; NCNR lines may only be pushed out (new_ship_date > ship_date). OCC-guarded on the order version."
    roles: [SalesRep, CustomerBuyer]
    code: 200
    input: [new_ship_date, expected_order_version]
    output: OrderLine
    side_effects: ["ship_date = new_ship_date", "cancel_by_date recomputed", "increments CustomerOrder.version by 1"]

  - method: POST
    path: "/orders/{orderId}/lines/{lineId}/cancel"
    description: "Cancel one OPEN/ALLOCATED line under cancellation terms"
    roles: [SalesRep, CustomerBuyer]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line -> CANCELLED", "reservations released if ALLOCATED", "recompute order exposure/allocated value", "increments CustomerOrder.version by 1"]

  - method: POST
    path: "/orders/{orderId}/lines/{lineId}/ship"
    description: "Ship qty units of an ALLOCATED line (FEFO lot pick); auto-creates a ship-and-debit claim when a covering APPROVED registration exists"
    roles: [WarehouseOps]
    code: 200
    input: [qty, "substitute_part_id?"]
    output: OrderLine
    side_effects: ["lot qty_reserved -> qty_shipped", "customer.open_balance_cents += qty * unit_price_cents", "claim auto-creation per ship_debit_claim_amounts", "order auto-transitions", "credit failure moves order to ON_HOLD"]

  - method: GET
    path: "/order-lines"
    description: "List order lines with filters (FK reverse-reachability for order_id and part_id); ordered by created_at ASC, and lines created in the same POST /orders request are ordered by their array index in that request"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["order_id?", "part_id?", "status?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines/{lineId}"
    description: "Get one order line"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # --- AlternatePartApproval ---
  - method: POST
    path: "/alternate-approvals"
    description: "Propose a cross-reference alternate part for a customer"
    roles: [SalesRep, CustomerBuyer]
    code: 201
    input: [customer_id, primary_part_id, alternate_part_id]
    output: AlternatePartApproval
    side_effects: ["status = PROPOSED"]

  - method: GET
    path: "/alternate-approvals"
    description: "List alternate-part approvals with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["customer_id?", "primary_part_id?", "alternate_part_id?", "status?", "limit?", "offset?"]
    output: "AlternatePartApproval[]"
    side_effects: []

  - method: GET
    path: "/alternate-approvals/{approvalId}"
    description: "Get one alternate-part approval"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: AlternatePartApproval
    side_effects: []

  - method: POST
    path: "/alternate-approvals/{approvalId}/decision"
    description: "Customer decision: APPROVE or REJECT from PROPOSED; REVOKE from APPROVED"
    roles: [CustomerBuyer]
    code: 200
    input: [decision, "reason?"]
    output: AlternatePartApproval
    side_effects: ["status transition per AlternatePartApproval machine"]

  # --- InventoryLot / MoistureExposure ---
  - method: POST
    path: "/lots"
    description: "Receive an inventory lot; FRANCHISED lots start AVAILABLE, OPEN_MARKET lots start IN_INSPECTION with authenticity PENDING_INSPECTION"
    roles: [WarehouseOps]
    code: 201
    input: [part_id, date_code, qty_received, source_type]
    output: InventoryLot
    side_effects: ["qty_on_hand = qty_received", "received_by_user_id = X-User-ID", "recompute part availability"]

  - method: GET
    path: "/lots"
    description: "List lots with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["part_id?", "status?", "authenticity?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/lots/{lotId}"
    description: "Get one lot"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: POST
    path: "/lots/{lotId}/inspect"
    description: "Authenticate or reject an open-market lot; inspector must differ from receiver (segregation of duties)"
    roles: [QualityInspector]
    code: 200
    input: [disposition, "note?"]
    output: InventoryLot
    side_effects: ["AUTHENTICATE: status -> AVAILABLE, authenticity -> AUTHENTICATED", "REJECT: status -> REJECTED, authenticity -> REJECTED"]

  - method: POST
    path: "/lots/{lotId}/exposures"
    description: "Open the dry pack of an AVAILABLE lot (starts a moisture-exposure interval at the logical clock)"
    roles: [WarehouseOps]
    code: 201
    input: ["note?"]
    output: MoistureExposure
    side_effects: ["opened_at = now; fails if another interval is open (ERR_EXPOSURE_ALREADY_OPEN)"]

  - method: GET
    path: "/lots/{id}/exposures"
    description: "List exposure intervals of a lot (FK reverse-reachability)"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "MoistureExposure[]"
    side_effects: []

  - method: POST
    path: "/lots/{lotId}/exposures/{exposureId}/seal"
    description: "Seal an open exposure interval"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: MoistureExposure
    side_effects: ["sealed_at = now"]

  - method: POST
    path: "/lots/{lotId}/bake"
    description: "Bake a QUARANTINED lot with no open exposure; resets MSL exposure and returns the lot to AVAILABLE"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["last_baked_at = now", "msl_exposure_hours = 0", "status QUARANTINED -> AVAILABLE", "recompute part availability"]

  # --- AllocationRun ---
  - method: POST
    path: "/allocation-runs"
    description: "Create a PROVISIONAL fair-share allocation run for a part; supersedes the prior PROVISIONAL run for the same part. OCC-guarded on the part version (expected_part_version required)."
    roles: [DistributorAdmin]
    code: 201
    input: [part_id, expected_part_version]
    output: AllocationRun
    side_effects: ["prior PROVISIONAL run for the part -> SUPERSEDED", "fair_share_allocation computed into lines", "increments Part.version by 1"]

  - method: GET
    path: "/allocation-runs"
    description: "List allocation runs with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["part_id?", "status?", "limit?", "offset?"]
    output: "AllocationRun[]"
    side_effects: []

  - method: GET
    path: "/allocation-runs/{runId}"
    description: "Get one allocation run (includes computed lines array)"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []

  - method: POST
    path: "/allocation-runs/{runId}/publish"
    description: "Publish a PROVISIONAL run: applies line allocations and FEFO lot reservations"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["OrderLine OPEN -> ALLOCATED per run lines", "lot_reservation_fefo reserve", "recompute order allocated_value_cents", "recompute part availability", "increments Part.version by 1"]

  # --- ShipAndDebitClaim ---
  - method: GET
    path: "/claims"
    description: "List ship-and-debit claims with filters (FK reverse-reachability for registration_id and order_line_id); ordered by created_at ASC"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["registration_id?", "order_line_id?", "status?", "limit?", "offset?"]
    output: "ShipAndDebitClaim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}"
    description: "Get one claim"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: ShipAndDebitClaim
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/supplier-decision"
    description: "Supplier decision on a SUBMITTED/DISPUTED claim: APPROVE (optionally with audited_cost_cents), REJECT (restores registration qty), or DISPUTE"
    roles: [SupplierAdmin]
    code: 200
    input: [decision, "audited_cost_cents?", "reason?"]
    output: ShipAndDebitClaim
    side_effects: ["APPROVE: amount_final_cents computed", "REJECT: registration.registered_qty_remaining += claim.qty; EXHAUSTED -> APPROVED when remaining > 0"]

  - method: POST
    path: "/claims/{claimId}/resubmit"
    description: "Resubmit a DISPUTED claim back to SUBMITTED"
    roles: [SalesRep]
    code: 200
    input: ["note?"]
    output: ShipAndDebitClaim
    side_effects: ["status DISPUTED -> SUBMITTED"]

  - method: POST
    path: "/claims/{claimId}/settle"
    description: "Settle a SUPPLIER_APPROVED claim; posts the debit to the manufacturer line"
    roles: [SupplierAdmin]
    code: 200
    input: []
    output: ShipAndDebitClaim
    side_effects: ["manufacturer_line.open_debit_balance_cents += amount_final_cents"]

  - method: POST
    path: "/claims/{claimId}/reverse"
    description: "Reverse a SETTLED claim (chargeback); compensates the debit and restores registration quantity"
    roles: [SupplierAdmin]
    code: 200
    input: ["reason?"]
    output: ShipAndDebitClaim
    side_effects: ["manufacturer_line.open_debit_balance_cents -= amount_final_cents", "registration.registered_qty_remaining += claim.qty", "EXHAUSTED registration with remaining > 0 -> APPROVED"]

  # --- BuyBackRequest ---
  - method: POST
    path: "/buy-backs"
    description: "Request an excess return or shortage buy-back; computes provisional credit and enforces window/qty/cap rules"
    roles: [SalesRep, CustomerBuyer]
    code: 201
    input: [customer_id, order_line_id, kind, qty]
    output: BuyBackRequest
    side_effects: ["price_basis_cents / fee_pct / provisional_credit_cents computed per buyback_credit"]

  - method: GET
    path: "/buy-backs"
    description: "List buy-back requests with filters"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: ["customer_id?", "order_line_id?", "status?", "limit?", "offset?"]
    output: "BuyBackRequest[]"
    side_effects: []

  - method: GET
    path: "/buy-backs/{buyBackId}"
    description: "Get one buy-back request"
    roles: [DistributorAdmin, SalesRep, CustomerBuyer, WarehouseOps, QualityInspector, SupplierAdmin]
    code: 200
    input: []
    output: BuyBackRequest
    side_effects: []

  - method: POST
    path: "/buy-backs/{buyBackId}/decision"
    description: "Distributor decision on a REQUESTED buy-back"
    roles: [DistributorAdmin]
    code: 200
    input: [decision, "reason?"]
    output: BuyBackRequest
    side_effects: ["APPROVE: -> APPROVED; REJECT: -> REJECTED"]

  - method: POST
    path: "/buy-backs/{buyBackId}/receive"
    description: "Receive returned units of an APPROVED buy-back; computes final credit at the receipt-date tier and creates an IN_INSPECTION return lot"
    roles: [WarehouseOps]
    code: 200
    input: [received_qty, lot_date_code]
    output: BuyBackRequest
    side_effects: ["final_credit_cents computed per buyback_credit final variant", "order_line.returned_qty += received_qty", "create return InventoryLot (OPEN_MARKET, PENDING_INSPECTION, IN_INSPECTION)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed for the endpoint, or CustomerBuyer acting on a resource whose customer_id != X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, non-positive quantity, or empty lines array" }
  - { id: ERR_MANUFACTURER_LINE_NOT_FOUND, http: 404, condition: "manufacturer line id (path or body FK) does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "part id (path or body FK) does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id (path or body FK) does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id in path does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id in path or body FK does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot id in path does not exist" }
  - { id: ERR_EXPOSURE_NOT_FOUND, http: 404, condition: "exposure id in path does not exist or does not belong to the lot" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration id in path does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id in path does not exist" }
  - { id: ERR_BUYBACK_NOT_FOUND, http: 404, condition: "buy-back id in path does not exist" }
  - { id: ERR_ALLOCATION_RUN_NOT_FOUND, http: 404, condition: "allocation run id in path does not exist" }
  - { id: ERR_ALTERNATE_APPROVAL_NOT_FOUND, http: 404, condition: "alternate approval id in path does not exist" }
  - { id: ERR_DUPLICATE_LINE_CODE, http: 409, condition: "line_code already exists" }
  - { id: ERR_DUPLICATE_PART_NUMBER, http: 409, condition: "part_number already exists within the manufacturer line" }
  - { id: ERR_CHANNEL_MISMATCH, http: 409, condition: "FRANCHISED lot received for a part whose line sourcing_channel != FRANCHISED" }
  - { id: ERR_ORDER_NOT_SUBMITTED, http: 409, condition: "acknowledge attempted on an order not in SUBMITTED" }
  - { id: ERR_ORDER_NOT_ACKNOWLEDGED, http: 409, condition: "cancel/reschedule/release attempted on an order not in the required state (ACKNOWLEDGED for cancel, ON_HOLD for release-hold, ACKNOWLEDGED/PARTIALLY_SHIPPED for line ops)" }
  - { id: ERR_ORDER_ON_HOLD, http: 409, condition: "operation attempted while the order is ON_HOLD" }
  - { id: ERR_ORDER_HAS_SHIPPED_LINES, http: 409, condition: "order cancel attempted when a line has shipped_qty > 0" }
  - { id: ERR_LINE_NOT_ALLOCATED, http: 409, condition: "ship attempted on a line not in ALLOCATED" }
  - { id: ERR_LINE_NOT_OPEN_OR_ALLOCATED, http: 409, condition: "line cancel attempted on a line in SHIPPED or CANCELLED" }
  - { id: ERR_LINE_NCNR, http: 409, condition: "cancel attempted on a line whose ncnr_snapshot is true" }
  - { id: ERR_CANCEL_WINDOW_CLOSED, http: 409, condition: "cancel attempted at or after cancel_by_date (window open iff now < cancel_by_date)" }
  - { id: ERR_RESCHEDULE_WINDOW_CLOSED, http: 409, condition: "reschedule attempted at or after ship_date - reschedule_window_days (strict <)" }
  - { id: ERR_SHIP_DATE_IN_PAST, http: 409, condition: "reschedule new_ship_date is not after today, or NCNR line reschedule is not a push-out" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "exposure open attempted on a lot not in AVAILABLE" }
  - { id: ERR_LOT_NOT_QUARANTINED, http: 409, condition: "bake attempted on a lot not in QUARANTINED" }
  - { id: ERR_INSPECTION_NOT_PENDING, http: 409, condition: "inspect attempted on a lot not in IN_INSPECTION" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "inspector X-User-ID equals lot.received_by_user_id" }
  - { id: ERR_EXPOSURE_ALREADY_OPEN, http: 409, condition: "open attempted while another exposure interval of the lot is unsealed (half-open interval semantics: adjacency at sealed_at is allowed, nesting is not)" }
  - { id: ERR_EXPOSURE_NOT_OPEN, http: 409, condition: "seal attempted when the exposure is already sealed" }
  - { id: ERR_DATE_CODE_TOO_OLD, http: 409, condition: "a picked lot's months_elapsed exceeds the part's date_code_limit_months at ship time" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "open_balance_cents + ship value would exceed credit_limit_cents; order moves to ON_HOLD" }
  - { id: ERR_REGISTRATION_WINDOW_OVERLAP, http: 409, condition: "validity window overlaps a SUBMITTED/APPROVED registration for the same (customer_id, part_id); CLOSED intervals — valid_from == existing valid_to conflicts" }
  - { id: ERR_REGISTRATION_NOT_SUBMITTED, http: 409, condition: "decision attempted on a registration not in SUBMITTED" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "claim action attempted from a state where it is not allowed" }
  - { id: ERR_BUYBACK_INVALID_STATE, http: 409, condition: "buy-back decision/receive attempted from a state where it is not allowed" }
  - { id: ERR_BUYBACK_WINDOW_CLOSED, http: 409, condition: "EXCESS_RETURN requested more than 180 days after line.last_shipped_at (allowed iff now <= last_shipped_at + 180 days)" }
  - { id: ERR_BUYBACK_QTY_EXCEEDED, http: 409, condition: "requested qty exceeds line.shipped_qty minus quantities already covered by REQUESTED/APPROVED/RECEIVED buy-backs on the line; also receive received_qty > request qty" }
  - { id: ERR_SHORTAGE_NOT_IN_EFFECT, http: 409, condition: "SHORTAGE_BUYBACK requested for a part with no PUBLISHED allocation run where total_demand_qty > total_supply_qty" }
  - { id: ERR_ALTERNATE_NOT_APPROVED, http: 409, condition: "ship with substitute_part_id lacking an APPROVED AlternatePartApproval for (customer, primary, alternate)" }
  - { id: ERR_ALTERNATE_APPROVAL_INVALID_STATE, http: 409, condition: "decision attempted on an approval not in the required state (PROPOSED for APPROVE/REJECT, APPROVED for REVOKE)" }
  - { id: ERR_NO_ALLOCATABLE_SUPPLY, http: 409, condition: "allocation run created while AVAILABLE supply for the part is zero" }
  - { id: ERR_NO_OPEN_DEMAND, http: 409, condition: "allocation run created while eligible open demand for the part is zero" }
  - { id: ERR_QUANTITY_EXCEEDS_AVAILABLE, http: 409, condition: "ship qty exceeds allocated remainder, or publish-time supply fell below the run's total allocation" }
  - { id: ERR_STALE_PART_VERSION, http: 412, condition: "expected_part_version does not match the part's current version (OCC)" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match the order's current version (OCC)" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 409, condition: "order create or acknowledge attempted for a customer in CREDIT_HOLD" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistributorAdmin
    description: "Distributor operations administrator: catalog, customers, allocation, buy-back decisions, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /manufacturer-lines"
      - "POST /parts"
      - "POST /customers"
      - "POST /allocation-runs"
      - "POST /allocation-runs/{runId}/publish"
      - "POST /buy-backs/{buyBackId}/decision"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "POST /orders/{orderId}/release-hold (with SalesRep)"

  - name: SalesRep
    description: "Distributor inside-sales representative: orders, registrations, claims resubmission"
    identity: opaque
    exclusive_operations:
      - "POST /orders/{orderId}/acknowledge"
      - "POST /claims/{claimId}/resubmit"
    shared_operations:
      - "all GET endpoints"
      - "POST /orders, POST /orders/{orderId}/cancel, POST /orders/{orderId}/lines/{lineId}/cancel, POST /orders/{orderId}/lines/{lineId}/reschedule (with CustomerBuyer)"
      - "POST /design-registrations, POST /alternate-approvals, POST /buy-backs (with CustomerBuyer)"
      - "POST /orders/{orderId}/release-hold (with DistributorAdmin)"

  - name: CustomerBuyer
    description: "Customer-side buyer acting as their Customer account; X-User-ID equals the Customer id"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /alternate-approvals/{approvalId}/decision"
    shared_operations:
      - "all GET endpoints"
      - "POST /orders, POST /orders/{orderId}/cancel, POST /orders/{orderId}/lines/{lineId}/cancel, POST /orders/{orderId}/lines/{lineId}/reschedule (own customer_id only)"
      - "POST /design-registrations, POST /alternate-approvals, POST /buy-backs (own customer_id only)"

  - name: WarehouseOps
    description: "Distribution-center operator: lot receipt, MSL handling, shipping, buy-back receipt"
    identity: opaque
    exclusive_operations:
      - "POST /lots"
      - "POST /lots/{lotId}/exposures"
      - "POST /lots/{lotId}/exposures/{exposureId}/seal"
      - "POST /lots/{lotId}/bake"
      - "POST /orders/{orderId}/lines/{lineId}/ship"
      - "POST /buy-backs/{buyBackId}/receive"
    shared_operations:
      - "all GET endpoints"

  - name: QualityInspector
    description: "Independent authenticity inspector; segregated from the lot's receiver"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lotId}/inspect"
    shared_operations:
      - "all GET endpoints"

  - name: SupplierAdmin
    description: "Supplier-side administrator deciding registrations and ship-and-debit claims"
    identity: opaque
    exclusive_operations:
      - "POST /design-registrations/{registrationId}/decision"
      - "POST /claims/{claimId}/supplier-decision"
      - "POST /claims/{claimId}/settle"
      - "POST /claims/{claimId}/reverse"
    shared_operations:
      - "all GET endpoints"
