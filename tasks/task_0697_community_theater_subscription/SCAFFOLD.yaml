    input: []
    output: Donation
    side_effects: ["status=FULFILLED; recomputes lifetime_donation and donor_level; if seat_id set, Seat.naming_status=NAMED with named_plaque_text=plaque_text"]

  - method: POST
    path: "/box-office/donations/{id}/refund"
    description: "Refund a fulfilled donation; may demote donor_level"
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Donation
    side_effects: ["status=REFUNDED; recomputes lifetime_donation and donor_level"]

  # ---- Exchanges / Flex-pass ----
  - method: POST
    path: "/box-office/exchanges"
    description: "Request an exchange / flex-pass move to a target performance+seat"
    roles: [BoxOfficeAgent, Patron]
    code: 201
    input: [original_ticket_id, target_performance_id, target_seat_id, mode]
    output: Exchange
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/box-office/exchanges/{id}"
    description: "Get one exchange"
    roles: [SeasonAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: Exchange
    side_effects: []

  - method: GET
    path: "/box-office/exchanges"
    description: "List exchanges; filter by original_ticket_id, target_performance_id, or target_seat_id"
    roles: [SeasonAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: ["original_ticket_id?", "target_performance_id?", "target_seat_id?", "limit?", "offset?"]
    output: "Exchange[]"
    side_effects: []

  - method: POST
    path: "/box-office/exchanges/{id}/complete"
    description: "Complete exchange; computes exchange_fee, voids original, mints replacement ticket"
    roles: [BoxOfficeAgent]
    code: 200
    input: ["pay_from_credit?"]
    output: Exchange
    side_effects: ["Original Ticket EXCHANGED/REFUNDED; new ISSUED/PAID Ticket minted; fee_cents and price_delta_cents computed; if pay_from_credit, account_credit debited by total_charge"]

  - method: POST
    path: "/box-office/exchanges/{id}/deny"
    description: "Deny an exchange request (cyclic; holder may request again)"
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Exchange
    side_effects: ["status=DENIED"]

  # ---- Auditions & Casting ----
  - method: POST
    path: "/box-office/auditions"
    description: "Schedule an audition for a production"
    roles: [ArtisticDirector]
    code: 201
    input: [production_id, applicant_name, role_applied_for]
    output: Audition
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/box-office/auditions/{id}"
    description: "Get one audition"
    roles: [SeasonAdmin, ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: []

  - method: GET
    path: "/box-office/auditions"
    description: "List auditions; filter by production_id"
    roles: [SeasonAdmin, ArtisticDirector]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: "Audition[]"
    side_effects: []

  - method: POST
    path: "/box-office/auditions/{id}/record"
    description: "Record audition; SCHEDULED->AUDITIONED"
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: []

  - method: POST
    path: "/box-office/auditions/{id}/callback"
    description: "Issue callback; AUDITIONED->CALLBACK"
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: []

  - method: POST
    path: "/box-office/auditions/{id}/cast"
    description: "Cast performer; ->CAST; sets cast_role/is_volunteer on the Audition"
    roles: [ArtisticDirector]
    code: 200
    input: [cast_role, "is_volunteer?"]
    output: Audition
    side_effects: ["Sets cast_role and is_volunteer; rejects duplicate cast_role on the production"]

  - method: POST
    path: "/box-office/auditions/{id}/decline"
    description: "Decline applicant; ->DECLINED"
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request body missing a required field or has a wrong type / out-of-range value" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "Referenced Season id does not exist" }
  - { id: ERR_PRODUCTION_NOT_FOUND, http: 404, condition: "Referenced Production id does not exist" }
  - { id: ERR_PERFORMANCE_NOT_FOUND, http: 404, condition: "Referenced Performance id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Referenced Venue id does not exist" }
  - { id: ERR_SEAT_NOT_FOUND, http: 404, condition: "Referenced Seat id does not exist" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "Referenced Patron id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Referenced Subscription id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced Ticket id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "Referenced Donation id does not exist" }
  - { id: ERR_EXCHANGE_NOT_FOUND, http: 404, condition: "Referenced Exchange id does not exist" }
  - { id: ERR_AUDITION_NOT_FOUND, http: 404, condition: "Referenced Audition id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state from which the requested transition is defined" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Renewal open/close attempted before the logical clock reaches the season's renewal window boundary" }
  - { id: ERR_PERFORMANCE_NOT_ON_SALE, http: 409, condition: "Single ticket hold/pay attempted while performance not ON_SALE, or open-sales attempted before on_sale_at" }
  - { id: ERR_WILL_CALL_CLOSED, http: 409, condition: "Will-call pickup attempted within will_call_cutoff_minutes of curtain" }
  - { id: ERR_SETTLE_BEFORE_CURTAIN, http: 409, condition: "Settle attempted before the logical clock reaches starts_at" }
  - { id: ERR_SEAT_NOT_IN_VENUE, http: 409, condition: "Requested seat does not belong to the performance's venue" }
  - { id: ERR_SEAT_ALREADY_TAKEN, http: 409, condition: "Requested seat already has a non-VOID ticket on this performance" }
  - { id: ERR_ACCESSIBILITY_UNAVAILABLE, http: 409, condition: "Requested accessibility_service not in the production's accessibility_offered set" }
  - { id: ERR_SEAT_NOT_RENEWABLE, http: 409, condition: "Subscription seat assign or renewal targets a seat that is not RELEASED/ASSIGNED-eligible" }
  - { id: ERR_SEAT_ALREADY_NAMED, http: 409, condition: "Seat-naming donation fulfilled against a seat already in naming_status=NAMED" }
  - { id: ERR_TARGET_SEAT_MISMATCH, http: 409, condition: "Exchange target seat is not in the target performance's venue" }
  - { id: ERR_ROLE_ALREADY_CAST, http: 409, condition: "Casting a cast_role already held by an existing CAST Audition on the production" }
  - { id: ERR_PERFORMANCE_SOLD_OUT, http: 402, condition: "Ticket hold would exceed available_seat_count" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Exchange charge paid from credit exceeds patron account_credit_cents" }
  - { id: ERR_STALE_SEASON_VERSION, http: 412, condition: "expected_season_version != Season.version on subscription activate" }
  - { id: ERR_STALE_PERFORMANCE_VERSION, http: 412, condition: "expected_performance_version != Performance.version on ticket hold" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SeasonAdmin
    description: "Configures seasons, productions, venues, seats, performances; runs renewal-window and cancellation operations"
    identity: opaque
    exclusive_operations:
      - "create/close seasons; open-renewal; close-renewal"
      - "create venues and seats; create performances; schedule/cancel performances"
    shared_operations:
      - "create productions; announce productions (with ArtisticDirector)"
      - "register patrons (with BoxOfficeAgent)"
      - "read all resources"

  - name: BoxOfficeAgent
    description: "Runs day-to-day sales, will-call, payments, activations, fulfillments, exchanges"
    identity: opaque
    exclusive_operations:
      - "open-sales/suspend-sales/settle performances; activate/offer-renewal subscriptions"
      - "pay/will-call-pickup tickets; fulfill/refund donations; complete/deny exchanges"
    shared_operations:
      - "register patrons (with SeasonAdmin)"
      - "create subscriptions, subscription-seats, tickets, donations, exchanges (with Patron)"
      - "release tickets (with Patron)"
      - "read all resources"

  - name: Patron
    description: "A theater patron acting on their own subscriptions, tickets, donations, and exchanges"
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "confirm-renewal of own subscription; cancel own subscription"
    shared_operations:
      - "create own subscriptions, subscription-seats, tickets, donations, exchanges (with BoxOfficeAgent)"
      - "pay/release own tickets (with BoxOfficeAgent)"
      - "read own resources"

  - name: ArtisticDirector
    description: "Manages productions and casting: auditions, callbacks, casting, declines"
    identity: opaque
    exclusive_operations:
      - "record/callback/cast/decline auditions; create auditions"
    shared_operations:
      - "create productions; announce productions (with SeasonAdmin)"
      - "read productions and auditions"
