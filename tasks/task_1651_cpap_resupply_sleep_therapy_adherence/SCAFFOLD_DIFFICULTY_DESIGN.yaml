              as: OpsAdmin
              captures: { rc8_post: "$.data[0].billing_status" }
          assert:
            - "before reconcile: Patient.${pat8}.patient_status == 'DISCONTINUING' (${pat8_pre})"
            - "after reconcile: Patient.${pat8}.patient_status == 'DISCONTINUED' (${pat8_post})   # hop1->hop2"
            - "MASK plan_status == 'CLOSED' (${plan8_post})   # hop2 cascade"
            - "RentalContract.billing_status == 'TERMINATED' (${rc8_post})   # hop2 cascade"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: ≥2 instances with DIFFERENT
  # error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_order_create
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_CADENCE_NOT_MET]
        distinguishing_aspect: |
          Category pair = state vs business_temporal. A create-order request
          where the plan is both SUSPENDED_NON_COMPLIANCE (priority 6, state)
          AND next_eligible_on is in the future (priority 8, business_temporal)
          must surface ERR_PLAN_NOT_ACTIVE, not ERR_CADENCE_NOT_MET.
        test_recipe:
          setup:
            - "PayerPolicy p1 standard; Patient pat9 RENTAL setup complete; first CUSHION dispensed 2026-08-01 (next_eligible_on=2026-08-31)"
            - "Finalize non-compliant adherence -> Patient NON_COMPLIANT_HOLD, plans SUSPENDED_NON_COMPLIANCE"
            - "Finalize compliant adherence to bring Patient back to ACTIVE_THERAPY BUT plans resume to ACTIVE"
            - "Wait — to have plan SUSPENDED at the moment of order creation while patient is ACTIVE is impossible via cascade; instead, drive Patient into NON_COMPLIANT_HOLD (which suspends plans) AND ALSO attempt to create an order while patient is ACTIVE_THERAPY. We achieve the dual-failure differently: keep Patient NON_COMPLIANT_HOLD (which fails priority 5 patient-state AND priority 6 plan-state), then use a plan whose cadence is also not met."
            - "Simplification: Patient in NON_COMPLIANT_HOLD + plan SUSPENDED + cadence not met. priority 5 (patient state) beats priority 6 (plan state) beats priority 8 (cadence)."
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp9: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Nine", date_of_birth: "1977-04-22", payer_policy_id: "${pp9}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat9: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat9}", device_serial: "SN-009", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de9: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de9}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de9}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            # first dispense on 2026-08-01 so cadence clock is ticking
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat9}", component_type: "CUSHION" }
              as: OpsAdmin
              captures: { cush9: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat9}"
              payload: {}
              as: OpsAdmin
              captures: { pat9_v1: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat9}", component_supply_plan_id: "${cush9}", requested_quantity: 1, expected_patient_version: "${pat9_v1}" }
              as: IntakeCoordinator
              captures: { ro9a: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${ro9a}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${ro9a}/authorize"
              payload: { expected_patient_version: "${pat9_v1}" }
              as: BillingSpecialist
            - call: "GET /sleep-therapy/patients/${pat9}"
              payload: {}
              as: OpsAdmin
              captures: { pat9_v2: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${ro9a}/ship"
              payload: { expected_patient_version: "${pat9_v2}" }
              as: IntakeCoordinator
            # now: cush9.next_eligible_on = 2026-08-31 (cadence NOT met at 2026-08-15)
            # drive patient into NON_COMPLIANT_HOLD so plan becomes SUSPENDED
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat9}", device_enrollment_id: "${de9}", window_end_on: "2026-08-30", nights_reported: 30, compliant_nights: 5 }
              as: RespiratoryTherapist
              captures: { ar9: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar9}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar9}/finalize"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: OpsAdmin
            - call: "GET /sleep-therapy/patients/${pat9}"
              payload: {}
              as: OpsAdmin
              captures: { pat9_v3: $.data.version }
          trigger:
            # patient NON_COMPLIANT_HOLD (p5 fails), plan SUSPENDED (p6 fails), cadence not met (p8 fails)
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat9}", component_supply_plan_id: "${cush9}", requested_quantity: 1, expected_patient_version: "${pat9_v3}" }
              as: IntakeCoordinator
              captures: { dual_err: $.data.error_id }
          assert:
            - "dual-failure rejected with ${dual_err} == 'ERR_PATIENT_NOT_IN_ACTIVE_THERAPY'   # priority 5 (patient state) beats 6 (plan state) and 8 (cadence)"

      - name: sod_vs_stale_version_on_authorize
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_STALE_PATIENT_VERSION]
        distinguishing_aspect: |
          Category pair = business_safety (segregation-of-duties) vs
          business_constraint (OCC version). An authorize call where the
          authorizer equals the clinical clearer AND expected_patient_version
          is stale must surface ERR_SEGREGATION_OF_DUTIES (priority 13), not
